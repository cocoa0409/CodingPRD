  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: visit_confirm_void_conserves_account_credit_balance
        grounds:
          - state_machines.ServiceVisit.LOGGED_to_CONFIRMED
          - state_machines.ServiceVisit.CONFIRMED_to_VOIDED
          - calculations.apply_invoice
          - entities.ServiceAccount.fields.credit_balance_cents
        distinguishing_aspect: "Conserved quantity #1 = ServiceAccount.credit_balance_cents: confirming a billable visit debits 5000 (applied) from a 5000 credit (balance->0), and voiding the visit credits back exactly 5000 (balance->5000); the named global ledger is unchanged across forward+compensate."
        test_recipe:
          setup:
            - "An account pre-credited 5000 cents with an ACTIVE system; a LOGGED ad-hoc REPAIR visit billable_cents=9000."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Al Owner", email: "al@x.com" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /field-techs"
              payload: { full_name: "Bo Tech", home_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { tech_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "MUNICIPAL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: ServiceManager
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/credit"
              payload: { amount_cents: 5000 }
              as: BillingClerk
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", hardness_gpg: 15, iron_ppm: 0, tds_ppm: 200, household_size: 4 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { wt_id: $.data.id }
            - call: "POST /water-tests/${wt_id}/recommend"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /water-tests/${wt_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", source_test_id: "${wt_id}", acquisition_mode: "PURCHASE", grain_capacity: 32000 }
              as: ServiceManager
              captures: { sys_id: $.data.id }
            - call: "POST /systems/${sys_id}/install"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /systems/${sys_id}/activate"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /service-visits"
              payload: { system_id: "${sys_id}", visit_type: "REPAIR", gallons_treated_reading: 0, billable_cents: 9000 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /service-visits/${visit_id}/confirm"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { bal_after_confirm: $.data.billable_cents }
          trigger:
            - call: "POST /service-visits/${visit_id}/void"
              payload: {}
              as: ServiceManager
          assert:
            - "after confirm, ServiceAccount.${acct_id}.credit_balance_cents == 0"
            - "after void, ServiceAccount.${acct_id}.credit_balance_cents == 5000"
            - "ServiceVisit.${visit_id}.status == VOIDED"

      - name: rental_invoice_issue_void_conserves_months_billed
        grounds:
          - state_machines.Invoice.OPEN_to_VOID
          - entities.RentalContract.fields.months_billed
          - entities.Invoice.fields.invoice_kind
        distinguishing_aspect: "Conserved quantity #2 = RentalContract.months_billed (a billing-cycle counter, distinct from the credit ledger): issuing a RENTAL_CYCLE invoice increments months_billed 0->1, and voiding it decrements 1->0, leaving months_billed unchanged across forward+compensate."
        test_recipe:
          setup:
            - "An ACTIVE rental contract months_billed=0; a RENTAL_CYCLE invoice for one month is issued then voided."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ci Owner", email: "ci@x.com" }
              as: BillingClerk
              captures: { cust_id: $.data.id }
            - call: "POST /field-techs"
              payload: { full_name: "Da Tech", home_zone: "Z-NORTH" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_id: "${cust_id}", property_type: "MUNICIPAL_WHOLE_HOUSE", service_zone: "Z-NORTH" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
            - call: "POST /water-tests"
              payload: { account_id: "${acct_id}", hardness_gpg: 15, iron_ppm: 0, tds_ppm: 200, household_size: 4 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { wt_id: $.data.id }
            - call: "POST /water-tests/${wt_id}/recommend"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /water-tests/${wt_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /systems"
              payload: { account_id: "${acct_id}", source_test_id: "${wt_id}", acquisition_mode: "RENTAL", grain_capacity: 32000 }
              as: ServiceManager
              captures: { sys_id: $.data.id }
            - call: "POST /systems/${sys_id}/install"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /systems/${sys_id}/activate"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", system_id: "${sys_id}", monthly_rate_cents: 4500, term_months: 12, start_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { rc_id: $.data.id }
            - call: "POST /invoices"
              payload: { account_id: "${acct_id}", contract_id: "${rc_id}", invoice_kind: "RENTAL_CYCLE", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_id: $.data.id, months_after_issue: $.data.amount_cents }
          trigger:
            - call: "POST /invoices/${inv_id}/void"
              payload: {}
              as: BillingClerk
          assert:
            - "after issue, RentalContract.${rc_id}.months_billed == 1"
            - "after void, RentalContract.${rc_id}.months_billed == 0"
            - "Invoice.${inv_id}.status == VOID"
