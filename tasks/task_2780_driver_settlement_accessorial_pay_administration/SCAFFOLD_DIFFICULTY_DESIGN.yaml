# =============================================================================
# 1.8 Scaffold Difficulty Design - Test Targeting Index
# Domain: driver-settlement-accessorial-pay (task 2780)
# Every instance grounds in SCAFFOLD.yaml 1.1-1.7 only. 19 instances / 9 rules.
# Every numeric assert literal below was produced by executing the matching
# calculations[].formula with its declared constants.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: paid_miles_guide_variant_practical_vs_hhg
        grounds:
          - calculations.paid_miles_determination
          - calculations.linehaul_component_pay
          - entities.PayPackage.fields.mileage_guide
          - entities.Load.fields.applied_mileage_guide
          - entities.Load.fields.linehaul_line_type
          - state_machines.Load.IN_TRANSIT_to_DELIVERED
        distinguishing_aspect: |
          This variant pair lives in the LOAD-PRICING domain: the same load numbers
          (practical_miles 780, hhg_miles 742, linehaul_revenue_cents 180000) resolve to
          paid_miles 780 under a PRACTICAL package and 742 under an HHG package, which flips
          the winning linehaul leg from LINEHAUL_PER_MILE (46080) to LINEHAUL_PERCENT (45000).
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "package PKG_PRAC: LEASED_OPERATOR, mileage_guide PRACTICAL, per_diem_method NONE, escrow_required false, components PER_MILE 58 cents/mile and REVENUE_PERCENT 2500 bps"
            - "package PKG_HHG: identical to PKG_PRAC except mileage_guide HHG"
            - "driver DRV_A on PKG_PRAC and driver DRV_B on PKG_HHG, both LEASED_OPERATOR"
            - "load LOAD_A for DRV_A and load LOAD_B for DRV_B, both with practical_miles 780, hhg_miles 742, linehaul_revenue_cents 180000, both dispatched and delivered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Practical", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_prac: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_prac}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_prac}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_prac}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased HHG", driver_type: "LEASED_OPERATOR", mileage_guide: "HHG", per_diem_method: "NONE", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_hhg: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_hhg}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_hhg}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_hhg}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Aaron Practical", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_a: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_a}/assign-pay-package"
              payload: { pay_package_id: "${pkg_prac}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_a}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Bea Householder", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_b: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_b}/assign-pay-package"
              payload: { pay_package_id: "${pkg_hhg}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_b}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_a}", linehaul_revenue_cents: 180000, practical_miles: 780, hhg_miles: 742, origin_zip: "75201", dest_zip: "30303", stop_count: 1 }
              as: SettlementClerk
              captures: { load_a: $.data.id }
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_b}", linehaul_revenue_cents: 180000, practical_miles: 780, hhg_miles: 742, origin_zip: "75201", dest_zip: "30303", stop_count: 1 }
              as: SettlementClerk
              captures: { load_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads/${load_a}/dispatch"
              payload: {}
              as: SettlementClerk
            - call: "POST /driver-pay/loads/${load_b}/dispatch"
              payload: {}
              as: SettlementClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T18:00:00Z" }
              as: PayrollAdmin
          trigger:
            - call: "POST /driver-pay/loads/${load_a}/deliver"
              payload: {}
              as: SettlementClerk
              captures: { pay_a: $.data.linehaul_pay_cents }
            - call: "POST /driver-pay/loads/${load_b}/deliver"
              payload: {}
              as: SettlementClerk
              captures: { pay_b: $.data.linehaul_pay_cents }
          assert:
            - "Load.${load_a}.applied_mileage_guide == PRACTICAL"
            - "Load.${load_a}.base_guide_miles == 780 and Load.${load_a}.paid_miles == 780"
            - "Load.${load_a}.linehaul_line_type == LINEHAUL_PER_MILE"
            - "Load.${load_a}.linehaul_pay_cents == 46080"
            - "Load.${load_b}.applied_mileage_guide == HHG"
            - "Load.${load_b}.base_guide_miles == 742 and Load.${load_b}.paid_miles == 742"
            - "Load.${load_b}.linehaul_line_type == LINEHAUL_PERCENT"
            - "Load.${load_b}.linehaul_pay_cents == 45000"
            - "Load.${load_a}.short_haul_floor_applied == false and Load.${load_b}.short_haul_floor_applied == false"

      - name: per_diem_method_variant_day_based_vs_percent
        grounds:
          - calculations.per_diem_allocation
          - entities.PayPackage.fields.per_diem_method
          - entities.Settlement.fields.per_diem_non_taxable_cents
          - entities.Settlement.fields.taxable_wages_cents
          - entities.Settlement.fields.days_out_count
          - state_machines.Settlement.DRAFT_to_PREPARED
        distinguishing_aspect: |
          This variant pair lives in the WAGE-CLASSIFICATION domain, not load pricing: with an
          identical gross of 46080 and an identical two-calendar-day trip, DAY_BASED reclassifies
          13800 as non-taxable per diem (taxable 32280) while PERCENT_OF_LINEHAUL reclassifies
          12902 (taxable 33178) - the same money split differently, with net_pay_cents unchanged.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "package PKG_DAY: LEASED_OPERATOR, PRACTICAL, per_diem_method DAY_BASED, escrow_required false, PER_MILE 58 and REVENUE_PERCENT 2500 bps"
            - "package PKG_PCT: identical except per_diem_method PERCENT_OF_LINEHAUL"
            - "drivers DRV_D and DRV_P, both per_diem_elected true"
            - "one load each: practical 780, hhg 742, revenue 180000, dispatched 2026-08-03T08:00Z, delivered 2026-08-04T18:00Z (two distinct UTC dates)"
            - "one DRAFT settlement each over [2026-08-03T00:00:00Z, 2026-08-10T00:00:00Z)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Day Per Diem", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "DAY_BASED", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_day: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_day}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_day}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_day}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Percent Per Diem", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "PERCENT_OF_LINEHAUL", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_pct: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_pct}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_pct}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_pct}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Dana Daybased", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: true }
              as: PayrollAdmin
              captures: { drv_d: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_d}/assign-pay-package"
              payload: { pay_package_id: "${pkg_day}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_d}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Pat Percent", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: true }
              as: PayrollAdmin
              captures: { drv_p: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_p}/assign-pay-package"
              payload: { pay_package_id: "${pkg_pct}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_p}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_d}", linehaul_revenue_cents: 180000, practical_miles: 780, hhg_miles: 742, stop_count: 1 }
              as: SettlementClerk
              captures: { load_d: $.data.id }
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_p}", linehaul_revenue_cents: 180000, practical_miles: 780, hhg_miles: 742, stop_count: 1 }
              as: SettlementClerk
              captures: { load_p: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads/${load_d}/dispatch"
              payload: {}
              as: SettlementClerk
            - call: "POST /driver-pay/loads/${load_p}/dispatch"
              payload: {}
              as: SettlementClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T18:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads/${load_d}/deliver"
              payload: {}
              as: SettlementClerk
            - call: "POST /driver-pay/loads/${load_p}/deliver"
              payload: {}
              as: SettlementClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/settlements"
              payload: { driver_id: "${drv_d}", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z" }
              as: SettlementClerk
              captures: { stl_d: $.data.id }
            - call: "POST /driver-pay/settlements"
              payload: { driver_id: "${drv_p}", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z" }
              as: SettlementClerk
              captures: { stl_p: $.data.id }
          trigger:
            - call: "POST /driver-pay/settlements/${stl_d}/prepare"
              payload: {}
              as: SettlementClerk
              as_user_id: "clerk-01"
            - call: "POST /driver-pay/settlements/${stl_p}/prepare"
              payload: {}
              as: SettlementClerk
              as_user_id: "clerk-01"
          assert:
            - "Settlement.${stl_d}.gross_pay_cents == 46080 and Settlement.${stl_p}.gross_pay_cents == 46080"
            - "Settlement.${stl_d}.days_out_count == 2 and Settlement.${stl_p}.days_out_count == 2"
            - "Settlement.${stl_d}.per_diem_non_taxable_cents == 13800"
            - "Settlement.${stl_d}.taxable_wages_cents == 32280"
            - "Settlement.${stl_p}.per_diem_non_taxable_cents == 12902"
            - "Settlement.${stl_p}.taxable_wages_cents == 33178"
            - "Settlement.${stl_d}.per_diem_excess_taxable_cents == 0 and Settlement.${stl_p}.per_diem_excess_taxable_cents == 0"
            - "Settlement.${stl_d}.net_pay_cents == 46080 and Settlement.${stl_p}.net_pay_cents == 46080"

  - rule_id: combinatorial_formula
    instances:
      - name: linehaul_band_max_and_tie_composite
        grounds:
          - calculations.linehaul_component_pay
          - calculations.paid_miles_determination
          - entities.PayComponent.fields.rate_value
          - entities.Load.fields.linehaul_line_type
          - state_machines.Load.IN_TRANSIT_to_DELIVERED
        distinguishing_aspect: |
          Mode (a) - one output composed from four independent sub-terms: the sub-500 mile band at
          58 cents, the marginal band above 500 miles at 61 cents, the independent revenue-percentage
          leg at 2500 bps, and the max() selection whose exact tie resolves to PER_MILE. Five loads
          on one package exercise all four terms: 46080, 29000, 29061, 23200 (tie) and 25006 (percent wins).
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "package PKG_C: LEASED_OPERATOR, PRACTICAL, per_diem_method NONE, escrow_required false, PER_MILE 58 cents/mile and REVENUE_PERCENT 2500 bps"
            - "driver DRV_C assigned to PKG_C, per_diem_elected false"
            - "five loads for DRV_C: (780 mi, 180000), (500 mi, 100000), (501 mi, 100000), (400 mi, 92800), (300 mi, 100024); hhg_miles set equal to practical_miles on every load so the guide choice is not in play"
            - "all five dispatched at 2026-08-03T08:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Combinatorial", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_c: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_c}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_c}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_c}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Cal Combinatorial", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_c: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_c}/assign-pay-package"
              payload: { pay_package_id: "${pkg_c}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_c}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_c}", linehaul_revenue_cents: 180000, practical_miles: 780, hhg_miles: 780, stop_count: 1 }
              as: SettlementClerk
              captures: { ld_780: $.data.id }
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_c}", linehaul_revenue_cents: 100000, practical_miles: 500, hhg_miles: 500, stop_count: 1 }
              as: SettlementClerk
              captures: { ld_500: $.data.id }
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_c}", linehaul_revenue_cents: 100000, practical_miles: 501, hhg_miles: 501, stop_count: 1 }
              as: SettlementClerk
              captures: { ld_501: $.data.id }
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_c}", linehaul_revenue_cents: 92800, practical_miles: 400, hhg_miles: 400, stop_count: 1 }
              as: SettlementClerk
              captures: { ld_tie: $.data.id }
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_c}", linehaul_revenue_cents: 100024, practical_miles: 300, hhg_miles: 300, stop_count: 1 }
              as: SettlementClerk
              captures: { ld_pct: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads/${ld_780}/dispatch"
              payload: {}
              as: SettlementClerk
            - call: "POST /driver-pay/loads/${ld_500}/dispatch"
              payload: {}
              as: SettlementClerk
            - call: "POST /driver-pay/loads/${ld_501}/dispatch"
              payload: {}
              as: SettlementClerk
            - call: "POST /driver-pay/loads/${ld_tie}/dispatch"
              payload: {}
              as: SettlementClerk
            - call: "POST /driver-pay/loads/${ld_pct}/dispatch"
              payload: {}
              as: SettlementClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T18:00:00Z" }
              as: PayrollAdmin
          trigger:
            - call: "POST /driver-pay/loads/${ld_780}/deliver"
              payload: {}
              as: SettlementClerk
            - call: "POST /driver-pay/loads/${ld_500}/deliver"
              payload: {}
              as: SettlementClerk
            - call: "POST /driver-pay/loads/${ld_501}/deliver"
              payload: {}
              as: SettlementClerk
            - call: "POST /driver-pay/loads/${ld_tie}/deliver"
              payload: {}
              as: SettlementClerk
            - call: "POST /driver-pay/loads/${ld_pct}/deliver"
              payload: {}
              as: SettlementClerk
          assert:
            - "Load.${ld_780}.linehaul_pay_cents == 46080 and Load.${ld_780}.linehaul_line_type == LINEHAUL_PER_MILE"
            - "Load.${ld_500}.linehaul_pay_cents == 29000 and Load.${ld_500}.linehaul_line_type == LINEHAUL_PER_MILE"
            - "Load.${ld_501}.linehaul_pay_cents == 29061 and Load.${ld_501}.linehaul_line_type == LINEHAUL_PER_MILE"
            - "Load.${ld_tie}.linehaul_pay_cents == 23200 and Load.${ld_tie}.linehaul_line_type == LINEHAUL_PER_MILE"
            - "Load.${ld_pct}.linehaul_pay_cents == 25006 and Load.${ld_pct}.linehaul_line_type == LINEHAUL_PERCENT"
            - "Load.${ld_501}.linehaul_pay_cents - Load.${ld_500}.linehaul_pay_cents == 61"
            - "Load.${ld_780}.linehaul_pay_cents != 45240"

      - name: escrow_accrual_round_per_line_then_sum
        grounds:
          - calculations.escrow_accrual_deduction
          - calculations.settlement_line_generation
          - entities.Settlement.fields.escrow_deduction_cents
          - entities.SettlementLine.fields.amount_cents
          - state_machines.Settlement.DRAFT_to_PREPARED
        distinguishing_aspect: |
          Mode (b) - rounding order is the entire difficulty: three earning lines of 25006, 20006
          and 15006 accrue 8 percent escrow. Rounding each line first and summing yields exactly
          4800 (2000 + 1600 + 1200); summing the 60018 gross first and rounding once yields 4801.
          The one-cent gap is only observable because every line amount is congruent to 6 modulo 25.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "package PKG_E: LEASED_OPERATOR, PRACTICAL, per_diem_method NONE, escrow_required true, escrow_target_cents 250000, escrow_monthly_deduction_cents 40000, PER_MILE 58 and REVENUE_PERCENT 2500 bps"
            - "driver DRV_E assigned to PKG_E so escrow_status becomes COLLECTING with escrow_balance_cents 0, per_diem_elected false, no advances"
            - "three delivered loads: (300 mi, 100024), (300 mi, 80024), (250 mi, 60024) - all three win on the percentage leg, producing lines 25006, 20006 and 15006"
            - "one DRAFT settlement over [2026-08-03T00:00:00Z, 2026-08-10T00:00:00Z)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Escrow Rounding", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: true, escrow_target_cents: 250000, escrow_monthly_deduction_cents: 40000 }
              as: PayrollAdmin
              captures: { pkg_e: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_e}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_e}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_e}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Ed Escrow", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_e: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_e}/assign-pay-package"
              payload: { pay_package_id: "${pkg_e}" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_e}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_e}", linehaul_revenue_cents: 100024, practical_miles: 300, hhg_miles: 300, stop_count: 1 }
              as: SettlementClerk
