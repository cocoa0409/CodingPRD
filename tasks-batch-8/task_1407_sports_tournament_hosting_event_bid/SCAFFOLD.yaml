    side_effects: ["version +1"]
  - method: POST
    path: "/api/v1/impact-reports/{id}/revise"
    description: "Return DISPUTED report to DRAFT (revision_count +1)"
    roles: [CommissionAdmin]
    code: 200
    input: []
    output: ImpactReport
    side_effects: ["revision_count +1", "version +1"]

  # --- Settlement ---
  - method: POST
    path: "/api/v1/events/{id}/settlements"
    description: "Create the event settlement (OPEN); posture COMPLETED; one per event"
    roles: [CommissionAdmin]
    code: 201
    input: [sponsor_contributions_cents]
    output: Settlement
    side_effects: ["status OPEN", "expense_lines []"]
  - method: GET
    path: "/api/v1/events/{id}/settlements"
    description: "List settlements of an event (0 or 1), sorted created_at ASC"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Settlement[]"
    side_effects: []
  - method: GET
    path: "/api/v1/settlements/{id}"
    description: "Get one settlement"
    roles: [Any]
    code: 200
    input: []
    output: Settlement
    side_effects: []
  - method: POST
    path: "/api/v1/settlements/{id}/expense-lines"
    description: "Append an expense line while OPEN"
    roles: [CommissionAdmin]
    code: 200
    input: [category, amount_cents, description]
    output: Settlement
    side_effects: ["expense_lines appended", "expense_total_cents recomputed", "Settlement.version +1"]
  - method: POST
    path: "/api/v1/settlements/{id}/certify"
    description: "Certify expenses (OPEN -> EXPENSES_CERTIFIED); snapshots all totals"
    roles: [CommissionAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: ["certified_by_user_id set", "all computed totals snapshotted per sanction_fee/official_stipend_total/settlement_waterfall", "Settlement.version +1"]
  - method: POST
    path: "/api/v1/settlements/{id}/approve"
    description: "Approve settlement (SoD: approver != certifier); requires ACCEPTED impact report"
    roles: [CommissionAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: ["approved_by_user_id set", "Settlement.version +1"]
  - method: POST
    path: "/api/v1/settlements/{id}/pay"
    description: "Pay out (APPROVED -> PAID); cascades Event -> SETTLED and hotel blocks -> SETTLED"
    roles: [CommissionAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: ["Event COMPLETED -> SETTLED", "HotelBlocks RECONCILED -> SETTLED", "Settlement.version +1"]
  - method: POST
    path: "/api/v1/settlements/{id}/dispute"
    description: "Dispute a certified settlement (EXPENSES_CERTIFIED -> DISPUTED)"
    roles: [CommissionAdmin, CvbAuditor]
    code: 200
    input: [dispute_reason]
    output: Settlement
    side_effects: ["Settlement.version +1"]
  - method: POST
    path: "/api/v1/settlements/{id}/reopen"
    description: "Reopen a disputed settlement (DISPUTED -> OPEN)"
    roles: [CommissionAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: ["certified_by_user_id cleared", "Settlement.version +1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID missing or role unknown" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or entity-backed ownership scope violated (e.g. TeamRep acting on another team, HotelManager on another block)" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties breached: settlement approver == certifier, requirement verifier == evidence submitter, or impact auditor == report creator" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body resource reference does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, malformed value, invalid enum member, out-of-range number, or inverted dates" }
  - { id: ERR_EVENT_POSTURE_FORBIDS, http: 409, condition: "Event.posture does not permit this operation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity is not in a state that permits this transition (generic)" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Target entity is in a terminal state; no further transitions" }
  - { id: ERR_BID_NOT_EDITABLE, http: 409, condition: "Bid is not DRAFT or REVISION_REQUESTED; requirements/evidence/notes locked" }
  - { id: ERR_BID_ALREADY_ACTIVE, http: 409, condition: "Event already has a non-terminal bid in SUBMITTED/UNDER_REVIEW/REVISION_REQUESTED (only a DRAFT bid is superseded)" }
  - { id: ERR_BID_REQUIREMENTS_INCOMPLETE, http: 409, condition: "Mandatory requirement not VERIFIED, or some requirement neither VERIFIED nor WAIVED, at submit" }
  - { id: ERR_BID_SCORE_BELOW_THRESHOLD, http: 409, condition: "review_score < 80 at award decision" }
  - { id: ERR_REQUIREMENT_NOT_WAIVABLE, http: 409, condition: "Waive attempted on a mandatory requirement" }
  - { id: ERR_REQUIREMENT_NOT_REVIEWABLE, http: 409, condition: "Verify attempted on a requirement not EVIDENCE_SUBMITTED, or waive on one not PENDING" }
  - { id: ERR_DIVISION_NOT_OPEN, http: 409, condition: "Division is not OPEN for this team operation (or not in the state the division endpoint requires)" }
  - { id: ERR_DIVISION_BELOW_MIN_TEAMS, http: 409, condition: "eligible_team_count < min_teams at lock-seeding" }
  - { id: ERR_ROSTER_TOO_SMALL, http: 422, condition: "roster_player_count < 7" }
  - { id: ERR_MATCH_TEAMS_INCOMPLETE, http: 409, condition: "Schedule attempted while home_team_id or away_team_id is null" }
  - { id: ERR_MATCH_NOT_SCHEDULABLE, http: 409, condition: "Match not PENDING_TEAMS for schedule (or division not BRACKET_PUBLISHED)" }
  - { id: ERR_MATCH_NOT_RESCHEDULABLE, http: 409, condition: "Match not RESCHEDULE_QUEUE for reschedule" }
  - { id: ERR_RESCHEDULE_ORDER_VIOLATION, http: 409, condition: "An earlier RESCHEDULE_QUEUE match (round ASC, original_scheduled_start ASC, created_at ASC) in the same division is still queued" }
  - { id: ERR_TIE_NOT_ALLOWED, http: 422, condition: "home_score == away_score at finalize" }
  - { id: ERR_SCORE_INVALID, http: 422, condition: "Negative score at finalize/forfeit" }
  - { id: ERR_FIELD_TIME_CONFLICT, http: 409, condition: "Half-open window overlaps another SCHEDULED/IN_PROGRESS match on the same field" }
  - { id: ERR_FIELD_BLACKED_OUT, http: 409, condition: "Field is BLACKED_OUT" }
  - { id: ERR_FIELD_NO_LIGHTS, http: 409, condition: "Match starts at/after 18:00 on a field without lights" }
  - { id: ERR_MATCH_OUTSIDE_EVENT_DATES, http: 422, condition: "Scheduled date outside [event.starts_on, event.ends_on]" }
  - { id: ERR_OFFICIAL_NOT_ACTIVE, http: 409, condition: "Official is not ACTIVE" }
  - { id: ERR_CERTIFICATION_INSUFFICIENT, http: 409, condition: "Certification level insufficient for slot_role/round (final-round CREW_CHIEF requires NATIONAL; TRAINEE only ASSISTANT)" }
  - { id: ERR_OFFICIAL_WINDOW_CONFLICT, http: 409, condition: "Match window (expanded by the 30-minute turnover buffer) intersects another ACCEPTED/WORKED assignment of the official" }
  - { id: ERR_OFFICIAL_DAILY_LIMIT, http: 409, condition: "Official already has game_limit_per_day ACCEPTED/WORKED assignments on that UTC date" }
  - { id: ERR_DUPLICATE_ASSIGNMENT, http: 409, condition: "Same official already has a non-terminal assignment on this match, or CREW_CHIEF slot already filled" }
  - { id: ERR_BLOCK_NOT_CONTRACTED, http: 409, condition: "Hotel block not in CONTRACTED status for booking/confirm, or not NEGOTIATING for PATCH" }
  - { id: ERR_BLOCK_NOT_RECONCILABLE, http: 409, condition: "Hotel block not CUTOFF_PASSED for reconcile, or settlement certify attempted with a block outside {RECONCILED, SETTLED, RELEASED}" }
  - { id: ERR_BLOCK_INVENTORY_EXCEEDED, http: 409, condition: "Per-night aggregate occupancy would exceed contracted_rooms_per_night" }
  - { id: ERR_BOOKING_OUTSIDE_BLOCK_DATES, http: 422, condition: "Booking nights outside [block_start_date, block_end_date)" }
  - { id: ERR_CUTOFF_PASSED, http: 409, condition: "Booking create after cutoff_date, or close-cutoff before cutoff_date has passed" }
  - { id: ERR_BACKGROUND_CHECK_REQUIRED, http: 409, condition: "Volunteer approval attempted with background_check_cleared false" }
  - { id: ERR_SHIFT_NOT_OPEN, http: 409, condition: "Shift not OPEN for signup, or not OPEN/FILLED for confirm/complete/cancel" }
  - { id: ERR_SHIFT_FULL, http: 409, condition: "Shift at capacity (signup create: non-cancelled count >= capacity; confirm: confirmed_count >= capacity)" }
  - { id: ERR_SHIFT_WINDOW_OVERLAP, http: 409, condition: "Volunteer holds a SIGNED_UP/CONFIRMED signup on an overlapping shift window" }
  - { id: ERR_SHIFT_TIME_INVALID, http: 422, condition: "ends_at <= starts_at at create, or complete/no-show attempted before window end" }
  - { id: ERR_CROSS_EVENT_REFERENCE, http: 409, condition: "Referenced field/team/official/volunteer belongs to a different event" }
  - { id: ERR_VENUE_HAS_ACTIVE_MATCHES, http: 409, condition: "Venue release blocked by matches in {SCHEDULED, WEATHER_DELAYED, RESCHEDULE_QUEUE, IN_PROGRESS} on its fields" }
  - { id: ERR_SETTLEMENT_EXISTS, http: 409, condition: "Event already has a Settlement" }
  - { id: ERR_IMPACT_REPORT_NOT_ACCEPTED, http: 409, condition: "Settlement approve requires an ACCEPTED ImpactReport for the event" }
  - { id: ERR_ALERT_WINDOW_INVALID, http: 422, condition: "window_end <= window_start" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CommissionAdmin
    description: "Sports commission operations staff; drives the full lifecycle"
    identity: opaque
    exclusive_operations:
      - "Event create + posture advances; clock set"
      - "Bid create/patch/submit/withdraw; requirement create + evidence"
      - "Venue create/contract/release; hotel block create/patch/contract/close-cutoff"
      - "Division create/lock-seeding/publish-bracket; team create/verify-eligibility/disqualify"
      - "Match schedule/reschedule/start/finalize/forfeit; assignment create/release/complete"
      - "Official register/transition; volunteer register/patch/transition; shift create/cancel/complete; signup confirm/mark-no-show"
      - "Weather alert create/activate/resolve; impact report create/submit/revise; settlement create/expense-lines/certify/approve/pay/reopen"
    shared_operations:
      - "field create/blackout/unblackout (with VenueManager)"
      - "booking create + transition (with TeamRep/Official/HotelManager)"
      - "signup create/cancel (with Volunteer)"
      - "team check-in/withdraw (with TeamRep)"
      - "block reconcile (with HotelManager)"
      - "settlement dispute (with CvbAuditor)"
  - name: SanctioningReviewer
    description: "Sanctioning body reviewer; evaluates bids"
    identity: opaque
    exclusive_operations:
      - "bid review/request-revision/decide"
      - "requirement verify/waive (SoD: cannot verify own-submitted evidence)"
    shared_operations: []
  - name: CvbAuditor
    description: "Convention & visitors bureau auditor"
    identity: opaque
    exclusive_operations:
      - "impact report audit + audit-decision (SoD: cannot audit own-created report)"
    shared_operations:
      - "settlement dispute (with CommissionAdmin)"
  - name: TeamRep
    description: "Team representative; X-User-ID equals the Team id they represent"
    identity: "entity_backed:Team"
    exclusive_operations:
      - "team roster submission (own team)"
    shared_operations:
      - "team check-in/withdraw (own team; shared with CommissionAdmin)"
      - "room booking create with booker_type=TEAM and CANCEL (own team bookings)"
  - name: Official
    description: "Match official; X-User-ID equals the Official id"
    identity: "entity_backed:Official"
    exclusive_operations:
      - "assignment respond (own assignments)"
    shared_operations:
      - "room booking create with booker_type=OFFICIAL and CANCEL (own bookings)"
  - name: Volunteer
    description: "Event volunteer; X-User-ID equals the Volunteer id"
    identity: "entity_backed:Volunteer"
    exclusive_operations: []
    shared_operations:
      - "shift signup create/cancel (own signups; shared with CommissionAdmin)"
  - name: HotelManager
    description: "Hotel block operator; X-User-ID equals the HotelBlock id they operate"
    identity: "entity_backed:HotelBlock"
    exclusive_operations: []
    shared_operations:
      - "booking transition CONFIRM/CHECK_IN/CHECK_OUT/NO_SHOW/CANCEL on own block (with CommissionAdmin)"
      - "block reconcile (own block; with CommissionAdmin)"
  - name: VenueManager
    description: "Venue operator; X-User-ID equals the Venue id they operate"
    identity: "entity_backed:Venue"
    exclusive_operations: []
    shared_operations:
      - "field create/blackout/unblackout on own venue (with CommissionAdmin)"
  - name: Any
    description: "Any authenticated caller; read-only access to all GET endpoints"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "all GET endpoints (single-resource, list, filtered list, summary)"
