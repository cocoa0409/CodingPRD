            - "RouteDay.${day_id}.delivered_cases == 50 (day recompute caused by the lot mutation — hop 2)"
            - "RouteSettlement.${settlement_id}.gross_delivered_cents == 25000 (settlement recompute caused by the day mutation — hop 3)"
            - "RouteSettlement.${settlement_id}.chronological_expected_cents == 25000 and forward_expected_cents == 25000"

