  # ==========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: single_open_cycle_capacity_conflict
        grounds:
          - validations[priority=13]
          - state_machines.SurveyCycle.CONFIGURED_to_OPEN
        distinguishing_aspect: |
          Interval semantics: aggregate capacity — the OPEN "slot" is a single
          occupancy resource, independent of whether the two cycles' time
          windows even overlap. Opening cycle B while cycle A is OPEN is
          rejected with ERR_CYCLE_ALREADY_OPEN regardless of B's own window.
