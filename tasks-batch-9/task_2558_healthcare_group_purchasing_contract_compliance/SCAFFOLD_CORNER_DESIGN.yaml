        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: compliance_preliminary_versus_final_same_period
          rationale: "Variant divergence is the core of that §1.8 instance: the same period is measured PRELIMINARY and then FINAL over one LOADED and one PARTIALLY_LOADED file, so both variants and their delta are already pinned."

  - section: consistency_model
    instances:
      - name: distribute_response_and_member_read_agree_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.distribution_holdback
          - calculations.distribution_waterfall
          - entities.Member.fields.fee_credit_balance_cents
        distinguishing_aspect: "Nothing in this domain is denormalized-and-lagging: the two deepest cascades in it — the file load, which walks classification to commitment ledgers to leakage flag to member watchlist, and the distribute, which walks accrual to holdback to member pool to per-member credit — must be fully visible to the very next read, and the writing response must already carry the same numbers that a later GET reports. This instance reads every touched aggregate immediately after each cascade and requires byte-equal agreement, so an implementation that defers any recompute to a background pass or recomputes it differently on read is caught."
        test_recipe:
          setup: ["ACTIVE contract C-CS on the ACCRUAL basis with admin_fee_bps 300, member_share_bps 6000 and holdback_tiers [{0 -> 0 bps}, {50000 -> 100 bps}]; item V-1 at base 10000 with TIER_0 discount 0; a single member M-1 with a countersigned ACTIVE commitment, an APPROVED cross-reference and an ACTIVE TIER_PRICE activation for August."]
