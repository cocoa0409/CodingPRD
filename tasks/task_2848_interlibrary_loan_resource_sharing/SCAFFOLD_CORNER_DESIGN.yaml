              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { r5: $.data.id, r5_status: $.data.status }
          trigger:
            - call: "GET /ill/copyright-usage"
              payload: { issn: "2211-0007", calendar_year: 2026 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { used_2026_a: $.data.counted_fill_count, free_2026_a: $.data.free_fills_remaining }
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_id}", rota_id: "${rota_id}", service_type: "COPY", delivery_mode: "ELECTRONIC", needed_by: "2026-08-25T00:00:00Z", max_supply_fee_cents: 5000, pages_requested: 10 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { r6: $.data.id, r6_status: $.data.status }
            - call: "GET /ill/copyright-usage"
              payload: { issn: "2211-0007", calendar_year: 2026 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { used_2026_b: $.data.counted_fill_count, free_2026_b: $.data.free_fills_remaining }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_id}", rota_id: "${rota_id}", service_type: "COPY", delivery_mode: "ELECTRONIC", needed_by: "2027-01-20T00:00:00Z", max_supply_fee_cents: 5000, pages_requested: 10 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { r7: $.data.id, r7_status: $.data.status }
            - call: "GET /ill/requests/${r7}/copyright-clearances"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { c7_method: "$.data[0].method", c7_year: "$.data[0].calendar_year", c7_seq: "$.data[0].sequence_in_year" }
            - call: "GET /ill/copyright-usage"
              payload: { issn: "2211-0007", calendar_year: 2027 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { used_2027: $.data.counted_fill_count, free_2027: $.data.free_fills_remaining }
            - call: "GET /ill/copyright-usage"
              payload: { issn: "2211-0007", calendar_year: 2026 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { used_2026_c: $.data.counted_fill_count, free_2026_c: $.data.free_fills_remaining }
          assert:
            - "${r5_status} == SOURCING — the fifth fill is the last one inside COPYRIGHT_LIMIT_FREE_FILLS"
            - "${used_2026_a} == 5 and ${free_2026_a} == 0 — the cumulative counter sits exactly on the threshold"
            - "${r6_status} == COPYRIGHT_HOLD — the sixth intake crosses the threshold and parks, and GET /ill/requests/${r6}/copyright-clearances returns an empty array with total_count 0"
            - "${used_2026_b} == 5 and ${free_2026_b} == 0 — the parked sixth request did not consume or create an allowance"
            - "${r7_status} == SOURCING — one instant into 2027 the same journal admits a free fill again, with no write of any kind having reset a counter"
            - "${c7_method} == CONTU_FREE, ${c7_year} == 2027 and ${c7_seq} == 1 — the sequence restarts at one in the new year"
            - "${used_2027} == 1 and ${free_2027} == 4"
            - "${used_2026_c} == 5 and ${free_2026_c} == 0 — the 2026 register is unchanged by the 2027 fill, so the two years are independent buckets rather than one rolling balance"
            - "IllRequest ${r6} is still in COPYRIGHT_HOLD after the year rolls over — the roll-over grants new allowance to new intakes and does not retroactively release a parked one"

      - name: partner_balance_fields_are_recomputed_on_every_write_that_moves_their_source_rows
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Partner.fields.lend_receivable_cents
          - entities.Partner.fields.lent_to_count
          - entities.Partner.fields.net_borrow_imbalance_items
          - endpoints[POST /ill/lending-charges]
          - endpoints[POST /ill/invoices/{id}/issue]
          - calculations.partner_invoice_reconciliation
        distinguishing_aspect: "Two derived fields with different source predicates are tracked across the same three writes: lent_to_count counts every LendingCharge regardless of status while lend_receivable_cents sums only the OPEN ones, so issuing the invoice moves one field to zero and leaves the other untouched — a single shared recompute would move both."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, later advanced to 2026-09-01T00:00:00Z."
            - "One partner with all balance counters at their zero defaults and no requests of any kind."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { partner_id: $.data.id, recv0: $.data.lend_receivable_cents, lent0: $.data.lent_to_count, imb0: $.data.net_borrow_imbalance_items }
          trigger:
            - call: "POST /ill/lending-charges"
              payload: { partner_id: "${partner_id}", item_title: "Outbound lend, volume 1", service_type: "LOAN", charge_cents: 1200, incurred_at: "2026-08-03T00:00:00Z" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { c1: $.data.id, c1_status: $.data.status }
            - call: "GET /ill/partners/${partner_id}"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { recv1: $.data.lend_receivable_cents, lent1: $.data.lent_to_count, imb1: $.data.net_borrow_imbalance_items }
            - call: "POST /ill/lending-charges"
              payload: { partner_id: "${partner_id}", item_title: "Outbound lend, volume 2", service_type: "COPY", charge_cents: 2000, incurred_at: "2026-08-07T00:00:00Z" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { c2: $.data.id }
            - call: "GET /ill/partners/${partner_id}"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { recv2: $.data.lend_receivable_cents, lent2: $.data.lent_to_count, imb2: $.data.net_borrow_imbalance_items, p_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/partners/${partner_id}/invoices"
              payload: { expected_partner_version: "${p_v1}", period_month: "2026-08" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { inv_id: $.data.id, inv_recv: $.data.receivable_total_cents, inv_lines: $.data.lend_line_count }
            - call: "GET /ill/partners/${partner_id}"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { recv3: $.data.lend_receivable_cents, lent3: $.data.lent_to_count }
            - call: "POST /ill/invoices/${inv_id}/issue"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { inv_status: $.data.status }
            - call: "GET /ill/partners/${partner_id}"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { recv4: $.data.lend_receivable_cents, lent4: $.data.lent_to_count, imb4: $.data.net_borrow_imbalance_items }
            - call: "GET /ill/partners/${partner_id}/lending-charges"
              payload: { status: "INVOICED" }
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { line1_status: "$.data[0].status" }
          assert:
            - "${recv0} == 0, ${lent0} == 0 and ${imb0} == 0 — the derived fields start from their declared defaults"
            - "${c1_status} == OPEN, ${recv1} == 1200, ${lent1} == 1 and ${imb1} == -1 — one lend and no borrows leaves the imbalance negative"
            - "${recv2} == 3200, ${lent2} == 2 and ${imb2} == -2 — the second charge is added at face value, not surcharged"
            - "${inv_recv} == 3440 and ${inv_lines} == 2 — the invoice surcharges each line before summing, 1200 -> 1290 and 2000 -> 2150, so the invoice total deliberately differs from the 3200 carried on the partner"
            - "${recv3} == 3200 and ${lent3} == 2 — drafting the invoice does not move either derived field; only the issue step does"
            - "${inv_status} == ISSUED and ${line1_status} == INVOICED"
            - "${recv4} == 0 — no OPEN LendingCharge remains, so the receivable collapses to zero"
            - "${lent4} == 2 and ${imb4} == -2 — the count and the imbalance are status-blind and survive the issue untouched"
            - "GET /ill/partners/${partner_id}/lending-charges?status=OPEN returns an empty array with total_count 0, and the two rows ${c1} and ${c2} are both still readable"
            - "§1.5 exposes no delete endpoint for any entity, so the source-removal half of this claim is carried by the two §1.8 compensating_invariant instances, which retire source rows by cancellation instead"

