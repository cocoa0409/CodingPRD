  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: contract_negotiation_cycle_capped_at_three_rounds
        grounds:
          - state_machines.SupplierContract.SENT_to_COUNTERED
          - state_machines.SupplierContract.COUNTERED_to_SENT
          - entities.SupplierContract.fields.round_count
          - validations[priority=33]
          - errors[ERR_NEGOTIATION_ROUNDS_EXHAUSTED]
        distinguishing_aspect: |
          SENT -> COUNTERED -> SENT is a genuine cycle that the same entity traverses three times, and the
          cycle is terminated by a counter kept on the entity itself: the fourth send is rejected with
          ERR_NEGOTIATION_ROUNDS_EXHAUSTED while round_count stays at 3 and the contract stays COUNTERED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; APPROVED Supplier; Program 2026-09-10..2026-09-14."
            - "One SupplierContract driven through three full send/counter rounds so round_count == 3 and status == COUNTERED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Metro Motorcoach Co", supplier_type: "TRANSPORT", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
