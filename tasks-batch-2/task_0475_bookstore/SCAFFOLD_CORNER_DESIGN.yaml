            - call: "POST /author-events"
              payload: { title_id: "${t_id}", name: "E", starts_at: "2026-09-01T18:00:00Z", capacity: 5, base_price_cents: 2000 }
              as: Bookseller
              captures: { e_id: $.data.id }
            - call: "POST /author-events/${e_id}/tickets"
