            - call: "POST /hie/participants/${pE3_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
            - call: "POST /hie/participants/${pE3_id}/patient-records"
              payload: { source_mrn: "E3-0001", given_name: "Lorcan", family_name: "Delacroix", birth_date: "1990-07-30", sex: "M", ssn_last4: "1188", postal_code: "70118", phone_digits: "5045550125" }
              as: HieAdmin
              captures: { recE3_id: $.data.id, clusterE3_id: $.data.cluster_id }
          trigger:
            - call: "POST /hie/participants/${pE3_id}/notification-subscriptions"
              payload: { subscription_scope: "CLUSTER", event_types: ["ADMISSION", "DISCHARGE", "TRANSFER"], delivery_endpoint_url: "https://kestrelpoint.example/adt", cluster_id: "00000000-0000-4000-8000-0000000000e3" }
              as: HieAdmin
              captures: { errE3_a: $.data.error_id }
            - call: "POST /hie/participants/00000000-0000-4000-8000-0000000000e4/notification-subscriptions"
              payload: { subscription_scope: "CLUSTER", event_types: ["ADMISSION"], delivery_endpoint_url: "https://kestrelpoint.example/adt", cluster_id: "${clusterE3_id}" }
              as: HieAdmin
              captures: { errE3_b: $.data.error_id }
            - call: "POST /hie/participants/${pE3_id}/notification-subscriptions"
              payload: { subscription_scope: "CLUSTER", event_types: ["ADMISSION", "DISCHARGE", "TRANSFER"], delivery_endpoint_url: "https://kestrelpoint.example/adt", cluster_id: "${clusterE3_id}" }
              as: HieAdmin
              captures: { subE3_id: $.data.id, subE3_status: $.data.status, subE3_cluster: $.data.cluster_id, subE3_subscriber: $.data.subscriber_participant_id, subE3_events: $.data.event_types, subE3_activating: $.data.activating_conformance_test_id }
            - call: "GET /hie/notification-subscriptions"
