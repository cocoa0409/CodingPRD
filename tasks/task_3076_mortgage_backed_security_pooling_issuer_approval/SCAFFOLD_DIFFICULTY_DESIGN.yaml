          - "after reimburse: LiquidityAdvance.${adv_id}.status == REIMBURSED and Issuer.${iss_id}.advance_obligation_cents == 0"
          - "global open-advance cents returned to exactly the pre-settle value (0 + 7500 - 7500 == 0) — no drift across the round trip"

