scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    rule_summary: "Two calculations in unrelated domains each exist in two variants that must diverge on the same underlying data: lot yield (provisional from milled volume, final from grade-credited volume) and warranty liability (estimated at intake, adjudicated at decision)."
    instances:
      - name: lot_yield_provisional_vs_final_diverge
        summary: "The same flooring lot reports provisional_yield_pct 78.00 from milling and final_yield_pct 66.17 from grading; the yield-summary read exposes both plus an 11.83 pp delta."
        mechanism: "provisional variant = net_flooring_bf / input_dry_bf; final variant = credited_board_feet / input_dry_bf, where credit factors discount SELECT, NO1_COMMON and CHARACTER board feet."
        entities_touched: [FlooringLot, GradeRun, GradeBundle]
        rules_referenced: [lot_yield_dual_variant, grade_tally_valuation]
        test_recipe:
          setup: "Red oak DENSE profile, 1.00 in schedule (265.0 h), one chamber, one charge loaded with 9700 accepted green board feet at weighted 45.2 pct, released on a passing stress test (dry_bf_out 8972.50). A SOLID product line milled into a 6000 bf lot, then graded with four bundles under the MILL_CHARACTER ruleset."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id", species_v: "$.data.version" } }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${species_id}", schedule_code: "RO-100", thickness_in: 1.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${species_v}" }, as: MillAdmin, captures: { sched_id: "$.data.id" } }
            - { call: "POST /mill/kiln-chambers", payload: { chamber_code: "K1", capacity_board_feet: 12000 }, as: MillAdmin, captures: { chamber_id: "$.data.id" } }
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-08-05T00:00:00.000Z" }, as: KilnOperator, captures: { charge_a: "$.data.id" } }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "FAS", moisture_pct_at_receipt: 46.0 }, as: ProcurementClerk, captures: { r1: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r1}/accept", payload: { accepted_board_feet: 5800 }, as: ProcurementClerk }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 4000, receipt_grade: "SELECT", moisture_pct_at_receipt: 44.0 }, as: ProcurementClerk, captures: { r2: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r2}/accept", payload: { accepted_board_feet: 3900 }, as: ProcurementClerk }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r1}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r2}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/load", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/start_drying", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/begin_conditioning", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/record_stress_test", payload: { shell_moisture_pct: 6.4, core_moisture_pct: 8.2 }, as: KilnOperator }
            - { call: "POST /mill/product-lines", payload: { line_code: "SOLID-RO-325", species_profile_id: "${species_id}", construction_type: "SOLID", nominal_width_in: 3.250, nominal_thickness_in: 0.750, material_value_cents_per_sf: 895, warranty_funded_total_cents: 600000 }, as: MillAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /mill/flooring-lots", payload: { product_line_id: "${line_id}", kiln_charge_id: "${charge_a}", input_dry_bf: 6000 }, as: MillSupervisor, captures: { lot_id: "$.data.id" } }
            - { call: "POST /mill/flooring-lots/${lot_id}/complete_milling", payload: { actual_milled_width_in: 3.190, net_flooring_bf: 4680, shorts_bf: 180, sawdust_tons: 1.20, shavings_tons: 0.80 }, as: MillSupervisor, captures: { lot_v2: "$.data.version" } }
            - { call: "POST /mill/grade-runs", payload: { flooring_lot_id: "${lot_id}", inspector_ruleset: "MILL_CHARACTER", expected_lot_version: "${lot_v2}" }, as: GradeInspector, captures: { run_id: "$.data.id" } }
            - { call: "POST /mill/grade-runs/${run_id}/bundles", payload: { grade_class: "CLEAR", bundle_board_feet: 1187.25, average_length_in: 50 }, as: GradeInspector }
            - { call: "POST /mill/grade-runs/${run_id}/bundles", payload: { grade_class: "SELECT", bundle_board_feet: 1502.60, average_length_in: 36 }, as: GradeInspector }
            - { call: "POST /mill/grade-runs/${run_id}/bundles", payload: { grade_class: "NO1_COMMON", bundle_board_feet: 1098.45, average_length_in: 30 }, as: GradeInspector }
            - { call: "POST /mill/grade-runs/${run_id}/bundles", payload: { grade_class: "CHARACTER", bundle_board_feet: 703.10, average_length_in: 20 }, as: GradeInspector }
            - { call: "POST /mill/grade-runs/${run_id}/finalize", payload: {}, as: GradeInspector }
          trigger:
            - { call: "POST /mill/flooring-lots/${lot_id}/finalize", payload: { grade_run_id: "${run_id}" }, as: MillSupervisor }
            - { call: "GET /mill/flooring-lots/${lot_id}/yield-summary", payload: {}, as: MillSupervisor }
          assert:
            - "The finalize response has status 200 with data.status == \"GRADED\"."
            - "data.provisional_yield_pct == 78.00 (4680 / 6000), unchanged by grading."
            - "data.final_yield_pct == 66.17 (3970.2625 / 6000 rounded ROUND_HALF_UP to 2 places)."
            - "The yield-summary response has data.provisional_yield_pct == 78.00, data.final_yield_pct == 66.17, data.yield_delta_pp == 11.83 and data.yield_floor_pct == 55.00."
            - "The two variants are not equal: the provisional variant ignores grade credit entirely."

      - name: warranty_liability_estimated_vs_adjudicated_diverge
        summary: "One claim carries estimated_liability_cents 355104 from intake figures and adjudicated_liability_cents 151474 after inspection, depreciation and the responsibility split."
        mechanism: "estimated variant stops after the administrative loading (steps 1-4); adjudicated variant continues through age depreciation (step 5) and the mill responsibility share (step 6) on inspector-verified area."
        entities_touched: [WarrantyClaim, ProductLine]
        rules_referenced: [warranty_liability_dual_variant, responsibility_split]
        test_recipe:
          setup: "A SOLID red oak line with material value 895 c/sf and a 600000 cent reserve. A claim for 240 sq ft installed 2026-03-15 with subfloor moisture 10.5 pct and ambient RH 62 pct, submitted by user u_intake. Logical clock 2026-08-20."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-20T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
            - { call: "POST /mill/product-lines", payload: { line_code: "SOLID-RO-325", species_profile_id: "${species_id}", construction_type: "SOLID", nominal_width_in: 3.250, nominal_thickness_in: 0.750, material_value_cents_per_sf: 895, warranty_funded_total_cents: 600000 }, as: MillAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "CUPPING", affected_square_feet: 240, installation_date: "2026-03-15", subfloor_moisture_pct_at_install: 10.5, ambient_rh_pct_at_install: 62 }, as: WarrantyAdjudicator, as_user_id: "u_intake", captures: { claim_id: "$.data.id", estimated: "$.data.estimated_liability_cents" } }
          trigger:
            - { call: "POST /mill/warranty-claims/${claim_id}/adjudicate", payload: { decision: "APPROVED", adjudicated_affected_sf: 210, adjudicated_subfloor_moisture_pct: 10.5, adjudicated_ambient_rh_pct: 62 }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
          assert:
            - "The claim created in setup had data.estimated_liability_cents == 355104 (base 328800 = 240 * (895 + 475); admin 26304 = 8 pct)."
            - "The adjudicate response has status 200 with data.adjudication_status == \"APPROVED\"."
            - "data.installer_share_pct == 50 and data.mill_share_pct == 50 (mc_delta 3.5 against the species target 7.0 gives tier 40, plus 10 for RH 62 outside [30, 50])."
            - "data.service_months == 5 and data.depreciation_pct == 2.5."
            - "data.adjudicated_liability_cents == 151474 while data.estimated_liability_cents remains 355104."
            - "GET /mill/product-lines/{line_id} shows warranty_balance_cents == 448526 and warranty_committed_cents == 151474: only the adjudicated variant touches the reserve."

  - rule_id: combinatorial_formula
    rule_summary: "Three formulas whose result depends on the interaction of independent axes: kiln duration (density class x thickness tier x moisture drop x fixed legs), grade tally value (grade price x length factor x per-bundle rounding order), and warranty liability (area x material value x admin tier x depreciation x share) with a pinned six-step order."
    instances:
      - name: kiln_schedule_duration_across_density_thickness_and_moisture_axes
        summary: "The same conditioning and stress relief legs produce 265.0 h for DENSE at 1.00 in and 278.2 h for MEDIUM at 1.25 in, because the density base, per-point rate and thickness tier multiply differently."
        mechanism: "(SPECIES_BASE_HOURS[density] + MC_HOURS_PER_POINT[density] * moisture_drop) * THICKNESS_TIER_FACTOR[thickness] + conditioning + stress relief, then ROUND_HALF_UP to 1 place and clamp."
        entities_touched: [SpeciesProfile, DryingSchedule]
        rules_referenced: [kiln_schedule_duration]
        test_recipe:
          setup: "Two species profiles: RED_OAK DENSE and HARD_MAPLE MEDIUM. The same moisture drop of 38.0 points and the same 24 h conditioning plus 12 h stress relief legs are used for both schedules; only density class and thickness differ."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { oak_id: "$.data.id", oak_v: "$.data.version" } }
            - { call: "POST /mill/species-profiles", payload: { species_code: "HARD_MAPLE", common_name: "Hard Maple", density_class: "MEDIUM", tangential_shrinkage_coefficient: 0.135, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { maple_id: "$.data.id", maple_v: "$.data.version" } }
          trigger:
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${oak_id}", schedule_code: "RO-100", thickness_in: 1.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${oak_v}" }, as: MillAdmin }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${maple_id}", schedule_code: "HM-125", thickness_in: 1.25, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${maple_v}" }, as: MillAdmin }
          assert:
            - "The RED_OAK schedule response has status 201 with data.planned_dry_hours == 265.0 ((96 + 3.5 * 38.0) * 1.00 + 36)."
            - "The HARD_MAPLE schedule response has status 201 with data.planned_dry_hours == 278.2 ((72 + 2.5 * 38.0) * 1.45 = 242.15, plus 36 = 278.15, ROUND_HALF_UP to 278.2)."
            - "Neither result can be obtained by scaling the other: swapping only thickness or only density changes the answer through a different factor."
            - "The 278.15 -> 278.2 step also pins ROUND_HALF_UP rather than banker's rounding, which would give 278.1."

      - name: grade_tally_per_bundle_rounding_order_changes_total
        summary: "A four-bundle grade run totals 2168327 cents because each bundle is rounded to whole cents before summing; summing the unrounded bundle values and rounding once yields 2168326."
        mechanism: "bundle value = board feet x grade price x length factor, ROUND_HALF_UP to whole cents per bundle; the run total is the exact integer sum of those rounded bundle values."
        entities_touched: [GradeRun, GradeBundle, FlooringLot]
        rules_referenced: [grade_tally_valuation]
        test_recipe:
          setup: "A milled 6000 bf lot with 4680 net flooring bf, graded under MILL_CHARACTER with bundles chosen so that three of the four bundle values carry fractional cents (0.8, 0.75 and 0.52)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id", species_v: "$.data.version" } }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${species_id}", schedule_code: "RO-100", thickness_in: 1.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${species_v}" }, as: MillAdmin, captures: { sched_id: "$.data.id" } }
            - { call: "POST /mill/kiln-chambers", payload: { chamber_code: "K1", capacity_board_feet: 12000 }, as: MillAdmin, captures: { chamber_id: "$.data.id" } }
            - { call: "POST /mill/kiln-charges", payload: { drying_schedule_id: "${sched_id}", kiln_chamber_id: "${chamber_id}", planned_start_utc: "2026-08-05T00:00:00.000Z" }, as: KilnOperator, captures: { charge_a: "$.data.id" } }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 6000, receipt_grade: "FAS", moisture_pct_at_receipt: 46.0 }, as: ProcurementClerk, captures: { r1: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r1}/accept", payload: { accepted_board_feet: 5800 }, as: ProcurementClerk }
            - { call: "POST /mill/green-receipts", payload: { species_profile_id: "${species_id}", supplier_name: "Ridgeline Logging", received_board_feet: 4000, receipt_grade: "SELECT", moisture_pct_at_receipt: 44.0 }, as: ProcurementClerk, captures: { r2: "$.data.id" } }
            - { call: "POST /mill/green-receipts/${r2}/accept", payload: { accepted_board_feet: 3900 }, as: ProcurementClerk }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r1}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/allocate_receipt", payload: { green_receipt_id: "${r2}" }, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/load", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/start_drying", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/begin_conditioning", payload: {}, as: KilnOperator }
            - { call: "POST /mill/kiln-charges/${charge_a}/record_stress_test", payload: { shell_moisture_pct: 6.4, core_moisture_pct: 8.2 }, as: KilnOperator }
            - { call: "POST /mill/product-lines", payload: { line_code: "SOLID-RO-325", species_profile_id: "${species_id}", construction_type: "SOLID", nominal_width_in: 3.250, nominal_thickness_in: 0.750, material_value_cents_per_sf: 895, warranty_funded_total_cents: 600000 }, as: MillAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /mill/flooring-lots", payload: { product_line_id: "${line_id}", kiln_charge_id: "${charge_a}", input_dry_bf: 6000 }, as: MillSupervisor, captures: { lot_id: "$.data.id" } }
            - { call: "POST /mill/flooring-lots/${lot_id}/complete_milling", payload: { actual_milled_width_in: 3.190, net_flooring_bf: 4680, shorts_bf: 180, sawdust_tons: 1.20, shavings_tons: 0.80 }, as: MillSupervisor, captures: { lot_v2: "$.data.version" } }
            - { call: "POST /mill/grade-runs", payload: { flooring_lot_id: "${lot_id}", inspector_ruleset: "MILL_CHARACTER", expected_lot_version: "${lot_v2}" }, as: GradeInspector, captures: { run_id: "$.data.id" } }
          trigger:
            - { call: "POST /mill/grade-runs/${run_id}/bundles", payload: { grade_class: "CLEAR", bundle_board_feet: 1187.25, average_length_in: 50 }, as: GradeInspector }
            - { call: "POST /mill/grade-runs/${run_id}/bundles", payload: { grade_class: "SELECT", bundle_board_feet: 1502.60, average_length_in: 36 }, as: GradeInspector }
            - { call: "POST /mill/grade-runs/${run_id}/bundles", payload: { grade_class: "NO1_COMMON", bundle_board_feet: 1098.45, average_length_in: 30 }, as: GradeInspector }
            - { call: "POST /mill/grade-runs/${run_id}/bundles", payload: { grade_class: "CHARACTER", bundle_board_feet: 703.10, average_length_in: 20 }, as: GradeInspector }
            - { call: "POST /mill/grade-runs/${run_id}/finalize", payload: {}, as: GradeInspector }
          assert:
            - "Bundle responses carry tally_value_cents 813029 (1187.25 * 640 * 1.07 = 813028.8), 781352 (1502.60 * 520 * 1.00), 433888 (1098.45 * 395 * 1.00 = 433887.75) and 140058 (703.10 * 240 * 0.83 = 140057.52)."
            - "Bundle length_factor values are 1.07, 1.00, 1.00 and 0.83; credit_factor values are 1.00, 0.95, 0.85 and 0.60."
            - "The finalize response has data.tally_board_feet == 4491.40 and data.credited_board_feet == 3970.2625."
            - "The finalize response has data.tally_value_cents == 2168327, the exact sum of the four rounded bundle values."
            - "Summing unrounded bundle values (2168326.07) and rounding once would give 2168326; that value must NOT appear."

      - name: warranty_liability_pinned_six_step_order
        summary: "Adjudicated liability 151474 is only reachable by rounding at each of the six pinned steps in order; collapsing depreciation and the mill share into one multiplication gives 151473."
        mechanism: "base -> admin tier -> admin cents -> gross -> depreciated -> mill share, each ROUND_HALF_UP to whole cents, with the admin tier selected from the rounded base."
        entities_touched: [WarrantyClaim, ProductLine]
        rules_referenced: [warranty_liability_dual_variant, responsibility_split]
        test_recipe:
          setup: "A SOLID red oak line with material value 895 c/sf and a 600000 cent reserve; a claim for 240 sq ft installed 2026-03-15 with subfloor 10.5 pct and RH 62 pct; logical clock 2026-08-20; adjudicated area 210 sq ft."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-20T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
            - { call: "POST /mill/product-lines", payload: { line_code: "SOLID-RO-325", species_profile_id: "${species_id}", construction_type: "SOLID", nominal_width_in: 3.250, nominal_thickness_in: 0.750, material_value_cents_per_sf: 895, warranty_funded_total_cents: 600000 }, as: MillAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "GAPPING", affected_square_feet: 240, installation_date: "2026-03-15", subfloor_moisture_pct_at_install: 10.5, ambient_rh_pct_at_install: 62 }, as: WarrantyAdjudicator, as_user_id: "u_intake", captures: { claim_id: "$.data.id" } }
          trigger:
            - { call: "POST /mill/warranty-claims/${claim_id}/adjudicate", payload: { decision: "APPROVED", adjudicated_affected_sf: 210, adjudicated_subfloor_moisture_pct: 10.5, adjudicated_ambient_rh_pct: 62 }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
          assert:
            - "Step 1: base = 210 * (895 + 475) = 287700."
            - "Step 2: base 287700 < 500000 selects the 0.08 admin tier."
            - "Step 3: admin = ROUND_HALF_UP(287700 * 0.08) = 23016."
            - "Step 4: gross = 310716."
            - "Step 5: data.service_months == 5, data.depreciation_pct == 2.5, depreciated = ROUND_HALF_UP(310716 * 0.975) = ROUND_HALF_UP(302948.1) = 302948."
            - "Step 6: data.adjudicated_liability_cents == ROUND_HALF_UP(302948 * 0.50) == 151474."
            - "The one-shot form ROUND_HALF_UP(310716 * 0.975 * 0.50) = ROUND_HALF_UP(151474.05) = 151474 matches here, but ROUND_HALF_UP(310716 * 0.5 * 0.975) applied with depreciation last gives 151474 as well only because the share is exactly 50 pct; the response must still expose depreciated 302948 as the intermediate so the order is observable."
            - "GET /mill/product-lines/{line_id} shows warranty_balance_cents == 448526 == 600000 - 151474."

  - rule_id: non_linear_state_machine
    rule_summary: "Three shapes that are not a straight line: a kiln charge that cycles CONDITIONING -> REDRY -> CONDITIONING, a warranty claim with two independent state dimensions, and a flooring lot whose single finalize trigger branches on the yield floor."
    instances:
      - name: kiln_charge_conditioning_redry_cycle
        summary: "A failing stress test returns the charge from CONDITIONING to REDRY, resume_conditioning re-enters CONDITIONING with the readings cleared, and a second passing test releases the charge with redry_count still 1."
        mechanism: "Cyclic transition pair on the same entity, with the loop counter and the extended occupancy window persisting across the cycle."
        entities_touched: [KilnCharge, KilnChamber]
        rules_referenced: [moisture_gradient_assessment, charge_occupancy_window]
        test_recipe:
          setup: "Charge A on chamber K1 starting 2026-08-05T00:00:00Z with 265.0 planned hours, 9700 accepted green board feet, taken to CONDITIONING."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id", species_v: "$.data.version" } }
            - { call: "POST /mill/drying-schedules", payload: { species_profile_id: "${species_id}", schedule_code: "RO-100", thickness_in: 1.00, initial_moisture_pct: 45.0, final_moisture_pct: 7.0, conditioning_hours: 24, stress_relief_hours: 12, expected_species_profile_version: "${species_v}" }, as: MillAdmin, captures: { sched_id: "$.data.id" } }
