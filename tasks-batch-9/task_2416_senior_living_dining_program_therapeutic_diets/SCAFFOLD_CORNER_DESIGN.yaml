      - name: temperature_exactly_135_in_range_with_corrective_action_resets_counter
        claim_type: threshold
        grounds:
          - calculations.temperature_posture
          - endpoints[POST /venues/{id}/temperature-logs]
        distinguishing_aspect: "Readings are probed at 134.9 (below), exactly 135.0 (in range by the inclusive boundary) and 135.0 again with a corrective_action_code, showing that the boundary reading is in range, that an in-range log WITHOUT a corrective action leaves the counter untouched instead of resetting it, and that the corrective action is the only resetting path."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One community and one SATELLITE venue with posture COMPLIANT and counter 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["MEMORY_CARE"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /venues"
              payload: { community_id: "${c_id}", name: "Aldergate Satellite", venue_kind: "SATELLITE", seat_capacity: 4, care_levels_served: ["MEMORY_CARE"] }
              as: ProgramAdministrator
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /venues/${v_id}/temperature-logs"
              payload: { probe_point: "HOT_HOLDING", temperature_f: 120.0 }
              as: SatelliteKitchenLead
              captures: { l1_in_range: $.data.in_range, l1_seq: $.data.violation_sequence_index }
            - call: "POST /venues/${v_id}/temperature-logs"
              payload: { probe_point: "HOT_HOLDING", temperature_f: 134.9 }
              as: SatelliteKitchenLead
              captures: { l2_in_range: $.data.in_range, l2_seq: $.data.violation_sequence_index }
            - call: "GET /venues/${v_id}"
              payload: {}
              as: SatelliteKitchenLead
              captures: { posture_watch: $.data.temp_compliance_posture, count_watch: $.data.consecutive_temp_violation_count }
            - call: "POST /venues/${v_id}/temperature-logs"
              payload: { probe_point: "HOT_HOLDING", temperature_f: 135.0 }
              as: SatelliteKitchenLead
              captures: { l3_in_range: $.data.in_range, l3_seq: $.data.violation_sequence_index }
            - call: "GET /venues/${v_id}"
              payload: {}
              as: SatelliteKitchenLead
              captures: { posture_still_watch: $.data.temp_compliance_posture, count_still_watch: $.data.consecutive_temp_violation_count }
            - call: "POST /venues/${v_id}/temperature-logs"
              payload: { probe_point: "HOT_HOLDING", temperature_f: 135.0, corrective_action_code: "HOLDING_UNIT_RECALIBRATED" }
              as: SatelliteKitchenLead
              captures: { l4_in_range: $.data.in_range, l4_seq: $.data.violation_sequence_index }
            - call: "GET /venues/${v_id}"
              payload: {}
              as: SatelliteKitchenLead
              captures: { posture_final: $.data.temp_compliance_posture, count_final: $.data.consecutive_temp_violation_count, v_status_final: $.data.status }
          assert:
            - "${l1_in_range} == false and ${l1_seq} == 1 (120.0 < 135.0)"
            - "${l2_in_range} == false and ${l2_seq} == 2 (134.9 is still below the inclusive minimum)"
            - "${posture_watch} == WATCH and ${count_watch} == 2 (POSTURE_WATCH_AT is 2)"
            - "${l3_in_range} == true (exactly 135.0 IS in range) but ${l3_seq} == 2 — no corrective_action_code, so the counter is untouched"
            - "${posture_still_watch} == WATCH and ${count_still_watch} == 2"
            - "${l4_in_range} == true and ${l4_seq} == 0 — the corrective action is the only resetting path"
            - "${posture_final} == COMPLIANT, ${count_final} == 0 and ${v_status_final} == OPEN (the venue never reached POSTURE_SUSPEND_AT)"
