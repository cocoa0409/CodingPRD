  # ===========================================================================
  - rule_id: transitive_cascade
    scaffold_basis: >-
      §1.2 Booking CONFIRMED -> CANCELLED_BY_OWNER carries an explicitly numbered
      five-level chain (L1 booking cancelled -> L2 owner points and cancel fee ->
      L3 owner suspended and listings suspended -> L4 sibling bookings cancelled
      -> L5 assignments voided and campground slots released), and §1.2 Booking
      CONFIRMED -> IN_TRIP carries a four-level chain (L1 trip starts -> L2
      assignment completed -> L3 slot released and waitlist promoted -> L4 the
      promoted booking's fee, quote and wallet hold re-derived).
    instances:

      - name: owner_cancellation_propagates_five_levels_to_a_second_listings_campground_slot
        grounds: >-
          §1.2 Booking trip_status CONFIRMED -> CANCELLED_BY_OWNER (all four
          cascade bullets) plus §1.2 Listing LISTED -> SUSPENDED (its L3->L4 and
          L4->L5 bullets), with OWNER_SUSPENSION_POINT_THRESHOLD = 12 from
          §1.3 calculations.cancellation_refund.constants.
        distinguishing_aspect: >-
          The trigger touches Booking A on Listing 1, but the observable damage
          lands on a Campground row reached only through Owner -> Listing 2 ->
          Booking B -> DeliveryAssignment. Nothing in the request names the
          campground, the second listing or the second booking. The chain is also
          conditional at L2->L3: the owner starts at 6 points and the STRICT
          policy adds 9, so 15 >= 12 fires the suspension — an implementation that
          stops at the cancelled booking, or that suspends the owner but leaves
          the listings LISTED, or that cancels the sibling booking but forgets to
          release the slot, each fails at a different depth.
        test_recipe:
          setup: >-
            One owner with TWO fully onboarded LISTED listings, a STRICT
            cancellation policy, a capacity-1 campground, Booking A (PICKUP, on
            listing 1, STRICT policy, CONFIRMED, hold 146063), Booking B
            (CAMPGROUND_DROPOFF on listing 2, CONFIRMED, hold 161289 after its
            19000 delivery fee is applied) with a SCHEDULED assignment holding the
            campground's only slot, and the owner pre-loaded to 6 penalty points.
