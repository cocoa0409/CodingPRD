          - state_machines[PelvicHealthReferral.status] ACCEPTED -> WITHDRAWN
        excluded_because:
          difficulty_instance: ci_referral_visit_ledger_conservation
          rationale: "The compensation pattern for referrals is exactly what that §1.8 instance measures: VOID_LAST reverses the auto-transition to COMPLETED and restores the counters, and WITHDRAW forfeits the remainder, with the four-way ledger identity checked after every hop."

      - name: sm_ledger_sync_lot_counters_on_case_cancel
        claim_type: side_effect_execution
        grounds:
          - state_machines[ProcedureCase.schedule_status] SCHEDULED -> CANCELLED side_effects
          - state_machines[ConsignmentLot.billing_status]
        excluded_because:
          difficulty_instance: ci_consignment_unit_conservation_cancel_vs_noshow
          rationale: "The ledger-sync side effects of cancel (RESERVED -> RELEASED, units back to available, PROVISIONAL re-bill, billing_status re-derived) and of no-show (RESERVED -> WASTED) are asserted side by side there, which is strictly stronger than checking either transition alone."

