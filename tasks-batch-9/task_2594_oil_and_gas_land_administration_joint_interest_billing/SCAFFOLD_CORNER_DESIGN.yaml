              payload: { settled_on: "2026-07-20" }
              as: JointInterestAccountant
              as_user_id: "u-jib-1"
          assert:
            - "HTTP 409 with error_id ERR_STATEMENT_NOT_SETTLEABLE"
            - "JibStatement.${stmt_id}.statement_status == DISPUTED and settled_on is null"
            - "BillingDispute.${dispute_id}.dispute_status == OPEN"
            - "Well.${well_id}.billed_to_date_cents == 2934000 - the refused settlement changed no ledger"

  # ============================================================================
  # Section 6 - Errors (claim-extraction-guide "From Table 6")
  # ============================================================================
  - section: errors
    instances:
      - name: unknown_ids_on_every_addressable_resource_return_their_own_not_found
        claim_type: triggerability
        grounds:
          - "validations[priority=30, error_id=ERR_LEASE_NOT_FOUND]"
          - errors.ERR_WELL_INTEREST_NOT_FOUND
          - errors.ERR_TRANSFER_NOT_FOUND
        distinguishing_aspect: |
          Each of the ten addressable resources has its OWN not-found error id rather than a shared
          generic 404, so one sweep of unknown-uuid GETs must produce ten distinct error_ids on an
          otherwise empty database.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-07-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
          trigger:
            - call: "GET /land-admin/leases/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LandAdministrator
            - call: "GET /land-admin/wells/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LandAdministrator
            - call: "GET /land-admin/interest-owners/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LandAdministrator
            - call: "GET /land-admin/well-interests/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LandAdministrator
            - call: "GET /land-admin/afes/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LandAdministrator
            - call: "GET /land-admin/jib-statements/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LandAdministrator
            - call: "GET /land-admin/disputes/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LandAdministrator
            - call: "GET /land-admin/production-revenues/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LandAdministrator
            - call: "GET /land-admin/owner-disbursements/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LandAdministrator
            - call: "GET /land-admin/assignment-transfers/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LandAdministrator
          assert:
            - "every call returns HTTP 404"
            - "the error_ids are, in call order, ERR_LEASE_NOT_FOUND, ERR_WELL_NOT_FOUND, ERR_INTEREST_OWNER_NOT_FOUND, ERR_WELL_INTEREST_NOT_FOUND, ERR_AFE_NOT_FOUND, ERR_JIB_STATEMENT_NOT_FOUND, ERR_DISPUTE_NOT_FOUND, ERR_PRODUCTION_REVENUE_NOT_FOUND, ERR_DISBURSEMENT_NOT_FOUND, ERR_TRANSFER_NOT_FOUND"
            - "each response carries the standard error envelope with a distinct error_id and no data payload"

      - name: pagination_bounds_are_rejected_at_both_ends
        claim_type: triggerability
        grounds:
          - "validations[priority=27, error_id=ERR_PAGINATION_INVALID]"
          - errors.ERR_PAGINATION_INVALID
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          The pagination guard sits at priority 27, above every path-existence check, and rejects both
          ends of the range: limit 101 (above the maximum 100) and offset -1 each return
          ERR_PAGINATION_INVALID (400) on a list endpoint whose underlying collection is perfectly
          valid.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "One lease L-001 exists, so the collection itself is non-empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", gross_acres: 640.00, royalty_rate: 0.187500, primary_term_end_date: "2026-09-30" }
              as: LandAdministrator
              captures: { lease1_id: $.data.id }
          trigger:
            - call: "GET /land-admin/leases?limit=101&offset=0"
              payload: {}
              as: LandAdministrator
            - call: "GET /land-admin/leases?limit=20&offset=-1"
              payload: {}
              as: LandAdministrator
          assert:
            - "both calls return HTTP 400 with error_id ERR_PAGINATION_INVALID"
            - "GET /land-admin/leases?limit=100&offset=0 succeeds with total_count == 1, so 100 is the inclusive maximum"

      - name: duplicate_natural_keys_are_rejected_on_every_uniqueness_rule
        claim_type: triggerability
        grounds:
          - "validations[priority=70, error_id=ERR_DUPLICATE_LEASE_NUMBER]"
          - "validations[priority=70, error_id=ERR_DUPLICATE_API_NUMBER]"
          - "validations[priority=70, error_id=ERR_DUPLICATE_ALLOCATION]"
          - "validations[priority=70, error_id=ERR_DUPLICATE_PRODUCTION_MONTH]"
        distinguishing_aspect: |
          Four different uniqueness scopes are enforced with four different error ids: lease_number
          globally, api_number globally, (well_id, lease_id) for a COMMITTED allocation and
          production_month per well - each returns 409 while leaving the existing row untouched.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Leases L-001 (640.00 gross acres, royalty 0.187500, primary term ending 2026-09-30) and L-002 (320.00 gross acres, royalty 0.250000, primary term ending 2027-12-31)"
            - "Well Sandstone 1H, OIL, 9500 ft, with 480.00 acres committed from L-001 and 160.00 from L-002 (allocation factors 0.750000 / 0.250000), well_status PRODUCING, pooling_status POOLED_EFFECTIVE"
            - "Four interest owners: OP (operator, WI 0.500000, NRI 0.412500, preferential_right true, bond 50000000), OA (WI 0.300000, NRI 0.240000, preferential_right true, bond 10000000), OB (WI 0.200000, NRI 0.150000, preferential_right false, bond 0), OC (Gamma Operating LP, bond 20000000, holds no interest in this well)"
            - "One ProductionRevenue for production_month 2026-05 on the well"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", gross_acres: 640.00, royalty_rate: 0.187500, primary_term_end_date: "2026-09-30", extension_option_months: 24, extension_bonus_per_acre_cents: 15000, shut_in_royalty_per_acre_cents: 500, continuous_dev_window_days: 180 }
              as: LandAdministrator
              captures: { lease1_id: $.data.id }
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-002", lessor_name: "Beta Royalties", gross_acres: 320.00, royalty_rate: 0.250000, primary_term_end_date: "2027-12-31", extension_option_months: 12, extension_bonus_per_acre_cents: 12000, shut_in_royalty_per_acre_cents: 400, continuous_dev_window_days: 180 }
              as: LandAdministrator
              captures: { lease2_id: $.data.id }
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500, spud_date: "2026-02-10" }
              as: LandAdministrator
              captures: { well_id: $.data.id }
