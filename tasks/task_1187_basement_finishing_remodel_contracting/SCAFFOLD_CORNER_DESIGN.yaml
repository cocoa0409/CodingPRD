      - name: ceiling_noncompliant_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_CEILING_NONCOMPLIANT]"]
        distinguishing_aspect: "Full-height area 399 of 1000 (low 601, prohibited 0) fails the >= 50% rule R2 alone and yields ERR_CEILING_NONCOMPLIANT with egress vacuously satisfied (bedroom_count 0)."
