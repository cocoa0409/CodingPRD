  - rule_id: transitive_cascade
    instances:
      - name: registration_cancel_cascades_allocation_asset_outing_inventory_and_waitlist
        grounds:
          - state_machines.Registration.CONFIRMED_to_CANCELLED
          - state_machines.SponsorAllocation.COMMITTED_to_RELEASED
          - calculations.asset_occupancy_availability
          - calculations.waitlist_promotion
          - calculations.charitable_deductible
          - entities.Outing.fields.reserved_asset_slot_count
        cascade_depth: 4
        distinguishing_aspect: |
          Trigger is a registration CANCEL. Depth-4 chain where each link is caused
          strictly by the previous one: (1) Registration CONFIRMED -> CANCELLED -> REFUNDED
          causes (2) its UPSELL SponsorAllocation COMMITTED -> RELEASED, which causes
          (3) the SponsorshipAsset counters to fall and its status to return to AVAILABLE,
          which causes (4) Outing.reserved_asset_slot_count to drop to 0. The same cancel
          also fires the waitlist leg (freed slots promote the queued registration) and the
          receipt leg (an automatic REVERSAL zeroes the receipted deductible total).
