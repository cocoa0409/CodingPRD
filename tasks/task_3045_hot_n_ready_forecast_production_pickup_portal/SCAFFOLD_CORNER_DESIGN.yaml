scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: store_day_create_missing_business_date_returns_400
        claim_type: required_field
        grounds:
          - entities.StoreDay.fields.business_date
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /store-days without business_date is rejected with ERR_VALIDATION 400; no row created."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /store-days"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION"
            - "http status == 400"

      - name: product_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.Product.fields.customization_allowed
          - entities.Product.fields.promo_locked
        distinguishing_aspect: "Omitting customization_allowed yields false; promo_locked initializes false; promo_price_cents may be absent."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "PEP", name: "Pepperoni", list_price_cents: 600 }
              as: StoreManager
              captures: { p_id: $.data.id }
          assert:
            - "Product.${p_id}.customization_allowed == false"
            - "Product.${p_id}.promo_locked == false"

      - name: store_day_create_extra_computed_field_ignored_input
        claim_type: computed_field
        grounds:
          - entities.StoreDay.fields.produced_units
        distinguishing_aspect: "Client-supplied computed field produced_units is ignored: creation succeeds and produced_units is 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /store-days"
              payload: { business_date: "2026-10-01", produced_units: 99 }
              as: StoreManager
              captures: { sd_id: $.data.id, sd_produced: $.data.produced_units }
          assert:
            - "create succeeds (201)"
            - "StoreDay.${sd_id}.produced_units == 0 (computed input ignored)"

      - name: store_day_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_STORE_DAY_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_STORE_DAY_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /store-days/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STORE_DAY_NOT_FOUND"
            - "http status == 404"

      - name: waste_log_immutable_entity_has_no_mutation_surface
        claim_type: immutability
        grounds:
          - entities.WasteLog
        distinguishing_aspect: "WasteLog has common_fields false: only creation via system cascades and list reads; no PUT/DELETE endpoint exists for it in §1.5."
        test_recipe:
          setup:
            - "StoreDay 2026-10-02 opened; LUNCH daypart ACTIVE at 10:35Z; run of 2 racked; one unit discarded (produces a WasteLog row)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T08:00:00Z" }
              as: StoreManager
            - call: "POST /store-days"
              payload: { business_date: "2026-10-02" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "LUNCH", window_start_minute: 600, window_end_minute: 840, rack_capacity: 20, base_demand_units: 10 }
              as: StoreManager
              captures: { dp_id: $.data.id }
            - call: "POST /store-days/${sd_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /store-days/${sd_id}/dough-batches"
              payload: { size_units: 5 }
              as: CrewMember
              captures: { db_id: $.data.id }
            - call: "POST /store-days/${sd_id}/cheese-batches"
              payload: { size_units: 5 }
              as: CrewMember
              captures: { cb_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PEP", name: "Pepperoni", list_price_cents: 600 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /dough-batches/${db_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T10:05:00Z" }
              as: StoreManager
            - call: "POST /dough-batches/${db_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /cheese-batches/${cb_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T10:35:00Z" }
              as: StoreManager
            - call: "POST /cheese-batches/${cb_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /dayparts/${dp_id}/production-runs"
              payload: { product_id: "${p_id}", dough_batch_id: "${db_id}", cheese_batch_id: "${cb_id}", quantity: 2 }
              as: ShiftLead
              captures: { run_id: $.data.id }
            - call: "POST /production-runs/${run_id}/start-baking"
              payload: {}
              as: CrewMember
            - call: "POST /production-runs/${run_id}/rack"
              payload: {}
              as: CrewMember
            - call: "GET /hold-units"
              payload: { production_run_id: "${run_id}", status: "HOLDING" }
              as: CrewMember
              captures: { hu_id: "$.data[0].id" }
            - call: "POST /hold-units/${hu_id}/discard"
              payload: { reason: "DAMAGED", donated: true }
              as: ShiftLead
          trigger:
            - call: "GET /store-days/${sd_id}/waste-logs"
              payload: {}
              as: StoreManager
              captures: { wl_qty: "$.data[0].quantity", wl_reason: "$.data[0].reason", wl_donated: "$.data[0].donated" }
          assert:
            - "waste log list length == 1"
            - "WasteLog[0].quantity == 1 (one row per discarded unit)"
            - "WasteLog[0].reason == DAMAGED"
            - "WasteLog[0].donated == true"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: dough_batch_advance_from_proofed_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.DoughBatch
          - errors[ERR_BATCH_STATE]
        distinguishing_aspect: "Advance on a PROOFED dough batch has no forward transition -> ERR_BATCH_STATE 409; batch state unchanged."
        test_recipe:
          setup:
            - "StoreDay 2026-10-03 opened; dough batch advanced MIXING->PROOFING->PROOFED (clock moved past proof floor)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-03T08:00:00Z" }
              as: StoreManager
            - call: "POST /store-days"
              payload: { business_date: "2026-10-03" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "LUNCH", window_start_minute: 600, window_end_minute: 840, rack_capacity: 20, base_demand_units: 10 }
              as: StoreManager
            - call: "POST /store-days/${sd_id}/dough-batches"
              payload: { size_units: 5 }
              as: CrewMember
              captures: { db_id: $.data.id }
            - call: "POST /dough-batches/${db_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-03T10:05:00Z" }
              as: StoreManager
            - call: "POST /dough-batches/${db_id}/advance"
              payload: {}
              as: CrewMember
              captures: { db_status: $.data.status }
          trigger:
            - call: "POST /dough-batches/${db_id}/advance"
              payload: {}
              as: CrewMember
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BATCH_STATE"
            - "DoughBatch.${db_id}.status == PROOFED (unchanged)"

      - name: dough_batch_expires_at_max_proof_window
        claim_type: valid_transition
        grounds:
          - state_machines.DoughBatch.PROOFED_to_EXPIRED
          - calculations.dough_proof_window
        distinguishing_aspect: "Clock sweep at clock >= proofed_at + 240 minutes moves a PROOFED batch to EXPIRED (inclusive upper bound); EXPIRED dough then fails start-baking with ERR_DOUGH_UNAVAILABLE."
        test_recipe:
          setup:
            - "StoreDay 2026-10-04 opened; LUNCH daypart; dough PROOFED at 10:05Z; cheese READY; planned run referencing the dough batch"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-04T08:00:00Z" }
              as: StoreManager
            - call: "POST /store-days"
              payload: { business_date: "2026-10-04" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "LUNCH", window_start_minute: 600, window_end_minute: 840, rack_capacity: 20, base_demand_units: 10 }
              as: StoreManager
              captures: { dp_id: $.data.id }
            - call: "POST /store-days/${sd_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /store-days/${sd_id}/dough-batches"
              payload: { size_units: 5 }
              as: CrewMember
              captures: { db_id: $.data.id }
            - call: "POST /store-days/${sd_id}/cheese-batches"
              payload: { size_units: 5 }
              as: CrewMember
              captures: { cb_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PEP", name: "Pepperoni", list_price_cents: 600 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /dough-batches/${db_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-04T10:05:00Z" }
              as: StoreManager
            - call: "POST /dough-batches/${db_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /cheese-batches/${cb_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-04T10:35:00Z" }
              as: StoreManager
            - call: "POST /cheese-batches/${cb_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /dayparts/${dp_id}/production-runs"
              payload: { product_id: "${p_id}", dough_batch_id: "${db_id}", cheese_batch_id: "${cb_id}", quantity: 1 }
              as: ShiftLead
              captures: { run_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-04T14:05:00Z" }
              as: StoreManager
          trigger:
            - call: "GET /dough-batches/${db_id}"
              payload: {}
              as: CrewMember
              captures: { db_status: $.data.status }
            - call: "POST /production-runs/${run_id}/start-baking"
              payload: {}
              as: CrewMember
              captures: { err: $.data.error_id }
          assert:
            - "DoughBatch.${db_id}.status == EXPIRED (proofed 10:05Z + 240min = 14:05Z, inclusive boundary)"
            - "start-baking returns ERR_DOUGH_UNAVAILABLE"

      - name: hold_unit_expired_exactly_at_hold_expires_at
        claim_type: valid_transition
        grounds:
          - state_machines.HoldUnit.HOLDING_to_DISCARDED
          - entities.HoldUnit.fields.hold_expires_at
        distinguishing_aspect: "Hold expiry boundary is inclusive: at clock == racked_at + HOLD_MINUTES the sweep discards the unit (HOLD_EXPIRED) and appends a WasteLog; one minute earlier it survives."
        test_recipe:
          setup:
            - "StoreDay 2026-10-05 opened; LUNCH daypart ACTIVE; run of 1 racked at 10:35Z (hold_expires_at 11:05Z with HOLD_MINUTES 30)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T08:00:00Z" }
              as: StoreManager
            - call: "POST /store-days"
              payload: { business_date: "2026-10-05" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "LUNCH", window_start_minute: 600, window_end_minute: 840, rack_capacity: 20, base_demand_units: 10 }
              as: StoreManager
              captures: { dp_id: $.data.id }
            - call: "POST /store-days/${sd_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /store-days/${sd_id}/dough-batches"
              payload: { size_units: 5 }
              as: CrewMember
              captures: { db_id: $.data.id }
            - call: "POST /store-days/${sd_id}/cheese-batches"
              payload: { size_units: 5 }
              as: CrewMember
              captures: { cb_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PEP", name: "Pepperoni", list_price_cents: 600 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /dough-batches/${db_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T10:05:00Z" }
              as: StoreManager
            - call: "POST /dough-batches/${db_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /cheese-batches/${cb_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T10:35:00Z" }
              as: StoreManager
            - call: "POST /cheese-batches/${cb_id}/advance"
              payload: {}
              as: CrewMember
            - call: "POST /dayparts/${dp_id}/production-runs"
              payload: { product_id: "${p_id}", dough_batch_id: "${db_id}", cheese_batch_id: "${cb_id}", quantity: 1 }
              as: ShiftLead
              captures: { run_id: $.data.id }
            - call: "POST /production-runs/${run_id}/start-baking"
              payload: {}
              as: CrewMember
            - call: "POST /production-runs/${run_id}/rack"
              payload: {}
              as: CrewMember
            - call: "GET /hold-units"
              payload: { production_run_id: "${run_id}", status: "HOLDING" }
              as: CrewMember
              captures: { hu_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T11:04:00Z" }
              as: StoreManager
            - call: "GET /hold-units/${hu_id}"
              payload: {}
              as: CrewMember
              captures: { hu_status_before: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T11:05:00Z" }
              as: StoreManager
          trigger:
            - call: "GET /hold-units/${hu_id}"
              payload: {}
              as: CrewMember
              captures: { hu_status_after: $.data.status, hu_reason: $.data.discarded_reason }
          assert:
            - "at 11:04Z (clock < hold_expires_at) HoldUnit.${hu_id}.status == HOLDING"
            - "at 11:05Z (clock == hold_expires_at) HoldUnit.${hu_id}.status == DISCARDED"
            - "HoldUnit.${hu_id}.discarded_reason == HOLD_EXPIRED"

      - name: order_cancel_after_ready_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Order
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancel is only defined from PLACED or IN_PREPARATION; cancelling a READY order returns ERR_INVALID_STATE and changes nothing."
        test_recipe:
          setup:
            - "StoreDay 2026-10-06 opened; LUNCH daypart ACTIVE; locker slot 1; portal order paid, prepared, READY"
          setup_api_calls:
            - call: "POST /store-days"
              payload: { business_date: "2026-10-06" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "LUNCH", window_start_minute: 600, window_end_minute: 840, rack_capacity: 20, base_demand_units: 10 }
              as: StoreManager
              captures: { dp_id: $.data.id }
            - call: "POST /store-days/${sd_id}/locker-slots"
              payload: { slot_number: 1 }
              as: StoreManager
            - call: "POST /store-days/${sd_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-06T11:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { sku: "PEP", name: "Pepperoni", list_price_cents: 600 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /orders"
              payload:
                store_day_id: "${sd_id}"
                daypart_id: "${dp_id}"
                customer_id: "cust-c1"
                kind: "PORTAL_STANDARD"
                lines:
                  - { product_id: "${p_id}", quantity: 1, customized: false }
              as: Customer
              as_user_id: "cust-c1"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "cust-c1"
            - call: "POST /orders/${ord_id}/start-preparation"
              payload: {}
              as: CrewMember
            - call: "POST /orders/${ord_id}/mark-ready"
              payload: {}
              as: CrewMember
          trigger:
            - call: "POST /orders/${ord_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "cust-c1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Order.${ord_id}.fulfillment_status == READY (unchanged)"
            - "Order.${ord_id}.payment_status == PAID (unchanged)"

      - name: store_day_close_blocked_by_occupied_locker
        claim_type: precondition_enforcement
        grounds:
          - state_machines.StoreDay.OPEN_to_CLOSED
          - errors[ERR_LOCKER_SLOTS_OCCUPIED]
        distinguishing_aspect: "Store-day close checks the locker pool: with one OCCUPIED slot (a READY order waiting for pickup), close returns ERR_LOCKER_SLOTS_OCCUPIED even if all dayparts are CLOSED."
        test_recipe:
          setup:
            - "StoreDay 2026-10-07 opened; LUNCH daypart ACTIVE then closed; locker slot 1 OCCUPIED by a READY order"
          setup_api_calls:
            - call: "POST /store-days"
              payload: { business_date: "2026-10-07" }
              as: StoreManager
              captures: { sd_id: $.data.id }
            - call: "POST /store-days/${sd_id}/dayparts"
              payload: { label: "LUNCH", window_start_minute: 600, window_end_minute: 840, rack_capacity: 20, base_demand_units: 10 }
              as: StoreManager
              captures: { dp_id: $.data.id }
            - call: "POST /store-days/${sd_id}/locker-slots"
              payload: { slot_number: 1 }
              as: StoreManager
              captures: { slot_id: $.data.id }
            - call: "POST /store-days/${sd_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-07T11:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { sku: "PEP", name: "Pepperoni", list_price_cents: 600 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /orders"
              payload:
                store_day_id: "${sd_id}"
                daypart_id: "${dp_id}"
                customer_id: "cust-c2"
                kind: "PORTAL_STANDARD"
                lines:
                  - { product_id: "${p_id}", quantity: 1, customized: false }
              as: Customer
              as_user_id: "cust-c2"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "cust-c2"
            - call: "POST /orders/${ord_id}/start-preparation"
              payload: {}
              as: CrewMember
            - call: "POST /orders/${ord_id}/mark-ready"
              payload: {}
              as: CrewMember
            - call: "POST /dayparts/${dp_id}/close"
              payload: {}
              as: ShiftLead
          trigger:
            - call: "POST /store-days/${sd_id}/close"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LOCKER_SLOTS_OCCUPIED"
            - "StoreDay.${sd_id}.status == OPEN (unchanged)"

      - name: daypart_close_blocked_by_baking_run
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Daypart.ACTIVE_to_CLOSED
          - errors[ERR_RUNS_IN_PROGRESS]
        distinguishing_aspect: "Daypart close is refused while any run of the daypart is BAKING (ERR_RUNS_IN_PROGRESS); only after rack does close succeed."
        test_recipe:
          setup:
            - "StoreDay 2026-10-08 opened; LUNCH daypart ACTIVE; run in BAKING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-08T08:00:00Z" }
              as: StoreManager
            - call: "POST /store-days"
              payload: { business_date: "2026-10-08" }
              as: StoreManager
