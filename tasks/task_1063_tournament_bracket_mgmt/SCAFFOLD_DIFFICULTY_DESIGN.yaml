scaffold_difficulty_design:
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: payout_provisional_vs_final_registration_mapping
        grounds:
          - calculations.payout_allocation
          - entities.Payout.fields.variant
          - entities.Payout.fields.registration_id
          - state_machines.Tournament.REGISTRATION_CLOSED_to_BRACKET_READY
          - state_machines.Tournament.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: "PROVISIONAL payout maps placement 1 to seed-1 registration; when seed 2 upsets and wins, FINAL payout maps placement 1 to the seed-2 registration — same prize_pool_cents, different registration_id on the winning payout (money-domain dual variant)."
        test_recipe:
          setup:
            - "2-player SINGLE_ELIM, prize_pool_cents=100000, paid_places=2; P1 rating 1500 (seed1), P2 rating 1200 (seed2); both checked in; bracket generated (PROVISIONAL payouts exist); P2 upsets P1 in the final; tournament completed (FINAL payouts exist)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Arena", address: "1 Main", open_minute: 0, close_minute: 1440 }
              as: Director
              captures: { v_id: $.data.id }
            - call: "POST /venues/${v_id}/stations"
              payload: { label: "T1" }
              as: Director
              captures: { st_id: $.data.id }
            - call: "POST /players"
              payload: { display_name: "P1", email: "p1@x.com", rating: 1500, tax_id_provided: false }
              as: Public
              captures: { p1: $.data.id }
            - call: "POST /players"
              payload: { display_name: "P2", email: "p2@x.com", rating: 1200, tax_id_provided: true }
              as: Public
              captures: { p2: $.data.id }
            - call: "POST /tournaments"
              payload: { name: "Cup", venue_id: "${v_id}", format: "SINGLE_ELIM", max_participants: 8, seeding_method: "RATING", tiebreak_method: "SEED", prize_pool_cents: 100000, paid_places: 2, check_in_deadline: "2026-08-01T00:00:00Z" }
              as: Director
              captures: { t_id: $.data.id }
            - call: "POST /tournaments/${t_id}/open-registration"
              payload: {}
              as: Director
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${p1}" }
              as: Player
              as_user_id: "${p1}"
              captures: { r1: $.data.id }
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${p2}" }
              as: Player
              as_user_id: "${p2}"
              captures: { r2: $.data.id }
            - call: "POST /tournaments/${t_id}/close-registration"
              payload: {}
              as: Director
            - call: "POST /registrations/${r1}/check-in"
              payload: {}
              as: Player
              as_user_id: "${p1}"
            - call: "POST /registrations/${r2}/check-in"
              payload: {}
              as: Player
              as_user_id: "${p2}"
            - call: "POST /tournaments/${t_id}/generate-bracket"
              payload: {}
              as: Director
            - call: "POST /tournaments/${t_id}/start"
              payload: {}
              as: Director
            - call: "GET /tournaments/${t_id}/matches"
              payload: {}
              as: Public
              captures: { m_id: "$.data[0].id" }
            - call: "POST /matches/${m_id}/schedule"
              payload: { station_id: "${st_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-01T11:00:00Z" }
              as: Referee
            - call: "POST /matches/${m_id}/report"
              payload: { home_score: 1, away_score: 2 }
              as: Player
              as_user_id: "${p2}"
              captures: { m_ver: $.data.version }
            - call: "POST /matches/${m_id}/confirm"
              payload: { expected_match_version: "${m_ver}" }
              as: Referee
              as_user_id: "ref-1"
          trigger:
            - call: "GET /tournaments/${t_id}"
              payload: {}
              as: Director
              captures: { t_ver: $.data.version }
            - call: "POST /tournaments/${t_id}/complete"
              payload: { expected_tournament_version: "${t_ver}" }
              as: Director
          assert:
            - "The PROVISIONAL Payout with placement==1 has registration_id == ${r1} (seed 1 projection)."
            - "The FINAL Payout with placement==1 has registration_id == ${r2} (actual champion) and gross_amount_cents == 70000."
            - "All PROVISIONAL payouts have status == VOID after completion; payout_variant == FINAL."

      - name: standings_seed_vs_gamediff_tiebreak
        grounds:
          - calculations.standings_ranking
          - entities.Tournament.fields.tiebreak_method
          - entities.Match.fields.home_score
          - entities.Match.fields.away_score
        distinguishing_aspect: "In a 3-player round robin where all three tie on match_points==3, GAME_DIFF tiebreak ranks the seed-2 registration first (game_diff +1), whereas SEED tiebreak would rank seed-1 first — the ranking-domain variant, distinct from the money-domain payout variant."
        test_recipe:
          setup:
            - "3-player ROUND_ROBIN, tiebreak_method=GAME_DIFF; A rating 1500 (seed1), B 1200 (seed2), C 1000 (seed3); all checked in; bracket generated (3 matches, lower seed is home); results A beats B 2-1, C beats A 2-1, B beats C 2-0; all confirmed."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Hall", address: "2 Oak", open_minute: 0, close_minute: 1440 }
              as: Director
              captures: { v_id: $.data.id }
            - call: "POST /venues/${v_id}/stations"
              payload: { label: "T1" }
              as: Director
              captures: { st_id: $.data.id }
            - call: "POST /players"
              payload: { display_name: "A", email: "a@x.com", rating: 1500 }
              as: Public
              captures: { pa: $.data.id }
            - call: "POST /players"
              payload: { display_name: "B", email: "b@x.com", rating: 1200 }
              as: Public
              captures: { pb: $.data.id }
            - call: "POST /players"
              payload: { display_name: "C", email: "c@x.com", rating: 1000 }
              as: Public
              captures: { pc: $.data.id }
            - call: "POST /tournaments"
              payload: { name: "RR", venue_id: "${v_id}", format: "ROUND_ROBIN", max_participants: 8, seeding_method: "RATING", tiebreak_method: "GAME_DIFF", prize_pool_cents: 0, paid_places: 1, check_in_deadline: "2026-08-01T00:00:00Z" }
              as: Director
              captures: { t_id: $.data.id }
            - call: "POST /tournaments/${t_id}/open-registration"
              payload: {}
              as: Director
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${pa}" }
              as: Player
              as_user_id: "${pa}"
              captures: { ra: $.data.id }
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${pb}" }
              as: Player
              as_user_id: "${pb}"
              captures: { rb: $.data.id }
            - call: "POST /registrations"
              payload: { tournament_id: "${t_id}", player_id: "${pc}" }
              as: Player
              as_user_id: "${pc}"
              captures: { rc: $.data.id }
            - call: "POST /tournaments/${t_id}/close-registration"
              payload: {}
              as: Director
            - call: "POST /registrations/${ra}/check-in"
              payload: {}
              as: Player
              as_user_id: "${pa}"
            - call: "POST /registrations/${rb}/check-in"
              payload: {}
              as: Player
              as_user_id: "${pb}"
            - call: "POST /registrations/${rc}/check-in"
              payload: {}
              as: Player
              as_user_id: "${pc}"
            - call: "POST /tournaments/${t_id}/generate-bracket"
              payload: {}
              as: Director
            - call: "POST /tournaments/${t_id}/start"
              payload: {}
              as: Director
            - call: "GET /matches?home_registration_id=${ra}&away_registration_id=${rb}"
              payload: {}
              as: Public
              captures: { m_ab: "$.data[0].id" }
            - call: "GET /matches?home_registration_id=${ra}&away_registration_id=${rc}"
              payload: {}
              as: Public
              captures: { m_ac: "$.data[0].id" }
            - call: "GET /matches?home_registration_id=${rb}&away_registration_id=${rc}"
              payload: {}
              as: Public
              captures: { m_bc: "$.data[0].id" }
            - call: "POST /matches/${m_ab}/schedule"
              payload: { station_id: "${st_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-01T11:00:00Z" }
              as: Referee
            - call: "POST /matches/${m_ab}/report"
              payload: { home_score: 2, away_score: 1 }
              as: Player
              as_user_id: "${pa}"
              captures: { v_ab: $.data.version }
            - call: "POST /matches/${m_ab}/confirm"
              payload: { expected_match_version: "${v_ab}" }
              as: Referee
              as_user_id: "ref-1"
            - call: "POST /matches/${m_ac}/schedule"
              payload: { station_id: "${st_id}", scheduled_start: "2026-07-01T11:30:00Z", scheduled_end: "2026-07-01T12:30:00Z" }
              as: Referee
            - call: "POST /matches/${m_ac}/report"
              payload: { home_score: 1, away_score: 2 }
              as: Player
              as_user_id: "${pa}"
              captures: { v_ac: $.data.version }
            - call: "POST /matches/${m_ac}/confirm"
              payload: { expected_match_version: "${v_ac}" }
              as: Referee
              as_user_id: "ref-1"
            - call: "POST /matches/${m_bc}/schedule"
              payload: { station_id: "${st_id}", scheduled_start: "2026-07-01T13:00:00Z", scheduled_end: "2026-07-01T14:00:00Z" }
              as: Referee
            - call: "POST /matches/${m_bc}/report"
              payload: { home_score: 2, away_score: 0 }
              as: Player
              as_user_id: "${pb}"
              captures: { v_bc: $.data.version }
            - call: "POST /matches/${m_bc}/confirm"
              payload: { expected_match_version: "${v_bc}" }
              as: Referee
              as_user_id: "ref-1"
          trigger:
            - call: "GET /tournaments/${t_id}/standings"
              payload: {}
              as: Public
          assert:
            - "standings.rows[0].registration_id == ${rb} (seed 2), rows[0].match_points == 3, rows[0].game_diff == 1."
            - "standings.rows[1].registration_id == ${ra} (seed 1), rows[1].game_diff == 0."
            - "standings.rows[2].registration_id == ${rc} (seed 3), rows[2].game_diff == -1."

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: payout_rounding_order_remainder_to_first
        grounds:
          - calculations.payout_allocation
          - entities.Tournament.fields.paid_places
          - entities.Payout.fields.gross_amount_cents
        distinguishing_aspect: "Mode (b) pinned rounding order: with prize_pool_cents=333, paid_places=3, PAYOUT_PCT[3]=[.50,.30,.20], per-placement round_half_up gives [167,100,67] summing to 334 (overshoot 1); the pinned order pushes the -1 remainder to placement 1, yielding gross 166/100/67 — not a sum-then-round or naive result."
        test_recipe:
          setup:
            - "2-player SINGLE_ELIM completed with prize_pool_cents=333, paid_places=3; P1 seed1 beats P2; FINAL payouts created (placement 3 has null registration since only 2 finishers, still allocated)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", address: "3 Elm", open_minute: 0, close_minute: 1440 }
              as: Director
              captures: { v_id: $.data.id }
            - call: "POST /venues/${v_id}/stations"
