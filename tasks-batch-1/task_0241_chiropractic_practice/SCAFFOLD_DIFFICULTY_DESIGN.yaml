            - call: "POST /patients/${pt_id}/appointments/${appt_id}/soap-note/sign"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${pt_id}/appointments/${appt_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            # build then discontinue a plan so its phase is CANCELLED
            - call: "POST /patients/${pt_id}/exams"
              payload: { provider_id: "${prov_id}", exam_type: "INITIAL", severity_score: 6 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { exam_id: $.data.id }
            - call: "POST /patients/${pt_id}/exams/${exam_id}/finalize"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${pt_id}/treatment-plans"
              payload: { exam_record_id: "${exam_id}" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /patients/${pt_id}/treatment-plans/${plan_id}/phases"
              payload: { phase_type: "ACUTE", sequence_index: 0, visits_per_week: 3, planned_visit_count: 2 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { phase_id: $.data.id }
            - call: "GET /patients/${pt_id}"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { pt_v: $.data.version }
            - call: "POST /patients/${pt_id}/treatment-plans/${plan_id}/activate"
              payload: { expected_patient_version: "${pt_v}" }
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /patients/${pt_id}/treatment-plans/${plan_id}/discontinue"
              payload: {}
