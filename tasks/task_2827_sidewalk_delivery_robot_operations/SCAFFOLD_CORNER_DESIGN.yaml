              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S2", segment_type: "CROSSING", crossing_control: "SIGNALIZED", length_m: 14.0, measured_clearance_cm: 150.0, surface_grade_pct: 1.5, sightline_m: 35.0, pedestrian_flow_per_min: 10.0, curb_ramp_present: true, connected_segment_ids: ["${s1}"] }
