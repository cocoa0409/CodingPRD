            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e1}", expected_batch_version: "${b_v1}" }, as: McoEncounterOps }
            - { call: "POST /programs/batches/${b_id}/seal", payload: {}, as: McoEncounterOps, as_user_id: "ops-1" }
