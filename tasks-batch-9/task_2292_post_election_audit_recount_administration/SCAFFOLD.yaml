# =============================================================================
# §1.6 Error Code Catalog — every code is reachable from at least one endpoint.
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-Role missing or unknown; X-User-ID missing where the role is entity_backed"
    applies_to: ["all"]
  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "the acting role is not in the endpoint's authorized_roles"
    applies_to: ["all"]
  - id: ERR_VALIDATION
    http_status: 422
    condition: "schema violation: missing required field, wrong type, unknown enum member, out-of-range number, random_seed not exactly 10 digits, pagination limit outside [1,100]"
    applies_to: ["all"]

  - id: ERR_ELECTION_NOT_FOUND
    http_status: 404
    condition: "election id in path or body does not exist"
    applies_to: ["GET /elections/{id}", "PATCH /elections/{id}", "POST /elections/{id}/certify", "POST /contests", "POST /ballot-batches", "POST /ballot-batches/bulk", "POST /tally-teams", "POST /observer-credentials"]
  - id: ERR_CONTEST_NOT_FOUND
    http_status: 404
    condition: "contest id in path or body does not exist"
    applies_to: ["GET /contests/{id}", "POST /contests/{id}/canvass-results", "POST /ballot-batches", "POST /ballot-batches/bulk", "POST /audits", "POST /recounts"]
  - id: ERR_BALLOT_BATCH_NOT_FOUND
    http_status: 404
    condition: "ballot batch id in path or in scope_batch_ids does not exist"
    applies_to: ["GET /ballot-batches/{id}", "POST /ballot-batches/{id}/quarantine", "GET /ballot-batches/{id}/custody-events", "POST /recounts"]
  - id: ERR_CUSTODY_EVENT_NOT_FOUND
    http_status: 404
    condition: "custody event id does not exist"
    applies_to: ["GET /custody-events/{id}"]
  - id: ERR_AUDIT_NOT_FOUND
    http_status: 404
    condition: "audit id in path or body does not exist"
    applies_to: ["GET /audits/{id}", "POST /audits/{id}/seed", "POST /audits/{id}/rounds", "POST /audits/{id}/close", "POST /audits/{id}/terminate", "POST /audits/{id}/timeline-review", "GET /audits/{id}/public-report", "POST /recounts"]
  - id: ERR_AUDIT_ROUND_NOT_FOUND
    http_status: 404
    condition: "audit round id does not exist"
    applies_to: ["GET /audit-rounds/{id}"]
  - id: ERR_AUDIT_BATCH_NOT_FOUND
    http_status: 404
    condition: "drawn batch id in path or body does not exist"
    applies_to: ["GET /audit-batches/{id}", "POST /audit-batches/{id}/retrieve", "POST /audit-batches/{id}/return", "POST /manual-tallies"]
  - id: ERR_TALLY_TEAM_NOT_FOUND
    http_status: 404
    condition: "tally team id in path or body does not exist, or X-User-ID of a TallyTeamLead resolves to no team"
    applies_to: ["GET /tally-teams/{id}", "POST /tally-teams/{id}/members", "POST /tally-teams/{id}/disband", "POST /manual-tallies"]
  - id: ERR_MANUAL_TALLY_NOT_FOUND
    http_status: 404
    condition: "manual tally id in path or body does not exist"
    applies_to: ["GET /manual-tallies/{id}", "PATCH /manual-tallies/{id}", "POST /manual-tallies/{id}/submit", "POST /manual-tallies/{id}/reopen", "POST /ballot-interpretations"]
  - id: ERR_DISCREPANCY_NOT_FOUND
    http_status: 404
    condition: "discrepancy id in path or body does not exist"
    applies_to: ["GET /discrepancies/{id}", "POST /discrepancies/{id}/document", "POST /discrepancies/{id}/escalate", "POST /discrepancies/{id}/resolve", "GET /discrepancies/{id}/corrective-actions", "POST /corrective-actions"]
  - id: ERR_BALLOT_INTERPRETATION_NOT_FOUND
    http_status: 404
    condition: "ballot interpretation id does not exist"
    applies_to: ["GET /ballot-interpretations/{id}", "POST /ballot-interpretations/{id}/votes"]
  - id: ERR_RECOUNT_NOT_FOUND
    http_status: 404
    condition: "recount id does not exist"
    applies_to: ["GET /recounts/{id}", "POST /recounts/{id}/deposit", "POST /recounts/{id}/start", "POST /recounts/{id}/complete", "POST /recounts/{id}/withdraw", "POST /recounts/{id}/deny"]
  - id: ERR_CORRECTIVE_ACTION_NOT_FOUND
    http_status: 404
    condition: "corrective action id does not exist"
    applies_to: ["GET /corrective-actions/{id}", "POST /corrective-actions/{id}/transition"]
  - id: ERR_OBSERVER_CREDENTIAL_NOT_FOUND
    http_status: 404
    condition: "credential id does not exist, or the Observer's X-User-ID resolves to no credential"
    applies_to: ["GET /observer-credentials/{id}", "POST /observer-credentials/{id}/revoke", "GET /audits/{id}/public-report"]

  - id: ERR_TALLY_TEAM_MISMATCH
    http_status: 403
    condition: "the acting TallyTeamLead's X-User-ID is not the tally_team_id of the tally being created or acted on"
    applies_to: ["POST /manual-tallies", "PATCH /manual-tallies/{id}", "POST /manual-tallies/{id}/submit", "POST /manual-tallies/{id}/reopen", "POST /ballot-interpretations"]
  - id: ERR_OBSERVER_CREDENTIAL_REVOKED
    http_status: 403
    condition: "the Observer's credential status is REVOKED"
    applies_to: ["GET /audits/{id}/public-report"]
  - id: ERR_OBSERVER_ACCESS_WINDOW_CLOSED
    http_status: 403
    condition: "clock now is outside the half-open [access_start_at, access_end_at) window of the Observer's credential"
    applies_to: ["GET /audits/{id}/public-report"]
  - id: ERR_PUBLIC_REPORT_NOT_PUBLISHED
    http_status: 409
    condition: "Audit.public_report_published is false (the audit is neither COMPLETE nor TERMINATED)"
    applies_to: ["GET /audits/{id}/public-report"]
  - id: ERR_NOT_REQUESTING_PARTY
    http_status: 403
    condition: "X-User-ID differs from Recount.requested_by_user_id"
    applies_to: ["POST /recounts/{id}/deposit", "POST /recounts/{id}/withdraw"]

  - id: ERR_STALE_CONTEST_VERSION
    http_status: 412
    condition: "expected_contest_version != Contest.version"
    applies_to: ["POST /recounts"]
  - id: ERR_STALE_AUDIT_VERSION
    http_status: 412
    condition: "expected_audit_version != Audit.version"
    applies_to: ["POST /audits/{id}/rounds"]
  - id: ERR_STALE_BALLOT_BATCH_VERSION
    http_status: 412
    condition: "expected_ballot_batch_version != BallotBatch.version"
    applies_to: ["POST /audit-batches/{id}/retrieve"]

  - id: ERR_INVALID_ELECTION_STATE
    http_status: 409
    condition: "the election is not in a state from which the requested transition exists (certifying an OPEN or already CERTIFIED election)"
    applies_to: ["POST /elections/{id}/certify", "PATCH /elections/{id}"]
  - id: ERR_INVALID_CONTEST_STATE
    http_status: 409
    condition: "canvassing a contest that is already CANVASSED or CERTIFIED"
    applies_to: ["POST /contests/{id}/canvass-results"]
  - id: ERR_INVALID_BATCH_STATE
    http_status: 409
    condition: "the batch custody_status forbids the operation (returning a batch that is not CHECKED_OUT, retrieving a CHECKED_OUT batch)"
    applies_to: ["POST /audit-batches/{id}/retrieve", "POST /audit-batches/{id}/return", "POST /ballot-batches/{id}/quarantine"]
  - id: ERR_INVALID_AUDIT_STATE
    http_status: 409
    condition: "the audit status forbids the operation (seeding twice, creating a round on a PLANNED audit, closing a TERMINATED audit)"
    applies_to: ["POST /audits/{id}/seed", "POST /audits/{id}/rounds", "POST /audits/{id}/close", "POST /audits/{id}/terminate", "POST /audits/{id}/timeline-review"]
  - id: ERR_INVALID_AUDIT_BATCH_STATE
    http_status: 409
    condition: "the drawn batch retrieval_status forbids the operation (retrieving an already RETRIEVED or RETURNED drawn batch)"
    applies_to: ["POST /audit-batches/{id}/retrieve", "POST /audit-batches/{id}/return"]
  - id: ERR_INVALID_TALLY_STATE
    http_status: 409
    condition: "the tally status forbids the operation (editing a SUBMITTED tally, submitting twice, reopening a VOIDED or CERTIFIED tally, referring a ballot from a DRAFT tally), or a ManualTally of the addressed TallyTeam blocks the requested team transition (a DRAFT or PENDING_ADJUDICATION tally on disbanding a READY team, any tally at all on disbanding a FORMING team)"
    applies_to: ["PATCH /manual-tallies/{id}", "POST /manual-tallies/{id}/submit", "POST /manual-tallies/{id}/reopen", "POST /ballot-interpretations", "POST /tally-teams/{id}/disband"]
  - id: ERR_INVALID_DISCREPANCY_STATE
    http_status: 409
    condition: "the finding status forbids the operation (escalating an OPEN finding, documenting twice, resolving a VOIDED finding)"
    applies_to: ["POST /discrepancies/{id}/document", "POST /discrepancies/{id}/escalate", "POST /discrepancies/{id}/resolve"]
  - id: ERR_INVALID_INTERPRETATION_STATE
    http_status: 409
    condition: "voting on an interpretation that is already ADJUDICATED or DEADLOCKED"
    applies_to: ["POST /ballot-interpretations/{id}/votes"]
  - id: ERR_INVALID_RECOUNT_STATE
    http_status: 409
    condition: "the recount status forbids the operation (funding a DEPOSIT_HELD recount, starting a REQUESTED recount that still owes a deposit, completing a recount that is not IN_PROGRESS, withdrawing a COMPLETED recount)"
    applies_to: ["POST /recounts/{id}/deposit", "POST /recounts/{id}/start", "POST /recounts/{id}/complete", "POST /recounts/{id}/withdraw", "POST /recounts/{id}/deny"]
  - id: ERR_INVALID_CORRECTIVE_ACTION_STATE
    http_status: 409
    condition: "the requested to_status is not reachable from the action's current status (OPEN -> VERIFIED, any transition out of VERIFIED or CANCELLED)"
    applies_to: ["POST /corrective-actions/{id}/transition"]
  - id: ERR_INVALID_TEAM_STATE
    http_status: 409
    condition: "adding members to or disbanding a team whose status forbids it (DISBANDED team)"
    applies_to: ["POST /tally-teams/{id}/members", "POST /tally-teams/{id}/disband"]
  - id: ERR_INVALID_CREDENTIAL_STATE
    http_status: 409
    condition: "revoking a credential that is already REVOKED"
    applies_to: ["POST /observer-credentials/{id}/revoke"]

  - id: ERR_CONTEST_NOT_CANVASSED
    http_status: 409
    condition: "the contest is still PENDING_CANVASS, so it has no margin to size a sample or price a recount against"
    applies_to: ["POST /audits/{id}/seed", "POST /recounts"]
  - id: ERR_ELECTION_NOT_CANVASSED
    http_status: 409
    condition: "the election is not CANVASSED where the operation requires it"
    applies_to: ["POST /elections/{id}/certify", "POST /recounts/{id}/start"]
  - id: ERR_ELECTION_ALREADY_CERTIFIED
    http_status: 409
    condition: "the election is CERTIFIED and therefore frozen"
    applies_to: ["POST /contests", "POST /ballot-batches", "POST /ballot-batches/bulk", "POST /audits", "POST /recounts", "POST /manual-tallies", "PATCH /elections/{id}"]
  - id: ERR_AUDIT_NOT_TERMINAL
    http_status: 409
    condition: "an audit of the contest is outside {COMPLETE, TERMINATED} when a recount starts or the election certifies"
    applies_to: ["POST /recounts/{id}/start", "POST /elections/{id}/certify"]
  - id: ERR_RECOUNT_NOT_TERMINAL
    http_status: 409
    condition: "a recount of the election is outside {COMPLETED, WITHDRAWN, DENIED} when the election certifies"
    applies_to: ["POST /elections/{id}/certify"]
  - id: ERR_TALLY_TEAM_NOT_READY
    http_status: 409
    condition: "the assigned team is FORMING or DISBANDED"
    applies_to: ["POST /manual-tallies", "POST /manual-tallies/{id}/submit"]

  - id: ERR_BATCH_QUARANTINED
    http_status: 409
    condition: "the physical batch is QUARANTINED"
    applies_to: ["POST /audit-batches/{id}/retrieve", "POST /audit-batches/{id}/return", "POST /manual-tallies", "POST /manual-tallies/{id}/submit", "POST /recounts"]
  - id: ERR_RETRIEVAL_NOT_AUTHORIZED
    http_status: 409
    condition: "BallotBatch.retrieval_authorized_at is null"
    applies_to: ["POST /audit-batches/{id}/retrieve"]
  - id: ERR_SEAL_NUMBER_MISMATCH
    http_status: 409
    condition: "observed_seal_number != BallotBatch.current_seal_number on retrieval, or reseal_number equals the current seal on return"
    applies_to: ["POST /audit-batches/{id}/retrieve", "POST /audit-batches/{id}/return"]
  - id: ERR_BATCH_NOT_CHECKED_OUT
    http_status: 409
    condition: "a hand count is created, edited or submitted while the batch is not CHECKED_OUT"
    applies_to: ["POST /manual-tallies", "PATCH /manual-tallies/{id}", "POST /manual-tallies/{id}/submit"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    condition: "a board member votes on an interpretation of a tally produced by their own team, or the verifier of a corrective action is the user who completed it"
    applies_to: ["POST /ballot-interpretations/{id}/votes", "POST /corrective-actions/{id}/transition"]
  - id: ERR_TEAM_NOT_BIPARTISAN
    http_status: 409
    condition: "the submitting team lacks a DEM or a REP member"
    applies_to: ["POST /manual-tallies/{id}/submit"]

  - id: ERR_CROSS_ELECTION_REFERENCE
    http_status: 422
    condition: "referenced rows belong to different elections (batch contest_id outside election_id, tally pairing an AuditBatch and a TallyTeam from different elections)"
    applies_to: ["POST /ballot-batches", "POST /ballot-batches/bulk", "POST /manual-tallies", "POST /observer-credentials"]
  - id: ERR_BATCH_NOT_IN_CONTEST
    http_status: 422
    condition: "a batch named in scope_batch_ids does not belong to the recounted contest"
    applies_to: ["POST /recounts"]
  - id: ERR_CANDIDATE_NAME_UNKNOWN
    http_status: 422
    condition: "a vote-map's keys do not match Contest.candidate_names exactly, or proposed_determination is neither a candidate name nor NO_VOTE"
    applies_to: ["POST /contests/{id}/canvass-results", "POST /ballot-batches", "POST /ballot-batches/bulk", "PATCH /manual-tallies/{id}", "POST /ballot-interpretations", "POST /recounts/{id}/complete"]

  - id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    condition: "start instant is not strictly before end instant, certification_deadline_at is not after the election date, or due_at is not after clock now"
    applies_to: ["POST /elections", "PATCH /elections/{id}", "POST /manual-tallies", "POST /observer-credentials", "POST /corrective-actions"]
  - id: ERR_RECOUNT_REQUEST_WINDOW_CLOSED
    http_status: 409
    condition: "clock now is past Contest.recount_request_deadline_at for a CANDIDATE_REQUESTED recount"
    applies_to: ["POST /recounts"]
  - id: ERR_CERTIFICATION_DEADLINE_PASSED
    http_status: 409
    condition: "clock now is at or after Election.effective_certification_deadline_at"
    applies_to: ["POST /elections/{id}/certify"]
  - id: ERR_TEAM_SESSION_OVERLAP
    http_status: 409
    condition: "the new session's half-open interval overlaps a live session of the same team"
    applies_to: ["POST /manual-tallies"]
  - id: ERR_BATCH_SESSION_OVERLAP
    http_status: 409
    condition: "the new session falls inside the 30-minute reseal buffer around a live session on the same physical batch"
    applies_to: ["POST /manual-tallies"]
  - id: ERR_OBSERVER_ROOM_CAPACITY_EXCEEDED
    http_status: 409
    condition: "issuing the credential would put more than 2 ACTIVE credentials in one room over an overlapping window"
    applies_to: ["POST /observer-credentials"]

  - id: ERR_AUDIT_CONFIG_INVALID
    http_status: 422
    condition: "audit parameters contradict audit_type (alpha supplied for FIXED_PERCENTAGE, percentage supplied for RISK_LIMITING, required parameter missing)"
    applies_to: ["POST /audits"]
  - id: ERR_DUPLICATE_CONTEST_LABEL
    http_status: 409
    condition: "contest_label already used inside the election"
    applies_to: ["POST /contests"]
  - id: ERR_DUPLICATE_BATCH_LABEL
    http_status: 409
    condition: "batch_label already used inside the contest, or repeated inside a bulk payload"
    applies_to: ["POST /ballot-batches", "POST /ballot-batches/bulk"]
  - id: ERR_DUPLICATE_TEAM_LABEL
    http_status: 409
    condition: "team_label already used inside the election"
    applies_to: ["POST /tally-teams"]
  - id: ERR_BALLOT_ACCOUNTING_EXCEEDED
    http_status: 422
    condition: "reported, batched or recounted votes exceed Contest.ballots_cast"
    applies_to: ["POST /contests/{id}/canvass-results", "POST /ballot-batches", "POST /ballot-batches/bulk", "POST /recounts/{id}/complete"]
  - id: ERR_NO_UNSAMPLED_BATCHES
    http_status: 409
    condition: "no eligible unsampled batch remains for a new round or a full hand count"
    applies_to: ["POST /audits/{id}/rounds", "POST /discrepancies/{id}/escalate"]
  - id: ERR_DUPLICATE_TALLY
    http_status: 409
    condition: "a live ManualTally already exists for the drawn batch"
    applies_to: ["POST /manual-tallies"]
  - id: ERR_TALLY_BALLOT_COUNT_MISMATCH
    http_status: 422
    condition: "sum(counted_votes) + ambiguous_ballot_count + no_vote_count != AuditBatch.ballot_count"
    applies_to: ["POST /manual-tallies/{id}/submit"]
  - id: ERR_REOPEN_LIMIT_EXCEEDED
    http_status: 409
    condition: "ManualTally.reopen_count has reached MAX_TALLY_REOPENS (2)"
    applies_to: ["POST /manual-tallies/{id}/reopen"]
  - id: ERR_INTERPRETATION_LIMIT_EXCEEDED
    http_status: 409
    condition: "referring more ambiguous ballots than ManualTally.ambiguous_ballot_count"
    applies_to: ["POST /ballot-interpretations"]
  - id: ERR_DUPLICATE_BALLOT_REF
    http_status: 409
    condition: "ballot_ref already referred for the same tally"
    applies_to: ["POST /ballot-interpretations"]
  - id: ERR_DUPLICATE_BOARD_VOTE
    http_status: 409
    condition: "X-User-ID already appears in BallotInterpretation.board_votes"
    applies_to: ["POST /ballot-interpretations/{id}/votes"]
  - id: ERR_TALLY_INCOMPLETE
    http_status: 409
    condition: "a drawn batch of a live round has tally_status != COUNTED when the audit is closed"
    applies_to: ["POST /audits/{id}/close"]
  - id: ERR_BATCH_NOT_RETURNED
    http_status: 409
    condition: "a counted batch is still CHECKED_OUT when the audit is closed"
    applies_to: ["POST /audits/{id}/close"]
  - id: ERR_DEADLOCKED_INTERPRETATION_PENDING
    http_status: 409
    condition: "an interpretation of the audit's tallies is PENDING or DEADLOCKED when the audit is closed"
    applies_to: ["POST /audits/{id}/close"]
  - id: ERR_UNRESOLVED_DISCREPANCY
    http_status: 409
    condition: "a finding of the audit is OPEN or ESCALATED when the audit is closed or the election certifies"
    applies_to: ["POST /audits/{id}/close", "POST /elections/{id}/certify"]
  - id: ERR_EQUIPMENT_ACTION_UNVERIFIED
    http_status: 409
    condition: "an EQUIPMENT corrective action of the finding is not VERIFIED or CANCELLED"
    applies_to: ["POST /discrepancies/{id}/resolve", "POST /elections/{id}/certify"]
  - id: ERR_MARGIN_NOT_RECOUNT_ELIGIBLE
    http_status: 409
    condition: "Contest.margin_pct exceeds REQUEST_ELIGIBLE_MARGIN_PCT for a CANDIDATE_REQUESTED recount"
    applies_to: ["POST /recounts"]
  - id: ERR_RECOUNT_SCOPE_OVERLAP
    http_status: 409
    condition: "the requested scope shares a batch with a live recount of the same contest"
    applies_to: ["POST /recounts"]

  - id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 402
    condition: "amount_cents != Recount.required_deposit_cents"
    applies_to: ["POST /recounts/{id}/deposit"]
  - id: ERR_DEPOSIT_NOT_REQUIRED
    http_status: 409
    condition: "funding a recount whose deposit_status is NOT_REQUIRED"
    applies_to: ["POST /recounts/{id}/deposit"]

# =============================================================================
# §1.7 RBAC Permission Matrix
# Identity: `opaque` roles are identified by X-User-Role alone (X-User-ID is an
# arbitrary opaque string used only for segregation-of-duties comparisons);
# `entity_backed` roles carry an X-User-ID that must equal the id of the named
# entity row.
# =============================================================================
roles:
  - name: ElectionsDirector
    description: "State elections division director. Owns election and contest set-up, canvass, recount administration, observer credentialing, audit termination, election certification and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /elections"
      - "PATCH /elections/{id}"
      - "POST /elections/{id}/certify"
      - "POST /contests"
      - "POST /contests/{id}/canvass-results"
      - "POST /tally-teams"
      - "POST /tally-teams/{id}/members"
      - "POST /tally-teams/{id}/disband"
      - "POST /audits/{id}/terminate"
      - "POST /recounts/{id}/start"
      - "POST /recounts/{id}/complete"
      - "POST /recounts/{id}/deny"
      - "POST /observer-credentials"
      - "POST /observer-credentials/{id}/revoke"
    shared_operations:
      - "POST /recounts (shared with CandidateRepresentative; the director files AUTOMATIC_MARGIN and AUDIT_ESCALATION recounts)"
      - "every GET endpoint except the Observer-only path into GET /audits/{id}/public-report"

  - name: AuditManager
    description: "Audit unit manager. Plans audits, runs the seed ceremony, draws rounds, reviews the timeline and closes audits."
    identity: opaque
    exclusive_operations:
      - "POST /audits"
      - "POST /audits/{id}/seed"
      - "POST /audits/{id}/rounds"
      - "POST /audits/{id}/close"
      - "POST /audits/{id}/timeline-review"
    shared_operations:
      - "GET /audits/{id}/public-report (shared with ElectionsDirector, CandidateRepresentative, Observer)"
      - "every other GET endpoint"

  - name: CustodyOfficer
    description: "Secure-storage custodian. Registers batches, retrieves and reseals them under seal attestation, and quarantines evidence."
    identity: opaque
    exclusive_operations:
      - "POST /ballot-batches"
      - "POST /ballot-batches/bulk"
      - "POST /ballot-batches/{id}/quarantine"
      - "POST /audit-batches/{id}/retrieve"
      - "POST /audit-batches/{id}/return"
    shared_operations:
      - "GET /elections, GET /contests, GET /ballot-batches, GET /custody-events and the audit/round/batch/tally read endpoints"

  - name: TallyTeamLead
    description: "Lead of a bipartisan hand-count team. Opens, records, submits and reopens the team's tallies and refers ambiguous ballots to the board."
    identity: "entity_backed:TallyTeam"
    exclusive_operations:
      - "POST /manual-tallies"
      - "PATCH /manual-tallies/{id}"
      - "POST /manual-tallies/{id}/submit"
      - "POST /manual-tallies/{id}/reopen"
      - "POST /ballot-interpretations"
    shared_operations:
      - "GET endpoints on elections, contests, batches, audits, rounds, drawn batches, tallies, interpretations and discrepancies"
    note: "X-User-ID must equal the TallyTeam.id of the team that owns the tally; another team's lead receives ERR_TALLY_TEAM_MISMATCH."

  - name: CanvassingBoardMember
    description: "Canvassing board member. Documents, escalates and resolves findings, votes on voter-intent determinations, and raises and verifies corrective actions."
    identity: opaque
    exclusive_operations:
      - "POST /discrepancies/{id}/document"
      - "POST /discrepancies/{id}/escalate"
      - "POST /discrepancies/{id}/resolve"
      - "POST /ballot-interpretations/{id}/votes"
      - "POST /corrective-actions"
      - "POST /corrective-actions/{id}/transition"
    shared_operations:
      - "GET endpoints on elections, contests, batches, audits, tallies, interpretations, discrepancies, corrective actions, teams, recounts and credentials"
    note: "X-User-ID is compared against TallyTeam.members[].user_id for segregation of duties, and against CorrectiveAction.completed_by_user_id on verification."

  - name: CandidateRepresentative
    description: "Authorised representative of a candidate. Files, funds and withdraws candidate-requested recounts and reads public audit material."
    identity: opaque
    exclusive_operations:
      - "POST /recounts/{id}/deposit"
      - "POST /recounts/{id}/withdraw"
    shared_operations:
      - "POST /recounts (shared with ElectionsDirector; only CANDIDATE_REQUESTED trigger_type)"
      - "GET /audits/{id}/public-report and the read endpoints on elections, contests, batches, custody events, audits, rounds, tallies, discrepancies, corrective actions, interpretations, recounts and credentials"
    note: "X-User-ID is recorded as Recount.requested_by_user_id at filing; only that user may fund or withdraw the recount."

  - name: Observer
    description: "Credentialed public observer. Reads the published audit report for the election covered by an active credential inside its access window."
    identity: "entity_backed:ObserverCredential"
    exclusive_operations: []
    shared_operations:
      - "GET /audits/{id}/public-report (shared with ElectionsDirector, AuditManager, CandidateRepresentative)"
    note: "X-User-ID must equal the ObserverCredential.id; the credential must be ACTIVE, clock now must be inside [access_start_at, access_end_at), and the audit must be published."
