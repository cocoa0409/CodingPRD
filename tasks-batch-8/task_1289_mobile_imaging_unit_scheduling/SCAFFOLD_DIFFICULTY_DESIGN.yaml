            - { call: "POST /api/contracts", payload: { facility_id: "${fac_b}", billing_model: "PER_DAY", day_rate_cents: 500000, scan_rate_cents: 40000, included_scan_quota: 10, overage_scan_rate_cents: 45000, guaranteed_minimum_cents: 200000, no_show_fee_cents: 10000, cancel_notice_hours: 48, cancel_late_pct: 0.5, monthly_scan_cap: 100, interruption_floor_cents: 100000 }, as: OperationsDirector, captures: { c_b: $.data.id } }
            - { call: "POST /api/route-plans", payload: { unit_id: "${unit}", week_start_date: "2026-08-03", expected_unit_version: "${unit_v}" }, as: OperationsDirector, captures: { plan: $.data.id } }
            - { call: "POST /api/site-days", payload: { route_plan_id: "${plan}", facility_id: "${fac_a}", contract_id: "${c_a}", service_date: "2026-08-04", arrival_time: "07:00", first_patient_time: "08:30", last_patient_time: "16:00", departure_time: "17:00" }, as: OperationsDirector, captures: { sd1: $.data.id } }
            - { call: "POST /api/route-plans/${plan}/publish", payload: {}, as: OperationsDirector }
          trigger:
            - { call: "POST /api/site-days", payload: { route_plan_id: "${plan}", facility_id: "${fac_b}", contract_id: "${c_b}", service_date: "2026-08-04", arrival_time: "17:30", first_patient_time: "18:30", last_patient_time: "20:00", departure_time: "20:45" }, as: OperationsDirector, captures: { err: $.data.error_id } }
            - { call: "POST /api/site-days", payload: { route_plan_id: "${plan}", facility_id: "${fac_b}", contract_id: "${c_b}", service_date: "2026-08-05", arrival_time: "07:00", first_patient_time: "08:30", last_patient_time: "16:00", departure_time: "17:00" }, as: OperationsDirector, captures: { sd2: $.data.id } }
          assert:
            - "Same unit + same service_date with disjoint evening window -> ERR_UNIT_DAY_DOUBLE_BOOKED (${err}), HTTP 409 — capacity is whole-day, not interval overlap"
            - "Same evening window on the next date succeeds (${sd2})"

