      - name: stop_sequence_conflict_on_same_route
        claim_type: error_triggerable
        grounds: ["errors[ERR_STOP_SEQUENCE_CONFLICT]", "validations[priority=12]"]
        distinguishing_aspect: "stop_sequence is unique per route: reusing sequence 1 for a different farm on the same route returns 409 ERR_STOP_SEQUENCE_CONFLICT even though capacity and dates are fine."
        test_recipe:
          setup: ["ACTIVE farms A and B (B's audit completed at 10:00 for clock monotonicity); route R with stop sequence 1 taken by A"]
          setup_api_calls:
            - call: "POST /farm-network/farms"
