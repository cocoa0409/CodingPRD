      - name: client_cannot_perform_agent_or_admin_exclusive_operations
        claim_type: rbac_denied
        grounds:
          - rbac.Client
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          The client is the paying party but has no deal-desk or back-office authority: qualifying
          an inquiry, quoting an option, drafting a contract, delivering and creating a speaker are
          all 403 ERR_UNAUTHORIZED even though the client legitimately owns the inquiry.
        test_recipe:
          setup:
            - "A QUALIFIED inquiry owned by the calling client, plus a DRAFT proposal"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /speakers"
              payload: { full_name: "Dana Reyes", topics: ["AI_STRATEGY", "LEADERSHIP"], fee_floor_cents: 1000000, fee_ceiling_cents: 2000000, travel_class: "PREMIUM", travel_buffer_days: 1, tax_form_status: "ON_FILE" }
