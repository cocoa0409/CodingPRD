  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_creation_blocked_by_quarantined_asset
        grounds:
          - validations[priority 34].ERR_ASSET_QUARANTINED
          - validations[priority 36].ERR_OPEN_SPILL_INCIDENT
          - state_machines.DeliveryAsset.QUARANTINED_to_AVAILABLE
          - state_machines.SpillIncident.OPEN_to_CLOSED
          - entities.DeliveryAsset.fields.status
        distinguishing_aspect: |
          The DeliveryOrder create path is gated by the state of a sibling aggregate
          (DeliveryAsset) rather than by anything on its own nomination: the nomination is
          APPROVED and CONFIRMED and every temporal and capacity rule passes, yet the create is
          rejected with ERR_ASSET_QUARANTINED purely because the chosen asset sits in
          QUARANTINED, and it only succeeds after the SpillIncident is closed and the quarantine
          lifted - a two-entity precondition chain (SpillIncident -> DeliveryAsset -> DeliveryOrder).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T06:30:00Z"
            - "Port NLRTM, grade MGO-DMA, index quote 705.00, customer with credit_limit_usd 5000000.00"
            - "Barge Alpha carried order A (CLEARED) when a MAJOR spill of 250.00 litres was reported, so the asset is QUARANTINED with an OPEN incident and compliance_score 55.00"
            - "Nomination C for 500.000 mt is compliance APPROVED and fulfillment CONFIRMED with window 2026-08-12T06:00:00Z to 2026-08-13T06:00:00Z"
