          CareCycle windows are HALF-OPEN [period_start, period_end) on the Retainer resource — a
          different interval semantics than License: a second cycle [2026-04-01,2026-05-01) that
          starts exactly where [2026-03-01,2026-04-01) ends does NOT overlap (touching endpoints are
          disjoint under half-open), so it is accepted; only a window that genuinely straddles the
          boundary triggers ERR_INTERVAL_OVERLAP.
        test_recipe:
          setup:
            - "ACTIVE Retainer with one CareCycle [2026-03-01,2026-04-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: StudioOps
            - call: "POST /studios"
              payload: { name: "Hophaus" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "Pi", contact_email: "p@pi.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/retainers"
              payload: { client_id: "${cid}", monthly_fee_cents: 100000, included_hours: 10, tier1_rate_cents: 5000, tier2_rate_cents: 8000 }
              as: StudioOps
              captures: { rid: $.data.id }
            - call: "POST /studios/${sid}/retainers/${rid}/care-cycles"
              payload: { period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", hours_used: 3 }
              as: StudioOps
              captures: { cc1: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/retainers/${rid}/care-cycles"
              payload: { period_start: "2026-04-01T00:00:00Z", period_end: "2026-05-01T00:00:00Z", hours_used: 2 }
              as: StudioOps
              captures: { cc2: $.data.id }
            - call: "POST /studios/${sid}/retainers/${rid}/care-cycles"
              payload: { period_start: "2026-03-15T00:00:00Z", period_end: "2026-04-15T00:00:00Z", hours_used: 1 }
              as: StudioOps
          assert:
            - "Touching cycle [2026-04-01,2026-05-01) is ACCEPTED (201) — half-open endpoints do not overlap, unlike License closed intervals"
            - "Straddling cycle [2026-03-15,2026-04-15) error_id == ERR_INTERVAL_OVERLAP (http 409)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_credit_conservation_across_two_invoices
        grounds:
          - calculations.invoice_net_due
          - entities.Invoice.fields.deposit_credit_cents
          - entities.Project.fields.deposit_collected_cents
          - state_machines.Milestone.PENDING_to_INVOICED
        distinguishing_aspect: |
          Conserved quantity = total deposit credit applied. With deposit_collected_cents=12000, the
          sum of deposit_credit_cents across all of a project's invoices must equal exactly 12000
          (12000 on invoice 1, 0 on invoice 2) — the deposit is consumed once and never double-credited.
        test_recipe:
          setup:
            - "Project deposit_pct=0.30, deposit_collected_cents=12000, in DELIVERY with two 40000 milestones."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Conhaus", tax_rate: 0.0 }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "Rho", contact_email: "r@rho.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "Rho Brand", service_type: "IDENTITY", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M1", amount_cents: 40000, sequence_index: 1 }
              as: StudioOps
              captures: { m1: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M2", amount_cents: 40000, sequence_index: 2 }
              as: StudioOps
              captures: { m2: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/deposits"
              payload: { amount_cents: 12000 }
              as: BillingOps
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/moodboards"
              payload: { title: "MB" }
              as: Designer
              captures: { mb: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/submit"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/advance"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/concepts"
              payload: { label: "Route A" }
              as: Designer
              captures: { con: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/present"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/advance"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/invoices"
              payload: { milestone_id: "${m1}", due_date: "2026-04-01T00:00:00Z" }
              as: BillingOps
              captures: { inv1: $.data.id, credit1: $.data.deposit_credit_cents }
          trigger:
            - call: "POST /studios/${sid}/invoices"
              payload: { milestone_id: "${m2}", due_date: "2026-04-01T00:00:00Z" }
              as: BillingOps
              captures: { inv2: $.data.id, credit2: $.data.deposit_credit_cents }
          assert:
            - "Invoice.${inv1}.deposit_credit_cents == 12000"
            - "Invoice.${inv2}.deposit_credit_cents == 0"
            - "Invoice.${inv1}.deposit_credit_cents + Invoice.${inv2}.deposit_credit_cents == 12000 (== Project.deposit_collected_cents; deposit credit is conserved, never double-counted)"

      - name: cancel_compensation_reverts_milestone_and_leaves_no_invoiced_drift
        grounds:
          - state_machines.Project.DELIVERY_to_HANDOFF
          - state_machines.Project.CONCEPT_to_CANCELLED
          - state_machines.Invoice.ISSUED_to_VOID
          - state_machines.Milestone.PENDING_to_INVOICED
          - entities.Milestone.fields.status
        distinguishing_aspect: |
          A different conserved quantity = count of milestones in INVOICED. The forward action
          (issue invoice) moves the milestone PENDING->INVOICED; the compensating cancellation
          cascade voids the invoice and reverts the milestone INVOICED->PENDING, so after cancel the
          number of INVOICED milestones is back to 0 — no INVOICED drift remains.
        test_recipe:
          setup:
            - "Project in DELIVERY with one 40000 milestone INVOICED (its invoice ISSUED), still cancellable."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Drifthaus" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "Sig", contact_email: "s@sig.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "Sig Brand", service_type: "IDENTITY", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M1", amount_cents: 40000, sequence_index: 1 }
              as: StudioOps
              captures: { mid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/deposits"
              payload: { amount_cents: 12000 }
              as: BillingOps
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/moodboards"
              payload: { title: "MB" }
              as: Designer
              captures: { mb: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/submit"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/advance"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/concepts"
              payload: { label: "Route A" }
              as: Designer
              captures: { con: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/present"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/advance"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/invoices"
              payload: { milestone_id: "${mid}", due_date: "2026-04-01T00:00:00Z" }
              as: BillingOps
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/projects/${pid}/cancel"
              payload: {}
              as: StudioOps
            - call: "GET /studios/${sid}/projects/${pid}/milestones/${mid}"
              payload: {}
              as: StudioOps
              captures: { ms_status: $.data.status }
            - call: "GET /studios/${sid}/invoices/${inv}"
              payload: {}
              as: BillingOps
              captures: { inv_status: $.data.status }
          assert:
            - "Invoice.${inv}.status == VOID after cancel"
            - "Milestone.${mid}.status == PENDING after cancel (reverted from INVOICED)"
            - "Count of INVOICED milestones on Project.${pid} == 0 after compensation (no drift)"
