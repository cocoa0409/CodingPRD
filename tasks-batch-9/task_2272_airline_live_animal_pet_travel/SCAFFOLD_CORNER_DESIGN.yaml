        distinguishing_aspect: "Five machines are exercised in one chain and every freshly created row sits in its declared initial state - leg SCHEDULED, reservation PENDING with compliance UNVERIFIED, animal DRAFT, segment RESERVED, document SUBMITTED - with no transition having been triggered."
