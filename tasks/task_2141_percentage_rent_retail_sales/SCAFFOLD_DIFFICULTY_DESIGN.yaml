  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: accept_report_cascades_to_lease_watchlist_depth_five
        grounds:
          - state_machines.SalesReport.SUBMITTED_to_ACCEPTED
          - calculations.percentage_rent_charge
          - calculations.occupancy_cost_ratio
          - entities.Lease.fields.occupancy_cost_ratio_bps
          - entities.Lease.fields.watchlist_status
          - entities.ReportingLedgerEntry.fields.delta_billed_cents
        distinguishing_aspect: |
          Trigger is report acceptance; each hop is caused by the previous one -
          accept -> LeaseYear.cumulative_net_sales_cents 60,000,000 -> because that crossed the
          40,000,000 breakpoint a 1,200,000 PERIODIC charge is ISSUED -> because
          cumulative_billed_cents rose, ytd_occupancy_cost_cents becomes 9,200,000 ->
          because that ratio is 1533 bps, watchlist_status flips NORMAL -> WATCHLIST.
        test_recipe:
          setup:
            - "One ACTIVE lease with annual_base_rent_cents 48000000, ARTIFICIAL breakpoint 40000000, rate 600, MONTHLY, CUMULATIVE_YTD."
            - "LeaseYear 1 has an ACCEPTED September report at 39,000,000 gross, so cumulative_net_sales_cents is 39,000,000, cumulative_billed_cents is 0, Lease.occupancy_cost_ratio_bps is 1025 and watchlist_status is NORMAL."
            - "The October report is SUBMITTED at 21,000,000 gross with no exclusions."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
