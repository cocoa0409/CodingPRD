  # ===========================================================================
  - section: validations
    instances:
      - name: patch_account_with_past_contract_end_date_returns_contract_end_in_past
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - errors.ERR_CONTRACT_END_IN_PAST
          - endpoints[id=E4]
        distinguishing_aspect: "A contract_end_date of 2026-07-01 is before the logical clock date 2026-08-01, so PATCH /accounts/{id} returns ERR_CONTRACT_END_IN_PAST (422) and the stored 2026-12-31 survives."
        test_recipe:
          setup:
            - "One ENTERPRISE Account with contract_end_date 2026-12-31; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "PATCH /accounts/${acct_id}"
              payload: { contract_end_date: "2026-07-01" }
              as: CsOpsAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 and data.error_id == \"ERR_CONTRACT_END_IN_PAST\"."
            - "Account.${acct_id}.contract_end_date == \"2026-12-31\" and version == 1 (no write happened)."

      - name: milestone_completed_out_of_sequence_returns_sequence_violation
        claim_type: violation_to_error
        grounds:
          - validations[priority=22]
          - errors.ERR_MILESTONE_SEQUENCE_VIOLATION
        distinguishing_aspect: "Completing sequence_index 2 while sequence_index 1 is still PENDING returns ERR_MILESTONE_SEQUENCE_VIOLATION (422); the account stays ONBOARDING because no milestone reached a terminal state."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
            - "One ENTERPRISE Account in ONBOARDING with two PENDING milestones: KICKOFF sequence_index 1 due 2026-08-10 and DATA_INTEGRATION sequence_index 2 due 2026-08-20."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/onboarding-milestones"
              payload: { milestone_code: "KICKOFF", sequence_index: 1, due_date: "2026-08-10" }
              as: CsOpsAdmin
              captures: { ms1_id: $.data.id }
            - call: "POST /accounts/${acct_id}/onboarding-milestones"
              payload: { milestone_code: "DATA_INTEGRATION", sequence_index: 2, due_date: "2026-08-20" }
              as: CsOpsAdmin
              captures: { ms2_id: $.data.id }
          trigger:
            - call: "POST /onboarding-milestones/${ms2_id}/transition"
              payload: { action: "COMPLETE", completed_date: "2026-08-05" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 and data.error_id == \"ERR_MILESTONE_SEQUENCE_VIOLATION\"."
            - "OnboardingMilestone.${ms2_id}.state == \"PENDING\" and completed_date is null and days_late is null."
            - "OnboardingMilestone.${ms1_id}.state == \"PENDING\"."
            - "Account.${acct_id}.lifecycle_state == \"ONBOARDING\"."

      - name: duplicate_milestone_code_on_the_same_account_returns_conflict
        claim_type: violation_to_error
        grounds:
          - validations[priority=23]
          - errors.ERR_MILESTONE_CODE_DUPLICATE
        distinguishing_aspect: "A second KICKOFF milestone on the same account returns ERR_MILESTONE_CODE_DUPLICATE (409) even with a different sequence_index, so uniqueness is on the code, not the index alone."
        test_recipe:
          setup:
            - "One ENTERPRISE Account in ONBOARDING with exactly one PENDING KICKOFF milestone, sequence_index 1, due_date 2026-08-10."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/onboarding-milestones"
              payload: { milestone_code: "KICKOFF", sequence_index: 1, due_date: "2026-08-10" }
              as: CsOpsAdmin
              captures: { ms1_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/onboarding-milestones"
              payload: { milestone_code: "KICKOFF", sequence_index: 3, due_date: "2026-09-10" }
              as: CsOpsAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_MILESTONE_CODE_DUPLICATE\"."
            - "GET /accounts/${acct_id}/onboarding-milestones returns exactly 1 item, id == ${ms1_id}."

      - name: duplicate_fiscal_period_on_the_same_account_returns_conflict
        claim_type: violation_to_error
        grounds:
          - validations[priority=24]
          - errors.ERR_FORECAST_PERIOD_DUPLICATE
        distinguishing_aspect: "fiscal_period 2026Q4 is unique per account across all RenewalForecast rows, so the second create returns ERR_FORECAST_PERIOD_DUPLICATE (409) while the first row stays in cs_state DRAFT."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
            - "One ENTERPRISE Account, arr_cents 30000000, coverage_posture RESTRICTED (not FROZEN, so forecast creation is permitted)."
            - "One RenewalForecast for fiscal_period 2026Q4 in cs_state DRAFT / finance_state PENDING."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /renewal-forecasts"
              payload: { account_id: "${acct_id}", fiscal_period: "2026Q4" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { fc1_id: $.data.id }
          trigger:
            - call: "POST /renewal-forecasts"
              payload: { account_id: "${acct_id}", fiscal_period: "2026Q4" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_FORECAST_PERIOD_DUPLICATE\"."
            - "GET /accounts/${acct_id}/renewal-forecasts returns exactly 1 item, id == ${fc1_id}."
            - "RenewalForecast.${fc1_id}.cs_state == \"DRAFT\" and finance_state == \"PENDING\"."

      - name: coverage_assignment_before_segmentation_returns_coverage_tier_unassigned
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors.ERR_COVERAGE_TIER_UNASSIGNED
          - entities.Account.fields.coverage_tier
        distinguishing_aspect: "With coverage_tier still UNASSIGNED, POST /coverage-assignments returns ERR_COVERAGE_TIER_UNASSIGNED (409) even though the account version supplied is current and an eligible HIGH_TOUCH CSM exists."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
            - "One ENTERPRISE Account on which POST /accounts/{id}/segmentation has never run, so coverage_tier is UNASSIGNED and version is 1."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id, acct_v1: $.data.version }
          trigger:
            - call: "POST /coverage-assignments"
              payload: { account_id: "${acct_id}", expected_account_version: "${acct_v1}", csm_id: "${csm_a_id}" }
              as: CsOpsAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_COVERAGE_TIER_UNASSIGNED\"."
            - "GET /coverage-assignments?account_id=${acct_id} returns 0 items."
            - "Csm.${csm_a_id}.capacity_units_committed == 0 and capacity_units_available == 40."
            - "Account.${acct_id}.coverage_tier == \"UNASSIGNED\" and coverage_posture == \"RESTRICTED\"."

      - name: coverage_assignment_after_segmentation_succeeds
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=15]
          - calculations.coverage_tier_assignment
          - calculations.coverage_load_units
          - state_machines.CoverageAssignment.QUEUED_to_COMMITTED
        distinguishing_aspect: "The same call that failed pre-segmentation succeeds once segmentation sets coverage_tier HIGH_TOUCH: the assignment lands COMMITTED with load_units 19 (RED risk multiplier) and flips coverage_posture to OPEN."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
            - "One ENTERPRISE Account with no signals, so health_tier is RED, then POST /accounts/{id}/segmentation which sets coverage_tier HIGH_TOUCH (arr floor 25000000)."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/segmentation"
              payload: {}
              as: CsOpsAdmin
              captures: { acct_v_seg: $.data.version }
          trigger:
            - call: "POST /coverage-assignments"
              payload: { account_id: "${acct_id}", expected_account_version: "${acct_v_seg}", csm_id: "${csm_a_id}" }
              as: CsOpsAdmin
              captures: { ca1_id: $.data.id }
          assert:
            - "HTTP 201 and CoverageAssignment.${ca1_id}.state == \"COMMITTED\" and coverage_tier == \"HIGH_TOUCH\"."
            - "CoverageAssignment.${ca1_id}.load_units == 19 (round2(9*1.50*1.25) = 16.88, + ARR surcharge 2 = 18.88, ceil = 19)."
            - "CoverageAssignment.${ca1_id}.committed_at == \"2026-08-01T00:00:00Z\" and released_at is null and superseded_by_assignment_id is null."
            - "Csm.${csm_a_id}.capacity_units_committed == 19 and capacity_units_available == 21."
            - "Account.${acct_id}.assigned_csm_id == ${csm_a_id} and coverage_posture == \"OPEN\"."

      - name: remediation_commitment_credit_above_the_arr_cap_returns_credit_exceeds_cap
        claim_type: violation_to_error
        grounds:
          - validations[priority=29]
          - errors.ERR_CREDIT_EXCEEDS_CAP
        distinguishing_aspect: "COMMITMENT_CREDIT_CAP_BP 1000 of arr_cents 30000000 is exactly 3000000 cents: 3000001 returns ERR_CREDIT_EXCEEDS_CAP (422) while 3000000 is admitted, so the cap is an inclusive ceiling."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
            - "One ENTERPRISE Account, arr_cents 30000000, health_tier RED (no signals) so a SavePlay may be activated."
            - "One ACTIVE SavePlay and one OPEN EscalationCase on that account."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /save-plays"
              payload: { account_id: "${acct_id}", owner_csm_id: "${csm_a_id}", risk_code: "SUPPORT_ESCALATION", play_type: "TECHNICAL_REMEDIATION", window_start_date: "2026-08-05", window_end_date: "2026-08-20" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /save-plays/${sp_id}/transition"
              payload: { action: "ACTIVATE" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /escalation-cases"
              payload: { account_id: "${acct_id}", save_play_id: "${sp_id}", severity: "CRITICAL", summary: "Sev1 backlog with executive attention" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { esc_id: $.data.id, esc_v: $.data.version }
          trigger:
            - call: "POST /escalation-cases/${esc_id}/remediation-commitments"
              payload: { description: "Credit one cent above the cap", due_date: "2026-08-25", credit_cents: 3000001, expected_escalation_case_version: "${esc_v}" }
              as: CsExecutive
              as_user_id: "exec-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /escalation-cases/${esc_id}/remediation-commitments"
              payload: { description: "Credit exactly at the cap", due_date: "2026-08-25", credit_cents: 3000000, expected_escalation_case_version: "${esc_v}" }
              as: CsExecutive
              as_user_id: "exec-1"
              captures: { rc1_id: $.data.id }
          assert:
            - "The first trigger call returns HTTP 422 with data.error_id == \"ERR_CREDIT_EXCEEDS_CAP\" and writes no RemediationCommitment."
            - "The second trigger call returns HTTP 201: RemediationCommitment.${rc1_id}.credit_cents == 3000000 and state == \"PROPOSED\" and round_index == 1."
            - "Account.${acct_id}.remediation_credit_outstanding_cents == 0 (PROPOSED credits are not yet outstanding)."
            - "EscalationCase.${esc_id}.state == \"OPEN\" and final_credit_cents is null."

      - name: win_back_target_after_merger_acquisition_churn_is_barred
        claim_type: violation_to_error
        grounds:
          - state_machines.Account.CHURNED_to_WIN_BACK_TARGETED
          - validations[priority=11]
          - errors.ERR_ACCOUNT_LIFECYCLE_INVALID
          - entities.Account.fields.churn_root_cause_code
        distinguishing_aspect: "MERGER_ACQUISITION is the single root cause excluded from the win-back precondition set, so WIN_BACK_TARGET returns ERR_ACCOUNT_LIFECYCLE_INVALID (409) and the account stays CHURNED with win_back_offer_bp null."
        test_recipe:
          setup:
            - "One ENTERPRISE Account driven ONBOARDING -> CHURNED with churn_root_cause_code MERGER_ACQUISITION."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/lifecycle"
              payload: { action: "CHURN", churn_root_cause_code: "MERGER_ACQUISITION" }
              as: CsOpsAdmin
          trigger:
            - call: "POST /accounts/${acct_id}/lifecycle"
              payload: { action: "WIN_BACK_TARGET", win_back_offer_bp: 500 }
              as: CsOpsAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_ACCOUNT_LIFECYCLE_INVALID\"."
            - "Account.${acct_id}.lifecycle_state == \"CHURNED\" and churn_root_cause_code == \"MERGER_ACQUISITION\" and win_back_offer_bp is null."
            - "Account.${acct_id}.coverage_posture == \"FROZEN\" and renewal_likelihood == \"OMIT\"."

      - name: request_missing_x_user_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 1 runs before everything else: a POST /accounts with a valid body but no X-User-ID header returns ERR_UNAUTHENTICATED (401), not ERR_INVALID_REQUEST and not 403."
        test_recipe:
          setup:
            - "Empty database. The request carries a valid X-Role of CsOpsAdmin but omits the X-User-ID header entirely."
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { name: "Header Probe", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: "CsOpsAdmin (X-Role sent; X-User-ID header omitted)"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 401 and response_type == \"error\" and data.error_id == \"ERR_UNAUTHENTICATED\"."
            - "GET /accounts (with a well-formed CsOpsAdmin identity) returns total_count == 0."

      - name: frozen_posture_versus_weight_overflow_priority_corner
        claim_type: priority_ordering
        grounds:
          - validations[priority=13]
          - validations[priority=28]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / frozen_posture_outranks_outcome_weight_overflow_on_goal_create
          rationale: "The two-rules-violated ordering claim (state error at priority 13 beating the fiscal error at priority 28 on the same POST) is exactly what the named §1.8 instance asserts."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: patch_account_updates_arr_and_bumps_version
        claim_type: standard_crud
        grounds:
          - endpoints[id=E4]
          - entities.Account.fields.arr_cents
        distinguishing_aspect: "PATCH /accounts/{id} writes only the supplied fields, bumps version 1 -> 2, and leaves snapshot_health_score at 43.75 and coverage_tier UNASSIGNED because arr_cents feeds neither the health formula nor re-segmentation."
        test_recipe:
          setup:
            - "One ENTERPRISE Account, arr_cents 30000000, no signals, version 1, coverage_tier UNASSIGNED."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "PATCH /accounts/${acct_id}"
              payload: { name: "Northwind Traders GmbH", arr_cents: 40000000 }
              as: CsOpsAdmin
          assert:
            - "HTTP 200 and Account.${acct_id}.name == \"Northwind Traders GmbH\" and arr_cents == 40000000."
            - "Account.${acct_id}.version == 2 and updated_at == \"2026-08-01T00:00:00Z\"."
            - "Account.${acct_id}.segment_band == \"ENTERPRISE\" and contract_end_date == \"2026-12-31\" (untouched)."
            - "Account.${acct_id}.snapshot_health_score == 43.75 and health_tier == \"RED\"."
            - "Account.${acct_id}.coverage_tier == \"UNASSIGNED\" (PATCH does not re-segment) and reference_calls_cap == 6."

      - name: health_recompute_drops_a_ticket_that_aged_out_of_the_support_window
        claim_type: action_endpoint
        grounds:
          - endpoints[id=E6]
          - calculations.support_risk_penalty
          - calculations.renewal_likelihood
          - endpoints[id=E55]
        distinguishing_aspect: "A ticket opened 2026-07-15 is inside the 90-day window at clock 2026-08-01 (penalty 12.00, snapshot 70.85) and outside it at clock 2026-11-01, so the recompute lifts snapshot_health_score to 73.85 while renewal_likelihood drops to AT_RISK on exactly 60 days to renewal."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
            - "One ENTERPRISE Account, term 2026-01-01..2026-12-31, with three USAGE_PERIOD signals of index 36.00, 56.00 and 86.00 (86.00 newest) and exactly one S1 SUPPORT_TICKET opened_at 2026-07-15T09:00:00Z."
            - "At the default clock 2026-08-01 the account reads support_risk_penalty 12.00 and snapshot_health_score 70.85."
            - "The logical clock is then moved to 2026-11-01T00:00:00Z, which puts the ticket 109 days back, outside SUPPORT_WINDOW_DAYS 90."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-05-31", weekly_active_users: 40, licensed_seats: 100, feature_depth_pct: 30.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-06-30", weekly_active_users: 60, licensed_seats: 100, feature_depth_pct: 50.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-07-31", weekly_active_users: 90, licensed_seats: 100, feature_depth_pct: 80.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "SUPPORT_TICKET", ticket_severity: "S1", opened_at: "2026-07-15T09:00:00Z", resolved_at: "2026-07-18T09:00:00Z" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { tkt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: CsOpsAdmin
          trigger:
            - call: "POST /accounts/${acct_id}/health-recompute"
              payload: {}
              as: CsOpsAdmin
          assert:
            - "AccountSignal.${tkt_id}.penalty_points == 12 (the row is unchanged; only the window moved)."
            - "Account.${acct_id}.support_risk_penalty == 0.00 and GET /accounts/${acct_id}/health-summary data.support_component == 100.00."
            - "Account.${acct_id}.snapshot_health_score == 73.85 and trended_health_score == 67.20 and health_tier == \"AMBER\"."
            - "Account.${acct_id}.renewal_likelihood == \"AT_RISK\" (days_to_renewal is exactly 60, and the threshold is strict)."
            - "Account.${acct_id}.lifecycle_state == \"ONBOARDING\" (health-recompute has no edge out of ONBOARDING)."

      - name: health_summary_returns_every_component_for_a_fresh_account
        claim_type: computed_read
        grounds:
          - endpoints[id=E8]
          - calculations.account_health_score
        distinguishing_aspect: "The computed read exposes all nine declared fields on an account with no signals: 0.00 / 100.00 / 25.00 / 60.00 / 43.75 / 43.75 / 0.00 / RED / 0."
        test_recipe:
          setup:
            - "One ENTERPRISE Account with no signals, no sponsors and no goals."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /accounts/${acct_id}/health-summary"
              payload: {}
              as: CsExecutive
              as_user_id: "exec-1"
          assert:
            - "HTTP 200 and data.adoption_index == 0.00 and data.support_component == 100.00."
            - "data.exec_engagement_score == 25.00 (base 50.00 minus the 25.00 no-ACTIVE-economic-buyer debit)."
            - "data.outcome_attainment_index == 60.00 (OUTCOME_EMPTY_SUBSTITUTE)."
            - "data.snapshot_health_score == 43.75 and data.trended_health_score == 43.75 and data.variant_delta == 0.00."
            - "data.health_tier == \"RED\" and data.usage_rows_considered == 0."

      - name: expansion_handoff_without_an_ae_user_id_returns_invalid_request
        claim_type: conditional_action
        grounds:
          - endpoints[id=E51]
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "HANDOFF is the one action of POST /expansion-opportunities/{id}/transition that requires handoff_ae_user_id; omitting it returns ERR_INVALID_REQUEST (400) at priority 5, before the posture and qualification-floor checks at priorities 14 and 27."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
            - "One ENTERPRISE Account with no signals (health_tier RED, coverage_posture RESTRICTED, adoption_index 0.00)."
            - "One IDENTIFIED ExpansionOpportunity on that account with qualification_score 33.88 (0.5*43.75 + 0.3*0.00 + 0.2*60.00), i.e. below the 65.00 handoff floor."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /expansion-opportunities"
              payload: { account_id: "${acct_id}", estimated_value_cents: 2500000, source_signal: "EXEC_REQUEST" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { opp_id: $.data.id }
          trigger:
            - call: "POST /expansion-opportunities/${opp_id}/transition"
              payload: { action: "HANDOFF" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 and data.error_id == \"ERR_INVALID_REQUEST\" (not ERR_COVERAGE_POSTURE_RESTRICTED and not ERR_QUALIFICATION_SCORE_TOO_LOW)."
            - "ExpansionOpportunity.${opp_id}.state == \"IDENTIFIED\" and handoff_ae_user_id is null."
            - "ExpansionOpportunity.${opp_id}.qualification_score == 33.88."

      - name: escalation_case_with_an_unknown_save_play_returns_save_play_not_found
        claim_type: cross_reference_link
        grounds:
          - endpoints[id=E36]
          - validations[priority=4]
          - errors.ERR_SAVE_PLAY_NOT_FOUND
        distinguishing_aspect: "The body foreign key is resolved at priority 4: an existing account_id paired with a save_play_id that matches no row returns ERR_SAVE_PLAY_NOT_FOUND (404), before the same-account check at priority 25."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm and one ENTERPRISE Account; no SavePlay rows exist at all."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /escalation-cases"
              payload: { account_id: "${acct_id}", save_play_id: "99999999-9999-4999-8999-999999999999", severity: "MEDIUM", summary: "Dangling save play reference" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 and data.error_id == \"ERR_SAVE_PLAY_NOT_FOUND\"."
            - "GET /escalation-cases?account_id=${acct_id} returns 0 items."

  # ===========================================================================
  - section: errors
    instances:
      - name: coverage_assignment_with_no_matching_specialty_returns_no_eligible_csm
        claim_type: error_triggerability
        grounds:
          - errors.ERR_NO_ELIGIBLE_CSM
          - calculations.csm_selection
          - validations[priority=30]
        distinguishing_aspect: "The only ACTIVE Csm has coverage_specialty LOW_TOUCH while the account segmented to HIGH_TOUCH, so the eligible pool is empty and POST /coverage-assignments returns ERR_NO_ELIGIBLE_CSM (409)."
        test_recipe:
          setup:
            - "Exactly one Csm: ACTIVE, coverage_specialty LOW_TOUCH, capacity_units_total 40."
            - "One ENTERPRISE Account, arr_cents 30000000, segmented so coverage_tier is HIGH_TOUCH."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Linus Park", coverage_specialty: "LOW_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_lt_id: $.data.id }
