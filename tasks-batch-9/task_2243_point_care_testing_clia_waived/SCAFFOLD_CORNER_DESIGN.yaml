          consecutive_rejection_count and competency_expires_at are left exactly
          as the first decision set them.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered site, subject operator trained (PROVISIONAL, version 2) and a separate trained assessor."
            - "One SUBMITTED assessment with methods_demonstrated 6, effective 2026-09-01, expiring 2027-03-01, approved once by a ProgramAdmin (so segregation clause (a), which only binds LabDirector actors, is out of scope)."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243045", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Anticoag Clinic POCT", department_code: "DEPT-4100", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2026-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Gil Ramnarine", role_title: "NURSE", hire_date: "2026-01-05" }
              as: ProgramAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /poct/operators/${subj_id}/training"
              payload: { training_module_code: "POCT-INR-101", completed_on: "2026-08-20" }
              as: QualityCoordinator
              captures: { subj_v: $.data.version, subj_comp_1: $.data.competency_status }
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Hana Brzezinski", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-01-06" }
              as: ProgramAdmin
              captures: { assr_id: $.data.id }
            - call: "POST /poct/operators/${assr_id}/training"
              payload: { training_module_code: "POCT-INR-101", completed_on: "2026-08-21" }
              as: QualityCoordinator
            - call: "POST /poct/competency-assessments"
              payload: { operator_id: "${subj_id}", assessor_operator_id: "${assr_id}", device_model: "INR-5", assessment_type: "INITIAL", methods_demonstrated: 6, effective_date: "2026-09-01", expires_at: "2027-03-01", expected_operator_version: "${subj_v}" }
              as: QualityCoordinator
              captures: { asmt_id: $.data.id, asmt_status_1: $.data.status }
            - call: "POST /poct/competency-assessments/${asmt_id}/decision"
              payload: { decision: "APPROVE", note: "all six methods observed" }
              as: ProgramAdmin
              as_user_id: "user-admin"
              captures: { asmt_status_2: $.data.status, decided_by: $.data.decided_by_user_id }
            - call: "GET /poct/operators/${subj_id}"
              as: QualityCoordinator
              captures: { subj_comp_2: $.data.competency_status, subj_exp: $.data.competency_expires_at, subj_rej: $.data.consecutive_rejection_count }
          trigger:
            - call: "POST /poct/competency-assessments/${asmt_id}/decision"
              payload: { decision: "REJECT", note: "second reviewer disagrees" }
              as: ProgramAdmin
              as_user_id: "user-admin2"
              captures: { err: $.data.error_id, msg: $.data.message }
            - call: "GET /poct/competency-assessments/${asmt_id}"
              as: QualityCoordinator
              captures: { asmt_status_3: $.data.status, note_after: $.data.decision_note }
            - call: "GET /poct/operators/${subj_id}"
              as: QualityCoordinator
              captures: { subj_comp_3: $.data.competency_status, subj_rej_2: $.data.consecutive_rejection_count }
          assert:
            - "${subj_comp_1} == \"PROVISIONAL\"; ${asmt_status_1} == \"SUBMITTED\""
            - "${asmt_status_2} == \"APPROVED\", ${decided_by} == \"user-admin\", ${subj_comp_2} == \"COMPETENT\", ${subj_exp} == \"2027-03-01\" and ${subj_rej} == 0"
            - "HTTP status is 409 and ${err} == \"ERR_ASSESSMENT_NOT_SUBMITTED\""
            - "${asmt_status_3} == \"APPROVED\" and ${note_after} is still \"all six methods observed\""
            - "${subj_comp_3} == \"COMPETENT\" and ${subj_rej_2} == 0 - the refused REJECT did not increment the rejection counter"

      - name: untrained_assessor_on_assessment_submission_returns_operator_competency_lapsed
