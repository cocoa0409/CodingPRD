            - "captured err == ERR_FORBIDDEN_ROLE"
            - "CrewCall.${call_id}.status == CALLED (unchanged)"

      - name: customer_rep_cannot_cancel_others_order
        claim_type: role_denial
        grounds: [roles, "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Entity-backed ownership: CustomerRep of customer B cannot cancel customer A's order -> ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["customers A and B; a PLACED order belonging to A"]
          setup_api_calls:
            - call: "POST /rail/customers"
              payload: { name: "Owner A", billing_email: "oa@x.example" }
              as: SystemAdmin
              captures: { custA_id: $.data.id }
            - call: "POST /rail/customers"
              payload: { name: "Owner B", billing_email: "ob@x.example" }
              as: SystemAdmin
              captures: { custB_id: $.data.id }
            - call: "POST /rail/track-segments"
              payload: { name: "Main MP 67-68", milepost_start: 67, milepost_end: 68, fra_class: CLASS_1 }
              as: SystemAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /rail/industry-sidings"
              payload: { customer_id: "${custA_id}", name: "A Siding", capacity_cars: 4, serving_track_segment_id: "${seg_id}", agreement_expires_on: "2027-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { sid_id: $.data.id }
            - call: "POST /rail/car-orders"
              payload: { customer_id: "${custA_id}", siding_id: "${sid_id}", car_type: BOX, quantity: 1, needed_by_date: "2026-06-01T00:00:00Z" }
              as: CustomerRep
              as_user_id: "${custA_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /rail/car-orders/${ord_id}/cancel"
              payload: {}
              as: CustomerRep
              as_user_id: "${custB_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_FORBIDDEN_ROLE"
            - "CarOrder.${ord_id}.status == PLACED (unchanged)"

  - section: cross_cutting_layers
    instances:
      - name: occ_car_order_amend_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[car-order-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH carrying the pre-accept version (captured at creation) is rejected with ERR_STALE_VERSION (412) after accept advanced the order version."
        test_recipe:
          setup: ["order created (version captured) then accepted (version advanced)"]
          setup_api_calls:
            - call: "POST /rail/customers"
              payload: { name: "OCC Co", billing_email: "occ@x.example" }
              as: SystemAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rail/track-segments"
              payload: { name: "Main MP 69-70", milepost_start: 69, milepost_end: 70, fra_class: CLASS_1 }
              as: SystemAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /rail/industry-sidings"
              payload: { customer_id: "${cust_id}", name: "OCC Siding", capacity_cars: 4, serving_track_segment_id: "${seg_id}", agreement_expires_on: "2027-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { sid_id: $.data.id }
            - call: "POST /rail/car-orders"
              payload: { customer_id: "${cust_id}", siding_id: "${sid_id}", car_type: BOX, quantity: 2, needed_by_date: "2026-06-01T00:00:00Z" }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id, ord_v_create: $.data.version }
            - call: "POST /rail/car-orders/${ord_id}/accept"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "PATCH /rail/car-orders/${ord_id}"
              payload: { needed_by_date: "2026-07-01T00:00:00Z", expected_car_order_version: "${ord_v_create}" }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_STALE_VERSION (accept bumped the version past the captured one)"

      - name: occ_adjust_hos_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[crew-member-hos-adjust-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Second adjust-hos replaying the creation version is rejected with ERR_STALE_VERSION; with the fresh version it succeeds and increments version again."
        test_recipe:
          setup: ["crew member; one successful adjust-hos (version advanced)"]
          setup_api_calls:
            - call: "POST /rail/crew-members"
              payload: { name: "W. Engineer", craft: ENGINEER }
              as: SystemAdmin
              captures: { mem_id: $.data.id, mem_v: $.data.version }
            - call: "POST /rail/crew-members/${mem_id}/adjust-hos"
              payload: { rolling_24h_minutes: 100, expected_crew_member_version: "${mem_v}" }
              as: CrewCaller
              captures: { mem_v2: $.data.version }
          trigger:
            - call: "POST /rail/crew-members/${mem_id}/adjust-hos"
              payload: { rolling_24h_minutes: 200, expected_crew_member_version: "${mem_v}" }
              as: CrewCaller
              captures: { err: $.data.error_id }
            - call: "POST /rail/crew-members/${mem_id}/adjust-hos"
              payload: { rolling_24h_minutes: 200, expected_crew_member_version: "${mem_v2}" }
              as: CrewCaller
              captures: { mem_v3: $.data.version, mem_rolling: $.data.on_duty_minutes_rolling_24h }
          assert:
            - "captured err == ERR_STALE_VERSION (stale creation version replayed)"
            - "captured mem_rolling == 200 and mem_v3 == mem_v2 + 1 (fresh version succeeds and increments)"

      - name: clock_default_is_fixed_epoch
        claim_type: ops_run_checkpoint
        grounds: [endpoints, entities.TrackSegment.fields.last_inspection_at]
        distinguishing_aspect: "Without any set_current_utc call the logical clock is exactly 2026-05-01T00:00:00Z: a segment created then has last_inspection_at at that instant and is not overdue."
        test_recipe:
          setup: ["empty database; clock never set"]
          setup_api_calls: []
          trigger:
            - call: "POST /rail/track-segments"
              payload: { name: "Epoch Seg", milepost_start: 0, milepost_end: 1, fra_class: CLASS_5 }
              as: SystemAdmin
              captures: { seg_last: $.data.last_inspection_at, seg_overdue: $.data.is_overdue }
          assert:
            - "captured seg_last == 2026-05-01T00:00:00.000Z (or the implementation's canonical rendering of the fixed default epoch)"
            - "captured seg_overdue == false (CLASS_5 frequency 1 day; creation instant is not past its own deadline)"

      - name: crew_rest_sweep_releases_member
        claim_type: ops_run_checkpoint
        grounds: [state_machines.CrewMember.RESTING_to_AVAILABLE]
        excluded_because:
          difficulty_instance: crew_member_duty_rest_cycle
          rationale: "The rest sweep (RESTING -> AVAILABLE after exactly 600 minutes) is asserted end-to-end by the named difficulty instance."

      - name: fleet_invariant_layer
        claim_type: derived_field_reconciliation
        grounds: [entities.CarOrder.fields.cars_furnished_count]
        excluded_because:
          difficulty_instance: railcar_fleet_conservation
          rationale: "cars_furnished_count reconciliation across furnish and cancel is asserted by the named difficulty instance."

  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: PATCH credit_status to SUSPENDED is visible in the very next GET of the same customer, same version flow."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - call: "POST /rail/customers"
              payload: { name: "Visible Co", billing_email: "v@x.example" }
              as: SystemAdmin
              captures: { cust_id: $.data.id }
            - call: "PATCH /rail/customers/${cust_id}"
              payload: { credit_status: SUSPENDED }
              as: SystemAdmin
          trigger:
            - call: "GET /rail/customers/${cust_id}"
              payload: {}
              as: SystemAdmin
              captures: { c_status: $.data.credit_status, c_v: $.data.version }
          assert:
            - "captured c_status == SUSPENDED"
            - "captured c_v == 2 (one mutation applied, visible at once)"

      - name: furnish_derived_count_immediate
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.CarOrder.fields.cars_furnished_count]
        distinguishing_aspect: "The furnish response itself carries cars_furnished_count == 2 and status FURNISHED — no delayed reconciliation."
        test_recipe:
          setup: ["ACCEPTED order for 2 BOX cars; 2 eligible railcars"]
          setup_api_calls:
            - call: "POST /rail/customers"
              payload: { name: "Imm Co", billing_email: "im@x.example" }
              as: SystemAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /rail/track-segments"
              payload: { name: "Main MP 71-72", milepost_start: 71, milepost_end: 72, fra_class: CLASS_1 }
              as: SystemAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /rail/industry-sidings"
              payload: { customer_id: "${cust_id}", name: "Imm Siding", capacity_cars: 4, serving_track_segment_id: "${seg_id}", agreement_expires_on: "2027-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { sid_id: $.data.id }
            - call: "POST /rail/railcars"
              payload: { reporting_mark: "GNWR 8101", car_type: BOX, ownership: HOME, hire_rate_per_hour_cents: 0, hire_rate_per_mile_cents: 0 }
              as: SystemAdmin
            - call: "POST /rail/railcars"
              payload: { reporting_mark: "GNWR 8102", car_type: BOX, ownership: HOME, hire_rate_per_hour_cents: 0, hire_rate_per_mile_cents: 0 }
              as: SystemAdmin
            - call: "POST /rail/car-orders"
              payload: { customer_id: "${cust_id}", siding_id: "${sid_id}", car_type: BOX, quantity: 2, needed_by_date: "2026-06-01T00:00:00Z" }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /rail/car-orders/${ord_id}/accept"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /rail/car-orders/${ord_id}/furnish"
              payload: { count: 2 }
              as: Dispatcher
              captures: { ord_count: $.data.cars_furnished_count, ord_status: $.data.status }
          assert:
            - "captured ord_count == 2"
            - "captured ord_status == FURNISHED"
