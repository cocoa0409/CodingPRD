              as: Recorder
              captures: { dA: $.data.id }
            - call: "POST /donors"
              payload: { external_donor_ref: "DL-TX-0000B1", legal_first_name: "Bob", legal_last_name: "Baker", date_of_birth: "1985-07-19", weight_kg: 72.5, home_center_id: "${c}" }
              as: Recorder
              captures: { dB: $.data.id }
            - call: "POST /donors/${dA}/screening-visits"
              payload: { center_id: "${c}", scheduled_for: "2026-09-01T08:00:00Z" }
              as: Recorder
              captures: { sA: $.data.id }
            - call: "POST /screening-visits/${sA}/sub-records"
              payload: { record_type: "IDENTITY", payload: { document_number: "TXDL-0000A1" } }
              as: Recorder
              as_user_id: "rec-01"
            - call: "POST /donors/${dB}/screening-visits"
              payload: { center_id: "${c}", scheduled_for: "2026-09-02T08:00:00Z" }
              as: Recorder
              captures: { sB: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T07:59:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /screening-visits/${sB}/sub-records"
              payload: { record_type: "IDENTITY", payload: { document_number: "TXDL-0000B1" } }
              as: Recorder
              as_user_id: "rec-02"
            - call: "GET /screening-visits/${sA}"
              as: PlatformAdmin
              captures: { laneA: $.data.screening_lane_index, stA: $.data.visit_status }
            - call: "GET /screening-visits/${sB}"
              as: PlatformAdmin
              captures: { laneB: $.data.screening_lane_index, stB: $.data.visit_status }
          assert:
            - "sA still IN_PROGRESS at 07:59 (${stA} == IN_PROGRESS) holding lane ${laneA} == 0 over [09-01T08:00, 09-02T08:00)"
            - "sB went IN_PROGRESS (${stB} == IN_PROGRESS) and its window [09-02T08:00, 09-03T08:00) is exactly adjacent (gap 0) to sA's — half-open semantics mean NO overlap, so the single lane is reusable: ${laneB} == 0"

      - name: observation_chair_aggregate_capacity_and_reuse
        grounds:
          - calculations.capacity_occupancy
          - validations[priority=16]
          - entities.DonationVisit.fields.observation_chair_index
        distinguishing_aspect: |
          Resource = observation chair (distinct from beds and lanes); semantics =
          instantaneous aggregate capacity like beds but exercised through the
          complete-collection endpoint with a different release trigger: the chair is
          freed only by DISCHARGE (or abort), not by the next pipeline step. With 1
          chair held by donorA in OBSERVATION, donorB's complete-collection fails
