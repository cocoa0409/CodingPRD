              payload: { store_id: "${store16}", consumable_type: "STUFFING_FIBER", initial_qty: 10000 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store16}", station_type: "STUFF", capacity: 1 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store16}", station_type: "SOUND", capacity: 1 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store16}", station_type: "BATHE", capacity: 1 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store16}", station_type: "DRESS", capacity: 1 }
              as: StoreManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T10:00:00Z" }
              as: StoreManager
            - call: "POST /workshops"
              payload: { store_id: "${store16}", customer_id: "${c16a}", plush_model_id: "${model16}", origin_type: "WALK_IN" }
              as: WorkshopAssociate
              captures: { w16a: $.data.id }
            - call: "POST /workshops/${w16a}/advance-step"
              payload: {}
              as: WorkshopAssociate
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T10:30:00Z" }
              as: StoreManager
            - call: "POST /workshops"
              payload: { store_id: "${store16}", customer_id: "${c16b}", plush_model_id: "${model16}", origin_type: "WALK_IN" }
              as: WorkshopAssociate
              captures: { err8: $.data.error_id }
          assert:
            - "err8 == ERR_STATION_AT_CAPACITY (second session at +30min still inside [10:00-15min, 10:00+60min) buffered window of the first; capacity 1 => occupancy 1 >= 1)"

  # ===========================================================================
  # Rule 9 — compensating_invariant: two invariants over DIFFERENT conserved
  # quantities.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: stuffing_grams_conserved_across_consume_and_abandon
        grounds:
          - calculations.consumables_on_hand
          - state_machines.WorkshopSession.SELECTED_to_STUFFED
          - state_machines.WorkshopSession.STUFFED_to_ABANDONED
        distinguishing_aspect: |
          Conserved quantity: STUFFING_FIBER grams. invariant: on_hand ==
          initial + restocks - consumed + restored. A session consumes 320g at
          STUFF (10000 -> 9680), then abandons from STUFFED (9680 -> 10000) —
          the forward+compensating pair leaves the ledger exactly at its
          pre-action value.
        test_recipe:
          setup:
            - "Store S17; Customer C17; model 320g; STUFFING_FIBER initial 10000; stations capacity 2"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Gram Store", party_room_count: 1 }
              as: StoreManager
              captures: { store17: $.data.id }
            - call: "POST /customers"
              payload: { email: "c17@example.com", full_name: "Casey Seventeen" }
              as: Customer
              captures: { cust17: $.data.id }
            - call: "POST /plush-models"
              payload: { name: "Gram Goat", sku: "GG-01", base_price_cents: 2500, is_licensed: false, required_stuffing_grams: 320, sound_chip_compatible: false }
              as: StoreManager
              captures: { model17: $.data.id }
            - call: "POST /consumables"
              payload: { store_id: "${store17}", consumable_type: "STUFFING_FIBER", initial_qty: 10000 }
              as: StoreManager
              captures: { fiber17: $.data.id }
            - call: "POST /stations"
              payload: { store_id: "${store17}", station_type: "STUFF", capacity: 2 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store17}", station_type: "SOUND", capacity: 2 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store17}", station_type: "BATHE", capacity: 2 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store17}", station_type: "DRESS", capacity: 2 }
              as: StoreManager
            - call: "POST /workshops"
              payload: { store_id: "${store17}", customer_id: "${cust17}", plush_model_id: "${model17}", origin_type: "WALK_IN" }
              as: WorkshopAssociate
