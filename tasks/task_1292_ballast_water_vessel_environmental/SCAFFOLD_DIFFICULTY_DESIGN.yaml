            - call: "POST /vessels/${v}/voyages/${vy}/ballast-events"
              payload: { event_kind: UPTAKE, occurred_at: "2026-07-28T06:00:00Z", tank_id: "T1", volume_m3: 300, salinity_ppt: 32.0, source_port_locode: USNYC, expected_voyage_version: "${w1}" }
              as: VesselMaster
            - call: "GET /vessels/${v}/voyages/${vy}"
