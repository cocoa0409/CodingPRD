      - name: lot_best_by_must_postdate_production_date
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_BEST_BY_INVALID]
        distinguishing_aspect: |
          best_by_date must be strictly after the production date: a best_by on
          the same calendar date as the batch's scheduled production date
          (2026-08-27) fails with ERR_BEST_BY_INVALID (422); a date a year
          later succeeds.
        test_recipe:
          setup:
            - "LOCKED formula; COMPLETED batch with scheduled_start 2026-08-27T08:00:00Z"
          setup_api_calls:
