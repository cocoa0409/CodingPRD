# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Country Club Membership & Dining Minimum — breadth probe over §1.1–§1.7.
# Sections / claim_types come from references/claim-extraction-guide.md only.
# Names are unique across this file AND SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_membership_returns_pending_defaults
        claim_type: Creation
        grounds: ["entities.Membership", "endpoints"]
        distinguishing_aspect: "POST /memberships with club_id/category_id/holder_name -> 201, account_status=PENDING, billing_status=CURRENT, charge_balance_cents=0, version=1."
        test_recipe:
          setup: ["Club and a SOCIAL category exist."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "E1 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "SOCIAL", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 15000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000 }
              as: ClubManager
              captures: { cat_id: $.data.id }
          trigger:
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "New M" }
              as: ClubManager
              captures: { m_id: $.data.id }
          assert:
            - "response code 201"
            - "Membership.${m_id}.account_status == PENDING"
            - "Membership.${m_id}.billing_status == CURRENT"
            - "Membership.${m_id}.charge_balance_cents == 0"
            - "Membership.${m_id}.version == 1"

      - name: get_membership_not_found
        claim_type: Not Found
        grounds: ["entities.Membership", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /memberships/{nonexistent-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB except a ClubManager caller."]
          setup_api_calls: []
          trigger:
            - call: "GET /memberships/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClubManager
              captures: { err: $.data.error_id }
          assert:
            - "response code 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_category_missing_required_field
        claim_type: Required Fields
        grounds: ["entities.MembershipCategory", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /membership-categories missing required monthly_dues_cents -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Club exists."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "E3 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
          trigger:
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "SOCIAL", initiation_fee_cents: 0, refundable_equity_cents: 0, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000 }
              as: ClubManager
              captures: { err: $.data.error_id }
          assert:
            - "response code 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_category_invalid_enum_code
        claim_type: Type Constraints
        grounds: ["entities.MembershipCategory.fields.code", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /membership-categories with code='PLATINUM' (not in {GOLF,SOCIAL,CORPORATE}) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Club exists."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "E4 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
          trigger:
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "PLATINUM", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 15000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000 }
              as: ClubManager
              captures: { err: $.data.error_id }
          assert:
            - "response code 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_category_equity_exceeds_initiation_rejected
        claim_type: Type Constraints
        grounds: ["entities.MembershipCategory.fields.refundable_equity_cents", "validations[priority=16]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "refundable_equity_cents (60000) > initiation_fee_cents (50000) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Club exists."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "E5 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
          trigger:
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 50000, refundable_equity_cents: 60000, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { err: $.data.error_id }
          assert:
            - "response code 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: computed_active_member_count_ignores_input
        claim_type: Computed Fields
        grounds: ["entities.MembershipCategory.fields.active_member_count"]
        distinguishing_aspect: "active_member_count is computed: a freshly created category reports 0 regardless of any client-supplied value; it becomes 1 only after an activation."
        test_recipe:
          setup: ["Club; GOLF category capacity 5 allows_golf true; one membership activated."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "E6 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 5, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M" }
              as: ClubManager
              captures: { m_id: $.data.id }
            - call: "POST /memberships/${m_id}/activate"
              payload: {}
              as: ClubManager
          trigger:
            - call: "GET /membership-categories/${cat_id}"
              payload: {}
              as: ClubManager
              captures: { cnt: $.data.active_member_count }
          assert:
            - "MembershipCategory.${cat_id}.active_member_count == 1"

      - name: list_memberships_pagination_envelope
        claim_type: Listing
        grounds: ["entities.Membership", "response_envelope"]
        distinguishing_aspect: "GET /memberships?club_id=&limit=1 returns array response with total_count and has_more reflecting >1 membership."
        test_recipe:
          setup: ["Club; SOCIAL category; two memberships created."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "E7 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "SOCIAL", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 15000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000 }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M1" }
              as: ClubManager
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M2" }
              as: ClubManager
          trigger:
            - call: "GET /memberships?club_id=${club_id}&limit=1&offset=0"
              payload: {}
              as: ClubManager
          assert:
            - "response is an array of length 1"
            - "meta/pagination total_count == 2 and has_more == true"

      - name: corporate_self_referential_primary_member
        claim_type: Parent Relationships
        grounds: ["entities.Membership.fields.primary_member_id"]
        distinguishing_aspect: "A CORPORATE designated-user membership stores primary_member_id pointing to the roster head; GET /memberships?primary_member_id=<head> returns the designated user."
        test_recipe:
          setup: ["Club; CORPORATE category capacity 10; head membership H activated; designated-user membership D created with primary_member_id=H."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "E8 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "CORPORATE", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 50000, fb_minimum_cents: 0, capacity: 10, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "Head" }
              as: ClubManager
              captures: { h_id: $.data.id }
            - call: "POST /memberships/${h_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "Designated", primary_member_id: "${h_id}" }
              as: ClubManager
              captures: { d_id: $.data.id }
          trigger:
            - call: "GET /memberships?primary_member_id=${h_id}"
              payload: {}
              as: ClubManager
          assert:
            - "response array contains a Membership whose id == ${d_id} and primary_member_id == ${h_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_reservation_from_cancelled_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Reservation.CONFIRMED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED reservation -> ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["Club; GOLF allows_golf; Member M activated; COURT resource; M books then cancels a reservation."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "S1 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M" }
              as: ClubManager
              captures: { m_id: $.data.id }
            - call: "POST /memberships/${m_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /resources"
              payload: { club_id: "${club_id}", kind: "COURT", label: "Court 1", turnaround_minutes: 0 }
              as: ClubManager
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /reservations"
              payload: { club_id: "${club_id}", resource_id: "${res_id}", membership_id: "${m_id}", starts_at: "2026-02-01T10:00:00Z", ends_at: "2026-02-01T11:00:00Z", expected_resource_version: "${res_v0}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rsv_id: $.data.id }
            - call: "POST /reservations/${rsv_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /reservations/${rsv_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code 409"
            - "response error_id == ERR_INVALID_STATE"
            - "Reservation.${rsv_id}.status == CANCELLED (unchanged)"

      - name: complete_reservation_before_end_time_invalid
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Reservation.CONFIRMED_to_COMPLETED", "endpoints"]
        distinguishing_aspect: "POST /reservations/{id}/complete while logical clock (default 2026-01-01T00:00:00Z) is before ends_at -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Club; GOLF allows_golf; Member M activated; COURT resource; CONFIRMED reservation 2026-02-01 10:00-11:00; clock at default 2026-01-01."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "S2 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M" }
              as: ClubManager
              captures: { m_id: $.data.id }
            - call: "POST /memberships/${m_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /resources"
              payload: { club_id: "${club_id}", kind: "COURT", label: "Court 1", turnaround_minutes: 0 }
              as: ClubManager
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /reservations"
              payload: { club_id: "${club_id}", resource_id: "${res_id}", membership_id: "${m_id}", starts_at: "2026-02-01T10:00:00Z", ends_at: "2026-02-01T11:00:00Z", expected_resource_version: "${res_v0}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rsv_id: $.data.id }
          trigger:
            - call: "POST /reservations/${rsv_id}/complete"
              payload: {}
              as: ClubManager
              captures: { err: $.data.error_id }
          assert:
            - "response code 409"
            - "response error_id == ERR_INVALID_STATE (clock 2026-01-01 < ends_at)"

      - name: complete_reservation_after_clock_set_succeeds
        claim_type: Valid Transition
        grounds: ["state_machines.Reservation.CONFIRMED_to_COMPLETED", "endpoints"]
        distinguishing_aspect: "After setting the clock to 2026-02-01T11:00:00Z (>= ends_at), POST /complete moves the reservation CONFIRMED -> COMPLETED."
        test_recipe:
          setup: ["Same as S2 but the clock is advanced to 2026-02-01T11:00:00Z before completing."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "S3 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M" }
              as: ClubManager
              captures: { m_id: $.data.id }
            - call: "POST /memberships/${m_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /resources"
              payload: { club_id: "${club_id}", kind: "COURT", label: "Court 1", turnaround_minutes: 0 }
              as: ClubManager
              captures: { res_id: $.data.id, res_v0: $.data.version }
            - call: "POST /reservations"
              payload: { club_id: "${club_id}", resource_id: "${res_id}", membership_id: "${m_id}", starts_at: "2026-02-01T10:00:00Z", ends_at: "2026-02-01T11:00:00Z", expected_resource_version: "${res_v0}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rsv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T11:00:00Z" }
              as: ClubManager
          trigger:
            - call: "POST /reservations/${rsv_id}/complete"
              payload: {}
              as: ClubManager
          assert:
            - "Reservation.${rsv_id}.status == COMPLETED"

      - name: reinstate_non_suspended_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Membership.SUSPENDED_to_ACTIVE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /memberships/{id}/reinstate on an ACTIVE (not SUSPENDED) membership -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Club; GOLF allows_golf; Member M activated (ACTIVE)."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "S4 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 50, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M" }
              as: ClubManager
              captures: { m_id: $.data.id }
            - call: "POST /memberships/${m_id}/activate"
              payload: {}
              as: ClubManager
          trigger:
            - call: "POST /memberships/${m_id}/reinstate"
              payload: {}
              as: ClubManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: resigned_terminal_lockdown_no_resign_again
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Membership.RESIGNED_PENDING_to_RESIGNED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After settle-resignation (account_status RESIGNED, terminal), POST /memberships/{id}/resign -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Club; GOLF capacity 5 allows_golf, initiation 0; Member M activated, resigned (balance 0), then settled to RESIGNED."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "S5 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 5, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /memberships"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", holder_name: "M" }
              as: ClubManager
              captures: { m_id: $.data.id }
            - call: "POST /memberships/${m_id}/activate"
              payload: {}
              as: ClubManager
            - call: "POST /memberships/${m_id}/resign"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /memberships/${m_id}/settle-resignation"
              payload: {}
              as: ClubManager
          trigger:
            - call: "POST /memberships/${m_id}/resign"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Membership.${m_id}.account_status == RESIGNED"

      - name: waitlist_decline_promotes_next_waiting
        claim_type: Side Effect Execution
        grounds: ["state_machines.WaitlistEntry.OFFERED_to_DECLINED", "state_machines.WaitlistEntry.WAITING_to_OFFERED"]
        distinguishing_aspect: "Declining an OFFERED entry promotes the next earliest-by-created_at WAITING entry to OFFERED."
        test_recipe:
          setup: ["Club; GOLF capacity 1 allows_golf; seat free (count 0); two waitlist entries W1 (offered) and W2 (waiting)."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "S6 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 1, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /waitlist-entries"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", applicant_name: "W1" }
              as: ClubManager
              captures: { w1_id: $.data.id }
            - call: "POST /waitlist-entries"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", applicant_name: "W2" }
              as: ClubManager
              captures: { w2_id: $.data.id }
            - call: "POST /waitlist-entries/${w1_id}/offer"
              payload: {}
              as: ClubManager
          trigger:
            - call: "POST /waitlist-entries/${w1_id}/decline"
              payload: {}
              as: ClubManager
          assert:
            - "WaitlistEntry.${w1_id}.status == DECLINED"
            - "WaitlistEntry.${w2_id}.status == OFFERED (promoted)"

      - name: waitlist_offer_expires_on_close_period
        claim_type: Side Effect Execution
        grounds: ["state_machines.WaitlistEntry.OFFERED_to_EXPIRED", "entities.WaitlistEntry.fields.offered_period_index", "entities.Club.fields.billing_period_index"]
        distinguishing_aspect: "An OFFERED entry whose offered_period_index < new billing_period_index after close-period transitions to EXPIRED."
        test_recipe:
          setup: ["Club; GOLF capacity 1 allows_golf; seat free; one entry W offered in period 0; then close-period advances to period 1."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "S7 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
              payload: { club_id: "${club_id}", code: "GOLF", initiation_fee_cents: 0, refundable_equity_cents: 0, monthly_dues_cents: 30000, fb_minimum_cents: 0, capacity: 1, guest_fee_cents: 5000, allows_golf: true }
              as: ClubManager
              captures: { cat_id: $.data.id }
            - call: "POST /waitlist-entries"
              payload: { club_id: "${club_id}", category_id: "${cat_id}", applicant_name: "W" }
              as: ClubManager
              captures: { w_id: $.data.id }
            - call: "POST /waitlist-entries/${w_id}/offer"
              payload: {}
              as: ClubManager
            - call: "GET /clubs/${club_id}"
              payload: {}
              as: ClubManager
              captures: { club_v0: $.data.version }
          trigger:
            - call: "POST /clubs/${club_id}/close-period"
              payload: { expected_club_version: "${club_v0}" }
              as: ClubManager
          assert:
            - "WaitlistEntry.${w_id}.status == EXPIRED"
            - "Club.${club_id}.billing_period_index == 1"

      - name: abandon_amend_keeps_original_window
        claim_type: Side Effect Execution
        grounds: ["state_machines.Reservation.AMEND_PENDING_to_CONFIRMED", "entities.Reservation.fields.proposed_starts_at"]
        distinguishing_aspect: "abandon-amend returns AMEND_PENDING -> CONFIRMED, clears proposed_* to null, and retains the original starts_at/ends_at."
        test_recipe:
          setup: ["Club; GOLF allows_golf; Member M activated; COURT resource; reservation 10:00-11:00 proposed to 12:00-13:00 (AMEND_PENDING)."]
          setup_api_calls:
            - call: "POST /clubs"
              payload: { name: "S8 Club" }
              as: ClubManager
              captures: { club_id: $.data.id }
            - call: "POST /membership-categories"
