# =============================================================================
# 1.9 Scaffold Corner Design - breadth probe for
# task_2419_battery_recycling_second_life_recovery
#
# Walked row-by-row against references/claim-extraction-guide.md over this
# scaffold's SCAFFOLD.yaml (15 entities, 8 state-machine dimensions, 2
# concurrency rules, 9 calculations, 13 validation priorities, 63 endpoints,
# 62 errors, 10 roles, 3 invariants).
#
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) are emitted
# as `excluded_because:` stubs naming the covering §1.8 instance; every other
# applicable row carries a full, replayable test_recipe.
#
# Pinned world used by most recipes:
#   clock              2026-07-10T00:00:00.000Z (moved to 2026-08-20 for processing)
#   Facility           "Reno Campus" / NV / mech 3000.0 / hydro 2000.0
#   Supplier           "Northstar Automotive" / AUTOMAKER / credit_limit_cents 200000
#   MetalIndexPrice    NI 1600 @2026-07-01, NI 1750 @2026-08-15 (CO 3200 / LI 8000 / CU 850 @2026-07-01 when needed)
#   Short intake       gross 110.0 / tare 10.0 -> net 100.0, NMC622, declared_ni_pct 12.0
# =============================================================================

scaffold_corner_design:
  - section: entities
    instances:
      - name: create_facility_with_all_required_fields_returns_created
        claim_type: creation
        grounds:
          - entities.Facility
          - endpoints[POST /recycling/facilities]
          - response_envelope.success
        distinguishing_aspect: "POST /recycling/facilities with the four required fields returns HTTP 201, echoes every declared field, applies status ACTIVE, and wraps the row in the success envelope with version 1."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned at 2026-07-10T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
              captures: { now: "$.data.current_utc" }
          trigger:
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id", fac_status: "$.data.status", fac_v: "$.data.version" }
          assert:
            - "${now} == 2026-07-10T00:00:00.000Z"
            - "HTTP 201 and the body carries meta.api_request_id, meta.api_request_timestamp and response_type == 'object'"
            - "${fac_id} is a non-null string and ${fac_v} == 1"
            - "Facility.${fac_id}.name == 'Reno Campus', state_code == 'NV', mech_capacity_kg_per_day == 3000.0, hydro_capacity_kg_per_day == 2000.0"
            - "${fac_status} == ACTIVE - the enum default is applied when status is omitted"
            - "Facility.${fac_id}.created_at and updated_at are non-null"

      - name: get_intake_returns_stored_snapshot
        claim_type: retrieval
        grounds:
          - entities.Intake
          - endpoints[GET /recycling/intakes/{intake_id}]
        distinguishing_aspect: "GET /recycling/intakes/{intake_id} returns exactly the row written by the create call, including the computed net_mass_kg 100.0 and the two initial state dimensions, with no field drift."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z, one campus, one supplier, one freshly booked NMC622 intake of gross 110.0 kg and tare 10.0 kg declaring 12.0% nickel."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id" }
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 110.0, packaging_tare_kg: 10.0, declared_ni_pct: 12.0 }
              as: IntakeClerk
              captures: { i_id: "$.data.id" }
          trigger:
            - call: "GET /recycling/intakes/${i_id}"
              payload: {}
              as: IntakeClerk
              captures: { net: "$.data.net_mass_kg", cust: "$.data.custody_state", comp: "$.data.compliance_state", recv: "$.data.received_at" }
          assert:
            - "HTTP 200 and response_type == 'object'"
            - "${net} == 100.0 and ${cust} == RECEIVED and ${comp} == MANIFEST_DRAFT"
            - "${recv} == 2026-07-10T00:00:00.000Z"
            - "Intake.${i_id}.declared_ni_pct == 12.0, declared_co_pct == 0.0, declared_li_pct == 0.0, declared_cu_pct == 0.0"
            - "Intake.${i_id}.identified_chemistry == null, soc_pct == null, packaging_type == null, released_at == null, hold_reason == null"
            - "Intake.${i_id}.module_mass_total_kg == 0.0, assigned_mass_kg == 0.0, unassigned_mass_kg == 0.0, version == 1"

      - name: list_intakes_with_pagination_and_custody_filter
        claim_type: listing
        grounds:
          - endpoints[GET /recycling/intakes]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /recycling/intakes paginates with limit/offset and reports total_count 3 with has_more flipping true then false, and the custody_state filter narrows the same collection to the single IDENTIFIED row."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z, one campus, one supplier, three NMC622 intakes of net 100.0 kg each; the first has been chemistry-identified so its custody_state is IDENTIFIED."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id" }
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 110.0, packaging_tare_kg: 10.0, declared_ni_pct: 12.0 }
              as: IntakeClerk
              captures: { i1_id: "$.data.id" }
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 110.0, packaging_tare_kg: 10.0, declared_ni_pct: 12.0 }
              as: IntakeClerk
              captures: { i2_id: "$.data.id" }
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 110.0, packaging_tare_kg: 10.0, declared_ni_pct: 12.0 }
              as: IntakeClerk
              captures: { i3_id: "$.data.id" }
            - call: "POST /recycling/intakes/${i1_id}/identify-chemistry"
              payload: { identified_chemistry: "NMC622" }
              as: IntakeClerk
          trigger:
            - call: "GET /recycling/intakes"
              payload: { limit: 2, offset: 0 }
              as: IntakeClerk
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /recycling/intakes"
              payload: { limit: 2, offset: 2 }
              as: IntakeClerk
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /recycling/intakes"
              payload: { custody_state: "IDENTIFIED" }
              as: IntakeClerk
              captures: { filtered_first: "$.data[0].id", filtered_cust: "$.data[0].custody_state" }
          assert:
            - "The first page returns HTTP 200 with response_type == 'array', 2 rows, total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "The second page returns 1 row with total_count == 3, offset == 2 and has_more == false"
            - "${page1_first} != ${page2_first} - offset advances the window without repeating rows"
            - "The filtered call returns exactly 1 row: ${filtered_first} == ${i1_id} and ${filtered_cust} == IDENTIFIED, total_count == 1"
            - "Intake.${i2_id}.custody_state == RECEIVED and Intake.${i3_id}.custody_state == RECEIVED - they are excluded by the filter, not deleted"

      - name: get_intake_with_unknown_uuid_returns_intake_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_INTAKE_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "A syntactically valid but unknown intake id on the read path returns HTTP 404 ERR_INTAKE_NOT_FOUND, not an empty 200 body."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z, one campus and one supplier exist; no Intake row has ever been created."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
          trigger:
            - call: "GET /recycling/intakes/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: IntakeClerk
          assert:
            - "HTTP 404 with response_type == 'error' and data.error_id == ERR_INTAKE_NOT_FOUND"
            - "GET /recycling/intakes returns total_count == 0 - the failed read created nothing"

      - name: create_intake_without_gross_mass_kg_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Intake.fields.gross_mass_kg
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=4]
        distinguishing_aspect: "gross_mass_kg is declared source: input with no default, so omitting it returns HTTP 400 ERR_INVALID_REQUEST rather than defaulting to 0."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z, one campus and one supplier exist."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id" }
          trigger:
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", packaging_tare_kg: 10.0 }
              as: IntakeClerk
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /recycling/intakes returns total_count == 0"

      - name: create_intake_omitting_optional_fields_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Intake.fields.declared_ni_pct
          - entities.Intake.fields.moisture_pct
          - entities.ProcessingLine.fields.changeover_buffer_hours
          - entities.Supplier.fields.credit_hold
        distinguishing_aspect: "Omitting every optional input leaves the six assay/quality percentages at 0.0, ProcessingLine.changeover_buffer_hours at 6 with status AVAILABLE, and the Supplier's four computed ledger fields at their zero/false defaults."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z and one campus exist; no supplier, line or intake yet."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
          trigger:
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id", sup_hold: "$.data.credit_hold", sup_payable: "$.data.payable_balance_cents", sup_paid: "$.data.paid_to_date_cents", sup_strikes: "$.data.quality_strike_count" }
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 110.0, packaging_tare_kg: 10.0 }
              as: IntakeClerk
              captures: { i_id: "$.data.id", ni: "$.data.declared_ni_pct", moist: "$.data.moisture_pct", foreign: "$.data.foreign_material_pct" }
            - call: "POST /recycling/processing-lines"
              payload: { facility_id: "${fac_id}", line_code: "HYD-1", line_type: "HYDROMET", chemistry_family: "NICKEL_RICH", throughput_kg_per_hour: 60.0 }
              as: PlatformAdmin
              captures: { line_id: "$.data.id", buf: "$.data.changeover_buffer_hours", line_status: "$.data.status" }
          assert:
            - "${sup_hold} == false, ${sup_payable} == 0, ${sup_paid} == 0 and ${sup_strikes} == 0"
            - "${ni} == 0.0, ${moist} == 0.0 and ${foreign} == 0.0"
            - "Intake.${i_id}.declared_co_pct == 0.0, declared_li_pct == 0.0, declared_cu_pct == 0.0"
            - "Intake.${i_id}.custody_state == RECEIVED and compliance_state == MANIFEST_DRAFT (enum defaults)"
            - "${buf} == 6 and ${line_status} == AVAILABLE"
            - "MetalIndexPrice created with source_index omitted defaults to 'LME' (checked in the index-price corner instances)"

      - name: intake_mass_fields_are_computed_from_gross_tare_and_modules
        claim_type: computed_fields
        grounds:
          - entities.Intake.fields.net_mass_kg
          - entities.Intake.fields.module_mass_total_kg
          - entities.Intake.fields.unassigned_mass_kg
          - complexity_profile.complexity_layers.derived_field_reconciliation
        distinguishing_aspect: "net_mass_kg is derived as gross 850.0 minus tare 50.0 = 800.0 at creation and never supplied, while module_mass_total_kg / unassigned_mass_kg are re-derived on each module insert, moving 0.0 -> 400.0 -> 800.0."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z, one campus, one supplier, one IDENTIFIED NMC622 intake of gross 850.0 kg and tare 50.0 kg."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id" }
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 850.0, packaging_tare_kg: 50.0, declared_ni_pct: 12.0 }
              as: IntakeClerk
              captures: { i_id: "$.data.id", net: "$.data.net_mass_kg" }
            - call: "POST /recycling/intakes/${i_id}/identify-chemistry"
              payload: { identified_chemistry: "NMC622" }
              as: IntakeClerk
              captures: { i_v2: "$.data.version" }
          trigger:
            - call: "POST /recycling/intakes/${i_id}/modules"
              payload: { serial_code: "M-1", mass_kg: 400.0, min_cell_capacity_pct: 58.0, mean_cell_capacity_pct: 62.0, cycle_count: 1200, expected_intake_version: "${i_v2}" }
              as: IntakeClerk
              captures: { m1_id: "$.data.id" }
            - call: "GET /recycling/intakes/${i_id}"
              payload: {}
              as: IntakeClerk
              captures: { total1: "$.data.module_mass_total_kg", unassigned1: "$.data.unassigned_mass_kg", i_v3: "$.data.version" }
            - call: "POST /recycling/intakes/${i_id}/modules"
              payload: { serial_code: "M-2", mass_kg: 400.0, min_cell_capacity_pct: 58.0, mean_cell_capacity_pct: 62.0, cycle_count: 1200, expected_intake_version: "${i_v3}" }
              as: IntakeClerk
              captures: { m2_id: "$.data.id" }
            - call: "GET /recycling/intakes/${i_id}"
              payload: {}
              as: IntakeClerk
              captures: { total2: "$.data.module_mass_total_kg", unassigned2: "$.data.unassigned_mass_kg", assigned2: "$.data.assigned_mass_kg" }
          assert:
            - "${net} == 800.0 - net_mass_kg is computed, never accepted as input (it is absent from the endpoint's input list)"
            - "${total1} == 400.0 and ${unassigned1} == 400.0 after the first module"
            - "${total2} == 800.0, ${unassigned2} == 800.0 and ${assigned2} == 0.0 after the second"
            - "Module.${m1_id}.chemistry == NMC622 and Module.${m2_id}.chemistry == NMC622 - copied from the intake's identified_chemistry, not supplied"
            - "Module.${m1_id}.status == PENDING_TRIAGE with second_life_score == null, grade == null and lot_id == null"

      - name: intake_system_fields_are_stamped_from_the_logical_clock
        claim_type: system_fields
        grounds:
          - entities.Intake.fields.received_at
          - endpoints[POST /recycling/_clock/set_current_utc]
        distinguishing_aspect: "received_at is stamped from the logical clock at creation (2026-07-10T00:00:00.000Z) and stays frozen when the clock later moves to 2026-08-20, while version advances 1 -> 2 on the identify write."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z, one campus, one supplier."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id" }
          trigger:
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 110.0, packaging_tare_kg: 10.0, declared_ni_pct: 12.0 }
              as: IntakeClerk
              captures: { i_id: "$.data.id", recv: "$.data.received_at", v1: "$.data.version" }
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/intakes/${i_id}/identify-chemistry"
              payload: { identified_chemistry: "NMC622" }
              as: IntakeClerk
              captures: { recv2: "$.data.received_at", v2: "$.data.version" }
          assert:
            - "${recv} == 2026-07-10T00:00:00.000Z - stamped from the logical clock, not wall time"
            - "${v1} == 1 and ${v2} == 2 - every accepted write bumps version by exactly 1"
            - "${recv2} == 2026-07-10T00:00:00.000Z - a system field is not re-stamped by later writes"
            - "Intake.${i_id}.id is server-minted and Intake.${i_id}.created_at == 2026-07-10T00:00:00.000Z"

      - name: create_intake_with_out_of_range_values_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Intake.fields.declared_chemistry
          - entities.Intake.fields.packaging_tare_kg
          - entities.Intake.fields.declared_ni_pct
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Three independent constraint families all land on HTTP 400 ERR_INVALID_REQUEST: an enum member outside {NMC622, NCA, LMO, LFP}, a tare not strictly below gross, and an assay percentage above 100.0."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z, one campus, one supplier."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id" }
          trigger:
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "LTO", gross_mass_kg: 110.0, packaging_tare_kg: 10.0 }
              as: IntakeClerk
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 110.0, packaging_tare_kg: 110.0 }
              as: IntakeClerk
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 110.0, packaging_tare_kg: 10.0, declared_ni_pct: 120.0 }
              as: IntakeClerk
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 110.0, packaging_tare_kg: 10.0, declared_ni_pct: 100.0 }
              as: IntakeClerk
              captures: { ok_id: "$.data.id", ok_net: "$.data.net_mass_kg" }
          assert:
            - "The LTO call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "The tare == gross call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST (packaging_tare_kg must be strictly below gross_mass_kg)"
            - "The declared_ni_pct 120.0 call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "The boundary-valid declared_ni_pct 100.0 call returns HTTP 201 with ${ok_net} == 100.0 - 100.0 is inside the closed range"
            - "GET /recycling/intakes reports total_count == 1: only ${ok_id} was persisted"

      - name: metal_index_price_rows_are_immutable_and_carry_no_version
        claim_type: immutability
        grounds:
          - entities.MetalIndexPrice
          - endpoints[POST /recycling/metal-index-prices]
          - endpoints[GET /recycling/metal-index-prices]
        distinguishing_aspect: "MetalIndexPrice is declared common_fields: false, so its rows expose no version and no updated_at, §1.5 offers no update or delete route for a quote, and a correction is expressed only by appending a later-dated quote."
        test_recipe:
          setup:
