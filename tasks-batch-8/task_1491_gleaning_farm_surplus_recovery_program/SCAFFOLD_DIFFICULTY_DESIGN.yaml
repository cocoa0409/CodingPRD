          assert:
            - "lbs == 1.0 (0.5 + 0.5 aggregated before pricing)"
            - "cents == 33 (round_half_up(1.0 * 33)); a per-line-then-sum implementation yields 34 and MUST fail"

      - name: agency_capacity_multi_input_nonlinear
        grounds:
          - calculations.agency_capacity_check
          - entities.Agency.fields.current_week_committed_lbs
          - validations[priority=17]
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear interaction: feasibility of a new
          Distribution depends on (i) planned_lbs of SCHEDULED distributions,
          (ii) delivered_lbs of DELIVERED/SHORTFALL distributions (note: after
          delivery the DELIVERED row contributes delivered_lbs, which may differ
          from its original planned_lbs), and (iii) ISO-week bucketing of
          delivery_date — a conditional branch on status set membership. With
          weekly_capacity 500.0: a SCHEDULED 300.0 + a SHORTFALL-delivered 100.0
          (planned 150.0) commit 400.0, so a new 100.0 planned is allowed
          (equality) while 100.1 is rejected; had the SHORTFALL row been counted
          at planned_lbs the totals would be 450.0 and 50.0 allowed — the
          status-keyed input selection changes the answer.
        test_recipe:
          setup:
            - "Agency capacity 500.0 refrigeration false; farm/offer/event harvested 600.0 lbs; dist1 planned 300.0 SCHEDULED delivery 2026-08-12; dist2 planned 150.0 delivered 100.0 SHORTFALL delivery 2026-08-12"
