  - section: validations
    instances:
      - name: auth_missing_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH]"]

        distinguishing_aspect: "Request without X-User-Role header returns 401 ERR_MISSING_AUTH before any other check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            # No `as:` field — simulated by the test harness omitting the headers
            - call: "GET /dairy/producers"
              as: PlantController
          assert:
            - "HTTP 401 ERR_MISSING_AUTH when headers absent"

      - name: wrong_role_returns_403
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED_ROLE]"]

        distinguishing_aspect: "LabTechnician attempting POST /dairy/producers (PlantController-only) returns 403 ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
          trigger:
            - call: "POST /dairy/producers"
              payload: { producer_code: "PX", farm_name: "FX", base_hauling_rate_cents_per_cwt: 100 }
              as: LabTechnician
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 ERR_UNAUTHORIZED_ROLE"

      - name: stale_producer_version_returns_412
        claim_type: violation_to_error
        grounds: ["concurrency_rules[tanker-disposition-stale-producer]", "errors[ERR_STALE_PRODUCER_VERSION]"]

        distinguishing_aspect: "Release with expected_producer_version that lags Producer.version returns 412 ERR_STALE_PRODUCER_VERSION."
        test_recipe:
          setup: ["Receipt with passing lab results; producer version advanced by prior release"]
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PV", farm_name: "FV", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
              captures: { prod_id: $.data.id }
            - call: "POST /dairy/haulers"
              payload: { hauler_code: "HV", company_name: "Haul", license_expires_at: "2027-01-01T00:00:00Z" }
              as: PlantController
              captures: { hauler_id: $.data.id }
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-V", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
            # First receipt: release it, advancing Producer.version from 1 → 2
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-05T08:00:00Z", gross_weight_lbs: 50000, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
              captures: { r1: $.data.id }
            - call: "POST /dairy/tanker-receipts/${r1}/lab-tests"
              payload: { test_type: "ANTIBIOTIC", result_value: 0, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt1a: $.data.id }
            - call: "POST /dairy/tanker-receipts/${r1}/lab-tests"
              payload: { test_type: "SCC", result_value: 300000, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt1b: $.data.id }
            - call: "POST /dairy/tanker-receipts/${r1}/lab-tests/${lt1a}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /dairy/tanker-receipts/${r1}/lab-tests/${lt1b}/complete"
              payload: {}
              as: LabTechnician
            - call: "GET /dairy/producers/${prod_id}"
              as: PlantController
              captures: { prod_v_5: "$.data.version" }
            - call: "POST /dairy/tanker-receipts/${r1}/release"
              payload: { expected_producer_version: "${prod_v_5}" }
              as: QualityAssuranceManager
            # Second receipt — client holds stale view (expects 1, but producer.version is now 2)
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-06T08:00:00Z", gross_weight_lbs: 50000, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
              captures: { r2: $.data.id }
            - call: "POST /dairy/tanker-receipts/${r2}/lab-tests"
              payload: { test_type: "ANTIBIOTIC", result_value: 0, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt2a: $.data.id }
            - call: "POST /dairy/tanker-receipts/${r2}/lab-tests"
              payload: { test_type: "SCC", result_value: 300000, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt2b: $.data.id }
            - call: "POST /dairy/tanker-receipts/${r2}/lab-tests/${lt2a}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /dairy/tanker-receipts/${r2}/lab-tests/${lt2b}/complete"
              payload: {}
              as: LabTechnician
          trigger:
            - call: "GET /dairy/producers/${prod_id}"
              as: PlantController
              captures: { prod_v_6: "$.data.version" }
            - call: "POST /dairy/tanker-receipts/${r2}/release"
              payload: { expected_producer_version: "${prod_v_6}" }
              as: QualityAssuranceManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 ERR_STALE_PRODUCER_VERSION (Producer.version == 2, client sent 1)"

      - name: stale_pool_version_returns_412
        claim_type: violation_to_error
        grounds: ["concurrency_rules[pool-finalize-stale-pool]", "errors[ERR_STALE_POOL_VERSION]"]

        distinguishing_aspect: "Finalize with expected_pool_version that lags the pool's actual version returns 412 ERR_STALE_POOL_VERSION."
        test_recipe:
          setup: ["Pool ANNOUNCED, version is now N+1 (announce bumped version); client holds stale expected_pool_version=N"]
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/marketing-order-pools"
              payload: { pool_month: "2026-05", announced_class_i_price_cents: 2200, butterfat_price_cents_per_lb: 300, protein_price_cents_per_lb: 250, other_solids_price_cents_per_lb: 40 }
              as: PlantController
              captures: { pool_id: $.data.id, pool_v_at_create: $.data.version }
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-23T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/marketing-order-pools/${pool_id}/announce"
              payload: {}
              as: PlantController
          trigger:
            - call: "POST /dairy/marketing-order-pools/${pool_id}/finalize"
              payload: { expected_pool_version: "${pool_v_at_create}" }
              as: PlantController
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 ERR_STALE_POOL_VERSION (pool version advanced by announce)"

