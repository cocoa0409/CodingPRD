            - { call: "POST /install-windows", payload: { installation_phase_id: "${ph_id}", start_at: "2026-12-02T10:00:00Z", end_at: "2026-12-02T14:00:00Z", union_required: false, elevator_required: false, crew_size: 4 }, as: DealerRep, as_user_id: "${dlr_id}", captures: { wb: "$.data.id" } }
