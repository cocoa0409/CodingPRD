              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { inbound_id: "$.data.id" }
          trigger:
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX401", origin_station_id: "${muc_id}", dest_station_id: "${txl_id}", dep_utc: "2026-11-03T08:39:00Z", arr_utc: "2026-11-03T09:39:00Z", fleet_type_code: "B738", connects_from_leg_id: "${inbound_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX401", origin_station_id: "${muc_id}", dest_station_id: "${txl_id}", dep_utc: "2026-11-03T08:40:00Z", arr_utc: "2026-11-03T09:40:00Z", fleet_type_code: "B738", connects_from_leg_id: "${inbound_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { onward_id: "$.data.id" }
          assert:
            - "trigger call 1 (39 minutes) -> HTTP 422 with data.error_id == \"ERR_MIN_CONNECT_TIME_VIOLATION\"; ScheduleVersion.${sv_id}.leg_count is still 1 and mct_violation_count == 0"
            - "trigger call 2 (exactly 40 minutes) -> HTTP 201; FlightLeg.${onward_id}.connect_minutes == 40, mct_shortfall_minutes == 0, is_international == false, block_minutes == 60"
            - "ScheduleVersion.${sv_id}.leg_count == 2, mct_violation_count == 0, schedule_compliance_score == 100.00, compliance_state == \"CLEAN\""
            - "FlightLeg.${onward_id}.connects_from_leg_id == \"${inbound_id}\" and the inbound leg's own connect_minutes == null (it connects from nothing)"

      - name: utilization_records_posted_out_of_chronological_order_credit_the_same_total
        claim_type: ordering
        grounds:
          - calculations.slot_utilization_credit
          - endpoints.POST_slot_utilization_records
          - endpoints.GET_slot_utilization_records
        distinguishing_aspect: |
          The input set is defined as "ascending operation_date, then ascending created_at for ties", so
          four records inserted as 11-23, 11-02, 11-16, 11-09 must produce exactly the same
          credited_operations 3 and utilization_pct 60.00 as an in-order insertion, with the
          CANCELLED_CARRIER record flagged credited false. An implementation that credits by insertion
          position or that stops at the first non-credited record reports a different total.
        test_recipe:
          setup:
            - "Home carrier HX; FRA LEVEL_3_COORDINATED; Season W26 OPEN."
            - "One FRA DEPARTURE holding at 2026-11-02T08:00:00Z, days_of_week \"1\", series_weeks 5, so planned_operations == 5 * 1 == 5."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: false }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { sh_id: "$.data.id" }
          trigger:
            - call: "POST /slot-utilization-records"
              payload: { slot_holding_id: "${sh_id}", operation_date: "2026-11-23T00:00:00Z", outcome: "CANCELLED_CARRIER" }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { rec_last_id: "$.data.id", rec_last_credited: "$.data.credited" }
            - call: "POST /slot-utilization-records"
              payload: { slot_holding_id: "${sh_id}", operation_date: "2026-11-02T00:00:00Z", outcome: "OPERATED" }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { rec_first_id: "$.data.id" }
            - call: "POST /slot-utilization-records"
              payload: { slot_holding_id: "${sh_id}", operation_date: "2026-11-16T00:00:00Z", outcome: "CANCELLED_ATC" }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
            - call: "POST /slot-utilization-records"
              payload: { slot_holding_id: "${sh_id}", operation_date: "2026-11-09T00:00:00Z", outcome: "OPERATED" }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
            - call: "GET /slot-utilization-records"
              payload: { slot_holding_id: "${sh_id}", credited: true, limit: 10, offset: 0 }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
          assert:
            - "the CANCELLED_CARRIER record has credited == false; the OPERATED and CANCELLED_ATC records all have credited == true and recorded_by_user_id == \"usr-coord-1\""
            - "SlotHolding.${sh_id}.planned_operations == 5, credited_operations == 3, utilization_pct == 60.00"
            - "SlotHolding.${sh_id}.utilization_pct_as_filed == 0.00 and at_risk_of_loss == false — posting records never touches the as_filed variant"
            - "the GET with credited=true reports total_count == 3 and has_more == false"
            - "SlotHolding.${sh_id}.holding_status == \"HELD\" — only the season slot-audit may move it to LOST"

      - name: constants_are_read_from_the_declared_rate_table_not_hardcoded_percentages
        claim_type: constants_applied
        grounds:
          - calculations.filing_change_charge_cents.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / filing_charge_expedite_fee_keyed_on_post_surcharge_subtotal_not_raw
          rationale: "That instance pins BASE_RATE_PER_LEG_CENTS, all three tier surcharges and all three expedite rates simultaneously across four submissions, and separates the correct answer from the raw-keyed one."

      - name: money_is_rounded_per_component_before_summation
        claim_type: precision
        grounds:
          - calculations.notification_compensation_cents.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / notification_compensation_rounds_each_cabin_before_summing
          rationale: "561132 (round each cabin, then sum) versus 561131 (sum, then round) is asserted there on a three-cabin snapshot."

      - name: merged_intervals_treat_touching_endpoints_as_non_overlapping
        claim_type: adjacency_merge
        grounds:
          - calculations.gate_occupancy_load
        excluded_because:
          difficulty_instance: resource_temporal_overlap / station_gate_occupancy_intervals_are_half_open_so_touching_endpoints_do_not_overlap
          rationale: "The half-open [start, end) semantics of GATE_PREP_MINUTES/GATE_RELEASE_MINUTES windows are asserted there at an exactly-touching endpoint pair."

      - name: rotation_constraints_propagate_along_the_ordered_leg_chain
        claim_type: constraint_propagation
        grounds:
          - calculations.rotation_feasibility_evaluation
        excluded_because:
          difficulty_instance: resource_temporal_overlap / aircraft_turn_buffer_widens_for_international_inbound_at_the_same_point_adjacency
          rationale: "INTERNATIONAL_TURN_BUMP_MINUTES 15 changing the required turn at the identical adjacency is asserted there, together with the ordered chain and first_violation_leg_id."

      - name: the_two_variants_of_a_dual_variant_calculation_disagree_on_the_same_row
        claim_type: variant_divergence
        grounds:
          - calculations.maintenance_opportunity_minutes.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / maintenance_contiguous_window_versus_cumulative_ground_diverge_on_one_tail
          rationale: "Longest single merged window versus the sum of all merged windows are stored side by side on one tail and differ there."

      - name: the_audit_selects_the_as_operated_variant_and_never_the_as_filed_one
        claim_type: variant_selection
        grounds:
          - calculations.slot_utilization_credit.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / slot_utilization_as_operated_versus_as_filed_diverge_on_one_holding
          rationale: "That instance drives the two variants to different values on one holding and shows the use-it-or-lose-it audit acting on utilization_pct alone while at_risk_of_loss follows utilization_pct_as_filed."

      - name: both_variants_remain_simultaneously_readable_after_recomputation
        claim_type: reconciliation
        grounds:
          - calculations.slot_utilization_credit.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / slot_utilization_as_operated_versus_as_filed_diverge_on_one_holding
          rationale: "Both output fields are asserted in the same GET after each mutation there, so neither variant overwrites the other."

  # ===================================================================
  # SECTION 4 — validations  (§1.4, 67 rules, priorities 1..80)
  # ===================================================================
  - section: validations
    instances:

      - name: slot_holdings_exist_only_at_fully_coordinated_stations
        claim_type: violation_to_error
        grounds:
          - "validations.priority_57_ERR_STATION_NOT_COORDINATED"
          - endpoints.POST_slot_holdings
        distinguishing_aspect: |
          A SlotHolding at LEVEL_2_FACILITATED MUC must be refused with ERR_STATION_NOT_COORDINATED
          (422) while the identical request at LEVEL_3_COORDINATED FRA is created HELD. Both directions
          are exercised against the same season and carrier, so only the station's coordination_level can
          explain the difference.
        test_recipe:
          setup:
            - "Home carrier HX; FRA LEVEL_3_COORDINATED; MUC LEVEL_2_FACILITATED; Season W26 OPEN."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
          trigger:
            - call: "POST /slot-holdings"
              payload: { station_id: "${muc_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: false }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { err: "$.data.error_id" }
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: false }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { sh_id: "$.data.id" }
          assert:
            - "trigger call 1 -> HTTP 422 with data.error_id == \"ERR_STATION_NOT_COORDINATED\""
            - "trigger call 2 -> HTTP 201; SlotHolding.${sh_id}.holding_status == \"HELD\", planned_operations == 5, station_id == \"${fra_id}\""
            - "Carrier.${home_carrier_id}.held_series_count == 1 — the rejected holding was never counted"
            - "GET /slot-holdings filtered by station_id ${muc_id} returns total_count == 0"

      - name: exchange_needs_a_counter_slot_and_transfer_must_not_carry_one
        claim_type: cross_field_consistency
        grounds:
          - "validations.priority_65_ERR_COUNTER_SLOT_REQUIRED"
          - endpoints.POST_slot_transactions
        distinguishing_aspect: |
          counter_slot_holding_id is REQUIRED when kind == EXCHANGE and FORBIDDEN when kind == TRANSFER,
          so the same rule must fire from both directions: EXCHANGE without it -> 422, TRANSFER with it
          -> 422, EXCHANGE with it -> 201. A one-sided presence check passes two of these three calls.
        test_recipe:
          setup:
            - "Home carrier HX (DE) and partner carrier XP (PT, is_home_carrier false); FRA LEVEL_3_COORDINATED; Season W26 OPEN."
            - "HX holds a FRA DEPARTURE series at 08:00Z (historic_precedence false) and XP holds a FRA DEPARTURE series at 10:00Z, so the two series never conflict on time-of-day."
            - "Clock at its default 2026-08-01T00:00:00Z, before the response_deadline_utc 2026-09-01T00:00:00Z and before the season's slot_return_deadline_utc."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /carriers"
              payload: { iata_code: "XP", icao_code: "XPA", country_code: "PT", is_home_carrier: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { partner_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: false }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { hx_hold_id: "$.data.id", hx_hold_version: "$.data.version" }
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${partner_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T10:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: false }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { xp_hold_id: "$.data.id" }
          trigger:
            - call: "POST /slot-transactions"
              payload: { kind: "EXCHANGE", counterparty_carrier_id: "${partner_carrier_id}", offered_slot_holding_id: "${hx_hold_id}", response_deadline_utc: "2026-09-01T00:00:00Z", expected_slot_holding_version: "${hx_hold_version}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { err1: "$.data.error_id" }
            - call: "POST /slot-transactions"
              payload: { kind: "TRANSFER", counterparty_carrier_id: "${partner_carrier_id}", offered_slot_holding_id: "${hx_hold_id}", counter_slot_holding_id: "${xp_hold_id}", response_deadline_utc: "2026-09-01T00:00:00Z", expected_slot_holding_version: "${hx_hold_version}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { err2: "$.data.error_id" }
            - call: "POST /slot-transactions"
              payload: { kind: "EXCHANGE", counterparty_carrier_id: "${partner_carrier_id}", offered_slot_holding_id: "${hx_hold_id}", counter_slot_holding_id: "${xp_hold_id}", response_deadline_utc: "2026-09-01T00:00:00Z", expected_slot_holding_version: "${hx_hold_version}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { tx_id: "$.data.id" }
          assert:
            - "trigger call 1 -> HTTP 422 with data.error_id == \"ERR_COUNTER_SLOT_REQUIRED\" (EXCHANGE without a counter slot)"
            - "trigger call 2 -> HTTP 422 with data.error_id == \"ERR_COUNTER_SLOT_REQUIRED\" (TRANSFER carrying a counter slot)"
            - "trigger call 3 -> HTTP 201; SlotTransaction.${tx_id}.status == \"PROPOSED\", kind == \"EXCHANGE\", initiating_carrier_id == \"${home_carrier_id}\" (copied off the offered holding, not supplied), proposed_by_user_id == \"${home_carrier_id}\", counter_slot_holding_id == \"${xp_hold_id}\""
            - "SlotHolding.${hx_hold_id}.pending_transaction_id == \"${tx_id}\" and SlotHolding.${xp_hold_id}.pending_transaction_id == \"${tx_id}\" — only the accepted proposal encumbered the series"
            - "GET /slot-transactions returns total_count == 1"

      - name: a_historic_series_may_be_exchanged_but_never_transferred_outright
        claim_type: referential_state
        grounds:
          - "validations.priority_71_ERR_HISTORIC_PRECEDENCE_PROTECTED"
          - entities.SlotHolding.fields.historic_precedence
        distinguishing_aspect: |
          Grandfather rights are protected against disposal, not against swaps: with the offered series
          carrying historic_precedence true, a TRANSFER proposal is refused with
          ERR_HISTORIC_PRECEDENCE_PROTECTED (409) while an EXCHANGE proposal on that same series is
          accepted. Blocking both, or neither, is wrong.
        test_recipe:
          setup:
            - "Home carrier HX (DE) and partner carrier XP (PT); FRA LEVEL_3_COORDINATED; Season W26 OPEN."
            - "HX's FRA DEPARTURE series at 08:00Z is created with historic_precedence true; XP's series at 10:00Z has historic_precedence false."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /carriers"
              payload: { iata_code: "XP", icao_code: "XPA", country_code: "PT", is_home_carrier: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { partner_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: true }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { hx_hold_id: "$.data.id", hx_hold_version: "$.data.version" }
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${partner_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T10:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: false }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { xp_hold_id: "$.data.id" }
          trigger:
            - call: "POST /slot-transactions"
              payload: { kind: "TRANSFER", counterparty_carrier_id: "${partner_carrier_id}", offered_slot_holding_id: "${hx_hold_id}", response_deadline_utc: "2026-09-01T00:00:00Z", expected_slot_holding_version: "${hx_hold_version}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /slot-transactions"
              payload: { kind: "EXCHANGE", counterparty_carrier_id: "${partner_carrier_id}", offered_slot_holding_id: "${hx_hold_id}", counter_slot_holding_id: "${xp_hold_id}", response_deadline_utc: "2026-09-01T00:00:00Z", expected_slot_holding_version: "${hx_hold_version}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { tx_id: "$.data.id" }
          assert:
            - "trigger call 1 -> HTTP 409 with data.error_id == \"ERR_HISTORIC_PRECEDENCE_PROTECTED\", NOT ERR_COUNTER_SLOT_REQUIRED — a TRANSFER correctly omits the counter slot, so the 65 rule is satisfied and the 71 rule is the one that fires"
            - "SlotHolding.${hx_hold_id}.pending_transaction_id == null after the rejected TRANSFER"
            - "trigger call 2 -> HTTP 201; SlotTransaction.${tx_id}.kind == \"EXCHANGE\" and status == \"PROPOSED\""
            - "SlotHolding.${hx_hold_id}.historic_precedence is still true and holding_status == \"HELD\""

      - name: weekly_frequency_cap_admits_two_legs_then_rejects_the_third_in_the_same_iso_week
        claim_type: temporal_window
        grounds:
          - "validations.priority_69_ERR_FREQUENCY_CAP_EXCEEDED"
          - entities.RouteAuthority.fields.weekly_frequency_cap
        distinguishing_aspect: |
          The cap counts non-CANCELLED legs on the unordered country pair inside ONE ISO week
          (Monday 00:00:00Z inclusive to the next Monday 00:00:00Z exclusive). With cap 2, legs on Monday
          2026-11-02 and Tuesday 2026-11-03 are accepted, Wednesday 2026-11-04 is refused with
