              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { basis_pre: $.data.basis_assessment_id }
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
            - call: "POST /assessments"
              payload: { case_id: "${case_id}", housing_score: 4, employment_score: 4, education_score: 4, language_score: 4, health_score: 4 }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /assessments/${a2_id}/submit"
              as: CaseManager
              as_user_id: "${mgr1_id}"
          trigger:
            - call: "POST /assessments/${a2_id}/verify"
              as: CaseManager
