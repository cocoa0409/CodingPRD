          setup:
            - "an OPEN season, plan, hub and one fully paid ACTIVE HUB_PICKUP member joining at week 1"
            - "a 5.00 lb SALMON lot allocated, split to the hub, packed and staged into a still-SCHEDULED week-1 window"
            - "a HUB_HOLD cold-chain leg of 0 minutes logged, so the evidence rung is satisfied"
          setup_api_calls:
