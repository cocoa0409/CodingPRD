            - call: "POST /cash-vault/counting-machines"
              payload: { vault_id: "${vault_id}", machine_code: "SORT-H", machine_type: "CURRENCY_SORTER", status: "AVAILABLE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { mach_id: $.data.id }
            - call: "POST /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${acct_id}", vault_id: "${vault_id}", courier_manifest_number: "MAN-801", declared_bag_count: 1 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { ticket_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags"
              payload: { deposit_ticket_id: "${ticket_id}", seal_number: "S-8001", bag_type: "CURRENCY", declared_amount_cents: 102500, declared_note_count: 100, declared_coin_weight_grams: 0 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { bag_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags/${bag_id}/custody-events"
              payload: { event_type: "PICKUP", location_code: "SITE-CUST", observed_seal_number: "S-8001" }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
            - call: "POST /cash-vault/sealed-bags/${bag_id}/custody-events"
              payload: { event_type: "VAULT_RECEIPT", location_code: "CV-08-DOCK", observed_seal_number: "S-8001" }
              as: VaultTeller
              as_user_id: "u-tel-1"
            - call: "POST /cash-vault/deposit-tickets/${ticket_id}/verify"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
            - call: "POST /cash-vault/deposit-tickets/${ticket_id}/provisional-credit"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { prov_amt: $.data.provisional_credit_cents }
            - call: "GET /cash-vault/sealed-bags/${bag_id}"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { bag_v: $.data.version }
            - call: "POST /cash-vault/count-sessions"
              payload: { sealed_bag_id: "${bag_id}", counting_machine_id: "${mach_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T10:00:00Z", expected_sealed_bag_version: "${bag_v}" }
              as: VaultTeller
