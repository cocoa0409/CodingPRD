      - name: allocation_pool_round_then_sum_not_sum_then_round
        grounds:
          - calculations.wasteload_allocation_run
          - entities.AllocationRun.fields.point_pool_lbs_yr
          - entities.AllocationRun.fields.wla_total_lbs_yr
          - entities.AllocationRun.fields.reserve_allocation_lbs_yr
          - entities.AllocationRun.fields.allocations
        distinguishing_aspect: |
          Unlike the permit-tier instance, which combines five DIFFERENT quantities in a
          pinned order, this instance combines the SAME quantity at three nested rounding
          boundaries (margin of safety, reserve set-aside, pool split, per-source spread) on
          inputs chosen so that round-then-sum and sum-then-round disagree: the three point
          allocations 3983.26 + 7966.51 + 11949.77 total 23899.54, one cent ABOVE the
          point_pool_lbs_yr of 23899.53 that produced them, and reserve_allocation_lbs_yr
          must come out 2096.44 rather than the naive 5 percent set-aside of 2096.45.
        test_recipe:
          setup:
            - "Watershed ALT (OH, TOTAL_NITROGEN, baseline 90000.00, eligible zones Z1/Z2) with reaches A_OUT (COMPLIANCE_POINT, df 1.0000, outlet) and A_MID (MAINSTEM, df 0.9500 -> A_OUT)."
            - "TmdlAssessment TMDL-N-ALT in DRAFT: loading capacity 50000.00, margin_of_safety_pct 0.0750, background estimate 4321.00, period 2026-01-01..2035-12-31, so the PROVISIONAL variant applies."
            - "Four INVENTORIED sources on A_MID: three POINT sources with existing loads 10000.00, 20000.00 and 30000.00 (controllability 0.5000 each) and one NONPOINT source with existing load 40000.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Alum Creek", state_code: "OH", watershed_code: "ALT", pollutant: "TOTAL_NITROGEN", baseline_year: 2020, baseline_load_lbs_yr: 90000.00, interim_target_pct: 25.00, uncertainty_ratio: 2.0000, retirement_ratio: 0.1000, equivalence_ratio: 1.0000, eligible_zone_codes: ["Z1", "Z2"] }
