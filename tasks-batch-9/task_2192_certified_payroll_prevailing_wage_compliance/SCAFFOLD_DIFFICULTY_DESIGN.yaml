  - rule_id: transitive_cascade
    instances:
      - name: finding_creation_cascades_to_debarment_proposal_and_cross_project_suspension
        grounds:
          - calculations.debarment_risk_score
          - state_machines.Contractor.debarment_status
          - state_machines.ContractAssignment.status
          - calculations.project_posture
        distinguishing_aspect: |
          Depth-4 cascade whose trigger is POST /findings. Hop 1 rescores the contractor
          (40, then 55, then exactly 70). Hop 2 crosses the 70 threshold and drives
          Contractor CLEAR -> PROPOSED. Hop 3 suspends EVERY ACTIVE assignment of that
          contractor on EVERY project, including project P2 which carries no findings at
          all. Hop 4 recomputes P2's posture to RESTRICTED off the suspended-assignment
          count. The observable proof that hop 3 and hop 4 really propagated across the
          aggregate boundary is that P2.open_finding_count is 0 while P2.posture is
          RESTRICTED and P2.suspended_assignment_count is 1.
        test_recipe:
          setup:
            - "One contractor holds ACTIVE prime assignments on two ACTIVE projects P1 and P2 in CA-ALAMEDA under the same determination."
            - "P1 carries one ACCEPTED, COMPLIANT weekly payroll (40.00 h paid exactly 5000 base + 2000 cash fringe, so make_whole_underpayment_cents is 0)."
            - "P2 carries no payroll and no findings."
            - "Finding creation by the labor standards auditor is an agency-side write and is not gated by project posture, so all three findings can be raised even after P1 freezes."
