  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: missing_header_beats_unknown_resource_on_scoring
        grounds:
          - validations[priority=1]
          - validations[priority=3]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
          - errors.ERR_ASSESSMENT_NOT_FOUND
        distinguishing_aspect: |
          Category pair auth vs existence: a single scoring request that both omits
          X-User-Role and targets an unallocated assessment id returns the priority-1
          ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400), not the priority-3
          ERR_ASSESSMENT_NOT_FOUND (404).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /agency/selection-assessments/00000000-0000-4000-8000-000000000000/score"
              payload: { raw_score: 70, competency_scores: { MARKET_KNOWLEDGE: 7, RELATIONSHIP: 7, RESILIENCE: 7, ETHICS: 7 } }
              as: ""
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "error_id != ERR_ASSESSMENT_NOT_FOUND"

