        grounds:
          - validations.priority_24_business_referential
          - errors.ERR_FACILITY_APPLICANT_MISMATCH
          - endpoints.POST_/credits
        distinguishing_aspect: |
          Both the applicant id and the facility id exist, so the priority-3
          existence check passes and the request survives to the priority-24
          referential check, which rejects it with 422
          ERR_FACILITY_APPLICANT_MISMATCH because the facility belongs to the
          OTHER applicant. An implementation that only checks existence creates
          the credit and lets one applicant draw on a stranger's line.
