# =============================================================================
# Task 3476 — Government Financial Reporting Award Program & Budget Practice
# Review (GFOA-style). Seed tables §1.0–§1.7.
# Difficulty target: beyond Expert — 13 flat entities, 43 endpoints, 8 state
# machines (cyclic + branching + posture-derived), 7 calculation rules,
# segregation-of-duties RBAC, blind reviewer selection, OCC on two parents.
# =============================================================================

scenario: |
  Government Financial Reporting Award Program & Budget Practice Review (Government Finance Officers Association): award program applications where governments submit annual financial reports for peer review against a checklist, reviewer recruitment and training with independence from the submitting government and blind assignment, comment generation identifying deficiencies with award decision and required improvements for future submissions, budget presentation award with separate criteria on policy documents, financial plans and communication, best practice publication development through committees with member comment periods, membership and conference operations serving finance officers across government sizes, small government scholarship and technical assistance programs, coordination with standards setters on emerging reporting requirements

domain_name: government-finance-awards
api_prefix: /gfoa

complexity_profile:
  primary_archetype: multi-party negotiation     # blind peer review with quorum + decision
  secondary_archetype: compliance / audit        # independence, SoD, version pinning
  complexity_layers:
    - selector_policy                            # blind reviewer assignment: eligibility filter + ranking + tie-break + empty-pool fallback + exclusion on retry
    - version-pinning on approval                # checklist pinned at submission create; standard pinned at publication create
    - cascading_side_effects                     # finding-submit chain (assignment->submission->cycle), standards activation chain
    - optimistic concurrency                     # OCC on ScholarshipFund.version and BestPracticePublication.version
  entity_topology: flat                          # peer entities with FK references; no URL nesting
  state_machine_shape: cyclic                    # submission appeal loop, publication revision loop, reviewer suspend/reinstate loop, plus branching decide fork
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties              # submitter != reviewer != decider; publication creator != publishing chair
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology — all parents null)
# =============================================================================
entities:
  - name: Government
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the government" }
      - { name: gov_type, type: enum, source: input, description: "CITY | COUNTY | STATE_GOV | SPECIAL_DISTRICT" }
      - { name: population_band, type: enum, source: input, description: "SMALL | MEDIUM | LARGE; SMALL = population under 10000, drives scholarship eligibility" }
      - { name: state_code, type: string, source: input, description: "Two-letter state/province code" }
      - { name: lifetime_award_count, type: integer, source: computed, default: 0, description: "Count of this government's submissions that reached DECIDED_AWARDED; incremented by the decide fork" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Finance officer's full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: government_size_band, type: enum, source: input, description: "SMALL | MEDIUM | LARGE — size of the government the officer serves; drives dues" }
      - { name: independent_finance_officer, type: boolean, source: input, default: false, description: "True if the officer practices independently (adds affiliation fee to dues)" }
      - { name: annual_dues_cents, type: integer, source: computed, description: "Computed by member_annual_dues at creation; client-supplied value ignored" }

  - name: ReviewerProfile
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member who applied to review" }
      - { name: employer_government_id, type: string, source: input, description: "FK -> Government.id; reviewer's employer — independence bar vs submissions of that government" }
      - { name: conflicted_government_ids, type: array, source: input, default: [], description: "Government ids the reviewer attests a conflict with; blind assignment excludes them for those submissions" }
      - { name: unavailability_windows, type: array, source: input, default: [], description: "List of {start_date, end_date} CLOSED date intervals (both endpoints inclusive); intervals must not intersect" }
      - { name: independence_attested, type: boolean, source: input, default: false, description: "Set true via PUT to transition TRAINED -> ELIGIBLE" }
      - { name: status, type: enum, source: system, description: "APPLICANT | TRAINED | ELIGIBLE | SUSPENDED | RETIRED; initial APPLICANT" }
      - { name: trained_at, type: datetime, source: system, description: "Logical-clock timestamp of training completion; null until TRAINED" }
      - { name: open_assignment_count, type: integer, source: computed, default: 0, description: "Assignments of this reviewer in OFFERED or ACCEPTED" }
      - { name: completed_review_count, type: integer, source: computed, default: 0, description: "Assignments of this reviewer in SUBMITTED" }
      - { name: declined_assignment_count, type: integer, source: computed, default: 0, description: "Assignments of this reviewer in DECLINED" }

  - name: ChecklistVersion
    parent: null
    common_fields: true
    fields:
      - { name: program_type, type: enum, source: input, description: "FINANCIAL_REPORTING | BUDGET_PRESENTATION" }
      - { name: version_label, type: string, source: input, description: "Human label, e.g. 2026.1" }
      - { name: pass_score, type: number, source: input, description: "Award threshold, 2dp; final_score >= pass_score (with zero MAJOR deficiencies) required for AWARDED" }
      - { name: criteria, type: array, source: input, description: "List of {criterion_code, weight}; weights are numbers that must sum to exactly 1.000" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED; initial ACTIVE; SUPERSEDED only via standards activation cascade" }

  - name: StandardsReference
    parent: null
    common_fields: true
    fields:
      - { name: topic_code, type: string, source: input, description: "Standards topic identifier, e.g. GASB-103" }
      - { name: title, type: string, source: input, description: "Standard title" }
      - { name: program_type, type: enum, source: input, description: "FINANCIAL_REPORTING | BUDGET_PRESENTATION — award program whose ACTIVE checklist this standard supersedes on activation" }
      - { name: effective_date, type: datetime, source: input, description: "Activation allowed only when logical clock >= effective_date" }
      - { name: status, type: enum, source: system, description: "ISSUED | EFFECTIVE | SUPERSEDED; initial ISSUED" }

  - name: AwardCycle
    parent: null
    common_fields: true
    fields:
      - { name: program_type, type: enum, source: input, description: "FINANCIAL_REPORTING | BUDGET_PRESENTATION" }
      - { name: fiscal_year, type: integer, source: input, description: "Award fiscal year" }
      - { name: submission_opens_at, type: datetime, source: input, description: "Half-open window start (inclusive)" }
      - { name: submission_deadline_at, type: datetime, source: input, description: "Half-open window end (exclusive); must be after opens" }
      - { name: review_close_at, type: datetime, source: input, description: "Review horizon end; must be after deadline" }
      - { name: checklist_version_id, type: string, source: input, description: "FK -> ChecklistVersion.id; must reference an ACTIVE checklist of the same program_type" }
      - { name: posture, type: enum, source: computed, description: "Derived from logical clock: now<opens -> SCHEDULED; opens<=now<deadline -> OPEN; deadline<=now<review_close -> IN_REVIEW; now>=review_close -> PAST_REVIEW" }
      - { name: submitted_count, type: integer, source: computed, default: 0, description: "Submissions of this cycle that ever reached SUBMITTED" }
      - { name: decision_ready_count, type: integer, source: computed, default: 0, description: "Submissions of this cycle that reached DECISION_READY" }
      - { name: conferred_count, type: integer, source: computed, default: 0, description: "Submissions of this cycle decided AWARDED" }

  - name: ReportSubmission
    parent: null
    common_fields: true
    fields:
      - { name: government_id, type: string, source: input, description: "FK -> Government.id; submitting government (must equal caller X-User-ID)" }
      - { name: cycle_id, type: string, source: input, description: "FK -> AwardCycle.id" }
      - { name: budget_documents, type: array, source: input, default: [], description: "List of {doc_type, title, page_count}; doc_type in POLICY | FINANCIAL_PLAN | COMMUNICATION, unique within the list; only allowed for BUDGET_PRESENTATION cycles; all three required at submit" }
      - { name: program_type, type: enum, source: system, description: "Copied from cycle at creation" }
      - { name: pinned_checklist_version_id, type: string, source: system, description: "FK -> ChecklistVersion.id; pinned from cycle.checklist_version_id at creation (version pinning)" }
      - { name: pinned_checklist_stale, type: boolean, source: computed, default: false, description: "Set true by standards cascade when the pinned checklist is SUPERSEDED while this submission is DRAFT; blocks submit" }
      - { name: appeal_round, type: integer, source: system, default: 1, description: "1 on creation; +1 per appeal" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | DECISION_READY | DECIDED_AWARDED | DECIDED_DENIED | APPEALED" }
      - { name: provisional_score, type: number, source: computed, description: "Mean of current-round SUBMITTED findings' weighted_score (2dp half-up); null when none; reset to null on appeal" }
      - { name: final_score, type: number, source: computed, description: "Computed at decide per final_award_score variant; null until decided" }
      - { name: major_deficiency_total, type: integer, source: computed, default: 0, description: "Sum of major_deficiency_count over current-round findings; reset to 0 on appeal" }
      - { name: required_improvements, type: array, source: computed, default: [], description: "On DECIDED_DENIED: texts of all MAJOR comments from current-round findings, in finding submission order" }
      - { name: award_conferred, type: boolean, source: computed, default: false, description: "True iff the decide fork selected DECIDED_AWARDED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock time of submit; null until SUBMITTED" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock time of decide; null until decided" }
      - { name: conferred_at, type: datetime, source: system, description: "Logical-clock time of an AWARDED decision; null otherwise" }

  - name: ReviewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: submission_id, type: string, source: input, description: "FK -> ReportSubmission.id" }
      - { name: reviewer_id, type: string, source: system, description: "FK -> ReviewerProfile.id; server-selected by blind_reviewer_selection; masked to null when read by GovernmentContact" }
      - { name: reviewer_alias, type: string, source: system, description: "Blind label R{appeal_round}-{seq}; seq = count of assignments ever created for this submission in this round, +1; never reused" }
      - { name: appeal_round, type: integer, source: system, description: "Copied from submission.appeal_round at creation" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | DECLINED | SUBMITTED | CANCELLED" }

  - name: ReviewFinding
    parent: null
    common_fields: false
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> ReviewAssignment.id; from the path of POST /gfoa/review-assignments/{id}/finding" }
      - { name: appeal_round, type: integer, source: system, description: "Copied from assignment.appeal_round" }
      - { name: criterion_scores, type: array, source: input, description: "List of {criterion_code, score}; score 0..100 with <=2dp; must cover exactly the pinned checklist's criteria" }
      - { name: comments, type: array, source: input, default: [], description: "List of {criterion_code, severity, text}; severity MAJOR | MINOR" }
      - { name: weighted_score, type: number, source: computed, description: "finding_weighted_score: per-criterion round2(score*weight) half-up, THEN summed (pinned rounding order)" }
      - { name: major_deficiency_count, type: integer, source: computed, default: 0, description: "Count of comments with severity MAJOR" }

  - name: BestPracticePublication
    parent: null
    common_fields: true
    fields:
      - { name: committee_name, type: string, source: input, description: "Developing committee name" }
      - { name: chair_member_id, type: string, source: input, description: "Member id of the committee chair; must be an element of member_ids; only the chair may publish" }
      - { name: member_ids, type: array, source: input, description: "Member ids on the committee; creator must be an element; only members may advance/resolve" }
      - { name: created_by_member_id, type: string, source: system, description: "X-User-ID of creator; chair may not publish a publication they created (segregation of duties)" }
      - { name: title, type: string, source: input, description: "Publication title" }
      - { name: topic_code, type: string, source: input, description: "Practice topic code" }
      - { name: pinned_standards_reference_id, type: string, source: input, default: null, description: "Standard id this practice interprets; pinned at creation; publish blocked if it has become SUPERSEDED" }
      - { name: comment_window_opens_at, type: datetime, source: system, description: "Set to logical clock at open-comment-period; null until then" }
      - { name: comment_window_closes_at, type: datetime, source: system, description: "Set from closes_at input at open-comment-period; null until then; reset to null by revise" }
      - { name: draft_number, type: integer, source: system, default: 1, description: "+1 on every revise (RESOLUTION -> DRAFTING)" }
      - { name: pending_comment_count, type: integer, source: computed, default: 0, description: "MemberComments in PENDING" }
      - { name: resolved_comment_count, type: integer, source: computed, default: 0, description: "MemberComments in ACCEPTED | REVISED | REJECTED" }
      - { name: status, type: enum, source: system, description: "DRAFTING | MEMBER_COMMENT | RESOLUTION | PUBLISHED" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock time of publish; null until PUBLISHED" }

  - name: MemberComment
    parent: null
    common_fields: true
    fields:
      - { name: publication_id, type: string, source: input, description: "FK -> BestPracticePublication.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; taken from caller X-User-ID" }
      - { name: body, type: string, source: input, description: "Comment text" }
      - { name: resolution, type: enum, source: system, description: "PENDING | ACCEPTED | REVISED | REJECTED; initial PENDING" }
      - { name: resolution_note, type: string, source: input, default: null, description: "Committee note recorded at resolve" }

  - name: ScholarshipFund
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "Fund fiscal year" }
      - { name: program_label, type: enum, source: input, description: "SCHOLARSHIP | TECHNICAL_ASSISTANCE — which small-government program this fund serves" }
      - { name: pool_total_cents, type: integer, source: input, description: "Total pool; must be > 0" }
      - { name: per_applicant_cap_cents, type: integer, source: input, description: "Per-application grant cap; must be > 0" }
      - { name: allocation_policy, type: enum, source: input, default: FLAT_CAP, description: "FLAT_CAP | PRO_RATA — selects scholarship_grant_amount variant" }
      - { name: remaining_cents, type: integer, source: computed, description: "pool_total_cents - SUM(granted_cents over GRANTED applications); initialized to pool_total_cents" }
      - { name: status, type: enum, source: computed, description: "ALLOCATING when remaining_cents > 0; EXHAUSTED when remaining_cents == 0; derived, flips both directions" }

  - name: ScholarshipApplication
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> ScholarshipFund.id" }
      - { name: government_id, type: string, source: input, description: "FK -> Government.id; must equal caller X-User-ID and have population_band SMALL" }
      - { name: purpose, type: enum, source: input, description: "CONFERENCE_SCHOLARSHIP | TECHNICAL_ASSISTANCE; must match fund.program_label (SCHOLARSHIP<-CONFERENCE_SCHOLARSHIP, TECHNICAL_ASSISTANCE<-TECHNICAL_ASSISTANCE)" }
      - { name: requested_cents, type: integer, source: input, description: "Amount requested; must be > 0" }
      - { name: granted_cents, type: integer, source: computed, default: 0, description: "Set by scholarship_grant_amount at allocate; retained for audit after RESCINDED" }
      - { name: status, type: enum, source: system, description: "PENDING | GRANTED | RESCINDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ReviewerProfile
    initial_state: APPLICANT
    terminal_states: [RETIRED]
    transitions:
      - from: APPLICANT
        to: TRAINED
        trigger: "PUT /gfoa/reviewer-profiles/{id} with status=TRAINED"
        actor: PlatformAdmin
        preconditions:
          - "profile.status == APPLICANT (else ERR_REVIEWER_STATE_INVALID)"
        side_effects:
          - "trained_at = logical clock now"
          - "increments ReviewerProfile.version by 1"
      - from: TRAINED
        to: ELIGIBLE
        trigger: "PUT /gfoa/reviewer-profiles/{id} with independence_attested=true"
        actor: Reviewer
        preconditions:
          - "caller X-User-ID == profile.id (else ERR_NOT_RESOURCE_OWNER)"
          - "profile.status == TRAINED (ERR_REVIEWER_NOT_TRAINED when APPLICANT, ERR_REVIEWER_STATE_INVALID otherwise)"
        side_effects:
          - "increments ReviewerProfile.version by 1"
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "PUT /gfoa/reviewer-profiles/{id} with status=SUSPENDED"
        actor: PlatformAdmin
        preconditions:
          - "profile.status == ELIGIBLE (else ERR_REVIEWER_STATE_INVALID)"
        side_effects:
          - "increments ReviewerProfile.version by 1"
          - "note: open assignments are NOT cancelled; they may still be completed, but accept/finding gates check ELIGIBLE"
      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "PUT /gfoa/reviewer-profiles/{id} with status=ELIGIBLE"
        actor: PlatformAdmin
        preconditions:
          - "profile.status == SUSPENDED (else ERR_REVIEWER_STATE_INVALID)"
        side_effects:
          - "increments ReviewerProfile.version by 1"
      - from: ELIGIBLE
        to: RETIRED
        trigger: "PUT /gfoa/reviewer-profiles/{id} with status=RETIRED"
        actor: PlatformAdmin
        preconditions:
          - "profile.status == ELIGIBLE (else ERR_REVIEWER_STATE_INVALID)"
        side_effects:
          - "increments ReviewerProfile.version by 1"
      - from: SUSPENDED
        to: RETIRED
        trigger: "PUT /gfoa/reviewer-profiles/{id} with status=RETIRED"
        actor: PlatformAdmin
        preconditions:
          - "profile.status == SUSPENDED (else ERR_REVIEWER_STATE_INVALID)"
        side_effects:
          - "increments ReviewerProfile.version by 1"

  - entity: ChecklistVersion
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "cascade from POST /gfoa/standards-references/{id}/activate (system)"
        actor: system
        preconditions:
          - "activated standard's program_type == this checklist's program_type"
          - "this checklist is the ACTIVE one for that program_type"
        side_effects:
          - "every DRAFT ReportSubmission with pinned_checklist_version_id == this checklist gets pinned_checklist_stale = true (cascade link 2)"

  - entity: StandardsReference
    initial_state: ISSUED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ISSUED
        to: EFFECTIVE
        trigger: "POST /gfoa/standards-references/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "logical clock now >= effective_date (else ERR_STANDARD_NOT_YET_EFFECTIVE)"
          - "standard.status == ISSUED (else ERR_STANDARD_STATE_INVALID)"
        side_effects:
          - "every other EFFECTIVE StandardsReference with the same topic_code -> SUPERSEDED"
          - "the ACTIVE ChecklistVersion whose program_type == this standard's program_type -> SUPERSEDED (cascade link 1)"
          - "increments StandardsReference.version by 1"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "cascade from a later POST /gfoa/standards-references/{id}/activate on the same topic_code (system)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ReportSubmission
    initial_state: DRAFT
    terminal_states: [DECIDED_AWARDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /gfoa/report-submissions/{id}/submit"
        actor: GovernmentContact
        preconditions:
          - "caller X-User-ID == submission.government_id (else ERR_NOT_RESOURCE_OWNER)"
          - "submission.status == DRAFT (else ERR_SUBMISSION_STATE_INVALID)"
          - "pinned_checklist_stale == false (else ERR_CHECKLIST_PIN_STALE)"
          - "cycle posture == OPEN, i.e. opens <= now < deadline (else ERR_SUBMISSION_WINDOW_CLOSED)"
          - "if program_type == BUDGET_PRESENTATION: budget_documents covers all of POLICY, FINANCIAL_PLAN, COMMUNICATION (else ERR_BUDGET_DOCUMENTS_INCOMPLETE)"
        side_effects:
          - "submitted_at = logical clock now"
          - "cycle.submitted_count += 1"
          - "increments ReportSubmission.version by 1; increments AwardCycle.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "first POST /gfoa/review-assignments for this submission"
        actor: AwardsDirector
        preconditions:
          - "submission.status IN {SUBMITTED, APPEALED, UNDER_REVIEW} (else ERR_SUBMISSION_STATE_INVALID)"
          - "fewer than REQUIRED_FINDINGS_PER_ROUND (3) active (OFFERED/ACCEPTED/SUBMITTED) assignments in the current appeal_round (else ERR_REVIEW_QUORUM_FULL)"
        side_effects:
          - "increments ReportSubmission.version by 1"
        note: "assignments 2 and 3 of a round are created while the submission is already UNDER_REVIEW — the flip fires only on the round's first assignment"
      - from: APPEALED
        to: UNDER_REVIEW
        trigger: "first POST /gfoa/review-assignments for this submission in the new appeal_round"
        actor: AwardsDirector
        preconditions:
          - "submission.status IN {SUBMITTED, APPEALED, UNDER_REVIEW} (else ERR_SUBMISSION_STATE_INVALID)"
          - "fewer than 3 active assignments in the current (new) appeal_round (else ERR_REVIEW_QUORUM_FULL)"
        side_effects:
          - "increments ReportSubmission.version by 1"
      - from: UNDER_REVIEW
        to: DECISION_READY
        trigger: "cascade: third current-round ReviewFinding submitted (system)"
        actor: system
        preconditions:
          - "count of current-round findings == REQUIRED_FINDINGS_PER_ROUND (3)"
        side_effects:
          - "cycle.decision_ready_count += 1 (cascade link 3)"
          - "increments ReportSubmission.version by 1; increments AwardCycle.version by 1"
      - from: DECISION_READY
        to: DECIDED_AWARDED
        trigger: "POST /gfoa/report-submissions/{id}/decide"
        actor: AwardsDirector
        preconditions:
          - "submission.status == DECISION_READY (from UNDER_REVIEW: ERR_FINDINGS_INCOMPLETE; from DRAFT/SUBMITTED: ERR_SUBMISSION_STATE_INVALID)"
          - "computed final_score >= pinned checklist pass_score AND major_deficiency_total == 0"
        side_effects:
          - "final_score computed per final_award_score variant of program_type; decided_at = now"
          - "award_conferred = true; conferred_at = now"
          - "cycle.conferred_count += 1"
          - "government.lifetime_award_count += 1"
          - "increments ReportSubmission.version by 1; increments AwardCycle.version by 1; increments Government.version by 1"
        note: "branch A of the decide fork — divergent side effects vs DENIED branch"
      - from: DECISION_READY
        to: DECIDED_DENIED
        trigger: "POST /gfoa/report-submissions/{id}/decide"
        actor: AwardsDirector
        preconditions:
          - "submission.status == DECISION_READY (same error split as AWARDED branch)"
          - "computed final_score < pinned checklist pass_score OR major_deficiency_total > 0"
        side_effects:
          - "final_score computed and stored; decided_at = now"
          - "required_improvements = texts of all MAJOR comments from current-round findings in finding submission order"
          - "award_conferred stays false; government.lifetime_award_count unchanged"
          - "increments ReportSubmission.version by 1"
        note: "branch B of the decide fork"
      - from: DECIDED_DENIED
        to: APPEALED
        trigger: "POST /gfoa/report-submissions/{id}/appeal"
        actor: GovernmentContact
        preconditions:
          - "caller X-User-ID == submission.government_id (else ERR_NOT_RESOURCE_OWNER)"
          - "submission.status == DECIDED_DENIED (else ERR_SUBMISSION_STATE_INVALID)"
          - "logical clock now <= decided_at + APPEAL_WINDOW_DAYS (30 days) (else ERR_APPEAL_WINDOW_CLOSED)"
        side_effects:
          - "appeal_round += 1"
          - "provisional_score = null; major_deficiency_total = 0"
          - "any current assignments in OFFERED or ACCEPTED -> CANCELLED and their reviewers' open_assignment_count -= 1"
          - "increments ReportSubmission.version by 1"
        note: "cycle: APPEALED re-enters UNDER_REVIEW via a fresh blind assignment round; prior rounds' reviewers are excluded from selection"

  - entity: ReviewAssignment
    initial_state: OFFERED
    terminal_states: [DECLINED, SUBMITTED, CANCELLED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /gfoa/review-assignments/{id}/accept"
        actor: Reviewer
        preconditions:
          - "caller X-User-ID == assignment.reviewer_id (else ERR_NOT_RESOURCE_OWNER)"
          - "assignment.status == OFFERED (else ERR_ASSIGNMENT_STATE_INVALID)"
          - "reviewer.status == ELIGIBLE (else ERR_REVIEWER_NOT_ELIGIBLE)"
        side_effects:
          - "increments ReviewAssignment.version by 1"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /gfoa/review-assignments/{id}/decline"
        actor: Reviewer
        preconditions:
          - "caller X-User-ID == assignment.reviewer_id (else ERR_NOT_RESOURCE_OWNER)"
          - "assignment.status == OFFERED (else ERR_ASSIGNMENT_STATE_INVALID)"
        side_effects:
          - "reviewer.open_assignment_count -= 1; reviewer.declined_assignment_count += 1"
          - "increments ReviewAssignment.version by 1; increments ReviewerProfile.version by 1"
      - from: ACCEPTED
        to: SUBMITTED
        trigger: "POST /gfoa/review-assignments/{id}/finding"
        actor: Reviewer
        preconditions:
          - "caller X-User-ID == assignment.reviewer_id (else ERR_NOT_RESOURCE_OWNER)"
          - "assignment.status == ACCEPTED (else ERR_ASSIGNMENT_STATE_INVALID)"
          - "reviewer.status == ELIGIBLE (else ERR_REVIEWER_NOT_ELIGIBLE)"
          - "criterion_scores cover exactly the pinned checklist criteria (else ERR_UNKNOWN_CRITERION / ERR_CRITERION_SET_INCOMPLETE)"
        side_effects:
          - "ReviewFinding created; weighted_score computed per finding_weighted_score (pinned rounding order)"
          - "reviewer.open_assignment_count -= 1; reviewer.completed_review_count += 1 (cascade link 1)"
          - "submission.provisional_score and major_deficiency_total recomputed (cascade link 2)"
          - "if current-round findings count == 3: submission -> DECISION_READY and cycle.decision_ready_count += 1 (cascade link 3)"
          - "increments ReviewAssignment.version by 1; increments ReviewerProfile.version by 1; increments ReportSubmission.version by 1"
      - from: OFFERED
        to: CANCELLED
        trigger: "cascade: submission appeal (system)"
        actor: system
        preconditions: []
        side_effects:
          - "reviewer.open_assignment_count -= 1"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "cascade: submission appeal (system)"
        actor: system
        preconditions: []
        side_effects:
          - "reviewer.open_assignment_count -= 1"

  - entity: BestPracticePublication
    initial_state: DRAFTING
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFTING
        to: MEMBER_COMMENT
        trigger: "POST /gfoa/publications/{id}/open-comment-period"
        actor: CommitteeMember
        preconditions:
          - "caller X-User-ID IN publication.member_ids (else ERR_NOT_RESOURCE_OWNER)"
          - "publication.status == DRAFTING (else ERR_PUBLICATION_STATE_INVALID)"
          - "closes_at > logical clock now (else ERR_VALIDATION)"
        side_effects:
          - "comment_window_opens_at = now; comment_window_closes_at = closes_at"
          - "increments BestPracticePublication.version by 1"
      - from: MEMBER_COMMENT
        to: RESOLUTION
        trigger: "POST /gfoa/publications/{id}/close-comment-period"
        actor: CommitteeMember
        preconditions:
          - "caller X-User-ID IN publication.member_ids (else ERR_NOT_RESOURCE_OWNER)"
          - "publication.status == MEMBER_COMMENT (else ERR_PUBLICATION_STATE_INVALID)"
          - "logical clock now >= comment_window_closes_at (else ERR_COMMENT_WINDOW_STILL_OPEN)"
        side_effects:
          - "increments BestPracticePublication.version by 1"
      - from: RESOLUTION
        to: DRAFTING
        trigger: "POST /gfoa/publications/{id}/revise"
        actor: CommitteeMember
        preconditions:
          - "caller X-User-ID IN publication.member_ids (else ERR_NOT_RESOURCE_OWNER)"
          - "publication.status == RESOLUTION (else ERR_PUBLICATION_STATE_INVALID)"
        side_effects:
          - "draft_number += 1; comment window fields reset to null"
          - "increments BestPracticePublication.version by 1"
        note: "revision loop — comments from prior rounds are retained as history"
      - from: RESOLUTION
        to: PUBLISHED
        trigger: "POST /gfoa/publications/{id}/publish"
        actor: CommitteeMember
        preconditions:
          - "caller X-User-ID == publication.chair_member_id (else ERR_NOT_RESOURCE_OWNER)"
          - "publication.chair_member_id != publication.created_by_member_id (else ERR_SELF_APPROVAL_FORBIDDEN)"
          - "publication.status == RESOLUTION (else ERR_PUBLICATION_STATE_INVALID)"
          - "pending_comment_count == 0 (else ERR_UNRESOLVED_COMMENTS)"
          - "pinned_standards_reference_id is null OR that standard is not SUPERSEDED (else ERR_PINNED_STANDARD_SUPERSEDED)"
          - "expected_publication_version == publication.version (else ERR_STALE_PUBLICATION_VERSION 412)"
        side_effects:
          - "published_at = logical clock now"
          - "increments BestPracticePublication.version by 1"

  - entity: MemberComment
    initial_state: PENDING
    terminal_states: [ACCEPTED, REVISED, REJECTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /gfoa/member-comments/{id}/resolve with resolution=ACCEPTED"
        actor: CommitteeMember
        preconditions:
          - "comment.resolution == PENDING (else ERR_COMMENT_ALREADY_RESOLVED)"
          - "caller X-User-ID IN publication.member_ids (else ERR_NOT_RESOURCE_OWNER)"
          - "publication.status == RESOLUTION (else ERR_PUBLICATION_STATE_INVALID)"
        side_effects:
          - "publication.pending_comment_count -= 1; publication.resolved_comment_count += 1"
          - "increments MemberComment.version by 1; increments BestPracticePublication.version by 1"
      - from: PENDING
        to: REVISED
        trigger: "POST /gfoa/member-comments/{id}/resolve with resolution=REVISED"
        actor: CommitteeMember
        preconditions: ["same as ACCEPTED"]
        side_effects: ["same as ACCEPTED"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /gfoa/member-comments/{id}/resolve with resolution=REJECTED"
        actor: CommitteeMember
        preconditions: ["same as ACCEPTED"]
        side_effects: ["same as ACCEPTED"]

  - entity: ScholarshipApplication
    initial_state: PENDING
    terminal_states: [RESCINDED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /gfoa/scholarship-applications/{id}/allocate"
        actor: AwardsDirector
        preconditions:
          - "application.status == PENDING (else ERR_APPLICATION_STATE_INVALID)"
          - "expected_fund_version == fund.version (else ERR_STALE_FUND_VERSION 412)"
          - "fund.remaining_cents > 0 (else ERR_POOL_EXHAUSTED)"
        side_effects:
          - "granted_cents = scholarship_grant_amount (variant per fund.allocation_policy)"
          - "fund.remaining_cents -= granted_cents; fund.status recomputed (EXHAUSTED iff remaining_cents == 0)"
          - "increments ScholarshipApplication.version by 1; increments ScholarshipFund.version by 1"
      - from: GRANTED
        to: RESCINDED
        trigger: "POST /gfoa/scholarship-applications/{id}/rescind"
        actor: AwardsDirector
        preconditions:
          - "application.status == GRANTED (else ERR_APPLICATION_STATE_INVALID)"
        side_effects:
          - "fund.remaining_cents += granted_cents; fund.status recomputed (ALLOCATING when remaining_cents > 0)"
          - "increments ScholarshipApplication.version by 1; increments ScholarshipFund.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only — OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: scholarship-allocate-stale-fund
    parent_entity: ScholarshipFund
    write_endpoint: "POST /gfoa/scholarship-applications/{id}/allocate"
    occ_field: "expected_fund_version"
    description: |
      Allocating a grant against a ScholarshipFund whose version has advanced
      since the caller last observed it is rejected. A prior allocation or
      rescind has changed remaining_cents, so the caller's view of the pool is
      stale; the request must be re-issued against the current version.
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412
  - rule_id: publication-publish-stale-version
    parent_entity: BestPracticePublication
    write_endpoint: "POST /gfoa/publications/{id}/publish"
    occ_field: "expected_publication_version"
    description: |
      Publishing a BestPracticePublication whose version has advanced since the
      chair last observed it is rejected. Every comment resolution and every
      comment-period transition advances the version, so a stale version means
      the chair has not seen the latest resolution snapshot.
    error_id: ERR_STALE_PUBLICATION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: cycle_posture
    trigger: "evaluated on every read of AwardCycle and on every posture-gated write"
    algorithm: threshold
    formula: |
      now = logical clock
      if now < submission_opens_at: posture = SCHEDULED
      elif submission_opens_at <= now < submission_deadline_at: posture = OPEN
      elif submission_deadline_at <= now < review_close_at: posture = IN_REVIEW
      else: posture = PAST_REVIEW
    input_set: "the AwardCycle row itself; no other entities"
    constants: {}
    precision: "datetime comparison, inclusive lower bound / exclusive upper bound (half-open)"

  - name: finding_weighted_score
    trigger: "on POST /gfoa/review-assignments/{id}/finding"
    algorithm: weighted_scoring
    formula: |
      weights = pinned checklist criteria weights (must sum to 1.000)
      # PINNED ROUNDING ORDER: round each criterion contribution FIRST, then sum.
      weighted_score = SUM over criteria of round_half_up(score_i * weight_i, 2)
      # Deliberately NOT: round_half_up(SUM(score_i * weight_i), 2) — the two orders
      # differ, e.g. weights (0.5, 0.5) scores (10.01, 20.01): per-line 5.01+10.01=15.02
      # vs sum-then-round 15.01.
    input_set: "criterion_scores of the submitted finding; weights from the submission's pinned ChecklistVersion"
    constants: {}
    precision: "2 decimal places, round_half_up per criterion contribution, then exact sum"
    variants: []

  - name: provisional_award_score
    trigger: "on every ReviewFinding submission and on appeal (reset)"
    algorithm: aggregation
    formula: |
      findings = current-appeal-round ReviewFinding rows for the submission, in submission order
      if findings is empty: provisional_score = null
      else: provisional_score = round_half_up(MEAN(weighted_score over findings), 2)
    input_set: "current-round findings only (appeal_round == submission.appeal_round)"
    constants:
      REQUIRED_FINDINGS_PER_ROUND: 3
    precision: "2 decimal places, round_half_up"

  - name: final_award_score
    trigger: "on POST /gfoa/report-submissions/{id}/decide"
    algorithm: weighted_scoring
    formula: |
      findings = the 3 current-round findings (precondition: count == 3)
      base = round_half_up(MEAN(weighted_score over findings), 2)
      # variant selection by program_type — see variants
    input_set: "current-round findings; pinned checklist pass_score; program_type"
    constants:
      BUDGET_CLEAN_BONUS: 1.00
      SCORE_CAP: 100.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: financial_reporting_variant
        when: "submission.program_type == FINANCIAL_REPORTING"
        difference: "final_score = base (plain mean, no bonus)"
      - name: budget_presentation_variant
        when: "submission.program_type == BUDGET_PRESENTATION"
        difference: "final_score = min(100.00, base + 1.00) when the round has zero MAJOR and zero MINOR comments across all 3 findings, else base; bonus applied AFTER the mean rounding, then capped"

  - name: member_annual_dues
    trigger: "on POST /gfoa/members"
    algorithm: tiered_pricing
    formula: |
      # Circular-looking dependency resolved by PINNED evaluation order:
      # (1) band base, (2) affiliation fee, (3) pre-discount total,
      # (4) discount tier keyed on the PRE-DISCOUNT total, (5) apply discount.
      band_base = BAND_BASE_CENTS[government_size_band]
      affiliation = AFFILIATION_FEE_CENTS if independent_finance_officer else 0
      pre_total = band_base + affiliation
      if pre_total >= DISCOUNT_TIER_HIGH_MIN: discount_pct = 0.10
      elif pre_total >= DISCOUNT_TIER_LOW_MIN: discount_pct = 0.05
      else: discount_pct = 0
      annual_dues_cents = round_half_up(pre_total * (1 - discount_pct), 0)
    input_set: "the Member row being created"
    constants:
      BAND_BASE_CENTS: { SMALL: 15000, MEDIUM: 30000, LARGE: 60000 }
      AFFILIATION_FEE_CENTS: 5000
      DISCOUNT_TIER_LOW_MIN: 30000
      DISCOUNT_TIER_HIGH_MIN: 60000
    precision: "integer cents, round_half_up"
    variants: []

  - name: blind_reviewer_selection
    trigger: "on POST /gfoa/review-assignments"
    algorithm: constraint_propagation
    formula: |
      candidates = ReviewerProfile where ALL of:
        status == ELIGIBLE
        employer_government_id != submission.government_id
        submission.government_id NOT IN conflicted_government_ids
        open_assignment_count < MAX_OPEN_ASSIGNMENTS_PER_REVIEWER
        reviewer has NO ReviewAssignment for this submission in ANY appeal_round
          (any status — OFFERED, ACCEPTED, DECLINED, SUBMITTED, CANCELLED all exclude)
      ranking: open_assignment_count ASC,
               then completed_review_count DESC,
               then trained_at ASC,
               then created_at ASC (final tie-break; never id)
      selected = first row of ranking
      if candidates empty: reject with ERR_NO_ELIGIBLE_REVIEWER
    input_set: "all ReviewerProfile rows; all ReviewAssignment rows for the submission"
    constants:
      MAX_OPEN_ASSIGNMENTS_PER_REVIEWER: 5
    precision: "deterministic total order; no randomness"
    variants: []

  - name: scholarship_grant_amount
    trigger: "on POST /gfoa/scholarship-applications/{id}/allocate"
    algorithm: waterfall_allocation
    formula: |
      # FLAT_CAP variant:
      amount = min(requested_cents, per_applicant_cap_cents, remaining_cents)
      # PRO_RATA variant (see variants):
      total_pending = SUM(requested_cents) over this fund's applications with status == PENDING (INCLUDING this one)
      amount = min(per_applicant_cap_cents,
                   round_half_up(remaining_cents * requested_cents / total_pending, 0),
                   remaining_cents)
    input_set: "the application; its fund; for PRO_RATA all PENDING applications of the fund"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: flat_cap_variant
        when: "fund.allocation_policy == FLAT_CAP"
        difference: "amount = min(requested_cents, cap, remaining) — first-come waterfall"
      - name: pro_rata_variant
        when: "fund.allocation_policy == PRO_RATA"
        difference: "amount scaled by remaining/total_pending ratio — same fund data yields a strictly smaller grant when the pool is oversubscribed"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: existence
    check: "request body parses; every required input field present; enum fields hold declared values; numeric ranges respected (page_count>0, requested_cents>0, pool/cap>0, closes_at>now, opens<deadline<review_close)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 3
    category: auth
    check: "X-User-Role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "path ids exist (left-to-right), then body FK ids exist in input order (government_id, cycle_id, checklist_version_id, member_id, employer_government_id, fund_id, publication_id, chair_member_id/member_ids)"
    error_id: ERR_GOVERNMENT_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_REVIEWER_NOT_FOUND | ERR_CYCLE_NOT_FOUND | ERR_CHECKLIST_NOT_FOUND | ERR_STANDARD_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_PUBLICATION_NOT_FOUND | ERR_COMMENT_NOT_FOUND | ERR_FUND_NOT_FOUND | ERR_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: auth
    check: "ownership: GovernmentContact may only act on government_id == X-User-ID resources; Reviewer only on reviewer_id == X-User-ID assignments or own profile; Member only as self; CommitteeMember must be IN publication.member_ids; publish requires X-User-ID == chair_member_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all mutating endpoints with an owned resource"
  - priority: 6
    category: state
    check: "state preconditions per §1.2 (submission/reviewer/assignment/publication/comment/application status gates), including OCC expected_*_version equality (412) and reviewer ELIGIBLE-at-accept/finding"
    error_id: ERR_SUBMISSION_STATE_INVALID | ERR_REVIEWER_STATE_INVALID | ERR_REVIEWER_NOT_TRAINED | ERR_REVIEWER_NOT_ELIGIBLE | ERR_ASSIGNMENT_STATE_INVALID | ERR_PUBLICATION_STATE_INVALID | ERR_COMMENT_ALREADY_RESOLVED | ERR_APPLICATION_STATE_INVALID | ERR_FINDINGS_INCOMPLETE | ERR_STALE_FUND_VERSION | ERR_STALE_PUBLICATION_VERSION
    http_status: 409
    applies_to: "state-gated endpoints"
  - priority: 7
    category: business_safety
    check: "segregation of duties & independence: publication chair may not publish a publication they created; blind reviewer selector empty-pool fallback"
    error_id: ERR_SELF_APPROVAL_FORBIDDEN | ERR_NO_ELIGIBLE_REVIEWER
    http_status: 409
    applies_to: "POST /gfoa/publications/{id}/publish; POST /gfoa/review-assignments"
  - priority: 8
    category: business_referential
    check: "referential integrity of pinned/active references: pinned checklist not SUPERSEDED at submit; pinned standard not SUPERSEDED at publish; cycle's checklist ACTIVE and same program; at most one ACTIVE checklist per program; no duplicate doc_type inside budget_documents; no duplicate non-DRAFT submission per (government, cycle); reviewer unavailability windows must not intersect (CLOSED intervals); cycle submission windows of the same program must not overlap (HALF-OPEN intervals)"
    error_id: ERR_CHECKLIST_PIN_STALE | ERR_PINNED_STANDARD_SUPERSEDED | ERR_CYCLE_CHECKLIST_MISMATCH | ERR_CHECKLIST_ALREADY_ACTIVE | ERR_DOCUMENT_TYPE_DUPLICATE | ERR_DUPLICATE_SUBMISSION | ERR_AVAILABILITY_WINDOW_OVERLAP | ERR_CYCLE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "referential-gated endpoints"
  - priority: 9
    category: business_temporal
    check: "temporal gates vs logical clock: submit only while cycle posture OPEN; appeal within 30 days of decided_at; standard activation only at/after effective_date; comments only while window open; comment period close only at/after closes_at"
    error_id: ERR_SUBMISSION_WINDOW_CLOSED | ERR_APPEAL_WINDOW_CLOSED | ERR_STANDARD_NOT_YET_EFFECTIVE | ERR_COMMENT_WINDOW_CLOSED | ERR_COMMENT_WINDOW_STILL_OPEN
    http_status: 409
    applies_to: "time-gated endpoints"
  - priority: 10
    category: business_constraint
    check: "structural constraints: BUDGET submissions need all three doc types at submit and FR submissions must carry none; finding criteria must exactly cover the pinned checklist; checklist weights must sum to 1.000; scholarship applicant government must be SMALL; purpose must match fund program_label; chair must be in member_ids; review quorum of 3 active assignments per round; publish needs pending_comment_count == 0"
    error_id: ERR_BUDGET_DOCUMENTS_INCOMPLETE | ERR_PROGRAM_NOT_BUDGET | ERR_UNKNOWN_CRITERION | ERR_CRITERION_SET_INCOMPLETE | ERR_WEIGHT_SUM_INVALID | ERR_GOVERNMENT_NOT_SMALL | ERR_PURPOSE_PROGRAM_MISMATCH | ERR_CHAIR_NOT_ON_COMMITTEE | ERR_REVIEW_QUORUM_FULL | ERR_UNRESOLVED_COMMENTS
    http_status: 422
    applies_to: "constraint-gated endpoints"
  - priority: 11
    category: business_fiscal
    check: "fiscal: scholarship fund remaining_cents must be > 0 at allocate"
    error_id: ERR_POOL_EXHAUSTED
    http_status: 409
    applies_to: "POST /gfoa/scholarship-applications/{id}/allocate"

# =============================================================================
# §1.5 API Endpoint Table (43 endpoints; flat collections under /gfoa)
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint (outside api_prefix): sets the logical clock. Startup default is exactly 2026-09-01T00:00:00Z; before any set call the clock reads this default and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced; posture-derived fields reflect the new time on next read"]

  - method: POST
    path: "/gfoa/governments"
    description: "Register a government"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, gov_type, population_band, state_code]
    output: Government
    side_effects: ["lifetime_award_count initialized to 0"]

  - method: POST
    path: "/gfoa/members"
    description: "Register a finance-officer member; annual_dues_cents computed"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, government_size_band, "independent_finance_officer?"]
    output: Member
    side_effects: ["member_annual_dues computed and stored"]

  - method: POST
    path: "/gfoa/reviewer-profiles"
    description: "Member applies to become a reviewer (recruitment); member_id must equal caller X-User-ID"
    roles: [Member]
    code: 201
    input: [member_id, employer_government_id, "conflicted_government_ids?", "unavailability_windows?"]
    output: ReviewerProfile
    side_effects: ["status APPLICANT; counters initialized to 0"]

  - method: PUT
    path: "/gfoa/reviewer-profiles/{id}"
    description: "Update reviewer attestations/windows (Reviewer, own profile; may not set status) or administer status (PlatformAdmin: TRAINED/SUSPENDED/ELIGIBLE/RETIRED transitions). independence_attested=true moves TRAINED->ELIGIBLE."
    roles: [Reviewer, PlatformAdmin]
    code: 200
    input: ["conflicted_government_ids?", "unavailability_windows?", "independence_attested?", "status?"]
    output: ReviewerProfile
    side_effects: ["state transitions per ReviewerProfile machine; trained_at set when entering TRAINED", "increments ReviewerProfile.version by 1"]

  - method: POST
    path: "/gfoa/checklist-versions"
    description: "Create an ACTIVE checklist for a program; at most one ACTIVE per program_type"
    roles: [PlatformAdmin]
    code: 201
    input: [program_type, version_label, pass_score, criteria]
    output: ChecklistVersion
    side_effects: ["status ACTIVE"]

  - method: POST
    path: "/gfoa/award-cycles"
    description: "Create an award cycle for a program; submission window must not overlap another cycle of the same program (half-open semantics)"
    roles: [PlatformAdmin]
    code: 201
    input: [program_type, fiscal_year, submission_opens_at, submission_deadline_at, review_close_at, checklist_version_id]
    output: AwardCycle
    side_effects: ["counters initialized to 0"]

  - method: POST
    path: "/gfoa/standards-references"
    description: "Register an emerging reporting standard (ISSUED)"
    roles: [PlatformAdmin]
    code: 201
    input: [topic_code, title, program_type, effective_date]
    output: StandardsReference
    side_effects: ["status ISSUED"]

  - method: POST
    path: "/gfoa/standards-references/{id}/activate"
    description: "Activate a standard at/after its effective_date; cascades to checklists and draft submissions"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: StandardsReference
    side_effects:
      - "same-topic EFFECTIVE standards -> SUPERSEDED"
      - "the ACTIVE ChecklistVersion of this program_type -> SUPERSEDED (cascade link 1)"
      - "DRAFT ReportSubmissions pinned to that checklist get pinned_checklist_stale=true (cascade link 2)"
      - "increments StandardsReference.version by 1"

  - method: POST
    path: "/gfoa/report-submissions"
    description: "Create a DRAFT award application; pins the cycle's checklist version; budget_documents inline for BUDGET_PRESENTATION cycles"
    roles: [GovernmentContact]
    code: 201
    input: [government_id, cycle_id, "budget_documents?"]
    output: ReportSubmission
    side_effects: ["pinned_checklist_version_id = cycle.checklist_version_id; program_type copied; appeal_round=1; award_conferred=false"]

  - method: POST
    path: "/gfoa/report-submissions/{id}/submit"
    description: "Submit a DRAFT application (window + pin + budget-document gates)"
    roles: [GovernmentContact]
    code: 200
    input: []
    output: ReportSubmission
    side_effects: ["DRAFT->SUBMITTED", "submitted_at=now", "cycle.submitted_count += 1", "increments ReportSubmission.version by 1", "increments AwardCycle.version by 1"]

  - method: POST
    path: "/gfoa/report-submissions/{id}/decide"
    description: "Deterministic award decision from DECISION_READY: AWARDED iff final_score >= pass_score AND zero MAJOR deficiencies"
    roles: [AwardsDirector]
    code: 200
    input: []
    output: ReportSubmission
    side_effects: ["final_award_score computed per program variant", "AWARDED: award_conferred=true, conferred_at=now, cycle.conferred_count += 1, government.lifetime_award_count += 1", "DENIED: required_improvements compiled from MAJOR comments", "decided_at=now", "increments ReportSubmission.version by 1"]

  - method: POST
    path: "/gfoa/report-submissions/{id}/appeal"
    description: "Appeal a DENIED decision within 30 days; starts a fresh blind review round"
    roles: [GovernmentContact]
    code: 200
    input: []
    output: ReportSubmission
    side_effects: ["DECIDED_DENIED->APPEALED", "appeal_round += 1", "provisional_score=null, major_deficiency_total=0", "OFFERED/ACCEPTED assignments -> CANCELLED with reviewer open counts decremented", "increments ReportSubmission.version by 1"]

  - method: POST
    path: "/gfoa/review-assignments"
    description: "Blind-assign the next eligible reviewer to a SUBMITTED, APPEALED or UNDER_REVIEW submission (selector policy; max 3 active assignments per appeal round)"
    roles: [AwardsDirector]
    code: 201
    input: [submission_id]
    output: ReviewAssignment
    side_effects: ["assignment OFFERED with reviewer_alias R{round}-{seq}", "reviewer.open_assignment_count += 1", "submission SUBMITTED|APPEALED -> UNDER_REVIEW on first assignment of the round", "increments ReviewerProfile.version by 1", "increments ReportSubmission.version by 1"]

  - method: POST
    path: "/gfoa/review-assignments/{id}/accept"
    description: "Reviewer accepts an offered assignment"
    roles: [Reviewer]
    code: 200
    input: []
    output: ReviewAssignment
    side_effects: ["OFFERED->ACCEPTED", "increments ReviewAssignment.version by 1"]

  - method: POST
    path: "/gfoa/review-assignments/{id}/decline"
    description: "Reviewer declines an offered assignment; reviewer is excluded from re-selection for this submission"
    roles: [Reviewer]
    code: 200
    input: []
    output: ReviewAssignment
    side_effects: ["OFFERED->DECLINED", "reviewer.open_assignment_count -= 1", "reviewer.declined_assignment_count += 1", "increments ReviewAssignment.version by 1", "increments ReviewerProfile.version by 1"]

  - method: POST
    path: "/gfoa/review-assignments/{id}/finding"
    description: "Reviewer submits the checklist-scored finding with deficiency comments (assignment -> SUBMITTED)"
    roles: [Reviewer]
    code: 201
    input: [criterion_scores, "comments?"]
    output: ReviewFinding
    side_effects:
      - "finding created; weighted_score per finding_weighted_score"
      - "assignment ACCEPTED->SUBMITTED (cascade link 1)"
      - "reviewer.open_assignment_count -= 1; reviewer.completed_review_count += 1"
      - "submission.provisional_score and major_deficiency_total recomputed (cascade link 2)"
      - "on 3rd current-round finding: submission -> DECISION_READY and cycle.decision_ready_count += 1 (cascade link 3)"
      - "increments ReviewAssignment.version by 1; increments ReviewerProfile.version by 1; increments ReportSubmission.version by 1"

  - method: POST
    path: "/gfoa/publications"
    description: "Committee creates a best-practice publication draft (creator must be on member_ids; chair must be on member_ids)"
    roles: [CommitteeMember]
    code: 201
    input: [committee_name, chair_member_id, member_ids, title, topic_code, "pinned_standards_reference_id?"]
    output: BestPracticePublication
    side_effects: ["status DRAFTING; draft_number=1; created_by_member_id = caller X-User-ID"]

  - method: POST
    path: "/gfoa/publications/{id}/open-comment-period"
    description: "Open the member comment window (DRAFTING -> MEMBER_COMMENT)"
    roles: [CommitteeMember]
    code: 200
    input: [closes_at]
    output: BestPracticePublication
    side_effects: ["comment_window_opens_at=now; comment_window_closes_at=closes_at", "increments BestPracticePublication.version by 1"]

  - method: POST
    path: "/gfoa/publications/{id}/close-comment-period"
    description: "Close the comment window at/after closes_at (MEMBER_COMMENT -> RESOLUTION)"
    roles: [CommitteeMember]
    code: 200
    input: []
    output: BestPracticePublication
    side_effects: ["increments BestPracticePublication.version by 1"]

  - method: POST
    path: "/gfoa/publications/{id}/revise"
    description: "Send publication back to DRAFTING for another round (draft_number += 1)"
    roles: [CommitteeMember]
    code: 200
    input: []
    output: BestPracticePublication
    side_effects: ["draft_number += 1; comment window fields reset to null", "increments BestPracticePublication.version by 1"]

  - method: POST
    path: "/gfoa/publications/{id}/publish"
    description: "Chair publishes from RESOLUTION; OCC on publication version; chair may not publish own draft; all comments resolved; pinned standard current"
    roles: [CommitteeMember]
    code: 200
    input: [expected_publication_version]
    output: BestPracticePublication
    side_effects: ["RESOLUTION->PUBLISHED", "published_at=now", "increments BestPracticePublication.version by 1"]

  - method: POST
    path: "/gfoa/member-comments"
    description: "Member files a comment on a publication whose comment window is open"
    roles: [Member]
    code: 201
    input: [publication_id, body]
    output: MemberComment
    side_effects: ["member_id = caller X-User-ID; resolution PENDING", "publication.pending_comment_count += 1", "increments BestPracticePublication.version by 1"]

  - method: POST
    path: "/gfoa/member-comments/{id}/resolve"
    description: "Committee member resolves a PENDING comment (ACCEPTED | REVISED | REJECTED) during RESOLUTION"
    roles: [CommitteeMember]
    code: 200
    input: [resolution, "resolution_note?"]
    output: MemberComment
    side_effects: ["publication.pending_comment_count -= 1; publication.resolved_comment_count += 1", "increments MemberComment.version by 1", "increments BestPracticePublication.version by 1"]

  - method: POST
    path: "/gfoa/scholarship-funds"
    description: "Create a small-government scholarship or technical-assistance fund"
    roles: [PlatformAdmin]
    code: 201
    input: [fiscal_year, program_label, pool_total_cents, per_applicant_cap_cents, "allocation_policy?"]
    output: ScholarshipFund
    side_effects: ["remaining_cents = pool_total_cents; status ALLOCATING"]

  - method: POST
    path: "/gfoa/scholarship-applications"
    description: "SMALL government applies to a fund (purpose must match program_label)"
    roles: [GovernmentContact]
    code: 201
    input: [fund_id, government_id, purpose, requested_cents]
    output: ScholarshipApplication
    side_effects: ["status PENDING; granted_cents=0"]

  - method: POST
    path: "/gfoa/scholarship-applications/{id}/allocate"
    description: "Grant funds to a PENDING application; OCC on fund version; partial grants allowed"
    roles: [AwardsDirector]
    code: 200
    input: [expected_fund_version]
    output: ScholarshipApplication
    side_effects: ["granted_cents per scholarship_grant_amount variant", "PENDING->GRANTED", "fund.remaining_cents -= granted_cents; fund.status recomputed", "increments ScholarshipApplication.version by 1", "increments ScholarshipFund.version by 1"]

  - method: POST
    path: "/gfoa/scholarship-applications/{id}/rescind"
    description: "Rescind a GRANTED application; pool recredited (compensating action)"
    roles: [AwardsDirector]
    code: 200
    input: []
    output: ScholarshipApplication
    side_effects: ["GRANTED->RESCINDED", "fund.remaining_cents += granted_cents; fund.status recomputed", "increments ScholarshipApplication.version by 1", "increments ScholarshipFund.version by 1"]

