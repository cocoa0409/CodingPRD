          trigger:
            - { call: "POST /deviations/${pkg_dev_id}/adjudicate", payload: { disposition: "REPROCESS", root_cause_code: "PKG_SEAL_INTEGRITY" }, as: QualityManager, as_user_id: "qm_alice", captures: { e_devdisp: $.data.error_id } }
          assert:
            - "HTTP 422 with data.error_id == ERR_DEVIATION_DISPOSITION_NOT_PERMITTED"
            - "Deviation.${pkg_dev_id}.deviation_type == PACKAGE_FAILURE_RATE, severity == MAJOR, cycle_load_id == ${load1_id}, status is still OPEN"
            - "CycleLoad.${load1_id}.disposition_state == ALLOCATED with allocated_fee_cents == 12825 (no reprocess cascade ran)"
            - "Customer.${cust_id}.chargeback_balance_cents == 6788"

      - name: corner_error_vessel_not_available_on_start
        claim_type: Triggerable
        grounds:
          - errors[ERR_VESSEL_NOT_AVAILABLE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cycle_start_blocked_by_vessel_maintenance_status
          rationale: "The MAINTENANCE refusal and the AVAILABLE success are both asserted there."

      - name: corner_error_deviation_unresolved_on_release
        claim_type: Triggerable
        grounds:
          - errors[ERR_DEVIATION_UNRESOLVED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / lot_release_blocked_by_open_deviation_on_its_cycle
          rationale: "That instance asserts the 409 while the deviation is OPEN and the success once it is adjudicated."

      - name: corner_error_qualification_expired_on_load
        claim_type: Triggerable
