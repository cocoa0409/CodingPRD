              captures: { ag1_status: $.data.status, ag1_stip: $.data.monthly_stipend_cents }
          assert:
            - "committed_monthly_stipend_cents == 400000 with both agreements ACTIVE (${committed_before})"
            - "after G1's athlete is SUSPENDED: == 100000 (exactly G2's stipend; 300000 debited)"
            - "after reinstatement to ELIGIBLE: == 400000 exactly — the suspend+resume pair conserves committed cents with no drift"
            - "G1 agreement back to ACTIVE with monthly_stipend_cents == 300000 (unchanged by the loop)"
