            - "open-gates with clock at 2026-05-01 (wrong date): ERR_DAY_NOT_TODAY"
            - "open-gates on 2026-06-06 succeeds (OPERATING)"
            - "sign-up on an OPERATING day: ERR_DAY_NOT_STAFFABLE"
            - "complete with a CONFIRMED (non-terminal) shift: ERR_OPEN_SHIFTS_EXIST"
            - "after close-out WORKED: complete succeeds (COMPLETED)"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: response_envelope_shapes
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Success bodies carry meta.api_request_id, meta.api_request_timestamp, response_type 'object', and data; error bodies carry response_type 'error' and data.error_id/data.message."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /seasons", payload: { name: "Envelope Revel", opening_date: "2026-06-06T00:00:00Z", closing_date: "2026-06-20T00:00:00Z", daily_capacity: 500, group_min_size: 10, volunteer_min_hours: 0, weather_call_deadline_hour: 6, rain_check_grace_days: 14 }, as: FaireOperator, captures: { s_id: $.data.id } }
            - { call: "GET /seasons/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { err: $.data.error_id } }
          assert:
            - "Success response: meta.api_request_id non-empty, meta.api_request_timestamp ISO8601, response_type == 'object', data.id == ${s_id}"
            - "Error response: response_type == 'error', data.error_id == ERR_SEASON_NOT_FOUND, data.message non-empty"

