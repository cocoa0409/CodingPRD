            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-G-RPT", class_code: "G", class_ceiling_ft: 400, requires_authorization: false, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
