        claim_type: role_denial
        grounds: ["roles: ConstructionManager", "roles: TaxCounsel", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Role-level denial (not SoD): the certify route rejects ConstructionManager outright with ERR_FORBIDDEN regardless of user ids."
        test_recipe:
          setup: ["Project P; milestone with evidence submitted by cm_1"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "RBAC Farm", technology: "WIND", target_capacity_mw: 30, resource_class: "B" }
              as: DeveloperAdmin
              captures: { p: $.data.id }
