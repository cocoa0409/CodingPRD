# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2979 — Rail Demurrage & Detention Billing Dispute
# 9 rule_ids from §0.5 × 2-3 instances each = 24 instances.
# Every numeric literal in an `assert:` was computed by executing the matching
# §1.3 formula; no expression is left unresolved.
# The logical clock starts at 2026-08-01T00:00:00Z on a cold DB, and every chain
# below sets it explicitly anyway.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: chargeable_days_provisional_vs_final_on_industry_track_charge
        grounds:
          - calculations.demurrage_chargeable_days
          - calculations.tiered_charge_amount
          - entities.DemurrageCharge.fields.chargeable_days
          - entities.DemurrageCharge.fields.status
          - state_machines.DemurrageCharge.PROVISIONAL_to_FINAL
        distinguishing_aspect: |
          The provisional variant substitutes the logical clock for released_at
          and hard-codes RELEASE_DAY_CHARGED to FALSE, so the same cycle at the
          same instant reports 3 chargeable days / 47550 cents while
          PROVISIONAL and 4 chargeable days / 70000 cents the moment it is
          RELEASED at exactly the gate-close hour — a one-day, 22450-cent delta
          on the DemurrageCharge entity domain (industry-track car detention).
        test_recipe:
          setup:
            - "logical clock at 2026-08-11T16:00:00Z"
            - "one PUBLISHED TariffRuleSet on the default 48/24-hour, 2/3-day, 12550/22450/35050 railroad ladder"
            - "one INDUSTRY_TRACK Facility with gate_close_hour 16 and car_spot_capacity 3"
            - "one RAILROAD_OWNED RailCar and one ACTUALLY_PLACED PlacementCycle with clock_basis ACTUAL, clock_start_at 2026-08-05T10:00:00.000Z and free_time_expires_at 2026-08-07T23:59:59.999Z"
            - "the cycle's DemurrageCharge is PROVISIONAL and was last recomputed with the clock already at 2026-08-11T16:00:00Z"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "R1I1-CUST", name: "Provisional Grain Co", serving_station_code: "STN01", notification_method: "EDI", normal_daily_placement_capacity: 2 }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "R1I1-TRK", kind: "INDUSTRY_TRACK", gate_open_hour: 7, gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "R1I1-6004", car_ownership_scope: "ANY", weekend_excluded: false, notification_grace_hours: 4 }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "R1I1-BNSF01", ownership: "RAILROAD_OWNED", car_type: "COVERED_HOPPER", capacity_tons: 100 }
              as: RailroadAgent
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-R1I1-001", expected_rail_car_version: "${car_v}" }
              as: RailroadAgent
              captures: { cyc_id: $.data.id }
            - call: "POST /demurrage/placement-cycles/${cyc_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T08:00:00Z", reason_code: "TRACK_FULL" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/notify"
              payload: { channel: "EDI", sent_at: "2026-08-03T09:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T16:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/placement-cycles/${cyc_id}/actual-placement"
              payload: { actual_placement_at: "2026-08-05T10:00:00Z" }
              as: RailroadAgent
            - call: "GET /demurrage/charges?placement_cycle_id=${cyc_id}"
              payload: {}
              as: BillingAdmin
              captures: { chg_id: "$.data[0].id" }
          trigger:
            - call: "POST /demurrage/placement-cycles/${cyc_id}/release"
              payload: { released_at: "2026-08-11T16:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "before the trigger, DemurrageCharge.${chg_id}.status == PROVISIONAL"
            - "before the trigger, DemurrageCharge.${chg_id}.chargeable_days == 3"
            - "before the trigger, DemurrageCharge.${chg_id}.gross_amount_cents == 47550"
            - "after the trigger, DemurrageCharge.${chg_id}.status == FINAL"
            - "after the trigger, DemurrageCharge.${chg_id}.chargeable_days == 4"
            - "after the trigger, DemurrageCharge.${chg_id}.gross_amount_cents == 70000"
            - "after the trigger, DemurrageCharge.${chg_id}.computation_basis == ACTUAL"
            - "the final-minus-provisional delta is exactly 1 day and 22450 cents, i.e. one tier-2 day at 22450"
            - "PlacementCycle.${cyc_id}.free_time_expires_at == 2026-08-07T23:59:59.999Z both before and after"

      - name: storage_clock_calendar_vs_hourly_on_same_dwell_interval
        grounds:
          - calculations.storage_dwell_charge
          - entities.Facility.fields.storage_clock_mode
          - entities.Facility.fields.operates_weekends
          - entities.DemurrageCharge.fields.computation_basis
          - state_machines.PlacementCycle.CONSTRUCTIVELY_PLACED_to_RELEASED
        distinguishing_aspect: |
          The dual variant lives on the Facility entity domain, not on the
          PlacementCycle accrual domain: one identical dwell interval of
          2026-08-03T08:00:00Z to 2026-08-11T09:00:00Z bills 5 storage days /
          45000 cents at a CALENDAR_DAY_MIDNIGHT rail yard that does not operate
          weekends, and 7 storage days / 63000 cents at a HOURLY_FROM_ARRIVAL
          intermodal terminal that never stops its clock.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one PUBLISHED TariffRuleSet (its tiered ladder is irrelevant: storage bills flat)"
            - "one RAIL_YARD Facility with storage_clock_mode CALENDAR_DAY_MIDNIGHT, storage_free_hours 48, storage_daily_rate_cents 9000, operates_weekends false"
            - "one INTERMODAL_TERMINAL Facility with storage_clock_mode HOURLY_FROM_ARRIVAL, storage_free_hours 48, storage_daily_rate_cents 9000, operates_weekends true"
            - "two RAILROAD_OWNED RailCars, one CONSTRUCTIVELY_PLACED PlacementCycle at each facility, both with constructive_placement_at 2026-08-03T08:00:00Z"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "R1I2-CUST", name: "Storage Clock Logistics", serving_station_code: "STN02", notification_method: "EDI" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "R1I2-YARD", kind: "RAIL_YARD", storage_clock_mode: "CALENDAR_DAY_MIDNIGHT", storage_free_hours: 48, storage_daily_rate_cents: 9000, operates_weekends: false }
              as: BillingAdmin
              captures: { yard_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "R1I2-IMDL", kind: "INTERMODAL_TERMINAL", storage_clock_mode: "HOURLY_FROM_ARRIVAL", storage_free_hours: 48, storage_daily_rate_cents: 9000, operates_weekends: true }
              as: BillingAdmin
              captures: { imdl_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "R1I2-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "R1I2-UP01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_a_id: $.data.id, car_a_v: $.data.version }
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "R1I2-UP02", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_b_id: $.data.id, car_b_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_a_id}", facility_id: "${yard_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-R1I2-YARD", expected_rail_car_version: "${car_a_v}" }
              as: RailroadAgent
              captures: { cyc_yard_id: $.data.id }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_b_id}", facility_id: "${imdl_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-R1I2-IMDL", expected_rail_car_version: "${car_b_v}" }
              as: RailroadAgent
              captures: { cyc_imdl_id: $.data.id }
            - call: "POST /demurrage/placement-cycles/${cyc_yard_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T08:00:00Z", reason_code: "YARD_ARRIVAL" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_imdl_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T08:00:00Z", reason_code: "YARD_ARRIVAL" }
              as: RailroadAgent
          trigger:
            - call: "POST /demurrage/placement-cycles/${cyc_yard_id}/release"
              payload: { released_at: "2026-08-11T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /demurrage/placement-cycles/${cyc_imdl_id}/release"
              payload: { released_at: "2026-08-11T09:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /demurrage/charges?placement_cycle_id=${cyc_yard_id}"
              payload: {}
              as: BillingAdmin
              captures: { chg_yard_id: "$.data[0].id" }
            - call: "GET /demurrage/charges?placement_cycle_id=${cyc_imdl_id}"
              payload: {}
              as: BillingAdmin
              captures: { chg_imdl_id: "$.data[0].id" }
          assert:
            - "DemurrageCharge.${chg_yard_id}.charge_kind == STORAGE"
            - "DemurrageCharge.${chg_yard_id}.computation_basis == STORAGE_CALENDAR"
            - "DemurrageCharge.${chg_yard_id}.chargeable_days == 5"
            - "DemurrageCharge.${chg_yard_id}.gross_amount_cents == 45000"
            - "DemurrageCharge.${chg_imdl_id}.charge_kind == STORAGE"
            - "DemurrageCharge.${chg_imdl_id}.computation_basis == STORAGE_HOURLY"
            - "DemurrageCharge.${chg_imdl_id}.chargeable_days == 7"
            - "DemurrageCharge.${chg_imdl_id}.gross_amount_cents == 63000"
            - "the two charges differ by exactly 2 days and 18000 cents on identical arrival and release instants"
            - "neither charge uses the TariffRuleSet ladder: 45000 == 5 * 9000 and 63000 == 7 * 9000"

      - name: bunching_baseline_ordered_capacity_vs_rolling_average
        grounds:
          - calculations.bunching_attribution
          - entities.BunchingClaim.fields.baseline_per_day
          - entities.BunchingClaim.fields.exempted_cycle_ids
          - entities.Customer.fields.normal_daily_placement_capacity
          - state_machines.BunchingClaim.ANALYZED_to_DENIED
        distinguishing_aspect: |
          The dual variant sits on the Customer/BunchingClaim domain, and the two
          approaches disagree about whether ANY car was bunched at all: three
          cars arriving on 2026-08-03 against normal_daily_placement_capacity 3
          give ORDERED_VS_CAPACITY a baseline of 3 and an excess of 0 (claim
          DENIED, zero charges touched), while ROLLING_AVERAGE_BASELINE over a
          customer with no prior arrivals gives a baseline of FLOOR(0/7) == 0 and
          exempts all three cars for 1 + 2 + 3 == 6 days.
        test_recipe:
          setup:
            - "logical clock at 2026-08-20T12:00:00Z after three cars were constructively placed on 2026-08-03 at 08:00, 09:00 and 10:00Z and notified one hour later each"
            - "Customer.normal_daily_placement_capacity == 3 and the customer has no PlacementCycle before 2026-08-03"
            - "all three cycles are CONSTRUCTIVELY_PLACED with clock_basis CONSTRUCTIVE and free_time_expires_at 2026-08-05T23:59:59.999Z"
            - "each cycle's PROVISIONAL charge shows chargeable_days 14 and gross_amount_cents 407900, so cluster_chargeable_days == 42"
            - "two BunchingClaims exist over 2026-08-03..2026-08-03, one per method; the ORDERED_VS_CAPACITY one is analysed first so it cannot block the other"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "R1I3-CUST", name: "Cluster Cement Inc", serving_station_code: "STN03", notification_method: "EDI", normal_daily_placement_capacity: 3 }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "R1I3-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "R1I3-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "R1I3-CN01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car1_id: $.data.id, car1_v: $.data.version }
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "R1I3-CN02", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car2_id: $.data.id, car2_v: $.data.version }
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "R1I3-CN03", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car3_id: $.data.id, car3_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car1_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-R1I3-01", expected_rail_car_version: "${car1_v}" }
              as: RailroadAgent
              captures: { cyc1_id: $.data.id }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car2_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-R1I3-02", expected_rail_car_version: "${car2_v}" }
              as: RailroadAgent
              captures: { cyc2_id: $.data.id }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car3_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-R1I3-03", expected_rail_car_version: "${car3_v}" }
              as: RailroadAgent
              captures: { cyc3_id: $.data.id }
            - call: "POST /demurrage/placement-cycles/${cyc1_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T08:00:00Z", reason_code: "TRACK_FULL" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc2_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T09:00:00Z", reason_code: "TRACK_FULL" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc3_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T10:00:00Z", reason_code: "TRACK_FULL" }
              as: RailroadAgent
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T12:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/placement-cycles/${cyc1_id}/notify"
              payload: { channel: "EDI", sent_at: "2026-08-03T09:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc2_id}/notify"
              payload: { channel: "EDI", sent_at: "2026-08-03T10:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc3_id}/notify"
              payload: { channel: "EDI", sent_at: "2026-08-03T11:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/bunching-claims"
              payload: { customer_id: "${cust_id}", cluster_window_start: "2026-08-03T00:00:00Z", cluster_window_end: "2026-08-03T23:59:59.999Z", method: "ORDERED_VS_CAPACITY" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_cap_id: $.data.id }
          trigger:
            - call: "POST /demurrage/bunching-claims/${claim_cap_id}/analyze"
              payload: {}
              as: DemurrageAdjudicator
              as_user_id: "adj-r1i3-a"
            - call: "POST /demurrage/bunching-claims"
              payload: { customer_id: "${cust_id}", cluster_window_start: "2026-08-03T00:00:00Z", cluster_window_end: "2026-08-03T23:59:59.999Z", method: "ROLLING_AVERAGE_BASELINE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_roll_id: $.data.id }
            - call: "POST /demurrage/bunching-claims/${claim_roll_id}/analyze"
              payload: {}
              as: DemurrageAdjudicator
              as_user_id: "adj-r1i3-a"
          assert:
            - "BunchingClaim.${claim_cap_id}.baseline_per_day == 3"
            - "BunchingClaim.${claim_cap_id}.delivered_car_count == 3"
            - "BunchingClaim.${claim_cap_id}.cluster_chargeable_days == 42"
            - "BunchingClaim.${claim_cap_id}.exempted_cycle_ids == []"
            - "BunchingClaim.${claim_cap_id}.exempt_days_granted == 0"
            - "BunchingClaim.${claim_cap_id}.status == DENIED"
            - "the second create succeeds with 201 because a DENIED claim does not reserve the window (no ERR_CLUSTER_WINDOW_OVERLAP)"
            - "BunchingClaim.${claim_roll_id}.baseline_per_day == 0"
            - "BunchingClaim.${claim_roll_id}.exempted_cycle_ids == [${cyc1_id}, ${cyc2_id}, ${cyc3_id}]"
            - "BunchingClaim.${claim_roll_id}.exempt_days_granted == 6"
            - "BunchingClaim.${claim_roll_id}.status == PARTIALLY_GRANTED because 6 < 42"
            - "the charge of ${cyc1_id} has bunching_exempt_days == 1, billable_days == 13 and gross_amount_cents == 372850"
            - "the charge of ${cyc2_id} has bunching_exempt_days == 2, billable_days == 12 and gross_amount_cents == 337800"
            - "the charge of ${cyc3_id} has bunching_exempt_days == 3, billable_days == 11 and gross_amount_cents == 302750"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: dispute_credit_per_line_round_half_up_beats_sum_then_round
        grounds:
          - calculations.dispute_credit_allocation
          - entities.DemurrageDispute.fields.allowed_credit_cents
          - entities.DemurrageCharge.fields.credit_applied_cents
          - entities.Invoice.fields.total_credit_cents
        distinguishing_aspect: |
          A staged formula whose stage order is observable: allowance_pct is
          applied per invoice line with ROUND_HALF_UP and only then summed, so
          two lines each landing on a .5 half-cent (47550 and 12550 at 0.65)
          produce 30908 + 8158 == 39066, while the tempting sum-then-round
          shortcut on the 60100 total produces 39065. One cent of divergence,
          visible on DemurrageDispute.allowed_credit_cents, Invoice
          .total_credit_cents and Invoice.total_net_cents at once.
        test_recipe:
          setup:
            - "logical clock at 2026-08-15T00:00:00Z after two cycles were released in August"
            - "Cycle A: RAILROAD_OWNED car, CP 2026-08-03T08:00:00Z, EDI notice 09:00:00Z, AP 2026-08-05T10:00:00Z, released 2026-08-10T16:00:00Z, FINAL charge 47550"
            - "Cycle B: RAILROAD_OWNED car, CP 2026-08-05T08:00:00Z, EDI notice 09:00:00Z, AP 2026-08-07T12:00:00Z, released 2026-08-11T09:00:00Z, FINAL charge 12550"
            - "one ISSUED Invoice over 2026-08-01..2026-08-31 holding both charges, total_gross_cents 60100 and no AverageAgreement in play"
            - "one WHOLE_INVOICE dispute UNDER_REVIEW with claimed_credit_cents 60000, which is deliberately far above the eventual allowance so the cap waterfall stays dormant"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "R2I1-CUST", name: "Half Cent Milling", serving_station_code: "STN04", notification_method: "EDI" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "R2I1-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "R2I1-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "R2I1-CSX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_a_id: $.data.id, car_a_v: $.data.version }
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "R2I1-CSX02", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_b_id: $.data.id, car_b_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_a_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-R2I1-A", expected_rail_car_version: "${car_a_v}" }
              as: RailroadAgent
              captures: { cyc_a_id: $.data.id }
            - call: "POST /demurrage/placement-cycles"
