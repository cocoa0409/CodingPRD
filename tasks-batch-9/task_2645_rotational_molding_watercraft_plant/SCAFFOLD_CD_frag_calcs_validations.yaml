              payload: { station_code: "OV-CVP", arm_count: 2, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - &cvP_bay
              call: "POST /cooling-bays"
              payload: { bay_code: "CB-CVP", concurrent_slot_capacity: 2, airflow_mode: "FORCED_AIR" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - *cvA_wh
            - &cvP_lot
              call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVP", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 200, received_kg: 100.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot: $.data.id }
            - &cvP_po
              call: "POST /production-orders"
              payload: { order_code: "PO-CVP", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 2 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po: $.data.id }
            - &cvP_release
              call: "POST /production-orders/${po}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - *cvB_clk_0900
          trigger:
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { po_v1: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v1}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc1: $.data.id }
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { po_v2: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 2, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T08:59:59Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v2}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 2, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:01Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v2}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc2: $.data.id }
            - call: "GET /molding-cycles?production_order_id=${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
          assert:
            - "the 09:00:00Z cycle returns 201 with status SCHEDULED — oven_start_at EQUAL to the logical clock satisfies rung 63, which is 'at or after the clock (equality passes)'"
            - "its projected window is oven_end_at 2026-08-01T10:00:00Z, cooling_window_start_at 10:00:00Z and cooling_window_end_at 10:30:00Z, and mold_id is MLD-CVP-1 (both moulds sit at cycles_since_service 0, so the mold_code ASC tie-break decides)"
            - "the 08:59:59Z cycle fails 422 ERR_OVEN_START_IN_PAST — one second of back-dating is enough, and this attempt is on arm 2 precisely so that rung 62 (oven window conflict, which outranks 63) cannot be the cause"
            - "the refused attempt did not consume the order version: the very same ${po_v2} is accepted by the next call, which proves no write happened and that rung 63 is checked before the OCC rung 80"
            - "the 09:00:01Z cycle returns 201 — one second into the future is admitted, so the rung rejects only instants strictly before the clock"
            - "the second accepted cycle draws MLD-CVP-2: MLD-CVP-1 is occupied over the half-open mould span [09:00:00Z, 10:30:00Z) which contains 09:00:01Z, so mold_selection must skip it rather than double-book"
            - "GET /molding-cycles?production_order_id=${po} returns total_count 2, both SCHEDULED, on arm 1 and arm 2 respectively — the refused cycle left no row"
            - "the order reads status IN_PRODUCTION and version advanced by exactly 2 across the three attempts (one increment per accepted cycle)"

      # -----------------------------------------------------------------------
      # V12 — priority 56: the acknowledgement must be on or before delivery,
      # equality passing; one second late blocks the VERIFIED review and forces
      # the VIOLATED -> WAIVED override, which costs 35 pct of the gross.
      # -----------------------------------------------------------------------
      - name: val_temporal_storage_acknowledgement_at_delivery_passes_one_second_late_fails
        claim_type: "Temporal validation"
        grounds:
          - validation_rules.priority_56
          - errors.ERR_STORAGE_GUIDANCE_NOT_ACKNOWLEDGED
          - state_machines.WarrantyClaim.storage_review_status
          - calculations.warranty_payout
          - endpoints.POST_/warranty-claims/{warranty_claim_id}/storage-review
        distinguishing_aspect: "Two customers who acknowledged the storage guidance one second apart around the identical delivery instant diverge on storage-review: acknowledging AT 2026-08-01T12:00:00Z verifies, acknowledging at 12:00:01Z is refused 422, and the only route left for the late customer is VIOLATED then WAIVED, which cuts the payout from 335671 to 212003 cents."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. The PM-CVW base (msrp_cents 400020, warranty_basis PRO_RATA_AGE, initial_warranty_reserve_cents 1000000) with site WH-CVA."
            - "Hulls fu1 and fu2 were produced, stored, sealed onto SHP-CVW and DELIVERED at 2026-08-01T12:00:00Z."
            - "Customer CUS-CVW acknowledged the storage guidance at exactly 2026-08-01T12:00:00Z — the delivery instant itself. Customer CUS-CVU acknowledged at 2026-08-01T12:00:01Z, one second later."
            - "PM-CVW reads warranty_reserve_cents 1000000 and warranty_paid_cents 0; no claim exists."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
            - *cvW_pm
            - *cvW_mold
            - *cvW_oven
            - *cvW_bay
            - *cvA_wh
            - *cvW_cust
            - *cvW_lot
            - *cvW_po
            - *cvW_release
            - *cvW_cycle
            - *cvW_charge
            - *cvB_clk_0900
            - *cvW_start
            - *cvB_clk_1000
            - *cvW_cool
            - *cvB_clk_1035
            - *cvW_demold
            - *cvW_units
            - *cvW_trim1
            - *cvW_outfit1
            - *cvW_inspect1
            - *cvW_trim2
            - *cvW_outfit2
            - *cvW_inspect2
            - *cvW_get_wh1
            - *cvW_store1
            - *cvW_get_wh2
            - *cvW_store2
            - *cvW_shp
            - *cvW_line1
            - *cvW_get_shp1
            - *cvW_line2
            - *cvW_clk_1100
            - *cvW_seal
            - *cvW_clk_1130
            - *cvW_depart
            - *cvW_clk_1200
            - *cvW_deliver
            - *cvW_ack
            - &cvU_cust
              call: "POST /customers"
              payload: { customer_code: "CUS-CVU", email: "late@cvu.example.com", region_code: "R-WEST" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { cust2: $.data.id }
            - &cvU_clk_1201
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:01Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - &cvU_ack
              call: "POST /customers/${cust2}/acknowledge-storage-guidance"
              payload: { acknowledged_at: "2026-08-01T12:00:01Z" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T12:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /warranty-claims"
              payload: { claim_code: "CLM-CVU-1", finished_unit_id: "${fu1}", customer_id: "${cust}", claim_type: "HULL_DEFORMATION", reported_deformation_mm: 3.50, storage_description: "cradle stored under cover" }
              as: WarrantyAgent
              as_user_id: "agent-1"
              captures: { clmA: $.data.id }
            - call: "POST /warranty-claims/${clmA}/start-review"
              payload: {}
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /warranty-claims/${clmA}/storage-review"
              payload: { outcome: "VERIFIED", storage_description: "acknowledgement timestamped at the delivery instant" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /warranty-claims"
              payload: { claim_code: "CLM-CVU-2", finished_unit_id: "${fu2}", customer_id: "${cust2}", claim_type: "HULL_DEFORMATION", reported_deformation_mm: 3.50, storage_description: "second hull, late acknowledgement on file" }
              as: WarrantyAgent
              as_user_id: "agent-1"
              captures: { clmB: $.data.id }
            - call: "POST /warranty-claims/${clmB}/start-review"
              payload: {}
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /warranty-claims/${clmB}/storage-review"
              payload: { outcome: "VERIFIED", storage_description: "attempting to verify a late acknowledgement" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "GET /warranty-claims/${clmB}"
              payload: {}
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /warranty-claims/${clmB}/storage-review"
              payload: { outcome: "VIOLATED", storage_description: "guidance acknowledged after delivery" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /warranty-claims/${clmB}/waive-storage-finding"
              payload: { waiver_note: "goodwill override signed off by the plant manager" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /product-models/${pm}"
              payload: {}
              as: WarrantyAgent
              as_user_id: "agent-1"
              captures: { pm_v1: $.data.version }
            - call: "POST /warranty-claims/${clmB}/approve"
              payload: { expected_product_model_version: "${pm_v1}" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "GET /product-models/${pm}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /warranty-claims/${clmA}"
              payload: {}
              as: WarrantyAgent
              as_user_id: "agent-1"
          assert:
            - "CLM-CVU-1's storage-review returns 200 with storage_review_status GUIDANCE_VERIFIED: CUS-CVW's storage_guidance_acknowledged_at equals FinishedUnit.delivered_at exactly, and rung 56 is 'on or before delivered_at (equality passes)'"
            - "CLM-CVU-2's VERIFIED storage-review fails 422 ERR_STORAGE_GUIDANCE_NOT_ACKNOWLEDGED — CUS-CVU acknowledged one second after the same delivery instant, so a >= comparison in the wrong direction or a date-only truncation would both wrongly pass"
            - "after that refusal GET /warranty-claims/${clmB} still reads storage_review_status NOT_STARTED and claim_status UNDER_REVIEW: the two axes are independent and the refused review advanced neither"
            - "the VIOLATED storage-review on the same claim returns 200 with storage_review_status GUIDANCE_VIOLATED — that outcome carries no acknowledgement precondition at all, which is precisely why rung 56 is conditional on the VERIFIED outcome"
            - "waive-storage-finding (PlantAdmin only) moves storage_review_status GUIDANCE_VIOLATED -> WAIVED and makes the claim approvable without touching claim_status, which stays UNDER_REVIEW"
            - "the approve of CLM-CVU-2 returns 200 with months_in_service 7 (2026-08-01T12:00:00Z to 2027-03-01T12:00:00Z), coverage_pct == round((60 - 7) / 60 * 100, 2) == 88.33, pre_fee_gross_cents == round_half_up(400020 * 88.33 / 100 * 1.00) == 353338, admin_fee_pct 5.00 chosen from that gross (353338 > 200000) giving admin_fee_cents == round_half_up(353338 * 5.00 / 100) == 17667, storage_deduction_cents == round_half_up(353338 * 35.00 / 100) == 123668 because the axis is WAIVED, and net_payout_cents == 353338 - 123668 - 17667 == 212003"
            - "the waiver costs the customer 123668 cents: an identical claim reviewed VERIFIED would have paid 353338 - 0 - 17667 == 335671, and the admin fee is IDENTICAL in both cases because the tier is chosen from the gross BEFORE the deduction rather than from the reduced amount"
            - "PM-CVW closes at warranty_reserve_cents 1000000 - 212003 == 787997 and warranty_paid_cents 212003, whose sum is the initial 1000000; ProductModel.version advanced by exactly 1 (the single approve)"
            - "CLM-CVU-1 is still UNDER_REVIEW with GUIDANCE_VERIFIED and every money field null — it was never approved, so it contributed nothing to the reserve arithmetic"

