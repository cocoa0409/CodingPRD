          - roles[Proponent].shared_operations
          - roles[CirculatorAgent].shared_operations
          - roles[CountyClerk].shared_operations
        distinguishing_aspect: |
          The mirror image of the exclusivity probe: for each operation the scaffold declares
          as shared, every listed role must succeed on it, so an implementation that hard-codes
          one actor per route is caught. Circulator registration is exercised from both
          SosAdmin and Proponent, the training, disclosure and affidavit steps from both the
          administrator and the circulator's own agent, and voter roll creation from both the
          administrator and the owning clerk - the same clerk identity that was refused
