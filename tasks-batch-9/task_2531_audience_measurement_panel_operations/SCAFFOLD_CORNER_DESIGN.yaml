          - endpoints[POST /processing-runs/{processing_run_id}/repin]
          - state_machines.ProcessingRun.transitions.PENDING_REPIN_to_OPEN
        distinguishing_aspect: "The UNIVERSE-driven repin cascade (as opposed to the rule-set-driven one) plus the full undo: repin returns every claimed interval to RAW with usable_minutes 0, zeroes the run counters and still leaves the held deliverable held, because releasing it needs a PUBLISHED run."
        test_recipe:
          setup:
            - "CHAIN C with CODE DMA-635, RANK 135, T 1, B 2000, BUDGET 500000, PERSONS 2, SERIAL MT-002035, LABEL RS-C35, carried only as far as step C10, so the run is EDITED with one claimed interval and contributing_household_count 1."
            - "A BASIC client (168h SLA) contracted to DMA-635 holds one scheduled deliverable pinned to that EDITED run."
            - "The clock is then moved to 2026-08-30T00:00:00Z, which is 29 whole days after the 2026Q3 vintage was published at 2026-08-01T00:00:00Z, so the 28-day floor is satisfied."
          setup_api_calls:
            - call: "GET /processing-runs"
