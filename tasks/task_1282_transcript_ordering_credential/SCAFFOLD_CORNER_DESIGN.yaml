              as: Student
              as_user_id: "${sid}"
            - call: "POST /registrar/orders/${o_old}/submit"
              payload: { expected_order_version: "${o_old_v1}" }
              as: Student
              as_user_id: "${sid}"
            - call: "POST /registrar/payments"
              payload: { order_id: "${o_old}", idempotency_key: "pay-old" }
              as: Student
              as_user_id: "${sid}"
              captures: { p_old: $.data.id }
            - call: "POST /registrar/payments/${p_old}/capture"
              payload: {}
              as: RegistrarOperator
            - call: "POST /registrar/line-items/${l_old}/dispatch"
              payload: {}
              as: RegistrarOperator
            - call: "POST /registrar/line-items/${l_old}/mark-delivered"
              payload: {}
              as: RegistrarOperator
            # In-window order — submitted 2026-08-10
            - call: "POST /registrar/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:00Z" }
              as: RegistrarAdmin
            - call: "POST /registrar/orders"
              payload: { student_id: "${sid}", order_kind: "OFFICIAL" }
