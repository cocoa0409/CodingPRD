            - "ACTIVE Tower / ACTIVE Sector; three plans: STD50 (RENTAL_OR_PURCHASE), RNT50 (RENTAL_ONLY, same 50 Mbps) and ALT75 (RENTAL_OR_PURCHASE, 75 Mbps)."
