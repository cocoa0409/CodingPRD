            - { call: "POST /import-documents", payload: { dock_ticket_id: "${t_id}", species_id: "${sp_id}", doc_type: "HEALTH_CERT", reference_number: "HC-001" }, as: ComplianceOfficer, captures: { doc_id: $.data.id } }
          trigger:
            - { call: "POST /import-documents/${doc_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "off_1" }
            - { call: "POST /import-documents/${doc_id}/reject", payload: {}, as: ComplianceOfficer, as_user_id: "off_2" }
            - { call: "POST /import-documents/${doc_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "off_1" }
            - { call: "POST /import-documents/${doc_id}/clear", payload: {}, as: ComplianceOfficer, as_user_id: "off_1", captures: { sod_err: $.data.error_id } }
            - { call: "POST /import-documents/${doc_id}/clear", payload: {}, as: ComplianceOfficer, as_user_id: "off_2" }
          assert:
            - "After resubmission: ImportDocument.${doc_id}.status == SUBMITTED and resubmit_count == 1"
            - "Clear by the submitting officer off_1 returns ERR_SEGREGATION_OF_DUTIES_VIOLATION (403) and status stays SUBMITTED"
            - "Clear by off_2 succeeds: status == CLEARED and reviewed_by_user_id == off_2"

  - rule_id: transitive_cascade
    instances:
      - name: condemn_cascade_releases_allocations_and_requests_substitution
        grounds:
          - state_machines.InventoryLot
          - state_machines.Allocation
          - state_machines.SalesOrder.FULFILLED_to_CONFIRMED
          - calculations.substitute_selection
        distinguishing_aspect: |
          Depth-4 chain from POST /inspection-holds/{id}/condemn: hold CONDEMNED mutates
          the InventoryLot (hold_status + weight buckets); the lot mutation itself
          releases its COMMITTED Allocation; the allocation release recomputes the
          OrderLine and regresses the SalesOrder FULFILLED -> CONFIRMED; the shortage
          then auto-creates a SubstitutionApproval via the deterministic selector
          (cheapest in-group species with an ACTIVE+CLEAR lot and PUBLISHED quote).
          Originating trigger differs from the ticket-void cascade instance.
        test_recipe:
          setup:
            - "COD lot of 87.30 kg (100.00 kg landed, GRADE_B, yield 0.90); POLLOCK (same group GADOID) lot of 50.00 kg with PUBLISHED GRADE_A quote 1000"
            - "Order CONFIRMED with one COD line 20.00 kg, allow_substitution true; allocation 20.00 committed -> order FULFILLED"
            - "Hold placed on the COD lot"
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
