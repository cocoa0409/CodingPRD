  - section: cross_cutting_complexity_layers
    instances:
      - name: tax_profile_occ_accepts_the_current_creator_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[tax-profile-create-stale-creator]"
          - "validations[priority 43]"
        distinguishing_aspect: "The positive half of the OCC rule: the same create that fails with the version captured before evaluate succeeds with the version returned by evaluate, and the accepted write itself bumps Creator.version again."
        test_recipe:
          setup: ["One US creator whose version advanced once through an evaluate call."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ada Ads", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr: "$.data.id", cr_v1: "$.data.version" }
            - call: "POST /monetization/creators/${cr}/evaluate"
              payload: {}
              as: FinanceOperator
              captures: { cr_v2: "$.data.version" }
          trigger:
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${cr}", form_type: "W9", country_code: "US", tin_provided: true, treaty_claimed: false, expected_creator_version: "${cr_v1}" }
              as: Creator
              as_user_id: "${cr}"
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${cr}", form_type: "W9", country_code: "US", tin_provided: true, treaty_claimed: false, expected_creator_version: "${cr_v2}" }
              as: Creator
              as_user_id: "${cr}"
              captures: { tp: "$.data.id" }
          assert:
            - "first trigger: HTTP status == 412 and error.error_id == 'ERR_STALE_CREATOR_VERSION'"
            - "second trigger: HTTP status == 201"
            - "second trigger: data.status == 'DRAFT'"
            - "second trigger: data.creator_id == '${cr}'"
            - "Creator.${cr}.version == ${cr_v2} + 1"
            - "GET /monetization/tax-profiles?creator_id=${cr}: total_count == 1"

      - name: fund_allocate_occ_rejects_the_pre_allocation_version_on_a_supersede_run
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[fund-allocate-stale-fund]"
          - "validations[priority 42]"
          - entities.CreatorFund.fields.allocation_run_count
        distinguishing_aspect: "A supersede run is legal from ALLOCATED, so only the version tells the two callers apart: replaying the pre-allocation version is 412 and leaves allocation_run_count at 1, while the post-allocation version supersedes and lifts it to 2."
        test_recipe:
          setup: ["Two ELIGIBLE creators with watch times 800000 and 240000; one OPEN period; a 104000-cent PRO_RATA fund already allocated once."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Top Creator", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 800000 }
              as: PlatformAdmin
              captures: { cr_a: "$.data.id" }
            - call: "POST /monetization/creators"
              payload: { display_name: "Next Creator", country_code: "GB", follower_count: 50000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { cr_b: "$.data.id" }
            - call: "POST /monetization/creators/${cr_a}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/creators/${cr_b}/evaluate"
              payload: {}
