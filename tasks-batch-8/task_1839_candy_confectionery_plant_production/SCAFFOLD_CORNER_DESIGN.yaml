  # ==================================================================
  # Section: endpoints
  # ==================================================================
  - section: endpoints
    instances:
      - name: products_list_pagination_envelope
        claim_type: standard_crud
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more; default limit is 10."
        test_recipe:
          setup:
            - "One packaging component and three products exist"
          setup_api_calls:
            - call: "POST /packaging-components"
              payload: { sku_code: "BOX-24", name: "24pc box", units_per_component: 10, lead_time_days: 14, qty_on_hand: 1000 }
              as: ProductionPlanner
              captures: { pkg_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "P1", name: "P1", product_type: "STANDARD", brand: "OWN", base_price_cents: 100, unit_weight_grams: 10, shelf_life_days: 90, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
            - call: "POST /products"
              payload: { sku_code: "P2", name: "P2", product_type: "STANDARD", brand: "OWN", base_price_cents: 200, unit_weight_grams: 10, shelf_life_days: 90, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
            - call: "POST /products"
              payload: { sku_code: "P3", name: "P3", product_type: "SEASONAL", brand: "OWN", base_price_cents: 300, unit_weight_grams: 10, shelf_life_days: 90, packaging_component_id: "${pkg_id}" }
              as: ProductionPlanner
          trigger:
            - call: "GET /products"
              payload: {}
              as: ProductionPlanner
            - call: "GET /products"
              payload: { limit: 2 }
              as: ProductionPlanner
            - call: "GET /products"
              payload: { limit: 2, offset: 2 }
              as: ProductionPlanner
            - call: "GET /products"
              payload: { product_type: "SEASONAL" }
              as: ProductionPlanner
          assert:
            - "default list: 3 items, total_count == 3, has_more == false (default limit 10 covers all)"
            - "limit=2: 2 items, total_count == 3, has_more == true"
            - "limit=2&offset=2: 1 item, total_count == 3, has_more == false"
            - "product_type=SEASONAL filter: exactly 1 item (P3)"
            - "every response carries meta.api_request_id and response_type"

      - name: apply_markdown_response_fields_covered
        claim_type: action_endpoint
        grounds: [endpoints]
        excluded_because:
          difficulty_instance: combinatorial_formula / markdown_tiered_price_with_floor
          rationale: "The inline response fields updated_lot_count/discount_pct/days_after_season_end are captured and asserted by the named difficulty instance."

