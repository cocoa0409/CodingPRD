  - section: cross_cutting_layers
    instances:
      - name: occ_estimate_create_stale_claim_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[estimate-create-stale-claim]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Creating an INITIAL estimate with the claim's current version succeeds and bumps Claim.version (3 -> 4); replaying the create with the now-stale version 3 fails 412 — even though the second create would otherwise be a legitimate write."
        test_recipe:
          setup: ["Claim WATER in ESTIMATING at version 3"]
          setup_api_calls:
            - { call: "POST /v1/carriers", payload: { name: "Acme Mutual", tax_rate: 0.07 }, as: ContractorAdmin, captures: { ca_id: $.data.id } }
