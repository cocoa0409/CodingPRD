        distinguishing_aspect: |
          Publishing a part the current guide does not document must push the
          MODEL from CURRENT to STALE and write coverage_gap_sku_count 1 onto the
          PUBLISHED revision — the cascade runs from the part, not from the guide.
        test_recipe:
          setup:
            - "Region US-CA; model CRX-S200 (TIER_A) with part SKU-S200-FAN PUBLISHED and covered by a PUBLISHED DISASSEMBLY_GUIDE, so documentation_posture is CURRENT."
            - "A second part SKU-S200-CELL is DRAFT with an in-window compatibility row and is absent from the guide's covered_part_skus."
