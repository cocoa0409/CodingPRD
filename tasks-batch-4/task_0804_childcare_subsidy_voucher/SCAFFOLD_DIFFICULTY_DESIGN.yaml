              payload: {}
              as: ProgramAdmin
              captures: { oc_id: "$.data[0].id" }
          assert:
            - "Payment.${pay_id}.status == REVERSED"
            - "Provider.${prov_id}.total_net_paid_cents == 0"
            - "OverpaymentClaim.${oc_id}.amount_cents == 93072"

      - name: family_copay_ledger_conserved_on_reverse
