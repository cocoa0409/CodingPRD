            - { call: "POST /bid-batches/${batchB}/seal", as: ProgramCoordinator, captures: { vB: "$.data.version" } }
            - { call: "POST /bids", payload: { batch_id: "${batchB}", unit_rate_cents: 900, ramp_flat_fee_cents: 0, expected_batch_version: "${vB}" }, as: Contractor, as_user_id: "${c1}", captures: { bidB1: "$.data.id", evalB1: "$.data.evaluated_total_cents" } }
            - { call: "GET /bid-batches/${batchB}", as: ProgramCoordinator, captures: { vB2: "$.data.version" } }
            - { call: "POST /bids", payload: { batch_id: "${batchB}", unit_rate_cents: 1000, ramp_flat_fee_cents: 0, expected_batch_version: "${vB2}" }, as: Contractor, as_user_id: "${c2}", captures: { bidB2: "$.data.id" } }
