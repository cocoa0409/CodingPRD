            - call: "POST /api/students"
              payload: { picture_day_session_id: "${sess}", full_name: "Real Kid", grade: "9", homeroom: "Z9", guardian_user_id: "g1" }
              as: SchoolCoordinator
              captures: { s1: $.data.id }
            - call: "POST /api/picture-day-sessions/${sess}/lock-roster"
              payload: {}
              as: SchoolCoordinator
            - call: "POST /api/picture-day-sessions/${sess}/open-capture"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/photos"
              payload: { picture_day_session_id: "${sess}", candidate_name: "Nobody Here", candidate_grade: "0", candidate_homeroom: "X0" }
              as: StudioPhotographer
              captures: { ph: $.data.id }
            - call: "POST /api/students/${s1}/mark-absent"
              payload: {}
