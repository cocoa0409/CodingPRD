      - name: material_event_deadline_applies_the_market_holiday_constant
        claim_type: constants_applied
        grounds:
          - calculations.material_event_filing_deadline
          - calculations.business_day_calendar.constants.MARKET_HOLIDAYS
          - calculations.business_day_calendar.constants.WEEKEND_DAYS
        distinguishing_aspect: >-
          The ten-business-day window must consume the MARKET_HOLIDAYS list, not merely skip
          weekends: an occurrence on 2026-08-24 spans Labor Day 2026-09-07 and therefore lands on
          2026-09-08 rather than 2026-09-07. The same window from a Saturday occurrence proves the
          base date is never itself counted as day one.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue. All three notices are created at the default clock, and 2026-08-01 is a Saturday."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2026-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
          trigger:
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "TRUSTEE_SUBSTITUTION", occurrence_date: "2026-08-01" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { d_sat: "$.data.filing_deadline_date" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "UNSCHEDULED_DRAW_ON_RESERVE", occurrence_date: "2026-07-24" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { d_plain: "$.data.filing_deadline_date" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { clock: "$.data.current_utc" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "MERGER_OR_SALE", occurrence_date: "2026-08-24" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { d_labor: "$.data.filing_deadline_date" }
          assert:
            - "${d_sat} == \"2026-08-14\" — Saturday 2026-08-01 is not counted, so day one is Monday 2026-08-03 and day ten is Friday 2026-08-14"
            - "${d_plain} == \"2026-08-07\" — ten clean business days from Friday 2026-07-24"
            - "${clock} echoes 2026-08-24T00:00:00Z"
            - "${d_labor} == \"2026-09-08\" — the window from Monday 2026-08-24 must skip the 2026-09-07 MARKET_HOLIDAY; an implementation that only skips weekends returns 2026-09-07"

