  - section: rbac
    instances:
      - name: unknown_role_and_absent_user_id_are_both_unauthenticated
        claim_type: exclusive_operations_denied
        grounds:
          - "validations[priority=10 ERR_UNAUTHENTICATED]"
          - "validations[priority=20 ERR_UNAUTHORIZED]"
          - "errors[ERR_UNAUTHENTICATED]"
          - "rbac.roles"
        distinguishing_aspect: |
          Authentication is checked at priority 10, strictly before the role gate at 20, and it has
          two independent failure modes: an X-User-Role that is not one of the seven declared roles,
          and a missing X-User-ID. Both must answer 401 ERR_UNAUTHENTICATED — never 403
          ERR_UNAUTHORIZED, which would leak that the endpoint exists and that the presented role was
          merely insufficient. The identical call with both headers present succeeds.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no entities exist yet, so nothing but the auth ladder can answer."
            - "The first call presents X-User-Role: TimberBroker, a role that does not appear in the seven-role catalog."
            - "The second call presents a valid X-User-Role: FundAdmin but omits the X-User-ID header entirely (shown as an empty as_user_id)."
            - "The third call presents both headers correctly."
          setup_api_calls:
            - call: "POST /timberland/_clock/set_current_utc"
              payload: {current_utc: "2026-08-01T00:00:00Z"}
              as: FundAdmin
          trigger:
            - call: "POST /timberland/funds"
              payload: {name: "Longleaf Timber Fund I", vintage_year: 2025, committed_capital_usd: 500000.00, target_cash_yield_bps: 0, opening_cash_usd: 400000.00}
              as: TimberBroker
              captures: { eid1: "$.data.error_id" }
            - call: "POST /timberland/funds"
              payload: {name: "Longleaf Timber Fund I", vintage_year: 2025, committed_capital_usd: 500000.00, target_cash_yield_bps: 0, opening_cash_usd: 400000.00}
              as: FundAdmin
              captures: { eid2: "$.data.error_id" }
            - call: "POST /timberland/funds"
              payload: {name: "Longleaf Timber Fund I", vintage_year: 2025, committed_capital_usd: 500000.00, target_cash_yield_bps: 0, opening_cash_usd: 400000.00}
              as: FundAdmin
              as_user_id: "admin-1"
              captures: { fund_id: "$.data.id", cash: "$.data.cash_balance_usd" }
          assert:
            - "first call: HTTP 401 with ${eid1} == ERR_UNAUTHENTICATED, not ERR_UNAUTHORIZED and not ERR_INVALID_REQUEST"
            - "second call (X-User-ID header omitted): HTTP 401 with ${eid2} == ERR_UNAUTHENTICATED"
            - "neither refused call creates a Fund row"
            - "third call: HTTP 201 with ${cash} == 400000.00"
            - "Fund.${fund_id}.cash_yield_bps == 0 and version == 1"
