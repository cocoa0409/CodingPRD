# =============================================================================
# SCAFFOLD.yaml — Crayon Manufacturing, Color Retirement & Experience Attraction
# Flat-topology, segregation-of-duties, compliance/audit + quota/allocation.
# =============================================================================

scenario: |
  Crayon Manufacturing, Color Retirement & Experience Attraction (Crayola): pigment sourcing and formulation with strict safety standards for products intended for children and certification marks, molding, labeling and packing operations at high volume with color assortment packing accuracy, color introduction and retirement decisions with consumer voting campaigns and archive handling, seasonal back-to-school demand concentration with retail allocation and long production lead times, licensed and co-branded product lines with approval workflows, factory-adjacent experience attraction operations with ticketing, capacity and school group scheduling, product safety testing and recall readiness for art materials, art education program partnerships and classroom pack configuration

domain_name: crayon-works
api_prefix: /crayon-works

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - ops_run_checkpoint
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — verbatim per SKILL.md section 1.0)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (flat topology — peer entities, FK links)
# =============================================================================
entities:
  - name: Color
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Color display name" }
      - { name: hex_code, type: string, source: input, description: "RGB hex code, e.g. #02A4D3" }
      - { name: is_core_curriculum, type: boolean, source: input, default: false, description: "Core-curriculum flag; CLASSROOM assortment specs must include every ACTIVE core color" }
      - { name: status, type: enum, source: system, description: "PROPOSED | IN_VOTE | ACTIVE | RETIRE_VOTE | RETIRED | ARCHIVED" }
      - { name: introduced_on, type: datetime, source: system, description: "Set to the passing INTRODUCTION campaign closes_on; null until then" }
      - { name: retired_on, type: datetime, source: system, description: "Set to the passing RETIREMENT campaign closes_on; null until then" }
      - { name: archive_after_date, type: datetime, source: system, description: "= retired_on + 30 days; run-epoch archives the color once the logical clock reaches it" }

  - name: PigmentBatch
    parent: null
    common_fields: true
    fields:
      - { name: pigment_name, type: string, source: input, description: "Pigment name, e.g. Phthalo Blue" }
      - { name: supplier_name, type: string, source: input, description: "Supplier legal name" }
      - { name: hazard_class, type: enum, source: input, description: "STANDARD | SENSITIVE | RESTRICTED — child-product safety classification" }
      - { name: received_quantity_kg, type: number, source: input, description: "Received quantity in kilograms; must be > 0" }
      - { name: certification_mark, type: enum, source: input, description: "ACMI_AP | ACMI_CL | NONE — certification mark sought for this lot" }
      - { name: status, type: enum, source: system, description: "QUARANTINE | CERTIFIED | REJECTED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID that registered the batch; segregation-of-duties anchor" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID that certified the batch; null until CERTIFIED" }
      - { name: rejection_reason, type: string, source: system, description: "Reason captured on REJECT; null otherwise" }

  - name: Formula
    parent: null
    common_fields: true
    fields:
      - { name: color_id, type: string, source: input, description: "FK -> Color.id; the color this formula produces" }
      - { name: intended_use, type: enum, source: input, description: "CRAYON | MARKER | COLORED_PENCIL" }
      - { name: pigment_recipe, type: array, source: input, description: "Opaque recipe lines [{pigment_name, parts}]; must be a non-empty array" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | REJECTED | SUPERSEDED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the most recent SUBMIT; segregation-of-duties anchor" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approver; null until APPROVED" }
      - { name: licensed_use_count, type: integer, source: system, default: 0, description: "Count of licensed-line BRAND_APPROVE decisions referencing this formula; each approval increments it and therefore Formula.version" }

  - name: VoteCampaign
    parent: null
    common_fields: true
    fields:
      - { name: color_id, type: string, source: input, description: "FK -> Color.id; the subject color of the vote" }
      - { name: kind, type: enum, source: input, description: "INTRODUCTION | RETIREMENT" }
      - { name: opens_on, type: datetime, source: input, description: "Voting opens at this logical time (inclusive bound)" }
      - { name: closes_on, type: datetime, source: input, description: "Voting closes at this logical time (inclusive bound); must be strictly after opens_on" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | TALLYED" }
      - { name: votes_yes_weighted, type: number, source: system, default: 0, description: "Weighted YES ballot total per vote_tally weights" }
      - { name: votes_total_weighted, type: number, source: system, default: 0, description: "Weighted total of all ballots" }
      - { name: turnout_count, type: integer, source: system, default: 0, description: "Raw ballot count (sum of vote counts)" }
      - { name: outcome, type: enum, source: system, description: "PASSED | FAILED; null until TALLYED" }
      - { name: tallied_at, type: datetime, source: system, description: "Logical clock value when the epoch tallied the campaign; null until TALLYED" }

  - name: SafetyTest
    parent: null
    common_fields: true
    fields:
      - { name: formula_id, type: string, source: system, description: "FK -> Formula.id; set by the SUBMIT cascade that creates the test" }
      - { name: test_standard, type: enum, source: system, default: "ASTM_D4236", description: "ASTM_D4236 | EN71_3 — art-material safety standard applied" }
      - { name: test_seq, type: integer, source: system, description: "Per-formula monotonic sequence assigned at creation (1, 2, ...); the approval gate reads the latest test by (created_at ASC, test_seq ASC)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PASSED | FAILED" }
      - { name: result_notes, type: string, source: system, description: "Lab notes captured at record-result; null until recorded" }
      - { name: recorded_by_user_id, type: string, source: system, description: "LabTechnician X-User-ID; null until recorded" }

  - name: AssortmentSpec
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Spec name, e.g. 64-count back-to-school box" }
      - { name: kind, type: enum, source: input, description: "RETAIL | CLASSROOM | LICENSED" }
      - { name: partner_name, type: string, source: input, description: "Education-program partner name; required when kind=CLASSROOM, must be omitted otherwise" }
      - { name: entries, type: array, source: input, description: "Packing plan [{color_id, count}]; non-empty; each count >= 1; each color must exist and be ACTIVE; at most one entry per color; for CLASSROOM every ACTIVE core-curriculum color must appear" }
      - { name: wholesale_price_cents, type: integer, source: input, description: "Wholesale price per box in cents; >= 1" }
      - { name: box_size, type: integer, source: computed, description: "= sum(entries.count); must equal one of 8, 16, 24, 64 or creation is rejected with ERR_SPEC_INVALID" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | DEPRECATED — becomes DEPRECATED when any entry color is RETIRED or ARCHIVED; recomputed on every color status change" }
      - { name: boxes_available, type: integer, source: computed, description: "= sum(boxes_on_hand over AVAILABLE or DEPLETED lots of runs created with this spec)" }
      - { name: boxes_reserved, type: integer, source: computed, description: "= sum(allocated_boxes_provisional of REQUESTED allocations) + sum(allocated_boxes_final of COMMITTED allocations) for this spec" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: assortment_spec_id, type: string, source: input, description: "FK -> AssortmentSpec.id; the box configuration this run packs" }
      - { name: pigment_batch_id, type: string, source: input, description: "FK -> PigmentBatch.id; the pigment lot consumed by molding" }
      - { name: planned_boxes, type: integer, source: input, description: "Planned box output; >= 1" }
      - { name: planned_start_date, type: datetime, source: input, description: "Planned molding start; must be >= logical clock + 60 days (long production lead time)" }
      - { name: planned_end_date, type: datetime, source: input, description: "Planned completion; must be strictly after planned_start_date" }
      - { name: stage, type: enum, source: system, description: "PLANNED | MOLDING | LABELING | PACKING | COMPLETED | ON_HOLD | CANCELLED | QUARANTINED" }
      - { name: stage_before_hold, type: enum, source: system, description: "Stage the run returns to on RESUME; null unless ON_HOLD" }
      - { name: hold_reason, type: enum, source: system, description: "QUALITY; null unless ON_HOLD (recall quarantine is its own terminal stage)" }
      - { name: packed_counts, type: array, source: input, description: "Actual per-color packed units [{color_id, count}] supplied on the PACKING-to-COMPLETED advance; must cover exactly the spec entry colors" }
      - { name: packing_variance_units, type: integer, source: computed, description: "= sum over spec entries of abs(packed - expected), expected = entry.count * planned_boxes" }
      - { name: packing_penalty_cents, type: integer, source: computed, description: "Per-line rounded penalty sum; see packing_penalty calculation; reflects the latest packing evaluation" }
      - { name: boxes_produced, type: integer, source: computed, description: "= min over spec entries of floor(packed_count / entry.count); 0 until a successful completion evaluation" }
      - { name: waste_units, type: integer, source: computed, description: "= sum(packed_counts) - boxes_produced * box_size" }
      - { name: run_seq, type: integer, source: system, description: "Global monotonic sequence assigned at run creation; list endpoints order by (created_at ASC, run_seq ASC)" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: production_run_id, type: string, source: system, description: "FK -> ProductionRun.id; the completed run that produced these boxes" }
      - { name: boxes_received, type: integer, source: system, description: "= run.boxes_produced at completion" }
      - { name: boxes_on_hand, type: integer, source: system, description: "Uncommitted boxes physically in the warehouse" }
      - { name: boxes_committed, type: integer, source: system, default: 0, description: "Boxes committed to allocations, not yet shipped" }
      - { name: boxes_shipped, type: integer, source: system, default: 0, description: "Boxes shipped to retailers" }
      - { name: lot_seq, type: integer, source: system, description: "Per-spec monotonic sequence assigned at lot creation (1, 2, ...); FIFO deduction/return orders by (created_at ASC, lot_seq ASC)" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | DEPLETED | QUARANTINED; DEPLETED iff boxes_on_hand == 0 (and not quarantined)" }

  - name: RetailAllocation
    parent: null
    common_fields: true
    fields:
      - { name: assortment_spec_id, type: string, source: input, description: "FK -> AssortmentSpec.id; the box configuration being allocated" }
      - { name: retailer_name, type: string, source: input, description: "Retail chain name" }
      - { name: priority_tier, type: enum, source: input, description: "PLATINUM | GOLD | STANDARD — waterfall priority, PLATINUM first" }
      - { name: requested_boxes, type: integer, source: input, description: "Boxes requested; >= 1" }
      - { name: requested_ship_date, type: datetime, source: input, description: "Must fall inside the season window [2027-06-01T00:00:00Z, 2027-08-31T23:59:59Z]" }
      - { name: allocated_boxes_provisional, type: integer, source: computed, description: "Forward-looking waterfall share (includes in-season planned production); recomputed on every pool change" }
      - { name: allocated_boxes_final, type: integer, source: computed, description: "Physical on-hand share fixed at COMMIT; null until then" }
      - { name: status, type: enum, source: system, description: "REQUESTED | COMMITTED | FULFILLED | RELEASED | EXPIRED | SHORTED" }
      - { name: request_seq, type: integer, source: system, description: "Per-spec monotonic sequence assigned at creation (1, 2, ...); waterfall ranking tie-breaks on it after created_at" }

  - name: LicensedLine
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Licensed line name, e.g. a movie tie-in box" }
      - { name: licensor_user_id, type: string, source: input, description: "Opaque X-User-ID of the licensor-side approver; the Licensor role must present exactly this id" }
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id; signature color formula for the line" }
      - { name: term_start, type: datetime, source: input, description: "License term start (inclusive)" }
      - { name: term_end, type: datetime, source: input, description: "License term end (inclusive); must be strictly after term_start" }
      - { name: royalty_rate, type: number, source: input, description: "Royalty rate, e.g. 0.08; must be > 0 and <= 0.5" }
      - { name: royalty_base, type: enum, source: input, description: "GROSS | NET — selects the licensed_royalty variant" }
      - { name: pinned_formula_version, type: integer, source: system, description: "Formula.version pinned at BRAND_APPROVE; staleness gates REINSTATE" }
      - { name: projected_royalty_cents, type: integer, source: computed, description: "Royalty projection per licensed_royalty calculation; recomputed on read" }
      - { name: status, type: enum, source: system, description: "DRAFT | LICENSOR_REVIEW | BRAND_REVIEW | APPROVED | REJECTED | SUSPENDED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the most recent SUBMIT; segregation-of-duties anchor for BRAND_APPROVE" }

  - name: AttractionSession
    parent: null
    common_fields: true
    fields:
      - { name: venue_name, type: string, source: input, description: "Venue within the attraction, e.g. Hall A" }
      - { name: session_date, type: datetime, source: input, description: "Calendar date of the session; must not be before the current logical date" }
      - { name: start_minute, type: integer, source: input, description: "Minutes after midnight local; 0..1339" }
      - { name: duration_minutes, type: integer, source: input, description: "Session length in minutes; >= 30" }
      - { name: capacity_units, type: integer, source: input, description: "Visitor capacity; 1 unit = 1 visitor; >= 1" }
      - { name: is_charter, type: boolean, source: input, default: false, description: "Charter (school buyout) session; selects the CHARTER pricing variant" }
      - { name: base_price_cents, type: integer, source: input, description: "Base ticket price per visitor in cents; >= 0" }
      - { name: booked_units, type: integer, source: computed, description: "= sum(units of tickets with status CONFIRMED or CHECKED_IN); immediate consistency" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CLOSED" }

  - name: Ticket
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> AttractionSession.id" }
      - { name: kind, type: enum, source: input, description: "INDIVIDUAL | GROUP (school group scheduling)" }
      - { name: group_size, type: integer, source: input, description: "Required iff kind=GROUP; then 10..100" }
      - { name: school_name, type: string, source: input, description: "Required iff kind=GROUP; must be omitted for INDIVIDUAL" }
      - { name: units, type: integer, source: system, description: "= 1 for INDIVIDUAL, = group_size for GROUP" }
      - { name: price_cents, type: integer, source: computed, description: "= unit price per ticket_dynamic_price times units; fixed at confirmation (creation or waitlist promotion)" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | WAITLISTED | CHECKED_IN | REFUNDED | CANCELLED | NO_SHOW" }
      - { name: checked_in_at, type: datetime, source: system, description: "Null until CHECKED_IN" }
      - { name: waitlist_seq, type: integer, source: system, description: "Per-session monotonic sequence assigned at creation (1, 2, ...); waitlist promotion orders by (created_at ASC, waitlist_seq ASC)" }

  - name: RecallCase
    parent: null
    common_fields: true
    fields:
      - { name: pigment_batch_id, type: string, source: system, description: "FK -> PigmentBatch.id; the retro-rejected batch that opened the case" }
      - { name: affected_run_count, type: integer, source: computed, description: "Runs quarantined or cancelled by the recall cascade" }
      - { name: affected_units, type: integer, source: computed, description: "Crayon units in scope: COMPLETED runs contribute boxes_produced * box_size; other affected runs contribute planned_boxes * box_size" }
      - { name: severity, type: enum, source: computed, description: "CLASS_I | CLASS_II | CLASS_III per recall_severity_classification" }
      - { name: cooling_until, type: datetime, source: system, description: "= case created_at + severity cooling days; run-epoch closes the case at or after this instant" }
      - { name: status, type: enum, source: system, description: "OPEN | CONTAINED | CLOSED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Color
    initial_state: PROPOSED
    terminal_states: [ARCHIVED]
    transitions:
      - from: PROPOSED
        to: IN_VOTE
        trigger: "POST /crayon-works/colors/{id}/vote-campaigns with kind=INTRODUCTION"
        actor: PlatformAdmin
        preconditions:
          - "color is PROPOSED (else ERR_COLOR_NOT_ACTIVE)"
        side_effects:
          - "VoteCampaign created in SCHEDULED for this color"
      - from: IN_VOTE
        to: ACTIVE
        trigger: "system (run-epoch tallies the INTRODUCTION campaign with outcome PASSED)"
        actor: system
        preconditions: []
        side_effects:
          - "introduced_on := campaign.closes_on"
      - from: IN_VOTE
        to: PROPOSED
        trigger: "system (run-epoch tallies the INTRODUCTION campaign with outcome FAILED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "revision loop — a failed introduction returns the color to PROPOSED; a later campaign may retry"
      - from: ACTIVE
        to: RETIRE_VOTE
        trigger: "POST /crayon-works/colors/{id}/vote-campaigns with kind=RETIREMENT"
        actor: PlatformAdmin
        preconditions:
          - "color is ACTIVE (else ERR_COLOR_NOT_ACTIVE)"
        side_effects:
          - "VoteCampaign created in SCHEDULED for this color"
      - from: RETIRE_VOTE
        to: RETIRED
        trigger: "system (run-epoch tallies the RETIREMENT campaign with outcome PASSED)"
        actor: system
        preconditions: []
        side_effects:
          - "retired_on := campaign.closes_on; archive_after_date := closes_on + 30 days"
          - "cascade link 2: every AssortmentSpec whose entries contain this color becomes DEPRECATED"
          - "cascade link 3: every PLANNED ProductionRun of a newly DEPRECATED spec becomes CANCELLED"
      - from: RETIRE_VOTE
        to: ACTIVE
        trigger: "system (run-epoch tallies the RETIREMENT campaign with outcome FAILED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "second cycle — a failed retirement returns the color to ACTIVE"
      - from: RETIRED
        to: ARCHIVED
        trigger: "system (run-epoch when logical clock >= archive_after_date)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PigmentBatch
    initial_state: QUARANTINE
    terminal_states: [REJECTED]
    transitions:
      - from: QUARANTINE
        to: CERTIFIED
        trigger: "POST /crayon-works/pigment-batches/{id}/certification-decision {decision: CERTIFY}"
        actor: QualityAssurance
        preconditions:
          - "X-User-ID != created_by_user_id (segregation of duties, ERR_SOD_VIOLATION)"
          - "if hazard_class is SENSITIVE or RESTRICTED, certification_mark must be ACMI_AP (ERR_CERTIFICATION_MARK_REQUIRED)"
        side_effects:
          - "certified_by_user_id := X-User-ID"
      - from: QUARANTINE
        to: REJECTED
        trigger: "POST /crayon-works/pigment-batches/{id}/certification-decision {decision: REJECT}"
        actor: QualityAssurance
        preconditions:
          - "X-User-ID != created_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "rejection_reason := payload reason"
      - from: CERTIFIED
        to: REJECTED
        trigger: "POST /crayon-works/pigment-batches/{id}/certification-decision {decision: REJECT} (retroactive rejection)"
        actor: QualityAssurance
        preconditions:
          - "X-User-ID != created_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "if any ProductionRun references this batch: create RecallCase (OPEN) and apply the recall cascade — see RecallCase machine"
        note: "depth-4 transitive cascade origin: batch -> recall case -> runs -> lots -> allocations (and licensed lines off the run hop)"

  - entity: Formula
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /crayon-works/formulas/{id}/transition {action: SUBMIT}"
        actor: Formulator | SafetyOfficer
        preconditions: []
        side_effects:
          - "submitted_by_user_id := X-User-ID"
          - "create SafetyTest SCHEDULED for this formula (safety certification is mandatory before approval)"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /crayon-works/formulas/{id}/transition {action: SUBMIT} (resubmission)"
        actor: Formulator | SafetyOfficer
        preconditions: []
        side_effects:
          - "submitted_by_user_id := X-User-ID"
          - "create a new SafetyTest SCHEDULED; older test results remain on their own rows"
        note: "revision loop — a formula may cycle DRAFT -> SUBMITTED -> REVISION_REQUESTED -> SUBMITTED repeatedly"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /crayon-works/formulas/{id}/transition {action: APPROVE}"
        actor: SafetyOfficer
        preconditions:
          - "X-User-ID != submitted_by_user_id (segregation of duties, ERR_SOD_VIOLATION)"
          - "latest SafetyTest by created_at for this formula is PASSED (ERR_FORMULA_NOT_APPROVABLE)"
        side_effects:
          - "approved_by_user_id := X-User-ID"
          - "cascade link 2: every other APPROVED formula for the same color becomes SUPERSEDED"
          - "cascade link 3: APPROVED LicensedLines whose formula_id is a newly SUPERSEDED formula become SUSPENDED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /crayon-works/formulas/{id}/transition {action: REJECT}"
        actor: SafetyOfficer
        preconditions:
          - "X-User-ID != submitted_by_user_id (ERR_SOD_VIOLATION)"
        side_effects: []
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /crayon-works/formulas/{id}/transition {action: REQUEST_REVISION}"
        actor: SafetyOfficer
        preconditions:
          - "X-User-ID != submitted_by_user_id (ERR_SOD_VIOLATION)"
        side_effects: []

  - entity: VoteCampaign
    initial_state: SCHEDULED
    terminal_states: [TALLYED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "system (run-epoch when opens_on <= logical clock < closes_on)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: TALLYED
        trigger: "system (run-epoch when logical clock >= closes_on)"
        actor: system
        preconditions: []
        side_effects:
          - "compute vote_tally; set outcome, tallied_at"
          - "apply outcome to the subject Color (see Color machine)"
      - from: SCHEDULED
        to: TALLYED
        trigger: "system (run-epoch when logical clock >= closes_on and the campaign never opened)"
        actor: system
        preconditions: []
        side_effects:
          - "compute vote_tally over zero ballots (turnout 0 -> outcome FAILED); set tallied_at"
          - "apply outcome to the subject Color"
        note: "a campaign whose window is jumped entirely still tallies (and fails on quorum)"

  - entity: SafetyTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /crayon-works/safety-tests/{id}/record-result {outcome: PASS}"
        actor: LabTechnician
        preconditions: []
        side_effects:
          - "result_notes := payload result_notes; recorded_by_user_id := X-User-ID"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /crayon-works/safety-tests/{id}/record-result {outcome: FAIL}"
        actor: LabTechnician
        preconditions: []
        side_effects:
          - "result_notes := payload result_notes; recorded_by_user_id := X-User-ID"
          - "blocks formula approval until a later SafetyTest for the same formula is PASSED"

  - entity: ProductionRun
    initial_state: PLANNED
    terminal_states: [CANCELLED, QUARANTINED]
    transitions:
      - from: PLANNED
        to: MOLDING
        trigger: "POST /crayon-works/production-runs/{id}/transition {action: ADVANCE}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: MOLDING
        to: LABELING
        trigger: "transition {action: ADVANCE}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: LABELING
        to: PACKING
        trigger: "transition {action: ADVANCE}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: PACKING
        to: COMPLETED
        trigger: "transition {action: ADVANCE} with packed_counts"
        actor: PlatformAdmin
        preconditions:
          - "packed_counts is present and covers exactly the spec entry colors (else ERR_INVALID_REQUEST)"
          - "packing_variance_units <= 5 (TOLERANCE_UNITS); on variance > 5 the run goes ON_HOLD instead"
        side_effects:
          - "compute packing_penalty (variance, penalty, boxes_produced, waste_units)"
          - "create InventoryLot AVAILABLE with boxes_received = boxes_produced, boxes_on_hand = boxes_produced"
          - "recompute AssortmentSpec.boxes_available"
      - from: PACKING
        to: ON_HOLD
        trigger: "transition {action: ADVANCE} whose packing_variance_units > 5"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "stage_before_hold := PACKING; hold_reason := QUALITY; packing_penalty_cents recorded; no lot created"
        note: "automatic quality hold — the packing-accuracy gate diverges from the happy path here"
      - from: MOLDING
        to: ON_HOLD
        trigger: "transition {action: HOLD}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["stage_before_hold := MOLDING; hold_reason := QUALITY"]
      - from: LABELING
        to: ON_HOLD
        trigger: "transition {action: HOLD}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["stage_before_hold := LABELING; hold_reason := QUALITY"]
      - from: PACKING
        to: ON_HOLD
        trigger: "transition {action: HOLD}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["stage_before_hold := PACKING; hold_reason := QUALITY"]
      - from: ON_HOLD
        to: MOLDING
        trigger: "transition {action: RESUME} when stage_before_hold = MOLDING"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["stage_before_hold := null; hold_reason := null"]
        note: "hold-resume cycle"
      - from: ON_HOLD
        to: LABELING
        trigger: "transition {action: RESUME} when stage_before_hold = LABELING"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["stage_before_hold := null; hold_reason := null"]
      - from: ON_HOLD
        to: PACKING
        trigger: "transition {action: RESUME} when stage_before_hold = PACKING"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["stage_before_hold := null; hold_reason := null"]
      - from: PLANNED
        to: CANCELLED
        trigger: "transition {action: CANCEL}"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "recompute provisional waterfall for the spec (projected pool shrinks)"
      - from: MOLDING
        to: CANCELLED
        trigger: "transition {action: CANCEL}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["recompute provisional waterfall for the spec"]
      - from: LABELING
        to: CANCELLED
        trigger: "transition {action: CANCEL}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["recompute provisional waterfall for the spec"]
      - from: PACKING
        to: CANCELLED
        trigger: "transition {action: CANCEL}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["recompute provisional waterfall for the spec"]
      - from: ON_HOLD
        to: CANCELLED
        trigger: "transition {action: CANCEL}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["recompute provisional waterfall for the spec"]
      - from: PLANNED
        to: CANCELLED
        trigger: "system (recall cascade — the run consumes a retro-rejected batch; or retirement cascade — the run packs a newly DEPRECATED spec)"
        actor: system
        preconditions: []
        side_effects: ["affected_run_count on the RecallCase increments when recall-caused"]
      - from: MOLDING
        to: QUARANTINED
        trigger: "system (recall cascade — the run consumes a retro-rejected batch)"
        actor: system
        preconditions: []
        side_effects: ["cascade link 3 begins: see InventoryLot / RetailAllocation effects under RecallCase"]
      - from: LABELING
        to: QUARANTINED
        trigger: "system (recall cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PACKING
        to: QUARANTINED
        trigger: "system (recall cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_HOLD
        to: QUARANTINED
        trigger: "system (recall cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPLETED
        to: QUARANTINED
        trigger: "system (recall cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "cascade link 3: its InventoryLots become QUARANTINED (boxes_committed stays frozen on the quarantined lot)"
          - "cascade link 4: COMMITTED allocations of the spec are SHORTED newest-first (created_at DESC, request_seq DESC) until committed demand fits AVAILABLE lots again"
        note: "COMPLETED is not terminal — recall quarantine is the only exit"

  - entity: InventoryLot
    initial_state: AVAILABLE
    terminal_states: [QUARANTINED]
    transitions:
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system (automatic when boxes_on_hand reaches 0 after a COMMIT or FULFILL deduction)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPLETED
        to: AVAILABLE
        trigger: "system (automatic when a RELEASE returns boxes and boxes_on_hand becomes > 0)"
        actor: system
        preconditions: []
        side_effects: []
        note: "availability cycle driven by allocation activity"
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "system (recall cascade — the producing run is quarantined)"
        actor: system
        preconditions: []
        side_effects:
          - "lot fields freeze as-is; boxes_committed remains inside the quarantined lot"
          - "recompute AssortmentSpec.boxes_available (quarantined lots are excluded)"
      - from: DEPLETED
        to: QUARANTINED
        trigger: "system (recall cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RetailAllocation
    initial_state: REQUESTED
    terminal_states: [FULFILLED, RELEASED, EXPIRED, SHORTED]
    transitions:
      - from: REQUESTED
        to: COMMITTED
        trigger: "POST /crayon-works/retail-allocations/{id}/decision {action: COMMIT}"
        actor: AllocationPlanner
        preconditions:
          - "allocated_boxes_final = min(requested_boxes, spec.boxes_available) must be > 0 (else ERR_INSUFFICIENT_INVENTORY)"
        side_effects:
          - "deduct allocated_boxes_final from the spec's AVAILABLE lots in created_at ASC order (boxes_on_hand -> boxes_committed); lots reaching 0 on-hand become DEPLETED"
          - "recompute spec.boxes_available and boxes_reserved"
      - from: COMMITTED
        to: FULFILLED
        trigger: "decision {action: FULFILL}"
        actor: AllocationPlanner
        preconditions: []
        side_effects:
          - "move allocated_boxes_final from boxes_committed to boxes_shipped on the spec's lots in created_at ASC order"
          - "recompute spec.boxes_reserved"
      - from: REQUESTED
        to: RELEASED
        trigger: "decision {action: RELEASE}"
        actor: AllocationPlanner
        preconditions: []
        side_effects:
          - "provisional reservation drops; recompute boxes_reserved and re-run the provisional waterfall for remaining REQUESTED allocations of the spec"
      - from: COMMITTED
        to: RELEASED
        trigger: "decision {action: RELEASE}"
        actor: AllocationPlanner
        preconditions: []
        side_effects:
          - "return allocated_boxes_final to lots in created_at ASC order: each lot regains min(remaining, lot.boxes_committed) from committed back to on_hand; DEPLETED lots with on_hand > 0 become AVAILABLE"
          - "recompute boxes_available/boxes_reserved and re-run the provisional waterfall"
        note: "compensating action for COMMIT — the lot mass-balance invariant must hold exactly afterwards"
      - from: REQUESTED
        to: EXPIRED
        trigger: "system (run-epoch when requested_ship_date < logical clock)"
        actor: system
        preconditions: []
        side_effects: ["provisional reservation drops; provisional waterfall recomputed"]
      - from: COMMITTED
        to: SHORTED
        trigger: "system (recall cascade — quarantined lots force committed demand above AVAILABLE supply)"
        actor: system
        preconditions: []
        side_effects:
          - "committed boxes stay frozen inside the quarantined lots; allocation no longer claims them"
          - "recompute boxes_reserved"

  - entity: LicensedLine
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: LICENSOR_REVIEW
        trigger: "POST /crayon-works/licensed-lines/{id}/transition {action: SUBMIT}"
        actor: BrandManager
        preconditions:
          - "expected_formula_version matches current Formula.version (OCC, ERR_STALE_VERSION)"
        side_effects: ["submitted_by_user_id := X-User-ID"]
      - from: LICENSOR_REVIEW
        to: BRAND_REVIEW
        trigger: "transition {action: LICENSOR_APPROVE}"
        actor: Licensor
        preconditions:
          - "X-User-ID == licensor_user_id (else ERR_UNAUTHORIZED)"
          - "expected_formula_version matches (OCC)"
        side_effects: []
      - from: LICENSOR_REVIEW
        to: DRAFT
        trigger: "transition {action: LICENSOR_REQUEST_REVISION}"
        actor: Licensor
        preconditions: ["X-User-ID == licensor_user_id"]
        side_effects: []
        note: "licensor-side revision loop"
      - from: LICENSOR_REVIEW
        to: REJECTED
        trigger: "transition {action: LICENSOR_REJECT}"
        actor: Licensor
        preconditions: ["X-User-ID == licensor_user_id"]
        side_effects: []
      - from: BRAND_REVIEW
        to: APPROVED
        trigger: "transition {action: BRAND_APPROVE}"
        actor: BrandManager
        preconditions:
          - "X-User-ID != submitted_by_user_id (segregation of duties, ERR_SOD_VIOLATION)"
          - "expected_formula_version matches current Formula.version (OCC, ERR_STALE_VERSION)"
        side_effects:
          - "Formula.licensed_use_count += 1, which increments Formula.version by 1"
          - "pinned_formula_version := the resulting Formula.version (version-pinning on approval)"
      - from: BRAND_REVIEW
        to: LICENSOR_REVIEW
        trigger: "transition {action: BRAND_REQUEST_REVISION}"
        actor: BrandManager
        preconditions: []
        side_effects: []
        note: "brand-side revision loop — the two review states form a negotiation cycle"
      - from: BRAND_REVIEW
        to: REJECTED
        trigger: "transition {action: BRAND_REJECT}"
        actor: BrandManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "system (cascade — the pinned formula was SUPERSEDED, or a recall quarantined a run whose spec contains the formula's color)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: APPROVED
        trigger: "transition {action: REINSTATE}"
        actor: BrandManager
        preconditions:
          - "no OPEN or CONTAINED RecallCase touches the line's formula color"
          - "line.formula.status == APPROVED and pinned_formula_version == current Formula.version (else ERR_STALE_PIN)"
        side_effects: []

  - entity: AttractionSession
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: CLOSED
        trigger: "system (run-epoch when logical clock >= session_date + start_minute + duration_minutes)"
        actor: system
        preconditions: []
        side_effects:
          - "CONFIRMED tickets of the session become NO_SHOW"
          - "WAITLISTED tickets of the session become CANCELLED"
          - "booked_units recomputes to 0"

  - entity: Ticket
    initial_state: CONFIRMED
    terminal_states: [CHECKED_IN, REFUNDED, CANCELLED, NO_SHOW]
    transitions:
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /crayon-works/tickets/{id}/decision {action: CHECK_IN}"
        actor: BoxOffice
        preconditions:
          - "session.status == SCHEDULED (else ERR_SESSION_CLOSED)"
          - "logical clock is within [session start, session end] on the session date (else ERR_TICKET_STATE)"
        side_effects:
          - "checked_in_at := logical clock"
      - from: CONFIRMED
        to: REFUNDED
        trigger: "decision {action: REFUND}"
        actor: BoxOffice
        preconditions:
          - "logical clock < session start (refund window; else ERR_TICKET_STATE)"
        side_effects:
          - "session.booked_units -= ticket.units"
          - "promotion cascade: walk the session's WAITLISTED tickets in (created_at ASC, waitlist_seq ASC) order; promote the head while head.units fits the freed capacity (strict head-of-line blocking — a head that does not fit stops the walk, no skipping); each promoted ticket computes price_cents at the current booked ratio"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "decision {action: CANCEL}"
        actor: BoxOffice
        preconditions: []
        side_effects: []
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system (promotion cascade after capacity frees)"
        actor: system
        preconditions: []
        side_effects:
          - "session.booked_units += ticket.units; price_cents computed per ticket_dynamic_price at promotion time"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (run-epoch closing the session)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WAITLISTED
        to: CANCELLED
        trigger: "system (run-epoch closing the session)"
        actor: system
        preconditions: []
        side_effects: []
    note: "initial state is CONFIRMED for INDIVIDUAL and for GROUP bookings that fit; a GROUP booking that does not fit is created directly in WAITLISTED"

  - entity: RecallCase
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CONTAINED
        trigger: "system (run-epoch verifies the cascade has been applied to all affected runs, lots, allocations and licensed lines)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONTAINED
        to: CLOSED
        trigger: "system (run-epoch when logical clock >= cooling_until)"
        actor: system
        preconditions: []
        side_effects:
          - "SUSPENDED licensed lines whose suspension traces to this case become REINSTATE-able"
    note: "compound/auto machine — the case is created OPEN by the batch retro-rejection cascade; its severity and cooling window derive from affected_units and hazard_class"

# =============================================================================
# Concurrency Rules (section 1.2.1 — true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: allocation-create-stale-spec
    parent_entity: AssortmentSpec
    write_endpoint: "POST /crayon-works/retail-allocations"
    occ_field: expected_assortment_spec_version
    description: |
      Creating a RetailAllocation against an AssortmentSpec whose version has
      advanced since the client last observed it is rejected. The provisional
      waterfall share is computed from the spec's pool; a client holding a stale
      view of the pool must re-read the spec before its request can be priced
      honestly. On success the allocation bumps spec.boxes_reserved and therefore
      AssortmentSpec.version, so the next stale writer is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: licensed-line-decision-stale-formula
    parent_entity: Formula
    write_endpoint: "POST /crayon-works/licensed-lines/{id}/transition"
    occ_field: expected_formula_version
    description: |
      Every LicensedLine transition carries the Formula.version the client last
      observed. If the formula has advanced — e.g. another line's BRAND_APPROVE
      incremented licensed_use_count — the decision is rejected so that approval
      pins are never taken against a stale view of the formula. A successful
      BRAND_APPROVE increments Formula.version, so the next stale writer fails.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: vote_tally
    trigger: "run-epoch when a VoteCampaign reaches closes_on"
    algorithm: weighted_scoring
    formula: |
      weights W(segment, kind):
        INTRODUCTION: KIDS 1.0, PARENTS 1.5, EDUCATORS 2.0, COLLECTORS 1.2
        RETIREMENT:   KIDS 1.0, PARENTS 1.0, EDUCATORS 1.5, COLLECTORS 2.5
      ratio = votes_yes_weighted / votes_total_weighted  (0 votes -> ratio := 0)
      outcome = PASSED iff turnout_count >= MIN_TURNOUT AND ratio >= THRESHOLD(kind)
      The threshold comparison is inclusive (ratio exactly at THRESHOLD passes).
      Applied effect: INTRODUCTION PASSED -> Color IN_VOTE -> ACTIVE; FAILED -> PROPOSED
                      RETIREMENT  PASSED -> Color RETIRE_VOTE -> RETIRED; FAILED -> ACTIVE
    input_set: "all ballots recorded against the campaign while it was OPEN"
    constants:
      MIN_TURNOUT: 10
      INTRO_THRESHOLD: 0.55
      RETIRE_THRESHOLD: 0.60
    precision: "ratio computed in exact decimal arithmetic; the boundary comparison uses the exact ratio"
    variants:
      - name: INTRODUCTION
        when: "kind=INTRODUCTION"
        difference: "weights KIDS 1.0 / PARENTS 1.5 / EDUCATORS 2.0 / COLLECTORS 1.2; threshold 0.55"
      - name: RETIREMENT
        when: "kind=RETIREMENT"
        difference: "weights KIDS 1.0 / PARENTS 1.0 / EDUCATORS 1.5 / COLLECTORS 2.5; threshold 0.60 — identical ballots can PASS an introduction yet FAIL a retirement"

  - name: retail_allocation_waterfall
    trigger: "PROVISIONAL: on allocation create/release/expire and on any pool change (run completion, run cancel, lot quarantine); FINAL: once, at decision COMMIT"
    algorithm: waterfall_allocation
    formula: |
      Rank every REQUESTED allocation of the spec by (priority_tier: PLATINUM first,
      then GOLD, then STANDARD), then created_at ASC, then request_seq ASC.
      PROVISIONAL walk:
        pool = spec.boxes_available + projected_boxes
        projected_boxes = sum(planned_boxes of runs of this spec whose stage is in
          {PLANNED, MOLDING, LABELING, PACKING, ON_HOLD} and
          planned_end_date <= 2027-08-31T23:59:59Z and planned_end_date >= logical clock)
        each REQUESTED allocation in rank order: provisional = min(requested_boxes, pool); pool -= provisional
      FINAL (at COMMIT of allocation A):
        allocated_boxes_final = min(A.requested_boxes, spec.boxes_available)
        physical deduction: walk the spec's AVAILABLE/DEPLETED lots in (created_at ASC,
          lot_seq ASC), moving boxes from boxes_on_hand to boxes_committed until the
          final amount is covered
      RELEASE of a COMMITTED allocation walks lots in (created_at ASC, lot_seq ASC) moving
        min(remaining, lot.boxes_committed) back from committed to on_hand.
      Unfilled request remainder stays unallocated (no over-commit, no negative pool).
    input_set: "REQUESTED allocations of the spec for the provisional walk; lots and in-season runs of the spec for the pool"
    constants:
      SEASON_START: "2027-06-01T00:00:00Z"
      SEASON_END: "2027-08-31T23:59:59Z"
    precision: "integer boxes; no rounding"
    variants:
      - name: PROVISIONAL
        when: "allocation creation and every pool change"
        difference: "pool includes projected in-season planned production; recomputed for all REQUESTED allocations of the spec"
      - name: FINAL
        when: "decision COMMIT"
        difference: "pool is physical boxes_available only — projections excluded; frozen on the allocation once computed"

  - name: ticket_dynamic_price
    trigger: "ticket confirmation (creation for INDIVIDUAL and for fitting GROUP; promotion for WAITLISTED)"
    algorithm: tiered_pricing
    formula: |
      ratio = session.booked_units / session.capacity_units   (BEFORE this booking)
      capacity_mult = 0.9  if ratio < 0.5
                    = 1.0  if 0.5 <= ratio < 0.8
                    = 1.25 if ratio >= 0.8
      group_mult = 0.75 if kind=GROUP and units >= 50
                 = 0.85 if kind=GROUP and units >= 20
                 = 1.0  otherwise
      day_mult = 1.15 if session_date falls on Saturday or Sunday; else 1.0
      unit_price_cents = round_half_up(base_price_cents * capacity_mult * group_mult * day_mult)
      price_cents = unit_price_cents * units
    input_set: "the session and the ticket being confirmed"
    constants:
      LOW_TIER_CEIL: 0.5
      HIGH_TIER_FLOOR: 0.8
      LOW_MULT: 0.9
      HIGH_MULT: 1.25
      GROUP20_MULT: 0.85
      GROUP50_MULT: 0.75
      WEEKEND_MULT: 1.15
      CHARTER_GROUP_MULT: 0.80
    precision: "integer cents; round_half_up applied once to the unit price, then multiplied by units"
    variants:
      - name: STANDARD
        when: "session.is_charter = false"
        difference: "full formula as written"
      - name: CHARTER
        when: "session.is_charter = true"
        difference: "capacity_mult := 1.0 and group_mult := 0.80 for GROUP (flat school buyout rate); day_mult still applies"

  - name: packing_penalty
    trigger: "ProductionRun ADVANCE from PACKING with packed_counts"
    algorithm: aggregation
    formula: |
      For each spec entry e, evaluated in the entries array order:
        expected_e = e.count * planned_boxes
        variance_e = abs(packed_e - expected_e)
        line_penalty_e = round_half_up(variance_e * UNDER_UNIT_PENALTY_CENTS * (OVER_FACTOR if packed_e > expected_e else 1.0))
      packing_variance_units = sum(variance_e)
      packing_penalty_cents = sum(line_penalty_e)
      PINNED ROUNDING ORDER: round each line to integer cents FIRST, then sum.
        (Summing raw line amounts and rounding once is explicitly NOT the rule;
        the two orders diverge, e.g. two 2-unit under-lines: 38 + 38 = 76 vs round(75.0) = 75.)
      If packing_variance_units > TOLERANCE_UNITS: the run goes ON_HOLD (QUALITY), the
        penalty is recorded, and no lot is created. Otherwise the run COMPLETES and the
        penalty is recorded against it.
    input_set: "the spec entries and the packed_counts of this advance"
    constants:
      UNDER_UNIT_PENALTY_CENTS: 18.75
      OVER_FACTOR: 1.5
      TOLERANCE_UNITS: 5
    precision: "round_half_up to integer cents per line, then integer sum"

  - name: licensed_royalty
    trigger: "recomputed on every read of LicensedLine, and after any allocation or production-run mutation touching the line's formula color"
    algorithm: constraint_propagation
    formula: |
      Let C = the color of the line's pinned formula (line.formula_id -> Formula.color_id).
      Let S = the set of AssortmentSpecs whose entries contain C.
      PINNED EVALUATION ORDER (the steps are interdependent; this order is the only
      well-defined one — never subtract penalties before gross is established, and
      gross is lifetime-committed, not currently-committed):
        (1) gross_cents   = sum over RetailAllocations a of specs in S with
                            a.status in {COMMITTED, FULFILLED, RELEASED, SHORTED}
                            of a.allocated_boxes_final * a.spec.wholesale_price_cents
        (2) returns_cents = sum over those allocations with status in {RELEASED, SHORTED}
                            of a.allocated_boxes_final * a.spec.wholesale_price_cents
        (3) penalties_cents = sum over ProductionRuns r of specs in S of r.packing_penalty_cents
        (4) base = gross_cents                                    (variant GROSS)
            base = max(0, gross_cents - returns_cents - penalties_cents)   (variant NET)
        (5) projected_royalty_cents = round_half_up(royalty_rate * base)
    input_set: "allocations and production runs of every spec containing the formula's color"
    constants: {}
    precision: "integer cents, round_half_up at step (5) only"
    variants:
      - name: GROSS_BASE
        when: "royalty_base = GROSS"
        difference: "base = gross_cents (returns and penalties ignored)"
      - name: NET_BASE
        when: "royalty_base = NET"
        difference: "base = gross - returns - penalties, floored at 0 — diverges from GROSS whenever returns or penalties are nonzero"

  - name: recall_severity_classification
    trigger: "RecallCase creation (retro-rejection cascade)"
    algorithm: threshold
    formula: |
      base class by affected_units:
        affected_units < 1000              -> CLASS_III
        1000 <= affected_units < 10000     -> CLASS_II    (boundary 1000 is IN class II)
        affected_units >= 10000            -> CLASS_I
      hazard bump: batch hazard_class RESTRICTED -> bump one class up (III->II, II->I, I stays I)
                   batch hazard_class SENSITIVE  -> bump only from III to II
                   STANDARD -> no bump
      cooling days: CLASS_III -> 7, CLASS_II -> 14, CLASS_I -> 30
      cooling_until = case.created_at + cooling days
    input_set: "the RecallCase affected_units and the batch hazard_class"
    constants:
      CLASS_II_FLOOR: 1000
      CLASS_I_FLOOR: 10000
      COOLING_III_DAYS: 7
      COOLING_II_DAYS: 14
      COOLING_I_DAYS: 30
    precision: "integer units; inclusive lower bounds"

  - name: session_booked_units
    trigger: "ticket confirmation, promotion, refund, cancel, no-show; session read"
    algorithm: aggregation
    formula: |
      booked_units = sum(t.units for tickets t of the session with t.status in {CONFIRMED, CHECKED_IN})
      INVARIANT: the stored booked_units always equals that sum (immediate consistency);
      a refund plus a same-size booking leaves booked_units unchanged.
    input_set: "tickets of the session in CONFIRMED or CHECKED_IN status"
    constants: {}
    precision: "integer units"

  - name: run_production_mass_balance
    trigger: "PACKING-to-COMPLETED evaluation"
    algorithm: aggregation
    formula: |
      boxes_produced = min over spec entries e of floor(packed_e / e.count)
      waste_units    = sum(packed_e) - boxes_produced * box_size
      INVARIANT (mass balance): sum(packed_e) == boxes_produced * box_size + waste_units
    input_set: "the run's packed_counts and its spec entries"
    constants: {}
    precision: "integer units and boxes"

  - name: spec_boxes_reconciliation
    trigger: "run completion, lot quarantine, allocation commit/fulfil/release/expire; spec read"
    algorithm: aggregation
    formula: |
      boxes_available = sum(lot.boxes_on_hand over lots of runs created with this spec
                            whose lot status is AVAILABLE or DEPLETED)
      boxes_reserved  = sum(a.allocated_boxes_provisional over REQUESTED allocations of the spec)
                        + sum(a.allocated_boxes_final over COMMITTED allocations of the spec)
      INVARIANT: boxes_available == the lot-level sum; every commit/release recomputes both sides
      in the same request (immediate consistency, no drift).
    input_set: "lots and allocations of the spec"
    constants: {}
    precision: "integer boxes"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority — lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and the role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "the presented role is allowed on this endpoint per the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "request body shape: required fields present, types and enum memberships valid, conditional fields honored (group_size/school_name iff kind=GROUP; partner_name iff kind=CLASSROOM); undeclared extra fields are IGNORED (never echoed, never stored)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"
  - priority: 4
    category: existence
    check: "path ids exist; then body foreign keys exist, checked in the endpoint's declared input order left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 5
    category: concurrency
    check: "expected_assortment_spec_version matches current AssortmentSpec.version / expected_formula_version matches current Formula.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /crayon-works/retail-allocations, POST /crayon-works/licensed-lines/{id}/transition"
  - priority: 6
    category: state
    check: "the target resource is in a state that permits the transition: formula state (ERR_INVALID_FORMULA_STATE), batch terminal (ERR_BATCH_TERMINAL), run stage (ERR_RUN_STAGE_INVALID, ERR_RUN_ON_HOLD), ticket state (ERR_TICKET_STATE), allocation state (ERR_ALLOCATION_STATE), line state (ERR_LICENSE_STATE), color state for campaign creation (ERR_COLOR_NOT_ACTIVE), campaign OPEN for votes (ERR_CAMPAIGN_NOT_OPEN)"
    error_id: "ERR_INVALID_FORMULA_STATE | ERR_BATCH_TERMINAL | ERR_RUN_STAGE_INVALID | ERR_RUN_ON_HOLD | ERR_TICKET_STATE | ERR_ALLOCATION_STATE | ERR_LICENSE_STATE | ERR_COLOR_NOT_ACTIVE | ERR_CAMPAIGN_NOT_OPEN"
    http_status: 409
    applies_to: "transition, decision, vote and campaign-creation endpoints"
  - priority: 7
    category: business_safety
    check: "segregation of duties (actor != creator/submitter — ERR_SOD_VIOLATION); recall gating (batch with an OPEN/CONTAINED recall — ERR_RECALL_ACTIVE); certification-mark rule for non-STANDARD hazard (ERR_CERTIFICATION_MARK_REQUIRED)"
    error_id: "ERR_SOD_VIOLATION | ERR_RECALL_ACTIVE | ERR_CERTIFICATION_MARK_REQUIRED"
    http_status: "403 | 409"
    applies_to: "certification-decision, formula transition, line transition, production-run creation"
  - priority: 8
    category: business_temporal
    check: "date ordering and windows: closes_on strictly after opens_on (ERR_DATE_ORDER); session_date not in the past and run end after start (ERR_DATE_ORDER); planned_start_date >= clock + 60 days (ERR_PLANNED_START_TOO_SOON); requested_ship_date inside season window (ERR_SEASON_WINDOW); run dates contained in licensed term (ERR_LICENSE_TERM_WINDOW)"
    error_id: "ERR_DATE_ORDER | ERR_PLANNED_START_TOO_SOON | ERR_SEASON_WINDOW | ERR_LICENSE_TERM_WINDOW"
    http_status: "422"
    applies_to: "campaign creation, session creation, run creation, allocation creation"
  - priority: 9
    category: business_constraint
    check: "capacity and structural constraints: session capacity (ERR_SESSION_FULL); group size bounds (ERR_GROUP_TOO_LARGE); per-color campaign window overlap on closed intervals (ERR_CAMPAIGN_WINDOW_CONFLICT); venue session overlap with buffer (ERR_SESSION_WINDOW_CONFLICT); spec structural validity incl. box_size set and classroom core-color coverage (ERR_SPEC_INVALID); vote payload validity (ERR_VOTE_INVALID)"
    error_id: "ERR_SESSION_FULL | ERR_GROUP_TOO_LARGE | ERR_CAMPAIGN_WINDOW_CONFLICT | ERR_SESSION_WINDOW_CONFLICT | ERR_SPEC_INVALID | ERR_VOTE_INVALID"
    http_status: "409 | 422"
    applies_to: "ticket creation, campaign creation, session creation, spec creation, votes"
  - priority: 10
    category: business_referential
    check: "linked-entity state, in this fixed intra-category order: formula approved for every spec entry color (ERR_FORMULA_NOT_APPROVABLE); batch certified (ERR_BATCH_NOT_CERTIFIED); spec ACTIVE — a retired entry color deprecates the spec, so DEPRECATED is the single gate for retired colors (ERR_SPEC_DEPRECATED); licensed spec backed by an APPROVED line (ERR_LICENSE_REQUIRED); session still SCHEDULED (ERR_SESSION_CLOSED); reinstate pin freshness (ERR_STALE_PIN)"
    error_id: "ERR_FORMULA_NOT_APPROVABLE | ERR_BATCH_NOT_CERTIFIED | ERR_SPEC_DEPRECATED | ERR_LICENSE_REQUIRED | ERR_SESSION_CLOSED | ERR_STALE_PIN"
    http_status: 409
    applies_to: "run creation, formula approval, ticket check-in, line reinstate"
  - priority: 11
    category: business_fiscal
    check: "commit computes a zero final allocation (no boxes available)"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /crayon-works/retail-allocations/{id}/decision"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Color ---
  - method: POST
    path: "/crayon-works/colors"
    description: "Create a Color (starts PROPOSED)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, hex_code, "is_core_curriculum?"]
    output: Color
    side_effects: ["status=PROPOSED", "version=1"]
  - method: GET
    path: "/crayon-works/colors/{id}"
    description: "Get a Color by id"
    roles: &roles_ops [PlatformAdmin, SourcingManager, QualityAssurance, Formulator, SafetyOfficer, LabTechnician, BrandManager, Licensor, AllocationPlanner, BoxOffice]
    code: 200
    input: []
    output: Color
    side_effects: []
  - method: POST
    path: "/crayon-works/colors/{id}/vote-campaigns"
    description: "Open a voting campaign for the color; flips PROPOSED->IN_VOTE (INTRODUCTION) or ACTIVE->RETIRE_VOTE (RETIREMENT). Campaign windows are closed intervals [opens_on, closes_on] and must not overlap any existing campaign of the same color."
    roles: [PlatformAdmin]
    code: 201
    input: [kind, opens_on, closes_on]
    output: VoteCampaign
    side_effects: ["VoteCampaign created SCHEDULED", "Color state flips into the voting posture"]
  - method: GET
    path: "/crayon-works/colors/{id}/vote-campaigns"
    description: "List vote campaigns of a color (reverse reachability for VoteCampaign.color_id); ordered by (created_at ASC, then creation sequence)"
    roles: *roles_ops
    code: 200
    input: ["kind?", "status?"]
    output: VoteCampaign[]
    side_effects: []
  - method: GET
    path: "/crayon-works/colors/{id}/formulas"
    description: "List formulas of a color (reverse reachability for Formula.color_id)"
    roles: *roles_ops
    code: 200
    input: ["status?"]
    output: Formula[]
    side_effects: []

  # --- PigmentBatch ---
  - method: POST
    path: "/crayon-works/pigment-batches"
    description: "Register a received pigment batch (starts QUARANTINE); records created_by_user_id from X-User-ID for segregation of duties"
    roles: [SourcingManager, QualityAssurance]
    code: 201
    input: [pigment_name, supplier_name, hazard_class, received_quantity_kg, certification_mark]
    output: PigmentBatch
    side_effects: ["status=QUARANTINE", "created_by_user_id := X-User-ID"]
  - method: GET
    path: "/crayon-works/pigment-batches/{id}"
    description: "Get a PigmentBatch by id"
    roles: *roles_ops
    code: 200
    input: []
    output: PigmentBatch
    side_effects: []
  - method: POST
    path: "/crayon-works/pigment-batches/{id}/certification-decision"
    description: "Certify or reject a batch. QUARANTINE->CERTIFIED or ->REJECTED; a REJECT on a CERTIFIED batch retro-rejects it and opens the recall cascade. Segregation of duties: the decider must not be the batch's creator."
    roles: [QualityAssurance]
    code: 200
    input: [decision, "reason?"]
    output: PigmentBatch
    side_effects:
      - "CERTIFY: status CERTIFIED, certified_by_user_id := X-User-ID"
      - "REJECT from CERTIFIED with consuming runs: create RecallCase OPEN + recall cascade (runs quarantined/cancelled, lots quarantined, allocations shorted, licensed lines suspended)"
  - method: GET
    path: "/crayon-works/pigment-batches/{id}/recall-cases"
    description: "List recall cases of a batch (reverse reachability for RecallCase.pigment_batch_id)"
    roles: *roles_ops
    code: 200
    input: ["status?"]
    output: RecallCase[]
    side_effects: []

  # --- AssortmentSpec ---
  - method: POST
    path: "/crayon-works/assortment-specs"
    description: "Create an assortment packing spec; box_size computed as sum of entry counts and must be one of 8/16/24/64; entries must reference ACTIVE colors; CLASSROOM requires partner_name and coverage of every ACTIVE core-curriculum color"
    roles: [PlatformAdmin]
    code: 201
    input: [name, kind, entries, wholesale_price_cents, "partner_name?"]
    output: AssortmentSpec
    side_effects: ["box_size computed", "status ACTIVE", "boxes_available=0, boxes_reserved=0"]
  - method: GET
    path: "/crayon-works/assortment-specs/{id}"
    description: "Get an AssortmentSpec by id (recomputed boxes_available/boxes_reserved/status)"
    roles: *roles_ops
    code: 200
    input: []
    output: AssortmentSpec
    side_effects: []
  - method: GET
    path: "/crayon-works/assortment-specs/{id}/retail-allocations"
    description: "List allocations of a spec (reverse reachability for RetailAllocation.assortment_spec_id)"
    roles: [PlatformAdmin, AllocationPlanner]
    code: 200
    input: ["status?", "priority_tier?"]
    output: RetailAllocation[]
    side_effects: []

  # --- Formula ---
  - method: POST
    path: "/crayon-works/formulas"
    description: "Create a Formula (starts DRAFT)"
    roles: [Formulator, SafetyOfficer]
    code: 201
    input: [color_id, intended_use, pigment_recipe]
    output: Formula
    side_effects: ["status=DRAFT", "licensed_use_count=0"]
  - method: GET
    path: "/crayon-works/formulas/{id}"
    description: "Get a Formula by id"
    roles: *roles_ops
    code: 200
    input: []
    output: Formula
    side_effects: []
  - method: POST
    path: "/crayon-works/formulas/{id}/transition"
    description: "Drive the formula lifecycle. SUBMIT (Formulator or SafetyOfficer): DRAFT or REVISION_REQUESTED -> SUBMITTED and spawns a SCHEDULED SafetyTest. APPROVE / REJECT / REQUEST_REVISION (SafetyOfficer only, and never the submitter): resolve a SUBMITTED formula; APPROVE requires the latest safety test PASSED and supersedes any other APPROVED formula of the same color, suspending licensed lines pinned to it."
    roles: [Formulator, SafetyOfficer]
    code: 200
    input: [action, "reason?"]
    output: Formula
    side_effects:
      - "SUBMIT: submitted_by_user_id := X-User-ID; create SafetyTest SCHEDULED"
      - "APPROVE: approved_by_user_id := X-User-ID; other APPROVED formulas of the color -> SUPERSEDED; their APPROVED licensed lines -> SUSPENDED"
  - method: GET
    path: "/crayon-works/formulas/{id}/safety-tests"
    description: "List safety tests of a formula (reverse reachability for SafetyTest.formula_id); ordered by (created_at ASC, test_seq ASC)"
    roles: *roles_ops
    code: 200
    input: ["status?"]
    output: SafetyTest[]
    side_effects: []
  - method: GET
    path: "/crayon-works/formulas/{id}/licensed-lines"
    description: "List licensed lines of a formula (reverse reachability for LicensedLine.formula_id)"
    roles: *roles_ops
    code: 200
    input: ["status?"]
    output: LicensedLine[]
    side_effects: []

  # --- ProductionRun ---
  - method: POST
    path: "/crayon-works/production-runs"
    description: "Plan a production run. Requires: every entry color of the spec covered by an APPROVED formula; the pigment batch CERTIFIED with no OPEN/CONTAINED recall; the spec ACTIVE (a retired entry color makes the spec DEPRECATED, which is the gate); for LICENSED specs an APPROVED licensed line covering one of the spec's colors with the planned dates contained in its term; planned_start_date >= clock + 60 days."
    roles: [PlatformAdmin]
    code: 201
    input: [assortment_spec_id, pigment_batch_id, planned_boxes, planned_start_date, planned_end_date]
    output: ProductionRun
    side_effects: ["stage=PLANNED"]
  - method: GET
    path: "/crayon-works/production-runs/{id}"
    description: "Get a ProductionRun by id"
    roles: *roles_ops
    code: 200
    input: []
    output: ProductionRun
    side_effects: []
  - method: GET
    path: "/crayon-works/production-runs"
    description: "List production runs with filters (reverse reachability for ProductionRun.assortment_spec_id and ProductionRun.pigment_batch_id); ordered by (created_at ASC, run_seq ASC)"
    roles: *roles_ops
    code: 200
    input: ["assortment_spec_id?", "pigment_batch_id?", "stage?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []
  - method: POST
    path: "/crayon-works/production-runs/{id}/transition"
    description: "Drive the run lifecycle. ADVANCE walks PLANNED->MOLDING->LABELING->PACKING->COMPLETED; the PACKING advance requires packed_counts and evaluates packing_penalty (variance > 5 sends the run ON_HOLD instead of completing). HOLD parks MOLDING/LABELING/PACKING; RESUME returns to the pre-hold stage; CANCEL terminates any non-terminal, non-completed stage."
    roles: [PlatformAdmin]
    code: 200
    input: [action, "packed_counts?"]
    output: ProductionRun
    side_effects:
      - "ADVANCE PACKING->COMPLETED: compute penalty/variance/boxes_produced/waste; create InventoryLot AVAILABLE; recompute spec.boxes_available"
      - "CANCEL from a projected stage: recompute provisional waterfall for the spec"
  - method: GET
    path: "/crayon-works/production-runs/{id}/inventory-lots"
    description: "List inventory lots of a run (reverse reachability for InventoryLot.production_run_id)"
    roles: *roles_ops
    code: 200
    input: ["status?"]
    output: InventoryLot[]
    side_effects: []

  # --- RetailAllocation ---
  - method: POST
    path: "/crayon-works/retail-allocations"
    description: "Request a seasonal retail allocation; computes the PROVISIONAL waterfall share immediately. OCC: expected_assortment_spec_version must match the spec's current version."
    roles: [AllocationPlanner]
    code: 201
    input: [assortment_spec_id, retailer_name, priority_tier, requested_boxes, requested_ship_date, expected_assortment_spec_version]
    output: RetailAllocation
    side_effects:
      - "status=REQUESTED; allocated_boxes_provisional computed (forward-looking pool)"
      - "spec.boxes_reserved increases and AssortmentSpec.version increments by 1"
  - method: GET
    path: "/crayon-works/retail-allocations/{id}"
    description: "Get a RetailAllocation by id"
    roles: [PlatformAdmin, AllocationPlanner]
    code: 200
    input: []
    output: RetailAllocation
    side_effects: []
  - method: POST
    path: "/crayon-works/retail-allocations/{id}/decision"
    description: "COMMIT (REQUESTED->COMMITTED; computes the FINAL share from physical on-hand only, deducts lots FIFO); FULFILL (COMMITTED->FULFILLED; committed boxes become shipped); RELEASE (REQUESTED or COMMITTED -> RELEASED; committed boxes are returned to lots FIFO)."
    roles: [AllocationPlanner]
    code: 200
    input: [action]
    output: RetailAllocation
    side_effects:
      - "COMMIT: lots deducted created_at ASC; DEPLETED flip at 0 on-hand; ERR_INSUFFICIENT_INVENTORY when final share is 0"
      - "RELEASE/FULFILL: lot counters restored or shipped; spec aggregates recomputed; provisional waterfall re-run for remaining REQUESTED allocations"

  # --- LicensedLine ---
  - method: POST
    path: "/crayon-works/licensed-lines"
    description: "Create a licensed/co-branded product line (starts DRAFT)"
    roles: [BrandManager]
    code: 201
    input: [name, licensor_user_id, formula_id, term_start, term_end, royalty_rate, royalty_base]
    output: LicensedLine
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/crayon-works/licensed-lines/{id}"
    description: "Get a LicensedLine by id (projected_royalty_cents recomputed on read)"
    roles: *roles_ops
    code: 200
    input: []
    output: LicensedLine
    side_effects: []
  - method: POST
    path: "/crayon-works/licensed-lines/{id}/transition"
    description: "Drive the two-party approval workflow. SUBMIT (BrandManager): DRAFT -> LICENSOR_REVIEW. LICENSOR_APPROVE / LICENSOR_REJECT / LICENSOR_REQUEST_REVISION (Licensor whose X-User-ID equals licensor_user_id). BRAND_APPROVE / BRAND_REJECT / BRAND_REQUEST_REVISION (BrandManager; BRAND_APPROVE never by the submitter and pins the current formula version). REINSTATE (BrandManager): SUSPENDED -> APPROVED once recalls are closed and the pin is current. OCC: every call carries expected_formula_version and the formula's version must not have advanced."
    roles: [BrandManager, Licensor]
    code: 200
    input: [action, expected_formula_version]
    output: LicensedLine
    side_effects:
      - "BRAND_APPROVE: Formula.licensed_use_count += 1 and Formula.version increments by 1; pinned_formula_version := the resulting Formula.version"
      - "SUBMIT: submitted_by_user_id := X-User-ID"

  # --- AttractionSession ---
  - method: POST
    path: "/crayon-works/attraction-sessions"
    description: "Schedule an experience-attraction session. Same-venue same-date sessions occupy half-open intervals [start_minute, start_minute + duration_minutes + 30) and must not intersect an existing SCHEDULED session's interval; a gap of exactly 30 minutes is allowed."
    roles: [PlatformAdmin]
    code: 201
    input: [venue_name, session_date, start_minute, duration_minutes, capacity_units, base_price_cents, "is_charter?"]
    output: AttractionSession
    side_effects: ["status=SCHEDULED", "booked_units=0"]
  - method: GET
    path: "/crayon-works/attraction-sessions/{id}"
    description: "Get an AttractionSession by id"
    roles: *roles_ops
    code: 200
    input: []
    output: AttractionSession
    side_effects: []
  - method: GET
    path: "/crayon-works/attraction-sessions/{id}/tickets"
    description: "List tickets of a session (reverse reachability for Ticket.session_id)"
    roles: [PlatformAdmin, BoxOffice]
    code: 200
    input: ["status?", "kind?"]
    output: Ticket[]
    side_effects: []

  # --- Ticket ---
  - method: POST
    path: "/crayon-works/tickets"
    description: "Book a ticket. INDIVIDUAL (units 1) is CONFIRMED if the session has capacity, else ERR_SESSION_FULL. GROUP (school group, 10-100 visitors) is CONFIRMED if it fits, else created WAITLISTED. Price is computed per ticket_dynamic_price at confirmation. Requires the session SCHEDULED."
    roles: [BoxOffice]
    code: 201
    input: [session_id, kind, "group_size?", "school_name?"]
    output: Ticket
    side_effects:
      - "CONFIRMED: booked_units += units; price_cents computed and fixed"
      - "WAITLISTED: no capacity consumed; priced later at promotion"
  - method: POST
    path: "/crayon-works/tickets/{id}/decision"
    description: "CHECK_IN (CONFIRMED, on the session date while the session is live) -> CHECKED_IN. REFUND (CONFIRMED, before session start) -> REFUNDED and frees capacity, triggering the waitlist promotion cascade. CANCEL (WAITLISTED) -> CANCELLED."
    roles: [BoxOffice]
    code: 200
    input: [action]
    output: Ticket
    side_effects:
      - "REFUND: booked_units -= units; WAITLISTED groups promoted in created_at ASC while the head fits (head-of-line blocking)"

  # --- SafetyTest ---
  - method: POST
    path: "/crayon-works/safety-tests/{id}/record-result"
    description: "Record the lab outcome of a scheduled safety test (SCHEDULED -> PASSED or FAILED)"
    roles: [LabTechnician]
    code: 200
    input: [outcome, "result_notes?"]
    output: SafetyTest
    side_effects: ["status PASSED or FAILED", "recorded_by_user_id := X-User-ID"]

  # --- Votes (consumer ballot intake) ---
  - method: POST
    path: "/crayon-works/votes"
    description: "Cast consumer ballots into an OPEN campaign. count imports count identical ballots (default 1). Weights accumulate per the campaign kind's table; votes on a non-OPEN campaign are rejected."
    roles: [Consumer]
    code: 201
    input: [campaign_id, voter_segment, choice, "count?"]
    output: { accepted: boolean, campaign_id: string, weight_applied: number }
    side_effects: ["votes_yes_weighted / votes_total_weighted / turnout_count accumulate by segment weight"]

  # --- System / test-driving ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Startup default is exactly 2026-09-01T00:00:00Z: before any set_current_utc call the logical clock reads that instant and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock := to_iso8601"]
  - method: POST
    path: "/crayon-works/ops/run-epoch"
    description: "Operations checkpoint. Advances the system epoch and processes, in this order: (1) open due SCHEDULED campaigns (opens_on <= clock < closes_on) in created_at ASC; (2) tally campaigns with closes_on <= clock (oldest closes_on first) and apply color outcomes plus the retirement cascade; (3) close sessions whose end <= clock, marking NO_SHOW/CANCELLED tickets; (4) expire REQUESTED allocations whose requested_ship_date < clock; (5) move OPEN recall cases to CONTAINED, and CONTAINED cases past cooling_until to CLOSED; (6) archive RETIRED colors whose archive_after_date <= clock."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { epoch_index: integer, campaigns_opened: integer, campaigns_tallied: integer, sessions_closed: integer, allocations_expired: integer, recalls_contained: integer, recalls_closed: integer, colors_archived: integer }
    side_effects: ["all epoch transitions listed in the state machines fire in the pinned order"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, invalid enum member, or a conditional-field rule violated (group_size/school_name iff kind=GROUP; partner_name iff kind=CLASSROOM; packed_counts covers exactly the spec colors)" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role value not declared" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not allowed on this endpoint, or Licensor X-User-ID does not equal the line's licensor_user_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body foreign key does not exist (body FKs checked in declared input order)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_assortment_spec_version or expected_formula_version does not match the parent's current version (OCC)" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: the decider/approver is the same X-User-ID that created the batch, submitted the formula, or submitted the licensed line" }
  - { id: ERR_COLOR_NOT_ACTIVE, http: 409, condition: "Campaign creation on a color not in the required state (PROPOSED for INTRODUCTION, ACTIVE for RETIREMENT)" }
  - { id: ERR_CAMPAIGN_NOT_OPEN, http: 409, condition: "Vote cast on a campaign that is SCHEDULED or TALLYED" }
  - { id: ERR_CAMPAIGN_WINDOW_CONFLICT, http: 409, condition: "New campaign window [opens_on, closes_on] (closed interval) intersects an existing campaign window of the same color" }
  - { id: ERR_FORMULA_NOT_APPROVABLE, http: 409, condition: "APPROVE attempted while the formula's latest safety test is not PASSED, or a run's spec contains a color with no APPROVED formula" }
  - { id: ERR_INVALID_FORMULA_STATE, http: 409, condition: "Formula transition not allowed from the formula's current state" }
  - { id: ERR_BATCH_NOT_CERTIFIED, http: 409, condition: "Production run references a pigment batch not in CERTIFIED state (and no open recall — that case is ERR_RECALL_ACTIVE)" }
  - { id: ERR_BATCH_TERMINAL, http: 409, condition: "Certification decision attempted on a REJECTED batch" }
  - { id: ERR_CERTIFICATION_MARK_REQUIRED, http: 409, condition: "CERTIFY attempted on a SENSITIVE or RESTRICTED hazard batch whose certification_mark is not ACMI_AP" }
  - { id: ERR_SPEC_DEPRECATED, http: 409, condition: "Production run references a DEPRECATED assortment spec" }
  - { id: ERR_SPEC_INVALID, http: 409, condition: "Assortment spec structurally invalid: empty entries, duplicate color, count < 1, unknown or non-ACTIVE entry color, box_size not in {8,16,24,64}, or CLASSROOM spec missing an ACTIVE core-curriculum color" }
  - { id: ERR_RUN_STAGE_INVALID, http: 409, condition: "ADVANCE/HOLD/RESUME/CANCEL not allowed from the run's current stage (including ADVANCE while ON_HOLD — use RESUME)" }
  - { id: ERR_RUN_ON_HOLD, http: 409, condition: "ADVANCE attempted while the run is ON_HOLD" }
  - { id: ERR_SESSION_FULL, http: 409, condition: "INDIVIDUAL ticket created when booked_units + 1 > capacity_units (equality with capacity still fits)" }
  - { id: ERR_SESSION_CLOSED, http: 409, condition: "Booking, check-in, or refund attempted on a CLOSED session" }
  - { id: ERR_SESSION_WINDOW_CONFLICT, http: 409, condition: "New session's occupied half-open interval [start, start+duration+30) intersects an existing SCHEDULED session on the same venue and date" }
  - { id: ERR_TICKET_STATE, http: 409, condition: "Ticket decision not allowed from the ticket's current state, or check-in outside the session's live window" }
  - { id: ERR_GROUP_TOO_LARGE, http: 422, condition: "GROUP ticket with group_size > 100" }
  - { id: ERR_ALLOCATION_STATE, http: 409, condition: "Allocation decision not allowed from the allocation's current state" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "COMMIT computes allocated_boxes_final == 0 (no boxes available)" }
  - { id: ERR_LICENSE_STATE, http: 409, condition: "Licensed-line transition not allowed from the line's current state" }
  - { id: ERR_LICENSE_REQUIRED, http: 409, condition: "Production run on a LICENSED spec without an APPROVED licensed line covering one of the spec's colors" }
  - { id: ERR_STALE_PIN, http: 409, condition: "REINSTATE attempted while the pinned formula version no longer matches the formula's current version or the formula is no longer APPROVED" }
  - { id: ERR_LICENSE_TERM_WINDOW, http: 422, condition: "Licensed run's planned dates are not fully contained in the line's [term_start, term_end]" }
  - { id: ERR_RECALL_ACTIVE, http: 409, condition: "Production run references a batch with an OPEN or CONTAINED recall case" }
  - { id: ERR_VOTE_INVALID, http: 422, condition: "Vote payload invalid: unknown voter_segment or choice, or count < 1" }
  - { id: ERR_DATE_ORDER, http: 422, condition: "Date ordering violated: closes_on <= opens_on, session_date in the past, planned_end_date <= planned_start_date, or term_end <= term_start" }
  - { id: ERR_SEASON_WINDOW, http: 422, condition: "requested_ship_date outside [2027-06-01T00:00:00Z, 2027-08-31T23:59:59Z]" }
  - { id: ERR_PLANNED_START_TOO_SOON, http: 422, condition: "planned_start_date earlier than logical clock + 60 days (long production lead time)" }

# =============================================================================
# Table 7: RBAC Matrix (segregation_of_duties role model; all identities opaque)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Factory operations administrator: catalog, specs, sessions, production runs, epoch and clock"
    identity: opaque
    exclusive_operations:
      - "POST /crayon-works/colors"
      - "POST /crayon-works/colors/{id}/vote-campaigns"
      - "POST /crayon-works/assortment-specs"
      - "POST /crayon-works/attraction-sessions"
      - "POST /crayon-works/production-runs"
      - "POST /crayon-works/production-runs/{id}/transition"
      - "POST /crayon-works/ops/run-epoch"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: SourcingManager
    description: "Pigment sourcing desk: registers pigment batches"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["POST /crayon-works/pigment-batches", "all GET endpoints"]
  - name: QualityAssurance
    description: "Quality assurance officer: registers batches and decides certification; may never certify a batch it registered (segregation of duties)"
    identity: opaque
    exclusive_operations: ["POST /crayon-works/pigment-batches/{id}/certification-decision"]
    shared_operations: ["POST /crayon-works/pigment-batches", "all GET endpoints"]
  - name: Formulator
    description: "Color scientist: creates formulas and submits them for approval"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["POST /crayon-works/formulas", "POST /crayon-works/formulas/{id}/transition (SUBMIT only)", "all GET endpoints"]
  - name: SafetyOfficer
    description: "Product safety authority: approves/rejects formulas; may never decide a formula it submitted (segregation of duties)"
    identity: opaque
    exclusive_operations: ["formula transition actions APPROVE, REJECT, REQUEST_REVISION"]
    shared_operations: ["POST /crayon-works/formulas", "POST /crayon-works/formulas/{id}/transition (SUBMIT only)", "all GET endpoints"]
  - name: LabTechnician
    description: "Wet-lab technician: records safety test outcomes"
    identity: opaque
    exclusive_operations: ["POST /crayon-works/safety-tests/{id}/record-result"]
    shared_operations: ["all GET endpoints"]
  - name: BrandManager
    description: "Brand partnerships manager: owns licensed lines on the brand side; may never BRAND_APPROVE a line it submitted (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /crayon-works/licensed-lines"
      - "line transition actions SUBMIT, BRAND_APPROVE, BRAND_REJECT, BRAND_REQUEST_REVISION, REINSTATE"
    shared_operations: ["all GET endpoints"]
  - name: Licensor
    description: "External licensor approver; X-User-ID must equal the line's licensor_user_id"
    identity: opaque
    exclusive_operations: ["line transition actions LICENSOR_APPROVE, LICENSOR_REJECT, LICENSOR_REQUEST_REVISION"]
    shared_operations: ["all GET endpoints"]
  - name: AllocationPlanner
    description: "Retail allocation planner for the seasonal back-to-school window"
    identity: opaque
    exclusive_operations:
      - "POST /crayon-works/retail-allocations"
      - "POST /crayon-works/retail-allocations/{id}/decision"
    shared_operations: ["GET /crayon-works/retail-allocations/{id}", "GET /crayon-works/assortment-specs/{id}/retail-allocations", "all GET endpoints"]
  - name: BoxOffice
    description: "Attraction box office: sells tickets, checks in visitors, processes refunds and cancellations"
    identity: opaque
    exclusive_operations:
      - "POST /crayon-works/tickets"
      - "POST /crayon-works/tickets/{id}/decision"
    shared_operations: ["GET /crayon-works/attraction-sessions/{id}/tickets", "all GET endpoints"]
  - name: Consumer
    description: "Unauthenticated-equivalent public voter; may only cast ballots"
    identity: opaque
    exclusive_operations: ["POST /crayon-works/votes"]
    shared_operations: []
