  # =================================================================== #
  # SECTION 8 — cross_cutting_complexity_layers                         #
  # =================================================================== #
  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_ccl_stale_expected_rma_version_blocks_the_reissue
        claim_type: Optimistic concurrency stale version
        grounds:
          - concurrency_rules.rma-reissue-stale-version
          - validations[priority 28 ERR_STALE_RMA_VERSION]
          - errors.ERR_STALE_RMA_VERSION
          - state_machines.ReturnAuthorization[ISSUED -> SUPERSEDED]
        distinguishing_aspect: "The version captured at RMA creation is already stale by the time the RMA is issued, because issue increments it, so a reissue quoting that creation-time version returns 412 ERR_STALE_RMA_VERSION and mints no replacement — the RMA is otherwise perfectly reissuable."
        test_recipe:
          setup:
            - "Client CC1 with one authorized line on an ISSUED RMA that has received nothing. rma_v0 is the version returned by the create call; the issue transition then increments the RMA's version, so rma_v0 is stale while rma_v_issued is current."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /clients"
              payload: { name: "Ccl One", client_code: "CC1", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", liquidation_floor_pct: 0.3, fraud_tolerance_cents: 100000000, max_refund_exposure_cents: 100000000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-CC1", customer_reference: "CUST-CC1", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id, rma_v0: $.data.version }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_line_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_v_issued: $.data.version }
          trigger:
            - call: "POST /return-authorizations/${rma_id}/reissue"
              payload: { expected_rma_version: "${rma_v0}", expires_at: "2026-10-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 412 with data.error_id == ERR_STALE_RMA_VERSION"
            - "${rma_v_issued} > ${rma_v0}, because the DRAFT -> ISSUED transition increments the version — this is what makes the quoted token stale"
            - "GET /return-authorizations/${rma_id} still shows status == ISSUED, version == ${rma_v_issued}, expires_at == 2026-09-01T00:00:00Z and supersedes_rma_id == null"
            - "GET /return-authorizations?client_id=${c_id} returns total_count == 1, so no replacement authorization was minted"
            - "Repeating the identical call with expected_rma_version == ${rma_v_issued} returns HTTP 201, the exact discriminator that only the version was wrong"

      - name: corner_ccl_current_expected_rma_version_reissues_and_bumps_the_source
        claim_type: Optimistic concurrency success and version increment
        grounds:
          - concurrency_rules.rma-reissue-stale-version
          - state_machines.ReturnAuthorization[ISSUED -> SUPERSEDED]
          - validations[priority 20 ERR_RMA_INVALID_STATE]
          - endpoints[POST /return-authorizations/{rma_id}/reissue]
        distinguishing_aspect: "A reissue quoting the current version succeeds, mints a version-1 replacement carrying a copy of every authorized line, and increments the source's version as it moves to SUPERSEDED — after which the same token is refused with 409 ERR_RMA_INVALID_STATE rather than 412, because the state check sits at priority 20 and the version check at 28."
        test_recipe:
          setup:
            - "Client CC2 with one authorized line of quantity 2 on an ISSUED RMA that has received nothing; rma_v_issued is the version read back from the issue call."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /clients"
              payload: { name: "Ccl Two", client_code: "CC2", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", liquidation_floor_pct: 0.3, fraud_tolerance_cents: 100000000, max_refund_exposure_cents: 100000000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-CC2", customer_reference: "CUST-CC2", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 2, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_line_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_v_issued: $.data.version }
          trigger:
            - call: "POST /return-authorizations/${rma_id}/reissue"
              payload: { expected_rma_version: "${rma_v_issued}", expires_at: "2026-10-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { new_rma_id: $.data.id, new_ver: $.data.version }
          assert:
            - "HTTP 201 with response_type == object"
            - "The replacement shows supersedes_rma_id == ${rma_id}, status == ISSUED, new_ver == 1, expires_at == 2026-10-01T00:00:00Z, declared_line_count == 1, authorized_unit_total == 2 and received_unit_total == 0"
            - "order_reference == ORD-CC2, customer_reference == CUST-CC2 and order_placed_at == 2026-07-25T00:00:00Z are copied verbatim from the source"
            - "GET /return-authorization-lines?rma_id=${new_rma_id} returns total_count == 1 with authorized_quantity == 2 and reason_code == DEFECTIVE, and its id differs from ${rma_line_id} — the line is a copy, not the same row"
            - "GET /return-authorizations/${rma_id} shows status == SUPERSEDED and version == ${rma_v_issued} + 1, so the guarded write incremented the source exactly once"
            - "Re-sending the reissue with expected_rma_version == ${rma_v_issued} + 1, which is now the source's current version, returns HTTP 409 ERR_RMA_INVALID_STATE and never 412, because SUPERSEDED is terminal and priority 20 precedes priority 28"

      - name: corner_ccl_stale_expected_return_line_version_blocks_the_order_create
        claim_type: Optimistic concurrency stale version
        grounds:
          - concurrency_rules.disposition-order-create-stale-line
          - validations[priority 29 ERR_STALE_RETURN_LINE_VERSION]
          - validations[priority 49 ERR_DISPOSITION_DRIFT]
          - errors.ERR_STALE_RETURN_LINE_VERSION
        distinguishing_aspect: "A supervisor override between grading and routing bumps the line's version, so an order create quoting the grade-time token returns 412 ERR_STALE_RETURN_LINE_VERSION and never 409 ERR_DISPOSITION_DRIFT — even though the quoted body also names the pre-override disposition, which drift at priority 49 would have rejected."
        test_recipe:
          setup:
