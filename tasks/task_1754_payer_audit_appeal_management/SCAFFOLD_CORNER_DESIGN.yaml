scaffold_corner_design:
  # ===================================================================
  # Section: entities
  # ===================================================================
  - section: entities
    instances:
      - name: payer_created_with_derived_track_and_defaults
        claim_type: creation
        grounds: ["entities.Payer.fields.appeal_track", "entities.Payer.fields.status"]
        distinguishing_aspect: "RAC payer derives appeal_track MEDICARE, COMMERCIAL payer derives COMMERCIAL; both born ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "RAC-1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { pr: $.data.id, pr_track: $.data.appeal_track, pr_status: $.data.status, pr_v: $.data.version } }
            - { call: "POST /payers", payload: { name: "COM-1", payer_type: "COMMERCIAL", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { pc_track: $.data.appeal_track } }
          trigger: []
          assert:
            - "pr_track == \"MEDICARE\" and pc_track == \"COMMERCIAL\""
            - "pr_status == \"ACTIVE\" and pr_v == 1"

      - name: issue_code_created_with_defaults
        claim_type: defaults
        grounds: ["entities.IssueCode.fields.active"]
        distinguishing_aspect: "IssueCode is born with active == true; no deactivation path exists."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /issue-codes", payload: { code: "MED_NEC", category: "CLINICAL", description: "Medical necessity" }, as: RevenueCycleAdmin, captures: { ic: $.data.id, ic_active: $.data.active } }
          trigger: []
          assert:
            - "ic_active == true"

      - name: audit_case_created_with_computed_deadline
        claim_type: computed_fields
        grounds: ["entities.AuditCase.fields.records_due_at", "calculations.records_due_at"]
        distinguishing_aspect: "records_due_at is computed as received_at + records_submission_days (30d -> 2026-08-31T00:00:00Z); totals initialize to 0 and late_submission to false; input of those fields is not accepted."
        test_recipe:
          setup: ["payer with records_submission_days 30"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c_due: $.data.records_due_at, c_status: $.data.status, c_billed: $.data.total_billed_cents, c_late: $.data.late_submission } }
          assert:
            - "c_due == \"2026-08-31T00:00:00Z\""
            - "c_status == \"RECEIVED\" and c_billed == 0 and c_late == false"

      - name: get_missing_case_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /audit-cases/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_NOT_FOUND\" with http 404"

      - name: event_log_entries_immutable
        claim_type: immutability
        grounds: ["entities.AuditCaseEvent"]
        distinguishing_aspect: "AuditCaseEvent has common_fields false: entries carry id/created_at/occurred_at but NO version or updated_at, and no mutation endpoint exists for them."
        test_recipe:
          setup: ["one audit case created"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
          trigger:
            - { call: "GET /audit-cases/${c1}/events", payload: {}, as: Any }
          assert:
            - "first entry has event_type == \"CASE_CREATED\" and actor_role == \"HIMCoordinator\""
            - "every entry lacks the keys version and updated_at (immutable event log)"

      - name: claim_line_invalid_interval_rejected
        claim_type: type_constraint
        grounds: ["entities.AuditClaimLine.fields.service_end_date", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "service_end_date <= service_start_date violates the half-open interval shape -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["payer + case in RECEIVED"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-10T00:00:00Z", service_end_date: "2026-01-10T00:00:00Z", billed_amount_cents: 1000 }, as: HIMCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_INVALID_REQUEST\" (empty interval rejected)"

      - name: payer_system_fields_input_ignored
        claim_type: system_fields
        grounds: ["entities.Payer"]
        distinguishing_aspect: "Client-supplied id/version in the create body are ignored: the server mints its own UUID id and starts version at 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /payers", payload: { id: "11111111-1111-1111-1111-111111111111", version: 99, name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
          trigger: []
          assert:
            - "p_id != \"11111111-1111-1111-1111-111111111111\" (server-minted)"
            - "p_v == 1"

  # ===================================================================
  # Section: state_machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: appeal_initial_state_and_deadline
        claim_type: initial_state
        grounds: ["state_machines.Appeal", "calculations.appeal_filed_deadline"]
        distinguishing_aspect: "A first appeal is born DRAFT at LEVEL_1 (label REDETERMINATION on the MEDICARE track) with filed_deadline_at == determination_issued_at + l1_deadline_days and appealed_denied_cents snapshotted from the line."
        test_recipe:
          setup: ["determined case, line denied 100000 under issue MED_NEC, determination at 2026-08-01"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "MED_NEC", category: "CLINICAL", description: "Medical necessity" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 100000, denial_category: "CLINICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /claim-lines/${l1}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap_st: $.data.status, ap_lvl: $.data.level, ap_lbl: $.data.level_label, ap_due: $.data.filed_deadline_at, ap_amt: $.data.appealed_denied_cents, ap_prior: $.data.prior_appeal_id } }
          assert:
            - "ap_st == \"DRAFT\" and ap_lvl == \"LEVEL_1\" and ap_lbl == \"REDETERMINATION\""
            - "ap_due == \"2026-08-31T00:00:00Z\" (determination 2026-08-01 + 30d)"
            - "ap_amt == 100000 and ap_prior == null"

      - name: case_close_from_received_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.AuditCase", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "CLOSE is only valid from DETERMINATION_ISSUED; from RECEIVED it fails with ERR_INVALID_STATE_TRANSITION and no side effects fire."
        test_recipe:
          setup: ["case in RECEIVED"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /audit-cases/${c1}/close", payload: {}, as: DepartmentDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_INVALID_STATE_TRANSITION\""
            - "GET /audit-cases/${c1} still shows status RECEIVED"

      - name: determination_before_review_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.AuditCase.UNDER_PAYER_REVIEW_to_DETERMINATION_ISSUED"]
        distinguishing_aspect: "Determination requires UNDER_PAYER_REVIEW; posting it on a RECORDS_SUBMITTED case fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["case advanced to RECORDS_SUBMITTED with one line"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "MED_NEC", category: "CLINICAL", description: "Medical necessity" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
          trigger:
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 100000, denial_category: "CLINICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}", captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_INVALID_STATE_TRANSITION\""

      - name: expired_appeal_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: ["state_machines.Appeal.DRAFT_to_EXPIRED", "errors[ERR_APPEAL_DEADLINE_PASSED]"]
        distinguishing_aspect: "Filing a DRAFT appeal after its deadline returns ERR_APPEAL_DEADLINE_PASSED and lazily expires the appeal; every further action on the EXPIRED appeal (file, withdraw) is rejected with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["determined case, line denied 100000, L1 appeal created with deadline 2026-08-31; clock advanced to 2026-09-01"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "MED_NEC", category: "CLINICAL", description: "Medical necessity" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 100000, denial_category: "CLINICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /claim-lines/${l1}/appeals", payload: {}, as: AppealsSpecialist, captures: { ap1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RevenueCycleAdmin }
          trigger:
            - { call: "POST /appeals/${ap1}/file", payload: {}, as: AppealsSpecialist, captures: { err1: $.data.error_id } }
            - { call: "GET /appeals/${ap1}", payload: {}, as: Any, captures: { ap_st: $.data.status } }
            - { call: "POST /appeals/${ap1}/file", payload: {}, as: AppealsSpecialist, captures: { err2: $.data.error_id } }
            - { call: "POST /appeals/${ap1}/withdraw", payload: {}, as: AppealsSpecialist, captures: { err3: $.data.error_id } }
          assert:
            - "err1 == \"ERR_APPEAL_DEADLINE_PASSED\" and ap_st == \"EXPIRED\" (lazy expiry)"
            - "err2 == \"ERR_INVALID_STATE_TRANSITION\" and err3 == \"ERR_INVALID_STATE_TRANSITION\" (terminal lockdown)"

      - name: offset_double_reverse_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.OffsetTransaction"]
        distinguishing_aspect: "REVERSED is terminal for offsets: the second reverse returns ERR_INVALID_STATE_TRANSITION and the demand/remittance are not credited twice."
        test_recipe:
          setup: ["demand 100000 with one APPLIED manual offset 40000"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "AUTH", category: "TECHNICAL", description: "Missing auth" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 100000, denial_category: "TECHNICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/recoupment-demands", payload: { principal_cents: 100000 }, as: PayerAgent, as_user_id: "${p1}", captures: { d1: $.data.id } }
            - { call: "POST /remittances", payload: { payer_id: "${p1}", gross_amount_cents: 40000 }, as: PayerAgent, as_user_id: "${p1}", captures: { rem: $.data.id } }
            - { call: "POST /recoupment-demands/${d1}/offsets", payload: { remittance_id: "${rem}", amount_cents: 40000 }, as: PFSAccountant, captures: { "off": $.data.id } }
            - { call: "POST /offset-transactions/${off}/reverse", payload: {}, as: PFSAccountant }
          trigger:
            - { call: "POST /offset-transactions/${off}/reverse", payload: {}, as: PFSAccountant, captures: { err: $.data.error_id } }
            - { call: "GET /recoupment-demands/${d1}", payload: {}, as: Any, captures: { d_out: $.data.outstanding_principal_cents } }
          assert:
            - "err == \"ERR_INVALID_STATE_TRANSITION\""
            - "d_out == 100000 (credited exactly once)"

      - name: cap_verify_success_at_window_boundary
        claim_type: valid_transition
        grounds: ["state_machines.CorrectiveActionPlan.EFFECTIVENESS_CHECK_to_VERIFIED"]
        distinguishing_aspect: "Verify at exactly check_started_at + 14 days (inclusive lower bound) by a DIFFERENT user succeeds -> VERIFIED with verified_by_user_id recorded."
        test_recipe:
          setup: ["CAP proposed by co-1, activated, effectiveness check begun at 2026-08-01T00:00:00Z; clock advanced to exactly 2026-08-15T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "AUTH", category: "TECHNICAL", description: "Missing auth" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /corrective-action-plans", payload: { payer_id: "${p1}", issue_code_id: "${ic}", title: "Fix auth capture", root_cause: "Auth not captured at scheduling" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { cap: $.data.id } }
            - { call: "POST /corrective-action-plans/${cap}/activate", payload: {}, as: DepartmentDirector }
            - { call: "POST /corrective-action-plans/${cap}/begin-effectiveness-check", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: RevenueCycleAdmin }
          trigger:
            - { call: "POST /corrective-action-plans/${cap}/verify", payload: {}, as: InternalAuditor, as_user_id: "ia-1", captures: { cap_st: $.data.status, cap_ver: $.data.verified_by_user_id } }
          assert:
            - "cap_st == \"VERIFIED\" and cap_ver == \"ia-1\" (boundary timestamp is inclusive-eligible)"

      - name: suspended_payer_rejects_new_case
        claim_type: precondition_enforcement
        grounds: ["state_machines.Payer", "errors[ERR_PAYER_SUSPENDED]"]
