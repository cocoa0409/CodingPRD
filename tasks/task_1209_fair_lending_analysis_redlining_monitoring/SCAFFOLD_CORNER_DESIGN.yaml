        distinguishing_aspect: "OCC on Application.version: create yields version 1; validate bumps to 2; a PUT carrying expected_application_version 1 -> 412 ERR_STALE_VERSION; replaying with the current version 2 succeeds and bumps to 3 (status RECEIVED)."
        test_recipe:
          setup: ["application a1 VALIDATED at version 2 (v1 captured at create, v2 at validate)"]
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
