      - name: manager_approval_gate_outranks_endorsement_state_and_rejects_decision
        grounds:
          - validations[priority=24].ERR_MANAGER_APPROVAL_REQUIRED
          - validations[priority=55].ERR_INVALID_ENDORSEMENT_STATE
          - calculations.extension_premium_adjustment.constants.SOD_AP_THRESHOLD_CENTS
        distinguishing_aspect: |
          A different error-category pair from the first instance: an auth rule (priority 24)
          against a state rule (priority 55). The endorsement is already APPROVED, so the state
          rule is violated, and the acting role is Underwriter on an endorsement whose frozen
          additional_premium_cents (968985) exceeds SOD_AP_THRESHOLD_CENTS, so the auth rule is
          violated too. The auth error must win. The same duplicate approval by an
          UnderwritingManager then yields the state error, and a small-AP endorsement (382494)
          approved by an Underwriter succeeds - the priority 24 gate is conditional on the amount,
          not on the role alone.
