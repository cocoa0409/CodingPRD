scenario: "787. Online Will & Estate-Planning Subscription (Trust & Will style): guided questionnaire & state-specific document (will/trust/POA/healthcare-directive), member/spouse plan & bundle, attorney-support add-on, notary/witness & funding instructions, update/version subscription, beneficiary & asset inventory, secure-share & executor, renewal"
domain_name: online-will-estate-planning
api_prefix: "/v1"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  # Peer entities linked by foreign keys (member -> subscription -> {questionnaire,
  # document, beneficiary, asset, executor}; document -> {share_grant, attorney_review}).
  # No deep URL nesting for writes; reads use sub-resource GETs for FK reverse-reachability.
  state_machine_shape: cyclic
  # Subscription (ACTIVE<->SUSPENDED renewal loop), EstateDocument (GENERATED<->IN_REVIEW
  # revision loop), AttorneyReview (IN_REVIEW<->CHANGES_REQUESTED) are all cyclic.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential   # EstateDocument.superseded_by_id references EstateDocument (plain ref, not FK path)
  role_model: peer_roles
  # Member owns the estate plan; Attorney reviews; Notary executes; PlatformAdmin operates
  # catalog/clock/payments. Non-overlapping ownership of resource types.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: PlanCatalog
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID (no type prefix); identity only, never a business-decision input."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: plan_tier
        type: enum
        source: input
        description: "Plan identifier; Subscriptions reference the catalog by this tier, not by id."
        constraints: "one of {BASIC, PLUS, PREMIER}; unique across PlanCatalog rows"
      - name: base_price_cents
        type: integer
        source: input
        description: "Annual base price of the plan in cents, before add-ons and bundle multiplier."
        constraints: ">= 0"
      - name: included_document_types
        type: array
        source: input
        description: "Document types the plan permits generating."
        constraints: "non-empty subset of {WILL, TRUST, POA, HEALTHCARE_DIRECTIVE}"
      - name: max_documents
        type: integer
        source: input
        description: "Maximum number of EstateDocuments (any non-REVOKED status) a subscription on this plan may hold."
        constraints: ">= 1"
      - name: allows_trust
        type: boolean
        source: input
        description: "Whether TRUST documents may be generated on this plan."

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login/contact email; unique across Members."
      - name: full_name
        type: string
        source: input
        description: "Member legal full name."
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state of residence; drives state-specific document rules."
        constraints: "two uppercase letters"

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the account holder who owns this subscription."
      - name: plan_tier
        type: enum
        source: input
        description: "Selected plan; must match an existing PlanCatalog.plan_tier."
        constraints: "one of {BASIC, PLUS, PREMIER}"
      - name: bundle_type
        type: enum
        source: input
        description: "INDIVIDUAL covers the member only; COUPLE bundles a spouse."
        default: INDIVIDUAL
        constraints: "one of {INDIVIDUAL, COUPLE}"
      - name: spouse_name
        type: string
        source: input
        description: "Spouse legal name; required when bundle_type == COUPLE."
      - name: spouse_email
        type: string
        source: input
        description: "Spouse contact email; optional."
      - name: attorney_support
        type: boolean
        source: input
        description: "Paid add-on enabling attorney review of documents."
        default: false
      - name: status
        type: enum
        source: system
        description: "Lifecycle status."
        default: PENDING_PAYMENT
        constraints: "one of {PENDING_PAYMENT, ACTIVE, SUSPENDED, CANCELLED, EXPIRED}"
      - name: price_cents
        type: integer
        source: computed
        description: "Signup price = signup_price calculation output; locked at creation, recomputed on change-plan."
      - name: pending_charge_cents
        type: integer
        source: system
        description: "Amount awaiting settlement (initial signup or renewal provisional quote); 0 when nothing outstanding."
        default: 0
      - name: paid_to_date_cents
        type: integer
        source: system
        description: "Cumulative amount actually settled (charged) across signup + renewals."
        default: 0
      - name: refunded_cents
        type: integer
        source: system
        description: "Cumulative amount refunded on cancellation."
        default: 0
      - name: current_period_start
        type: datetime
        source: system
        description: "Start of the current paid coverage window (set on activation); null before activation."
      - name: current_period_end
        type: datetime
        source: system
        description: "End (exclusive) of the current paid coverage window; null before activation."
      - name: renewal_count
        type: integer
        source: system
        description: "Number of successful renewals settled; drives loyalty discount tier."
        default: 0
      - name: renewal_pending
        type: boolean
        source: system
        description: "True after renew initiation until the renewal charge settles or fails."
        default: false

  - name: Questionnaire
    parent: null
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription this intake belongs to."
      - name: document_type
        type: enum
        source: input
        description: "Which document this guided intake will produce."
        constraints: "one of {WILL, TRUST, POA, HEALTHCARE_DIRECTIVE}"
      - name: state_code
        type: string
        source: input
        description: "State whose rules apply to the resulting document."
        constraints: "two uppercase letters"
      - name: answers
        type: object
        source: system
        description: "Accumulated answer key/value map submitted via the answers endpoint."
        default: "{}"
      - name: required_field_count
        type: integer
        source: computed
        description: "Number of required intake fields for this document_type (REQUIRED_FIELDS constant); fixed at creation."
      - name: answered_field_count
        type: integer
        source: system
        description: "Count of distinct required keys answered so far (capped at required_field_count)."
        default: 0
      - name: completeness_pct
        type: number
        source: computed
        description: "round(answered_field_count / required_field_count * 100, 2)."
      - name: status
        type: enum
        source: system
        description: "Intake lifecycle."
        default: IN_PROGRESS
        constraints: "one of {IN_PROGRESS, COMPLETED, LOCKED}"

  - name: EstateDocument
    parent: null
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; owning subscription (copied from the source questionnaire)."
      - name: questionnaire_id
        type: string
        source: input
        description: "FK -> Questionnaire.id; the completed intake this document was generated from."
      - name: document_type
        type: enum
        source: system
        description: "Copied from the questionnaire."
        constraints: "one of {WILL, TRUST, POA, HEALTHCARE_DIRECTIVE}"
      - name: state_code
        type: string
        source: system
        description: "Copied from the questionnaire; drives notary/witness requirements."
      - name: status
        type: enum
        source: system
        description: "Document lifecycle."
        default: GENERATED
        constraints: "one of {GENERATED, IN_REVIEW, PENDING_EXECUTION, EXECUTED, SUPERSEDED, REVOKED}"
      - name: doc_version
        type: integer
        source: computed
        description: "Sequence number = 1 + count of prior EstateDocuments with same subscription_id and document_type (any status)."
      - name: requires_notary
        type: boolean
        source: computed
        description: "requires_notary calculation: true if document_type in {TRUST, POA} OR state_code == 'LA'."
      - name: witness_count_required
        type: integer
        source: computed
        description: "witness_requirement calculation: WITNESS_BASE[document_type] + (1 if state_code in {LA, VT} else 0)."
      - name: witnesses_count
        type: integer
        source: system
        description: "Number of witnesses recorded at execution (from the execute payload); 0 until executed."
        default: 0
      - name: execution_date
        type: datetime
        source: system
        description: "Logical-clock timestamp when the document was executed; null until EXECUTED."
      - name: superseded_by_id
        type: string
        source: system
        description: "Id of the EstateDocument that superseded this one (self reference; discoverable via the subscription documents list). Null unless SUPERSEDED."

  - name: Beneficiary
    parent: null
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the estate plan this beneficiary belongs to."
      - name: full_name
        type: string
        source: input
        description: "Beneficiary legal name."
      - name: relationship
        type: enum
        source: input
        description: "Relationship to the member."
        constraints: "one of {SPOUSE, CHILD, RELATIVE, CHARITY, OTHER}"
      - name: allocation_pct
        type: number
        source: input
        description: "Residuary-estate share as a percent with up to two decimals; counts toward the 100.00 cap only when is_contingent is false."
        constraints: ">= 0 and <= 100"
      - name: is_contingent
        type: boolean
        source: input
        description: "Contingent beneficiaries do not consume the primary 100.00% allocation pool."
        default: false
      - name: allocated_cents
        type: integer
        source: computed
        description: "estate_distribution calculation output: this beneficiary's floor share of gross_estate_value_cents plus any residual cent assigned by created_at ASC. 0 for contingent beneficiaries."

  - name: Asset
    parent: null
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the estate plan this asset belongs to."
      - name: asset_type
        type: enum
        source: input
        description: "Asset category."
        constraints: "one of {REAL_ESTATE, BANK, INVESTMENT, VEHICLE, PERSONAL, BUSINESS}"
      - name: description
        type: string
        source: input
        description: "Human description of the asset."
      - name: estimated_value_cents
        type: integer
        source: input
        description: "Estimated fair value in cents."
        constraints: ">= 0"
      - name: funding_status
        type: enum
        source: input
        description: "Whether the asset has been funded into a trust (non-probate). Modeled as input for this API."
        default: UNFUNDED
        constraints: "one of {UNFUNDED, PENDING, FUNDED}"
      - name: assigned_beneficiary_id
        type: string
        source: input
        description: "FK -> Beneficiary.id; specific-bequest earmark for this asset. Null when unassigned. Set/changed via the assign-beneficiary endpoint."

  - name: Executor
    parent: null
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the estate plan this executor serves."
      - name: full_name
        type: string
        source: input
        description: "Executor legal name."
      - name: email
        type: string
        source: input
        description: "Executor contact email."
      - name: priority_order
        type: integer
        source: input
        description: "1 = primary executor, 2 = first alternate, etc.; unique per subscription."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Nomination lifecycle."
        default: NOMINATED
        constraints: "one of {NOMINATED, ACCEPTED, DECLINED, REVOKED}"

  - name: ShareGrant
    parent: null
    common_fields: true
    fields:
      - name: document_id
        type: string
        source: input
        description: "FK -> EstateDocument.id; the executed document being securely shared."
      - name: grantee_email
        type: string
        source: input
        description: "Email of the person granted access."
      - name: scope
        type: enum
        source: input
        description: "Access scope granted."
        constraints: "one of {VIEW, FULL, EXECUTOR_ACCESS}"
      - name: status
        type: enum
        source: system
        description: "Grant lifecycle."
        default: ACTIVE
        constraints: "one of {ACTIVE, REVOKED}"
      - name: expires_at
        type: datetime
        source: input
        description: "Logical-clock instant (exclusive) at which the grant stops being usable; used for validity-window overlap detection."

  - name: AttorneyReview
    parent: null
    common_fields: true
    fields:
      - name: document_id
        type: string
        source: input
        description: "FK -> EstateDocument.id; the document under attorney review."
      - name: attorney_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the Attorney who last acted; not a foreign key to any entity id."
      - name: status
        type: enum
        source: system
        description: "Review lifecycle."
        default: REQUESTED
        constraints: "one of {REQUESTED, IN_REVIEW, CHANGES_REQUESTED, APPROVED, CLOSED}"
      - name: notes
        type: string
        source: input
        description: "Attorney notes supplied on a decision."

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Subscription
    initial_state: PENDING_PAYMENT
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /v1/_payments/simulate {outcome: SUCCEEDED}"
        actor: PlatformAdmin
        preconditions:
          - "status == PENDING_PAYMENT"
          - "the resulting period [now, now + TERM_DAYS) does not overlap (half-open) any other non-terminal Subscription of the same member — else ERR_SUBSCRIPTION_PERIOD_OVERLAP"
        side_effects:
          - "current_period_start = logical clock now"
          - "current_period_end = current_period_start + TERM_DAYS (365 days)"
          - "paid_to_date_cents += pending_charge_cents"
          - "pending_charge_cents = 0"
          - "increments Subscription.version by 1"
      - from: PENDING_PAYMENT
        to: EXPIRED
        trigger: "POST /v1/_payments/simulate {outcome: FAILED}"
        actor: PlatformAdmin
        preconditions:
          - "status == PENDING_PAYMENT"
        side_effects:
          - "pending_charge_cents = 0"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /v1/subscriptions/{id}/renew"
        actor: Member
        preconditions:
          - "status == ACTIVE"
          - "renewal_pending == false"
          - "now >= current_period_end - RENEWAL_WINDOW_DAYS (30 days)"
          - "now <= current_period_end + GRACE_DAYS (30 days)"
        side_effects:
          - "renewal_pending = true"
          - "pending_charge_cents = renewal_provisional_quote calculation output"
          - "increments Subscription.version by 1"
        note: "Renewal initiation. The renewal_provisional_quote (no loyalty discount) becomes the outstanding charge."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /v1/_payments/simulate {outcome: SUCCEEDED} (renewal settlement)"
        actor: PlatformAdmin
        preconditions:
          - "status == ACTIVE"
          - "renewal_pending == true"
        side_effects:
          - "renewal_count += 1"
          - "final_charge = renewal_final_charge calculation output (loyalty discount applied to pending_charge_cents using post-increment renewal_count)"
          - "paid_to_date_cents += final_charge"
          - "current_period_start = prior current_period_end"
          - "current_period_end = new current_period_start + TERM_DAYS"
          - "renewal_pending = false"
          - "pending_charge_cents = 0"
          - "increments Subscription.version by 1"
        note: "Renewal settlement cycle ACTIVE->ACTIVE. The charged amount diverges from the provisional quote by the loyalty discount."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/_payments/simulate {outcome: FAILED} (renewal settlement)"
        actor: PlatformAdmin
        preconditions:
          - "status == ACTIVE"
          - "renewal_pending == true"
        side_effects:
          - "increments Subscription.version by 1"
        note: "renewal_pending and pending_charge_cents are retained so a later successful payment can reinstate."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/_payments/simulate {outcome: SUCCEEDED} (reinstatement)"
        actor: PlatformAdmin
        preconditions:
          - "status == SUSPENDED"
          - "now <= current_period_end + GRACE_DAYS (30 days)"
        side_effects:
          - "renewal_count += 1"
          - "final_charge = renewal_final_charge calculation output"
          - "paid_to_date_cents += final_charge"
          - "current_period_start = prior current_period_end"
          - "current_period_end = new current_period_start + TERM_DAYS"
          - "renewal_pending = false"
          - "pending_charge_cents = 0"
          - "increments Subscription.version by 1"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "POST /v1/_payments/simulate {outcome: FAILED} (grace elapsed)"
        actor: PlatformAdmin
        preconditions:
          - "status == SUSPENDED"
          - "now > current_period_end + GRACE_DAYS (30 days)"
        side_effects:
          - "pending_charge_cents = 0"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /v1/subscriptions/{id}/change-plan"
        actor: Member
        preconditions:
          - "status == ACTIVE"
          - "expected_subscription_version == Subscription.version (OCC)"
          - "new_plan_tier exists in PlanCatalog"
        side_effects:
          - "plan_tier = new_plan_tier"
          - "price_cents = signup_price calculation output for new_plan_tier"
          - "increments Subscription.version by 1"
      - from: PENDING_PAYMENT
        to: CANCELLED
        trigger: "POST /v1/subscriptions/{id}/cancel"
        actor: Member
        preconditions:
          - "status in {PENDING_PAYMENT, ACTIVE, SUSPENDED}"
        side_effects:
          - "pending_charge_cents = 0"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /v1/subscriptions/{id}/cancel"
        actor: Member
        preconditions:
          - "status in {PENDING_PAYMENT, ACTIVE, SUSPENDED}"
        side_effects:
          - "refund = cancel_refund calculation output; refunded_cents += refund; paid_to_date_cents -= refund"
          - "CASCADE (chain-1, hop 1): every non-terminal EstateDocument of this subscription transitions to REVOKED"
          - "increments Subscription.version by 1"
        note: "Chain-1 origin. Document REVOKED (hop 2) itself revokes share grants (hop 3); see EstateDocument REVOKED transition."
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /v1/subscriptions/{id}/cancel"
        actor: Member
        preconditions:
          - "status in {PENDING_PAYMENT, ACTIVE, SUSPENDED}"
        side_effects:
          - "refund = cancel_refund calculation output; refunded_cents += refund; paid_to_date_cents -= refund"
          - "CASCADE (chain-1, hop 1): every non-terminal EstateDocument of this subscription transitions to REVOKED"
          - "increments Subscription.version by 1"

  - entity: Questionnaire
    initial_state: IN_PROGRESS
    terminal_states: [LOCKED]
    transitions:
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /v1/questionnaires/{id}/answers"
        actor: Member
        preconditions:
          - "status == IN_PROGRESS"
          - "resulting completeness_pct == 100 (answered_field_count == required_field_count)"
        side_effects:
          - "answers merged; answered_field_count recomputed; completeness_pct recomputed"
          - "increments Questionnaire.version by 1"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /v1/questionnaires/{id}/answers (partial)"
        actor: Member
        preconditions:
          - "status == IN_PROGRESS"
          - "resulting completeness_pct < 100"
        side_effects:
          - "answers merged; answered_field_count recomputed; completeness_pct recomputed"
          - "increments Questionnaire.version by 1"
      - from: COMPLETED
        to: LOCKED
        trigger: "POST /v1/documents (generation from this questionnaire)"
        actor: Member
        preconditions:
          - "status == COMPLETED"
        side_effects:
          - "increments Questionnaire.version by 1"
        note: "Generating a document freezes its source intake."

  - entity: EstateDocument
    initial_state: GENERATED
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: GENERATED
        to: IN_REVIEW
        trigger: "POST /v1/documents/{id}/submit-review"
        actor: Member
        preconditions:
          - "status == GENERATED"
          - "owning Subscription.attorney_support == true"
        side_effects:
          - "if the document has no non-terminal AttorneyReview, create one with status REQUESTED; if it has an AttorneyReview in CHANGES_REQUESTED, reuse that same review (member re-submission — no new review created)"
          - "increments EstateDocument.version by 1"
      - from: IN_REVIEW
        to: GENERATED
        trigger: "POST /v1/attorney-reviews/{id}/decision {action: REQUEST_CHANGES}"
        actor: Attorney
        preconditions:
          - "the AttorneyReview.document_id == this document and review.status == IN_REVIEW"
        side_effects:
          - "AttorneyReview.status = CHANGES_REQUESTED"
          - "increments EstateDocument.version by 1"
        note: "Revision loop GENERATED->IN_REVIEW->GENERATED (non-linear cycle on EstateDocument)."
      - from: IN_REVIEW
        to: PENDING_EXECUTION
        trigger: "POST /v1/attorney-reviews/{id}/decision {action: APPROVE}"
        actor: Attorney
        preconditions:
          - "the AttorneyReview.document_id == this document and review.status == IN_REVIEW"
        side_effects:
          - "AttorneyReview.status = APPROVED"
          - "increments EstateDocument.version by 1"
      - from: GENERATED
        to: EXECUTED
        trigger: "POST /v1/documents/{id}/execute"
        actor: Notary
        preconditions:
          - "status == GENERATED (no attorney review requested) — see also PENDING_EXECUTION path"
          - "owning Subscription.status == ACTIVE"
          - "witnesses_count (payload) >= witness_count_required"
          - "if document_type == WILL: subscription has >= 1 non-contingent Beneficiary"
        side_effects:
          - "witnesses_count = payload witnesses_count; execution_date = clock now"
          - "CASCADE (chain-2, hop 1): if a prior EstateDocument of same subscription_id and document_type is EXECUTED, it transitions to SUPERSEDED"
          - "increments EstateDocument.version by 1"
        note: "Chain-2 origin. Reaching EXECUTED drives the prior document to SUPERSEDED (hop 2), which revokes that prior document's share grants (hop 3)."
      - from: PENDING_EXECUTION
        to: EXECUTED
        trigger: "POST /v1/documents/{id}/execute"
        actor: Notary
        preconditions:
          - "status == PENDING_EXECUTION (attorney APPROVED)"
          - "owning Subscription.status == ACTIVE"
          - "witnesses_count (payload) >= witness_count_required"
          - "if document_type == WILL: subscription has >= 1 non-contingent Beneficiary"
        side_effects:
          - "witnesses_count = payload witnesses_count; execution_date = clock now"
          - "CASCADE (chain-2, hop 1): if a prior EstateDocument of same subscription_id and document_type is EXECUTED, it transitions to SUPERSEDED"
          - "increments EstateDocument.version by 1"
      - from: EXECUTED
        to: SUPERSEDED
        trigger: "system: a newer document of same subscription_id + document_type reaches EXECUTED"
        actor: system
        preconditions:
          - "status == EXECUTED"
        side_effects:
          - "superseded_by_id = id of the newer executed document"
          - "CASCADE (chain-2, hop 3): every ACTIVE ShareGrant whose document_id == this document transitions to REVOKED"
          - "any AttorneyReview of this document in a non-terminal status transitions to CLOSED"
          - "increments EstateDocument.version by 1"
      - from: GENERATED
        to: REVOKED
        trigger: "system: owning Subscription cancelled"
        actor: system
        preconditions:
          - "status in {GENERATED, IN_REVIEW, PENDING_EXECUTION, EXECUTED}"
        side_effects:
          - "CASCADE (chain-1, hop 3): every ACTIVE ShareGrant whose document_id == this document transitions to REVOKED"
          - "any AttorneyReview of this document in a non-terminal status transitions to CLOSED"
          - "increments EstateDocument.version by 1"
      - from: EXECUTED
        to: REVOKED
        trigger: "system: owning Subscription cancelled"
        actor: system
        preconditions:
          - "status in {GENERATED, IN_REVIEW, PENDING_EXECUTION, EXECUTED}"
        side_effects:
          - "CASCADE (chain-1, hop 3): every ACTIVE ShareGrant whose document_id == this document transitions to REVOKED"
          - "increments EstateDocument.version by 1"

  - entity: AttorneyReview
    initial_state: REQUESTED
    terminal_states: [APPROVED, CLOSED]
    transitions:
      - from: REQUESTED
        to: IN_REVIEW
        trigger: "POST /v1/attorney-reviews/{id}/decision {action: START_REVIEW}"
        actor: Attorney
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "attorney_user_id = acting X-User-ID"
          - "increments AttorneyReview.version by 1"
      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /v1/attorney-reviews/{id}/decision {action: REQUEST_CHANGES}"
        actor: Attorney
        preconditions:
          - "status == IN_REVIEW"
        side_effects:
          - "notes = payload notes"
          - "owning EstateDocument transitions IN_REVIEW -> GENERATED"
          - "increments AttorneyReview.version by 1"
      - from: CHANGES_REQUESTED
        to: IN_REVIEW
        trigger: "POST /v1/attorney-reviews/{id}/decision {action: START_REVIEW}"
        actor: Attorney
        preconditions:
          - "status == CHANGES_REQUESTED"
          - "owning EstateDocument.status == IN_REVIEW (member re-submitted the document for review)"
        side_effects:
          - "increments AttorneyReview.version by 1"
        note: "Re-review loop IN_REVIEW->CHANGES_REQUESTED->IN_REVIEW (non-linear cycle on AttorneyReview)."
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /v1/attorney-reviews/{id}/decision {action: APPROVE}"
        actor: Attorney
        preconditions:
          - "status == IN_REVIEW"
        side_effects:
          - "owning EstateDocument transitions IN_REVIEW -> PENDING_EXECUTION"
          - "increments AttorneyReview.version by 1"
      - from: REQUESTED
        to: CLOSED
        trigger: "system: owning EstateDocument revoked or superseded"
        actor: system
        preconditions:
          - "status in {REQUESTED, IN_REVIEW, CHANGES_REQUESTED}"
        side_effects:
          - "increments AttorneyReview.version by 1"

  - entity: Executor
    initial_state: NOMINATED
    terminal_states: [DECLINED, REVOKED]
    transitions:
      - from: NOMINATED
        to: ACCEPTED
        trigger: "POST /v1/executors/{id}/respond {decision: ACCEPT}"
        actor: Member
        preconditions:
          - "status == NOMINATED"
        side_effects:
          - "increments Executor.version by 1"
      - from: NOMINATED
        to: DECLINED
        trigger: "POST /v1/executors/{id}/respond {decision: DECLINE}"
        actor: Member
        preconditions:
          - "status == NOMINATED"
        side_effects:
          - "increments Executor.version by 1"
      - from: ACCEPTED
        to: REVOKED
        trigger: "system: owning Subscription cancelled (direct fan-out side effect of cancel)"
        actor: system
        preconditions:
          - "status in {NOMINATED, ACCEPTED}"
        side_effects:
          - "increments Executor.version by 1"

  - entity: ShareGrant
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /v1/share-grants/{id}/revoke"
        actor: Member
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "increments ShareGrant.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "system: owning document revoked (chain-1 hop 3) or superseded (chain-2 hop 3)"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "increments ShareGrant.version by 1"

# ---------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------
concurrency_rules:
  - rule_id: change-plan-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /v1/subscriptions/{id}/change-plan"
    occ_field: "expected_subscription_version"
    description: |
      Changing the plan on a Subscription whose version has advanced since the
      client last observed it is rejected. A plan change legitimately supersedes
      the prior plan (recomputing price_cents), so a second change that carries a
      stale expected_subscription_version is operating on an out-of-date view of
      the subscription and is refused with a precondition failure.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: gross_vs_net_probate_estate
    trigger: "GET /v1/subscriptions/{id}/estate-summary"
    algorithm: aggregation
    formula: |
      gross_estate_value_cents = sum(a.estimated_value_cents
        for a in Assets where a.subscription_id == sub.id)
      net_probate_estate_cents = sum(a.estimated_value_cents
        for a in Assets where a.subscription_id == sub.id
        AND a.funding_status != FUNDED
        AND a.assigned_beneficiary_id is null)
    input_set: "All Assets of the subscription (no status filter — assets have no lifecycle state)."
    constants: {}
    precision: "integer cents; no rounding needed"
    variants:
      - name: gross
        when: "total estate valuation shown to the member"
        difference: "includes every asset regardless of funding or beneficiary designation"
      - name: net_probate
        when: "estimate of what passes through probate"
        difference: "excludes FUNDED (in-trust, non-probate) assets and assets with a beneficiary designation (assigned_beneficiary_id set); same asset rows, different inclusion predicate, different total"

  - name: signup_price
    trigger: "POST /v1/subscriptions ; POST /v1/subscriptions/{id}/change-plan"
    algorithm: tiered_pricing
    formula: |
      base = PlanCatalog[plan_tier].base_price_cents
      addon = ATTORNEY_ADDON_CENTS if attorney_support else 0
      multiplier = BUNDLE_MULTIPLIER[bundle_type]
      price_cents = round_half_up( (base + addon) * multiplier )
    input_set: "The subscription's own plan_tier, attorney_support flag, and bundle_type."
    constants:
      ATTORNEY_ADDON_CENTS: 15000
      BUNDLE_MULTIPLIER_INDIVIDUAL: 1.0
      BUNDLE_MULTIPLIER_COUPLE: 1.6
      BASE_BASIC_CENTS: 10000
      BASE_PLUS_CENTS: 20000
      BASE_PREMIER_CENTS: 35000
    precision: "round_half_up to whole cents; multiplication performed once on the (base+addon) sum, then rounded (round-then-nothing: single rounding step)"

  - name: renewal_provisional_quote
    trigger: "POST /v1/subscriptions/{id}/renew (initiation)"
    algorithm: tiered_pricing
    formula: |
      base = PlanCatalog[current plan_tier].base_price_cents   # current catalog value at quote time
      addon = ATTORNEY_ADDON_CENTS if attorney_support else 0
      multiplier = BUNDLE_MULTIPLIER[bundle_type]
      quote_cents = round_half_up( (base + addon) * multiplier )
    input_set: "Current catalog base price for the tier + subscription add-on/bundle. NO loyalty discount applied at quote time."
    constants:
      ATTORNEY_ADDON_CENTS: 15000
    precision: "round_half_up to whole cents"
    variants:
      - name: provisional_quote
        when: "renewal initiation — becomes pending_charge_cents"
        difference: "loyalty discount NOT applied; equals the undiscounted list price"
      - name: final_charge
        when: "renewal settlement (payment SUCCEEDED)"
        difference: "loyalty discount applied to the quote; charged amount is strictly lower whenever loyalty_pct > 0 — see renewal_final_charge"

  - name: renewal_final_charge
    trigger: "Subscription ACTIVE->ACTIVE / SUSPENDED->ACTIVE renewal settlement"
    algorithm: threshold
    formula: |
      new_renewal_count = renewal_count + 1        # incremented BEFORE discount lookup
      loyalty_pct = LOYALTY_TIER(new_renewal_count) # 1..2 -> 0.10 ; >=3 -> 0.20 ; else 0.0
      final_charge_cents = round_half_up( pending_charge_cents * (1 - loyalty_pct) )
    input_set: "pending_charge_cents (the stored provisional quote) and the post-increment renewal_count."
    constants:
      LOYALTY_TIER_1_2_PCT: 0.10
      LOYALTY_TIER_3_PLUS_PCT: 0.20
    precision: "round_half_up to whole cents"

  - name: estate_distribution
    trigger: "recomputed on Beneficiary create and on any Asset create/assign that changes gross_estate_value_cents"
    algorithm: waterfall_allocation
    formula: |
      pool = gross_estate_value_cents                       # (sum of all asset values)
      primaries = [b for b in Beneficiaries where subscription matches AND is_contingent == false]
      for b in primaries: floor_share[b] = floor(pool * b.allocation_pct / 100)
      residual = pool - sum(floor_share[b] for b in primaries)   # (>= 0 when sum of pct <= 100)
      # distribute residual one cent at a time to primaries ordered by created_at ASC
      order = primaries sorted by created_at ASC
      for i in 0..residual-1: allocated_cents[ order[i mod len(order)] ] += 1
      allocated_cents[b] = floor_share[b] + assigned residual ; contingent -> 0
    input_set: "Primary (non-contingent) beneficiaries and gross_estate_value_cents."
    constants: {}
    precision: "integer cents; rounding order pinned as floor-per-beneficiary then residual-by-created_at-ASC (NOT round-each-then-sum)"

  - name: cancel_refund
    trigger: "POST /v1/subscriptions/{id}/cancel (from ACTIVE or SUSPENDED with a paid period)"
    algorithm: aggregation
    formula: |
      if current_period_end is null: refund = 0
      else:
        total_days = TERM_DAYS (365)
        remaining_days = max(0, ceil_days(current_period_end - now))
        last_period_charge = price_cents            # the most recently applicable list price
        refund = round_half_up( last_period_charge * remaining_days / total_days )
        refund = min(refund, paid_to_date_cents)    # never refund more than settled
    input_set: "Remaining days in the current coverage window and the subscription list price."
    constants:
      TERM_DAYS: 365
    precision: "round_half_up to whole cents"

  - name: witness_requirement
    trigger: "computed on EstateDocument creation (POST /v1/documents)"
    algorithm: threshold
    formula: |
      base = WITNESS_BASE[document_type]      # WILL 2, TRUST 0, POA 1, HEALTHCARE_DIRECTIVE 1
      surcharge = 1 if state_code in {LA, VT} else 0
      witness_count_required = base + surcharge
      requires_notary = (document_type in {TRUST, POA}) OR (state_code == 'LA')
    input_set: "The document's document_type and state_code."
    constants:
      WITNESS_BASE_WILL: 2
      WITNESS_BASE_TRUST: 0
      WITNESS_BASE_POA: 1
      WITNESS_BASE_HEALTHCARE_DIRECTIVE: 1
      WITNESS_SURCHARGE_STATES: "{LA, VT}"
    precision: "integer count"

  - name: questionnaire_completeness
    trigger: "POST /v1/questionnaires/{id}/answers"
    algorithm: aggregation
    formula: |
      required = REQUIRED_FIELDS[document_type]   # WILL 5, TRUST 7, POA 4, HEALTHCARE_DIRECTIVE 4
      answered_field_count = min(required, count of distinct required keys present in merged answers)
      completeness_pct = round_half_up(answered_field_count / required * 100, 2)
    input_set: "The merged answers object against the required key set for the document_type."
    constants:
      REQUIRED_FIELDS_WILL: 5
      REQUIRED_FIELDS_TRUST: 7
      REQUIRED_FIELDS_POA: 4
      REQUIRED_FIELDS_HEALTHCARE_DIRECTIVE: 4
    precision: "round_half_up to 2 decimals; == 100 exactly gates COMPLETED"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /v1/members"
  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path-referenced resources exist, validated left-to-right"
    error_id: ERR_SUBSCRIPTION_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with resource ids in the path"
  - priority: 4
    category: auth
    check: "for Member-owned resources, acting X-User-ID equals the owning Member id of the resource's subscription chain"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all Member-role mutations on owned resources"
  - priority: 5
    category: state
    check: "target resource is in a state from which this transition is allowed (e.g. cancel requires non-terminal; execute requires GENERATED/PENDING_EXECUTION)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: state
    check: "generating or executing a document requires owning Subscription.status == ACTIVE"
    error_id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /v1/documents ; POST /v1/documents/{id}/execute"
  - priority: 7
    category: state
    check: "operating on a terminal resource is rejected"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "cancel, revoke, respond, decision, execute on terminal targets"
  - priority: 8
    category: business_referential
    check: "assign-beneficiary body beneficiary_id references an existing Beneficiary of the same subscription"
    error_id: ERR_BENEFICIARY_NOT_FOUND
    http_status: 404
    applies_to: "POST /v1/assets/{id}/assign-beneficiary"
  - priority: 9
    category: business_referential
    check: "share-grant body document_id references an existing EstateDocument; plan_tier references an existing PlanCatalog"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /v1/subscriptions ; POST /v1/subscriptions/{id}/change-plan"
  - priority: 10
    category: business_temporal
    check: "a member may not hold two subscriptions whose [current_period_start, current_period_end) half-open windows overlap (adjacency allowed: new.start == existing.end is OK). Evaluated when a period is set — i.e. at activation of a PENDING_PAYMENT subscription and at renewal settlement — against the member's other non-terminal subscriptions."
    error_id: ERR_SUBSCRIPTION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /v1/_payments/simulate (activation and renewal settlement)"
  - priority: 11
    category: business_temporal
    check: "renewal initiation requires now within [current_period_end - RENEWAL_WINDOW_DAYS, current_period_end + GRACE_DAYS]; too early -> WINDOW_NOT_OPEN, too late -> TOO_LATE"
    error_id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /v1/subscriptions/{id}/renew"
  - priority: 12
    category: business_temporal
    check: "a new ACTIVE ShareGrant for the same grantee_email + document_id whose [created_at, expires_at] CLOSED window touches or overlaps an existing ACTIVE grant's window is rejected (adjacency NOT allowed)"
    error_id: ERR_SHARE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /v1/share-grants"
  - priority: 13
    category: business_constraint
    check: "share-grant target document must be EXECUTED"
    error_id: ERR_DOCUMENT_NOT_EXECUTED
    http_status: 409
    applies_to: "POST /v1/share-grants"
  - priority: 14
    category: business_constraint
    check: "assign-beneficiary target asset must not be FUNDED (funded/in-trust assets cannot carry a probate earmark)"
    error_id: ERR_ASSET_ALREADY_FUNDED
    http_status: 422
    applies_to: "POST /v1/assets/{id}/assign-beneficiary"
  - priority: 15
    category: business_constraint
    check: "submit-review requires owning Subscription.attorney_support == true"
    error_id: ERR_ATTORNEY_SUPPORT_NOT_ENABLED
    http_status: 422
    applies_to: "POST /v1/documents/{id}/submit-review"
  - priority: 16
    category: business_constraint
    check: "generation document_type must be in PlanCatalog.included_document_types (and allows_trust for TRUST)"
    error_id: ERR_DOCUMENT_TYPE_NOT_IN_PLAN
    http_status: 422
    applies_to: "POST /v1/documents"
  - priority: 17
    category: business_constraint
    check: "generation requires source Questionnaire.status == COMPLETED (completeness_pct == 100)"
    error_id: ERR_QUESTIONNAIRE_INCOMPLETE
    http_status: 422
    applies_to: "POST /v1/documents"
  - priority: 18
    category: business_constraint
    check: "executing a WILL requires >= 1 non-contingent Beneficiary on the subscription (empty-set boundary)"
    error_id: ERR_NO_BENEFICIARIES
    http_status: 422
    applies_to: "POST /v1/documents/{id}/execute"
  - priority: 19
    category: business_constraint
    check: "execute requires witnesses_count >= witness_count_required"
    error_id: ERR_WITNESS_REQUIREMENT_NOT_MET
    http_status: 422
    applies_to: "POST /v1/documents/{id}/execute"
  - priority: 20
    category: business_constraint
    check: "sum of allocation_pct over non-contingent Beneficiaries (including the new one) must be <= 100.00 (boundary: exactly 100.00 allowed, > 100.00 rejected)"
    error_id: ERR_ALLOCATION_EXCEEDED
    http_status: 422
    applies_to: "POST /v1/beneficiaries"
  - priority: 21
    category: business_fiscal
    check: "count of non-REVOKED EstateDocuments on the subscription must be < PlanCatalog.max_documents before generation"
    error_id: ERR_DOCUMENT_QUOTA_EXCEEDED
    http_status: 422
    applies_to: "POST /v1/documents"
  - priority: 22
    category: state
    check: "OCC: expected_subscription_version must equal current Subscription.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /v1/subscriptions/{id}/change-plan"
  - priority: 23
    category: business_constraint
    check: "payment already settled (no pending charge / wrong state) is rejected"
    error_id: ERR_PAYMENT_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /v1/_payments/simulate"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  - method: POST
    path: "/v1/plan-catalog"
    description: "Create a plan catalog entry."
    roles: [PlatformAdmin]
    code: 201
    input: [plan_tier, base_price_cents, included_document_types, max_documents, allows_trust]
    output: PlanCatalog
    side_effects: []

  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call to this endpoint the clock reads exactly that default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to the supplied instant"]

  - method: POST
    path: "/v1/_payments/simulate"
    description: "Simulate a payment result against a subscription's outstanding charge, driving activation, renewal settlement, reinstatement, or expiry."
    roles: [PlatformAdmin]
    code: 200
    input: [subscription_id, outcome]
    output: Subscription
    side_effects:
      - "PENDING_PAYMENT + SUCCEEDED -> ACTIVE (sets period, paid_to_date)"
      - "PENDING_PAYMENT + FAILED -> EXPIRED"
      - "ACTIVE + renewal_pending + SUCCEEDED -> renewal settled (renewal_final_charge, period extended, renewal_count++)"
      - "ACTIVE + renewal_pending + FAILED -> SUSPENDED"
      - "SUSPENDED + SUCCEEDED (within grace) -> ACTIVE reinstated"
      - "SUSPENDED + FAILED (grace elapsed) -> EXPIRED"

  - method: POST
    path: "/v1/members"
    description: "Register a member account."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, state_code]
    output: Member
    side_effects: []

  - method: GET
    path: "/v1/members/{id}"
    description: "Fetch a member."
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/v1/members/{id}/subscriptions"
    description: "List a member's subscriptions (FK reverse for Subscription.member_id)."
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: POST
    path: "/v1/subscriptions"
    description: "Create a subscription in PENDING_PAYMENT with the signup price as the outstanding charge."
    roles: [Member]
    code: 201
    input: [member_id, plan_tier, "bundle_type?", "spouse_name?", "spouse_email?", "attorney_support?"]
    output: Subscription
    side_effects:
      - "price_cents = signup_price; pending_charge_cents = price_cents"
      - "period-overlap check against member's other subscriptions"

  - method: GET
    path: "/v1/subscriptions/{id}"
    description: "Fetch a subscription."
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: POST
    path: "/v1/subscriptions/{id}/change-plan"
    description: "Change plan tier (OCC-guarded); recomputes price."
    roles: [Member]
    code: 200
    input: [new_plan_tier, expected_subscription_version]
    output: Subscription
    side_effects:
      - "plan_tier and price_cents updated"
      - "increments Subscription.version by 1"

  - method: POST
    path: "/v1/subscriptions/{id}/cancel"
    description: "Cancel the subscription; refunds prorata and cascades revocation to documents, share grants, and executors."
    roles: [Member]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "cancel_refund applied to refunded_cents / paid_to_date_cents"
      - "cascade chain-1: documents REVOKED -> share grants REVOKED; executors REVOKED"

  - method: POST
    path: "/v1/subscriptions/{id}/renew"
    description: "Initiate renewal within the renewal window; sets the provisional quote as the outstanding charge."
    roles: [Member]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "renewal_pending = true; pending_charge_cents = renewal_provisional_quote"

  - method: GET
    path: "/v1/subscriptions/{id}/questionnaires"
    description: "List questionnaires of a subscription (FK reverse for Questionnaire.subscription_id)."
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Questionnaire[]
    side_effects: []

  - method: GET
    path: "/v1/subscriptions/{id}/documents"
    description: "List documents of a subscription (FK reverse for EstateDocument.subscription_id)."
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: EstateDocument[]
    side_effects: []

  - method: GET
    path: "/v1/subscriptions/{id}/beneficiaries"
    description: "List beneficiaries of a subscription (FK reverse for Beneficiary.subscription_id)."
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Beneficiary[]
    side_effects: []

  - method: GET
    path: "/v1/subscriptions/{id}/assets"
    description: "List assets of a subscription (FK reverse for Asset.subscription_id)."
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Asset[]
    side_effects: []

  - method: GET
    path: "/v1/subscriptions/{id}/executors"
    description: "List executors of a subscription (FK reverse for Executor.subscription_id)."
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Executor[]
    side_effects: []

  - method: GET
    path: "/v1/subscriptions/{id}/estate-summary"
    description: "Computed read: gross vs net-probate estate valuation and allocation totals."
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: { gross_estate_value_cents: integer, net_probate_estate_cents: integer, total_assigned_value_cents: integer, total_allocated_cents: integer, primary_beneficiary_count: integer }
    side_effects: []

  - method: POST
    path: "/v1/questionnaires"
    description: "Start a guided intake for a document type; sets required_field_count from the document_type."
    roles: [Member]
    code: 201
    input: [subscription_id, document_type, state_code]
    output: Questionnaire
    side_effects: ["required_field_count set; status IN_PROGRESS"]

  - method: GET
    path: "/v1/questionnaires/{id}"
    description: "Fetch a questionnaire."
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: Questionnaire
    side_effects: []

  - method: POST
    path: "/v1/questionnaires/{id}/answers"
    description: "Submit answers; recomputes completeness and may transition to COMPLETED."
    roles: [Member]
    code: 200
    input: [answers]
    output: Questionnaire
    side_effects: ["answered_field_count / completeness_pct recomputed; COMPLETED at 100"]

  - method: GET
    path: "/v1/questionnaires/{id}/documents"
    description: "List documents generated from a questionnaire (FK reverse for EstateDocument.questionnaire_id)."
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: EstateDocument[]
    side_effects: []

  - method: POST
    path: "/v1/documents"
    description: "Generate a state-specific document from a COMPLETED questionnaire; locks the questionnaire."
    roles: [Member]
    code: 201
    input: [questionnaire_id]
    output: EstateDocument
    side_effects:
      - "document_type/state_code copied; doc_version, requires_notary, witness_count_required computed"
      - "source Questionnaire COMPLETED -> LOCKED"

  - method: GET
    path: "/v1/documents/{id}"
    description: "Fetch a document."
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: EstateDocument
    side_effects: []

  - method: POST
    path: "/v1/documents/{id}/submit-review"
    description: "Send a GENERATED document to attorney review (requires attorney_support add-on)."
    roles: [Member]
    code: 200
    input: []
    output: EstateDocument
    side_effects: ["creates AttorneyReview (REQUESTED); document -> IN_REVIEW"]

  - method: POST
    path: "/v1/documents/{id}/execute"
    description: "Notarize/witness and execute the document; supersedes any prior executed document of same type."
    roles: [Notary]
    code: 200
    input: [witnesses_count]
    output: EstateDocument
    side_effects:
      - "status -> EXECUTED; execution_date set"
      - "cascade chain-2: prior EXECUTED doc of same type -> SUPERSEDED -> its share grants REVOKED"

  - method: GET
    path: "/v1/documents/{id}/share-grants"
    description: "List share grants for a document (FK reverse for ShareGrant.document_id)."
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ShareGrant[]
    side_effects: []

  - method: GET
    path: "/v1/documents/{id}/attorney-reviews"
    description: "List attorney reviews for a document (FK reverse for AttorneyReview.document_id)."
    roles: [Member, Attorney, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: AttorneyReview[]
    side_effects: []

  - method: POST
    path: "/v1/attorney-reviews/{id}/decision"
    description: "Attorney advances a review (START_REVIEW / REQUEST_CHANGES / APPROVE), driving the document's revision loop."
    roles: [Attorney]
    code: 200
    input: [action, "notes?"]
    output: AttorneyReview
    side_effects: ["review status advances; owning document transitions per action"]

  - method: POST
    path: "/v1/beneficiaries"
    description: "Add a beneficiary; enforces the 100.00% primary allocation cap."
    roles: [Member]
    code: 201
    input: [subscription_id, full_name, relationship, allocation_pct, "is_contingent?"]
    output: Beneficiary
    side_effects: ["estate_distribution recomputed across primary beneficiaries"]

  - method: GET
    path: "/v1/beneficiaries/{id}"
    description: "Fetch a beneficiary."
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: Beneficiary
    side_effects: []

  - method: GET
    path: "/v1/beneficiaries/{id}/assets"
    description: "List assets earmarked to a beneficiary (FK reverse for Asset.assigned_beneficiary_id)."
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Asset[]
    side_effects: []

  - method: POST
    path: "/v1/assets"
    description: "Add an asset to the inventory."
    roles: [Member]
    code: 201
    input: [subscription_id, asset_type, description, estimated_value_cents, "funding_status?", "assigned_beneficiary_id?"]
    output: Asset
    side_effects: ["estate_distribution recomputed (gross estate changed)"]

  - method: POST
    path: "/v1/assets/{id}/assign-beneficiary"
    description: "Earmark (or re-earmark) an asset to a beneficiary as a specific bequest."
    roles: [Member]
    code: 200
    input: [beneficiary_id]
    output: Asset
    side_effects: ["assigned_beneficiary_id set; total_assigned_value conserved on re-earmark"]

  - method: POST
    path: "/v1/executors"
    description: "Nominate an executor."
    roles: [Member]
    code: 201
    input: [subscription_id, full_name, email, priority_order]
    output: Executor
    side_effects: []

  - method: POST
    path: "/v1/executors/{id}/respond"
    description: "Record the executor's acceptance or declination."
    roles: [Member]
    code: 200
    input: [decision]
    output: Executor
    side_effects: ["status NOMINATED -> ACCEPTED / DECLINED"]

  - method: POST
    path: "/v1/share-grants"
    description: "Securely share an EXECUTED document with a grantee; window-overlap checked."
    roles: [Member]
    code: 201
    input: [document_id, grantee_email, scope, expires_at]
    output: ShareGrant
    side_effects: []

  - method: POST
    path: "/v1/share-grants/{id}/revoke"
    description: "Revoke an active share grant."
    roles: [Member]
    code: 200
    input: []
    output: ShareGrant
    side_effects: ["status -> REVOKED"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown auth headers on a protected endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted, or Member acting on a resource it does not own"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, malformed value, or invalid enum member"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "member id does not exist"
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "subscription id does not exist"
  - id: ERR_QUESTIONNAIRE_NOT_FOUND
    http: 404
    condition: "questionnaire id does not exist"
  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: "document id does not exist"
  - id: ERR_BENEFICIARY_NOT_FOUND
    http: 404
    condition: "beneficiary id (path or assign body) does not exist for the subscription"
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "asset id does not exist"
  - id: ERR_EXECUTOR_NOT_FOUND
    http: 404
    condition: "executor id does not exist"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "attorney-review id does not exist"
  - id: ERR_SHARE_GRANT_NOT_FOUND
    http: 404
    condition: "share-grant id does not exist"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "referenced plan_tier is not in PlanCatalog"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not allowed from the resource's current state"
  - id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http: 409
    condition: "document generation/execution attempted while owning subscription is not ACTIVE"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "operation attempted on a terminal resource"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_subscription_version does not match current Subscription.version"
  - id: ERR_SUBSCRIPTION_PERIOD_OVERLAP
    http: 409
    condition: "member's subscription periods (half-open) would overlap"
  - id: ERR_SHARE_WINDOW_OVERLAP
    http: 409
    condition: "share grant validity window (closed) touches/overlaps an existing active grant for same grantee+document"
  - id: ERR_DOCUMENT_NOT_EXECUTED
    http: 409
    condition: "share grant requested for a non-EXECUTED document"
  - id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http: 422
    condition: "renewal initiated before the renewal window opens"
  - id: ERR_RENEWAL_TOO_LATE
    http: 422
    condition: "renewal initiated after grace has elapsed"
  - id: ERR_QUESTIONNAIRE_INCOMPLETE
    http: 422
    condition: "generation attempted while questionnaire completeness_pct < 100"
  - id: ERR_DOCUMENT_TYPE_NOT_IN_PLAN
    http: 422
    condition: "document_type not permitted by the plan (or TRUST when allows_trust is false)"
  - id: ERR_DOCUMENT_QUOTA_EXCEEDED
    http: 422
    condition: "non-REVOKED document count has reached PlanCatalog.max_documents"
  - id: ERR_ALLOCATION_EXCEEDED
    http: 422
    condition: "sum of non-contingent beneficiary allocation_pct would exceed 100.00"
  - id: ERR_NO_BENEFICIARIES
    http: 422
    condition: "executing a WILL with zero non-contingent beneficiaries"
  - id: ERR_WITNESS_REQUIREMENT_NOT_MET
    http: 422
    condition: "witnesses_count below witness_count_required at execution"
  - id: ERR_ATTORNEY_SUPPORT_NOT_ENABLED
    http: 422
    condition: "submit-review without the attorney_support add-on"
  - id: ERR_ASSET_ALREADY_FUNDED
    http: 422
    condition: "assign-beneficiary on a FUNDED asset"
  - id: ERR_PAYMENT_ALREADY_SETTLED
    http: 409
    condition: "payment simulated against a subscription with no outstanding charge / incompatible state"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated public caller; may only register a member account."
    identity: opaque
    exclusive_operations:
      - "POST /v1/members"
    shared_operations: []

  - name: Member
    description: "Account holder who builds and manages their estate plan and subscription."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /v1/subscriptions"
      - "POST /v1/subscriptions/{id}/change-plan"
      - "POST /v1/subscriptions/{id}/cancel"
      - "POST /v1/subscriptions/{id}/renew"
      - "POST /v1/questionnaires"
      - "POST /v1/questionnaires/{id}/answers"
      - "POST /v1/documents"
      - "POST /v1/documents/{id}/submit-review"
      - "POST /v1/beneficiaries"
      - "POST /v1/assets"
      - "POST /v1/assets/{id}/assign-beneficiary"
      - "POST /v1/executors"
      - "POST /v1/executors/{id}/respond"
      - "POST /v1/share-grants"
      - "POST /v1/share-grants/{id}/revoke"
    shared_operations:
      - "GET (own resources): members/{id}, subscriptions/{id} and its sub-resource lists, questionnaires, documents, beneficiaries, estate-summary, attorney-reviews list"

  - name: Attorney
    description: "Reviews documents for members with the attorney_support add-on."
    identity: opaque
    exclusive_operations:
      - "POST /v1/attorney-reviews/{id}/decision"
    shared_operations:
      - "GET /v1/documents/{id}/attorney-reviews"

  - name: Notary
    description: "Notarizes/witnesses and executes documents."
    identity: opaque
    exclusive_operations:
      - "POST /v1/documents/{id}/execute"
    shared_operations: []

  - name: PlatformAdmin
    description: "Operates plan catalog, logical clock, and payment simulation; may read any resource."
    identity: opaque
    exclusive_operations:
      - "POST /v1/plan-catalog"
      - "POST /v1/_clock/set_current_utc"
      - "POST /v1/_payments/simulate"
    shared_operations:
      - "GET on all read endpoints"
