          assert:
            - "HTTP 200 and the response body itself already reports procurement_status PRICE_LOCKED with unit_extended_cents 20000 and extended_price_cents 40000 (${locked_price} == 40000)"
            - "the immediately following GET /repair-orders/${ro_id} reports parts_gross_cents 40000, pre_tax_total_cents 68080, insurer_payable_cents 43080 and customer_pay_cents 25000 - no second read is needed to settle them"
            - "GET /parts-lines/${pl_id} agrees field for field with the accept-price response body"
            - "RepairOrder.${ro_id}.version advanced exactly once across the whole accept-price call, so the line write and the rollup were one atomic change"
            - "no sweep, clock move or other call was issued between the write and the read"

      - name: a_supplement_and_its_decision_are_readable_the_moment_they_land
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Supplement.SUBMITTED_to_PARTIAL
          - entities.RepairOrder.fields.approved_supplement_total_cents
          - endpoints.GET_/repair-orders/{id}/supplements
        distinguishing_aspect: >-
          Both sides of the supplement exchange are immediate: the estimator's request appears in the
          order's supplement list in the next breath, and the adjuster's partial approval has already
          moved the order's approved total when the decision response returns. The PARTIAL path is used
          deliberately, because it is the one whose money figure comes from the decision rather than
          from the request.
        test_recipe:
          setup:
            - "A RepairOrder locked on a BODY 4.5 h line, with a supplement raised for 50000 against the version the estimator read."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Quinn Rae", phone: "555-1064", email: "quinn@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
              payload: { insurer_code: "CRNR-65", name: "Cornerstone Mutual", rate_ceiling_cents: { BODY: 6000, FRAME: 8000, REFINISH: 5800, MECHANICAL: 11000, ALUMINUM_BODY: 8800 } }
              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-90072", vehicle_vin: "1HGCV1F30LA090072", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/teardown-findings"
              payload: { panel_code: "LT-DOOR", severity: "MODERATE" }
              as: Estimator
              as_user_id: "est-100"
              captures: { dl1: $.data.id }
            - call: "POST /repair-orders/${ro_id}/estimate-lines"
              payload: { damage_line_id: "${dl1}", operation_code: "BDY-1", labor_type: "BODY", guide_hours: 4.5 }
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/blueprint"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/estimate/lock"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
            - call: "GET /repair-orders/${ro_id}"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
              captures: { ro_ver: $.data.version }
            - call: "POST /repair-orders/${ro_id}/supplements"
              payload: { reason_code: "HIDDEN-DAMAGE", requested_amount_cents: 50000, expected_repair_order_version: "${ro_ver}" }
              as: Estimator
              as_user_id: "est-100"
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /supplements/${sup_id}/decision"
              payload: { decision: "PARTIAL", approved_amount_cents: 30000 }
              as: InsurerAdjuster
              as_user_id: "${ins_id}"
              captures: { decided: $.data.decided_at }
          assert:
            - "HTTP 200 and the decision response already carries status PARTIAL, approved_amount_cents 30000 and a non-null decided_at (${decided})"
            - "the immediately following GET /repair-orders/${ro_id} reports approved_supplement_total_cents 30000 - the request's 50000 never appears"
            - "GET /repair-orders/${ro_id}/supplements returned total_count 1 straight after the supplement was raised, with status SUBMITTED and round_count 1"
            - "GET /supplements/${sup_id} agrees field for field with the decision response body"
            - "RepairOrder.${ro_id}.version advanced by exactly one across the decision call"
