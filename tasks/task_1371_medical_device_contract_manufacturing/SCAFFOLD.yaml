    roles: [QualityEngineer]
    code: 201
    input: [capa_code, dmr_id, source_type, "source_complaint_id?", "source_ncr_id?", "process_change?"]
    output: CAPA
    side_effects: ["status=INITIATED", "initiator_user_id=X-User-ID", "effectiveness_cycles=0"]

  - method: GET
    path: "/api/capas"
    description: "List CAPAs (filters: dmr, status, source links)"
    roles: [QualityEngineer, QualityManager, ProductionOperator, SupplierQualityEngineer, RegulatoryAffairs, QMSAdmin]
    code: 200
    input: ["dmr_id?", "status?", "source_complaint_id?", "source_ncr_id?", "limit?", "offset?"]
    output: "CAPA[]"
    side_effects: []

  - method: GET
    path: "/api/capas/{id}"
    description: "Get one CAPA"
    roles: [QualityEngineer, QualityManager, ProductionOperator, SupplierQualityEngineer, RegulatoryAffairs, QMSAdmin]
    code: 200
    input: []
    output: CAPA
    side_effects: []

  - method: POST
    path: "/api/capas/{id}/begin-investigation"
    description: "INITIATED -> INVESTIGATING"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: CAPA
    side_effects: ["status=INVESTIGATING"]

  - method: POST
    path: "/api/capas/{id}/plan-actions"
    description: "INVESTIGATING -> ACTION_PLANNED (records action_summary)"
    roles: [QualityEngineer]
    code: 200
    input: [action_summary]
    output: CAPA
    side_effects: ["status=ACTION_PLANNED"]

  - method: POST
    path: "/api/capas/{id}/implement"
    description: "ACTION_PLANNED -> IMPLEMENTING; process_change=true triggers protocol revalidation cascade"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: CAPA
    side_effects: ["status=IMPLEMENTING", "process_change: VALIDATED protocols of DMR -> REVALIDATION_REQUIRED (CAPA_PROCESS_CHANGE) -> in-flight lots ON_HOLD (REVALIDATION)"]

  - method: POST
    path: "/api/capas/{id}/complete-implementation"
    description: "IMPLEMENTING -> EFFECTIVENESS_CHECK"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: CAPA
    side_effects: ["status=EFFECTIVENESS_CHECK"]

  - method: POST
    path: "/api/capas/{id}/verify-effectiveness"
    description: "EFFECTIVENESS_CHECK -> CLOSED (effective=true) or INEFFECTIVE (effective=false); verifier != initiator; source NCR must be CLOSED"
    roles: [QualityManager]
    code: 200
    input: [effective]
    output: CAPA
    side_effects: ["status=CLOSED|INEFFECTIVE", "on CLOSED: closer_user_id=X-User-ID"]

  - method: POST
    path: "/api/capas/{id}/restart-investigation"
    description: "INEFFECTIVE -> INVESTIGATING (effectiveness_cycles += 1)"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: CAPA
    side_effects: ["status=INVESTIGATING", "effectiveness_cycles+=1"]

  # --- FieldAction ---
  - method: POST
    path: "/api/field-actions"
    description: "Draft a field action scoped by manufacturing window; requires confirmed severe complaint on same DMR"
    roles: [RegulatoryAffairs]
    code: 201
    input: [action_code, dmr_id, action_type, scope_mfg_start, scope_mfg_end, reason_complaint_id]
    output: FieldAction
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/api/field-actions"
    description: "List field actions (filters: dmr, status, reason complaint)"
    roles: [QualityEngineer, QualityManager, ProductionOperator, SupplierQualityEngineer, RegulatoryAffairs, QMSAdmin]
    code: 200
    input: ["dmr_id?", "status?", "reason_complaint_id?", "limit?", "offset?"]
    output: "FieldAction[]"
    side_effects: []

  - method: GET
    path: "/api/field-actions/{id}"
    description: "Get one field action"
    roles: [QualityEngineer, QualityManager, ProductionOperator, SupplierQualityEngineer, RegulatoryAffairs, QMSAdmin]
    code: 200
    input: []
    output: FieldAction
    side_effects: []

  - method: POST
    path: "/api/field-actions/{id}/issue"
    description: "Issue the field action: in-scope RELEASED lots -> RECALLED, their labels VOID, rate recomputed"
    roles: [RegulatoryAffairs]
    code: 200
    input: []
    output: FieldAction
    side_effects: ["status=ISSUED", "issued_at=now", "in-scope RELEASED lots -> RECALLED (labels VOID LOT_RECALLED)", "recalled_lot_count set", "dmr rate recomputed (denominator drops recalled lots)"]

  - method: POST
    path: "/api/field-actions/{id}/close"
    description: "Close an ISSUED field action (reason complaint must be CLOSED)"
    roles: [RegulatoryAffairs]
    code: 200
    input: []
    output: FieldAction
    side_effects: ["status=CLOSED"]

  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock (monotonic forward only, ERR_CLOCK_REGRESSION otherwise). Startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock. Setting the clock fires time sweeps: ACTIVE agreements with now >= effective_to -> EXPIRED (supplier-suspension cascade); VALIDATED protocols with now >= revalidation_due_at -> REVALIDATION_REQUIRED (TIME_EXPIRY, lot-hold cascade)"
    roles: [QMSAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["agreement expiry sweep", "protocol revalidation sweep"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID attempted a step forbidden to the initiator/executor/author of the record" }
  # --- shape / existence / concurrency ---
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, bad type, invalid enum value, non-positive quantity, malformed datetime, or inverted window (start >= end)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body-referenced FK id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_CLOCK_REGRESSION, http: 400, condition: "Attempt to move the logical clock backwards (or to a non-UTC/non-ISO8601 value)" }
  # --- state machine ---
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Trigger not declared from the entity's current state (includes terminal-state lockdown)" }
  - { id: ERR_LOT_ON_HOLD, http: 409, condition: "Release attempted while lot hold_status == ON_HOLD" }
  - { id: ERR_HOLD_CONDITION_UNRESOLVED, http: 409, condition: "release-hold attempted but the hold_reason's resolution condition is not met (or hold is STERILITY_FAILURE/FIELD_ACTION)" }
  - { id: ERR_STERILITY_ALREADY_RESULTED, http: 409, condition: "record-sterility-result on a lot whose sterility_result is not PENDING" }
  - { id: ERR_LOT_NOT_COMPLETED, http: 409, condition: "Label print requires lot disposition COMPLETED" }
  # --- safety ---
  - { id: ERR_STERILITY_NOT_PASSED, http: 409, condition: "Release of sterile-DMR lot requires sterility_result == PASSED" }
  - { id: ERR_PROTOCOL_NOT_VALIDATED, http: 409, condition: "Lot create/release requires the referenced validation protocol in VALIDATED" }
  - { id: ERR_OPEN_NCRS_EXIST, http: 409, condition: "Release blocked by NCRs on the lot in OPEN or CONTAINED" }
  - { id: ERR_NO_PRINTED_LABEL, http: 409, condition: "Release requires a PRINTED UDILabel whose label_revision matches the lot's DMR revision" }
  - { id: ERR_DMR_NOT_APPROVED, http: 409, condition: "Operation requires the DMR (revision) in APPROVED status" }
  - { id: ERR_LOT_NOT_RELEASED, http: 409, condition: "Complaint intake requires the lot in RELEASED or RECALLED" }
  # --- temporal ---
  - { id: ERR_AGREEMENT_NOT_IN_EFFECT, http: 409, condition: "Agreement activation requires effective_from <= now < effective_to" }
  - { id: ERR_CHANGE_NOTICE_WINDOW_BREACHED, http: 409, condition: "SCN proposed_effective_date - notified_at(now) < ACTIVE agreement's change_notice_days" }
  - { id: ERR_AUDIT_WINDOW_OVERLAP, http: 409, condition: "Audit window overlaps another SCHEDULED audit of the same supplier (half-open; touching endpoints allowed)" }
  - { id: ERR_AUDIT_NOTICE_WINDOW_BREACHED, http: 409, condition: "Audit scheduled_start - now < ACTIVE agreement's audit_notice_days" }
  - { id: ERR_LINE_WINDOW_CONFLICT, http: 409, condition: "Protocol planned window violates the line's changeover_buffer_hours gap versus another occupying protocol (occupying statuses: DRAFT, IQ_*, OQ_*, PQ_*)" }
  # --- referential ---
  - { id: ERR_PART_NOT_OF_SUPPLIER, http: 422, condition: "SCN supplier_part_id references a part of a different supplier" }
  - { id: ERR_PROTOCOL_DMR_MISMATCH, http: 422, condition: "Lot's validation_protocol_id validates a different DMR revision" }
  - { id: ERR_LABEL_REVISION_MISMATCH, http: 422, condition: "Label approve: label_revision != revision_code of the currently APPROVED revision of the lot's device_code family" }
  - { id: ERR_SOURCE_MISMATCH, http: 422, condition: "CAPA source linkage invalid for source_type, or source belongs to a different DMR" }
  - { id: ERR_COMPLAINT_NOT_ACTIONABLE, http: 422, condition: "Field action requires reason complaint confirmed=true, severity in {SERIOUS_INJURY, DEATH}, and complaint lot's dmr_id == field action dmr_id" }
  # --- constraint ---
  - { id: ERR_DUPLICATE_DMR_REVISION, http: 409, condition: "(device_code, revision_code) already exists" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "Unique code collision (supplier_code, line_code, agreement_code, part_number per supplier, protocol_code, lot_number per DMR, ncr_code, complaint_code, capa_code, action_code)" }
  - { id: ERR_DUPLICATE_COMPONENT_LOT, http: 409, condition: "(lot_id, supplier_part_id, supplier_lot_number) already recorded" }
  - { id: ERR_STUDY_ALREADY_ACTIVE, http: 409, condition: "A SterileBarrierStudy is already IN_PROGRESS for this DMR" }
  - { id: ERR_ACTIVE_LABEL_EXISTS, http: 409, condition: "Another UDILabel of the lot is APPROVED or PRINTED" }
  - { id: ERR_INSUFFICIENT_PART_QUANTITY, http: 409, condition: "Component quantity_used exceeds part quantity_remaining" }
  - { id: ERR_PART_NOT_QUALIFIED, http: 409, condition: "Component commit requires part status QUALIFIED and its supplier status QUALIFIED" }
  - { id: ERR_SUPPLIER_DISQUALIFIED, http: 409, condition: "Operation forbidden while supplier is DISQUALIFIED (agreement activation)" }
  - { id: ERR_SUPPLIER_NOT_CLEAR, http: 409, condition: "Part reinstate blocked while supplier is SUSPENDED or DISQUALIFIED" }
  - { id: ERR_SCN_PENDING, http: 409, condition: "Part reinstate blocked while an SCN on the part is SUBMITTED or UNDER_REVIEW" }
  - { id: ERR_NO_ACTIVE_QUALITY_AGREEMENT, http: 409, condition: "Supplier qualify/reinstate requires at least one ACTIVE quality agreement" }
  - { id: ERR_SCORE_BELOW_REINSTATE_THRESHOLD, http: 409, condition: "Supplier reinstate requires quality_score >= 50" }
  - { id: ERR_NO_COMPONENTS_RECORDED, http: 409, condition: "Lot completion requires at least one LotComponent" }
  - { id: ERR_LOTS_IN_FLIGHT, http: 409, condition: "DMR obsolete blocked: lots in IN_PRODUCTION/COMPLETED reference this revision" }
  - { id: ERR_PROTOCOLS_IN_FLIGHT, http: 409, condition: "DMR obsolete blocked: protocols in DRAFT..PQ_REVIEW reference this revision" }
  - { id: ERR_CAPA_NOT_CLOSED, http: 409, condition: "Complaint close blocked: a CAPA spawned from it is not CLOSED" }
  - { id: ERR_SOURCE_NOT_CLOSED, http: 409, condition: "CAPA close blocked while source NCR not CLOSED; field-action close blocked while reason complaint not CLOSED" }
  - { id: ERR_DMR_NOT_STERILE, http: 422, condition: "Sterile-barrier study on a non-sterile DMR" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: QualityEngineer
    description: "QMS quality engineer: design transfer drafting, validation execution, studies, NCR/CAPA initiation and disposition, lot holds and scrap"
    identity: opaque
    exclusive_operations:
      - "POST /api/device-master-records; POST /api/device-master-records/{id}/revisions"
      - "POST /api/validation-protocols; POST .../execute-phase; POST .../submit-phase-review"
      - "POST /api/sterile-barrier-studies"
      - "POST /api/device-lots/{id}/place-hold; POST .../release-hold; POST .../scrap; POST .../record-sterility-result"
      - "POST /api/nonconformance-reports; POST .../contain; POST .../disposition; POST .../reopen"
      - "POST /api/capas; POST .../begin-investigation; POST .../plan-actions; POST .../implement; POST .../complete-implementation; POST .../restart-investigation"
    shared_operations: ["all GET endpoints"]
  - name: QualityManager
    description: "Quality manager: approvals and dispositions of record — DMR approve/obsolete, phase approve/reject, study completion, lot release, label approve/void, NCR close, CAPA effectiveness verification"
    identity: opaque
    exclusive_operations:
      - "POST /api/device-master-records/{id}/approve; POST .../obsolete"
      - "POST /api/validation-protocols/{id}/approve-phase; POST .../reject-phase"
      - "POST /api/sterile-barrier-studies/{id}/complete"
      - "POST /api/device-lots/{id}/release"
      - "POST /api/udi-labels/{id}/approve; POST .../void"
      - "POST /api/nonconformance-reports/{id}/close"
      - "POST /api/capas/{id}/verify-effectiveness"
    shared_operations: ["all GET endpoints"]
  - name: ProductionOperator
    description: "Production operator: lot creation/completion, component genealogy recording, label creation and printing"
    identity: opaque
    exclusive_operations:
      - "POST /api/device-lots; POST /api/device-lots/{id}/complete"
      - "POST /api/device-lots/{id}/components; DELETE /api/lot-components/{id}"
      - "POST /api/device-lots/{id}/udi-labels; POST /api/udi-labels/{id}/print"
    shared_operations: ["all GET endpoints"]
  - name: SupplierQualityEngineer
    description: "Supplier quality engineer: supplier lifecycle, quality agreements, parts and receipts, change notifications, audits"
    identity: opaque
    exclusive_operations:
      - "POST /api/suppliers; POST .../qualify; POST .../suspend; POST .../reinstate; POST .../disqualify"
      - "POST /api/suppliers/{id}/quality-agreements; POST /api/quality-agreements/{id}/activate; POST .../terminate"
      - "POST /api/suppliers/{id}/parts; POST /api/supplier-parts/{id}/receive; POST .../reinstate"
      - "POST /api/suppliers/{id}/change-notifications; POST /api/change-notifications/{id}/start-review; POST .../accept; POST .../reject"
      - "POST /api/suppliers/{id}/audits; POST /api/supplier-audits/{id}/complete; POST .../cancel"
    shared_operations: ["all GET endpoints"]
  - name: RegulatoryAffairs
    description: "Regulatory affairs: complaint intake/investigation/closure and field actions"
    identity: opaque
    exclusive_operations:
      - "POST /api/complaints; POST .../start-investigation; POST .../complete-investigation; POST .../reopen; POST .../close"
      - "POST /api/field-actions; POST /api/field-actions/{id}/issue; POST .../close"
    shared_operations: ["all GET endpoints"]
  - name: QMSAdmin
    description: "Quality-system administrator: logical clock and manufacturing-line configuration only"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/manufacturing-lines"
    shared_operations: ["all GET endpoints"]
