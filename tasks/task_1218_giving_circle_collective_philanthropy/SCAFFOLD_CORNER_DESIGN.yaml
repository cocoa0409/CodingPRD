        claim_type: dual_variant_calculation
        grounds:
          - calculations.grant_budget
          - calculations.vetting_score
        excluded_because:
          difficulty_instance: dual_variant_calc / budget_provisional_vs_final_diverge
          rationale: "Both variants computed and asserted (190000 vs 95000); the vetting-score pair is covered by vetting_score_profile_changes_outcome."

      - name: layer_cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds:
          - state_machines.GranteeReport.DUE_to_OVERDUE
          - state_machines.Membership.ACTIVE_to_WITHDRAWN
        excluded_because:
          difficulty_instance: transitive_cascade / overdue_report_suspends_nonprofit_rejects_nomination
          rationale: "Both depth-3 cascades asserted hop-by-hop in §1.8."

      - name: layer_derived_field_reconciliation_covered
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.pooled_balance
          - entities.GivingCycle.fields.pooled_balance_cents
        excluded_because:
          difficulty_instance: compensating_invariant / receive_refund_pooled_conservation
          rationale: "Derived totals asserted after the forward mutation and after its compensation."

      - name: layer_scheduled_actions_covered
        claim_type: scheduled_actions
        grounds:
          - state_machines.GranteeReport.DUE_to_OVERDUE
          - state_machines.SiteVisit.SCHEDULED_to_NO_SHOW
        excluded_because:
          difficulty_instance: transitive_cascade / overdue_report_suspends_nonprofit_rejects_nomination
          rationale: "Clock-driven OVERDUE asserted there; NO_SHOW asserted in corner site_visit_auto_no_show_after_end."
