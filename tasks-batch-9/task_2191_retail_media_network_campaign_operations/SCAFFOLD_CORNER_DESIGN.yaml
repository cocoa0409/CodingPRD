              call: "POST /rmn/catalog-products/${prod_id}/stock-adjustments"
              payload: { delta_units: -48, adjustment_reference: "cycle-count-1" }
              as: CatalogOps
              as_user_id: "u_cat_1"
          assert:
            - "HTTP 200"
            - "CatalogProduct.${prod_id}.in_stock_units == 2"
            - "CatalogProduct.${prod_id}.eligibility_status == OUT_OF_STOCK"
            - "CatalogProduct.${prod_id}.last_stock_change_at == 2026-08-01T00:00:00Z"
            - "ProductAssignment.${pa_id}.assignment_status == PAUSED_OOS"
            - "ProductAssignment.${pa_id}.relevance_contribution == 0.0"
            - "LineItem.${li_id}.line_item_status == OOS_PAUSED"
            - "LineItem.${li_id}.pause_reason == OUT_OF_STOCK"
            - "LineItem.${li_id}.eligible_product_count == 0"
            - "Campaign.${camp_id}.oos_paused_line_item_count == 1"
            - "Campaign.${camp_id}.delivery_status == PAUSED"

      - name: restock_returns_line_item_to_eligible_while_campaign_still_paused
