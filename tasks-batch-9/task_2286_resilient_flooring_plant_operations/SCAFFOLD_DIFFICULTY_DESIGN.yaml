          assert:
            - "${r1_royalty} == 1061 (10.10 * 105 == 1060.50, ROUND_HALF_UP per run)"
            - "${r2_royalty} == 1061"
            - "${ledger_royalty} == 2122"
            - "${ledger_royalty} != 2121, which is what SUM_THEN_ROUND of 2121.00 would have produced"
            - "DesignLicense.${lic_id}.accrued_royalty_cents == 2122"
