            - "the return at the due instant returns HTTP 200 and Driver.${drv_esr}.escrow_status == RETURNED"
            - "Driver.${drv_esr}.escrow_balance_cents == 0 and escrow_returned_at == 2026-09-29T12:00:00.000Z"
            - "the RETURN_DISBURSEMENT listing returns exactly 1 row with amount_cents -3686 and balance_after_cents 0"
      - name: escrow_deduction_is_blocked_when_the_escrow_axis_is_wrong_or_the_balance_is_short
