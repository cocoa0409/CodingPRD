              captures: { fac: $.data.id }
            - call: "POST /roi/patients"
              payload: { facility_id: "${fac}", mrn: "MRN-1001", full_name: "Dana Reyes", date_of_birth: "1984-03-11" }
              as: FacilityAdmin
              as_user_id: "${fac}"
              captures: { pat: $.data.id }
            - call: "POST /roi/requesters"
              payload: { requester_type: "ATTORNEY", contact_email: "counsel@firm.example", organization_name: "Firm LLP", credential_number: "BAR-55", signature_on_file: true }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { atty: $.data.id }
            - call: "GET /roi/patients/${pat}"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { pat_v: $.data.version }
            - call: "POST /roi/authorizations"
              payload: { patient_id: "${pat}", requester_id: "${atty}", expected_patient_version: "${pat_v}", signed_at: "2026-08-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z", scope_categories: ["BEHAVIORAL_HEALTH"], designated_recipient_endpoint: "counsel@firm.example", signature_verified: true, sensitive_categories_authorized: ["BEHAVIORAL_HEALTH"] }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { auth: $.data.id }
            - call: "POST /roi/requests"
              payload: { facility_id: "${fac}", patient_id: "${pat}", requester_id: "${atty}", authorization_id: "${auth}", access_basis: "THIRD_PARTY_AUTHORIZATION", requested_categories: ["BEHAVIORAL_HEALTH"], date_range_start: "2024-01-01", date_range_end: "2024-12-31", delivery_format: "SECURE_PORTAL" }
              as: IntakeSpecialist
              as_user_id: "u-intake-1"
              captures: { rq: $.data.id }
            - call: "POST /roi/requests/${rq}/intake-decision"
              payload: { decision: "ACCEPT" }
