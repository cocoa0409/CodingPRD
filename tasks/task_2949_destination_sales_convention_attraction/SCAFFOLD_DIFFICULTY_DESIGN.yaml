  - rule_id: transitive_cascade
    instances:
      - name: bid_acceptance_cascades_four_hops_to_a_rival_opportunity_posture
        grounds:
          - state_machines.BidPackage.SUBMITTED_to_ACCEPTED
          - state_machines.Opportunity.sales_stage.BIDDING_to_DEFINITE
          - state_machines.SpaceHold.HELD_to_CONFIRMED
          - state_machines.SpaceHold.CONFIRMED_supersedes_conflicting_siblings
          - state_machines.Opportunity.hold_posture.TENTATIVE_to_RELEASED
          - calculations.planner_relationship_score
        distinguishing_aspect: |
          One planner-response call propagates four hops across four different entities and two different
          opportunities: (1) BidPackage SUBMITTED -> ACCEPTED, (2) Opportunity A BIDDING -> DEFINITE with
          definite_room_nights frozen at 1800, (3) A's FIRST-rank SpaceHold HELD -> CONFIRMED, (4) the RIVAL
          opportunity B's SECOND-rank conflicting hold RELEASED with release_reason SUPERSEDED_BY_CONFIRMED
          and B's hold_posture TENTATIVE -> RELEASED, plus the parallel hop that re-derives planner A's
          definite counters and both relationship scores. An implementation that stops at hop 3 leaves B
          holding a phantom hold on a hall that is now confirmed to someone else.
        test_recipe:
          setup:
            - "clock 2027-03-01T00:00:00Z; Grand Hall A with turnaround_hours 48"
            - "opportunity A (CDA Annual 2028, planner CDA) QUALIFIED, FIRST-rank hold 2028-04-08 -> 2028-04-13, 900 of 1000 peak rooms COMMITTED, bid SUBMITTED with response_due_at 2027-04-01T00:00:00Z"
            - "rival opportunity B (Regional Robotics Summit, planner RRA) QUALIFIED with a SECOND-rank hold 2028-04-14 -> 2028-04-18 on the same hall - its buffered window conflicts with A's because 2028-04-14T00:00:00Z minus 48h = 2028-04-12T00:00:00Z < 2028-04-13T00:00:00Z"
