  # ===========================================================================
  # §1.9 — Cross-cutting layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: clock_set_re_evaluates_lazy_transitions
        claim_type: optimistic_concurrency
        grounds:
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "Setting the logical clock forward past an offer's expiry_at transitions the offer OPEN -> EXPIRED on next read; the film reverts to SHOPPING if no OPEN offers remain."
        test_recipe:
          setup: ["Film F; offer O1 with expiry_at 2026-10-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "M", director_name: "D", principal_cast: ["X"], genre: "DRAMA", runtime_minutes: 90, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 1000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 1000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-10-01T00:00:00Z" }
              as: AcquisitionExec
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /films/${film_id}/offers/${o1}"
              payload: {}
              as: AcquisitionExec
              captures: { o1_status: $.data.status }
            - call: "GET /films/${film_id}"
              payload: {}
              as: AcquisitionExec
              captures: { film_status: $.data.acquisition_status }
          assert:
            - "AcquisitionOffer.${o1}.status == EXPIRED"
            - "Film.${film_id}.acquisition_status == SHOPPING (reverted when last OPEN offer expired)"

  # ===========================================================================
  # §1.9 — Consistency model
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_on_accept
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "After offer accept returns 201, a follow-up GET on the deal shows all derived fields populated and RightsGrants visible — no lag."
        test_recipe:
          setup: ["Film F with offer O1."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "M", director_name: "D", principal_cast: ["X"], genre: "DRAMA", runtime_minutes: 90, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 1000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 5000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { o1: $.data.id }
            - call: "GET /films/${film_id}"
              payload: {}
              as: AcquisitionExec
              captures: { film_v: $.data.version }
          trigger:
            - call: "POST /films/${film_id}/offers/${o1}/accept"
              payload: { expected_film_version: "${film_v}" }
              as: AcquisitionExec
              captures: { deal_id: $.data.id, pa_shortfall: $.data.pa_shortfall_cents }
          assert:
            - "response includes pa_shortfall_cents == 5000000 immediately"
            - "GET /deals/${deal_id}/rights-grants returns the granted rows immediately (no async reconciliation)"
