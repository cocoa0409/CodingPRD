      - name: offer_withdrawal_restores_the_penalty_reserve_partition
        grounds:
          - state_machines.CivilPenaltyCase
          - entities.CivilPenaltyCase.fields.reserved_cents
          - entities.CivilPenaltyCase.fields.available_cents
          - entities.CivilPenaltyCase.fields.assessed_penalty_cents
          - entities.CivilPenaltyCase.fields.current_offer_round
          - endpoints["POST /product-safety/civil-penalty-cases/{id}/offer-resolution"]
        distinguishing_aspect: |
          A DIFFERENT conserved-quantity type from the unit ledger: MONEY in cents,
          partitioned as reserved_cents + available_cents == assessed_penalty_cents.
          Making an offer of 4500000 moves money across the partition (4500000 /
          1000000) and withdrawing it must move exactly that much back (0 /
          5500000) with no rounding residue. The asymmetry is the point: the money
          is fully restored while current_offer_round stays at 1, so the
          compensation is precise about what it conserves and what it deliberately
          does not.
        test_recipe:
          setup:
            - "a CivilPenaltyCase with assessed_penalty_cents 5500000, opened on an ACCEPTED SectionReport filed 2 days late"
            - "one AGENCY offer of 4500000 on the table, so reserved_cents 4500000 and available_cents 1000000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-X1", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
              captures: { pm_id: $.data.id, pm_v1: $.data.version }
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "MEDICAL_EXAMINER", incident_date: "2026-01-12T00:00:00Z", narrative: "Base plate weld failed; second-degree burn, consumer hospitalised overnight." }
              as: IntakeSpecialist
              captures: { i1_id: $.data.id }
            - call: "POST /product-safety/incidents/${i1_id}/classify"
              payload: { injury_class: "HOSPITALIZATION", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "RETAILER", incident_date: "2026-01-20T00:00:00Z", narrative: "Store return: unit overheated and scorched the counter; consumer treated at urgent care." }
              as: IntakeSpecialist
              captures: { i2_id: $.data.id }
            - call: "POST /product-safety/incidents/${i2_id}/classify"
              payload: { injury_class: "MEDICAL_TREATMENT", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/incidents"
              payload: { product_model_id: "${pm_id}", report_channel: "CONSUMER_HOTLINE", incident_date: "2026-02-02T00:00:00Z", narrative: "Hotline report: minor burn to thumb, treated with first aid at home." }
              as: IntakeSpecialist
              captures: { i3_id: $.data.id }
            - call: "POST /product-safety/incidents/${i3_id}/classify"
              payload: { injury_class: "FIRST_AID", hazard_code: "BURN", injury_verified: true }
              as: IntakeSpecialist
            - call: "POST /product-safety/hazard-patterns"
              payload: { product_model_id: "${pm_id}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-02-28T00:00:00Z", analysis_basis: "PRELIMINARY", expected_product_model_version: "${pm_v1}" }
              as: ComplianceOfficer
              captures: { hp_id: $.data.id }
            - call: "POST /product-safety/hazard-patterns/${hp_id}/adjudicate"
              payload: { decision: "CONFIRMED" }
              as: ComplianceOfficer
            - call: "POST /product-safety/reportability-evaluations"
              payload: { hazard_pattern_id: "${hp_id}", standard_basis: "DEFECT" }
              as: ComplianceOfficer
              captures: { ev_id: $.data.id }
            - call: "POST /product-safety/reportability-evaluations/${ev_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /product-safety/reportability-evaluations/${ev_id}/determine"
              payload: { determination: "REPORTABLE", defect_score: 8, risk_score: 7, determination_note: "Base plate weld defect creates a foreseeable burn hazard in normal use." }
              as: ComplianceOfficer
            - call: "POST /product-safety/section-reports"
              payload: { reportability_evaluation_id: "${ev_id}", corrective_action_type: "REFUND", corrective_action_summary: "Full purchase-price refund plus a prepaid return label for every unit in commerce." }
              as: ComplianceOfficer
              captures: { sr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-13T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/section-reports/${sr_id}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /product-safety/section-reports/${sr_id}/review"
              payload: { decision: "ACCEPTED" }
              as: SafetyDirector
              as_user_id: "dir-1"
            - call: "POST /product-safety/civil-penalty-cases"
              payload: { section_report_id: "${sr_id}", violation_count: 4 }
              as: PenaltyCounsel
              captures: { cs_id: $.data.id, cs_v1: $.data.version }
            - call: "POST /product-safety/civil-penalty-cases/${cs_id}/offers"
              payload: { amount_cents: 4500000, offered_by: "AGENCY", expected_case_version: "${cs_v1}" }
              as: PenaltyCounsel
          trigger:
            - call: "POST /product-safety/civil-penalty-cases/${cs_id}/offer-resolution"
              payload: { resolution: "WITHDRAWN", note: "Offer withdrawn after new incident evidence arrived." }
              as: PenaltyCounsel
          assert:
            - "CivilPenaltyCase.${cs_id}.status == ASSESSMENT_OPEN"
            - "CivilPenaltyCase.${cs_id}.reserved_cents == 0"
            - "CivilPenaltyCase.${cs_id}.available_cents == 5500000"
            - "INVARIANT CivilPenaltyCase.${cs_id}.reserved_cents + CivilPenaltyCase.${cs_id}.available_cents == 5500000 == assessed_penalty_cents"
            - "CivilPenaltyCase.${cs_id}.current_offer_cents == null"
            - "CivilPenaltyCase.${cs_id}.current_offer_by == null"
            - "CivilPenaltyCase.${cs_id}.current_offer_round == 1 (the consumed round is NOT restored — this quantity is deliberately not conserved)"
            - "CivilPenaltyCase.${cs_id}.consent_agreement_total_cents == null"
            - "CivilPenaltyCase.${cs_id}.assessed_penalty_cents == 5500000"
            - "SectionReport.${sr_id}.late_surcharge_cents == 500000 (an unrelated money field, untouched by the reserve compensation)"
