            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Idem job", planned_start_at: "2026-08-03T09:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T10:00:00Z", standby_end_at: "2026-08-03T20:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa: "$.data.id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/standby-assignments/${sa}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:07:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/standby-assignments/${sa}/release", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
          trigger:
            - { call: "POST /rescue-ops/client-accounts/${acct}/statements/generate", payload: { period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-04T00:00:00Z" }, as: BillingClerk, captures: { stmt1: "$.data.id", lines1: "$.data.line_count" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/statements/generate", payload: { period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-04T00:00:00Z" }, as: BillingClerk, captures: { stmt2: "$.data.id", lines2: "$.data.line_count", total2: "$.data.total_cents" } }
          assert:
            - "Second generate returns the same statement id (${stmt2} == ${stmt1})"
            - "line_count stays 1 and total_cents stays 80000 (the RELEASED assignment was marked billed by the first sweep)"
            - "StandbyAssignment.${sa}.billed == true"

      - name: corner_layer_cascading_side_effects
        claim_type: cascading_side_effects
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: alarm_reading_three_hop_cascade
          rationale: "N-level cascade ordering is asserted end-to-end by the named §1.8 instance (and by incident_escalation_two_hop_cascade for the second trigger)."

      - name: corner_layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: billing_mode_hourly_vs_event_divergence
          rationale: "Both variant pairs (billing mode, exposure standard) are asserted with literal divergent values in §1.8."

      - name: corner_layer_rate_threshold_triggers
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: o2_inclusive_lower_boundary_alarm_flip
          rationale: "Threshold boundaries (inclusive/exclusive, cumulative vs instantaneous) are asserted by the named §1.8 instances and the sweep-boundary corners corner_verification_expiry_sweep_boundary / corner_roster_no_show_sweep / corner_monitoring_gap_auto_suspend."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: corner_immediate_read_after_write
        claim_type: immediate
        grounds: [complexity_profile, "endpoints[POST /rescue-ops/entry-permits/{permitId}/atmospheric-readings]"]
        distinguishing_aspect: "Immediate consistency: the alarm cascade's effects are visible in the SAME logical instant — the reading response carries within_limits false, and the very next GET on the permit (no clock movement) shows SUSPENDED."
        test_recipe:
          setup: ["ACTIVE permit with attendant att1 ON_DUTY (so the evacuation link fires) and rescuer r1 ON_STANDBY"]
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T05:30:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Att One", role_qualifications: ["ATTENDANT"] }, as: OperationsManager, captures: { att_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer One", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Immediate Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-IC", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan}/approve", payload: { expected_space_version: "${sp_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${sp}", as: OperationsManager, captures: { sp_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp}/entry-permits", payload: { purpose: "Immediate job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/atmospheric-readings", payload: { reading_kind: "PRE_ENTRY", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 0, co_ppm: 0 }, as: Attendant, as_user_id: "${att_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T05:00:00Z", standby_end_at: "2026-08-03T20:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa: "$.data.id" } }
            - { call: "POST /rescue-ops/standby-assignments/${sa}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per}/roster-entries", payload: { personnel_id: "${att_id}", assignment_role: "ATTENDANT", scheduled_start_at: "2026-08-03T05:00:00Z", scheduled_end_at: "2026-08-03T17:00:00Z" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { ro_att: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per}/activate", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/roster-entries/${ro_att}/check-in", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
          trigger:
            - { call: "POST /rescue-ops/entry-permits/${per}/atmospheric-readings", payload: { reading_kind: "CONTINUOUS", o2_pct: 24.0, lel_pct: 0, h2s_ppm: 0, co_ppm: 0 }, as: Attendant, as_user_id: "${att_id}", captures: { within: "$.data.within_limits" } }
            - { call: "GET /rescue-ops/entry-permits/${per}", as: OperationsManager, captures: { per_status: "$.data.status" } }
            - { call: "GET /rescue-ops/standby-assignments/${sa}", as: OperationsManager, captures: { sa_status: "$.data.status" } }
          assert:
            - "Reading response: within_limits == false (o2 24.0 > 23.5) computed in the same response"
            - "Immediate GET: EntryPermit.${per}.status == SUSPENDED (no delay, no reconciliation window)"
            - "Immediate GET: RosterEntry.${ro_att}.status == EVACUATED and StandbyAssignment.${sa}.status == DEPLOYED — the full cascade is visible in the same logical instant"
