        grounds:
          - "validations[priority 42]"
          - "calculations.enforcement_eligibility_thresholds"
          - "calculations.enforcement_eligibility_thresholds.constants.TAX_INTERCEPT_ASSIGNED_CENTS"
          - "calculations.enforcement_eligibility_thresholds.constants.TAX_INTERCEPT_UNASSIGNED_CENTS"
          - "errors[ERR_ARREARS_BELOW_ENFORCEMENT_THRESHOLD]"
        distinguishing_aspect: >
          Two cases carry byte-identical ledgers - one 30000 arrears charge,
          certified at 30150 once statutory interest is added - and differ only in
          tanf_assistance. The TANF case clears TAX_INTERCEPT_ASSIGNED_CENTS 15000
          and the action is created; the non-TANF case is refused against
          TAX_INTERCEPT_UNASSIGNED_CENTS 50000. Both cases also prove the second
          gate is independent: LICENSE_SUSPENSION at 300000 is refused on the TANF
          case even though the conditional row let TAX_REFUND_INTERCEPT through.
