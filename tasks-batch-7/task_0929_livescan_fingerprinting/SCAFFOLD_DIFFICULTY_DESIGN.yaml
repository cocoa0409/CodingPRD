# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances, each grounded in SCAFFOLD.yaml §1.1-§1.7.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: fee_total_rounds_each_percentage_component_before_summing
        grounds:
          - calculations.fee_assessment_total
          - entities.FeeAssessment.fields.processing_surcharge_cents
          - entities.FeeAssessment.fields.vendor_tax_cents
          - entities.ServiceType.fields.state_fee_cents
        distinguishing_aspect: |
          This dual variant lives on the FeeAssessment (money) domain: rounding each percentage
          component to whole cents before summing yields total_cents 5868, while the sum-then-round
          reading yields 5869 for the identical inputs.
        test_recipe:
          setup:
            - "One CRIMINAL_JUSTICE ORI (STATE_AND_FBI) under an APPLICANT_PAID agency"
            - "A ServiceType charging state 3289 and federal 1350 cents"
            - "A FIXED site, a calibrated device, and one card finalized with all ten positions PASSED at 82"
            - "The card is transmitted, creating exactly one SUBMISSION FeeAssessment"
          setup_api_calls:
            - call: "POST /livescan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: VendorAdmin
            - call: "POST /livescan/agencies"
              payload: { name: "Metro PD", account_code: "ACC-101", payer_regime_default: "APPLICANT_PAID", invoice_terms_days: 30 }
              as: VendorAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /livescan/oris"
              payload: { agency_id: "${agency_id}", ori_code: "CA0111111", statutory_authority: "CRIMINAL_JUSTICE", fee_waiver_eligible: false }
              as: VendorAdmin
              captures: { ori_id: $.data.id }
            - call: "POST /livescan/service-types"
              payload: { ori_id: "${ori_id}", code: "TCH", applicant_type: "TEACHER", slot_duration_minutes: 30, required_document_codes: ["PHOTO_ID"], accepted_id_document_types: ["DRIVER_LICENSE"], state_fee_cents: 3289, federal_fee_cents: 1350, retention_offered: true }
              as: VendorAdmin
              captures: { st_id: $.data.id }
            - call: "POST /livescan/sites"
              payload: { site_kind: "FIXED", name: "Downtown", concurrent_capacity: 5 }
              as: VendorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /livescan/devices"
              payload: { serial_number: "DEV-101", home_site_id: "${site_id}", calibrated_at: "2026-05-15T00:00:00Z" }
              as: VendorAdmin
              captures: { device_id: $.data.id }
            - call: "POST /livescan/applicants"
              payload: { full_name: "Ann Lee", date_of_birth: "1990-04-02", sex: "F", place_of_birth: "CA", id_document_type: "DRIVER_LICENSE", id_document_expires_on: "2030-01-01" }
              as: LivescanTechnician
              as_user_id: "tech-01"
              captures: { appl_id: $.data.id }
            - call: "POST /livescan/appointments"
              payload: { applicant_id: "${appl_id}", site_id: "${site_id}", service_type_id: "${st_id}", scheduled_start: "2026-06-01T10:00:00Z", booking_channel: "BOOKED" }
              as: LivescanTechnician
              as_user_id: "tech-01"
              captures: { appt_id: $.data.id }
            - call: "POST /livescan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:55:00Z" }
              as: VendorAdmin
            - call: "POST /livescan/appointments/${appt_id}/check-in"
              payload: { presented_document_type: "DRIVER_LICENSE", presented_documents: ["PHOTO_ID"] }
              as: LivescanTechnician
              as_user_id: "tech-01"
            - call: "POST /livescan/cards"
