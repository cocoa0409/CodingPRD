  - rule_id: compensating_invariant
    instances:
      - name: wire_mass_ledger_restored_exactly_by_heading_abort
        grounds:
          - calculations.wire_mass_ledger
          - state_machines.ProductionLot.process_state.SETUP_to_ABORTED
          - entities.WireLot.fields.available_mass_kg
          - entities.WireLot.fields.reserved_mass_kg
          - endpoints[POST /production-lots/{id}/abort-heading]
        distinguishing_aspect: |
          The conserved quantity is wire mass in kilograms: gross 500.000 splits into available
          290.000 plus reserved 210.000 while the lot is in SETUP, and aborting the lot returns the
          ledger to available 500.000 / reserved 0.000 / consumed 0.000 with no drift in the third
          decimal, while the aborted lot keeps wire_consumed_kg 0.000 forever.
        test_recipe:
          setup:
            - "Part spec HX-M8-109 (blank 20.0 g, scrap_allowance_pct 0.05)."
            - "VERIFIED heat H-77410 and RELEASED wire lot of gross 500.0 kg with available 500.000, reserved 0.000, consumed 0.000."
            - "Tool DIE-4S-001 rated 120000 mounted on PRESS-3."
            - "Lot L-2650 planned 10000 pieces is opened, reserving 210.000 kg."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
            - call: "POST /part-specs"
              payload: { part_number: "HX-M8-109", thread_designation: "M8x1.25", strength_class: "CLASS_10_9", qualification_program: "AUTOMOTIVE_PPAP", allowed_steel_grades: ["SAE_10B21"], blank_mass_g: 20.0, station_count_required: 4, thread_timing: "BEFORE_HEAT_TREAT", required_secondary_ops: ["THREAD_ROLL", "POINT"], min_core_hardness_hv: 304, max_core_hardness_hv: 361, max_decarb_depth_mm: 0.150, plating_spec: "ZINC_CLEAR", packaging_mode: "BY_WEIGHT", nominal_pack_count: 500, pieces_per_kg: 62.5, proof_load_kn: 34.7 }
              as: ProcessEngineer
              captures: { spec_id: $.data.id }
            - call: "POST /steel-heats"
              payload: { heat_number: "H-77410", mill_code: "MC-A", grade: "SAE_10B21", carbon_pct: 0.21, boron_ppm: 25, gross_mass_kg: 500.0, mill_cert_serial: "MC-2026-000481" }
              as: QualityInspector
              as_user_id: "insp-1"
              captures: { heat_id: $.data.id }
            - call: "POST /steel-heats/${heat_id}/verify-mill-cert"
              payload: { outcome: "VERIFIED", mill_cert_serial: "MC-2026-000481", lab_report_reference: "LAB-0001" }
              as: QualityInspector
