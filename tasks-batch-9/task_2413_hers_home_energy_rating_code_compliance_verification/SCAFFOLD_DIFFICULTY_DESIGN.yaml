  - rule_id: boundary_precision_check
    instances:
      - name: blower_door_exactly_at_ach50_threshold_passes
        grounds:
          - calculations.blower_door_normalization
          - entities.DiagnosticTest.fields.normalized_value
          - entities.DiagnosticTest.fields.result
          - endpoints[POST /inspections/{id}/tests]
        distinguishing_aspect: |
          Metric: normalized ACH50 (air leakage) against ACH50_MAX 3.0, on POST /inspections/{id}/tests.
          The rounding happens BEFORE the comparison and the comparison is inclusive, so 1080 CFM50 ->
          exactly 3.00 PASSES while 1084 CFM50 -> 3.01 FAILS; an implementation that compared the
          unrounded 3.0111 or used a strict `<` would fail the 1080 case.
        test_recipe:
          setup:
            - "Builder Fairview Homes, subdivision Brightwater (IECC_2021, CZ4) so ACH50_MAX is 3.0"
            - "PlanModel STD-2400 with conditioned_volume_cuft 21600"
            - "Home L-701 with a PROJECTED rating and two SCHEDULED FINAL inspections on separate days (2026-08-12 and 2026-08-14) for the same field inspector"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Fairview Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 500000 }
              as: RatingProviderAdmin
              captures: { b12: $.data.id }
            - call: "POST /subdivisions"
