# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Retail Shopper Data Science & Supplier Insights Subscription
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: get_unknown_contract_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_RESOURCE_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET with a well-formed but nonexistent contract id returns 404 ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /shopper-insights/subscription-contracts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: RetailerAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_RESOURCE_NOT_FOUND"
            - "http status == 404"

      - name: create_account_client_id_input_ignored
        claim_type: system_fields
        grounds: [entities.SupplierAccount]
        distinguishing_aspect: "Client-supplied id in the create payload is ignored; the server mints its own UUID."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Pi Pasta", region: "NW", id: "11111111-2222-3333-4444-555555555555" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
          assert:
            - "SupplierAccount.${acct}.id != '11111111-2222-3333-4444-555555555555' (server-minted)"
            - "version == 1, status == ACTIVE, created_at present"

      - name: report_credit_cost_by_type_computed
        claim_type: computed_fields
        grounds: [calculations.credit_cost, entities.InsightReport.fields.credit_cost]
        distinguishing_aspect: "credit_cost is computed per report_type (CATEGORY 1, BRAND_OWN 2, COMPETITOR_BLIND 3); any client-supplied value is meaningless."
        test_recipe:
          setup:
            - "Account with ACTIVE TIER_PORTFOLIO contract (allowance 10) and scope SNACKS"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Rho Rice", region: "SE" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_PORTFOLIO", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
              captures: { contract: $.data.id }
            - call: "POST /shopper-insights/subscription-contracts/${contract}/category-scopes"
              payload: { category_code: "SNACKS", brand_codes: ["ACME"] }
              as: RetailerAdmin
          trigger:
            - call: "POST /shopper-insights/insight-reports"
              payload: { contract_id: "${contract}", report_type: "CATEGORY", category_code: "SNACKS", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { r1_cost: $.data.credit_cost }
            - call: "POST /shopper-insights/insight-reports"
              payload: { contract_id: "${contract}", report_type: "BRAND_OWN", category_code: "SNACKS", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { r2_cost: $.data.credit_cost }
            - call: "POST /shopper-insights/insight-reports"
              payload: { contract_id: "${contract}", report_type: "COMPETITOR_BLIND", category_code: "SNACKS", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { r3_cost: $.data.credit_cost }
          assert:
            - "CATEGORY report credit_cost == 1"
            - "BRAND_OWN report credit_cost == 2"
            - "COMPETITOR_BLIND report credit_cost == 3"
            - "contract report_credits_reserved == 6 after the three creates"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: cancel_ready_report_returns_not_cancellable
        claim_type: invalid_transition
        grounds: [state_machines.InsightReport.REQUESTED_to_CANCELLED, "errors[ERR_REPORT_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancel is legal only from REQUESTED; a READY report rejects cancel with ERR_REPORT_NOT_CANCELLABLE and stays READY."
        test_recipe:
          setup:
            - "Account with ACTIVE TIER_CATEGORY contract, scope SNACKS, 20 SNACKS households, one READY report"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Sigma Soup", region: "NW" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_CATEGORY", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
              captures: { contract: $.data.id }
            - call: "POST /shopper-insights/subscription-contracts/${contract}/category-scopes"
              payload: { category_code: "SNACKS", brand_codes: ["ACME"] }
              as: RetailerAdmin
            - call: "POST /shopper-insights/panel-households"
              payload:
                households:
                  - { household_ref: "c01", category_codes: ["SNACKS"] }
                  - { household_ref: "c02", category_codes: ["SNACKS"] }
                  - { household_ref: "c03", category_codes: ["SNACKS"] }
                  - { household_ref: "c04", category_codes: ["SNACKS"] }
                  - { household_ref: "c05", category_codes: ["SNACKS"] }
                  - { household_ref: "c06", category_codes: ["SNACKS"] }
                  - { household_ref: "c07", category_codes: ["SNACKS"] }
                  - { household_ref: "c08", category_codes: ["SNACKS"] }
                  - { household_ref: "c09", category_codes: ["SNACKS"] }
                  - { household_ref: "c10", category_codes: ["SNACKS"] }
                  - { household_ref: "c11", category_codes: ["SNACKS"] }
                  - { household_ref: "c12", category_codes: ["SNACKS"] }
                  - { household_ref: "c13", category_codes: ["SNACKS"] }
                  - { household_ref: "c14", category_codes: ["SNACKS"] }
                  - { household_ref: "c15", category_codes: ["SNACKS"] }
                  - { household_ref: "c16", category_codes: ["SNACKS"] }
                  - { household_ref: "c17", category_codes: ["SNACKS"] }
                  - { household_ref: "c18", category_codes: ["SNACKS"] }
                  - { household_ref: "c19", category_codes: ["SNACKS"] }
                  - { household_ref: "c20", category_codes: ["SNACKS"] }
              as: RetailerAdmin
            - call: "POST /shopper-insights/insight-reports"
              payload: { contract_id: "${contract}", report_type: "CATEGORY", category_code: "SNACKS", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { rep: $.data.id }
            - call: "POST /shopper-insights/insight-reports/${rep}/generate"
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { ready_st: $.data.status }
          trigger:
            - call: "POST /shopper-insights/insight-reports/${rep}/cancel"
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { err_id: $.data.error_id }
          assert:
            - "generate produced status READY (20 >= MIN_CELL_SIZE)"
            - "cancel returns ERR_REPORT_NOT_CANCELLABLE (409)"
            - "report remains READY; contract report_credits_consumed unchanged at 1"

      - name: grant_double_approve_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CleanRoomGrant.REQUESTED_to_APPROVED, "errors[ERR_GRANT_NOT_APPROVABLE]"]
        distinguishing_aspect: "Approving an already-APPROVED grant fails ERR_GRANT_NOT_APPROVABLE; no duplicate AuditEvent is written."
        test_recipe:
          setup:
            - "Account with ACTIVE contract; REQUESTED grant"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Tau Thyme", region: "NE" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_CATEGORY", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
            - call: "POST /shopper-insights/clean-room-grants"
              payload: { supplier_account_id: "${acct}", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-12-01T00:00:00Z", query_budget_total: 100 }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { grant: $.data.id }
            - call: "POST /shopper-insights/clean-room-grants/${grant}/approve"
              as: DataSteward
              as_user_id: "steward-8"
          trigger:
            - call: "POST /shopper-insights/clean-room-grants/${grant}/approve"
              as: DataSteward
              as_user_id: "steward-8"
              captures: { err_id: $.data.error_id }
          assert:
            - "second approve returns ERR_GRANT_NOT_APPROVABLE (409)"
            - "grant status remains APPROVED"

      - name: cycle_lock_from_scheduled_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.LineReviewCycle.OPEN_to_LOCKED, "errors[ERR_CYCLE_NOT_LOCKABLE]"]
        distinguishing_aspect: "Lock requires OPEN; at the default clock (2026-09-01) a cycle whose open_at (2026-09-17) is still in the future is SCHEDULED and rejects lock."
        test_recipe:
          setup:
            - "Cycle window 2026-10-01..2026-10-15 (open_at 2026-09-17), clock untouched at default 2026-09-01"
          setup_api_calls:
            - call: "POST /shopper-insights/line-review-cycles"
              payload: { category_code: "DAIRY", window_start: "2026-10-01", window_end: "2026-10-15" }
              as: CategoryManager
              captures: { cyc: $.data.id }
          trigger:
            - call: "POST /shopper-insights/line-review-cycles/${cyc}/lock"
              as: CategoryManager
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_CYCLE_NOT_LOCKABLE (409)"
            - "cycle status remains SCHEDULED"

      - name: activation_auto_completes_after_measurement_window
        claim_type: valid_transition
        grounds: [state_machines.SegmentActivation.LAUNCHED_to_COMPLETED]
        distinguishing_aspect: "A LAUNCHED activation auto-completes when the logical clock reaches launched_at + 28 days, observed via the segment's activation list."
        test_recipe:
          setup:
            - "Account with ACTIVE contract (budget 100000), scope SNACKS, 25 SNACKS households, APPROVED segment size 25, activation [COUPON] created and LAUNCHED at clock 2026-09-01"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Phi Fig", region: "SW" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_CATEGORY", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
              captures: { contract: $.data.id }
            - call: "POST /shopper-insights/subscription-contracts/${contract}/category-scopes"
              payload: { category_code: "SNACKS", brand_codes: ["ACME"] }
              as: RetailerAdmin
            - call: "POST /shopper-insights/panel-households"
              payload:
                households:
                  - { household_ref: "a01", category_codes: ["SNACKS"] }
                  - { household_ref: "a02", category_codes: ["SNACKS"] }
                  - { household_ref: "a03", category_codes: ["SNACKS"] }
                  - { household_ref: "a04", category_codes: ["SNACKS"] }
                  - { household_ref: "a05", category_codes: ["SNACKS"] }
                  - { household_ref: "a06", category_codes: ["SNACKS"] }
                  - { household_ref: "a07", category_codes: ["SNACKS"] }
                  - { household_ref: "a08", category_codes: ["SNACKS"] }
                  - { household_ref: "a09", category_codes: ["SNACKS"] }
                  - { household_ref: "a10", category_codes: ["SNACKS"] }
                  - { household_ref: "a11", category_codes: ["SNACKS"] }
                  - { household_ref: "a12", category_codes: ["SNACKS"] }
                  - { household_ref: "a13", category_codes: ["SNACKS"] }
                  - { household_ref: "a14", category_codes: ["SNACKS"] }
                  - { household_ref: "a15", category_codes: ["SNACKS"] }
                  - { household_ref: "a16", category_codes: ["SNACKS"] }
                  - { household_ref: "a17", category_codes: ["SNACKS"] }
                  - { household_ref: "a18", category_codes: ["SNACKS"] }
                  - { household_ref: "a19", category_codes: ["SNACKS"] }
                  - { household_ref: "a20", category_codes: ["SNACKS"] }
                  - { household_ref: "a21", category_codes: ["SNACKS"] }
                  - { household_ref: "a22", category_codes: ["SNACKS"] }
                  - { household_ref: "a23", category_codes: ["SNACKS"] }
                  - { household_ref: "a24", category_codes: ["SNACKS"] }
                  - { household_ref: "a25", category_codes: ["SNACKS"] }
              as: RetailerAdmin
            - call: "POST /shopper-insights/audience-segments"
              payload: { contract_id: "${contract}", segment_name: "Auto", category_code: "SNACKS" }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { seg: $.data.id }
            - call: "POST /shopper-insights/audience-segments/${seg}/submit"
              as: SupplierAnalyst
              as_user_id: "${acct}"
            - call: "POST /shopper-insights/audience-segments/${seg}/approve"
              as: DataSteward
              as_user_id: "steward-9"
              captures: { sv: $.data.version }
            - call: "POST /shopper-insights/audience-segments/${seg}/activations"
              payload: { expected_segment_version: "${sv}", channels: ["COUPON"] }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { act: $.data.id }
            - call: "POST /shopper-insights/segment-activations/${act}/launch"
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { launched_st: $.data.status }
          trigger:
            - call: "POST /shopper-insights/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-29T00:00:00Z" }
              as: RetailerAdmin
            - call: "GET /shopper-insights/audience-segments/${seg}/activations"
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { act_st: "$.data[0].status" }
          assert:
            - "launch at default clock 2026-09-01 succeeded (status LAUNCHED)"
            - "at clock 2026-09-29 (28 days later) activation status == COMPLETED via lazy auto-transition"

      - name: deliverable_reject_resubmit_cycle
        claim_type: valid_transition
        grounds: [state_machines.ReviewDeliverable.SUBMITTED_to_REJECTED, state_machines.ReviewDeliverable.REJECTED_to_SUBMITTED]
        distinguishing_aspect: "A REJECTED deliverable may be resubmitted (REJECTED -> SUBMITTED), exercising the deliverable revision loop distinct from segment/study cycles."
        test_recipe:
          setup:
            - "Account with ACTIVE contract, scope SNACKS, 20 SNACKS households, READY report, cycle window 2026-09-20..2026-09-25 (open_at 2026-09-06), PLANNED deliverable due 2026-09-15, clock 2026-09-07"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Chi Chips", region: "NW" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_CATEGORY", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
              captures: { contract: $.data.id }
            - call: "POST /shopper-insights/subscription-contracts/${contract}/category-scopes"
              payload: { category_code: "SNACKS", brand_codes: ["ACME"] }
              as: RetailerAdmin
            - call: "POST /shopper-insights/panel-households"
              payload:
                households:
                  - { household_ref: "r01", category_codes: ["SNACKS"] }
                  - { household_ref: "r02", category_codes: ["SNACKS"] }
                  - { household_ref: "r03", category_codes: ["SNACKS"] }
                  - { household_ref: "r04", category_codes: ["SNACKS"] }
                  - { household_ref: "r05", category_codes: ["SNACKS"] }
                  - { household_ref: "r06", category_codes: ["SNACKS"] }
                  - { household_ref: "r07", category_codes: ["SNACKS"] }
                  - { household_ref: "r08", category_codes: ["SNACKS"] }
                  - { household_ref: "r09", category_codes: ["SNACKS"] }
                  - { household_ref: "r10", category_codes: ["SNACKS"] }
                  - { household_ref: "r11", category_codes: ["SNACKS"] }
                  - { household_ref: "r12", category_codes: ["SNACKS"] }
                  - { household_ref: "r13", category_codes: ["SNACKS"] }
                  - { household_ref: "r14", category_codes: ["SNACKS"] }
                  - { household_ref: "r15", category_codes: ["SNACKS"] }
                  - { household_ref: "r16", category_codes: ["SNACKS"] }
                  - { household_ref: "r17", category_codes: ["SNACKS"] }
                  - { household_ref: "r18", category_codes: ["SNACKS"] }
                  - { household_ref: "r19", category_codes: ["SNACKS"] }
                  - { household_ref: "r20", category_codes: ["SNACKS"] }
              as: RetailerAdmin
            - call: "POST /shopper-insights/insight-reports"
              payload: { contract_id: "${contract}", report_type: "CATEGORY", category_code: "SNACKS", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { rep: $.data.id }
            - call: "POST /shopper-insights/insight-reports/${rep}/generate"
              as: SupplierAnalyst
              as_user_id: "${acct}"
            - call: "POST /shopper-insights/line-review-cycles"
              payload: { category_code: "SNACKS", window_start: "2026-09-20", window_end: "2026-09-25" }
              as: CategoryManager
              captures: { cyc: $.data.id }
            - call: "POST /shopper-insights/line-review-cycles/${cyc}/deliverables"
              payload: { contract_id: "${contract}", insight_report_id: "${rep}", due_at: "2026-09-15T00:00:00Z" }
              as: CategoryManager
              captures: { dlv: $.data.id }
            - call: "POST /shopper-insights/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: RetailerAdmin
          trigger:
            - call: "POST /shopper-insights/review-deliverables/${dlv}/submit"
              as: InsightsScientist
              captures: { st1: $.data.status }
            - call: "POST /shopper-insights/review-deliverables/${dlv}/reject"
              as: CategoryManager
              captures: { st2: $.data.status }
            - call: "POST /shopper-insights/review-deliverables/${dlv}/submit"
              as: InsightsScientist
              captures: { st3: $.data.status }
          assert:
            - "submit -> SUBMITTED, reject -> REJECTED, resubmit -> SUBMITTED"
            - "is_late == false throughout (clock 2026-09-07 < due_at 2026-09-15)"

      - name: grant_lazy_expiry_at_valid_until
        claim_type: valid_transition
        grounds: [state_machines.CleanRoomGrant.APPROVED_to_EXPIRED, "errors[ERR_GRANT_EXPIRED]"]
        distinguishing_aspect: "At clock == valid_until the half-open window is closed: queries fail ERR_GRANT_EXPIRED and the grant flips to EXPIRED (boundary: >=, not >)."
        test_recipe:
          setup:
            - "Account with ACTIVE contract; grant [2026-09-01, 2026-10-01) APPROVED with budget 100"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Psi Plums", region: "SE" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_CATEGORY", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
            - call: "POST /shopper-insights/clean-room-grants"
              payload: { supplier_account_id: "${acct}", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-10-01T00:00:00Z", query_budget_total: 100 }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { grant: $.data.id }
            - call: "POST /shopper-insights/clean-room-grants/${grant}/approve"
              as: DataSteward
              as_user_id: "steward-10"
          trigger:
            - call: "POST /shopper-insights/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: RetailerAdmin
            - call: "POST /shopper-insights/clean-room-grants/${grant}/queries"
              payload: { dataset_joins: ["SALES"], estimated_rows: 1000 }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { err_id: $.data.error_id }
            - call: "GET /shopper-insights/clean-room-grants/${grant}"
              as: DataSteward
              as_user_id: "steward-10"
              captures: { g_st: $.data.status }
          assert:
            - "query at clock == valid_until: ERR_GRANT_EXPIRED (409)"
            - "grant status == EXPIRED after the attempt (lazy flip)"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: segment_size_criteria_filtering
        claim_type: correct_result
        grounds: [calculations.segment_size]
        distinguishing_aspect: "Only households matching ALL criteria (category membership, min_frequency, min_monetary_cents, region) count toward size."
        test_recipe:
          setup:
            - "Account with ACTIVE contract, scope SNACKS; panel: h1 (SNACKS, freq 10, mon 5000, NW), h2 (SNACKS, freq 2, mon 5000, NW), h3 (SNACKS, freq 10, mon 100, NW), h4 (SNACKS, freq 10, mon 5000, SE)"
          setup_api_calls:
            - call: "POST /shopper-insights/supplier-accounts"
              payload: { account_name: "Omega Olives", region: "NW" }
              as: RetailerAdmin
              captures: { acct: $.data.id }
            - call: "POST /shopper-insights/supplier-accounts/${acct}/subscription-contracts"
              payload: { tier: "TIER_CATEGORY", report_credit_allowance: 10, activation_budget_cents: 100000, redistribution_allowed: true, modeled_derivation_allowed: true }
              as: RetailerAdmin
              captures: { contract: $.data.id }
            - call: "POST /shopper-insights/subscription-contracts/${contract}/category-scopes"
              payload: { category_code: "SNACKS", brand_codes: ["ACME"] }
              as: RetailerAdmin
            - call: "POST /shopper-insights/panel-households"
              payload:
                households:
                  - { household_ref: "f1", category_codes: ["SNACKS"], frequency_12m: 10, monetary_12m_cents: 5000, region: "NW" }
                  - { household_ref: "f2", category_codes: ["SNACKS"], frequency_12m: 2, monetary_12m_cents: 5000, region: "NW" }
                  - { household_ref: "f3", category_codes: ["SNACKS"], frequency_12m: 10, monetary_12m_cents: 100, region: "NW" }
                  - { household_ref: "f4", category_codes: ["SNACKS"], frequency_12m: 10, monetary_12m_cents: 5000, region: "SE" }
              as: RetailerAdmin
          trigger:
            - call: "POST /shopper-insights/audience-segments"
              payload: { contract_id: "${contract}", segment_name: "Filtered", category_code: "SNACKS", min_frequency: 5, min_monetary_cents: 1000, region: "NW" }
