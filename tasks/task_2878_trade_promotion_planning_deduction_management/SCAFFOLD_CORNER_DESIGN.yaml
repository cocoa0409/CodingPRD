      - name: penalty_score_counts_restricted_but_not_frozen_allocations
        claim_type: input_set_filtering
        grounds:
          - calculations.customer_penalty_score
          - calculations.customer_penalty_score.input_set
          - calculations.allocation_posture
        distinguishing_aspect: |
          The penalty score's input set is RESTRICTED allocations only. An overspend drives
          the allocation OPEN -> RESTRICTED and the customer to 10 points / CREDIT_HOLD;
          locking the program then re-ranks that same allocation to FROZEN (FROZEN outranks
          RESTRICTED), so the score recomputes to 0 — while trading_status stays CREDIT_HOLD
          because that axis is forward-only.
