        distinguishing_aspect: "The SCREEN_FAILED -> SCREENING loop is capped: first rescreen succeeds and increments rescreen_count to 1; after a second screen-fail the second rescreen fails with ERR_RESCREEN_LIMIT_EXCEEDED."
        test_recipe:
          setup: ["study ACTIVE; site ACTIVE; SUB-RS in SCREENING"]
