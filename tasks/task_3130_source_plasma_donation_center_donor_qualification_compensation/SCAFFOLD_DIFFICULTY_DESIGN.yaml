      - name: screening_lane_half_open_interval_adjacency
        grounds:
          - entities.ScreeningVisit.fields.screening_lane_index
          - calculations.lowest_free_slot_assignment
        distinguishing_aspect: |
          Resource = screening lane; semantics = half-open interval overlap over
          [scheduled_for, scheduled_for + 24h) — DIFFERENT from aggregate capacity.
          A screening whose window starts at EXACTLY the instant another IN_PROGRESS
          screening's window ends (adjacency, gap = 0) does NOT collide, so with a
          single lane both visits receive lane index 0.
        test_recipe:
          setup:
            - "Center with screening_lanes=1; donorA's screening sA scheduled 2026-09-01T08:00 and IN_PROGRESS since 09:00 (window [09-01 08:00, 09-02 08:00))"
            - "donorB's screening sB scheduled 2026-09-02T08:00 (window starts exactly when sA's ends); clock at 2026-09-02T07:59:00Z so sA is still IN_PROGRESS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plasma-centers"
              payload: { center_code: "CSL-DAL-014", legal_name: "CSL Plasma Dallas 014", state_code: "TX", screening_lanes: 1, donor_floor_beds: 2, observation_chairs: 2 }
              as: PlatformAdmin
              captures: { c: $.data.id, cv: $.data.version }
            - call: "POST /plasma-centers/${c}/compensation-schedules"
