      - name: order_cancel_three_hop_cascade_returns_volume_and_revives_exhausted_contract
        grounds:
          - state_machines.Order.ALLOCATED_to_CANCELLED
          - state_machines.ForwardPricingContract.EXHAUSTED_to_ACTIVE
          - calculations.contract_volume_conservation
          - calculations.customer_open_exposure
          - entities.ContractLine.fields.volume_drawn_lb
        distinguishing_aspect: |
          A third chain, walked in the give-back direction: cancel releases the lot reservation,
          then hop 2 returns 20000 drawn pounds to the single ContractLine, and because that line
          falls back below its 20000 lb commitment the contract auto-transitions EXHAUSTED ->
          ACTIVE (hop 3) while pricing_status goes PROVISIONAL -> VOID, total_cents 866404 -> 0 and
          open_exposure_cents 866404 -> 0. Distinct from the other two cascades in both the
          triggering endpoint and the entities touched (ContractLine and ForwardPricingContract).
