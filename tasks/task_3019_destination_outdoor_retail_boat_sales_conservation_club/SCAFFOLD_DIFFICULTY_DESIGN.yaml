              payload: { email: "m_po@x.com", full_name: "Poe Strand", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/attractions"
              payload: { attraction_type: "AQUARIUM", capacity_units: 40, dwell_cost_minutes: 30 }
              as: StoreManager
              captures: { at_id: $.data.id }
            - call: "POST /stores/attractions/${at_id}/open"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m_id}", session_kind: "GENERAL_ADMISSION", party_size: 5, slot_start_utc: "2026-11-01T10:00:00Z", slot_end_utc: "2026-11-01T11:00:00Z" }
              as: AttractionHost
              captures: { sA_id: $.data.id }
            - call: "GET /stores/${st_id}/dwell-summary"
              as: StoreManager
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m_id}", session_kind: "GENERAL_ADMISSION", party_size: 2, slot_start_utc: "2026-11-02T10:00:00Z", slot_end_utc: "2026-11-02T11:00:00Z" }
              as: AttractionHost
              captures: { err: $.data.error_id }
            - call: "GET /stores/sessions/${sA_id}"
              as: AttractionHost
          assert:
            - "the first session confirms with AttractionSession.${sA_id}.status == CONFIRMED and AttractionSession.${sA_id}.dwell_charge_minutes == 300 (party_size 5 at 30 minutes per guest under the doubled whole-party band multiplier)"
            - "the dwell summary read shows Store.attraction_posture == FROZEN and Store.dwell_free_minutes == -180, a 300-minute commit against a 120-minute budget, so the aggregate gate closed as a consequence of the first session"
            - "the second session is rejected with data.error_id == ERR_POSTURE_FROZEN and http 409 before its venue capacity is even consulted"
            - "AttractionSession.${sA_id}.status is still CONFIRMED after the rejection, so the gate rejects the new booking rather than rolling back the session that closed it"

  # ===========================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: shared_capacity_window_overlap_on_attraction
        grounds:
          - validations[priority=13]
          - validations[priority=17]
          - entities.AttractionSession.fields.slot_start_utc
          - entities.Attraction.fields.capacity_units
          - errors[ERR_SESSION_OVERLAP]
        distinguishing_aspect: |
          Aggregate cumulative-capacity arithmetic: a new party is rejected only
          when its interval overlaps a live session's interval AND the two party
          sizes together exceed the venue capacity, so adjacency at the shared
          endpoint is free and two small parties may coexist inside the same
          interval.
        test_recipe:
          setup:
            - "A store at clock 2026-09-01T00:00Z with an AQUARIUM of capacity_units 10 and dwell_cost_minutes 30, and two members."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/attractions"
              payload: { attraction_type: "AQUARIUM", capacity_units: 10, dwell_cost_minutes: 30 }
              as: StoreManager
              captures: { at_id: $.data.id }
            - call: "POST /stores/attractions/${at_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_ov1@x.com", full_name: "Ora Vale", donation_opt_in: false }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_ov2@x.com", full_name: "Oz Vale", donation_opt_in: false }
              as: Anonymous
              captures: { m2_id: $.data.id }
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m1_id}", session_kind: "GENERAL_ADMISSION", party_size: 6, slot_start_utc: "2026-11-01T10:00:00Z", slot_end_utc: "2026-11-01T11:00:00Z" }
              as: AttractionHost
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m2_id}", session_kind: "GENERAL_ADMISSION", party_size: 3, slot_start_utc: "2026-11-01T11:00:00Z", slot_end_utc: "2026-11-01T12:00:00Z" }
              as: AttractionHost
              captures: { s2_id: $.data.id }
            - call: "GET /stores/sessions/${s2_id}"
              as: AttractionHost
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m2_id}", session_kind: "GENERAL_ADMISSION", party_size: 3, slot_start_utc: "2026-11-01T10:30:00Z", slot_end_utc: "2026-11-01T11:30:00Z" }
              as: AttractionHost
              captures: { s3_id: $.data.id }
            - call: "GET /stores/sessions/${s3_id}"
              as: AttractionHost
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m2_id}", session_kind: "GENERAL_ADMISSION", party_size: 5, slot_start_utc: "2026-11-01T10:30:00Z", slot_end_utc: "2026-11-01T11:30:00Z" }
              as: AttractionHost
              captures: { err: $.data.error_id }
          assert:
            - "the party of 3 booked 11:00 to 12:00 is accepted: AttractionSession.${s2_id}.status == CONFIRMED, because it touches the 10:00-11:00 slot only at the shared endpoint, which the half-open interval leaves free"
            - "the party of 3 booked 10:30 to 11:30 is also accepted: AttractionSession.${s3_id}.status == CONFIRMED, because 6 + 3 stays within capacity_units 10"
            - "Attraction.${at_id}.in_use_units == 12 across the 11:00 instant, counting both the 6-guest and the 3-guest overlapping parties"
            - "the party of 5 booked 10:30 to 11:30 is rejected with data.error_id == ERR_SESSION_OVERLAP and http 409, because 6 + 5 exceeds capacity_units 10 at that overlap"
            - "the rejection is an aggregate cumulative check, not an exclusivity lock: the same 10:30-11:30 window already holds one confirmed party"

      - name: bay_turnover_buffer_overlap_on_loading_bay
        grounds:
          - validations[priority=13]
          - validations[priority=5]
          - entities.LoadingBayBooking.fields.booked_start_utc
          - errors[ERR_BAY_BOOKING_CONFLICT]
        distinguishing_aspect: |
          Buffered exclusivity: a bay booking is rejected when its interval
          widened by a symmetric 15-minute turnover buffer collides, so an
          adjacent booking that would be legal under the venue's half-open
          arithmetic is illegal here — different interval semantics on a
          different resource entity.
        test_recipe:
          setup:
            - "A store at clock 2026-09-01T00:00Z with load_bays_total 4, one boat unit, one member and one OVERSIZE_LOADING service order."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_bb@x.com", full_name: "Bay Bright", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/boat-units"
              payload: { stock_no: "BU-BB", model_name: "Bay 170", unit_price_cents: 4000000, unit_condition: "NEW", hull_id_no: "HINBB0000001" }
              as: DealDeskClerk
              captures: { bu_id: $.data.id }
            - call: "POST /stores/${st_id}/service-orders"
              payload: { boat_unit_id: "${bu_id}", order_kind: "OVERSIZE_LOADING", promised_lead_days: 3 }
              as: ServiceWriter
              captures: { so_id: $.data.id }
            - call: "POST /stores/${st_id}/bay-bookings"
              payload: { bay_no: 2, member_id: "${m_id}", service_order_id: "${so_id}", booked_start_utc: "2026-09-08T09:00:00Z", booked_end_utc: "2026-09-08T10:00:00Z" }
              as: ReceivingManager
              captures: { bk1_id: $.data.id }
          trigger:
            - call: "POST /stores/${st_id}/bay-bookings"
              payload: { bay_no: 2, member_id: "${m_id}", service_order_id: "${so_id}", booked_start_utc: "2026-09-08T10:05:00Z", booked_end_utc: "2026-09-08T11:00:00Z" }
              as: ReceivingManager
              captures: { err: $.data.error_id }
            - call: "POST /stores/${st_id}/bay-bookings"
              payload: { bay_no: 2, member_id: "${m_id}", service_order_id: "${so_id}", booked_start_utc: "2026-09-08T10:15:00Z", booked_end_utc: "2026-09-08T11:00:00Z" }
              as: ReceivingManager
              captures: { bk2_id: $.data.id }
            - call: "GET /stores/${st_id}/load-bays/2/bookings"
              as: ReceivingManager
            - call: "POST /stores/${st_id}/bay-bookings"
              payload: { bay_no: 2, member_id: "${m_id}", service_order_id: "${so_id}", booked_start_utc: "2026-09-08T09:00:00Z", booked_end_utc: "2026-09-08T10:00:00Z" }
              as: ReceivingManager
              captures: { err2: $.data.error_id }
          assert:
            - "the booking starting 10:05 is rejected with data.error_id == ERR_BAY_BOOKING_CONFLICT and http 409, because the 15-minute trailing buffer from the 10:00 end still holds the bay"
            - "the booking starting 10:15 is accepted: LoadingBayBooking.${bk2_id}.status == RESERVED, so a five-minute later start is the point at which the buffer clears"
            - "the bay query returns total_count == 2, so exactly two bookings survive on bay 2"
            - "the retried 09:00-10:00 booking is rejected with data.error_id == ERR_BAY_BOOKING_CONFLICT, so adjacency is never legal on this resource the way it is on a venue"

  # ===========================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: points_redemption_reversal_conserves_the_ledger
        grounds:
          - calculations.club_points_apply
          - calculations.tier_threshold_eval
          - entities.PointEvent.fields.points_delta
          - entities.Member.fields.points_balance
        distinguishing_aspect: |
          Conserved quantity: the point ledger. A REDEEM of 300 followed by a
          REVERSAL of the same magnitude must restore both points_balance and
          points_lifetime_earned exactly, pinned as balance_after ==
          balance_before and lifetime_after == lifetime_before over the ordered
          point-event replay.
        test_recipe:
          setup:
            - "A store at clock 2026-09-01T00:00Z and one club member."
            - "Three prior awards of 25000, 1000 and 500 points, so the member reads GOLD at 26500 lifetime and 25000 redeemable."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_ci@x.com", full_name: "Iris Cove", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/point-events"
              payload: { member_id: "${m_id}", event_kind: "AWARD", points_delta: 25000 }
              as: ClubCardSpecialist
              captures: { pe_a_id: $.data.id }
            - call: "POST /stores/${st_id}/point-events"
              payload: { member_id: "${m_id}", event_kind: "AWARD", points_delta: 1000 }
              as: ClubCardSpecialist
              captures: { pe_b_id: $.data.id }
            - call: "POST /stores/${st_id}/point-events"
              payload: { member_id: "${m_id}", event_kind: "AWARD", points_delta: 500 }
              as: ClubCardSpecialist
              captures: { pe_c_id: $.data.id }
            - call: "GET /stores/members/${m_id}"
              as: StoreManager
          trigger:
            - call: "POST /stores/${st_id}/point-events"
              payload: { member_id: "${m_id}", event_kind: "REDEEM", points_delta: -300 }
              as: ClubCardSpecialist
              captures: { pe_r_id: $.data.id }
            - call: "GET /stores/members/${m_id}"
              as: StoreManager
            - call: "POST /stores/${st_id}/point-events"
              payload: { member_id: "${m_id}", event_kind: "REVERSAL", points_delta: 300, boat_deal_id: null }
              as: ClubCardSpecialist
              captures: { pe_x_id: $.data.id }
            - call: "GET /stores/members/${m_id}"
              as: StoreManager
          assert:
            - "before the redemption Member.${m_id}.points_balance == 26500 and Member.${m_id}.points_lifetime_earned == 26500"
            - "after the redemption Member.${m_id}.points_balance == 26200, so exactly 300 points moved"
            - "after the reversal Member.${m_id}.points_balance == 26500, which is balance_after == balance_before, the pinned invariant"
            - "Member.${m_id}.points_lifetime_earned == 26500 after the reversal, and Member.${m_id}.club_tier == GOLD, so the compensating pair left the conserved quantity and the derived tier unchanged"
            - "Member.${m_id}.redeemable_points == 25000 both before the redemption and after the reversal"

      - name: cancel_restore_conserves_the_exact_committed_dwell
        grounds:
          - calculations.attraction_dwell_charge
          - calculations.attraction_posture
          - state_machines.AttractionSession.transitions.CONFIRMED_to_CANCELLED
          - entities.Store.fields.dwell_committed_minutes
        distinguishing_aspect: |
          Conserved quantity: the store's committed dwell-minute budget. The
          confirm and cancel pair must leave dwell_committed_minutes identical
          across the cancel boundary for a session whose dwell_charge_minutes is
          fixed, even though a band-edge party size makes dwell_charge_minutes
          recompute differently if it were re-confirmed.
        test_recipe:
          setup:
            - "A store with dwell_capacity_minutes 60000 at clock 2026-09-01T00:00Z, an AQUARIUM of capacity_units 40 and dwell_cost_minutes 30, and two members."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/attractions"
              payload: { attraction_type: "AQUARIUM", capacity_units: 40, dwell_cost_minutes: 30 }
              as: StoreManager
              captures: { at_id: $.data.id }
            - call: "POST /stores/attractions/${at_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_ci1@x.com", full_name: "Ivo Carr", donation_opt_in: false }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_ci2@x.com", full_name: "Ines Carr", donation_opt_in: false }
              as: Anonymous
              captures: { m2_id: $.data.id }
            - call: "GET /stores/${st_id}/dwell-summary"
              as: StoreManager
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m1_id}", session_kind: "GENERAL_ADMISSION", party_size: 10, slot_start_utc: "2026-11-01T10:00:00Z", slot_end_utc: "2026-11-01T11:00:00Z" }
              as: AttractionHost
              captures: { sK_id: $.data.id }
          trigger:
            - call: "POST /stores/attraction-sessions/${sK_id}/cancel"
              payload: {}
              as: AttractionHost
            - call: "GET /stores/${st_id}/dwell-summary"
              as: StoreManager
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at_id}", member_id: "${m2_id}", session_kind: "GENERAL_ADMISSION", party_size: 10, slot_start_utc: "2026-11-02T10:00:00Z", slot_end_utc: "2026-11-02T11:00:00Z" }
              as: AttractionHost
              captures: { sM_id: $.data.id }
            - call: "GET /stores/${st_id}/dwell-summary"
              as: StoreManager
          assert:
            - "the baseline dwell summary reports Store.dwell_committed_minutes == 0 before any session"
            - "while AttractionSession.${sK_id} is CONFIRMED Store.dwell_committed_minutes == 900, which is dwell_cost_minutes 30 and party_size 10 at the triple whole-party band multiplier (30 * 3 * 10), not the double multiplier reserved for the 5-to-9 band"
            - "after the cancel Store.dwell_committed_minutes == 0 again, so committed_after_cancel == committed_before_confirm"
            - "the cancel restores the exact charge rather than a recomputed one: re-confirming the identical party in AttractionSession.${sM_id} brings the store back to exactly 900"
            - "Store.dwell_free_minutes == 60000 at baseline and == 59100 while the replacement session is live"

