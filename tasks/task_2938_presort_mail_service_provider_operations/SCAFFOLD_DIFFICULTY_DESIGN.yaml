            - "At the mid-cycle GET (after RETURN, before revise): MailJob.${job_a_id}.status == REWORK, rework_count == 1, postage_due_cents == 0; CommingleBatch.${batch_id}.status == REWORK with achieved_tier NONE, rate_mills_per_piece 0 and batch_postage_cents 0"
            - "After revise: MailJob.${job_a_id}.status == POOLED and MailJob.${job_b_id}.status == POOLED — the cycle closed back onto POOLED, a state each job already occupied once"
            - "After revise: MailJob.${job_a_id}.rework_count == 1 (still 1, not reset by the return to POOLED) and MailJob.${job_b_id}.rework_count == 1"
            - "After revise: CommingleBatch.${batch_id}.status == OPEN, achieved_tier == THREE_DIGIT, rate_mills_per_piece == 26384, batch_postage_cents == 79152 — rebuilt to the pre-unwind values from the surviving members"
            - "After revise: BatchMember.${mem_a_id}.allocated_postage_cents == 31660 / share_basis_pct == 40.0000 and BatchMember.${mem_b_id}.allocated_postage_cents == 47492 / share_basis_pct == 60.0000, with allocated_adjustment_cents 0 on both"
            - "After revise: SortContainer.${cont_1_id}.status == STAGED with placard_id == null and SortContainer.${cont_2_id}.status == STAGED with placard_id == null"
            - "After revise: PostageStatement.${stmt_id}.status == DRAFT, revision_index == 1, adjustment_cents == 0, verified_postage_cents == 0, verification_error_count == 0, submitted_by_user_id == null, declared_postage_cents == 79152 re-frozen from the recomputed batch"
            - "PermitAccount.${pa_h_id}.balance_cents == 200000 and reserved_cents == 0 — the reservation was released on RETURN and not re-taken by revise"
            - "GET /postage-statements/${stmt_id}/findings still returns 1 finding: revise retains findings as history rather than deleting them"

      - name: postage_statement_branching_fork
        grounds:
          - state_machines.PostageStatement.SUBMITTED_to_RETURNED_FOR_CORRECTION
          - state_machines.PostageStatement.SUBMITTED_to_ACCEPTED_CLEAN
          - state_machines.PostageStatement.RETURNED_FOR_CORRECTION_to_DRAFT
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          PostageStatement forks from SUBMITTED into three mutually exclusive successors
          chosen by data, not by the caller: the SAME request body {outcome: ACCEPT}
          resolves to ACCEPTED_CLEAN or ACCEPTED_WITH_ADJUSTMENT depending on
          adjustment_cents, while {outcome: RETURN} takes a third branch whose side-effect
          set is the opposite of ACCEPT's (RETURN moves no money out and unwinds the batch;
          ACCEPT consumes the reservation and leaves the batch DOCUMENTED). This instance
          walks the RETURN branch and then, after a re-sort, the ACCEPTED_CLEAN branch on
          the same statement row, so the two branch bodies cannot share an implementation.
        test_recipe:
          setup:
            - "Same canonical starting position: batch sorted, statement submitted by pm-001, permit 120848 available / 79152 reserved."
          setup_api_calls: *chain_submitted
          trigger:
            - call: "POST /postage-statements/${stmt_id}/findings"
              payload: { finding_type: "SHORT_PAID", affected_piece_count: 60 }
              as: AcceptanceClerk
              as_user_id: "clerk-007"
            - call: "POST /postage-statements/${stmt_id}/verify"
              payload: { outcome: "RETURN" }
              as: AcceptanceClerk
              as_user_id: "clerk-007"
              captures: { stmt_status_returned: $.data.status }
            - call: "POST /postage-statements/${stmt_id}/revise"
              payload: {}
              as: PostageManager
              as_user_id: "pm-001"
            - call: "POST /commingle-batches/${batch_id}/sort"
              payload: {}
              as: PresortOperator
            - call: "POST /postage-statements/${stmt_id}/submit"
              payload: {}
              as: PostageManager
              as_user_id: "pm-001"
            - call: "POST /postage-statements/${stmt_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: AcceptanceClerk
              as_user_id: "clerk-007"
              captures: { stmt_status_accepted: $.data.status }
          assert:
            - "First fork: ${stmt_status_returned} == RETURNED_FOR_CORRECTION, adjustment_cents == 0 and verified_postage_cents == 0 even though a finding existed, and PermitAccount.${pa_h_id} is back to 200000 / 0"
            - "Second fork on the SAME statement id: ${stmt_status_accepted} == ACCEPTED_CLEAN, because revise cleared verification_error_count to 0 and no new finding was raised, so adjustment_cents == 0 selects the CLEAN successor rather than ACCEPTED_WITH_ADJUSTMENT"
            - "PostageStatement.${stmt_id}: revision_index == 1, verified_postage_cents == 79152 == declared_postage_cents, verified_by_user_id == clerk-007"
            - "After the ACCEPT branch: PermitAccount.${pa_h_id}.balance_cents == 120848 and reserved_cents == 0 — the reservation was consumed, the opposite of the RETURN branch which returned it"
            - "After the ACCEPT branch: CommingleBatch.${batch_id}.status == DOCUMENTED (not REWORK), SortContainer.${cont_1_id}.status == DOCUMENTED, MailJob.${job_a_id}.status == PRESORTED with rework_count == 1"
            - "GET /postage-statements/${stmt_id}/findings returns the single historical finding, whose surcharge no longer contributes to any statement total"

  # ===========================================================================
  # Rule 4 — Transitive cascades: one of depth 4, one of depth 3, different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: statement_return_cascade_depth_four
        grounds:
          - state_machines.PostageStatement.SUBMITTED_to_RETURNED_FOR_CORRECTION
          - state_machines.CommingleBatch.DOCUMENTED_to_REWORK
          - state_machines.MailJob.PRESORTED_to_REWORK
          - state_machines.Client.ACTIVE_to_SUSPENDED
          - entities.MailJob.fields.rework_count
        distinguishing_aspect: |
          Depth 4, and each link is caused strictly by the previous one:
          (1) verify RETURN releases the permit reservation and moves the statement to
          RETURNED_FOR_CORRECTION; (2) BECAUSE the statement returned, the batch goes
          DOCUMENTED -> REWORK and zeroes its frozen pricing; (3) BECAUSE the batch entered
          REWORK, every member allocation is zeroed, every member MailJob goes
          PRESORTED -> REWORK with rework_count += 1 and every SortContainer goes
          DOCUMENTED -> RETURNED; (4) BECAUSE a job's rework_count reached
          REWORK_SUSPEND_THRESHOLD (2), that job's Client goes ACTIVE -> SUSPENDED with
          suspension_reason REPEATED_PRESORT_REWORK. Link 4 fires only on the SECOND return
          cycle, so an implementation that stops at link 3 passes the first cycle and fails
          here. Trigger is a verification outcome (contrast with the deposit trigger below).
        test_recipe:
          setup:
            - "The canonical batch has already been through one full return cycle (finding, verify RETURN, revise, re-sort, re-submit), so both member jobs carry rework_count == 1 and the statement is SUBMITTED at revision_index 1."
            - "Both Clients ACME and BORE are still ACTIVE, and the permit holds 120848 available / 79152 reserved."
