              payload: {}
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { wa_ver_2: $.data.version }
          trigger:
            - call: "POST /wrestlers/${wrestler_a}/descent-plans"
              payload: { source_assessment_id: "${assess_a}", plan_variant: "LINEAR_RATE", target_class_lbs: 157, plan_start_date: "2026-11-09", expected_wrestler_version: "${wa_ver_2}" }
