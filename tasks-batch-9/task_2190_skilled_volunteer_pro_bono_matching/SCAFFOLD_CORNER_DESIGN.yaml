        grounds: [entities.SkillProfile.fields.volunteer_id, entities.AvailabilityWindow.fields.volunteer_id, "endpoints[GET /volunteers/{id}/skill-profiles]", "endpoints[GET /volunteers/{id}/availability-windows]"]
