# =============================================================================
# task_2202 — Recycled Paper Mill Operations
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Every instance grounds ONLY in elements declared by the sibling SCAFFOLD.yaml
# (§1.1 entities, §1.2 state_machines, §1.2.1 concurrency_rules, §1.3
# calculations, §1.4 validations, §1.5 endpoints, §1.6 errors, §1.7 roles).
# Deleting this file leaves the scaffold's declared behaviour identical.
#
# Logical-clock convention: before any POST /_clock/set_current_utc the clock
# reads exactly 2026-08-01T00:00:00Z (§1.5), so instances that need no time
# travel omit the clock call and rely on that pinned instant.
#
# Opaque-role X-User-ID convention used throughout:
#   MillPlanner mp_1 | FiberBuyer fb_1 | QualityLab ql_sample / ql_dispo / ql_cert
#   MachineOperator mo_1 / mo_2 | EnvironmentalOfficer eo_log / eo_prep / eo_sign
#   EnergyManager em_1.  Entity-backed roles pass the owning row id.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: pulp_batch_book_yield_versus_measured_reject_variance
        grounds:
          - calculations.pulp_yield_provisional
          - calculations.pulp_yield_final
          - calculations.receipt_net_tons
          - state_machines.PulpBatch.QUEUED_to_PULPING
          - state_machines.PulpBatch.CLEANED_to_APPROVED
          - entities.PulpBatch.fields.provisional_accepted_tons
          - entities.PulpBatch.fields.final_accepted_tons
          - entities.PulpBatch.fields.yield_variance_tons
        distinguishing_aspect: |
          This instance's dual variant lives in the recovered-fiber / pulping entity domain
          (PulpBatch tonnage): provisional_accepted_tons is projected from
          FiberGrade.nominal_yield_pct discounted by CONTAM_PENALTY_FACTOR at PULPING, while
          final_accepted_tons subtracts the physically weighed measured_reject_tons from
          charged_tons at APPROVED, so one PulpBatch row simultaneously stores 24.926 and
          25.500 for "accepted tonnage" and yield_variance_tons is the signed 0.574 gap that
          nothing reconciles.
        test_recipe:
          setup:
            - "FiberGrade MIX_54 (max_contamination 6.00) and OCC_11 (max_contamination 3.00, max_moisture 12.00, nominal_yield 88.00, downgrade target MIX_54) declared."
            - "PaperGradeSpec TL_140 (CONTAINERBOARD, requires_deink_pulp false) declared."
            - "Supplier Riverbend (freight_per_ton 22.00, QUALIFIED) with a CONFIRMED 200.00-ton OCC_11 purchase order."
            - "One FiberReceipt of two sublots dispositioned ACCEPT, producing an AVAILABLE FiberInventoryLot with tons_received 36.00 and contamination_pct 2.73."
            - "A single-line PulpBatch on OCC_LINE targeting TL_140 charging 30.000 tons of that lot, driven QUEUED -> PULPING -> SCREENED -> CLEANED with measured_reject_tons 4.500."
          setup_api_calls:
            - { call: "POST /fiber-grades", payload: { grade_code: "MIX_54", index_symbol: "PPI_OCC", max_contamination_pct: 6.00, max_moisture_pct: 14.00, nominal_yield_pct: 78.00, deink_required: false, rank_order: 5 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-grades", payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, downgrade_target_grade_code: "MIX_54", rank_order: 1 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /paper-grade-specs", payload: { product_code: "TL_140", family: "CONTAINERBOARD", basis_weight_gsm: 140.0, target_moisture_pct: 7.50, moisture_tolerance_pct: 0.80, min_sct_kn_m: 2.20, requires_deink_pulp: false, rank_order: 10 }, as: MillPlanner, as_user_id: "mp_1" }
            - { call: "POST /market-index-quotes", payload: { index_symbol: "PPI_OCC", effective_month: "2026-07", published_price_per_ton: 190.00 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /suppliers", payload: { name: "Riverbend Fiber", freight_per_ton: 22.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /fiber-purchase-orders", payload: { supplier_id: "${sup_id}", fiber_grade_code: "OCC_11", contracted_tons: 200.00, index_basis: "PRIOR_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 0.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { po_id: "$.data.id", po_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders/${po_id}/price", payload: { expected_purchase_order_version: "${po_v1}" }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-purchase-orders/${po_id}/confirm", payload: {}, as: Supplier, as_user_id: "${sup_id}" }
            - { call: "POST /fiber-purchase-orders/${po_id}/receipts", payload: { truck_reference: "TRK-A-001", sublots: [ { sublot_no: 1, gross_tons: 22.000, tare_tons: 2.000, moisture_pct: 14.50, contamination_pct: 2.50 }, { sublot_no: 2, gross_tons: 18.000, tare_tons: 1.500, moisture_pct: 11.00, contamination_pct: 3.00 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_id: "$.data.id", rcpt_net: "$.data.net_tons" } }
            - { call: "POST /fiber-receipts/${rcpt_id}/disposition", payload: { disposition: "ACCEPT" }, as: QualityLab, as_user_id: "ql_dispo" }
            - { call: "GET /fiber-inventory-lots", payload: { receipt_id: "${rcpt_id}" }, as: MachineOperator, as_user_id: "mo_1", captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /pulp-batches", payload: { pulper_line: "OCC_LINE", target_product_code: "TL_140", furnish_lines: [ { inventory_lot_id: "${lot_id}", tons_charged: 30.000 } ] }, as: MachineOperator, as_user_id: "mo_1", captures: { pb_id: "$.data.id" } }
            - { call: "POST /pulp-batches/${pb_id}/start", payload: {}, as: MachineOperator, as_user_id: "mo_1", captures: { prov_tons: "$.data.provisional_accepted_tons" } }
            - { call: "POST /pulp-batches/${pb_id}/screen", payload: {}, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/clean", payload: { measured_reject_tons: 4.500 }, as: MachineOperator, as_user_id: "mo_1" }
          trigger:
            - { call: "POST /pulp-batches/${pb_id}/approve", payload: {}, as: QualityLab, as_user_id: "ql_cert", captures: { fin_tons: "$.data.final_accepted_tons" } }
          assert:
            - "FiberReceipt.${rcpt_id}.net_tons == 36.00"
            - "FiberReceipt.${rcpt_id}.weighted_contamination_pct == 2.73"
            - "FiberReceipt.${rcpt_id}.weighted_moisture_pct == 12.92"
            - "FiberReceipt.${rcpt_id}.moisture_deduction_tons == 0.500"
            - "FiberInventoryLot.${lot_id}.tons_received == 36.00 AND FiberInventoryLot.${lot_id}.contamination_pct == 2.73"
            - "PulpBatch.${pb_id}.charged_tons == 30.000 AND PulpBatch.${pb_id}.blend_contamination_pct == 2.730"
            - "PulpBatch.${pb_id}.provisional_accepted_tons == 24.926"
            - "PulpBatch.${pb_id}.final_accepted_tons == 25.500"
            - "PulpBatch.${pb_id}.yield_variance_tons == 0.574"
            - "PulpBatch.${pb_id}.available_tons == 25.500"
            - "PulpBatch.${pb_id}.provisional_accepted_tons != PulpBatch.${pb_id}.final_accepted_tons"
            - "PulpBatch.${pb_id}.status == APPROVED"

      - name: run_quality_endpoints_unweighted_versus_all_reels_weighted_divergence
        grounds:
          - calculations.run_quality_index_provisional
          - calculations.run_quality_index_certified
          - state_machines.ProductionRun.RUNNING_to_COMPLETED
          - state_machines.ProductionRun.PROVISIONAL_to_HELD
          - entities.ProductionRun.fields.provisional_quality_index
          - entities.ProductionRun.fields.certified_quality_index
          - entities.ProductionRun.fields.off_spec_reel_count
        distinguishing_aspect: |
          This instance's dual variant lives in the finished-paper quality entity domain
          (ProductionRun reel scoring), not the pulping tonnage domain: on identical
          reel_readings the first-and-last-reel unweighted mean yields
          provisional_quality_index 100.00 (>= 85.00) while the tonnage-weighted all-reel mean
          yields certified_quality_index 82.06 (< 85.00), with off_spec_reel_count == 0, so the
          same run is certifiable under one variant and HELD under the other.
        test_recipe:
          setup:
            - "FiberGrade MIX_54 / OCC_11 and PaperGradeSpec TL_140 (basis_weight 140.0, target_moisture 7.50, tolerance 0.80, min_sct 2.20, no brightness requirement) declared."
            - "PaperMachine PM1 (wire_width 4200, max_tons_per_hour 20.00, changeover_buffer 60, steam 1.400) RUNNABLE, and EffluentPermit MILL-NPDES-01 at posture COMPLIANT."
            - "An APPROVED PulpBatch of TL_140 furnish with available_tons 25.500 (as in pulp_batch_book_yield_versus_measured_reject_variance)."
            - "ProductionRun R1 on PM1, product TL_140, pulp_draw_tons 20.000, started by mo_1 and COMPLETED with four reel_readings: reels 1 and 4 exactly on target at 1.000 t each, reels 2 and 3 at basis_weight 146.8 gsm (4.857% deviation, inside the 5.00% off-spec gate) at 12.000 t each."
          setup_api_calls:
            - { call: "POST /fiber-grades", payload: { grade_code: "MIX_54", index_symbol: "PPI_OCC", max_contamination_pct: 6.00, max_moisture_pct: 14.00, nominal_yield_pct: 78.00, deink_required: false, rank_order: 5 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-grades", payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, downgrade_target_grade_code: "MIX_54", rank_order: 1 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /paper-grade-specs", payload: { product_code: "TL_140", family: "CONTAINERBOARD", basis_weight_gsm: 140.0, target_moisture_pct: 7.50, moisture_tolerance_pct: 0.80, min_sct_kn_m: 2.20, requires_deink_pulp: false, rank_order: 10 }, as: MillPlanner, as_user_id: "mp_1" }
            - { call: "POST /market-index-quotes", payload: { index_symbol: "PPI_OCC", effective_month: "2026-07", published_price_per_ton: 190.00 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /suppliers", payload: { name: "Riverbend Fiber", freight_per_ton: 22.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /effluent-permits", payload: { permit_number: "MILL-NPDES-01", bod_limit_kg_per_day: 100.00, tss_limit_kg_per_day: 200.00, flow_limit_m3_per_day: 5000.00, rolling_window_days: 7 }, as: EnvironmentalOfficer, as_user_id: "eo_log", captures: { permit_id: "$.data.id" } }
            - { call: "POST /paper-machines", payload: { name: "PM1", wire_width_mm: 4200, max_tons_per_hour: 20.00, changeover_buffer_minutes: 60, steam_tph_per_ton: 1.400 }, as: MillPlanner, as_user_id: "mp_1", captures: { pm1_id: "$.data.id", pm1_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders", payload: { supplier_id: "${sup_id}", fiber_grade_code: "OCC_11", contracted_tons: 200.00, index_basis: "PRIOR_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 0.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { po_id: "$.data.id", po_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders/${po_id}/price", payload: { expected_purchase_order_version: "${po_v1}" }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-purchase-orders/${po_id}/confirm", payload: {}, as: Supplier, as_user_id: "${sup_id}" }
            - { call: "POST /fiber-purchase-orders/${po_id}/receipts", payload: { truck_reference: "TRK-A-001", sublots: [ { sublot_no: 1, gross_tons: 22.000, tare_tons: 2.000, moisture_pct: 14.50, contamination_pct: 2.50 }, { sublot_no: 2, gross_tons: 18.000, tare_tons: 1.500, moisture_pct: 11.00, contamination_pct: 3.00 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_id: "$.data.id" } }
            - { call: "POST /fiber-receipts/${rcpt_id}/disposition", payload: { disposition: "ACCEPT" }, as: QualityLab, as_user_id: "ql_dispo" }
            - { call: "GET /fiber-inventory-lots", payload: { receipt_id: "${rcpt_id}" }, as: MachineOperator, as_user_id: "mo_1", captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /pulp-batches", payload: { pulper_line: "OCC_LINE", target_product_code: "TL_140", furnish_lines: [ { inventory_lot_id: "${lot_id}", tons_charged: 30.000 } ] }, as: MachineOperator, as_user_id: "mo_1", captures: { pb_id: "$.data.id" } }
            - { call: "POST /pulp-batches/${pb_id}/start", payload: {}, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/screen", payload: {}, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/clean", payload: { measured_reject_tons: 4.500 }, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/approve", payload: {}, as: QualityLab, as_user_id: "ql_cert" }
            - { call: "POST /paper-machines/${pm1_id}/runs", payload: { product_code: "TL_140", pulp_batch_id: "${pb_id}", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T06:00:00Z", pulp_draw_tons: 20.000, expected_machine_version: "${pm1_v1}" }, as: MillPlanner, as_user_id: "mp_1", captures: { run_id: "$.data.id" } }
            - { call: "POST /paper-machines/${pm1_id}/runs/${run_id}/start", payload: {}, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /paper-machines/${pm1_id}/runs/${run_id}/complete", payload: { broke_tons: 0.000, reel_readings: [ { reel_no: 1, reel_tons: 1.000, basis_weight_gsm: 140.0, moisture_pct: 7.50, sct_kn_m: 2.50 }, { reel_no: 2, reel_tons: 12.000, basis_weight_gsm: 146.8, moisture_pct: 7.50, sct_kn_m: 2.50 }, { reel_no: 3, reel_tons: 12.000, basis_weight_gsm: 146.8, moisture_pct: 7.50, sct_kn_m: 2.50 }, { reel_no: 4, reel_tons: 1.000, basis_weight_gsm: 140.0, moisture_pct: 7.50, sct_kn_m: 2.50 } ] }, as: MachineOperator, as_user_id: "mo_1", captures: { prov_qi: "$.data.provisional_quality_index" } }
          trigger:
            - { call: "POST /paper-machines/${pm1_id}/runs/${run_id}/hold", payload: {}, as: QualityLab, as_user_id: "ql_cert", captures: { cert_qi: "$.data.certified_quality_index" } }
          assert:
            - "ProductionRun.${run_id}.provisional_quality_index == 100.00"
            - "ProductionRun.${run_id}.off_spec_reel_count == 0"
            - "ProductionRun.${run_id}.certified_quality_index == 82.06"
            - "ProductionRun.${run_id}.provisional_quality_index >= 85.00 AND ProductionRun.${run_id}.certified_quality_index < 85.00"
            - "ProductionRun.${run_id}.quality_status == HELD"
            - "ProductionRun.${run_id}.run_status == COMPLETED"

      - name: deink_path_yield_variance_with_sludge_subtraction
        grounds:
          - calculations.pulp_yield_provisional
          - calculations.pulp_yield_final
          - calculations.deink_chemical_cost
          - state_machines.PulpBatch.DEINKING_to_DEINK_HOLD
          - state_machines.PulpBatch.DEINK_HOLD_to_DEINKING
          - state_machines.PulpBatch.DEINKING_to_APPROVED
          - entities.PulpBatch.fields.cumulative_chemical_cost
        distinguishing_aspect: |
          On the deink route the final variant's input_set widens: pulp_yield_final subtracts
          BOTH measured_reject_tons and the summed DEINK_SLUDGE RejectStream tonnage of every
          pass (0.258 + 0.175 = 0.433), so the same PulpBatch carries provisional 10.357
          against final 12.567 — a +2.210 variance whose magnitude is driven by a reject
          weight the book-yield projection never sees.
        test_recipe:
          setup:
            - "FiberGrade DLK_37 (PPI_DLK, max_contamination 2.00, max_moisture 10.00, nominal_yield 72.00, deink_required true, no downgrade target) declared."
            - "PaperGradeSpec TIS_16 (TISSUE, basis_weight 16.0, min_sct 0.00, min_brightness_iso 80.0, requires_deink_pulp true) declared."
            - "Supplier Northgate (freight_per_ton 18.00) with a CONFIRMED 150.00-ton DLK_37 purchase order and one ACCEPTED receipt producing an AVAILABLE lot of 19.82 tons at contamination 1.64."
            - "PulpBatch on DIP_LINE targeting TIS_16 charging 15.000 tons, driven to CLEANED with measured_reject_tons 2.000, then through deink pass 1 (caustic 40.0, peroxide 25.0, surfactant 6.0) which fails brightness at 78.0 and holds."
          setup_api_calls:
            - { call: "POST /fiber-grades", payload: { grade_code: "DLK_37", index_symbol: "PPI_DLK", max_contamination_pct: 2.00, max_moisture_pct: 10.00, nominal_yield_pct: 72.00, deink_required: true, rank_order: 3 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /paper-grade-specs", payload: { product_code: "TIS_16", family: "TISSUE", basis_weight_gsm: 16.0, target_moisture_pct: 5.00, moisture_tolerance_pct: 0.50, min_sct_kn_m: 0.00, min_brightness_iso: 80.0, requires_deink_pulp: true, rank_order: 20 }, as: MillPlanner, as_user_id: "mp_1" }
            - { call: "POST /market-index-quotes", payload: { index_symbol: "PPI_DLK", effective_month: "2026-07", published_price_per_ton: 150.00 }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /suppliers", payload: { name: "Northgate Recovered", freight_per_ton: 18.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /fiber-purchase-orders", payload: { supplier_id: "${sup_id}", fiber_grade_code: "DLK_37", contracted_tons: 150.00, index_basis: "PRIOR_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 0.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { po_id: "$.data.id", po_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders/${po_id}/price", payload: { expected_purchase_order_version: "${po_v1}" }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-purchase-orders/${po_id}/confirm", payload: {}, as: Supplier, as_user_id: "${sup_id}" }
            - { call: "POST /fiber-purchase-orders/${po_id}/receipts", payload: { truck_reference: "TRK-D-001", sublots: [ { sublot_no: 1, gross_tons: 12.000, tare_tons: 1.000, moisture_pct: 10.00, contamination_pct: 1.50 }, { sublot_no: 2, gross_tons: 10.000, tare_tons: 1.000, moisture_pct: 12.00, contamination_pct: 1.80 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_id: "$.data.id" } }
            - { call: "POST /fiber-receipts/${rcpt_id}/disposition", payload: { disposition: "ACCEPT" }, as: QualityLab, as_user_id: "ql_dispo" }
            - { call: "GET /fiber-inventory-lots", payload: { receipt_id: "${rcpt_id}" }, as: MachineOperator, as_user_id: "mo_1", captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /pulp-batches", payload: { pulper_line: "DIP_LINE", target_product_code: "TIS_16", furnish_lines: [ { inventory_lot_id: "${lot_id}", tons_charged: 15.000 } ] }, as: MachineOperator, as_user_id: "mo_1", captures: { pb_id: "$.data.id" } }
            - { call: "POST /pulp-batches/${pb_id}/start", payload: {}, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/screen", payload: {}, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/clean", payload: { measured_reject_tons: 2.000 }, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/deink", payload: { caustic_kg: 40.0, peroxide_kg: 25.0, surfactant_kg: 6.0 }, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/brightness", payload: { brightness_iso: 78.0 }, as: QualityLab, as_user_id: "ql_cert" }
            - { call: "POST /pulp-batches/${pb_id}/deink", payload: { caustic_kg: 55.0, peroxide_kg: 35.0, surfactant_kg: 9.0 }, as: MachineOperator, as_user_id: "mo_1" }
          trigger:
            - { call: "POST /pulp-batches/${pb_id}/brightness", payload: { brightness_iso: 82.0 }, as: QualityLab, as_user_id: "ql_cert" }
          assert:
            - "FiberReceipt.${rcpt_id}.net_tons == 19.82 AND FiberReceipt.${rcpt_id}.weighted_contamination_pct == 1.64"
            - "PulpBatch.${pb_id}.provisional_accepted_tons == 10.357"
            - "PulpBatch.${pb_id}.deink_pass_count == 2"
            - "PulpBatch.${pb_id}.cumulative_chemical_cost == 196.80"
            - "GET /reject-streams?source_ref_id=${pb_id}&source_kind=DEINK_SLUDGE returns total_count == 2 with dry_solids_tons 0.258 and 0.175"
            - "PulpBatch.${pb_id}.final_accepted_tons == 12.567"
            - "PulpBatch.${pb_id}.yield_variance_tons == 2.210"
            - "PulpBatch.${pb_id}.status == APPROVED"

  # ===========================================================================
  # Rule 2 — combinatorial formulas (modes a / b / c all represented)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: indexed_price_tier_frozen_on_provisional_extended_value
        grounds:
          - calculations.indexed_fiber_unit_price
          - state_machines.FiberPurchaseOrder.DRAFT_to_PRICED
          - entities.FiberPurchaseOrder.fields.quoted_unit_price_per_ton
          - entities.FiberPurchaseOrder.fields.extended_contract_value
          - entities.FiberPurchaseOrder.fields.index_quote_month_used
          - entities.MarketIndexQuote
        distinguishing_aspect: |
          Mode c — circular-looking evaluation order: the volume tier is keyed on the step-2
          provisional_extended figure (97500.00, below TIER1_CEILING_USD, so discount 0.000) and
          is never re-derived from the step-5 extended_contract_value (110535.00, which sits
          above that ceiling), so the correct answer is quoted_unit_price_per_ton 221.07 /
          extended 110535.00 and any implementation that closes the loop lands on 218.15 /
          109075.00.
        test_recipe:
          setup:
            - "FiberGrade OCC_11 on index symbol PPI_OCC declared (MIX_54 first, as its downgrade target)."
            - "MarketIndexQuote PPI_OCC 2026-07 at 190.00 plus a decoy PPI_OCC 2026-08 at 240.00 that PRIOR_MONTH basis must ignore."
            - "Supplier Riverbend with freight_per_ton 22.00, posture QUALIFIED."
            - "DRAFT FiberPurchaseOrder for 500.00 tons of OCC_11, index_basis PRIOR_MONTH, priced_for_month 2026-08, negotiated_delta_per_ton 5.00."
          setup_api_calls:
