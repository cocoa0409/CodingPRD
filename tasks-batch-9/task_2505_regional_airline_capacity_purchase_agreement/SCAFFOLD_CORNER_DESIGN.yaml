            - call: "POST /cpa/pass-through-claims"
              payload: { cycle_id: "${cyc}", category: "INSURANCE", estimated_amount_usd: 7500.00 }
              as: RegionalOpsController
          assert:
            - "Both calls return HTTP 201 with data.status == \"SUBMITTED\", allowed_amount_usd == null and variance_usd == null"
            - "ScheduleCycle.${cyc}.estimated_passthrough_total_usd == 20000.00 — 12500.00 + 7500.00"
            - "ScheduleCycle.${cyc}.passthrough_settlement_usd == 0.00 — no claim is RECONCILED yet"
            - "GET /cpa/pass-through-claims?cycle_id=${cyc} returns total_count == 2 in created_at ASC order"

      - name: extension_counter_rounds_exhausted_after_two_loops
        claim_type: cyclic
        grounds:
          - state_machines.ExtensionNegotiation.OFFERED_to_COUNTERED
          - state_machines.ExtensionNegotiation.COUNTERED_to_OFFERED
          - validations[priority=58]
          - errors[ERR_COUNTER_ROUNDS_EXHAUSTED]
        distinguishing_aspect: "The OFFERED↔COUNTERED loop is bounded by counter_round, not by the state alphabet: after two counters the negotiation is legally OFFERED again yet a third counter is refused, and the Agreement stays EXTENSION_PENDING."
        test_recipe:
          setup:
            - "ACTIVE agreement with one base; an extension negotiation opened by the mainline (Agreement EXTENSION_PENDING)."
            - "The negotiation has already looped twice: counter, revise-offer, counter, revise-offer — status OFFERED with counter_round 2."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "GET /cpa/agreements/${ag}"
              payload: {}
              as: MainlineScheduler
              captures: { ag_v: $.data.version }
            - call: "POST /cpa/agreements/${ag}/extension-negotiations"
              payload: { proposed_term_end_date: "2031-12-31", proposed_block_hour_rate_usd: 1500.00, expected_agreement_version: "${ag_v}" }
              as: MainlineScheduler
              captures: { neg: $.data.id }
            - call: "POST /cpa/extension-negotiations/${neg}/counter"
              payload: { counter_term_end_date: "2032-06-30", counter_block_hour_rate_usd: 1575.00 }
              as: RegionalOpsController
            - call: "POST /cpa/extension-negotiations/${neg}/revise-offer"
              payload: { proposed_term_end_date: "2032-03-31", proposed_block_hour_rate_usd: 1525.00 }
              as: MainlineScheduler
            - call: "POST /cpa/extension-negotiations/${neg}/counter"
              payload: { counter_term_end_date: "2032-06-30", counter_block_hour_rate_usd: 1560.00 }
              as: RegionalOpsController
            - call: "POST /cpa/extension-negotiations/${neg}/revise-offer"
              payload: { proposed_term_end_date: "2032-04-30", proposed_block_hour_rate_usd: 1540.00 }
              as: MainlineScheduler
          trigger:
            - call: "POST /cpa/extension-negotiations/${neg}/counter"
              payload: { counter_term_end_date: "2032-06-30", counter_block_hour_rate_usd: 1550.00 }
              as: RegionalOpsController
          assert:
            - "HTTP 409 with data.error_id == \"ERR_COUNTER_ROUNDS_EXHAUSTED\""
            - "ExtensionNegotiation.${neg}.status == \"OFFERED\" and counter_round == 2"
            - "ExtensionNegotiation.${neg}.proposed_term_end_date == \"2032-04-30\" and proposed_block_hour_rate_usd == 1540.00 — the last accepted revision stands"
            - "ExtensionNegotiation.${neg}.counter_term_end_date == \"2032-06-30\" and counter_block_hour_rate_usd == 1560.00 — the refused counter's figures are not recorded"
            - "Agreement.${ag}.status == \"EXTENSION_PENDING\" and Agreement.${ag}.term_end_date == \"2029-12-31\""

      - name: claim_dispute_loop_bounded_by_dispute_round
        claim_type: cyclic
        grounds:
          - state_machines.CancellationClaim.CLASSIFIED_to_DISPUTED
          - errors[ERR_DISPUTE_ROUNDS_EXHAUSTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / cancellation_claim_dispute_reclassify_cycle_bounded_at_two_rounds
          rationale: "That §1.8 instance drives the CLASSIFIED↔DISPUTED loop to exhaustion and asserts dispute_round, classification and the untouched cycle counters."

      - name: brand_audit_parallel_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.BrandAudit.finding_status=OPEN_to_finding_status=ACKNOWLEDGED
          - state_machines.BrandAudit.remediation_status=NOT_STARTED_to_remediation_status=IN_PROGRESS
        excluded_because:
          difficulty_instance: non_linear_state_machine / brand_audit_two_independent_status_dimensions
          rationale: "That §1.8 instance asserts each dimension is unmoved by the other's transition and that closure is guarded across dimensions."

      - name: leg_reinstatement_compensates_cycle_counters
        claim_type: compensation
        grounds:
          - state_machines.FlightLeg.CANCELLED_to_SCHEDULED
          - entities.ScheduleCycle.fields.departure_ledger_total
        excluded_because:
          difficulty_instance: compensating_invariant / departure_ledger_restored_by_leg_reinstate
          rationale: "That §1.8 instance asserts every counter returns to its exact pre-cancel value with the ledger invariant held at each step."

      - name: pilot_attrition_grounds_tail_cross_entity
        claim_type: cross_entity
        grounds:
          - state_machines.Pilot.LINE_QUALIFIED_to_ATTRITED_TO_MAINLINE
          - state_machines.Aircraft.IN_SERVICE_to_GROUNDED_STAFFING
        excluded_because:
          difficulty_instance: transitive_cascade / pilot_attrition_three_hop_grounds_newest_tail
          rationale: "That §1.8 instance asserts the Pilot → CrewBase → Aircraft chain including the pinned created_at DESC grounding selector."

      - name: aircraft_induction_guarded_by_base_staffing_state
        claim_type: guarded transitions
        grounds:
          - state_machines.Aircraft.PENDING_INDUCTION_to_IN_SERVICE
          - validations[priority=34]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / aircraft_induction_gated_on_crewbase_staffing_state
          rationale: "That §1.8 instance asserts the same induct request failing then succeeding purely on the base's LINE_QUALIFIED population."

      - name: invoice_void_reverses_settlement_side_effects
        claim_type: compensation
        grounds:
          - state_machines.Invoice.ISSUED_to_VOIDED
          - entities.Agreement.fields.settled_to_date_usd
        excluded_because:
          difficulty_instance: compensating_invariant / settled_money_restored_by_invoice_void
          rationale: "That §1.8 instance asserts the exact money restoration, the SETTLED → CLOSED revert and the retained frozen components."

  # ===========================================================================
  # Guide section 3 — Calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: bag_rate_and_revenue_cap_from_two_completed_legs
        claim_type: correct_result
        grounds:
          - calculations.mishandled_bag_rate
          - calculations.performance_incentive_penalty
          - endpoints[POST /cpa/schedule-cycles/{cycleId}/close]
        distinguishing_aspect: "A perfect completion factor and on-time record still lose points on bags, and the resulting positive gross is clipped by the 5% revenue cap rather than by the pool cap — every intermediate figure is pinned."
        test_recipe:
          setup:
            - "ACTIVE agreement (fixed 250000.00, ownership fee 62000.00, block-hour 1450.75, departure 320.00, pool cap 90000.00) with one base, one LINE_QUALIFIED captain and one REGIONAL_OWNED IN_SERVICE tail."
            - "OPEN cycle 2026-09 with published_departures 2 and two COMPLETED legs, each 1.000 actual block hours, arriving 5 minutes late; bags 300/1 and 200/2."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/pilots"
              payload: { base_id: "${base}", employee_ref: "EMP-3301", seat: "CAPTAIN", hire_class_date: "2026-06-01" }
              as: RegionalOpsController
              captures: { p1: $.data.id }
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "LINE_QUALIFIED" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N3301RG", seat_count: 76, ownership: "REGIONAL_OWNED" }
              as: RegionalOpsController
              captures: { ac1: $.data.id }
            - call: "POST /cpa/aircraft/${ac1}/induct"
              payload: {}
              as: RegionalOpsController
            - call: "POST /cpa/schedule-cycles"
              payload: { agreement_id: "${ag}", cycle_month: "2026-09", published_departures: 2 }
              as: MainlineScheduler
              captures: { cyc: $.data.id }
            - call: "POST /cpa/schedule-cycles/${cyc}/open"
              payload: {}
              as: MainlineScheduler
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM6801", origin: "MKE", destination: "ORD", scheduled_departure_utc: "2026-09-02T08:00:00Z", scheduled_arrival_utc: "2026-09-02T09:00:00Z", planned_block_hours: 1.000 }
              as: MainlineScheduler
              captures: { l1: $.data.id }
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM6802", origin: "ORD", destination: "MKE", scheduled_departure_utc: "2026-09-02T11:00:00Z", scheduled_arrival_utc: "2026-09-02T12:00:00Z", planned_block_hours: 1.000 }
              as: MainlineScheduler
              captures: { l2: $.data.id }
            - call: "POST /cpa/flight-legs/${l1}/complete"
              payload: { actual_block_hours: 1.000, actual_arrival_utc: "2026-09-02T09:05:00Z", enplaned_bags: 300, mishandled_bags: 1 }
              as: RegionalOpsController
            - call: "POST /cpa/flight-legs/${l2}/complete"
              payload: { actual_block_hours: 1.000, actual_arrival_utc: "2026-09-02T12:05:00Z", enplaned_bags: 200, mishandled_bags: 2 }
              as: RegionalOpsController
          trigger:
            - call: "POST /cpa/schedule-cycles/${cyc}/close"
