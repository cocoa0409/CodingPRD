            - call: "POST /supply-centers/${center_id}/stores/${store_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { po_id: $.data.id }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 10 }
              as: StoreManager
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/submit"
