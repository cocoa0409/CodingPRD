  - rule_id: compensating_invariant
    instances:
      - name: seller_payout_ledger_conserved_under_reversal
        grounds:
          - calculations.seller_payout_ledger_invariant
          - state_machines.Payout.SCHEDULED_to_REVERSED
          - entities.Seller.fields.pending_payout_cents
          - entities.Seller.fields.reversed_payout_cents
        distinguishing_aspect: "After deliver(+144000 pending) then a buyer-favor authenticity return, the payout moves to REVERSED: pending 144000->0 and reversed 0->144000, so Q_payout = pending+released+reversed stays 144000 (conserved quantity: seller payout ledger)."
        test_recipe:
          setup:
            - "HANDBAGS direct-buy at 180000 (net 144000), delivered at default clock (pending 144000, payout SCHEDULED), AUTHENTICITY dispute FILED (payout HELD)."
          setup_api_calls:
            - { call: "POST /consignment/category-policies", payload: { category: "HANDBAGS", base_commission_pct: 0.20, buyer_fee_pct: 0.10, buyer_fee_flat_cents: 500, return_window_days: 14, min_offer_pct: 0.70, listable_min_condition_grade: "C", pickup_insurance_cap_cents: 5000000 }, as: OpsAdmin }
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
            - { call: "POST /consignment/buyers", payload: { display_name: "B1", email: "b1@x.com" }, as: OpsAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "YSL", title: "Kate", declared_value_cents: 180000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_id: "$.data.id" } }
            - { call: "POST /consignment/items/${item_id}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "A" }, as: Authenticator }
            - { call: "POST /consignment/listings", payload: { item_id: "${item_id}", list_price_cents: 180000 }, as: Seller, as_user_id: "${seller_id}", captures: { listing_id: "$.data.id" } }
            - { call: "POST /consignment/listings/${listing_id}/publish", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/sales", payload: { listing_id: "${listing_id}", buyer_id: "${buyer_id}" }, as: Buyer, as_user_id: "${buyer_id}", captures: { sale_id: "$.data.id" } }
            - { call: "POST /consignment/sales/${sale_id}/capture-payment", payload: {}, as: Buyer, as_user_id: "${buyer_id}" }
            - { call: "POST /consignment/sales/${sale_id}/ship", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/sales/${sale_id}/confirm-delivery", payload: {}, as: Buyer, as_user_id: "${buyer_id}" }
            - { call: "POST /consignment/disputes", payload: { sale_id: "${sale_id}", type: "AUTHENTICITY", reason: "not authentic" }, as: Buyer, as_user_id: "${buyer_id}", captures: { dispute_id: "$.data.id" } }
          trigger:
            - { call: "POST /consignment/disputes/${dispute_id}/resolve", payload: { outcome: "BUYER" }, as: OpsAdmin }
            - { call: "GET /consignment/sales/${sale_id}/payouts", payload: {}, as: OpsAdmin, captures: { payout_id: "$.data[0].id" } }
          assert:
            - "Seller.${seller_id}.pending_payout_cents == 0"
            - "Seller.${seller_id}.released_payout_cents == 0"
            - "Seller.${seller_id}.reversed_payout_cents == 144000"
            - "Payout.${payout_id}.status == REVERSED"

      - name: buyer_purchase_ledger_conserved_under_return
        grounds:
          - calculations.buyer_purchase_ledger_invariant
          - state_machines.Sale.DELIVERED_to_RETURNED
          - entities.Buyer.fields.lifetime_purchases_cents
        distinguishing_aspect: "Two delivered sales add order_total 214380 each (buyer lifetime 428760); a CHANGE_OF_MIND return on one subtracts exactly its 214380, leaving 214380 — the return removes precisely one order_total, conserving the buyer purchase ledger (a different conserved quantity than the payout ledger)."
        test_recipe:
          setup:
            - "One buyer with two HANDBAGS direct-buy sales at list 180000, both delivered (lifetime_purchases 428760); a CHANGE_OF_MIND dispute FILED on sale_1."
          setup_api_calls:
            - { call: "POST /consignment/category-policies", payload: { category: "HANDBAGS", base_commission_pct: 0.20, buyer_fee_pct: 0.10, buyer_fee_flat_cents: 500, return_window_days: 14, min_offer_pct: 0.70, listable_min_condition_grade: "C", pickup_insurance_cap_cents: 5000000 }, as: OpsAdmin }
            - { call: "POST /consignment/sellers", payload: { display_name: "S1", email: "s1@x.com" }, as: OpsAdmin, captures: { seller_id: "$.data.id" } }
            - { call: "POST /consignment/buyers", payload: { display_name: "B1", email: "b1@x.com" }, as: OpsAdmin, captures: { buyer_id: "$.data.id" } }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "Mulberry", title: "Bayswater 1", declared_value_cents: 180000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_1: "$.data.id" } }
            - { call: "POST /consignment/items/${item_1}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "A" }, as: Authenticator }
            - { call: "POST /consignment/listings", payload: { item_id: "${item_1}", list_price_cents: 180000 }, as: Seller, as_user_id: "${seller_id}", captures: { listing_1: "$.data.id" } }
            - { call: "POST /consignment/listings/${listing_1}/publish", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/sales", payload: { listing_id: "${listing_1}", buyer_id: "${buyer_id}" }, as: Buyer, as_user_id: "${buyer_id}", captures: { sale_1: "$.data.id" } }
            - { call: "POST /consignment/sales/${sale_1}/capture-payment", payload: {}, as: Buyer, as_user_id: "${buyer_id}" }
            - { call: "POST /consignment/sales/${sale_1}/ship", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/sales/${sale_1}/confirm-delivery", payload: {}, as: Buyer, as_user_id: "${buyer_id}" }
            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "Mulberry", title: "Bayswater 2", declared_value_cents: 180000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_2: "$.data.id" } }
            - { call: "POST /consignment/items/${item_2}/authenticate", payload: { verdict: "AUTHENTIC", condition_grade: "A" }, as: Authenticator }
            - { call: "POST /consignment/listings", payload: { item_id: "${item_2}", list_price_cents: 180000 }, as: Seller, as_user_id: "${seller_id}", captures: { listing_2: "$.data.id" } }
            - { call: "POST /consignment/listings/${listing_2}/publish", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/sales", payload: { listing_id: "${listing_2}", buyer_id: "${buyer_id}" }, as: Buyer, as_user_id: "${buyer_id}", captures: { sale_2: "$.data.id" } }
            - { call: "POST /consignment/sales/${sale_2}/capture-payment", payload: {}, as: Buyer, as_user_id: "${buyer_id}" }
            - { call: "POST /consignment/sales/${sale_2}/ship", payload: {}, as: Seller, as_user_id: "${seller_id}" }
            - { call: "POST /consignment/sales/${sale_2}/confirm-delivery", payload: {}, as: Buyer, as_user_id: "${buyer_id}" }
            - { call: "POST /consignment/disputes", payload: { sale_id: "${sale_1}", type: "CHANGE_OF_MIND", reason: "returning one" }, as: Buyer, as_user_id: "${buyer_id}", captures: { dispute_1: "$.data.id" } }
          trigger:
            - { call: "POST /consignment/disputes/${dispute_1}/resolve", payload: { outcome: "BUYER" }, as: OpsAdmin }
          assert:
            - "Buyer.${buyer_id}.lifetime_purchases_cents == 214380"
            - "Sale.${sale_1}.fulfillment_status == RETURNED"
            - "Sale.${sale_2}.fulfillment_status == DELIVERED"
