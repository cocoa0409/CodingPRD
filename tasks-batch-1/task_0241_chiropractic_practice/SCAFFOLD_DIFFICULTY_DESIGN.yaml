  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: no_show_dismissal_cascade_releases_caps_depth3
        grounds:
          - state_machines.Appointment.BOOKED_to_NO_SHOW
          - state_machines.Patient.ACTIVE_to_DISMISSED
          - entities.Patient.fields.no_show_strike_count
          - entities.InsurancePolicy.fields.visits_reserved
        distinguishing_aspect: |
          DEPTH 3 from the NO_SHOW trigger: a no-show records the 5th strike on the Patient (link 1: appointment->patient),
          which crosses DISMISSAL_STRIKE_THRESHOLD and flips Patient.status->DISMISSED (link 2: patient self-mutates),
          which itself cascade-cancels every remaining BOOKED appointment (link 3: patient->appointments), and each of
          those cancellations releases its reserved insurance cap slot (link 4: appointment->policy). Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "INSURANCE patient with ACTIVE policy (cap 20) carrying 4 prior strikes (4 no-shows already recorded)."
            - "Two future BOOKED ADJUSTMENT appointments reserving 2 cap slots (visits_reserved == 2 before the 5th no-show)."
            - "Plus the appointment that will be no-showed as strike #5."
          setup_api_calls:
            - call: "POST /fee-schedules"
              payload: { visit_type: "ADJUSTMENT", cash_rate_cents: 6000, billed_amount_cents: 9000 }
              as: PracticeAdmin
