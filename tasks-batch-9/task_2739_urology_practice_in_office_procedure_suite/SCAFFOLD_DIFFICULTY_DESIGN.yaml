              as: PracticeAdmin
              captures: { room_id: $.data.id, room_v1: $.data.version }
            - call: "POST /urology/procedure-types"
              payload: { code: "CYSTOSCOPY", base_minutes: 20, cleanup_class: "HIGH", allowed_room_type: "CYSTO_SUITE", requires_scope: false, requires_antibiotic: false, required_prep_codes: [] }
              as: PracticeAdmin
