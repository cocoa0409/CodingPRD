# =============================================================================
# PRD Benchmark Seed Tables — §1.0–§1.7
# Task 2691 — Grid-Scale Battery Storage Operations & Market Bidding
# Difficulty band: Expert+ (beyond §0.4 Expert: 9 entities / 46 endpoints /
# 30 errors / 6 calculations with 4 dual-variant or pinned-order modes /
# 8 state machines with parallel, cyclic, branching and compound shapes)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2691. Grid-Scale Battery Storage Operations & Market Bidding (energy storage operator): state-of-charge management across energy arbitrage, ancillary service and capacity obligations, market bid construction with day-ahead and real-time offers reflecting degradation cost and cycle limits, dispatch execution with telemetry, response accuracy and performance scoring in ancillary markets, warranty and augmentation planning with throughput limits and capacity maintenance obligations, safety systems monitoring with thermal runaway detection, fire suppression and emergency response coordination, availability commitments under capacity programs with penalty exposure, degradation modeling with periodic capacity testing and warranty claim triggers, interconnection compliance and reactive power support obligations

domain_name: grid-scale-battery-storage-operations
# Flat topology: every entity owns a top-level sibling collection
# (/storage-assets, /soc-reservations, /market-bids, /dispatch-instructions,
#  /telemetry-samples, /safety-events, /capacity-obligations, /capacity-tests,
#  /warranty-claims). There is no nesting-by-ownership in URL paths; children
# are found through filtered-list GETs keyed on their foreign keys.
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation           # finite state-of-charge pool reserved / committed / released / preempted
  secondary_archetype: pricing_engine           # bid-curve construction from degradation, cycle-scarcity and warranty adders
  complexity_layers:
    - optimistic_concurrency                    # OCC on StorageAsset.version for reservation create-with-supersede
    - cascading_side_effects                    # safety alarm -> market suspension -> bid withdrawal -> reservation release -> dispatch failure
    - dual_variant_calculation                  # provisional vs settled performance score; preliminary vs final capacity assessment
    - rate_threshold_triggers                   # cycle-scarcity tiers, thermal thresholds, availability tiers, SOH claim trigger

  entity_topology: flat
  # flat: peer entities linked by foreign keys; no nesting in URL paths.

  state_machine_shape: parallel
  # StorageAsset carries two independent axes (safety_state x market_state);
  # DispatchInstruction carries two independent axes (execution_status x
  # scoring_status); MarketBid is cyclic (SUBMITTED -> UNCLEARED -> DRAFT ->
  # SUBMITTED); SafetyEvent and WarrantyClaim branch with divergent side-effect
  # sets; StorageAsset.safety_state is compound (derived from the set of its
  # non-closed SafetyEvent children).

  relationship_patterns:
    - one_to_many                               # StorageAsset -> bids / reservations / dispatches / events / tests / claims / obligations
    - self_referential                          # CapacityTest.baseline_test_id -> CapacityTest.id
    - cross_aggregate                           # DispatchInstruction reads MarketBid + SocReservation + StorageAsset
    - polymorphic                               # SocReservation.purpose selects which obligation domain owns the reserved energy

  role_model: segregation_of_duties
  # A SafetyEvent may not be closed by the operator who opened it; a WarrantyClaim
  # may not be submitted by the AssetManager who created it. Trading, control-room
  # execution, safety clearance and asset stewardship are disjoint role surfaces.

  consistency_model: immediate
  # Every cascade, ledger debit/credit and derived-field recompute completes
  # inside the triggering request; a compensating action must restore the named
  # conserved quantity to its exact pre-action value in the same request.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: StorageAsset
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: "Operator-facing plant name"
        constraints: "1-120 chars, non-blank"
      - name: nameplate_energy_mwh
        type: number
        source: input
        description: "Beginning-of-life usable energy of the installed racks in MWh"
        constraints: "> 0"
      - name: power_rating_mw
        type: number
        source: input
        description: "Continuous inverter power rating in MW"
        constraints: "> 0"
      - name: poi_mw_limit
        type: number
        source: input
        description: "Interconnection point active-power limit in MW"
        constraints: "> 0"
      - name: poi_mva_limit
        type: number
        source: input
        description: "Interconnection point apparent-power limit in MVA"
        constraints: ">= poi_mw_limit"
      - name: reactive_capability_mvar
        type: number
        source: input
        description: "Reactive power support capability in MVAr owed to the interconnection agreement"
        constraints: ">= 0"
      - name: round_trip_efficiency_pct
        type: number
        source: input
        default: 88.0
        description: "AC round-trip efficiency percent, used to gross up charge energy cost and to derate charge energy booked into SOC"
        constraints: "50.0 <= value <= 100.0"
      - name: soc_floor_pct
        type: number
        source: input
        default: 10.0
        description: "Minimum reserve percent of nameplate_energy_mwh that may never be reserved or dispatched"
        constraints: "0.0 <= value < soc_ceiling_pct"
      - name: soc_ceiling_pct
        type: number
        source: input
        default: 95.0
        description: "Maximum usable percent of available_energy_mwh"
        constraints: "soc_floor_pct < value <= 100.0"
      - name: initial_soc_mwh
        type: number
        source: input
        description: "Stored energy in MWh at registration; seeds soc_mwh"
        constraints: ">= 0 and <= nameplate_energy_mwh"
      - name: initial_cumulative_throughput_mwh
        type: number
        source: input
        default: 0.0
        description: "Historical lifetime throughput in MWh carried over at registration; seeds cumulative_throughput_mwh"
        constraints: ">= 0 and < warranty_throughput_limit_mwh"
      - name: degradation_cost_usd_per_mwh
        type: number
        source: input
        description: "Marginal degradation cost per MWh of throughput used as the bid-floor degradation term"
        constraints: ">= 0"
      - name: warranty_throughput_limit_mwh
        type: number
        source: input
        description: "Lifetime energy throughput ceiling in MWh under the OEM warranty"
        constraints: "> 0"
      - name: warranty_guaranteed_soh_pct
        type: number
        source: input
        default: 80.0
        description: "Warranty floor for expected state-of-health percent"
        constraints: "0 < value <= 100"
      - name: warranty_annual_fade_pct
        type: number
        source: input
        default: 2.5
        description: "Calendar fade percentage points per year in the degradation model"
        constraints: ">= 0"
      - name: commercial_operation_date
        type: datetime
        source: input
        description: "ISO 8601 UTC commercial-operation date, the origin of the calendar-fade curve"
      - name: cycle_limit_per_year
        type: integer
        source: input
        description: "Contractual equivalent-full-cycle ceiling per program year"
        constraints: "> 0"
      - name: soc_mwh
        type: number
        source: computed
        description: "Current stored energy in MWh; initialized to initial_soc_mwh, then debited or credited only by DispatchInstruction completion and its compensation"
        constraints: "3 decimal places"
      - name: cumulative_throughput_mwh
        type: number
        source: computed
        description: "Lifetime throughput ledger in MWh; initialized to initial_cumulative_throughput_mwh, credited by dispatch completion and capacity-test completion, debited by dispatch compensation"
        constraints: "3 decimal places, conserved quantity of compensating_invariant"
      - name: equivalent_full_cycles_ytd
        type: number
        source: computed
        description: "round(cumulative_throughput_mwh / (2 * available_energy_mwh), 4), recomputed after every change to either input"
      - name: reserved_mwh_total
        type: number
        source: computed
        description: "Sum of reserved_mwh over SocReservation rows of this asset whose status == HELD, regardless of window; conserved quantity of compensating_invariant"
        constraints: "3 decimal places"
      - name: free_dispatchable_mwh
        type: number
        source: computed
        description: "round(min(soc_mwh, available_energy_mwh * soc_ceiling_pct / 100) - nameplate_energy_mwh * soc_floor_pct / 100 - reserved_mwh_total, 3), floored at 0"
      - name: soh_pct
        type: number
        source: computed
        default: 100.0
        description: "measured_soh_pct of the most recent CapacityTest of this asset with status == COMPLETED ordered by scheduled_date DESC then created_at DESC; 100.0 when no such test exists"
      - name: rated_energy_mwh
        type: number
        source: computed
        description: "round(nameplate_energy_mwh + sum of remedy_energy_add_mwh over WarrantyClaim rows of this asset with status == REMEDIED, 3)"
      - name: available_energy_mwh
        type: number
        source: computed
        description: "round(rated_energy_mwh * soh_pct / 100, 3); the usable energy envelope every reservation, bid and obligation check is measured against"
      - name: safety_state
        type: enum
        source: computed
        default: NORMAL
        description: "Compound safety posture derived from the asset's SafetyEvent rows whose status is OPEN or SUPPRESSION_ACTIVE, taking the most severe imposed_safety_state among them"
        constraints: "NORMAL | ELEVATED | ALARM | LOCKOUT"
      - name: market_state
        type: enum
        source: computed
        default: OFFLINE
        description: "Market participation axis, independent of safety_state; OFFLINE until commissioned, SUSPENDED while safety_state is ALARM or LOCKOUT"
        constraints: "OFFLINE | AVAILABLE | SUSPENDED"
      - name: suspension_reason
        type: enum
        source: computed
        default: null
        description: "Why market_state is SUSPENDED; null whenever market_state != SUSPENDED"
        constraints: "SAFETY_ALARM | SAFETY_LOCKOUT | null"
      - name: suspended_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant at which market_state entered SUSPENDED; null when market_state != SUSPENDED"

  - name: SocReservation
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> StorageAsset.id; the asset whose state-of-charge pool this reservation draws from"
      - name: purpose
        type: enum
        source: input
        description: "Obligation domain that owns the reserved energy; also fixes priority_rank"
        constraints: "ENERGY_ARBITRAGE | ANCILLARY | CAPACITY"
      - name: reserved_mwh
        type: number
        source: input
        description: "Energy in MWh withheld from free_dispatchable_mwh for the whole window"
        constraints: "> 0, 3 decimal places"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the half-open occupation interval [window_start, window_end)"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the half-open occupation interval [window_start, window_end)"
        constraints: "> window_start"
      - name: expected_asset_version
        type: integer
        source: input
        description: "OCC guard; must equal StorageAsset.version at the instant of the request"
      - name: priority_rank
        type: integer
        source: computed
        description: "1 when purpose == CAPACITY, 2 when purpose == ANCILLARY, 3 when purpose == ENERGY_ARBITRAGE; lower rank preempts higher rank"
      - name: status
        type: enum
        source: computed
        default: HELD
        description: "HELD on create; CONSUMED by dispatch completion; RELEASED by explicit release, bid withdrawal cascade, CAPACITY preemption or dispatch compensation; EXPIRED by the create-time expiry sweep"
        constraints: "HELD | CONSUMED | RELEASED | EXPIRED"
      - name: consumed_mwh
        type: number
        source: computed
        default: 0.0
        description: "Energy in MWh actually drawn against this reservation by dispatch completion; reset to 0.0 by dispatch compensation"
      - name: released_reason
        type: enum
        source: computed
        default: null
        description: "Why the reservation left HELD other than consumption; null while status is HELD or CONSUMED"
        constraints: "OPERATOR_RELEASE | BID_WITHDRAWN | CAPACITY_PREEMPTION | DISPATCH_COMPENSATION | WINDOW_EXPIRED | null"

  - name: MarketBid
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> StorageAsset.id; the offering asset"
      - name: reservation_id
        type: string
        source: input
        description: "FK -> SocReservation.id; the HELD reservation that backs this offer, must belong to asset_id and cover the delivery interval"
      - name: market_type
        type: enum
        source: input
        description: "Market the offer is placed into"
        constraints: "DAY_AHEAD | REAL_TIME"
      - name: product
        type: enum
        source: input
        description: "Product the offer is placed for; fixes product_factor in the bid-floor formula"
        constraints: "ENERGY | REG_UP | REG_DOWN | SPIN"
      - name: direction
        type: enum
        source: input
        description: "Whether the offer discharges to or charges from the grid"
        constraints: "DISCHARGE | CHARGE"
      - name: delivery_start
        type: datetime
        source: input
        description: "Inclusive start of the closed delivery interval [delivery_start, delivery_end]"
      - name: delivery_end
        type: datetime
        source: input
        description: "Inclusive end of the closed delivery interval [delivery_start, delivery_end]"
        constraints: "> delivery_start, whole quarter-hours"
      - name: offer_mw
        type: number
        source: input
        description: "Offered power in MW"
        constraints: "> 0, <= min(StorageAsset.power_rating_mw, StorageAsset.poi_mw_limit)"
      - name: price_adder_usd_per_mwh
        type: number
        source: input
        default: 0.0
        description: "Trader margin added on top of the computed bid floor"
        constraints: ">= 0"
      - name: offer_price_usd_per_mwh
        type: number
        source: computed
        description: "Output of calculations.bid_floor_price; recomputed on revise and on every change to StorageAsset.available_energy_mwh, equivalent_full_cycles_ytd or cumulative_throughput_mwh while status is DRAFT"
        constraints: "2 decimal places"
      - name: expected_energy_mwh
        type: number
        source: computed
        description: "round(offer_mw * delivery duration in hours, 3)"
      - name: cycle_debit_efc
        type: number
        source: computed
        description: "round(expected_energy_mwh / (2 * StorageAsset.available_energy_mwh), 4); the equivalent-full-cycle draw this offer books against cycle_limit_per_year"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "DRAFT on create, SUBMITTED on submit, CLEARED or UNCLEARED on clearing-result, back to DRAFT on revise, WITHDRAWN on withdraw or suspension cascade"
        constraints: "DRAFT | SUBMITTED | CLEARED | UNCLEARED | WITHDRAWN"
      - name: revision_count
        type: integer
        source: computed
        default: 0
        description: "Incremented by one on every UNCLEARED -> DRAFT revise transition"
      - name: cleared_price_usd_per_mwh
        type: number
        source: computed
        default: null
        description: "Market clearing price recorded on the CLEARED branch of clearing-result; null otherwise"
      - name: cleared_mw
        type: number
        source: computed
        default: null
        description: "Cleared quantity in MW recorded on the CLEARED branch of clearing-result; null otherwise"
        constraints: "on the CLEARED branch the supplied cleared_mw must satisfy > 0 and <= offer_mw; a larger award is a malformed body rejected by validation priority 3 with ERR_INVALID_REQUEST, whereas a price below the floor is the separate priority 29 business rejection"
      - name: withdrawn_reason
        type: enum
        source: computed
        default: null
        description: "Why the offer was withdrawn; null while status != WITHDRAWN"
        constraints: "TRADER_WITHDRAWAL | ASSET_SUSPENDED | null"
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the MarketTrader that last submitted this offer; audit only, never an ownership gate"

  - name: DispatchInstruction
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: bid_id
        type: string
        source: input
        description: "FK -> MarketBid.id; the CLEARED offer this instruction executes"
      - name: asset_id
        type: string
        source: input
        description: "FK -> StorageAsset.id; must equal the referenced bid's asset_id"
      - name: instructed_mw
        type: number
        source: input
        description: "Instructed setpoint in MW"
        constraints: "> 0, <= MarketBid.cleared_mw"
      - name: setpoint_start
        type: datetime
        source: input
        description: "Inclusive start of the setpoint interval, must fall inside the bid's closed delivery interval"
      - name: setpoint_end
        type: datetime
        source: input
        description: "Inclusive end of the setpoint interval, must fall inside the bid's closed delivery interval; also the on-time cutoff for telemetry"
        constraints: "> setpoint_start"
      - name: direction
        type: enum
        source: computed
        description: "Copied from the referenced MarketBid.direction at creation"
        constraints: "DISCHARGE | CHARGE"
      - name: expected_energy_mwh
        type: number
        source: computed
        description: "instructed_mw * (setpoint_end - setpoint_start) in hours; the energy this instruction charges against its bid's SocReservation"
        constraints: "3 decimal places, round_half_up"
      - name: execution_status
        type: enum
        source: computed
        default: PENDING
        description: "Execution axis, independent of scoring_status"
        constraints: "PENDING | ACCEPTED | EXECUTING | COMPLETED | FAILED"
      - name: scoring_status
        type: enum
        source: computed
        default: NOT_SCORED
        description: "Scoring axis, independent of execution_status; PROVISIONAL on completion, SETTLED on settle-score, back to NOT_SCORED on compensation"
        constraints: "NOT_SCORED | PROVISIONAL | SETTLED"
      - name: delivered_mwh
        type: number
        source: computed
        default: 0.0
        description: "round(sum over on-time TelemetrySample rows of measured_mw * SAMPLE_INTERVAL_HOURS, 3); reset to 0.0 by compensation"
      - name: soc_delta_mwh
        type: number
        source: computed
        default: 0.0
        description: "Signed MWh applied to StorageAsset.soc_mwh at completion; compensation subtracts exactly this stored value so no drift is possible"
      - name: telemetry_sample_count
        type: integer
        source: computed
        default: 0
        description: "Count of TelemetrySample rows attached to this instruction, including late-arriving ones"
      - name: accuracy_score
        type: number
        source: computed
        default: null
        description: "Output of calculations.dispatch_performance_score accuracy term for the currently applied variant; null while scoring_status == NOT_SCORED"
      - name: deadband_pct
        type: number
        source: computed
        default: null
        description: "Percent of scored samples inside the response deadband for the currently applied variant; null while scoring_status == NOT_SCORED"
      - name: composite_score
        type: number
        source: computed
        default: null
        description: "Weighted composite of accuracy_score and deadband_pct; null while scoring_status == NOT_SCORED"
      - name: non_performance_charge_usd
        type: number
        source: computed
        default: 0.0
        description: "Ancillary non-performance charge, assessed only on the SETTLED variant"
      - name: failure_reason
        type: enum
        source: computed
        default: null
        description: "Why the instruction reached FAILED; null while execution_status != FAILED"
        constraints: "OPERATOR_FAILURE | ASSET_SUSPENDED | DELIVERY_VOIDED | null"
      - name: accepted_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the ControlRoomOperator that accepted the instruction; audit only"

  - name: TelemetrySample
    parent: null
    common_fields: false
    kind: event
    fields:
      - name: dispatch_id
        type: string
        source: input
        description: "FK -> DispatchInstruction.id; the instruction this sample reports against"
      - name: sample_index
        type: integer
        source: input
        description: "1-based monotonic index within the instruction; must be strictly greater than the current maximum for that instruction"
        constraints: ">= 1"
      - name: sampled_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant of the measurement; a sample with sampled_at > DispatchInstruction.setpoint_end is late-arriving"
      - name: measured_mw
        type: number
        source: input
        description: "Measured active power in MW at the point of interconnection"
        constraints: ">= 0"
      - name: measured_mvar
        type: number
        source: input
        description: "Measured reactive power in MVAr at the point of interconnection"
        constraints: "signed — a negative value (absorbing reactive power) is a well-formed request; the magnitude bound abs(measured_mvar) <= asset.reactive_capability_mvar is enforced by validation priority 17, not by the priority 3 body check"
      - name: soc_mwh_reading
        type: number
        source: input
        description: "Site-controller state-of-charge reading in MWh; recorded for reconciliation, never authoritative over StorageAsset.soc_mwh"
      - name: max_cell_temp_c
        type: number
        source: input
        description: "Hottest cell temperature in degrees Celsius reported by the battery management system"
      - name: apparent_mva
        type: number
        source: computed
        description: "round(sqrt(measured_mw^2 + measured_mvar^2), 3); checked against StorageAsset.poi_mva_limit"
      - name: deviation_mw
        type: number
        source: computed
        description: "round(abs(measured_mw - DispatchInstruction.instructed_mw), 3)"
      - name: error_ratio
        type: number
        source: computed
        description: "round(deviation_mw / DispatchInstruction.instructed_mw, 4); the per-sample term the performance score averages"
      - name: within_deadband
        type: boolean
        source: computed
        description: "true when error_ratio <= DEADBAND_RATIO, inclusive at the boundary"
      - name: thermal_escalation
        type: enum
        source: computed
        description: "Thermal band this sample fell into; NONE below THERMAL_WARNING_TEMP_C, WARNING at or above it, RUNAWAY at or above THERMAL_RUNAWAY_TEMP_C"
        constraints: "NONE | WARNING | RUNAWAY"

  - name: SafetyEvent
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> StorageAsset.id; the asset the event was detected on"
      - name: source_dispatch_id
        type: string
        source: computed
        default: null
        description: "FK -> DispatchInstruction.id; set only on events auto-created by a telemetry thermal crossing, null on manually reported events"
      - name: source_sample_index
        type: integer
        source: computed
        default: null
        description: "sample_index of the TelemetrySample that auto-created this event; null on manually reported events"
      - name: event_type
        type: enum
        source: input
        description: "Detected hazard class; THERMAL_RUNAWAY always imposes LOCKOUT regardless of severity"
        constraints: "THERMAL_ANOMALY | THERMAL_RUNAWAY | OFFGAS_DETECTED | SMOKE_DETECTED"
      - name: severity
        type: enum
        source: input
        description: "Reported severity; maps to imposed_safety_state for every event_type other than THERMAL_RUNAWAY"
        constraints: "ADVISORY | WARNING | CRITICAL"
      - name: detected_max_cell_temp_c
        type: number
        source: input
        description: "Hottest cell temperature in degrees Celsius at detection"
      - name: source
        type: enum
        source: computed
        default: MANUAL
        description: "MANUAL for SafetyOfficer-reported events, TELEMETRY_AUTO for events created by the telemetry thermal threshold cascade"
        constraints: "MANUAL | TELEMETRY_AUTO"
      - name: imposed_safety_state
        type: enum
        source: computed
        description: "Safety posture this event alone imposes on the asset; LOCKOUT when event_type == THERMAL_RUNAWAY, else ALARM for CRITICAL, ELEVATED for WARNING, NONE for ADVISORY"
        constraints: "NONE | ELEVATED | ALARM | LOCKOUT"
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: "OPEN on create, SUPPRESSION_ACTIVE once fire suppression is discharged, CLOSED once cleared by a second officer"
        constraints: "OPEN | SUPPRESSION_ACTIVE | CLOSED"
      - name: suppression_discharged
        type: boolean
        source: computed
        default: false
        description: "true once discharge-suppression has run; mandatory before closing any event whose imposed_safety_state == LOCKOUT"
      - name: suppression_agent_kg
        type: number
        source: computed
        default: null
        description: "Mass of suppression agent discharged in kg, recorded by discharge-suppression; null before discharge"
      - name: emergency_response_ack_at
        type: datetime
        source: input
        default: null
        description: "ISO 8601 UTC instant the fire department acknowledged the incident; supplied on close, mandatory when imposed_safety_state == LOCKOUT"
      - name: emergency_ack_agencies
        type: array
        source: input
        default: []
        description: "Names of the coordinating emergency agencies (fire, utility control centre, county EMA); supplied on close and must be non-empty when severity == CRITICAL"
        constraints: "array of 1-120 char strings; each entry non-blank"
      - name: responder_cleared
        type: boolean
        source: input
        default: false
        description: "true once the incident commander has released the site back to the operator; must be true to close a CRITICAL event"
      - name: opened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the SafetyOfficer that reported the event, or the string SYSTEM for TELEMETRY_AUTO events"
      - name: closed_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the SafetyOfficer that closed the event; must differ from opened_by_user_id"

  - name: CapacityObligation
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> StorageAsset.id; the asset carrying the capacity commitment"
      - name: program_name
        type: string
        source: input
        description: "Capacity program the asset is enrolled in, e.g. \"ISO Capacity Auction\" or \"Resource Adequacy\""
        constraints: "1-120 chars, non-blank"
      - name: program_year
        type: integer
        source: input
        description: "Capacity program year; unique per (asset_id, program_name, program_year)"
        constraints: "2000 <= value <= 2100"
      - name: committed_mw
        type: number
        source: input
        description: "Unforced capacity committed in MW"
        constraints: "> 0, <= StorageAsset.power_rating_mw"
      - name: obligation_duration_hours
        type: number
        source: input
        default: 4.0
        description: "Hours of continuous discharge at committed_mw the program requires the asset to be able to sustain"
        constraints: "> 0"
      - name: availability_hours_required
        type: number
        source: input
        description: "Annual availability hours the program requires over an 8760-hour year"
        constraints: "> 0, <= 8760"
      - name: penalty_rate_usd_per_mw_hour
        type: number
        source: input
        description: "Program penalty rate in USD per committed MW per shortfall hour"
        constraints: ">= 0"
      - name: unavailable_hours
        type: number
        source: computed
        default: 0.0
        description: "Accrued hours in which market_state was SUSPENDED during this program year; incremented when the asset resumes"
        constraints: "2 decimal places"
      - name: accrual_started_at
        type: datetime
        source: computed
        default: null
        description: "Logical-clock instant the currently open unavailability accrual began; null when no accrual is open"
      - name: measured_available_hours
        type: number
        source: computed
        default: 0.0
        description: "period_hours - unavailable_hours for the variant applied by the last assessment"
      - name: availability_pct
        type: number
        source: computed
        default: null
        description: "round(measured_available_hours / period_hours * 100, 2) for the variant applied by the last assessment"
      - name: shortfall_hours
        type: number
        source: computed
        default: 0.0
        description: "round(max(0, required_hours_scaled - measured_available_hours), 2) for the variant applied by the last assessment"
      - name: penalty_exposure_usd
        type: number
        source: computed
        default: 0.0
        description: "Output of calculations.capacity_obligation_assessment penalty term for the variant applied by the last assessment"
      - name: assessment_mode
        type: enum
        source: computed
        default: null
        description: "Variant applied by the most recent assessment; null before the first assessment"
        constraints: "PRELIMINARY | FINAL | null"
      - name: derated_committed_mw
        type: number
        source: computed
        default: null
        description: "round(StorageAsset.available_energy_mwh / obligation_duration_hours, 3) recorded whenever the asset can no longer sustain committed_mw; null while the asset can"
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: "ACTIVE while no shortfall is measured, SHORTFALL on a positive shortfall with availability_pct >= AVAILABILITY_TIER1_PCT or on a capacity derate, PENALIZED on a positive shortfall below that tier, FULFILLED after a FINAL assessment with zero shortfall"
        constraints: "ACTIVE | SHORTFALL | PENALIZED | FULFILLED"

  - name: CapacityTest
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> StorageAsset.id; the asset under test"
      - name: baseline_test_id
        type: string
        source: input
        default: null
        description: "FK -> CapacityTest.id; the earlier COMPLETED test this one is measured against, null for the first test of an asset"
      - name: scheduled_date
        type: datetime
        source: input
        description: "ISO 8601 UTC date the test discharge is scheduled for; the calendar-fade evaluation point"
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: "SCHEDULED on create, IN_PROGRESS on start, COMPLETED on complete"
        constraints: "SCHEDULED | IN_PROGRESS | COMPLETED"
      - name: measured_capacity_mwh
        type: number
        source: input
        default: null
        description: "Discharged energy in MWh measured by the test, supplied at completion"
        constraints: "> 0"
      - name: measured_soh_pct
        type: number
        source: computed
        default: null
        description: "round(measured_capacity_mwh / StorageAsset.rated_energy_mwh * 100, 2), evaluated at step 3 of the pinned order"
      - name: expected_soh_pct
        type: number
        source: computed
        default: null
        description: "Warranty degradation-model expectation at scheduled_date, evaluated at step 2 of the pinned order using cumulative_throughput_mwh as of the start of the completion transition"
      - name: soh_deficit_pct
        type: number
        source: computed
        default: null
        description: "round(max(0, expected_soh_pct - measured_soh_pct), 2), evaluated at step 4 of the pinned order"
      - name: warranty_claim_triggered
        type: boolean
        source: computed
        default: false
        description: "true when soh_deficit_pct >= CLAIM_TRIGGER_DEFICIT_PCT, inclusive at the boundary"
      - name: test_energy_throughput_mwh
        type: number
        source: computed
        default: 0.0
        description: "Throughput in MWh the test discharge itself books into StorageAsset.cumulative_throughput_mwh, equal to measured_capacity_mwh, credited after expected_soh_pct is evaluated"

  - name: WarrantyClaim
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> StorageAsset.id; the asset the claim is filed for"
      - name: capacity_test_id
        type: string
        source: input
        description: "FK -> CapacityTest.id; the COMPLETED test that evidences the claim"
      - name: claim_type
        type: enum
        source: input
        description: "CAPACITY_SHORTFALL for a state-of-health deficit, THROUGHPUT_BREACH when the OEM disputes throughput usage"
        constraints: "CAPACITY_SHORTFALL | THROUGHPUT_BREACH"
      - name: claimed_shortfall_pct
        type: number
        source: computed
        description: "Copied from the evidencing CapacityTest.soh_deficit_pct at creation"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "DRAFT on create, SUBMITTED on submit by a second AssetManager, APPROVED or DENIED on adjudicate, REMEDIED once the augmentation is installed"
        constraints: "DRAFT | SUBMITTED | APPROVED | DENIED | REMEDIED"
      - name: remedy_energy_add_mwh
        type: number
        source: computed
        default: null
        description: "Augmentation energy in MWh granted on the APPROVED branch; enters StorageAsset.rated_energy_mwh only once status == REMEDIED"
      - name: remedy_install_date
        type: datetime
        source: input
        default: null
        description: "ISO 8601 UTC date the augmentation racks are installed, supplied on the APPROVED branch of adjudicate"
      - name: remedy_outage_days
        type: integer
        source: input
        default: null
        description: "Length in days of the augmentation outage window beginning on remedy_install_date, supplied on the APPROVED branch of adjudicate"
        constraints: ">= 1"
      - name: denial_reason
        type: enum
        source: input
        default: null
        description: "Reason recorded on the DENIED branch of adjudicate; null on every other branch"
        constraints: "NO_SHORTFALL | THROUGHPUT_EXCEEDED_WARRANTY | LATE_FILING | null"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the AssetManager that created the claim"
      - name: submitted_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the AssetManager that submitted the claim; must differ from created_by_user_id"
      - name: adjudicated_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the PlatformAdmin acting for the OEM warranty desk"

# =============================================================================
# §1.2 State Machine Table
# Ten machines over eight entities. StorageAsset and DispatchInstruction each
# carry two independent axes (declared as separate machines with a state_field);
# MarketBid is cyclic; SafetyEvent, WarrantyClaim and DispatchInstruction.fail
# branch with divergent side-effect sets; StorageAsset.safety_state is compound
# over its SafetyEvent children.
# =============================================================================
state_machines:

  - entity: StorageAsset
    state_field: market_state
    initial_state: OFFLINE
    terminal_states: []
    transitions:
      - from: OFFLINE
        to: AVAILABLE
        trigger: "POST /storage-assets/{id}/commission"
        actor: PlatformAdmin | AssetManager
        preconditions:
          - "asset.safety_state == NORMAL"
          - "no SafetyEvent of this asset has status IN {OPEN, SUPPRESSION_ACTIVE}"
        side_effects:
          - "suspension_reason := null; suspended_at := null"
        note: "Bid submission and dispatch creation require market_state == AVAILABLE."
      - from: AVAILABLE
        to: SUSPENDED
        trigger: "system — cascade link 2 of transitive_cascade safety_alarm_chain, fired when a SafetyEvent whose imposed_safety_state IN {ALARM, LOCKOUT} moves this asset's safety_state to ALARM or LOCKOUT"
        actor: system
        preconditions:
          - "asset.safety_state IN {ALARM, LOCKOUT} after the safety_state recompute of cascade link 1"
        side_effects:
          - "suspension_reason := SAFETY_ALARM when safety_state == ALARM, SAFETY_LOCKOUT when safety_state == LOCKOUT"
          - "suspended_at := clock_now"
          - "cascade link 3 — because market_state is now SUSPENDED, every MarketBid of this asset with status IN {DRAFT, SUBMITTED, CLEARED} moves to WITHDRAWN with withdrawn_reason := ASSET_SUSPENDED, processed in ascending (delivery_start, created_at) order"
          - "cascade link 4 — because those bids became WITHDRAWN, each bid's SocReservation with status == HELD moves to RELEASED with released_reason := BID_WITHDRAWN, and asset.reserved_mwh_total plus asset.free_dispatchable_mwh are recomputed"
          - "cascade link 5 — because those bids became WITHDRAWN, every DispatchInstruction of this asset with execution_status IN {PENDING, ACCEPTED, EXECUTING} moves to FAILED with failure_reason := ASSET_SUSPENDED, processed in ascending (setpoint_start, created_at) order"
          - "cascade link 6 — because market_state is now SUSPENDED, every CapacityObligation of this asset with status IN {ACTIVE, SHORTFALL, PENALIZED} and program_year == calendar year of clock_now sets accrual_started_at := clock_now"
      - from: SUSPENDED
        to: AVAILABLE
        trigger: "system — fired by POST /safety-events/{id}/close once the recomputed safety_state is no longer ALARM or LOCKOUT"
        actor: system
        preconditions:
          - "asset.safety_state NOT IN {ALARM, LOCKOUT} after the safety_state recompute of the close transition — NORMAL when the last event closed, ELEVATED when only ELEVATED-imposing events remain"
        side_effects:
          - "suspension_reason := null; suspended_at := null"
          - "for every CapacityObligation of this asset with accrual_started_at != null — unavailable_hours := round(unavailable_hours + (clock_now - accrual_started_at) in hours, 2); accrual_started_at := null"
          - "no MarketBid or SocReservation is restored; withdrawal and release are irreversible"

  - entity: StorageAsset
    state_field: safety_state
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: ELEVATED
        trigger: "POST /safety-events (severity WARNING, event_type != THERMAL_RUNAWAY) or POST /telemetry-samples crossing THERMAL_WARNING_TEMP_C"
        actor: SafetyOfficer | system
        preconditions:
          - "the most severe imposed_safety_state among this asset's SafetyEvent rows with status IN {OPEN, SUPPRESSION_ACTIVE} is ELEVATED"
        side_effects:
          - "market_state is untouched — ELEVATED does not suspend market participation"
      - from: NORMAL
        to: ALARM
        trigger: "POST /safety-events (severity CRITICAL, event_type != THERMAL_RUNAWAY)"
        actor: SafetyOfficer
        preconditions:
          - "the most severe imposed_safety_state among non-closed SafetyEvent rows of this asset is ALARM"
        side_effects:
          - "cascade link 2 fires — market_state AVAILABLE -> SUSPENDED with suspension_reason SAFETY_ALARM"
      - from: NORMAL
        to: LOCKOUT
        trigger: "POST /safety-events (event_type THERMAL_RUNAWAY, any severity) or POST /telemetry-samples crossing THERMAL_RUNAWAY_TEMP_C"
        actor: SafetyOfficer | system
        preconditions:
          - "the most severe imposed_safety_state among non-closed SafetyEvent rows of this asset is LOCKOUT"
        side_effects:
          - "cascade link 2 fires — market_state AVAILABLE -> SUSPENDED with suspension_reason SAFETY_LOCKOUT"
          - "every write endpoint other than the SafetyEvent surface is refused with ERR_ASSET_SAFETY_LOCKOUT while safety_state == LOCKOUT"
      - from: ELEVATED
        to: LOCKOUT
        trigger: "POST /safety-events (event_type THERMAL_RUNAWAY) while an ELEVATED event is still open"
        actor: SafetyOfficer
        preconditions:
          - "the most severe imposed_safety_state among non-closed SafetyEvent rows of this asset is LOCKOUT"
        side_effects:
          - "cascade link 2 fires"
      - from: ALARM
        to: LOCKOUT
        trigger: "POST /safety-events (event_type THERMAL_RUNAWAY) while an ALARM event is still open"
        actor: SafetyOfficer
        preconditions:
          - "the most severe imposed_safety_state among non-closed SafetyEvent rows of this asset is LOCKOUT"
        side_effects:
          - "suspension_reason := SAFETY_LOCKOUT; market_state stays SUSPENDED"
      - from: LOCKOUT
        to: ALARM
        trigger: "POST /safety-events/{id}/close on the THERMAL_RUNAWAY event while a CRITICAL non-runaway event is still open"
        actor: SafetyOfficer
        preconditions:
          - "the most severe imposed_safety_state among the remaining non-closed SafetyEvent rows of this asset is ALARM"
        side_effects:
          - "suspension_reason := SAFETY_ALARM; market_state stays SUSPENDED because safety_state is still ALARM"
      - from: LOCKOUT
        to: NORMAL
        trigger: "POST /safety-events/{id}/close (last non-closed event)"
        actor: SafetyOfficer
        preconditions:
          - "no SafetyEvent of this asset has status IN {OPEN, SUPPRESSION_ACTIVE} after the close"
        side_effects:
          - "market_state SUSPENDED -> AVAILABLE fires with its own side effects"
      - from: ALARM
        to: ELEVATED
        trigger: "POST /safety-events/{id}/close on the ALARM-imposing event while a WARNING event of this asset is still open"
        actor: SafetyOfficer
        preconditions:
          - "the most severe imposed_safety_state among the remaining non-closed SafetyEvent rows of this asset is ELEVATED"
        side_effects:
          - "market_state SUSPENDED -> AVAILABLE fires because safety_state left {ALARM, LOCKOUT}, and suspension_reason := null — the safety axis is still ELEVATED, so the two axes end in a combination no single event can produce"
      - from: ALARM
        to: NORMAL
        trigger: "POST /safety-events/{id}/close (last non-closed event)"
        actor: SafetyOfficer
        preconditions:
          - "no SafetyEvent of this asset has status IN {OPEN, SUPPRESSION_ACTIVE} after the close"
        side_effects:
          - "market_state SUSPENDED -> AVAILABLE fires with its own side effects"
      - from: ELEVATED
        to: NORMAL
        trigger: "POST /safety-events/{id}/close (last non-closed event)"
        actor: SafetyOfficer
        preconditions:
          - "no SafetyEvent of this asset has status IN {OPEN, SUPPRESSION_ACTIVE} after the close"
        side_effects:
          - "market_state is untouched — it was never suspended for an ELEVATED posture"

  - entity: SocReservation
    state_field: status
    initial_state: HELD
    terminal_states: [RELEASED, EXPIRED]
    transitions:
      - from: HELD
        to: CONSUMED
        trigger: "system — fired by POST /dispatch-instructions/{id}/complete on the reservation backing the executed bid"
        actor: system
        preconditions:
          - "reservation.asset_id == dispatch.asset_id"
          - "dispatch.delivered_mwh <= reservation.reserved_mwh"
        side_effects:
          - "consumed_mwh := dispatch.delivered_mwh"
          - "asset.reserved_mwh_total and asset.free_dispatchable_mwh are recomputed"
      - from: HELD
        to: RELEASED
        trigger: "POST /soc-reservations/{id}/release"
        actor: MarketTrader | AssetManager
        preconditions:
          - "no MarketBid with status IN {SUBMITTED, CLEARED} references this reservation"
        side_effects:
          - "released_reason := OPERATOR_RELEASE"
          - "asset.reserved_mwh_total and asset.free_dispatchable_mwh are recomputed"
      - from: HELD
        to: RELEASED
        trigger: "system — cascade link 4 of safety_alarm_chain (bid withdrawn), or POST /market-bids/{id}/withdraw, or CAPACITY preemption inside POST /soc-reservations"
        actor: system
        preconditions:
          - "the reservation is referenced by the withdrawn bid, or it is the lowest-priority overlapping HELD reservation selected by the preemption order of calculations.soc_reservation_availability"
        side_effects:
          - "released_reason := BID_WITHDRAWN or CAPACITY_PREEMPTION"
          - "asset.reserved_mwh_total and asset.free_dispatchable_mwh are recomputed"
      - from: HELD
        to: EXPIRED
        trigger: "system — create-time expiry sweep at step 0 of calculations.soc_reservation_availability"
        actor: system
        preconditions:
          - "reservation.window_end <= clock_now"
        side_effects:
          - "released_reason := WINDOW_EXPIRED"
          - "asset.reserved_mwh_total and asset.free_dispatchable_mwh are recomputed before the incoming reservation is evaluated"
      - from: CONSUMED
        to: RELEASED
        trigger: "system — compensation inside POST /dispatch-instructions/{id}/fail applied to a COMPLETED instruction"
        actor: system
        preconditions:
          - "dispatch.execution_status == COMPLETED and dispatch.scoring_status == PROVISIONAL"
        side_effects:
          - "consumed_mwh := 0.0; released_reason := DISPATCH_COMPENSATION"

  - entity: MarketBid
    state_field: status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /market-bids/{id}/submit"
        actor: MarketTrader
        preconditions:
          - "asset.market_state == AVAILABLE"
          - "asset.safety_state != LOCKOUT"
          - "reservation.status == HELD and reservation.asset_id == bid.asset_id"
          - "reservation.window_start <= bid.delivery_start and reservation.window_end > bid.delivery_end"
          - "asset.equivalent_full_cycles_ytd + bid.cycle_debit_efc <= asset.cycle_limit_per_year"
          - "asset.cumulative_throughput_mwh + bid.expected_energy_mwh <= asset.warranty_throughput_limit_mwh"
          - "no other MarketBid of the same asset_id and market_type with status IN {SUBMITTED, CLEARED} conflicts with this bid's delivery interval under the ramp-buffer geometry of validations[priority=21]"
        side_effects:
          - "submitted_by_user_id := X-User-ID of the caller"
          - "offer_price_usd_per_mwh is frozen at its current value and stops tracking asset recomputes"
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /market-bids/{id}/clearing-result with outcome CLEARED — the CLEARED branch"
        actor: MarketOperator
        preconditions:
          - "cleared_price_usd_per_mwh >= bid.offer_price_usd_per_mwh"
          - "cleared_mw > 0 and cleared_mw <= bid.offer_mw"
        side_effects:
          - "cleared_price_usd_per_mwh := cleared_price_usd_mwh; cleared_mw := cleared_mw"
          - "the backing SocReservation stays HELD so the cleared energy remains withheld until dispatch"
        note: "Divergent branch of the fork — only this branch permits DispatchInstruction creation."
      - from: SUBMITTED
        to: UNCLEARED
        trigger: "POST /market-bids/{id}/clearing-result with outcome UNCLEARED — the UNCLEARED branch"
        actor: MarketOperator
        preconditions:
          - "cleared_price_usd_mwh and cleared_mw are absent from the request body"
        side_effects:
          - "cleared_price_usd_per_mwh and cleared_mw stay null"
          - "the backing SocReservation stays HELD so the trader may revise and resubmit inside the same window"
        note: "Divergent branch of the fork — no dispatch may be created, but the revision cycle is open."
      - from: UNCLEARED
        to: DRAFT
        trigger: "POST /market-bids/{id}/revise"
        actor: MarketTrader
        preconditions:
          - "reservation.status == HELD"
          - "revision_count < MAX_BID_REVISIONS"
        side_effects:
          - "revision_count := revision_count + 1"
          - "offer_mw and price_adder_usd_per_mwh are replaced when supplied"
          - "expected_energy_mwh, cycle_debit_efc and offer_price_usd_per_mwh are recomputed against the asset's current available_energy_mwh, equivalent_full_cycles_ytd and cumulative_throughput_mwh"
          - "submitted_by_user_id := null"
        note: "The cycle DRAFT -> SUBMITTED -> UNCLEARED -> DRAFT is the negotiation loop; MAX_BID_REVISIONS bounds it."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /market-bids/{id}/withdraw"
        actor: MarketTrader
        preconditions:
          - "asset.safety_state != LOCKOUT"
        side_effects:
          - "withdrawn_reason := TRADER_WITHDRAWAL"
          - "the backing SocReservation with status == HELD moves to RELEASED with released_reason := BID_WITHDRAWN"
          - "asset.reserved_mwh_total and asset.free_dispatchable_mwh are recomputed — the compensating half of compensating_invariant soc_reservation_pool_conservation"
      - from: CLEARED
        to: WITHDRAWN
        trigger: "POST /market-bids/{id}/withdraw"
        actor: MarketTrader
        preconditions:
          - "no DispatchInstruction of this bid has execution_status IN {ACCEPTED, EXECUTING, COMPLETED}"
        side_effects:
          - "withdrawn_reason := TRADER_WITHDRAWAL"
          - "the backing SocReservation with status == HELD moves to RELEASED with released_reason := BID_WITHDRAWN"
          - "every DispatchInstruction of this bid with execution_status == PENDING moves to FAILED with failure_reason := DELIVERY_VOIDED"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /market-bids/{id}/withdraw, or cascade link 3 of safety_alarm_chain"
        actor: MarketTrader | system
        preconditions:
          - "the bid has not been submitted, or the asset entered SUSPENDED"
        side_effects:
          - "withdrawn_reason := TRADER_WITHDRAWAL or ASSET_SUSPENDED"
          - "the backing SocReservation with status == HELD moves to RELEASED with released_reason := BID_WITHDRAWN"

  - entity: DispatchInstruction
    state_field: execution_status
    initial_state: PENDING
    terminal_states: [FAILED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /dispatch-instructions/{id}/accept"
        actor: ControlRoomOperator
        preconditions:
          - "bid.status == CLEARED"
          - "asset.safety_state != LOCKOUT"
          - "asset.market_state == AVAILABLE"
        side_effects:
          - "accepted_by_user_id := X-User-ID of the caller"
      - from: ACCEPTED
        to: EXECUTING
        trigger: "POST /dispatch-instructions/{id}/execute"
        actor: SiteController
        preconditions:
          - "asset.safety_state IN {NORMAL, ELEVATED}"
          - "reservation.status == HELD"
          - "round(instructed_mw * setpoint duration in hours, 3) <= reservation.reserved_mwh"
        side_effects:
          - "telemetry ingestion for this instruction becomes permitted"
      - from: EXECUTING
        to: COMPLETED
        trigger: "POST /dispatch-instructions/{id}/complete"
        actor: SiteController
        preconditions:
          - "asset.safety_state != LOCKOUT"
        side_effects:
          - "delivered_mwh := calculations.throughput_and_soc_ledger delivered term over on-time TelemetrySample rows"
          - "soc_delta_mwh := -delivered_mwh when direction == DISCHARGE, +round(delivered_mwh * asset.round_trip_efficiency_pct / 100, 3) when direction == CHARGE"
          - "asset.soc_mwh := round(asset.soc_mwh + soc_delta_mwh, 3)"
          - "asset.cumulative_throughput_mwh := round(asset.cumulative_throughput_mwh + delivered_mwh, 3)"
          - "asset.equivalent_full_cycles_ytd is recomputed after the throughput credit"
          - "the backing SocReservation moves HELD -> CONSUMED with consumed_mwh := delivered_mwh"
          - "asset.reserved_mwh_total and asset.free_dispatchable_mwh are recomputed"
          - "scoring_status axis moves NOT_SCORED -> PROVISIONAL and the PROVISIONAL variant of calculations.dispatch_performance_score is applied"
      - from: EXECUTING
        to: FAILED
        trigger: "POST /dispatch-instructions/{id}/fail — the no-delivery branch"
        actor: ControlRoomOperator | SiteController
        preconditions:
          - "delivered_mwh == 0.0 and scoring_status == NOT_SCORED"
        side_effects:
          - "failure_reason := OPERATOR_FAILURE"
          - "the backing SocReservation moves HELD -> RELEASED with released_reason := DISPATCH_COMPENSATION"
          - "no ledger movement occurs — nothing had been credited"
        note: "Divergent branch: from EXECUTING the fail action releases only the reservation."
      - from: COMPLETED
        to: FAILED
        trigger: "POST /dispatch-instructions/{id}/fail — the compensation branch"
        actor: ControlRoomOperator | SiteController
        preconditions:
          - "scoring_status == PROVISIONAL (a SETTLED instruction can no longer be compensated)"
        side_effects:
          - "asset.cumulative_throughput_mwh := round(asset.cumulative_throughput_mwh - delivered_mwh, 3)"
          - "asset.soc_mwh := round(asset.soc_mwh - soc_delta_mwh, 3) — the stored signed delta guarantees exact restoration"
          - "asset.equivalent_full_cycles_ytd is recomputed after the debit"
          - "the backing SocReservation moves CONSUMED -> RELEASED with consumed_mwh := 0.0 and released_reason := DISPATCH_COMPENSATION"
          - "delivered_mwh := 0.0; soc_delta_mwh := 0.0; failure_reason := DELIVERY_VOIDED"
          - "scoring_status axis moves PROVISIONAL -> NOT_SCORED and accuracy_score, deadband_pct, composite_score are set to null with non_performance_charge_usd := 0.0"
        note: "Divergent branch of the same trigger — this is the compensating action of compensating_invariant throughput_and_soc_conservation."
      - from: PENDING
        to: FAILED
        trigger: "system — cascade link 5 of safety_alarm_chain, or CLEARED -> WITHDRAWN on the parent bid"
        actor: system
        preconditions:
          - "asset.market_state entered SUSPENDED, or bid.status became WITHDRAWN"
        side_effects:
          - "failure_reason := ASSET_SUSPENDED or DELIVERY_VOIDED"
      - from: ACCEPTED
        to: FAILED
        trigger: "system — cascade link 5 of safety_alarm_chain"
        actor: system
        preconditions:
          - "asset.market_state entered SUSPENDED"
        side_effects:
          - "failure_reason := ASSET_SUSPENDED"

  - entity: DispatchInstruction
    state_field: scoring_status
    initial_state: NOT_SCORED
    terminal_states: [SETTLED]
    transitions:
      - from: NOT_SCORED
        to: PROVISIONAL
        trigger: "system — fired inside POST /dispatch-instructions/{id}/complete"
        actor: system
        preconditions:
          - "execution_status transitioned EXECUTING -> COMPLETED in this request"
        side_effects:
          - "accuracy_score, deadband_pct and composite_score are set from the PROVISIONAL variant, which scores only TelemetrySample rows with sampled_at <= setpoint_end"
          - "non_performance_charge_usd stays 0.0 — the provisional variant never charges"
      - from: PROVISIONAL
        to: SETTLED
        trigger: "POST /dispatch-instructions/{id}/settle-score"
        actor: MarketOperator
        preconditions:
          - "execution_status == COMPLETED"
        side_effects:
          - "accuracy_score, deadband_pct and composite_score are recomputed from the SETTLED variant, which scores every TelemetrySample row including late-arriving ones"
          - "non_performance_charge_usd := round(max(0, PERFORMANCE_FLOOR_SCORE - composite_score) * instructed_mw * NON_PERFORMANCE_RATE_USD, 2)"
          - "execution_status is untouched — the two axes move independently"
      - from: PROVISIONAL
        to: NOT_SCORED
        trigger: "system — compensation branch of POST /dispatch-instructions/{id}/fail"
        actor: system
        preconditions:
          - "execution_status transitioned COMPLETED -> FAILED in this request"
        side_effects:
          - "accuracy_score, deadband_pct, composite_score := null; non_performance_charge_usd := 0.0"

  - entity: SafetyEvent
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SUPPRESSION_ACTIVE
        trigger: "POST /safety-events/{id}/discharge-suppression"
        actor: SafetyOfficer
        preconditions:
          - "event.suppression_discharged == false"
        side_effects:
          - "suppression_discharged := true; suppression_agent_kg := agent_kg from the request"
          - "asset.safety_state is left unchanged — a discharged event is still a non-closed event"
      - from: SUPPRESSION_ACTIVE
        to: CLOSED
        trigger: "POST /safety-events/{id}/close — the suppressed branch"
        actor: SafetyOfficer
        preconditions:
          - "X-User-ID != event.opened_by_user_id"
          - "emergency_response_ack_at is supplied when event.imposed_safety_state == LOCKOUT"
        side_effects:
          - "closed_by_user_id := X-User-ID; emergency_response_ack_at := value from the request"
          - "asset.safety_state is recomputed over the remaining non-closed SafetyEvent rows of the asset"
          - "when the recomputed safety_state is neither ALARM nor LOCKOUT, market_state SUSPENDED -> AVAILABLE fires with its own side effects"
      - from: OPEN
        to: CLOSED
        trigger: "POST /safety-events/{id}/close — the unsuppressed branch"
        actor: SafetyOfficer
        preconditions:
          - "event.imposed_safety_state != LOCKOUT — a LOCKOUT event may only be closed after suppression"
          - "X-User-ID != event.opened_by_user_id"
        side_effects:
          - "closed_by_user_id := X-User-ID"
          - "asset.safety_state is recomputed over the remaining non-closed SafetyEvent rows of the asset"
          - "when the recomputed safety_state is neither ALARM nor LOCKOUT, market_state SUSPENDED -> AVAILABLE fires with its own side effects"
        note: "Divergent branch of the same trigger: no suppression is required for ADVISORY, WARNING or CRITICAL non-runaway events."

  - entity: CapacityObligation
    state_field: status
    initial_state: ACTIVE
    terminal_states: [FULFILLED]
    transitions:
      - from: ACTIVE
        to: SHORTFALL
        trigger: "POST /capacity-obligations/{id}/assess with assessment_mode PRELIMINARY, or cascade link 3 of transitive_cascade capacity_test_chain"
        actor: MarketOperator | system
        preconditions:
          - "shortfall_hours > 0 and availability_pct >= AVAILABILITY_TIER1_PCT, or asset.available_energy_mwh / obligation_duration_hours < committed_mw"
        side_effects:
          - "measured_available_hours, availability_pct, shortfall_hours, penalty_exposure_usd and assessment_mode are written from calculations.capacity_obligation_assessment"
          - "derated_committed_mw := round(asset.available_energy_mwh / obligation_duration_hours, 3) when the derate condition fired"
      - from: ACTIVE
        to: PENALIZED
        trigger: "POST /capacity-obligations/{id}/assess"
        actor: MarketOperator
        preconditions:
          - "shortfall_hours > 0 and availability_pct < AVAILABILITY_TIER1_PCT"
        side_effects:
          - "penalty_exposure_usd is written with the tier multiplier of calculations.capacity_obligation_assessment applied"
      - from: SHORTFALL
        to: PENALIZED
        trigger: "POST /capacity-obligations/{id}/assess"
        actor: MarketOperator
        preconditions:
          - "shortfall_hours > 0 and availability_pct < AVAILABILITY_TIER1_PCT"
        side_effects:
          - "penalty_exposure_usd is recomputed for the newly applied variant"
      - from: SHORTFALL
        to: ACTIVE
        trigger: "POST /capacity-obligations/{id}/assess with assessment_mode PRELIMINARY"
        actor: MarketOperator
        preconditions:
          - "shortfall_hours == 0 and derated_committed_mw == null"
        side_effects:
          - "penalty_exposure_usd := 0.0"
      - from: PENALIZED
        to: PENALIZED
        trigger: "POST /capacity-obligations/{id}/assess"
        actor: MarketOperator
        preconditions:
          - "the obligation has already been penalized; a re-assessment only restates the exposure"
        side_effects:
          - "penalty_exposure_usd, shortfall_hours, availability_pct and assessment_mode are overwritten for the newly applied variant"
        note: "PENALIZED never returns to ACTIVE or FULFILLED — the penalty stands for the program year."
      - from: ACTIVE
        to: FULFILLED
        trigger: "POST /capacity-obligations/{id}/assess with assessment_mode FINAL"
        actor: MarketOperator
        preconditions:
          - "shortfall_hours == 0 under the FINAL variant"
        side_effects:
          - "penalty_exposure_usd := 0.0; assessment_mode := FINAL"
      - from: SHORTFALL
        to: FULFILLED
        trigger: "POST /capacity-obligations/{id}/assess with assessment_mode FINAL"
        actor: MarketOperator
        preconditions:
          - "shortfall_hours == 0 under the FINAL variant"
        side_effects:
          - "penalty_exposure_usd := 0.0; assessment_mode := FINAL"
        note: "The variant switch alone can clear a preliminary shortfall — the FINAL denominator is the full 8760-hour year."

  - entity: CapacityTest
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /capacity-tests/{id}/start"
        actor: SiteController
        preconditions:
          - "asset.safety_state != LOCKOUT"
          - "no other CapacityTest of this asset has status == IN_PROGRESS"
        side_effects:
          - "none beyond the status change and updated_at refresh"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /capacity-tests/{id}/complete"
        actor: SiteController
        preconditions:
          - "measured_capacity_mwh > 0 is supplied"
          - "asset.safety_state != LOCKOUT"
        side_effects:
          - "cascade link 1 — expected_soh_pct, measured_soh_pct, soh_deficit_pct and warranty_claim_triggered are written in the pinned order of calculations.soh_degradation_model, with expected_soh_pct evaluated against asset.cumulative_throughput_mwh as it stood at the start of this request"
          - "test_energy_throughput_mwh := measured_capacity_mwh"
          - "cascade link 2 — because the test COMPLETED, asset.soh_pct := measured_soh_pct, asset.cumulative_throughput_mwh := round(asset.cumulative_throughput_mwh + test_energy_throughput_mwh, 3), asset.available_energy_mwh and asset.equivalent_full_cycles_ytd are recomputed in that order"
          - "cascade link 3 — because asset.available_energy_mwh changed, every CapacityObligation of this asset with status IN {ACTIVE, SHORTFALL} whose committed_mw > asset.available_energy_mwh / obligation_duration_hours moves to SHORTFALL with derated_committed_mw recorded and penalty_exposure_usd recomputed under the PRELIMINARY variant, processed in ascending (program_year, created_at) order"
          - "cascade link 4 — because asset.available_energy_mwh, cumulative_throughput_mwh and equivalent_full_cycles_ytd changed, offer_price_usd_per_mwh, expected_energy_mwh and cycle_debit_efc are recomputed for every MarketBid of this asset with status == DRAFT, processed in ascending (delivery_start, created_at) order"
          - "asset.free_dispatchable_mwh is recomputed last, after available_energy_mwh"

  - entity: WarrantyClaim
    state_field: status
    initial_state: DRAFT
    terminal_states: [DENIED, REMEDIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /warranty-claims/{id}/submit"
        actor: AssetManager
        preconditions:
          - "capacity_test.status == COMPLETED and capacity_test.warranty_claim_triggered == true"
          - "clock_now <= capacity_test.scheduled_date + CLAIM_FILING_WINDOW_DAYS days"
        side_effects:
          - "submitted_by_user_id := X-User-ID"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/adjudicate with decision APPROVE — the approval branch"
        actor: PlatformAdmin
        preconditions:
          - "remedy_install_date and remedy_outage_days are supplied"
          - "denial_reason is absent"
        side_effects:
          - "remedy_energy_add_mwh := round(asset.rated_energy_mwh * claimed_shortfall_pct / 100 * REMEDY_OVERSIZE_FACTOR, 3) — step 5 of the pinned order in calculations.soh_degradation_model"
          - "remedy_install_date and remedy_outage_days are stored, opening the closed-interval augmentation outage window that blocks CapacityTest scheduling"
          - "adjudicated_by_user_id := X-User-ID"
          - "asset.rated_energy_mwh is NOT changed yet — only the REMEDIED status admits the augmentation energy"
        note: "Divergent branch: only this branch creates an outage window and a remedy quantity."
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/adjudicate with decision DENY — the denial branch"
        actor: PlatformAdmin
        preconditions:
          - "denial_reason is supplied"
          - "remedy_install_date and remedy_outage_days are absent"
        side_effects:
          - "denial_reason is stored; remedy_energy_add_mwh stays null"
          - "adjudicated_by_user_id := X-User-ID"
          - "no outage window is opened and no asset field changes"
        note: "Divergent branch of the same trigger with a disjoint side-effect set."
      - from: APPROVED
        to: REMEDIED
        trigger: "POST /warranty-claims/{id}/install-remedy"
        actor: AssetManager
        preconditions:
          - "clock_now >= claim.remedy_install_date"
          - "asset.safety_state != LOCKOUT"
        side_effects:
          - "asset.rated_energy_mwh is recomputed and now includes this claim's remedy_energy_add_mwh"
          - "asset.available_energy_mwh := round(asset.rated_energy_mwh * asset.soh_pct / 100, 3)"
          - "asset.equivalent_full_cycles_ytd and asset.free_dispatchable_mwh are recomputed after available_energy_mwh"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on StorageAsset.version only
# =============================================================================
concurrency_rules:
  - rule_id: soc-reservation-create-stale-asset
    parent_entity: StorageAsset
    write_endpoint: "POST /soc-reservations"
    occ_field: "expected_asset_version"
    description: |
      Creating a SocReservation against a StorageAsset whose version has advanced
      since the client last read it is rejected on the stale-version check. The
      reservation surface legitimately admits a second holding on the same window
      whenever free energy remains, and a CAPACITY reservation may even supersede
      overlapping ENERGY_ARBITRAGE holdings through the preemption ladder, so a
      caller holding a stale view of the asset cannot be caught by any state
      precondition — its intended write is, on its own terms, still valid
      business. The OCC guard therefore reduces the conflict to a
      deterministic comparison against StorageAsset.version, which every
      reservation create, release, dispatch completion, capacity-test completion
      and safety cascade advances by one.
    error_id: ERR_STALE_ASSET_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All monetary results use round_half_up. Every ordering below is over entity
# fields only; StorageAsset.id and every other UUID is forbidden as a decision
# input, and created_at ASC is the only permitted final tie-break.
# =============================================================================
calculations:

  - name: soc_reservation_availability
    trigger: "POST /soc-reservations, before the row is inserted; the derived fields StorageAsset.reserved_mwh_total and StorageAsset.free_dispatchable_mwh are additionally recomputed on every SocReservation status change and on every change to StorageAsset.soc_mwh or available_energy_mwh"
    algorithm: waterfall_allocation
    formula: |
      # ---- step 0: expiry sweep (runs first, and its releases count as headroom)
      for r in SocReservation where r.asset_id == req.asset_id and r.status == HELD
               and r.window_end <= clock_now,
          ordered by (r.window_end ASC, r.created_at ASC):
              r.status := EXPIRED ; r.released_reason := WINDOW_EXPIRED
      # ---- step 1: envelope
      floor_mwh  = round(asset.nameplate_energy_mwh * asset.soc_floor_pct / 100, 3)
      usable_mwh = round(min(asset.soc_mwh,
                             asset.available_energy_mwh * asset.soc_ceiling_pct / 100), 3)
      # ---- step 2: overlapping holdings, half-open [window_start, window_end)
      overlapping = [r for r in SocReservation
                     where r.asset_id == req.asset_id
                       and r.status == HELD
                       and r.window_start <  req.window_end
                       and r.window_end   >  req.window_start]
      reserved_overlap_mwh = round(sum(r.reserved_mwh for r in overlapping), 3)
      available_mwh = round(usable_mwh - floor_mwh - reserved_overlap_mwh, 3)
      # ---- step 3: acceptance test (equality accepted)
      if req.reserved_mwh <= available_mwh: ACCEPT
      # ---- step 4: preemption ladder, CAPACITY only
      elif req.purpose == CAPACITY:
          candidates = [r for r in overlapping where r.purpose == ENERGY_ARBITRAGE]
          ordered by (r.priority_rank DESC, r.window_start ASC, r.created_at ASC)
          for r in candidates:
              r.status := RELEASED ; r.released_reason := CAPACITY_PREEMPTION
              available_mwh = round(available_mwh + r.reserved_mwh, 3)
              if req.reserved_mwh <= available_mwh: ACCEPT   # stop at the first sufficient release
          # exhausted without reaching sufficiency:
          ROLLBACK every release performed in step 4 and REJECT ERR_SOC_INSUFFICIENT
      else: REJECT ERR_SOC_INSUFFICIENT      # ANCILLARY and ENERGY_ARBITRAGE never preempt
      # ---- step 5: derived-field reconciliation after acceptance
      asset.reserved_mwh_total   = round(sum(r.reserved_mwh for r in SocReservation
                                         where r.asset_id == asset.id and r.status == HELD), 3)
      asset.free_dispatchable_mwh = max(0, round(usable_mwh - floor_mwh
                                                 - asset.reserved_mwh_total, 3))
    input_set: "SocReservation rows of the same asset_id with status == HELD only; CONSUMED, RELEASED and EXPIRED rows never occupy energy. reserved_mwh_total sums every HELD row regardless of window, while the acceptance test sums only rows overlapping the requested half-open window."
    constants: {}
    precision: "3 decimal places on all MWh quantities, round_half_up; the acceptance comparison is `<=` so an exactly-equal request is accepted"
    variants: []

  - name: bid_floor_price
    trigger: "POST /market-bids (initial offer_price_usd_per_mwh), POST /market-bids/{id}/revise, and cascade link 4 of the CapacityTest completion chain for every DRAFT bid of the asset"
    algorithm: tiered_pricing
    formula: |
      duration_h          = (delivery_end - delivery_start) in hours as a decimal   # closed interval, exact difference
      expected_energy_mwh = round(offer_mw * duration_h, 3)
      cycle_debit_efc     = round(expected_energy_mwh / (2 * asset.available_energy_mwh), 4)
      # tiered cycle-scarcity multiplier on the remaining annual cycle budget
      efc_headroom = asset.cycle_limit_per_year - asset.equivalent_full_cycles_ytd
      scarcity = 1.00 if efc_headroom >= 200
            else 1.25 if efc_headroom >= 100
            else 1.60 if efc_headroom >=  25
            else 2.50
      charge_cost     = round(CHARGE_ENERGY_COST_USD_PER_MWH * 100
                              / asset.round_trip_efficiency_pct, 4)
      degradation     = round(asset.degradation_cost_usd_per_mwh * scarcity, 4)
      throughput_ratio = asset.cumulative_throughput_mwh / asset.warranty_throughput_limit_mwh
      warranty_adder  = round(WARRANTY_ADDER_BASE_USD
                              * max(0, throughput_ratio - WARRANTY_ADDER_KNEE) * 2, 4)
      product_factor  = { ENERGY: 1.00, REG_UP: 0.70, SPIN: 0.55, REG_DOWN: 0.35 }[product]
      if direction == DISCHARGE:
          floor = (charge_cost + degradation + warranty_adder) * product_factor
      else:   # CHARGE — the operator is paid to absorb, so wear terms subtract
          floor = max(0, charge_cost - degradation - warranty_adder) * product_factor
      offer_price_usd_per_mwh = round(max(floor + price_adder_usd_per_mwh,
                                         MIN_OFFER_PRICE_USD), 2)
    input_set: "Only the asset's current available_energy_mwh, equivalent_full_cycles_ytd, cumulative_throughput_mwh, round_trip_efficiency_pct and degradation_cost_usd_per_mwh plus this bid's own product, direction, offer_mw and delivery interval. Bids with status != DRAFT are never repriced."
    constants:
      CHARGE_ENERGY_COST_USD_PER_MWH: 22.00
      WARRANTY_ADDER_BASE_USD: 8.00
      WARRANTY_ADDER_KNEE: 0.5
      MIN_OFFER_PRICE_USD: 0.00
      MAX_BID_REVISIONS: 3
    precision: "intermediate terms at 4 decimal places, final price at 2 decimal places, round_half_up"
    variants: []

  - name: dispatch_performance_score
    trigger: "POST /dispatch-instructions/{id}/complete applies the PROVISIONAL variant; POST /dispatch-instructions/{id}/settle-score applies the SETTLED variant"
    algorithm: weighted_scoring
    formula: |
      samples = TelemetrySample where dispatch_id == d.id
                filtered by the applied variant's input_set
                ordered by (sample_index ASC)
      if len(samples) == 0:
          accuracy_score = 0.00 ; deadband_pct = 0.00 ; composite_score = 0.00
      else:
          # PINNED ROUNDING ORDER: round each per-sample error ratio to 4 dp FIRST,
          # then average the rounded ratios, and round only the final score to 2 dp.
          # Averaging first and rounding once produces a different score and is wrong.
          for s in samples:
              s.error_ratio = round(abs(s.measured_mw - d.instructed_mw)
                                    / d.instructed_mw, 4)
              s.within_deadband = (s.error_ratio <= DEADBAND_RATIO)      # inclusive
          mean_error   = sum(s.error_ratio for s in samples) / len(samples)   # NOT rounded here
          accuracy_score = round(max(0, 1 - mean_error) * 100, 2)
          deadband_pct   = round(count(s where s.within_deadband) / len(samples) * 100, 2)
          composite_score = round(ACCURACY_WEIGHT * accuracy_score
                                  + DEADBAND_WEIGHT * deadband_pct, 2)
      # charge term, SETTLED variant only
      non_performance_charge_usd = round(max(0, PERFORMANCE_FLOOR_SCORE - composite_score)
                                         * d.instructed_mw * NON_PERFORMANCE_RATE_USD, 2)
    input_set: "TelemetrySample rows of the instruction only; the variant selects which rows enter the average."
    constants:
      DEADBAND_RATIO: 0.02
      ACCURACY_WEIGHT: 0.7
      DEADBAND_WEIGHT: 0.3
      PERFORMANCE_FLOOR_SCORE: 75.00
      NON_PERFORMANCE_RATE_USD: 4.00
    precision: "per-sample error ratios at 4 decimal places, scores at 2 decimal places, charge at 2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "applied inside POST /dispatch-instructions/{id}/complete"
        difference: "input_set is restricted to samples with sampled_at <= d.setpoint_end (on-time telemetry). non_performance_charge_usd is forced to 0.0 regardless of the composite score."
      - name: SETTLED
        when: "applied inside POST /dispatch-instructions/{id}/settle-score"
        difference: "input_set is every TelemetrySample of the instruction, including late-arriving samples with sampled_at > d.setpoint_end, which drag both the accuracy average and the deadband percentage down. non_performance_charge_usd is assessed from the recomputed composite_score. Identical telemetry therefore yields two different composite scores for the same instruction."

  - name: capacity_obligation_assessment
    trigger: "POST /capacity-obligations/{id}/assess; cascade link 3 of the CapacityTest completion chain re-runs it with assessment_mode PRELIMINARY"
    algorithm: threshold
    formula: |
      year_start   = 00:00:00Z on 1 January of obligation.program_year
      period_hours = variant-selected (see variants)
      measured_available_hours = round(period_hours - obligation.unavailable_hours, 2)
      availability_pct         = round(measured_available_hours / period_hours * 100, 2)
      required_hours_scaled    = variant-selected (see variants)
      shortfall_hours          = round(max(0, required_hours_scaled
                                            - measured_available_hours), 2)
      # tiered penalty multiplier, boundaries inclusive on the upper tier
      multiplier = 1.0 if availability_pct >= AVAILABILITY_TIER1_PCT
              else 1.5 if availability_pct >= AVAILABILITY_TIER2_PCT
              else 2.0
      penalty_exposure_usd = round(obligation.committed_mw
                                   * obligation.penalty_rate_usd_per_mw_hour
                                   * shortfall_hours * multiplier, 2)
      status = FULFILLED   if shortfall_hours == 0 and mode == FINAL
          else ACTIVE      if shortfall_hours == 0 and mode == PRELIMINARY
                              and derated_committed_mw == null
          else SHORTFALL   if shortfall_hours == 0 and derated_committed_mw != null
          else SHORTFALL   if shortfall_hours >  0 and availability_pct >= AVAILABILITY_TIER1_PCT
          else PENALIZED
      # a capacity-derated obligation with no hour shortfall is SHORTFALL, not
      # PENALIZED — only an hour shortfall below TIER1 availability is penalised
    input_set: "Only obligation.unavailable_hours accrued for its own program_year plus the obligation's own committed_mw, availability_hours_required and penalty_rate_usd_per_mw_hour. An accrual still open (accrual_started_at != null) is NOT added by the assessment — only the resume transition folds it into unavailable_hours."
    constants:
      ANNUAL_HOURS: 8760.0
      AVAILABILITY_TIER1_PCT: 90.0
      AVAILABILITY_TIER2_PCT: 80.0
    precision: "hours and percentages at 2 decimal places, penalty at 2 decimal places, round_half_up"
    variants:
      - name: PRELIMINARY
        when: "assessment_mode == PRELIMINARY — an in-year interim assessment"
        difference: "period_hours = (clock_now - year_start) in hours, and required_hours_scaled = round(availability_hours_required * period_hours / ANNUAL_HOURS, 2) — the requirement is pro-rated to the elapsed year. A mid-year outage therefore produces a positive shortfall against a pro-rated requirement."
      - name: FINAL
        when: "assessment_mode == FINAL — the end-of-program-year settlement"
        difference: "period_hours = ANNUAL_HOURS and required_hours_scaled = availability_hours_required unscaled. The same unavailable_hours measured against the full year can clear the shortfall entirely, so the two variants return different penalty_exposure_usd for identical stored data."

  - name: soh_degradation_model
    trigger: "POST /capacity-tests/{id}/complete (steps 1-4 and the trigger flag), POST /warranty-claims/{id}/adjudicate on the APPROVED branch (step 5), POST /warranty-claims/{id}/install-remedy (step 6)"
    algorithm: constraint_propagation
    formula: |
      # The dependency LOOKS circular: remedy_energy_add_mwh is a share of
      # rated_energy_mwh, while rated_energy_mwh itself grows by every installed
      # remedy. The evaluation order below is PINNED and makes the value
      # well-defined — a remedy is always sized against the rated energy that
      # existed BEFORE it was installed.
      # (1) rated energy — REMEDIED claims only; APPROVED-but-not-installed excluded
      rated_energy_mwh = round(asset.nameplate_energy_mwh
                               + sum(c.remedy_energy_add_mwh for c in WarrantyClaim
                                     where c.asset_id == asset.id and c.status == REMEDIED), 3)
      # (2) expected SOH at the test's scheduled_date, using cumulative_throughput_mwh
      #     as it stood at the START of the completion request (before step 7's credit)
      years            = round((test.scheduled_date - asset.commercial_operation_date)
                               in days / 365, 4)
      throughput_ratio = asset.cumulative_throughput_mwh / asset.warranty_throughput_limit_mwh
      expected_soh_pct = round(max(asset.warranty_guaranteed_soh_pct,
                                   100 - asset.warranty_annual_fade_pct * years
                                       - THROUGHPUT_FADE_PCT * throughput_ratio * 100), 2)
      # (3) measured SOH against the pre-remedy rated energy of step 1
      measured_soh_pct = round(test.measured_capacity_mwh / rated_energy_mwh * 100, 2)
      # (4) deficit and (5) trigger / remedy sizing
      soh_deficit_pct        = round(max(0, expected_soh_pct - measured_soh_pct), 2)
      warranty_claim_triggered = (soh_deficit_pct >= CLAIM_TRIGGER_DEFICIT_PCT)   # inclusive
      remedy_energy_add_mwh  = round(rated_energy_mwh * claim.claimed_shortfall_pct / 100
                                     * REMEDY_OVERSIZE_FACTOR, 3)     # APPROVED branch only
      # (6) propagation on install-remedy, in this order and no other
      rated_energy_mwh     := recomputed by step 1 with this claim now REMEDIED
      asset.soh_pct         = measured_soh_pct of the latest COMPLETED CapacityTest
      asset.available_energy_mwh = round(rated_energy_mwh * asset.soh_pct / 100, 3)
      asset.equivalent_full_cycles_ytd = round(asset.cumulative_throughput_mwh
                                               / (2 * asset.available_energy_mwh), 4)
      asset.free_dispatchable_mwh recomputed last
      # (7) throughput credit of the test discharge itself, AFTER step 2 read the
      #     pre-test throughput
      test.test_energy_throughput_mwh = round(test.measured_capacity_mwh, 3)
      #   a full capacity test discharges the entire measured capacity, so the
      #   test's own throughput credit IS its measured energy
      asset.cumulative_throughput_mwh = round(asset.cumulative_throughput_mwh
                                              + test.test_energy_throughput_mwh, 3)
    input_set: "WarrantyClaim rows with status == REMEDIED only for rated energy; the single CapacityTest being completed for the measurement; asset.cumulative_throughput_mwh as of the start of the completion request for the expectation curve."
    constants:
      THROUGHPUT_FADE_PCT: 8.0
      CLAIM_TRIGGER_DEFICIT_PCT: 1.00
      REMEDY_OVERSIZE_FACTOR: 1.10
      CLAIM_FILING_WINDOW_DAYS: 30
      REMEDY_OUTAGE_BUFFER_DAYS: 2
    precision: "years at 4 decimal places, percentages at 2 decimal places, MWh at 3 decimal places, round_half_up"
    variants:
      - name: PRE_AUGMENTATION
        when: "the asset has no WarrantyClaim with status == REMEDIED"
        difference: "rated_energy_mwh == nameplate_energy_mwh, so measured_soh_pct is measured against the beginning-of-life energy."
      - name: POST_AUGMENTATION
        when: "at least one WarrantyClaim of the asset has status == REMEDIED"
        difference: "rated_energy_mwh includes every installed remedy, so the SAME measured_capacity_mwh yields a lower measured_soh_pct and a larger soh_deficit_pct than the pre-augmentation reading — augmenting the plant raises the bar the next test is judged against."

  - name: throughput_and_soc_ledger
    trigger: "POST /dispatch-instructions/{id}/complete (credit), POST /dispatch-instructions/{id}/fail on a COMPLETED instruction (debit), POST /capacity-tests/{id}/complete (test-discharge credit)"
    algorithm: aggregation
    formula: |
      # delivered energy — on-time telemetry only, fixed sample width
      on_time = [s for s in TelemetrySample where s.dispatch_id == d.id
                 and s.sampled_at <= d.setpoint_end]
      delivered_mwh = round(sum(s.measured_mw * SAMPLE_INTERVAL_HOURS for s in on_time), 3)
      # signed SOC movement, stored so the compensation can be exact
      soc_delta_mwh = -delivered_mwh                                   if d.direction == DISCHARGE
                 else round(delivered_mwh * asset.round_trip_efficiency_pct / 100, 3)
      # forward ledger
      asset.soc_mwh                  = round(asset.soc_mwh + soc_delta_mwh, 3)
      asset.cumulative_throughput_mwh = round(asset.cumulative_throughput_mwh
                                              + delivered_mwh, 3)
      asset.equivalent_full_cycles_ytd = round(asset.cumulative_throughput_mwh
                                               / (2 * asset.available_energy_mwh), 4)
      # compensating ledger (COMPLETED -> FAILED)
      asset.soc_mwh                  = round(asset.soc_mwh - d.soc_delta_mwh, 3)
      asset.cumulative_throughput_mwh = round(asset.cumulative_throughput_mwh
                                              - d.delivered_mwh, 3)
      asset.equivalent_full_cycles_ytd recomputed after the debit
      # INVARIANT (compensating_invariant throughput_and_soc_conservation):
      #   asset.cumulative_throughput_mwh
      #     == asset.initial_cumulative_throughput_mwh
      #        + sum(x.delivered_mwh for x in DispatchInstruction
      #              where x.asset_id == asset.id and x.execution_status == COMPLETED)
      #        + sum(t.test_energy_throughput_mwh for t in CapacityTest
      #              where t.asset_id == asset.id and t.status == COMPLETED)
      #   and asset.soc_mwh == asset.initial_soc_mwh
      #        + sum(x.soc_delta_mwh for x in DispatchInstruction
      #              where x.asset_id == asset.id and x.execution_status == COMPLETED)
    input_set: "TelemetrySample rows with sampled_at <= setpoint_end for the delivered term; DispatchInstruction rows with execution_status == COMPLETED and CapacityTest rows with status == COMPLETED for the invariant. FAILED instructions contribute zero to both sums because their delivered_mwh and soc_delta_mwh are reset to 0.0."
    constants:
      SAMPLE_INTERVAL_HOURS: 0.25
    precision: "3 decimal places on MWh, 4 on equivalent full cycles, round_half_up"
    variants: []

  - name: poi_reactive_compliance
    trigger: "POST /telemetry-samples, evaluated before the sample row is inserted"
    algorithm: threshold
    formula: |
      apparent_mva = round(sqrt(measured_mw ** 2 + measured_mvar ** 2), 3)
      deviation_mw  = round(abs(measured_mw - dispatch.instructed_mw), 3)
      # interconnection compliance — both limits are inclusive, so a measurement
      # exactly at the limit is compliant and only a strictly greater one is rejected
      if measured_mw   > asset.poi_mw_limit:            REJECT ERR_POI_LIMIT_EXCEEDED
      if apparent_mva  > asset.poi_mva_limit:           REJECT ERR_POI_LIMIT_EXCEEDED
      if abs(measured_mvar) > asset.reactive_capability_mvar:
                                                        REJECT ERR_REACTIVE_LIMIT_EXCEEDED
      # thermal banding — drives the safety cascade
      thermal_escalation = RUNAWAY if max_cell_temp_c >= THERMAL_RUNAWAY_TEMP_C
                      else WARNING if max_cell_temp_c >= THERMAL_WARNING_TEMP_C
                      else NONE
      # on WARNING: auto-create SafetyEvent(event_type THERMAL_ANOMALY, severity WARNING,
      #   source TELEMETRY_AUTO, opened_by_user_id "SYSTEM")
      # on RUNAWAY: auto-create SafetyEvent(event_type THERMAL_RUNAWAY, severity CRITICAL,
      #   source TELEMETRY_AUTO, opened_by_user_id "SYSTEM") which imposes LOCKOUT and
      #   fires the whole safety_alarm_chain cascade from link 1
    input_set: "The single incoming sample plus the asset's poi_mw_limit, poi_mva_limit and reactive_capability_mvar. Only one SafetyEvent is auto-created per sample, and the RUNAWAY band takes precedence over the WARNING band."
    constants:
      THERMAL_WARNING_TEMP_C: 65.0
      THERMAL_RUNAWAY_TEMP_C: 75.0
    precision: "apparent power at 3 decimal places, round_half_up; both POI comparisons are strict `>` so the limit value itself is compliant"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST failing rule decides the response, and no later rule may run)
#
#     Business band ordering for this domain (§1.4 lets each domain pick):
#       safety/compliance (11-16)  ->  referential/temporal constraints (17-23)
#       ->  capacity / cycle / quota / fiscal (24-33)
#     Rationale: a battery that is thermally unsafe must be refused before the
#     platform even looks at whether the trade would have been profitable, and
#     an interconnection limit is a regulatory obligation that outranks an
#     internally-owned state-of-charge budget.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty, and X-User-Role is one of the seven roles in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the role in X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "request body is a JSON object, every required input field is present with the declared type, every enum field carries a declared member, every numeric field is finite and (unless the field's constraint says otherwise) non-negative, and limit/offset are integers within limit 1..100 / offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "the resource named by the {id} path segment exists; when a path carries more than one id they are validated strictly left to right"
    error_id: "ERR_ASSET_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_BID_NOT_FOUND | ERR_DISPATCH_NOT_FOUND | ERR_SAFETY_EVENT_NOT_FOUND | ERR_OBLIGATION_NOT_FOUND | ERR_TEST_NOT_FOUND | ERR_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 5
    category: existence
    check: "every FK supplied in the request body resolves to an existing row, validated in the field order declared by §1.1 for that entity (asset_id, then reservation_id / bid_id / capacity_test_id / baseline_test_id / source_dispatch_id, then dispatch_id)"
    error_id: "ERR_ASSET_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_BID_NOT_FOUND | ERR_DISPATCH_NOT_FOUND | ERR_TEST_NOT_FOUND"
    http_status: 404
    applies_to: "POST /soc-reservations, POST /market-bids, POST /dispatch-instructions, POST /telemetry-samples, POST /safety-events, POST /capacity-obligations, POST /capacity-tests, POST /warranty-claims"

  - priority: 6
    category: business_referential
    check: "every FK in the request body that transitively belongs to a StorageAsset resolves to the SAME asset as the request's asset_id (bid.asset_id, reservation.asset_id, dispatch.asset_id, capacity_test.asset_id, source_dispatch.asset_id and baseline_test.asset_id must all agree)"
    error_id: ERR_ASSET_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /market-bids, POST /dispatch-instructions, POST /safety-events, POST /capacity-tests, POST /warranty-claims"

  - priority: 7
    category: auth
    check: "when X-User-Role is SiteController (identity entity_backed:StorageAsset), X-User-ID equals the id of the StorageAsset the request targets, reached through the dispatch_id / {id} chain"
    error_id: ERR_ASSET_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /telemetry-samples, POST /dispatch-instructions/{id}/execute, POST /dispatch-instructions/{id}/complete, POST /dispatch-instructions/{id}/fail, POST /capacity-tests/{id}/start, POST /capacity-tests/{id}/complete"

  - priority: 8
    category: auth
    check: "segregation of duties: X-User-ID on POST /warranty-claims/{id}/adjudicate differs from the claim's created_by_user_id, and X-User-ID on POST /safety-events/{id}/close differs from the event's opened_by_user_id (an auto-created event carries opened_by_user_id \"SYSTEM\", which no human user id can equal)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /warranty-claims/{id}/adjudicate, POST /safety-events/{id}/close"

  - priority: 9
    category: state
    check: "the target resource occupies the state the requested transition departs from, per the §1.2 state machines. When one endpoint is guarded by more than one state field the guards are evaluated in the left-to-right order of this rule's error_id list, so on POST /dispatch-instructions/{id}/settle-score the execution_status guard (ERR_DISPATCH_NOT_COMPLETED) is evaluated before the scoring_status guard (ERR_SCORE_NOT_PROVISIONAL)"
    error_id: "ERR_BID_NOT_DRAFT | ERR_BID_NOT_SUBMITTED | ERR_BID_NOT_CLEARED | ERR_DISPATCH_NOT_PENDING | ERR_DISPATCH_NOT_ACCEPTED | ERR_DISPATCH_NOT_EXECUTING | ERR_DISPATCH_NOT_COMPLETED | ERR_RESERVATION_NOT_HELD | ERR_TEST_NOT_SCHEDULED | ERR_TEST_NOT_IN_PROGRESS | ERR_CLAIM_NOT_DRAFT | ERR_CLAIM_NOT_SUBMITTED | ERR_CLAIM_NOT_APPROVED | ERR_EVENT_NOT_OPEN | ERR_EVENT_NOT_SUPPRESSING | ERR_SCORE_NOT_PROVISIONAL | ERR_ASSET_NOT_OFFLINE"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 10
    category: state
    check: "expected_asset_version equals the current StorageAsset.version (§1.2.1 rule soc-reservation-create-stale-asset)"
    error_id: ERR_STALE_ASSET_VERSION
    http_status: 412
    applies_to: "POST /soc-reservations"

  - priority: 11
    category: business_safety
    check: "the StorageAsset's safety_state is not LOCKOUT — a thermal lockout freezes every market, dispatch and test operation on the asset until the lockout is cleared by closing the CRITICAL SafetyEvent"
    error_id: ERR_ASSET_SAFETY_LOCKOUT
    http_status: 409
    applies_to: "POST /soc-reservations, POST /market-bids, POST /market-bids/{id}/submit, POST /market-bids/{id}/revise, POST /dispatch-instructions, POST /dispatch-instructions/{id}/accept, POST /dispatch-instructions/{id}/execute, POST /capacity-tests, POST /capacity-tests/{id}/start"

  - priority: 12
    category: business_safety
    check: "the StorageAsset's market_state is AVAILABLE — an OFFLINE (never commissioned) or SUSPENDED (safety-suspended) asset may not reserve state of charge, offer into a market or take a dispatch"
    error_id: ERR_ASSET_NOT_MARKET_AVAILABLE
    http_status: 409
    applies_to: "POST /soc-reservations, POST /market-bids, POST /market-bids/{id}/submit, POST /market-bids/{id}/revise, POST /market-bids/{id}/clearing-result, POST /dispatch-instructions, POST /dispatch-instructions/{id}/accept"

  - priority: 13
    category: business_safety
    check: "when the StorageAsset's safety_state is ELEVATED the plant is derated: offer_mw (or instructed_mw) must not exceed DERATE_POWER_FRACTION_PCT = 50.0% of power_rating_mw. An open WARNING-severity thermal event does not suspend the market, it shrinks the sellable power."
    error_id: ERR_ASSET_DERATED
    http_status: 409
    applies_to: "POST /market-bids/{id}/submit, POST /dispatch-instructions/{id}/accept"

  - priority: 14
    category: business_safety
    check: "a SafetyEvent whose suppression_discharged flag is false cannot be closed — fire suppression must be confirmed discharged and the panel reset before the event leaves SUPPRESSION_ACTIVE"
    error_id: ERR_SUPPRESSION_NOT_DISCHARGED
    http_status: 409
    applies_to: "POST /safety-events/{id}/close"

  - priority: 15
    category: business_safety
    check: "closing a CRITICAL SafetyEvent requires emergency_response_ack_at to be supplied, responder_cleared to be true, and emergency_ack_agencies to name at least one coordinating agency — emergency response coordination must be recorded before the plant returns to market"
    error_id: ERR_EMERGENCY_ACK_REQUIRED
    http_status: 422
    applies_to: "POST /safety-events/{id}/close"

  - priority: 16
    category: business_safety
    check: "interconnection compliance: measured_mw <= asset.poi_mw_limit and round(sqrt(measured_mw^2 + measured_mvar^2), 3) <= asset.poi_mva_limit (both inclusive, so a value exactly at the limit passes)"
    error_id: ERR_POI_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /telemetry-samples"

  - priority: 17
    category: business_safety
    check: "reactive power support obligation: abs(measured_mvar) <= asset.reactive_capability_mvar"
    error_id: ERR_REACTIVE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /telemetry-samples"

  - priority: 18
    category: business_referential
    check: "a DispatchInstruction's setpoint window sits inside the cleared bid's delivery window, and the bid's reservation covers that same window (reservation.window_start <= setpoint_start and setpoint_end <= reservation.window_end)"
    error_id: ERR_RESERVATION_WINDOW_MISMATCH
    http_status: 422
    applies_to: "POST /dispatch-instructions"

  - priority: 19
    category: business_referential
    check: "a WarrantyClaim may only cite a CapacityTest whose status is COMPLETED and whose warranty_claim_triggered flag is true, and no other DRAFT/SUBMITTED/APPROVED/REMEDIED claim already cites that test"
    error_id: ERR_NO_WARRANTY_TRIGGER
    http_status: 422
    applies_to: "POST /warranty-claims"

  - priority: 20
    category: business_referential
    check: "a CapacityTest's baseline_test_id, when supplied, names a COMPLETED CapacityTest of the same asset whose scheduled_date is strictly earlier than this test's scheduled_date and which is not the test itself"
    error_id: ERR_BASELINE_TEST_INVALID
    http_status: 422
    applies_to: "POST /capacity-tests"

  - priority: 21
    category: business_temporal
    check: "no other SUBMITTED or CLEARED MarketBid of the same asset and market_type occupies the requested delivery window, where occupancy is the CLOSED interval [delivery_start - RAMP_BUFFER_MINUTES, delivery_end + RAMP_BUFFER_MINUTES] with RAMP_BUFFER_MINUTES = 15 — so two bids that merely touch at an endpoint DO conflict, and a 15-minute gap is also a conflict"
    error_id: ERR_BID_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /market-bids/{id}/submit"

  - priority: 22
    category: business_temporal
    check: "a CapacityTest window must not fall inside any remedy outage window of the asset, taken as the CLOSED inclusive interval [remedy_install_date, remedy_install_date + remedy_outage_days days + REMEDY_OUTAGE_BUFFER_DAYS days] of every WarrantyClaim in status APPROVED or REMEDIED — the augmentation crew owns the plant single-occupancy, trailing buffer included"
    error_id: ERR_REMEDY_OUTAGE_CONFLICT
    http_status: 409
    applies_to: "POST /capacity-tests, POST /capacity-tests/{id}/start"

  - priority: 23
    category: business_temporal
    check: "a WarrantyClaim is filed within CLAIM_FILING_WINDOW_DAYS of the cited test's scheduled_date, measured against the logical clock, inclusive of the final day (elapsed_days <= 30 passes, 31 fails)"
    error_id: ERR_CLAIM_FILING_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /warranty-claims"

  - priority: 24
    category: business_temporal
    check: "telemetry arrives monotonically: sampled_at is strictly greater than the sampled_at of the newest existing TelemetrySample of the same dispatch, and is not earlier than setpoint_start"
    error_id: ERR_TELEMETRY_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /telemetry-samples"

  - priority: 25
    category: business_constraint
    check: "offer_mw <= min(asset.power_rating_mw, asset.poi_mw_limit) and, for a REG_UP, REG_DOWN or SPIN product, offer_mw <= asset.power_rating_mw / 2 because the asset must be able to move in both directions"
    error_id: ERR_OFFER_MW_EXCEEDS_RATING
    http_status: 422
    applies_to: "POST /market-bids, POST /market-bids/{id}/revise"

  - priority: 26
    category: business_constraint
    check: "a CapacityObligation's committed_mw <= asset.power_rating_mw and its availability_hours_required <= ANNUAL_HOURS (8760.0)"
    error_id: ERR_COMMITMENT_EXCEEDS_RATING
    http_status: 422
    applies_to: "POST /capacity-obligations"

  - priority: 27
    category: business_constraint
    check: "at most one CapacityObligation exists per (asset_id, program_name, program_year) triple, whatever its status — a duplicate enrolment is refused rather than merged"
    error_id: ERR_DUPLICATE_OBLIGATION
    http_status: 409
    applies_to: "POST /capacity-obligations"

  - priority: 28
    category: business_constraint
    check: "instructed_mw <= bid.cleared_mw — the operator cannot instruct more power than the market actually cleared"
    error_id: ERR_INSTRUCTION_EXCEEDS_CLEARED
    http_status: 422
    applies_to: "POST /dispatch-instructions"

  - priority: 29
    category: business_constraint
    check: "cleared_price_usd_per_mwh >= bid.offer_price_usd_per_mwh — the offer price IS the floor, so an award at exactly the offer price is accepted (inclusive) and one a cent below it is refused as an uneconomic award that would sell degradation below cost"
    error_id: ERR_CLEARING_PRICE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /market-bids/{id}/clearing-result"

  - priority: 30
    category: business_constraint
    check: "bid.revision_count < MAX_BID_REVISIONS (3) — the fourth revision of the same bid is refused and the bid must be withdrawn instead"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /market-bids/{id}/revise"

  - priority: 31
    category: business_fiscal
    check: "cycle limit: round(asset.equivalent_full_cycles_ytd + expected_energy_mwh / (2 * asset.available_energy_mwh), 4) <= asset.cycle_limit_per_year for the bid being submitted, where expected_energy_mwh is offer_mw * duration_hours"
    error_id: ERR_CYCLE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /market-bids/{id}/submit"

  - priority: 32
    category: business_fiscal
    check: "warranty throughput limit: round(asset.cumulative_throughput_mwh + expected_energy_mwh, 3) <= asset.warranty_throughput_limit_mwh — exceeding the guaranteed throughput would void the capacity-maintenance obligation, so the offer is refused"
    error_id: ERR_THROUGHPUT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /market-bids/{id}/submit"

  - priority: 33
    category: business_fiscal
    check: "state-of-charge availability: the requested reserved_mwh fits in asset.free_dispatchable_mwh after the expiry sweep, the overlap aggregation over HELD reservations and the CAPACITY preemption ladder of calculation soc_reservation_availability; acceptance is inclusive, so a request exactly equal to the remaining headroom succeeds and headroom + 0.01 fails"
    error_id: ERR_SOC_INSUFFICIENT
    http_status: 422
    applies_to: "POST /soc-reservations"

  - priority: 34
    category: business_fiscal
    check: "a dispatch draws no more than its reservation still holds: round(expected_energy_mwh + sum(d.expected_energy_mwh for sibling DispatchInstruction d on the same reservation_id with execution_status in {PENDING, ACCEPTED, EXECUTING, COMPLETED}), 3) <= reservation.reserved_mwh"
    error_id: ERR_DISPATCH_EXCEEDS_RESERVATION
    http_status: 422
    applies_to: "POST /dispatch-instructions"

# =============================================================================
# 1.5 API Endpoint Table
#
# api_prefix is "/" (see §1.0): every entity owns a flat top-level collection.
# Each entity has BOTH a single-resource `GET /<collection>/{id}` and a filtered
# `GET /<collection>` list, so every §1.1 FK is reverse-reachable (§1.5 FK
# reverse-reachability). TelemetrySample is append-only with no single-resource
# GET, so its FK is reached through the sub-resource form
# `GET /dispatch-instructions/{id}/telemetry-samples`.
# =============================================================================
endpoints:
  # ---- StorageAsset -------------------------------------------------------
  - method: POST
    path: /storage-assets
    description: "Register a grid-scale battery. Derives soc_mwh from initial_soc_mwh, rated_energy_mwh from nameplate_energy_mwh, soh_pct 100.0, safety_state NORMAL and market_state OFFLINE; the asset cannot bid until it is commissioned."
    roles: [PlatformAdmin]
    code: 201
    input: [name, nameplate_energy_mwh, power_rating_mw, poi_mw_limit, poi_mva_limit, reactive_capability_mvar, initial_soc_mwh, degradation_cost_usd_per_mwh, warranty_throughput_limit_mwh, commercial_operation_date, cycle_limit_per_year, "round_trip_efficiency_pct?", "soc_floor_pct?", "soc_ceiling_pct?", "initial_cumulative_throughput_mwh?", "warranty_guaranteed_soh_pct?", "warranty_annual_fade_pct?"]
    output: StorageAsset
    side_effects:
      - "soc_mwh := initial_soc_mwh; cumulative_throughput_mwh := initial_cumulative_throughput_mwh; soh_pct := 100.0"
      - "rated_energy_mwh, available_energy_mwh, reserved_mwh_total (0.0), free_dispatchable_mwh and equivalent_full_cycles_ytd computed per calculation soc_reservation_availability step 0 and calculation soh_degradation_model steps 1 and 6"
      - "safety_state := NORMAL, market_state := OFFLINE, version := 1"

  - method: GET
    path: /storage-assets/{id}
    description: "Fetch one asset with its live state-of-charge ledger, reservation headroom, SOH and both state dimensions."
    roles: [PlatformAdmin, AssetManager, MarketTrader, MarketOperator, ControlRoomOperator, SiteController, SafetyOfficer]
    code: 200
    output: StorageAsset
    side_effects: []

  - method: GET
    path: /storage-assets
    description: "List assets, newest created_at first, optionally filtered by either state dimension."
    roles: [PlatformAdmin, AssetManager, MarketTrader, MarketOperator, ControlRoomOperator, SiteController, SafetyOfficer]
    code: 200
    input: ["safety_state?", "market_state?", "limit?", "offset?"]
    output: StorageAsset[]
    side_effects: []

  - method: POST
    path: /storage-assets/{id}/commission
    description: "Move market_state OFFLINE -> AVAILABLE once the asset is energised. Refused while safety_state is ALARM or LOCKOUT."
    roles: [PlatformAdmin, AssetManager]
    code: 200
    input: []
    output: StorageAsset
    side_effects:
      - "market_state := AVAILABLE; suspension_reason := null; version increments"

  - method: POST
    path: /_clock/set_current_utc
    description: "Test-driving endpoint: set the server's logical UTC clock, which every window, expiry, filing-deadline and accrual rule reads. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "subsequent requests evaluate SocReservation expiry, bid windows, remedy outages, claim filing windows and capacity accrual against the new instant"

  # ---- SocReservation -----------------------------------------------------
  - method: POST
    path: /soc-reservations
    description: "Reserve state of charge on an asset for a window and a purpose. Carries the optimistic-concurrency guard: expected_asset_version must equal the asset's current version, which every cascade silently bumps."
    roles: [MarketTrader, AssetManager]
    code: 201
    input: [asset_id, purpose, reserved_mwh, window_start, window_end, expected_asset_version]
    output: SocReservation
    side_effects:
      - "runs calculation soc_reservation_availability: expiry sweep, half-open overlap aggregation, then the CAPACITY preemption ladder"
      - "preempted ENERGY_ARBITRAGE / ANCILLARY reservations move HELD -> RELEASED with released_reason CAPACITY_PREEMPTION, and each preempted reservation's SUBMITTED or CLEARED MarketBid moves to WITHDRAWN with withdrawn_reason ASSET_SUSPENDED"
      - "priority_rank := 1 for CAPACITY, 2 for ANCILLARY, 3 for ENERGY_ARBITRAGE"
      - "StorageAsset.reserved_mwh_total and free_dispatchable_mwh recomputed; StorageAsset.version increments by 1"

  - method: GET
    path: /soc-reservations/{id}
    description: "Fetch one reservation with its consumed energy and release reason."
    roles: [PlatformAdmin, AssetManager, MarketTrader, MarketOperator, ControlRoomOperator, SiteController, SafetyOfficer]
    code: 200
    output: SocReservation
    side_effects: []

  - method: GET
    path: /soc-reservations
    description: "List reservations, newest created_at first, filterable by asset, purpose and status."
    roles: [PlatformAdmin, AssetManager, MarketTrader, MarketOperator, ControlRoomOperator, SiteController, SafetyOfficer]
    code: 200
    input: ["asset_id?", "purpose?", "status?", "limit?", "offset?"]
    output: SocReservation[]
    side_effects: []

  - method: POST
    path: /soc-reservations/{id}/release
    description: "Release a HELD reservation, returning its unconsumed energy to the asset's headroom."
    roles: [MarketTrader, AssetManager]
    code: 200
    input: []
    output: SocReservation
    side_effects:
      - "status := RELEASED, released_reason := OPERATOR_RELEASE"
      - "every DRAFT MarketBid on this reservation moves to WITHDRAWN with withdrawn_reason TRADER_WITHDRAWAL (a SUBMITTED or CLEARED bid blocks the release outright at the state-machine precondition)"
      - "StorageAsset.reserved_mwh_total and free_dispatchable_mwh recomputed; StorageAsset.version increments"

  # ---- MarketBid ----------------------------------------------------------
  - method: POST
    path: /market-bids
    description: "Construct a day-ahead or real-time offer against a HELD reservation. Runs calculation bid_floor_price, so the response already carries the degradation-aware floor the market must beat."
    roles: [MarketTrader]
    code: 201
    input: [asset_id, reservation_id, market_type, product, direction, delivery_start, delivery_end, offer_mw, "price_adder_usd_per_mwh?"]
    output: MarketBid
    side_effects:
      - "expected_energy_mwh, cycle_debit_efc and offer_price_usd_per_mwh computed per calculation bid_floor_price"
      - "status := DRAFT, revision_count := 0"

  - method: GET
    path: /market-bids/{id}
    description: "Fetch one bid with its floor price, offer price, cycle debit and clearing outcome."
    roles: [PlatformAdmin, AssetManager, MarketTrader, MarketOperator, ControlRoomOperator, SiteController, SafetyOfficer]
    code: 200
    output: MarketBid
    side_effects: []

  - method: GET
    path: /market-bids
    description: "List bids, newest created_at first, filterable by asset, reservation, status, market type and product."
    roles: [PlatformAdmin, AssetManager, MarketTrader, MarketOperator, ControlRoomOperator, SiteController, SafetyOfficer]
    code: 200
    input: ["asset_id?", "reservation_id?", "status?", "market_type?", "product?", "limit?", "offset?"]
    output: MarketBid[]
    side_effects: []

  - method: POST
    path: /market-bids/{id}/submit
    description: "Offer the bid into the market. This is where the asset-level gates bite: safety lockout, market availability, the ramp-buffer window conflict of validations[priority=21], the annual cycle limit and the warranty throughput limit."
    roles: [MarketTrader]
    code: 200
    input: []
    output: MarketBid
    side_effects:
      - "status := SUBMITTED; submitted_by_user_id := X-User-ID"
      - "the bid's window is now occupied for conflict purposes, closed interval widened by RAMP_BUFFER_MINUTES = 15 on both sides"

  - method: POST
    path: /market-bids/{id}/clearing-result
    description: "Post the market's award. outcome CLEARED requires cleared_price_usd_per_mwh and cleared_mw and refuses any price below the bid's offer_price_usd_per_mwh floor; outcome UNCLEARED releases the bid's hold on the window."
    roles: [MarketOperator]
    code: 200
    input: [outcome, "cleared_price_usd_per_mwh?", "cleared_mw?"]
    output: MarketBid
    side_effects:
      - "status := CLEARED or UNCLEARED"
      - "on UNCLEARED the reservation stays HELD but the delivery window is freed for another bid"

  - method: POST
    path: /market-bids/{id}/revise
    description: "Re-price or re-size a SUBMITTED bid. Returns the bid to DRAFT, re-runs calculation bid_floor_price against the asset's current cycle position, and increments revision_count; the fourth revision is refused."
    roles: [MarketTrader]
    code: 200
    input: ["offer_mw?", "price_adder_usd_per_mwh?"]
    output: MarketBid
    side_effects:
      - "status := DRAFT; revision_count increments by 1"
      - "expected_energy_mwh, cycle_debit_efc and offer_price_usd_per_mwh recomputed with the asset's cycle-scarcity tier as it stands NOW, which may differ from the tier at first submission"
      - "at least one of offer_mw or price_adder_usd_per_mwh must be present, else ERR_INVALID_REQUEST"

  - method: POST
    path: /market-bids/{id}/withdraw
    description: "Pull a DRAFT, SUBMITTED or CLEARED bid out of the market and return its share of the reservation to the pool."
    roles: [MarketTrader]
    code: 200
    input: []
    output: MarketBid
    side_effects:
      - "status := WITHDRAWN, withdrawn_reason := TRADER_WITHDRAWAL"
      - "every PENDING or ACCEPTED DispatchInstruction of this bid moves to FAILED with failure_reason DELIVERY_VOIDED"
      - "the reservation's consumed_mwh is decremented by the withdrawn bid's share, and StorageAsset.reserved_mwh_total / free_dispatchable_mwh are recomputed — the conserved quantity of compensating_invariant reservation_pool_conservation"

  # ---- DispatchInstruction ------------------------------------------------
  - method: POST
    path: /dispatch-instructions
    description: "Issue a dispatch setpoint under a CLEARED bid. instructed_mw may not exceed cleared_mw, the setpoint window must sit inside both the delivery window and the reservation window, and the instruction may not draw more energy than the reservation still holds."
    roles: [MarketOperator]
    code: 201
    input: [bid_id, asset_id, instructed_mw, setpoint_start, setpoint_end]
    output: DispatchInstruction
    side_effects:
      - "direction inherited from the bid; execution_status := PENDING; scoring_status := NOT_SCORED"
      - "expected_energy_mwh charged against the reservation's remaining hold"

  - method: GET
    path: /dispatch-instructions/{id}
    description: "Fetch one instruction with its delivered energy, SOC delta and all three performance scores."
    roles: [PlatformAdmin, AssetManager, MarketTrader, MarketOperator, ControlRoomOperator, SiteController, SafetyOfficer]
    code: 200
    output: DispatchInstruction
    side_effects: []

  - method: GET
    path: /dispatch-instructions
    description: "List instructions, newest created_at first, filterable by asset, bid, execution status and scoring status."
    roles: [PlatformAdmin, AssetManager, MarketTrader, MarketOperator, ControlRoomOperator, SiteController, SafetyOfficer]
    code: 200
    input: ["asset_id?", "bid_id?", "execution_status?", "scoring_status?", "limit?", "offset?"]
    output: DispatchInstruction[]
    side_effects: []

  - method: POST
    path: /dispatch-instructions/{id}/accept
    description: "Control room accepts the instruction. Guarded by the bid still being CLEARED and the asset being neither locked out nor derated below the instructed power."
    roles: [ControlRoomOperator]
    code: 200
    input: []
    output: DispatchInstruction
    side_effects:
      - "execution_status := ACCEPTED; accepted_by_user_id := X-User-ID"

  - method: POST
    path: /dispatch-instructions/{id}/execute
    description: "Site controller starts delivering the setpoint. Only the SiteController whose X-User-ID equals the asset id may call this."
    roles: [SiteController]
    code: 200
    input: []
    output: DispatchInstruction
    side_effects:
      - "execution_status := EXECUTING; the reservation moves HELD -> CONSUMED once the first instruction under it executes"

  - method: POST
    path: /dispatch-instructions/{id}/complete
    description: "Close out delivery. Aggregates on-time telemetry into delivered_mwh, moves the asset's SOC and throughput ledgers, and produces the PROVISIONAL performance score."
    roles: [SiteController]
    code: 200
    input: []
    output: DispatchInstruction
    side_effects:
      - "execution_status := COMPLETED; runs calculation throughput_and_soc_ledger (delivered_mwh, soc_delta_mwh, StorageAsset.soc_mwh, cumulative_throughput_mwh, equivalent_full_cycles_ytd)"
      - "runs calculation dispatch_performance_score in the PROVISIONAL variant; scoring_status := PROVISIONAL"
      - "StorageAsset.version increments"

  - method: POST
    path: /dispatch-instructions/{id}/fail
    description: "Mark the instruction failed. From EXECUTING this is a plain abort; from COMPLETED it is a compensating reversal that unwinds every ledger effect the completion applied."
    roles: [ControlRoomOperator, SiteController]
    code: 200
    input: ["failure_reason?"]
    output: DispatchInstruction
    side_effects:
      - "execution_status := FAILED; failure_reason := supplied value or OPERATOR_FAILURE"
      - "from COMPLETED: StorageAsset.soc_mwh -= soc_delta_mwh, cumulative_throughput_mwh -= delivered_mwh, equivalent_full_cycles_ytd recomputed, then delivered_mwh := 0.0, soc_delta_mwh := 0.0, non_performance_charge_usd := 0.0, accuracy_score / deadband_pct / composite_score := null, scoring_status := NOT_SCORED"
      - "StorageAsset.version increments"

  - method: POST
    path: /dispatch-instructions/{id}/settle-score
    description: "Re-score a PROVISIONAL instruction in the SETTLED variant, admitting the late telemetry that arrived after setpoint_end and charging non-performance against the shortfall."
    roles: [MarketOperator]
    code: 200
    input: []
    output: DispatchInstruction
    side_effects:
      - "runs calculation dispatch_performance_score in the SETTLED variant; accuracy_score, deadband_pct, composite_score and non_performance_charge_usd overwritten; scoring_status := SETTLED"

  # ---- TelemetrySample ----------------------------------------------------
  - method: POST
    path: /telemetry-samples
    description: "Append one telemetry sample to an EXECUTING or COMPLETED instruction. Enforces interconnection limits and reactive capability, bands the cell temperature, and may auto-open a SafetyEvent that cascades into a plant lockout."
    roles: [SiteController]
    code: 201
    input: [dispatch_id, sample_index, sampled_at, measured_mw, measured_mvar, soc_mwh_reading, max_cell_temp_c]
    output: TelemetrySample
    side_effects:
      - "apparent_mva, deviation_mw, error_ratio, within_deadband and thermal_escalation computed per calculation poi_reactive_compliance"
      - "DispatchInstruction.telemetry_sample_count increments"
      - "on thermal_escalation WARNING or RUNAWAY a SafetyEvent is auto-created with source TELEMETRY_AUTO, opened_by_user_id \"SYSTEM\", source_dispatch_id := dispatch_id and source_sample_index := sample_index; a RUNAWAY event fires the whole safety_alarm_chain cascade"

  - method: GET
    path: /dispatch-instructions/{id}/telemetry-samples
    description: "List the telemetry of one instruction in ascending sampled_at order. This is the only discovery channel for auto-computed sample fields, since samples are append-only and carry no single-resource GET."
    roles: [PlatformAdmin, AssetManager, MarketTrader, MarketOperator, ControlRoomOperator, SiteController, SafetyOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: TelemetrySample[]
    side_effects: []

  # ---- SafetyEvent --------------------------------------------------------
  - method: POST
    path: /safety-events
    description: "Report a safety event manually. The imposed_safety_state derived from event_type and severity drives the safety_alarm_chain cascade: THERMAL_RUNAWAY imposes LOCKOUT, any other CRITICAL imposes ALARM, WARNING imposes ELEVATED, ADVISORY imposes NONE."
    roles: [SafetyOfficer, ControlRoomOperator]
    code: 201
    input: [asset_id, event_type, severity, detected_max_cell_temp_c]
    output: SafetyEvent
    side_effects:
      - "source := MANUAL; opened_by_user_id := X-User-ID; status := OPEN"
      - "imposed_safety_state derived, then cascade link 1 recomputes StorageAsset.safety_state as the most severe imposed_safety_state among non-closed events of the asset"
      - "cascade links 2, 3, 5 and 6 fire when the recomputed safety_state is ALARM or LOCKOUT (market suspension, bid withdrawal, dispatch failure, obligation accrual start)"
      - "StorageAsset.version increments"

  - method: GET
    path: /safety-events/{id}
    description: "Fetch one safety event with its imposed posture, suppression record and emergency-response acknowledgement."
    roles: [PlatformAdmin, AssetManager, MarketTrader, MarketOperator, ControlRoomOperator, SiteController, SafetyOfficer]
    code: 200
    output: SafetyEvent
    side_effects: []

  - method: GET
    path: /safety-events
    description: "List safety events, newest created_at first, filterable by asset, originating dispatch, status and severity. The only discovery channel for events auto-created by telemetry."
    roles: [PlatformAdmin, AssetManager, MarketTrader, MarketOperator, ControlRoomOperator, SiteController, SafetyOfficer]
    code: 200
    input: ["asset_id?", "source_dispatch_id?", "status?", "severity?", "limit?", "offset?"]
    output: SafetyEvent[]
    side_effects: []

  - method: POST
    path: /safety-events/{id}/discharge-suppression
    description: "Record that the fire suppression system discharged on an OPEN event, moving it to SUPPRESSION_ACTIVE. A LOCKOUT event cannot be closed until this has run."
    roles: [SafetyOfficer]
    code: 200
    input: [suppression_agent_kg]
    output: SafetyEvent
    side_effects:
      - "status := SUPPRESSION_ACTIVE; suppression_discharged := true; suppression_agent_kg := the supplied mass"

  - method: POST
    path: /safety-events/{id}/close
    description: "Close the event. A CRITICAL event needs emergency_response_ack_at, responder_cleared true and at least one entry in emergency_ack_agencies, and the closing user may not be the user that opened it."
    roles: [SafetyOfficer]
    code: 200
    input: ["emergency_response_ack_at?", "emergency_ack_agencies?", "responder_cleared?"]
    output: SafetyEvent
    side_effects:
      - "status := CLOSED; closed_by_user_id := X-User-ID"
      - "StorageAsset.safety_state recomputed downward from the remaining non-closed events; when none remain it returns to NORMAL"
      - "when safety_state leaves {ALARM, LOCKOUT}, market_state SUSPENDED -> AVAILABLE, suspension_reason := null, and every CapacityObligation with a non-null accrual_started_at accrues unavailable_hours += hours between accrual_started_at and clock_now, then clears accrual_started_at"
      - "StorageAsset.version increments"

  # ---- CapacityObligation -------------------------------------------------
  - method: POST
    path: /capacity-obligations
    description: "Enrol the asset in a capacity program year with an availability commitment and a penalty rate. One live obligation per (asset, program_name, program_year)."
    roles: [AssetManager, MarketOperator]
    code: 201
    input: [asset_id, program_name, program_year, committed_mw, availability_hours_required, penalty_rate_usd_per_mw_hour, "obligation_duration_hours?"]
    output: CapacityObligation
    side_effects:
      - "status := ACTIVE; unavailable_hours := 0.0; penalty_exposure_usd := 0.0; assessment_mode := null"

  - method: GET
    path: /capacity-obligations/{id}
    description: "Fetch one obligation with its accrued unavailability, availability percentage, shortfall hours and penalty exposure."
    roles: [PlatformAdmin, AssetManager, MarketTrader, MarketOperator, ControlRoomOperator, SiteController, SafetyOfficer]
    code: 200
    output: CapacityObligation
    side_effects: []

  - method: GET
    path: /capacity-obligations
    description: "List obligations, newest created_at first, filterable by asset, program year and status."
    roles: [PlatformAdmin, AssetManager, MarketTrader, MarketOperator, ControlRoomOperator, SiteController, SafetyOfficer]
    code: 200
    input: ["asset_id?", "program_year?", "status?", "limit?", "offset?"]
    output: CapacityObligation[]
    side_effects: []

  - method: POST
    path: /capacity-obligations/{id}/unavailability
    description: "Record hours in which the asset could not meet its capacity commitment (forced outage, safety suspension reconciliation, telemetry gap). Accrues onto unavailable_hours without assessing the obligation."
    roles: [ControlRoomOperator, MarketOperator]
    code: 200
    input: [unavailable_hours_delta, "reason?"]
    output: CapacityObligation
    side_effects:
      - "unavailable_hours := round(unavailable_hours + unavailable_hours_delta, 2)"
      - "no assessment runs, so availability_pct, shortfall_hours, penalty_exposure_usd and status keep their previous values until an assess call"

  - method: POST
    path: /capacity-obligations/{id}/assess
    description: "Assess availability against the commitment. mode PRELIMINARY pro-rates the requirement over the elapsed program period; mode FINAL judges the full 8760-hour year. Same accrued unavailability, two different penalties."
    roles: [MarketOperator]
    code: 200
    input: [mode]
    output: CapacityObligation
    side_effects:
      - "runs calculation capacity_obligation_assessment in the requested variant; measured_available_hours, availability_pct, shortfall_hours, penalty_exposure_usd, derated_committed_mw, assessment_mode and status all overwritten"

  # ---- CapacityTest ------------------------------------------------------
  - method: POST
    path: /capacity-tests
    description: "Schedule a periodic capacity test. The window must clear every APPROVED or REMEDIED augmentation outage of the asset, trailing buffer included, and any baseline_test_id must name an earlier COMPLETED test of the same asset."
    roles: [AssetManager]
    code: 201
    input: [asset_id, scheduled_date, "baseline_test_id?"]
    output: CapacityTest
    side_effects:
      - "status := SCHEDULED; warranty_claim_triggered := false; test_energy_throughput_mwh := 0.0"

  - method: GET
    path: /capacity-tests/{id}
    description: "Fetch one capacity test with its measured and expected state of health, deficit and warranty trigger flag."
    roles: [PlatformAdmin, AssetManager, MarketTrader, MarketOperator, ControlRoomOperator, SiteController, SafetyOfficer]
    code: 200
    output: CapacityTest
    side_effects: []

  - method: GET
    path: /capacity-tests
    description: "List capacity tests, newest created_at first, filterable by asset, baseline test and status."
    roles: [PlatformAdmin, AssetManager, MarketTrader, MarketOperator, ControlRoomOperator, SiteController, SafetyOfficer]
    code: 200
    input: ["asset_id?", "baseline_test_id?", "status?", "limit?", "offset?"]
    output: CapacityTest[]
    side_effects: []

  - method: POST
    path: /capacity-tests/{id}/start
    description: "Begin the test discharge. Only the SiteController whose X-User-ID equals the asset id may start it, and the asset must not be locked out."
    roles: [SiteController]
    code: 200
    input: []
    output: CapacityTest
    side_effects:
      - "status := IN_PROGRESS"

  - method: POST
    path: /capacity-tests/{id}/complete
    description: "Record the measured capacity. Runs calculation soh_degradation_model steps 1-4 in their pinned order, sets the warranty trigger, credits the test's own discharge to the throughput ledger, and re-prices every DRAFT bid of the asset."
    roles: [SiteController]
    code: 200
    input: [measured_capacity_mwh]
    output: CapacityTest
    side_effects:
      - "status := COMPLETED; test_energy_throughput_mwh := round(measured_capacity_mwh, 3)"
      - "cascade link 1 — measured_soh_pct, expected_soh_pct, soh_deficit_pct and warranty_claim_triggered computed per calculation soh_degradation_model"
      - "cascade link 2 — StorageAsset.soh_pct := measured_soh_pct, available_energy_mwh recomputed, cumulative_throughput_mwh += test_energy_throughput_mwh, equivalent_full_cycles_ytd recomputed"
      - "cascade link 3 — because asset.available_energy_mwh changed, every CapacityObligation of the asset with status IN {ACTIVE, SHORTFALL} whose committed_mw > available_energy_mwh / obligation_duration_hours moves to SHORTFALL, records derated_committed_mw := available_energy_mwh / obligation_duration_hours and recomputes penalty_exposure_usd under the PRELIMINARY variant, in ascending (program_year, created_at) order"
      - "cascade link 4 — every DRAFT MarketBid of the asset is re-priced per calculation bid_floor_price in ascending (delivery_start, created_at) order"
      - "StorageAsset.version increments"

  # ---- WarrantyClaim -----------------------------------------------------
  - method: POST
    path: /warranty-claims
    description: "Draft a warranty claim against a COMPLETED capacity test whose warranty_claim_triggered flag is true, within the 30-day filing window. claimed_shortfall_pct is copied from the cited test's soh_deficit_pct."
    roles: [AssetManager]
    code: 201
    input: [asset_id, capacity_test_id, claim_type]
    output: WarrantyClaim
    side_effects:
      - "status := DRAFT; claimed_shortfall_pct := the cited test's soh_deficit_pct; created_by_user_id := X-User-ID"

  - method: GET
    path: /warranty-claims/{id}
    description: "Fetch one warranty claim with its claimed shortfall, remedy sizing and outage window."
    roles: [PlatformAdmin, AssetManager, MarketTrader, MarketOperator, ControlRoomOperator, SiteController, SafetyOfficer]
    code: 200
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: /warranty-claims
    description: "List warranty claims, newest created_at first, filterable by asset, cited capacity test and status."
    roles: [PlatformAdmin, AssetManager, MarketTrader, MarketOperator, ControlRoomOperator, SiteController, SafetyOfficer]
    code: 200
    input: ["asset_id?", "capacity_test_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: POST
    path: /warranty-claims/{id}/submit
    description: "File the claim with the warranty provider, moving DRAFT -> SUBMITTED."
    roles: [AssetManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects:
      - "status := SUBMITTED; submitted_by_user_id := X-User-ID"

  - method: POST
    path: /warranty-claims/{id}/adjudicate
    description: "Provider decision. decision APPROVE requires remedy_install_date and remedy_outage_days and sizes remedy_energy_add_mwh per calculation soh_degradation_model step 5; decision DENY requires denial_reason. The adjudicating user may not be the user that filed the claim."
    roles: [PlatformAdmin]
    code: 200
    input: [decision, "denial_reason?", "remedy_install_date?", "remedy_outage_days?"]
    output: WarrantyClaim
    side_effects:
      - "status := APPROVED or DENIED; adjudicated_by_user_id := X-User-ID"
      - "on APPROVED: remedy_energy_add_mwh := round(rated_energy_mwh * claimed_shortfall_pct / 100 * REMEDY_OVERSIZE_FACTOR, 3), sized against the PRE-remedy rated_energy_mwh, and the outage window [remedy_install_date, remedy_install_date + remedy_outage_days + 2 days] becomes single-occupancy against capacity tests"

  - method: POST
    path: /warranty-claims/{id}/install-remedy
    description: "Commission the augmentation modules. Grows rated_energy_mwh, then re-derives available_energy_mwh, equivalent_full_cycles_ytd and free_dispatchable_mwh in that pinned order."
    roles: [AssetManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects:
      - "status := REMEDIED"
      - "StorageAsset.rated_energy_mwh, available_energy_mwh, equivalent_full_cycles_ytd and free_dispatchable_mwh recomputed per calculation soh_degradation_model step 6, in that exact order"
      - "StorageAsset.version increments"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- authentication / authorization ------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role missing, empty, or naming a role outside §1.7"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_ASSET_OWNERSHIP_MISMATCH
    http: 403
    condition: "a SiteController acts on telemetry, dispatch execution or a capacity test of a StorageAsset whose id differs from its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the adjudicating user filed the same warranty claim, or the closing user opened the same safety event"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, wrong type, undeclared enum member, negative quantity where a positive is required, or limit/offset outside 1..100 / >= 0"

  # ---- existence ----------------------------------------------------------
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "no StorageAsset with the given id (path or body asset_id)"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "no SocReservation with the given id (path or body reservation_id)"
  - id: ERR_BID_NOT_FOUND
    http: 404
    condition: "no MarketBid with the given id (path or body bid_id)"
  - id: ERR_DISPATCH_NOT_FOUND
    http: 404
    condition: "no DispatchInstruction with the given id (path or body dispatch_id / source_dispatch_id)"
  - id: ERR_SAFETY_EVENT_NOT_FOUND
    http: 404
    condition: "no SafetyEvent with the given id"
  - id: ERR_OBLIGATION_NOT_FOUND
    http: 404
    condition: "no CapacityObligation with the given id"
  - id: ERR_TEST_NOT_FOUND
    http: 404
    condition: "no CapacityTest with the given id (path, body capacity_test_id or body baseline_test_id)"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "no WarrantyClaim with the given id"

  # ---- state preconditions ------------------------------------------------
  - id: ERR_ASSET_NOT_OFFLINE
    http: 409
    condition: "commission called on an asset whose market_state is not OFFLINE"
  - id: ERR_BID_NOT_DRAFT
    http: 409
    condition: "submit called on a MarketBid whose status is not DRAFT, or withdraw called on a MarketBid whose status is not one of DRAFT, SUBMITTED, CLEARED (a WITHDRAWN or UNCLEARED bid cannot be withdrawn)"
  - id: ERR_BID_NOT_SUBMITTED
    http: 409
    condition: "clearing-result or revise called on a MarketBid whose status is not SUBMITTED"
  - id: ERR_BID_NOT_CLEARED
    http: 409
    condition: "a DispatchInstruction is created against, or accepted under, a MarketBid whose status is not CLEARED"
  - id: ERR_RESERVATION_NOT_HELD
    http: 409
    condition: "release called on a SocReservation whose status is not HELD, or a bid is drafted against a reservation that is no longer HELD"
  - id: ERR_DISPATCH_NOT_PENDING
    http: 409
    condition: "accept called on a DispatchInstruction whose execution_status is not PENDING — including a second accept of the same instruction, and also returned by withdraw of a CLEARED MarketBid that already has an ACCEPTED, EXECUTING or COMPLETED instruction"
  - id: ERR_DISPATCH_NOT_ACCEPTED
    http: 409
    condition: "execute called on a DispatchInstruction whose execution_status is not ACCEPTED"
  - id: ERR_DISPATCH_NOT_EXECUTING
    http: 409
    condition: "complete called on a DispatchInstruction whose execution_status is not EXECUTING, or telemetry is appended to an instruction that is neither EXECUTING nor COMPLETED"
  - id: ERR_DISPATCH_NOT_COMPLETED
    http: 409
    condition: "settle-score called on a DispatchInstruction whose execution_status is not COMPLETED"
  - id: ERR_SCORE_NOT_PROVISIONAL
    http: 409
    condition: "settle-score called on a DispatchInstruction whose scoring_status is not PROVISIONAL — an already SETTLED score cannot be settled twice"
  - id: ERR_EVENT_NOT_OPEN
    http: 409
    condition: "discharge-suppression called on a SafetyEvent whose status is not OPEN"
  - id: ERR_EVENT_NOT_SUPPRESSING
    http: 409
    condition: "close called on a SafetyEvent whose status is neither OPEN nor SUPPRESSION_ACTIVE"
  - id: ERR_TEST_NOT_SCHEDULED
    http: 409
    condition: "start called on a CapacityTest whose status is not SCHEDULED"
  - id: ERR_TEST_NOT_IN_PROGRESS
    http: 409
    condition: "complete called on a CapacityTest whose status is not IN_PROGRESS"
  - id: ERR_CLAIM_NOT_DRAFT
    http: 409
    condition: "submit called on a WarrantyClaim whose status is not DRAFT"
  - id: ERR_CLAIM_NOT_SUBMITTED
    http: 409
    condition: "adjudicate called on a WarrantyClaim whose status is not SUBMITTED"
  - id: ERR_CLAIM_NOT_APPROVED
    http: 409
    condition: "install-remedy called on a WarrantyClaim whose status is not APPROVED"

  # ---- concurrency / scope ------------------------------------------------
  - id: ERR_STALE_ASSET_VERSION
    http: 412
    condition: "expected_asset_version does not equal the StorageAsset's current version (§1.2.1 rule soc-reservation-create-stale-asset)"
  - id: ERR_ASSET_SCOPE_MISMATCH
    http: 409
    condition: "two references in the same request belong to different StorageAssets"

  # ---- safety / compliance ------------------------------------------------
  - id: ERR_ASSET_SAFETY_LOCKOUT
    http: 409
    condition: "any market, dispatch or capacity-test operation attempted while the asset's safety_state is LOCKOUT"
  - id: ERR_ASSET_NOT_MARKET_AVAILABLE
    http: 409
    condition: "a market or dispatch operation attempted while the asset's market_state is OFFLINE or SUSPENDED"
  - id: ERR_ASSET_DERATED
    http: 409
    condition: "offer_mw or instructed_mw exceeds 50% of power_rating_mw while the asset's safety_state is ELEVATED"
  - id: ERR_SUPPRESSION_NOT_DISCHARGED
    http: 409
    condition: "close called on a LOCKOUT-imposing SafetyEvent whose suppression_discharged is false"
  - id: ERR_EMERGENCY_ACK_REQUIRED
    http: 422
    condition: "close of a CRITICAL SafetyEvent without emergency_response_ack_at, without responder_cleared true, or with an empty emergency_ack_agencies list"
  - id: ERR_POI_LIMIT_EXCEEDED
    http: 422
    condition: "a telemetry sample reports measured_mw above poi_mw_limit or apparent_mva above poi_mva_limit"
  - id: ERR_REACTIVE_LIMIT_EXCEEDED
    http: 422
    condition: "a telemetry sample reports abs(measured_mvar) above the asset's reactive_capability_mvar"

  # ---- referential / temporal --------------------------------------------
  - id: ERR_RESERVATION_WINDOW_MISMATCH
    http: 422
    condition: "the setpoint window falls outside the bid's delivery window or outside the reservation's window"
  - id: ERR_NO_WARRANTY_TRIGGER
    http: 422
    condition: "a warranty claim cites a capacity test that is not COMPLETED, whose warranty_claim_triggered is false, or that another live claim already cites"
  - id: ERR_BASELINE_TEST_INVALID
    http: 422
    condition: "baseline_test_id names a test of another asset, a test that is not COMPLETED, a test dated at or after this test, or the test itself"
  - id: ERR_BID_WINDOW_CONFLICT
    http: 409
    condition: "a bid is submitted into a delivery window that touches or overlaps another SUBMITTED/CLEARED bid's window widened by the 15-minute ramp buffer"
  - id: ERR_REMEDY_OUTAGE_CONFLICT
    http: 409
    condition: "a capacity test is scheduled or started inside an APPROVED/REMEDIED augmentation outage window plus its 2-day trailing buffer"
  - id: ERR_CLAIM_FILING_WINDOW_EXPIRED
    http: 422
    condition: "a warranty claim is filed more than CLAIM_FILING_WINDOW_DAYS (30) after the cited test's scheduled_date"
  - id: ERR_TELEMETRY_OUT_OF_ORDER
    http: 409
    condition: "a telemetry sample's sampled_at is not strictly after the newest existing sample of the same dispatch, or precedes setpoint_start"

  # ---- constraint / capacity / fiscal ------------------------------------
  - id: ERR_OFFER_MW_EXCEEDS_RATING
    http: 422
    condition: "offer_mw exceeds min(power_rating_mw, poi_mw_limit), or exceeds half the power rating for a REG_UP, REG_DOWN or SPIN product"
  - id: ERR_COMMITMENT_EXCEEDS_RATING
    http: 422
    condition: "committed_mw exceeds the asset's power_rating_mw, or availability_hours_required exceeds 8760"
  - id: ERR_DUPLICATE_OBLIGATION
    http: 409
    condition: "a second CapacityObligation is enrolled for the same (asset_id, program_name, program_year)"
  - id: ERR_INSTRUCTION_EXCEEDS_CLEARED
    http: 422
    condition: "instructed_mw exceeds the bid's cleared_mw"
  - id: ERR_CLEARING_PRICE_BELOW_FLOOR
    http: 422
    condition: "cleared_price_usd_per_mwh is below the bid's offer_price_usd_per_mwh floor"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "revise called on a bid whose revision_count already equals MAX_BID_REVISIONS (3)"
  - id: ERR_CYCLE_LIMIT_EXCEEDED
    http: 409
    condition: "submitting the bid would push equivalent_full_cycles_ytd above cycle_limit_per_year"
  - id: ERR_THROUGHPUT_LIMIT_EXCEEDED
    http: 409
    condition: "submitting the bid would push cumulative_throughput_mwh above warranty_throughput_limit_mwh"
  - id: ERR_SOC_INSUFFICIENT
    http: 422
    condition: "the requested reserved_mwh exceeds the asset's remaining headroom after the expiry sweep, overlap aggregation and CAPACITY preemption ladder"
  - id: ERR_DISPATCH_EXCEEDS_RESERVATION
    http: 422
    condition: "the instruction's expected_energy_mwh plus its live siblings' would exceed the reservation's reserved_mwh"

# =============================================================================
# 1.7 RBAC Matrix — segregation_of_duties
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Registers assets, drives the logical clock, and acts for the warranty provider when adjudicating claims. Deliberately cannot file the claims it adjudicates."
    identity: "opaque"
    exclusive_operations:
      - "POST /storage-assets"
      - "POST /_clock/set_current_utc"
      - "POST /warranty-claims/{id}/adjudicate"
    shared_operations:
      - "POST /storage-assets/{id}/commission (with AssetManager)"
      - "every GET"

  - name: AssetManager
    description: "Owns the asset's long-term health: commissioning, capacity testing programme, warranty claims and augmentation installation. May also reserve state of charge for maintenance windows."
    identity: "opaque"
    exclusive_operations:
      - "POST /capacity-tests"
      - "POST /warranty-claims"
      - "POST /warranty-claims/{id}/submit"
      - "POST /warranty-claims/{id}/install-remedy"
    shared_operations:
      - "POST /storage-assets/{id}/commission (with PlatformAdmin)"
      - "POST /soc-reservations and POST /soc-reservations/{id}/release (with MarketTrader)"
      - "POST /capacity-obligations (with MarketOperator)"
      - "every GET"

  - name: MarketTrader
    description: "Builds and manages market offers: reserves state of charge, drafts, submits, revises and withdraws bids."
    identity: "opaque"
    exclusive_operations:
      - "POST /market-bids"
      - "POST /market-bids/{id}/submit"
      - "POST /market-bids/{id}/revise"
      - "POST /market-bids/{id}/withdraw"
    shared_operations:
      - "POST /soc-reservations and POST /soc-reservations/{id}/release (with AssetManager)"
      - "every GET"

  - name: MarketOperator
    description: "Acts for the ISO: posts clearing results, issues dispatch instructions, settles performance scores and assesses capacity obligations."
    identity: "opaque"
    exclusive_operations:
      - "POST /market-bids/{id}/clearing-result"
      - "POST /dispatch-instructions"
      - "POST /dispatch-instructions/{id}/settle-score"
      - "POST /capacity-obligations/{id}/assess"
    shared_operations:
      - "POST /capacity-obligations (with AssetManager)"
      - "POST /capacity-obligations/{id}/unavailability (with ControlRoomOperator)"
      - "every GET"

  - name: ControlRoomOperator
    description: "Fleet-level control room: accepts dispatch instructions, aborts them, records unavailability and can raise a safety event."
    identity: "opaque"
    exclusive_operations:
      - "POST /dispatch-instructions/{id}/accept"
    shared_operations:
      - "POST /dispatch-instructions/{id}/fail (with SiteController)"
      - "POST /safety-events (with SafetyOfficer)"
      - "POST /capacity-obligations/{id}/unavailability (with MarketOperator)"
      - "every GET"

  - name: SiteController
    description: "The plant controller of ONE asset. X-User-ID is that StorageAsset's id, so every site action is ownership-checked against the asset it targets. Sole author of telemetry."
    identity: "entity_backed:StorageAsset"
    exclusive_operations:
      - "POST /telemetry-samples"
      - "POST /dispatch-instructions/{id}/execute"
      - "POST /dispatch-instructions/{id}/complete"
      - "POST /capacity-tests/{id}/start"
      - "POST /capacity-tests/{id}/complete"
    shared_operations:
      - "POST /dispatch-instructions/{id}/fail (with ControlRoomOperator)"
      - "every GET"

  - name: SafetyOfficer
    description: "Owns the safety lifecycle: reports events, records suppression discharge and closes events once emergency response has cleared the site. Cannot close an event it opened itself."
    identity: "opaque"
    exclusive_operations:
      - "POST /safety-events/{id}/discharge-suppression"
      - "POST /safety-events/{id}/close"
    shared_operations:
      - "POST /safety-events (with ControlRoomOperator)"
      - "every GET"
