            - call: "POST /ticket-tiers"
              payload: { show_id: "${wf_sh_id}", tier_name: "PIT", price_cents: 9500, allocation_qty: 400 }
              as: TalentBuyer
              captures: { wf_pit_id: $.data.id }
            - call: "POST /shows/${wf_sh_id}/on-sale"
              payload: {}
              as: TalentBuyer
            - call: "POST /ticket-tiers/${wf_ga_id}/sales"
              payload: { qty: 800 }
              as: TalentBuyer
            - call: "GET /shows/${wf_sh_id}"
              payload: {}
              as: TalentBuyer
              captures: { wf_v1: $.data.version }
            - call: "POST /ticket-tiers/${wf_ga_id}/price-adjustments"
              payload: { new_price_cents: 6000, expected_show_version: "${wf_v1}", reason: "Second leg on sale" }
              as: TalentBuyer
            - call: "POST /ticket-tiers/${wf_ga_id}/sales"
              payload: { qty: 600 }
              as: TalentBuyer
            - call: "POST /ticket-tiers/${wf_pit_id}/sales"
              payload: { qty: 400 }
              as: TalentBuyer
              captures: { wf_pit_gross: $.data.gross_sold_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-12T02:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /shows/${wf_sh_id}/perform"
              payload: {}
              as: TourAccountant
              captures: { wf_show_gross: $.data.gross_sold_cents, wf_show_tickets: $.data.paid_tickets_sold }
          trigger:
            - call: "POST /settlements"
              payload: { show_id: "${wf_sh_id}" }
              as: TourAccountant
              captures: { wf_st_id: $.data.id }
            - call: "POST /settlements/${wf_st_id}/calculate"
              payload: {}
              as: TourAccountant
              as_user_id: "u_wf_calc"
              captures: { wf_gross: $.data.gross_receipts_cents, wf_tax: $.data.ticket_tax_cents, wf_fac: $.data.facility_fee_cents, wf_card: $.data.credit_card_fee_cents, wf_adj: $.data.adjusted_gross_cents, wf_net: $.data.promoter_net_cents, wf_earn: $.data.artist_earnings_cents, wf_exp: $.data.total_settlement_expense_cents, wf_borne: $.data.promoter_borne_expense_cents, wf_vshare: $.data.venue_share_cents }
          assert:
            - "BUCKET 0 — ${wf_gross} == ${wf_show_gross} == 11400000 == 800*5000 + 600*6000 + 400*9500, over ${wf_show_tickets} == 1800 paid tickets (${wf_pit_gross} == 3800000)"
            - "BUCKET 1 TAKEN FIRST — ${wf_tax} == 912000 == ROUND_HALF_UP(11400000 * 8.00 / 100), computed on the FULL gross before anything else is removed"
            - "BUCKET 2 IS PER HEAD, NOT PERCENT — ${wf_fac} == 630000 == 350 * 1800; it scales with tickets, so an implementation that treated 350 as basis points or as a percentage cannot land here"
            - "BUCKET 3 IS THE ORDER TEST — ${wf_card} == 262200 == ROUND_HALF_UP((11400000 - 912000) * 2.5 / 100): post-tax, pre-facility. On the raw gross it would be 285000; after the facility fee too it would be 246450"
            - "REMAINDER — ${wf_adj} == 9595800 == 11400000 - 912000 - 630000 - 262200; the two wrong orders give 9573000 and 9611550 respectively"
            - "CONSERVATION — ${wf_tax} + ${wf_fac} + ${wf_card} + ${wf_adj} == 11400000 exactly, so no bucket double-counts and none is dropped"
            - "DOWNSTREAM — the un-invoiced line recognises nothing (${wf_exp} == 0 against a total_budgeted_expense_cents of 100000) and the RENTAL rental_fee is 0, so ${wf_borne} == 0 and ${wf_vshare} == 0; ${wf_earn} == 5000000 (flat guarantee, allowed_expense 0, coop 0) and ${wf_net} == 4595800 == 9595800 - 5000000; the closing identity 5000000 + 0 + 0 + 4595800 == 9595800 holds"

      - name: performance_index_weights_do_not_drift_across_rounding
        claim_type: weighted_scoring
        grounds:
          - "calculations.market_performance_index"
          - "calculations.market_performance_index.precision"
        excluded_because:
          difficulty_instance: market_performance_index_trailing_settled_versus_mark_to_market
          rationale: "The §1.8 instance is built precisely on this row's three sub-claims: it proves the per-show mark is rounded BEFORE summation (so rounding cannot drift into the ratio), that the denominator is a sum of projections rather than a re-weighting, and that selling one more ticket re-scores the index. It also names the two wrong weightings (46 from averaging per-show ratios, 26 from scaling the denominator as well). Any corner instance would need the same multi-show market and the same literals, so it would add no distinguishing pressure."

      - name: coop_constraint_chain_reaches_a_fixed_point
