# =============================================================================
# SCAFFOLD.yaml — task_3335_engineered_wood_products_distribution_builder_direct_supply
# Engineered Wood Products Distribution & Builder Direct Supply (Boise Cascade)
# §1.0–§1.7 only. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Engineered Wood Products Distribution & Builder Direct Supply (Boise Cascade): mill
  production of engineered joists, beams and panels with capacity allocation between
  internal distribution and open market sales, distribution branch inventory positioning
  by regional building activity and species preferences, builder direct programs with
  take-off services, delivery scheduling to jobsites and floor system design support,
  commodity price volatility with inventory valuation risk between purchase and sale,
  specialty product programs requiring design software and code report support, credit
  management for builder customers with lien rights and job-level exposure, delivery
  fleet operations with boom truck placement and jobsite access constraints

domain_name: ewp-builder-direct
api_prefix: "/"

complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: pricing engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 12
  state_machine_count: 7
  calculation_count: 8
  endpoint_count: 39
  error_code_count: 24
  role_count: 7

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FKs use canonical prefix)
# =============================================================================
entities:
  - name: MillCapacityWeek
    parent: null
    common_fields: true
    fields:
      - { name: mill_code, type: string, source: input, description: "Mill identifier code, e.g. MILL-ALX" }
      - { name: week_start_date, type: string, source: input, description: "ISO date (Monday) of the production week; unique per mill_code" }
      - { name: total_capacity_mbf, type: integer, source: input, description: "Total production capacity in thousand board feet" }
      - { name: internal_alloc_mbf, type: integer, source: input, description: "Capacity reserved for internal branch replenishment; set via allocate", default: 0 }
      - { name: market_alloc_mbf, type: integer, source: input, description: "Capacity reserved for open-market sales; set via allocate", default: 0 }
      - { name: committed_internal_mbf, type: integer, source: computed, description: "Sum of branch grants computed at close", default: 0 }
      - { name: committed_market_mbf, type: integer, source: computed, description: "Market allocation committed at close (== market_alloc_mbf)", default: 0 }
      - { name: internal_grants, type: array, source: computed, description: "Per-branch grants [{branch_id, granted_mbf}] ordered by grant order; empty until close", default: [] }
      - { name: fill_rate_pct, type: number, source: computed, description: "(committed_internal + committed_market) / total_capacity_mbf at close, 4 decimal places", default: 0 }
      - { name: week_status, type: enum, source: computed, description: "OPEN | CLOSED", default: "OPEN" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku_code, type: string, source: input, description: "Unique SKU code" }
      - { name: product_family, type: enum, source: input, description: "I_JOIST | LVL_BEAM | GLULAM_BEAM | STRUCTURAL_PANEL" }
      - { name: species, type: enum, source: input, description: "DOUGLAS_FIR | SOUTHERN_PINE | SPRUCE_PINE_FIR" }
      - { name: dimension_label, type: string, source: input, description: "Free-text dimension descriptor" }
      - { name: specialty_flag, type: boolean, source: input, description: "Specialty program product", default: false }
      - { name: requires_code_report, type: boolean, source: input, description: "Order confirm requires code_report_reference", default: false }
      - { name: requires_design_support, type: boolean, source: input, description: "Takeoff must include floor system design", default: false }
      - { name: index_premium_cents, type: integer, source: input, description: "Premium over commodity index, cents per mbf", default: 0 }

  - name: PriceIndexEntry
    parent: null
    common_fields: true
    fields:
      - { name: product_family, type: enum, source: input, description: "I_JOIST | LVL_BEAM | GLULAM_BEAM | STRUCTURAL_PANEL" }
      - { name: species, type: enum, source: input, description: "DOUGLAS_FIR | SOUTHERN_PINE | SPRUCE_PINE_FIR" }
      - { name: effective_week_start, type: string, source: input, description: "ISO date (Monday) the index price takes effect" }
      - { name: index_price_cents_per_mbf, type: integer, source: input, description: "Commodity index price, cents per mbf" }

  - name: Branch
    parent: null
    common_fields: true
    fields:
      - { name: branch_code, type: string, source: input, description: "Unique branch code" }
      - { name: region_code, type: string, source: input, description: "Region code, e.g. PNW" }
      - { name: species_preference, type: enum, source: input, description: "DOUGLAS_FIR | SOUTHERN_PINE | SPRUCE_PINE_FIR — regional species preference" }
      - { name: target_stock_mbf, type: integer, source: input, description: "Target on-hand stock level driving replenishment demand" }
      - { name: activity_score, type: integer, source: input, description: "Regional building activity score 0-100; drives allocation ranking" }
      - { name: replenishment_enabled, type: boolean, source: input, description: "Whether branch participates in internal allocation waterfall", default: true }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; receiving branch" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; stocked product" }
      - { name: qty_received_mbf, type: integer, source: input, description: "Quantity received, mbf" }
      - { name: unit_cost_cents_per_mbf, type: integer, source: input, description: "Acquisition cost basis, cents per mbf" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp at receipt; drives FIFO ordering" }
      - { name: qty_available_mbf, type: integer, source: computed, description: "qty_received - qty_reserved - qty_sold", default: 0 }
      - { name: qty_reserved_mbf, type: integer, source: computed, description: "Reserved by CONFIRMED/ON_HOLD orders", default: 0 }
      - { name: qty_sold_mbf, type: integer, source: computed, description: "Delivered quantity", default: 0 }
      - { name: lot_status, type: enum, source: computed, description: "ON_HAND | DEPLETED | SOLD_OUT; ON_HAND when qty_available>0; DEPLETED when qty_available==0 and qty_reserved>0; SOLD_OUT when qty_available==0 and qty_reserved==0 and qty_sold>0", default: "ON_HAND" }

  - name: Builder
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Builder legal name" }
      - { name: lien_rights_state_code, type: string, source: input, description: "Two-letter state code governing lien rights" }
      - { name: credit_status, type: enum, source: computed, description: "PROVISIONAL | ACTIVE | SUSPENDED | CLOSED", default: "PROVISIONAL" }
      - { name: credit_limit_cents, type: integer, source: computed, description: "Set by credit-review APPROVE", default: 0 }
      - { name: exposure_committed_cents, type: integer, source: computed, description: "Sum of order_total_cents over orders in CONFIRMED or ON_HOLD", default: 0 }
      - { name: exposure_settled_cents, type: integer, source: computed, description: "Sum of delivered_total_cents over DELIVERED orders", default: 0 }

  - name: BuilderJob
    parent: null
    common_fields: true
    fields:
      - { name: builder_id, type: string, source: input, description: "FK -> Builder.id; owning builder" }
      - { name: job_name, type: string, source: input, description: "Jobsite project name" }
      - { name: access_window_start, type: datetime, source: input, description: "Jobsite access window open (closed interval start)" }
      - { name: access_window_end, type: datetime, source: input, description: "Jobsite access window close (closed interval end)" }
      - { name: placement_difficulty, type: enum, source: input, description: "STANDARD | TIGHT_ACCESS | CRANE_ASSIST; drives delivery fee multiplier", default: "STANDARD" }
      - { name: job_exposure_cap_cents, type: integer, source: input, description: "Job-level exposure cap; confirm blocked when job committed + order total would exceed it (equal allowed)" }
      - { name: last_completed_delivery_date, type: string, source: computed, description: "ISO date of latest completed delivery across this job's orders; null until first completion", default: null }
      - { name: exposure_committed_cents, type: integer, source: computed, description: "Sum of order_total_cents over this job's CONFIRMED/ON_HOLD orders", default: 0 }
      - { name: exposure_settled_cents, type: integer, source: computed, description: "Sum of delivered_total_cents over this job's DELIVERED orders", default: 0 }

  - name: TakeoffRequest
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> BuilderJob.id; job the take-off serves" }
      - { name: plan_reference, type: string, source: input, description: "Plan set reference uploaded by builder" }
      - { name: includes_floor_system_design, type: boolean, source: input, description: "Whether floor system design support is requested" }
      - { name: takeoff_status, type: enum, source: computed, description: "SUBMITTED | QUOTED | REVISION_REQUESTED | ACCEPTED | EXPIRED", default: "SUBMITTED" }
      - { name: design_package_reference, type: string, source: computed, description: "Set on submit-design; null until first design submission", default: null }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Set on submit-design; null until first design submission", default: null }
      - { name: quoted_at, type: datetime, source: computed, description: "Logical-clock timestamp of latest submit-design; null until quoted", default: null }
      - { name: revision_count, type: integer, source: computed, description: "Increments by 1 on each revise transition", default: 0 }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> BuilderJob.id; destination job" }
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; fulfilling branch" }
      - { name: takeoff_request_id, type: string, source: computed, description: "FK -> TakeoffRequest.id; set when created via takeoff accept, null for direct orders", default: null }
      - { name: pricing_week_mode, type: enum, source: input, description: "LOCK_AT_ACCEPT | FLOAT_TO_SHIP; INDEX pricing week selection" }
      - { name: code_report_reference, type: string, source: input, description: "Code report reference required when any line product requires_code_report", default: null }
      - { name: lines, type: array, source: input, description: "Array of {product_id, qty_mbf, price_basis: FIXED|INDEX, fixed_unit_price_cents_per_mbf?}; FIXED requires fixed_unit_price_cents_per_mbf, INDEX ignores it" }
      - { name: order_status, type: enum, source: computed, description: "DRAFT | CONFIRMED | ON_HOLD | DELIVERED | CANCELLED", default: "DRAFT" }
      - { name: order_total_cents, type: integer, source: computed, description: "Sum of per-line rounded totals; for takeoff-accepted orders equals quoted_total_cents", default: 0 }
      - { name: delivered_total_cents, type: integer, source: computed, description: "Equals order_total_cents once DELIVERED, else 0", default: 0 }
      - { name: priced_week_start, type: string, source: computed, description: "Monday week-start of the INDEX pricing week used at confirm (LOCK_AT_ACCEPT) or at delivery completion (FLOAT_TO_SHIP); null until priced", default: null }

  - name: Delivery
    parent: null
    common_fields: true
    fields:
      - { name: sales_order_id, type: string, source: input, description: "FK -> SalesOrder.id; order being delivered" }
      - { name: boom_required, type: boolean, source: input, description: "Boom truck placement required" }
      - { name: window_start, type: datetime, source: input, description: "Requested delivery window start (half-open)" }
      - { name: window_end, type: datetime, source: input, description: "Requested delivery window end (half-open)" }
      - { name: delivery_status, type: enum, source: computed, description: "REQUESTED | SCHEDULED | COMPLETED | FAILED_ACCESS | CANCELLED", default: "REQUESTED" }
      - { name: truck_shift_id, type: string, source: computed, description: "FK -> TruckShift.id; assigned on schedule, null until scheduled", default: null }
      - { name: delivery_fee_cents, type: integer, source: computed, description: "Computed at schedule via delivery_fee calculation; null until scheduled", default: null }
      - { name: fail_count, type: integer, source: computed, description: "Increments by 1 on each FAILED_ACCESS transition", default: 0 }
      - { name: completed_at, type: datetime, source: computed, description: "Logical-clock timestamp at completion; null until COMPLETED", default: null }

  - name: TruckShift
    parent: null
    common_fields: true
    fields:
      - { name: fleet_code, type: string, source: input, description: "Fleet identifier code" }
      - { name: shift_date, type: string, source: input, description: "ISO date of the shift" }
      - { name: window_start, type: datetime, source: input, description: "Shift window start (half-open)" }
      - { name: window_end, type: datetime, source: input, description: "Shift window end (half-open)" }
      - { name: boom_capable, type: boolean, source: input, description: "Truck carries a boom" }
      - { name: max_drops, type: integer, source: input, description: "Maximum scheduled drops this shift", default: 4 }
      - { name: booked_drops, type: integer, source: computed, description: "Count of deliveries in SCHEDULED on this shift", default: 0 }
      - { name: shift_status, type: enum, source: computed, description: "OPEN | CLOSED; OPEN while logical clock < window_end, else CLOSED", default: "OPEN" }

  - name: LienFiling
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> BuilderJob.id; job the lien is filed against" }
      - { name: lien_status, type: enum, source: computed, description: "FILED | RELEASED | EXPIRED", default: "FILED" }
      - { name: amount_cents, type: integer, source: computed, description: "Job exposure_settled_cents at filing time", default: 0 }
      - { name: filed_at, type: datetime, source: computed, description: "Logical-clock timestamp at filing" }
      - { name: deadline_date, type: string, source: computed, description: "Job last_completed_delivery_date + 90 days; filing allowed on or before this date" }
      - { name: released_at, type: datetime, source: computed, description: "Logical-clock timestamp at release; null until RELEASED", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MillCapacityWeek
    field: week_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /capacity-weeks/{capacity_week_id}/close"
        actor: MillPlanner
        preconditions:
          - "week_status == OPEN"
        side_effects:
          - "Runs capacity_close_waterfall: internal grants computed, committed_internal_mbf and committed_market_mbf set, fill_rate_pct computed"
          - "increments MillCapacityWeek.version by 1"

  - entity: InventoryLot
    field: lot_status
    initial_state: ON_HAND
    terminal_states: [SOLD_OUT]
    transitions:
      - from: ON_HAND
        to: DEPLETED
        trigger: "system (order confirm reservation drives qty_available_mbf to 0 with qty_reserved_mbf > 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPLETED
        to: ON_HAND
        trigger: "system (order cancel or credit-suspension release restores qty_available_mbf > 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPLETED
        to: SOLD_OUT
        trigger: "system (delivery completion converts qty_reserved_mbf to qty_sold_mbf, leaving qty_available_mbf == 0 and qty_reserved_mbf == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_HAND
        to: SOLD_OUT
        trigger: "system (delivery completion sells remaining qty_available via reserved path leaving qty_available_mbf == 0 and qty_reserved_mbf == 0 and qty_sold_mbf > 0)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Builder
    field: credit_status
    initial_state: PROVISIONAL
    terminal_states: [CLOSED]
    transitions:
      - from: PROVISIONAL
        to: ACTIVE
        trigger: "POST /builders/{builder_id}/credit-review with decision=APPROVE"
        actor: CreditManager
        preconditions:
          - "credit_limit_cents present and > 0"
        side_effects:
          - "credit_limit_cents set"
          - "increments Builder.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /builders/{builder_id}/credit-review with decision=SUSPEND"
        actor: CreditManager
        preconditions: []
        side_effects:
          - "Every SalesOrder of this builder in CONFIRMED transitions to ON_HOLD"
          - "Each such order's reserved inventory is released: InventoryLot.qty_reserved_mbf decremented, qty_available_mbf incremented; lots in DEPLETED with restored availability return to ON_HAND"
          - "builder.exposure_committed_cents unchanged (ON_HOLD orders still count as committed)"
          - "increments Builder.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /builders/{builder_id}/credit-review with decision=APPROVE"
        actor: CreditManager
        preconditions:
          - "credit_limit_cents present and > 0"
        side_effects:
          - "credit_limit_cents updated"
          - "ON_HOLD orders are NOT auto-re-confirmed; they require an explicit confirm call"
          - "increments Builder.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /builders/{builder_id}/credit-review with decision=CLOSE"
        actor: CreditManager
        preconditions:
          - "No SalesOrder of this builder in CONFIRMED or ON_HOLD"
          - "exposure_settled_cents == 0"
        side_effects:
          - "increments Builder.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /builders/{builder_id}/credit-review with decision=CLOSE"
        actor: CreditManager
        preconditions:
          - "No SalesOrder of this builder in CONFIRMED or ON_HOLD"
          - "exposure_settled_cents == 0"
        side_effects:
          - "increments Builder.version by 1"

  - entity: TakeoffRequest
    field: takeoff_status
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: QUOTED
        trigger: "POST /takeoff-requests/{takeoff_id}/submit-design"
        actor: AccountManager
        preconditions:
          - "takeoff_status == SUBMITTED"
        side_effects:
          - "design_package_reference and quoted_total_cents set from input"
          - "quoted_at set to logical clock"
      - from: REVISION_REQUESTED
        to: QUOTED
        trigger: "POST /takeoff-requests/{takeoff_id}/submit-design"
        actor: AccountManager
        preconditions:
          - "takeoff_status == REVISION_REQUESTED"
        side_effects:
          - "design_package_reference and quoted_total_cents overwritten"
          - "quoted_at refreshed to logical clock"
      - from: QUOTED
        to: REVISION_REQUESTED
        trigger: "POST /takeoff-requests/{takeoff_id}/revise"
        actor: BuilderContact
        preconditions:
          - "takeoff_status == QUOTED"
          - "acting BuilderContact's X-User-ID == job.builder_id"
        side_effects:
          - "revision_count increments by 1"
      - from: QUOTED
        to: ACCEPTED
        trigger: "POST /takeoff-requests/{takeoff_id}/accept"
        actor: BuilderContact
        preconditions:
          - "takeoff_status == QUOTED"
          - "logical clock <= quoted_at + 14 days (ERR_QUOTE_EXPIRED otherwise)"
          - "job.builder credit_status == ACTIVE (ERR_BUILDER_CREDIT_SUSPENDED / ERR_BUILDER_NOT_CREDIT_ACTIVE otherwise)"
          - "acting BuilderContact's X-User-ID == job.builder_id"
        side_effects:
          - "Creates SalesOrder in DRAFT with job_id, takeoff_request_id, branch_id and pricing_week_mode from input, order_total_cents == quoted_total_cents, lines == []"
          - "increments Builder.version by 1"
      - from: QUOTED
        to: EXPIRED
        trigger: "system (logical clock > quoted_at + 14 days; evaluated when accept or revise is attempted)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SalesOrder
    field: order_status
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /sales-orders/{order_id}/confirm"
        actor: AccountManager
        preconditions:
          - "order_status == DRAFT or ON_HOLD"
          - "builder credit_status == ACTIVE"
          - "builder exposure_committed_cents + order_total_cents <= credit_limit_cents (equal allowed)"
          - "job exposure_committed_cents + order_total_cents <= job_exposure_cap_cents (equal allowed)"
          - "if any line product has requires_code_report == true, code_report_reference must be non-null"
          - "for every INDEX line, a PriceIndexEntry exists with matching product_family/species and effective_week_start <= pricing week (ERR_PRICE_INDEX_MISSING otherwise)"
          - "sufficient qty_available_mbf across lots of each line's product at the order's branch (ERR_INSUFFICIENT_INVENTORY otherwise)"
        side_effects:
          - "order_total_cents computed via order_line_pricing (LOCK_AT_ACCEPT pins priced_week_start to confirm week)"
          - "FIFO reservation per fifo_lot_reservation: lot qty_reserved_mbf += line qty, qty_available_mbf -= line qty; lot to DEPLETED when availability hits 0"
          - "builder.exposure_committed_cents += order_total_cents; job.exposure_committed_cents += order_total_cents"
          - "increments Builder.version by 1"
        note: "Reservation is atomic: any shortfall rejects the whole confirm with no partial reservation."
      - from: ON_HOLD
        to: CONFIRMED
        trigger: "POST /sales-orders/{order_id}/confirm"
        actor: AccountManager
        preconditions:
          - "same as DRAFT -> CONFIRMED"
        side_effects:
          - "same as DRAFT -> CONFIRMED (re-runs FIFO reservation and credit checks)"
      - from: CONFIRMED
        to: ON_HOLD
        trigger: "system (builder credit-review SUSPEND cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Reserved lots released: qty_reserved_mbf decremented, qty_available_mbf incremented; DEPLETED lots with restored availability return to ON_HAND"
      - from: CONFIRMED
        to: DELIVERED
        trigger: "system (order's delivery completes with outcome=COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "Reserved quantities converted: lot qty_reserved_mbf -= delivered qty, qty_sold_mbf += delivered qty; lot to SOLD_OUT when fully sold"
          - "FLOAT_TO_SHIP orders: priced_week_start pinned to delivery-completion week and order_total_cents recomputed via order_line_pricing before exposure accounting"
          - "delivered_total_cents = order_total_cents"
          - "job.exposure_committed_cents -= order_total_cents; job.exposure_settled_cents += delivered_total_cents; job.last_completed_delivery_date = completion date"
          - "builder.exposure_committed_cents -= order_total_cents; builder.exposure_settled_cents += delivered_total_cents"
          - "increments Builder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /sales-orders/{order_id}/cancel"
        actor: AccountManager
        preconditions:
          - "order_status in {DRAFT, CONFIRMED, ON_HOLD}"
        side_effects:
          - "increments Builder.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /sales-orders/{order_id}/cancel"
        actor: AccountManager
        preconditions:
          - "order_status in {DRAFT, CONFIRMED, ON_HOLD}"
        side_effects:
          - "Reserved lots released (qty_reserved_mbf -> qty_available_mbf; DEPLETED -> ON_HAND when availability restored)"
          - "builder.exposure_committed_cents -= order_total_cents; job.exposure_committed_cents -= order_total_cents"
          - "Non-terminal deliveries (REQUESTED, SCHEDULED) cascade to CANCELLED; SCHEDULED delivery's truck shift booked_drops decremented"
          - "increments Builder.version by 1"
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /sales-orders/{order_id}/cancel"
        actor: AccountManager
        preconditions:
          - "order_status in {DRAFT, CONFIRMED, ON_HOLD}"
        side_effects:
          - "builder.exposure_committed_cents -= order_total_cents; job.exposure_committed_cents -= order_total_cents"
          - "increments Builder.version by 1"

  - entity: Delivery
    field: delivery_status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /deliveries/{delivery_id}/schedule"
        actor: FleetCoordinator
        preconditions:
          - "delivery_status in {REQUESTED, FAILED_ACCESS}"
          - "order order_status == CONFIRMED (ERR_ORDER_NOT_DELIVERABLE otherwise)"
          - "truck shift shift_status == OPEN (ERR_TRUCK_SHIFT_CLOSED otherwise)"
          - "delivery window within shift window [shift.window_start, shift.window_end) (ERR_DELIVERY_WINDOW_OUTSIDE_SHIFT otherwise)"
          - "delivery window within job access window [access_window_start, access_window_end] closed containment, touching endpoints allowed (ERR_JOBSITE_ACCESS_WINDOW_VIOLATION otherwise)"
          - "no other SCHEDULED delivery on the same shift with window overlapping under the 45-minute buffer rule (ERR_TRUCK_SHIFT_OVERLAP otherwise)"
          - "if boom_required then shift.boom_capable must be true (ERR_BOOM_CAPABILITY_MISMATCH otherwise)"
          - "shift booked_drops < max_drops (ERR_SHIFT_DROP_LIMIT_REACHED otherwise)"
        side_effects:
          - "truck_shift_id set; delivery_fee_cents computed via delivery_fee"
          - "shift booked_drops += 1"
      - from: FAILED_ACCESS
        to: SCHEDULED
        trigger: "POST /deliveries/{delivery_id}/schedule"
        actor: FleetCoordinator
        preconditions:
          - "same as REQUESTED -> SCHEDULED"
        side_effects:
          - "same as REQUESTED -> SCHEDULED"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /deliveries/{delivery_id}/complete with outcome=COMPLETED"
        actor: FleetCoordinator
        preconditions:
          - "delivery_status == SCHEDULED"
        side_effects:
          - "completed_at set to logical clock; SalesOrder cascade to DELIVERED (see SalesOrder CONFIRMED -> DELIVERED)"
      - from: SCHEDULED
        to: FAILED_ACCESS
        trigger: "POST /deliveries/{delivery_id}/complete with outcome=FAILED_ACCESS"
        actor: FleetCoordinator
        preconditions:
          - "delivery_status == SCHEDULED"
        side_effects:
          - "fail_count += 1"
          - "truck shift booked_drops -= 1; truck_shift_id cleared to null"
      - from: REQUESTED
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "truck shift booked_drops -= 1"

  - entity: LienFiling
    field: lien_status
    initial_state: FILED
    terminal_states: [RELEASED, EXPIRED]
    transitions:
      - from: FILED
        to: RELEASED
        trigger: "POST /lien-filings/{lien_id}/release"
        actor: CreditManager
        preconditions:
          - "lien_status == FILED"
        side_effects:
          - "released_at set to logical clock"
      - from: FILED
        to: EXPIRED
        trigger: "system (job exposure_settled_cents reaches 0 while lien is FILED; evaluated on lien-filing reads and job mutations)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: order-create-stale-builder
    parent_entity: Builder
    write_endpoint: "POST /jobs/{job_id}/sales-orders"
    occ_field: "expected_builder_version"
    description: |
      Creating a SalesOrder against a Builder whose version has advanced since
      the client last observed it is rejected with ERR_STALE_VERSION. Order
      creation mutates the builder (exposure basis) and bumps Builder.version,
      so a writer holding an older observed version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: capacity-allocate-stale-week
    parent_entity: MillCapacityWeek
    write_endpoint: "POST /capacity-weeks/{capacity_week_id}/allocate"
    occ_field: "expected_capacity_week_version"
    description: |
      Adjusting the internal/market split on a MillCapacityWeek whose version
      has advanced since the client last observed it is rejected with
      ERR_STALE_VERSION. Each successful allocate bumps the week's version, so
      a writer holding an older observed version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: capacity_close_waterfall
    trigger: "POST /capacity-weeks/{capacity_week_id}/close"
    algorithm: waterfall_allocation
    formula: |
      candidate branches: replenishment_enabled == true, ranked by activity_score DESC,
        tie-break Branch.created_at ASC (never id)
      demand_mbf(branch) = max(0, branch.target_stock_mbf - on_hand_mbf(branch))
        where on_hand_mbf(branch) = sum of (qty_available_mbf + qty_reserved_mbf)
        over all InventoryLots at that branch
      pool = internal_alloc_mbf
      for each branch in ranked order:
        grant = min(demand_mbf(branch), pool)
        append {branch_id, granted_mbf: grant} to internal_grants
        pool -= grant
      committed_internal_mbf = internal_alloc_mbf - pool
      committed_market_mbf = market_alloc_mbf
      fill_rate_pct = (committed_internal_mbf + committed_market_mbf) / total_capacity_mbf
    input_set: "All Branches with replenishment_enabled == true; all InventoryLots at those branches"
    constants:
      TIEBREAK: "activity_score DESC, created_at ASC"
    precision: "fill_rate_pct 4 decimal places, round_half_up"

  - name: inventory_valuation
    trigger: "GET /branches/{branch_id}/valuation"
    algorithm: aggregation
    formula: |
      Base (FIFO): value = sum over lots at branch, ordered received_at ASC then created_at ASC,
        of qty_remaining_mbf * unit_cost_cents_per_mbf
        where qty_remaining_mbf = qty_available_mbf + qty_reserved_mbf (sold quantity excluded)
      Sales consume the oldest lot first (same order as fifo_lot_reservation).
    input_set: "All InventoryLots with branch_id == branch, excluding lots with qty_available_mbf + qty_reserved_mbf == 0"
    precision: "integer cents, no rounding"
    variants:
      - name: fifo
        when: "fifo_value_cents field of the valuation response"
        difference: "Each remaining lot valued at its own unit_cost_cents_per_mbf; oldest lots consumed first on sale"
      - name: weighted_average
        when: "weighted_avg_value_cents field of the valuation response"
        difference: "Pool average cost per mbf = sum(qty_received * unit_cost) / sum(qty_received) over all lots ever received at the branch; remaining value = pool_avg * total qty_remaining, rounded half-up to integer cents. Sales decrement the pool at the pool average, not the lot's own cost."

  - name: builder_exposure
    trigger: "GET /builders/{builder_id}/exposure and any order confirm/cancel/deliver cascade"
    algorithm: aggregation
    formula: |
      exposure_committed_cents = sum of order_total_cents over this builder's orders
        with order_status IN {CONFIRMED, ON_HOLD}
      exposure_settled_cents = sum of delivered_total_cents over this builder's orders
        with order_status == DELIVERED
      credit_headroom_cents = credit_limit_cents - exposure_committed_cents - exposure_settled_cents
    input_set: "All SalesOrders whose job.builder_id == builder"
    precision: "integer cents, no rounding"
    variants:
      - name: committed
        when: "exposure_committed_cents field; drives confirm-time credit check"
        difference: "Counts undelivered confirmed/held orders at their order_total_cents"
      - name: settled
        when: "exposure_settled_cents field; drives lien eligibility"
        difference: "Counts only DELIVERED orders at delivered_total_cents; identical input data yields a strictly smaller or equal figure whenever any order is undelivered"

  - name: order_line_pricing
    trigger: "SalesOrder confirm (all orders) and delivery completion (FLOAT_TO_SHIP re-price)"
    algorithm: tiered_pricing
    formula: |
      pricing_week_start = Monday of the week containing the confirm date (LOCK_AT_ACCEPT)
        or the delivery-completion date (FLOAT_TO_SHIP)
      for each line:
        if price_basis == FIXED: unit = line.fixed_unit_price_cents_per_mbf
        if price_basis == INDEX:
          select PriceIndexEntry with matching product_family and species,
            effective_week_start <= pricing_week_start; latest effective_week_start wins;
            ties on effective_week_start broken by latest created_at (later posting supersedes)
            (empty candidate set -> ERR_PRICE_INDEX_MISSING)
          unit = entry.index_price_cents_per_mbf + product.index_premium_cents
        discount_pct = 0 if qty_mbf < 50; 0.03 if 50 <= qty_mbf < 100; 0.05 if qty_mbf >= 100
        line_total_cents = round_half_up(qty_mbf * unit * (1 - discount_pct), 0)
      order_total_cents = sum(line_total_cents)   # round per line THEN sum; pinned order
    input_set: "Order lines; PriceIndexEntries for the line's family+species"
    constants:
      TIER1_QTY_MBF: 50
      TIER1_DISCOUNT: 0.03
      TIER2_QTY_MBF: 100
      TIER2_DISCOUNT: 0.05
    precision: "round per line to integer cents round_half_up, then sum; never sum-then-round"

  - name: delivery_fee
    trigger: "POST /deliveries/{delivery_id}/schedule (on success)"
    algorithm: aggregation
    formula: |
      multiplier = 1.0 if job.placement_difficulty == STANDARD
                   1.25 if TIGHT_ACCESS
                   1.5 if CRANE_ASSIST
      delivery_fee_cents = round_half_up(7501 * multiplier, 0)
                         + (boom_required ? round_half_up(4003 * multiplier, 0) : 0)
      # component-wise rounding THEN sum is pinned; computing
      # round_half_up((7501 + 4003) * multiplier, 0) is the forbidden order.
    input_set: "The delivery's order's job placement_difficulty; delivery.boom_required"
    constants:
      BASE_DELIVERY_FEE_CENTS: 7501
      BOOM_SURCHARGE_CENTS: 4003
      MULT_STANDARD: 1.0
      MULT_TIGHT_ACCESS: 1.25
      MULT_CRANE_ASSIST: 1.5
    precision: "round each component to integer cents round_half_up, then sum"

  - name: lien_deadline
    trigger: "LienFiling creation; deadline_date computed on every LienFiling"
    algorithm: chronological
    formula: |
      deadline_date = job.last_completed_delivery_date + 90 days
      Filing allowed iff:
        job.exposure_settled_cents > 0           (else ERR_LIEN_NO_OUTSTANDING_EXPOSURE)
        logical-clock date <= deadline_date      (filing ON the deadline day allowed; else ERR_LIEN_DEADLINE_PASSED)
        no other LienFiling on this job in FILED (else ERR_LIEN_ALREADY_ACTIVE)
      Evaluation order is pinned: outstanding-exposure check first, deadline second,
        duplicate-lien third.
    input_set: "The job and its existing LienFilings"
    constants:
      LIEN_WINDOW_DAYS: 90
    precision: "date arithmetic in whole days, UTC"

  - name: fifo_lot_reservation
    trigger: "SalesOrder confirm (per line)"
    algorithm: chronological
    formula: |
      candidate lots: branch_id == order.branch_id, product_id == line.product_id,
        qty_available_mbf > 0
      order: received_at ASC, tie-break created_at ASC (never id)
      walk candidates, reserving min(line_remaining, lot.qty_available_mbf) from each
      until line.qty_mbf satisfied; if total available < line.qty_mbf, reject the whole
      confirm with ERR_INSUFFICIENT_INVENTORY and reserve nothing (atomic).
    input_set: "InventoryLots at the order's branch for the line's product"
    constants:
      ORDER: "received_at ASC, created_at ASC"
    precision: "integer mbf"

  - name: quote_expiry
    trigger: "TakeoffRequest accept or revise attempt"
    algorithm: threshold
    formula: |
      expired iff logical_clock > quoted_at + 14 days
      at exactly quoted_at + 14 days the quote is still valid (strict >)
    input_set: "The TakeoffRequest"
    constants:
      QUOTE_VALID_DAYS: 14
    precision: "timestamp comparison, UTC"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles; entity_backed ownership (BuilderContact X-User-ID must equal the owning Builder.id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right; body-referenced ids (product_id, branch_id, truck_shift_id, lines[].product_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_constraint
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /jobs/{job_id}/sales-orders, POST /capacity-weeks/{capacity_week_id}/allocate"
  - priority: 5
    category: state
    check: "Target resource state permits the transition (order DRAFT/ON_HOLD for confirm, delivery REQUESTED/FAILED_ACCESS for schedule, lien FILED for release, week OPEN for allocate/close, etc.); terminal states reject everything"
    error_id: ERR_INVALID_STATE
    http_status: 400
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_temporal
    check: "Quote not expired (accept/revise); delivery window within shift window; delivery window closed-containment within job access window; 45-minute buffer between drops on a shift; lien filing on or before deadline_date"
    error_id: "ERR_QUOTE_EXPIRED | ERR_DELIVERY_WINDOW_OUTSIDE_SHIFT | ERR_JOBSITE_ACCESS_WINDOW_VIOLATION | ERR_TRUCK_SHIFT_OVERLAP | ERR_LIEN_DEADLINE_PASSED"
    http_status: 400
    applies_to: "accept, revise, schedule, lien-filing create"
  - priority: 7
    category: business_safety
    check: "Specialty compliance: any line product with requires_code_report == true demands non-null code_report_reference at confirm"
    error_id: ERR_CODE_REPORT_REQUIRED
    http_status: 400
    applies_to: "POST /sales-orders/{order_id}/confirm"
  - priority: 8
    category: business_constraint
    check: "Capacity and fleet constraints: internal_alloc + market_alloc <= total_capacity_mbf; INDEX lines require a matching index entry; boom_required requires boom_capable shift; booked_drops < max_drops; lien duplicate check; atomic inventory sufficiency"
    error_id: "ERR_CAPACITY_EXCEEDED | ERR_PRICE_INDEX_MISSING | ERR_BOOM_CAPABILITY_MISMATCH | ERR_SHIFT_DROP_LIMIT_REACHED | ERR_LIEN_ALREADY_ACTIVE | ERR_INSUFFICIENT_INVENTORY"
    http_status: 409
    applies_to: "allocate, confirm, schedule, lien-filing create"
  - priority: 9
    category: business_fiscal
    check: "Builder credit_status == ACTIVE for order create/confirm/takeoff-accept; committed + order_total <= credit_limit (equal allowed); job committed + order_total <= job_exposure_cap (equal allowed); lien filing requires settled exposure > 0"
    error_id: "ERR_BUILDER_CREDIT_SUSPENDED | ERR_BUILDER_NOT_CREDIT_ACTIVE | ERR_CREDIT_LIMIT_EXCEEDED | ERR_JOB_EXPOSURE_CAP_EXCEEDED | ERR_LIEN_NO_OUTSTANDING_EXPOSURE"
    http_status: 402
    applies_to: "order create, confirm, takeoff accept, lien-filing create"

# =============================================================================
# §1.5 API Endpoint Table (39 endpoints)
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Server startup default is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time; all timestamped system fields (received_at, quoted_at, filed_at, completed_at, released_at) read this clock."
    roles: [OpsAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  - method: POST
    path: "/capacity-weeks"
    description: "Create a mill production capacity week (week_status OPEN)"
    roles: [MillPlanner]
    code: 201
    input: [mill_code, week_start_date, total_capacity_mbf]
    output: MillCapacityWeek
    side_effects: []

  - method: POST
    path: "/capacity-weeks/{capacity_week_id}/allocate"
    description: "Set internal/market allocation split on an OPEN week (OCC on week version)"
    roles: [MillPlanner]
    code: 200
    input: [internal_alloc_mbf, market_alloc_mbf, expected_capacity_week_version]
    output: MillCapacityWeek
    side_effects: ["increments MillCapacityWeek.version by 1"]

  - method: POST
    path: "/capacity-weeks/{capacity_week_id}/close"
    description: "Close the week: run capacity_close_waterfall, set committed fields and fill_rate_pct"
    roles: [MillPlanner]
    code: 200
    input: []
    output: MillCapacityWeek
    side_effects: ["week_status -> CLOSED", "runs capacity_close_waterfall", "increments MillCapacityWeek.version by 1"]

  - method: POST
    path: "/products"
    description: "Create a product SKU"
    roles: [OpsAdmin]
    code: 201
    input: [sku_code, product_family, species, dimension_label, "specialty_flag?", "requires_code_report?", "requires_design_support?", "index_premium_cents?"]
    output: Product
    side_effects: []

  - method: POST
    path: "/price-index-entries"
    description: "Post a commodity price index entry for a family+species"
    roles: [OpsAdmin]
    code: 201
    input: [product_family, species, effective_week_start, index_price_cents_per_mbf]
    output: PriceIndexEntry
    side_effects: []

  - method: POST
    path: "/branches"
    description: "Create a distribution branch"
    roles: [OpsAdmin]
    code: 201
