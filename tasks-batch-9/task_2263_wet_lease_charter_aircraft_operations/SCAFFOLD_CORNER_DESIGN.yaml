          - errors.ERR_OPERATIONAL_CONTROL_MISMATCH
          - entities.LeaseAgreement.fields.operational_control
          - endpoints[POST /wetlease/leases]
        distinguishing_aspect: |
          This is the regulatory heart of an ACMI arrangement: if the lessor supplies both crew and
          maintenance, operational control CANNOT sit with the lessee, so the combination
          (crew LESSOR, maintenance LESSOR, operational_control LESSEE) is refused at creation with
          422 - not deferred to submission - while the identical payload with operational_control
          LESSOR is accepted. LESSEE is a declared enum member, so this must NOT be reported as a
          400 enum failure.
          
