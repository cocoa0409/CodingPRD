            - "GET /test-events?student_id=${s}&limit=10&offset=0 returns total_count == 2 - both events belong to the student regardless of the link"
            - "GET /enrollments/${e} reports data.posted_hours == 40.00 and data.post_test_eligible == true - the link was accepted only because the ledger justified the POST_TEST"

      - name: proctor_assignment_is_conditional_on_current_certification
        claim_type: conditional_action
        grounds:
          - endpoints[POST /exam-sessions/{sessionId}/proctor-assignment]
          - validations[priority=50]
          - errors[ERR_PROCTOR_NOT_CERTIFIED]
        distinguishing_aspect: |
          The assignment endpoint is only permitted when the proctor is currently certified, so the same
          call is rejected and then accepted with nothing changing but the proctor's certification state.
          The instance also pins the side effect that the condition guards: only the accepted assignment
          moves the session DRAFT -> SCHEDULED and bumps its version, so a rejected assignment must leave
          a session that still cannot take registrations.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. A FULL_AUTHORIZED center with a room and a DRAFT MATH session on 2026-08-25."
            - "One proctor left in the initial PENDING certification state."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Conditional Assignment Center", state_code: "ME" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /testing-centers/${c}/rooms"
              payload: { room_code: "COND-1", seat_capacity: 10 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { r: $.data.id }
            - call: "POST /testing-centers/${c}/proctors"
              payload: { full_name: "Ruth Nakamura" }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { p: $.data.id }
            - call: "GET /proctors/${p}"
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { cert_before: $.data.certification_status }
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "MATH", starts_at: "2026-08-25T09:00:00Z", ends_at: "2026-08-25T11:00:00Z", requested_seats: 6 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sess: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /exam-sessions/${sess}/proctor-assignment"
              payload: { proctor_id: "${p}" }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { e1: $.data.error_id }
            - call: "POST /proctors/${p}/certification-decision"
              payload: { decision: "CERTIFY", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: StateAuthority
            - call: "POST /exam-sessions/${sess}/proctor-assignment"
              payload: { proctor_id: "${p}" }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { v1: $.data.version }
          assert:
            - "the proctor was created with data.certification_status == 'PENDING'"
            - "the first assignment returns 409 with data.error_id == 'ERR_PROCTOR_NOT_CERTIFIED'"
            - "after the rejection GET /exam-sessions/${sess} reports data.status == 'DRAFT', data.proctor_id == null and data.version == ${v0} - the failed action had no partial effect"
            - "the second assignment returns 200 with data.proctor_id == '${p}', data.status == 'SCHEDULED' and data.version == ${v0} + 1"

  - section: errors
    instances:
      - name: every_path_scoped_entity_id_is_not_found_when_unknown
        claim_type: error_triggerable
        grounds:
          - validations[priority=3]
          - errors[ERR_TESTING_ROOM_NOT_FOUND]
          - errors[ERR_PROCTOR_NOT_FOUND]
          - errors[ERR_ATTENDANCE_ENTRY_NOT_FOUND]
          - errors[ERR_TEST_EVENT_NOT_FOUND]
          - errors[ERR_EXAM_SESSION_NOT_FOUND]
          - errors[ERR_EXAM_REGISTRATION_NOT_FOUND]
          - errors[ERR_ACCOMMODATION_REQUEST_NOT_FOUND]
          - errors[ERR_OUTCOME_RECORD_NOT_FOUND]
          - errors[ERR_CREDENTIAL_NOT_FOUND]
          - errors[ERR_TRANSCRIPT_ORDER_NOT_FOUND]
          - errors[ERR_FUNDING_PERIOD_NOT_FOUND]
        distinguishing_aspect: |
          Eleven distinct NOT_FOUND codes exist because the catalog is per entity, not one generic 404:
          each path segment must resolve its own entity type and return its own code. The sweep uses an
          empty database and a single unknown identifier reused across all eleven reads, so an
          implementation that shares one handler cannot pass - every response must name the entity the
          path addressed. All reads use opaque roles so priority 3 is reached without any scope check
          (priority 4) intervening.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no entities of any kind created."
          setup_api_calls:
            - call: "GET /_clock/current_utc"
              as: StateAuthority
          trigger:
            - call: "GET /testing-rooms/00000000-0000-0000-0000-0000000000ff"
              as: StateAuthority
              captures: { e1: $.data.error_id }
            - call: "GET /proctors/00000000-0000-0000-0000-0000000000ff"
              as: StateAuthority
              captures: { e2: $.data.error_id }
            - call: "GET /attendance-entries/00000000-0000-0000-0000-0000000000ff"
              as: StateAuthority
              captures: { e3: $.data.error_id }
            - call: "GET /test-events/00000000-0000-0000-0000-0000000000ff"
              as: StateAuthority
              captures: { e4: $.data.error_id }
            - call: "GET /exam-sessions/00000000-0000-0000-0000-0000000000ff"
              as: StateAuthority
              captures: { e5: $.data.error_id }
            - call: "GET /exam-registrations/00000000-0000-0000-0000-0000000000ff"
              as: StateAuthority
              captures: { e6: $.data.error_id }
            - call: "GET /accommodation-requests/00000000-0000-0000-0000-0000000000ff"
              as: StateAuthority
              captures: { e7: $.data.error_id }
            - call: "GET /outcome-records/00000000-0000-0000-0000-0000000000ff"
              as: StateAuthority
              captures: { e8: $.data.error_id }
            - call: "GET /credentials/00000000-0000-0000-0000-0000000000ff"
              as: StateAuthority
              captures: { e9: $.data.error_id }
            - call: "GET /transcript-orders/00000000-0000-0000-0000-0000000000ff"
              as: StateAuthority
              captures: { e10: $.data.error_id }
            - call: "GET /funding-periods/00000000-0000-0000-0000-0000000000ff"
              as: StateAuthority
              captures: { e11: $.data.error_id }
          assert:
            - "the logical clock reads 2026-08-01T00:00:00Z at startup"
            - "every one of the eleven reads returns 404"
            - "the codes are, in order, ERR_TESTING_ROOM_NOT_FOUND, ERR_PROCTOR_NOT_FOUND, ERR_ATTENDANCE_ENTRY_NOT_FOUND, ERR_TEST_EVENT_NOT_FOUND, ERR_EXAM_SESSION_NOT_FOUND, ERR_EXAM_REGISTRATION_NOT_FOUND, ERR_ACCOMMODATION_REQUEST_NOT_FOUND, ERR_OUTCOME_RECORD_NOT_FOUND, ERR_CREDENTIAL_NOT_FOUND, ERR_TRANSCRIPT_ORDER_NOT_FOUND and ERR_FUNDING_PERIOD_NOT_FOUND - no generic 404 is acceptable"

      - name: pagination_bounds_outside_the_declared_range_are_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_PAGINATION]
          - pagination
        distinguishing_aspect: |
          The declared window is limit 1..100 and offset >= 0, so the interesting values are the ones just
          outside each edge: limit 0 and limit 101 fail while limit 1 and limit 100 pass, and offset -1
          fails while offset 0 and an offset past the end pass with an empty page. An offset beyond
          total_count is explicitly not an error - it is an empty window with has_more false.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; two students intaken so the collection is non-empty."
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Ana Bell", email: "ana.bell@example.org", primary_track: "ABE_LITERACY" }
              as: ProgramCoordinator
              captures: { s1: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Ben Cole", email: "ben.cole@example.org", primary_track: "ABE_LITERACY" }
              as: ProgramCoordinator
              captures: { s2: $.data.id }
          trigger:
            - call: "GET /students?limit=0&offset=0"
              as: Registrar
              captures: { e1: $.data.error_id }
            - call: "GET /students?limit=101&offset=0"
              as: Registrar
              captures: { e2: $.data.error_id }
            - call: "GET /students?limit=10&offset=-1"
              as: Registrar
              captures: { e3: $.data.error_id }
            - call: "GET /students?limit=1&offset=0"
              as: Registrar
              captures: { first_page: "$.data[0].id" }
            - call: "GET /students?limit=100&offset=0"
              as: Registrar
              captures: { wide_page: "$.data[0].id" }
            - call: "GET /students?limit=10&offset=5"
              as: Registrar
            - call: "GET /students"
              as: Registrar
          assert:
            - "limit=0 returns 400 with data.error_id == 'ERR_INVALID_PAGINATION'"
            - "limit=101 returns 400 with data.error_id == 'ERR_INVALID_PAGINATION'"
            - "offset=-1 returns 400 with data.error_id == 'ERR_INVALID_PAGINATION'"
            - "limit=1&offset=0 returns 200 with one row, total_count == 2 and has_more == true - limit 1 is inside the range"
            - "limit=100&offset=0 returns 200 with two rows, total_count == 2 and has_more == false - limit 100 is inside the range"
            - "limit=10&offset=5 returns 200 with an empty data array, total_count == 2 and has_more == false - an offset past the end is not an error"
            - "omitting both parameters returns 200 with the declared defaults applied: at most 10 rows from offset 0, total_count == 2, has_more == false"

      - name: the_logical_clock_must_not_move_backward
        claim_type: error_triggerable
        grounds:
          - validations[priority=7]
          - errors[ERR_CLOCK_BACKWARD]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          The clock is forward-only with an inclusive equality allowance: re-setting it to the instant it
          already holds is accepted (nothing moved backward), one second earlier is rejected, and the
          rejection must not leave the clock partially advanced. Because every temporal rule in the domain
          reads this clock, a silently accepted backward jump would let already-elapsed windows reopen -
          the instance therefore also proves the clock is unchanged after the rejection.
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /_clock/current_utc"
              as: Registrar
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: Registrar
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T11:59:59Z" }
              as: StateAuthority
              captures: { e1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: StateAuthority
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:01Z" }
              as: Instructor
            - call: "GET /_clock/current_utc"
              as: Proctor
          assert:
            - "the startup clock reads 2026-08-01T00:00:00Z and the forward set to 2026-08-20T12:00:00Z is accepted"
            - "one second earlier returns 422 with data.error_id == 'ERR_CLOCK_BACKWARD'"
            - "re-setting to the identical instant returns 200 - the rule is 'not earlier than', so equality is allowed"
            - "one second later returns 200 with data.current_utc == '2026-08-20T12:00:01Z'"
            - "the final read reports data.current_utc == '2026-08-20T12:00:01Z' - the rejected call left no trace"

  - section: rbac
    instances:
      - name: opaque_roles_cannot_perform_another_roles_exclusive_operations
        claim_type: denied_operation
        grounds:
          - roles[StateAuthority.exclusive_operations]
          - roles[ProgramCoordinator.exclusive_operations]
          - roles[Instructor.exclusive_operations]
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Segregation-of-duties role models fail most often by leaking one exclusive operation to a
          neighbouring role that legitimately holds many shared operations on the same entity. Each denial
          below is chosen so the acting role can already do something adjacent: the coordinator may intake
          students yet may not create centers or issue credentials, the registrar may schedule test events
          yet may not score them, and the instructor may post attendance yet may not create the section
          the attendance belongs to. Priority 2 must therefore key on the endpoint, not on the entity.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one student and one scheduled PRE_TEST so the score endpoint has a real target."
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Cleo Barnes", email: "cleo.barnes@example.org", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "POST /students/${s}/orientation-completion"
              payload: {}
              as: Registrar
            - call: "POST /test-events"
              payload: { student_id: "${s}", purpose: "PRE_TEST", test_form: "CASAS_R_900", scheduled_for: "2026-08-02T09:00:00Z" }
              as: Registrar
              captures: { te: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T09:00:00Z" }
              as: Registrar
          trigger:
            - call: "POST /testing-centers"
              payload: { name: "Coordinator Center", state_code: "IA" }
              as: ProgramCoordinator
              captures: { e1: $.data.error_id }
            - call: "POST /funding-periods"
              payload: { label: "FY27-X", start_date: "2026-08-01", end_date: "2026-12-01", rate_cents_per_weight: 9000, total_cents: 200000 }
              as: Registrar
              captures: { e2: $.data.error_id }
            - call: "POST /credentials"
              payload: { student_id: "${s}" }
              as: ProgramCoordinator
              captures: { e3: $.data.error_id }
            - call: "POST /class-sections"
              payload: { program_track: "HSE_PREP", title: "Instructor Section", instructor_user_id: "instructor-40", min_efl_level: 1, max_efl_level: 6, seats_total: 10, weekly_hours: 6.00 }
              as: Instructor
              captures: { e4: $.data.error_id }
            - call: "POST /test-events/${te}/score"
              payload: { scale_score: 205 }
              as: Registrar
              captures: { e5: $.data.error_id }
            - call: "POST /test-events/${te}/score"
              payload: { scale_score: 205 }
              as: Instructor
              captures: { scored: $.data.status }
          assert:
            - "ProgramCoordinator creating a testing center returns 403 with data.error_id == 'ERR_UNAUTHORIZED'"
            - "Registrar creating a funding period returns 403 with data.error_id == 'ERR_UNAUTHORIZED'"
            - "ProgramCoordinator issuing a credential returns 403 with data.error_id == 'ERR_UNAUTHORIZED' even though the same role may record and certify outcome measures"
            - "Instructor creating a class section returns 403 with data.error_id == 'ERR_UNAUTHORIZED' even though the same role posts attendance against sections"
            - "Registrar scoring the test event returns 403 with data.error_id == 'ERR_UNAUTHORIZED' even though the Registrar scheduled that very event"
            - "the Instructor scoring the same event returns 200 with data.status == 'SCORED' - the denial was about the role, not the event"
            - "GET /testing-centers?limit=10&offset=0 returns total_count == 0 and GET /class-sections?limit=10&offset=0 returns total_count == 0 - no denied write left a partial record"

      - name: center_administrator_cannot_act_outside_its_own_center
        claim_type: denied_operation
        grounds:
          - roles[CenterAdministrator]
          - validations[priority=4]
          - errors[ERR_FORBIDDEN_SCOPE]
        distinguishing_aspect: |
          CenterAdministrator is entity_backed, so authorization has two independent layers: the role is
          allowed on the endpoint (priority 2 passes) but the acting X-User-ID must own the addressed
          center - directly for a nested path, and transitively for a room or session that merely belongs
          to it. The instance exercises both the direct form (a room created under another center) and the
          transitive form (a session created in another center's room), then shows the rightful
          administrator succeeding on exactly the same calls.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; two FULL_AUTHORIZED centers, each with its own administrator identity."
            - "Center one already owns one room."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Scope Center One", state_code: "KS" }
              as: StateAuthority
              captures: { c1: $.data.id }
            - call: "POST /testing-centers"
              payload: { name: "Scope Center Two", state_code: "KS" }
              as: StateAuthority
              captures: { c2: $.data.id }
            - call: "POST /testing-centers/${c1}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /testing-centers/${c2}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /testing-centers/${c1}/rooms"
              payload: { room_code: "ONE-1", seat_capacity: 10 }
              as: CenterAdministrator
              as_user_id: "${c1}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /testing-centers/${c1}/rooms"
              payload: { room_code: "INTRUDER-1", seat_capacity: 10 }
              as: CenterAdministrator
              as_user_id: "${c2}"
              captures: { e1: $.data.error_id }
            - call: "POST /testing-centers/${c1}/proctors"
              payload: { full_name: "Intruder Proctor" }
              as: CenterAdministrator
              as_user_id: "${c2}"
              captures: { e2: $.data.error_id }
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r1}", subtest: "MATH", starts_at: "2026-08-25T09:00:00Z", ends_at: "2026-08-25T11:00:00Z", requested_seats: 5 }
              as: CenterAdministrator
              as_user_id: "${c2}"
              captures: { e3: $.data.error_id }
            - call: "POST /testing-rooms/${r1}/out-of-service"
              payload: { service_note: "not my room" }
              as: CenterAdministrator
              as_user_id: "${c2}"
              captures: { e4: $.data.error_id }
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r1}", subtest: "MATH", starts_at: "2026-08-25T09:00:00Z", ends_at: "2026-08-25T11:00:00Z", requested_seats: 5 }
              as: CenterAdministrator
              as_user_id: "${c1}"
              captures: { sess: $.data.id }
          assert:
            - "the nested room creation under the other center returns 403 with data.error_id == 'ERR_FORBIDDEN_SCOPE'"
            - "the nested proctor creation under the other center returns 403 with data.error_id == 'ERR_FORBIDDEN_SCOPE'"
            - "the session in the other center's room returns 403 with data.error_id == 'ERR_FORBIDDEN_SCOPE' - scope is derived transitively through TestingRoom.testing_center_id, not just from the path"
            - "taking the other center's room out of service returns 403 with data.error_id == 'ERR_FORBIDDEN_SCOPE'"
            - "the identical session call from the owning administrator returns 201 with data.status == 'DRAFT'"
            - "GET /testing-rooms?testing_center_id=${c1}&limit=10&offset=0 returns total_count == 1 and GET /proctors?testing_center_id=${c1}&limit=10&offset=0 returns total_count == 0"
            - "GET /testing-rooms/${r1} reports data.status == 'ACTIVE' - the denied out-of-service call did not retire the room"

      - name: student_cannot_read_another_students_records
        claim_type: denied_operation
        grounds:
          - roles[Student]
          - validations[priority=4]
          - errors[ERR_FORBIDDEN_SCOPE]
        distinguishing_aspect: |
          The Student role has read access to student-owned resources, so the only thing separating a
          legitimate read from a privacy breach is the X-User-ID. The instance pairs a direct path check
          (another student's record) with an ownership check that must be resolved through the resource's
          student_id (another student's accommodation request), and contrasts both with the same reads
          performed by the owner. It also shows the opaque Registrar reading both freely, so the scope rule
          is proven to be role-conditional rather than a blanket restriction.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; two intaken students, the first with one SUBMITTED accommodation request."
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Dara Quinn", email: "dara.quinn@example.org", primary_track: "ESL_ACQUISITION" }
              as: ProgramCoordinator
              captures: { sa: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Elan Reyes", email: "elan.reyes@example.org", primary_track: "ESL_ACQUISITION" }
              as: ProgramCoordinator
              captures: { sb: $.data.id }
            - call: "POST /accommodation-requests"
              payload: { student_id: "${sa}", requested_format: "LARGE_PRINT", documentation_ref: "doc-dara-1" }
              as: Registrar
              captures: { ar: $.data.id }
          trigger:
            - call: "GET /students/${sa}"
              as: Student
              as_user_id: "${sb}"
              captures: { e1: $.data.error_id }
            - call: "GET /accommodation-requests/${ar}"
              as: Student
              as_user_id: "${sb}"
              captures: { e2: $.data.error_id }
            - call: "GET /students/${sa}"
              as: Student
              as_user_id: "${sa}"
              captures: { own: $.data.id }
            - call: "GET /accommodation-requests/${ar}"
              as: Student
              as_user_id: "${sa}"
              captures: { own_ar: $.data.id }
            - call: "GET /accommodation-requests/${ar}"
              as: Registrar
              captures: { staff_ar: $.data.id }
          assert:
            - "the cross-student profile read returns 403 with data.error_id == 'ERR_FORBIDDEN_SCOPE'"
            - "the cross-student accommodation read returns 403 with data.error_id == 'ERR_FORBIDDEN_SCOPE' - ownership is resolved through AccommodationRequest.student_id"
            - "the owner's own profile read returns 200 with data.id == '${sa}'"
            - "the owner's own accommodation read returns 200 with data.id == '${ar}' and data.status == 'SUBMITTED'"
            - "the opaque Registrar reads the same request successfully - the scope rule applies to entity_backed roles only"

      - name: proctor_cannot_verify_identity_on_another_proctors_session
        claim_type: denied_operation
        grounds:
          - roles[Proctor]
          - validations[priority=4]
          - validations[priority=50]
          - errors[ERR_FORBIDDEN_SCOPE]
        distinguishing_aspect: |
          Both proctors are CERTIFIED and both work for the same authorized center, so certification
          (priority 50) and center authorization (priority 40) are satisfied for either of them - the only
          discriminator left is that Proctor scope is resolved two hops away, through the registration to
          its ExamSession.proctor_id. An implementation that scopes proctors by employing center instead of
          by session assignment passes every other check and fails only here.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. One FULL_AUTHORIZED center, one room, two CERTIFIED proctors."
            - "A MATH session on 2026-08-25 with the first proctor assigned, and one PLACED self-paying student registered on it."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Two Proctor Center", state_code: "ND" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /testing-centers/${c}/rooms"
              payload: { room_code: "TWOP-1", seat_capacity: 10 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { r: $.data.id }
            - call: "POST /testing-centers/${c}/proctors"
              payload: { full_name: "Pia One" }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { p1: $.data.id }
            - call: "POST /testing-centers/${c}/proctors"
              payload: { full_name: "Pat Two" }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { p2: $.data.id }
            - call: "POST /proctors/${p1}/certification-decision"
              payload: { decision: "CERTIFY", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: StateAuthority
            - call: "POST /proctors/${p2}/certification-decision"
              payload: { decision: "CERTIFY", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: StateAuthority
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "MATH", starts_at: "2026-08-25T09:00:00Z", ends_at: "2026-08-25T11:00:00Z", requested_seats: 5 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sess: $.data.id }
            - call: "POST /exam-sessions/${sess}/proctor-assignment"
              payload: { proctor_id: "${p1}" }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sv: $.data.version }
            - call: "POST /students"
              payload: { full_name: "Yara Cruz", email: "yara.cruz@example.org", primary_track: "HSE_PREP", self_pay_authorized: true }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "POST /students/${s}/orientation-completion"
              payload: {}
              as: Registrar
            - call: "POST /test-events"
              payload: { student_id: "${s}", purpose: "PRE_TEST", test_form: "CASAS_M_900", scheduled_for: "2026-08-02T09:00:00Z" }
              as: Registrar
              captures: { te: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T09:00:00Z" }
              as: Registrar
            - call: "POST /test-events/${te}/score"
              payload: { scale_score: 227 }
              as: Instructor
            - call: "POST /exam-registrations"
              payload: { student_id: "${s}", exam_session_id: "${sess}", expected_exam_session_version: "${sv}" }
              as: Registrar
              captures: { reg: $.data.id }
          trigger:
            - call: "POST /exam-registrations/${reg}/identity-verification"
              payload: { decision: "VERIFIED", identity_document_type: "STATE_ID" }
              as: Proctor
              as_user_id: "${p2}"
              captures: { e1: $.data.error_id }
            - call: "POST /exam-registrations/${reg}/identity-verification"
              payload: { decision: "VERIFIED", identity_document_type: "STATE_ID" }
              as: Proctor
              as_user_id: "${p1}"
              captures: { verified: $.data.identity_status }
          assert:
            - "the unassigned proctor's verification returns 403 with data.error_id == 'ERR_FORBIDDEN_SCOPE' even though that proctor is CERTIFIED at the same authorized center"
            - "GET /exam-registrations/${reg} immediately after the denial reports data.identity_status == 'UNVERIFIED' and data.identity_verified_by_proctor_id == null"
            - "the assigned proctor's identical call returns 200 with data.identity_status == 'VERIFIED' and data.identity_verified_by_proctor_id == '${p1}'"

      - name: the_same_user_must_not_record_and_certify_one_outcome
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile[role_model=segregation_of_duties]
          - validations[priority=52]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          The rule compares X-User-ID values, not roles: ProgramCoordinator and StateAuthority both hold
          "certify or reject outcome records" as a shared operation, so the same human acting under an
          allowed role is the exact hazard. The instance therefore denies the recorder's own certification
          AND the recorder's own rejection, then lets a different user id certify - proving the check is
          per-record (recorded_by_user_id) rather than a global role separation.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. An OPEN funding period and one intaken student."
            - "One EMPLOYMENT_Q2 outcome recorded by X-User-ID 'coord-7'."
          setup_api_calls:
            - call: "POST /funding-periods"
              payload: { label: "FY27-SOD", start_date: "2026-08-01", end_date: "2026-12-01", rate_cents_per_weight: 10000, total_cents: 100000 }
              as: StateAuthority
              as_user_id: "state-9"
              captures: { fp: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Gus Halden", email: "gus.halden@example.org", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              as_user_id: "coord-7"
              captures: { s: $.data.id }
            - call: "POST /outcome-records"
              payload: { student_id: "${s}", funding_period_id: "${fp}", measure_type: "EMPLOYMENT_Q2", evidence_ref: "ev-gus-q2" }
              as: ProgramCoordinator
              as_user_id: "coord-7"
              captures: { o: $.data.id, recorder: $.data.recorded_by_user_id }
          trigger:
            - call: "POST /outcome-records/${o}/certification"
              payload: { decision: "CERTIFY" }
              as: ProgramCoordinator
              as_user_id: "coord-7"
              captures: { e1: $.data.error_id }
            - call: "POST /outcome-records/${o}/certification"
              payload: { decision: "REJECT" }
              as: ProgramCoordinator
              as_user_id: "coord-7"
              captures: { e2: $.data.error_id }
            - call: "POST /outcome-records/${o}/certification"
              payload: { decision: "CERTIFY" }
              as: ProgramCoordinator
              as_user_id: "coord-8"
              captures: { certifier: $.data.certified_by_user_id }
          assert:
            - "the outcome stored data.recorded_by_user_id == 'coord-7' from the X-User-ID header"
            - "the recorder certifying returns 403 with data.error_id == 'ERR_SEGREGATION_OF_DUTIES'"
            - "the recorder rejecting also returns 403 with data.error_id == 'ERR_SEGREGATION_OF_DUTIES' - both decisions are second-person operations"
            - "a different user id under the same role returns 200 with data.status == 'CERTIFIED' and data.certified_by_user_id == 'coord-8' - the rule is per-record, not per-role"

      - name: requests_missing_auth_headers_are_unauthenticated_before_any_other_check
        claim_type: denied_operation
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Priority 1 must run before role membership (2), path existence (3) and payload shape (5), so the
          probes deliberately stack additional defects on top of the missing X-User-ID: an unknown path id,
          a role that the endpoint does not list, and a malformed body. All three must still answer 401,
          which is only possible if authentication is resolved first. An implementation that validates the
          body first would answer 400 on the third probe.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; nothing else required - the probes never reach domain logic."
          setup_api_calls:
            - call: "GET /_clock/current_utc"
              as: StateAuthority
          trigger:
            - call: "GET /students/00000000-0000-0000-0000-0000000000ff"
              as: Registrar
              as_user_id: ""
              captures: { e1: $.data.error_id }
            - call: "POST /students"
              payload: { full_name: "Ghost User", email: "ghost@example.org", primary_track: "HSE_PREP" }
              as: Instructor
              as_user_id: ""
              captures: { e2: $.data.error_id }
            - call: "POST /class-sections"
              payload: { program_track: "NOT_A_TRACK", title: "Bad Body" }
              as: ProgramCoordinator
              as_user_id: ""
              captures: { e3: $.data.error_id }
            - call: "GET /students?limit=0&offset=0"
              as: Registrar
              as_user_id: ""
              captures: { e4: $.data.error_id }
          assert:
            - "the read with an empty X-User-ID and an unknown id returns 401 with data.error_id == 'ERR_UNAUTHENTICATED' - not 404"
            - "the write with an empty X-User-ID under a role that the endpoint does not list returns 401 with data.error_id == 'ERR_UNAUTHENTICATED' - not 403"
            - "the write with an empty X-User-ID, an invalid enum and two missing required fields returns 401 with data.error_id == 'ERR_UNAUTHENTICATED' - not 400"
            - "the list with an empty X-User-ID and limit=0 returns 401 with data.error_id == 'ERR_UNAUTHENTICATED' - not ERR_INVALID_PAGINATION"
            - "GET /students?limit=10&offset=0 with a valid Registrar identity returns total_count == 0 - none of the probes created anything"

  - section: cross-cutting complexity layers
    instances:
      - name: exam_session_version_increments_on_every_write_and_the_current_version_is_accepted
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile[complexity_layers=optimistic_concurrency]
          - concurrency_rules[registration-create-stale-session]
          - errors[ERR_STALE_EXAM_SESSION_VERSION]
        distinguishing_aspect: |
          The layer's positive half is easy to fake by never bumping the version: this instance pins the
          increment to every write, including the seat-consuming registration performed by a different
          actor, and then shows that the first registrar's still-open view is stale by exactly one. The
          re-read then succeeds with no other change, which distinguishes real version tracking from an
          implementation that only compares the version against the entity's creation value.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. A FULL_AUTHORIZED center, a room and a CERTIFIED proctor."
            - "A MATH session with 5 seats on 2026-08-25 and two PLACED self-paying students."
