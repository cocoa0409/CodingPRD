            - "ImprovementRecord.${rec_id}.reversed == false"
            - "Structure.${struct_id}.cumulative_counted_cost_usd == 60000.00"
            - "Structure.${struct_id}.cumulative_improvement_pct == 30.00"

      - name: outreach_against_another_communitys_cycle_is_rejected
        claim_type: error_triggerability
        grounds:
          - validations.priority_28
          - errors.ERR_CYCLE_COMMUNITY_MISMATCH
        distinguishing_aspect: |
          The referenced cycle exists and is OPEN, so neither the 404 family nor
          ERR_CYCLE_NOT_OPEN applies: it belongs to a second community, which is 422
          ERR_CYCLE_COMMUNITY_MISMATCH decided at priority 28 before the priority-44 cycle
          state gate ever runs.
        test_recipe:
          setup:
            - "Community A with an EFFECTIVE AE panel, one parcel in RLA-1, area analyzed and DESIGNATED."
            - "Community B with its own OPEN CrsCycle for 2026."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_a_id: $.data.id }
            - call: "POST /floodplain/communities"
              payload: { name: "Gulf Town", state_code: "TX", cid_number: "480002", freeboard_ft: 1.0, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_b_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_a_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_a_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/repetitive-loss-areas"
              payload: { community_id: "${comm_a_id}", area_code: "RLA-1", boundary_description: "Bayou bend north bank" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { area_id: $.data.id }
            - call: "POST /floodplain/repetitive-loss-areas/${area_id}/analyze"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/repetitive-loss-areas/${area_id}/designate"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/crs-cycles"
              payload: { community_id: "${comm_b_id}", cycle_year: 2026, cycle_start_date: "2026-01-01T00:00:00Z", cycle_end_date: "2026-12-31T00:00:00Z", due_at: "2027-03-01T00:00:00Z" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { cycle_b_id: $.data.id }
          trigger:
            - call: "POST /floodplain/repetitive-loss-areas/${area_id}/outreach"
              payload: { crs_cycle_id: "${cycle_b_id}", target_property_count: 1 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_CYCLE_COMMUNITY_MISMATCH'"
            - "RepetitiveLossArea.${area_id}.outreach_status == NOT_STARTED"
            - "RepetitiveLossArea.${area_id}.outreach_crs_cycle_id == null"
            - "CrsCycle.${cycle_b_id}.status == OPEN"

      - name: designation_before_the_first_analysis_is_rejected
        claim_type: error_triggerability
        grounds:
          - validations.priority_44
          - errors.ERR_LOSS_AREA_ANALYSIS_STALE
        distinguishing_aspect: |
          The designation axis is guarded by the analysis axis: a freshly created area is
          PENDING_ANALYSIS, so designate returns 422 ERR_LOSS_AREA_ANALYSIS_STALE — the same
          code a re-staled area gets — rather than a state error on the DRAFT status it is
          legitimately in.
        test_recipe:
          setup:
            - "Community with an EFFECTIVE AE panel and one parcel in RLA-1; area created, never analyzed."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/repetitive-loss-areas"
              payload: { community_id: "${comm_id}", area_code: "RLA-1", boundary_description: "Bayou bend north bank" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { area_id: $.data.id }
          trigger:
            - call: "POST /floodplain/repetitive-loss-areas/${area_id}/designate"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_LOSS_AREA_ANALYSIS_STALE'"
            - "RepetitiveLossArea.${area_id}.status == DRAFT"
            - "RepetitiveLossArea.${area_id}.analysis_status == PENDING_ANALYSIS"
            - "RepetitiveLossArea.${area_id}.property_count == 0"
            - "Property.${prop_id}.repetitive_loss_area_id == null"

      - name: relaunching_outreach_while_one_is_in_progress_is_rejected
        claim_type: error_triggerability
        grounds:
          - validations.priority_40
          - errors.ERR_OUTREACH_ALREADY_IN_PROGRESS
        distinguishing_aspect: |
          Relaunch is legal from COMPLETED and INSUFFICIENT but not from IN_PROGRESS, so the
          second launch returns 409 ERR_OUTREACH_ALREADY_IN_PROGRESS and — critically — does
          not reset the in-flight delivered_count or re-snapshot target_property_count.
        test_recipe:
          setup:
            - "Community, EFFECTIVE AE panel, one parcel in RLA-1; area analyzed and DESIGNATED; OPEN CrsCycle 2026."
            - "Outreach launched with target 2 and one delivery of 1 recorded."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/repetitive-loss-areas"
              payload: { community_id: "${comm_id}", area_code: "RLA-1", boundary_description: "Bayou bend north bank" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { area_id: $.data.id }
            - call: "POST /floodplain/repetitive-loss-areas/${area_id}/analyze"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/repetitive-loss-areas/${area_id}/designate"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/crs-cycles"
              payload: { community_id: "${comm_id}", cycle_year: 2026, cycle_start_date: "2026-01-01T00:00:00Z", cycle_end_date: "2026-12-31T00:00:00Z", due_at: "2027-03-01T00:00:00Z" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { cycle_id: $.data.id }
            - call: "POST /floodplain/repetitive-loss-areas/${area_id}/outreach"
              payload: { crs_cycle_id: "${cycle_id}", target_property_count: 2 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/repetitive-loss-areas/${area_id}/record-outreach-delivery"
              payload: { delivered_increment: 1 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          trigger:
            - call: "POST /floodplain/repetitive-loss-areas/${area_id}/outreach"
              payload: { crs_cycle_id: "${cycle_id}", target_property_count: 4 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_OUTREACH_ALREADY_IN_PROGRESS'"
            - "RepetitiveLossArea.${area_id}.outreach_status == IN_PROGRESS"
            - "RepetitiveLossArea.${area_id}.target_property_count == 2"
            - "RepetitiveLossArea.${area_id}.delivered_count == 1"
            - "RepetitiveLossArea.${area_id}.coverage_pct == 50.00"

      - name: resolving_an_already_remediated_violation_is_rejected
        claim_type: error_triggerability
        grounds:
          - validations.priority_40
          - errors.ERR_VIOLATION_NOT_ACTIONABLE
        distinguishing_aspect: |
          REMEDIATED is terminal on the enforcement axis, so a second resolve returns 409
          ERR_VIOLATION_NOT_ACTIONABLE and resolved_at keeps its first value — the sanction
          ledger is not debited twice for one violation.
        test_recipe:
          setup:
            - "Canonical base fixture; one MAJOR violation opened and already resolved REMEDIATED."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/violations"
              payload: { property_id: "${prop_id}", violation_type: "UNPERMITTED_FILL", severity: "MAJOR" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { viol_id: $.data.id }
            - call: "POST /floodplain/violations/${viol_id}/resolve"
              payload: { resolution: "REMEDIATED", resolution_note: "Fill removed" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          trigger:
            - call: "POST /floodplain/violations/${viol_id}/resolve"
              payload: { resolution: "CLOSED_UNRESOLVED" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_VIOLATION_NOT_ACTIONABLE'"
            - "Violation.${viol_id}.status == REMEDIATED"
            - "Violation.${viol_id}.resolved_at == '2026-08-01T00:00:00Z'"
            - "Violation.${viol_id}.sanction_points_contributed == 0"
            - "Community.${comm_id}.sanction_risk_points == 0"
            - "Community.${comm_id}.compliance_posture == GOOD_STANDING"

      - name: duplicate_cid_number_in_another_state_is_rejected
        claim_type: error_triggerability
        grounds:
          - validations.priority_76
          - errors.ERR_DUPLICATE_CID_NUMBER
        distinguishing_aspect: |
          cid_number is unique globally, not per state, so a Louisiana community reusing the
          Texas community's 480001 is refused with 409 ERR_DUPLICATE_CID_NUMBER even though
          every other field differs.
        test_recipe:
          setup:
            - "A Texas community with cid_number 480001."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_a_id: $.data.id }
          trigger:
            - call: "POST /floodplain/communities"
              payload: { name: "Delta Parish", state_code: "LA", cid_number: "480001" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_DUPLICATE_CID_NUMBER'"
            - "Community.${comm_a_id}.state_code == TX"
            - "exactly one Community exists"

      - name: second_pending_revision_of_one_panel_number_is_rejected
        claim_type: error_triggerability
        grounds:
          - validations.priority_76
          - errors.ERR_DUPLICATE_PANEL_REVISION
        distinguishing_aspect: |
          Uniqueness is on at most one PENDING_REVISION panel per (community, panel_number),
          so a different suffix and a strictly later effective_date do not help: because the
          incumbent is PENDING and not EFFECTIVE the priority-73 interval rule stays silent and
          the request lands on 409 ERR_DUPLICATE_PANEL_REVISION.
        test_recipe:
          setup:
            - "Community with one PENDING_REVISION panel 48001C0100 suffix H effective 2020-01-01."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_h_id: $.data.id }
          trigger:
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "J", flood_zone: "AE", effective_date: "2026-01-01T00:00:00Z", base_flood_elevation_ft: 13.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_DUPLICATE_PANEL_REVISION'"
            - "FirmPanel.${panel_h_id}.status == PENDING_REVISION"
            - "FirmPanel.${panel_h_id}.supersedes_panel_id == null"
            - "exactly one FirmPanel exists for panel_number 48001C0100"

      - name: duplicate_area_code_inside_one_community_is_rejected
        claim_type: error_triggerability
        grounds:
          - validations.priority_76
          - errors.ERR_DUPLICATE_AREA_CODE
        distinguishing_aspect: |
          area_code is unique per community and is also the join key the analysis uses against
          Property.mapped_area_code, so a second RLA-1 area is refused with 409
          ERR_DUPLICATE_AREA_CODE rather than being allowed to split the same parcels across
          two areas.
        test_recipe:
          setup:
            - "Community with an EFFECTIVE AE panel and one RLA-1 area already created."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/repetitive-loss-areas"
              payload: { community_id: "${comm_id}", area_code: "RLA-1", boundary_description: "Bayou bend north bank" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { area_id: $.data.id }
          trigger:
            - call: "POST /floodplain/repetitive-loss-areas"
              payload: { community_id: "${comm_id}", area_code: "RLA-1", boundary_description: "Bayou bend south bank" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_DUPLICATE_AREA_CODE'"
            - "RepetitiveLossArea.${area_id}.boundary_description == 'Bayou bend north bank'"
            - "exactly one RepetitiveLossArea exists for the community"

      - name: second_standard_for_one_activity_and_cycle_year_is_rejected
        claim_type: error_triggerability
        grounds:
          - validations.priority_76
          - errors.ERR_DUPLICATE_STANDARD_ACTIVITY
        distinguishing_aspect: |
          The incumbent package is SUBMITTED, which is inside the {DRAFT, SUBMITTED, VERIFIED}
          uniqueness set, so a second A430_FREEBOARD claim for 2026 is refused with 409
          ERR_DUPLICATE_STANDARD_ACTIVITY even though its expected_community_version is
          current — the OCC check at priority 30 passes and the uniqueness check still fires.
        test_recipe:
          setup:
            - "Community with an A430_FREEBOARD standard for 2026 already SUBMITTED."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "GET /floodplain/communities/${comm_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { comm_version_1: $.data.version }
            - call: "POST /floodplain/higher-standards"
              payload: { community_id: "${comm_id}", activity_code: "A430_FREEBOARD", documentation_cycle_year: 2026, claimed_points: 100, expected_community_version: "${comm_version_1}" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { std_id: $.data.id }
            - call: "POST /floodplain/higher-standards/${std_id}/submit"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "GET /floodplain/communities/${comm_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { comm_version_2: $.data.version }
          trigger:
            - call: "POST /floodplain/higher-standards"
              payload: { community_id: "${comm_id}", activity_code: "A430_FREEBOARD", documentation_cycle_year: 2026, claimed_points: 150, expected_community_version: "${comm_version_2}" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_DUPLICATE_STANDARD_ACTIVITY'"
            - "HigherStandard.${std_id}.documentation_status == SUBMITTED"
            - "HigherStandard.${std_id}.claimed_points == 100"
            - "exactly one HigherStandard exists for (A430_FREEBOARD, 2026)"

      - name: elevation_below_required_at_the_exact_boundary
        claim_type: error_triggerability
        grounds:
          - validations.priority_52
          - errors.ERR_ELEVATION_BELOW_REQUIRED
        excluded_because:
          difficulty_instance: datum_conversion_accepts_certificate_at_exactly_zero_margin
          rationale: |
            That §1.8 boundary instance pins the accept/reject edge of this code by converting
            an NGVD29 reading to exactly the requirement, so a further triggerability probe of
            ERR_ELEVATION_BELOW_REQUIRED would add nothing.

      - name: cycle_not_open_is_raised_when_outreach_cites_a_submitted_cycle
        claim_type: error_triggerability
        grounds:
          - validations.priority_44
          - errors.ERR_CYCLE_NOT_OPEN
        excluded_because:
          difficulty_instance: outreach_launch_requires_referenced_cycle_to_be_open
          rationale: |
            That §1.8 cross_entity_state_dependency instance launches outreach against a
            SUBMITTED cycle and asserts ERR_CYCLE_NOT_OPEN, which is the only producer of this
            code on the outreach path.

  # ===========================================================================
  # Guide section 7 — From Table 7 (RBAC)
  # role_model: segregation_of_duties (plus peer_roles isolation for the
  # entity_backed PropertyOwner identity).
  # ===========================================================================
  - section: RBAC/roles
    instances:

      - name: appeals_board_member_cannot_open_a_determination_case_unauthorized
        claim_type: exclusive_operation_denied
        grounds:
          - RBAC.FloodplainAdministrator.exclusive_operations
          - validations.priority_2
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          The appeals board sits downstream of determinations, so it may read every case yet
          may not open one: the request fails 403 ERR_ROLE_NOT_PERMITTED at priority 2, before
          the priority-30 OCC check on expected_structure_version is even parsed.
        test_recipe:
          setup:
            - "Canonical base fixture with one counted IMPROVEMENT record."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
