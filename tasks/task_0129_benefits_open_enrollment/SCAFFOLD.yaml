    roles: [ComplianceOfficer]
    code: 201
    input: [tax_year]
    output: Form1095C
    side_effects: ["compute lowest_cost_monthly_premium_cents, affordability_threshold_cents, affordability_indicator"]

  - method: GET
    path: "/form-1095c/{id}"
    description: "Fetch a 1095-C"
    roles: [ComplianceOfficer, BenefitsAdmin]
    code: 200
    input: []
    output: Form1095C
    side_effects: []

  - method: GET
    path: "/form-1095c"
    description: "List 1095-C forms, filterable by employee (reverse-reachability for Form1095C.employee_id)"
    roles: [ComplianceOfficer, BenefitsAdmin]
    code: 200
    input: ["employee_id?", "tax_year?", "status?", "limit?", "offset?"]
    output: Form1095C[]
    side_effects: []

  - method: POST
    path: "/form-1095c/{id}/file"
    description: "File a 1095-C (GENERATED->FILED); terminal"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Form1095C
    side_effects: ["increments Form1095C.version by 1"]

  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/advance"
    description: "Test-driving endpoint: set the server clock to an absolute ISO 8601 instant; elapses crossed waiting periods and re-evaluates employee eligibility"
    roles: [BenefitsAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["WaitingPeriod windows with end_date <= clock flip to ELAPSED", "owning Employee eligibility_status -> ELIGIBLE if not SEASONAL (bubble-up)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "role not permitted for this operation per §1.7" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "a path or FK-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "missing required field, invalid enum, negative integer where non-negative required" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "requested transition not defined from the resource's current state" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "approver/verifier X-User-ID equals the submitter (life event) or the owning employee (dependent verify)" }
  - { id: ERR_EOI_REQUIRED, http: 409, condition: "attempt to activate a VOLUNTARY_LIFE enrollment with coverage above guaranteed issue without EOI" }
  - { id: ERR_EMPLOYEE_NOT_ELIGIBLE, http: 409, condition: "owning Employee.eligibility_status != ELIGIBLE on activate / life-event approve" }
  - { id: ERR_LIFE_EVENT_WINDOW_EXPIRED, http: 409, condition: "LifeEvent.event_date more than 30 days before the clock date at approval" }
  - { id: ERR_WAITING_PERIOD_OVERLAP, http: 409, condition: "new waiting-period window overlaps an existing one (half-open [start,end))" }
  - { id: ERR_COVERAGE_OVERLAP, http: 409, condition: "activating an enrollment whose closed coverage interval overlaps an existing ACTIVE enrollment of the same benefit_type" }
  - { id: ERR_DEPENDENT_NOT_VERIFIED, http: 409, condition: "adding a non-VERIFIED dependent to an enrollment" }
  - { id: ERR_STALE_EMPLOYEE_VERSION, http: 412, condition: "expected_employee_version does not match the current Employee.version (OCC)" }
  - { id: ERR_PLAN_ARCHIVED, http: 409, condition: "creating an enrollment against a tier of an ARCHIVED PlanOffering" }
  - { id: ERR_FORM_ALREADY_FILED, http: 409, condition: "attempt to mutate a FILED Form1095C" }
  - { id: ERR_VALIDATION_PAGINATION, http: 422, condition: "limit outside [1,100] or negative offset" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BenefitsAdmin
    description: "Configures the plan/tier catalog, manages employees, dependents, enrollments, and submits/approves life events (subject to segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /employees, POST /employees/{id}/terminate"
      - "POST /employees/{id}/waiting-periods"
      - "POST /plan-offerings, POST /plan-tiers"
      - "POST /employees/{id}/dependents, POST /dependents/{id}/resubmit"
      - "POST /employees/{id}/enrollments, POST /enrollments/{id}/activate, POST /enrollments/{id}/submit-eoi, POST /enrollments/{id}/cancel, POST /enrollments/{id}/add-dependent, POST /enrollments/{id}/remove-dependent"
      - "POST /employees/{id}/life-events, POST /life-events/{id}/approve, POST /life-events/{id}/reject"
      - "POST /_clock/advance"
    shared_operations:
      - "GET endpoints across employees, plans, dependents, enrollments, eoi-requests, life-events, deduction-lines, carrier-feed-records, form-1095c"

  - name: DependentVerifier
    description: "Owns dependent verification; cannot verify a dependent of an employee whose id matches the verifier's own X-User-ID (segregation)"
    identity: opaque
    exclusive_operations:
      - "POST /dependents/{id}/request-info, POST /dependents/{id}/verify, POST /dependents/{id}/reject"
    shared_operations:
      - "GET employees, dependents, enrollments"

  - name: PayrollOfficer
    description: "Owns payroll deduction sync and the retro adjustment ledger view"
    identity: opaque
    exclusive_operations:
      - "POST /_payroll/run"
    shared_operations:
      - "GET employees, deduction-lines, carrier-feed-records, enrollments, life-events"

  - name: ComplianceOfficer
    description: "Owns evidence-of-insurability decisions and ACA 1095-C generation/filing"
    identity: opaque
    exclusive_operations:
      - "POST /eoi-requests/{id}/decide"
      - "POST /employees/{id}/form-1095c, POST /form-1095c/{id}/file"
    shared_operations:
      - "GET eoi-requests, form-1095c, employees, enrollments, dependents, carrier-feed-records"
