          trigger: "POST /night-audit/business-dates/${bd1_id}/post-room-and-tax sent with header X-User-Role NightAuditor but no X-User-ID header at all."
          assert:
            - "HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\" and the date still reads status == \"OPEN\" with version == 1."
            - "The same call with X-User-ID as the empty string \"\" also fails 401 ERR_UNAUTHENTICATED - an empty value is not an identity."
            - "The same call with X-User-Role Auditor - a string that is not one of the six declared roles - fails 401 ERR_UNAUTHENTICATED, not 403, because the role cannot even be parsed."
            - "The same call with X-User-Role FrontDeskAgent and X-User-ID u_fd_1 fails 403 ERR_UNAUTHORIZED, since the close-sequence endpoint lists only NightAuditor."
            - "An unknown role sent to that same NightAuditor-only endpoint still yields 401, proving priority 2 outranks priority 3."
            - "POST /night-audit/outlet-tickets/${ticket_id}/close as X-User-Role OutletManager with X-User-ID u_om_1 fails 403 ERR_UNAUTHORIZED, because an OutletManager's id must be the id of an existing Outlet."
            - "The same close as OutletManager with X-User-ID ${grill_id} fails 403 ERR_OUTLET_SCOPE_VIOLATION - the identity is well-formed and authorized, it simply does not own that ticket - and as X-User-ID ${lounge_id} it returns 200."

