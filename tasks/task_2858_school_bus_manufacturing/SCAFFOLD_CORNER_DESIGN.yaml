              captures: { order_tx_id: $.data.id }
            - call: "POST /contract-orders/${order_tx_id}/units"
              payload: { vin: "1TXDSL0000000101" }
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { unit_tx_id: $.data.id, unit_phase: $.data.production_status }
          trigger:
            - call: "POST /bus-units/${unit_tx_id}/advance-build"
