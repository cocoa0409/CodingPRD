# =============================================================================
# §1.9 Scaffold Corner Design — task_1483_wholesale_bakery_plant_dsd_bread
# Breadth coverage of §1.1–§1.7 claims not already covered by §1.8.
# ============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: plant_creation_defaults
        claim_type: creation
        grounds: [entities.Plant]
        distinguishing_aspect: "POST /bakery/plants returns 201 with server-minted id, day_index == 0, version == 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /bakery/plants"
              payload: { name: "Plant One", baseline_flour_index: 400, baseline_butter_index: 600 }
              as: PlantAdmin
              captures: { p: $.data.id, di: $.data.day_index, v: $.data.version }
          assert:
            - "di == 0"
            - "v == 1"
            - "Plant.${p}.name == 'Plant One'"

      - name: product_computed_surcharge_defaults_to_zero
        claim_type: computed_fields
        grounds: [entities.Product.fields.current_surcharge_cents]
        distinguishing_aspect: "current_surcharge_cents is computed and starts at 0 with no FINALIZED schedule."
        test_recipe:
          setup: ["Plant exists"]
          setup_api_calls:
            - { call: "POST /bakery/plants", payload: { name: "Plant P", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id } }
          trigger:
            - call: "POST /bakery/products"
              payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }
              as: PlantAdmin
              captures: { pa: $.data.id, sur: $.data.current_surcharge_cents }
          assert:
            - "sur == 0"
            - "Product.${pa}.version == 1"

      - name: store_default_tier_applied
        claim_type: defaults
        grounds: [entities.Store.fields.stale_credit_tier]
        distinguishing_aspect: "Omitting stale_credit_tier applies the STANDARD default and initializes counters to 0."
        test_recipe:
          setup: ["Plant exists"]
          setup_api_calls:
            - { call: "POST /bakery/plants", payload: { name: "Plant P", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id } }
          trigger:
            - call: "POST /bakery/stores"
              payload: { plant_id: "${p}", name: "Store S", lead_time_hours: 48, min_remaining_life_hours_on_delivery: 12, shelf_capacity_units: 100 }
              as: PlantAdmin
              captures: { st: $.data.id, tier: $.data.stale_credit_tier, bal: $.data.credit_balance_cents, ratio: $.data.stale_ratio }
          assert:
            - "tier == STANDARD"
            - "bal == 0"
            - "ratio == 0"
            - "Store.${st}.status == ACTIVE"

      - name: product_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Product, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent uuid returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /bakery/products/00000000-0000-4000-8000-000000000000"
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: product_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Product.fields.allergen_class, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "allergen_class 'GLUTEN' is outside {NONE, SESAME, TREE_NUT, PEANUT} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Plant exists"]
          setup_api_calls:
            - { call: "POST /bakery/plants", payload: { name: "Plant P", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id } }
          trigger:
            - call: "POST /bakery/products"
              payload: { plant_id: "${p}", sku: "SKU-X", name: "Rye", allergen_class: "GLUTEN", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: store_order_missing_required_lines
        claim_type: required_fields
        grounds: [entities.StoreOrder.fields.lines, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required lines array on order create -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Plant + store exist"]
          setup_api_calls:
            - { call: "POST /bakery/plants", payload: { name: "Plant P", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id } }
            - { call: "POST /bakery/stores", payload: { plant_id: "${p}", name: "Store S", lead_time_hours: 48, min_remaining_life_hours_on_delivery: 12, shelf_capacity_units: 100 }, as: PlantAdmin, captures: { st: $.data.id } }
          trigger:
            - call: "POST /bakery/store-orders"
              payload: { store_id: "${st}", delivery_date: "2026-08-10" }
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: batch_initial_state_scheduled
        claim_type: initial_state
        grounds: [state_machines.Batch]
        distinguishing_aspect: "A newly created batch starts in SCHEDULED with no clock stamps set."
        test_recipe:
          setup: ["Plant, product A, line, plan 2026-08-09 LOCKED"]
          setup_api_calls:
            - { call: "POST /bakery/plants", payload: { name: "Plant P", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }, as: PlantAdmin, captures: { pa: $.data.id } }
            - { call: "POST /bakery/lines", payload: { plant_id: "${p}", line_code: "L1", hourly_capacity_units: 500 }, as: PlantAdmin, captures: { ln: $.data.id } }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-09", expected_plant_version: "${pv}" }, as: Planner, captures: { pl: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/lock", payload: {}, as: Planner, captures: { plv: $.data.version } }
          trigger:
            - call: "POST /bakery/batches"
              payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pa}", qty_units: 100, scheduled_start_at: "2026-08-09T07:00:00Z", scheduled_end_at: "2026-08-09T09:00:00Z", expected_production_plan_version: "${plv}" }
              as: Planner
              captures: { bt: $.data.id, st: $.data.status }
          assert:
            - "st == SCHEDULED"
            - "Batch.${bt}.bake_completed_at is null"

      - name: batch_start_proof_from_scheduled_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Batch, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "start-proof is only defined from MIXING; from SCHEDULED it returns ERR_INVALID_STATE with no state change."
        test_recipe:
          setup: ["Batch SCHEDULED (plan LOCKED)"]
          setup_api_calls:
            - { call: "POST /bakery/plants", payload: { name: "Plant P", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }, as: PlantAdmin, captures: { pa: $.data.id } }
            - { call: "POST /bakery/lines", payload: { plant_id: "${p}", line_code: "L1", hourly_capacity_units: 500 }, as: PlantAdmin, captures: { ln: $.data.id } }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-09", expected_plant_version: "${pv}" }, as: Planner, captures: { pl: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/lock", payload: {}, as: Planner, captures: { plv: $.data.version } }
            - { call: "POST /bakery/batches", payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pa}", qty_units: 100, scheduled_start_at: "2026-08-09T07:00:00Z", scheduled_end_at: "2026-08-09T09:00:00Z", expected_production_plan_version: "${plv}" }, as: Planner, captures: { bt: $.data.id } }
          trigger:
            - call: "POST /bakery/batches/${bt}/start-proof"
              payload: {}
              as: LineOperator
              as_user_id: "op-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "Batch.${bt}.status == SCHEDULED"

      - name: batch_terminal_lockdown_after_abort_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Batch, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ABORTED is terminal: start-mix after abort is rejected."
        test_recipe:
          setup: ["Batch ABORTED"]
          setup_api_calls:
            - { call: "POST /bakery/plants", payload: { name: "Plant P", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }, as: PlantAdmin, captures: { pa: $.data.id } }
            - { call: "POST /bakery/lines", payload: { plant_id: "${p}", line_code: "L1", hourly_capacity_units: 500 }, as: PlantAdmin, captures: { ln: $.data.id } }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-09", expected_plant_version: "${pv}" }, as: Planner, captures: { pl: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/lock", payload: {}, as: Planner, captures: { plv: $.data.version } }
            - { call: "POST /bakery/batches", payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pa}", qty_units: 100, scheduled_start_at: "2026-08-09T07:00:00Z", scheduled_end_at: "2026-08-09T09:00:00Z", expected_production_plan_version: "${plv}" }, as: Planner, captures: { bt: $.data.id } }
            - { call: "POST /bakery/batches/${bt}/abort", payload: {}, as: Planner }
          trigger:
            - call: "POST /bakery/batches/${bt}/start-mix"
              payload: {}
              as: LineOperator
              as_user_id: "op-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "Batch.${bt}.status == ABORTED"

      - name: order_second_cancel_rejected
        claim_type: idempotency
        grounds: [state_machines.StoreOrder.PLACED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already CANCELLED order is not idempotent: second cancel returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Order PLACED then CANCELLED"]
          setup_api_calls:
            - { call: "POST /bakery/plants", payload: { name: "Plant P", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }, as: PlantAdmin, captures: { pa: $.data.id } }
            - { call: "POST /bakery/stores", payload: { plant_id: "${p}", name: "Store S", lead_time_hours: 48, min_remaining_life_hours_on_delivery: 12, shelf_capacity_units: 100 }, as: PlantAdmin, captures: { st: $.data.id } }
            - { call: "POST /bakery/store-orders", payload: { store_id: "${st}", delivery_date: "2026-08-10", lines: [ { product_id: "${pa}", qty: 10 } ] }, as: Planner, captures: { ord: $.data.id } }
            - { call: "POST /bakery/store-orders/${ord}/cancel", payload: {}, as: Planner }
          trigger:
            - call: "POST /bakery/store-orders/${ord}/cancel"
              payload: {}
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "StoreOrder.${ord}.status == CANCELLED"

      - name: batch_overproof_auto_then_start_bake_rejected
        claim_type: valid_transition
        grounds: [state_machines.Batch.PROOFING_to_OVERPROOFED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "System transition: a batch left in PROOFING past 120 minutes flips to OVERPROOFED at close_day; start-bake is then rejected (from-state gone)."
        test_recipe:
          setup: ["Plan RELEASED; batch in PROOFING since 2026-08-09T07:50:00Z; clock advanced to 2026-08-09T09:51:00Z (121 min elapsed)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T07:50:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/plants", payload: { name: "Plant P", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }, as: PlantAdmin, captures: { pa: $.data.id } }
            - { call: "POST /bakery/lines", payload: { plant_id: "${p}", line_code: "L1", hourly_capacity_units: 500 }, as: PlantAdmin, captures: { ln: $.data.id } }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-09", expected_plant_version: "${pv}" }, as: Planner, captures: { pl: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/lock", payload: {}, as: Planner, captures: { plv: $.data.version } }
            - { call: "POST /bakery/batches", payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pa}", qty_units: 100, scheduled_start_at: "2026-08-09T07:00:00Z", scheduled_end_at: "2026-08-09T09:00:00Z", expected_production_plan_version: "${plv}" }, as: Planner, captures: { bt: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/release", payload: {}, as: Planner }
            - { call: "POST /bakery/batches/${bt}/start-mix", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/start-proof", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T09:51:00Z" }, as: PlantAdmin }
          trigger:
            - call: "POST /bakery/plants/${p}/close_day"
              payload: {}
              as: PlantAdmin
              captures: { di: $.data.day_index }
            - call: "GET /bakery/batches/${bt}"
              as: Any
              captures: { st: $.data.status }
            - call: "POST /bakery/batches/${bt}/start-bake"
              payload: {}
              as: LineOperator
              as_user_id: "op-1"
              captures: { err: $.data.error_id }
          assert:
            - "di == 1"
            - "st == OVERPROOFED  # system auto-transition at close_day"
            - "err == ERR_INVALID_STATE"

      - name: sanitation_retry_loop_covered
        claim_type: invalid_transition
        grounds: [state_machines.SanitationCycle.FAILED_to_IN_PROGRESS]
        excluded_because:
          difficulty_instance: sanitation_fail_retry_loop
          rationale: "The FAILED -> IN_PROGRESS retry loop and subsequent VERIFIED leg are asserted in the named §1.8 instance."

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: buffer_tier_boundary_999_vs_1000
        claim_type: constants_applied
        grounds: [calculations.production_requirement]
        distinguishing_aspect: "Tier constants keyed on gross: gross 999 -> 10% -> planned 1099; gross 1000 -> 7% -> planned 1070 (non-monotone across the boundary is the pinned behavior)."
        test_recipe:
          setup:
            - "Plant, product A, store; order1 999xA for 2026-08-10 LOCKED; order2 1000xA for 2026-08-11 LOCKED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/plants", payload: { name: "Plant P", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }, as: PlantAdmin, captures: { pa: $.data.id } }
            - { call: "POST /bakery/stores", payload: { plant_id: "${p}", name: "Store S", lead_time_hours: 48, min_remaining_life_hours_on_delivery: 12, shelf_capacity_units: 100 }, as: PlantAdmin, captures: { st: $.data.id } }
            - { call: "POST /bakery/store-orders", payload: { store_id: "${st}", delivery_date: "2026-08-10", lines: [ { product_id: "${pa}", qty: 999 } ] }, as: Planner, captures: { o1: $.data.id } }
            - { call: "POST /bakery/store-orders/${o1}/confirm", payload: {}, as: Planner }
            - { call: "POST /bakery/store-orders/${o1}/lock", payload: {}, as: Planner }
            - { call: "POST /bakery/store-orders", payload: { store_id: "${st}", delivery_date: "2026-08-11", lines: [ { product_id: "${pa}", qty: 1000 } ] }, as: Planner, captures: { o2: $.data.id } }
            - { call: "POST /bakery/store-orders/${o2}/confirm", payload: {}, as: Planner }
            - { call: "POST /bakery/store-orders/${o2}/lock", payload: {}, as: Planner }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-10", expected_plant_version: "${pv}" }, as: Planner, captures: { pl1: $.data.id } }
            - { call: "GET /bakery/plants/${p}", as: Any, captures: { pv2: $.data.version } }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-11", expected_plant_version: "${pv2}" }, as: Planner, captures: { pl2: $.data.id } }
          trigger:
            - call: "POST /bakery/production-plans/${pl1}/lock"
              payload: {}
              as: Planner
              captures: { t1: $.data.total_planned_units }
            - call: "POST /bakery/production-plans/${pl2}/lock"
              payload: {}
              as: Planner
              captures: { t2: $.data.total_planned_units }
          assert:
            - "t1 == 1099  # ceil(999 * 1.10)"
            - "t2 == 1070  # ceil(1000 * 1.07) — the 1000-unit order plans FEWER units than the 999-unit order"

      - name: stale_credit_zero_rate_for_old_bread
        claim_type: input_set_filtering
        grounds: [calculations.stale_credit]
        distinguishing_aspect: "A line aged 50h (> TIER2_MAX 48) earns rate 0.00: the line is admitted to the return but contributes 0 to provisional_credit_cents."
        test_recipe:
          setup:
            - "Baseline distribution chain (product A); batch baked 2026-08-09T09:00:00Z; stop DELIVERED; clock 2026-08-11T11:00:00Z (age 50h, still inside the 72h return window)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/plants", payload: { name: "Plant P", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }, as: PlantAdmin, captures: { pa: $.data.id } }
            - { call: "POST /bakery/stores", payload: { plant_id: "${p}", name: "Store S", lead_time_hours: 48, min_remaining_life_hours_on_delivery: 12, shelf_capacity_units: 100, stale_credit_tier: "STANDARD" }, as: PlantAdmin, captures: { st: $.data.id } }
            - { call: "POST /bakery/drivers", payload: { plant_id: "${p}", name: "Driver One" }, as: PlantAdmin, captures: { drv: $.data.id } }
            - { call: "POST /bakery/lines", payload: { plant_id: "${p}", line_code: "L1", hourly_capacity_units: 500 }, as: PlantAdmin, captures: { ln: $.data.id } }
            - { call: "POST /bakery/store-orders", payload: { store_id: "${st}", delivery_date: "2026-08-10", lines: [ { product_id: "${pa}", qty: 100 } ] }, as: Planner, captures: { ord: $.data.id } }
            - { call: "POST /bakery/store-orders/${ord}/confirm", payload: {}, as: Planner }
            - { call: "POST /bakery/store-orders/${ord}/lock", payload: {}, as: Planner }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-09", expected_plant_version: "${pv}" }, as: Planner, captures: { pl: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/lock", payload: {}, as: Planner, captures: { plv: $.data.version } }
            - { call: "POST /bakery/batches", payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pa}", qty_units: 100, scheduled_start_at: "2026-08-09T07:00:00Z", scheduled_end_at: "2026-08-09T09:00:00Z", expected_production_plan_version: "${plv}" }, as: Planner, captures: { bt: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/release", payload: {}, as: Planner }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T07:50:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${bt}/start-mix", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /bakery/batches/${bt}/start-proof", payload: {}, as: LineOperator, as_user_id: "op-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T09:00:00Z" }, as: PlantAdmin }
            - { call: "POST /bakery/batches/${bt}/start-bake", payload: {}, as: LineOperator, as_user_id: "op-1" }
