          setup:
            - "buyer clean, order FOB / ZONE_2 with one 25000.00 line"
            - "credit LC-CORNER-7401 for 25000.00 at tolerance 10.00, expiry 2026-12-31, initially RECEIVED"
            - "no trade documents are ever issued, so every attempt is rejected before the document-content checks"
