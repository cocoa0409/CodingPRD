            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_above}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-01T08:00:00Z", scan_window_end: "2026-08-01T09:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_above: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${audit_above}/scan-lines"
              payload: { item_upc: "00000000000721", shelf_price_cents: 949, register_price_cents: 1099 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_above}/scan-lines"
              payload: { item_upc: "00000000000722", shelf_price_cents: 299, register_price_cents: 299 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_above}/scan-lines"
              payload: { item_upc: "00000000000723", shelf_price_cents: 199, register_price_cents: 199 }
              as: PriceAuditor
              as_user_id: "${pa1}"
          trigger:
            - call: "POST /price-integrity/scanner-audits/${audit_below}/close"
              payload: {}
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_at}/close"
              payload: {}
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_above}/close"
              payload: {}
              as: PriceAuditor
              as_user_id: "${pa1}"
          assert:
            - "Just below: ScannerAudit.${audit_below}.sample_size == 5, overcharge_count == 1, error_rate_pct == 20.00, outcome == PASS"
            - "Exactly at: ScannerAudit.${audit_at}.sample_size == 4, overcharge_count == 1, error_rate_pct == 25.00, outcome == FAIL — the comparison is >=, so equality fails"
            - "Just above: ScannerAudit.${audit_above}.sample_size == 3, overcharge_count == 1, error_rate_pct == 33.33 (ROUND_HALF_UP of 33.3333... to 2 dp, never 33.34 or 33.3), outcome == FAIL"
            - "All three store gross_error_rate_pct == error_rate_pct and net_overcharge_rate_pct == error_rate_pct here, because no scan line is an UNDERCHARGE"
            - "Store.${store_a}.failed_audit_count_30d == 2 (the at-threshold and above-threshold audits only)"
            - "Store.${store_a}.compliance_posture == FROZEN — failed_audit_count_30d 2 reaches FROZEN_FAILED_AUDIT_COUNT 2; reading the posture right after the at-threshold close alone would have shown RESTRICTED"

      - name: unit_price_rounding_mode_decides_the_exact_half_cent_tie
        grounds:
          - calculations.unit_price_display
          - entities.Jurisdiction.fields.unit_price_rounding
          - entities.Jurisdiction.fields.unit_price_decimal_places
          - entities.PriceChangeLine.fields.unit_price_display_cents
        distinguishing_aspect: |
          Rounding-mode boundary at an exact tie rather than a threshold comparison: with
          unit_price_decimal_places 2 the single rounding step runs at cents_places 0, so a raw
          unit price of exactly 449.5 cents resolves to 450 under ROUND_HALF_UP and 449 under
          ROUND_HALF_DOWN, while the neighbours 449.25 and 449.75 are mode-independent. The tie is
          manufactured with PER_100_COUNT on a 200-count pack so that basis_qty is exactly 2.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z default."
            - "Two jurisdictions differing ONLY in unit_price_rounding: J_UP (ROUND_HALF_UP) and J_DOWN (ROUND_HALF_DOWN). Both use unit_price_uom_rule PER_100_COUNT, unit_price_decimal_places 2, unit_price_required true."
            - "One DRAFT price change file per jurisdiction (no store or associate needed — the calculation runs at line creation)."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-UP", name: "Half Up State", unit_price_uom_rule: "PER_100_COUNT", unit_price_decimal_places: 2, unit_price_rounding: "ROUND_HALF_UP", unit_price_required: true }
              as: PricingAdmin
              captures: { jur_up: $.data.id }
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-DN", name: "Half Down State", unit_price_uom_rule: "PER_100_COUNT", unit_price_decimal_places: 2, unit_price_rounding: "ROUND_HALF_DOWN", unit_price_required: true }
              as: PricingAdmin
              captures: { jur_dn: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Up Street", jurisdiction_id: "${jur_up}" }
              as: PricingAdmin
              captures: { store_up: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S002", name: "Down Street", jurisdiction_id: "${jur_dn}" }
              as: PricingAdmin
              captures: { store_dn: $.data.id }
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-UP", jurisdiction_id: "${jur_up}", effective_date: "2026-08-03T00:00:00Z", scope_store_ids: ["${store_up}"], priority: "ROUTINE" }
              as: PricingAdmin
              captures: { file_up: $.data.id }
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-DN", jurisdiction_id: "${jur_dn}", effective_date: "2026-08-03T00:00:00Z", scope_store_ids: ["${store_dn}"], priority: "ROUTINE" }
              as: PricingAdmin
              captures: { file_dn: $.data.id }
          trigger:
            - call: "POST /price-integrity/price-change-files/${file_up}/lines"
              payload: { item_upc: "00000000000801", item_description: "Straws 200ct", category_code: "GENERAL", old_retail_cents: 999, new_retail_cents: 899, net_content_qty: 200, net_content_uom: "CT" }
              as: PricingAdmin
              captures: { line_up_tie: $.data.unit_price_display_cents }
            - call: "POST /price-integrity/price-change-files/${file_dn}/lines"
              payload: { item_upc: "00000000000801", item_description: "Straws 200ct", category_code: "GENERAL", old_retail_cents: 999, new_retail_cents: 899, net_content_qty: 200, net_content_uom: "CT" }
              as: PricingAdmin
              captures: { line_dn_tie: $.data.unit_price_display_cents }
            - call: "POST /price-integrity/price-change-files/${file_up}/lines"
              payload: { item_upc: "00000000000802", item_description: "Straws 400ct low", category_code: "GENERAL", old_retail_cents: 1999, new_retail_cents: 1797, net_content_qty: 400, net_content_uom: "CT" }
              as: PricingAdmin
              captures: { line_up_low: $.data.unit_price_display_cents }
            - call: "POST /price-integrity/price-change-files/${file_dn}/lines"
              payload: { item_upc: "00000000000802", item_description: "Straws 400ct low", category_code: "GENERAL", old_retail_cents: 1999, new_retail_cents: 1797, net_content_qty: 400, net_content_uom: "CT" }
              as: PricingAdmin
              captures: { line_dn_low: $.data.unit_price_display_cents }
            - call: "POST /price-integrity/price-change-files/${file_up}/lines"
              payload: { item_upc: "00000000000803", item_description: "Straws 400ct high", category_code: "GENERAL", old_retail_cents: 1999, new_retail_cents: 1799, net_content_qty: 400, net_content_uom: "CT" }
              as: PricingAdmin
              captures: { line_up_high: $.data.unit_price_display_cents }
            - call: "POST /price-integrity/price-change-files/${file_dn}/lines"
              payload: { item_upc: "00000000000803", item_description: "Straws 400ct high", category_code: "GENERAL", old_retail_cents: 1999, new_retail_cents: 1799, net_content_qty: 400, net_content_uom: "CT" }
              as: PricingAdmin
              captures: { line_dn_high: $.data.unit_price_display_cents }
          assert:
            - "Exact tie under ROUND_HALF_UP: basis_qty == 2 (200 / 100), raw 899 / 2 == 449.5, ${line_up_tie} == 450"
            - "Exact tie under ROUND_HALF_DOWN: same basis_qty 2 and same raw 449.5, ${line_dn_tie} == 449"
            - "The tie is the ONLY divergence: ${line_up_low} == ${line_dn_low} == 449 (raw 1797 / 4 == 449.25) and ${line_up_high} == ${line_dn_high} == 450 (raw 1799 / 4 == 450.25 rounds to 450)"
            - "cents_places == max(0, 2 - 2) == 0 for both jurisdictions, so unit_price_display_cents is a whole number of cents in every arm"
            - "unit_price_basis_qty is stored unrounded on every line: 2 for the 200ct pack, 4 for both 400ct packs; unit_price_basis_uom == 100CT"
            - "Distributing either file (POST /price-integrity/price-change-files/{id}/distribute) re-runs the calculation and yields byte-identical unit_price_display_cents — the recompute is idempotent"

      - name: exception_report_min_sample_and_half_open_window_boundaries
        grounds:
          - calculations.exception_report_category_ranking
          - constants.MIN_CATEGORY_SAMPLE
          - validations.priority_63_ERR_NO_QUALIFYING_AUDIT_DATA
          - entities.ExceptionReport.fields.period_end_at
        distinguishing_aspect: |
          Two boundaries at once, both integer/instant rather than monetary: the eligibility cut is
          sample_size >= MIN_CATEGORY_SAMPLE (2), so a one-line category is dropped entirely rather
          than ranked; and the audit window is half-open, so an audit whose closed_at equals
          period_start_at is IN while one whose closed_at equals period_end_at is OUT. A single pair
          of windows over the same two audits flips the request between 201 and
          ERR_NO_QUALIFYING_AUDIT_DATA, which is the empty-candidate fallback of the ranking
          selector rather than any threshold comparison.
        test_recipe:
          setup:
            - "Clock starts at the 2026-08-01T00:00:00Z default."
