  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: lot_mass_allocate_release_conservation
        grounds:
          - calculations.lot_mass_conservation
          - state_machines.MaterialAllocation.RESERVED_to_RELEASED
          - entities.MaterialLot.fields.available_kg
        distinguishing_aspect: |
          Conserved quantity = sheet mass (kg): allocate 4.000kg then release
          the same allocation; lot.available_kg must return bit-identical to
          its pre-pair 10.000 and the identity available == quantity -
          allocated - consumed must hold at every step.
        test_recipe:
          setup:
            - "CERTIFIED lot L-M 10.000kg; QUEUED order O-M (prototype tool, so no production path needed)"
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "LM", resin_type: HIPS, gauge_mm: 2.000, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 8.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "TM", part_number: "P-M", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 900.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-M9", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "OM", part_number: "P-M", resin_type: HIPS, ordered_qty: 50, required_gauge_mm: 2.000, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.500, spec_min_wall_mm: 1.400, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 50.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: true }, as: ProductionScheduler, captures: { order_id: $.data.id } }
            - { call: "GET /material-lots/${lot_id}", as: Any, captures: { avail0: $.data.available_kg, o_ver: $.data.version } }
          trigger:
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 4.000 }, as: ProductionScheduler, captures: { alloc_id: $.data.id } }
            - { call: "GET /material-lots/${lot_id}", as: Any, captures: { avail_mid: $.data.available_kg, alloc_mid: $.data.allocated_kg } }
            - { call: "POST /material-allocations/${alloc_id}/release", as: ProductionScheduler, captures: { alloc_st: $.data.status } }
            - { call: "GET /material-lots/${lot_id}", as: Any, captures: { avail_end: $.data.available_kg, alloc_end: $.data.allocated_kg, cons_end: $.data.consumed_kg } }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { o_ver_end: $.data.version } }
          assert:
            - "Baseline available_kg == 10.000 (captured ${avail0})"
            - "After allocate: available_kg == 6.000, allocated_kg == 4.000 (captured ${avail_mid} / ${alloc_mid})"
            - "After release: available_kg == 10.000 == quantity 10.000 - allocated 0.000 - consumed 0.000 (captured ${avail_end} / ${alloc_end} / ${cons_end}) — invariant restored bit-identical"
            - "MaterialAllocation.${alloc_id}.status == RELEASED (captured ${alloc_st})"
            - "ProductionOrder.${order_id}.version advanced 1 -> 2 -> 3 across allocate/release (captured ${o_ver_end} == 3)"
      - name: order_shot_complete_scrap_conservation
        grounds:
          - calculations.order_shot_conservation
          - state_machines.FormingRun.SCHEDULED_to_COMPLETED
          - state_machines.QualityInspection.RECORDED_to_DISPOSITIONED
          - entities.ProductionOrder.fields.shots_completed
          - entities.ProductionOrder.fields.shots_scrapped
        distinguishing_aspect: |
          Conserved quantity = shot unit count (distinct conserved-quantity
          type from sheet mass): a 60-shot run complete followed by a SCRAP
          disposition of 10 moves 10 from shots_completed to shots_scrapped;
          shots_completed + shots_scrapped == 60 == sum of COMPLETED run shots
          at every step.
        test_recipe:
          setup:
            - "RUNNING INDUSTRIAL order O-N (qty 100, spec_min 1.230); booth free"
          setup_api_calls:
            - { call: "POST /material-lots", payload: { lot_code: "LN", resin_type: PETG, gauge_mm: 1.500, cleanliness_grade_required: INDUSTRIAL, quantity_kg: 10.000, unit_cost_per_kg: 10.00 }, as: MaterialsPlanner, captures: { lot_id: $.data.id } }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: MATERIAL_LOT, subject_id: "${lot_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools", payload: { tool_code: "TN", part_number: "P-N", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1200.00 }, as: ToolingEngineer, captures: { tool_id: $.data.id } }
            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /tools/${tool_id}/submit-qualification", as: ToolingEngineer }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: TOOL, subject_id: "${tool_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools/${tool_id}/approve-production", payload: { production_cost: 8000.00, rated_lifetime_shots: 80000 }, as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-N", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.30 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "ST-N", resource_type: FORMING_STATION, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 55.00 }, as: ProductionScheduler, captures: { station_id: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "B-N", resource_type: INSPECTION_BOOTH, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 25.00 }, as: ProductionScheduler, captures: { booth_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "ON", part_number: "P-N", resin_type: PETG, ordered_qty: 100, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: false }, as: ProductionScheduler, captures: { order_id: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 5.900 }, as: ProductionScheduler }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { o_ver: $.data.version } }
            - { call: "POST /production-orders/${order_id}/stage", payload: { expected_production_order_version: "${o_ver}" }, as: ProductionScheduler }
          trigger:
            - { call: "POST /forming-runs", payload: { production_order_id: "${order_id}", station_id: "${station_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T11:00:00Z", oven_temp_c: 180.0, cycle_time_s: 30, shots_planned: 60 }, as: ProductionScheduler, captures: { run_id: $.data.id } }
            - { call: "POST /forming-runs/${run_id}/complete", payload: { shots_completed: 60, scrap_weight_kg: 1.000, actual_end: "2026-05-02T11:00:00Z" }, as: ProductionScheduler }
            - { call: "POST /quality-inspections", payload: { production_order_id: "${order_id}", forming_run_id: "${run_id}", booth_id: "${booth_id}", inspection_type: FIRST_ARTICLE, scheduled_start: "2026-05-02T12:00:00Z", scheduled_end: "2026-05-02T12:30:00Z", wall_measurements_mm: [1.100, 1.150] }, as: QualityInspector, as_user_id: qi-1, captures: { insp_id: $.data.id, min_w: $.data.min_wall_mm } }
            - { call: "POST /quality-inspections/${insp_id}/disposition", payload: { disposition: SCRAP, scrapped_qty: 10 }, as: QualityInspector, as_user_id: qi-2 }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { sc: $.data.shots_completed, ss: $.data.shots_scrapped, sched: $.data.schedule_status, qual: $.data.quality_status } }
          assert:
            - "min_wall_mm == 1.100 < spec_min 1.230 (captured ${min_w}) — SCRAP disposition consistent"
            - "After SCRAP: shots_completed == 50 and shots_scrapped == 10 (captured ${sc} / ${ss})"
            - "Invariant: shots_completed + shots_scrapped == 60 == sum of COMPLETED run shots (60) — compensating pair conserves shot count"
            - "Order remains RUNNING with quality PENDING (captured ${sched} / ${qual}) — scrapped shots must be re-run"
