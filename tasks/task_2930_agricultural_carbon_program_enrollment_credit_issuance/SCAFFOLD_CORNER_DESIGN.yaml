# §1.9 Scaffold Corner Design — agricultural carbon program enrollment & credit issuance
#
# Breadth probe over the claim-extraction guide's nine sections, walked against
# SCAFFOLD.yaml §1.1–§1.7. Depth corners already asserted by the nine rules of
# SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as `excluded_because:` stubs that
# cite the covering §1.8 instance by name.
#
# Shared conventions used by every chain below:
#   * the logical clock starts at 2026-08-01T00:00:00Z; every chain repositions it
#     explicitly with POST /_clock/set_current_utc before it depends on a crop year
#   * ProgramAdmin X-User-ID values are opaque strings; segregation of duties forces
#     distinct ids for screening vs baseline approval and for reversal report vs assess
#   * Grower callers pass as_user_id = the Grower row's id; Verifier callers pass
#     as_user_id = the VerificationBody row's id (§1.7 identity)
#   * every literal below that comes out of a §1.3 formula was computed by executing
#     that formula against its declared constants

scaffold_corner_design:

  # =====================================================================
  # 1. ENTITIES
  # =====================================================================
  - section: entities
    instances:

      - name: grower_creation_returns_success_envelope_with_system_defaults
        claim_type: creation
        grounds:
          - entities.Grower
          - response_envelope.success
          - endpoints[POST /growers]
        distinguishing_aspect: "A freshly created Grower carries id/created_at/updated_at/version stamped by the server, status ACTIVE, suspension_reason null and all five aggregate counters exactly 0 — none of which the request body supplies."
        test_recipe:
          setup:
            - "empty database; the logical clock is repositioned to 2026-06-01T00:00:00Z (crop year 2026)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /growers"
              payload: { legal_name: "Willow Creek Farms LLC", operator_type: "LLC", tax_id: "TX-4410-A", mailing_state: "IA" }
              as: ProgramAdmin
              captures: { g1_id: $.data.id, g1_version: $.data.version }
          assert:
            - "HTTP 201"
            - "response_type == \"object\" and meta.api_request_id and meta.api_request_timestamp are both present"
            - "data.id is a non-empty string; data.created_at and data.updated_at are ISO-8601 UTC instants; data.version == 1"
            - "data.legal_name == \"Willow Creek Farms LLC\", data.operator_type == \"LLC\", data.tax_id == \"TX-4410-A\", data.mailing_state == \"IA\""
            - "data.status == \"ACTIVE\" and data.suspension_reason == null"
            - "data.total_enrolled_acres == 0.00, data.lifetime_credits_issued == 0, data.net_paid_cents == 0, data.outstanding_clawback_cents == 0, data.reversal_count == 0"

      - name: field_mapped_acres_computed_from_rectangle_with_gross_acres_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Field.fields.mapped_acres
          - calculations.field_mapped_acres
          - endpoints[POST /growers/{grower_id}/fields]
        distinguishing_aspect: "mapped_acres is 1480.69 for a 3333x1777 rectangle (5,922,741 / 4000 = 1480.68525 rounded half-up at 2dp) regardless of the grower's claimed gross_acres of 9999.99, which is stored untouched."
        test_recipe:
          setup:
            - "one ACTIVE grower; no fields yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /growers"
              payload: { legal_name: "Prairie Line Partners", operator_type: "PARTNERSHIP", tax_id: "TX-5501-B", mailing_state: "NE" }
              as: ProgramAdmin
              captures: { g1_id: $.data.id }
          trigger:
            - call: "POST /growers/${g1_id}/fields"
              payload: { field_name: "North Quarter", boundary_min_x: 0, boundary_min_y: 0, boundary_max_x: 3333, boundary_max_y: 1777, gross_acres: 9999.99, soil_group: "LOAM", county_code: "NE-021" }
              as: ProgramAdmin
              captures: { f1_id: $.data.id }
          assert:
            - "HTTP 201"
            - "data.mapped_acres == 1480.69"
            - "data.gross_acres == 9999.99 — the grower's own claim is retained and never substituted for mapped_acres"
            - "data.status == \"DRAFT\" and data.surveyor_reference == null"
            - "data.grower_id == ${g1_id} and data.soil_group == \"LOAM\" and data.county_code == \"NE-021\""
            - "data.version == 1"

      - name: all_addressable_resources_return_not_found_for_unknown_ids
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - validations[priority=6]
          - errors[ERR_FIELD_NOT_FOUND]
          - errors[ERR_PRACTICE_HISTORY_NOT_FOUND]
          - errors[ERR_PRACTICE_STANDARD_NOT_FOUND]
          - errors[ERR_ENROLLMENT_NOT_FOUND]
          - errors[ERR_BASELINE_NOT_FOUND]
          - errors[ERR_DATA_PACKET_NOT_FOUND]
          - errors[ERR_QUANTIFICATION_RUN_NOT_FOUND]
          - errors[ERR_VERIFICATION_BODY_NOT_FOUND]
          - errors[ERR_VERIFICATION_NOT_FOUND]
          - errors[ERR_CREDIT_BATCH_NOT_FOUND]
          - errors[ERR_BUFFER_ACCOUNT_NOT_FOUND]
          - errors[ERR_REVERSAL_EVENT_NOT_FOUND]
          - errors[ERR_GROWER_PAYMENT_NOT_FOUND]
        distinguishing_aspect: "Each of the thirteen addressable resource families answers an unknown UUID with its OWN 404 error_id, and a body-level foreign key that does not resolve produces the referenced resource's 404 rather than ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "empty database apart from the startup-seeded PROGRAM_BUFFER pool; no row carries the probe UUID"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /growers"
              payload: { legal_name: "Cedar Bend Trust", operator_type: "TRUST", tax_id: "TX-6602-C", mailing_state: "IL" }
              as: ProgramAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /growers/${g1_id}/fields"
              payload: { field_name: "Home Block", boundary_min_x: 0, boundary_min_y: 0, boundary_max_x: 2000, boundary_max_y: 2000, gross_acres: 1000.00, soil_group: "LOAM" }
              as: ProgramAdmin
              captures: { f1_id: $.data.id }
          trigger:
            - call: "GET /fields/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ProgramAdmin
              captures: { e_field: $.data.error_id }
            - call: "GET /practice-history/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ProgramAdmin
              captures: { e_hist: $.data.error_id }
            - call: "GET /practice-standards/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ProgramAdmin
              captures: { e_std: $.data.error_id }
            - call: "GET /enrollments/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: ProgramAdmin
              captures: { e_enr: $.data.error_id }
            - call: "GET /baselines/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: ProgramAdmin
              captures: { e_base: $.data.error_id }
            - call: "GET /data-packets/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: ProgramAdmin
              captures: { e_pkt: $.data.error_id }
            - call: "GET /quantification-runs/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: ProgramAdmin
              captures: { e_run: $.data.error_id }
            - call: "GET /verification-bodies/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: ProgramAdmin
              captures: { e_vb: $.data.error_id }
            - call: "GET /verifications/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: ProgramAdmin
              captures: { e_ver: $.data.error_id }
            - call: "GET /credit-batches/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: ProgramAdmin
              captures: { e_cb: $.data.error_id }
            - call: "GET /buffer-accounts/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: ProgramAdmin
              captures: { e_buf: $.data.error_id }
            - call: "GET /reversal-events/00000000-0000-4000-8000-00000000000c"
              payload: {}
              as: ProgramAdmin
              captures: { e_rev: $.data.error_id }
            - call: "GET /grower-payments/00000000-0000-4000-8000-00000000000d"
              payload: {}
              as: ProgramAdmin
              captures: { e_pay: $.data.error_id }
            - call: "POST /enrollments"
              payload: { field_id: "00000000-0000-4000-8000-00000000000e", practice_standard_id: "00000000-0000-4000-8000-00000000000f", commitment_years: 5, start_crop_year: 2026, enrolled_acres: 100.00, payment_model: "PER_CREDIT", per_credit_share_pct: 60.00 }
              as: ProgramAdmin
              captures: { e_body_field: $.data.error_id }
            - call: "POST /growers/00000000-0000-4000-8000-000000000010/fields"
              payload: { field_name: "", boundary_min_x: 10, boundary_min_y: 0, boundary_max_x: 5, boundary_max_y: 20, gross_acres: -1.00, soil_group: "MARS_REGOLITH" }
              as: ProgramAdmin
              captures: { e_left: $.data.error_id }
          assert:
            - "every trigger returns HTTP 404"
            - "error_ids in order: ERR_FIELD_NOT_FOUND, ERR_PRACTICE_HISTORY_NOT_FOUND, ERR_PRACTICE_STANDARD_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_BASELINE_NOT_FOUND, ERR_DATA_PACKET_NOT_FOUND, ERR_QUANTIFICATION_RUN_NOT_FOUND, ERR_VERIFICATION_BODY_NOT_FOUND, ERR_VERIFICATION_NOT_FOUND, ERR_CREDIT_BATCH_NOT_FOUND, ERR_BUFFER_ACCOUNT_NOT_FOUND, ERR_REVERSAL_EVENT_NOT_FOUND, ERR_GROWER_PAYMENT_NOT_FOUND"
            - "the body-FK trigger returns ERR_FIELD_NOT_FOUND (404) — field_id is checked before practice_standard_id and before any §1.4 priority 15 term"
            - "the last trigger returns ERR_GROWER_NOT_FOUND (404), not ERR_INVALID_REQUEST — §1.4 priority 3 resolves path parameters left-to-right ahead of the priority 5 body check even though field_name, gross_acres, soil_group and the boundary pair are all invalid"
            - "every error response carries response_type == \"error\" and data.message as a non-empty string"

      - name: practice_history_is_immutable_with_no_version_field_and_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.PracticeHistory
          - endpoints[GET /practice-history/{practice_history_id}]
          - endpoints[GET /practice-history]
        distinguishing_aspect: "PracticeHistory is the scaffold's only common_fields:false entity — its read carries no version key and §1.5 declares no PATCH/POST mutation for it, so evidence is corrected by filing another row, never by editing one."
        test_recipe:
          setup:
            - "one ACTIVE grower with one DRAFT field and two filed practice-history rows for crop years 2021 and 2022"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /growers"
              payload: { legal_name: "Two Rivers Corp", operator_type: "CORPORATION", tax_id: "TX-7703-D", mailing_state: "MN" }
              as: ProgramAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /growers/${g1_id}/fields"
              payload: { field_name: "River Flat", boundary_min_x: 0, boundary_min_y: 0, boundary_max_x: 2000, boundary_max_y: 2000, gross_acres: 1000.00, soil_group: "LOAM" }
              as: ProgramAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2021, practice_code: "COVER_CROP", adopted: true, evidence_source: "FARM_RECORD", acres: 200.00, observed_emissions_per_acre: 0.1000 }
              as: ProgramAdmin
              captures: { h1_id: $.data.id }
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2022, practice_code: "COVER_CROP", adopted: false, evidence_source: "FARM_RECORD", acres: 0.00, observed_emissions_per_acre: 0.1500 }
              as: ProgramAdmin
              captures: { h2_id: $.data.id }
          trigger:
            - call: "GET /practice-history/${h1_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /practice-history"
              payload: { field_id: "${f1_id}", crop_year: 2021 }
              as: ProgramAdmin
          assert:
            - "HTTP 200 on both reads"
            - "the single-row read exposes exactly field_id, crop_year, practice_code, adopted, evidence_source, acres, observed_emissions_per_acre plus id and created_at"
            - "the single-row read carries NO version key and NO updated_at key — PracticeHistory declares common_fields: false"
            - "the filtered list returns total_count == 1 and data[0].id == ${h1_id}; the 2022 row is excluded by the crop_year filter"
            - "§1.5 declares no PATCH or POST endpoint that mutates an existing PracticeHistory row — the only write path is POST /fields/{field_id}/practice-history, which appends"

      - name: enrollment_listing_paginates_filters_and_reports_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /enrollments]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three DRAFT enrollments across two growers, limit 2 / offset 0 returns 2 rows with total_count 3 and has_more true; offset 2 returns 1 row with has_more false; a payment_model filter narrows total_count to 1 while keeping the same envelope shape."
        test_recipe:
          setup:
            - "two ACTIVE growers; grower 1 holds two MAPPED fields, grower 2 holds one MAPPED field (identical coordinates are legal across growers because §1.4 priority 16 is grower-scoped)"
            - "three DRAFT enrollments: two PER_CREDIT under grower 1, one PER_ACRE under grower 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /practice-standards"
              payload: { practice_code: "COVER_CROP", standard_version: 1, additionality_lookback_years: 5, max_prior_adoption_pct: 20.00, min_documented_years: 4, min_adoption_years: 3, uncertainty_base_pct: 15.00, sequestration_rate_per_acre: 0.3500, modeled_baseline_rate_per_acre: 0.2000, buffer_base_pct: 10.00, telemetry_required: true, effective_from: "2020-01-01" }
              as: ProgramAdmin
              captures: { std_id: $.data.id }
            - call: "POST /growers"
              payload: { legal_name: "Alder Ridge Farms", operator_type: "LLC", tax_id: "TX-8804-E", mailing_state: "IA" }
              as: ProgramAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /growers"
              payload: { legal_name: "Beacon Hollow Farms", operator_type: "SOLE_PROPRIETOR", tax_id: "TX-8805-F", mailing_state: "IA" }
              as: ProgramAdmin
              captures: { g2_id: $.data.id }
            - call: "POST /growers/${g1_id}/fields"
              payload: { field_name: "A-1", boundary_min_x: 0, boundary_min_y: 0, boundary_max_x: 2000, boundary_max_y: 2000, gross_acres: 1000.00, soil_group: "LOAM" }
              as: ProgramAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /growers/${g1_id}/fields"
              payload: { field_name: "A-2", boundary_min_x: 2000, boundary_min_y: 0, boundary_max_x: 4000, boundary_max_y: 2000, gross_acres: 1000.00, soil_group: "CLAY" }
              as: ProgramAdmin
              captures: { f2_id: $.data.id }
            - call: "POST /growers/${g2_id}/fields"
              payload: { field_name: "B-1", boundary_min_x: 0, boundary_min_y: 0, boundary_max_x: 2000, boundary_max_y: 2000, gross_acres: 1000.00, soil_group: "SAND" }
              as: ProgramAdmin
              captures: { f3_id: $.data.id }
            - call: "POST /fields/${f1_id}/map-confirm"
              payload: { surveyor_reference: "SUR-A1" }
              as: ProgramAdmin
            - call: "POST /fields/${f2_id}/map-confirm"
              payload: { surveyor_reference: "SUR-A2" }
              as: ProgramAdmin
            - call: "POST /fields/${f3_id}/map-confirm"
              payload: { surveyor_reference: "SUR-B1" }
              as: ProgramAdmin
            - call: "POST /enrollments"
              payload: { field_id: "${f1_id}", practice_standard_id: "${std_id}", commitment_years: 5, start_crop_year: 2026, enrolled_acres: 1000.00, payment_model: "PER_CREDIT", per_credit_share_pct: 60.00 }
              as: ProgramAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { field_id: "${f2_id}", practice_standard_id: "${std_id}", commitment_years: 5, start_crop_year: 2026, enrolled_acres: 1000.00, payment_model: "PER_CREDIT", per_credit_share_pct: 55.00 }
              as: ProgramAdmin
              captures: { e2_id: $.data.id }
            - call: "POST /enrollments"
              payload: { field_id: "${f3_id}", practice_standard_id: "${std_id}", commitment_years: 5, start_crop_year: 2026, enrolled_acres: 1000.00, payment_model: "PER_ACRE", per_acre_rate_cents: 1000.00 }
              as: ProgramAdmin
              captures: { e3_id: $.data.id }
          trigger:
            - call: "GET /enrollments"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
            - call: "GET /enrollments"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdmin
            - call: "GET /enrollments"
              payload: { payment_model: "PER_ACRE" }
              as: ProgramAdmin
            - call: "GET /enrollments"
              payload: { grower_id: "${g1_id}", status: "DRAFT" }
              as: ProgramAdmin
          assert:
            - "HTTP 200 with response_type == \"array\" on all four reads"
            - "read 1: len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "read 2: len(data) == 1, total_count == 3, has_more == false, offset == 2"
            - "read 3: total_count == 1 and data[0].id == ${e3_id}"
            - "read 4: total_count == 2 and the returned ids are exactly {${e1_id}, ${e2_id}}"
            - "reads 1 and 2 together return the three ids {${e1_id}, ${e2_id}, ${e3_id}} with no duplicate and no omission"

      - name: enrollment_parent_relationship_binds_grower_through_field
        claim_type: parent_relationships
        grounds:
          - entities.Enrollment.fields.grower_id
          - entities.Enrollment.fields.field_id
          - endpoints[POST /enrollments]
          - endpoints[GET /enrollments]
        distinguishing_aspect: "Enrollment.grower_id is never supplied on the request — it is copied transitively from Field.grower_id at creation, and the filtered list GET /enrollments?grower_id= resolves the enrollment back from that copied parent."
        test_recipe:
          setup:
            - "one ACTIVE grower with one MAPPED field and one ACTIVE practice standard"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /practice-standards"
              payload: { practice_code: "REDUCED_TILL", standard_version: 1, additionality_lookback_years: 5, max_prior_adoption_pct: 20.00, min_documented_years: 4, min_adoption_years: 3, uncertainty_base_pct: 15.00, sequestration_rate_per_acre: 0.3000, modeled_baseline_rate_per_acre: 0.1800, buffer_base_pct: 10.00, telemetry_required: false, effective_from: "2020-01-01" }
              as: ProgramAdmin
              captures: { std_id: $.data.id }
            - call: "POST /growers"
              payload: { legal_name: "Sandhill Acres", operator_type: "LLC", tax_id: "TX-9905-G", mailing_state: "KS" }
              as: ProgramAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /growers/${g1_id}/fields"
              payload: { field_name: "West Pivot", boundary_min_x: 0, boundary_min_y: 0, boundary_max_x: 2000, boundary_max_y: 2000, gross_acres: 1000.00, soil_group: "SAND" }
              as: ProgramAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /fields/${f1_id}/map-confirm"
              payload: { surveyor_reference: "SUR-WP" }
              as: ProgramAdmin
          trigger:
            - call: "POST /enrollments"
              payload: { field_id: "${f1_id}", practice_standard_id: "${std_id}", commitment_years: 4, start_crop_year: 2026, enrolled_acres: 900.00, payment_model: "PER_ACRE", per_acre_rate_cents: 800.00 }
              as: ProgramAdmin
              captures: { e1_id: $.data.id }
            - call: "GET /enrollments"
              payload: { grower_id: "${g1_id}" }
              as: ProgramAdmin
            - call: "GET /enrollments"
              payload: { field_id: "${f1_id}" }
              as: ProgramAdmin
          assert:
            - "HTTP 201 on creation"
            - "data.grower_id == ${g1_id} even though grower_id was not in the request body"
            - "data.practice_code == \"REDUCED_TILL\" and data.pinned_standard_version == 1 — both copied from the standard at creation"
            - "data.status == \"DRAFT\", data.permanence_status is the create-time default, data.credits_issued_total == 0, data.accrued_payment_cents == 0"
            - "data.additionality_score == null and data.documented_years == null before submission — screening has not run"
            - "both filtered reads return total_count == 1 with data[0].id == ${e1_id}"

  # =====================================================================
  # 2. STATE MACHINES
  # =====================================================================
  - section: state_machines
    instances:

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Field.initial_state
          - state_machines.Enrollment.initial_state
          - state_machines.Baseline.initial_state
          - state_machines.DataPacket.initial_state
          - state_machines.QuantificationRun.initial_state
        distinguishing_aspect: "Baseline opens PROPOSED (not APPROVED), DataPacket opens qc_status PENDING with completeness_status derived from coverage_pct on the same request, and QuantificationRun opens DRAFT with its removals already computed — creation never short-circuits into a later state."
        test_recipe:
          setup:
            - "logical clock at 2026-06-01 (crop year 2026); one ACTIVE COVER_CROP standard v1 (lookback 5, max_prior 20.00, min_documented 4, min_adoption 3, uncertainty_base 15.00, seq 0.3500, modeled_baseline 0.2000, buffer_base 10.00, telemetry_required true)"
            - "one ACTIVE grower with one field mapped to 1000.00 acres and five documented practice-history years (2021 adopted, 2022 adopted, 2023–2025 not adopted)"
            - "an ACCEPTED enrollment for 1000.00 acres over 5 commitment years starting 2026"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /practice-standards"
              payload: { practice_code: "COVER_CROP", standard_version: 1, additionality_lookback_years: 5, max_prior_adoption_pct: 20.00, min_documented_years: 4, min_adoption_years: 3, uncertainty_base_pct: 15.00, sequestration_rate_per_acre: 0.3500, modeled_baseline_rate_per_acre: 0.2000, buffer_base_pct: 10.00, telemetry_required: true, effective_from: "2020-01-01" }
              as: ProgramAdmin
              captures: { std_id: $.data.id }
            - call: "POST /growers"
              payload: { legal_name: "Rockford Grain Co", operator_type: "CORPORATION", tax_id: "TX-1001-H", mailing_state: "IA" }
              as: ProgramAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /growers/${g1_id}/fields"
              payload: { field_name: "Section 12", boundary_min_x: 0, boundary_min_y: 0, boundary_max_x: 2000, boundary_max_y: 2000, gross_acres: 1000.00, soil_group: "LOAM" }
              as: ProgramAdmin
              captures: { f1_id: $.data.id, f1_status_at_create: $.data.status }
            - call: "POST /fields/${f1_id}/map-confirm"
              payload: { surveyor_reference: "SUR-S12" }
              as: ProgramAdmin
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 2021, practice_code: "COVER_CROP", adopted: true, evidence_source: "FARM_RECORD", acres: 200.00, observed_emissions_per_acre: 0.1000 }
