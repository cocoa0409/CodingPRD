              captures: { doc1_im: $.data.id }
            - call: "POST /lending/contracts/${k_im}/documents"
              payload: { doc_type: "TITLE_APPLICATION", document_reference: "IMG-im-TTL" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { doc2_im: $.data.id }
            - call: "POST /lending/documents/${doc1_im}/verify"
              payload: { outcome: "VERIFY" }
              as: FundingSpecialist
              as_user_id: "fs-001"
            - call: "POST /lending/documents/${doc2_im}/verify"
              payload: { outcome: "VERIFY" }
              as: FundingSpecialist
              as_user_id: "fs-001"
            - call: "POST /lending/contracts/${k_im}/fund"
              payload: { funding_date: "2026-08-01T00:00:00Z" }
              as: FundingSpecialist
              as_user_id: "fs-001"
          trigger:
            - call: "POST /lending/dealers/${d1}/status"
              payload: { action: "TERMINATE", reason: "PROGRAM_EXIT" }
              as: PortfolioAdmin
              captures: { im_status: $.data.status, im_version: $.data.version }
            - call: "GET /lending/dealer-agreements/${ag1}"
              payload: {}
              as: PortfolioAdmin
              captures: { im_ag_status: $.data.status }
            - call: "GET /lending/buyback-demands"
              payload: { contract_id: "${k_im}" }
              as: PortfolioAdmin
              captures: { im_bb_status: "$.data[0].status" }
          assert:
            - "The TERMINATE response body itself carries data.status == 'TERMINATED'"
            - "${im_ag_status} == 'TERMINATED' on the very next read"
            - "${im_bb_status} == 'ISSUED' and the demand's reason == 'DEALER_TERMINATION'"
            - "RetailContract.${k_im}.reserve_status == 'HELD' on the very next read"
