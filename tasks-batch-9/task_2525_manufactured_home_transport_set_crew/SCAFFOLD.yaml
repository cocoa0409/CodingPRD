scenario: |
  Generate task harder than expert level!

  2525. Manufactured Home Transport & Set Crew (Champion Home Builders installation network): transport permit routing by width, height and state, escort and pilot-car requirements on the delivery route, site readiness inspection (pad, pier plan, utilities) before dispatch, multi-section marriage line alignment and closure, anchoring and foundation certification per HUD and state installation standards, utility crossover, skirting and steps scope split, damage-in-transit claim adjudication between plant, hauler and installer, final installation inspection and warranty start

domain_name: manufactured-home-transport-set
api_prefix: /installations

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  entity_topology_note: |
    Peer collections joined by explicit foreign keys with no nesting in URL paths.
    HomeSection.mates_to_section_id is self-referential; EscortAssignment is a
    junction between RouteLeg and EscortCrew; DamageClaim fans out to four
    independent aggregates (InstallationOrder, HomeSection, Hauler, SetCrew),
    so the reference graph is a DAG with cross-aggregate edges rather than a tree.

  state_machine_shape: branching
  state_machine_shape_note: |
    AnchorCertification is cyclic (SUBMITTED -> CHANGES_REQUIRED -> SUBMITTED).
    SetJob carries two independent state dimensions (progress_status x scope_status).
    DamageClaim forks UNDER_REVIEW -> {STAGE allocation, EVIDENCE allocation} -> ADJUDICATED
    with divergent side-effect sets, and cycles UNDER_REVIEW -> DISPUTED -> UNDER_REVIEW.
    InstallationOrder.posture is a derived aggregate over descendants that gates dispatch.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  role_model_note: |
    Seven roles. Peer ownership by entity-backed identity (PlantDispatcher/Plant,
    TransportManager/Hauler, SetCrewLead/SetCrew) plus a hard segregation-of-duties
    rule: the InstallationInspector operator id recorded on Site.last_inspector_user_id
    may not perform the final installation inspection on the same order.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plant
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        required: true
        description: Champion manufacturing plant trade name.
      - name: state_code
        type: string
        source: input
        required: true
        description: Two-letter US state code the plant operates from.
        constraints: "exactly 2 uppercase letters"
      - name: hud_plant_code
        type: string
        source: input
        required: true
        description: HUD-assigned plant certification code; unique across Plant rows.
        constraints: "unique across all Plant rows"
      - name: chargeback_balance_cents
        type: integer
        source: computed
        required: false
        description: "Running total of plant_charge_cents over DamageClaim rows with status == ADJUDICATED whose order_id resolves to an InstallationOrder with this plant_id; recomputed by calculations.party_chargeback_ledger."
        default: 0
      - name: status
        type: enum
        source: computed
        required: false
        description: "ACTIVE while chargeback_balance_cents < PLANT_PROBATION_THRESHOLD_CENTS; PROBATION at or above it."
        default: ACTIVE
        constraints: "one of {ACTIVE, PROBATION}"

  - name: Hauler
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        required: true
        description: Transport company trade name.
      - name: dot_number
        type: string
        source: input
        required: true
        description: USDOT motor carrier number; unique across Hauler rows.
        constraints: "unique across all Hauler rows"
      - name: insurance_expiry_date
        type: string
        source: input
        required: true
        description: "Cargo insurance expiry, YYYY-MM-DD."
        constraints: "YYYY-MM-DD"
      - name: endorsed_states
        type: array
        source: input
        required: true
        description: State codes the hauler is permitted to haul oversize loads in.
        constraints: "non-empty array of 2-letter state codes"
      - name: chargeback_balance_cents
        type: integer
        source: computed
        required: false
        description: "Running total of hauler_charge_cents over DamageClaim rows with status == ADJUDICATED and hauler_id == this hauler; recomputed by calculations.party_chargeback_ledger."
        default: 0
      - name: status
        type: enum
        source: computed
        required: false
        description: "ACTIVE while chargeback_balance_cents < HAULER_SUSPENSION_THRESHOLD_CENTS; SUSPENDED at or above it; returns to ACTIVE when a reversal drops the balance back below the threshold."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: EscortCrew
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: vendor_name
        type: string
        source: input
        required: true
        description: Escort / pilot-car vendor trade name.
      - name: endorsed_states
        type: array
        source: input
        required: true
        description: State codes this crew holds a certified-escort endorsement in.
        constraints: "non-empty array of 2-letter state codes"
      - name: certified_roles
        type: array
        source: input
        required: true
        description: "Escort roles the crew may be assigned to; subset of {ESCORT, PILOT_CAR}."
        constraints: "non-empty subset of {ESCORT, PILOT_CAR}"
      - name: endorsement_class
        type: enum
        source: input
        required: true
        description: "Highest permit class this crew is endorsed to escort. SUPERLOAD covers superload, oversize and standard loads; OVERSIZE covers oversize and standard; STANDARD covers standard only."
        constraints: "one of {STANDARD, OVERSIZE, SUPERLOAD}"
      - name: buffer_minutes
        type: integer
        source: input
        required: false
        description: Turnaround buffer inflating both ends of every reserved window for overlap detection.
        default: 45
        constraints: "0 <= buffer_minutes <= 240"
      - name: max_reserved_minutes
        type: integer
        source: input
        required: false
        description: Reserved-minute ceiling above which the crew is considered OVERBOOKED.
        default: 600
        constraints: "max_reserved_minutes >= 1"
      - name: reserved_minutes
        type: integer
        source: computed
        required: false
        description: "Full recompute per calculations.escort_reserved_minutes over EscortAssignment rows with status == RESERVED."
        default: 0
      - name: status
        type: enum
        source: computed
        required: false
        description: "AVAILABLE while reserved_minutes <= max_reserved_minutes; OVERBOOKED once reserved_minutes > max_reserved_minutes."
        default: AVAILABLE
        constraints: "one of {AVAILABLE, OVERBOOKED}"

  - name: SetCrew
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: company_name
        type: string
        source: input
        required: true
        description: Installer / set-crew company trade name.
      - name: hud_installer_license_no
        type: string
        source: input
        required: true
        description: State-issued HUD installer license number; unique across SetCrew rows.
        constraints: "unique across all SetCrew rows"
      - name: license_state
        type: string
        source: input
        required: true
        description: State that issued hud_installer_license_no.
        constraints: "exactly 2 uppercase letters"
      - name: license_expiry_date
        type: string
        source: input
        required: true
        description: "Installer license expiry, YYYY-MM-DD."
        constraints: "YYYY-MM-DD"
      - name: daily_capacity
        type: integer
        source: input
        required: false
        description: Maximum number of concurrently-scheduled SetJob rows the crew may hold on any single calendar day.
        default: 1
        constraints: "1 <= daily_capacity <= 4"
      - name: chargeback_balance_cents
        type: integer
        source: computed
        required: false
        description: "Running total of installer_charge_cents over DamageClaim rows with status == ADJUDICATED and set_crew_id == this crew; recomputed by calculations.party_chargeback_ledger."
        default: 0
      - name: status
        type: enum
        source: computed
        required: false
        description: "ACTIVE while license_expiry_date >= the logical clock's current UTC date; LICENSE_EXPIRED once license_expiry_date < that date."
        default: ACTIVE
        constraints: "one of {ACTIVE, LICENSE_EXPIRED}"

  - name: InstallationOrder
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: plant_id
        type: string
        source: input
        required: true
        description: "FK -> Plant.id; the building plant that manufactured the home."
      - name: dealer_name
        type: string
        source: input
        required: true
        description: Retail dealer that sold the home.
      - name: home_model
        type: string
        source: input
        required: true
        description: Champion model designation.
      - name: section_count
        type: integer
        source: input
        required: true
        description: Dealer-declared number of floors (sections) in the home; drives required marriage-joint count and required anchor count.
        constraints: "1 <= section_count <= 4"
      - name: destination_state
        type: string
        source: input
        required: true
        description: Two-letter state code of the delivery site.
        constraints: "exactly 2 uppercase letters"
      - name: wind_zone
        type: enum
        source: input
        required: true
        description: "HUD wind zone of the destination; one of {I, II, III}."
        constraints: "one of {I, II, III}"
      - name: posture
        type: enum
        source: computed
        required: false
        description: "Derived aggregate gate over the order's descendants; recomputed by calculations.order_posture after every mutation to the order or any descendant."
        default: OPEN
        constraints: "one of {OPEN, TRANSPORT_BLOCKED, SET_IN_PROGRESS, SITE_BLOCKED, CLOSED}"
      - name: warranty_start_date
        type: string
        source: computed
        required: false
        description: "UTC date (YYYY-MM-DD) read off the logical clock at the moment the final installation inspection passes; null until then."
        default: null
      - name: invoice_total_cents
        type: integer
        source: computed
        required: false
        description: "Mirror of SetJob.invoice_total_cents for the SetJob that reached progress_status == CLOSED; null until then."
        default: null

  - name: HomeSection
    parent: InstallationOrder
    common_fields: true
    entity_kind: resource
    fields:
      - name: order_id
        type: string
        source: input
        required: true
        description: "FK -> InstallationOrder.id; the order this floor belongs to."
      - name: mates_to_section_id
        type: string
        source: input
        required: false
        description: "FK -> HomeSection.id; self-referential pointer to the sibling section this floor mates against on the marriage line; null for a single-wide."
        default: null
      - name: section_index
        type: integer
        source: input
        required: true
        description: 1-based floor index within the order; unique per order_id.
        constraints: "1 <= section_index <= 4, unique per (order_id, section_index)"
      - name: declared_width_in
        type: number
        source: input
        required: true
        description: Dealer-declared box width in inches, used by the PROVISIONAL permit-fee variant.
        constraints: "120 <= declared_width_in <= 240"
      - name: declared_height_in
        type: number
        source: input
        required: true
        description: Dealer-declared travel height in inches, used by the PROVISIONAL permit-fee variant.
        constraints: "120 <= declared_height_in <= 200"
      - name: declared_length_in
        type: number
        source: input
        required: true
        description: Dealer-declared box length in inches.
      - name: declared_weight_lb
        type: integer
        source: input
        required: true
        description: Dealer-declared shipping weight in pounds.
      - name: measured_width_in
        type: number
        source: computed
        required: false
        description: "Plant-QC measured box width recorded by POST /installations/sections/{id}/measure; null until measured. The FINAL permit-fee variant reads this, falling back to declared_width_in when null."
        default: null
      - name: measured_height_in
        type: number
        source: computed
        required: false
        description: "Plant-QC measured travel height recorded by POST /installations/sections/{id}/measure; null until measured. The FINAL permit-fee variant reads this, falling back to declared_height_in when null."
        default: null
      - name: transit_status
        type: enum
        source: computed
        required: false
        description: "Transport lifecycle of this floor; see state_machines.HomeSection."
        default: AT_PLANT
        constraints: "one of {AT_PLANT, MEASURED, PERMIT_PENDING, DISPATCH_READY, IN_TRANSIT, DELIVERED, PERMIT_REVOKED_HOLD, DAMAGED_HOLD}"

  - name: Site
    parent: InstallationOrder
    common_fields: true
    entity_kind: resource
    fields:
      - name: order_id
        type: string
        source: input
        required: true
        description: "FK -> InstallationOrder.id; the order whose home lands on this site."
      - name: pad_type
        type: enum
        source: input
        required: true
        description: "Foundation pad type; one of {SLAB, RUNNER, CROSSING_BEAM}."
        constraints: "one of {SLAB, RUNNER, CROSSING_BEAM}"
      - name: pier_plan_ref
        type: string
        source: input
        required: true
        description: Engineered pier-plan document reference.
      - name: pier_count
        type: integer
        source: input
        required: true
        description: Number of piers laid out by the pier plan.
        constraints: "pier_count >= 0"
      - name: utility_water
        type: boolean
        source: input
        required: true
        description: Water stub-out present and pressure-tested at the pad.
      - name: utility_sewer
        type: boolean
        source: input
        required: true
        description: Sewer stub-out present at the pad.
      - name: utility_electric
        type: boolean
        source: input
        required: true
        description: Electric service pedestal energized at the pad.
      - name: readiness_status
        type: enum
        source: computed
        required: false
        description: "Site readiness gate for dispatch; see state_machines.Site."
        default: READINESS_PENDING
        constraints: "one of {READINESS_PENDING, READINESS_FAILED, READY}"
      - name: inspection_round
        type: integer
        source: computed
        required: false
        description: Count of readiness inspections performed on this site.
        default: 0
      - name: last_inspector_user_id
        type: string
        source: computed
        required: false
        description: "X-User-ID of the InstallationInspector operator who performed the most recent readiness inspection; the segregation-of-duties check on final inspection compares against this value. Null until the first inspection."
        default: null
      - name: blocking_defect_count
        type: integer
        source: computed
        required: false
        description: "Count of failed readiness dimensions on the most recent inspection, per calculations.site_readiness_evaluation."
        default: 0

  - name: TransportPermit
    parent: HomeSection
    common_fields: true
    entity_kind: resource
    fields:
      - name: section_id
        type: string
        source: input
        required: true
        description: "FK -> HomeSection.id; the floor this permit moves."
      - name: state_code
        type: string
        source: input
        required: true
        description: Issuing state for this permit.
        constraints: "exactly 2 uppercase letters"
      - name: night_move
        type: boolean
        source: input
        required: false
        description: Whether the move is authorized outside daylight hours; adds an escort per the escort matrix.
        default: false
      - name: planned_leg_count
        type: integer
        source: input
        required: true
        description: Leg count declared at request time; the PROVISIONAL fee variant bills this number of legs.
        constraints: "1 <= planned_leg_count <= 6"
      - name: permit_class
        type: enum
        source: computed
        required: false
        description: "Width band per calculations.escort_requirement_matrix; one of {STANDARD, OVERSIZE, SUPERLOAD}."
        constraints: "one of {STANDARD, OVERSIZE, SUPERLOAD}"
      - name: escort_count_required
        type: integer
        source: computed
        required: false
        description: Certified escorts the permit demands, per calculations.escort_requirement_matrix.
      - name: pilot_car_required
        type: boolean
        source: computed
        required: false
        description: Whether at least one PILOT_CAR reservation is demanded, per calculations.escort_requirement_matrix.
      - name: provisional_fee_cents
        type: integer
        source: computed
        required: false
        description: "PROVISIONAL variant of calculations.permit_fee_assessment, computed at permit request from declared dimensions and planned_leg_count."
      - name: final_fee_cents
        type: integer
        source: computed
        required: false
        description: "FINAL variant of calculations.permit_fee_assessment, computed at issuance from measured dimensions and the permit's actual non-cancelled legs; null until issuance is attempted."
        default: null
      - name: paid_amount_cents
        type: integer
        source: computed
        required: false
        description: Cumulative amount remitted through POST /installations/permits/{id}/pay-fee.
        default: 0
      - name: valid_until_date
        type: string
        source: computed
        required: false
        description: "Issuance date read off the logical clock plus PERMIT_VALID_DAYS, as YYYY-MM-DD; null until ISSUED."
        default: null
      - name: status
        type: enum
        source: computed
        required: false
        description: "Permit lifecycle; see state_machines.TransportPermit."
        default: REQUESTED
        constraints: "one of {REQUESTED, FEE_PAID, ISSUED, REVOKED, SUPERSEDED}"

  - name: RouteLeg
    parent: TransportPermit
    common_fields: true
    entity_kind: resource
    fields:
      - name: permit_id
        type: string
        source: input
        required: true
        description: "FK -> TransportPermit.id; the permit that authorizes this leg."
      - name: hauler_id
        type: string
        source: input
        required: true
        description: "FK -> Hauler.id; the motor carrier running this leg."
      - name: sequence_no
        type: integer
        source: input
        required: true
        description: 1-based leg order along the delivery route; unique per permit_id.
        constraints: "1 <= sequence_no <= 6, unique per (permit_id, sequence_no)"
      - name: corridor_id
        type: string
        source: input
        required: true
        description: Named highway corridor the leg occupies.
      - name: state_code
        type: string
        source: input
        required: true
        description: State the leg runs through; escort endorsements are checked against this value.
        constraints: "exactly 2 uppercase letters"
      - name: window_start
        type: datetime
        source: input
        required: true
        description: "Leg movement window opening instant, ISO 8601 UTC with three fractional digits."
      - name: window_end
        type: datetime
        source: input
        required: true
        description: "Leg movement window closing instant, ISO 8601 UTC with three fractional digits; must be strictly after window_start."
      - name: status
        type: enum
        source: computed
        required: false
        description: "Leg lifecycle; see state_machines.RouteLeg."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_TRANSIT, ARRIVED, CANCELLED, HAULER_HOLD}"

  - name: EscortAssignment
    parent: RouteLeg
    common_fields: true
    entity_kind: resource
    fields:
      - name: route_leg_id
        type: string
        source: input
        required: true
        description: "FK -> RouteLeg.id; the leg this reservation covers."
      - name: escort_crew_id
        type: string
        source: input
        required: true
        description: "FK -> EscortCrew.id; the reserved escort or pilot-car crew."
      - name: role
        type: enum
        source: input
        required: true
        description: "Reservation role; one of {ESCORT, PILOT_CAR}."
        constraints: "one of {ESCORT, PILOT_CAR}"
      - name: window_start
        type: datetime
        source: input
        required: true
        description: "Reservation opening instant, ISO 8601 UTC; must be >= the leg's window_start."
      - name: window_end
        type: datetime
        source: input
        required: true
        description: "Reservation closing instant, ISO 8601 UTC; must be <= the leg's window_end and strictly after window_start."
      - name: reserved_minutes
        type: integer
        source: computed
        required: false
        description: "round_half_up((window_end - window_start) in seconds / 60) at creation; frozen thereafter."
      - name: status
        type: enum
        source: computed
        required: false
        description: "Reservation lifecycle; see state_machines.EscortAssignment."
        default: RESERVED
        constraints: "one of {RESERVED, RELEASED, COMPLETED}"

  - name: SetJob
    parent: InstallationOrder
    common_fields: true
    entity_kind: resource
    fields:
      - name: order_id
        type: string
        source: input
        required: true
        description: "FK -> InstallationOrder.id; the order being set."
      - name: set_crew_id
        type: string
        source: input
        required: true
        description: "FK -> SetCrew.id; the installer crew booked for the set."
      - name: scheduled_start_date
        type: string
        source: input
        required: true
        description: "First calendar day the crew is committed, YYYY-MM-DD; the day-capacity interval is closed at both ends."
        constraints: "YYYY-MM-DD"
      - name: scheduled_end_date
        type: string
        source: input
        required: true
        description: "Last calendar day the crew is committed, YYYY-MM-DD; must be >= scheduled_start_date."
        constraints: "YYYY-MM-DD"
      - name: labor_base_cents
        type: integer
        source: input
        required: true
        description: Contracted set-labor base amount before scope, crossover and volume discount.
        constraints: "labor_base_cents >= 0"
      - name: progress_status
        type: enum
        source: computed
        required: false
        description: "Set-execution dimension; evolves independently of scope_status. See state_machines.SetJob."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, DISPATCHED, SET_COMPLETE, CLOSED, SUPERSEDED}"
      - name: scope_status
        type: enum
        source: computed
        required: false
        description: "Scope-delivery dimension (skirting/steps split then utility crossover); evolves independently of progress_status. See state_machines.SetJob."
        default: SCOPE_PENDING
        constraints: "one of {SCOPE_PENDING, SCOPE_SPLIT, SCOPE_DELIVERED}"
      - name: skirting_owner
        type: enum
        source: computed
        required: false
        description: "Party that owns skirting scope, recorded by the scope-split action; one of {DEALER, INSTALLER}; null until split."
        default: null
      - name: steps_owner
        type: enum
        source: computed
        required: false
        description: "Party that owns steps scope, recorded by the scope-split action; one of {DEALER, INSTALLER}; null until split."
        default: null
      - name: skirting_fee_cents
        type: integer
        source: computed
        required: false
        description: "Installer-billable skirting line per calculations.installation_invoice_total step 1; 0 when skirting_owner == DEALER."
        default: 0
      - name: steps_fee_cents
        type: integer
        source: computed
        required: false
        description: "Installer-billable steps line per calculations.installation_invoice_total step 1; 0 when steps_owner == DEALER."
        default: 0
      - name: crossover_count
        type: integer
        source: computed
        required: false
        description: Number of utility crossovers completed under the home, recorded by the utility-crossover action.
        default: 0
      - name: crossover_fee_cents
        type: integer
        source: computed
        required: false
        description: "Gross crossover line per calculations.installation_invoice_total step 2; may be waived at billing time without re-tiering the discount."
        default: 0
      - name: crossover_recorded
        type: boolean
        source: computed
        required: false
        description: "True once the utility-crossover action has run. Distinguishes a genuine zero-crossover single-wide from a job whose crossover step was never performed, which is why the final-inspection gate reads this flag rather than crossover_count."
        default: false
      - name: closure_score
        type: number
        source: computed
        required: false
        description: "Marriage-line closure score per calculations.marriage_line_closure_score; null until the marriage line is closed."
        default: null
      - name: closure_status
        type: enum
        source: computed
        required: false
        description: "Marriage-line verdict; NOT_APPLICABLE for single-section homes."
        default: NOT_ASSESSED
        constraints: "one of {NOT_ASSESSED, NOT_APPLICABLE, PASS, FAIL}"
      - name: invoice_total_cents
        type: integer
        source: computed
        required: false
        description: "Result of calculations.installation_invoice_total, written when the final inspection passes; null before that."
        default: null
      - name: final_inspector_user_id
        type: string
        source: computed
        required: false
        description: "X-User-ID of the InstallationInspector operator who ran the final installation inspection; null before it."
        default: null
      - name: final_result
        type: enum
        source: computed
        required: false
        description: "PASS when the final inspection recorded zero punch items; PUNCH_LIST otherwise."
        default: PENDING
        constraints: "one of {PENDING, PASS, PUNCH_LIST}"

  - name: MarriageJoint
    parent: SetJob
    common_fields: false
    entity_kind: event
    fields:
      - name: set_job_id
        type: string
        source: input
        required: true
        description: "FK -> SetJob.id; the set job whose marriage line this measurement belongs to."
      - name: joint_index
        type: integer
        source: input
        required: true
        description: 1-based joint index along the marriage line; unique per set_job_id.
        constraints: "1 <= joint_index <= 3, unique per (set_job_id, joint_index)"
      - name: gap_in
        type: number
        source: input
        required: true
        description: Measured horizontal gap at the joint in inches.
        constraints: "0 <= gap_in <= 4"
      - name: vertical_offset_in
        type: number
        source: input
        required: true
        description: Measured vertical offset between mating floors at the joint in inches; may be negative.
        constraints: "-4 <= vertical_offset_in <= 4"
      - name: ridge_beam_shim_in
        type: number
        source: input
        required: true
        description: Total shim thickness driven under the ridge beam at the joint in inches.
        constraints: "0 <= ridge_beam_shim_in <= 2"
      - name: deviation_score
        type: number
        source: computed
        required: false
        description: "Per-joint deviation rounded to 2 decimals at creation, per calculations.marriage_line_closure_score step 1."

  - name: AnchorCertification
    parent: SetJob
    common_fields: true
    entity_kind: resource
    fields:
      - name: set_job_id
        type: string
        source: input
        required: true
        description: "FK -> SetJob.id; the set job whose anchoring and foundation this certification covers."
      - name: anchor_count
        type: integer
        source: input
        required: true
        description: Ground anchors installed.
        constraints: "anchor_count >= 0"
      - name: avg_torque_ft_lb
        type: number
        source: input
        required: true
        description: Mean anchor torque in foot-pounds measured across all anchors.
        constraints: "avg_torque_ft_lb >= 0"
      - name: strap_count
        type: integer
        source: input
        required: true
        description: Over-the-top / frame straps installed.
        constraints: "strap_count >= 0"
      - name: pier_count
        type: integer
        source: input
        required: true
        description: Piers set under the home.
        constraints: "pier_count >= 0"
      - name: revision_round
        type: integer
        source: computed
        required: false
        description: 1 at first submission; incremented on every resubmission after CHANGES_REQUIRED.
        default: 1
      - name: hud_pass
        type: boolean
        source: computed
        required: false
        description: "HUD installation-standard verdict per calculations.anchor_certification_evaluation."
      - name: state_pass
        type: boolean
        source: computed
        required: false
        description: "Destination-state installation-standard verdict per calculations.anchor_certification_evaluation."
      - name: certifier_user_id
        type: string
        source: computed
        required: false
        description: "X-User-ID of the InstallationInspector operator who last reviewed this certification; null until reviewed."
        default: null
      - name: status
        type: enum
        source: computed
        required: false
        description: "Certification lifecycle; see state_machines.AnchorCertification."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, CHANGES_REQUIRED, CERTIFIED, FAILED}"

  - name: DamageClaim
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: order_id
        type: string
        source: input
        required: true
        description: "FK -> InstallationOrder.id; the order the damaged home belongs to. The charged plant is this order's plant_id."
      - name: section_id
        type: string
        source: input
        required: true
        description: "FK -> HomeSection.id; the damaged floor; must belong to order_id."
      - name: hauler_id
        type: string
        source: input
        required: true
        description: "FK -> Hauler.id; the motor carrier named as a potentially responsible party."
      - name: set_crew_id
        type: string
        source: input
        required: true
        description: "FK -> SetCrew.id; the installer named as a potentially responsible party."
      - name: discovered_stage
        type: enum
        source: input
        required: true
        description: "Stage at which the damage was found; one of {PLANT_QC, IN_TRANSIT, AT_SET, FINAL_INSPECTION, UNKNOWN}. Drives the STAGE allocation variant. UNKNOWN records damage whose origin stage could not be established and is deliberately absent from calculations.damage_claim_allocation's STAGE_OWNER map, so such a claim can only be adjudicated on the EVIDENCE basis."
        constraints: "one of {PLANT_QC, IN_TRANSIT, AT_SET, FINAL_INSPECTION, UNKNOWN}"
      - name: claimed_amount_cents
        type: integer
        source: input
        required: true
        description: Repair amount claimed before the approval haircut.
        constraints: "1 <= claimed_amount_cents <= CLAIM_CAP_CENTS"
      - name: blocks_set
        type: boolean
        source: input
        required: false
        description: Whether the damage prevents the set from proceeding; when true the damaged floor is held.
        default: false
      - name: plant_evidence_points
        type: integer
        source: input
        required: false
        description: Adjuster-scored evidence points against the plant.
        constraints: "0 <= plant_evidence_points <= 10"
      - name: hauler_evidence_points
        type: integer
        source: input
        required: false
        description: Adjuster-scored evidence points against the hauler.
        constraints: "0 <= hauler_evidence_points <= 10"
      - name: installer_evidence_points
        type: integer
        source: input
        required: false
        description: Adjuster-scored evidence points against the installer.
        constraints: "0 <= installer_evidence_points <= 10"
      - name: allocation_basis
        type: enum
        source: computed
        required: false
        description: "Branch taken at adjudication; one of {STAGE, EVIDENCE}; null until adjudicated."
        default: null
      - name: approved_amount_cents
        type: integer
        source: computed
        required: false
        description: "claimed_amount_cents after the approval haircut, per calculations.damage_claim_allocation; null until adjudicated."
        default: null
      - name: plant_charge_cents
        type: integer
        source: computed
        required: false
        description: "Plant's share of approved_amount_cents."
        default: 0
      - name: hauler_charge_cents
        type: integer
        source: computed
        required: false
        description: "Hauler's share of approved_amount_cents."
        default: 0
      - name: installer_charge_cents
        type: integer
        source: computed
        required: false
        description: "Installer's share of approved_amount_cents."
        default: 0
      - name: dispute_round
        type: integer
        source: computed
        required: false
        description: Number of times the claim has been pushed back to DISPUTED.
        default: 0
      - name: status
        type: enum
        source: computed
        required: false
        description: "Claim lifecycle; see state_machines.DamageClaim."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, DISPUTED, ADJUDICATED, REVERSED}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: HomeSection
    initial_state: AT_PLANT
    terminal_states: []
    shape: branching_with_revert
    transitions:
      - from: AT_PLANT
        to: MEASURED
        trigger: "POST /installations/sections/{id}/measure"
        actor: PlantDispatcher
        preconditions:
          - "HomeSection.transit_status == AT_PLANT"
          - "X-User-ID equals InstallationOrder.plant_id of HomeSection.order_id"
        side_effects:
          - "sets HomeSection.measured_width_in and HomeSection.measured_height_in from the request body"
          - "recomputes InstallationOrder.posture per calculations.order_posture"
      - from: MEASURED
        to: PERMIT_PENDING
        trigger: "POST /installations/sections/{id}/release"
        actor: PlantDispatcher
        preconditions:
          - "HomeSection.transit_status == MEASURED"
          - "X-User-ID equals InstallationOrder.plant_id of HomeSection.order_id"
        side_effects:
          - "recomputes InstallationOrder.posture per calculations.order_posture"
        note: "Plant release; the floor now awaits an issued transport permit."
      - from: PERMIT_PENDING
        to: DISPATCH_READY
        trigger: "system side effect of POST /installations/permits/{id}/issue"
        actor: system
        preconditions:
          - "the issued TransportPermit.section_id == this HomeSection.id"
          - "HomeSection.transit_status == PERMIT_PENDING"
        side_effects:
          - "recomputes InstallationOrder.posture per calculations.order_posture"
      - from: PERMIT_REVOKED_HOLD
        to: DISPATCH_READY
        trigger: "system side effect of POST /installations/permits/{id}/issue"
        actor: system
        preconditions:
          - "the issued TransportPermit.section_id == this HomeSection.id"
          - "HomeSection.transit_status == PERMIT_REVOKED_HOLD"
        side_effects:
          - "recomputes InstallationOrder.posture per calculations.order_posture"
        note: "Re-permitting a held floor clears the revocation hold."
      - from: DISPATCH_READY
        to: IN_TRANSIT
        trigger: "system side effect of POST /installations/route-legs/{id}/depart"
        actor: system
        preconditions:
          - "the departing RouteLeg resolves through its permit to this HomeSection"
          - "HomeSection.transit_status == DISPATCH_READY"
        side_effects:
          - "recomputes InstallationOrder.posture per calculations.order_posture"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "system side effect of POST /installations/route-legs/{id}/arrive"
        actor: system
        preconditions:
          - "the arriving RouteLeg has the maximum sequence_no among RouteLeg rows of its permit whose status is in {SCHEDULED, IN_TRANSIT, ARRIVED}"
          - "HomeSection.transit_status == IN_TRANSIT"
        side_effects:
          - "recomputes InstallationOrder.posture per calculations.order_posture"
        note: "Arriving a non-final leg leaves transit_status at IN_TRANSIT."
      - from: DISPATCH_READY
        to: PERMIT_REVOKED_HOLD
        trigger: "system side effect of POST /installations/permits/{id}/revoke (cascade link 4)"
        actor: system
        preconditions:
          - "after the revocation no TransportPermit with section_id == this HomeSection.id has status == ISSUED"
        side_effects:
          - "recomputes InstallationOrder.posture per calculations.order_posture, which yields TRANSPORT_BLOCKED (cascade link 5)"
      - from: IN_TRANSIT
        to: PERMIT_REVOKED_HOLD
        trigger: "system side effect of POST /installations/permits/{id}/revoke (cascade link 4)"
        actor: system
        preconditions:
          - "after the revocation no TransportPermit with section_id == this HomeSection.id has status == ISSUED"
        side_effects:
          - "recomputes InstallationOrder.posture per calculations.order_posture, which yields TRANSPORT_BLOCKED (cascade link 5)"
      - from: IN_TRANSIT
        to: DAMAGED_HOLD
        trigger: "system side effect of POST /installations/damage-claims with blocks_set == true"
        actor: system
        preconditions:
          - "DamageClaim.section_id == this HomeSection.id"
          - "DamageClaim.blocks_set == true"
        side_effects:
          - "recomputes InstallationOrder.posture per calculations.order_posture, which yields TRANSPORT_BLOCKED"
      - from: DELIVERED
        to: DAMAGED_HOLD
        trigger: "system side effect of POST /installations/damage-claims with blocks_set == true"
        actor: system
        preconditions:
          - "DamageClaim.section_id == this HomeSection.id"
          - "DamageClaim.blocks_set == true"
        side_effects:
          - "recomputes InstallationOrder.posture per calculations.order_posture, which yields TRANSPORT_BLOCKED"
      - from: DAMAGED_HOLD
        to: DELIVERED
        trigger: "system side effect of POST /installations/damage-claims/{id}/adjudicate or .../reverse"
        actor: system
        preconditions:
          - "no DamageClaim with section_id == this HomeSection.id and blocks_set == true has status in {SUBMITTED, UNDER_REVIEW, DISPUTED}"
        side_effects:
          - "recomputes InstallationOrder.posture per calculations.order_posture"
        note: "Adjudicating or reversing the last blocking claim releases the floor."

  - entity: Site
    initial_state: READINESS_PENDING
    terminal_states: [READY]
    shape: cyclic
    transitions:
      - from: READINESS_PENDING
        to: READY
        trigger: "POST /installations/sites/{id}/readiness-inspection"
        actor: InstallationInspector
        preconditions:
          - "Site.readiness_status in {READINESS_PENDING, READINESS_FAILED}"
          - "calculations.site_readiness_evaluation yields blocking_defect_count == 0"
        side_effects:
          - "sets Site.blocking_defect_count to the evaluation result (0)"
          - "increments Site.inspection_round by 1"
          - "sets Site.last_inspector_user_id to the acting X-User-ID"
          - "recomputes InstallationOrder.posture per calculations.order_posture"
      - from: READINESS_PENDING
        to: READINESS_FAILED
        trigger: "POST /installations/sites/{id}/readiness-inspection"
        actor: InstallationInspector
        preconditions:
          - "Site.readiness_status in {READINESS_PENDING, READINESS_FAILED}"
          - "calculations.site_readiness_evaluation yields blocking_defect_count >= 1"
        side_effects:
          - "sets Site.blocking_defect_count to the evaluation result"
          - "increments Site.inspection_round by 1"
          - "sets Site.last_inspector_user_id to the acting X-User-ID"
          - "recomputes InstallationOrder.posture per calculations.order_posture"
      - from: READINESS_FAILED
        to: READINESS_FAILED
        trigger: "POST /installations/sites/{id}/readiness-inspection"
        actor: InstallationInspector
        preconditions:
          - "Site.readiness_status == READINESS_FAILED"
          - "calculations.site_readiness_evaluation yields blocking_defect_count >= 1"
        side_effects:
          - "sets Site.blocking_defect_count to the evaluation result"
          - "increments Site.inspection_round by 1"
          - "sets Site.last_inspector_user_id to the acting X-User-ID"
        note: "Re-inspection loop; the round counter is the only monotone witness."
      - from: READINESS_FAILED
        to: READY
        trigger: "POST /installations/sites/{id}/readiness-inspection"
        actor: InstallationInspector
        preconditions:
          - "Site.readiness_status == READINESS_FAILED"
          - "calculations.site_readiness_evaluation yields blocking_defect_count == 0"
        side_effects:
          - "sets Site.blocking_defect_count to 0"
          - "increments Site.inspection_round by 1"
          - "sets Site.last_inspector_user_id to the acting X-User-ID"
          - "recomputes InstallationOrder.posture per calculations.order_posture"

  - entity: TransportPermit
    initial_state: REQUESTED
    terminal_states: [REVOKED, SUPERSEDED]
    shape: branching_with_supersede
    transitions:
      - from: REQUESTED
        to: FEE_PAID
        trigger: "POST /installations/permits/{id}/pay-fee"
        actor: TransportManager
        preconditions:
          - "TransportPermit.status == REQUESTED"
          - "paid_amount_cents after adding amount_cents is >= TransportPermit.provisional_fee_cents"
        side_effects:
          - "adds amount_cents to TransportPermit.paid_amount_cents"
        note: "A remittance that leaves paid_amount_cents below provisional_fee_cents keeps the permit in REQUESTED and only raises paid_amount_cents."
      - from: FEE_PAID
        to: ISSUED
        trigger: "POST /installations/permits/{id}/issue"
        actor: PermitDesk
        preconditions:
          - "TransportPermit.status == FEE_PAID"
          - "count of RESERVED EscortAssignment rows with role == ESCORT across the permit's RouteLeg rows whose status is in {SCHEDULED, IN_TRANSIT} is >= TransportPermit.escort_count_required"
          - "if TransportPermit.pilot_car_required then at least one RESERVED EscortAssignment with role == PILOT_CAR exists across those legs"
          - "TransportPermit.paid_amount_cents >= the FINAL variant result of calculations.permit_fee_assessment"
        side_effects:
          - "sets TransportPermit.final_fee_cents from the FINAL variant of calculations.permit_fee_assessment"
          - "recomputes TransportPermit.permit_class, escort_count_required and pilot_car_required from measured dimensions per calculations.escort_requirement_matrix"
          - "sets TransportPermit.valid_until_date to the logical clock date plus PERMIT_VALID_DAYS"
          - "transitions HomeSection PERMIT_PENDING -> DISPATCH_READY (or PERMIT_REVOKED_HOLD -> DISPATCH_READY)"
          - "recomputes InstallationOrder.posture per calculations.order_posture"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /installations/permits/{id}/revoke"
        actor: PermitDesk
        preconditions:
          - "TransportPermit.status == ISSUED"
        side_effects:
          - "cascade link 2: every RouteLeg of this permit with status == SCHEDULED transitions to CANCELLED"
          - "cascade link 3: because those legs cancelled, every RESERVED EscortAssignment on them transitions to RELEASED and each affected EscortCrew.reserved_minutes is recomputed per calculations.escort_reserved_minutes, refreshing EscortCrew.status"
          - "cascade link 4: because the section now has no ISSUED permit, HomeSection transitions DISPATCH_READY -> PERMIT_REVOKED_HOLD (or IN_TRANSIT -> PERMIT_REVOKED_HOLD)"
          - "cascade link 5: because a section entered PERMIT_REVOKED_HOLD, InstallationOrder.posture is recomputed per calculations.order_posture and becomes TRANSPORT_BLOCKED"
      - from: REQUESTED
        to: SUPERSEDED
        trigger: "system side effect of POST /installations/permits for the same (section_id, state_code)"
        actor: system
        preconditions:
          - "a new TransportPermit is created for the same section_id and state_code"
          - "TransportPermit.status == REQUESTED"
        side_effects:
          - "no fee refund; paid_amount_cents is frozen on the superseded row"
      - from: FEE_PAID
        to: SUPERSEDED
        trigger: "system side effect of POST /installations/permits for the same (section_id, state_code)"
        actor: system
        preconditions:
          - "a new TransportPermit is created for the same section_id and state_code"
          - "TransportPermit.status == FEE_PAID"
        side_effects:
          - "no fee refund; paid_amount_cents is frozen on the superseded row"

  - entity: RouteLeg
    initial_state: SCHEDULED
    terminal_states: [ARRIVED, CANCELLED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: IN_TRANSIT
        trigger: "POST /installations/route-legs/{id}/depart"
        actor: TransportManager
        preconditions:
          - "RouteLeg.status == SCHEDULED"
          - "X-User-ID equals RouteLeg.hauler_id"
          - "the leg's TransportPermit.status == ISSUED"
          - "Hauler.status == ACTIVE for RouteLeg.hauler_id"
          - "every EscortAssignment on this leg with status == RESERVED resolves to an EscortCrew whose status == AVAILABLE"
        side_effects:
          - "transitions HomeSection DISPATCH_READY -> IN_TRANSIT"
          - "recomputes InstallationOrder.posture per calculations.order_posture"
      - from: IN_TRANSIT
        to: ARRIVED
        trigger: "POST /installations/route-legs/{id}/arrive"
        actor: TransportManager
        preconditions:
          - "RouteLeg.status == IN_TRANSIT"
          - "X-User-ID equals RouteLeg.hauler_id"
        side_effects:
          - "every EscortAssignment on this leg with status == RESERVED transitions to COMPLETED and each affected EscortCrew.reserved_minutes is recomputed per calculations.escort_reserved_minutes, refreshing EscortCrew.status"
          - "when this leg carries the maximum sequence_no among the permit's non-cancelled legs, transitions HomeSection IN_TRANSIT -> DELIVERED"
          - "recomputes InstallationOrder.posture per calculations.order_posture"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system side effect of POST /installations/permits/{id}/revoke (cascade link 2)"
        actor: system
        preconditions:
          - "the leg's TransportPermit transitioned ISSUED -> REVOKED"
          - "RouteLeg.status == SCHEDULED"
        side_effects:
          - "cascade link 3: every RESERVED EscortAssignment on this leg transitions to RELEASED and EscortCrew.reserved_minutes is recomputed per calculations.escort_reserved_minutes"
      - from: SCHEDULED
        to: HAULER_HOLD
        trigger: "system side effect of POST /installations/damage-claims/{id}/adjudicate (cascade link 4)"
        actor: system
        preconditions:
          - "RouteLeg.hauler_id is the hauler whose Hauler.status just became SUSPENDED"
          - "RouteLeg.status == SCHEDULED"
        side_effects:
          - "cascade link 5: InstallationOrder.posture of the leg's order is recomputed per calculations.order_posture and becomes TRANSPORT_BLOCKED"
      - from: HAULER_HOLD
        to: SCHEDULED
        trigger: "system side effect of POST /installations/damage-claims/{id}/reverse"
        actor: system
        preconditions:
          - "Hauler.status returned to ACTIVE because chargeback_balance_cents fell below HAULER_SUSPENSION_THRESHOLD_CENTS"
          - "RouteLeg.status == HAULER_HOLD"
        side_effects:
          - "recomputes InstallationOrder.posture per calculations.order_posture"

  - entity: EscortAssignment
    initial_state: RESERVED
    terminal_states: [RELEASED, COMPLETED]
    shape: branching
    transitions:
      - from: RESERVED
        to: RELEASED
        trigger: "POST /installations/escort-assignments/{id}/release"
        actor: TransportManager
        preconditions:
          - "EscortAssignment.status == RESERVED"
          - "X-User-ID equals the hauler_id of the assignment's RouteLeg"
          - "the assignment's RouteLeg.status in {SCHEDULED, CANCELLED, HAULER_HOLD}"
        side_effects:
          - "recomputes EscortCrew.reserved_minutes per calculations.escort_reserved_minutes and refreshes EscortCrew.status"
      - from: RESERVED
        to: RELEASED
        trigger: "system side effect of POST /installations/permits/{id}/revoke (cascade link 3)"
        actor: system
        preconditions:
          - "the assignment's RouteLeg transitioned SCHEDULED -> CANCELLED"
        side_effects:
          - "recomputes EscortCrew.reserved_minutes per calculations.escort_reserved_minutes and refreshes EscortCrew.status"
      - from: RESERVED
        to: COMPLETED
        trigger: "system side effect of POST /installations/route-legs/{id}/arrive"
        actor: system
        preconditions:
          - "the assignment's RouteLeg transitioned IN_TRANSIT -> ARRIVED"
        side_effects:
          - "recomputes EscortCrew.reserved_minutes per calculations.escort_reserved_minutes and refreshes EscortCrew.status"

  - entity: SetJob
    initial_state: "progress_status=SCHEDULED x scope_status=SCOPE_PENDING"
    terminal_states: [CLOSED, SUPERSEDED]
    shape: parallel
    parallel_dimensions:
      progress_status: [SCHEDULED, DISPATCHED, SET_COMPLETE, CLOSED, SUPERSEDED]
      scope_status: [SCOPE_PENDING, SCOPE_SPLIT, SCOPE_DELIVERED]
    dimension_independence_note: |
      progress_status and scope_status advance on disjoint triggers. dispatch,
      close-marriage-line and final-inspection move progress_status only and leave
      scope_status byte-identical; scope-split and utility-crossover move
      scope_status only and leave progress_status byte-identical. Only the
      final-inspection transition reads both dimensions.
    transitions:
      - from: "progress_status=SCHEDULED"
        to: "progress_status=DISPATCHED"
        trigger: "POST /installations/set-jobs/{id}/dispatch"
        actor: NetworkAdmin
        preconditions:
          - "SetJob.progress_status == SCHEDULED"
          - "a Site row exists for SetJob.order_id and its readiness_status == READY"
          - "InstallationOrder.posture not in {TRANSPORT_BLOCKED, CLOSED}"
          - "SetCrew.status == ACTIVE for SetJob.set_crew_id"
          - "count of HomeSection rows with order_id == SetJob.order_id equals InstallationOrder.section_count"
          - "every HomeSection row with order_id == SetJob.order_id has transit_status == DELIVERED"
        side_effects:
          - "recomputes InstallationOrder.posture per calculations.order_posture, which yields SET_IN_PROGRESS"
          - "leaves SetJob.scope_status unchanged"
      - from: "scope_status=SCOPE_PENDING"
        to: "scope_status=SCOPE_SPLIT"
        trigger: "POST /installations/set-jobs/{id}/scope-split"
        actor: SetCrewLead
        preconditions:
          - "SetJob.scope_status == SCOPE_PENDING"
          - "SetJob.progress_status in {SCHEDULED, DISPATCHED, SET_COMPLETE}"
          - "X-User-ID equals SetJob.set_crew_id"
        side_effects:
          - "sets SetJob.skirting_owner and SetJob.steps_owner from the request body"
          - "sets SetJob.skirting_fee_cents and SetJob.steps_fee_cents per calculations.installation_invoice_total step 1"
          - "leaves SetJob.progress_status unchanged"
      - from: "scope_status=SCOPE_SPLIT"
        to: "scope_status=SCOPE_DELIVERED"
        trigger: "POST /installations/set-jobs/{id}/utility-crossover"
        actor: SetCrewLead
        preconditions:
          - "SetJob.scope_status == SCOPE_SPLIT"
          - "SetJob.progress_status in {DISPATCHED, SET_COMPLETE}"
          - "X-User-ID equals SetJob.set_crew_id"
        side_effects:
          - "sets SetJob.crossover_count from the request body"
          - "sets SetJob.crossover_fee_cents per calculations.installation_invoice_total step 2"
          - "leaves SetJob.progress_status unchanged"
      - from: "progress_status=DISPATCHED"
        to: "progress_status=SET_COMPLETE"
        trigger: "POST /installations/set-jobs/{id}/close-marriage-line"
        actor: SetCrewLead
        preconditions:
          - "SetJob.progress_status == DISPATCHED"
          - "X-User-ID equals SetJob.set_crew_id"
          - "count of MarriageJoint rows with set_job_id == SetJob.id equals max(0, InstallationOrder.section_count - 1)"
          - "calculations.marriage_line_closure_score yields closure_status in {PASS, NOT_APPLICABLE}"
        side_effects:
          - "sets SetJob.closure_score and SetJob.closure_status per calculations.marriage_line_closure_score"
          - "leaves SetJob.scope_status unchanged"
          - "recomputes InstallationOrder.posture per calculations.order_posture"
        note: "A FAIL verdict is rejected with ERR_MARRIAGE_LINE_NOT_CLOSED and writes closure_score/closure_status only when the verdict is PASS or NOT_APPLICABLE."
      - from: "progress_status=SET_COMPLETE"
        to: "progress_status=CLOSED"
        trigger: "POST /installations/set-jobs/{id}/final-inspection with punch_item_count == 0"
        actor: InstallationInspector
        preconditions:
          - "SetJob.progress_status == SET_COMPLETE"
          - "SetJob.scope_status == SCOPE_DELIVERED"
          - "the acting X-User-ID differs from Site.last_inspector_user_id of the order's Site"
          - "an AnchorCertification row with set_job_id == SetJob.id has status == CERTIFIED"
          - "punch_item_count == 0"
        side_effects:
          - "sets SetJob.final_result to PASS and SetJob.final_inspector_user_id to the acting X-User-ID"
          - "sets SetJob.invoice_total_cents per calculations.installation_invoice_total"
          - "mirrors the value into InstallationOrder.invoice_total_cents"
          - "sets InstallationOrder.warranty_start_date to the logical clock's current UTC date"
          - "recomputes InstallationOrder.posture per calculations.order_posture, which yields CLOSED"
      - from: "progress_status=SET_COMPLETE"
        to: "progress_status=SET_COMPLETE"
        trigger: "POST /installations/set-jobs/{id}/final-inspection with punch_item_count >= 1"
        actor: InstallationInspector
        preconditions:
          - "SetJob.progress_status == SET_COMPLETE"
          - "SetJob.scope_status == SCOPE_DELIVERED"
          - "the acting X-User-ID differs from Site.last_inspector_user_id of the order's Site"
          - "an AnchorCertification row with set_job_id == SetJob.id has status == CERTIFIED"
          - "punch_item_count >= 1"
        side_effects:
          - "sets SetJob.final_result to PUNCH_LIST and SetJob.final_inspector_user_id to the acting X-User-ID"
          - "leaves SetJob.invoice_total_cents null and InstallationOrder.warranty_start_date null"
        note: "Divergent branch of the same trigger: warranty does not start and no invoice is produced."
      - from: "progress_status=SCHEDULED"
        to: "progress_status=SUPERSEDED"
        trigger: "system side effect of POST /installations/set-jobs for the same order_id"
        actor: system
        preconditions:
          - "a new SetJob is created for the same order_id"
          - "SetJob.progress_status == SCHEDULED"
        side_effects:
          - "recomputes InstallationOrder.posture per calculations.order_posture"

  - entity: AnchorCertification
    initial_state: SUBMITTED
    terminal_states: [CERTIFIED, FAILED]
    shape: cyclic
    transitions:
      - from: SUBMITTED
        to: CHANGES_REQUIRED
        trigger: "POST /installations/anchor-certifications/{id}/review with decision == REQUEST_CHANGES"
        actor: InstallationInspector
        preconditions:
          - "AnchorCertification.status == SUBMITTED"
        side_effects:
          - "sets AnchorCertification.certifier_user_id to the acting X-User-ID"
      - from: CHANGES_REQUIRED
        to: SUBMITTED
        trigger: "POST /installations/anchor-certifications/{id}/resubmit"
        actor: SetCrewLead
        preconditions:
          - "AnchorCertification.status == CHANGES_REQUIRED"
          - "X-User-ID equals the set_crew_id of the certification's SetJob"
          - "AnchorCertification.revision_round < MAX_ANCHOR_REVISIONS"
        side_effects:
          - "overwrites anchor_count, avg_torque_ft_lb, strap_count and pier_count from the request body"
          - "increments AnchorCertification.revision_round by 1"
          - "recomputes AnchorCertification.hud_pass and state_pass per calculations.anchor_certification_evaluation"
        note: "Closes the revision cycle SUBMITTED -> CHANGES_REQUIRED -> SUBMITTED on the same row."
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /installations/anchor-certifications/{id}/review with decision == CERTIFY"
        actor: InstallationInspector
        preconditions:
          - "AnchorCertification.status == SUBMITTED"
          - "AnchorCertification.hud_pass == true and AnchorCertification.state_pass == true"
        side_effects:
          - "sets AnchorCertification.certifier_user_id to the acting X-User-ID"
      - from: SUBMITTED
        to: FAILED
        trigger: "POST /installations/anchor-certifications/{id}/review with decision == FAIL"
        actor: InstallationInspector
        preconditions:
          - "AnchorCertification.status == SUBMITTED"
        side_effects:
          - "sets AnchorCertification.certifier_user_id to the acting X-User-ID"

  - entity: DamageClaim
    initial_state: SUBMITTED
    terminal_states: [REVERSED]
    shape: branching_with_cycle
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /installations/damage-claims/{id}/review"
        actor: ClaimsAdjuster
        preconditions:
          - "DamageClaim.status == SUBMITTED"
        side_effects: []
      - from: UNDER_REVIEW
        to: DISPUTED
        trigger: "POST /installations/damage-claims/{id}/dispute"
        actor: "PlantDispatcher | TransportManager | SetCrewLead"
        preconditions:
          - "DamageClaim.status == UNDER_REVIEW"
          - "the acting X-User-ID equals one of: the order's plant_id (PlantDispatcher), DamageClaim.hauler_id (TransportManager), DamageClaim.set_crew_id (SetCrewLead)"
        side_effects:
          - "increments DamageClaim.dispute_round by 1"
      - from: DISPUTED
        to: UNDER_REVIEW
        trigger: "POST /installations/damage-claims/{id}/review"
        actor: ClaimsAdjuster
        preconditions:
          - "DamageClaim.status == DISPUTED"
        side_effects: []
        note: "Closes the negotiation cycle UNDER_REVIEW -> DISPUTED -> UNDER_REVIEW on the same row."
      - from: UNDER_REVIEW
        to: ADJUDICATED
        trigger: "POST /installations/damage-claims/{id}/adjudicate with allocation_basis == STAGE"
        actor: ClaimsAdjuster
        preconditions:
          - "DamageClaim.status == UNDER_REVIEW"
        side_effects:
          - "sets DamageClaim.allocation_basis to STAGE and approved_amount_cents / plant_charge_cents / hauler_charge_cents / installer_charge_cents per the STAGE variant of calculations.damage_claim_allocation"
          - "cascade link 2: because the allocation was posted, the charged party's chargeback_balance_cents is increased per calculations.party_chargeback_ledger and Plant.status / Hauler.status / SetCrew.status are refreshed"
          - "cascade link 3: if Hauler.chargeback_balance_cents reached HAULER_SUSPENSION_THRESHOLD_CENTS, that Hauler transitions ACTIVE -> SUSPENDED"
          - "cascade link 4: because the hauler was suspended, every RouteLeg with that hauler_id and status == SCHEDULED transitions to HAULER_HOLD"
          - "cascade link 5: because a leg entered HAULER_HOLD, InstallationOrder.posture of the leg's order is recomputed per calculations.order_posture and becomes TRANSPORT_BLOCKED"
          - "if DamageClaim.blocks_set was true, releases HomeSection DAMAGED_HOLD -> DELIVERED"
        note: "STAGE branch: exactly one party is charged the full approved amount; the other two rows stay at 0."
      - from: UNDER_REVIEW
        to: ADJUDICATED
        trigger: "POST /installations/damage-claims/{id}/adjudicate with allocation_basis == EVIDENCE"
        actor: ClaimsAdjuster
        preconditions:
          - "DamageClaim.status == UNDER_REVIEW"
          - "plant_evidence_points + hauler_evidence_points + installer_evidence_points >= 1"
        side_effects:
          - "sets DamageClaim.allocation_basis to EVIDENCE and approved_amount_cents / plant_charge_cents / hauler_charge_cents / installer_charge_cents per the EVIDENCE variant of calculations.damage_claim_allocation"
          - "cascade link 2: because the allocation was posted, all three parties' chargeback_balance_cents are increased per calculations.party_chargeback_ledger and Plant.status / Hauler.status / SetCrew.status are refreshed"
          - "cascade link 3: if Hauler.chargeback_balance_cents reached HAULER_SUSPENSION_THRESHOLD_CENTS, that Hauler transitions ACTIVE -> SUSPENDED"
          - "cascade link 4: because the hauler was suspended, every RouteLeg with that hauler_id and status == SCHEDULED transitions to HAULER_HOLD"
          - "cascade link 5: because a leg entered HAULER_HOLD, InstallationOrder.posture of the leg's order is recomputed per calculations.order_posture and becomes TRANSPORT_BLOCKED"
          - "if DamageClaim.blocks_set was true, releases HomeSection DAMAGED_HOLD -> DELIVERED"
        note: "EVIDENCE branch: all three parties may be charged; the largest-remainder split is exact to the cent."
      - from: ADJUDICATED
        to: REVERSED
        trigger: "POST /installations/damage-claims/{id}/reverse"
        actor: ClaimsAdjuster
        preconditions:
          - "DamageClaim.status == ADJUDICATED"
        side_effects:
          - "zeroes DamageClaim.plant_charge_cents, hauler_charge_cents and installer_charge_cents and clears allocation_basis and approved_amount_cents to null"
          - "decreases every party's chargeback_balance_cents by exactly the amount the adjudication added, per calculations.party_chargeback_ledger, restoring the network chargeback total"
          - "refreshes Plant.status, Hauler.status and SetCrew.status; a Hauler whose balance fell below HAULER_SUSPENSION_THRESHOLD_CENTS returns to ACTIVE and its HAULER_HOLD legs return to SCHEDULED"
          - "recomputes InstallationOrder.posture per calculations.order_posture"

  - entity: InstallationOrder
    initial_state: OPEN
    terminal_states: [CLOSED]
    shape: posture_driven
    posture_field: posture
    transitions:
      - from: "any of {OPEN, SITE_BLOCKED, SET_IN_PROGRESS, TRANSPORT_BLOCKED}"
        to: "the first matching band of calculations.order_posture"
        trigger: "system recomputation after every mutation to the order or any of its HomeSection, Site, TransportPermit, RouteLeg or SetJob descendants"
        actor: system
        preconditions:
          - "the mutation completed successfully"
        side_effects:
          - "sets InstallationOrder.posture to the recomputed band"
          - "gates POST /installations/set-jobs/{id}/dispatch: TRANSPORT_BLOCKED and CLOSED reject with ERR_ORDER_POSTURE_BLOCKED"
          - "gates POST /installations/set-jobs: CLOSED rejects with ERR_ORDER_POSTURE_BLOCKED"
      - from: "any of {OPEN, SITE_BLOCKED, SET_IN_PROGRESS}"
        to: CLOSED
        trigger: "system side effect of a passing POST /installations/set-jobs/{id}/final-inspection"
        actor: system
        preconditions:
          - "at least one SetJob exists for the order and every SetJob with progress_status not in {SUPERSEDED} has progress_status == CLOSED"
        side_effects:
          - "sets InstallationOrder.warranty_start_date and InstallationOrder.invoice_total_cents"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version only)
# =============================================================================
concurrency_rules:
  - rule_id: set-job-create-stale-order
    parent_entity: InstallationOrder
    write_endpoint: "POST /installations/set-jobs"
    occ_field: "expected_order_version"
    description: |
      Creating a SetJob against an InstallationOrder whose version has advanced
      since the client last read it is rejected. A newly created SetJob
      legitimately supersedes the order's prior SCHEDULED SetJob, so a writer
      holding a stale view of the order would silently retire a booking it never
      observed; the stale-version check turns that into a deterministic 412.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: permit-create-stale-section
    parent_entity: HomeSection
    write_endpoint: "POST /installations/permits"
    occ_field: "expected_section_version"
    description: |
      Requesting a TransportPermit against a HomeSection whose version has
      advanced since the client last read it is rejected. A new permit for the
      same (section_id, state_code) legitimately supersedes the prior REQUESTED
      or FEE_PAID permit and freezes its remittance, so a writer working from a
      stale section view would retire a permit whose paid fee it never saw.
    error_id: ERR_STALE_SECTION_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: escort_requirement_matrix
    trigger: "POST /installations/permits (from declared dimensions) and again as a side effect of POST /installations/permits/{id}/issue (from measured dimensions)"
    algorithm: threshold
    combinatorial_mode: "(a) formula with >= 3 inputs and non-linear interaction (min cap over four independent conditional increments plus a three-way disjunctive pilot-car predicate)"
    formula: |
      inputs: width_in, height_in, state_code, night_move, leg_count

      permit_class =
        SUPERLOAD if width_in >= SUPERLOAD_WIDTH_IN
        else OVERSIZE if width_in >= OVERSIZE_WIDTH_IN
        else STANDARD

      escort_count_required = min(
        MAX_ESCORTS,
          STATE_ESCORT_BASE[state_code]
        + (1 if width_in  >= OVERSIZE_WIDTH_IN  else 0)
        + (1 if width_in  >= SUPERLOAD_WIDTH_IN else 0)
        + (1 if height_in >= OVERHEIGHT_IN      else 0)
        + (NIGHT_MOVE_ESCORT_BONUS if night_move else 0)
      )

      pilot_car_required =
           (permit_class != STANDARD)
        or (leg_count >= PILOT_CAR_LEG_THRESHOLD)
        or (state_code == "KS" and height_in >= OVERHEIGHT_IN)

      All three width/height comparisons are inclusive (>=): a width of exactly
      OVERSIZE_WIDTH_IN is OVERSIZE, and a height of exactly OVERHEIGHT_IN adds
      an escort.
    input_set: |
      PROVISIONAL evaluation (at request): width_in = HomeSection.declared_width_in,
      height_in = HomeSection.declared_height_in, leg_count = TransportPermit.planned_leg_count.
      FINAL evaluation (at issuance): width_in = HomeSection.measured_width_in when
      non-null else declared_width_in, height_in = HomeSection.measured_height_in when
      non-null else declared_height_in, leg_count = count of RouteLeg rows with
      permit_id == this permit and status in {SCHEDULED, IN_TRANSIT, ARRIVED}.
      state_code and night_move always come from the TransportPermit row.
    constants:
      OVERSIZE_WIDTH_IN: 192
      SUPERLOAD_WIDTH_IN: 216
      OVERHEIGHT_IN: 162
      MAX_ESCORTS: 4
      NIGHT_MOVE_ESCORT_BONUS: 1
      PILOT_CAR_LEG_THRESHOLD: 3
      STATE_ESCORT_BASE: { AZ: 0, NM: 1, TX: 1, OK: 1, KS: 2, CO: 2 }
    precision: "integer escort count; no rounding"

  - name: permit_fee_assessment
    trigger: "POST /installations/permits writes the PROVISIONAL result into TransportPermit.provisional_fee_cents; POST /installations/permits/{id}/issue writes the FINAL result into TransportPermit.final_fee_cents"
    algorithm: tiered_pricing
    formula: |
      width_excess_in = max(0, width_used_in - WIDTH_FREE_ALLOWANCE_IN)

      subtotal_cents = BASE_FEE_CENTS
                     + width_excess_in            * PER_INCH_OVER_WIDTH_CENTS
                     + leg_count_used             * PER_LEG_CENTS
                     + escort_count_required_used * ESCORT_SURCHARGE_CENTS
                     + (OVERHEIGHT_SURCHARGE_CENTS if height_used_in >= 162 else 0)

      multiplier = SUPERLOAD_MULTIPLIER if permit_class_used == SUPERLOAD else 1.0

      fee_cents = round_half_up(subtotal_cents * multiplier)

      The multiplier is applied ONCE to the assembled subtotal and rounding happens
      ONCE at the very end; per-line rounding is forbidden.
    input_set: |
      Both variants read escort_count_required_used and permit_class_used from the
      matching evaluation of calculations.escort_requirement_matrix (never from the
      stored TransportPermit fields, which the FINAL evaluation overwrites in the
      same request).
    constants:
      BASE_FEE_CENTS: 12000
      WIDTH_FREE_ALLOWANCE_IN: 168
      PER_INCH_OVER_WIDTH_CENTS: 250
      PER_LEG_CENTS: 4500
      ESCORT_SURCHARGE_CENTS: 7500
      OVERHEIGHT_SURCHARGE_CENTS: 9000
      SUPERLOAD_MULTIPLIER: 1.25
      PERMIT_VALID_DAYS: 5
    precision: "whole cents, round_half_up, applied once after the class multiplier"
    variants:
      - name: PROVISIONAL
        when: "evaluated at POST /installations/permits, before the plant has released measured dimensions and before any RouteLeg exists"
        difference: "Uses HomeSection.declared_width_in / declared_height_in and TransportPermit.planned_leg_count. Result is stored in provisional_fee_cents and is the amount pay-fee must at least cover to reach FEE_PAID."
      - name: FINAL
        when: "evaluated at POST /installations/permits/{id}/issue"
        difference: "Uses HomeSection.measured_width_in / measured_height_in (falling back to the declared values only when null) and the permit's actual non-cancelled RouteLeg count, so a detour leg or a wider plant-QC measurement raises the fee - and can flip permit_class to SUPERLOAD, which both adds escorts and applies the 1.25 multiplier. Result is stored in final_fee_cents and must be fully covered by paid_amount_cents or issuance is rejected with ERR_PERMIT_FEE_UNPAID."

  - name: marriage_line_closure_score
    trigger: "step 1 runs on POST /installations/marriage-joints (writes MarriageJoint.deviation_score); steps 2-3 run on POST /installations/set-jobs/{id}/close-marriage-line (write SetJob.closure_score and SetJob.closure_status)"
    algorithm: aggregation
    combinatorial_mode: "(b) nested rounding where the order matters - per-joint rounding precedes summation and the scaffold pins that order"
    formula: |
      step 1 - per joint:
        deviation_score(j) = round_half_up(
              GAP_WEIGHT    * max(0, j.gap_in - MAX_GAP_IN)
            + OFFSET_WEIGHT * max(0, abs(j.vertical_offset_in) - MAX_OFFSET_IN)
            + SHIM_WEIGHT   * j.ridge_beam_shim_in
          , 2)

      step 2 - aggregate (PINNED ORDER: round per joint FIRST, then sum the ROUNDED
      per-joint values, then round the sum to 2 decimals):
        closure_score = round_half_up(
            sum over joints of deviation_score(j)
          , 2)
        Summing the UNROUNDED deviations and rounding once at the end is the wrong
        reading and produces a different value (e.g. three joints at raw 0.125 give
        0.39 under the pinned order and 0.38 under sum-then-round).

      step 3 - verdict:
        closure_status =
          NOT_APPLICABLE if the joint count is 0
          else PASS       if closure_score <= CLOSURE_PASS_MAX_SCORE
          else FAIL
    input_set: |
      (a) source: every MarriageJoint row with set_job_id == this SetJob.id - MarriageJoint
      is append-only (common_fields: false), so no status filter is needed and no row is
      ever excluded. (b) window: the full set at the instant close-marriage-line runs;
      the required cardinality is exactly max(0, InstallationOrder.section_count - 1).
      (c) order: joint_index ASC; (set_job_id, joint_index) is unique so the order is
      total and no tie-break is reachable. Summation order is immaterial to the pinned
      arithmetic but is fixed anyway for reproducibility.
    constants:
      MAX_GAP_IN: 0.25
      MAX_OFFSET_IN: 0.5
      GAP_WEIGHT: 1.0
      OFFSET_WEIGHT: 0.6
      SHIM_WEIGHT: 0.4
      CLOSURE_PASS_MAX_SCORE: 1.00
    precision: "2 decimal places, round_half_up, applied per joint and then to the sum"

  - name: installation_invoice_total
    trigger: "step 1 runs on POST /installations/set-jobs/{id}/scope-split; step 2 runs on POST /installations/set-jobs/{id}/utility-crossover; steps 3-8 run on a passing POST /installations/set-jobs/{id}/final-inspection and write SetJob.invoice_total_cents"
    algorithm: waterfall_allocation
    combinatorial_mode: "(c) circular-looking dependency - the crossover line is waived when a volume discount applies, yet the discount tier is keyed on a total that includes the un-waived crossover line; the scaffold pins the evaluation order so the value is well defined"
    formula: |
      step 1 (scope split):
        skirting_fee_cents = 0 if skirting_owner == DEALER
                             else round_half_up(skirting_linear_ft * SKIRTING_RATE_CENTS_PER_FT)
        steps_fee_cents    = 0 if steps_owner == DEALER
                             else steps_count * STEPS_UNIT_CENTS
        scope_subtotal_cents = skirting_fee_cents + steps_fee_cents

      step 2 (utility crossover):
        crossover_fee_cents = UTILITY_CROSSOVER_BASE_CENTS
                            + crossover_count * PER_CROSSOVER_CENTS

      step 3 (tier basis - computed BEFORE any waiver):
        pre_discount_total_cents = labor_base_cents
                                 + scope_subtotal_cents
                                 + crossover_fee_cents

      step 4 (tier selection, inclusive lower bounds):
        discount_pct = 0.10 if pre_discount_total_cents >= TIER_10_MIN_CENTS
                  else 0.06 if pre_discount_total_cents >= TIER_6_MIN_CENTS
                  else 0.03 if pre_discount_total_cents >= TIER_3_MIN_CENTS
                  else 0.00

      step 5 (crossover waiver):
        crossover_billed_cents = 0 if discount_pct > 0 else crossover_fee_cents

      step 6:
        billable_base_cents = labor_base_cents + scope_subtotal_cents + crossover_billed_cents

      step 7 (PINNED: the discount is a percentage of pre_discount_total_cents from
      step 3, NOT of billable_base_cents from step 6, and step 4's tier is NEVER
      re-evaluated after the waiver or after the discount is subtracted):
        volume_discount_cents = round_half_up(pre_discount_total_cents * discount_pct)

      step 8:
        invoice_total_cents = billable_base_cents - volume_discount_cents
    input_set: |
      Single SetJob row; all inputs are fields on that row written by the scope-split
      and utility-crossover actions. No aggregation over other entities.
    constants:
      SKIRTING_RATE_CENTS_PER_FT: 1850
      STEPS_UNIT_CENTS: 42000
      UTILITY_CROSSOVER_BASE_CENTS: 60000
      PER_CROSSOVER_CENTS: 18000
      TIER_3_MIN_CENTS: 300000
      TIER_6_MIN_CENTS: 600000
      TIER_10_MIN_CENTS: 900000
    precision: "whole cents, round_half_up; rounding occurs only at step 1 (skirting) and step 7 (discount)"

  - name: damage_claim_allocation
    trigger: "POST /installations/damage-claims/{id}/adjudicate writes DamageClaim.approved_amount_cents, plant_charge_cents, hauler_charge_cents and installer_charge_cents"
    algorithm: waterfall_allocation
    formula: |
      approved_amount_cents = round_half_up(claimed_amount_cents * (1 - APPROVAL_HAIRCUT_PCT))

      STAGE variant:
        owner = STAGE_OWNER[discovered_stage]
        charge(owner) = approved_amount_cents
        charge(other two parties) = 0

      EVIDENCE variant:
        pts = { PLANT: plant_evidence_points,
                HAULER: hauler_evidence_points,
                INSTALLER: installer_evidence_points }
        pts_total = sum(pts.values())            # >= 1 enforced by ERR_CLAIM_EVIDENCE_MISSING
        exact(p)  = approved_amount_cents * pts[p] / pts_total          # rational, not rounded
        base(p)   = floor(exact(p))
        remainder = approved_amount_cents - sum(base(p))                # 0 <= remainder <= 2
        distribute the remainder one cent at a time to parties ordered by
          (exact(p) - base(p)) DESC, then pts[p] DESC, then party_code ASC
        where party_code is the literal string HAULER < INSTALLER < PLANT.
        charge(p) = base(p) + (1 if p received a remainder cent else 0)

      INVARIANT (both variants):
        plant_charge_cents + hauler_charge_cents + installer_charge_cents
          == approved_amount_cents
    input_set: |
      Single DamageClaim row in status UNDER_REVIEW. The charged Plant is
      InstallationOrder.plant_id of DamageClaim.order_id; the charged Hauler is
      DamageClaim.hauler_id; the charged installer is DamageClaim.set_crew_id.
      No selection by description occurs - all three parties are explicit ids.
    constants:
      APPROVAL_HAIRCUT_PCT: 0.10
      CLAIM_CAP_CENTS: 2500000
      STAGE_OWNER: { PLANT_QC: PLANT, IN_TRANSIT: HAULER, AT_SET: INSTALLER, FINAL_INSPECTION: INSTALLER }
      # NOTE: discovered_stage UNKNOWN is intentionally NOT a key of STAGE_OWNER;
      # a STAGE adjudication of such a claim is rejected with ERR_CLAIM_STAGE_MISMATCH
      # (validation priority 28) and only the EVIDENCE basis can settle it.
    precision: "whole cents; round_half_up on the haircut, floor plus largest-remainder on the split so the three charges sum exactly to approved_amount_cents"
    variants:
      - name: STAGE
        when: "adjudicate is called with allocation_basis == STAGE"
        difference: "Attributes the entire approved amount to the single party that owns the stage at which the damage was discovered; evidence points are ignored entirely."
      - name: EVIDENCE
        when: "adjudicate is called with allocation_basis == EVIDENCE"
        difference: "Splits the same approved amount across all three parties in proportion to adjuster-scored evidence points, so identical claim data yields three non-zero charges instead of one - e.g. an approved 90001 with points 1/1/1 becomes PLANT 30000 / HAULER 30001 / INSTALLER 30000 rather than a single 90001 charge."

  - name: party_chargeback_ledger
    trigger: "POST /installations/damage-claims/{id}/adjudicate (increase) and POST /installations/damage-claims/{id}/reverse (decrease); writes Plant.chargeback_balance_cents, Hauler.chargeback_balance_cents, SetCrew.chargeback_balance_cents and refreshes Plant.status / Hauler.status / SetCrew.status"
    algorithm: aggregation
    formula: |
      Plant.chargeback_balance_cents =
        sum of DamageClaim.plant_charge_cents over DamageClaim rows where
          status == ADJUDICATED
          and InstallationOrder.plant_id of DamageClaim.order_id == this Plant.id

      Hauler.chargeback_balance_cents =
        sum of DamageClaim.hauler_charge_cents over DamageClaim rows where
          status == ADJUDICATED and hauler_id == this Hauler.id

      SetCrew.chargeback_balance_cents =
        sum of DamageClaim.installer_charge_cents over DamageClaim rows where
          status == ADJUDICATED and set_crew_id == this SetCrew.id

      Full recompute (never incremental), so a REVERSED claim drops out of every sum.

      Threshold refresh (inclusive):
        Hauler.status  = SUSPENDED  if chargeback_balance_cents >= HAULER_SUSPENSION_THRESHOLD_CENTS else ACTIVE
        Plant.status   = PROBATION  if chargeback_balance_cents >= PLANT_PROBATION_THRESHOLD_CENTS  else ACTIVE

      CONSERVED QUANTITY (network chargeback):
        network_chargeback_cents =
            sum over Plant   of chargeback_balance_cents
          + sum over Hauler  of chargeback_balance_cents
          + sum over SetCrew of chargeback_balance_cents
        equals the sum of approved_amount_cents over all ADJUDICATED DamageClaim rows,
        at every observable instant.
    input_set: |
      (a) source: DamageClaim rows with status == ADJUDICATED only - SUBMITTED,
      UNDER_REVIEW, DISPUTED and REVERSED rows are excluded. (b) window: all rows,
      unbounded in time. (c) order: summation is order-insensitive (integer addition),
      so no tie-break is required.
    constants:
      HAULER_SUSPENSION_THRESHOLD_CENTS: 500000
      PLANT_PROBATION_THRESHOLD_CENTS: 750000
    precision: "whole cents, exact integer arithmetic, no rounding"

  - name: escort_reserved_minutes
    trigger: "POST /installations/escort-assignments, POST /installations/escort-assignments/{id}/release, POST /installations/route-legs/{id}/arrive, and the cascade of POST /installations/permits/{id}/revoke; writes EscortCrew.reserved_minutes and refreshes EscortCrew.status"
    algorithm: aggregation
    formula: |
      per assignment (frozen at creation):
        EscortAssignment.reserved_minutes =
          round_half_up((window_end - window_start) total_seconds / 60, 0)

      per crew (full recompute):
        EscortCrew.reserved_minutes =
          sum of EscortAssignment.reserved_minutes over rows where
            escort_crew_id == this EscortCrew.id and status == RESERVED

      EscortCrew.status = OVERBOOKED if reserved_minutes > max_reserved_minutes
                          else AVAILABLE

      CONSERVED QUANTITY (escort reserved-minute ledger):
        for every EscortCrew, reserved_minutes always equals the sum above; a
        reservation followed by its compensating release restores the pre-reservation
        value exactly, with zero drift.
    input_set: |
      (a) source: EscortAssignment rows with status == RESERVED only - RELEASED and
      COMPLETED rows are excluded. (b) window: all rows, unbounded in time.
      (c) order: integer summation, order-insensitive, no tie-break required.
    constants: {}
    precision: "whole minutes, round_half_up at assignment creation; exact integer summation thereafter"

  - name: escort_window_conflict
    trigger: "POST /installations/escort-assignments, before the row is created"
    algorithm: interval_merge
    formula: |
      Let crew = EscortCrew(escort_crew_id), B = crew.buffer_minutes.
      Reservations are HALF-OPEN intervals [window_start, window_end), inflated
      symmetrically by B on both sides for conflict testing:

        conflict = exists E in EscortAssignment where
             E.escort_crew_id == escort_crew_id
         and E.status == RESERVED
         and new.window_start <  E.window_end   + B minutes
         and E.window_start   <  new.window_end + B minutes

      Consequence to note: with B > 0 a back-to-back reservation
      (new.window_start == E.window_end) CONFLICTS; with B == 0 the same
      back-to-back reservation is ACCEPTED, because the half-open comparison
      new.window_start < E.window_end is then false.
    input_set: |
      (a) source: EscortAssignment rows with status == RESERVED and the same
      escort_crew_id; RELEASED and COMPLETED rows never conflict. (b) window: the
      inflated half-open interval described above. (c) order: existence test, so no
      ordering or tie-break is observable.
    constants: {}
    precision: "minute-resolution instants; comparisons are strict (<) after buffer inflation"

  - name: set_crew_day_load
    trigger: "POST /installations/set-jobs, before the row is created"
    algorithm: aggregation
    formula: |
      Let crew = SetCrew(set_crew_id). SetJob day commitments are CLOSED calendar-date
      intervals [scheduled_start_date, scheduled_end_date] - both endpoints are
      occupied days.

      for each calendar date D in the candidate's closed interval:
        load(D) = count of SetJob rows where
                    set_crew_id == crew.id
                and progress_status in {SCHEDULED, DISPATCHED, SET_COMPLETE}
                and D is within [scheduled_start_date, scheduled_end_date] inclusive
        if load(D) + 1 > crew.daily_capacity: reject with ERR_SET_CREW_CAPACITY_EXCEEDED

      Consequence to note: two jobs that merely touch (one ends on D, the next starts
      on D) both occupy D, so with daily_capacity == 1 the second is rejected. This is
      aggregate-capacity-per-day arithmetic on inclusive endpoints, structurally
      different from the buffered half-open pairwise exclusion used for EscortCrew.
    input_set: |
      (a) source: SetJob rows with the same set_crew_id and progress_status in
      {SCHEDULED, DISPATCHED, SET_COMPLETE}; CLOSED and SUPERSEDED rows release their
      days. (b) window: every calendar date in the candidate's inclusive interval.
      (c) order: counting, order-insensitive, no tie-break required.
    constants: {}
    precision: "whole-day granularity, UTC calendar dates"

  - name: site_readiness_evaluation
    trigger: "POST /installations/sites/{id}/readiness-inspection; writes Site.blocking_defect_count and Site.readiness_status"
    algorithm: threshold
    formula: |
      pier_plan_effective = pier_plan_pass
                            and site.pier_count >= MIN_PIERS_PER_SECTION * order.section_count
      utility_effective   = utility_pass
                            and site.utility_water and site.utility_sewer and site.utility_electric

      blocking_defect_count = (0 if pad_pass else 1)
                            + (0 if pier_plan_effective else 1)
                            + (0 if utility_effective   else 1)

      readiness_status = READY if blocking_defect_count == 0 else READINESS_FAILED
    input_set: |
      Single Site row plus its InstallationOrder (for section_count). The three
      inspector verdicts come from the request body; the stub-out and pier-count
      facts come from the stored Site row.
    constants:
      MIN_PIERS_PER_SECTION: 6
    precision: "integer count in 0..3"

  - name: anchor_certification_evaluation
    trigger: "POST /installations/anchor-certifications and POST /installations/anchor-certifications/{id}/resubmit; writes AnchorCertification.hud_pass and AnchorCertification.state_pass"
    algorithm: threshold
    formula: |
      required_anchors = REQUIRED_ANCHORS_PER_ZONE[order.wind_zone] * order.section_count

      hud_pass =    anchor_count      >= required_anchors
                and avg_torque_ft_lb  >= MIN_TORQUE_FT_LB
                and strap_count       >= anchor_count * REQUIRED_STRAPS_PER_ANCHOR

      state_pass = anchor_count >= required_anchors
                     + (STATE_EXTRA_ANCHORS if order.destination_state in STATE_EXTRA_ANCHOR_STATES else 0)

      Both torque and anchor-count comparisons are inclusive (>=): an average torque
      of exactly MIN_TORQUE_FT_LB passes.
    input_set: |
      Single AnchorCertification row plus the InstallationOrder reached through
      SetJob.order_id (for wind_zone, section_count and destination_state).
    constants:
      MIN_TORQUE_FT_LB: 175
      REQUIRED_STRAPS_PER_ANCHOR: 1
      STATE_EXTRA_ANCHORS: 4
      MAX_ANCHOR_REVISIONS: 3
      REQUIRED_ANCHORS_PER_ZONE: { I: 8, II: 12, III: 16 }
      STATE_EXTRA_ANCHOR_STATES: [KS, CO]
    precision: "integer counts; torque compared as a decimal number"

  - name: order_posture
    trigger: "recomputed as a side effect of every successful mutation to an InstallationOrder or to any of its HomeSection, Site, TransportPermit, RouteLeg or SetJob descendants; writes InstallationOrder.posture"
    algorithm: constraint_propagation
    formula: |
      Evaluated as an ordered first-match-wins ladder over the order's descendants:

      P1 CLOSED           if count(SetJob with order_id == order.id) >= 1
                          and every such SetJob with progress_status != SUPERSEDED
                              has progress_status == CLOSED
      P2 TRANSPORT_BLOCKED elif exists HomeSection with order_id == order.id and
                              transit_status in {PERMIT_REVOKED_HOLD, DAMAGED_HOLD}
                            or exists RouteLeg with status == HAULER_HOLD whose
                              permit_id resolves through TransportPermit.section_id to a
                              HomeSection with order_id == order.id
      P3 SET_IN_PROGRESS   elif exists SetJob with order_id == order.id and
                              progress_status in {DISPATCHED, SET_COMPLETE}
      P4 SITE_BLOCKED      elif exists Site with order_id == order.id and
                              readiness_status in {READINESS_PENDING, READINESS_FAILED}
                          and exists SetJob with order_id == order.id and
                              progress_status == SCHEDULED
      P5 OPEN              else

      A freshly created order with no descendants therefore reads OPEN (P5).
    input_set: |
      (a) source: all HomeSection, Site, RouteLeg and SetJob rows of the order, with the
      explicit status enum sets written above; no row is selected "by description".
      (b) window: current state at the end of the mutating request. (c) order: the
      P1..P5 ladder is total and first-match-wins, so no tie-break is reachable.
    constants: {}
    precision: "enumerated band, no arithmetic"

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST violated rule determines the response - later violations are
#     never reported, even when the request violates several rules at once)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Runs before any body parsing or path resolution."

  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's authorized_roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
    description: "Role gate. Precedes schema validation, so a wrong-role request with a malformed body still returns ERR_UNAUTHORIZED."

  - priority: 3
    category: existence
    check: "request body parses and satisfies the endpoint's field schema: required fields present, types correct, enum values in range, numbers within stated bounds, datetimes ISO-8601 UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
    description: "Pure shape check with no database reads."

  - priority: 4
    category: existence
    check: "every {id} path parameter resolves to an existing row of the addressed entity"
    error_id: "<ENTITY>_NOT_FOUND (e.g. ERR_SET_JOB_NOT_FOUND, ERR_PERMIT_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: "Path existence outranks body-FK existence, so a bad path id on a request that also carries a bad FK returns the path error."

  - priority: 5
    category: existence
    check: "every foreign-key field in the request body resolves to an existing row of the referenced entity"
    error_id: "<ENTITY>_NOT_FOUND (e.g. ERR_ORDER_NOT_FOUND, ERR_SET_CREW_NOT_FOUND, ERR_ESCORT_CREW_NOT_FOUND)"
    http_status: 404
    applies_to: "all creation endpoints"
    description: "Body FKs are resolved left-to-right in the order the fields appear in the endpoint's request_body list."

  - priority: 6
    category: auth
    check: "for an entity_backed role, the acting principal owns the addressed resource: PlantDispatcher's plant_id equals the resolved Plant, TransportManager's hauler_id equals the resolved Hauler, SetCrewLead's set_crew_id equals the resolved SetCrew"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /installations/sections/{id}/measure, POST /installations/sections/{id}/release, POST /installations/route-legs/{id}/depart, POST /installations/route-legs/{id}/arrive, POST /installations/set-jobs/{id}/scope-split, POST /installations/set-jobs/{id}/utility-crossover, POST /installations/set-jobs/{id}/close-marriage-line, POST /installations/marriage-joints, POST /installations/anchor-certifications, POST /installations/anchor-certifications/{id}/resubmit"
    description: "Ownership is checked only after the resource is known to exist; it is an authorization decision, not an existence one."

  - priority: 7
    category: state
    check: "the addressed entity's current state permits the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
    description: "Generic state gate. All specialised readiness rules below (priorities 8-30) are evaluated only once the base transition is legal, so a terminal-state row always yields ERR_INVALID_STATE rather than a domain-specific error."

  - priority: 8
    category: state
    check: "the InstallationOrder's Site has readiness_status == READY"
    error_id: ERR_SITE_NOT_READY
    http_status: 409
    applies_to: "POST /installations/set-jobs/{id}/dispatch"
    description: "Cross-entity state dependency (SetJob -> Site). Deliberately ranked ABOVE the licence check at priority 11, so a dispatch that is both site-blocked and crew-unlicensed reports ERR_SITE_NOT_READY."

  - priority: 9
    category: state
    check: "the InstallationOrder's posture is not TRANSPORT_BLOCKED"
    error_id: ERR_ORDER_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /installations/set-jobs/{id}/dispatch, POST /installations/set-jobs/{id}/final-inspection"
    description: "A held section or a HAULER_HOLD leg freezes downstream set work at the order level."

  - priority: 10
    category: state
    check: "expected_<parent>_version in the request body equals the parent row's current version (see §1.2.1)"
    error_id: "ERR_STALE_ORDER_VERSION | ERR_STALE_SECTION_VERSION"
    http_status: 412
    applies_to: "POST /installations/set-jobs, POST /installations/permits"
    description: "Optimistic concurrency. Ranked below the state gates so a wrong-state parent reports its state error even when the supplied version is also stale."

  - priority: 11
    category: business_safety
    check: "the assigned SetCrew has status == ACTIVE and license_expiry_date is on or after the current logical date"
    error_id: ERR_INSTALLER_LICENSE_INVALID
    http_status: 422
    applies_to: "POST /installations/set-jobs/{id}/dispatch, POST /installations/anchor-certifications"
    description: "Installer licensure. Lower priority than ERR_SITE_NOT_READY (8) by design - that pair is the priority-conflict probe."

  - priority: 12
    category: business_safety
    check: "the EscortCrew carries the endorsement the route leg's permit_class demands: SUPERLOAD requires endorsement_class SUPERLOAD; OVERSIZE requires SUPERLOAD or OVERSIZE; STANDARD accepts any"
    error_id: ERR_ESCORT_ENDORSEMENT_MISSING
    http_status: 422
    applies_to: "POST /installations/escort-assignments"
    description: "Safety qualification. Deliberately ranked ABOVE the temporal window check at priority 22, so an unendorsed crew with a clashing window reports ERR_ESCORT_ENDORSEMENT_MISSING."

  - priority: 13
    category: business_safety
    check: "the EscortCrew has status == AVAILABLE"
    error_id: ERR_ESCORT_CREW_OVERBOOKED
    http_status: 422
    applies_to: "POST /installations/escort-assignments, POST /installations/route-legs/{id}/depart"
    description: "Cross-entity state dependency (RouteLeg -> EscortCrew): departure is blocked while any RESERVED assignment on the leg belongs to an OVERBOOKED crew."

  - priority: 14
    category: business_safety
    check: "the RouteLeg's Hauler has status == ACTIVE"
    error_id: ERR_HAULER_SUSPENDED
    http_status: 422
    applies_to: "POST /installations/route-legs, POST /installations/route-legs/{id}/depart"
    description: "A chargeback-suspended hauler cannot take new or existing legs on the road."

  - priority: 15
    category: business_safety
    check: "the acting X-User-ID differs from Site.last_inspector_user_id of the order's Site"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /installations/set-jobs/{id}/final-inspection"
    description: "Segregation of duties: whoever signed the site-readiness inspection may not also sign the final installation inspection."

  - priority: 16
    category: business_constraint
    check: "referential coherence between the addressed rows: a RouteLeg's state_code must equal the state_code of the TransportPermit it is filed under, because a permit authorises movement in exactly one state; a HomeSection's mates_to_section_id must point at a different section of the SAME order and must not already be mated to a third section"
    error_id: "ERR_LEG_PERMIT_MISMATCH | ERR_SECTION_MATE_INVALID"
    http_status: 422
    applies_to: "POST /installations/route-legs, POST /installations/sections, PATCH /installations/sections/{id}"
    description: "Self-referential integrity for the marriage pairing plus permit/leg coherence."

  - priority: 17
    category: business_constraint
    check: "every HomeSection of the order has transit_status == DELIVERED, and the count of sections equals InstallationOrder.section_count"
    error_id: "ERR_SECTIONS_NOT_DELIVERED | ERR_SECTION_COUNT_MISMATCH"
    http_status: 422
    applies_to: "POST /installations/set-jobs/{id}/dispatch"
    description: "No crew is dispatched to set a home whose sections are not all on site."

  - priority: 18
    category: business_constraint
    check: "an AnchorCertification with status == CERTIFIED exists for the SetJob"
    error_id: ERR_ANCHOR_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /installations/set-jobs/{id}/final-inspection"
    description: "HUD/state anchoring certification gates the final inspection and therefore the warranty start."

  - priority: 19
    category: business_constraint
    check: "SetJob.closure_status is PASS or NOT_APPLICABLE"
    error_id: ERR_MARRIAGE_LINE_NOT_CLOSED
    http_status: 422
    applies_to: "POST /installations/set-jobs/{id}/final-inspection"
    description: "A FAIL or still-pending marriage line blocks the final inspection; a single-section home passes vacuously via NOT_APPLICABLE."

  - priority: 20
    category: business_constraint
    check: "SetJob.scope_status == SCOPE_DELIVERED (which is only reachable through SCOPE_SPLIT) and SetJob.crossover_recorded is true"
    error_id: "ERR_SCOPE_SPLIT_INCOMPLETE | ERR_UTILITY_CROSSOVER_INCOMPLETE"
    http_status: 422
    applies_to: "POST /installations/set-jobs/{id}/final-inspection"
    description: "The invoice cannot be assembled until the skirting/steps scope split and the utility crossover are both recorded."

  - priority: 21
    category: business_temporal
    check: "window_end is strictly after window_start; scheduled_end_date is on or after scheduled_start_date"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /installations/escort-assignments, POST /installations/set-jobs"
    description: "Interval well-formedness, checked before any overlap arithmetic."

  - priority: 22
    category: business_temporal
    check: "the requested escort window does not conflict with any RESERVED assignment of the same EscortCrew once both intervals are inflated by EscortCrew.buffer_minutes (see calculations.escort_window_conflict)"
    error_id: ERR_ESCORT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /installations/escort-assignments"
    description: "Buffered half-open pairwise exclusion; adjacency conflicts when buffer_minutes > 0."

  - priority: 23
    category: business_temporal
    check: "for every calendar date in the candidate SetJob's inclusive date range, the SetCrew's committed job count stays within daily_capacity (see calculations.set_crew_day_load)"
    error_id: ERR_SET_CREW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /installations/set-jobs"
    description: "Aggregate per-day capacity on inclusive endpoints; each job individually fits but the collective on a shared date does not."

  - priority: 24
    category: business_constraint
    check: "scoped uniqueness holds: (order_id, section_index), (permit_id, leg_sequence), (set_job_id, joint_index) are each unique, and at most one AnchorCertification exists per SetJob in a non-FAILED status"
    error_id: "ERR_DUPLICATE_SECTION_INDEX | ERR_DUPLICATE_LEG_SEQUENCE | ERR_DUPLICATE_JOINT_INDEX | ERR_DUPLICATE_ANCHOR_CERT"
    http_status: 409
    applies_to: "POST /installations/sections, POST /installations/route-legs, POST /installations/marriage-joints, POST /installations/anchor-certifications"
    description: "Uniqueness is the sanctioned conflict mechanism for repeated child creation; no wall-clock ordering is involved."

  - priority: 25
    category: business_constraint
    check: "the number of MarriageJoint rows on the SetJob equals max(0, InstallationOrder.section_count - 1)"
    error_id: ERR_MARRIAGE_JOINT_COUNT_MISMATCH
    http_status: 422
    applies_to: "POST /installations/set-jobs/{id}/close-marriage-line"
    description: "A three-section home needs exactly two joints recorded before the line can be closed."

  - priority: 26
    category: business_constraint
    check: "the count of RESERVED EscortAssignment rows with role == ESCORT across the permit's non-cancelled RouteLegs is at least the FINAL escort_count_required, AND, when the FINAL pilot_car_required is true, at least one RESERVED EscortAssignment with role == PILOT_CAR exists across those same legs"
    error_id: ERR_PERMIT_ESCORT_SHORTFALL
    http_status: 422
    applies_to: "POST /installations/permits/{id}/issue"
    description: "Escort sufficiency is aggregate across the permit, not per leg, and covers both arms of the requirement matrix: the escort head-count and the conditional pilot-car reservation. Ranked ABOVE the fee check at priority 29 so an under-escorted, under-paid permit reports the shortfall."

  - priority: 27
    category: business_constraint
    check: "AnchorCertification.revision_round is below MAX_ANCHOR_REVISIONS"
    error_id: ERR_ANCHOR_REVISION_LIMIT
    http_status: 422
    applies_to: "POST /installations/anchor-certifications/{id}/resubmit"
    description: "Terminates the SUBMITTED -> CHANGES_REQUIRED -> SUBMITTED cycle."

  - priority: 28
    category: business_constraint
    check: "for allocation_basis == EVIDENCE the three evidence-point fields sum to at least 1; for allocation_basis == STAGE the claim's discovered_stage is a key of STAGE_OWNER"
    error_id: "ERR_CLAIM_EVIDENCE_MISSING | ERR_CLAIM_STAGE_MISMATCH"
    http_status: 422
    applies_to: "POST /installations/damage-claims/{id}/adjudicate"
    description: "Guards the divisor of the EVIDENCE split and the lookup of the STAGE owner."

  - priority: 29
    category: business_fiscal
    check: "TransportPermit.paid_amount_cents is at least the FINAL final_fee_cents"
    error_id: ERR_PERMIT_FEE_UNPAID
    http_status: 402
    applies_to: "POST /installations/permits/{id}/issue"
    description: "A re-measured or re-routed permit can outgrow the provisional fee already paid, so the FINAL fee is re-checked at issuance."

  - priority: 30
    category: business_fiscal
    check: "DamageClaim.claimed_amount_cents does not exceed CLAIM_CAP_CENTS"
    error_id: ERR_CLAIM_AMOUNT_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /installations/damage-claims"
    description: "Network-level exposure ceiling on a single transit-damage claim."

# =============================================================================
# 1.5 API Endpoint Table
#
# `api_prefix: /installations` is a NAMESPACE, not a resource: every business
# collection lives at `/installations/<collection>` and every single-resource
# read at `/installations/<collection>/{id}`. FK reverse-reachability is
# provided uniformly by the FILTERED-LIST form - each child collection's list
# endpoint accepts every one of that child's FK fields as an optional filter
# and returns `<Child>[]`.
# =============================================================================
endpoints:

  # --- test-driving: logical clock ------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    description: "Sets the server's logical current UTC instant, which every date/expiry/window rule reads. The server's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Test-driving endpoint (last rung of the §1.5 priority ladder) - no business endpoint can move time."
    roles: [NetworkAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects:
      - "all subsequent licence-expiry, insurance-expiry, permit validity and calendar-day evaluations read the new instant"

  # --- Plant ----------------------------------------------------------------
  - method: POST
    path: /installations/plants
    description: "Registers a manufacturing plant in the installation network."
    roles: [NetworkAdmin]
    code: 201
    input: [name, state_code, hud_plant_code]
    output: Plant
    side_effects:
      - "chargeback_balance_cents initialised to 0 and status to ACTIVE"
  - method: GET
    path: /installations/plants/{id}
    description: "Reads one plant, including its current chargeback balance and probation status."
    roles: [NetworkAdmin, PlantDispatcher, TransportManager, PermitDesk, SetCrewLead, InstallationInspector, ClaimsAdjuster]
    code: 200
    output: Plant
    side_effects: []
  - method: GET
    path: /installations/plants
    description: "Lists plants with optional status/state filters and pagination."
    roles: [NetworkAdmin, PlantDispatcher, TransportManager, PermitDesk, SetCrewLead, InstallationInspector, ClaimsAdjuster]
    code: 200
    input: ["status?", "state_code?", "limit?", "offset?"]
    output: Plant[]
    side_effects: []

  # --- Hauler ---------------------------------------------------------------
  - method: POST
    path: /installations/haulers
    description: "Registers a motor carrier authorised to run transport legs."
    roles: [NetworkAdmin]
    code: 201
    input: [name, dot_number, insurance_expiry_date, endorsed_states]
    output: Hauler
    side_effects:
      - "chargeback_balance_cents initialised to 0 and status to ACTIVE"
  - method: GET
    path: /installations/haulers/{id}
    description: "Reads one hauler, including chargeback balance and suspension status."
    roles: [NetworkAdmin, PlantDispatcher, TransportManager, PermitDesk, SetCrewLead, InstallationInspector, ClaimsAdjuster]
    code: 200
    output: Hauler
    side_effects: []
