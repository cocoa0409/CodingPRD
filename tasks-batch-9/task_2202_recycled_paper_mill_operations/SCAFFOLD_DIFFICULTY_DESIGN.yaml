            - { call: "GET /reject-streams/summary", payload: {}, as: EnvironmentalOfficer, as_user_id: "env_1" }
            - { call: "POST /reject-streams/${rs_a}/reverse", payload: {}, as: EnvironmentalOfficer, as_user_id: "env_1" }
