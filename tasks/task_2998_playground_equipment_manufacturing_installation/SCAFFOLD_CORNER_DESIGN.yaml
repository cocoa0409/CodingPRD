          - state_machines.DesignProject
        distinguishing_aspect: "Accepting a PROVISIONAL quote is 409 on its own dedicated code rather than a generic state error; cancelling an already CANCELLED project is 409 ERR_PROJECT_NOT_CANCELLABLE; and pledging into a CANCELLED project is 409 ERR_PROJECT_NOT_FUNDABLE - three distinct codes from one project."
