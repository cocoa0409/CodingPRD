  # ---------------------------------------------------------------------------
  # Rule 6: boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: increase_exactly_at_high_threshold_gets_low_notice
        grounds:
          - calculations.notice_days_required
          - entities.RenewalOffer.fields.notice_days_required
        distinguishing_aspect: |
          Metric: basis-point increase threshold; endpoint: POST /leases/{id}/renewal-offers.
          Strictly-greater comparison: an increase of exactly 500 bps (market 210000 vs rent
          200000 under AGGRESSIVE with a 12-month zero-discount term) takes the LOW 60-day notice
          tier; only 501 bps would take 90. The boundary value itself must not trigger the high tier.
        test_recipe:
          setup:
            - "Policy CA-OAK (high_increase_threshold_bps 500, notice 60/90); property band [12,12] so term discount is 0"
            - "Unit market 210000 -> gap exactly 500 bps; AGGRESSIVE factor 1.0 -> strategy 500; cap 550 does not bind"
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Threshold Court", rent_cap_policy_id: "${pol}", min_term_months: 12, max_term_months: 12 }
              as: PlatformAdmin
              captures: { prop: "$.data.id" }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "901", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { unit: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Iris Ben", email: "iris.ben@x.com" }
              as: PlatformAdmin
              captures: { res: "$.data.id" }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease: "$.data.id", lease_v: "$.data.version" }
          trigger:
            - call: "POST /leases/${lease}/renewal-offers"
              payload: { rate_strategy: "AGGRESSIVE", expected_lease_version: "${lease_v}" }
              as: LeasingAgent
              captures: { offer: "$.data.id", incr: "$.data.proposed_increase_bps", proposed: "$.data.proposed_rent_cents", notice_days: "$.data.notice_days_required", latest: "$.data.latest_issue_date" }
          assert:
            - "proposed == 210000 and incr == 500 (exactly the threshold)"
            - "notice_days == 60 (strictly-greater threshold: 500 > 500 is false -> LOW tier, not 90)"
            - "latest == 2027-04-02 (2027-06-01 minus 60 days)"

      - name: empty_cohort_retention_rate_null
        grounds:
          - calculations.retention_rate_bps
          - "endpoints: GET /properties/{id}/retention-metrics"
        distinguishing_aspect: |
          Metric: cohort size (empty-set edge), endpoint: GET /properties/{id}/retention-metrics —
          a different metric and endpoint than the sibling bps-threshold instance. With zero leases
          anchored to the window, retention_rate_bps must be null (division by zero is forbidden),
          while cohort_size reports 0.
        test_recipe:
          setup:
            - "Policy CA-OAK; property band [12,12]; NO units, leases, offers, or notices exist"
          setup_api_calls:
            - call: "POST /rent-cap-policies"
