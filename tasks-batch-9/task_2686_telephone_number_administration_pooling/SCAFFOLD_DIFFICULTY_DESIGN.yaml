      - name: comment_at_window_close_instant_rejected_and_zero_comments_recommends_overlay
        grounds:
          - validations[priority=21]
          - calculations.comment_tally_weighted
          - state_machines.ReliefPlan.PUBLIC_COMMENT_to_OVERLAY_RECOMMENDED
          - errors.ERR_COMMENT_WINDOW_CLOSED
          - entities.ReliefPlan.fields.comment_window_close_at
        distinguishing_aspect: |
          The comment window is half-open: a comment filed at exactly
          comment_window_close_at (2026-08-31T00:00:00Z) is refused with
          ERR_COMMENT_WINDOW_CLOSED while CLOSE_AND_RECOMMEND at that same
          instant is allowed, and the resulting zero-comment tally must
          recommend ALL_SERVICES_OVERLAY with both weights at 0.00 rather than
          leaving recommended_relief_type UNDETERMINED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "NPA 614 declared into JEOPARDY by the administrator."
            - "A relief plan on NPA 614 with planned_relief_type UNDETERMINED and comment_window_days 30, moved to PUBLIC_COMMENT at 2026-08-01T00:00:00Z so the window closes at 2026-08-31T00:00:00Z."
            - "No comment has been filed."
            - "The clock is moved to exactly 2026-08-31T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: $.data.id }
            - call: "POST /numbering/npas/${npa_id}/jeopardy-declarations"
              payload: { reason: "forecast exhaust inside eight quarters" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas/${npa_id}/relief-plans"
              payload: { planned_relief_type: "UNDETERMINED", comment_window_days: 30 }
              as: NumberingAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /numbering/relief-plans/${plan_id}/transitions"
              payload: { action: "OPEN_COMMENT" }
              as: NumberingAdministrator
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "POST /numbering/relief-plans/${plan_id}/comments"
              payload: { commenter_type: "CONSUMER", position: "SUPPORT_SPLIT", body: "filed at the closing instant" }
              as: PublicCommenter
              as_user_id: "commenter-1"
            - call: "POST /numbering/relief-plans/${plan_id}/transitions"
              payload: { action: "CLOSE_AND_RECOMMEND" }
              as: NumberingAdministrator
              as_user_id: "admin-1"
          assert:
            - "ReliefPlan.${plan_id}.comment_window_open_at == 2026-08-01T00:00:00Z and comment_window_close_at == 2026-08-31T00:00:00Z"
            - "The comment filed at exactly 2026-08-31T00:00:00Z returns 409 with error_id ERR_COMMENT_WINDOW_CLOSED"
            - "CLOSE_AND_RECOMMEND at the same instant returns 200 (the close boundary is inclusive for closing and exclusive for commenting)"
            - "ReliefPlan.${plan_id}.status == OVERLAY_RECOMMENDED with recommended_relief_type == ALL_SERVICES_OVERLAY"
            - "ReliefPlan.${plan_id}.support_overlay_weight == 0.00, support_split_weight == 0.00 and comment_count == 0"
            - "ReliefPlan.${plan_id}.recommender_user_id == admin-1"

      - name: contamination_exactly_one_hundred_stays_pooling_eligible
        grounds:
          - entities.NumberBlock.fields.is_pooling_eligible
          - calculations.block_pool_selection
          - validations[priority=28]
          - errors.ERR_BLOCK_NOT_POOLING_ELIGIBLE
        distinguishing_aspect: |
          CONTAMINATION_MAX_FOR_POOLING is inclusive, so a block with
          contaminated_count exactly 100 is a legal pool candidate and is the
          block granted, while its neighbour at 101 is invisible to
          block_pool_selection and stays POOL_AVAILABLE - an implementation
          using a strict < 100 test would find no eligible candidate among two
          unrouted POOL_AVAILABLE blocks and raise
