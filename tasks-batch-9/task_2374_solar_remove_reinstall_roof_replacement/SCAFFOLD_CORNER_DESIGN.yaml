              as: ProjectCoordinator
              captures: { p1: $.data.id }
            - call: "POST /reroof/projects/${p1}/party-approvals"
              payload: { party_id: "${roofer_id}" }
              as: ProjectCoordinator
              captures: { ap_roof: $.data.id }
            - call: "POST /reroof/projects/${p1}/party-approvals"
              payload: { party_id: "${owner_id}" }
              as: ProjectCoordinator
              captures: { ap_own: $.data.id }
            - call: "POST /reroof/projects/${p1}/party-approvals"
              payload: { party_id: "${sysowner_id}" }
              as: ProjectCoordinator
              captures: { ap_sys: $.data.id }
            - call: "POST /reroof/party-approvals/${ap_roof}/decision"
              payload: { decision: "APPROVE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
            - call: "POST /reroof/party-approvals/${ap_own}/decision"
              payload: { decision: "APPROVE" }
              as: SolarOwner
              as_user_id: "${owner_id}"
            - call: "POST /reroof/party-approvals/${ap_sys}/decision"
              payload: { decision: "APPROVE" }
              as: SystemOwner
              as_user_id: "${sysowner_id}"
            - call: "POST /reroof/projects/${p1}/array-circuits"
              payload: { circuit_label: "A1", module_count: 1, dc_kw: 0.41 }
              as: ProjectCoordinator
              captures: { c1: $.data.id }
          trigger:
            - call: "GET /reroof/projects/${p1}/downtime-summary"
              as: SystemOwner
              as_user_id: "${sysowner_id}"
              captures: { pre_reserved: $.data.credit_reserved_cents, pre_balanced: $.data.ledger_balanced }
            - call: "POST /reroof/array-circuits/${c1}/energization"
              payload: { action: "DE_ENERGIZE", interlock_verified: true }
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "GET /reroof/projects/${p1}/downtime-summary"
              as: SolarOwner
              as_user_id: "${owner_id}"
              captures: { post_provisional: $.data.provisional_credit_cents, post_authorized: $.data.credit_authorized_cents, post_reserved: $.data.credit_reserved_cents, post_days: $.data.downtime_days_actual }
          assert:
            - "both summary reads return HTTP 200"
            - "${pre_reserved} == 0"
            - "${pre_balanced} == true"
            - "the first summary read has provisional_credit_cents == 0, final_credit_cents == 0, credit_authorized_cents == 0, credit_settled_cents == 0, credit_released_cents == 0, downtime_days_actual == 0"
            - "${post_provisional} == 1999"
