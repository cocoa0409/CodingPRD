# =============================================================================
# §1.8 Scaffold Difficulty Design — task_3491
# Nine Difficulty Rules x 2 instances. All chains replayable from empty DB
# against SCAFFOLD.yaml §1.5. Server default clock: 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: return_rate_settlement_vs_origination_basis_divergence
        grounds:
          - calculations.return_rate_computation
          - entities.ReturnRateSnapshot.fields.settlement_unauth_rate
          - entities.ReturnRateSnapshot.fields.origination_unauth_rate
          - endpoints.POST_/network/return-rate-snapshots
        distinguishing_aspect: "Dual-variant on the Participant risk domain: one late-arriving October return of a September entry lifts the settlement-basis unauthorized rate to 0.25 (breach) while the origination-basis rate on the identical data stays 0.0 (no breach) — the two variants disagree because they bucket the same return differently."
        test_recipe:
          setup:
            - "P1 (ODFI, ACTIVE) with approved originator O1; P2 (RDFI, ACTIVE) as the returning bank; transaction code PPD (authorization NONE, return timeframe 30 banking days, no account validation); window W1 cutoff 17:00 UTC."
            - "Entry A (50000 cents) originated 2026-09-01 and settled 2026-09-01 via W1."
            - "Entries B1..B4 (10000 cents each) originated 2026-10-05 and settled 2026-10-05 via W1."
            - "A is returned by P2 on 2026-10-06 with reason UNAUTHORIZED_DEBIT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "First Originating Bank", participant_type: "ODFI", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "Second Receiving Bank", participant_type: "RDFI", routing_number: "222000039" }
              as: PlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /network/participants/${p2}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/transaction-codes"
              payload: { code: "PPD", entry_class: "DEBIT", authorization_requirement: "NONE", return_timeframe_banking_days: 30, account_validation_required: false, warranty_obligations: "ODFI warrants authorization" }
              as: PlatformAdmin
              captures: { tc_ppd: $.data.id }
            - call: "POST /network/settlement-windows"
              payload: { window_code: "W1", cutoff_time_utc: "17:00", per_entry_limit_cents: 100000000, odfi_window_cap_cents: 2500000000 }
              as: PlatformAdmin
              captures: { w1: $.data.id }
            - call: "POST /network/originators"
              payload: { legal_name: "Alpha Payroll Corp", risk_tier: "STANDARD", exposure_limit_cents: 1000000000 }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { o1: $.data.id }
            - call: "POST /network/originators/${o1}/transition"
              payload: { to_state: "APPROVED" }
              as: ParticipantOfficer
              as_user_id: "${p1}"
            - call: "POST /network/payment-entries"
              payload: { originator_id: "${o1}", transaction_code_id: "${tc_ppd}", amount_cents: 50000, receiver_account_number_hash: "acct-a", receiver_name: "R A", authorization_type: "NONE", same_day: false }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { ea: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T18:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/settlement-windows/${w1}/run-settlement"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/payment-entries"
              payload: { originator_id: "${o1}", transaction_code_id: "${tc_ppd}", amount_cents: 10000, receiver_account_number_hash: "acct-b1", receiver_name: "R B1", authorization_type: "NONE", same_day: false }
              as: ParticipantOfficer
              as_user_id: "${p1}"
            - call: "POST /network/payment-entries"
              payload: { originator_id: "${o1}", transaction_code_id: "${tc_ppd}", amount_cents: 10000, receiver_account_number_hash: "acct-b2", receiver_name: "R B2", authorization_type: "NONE", same_day: false }
              as: ParticipantOfficer
              as_user_id: "${p1}"
            - call: "POST /network/payment-entries"
              payload: { originator_id: "${o1}", transaction_code_id: "${tc_ppd}", amount_cents: 10000, receiver_account_number_hash: "acct-b3", receiver_name: "R B3", authorization_type: "NONE", same_day: false }
              as: ParticipantOfficer
              as_user_id: "${p1}"
            - call: "POST /network/payment-entries"
              payload: { originator_id: "${o1}", transaction_code_id: "${tc_ppd}", amount_cents: 10000, receiver_account_number_hash: "acct-b4", receiver_name: "R B4", authorization_type: "NONE", same_day: false }
              as: ParticipantOfficer
              as_user_id: "${p1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T18:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/settlement-windows/${w1}/run-settlement"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-06T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/payment-entries/${ea}/returns"
              payload: { reason_code: "UNAUTHORIZED_DEBIT" }
              as: ParticipantOfficer
              as_user_id: "${p2}"
          trigger:
            - call: "POST /network/return-rate-snapshots"
              payload: { participant_id: "${p1}", period: "2026-10" }
              as: PlatformAdmin
              captures: { snap: $.data.id, snap_unauth_breach: $.data.unauth_breach }
            - call: "GET /network/inquiry-cases?participant_id=${p1}&return_rate_snapshot_id=${snap}"
              payload: {}
              as: PlatformAdmin
              captures: { inquiry_count: $.data }
          assert:
            - "snapshot ${snap}: forward_count == 4 and origination_forward_count == 4"
            - "snapshot ${snap}: unauth_return_count == 1 and origination_unauth_count == 0"
            - "snapshot ${snap}: settlement_unauth_rate == 0.25 (1 return received in Oct over 4 Oct settlements)"
            - "snapshot ${snap}: origination_unauth_rate == 0.0 (the returned entry was originated in Sep)"
            - "snapshot ${snap}: unauth_breach == true (1*100 > 4*10) while an origination-basis threshold check on the same data would not breach"
            - "exactly one InquiryCase exists for (${p1}, ${snap}) with return_class == UNAUTHORIZED and status == OPENED (auto-opened on breach)"

      - name: exposure_committed_vs_contingent_admission
        grounds:
          - calculations.exposure_position
          - entities.Originator.fields.committed_exposure_cents
          - entities.Originator.fields.contingent_exposure_cents
          - endpoints.POST_/network/payment-entries
        distinguishing_aspect: "Dual-variant on the Originator credit domain (distinct subject from the Participant risk rate): with a settled-but-still-returnable 60000000-cent entry and a 30000000-cent originated entry, committed reads 30000000 while contingent reads 90000000 — a 20000000-cent candidate passes the committed reading but the pinned contingent admission check rejects it."
        test_recipe:
          setup:
            - "P1 (ODFI, ACTIVE); originator O1 APPROVED with exposure_limit_cents 100000000; PPD code (30 banking-day returns); W1 window."
            - "Entry A 60000000 settled 2026-09-01 (inside its 30-banking-day return window on 2026-09-02)."
            - "Entry B 30000000 originated 2026-09-02, still ORIGINATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "First Originating Bank", participant_type: "ODFI", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/transaction-codes"
              payload: { code: "PPD", entry_class: "DEBIT", authorization_requirement: "NONE", return_timeframe_banking_days: 30, account_validation_required: false, warranty_obligations: "ODFI warrants authorization" }
              as: PlatformAdmin
              captures: { tc_ppd: $.data.id }
            - call: "POST /network/settlement-windows"
              payload: { window_code: "W1", cutoff_time_utc: "17:00", per_entry_limit_cents: 100000000, odfi_window_cap_cents: 2500000000 }
              as: PlatformAdmin
              captures: { w1: $.data.id }
            - call: "POST /network/originators"
              payload: { legal_name: "Alpha Payroll Corp", risk_tier: "STANDARD", exposure_limit_cents: 100000000 }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { o1: $.data.id }
            - call: "POST /network/originators/${o1}/transition"
              payload: { to_state: "APPROVED" }
              as: ParticipantOfficer
              as_user_id: "${p1}"
            - call: "POST /network/payment-entries"
              payload: { originator_id: "${o1}", transaction_code_id: "${tc_ppd}", amount_cents: 60000000, receiver_account_number_hash: "acct-a", receiver_name: "R A", authorization_type: "NONE", same_day: false }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { ea: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T18:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/settlement-windows/${w1}/run-settlement"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/payment-entries"
              payload: { originator_id: "${o1}", transaction_code_id: "${tc_ppd}", amount_cents: 30000000, receiver_account_number_hash: "acct-b", receiver_name: "R B", authorization_type: "NONE", same_day: false }
              as: ParticipantOfficer
              as_user_id: "${p1}"
          trigger:
            - call: "POST /network/payment-entries"
              payload: { originator_id: "${o1}", transaction_code_id: "${tc_ppd}", amount_cents: 20000000, receiver_account_number_hash: "acct-c", receiver_name: "R C", authorization_type: "NONE", same_day: false }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
            - call: "GET /network/originators/${o1}"
              payload: {}
              as: PlatformAdmin
              captures: { committed: $.data.committed_exposure_cents, contingent: $.data.contingent_exposure_cents }
          assert:
            - "the candidate entry is rejected with ERR_EXPOSURE_LIMIT_EXCEEDED (90000000 + 20000000 > 100000000 under the contingent basis)"
            - "Originator.${o1}.committed_exposure_cents == 30000000 (only the ORIGINATED entry B)"
            - "Originator.${o1}.contingent_exposure_cents == 90000000 (B plus the still-returnable settled A)"
            - "a committed-basis check on the same book would have admitted the entry (30000000 + 20000000 <= 100000000) — the two variants diverge on identical data, and the pinned basis is contingent"

  - rule_id: combinatorial_formula
    instances:
      - name: enforcement_fine_tiered_escalation_with_late_accrual
        grounds:
          - calculations.enforcement_fine_schedule
          - state_machines.EnforcementAction.ISSUED_to_PAID
          - entities.EnforcementAction.fields.fine_base_cents
          - entities.EnforcementAction.fields.escalation_tier
        distinguishing_aspect: "Mode (a) combinatorial: fine = min(BASE_BY_TIER[min(prior_count,3)] * type_multiplier + LATE_DAILY * max(0, days-30), CAP) — four inputs with nested min/max and tier selection; an RDFI's first violation paid 45 days after issuance totals 2500000 + 15*100000 = 4000000 cents, and a second violation's base alone doubles to 5000000."
        test_recipe:
          setup:
            - "P1 (RDFI, ACTIVE). Clock 2026-09-01 at issuance; first action paid on 2026-10-16 (45 days later, 15 days past the 30-day grace)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "Second Receiving Bank", participant_type: "RDFI", routing_number: "222000039" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/enforcement-actions"
              payload: { participant_id: "${p1}", violation_code: "MISSING_ACCOUNT_VALIDATION" }
              as: PlatformAdmin
              captures: { ea1: $.data.id, ea1_base: $.data.fine_base_cents, ea1_tier: $.data.escalation_tier }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /network/enforcement-actions/${ea1}/transition"
              payload: { to_state: "PAID" }
              as: PlatformAdmin
              captures: { ea1_total: $.data.fine_total_cents }
            - call: "POST /network/enforcement-actions"
              payload: { participant_id: "${p1}", violation_code: "LATE_ATTESTATION" }
              as: PlatformAdmin
              captures: { ea2: $.data.id, ea2_base: $.data.fine_base_cents, ea2_tier: $.data.escalation_tier }
          assert:
            - "EnforcementAction.${ea1}.escalation_tier == 0 and fine_base_cents == 2500000 (BASE_BY_TIER[0] 5000000 x RDFI multiplier 0.5)"
            - "EnforcementAction.${ea1}.fine_total_cents == 4000000 (2500000 + max(0, 45-30) x 100000, under the 100000000 cap)"
            - "EnforcementAction.${ea2}.escalation_tier == 1 (one prior PAID action) and fine_base_cents == 5000000 (BASE_BY_TIER[1] 10000000 x 0.5)"
            - "EnforcementAction.${ea2}.fine_total_cents is null before payment"

      - name: settlement_fee_round_per_entry_then_sum
        grounds:
          - calculations.network_settlement_fee
          - endpoints.POST_/network/settlement-windows/{id}/run-settlement
          - entities.PaymentEntry.fields.entry_fee_cents
          - entities.Participant.fields.current_period_fees_cents
        distinguishing_aspect: "Mode (b) combinatorial (distinct mode from the fine's mode (a)): the pinned order rounds each entry's fee to integer cents BEFORE summing — two 15000000-cent entries each yield round_half_up(7.5) = 8, total 16, where the rejected sum-then-round reading would yield 15."
        test_recipe:
          setup:
            - "P1 (ODFI, ACTIVE); originator O1 APPROVED, limit 1000000000; PPD code; W1 cutoff 17:00."
            - "Two standard entries of 15000000 cents each, originated 2026-09-01 09:00 and settled by the 18:00 W1 run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "First Originating Bank", participant_type: "ODFI", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/transaction-codes"
              payload: { code: "PPD", entry_class: "DEBIT", authorization_requirement: "NONE", return_timeframe_banking_days: 30, account_validation_required: false, warranty_obligations: "ODFI warrants authorization" }
              as: PlatformAdmin
              captures: { tc_ppd: $.data.id }
            - call: "POST /network/settlement-windows"
              payload: { window_code: "W1", cutoff_time_utc: "17:00", per_entry_limit_cents: 100000000, odfi_window_cap_cents: 2500000000 }
              as: PlatformAdmin
              captures: { w1: $.data.id }
            - call: "POST /network/originators"
              payload: { legal_name: "Alpha Payroll Corp", risk_tier: "STANDARD", exposure_limit_cents: 1000000000 }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { o1: $.data.id }
            - call: "POST /network/originators/${o1}/transition"
              payload: { to_state: "APPROVED" }
              as: ParticipantOfficer
              as_user_id: "${p1}"
            - call: "POST /network/payment-entries"
              payload: { originator_id: "${o1}", transaction_code_id: "${tc_ppd}", amount_cents: 15000000, receiver_account_number_hash: "acct-f1", receiver_name: "R F1", authorization_type: "NONE", same_day: false }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { e1: $.data.id }
            - call: "POST /network/payment-entries"
              payload: { originator_id: "${o1}", transaction_code_id: "${tc_ppd}", amount_cents: 15000000, receiver_account_number_hash: "acct-f2", receiver_name: "R F2", authorization_type: "NONE", same_day: false }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { e2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T18:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /network/settlement-windows/${w1}/run-settlement"
              payload: {}
              as: PlatformAdmin
              captures: { settled_count: $.data.settled_count }
            - call: "GET /network/payment-entries/${e1}"
              payload: {}
              as: PlatformAdmin
              captures: { e1_fee: $.data.entry_fee_cents }
            - call: "GET /network/payment-entries/${e2}"
              payload: {}
              as: PlatformAdmin
              captures: { e2_fee: $.data.entry_fee_cents }
            - call: "GET /network/participants/${p1}"
              payload: {}
              as: PlatformAdmin
              captures: { p1_fees: $.data.current_period_fees_cents }
          assert:
            - "run-settlement settled_count == 2"
            - "PaymentEntry.${e1}.entry_fee_cents == 8 and PaymentEntry.${e2}.entry_fee_cents == 8 (round_half_up(15000000 * 5 / 10000000) = round_half_up(7.5) = 8 per entry)"
            - "Participant.${p1}.current_period_fees_cents == 16 (8 + 8; the sum-then-round reading 15 is rejected by the pinned order)"
            - "Participant.${p1}.current_period == \"2026-09\""

  - rule_id: non_linear_state_machine
    instances:
      - name: rule_proposal_rework_cycle_resets_tallies
        grounds:
          - state_machines.RuleProposal.BALLOTING_to_RETURNED_FOR_REWORK
          - state_machines.RuleProposal.RETURNED_FOR_REWORK_to_DRAFT
          - state_machines.Ballot.CAST_to_LOCKED
        distinguishing_aspect: "Cyclic machine on RuleProposal (DRAFT -> COMMENT_OPEN -> BALLOTING -> RETURNED_FOR_REWORK -> DRAFT -> COMMENT_OPEN): the rework loop locks cast ballots and, on return to DRAFT, zeroes yea/nay/abstain tallies and nulls outcome — a linear pipeline cannot express the second comment period."
        test_recipe:
          setup:
            - "WEB transaction code exists; P1 ACTIVE voter; proposal RP with effective_date 2027-01-01 filed 2026-09-01; one YEA ballot cast while BALLOTING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "First Originating Bank", participant_type: "BOTH", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/transaction-codes"
              payload: { code: "WEB", entry_class: "DEBIT", authorization_requirement: "ORAL_RECORDED", return_timeframe_banking_days: 30, account_validation_required: true, warranty_obligations: "ODFI warrants WEB account validation" }
              as: PlatformAdmin
              captures: { tc_web: $.data.id }
            - call: "POST /network/rule-proposals"
              payload: { transaction_code_id: "${tc_web}", title: "WEB validation refresh", summary: "Shorten validation TTL", effective_date: "2027-01-01" }
              as: PlatformAdmin
              captures: { rp: $.data.id }
            - call: "POST /network/rule-proposals/${rp}/transition"
              payload: { to_state: "COMMENT_OPEN" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/rule-proposals/${rp}/transition"
              payload: { to_state: "BALLOTING" }
              as: PlatformAdmin
              captures: { early_err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/rule-proposals/${rp}/transition"
              payload: { to_state: "BALLOTING" }
              as: PlatformAdmin
            - call: "POST /network/rule-proposals/${rp}/ballots"
              payload: { vote: "YEA" }
              as: VotingDelegate
              as_user_id: "${p1}"
              captures: { b1: $.data.id }
            - call: "POST /network/rule-proposals/${rp}/transition"
              payload: { to_state: "RETURNED_FOR_REWORK" }
              as: PlatformAdmin
          trigger:
            - call: "POST /network/rule-proposals/${rp}/transition"
              payload: { to_state: "DRAFT" }
              as: PlatformAdmin
              captures: { rp_status: $.data.status, rp_yea: $.data.yea_count, rp_outcome: $.data.outcome }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/rule-proposals/${rp}/transition"
              payload: { to_state: "COMMENT_OPEN" }
              as: PlatformAdmin
              captures: { rp_status2: $.data.status }
            - call: "GET /network/ballots/${b1}"
              payload: {}
              as: PlatformAdmin
              captures: { b1_status: $.data.status }
          assert:
            - "the early BALLOTING transition (14 days into the 30-day comment period) failed with ERR_COMMENT_PERIOD_TOO_SHORT"
            - "after RETURNED_FOR_REWORK -> DRAFT: RuleProposal.${rp}.yea_count == 0, nay_count == 0, abstain_count == 0, outcome is null"
            - "the cycle closes: second COMMENT_OPEN succeeds and RuleProposal.${rp}.status == COMMENT_OPEN"
            - "Ballot.${b1}.status == LOCKED (locked by the rework transition, never reactivated)"

      - name: originator_suspend_reinstate_cycle_toggles_admission
        grounds:
          - state_machines.Originator.APPROVED_to_SUSPENDED
          - state_machines.Originator.SUSPENDED_to_APPROVED
          - validations[priority=8]
        distinguishing_aspect: "Cyclic machine on Originator (distinct entity from the RuleProposal cycle): APPROVED -> SUSPENDED -> APPROVED, with entry admission closing and reopening across the loop — the same payload fails mid-cycle and succeeds after it."
        test_recipe:
          setup:
            - "P1 (ODFI, ACTIVE); O1 APPROVED, exposure_limit_cents 1000000000; PPD code; W1 window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "First Originating Bank", participant_type: "ODFI", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/transaction-codes"
              payload: { code: "PPD", entry_class: "DEBIT", authorization_requirement: "NONE", return_timeframe_banking_days: 30, account_validation_required: false, warranty_obligations: "ODFI warrants authorization" }
              as: PlatformAdmin
              captures: { tc_ppd: $.data.id }
            - call: "POST /network/settlement-windows"
