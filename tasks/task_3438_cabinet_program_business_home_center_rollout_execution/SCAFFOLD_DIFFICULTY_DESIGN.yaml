              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 10000, base_lead_weeks: 2, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
              captures: { line1: $.data.id }
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - call: "GET /cabinet/programs/${prog}"
              as: ProgramManager
              captures: { prog_v2: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L2", effective_start_week: "2026-W38", families: [{ family_code: "F1", standard_price_cents: 11000, base_lead_weeks: 2, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v2}", old_line_disposition_qty: 100 }
              as: ProgramManager
            - call: "GET /cabinet/display-resets?program_id=${prog}"
              as: ProgramManager
              captures: { reset: "$.data[0].id" }
            - { call: "POST /cabinet/display-resets/${reset}/transition", payload: { to_status: SCHEDULED, scheduled_date: "2026-09-10T09:00:00Z" }, as: FieldServiceRep }
            - { call: "POST /cabinet/display-resets/${reset}/transition", payload: { to_status: COMPLETE }, as: FieldServiceRep }
          trigger:
            - { call: "POST /cabinet/lines/${line1}/disposition-actions", payload: { action_type: RTV, qty: 40 }, as: ProgramManager }
            - { call: "POST /cabinet/lines/${line1}/disposition-actions", payload: { action_type: LIQUIDATE, qty: 25 }, as: ProgramManager }
            - call: "POST /cabinet/lines/${line1}/disposition-actions"
              payload: { action_type: TRANSFER, qty: 36 }
              as: ProgramManager
              captures: { err: $.data.error_id }
            - { call: "POST /cabinet/lines/${line1}/disposition-actions", payload: { action_type: TRANSFER, qty: 20 }, as: ProgramManager }
            - { call: "POST /cabinet/lines/${line1}/disposition-actions", payload: { action_type: DESTROY, qty: 15 }, as: ProgramManager }
          assert:
            - "After RTV 40: remaining_disposition_qty == 60 (40 + 60 == 100)"
            - "After LIQUIDATE 25: remaining_disposition_qty == 35 (65 + 35 == 100)"
            - "err == ERR_DISPOSITION_OVERAGE for TRANSFER 36 (> 35); remaining stays 35"
            - "After TRANSFER 20: remaining == 15 (85 + 15 == 100)"
            - "After DESTROY 15: remaining == 0 (100 + 0 == 100)"
            - "GET /cabinet/lines/${line1}: status == RETIRED (auto: remaining 0 AND reset COMPLETE)"
            - "GET /cabinet/programs/${prog}: status == ACTIVE (auto: last SUNSETTING line retired)"

      - name: slot_commit_then_cancel_restores_capacity_units
        grounds:
          - state_machines.Order.SCHEDULED_to_CANCELLED
          - calculations.capacity_slot_selection
          - state_machines.ProductionSlot
        distinguishing_aspect: |
          Conserved quantity: production capacity units. The schedule/cancel
          compensation pair on o1 returns committed_units to exactly the value
          that o2 alone commits (30 -> 10), reopening the auto-LOCKED slot.
          Distinct quantity from the physical-units disposition invariant.
        test_recipe:
          setup:
            - "Dealer account VOLUME, huge credit, program ACTIVE with F1 price 1000 / lead 3 / complexity 1; slot PLANT_EAST x F1 x 2026-W37 capacity 30"
            - "o1 qty 20 and o2 qty 10, both ACKNOWLEDGED and SCHEDULED (committed 30, slot LOCKED)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer D16", channel: DEALER, pricing_class: VOLUME, lead_time_class: STANDARD, credit_limit_cents: 100000000, store_codes: [] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.0 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 1000, base_lead_weeks: 3, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /cabinet/production-slots", payload: { plant_code: PLANT_EAST, family_code: "F1", week: "2026-W37", capacity_units: 30 }, as: PlantScheduler }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "1 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 20 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o1: $.data.id }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "2 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 10 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o2: $.data.id }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: ACKNOWLEDGED }, as: ProgramManager }
            - { call: "POST /cabinet/orders/${o2}/transition", payload: { to_status: ACKNOWLEDGED }, as: ProgramManager }
            - { call: "POST /cabinet/orders/${o1}/transition", payload: { to_status: SCHEDULED }, as: PlantScheduler }
            - { call: "POST /cabinet/orders/${o2}/transition", payload: { to_status: SCHEDULED }, as: PlantScheduler }
          trigger:
            - { call: "POST /cabinet/orders/${o1}/cancel", payload: {}, as: ProgramManager }
          assert:
            - "Before cancel: GET /cabinet/production-slots?family_code=F1&week=2026-W37 -> data[0].committed_units == 30 AND status == LOCKED"
            - "GET /cabinet/orders/${o1}: status == CANCELLED"
            - "After cancel: data[0].committed_units == 10 (exactly o2's units remain; the 20 committed by o1 were released) AND status == OPEN (auto-unlock)"
            - "GET /cabinet/orders/${o2}: status == SCHEDULED (unaffected)"
