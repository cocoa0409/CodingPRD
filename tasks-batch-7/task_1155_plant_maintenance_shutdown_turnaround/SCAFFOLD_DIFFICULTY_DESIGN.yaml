            - { call: "POST /workers/${wk1_id}/badge", payload: {}, as: PermitCoordinator }
            - { call: "POST /workers/${wk2_id}/vet", payload: {}, as: PermitCoordinator }
            - { call: "POST /workers/${wk2_id}/badge", payload: {}, as: PermitCoordinator }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/shifts", payload: { shift_date: "2026-06-13", shift_type: "DAY", starts_at: "2026-06-13T08:00:00Z", ends_at: "2026-06-13T16:00:00Z", planned_headcount: 5 }, as: Planner, captures: { sa_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/shifts", payload: { shift_date: "2026-06-14", shift_type: "DAY", starts_at: "2026-06-14T02:00:00Z", ends_at: "2026-06-14T10:00:00Z", planned_headcount: 5 }, as: Planner, captures: { sb_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/shifts", payload: { shift_date: "2026-06-14", shift_type: "DAY", starts_at: "2026-06-14T01:00:00Z", ends_at: "2026-06-14T09:00:00Z", planned_headcount: 5 }, as: Planner, captures: { sc_id: "$.data.id" } }
            - { call: "POST /shifts/${sa_id}/assignments", payload: { worker_id: "${wk1_id}", planned_hours: 8 }, as: Planner }
            - { call: "POST /shifts/${sa_id}/assignments", payload: { worker_id: "${wk2_id}", planned_hours: 8 }, as: Planner }
          trigger:
