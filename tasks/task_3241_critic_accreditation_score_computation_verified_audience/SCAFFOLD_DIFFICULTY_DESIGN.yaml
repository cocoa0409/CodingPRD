# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3241_critic_accreditation_score_computation_verified_audience
# 9 rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: tomatometer_provisional_includes_revoked_critic_certified_excludes
        grounds:
          - calculations.tomatometer_score
          - state_machines.Critic.UNDER_REVIEW_to_REVOKED
          - entities.ScoreSnapshot.fields.variant
        distinguishing_aspect: |
          Dual-variant logic on the Release domain: after the review's critic is
          REVOKED, the PROVISIONAL tomatometer still counts both reviews
          (total_count 2) while the CERTIFIED variant excludes the revoked
          critic's review (total_count 1) — same release data, two valid
          algorithms, different input sets and snapshot counts.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Publication P1 ACCREDITED; critics CA (is_top_critic=false) and CB (is_top_critic=false) ACCREDITED under P1."
            - "Title T1 OPEN; Release R1 (cut THEATRICAL) OPEN with embargo_until 2026-09-01T00:00:00Z."
            - "CA publishes a FRESH review on R1; CB publishes a FRESH review on R1."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_pub
              call: "POST /publications"
              payload: { outlet_name: "Metro Film Journal", reach_tier: "NATIONAL" }
              as: PlatformAdmin
              captures: { pub1: $.data.id }
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - &k_ca
              call: "POST /critics"
              payload: { full_name: "Critic A", publication_id: "${pub1}", is_top_critic: false }
              as: PlatformAdmin
              captures: { ca: $.data.id }
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - &k_cb
              call: "POST /critics"
              payload: { full_name: "Critic B", publication_id: "${pub1}", is_top_critic: false }
              as: PlatformAdmin
              captures: { cb: $.data.id }
            - call: "POST /critics/${cb}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - &k_title
              call: "POST /titles"
              payload: { canonical_name: "Glass Harbor", release_year: 2026 }
              as: PlatformAdmin
              captures: { t1: $.data.id }
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - &k_rel
              call: "POST /titles/${t1}/releases"
              payload: { cut_label: "THEATRICAL", theatrical_window_start: "2026-09-01T00:00:00Z", theatrical_window_end: "2026-10-01T00:00:00Z", embargo_until: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - &k_ra
              call: "POST /releases/${r1}/reviews"
              payload: { critic_id: "${ca}", body_text: "A triumph.", self_designation: "FRESH" }
              as: Critic
              as_user_id: "${ca}"
              captures: { ra: $.data.id }
            - call: "POST /reviews/${ra}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${ca}"
            - &k_rb
              call: "POST /releases/${r1}/reviews"
              payload: { critic_id: "${cb}", body_text: "Superb.", self_designation: "FRESH" }
              as: Critic
              as_user_id: "${cb}"
              captures: { rb: $.data.id }
            - call: "POST /reviews/${rb}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${cb}"
            - &k_ar
              call: "POST /accreditation-reviews"
              payload: { subject_critic_id: "${cb}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: AccreditationBoard
              captures: { ar: $.data.id }
            - call: "POST /accreditation-reviews/${ar}/transition"
              payload: { action: "BEGIN_REVIEW" }
              as: AccreditationBoard
          trigger:
            - call: "POST /accreditation-reviews/${ar}/transition"
              payload: { action: "RULE_REVOKE" }
              as: AccreditationBoard
            - call: "GET /releases/${r1}/score-snapshots"
              as: AccreditationBoard
          assert:
            - "a non-superseded ScoreSnapshot with scope=TOMATOMETER variant=PROVISIONAL has positive_count == 2, total_count == 2, pct == 100"
            - "a non-superseded ScoreSnapshot with scope=TOMATOMETER variant=CERTIFIED has positive_count == 1, total_count == 1, pct == 100"
            - "the CERTIFIED snapshot total_count (1) differs from the PROVISIONAL total_count (2) for identical review data"
      - name: critic_standing_provisional_pending_penalty_vs_final_upheld_penalty
        grounds:
          - calculations.critic_standing_score
          - state_machines.AccreditationReview.IN_REVIEW_to_UPHELD
          - entities.Critic.fields.standing_score_bps
        distinguishing_aspect: |
          Dual-variant logic on the Critic domain: with two FLAGGED-but-not-yet-
          ruled disputes, the provisional standing score penalises each at
          PENDING_PENALTY_BPS (10000 - 2*500 = 9000 bps), while the final variant
          at ruling time penalises only UPHELD disputes at DISPUTE_PENALTY_BPS —
          different score for the same underlying dispute set.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Publication P1 ACCREDITED; critic CA ACCREDITED; critic CC ACCREDITED (a second accredited critic acts as dispute filer)."
            - "Title T1 OPEN; Release R1 OPEN with embargo already lifted; CA has a PUBLISHED FRESH review RA on R1."
            - "CC files two CLASSIFICATION disputes D1, D2 on RA? — no: at most one dispute flags RA; use two releases R1 and R2, CA publishes on both, CC files a CLASSIFICATION dispute on each, leaving both reviews FLAGGED and both disputes TRIAGED (unruled)."
          setup_api_calls:
            - *k_clock
            - *k_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - &k_cc
              call: "POST /critics"
              payload: { full_name: "Critic C", publication_id: "${pub1}", is_top_critic: false }
              as: PlatformAdmin
              captures: { cc: $.data.id }
            - call: "POST /critics/${cc}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *k_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - *k_ra
            - call: "POST /reviews/${ra}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${ca}"
            - &k_rel2
              call: "POST /titles/${t1}/releases"
              payload: { cut_label: "DIRECTORS_CUT", theatrical_window_start: "2026-09-01T00:00:00Z", theatrical_window_end: "2026-10-01T00:00:00Z", embargo_until: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { r2: $.data.id }
            - call: "POST /releases/${r2}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - &k_ra2
              call: "POST /releases/${r2}/reviews"
              payload: { critic_id: "${ca}", body_text: "Even better.", self_designation: "FRESH" }
              as: Critic
              as_user_id: "${ca}"
              captures: { ra2: $.data.id }
            - call: "POST /reviews/${ra2}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${ca}"
            - &k_d1
              call: "POST /disputes"
              payload: { dispute_kind: "CLASSIFICATION", subject_review_id: "${ra}", filed_by_critic_id: "${cc}", requested_classification: "ROTTEN" }
              as: Critic
              as_user_id: "${cc}"
              captures: { d1: $.data.id }
            - &k_d2
              call: "POST /disputes"
              payload: { dispute_kind: "CLASSIFICATION", subject_review_id: "${ra2}", filed_by_critic_id: "${cc}", requested_classification: "ROTTEN" }
              as: Critic
              as_user_id: "${cc}"
              captures: { d2: $.data.id }
            - call: "POST /disputes/${d1}/transition"
              payload: { action: "TRIAGE" }
              as: AccreditationBoard
            - call: "POST /disputes/${d2}/transition"
              payload: { action: "TRIAGE" }
              as: AccreditationBoard
            - &k_arc
              call: "POST /accreditation-reviews"
              payload: { subject_critic_id: "${ca}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: AccreditationBoard
              captures: { arc: $.data.id }
            - call: "POST /accreditation-reviews/${arc}/transition"
              payload: { action: "BEGIN_REVIEW" }
              as: AccreditationBoard
          trigger:
            - call: "GET /disputes/${d1}"
              as: AccreditationBoard
              captures: { d1_v: $.data.version }
            - call: "POST /disputes/${d1}/transition"
              payload: { action: "RULE_REJECT", expected_dispute_version: "${d1_v}" }
              as: AccreditationBoard
            - call: "GET /disputes/${d2}"
              as: AccreditationBoard
              captures: { d2_v: $.data.version }
            - call: "POST /disputes/${d2}/transition"
              payload: { action: "RULE_REJECT", expected_dispute_version: "${d2_v}" }
              as: AccreditationBoard
            - call: "POST /accreditation-reviews/${arc}/transition"
              payload: { action: "RULE_UPHOLD" }
              as: AccreditationBoard
            - call: "GET /critics/${ca}"
              as: AccreditationBoard
          assert:
            - "the provisional standing over the trailing 365d with two pending disputes would be 10000 - 2*500 == 9000 bps"
            - "the FINAL variant (both disputes REJECTED, zero UPHELD) sets Critic.${ca}.standing_score_bps == 10000 - 0*1500 == 10000"
            - "the two variants therefore differ (9000 vs 10000) for the same dispute set"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: bombing_index_capped_weighted_sum_three_inputs
        grounds:
          - calculations.bombing_detection_index
          - entities.BombingIncident.fields.detection_index_bps
        distinguishing_aspect: |
          Mode (a): three inputs (velocity V, new-account share N/V, negative
          skew S/V) combined through a capped weighted sum with nested min() and
          max(). With V=10 ratings in the window, N=10 new accounts, S=10
          negative: min(10000, 20*10 + 40*100 + 30*100) = min(10000, 7200) =
          7200 bps, which crosses BOMBING_THRESHOLD_BPS (6000).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; title, release R1 OPEN with theatrical window covering the clock."
            - "Ten fresh audience members M1..M10 created at the current clock (inside the detection window), each submits a 1-star rating on R1."
          setup_api_calls:
            - *k_clock
            - *k_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *k_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - &k_m1
