            - call: "POST /water-service/shared-well-agreements"
              payload: { well_profile_id: "${well_id}", account_id: "${acct_3}", split_pct: 20.00 }
              as: BillingClerk
              captures: { swa_3: $.data.id }
            - call: "POST /water-service/shared-well-agreements"
              payload: { well_profile_id: "${well_id}", account_id: "${acct_4}", split_pct: 20.00 }
