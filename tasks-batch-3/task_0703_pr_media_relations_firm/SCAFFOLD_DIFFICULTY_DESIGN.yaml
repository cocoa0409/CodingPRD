  - rule_id: compensating_invariant
    instances:
      - name: coverage_verify_retract_conserves_earned_media_value
        grounds:
          - state_machines.Coverage.DRAFT_to_VERIFIED
          - state_machines.Coverage.VERIFIED_to_RETRACTED
          - entities.Campaign.fields.earned_media_value_cents
          - entities.Client.fields.lifetime_earned_media_cents
        distinguishing_aspect: |
          Coverage verify credits Campaign.earned_media_value_cents += media_value_cents and the
          compensating retract debits the exact same amount, so the conserved quantity
          earned_media_value_cents = sum(media_value_cents of VERIFIED Coverage) returns to its
          pre-verify value 0 with zero drift — conserved monetary ledger quantity.
        test_recipe:
          setup:
            - "An ENTERPRISE Client; ACTIVE Campaign (earned_media_value_cents starts 0); NATIONAL Outlet MUV=2000000/DA=80; ACTIVE Journalist on ACTIVE MediaList; one DRAFT Coverage POSITIVE/FEATURE then VERIFIED (media_value_cents=4050000)."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Rho", industry: "TECH", monthly_retainer_cents: 500000, monthly_hours_cap: 40, overage_rate_cents: 15000, account_tier: "ENTERPRISE" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/campaigns"
              payload: { client_id: "${client_id}", title: "Cons", objective: "LAUNCH", budget_cents: 5000000, target_beat: "TECH" }
              as: AccountManager
              captures: { campaign_id: $.data.id, campaign_v: $.data.version }
            - call: "POST /agency/campaigns/${campaign_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /agency/outlets"
              payload: { name: "Cons Nat", tier: "NATIONAL", monthly_unique_visitors: 2000000, domain_authority: 80 }
              as: PlatformAdmin
              captures: { outlet_id: $.data.id }
            - call: "POST /agency/journalists"
              payload: { outlet_id: "${outlet_id}", full_name: "Cons Jo", email: "consjo@cn.com", beat: "TECH" }
              as: MediaSpecialist
              captures: { journalist_id: $.data.id }
            - call: "POST /agency/media-lists"
              payload: { campaign_id: "${campaign_id}", name: "Cons List", journalist_ids: ["${journalist_id}"], expected_campaign_version: "${campaign_v}" }
              as: MediaSpecialist
              captures: { media_list_id: $.data.id }
            - call: "POST /agency/coverage"
              payload: { campaign_id: "${campaign_id}", journalist_id: "${journalist_id}", headline: "Cons Clip", published_at: "2026-03-02T00:00:00Z", sentiment: "POSITIVE", prominence: "FEATURE" }
              as: MediaSpecialist
              captures: { coverage_id: $.data.id }
            - call: "POST /agency/coverage/${coverage_id}/verify"
              payload: {}
              as: MediaSpecialist
          trigger:
            - call: "POST /agency/coverage/${coverage_id}/retract"
              payload: {}
              as: MediaSpecialist
          assert:
            - "Coverage.${coverage_id}.status == RETRACTED"
            - "Coverage.${coverage_id}.media_value_cents == 0"
            - "Campaign.${campaign_id}.earned_media_value_cents == 0"
            - "Client.${client_id}.lifetime_earned_media_cents == 0"

      - name: time_entry_log_void_conserves_hours_consumed
        grounds:
          - state_machines.TimeEntry
          - entities.RetainerPeriod.fields.hours_consumed
          - entities.Campaign.fields.cost_basis_cents
        distinguishing_aspect: |
          Logging a TimeEntry adds billable_hours to RetainerPeriod.hours_consumed and the
          compensating void subtracts the same billable_hours, so the conserved quantity
          hours_consumed = sum(billable_hours of SUBMITTED+APPROVED entries) returns to 0 with no
          drift — a conserved labor-hours quantity, distinct from the monetary ledger invariant.
        test_recipe:
          setup:
            - "A Client (monthly_hours_cap=40, overage_rate_cents=15000); an OPEN RetainerPeriod (hours_consumed starts 0); one SUBMITTED TimeEntry of 5.0h (hours_consumed becomes 5.0)."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Sig", industry: "TECH", monthly_retainer_cents: 500000, monthly_hours_cap: 40, overage_rate_cents: 15000 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/retainer-periods"
              payload: { client_id: "${client_id}", period_month: "2026-05" }
              as: AccountManager
              captures: { period_id: $.data.id }
            - call: "POST /agency/time-entries"
              payload: { retainer_period_id: "${period_id}", staff_id: "staff-9", work_type: "MONITORING", billable_hours: 5.0 }
              as: AccountManager
              captures: { te_id: $.data.id }
          trigger:
            - call: "POST /agency/time-entries/${te_id}/void"
              payload: {}
              as: AccountManager
          assert:
            - "TimeEntry.${te_id}.status == VOID"
            - "RetainerPeriod.${period_id}.hours_consumed == 0"
            - "RetainerPeriod.${period_id}.provisional_total_cents == 0"
