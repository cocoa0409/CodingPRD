      - name: missing_x_user_id_header_returns_unauthenticated
        claim_type: role_exclusive_operations
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - roles.Artist.identity
        distinguishing_aspect: "Authentication is checked before role permission and before ownership: an entity_backed call with no X-User-ID and a call carrying a role name outside the declared six both return 401, never 403 and never 404."
        test_recipe:
          setup: ["One exhibition OPEN_FOR_ENTRIES and one artist, so the only defect in each triggered call is the header."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
            - { call: "POST /exhibitions", payload: { title: "Regional Juried Biennial", season_year: 2026, call_opens_at: "2026-09-01T00:00:00Z", call_closes_at: "2026-10-01T00:00:00Z", notification_at: "2026-10-20T00:00:00Z", delivery_window_start_at: "2026-11-02T00:00:00Z", delivery_window_end_at: "2026-11-06T23:59:59Z", opening_at: "2026-11-12T18:00:00Z", closing_at: "2026-12-13T00:00:00Z", entry_fee_base_cents: 4500, entry_fee_additional_cents: 1500, max_dimension_cm: 200, max_weight_kg: 40, per_work_insurance_cap_cents: 5000000, allowed_media_categories: ["PAINTING", "PHOTOGRAPHY", "SCULPTURE"], eligible_state_codes: ["CA", "OR"], acceptance_capacity: 3, waitlist_capacity: 1, jury_quorum: 1, advance_score_threshold: 7.0, score_weight_technique: 0.4, score_weight_originality: 0.35, score_weight_relevance: 0.25, commission_pct: 0.35, sales_tax_pct: 0.0875, award_budget_cents: 500000, claim_deadline_days: 30, works_included_in_base: 2, member_discount_pct: 0.175, max_works_per_entry: 5, max_entries_per_artist: 1 }, as: CallManager, captures: { ex_id: $.data.id } }
            - { call: "POST /exhibitions/${ex_id}/phase-advance", payload: { target_status: "OPEN_FOR_ENTRIES" }, as: CallManager }
            - { call: "POST /artists", payload: { legal_name: "Ana Ruiz", email: "ana.ruiz@example.org", residency_state_code: "CA" }, as: CallManager, captures: { a1_id: $.data.id } }
          trigger:
            - { call: "POST /entries", payload: { exhibition_id: "${ex_id}", artist_id: "${a1_id}" }, as: Artist, omit_headers: ["X-User-ID"], captures: { e_noid: $.data.error_id } }
            - { call: "GET /exhibitions/${ex_id}", payload: {}, as: Curator, captures: { e_badrole: $.data.error_id } }
          assert:
            - "the header-less POST /entries returns 401 ERR_UNAUTHENTICATED and creates no Entry row"
            - "the request carrying X-User-Role: Curator returns 401 ERR_UNAUTHENTICATED, not 403 — an undeclared role fails authentication"
            - "GET /entries as CallManager returns total_count == 0"

      - name: artist_cannot_patch_or_read_another_artists_records
        claim_type: role_exclusive_operations
        grounds:
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles.Artist.shared_operations
        distinguishing_aspect: "Artist is entity_backed, so the same endpoint and role are permitted or refused purely on identity: a2 holds a valid Artist identity yet may not patch a1's record or read a1's entry, and the code is ERR_NOT_RESOURCE_OWNER rather than a 404 that would leak existence."
        test_recipe:
          setup: ["Two artists a1 and a2; a1 owns an entry in an OPEN_FOR_ENTRIES exhibition."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
            - { call: "POST /exhibitions", payload: { title: "Regional Juried Biennial", season_year: 2026, call_opens_at: "2026-09-01T00:00:00Z", call_closes_at: "2026-10-01T00:00:00Z", notification_at: "2026-10-20T00:00:00Z", delivery_window_start_at: "2026-11-02T00:00:00Z", delivery_window_end_at: "2026-11-06T23:59:59Z", opening_at: "2026-11-12T18:00:00Z", closing_at: "2026-12-13T00:00:00Z", entry_fee_base_cents: 4500, entry_fee_additional_cents: 1500, max_dimension_cm: 200, max_weight_kg: 40, per_work_insurance_cap_cents: 5000000, allowed_media_categories: ["PAINTING", "PHOTOGRAPHY", "SCULPTURE"], eligible_state_codes: ["CA", "OR"], acceptance_capacity: 3, waitlist_capacity: 1, jury_quorum: 1, advance_score_threshold: 7.0, score_weight_technique: 0.4, score_weight_originality: 0.35, score_weight_relevance: 0.25, commission_pct: 0.35, sales_tax_pct: 0.0875, award_budget_cents: 500000, claim_deadline_days: 30, works_included_in_base: 2, member_discount_pct: 0.175, max_works_per_entry: 5, max_entries_per_artist: 1 }, as: CallManager, captures: { ex_id: $.data.id } }
            - { call: "POST /exhibitions/${ex_id}/phase-advance", payload: { target_status: "OPEN_FOR_ENTRIES" }, as: CallManager }
            - { call: "POST /artists", payload: { legal_name: "Ana Ruiz", email: "ana.ruiz@example.org", residency_state_code: "CA" }, as: CallManager, captures: { a1_id: $.data.id } }
            - { call: "POST /artists", payload: { legal_name: "Bea Lund", email: "bea@example.org", residency_state_code: "OR" }, as: CallManager, captures: { a2_id: $.data.id } }
            - { call: "POST /entries", payload: { exhibition_id: "${ex_id}", artist_id: "${a1_id}" }, as: Artist, as_user_id: "${a1_id}", captures: { e1_id: $.data.id } }
          trigger:
            - { call: "PATCH /artists/${a1_id}", payload: { payout_method: "ACH" }, as: Artist, as_user_id: "${a2_id}", captures: { e_patch: $.data.error_id } }
            - { call: "GET /entries/${e1_id}", payload: {}, as: Artist, as_user_id: "${a2_id}", captures: { e_read: $.data.error_id } }
            - { call: "POST /entries/${e1_id}/withdraw", payload: {}, as: Artist, as_user_id: "${a2_id}", captures: { e_withdraw: $.data.error_id } }
          assert:
            - "all three calls return 403 ERR_NOT_RESOURCE_OWNER"
            - "Artist.${a1_id}.payout_method stays CHECK and version does not advance"
            - "Entry.${e1_id}.status stays DRAFT"
            - "the same PATCH performed as Artist with as_user_id ${a1_id} succeeds, and as CallManager also succeeds, so only foreign identity is refused"

