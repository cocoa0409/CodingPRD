# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Retail Pharmacy Prescription Fulfillment — Expert tier
# 9 rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: copay_provisional_vs_final_diverge_on_second_fill
        grounds:
          - calculations.provisional_copay_estimate
          - calculations.final_copay_adjudicated
          - entities.Fill.fields.provisional_copay_cents
          - entities.Fill.fields.final_copay_cents
        distinguishing_aspect: |
          On the Fill domain: the patient's SECOND fill produces
          provisional_copay_cents == 3620 (per-fill cap) but
          final_copay_cents == 380 (annual cumulative cap on Plan B,
          copay_max 4000 minus 3620 already spent), proving the forward-looking
          and chronological variants diverge on identical formula inputs.
        test_recipe:
          setup:
            - "Plan B: copay_pct 0.20, copay_min 500, copay_max 4000, dispensing_fee 100, threshold 0.80"
            - "Drug ALPHA non-controlled, unit_price 800; formulary allowed 600/unit on Plan B"
            - "Patient on Plan B; prescription qty 30 days_supply 30 refills 2; first fill DISPENSED with final_copay 3620"
            - "Clock advanced 30 days so the second fill clears refill-too-soon"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /insurance-plans"
              payload: { bin: "610001", pcn: "PB", name: "Plan B", copay_pct: 0.20, copay_min_cents: 500, copay_max_cents: 4000, dispensing_fee_cents: 100, refill_too_soon_threshold_pct: 0.80 }
              as: PharmacyAdmin
              captures: { plan_b: $.data.id }
            - call: "POST /drug-products"
              payload: { ndc: "00000-0001-01", name: "Alpha", unit_price_cents: 800 }
              as: PharmacyAdmin
              captures: { drug_alpha: $.data.id }
            - call: "POST /formulary-entries"
              payload: { plan_id: "${plan_b}", drug_id: "${drug_alpha}", tier: 2, allowed_amount_cents: 600 }
              as: PharmacyAdmin
            - call: "POST /patients"
              payload: { full_name: "Pat One", date_of_birth: "1980-01-01", plan_id: "${plan_b}" }
              as: Technician
              captures: { pat: $.data.id }
            - call: "POST /prescribers"
              payload: { full_name: "Dr A", npi: "1000000001" }
              as: PharmacyAdmin
              captures: { presc: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat}", prescriber_id: "${presc}", drug_id: "${drug_alpha}", quantity_per_fill: 30, days_supply: 30, refills_authorized: 2, written_utc: "2026-01-01T00:00:00.000Z" }
              as: Technician
              captures: { rx: $.data.id }
            # ---- first fill all the way to DISPENSED ----
            - call: "POST /fills"
              payload: { prescription_id: "${rx}" }
              as: Technician
              captures: { f1: $.data.id }
            - call: "POST /fills/${f1}/run-dur"
              payload: {}
              as: Technician
            - call: "GET /prescriptions/${rx}"
              payload: {}
              as: Technician
              captures: { rxv1: $.data.version }
            - call: "POST /fills/${f1}/submit-claim"
              payload: { expected_prescription_version: "${rxv1}" }
              as: Technician
            - call: "POST /fills/${f1}/stage-will-call"
              payload: {}
              as: Technician
            - call: "POST /payment-records"
              payload: { fill_id: "${f1}", amount_cents: 3620, tendered_by: "tech-1" }
              as: Cashier
            - call: "POST /fills/${f1}/dispense"
              payload: {}
              as: Pharmacist
            # ---- advance clock past refill-too-soon, create second fill ----
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-02-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /fills"
              payload: { prescription_id: "${rx}" }
              as: Technician
              captures: { f2: $.data.id }
            - call: "POST /fills/${f2}/run-dur"
              payload: {}
              as: Technician
            - call: "GET /prescriptions/${rx}"
              payload: {}
              as: Technician
              captures: { rxv2: $.data.version }
          trigger:
            - call: "POST /fills/${f2}/submit-claim"
              payload: { expected_prescription_version: "${rxv2}" }
              as: Technician
              captures: { prov: $.data.provisional_copay_cents, fin: $.data.final_copay_cents }
          assert:
            - "Fill.${f2}.provisional_copay_cents == 3620"
            - "Fill.${f2}.final_copay_cents == 380"
            - "Fill.${f2}.plan_paid_cents == 17720"

      - name: pdmp_risk_provisional_at_submit_vs_committed_at_dispense
        grounds:
          - calculations.pdmp_risk_score
          - entities.PdmpReport.fields.risk_score
          - entities.Patient.fields.pdmp_flag
        distinguishing_aspect: |
          On the Patient domain: with three already-DISPENSED CII fills (risk 30,
          REVIEW), the committed dispense-time PdmpReport.risk_score is 30 while
          the provisional submit-time score for a fourth in-flight controlled
          fill is 40 — diverging by exactly one FILL_WEIGHT, proving the two
          PDMP variants differ on a different entity domain than the copay pair.
        test_recipe:
          setup:
            - "Patient with 3 DISPENSED CII fills from a single prescriber within 90 days; pdmp_flag REVIEW, controlled_status ELIGIBLE"
            - "A fourth controlled fill is being adjudicated"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /insurance-plans"
              payload: { bin: "610002", pcn: "PC", name: "Plan C", copay_pct: 0.10, copay_max_cents: 10000 }
              as: PharmacyAdmin
              captures: { plan_c: $.data.id }
            - call: "POST /drug-products"
              payload: { ndc: "00000-0002-01", name: "Bravo CII", dea_schedule: "CII", unit_price_cents: 1000 }
              as: PharmacyAdmin
              captures: { drug_bravo: $.data.id }
            - call: "POST /formulary-entries"
              payload: { plan_id: "${plan_c}", drug_id: "${drug_bravo}", tier: 3, allowed_amount_cents: 900 }
              as: PharmacyAdmin
            - call: "POST /patients"
              payload: { full_name: "Pat Two", date_of_birth: "1975-05-05", plan_id: "${plan_c}" }
              as: Technician
              captures: { pat2: $.data.id }
            - call: "POST /prescribers"
              payload: { full_name: "Dr B", npi: "1000000002", dea_number: "BB1234567", dea_active: true }
              as: PharmacyAdmin
              captures: { presc2: $.data.id }
            # 3 separate controlled prescriptions, each dispensed once
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat2}", prescriber_id: "${presc2}", drug_id: "${drug_bravo}", quantity_per_fill: 10, days_supply: 30, written_utc: "2026-03-01T00:00:00.000Z" }
              as: Technician
              captures: { rx_a: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat2}", prescriber_id: "${presc2}", drug_id: "${drug_bravo}", quantity_per_fill: 10, days_supply: 30, written_utc: "2026-03-01T00:00:00.000Z" }
              as: Technician
              captures: { rx_b: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat2}", prescriber_id: "${presc2}", drug_id: "${drug_bravo}", quantity_per_fill: 10, days_supply: 30, written_utc: "2026-03-01T00:00:00.000Z" }
              as: Technician
              captures: { rx_c: $.data.id }
            # dispense fill on rx_a
            - call: "POST /fills"
              payload: { prescription_id: "${rx_a}" }
              as: Technician
              captures: { fa: $.data.id }
            - call: "POST /fills/${fa}/run-dur"
              payload: {}
              as: Technician
            - call: "GET /prescriptions/${rx_a}"
              payload: {}
              as: Technician
              captures: { rxa_v: $.data.version }
            - call: "POST /fills/${fa}/submit-claim"
              payload: { expected_prescription_version: "${rxa_v}" }
              as: Technician
            - call: "POST /fills/${fa}/stage-will-call"
              payload: {}
              as: Technician
            - call: "POST /payment-records"
              payload: { fill_id: "${fa}", amount_cents: 910, tendered_by: "tech-1" }
              as: Cashier
            - call: "POST /fills/${fa}/dispense"
              payload: {}
              as: Pharmacist
            # dispense fill on rx_b
            - call: "POST /fills"
              payload: { prescription_id: "${rx_b}" }
              as: Technician
              captures: { fb: $.data.id }
            - call: "POST /fills/${fb}/run-dur"
              payload: {}
              as: Technician
            - call: "GET /prescriptions/${rx_b}"
              payload: {}
              as: Technician
              captures: { rxb_v: $.data.version }
            - call: "POST /fills/${fb}/submit-claim"
              payload: { expected_prescription_version: "${rxb_v}" }
              as: Technician
            - call: "POST /fills/${fb}/stage-will-call"
              payload: {}
              as: Technician
            - call: "POST /payment-records"
              payload: { fill_id: "${fb}", amount_cents: 910, tendered_by: "tech-1" }
              as: Cashier
            - call: "POST /fills/${fb}/dispense"
              payload: {}
              as: Pharmacist
            # dispense fill on rx_c
            - call: "POST /fills"
              payload: { prescription_id: "${rx_c}" }
              as: Technician
              captures: { fc: $.data.id }
            - call: "POST /fills/${fc}/run-dur"
              payload: {}
              as: Technician
            - call: "GET /prescriptions/${rx_c}"
              payload: {}
              as: Technician
              captures: { rxc_v: $.data.version }
            - call: "POST /fills/${fc}/submit-claim"
              payload: { expected_prescription_version: "${rxc_v}" }
              as: Technician
            - call: "POST /fills/${fc}/stage-will-call"
              payload: {}
              as: Technician
            - call: "POST /payment-records"
              payload: { fill_id: "${fc}", amount_cents: 910, tendered_by: "tech-1" }
              as: Cashier
            - call: "POST /fills/${fc}/dispense"
              payload: {}
              as: Pharmacist
          trigger:
            - call: "POST /pdmp-reports"
              payload: { patient_id: "${pat2}" }
              as: Pharmacist
              captures: { score: $.data.risk_score, flag: $.data.resulting_flag }
          assert:
            - "PdmpReport.risk_score == 30"
            - "PdmpReport.resulting_flag == REVIEW"
            - "Patient.${pat2}.pdmp_flag == REVIEW"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pdmp_weighted_score_nested_max_and_band_selection
        grounds:
          - calculations.pdmp_risk_score
          - entities.PdmpReport.fields.risk_score
          - entities.PdmpReport.fields.distinct_prescriber_count
        distinguishing_aspect: |
          Mode (a): >=3 inputs (controlled_fill_count, distinct_prescriber_count,
          two weights) with a nested max(distinct-1,0) term and a tiered band
          selection. 3 DISPENSED CII fills across 3 distinct prescribers give
          3*10 + max(3-1,0)*15 == 60 -> BLOCKED, not the 30 a same-prescriber
          set would give.
        test_recipe:
          setup:
            - "Patient with 3 DISPENSED CII fills, each from a DIFFERENT prescriber, within 90 days"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /insurance-plans"
              payload: { bin: "610003", pcn: "PD", name: "Plan D", copay_pct: 0.10, copay_max_cents: 10000 }
              as: PharmacyAdmin
              captures: { plan_d: $.data.id }
            - call: "POST /drug-products"
              payload: { ndc: "00000-0003-01", name: "Charlie CII", dea_schedule: "CII", unit_price_cents: 1000 }
              as: PharmacyAdmin
              captures: { drug_charlie: $.data.id }
            - call: "POST /formulary-entries"
              payload: { plan_id: "${plan_d}", drug_id: "${drug_charlie}", tier: 3, allowed_amount_cents: 900 }
              as: PharmacyAdmin
            - call: "POST /patients"
              payload: { full_name: "Pat Three", date_of_birth: "1970-07-07", plan_id: "${plan_d}" }
              as: Technician
              captures: { pat3: $.data.id }
            - call: "POST /prescribers"
              payload: { full_name: "Dr C1", npi: "1000000011", dea_number: "BC1111111", dea_active: true }
              as: PharmacyAdmin
              captures: { pr1: $.data.id }
            - call: "POST /prescribers"
              payload: { full_name: "Dr C2", npi: "1000000012", dea_number: "BC2222222", dea_active: true }
              as: PharmacyAdmin
              captures: { pr2: $.data.id }
            - call: "POST /prescribers"
              payload: { full_name: "Dr C3", npi: "1000000013", dea_number: "BC3333333", dea_active: true }
              as: PharmacyAdmin
              captures: { pr3: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat3}", prescriber_id: "${pr1}", drug_id: "${drug_charlie}", quantity_per_fill: 10, days_supply: 30, written_utc: "2026-03-01T00:00:00.000Z" }
              as: Technician
              captures: { rxc1: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat3}", prescriber_id: "${pr2}", drug_id: "${drug_charlie}", quantity_per_fill: 10, days_supply: 30, written_utc: "2026-03-01T00:00:00.000Z" }
              as: Technician
              captures: { rxc2: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat3}", prescriber_id: "${pr3}", drug_id: "${drug_charlie}", quantity_per_fill: 10, days_supply: 30, written_utc: "2026-03-01T00:00:00.000Z" }
              as: Technician
              captures: { rxc3: $.data.id }
            - call: "POST /fills"
              payload: { prescription_id: "${rxc1}" }
              as: Technician
              captures: { fc1: $.data.id }
            - call: "POST /fills/${fc1}/run-dur"
              payload: {}
              as: Technician
            - call: "GET /prescriptions/${rxc1}"
              payload: {}
              as: Technician
              captures: { vc1: $.data.version }
            - call: "POST /fills/${fc1}/submit-claim"
              payload: { expected_prescription_version: "${vc1}" }
              as: Technician
            - call: "POST /fills/${fc1}/stage-will-call"
              payload: {}
              as: Technician
            - call: "POST /payment-records"
              payload: { fill_id: "${fc1}", amount_cents: 910, tendered_by: "tech-1" }
              as: Cashier
            - call: "POST /fills/${fc1}/dispense"
              payload: {}
              as: Pharmacist
            - call: "POST /fills"
              payload: { prescription_id: "${rxc2}" }
              as: Technician
              captures: { fc2: $.data.id }
            - call: "POST /fills/${fc2}/run-dur"
              payload: {}
              as: Technician
            - call: "GET /prescriptions/${rxc2}"
              payload: {}
              as: Technician
              captures: { vc2: $.data.version }
            - call: "POST /fills/${fc2}/submit-claim"
              payload: { expected_prescription_version: "${vc2}" }
              as: Technician
            - call: "POST /fills/${fc2}/stage-will-call"
              payload: {}
              as: Technician
            - call: "POST /payment-records"
              payload: { fill_id: "${fc2}", amount_cents: 910, tendered_by: "tech-1" }
              as: Cashier
            - call: "POST /fills/${fc2}/dispense"
              payload: {}
              as: Pharmacist
            - call: "POST /fills"
              payload: { prescription_id: "${rxc3}" }
              as: Technician
              captures: { fc3: $.data.id }
            - call: "POST /fills/${fc3}/run-dur"
              payload: {}
              as: Technician
            - call: "GET /prescriptions/${rxc3}"
              payload: {}
              as: Technician
              captures: { vc3: $.data.version }
            - call: "POST /fills/${fc3}/submit-claim"
              payload: { expected_prescription_version: "${vc3}" }
              as: Technician
            - call: "POST /fills/${fc3}/stage-will-call"
              payload: {}
              as: Technician
            - call: "POST /payment-records"
              payload: { fill_id: "${fc3}", amount_cents: 910, tendered_by: "tech-1" }
              as: Cashier
            - call: "POST /fills/${fc3}/dispense"
              payload: {}
              as: Pharmacist
          trigger:
            - call: "POST /pdmp-reports"
              payload: { patient_id: "${pat3}" }
              as: Pharmacist
              captures: { s: $.data.risk_score, dpc: $.data.distinct_prescriber_count, f: $.data.resulting_flag }
          assert:
            - "PdmpReport.distinct_prescriber_count == 3"
            - "PdmpReport.risk_score == 60"
            - "PdmpReport.resulting_flag == BLOCKED"
            - "Patient.${pat3}.controlled_status == LOCKED"

      - name: final_copay_cumulative_cap_order_pinned_accumulation
        grounds:
          - calculations.final_copay_adjudicated
          - entities.Fill.fields.final_copay_cents
          - entities.InsurancePlan.fields.copay_max_cents
        distinguishing_aspect: |
          Mode (c): the second fill's final_copay depends on prior_oop, itself a
          created_at-ASC sum of earlier final_copay values — a circular-looking
          dependency whose evaluation order is pinned. First fill final 3620,
          second fill capped at copay_max-3620 == 380, distinct from a naive
          per-fill computation of 3620.
        test_recipe:
          setup:
            - "Reuses the dual_variant Plan B (copay_max 4000) chronological cumulative cap"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /insurance-plans"
              payload: { bin: "610004", pcn: "PB2", name: "Plan B2", copay_pct: 0.20, copay_min_cents: 500, copay_max_cents: 4000, dispensing_fee_cents: 100, refill_too_soon_threshold_pct: 0.80 }
              as: PharmacyAdmin
              captures: { planb2: $.data.id }
            - call: "POST /drug-products"
              payload: { ndc: "00000-0004-01", name: "Alpha2", unit_price_cents: 800 }
              as: PharmacyAdmin
              captures: { alpha2: $.data.id }
            - call: "POST /formulary-entries"
              payload: { plan_id: "${planb2}", drug_id: "${alpha2}", tier: 2, allowed_amount_cents: 600 }
              as: PharmacyAdmin
            - call: "POST /patients"
              payload: { full_name: "Pat Four", date_of_birth: "1990-02-02", plan_id: "${planb2}" }
              as: Technician
              captures: { pat4: $.data.id }
            - call: "POST /prescribers"
              payload: { full_name: "Dr D", npi: "1000000004" }
              as: PharmacyAdmin
              captures: { presc4: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat4}", prescriber_id: "${presc4}", drug_id: "${alpha2}", quantity_per_fill: 30, days_supply: 30, refills_authorized: 2, written_utc: "2026-01-01T00:00:00.000Z" }
              as: Technician
              captures: { rx4: $.data.id }
            - call: "POST /fills"
              payload: { prescription_id: "${rx4}" }
              as: Technician
              captures: { ff1: $.data.id }
            - call: "POST /fills/${ff1}/run-dur"
              payload: {}
              as: Technician
            - call: "GET /prescriptions/${rx4}"
              payload: {}
              as: Technician
              captures: { rx4v1: $.data.version }
            - call: "POST /fills/${ff1}/submit-claim"
              payload: { expected_prescription_version: "${rx4v1}" }
              as: Technician
              captures: { ff1_final: $.data.final_copay_cents }
            - call: "POST /fills/${ff1}/stage-will-call"
              payload: {}
              as: Technician
            - call: "POST /payment-records"
              payload: { fill_id: "${ff1}", amount_cents: 3620, tendered_by: "tech-1" }
              as: Cashier
            - call: "POST /fills/${ff1}/dispense"
              payload: {}
              as: Pharmacist
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-02-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /fills"
              payload: { prescription_id: "${rx4}" }
              as: Technician
              captures: { ff2: $.data.id }
            - call: "POST /fills/${ff2}/run-dur"
              payload: {}
              as: Technician
            - call: "GET /prescriptions/${rx4}"
              payload: {}
              as: Technician
              captures: { rx4v2: $.data.version }
          trigger:
            - call: "POST /fills/${ff2}/submit-claim"
              payload: { expected_prescription_version: "${rx4v2}" }
              as: Technician
              captures: { ff2_final: $.data.final_copay_cents }
          assert:
            - "Fill.${ff1}.final_copay_cents == 3620"
            - "Fill.${ff2}.final_copay_cents == 380"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: fill_cycle_adjudicating_pa_referral_adjudicating
        grounds:
          - state_machines.Fill.ADJUDICATING_to_PA_REFERRAL
          - state_machines.Fill.PA_REFERRAL_to_ADJUDICATING
          - state_machines.PriorAuthRequest.PENDING_to_APPROVED
        distinguishing_aspect: |
          Cyclic shape on the Fill entity: submit-claim drives
          ADJUDICATING -> PA_REFERRAL, PA approval cycles it back
          PA_REFERRAL -> ADJUDICATING (claim_status returns to UNCLAIMED), then
          a resubmit reaches READY_FILL — a genuine A->B->A loop, not a linear
          pipeline.
        test_recipe:
          setup:
            - "Drug flagged pa_required; fill submitted -> PA_REFERRAL with a PENDING PriorAuthRequest"
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PharmacyAdmin
            - call: "POST /insurance-plans"
              payload: { bin: "610005", pcn: "PE", name: "Plan E", copay_pct: 0.10, copay_max_cents: 10000 }
              as: PharmacyAdmin
              captures: { plan_e: $.data.id }
            - call: "POST /drug-products"
              payload: { ndc: "00000-0005-01", name: "Delta PA", unit_price_cents: 500, pa_required: true }
              as: PharmacyAdmin
              captures: { drug_delta: $.data.id }
            - call: "POST /formulary-entries"
              payload: { plan_id: "${plan_e}", drug_id: "${drug_delta}", tier: 4, allowed_amount_cents: 400 }
              as: PharmacyAdmin
            - call: "POST /patients"
              payload: { full_name: "Pat Five", date_of_birth: "1985-03-03", plan_id: "${plan_e}" }
              as: Technician
              captures: { pat5: $.data.id }
            - call: "POST /prescribers"
              payload: { full_name: "Dr E", npi: "1000000005" }
              as: PharmacyAdmin
              captures: { presc5: $.data.id }
            - call: "POST /prescriptions"
              payload: { patient_id: "${pat5}", prescriber_id: "${presc5}", drug_id: "${drug_delta}", quantity_per_fill: 30, days_supply: 30, written_utc: "2026-01-01T00:00:00.000Z" }
              as: Technician
              captures: { rx5: $.data.id }
            - call: "POST /fills"
              payload: { prescription_id: "${rx5}" }
              as: Technician
              captures: { f5: $.data.id }
            - call: "POST /fills/${f5}/run-dur"
              payload: {}
              as: Technician
            - call: "GET /prescriptions/${rx5}"
              payload: {}
              as: Technician
              captures: { rx5v: $.data.version }
            - call: "POST /fills/${f5}/submit-claim"
              payload: { expected_prescription_version: "${rx5v}" }
              as: Technician
