scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (two variants, DIFFERENT entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: spending_allowance_average_12q_vs_fixed_3yr
        grounds:
          - calculations.spending_allowance
          - entities.SpendingPolicyRun.fields.base_value
          - entities.SpendingPolicyRun.fields.allowance_granted
        distinguishing_aspect: |
          Same fund, same 4.50% rate, same run date: AVERAGE_12Q over the 12
          quarter-end snapshots yields allowance 4666.87 while FIXED_3YR over the
          3 fiscal-year-end snapshots yields 4687.50 — the two formula variants
          on the Fund/SpendingPolicyRun domain produce different results for
          overlapping data.
        test_recipe:
          setup:
            - "Fund f1 ACTIVE, endowed, with EXECUTED agreement AVERAGE_12Q 4.50% (this run) and 12 QUARTER_END snapshots 100000,102000,98000,101500,104000,99000,103000,105500,107000,106000,108500,110000 plus 3 FISCAL_YEAR_END snapshots 98000,104500,110000"
            - "Fund f2 ACTIVE, endowed, EXECUTED agreement FIXED_3YR 4.50%, identical snapshot history values"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: FoundationAdmin
            - call: "POST /funds"
              payload: { fund_name: "DV Fund A12", fund_type: "DESIGNATED", endowed: true }
              as: FoundationAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /funds/${f1_id}/agreements"
              payload: { spending_rate_pct: 4.5, spending_formula: "AVERAGE_12Q", fee_tier_schedule: "STANDARD", min_initial_contribution: 10000.00 }
              as: FoundationAdmin
              captures: { f1_ag: $.data.id }
            - call: "POST /agreements/${f1_ag}/execute"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${f1_id}", donor_name: "Seed Donor", asset_kind: "CASH", declared_value: 200000.00 }
              as: GiftOfficer
              captures: { f1_c: $.data.id }
            - call: "POST /contributions/${f1_c}/accept"
              payload: {}
              as: GiftOfficer
            - call: "POST /funds/${f1_id}/activate"
              payload: {}
              as: FoundationAdmin
            - call: "POST /funds"
              payload: { fund_name: "DV Fund F3Y", fund_type: "DESIGNATED", endowed: true }
              as: FoundationAdmin
              captures: { f2_id: $.data.id }
            - call: "POST /funds/${f2_id}/agreements"
              payload: { spending_rate_pct: 4.5, spending_formula: "FIXED_3YR", fee_tier_schedule: "STANDARD", min_initial_contribution: 10000.00 }
              as: FoundationAdmin
              captures: { f2_ag: $.data.id }
            - call: "POST /agreements/${f2_ag}/execute"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${f2_id}", donor_name: "Seed Donor", asset_kind: "CASH", declared_value: 200000.00 }
              as: GiftOfficer
              captures: { f2_c: $.data.id }
            - call: "POST /contributions/${f2_c}/accept"
              payload: {}
              as: GiftOfficer
            - call: "POST /funds/${f2_id}/activate"
              payload: {}
              as: FoundationAdmin
            - call: "POST /funds/${f1_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2023-03-31T00:00:00Z", market_value: 100000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${f1_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2023-06-30T00:00:00Z", market_value: 102000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${f1_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2023-09-30T00:00:00Z", market_value: 98000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${f1_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2023-12-31T00:00:00Z", market_value: 101500.00 }
              as: FinanceOfficer
            - call: "POST /funds/${f1_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2024-03-31T00:00:00Z", market_value: 104000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${f1_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2024-06-30T00:00:00Z", market_value: 99000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${f1_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2024-09-30T00:00:00Z", market_value: 103000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${f1_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2024-12-31T00:00:00Z", market_value: 105500.00 }
              as: FinanceOfficer
            - call: "POST /funds/${f1_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2025-03-31T00:00:00Z", market_value: 107000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${f1_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2025-06-30T00:00:00Z", market_value: 106000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${f1_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2025-09-30T00:00:00Z", market_value: 108500.00 }
              as: FinanceOfficer
            - call: "POST /funds/${f1_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2025-12-31T00:00:00Z", market_value: 110000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${f2_id}/market-value-snapshots"
              payload: { snapshot_kind: "FISCAL_YEAR_END", effective_date: "2023-12-31T00:00:00Z", market_value: 98000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${f2_id}/market-value-snapshots"
              payload: { snapshot_kind: "FISCAL_YEAR_END", effective_date: "2024-12-31T00:00:00Z", market_value: 104500.00 }
              as: FinanceOfficer
            - call: "POST /funds/${f2_id}/market-value-snapshots"
              payload: { snapshot_kind: "FISCAL_YEAR_END", effective_date: "2025-12-31T00:00:00Z", market_value: 110000.00 }
              as: FinanceOfficer
          trigger:
            - call: "POST /funds/${f1_id}/spending-policy-runs"
              payload: { fiscal_year: 2026 }
              as: FinanceOfficer
              captures: { run1_base: $.data.base_value, run1_allow: $.data.allowance_granted }
            - call: "POST /funds/${f2_id}/spending-policy-runs"
              payload: { fiscal_year: 2026 }
              as: FinanceOfficer
              captures: { run2_base: $.data.base_value, run2_allow: $.data.allowance_granted }
          assert:
            - "SpendingPolicyRun(f1).base_value == 103708.33"
            - "SpendingPolicyRun(f1).allowance_granted == 4666.87"
            - "SpendingPolicyRun(f2).base_value == 104166.67"
            - "SpendingPolicyRun(f2).allowance_granted == 4687.50"
            - "run1_allow != run2_allow (two variants diverge on overlapping data)"

      - name: admin_fee_standard_tiered_vs_flat
        grounds:
          - calculations.admin_fee
          - entities.FeeAssessment.fields.annual_fee
          - entities.FeeAssessment.fields.quarterly_fee
        distinguishing_aspect: |
          Same quarter_end_balance 600000.00: the STANDARD marginal-tier schedule
          computes annual_fee 4600.00 / quarterly 1150.00, while the FLAT schedule
          computes annual 4500.00 / quarterly 1125.00 — a dual-variant fee
          calculation on the FeeAssessment domain, distinct from the spending
          allowance domain of the sibling instance.
        test_recipe:
          setup:
            - "Fund fs ACTIVE with EXECUTED agreement fee_tier_schedule STANDARD"
            - "Fund ff ACTIVE with EXECUTED agreement fee_tier_schedule FLAT"
            - "Both funds carry cash_balance >= 1200.00 so the fee debit succeeds"
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "Fee Std Fund", fund_type: "DESIGNATED", endowed: false }
              as: FoundationAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /funds/${fs_id}/agreements"
              payload: { spending_rate_pct: 4.5, spending_formula: "AVERAGE_12Q", fee_tier_schedule: "STANDARD", min_initial_contribution: 10000.00 }
              as: FoundationAdmin
              captures: { fs_ag: $.data.id }
            - call: "POST /agreements/${fs_ag}/execute"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${fs_id}", donor_name: "Seed", asset_kind: "CASH", declared_value: 50000.00 }
              as: GiftOfficer
              captures: { fs_c: $.data.id }
            - call: "POST /contributions/${fs_c}/accept"
              payload: {}
              as: GiftOfficer
            - call: "POST /funds/${fs_id}/activate"
              payload: {}
              as: FoundationAdmin
            - call: "POST /funds"
              payload: { fund_name: "Fee Flat Fund", fund_type: "DESIGNATED", endowed: false }
              as: FoundationAdmin
              captures: { ff_id: $.data.id }
            - call: "POST /funds/${ff_id}/agreements"
              payload: { spending_rate_pct: 4.5, spending_formula: "AVERAGE_12Q", fee_tier_schedule: "FLAT", min_initial_contribution: 10000.00 }
              as: FoundationAdmin
              captures: { ff_ag: $.data.id }
            - call: "POST /agreements/${ff_ag}/execute"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${ff_id}", donor_name: "Seed", asset_kind: "CASH", declared_value: 50000.00 }
              as: GiftOfficer
              captures: { ff_c: $.data.id }
            - call: "POST /contributions/${ff_c}/accept"
              payload: {}
              as: GiftOfficer
            - call: "POST /funds/${ff_id}/activate"
              payload: {}
              as: FoundationAdmin
          trigger:
            - call: "POST /funds/${fs_id}/fee-assessments"
              payload: { quarter_end_date: "2026-03-31T00:00:00Z", quarter_end_balance: 600000.00 }
              as: FinanceOfficer
              captures: { fs_ann: $.data.annual_fee, fs_q: $.data.quarterly_fee }
            - call: "POST /funds/${ff_id}/fee-assessments"
              payload: { quarter_end_date: "2026-03-31T00:00:00Z", quarter_end_balance: 600000.00 }
              as: FinanceOfficer
              captures: { ff_ann: $.data.annual_fee, ff_q: $.data.quarterly_fee }
          assert:
            - "FeeAssessment(fs).annual_fee == 4600.00"
            - "FeeAssessment(fs).quarterly_fee == 1150.00"
            - "FeeAssessment(ff).annual_fee == 4500.00"
            - "FeeAssessment(ff).quarterly_fee == 1125.00"
            - "Fund(fs).cash_balance == 48850.00"
            - "Fund(ff).cash_balance == 48875.00"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (instances in DIFFERENT modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: buyin_mark_to_market_redemption_chain
        grounds:
          - calculations.unit_price_and_units
          - entities.UnitizationEvent.fields.unit_price_applied
          - entities.PoolHolding.fields.units_held
        distinguishing_aspect: |
          Mode (a) — multi-input non-linear interaction: BUY_IN mints units at the
          pre-event price (nav/units), then MARK_TO_MARKET reprices, then
          REDEMPTION pays out at the NEW price; chained stateful inputs (nav,
          units_outstanding, unit_price) interact non-linearly, producing
          redemption cash 6321.96 for 300 units after a reprice from 20.0000 to
          21.0732.
        test_recipe:
          setup:
            - "Pool p with nav 1000000.00, units_outstanding 50000.0000 (unit_price 20.0000), status OPEN"
            - "Fund fu ACTIVE non-endowed with cash_balance 30000.00"
          setup_api_calls:
            - call: "POST /pools"
              payload: { pool_name: "Balanced Pool", pool_kind: "BALANCED", initial_nav: 1000000.00, initial_units: 50000.0000 }
              as: InvestmentManager
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /funds"
              payload: { fund_name: "Unit Fund", fund_type: "DESIGNATED", endowed: false }
              as: FoundationAdmin
              captures: { fu_id: $.data.id }
            - call: "POST /funds/${fu_id}/agreements"
              payload: { spending_rate_pct: 4.5, spending_formula: "AVERAGE_12Q", fee_tier_schedule: "STANDARD", min_initial_contribution: 10000.00 }
              as: FoundationAdmin
              captures: { fu_ag: $.data.id }
            - call: "POST /agreements/${fu_ag}/execute"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${fu_id}", donor_name: "Seed", asset_kind: "CASH", declared_value: 30000.00 }
              as: GiftOfficer
              captures: { fu_c: $.data.id }
            - call: "POST /contributions/${fu_c}/accept"
              payload: {}
              as: GiftOfficer
            - call: "POST /funds/${fu_id}/activate"
              payload: {}
              as: FoundationAdmin
            - call: "POST /pools/${p_id}/unitization-events"
              payload: { event_kind: "BUY_IN", fund_id: "${fu_id}", cash_amount: 25000.00, expected_pool_version: "${p_v0}" }
              as: InvestmentManager
              captures: { ev_buy: $.data.id, p_v1: $.data.version }
          trigger:
            - call: "POST /pools/${p_id}/unitization-events"
              payload: { event_kind: "MARK_TO_MARKET", new_nav: 1080000.00 }
              as: InvestmentManager
              captures: { ev_mtm: $.data.id }
            - call: "GET /pools/${p_id}"
              as: InvestmentManager
              captures: { p_v2: $.data.version, p_price: $.data.unit_price }
            - call: "POST /pools/${p_id}/unitization-events"
              payload: { event_kind: "REDEMPTION", fund_id: "${fu_id}", units_amount: 300.0000, expected_pool_version: "${p_v2}" }
              as: InvestmentManager
              captures: { ev_red: $.data.id, red_price: $.data.unit_price_applied }
          assert:
            - "UnitizationEvent(BUY_IN).units_delta == 1250.0000"
            - "UnitizationEvent(BUY_IN).unit_price_applied == 20.0000"
            - "Pool(p).unit_price after MARK_TO_MARKET == 21.0732"
            - "UnitizationEvent(REDEMPTION).unit_price_applied == 21.0732"
            - "Fund(fu).cash_balance == 5000.00 + 6321.96 == 11321.96"
            - "PoolHolding(fu,p).units_held == 950.0000"

      - name: liquidation_per_lot_rounding_then_sum
        grounds:
          - calculations.liquidation_net_proceeds
          - entities.Contribution.fields.net_proceeds
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: the pinned rule rounds
          each lot's fee to 2dp BEFORE netting and summing. Lot1 50000.55 @1.5%
          fee 750.01 -> net 49175.54; lot2 33333.33 @1.5% fee 500.00 -> net
          32758.33; contribution.net_proceeds == 81933.87. The alternative
          sum-gross-then-fee order yields a different cent total and is
          non-conformant.
        test_recipe:
          setup:
            - "Fund fl ACTIVE non-endowed (cash starts 20000.00 from seed gift)"
            - "Contribution cl asset_kind PUBLICLY_TRADED declared 83383.88, ACCEPTED, with two lots (50000.55 / 33333.33 appraised)"
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "Liq Fund", fund_type: "DESIGNATED", endowed: false }
              as: FoundationAdmin
              captures: { fl_id: $.data.id }
            - call: "POST /funds/${fl_id}/agreements"
              payload: { spending_rate_pct: 4.5, spending_formula: "AVERAGE_12Q", fee_tier_schedule: "STANDARD", min_initial_contribution: 10000.00 }
              as: FoundationAdmin
              captures: { fl_ag: $.data.id }
            - call: "POST /agreements/${fl_ag}/execute"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${fl_id}", donor_name: "Seed", asset_kind: "CASH", declared_value: 20000.00 }
              as: GiftOfficer
              captures: { fl_seed: $.data.id }
            - call: "POST /contributions/${fl_seed}/accept"
              payload: {}
              as: GiftOfficer
            - call: "POST /funds/${fl_id}/activate"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${fl_id}", donor_name: "Stock Donor", asset_kind: "PUBLICLY_TRADED", declared_value: 83383.88 }
              as: GiftOfficer
              captures: { cl_id: $.data.id }
            - call: "POST /contributions/${cl_id}/lots"
              payload: { description: "ACME shares", quantity: 100, appraised_value: 50000.55 }
              as: GiftOfficer
              captures: { lot1: $.data.id }
            - call: "POST /contributions/${cl_id}/lots"
              payload: { description: "BETA shares", quantity: 250, appraised_value: 33333.33 }
              as: GiftOfficer
              captures: { lot2: $.data.id }
            - call: "POST /contributions/${cl_id}/accept"
              payload: {}
              as: GiftOfficer
          trigger:
            - call: "POST /contributions/${cl_id}/liquidate"
              payload: { lot_proceeds: [ { lot_id: "${lot1}", gross_proceeds: 50000.55 }, { lot_id: "${lot2}", gross_proceeds: 33333.33 } ] }
              as: GiftOfficer
              captures: { cl_net: $.data.net_proceeds, cl_ls: $.data.liquidation_status }
          assert:
            - "Contribution(cl).liquidation_status == LIQUIDATED"
            - "Contribution(cl).net_proceeds == 81933.87"
            - "Fund(fl).cash_balance == 20000.00 + 81933.87 == 101933.87"

      - name: endowed_spendable_min_cash_allowance_interaction
        grounds:
          - calculations.spendable_balance
          - calculations.spending_allowance
          - entities.Fund.fields.spendable_balance
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          spendable = min(cash_balance, allowance - used); allowance derives from
          snapshots (external), cash from contributions — the scaffold pins that
          approve-time evaluation reads allowance FIRST then cash, so a grant of
          exactly 4666.87 (the allowance remainder, below cash 200000.00) is the
          boundary that approves while 4666.88 rejects with ERR_EXCEEDS_SPENDABLE.
        test_recipe:
          setup:
            - "Fund fe ACTIVE endowed, AVERAGE_12Q agreement at 4.50%, 12 quarter snapshots (same values as dual-variant fixture: allowance 4666.87)"
            - "Grantee g CLEARED"
            - "Grant gr amount 4666.87 in COMPLIANCE_REVIEW claimed by officer C1"
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "Spendable Fund", fund_type: "DESIGNATED", endowed: true }
              as: FoundationAdmin
              captures: { fe_id: $.data.id, fe_v0: $.data.version }
            - call: "POST /funds/${fe_id}/agreements"
              payload: { spending_rate_pct: 4.5, spending_formula: "AVERAGE_12Q", fee_tier_schedule: "STANDARD", min_initial_contribution: 10000.00 }
              as: FoundationAdmin
              captures: { fe_ag: $.data.id }
            - call: "POST /agreements/${fe_ag}/execute"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${fe_id}", donor_name: "Seed", asset_kind: "CASH", declared_value: 200000.00 }
              as: GiftOfficer
              captures: { fe_c: $.data.id }
            - call: "POST /contributions/${fe_c}/accept"
              payload: {}
              as: GiftOfficer
            - call: "POST /funds/${fe_id}/activate"
              payload: {}
              as: FoundationAdmin
            - call: "POST /funds/${fe_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2023-03-31T00:00:00Z", market_value: 100000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${fe_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2023-06-30T00:00:00Z", market_value: 102000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${fe_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2023-09-30T00:00:00Z", market_value: 98000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${fe_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2023-12-31T00:00:00Z", market_value: 101500.00 }
              as: FinanceOfficer
            - call: "POST /funds/${fe_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2024-03-31T00:00:00Z", market_value: 104000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${fe_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2024-06-30T00:00:00Z", market_value: 99000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${fe_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2024-09-30T00:00:00Z", market_value: 103000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${fe_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2024-12-31T00:00:00Z", market_value: 105500.00 }
              as: FinanceOfficer
            - call: "POST /funds/${fe_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2025-03-31T00:00:00Z", market_value: 107000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${fe_id}/market-value-snapshots"
