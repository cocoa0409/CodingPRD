            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", severity_rating: 2, likelihood_rating: 3, expected_sequence_version: "${seq_v2}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra2: $.data.id }
          assert:
            - "First create succeeded with expected_sequence_version == 1 (seq version now 2)"
            - "Stale create rejected: err == ERR_STALE_VERSION, http 412"
            - "Retry with the current version 2 succeeds: RiskAssessment.${ra2} created (status DRAFT)"

