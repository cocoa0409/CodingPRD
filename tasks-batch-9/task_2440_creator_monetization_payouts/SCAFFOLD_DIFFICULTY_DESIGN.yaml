              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/creators/${c2_id}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/investigations"
              payload: { creator_id: "${c1_id}", scope: "July window baseline.", violation_window_start: "2026-07-01T00:00:00Z", violation_window_end: "2026-07-31T00:00:00Z", hold_payouts: false }
              as: PolicyReviewer
              as_user_id: "reviewer-r1"
              captures: { i1_id: "$.data.id", i1_state: "$.data.state" }
          trigger:
            - call: "POST /monetization/investigations"
              payload: { creator_id: "${c1_id}", scope: "Touching at the end instant.", violation_window_start: "2026-07-31T00:00:00Z", violation_window_end: "2026-08-15T00:00:00Z", hold_payouts: false }
              as: PolicyReviewer
              as_user_id: "reviewer-r1"
            - call: "POST /monetization/investigations"
              payload: { creator_id: "${c1_id}", scope: "One second clear of the end instant.", violation_window_start: "2026-07-31T00:00:01Z", violation_window_end: "2026-08-15T00:00:00Z", hold_payouts: false }
              as: PolicyReviewer
              as_user_id: "reviewer-r1"
              captures: { i2_id: "$.data.id", i2_state: "$.data.state" }
            - call: "POST /monetization/investigations"
              payload: { creator_id: "${c2_id}", scope: "Same window, different creator.", violation_window_start: "2026-07-01T00:00:00Z", violation_window_end: "2026-07-31T00:00:00Z", hold_payouts: false }
              as: PolicyReviewer
              as_user_id: "reviewer-r1"
              captures: { i3_id: "$.data.id" }
            - call: "POST /monetization/investigations/${i1_id}/clear"
              payload: { finding: "No violation in the July window." }
              as: PolicyReviewer
              as_user_id: "reviewer-r2"
              captures: { i1_cleared: "$.data.state" }
            - call: "POST /monetization/investigations"
              payload: { creator_id: "${c1_id}", scope: "Re-opened after the first window was released.", violation_window_start: "2026-07-01T00:00:00Z", violation_window_end: "2026-07-31T00:00:00Z", hold_payouts: false }
              as: PolicyReviewer
              as_user_id: "reviewer-r1"
              captures: { i4_id: "$.data.id", i4_state: "$.data.state" }
          assert:
