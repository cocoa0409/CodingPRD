# =============================================================================
# Task 1871 — Dog Park Membership & Access Program
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: create_member_applies_defaults
        claim_type: creation
        grounds: [entities.Member]
        distinguishing_aspect: "Registration returns 201 with all system defaults: PENDING_VERIFICATION, zeroed scores, is_steward false, version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
          trigger:
            - call: "POST /dog-park/members"
              payload: { full_name: "New Member", email: "new@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id, st: $.data.status, sp: $.data.strike_points, prov: $.data.provisional_strike_score, sw: $.data.is_steward, gu: $.data.guest_passes_used_this_month, ver: $.data.version }
          assert:
            - "status == PENDING_VERIFICATION"
            - "strike_points == 0 and provisional_strike_score == 0"
            - "is_steward == false"
            - "guest_passes_used_this_month == 0"
            - "version == 1"

      - name: register_member_missing_email_rejected
        claim_type: required_fields
        grounds: [entities.Member.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field email yields 400 ERR_INVALID_REQUEST and creates no member."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /dog-park/members"
              payload: { full_name: "No Email" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (email is a required input field)"

      - name: get_member_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Member, "errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown member UUID returns 404 ERR_MEMBER_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /dog-park/members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ParkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MEMBER_NOT_FOUND"

      - name: create_dog_invalid_size_class_rejected
        claim_type: type_constraints
        grounds: [entities.Dog.fields.size_class, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "size_class outside {SMALL, LARGE} is rejected at request-shape validation."
        test_recipe:
          setup: ["registered member"]
          setup_api_calls:
            - call: "POST /dog-park/members"
              payload: { full_name: "Own Er", email: "owner@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Rex", size_class: "MEDIUM", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (MEDIUM is not a declared size_class)"

      - name: create_area_peak_capacity_above_capacity_rejected
        claim_type: type_constraints
        grounds: [entities.ParkArea.fields.peak_capacity, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "peak_capacity 5 > capacity 2 violates the peak_capacity <= capacity shape rule."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /dog-park/areas"
              payload: { name: "Bad Area", size_class_restriction: "LARGE", capacity: 2, peak_capacity: 5 }
              as: ParkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (peak_capacity must be <= capacity)"

      - name: create_area_computed_defaults
        claim_type: computed_fields
        grounds: [entities.ParkArea.fields.current_occupancy, entities.ParkArea.fields.effective_capacity]
        distinguishing_aspect: "A fresh area reports current_occupancy 0 and effective_capacity equal to capacity."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
          trigger:
            - call: "POST /dog-park/areas"
              payload: { name: "Main", size_class_restriction: "LARGE", capacity: 4, peak_capacity: 2 }
              as: ParkAdmin
              captures: { a_id: $.data.id, occ: $.data.current_occupancy, eff: $.data.effective_capacity }
          assert:
            - "current_occupancy == 0"
            - "effective_capacity == 4 (no closure, outside any peak window)"

      - name: create_waste_station_defaults
        claim_type: defaults
        grounds: [entities.WasteStation]
        distinguishing_aspect: "A new station starts at fill_pct 0, status OK, last_serviced_at null."
        test_recipe:
          setup: ["one park area"]
          setup_api_calls:
            - call: "POST /dog-park/areas"
              payload: { name: "Main", size_class_restriction: "LARGE", capacity: 4, peak_capacity: 2 }
              as: ParkAdmin
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /dog-park/areas/${a_id}/waste-stations"
              payload: { name: "North Bin" }
              as: ParkAdmin
              captures: { ws_id: $.data.id, fill: $.data.fill_pct, st: $.data.status, ls: $.data.last_serviced_at }
          assert:
            - "fill_pct == 0 and status == OK and last_serviced_at == null"

      - name: membership_term_end_dec31_on_initial_purchase
        claim_type: computed_fields
        grounds: [entities.Membership.fields.term_start, entities.Membership.fields.term_end, entities.Membership.fields.renewal_count]
        distinguishing_aspect: "Purchase on 2026-08-01 sets term [2026-08-01T00:00:00Z, 2026-12-31T23:59:59Z], renewal_count 0, and cascades the member to ACTIVE."
        test_recipe:
          setup: ["clock 2026-08-01; member with one VERIFIED dog"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/members"
              payload: { full_name: "Own Er", email: "owner@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Rex", size_class: "LARGE", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
          trigger:
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { ms_id: $.data.id, ts: $.data.term_start, te: $.data.term_end, rc: $.data.renewal_count, mst: $.data.status }
            - call: "GET /dog-park/members/${m_id}"
              payload: {}
              as: ParkAdmin
              captures: { member_st: $.data.status }
          assert:
            - "Membership.term_start == 2026-08-01T00:00:00Z"
            - "Membership.term_end == 2026-12-31T23:59:59Z (calendar-year municipal term)"
            - "renewal_count == 0 and status == ACTIVE"
            - "Member.${m_id}.status == ACTIVE (PENDING_VERIFICATION -> ACTIVE cascade)"

      - name: guest_pass_purchase_weekday_and_weekend_fee
        claim_type: creation
        grounds: [entities.GuestPass.fields.fee_cents, calculations.guest_pass_fee]
        distinguishing_aspect: "valid_on Monday 2026-08-03 yields fee 1500; valid_on Saturday 2026-08-08 yields fee 2250; both start ISSUED."
        test_recipe:
          setup: ["clock 2026-08-01; active member"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/members"
              payload: { full_name: "Spon Sor", email: "sponsor@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Rex", size_class: "LARGE", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /dog-park/guest-passes"
              payload: { guest_dog_size_class: "SMALL", valid_on: "2026-08-03" }
              as: Member
              as_user_id: "${m_id}"
              captures: { p1_id: $.data.id, fee1: $.data.fee_cents, st1: $.data.status }
            - call: "POST /dog-park/guest-passes"
              payload: { guest_dog_size_class: "SMALL", valid_on: "2026-08-08" }
              as: Member
              as_user_id: "${m_id}"
              captures: { p2_id: $.data.id, fee2: $.data.fee_cents, st2: $.data.status }
          assert:
            - "weekday pass fee_cents == 1500 (GUEST_WEEKDAY_FEE_CENTS)"
            - "weekend pass fee_cents == 2250 (round_half_up(1500 * 1.5))"
            - "both passes status == ISSUED"

      - name: list_member_dogs_scoped_to_parent
        claim_type: parent_relationships
        grounds: [entities.Dog.fields.member_id]
        distinguishing_aspect: "GET /members/{m1}/dogs returns exactly m1's dog, not m2's."
        test_recipe:
          setup: ["two members each with one dog"]
          setup_api_calls:
            - call: "POST /dog-park/members"
              payload: { full_name: "M One", email: "m1@x.com" }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /dog-park/members/${m1_id}/dogs"
              payload: { name: "Pip", size_class: "SMALL", license_number: "LIC-A", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /dog-park/members"
              payload: { full_name: "M Two", email: "m2@x.com" }
              as: Anonymous
              captures: { m2_id: $.data.id }
            - call: "POST /dog-park/members/${m2_id}/dogs"
              payload: { name: "Gus", size_class: "LARGE", license_number: "LIC-B", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { d2_id: $.data.id }
          trigger:
            - call: "GET /dog-park/members/${m1_id}/dogs"
              payload: {}
              as: ParkAdmin
              captures: { first_dog: "$.data[0].id" }
          assert:
            - "list for ${m1_id} contains exactly 1 dog and its id == ${d1_id}"
            - "dog ${d2_id} of member ${m2_id} is not present"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: visit_initial_state_open
        claim_type: initial_state
        grounds: [state_machines.ParkVisit, entities.ParkVisit.fields.checked_out_at, entities.ParkVisit.fields.close_reason]
        distinguishing_aspect: "A fresh check-in is OPEN with checked_out_at and close_reason both null."
        test_recipe:
          setup: ["clock 2026-08-01; SMALL area; active member with VERIFIED SMALL dog"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/areas"
              payload: { name: "Small Side", size_class_restriction: "SMALL", capacity: 4, peak_capacity: 4 }
              as: ParkAdmin
              captures: { a_id: $.data.id }
            - call: "POST /dog-park/members"
              payload: { full_name: "Own Er", email: "owner@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Pip", size_class: "SMALL", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /dog-park/visits/check-in"
              payload: { area_id: "${a_id}", dog_id: "${d_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id, st: $.data.status, co: $.data.checked_out_at, cr: $.data.close_reason }
          assert:
            - "ParkVisit.status == OPEN"
            - "checked_out_at == null and close_reason == null"

      - name: reinstate_active_member_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Member.SUSPENDED_to_ACTIVE, "errors[ERR_MEMBER_NOT_SUSPENDED]"]
        distinguishing_aspect: "Reinstate on an ACTIVE member is rejected; no strike reset occurs."
        test_recipe:
          setup: ["clock 2026-08-01; active member with VERIFIED dog and membership"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/members"
              payload: { full_name: "Own Er", email: "owner@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Rex", size_class: "LARGE", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /dog-park/members/${m_id}/reinstate"
              payload: {}
              as: ParkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MEMBER_NOT_SUSPENDED"

      - name: verify_already_verified_dog_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Dog.SUBMITTED_to_VERIFIED, "errors[ERR_DOG_NOT_VERIFIABLE]"]
        distinguishing_aspect: "Second verify on a VERIFIED dog is rejected (idempotency guard on the verification action)."
        test_recipe:
          setup: ["clock 2026-08-01; member with VERIFIED dog"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/members"
              payload: { full_name: "Own Er", email: "owner@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Rex", size_class: "LARGE", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
          trigger:
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DOG_NOT_VERIFIABLE"

      - name: resubmit_submitted_dog_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Dog.REJECTED_to_SUBMITTED, "errors[ERR_DOG_NOT_RESUBMITTABLE]"]
        distinguishing_aspect: "Resubmit while still SUBMITTED (never decided) is rejected."
        test_recipe:
          setup: ["clock 2026-08-01; member; dog freshly added (SUBMITTED)"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/members"
              payload: { full_name: "Own Er", email: "owner@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Rex", size_class: "LARGE", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /dog-park/dogs/${d_id}/resubmit"
              payload: { vaccination_expires_on: "2027-06-01", license_number: "LIC-9" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DOG_NOT_RESUBMITTABLE"

      - name: checkout_closed_visit_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ParkVisit.OPEN_to_CLOSED, "errors[ERR_VISIT_NOT_OPEN]"]
        distinguishing_aspect: "Second check-out on a CLOSED (terminal) visit is rejected."
        test_recipe:
          setup: ["clock 2026-08-01; SMALL area; active member with VERIFIED SMALL dog; one visit checked in and out"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/areas"
              payload: { name: "Small Side", size_class_restriction: "SMALL", capacity: 4, peak_capacity: 4 }
              as: ParkAdmin
              captures: { a_id: $.data.id }
            - call: "POST /dog-park/members"
              payload: { full_name: "Own Er", email: "owner@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Pip", size_class: "SMALL", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /dog-park/visits/check-in"
              payload: { area_id: "${a_id}", dog_id: "${d_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id }
            - call: "POST /dog-park/visits/${v_id}/check-out"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /dog-park/visits/${v_id}/check-out"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VISIT_NOT_OPEN"

      - name: advance_filed_to_confirmed_rejected
        claim_type: invalid_transition
        grounds: [state_machines.IncidentReport, "errors[ERR_INCIDENT_NOT_ADVANCABLE]"]
        distinguishing_aspect: "FILED -> CONFIRMED skips triage and is rejected; only FILED -> UNDER_REVIEW is legal."
        test_recipe:
          setup: ["clock 2026-08-01; subject member; report FILED by ParkAdmin"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/members"
              payload: { full_name: "Sub Ject", email: "subject@x.com" }
              as: Anonymous
              captures: { sub_id: $.data.id }
            - call: "POST /dog-park/incident-reports"
              payload: { subject_member_id: "${sub_id}", severity: "MINOR", occurred_at: "2026-08-01T10:00:00Z", description: "rough play" }
              as: ParkAdmin
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /dog-park/incident-reports/${r_id}/advance"
              payload: { to: "CONFIRMED" }
              as: ParkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INCIDENT_NOT_ADVANCABLE"

      - name: cancel_active_closure_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AreaClosure.SCHEDULED_to_CANCELLED, state_machines.AreaClosure.SCHEDULED_to_ACTIVE, "errors[ERR_CLOSURE_NOT_CANCELLABLE]"]
        distinguishing_aspect: "A closure whose window has started flips to ACTIVE at the run and can no longer be cancelled."
        test_recipe:
          setup: ["clock 2026-08-01; area; closure [2026-08-01, 2026-08-05) activated by the nightly run"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/areas"
              payload: { name: "Main", size_class_restriction: "LARGE", capacity: 4, peak_capacity: 4 }
              as: ParkAdmin
              captures: { a_id: $.data.id }
            - call: "POST /dog-park/areas/${a_id}/closures"
              payload: { starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-05T00:00:00Z", reason: "turf work" }
              as: ParkAdmin
              captures: { c_id: $.data.id }
            - call: "POST /dog-park/service-runs/nightly"
              payload: {}
              as: ParkAdmin
              captures: { n_act: $.data.closures_activated }
          trigger:
            - call: "POST /dog-park/closures/${c_id}/cancel"
              payload: {}
              as: ParkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "nightly run closures_activated == 1 (starts_at <= run time < ends_at, boundary inclusive at start)"
            - "cancel error_id == ERR_CLOSURE_NOT_CANCELLABLE"

      - name: steward_triage_filed_to_under_review
        claim_type: valid_transition
        grounds: [state_machines.IncidentReport.FILED_to_UNDER_REVIEW, "roles[2]"]
        distinguishing_aspect: "A flagged steward (is_steward member) performs FILED -> UNDER_REVIEW triage."
        test_recipe:
          setup: ["clock 2026-08-01; subject member; steward member with is_steward granted; report FILED by ParkAdmin"]
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
