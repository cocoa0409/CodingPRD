              captures: { rule_reused: "$.data.id" }
          assert:
            - "${e_dup_same_plan} == 'ERR_DUPLICATE_CALL_SIGN' with HTTP 409 — a different service_type does not make the call sign free"
            - "${e_dup_other_plan} == 'ERR_DUPLICATE_CALL_SIGN' with HTTP 409 — uniqueness is global, not per plan"
            - "${e_dup_priority} == 'ERR_DUPLICATE_RELAY_PRIORITY' with HTTP 409 even though relay_class and fips_codes differ — only (plan, event_code, priority) is compared"
            - "${rule_other_code} and ${rule_other_plan} are both created (201): the same priority integer is legal for a different event_code and for a different plan"
            - "after retiring ${rule_a}, ${rule_reused} is created (201) with priority 1 and event_code 'TOR' — RETIRED rows leave the uniqueness set"
            - "${rule_reused} has specificity == 2 (fips_codes non-empty) and forward_delay_seconds == 5, and GET /relay-rules filtered by state_plan_id ${plan_a} reports total_count == 3 (rule_a RETIRED, rule_other_code ACTIVE, rule_reused ACTIVE)"

      - name: future_timestamp_errors_for_outages_and_alerts_are_triggerable_at_one_second
        claim_type: error_triggerable
        grounds:
          - "§1.6 ERR_OUTAGE_DETECTED_IN_FUTURE (422) 'POST /equipment-outages with detected_at later than the logical clock now'"
          - "§1.6 ERR_ALERT_RECEIVED_IN_FUTURE (422) 'POST /alert-events with received_at later than the logical clock now'"
          - "§1.4 priority 10 'temporal-window rules; ERR_TEST_WINDOW_OVERLAP is 409, the rest are 422'"
        distinguishing_aspect: "Both rules are strictly-later comparisons against the logical clock: a timestamp equal to now is accepted while now + 1 second is refused, and the refusal creates nothing — the device stays READY and no AlertEvent row appears in the list."
        test_recipe:
          setup:
            - "Clock 2026-08-12T08:00:00Z; plan KS 2026-R1 requiring ['PEP'] activated; station KWEA; dev1 READY; ma1 PEP/WXPEP."
            - "Probe pairs: detected_at / received_at at exactly 2026-08-12T08:00:00Z (legal) and at 2026-08-12T08:00:01Z (one second in the future)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-12T08:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "DECODER", firmware_version: "5.2.1" }
              captures: { dev1: "$.data.id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv1: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { ma1: "$.data.id" }
          trigger:
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSAXS-8101", fips_codes: ["20173"], received_at: "2026-08-12T08:00:01Z" }
              captures: { e_alert_future: "$.data.error_id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSAXS-8102", fips_codes: ["20173"], received_at: "2026-08-12T08:00:00Z" }
              captures: { alert_ok: "$.data.id" }
            - call: "POST /equipment-outages"
              as: StationEngineer
              as_user_id: eng-1
              payload: { device_id: "${dev1}", detected_at: "2026-08-12T08:00:01Z", failure_summary: "clock-ahead probe" }
              captures: { e_outage_future: "$.data.error_id" }
            - call: "GET /eas-devices/${dev1}"
              as: StationEngineer
              as_user_id: eng-1
            - call: "POST /equipment-outages"
              as: StationEngineer
              as_user_id: eng-1
              payload: { device_id: "${dev1}", detected_at: "2026-08-12T08:00:00Z", failure_summary: "encoder output silent" }
              captures: { outage_ok: "$.data.id" }
            - call: "GET /alert-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_id}" }
            - call: "GET /equipment-outages"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { device_id: "${dev1}" }
          assert:
            - "${e_alert_future} == 'ERR_ALERT_RECEIVED_IN_FUTURE' with HTTP 422 and ${e_outage_future} == 'ERR_OUTAGE_DETECTED_IN_FUTURE' with HTTP 422"
            - "GET /equipment-outages filtered by device_id reports total_count == 1 (only ${outage_ok}) — the future-dated create left no row"
            - "the equal-to-now probes both succeed: ${alert_ok} is 201 with received_at '2026-08-12T08:00:00Z' and ${outage_ok} is 201 with detected_at '2026-08-12T08:00:00Z' and status 'OPEN'"
            - "between the refused outage and the accepted one, GET /eas-devices/${dev1} still reports status 'READY' — the rejected create fired no cascade"
            - "GET /alert-events filtered by station_id returns total_count == 1 (only ${alert_ok}); the refused alert left no row"
            - "the accepted outage cascades as declared: dev1 -> FAILED and ma1 -> SUSPENDED, so compliance_score becomes 100.00 - 25.00 = 75.00 with posture WATCH"

