        distinguishing_aspect: "The checkpoint carries a clock-dependent tour rule: a CONFIRMED tour whose scheduled_at plus 30 minutes has passed becomes CANCELLED_NO_SHOW, while a CONFIRMED tour still inside its grace window is left alone."
