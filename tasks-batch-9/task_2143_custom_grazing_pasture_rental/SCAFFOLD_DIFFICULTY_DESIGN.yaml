  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: settlement_dispute_adjudicate_reissue_cycle_on_settlement
        grounds:
          - state_machines.Settlement.ISSUED_to_DISPUTED
          - state_machines.Settlement.DISPUTED_to_ADJUDICATED
          - state_machines.Settlement.ADJUDICATED_to_ISSUED
          - entities.Settlement.fields.dispute_round
          - errors[ERR_DISPUTE_ROUNDS_EXHAUSTED]
        distinguishing_aspect: |
          NON-LINEAR SHAPE = CYCLE, on the Settlement entity: ISSUED -> DISPUTED ->
          ADJUDICATED -> ISSUED runs twice on the same row, re-pricing the gain each lap,
          and the third dispute is refused with ERR_DISPUTE_ROUNDS_EXHAUSTED.
        test_recipe:
          setup:
            - "Contract K1 ACTIVE on PER_POUND_OF_GAIN at 85 cents/lb; lot L1 received 150 head at 63745 lb (61514 lb shrunk) and weighed out 150 head at 74970 lb on 2026-11-10."
