              as_user_id: "u-cxa-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_WINDOW with HTTP 422"
            - "${err} != ERR_SEASONAL_WINDOW_CONFLICT"
            - "GET /deferred-tests?equipment_id=${e1} returns total_count == 1"

      - name: safety_critical_failed_item_blocks_checklist_verification
        claim_type: conditional_validation
        grounds:
          - validations[priority=17]
          - errors[ERR_SAFETY_ITEM_FAILED]
          - entities.PrefunctionalChecklist.fields.items
        distinguishing_aspect: "A FAIL on an item whose is_safety_critical is true blocks verification with 422 ERR_SAFETY_ITEM_FAILED, while the identical FAIL on a non-safety item would not; execution itself still succeeds because it only requires that nothing is PENDING."
        test_recipe:
          setup:
            - "Project P with EquipmentUnit E1 INSTALLED."
            - "Checklist CL1 has two items: PFC-01 (safety-critical) recorded FAIL and PFC-02 (ordinary) recorded PASS, and has been executed by u-contractor-1."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Safety Cx", building_name: "Safety Block", project_type: "NEW_CONSTRUCTION", contract_value_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
            - call: "POST /equipment-units"
              payload: { project_id: "${p}", tag: "ELV-SF", system_type: "ELEVATOR", criticality: "LIFE_SAFETY", contract_value_cents: 1000000, weight_units: 10 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { e1: $.data.id }
            - call: "POST /equipment-units/${e1}/install-status"
              payload: { install_status: "INSTALLED" }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists"
              payload: { equipment_id: "${e1}", template_code: "PFC-ELV-STD" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { cl1: $.data.id }
            - call: "POST /prefunctional-checklists/${cl1}/items"
              payload: { item_code: "PFC-01", description: "Hoistway fire rating verified", is_safety_critical: true }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /prefunctional-checklists/${cl1}/items"
              payload: { item_code: "PFC-02", description: "Cab finishes installed", is_safety_critical: false }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /prefunctional-checklists/${cl1}/record-item"
              payload: { item_code: "PFC-01", result: "FAIL", note: "Penetration unsealed" }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists/${cl1}/record-item"
              payload: { item_code: "PFC-02", result: "PASS" }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists/${cl1}/execute"
              payload: {}
              as: Contractor
              as_user_id: "u-contractor-1"
              captures: { exec_status: $.data.status, failed_count: $.data.failed_item_count }
          trigger:
            - call: "POST /prefunctional-checklists/${cl1}/verify"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { err: $.data.error_id }
          assert:
            - "${exec_status} == EXECUTED and ${failed_count} == 1"
            - "${err} == ERR_SAFETY_ITEM_FAILED with HTTP 422"
            - "PrefunctionalChecklist.${cl1}.status == EXECUTED and PrefunctionalChecklist.${cl1}.verified_by_user_id is null"
            - "CxProject.${p}.verified_prefunctional_units == 0"
            - "EquipmentUnit.${e1}.verification_status == UNVERIFIED"

      - name: checklist_item_code_uniqueness_and_lookup_are_enforced
        claim_type: violation_to_error
        grounds:
          - validations[priority=27]
          - errors[ERR_DUPLICATE_ITEM_CODE]
          - errors[ERR_ITEM_NOT_FOUND]
          - errors[ERR_CHECKLIST_INCOMPLETE]
        distinguishing_aspect: "Adding PFC-01 twice answers 422 ERR_DUPLICATE_ITEM_CODE, recording against PFC-99 answers 422 ERR_ITEM_NOT_FOUND, and executing while PFC-02 is still PENDING answers 422 ERR_CHECKLIST_INCOMPLETE."
        test_recipe:
          setup:
            - "Project P with EquipmentUnit E1 INSTALLED and checklist CL1 carrying items PFC-01 and PFC-02, only PFC-01 recorded."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Item Cx", building_name: "Item Block", project_type: "NEW_CONSTRUCTION", contract_value_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
            - call: "POST /equipment-units"
              payload: { project_id: "${p}", tag: "AHU-IT", system_type: "AHU", criticality: "STANDARD", contract_value_cents: 1000000, weight_units: 10 }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { e1: $.data.id }
            - call: "POST /equipment-units/${e1}/install-status"
              payload: { install_status: "INSTALLED" }
              as: Contractor
              as_user_id: "u-contractor-1"
            - call: "POST /prefunctional-checklists"
              payload: { equipment_id: "${e1}", template_code: "PFC-AHU-STD" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { cl1: $.data.id }
            - call: "POST /prefunctional-checklists/${cl1}/items"
              payload: { item_code: "PFC-01", description: "Filters installed", is_safety_critical: false }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /prefunctional-checklists/${cl1}/items"
              payload: { item_code: "PFC-02", description: "Coils clean", is_safety_critical: false }
              as: CxAuthority
              as_user_id: "u-cxa-1"
            - call: "POST /prefunctional-checklists/${cl1}/record-item"
              payload: { item_code: "PFC-01", result: "PASS" }
              as: Contractor
              as_user_id: "u-contractor-1"
          trigger:
            - call: "POST /prefunctional-checklists/${cl1}/items"
              payload: { item_code: "PFC-01", description: "Filters installed again", is_safety_critical: false }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { err_dup: $.data.error_id }
            - call: "POST /prefunctional-checklists/${cl1}/record-item"
              payload: { item_code: "PFC-99", result: "PASS" }
              as: Contractor
              as_user_id: "u-contractor-1"
              captures: { err_missing: $.data.error_id }
            - call: "POST /prefunctional-checklists/${cl1}/execute"
              payload: {}
              as: Contractor
              as_user_id: "u-contractor-1"
              captures: { err_incomplete: $.data.error_id }
          assert:
            - "${err_dup} == ERR_DUPLICATE_ITEM_CODE with HTTP 422"
            - "${err_missing} == ERR_ITEM_NOT_FOUND with HTTP 422"
            - "${err_incomplete} == ERR_CHECKLIST_INCOMPLETE with HTTP 422"
            - "PrefunctionalChecklist.${cl1}.item_count == 2 and PrefunctionalChecklist.${cl1}.status == DRAFT"
            - "PrefunctionalChecklist.${cl1}.passed_item_count == 1"

      - name: pagination_limit_above_maximum_returns_validation
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - response_envelope.pagination_defaults
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "limit is bounded to 1..100, so limit=101 answers 400 ERR_VALIDATION instead of silently clamping."
        test_recipe:
