    roles: [MillAdmin, MillSupervisor]
    input: [product_line_id, core_material, lot_reference, available_square_feet]
    output: CoreStock
    code: 201
  - method: GET
    path: /mill/core-stocks/{core_stock_id}
    description: "Fetch one core stock row."
    roles: *all_readers
    input: []
    output: CoreStock
    code: 200
  - method: GET
    path: /mill/core-stocks
    description: "List core stock, optionally by product line."
    roles: *all_readers
    input: ["product_line_id?", "core_material?", "limit?", "offset?"]
    output: CoreStock[]
    code: 200

  - method: POST
    path: /mill/flooring-lots
    description: "Plan a milling lot drawing kiln-dry lumber from a released charge."
    roles: [MillSupervisor, MillAdmin]
    input: [product_line_id, kiln_charge_id, "core_stock_id?", input_dry_bf]
    output: FlooringLot
    code: 201
    side_effects:
      - "Compute construction_type, nominal_width_in, dimensional_growth_allowance_in and planned_finished_width_in."
      - "ENGINEERED lots reserve core square footage; SOLID lots must not reference core stock."
      - "Reduce KilnCharge.remaining_dry_bf; when it reaches 0 the charge auto-transitions to CLOSED."
  - method: GET
    path: /mill/flooring-lots/{flooring_lot_id}
    description: "Fetch one flooring lot."
    roles: *all_readers
    input: []
    output: FlooringLot
    code: 200
  - method: GET
    path: /mill/flooring-lots
    description: "List flooring lots, optionally by line, charge, core stock, closing grade run or status."
    roles: *all_readers
    input: ["product_line_id?", "kiln_charge_id?", "core_stock_id?", "final_grade_run_id?", "status?", "limit?", "offset?"]
    output: FlooringLot[]
    code: 200
  - method: POST
    path: /mill/flooring-lots/{flooring_lot_id}/complete_milling
    description: "Record milling outputs, the mass balance and the provisional yield."
    roles: [MillSupervisor]
    input: [actual_milled_width_in, net_flooring_bf, shorts_bf, sawdust_tons, shavings_tons]
    output: FlooringLot
    code: 200
    side_effects:
      - "Compute residue_bf, waste_bf and provisional_yield_pct."
      - "Create SAWDUST, SHAVINGS and SHORTS byproduct batches."
  - method: POST
    path: /mill/flooring-lots/{flooring_lot_id}/finalize
    description: "Close a lot against a finalized grade run, branching on the yield floor."
    roles: [MillSupervisor, GradeInspector]
    input: [grade_run_id]
    output: FlooringLot
    code: 200
    side_effects:
      - "Compute final_yield_pct from the grade run credited board feet."
      - "Move to GRADED at or above the yield floor, otherwise QUARANTINED with a reason."
  - method: POST
    path: /mill/flooring-lots/{flooring_lot_id}/void
    description: "Void a lot and compensate every reservation it made."
    roles: [MillSupervisor, MillAdmin]
    input: [void_reason]
    output: FlooringLot
    code: 200
    side_effects:
      - "Release core reservations, restore charge remaining_dry_bf, reopen a CLOSED charge and zero byproduct availability."
  - method: GET
    path: /mill/flooring-lots/{flooring_lot_id}/yield-summary
    description: "Computed read: the provisional and final yield variants side by side with the mass balance."
    roles: *all_readers
    input: []
    output: "{ flooring_lot_id: uuid, input_dry_bf: decimal, net_flooring_bf: decimal, residue_bf: decimal, waste_bf: decimal, provisional_yield_pct: decimal, final_yield_pct: decimal, yield_delta_pp: decimal, yield_floor_pct: decimal }"
