  - name: err_assignment_not_accepted_blocks_a_stage_start
    claim_type: error_triggerable
    grounds: ['errors[ERR_ASSIGNMENT_NOT_ACCEPTED]', validations.priority_10]
    excluded_because: {difficulty_instance: stage_start_requires_the_assignment_entity_to_be_accepted,
      rationale: 'That §1.8 instance starts a stage whose assignment is still PROPOSED, asserts 409 ERR_ASSIGNMENT_NOT_ACCEPTED,
        then accepts it and replays the identical start.'}
  - name: err_catalog_not_locked_blocks_a_solicitation_accept
    claim_type: error_triggerable
    grounds: ['errors[ERR_CATALOG_NOT_LOCKED]', validations.priority_10]
    excluded_because: {difficulty_instance: solicitation_accept_requires_the_catalog_entity_to_be_locked,
      rationale: That §1.8 instance accepts a SUBMITTED solicitation while its catalog is still OPEN and
        asserts 409 ERR_CATALOG_NOT_LOCKED before locking and replaying the accept.}
  - name: err_catalog_deadline_not_passed_blocks_an_early_lock
    claim_type: error_triggerable
    grounds: ['errors[ERR_CATALOG_DEADLINE_NOT_PASSED]', validations.priority_15]
    excluded_because: {difficulty_instance: solicitation_accept_requires_the_catalog_entity_to_be_locked,
      rationale: The same §1.8 instance reaches the LOCKED state only by first being refused with 409
        ERR_CATALOG_DEADLINE_NOT_PASSED at a clock on the submission_deadline itself.}
  - name: err_issue_not_solicited_blocks_an_order_submit
    claim_type: error_triggerable
    grounds: ['errors[ERR_ISSUE_NOT_SOLICITED]', validations.priority_10]
    excluded_because: {difficulty_instance: order_submit_requires_the_issue_entity_to_be_solicited, rationale: 'That
        §1.8 instance submits an order against an UNSOLICITED issue, asserts 409 ERR_ISSUE_NOT_SOLICITED,
        then publishes the catalog and replays the submit.'}
  - name: err_solicitation_window_closed_blocks_a_late_submit
    claim_type: error_triggerable
    grounds: ['errors[ERR_SOLICITATION_WINDOW_CLOSED]', validations.priority_14]
    excluded_because: {difficulty_instance: temporal_priority_14_beats_referential_priority_25_on_solicitation_submit,
      rationale: That §1.8 instance submits after the submission_deadline with no STANDARD cover on the
        issue and asserts ERR_SOLICITATION_WINDOW_CLOSED rather than ERR_STANDARD_COVER_REQUIRED.}
  - name: err_negotiation_rounds_exhausted_blocks_a_fourth_counter
    claim_type: error_triggerable
    grounds: ['errors[ERR_NEGOTIATION_ROUNDS_EXHAUSTED]', validations.priority_13]
    excluded_because: {difficulty_instance: negotiation_cycle_returns_to_proposed_and_exhausts_on_the_third_round,
      rationale: That §1.8 instance walks the counter/revise loop three times and asserts that the fourth
        counter is refused with 409 ERR_NEGOTIATION_ROUNDS_EXHAUSTED.}
  - name: err_digital_embargo_violation_blocks_an_early_digital_window
    claim_type: error_triggerable
    grounds: ['errors[ERR_DIGITAL_EMBARGO_VIOLATION]', validations.priority_17]
    excluded_because: {difficulty_instance: digital_embargo_and_collected_blackout_date_boundaries_differ_by_one_day,
      rationale: That §1.8 instance places the DIGITAL window one day inside the embargo and asserts 422
        ERR_DIGITAL_EMBARGO_VIOLATION against the first legal date.}
  - name: err_cannibalization_window_conflict_blocks_an_early_collected_window
    claim_type: error_triggerable
    grounds: ['errors[ERR_CANNIBALIZATION_WINDOW_CONFLICT]', validations.priority_18]
    excluded_because: {difficulty_instance: digital_embargo_and_collected_blackout_date_boundaries_differ_by_one_day,
      rationale: 'The same §1.8 instance places the COLLECTED window on the last blacked-out day and asserts
        422 ERR_CANNIBALIZATION_WINDOW_CONFLICT, then one day later for the accept.'}
  - name: err_creator_double_booked_blocks_an_overlapping_booking
    claim_type: error_triggerable
    grounds: ['errors[ERR_CREATOR_DOUBLE_BOOKED]', validations.priority_19]
    excluded_because: {difficulty_instance: creator_studio_booking_half_open_intervals_allow_adjacency_but_not_intersection,
      rationale: That §1.8 instance books three windows against one creator and asserts that only the
        intersecting one is refused with 409 ERR_CREATOR_DOUBLE_BOOKED.}
  - name: err_on_sale_cadence_conflict_blocks_a_too_close_issue
    claim_type: error_triggerable
    grounds: ['errors[ERR_ON_SALE_CADENCE_CONFLICT]', validations.priority_20]
    excluded_because: {difficulty_instance: on_sale_slot_requires_a_symmetric_21_day_gap_in_both_directions,
      rationale: 'That §1.8 instance asserts 409 ERR_ON_SALE_CADENCE_CONFLICT at 20 days both before and
        after an existing issue, and 200 at exactly 21 days.'}
  - name: err_catalog_slots_exhausted_blocks_an_accept_at_capacity
    claim_type: error_triggerable
    grounds: ['errors[ERR_CATALOG_SLOTS_EXHAUSTED]', validations.priority_23]
    excluded_because: {difficulty_instance: solicitation_withdrawal_restores_the_catalog_slot_capacity,
      rationale: 'That §1.8 instance fills a max_slots catalog, asserts 409 ERR_CATALOG_SLOTS_EXHAUSTED,
        then withdraws one accepted solicitation and replays the accept.'}
  - name: err_credit_limit_exceeded_blocks_a_submit_one_cent_over_the_limit
    claim_type: error_triggerable
    grounds: ['errors[ERR_CREDIT_LIMIT_EXCEEDED]', validations.priority_27]
    excluded_because: {difficulty_instance: credit_limit_cent_boundary_lands_exactly_on_the_limit_versus_one_cent_over,
      rationale: 'That §1.8 instance drives the projected balance to exactly the limit and to the limit
        plus one cent, asserting 409 ERR_CREDIT_LIMIT_EXCEEDED only for the latter.'}
  - name: err_segregation_of_duties_blocks_the_issuer_from_paying
    claim_type: error_triggerable
    grounds: ['errors[ERR_SEGREGATION_OF_DUTIES]', validations.priority_11]
    excluded_because: {difficulty_instance: safety_priority_11_beats_fiscal_priority_28_on_statement_pay,
      rationale: That §1.8 instance pays with the same X-User-ID that issued the statement and asserts
        409 ERR_SEGREGATION_OF_DUTIES.}
  - name: err_zero_payable_statement_blocks_paying_a_fully_recouped_statement
    claim_type: error_triggerable
    grounds: ['errors[ERR_ZERO_PAYABLE_STATEMENT]', validations.priority_28]
    excluded_because: {difficulty_instance: safety_priority_11_beats_fiscal_priority_28_on_statement_pay,
      rationale: 'The same §1.8 instance pays a payable_cents == 0 statement with a DIFFERENT user id
        and asserts 409 ERR_ZERO_PAYABLE_STATEMENT, which pins the ordering against priority 11.'}
- section: rbac
  instances:
  - name: role_allowed_creator_registration_is_open_to_both_editorial_roles
    claim_type: role_allowed
    grounds: ['endpoints[POST /comics/creators]', 'endpoints[GET /comics/creators]', validations.priority_2]
    distinguishing_aspect: 'POST /comics/creators declares two roles and BOTH really work: EditorInChief
      and ManagingEditor each create a creator successfully, and a RoyaltyAccountant (a read-only role
      on this resource) sees both rows through the list endpoint.'
    test_recipe:
      setup: ['logical clock 2026-08-01T00:00:00Z', empty database]
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: EditorInChief
      trigger:
      - call: POST /comics/creators
        payload:
          full_name: Wanda Writer
          crafts: [SCRIPT]
          default_page_rate_cents: 12000
        as: EditorInChief
        captures: {cr_w: $.data.id}
      - call: POST /comics/creators
        payload:
          full_name: Ida Inker
          crafts: [INKS, LETTERS]
          default_page_rate_cents: 7000
        as: ManagingEditor
        captures: {cr_i: $.data.id}
      - call: GET /comics/creators
        payload: {limit: 100, offset: 0}
        as: RoyaltyAccountant
        as_user_id: acct-1
      assert: ['first trigger: 201 with Creator.${cr_w}.crafts == [''SCRIPT''] and active_assignment_count
          == 0', 'second trigger: 201 with Creator.${cr_i}.crafts == [''INKS'', ''LETTERS''] and default_page_rate_cents
          == 7000', the ManagingEditor create is NOT a 403 — both declared roles are honoured, the RoyaltyAccountant
          list returns total_count == 2]
  - name: role_denied_a_retailer_cannot_greenlight_and_a_salesdirector_cannot_create_issues
    claim_type: role_denied
    grounds: [validations.priority_2, 'errors[ERR_UNAUTHORIZED]', 'endpoints[POST /comics/titles/{id}/greenlight]',
      'endpoints[POST /comics/titles/{id}/issues]', 'endpoints[POST /comics/catalogs]']
    distinguishing_aspect: Three single-role write endpoints reject three different wrong roles with 403
      ERR_UNAUTHORIZED — Retailer on greenlight, SalesDirector on issue creation, Creator on catalog creation
      — and none of them mutates a single row.
    test_recipe:
      setup: ['logical clock 2026-08-01T00:00:00Z', one PITCHED title (created by the EditorInChief) and
          one registered retailer whose id is used as the Retailer X-User-ID]
