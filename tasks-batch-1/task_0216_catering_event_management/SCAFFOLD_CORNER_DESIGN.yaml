              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_RESOURCE_OWNER"
            - "Order.${ord_id}.lifecycle_status == DRAFT"

      - name: eventcaptain_cannot_create_package
        claim_type: peer_resource_denied
        grounds: [roles, endpoints, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "An EventCaptain invoking POST /catering/packages (a CateringAdmin-exclusive op) is rejected with ERR_FORBIDDEN_ROLE (403); peer-role boundary."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /catering/packages"
              payload: { name: "Sneaky", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: EventCaptain
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: missing_auth
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request to a protected endpoint with no X-User-Role / X-User-ID headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["A package exists."]
          setup_api_calls:
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
          trigger:
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"

  # =====================================================================
  # Cross-Cutting Complexity Layers
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: accept_second_change_with_stale_order_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[change-request-accept-stale-order]", state_machines.ChangeRequest.PROPOSED_to_ACCEPTED, "errors[ERR_STALE_ORDER_VERSION]"]
        distinguishing_aspect: "Two PROPOSED change requests on one order: accepting the first advances Order.version; accepting the second while still carrying the pre-supersede expected_order_version is rejected ERR_STALE_ORDER_VERSION (412)."
        test_recipe:
          setup: ["Confirmed order; two open PROPOSED change requests CR1 and CR2; clock far out so change fee 0."]
          setup_api_calls:
            - call: "POST /catering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CateringAdmin
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "POST /catering/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: SalesCoordinator
              captures: { ord_v2: $.data.version }
            - call: "POST /catering/change-requests"
              payload: { order_id: "${ord_id}", requested_headcount: 90, requested_event_start: "2026-09-01T17:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { cr1: $.data.id }
            - call: "POST /catering/change-requests"
              payload: { order_id: "${ord_id}", requested_headcount: 95, requested_event_start: "2026-09-01T17:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { cr2: $.data.id }
            - call: "POST /catering/change-requests/${cr1}/accept"
              payload: { expected_order_version: "${ord_v2}" }
              as: SalesCoordinator
          trigger:
            - call: "POST /catering/change-requests/${cr2}/accept"
              payload: { expected_order_version: "${ord_v2}" }
              as: SalesCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_ORDER_VERSION"
            - "ChangeRequest.${cr2}.status == PROPOSED"

      - name: occ_version_increments_on_every_order_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Order.fields.version, state_machines.Order.DRAFT_to_CONFIRMED]
        distinguishing_aspect: "Order.version starts at 1 on create and increments by exactly 1 on each mutation: after confirm it is 2 (no cascade self-bump beyond the single confirm increment when only deposit/staffing side-effects fire)."
        test_recipe:
          setup: ["A draft order (version 1)."]
          setup_api_calls:
            - call: "POST /catering/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CateringAdmin
            - call: "POST /catering/packages"
              payload: { name: "Gala", per_head_cents: 5000, min_headcount: 1, lead_time_hours: 24 }
              as: CateringAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /catering/venues"
              payload: { name: "Hall", tax_rate_bps: 875, service_fee_bps: 2000, max_overlapping_events: 5 }
              as: CateringAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /catering/clients"
              payload: { company_name: "Acme", billing_email: "a@x.com" }
              as: CateringAdmin
              captures: { cli_id: $.data.id }
            - call: "POST /catering/orders"
              payload: { client_id: "${cli_id}", package_id: "${pkg_id}", venue_id: "${venue_id}", booked_headcount: 80, event_start: "2026-09-01T17:00:00Z", event_end: "2026-09-01T22:00:00Z" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
          trigger:
            - call: "POST /catering/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: SalesCoordinator
              captures: { ord_v2: $.data.version }
          assert:
            - "Order.${ord_id}.version == 2"

      - name: confirm_cascade_three_level_excluded_stub
        claim_type: cascading_side_effects
        grounds: [state_machines.Order.CONFIRMED_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_order_cascades_to_legs_then_route_posture
          rationale: "Multi-level cascade ordering and end-to-end verification handled by the named §1.8 transitive_cascade instance."

