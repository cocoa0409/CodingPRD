            - { call: "POST /hotline/cases/${case}/notes", payload: { body: "late note", is_confidential: false, expected_case_version: "${case_v}" }, as: Counselor, as_user_id: "${wk}", captures: { err: $.data.error_id } }
          assert:
            - "412 with error_id == ERR_STALE_VERSION — the captured version ${case_v} is stale after RESOLVED/CLOSED transitions, and OCC fires before the CLOSED state check"

