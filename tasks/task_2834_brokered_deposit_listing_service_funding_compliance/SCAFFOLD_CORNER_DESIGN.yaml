            - "Institution.${inst_id}.reciprocal_deposits_cents == 7000000000 and total_deposits_cents == 37000000000"
            - "trigger: HTTP 422 with ${e1} == ERR_RECIPROCAL_CAP_EXCEEDED - remaining capacity is 7500000000 - 7000000000 == 500000000, below the 1000000000 requested"
            - "the ladder rule is NOT the cause: the +/-15 day window cap is floor(37000000000 * 3500 / 10000) == 12950000000 and reciprocal neighbours are outside the class filter anyway"
