            - "a re-booking of the identical slot after the abort is accepted, proving the released capacity is genuinely available again"

      - name: nonconformity_reopen_restores_the_application_finding_ledger_exactly
        conserved_quantity: "AccreditationApplication.nc_blocking_open_count + nc_closed_count == nc_total_count - nc_observation_count"
        grounds:
          - state_machines.Nonconformity.CLOSED_to_OPEN
          - state_machines.AccreditationApplication.DECISION_PENDING_to_NC_OPEN
          - state_machines.DecisionRecord.VOTING_to_DEFERRED
          - entities.AccreditationApplication.fields.nc_closed_count
        distinguishing_aspect: |
          A different conserved quantity on a different entity: the application's four-way finding
          ledger rather than an assessor's day ledger. Closing the only blocking finding moves the
          split from 1/0 to 0/1 and reopening must move it back to 1/0 with nc_total_count untouched,
          while the compensation also has to walk back the two derived consequences of the close -
          the application returns from DECISION_PENDING to NC_OPEN with decision_round incremented and
          the VOTING DecisionRecord is DEFERRED with its votes preserved as an audit record.
        test_recipe:
          setup:
            - "Clock 2026-08-10; one PUBLISHED scheme (witness_min_count 2, critical_nc_close_days 30)."
            - "A GRANTED and screened LEAD_ASSESSOR and a GRANTED and screened TECHNICAL_ASSESSOR, both CONFIRMED on the cycle."
            - "One organization with an INITIAL cycle over 3 requested scope lines, an APPROVED plan and two COMPLETED witness sessions covering 5 assessor days."
            - "Clock moved to 2026-09-15; a single CRITICAL finding raised, the assessment closed, the corrective action submitted and ACCEPTed by the lead assessor, and its effectiveness verified PASS by the technical assessor, so the finding is CLOSED, the application is DECISION_PENDING and a VOTING DecisionRecord exists for round 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SchemeManager
            - call: "POST /accreditation/schemes"
              payload: { program_code: "ISO17025-REO", name: "Calibration laboratories", standard_ref: "ISO_IEC_17025", complexity_multiplier: 1.0725, witness_min_count: 2, qualification_points_required: 60.0, surveillance_interval_days: 365, reassessment_interval_days: 1460, critical_nc_close_days: 30, major_nc_close_days: 60, minor_nc_close_days: 90, unannounced_authority: true, remote_assessment_allowed: true }
              as: SchemeManager
              captures: { scheme_id: $.data.id }
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "UNDER_REVIEW" }
              as: SchemeManager
            - call: "POST /accreditation/schemes/${scheme_id}/status"
              payload: { to_status: "PUBLISHED" }
              as: SchemeManager
            - call: "POST /accreditation/assessors"
              payload: { full_name: "Lena Ahlgren", email: "lena.ahlgren@ab.test", employment_type: "INTERNAL", annual_witness_capacity_days: 20 }
              as: AssessmentManager
              captures: { lead_id: $.data.id }
            - call: "POST /accreditation/assessors/${lead_id}/qualifications"
              payload: { scheme_id: "${scheme_id}", role_type: "LEAD_ASSESSOR", years_experience: 8, declared_witness_days: 6, declared_training_modules: 3, last_witness_on: "2026-05-10" }
              as: AssessmentManager
              captures: { lead_q_id: $.data.id }
            - call: "POST /accreditation/qualifications/${lead_q_id}/verify-evidence"
              payload: { verified_years_experience: 8, verified_witness_days: 5, verified_training_modules: 2 }
              as: SchemeManager
            - call: "POST /accreditation/assessors/${lead_id}/screen"
              payload: {}
              as: SchemeManager
            - call: "POST /accreditation/assessors"
              payload: { full_name: "Bruno Katz", email: "bruno.katz@ab.test", employment_type: "CONTRACT", annual_witness_capacity_days: 20 }
              as: AssessmentManager
              captures: { tech_id: $.data.id }
            - call: "POST /accreditation/assessors/${tech_id}/qualifications"
              payload: { scheme_id: "${scheme_id}", role_type: "TECHNICAL_ASSESSOR", years_experience: 6, declared_witness_days: 4, declared_training_modules: 1, last_witness_on: "2026-06-01" }
              as: AssessmentManager
              captures: { tech_q_id: $.data.id }
            - call: "POST /accreditation/qualifications/${tech_q_id}/verify-evidence"
              payload: { verified_years_experience: 6, verified_witness_days: 4, verified_training_modules: 1 }
              as: SchemeManager
            - call: "POST /accreditation/assessors/${tech_id}/screen"
              payload: {}
              as: SchemeManager
            - call: "POST /accreditation/organizations"
              payload: { legal_name: "Acme Calibration GmbH", country_code: "DE", contact_email: "qa@acme.test" }
              as: AssessmentManager
              captures: { org_id: $.data.id }
            - call: "POST /accreditation/applications"
              payload: { organization_id: "${org_id}", scheme_id: "${scheme_id}", cycle_type: "INITIAL", requested_scope_lines: ["Mass 1kg-20kg", "Temperature -20C-200C", "Pressure 0-10MPa"], notice_days: 30 }
              as: AssessmentManager
              captures: { app_id: $.data.id }
            - call: "POST /accreditation/applications/${app_id}/team-assignments"
              payload: { assessor_id: "${lead_id}", role_type: "LEAD_ASSESSOR" }
              as: AssessmentManager
              captures: { ta_lead_id: $.data.id }
            - call: "POST /accreditation/team-assignments/${ta_lead_id}/confirm"
              payload: {}
              as: AssessmentManager
            - call: "POST /accreditation/applications/${app_id}/team-assignments"
              payload: { assessor_id: "${tech_id}", role_type: "TECHNICAL_ASSESSOR" }
              as: AssessmentManager
              captures: { ta_tech_id: $.data.id }
            - call: "POST /accreditation/team-assignments/${ta_tech_id}/confirm"
              payload: {}
              as: AssessmentManager
            - call: "GET /accreditation/applications/${app_id}"
              payload: {}
              as: AssessmentManager
              captures: { app_v: $.data.version }
            - call: "POST /accreditation/applications/${app_id}/assessment-plans"
              payload: { expected_application_version: "${app_v}", mode: "MIXED", planned_start: "2026-09-07", planned_end: "2026-09-18", on_site_days: 3, remote_days: 2 }
              as: AssessmentManager
              captures: { plan_id: $.data.id }
            - call: "POST /accreditation/assessment-plans/${plan_id}/approve"
              payload: {}
              as: AssessmentManager
            - call: "POST /accreditation/assessment-plans/${plan_id}/witness-sessions"
              payload: { assessor_id: "${lead_id}", activity_type: "CALIBRATION", site_ref: "ACME-LAB-1", delivery_mode: "ON_SITE", starts_at: "2026-09-07T08:00:00Z", ends_at: "2026-09-08T16:00:00Z" }
              as: AssessmentManager
              captures: { ws1_id: $.data.id }
            - call: "POST /accreditation/witness-sessions/${ws1_id}/outcome"
              payload: { result_status: "COMPLETED", outcome: "SATISFACTORY", evidence_note: "Mass and temperature calibrations witnessed." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /accreditation/assessment-plans/${plan_id}/witness-sessions"
              payload: { assessor_id: "${tech_id}", activity_type: "CALIBRATION", site_ref: "ACME-LAB-1", delivery_mode: "ON_SITE", starts_at: "2026-09-09T08:00:00Z", ends_at: "2026-09-09T16:00:00Z" }
              as: AssessmentManager
              captures: { ws2_id: $.data.id }
            - call: "POST /accreditation/witness-sessions/${ws2_id}/outcome"
              payload: { result_status: "COMPLETED", outcome: "SATISFACTORY", evidence_note: "Pressure calibration witnessed." }
              as: TechnicalExpert
              as_user_id: "${tech_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: AssessmentManager
            - call: "POST /accreditation/applications/${app_id}/nonconformities"
              payload: { clause_ref: "7.2.1", classification: "CRITICAL", statement: "Uncertainty budget omits the reference standard drift term." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { nc_id: $.data.id }
            - call: "POST /accreditation/applications/${app_id}/close-assessment"
              payload: {}
              as: AssessmentManager
            - call: "GET /accreditation/nonconformities/${nc_id}"
              payload: {}
              as: AssessmentManager
              captures: { nc_v1: $.data.version }
            - call: "POST /accreditation/nonconformities/${nc_id}/responses"
              payload: { expected_nonconformity_version: "${nc_v1}", root_cause: "Template predates the 2025 reference standard change.", action_plan: "Rebuild the template and re-issue 42 affected certificates." }
              as: ApplicantContact
              as_user_id: "${org_id}"
            - call: "POST /accreditation/nonconformities/${nc_id}/review"
              payload: { outcome: "ACCEPT", review_note: "Root cause and plan address the systemic gap." }
              as: LeadAssessor
              as_user_id: "${lead_id}"
            - call: "POST /accreditation/nonconformities/${nc_id}/verify-effectiveness"
              payload: { outcome: "PASS", verified_evidence_count: 3 }
              as: TechnicalExpert
              as_user_id: "${tech_id}"
            - call: "GET /accreditation/decisions"
              payload: { application_id: "${app_id}", status: "VOTING" }
              as: AssessmentManager
              captures: { dec_id: "$.data[0].id" }
          trigger:
            - call: "POST /accreditation/nonconformities/${nc_id}/reopen"
              payload: { reason: "Re-issued certificates still carry the old uncertainty budget." }
              as: AssessmentManager
          assert:
            - "before the trigger the ledger read nc_blocking_open_count 0, nc_closed_count 1, nc_total_count 1, nc_observation_count 0, so 0 + 1 == 1 - 0"
            - "Nonconformity.${nc_id}.status == OPEN, reopen_count == 1, closed_on is null, effectiveness_outcome is null and review_note == 'Re-issued certificates still carry the old uncertainty budget.'"
            - "Nonconformity.${nc_id}.verified_evidence_count and verified_by_assessor_id are preserved as the audit trail of the failed closure"
            - "AccreditationApplication.${app_id}.nc_blocking_open_count == 1 and nc_closed_count == 0"
            - "AccreditationApplication.${app_id}.nc_total_count == 1 and nc_observation_count == 0 - the totals are untouched by the compensation"
            - "1 + 0 == 1 - 0, so the ledger invariant holds after the reopen exactly as it did before the close"
            - "AccreditationApplication.${app_id}.status == NC_OPEN and decision_round == 2"
            - "DecisionRecord.${dec_id}.status == DEFERRED with its votes list preserved and vote_count unchanged at 0"
            - "GET /accreditation/decisions?application_id=${app_id} returns total_count 1 - no fresh DecisionRecord is created until the blocking count returns to zero"
            - "AccreditationScope rows for ${app_id} remain absent - the deferral does not grant anything"
