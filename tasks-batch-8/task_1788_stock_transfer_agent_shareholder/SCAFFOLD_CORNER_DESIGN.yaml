          rationale: "The open-ended stop-occupancy rejection of a second report-lost is asserted by the named §1.8 instance."

      - name: legend_create_wrong_account_priority
        claim_type: priority_ordering
        grounds: ["validations[priority=9]", "validations[priority=10]"]
        excluded_because:
          difficulty_instance: legend_referential_beats_fiscal
          rationale: "The referential-beats-fiscal priority conflict on legend create is asserted by the named §1.8 instance."

