            - "benefit_audit_status == CORRECTED and data_confidence_score == 100 with data_status == CLEAN"
            - "GET /prt/participants/${p1_id}/benefit-audits is ordered audit_sequence ASC and shows the first audit as SUPERSEDED — create-with-supersede ran before the new audit"

      - name: rejected_transfer_leaves_the_tranche_locked_and_a_later_transfer_supersedes
        claim_type: cross_entity
        grounds:
          - state_machines.AssetTransfer
          - state_machines.BuyoutTranche.PRICING_LOCKED_to_ASSETS_TRANSFERRED
          - errors.ERR_TRANSFER_NOT_INITIATED
        distinguishing_aspect: |
          Funding is retryable and only acceptance may touch the tranche: an in-kind
          delivery rejected by the carrier leaves the tranche in PRICING_LOCKED with
          transfer_expense_cents still null, a fresh cash delivery is superseded by a
          second one without disturbing the tranche's state, and only the accepted
          transfer flips the tranche to ASSETS_TRANSFERRED and publishes the 9600-cent
          wire expense. Re-reviewing the already-rejected transfer must fail on the
          transfer's own state.
        test_recipe:
          setup:
