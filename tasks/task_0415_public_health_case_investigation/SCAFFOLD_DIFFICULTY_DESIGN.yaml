# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Public Health Case Investigation & Contact Tracing — EXPERT
# 9 rule_ids x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: infectious_window_symptom_vs_specimen_on_case
        grounds:
          - calculations.infectious_period_window
          - entities.Case.fields.infectious_start_date
          - entities.Case.fields.infectious_end_date
          - state_machines.Case.OPEN_to_UNDER_INVESTIGATION
        distinguishing_aspect: |
          Same calendar anchor date (2026-03-10 onset / 2026-03-12 specimen) but the
          symptom-based variant anchors on symptom_onset_date and the specimen-based
          variant on specimen_collection_date, producing different infectious windows on
          the Case entity domain.
        test_recipe:
          setup:
            - "Program P with COVID19 condition (presymptomatic_days=2, infectious_tail_days=10)."
            - "Jurisdiction J1 in P."
            - "Symptomatic case CS opened with symptom_onset_date 2026-03-10, is_symptomatic true; interviewed."
            - "Asymptomatic case CA opened with specimen_collection_date 2026-03-12, is_symptomatic false; interviewed."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-S", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { cs: $.data.id }
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-A", specimen_collection_date: "2026-03-12T00:00:00.000Z", is_symptomatic: false }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ca: $.data.id }
            - call: "POST /surveillance/cases/${cs}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/cases/${ca}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
          trigger:
            - call: "GET /surveillance/cases/${cs}"
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "GET /surveillance/cases/${ca}"
              as: CaseInvestigator
              as_user_id: "${j1}"
          assert:
            - "Case.${cs}.infectious_start_date == 2026-03-08T00:00:00.000Z"
            - "Case.${cs}.infectious_end_date == 2026-03-20T00:00:00.000Z"
            - "Case.${ca}.infectious_start_date == 2026-03-10T00:00:00.000Z"
            - "Case.${ca}.infectious_end_date == 2026-03-22T00:00:00.000Z"

      - name: quarantine_end_standard_vs_test_based_on_contact
        grounds:
          - calculations.quarantine_end_date
          - entities.Contact.fields.quarantine_end_date
          - entities.Contact.fields.quarantine_release_basis
          - entities.Contact.fields.has_qualifying_negative_test
        distinguishing_aspect: |
          Two contacts with identical last_exposure_date 2026-03-15: the STANDARD variant
          yields end 2026-03-29 (last_exposure + quarantine_days 14), the TEST_BASED variant
          yields 2026-03-22 (last_exposure + test_based_release_days 7) after a qualifying
          negative test — dual-variant logic on the Contact entity domain, distinct from
          the Case-domain infectious window.
        test_recipe:
          setup:
            - "Program P, condition COVID19 (quarantine_days=14, test_based_release_days=7, test_release_earliest_offset_days=5), jurisdiction J1."
            - "Index case CI opened + interviewed."
            - "Contact KSTD (standard) and contact KTST (test-based) elicited with last_exposure_date 2026-03-15."
            - "KTST records a NEGATIVE qualifying test with specimen 2026-03-20 (== last_exposure + 5)."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, test_release_earliest_offset_days: 5, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-I", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ci: $.data.id }
            - call: "POST /surveillance/cases/${ci}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${ci}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-STD", exposure_setting: "HOUSEHOLD", proximity_meters: 0.5, cumulative_exposure_minutes: 30, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { kstd: $.data.id }
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${ci}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-TST", exposure_setting: "HOUSEHOLD", proximity_meters: 0.5, cumulative_exposure_minutes: 30, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { ktst: $.data.id }
            - call: "POST /surveillance/contacts/${ktst}/qualifying-test"
              payload: { result_value: "NEGATIVE", specimen_collection_date: "2026-03-20T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
          trigger:
            - call: "GET /surveillance/contacts/${kstd}"
              as: ContactTracer
              as_user_id: "${j1}"
            - call: "GET /surveillance/contacts/${ktst}"
              as: ContactTracer
              as_user_id: "${j1}"
          assert:
            - "Contact.${kstd}.quarantine_release_basis == STANDARD"
            - "Contact.${kstd}.quarantine_end_date == 2026-03-29T00:00:00.000Z"
            - "Contact.${ktst}.quarantine_release_basis == TEST_BASED"
            - "Contact.${ktst}.quarantine_end_date == 2026-03-22T00:00:00.000Z"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: contact_priority_score_multifactor_clamp_mode_a
        grounds:
          - calculations.contact_priority_score
          - entities.Contact.fields.priority_score
          - entities.Contact.fields.priority_band
        distinguishing_aspect: |
          Mode (a): four inputs (exposure_setting base, proximity tier, duration tier,
          vulnerability) combine through nested conditional branches and a min/max clamp;
          HOUSEHOLD(50)+near(20)+long(15)+high-risk(20)=105 clamps to 100, a non-linear
          interaction distinct from the precedence-ordered mode-(c) isolation instance.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1, index case CI interviewed."
            - "Contact KMAX elicited HOUSEHOLD, proximity 0.5m, 30 minutes, high-risk -> raw 105 clamps to 100."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-I", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ci: $.data.id }
            - call: "POST /surveillance/cases/${ci}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
          trigger:
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${ci}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-MAX", exposure_setting: "HOUSEHOLD", proximity_meters: 0.5, cumulative_exposure_minutes: 30, is_high_risk_contact: true, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { kmax: $.data.id }
          assert:
            - "Contact.${kmax}.priority_score == 100"
            - "Contact.${kmax}.priority_band == HIGH"

      - name: isolation_end_max_precedence_mode_c
        grounds:
          - calculations.isolation_end_date
          - entities.Case.fields.isolation_end_date
          - state_machines.Case.UNDER_INVESTIGATION_to_CLASSIFIED
        distinguishing_aspect: |
          Mode (c): isolation_end_date is the later of two independently computed candidate
          dates (min_end = onset+isolation_min_days, symptom_end = last_symptomatic+fever_free_days);
          the evaluation order is pinned as compute-both-then-max so the value is well-defined.
          With onset 2026-03-10 (min_end 2026-03-15) and last_symptomatic 2026-03-18
          (symptom_end 2026-03-19) the max precedence selects 2026-03-19, a different
          combinatorial mode than the mode-(a) priority score.
        test_recipe:
          setup:
            - "Program P, condition COVID19 (isolation_min_days=5, fever_free_days=1), jurisdiction J1."
            - "Case CX opened symptomatic onset 2026-03-10, last_symptomatic_date 2026-03-18; interviewed; one POSITIVE lab linked; classified CONFIRMED."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1, requires_lab_confirmation: true }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-X", symptom_onset_date: "2026-03-10T00:00:00.000Z", last_symptomatic_date: "2026-03-18T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { cx: $.data.id }
            - call: "POST /surveillance/cases/${cx}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/lab-results"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-X", result_value: "POSITIVE", specimen_collection_date: "2026-03-11T00:00:00.000Z" }
              as: IntakeProcessor
              as_user_id: "${j1}"
              captures: { lab: $.data.id }
            - call: "POST /surveillance/cases/${cx}/link-lab-result"
              payload: { lab_result_id: "${lab}" }
              as: CaseInvestigator
              as_user_id: "${j1}"
          trigger:
            - call: "POST /surveillance/cases/${cx}/classify"
              payload: { classification: "CONFIRMED" }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { cls: $.data.classification }
          assert:
            - "Case.${cx}.classification == CONFIRMED"
            - "Case.${cx}.isolation_end_date == 2026-03-19T00:00:00.000Z"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: case_cyclic_reopen_loop
        grounds:
          - state_machines.Case.CLOSED_to_REOPENED
          - state_machines.Case.REOPENED_to_UNDER_INVESTIGATION
          - entities.Case.fields.interview_completed
          - entities.Case.fields.classification
        distinguishing_aspect: |
          Cyclic shape on the Case entity: CLASSIFIED -> CLOSED -> REOPENED ->
          (re-interview) UNDER_INVESTIGATION returns the case to a non-terminal state with
          classification reset to SUSPECT and interview_completed cleared then re-set,
          a cycle distinct from the Contact machine's notification loop.
        test_recipe:
          setup:
            - "Program P, condition COVID19 (requires_lab_confirmation false), jurisdiction J1."
            - "Case CC opened symptomatic onset 2026-03-10, interviewed, classified PROBABLE, closed."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1, requires_lab_confirmation: false }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-C", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { cc: $.data.id }
            - call: "POST /surveillance/cases/${cc}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/cases/${cc}/classify"
              payload: { classification: "PROBABLE" }
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/cases/${cc}/close"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
          trigger:
            - call: "POST /surveillance/cases/${cc}/reopen"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/cases/${cc}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
          assert:
            - "Case.${cc}.status == UNDER_INVESTIGATION"
            - "Case.${cc}.classification == SUSPECT"
            - "Case.${cc}.interview_completed == true"

      - name: contact_notification_failed_retry_loop
        grounds:
          - state_machines.Contact.NOTIFICATION_PENDING_to_NOTIFICATION_FAILED
          - state_machines.Contact.NOTIFICATION_FAILED_to_NOTIFICATION_PENDING
          - entities.Contact.fields.notification_attempts
        distinguishing_aspect: |
          Cyclic shape on the Contact entity (different entity from the Case loop):
          NOTIFICATION_PENDING -> (FAILED) NOTIFICATION_FAILED -> (queue) NOTIFICATION_PENDING
          -> (SUCCESS) NOTIFIED, with notification_attempts incrementing each record step to 2.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1, index case CI interviewed."
            - "Contact KN elicited then queued."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-I", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ci: $.data.id }
            - call: "POST /surveillance/cases/${ci}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${ci}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-N", exposure_setting: "WORKPLACE", proximity_meters: 1.5, cumulative_exposure_minutes: 10, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { kn: $.data.id }
            - call: "POST /surveillance/contacts/${kn}/queue-notification"
              payload: {}
              as: ContactTracer
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts/${kn}/record-notification"
              payload: { outcome: "FAILED" }
              as: ContactTracer
              as_user_id: "${j1}"
          trigger:
            - call: "POST /surveillance/contacts/${kn}/queue-notification"
              payload: {}
              as: ContactTracer
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts/${kn}/record-notification"
              payload: { outcome: "SUCCESS" }
              as: ContactTracer
              as_user_id: "${j1}"
          assert:
            - "Contact.${kn}.status == NOTIFIED"
            - "Contact.${kn}.notification_attempts == 2"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: not_a_case_classify_voids_contacts_releases_monitoring_depth3
        grounds:
          - state_machines.Case.UNDER_INVESTIGATION_to_CLASSIFIED
          - state_machines.Contact.MONITORING_ACTIVE_to_VOIDED
          - state_machines.MonitoringPeriod.ACTIVE_to_RELEASED_EARLY
          - entities.Jurisdiction.fields.active_monitoring_count
          - entities.Case.fields.contact_count
        distinguishing_aspect: |
          Depth-3 cascade triggered by classify NOT_A_CASE: classify (A) -> Contact VOIDED (B,
          caused by A) -> that contact's ACTIVE MonitoringPeriod RELEASED_EARLY + jurisdiction
          active_monitoring_count decremented from 1 to 0 (C, caused by B). Originates from the
          classify transition, distinct from the transfer-accept cascade.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1; clock at 2026-03-01."
            - "Index case CI opened symptomatic onset 2026-03-10, interviewed."
            - "Contact KM elicited, queued, notified, monitoring scheduled and started -> MONITORING_ACTIVE; J1.active_monitoring_count == 1; CI.contact_count == 1."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-I", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ci: $.data.id }
            - call: "POST /surveillance/cases/${ci}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${ci}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-M", exposure_setting: "HOUSEHOLD", proximity_meters: 0.5, cumulative_exposure_minutes: 30, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { km: $.data.id }
            - call: "POST /surveillance/contacts/${km}/queue-notification"
              payload: {}
              as: ContactTracer
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts/${km}/record-notification"
              payload: { outcome: "SUCCESS" }
              as: ContactTracer
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts/${km}/monitoring-periods"
              payload: { monitoring_type: "QUARANTINE", start_date: "2026-03-16T00:00:00.000Z", end_date: "2026-03-29T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { mp: $.data.id }
            - call: "POST /surveillance/contacts/${km}/start-monitoring"
              payload: {}
              as: ContactTracer
              as_user_id: "${j1}"
          trigger:
            - call: "POST /surveillance/cases/${ci}/classify"
              payload: { classification: "NOT_A_CASE" }
              as: CaseInvestigator
              as_user_id: "${j1}"
          assert:
            - "Case.${ci}.classification == NOT_A_CASE"
            - "Contact.${km}.status == VOIDED"
            - "MonitoringPeriod.${mp}.status == RELEASED_EARLY"
            - "Jurisdiction.${j1}.active_monitoring_count == 0"
            - "Case.${ci}.contact_count == 0"

      - name: transfer_accept_rehomes_case_and_monitoring_depth3
        grounds:
          - state_machines.JurisdictionTransfer.REQUESTED_to_ACCEPTED
          - state_machines.Case.TRANSFER_PENDING_to_UNDER_INVESTIGATION
          - entities.Case.fields.jurisdiction_id
          - entities.Contact.fields.monitoring_jurisdiction_id
          - entities.Jurisdiction.fields.active_monitoring_count
        distinguishing_aspect: |
          Depth-3 cascade triggered by transfer accept (different trigger from the NOT_A_CASE
          classify): accept (A) -> Case.jurisdiction_id rehomed J1->J2 (B, caused by A) ->
          the case's monitoring Contact reassigned to J2 with its MONITORING_ACTIVE count
          moved from J1 (1->0) to J2 (0->1) (C, caused by B).
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdictions J1 and J2."
            - "Case CT in J1 opened+interviewed (UNDER_INVESTIGATION)."
            - "Contact KT in J1 elicited, notified, monitoring scheduled+started (MONITORING_ACTIVE); J1.active_monitoring_count == 1, J2 == 0."
