      - name: pagination_parameters_outside_their_declared_bounds_are_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=21]
          - errors[ERR_PAGINATION_INVALID]
          - complexity_profile.pagination
        distinguishing_aspect: |
          The pagination contract is limit 1..100 and offset ≥ 0, so limit 0, limit 101 and offset
          -1 are each refused with ERR_PAGINATION_INVALID while the boundary values limit 1, limit
          100 and offset 0 all succeed — the rejection is on the parameter, not on the page being
          empty.
        test_recipe:
          setup:
            - "One statute profile and one municipality, so the list endpoint has exactly one row to page over."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_x2: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_x2}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_x2: $.data.id }
          trigger:
            - call: "GET /municipalities?limit=0"
              payload: {}
              as: StateLawAdmin
              as_user_id: "sla-01"
            - call: "GET /municipalities?limit=101"
              payload: {}
              as: StateLawAdmin
              as_user_id: "sla-01"
            - call: "GET /municipalities?offset=-1"
              payload: {}
              as: StateLawAdmin
              as_user_id: "sla-01"
            - call: "GET /municipalities?limit=1&offset=0"
              payload: {}
              as: StateLawAdmin
              as_user_id: "sla-01"
            - call: "GET /municipalities?limit=100"
              payload: {}
              as: StateLawAdmin
              as_user_id: "sla-01"
          assert:
            - "GET /municipalities?limit=0 returns ERR_PAGINATION_INVALID with status 400"
            - "GET /municipalities?limit=101 returns ERR_PAGINATION_INVALID with status 400"
            - "GET /municipalities?offset=-1 returns ERR_PAGINATION_INVALID with status 400"
            - "GET /municipalities?limit=1&offset=0 returns status 200 with total_count == 1, one item and has_more == false"
            - "GET /municipalities?limit=100 returns status 200 with total_count == 1"
            - "GET /municipalities?limit=1&offset=1 returns status 200 with total_count == 1, zero items and has_more == false"

      - name: a_consent_signed_after_the_circulation_deadline_is_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=60]
          - errors[ERR_PETITION_WINDOW_CLOSED]
        distinguishing_aspect: |
          The circulation window closes on the clock, not on a status change: with the petition
          still sitting in CIRCULATING because nobody has certified it, a signature five days past
          circulation_deadline_at is refused with ERR_PETITION_WINDOW_CLOSED — the distinct code
          from ERR_PETITION_EXPIRED, which only applies once the petition has actually been marked
          EXPIRED. A signature one second before the deadline is accepted.
        test_recipe:
          setup:
            - "A CIRCULATING 30-day petition opened at the 2026-08-01T00:00:00Z clock default on a certified two-parcel territory, so circulation_deadline_at is 2026-08-31T00:00:00Z."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["PETITION_MAJORITY"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_x3: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_x3}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_x3: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_x3a: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ben Olsen", contact_email: "ben@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_x3b: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_x3}", method: "PETITION_MAJORITY", shared_boundary_feet: 20000, total_lot_count: 2, developed_lot_count: 2, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_x3}"
              captures: { case_x3: $.data.id }
            - call: "POST /annexation-cases/${case_x3}/parcels"
              payload: { primary_owner_id: "${ow_x3a}", parcel_apn: "X3-1", assessed_value_cents: 50000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_x3}"
              captures: { parcel_x3a: $.data.id }
            - call: "POST /annexation-cases/${case_x3}/parcels"
              payload: { primary_owner_id: "${ow_x3b}", parcel_apn: "X3-2", assessed_value_cents: 50000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_x3}"
              captures: { parcel_x3b: $.data.id }
            - call: "POST /annexation-cases/${case_x3}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_x3}"
            - call: "POST /petitions"
              payload: { annexation_case_id: "${case_x3}", petition_type: "OWNER_MAJORITY", circulation_days: 30 }
              as: MunicipalPlanner
              as_user_id: "${muni_x3}"
              captures: { pet_x3: $.data.id, x3_deadline: $.data.circulation_deadline_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T23:59:59Z" }
              as: StateLawAdmin
              as_user_id: "sla-01"
            - call: "POST /parcel-owner-consents"
              payload: { petition_id: "${pet_x3}", parcel_id: "${parcel_x3a}", property_owner_id: "${ow_x3a}", ownership_share_pct: 100.00 }
              as: PropertyOwner
              as_user_id: "${ow_x3a}"
              captures: { cons_x3: $.data.id, x3_signed_at: $.data.signed_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T09:00:00Z" }
              as: StateLawAdmin
              as_user_id: "sla-01"
            - call: "POST /parcel-owner-consents"
              payload: { petition_id: "${pet_x3}", parcel_id: "${parcel_x3b}", property_owner_id: "${ow_x3b}", ownership_share_pct: 100.00 }
              as: PropertyOwner
              as_user_id: "${ow_x3b}"
              captures: { x3_e_window: $.data.error_id }
          assert:
            - "${x3_deadline} == 2026-08-31T00:00:00Z"
            - "the in-window consent returns status 201 and ${x3_signed_at} == 2026-08-30T23:59:59Z"
            - "${x3_e_window} == ERR_PETITION_WINDOW_CLOSED with status 422"
            - "Petition.${pet_x3}.sufficiency_status == CIRCULATING — the late signature did not expire the petition"
            - "Petition.${pet_x3}.qualified_signature_assessed_value_cents == 50000000"
            - "GET /parcel-owner-consents?petition_id=${pet_x3} returns total_count == 1"

  # =====================================================================================
  # SECTION 9 — Consistency model
  # =====================================================================================
  - section: consistency_model
    instances:
      - name: the_effectuate_response_already_reflects_the_whole_cutover
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /annexation-cases/{caseId}/effectuate]
          - endpoints[POST /annexation-cases/{caseId}/post-tax-roll]
        distinguishing_aspect: |
          The consistency model is immediate, so the single most side-effect-heavy call in the
          scaffold must publish everything it touched in its own response body: the effectuate
          response already carries EFFECTIVE and the stamped effective_date, and the very next
          reads of the parcel, the utility account and the plan — with no intervening write and no
          waiting — already show INCORPORATED, the inside-city rate schedule and the recomputed
          readiness. The same holds for post-tax-roll, whose response carries the transferred
          totals that the municipality ledger read back immediately afterwards agrees with.
        test_recipe:
          setup:
            - "The house chain under the default statute carried to ORDINANCE_ADOPTED at clock 2026-10-11T09:00:00Z, with one 100,000,000-cent parcel and one OUTSIDE_CITY water account on it, and a plan whose single WATER commitment requires one account."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["WATER"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_k1: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_k1}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_k1: $.data.id }
            - call: "POST /municipalities/${muni_k1}/service-providers"
              payload: { provider_name: "Cedar Grove Water", service_types: ["WATER"], concurrent_project_capacity: 1 }
              as: MunicipalPlanner
              as_user_id: "${muni_k1}"
              captures: { prov_k1: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_k1: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_k1}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_k1}"
              captures: { case_k1: $.data.id }
            - call: "POST /annexation-cases/${case_k1}/parcels"
              payload: { primary_owner_id: "${ow_k1}", parcel_apn: "K1-1", assessed_value_cents: 100000000, acreage: 5.00, is_developed: true, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_k1}"
              captures: { parcel_k1: $.data.id }
            - call: "POST /utility-accounts"
              payload: { parcel_id: "${parcel_k1}", service_provider_id: "${prov_k1}", service_type: "WATER", monthly_base_cents: 4000 }
              as: MunicipalPlanner
              as_user_id: "${muni_k1}"
              captures: { acct_k1: $.data.id }
            - call: "POST /annexation-cases/${case_k1}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_k1}"
            - call: "POST /plans-of-services"
              payload: { annexation_case_id: "${case_k1}" }
              as: MunicipalPlanner
              as_user_id: "${muni_k1}"
              captures: { plan_k1: $.data.id, plan_k1_v0: $.data.version }
            - call: "POST /service-commitments"
              payload: { plan_of_services_id: "${plan_k1}", service_provider_id: "${prov_k1}", service_type: "WATER", window_start_date: "2026-08-01", window_end_date: "2026-09-15", cost_cents: 500000, committed_account_count: 1, expected_plan_of_services_version: "${plan_k1_v0}" }
              as: MunicipalPlanner
              as_user_id: "${muni_k1}"
              captures: { cm_k1: $.data.id }
            - call: "POST /service-commitments/${cm_k1}/activate"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_k1}"
              captures: { k1_cm_status_active: $.data.commitment_status }
            - call: "POST /plans-of-services/${plan_k1}/adopt"
              payload: {}
              as: CityClerk
              as_user_id: "${muni_k1}"
            - call: "GET /annexation-cases/${case_k1}"
              payload: {}
              as: FiscalAnalyst
              as_user_id: "fa-01"
              captures: { case_k1_ver: $.data.version }
            - call: "POST /fiscal-impact-analyses"
              payload: { annexation_case_id: "${case_k1}", analysis_method: "AVERAGE_COST", projected_population: 5, expected_case_version: "${case_k1_ver}" }
              as: FiscalAnalyst
              as_user_id: "fa-01"
              captures: { an_k1: $.data.id }
            - call: "POST /fiscal-impact-analyses/${an_k1}/finalize"
              payload: {}
              as: FiscalAnalyst
              as_user_id: "fa-01"
            - call: "POST /public-hearings"
              payload: { annexation_case_id: "${case_k1}", municipality_id: "${muni_k1}", scheduled_start_at: "2026-09-10T18:00:00Z", scheduled_end_at: "2026-09-10T20:00:00Z", protest_window_days: 30 }
              as: CityClerk
              as_user_id: "${muni_k1}"
              captures: { hear_k1: $.data.id }
            - call: "POST /public-hearings/${hear_k1}/notice-publications"
              payload: { publication_type: "NEWSPAPER" }
              as: CityClerk
              as_user_id: "${muni_k1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T18:00:00Z" }
              as: StateLawAdmin
              as_user_id: "sla-01"
            - call: "POST /public-hearings/${hear_k1}/hold"
              payload: {}
              as: CityClerk
              as_user_id: "${muni_k1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-11T09:00:00Z" }
              as: StateLawAdmin
              as_user_id: "sla-01"
            - call: "POST /public-hearings/${hear_k1}/close-protest-period"
              payload: {}
              as: CityClerk
              as_user_id: "${muni_k1}"
            - call: "POST /annexation-cases/${case_k1}/adopt-ordinance"
              payload: {}
              as: CityClerk
              as_user_id: "${muni_k1}"
          trigger:
            - call: "POST /annexation-cases/${case_k1}/effectuate"
              payload: { effective_date: "2026-10-11" }
              as: MunicipalPlanner
              as_user_id: "${muni_k1}"
              captures: { k1_status: $.data.status, k1_effective_date: $.data.effective_date }
            - call: "GET /parcels/${parcel_k1}"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_k1}"
              captures: { k1_parcel_status: $.data.parcel_status }
            - call: "GET /utility-accounts/${acct_k1}"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_k1}"
              captures: { k1_acct_status: $.data.account_status, k1_acct_rate: $.data.rate_schedule }
            - call: "GET /service-commitments/${cm_k1}"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_k1}"
              captures: { k1_cm_status: $.data.commitment_status, k1_cm_activated: $.data.activated_account_count }
            - call: "GET /plans-of-services/${plan_k1}"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_k1}"
              captures: { k1_readiness: $.data.service_readiness }
            - call: "POST /annexation-cases/${case_k1}/post-tax-roll"
              payload: {}
              as: CountyAssessor
              as_user_id: "cta-01"
              captures: { k1_roll_status: $.data.tax_roll_status, k1_roll_tax: $.data.tax_roll_transferred_tax_cents, k1_roll_value: $.data.tax_roll_transferred_assessed_value_cents }
            - call: "GET /municipalities/${muni_k1}"
              payload: {}
              as: CountyAssessor
              as_user_id: "cta-01"
              captures: { k1_ledger: $.data.taxable_assessed_value_cents }
            - call: "GET /parcels/${parcel_k1}"
              payload: {}
              as: CountyAssessor
              as_user_id: "cta-01"
              captures: { k1_parcel_prorated: $.data.prorated_tax_cents, k1_parcel_annual: $.data.annual_tax_cents }
          assert:
            - "${k1_cm_status_active} == ACTIVE — committed_account_count 1 leaves it short of FULFILLED"
            - "the effectuate response itself carries ${k1_status} == EFFECTIVE and ${k1_effective_date} == 2026-10-11"
            - "${k1_parcel_status} == INCORPORATED on the very next read"
            - "${k1_acct_status} == INSIDE_CITY_ACTIVE"
            - "${k1_acct_rate} == INSIDE_CITY"
            - "${k1_cm_status} == FULFILLED"
            - "${k1_cm_activated} == 1"
            - "${k1_readiness} == READY"
            - "${k1_roll_status} == POSTED"
            - "${k1_roll_value} == 100000000"
            - "${k1_roll_tax} == 224658"
            - "${k1_ledger} == 100000000 — the ledger read after the response agrees with it"
            - "${k1_parcel_annual} == 1000000"
            - "${k1_parcel_prorated} == 224658"
            - "no re-read or delay was needed for any of the above"
