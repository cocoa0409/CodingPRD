              payload: { franchisee_id: "${fr_ms_id}" }
              as: FranchiseAdmin
            - call: "GET /franchise/territories/${ter_under_id}"
              payload: {}
              as: FranchiseAdmin
              captures: { ter_under_v: $.data.version }
            - call: "POST /franchise/territories/${ter_under_id}/award"
              payload: { expected_territory_version: "${ter_under_v}" }
