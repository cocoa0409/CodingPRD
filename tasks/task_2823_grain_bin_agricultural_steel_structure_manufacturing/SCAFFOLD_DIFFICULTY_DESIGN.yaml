# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml - Section 1.8 (Test Targeting Index)
# Task 2823 - Grain Bin & Agricultural Steel Structure Manufacturing
#
# 19 instances across the nine Difficulty Rules of SKILL.md 0.5.
# Every numeric literal in an `assert:` line was produced by executing the
# matching `calculations[].formula` from SCAFFOLD.yaml as code against the
# pinned fixture inputs; none is an estimate.
#
# Logical clock: the server starts at 2026-08-01T00:00:00Z (month 8 => OFFSEASON
# per calculations.order_season_window), so instances that do not call
# POST /_clock/set_current_utc create orders with order_season OFFSEASON.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: asd_vs_lrfd_stiffener_count_diverges_on_identical_bin_design
        grounds:
          - calculations.structural_stiffener_requirement
          - entities.DesignAnalysis.fields.allowable_kpa_m
          - entities.DesignAnalysis.fields.required_stiffener_count
          - entities.DesignAnalysis.fields.utilization_ratio
          - concurrency_rules[analysis-create-stale-design]
        distinguishing_aspect: |
          This dual-variant pair lives in the structural-engineering domain on BinDesign /
          DesignAnalysis: for byte-identical geometry, grain and loading, the ASD variant divides
          STIFFENER_NOMINAL_KPA_M by ASD_SAFETY_FACTOR (90.0 kPa-m) and demands 12 stiffeners at
          utilization 0.9955, while the LRFD variant multiplies by LRFD_RESISTANCE_FACTOR over
          LRFD_LOAD_FACTOR (101.25 kPa-m) and demands 11 at utilization 0.9653 - a strictly
          smaller count from the same governing_demand_kpa of 28.518.
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST (seal_required false, min wind 95 mph, seismic category A, permit_review_days 0)."
            - "GrainProfile CORN (721 kg/m3, Janssen k 0.42, max safe moisture 15.0 pct)."
            - "CoatingSpec G115 (zinc 350 g/m2 => corrosion_class C3, 42 cents/kg, changeover 120 min, max ambient moisture 18.0 pct)."
            - "Engineer PE-1001 licensed in NE-WEST, status ACTIVE."
            - "Dealer Alpha in NE-WEST, program_tier BASE, credit limit 900000000 cents, 2 staging slots, high-cube yard."
            - "BinDesign D1 in status DRAFT: diameter 12.0 m, eave 9.6 m, roof pitch 30 deg, wind 105 mph, moisture 14.0 pct, design_method ASD; the design's own computed fields already read circumference_m 37.699, capacity_m3 1216.25, grain_demand_kpa 28.518, required_stiffener_count 12."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
              captures: { gp_corn_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ns_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d1_id: $.data.id, d1_v: $.data.version }
          trigger:
            - call: "POST /bin-designs/${d1_id}/analyses"
              payload: { design_method: "ASD", expected_bin_design_version: "${d1_v}" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { an_asd_id: $.data.id, asd_stiff: $.data.required_stiffener_count, asd_allow: $.data.allowable_kpa_m }
            - call: "GET /bin-designs/${d1_id}"
              payload: {}
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d1_v2: $.data.version }
            - call: "POST /bin-designs/${d1_id}/analyses"
              payload: { design_method: "LRFD", expected_bin_design_version: "${d1_v2}" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { an_lrfd_id: $.data.id, lrfd_stiff: $.data.required_stiffener_count, lrfd_allow: $.data.allowable_kpa_m }
          assert:
            - "DesignAnalysis.${an_asd_id}.analysis_index == 1 and DesignAnalysis.${an_lrfd_id}.analysis_index == 2"
            - "DesignAnalysis.${an_asd_id}.allowable_kpa_m == 90.0"
            - "DesignAnalysis.${an_asd_id}.required_stiffener_count == 12"
            - "DesignAnalysis.${an_asd_id}.utilization_ratio == 0.9955"
            - "DesignAnalysis.${an_asd_id}.verdict == PASS"
            - "DesignAnalysis.${an_lrfd_id}.allowable_kpa_m == 101.25"
            - "DesignAnalysis.${an_lrfd_id}.required_stiffener_count == 11"
            - "DesignAnalysis.${an_lrfd_id}.utilization_ratio == 0.9653"
            - "DesignAnalysis.${an_lrfd_id}.verdict == PASS"
            - "DesignAnalysis.${an_asd_id}.governing_demand_kpa == 28.518 and DesignAnalysis.${an_lrfd_id}.governing_demand_kpa == 28.518"
            - "DesignAnalysis.${an_asd_id}.governing_load_case == GRAIN_LATERAL and DesignAnalysis.${an_lrfd_id}.governing_load_case == GRAIN_LATERAL"
            - "DesignAnalysis.${an_asd_id}.required_stiffener_count - DesignAnalysis.${an_lrfd_id}.required_stiffener_count == 1"
            - "BinDesign.${d1_id}.required_stiffener_count == 12 (the design row keeps its own ASD result; posting an LRFD analysis does not rewrite it)"
            - "BinDesign.${d1_id}.version == 3 (one bump per analysis create)"
            - "DesignAnalysis.${an_asd_id}.superseded == false and DesignAnalysis.${an_lrfd_id}.superseded == false"

      - name: freight_allocation_weight_vs_cube_basis_diverges_for_same_two_orders
        grounds:
          - calculations.freight_load_allocation
          - entities.FreightLoad.fields.allocation_basis
          - entities.DealerOrder.fields.allocated_freight_cents
          - concurrency_rules[freight-load-create-stale-dealer]
        distinguishing_aspect: |
          This dual-variant pair lives in the freight-cost domain on FreightLoad / DealerOrder - a
          different entity domain and a different metric from the structural pair: the same two
          kits on the same FLATBED with the same linehaul_cost_cents of 192435 split 78017 / 114418
          under the WEIGHT basis but 63881 / 128554 under the CUBE basis, because a bare
          sheet-and-stiffener kit is dense (6410.4 kg in 18.45 m3) while a drying-and-unload kit is
          bulky (9401.4 kg in 37.129 m3).
        test_recipe:
          setup:
            - "Config as in asd_vs_lrfd_stiffener_count_diverges_on_identical_bin_design: NE-WEST, CORN, G115, engineer PE-1001, Dealer Alpha (BASE tier, 2 staging slots)."
            - "BinDesign D1 (12.0 m x 9.6 m, moisture 14.0, ASD) and BinDesign D2 (12.0 m x 12.8 m, moisture 17.5, ASD, 17 stiffeners, capacity 1578.16 m3)."
            - "DealerOrder O_BASE on D1 with aeration_package NONE and unload_system GRAVITY: kit_weight_kg 6410.4, kit_cube_m3 18.45."
            - "DealerOrder O_FULL on D2 with aeration_package DRYING_FULL and unload_system POWER_SWEEP: kit_weight_kg 9401.4, kit_cube_m3 37.129."
            - "O_BASE was created before O_FULL, so the load renumbers freight_sequence 1 and 2 in that created_at order."
            - "Both orders are still production_status DRAFT with freight_load_id null; the logical clock is untouched at 2026-08-01T00:00:00Z so order_season OFFSEASON is the derived season."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
              captures: { gp_corn_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ns_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 12.8, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 17.5, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr_a_id}", bin_design_id: "${d1_id}", order_season: "OFFSEASON", aeration_package: "NONE", unload_system: "GRAVITY" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o_base_id: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr_a_id}", bin_design_id: "${d2_id}", order_season: "OFFSEASON", aeration_package: "DRYING_FULL", unload_system: "POWER_SWEEP" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o_full_id: $.data.id }
            - call: "GET /dealers/${dlr_a_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { dv1: $.data.version }
          trigger:
            - call: "POST /freight-loads"
              payload: { dealer_id: "${dlr_a_id}", trailer_type: "FLATBED", allocation_basis: "WEIGHT", yard_window_start: "2026-09-10T00:00:00Z", yard_window_end: "2026-09-12T00:00:00Z", expected_dealer_version: "${dv1}" }
              as: LogisticsCoordinator
              captures: { fl_w_id: $.data.id }
            - call: "POST /freight-loads/${fl_w_id}/assign-order"
              payload: { dealer_order_id: "${o_base_id}" }
              as: LogisticsCoordinator
            - call: "POST /freight-loads/${fl_w_id}/assign-order"
              payload: { dealer_order_id: "${o_full_id}" }
              as: LogisticsCoordinator
              captures: { lh_w: $.data.linehaul_cost_cents }
            - call: "GET /dealer-orders/${o_base_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { w_base: $.data.allocated_freight_cents }
            - call: "GET /dealer-orders/${o_full_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { w_full: $.data.allocated_freight_cents }
            - call: "POST /freight-loads/${fl_w_id}/cancel"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /dealers/${dlr_a_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { dv2: $.data.version }
            - call: "POST /freight-loads"
              payload: { dealer_id: "${dlr_a_id}", trailer_type: "FLATBED", allocation_basis: "CUBE", yard_window_start: "2026-09-10T00:00:00Z", yard_window_end: "2026-09-12T00:00:00Z", expected_dealer_version: "${dv2}" }
              as: LogisticsCoordinator
              captures: { fl_c_id: $.data.id }
            - call: "POST /freight-loads/${fl_c_id}/assign-order"
              payload: { dealer_order_id: "${o_base_id}" }
              as: LogisticsCoordinator
            - call: "POST /freight-loads/${fl_c_id}/assign-order"
              payload: { dealer_order_id: "${o_full_id}" }
              as: LogisticsCoordinator
              captures: { lh_c: $.data.linehaul_cost_cents }
          assert:
            - "DealerOrder.${o_base_id}.kit_weight_kg == 6410.4 and DealerOrder.${o_base_id}.kit_cube_m3 == 18.45"
            - "DealerOrder.${o_full_id}.kit_weight_kg == 9401.4 and DealerOrder.${o_full_id}.kit_cube_m3 == 37.129"
            - "FreightLoad.${fl_w_id}.max_cube_m3 == 62.0 and FreightLoad.${fl_w_id}.max_weight_kg == 21000"
            - "FreightLoad.${fl_w_id}.assigned_weight_kg == 15811.8 and FreightLoad.${fl_w_id}.assigned_cube_m3 == 55.579"
            - "FreightLoad.${fl_w_id}.cube_utilization_pct == 89.64"
            - "FreightLoad.${fl_w_id}.linehaul_cost_cents == 192435 and FreightLoad.${fl_w_id}.order_count == 2"
            - "under WEIGHT: DealerOrder.${o_base_id}.allocated_freight_cents == 78017 and DealerOrder.${o_full_id}.allocated_freight_cents == 114418"
            - "DealerOrder.${o_base_id}.freight_sequence == 1 and DealerOrder.${o_full_id}.freight_sequence == 2"
            - "after the cancel: FreightLoad.${fl_w_id}.status == CANCELLED, DealerOrder.${o_base_id}.freight_load_id == null, DealerOrder.${o_base_id}.freight_sequence == null, DealerOrder.${o_base_id}.allocated_freight_cents == 0"
            - "FreightLoad.${fl_c_id}.linehaul_cost_cents == 192435 - identical linehaul, so the only variable is allocation_basis"
            - "under CUBE: DealerOrder.${o_base_id}.allocated_freight_cents == 63881 and DealerOrder.${o_full_id}.allocated_freight_cents == 128554"
            - "the basis switch moves exactly 14136 cents from the bulky kit to the dense kit: 78017 - 63881 == 14136 and 128554 - 114418 == 14136"
            - "both bases conserve the linehaul exactly: 78017 + 114418 == 192435 and 63881 + 128554 == 192435"

  - rule_id: combinatorial_formula
    instances:

      - name: aeration_cfm_nested_min_max_with_moisture_and_depth_penalties
        grounds:
          - calculations.aeration_and_drying_capacity
          - entities.DealerOrder.fields.required_fan_cfm
          - entities.DealerOrder.fields.drying_hours_estimate
          - entities.KitLine.fields.quantity
          - validations[priority=13]
        distinguishing_aspect: |
          Mode (a): required_fan_cfm is a five-input non-linear product wrapped in a min and a ceil -
          capacity_m3 x aeration_cfm_per_m3_base x a package multiplier branched on aeration_package
          x a depth penalty branched on eave_height_m above DEPTH_PENALTY_FREE_M x a moisture penalty
          branched on moisture_pct above max_safe_moisture_pct - and drying_hours_estimate then
          divides by that ceiled value, so 3945.4 x 4.0 x 1.144 x 1.30 = 23470.3955 becomes exactly
          23471 CFM, 5 fan units and 7878 hours; dropping the moisture penalty alone yields 18055
          CFM and only 4 fan units.
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST (seal_required false, min wind 95, seismic A, permit 0 days)."
            - "GrainProfile CORN with max_safe_moisture_pct 15.0, aeration_cfm_per_m3_base 2.5 and drying_multiplier 4.0."
            - "CoatingSpec G115 with max_ambient_moisture_pct 18.0 so a 17.5 pct design is admissible."
            - "Dealer Alpha (BASE tier) and engineer PE-1001 as in the other instances."
            - "BinDesign D2: diameter 12.0 m, eave 12.8 m, pitch 30 deg, wind 105 mph, moisture 17.5 pct, ASD; computed capacity_m3 1578.16, required_stiffener_count 17, sheet_courses 16, sheets_per_course 35, roof_panel_count 42."
            - "Logical clock untouched at 2026-08-01T00:00:00Z, so the derived season is OFFSEASON."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
              captures: { gp_corn_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ns_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 12.8, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 17.5, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d2_id: $.data.id }
          trigger:
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr_a_id}", bin_design_id: "${d2_id}", order_season: "OFFSEASON", aeration_package: "DRYING_FULL", unload_system: "POWER_SWEEP" }
              as: DealerPrincipal
              as_user_id: "${dlr_a_id}"
              captures: { o_full_id: $.data.id, fan_cfm: $.data.required_fan_cfm, dry_hours: $.data.drying_hours_estimate }
            - call: "GET /dealer-orders/${o_full_id}/kit-lines"
              payload: {}
              as: ProductionPlanner
          assert:
            - "BinDesign.${d2_id}.capacity_m3 == 1578.16"
            - "DealerOrder.${o_full_id}.grain_mass_kg == 1137853.36"
            - "DealerOrder.${o_full_id}.required_fan_cfm == 23471"
            - "DealerOrder.${o_full_id}.drying_hours_estimate == 7878"
            - "DealerOrder.${o_full_id}.unload_rate_bph == 9000 (POWER_SWEEP is a flat constant, not a capacity-scaled rate)"
            - "KitLine for DealerOrder.${o_full_id} with component_code AERATION_FAN has quantity == 5 and extended_cents == 1425000"
            - "KitLine for DealerOrder.${o_full_id} with component_code UNLOAD_SYSTEM has quantity == 1 and extended_cents == 412000"
            - "DealerOrder.${o_full_id}.kit_subtotal_cents == 4983960"
            - "DealerOrder.${o_full_id}.kit_weight_kg == 9401.4 and DealerOrder.${o_full_id}.kit_cube_m3 == 37.129"
            - "the moisture penalty is load-bearing: omitting the 1.30 factor would give required_fan_cfm 18055 and an AERATION_FAN quantity of 4, so quantity 5 falsifies that reading"
            - "the depth penalty is load-bearing: omitting the 1.144 factor would give required_fan_cfm 20517, so 23471 falsifies that reading too"

      - name: bolt_pack_count_ceils_per_course_then_sums
        grounds:
          - calculations.kit_bill_of_materials
          - entities.KitLine.fields.quantity
          - entities.BinDesign.fields.sheets_per_course
          - entities.BinDesign.fields.sheet_courses
        distinguishing_aspect: |
          Mode (b): the scaffold pins ceil-per-course-then-multiply rather than sum-then-ceil for
          BOLT_PACK, and the two orders disagree on the same bin - ceil(35 x 18 / 250) = 3 packs per
          course x 12 courses = 36 packs, whereas ceil(420 x 18 / 250) = 31 packs; the 5-pack gap is
          10760 cents of kit_subtotal and 30.0 kg of kit_weight_kg.
        test_recipe:
          setup:
            - "Config as in the aeration instance: NE-WEST, CORN, G115 (42 cents/kg coating), engineer PE-1001, Dealer Alpha (BASE tier)."
            - "BinDesign D1: diameter 12.0 m, eave 9.6 m, pitch 30 deg, wind 105 mph, moisture 14.0 pct, ASD; computed sheet_courses 12, sheets_per_course 35, sidewall_sheet_count 420, roof_panel_count 42, required_stiffener_count 12."
            - "Logical clock untouched at 2026-08-01T00:00:00Z, so the derived season is OFFSEASON."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
              captures: { gp_corn_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /dealers"
