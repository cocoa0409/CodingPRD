          rationale: "The §1.8 boundary_precision_check instance already pins round_half_up to 4 decimals before comparison and walks 0.0299 / 0.0300 / 0.0500 / 0.0510 across the ALERT and REJECT tolerances."

      - name: releasable_unit_variants_diverge_on_the_same_batch
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: batch_provisional_vs_final_releasable_units_diverge
          rationale: "The §1.8 dual_variant_calc instance already computes both batch_releasable_units variants on one batch (8418 vs 8274) and asserts the 144-unit delta."

      - name: releasable_unit_variant_selected_by_lifecycle_position
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: batch_provisional_vs_final_releasable_units_diverge
          rationale: "The same §1.8 instance asserts that PROVISIONAL_AT_FILL is stamped at FILLING -> FILLED and FINAL_AT_QP_REVIEW only at BR_REVIEW -> QP_REVIEW, which is the variant-selection claim."

