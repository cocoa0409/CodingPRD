        test_recipe:
          setup:
            - "A reconciliation submitted, returned (version bumped to 2), re-submitted (still 2); client holds the pre-return version captured at version 1."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "P", total_rentable_sqft: 10000 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "T", contact_email: "t@x.com" }
              as: PropertyManager
              captures: { ten_id: $.data.id }
