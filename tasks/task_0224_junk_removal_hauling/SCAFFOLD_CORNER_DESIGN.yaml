              payload: { haul_job_id: "${job_a}", crew_id: "${crew_id}", truck_id: "${truck_a}", window_start_utc: "2026-06-10T09:00:00.000Z", window_end_utc: "2026-06-10T10:00:00.000Z", expected_crew_version: "${crew_v0}" }
              as: Dispatcher
              captures: { disp_a: $.data.id }
          trigger:
            - call: "POST /dispatches"
              payload: { haul_job_id: "${job_b}", crew_id: "${crew_id}", truck_id: "${truck_b}", window_start_utc: "2026-06-10T11:00:00.000Z", window_end_utc: "2026-06-10T12:00:00.000Z", expected_crew_version: "${crew_v0}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_CREW_VERSION"

      - name: occ_revise_stale_job_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[revise-stale-job]"
          - "errors[ERR_STALE_JOB_VERSION]"
          - entities.HaulJob.fields.version
        distinguishing_aspect: "Revising a SCHEDULED job with expected_job_version one less than current (a deliberately stale value) is rejected with ERR_STALE_JOB_VERSION (412)."
        test_recipe:
          setup: ["ACTIVE std_policy; a SCHEDULED job (version observed, then deliberately decremented in the trigger)."]
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { name: "std_policy", full_truck_cents: 60000, tier_breaks: [{upper_fraction: 0.25, marginal_multiplier: 1.0}, {upper_fraction: 0.5, marginal_multiplier: 0.9}, {upper_fraction: 1.0, marginal_multiplier: 0.8}], mattress_surcharge_cents: 3500, appliance_surcharge_cents: 2500, freon_surcharge_cents: 5000, dump_fee_per_ton_cents: 9000, full_truck_dump_cents: 12000, recycle_fee_per_ton_cents: 4000, diversion_credit_per_ton_cents: 1500 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "oc2@x.com", full_name: "OC2", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew OC2", shift_start_utc: "2026-06-10T08:00:00.000Z", shift_end_utc: "2026-06-10T18:00:00.000Z" }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /trucks"
              payload: { name: "TOC2" }
              as: PlatformAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /haul-jobs"
              payload: { customer_id: "${cust_id}", service_type: "SCHEDULED", address: "26 A St" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id }
            - call: "POST /haul-jobs/${job_id}/photo-estimates"
              payload: { photo_url: "http://p/oc2.jpg", raw_fraction: 0.10 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { est_id: $.data.id }
            - call: "POST /haul-jobs/${job_id}/photo-estimates/${est_id}/accept"
              payload: { }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /crews/${crew_id}"
              payload: { }
              as: Dispatcher
              captures: { crew_v: $.data.version }
            - call: "POST /dispatches"
              payload: { haul_job_id: "${job_id}", crew_id: "${crew_id}", truck_id: "${truck_id}", window_start_utc: "2026-06-10T09:00:00.000Z", window_end_utc: "2026-06-10T10:00:00.000Z", expected_crew_version: "${crew_v}" }
              as: Dispatcher
              captures: { disp_id: $.data.id }
            - call: "GET /haul-jobs/${job_id}"
              payload: { }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_v: $.data.version }
          trigger:
            - call: "POST /haul-jobs/${job_id}/revise"
              payload: { expected_job_version: "${job_v} - 1" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_JOB_VERSION"

      - name: crew_reserved_minutes_reconciliation_on_release_covered
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.crew_reserved_minutes
          - entities.Crew.fields.reserved_minutes
        excluded_because:
          difficulty_instance: compensating_invariant / crew_minutes_conserved_dispatch_then_cancel
          rationale: "Crew.reserved_minutes recompute on dispatch void is asserted by the named §1.8 invariant instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: complete_atomic_invoice_and_balance_visible_same_response_covered
        claim_type: immediate
        grounds:
          - state_machines.HaulJob.LOADED_to_COMPLETED
          - calculations.customer_outstanding_balance
