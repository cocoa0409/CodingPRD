          - calculations.remediation_month_evaluation
        distinguishing_aspect: "The month counter can only be advanced by exactly one: month_index 2 against months_elapsed 0 is 409 ERR_MONTH_INDEX_OUT_OF_SEQUENCE, month_index 1 then succeeds and lifts months_elapsed to 1, and replaying month_index 1 is refused with the same code - so neither skipping ahead nor re-evaluating a settled month is possible."
