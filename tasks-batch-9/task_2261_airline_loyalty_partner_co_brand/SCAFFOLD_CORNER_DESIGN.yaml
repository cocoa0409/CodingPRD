            - "GET /mile-transactions?member_id=${mem_id} returns total_count 0"

      - name: request_with_an_undeclared_role_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "An X-User-Role outside the seven declared roles is an authentication failure (401), not an authorization failure (403) - the request is rejected before the endpoint's role list is even consulted, and no program row is created."
        test_recipe:
          setup:
            - "Empty database; no rows of any kind."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Rogue" }
              as: AuditorGeneral
              as_user_id: "who-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "data.error_id != ERR_FORBIDDEN_ROLE"
            - "GET /loyalty-programs returns total_count 0"

      - name: submit_on_a_suspended_issuer_returns_issuer_suspended
        claim_type: error_triggerable
        grounds:
          - validations[priority=33]
          - errors.ERR_ISSUER_SUSPENDED
          - entities.CoBrandIssuer.fields.status
        distinguishing_aspect: "A ratification that lands aggregate_committed_miles exactly on the 5000000 cap (100 percent, above the 90 percent alert) suspends the issuer with CAP_BREACH, and the NEXT agreement's submit is then refused with ERR_ISSUER_SUSPENDED (409) even though that agreement is a perfectly valid DRAFT on a non-overlapping term."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN and one CoBrandIssuer with annual_mile_purchase_cap_miles 5000000."
            - "Agreement A: term 2026-09-01..2027-08-31, committed_volume_miles 5000000, RATIFIED, which suspends the issuer."
            - "Agreement B: term 2027-09-01..2028-08-31, committed_volume_miles 100000, still DRAFT."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Suspended", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /co-brand-issuers"
              payload: { program_id: "${prog_id}", name: "Northbank Card Services", annual_mile_purchase_cap_miles: 5000000 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { issuer_id: "$.data.id" }
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2026-09-01"
                term_end_date: "2027-08-31"
                committed_volume_miles: 5000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 200 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { a_id: "$.data.id" }
            - call: "POST /mile-sale-agreements/${a_id}/submit"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
            - call: "POST /mile-sale-agreements/${a_id}/ratify"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2027-09-01"
                term_end_date: "2028-08-31"
                committed_volume_miles: 100000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 200 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { b_id: "$.data.id" }
          trigger:
            - call: "POST /mile-sale-agreements/${b_id}/submit"
              payload: {}
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { err: "$.data.error_id" }
            - call: "POST /mile-sale-agreements/${a_id}/activate"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
              captures: { err2: "$.data.error_id" }
          assert:
            - "CoBrandIssuer.${issuer_id}.aggregate_committed_miles == 5000000"
            - "CoBrandIssuer.${issuer_id}.status == SUSPENDED"
            - "CoBrandIssuer.${issuer_id}.suspension_reason == CAP_BREACH"
            - "the first trigger returns HTTP 409 with data.error_id == ERR_ISSUER_SUSPENDED"
            - "MileSaleAgreement.${b_id}.status == DRAFT"
            - "MileSaleAgreement.${b_id}.negotiated_by_user_id == null"
            - "the second trigger returns HTTP 409 with data.error_id == ERR_ISSUER_SUSPENDED"
            - "MileSaleAgreement.${a_id}.status == RATIFIED"

      - name: supersede_target_still_in_draft_is_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=22]
          - errors.ERR_SUPERSEDE_TARGET_INVALID
        distinguishing_aspect: "The supersede target resolves as an FK (so ERR_AGREEMENT_NOT_FOUND does not apply) and belongs to the right issuer, but it is only DRAFT rather than RATIFIED or ACTIVE, so the create fails with ERR_SUPERSEDE_TARGET_INVALID (422) and the target's status is left untouched."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN and one ACTIVE CoBrandIssuer with annual_mile_purchase_cap_miles 5000000."
            - "Agreement A: term 2026-09-01..2027-08-31, committed_volume_miles 1000000, still DRAFT."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Supersede", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /co-brand-issuers"
              payload: { program_id: "${prog_id}", name: "Northbank Card Services", annual_mile_purchase_cap_miles: 5000000 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { issuer_id: "$.data.id" }
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2026-09-01"
                term_end_date: "2027-08-31"
                committed_volume_miles: 1000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 200 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { a_id: "$.data.id" }
          trigger:
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2027-09-01"
                term_end_date: "2028-08-31"
                committed_volume_miles: 1000000
                supersedes_agreement_id: "${a_id}"
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 200 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 422 with data.error_id == ERR_SUPERSEDE_TARGET_INVALID"
            - "MileSaleAgreement.${a_id}.status == DRAFT"
            - "GET /mile-sale-agreements?issuer_id=${issuer_id} returns total_count 1"
            - "CoBrandIssuer.${issuer_id}.aggregate_committed_miles == 0"

      - name: earn_referencing_a_campaign_on_another_channel_is_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=23]
          - errors.ERR_PROMOTION_CHANNEL_MISMATCH
          - calculations.earning_credit_with_multipliers
        distinguishing_aspect: "The campaign is LIVE and its window contains the activity_date, so nothing about state or timing is wrong - only the channel pairing (CARD_SPEND campaign against a FLIGHT_EARN row) - and the answer must be ERR_PROMOTION_CHANNEL_MISMATCH (422) with no transaction written and accrued_bonus_miles still 0."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at elite_tier BASE."
            - "One CARD_SPEND PromotionCampaign at multiplier_bps 20000 / ADDITIVE, window [2026-08-01T00:00:00Z, 2026-12-01T00:00:00Z), made LIVE by run-epoch."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Channel", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-CHAN", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /promotion-campaigns"
              payload: { program_id: "${prog_id}", code: "CARD-ONLY", earn_channel: "CARD_SPEND", multiplier_bps: 20000, stacking_mode: "ADDITIVE", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { camp_id: "$.data.id" }
            - call: "POST /_ops/run-epoch"
              payload: { program_id: "${prog_id}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "FLIGHT_EARN", activity_date: "2026-08-01", base_miles: 1000, segments: 1, promotion_id: "${camp_id}" }
              as: RevenueAccountant
              captures: { err: "$.data.error_id" }
          assert:
            - "PromotionCampaign.${camp_id}.status == LIVE"
            - "the trigger returns HTTP 422 with data.error_id == ERR_PROMOTION_CHANNEL_MISMATCH"
            - "PromotionCampaign.${camp_id}.accrued_bonus_miles == 0"
            - "MemberAccount.${mem_id}.mile_balance == 0"
            - "GET /mile-transactions?member_id=${mem_id} returns total_count 0"

      - name: ten_seats_on_one_booking_returns_seat_count_invalid
        claim_type: error_triggerable
        grounds:
          - validations[priority=26]
          - errors.ERR_SEAT_COUNT_INVALID
          - calculations.award_dynamic_pricing.constants.MAX_SEATS_PER_BOOKING
        distinguishing_aspect: "The window authorizes 20 seats, so capacity is ample and only the per-booking ceiling of 9 is broken: the answer is ERR_SEAT_COUNT_INVALID (422), not ERR_AWARD_SEATS_UNAVAILABLE and not the generic ERR_INVALID_REQUEST that the priority-7 bounds rule explicitly excludes."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at elite_tier BASE."
            - "One empty AwardInventoryWindow JFK-CDG ECONOMY 2026-09-01..2026-09-30, authorized_seats 20."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Seats", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-SEATS", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-CDG", cabin: "ECONOMY", window_start_date: "2026-09-01", window_end_date: "2026-09-30", authorized_seats: 20 }
              as: ProgramAdmin
              captures: { win_id: "$.data.id", win_v: "$.data.version" }
          trigger:
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-10", seats: 10, fare_class: "FLEX", expected_window_version: "${win_v}" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 422 with data.error_id == ERR_SEAT_COUNT_INVALID"
            - "data.error_id != ERR_INVALID_REQUEST"
            - "data.error_id != ERR_AWARD_SEATS_UNAVAILABLE"
            - "AwardInventoryWindow.${win_id}.seats_held == 0"
            - "AwardInventoryWindow.${win_id}.version == ${win_v}"

      - name: three_seats_on_a_two_seat_window_returns_award_seats_unavailable
        claim_type: error_triggerable
        grounds:
          - validations[priority=28]
          - errors.ERR_AWARD_SEATS_UNAVAILABLE
        distinguishing_aspect: "seats 3 is a legal per-booking count and the window is OPEN with load_factor_bps 0, so the only failure is capacity: ERR_AWARD_SEATS_UNAVAILABLE (409) rather than ERR_AWARD_WINDOW_CLOSED, and a follow-up 2-seat booking on the same window succeeds."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at elite_tier BASE."
            - "One empty AwardInventoryWindow JFK-CDG ECONOMY 2026-09-01..2026-09-30, authorized_seats 2."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Capacity", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-CAP", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-CDG", cabin: "ECONOMY", window_start_date: "2026-09-01", window_end_date: "2026-09-30", authorized_seats: 2 }
              as: ProgramAdmin
              captures: { win_id: "$.data.id", win_v: "$.data.version" }
          trigger:
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-10", seats: 3, fare_class: "FLEX", expected_window_version: "${win_v}" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-10", seats: 2, fare_class: "FLEX", expected_window_version: "${win_v}" }
              as: ProgramAdmin
              captures: { bk_id: "$.data.id" }
          assert:
            - "the first trigger returns HTTP 409 with data.error_id == ERR_AWARD_SEATS_UNAVAILABLE"
            - "AwardInventoryWindow.${win_id}.seats_held == 0"
            - "the second trigger returns HTTP 201"
            - "AwardBooking.${bk_id}.quoted_miles == 45000"
            - "AwardInventoryWindow.${win_id}.seats_held == 2"
            - "AwardInventoryWindow.${win_id}.load_factor_bps == 10000"
            - "AwardInventoryWindow.${win_id}.capacity_control_state == CLOSED"

      - name: ticketing_at_the_hold_expiry_instant_returns_hold_expired
        claim_type: error_triggerable
        grounds:
          - validations[priority=30]
          - errors.ERR_HOLD_EXPIRED
          - calculations.award_dynamic_pricing.constants.HOLD_HOURS
        distinguishing_aspect: "hold_expires_at is exactly 72 hours after creation and the rule demands hold_expires_at > now, so ticketing AT 2026-08-04T00:00:00Z fails with ERR_HOLD_EXPIRED (409) even though the member has ample miles; without run-epoch the booking is still HELD, so the failure comes from the validation and not from an EXPIRED status."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at elite_tier BASE with mile_balance 100000 from a single 10000000-cent card-spend earn dated 2026-07-02."
            - "One AwardInventoryWindow JFK-CDG ECONOMY 2026-09-01..2026-09-30, authorized_seats 10, holding one 1-seat FLEX booking created at 2026-08-01T00:00:00Z."
            - "Logical clock starts at its 2026-08-01T00:00:00Z default and is advanced to exactly 2026-08-04T00:00:00Z; run-epoch is deliberately NOT called."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Hold", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-HOLD", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "CARD_SPEND_EARN", activity_date: "2026-07-02", qualifying_spend_cents: 10000000 }
              as: RevenueAccountant
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-CDG", cabin: "ECONOMY", window_start_date: "2026-09-01", window_end_date: "2026-09-30", authorized_seats: 10 }
              as: ProgramAdmin
              captures: { win_id: "$.data.id", win_v: "$.data.version" }
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-10", seats: 1, fare_class: "FLEX", expected_window_version: "${win_v}" }
              as: ProgramAdmin
              captures: { bk_id: "$.data.id", expires: "$.data.hold_expires_at" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /award-bookings/${bk_id}/ticket"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "AwardBooking.${bk_id}.hold_expires_at == \"2026-08-04T00:00:00Z\""
            - "the trigger returns HTTP 409 with data.error_id == ERR_HOLD_EXPIRED"
            - "AwardBooking.${bk_id}.status == HELD"
            - "MemberAccount.${mem_id}.mile_balance == 100000"
            - "AwardInventoryWindow.${win_id}.seats_held == 1"
            - "AwardInventoryWindow.${win_id}.seats_confirmed == 0"

      - name: redeeming_one_mile_more_than_the_balance_returns_insufficient_miles
        claim_type: error_triggerable
        grounds:
          - validations[priority=31]
          - errors.ERR_INSUFFICIENT_MILES
        distinguishing_aspect: "A 1001-mile REDEEM against a 1000-mile balance is refused with ERR_INSUFFICIENT_MILES and the distinctive 402 status, while the exact-balance 1000-mile REDEEM succeeds and drives the balance to precisely 0 - so the bound is >=, not >."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at security_state NORMAL with mile_balance 1000 from a single 1000-mile partner earn."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Fiscal", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-FISC", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "PARTNER_EARN", activity_date: "2026-07-11", base_miles: 1000 }
              as: RevenueAccountant
          trigger:
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "REDEEM", activity_date: "2026-08-01", base_miles: 1001 }
              as: RevenueAccountant
              captures: { err: "$.data.error_id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "REDEEM", activity_date: "2026-08-01", base_miles: 1000 }
              as: RevenueAccountant
              captures: { ok_txn: "$.data.id" }
          assert:
            - "the first trigger returns HTTP 402 with data.error_id == ERR_INSUFFICIENT_MILES"
            - "MemberAccount.${mem_id}.mile_balance == 1000"
            - "the second trigger returns HTTP 201"
            - "MileTransaction.${ok_txn}.total_miles == -1000"
            - "MemberAccount.${mem_id}.mile_balance == 0"
            - "MemberAccount.${mem_id}.lifetime_miles == 1000"
            - "LoyaltyProgram.${prog_id}.outstanding_miles == 0"
            - "GET /mile-transactions?member_id=${mem_id} returns total_count 2"

      - name: second_posting_for_the_same_period_returns_period_already_posted
        claim_type: error_triggerable
        grounds:
          - validations[priority=36]
          - errors.ERR_PERIOD_ALREADY_POSTED
        distinguishing_aspect: "Uniqueness is on (program_id, period), so a second posting for 2026-08 fails with ERR_PERIOD_ALREADY_POSTED (409) with a correct fresh expected_program_version - proving the code is not ERR_STALE_VERSION - and the program's deferred_revenue_cents is not double-reduced."
        test_recipe:
          setup:
            - "One LoyaltyProgram driven to CLOSING with current_period 2026-08, deferred_revenue_cents 0 and one DeferredRevenuePosting already written for 2026-08."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Posted", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /loyalty-programs/${prog_id}/recognition-transitions"
              payload: { target_state: "CLOSING" }
              as: RevenueAccountant
              captures: { prog_v1: "$.data.version" }
            - call: "POST /deferred-revenue-postings"
              payload: { program_id: "${prog_id}", period: "2026-08", expected_program_version: "${prog_v1}" }
              as: RevenueAccountant
              captures: { post_id: "$.data.id" }
            - call: "GET /loyalty-programs/${prog_id}"
              payload: {}
              as: RevenueAccountant
              captures: { prog_v2: "$.data.version" }
          trigger:
            - call: "POST /deferred-revenue-postings"
              payload: { program_id: "${prog_id}", period: "2026-08", expected_program_version: "${prog_v2}" }
              as: RevenueAccountant
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 409 with data.error_id == ERR_PERIOD_ALREADY_POSTED"
            - "data.error_id != ERR_STALE_VERSION"
            - "DeferredRevenuePosting.${post_id}.breakage_rate_bps == 0"
            - "DeferredRevenuePosting.${post_id}.breakage_income_cents == 0"
            - "LoyaltyProgram.${prog_id}.deferred_revenue_cents == 0"
            - "LoyaltyProgram.${prog_id}.revenue_recognition_state == CLOSING"
            - "GET /deferred-revenue-postings?program_id=${prog_id}&period=2026-08 returns total_count 1"

      - name: touching_agreement_terms_returns_agreement_term_overlap
        claim_type: error_triggerable
        grounds:
          - validations[priority=21]
          - errors.ERR_AGREEMENT_TERM_OVERLAP
        distinguishing_aspect: "Terms are CLOSED intervals, so a second agreement starting on the very last day of a DRAFT agreement's term overlaps by exactly one day and is rejected with ERR_AGREEMENT_TERM_OVERLAP (409); starting one day later is accepted, and the blocking agreement is only DRAFT - a non-terminal status still blocks."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN and one ACTIVE CoBrandIssuer with annual_mile_purchase_cap_miles 20000000."
            - "Agreement A: term 2026-09-01..2027-08-31, committed_volume_miles 1000000, DRAFT."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Overlap", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /co-brand-issuers"
              payload: { program_id: "${prog_id}", name: "Northbank Card Services", annual_mile_purchase_cap_miles: 20000000 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { issuer_id: "$.data.id" }
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2026-09-01"
                term_end_date: "2027-08-31"
                committed_volume_miles: 1000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 200 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { a_id: "$.data.id" }
          trigger:
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2027-08-31"
                term_end_date: "2028-08-31"
                committed_volume_miles: 1000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 200 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { err: "$.data.error_id" }
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2027-09-01"
                term_end_date: "2028-08-31"
                committed_volume_miles: 1000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 200 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { b_id: "$.data.id" }
          assert:
            - "the first trigger returns HTTP 409 with data.error_id == ERR_AGREEMENT_TERM_OVERLAP"
            - "the second trigger returns HTTP 201"
            - "MileSaleAgreement.${b_id}.term_start_date == \"2027-09-01\""
            - "MileSaleAgreement.${b_id}.status == DRAFT"
            - "GET /mile-sale-agreements?issuer_id=${issuer_id} returns total_count 2"

      - name: inverted_award_window_dates_return_invalid_interval
        claim_type: error_triggerable
        grounds:
          - validations[priority=14]
          - errors.ERR_INVALID_INTERVAL
        distinguishing_aspect: "The interval ordering rule sits at priority 14, ahead of the window-in-past rule at 15 and the buffer rule at 20, so an inverted pair whose start is also in the past must answer ERR_INVALID_INTERVAL (422) - and never the priority-7 ERR_INVALID_REQUEST, which explicitly excludes interval ordering."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08, with no award inventory windows."
            - "Logical clock at its 2026-08-01T00:00:00Z default, so a 2026-07-30 start would also be in the past."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Interval", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-CDG", cabin: "ECONOMY", window_start_date: "2026-09-30", window_end_date: "2026-07-30", authorized_seats: 10 }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 422 with data.error_id == ERR_INVALID_INTERVAL"
            - "data.error_id != ERR_INVALID_REQUEST"
            - "data.error_id != ERR_WINDOW_IN_PAST"
            - "GET /award-inventory-windows?program_id=${prog_id} returns total_count 0"

      - name: grandfather_until_before_effective_at_returns_invalid_notice_schedule
        claim_type: error_triggerable
        grounds:
          - validations[priority=16]
          - errors.ERR_INVALID_NOTICE_SCHEDULE
        distinguishing_aspect: "effective_at is properly in the future, so only the second limb of the schedule rule is broken (grandfather_until earlier than effective_at): the create fails with ERR_INVALID_NOTICE_SCHEDULE (422), no notice row exists, and the program version is not consumed."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08, version 1, with no notices."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Notice Schedule", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
          trigger:
            - call: "POST /program-change-notices"
              payload: { program_id: "${prog_id}", change_type: "ELITE_THRESHOLD", effective_at: "2027-03-01T00:00:00Z", grandfather_until: "2027-02-01T00:00:00Z", expected_program_version: "${prog_v}" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 422 with data.error_id == ERR_INVALID_NOTICE_SCHEDULE"
            - "GET /program-change-notices?program_id=${prog_id} returns total_count 0"
            - "LoyaltyProgram.${prog_id}.version == ${prog_v}"

  # ===================================================================
  - section: rbac
    instances:

      - name: contracts_officer_cannot_create_an_agreement_but_partner_manager_can
        claim_type: exclusive_operations
        grounds:
          - roles.PartnerManager.exclusive_operations
          - roles.ContractsOfficer
          - validations[priority=2]
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "POST /mile-sale-agreements is exclusive to PartnerManager, so the ContractsOfficer who will later ratify the very same agreement is refused with ERR_FORBIDDEN_ROLE (403) on an otherwise byte-identical payload that succeeds for PartnerManager."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN and one ACTIVE CoBrandIssuer with annual_mile_purchase_cap_miles 5000000."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles RBAC Exclusive", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /co-brand-issuers"
              payload: { program_id: "${prog_id}", name: "Northbank Card Services", annual_mile_purchase_cap_miles: 5000000 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { issuer_id: "$.data.id" }
          trigger:
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2026-09-01"
                term_end_date: "2027-08-31"
                committed_volume_miles: 1000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 200 }
              as: ContractsOfficer
              as_user_id: "co-1"
              captures: { err: "$.data.error_id" }
            - call: "POST /mile-sale-agreements"
              payload:
                issuer_id: "${issuer_id}"
                term_start_date: "2026-09-01"
                term_end_date: "2027-08-31"
                committed_volume_miles: 1000000
                tier_schedule:
                  - { threshold_miles: 0, price_per_mile_centicents: 200 }
              as: PartnerManager
              as_user_id: "pm-1"
              captures: { agr_id: "$.data.id" }
          assert:
            - "the first trigger returns HTTP 403 with data.error_id == ERR_FORBIDDEN_ROLE"
            - "the second trigger returns HTTP 201"
            - "MileSaleAgreement.${agr_id}.status == DRAFT"
            - "GET /mile-sale-agreements?issuer_id=${issuer_id} returns total_count 1"

      - name: member_role_cannot_create_a_loyalty_program_returns_forbidden_role
        claim_type: exclusive_operations
        grounds:
          - roles.ProgramAdmin.exclusive_operations
          - roles.Member
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "A Member is a fully authenticated, entity-backed principal, so program creation must fail with ERR_FORBIDDEN_ROLE (403) and not ERR_UNAUTHENTICATED (401), and the program count must stay at the single pre-existing row."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN with one MemberAccount whose id is used as the Member caller's X-User-ID."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles RBAC Member", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-RBAC", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
          trigger:
            - call: "POST /loyalty-programs"
              payload: { name: "Member's Own Program" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the trigger returns HTTP 403 with data.error_id == ERR_FORBIDDEN_ROLE"
            - "data.error_id != ERR_UNAUTHENTICATED"
            - "GET /loyalty-programs returns total_count 1"

      - name: both_program_admin_and_revenue_accountant_may_post_mile_transactions
        claim_type: shared_operations
        grounds:
          - roles.ProgramAdmin.shared_operations
          - roles.RevenueAccountant.shared_operations
          - endpoints[POST /mile-transactions]
        distinguishing_aspect: "The shared operation must behave identically for both roles - two 1000-mile partner earns, one posted by each, leave mile_balance 2000 and two rows - while a FraudAnalyst, who only has read access, is refused with ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at elite_tier BASE with no ledger rows."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Shared", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-SHARED", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
          trigger:
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "PARTNER_EARN", activity_date: "2026-08-01", base_miles: 1000 }
              as: ProgramAdmin
              captures: { t1: "$.data.id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "PARTNER_EARN", activity_date: "2026-08-01", base_miles: 1000 }
              as: RevenueAccountant
              captures: { t2: "$.data.id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "PARTNER_EARN", activity_date: "2026-08-01", base_miles: 1000 }
              as: FraudAnalyst
              as_user_id: "fa-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the first trigger returns HTTP 201 and MileTransaction.${t1}.total_miles == 1000"
            - "the second trigger returns HTTP 201 and MileTransaction.${t2}.total_miles == 1000"
            - "the third trigger returns HTTP 403 with data.error_id == ERR_FORBIDDEN_ROLE"
            - "MemberAccount.${mem_id}.mile_balance == 2000"
            - "LoyaltyProgram.${prog_id}.outstanding_miles == 2000"
            - "GET /mile-transactions?member_id=${mem_id} returns total_count 2"

      - name: the_analyst_who_opened_a_case_cannot_substantiate_it
        claim_type: segregation_of_duties
        grounds:
          - roles.FraudAnalyst
          - validations[priority=11]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - calculations.fraud_risk_and_clawback
        distinguishing_aspect: "fa-1 may open AND investigate the case, so the bar is specifically on adjudication: fa-1's substantiate fails with ERR_SEGREGATION_OF_DUTIES (409) while fa-2's identical call succeeds and claws back all 5000 miles - even though the detection_score of 25 was below the WATCH threshold, substantiation freezes the member regardless of the original score."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at security_state NORMAL with mile_balance 5000 from a single 5000-mile partner earn dated 2026-07-20 (inside the 90-day clawback lookback)."
            - "One FraudCase of type MILE_BROKERING opened by fa-1 with brokering_pattern_hits 4 and every other signal 0, then investigated by fa-1."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles SoD Fraud", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-SOD", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "PARTNER_EARN", activity_date: "2026-07-20", base_miles: 5000 }
              as: RevenueAccountant
              captures: { earn_id: "$.data.id" }
            - call: "POST /fraud-cases"
              payload: { member_id: "${mem_id}", case_type: "MILE_BROKERING", login_geo_velocity: 0, redemption_velocity_24h: 0, brokering_pattern_hits: 4, dormancy_days: 0 }
              as: FraudAnalyst
              as_user_id: "fa-1"
              captures: { case_id: "$.data.id" }
            - call: "POST /fraud-cases/${case_id}/investigate"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
          trigger:
            - call: "POST /fraud-cases/${case_id}/substantiate"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
              captures: { err: "$.data.error_id" }
            - call: "POST /fraud-cases/${case_id}/substantiate"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-2"
          assert:
            - "FraudCase.${case_id}.detection_score == 25"
            - "MemberAccount.${mem_id}.security_state == NORMAL after case creation"
            - "the first trigger returns HTTP 409 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "FraudCase.${case_id}.status == INVESTIGATING"
            - "FraudCase.${case_id}.adjudicated_by_user_id == null"
            - "the second trigger returns HTTP 200"
            - "FraudCase.${case_id}.status == SUBSTANTIATED"
            - "FraudCase.${case_id}.adjudicated_by_user_id == \"fa-2\""
            - "FraudCase.${case_id}.clawback_miles == 5000"
            - "MemberAccount.${mem_id}.security_state == FROZEN"
            - "MemberAccount.${mem_id}.mile_balance == 0"
            - "LoyaltyProgram.${prog_id}.outstanding_miles == 0"
            - "GET /mile-transactions?member_id=${mem_id}&txn_type=ADJUSTMENT returns total_count 1 with total_miles == -5000"

      - name: a_contracts_officer_sharing_the_negotiators_user_id_cannot_ratify
        claim_type: segregation_of_duties
        grounds:
          - roles.ContractsOfficer
          - validations[priority=10]
          - state_machines.MileSaleAgreement.ISSUER_REVIEW_to_RATIFIED
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "The check is on X-User-ID versus negotiated_by_user_id, not on role: a ContractsOfficer whose user id is the same u-7 that submitted the agreement is refused with ERR_SEGREGATION_OF_DUTIES (409), while co-2 ratifies the identical agreement and the issuer aggregate only then moves to 1000000."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN and one ACTIVE CoBrandIssuer with annual_mile_purchase_cap_miles 5000000."
            - "One MileSaleAgreement in ISSUER_REVIEW, committed_volume_miles 1000000, submitted by the PartnerManager whose X-User-ID is u-7."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles SoD Ratify", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
