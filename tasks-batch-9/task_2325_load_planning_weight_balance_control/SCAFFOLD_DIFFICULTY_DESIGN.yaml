          A third, different category pair (state vs business_temporal). Runway
          LSGG/26 has slot_capacity_per_window 1 and its 10:00 window is already
          taken, so a departure at 10:05 with a WITHDRAWN weight program violates
          rules 7 and 33 together; rule 7 wins. Each rule is then shown firing
