  - { method: POST, path: "/migration-batches/{id}/execution", description: "EXECUTE (migrate grandfathered accounts, cascade) or ABORT", roles: [OperationsAdmin], code: 200, input: [action], output: MigrationBatch, side_effects: ["per MigrationBatch machine"] }

  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock. Advancing the clock runs the time sweep, day by day in date order: (1) daily interest accrual into unposted_accrual_milli for every non-CLOSED account; (2) promo SCHEDULED -> ACTIVE / -> EXPIRED; (3) account promo rollover with RENEW_THEN_SHEET handling; (4) exception APPLIED -> EXPIRED with account revert; (5) PROMO_EXPIRY notice creation 30 days before promo_end_date; (6) APPROVED-but-unapplied exceptions expire after 30 days", roles: [OperationsAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["daily interest accrual per interest_posting; time sweep per PromotionalOffer / DepositAccount / ExceptionPricingRequest machines"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, invalid enum value, or malformed date" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Exception decision actor equals submitted_by_user_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 422, condition: "Referenced product_id does not exist" }
  - { id: ERR_SHEET_NOT_FOUND, http: 422, condition: "Referenced sheet_id does not exist, or no EFFECTIVE sheet exists for account opening" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 422, condition: "Referenced account_id does not exist" }
  - { id: ERR_PROMO_NOT_FOUND, http: 422, condition: "Referenced promo_offer_id does not exist" }
  - { id: ERR_BUNDLE_NOT_FOUND, http: 422, condition: "Referenced bundle_id does not exist" }
  - { id: ERR_SHEET_INVALID_STATE, http: 409, condition: "Sheet not in a valid from-state for the requested transition (incl. retire with accounts still attached)" }
  - { id: ERR_PROMO_INVALID_STATE, http: 409, condition: "Offer not in a valid from-state (e.g. close a DRAFT offer)" }
  - { id: ERR_EXCEPTION_INVALID_STATE, http: 409, condition: "Exception request not in a valid from-state for decision/resubmit/apply" }
  - { id: ERR_ACCOUNT_INVALID_STATE, http: 409, condition: "Account lifecycle/rate_source incompatible with the action (e.g. CLOSE of CLOSED, ENROLL_PROMO on FROZEN or non-SHEET account)" }
  - { id: ERR_MIGRATION_INVALID_STATE, http: 409, condition: "Batch not PLANNED, or source sheet not SUPERSEDED" }
  - { id: ERR_ENROLLMENT_INVALID_STATE, http: 409, condition: "Enrollment transition from an invalid state (e.g. SUSPEND an EXITED enrollment)" }
  - { id: ERR_SCAN_INVALID_STATE, http: 409, condition: "Analyze requested on a scan not in SUBMITTED" }
  - { id: ERR_DEPLOYMENT_INVALID_STATE, http: 409, condition: "Deployment action from an invalid state (e.g. MARK_FAILED on DEPLOYED, DEPLOY on RETIRED)" }
  - { id: ERR_NOTICE_ALREADY_RESOLVED, http: 409, condition: "SEND/WAIVE on a notice already SENT or WAIVED" }
  - { id: ERR_DRAFT_SHEET_EXISTS, http: 409, condition: "A DRAFT sheet already exists for (product_id, market_code)" }
  - { id: ERR_EFFECTIVE_WINDOW_OVERLAP, http: 409, condition: "Half-open effective window overlaps a SCHEDULED/EFFECTIVE sheet for the same product+market" }
  - { id: ERR_TIER_STRUCTURE_INVALID, http: 422, condition: "Tiers not contiguous from 0, overlapping, or last tier not unbounded" }
  - { id: ERR_RATE_CAP_EXCEEDED, http: 422, condition: "A tier rate or promo rate exceeds product.rate_cap_bp" }
  - { id: ERR_MARGIN_BELOW_FLOOR, http: 422, condition: "FORWARD_LOOKING margin below the sheet's margin_floor_bp at submit" }
  - { id: ERR_MARGIN_NOT_COMPUTABLE, http: 422, condition: "REALIZED_BOOK margin requested with no qualifying OPEN accounts, or projected balances sum to zero" }
  - { id: ERR_PROMO_WINDOW_OVERLAP, http: 409, condition: "Closed enrollment window intersects another SCHEDULED/ACTIVE offer for the same product+market (touching dates conflict)" }
  - { id: ERR_PROMO_NOT_ENROLLABLE, http: 422, condition: "Offer not ACTIVE, outside window, product/market mismatch, or product disallows promos" }
  - { id: ERR_PROMO_MIN_BALANCE_UNMET, http: 422, condition: "Account balance below offer.min_opening_balance_cents at enrollment" }
  - { id: ERR_EXCEPTION_DELTA_EXCEEDS_MAX, http: 422, condition: "delta_bp > 75 at create or resubmit" }
  - { id: ERR_EXCEPTION_AUTHORITY_INSUFFICIENT, http: 403, condition: "COMMITTEE-tier exception decided by BranchBanker" }
  - { id: ERR_EXCEPTION_DOCS_MISSING, http: 422, condition: "justification_doc_ref absent for COMMITTEE-tier request" }
  - { id: ERR_BASELINE_SHEET_NOT_EFFECTIVE, http: 422, condition: "Baseline sheet not EFFECTIVE at exception create/approve/apply" }
  - { id: ERR_DISCLOSURE_LEAD_TIME_UNMET, http: 409, condition: "Activate blocked: PRE_CHANGE notice PENDING, or SENT late (is_late = true)" }
  - { id: ERR_DEPLOYMENT_INCOMPLETE, http: 409, condition: "Activate blocked: not all 4 channel deployments DEPLOYED" }
  - { id: ERR_FUTURE_EFFECTIVE_DATE, http: 409, condition: "Activate blocked: logical today < effective_date" }
  - { id: ERR_MIGRATION_TARGET_NOT_EFFECTIVE, http: 422, condition: "Migration target sheet not EFFECTIVE" }
  - { id: ERR_NO_FUNDING_CURVE, http: 422, condition: "No operative FundingCurve, or tenor beyond the curve's maximum point" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PricingAnalyst
    description: "Retail pricing analyst; drafts sheets, scans, promos; schedules and activates rate changes"
    identity: opaque
    exclusive_operations: [create/edit/submit/schedule/activate rate sheets, upload + analyze competitor scans, manage repricing cycles, create/publish/close promotional offers]
    shared_operations: [read sheets/accounts/bundles/notices/deployments/migrations/curves, margin analysis]
  - name: PricingCommittee
    description: "Pricing committee; approves/returns sheets and exception requests; retires sheets"
    identity: opaque
    exclusive_operations: [rate sheet review-decision, retire sheet, exception REVOKE, COMMITTEE-tier exception decisions]
    shared_operations: [read sheets/scans/cycles/accounts/promos/exceptions, margin analysis]
  - name: TreasuryOfficer
    description: "Treasury; owns the cost-of-funds curve"
    identity: opaque
    exclusive_operations: [publish funding curves]
    shared_operations: [read curves, margin analysis]
  - name: BranchBanker
    description: "Branch banker; opens and services accounts, requests exception pricing"
    identity: opaque
    exclusive_operations: [open/freeze/unfreeze/close accounts, balance adjustment, promo enrollment, interest posting, create/resubmit/apply exception requests, BRANCH-tier exception decisions]
    shared_operations: [read sheets/accounts/promos/enrollments/exceptions, rate quotes]
  - name: ComplianceOfficer
    description: "Compliance; sends or waives disclosure notices"
    identity: opaque
    exclusive_operations: [resolve disclosure notices (SEND/WAIVE)]
    shared_operations: [read sheets/notices/deployments/exceptions]
  - name: ChannelOperator
    description: "Channel operations; deploys rate sheets to delivery channels"
    identity: opaque
    exclusive_operations: [execute rate deployments (DEPLOY/MARK_FAILED)]
    shared_operations: [read deployments]
  - name: OperationsAdmin
    description: "Platform operations admin; manages products, bundles, enrollments, migrations, and the logical clock"
    identity: opaque
    exclusive_operations: [create products, manage bundles and enrollments, plan/execute/abort migration batches, set logical clock]
    shared_operations: [read products/bundles/enrollments/migrations]
