              captures: { la_id: $.data.id }
          assert:
            - "Campaign.${camp_id}.budget_committed_cents == 1260"
            - "Campaign.${camp_id}.delivered_sample_count == 3"
            - "Campaign.${camp_id}.substantiated_diversion_count == 2"
            - "LiftAnalysis.${la_id}.diverted_unit_count == 2"
            - "LiftAnalysis.${la_id}.effective_sample_count == 1"
            - "LiftAnalysis.${la_id}.base_cost_per_sample_cents == 1260"
            - "LiftAnalysis.${la_id}.penalty_rate_pct == 20"
            - "LiftAnalysis.${la_id}.diversion_penalty_cents == 504"
            - "LiftAnalysis.${la_id}.adjusted_cost_per_sample_cents == 1764"
            - "LiftAnalysis.${la_id}.adjusted_cost_per_sample_cents != 2142 (2142 is the forbidden reading that re-derives the tier from the STEP-4 figure, giving penalty_rate_pct 35 and diversion_penalty_cents 882)"
            - "LiftAnalysis.${la_id}.treated_count == 1"
            - "LiftAnalysis.${la_id}.holdout_count == 0"
            - "LiftAnalysis.${la_id}.treated_converted_count == 1"
