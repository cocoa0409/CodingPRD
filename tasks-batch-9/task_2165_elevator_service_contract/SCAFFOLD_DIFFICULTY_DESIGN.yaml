  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: car_downtime_half_open_adjacency_allowed_but_inter_type_buffer_enforced
        grounds:
          - calculations.downtime_overlap_rule
          - validations[priority=100]
          - errors[ERR_DOWNTIME_WINDOW_CONFLICT]
          - entities.DowntimeWindow.fields.window_type
          - endpoints[POST /elevator-program/downtime-windows]
        distinguishing_aspect: |
          RESOURCE = a single ElevatorCar; INTERVAL SEMANTICS = half-open [start, end) at whole-minute
          precision with a TYPE-DEPENDENT 120-minute buffer. A MODERNIZATION window 60 minutes after a
          REPAIR window is refused (buffer), while a REPAIR window abutting the same REPAIR window with
          a zero-minute gap is accepted (half-open adjacency is not overlap).
        test_recipe:
          setup:
            - "One ACTIVE contract with one car C1 that is IN_SERVICE and not RED_TAGGED."
            - "C1 holds one SCHEDULED REPAIR window 2026-09-10T08:00Z -> 2026-09-10T12:00Z (240 minutes), so scheduled_downtime_minutes is 240."
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Rho Tower", building_address: "17 Rho St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-r", contractor_user_id: "sc-r", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { kr_id: $.data.id }
            - call: "POST /elevator-program/contracts/${kr_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${kr_id}", car_code: "CAR-R1", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { r1_id: $.data.id }
            - call: "POST /elevator-program/downtime-windows"
              payload: { car_id: "${r1_id}", window_type: "REPAIR", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { wr1_id: $.data.id }
          trigger:
            - call: "POST /elevator-program/downtime-windows"
              payload: { car_id: "${r1_id}", window_type: "MODERNIZATION", window_start: "2026-09-10T13:00:00Z", window_end: "2026-09-10T15:00:00Z" }
              as: ServiceContractor
              as_user_id: "sc-r"
              captures: { err_id6: $.data.error_id }
            - call: "POST /elevator-program/downtime-windows"
              payload: { car_id: "${r1_id}", window_type: "REPAIR", window_start: "2026-09-10T12:00:00Z", window_end: "2026-09-10T14:00:00Z" }
              as: ServiceContractor
              as_user_id: "sc-r"
              captures: { wr2_id: $.data.id }
          assert:
            - "trigger[0] HTTP status == 409"
            - "${err_id6} == \"ERR_DOWNTIME_WINDOW_CONFLICT\""
            - "trigger[1] HTTP status == 201"
            - "DowntimeWindow.${wr2_id}.status == \"SCHEDULED\""
            - "DowntimeWindow.${wr2_id}.duration_minutes == 120"
            - "DowntimeWindow.${wr1_id}.duration_minutes == 240"
            - "ElevatorCar.${r1_id}.scheduled_downtime_minutes == 360"
            - "GET /elevator-program/downtime-windows?car_id=${r1_id} returns exactly 2 windows"

      - name: contract_modernization_capacity_uses_closed_calendar_dates_across_cars
        grounds:
          - calculations.downtime_overlap_rule
          - validations[priority=110]
          - errors[ERR_CONTRACT_MODERNIZATION_CAPACITY]
          - entities.ModernizationProject.fields.window_count
          - endpoints[POST /elevator-program/downtime-windows]
        distinguishing_aspect: |
          A DIFFERENT resource entity (the ServiceContract's modernization capacity, not one car) and
          DIFFERENT interval arithmetic (CLOSED inclusive calendar-date ranges, not half-open minute
          intervals): the candidate on CAR-S2 starts 14 hours AFTER the CAR-S1 window ends, so it
          cannot collide under minute arithmetic, yet both occupy the calendar date 2026-09-12 and
          MAX_CONCURRENT_MODERNIZATION_CARS is 1, so the candidate is refused. Moving it to start on
          2026-09-13 makes it legal.
        test_recipe:
          setup:
            - "One ACTIVE contract with two cars CAR-S1 and CAR-S2 and one APPROVED ModernizationProject."
            - "CAR-S1 holds a SCHEDULED MODERNIZATION window 2026-09-10T08:00Z -> 2026-09-12T06:00Z, whose closed date range is 2026-09-10 through 2026-09-12."
            - "CAR-S2 holds no windows, so its scheduled_downtime_minutes is 0."
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Sigma Court", building_address: "18 Sigma Ln", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-s", contractor_user_id: "sc-s", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { ks_id: $.data.id }
            - call: "POST /elevator-program/contracts/${ks_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${ks_id}", car_code: "CAR-S1", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { s1_id: $.data.id }
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${ks_id}", car_code: "CAR-S2", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { s2_id: $.data.id }
            - call: "POST /elevator-program/projects"
              payload: { contract_id: "${ks_id}", title: "Two-car modernization", budget_cents: 15000000, target_completion_date: "2026-10-01" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { prs_id: $.data.id }
            - call: "POST /elevator-program/projects/${prs_id}/approve"
              payload: {}
              as: BuildingManager
              as_user_id: "bm-s"
            - call: "POST /elevator-program/downtime-windows"
              payload: { car_id: "${s1_id}", window_type: "MODERNIZATION", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-12T06:00:00Z", project_id: "${prs_id}" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { ws1_id: $.data.id }
          trigger:
            - call: "POST /elevator-program/downtime-windows"
              payload: { car_id: "${s2_id}", window_type: "MODERNIZATION", window_start: "2026-09-12T20:00:00Z", window_end: "2026-09-14T08:00:00Z", project_id: "${prs_id}" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { err_id7: $.data.error_id }
            - call: "POST /elevator-program/downtime-windows"
              payload: { car_id: "${s2_id}", window_type: "MODERNIZATION", window_start: "2026-09-13T00:00:00Z", window_end: "2026-09-14T08:00:00Z", project_id: "${prs_id}" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { ws2_id: $.data.id }
          assert:
            - "trigger[0] HTTP status == 409"
            - "${err_id7} == \"ERR_CONTRACT_MODERNIZATION_CAPACITY\""
            - "after trigger[0]: ElevatorCar.${s2_id}.scheduled_downtime_minutes == 0"
            - "after trigger[0]: ModernizationProject.${prs_id}.window_count == 1"
            - "trigger[1] HTTP status == 201"
            - "DowntimeWindow.${ws2_id}.status == \"SCHEDULED\""
            - "DowntimeWindow.${ws2_id}.duration_minutes == 1920"
            - "ElevatorCar.${s2_id}.scheduled_downtime_minutes == 1920"
            - "ModernizationProject.${prs_id}.window_count == 2"
            - "DowntimeWindow.${ws1_id}.duration_minutes == 2760"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: downtime_cancel_conserves_car_scheduled_minutes_exactly
        grounds:
          - state_machines.DowntimeWindow.status.SCHEDULED_to_CANCELLED
          - entities.ElevatorCar.fields.scheduled_downtime_minutes
          - entities.ModernizationProject.fields.window_count
          - endpoints[POST /elevator-program/downtime-windows]
          - endpoints[POST /elevator-program/downtime-windows/{windowId}/cancel]
        distinguishing_aspect: |
          CONSERVED QUANTITY = TIME (minutes). The invariant
          `ElevatorCar.scheduled_downtime_minutes == sum of duration_minutes over that car's
          DowntimeWindow rows with status IN {SCHEDULED, COMPLETED}` must hold before the forward
          action, after it (0 -> 2880), and after the compensating cancel (2880 -> 0) with zero drift,
          and ModernizationProject.window_count must return to its pre-action value of 0.
        test_recipe:
          setup:
            - "One ACTIVE contract with one car whose scheduled_downtime_minutes is 0."
            - "One APPROVED ModernizationProject with window_count 0."
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Tau Place", building_address: "19 Tau Rd", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-u", contractor_user_id: "sc-u", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { ku_id: $.data.id }
            - call: "POST /elevator-program/contracts/${ku_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${ku_id}", car_code: "CAR-U1", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { u1_id: $.data.id }
            - call: "POST /elevator-program/projects"
              payload: { contract_id: "${ku_id}", title: "Cab interior refresh", budget_cents: 2500000, target_completion_date: "2026-09-30" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { pru_id: $.data.id }
            - call: "POST /elevator-program/projects/${pru_id}/approve"
              payload: {}
              as: BuildingManager
              as_user_id: "bm-u"
            - call: "GET /elevator-program/cars/${u1_id}"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { u1_minutes_before: $.data.scheduled_downtime_minutes }
          trigger:
            - call: "POST /elevator-program/downtime-windows"
              payload: { car_id: "${u1_id}", window_type: "MODERNIZATION", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-12T08:00:00Z", project_id: "${pru_id}" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { wu_id: $.data.id }
            - call: "POST /elevator-program/downtime-windows/${wu_id}/cancel"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
          assert:
            - "${u1_minutes_before} == 0"
            - "after trigger[0]: ElevatorCar.${u1_id}.scheduled_downtime_minutes == 2880"
            - "after trigger[0]: ModernizationProject.${pru_id}.window_count == 1"
            - "after trigger[1]: DowntimeWindow.${wu_id}.status == \"CANCELLED\""
            - "after trigger[1]: DowntimeWindow.${wu_id}.duration_minutes == 2880"
            - "after trigger[1]: ElevatorCar.${u1_id}.scheduled_downtime_minutes == 0"
            - "after trigger[1]: ElevatorCar.${u1_id}.scheduled_downtime_minutes == ${u1_minutes_before}"
            - "after trigger[1]: ModernizationProject.${pru_id}.window_count == 0"

      - name: penalty_waiver_conserves_contract_money_ledger_exactly
        grounds:
          - state_machines.PenaltyAssessment.status.ISSUED_to_DISPUTED
          - state_machines.PenaltyAssessment.status.DISPUTED_to_WAIVED
          - entities.ServiceContract.fields.penalty_balance_cents
          - entities.ServiceContract.fields.penalty_lifetime_assessed_cents
          - entities.ServiceContract.fields.penalty_lifetime_waived_cents
          - endpoints[POST /elevator-program/penalties]
          - endpoints[POST /elevator-program/penalties/{penaltyId}/resolve]
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: MONEY (cents), not minutes. Assessing 25000 cents and then
          waiving them must return penalty_balance_cents to exactly its pre-assessment value of 0
          while the audit ledger keeps both gross figures, so the pinned identity
          `penalty_balance_cents == penalty_lifetime_assessed_cents - penalty_lifetime_waived_cents -
          penalty_lifetime_credited_cents` holds at 0 == 25000 - 25000 - 0 with no drift.
        test_recipe:
          setup:
            - "One ACTIVE FULL_MAINTENANCE / SCHEDULE_A contract with monthly_base_fee_cents 480000 and one car."
            - "One CLEARED August MALFUNCTION callback with response_minutes 120 against a 60-minute SLA, reported with out_of_service false so August uptime stays 100.00 and only the flat late-callback fee applies."
            - "penalty_balance_cents is 0 before the trigger."
