  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: occ_patch_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[rma-patch-stale-version]", "errors[ERR_STALE_RMA_VERSION]"]
        distinguishing_aspect: "PATCH with the version observed at creation succeeds and bumps version; replaying the same observed version afterwards is rejected with 412 ERR_STALE_RMA_VERSION — two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["DRAFT RMA at version 1 (captured at creation)"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id, v0: $.data.version } }
          trigger:
            - { call: "PATCH /depot/rmas/${rma}", as: IntakeAgent, payload: { reported_issue: "updated text", expected_rma_version: "${v0}" }, captures: { v1: $.data.version } }
            - { call: "PATCH /depot/rmas/${rma}", as: IntakeAgent, payload: { reported_issue: "third text", expected_rma_version: "${v0}" }, captures: { err: $.data.error_id } }
          assert:
            - "First PATCH succeeds: version == ${v0} + 1 and reported_issue == 'updated text'"
            - "Second PATCH with the stale observed version fails: error_id == ERR_STALE_RMA_VERSION (http 412)"
            - "ServiceRMA.${rma}.reported_issue == 'updated text' (rejection did not apply)"

      - name: occ_parts_consumption_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[parts-consumption-stale-rma]", "errors[ERR_STALE_RMA_VERSION]"]
        distinguishing_aspect: "Two sequential part consumptions: the first (expected == observed version) succeeds and bumps the RMA version; the second replaying the same expected version is rejected 412 — stock is not double-decremented."
        test_recipe:
          setup: ["IN_REPAIR RMA; part stock 10; version captured from diagnose response"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 10 }, captures: { part: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas/${rma}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 10, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 2 } ] }, captures: { v0: $.data.version } }
          trigger:
            - { call: "POST /depot/rmas/${rma}/parts", as: DepotTechnician, as_user_id: "tech-1", payload: { part_id: "${part}", quantity: 1, failure_code_id: "${fc}", expected_rma_version: "${v0}" }, captures: { line: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/parts", as: DepotTechnician, as_user_id: "tech-1", payload: { part_id: "${part}", quantity: 1, failure_code_id: "${fc}", expected_rma_version: "${v0}" }, captures: { err: $.data.error_id } }
          assert:
            - "First consumption succeeds: RepairLine created"
            - "Second consumption with stale expected version fails: error_id == ERR_STALE_RMA_VERSION (412)"
            - "Part.${part}.stock_on_hand == 9 (single decrement only)"

      - name: occ_quote_revision_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[quote-create-supersede-stale-rma]", "errors[ERR_STALE_RMA_VERSION]"]
        distinguishing_aspect: "Quote revision (create-with-supersede) guards on the RMA version: an older observed version (${v} - 1) is rejected 412 while the current version supersedes the DECLINED quote cleanly."
        test_recipe:
          setup: ["OOW RMA in QUOTE_DECLINED; RMA version captured after decline"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2024-01-01", ship_date: "2024-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 10 }, captures: { part: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas/${rma}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 20, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 1 } ] } }
            - { call: "GET /depot/rmas/${rma}/quotes", as: DepotTechnician, captures: { q1: "$.data[0].id" } }
            - { call: "POST /depot/quotes/${q1}/decline", as: Customer, as_user_id: "${cust}", payload: {} }
            - { call: "GET /depot/rmas/${rma}", as: DepotTechnician, captures: { v_now: $.data.version } }
          trigger:
            - { call: "POST /depot/rmas/${rma}/quotes", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes: 50, parts_lines: [ { part_id: "${part}", quantity: 1 } ], expected_rma_version: "${v_now} - 1" }, captures: { err: $.data.error_id } }
            - { call: "POST /depot/rmas/${rma}/quotes", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes: 50, parts_lines: [ { part_id: "${part}", quantity: 1 } ], expected_rma_version: "${v_now}" }, captures: { q2: $.data.id, seq2: $.data.quote_seq } }
          assert:
            - "Stale revision rejected: error_id == ERR_STALE_RMA_VERSION (412)"
            - "Current-version revision succeeds: Quote.${q2}.quote_seq == 2, status SENT"
            - "Quote.${q1}.status == SUPERSEDED"
            - "ServiceRMA.${rma}.status == AWAITING_QUOTE_APPROVAL"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_same_response_and_reread
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, state_machines.ServiceRMA.DRAFT_to_AUTHORIZED]
        distinguishing_aspect: "Immediate consistency: the authorize response itself carries the post-transition state (AUTHORIZED, coverage_path, pinned estimates) and a subsequent GET returns identical values — no eventual lag."
