              as: FleetPlanner
              captures: { dom_chi_id: $.data.id }
            - call: "POST /fleet/backhaul-offers"
              payload: { origin_kind: "VENDOR_PICKUP", shipper_name: "ACME MILLS", origin_region_code: "MIDWEST", dest_store_id: "${store_s1_id}", revenue_cents: 54000, cases: 400, weight_lbs: 9000, deadhead_miles: 42, loaded_miles: 168, temperature_mode: "DRY", pickup_window_start: "2026-08-03T11:30:00Z", pickup_window_end: "2026-08-03T13:00:00Z", offer_expires_at: "2026-08-20T00:00:00Z" }
              as: FleetPlanner
              as_user_id: "user-fp-1"
              captures: { offer_b1_id: $.data.id }
            - call: "POST /fleet/backhaul-offers/${offer_b1_id}/submit-review"
              payload: {}
              as: FleetPlanner
              as_user_id: "user-fp-1"
            - call: "POST /fleet/backhaul-offers/${offer_b1_id}/revise"
              payload: { revenue_cents: 56000 }
              as: FleetPlanner
              as_user_id: "user-fp-1"
              captures: { round_1: $.data.review_round, r1_status: $.data.status, r1_cm: $.data.contribution_margin_cents }
            - call: "POST /fleet/backhaul-offers/${offer_b1_id}/submit-review"
              payload: {}
              as: FleetPlanner
              as_user_id: "user-fp-1"
            - call: "POST /fleet/backhaul-offers/${offer_b1_id}/revise"
              payload: { revenue_cents: 58000 }
              as: FleetPlanner
              as_user_id: "user-fp-1"
              captures: { round_2: $.data.review_round }
            - call: "POST /fleet/backhaul-offers/${offer_b1_id}/submit-review"
              payload: {}
              as: FleetPlanner
              as_user_id: "user-fp-1"
            - call: "POST /fleet/backhaul-offers/${offer_b1_id}/revise"
              payload: { revenue_cents: 60000 }
              as: FleetPlanner
              as_user_id: "user-fp-1"
              captures: { round_3: $.data.review_round, r3_cm: $.data.contribution_margin_cents, r3_tier: $.data.tier_margin_pct }
            - call: "POST /fleet/backhaul-offers/${offer_b1_id}/submit-review"
              payload: {}
              as: FleetPlanner
              as_user_id: "user-fp-1"
          trigger:
            - call: "POST /fleet/backhaul-offers/${offer_b1_id}/revise"
              payload: { revenue_cents: 62000 }
              as: FleetPlanner
              as_user_id: "user-fp-1"
              captures: { limit_error: $.data.error_id }
            - call: "POST /fleet/backhaul-offers/${offer_b1_id}/accept"
              payload: {}
              as: TransportManager
