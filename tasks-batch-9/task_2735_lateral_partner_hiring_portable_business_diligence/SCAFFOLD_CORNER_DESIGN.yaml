      - name: system_admin_cannot_override_role_exclusive_writes
        claim_type: hierarchical_override
        grounds:
          - roles.SystemAdmin.exclusive_operations
          - roles.SystemAdmin.shared_operations
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
          - complexity_profile.role_model
        distinguishing_aspect: |
          SystemAdmin is the only role that looks superior - it seeds groups and firms and
          drives the logical clock - so the tempting implementation grants it an override on
          everything. §1.7 gives it NO write authority over diligence, conflicts, offers or
          the client book, which is exactly what makes segregation_of_duties meaningful: an
          admin that can clear its own conflicts check or draft its own offer destroys the
          separation the whole model rests on. The same request is then made by the role that
          does own it, and the admin's own exclusive freeze plus its shared read both still
          succeed in the same recipe, so the four refusals cannot be dismissed as a broken
          admin header.
