      - name: cullet_ratio_above_flint_purity_limit_rejected
        claim_type: conditional_validation
        grounds:
          - validations.priority_24
          - errors.ERR_CULLET_RATIO_UNSAFE
          - entities.BatchRecipe.fields.cullet_stress_factor
        distinguishing_aspect: |
          The 90.00 purity ceiling is conditional on colour: cullet_ratio_pct 92.00 is a 422 on a FLINT
          recipe but a legal 201 on an AMBER recipe, where it yields cullet_stress_factor 0.4700 -
          and 92.00 is inside the declared field range, so this is not the 400 from priority 4.
        test_recipe:
          setup:
            - "Furnace FUR-V2 (300.00 tpd, life 100000.00)"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-V2", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
          trigger:
            - call: "POST /glass-plant/batch-recipes"
              payload: { furnace_id: "${f}", code: "BR-V2-FLINT", color: "FLINT", cullet_ratio_pct: 92.00, soda_ash_kg_per_ton: 180.00, colorant_kg_per_ton: 0.00 }
              as: BatchHouseTech
          assert:
            - "HTTP 422 and data.error_id == ERR_CULLET_RATIO_UNSAFE"
            - "no BatchRecipe with code BR-V2-FLINT exists"
            - "the same body with color AMBER and code BR-V2-AMBER returns 201 with cullet_stress_factor == 0.4700 and approved == false"
            - "a FLINT recipe with cullet_ratio_pct 90.00 returns 201 with cullet_stress_factor == 0.4500"

      - name: over_pull_limit_exceeded_on_job_create
        claim_type: violation_to_error
        grounds:
          - validations.priority_26
          - errors.ERR_OVER_PULL_LIMIT
          - entities.ProductionJob.fields.reserved_melt_tons
        distinguishing_aspect: |
          The over-pull ceiling is 1.15 x design_pull_tpd = 345.00 tpd: 350.00 is refused with 422 while
          345.00 is accepted and reserves 690.00 tons, so the rule is a multiple of the furnace nameplate
          rather than a flat cap at design pull.
        test_recipe:
          setup:
            - "Furnace FUR-V3 (design_pull_tpd 300.00, life 100000.00, FLINT, posture OPERATING)"
            - "ACTIVE Campaign CMP-V3 (300.00 tpd, 2026-08-01 to 2026-08-11, pool 3000.00 tons)"
            - "FLINT recipe BR-V3 (not approved - job create does not require approval), machine IS-V3, DRAFT FLINT design BD-V3"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "FUR-V3", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
