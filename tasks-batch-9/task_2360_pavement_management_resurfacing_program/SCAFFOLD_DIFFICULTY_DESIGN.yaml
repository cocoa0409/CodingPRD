# SCAFFOLD_DIFFICULTY_DESIGN.yaml - task_2360 Pavement Management & Resurfacing Program
# Section 1.8 test-targeting index. Nine Difficulty Rules x 3 instances = 27 instances.
# Every instance grounds only in elements declared in SCAFFOLD.yaml SS1.1-SS1.7; deleting this
# file would leave the scaffold's declared behavior identical. Every numeric literal in an
# `assert:` line was computed by executing the corresponding SS1.3 formula against the pinned
# fixture inputs (Decimal, ROUND_HALF_UP).
#
# Shared fixture conventions used by the chains below:
#   * logical clock starts at 2026-08-01T00:00:00Z via POST /pavement/_clock/set_current_utc
#   * SG1 "Maple St"  LOCAL    1000.00 x 30.00 ft  baseline 92.0  last treated 2016-08-01  zone Z1
#   * SG2 "Grand Blvd" ARTERIAL 2000.00 x 60.00 ft baseline 100.0 last treated 2016-08-01  zone Z1
#   * SG3 "Oak St"    LOCAL    3517.50 x 30.00 ft  baseline 92.0  last treated 2016-08-01  zone Z1
#   * SG4 "Elm St"    LOCAL    1001.00 x 30.00 ft  baseline 92.0  last treated 2016-08-01  zone Z3
#   * SG5 "Pine St"   LOCAL    1004.00 x 30.00 ft  baseline 92.0  last treated 2016-08-01  zone Z3
#   * observation profiles: OBS_MILL -> PCI 69.1, OBS_RECON -> PCI 30.0, OBS_CS75 -> PCI 75.0,
#     OBS_70 -> PCI 70.0, OBS_699 -> PCI 69.9
#   * segregation of duties: officer-adopt-1 adopts, officer-award-1 awards, insp-witness-*
#     witnesses coring, insp-decider-* decides tests, insp-acceptor-1 signs final acceptance

scaffold_difficulty_design:

  # dual_variant_calc
  - rule_id: dual_variant_calc
    instances:
      - name: segment_pci_survey_measured_vs_model_projected
        grounds: ["calculations.effective_condition_index", "calculations.survey_measured_condition_index", "calculations.model_projected_condition_index", "entities.NetworkSegment.fields.condition_index", "entities.NetworkSegment.fields.condition_index_source", "state_machines.ConditionSurvey.OPEN_to_SEALED"]
        distinguishing_aspect: "The MODEL_PROJECTED variant (age decay off baseline_condition_index) publishes 76.0 / GOOD on the same segment for which the SURVEY_MEASURED variant (distress deduct off the accepted observation) publishes 69.1 / FAIR — a 6.9-point divergence AND a condition_band flip produced by the same segment row at two different instants."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One LOCAL segment (1000.00 ft x 30.00 ft) with baseline_condition_index 92.0 and last_treatment_date 2016-08-01 — exactly 10 whole years of age, 2 years past the decay knee."
            - "An OPEN 2026 survey holds one ACCEPTED distress observation on that segment whose measured index is 69.1."
            - "The survey has NOT been sealed yet, so the segment still carries the creation-time MODEL_PROJECTED value."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id", model_pci: "$.data.condition_index", model_src: "$.data.condition_index_source", model_band: "$.data.condition_band", area1: "$.data.area_sy" }
            - call: "POST /pavement/condition-surveys"
              payload: { survey_year: 2026, collection_method: "AUTOMATED_LCMS" }
              as: PavementEngineer
              captures: { sv: "$.data.id" }
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv}", segment_id: "${seg1}", alligator_cracking_sqft: 3000.0, longitudinal_cracking_lf: 500.0, rutting_depth_in: 0.55, patching_sqft: 1500.0, iri_in_per_mi: 155.0, sample_coverage_pct: 100.0 }
              as: PavementEngineer
              captures: { obs1: "$.data.id", obs_deduct: "$.data.deduct_total", obs_pci: "$.data.measured_condition_index" }
            - call: "POST /pavement/distress-observations/${obs1}/qc"
              payload: { qc_decision: "ACCEPT", qc_note: "LCMS pass reviewed" }
              as: PavementEngineer
          trigger:
            - call: "POST /pavement/condition-surveys/${sv}/seal"
              payload: {}
              as: PavementEngineer
              captures: { net_idx: "$.data.network_condition_index" }
            - call: "GET /pavement/segments/${seg1}"
              payload: {}
              as: PavementEngineer
              captures: { meas_pci: "$.data.condition_index", meas_src: "$.data.condition_index_source", meas_band: "$.data.condition_band" }
          assert:
            - "${model_pci} == 76.0 and ${model_src} == MODEL_PROJECTED and ${model_band} == GOOD (92.0 - 1.4*10 - 1.0*2)"
            - "${area1} == 3333.33"
            - "${obs_deduct} == 30.90 and ${obs_pci} == 69.1"
            - "${meas_pci} == 69.1 and ${meas_src} == SURVEY_MEASURED and ${meas_band} == FAIR"
            - "${model_pci} - ${meas_pci} == 6.9 — the two variants disagree on the same NetworkSegment row"
            - "${net_idx} == 69.1 (single surveyed segment, area-weighted)"
            - "NetworkSegment.${seg1}.baseline_condition_index still 92.0 — the SURVEY_MEASURED variant does not rewrite the baseline"

      - name: scenario_projection_funded_arm_vs_do_nothing_arm
        grounds: ["calculations.projected_network_pci", "calculations.scenario_waterfall_allocation", "entities.BudgetScenario.fields.projected_network_pci", "entities.BudgetScenario.fields.do_nothing_network_pci", "state_machines.BudgetScenario.DRAFT_to_COMPUTED"]
        distinguishing_aspect: "One run of one scenario writes 76.6 into projected_network_pci (FUNDED_ARM: treated segments reset to post-treatment curve) and 9.0 into do_nothing_network_pci (DO_NOTHING_ARM: identical segments decayed unfunded), a 67.6-point spread from a single set of inputs."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Two segments in the same sealed 2026 survey: a LOCAL 1000.00x30.00 measured at 69.1 (-> MILL_AND_OVERLAY) and an ARTERIAL 2000.00x60.00 measured at 30.0 (-> RECONSTRUCTION); both were last treated 2016-08-01 so age is 10 years."
            - "A DRAFT scenario over that survey funds 250,000,000 cents with strategy WORST_FIRST and a 10-year horizon — enough to fund both candidates."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "POST /pavement/segments"
              payload: { street_name: "Grand Blvd", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "ARTERIAL", surface_type: "ASPHALT", length_ft: 2000.0, width_ft: 60.0, baseline_condition_index: 100.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg2: "$.data.id" }
            - call: "POST /pavement/condition-surveys"
              payload: { survey_year: 2026, collection_method: "AUTOMATED_LCMS" }
              as: PavementEngineer
              captures: { sv: "$.data.id" }
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv}", segment_id: "${seg1}", alligator_cracking_sqft: 3000.0, longitudinal_cracking_lf: 500.0, rutting_depth_in: 0.55, patching_sqft: 1500.0, iri_in_per_mi: 155.0, sample_coverage_pct: 100.0 }
              as: PavementEngineer
              captures: { obs1: "$.data.id" }
            - call: "POST /pavement/distress-observations/${obs1}/qc"
              payload: { qc_decision: "ACCEPT", qc_note: "LCMS pass reviewed" }
              as: PavementEngineer
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv}", segment_id: "${seg2}", alligator_cracking_sqft: 24000.0, longitudinal_cracking_lf: 2000.0, rutting_depth_in: 1.25, patching_sqft: 12000.0, iri_in_per_mi: 117.5, sample_coverage_pct: 100.0 }
              as: PavementEngineer
              captures: { obs2: "$.data.id" }
            - call: "POST /pavement/distress-observations/${obs2}/qc"
              payload: { qc_decision: "ACCEPT", qc_note: "LCMS pass reviewed" }
              as: PavementEngineer
            - call: "POST /pavement/condition-surveys/${sv}/seal"
              payload: {}
              as: PavementEngineer
              captures: { net_before: "$.data.network_condition_index" }
            - call: "POST /pavement/condition-surveys/${sv}/generate-candidates"
              payload: {}
              as: PavementEngineer
              captures: { cand_recon: "$.data[0].id", cand_mill: "$.data[1].id", recon_cost: "$.data[0].estimated_cost_cents", mill_cost: "$.data[1].estimated_cost_cents" }
            - call: "POST /pavement/budget-scenarios"
              payload: { survey_id: "${sv}", scenario_name: "FY27 program", funding_cents: 250000000, strategy: "WORST_FIRST", horizon_years: 10 }
              as: BudgetOfficer
              captures: { sc: "$.data.id" }
          trigger:
            - call: "POST /pavement/budget-scenarios/${sc}/run"
              payload: {}
              as: BudgetOfficer
              captures: { pf_pci: "$.data.projected_network_pci", dn_pci: "$.data.do_nothing_network_pci", fc: "$.data.funded_cost_cents", bk: "$.data.backlog_cents", ac: "$.data.allocation_count" }
          assert:
            - "${net_before} == 37.8 (area-weighted 3333.33*69.1 + 13333.33*30.0)"
            - "${recon_cost} == 237099941 and ${mill_cost} == 10743323 — worst-PCI-first ordering puts the ARTERIAL candidate at index 0"
            - "${ac} == 2 and ${fc} == 247843264 and ${bk} == 0"
            - "${pf_pci} == 76.6 — FUNDED_ARM"
            - "${dn_pci} == 9.0 — DO_NOTHING_ARM on the very same segments"
            - "${pf_pci} - ${dn_pci} == 67.6"

      - name: contractor_interim_vs_final_performance_score_diverge
        grounds: ["calculations.contractor_performance_score", "entities.Contractor.fields.interim_performance_score", "entities.Contractor.fields.final_performance_score", "entities.Contractor.fields.standing", "state_machines.Contractor.GOOD_STANDING_to_WATCH"]
        distinguishing_aspect: "With one ACCEPTED clean project and one IN_CONSTRUCTION project carrying a failed test, INTERIM reads 75.5 (WATCH) while FINAL reads 100.0 on the same Contractor row, because FINAL is restricted to delivery_status == ACCEPTED projects and INTERIM is not."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z throughout, so no project is ever late."
            - "One contractor with max_concurrent_projects 2, both projects funded from one ADOPTED 20,000,000-cent scenario."
            - "Project A (LOCAL Maple St, MILL_AND_OVERLAY, window 2026-09-01..2026-09-30) is driven all the way to ACCEPTED with a single PASS test (pay factor 1.0200)."
            - "Project B (LOCAL Oak St, CRACK_SEAL, window 2026-10-01..2026-10-31) is left IN_CONSTRUCTION with one FAILED test (core density 91.9 -> pay factor 0.0000)."
            - "Segregation of duties is respected: adopt user officer-adopt-1 differs from award user officer-award-1, and each test's witness differs from its decider."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "POST /pavement/segments"
              payload: { street_name: "Oak St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 3517.5, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg3: "$.data.id" }
            - call: "POST /pavement/condition-surveys"
              payload: { survey_year: 2026, collection_method: "AUTOMATED_LCMS" }
              as: PavementEngineer
              captures: { sv: "$.data.id" }
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv}", segment_id: "${seg1}", alligator_cracking_sqft: 3000.0, longitudinal_cracking_lf: 500.0, rutting_depth_in: 0.55, patching_sqft: 1500.0, iri_in_per_mi: 155.0, sample_coverage_pct: 100.0 }
              as: PavementEngineer
              captures: { obs1: "$.data.id" }
            - call: "POST /pavement/distress-observations/${obs1}/qc"
              payload: { qc_decision: "ACCEPT", qc_note: "LCMS pass reviewed" }
              as: PavementEngineer
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv}", segment_id: "${seg3}", alligator_cracking_sqft: 0.0, longitudinal_cracking_lf: 0.0, rutting_depth_in: 0.875, patching_sqft: 0.0, iri_in_per_mi: 95.0, sample_coverage_pct: 100.0 }
              as: PavementEngineer
              captures: { obs3: "$.data.id" }
            - call: "POST /pavement/distress-observations/${obs3}/qc"
              payload: { qc_decision: "ACCEPT", qc_note: "LCMS pass reviewed" }
              as: PavementEngineer
            - call: "POST /pavement/condition-surveys/${sv}/seal"
              payload: {}
              as: PavementEngineer
            - call: "POST /pavement/condition-surveys/${sv}/generate-candidates"
              payload: {}
              as: PavementEngineer
              captures: { cand_a: "$.data[0].id", cand_b: "$.data[1].id" }
            - call: "POST /pavement/contractors"
              payload: { legal_name: "Ace Paving LLC", max_concurrent_projects: 2 }
              as: PavementEngineer
              captures: { ctr: "$.data.id" }
            - call: "POST /pavement/budget-scenarios"
              payload: { survey_id: "${sv}", scenario_name: "FY27 program", funding_cents: 20000000, strategy: "WORST_FIRST", horizon_years: 10 }
              as: BudgetOfficer
              captures: { sc: "$.data.id" }
            - call: "POST /pavement/budget-scenarios/${sc}/run"
              payload: {}
              as: BudgetOfficer
            - call: "POST /pavement/budget-scenarios/${sc}/adopt"
              payload: {}
              as: BudgetOfficer
              as_user_id: "officer-adopt-1"
            - call: "POST /pavement/projects"
              payload: { scenario_id: "${sc}", project_name: "Maple St resurfacing", geo_zone: "Z1", planned_start_date: "2026-09-01T00:00:00Z", planned_end_date: "2026-09-30T00:00:00Z" }
              as: PavementEngineer
              captures: { pA: "$.data.id", pAv: "$.data.version" }
            - call: "POST /pavement/project-segments"
              payload: { project_id: "${pA}", segment_id: "${seg1}", candidate_id: "${cand_a}", work_window_start: "2026-09-01T00:00:00Z", work_window_end: "2026-09-30T00:00:00Z", expected_project_version: "${pAv}", design_thickness_in: 2.0 }
              as: PavementEngineer
              captures: { psA: "$.data.id" }
            - call: "POST /pavement/projects/${pA}/advance"
              payload: { action: "START_COORDINATION" }
              as: PavementEngineer
            - call: "GET /pavement/utility-coordinations"
              payload: { project_id: "${pA}" }
              as: UtilityCoordinator
              captures: { ua0: "$.data[0].id", ua1: "$.data[1].id", ua2: "$.data[2].id", ua3: "$.data[3].id" }
            - call: "POST /pavement/utility-coordinations/${ua0}/respond"
              payload: { response: "CLEAR", response_note: "no conflict with the paving window" }
              as: UtilityCoordinator
            - call: "POST /pavement/utility-coordinations/${ua1}/respond"
              payload: { response: "CLEAR", response_note: "no conflict with the paving window" }
              as: UtilityCoordinator
            - call: "POST /pavement/utility-coordinations/${ua2}/respond"
              payload: { response: "CLEAR", response_note: "no conflict with the paving window" }
              as: UtilityCoordinator
            - call: "POST /pavement/utility-coordinations/${ua3}/respond"
              payload: { response: "CLEAR", response_note: "no conflict with the paving window" }
              as: UtilityCoordinator
            - call: "POST /pavement/projects/${pA}/advance"
              payload: { action: "BID_READY" }
              as: PavementEngineer
            - call: "POST /pavement/projects/${pA}/award"
              payload: { contractor_id: "${ctr}", award_amount_cents: 11817655 }
              as: BudgetOfficer
              as_user_id: "officer-award-1"
            - call: "POST /pavement/project-segments/${psA}/notice"
              payload: { action: "SCHEDULE", parking_restriction_start: "2026-09-01T00:00:00Z", parking_restriction_end: "2026-09-30T00:00:00Z", driveway_access_plan: "MAINTAINED" }
              as: PavementEngineer
            - call: "POST /pavement/project-segments/${psA}/notice"
              payload: { action: "DELIVER" }
              as: PavementEngineer
            - call: "POST /pavement/projects/${pA}/advance"
              payload: { action: "START_CONSTRUCTION" }
              as: PavementEngineer
            - call: "POST /pavement/acceptance-tests"
              payload: { project_segment_id: "${psA}", core_density_pct: 96.0, iri_in_per_mi: 60.0, thickness_in: 2.0, witness_inspector_user_id: "insp-witness-a" }
              as: Inspector
              as_user_id: "insp-witness-a"
              captures: { tA: "$.data.id", pfA: "$.data.computed_pay_factor", outA: "$.data.computed_outcome" }
            - call: "POST /pavement/acceptance-tests/${tA}/decide"
              payload: { decision: "PASS", decision_note: "test decision recorded" }
              as: Inspector
              as_user_id: "insp-decider-a"
            - call: "POST /pavement/projects/${pA}/substantial-completion"
              payload: {}
              as: Contractor
              as_user_id: "${ctr}"
            - call: "POST /pavement/projects/${pA}/accept"
              payload: { acceptance_note: "final acceptance signed" }
              as: Inspector
              as_user_id: "insp-acceptor-1"
              captures: { finalA: "$.data.accepted_at" }
            - call: "POST /pavement/projects"
              payload: { scenario_id: "${sc}", project_name: "Oak St crack seal", geo_zone: "Z1", planned_start_date: "2026-10-01T00:00:00Z", planned_end_date: "2026-10-31T00:00:00Z" }
              as: PavementEngineer
              captures: { pB: "$.data.id", pBv: "$.data.version" }
            - call: "POST /pavement/project-segments"
              payload: { project_id: "${pB}", segment_id: "${seg3}", candidate_id: "${cand_b}", work_window_start: "2026-10-01T00:00:00Z", work_window_end: "2026-10-31T00:00:00Z", expected_project_version: "${pBv}", design_thickness_in: 2.0 }
              as: PavementEngineer
              captures: { psB: "$.data.id" }
            - call: "POST /pavement/projects/${pB}/advance"
              payload: { action: "START_COORDINATION" }
              as: PavementEngineer
            - call: "GET /pavement/utility-coordinations"
              payload: { project_id: "${pB}" }
              as: UtilityCoordinator
              captures: { ub0: "$.data[0].id", ub1: "$.data[1].id", ub2: "$.data[2].id", ub3: "$.data[3].id" }
            - call: "POST /pavement/utility-coordinations/${ub0}/respond"
              payload: { response: "CLEAR", response_note: "no conflict with the paving window" }
              as: UtilityCoordinator
            - call: "POST /pavement/utility-coordinations/${ub1}/respond"
              payload: { response: "CLEAR", response_note: "no conflict with the paving window" }
              as: UtilityCoordinator
            - call: "POST /pavement/utility-coordinations/${ub2}/respond"
              payload: { response: "CLEAR", response_note: "no conflict with the paving window" }
              as: UtilityCoordinator
            - call: "POST /pavement/utility-coordinations/${ub3}/respond"
              payload: { response: "CLEAR", response_note: "no conflict with the paving window" }
              as: UtilityCoordinator
            - call: "POST /pavement/projects/${pB}/advance"
              payload: { action: "BID_READY" }
              as: PavementEngineer
            - call: "POST /pavement/projects/${pB}/award"
              payload: { contractor_id: "${ctr}", award_amount_cents: 5289971 }
              as: BudgetOfficer
              as_user_id: "officer-award-1"
            - call: "POST /pavement/project-segments/${psB}/notice"
              payload: { action: "SCHEDULE", parking_restriction_start: "2026-10-01T00:00:00Z", parking_restriction_end: "2026-10-31T00:00:00Z", driveway_access_plan: "MAINTAINED" }
              as: PavementEngineer
            - call: "POST /pavement/project-segments/${psB}/notice"
              payload: { action: "DELIVER" }
              as: PavementEngineer
            - call: "POST /pavement/projects/${pB}/advance"
              payload: { action: "START_CONSTRUCTION" }
              as: PavementEngineer
            - call: "POST /pavement/acceptance-tests"
              payload: { project_segment_id: "${psB}", core_density_pct: 91.9, iri_in_per_mi: 60.0, thickness_in: 2.0, witness_inspector_user_id: "insp-witness-b" }
              as: Inspector
              as_user_id: "insp-witness-b"
              captures: { tB: "$.data.id", pfB: "$.data.computed_pay_factor", outB: "$.data.computed_outcome" }
          trigger:
            - call: "POST /pavement/acceptance-tests/${tB}/decide"
              payload: { decision: "FAIL", decision_note: "test decision recorded" }
              as: Inspector
              as_user_id: "insp-decider-b"
            - call: "GET /pavement/contractors/${ctr}/scorecard"
              payload: {}
              as: PavementEngineer
              captures: { sc_interim: "$.data.interim_performance_score", sc_final: "$.data.final_performance_score", sc_standing: "$.data.standing", iq: "$.data.interim_quality_component", isch: "$.data.interim_schedule_component", irem: "$.data.interim_remediation_component", fq: "$.data.final_quality_component", fsch: "$.data.final_schedule_component", frem: "$.data.final_remediation_component", pcount: "$.data.passed_test_count", fcount: "$.data.failed_test_count", rcount: "$.data.remediation_event_count", late: "$.data.days_late_total", acc: "$.data.accepted_project_count" }
          assert:
            - "${pfA} == 1.0200 and ${outA} == PASS; ${pfB} == 0.0000 and ${outB} == FAIL"
            - "${pcount} == 1 and ${fcount} == 1 and ${rcount} == 1 and ${late} == 0 and ${acc} == 1"
            - "${iq} == 50.00 and ${isch} == 100.00 and ${irem} == 92.00"
            - "${sc_interim} == 75.5 (0.45*50.00 + 0.30*100.00 + 0.25*92.00)"
            - "${fq} == 100.00 and ${fsch} == 100.00 and ${frem} == 100.00"
            - "${sc_final} == 100.0 — the failed test on the IN_CONSTRUCTION project is invisible to the FINAL variant"
            - "${sc_standing} == WATCH — standing derives from INTERIM, not FINAL"
