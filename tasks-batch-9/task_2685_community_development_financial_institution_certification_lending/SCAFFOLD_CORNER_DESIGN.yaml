          - endpoints[GET /cdfi/loan-products]
          - endpoints[GET /cdfi/matching-fund-commitments]
          - endpoints[GET /cdfi/compliance-measurements]
        distinguishing_aspect: |
          Every child of Institution and of AwardApplication is reachable BOTH by its own id and
          by a parent-filtered flat list, and the filters are honoured rather than ignored: with
          two institutions on file, each institution-scoped list returns exactly its owner's one
