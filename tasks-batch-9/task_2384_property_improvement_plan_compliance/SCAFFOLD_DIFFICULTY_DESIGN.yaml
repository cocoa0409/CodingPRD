            - call: "POST /pip/plans/${plan_id}/acknowledge"
              payload: {}
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "GET /pip/plans/${plan_id}"
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { plan_v: $.data.version }
            - call: "POST /pip/capital-budgets"
              payload: { plan_id: "${plan_id}", total_authorized_cents: 4000000, contingency_pct: 0.10, financing_source: "TERM_LOAN", expected_plan_version: "${plan_v}" }
              as: FranchiseeOwner
