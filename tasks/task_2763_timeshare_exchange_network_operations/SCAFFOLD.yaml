# =============================================================================
# SCAFFOLD — Timeshare Exchange Network Operations
# Sections §1.0 – §1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml and §1.9
# lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2763. Timeshare Exchange Network Operations (vacation exchange network): resort affiliation with
  inventory deposit requirements and quality rating assignment, member enrollment, tier levels and
  exchange fee schedules, deposit valuation using trading power based on season, unit size and resort
  demand, exchange request matching with waitlist, priority windows and confirmation rules, deposit
  expiration, extension purchases and deposit-first advantage rules, inventory balancing with rental
  of unmatched inventory and getaway offerings, cancellation and reinstatement policy with fees and
  deposit restoration, member disputes over trading power and resort quality complaints

domain_name: "timeshare-exchange-network"
api_prefix: "/exchange-network"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - "Ops-run checkpoint"
    - "Dual-variant calculation"
    - "Optimistic concurrency"
    - "Derived field reconciliation"

  entity_topology: flat
  # Twelve peer entities linked exclusively by foreign keys. Only two URL paths
  # nest (season-bands and ledger-entries as reverse-reachability sub-resources);
  # every other resource is addressed at its own top-level collection with the
  # parent supplied in the request body, never in the path.

  state_machine_shape: parallel
  # Deposit carries two independent state dimensions on one row —
  # `deposit_status` (exchange pipeline) and `rental_status` (getaway pipeline) —
  # that advance through different triggers and only interact through explicit
  # cross-dimension guards. Layered on top: ExchangeRequest is branching
  # fork-join with a MATCHED -> WAITLISTED -> MATCHED loop, Dispute is cyclic
  # (UNDER_REVIEW <-> INFO_REQUESTED, capped at 2 rounds), and Resort and Member
  # both re-enter ACTIVE from PROBATION / SUSPENDED.

  relationship_patterns:
    - one_to_many          # Resort -> SeasonBand, Member -> Deposit, Member -> LedgerEntry
    - self_referential     # Confirmation.reinstated_from_confirmation_id -> Confirmation.id
    - cross_aggregate      # Confirmation binds an ExchangeRequest of member A to a Deposit of member B
    - polymorphic          # LedgerEntry.related_entity_type + related_entity_id

  role_model: peer_roles
  # Member owns enrollment / deposits / requests / confirmations / disputes-as-filer.
  # ResortManager owns resort profile and season calendar.
  # NetworkOperator owns affiliation, demand ratings, matching runs and the clock.
  # DisputeAnalyst owns the dispute review pipeline and can never file one.

  consistency_model: immediate

  difficulty_level: expert
  # 12 entities / 52 endpoints / 40 error codes / 8 calculations (3 with variants) /
  # 9 state machines across 8 entities.

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: MembershipTier
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: tier_code
        type: enum
        source: input
        description: "Tier identifier; drives every fee and window in the exchange fee schedule."
        constraints: "one of {BASIC, PLUS, ELITE}; unique across all MembershipTier rows"
      - name: annual_dues_cents
        type: integer
        source: input
        description: "Annual dues withheld from each dues payment before the remainder becomes wallet credit."
        constraints: ">= 0"
      - name: base_exchange_fee_cents
        type: integer
        source: input
        description: "Base component of the exchange charge computed by calculations.exchange_charge."
        constraints: ">= 0"
      - name: priority_surcharge_cents
        type: integer
        source: input
        description: "Flat surcharge added to the exchange charge subtotal in return for the tier's priority window."
        constraints: ">= 0"
      - name: priority_window_days
        type: integer
        source: input
        description: "How many days ahead of the matching run's as-of date this tier may see candidate inventory."
        constraints: ">= 1"
      - name: deposit_first_bonus_pct
        type: integer
        source: input
        description: "Percentage uplift applied to the funding deposit's awarded_power for DEPOSIT_FIRST requests."
        constraints: "0..100"
      - name: max_active_requests
        type: integer
        source: input
        description: "Cap on the member's ExchangeRequest rows whose status is in {SUBMITTED, WAITLISTED, MATCHED}."
        constraints: ">= 1"
      - name: cancellation_fee_cents
        type: integer
        source: input
        description: "Wallet charge levied when a Confirmation of a member on this tier is cancelled."
        constraints: ">= 0"
      - name: reinstatement_fee_cents
        type: integer
        source: input
        description: "Wallet charge levied when a cancelled Confirmation is reinstated."
        constraints: ">= 0"
      - name: extension_fee_cents_per_month
        type: integer
        source: input
        description: "Wallet charge per extension month purchased on a Deposit."
        constraints: ">= 0"

  - name: Resort
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: "Resort trade name."
        constraints: "1..120 chars"
      - name: region_code
        type: string
        source: input
        description: "Geographic region code, e.g. US-CO."
        constraints: "2..8 chars"
      - name: units_per_size
        type: integer
        source: input
        default: 2
        description: "Aggregate nightly capacity per unit_size: how many deposits of one unit_size may cover the same night."
        constraints: ">= 1"
      - name: demand_index
        type: integer
        source: input
        default: 3
        description: "Operator-assigned demand rating feeding the demand multiplier of calculations.deposit_trading_power."
        constraints: "1..5"
      - name: required_annual_deposit_units
        type: integer
        source: input
        description: "Inventory deposit obligation for one affiliation year, in whole weeks."
        constraints: ">= 1"
      - name: initial_quality_rating
        type: enum
        source: input
        description: "Quality rating assigned at affiliation; governs quality_rating until review_count reaches MIN_REVIEWS_FOR_SCORE."
        constraints: "one of {GOLD_CROWN, SILVER_CROWN, STANDARD, HOSPITALITY}"
      - name: affiliation_status
        type: enum
        source: system
        default: PENDING_AFFILIATION
        description: "Affiliation lifecycle state."
        constraints: "one of {PENDING_AFFILIATION, ACTIVE, PROBATION, SUSPENDED, TERMINATED}"
      - name: affiliated_on
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which affiliation was granted; anchors the affiliation-year window."
      - name: quality_score
        type: number
        source: computed
        default: null
        description: "Weighted mean review composite over the review window; null until review_count >= MIN_REVIEWS_FOR_SCORE."
        constraints: "2 decimal places; 1.00..10.00"
      - name: review_count
        type: integer
        source: computed
        default: 0
        description: "Count of ResortQualityReview rows whose resort_id equals this resort's id."
        constraints: ">= 0"
      - name: quality_rating
        type: enum
        source: computed
        description: "Effective quality rating: score-derived band shifted down by downgrade_notches; equals initial_quality_rating while quality_score is null."
        constraints: "one of {GOLD_CROWN, SILVER_CROWN, STANDARD, HOSPITALITY}"
      - name: complaint_strikes
        type: integer
        source: computed
        default: 0
        description: "Count of upheld RESORT_QUALITY disputes since the last downgrade; resets to 0 when it reaches COMPLAINT_STRIKE_THRESHOLD."
        constraints: "0..1 after each reset"
      - name: downgrade_notches
        type: integer
        source: computed
        default: 0
        description: "How many ladder positions the score-derived rating is shifted down by accumulated complaint strikes."
        constraints: "0..3"
      - name: deposits_committed_count
        type: integer
        source: computed
        default: 0
        description: "Count of Deposit rows for this resort whose deposit_status is in {BANKED, RESERVED, USED}."
        constraints: ">= 0"
      - name: committed_nights
        type: integer
        source: computed
        default: 0
        description: "OCCUPANCY_NIGHTS_PER_DEPOSIT * deposits_committed_count; the conserved occupancy quantity of INV_NIGHTS."
        constraints: ">= 0"

  - name: SeasonBand
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: resort_id
        type: string
        source: input
        description: "FK -> Resort.id; the resort whose season calendar this band belongs to."
      - name: band_code
        type: enum
        source: input
        description: "Season classification of the covered days."
        constraints: "one of {PLATINUM, GOLD, SILVER, BRONZE}"
      - name: start_month_day
        type: string
        source: input
        description: "First covered day of the year, inclusive, as MM-DD."
        constraints: "matches ^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
      - name: end_month_day
        type: string
        source: input
        description: "Last covered day of the year, inclusive, as MM-DD; must not sort before start_month_day."
        constraints: "matches ^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
      - name: season_multiplier
        type: number
        source: computed
        description: "SEASON_MULT[band_code], denormalized so the season factor is readable without a constants lookup."
        constraints: "one of {1.50, 1.25, 1.00, 0.70}"

  - name: Member
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: email
        type: string
        source: input
        description: "Login/contact address."
        constraints: "unique across all Member rows; contains '@'"
      - name: full_name
        type: string
        source: input
        description: "Member legal name."
        constraints: "1..120 chars"
      - name: tier_id
        type: string
        source: input
        description: "FK -> MembershipTier.id; the tier whose fee schedule and windows apply to this member."
      - name: home_resort_id
        type: string
        source: input
        default: null
        description: "FK -> Resort.id; resort of the member's underlying ownership week; optional."
      - name: enrollment_status
        type: enum
        source: system
        default: PENDING_PAYMENT
        description: "Enrollment lifecycle state."
        constraints: "one of {PENDING_PAYMENT, ACTIVE, LAPSED, SUSPENDED, CANCELLED}"
      - name: dues_paid_through
        type: string
        source: system
        default: null
        description: "Date (YYYY-MM-DD) through which annual dues are paid; drives the LAPSED sweep of matching-run step 0."
      - name: trading_power_balance
        type: integer
        source: computed
        default: 0
        description: "Spendable trading power; equals SUM(LedgerEntry.power_delta) over this member (invariant INV_POWER)."
        constraints: ">= 0"
      - name: wallet_credit_cents
        type: integer
        source: computed
        default: 0
        description: "Spendable cash credit; equals SUM(LedgerEntry.cash_delta_cents) over this member (invariant INV_CASH)."
        constraints: ">= 0"
      - name: active_request_count
        type: integer
        source: computed
        default: 0
        description: "Count of this member's ExchangeRequest rows whose status is in {SUBMITTED, WAITLISTED, MATCHED}."
        constraints: ">= 0"

  - name: Deposit
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the depositing owner who is credited awarded_power."
      - name: resort_id
        type: string
        source: input
        description: "FK -> Resort.id; the resort whose week is banked."
      - name: unit_size
        type: enum
        source: input
        description: "Unit size of the banked week."
        constraints: "one of {STUDIO, ONE_BR, TWO_BR, THREE_BR}"
      - name: check_in_date
        type: string
        source: input
        description: "First night of the banked week (YYYY-MM-DD)."
      - name: season_band_code
        type: enum
        source: computed
        description: "band_code of the unique SeasonBand of resort_id whose MM-DD interval contains check_in_date."
        constraints: "one of {PLATINUM, GOLD, SILVER, BRONZE}"
      - name: occupancy_end_date
        type: string
        source: computed
        description: "check_in_date + OCCUPANCY_NIGHTS_PER_DEPOSIT days; exclusive end of the effective occupancy interval."
      - name: awarded_power
        type: integer
        source: computed
        description: "calculations.deposit_trading_power variant AT_DEPOSIT, frozen at creation and credited to the owner."
        constraints: ">= 1"
      - name: settlement_power
        type: integer
        source: computed
        default: null
        description: "calculations.deposit_trading_power variant AT_SETTLEMENT, frozen when a matching run reserves or lists this deposit; null before that."
        constraints: ">= 1 when not null"
      - name: restoration_haircut_power
        type: integer
        source: system
        default: 0
        description: "Cumulative power removed from this deposit by PRORATED_RESTORE restorations."
        constraints: ">= 0"
      - name: remaining_power
        type: integer
        source: computed
        default: 0
        description: "awarded_power - restoration_haircut_power; the amount forfeited on expiry, withdrawal or getaway listing."
        constraints: ">= 0"
      - name: deposit_status
        type: enum
        source: system
        default: BANKED
        description: "Exchange-pipeline dimension of this row's state."
        constraints: "one of {BANKED, RESERVED, USED, EXPIRED, WITHDRAWN}"
      - name: rental_status
        type: enum
        source: system
        default: NOT_LISTED
        description: "Getaway-pipeline dimension of this row's state, advanced by triggers disjoint from deposit_status."
        constraints: "one of {NOT_LISTED, LISTED_GETAWAY, RENTED}"
      - name: expires_at
        type: datetime
        source: computed
        description: "check_in_date at 00:00:00.000Z + DEPOSIT_LIFETIME_DAYS + EXTENSION_DAYS_PER_MONTH * extension_months_purchased."
      - name: extension_months_purchased
        type: integer
        source: system
        default: 0
        description: "Cumulative extension months bought on this deposit."
        constraints: "0..12"

  - name: ExchangeRequest
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the requesting member."
      - name: requested_resort_id
        type: string
        source: input
        description: "FK -> Resort.id; the resort the member wants to stay at."
      - name: requested_unit_size
        type: enum
        source: input
        description: "Unit size sought; candidate deposits must match exactly."
        constraints: "one of {STUDIO, ONE_BR, TWO_BR, THREE_BR}"
      - name: window_start_date
        type: string
        source: input
        description: "First acceptable check-in date (YYYY-MM-DD), inclusive."
      - name: window_end_date
        type: string
        source: input
        description: "Last acceptable check-in date (YYYY-MM-DD), inclusive."
      - name: deposit_id
        type: string
        source: input
        default: null
        description: "FK -> Deposit.id; funding deposit whose awarded_power sets the power budget; null at creation for REQUEST_FIRST."
      - name: funding_mode
        type: enum
        source: computed
        description: "DEPOSIT_FIRST when deposit_id was supplied in the creation body, REQUEST_FIRST when it was null."
        constraints: "one of {DEPOSIT_FIRST, REQUEST_FIRST}"
      - name: required_power_estimate
        type: integer
        source: computed
        description: "calculations.deposit_trading_power evaluated for (requested_resort_id, requested_unit_size, window_start_date) at creation time."
        constraints: ">= 1"
      - name: power_budget
        type: integer
        source: computed
        default: 0
        description: "calculations.request_power_budget; the affordability ceiling used by the matching pass; 0 while deposit_id is null."
        constraints: ">= 0"
      - name: quoted_charge_cents
        type: integer
        source: computed
        description: "calculations.exchange_charge total, debited from the member's wallet at creation."
        constraints: ">= 0"
      - name: charge_refunded_cents
        type: integer
        source: system
        default: 0
        description: "Cumulative wallet refund of quoted_charge_cents returned on cancellation, expiry or denial."
        constraints: ">= 0"
      - name: priority_score
        type: integer
        source: computed
        default: 0
        description: "calculations.request_priority_score; recomputed for every non-terminal request at matching-run step 3."
        constraints: ">= 0"
      - name: decline_count
        type: integer
        source: system
        default: 0
        description: "How many times this request's member declined an offered match."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Request lifecycle state."
        constraints: "one of {SUBMITTED, WAITLISTED, MATCHED, CONFIRMED, CANCELLED, EXPIRED, DENIED}"
      - name: matched_deposit_id
        type: string
        source: system
        default: null
        description: "FK -> Deposit.id; the deposit reserved for this request by the matching pass."
      - name: matched_hold_expires_at
        type: datetime
        source: system
        default: null
        description: "Instant after which an unconfirmed MATCHED request is expired by matching-run step 2."
      - name: waitlisted_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the request first entered WAITLISTED."

  - name: Confirmation
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: exchange_request_id
        type: string
        source: input
        description: "FK -> ExchangeRequest.id; the request being confirmed."
      - name: awarded_deposit_id
        type: string
        source: system
        description: "FK -> Deposit.id; copied from the request's matched_deposit_id at confirmation."
      - name: awarded_check_in_date
        type: string
        source: computed
        description: "check_in_date copied from the awarded deposit; anchors the cancellation-window and completion sweeps."
      - name: power_debited
        type: integer
        source: computed
        description: "Trading power taken from the confirming member; equals the awarded deposit's settlement_power."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: CONFIRMED
        description: "Confirmation lifecycle state."
        constraints: "one of {CONFIRMED, COMPLETED, CANCELLED, REINSTATED}"
      - name: cancelled_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of cancellation; anchors the reinstatement window."
      - name: cancellation_fee_cents
        type: integer
        source: system
        default: 0
        description: "Wallet charge actually levied at cancellation, including LATE_CANCEL_SURCHARGE_CENTS when applicable."
        constraints: ">= 0"
      - name: restoration_variant
        type: enum
        source: system
        default: null
        description: "Which calculations.cancellation_settlement variant was selected at cancellation."
        constraints: "one of {FULL_RESTORE, PRORATED_RESTORE} when not null"
      - name: restored_power
        type: integer
        source: system
        default: 0
        description: "Trading power returned to the confirming member at cancellation."
        constraints: ">= 0"
      - name: reinstatement_fee_cents
        type: integer
        source: system
        default: 0
        description: "Wallet charge levied on the successor confirmation created by reinstatement."
        constraints: ">= 0"
      - name: reinstated_from_confirmation_id
        type: string
        source: system
        default: null
        description: "FK -> Confirmation.id; set on the successor row to the cancelled predecessor it reinstates."

  - name: MatchingRun
    parent: null
    common_fields: true
    kind: event
    fields:
      - name: run_sequence
        type: integer
        source: computed
        description: "1 + MAX(run_sequence) over existing MatchingRun rows, or 1 when none exist."
        constraints: ">= 1"
      - name: as_of_utc
        type: datetime
        source: system
        description: "Logical-clock instant at which this run executed; every sweep compares against it."
      - name: note
        type: string
        source: input
        default: null
        description: "Free-text operator annotation."
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Run lifecycle state; a run is COMPLETED before its response is emitted."
        constraints: "one of {PENDING, COMPLETED}"
      - name: lapsed_member_count
        type: integer
        source: computed
        default: 0
        description: "Members moved ACTIVE -> LAPSED by step 0."
      - name: expired_deposit_count
        type: integer
        source: computed
        default: 0
        description: "Deposits moved BANKED -> EXPIRED by step 1."
      - name: probation_resort_count
        type: integer
        source: computed
        default: 0
        description: "Resorts moved ACTIVE -> PROBATION by the step 1 cascade."
      - name: expired_request_count
        type: integer
        source: computed
        default: 0
        description: "Requests moved to EXPIRED by step 2 (window elapsed or match hold elapsed)."
      - name: denied_request_count
        type: integer
        source: computed
        default: 0
        description: "Requests moved to DENIED by step 2 because their funding deposit left {BANKED}."
      - name: matched_count
        type: integer
        source: computed
        default: 0
        description: "Requests moved to MATCHED by step 3."
      - name: waitlisted_count
        type: integer
        source: computed
        default: 0
        description: "Requests moved SUBMITTED -> WAITLISTED by step 3 because their candidate pool was empty."
      - name: completed_confirmation_count
        type: integer
        source: computed
        default: 0
        description: "Confirmations moved CONFIRMED -> COMPLETED by step 4."
      - name: getaway_listed_count
        type: integer
        source: computed
        default: 0
        description: "Deposits whose rental_status moved NOT_LISTED -> LISTED_GETAWAY by step 5."

  - name: GetawayOffer
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: deposit_id
        type: string
        source: system
        description: "FK -> Deposit.id; the unmatched inventory being rented for cash instead of exchanged."
      - name: created_by_run_id
        type: string
        source: system
        default: null
        description: "FK -> MatchingRun.id; the run whose step 5 listed this offer; null when the listing came from a PRORATED_RESTORE cascade."
      - name: list_price_cents
        type: integer
        source: computed
        description: "calculations.getaway_list_price result, clamped into [GETAWAY_FLOOR_CENTS, GETAWAY_CEILING_CENTS]."
        constraints: ">= 1"
      - name: urgency_discount_pct
        type: integer
        source: computed
        description: "Urgency tier applied by calculations.getaway_list_price."
        constraints: "one of {0, 10, 20, 35}"
      - name: status
        type: enum
        source: system
        default: LISTED
        description: "Offer lifecycle state."
        constraints: "one of {LISTED, BOOKED, WITHDRAWN, EXPIRED}"
      - name: booked_by_member_id
        type: string
        source: system
        default: null
        description: "FK -> Member.id; the renting member; never equal to the deposit owner."
      - name: booked_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of booking."

  - name: Dispute
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the filing member."
      - name: subject_type
        type: enum
        source: input
        description: "Which grievance family this dispute belongs to."
        constraints: "one of {TRADING_POWER, RESORT_QUALITY}"
      - name: deposit_id
        type: string
        source: input
        default: null
        description: "FK -> Deposit.id; required and owner-matched when subject_type is TRADING_POWER, must be null otherwise."
      - name: resort_id
        type: string
        source: input
        default: null
        description: "FK -> Resort.id; required when subject_type is RESORT_QUALITY, must be null otherwise."
      - name: confirmation_id
        type: string
        source: input
        default: null
        description: "FK -> Confirmation.id; required and COMPLETED when subject_type is RESORT_QUALITY, must be null otherwise."
      - name: narrative
        type: string
        source: input
        description: "Member's written grievance."
        constraints: "1..2000 chars"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Dispute lifecycle state."
        constraints: "one of {OPEN, UNDER_REVIEW, INFO_REQUESTED, RESOLVED_UPHELD, RESOLVED_DENIED, WITHDRAWN}"
      - name: round_count
        type: integer
        source: system
        default: 0
        description: "How many information requests the analyst has issued on this dispute."
        constraints: "0..MAX_DISPUTE_ROUNDS"
      - name: granted_power_adjustment
        type: integer
        source: system
        default: 0
        description: "Trading power added to the cited deposit's awarded_power when a TRADING_POWER dispute is upheld."
        constraints: ">= 0"
      - name: resolution_note
        type: string
        source: system
        default: null
        description: "Analyst's written resolution rationale."

  - name: ResortQualityReview
    parent: null
    common_fields: true
    kind: event
    fields:
      - name: resort_id
        type: string
        source: input
        description: "FK -> Resort.id; the reviewed resort; must equal the awarded deposit's resort_id of confirmation_id."
      - name: confirmation_id
        type: string
        source: input
        description: "FK -> Confirmation.id; proof-of-stay; must be COMPLETED and owned by the reviewing member."
      - name: cleanliness_score
        type: integer
        source: input
        description: "Cleanliness rating."
        constraints: "1..10"
      - name: service_score
        type: integer
        source: input
        description: "Service rating."
        constraints: "1..10"
      - name: amenities_score
        type: integer
        source: input
        description: "Amenities rating."
        constraints: "1..10"
      - name: composite_score
        type: number
        source: computed
        description: "calculations.resort_quality_score per-review composite."
        constraints: "2 decimal places; 1.00..10.00"

  - name: LedgerEntry
    parent: null
    common_fields: true
    kind: event
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member whose balances this entry moves."
      - name: entry_type
        type: enum
        source: system
        description: "Which declared transition produced this entry."
        constraints: >-
          one of {DEPOSIT_CREDIT, DEPOSIT_WITHDRAWAL_REVERSAL, DEPOSIT_EXPIRY_FORFEIT,
          SETTLEMENT_ADJUSTMENT, EXCHANGE_DEBIT, EXCHANGE_RESTORATION, RESTORATION_HAIRCUT,
          GETAWAY_LISTING_FORFEIT, DISPUTE_POWER_GRANT, DUES_PAYMENT, EXCHANGE_CHARGE,
          EXCHANGE_CHARGE_REFUND, CANCELLATION_FEE, REINSTATEMENT_FEE, EXTENSION_FEE,
          GETAWAY_BOOKING_PAYMENT}
      - name: power_delta
        type: integer
        source: system
        default: 0
        description: "Signed change applied to Member.trading_power_balance by this entry; 0 for pure cash entries."
      - name: cash_delta_cents
        type: integer
        source: system
        default: 0
        description: "Signed change applied to Member.wallet_credit_cents by this entry; 0 for pure power entries."
      - name: related_entity_type
        type: enum
        source: system
        description: "Which entity family the entry was raised against."
        constraints: "one of {DEPOSIT, EXCHANGE_REQUEST, CONFIRMATION, GETAWAY_OFFER, DISPUTE, MEMBER}"
      - name: related_entity_id
        type: string
        source: system
        description: "Identifier of the related row inside related_entity_type; identity only, never a decision input."
      - name: description
        type: string
        source: system
        description: "Human-readable summary of the movement."

# -----------------------------------------------------------------------------
# §1.2 State Machines
# -----------------------------------------------------------------------------
state_machines:

  - entity: Resort
    field: affiliation_status
    shape: cyclic
    states: [PENDING_AFFILIATION, ACTIVE, PROBATION, SUSPENDED, TERMINATED]
    initial_state: PENDING_AFFILIATION
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_AFFILIATION
        to: ACTIVE
        trigger: "POST /exchange-network/resorts/{resort_id}/affiliation"
        guard: "at least one SeasonBand row exists for this resort, otherwise ERR_AFFILIATION_REQUIRES_SEASON_BANDS"
        side_effects:
          - "sets affiliated_on to the current logical clock instant"
          - "sets quality_rating to initial_quality_rating"
      - from: ACTIVE
        to: PROBATION
        trigger: "POST /exchange-network/matching-runs (step 1 expiry cascade), POST /exchange-network/disputes/{dispute_id}/resolution with outcome UPHELD on a RESORT_QUALITY dispute, or POST /exchange-network/resorts/{resort_id}/status-changes with to_status PROBATION"
        guard: "from the run cascade: shortfall_by_stay_year computed by calculations.resort_deposit_obligation_shortfall is >= 1; from the dispute path: complaint_strikes reached COMPLAINT_STRIKE_THRESHOLD; from an operator status-change: no additional guard"
        side_effects:
          - "increments the enclosing MatchingRun's probation_resort_count by 1 when the trigger was a matching run"
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /exchange-network/resorts/{resort_id}/status-changes with to_status ACTIVE"
        guard: "shortfall_by_stay_year computed by calculations.resort_deposit_obligation_shortfall equals 0"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /exchange-network/resorts/{resort_id}/status-changes with to_status SUSPENDED"
        guard: null
        side_effects:
          - "no Deposit may be created against this resort while suspended (validation ERR_RESORT_NOT_AFFILIATED)"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /exchange-network/resorts/{resort_id}/status-changes with to_status SUSPENDED"
        guard: null
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /exchange-network/resorts/{resort_id}/status-changes with to_status ACTIVE"
        guard: null
        side_effects: []
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /exchange-network/resorts/{resort_id}/status-changes with to_status TERMINATED"
        guard: null
        side_effects: []
      - from: PROBATION
        to: TERMINATED
        trigger: "POST /exchange-network/resorts/{resort_id}/status-changes with to_status TERMINATED"
        guard: null
        side_effects: []
    notes: >-
      Cyclic: ACTIVE -> PROBATION -> ACTIVE and ACTIVE -> SUSPENDED -> ACTIVE both re-enter a
      previously occupied state, and the PROBATION -> ACTIVE edge carries a guard the
      ACTIVE -> PROBATION edge does not, so the cycle is not symmetric.

  - entity: Member
    field: enrollment_status
    shape: cyclic
    states: [PENDING_PAYMENT, ACTIVE, LAPSED, SUSPENDED, CANCELLED]
    initial_state: PENDING_PAYMENT
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /exchange-network/members/{member_id}/dues-payments"
        guard: "amount_cents >= tier.annual_dues_cents, otherwise ERR_INSUFFICIENT_DUES_PAYMENT"
        side_effects:
          - "sets dues_paid_through to the submitted paid_through_date"
          - "writes a DUES_PAYMENT LedgerEntry with cash_delta_cents = amount_cents - tier.annual_dues_cents"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /exchange-network/matching-runs (step 0 dues sweep)"
        guard: "dues_paid_through is earlier than date(MatchingRun.as_of_utc)"
        side_effects:
          - "increments the enclosing MatchingRun's lapsed_member_count by 1"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /exchange-network/members/{member_id}/dues-payments"
        guard: "amount_cents >= tier.annual_dues_cents AND paid_through_date is not earlier than date(current logical clock)"
        side_effects:
          - "sets dues_paid_through to the submitted paid_through_date"
          - "writes a DUES_PAYMENT LedgerEntry with cash_delta_cents = amount_cents - tier.annual_dues_cents"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /exchange-network/members/{member_id}/status-changes with to_status SUSPENDED"
        guard: null
        side_effects: []
      - from: LAPSED
        to: SUSPENDED
        trigger: "POST /exchange-network/members/{member_id}/status-changes with to_status SUSPENDED"
        guard: null
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /exchange-network/members/{member_id}/status-changes with to_status ACTIVE"
        guard: "dues_paid_through is not earlier than date(current logical clock)"
        side_effects: []
      - from: LAPSED
        to: CANCELLED
        trigger: "POST /exchange-network/members/{member_id}/status-changes with to_status CANCELLED"
        guard: null
        side_effects:
          - "every ExchangeRequest of this member whose status is in {SUBMITTED, WAITLISTED, MATCHED} moves to CANCELLED and releases its reserved deposit back to BANKED"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /exchange-network/members/{member_id}/status-changes with to_status CANCELLED"
        guard: null
        side_effects:
          - "every ExchangeRequest of this member whose status is in {SUBMITTED, WAITLISTED, MATCHED} moves to CANCELLED and releases its reserved deposit back to BANKED"
    notes: >-
      Cyclic: ACTIVE -> LAPSED -> ACTIVE re-enters ACTIVE through a different trigger than the
      one that first entered it, and SUSPENDED -> ACTIVE carries a dues guard that
      LAPSED -> ACTIVE satisfies by construction.

  - entity: Deposit
    dimension: exchange_pipeline
    field: deposit_status
    shape: branching
    states: [BANKED, RESERVED, USED, EXPIRED, WITHDRAWN]
    initial_state: BANKED
    terminal_states: [EXPIRED, WITHDRAWN]
    transitions:
      - from: BANKED
        to: RESERVED
        trigger: "POST /exchange-network/matching-runs (step 3 matching pass selects this deposit for a request)"
        guard: "rental_status equals NOT_LISTED AND expires_at is later than MatchingRun.as_of_utc AND settlement_power <= request.power_budget"
        side_effects:
          - "freezes settlement_power using calculations.deposit_trading_power variant AT_SETTLEMENT"
          - "sets the matched request's matched_deposit_id and matched_hold_expires_at"
      - from: RESERVED
        to: BANKED
        trigger: "POST /exchange-network/exchange-requests/{request_id}/decline, POST /exchange-network/exchange-requests/{request_id}/cancellation, or POST /exchange-network/matching-runs (step 2 hold-expiry sweep)"
        guard: "no Confirmation whose awarded_deposit_id is this deposit has status CONFIRMED"
        side_effects:
          - "clears the request's matched_deposit_id and matched_hold_expires_at"
      - from: RESERVED
        to: USED
        trigger: "POST /exchange-network/confirmations"
        guard: "the request's status equals MATCHED AND matched_hold_expires_at is later than the current logical clock instant"
        side_effects:
          - "debits settlement_power from the confirming member (EXCHANGE_DEBIT LedgerEntry)"
          - "posts a SETTLEMENT_ADJUSTMENT LedgerEntry to the depositing owner when settlement_power - awarded_power is not 0"
      - from: USED
        to: BANKED
        trigger: "POST /exchange-network/confirmations/{confirmation_id}/cancellation"
        guard: "the confirmation's status equals CONFIRMED"
        side_effects:
          - "restores power to the cancelling member per calculations.cancellation_settlement"
          - "adds the PRORATED_RESTORE haircut to restoration_haircut_power and recomputes remaining_power when the variant is PRORATED_RESTORE"
      - from: BANKED
        to: EXPIRED
        trigger: "POST /exchange-network/matching-runs (step 1 expiry sweep)"
        guard: "expires_at is not later than MatchingRun.as_of_utc"
        side_effects:
          - "forfeits remaining_power from the depositing owner (DEPOSIT_EXPIRY_FORFEIT LedgerEntry)"
          - "decrements the resort's deposits_committed_count and committed_nights"
          - "moves any LISTED GetawayOffer of this deposit to EXPIRED"
      - from: BANKED
        to: WITHDRAWN
        trigger: "POST /exchange-network/deposits/{deposit_id}/withdrawal"
        guard: "rental_status equals NOT_LISTED"
        side_effects:
          - "reverses remaining_power from the depositing owner (DEPOSIT_WITHDRAWAL_REVERSAL LedgerEntry)"
          - "decrements the resort's deposits_committed_count and committed_nights"
    notes: >-
      Branching: BANKED forks to RESERVED, EXPIRED and WITHDRAWN with three disjoint guards and
      three different ledger consequences. RESERVED itself forks back to BANKED or forward to
      USED, and USED -> BANKED closes a loop whose re-entry to BANKED carries a haircut the
      original BANKED never had.

  - entity: Deposit
    dimension: getaway_pipeline
    field: rental_status
    shape: linear_with_reversal
    states: [NOT_LISTED, LISTED_GETAWAY, RENTED]
    initial_state: NOT_LISTED
    terminal_states: [RENTED]
    transitions:
      - from: NOT_LISTED
        to: LISTED_GETAWAY
        trigger: "POST /exchange-network/matching-runs (step 5 getaway sweep) or POST /exchange-network/confirmations/{confirmation_id}/cancellation whose restoration_variant is PRORATED_RESTORE"
        guard: "deposit_status equals BANKED"
        side_effects:
          - "creates a GetawayOffer with status LISTED priced by calculations.getaway_list_price"
          - "forfeits remaining_power from the depositing owner (GETAWAY_LISTING_FORFEIT LedgerEntry)"
          - "increments the enclosing MatchingRun's getaway_listed_count by 1 when the trigger was a matching run"
      - from: LISTED_GETAWAY
        to: NOT_LISTED
        trigger: "POST /exchange-network/getaway-offers/{offer_id}/withdrawal"
        guard: "the offer's status equals LISTED"
        side_effects:
          - "moves the GetawayOffer to WITHDRAWN"
          - "re-credits remaining_power to the depositing owner (DEPOSIT_CREDIT LedgerEntry)"
      - from: LISTED_GETAWAY
        to: RENTED
        trigger: "POST /exchange-network/getaway-offers/{offer_id}/bookings"
        guard: "the offer's status equals LISTED AND the booking member is not the depositing owner"
        side_effects:
          - "moves the GetawayOffer to BOOKED and stamps booked_by_member_id and booked_at"
          - "debits list_price_cents from the renting member's wallet (GETAWAY_BOOKING_PAYMENT LedgerEntry)"
    notes: >-
      A second, independent dimension on the same Deposit row. Its triggers never write
      deposit_status and the exchange-pipeline triggers never write rental_status; the two
      dimensions communicate only through the guards `rental_status equals NOT_LISTED` on
      BANKED -> RESERVED / BANKED -> WITHDRAWN and `deposit_status equals BANKED` on
      NOT_LISTED -> LISTED_GETAWAY.

  - entity: ExchangeRequest
    field: status
    shape: branching
    states: [SUBMITTED, WAITLISTED, MATCHED, CONFIRMED, CANCELLED, EXPIRED, DENIED]
    initial_state: SUBMITTED
    terminal_states: [CONFIRMED, CANCELLED, EXPIRED, DENIED]
    transitions:
      - from: SUBMITTED
        to: MATCHED
        trigger: "POST /exchange-network/matching-runs (step 3 matching pass)"
        guard: "the candidate pool for this request is non-empty"
        side_effects:
          - "sets matched_deposit_id to the winning deposit and moves that deposit BANKED -> RESERVED"
          - "sets matched_hold_expires_at to MatchingRun.as_of_utc + MATCH_HOLD_HOURS"
          - "increments the enclosing MatchingRun's matched_count by 1"
      - from: SUBMITTED
        to: WAITLISTED
        trigger: "POST /exchange-network/matching-runs (step 3 matching pass)"
        guard: "the candidate pool for this request is empty"
        side_effects:
          - "sets waitlisted_at to MatchingRun.as_of_utc"
          - "leaves matched_deposit_id null and reserves no deposit"
          - "increments the enclosing MatchingRun's waitlisted_count by 1"
      - from: WAITLISTED
        to: MATCHED
        trigger: "POST /exchange-network/matching-runs (step 3 matching pass of a later run)"
        guard: "the candidate pool for this request is non-empty"
        side_effects:
          - "sets matched_deposit_id to the winning deposit and moves that deposit BANKED -> RESERVED"
          - "sets matched_hold_expires_at to MatchingRun.as_of_utc + MATCH_HOLD_HOURS"
          - "increments the enclosing MatchingRun's matched_count by 1"
      - from: MATCHED
        to: WAITLISTED
        trigger: "POST /exchange-network/exchange-requests/{request_id}/decline"
        guard: "matched_deposit_id is not null"
        side_effects:
          - "releases the held deposit RESERVED -> BANKED and clears matched_deposit_id and matched_hold_expires_at"
          - "increments decline_count by 1, which lowers priority_score at the next matching run"
          - "sets waitlisted_at to the current logical clock instant"
      - from: MATCHED
        to: CONFIRMED
        trigger: "POST /exchange-network/confirmations"
        guard: "matched_hold_expires_at is later than the current logical clock instant"
        side_effects:
          - "creates a Confirmation with status CONFIRMED and moves the held deposit RESERVED -> USED"
          - "decrements the member's active_request_count by 1"
      - from: MATCHED
        to: EXPIRED
        trigger: "POST /exchange-network/matching-runs (step 2 hold-expiry sweep)"
        guard: "matched_hold_expires_at is not later than MatchingRun.as_of_utc"
        side_effects:
          - "releases the held deposit RESERVED -> BANKED"
          - "refunds quoted_charge_cents minus charge_refunded_cents to the member (EXCHANGE_CHARGE_REFUND LedgerEntry)"
          - "increments the enclosing MatchingRun's expired_request_count by 1"
      - from: SUBMITTED
        to: EXPIRED
        trigger: "POST /exchange-network/matching-runs (step 2 window-expiry sweep)"
        guard: "window_end_date is earlier than date(MatchingRun.as_of_utc)"
        side_effects:
          - "refunds quoted_charge_cents minus charge_refunded_cents to the member (EXCHANGE_CHARGE_REFUND LedgerEntry)"
          - "increments the enclosing MatchingRun's expired_request_count by 1"
      - from: WAITLISTED
        to: EXPIRED
        trigger: "POST /exchange-network/matching-runs (step 2 window-expiry sweep)"
        guard: "window_end_date is earlier than date(MatchingRun.as_of_utc)"
        side_effects:
          - "refunds quoted_charge_cents minus charge_refunded_cents to the member (EXCHANGE_CHARGE_REFUND LedgerEntry)"
          - "increments the enclosing MatchingRun's expired_request_count by 1"
      - from: WAITLISTED
        to: DENIED
        trigger: "POST /exchange-network/matching-runs (step 2 funding sweep)"
        guard: "funding_mode equals DEPOSIT_FIRST AND the funding deposit's deposit_status is not BANKED and not RESERVED"
        side_effects:
          - "refunds quoted_charge_cents minus charge_refunded_cents to the member (EXCHANGE_CHARGE_REFUND LedgerEntry)"
          - "increments the enclosing MatchingRun's denied_request_count by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /exchange-network/exchange-requests/{request_id}/cancellation"
        guard: null
        side_effects:
          - "refunds quoted_charge_cents minus charge_refunded_cents to the member (EXCHANGE_CHARGE_REFUND LedgerEntry)"
          - "decrements the member's active_request_count by 1"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /exchange-network/exchange-requests/{request_id}/cancellation"
        guard: null
        side_effects:
          - "refunds quoted_charge_cents minus charge_refunded_cents to the member (EXCHANGE_CHARGE_REFUND LedgerEntry)"
          - "decrements the member's active_request_count by 1"
      - from: MATCHED
        to: CANCELLED
        trigger: "POST /exchange-network/exchange-requests/{request_id}/cancellation"
        guard: null
        side_effects:
          - "releases the held deposit RESERVED -> BANKED"
          - "refunds quoted_charge_cents minus charge_refunded_cents to the member (EXCHANGE_CHARGE_REFUND LedgerEntry)"
          - "decrements the member's active_request_count by 1"
    notes: >-
      Branching fork at SUBMITTED: the same trigger (a matching run) sends the request to
      MATCHED or WAITLISTED with divergent side effects — one reserves a deposit and sets a
      hold clock, the other reserves nothing and stamps waitlisted_at. The
      MATCHED -> WAITLISTED -> MATCHED loop re-enters MATCHED with decline_count one higher,
      so the second entry can select a different deposit than the first.

  - entity: Confirmation
    field: status
    shape: branching
    states: [CONFIRMED, COMPLETED, CANCELLED, REINSTATED]
    initial_state: CONFIRMED
    terminal_states: [COMPLETED, REINSTATED]
    transitions:
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /exchange-network/matching-runs (step 4 completion sweep)"
        guard: "awarded_check_in_date + STAY_NIGHTS days is not later than date(MatchingRun.as_of_utc)"
        side_effects:
          - "increments the enclosing MatchingRun's completed_confirmation_count by 1"
          - "unlocks POST /exchange-network/resorts/{resort_id}/quality-reviews for this confirmation"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /exchange-network/confirmations/{confirmation_id}/cancellation"
        guard: null
        side_effects:
          - "selects a restoration_variant per calculations.cancellation_settlement and restores restored_power"
          - "levies cancellation_fee_cents against the member's wallet (CANCELLATION_FEE LedgerEntry)"
          - "moves the awarded deposit USED -> BANKED"
          - "stamps cancelled_at with the current logical clock instant"
      - from: CANCELLED
        to: REINSTATED
        trigger: "POST /exchange-network/confirmations/{confirmation_id}/reinstatement"
        guard: "the current logical clock instant is not later than cancelled_at + REINSTATEMENT_WINDOW_DAYS AND the awarded deposit's deposit_status equals BANKED AND its rental_status equals NOT_LISTED"
        side_effects:
          - "creates a successor Confirmation with status CONFIRMED whose reinstated_from_confirmation_id is this row's id"
          - "levies the successor's reinstatement_fee_cents against the member's wallet (REINSTATEMENT_FEE LedgerEntry)"
          - "re-debits the awarded deposit's settlement_power from the member and moves that deposit BANKED -> USED"
    notes: >-
      Branching at CONFIRMED: the completion sweep and an explicit cancellation lead to two
      terminal-facing subtrees whose ledger consequences do not overlap. CANCELLED is the only
      non-terminal state that both restores power and can hand it straight back through
      REINSTATED.

  - entity: GetawayOffer
    field: status
    shape: branching
    states: [LISTED, BOOKED, WITHDRAWN, EXPIRED]
    initial_state: LISTED
    terminal_states: [BOOKED, WITHDRAWN, EXPIRED]
    transitions:
      - from: LISTED
        to: BOOKED
        trigger: "POST /exchange-network/getaway-offers/{offer_id}/bookings"
        guard: "the booking member's enrollment_status equals ACTIVE AND the booking member is not the deposit owner AND wallet_credit_cents >= list_price_cents"
        side_effects:
          - "moves the deposit's rental_status LISTED_GETAWAY -> RENTED"
          - "debits list_price_cents from the renting member (GETAWAY_BOOKING_PAYMENT LedgerEntry)"
      - from: LISTED
        to: WITHDRAWN
        trigger: "POST /exchange-network/getaway-offers/{offer_id}/withdrawal"
        guard: null
        side_effects:
          - "moves the deposit's rental_status LISTED_GETAWAY -> NOT_LISTED"
          - "re-credits the deposit's remaining_power to the depositing owner (DEPOSIT_CREDIT LedgerEntry)"
      - from: LISTED
        to: EXPIRED
        trigger: "POST /exchange-network/matching-runs (step 1 expiry sweep of the underlying deposit)"
        guard: "the underlying deposit moved BANKED -> EXPIRED in this run"
        side_effects: []

  - entity: Dispute
    field: status
    shape: cyclic
    states: [OPEN, UNDER_REVIEW, INFO_REQUESTED, RESOLVED_UPHELD, RESOLVED_DENIED, WITHDRAWN]
    initial_state: OPEN
    terminal_states: [RESOLVED_UPHELD, RESOLVED_DENIED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /exchange-network/disputes/{dispute_id}/review"
        guard: null
        side_effects: []
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /exchange-network/disputes/{dispute_id}/info-requests"
        guard: "round_count is strictly less than MAX_DISPUTE_ROUNDS, otherwise ERR_DISPUTE_ROUND_LIMIT"
        side_effects:
          - "increments round_count by 1"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /exchange-network/disputes/{dispute_id}/responses"
        guard: null
        side_effects: []
      - from: UNDER_REVIEW
        to: RESOLVED_UPHELD
        trigger: "POST /exchange-network/disputes/{dispute_id}/resolution with outcome UPHELD"
        guard: "for subject_type TRADING_POWER the cited deposit's deposit_status must be in {BANKED, RESERVED, USED}, otherwise ERR_DEPOSIT_EXPIRED"
        side_effects:
          - "for TRADING_POWER: adds granted_power_adjustment to the cited deposit's awarded_power and remaining_power and credits the member (DISPUTE_POWER_GRANT LedgerEntry)"
          - "for RESORT_QUALITY: increments the cited resort's complaint_strikes by 1, and when it reaches COMPLAINT_STRIKE_THRESHOLD resets it to 0, increments downgrade_notches by 1, recomputes quality_rating and moves the resort ACTIVE -> PROBATION"
      - from: UNDER_REVIEW
        to: RESOLVED_DENIED
        trigger: "POST /exchange-network/disputes/{dispute_id}/resolution with outcome DENIED"
        guard: null
        side_effects: []
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /exchange-network/disputes/{dispute_id}/withdrawal"
        guard: null
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /exchange-network/disputes/{dispute_id}/withdrawal"
        guard: null
        side_effects: []
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /exchange-network/disputes/{dispute_id}/withdrawal"
        guard: null
        side_effects: []
    notes: >-
      Cyclic: UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW may run at most
      MAX_DISPUTE_ROUNDS times, and re-entry into UNDER_REVIEW is not equivalent to the first
      entry because round_count has advanced and the third info-request attempt is rejected.

  - entity: MatchingRun
    field: status
    shape: linear
    states: [PENDING, COMPLETED]
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /exchange-network/matching-runs (end of the pinned step sequence)"
        guard: null
        side_effects:
          - "all eleven counter fields are frozen at their post-sweep values"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (optimistic concurrency control)
# -----------------------------------------------------------------------------
concurrency_rules:

  - id: OCC_DEPOSIT_EXTENSION
    parent_entity: Deposit
    version_field: version
    write_endpoint: "POST /exchange-network/deposits/{deposit_id}/extensions"
    required_input_field: expected_deposit_version
    rule: >-
      A caller purchasing extension months must submit expected_deposit_version. The server
      compares it to the Deposit row's current version. When the two are unequal the write is
      rejected with ERR_STALE_VERSION (412) and nothing changes: extension_months_purchased,
      expires_at, the member's wallet_credit_cents and the LedgerEntry table are all untouched.
      When they are equal the write succeeds and increments Deposit.version by 1, so a caller
      replaying the same expected_deposit_version after any successful extension is rejected.
    serial_observability: >-
      Buying 3 months and then buying 3 more months again is a legitimate repeated operation, so
      a caller holding a version read from before the first purchase must be told its read is
      stale rather than silently granted a second 3 months.

  - id: OCC_RESORT_QUALITY_REVIEW
    parent_entity: Resort
    version_field: version
    write_endpoint: "POST /exchange-network/resorts/{resort_id}/quality-reviews"
    required_input_field: expected_resort_version
    rule: >-
      A caller filing a quality review must submit expected_resort_version. The server compares
      it to the Resort row's current version. When the two are unequal the write is rejected
      with ERR_STALE_VERSION (412) and nothing changes: no ResortQualityReview row is created
      and review_count, quality_score and quality_rating keep their previous values. When they
      are equal the write succeeds and increments Resort.version by 1, because the review
      changes review_count and can change quality_score and quality_rating.
    serial_observability: >-
      A resort accumulates many reviews over its life, so the version a client read before an
      earlier review landed no longer describes the rating state its new review will be folded
      into.

  - id: OCC_MEMBER_DUES_PAYMENT
    parent_entity: Member
    version_field: version
    write_endpoint: "POST /exchange-network/members/{member_id}/dues-payments"
    required_input_field: expected_member_version
    rule: >-
      A caller recording a dues payment must submit expected_member_version. The server compares
      it to the Member row's current version. When the two are unequal the write is rejected
      with ERR_STALE_VERSION (412) and nothing changes: enrollment_status, dues_paid_through and
      wallet_credit_cents keep their previous values and no DUES_PAYMENT LedgerEntry is written.
      When they are equal the write succeeds and increments Member.version by 1.
    serial_observability: >-
      Dues are paid every year and a lapsed member pays again to be reinstated, so a stale
      version must not be allowed to double-credit the wallet against an already-settled year.

# -----------------------------------------------------------------------------
# §1.3 Calculation Specifications
# -----------------------------------------------------------------------------
calculations:

  - name: deposit_trading_power
    type: weighted_scoring
    description: >-
      Values one banked week in trading power points from unit size, season band, resort demand,
      resort quality rating and lead time. Evaluated in two variants against two different
      as-of instants and two different snapshots of the resort profile.
    constants:
      UNIT_SIZE_BASE: { STUDIO: 30, ONE_BR: 45, TWO_BR: 60, THREE_BR: 80 }
      SEASON_MULT: { PLATINUM: 1.50, GOLD: 1.25, SILVER: 1.00, BRONZE: 0.70 }
      QUALITY_BONUS: { GOLD_CROWN: 6, SILVER_CROWN: 3, STANDARD: 0, HOSPITALITY: -4 }
      DEMAND_STEP: 0.10
      DEMAND_PIVOT: 3
      LEAD_FACTOR_BANDS:
        - { min_lead_days: 270, factor: 1.20 }
        - { min_lead_days: 180, factor: 1.10 }
        - { min_lead_days: 90,  factor: 1.00 }
        - { min_lead_days: null, factor: 0.85 }
      POWER_FLOOR: 1
    inputs:
      - "unit_size of the deposit (or requested_unit_size of the request)"
      - "season_band_code resolved from the resort's SeasonBand calendar for the evaluated date"
      - "resort.demand_index as it stands at the evaluation instant"
      - "resort.quality_rating as it stands at the evaluation instant"
      - "lead_time_days = (evaluated date) - date(as-of instant), in whole days, signed"
    formula: |
      base          = UNIT_SIZE_BASE[unit_size]
      season_mult   = SEASON_MULT[season_band_code]
      demand_mult   = 1.00 + DEMAND_STEP * (resort.demand_index - DEMAND_PIVOT)
      quality_bonus = QUALITY_BONUS[resort.quality_rating]
      lead_factor   = the factor of the first LEAD_FACTOR_BANDS row whose min_lead_days is null
                      or is <= lead_time_days, scanned top to bottom
      # --- pinned evaluation order: rounding happens TWICE, at these two points only ---
      step_1 = round_half_up(base * season_mult * demand_mult, 0)     # integer
      step_2 = step_1 + quality_bonus                                 # integer, may be negative
      step_3 = round_half_up(step_2 * lead_factor, 0)                 # integer
      power  = max(POWER_FLOOR, step_3)
    rounding: >-
      round_half_up at exactly two points: after base * season_mult * demand_mult, and after
      multiplying by lead_factor. The quality bonus is added between the two roundings, to the
      already-rounded step_1, and is never scaled by season_mult or demand_mult.
    evaluation_order_is_normative: >-
      The order above is the rule. Collapsing it into a single rounding — that is,
      round_half_up((base * season_mult * demand_mult + quality_bonus) * lead_factor, 0) — is
      NOT the rule and produces a different integer for many inputs. Example: unit_size STUDIO,
      band PLATINUM, demand_index 4, quality_rating GOLD_CROWN, lead_time_days 185 gives
      step_1 = round_half_up(30 * 1.50 * 1.10) = round_half_up(49.5) = 50, step_2 = 56,
      step_3 = round_half_up(61.6) = 62, so power = 62; the single-rounding form gives
      round_half_up((49.5 + 6) * 1.10) = round_half_up(61.05) = 61. Implementations must
      produce 62.
    variants:
      - variant: AT_DEPOSIT
        stored_in: "Deposit.awarded_power"
        as_of_instant: "the logical clock instant at which POST /exchange-network/deposits was accepted"
        evaluated_date: "the deposit's check_in_date"
        resort_snapshot: "resort.demand_index and resort.quality_rating as they stand at deposit creation"
        frozen: "written once at creation and never recomputed, except that an upheld TRADING_POWER dispute adds granted_power_adjustment to it"
      - variant: AT_SETTLEMENT
        stored_in: "Deposit.settlement_power"
        as_of_instant: "MatchingRun.as_of_utc of the run that reserved or getaway-listed this deposit"
        evaluated_date: "the deposit's check_in_date"
        resort_snapshot: "resort.demand_index and resort.quality_rating as they stand at that matching run"
        frozen: "written once, by the first run that reserves or getaway-lists the deposit; later runs do not overwrite it"
    variant_divergence: >-
      The two variants disagree whenever the resort's demand_index or quality_rating changed
      between deposit creation and settlement, or whenever the shrinking lead time crossed a
      LEAD_FACTOR_BANDS boundary. awarded_power is what the depositing owner was credited;
      settlement_power is what the exchanging member is charged. The difference is reconciled to
      the depositing owner by calculations.deposit_settlement_reconciliation.
    also_used_by: >-
      ExchangeRequest.required_power_estimate uses the same formula with unit_size =
      requested_unit_size, evaluated date = window_start_date, resort = requested_resort_id, and
      as-of instant = the clock instant at which the request was created.

  - name: request_power_budget
    type: proportional_allocation
    description: >-
      Converts the funding deposit's awarded_power into the affordability ceiling the matching
      pass compares candidate settlement_power against. This is where the deposit-first
      advantage is granted and where a request filed without a deposit is penalised.
    constants:
      REQUEST_FIRST_POWER_SURCHARGE_PCT: 10
    inputs:
      - "funding deposit's awarded_power"
      - "requesting member's tier.deposit_first_bonus_pct"
      - "the request's funding_mode"
    formula: |
      if funding_mode == "DEPOSIT_FIRST":
          power_budget = floor(deposit.awarded_power * (100 + tier.deposit_first_bonus_pct) / 100)
      else:  # REQUEST_FIRST — the deposit arrived after the request
          power_budget = floor(deposit.awarded_power * 100 / (100 + REQUEST_FIRST_POWER_SURCHARGE_PCT))
    rounding: "floor (truncate toward zero) in both branches; power_budget is an integer"
    notes: >-
      funding_mode is decided once, at request creation, by whether deposit_id was present in
      the creation body. A REQUEST_FIRST request that later attaches a deposit through
      POST /exchange-network/exchange-requests/{request_id}/funding keeps funding_mode
      REQUEST_FIRST and therefore keeps the shrunken budget: depositing first is strictly better
      than requesting first for the identical week.

  - name: exchange_charge
    type: tiered_pricing
    description: >-
      Cash charge quoted at request creation, debited from the member's wallet. Combines the
      tier's flat fee schedule, a per-point shortfall charge for asking for more than the
      funding deposit supports, a deposit-first credit and a processing fee.
    constants:
      SHORTFALL_CENTS_PER_POWER: 350
      DEPOSIT_FIRST_CREDIT_BANDS:
        - { max_subtotal_cents: 9999,  credit_pct: 0 }
        - { max_subtotal_cents: 19999, credit_pct: 5 }
        - { max_subtotal_cents: null,  credit_pct: 10 }
      PROCESSING_FEE_BANDS:
        - { max_subtotal_cents: 14999, fee_cents: 1200 }
        - { max_subtotal_cents: 29999, fee_cents: 2000 }
        - { max_subtotal_cents: null,  fee_cents: 2900 }
    inputs:
      - "request.required_power_estimate"
      - "request.power_budget"
      - "tier.base_exchange_fee_cents"
      - "tier.priority_surcharge_cents"
      - "request.funding_mode"
    formula: |
      power_gap      = max(0, required_power_estimate - power_budget)
      shortfall_cents = power_gap * SHORTFALL_CENTS_PER_POWER
      subtotal_cents  = tier.base_exchange_fee_cents + shortfall_cents + tier.priority_surcharge_cents
      # deposit-first credit: band selected on subtotal_cents
      credit_pct   = credit_pct of the first DEPOSIT_FIRST_CREDIT_BANDS row whose
                     max_subtotal_cents is null or is >= subtotal_cents, scanned top to bottom
      credit_cents = floor(subtotal_cents * credit_pct / 100) if funding_mode == "DEPOSIT_FIRST" else 0
      # processing fee: band ALSO selected on subtotal_cents
      processing_fee_cents = fee_cents of the first PROCESSING_FEE_BANDS row whose
                     max_subtotal_cents is null or is >= subtotal_cents, scanned top to bottom
      quoted_charge_cents = subtotal_cents - credit_cents + processing_fee_cents
    rounding: "floor on credit_cents only; every other term is already an integer number of cents"
    band_selection_is_normative: >-
      BOTH bands are keyed on the pre-credit subtotal_cents. Neither band may be keyed on
      quoted_charge_cents, nor on (subtotal_cents - credit_cents). Example: subtotal_cents
      30400 with funding_mode DEPOSIT_FIRST gives credit_pct 10, credit_cents 3040, and
      processing_fee_cents 2900 because 30400 exceeds 29999 — total 30260. Keying the
      processing-fee band on the post-credit 27360 would wrongly yield 2000 and a total of
      29360. Implementations must produce 30260.
    posting: >-
      Debited at request creation as an EXCHANGE_CHARGE LedgerEntry with
      cash_delta_cents = -quoted_charge_cents. Refunded in full as a single
      EXCHANGE_CHARGE_REFUND LedgerEntry when the request reaches CANCELLED, EXPIRED or DENIED,
      in the amount quoted_charge_cents - charge_refunded_cents; never refunded when the request
      reaches CONFIRMED.

  - name: request_priority_score
    type: weighted_scoring
    description: >-
      Ranks competing requests inside one matching run. Recomputed for every request whose
      status is in {SUBMITTED, WAITLISTED} at the start of matching-run step 3, and stored on
      the request.
    constants:
      TIER_WEIGHT: { BASIC: 0, PLUS: 20, ELITE: 40 }
      DEPOSIT_FIRST_BONUS: 15
      TENURE_POINTS_PER_YEAR: 1
      TENURE_POINTS_CAP: 10
      DECLINE_PENALTY_PER_DECLINE: 5
      DUES_ARREARS_PENALTY: 25
      SCORE_FLOOR: 0
    inputs:
      - "requesting member's tier.tier_code"
      - "request.funding_mode"
      - "days between date(member.created_at) and date(MatchingRun.as_of_utc)"
      - "request.decline_count"
      - "member.dues_paid_through compared to request.window_start_date"
    formula: |
      tier_points    = TIER_WEIGHT[tier.tier_code]
      mode_points    = DEPOSIT_FIRST_BONUS if funding_mode == "DEPOSIT_FIRST" else 0
      tenure_years   = floor((date(as_of_utc) - date(member.created_at)) in days / 365)
      tenure_points  = min(TENURE_POINTS_CAP, TENURE_POINTS_PER_YEAR * tenure_years)
      decline_penalty = DECLINE_PENALTY_PER_DECLINE * request.decline_count
      arrears_penalty = DUES_ARREARS_PENALTY if member.dues_paid_through < request.window_start_date else 0
      priority_score = max(SCORE_FLOOR,
                           tier_points + mode_points + tenure_points
                           - decline_penalty - arrears_penalty)
    rounding: "floor on tenure_years; priority_score is an integer"
    tie_break: >-
      Requests are processed in order priority_score DESC, then created_at ASC. A request's id
      is never a tie-break input.

  - name: resort_deposit_obligation_shortfall
    type: forward_looking_projection
    description: >-
      Measures how far a resort is from its inventory deposit obligation for the current
      affiliation year. Computed in two variants that answer two different questions; only one
      of them can put the resort on probation.
    constants:
      AFFILIATION_YEAR_DAYS: 365
      COUNTED_DEPOSIT_STATUSES: [BANKED, RESERVED, USED]
    inputs:
      - "resort.affiliated_on"
      - "resort.required_annual_deposit_units"
      - "every Deposit row whose resort_id is this resort"
    formula: |
      affiliation_year_start = date(resort.affiliated_on)
      affiliation_year_end   = affiliation_year_start + AFFILIATION_YEAR_DAYS days   # EXCLUSIVE
      obligation_units       = resort.required_annual_deposit_units
      counted = count of Deposit rows where resort_id matches
                AND deposit_status in COUNTED_DEPOSIT_STATUSES
                AND <the variant's date field> is in
                    [affiliation_year_start, affiliation_year_end)
      shortfall = max(0, obligation_units - counted)
    variants:
      - variant: BY_STAY_YEAR
        date_field: "Deposit.check_in_date"
        reported_as: "shortfall_by_stay_year"
        authoritative: true
        used_for: >-
          The ACTIVE -> PROBATION cascade in matching-run step 1 and the guard on the
          PROBATION -> ACTIVE status change. This variant asks: how many weeks of stayable
          inventory did the resort put into the affiliation year?
      - variant: BY_DEPOSIT_DATE
        date_field: "date(Deposit.created_at)"
        reported_as: "shortfall_by_deposit_date"
        authoritative: false
        used_for: >-
          Reported on GET /exchange-network/resorts/{resort_id}/compliance for operator
          reconciliation only. This variant asks: how many deposit transactions did the resort
          file during the affiliation year, regardless of when the stay falls?
    variant_divergence: >-
      The two variants disagree for any deposit filed inside the affiliation year for a stay
      outside it, or filed outside the year for a stay inside it. A resort can therefore be
      compliant BY_DEPOSIT_DATE and on probation BY_STAY_YEAR at the same instant, and only the
      BY_STAY_YEAR number may drive the transition.

  - name: resort_quality_score
    type: weighted_scoring
    description: >-
      Turns member reviews into the resort's quality_score and quality_rating, then applies any
      complaint-driven downgrade notches. quality_rating feeds back into
      calculations.deposit_trading_power as QUALITY_BONUS.
    constants:
      CLEANLINESS_WEIGHT: 0.40
      SERVICE_WEIGHT: 0.35
      AMENITIES_WEIGHT: 0.25
      REVIEW_WINDOW_SIZE: 8
      MIN_REVIEWS_FOR_SCORE: 2
      RATING_BANDS:
        - { min_score: 8.50, rating: GOLD_CROWN }
        - { min_score: 7.00, rating: SILVER_CROWN }
        - { min_score: 5.00, rating: STANDARD }
        - { min_score: null, rating: HOSPITALITY }
      RATING_LADDER: [GOLD_CROWN, SILVER_CROWN, STANDARD, HOSPITALITY]
      COMPLAINT_STRIKE_THRESHOLD: 2
    inputs:
      - "every ResortQualityReview row whose resort_id is this resort"
      - "resort.initial_quality_rating"
      - "resort.downgrade_notches"
    formula: |
      # per review, at review creation
      composite_score = round_half_up(CLEANLINESS_WEIGHT * cleanliness_score
                                    + SERVICE_WEIGHT     * service_score
                                    + AMENITIES_WEIGHT   * amenities_score, 2)
      # per resort, recomputed after every review creation
      review_count = count of this resort's ResortQualityReview rows
      window = this resort's reviews ordered by created_at DESC, taking the first
               REVIEW_WINDOW_SIZE rows; when the row at position REVIEW_WINDOW_SIZE ties on
               created_at with rows beyond it, every tied row is included as well
      if review_count < MIN_REVIEWS_FOR_SCORE:
          quality_score  = null
          scored_rating  = resort.initial_quality_rating
      else:
          quality_score  = round_half_up(sum(window.composite_score) / count(window), 2)
          scored_rating  = rating of the first RATING_BANDS row whose min_score is null or is
                           <= quality_score, scanned top to bottom
      # complaint downgrade: shift down the ladder, clamped at the bottom
      idx            = index of scored_rating in RATING_LADDER
      quality_rating = RATING_LADDER[min(len(RATING_LADDER) - 1, idx + resort.downgrade_notches)]
    rounding: >-
      round_half_up to 2 decimal places twice: once per review composite, and once on the mean
      of the window composites. The mean is taken over the already-rounded composites, never
      over the raw weighted sums.
    complaint_strikes: >-
      Each upheld RESORT_QUALITY dispute increments resort.complaint_strikes by 1. When
      complaint_strikes reaches COMPLAINT_STRIKE_THRESHOLD it is reset to 0, downgrade_notches
      is incremented by 1, quality_rating is recomputed by the formula above, and the resort
      moves ACTIVE -> PROBATION.

  - name: deposit_settlement_reconciliation
    type: reconciliation
    description: >-
      Settles the gap between what the depositing owner was credited at deposit time and what
      the network actually charged for the week at settlement. Keeps the network's power supply
      and demand equal without touching the exchanging member.
    inputs:
      - "deposit.awarded_power"
      - "deposit.settlement_power"
    formula: |
      settlement_delta = deposit.settlement_power - deposit.awarded_power
      if settlement_delta != 0:
          write a SETTLEMENT_ADJUSTMENT LedgerEntry against the DEPOSITING OWNER
          (deposit.member_id, not the confirming member) with
          power_delta = settlement_delta, related_entity_type DEPOSIT,
          related_entity_id = deposit.id
      # when settlement_delta == 0 no ledger row is written at all
    rounding: "none; both operands are integers"
    posting_point: >-
      Written exactly once, inside POST /exchange-network/confirmations, alongside the
      EXCHANGE_DEBIT of settlement_power against the confirming member. A getaway listing does
      not post a settlement adjustment.
    clamping: >-
      When settlement_delta is negative and would drive the depositing owner's
      trading_power_balance below 0, power_delta is clamped to -(current
      trading_power_balance) and the LedgerEntry records the clamped value, so INV_POWER holds.

  - name: cancellation_settlement
    type: threshold_selection
    description: >-
      Decides what a cancelling member gets back and what the cancellation costs, on a hard
      day-count threshold measured from the logical clock to the awarded check-in date.
    constants:
      FULL_RESTORE_MIN_DAYS: 30
      PRORATED_HAIRCUT_PCT: 25
      LATE_CANCEL_SURCHARGE_CENTS: 7500
    inputs:
      - "date(current logical clock instant)"
      - "confirmation.awarded_check_in_date"
      - "confirmation.power_debited"
      - "the awarded deposit's awarded_power"
      - "the cancelling member's tier.cancellation_fee_cents"
    formula: |
      days_out = (awarded_check_in_date - date(current logical clock instant)) in whole days
      if days_out >= FULL_RESTORE_MIN_DAYS:
          restoration_variant     = "FULL_RESTORE"
          restored_power          = confirmation.power_debited
          haircut_power           = 0
          cancellation_fee_cents  = tier.cancellation_fee_cents
      else:
          restoration_variant     = "PRORATED_RESTORE"
          haircut_power           = ceil(deposit.awarded_power * PRORATED_HAIRCUT_PCT / 100)
          restored_power          = confirmation.power_debited
          cancellation_fee_cents  = tier.cancellation_fee_cents + LATE_CANCEL_SURCHARGE_CENTS
    rounding: "ceil on haircut_power; every other term is an integer"
    variants:
      - variant: FULL_RESTORE
        selected_when: "days_out >= 30"
        power_effects:
          - "the cancelling member is credited restored_power (EXCHANGE_RESTORATION LedgerEntry)"
        deposit_effects:
          - "deposit_status moves USED -> BANKED"
          - "restoration_haircut_power is unchanged, so remaining_power is unchanged"
          - "expires_at is unchanged"
          - "rental_status is unchanged and no GetawayOffer is created"
      - variant: PRORATED_RESTORE
        selected_when: "days_out < 30, including days_out <= 0"
        power_effects:
          - "the cancelling member is credited restored_power (EXCHANGE_RESTORATION LedgerEntry)"
          - "the DEPOSITING OWNER is debited haircut_power (RESTORATION_HAIRCUT LedgerEntry)"
        deposit_effects:
          - "deposit_status moves USED -> BANKED"
          - "restoration_haircut_power increases by haircut_power and remaining_power is recomputed"
          - "expires_at is unchanged"
          - "rental_status moves NOT_LISTED -> LISTED_GETAWAY and a GetawayOffer is created priced by calculations.getaway_list_price"
    boundary: >-
      days_out is compared with >=, so a cancellation exactly FULL_RESTORE_MIN_DAYS days before
      the awarded check-in date is FULL_RESTORE and one day later is PRORATED_RESTORE.

  - name: getaway_list_price
    type: multi_factor_pricing
    description: >-
      Prices unmatched inventory for cash rental. Three independent factors feed one expression
      that is rounded exactly once, at the end, and then clamped into a fixed price corridor.
    constants:
      GETAWAY_BASE_CENTS_PER_POWER: 900
      DEMAND_PREMIUM_PCT_PER_STEP: 5
      DEMAND_PIVOT: 3
      URGENCY_BANDS:
        - { min_days_to_check_in: 120, discount_pct: 0 }
        - { min_days_to_check_in: 60,  discount_pct: 10 }
        - { min_days_to_check_in: 30,  discount_pct: 20 }
        - { min_days_to_check_in: null, discount_pct: 35 }
      GETAWAY_FLOOR_CENTS: 29900
      GETAWAY_CEILING_CENTS: 249900
    inputs:
      - "deposit.settlement_power"
      - "resort.demand_index at the listing instant"
      - "days_to_check_in = deposit.check_in_date - date(listing instant), in whole days"
    formula: |
      raw_cents      = deposit.settlement_power * GETAWAY_BASE_CENTS_PER_POWER
      demand_premium = DEMAND_PREMIUM_PCT_PER_STEP * (resort.demand_index - DEMAND_PIVOT)
      adjusted_cents = raw_cents * (100 + demand_premium) / 100
      urgency_discount_pct = discount_pct of the first URGENCY_BANDS row whose
                             min_days_to_check_in is null or is <= days_to_check_in,
                             scanned top to bottom
      discounted_cents = adjusted_cents * (100 - urgency_discount_pct) / 100
      list_price_cents = min(GETAWAY_CEILING_CENTS,
                             max(GETAWAY_FLOOR_CENTS,
                                 round_half_up(discounted_cents, 0)))
    rounding: >-
      round_half_up exactly ONCE, on discounted_cents, after both percentage factors have been
      applied. adjusted_cents keeps full precision. This is deliberately the opposite
      convention from calculations.deposit_trading_power, which rounds twice; the two
      calculations must not share a rounding helper that rounds every intermediate step.
    clamping: >-
      The clamp is applied after rounding, as nested min/max in the order shown: the floor is
      applied first and the ceiling second, so a value below GETAWAY_FLOOR_CENTS becomes exactly
      GETAWAY_FLOOR_CENTS and a value above GETAWAY_CEILING_CENTS becomes exactly
      GETAWAY_CEILING_CENTS.
    settlement_power_prerequisite: >-
      A deposit listed by matching-run step 5 has its settlement_power frozen by that same run
      before pricing. A deposit listed by a PRORATED_RESTORE cancellation already has
      settlement_power from the run that reserved it.

# -----------------------------------------------------------------------------
# Shared operational constants and the pinned matching-run step order
# -----------------------------------------------------------------------------
operational_constants:
  STAY_NIGHTS: 7
  TURNOVER_BUFFER_NIGHTS: 1
  OCCUPANCY_NIGHTS_PER_DEPOSIT: 8      # STAY_NIGHTS + TURNOVER_BUFFER_NIGHTS
  DEPOSIT_LIFETIME_DAYS: 730
  EXTENSION_DAYS_PER_MONTH: 30
  MAX_EXTENSION_MONTHS: 12
  DEPOSIT_LEAD_MIN_DAYS: 60
  REQUEST_WINDOW_MAX_SPAN_DAYS: 60
  MATCH_HOLD_HOURS: 48
  REINSTATEMENT_WINDOW_DAYS: 14
  GETAWAY_SWEEP_WITHIN_DAYS: 45
  MAX_DISPUTE_ROUNDS: 2
  DEFAULT_LOGICAL_CLOCK: "2026-08-01T00:00:00Z"

occupancy_model:
  description: >-
    A Deposit occupies the half-open date interval [check_in_date, check_in_date +
    OCCUPANCY_NIGHTS_PER_DEPOSIT) — seven stay nights plus one turnover night. Two deposits of
    the same resort_id and the same unit_size conflict when their intervals share at least one
    day. Capacity is aggregate: at most resort.units_per_size deposits of one unit_size may
    cover any single day, counting only deposits whose deposit_status is in {BANKED, RESERVED,
    USED}. Because the interval is half-open, a deposit checking in exactly
    OCCUPANCY_NIGHTS_PER_DEPOSIT days after another does not conflict with it.
  enforced_by: "validation ERR_UNIT_INVENTORY_CONFLICT on POST /exchange-network/deposits"

season_band_interval_model:
  description: >-
    A SeasonBand covers the closed MM-DD interval [start_month_day, end_month_day], both
    endpoints inclusive, interpreted without reference to any particular year. Two bands of the
    same resort conflict when they share at least one calendar day; bands whose endpoints are
    adjacent (one ends 06-30 and the next starts 07-01) do not conflict. A band whose
    end_month_day sorts before its start_month_day is rejected — no band wraps the year end.
  enforced_by: "validations ERR_SEASON_BAND_OVERLAP and ERR_INVALID_DATE_RANGE on POST /exchange-network/resorts/{resort_id}/season-bands"

matching_run_step_order:
  description: >-
    POST /exchange-network/matching-runs executes exactly these steps, in exactly this order,
    inside one request. Every step reads the state left by the steps before it. as_of is
    MatchingRun.as_of_utc, which equals the logical clock instant at which the run was accepted.
  steps:
    - step: 0
      name: dues_lapse_sweep
      action: >-
        Every Member whose enrollment_status is ACTIVE and whose dues_paid_through is earlier
        than date(as_of) moves ACTIVE -> LAPSED. Increments lapsed_member_count. Processed in
        created_at ASC order.
    - step: 1
      name: deposit_expiry_sweep
      action: >-
        Every Deposit whose deposit_status is BANKED and whose expires_at is not later than
        as_of moves BANKED -> EXPIRED, forfeits remaining_power from its owner
        (DEPOSIT_EXPIRY_FORFEIT), decrements its resort's deposits_committed_count by 1 and
        committed_nights by OCCUPANCY_NIGHTS_PER_DEPOSIT, and moves any LISTED GetawayOffer of
        that deposit to EXPIRED. Increments expired_deposit_count. Processed in
        expires_at ASC, created_at ASC order.
    - step: 2
      name: request_expiry_and_denial_sweep
      action: >-
        In this order, for each request in created_at ASC order: (a) a MATCHED request whose
        matched_hold_expires_at is not later than as_of moves MATCHED -> EXPIRED and releases
        its held deposit RESERVED -> BANKED; (b) a SUBMITTED or WAITLISTED request whose
        window_end_date is earlier than date(as_of) moves to EXPIRED; (c) a WAITLISTED
        DEPOSIT_FIRST request whose funding deposit's deposit_status is neither BANKED nor
        RESERVED moves to DENIED. Every request leaving the pipeline in this step is refunded
        quoted_charge_cents - charge_refunded_cents (EXCHANGE_CHARGE_REFUND). Increments
        expired_request_count and denied_request_count.
    - step: 3
      name: matching_pass
      action: >-
        Recompute priority_score by calculations.request_priority_score for every request whose
        status is in {SUBMITTED, WAITLISTED}, then process those requests in priority_score
        DESC, created_at ASC order. For each, build the candidate pool and either MATCH the
        top-ranked candidate or WAITLIST the request. A deposit selected by an earlier request
        in this same pass is RESERVED and therefore not a candidate for any later request in
        the pass. Increments matched_count and waitlisted_count.
      candidate_pool_filter:
        - "deposit.resort_id equals request.requested_resort_id"
        - "deposit.unit_size equals request.requested_unit_size"
        - "deposit.deposit_status equals BANKED"
        - "deposit.rental_status equals NOT_LISTED"
        - "deposit.member_id is not request.member_id"
        - "deposit.expires_at is later than as_of"
        - "deposit.check_in_date is in [request.window_start_date, request.window_end_date], both endpoints inclusive"
        - "(deposit.check_in_date - date(as_of)) in whole days is <= the requesting member's tier.priority_window_days"
        - "the deposit's settlement_power for this run is <= request.power_budget"
      candidate_ranking: >-
        settlement_power DESC, then check_in_date ASC, then created_at ASC. The deposit's id is
        never a ranking input.
      empty_pool: "the request is WAITLISTED and no deposit is touched"
    - step: 4
      name: confirmation_completion_sweep
      action: >-
        Every Confirmation whose status is CONFIRMED and whose awarded_check_in_date +
        STAY_NIGHTS days is not later than date(as_of) moves CONFIRMED -> COMPLETED. Increments
        completed_confirmation_count. Processed in awarded_check_in_date ASC, created_at ASC
        order.
    - step: 5
      name: getaway_listing_sweep
      action: >-
        Every Deposit whose deposit_status is BANKED, whose rental_status is NOT_LISTED and
        whose (date(expires_at) - date(as_of)) in whole days is <= GETAWAY_SWEEP_WITHIN_DAYS
        freezes settlement_power if it is still null, moves rental_status NOT_LISTED ->
        LISTED_GETAWAY, forfeits remaining_power from its owner (GETAWAY_LISTING_FORFEIT) and
        gains a LISTED GetawayOffer priced by calculations.getaway_list_price with
        created_by_run_id set to this run. Increments getaway_listed_count. Processed in
        expires_at ASC, created_at ASC order.
    - step: 6
      name: resort_probation_evaluation
      action: >-
        For each Resort that had at least one deposit expired by step 1 of THIS run, in
        created_at ASC order: recompute calculations.resort_deposit_obligation_shortfall variant
        BY_STAY_YEAR and, when shortfall_by_stay_year is >= 1 and affiliation_status is ACTIVE,
        move the resort ACTIVE -> PROBATION and increment probation_resort_count. Resorts
        untouched by step 1 are not evaluated, so a run that expires nothing puts nobody on
        probation.
  power_clamping: >-
    Any forfeit, haircut or reversal whose magnitude exceeds the owner's current
    trading_power_balance is clamped so the balance lands on exactly 0, and the LedgerEntry
    records the clamped power_delta. This keeps INV_POWER exact.

invariants:
  - id: INV_POWER
    statement: "Member.trading_power_balance == SUM(LedgerEntry.power_delta) over all LedgerEntry rows whose member_id is that member"
  - id: INV_CASH
    statement: "Member.wallet_credit_cents == SUM(LedgerEntry.cash_delta_cents) over all LedgerEntry rows whose member_id is that member"
  - id: INV_NIGHTS
    statement: "Resort.committed_nights == OCCUPANCY_NIGHTS_PER_DEPOSIT * COUNT(Deposit rows whose resort_id is that resort AND whose deposit_status is in {BANKED, RESERVED, USED}), and Resort.deposits_committed_count equals that same COUNT"
  - id: INV_ACTIVE_REQUESTS
    statement: "Member.active_request_count == COUNT(ExchangeRequest rows whose member_id is that member AND whose status is in {SUBMITTED, WAITLISTED, MATCHED})"

# -----------------------------------------------------------------------------
# §1.4 Validation Order (global, ordered — lower priority number wins)
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    rule: "X-User-Id and X-User-Role headers must both be present and non-empty on every endpoint."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    rule: "X-User-Role must be one of {Member, ResortManager, NetworkOperator, DisputeAnalyst}."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    rule: "X-User-Role must appear in the roles list declared for the endpoint being called."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 4
    category: business_constraint
    rule: >-
      Request body and query parameters must satisfy their declared shapes: required fields
      present, enum fields inside their declared value sets, integers inside their declared
      ranges, dates matching YYYY-MM-DD, MM-DD strings matching the SeasonBand pattern,
      instants matching ISO-8601 UTC, limit in 1..100 and offset >= 0.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

  - priority: 5
    category: existence
    rule: >-
      When X-User-Role is Member, X-User-Id must identify an existing Member row; when it is
      ResortManager, X-User-Id must identify an existing Resort row. NetworkOperator and
      DisputeAnalyst are opaque identities and are not looked up.
    error_id: ERR_ACTING_IDENTITY_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"

  - priority: 6
    category: existence
    rule: >-
      Every path parameter must identify an existing row, checked left to right in the order the
      identifiers appear in the path.
    error_id: "ERR_TIER_NOT_FOUND | ERR_RESORT_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_DEPOSIT_NOT_FOUND | ERR_EXCHANGE_REQUEST_NOT_FOUND | ERR_CONFIRMATION_NOT_FOUND | ERR_GETAWAY_OFFER_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_MATCHING_RUN_NOT_FOUND | ERR_QUALITY_REVIEW_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path parameter"

  - priority: 7
    category: existence
    rule: >-
      Every foreign key supplied in a request body or query string must identify an existing
      row, checked in the field order declared for that endpoint's input.
    error_id: "ERR_TIER_NOT_FOUND | ERR_RESORT_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_DEPOSIT_NOT_FOUND | ERR_EXCHANGE_REQUEST_NOT_FOUND | ERR_CONFIRMATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints accepting a foreign key"

  - priority: 8
    category: auth
    rule: >-
      A Member caller may only act on rows it owns: X-User-Id must equal the target Member.id,
      the Deposit.member_id, the ExchangeRequest.member_id, the ExchangeRequest.member_id behind
      a Confirmation, the Dispute.member_id, or the member_id supplied in a getaway booking
      body. A Member filing a quality review must own the cited Confirmation.
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: >-
      POST /members/{member_id}/dues-payments, POST /deposits, POST
      /deposits/{deposit_id}/extensions, POST /deposits/{deposit_id}/withdrawal, POST
      /exchange-requests, POST /exchange-requests/{request_id}/funding, POST
      /exchange-requests/{request_id}/decline, POST /exchange-requests/{request_id}/cancellation,
      POST /confirmations, POST /confirmations/{confirmation_id}/cancellation, POST
      /confirmations/{confirmation_id}/reinstatement, POST /getaway-offers/{offer_id}/bookings,
      POST /resorts/{resort_id}/quality-reviews, POST /disputes, POST
      /disputes/{dispute_id}/responses, POST /disputes/{dispute_id}/withdrawal

  - priority: 9
    category: auth
    rule: >-
      A ResortManager caller may only act on its own resort: X-User-Id must equal the
      resort_id path parameter.
    error_id: ERR_NOT_RESORT_MANAGER
    http_status: 403
    applies_to: "POST /resorts/{resort_id}/season-bands, GET /resorts/{resort_id}/compliance"

  - priority: 10
    category: state
    rule: >-
      On the three endpoints that require an optimistic-concurrency token, the submitted
      expected_<parent>_version must equal the parent row's current version field.
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: >-
      POST /deposits/{deposit_id}/extensions, POST /resorts/{resort_id}/quality-reviews, POST
      /members/{member_id}/dues-payments

  - priority: 11
    category: state
    rule: >-
      The target row's current state must have an outgoing transition to the requested state
      under the endpoint's trigger, as declared in §1.2. This covers to_status bodies on resort,
      member and dispute status changes, cancelling a Confirmation that is not CONFIRMED,
      reinstating a Confirmation that is not CANCELLED, declining a request that is not MATCHED,
      cancelling a request whose status is terminal, booking or withdrawing a GetawayOffer that
      is not LISTED, withdrawing a Deposit that is not BANKED, extending a Deposit that is not
      BANKED, attaching funding to a request that is not SUBMITTED or WAITLISTED, reviewing a
      Dispute that is not OPEN, requesting information on a Dispute that is not UNDER_REVIEW,
      responding to a Dispute that is not INFO_REQUESTED, resolving a Dispute that is not
      UNDER_REVIEW, and affiliating a Resort that is not PENDING_AFFILIATION.
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 12
    category: state
    rule: >-
      The acting or referenced Member's enrollment_status must be ACTIVE for POST /deposits,
      POST /exchange-requests, POST /exchange-requests/{request_id}/funding, POST
      /confirmations, POST /confirmations/{confirmation_id}/reinstatement, POST
      /getaway-offers/{offer_id}/bookings and POST /disputes.
    error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    applies_to: >-
      POST /deposits, POST /exchange-requests, POST /exchange-requests/{request_id}/funding,
      POST /confirmations, POST /confirmations/{confirmation_id}/reinstatement, POST
      /getaway-offers/{offer_id}/bookings, POST /disputes

  - priority: 13
    category: state
    rule: >-
      A Deposit named as funding for a request or as the target of a reinstatement must have
      deposit_status BANKED and rental_status NOT_LISTED. A Deposit cited as the subject of a
      TRADING_POWER dispute is exempt from this check.
    error_id: ERR_DEPOSIT_NOT_AVAILABLE
    http_status: 409
    applies_to: >-
      POST /exchange-requests, POST /exchange-requests/{request_id}/funding, POST
      /confirmations/{confirmation_id}/reinstatement

  - priority: 14
    category: state
    rule: >-
      A quality review requires proof of stay: the cited Confirmation's status must be
      COMPLETED. The same rule applies to the confirmation_id cited by a RESORT_QUALITY dispute.
    error_id: ERR_STAY_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /resorts/{resort_id}/quality-reviews, POST /disputes"

  - priority: 15
    category: business_safety
    rule: >-
      A Deposit may only be created against a Resort whose affiliation_status is ACTIVE or
      PROBATION. PENDING_AFFILIATION, SUSPENDED and TERMINATED all reject the deposit. The same
      rule gates POST /exchange-requests against requested_resort_id.
    error_id: ERR_RESORT_NOT_AFFILIATED
    http_status: 409
    applies_to: "POST /deposits, POST /exchange-requests"

  - priority: 16
    category: business_safety
    rule: >-
      A Deposit whose expires_at is not later than the current logical clock instant may not be
      extended, withdrawn, used as funding, or granted a power adjustment by an upheld dispute.
    error_id: ERR_DEPOSIT_EXPIRED
    http_status: 409
    applies_to: >-
      POST /deposits/{deposit_id}/extensions, POST /deposits/{deposit_id}/withdrawal, POST
      /exchange-requests, POST /disputes/{dispute_id}/resolution

  - priority: 17
    category: business_temporal
    rule: >-
      A SeasonBand's end_month_day must not sort before its start_month_day, comparing the two
      MM-DD strings lexicographically.
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /resorts/{resort_id}/season-bands"

  - priority: 18
    category: business_temporal
    rule: >-
      An ExchangeRequest's window_end_date must not be earlier than its window_start_date, and
      the span (window_end_date - window_start_date) in whole days must not exceed
      REQUEST_WINDOW_MAX_SPAN_DAYS.
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /exchange-requests"

  - priority: 19
    category: business_temporal
    rule: >-
      A Deposit's check_in_date must be at least DEPOSIT_LEAD_MIN_DAYS days after
      date(current logical clock instant); a check_in_date closer than that is too late to bank.
    error_id: ERR_DEPOSIT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /deposits"

  - priority: 20
    category: business_temporal
    rule: >-
      A Confirmation may be reinstated only while the current logical clock instant is not later
      than cancelled_at + REINSTATEMENT_WINDOW_DAYS days.
    error_id: ERR_REINSTATEMENT_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /confirmations/{confirmation_id}/reinstatement"

  - priority: 21
    category: business_referential
    rule: >-
      A Deposit's check_in_date must fall inside exactly one SeasonBand of its resort, matching
      on MM-DD. A date covered by no band is rejected. The same rule applies to an
      ExchangeRequest's window_start_date against requested_resort_id.
    error_id: ERR_NO_SEASON_BAND_FOR_DATE
    http_status: 422
    applies_to: "POST /deposits, POST /exchange-requests"

  - priority: 22
    category: business_referential
    rule: >-
      Dispute subject fields must match subject_type: TRADING_POWER requires deposit_id present
      with resort_id and confirmation_id both null; RESORT_QUALITY requires resort_id and
      confirmation_id both present with deposit_id null. For RESORT_QUALITY the cited
      confirmation's awarded deposit must belong to the cited resort.
    error_id: ERR_DISPUTE_SUBJECT_MISMATCH
    http_status: 422
    applies_to: "POST /disputes"

  - priority: 23
    category: business_constraint
    rule: >-
      A new SeasonBand must not share any calendar day with an existing SeasonBand of the same
      resort. Adjacent bands are accepted.
    error_id: ERR_SEASON_BAND_OVERLAP
    http_status: 409
    applies_to: "POST /resorts/{resort_id}/season-bands"

  - priority: 24
    category: business_constraint
    rule: >-
      A new Deposit must not push any single day of its occupancy interval above the resort's
      units_per_size capacity for its unit_size, per the occupancy_model.
    error_id: ERR_UNIT_INVENTORY_CONFLICT
    http_status: 409
    applies_to: "POST /deposits"

  - priority: 25
    category: business_constraint
    rule: >-
      A Member's active_request_count must be strictly less than tier.max_active_requests before
      a new ExchangeRequest is accepted.
    error_id: ERR_ACTIVE_REQUEST_LIMIT
    http_status: 409
    applies_to: "POST /exchange-requests"

  - priority: 26
    category: business_constraint
    rule: >-
      extension_months_purchased + the submitted months must not exceed MAX_EXTENSION_MONTHS.
    error_id: ERR_EXTENSION_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /deposits/{deposit_id}/extensions"

  - priority: 27
    category: business_constraint
    rule: "A Dispute's round_count must be strictly less than MAX_DISPUTE_ROUNDS before another information request is issued."
    error_id: ERR_DISPUTE_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /disputes/{dispute_id}/info-requests"

  - priority: 28
    category: business_constraint
    rule: "At most one ResortQualityReview may exist per confirmation_id."
    error_id: ERR_DUPLICATE_QUALITY_REVIEW
    http_status: 409
    applies_to: "POST /resorts/{resort_id}/quality-reviews"

  - priority: 29
    category: business_constraint
    rule: >-
      A Resort must have at least one SeasonBand before it can be affiliated, because without a
      season calendar no deposit against it can be valued.
    error_id: ERR_AFFILIATION_REQUIRES_SEASON_BANDS
    http_status: 409
    applies_to: "POST /resorts/{resort_id}/affiliation"

  - priority: 30
    category: business_constraint
    rule: "The member booking a GetawayOffer must not be the owner of the underlying Deposit."
    error_id: ERR_GETAWAY_SELF_BOOKING
    http_status: 409
    applies_to: "POST /getaway-offers/{offer_id}/bookings"

  - priority: 31
    category: business_fiscal
    rule: "A dues payment's amount_cents must be at least the member's tier.annual_dues_cents."
    error_id: ERR_INSUFFICIENT_DUES_PAYMENT
    http_status: 422
    applies_to: "POST /members/{member_id}/dues-payments"

  - priority: 32
    category: business_fiscal
    rule: >-
      The paying member's wallet_credit_cents must be at least the amount about to be debited:
      quoted_charge_cents on request creation, cancellation_fee_cents on confirmation
      cancellation, reinstatement_fee_cents on reinstatement,
      tier.extension_fee_cents_per_month * months on an extension, and list_price_cents on a
      getaway booking.
    error_id: ERR_INSUFFICIENT_WALLET_CREDIT
    http_status: 402
    applies_to: >-
      POST /exchange-requests, POST /confirmations/{confirmation_id}/cancellation, POST
      /confirmations/{confirmation_id}/reinstatement, POST /deposits/{deposit_id}/extensions,
      POST /getaway-offers/{offer_id}/bookings

  - priority: 33
    category: business_fiscal
    rule: >-
      The confirming member's trading_power_balance must be at least the awarded deposit's
      settlement_power; on reinstatement the same check is repeated against the re-debited
      settlement_power.
    error_id: ERR_INSUFFICIENT_TRADING_POWER
    http_status: 402
    applies_to: "POST /confirmations, POST /confirmations/{confirmation_id}/reinstatement"

validation_ordering_notes:
  - >-
    The ordering is global: category order is auth, then existence, then state, then
    business_safety, then business_temporal, then business_referential, then
    business_constraint, then business_fiscal — with the two ERR_INVALID_REQUEST /
    ERR_ACTING_IDENTITY_NOT_FOUND rules interleaved at priorities 4 and 5 as shown. When a
    single request violates several rules the response carries the error_id of the
    lowest-numbered priority only.
  - >-
    A LAPSED member submitting an ExchangeRequest with an empty wallet violates priority 12
    (state) and priority 32 (business_fiscal); the response is ERR_MEMBER_NOT_ACTIVE with HTTP
    409, never ERR_INSUFFICIENT_WALLET_CREDIT.
  - >-
    A Deposit against a SUSPENDED resort for a date no SeasonBand covers violates priority 15
    (business_safety) and priority 21 (business_referential); the response is
    ERR_RESORT_NOT_AFFILIATED with HTTP 409, never ERR_NO_SEASON_BAND_FOR_DATE.

# -----------------------------------------------------------------------------
# §1.5 Endpoint Table
# All paths are prefixed with /exchange-network.
# -----------------------------------------------------------------------------
endpoints:

  # --- membership tiers -------------------------------------------------------
  - method: POST
    path: /exchange-network/membership-tiers
    description: "Create a membership tier and its exchange fee schedule."
    roles: [NetworkOperator]
    input: [tier_code, annual_dues_cents, base_exchange_fee_cents, priority_surcharge_cents, priority_window_days, deposit_first_bonus_pct, max_active_requests, cancellation_fee_cents, reinstatement_fee_cents, extension_fee_cents_per_month]
    output: MembershipTier
    status: 201
  - method: GET
    path: /exchange-network/membership-tiers/{tier_id}
    description: "Read one membership tier."
    roles: [Member, ResortManager, NetworkOperator, DisputeAnalyst]
    input: []
    output: MembershipTier
    status: 200
  - method: GET
    path: /exchange-network/membership-tiers
    description: "List membership tiers."
    roles: [Member, ResortManager, NetworkOperator, DisputeAnalyst]
    input: ["tier_code?", "limit?", "offset?"]
    output: MembershipTier[]
    status: 200

  # --- resorts ----------------------------------------------------------------
  - method: POST
    path: /exchange-network/resorts
    description: "Register a resort as PENDING_AFFILIATION with its deposit obligation and initial quality rating."
    roles: [NetworkOperator]
    input: ["name", "region_code", "required_annual_deposit_units", "initial_quality_rating", "units_per_size?", "demand_index?"]
    output: Resort
    status: 201
  - method: GET
    path: /exchange-network/resorts/{resort_id}
    description: "Read one resort, including its computed quality_score, quality_rating and committed_nights."
    roles: [Member, ResortManager, NetworkOperator, DisputeAnalyst]
    input: []
    output: Resort
    status: 200
  - method: GET
    path: /exchange-network/resorts
    description: "List resorts."
    roles: [Member, ResortManager, NetworkOperator, DisputeAnalyst]
    input: ["region_code?", "affiliation_status?", "quality_rating?", "limit?", "offset?"]
    output: Resort[]
    status: 200
  - method: PATCH
    path: /exchange-network/resorts/{resort_id}
    description: "Update the operator-controlled resort profile. Changing demand_index changes future trading-power valuations but never rewrites an existing Deposit.awarded_power."
    roles: [NetworkOperator]
    input: ["demand_index?", "units_per_size?", "required_annual_deposit_units?"]
    output: Resort
    status: 200
  - method: POST
    path: /exchange-network/resorts/{resort_id}/affiliation
    description: "Grant affiliation: PENDING_AFFILIATION -> ACTIVE, stamping affiliated_on from the logical clock."
    roles: [NetworkOperator]
    input: []
    output: Resort
    status: 200
  - method: POST
    path: /exchange-network/resorts/{resort_id}/status-changes
    description: "Drive the resort affiliation state machine to to_status."
    roles: [NetworkOperator]
    input: ["to_status", "reason?"]
    output: Resort
    status: 200
  - method: GET
    path: /exchange-network/resorts/{resort_id}/compliance
    description: "Report both variants of calculations.resort_deposit_obligation_shortfall for the current affiliation year."
    roles: [NetworkOperator, ResortManager]
    input: []
    output:
      resort_id: string
      affiliation_year_start: string
      affiliation_year_end: string
      obligation_units: integer
      deposits_committed_count: integer
      committed_nights: integer
      counted_by_stay_year: integer
      counted_by_deposit_date: integer
      shortfall_by_stay_year: integer
      shortfall_by_deposit_date: integer
    status: 200

  # --- season bands -----------------------------------------------------------
  - method: POST
    path: /exchange-network/season-bands
    description: "Add one closed MM-DD season band to a resort's calendar."
    roles: [NetworkOperator, ResortManager]
    input: [resort_id, band_code, start_month_day, end_month_day]
    output: SeasonBand
    status: 201
  - method: GET
    path: /exchange-network/season-bands/{band_id}
    description: "Read one season band."
    roles: [Member, ResortManager, NetworkOperator, DisputeAnalyst]
    input: []
    output: SeasonBand
    status: 200
  - method: GET
    path: /exchange-network/season-bands
    description: "List season bands, optionally for one resort."
    roles: [Member, ResortManager, NetworkOperator, DisputeAnalyst]
    input: ["resort_id?", "band_code?", "limit?", "offset?"]
    output: SeasonBand[]
    status: 200

  # --- resort quality reviews -------------------------------------------------
  - method: POST
    path: /exchange-network/resorts/{resort_id}/quality-reviews
    description: "File a post-stay quality review. Requires expected_resort_version because the review recomputes the resort's quality_score and quality_rating."
    roles: [Member]
    input: [confirmation_id, cleanliness_score, service_score, amenities_score, expected_resort_version]
    output: ResortQualityReview
    status: 201
  - method: GET
    path: /exchange-network/resort-quality-reviews/{review_id}
    description: "Read one quality review."
    roles: [Member, ResortManager, NetworkOperator, DisputeAnalyst]
    input: []
    output: ResortQualityReview
    status: 200
  - method: GET
    path: /exchange-network/resort-quality-reviews
    description: "List quality reviews, optionally for one resort or one confirmation."
    roles: [Member, ResortManager, NetworkOperator, DisputeAnalyst]
    input: ["resort_id?", "confirmation_id?", "limit?", "offset?"]
    output: ResortQualityReview[]
    status: 200

  # --- members ----------------------------------------------------------------
  - method: POST
    path: /exchange-network/members
    description: "Enrol a member on a tier as PENDING_PAYMENT."
    roles: [NetworkOperator]
    input: ["email", "full_name", "tier_id", "home_resort_id?"]
    output: Member
    status: 201
  - method: GET
    path: /exchange-network/members/{member_id}
    description: "Read one member, including trading_power_balance and wallet_credit_cents."
    roles: [Member, ResortManager, NetworkOperator, DisputeAnalyst]
    input: []
    output: Member
    status: 200
  - method: GET
    path: /exchange-network/members
    description: "List members."
    roles: [NetworkOperator, DisputeAnalyst]
    input: ["tier_id?", "home_resort_id?", "enrollment_status?", "limit?", "offset?"]
    output: Member[]
    status: 200
  - method: POST
    path: /exchange-network/members/{member_id}/dues-payments
    description: "Record an annual dues payment. Requires expected_member_version. The excess over tier.annual_dues_cents becomes wallet credit."
    roles: [Member, NetworkOperator]
    input: [amount_cents, paid_through_date, expected_member_version]
    output: Member
    status: 200
  - method: POST
    path: /exchange-network/members/{member_id}/status-changes
    description: "Drive the member enrollment state machine to to_status."
    roles: [NetworkOperator]
    input: ["to_status", "reason?"]
    output: Member
    status: 200
  - method: POST
    path: /exchange-network/members/{member_id}/tier-changes
    description: "Move a member onto a different membership tier. Takes effect for requests created afterwards; already-quoted charges are not repriced."
    roles: [NetworkOperator]
    input: [tier_id]
    output: Member
    status: 200

  # --- ledger -----------------------------------------------------------------
  - method: GET
    path: /exchange-network/ledger-entries/{entry_id}
    description: "Read one ledger entry."
    roles: [Member, NetworkOperator, DisputeAnalyst]
    input: []
    output: LedgerEntry
    status: 200
  - method: GET
    path: /exchange-network/ledger-entries
    description: "List ledger entries, optionally for one member or one entry_type. Ordered created_at ASC."
    roles: [Member, NetworkOperator, DisputeAnalyst]
    input: ["member_id?", "entry_type?", "related_entity_type?", "related_entity_id?", "limit?", "offset?"]
    output: LedgerEntry[]
    status: 200

  # --- deposits ---------------------------------------------------------------
  - method: POST
    path: /exchange-network/deposits
    description: "Bank a week. Freezes awarded_power from calculations.deposit_trading_power variant AT_DEPOSIT and credits the owner."
    roles: [Member, NetworkOperator]
    input: [member_id, resort_id, unit_size, check_in_date]
    output: Deposit
    status: 201
  - method: GET
    path: /exchange-network/deposits/{deposit_id}
    description: "Read one deposit, including both state dimensions and both power figures."
    roles: [Member, ResortManager, NetworkOperator, DisputeAnalyst]
    input: []
    output: Deposit
    status: 200
  - method: GET
    path: /exchange-network/deposits
    description: "List deposits, filterable on either state dimension independently."
    roles: [Member, ResortManager, NetworkOperator, DisputeAnalyst]
    input: ["member_id?", "resort_id?", "unit_size?", "deposit_status?", "rental_status?", "limit?", "offset?"]
    output: Deposit[]
    status: 200
  - method: POST
    path: /exchange-network/deposits/{deposit_id}/extensions
    description: "Buy extension months, pushing expires_at out by EXTENSION_DAYS_PER_MONTH per month. Requires expected_deposit_version."
    roles: [Member]
    input: [months, expected_deposit_version]
    output: Deposit
    status: 200
  - method: POST
    path: /exchange-network/deposits/{deposit_id}/withdrawal
    description: "Withdraw a banked week, reversing its remaining_power from the owner."
    roles: [Member]
    input: []
    output: Deposit
    status: 200
  - method: GET
    path: /exchange-network/deposits/{deposit_id}/valuation
    description: "Show the full trading-power derivation for this deposit under both calculation variants."
    roles: [Member, ResortManager, NetworkOperator, DisputeAnalyst]
    input: []
    output:
      deposit_id: string
      season_band_code: string
      unit_size_base: integer
      season_multiplier: number
      demand_multiplier: number
      quality_bonus: integer
      awarded_lead_time_days: integer
      awarded_power: integer
      settlement_lead_time_days: integer
      settlement_power: integer
      remaining_power: integer
    status: 200

  # --- exchange requests ------------------------------------------------------
  - method: POST
    path: /exchange-network/exchange-requests
    description: "Submit an exchange request. Supplying deposit_id makes it DEPOSIT_FIRST; omitting it makes it REQUEST_FIRST. Quotes and debits the exchange charge."
    roles: [Member]
    input: ["member_id", "requested_resort_id", "requested_unit_size", "window_start_date", "window_end_date", "deposit_id?"]
    output: ExchangeRequest
    status: 201
  - method: GET
    path: /exchange-network/exchange-requests/{request_id}
    description: "Read one exchange request."
    roles: [Member, ResortManager, NetworkOperator, DisputeAnalyst]
    input: []
    output: ExchangeRequest
    status: 200
  - method: GET
    path: /exchange-network/exchange-requests
    description: "List exchange requests."
    roles: [Member, ResortManager, NetworkOperator, DisputeAnalyst]
    input: ["member_id?", "requested_resort_id?", "deposit_id?", "matched_deposit_id?", "status?", "funding_mode?", "limit?", "offset?"]
    output: ExchangeRequest[]
    status: 200
  - method: POST
    path: /exchange-network/exchange-requests/{request_id}/funding
    description: "Attach a funding deposit to a REQUEST_FIRST request. funding_mode stays REQUEST_FIRST, so the surcharged power budget applies."
    roles: [Member]
    input: [deposit_id]
    output: ExchangeRequest
    status: 200
  - method: POST
    path: /exchange-network/exchange-requests/{request_id}/decline
    description: "Decline the offered match: releases the held deposit, returns the request to WAITLISTED and increments decline_count."
    roles: [Member]
    input: []
    output: ExchangeRequest
    status: 200
  - method: POST
    path: /exchange-network/exchange-requests/{request_id}/cancellation
    description: "Cancel the request and refund the unrefunded portion of its exchange charge."
    roles: [Member]
    input: []
    output: ExchangeRequest
    status: 200

  # --- confirmations ----------------------------------------------------------
  - method: POST
    path: /exchange-network/confirmations
    description: "Confirm a MATCHED request inside its hold window: debits settlement_power, moves the deposit to USED and reconciles the settlement delta to the depositing owner."
    roles: [Member]
    input: [exchange_request_id]
    output: Confirmation
    status: 201
  - method: GET
    path: /exchange-network/confirmations/{confirmation_id}
    description: "Read one confirmation."
    roles: [Member, ResortManager, NetworkOperator, DisputeAnalyst]
    input: []
    output: Confirmation
    status: 200
  - method: GET
    path: /exchange-network/confirmations
    description: "List confirmations, including reinstatement successors via reinstated_from_confirmation_id."
    roles: [Member, ResortManager, NetworkOperator, DisputeAnalyst]
    input: ["exchange_request_id?", "awarded_deposit_id?", "reinstated_from_confirmation_id?", "status?", "limit?", "offset?"]
    output: Confirmation[]
    status: 200
  - method: POST
    path: /exchange-network/confirmations/{confirmation_id}/cancellation
    description: "Cancel a confirmed exchange. Selects a restoration variant by calculations.cancellation_settlement and levies the tier cancellation fee."
    roles: [Member, NetworkOperator]
    input: []
    output: Confirmation
    status: 200
  - method: POST
    path: /exchange-network/confirmations/{confirmation_id}/reinstatement
    description: "Reinstate a cancelled exchange inside REINSTATEMENT_WINDOW_DAYS, creating a successor confirmation and levying the tier reinstatement fee."
    roles: [Member]
    input: []
    output: Confirmation
    status: 201

  # --- matching runs ----------------------------------------------------------
  - method: POST
    path: /exchange-network/matching-runs
    description: "Execute the pinned seven-step operations run at the current logical clock instant: dues lapse, deposit expiry, request expiry and denial, matching pass, confirmation completion, getaway listing, resort probation evaluation."
    roles: [NetworkOperator]
    input: ["note?"]
    output: MatchingRun
    status: 201
  - method: GET
    path: /exchange-network/matching-runs/{run_id}
    description: "Read one matching run and its eleven counters."
    roles: [NetworkOperator, ResortManager, DisputeAnalyst]
    input: []
    output: MatchingRun
    status: 200
  - method: GET
    path: /exchange-network/matching-runs
    description: "List matching runs, ordered run_sequence ASC."
    roles: [NetworkOperator, ResortManager, DisputeAnalyst]
    input: ["status?", "limit?", "offset?"]
    output: MatchingRun[]
    status: 200

  # --- getaway offers ---------------------------------------------------------
  - method: GET
    path: /exchange-network/getaway-offers/{offer_id}
    description: "Read one getaway offer."
    roles: [Member, ResortManager, NetworkOperator, DisputeAnalyst]
    input: []
    output: GetawayOffer
    status: 200
  - method: GET
    path: /exchange-network/getaway-offers
    description: "List getaway offers."
    roles: [Member, ResortManager, NetworkOperator, DisputeAnalyst]
    input: ["deposit_id?", "booked_by_member_id?", "created_by_run_id?", "status?", "limit?", "offset?"]
    output: GetawayOffer[]
    status: 200
  - method: POST
    path: /exchange-network/getaway-offers/{offer_id}/bookings
    description: "Rent unmatched inventory for cash. Debits list_price_cents and moves the deposit's rental_status to RENTED."
    roles: [Member]
    input: [member_id]
    output: GetawayOffer
    status: 200
  - method: POST
    path: /exchange-network/getaway-offers/{offer_id}/withdrawal
    description: "Pull a listing back off the getaway market, returning the deposit's rental_status to NOT_LISTED and re-crediting its remaining_power."
    roles: [NetworkOperator]
    input: []
    output: GetawayOffer
    status: 200

  # --- disputes ---------------------------------------------------------------
  - method: POST
    path: /exchange-network/disputes
    description: "File a trading-power or resort-quality dispute."
    roles: [Member]
    input: ["member_id", "subject_type", "narrative", "deposit_id?", "resort_id?", "confirmation_id?"]
    output: Dispute
    status: 201
  - method: GET
    path: /exchange-network/disputes/{dispute_id}
    description: "Read one dispute."
    roles: [Member, ResortManager, NetworkOperator, DisputeAnalyst]
    input: []
    output: Dispute
    status: 200
  - method: GET
    path: /exchange-network/disputes
    description: "List disputes."
    roles: [Member, NetworkOperator, DisputeAnalyst]
    input: ["member_id?", "subject_type?", "deposit_id?", "resort_id?", "confirmation_id?", "status?", "limit?", "offset?"]
    output: Dispute[]
    status: 200
  - method: POST
    path: /exchange-network/disputes/{dispute_id}/review
    description: "Open analyst review: OPEN -> UNDER_REVIEW."
    roles: [DisputeAnalyst]
    input: []
    output: Dispute
    status: 200
  - method: POST
    path: /exchange-network/disputes/{dispute_id}/info-requests
    description: "Ask the filing member for more information, consuming one of MAX_DISPUTE_ROUNDS rounds."
    roles: [DisputeAnalyst]
    input: [question]
    output: Dispute
    status: 200
  - method: POST
    path: /exchange-network/disputes/{dispute_id}/responses
    description: "Answer the analyst's information request: INFO_REQUESTED -> UNDER_REVIEW."
    roles: [Member]
    input: [answer]
    output: Dispute
    status: 200
  - method: POST
    path: /exchange-network/disputes/{dispute_id}/resolution
    description: "Resolve the dispute. Upholding a TRADING_POWER dispute grants power against the cited deposit; upholding a RESORT_QUALITY dispute adds a complaint strike to the cited resort."
    roles: [DisputeAnalyst]
    input: ["outcome", "resolution_note", "granted_power_adjustment?"]
    output: Dispute
    status: 200
  - method: POST
    path: /exchange-network/disputes/{dispute_id}/withdrawal
    description: "Withdraw a dispute the member filed."
    roles: [Member]
    input: []
    output: Dispute
    status: 200

  # --- logical clock ----------------------------------------------------------
  - method: POST
    path: /exchange-network/_clock/set_current_utc
    description: "Test-driving endpoint: set the server's logical clock. The default logical clock is 2026-08-01T00:00:00Z. Setting the clock has no side effects of its own — no deposit expires, no request is swept and no resort changes affiliation_status until POST /exchange-network/matching-runs is called."
    roles: [NetworkOperator]
    input: [to_iso8601]
    output:
      current_utc: string
      previous_utc: string
    status: 200

# -----------------------------------------------------------------------------
# §1.6 Error Catalog
# -----------------------------------------------------------------------------
errors:

  # --- auth (401 / 403) -------------------------------------------------------
  - error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    message: "X-User-Id and X-User-Role headers are both required."
    raised_by: "all endpoints"
  - error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    message: "X-User-Role must be one of Member, ResortManager, NetworkOperator, DisputeAnalyst."
    raised_by: "all endpoints"
  - error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    message: "This role may not call this endpoint."
    raised_by: "all endpoints"
  - error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    message: "A member may only act on its own records."
    raised_by: "every member-owned write endpoint"
  - error_id: ERR_NOT_RESORT_MANAGER
    http_status: 403
    message: "A resort manager may only act on its own resort."
    raised_by: "POST /exchange-network/season-bands, GET /exchange-network/resorts/{resort_id}/compliance"

  # --- request shape (400) ----------------------------------------------------
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "Request body or query parameters failed shape validation."
    raised_by: "all endpoints"

  # --- existence (404) --------------------------------------------------------
  - error_id: ERR_ACTING_IDENTITY_NOT_FOUND
    http_status: 404
    message: "The acting identity in X-User-Id does not exist."
    raised_by: "all endpoints, for roles Member and ResortManager"
  - error_id: ERR_TIER_NOT_FOUND
    http_status: 404
    message: "Membership tier not found."
    raised_by: "GET /exchange-network/membership-tiers/{tier_id}, POST /exchange-network/members, POST /exchange-network/members/{member_id}/tier-changes"
  - error_id: ERR_RESORT_NOT_FOUND
    http_status: 404
    message: "Resort not found."
    raised_by: "every endpoint carrying resort_id"
  - error_id: ERR_SEASON_BAND_NOT_FOUND
    http_status: 404
    message: "Season band not found."
    raised_by: "GET /exchange-network/season-bands/{band_id}"
  - error_id: ERR_MEMBER_NOT_FOUND
    http_status: 404
    message: "Member not found."
    raised_by: "every endpoint carrying member_id"
  - error_id: ERR_DEPOSIT_NOT_FOUND
    http_status: 404
    message: "Deposit not found."
    raised_by: "every endpoint carrying deposit_id"
  - error_id: ERR_EXCHANGE_REQUEST_NOT_FOUND
    http_status: 404
    message: "Exchange request not found."
    raised_by: "every endpoint carrying request_id or exchange_request_id"
  - error_id: ERR_CONFIRMATION_NOT_FOUND
    http_status: 404
    message: "Confirmation not found."
    raised_by: "every endpoint carrying confirmation_id"
  - error_id: ERR_GETAWAY_OFFER_NOT_FOUND
    http_status: 404
    message: "Getaway offer not found."
    raised_by: "every endpoint carrying offer_id"
  - error_id: ERR_DISPUTE_NOT_FOUND
    http_status: 404
    message: "Dispute not found."
    raised_by: "every endpoint carrying dispute_id"
  - error_id: ERR_MATCHING_RUN_NOT_FOUND
    http_status: 404
    message: "Matching run not found."
    raised_by: "GET /exchange-network/matching-runs/{run_id}"
  - error_id: ERR_QUALITY_REVIEW_NOT_FOUND
    http_status: 404
    message: "Quality review not found."
    raised_by: "GET /exchange-network/resort-quality-reviews/{review_id}"
  - error_id: ERR_LEDGER_ENTRY_NOT_FOUND
    http_status: 404
    message: "Ledger entry not found."
    raised_by: "GET /exchange-network/ledger-entries/{entry_id}"

  # --- concurrency (412) ------------------------------------------------------
  - error_id: ERR_STALE_VERSION
    http_status: 412
    message: "The submitted expected version does not match the current version of the record."
    raised_by: "POST /exchange-network/deposits/{deposit_id}/extensions, POST /exchange-network/resorts/{resort_id}/quality-reviews, POST /exchange-network/members/{member_id}/dues-payments"

  # --- state (409) ------------------------------------------------------------
  - error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    message: "The record's current state has no such transition."
    raised_by: "all state-changing endpoints"
  - error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    message: "The member's enrollment status must be ACTIVE for this operation."
    raised_by: "POST /exchange-network/deposits, POST /exchange-network/exchange-requests, POST /exchange-network/exchange-requests/{request_id}/funding, POST /exchange-network/confirmations, POST /exchange-network/confirmations/{confirmation_id}/reinstatement, POST /exchange-network/getaway-offers/{offer_id}/bookings, POST /exchange-network/disputes"
  - error_id: ERR_DEPOSIT_NOT_AVAILABLE
    http_status: 409
    message: "The deposit must be BANKED and not listed on the getaway market."
    raised_by: "POST /exchange-network/exchange-requests, POST /exchange-network/exchange-requests/{request_id}/funding, POST /exchange-network/confirmations/{confirmation_id}/reinstatement"
  - error_id: ERR_STAY_NOT_COMPLETED
    http_status: 409
    message: "The cited confirmation's stay has not completed."
    raised_by: "POST /exchange-network/resorts/{resort_id}/quality-reviews, POST /exchange-network/disputes"

  # --- business safety (409) --------------------------------------------------
  - error_id: ERR_RESORT_NOT_AFFILIATED
    http_status: 409
    message: "The resort's affiliation status must be ACTIVE or PROBATION."
    raised_by: "POST /exchange-network/deposits, POST /exchange-network/exchange-requests"
  - error_id: ERR_DEPOSIT_EXPIRED
    http_status: 409
    message: "The deposit has passed its expiry instant."
    raised_by: "POST /exchange-network/deposits/{deposit_id}/extensions, POST /exchange-network/deposits/{deposit_id}/withdrawal, POST /exchange-network/exchange-requests, POST /exchange-network/disputes/{dispute_id}/resolution"

  # --- business temporal (422 / 409) ------------------------------------------
  - error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    message: "The end of the range must not precede its start, and the span must be within its limit."
    raised_by: "POST /exchange-network/season-bands, POST /exchange-network/exchange-requests"
  - error_id: ERR_DEPOSIT_WINDOW_CLOSED
    http_status: 422
    message: "A week must be banked at least 60 days before its check-in date."
    raised_by: "POST /exchange-network/deposits"
  - error_id: ERR_REINSTATEMENT_WINDOW_CLOSED
    http_status: 409
    message: "The 14-day reinstatement window has closed."
    raised_by: "POST /exchange-network/confirmations/{confirmation_id}/reinstatement"

  # --- business referential (422) ---------------------------------------------
  - error_id: ERR_NO_SEASON_BAND_FOR_DATE
    http_status: 422
    message: "No season band of this resort covers that date."
    raised_by: "POST /exchange-network/deposits, POST /exchange-network/exchange-requests"
  - error_id: ERR_DISPUTE_SUBJECT_MISMATCH
    http_status: 422
    message: "The supplied subject references do not match subject_type."
    raised_by: "POST /exchange-network/disputes"

  # --- business constraint (409) ----------------------------------------------
  - error_id: ERR_SEASON_BAND_OVERLAP
    http_status: 409
    message: "The season band shares at least one day with an existing band of this resort."
    raised_by: "POST /exchange-network/season-bands"
  - error_id: ERR_UNIT_INVENTORY_CONFLICT
    http_status: 409
    message: "The resort has no remaining capacity for that unit size on at least one night of the occupancy interval."
    raised_by: "POST /exchange-network/deposits"
  - error_id: ERR_ACTIVE_REQUEST_LIMIT
    http_status: 409
    message: "The member has reached its tier's active exchange request limit."
    raised_by: "POST /exchange-network/exchange-requests"
  - error_id: ERR_EXTENSION_CAP_EXCEEDED
    http_status: 409
    message: "A deposit may not carry more than 12 extension months."
    raised_by: "POST /exchange-network/deposits/{deposit_id}/extensions"
  - error_id: ERR_DISPUTE_ROUND_LIMIT
    http_status: 409
    message: "This dispute has used all of its information-request rounds."
    raised_by: "POST /exchange-network/disputes/{dispute_id}/info-requests"
  - error_id: ERR_DUPLICATE_QUALITY_REVIEW
    http_status: 409
    message: "A quality review already exists for that confirmation."
    raised_by: "POST /exchange-network/resorts/{resort_id}/quality-reviews"
  - error_id: ERR_AFFILIATION_REQUIRES_SEASON_BANDS
    http_status: 409
    message: "A resort must have at least one season band before it can be affiliated."
    raised_by: "POST /exchange-network/resorts/{resort_id}/affiliation"
  - error_id: ERR_GETAWAY_SELF_BOOKING
    http_status: 409
    message: "The owner of the underlying deposit may not book its getaway offer."
    raised_by: "POST /exchange-network/getaway-offers/{offer_id}/bookings"

  # --- business fiscal (422 / 402) --------------------------------------------
  - error_id: ERR_INSUFFICIENT_DUES_PAYMENT
    http_status: 422
    message: "The payment does not cover the tier's annual dues."
    raised_by: "POST /exchange-network/members/{member_id}/dues-payments"
  - error_id: ERR_INSUFFICIENT_WALLET_CREDIT
    http_status: 402
    message: "The member's wallet credit does not cover this charge."
    raised_by: "POST /exchange-network/exchange-requests, POST /exchange-network/confirmations/{confirmation_id}/cancellation, POST /exchange-network/confirmations/{confirmation_id}/reinstatement, POST /exchange-network/deposits/{deposit_id}/extensions, POST /exchange-network/getaway-offers/{offer_id}/bookings"
  - error_id: ERR_INSUFFICIENT_TRADING_POWER
    http_status: 402
    message: "The member's trading power balance does not cover the settlement power of this exchange."
    raised_by: "POST /exchange-network/confirmations, POST /exchange-network/confirmations/{confirmation_id}/reinstatement"

# -----------------------------------------------------------------------------
# §1.7 Role / Permission Matrix
# -----------------------------------------------------------------------------
roles:

  - name: Member
    identity: "entity_backed: X-User-Id is a Member.id"
    description: >-
      An enrolled exchange member. Banks weeks, files exchange requests, confirms and cancels
      exchanges, buys extensions, books getaways, files quality reviews and disputes. Sees every
      resort, tier, deposit, request, confirmation, getaway offer and season band in the network
      (the inventory market is public), but may only write rows it owns.
    can_write: >-
      POST /deposits, POST /deposits/{deposit_id}/extensions, POST
      /deposits/{deposit_id}/withdrawal, POST /exchange-requests, POST
      /exchange-requests/{request_id}/funding, POST /exchange-requests/{request_id}/decline, POST
      /exchange-requests/{request_id}/cancellation, POST /confirmations, POST
      /confirmations/{confirmation_id}/cancellation, POST
      /confirmations/{confirmation_id}/reinstatement, POST /getaway-offers/{offer_id}/bookings,
      POST /members/{member_id}/dues-payments, POST /resorts/{resort_id}/quality-reviews, POST
      /disputes, POST /disputes/{dispute_id}/responses, POST /disputes/{dispute_id}/withdrawal
    cannot: >-
      Create or affiliate resorts, edit demand_index or units_per_size, create season bands,
      create tiers or other members, change any enrollment_status, run a matching run, set the
      clock, withdraw a getaway listing, list all members, or touch any dispute review action.

  - name: ResortManager
    identity: "entity_backed: X-User-Id is a Resort.id"
    description: >-
      Operates one affiliated resort. Maintains that resort's season calendar and reads its
      deposit-obligation compliance report and the matching runs that affect it. Cannot value or
      re-rate its own resort and cannot see the member roster or the dispute queue.
    can_write: "POST /season-bands (only for its own resort_id)"
    cannot: >-
      Set demand_index or quality ratings, affiliate or suspend a resort, create or read the
      member list, create deposits, file or resolve disputes, run a matching run, set the clock,
      or read another resort's compliance report.

  - name: NetworkOperator
    identity: "opaque: X-User-Id is an operator handle and is not looked up"
    description: >-
      Runs the exchange network. Creates tiers, resorts and members, grants and revokes
      affiliation, sets demand_index and units_per_size, drives member enrollment status and
      tier changes, executes matching runs, withdraws getaway listings and controls the logical
      clock. Records dues payments on a member's behalf and may cancel a confirmation on a
      member's behalf.
    can_write: >-
      POST /membership-tiers, POST /resorts, PATCH /resorts/{resort_id}, POST
      /resorts/{resort_id}/affiliation, POST /resorts/{resort_id}/status-changes, POST
      /season-bands, POST /members, POST /members/{member_id}/dues-payments, POST
      /members/{member_id}/status-changes, POST /members/{member_id}/tier-changes, POST
      /deposits, POST /confirmations/{confirmation_id}/cancellation, POST /matching-runs, POST
      /getaway-offers/{offer_id}/withdrawal, POST /_clock/set_current_utc
    cannot: >-
      File an exchange request, confirm an exchange, book a getaway, file a quality review, file
      a dispute, or take any dispute review action — the operator is never a counterparty and is
      never the adjudicator.

  - name: DisputeAnalyst
    identity: "opaque: X-User-Id is an analyst handle and is not looked up"
    description: >-
      Adjudicates member disputes over trading power and resort quality. Reads members, deposits,
      confirmations, reviews, ledger entries and matching runs in order to judge, and is the only
      role that can move a dispute through review, information requests and resolution.
    can_write: >-
      POST /disputes/{dispute_id}/review, POST /disputes/{dispute_id}/info-requests, POST
      /disputes/{dispute_id}/resolution
    cannot: >-
      File or withdraw a dispute, answer an information request, create or edit resorts, tiers,
      members, deposits, requests or confirmations, run a matching run, or set the clock.

