          trigger:
            - call: "POST /api/abatement-orders/${aid}/complete"
              payload: { removed_weight_kg: 50 }
              as: AbatementSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "AbatementOrder.${aid}.data.error_id == ERR_INVALID_STATE"   # priority 10 beats priority 13

