  # =========================================================================
  # §0.5 Rule 3 — Non-linear state machines (cycle and parallel dimensions)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: comparative_analysis_insufficient_reopen_cycle_increments_revision_round
        grounds:
          - state_machines.ComparativeAnalysis.SUBMITTED_to_INSUFFICIENT
          - state_machines.ComparativeAnalysis.INSUFFICIENT_to_DRAFT
          - state_machines.NqtlItem.ANALYSIS_SUBMITTED_to_ANALYSIS_DRAFTED
          - entities.ComparativeAnalysis.fields.revision_round
          - validations.priority_26_ERR_REVISION_LIMIT_REACHED
        distinguishing_aspect: |
          The ComparativeAnalysis machine is cyclic on the entity ComparativeAnalysis: the
          SUBMITTED -> INSUFFICIENT -> DRAFT -> SUBMITTED loop returns the row to a state it already
          occupied while revision_round ratchets upward, and the loop simultaneously walks the owning
          NqtlItem backwards from ANALYSIS_SUBMITTED to ANALYSIS_DRAFTED.
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one classification, one NETWORK_ADMISSION NqtlItem applied_to BOTH."
            - "One ComparativeAnalysis authored by user-sponsor-01 with factor_count 3 and evidentiary_standard_count 2, driven to SUBMITTED."
            - "No VALIDATED DENIAL_RATES submission is needed: the INSUFFICIENT branch of review is not gated on as-applied evidence."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "NETWORK_ADMISSION", applied_to: "BOTH", description: "Provider network admission standards for outpatient office visits." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id, item_v0: $.data.version }
            - call: "POST /parity/comparative-analyses"
              payload: { nqtl_item_id: "${item_id}", factor_count: 3, evidentiary_standard_count: 2, stringency_written_finding: "COMPARABLE", stringency_operation_finding: "COMPARABLE", expected_nqtl_item_version: "${item_v0}" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { ca_id: $.data.id }
            - call: "POST /parity/comparative-analyses/${ca_id}/submit"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
          trigger:
            - call: "POST /parity/comparative-analyses/${ca_id}/review"
              payload: { outcome: "INSUFFICIENT", review_note: "The written factors are recited but the in-operation stringency comparison is absent." }
              as: ComplianceOfficer
              as_user_id: "user-officer-02"
            - call: "GET /parity/nqtl-items/${item_id}"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { item_status_after_review: $.data.status }
            - call: "POST /parity/comparative-analyses/${ca_id}/reopen"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { round_after_reopen: $.data.revision_round }
            - call: "POST /parity/comparative-analyses/${ca_id}/submit"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
          assert:
            - "after the review call: ComparativeAnalysis.${ca_id}.status == INSUFFICIENT and NqtlItem.${item_id}.status == ANALYSIS_DRAFTED"
            - "after the reopen call: ComparativeAnalysis.${ca_id}.status == DRAFT and ComparativeAnalysis.${ca_id}.revision_round == 1"
            - "after the second submit: ComparativeAnalysis.${ca_id}.status == SUBMITTED and ComparativeAnalysis.${ca_id}.revision_round == 1"
            - "NqtlItem.${item_id}.status == ANALYSIS_SUBMITTED (the item completed the same loop)"
            - "a further reopen from SUBMITTED -> ERR_ANALYSIS_NOT_INSUFFICIENT (the loop can only be re-entered through an INSUFFICIENT review)"
            - "PlanYear.${py_id}.compliance_posture == COMPLIANT (an unresolved analysis is not itself a violation and the item has left INVENTORIED)"

      - name: vendor_request_fulfilment_and_escalation_dimensions_advance_independently
        grounds:
          - state_machines.VendorDataRequest
          - entities.VendorDataRequest.fields.fulfillment_status
          - entities.VendorDataRequest.fields.escalation_status
          - entities.VendorDataRequest.fields.validated_submission_count
          - calculations.administrator_cooperation_score
        distinguishing_aspect: |
          A different entity with a parallel-dimension machine: VendorDataRequest carries two
          orthogonal state variables. Escalating to NOTICE_SENT leaves fulfillment_status at PARTIAL,
          and the later submission that reaches requested_item_count moves fulfillment_status to
          FULFILLED without resetting escalation_status — the combined state (FULFILLED, NOTICE_SENT)
          is reachable and is not expressible as a single linear status.
        test_recipe:
          setup:
            - "One Administrator with contractual_production_days 45, one OPEN PlanYear, one classification."
            - "One VendorDataRequest issued at the default clock 2026-08-01T00:00:00Z with requested_item_count 2 and requested_submission_types [DENIAL_RATES, NETWORK_COMPOSITION] (due_at 2026-09-15T00:00:00.000Z)."
            - "One VALIDATED DENIAL_RATES submission, so fulfillment_status is PARTIAL and escalation_status is NONE."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", requested_item_count: 2, requested_submission_types: ["DENIAL_RATES", "NETWORK_COMPOSITION"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_id: $.data.id, due: $.data.due_at }
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "DENIAL_RATES", mh_denials: 137, mh_adjudicated_claims: 1919, ms_denials: 71, ms_adjudicated_claims: 1913 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { sub_dr_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/vendor-requests/${vr_id}/escalate"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { esc_after: $.data.escalation_status, ful_after: $.data.fulfillment_status }
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "NETWORK_COMPOSITION", mh_in_network_provider_pct: 0.34, ms_in_network_provider_pct: 0.62 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { sub_nc_id: $.data.id }
          assert:
            - "before the escalate call: VendorDataRequest.${vr_id}.fulfillment_status == PARTIAL and VendorDataRequest.${vr_id}.escalation_status == NONE and validated_submission_count == 1"
            - "after the escalate call: escalation_status == NOTICE_SENT while fulfillment_status is still PARTIAL and is_overdue == true"
            - "after the second submission: fulfillment_status == FULFILLED and escalation_status is still NOTICE_SENT (the escalation dimension is not rewound)"
            - "VendorDataRequest.${vr_id}.validated_submission_count == 2"
            - "Administrator.${adm_id}.outstanding_request_count == 0"
            - "Administrator.${adm_id}.late_request_count == 0 (late counting considers only OPEN and PARTIAL rows)"
            - "Administrator.${adm_id}.cooperation_score == 100.00 and Administrator.${adm_id}.cooperation_status == COOPERATIVE"
            - "Administrator.${adm_id}.breach_count == 0"
            - "a third escalate call now -> escalation_status BREACH_DECLARED is refused with ERR_REQUEST_ALREADY_FULFILLED"

  # =========================================================================
  # §0.5 Rule 4 — Transitive cascades (depth >= 3)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: violation_determination_cascades_four_levels_to_plan_year_status
        grounds:
          - state_machines.NqtlItem.ANALYSIS_SUBMITTED_to_VIOLATION
          - state_machines.PlanYear.OPEN_to_REMEDIATION
          - calculations.plan_year_compliance_posture
          - entities.ParticipantNotice
          - entities.PlanYear.fields.notified_violation_count
        distinguishing_aspect: |
          Depth 4, triggered by a compliance determination:
          determination -> (1) NqtlItem.status VIOLATION -> (2) a ParticipantNotice is issued with the
          plan year's participant count -> (3) PlanYear.open_violation_count / notified_violation_count
