          trigger:
            - call: "POST /pro/performances"
              payload: { work_id: "${gwork}", license_id: "${gr_lic}", performance_date: "2026-02-01", medium: TERRESTRIAL_RADIO, daypart: DAY, source: MONITORING, play_count: 10 }
              as: RoyaltyDistributor
            - call: "POST /pro/works/${gwork}/confirm"
              payload: {}
              as: ProRegistrar
            - call: "POST /pro/performances"
              payload: { work_id: "${gwork}", license_id: "${gr_lic}", performance_date: "2026-02-01", medium: TERRESTRIAL_RADIO, daypart: DAY, source: MONITORING, play_count: 10 }
              as: RoyaltyDistributor
              captures: { gev: $.data.status }
          assert:
            - "first ingest error_id == ERR_WORK_NOT_CONFIRMED (422)"
            - "after work confirm, second ingest succeeds with gev == ACCEPTED"
      - name: license_issuance_gated_by_licensee_standing_and_audit_close_gated_by_adjustment
        grounds:
          - validations[priority=17]
          - state_machines.AuditRequest.FINDINGS_FILED_to_CLOSED
          - errors[ERR_LICENSEE_DELINQUENT]
          - errors[ERR_AUDIT_CLOSE_REQUIRES_ADJUSTMENT]
        distinguishing_aspect: |
          Pair: AuditRequest depends on RoyaltyAdjustment (close blocked while
          no non-REJECTED AUDIT_FINDING adjustment exists) and License depends
          on Licensee (the audit close that flips credit_standing to DELINQUENT
          is what blocks later license issuance) — different entity pairs from
          PerformanceEvent/Work.
        test_recipe:
          setup:
            - "licensee with an audit filed with findings_delta_cents 2_000_000 (> 1_000_000 threshold); no AUDIT_FINDING adjustment exists yet"
          setup_api_calls:
            - call: "POST /pro/licensees"
              payload: { legal_name: "Audit Co", category: VENUE, reported_revenue_cents: 10000000000, usage_units: 400 }
              as: ProLicensingAdmin
              captures: { au_id: $.data.id, au_ver: $.data.version }
            - call: "POST /pro/licensees/${au_id}/audits"
              payload: { scope_period_start: "2025-01-01", scope_period_end: "2026-01-01" }
              as: FinanceOfficer
              captures: { audit_id: $.data.id }
            - call: "POST /pro/audits/${audit_id}/file-findings"
              payload: { findings_delta_cents: 2000000 }
              as: FinanceOfficer
          trigger:
            - call: "POST /pro/audits/${audit_id}/close"
              payload: {}
              as: FinanceOfficer
            - call: "GET /pro/licensees/${au_id}"
              payload: {}
              as: FinanceOfficer
              captures: { au_standing: $.data.credit_standing }
          assert:
            - "audit close error_id == ERR_AUDIT_CLOSE_REQUIRES_ADJUSTMENT (422) — AuditRequest close gated on existence of a compensating RoyaltyAdjustment"
            - "au_standing == GOOD (standing flip to DELINQUENT is reachable only through the gated close, so issuance remains possible while the gate holds)"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: performance_outside_closed_license_window
        grounds:
          - validations[priority=9]
          - errors[ERR_PERFORMANCE_OUTSIDE_LICENSE_WINDOW]
        distinguishing_aspect: |
          Resource: License. Interval semantics: CLOSED interval — a
          performance dated exactly on expiry_date is inside the window, one
          day after is rejected. Adjacency outside the interval is not merged
          or tolerated.
        test_recipe:
          setup:
            - "confirmed work; license covering 2026-01-01..2026-06-30"
          setup_api_calls:
            - call: "POST /pro/affiliates"
              payload: { legal_name: "Pub T", party_type: PUBLISHER, affiliation_code: "PUBT" }
              as: ProRegistrar
              captures: { pt_id: $.data.id }
            - call: "POST /pro/works"
              payload: { title: "Song T", registered_by_affiliate_id: "${pt_id}" }
              as: Publisher
              as_user_id: "${pt_id}"
              captures: { twork: $.data.id }
            - call: "POST /pro/works/${twork}/share-claims"
              payload: { affiliate_id: "${pt_id}", role: PUBLISHER, collection_share_bps: 10000, interest_share_bps: 10000 }
              as: Publisher
              as_user_id: "${pt_id}"
            - call: "POST /pro/works/${twork}/confirm"
              payload: {}
              as: ProRegistrar
            - call: "POST /pro/licensees"
              payload: { legal_name: "Window Radio", category: BROADCASTER, reported_revenue_cents: 300000000000, usage_units: 0 }
              as: ProLicensingAdmin
              captures: { wt_id: $.data.id, wt_ver: $.data.version }
            - call: "POST /pro/licensees/${wt_id}/licenses"
              payload: { effective_date: "2026-01-01", expiry_date: "2026-06-30", expected_licensee_version: "${wt_ver}" }
              as: ProLicensingAdmin
              captures: { wt_lic: $.data.id }
          trigger:
            - call: "POST /pro/performances"
              payload: { work_id: "${twork}", license_id: "${wt_lic}", performance_date: "2026-06-30", medium: TERRESTRIAL_RADIO, daypart: DAY, source: MONITORING, play_count: 5 }
              as: RoyaltyDistributor
              captures: { last_day_status: $.data.status }
            - call: "POST /pro/performances"
              payload: { work_id: "${twork}", license_id: "${wt_lic}", performance_date: "2026-07-01", medium: TERRESTRIAL_RADIO, daypart: DAY, source: MONITORING, play_count: 5 }
              as: RoyaltyDistributor
          assert:
            - "performance on 2026-06-30 accepted (expiry is inclusive): last_day_status == ACCEPTED"
            - "performance on 2026-07-01 rejected with ERR_PERFORMANCE_OUTSIDE_LICENSE_WINDOW (422)"
      - name: pool_proration_partial_period_intersection
        grounds:
          - calculations.royalty_pool
          - entities.DistributionCycle.fields.pool_amount_cents
        distinguishing_aspect: |
          Resource: DistributionCycle period vs License term. Interval
          semantics differ from the closed-window point check: here the
          OVERLAP (intersection length in days, inclusive both ends) of two
          ranges prorates the license contribution — a license covering only
          90 of the cycle's days contributes fee * 90/365, truncated, not the
          full fee. Different interval arithmetic (aggregate proportional
          capacity vs point-in-closed-window).
        test_recipe:
          setup:
            - "broadcaster fee_basis 4_800_000_000 with license 2026-01-01..2026-03-31 (90 days incl.); cycle period 2026-01-01..2026-12-31"
            - "one confirmed work, one captured performance inside the license window"
          setup_api_calls:
            - call: "POST /pro/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: ProSystemAdmin
            - call: "POST /pro/licensees"
              payload: { legal_name: "Prorate Radio", category: BROADCASTER, reported_revenue_cents: 300000000000, usage_units: 0 }
              as: ProLicensingAdmin
              captures: { q_id: $.data.id, q_ver: $.data.version }
            - call: "POST /pro/licensees/${q_id}/licenses"
              payload: { effective_date: "2026-01-01", expiry_date: "2026-03-31", expected_licensee_version: "${q_ver}" }
              as: ProLicensingAdmin
              captures: { q_lic: $.data.id }
            - call: "POST /pro/affiliates"
              payload: { legal_name: "Pub Q", party_type: PUBLISHER, affiliation_code: "PUBQ" }
              as: ProRegistrar
              captures: { pq_id: $.data.id }
            - call: "POST /pro/works"
              payload: { title: "Song Q", registered_by_affiliate_id: "${pq_id}" }
              as: Publisher
              as_user_id: "${pq_id}"
              captures: { qwork: $.data.id }
            - call: "POST /pro/works/${qwork}/share-claims"
              payload: { affiliate_id: "${pq_id}", role: PUBLISHER, collection_share_bps: 10000, interest_share_bps: 10000 }
              as: Publisher
              as_user_id: "${pq_id}"
            - call: "POST /pro/works/${qwork}/confirm"
              payload: {}
              as: ProRegistrar
            - call: "POST /pro/performances"
              payload: { work_id: "${qwork}", license_id: "${q_lic}", performance_date: "2026-02-01", medium: TERRESTRIAL_RADIO, daypart: DAY, source: MONITORING, play_count: 100 }
              as: RoyaltyDistributor
              captures: { qev: $.data.id }
            - call: "POST /pro/cycles"
              payload: { label: "Q-FULL", period_start: "2026-01-01", period_end: "2026-12-31" }
              as: RoyaltyDistributor
              captures: { qcyc: $.data.id }
            - call: "POST /pro/cycles/${qcyc}/open"
              payload: {}
              as: RoyaltyDistributor
            - call: "POST /pro/cycles/${qcyc}/performances/capture"
              payload: { performance_event_ids: ["${qev}"] }
              as: RoyaltyDistributor
            - call: "GET /pro/cycles/${qcyc}"
              payload: {}
              as: RoyaltyDistributor
              captures: { qcv: $.data.version }
          trigger:
            - call: "POST /pro/cycles/${qcyc}/close-collection"
              payload: { expected_cycle_version: "${qcv}" }
              as: RoyaltyDistributor
              captures: { qpool: $.data.pool_amount_cents }
          assert:
            - "qpool == 1006027397 (int(4800000000 * 90/365) = 1183561643 truncated per license; * 0.85 = 1006027396.55 -> 1006027397)"

  # =========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: distribution_conserves_pool_across_statements_and_unclaimed
        grounds:
          - calculations.royalty_allocation
          - entities.UnclaimedRoyaltyPool.fields.balance_cents
          - entities.Affiliate.fields.royalty_balance_cents
        distinguishing_aspect: |
          Conserved quantity: cycle pool_amount_cents. Invariant: sum of
          statement gross amounts == pool_amount_cents AND (sum of paid net +
          sum of admin fees + pool balance) == pool_amount_cents after
          distribution. A late-claim adjustment that debits the pool and
          credits the affiliate leaves the total unchanged (forward + backward
          actions conserve the pool).
        test_recipe:
          setup:
            - "distributed cycle: writer suspended (share routed to pool), publisher paid; claims window open"
            - "expected literals: pool 1_006_027_397; each 5000-bps share rounds to 503_013_699 and the publisher's statement (larger-amount tie broken by affiliate created_at ASC; writer affiliate created first) — negative residue -1 clawed from the LATER-created affiliate's statement per (amount DESC, created_at ASC) ordering applied to the clawback; see asserts"
          setup_api_calls:
            - call: "POST /pro/affiliates"
              payload: { legal_name: "Writer V", party_type: SONGWRITER, affiliation_code: "WRV" }
              as: ProRegistrar
              captures: { wv_id: $.data.id }
            - call: "POST /pro/affiliates"
              payload: { legal_name: "Pub V", party_type: PUBLISHER, affiliation_code: "PUBV" }
              as: ProRegistrar
              captures: { pv_id: $.data.id }
            - call: "POST /pro/works"
              payload: { title: "Song V", registered_by_affiliate_id: "${pv_id}" }
              as: Publisher
              as_user_id: "${pv_id}"
              captures: { vwork: $.data.id }
            - call: "POST /pro/works/${vwork}/share-claims"
              payload: { affiliate_id: "${wv_id}", role: WRITER, collection_share_bps: 5000, interest_share_bps: 5000 }
              as: Songwriter
              as_user_id: "${wv_id}"
            - call: "POST /pro/works/${vwork}/share-claims"
              payload: { affiliate_id: "${pv_id}", role: PUBLISHER, collection_share_bps: 5000, interest_share_bps: 5000 }
              as: Publisher
              as_user_id: "${pv_id}"
            - call: "POST /pro/works/${vwork}/confirm"
              payload: {}
              as: ProRegistrar
            - call: "POST /pro/licensees"
              payload: { legal_name: "Inv Radio", category: BROADCASTER, reported_revenue_cents: 300000000000, usage_units: 0 }
              as: ProLicensingAdmin
              captures: { iv_id: $.data.id, iv_ver: $.data.version }
            - call: "POST /pro/licensees/${iv_id}/licenses"
              payload: { effective_date: "2026-01-01", expiry_date: "2026-12-31", expected_licensee_version: "${iv_ver}" }
              as: ProLicensingAdmin
              captures: { iv_lic: $.data.id }
            - call: "POST /pro/performances"
              payload: { work_id: "${vwork}", license_id: "${iv_lic}", performance_date: "2026-02-01", medium: TERRESTRIAL_RADIO, daypart: DAY, source: MONITORING, play_count: 100 }
              as: RoyaltyDistributor
              captures: { vev: $.data.id }
            - call: "POST /pro/cycles"
              payload: { label: "V1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: RoyaltyDistributor
              captures: { vcyc: $.data.id }
            - call: "POST /pro/cycles/${vcyc}/open"
              payload: {}
              as: RoyaltyDistributor
            - call: "POST /pro/cycles/${vcyc}/performances/capture"
              payload: { performance_event_ids: ["${vev}"] }
              as: RoyaltyDistributor
            - call: "PATCH /pro/affiliates/${wv_id}"
              payload: { status: SUSPENDED }
              as: ProRegistrar
            - call: "GET /pro/cycles/${vcyc}"
              payload: {}
              as: RoyaltyDistributor
              captures: { vcv: $.data.version }
            - call: "POST /pro/cycles/${vcyc}/close-collection"
              payload: { expected_cycle_version: "${vcv}" }
              as: RoyaltyDistributor
            - call: "GET /pro/cycles/${vcyc}/statements"
              payload: {}
              as: RoyaltyDistributor
              captures: { vst0: "$.data[0].id", vst1: "$.data[1].id" }
            - call: "POST /pro/statements/${vst0}/finalize"
              payload: {}
              as: RoyaltyDistributor
            - call: "POST /pro/statements/${vst1}/finalize"
              payload: {}
              as: RoyaltyDistributor
            - call: "POST /pro/cycles/${vcyc}/distribute"
              payload: {}
              as: RoyaltyDistributor
            - call: "GET /pro/cycles/${vcyc}/pool"
              payload: {}
              as: RoyaltyDistributor
              captures: { vpool_id: $.data.id, vpool_bal: $.data.balance_cents }
            - call: "GET /pro/affiliates/${pv_id}"
              payload: {}
              as: FinanceOfficer
              captures: { ppub_bal: $.data.royalty_balance_cents }
          trigger:
            - call: "GET /pro/cycles/${vcyc}"
              payload: {}
              as: FinanceOfficer
              captures: { vpool_amt: $.data.pool_amount_cents }
          assert:
            - "vpool_amt == 1006027397"
            - "vpool_bal == 503013698 (suspended writer's routed gross after the -1 cent negative-residue clawback lands on the writer statement — the two statements tie at 503_013_699 rounded, so the clawback tie-break (created_at ASC) hits the earlier-created writer affiliate's statement)"
            - "ppub_bal == 477863014 (publisher net: gross 503_013_699, admin on payable = round_half_up(503_013_699 * 0.05) = 25_150_685, net = 503_013_699 - 25_150_685 = 477_863_014)"
            - "conservation: sum of statement gross == pool (503013698 + 503013699 == 1006027397) AND pool balance + publisher paid net + admin withheld == pool (503013698 + 477863014 + 25150685 == 1006027397)"
      - name: share_conflict_and_resolution_conserve_interest_total
        grounds:
          - state_machines.ShareClaim.ACCEPTED_to_DISPUTED
          - state_machines.ShareClaim.DISPUTED_to_REVOKED
          - entities.Work.fields.aggregate_interest_bps
        distinguishing_aspect: |
          Conserved quantity: work.aggregate_interest_bps bookkeeping — a
          different quantity from royalty cents. Invariant:
          aggregate_interest_bps == sum of interest_share_bps over ACCEPTED
          claims. An over-claim insertion (forward action: new claim held
          DISPUTED, aggregate unchanged at 6000) followed by its revocation in
          conflict resolution (compensation) returns the work to exactly its
          pre-conflict aggregate and lets it confirm.
        test_recipe:
          setup:
            - "work with ACCEPTED claim A 6000 bps (aggregate 6000); a second claim B 5000 bps has been inserted and is DISPUTED (work IN_CONFLICT, aggregate still 6000 because DISPUTED claims are excluded)"
          setup_api_calls:
            - call: "POST /pro/affiliates"
              payload: { legal_name: "Pub C1", party_type: PUBLISHER, affiliation_code: "PC1" }
              as: ProRegistrar
              captures: { pc1: $.data.id }
            - call: "POST /pro/affiliates"
              payload: { legal_name: "Pub C2", party_type: PUBLISHER, affiliation_code: "PC2" }
              as: ProRegistrar
              captures: { pc2: $.data.id }
            - call: "POST /pro/works"
              payload: { title: "Song CC", registered_by_affiliate_id: "${pc1}" }
              as: Publisher
              as_user_id: "${pc1}"
              captures: { cwork: $.data.id }
            - call: "POST /pro/works/${cwork}/share-claims"
              payload: { affiliate_id: "${pc1}", role: PUBLISHER, collection_share_bps: 6000, interest_share_bps: 6000 }
              as: Publisher
              as_user_id: "${pc1}"
              captures: { cclaim_a: $.data.id }
            - call: "POST /pro/works/${cwork}/share-claims"
              payload: { affiliate_id: "${pc2}", role: PUBLISHER, collection_share_bps: 5000, interest_share_bps: 5000 }
              as: Publisher
              as_user_id: "${pc2}"
              captures: { cclaim_b: $.data.id }
            - call: "GET /pro/works/${cwork}"
              payload: {}
              as: ProRegistrar
              captures: { c_ver: $.data.version, agg_during: $.data.aggregate_interest_bps, c_status: $.data.status }
          trigger:
            - call: "POST /pro/works/${cwork}/resolve-conflict"
              payload: { accept_claim_ids: [], revoke_claim_ids: ["${cclaim_b}"], expected_work_version: "${c_ver}" }
              as: ProRegistrar
              captures: { agg_after: $.data.aggregate_interest_bps, status_after: $.data.status }
          assert:
            - "c_status == IN_CONFLICT and agg_during == 6000 during the conflict (DISPUTED claim B excluded from the aggregate)"
            - "agg_after == 6000 exactly (compensation conserves the pre-conflict aggregate; claim B revoked)"
            - "status_after == CONFIRMED (post-resolution aggregate <= 10000 and no DISPUTED claims remain)"
