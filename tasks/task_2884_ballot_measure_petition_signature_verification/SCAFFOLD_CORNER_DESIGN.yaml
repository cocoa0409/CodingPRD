              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { r1_id: $.data.id, r1_size: $.data.sample_size }
          trigger:
            - call: "POST /signature-records/${late_id}/validate"
              payload: {}
              as: CountyClerk
              as_user_id: "${alpha_id}"
              captures: { late_status: $.data.validation_status, late_dup_of: $.data.duplicate_of_signature_id, late_match: $.data.matched_voter_record_id }
