# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_1170 Business Continuity & Disaster Recovery Program
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# Names are unique across this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: process_created_in_draft_with_system_fields
        claim_type: creation_and_initial_state
        grounds: [entities.Process, state_machines.Process]
        distinguishing_aspect: "A new Process starts in DRAFT with version 1 and server-minted id/created_at; client-supplied status is impossible (no such input field on POST /processes)."
        test_recipe:
          setup: ["Contact C1 exists to serve as owner"]
          setup_api_calls:
            - call: "POST /resilience/contacts"
              payload: { full_name: "Owner Ora", email: "ora@x.com", role_title: "Owner" }
              as: ResilienceAdmin
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /resilience/processes"
              payload: { name: "NewProc", business_unit: "BU", owner_contact_id: "${c1_id}", criticality_tier: "TIER_1" }
              as: ResilienceAdmin
              captures: { p_status: $.data.status, p_version: $.data.version }
          assert:
            - "p_status == DRAFT and p_version == 1"
      - name: process_retire_cascades_nonterminal_children
        claim_type: computed_fields
        grounds: [state_machines.Process.ACTIVE_to_RETIRED, entities.Plan.fields.supersedes_plan_id]
        distinguishing_aspect: "Retiring a process force-retires its DRAFT plan and supersedes its REJECTED BIA without touching those entities' endpoints."
        test_recipe:
          setup:
            - "Contact C1; Process P ACTIVE; one DRAFT BIA and one DRAFT plan under P"
          setup_api_calls:
            - call: "POST /resilience/contacts"
              payload: { full_name: "Owner Ora", email: "ora@x.com", role_title: "Owner" }
              as: ResilienceAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /resilience/processes"
              payload: { name: "RetireMe", business_unit: "BU", owner_contact_id: "${c1_id}", criticality_tier: "TIER_3" }
              as: ResilienceAdmin
              captures: { p_id: $.data.id }
            - call: "POST /resilience/processes/${p_id}/activate"
              payload: {}
              as: ResilienceAdmin
            - call: "POST /resilience/bias"
              payload: { process_id: "${p_id}", cycle_label: "FY2026-H1", rto_target_hours: 8, rpo_target_hours: 2, mtpd_hours: 24, peak_period_flag: false, impact_financial_per_hour: 100, impact_regulatory: "NONE", impact_reputational: "NONE", impact_operational: "NONE" }
              as: BIAAnalyst
              captures: { bia_id: $.data.id }
            - call: "POST /resilience/plans"
              payload: { process_id: "${p_id}", title: "T", version_no: 1, strategy_type: "COLD_SITE", rto_committed_hours: 8, rpo_committed_hours: 2 }
              as: PlanAuthor
              as_user_id: "${c1_id}"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /resilience/processes/${p_id}/retire"
              payload: {}
              as: ResilienceAdmin
              captures: { p_status: $.data.status }
            - call: "GET /resilience/bias/${bia_id}"
              payload: {}
              as: ResilienceAdmin
              captures: { bia_status: $.data.status }
            - call: "GET /resilience/plans/${plan_id}"
              payload: {}
              as: ResilienceAdmin
              captures: { plan_status: $.data.status }
          assert:
            - "p_status == RETIRED, bia_status == SUPERSEDED, plan_status == RETIRED"
      - name: dependency_immutable_after_create
        claim_type: immutability
        grounds: [entities.Dependency]
        distinguishing_aspect: "Dependency has common_fields false: no version/updated_at and no update endpoint exists — only create, read, list, delete."
        test_recipe:
          setup: ["Contact C1; processes P1, P2"]
          setup_api_calls:
            - call: "POST /resilience/contacts"
              payload: { full_name: "Owner Ora", email: "ora@x.com", role_title: "Owner" }
              as: ResilienceAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /resilience/processes"
              payload: { name: "P1", business_unit: "BU", owner_contact_id: "${c1_id}", criticality_tier: "TIER_2" }
              as: ResilienceAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /resilience/processes"
              payload: { name: "P2", business_unit: "BU", owner_contact_id: "${c1_id}", criticality_tier: "TIER_2" }
              as: ResilienceAdmin
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /resilience/dependencies"
              payload: { from_process_id: "${p1_id}", to_process_id: "${p2_id}", dependency_type: "DATA", criticality: "HIGH" }
              as: ResilienceAdmin
              captures: { dep: $.data }
          assert:
            - "response contains id and created_at but no version and no updated_at (common_fields false)"
            - "GET /resilience/dependencies with from_process_id=${p1_id} returns exactly one row"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_terminal_state_lockdown
        grounds: [state_machines.Activation]
        distinguishing_aspect: "DEACTIVATED is terminal: every further transition (including a second deactivate) is rejected and no counters move."
        test_recipe:
          setup:
            - "Clock 2026-06-01; contacts C1 (crisis officer), C2; process P ACTIVE with APPROVED BIA (rto 8/rpo 2) and APPROVED plan; tree TREE_CrisisProc with one root node; activation ACT created and then deactivated"
          setup_api_calls:
            - call: "POST /resilience/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ResilienceAdmin
            - call: "POST /resilience/contacts"
              payload: { full_name: "Crisis Chris", email: "chris@x.com", role_title: "Crisis Officer" }
              as: ResilienceAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /resilience/contacts"
              payload: { full_name: "Approver Al", email: "al@x.com", role_title: "Approver" }
              as: ResilienceAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /resilience/processes"
              payload: { name: "CrisisProc", business_unit: "Ops", owner_contact_id: "${c1_id}", criticality_tier: "TIER_2" }
              as: ResilienceAdmin
              captures: { p_id: $.data.id }
            - call: "POST /resilience/processes/${p_id}/activate"
              payload: {}
              as: ResilienceAdmin
            - call: "POST /resilience/bias"
              payload: { process_id: "${p_id}", cycle_label: "FY2026-H1", rto_target_hours: 8, rpo_target_hours: 2, mtpd_hours: 24, peak_period_flag: false, impact_financial_per_hour: 100, impact_regulatory: "NONE", impact_reputational: "NONE", impact_operational: "NONE" }
              as: BIAAnalyst
              captures: { bia_id: $.data.id }
            - call: "POST /resilience/bias/${bia_id}/submit"
              payload: {}
              as: BIAAnalyst
            - call: "POST /resilience/bias/${bia_id}/decide"
              payload: { decision: "APPROVE" }
              as: RiskCommittee
              as_user_id: "${c2_id}"
            - call: "POST /resilience/plans"
              payload: { process_id: "${p_id}", title: "CP DR", version_no: 1, strategy_type: "WARM_SITE", rto_committed_hours: 8, rpo_committed_hours: 2 }
              as: PlanAuthor
              as_user_id: "${c2_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /resilience/plans/${plan_id}/sections"
              payload: { section_type: "RECOVERY_STRATEGY", content: "s1", order_index: 1 }
              as: PlanAuthor
              as_user_id: "${c2_id}"
            - call: "POST /resilience/plans/${plan_id}/sections"
              payload: { section_type: "DEPENDENCY_MAP", content: "s2", order_index: 2 }
              as: PlanAuthor
              as_user_id: "${c2_id}"
            - call: "POST /resilience/plans/${plan_id}/sections"
              payload: { section_type: "COMMS_PLAN", content: "s3", order_index: 3 }
              as: PlanAuthor
              as_user_id: "${c2_id}"
            - call: "POST /resilience/plans/${plan_id}/submit"
              payload: {}
              as: PlanAuthor
              as_user_id: "${c2_id}"
            - call: "POST /resilience/plans/${plan_id}/approve"
              payload: {}
              as: PlanApprover
              as_user_id: "${c2_id}"
            - call: "POST /resilience/comm-nodes"
              payload: { tree_label: "TREE_CrisisProc", contact_name: "Duty Officer", role_title: "Duty", parent_node_id: null, order_index: 1, channel: "PHONE", ack_deadline_minutes: 30 }
              as: CrisisOfficer
              as_user_id: "${c1_id}"
            - call: "POST /resilience/activations"
              payload: { process_id: "${p_id}", declared_severity: "SEV2", activation_criterion: "CRITERION_A", criterion_justification: "data center fire" }
              as: CrisisOfficer
              as_user_id: "${c1_id}"
              captures: { act_id: $.data.id }
            - call: "POST /resilience/activations/${act_id}/deactivate"
              payload: {}
              as: CrisisOfficer
              as_user_id: "${c1_id}"
              captures: { st: $.data.status }
          trigger:
            - call: "POST /resilience/activations/${act_id}/deactivate"
              payload: {}
              as: CrisisOfficer
              as_user_id: "${c1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "setup capture st == DEACTIVATED"
            - "trigger capture err == ERR_INVALID_STATE (terminal lockdown)"
      - name: exercise_cancel_from_completed_rejected
