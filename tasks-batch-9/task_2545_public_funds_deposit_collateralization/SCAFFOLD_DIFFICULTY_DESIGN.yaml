  - rule_id: non_linear_state_machine
    instances:

      - name: substitution_fork_join_requires_both_branches
        grounds:
          - state_machines.SubstitutionRequest.SUBMITTED_to_CUSTODIAN_ACKED
          - state_machines.SubstitutionRequest.CUSTODIAN_ACKED_to_READY_TO_SETTLE
          - state_machines.SubstitutionRequest.READY_TO_SETTLE_to_SETTLED
          - entities.SubstitutionRequest.fields.value_adequacy_delta_cents
          - validations[priority=45]
        distinguishing_aspect: |
          SubstitutionRequest is a fork-join, not a chain: after only the custodian branch the request sits
          in CUSTODIAN_ACKED and POST /settle is rejected with ERR_INVALID_STATE; the join to
          READY_TO_SETTLE happens exactly when the second (compliance) branch lands, and only then does
          settle succeed.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "APPROVED well-capitalized depository, FUNDED DEDICATED DEMAND account with 100,000,000 cents (required_collateral_cents 78,750,000)."
