        as: RightsManager
        captures:
          pkg_id: $.data.id
      - call: POST /rights-assets/${asset_id}/lock-packages
        payload: {}
        as: RightsManager
      - call: POST /packages/${pkg_id}/bids
        payload:
          bidder_id: ${b_id}
          offered_fee_cents: 1000000
          upfront_pct: 0.1
          escalator_rate_pct: 0.0
          minimum_growth_pct: 0.0
          fee_cap_cents: 2000000
          production_commitment_games: 5
          audience_commitment_pct: 0.5
          exclusivity_request: MATCH_PACKAGE
        as: BidCoordinator
        as_user_id: ${b_id}
        captures:
          bid_id: $.data.id
      - call: POST /packages/${pkg_id}/bids/${bid_id}/submit
        payload: {}
        as: BidCoordinator
        as_user_id: ${b_id}
      - call: POST /packages/${pkg_id}/bids/${bid_id}/start-review
        payload: {}
        as: RightsManager
      - call: POST /packages/${pkg_id}/bids/${bid_id}/shortlist
        payload: {}
        as: RightsManager
      - call: GET /packages/${pkg_id}
        as: RightsManager
        captures:
          pkg_v: $.data.version
      - call: POST /packages/${pkg_id}/bids/${bid_id}/accept
        payload:
          expected_package_version: ${pkg_v}
        as: RightsManager
      trigger:
      - call: POST /packages/${pkg_id}/bids/${bid_id}/reject
        payload: {}
        as: RightsManager
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_BID_NOT_REJECTABLE (terminal ACCEPTED state has no outgoing reject
        transition)
      - Bid.${bid_id}.status == ACCEPTED (unchanged)
  - name: payment_milestone_overdue_to_paid_skipped
    claim_type: invalid_transition
    grounds:
    - state_machines.PaymentMilestone
    distinguishing_aspect: PaymentMilestone cannot transition OVERDUE → PAID directly;
      must go OVERDUE → CURED via record-payment
