  - rule_id: resource_temporal_overlap
    instances:
      - name: override_windows_half_open_adjacency
        grounds:
          - validations[priority=14]
          - entities.EligibilityOverride.fields.start_date
          - entities.EligibilityOverride.fields.end_date
        distinguishing_aspect: |
          Resource: the carrier's override timeline; semantics: HALF-OPEN [start_date, end_date). An override
          starting exactly when another ends (2026-10-01 == [2026-09-01,2026-10-01).end) is ACCEPTED, while one
          straddling 2026-09-15..2026-10-15 is rejected ERR_OVERRIDE_WINDOW_OVERLAP — adjacency is not overlap.
        test_recipe:
          setup:
            - "Clock 2026-08-01; carrier with snapshot iss 30 (approved ACTIVE); no overrides yet"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/carriers"
              payload: { dot_number: "100001", legal_name: "Acme Hauling" }
              as: PlatformAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /api/safety-score-snapshots"
              payload: { carrier_id: "${car_id}", iss_score: 30, safety_rating: "SATISFACTORY", source: "FMCSA_FEED", effective_date: "2026-08-01", expected_carrier_version: "${car_v}" }
              as: SafetyDataFeed
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { car_v2: $.data.version }
          trigger:
            - call: "POST /api/eligibility-overrides"
              payload: { carrier_id: "${car_id}", reason: "audit under appeal", start_date: "2026-09-01", end_date: "2026-10-01", expected_carrier_version: "${car_v2}" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { o1: $.data.id, o1_status: $.data.status }
            - call: "GET /api/carriers/${car_id}"
              payload: {}
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { car_v3: $.data.version }
            - call: "POST /api/eligibility-overrides"
              payload: { carrier_id: "${car_id}", reason: "back-to-back extension", start_date: "2026-10-01", end_date: "2026-11-01", expected_carrier_version: "${car_v3}" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { o2: $.data.id, o2_status: $.data.status }
            - call: "GET /api/carriers/${car_id}"
              payload: {}
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { car_v4: $.data.version }
            - call: "POST /api/eligibility-overrides"
              payload: { carrier_id: "${car_id}", reason: "straddling window", start_date: "2026-09-15", end_date: "2026-10-15", expected_carrier_version: "${car_v4}" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { o3_err: $.data.error_id }
            - call: "GET /api/carriers/${car_id}"
              payload: {}
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { car_v5: $.data.version }
            - call: "POST /api/eligibility-overrides"
              payload: { carrier_id: "${car_id}", reason: "adjacent predecessor", start_date: "2026-08-01", end_date: "2026-09-01", expected_carrier_version: "${car_v5}" }
              as: CarrierManager
              as_user_id: "${car_id}"
              captures: { o4: $.data.id, o4_status: $.data.status }
          assert:
            - "o1 [2026-09-01, 2026-10-01) created REQUESTED (201)"
            - "o2 [2026-10-01, 2026-11-01) created REQUESTED (201): start == o1.end is adjacency, allowed under half-open semantics"
            - "o3 [2026-09-15, 2026-10-15) rejected ERR_OVERRIDE_WINDOW_OVERLAP (overlaps both o1 and o2)"
            - "o4 [2026-08-01, 2026-09-01) created REQUESTED (201): end == o1.start is adjacency, allowed"
            - "GET /api/eligibility-overrides?carrier_id shows exactly 3 rows (o1, o2, o4)"

      - name: subscription_windows_closed_interval_adjacency
        grounds:
          - validations[priority=15]
          - entities.VehicleSubscription.fields.service_end_date
        distinguishing_aspect: |
          Resource: the vehicle's subscription timeline; semantics: CLOSED [start, end] inclusive — adjacency IS
          a conflict (start 2026-09-30 == existing end 2026-09-30 rejected), and only a start on the day AFTER
          the previous end (2026-10-01) is accepted — the exact opposite adjacency rule from override windows.
        test_recipe:
          setup:
            - "Clock 2026-08-01; carrier ACTIVE (iss 30); vehicle VIN-0001; existing subscription [2026-08-01, 2026-09-30] ACTIVE"
          setup_api_calls:
