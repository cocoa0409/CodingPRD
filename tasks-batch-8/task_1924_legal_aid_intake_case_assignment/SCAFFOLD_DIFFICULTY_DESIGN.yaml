            - { call: "POST /intake-applications/${app_c}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_c}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_c}/open-case", payload: { service_level: "ADVICE_ONLY" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { case_c: "$.data.id", case_c_v: "$.data.version" } }
