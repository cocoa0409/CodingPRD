            - { call: "POST /api/generators", payload: { legal_name: "GenB", hq_state_code: "MI", contact_email: "b@x.com" }, as: BrokerOps, captures: { gb_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${ga_id}", material_type: "FLY_ASH", declared_moisture_pct: 9.0, expected_tons_per_month: 500 }, as: Generator, as_user_id: "${ga_id}", captures: { sa_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${gb_id}", material_type: "SLAG", declared_moisture_pct: 5.0, expected_tons_per_month: 300 }, as: Generator, as_user_id: "${gb_id}", captures: { sb_id: $.data.id } }
          trigger:
            - { call: "GET /api/streams?generator_id=${ga_id}", payload: {}, as: BrokerOps }
          assert:
            - "response contains exactly 1 stream: ByproductStream.${sa_id}"
            - "ByproductStream.${sb_id} is absent; total_count == 1"

      - name: credit_summary_computed_read
        claim_type: computed_read
        grounds: ["calculations.sustainability_credit_accrual"]
        excluded_because:
          difficulty_instance: standard_vs_attested_credit_variants_diverge
          rationale: "That instance reads GET /api/generators/{id}/credit-summary and asserts standard_credits == 60.0 vs attested_credits == 55.2."

  # =========================================================================
  # Section: errors
  # =========================================================================
  - section: errors
    instances:
      - name: error_envelope_shape_on_failure_and_success
        claim_type: violation_to_error
        grounds: ["response_envelope", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses carry response_type == error with data.error_id and data.message; success responses carry response_type object/array with meta.api_request_id and meta.api_request_timestamp."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/shipments/11111111-2222-3333-4444-555555555555", payload: {}, as: BrokerOps, captures: { err: $.data.error_id } }
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
          assert:
            - "error response: response_type == error, data.error_id == ERR_NOT_FOUND, data.message non-empty, meta.api_request_id present"
            - "success response: response_type == object, meta.api_request_id and meta.api_request_timestamp present, data.id present"

  # =========================================================================
  # Section: cross_cutting_layers
  # =========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_rejected_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[shipment-create-stale-agreement-version]", "errors[ERR_STALE_AGREEMENT_VERSION]"]
        distinguishing_aspect: "OCC on SupplyAgreement.version: booking with the observed version (2) succeeds and increments it to 3; a second booking still carrying 2 is rejected 412 ERR_STALE_AGREEMENT_VERSION."
        test_recipe:
          setup: ["booking-ready chain; agreement version observed at 2 after activation"]
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/offtakers", payload: { legal_name: "OffCo", hq_state_code: "PA", receiving_state_codes: ["PA"] }, as: BrokerOps, captures: { o_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "FLY_ASH", declared_moisture_pct: 9.0, expected_tons_per_month: 500 }, as: Generator, as_user_id: "${g_id}", captures: { s_id: $.data.id } }
            - { call: "POST /api/streams/${s_id}/characterizations", payload: { lab_name: "LabCo", sampled_on: "2026-07-01", ph: 7.2, arsenic_ppm: 3.0, lead_ppm: 2.0, moisture_pct_measured: 9.5 }, as: Generator, as_user_id: "${g_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/characterizations/${c_id}/verify", payload: {}, as: BrokerOps }
            - { call: "POST /api/supply-agreements", payload: { generator_id: "${g_id}", stream_id: "${s_id}", committed_monthly_tons: 100, revenue_share_pct_to_generator: 0.6, freight_share_pct_to_generator: 0.25, term_start: "2026-01-01", term_end: "2026-12-31" }, as: Generator, as_user_id: "${g_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/supply-agreements/${a_id}/activate", payload: {}, as: BrokerOps }
            - { call: "GET /api/supply-agreements/${a_id}", payload: {}, as: BrokerOps, captures: { a_v: $.data.version } }
            - { call: "POST /api/offtake-commitments", payload: { offtaker_id: "${o_id}", stream_id: "${s_id}", destination_state_code: "PA", committed_monthly_tons: 100, max_moisture_pct: 10.0, max_arsenic_ppm: 5.0 }, as: Offtaker, as_user_id: "${o_id}", captures: { k_id: $.data.id } }
            - { call: "POST /api/offtake-commitments/${k_id}/activate", payload: {}, as: BrokerOps }
            - { call: "POST /api/price-index-entries", payload: { material_type: "FLY_ASH", region_code: "PA", effective_from: "2026-01-01", price_cents_per_ton: 300 }, as: BrokerOps }
          trigger:
            - { call: "POST /api/shipments", payload: { supply_agreement_id: "${a_id}", offtake_commitment_id: "${k_id}", pickup_date: "2026-08-05", distance_miles: 50, gross_tons: 10, loading_moisture_pct: 8.0, expected_supply_agreement_version: "${a_v}" }, as: Generator, as_user_id: "${g_id}", captures: { s1_id: $.data.id } }
            - { call: "GET /api/supply-agreements/${a_id}", payload: {}, as: BrokerOps, captures: { a_v_post: $.data.version } }
            - { call: "POST /api/shipments", payload: { supply_agreement_id: "${a_id}", offtake_commitment_id: "${k_id}", pickup_date: "2026-08-06", distance_miles: 50, gross_tons: 10, loading_moisture_pct: 8.0, expected_supply_agreement_version: "${a_v}" }, as: Generator, as_user_id: "${g_id}", captures: { err: $.data.error_id } }
          assert:
            - "Shipment.${s1_id} created (correct version accepted)"
            - "SupplyAgreement.${a_id}.version == ${a_v} + 1 after the booking (increments on write)"
            - "err == ERR_STALE_AGREEMENT_VERSION with HTTP 412 on the replayed stale version"
            - "SupplyAgreement.${a_id}.booked_month_to_date_tons == 10 (only the first booking applied)"

      - name: monthly_counter_rollover_resets_quota
        claim_type: derived_field_reconciliation
        grounds: ["calculations.monthly_counter_rollover"]
        distinguishing_aspect: "Month-to-date counters reconcile lazily against the logical clock: after the clock crosses into 2026-09 the agreement's booked_month_to_date_tons reads 0 with counter_month 2026-09, and a fresh 50 t booking succeeds despite August having been fully booked at 100/100."
        test_recipe:
          setup: ["booking-ready chain; agreement committed 100 fully booked (100 t) in August; clock then advanced to 2026-09-01"]
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/offtakers", payload: { legal_name: "OffCo", hq_state_code: "PA", receiving_state_codes: ["PA"] }, as: BrokerOps, captures: { o_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "FLY_ASH", declared_moisture_pct: 9.0, expected_tons_per_month: 500 }, as: Generator, as_user_id: "${g_id}", captures: { s_id: $.data.id } }
            - { call: "POST /api/streams/${s_id}/characterizations", payload: { lab_name: "LabCo", sampled_on: "2026-07-01", ph: 7.2, arsenic_ppm: 3.0, lead_ppm: 2.0, moisture_pct_measured: 9.5 }, as: Generator, as_user_id: "${g_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/characterizations/${c_id}/verify", payload: {}, as: BrokerOps }
            - { call: "POST /api/supply-agreements", payload: { generator_id: "${g_id}", stream_id: "${s_id}", committed_monthly_tons: 100, revenue_share_pct_to_generator: 0.6, freight_share_pct_to_generator: 0.25, term_start: "2026-01-01", term_end: "2026-12-31" }, as: Generator, as_user_id: "${g_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/supply-agreements/${a_id}/activate", payload: {}, as: BrokerOps }
            - { call: "GET /api/supply-agreements/${a_id}", payload: {}, as: BrokerOps, captures: { a_v1: $.data.version } }
            - { call: "POST /api/offtake-commitments", payload: { offtaker_id: "${o_id}", stream_id: "${s_id}", destination_state_code: "PA", committed_monthly_tons: 1000, max_moisture_pct: 10.0, max_arsenic_ppm: 5.0 }, as: Offtaker, as_user_id: "${o_id}", captures: { k_id: $.data.id } }
            - { call: "POST /api/offtake-commitments/${k_id}/activate", payload: {}, as: BrokerOps }
            - { call: "POST /api/price-index-entries", payload: { material_type: "FLY_ASH", region_code: "PA", effective_from: "2026-01-01", price_cents_per_ton: 300 }, as: BrokerOps }
            - { call: "POST /api/shipments", payload: { supply_agreement_id: "${a_id}", offtake_commitment_id: "${k_id}", pickup_date: "2026-08-05", distance_miles: 50, gross_tons: 100, loading_moisture_pct: 8.0, expected_supply_agreement_version: "${a_v1}" }, as: Generator, as_user_id: "${g_id}", captures: { s1_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/supply-agreements/${a_id}", payload: {}, as: BrokerOps, captures: { a_v2: $.data.version } }
          trigger:
            - { call: "POST /api/shipments", payload: { supply_agreement_id: "${a_id}", offtake_commitment_id: "${k_id}", pickup_date: "2026-09-10", distance_miles: 50, gross_tons: 50, loading_moisture_pct: 8.0, expected_supply_agreement_version: "${a_v2}" }, as: Generator, as_user_id: "${g_id}", captures: { s2_id: $.data.id } }
          assert:
            - "the September GET reconciled counters: booked_month_to_date_tons == 0 and counter_month == 2026-09 before the new booking"
            - "Shipment.${s2_id} created despite August's 100/100 (rollover reset the quota window)"
            - "SupplyAgreement.${a_id}.booked_month_to_date_tons == 50 after the September booking"

  # =========================================================================
  # Section: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: accept_response_contains_final_settlement_immediately
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model", "state_machines.Shipment.DELIVERED_to_ACCEPTED"]
        distinguishing_aspect: "Immediate consistency: the accept response body itself carries status == ACCEPTED and the computed final settlement (final_gross_revenue_cents == 3000 for 10 t at 300 cents) - no follow-up read is needed to observe the mutation."
        test_recipe:
          setup: ["dispatch-ready chain; one 10 t shipment DELIVERED in-spec; index 300"]
          setup_api_calls:
            - { call: "POST /api/generators", payload: { legal_name: "GenCo", hq_state_code: "OH", contact_email: "g@x.com" }, as: BrokerOps, captures: { g_id: $.data.id } }
            - { call: "POST /api/offtakers", payload: { legal_name: "OffCo", hq_state_code: "PA", receiving_state_codes: ["PA"] }, as: BrokerOps, captures: { o_id: $.data.id } }
            - { call: "POST /api/streams", payload: { generator_id: "${g_id}", material_type: "FLY_ASH", declared_moisture_pct: 9.0, expected_tons_per_month: 500 }, as: Generator, as_user_id: "${g_id}", captures: { s_id: $.data.id } }
            - { call: "POST /api/streams/${s_id}/characterizations", payload: { lab_name: "LabCo", sampled_on: "2026-07-01", ph: 7.2, arsenic_ppm: 3.0, lead_ppm: 2.0, moisture_pct_measured: 9.5 }, as: Generator, as_user_id: "${g_id}", captures: { c_id: $.data.id } }
            - { call: "POST /api/characterizations/${c_id}/verify", payload: {}, as: BrokerOps }
            - { call: "POST /api/streams/${s_id}/eligibility-determinations", payload: { state_code: "PA", use_case: "CEMENT_ADDITIVE", valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: ComplianceOfficer, as_user_id: "co_file", captures: { d_id: $.data.id } }
            - { call: "POST /api/eligibility-determinations/${d_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co_file" }
            - { call: "POST /api/eligibility-determinations/${d_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co_appr" }
            - { call: "POST /api/state-permits", payload: { state_code: "PA", material_type: "FLY_ASH", regime: "PERMIT", permit_number: "PA-001", issued_on: "2026-01-01", expires_on: "2026-12-31" }, as: ComplianceOfficer, as_user_id: "co_file", captures: { p_id: $.data.id } }
            - { call: "POST /api/state-permits/${p_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_file" }
            - { call: "POST /api/supply-agreements", payload: { generator_id: "${g_id}", stream_id: "${s_id}", committed_monthly_tons: 100, revenue_share_pct_to_generator: 0.6, freight_share_pct_to_generator: 0.25, term_start: "2026-01-01", term_end: "2026-12-31" }, as: Generator, as_user_id: "${g_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/supply-agreements/${a_id}/activate", payload: {}, as: BrokerOps }
            - { call: "GET /api/supply-agreements/${a_id}", payload: {}, as: BrokerOps, captures: { a_v: $.data.version } }
            - { call: "POST /api/offtake-commitments", payload: { offtaker_id: "${o_id}", stream_id: "${s_id}", destination_state_code: "PA", committed_monthly_tons: 100, max_moisture_pct: 10.0, max_arsenic_ppm: 5.0 }, as: Offtaker, as_user_id: "${o_id}", captures: { k_id: $.data.id } }
            - { call: "POST /api/offtake-commitments/${k_id}/activate", payload: {}, as: BrokerOps }
            - { call: "POST /api/price-index-entries", payload: { material_type: "FLY_ASH", region_code: "PA", effective_from: "2026-01-01", price_cents_per_ton: 300 }, as: BrokerOps }
            - { call: "POST /api/shipments", payload: { supply_agreement_id: "${a_id}", offtake_commitment_id: "${k_id}", pickup_date: "2026-08-05", distance_miles: 50, gross_tons: 10, loading_moisture_pct: 8.0, expected_supply_agreement_version: "${a_v}" }, as: Generator, as_user_id: "${g_id}", captures: { sh_id: $.data.id } }
            - { call: "POST /api/shipments/${sh_id}/dispatch", payload: {}, as: Generator, as_user_id: "${g_id}" }
            - { call: "POST /api/shipments/${sh_id}/deliver", payload: { destination_moisture_pct: 8.0, destination_arsenic_ppm: 3.0 }, as: Offtaker, as_user_id: "${o_id}" }
          trigger:
            - { call: "POST /api/shipments/${sh_id}/accept", payload: {}, as: Offtaker, as_user_id: "${o_id}" }
          assert:
            - "the accept response's data.status == ACCEPTED"
            - "the accept response's data.final_gross_revenue_cents == 3000 (10.0 x 300) and data.net_billable_tons == 10.0"
            - "the accept response's data.final_generator_share_cents == 1800 and data.final_broker_share_cents == 1200"
