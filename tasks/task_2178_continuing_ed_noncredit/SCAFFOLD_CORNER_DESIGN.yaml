              captures: { o_id: $.data.id }
          trigger:
            - call: "GET /offerings/00000000-0000-4000-8000-000000000011"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
              captures: { e1: $.data.error_id }
            - call: "GET /learners/00000000-0000-4000-8000-000000000012"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
              captures: { e2: $.data.error_id }
            - call: "GET /corporate-accounts/00000000-0000-4000-8000-000000000013"
