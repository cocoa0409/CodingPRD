# =============================================================================
# SCAFFOLD.yaml — Peer-Group Microlending: Center Meetings & Joint Liability
# Task: task_3086_peer_group_microlending_center_meetings_joint_liability
# Difficulty target: beyond-expert (dense coupling, joint-liability contagion,
# dual-variant ladder + credit scoring, two interval semantics, OCC restructure,
# segregation-of-duties reconciliation, compensating ledger invariants).
# =============================================================================

scenario: |
  Peer-Group Microlending Center Meetings & Joint Liability (Grameen America):
  borrower recruitment into small peer groups with mutual accountability rather
  than collateral, group formation training and loan approval requiring group
  consensus, weekly center meetings where repayments are collected in person
  and attendance is tracked, loan size ladder increasing with successful
  repayment cycles, savings deposit requirements accompanying each repayment,
  credit bureau reporting to build member credit files, group member
  delinquency effects on the whole group's access to subsequent loans, center
  manager caseload and branch expansion planning

domain_name: peer-group-microlending
api_prefix: /

complexity_profile:
  primary_archetype: multi-party negotiation     # unanimous group consensus gates every loan
  secondary_archetype: compliance / audit        # bureau reporting, SoD reconciliation, blacklists
  complexity_layers:
    - cascading_side_effects        # delinquency contagion Loan -> PeerGroup -> sibling Loans/Applications
    - dual_variant_calculation      # standard vs rehabilitated ladder; provisional vs final credit score
    - rate_threshold_triggers       # delinquency age >= 8 days; absence streak >= 2; group count >= 1
    - derived_field_reconciliation  # caseload counters, group delinquent_loan_count, savings balances
    - optimistic_concurrency        # OCC on Loan.version for create-with-supersede restructures
    - temporal_windowing            # meeting overlap (half-open) vs training overlap (closed + buffer)

  entity_topology: flat                          # peer entities joined by FK references; no nested URL ownership
  state_machine_shape: cyclic                    # Member, PeerGroup, Loan, SavingsAccount all have cure cycles; CenterMeeting is parallel-dimensioned

  relationship_patterns:
    - one_to_many          # Center -> PeerGroup -> Member -> Loan -> RepaymentTransaction
    - cross_aggregate      # RepaymentTransaction references CenterMeeting + Loan + Member; ConsensusVote references LoanApplication + Member
    - self_referential: false

  role_model: segregation_of_duties  # meeting closer (CenterManager) may not reconcile (BranchManager);
                                     # recruiter (FieldOfficer) may not disburse; voter (Member) may not
                                     # perform any staff operation
  consistency_model: immediate       # every cascade completes inside the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Branch
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Branch name" }
      - name: tier
        type: enum
        source: computed
        description: "SMALL | MEDIUM | LARGE — derived from active_member_count: SMALL if < 200, MEDIUM if >= 200 and < 500, LARGE if >= 500"
        constraints: "enum: SMALL, MEDIUM, LARGE"
      - { name: active_member_count, type: integer, source: computed, default: 0, description: "Count of Members with status IN_TRAINING, ELIGIBLE, ACTIVE_BORROWER, or DELINQUENT whose branch_id == this branch" }
      - { name: total_manager_caseload, type: integer, source: computed, default: 0, description: "Sum of current_caseload over all CenterManagers of this branch; conserved across center reassignment" }

  - name: CenterManager
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id" }
      - { name: full_name, type: string, source: input, description: "Manager name" }
      - { name: hired_on, type: string, source: input, description: "ISO date of hire, informational" }
      - { name: current_caseload, type: integer, source: computed, default: 0, description: "Count of distinct Members with status IN_TRAINING, ELIGIBLE, ACTIVE_BORROWER, or DELINQUENT whose PeerGroup's Center has center_manager_id == this manager" }
      - { name: center_cap, type: integer, source: computed, description: "Max centers assignable: 3 if branch.tier == SMALL, 4 if MEDIUM, 5 if LARGE; evaluated against CURRENT branch tier" }
      - { name: member_cap, type: integer, source: computed, description: "Max caseload: 60 if branch.tier == SMALL, 80 if MEDIUM, 100 if LARGE; evaluated against CURRENT branch tier" }

  - name: Center
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id" }
      - { name: center_manager_id, type: string, source: input, description: "FK -> CenterManager.id" }
      - { name: name, type: string, source: input, description: "Center name" }
      - name: meeting_day_of_week
        type: integer
        source: input
        description: "UTC weekday of the weekly center meeting; 0 = Monday .. 6 = Sunday"
        constraints: "integer 0..6"

  - name: PeerGroup
    parent: null
    common_fields: true
    fields:
      - { name: center_id, type: string, source: input, description: "FK -> Center.id" }
      - { name: name, type: string, source: input, description: "Group name" }
      - { name: status, type: enum, source: system, description: "FORMING -> TRAINING -> ACTIVE <-> RESTRICTED -> DISSOLVED", constraints: "enum: FORMING, TRAINING, ACTIVE, RESTRICTED, DISSOLVED" }
      - { name: member_count, type: integer, source: computed, default: 0, description: "Count of Members with peer_group_id == this group and status != BLACKLISTED" }
      - { name: completed_training_sessions, type: integer, source: computed, default: 0, description: "Count of GroupTrainingSessions for this group with status COMPLETED" }
      - { name: delinquent_loan_count, type: integer, source: computed, default: 0, description: "Count of Loans of this group's members with status DELINQUENT or DEFAULTED; group is RESTRICTED iff >= 1" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id" }
      - { name: full_name, type: string, source: input, description: "Borrower name" }
      - { name: national_id, type: string, source: input, description: "Government id; unique across all members", constraints: "globally unique" }
      - { name: peer_group_id, type: string, source: system, description: "FK -> PeerGroup.id; null until added to a group", default: null }
      - { name: status, type: enum, source: system, description: "RECRUITED -> IN_TRAINING -> ELIGIBLE -> ACTIVE_BORROWER <-> DELINQUENT -> BLACKLISTED", constraints: "enum: RECRUITED, IN_TRAINING, ELIGIBLE, ACTIVE_BORROWER, DELINQUENT, BLACKLISTED" }
      - { name: cycle_level, type: integer, source: system, default: 1, description: "Loan ladder rung 1..5; increments on clean PAID_OFF" }
      - { name: cured_delinquency_count, type: integer, source: system, default: 0, description: "Number of times any of the member's loans transitioned DELINQUENT -> ACTIVE" }
      - { name: consecutive_absence_streak, type: integer, source: system, default: 0, description: "Consecutive CLOSED meetings at the member's center with attendance ABSENT; resets to 0 on any PRESENT" }
      - { name: attendance_strikes, type: integer, source: system, default: 0, description: "Lifetime count of streak reaching 2" }
      - { name: credit_score, type: integer, source: computed, description: "credit_score_provisional while the member has a Loan in ACTIVE or DELINQUENT; otherwise credit_score_final of the most recent terminated loan; 600 if the member has no loans" }

  - name: GroupTrainingSession
    parent: null
    common_fields: true
    fields:
      - { name: peer_group_id, type: string, source: input, description: "FK -> PeerGroup.id" }
      - { name: center_manager_id, type: string, source: input, description: "FK -> CenterManager.id; must equal the manager of the group's center" }
      - { name: start_time, type: datetime, source: input, description: "ISO8601 UTC session start (closed interval semantics with 30-minute buffer)" }
      - { name: end_time, type: datetime, source: input, description: "ISO8601 UTC session end; must be strictly greater than start_time" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED | CANCELLED", constraints: "enum: SCHEDULED, COMPLETED, CANCELLED" }

  - name: LoanApplication
    parent: null
    common_fields: true
    fields:
      - { name: peer_group_id, type: string, source: system, description: "FK -> PeerGroup.id; copied from the applicant member's group" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the applicant" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Requested principal in cents; must be a positive multiple of 100" }
      - { name: status, type: enum, source: system, description: "DRAFT -> VOTING -> APPROVED -> DISBURSED | REJECTED | EXPIRED", constraints: "enum: DRAFT, VOTING, APPROVED, REJECTED, EXPIRED, DISBURSED" }
      - { name: voting_deadline, type: datetime, source: computed, description: "Set at submission: logical clock + 7 days; votes valid strictly before this instant (now >= deadline -> ERR_VOTING_WINDOW_EXPIRED); sweep expires undecided applications only when now > voting_deadline" }
      - { name: applied_ceiling_cents, type: integer, source: computed, description: "Ladder ceiling computed at disbursement via next_loan_ceiling against the member's CURRENT cycle_level at that instant; null until disbursed", default: null }

  - name: ConsensusVote
    parent: null
    common_fields: false
    fields:
      - { name: loan_application_id, type: string, source: system, description: "FK -> LoanApplication.id" }
      - { name: voter_member_id, type: string, source: system, description: "FK -> Member.id; equals X-User-ID of the casting Member" }
      - { name: decision, type: enum, source: input, description: "APPROVE | REJECT", constraints: "enum: APPROVE, REJECT" }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: loan_application_id, type: string, source: system, description: "FK -> LoanApplication.id" }
      - { name: cycle_level, type: integer, source: system, description: "Snapshot of member cycle_level at disbursement" }
      - { name: principal_cents, type: integer, source: system, description: "Disbursed principal; equals application requested_amount_cents" }
      - { name: term_weeks, type: integer, source: system, default: 24, description: "Fixed term, 24 weekly installments" }
      - { name: weekly_installment_cents, type: integer, source: system, description: "round_half_up(principal_cents * (1 + FLAT_RATE * term_weeks) / term_weeks) with FLAT_RATE = 0.004 per week" }
      - { name: savings_required_cents, type: integer, source: system, description: "Mandatory savings per collection: round_half_up(SAVINGS_PCT[cycle_level] * weekly_installment_cents); SAVINGS_PCT = {1: 0.02, 2: 0.03, 3: 0.04, 4: 0.05, 5: 0.05}" }
      - { name: principal_outstanding_cents, type: integer, source: computed, description: "Initialized to term_weeks * weekly_installment_cents at disbursement; equals that initial value minus the sum of principal_applied_cents over this loan's POSTED RepaymentTransactions (flat-rate lending: every applied dollar retires outstanding)" }
      - { name: next_due_date, type: datetime, source: system, description: "Disbursement instant + 7 days; advances by 7 days per sweep-consumed unpaid due" }
      - { name: installments_on_time, type: integer, source: system, default: 0, description: "Count of installments applied from collections posted with logical time <= their due date" }
      - { name: installments_missed, type: integer, source: system, default: 0, description: "Count of due dates consumed by the delinquency sweep unpaid" }
      - { name: status, type: enum, source: system, description: "ACTIVE <-> DELINQUENT -> DEFAULTED; ACTIVE -> PAID_OFF", constraints: "enum: ACTIVE, DELINQUENT, DEFAULTED, PAID_OFF" }

  - name: LoanRestructure
    parent: null
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id" }
      - { name: new_term_weeks, type: integer, source: input, description: "Replacement term; must be one of 12, 24, 36, 48 and strictly greater than the number of installments already applied" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> ACTIVE -> SUPERSEDED", constraints: "enum: PROPOSED, ACTIVE, SUPERSEDED" }

  - name: CenterMeeting
    parent: null
    common_fields: true
    fields:
      - { name: center_id, type: string, source: input, description: "FK -> Center.id" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO8601 UTC; weekday (UTC) must equal the center's meeting_day_of_week; half-open interval [scheduled_start, scheduled_end)" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO8601 UTC; strictly greater than scheduled_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> OPEN -> CLOSED | CANCELLED (independent dimension)", constraints: "enum: SCHEDULED, OPEN, CLOSED, CANCELLED" }
      - { name: settlement_status, type: enum, source: system, description: "PENDING -> POSTED -> RECONCILED | DISPUTED (independent dimension, parallel to status)", constraints: "enum: PENDING, POSTED, RECONCILED, DISPUTED" }
      - { name: declared_cash_cents, type: integer, source: system, description: "Cash declared at reconciliation; null until reconciled", default: null }
      - { name: closer_user_id, type: string, source: system, description: "X-User-ID of the CenterManager who closed the meeting; reconciliation by the same id is a segregation-of-duties violation", default: null }

  - name: MeetingAttendance
    parent: null
    common_fields: false
    fields:
      - { name: center_meeting_id, type: string, source: system, description: "FK -> CenterMeeting.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: present, type: boolean, source: input, description: "True = PRESENT, false = ABSENT" }

  - name: RepaymentTransaction
    parent: null
    common_fields: true
    fields:
      - { name: center_meeting_id, type: string, source: system, description: "FK -> CenterMeeting.id" }
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; payer" }
      - { name: amount_cents, type: integer, source: input, description: "Total cash collected; must be >= loan.savings_required_cents + 1" }
      - { name: savings_applied_cents, type: integer, source: computed, description: "Waterfall bucket 1: always exactly loan.savings_required_cents" }
      - { name: installment_applied_cents, type: integer, source: computed, description: "Waterfall buckets 2+3: arrears then current installment" }
      - { name: principal_applied_cents, type: integer, source: computed, description: "Total outstanding retired by this txn: installment_applied_cents plus the bucket-4 prepayment remainder" }
      - { name: status, type: enum, source: system, description: "POSTED -> VOIDED", constraints: "enum: POSTED, VOIDED" }

  - name: SavingsAccount
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; 1:1, opened automatically at first disbursement" }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "sum of savings_applied_cents over the member's POSTED RepaymentTransactions minus sum of withdrawal amount_cents" }
      - { name: locked_cents, type: integer, source: computed, default: 0, description: "round_half_up(0.10 * total principal_outstanding_cents over the member's Loans in ACTIVE or DELINQUENT)" }
      - { name: withdrawable_cents, type: integer, source: computed, default: 0, description: "balance_cents - locked_cents; floor 0" }
      - { name: status, type: enum, source: system, description: "OPEN <-> FROZEN -> CLOSED", constraints: "enum: OPEN, FROZEN, CLOSED" }

  - name: CreditBureauReport
    parent: null
    common_fields: false
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id" }
      - { name: report_type, type: enum, source: system, description: "PROVISIONAL at disbursement; FINAL at PAID_OFF or DEFAULTED", constraints: "enum: PROVISIONAL, FINAL" }
      - { name: score_reported, type: integer, source: system, description: "credit_score_provisional for PROVISIONAL reports; credit_score_final for FINAL reports" }

  - name: BranchExpansionPlan
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: system, description: "FK -> Branch.id" }
      - { name: new_centers, type: integer, source: input, description: "Centers the plan will open; >= 1" }
      - { name: new_managers_hired, type: integer, source: input, description: "Managers the plan will hire; >= 0" }
      - { name: target_new_members, type: integer, source: input, description: "Projected net member growth; >= 0" }
      - { name: feasibility, type: object, source: computed, description: "Computed at submission via expansion_feasibility: { required_member_capacity, available_member_capacity, required_center_slots, available_center_slots, feasible }" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> APPROVED | REJECTED", constraints: "enum: DRAFT, SUBMITTED, APPROVED, REJECTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Member
    initial_state: RECRUITED
    terminal_states: [BLACKLISTED]
    transitions:
      - from: RECRUITED
        to: IN_TRAINING
        trigger: "POST /peer-groups/{groupId}/members (member added to a FORMING or TRAINING group)"
        actor: FieldOfficer
        preconditions:
          - "Member.status == RECRUITED (ERR_MEMBER_NOT_RECRUITED)"
          - "Member.peer_group_id is null (ERR_MEMBER_ALREADY_IN_GROUP)"
          - "Member has no FINAL CreditBureauReport with score_reported < 300 and Member.status != BLACKLISTED (ERR_MEMBER_BLACKLISTED — checked before ERR_MEMBER_ALREADY_IN_GROUP)"
          - "Group status in {FORMING, TRAINING} (ERR_GROUP_NOT_FORMING)"
          - "Group member_count < 5 (ERR_GROUP_FULL)"
        side_effects:
          - "Member.peer_group_id := group id"
          - "PeerGroup.member_count += 1"
          - "Branch.active_member_count recomputed (IN_TRAINING counts)"
          - "CenterManager.current_caseload recomputed for the center's manager"

      - from: IN_TRAINING
        to: ELIGIBLE
        trigger: "system (when the member's group's 2nd GroupTrainingSession transitions to COMPLETED)"
        actor: system
        preconditions:
          - "Member.peer_group.completed_training_sessions reaches 2"
        side_effects:
          - "Member.status := ELIGIBLE"

      - from: ELIGIBLE
        to: ACTIVE_BORROWER
        trigger: "POST /loan-applications/{id}/disburse (first disbursement)"
        actor: BranchManager
        preconditions: []
        side_effects:
          - "SavingsAccount opened for the member (status OPEN, balance 0) if none exists"

      - from: ACTIVE_BORROWER
        to: DELINQUENT
        trigger: "system (member has a Loan transitioning ACTIVE -> DELINQUENT in the delinquency sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "Member.status := DELINQUENT"

      - from: DELINQUENT
        to: ACTIVE_BORROWER
        trigger: "system (member's last DELINQUENT loan cures to ACTIVE via a collection covering all arrears)"
        actor: system
        preconditions:
          - "No remaining Loan of the member in DELINQUENT"
        side_effects:
          - "Member.cured_delinquency_count += 1"

      - from: ACTIVE_BORROWER
        to: BLACKLISTED
        trigger: "system (member's loan transitions to DEFAULTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Member.status := BLACKLISTED"
          - "Member's SavingsAccount -> FROZEN"
          - "PeerGroup.member_count recomputed (BLACKLISTED excluded)"

      - from: DELINQUENT
        to: BLACKLISTED
        trigger: "system (member's loan transitions to DEFAULTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Member.status := BLACKLISTED"
          - "Member's SavingsAccount -> FROZEN"
          - "PeerGroup.member_count recomputed (BLACKLISTED excluded)"

  - entity: PeerGroup
    initial_state: FORMING
    terminal_states: [DISSOLVED]
    transitions:
      - from: FORMING
        to: TRAINING
        trigger: "POST /group-training-sessions (first session scheduled for the group)"
        actor: CenterManager
        preconditions:
          - "Group.status == FORMING (ERR_GROUP_NOT_FORMING)"
          - "Group.member_count == 5 exactly (ERR_GROUP_SIZE_INVALID)"
        side_effects:
          - "Group.status := TRAINING"

      - from: TRAINING
        to: ACTIVE
        trigger: "system (2nd GroupTrainingSession of the group transitions to COMPLETED)"
        actor: system
        preconditions:
          - "Group.completed_training_sessions reaches 2"
          - "Group.member_count == 5"
        side_effects:
          - "All members of the group IN_TRAINING -> ELIGIBLE"

      - from: ACTIVE
        to: RESTRICTED
        trigger: "system (a Loan of any group member transitions ACTIVE -> DELINQUENT)"
        actor: system
        preconditions:
          - "Group.delinquent_loan_count >= 1 after the loan transition (>= comparison: exactly 1 triggers)"
        side_effects:
          - "Group.status := RESTRICTED"
          - "Every other group member's Loan in ACTIVE gets its ladder advancement frozen (no cycle_level increment at PAID_OFF while group is RESTRICTED)"
          - "Every LoanApplication of any group member currently in VOTING -> EXPIRED (joint liability: no new lending while any member is delinquent)"

      - from: RESTRICTED
        to: ACTIVE
        trigger: "system (the last DELINQUENT loan of any group member cures to ACTIVE; delinquent_loan_count returns to 0)"
        actor: system
        preconditions:
          - "Group.delinquent_loan_count == 0 after the cure"
        side_effects:
          - "Group.status := ACTIVE"
          - "Ladder freeze lifted for all group members"

      - from: ACTIVE
        to: DISSOLVED
        trigger: "POST /peer-groups/{id}/dissolve"
        actor: FieldOfficer
        preconditions:
          - "Group.status in {ACTIVE, RESTRICTED} (ERR_INVALID_STATE)"
          - "No Loan of any group member in ACTIVE or DELINQUENT (ERR_GROUP_HAS_ACTIVE_LOANS)"
        side_effects:
          - "Members keep their status and history; peer_group_id retained for audit"

      - from: RESTRICTED
        to: DISSOLVED
        trigger: "POST /peer-groups/{id}/dissolve"
        actor: FieldOfficer
        preconditions:
          - "Group.status in {ACTIVE, RESTRICTED} (ERR_INVALID_STATE)"
          - "No Loan of any group member in ACTIVE or DELINQUENT (ERR_GROUP_HAS_ACTIVE_LOANS)"
        side_effects: []

  - entity: LoanApplication
    initial_state: DRAFT
    terminal_states: [DISBURSED, REJECTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: VOTING
        trigger: "POST /loan-applications/{id}/submit"
        actor: FieldOfficer
        preconditions:
          - "Application.status == DRAFT (ERR_APPLICATION_NOT_DRAFT)"
          - "Applicant Member.status in {ELIGIBLE, ACTIVE_BORROWER} (ERR_MEMBER_NOT_ELIGIBLE)"
          - "Applicant Member.consecutive_absence_streak < 2 (ERR_ATTENDANCE_INELIGIBLE — streak exactly 2 blocks submission)"
          - "Applicant has no other LoanApplication in DRAFT, VOTING, or APPROVED (ERR_MEMBER_HAS_OPEN_APPLICATION)"
          - "Applicant has no Loan in ACTIVE or DELINQUENT (ERR_MEMBER_HAS_ACTIVE_LOAN)"
          - "Applicant's PeerGroup.status == ACTIVE (ERR_GROUP_NOT_ACTIVE)"
        side_effects:
          - "voting_deadline := logical clock + 7 days"

      - from: VOTING
        to: APPROVED
        trigger: "system (the 4th distinct peer's APPROVE vote is cast — unanimous approval of all 4 non-applicant members)"
        actor: system
        preconditions:
          - "All 4 non-applicant group members have cast ConsensusVote.decision == APPROVE"
          - "Group.status == ACTIVE (re-checked at approval instant)"
        side_effects:
          - "Application.status := APPROVED"

      - from: VOTING
        to: REJECTED
        trigger: "system (any peer casts REJECT) OR system (attendance cascade: applicant receives an attendance strike while VOTING)"
        actor: system
        preconditions: []
        side_effects:
          - "Application.status := REJECTED"

      - from: VOTING
        to: EXPIRED
        trigger: "system (clock sweep: now > voting_deadline without unanimous approval — strictly greater, so a vote landing exactly at the deadline fails with ERR_VOTING_WINDOW_EXPIRED on a still-VOTING application) OR system (group contagion: group -> RESTRICTED while application VOTING)"
        actor: system
        preconditions: []
        side_effects:
          - "Application.status := EXPIRED"

      - from: APPROVED
        to: DISBURSED
        trigger: "POST /loan-applications/{id}/disburse"
        actor: BranchManager
        preconditions:
          - "Application.status == APPROVED (ERR_APPLICATION_NOT_APPROVED — state check outranks the fiscal ladder check)"
          - "Applicant's PeerGroup.status == ACTIVE (ERR_GROUP_RESTRICTED)"
          - "Applicant Member.status in {ELIGIBLE, ACTIVE_BORROWER} (ERR_MEMBER_NOT_ELIGIBLE)"
          - "requested_amount_cents <= next_loan_ceiling(applicant) (ERR_LADDER_CEILING_EXCEEDED)"
        side_effects:
          - "Create Loan: principal_cents := requested_amount_cents, cycle_level := applicant cycle_level snapshot, weekly_installment_cents and savings_required_cents per installment_and_savings_split, next_due_date := logical clock + 7 days, status ACTIVE"
          - "Applicant ELIGIBLE -> ACTIVE_BORROWER"
          - "Open SavingsAccount for applicant if absent (OPEN, balance 0)"
          - "Create CreditBureauReport PROVISIONAL with score_reported := credit_score_provisional"
          - "Application.applied_ceiling_cents := next_loan_ceiling(applicant)"

  - entity: Loan
    initial_state: ACTIVE
    terminal_states: [PAID_OFF, DEFAULTED]
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: "system (delinquency sweep on POST /_clock/set_current_utc: first unpaid due date with days_past_due >= 8)"
        actor: system
        preconditions:
          - "days_past_due(next_due_date) >= 8 (boundary: 7 days late remains ACTIVE; 8 days flips)"
        side_effects:
          - "installments_missed += 1 per unpaid due consumed; next_due_date advances by 7 days per consumed due"
          - "Member ACTIVE_BORROWER -> DELINQUENT"
          - "Member's PeerGroup.delinquent_loan_count += 1; if >= 1 the group ACTIVE -> RESTRICTED (contagion hop 2)"
          - "Contagion hop 3: sibling group members' ACTIVE loans ladder-frozen; VOTING applications of the group -> EXPIRED"

      - from: DELINQUENT
        to: ACTIVE
        trigger: "POST /center-meetings/{id}/collections (posting covers all arrears: installment_applied_cents retires every consumed unpaid installment)"
        actor: CenterManager
        preconditions: []
        side_effects:
          - "Loan.status := ACTIVE"
          - "Member DELINQUENT -> ACTIVE_BORROWER; Member.cured_delinquency_count += 1"
          - "Member's PeerGroup.delinquent_loan_count -= 1; if it reaches 0 the group RESTRICTED -> ACTIVE and ladder freeze lifts"

      - from: ACTIVE
        to: PAID_OFF
        trigger: "system (a collection posting drives principal_outstanding_cents to 0 with all scheduled installments applied)"
        actor: system
        preconditions:
          - "principal_outstanding_cents == 0 after waterfall application"
        side_effects:
          - "Loan.status := PAID_OFF"
          - "Create CreditBureauReport FINAL with score_reported := credit_score_final"
          - "If installments_missed == 0 AND member's group is not RESTRICTED: Member.cycle_level := min(cycle_level + 1, 5); otherwise cycle_level unchanged"
          - "Member.credit_score re-evaluated (no longer provisional)"

      - from: DELINQUENT
        to: DEFAULTED
        trigger: "system (delinquency sweep: days_past_due of the oldest unpaid due >= 30)"
        actor: system
        preconditions:
          - "days_past_due >= 30 (boundary: 29 days remains DELINQUENT)"
        side_effects:
          - "Loan.status := DEFAULTED"
          - "Member -> BLACKLISTED; SavingsAccount -> FROZEN"
          - "Create CreditBureauReport FINAL with score_reported := credit_score_final"
          - "Group.delinquent_loan_count unchanged (DEFAULTED still counts); group stays RESTRICTED"

  - entity: LoanRestructure
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "system (immediately upon successful POST /loans/{id}/restructures)"
        actor: system
        preconditions: []
        side_effects:
          - "New restructure becomes ACTIVE"
          - "Prior ACTIVE LoanRestructure of the same loan (if any) -> SUPERSEDED (create-with-supersede)"
          - "Loan.term_weeks := new_term_weeks; weekly_installment_cents recomputed via installment_and_savings_split over remaining principal; Loan.version += 1"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a newer restructure on the same loan is created)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CenterMeeting
    initial_state: "status: SCHEDULED; settlement_status: PENDING (parallel dimensions)"
    terminal_states: ["status: CLOSED with settlement_status RECONCILED or DISPUTED; status: CANCELLED"]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /center-meetings/{id}/open"
        actor: CenterManager
        preconditions:
          - "Meeting.status == SCHEDULED (ERR_MEETING_NOT_SCHEDULED)"
          - "Acting CenterManager (X-User-ID) == meeting.center.center_manager_id (ERR_NOT_CENTER_MANAGER)"
        side_effects: []

      - from: OPEN
        to: CLOSED
        trigger: "POST /center-meetings/{id}/close"
        actor: CenterManager
        preconditions:
          - "Meeting.status == OPEN (ERR_MEETING_NOT_OPEN)"
          - "Acting CenterManager (X-User-ID) == meeting.center.center_manager_id (ERR_NOT_CENTER_MANAGER)"
        side_effects:
          - "closer_user_id := X-User-ID"
          - "settlement_status := POSTED"
          - "Auto-mark ABSENT every member of the center's groups (status IN_TRAINING..DELINQUENT) with no MeetingAttendance row for this meeting"
          - "Cascade hop 1: recompute each member's consecutive_absence_streak (PRESENT -> 0; ABSENT -> +1)"
          - "Cascade hop 2: any member whose streak reaches exactly 2 gets attendance_strikes += 1 and credit_score recomputed"
          - "Cascade hop 3: any VOTING LoanApplication whose applicant just received a strike -> REJECTED"

      - from: CLOSED
        to: "CLOSED (settlement_status POSTED -> RECONCILED, or DISPUTED -> RECONCILED on retry)"
        trigger: "POST /center-meetings/{id}/reconcile with matching declared_cash_cents"
        actor: BranchManager
        preconditions:
          - "Meeting.status == CLOSED (ERR_MEETING_NOT_CLOSED)"
          - "Meeting.settlement_status in {POSTED, DISPUTED} — DISPUTED is retryable; RECONCILED is terminal (ERR_ALREADY_RECONCILED)"
          - "X-User-ID != meeting.closer_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "declared_cash_cents == sum of amount_cents over the meeting's POSTED RepaymentTransactions (ERR_RECONCILIATION_MISMATCH)"
        side_effects:
          - "settlement_status := RECONCILED; declared_cash_cents recorded"

      - from: CLOSED
        to: "CLOSED (settlement_status POSTED -> DISPUTED)"
        trigger: "POST /center-meetings/{id}/reconcile with mismatched declared_cash_cents"
        actor: BranchManager
        preconditions:
          - "Meeting.status == CLOSED; settlement_status == POSTED; X-User-ID != closer_user_id"
        side_effects:
          - "settlement_status := DISPUTED; declared_cash_cents recorded; response is ERR_RECONCILIATION_MISMATCH (409)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /center-meetings/{id}/cancel"
        actor: CenterManager
        preconditions:
          - "Meeting.status == SCHEDULED (ERR_MEETING_NOT_SCHEDULED)"
        side_effects: []

  - entity: GroupTrainingSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /group-training-sessions/{id}/complete"
        actor: CenterManager
        preconditions:
          - "Session.status == SCHEDULED (ERR_TRAINING_NOT_SCHEDULED)"
        side_effects:
          - "Group.completed_training_sessions += 1"
          - "If the group reaches 2 completed sessions and member_count == 5: group TRAINING -> ACTIVE; all members IN_TRAINING -> ELIGIBLE"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /group-training-sessions/{id}/cancel"
        actor: CenterManager
        preconditions:
          - "Session.status == SCHEDULED (ERR_TRAINING_NOT_SCHEDULED)"
        side_effects: []

  - entity: RepaymentTransaction
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /repayment-transactions/{id}/void"
        actor: BranchManager
        preconditions:
          - "Transaction.status == POSTED (ERR_TXN_NOT_POSTED)"
          - "Transaction's meeting settlement_status != RECONCILED (ERR_MEETING_ALREADY_RECONCILED)"
        side_effects:
          - "Loan.principal_outstanding_cents += principal_applied_cents (exact reversal)"
          - "Loan installment counters decremented by the amounts this txn applied"
          - "SavingsAccount.balance_cents -= savings_applied_cents"
          - "Member.credit_score recomputed"

  - entity: SavingsAccount
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "system (member BLACKLISTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: FROZEN
        to: OPEN
        trigger: "POST /members/{id}/savings/unfreeze"
        actor: ProgramAdmin
        preconditions:
          - "Account.status == FROZEN (ERR_ACCOUNT_NOT_FROZEN)"
        side_effects: []

      - from: OPEN
        to: CLOSED
        trigger: "POST /members/{id}/savings/close"
        actor: Member
        preconditions:
          - "Account.status == OPEN (ERR_ACCOUNT_NOT_OPEN)"
          - "Member has no Loan in ACTIVE or DELINQUENT (ERR_MEMBER_HAS_ACTIVE_LOAN)"
          - "balance_cents == 0 (ERR_ACCOUNT_NOT_EMPTY)"
        side_effects: []

  - entity: BranchExpansionPlan
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /branches/{branchId}/expansion-plans (creation runs feasibility evaluation)"
        actor: BranchManager
        preconditions:
          - "expansion_feasibility.feasible == true (ERR_EXPANSION_INFEASIBLE)"
        side_effects:
          - "Plan created directly in SUBMITTED with computed feasibility block"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /expansion-plans/{id}/decide { decision: APPROVE }"
        actor: ProgramAdmin
        preconditions:
          - "Plan.status == SUBMITTED (ERR_PLAN_NOT_SUBMITTED)"
        side_effects: []

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /expansion-plans/{id}/decide { decision: REJECT }"
        actor: ProgramAdmin
        preconditions:
          - "Plan.status == SUBMITTED (ERR_PLAN_NOT_SUBMITTED)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: loan-restructure-stale-version
    parent_entity: Loan
    write_endpoint: "POST /loans/{id}/restructures"
    occ_field: expected_loan_version
    description: |
      Creating a LoanRestructure against a Loan whose version has advanced
      since the client last observed it is rejected. A successful restructure
      legitimately supersedes the prior ACTIVE restructure and rewrites the
      loan's term and installment, so a writer holding a stale loan version
      would silently supersede terms it never saw; the stale version is
      rejected with 412 instead.
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: installment_and_savings_split
    trigger: "loan disbursement; restructure activation (over remaining principal)"
    algorithm: tiered_pricing
    formula: |
      # Mode (a): >= 3 inputs with conditional branches on member state and
      # cycle tier. Evaluation order is pinned:
      #   1. FLAT_RATE := 0.004 per week (constant)
      #   2. rate := FLAT_RATE
      #      if member.cured_delinquency_count >= 1: rate := FLAT_RATE + 0.001   (rehab penalty branch)
      #      if member.cured_delinquency_count >= 3: rate := FLAT_RATE + 0.002   (repeat-rehab branch)
      #   3. gross := principal_cents * (1 + rate * term_weeks)
      #   4. weekly_installment_cents := round_half_up(gross / term_weeks)
      #   5. pct := SAVINGS_PCT[cycle_level]  (tiered-rate selection)
      #   6. savings_required_cents := max(MIN_SAVINGS_CENTS, round_half_up(pct * weekly_installment_cents))
      weekly_installment_cents = round_half_up(principal_cents * (1 + rate * term_weeks) / term_weeks)
      savings_required_cents   = max(MIN_SAVINGS_CENTS, round_half_up(SAVINGS_PCT[cycle_level] * weekly_installment_cents))
    input_set: "The loan being disbursed/restructured; member.cured_delinquency_count and cycle_level at that instant"
    constants:
      FLAT_RATE: 0.004
      REHAB_RATE_STEP_1: 0.001
      REHAB_RATE_STEP_2: 0.002
      REHAB_COUNT_THRESHOLD_1: 1
      REHAB_COUNT_THRESHOLD_2: 3
      MIN_SAVINGS_CENTS: 200
      SAVINGS_PCT: { 1: 0.02, 2: 0.03, 3: 0.04, 4: 0.05, 5: 0.05 }
    precision: "integer cents, round_half_up, each component rounded individually before any downstream sum"

  - name: collection_waterfall
    trigger: "POST /center-meetings/{id}/collections (each posted RepaymentTransaction)"
    algorithm: waterfall_allocation
    formula: |
      # Buckets in pinned order. Remainders round per-transaction (mode b:
      # round each transaction's split first; meeting reconciliation sums the
      # already-rounded per-transaction components — never the reverse).
      #   1. savings_applied_cents := savings_required_cents
      #      (request rejected if amount_cents < savings_required_cents + 1)
      #   2. arrears: apply to consumed unpaid installments, oldest due first
      #      (due order = chronological by due date); each fully covered
      #      installment consumes weekly_installment_cents, and a partial
      #      remainder smaller than one installment is still applied to the
      #      oldest remaining due
      #   3. current installment: up to weekly_installment_cents
      #   4. remainder: prepayment against outstanding, capped at the
      #      outstanding remaining after buckets 2-3; a request whose
      #      amount_cents exceeds savings_required_cents + current
      #      principal_outstanding_cents is rejected outright
      #      (ERR_COLLECTION_EXCEEDS_OUTSTANDING) — collections never overpay, capped at the
      #      outstanding remaining after buckets 2-3; a request whose
      #      amount_cents exceeds savings_required_cents + current
      #      principal_outstanding_cents is rejected outright
      #      (ERR_COLLECTION_EXCEEDS_OUTSTANDING) — collections never overpay
      # installment_applied_cents := sum applied in buckets 2+3
      # principal_applied_cents    := installment_applied_cents + bucket 4
      #   remainder (flat-rate lending: every applied dollar retires
      #   outstanding; outstanding is initialized to term * installment)
      # on-time: an installment counts toward installments_on_time iff the
      #   collection's logical posting time <= that installment's due date.
      savings_applied_cents    = savings_required_cents
      installment_applied_cents = arrears_applied + current_applied
      principal_applied_cents  = installment_applied_cents + prepayment_cents
    input_set: "The target Loan (status ACTIVE or DELINQUENT), its consumed-unpaid dues in chronological due-date order, and the request amount_cents"
    constants:
      INSTALLMENTS_PER_TERM: 24
    precision: "integer cents; per-transaction rounding precedes any aggregation (meeting totals sum rounded transaction components)"

  - name: next_loan_ceiling
    trigger: "POST /loan-applications/{id}/disburse (fiscal check)"
    algorithm: threshold
    formula: |
      # Variant selection (pinned):
      #   REHABILITATED applies iff member.cured_delinquency_count >= 1;
      #   otherwise STANDARD applies.
      # STANDARD:      ceiling := CYCLE_CEILING_CENTS[cycle_level]
      # REHABILITATED: requires a prior PAID_OFF loan (cured_delinquency_count
      #   >= 1 implies a prior ACTIVE-then-cured loan that was later paid off):
      #   ceiling := min(CYCLE_CEILING_CENTS[cycle_level],
      #                  floor(1.5 * last_repaid_principal_cents))
      #   where last_repaid_principal_cents is the principal_cents of the
      #   member's most recent PAID_OFF loan (created_at DESC).
      standard_ceiling      = CYCLE_CEILING_CENTS[cycle_level]
      rehabilitated_ceiling = min(CYCLE_CEILING_CENTS[cycle_level], floor(1.5 * last_repaid_principal_cents))
    input_set: "Applicant member: cycle_level, cured_delinquency_count, most recent PAID_OFF Loan (created_at DESC, tie impossible: one open cycle at a time)"
    constants:
      CYCLE_CEILING_CENTS: { 1: 100000, 2: 200000, 3: 300000, 4: 400000, 5: 500000 }
      REHAB_MULTIPLIER: 1.5
    precision: "integer cents, floor for the multiplier product"
    variants:
      - name: standard
        when: "member.cured_delinquency_count == 0"
        difference: "pure ladder lookup; ignores repayment history beyond on-time advancement"
      - name: rehabilitated
        when: "member.cured_delinquency_count >= 1"
        difference: "capped at 1.5x last repaid principal — strictly lower than standard whenever the ladder step exceeds 1.5x"

  - name: credit_score_provisional
    trigger: "Member.credit_score reads while the member holds a Loan in ACTIVE or DELINQUENT; PROVISIONAL CreditBureauReport at disbursement"
    algorithm: weighted_scoring
    formula: |
      # Provisional = actual performance so far + CREDIT for remaining
      # scheduled installments as if they will all be paid on time.
      remaining_installments = term_weeks - (installments_on_time + installments_missed)
      score = BASE
              + PER_ON_TIME   * installments_on_time
              + PER_PROJECTED * remaining_installments
              - PER_MISSED    * installments_missed
              - PER_STRIKE    * member.attendance_strikes
      clamped to [300, 850]
    input_set: "The member's single open Loan (ACTIVE or DELINQUENT) plus member.attendance_strikes"
    constants:
      BASE: 600
      PER_ON_TIME: 10
      PER_PROJECTED: 5
      PER_MISSED: 30
      PER_STRIKE: 15
      FLOOR: 300
      CEILING: 850
    precision: "integer points"

  - name: credit_score_final
    trigger: "Loan PAID_OFF or DEFAULTED (FINAL CreditBureauReport); Member.credit_score reads when no open loan exists"
    algorithm: weighted_scoring
    formula: |
      # Final = actuals only, NO projected credit; adds attendance bonus.
      score = BASE
              + PER_ON_TIME * installments_on_time
              - PER_MISSED  * installments_missed
              + PER_ATTENDED_MEETING * meetings_attended_during_loan
              - PER_STRIKE  * member.attendance_strikes
      meetings_attended_during_loan = count of MeetingAttendance rows with
        present == true for the member at meetings whose CLOSED transition
        happened within [loan created_at, loan terminal transition time]
      clamped to [300, 850]
    input_set: "The terminating Loan plus MeetingAttendance rows (present == true only) in the loan's lifetime window, inclusive both ends"
    constants:
      BASE: 600
      PER_ON_TIME: 10
      PER_MISSED: 30
      PER_ATTENDED_MEETING: 2
      PER_STRIKE: 15
      FLOOR: 300
      CEILING: 850
    precision: "integer points"
    variants:
      - name: provisional
        when: "loan still open"
        difference: "credits remaining installments at +5 each; no attendance bonus — a member mid-cycle with zero activity reads 600 + 5*24 = 720 provisionally but would finalize lower if they pay nothing"
      - name: final
        when: "loan PAID_OFF or DEFAULTED"
        difference: "no projected credit; +2 per attended meeting"

  - name: delinquency_evaluation
    trigger: "POST /_clock/set_current_utc (sweep runs after the clock moves)"
    algorithm: chronological
    formula: |
      # Process loans ordered by next_due_date ASC (tie-break: loan created_at
      # ASC — never id). For each Loan in ACTIVE or DELINQUENT:
      #   while days_past_due(next_due_date) >= 8:
      #       installments_missed += 1
      #       next_due_date += 7 days
      #       if loan was ACTIVE: loan -> DELINQUENT (fires contagion chain)
      #   days_past_due(d) := floor((now - d) / 86400 seconds); boundary:
      #   exactly 7 days late => 7 < 8, stays ACTIVE; 8 days => delinquent.
      # DEFAULTED: after the while loop, if loan is DELINQUENT and
      #   days_past_due(oldest consumed unpaid due) >= 30: loan -> DEFAULTED.
      days_past_due(d) = floor((now - d) / 86400)
      delinquent iff days_past_due >= 8
      defaulted  iff days_past_due(oldest unpaid due) >= 30
    input_set: "All Loans in ACTIVE or DELINQUENT, ordered next_due_date ASC then created_at ASC"
    constants:
      GRACE_DAYS: 7
      DELINQUENT_DAYS: 8
      DEFAULT_DAYS: 30
    precision: "whole days, floor"

  - name: meeting_reconciliation
    trigger: "POST /center-meetings/{id}/reconcile"
    algorithm: aggregation
    formula: |
      # Mode (b) nested-rounding counterpart to collection_waterfall: the
      # posted total is the sum of ALREADY ROUNDED per-transaction amount_cents
      # values; it is never recomputed from unrounded components.
      posted_total = sum(amount_cents over the meeting's POSTED RepaymentTransactions)
      discrepancy  = declared_cash_cents - posted_total
      RECONCILED iff discrepancy == 0 exactly (no tolerance band);
      otherwise settlement_status := DISPUTED and ERR_RECONCILIATION_MISMATCH.
    input_set: "RepaymentTransactions of the meeting with status POSTED (VOIDED excluded)"
    precision: "integer cents, exact equality"

  - name: expansion_feasibility
    trigger: "POST /branches/{branchId}/expansion-plans"
    algorithm: constraint_propagation
    formula: |
      # Mode (c): circular-looking dependency pinned to a strict evaluation
      # order. Tier depends on members; caps depend on tier; feasibility
      # depends on caps. The pinned order breaks the circle by using CURRENT
      # members only for tier:
      #   1. m := branch.active_member_count (CURRENT, pre-expansion)
      #   2. tier := SMALL if m < 200; MEDIUM if 200 <= m < 500; LARGE if m >= 500
      #   3. member_cap := 60 (SMALL) / 80 (MEDIUM) / 100 (LARGE)
      #      center_cap := 3 (SMALL) / 4 (MEDIUM) / 5 (LARGE)
      #   4. mgrs := count of branch CenterManagers + plan.new_managers_hired
      #   5. available_member_capacity := mgrs * member_cap
      #      available_center_slots  := mgrs * center_cap - current_center_count
      #   6. required_member_capacity := m + plan.target_new_members
      #      required_center_slots  := plan.new_centers
      #   7. feasible := (required_member_capacity <= available_member_capacity)
      #                  AND (required_center_slots <= available_center_slots)
      feasible = (m + target_new_members <= mgrs * member_cap)
                 and (new_centers <= mgrs * center_cap - current_center_count)
    input_set: "Branch (current active_member_count, center count), its CenterManagers, and the plan's new_centers / new_managers_hired / target_new_members"
    constants:
      TIER_MEDIUM_MIN: 200
      TIER_LARGE_MIN: 500
      MEMBER_CAP: { SMALL: 60, MEDIUM: 80, LARGE: 100 }
      CENTER_CAP: { SMALL: 3, MEDIUM: 4, LARGE: 5 }
    precision: "integer headcounts; <= comparisons (capacity exactly equal to requirement IS feasible)"

  - name: caseload_recompute
    trigger: "member added to group; member BLACKLISTED; center reassigned to another manager; group dissolved"
    algorithm: aggregation
    formula: |
      manager.current_caseload = count of DISTINCT members with
        status IN {IN_TRAINING, ELIGIBLE, ACTIVE_BORROWER, DELINQUENT}
        whose peer_group_id resolves to a PeerGroup whose center_id resolves
        to a Center with center_manager_id == manager.id
      branch.total_manager_caseload = sum of current_caseload over the
        branch's CenterManagers
      # Invariant: reassigning a center between two managers of the same
      # branch leaves branch.total_manager_caseload unchanged.
    input_set: "Members joined through PeerGroup -> Center -> CenterManager"
    precision: "integer counts"

  - name: savings_available
    trigger: "POST /members/{id}/savings/withdrawals; SavingsAccount reads"
    algorithm: aggregation
    formula: |
      balance_cents  = sum(savings_applied_cents over member's POSTED txns)
                       - sum(amount_cents over member's withdrawals)
      locked_cents   = round_half_up(0.10 * sum(principal_outstanding_cents
                       over member's Loans in ACTIVE or DELINQUENT))
      withdrawable_cents = max(0, balance_cents - locked_cents)
    input_set: "Member's POSTED RepaymentTransactions, withdrawals, and open Loans"
    constants:
      LOCK_PCT: 0.10
    precision: "integer cents, round_half_up on the locked amount"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role is permitted to call this endpoint per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path-template ids exist, validated left-to-right (group before application, meeting before transaction)"
    error_id: "ERR_PEER_GROUP_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_LOAN_NOT_FOUND | ERR_CENTER_NOT_FOUND | ERR_CENTER_MANAGER_NOT_FOUND | ERR_BRANCH_NOT_FOUND | ERR_MEETING_NOT_FOUND | ERR_TRAINING_SESSION_NOT_FOUND | ERR_TRANSACTION_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 3.5
    category: concurrency
    check: "expected_loan_version == Loan.version when supplied (OCC)"
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412
    applies_to: "POST /loans/{id}/restructures"

  - priority: 4
    category: state
    check: "Target resource state permits the operation (application DRAFT for submit, APPROVED for disburse, meeting OPEN for collections/close, CLOSED for reconcile, txn POSTED for void, etc.)"
    error_id: "ERR_APPLICATION_NOT_DRAFT | ERR_APPLICATION_NOT_APPROVED | ERR_APPLICATION_NOT_VOTING | ERR_MEETING_NOT_OPEN | ERR_MEETING_NOT_CLOSED | ERR_MEETING_NOT_SCHEDULED | ERR_TXN_NOT_POSTED | ERR_ACCOUNT_NOT_OPEN | ERR_ACCOUNT_NOT_FROZEN | ERR_ACCOUNT_NOT_EMPTY | ERR_PLAN_NOT_SUBMITTED | ERR_TRAINING_NOT_SCHEDULED | ERR_LOAN_NOT_REPAYABLE | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "Compliance gates: member.status != BLACKLISTED for group adds and application submits; reconcile actor != meeting closer_user_id (segregation of duties)"
    error_id: "ERR_MEMBER_BLACKLISTED | ERR_SEGREGATION_OF_DUTIES"
    http_status: 403
    applies_to: "POST /peer-groups/{id}/members, POST /loan-applications/{id}/submit, POST /center-meetings/{id}/reconcile"

  - priority: 6
    category: business_referential
    check: "Cross-references cohere: member not already in a group; voter is a non-applicant member of the same group and has not already voted; collection loan belongs to the paying member; attendance/collection member's group sits at this meeting's center; training session manager matches group center's manager"
    error_id: "ERR_MEMBER_ALREADY_IN_GROUP | ERR_VOTER_NOT_GROUP_PEER | ERR_VOTER_IS_APPLICANT | ERR_ALREADY_VOTED | ERR_LOAN_MEMBER_MISMATCH | ERR_MEMBER_NOT_AT_CENTER | ERR_MANAGER_CENTER_MISMATCH"
    http_status: 422
    applies_to: "membership, vote, collection, training endpoints"

  - priority: 7
    category: business_temporal
    check: "Temporal rules: meeting [start,end) half-open overlap on the same center; training closed-interval + 30-minute buffer overlap on the same manager; vote cast before voting_deadline; meeting weekday matches center.meeting_day_of_week"
    error_id: "ERR_MEETING_OVERLAP | ERR_TRAINING_SLOT_OVERLAP | ERR_VOTING_WINDOW_EXPIRED | ERR_MEETING_DAY_MISMATCH | ERR_INVALID_TIME_RANGE"
    http_status: 409
    applies_to: "POST /center-meetings, POST /group-training-sessions, POST /loan-applications/{id}/votes"

  - priority: 8
    category: business_constraint
    check: "Aggregate/structural rules: group size exactly 5 to schedule training; member streak < 2 to submit; no open application or active loan per member; manager caseload and center caps on assignment; expansion feasibility"
    error_id: "ERR_GROUP_SIZE_INVALID | ERR_GROUP_FULL | ERR_ATTENDANCE_INELIGIBLE | ERR_MEMBER_HAS_OPEN_APPLICATION | ERR_MEMBER_HAS_ACTIVE_LOAN | ERR_MEMBER_NOT_ELIGIBLE | ERR_GROUP_NOT_ACTIVE | ERR_CASELOAD_CAP_EXCEEDED | ERR_EXPANSION_INFEASIBLE | ERR_GROUP_NOT_FORMING | ERR_NOT_CENTER_MANAGER | ERR_ALREADY_RECONCILED | ERR_MEETING_ALREADY_RECONCILED | ERR_ACCOUNT_NOT_EMPTY | ERR_GROUP_HAS_ACTIVE_LOANS"
    http_status: 409
    applies_to: "per-endpoint business rules"

  - priority: 9
    category: business_fiscal
    check: "Fiscal checks LAST: ladder ceiling at disbursement; collection amount >= savings_required + 1 and <= savings_required + principal_outstanding; withdrawal <= withdrawable_cents; reconciliation cash equality"
    error_id: "ERR_LADDER_CEILING_EXCEEDED | ERR_COLLECTION_BELOW_SAVINGS_MINIMUM | ERR_COLLECTION_EXCEEDS_OUTSTANDING | ERR_WITHDRAWAL_EXCEEDS_AVAILABLE | ERR_RECONCILIATION_MISMATCH"
    http_status: 422
    applies_to: "disburse, collections, withdrawals, reconcile"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Test-driving clock (logical time; sweeps) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time. After moving, runs the delinquency sweep (delinquency_evaluation) and the voting-expiry sweep."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, loans_delinquent: integer, loans_defaulted: integer, applications_expired: integer }"
    side_effects: ["delinquency_evaluation sweep", "VOTING applications with now >= voting_deadline -> EXPIRED", "all cascade side effects of resulting transitions"]

  # --- Branches ---
  - method: POST
    path: "/branches"
    description: "Create a branch (tier computed SMALL, counts 0)"
    roles: [ProgramAdmin]
    code: 201
    input: [name]
    output: Branch
    side_effects: []

  - method: GET
    path: "/branches/{id}"
    description: "Get a branch"
    roles: [ProgramAdmin, BranchManager, CenterManager, FieldOfficer, Member]
    code: 200
    input: []
    output: Branch
    side_effects: []

  - method: GET
    path: "/branches/{id}/center-managers"
    description: "List center managers of a branch"
    roles: [ProgramAdmin, BranchManager, CenterManager, FieldOfficer, Member]
    code: 200
    input: []
    output: "CenterManager[]"
    side_effects: []

  - method: GET
    path: "/branches/{id}/expansion-plans"
    description: "List expansion plans of a branch"
    roles: [ProgramAdmin, BranchManager, CenterManager, FieldOfficer, Member]
    code: 200
    input: []
    output: "BranchExpansionPlan[]"
    side_effects: []

  - method: POST
    path: "/branches/{id}/expansion-plans"
    description: "Submit an expansion plan; feasibility computed at creation (expansion_feasibility); created directly in SUBMITTED"
    roles: [BranchManager]
    code: 201
    input: [new_centers, new_managers_hired, target_new_members]
    output: BranchExpansionPlan
    side_effects: ["feasibility block computed", "status SUBMITTED"]

  - method: POST
    path: "/expansion-plans/{id}/decide"
    description: "Approve or reject a SUBMITTED expansion plan"
    roles: [ProgramAdmin]
    code: 200
    input: [decision]
    output: BranchExpansionPlan
    side_effects: ["status -> APPROVED | REJECTED"]

  # --- Center managers ---
  - method: POST
    path: "/center-managers"
    description: "Hire a center manager into a branch"
    roles: [ProgramAdmin]
    code: 201
    input: [branch_id, full_name, hired_on]
    output: CenterManager
    side_effects: []

  - method: GET
    path: "/center-managers/{id}"
    description: "Get a center manager (includes computed caseload and caps)"
    roles: [ProgramAdmin, BranchManager, CenterManager, FieldOfficer, Member]
    code: 200
    input: []
    output: CenterManager
    side_effects: []

  # --- Centers ---
  - method: POST
