      - name: custom_rule_constants_applied
        claim_type: constants_applied
        grounds:
          - "calculations.dormancy_determination"
          - "entities.DormancyRule.fields.dormancy_years"
          - "entities.DormancyRule.fields.dd_threshold_cents"
        distinguishing_aspect: "A rule with non-default constants (5 years, 25000c threshold) drives both the dormancy anniversary (2025-06-01 stays ACTIVE; 2025-06-02 flips) and the letter-applicability gate (20000c < 25000c rejected)."
        test_recipe:
