# =============================================================================
# Task 1193 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Enumerative breadth walk of SCAFFOLD.yaml §1.1–§1.7 per claim-extraction-guide.
# §1.8-covered corners appear as excluded_because stubs.
# All chains replay from empty-DB using only §1.5 endpoints; all formula literals
# were computed by executing the §1.3 formulas.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_order_success_and_defaults
        claim_type: creation
        grounds: ["entities.CustomerOrder", "endpoints[POST /mill/customer-orders]"]
        distinguishing_aspect: "Create with all required fields returns 201; system defaults applied: status DRAFT, subtotal_cents 0, com_credit_cents 0, total_cents 0, quality_result NONE, version 1."
        test_recipe:
          setup: ["Dealer DLR-001 exists and is ACTIVE"]
          setup_api_calls:
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
          trigger:
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-2001", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
          assert:
            - "201; CustomerOrder.${order_id}.status == DRAFT, quality_result == NONE, subtotal_cents == 0, total_cents == 0, version == 1"
            - "Response envelope has meta.api_request_id, meta.api_request_timestamp, response_type == 'object'"

      - name: list_orders_pagination_fields
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /mill/customer-orders]"]
        distinguishing_aspect: "limit/offset paginate: with 2 orders, limit 1 returns total_count 2 and has_more true; offset 1 returns the second order and has_more false."
        test_recipe:
          setup: ["Dealer DLR-001; two orders ORD-P1 and ORD-P2"]
          setup_api_calls:
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-P1", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-P2", dealer_id: "${dealer_id}", ship_to_state: "SC", delivery_method: "WHITE_GLOVE" }
              as: SalesRep
          trigger:
            - call: "GET /mill/customer-orders?limit=1&offset=0"
              as: SalesRep
            - call: "GET /mill/customer-orders?limit=1&offset=1"
              as: SalesRep
          assert:
            - "First page: response_type == 'array', total_count == 2, has_more == true, exactly 1 data row"
            - "Second page: has_more == false, exactly 1 data row"
            - "Filtered list GET /mill/customer-orders?dealer_id=${dealer_id} returns both orders"

      - name: get_order_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /mill/customer-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "404; data.error_id == ERR_ORDER_NOT_FOUND; envelope response_type == 'error'"

      - name: create_order_missing_required_dealer_id_returns_invalid_request
        claim_type: required_fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "entities.CustomerOrder.fields.dealer_id"]
        distinguishing_aspect: "Omitting required field dealer_id → 400 ERR_INVALID_REQUEST (priority 3, before any existence check)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-X", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "400; data.error_id == ERR_INVALID_REQUEST"

      - name: line_create_unit_price_input_ignored
        claim_type: computed_fields
        grounds: ["entities.OrderLine.fields.unit_price_cents", "calculations.order_pricing"]
        distinguishing_aspect: "unit_price_cents is computed: a client-supplied unit_price_cents of 1 is ignored; the response carries the computed 11302 (round_half_up(10002 × 1.13))."
        test_recipe:
          setup: ["Model M-PRICE (base 10002, rule (C, WALNUT, allowed, 0.13)), spec FAB-C, dealer, DRAFT order ORD-CI"]
          setup_api_calls:
            - call: "POST /mill/product-models"
              payload: { model_code: "M-PRICE", category: "CHAIR", base_fabric_yards: 2.0, base_price_cents: 10002, requires_pattern_match: false, flammability_standard: "TB133", required_component_codes: [], option_rules: [{ fabric_grade: "C", finish_code: "WALNUT", allowed: true, surcharge_pct: 0.13, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-C", origin: "PLANT", grade: "C", nominal_width_inches: 54.0, price_per_yard_cents: 4000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-CI", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "WALNUT", quantity: 2, unit_price_cents: 1 }
              as: SalesRep
              captures: { line_id: $.data.id }
          assert:
            - "201; OrderLine.${line_id}.unit_price_cents == 11302 (computed), NOT 1"
            - "OrderLine.${line_id}.matched_surcharge_pct == 0.13 and line_total_cents == 22604"

      - name: fk_line_create_with_unknown_order_returns_not_found
        claim_type: parent_relationships
        grounds: ["entities.OrderLine.fields.order_id", "errors[ERR_ORDER_NOT_FOUND]", "errors[ERR_PRODUCT_MODEL_NOT_FOUND]"]
        distinguishing_aspect: "Line create with a non-existent order_id → 404 ERR_ORDER_NOT_FOUND; with a non-existent model_id → 404 ERR_PRODUCT_MODEL_NOT_FOUND (FK integrity on a flat topology)."
        test_recipe:
          setup: ["One model M-NP exists"]
          setup_api_calls:
            - call: "POST /mill/product-models"
              payload: { model_code: "M-NP", category: "CHAIR", base_fabric_yards: 3.0, base_price_cents: 50000, requires_pattern_match: false, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "A", finish_code: "ANY", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-A", origin: "PLANT", grade: "A", nominal_width_inches: 54.0, price_per_yard_cents: 3000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
          trigger:
            - call: "POST /mill/order-lines"
              payload: { order_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 1 }
              as: SalesRep
              captures: { err1: $.data.error_id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", model_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 1 }
              as: SalesRep
              captures: { err2: $.data.error_id }
          assert:
            - "First call: 404 ERR_ORDER_NOT_FOUND (order_id validated first)"
            - "Second call: 404 ERR_ORDER_NOT_FOUND (order validated left-to-right before model)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: initial_states_on_create
        claim_type: initial_state
        grounds: ["state_machines.CustomerOrder", "state_machines.MaterialLot", "state_machines.CellBooking", "state_machines.ComplianceCertificate", "state_machines.SupplyRequisition", "state_machines.ShowroomSample", "state_machines.Shipment", "state_machines.CutPlan", "state_machines.OrderLine"]
        distinguishing_aspect: "Every stateful entity lands in its declared initial_state at creation: order DRAFT, line PENDING, lot EXPECTED, cell ACTIVE, certificate DRAFT, requisition OPEN (after confirm), sample ON_LOAN, shipment DRAFT."
        test_recipe:
          setup: ["Minimal graph: model, spec, dealer, order, line, expected lot, cell, certificate, sample"]
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/product-models"
              payload: { model_code: "M-NP", category: "CHAIR", base_fabric_yards: 3.0, base_price_cents: 50000, requires_pattern_match: false, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "A", finish_code: "ANY", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-A", origin: "PLANT", grade: "A", nominal_width_inches: 54.0, price_per_yard_cents: 3000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 100000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-INIT", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 1 }
              as: SalesRep
              captures: { line_id: $.data.id }
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 10.0 }
              as: MaterialReceiver
              captures: { lot_id: $.data.id }
            - call: "POST /mill/cells"
              payload: { cell_code: "C-CUT", cell_type: "CUTTING", capacity_slots: 1, certifications: [] }
              as: ProductionPlanner
              captures: { cell_id: $.data.id }
            - call: "POST /mill/compliance-certificates"
              payload: { order_id: "${order_id}", standard: "TB117_2013", label_lot_number: "LBL-1", label_count: 1 }
              as: ComplianceOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /mill/showroom-samples"
              payload: { dealer_id: "${dealer_id}", model_id: "${model_id}", unit_serial: "UNIT-1", sample_value_cents: 10000, due_back_days: 30 }
              as: SalesRep
              captures: { sample_id: $.data.id }
          trigger:
            - call: "GET /mill/customer-orders/${order_id}"
              as: SalesRep
              captures: { ord_status: $.data.status }
            - call: "GET /mill/order-lines/${line_id}"
              as: SalesRep
              captures: { line_status: $.data.status }
            - call: "GET /mill/material-lots/${lot_id}"
              as: MaterialReceiver
              captures: { lot_status: $.data.status, lot_owner: $.data.ownership }
            - call: "GET /mill/cells/${cell_id}"
              as: ProductionPlanner
              captures: { cell_status: $.data.status, cell_hours: $.data.committed_hours }
            - call: "GET /mill/compliance-certificates/${cert_id}"
              as: ComplianceOfficer
              captures: { cert_status: $.data.status }
            - call: "GET /mill/showroom-samples/${sample_id}"
              as: SalesRep
              captures: { samp_disp: $.data.disposition, samp_due: $.data.due_back_at }
          assert:
            - "ord_status == DRAFT and line_status == PENDING"
            - "lot_status == EXPECTED and lot_owner == PLANT (copied from spec.origin)"
            - "cell_status == ACTIVE and cell_hours == 0.0"
            - "cert_status == DRAFT"
            - "samp_disp == ON_LOAN and samp_due == 2026-06-09T00:00:00Z (loaned at 2026-05-10T00:00:00Z logical clock + 30 days)"
            - "DealerAccount.${dealer_id}.outstanding_sample_value_cents == 10000 after the sample create"

      - name: lot_invalid_transitions_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.MaterialLot", "errors[ERR_LOT_INVALID_STATE]"]
        distinguishing_aspect: "receive is only legal from EXPECTED (second receive on RECEIVED lot fails); inspect is only legal from RECEIVED (inspect on EXPECTED lot fails)."
        test_recipe:
          setup: ["Spec FAB-A; lot L1 EXPECTED; lot L2 received 10.0 (now RECEIVED)"]
          setup_api_calls:
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-A", origin: "PLANT", grade: "A", nominal_width_inches: 54.0, price_per_yard_cents: 3000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 10.0 }
              as: MaterialReceiver
              captures: { lot1: $.data.id }
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 10.0 }
              as: MaterialReceiver
              captures: { lot2: $.data.id }
            - call: "POST /mill/material-lots/${lot2}/receive"
              payload: { received_yards: 10.0 }
              as: MaterialReceiver
          trigger:
            - call: "POST /mill/material-lots/${lot1}/inspect"
              payload: { result: "PASS", usable_yards: 10.0, rejected_yards: 0.0, measured_width_inches: 54.0 }
              as: QualityInspector
              captures: { err1: $.data.error_id }
            - call: "POST /mill/material-lots/${lot2}/receive"
              payload: { received_yards: 5.0 }
              as: MaterialReceiver
              captures: { err2: $.data.error_id }
          assert:
            - "Inspect on EXPECTED lot: 409 ERR_LOT_INVALID_STATE"
            - "Second receive on RECEIVED lot: 409 ERR_LOT_INVALID_STATE"

      - name: lot_receiving_and_inspection_guards
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_OVER_RECEIPT]", "errors[ERR_INSPECTION_YARDAGE_MISMATCH]", "state_machines.MaterialLot.EXPECTED_to_RECEIVED"]
        distinguishing_aspect: "Over-receipt cap is INCLUSIVE at 110% (11.0 of expected 10.0 accepted, 11.001 rejected); inspection conservation usable + rejected must equal received exactly (7+2 of 10 rejected, 7+3 accepted)."
        test_recipe:
          setup: ["Spec FAB-A; lot L1 (expected 10.0); lot L2 (expected 10.0); lot L3 received 10.0"]
          setup_api_calls:
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-A", origin: "PLANT", grade: "A", nominal_width_inches: 54.0, price_per_yard_cents: 3000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 10.0 }
              as: MaterialReceiver
              captures: { lot1: $.data.id }
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 10.0 }
              as: MaterialReceiver
              captures: { lot2: $.data.id }
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 10.0 }
              as: MaterialReceiver
              captures: { lot3: $.data.id }
            - call: "POST /mill/material-lots/${lot3}/receive"
              payload: { received_yards: 10.0 }
              as: MaterialReceiver
          trigger:
            - call: "POST /mill/material-lots/${lot1}/receive"
              payload: { received_yards: 11.0 }
              as: MaterialReceiver
            - call: "POST /mill/material-lots/${lot2}/receive"
              payload: { received_yards: 11.001 }
              as: MaterialReceiver
              captures: { err_over: $.data.error_id }
            - call: "POST /mill/material-lots/${lot3}/inspect"
              payload: { result: "PASS", usable_yards: 7.0, rejected_yards: 2.0, measured_width_inches: 54.0 }
              as: QualityInspector
              captures: { err_cons: $.data.error_id }
            - call: "POST /mill/material-lots/${lot3}/inspect"
              payload: { result: "PASS", usable_yards: 7.0, rejected_yards: 3.0, measured_width_inches: 54.0 }
              as: QualityInspector
          assert:
            - "L1 receive of 11.0 (= 110% of expected) succeeds → status RECEIVED (boundary inclusive)"
            - "L2 receive of 11.001: 422 ERR_OVER_RECEIPT"
            - "L3 inspect 7.0 + 2.0 != 10.0: 422 ERR_INSPECTION_YARDAGE_MISMATCH"
            - "L3 inspect 7.0 + 3.0 == 10.0: 200, status AVAILABLE, usable_yards 7.0, measured_width_inches 54.0"

      - name: cancel_cancelled_order_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.CustomerOrder", "errors[ERR_ORDER_NOT_CANCELLABLE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel is rejected with ERR_ORDER_NOT_CANCELLABLE and no side effects fire twice (allocations stay RELEASED)."
        test_recipe:
          setup: ["Dealer; order ORD-C1 with no lines; cancelled once"]
          setup_api_calls:
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-C1", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/customer-orders/${order_id}/cancel"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /mill/customer-orders/${order_id}/cancel"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "409 ERR_ORDER_NOT_CANCELLABLE; order remains CANCELLED, version increments only on the first cancel"

      - name: booking_invalid_transitions_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.CellBooking", "errors[ERR_BOOKING_INVALID_STATE]"]
        distinguishing_aspect: "complete requires IN_PROGRESS (complete on a BOOKED booking fails); release requires BOOKED (release on an IN_PROGRESS booking fails)."
        test_recipe:
          setup: ["Confirmed order with ALLOCATED line (lot 30.0); CUTTING cell; two bookings B1, B2; B2 started"]
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/product-models"
              payload: { model_code: "M-NP", category: "CHAIR", base_fabric_yards: 3.0, base_price_cents: 50000, requires_pattern_match: false, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "A", finish_code: "ESPRESSO", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-A", origin: "PLANT", grade: "A", nominal_width_inches: 54.0, price_per_yard_cents: 3000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 30.0 }
              as: MaterialReceiver
              captures: { lot_id: $.data.id }
            - call: "POST /mill/material-lots/${lot_id}/receive"
              payload: { received_yards: 30.0 }
              as: MaterialReceiver
            - call: "POST /mill/material-lots/${lot_id}/inspect"
              payload: { result: "PASS", usable_yards: 30.0, rejected_yards: 0.0, measured_width_inches: 54.0 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-BI", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 1 }
              as: SalesRep
              captures: { line_id: $.data.id }
            - call: "POST /mill/customer-orders/${order_id}/confirm"
              payload: {}
              as: SalesRep
            - call: "POST /mill/cells"
              payload: { cell_code: "C-CUT", cell_type: "CUTTING", capacity_slots: 1, certifications: [] }
              as: ProductionPlanner
              captures: { cell_id: $.data.id }
            - call: "POST /mill/cell-bookings"
              payload: { cell_id: "${cell_id}", order_line_id: "${line_id}", operation: "CUT", start_at: "2026-06-01T08:00:00Z", end_at: "2026-06-01T09:00:00Z" }
              as: ProductionPlanner
              captures: { b1: $.data.id }
            - call: "POST /mill/cell-bookings"
              payload: { cell_id: "${cell_id}", order_line_id: "${line_id}", operation: "CUT", start_at: "2026-06-01T09:00:00Z", end_at: "2026-06-01T10:00:00Z" }
              as: ProductionPlanner
              captures: { b2: $.data.id }
            - call: "POST /mill/cell-bookings/${b2}/start"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /mill/cell-bookings/${b1}/complete"
              payload: {}
              as: ProductionPlanner
              captures: { err1: $.data.error_id }
            - call: "POST /mill/cell-bookings/${b2}/release"
              payload: {}
              as: ProductionPlanner
              captures: { err2: $.data.error_id }
          assert:
            - "Complete on BOOKED booking: 409 ERR_BOOKING_INVALID_STATE"
            - "Release on IN_PROGRESS booking: 409 ERR_BOOKING_INVALID_STATE"

      - name: sample_and_requisition_double_action_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.ShowroomSample", "state_machines.SupplyRequisition", "errors[ERR_SAMPLE_NOT_ON_LOAN]", "errors[ERR_REQUISITION_INVALID_STATE]"]
