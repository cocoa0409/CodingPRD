            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "PAR-CROIS", name: "Par-baked Croissant", production_method: "PAR_BAKED", units_per_rack: 40, proof_minutes: 0, bake_minutes: 20, cool_minutes: 15, base_labor_minutes_per_rack: 10, setup_labor_minutes: 15, unit_retail_cents: 150, shelf_life_hours: 10, allergen_tags: ["WHEAT"], recipe_lines: [{ ingredient_id: "${flour_id}", units_per_rack: 30 }] }
              as: RegionalAdmin
