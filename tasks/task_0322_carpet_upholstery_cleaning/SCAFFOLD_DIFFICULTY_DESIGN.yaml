      - name: overlap_buffer_adjacency_on_crew
        grounds:
          - validations[priority=10]
          - entities.Crew.fields.turnaround_buffer_minutes
          - state_machines.CleaningJob.QUOTED_to_BOOKED
        distinguishing_aspect: |
          Buffer-expanded interval semantics on a different crew: Rig-BUF buffer
          30 holds [600,720); a [740,800) request does NOT touch the body but
          starts inside the 30-min turnaround tail (740 < 720+30=750) and is
          rejected ERR_SLOT_OVERLAP. Different interval arithmetic (buffer
          expansion) than instance 1's pure body intersection.
        test_recipe:
          setup:
            - "Crew Rig-BUF buffer 30 holds a RESERVED slot [600,720) from job ONE; job TWO is QUOTED and requests [740,800), which lands inside the buffer tail"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Overlap Buf", email: "obf@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Rig-BUF", supported_service_type: "STEAM", turnaround_buffer_minutes: 30 }
              as: Dispatcher
              captures: { crew_id: $.data.id, crew_v: $.data.version }
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_one: $.data.id }
            - call: "POST /cleaning-jobs/${job_one}/rooms"
              payload: { area_label: "Rm1", area_sqft: 100, soiling_level: "LIGHT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_one}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_one}/book"
              payload: { crew_id: "${crew_id}", start_minute: 600, end_minute: 720, expected_crew_version: "${crew_v}" }
              as: Dispatcher
            - call: "POST /cleaning-jobs"
              payload: { customer_id: "${cust_id}", service_catalog_id: "${cat_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_two: $.data.id }
            - call: "POST /cleaning-jobs/${job_two}/rooms"
              payload: { area_label: "Rm2", area_sqft: 100, soiling_level: "LIGHT" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /cleaning-jobs/${job_two}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /crews/${crew_id}"
              payload: {}
              as: Dispatcher
              captures: { crew_v2: $.data.version }
          trigger:
            - call: "POST /cleaning-jobs/${job_two}/book"
              payload: { crew_id: "${crew_id}", start_minute: 740, end_minute: 800, expected_crew_version: "${crew_v2}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SLOT_OVERLAP"
            - "http_status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invariant_wallet_credit_conserved_on_invoice_then_void
        grounds:
          - state_machines.Invoice.OPEN_to_VOID
          - state_machines.CleaningJob.UNBILLED_to_INVOICED
          - calculations.invoice_wallet_application
          - calculations.wallet_credit_balance
          - entities.WalletLedgerEntry.fields.delta_cents
        distinguishing_aspect: |
          Conserved quantity = customer.wallet_credit_cents (sum of ledger
          delta_cents). Forward action: invoice issuance debits 2000
          (INVOICE_APPLIED, balance 2000->0). Compensating action: invoice void
          credits +2000 (INVOICE_REFUND, balance 0->2000). Net change zero —
          balance returns to exactly 2000.
        test_recipe:
          setup:
            - "Customer holds exactly 2000 wallet credit from a prior GRANTED claim; a second COMPLETED job settled 5000 is INVOICED (wallet applied 2000, balance now 0), no payments"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Wallet Inv", email: "wi@x.com" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /service-catalogs"
              payload: { service_type: "STEAM", base_rate_cents_per_sqft: 50, stain_addon_cents: 2500, pet_addon_cents: 1800, protectant_cents_per_sqft: 12, move_furniture_flat_cents: 3000, dry_time_minutes: 240 }
              as: ServiceManager
              captures: { cat_id: $.data.id }
            - call: "POST /crews"
