            - { call: "POST /vendor-office/cases", payload: { case_number: "C-1001", or_room_id: "${room_id}", procedure_type: "TOTAL_KNEE", surgeon_name: "Dr. A", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-03T12:00:00Z" }, as: ORScheduler, captures: { case_id: $.data.id } }
            - { call: "POST /vendor-office/access-passes", payload: { rep_id: "${rep_id}", case_id: "${case_id}" }, as: VendorRep, as_user_id: "${rep_id}", captures: { p1_id: $.data.id } }
            - { call: "POST /vendor-office/access-passes", payload: { rep_id: "${rep_id}", case_id: "${case_id}" }, as: VendorCoordinator, captures: { p2_id: $.data.id } }
            - { call: "POST /vendor-office/access-passes/${p1_id}/decide", payload: { decision: "APPROVE" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/access-passes/${p2_id}/decide", payload: { decision: "APPROVE" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:29:00Z" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/access-passes/${p1_id}/admit", as: ORCirculatorNurse }
          trigger:
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:30:00Z" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/access-passes/${p2_id}/admit", as: ORCirculatorNurse, captures: { err: $.data.error_id } }
          assert:
            - "Admit of p1 at 2026-08-03T12:29:00Z succeeded (12:29 < 12:30 window end): status ADMITTED"
            - "After clock set to exactly 12:30:00Z: p2 (APPROVED) swept to EXPIRED and p1 (ADMITTED) swept to EXITED (now >= window_end_at)"
            - "Admit of p2 at 12:30 rejected: ${err} == ERR_PASS_INVALID_STATE (window end is exclusive)"

  - rule_id: cross_entity_state_dependency
