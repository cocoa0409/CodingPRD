              payload: { full_name: "Nick Strike", employee_number: "E-C-350", home_country_code: "US", home_state_code: "CA", hire_date: "2020-01-06", birth_date: "1991-11-11" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /grants"
              payload: { plan_id: "${plan_id}", participant_id: "${p_id}", award_type: "NSO", target_shares: 1000, exercise_price_cents: 2500 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { g_id: $.data.id }
            - call: "POST /grants/${g_id}/vesting-tranches"
              payload: { tranche_index: 1, vest_type: "TIME", scheduled_vest_date: "2027-01-05", target_shares: 1000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /grants/${g_id}/submit"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /grants/${g_id}/request-changes"
              payload: { change_note: "reduce the award size" }
              as: BoardMember
              as_user_id: "board-1"
