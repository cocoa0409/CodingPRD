              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /sweeps/run"
              payload: {}
              as: ProgramAdmin
              captures: { del_ids: $.data.delinquent_establishment_ids }
            - call: "GET /establishments/${est_id}"
              as: ProgramAdmin
          assert:
            - "sweep response delinquent_establishment_ids contains ${est_id}"
            - "Establishment.${est_id}.pumping_overdue == true (2027-01-02 > 2026-01-01 + 365d = 2027-01-01)"
