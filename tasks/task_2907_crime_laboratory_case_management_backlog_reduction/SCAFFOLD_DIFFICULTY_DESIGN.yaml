      - name: technical_disagreement_probation_releases_p1_assignment_on_a_different_case
        grounds:
          - state_machines.ExaminationRequest.TECH_REVIEW_to_DISAGREEMENT
          - state_machines.Analyst.QUALIFIED_to_PROBATION
          - state_machines.Assignment.ACTIVE_to_RELEASED
          - state_machines.Case.IN_PROGRESS_to_AWAITING_ASSIGNMENT
          - validations[priority=20]
          - entities.Nonconformance.fields.source
          - entities.ReviewRecord.fields.decision
        distinguishing_aspect: |
          A four-hop chain fired by one review DECISION (not a counter) that crosses an aggregate
          boundary: the DISAGREE on case CP3's request mints a MAJOR nonconformance, which puts
          the examiner on PROBATION, and PROBATION_RELEASE then reaches a DIFFERENT case CP1 and
          releases only its P1_STATUTORY assignment - the already-COMPLETED assignment on CP3
          is untouched, so the release is filtered by Case.priority_class, not by request.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z for the whole chain."
            - "Analyst A1 (CHEMISTRY, competency 4, capacity 40.00, training 8.00) is the examiner on both cases; Analyst A2 (same profile) is the technical reviewer."
            - "Method M1 VALIDATED, standard_hours_per_item 2.00."
            - "Case CP3 (DRUG_OFFENSE, no deadline) -> P3_ROUTINE; its request RP3 (item_count 3, estimated_hours 6.00) has been assigned to A1, analysed and now sits in TECH_REVIEW with its Assignment COMPLETED."
            - "Case CP1 (HOMICIDE, suspect_in_custody true, statutory_deadline_utc 2026-08-20T00:00:00Z) -> priority_score 82.50, priority_class P1_STATUTORY; its request RP1 (item_count 2, estimated_hours 4.00) is ASSIGNED to A1 with an ACTIVE Assignment, so CP1 is IN_PROGRESS and A1.assigned_casework_hours == 4.00."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
