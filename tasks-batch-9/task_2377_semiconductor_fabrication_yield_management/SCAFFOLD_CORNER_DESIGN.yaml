          - state_machines.Operator.STREET_to_GOWNED
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "Operator carries two independent state dimensions: the gown dimension cycles STREET -> GOWNED -> STREET -> GOWNED without ever changing cert_status, and the subsequent cert suspension leaves gown_state GOWNED untouched, so the combined state is (SUSPENDED, GOWNED)."
        test_recipe:
          setup:
            - "Operator OP-001 certified for LITHO/ETCH/CMP, initially (ACTIVE, STREET), then cycled GOWNED -> STREET -> GOWNED by the operator while cert_status stays ACTIVE."
