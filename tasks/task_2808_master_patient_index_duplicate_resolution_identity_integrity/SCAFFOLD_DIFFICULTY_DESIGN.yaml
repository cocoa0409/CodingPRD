# SCAFFOLD_DIFFICULTY_DESIGN.yaml
# Task 2808 - Master Patient Index Duplicate Resolution & Identity Integrity
# SKILL.md §1.8 test-targeting index. Nine §0.5 rule_ids, 19 instances total.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7; every ${var} is bound by
# an earlier captures: block in the same instance; every formula-derived assert
# literal was computed by executing the §1.3 formulas as code.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: strict_vs_tolerant_null_credit_flips_pair_classification
        grounds:
          - calculations.pair_match_score
          - calculations.pair_triage_effective_score
          - entities.DuplicateCandidatePair.fields.score_variant
          - entities.DuplicateCandidatePair.fields.attribute_score_breakdown
          - concurrency_rules[rescore-stale-pair-version]
        distinguishing_aspect: |
          The STRICT and TOLERANT variants of calculations.pair_match_score differ ONLY in
          what a null-on-either-side attribute contributes (0.00 versus
          round(weight * NULL_CREDIT_FRACTION, 2)); on the same two PatientRecord rows this
          moves match_score from 67.50 to 72.50, a delta of exactly 5.00, which crosses
          RS-BASE.review_threshold (70.00) and therefore flips classification from
          NON_DUPLICATE to POTENTIAL_DUPLICATE and priority_band from P3 to P2.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-DV."
            - "One DRAFT MatchRuleSet RS-BASE: the seven weights sum to exactly 100.00, auto_link_threshold 85.00, review_threshold 70.00, conflict_penalty_points 12.00."
            - "Two ACTIVE PatientRecord rows at SITE-DV that agree exactly on dob and sex, agree case-insensitively on last_name, agree only on the first PREFIX_COMPARE_CHARS characters of first_name and postal_code, and where record B has ssn_last4 and phone absent (so exactly two attributes are null-on-one-side)."
            - "No biometric_template_hash and no insurance_member_id on either record, so conflict_flags is empty and match_score == raw_score."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-DV", name: "Dual Variant Clinic", region_code: "US-CA", registrar_headcount: 4 }
              as: MpiAdmin
              captures: { site_dv_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Baseline Match Rules", version_label: "V-BASE-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_dv_id}", mrn: "DV-1001", last_name: "Nguyen", first_name: "Anhthu", dob: "1984-03-11", sex: "F", ssn_last4: "4417", postal_code: "94110", phone: "4155550101", clinical_element_count: 6 }
              as: IdentityAnalyst
              captures: { rec_a_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_dv_id}", mrn: "DV-1002", last_name: "nguyen", first_name: "Anh", dob: "1984-03-11", sex: "F", postal_code: "94112", clinical_element_count: 3 }
              as: IdentityAnalyst
              captures: { rec_b_id: $.data.id }
          trigger:
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_a_id}", record_b_id: "${rec_b_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_id: $.data.id, pair_v1: $.data.version }
            - call: "POST /mpi/candidate-pairs/${pair_id}/rescore"
              payload: { rule_set_id: "${rs_base_id}", score_variant: "TOLERANT", expected_pair_version: "${pair_v1}" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
          assert:
            - "STRICT response: DuplicateCandidatePair.${pair_id}.raw_score == 67.50"
            - "STRICT response: DuplicateCandidatePair.${pair_id}.match_score == 67.50"
            - "STRICT response: DuplicateCandidatePair.${pair_id}.attribute_score_breakdown == {last_name: 25.00, first_name: 7.50, dob: 25.00, ssn_last4: 0.00, sex: 5.00, postal_code: 5.00, phone: 0.00}"
            - "STRICT response: DuplicateCandidatePair.${pair_id}.conflict_flags == []"
            - "STRICT response: DuplicateCandidatePair.${pair_id}.classification == NON_DUPLICATE"
            - "STRICT response: DuplicateCandidatePair.${pair_id}.base_band == P3 and priority_band == P3 and effective_score == 67.50"
            - "STRICT response: DuplicateCandidatePair.${pair_id}.queue_state == NEW"
            - "STRICT response: DuplicateCandidatePair.${pair_id}.subject_record_mrn == \"DV-1002\" and detected_at_site_id == ${site_dv_id}"
            - "TOLERANT rescore response: DuplicateCandidatePair.${pair_id}.raw_score == 72.50"
            - "TOLERANT rescore response: DuplicateCandidatePair.${pair_id}.match_score == 72.50"
            - "TOLERANT rescore response: DuplicateCandidatePair.${pair_id}.attribute_score_breakdown == {last_name: 25.00, first_name: 7.50, dob: 25.00, ssn_last4: 3.75, sex: 5.00, postal_code: 5.00, phone: 1.25}"
            - "TOLERANT rescore response: DuplicateCandidatePair.${pair_id}.classification == POTENTIAL_DUPLICATE"
            - "TOLERANT rescore response: DuplicateCandidatePair.${pair_id}.base_band == P2 and priority_band == P2 and effective_score == 72.50"
            - "TOLERANT rescore response: DuplicateCandidatePair.${pair_id}.queue_state == NEW (rescore is not a queue transition)"
            - "TOLERANT rescore response: DuplicateCandidatePair.${pair_id}.version == 2"
            - "Variant delta: 72.50 - 67.50 == 5.00, contributed entirely by ssn_last4 (3.75) and phone (1.25)"

      - name: creation_vs_survivor_site_attribution_diverges_on_cross_site_merge
        grounds:
          - calculations.site_duplicate_rate
          - calculations.metric_window_exclusivity
          - entities.SiteDuplicateMetric.fields.attribution_variant
          - entities.SiteDuplicateMetric.fields.duplicate_rate_bps
          - entities.MergeOperation.fields.state
        distinguishing_aspect: |
          calculations.site_duplicate_rate charges one cross-site MergeOperation to the
          SUBSUMED record's site under CREATION_SITE_ATTRIBUTION and to the SURVIVOR
          record's site under SURVIVOR_SITE_ATTRIBUTION, so the identical MergeOperation
          set over the identical closed date window yields duplicate_rate_bps 5000 versus
          0 on SITE-N and 10000 on SITE-S - a different calculation and a different entity
          domain (aggregation over MergeOperation) from the pair-scoring dual variant above.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Two ACTIVE RegistrationSites: SITE-N (the site that created the redundant chart) and SITE-S (the site that owns the retained chart)."
            - "MatchRuleSet RS-BASE created and ACTIVATED, so every SiteDuplicateMetric run can stamp rule_set_version_label."
            - "SITE-N holds two PatientRecord rows created inside the window (N-5001 a decoy, N-5002 the duplicate); SITE-S holds one (S-7001)."
            - "S-7001 and N-5002 agree on all seven scored attributes, so the pair scores 100.00 STRICT with empty conflict_flags, classifies AUTO_LINK and is auto-recommended with recommended_by_user_id null."
            - "One COMPLETED cross-site MergeOperation: survivor S-7001 (SITE-S), subsumed N-5002 (SITE-N). No DownstreamSystem exists, so propagation_task_count is 0 and the merge completes inside the create request."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-N", name: "North Registration", region_code: "US-MW", registrar_headcount: 6 }
              as: MpiAdmin
              captures: { site_n_id: $.data.id }
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-S", name: "South Registration", region_code: "US-MW", registrar_headcount: 3 }
              as: MpiAdmin
              captures: { site_s_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Baseline Match Rules", version_label: "V-BASE-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/match-rule-sets/${rs_base_id}/activate"
              payload: {}
              as: MpiAdmin
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_n_id}", mrn: "N-5001", last_name: "Halvorsen", first_name: "Ingrid", dob: "1957-01-23", sex: "F", ssn_last4: "1010", postal_code: "55401", phone: "6125550111", clinical_element_count: 9 }
              as: IdentityAnalyst
              captures: { rec_n1_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_s_id}", mrn: "S-7001", last_name: "Rasmussen", first_name: "Bjorn", dob: "1962-09-08", sex: "M", ssn_last4: "6633", postal_code: "55414", phone: "6125550222", clinical_element_count: 14 }
              as: IdentityAnalyst
              captures: { rec_s1_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_n_id}", mrn: "N-5002", last_name: "Rasmussen", first_name: "Bjorn", dob: "1962-09-08", sex: "M", ssn_last4: "6633", postal_code: "55414", phone: "6125550222", clinical_element_count: 5 }
              as: IdentityAnalyst
              captures: { rec_n2_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_s1_id}", record_b_id: "${rec_n2_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_cross_id: $.data.id }
            - call: "POST /mpi/merge-operations"
              payload: { pair_id: "${pair_cross_id}", survivor_record_id: "${rec_s1_id}", subsumed_record_id: "${rec_n2_id}", rationale: "Confirmed same patient across sites; retain the South chart." }
              as: IdentityStewardApprover
              as_user_id: "steward-1"
              captures: { merge_cross_id: $.data.id }
          trigger:
            - call: "POST /mpi/registration-sites/${site_n_id}/duplicate-metric-runs"
              payload: { window_start_date: "2026-08-01", window_end_date: "2026-08-31", attribution_variant: "CREATION_SITE_ATTRIBUTION" }
              as: MpiAdmin
              captures: { metric_n_creation_id: $.data.id }
            - call: "POST /mpi/registration-sites/${site_n_id}/duplicate-metric-runs"
              payload: { window_start_date: "2026-08-01", window_end_date: "2026-08-31", attribution_variant: "SURVIVOR_SITE_ATTRIBUTION" }
              as: MpiAdmin
              captures: { metric_n_survivor_id: $.data.id }
            - call: "POST /mpi/registration-sites/${site_s_id}/duplicate-metric-runs"
              payload: { window_start_date: "2026-08-01", window_end_date: "2026-08-31", attribution_variant: "SURVIVOR_SITE_ATTRIBUTION" }
              as: MpiAdmin
              captures: { metric_s_survivor_id: $.data.id }
          assert:
            - "MergeOperation.${merge_cross_id}.state == COMPLETED and propagation_task_count == 0 and moved_clinical_element_count == 5"
            - "SiteDuplicateMetric.${metric_n_creation_id}.records_created == 2"
            - "SiteDuplicateMetric.${metric_n_creation_id}.confirmed_duplicates == 1"
            - "SiteDuplicateMetric.${metric_n_creation_id}.duplicate_rate_bps == 5000"
            - "SiteDuplicateMetric.${metric_n_creation_id}.sample_size_sufficient == false"
            - "SiteDuplicateMetric.${metric_n_creation_id}.rule_set_version_label == \"V-BASE-1\""
            - "SiteDuplicateMetric.${metric_n_survivor_id}.records_created == 2"
            - "SiteDuplicateMetric.${metric_n_survivor_id}.confirmed_duplicates == 0"
            - "SiteDuplicateMetric.${metric_n_survivor_id}.duplicate_rate_bps == 0"
            - "SiteDuplicateMetric.${metric_s_survivor_id}.records_created == 1"
            - "SiteDuplicateMetric.${metric_s_survivor_id}.confirmed_duplicates == 1"
            - "SiteDuplicateMetric.${metric_s_survivor_id}.duplicate_rate_bps == 10000"
            - "Both SITE-N runs cover the identical window 2026-08-01..2026-08-31 and are both accepted with HTTP 201, because calculations.metric_window_exclusivity partitions by attribution_variant"

  - rule_id: combinatorial_formula
    instances:

      - name: pair_match_score_round_then_sum_order_is_pinned
        grounds:
          - calculations.pair_match_score
          - entities.MatchRuleSet.fields.attribute_weights
          - entities.DuplicateCandidatePair.fields.attribute_score_breakdown
          - entities.DuplicateCandidatePair.fields.raw_score
        distinguishing_aspect: |
          calculations.pair_match_score pins the ROUNDING ORDER of a seven-term weighted
          sum: each attribute contribution is rounded to SCORE_PRECISION_DP first and the
          rounded values are then summed. With the RS-ODD weight vector under TOLERANT the
          pinned order yields raw_score 42.51 while the rejected "sum exact then round
          once" order yields 42.49 (exact sum 42.4875), so a 0.02 divergence falsifies any
          implementation that reorders the two steps.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-OD."
            - "One DRAFT MatchRuleSet RS-ODD whose seven weights are deliberately non-round two-decimal values summing to exactly 100.00 (24.99 + 15.01 + 25.05 + 14.95 + 5.05 + 9.95 + 5.00), auto_link_threshold 90.00, review_threshold 70.00, conflict_penalty_points 12.00."
            - "Two ACTIVE PatientRecord rows at SITE-OD chosen so that six of the seven attributes land on a fractional agreement (0.5 partial-prefix on last_name, first_name and postal_code; 0.5 same-year-same-month on dob; a null-on-one-side ssn_last4; a null-on-both-sides phone), producing six half-cent products that each round individually."
            - "sex disagrees outright (M vs F) so that attribute contributes exactly 0.00."
            - "No biometric_template_hash and no insurance_member_id on either record, and ssn_last4 is null on one side, so conflict_flags is empty and match_score == raw_score."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-OD", name: "Odd Weights Clinic", region_code: "US-IL", registrar_headcount: 2 }
              as: MpiAdmin
              captures: { site_od_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Odd Weight Match Rules", version_label: "V-ODD-1", attribute_weights: { last_name: 24.99, first_name: 15.01, dob: 25.05, ssn_last4: 14.95, sex: 5.05, postal_code: 9.95, phone: 5.00 }, auto_link_threshold: 90.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_odd_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_od_id}", mrn: "OD-2001", last_name: "Okonkwo", first_name: "Chidera", dob: "1979-06-14", sex: "F", ssn_last4: "8802", postal_code: "60614", clinical_element_count: 7 }
              as: IdentityAnalyst
              captures: { rec_a2_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_od_id}", mrn: "OD-2002", last_name: "Okoye", first_name: "Chidi", dob: "1979-06-02", sex: "M", postal_code: "60618", clinical_element_count: 2 }
              as: IdentityAnalyst
              captures: { rec_b2_id: $.data.id }
          trigger:
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_a2_id}", record_b_id: "${rec_b2_id}", rule_set_id: "${rs_odd_id}", score_variant: "TOLERANT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_odd_id: $.data.id }
          assert:
            - "DuplicateCandidatePair.${pair_odd_id}.attribute_score_breakdown.last_name == 12.50"
            - "DuplicateCandidatePair.${pair_odd_id}.attribute_score_breakdown.first_name == 7.51"
            - "DuplicateCandidatePair.${pair_odd_id}.attribute_score_breakdown.dob == 12.53"
            - "DuplicateCandidatePair.${pair_odd_id}.attribute_score_breakdown.ssn_last4 == 3.74"
            - "DuplicateCandidatePair.${pair_odd_id}.attribute_score_breakdown.sex == 0.00"
            - "DuplicateCandidatePair.${pair_odd_id}.attribute_score_breakdown.postal_code == 4.98"
            - "DuplicateCandidatePair.${pair_odd_id}.attribute_score_breakdown.phone == 1.25"
            - "DuplicateCandidatePair.${pair_odd_id}.raw_score == 42.51"
            - "DuplicateCandidatePair.${pair_odd_id}.raw_score != 42.49 (the sum-exact-then-round-once order is rejected)"
            - "DuplicateCandidatePair.${pair_odd_id}.conflict_flags == []"
            - "DuplicateCandidatePair.${pair_odd_id}.match_score == 42.51"
            - "DuplicateCandidatePair.${pair_odd_id}.classification == NON_DUPLICATE"
            - "DuplicateCandidatePair.${pair_odd_id}.base_band == P3 and priority_band == P3 and effective_score == 42.51"
            - "sum of the seven attribute_score_breakdown values == 42.51 exactly (breakdown reconciles with raw_score)"

      - name: fraud_risk_score_four_components_with_nested_caps
        grounds:
          - calculations.fraud_risk_score
          - calculations.pair_match_score
          - state_machines.DuplicateCandidatePair.NEW_to_ESCALATED_FRAUD
          - entities.FraudInvestigation.fields.risk_score
          - entities.RegistrationSite.fields.flagged_record_count
        distinguishing_aspect: |
          calculations.fraud_risk_score composes FOUR heterogeneous components drawn from
          three different entities under three nested caps and one floor
          (conflict_component = 30.00 * len(conflict_flags);
          score_component = min(30.00, max(0.00, match_score - review_threshold));
          site_component = min(20.00, 2.00 * flagged_record_count);
          insurance_component gated on INSURANCE_CONFLICT membership; then min(100.00, sum)),
          so a single biometric conflict on an otherwise perfect 100.00 raw_score yields
          exactly 30.00 + 18.00 + 2.00 + 0.00 = 50.00 - a cap-composition problem, not the
          rounding-order problem of the instance above.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-FR with flagged_record_count 0."
            - "One DRAFT MatchRuleSet RS-BASE (weights sum 100.00, auto_link_threshold 85.00, review_threshold 70.00, conflict_penalty_points 12.00)."
            - "Two ACTIVE PatientRecord rows at SITE-FR that agree on all seven scored attributes (raw_score 100.00) but carry DIFFERENT non-null biometric_template_hash values, so conflict_flags == [BIOMETRIC_CONFLICT] and match_score == 100.00 - 12.00 == 88.00."
            - "insurance_member_id is null on both records, so INSURANCE_CONFLICT is absent and insurance_component must be 0.00."
            - "No FraudInvestigation exists before the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-FR", name: "Fraud Screening Clinic", region_code: "US-MA", registrar_headcount: 5 }
              as: MpiAdmin
              captures: { site_fr_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Baseline Match Rules", version_label: "V-BASE-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_fr_id}", mrn: "FR-3001", last_name: "Marchetti", first_name: "Giulia", dob: "1990-11-02", sex: "F", ssn_last4: "5150", postal_code: "02139", phone: "6175550188", biometric_template_hash: "BIO-HASH-AAA", clinical_element_count: 11 }
              as: IdentityAnalyst
              captures: { rec_af_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_fr_id}", mrn: "FR-3002", last_name: "Marchetti", first_name: "Giulia", dob: "1990-11-02", sex: "F", ssn_last4: "5150", postal_code: "02139", phone: "6175550188", biometric_template_hash: "BIO-HASH-BBB", clinical_element_count: 4 }
              as: IdentityAnalyst
              captures: { rec_bf_id: $.data.id }
          trigger:
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_af_id}", record_b_id: "${rec_bf_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_fr_id: $.data.id }
            - call: "GET /mpi/fraud-investigations"
              payload: { record_id: "${rec_bf_id}" }
              as: PrivacyOfficer
              captures: { inv_auto_id: "$.data[0].id", inv_auto_risk: "$.data[0].risk_score" }
          assert:
            - "DuplicateCandidatePair.${pair_fr_id}.raw_score == 100.00"
            - "DuplicateCandidatePair.${pair_fr_id}.conflict_flags == [BIOMETRIC_CONFLICT]"
            - "DuplicateCandidatePair.${pair_fr_id}.match_score == 88.00"
            - "DuplicateCandidatePair.${pair_fr_id}.classification == AUTO_LINK"
            - "DuplicateCandidatePair.${pair_fr_id}.queue_state == ESCALATED_FRAUD (the fraud branch outranks the AUTO_LINK auto-recommend branch)"
            - "DuplicateCandidatePair.${pair_fr_id}.subject_record_mrn == \"FR-3002\""
            - "GET /mpi/fraud-investigations?record_id=${rec_bf_id} returns exactly 1 row"
            - "GET /mpi/fraud-investigations?record_id=${rec_af_id} returns exactly 0 rows (only the subject record is escalated)"
            - "FraudInvestigation.${inv_auto_id}.opened_by == SYSTEM and opened_by_user_id == null"
            - "FraudInvestigation.${inv_auto_id}.trigger_kind == BIOMETRIC_CONFLICT"
            - "FraudInvestigation.${inv_auto_id}.state == OPEN and pair_id == ${pair_fr_id}"
            - "FraudInvestigation.${inv_auto_id}.risk_score == 50.00"
            - "Component decomposition of 50.00: conflict_component 30.00 + score_component 18.00 (min(30.00, 88.00 - 70.00)) + site_component 2.00 (min(20.00, 2.00 * 1)) + insurance_component 0.00"
            - "PatientRecord.${rec_bf_id}.integrity_state == FRAUD_SUSPECTED"
            - "PatientRecord.${rec_af_id}.integrity_state == CLEAR"
            - "RegistrationSite.${site_fr_id}.flagged_record_count == 1"

  - rule_id: non_linear_state_machine
    instances:

      - name: pair_queue_recommend_return_recommend_cycle
        grounds:
          - state_machines.DuplicateCandidatePair.UNDER_REVIEW_to_RECOMMENDED_MERGE
          - state_machines.DuplicateCandidatePair.RECOMMENDED_MERGE_to_UNDER_REVIEW
          - entities.DuplicateCandidatePair.fields.recommended_by_user_id
          - validations[priority=35]
        distinguishing_aspect: |
          The DuplicateCandidatePair queue re-enters a state it already left:
          UNDER_REVIEW -> RECOMMENDED_MERGE -> UNDER_REVIEW -> RECOMMENDED_MERGE, and the
          back-edge is destructive - return-to-review NULLS recommended_by_user_id and
          recommendation, so the second pass is authored by a different analyst
          ("analyst-2") while the append-only ReviewEvidence rows survive the loop and keep
          satisfying validations[priority=35]; version advances monotonically to exactly 8
          across the eight writes even though queue_state ends where it had already been.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-CY and one DRAFT MatchRuleSet RS-BASE."
            - "Two ACTIVE PatientRecord rows at SITE-CY scoring 77.50 STRICT (last_name equal case-insensitively, first_name agreeing only on the first three characters, dob and ssn_last4 and sex equal, postal_code and phone null on both), so classification is POTENTIAL_DUPLICATE and queue_state initialises to NEW rather than jumping to RECOMMENDED_MERGE."
            - "No biometric_template_hash and no insurance_member_id on either record, so conflict_flags is empty and no fraud escalation fires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-CY", name: "Cycle Review Clinic", region_code: "US-NY", registrar_headcount: 8 }
              as: MpiAdmin
              captures: { site_cy_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Baseline Match Rules", version_label: "V-BASE-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_cy_id}", mrn: "CY-6001", last_name: "Kowalski", first_name: "Barbara", dob: "1975-05-30", sex: "F", ssn_last4: "9021", clinical_element_count: 12 }
              as: IdentityAnalyst
              captures: { rec_c1_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_cy_id}", mrn: "CY-6002", last_name: "kowalski", first_name: "Barb", dob: "1975-05-30", sex: "F", ssn_last4: "9021", clinical_element_count: 3 }
              as: IdentityAnalyst
              captures: { rec_c2_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_c1_id}", record_b_id: "${rec_c2_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_cy_id: $.data.id }
          trigger:
            - call: "POST /mpi/candidate-pairs/${pair_cy_id}/triage"
              payload: { triage_note: "Same surname and DOB; queueing for manual review." }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /mpi/candidate-pairs/${pair_cy_id}/start-review"
              payload: {}
              as: IdentityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /mpi/candidate-pairs/${pair_cy_id}/evidence"
              payload: { evidence_type: "PHOTO_ID", outcome: "INCONCLUSIVE", weight_points: 1.00, note: "Photo on file is 12 years old." }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { ev_c1_id: $.data.id }
            - call: "POST /mpi/candidate-pairs/${pair_cy_id}/evidence"
              payload: { evidence_type: "PHONE_VERIFICATION", outcome: "INCONCLUSIVE", weight_points: 1.00, note: "Number disconnected." }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { ev_c2_id: $.data.id }
            - call: "POST /mpi/candidate-pairs/${pair_cy_id}/recommend"
              payload: { recommendation: "MERGE" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /mpi/candidate-pairs/${pair_cy_id}/return-to-review"
              payload: { triage_note: "Evidence is inconclusive; obtain a fresh photo ID before recommending." }
              as: IdentityStewardApprover
              as_user_id: "steward-1"
              captures: { pair_after_return_state: $.data.queue_state, pair_after_return_recommender: $.data.recommended_by_user_id }
            - call: "POST /mpi/candidate-pairs/${pair_cy_id}/recommend"
              payload: { recommendation: "MERGE" }
              as: IdentityAnalyst
              as_user_id: "analyst-2"
          assert:
            - "After return-to-review: DuplicateCandidatePair.${pair_cy_id}.queue_state == UNDER_REVIEW"
            - "After return-to-review: DuplicateCandidatePair.${pair_cy_id}.recommended_by_user_id == null and recommendation == null"
            - "After the second recommend: DuplicateCandidatePair.${pair_cy_id}.queue_state == RECOMMENDED_MERGE"
            - "After the second recommend: DuplicateCandidatePair.${pair_cy_id}.recommended_by_user_id == \"analyst-2\""
            - "After the second recommend: DuplicateCandidatePair.${pair_cy_id}.recommendation == MERGE"
            - "After the second recommend: DuplicateCandidatePair.${pair_cy_id}.version == 8"
            - "DuplicateCandidatePair.${pair_cy_id}.match_score == 77.50 and base_band == P2"
            - "DuplicateCandidatePair.${pair_cy_id}.evidence_points == 0.00 and evidence_adjustment == 0.00"
            - "DuplicateCandidatePair.${pair_cy_id}.effective_score == 77.50 and priority_band == P2"
            - "GET /mpi/candidate-pairs/${pair_cy_id}/evidence returns exactly 2 rows (the loop did not delete evidence)"
            - "DuplicateCandidatePair.${pair_cy_id}.approved_by_user_id == null"

      - name: propagation_task_sent_failed_sent_retry_cycle
        grounds:
          - state_machines.PropagationTask.QUEUED_to_SENT
          - state_machines.PropagationTask.SENT_to_FAILED
          - state_machines.PropagationTask.FAILED_to_SENT
          - entities.PropagationTask.fields.attempt_count
          - entities.DownstreamSystem.fields.unacked_task_count
        distinguishing_aspect: |
          PropagationTask cycles SENT -> FAILED -> SENT on a machine dispatch entity (a
          different entity and a different cycle shape from the human review queue above):
          the state returns to a value it already held, but attempt_count is monotonic and
          reaches exactly 2 while last_error_code from the failed attempt is RETAINED across
          the re-send, so the cycle is observably not idempotent.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-PR and one ACTIVE DownstreamSystem EHR-CORE with propagation_mode BATCH, ack_required true and max_concurrent_dispatch 3 (so dispatch capacity never binds)."
            - "One ACTIVE PatientRecord PR-4001 with clinical_element_count 10."
            - "One OverlayCorrection on PR-4001 with affected_clinical_element_count 4 (below CONTAMINATION_REVIEW_ELEMENT_THRESHOLD, so no ContaminationRemediation opens), applied so that exactly one QUEUED PropagationTask with operation_kind OVERLAY_CORRECTION exists for EHR-CORE."
            - "Because EHR-CORE.propagation_mode == BATCH, the task's propagation_deadline_at is created_at + PROPAGATION_DEADLINE_HOURS_BATCH = 2026-08-04T00:00:00Z, comfortably ahead of the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-PR", name: "Propagation Retry Clinic", region_code: "US-TX", registrar_headcount: 3 }
              as: MpiAdmin
              captures: { site_pr_id: $.data.id }
            - call: "POST /mpi/downstream-systems"
              payload: { system_code: "EHR-CORE", name: "Core EHR", propagation_mode: "BATCH", ack_required: true, max_concurrent_dispatch: 3 }
              as: MpiAdmin
              captures: { sys_ehr_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_pr_id}", mrn: "PR-4001", last_name: "Villanueva", first_name: "Rosa", dob: "1968-04-17", sex: "F", ssn_last4: "3311", postal_code: "78701", phone: "5125550133", clinical_element_count: 10 }
              as: IdentityAnalyst
              captures: { rec_pr_id: $.data.id, rec_pr_v0: $.data.version }
            - call: "POST /mpi/overlay-corrections"
              payload: { record_id: "${rec_pr_id}", overlay_type: "DEMOGRAPHIC_OVERWRITE", corrected_field_snapshot: { last_name: "Villanueva-Ortiz" }, affected_clinical_element_count: 4, encounter_from_date: "2026-07-01", encounter_to_date: "2026-07-20", expected_record_version: "${rec_pr_v0}" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { ov_pr_id: $.data.id }
            - call: "POST /mpi/overlay-corrections/${ov_pr_id}/apply"
              payload: {}
              as: IdentityStewardApprover
              as_user_id: "steward-1"
            - call: "GET /mpi/propagation-tasks"
              payload: { overlay_correction_id: "${ov_pr_id}" }
              as: MpiAdmin
              captures: { task_pr_id: "$.data[0].id", task_pr_deadline: "$.data[0].propagation_deadline_at", task_pr_kind: "$.data[0].operation_kind" }
          trigger:
            - call: "POST /mpi/propagation-tasks/${task_pr_id}/send"
              payload: { dispatch_window_start_at: "2026-08-02T09:00:00Z", dispatch_window_end_at: "2026-08-02T10:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/propagation-tasks/${task_pr_id}/fail"
              payload: { last_error_code: "ACK_TIMEOUT" }
              as: MpiAdmin
            - call: "POST /mpi/propagation-tasks/${task_pr_id}/send"
              payload: { dispatch_window_start_at: "2026-08-02T13:00:00Z", dispatch_window_end_at: "2026-08-02T14:00:00Z" }
              as: MpiAdmin
          assert:
            - "PropagationTask.${task_pr_id}.operation_kind == OVERLAY_CORRECTION"
            - "PropagationTask.${task_pr_id}.propagation_deadline_at == \"2026-08-04T00:00:00Z\""
            - "After the first send: PropagationTask.${task_pr_id}.state == SENT and attempt_count == 1 and version == 2"
            - "After the fail: PropagationTask.${task_pr_id}.state == FAILED and attempt_count == 1 and last_error_code == \"ACK_TIMEOUT\" and version == 3"
            - "After the second send: PropagationTask.${task_pr_id}.state == SENT and attempt_count == 2 and version == 4"
            - "After the second send: PropagationTask.${task_pr_id}.last_error_code == \"ACK_TIMEOUT\" (re-send does not clear the recorded failure)"
            - "After the second send: PropagationTask.${task_pr_id}.dispatch_window_start_at == \"2026-08-02T13:00:00Z\" and dispatch_window_end_at == \"2026-08-02T14:00:00Z\""
            - "DownstreamSystem.${sys_ehr_id}.unacked_task_count == 1"
            - "GET /mpi/contamination-remediations?overlay_correction_id=${ov_pr_id} returns exactly 0 rows"

  - rule_id: transitive_cascade
    instances:

      - name: merge_path_compression_repoints_grandchild_to_new_survivor
        grounds:
          - calculations.merge_element_transfer
          - entities.PatientRecord.fields.survivor_record_id
          - entities.PatientRecord.fields.enterprise_id
          - entities.MergeOperation.fields.recompressed_record_mrns
          - entities.PatientRecord.fields.subsumed_member_count
        distinguishing_aspect: |
          The cascade travels TWO hops down the SELF-REFERENTIAL
          PatientRecord.survivor_record_id edge inside a single entity type: merging A-2000
          into A-1000 re-points A-3000 - a grandchild the request never names - from A-2000
          to A-1000, rewrites its enterprise_id to EID-SITE-A-A-1000, records its mrn in
          recompressed_record_mrns, and lifts A-1000.subsumed_member_count to 2.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite with site_code SITE-A, and one DRAFT MatchRuleSet RS-BASE."
            - "Three ACTIVE PatientRecord rows at SITE-A - A-1000 (10 clinical elements), A-2000 (20) and A-3000 (5) - agreeing on all seven scored attributes, so every pair among them scores 100.00 STRICT with empty conflict_flags, classifies AUTO_LINK and is auto-recommended with recommended_by_user_id null (segregation of duties is vacuous)."
            - "A first COMPLETED MergeOperation has already merged A-3000 into A-2000, leaving A-2000 with 25 clinical elements, A-3000 with 0, A-3000.survivor_record_id == A-2000.id and A-3000.enterprise_id == EID-SITE-A-A-2000."
            - "No DownstreamSystem exists, so every merge completes inside its create request and propagation_task_count is 0."
            - "The second pair (A-1000 vs A-2000) is in RECOMMENDED_MERGE and untouched."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-A", name: "Atlas Registration", region_code: "US-MA", registrar_headcount: 7 }
              as: MpiAdmin
              captures: { site_a_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Baseline Match Rules", version_label: "V-BASE-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_a_id}", mrn: "A-1000", last_name: "Fitzgerald", first_name: "Declan", dob: "1981-07-04", sex: "M", ssn_last4: "7788", postal_code: "02108", phone: "6175550144", clinical_element_count: 10 }
              as: IdentityAnalyst
              captures: { rec_ra_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_a_id}", mrn: "A-2000", last_name: "Fitzgerald", first_name: "Declan", dob: "1981-07-04", sex: "M", ssn_last4: "7788", postal_code: "02108", phone: "6175550144", clinical_element_count: 20 }
              as: IdentityAnalyst
              captures: { rec_rb_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_a_id}", mrn: "A-3000", last_name: "Fitzgerald", first_name: "Declan", dob: "1981-07-04", sex: "M", ssn_last4: "7788", postal_code: "02108", phone: "6175550144", clinical_element_count: 5 }
              as: IdentityAnalyst
              captures: { rec_rc_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_rb_id}", record_b_id: "${rec_rc_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_bc_id: $.data.id }
            - call: "POST /mpi/merge-operations"
              payload: { pair_id: "${pair_bc_id}", survivor_record_id: "${rec_rb_id}", subsumed_record_id: "${rec_rc_id}", rationale: "A-3000 duplicates A-2000; retain A-2000." }
              as: IdentityStewardApprover
              as_user_id: "steward-1"
              captures: { merge1_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_ra_id}", record_b_id: "${rec_rb_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_ab_id: $.data.id }
          trigger:
            - call: "POST /mpi/merge-operations"
              payload: { pair_id: "${pair_ab_id}", survivor_record_id: "${rec_ra_id}", subsumed_record_id: "${rec_rb_id}", rationale: "A-2000 duplicates A-1000; collapse the cluster onto A-1000." }
              as: IdentityStewardApprover
              as_user_id: "steward-1"
              captures: { merge2_id: $.data.id }
          assert:
            - "MergeOperation.${merge1_id}.moved_clinical_element_count == 5 and recompressed_record_mrns == []"
            - "MergeOperation.${merge2_id}.moved_clinical_element_count == 25"
            - "MergeOperation.${merge2_id}.subsumed_prior_enterprise_id == \"EID-SITE-A-A-2000\""
            - "MergeOperation.${merge2_id}.recompressed_record_mrns == [\"A-3000\"]"
            - "MergeOperation.${merge2_id}.state == COMPLETED and propagation_task_count == 0"
            - "MergeOperation.${merge2_id}.completed_at == \"2026-08-01T00:00:00Z\" and reversal_deadline_at == \"2026-10-30T00:00:00Z\""
            - "PatientRecord.${rec_ra_id}.clinical_element_count == 35"
            - "PatientRecord.${rec_ra_id}.subsumed_member_count == 2"
            - "PatientRecord.${rec_ra_id}.enterprise_id == \"EID-SITE-A-A-1000\" and identity_state == ACTIVE"
            - "PatientRecord.${rec_rb_id}.clinical_element_count == 0 and identity_state == MERGED_SUBSUMED"
            - "PatientRecord.${rec_rb_id}.survivor_record_id == ${rec_ra_id} and enterprise_id == \"EID-SITE-A-A-1000\""
            - "PatientRecord.${rec_rc_id}.survivor_record_id == ${rec_ra_id} (grandchild re-pointed, never named in the request)"
            - "PatientRecord.${rec_rc_id}.enterprise_id == \"EID-SITE-A-A-1000\" and clinical_element_count == 0"
            - "GET /mpi/patient-records?survivor_record_id=${rec_ra_id} returns exactly 2 rows"
            - "GET /mpi/patient-records?survivor_record_id=${rec_rb_id} returns exactly 0 rows"
            - "RegistrationSite.${site_a_id}.active_record_count == 1"
            - "GET /mpi/contamination-remediations?merge_operation_id=${merge2_id} returns exactly 0 rows (25 is not > CONTAMINATION_REVIEW_ELEMENT_THRESHOLD)"
            - "PatientRecord.${rec_ra_id}.integrity_state == CLEAR"

