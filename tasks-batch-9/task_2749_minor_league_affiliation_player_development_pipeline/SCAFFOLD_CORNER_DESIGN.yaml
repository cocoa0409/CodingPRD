              as: AffiliateOperator
              as_user_id: "${cv_aff}"
              captures: { cv_agr: $.data.id }
            - call: "POST /agreements/${cv_agr}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${cv_aff}"
            - call: "POST /agreements/${cv_agr}/disposition"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
