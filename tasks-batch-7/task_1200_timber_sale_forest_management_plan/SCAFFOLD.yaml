  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not listed for the endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed actor does not own the target resource (landowner tract, buyer bid/contract, contractor assignment)" }
  - { id: ERR_PARTY_NOT_FOUND, http: 404, condition: "Referenced Forester/Landowner/Buyer/Contractor id does not exist" }
  - { id: ERR_TRACT_NOT_FOUND, http: 404, condition: "Tract id does not exist" }
  - { id: ERR_STAND_NOT_FOUND, http: 404, condition: "Stand id does not exist" }
