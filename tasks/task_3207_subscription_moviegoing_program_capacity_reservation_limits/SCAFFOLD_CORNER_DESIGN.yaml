              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/members"
              payload: { email: "rc@x.com", full_name: "RC" }
              as: MemberServices
              captures: { rc_m: $.data.id }
            - call: "POST /cinemas/members/${rc_m}/activate"
              payload: {}
              as: MemberServices
            - call: "POST /cinemas/members/${rc_m}/subscriptions"
              payload: { plan_id: "${rc_plan}" }
              as: MemberServices
              captures: { rc_s: $.data.id }
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /cinemas/subscriptions/${rc_s}/credit-buckets"
              payload: {}
              as: ProgramAdmin
              captures: { rc_w1_roll: "$.data[1].rollover_in", rc_w1_avail: "$.data[1].credits_available" }
          assert:
            - "week 1 rollover_in == 2 (min(3, 2) clamped at cap)"
            - "week 1 credits_available == 5 (3 base + 2 rollover)"

