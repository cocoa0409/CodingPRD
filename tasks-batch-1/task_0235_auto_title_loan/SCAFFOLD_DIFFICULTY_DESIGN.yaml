            - call: "POST /atl/applications"
              payload: { borrower_id: "${b16}", appraisal_id: "${a16}", requested_principal_cents: 600000, contract_apr_bps: 3600, term_months: 3 }
              as: Underwriter
              captures: { app16: $.data.id }
            - call: "POST /atl/applications/${app16}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "underwriter-13"
              captures: { loan16: $.data.id }
            - call: "POST /atl/devices"
              payload: { vehicle_id: "${v16}", serial_number: "SER-CA-16" }
              as: LoanServicer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00.000Z" }
              as: ComplianceAdmin
            - call: "POST /atl/loans/${loan16}/assess-delinquency"
              payload: {}
              as: LoanServicer
            - call: "POST /atl/loans/${loan16}/declare-default"
              payload: {}
              as: LoanServicer
            - call: "GET /atl/loans/${loan16}/repossession-orders"
              payload: {}
              as: RecoveryManager
              captures: { repo16: "$.data[0].id" }
            - call: "POST /atl/repossession-orders/${repo16}/assignments"
              payload: { agent_name: "Agent D", window_start: "2026-03-16T08:00:00.000Z", window_end: "2026-03-16T12:00:00.000Z" }
              as: RecoveryManager
          trigger:
            - call: "POST /atl/repossession-orders/${repo16}/assignments"
              payload: { agent_name: "Agent E", window_start: "2026-03-16T12:00:00.000Z", window_end: "2026-03-16T16:00:00.000Z" }
              as: RecoveryManager
              captures: { ok_asg: $.data.id }
            - call: "POST /atl/repossession-orders/${repo16}/assignments"
              payload: { agent_name: "Agent F", window_start: "2026-03-16T10:00:00.000Z", window_end: "2026-03-16T14:00:00.000Z" }
              as: RecoveryManager
              captures: { err: $.data.error_id }
          assert:
