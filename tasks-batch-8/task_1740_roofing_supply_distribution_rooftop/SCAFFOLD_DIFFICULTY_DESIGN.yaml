  # =========================================================================
  # Rule 6 — boundary_precision_check: two boundaries on DIFFERENT metrics
  # reachable via DIFFERENT endpoints. Instance 1 = delivery_fee heavy-load
  # threshold (strict > 40 bundles) via POST /orders/{id}/deliveries.
  # Instance 2 = return quantity upper bound (<= delivered - returned) via
  # POST /orders/{id}/returns — a zero-allowance boundary.
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: delivery_fee_at_exactly_40_bundles_no_surcharge
        grounds:
          - calculations.delivery_fee
          - entities.Delivery.fields.fee_cents
        distinguishing_aspect: |
          Metric = bundle_count vs HEAVY_LOAD_BUNDLE_THRESHOLD; boundary is
          strict-greater, so exactly 40 bundles pays base fee only (22500)
          while 41 bundles pays 22850. Reached through POST
          /orders/{id}/deliveries.
        test_recipe:
          setup:
            - "Confirmed order whose lines total exactly 40 bundles; rooftop slot"
          setup_api_calls:
            - call: "POST /roofing/branches"
              payload: { branch_code: "BR-B1", name: "Boundary", rooftop_delivery_capacity_per_day: 4, conveyor_fleet_size: 2, crane_available: true }
              as: PlatformAdmin
              captures: { br_b1: $.data.id }
