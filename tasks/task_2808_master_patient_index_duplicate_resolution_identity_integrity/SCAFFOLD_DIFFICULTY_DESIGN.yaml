  - rule_id: resource_temporal_overlap
    instances:

      - name: dispatch_window_half_open_adjacency_then_capacity_breach
        grounds:
          - calculations.dispatch_window_occupancy
          - validations[priority=45]
          - entities.DownstreamSystem.fields.max_concurrent_dispatch
          - endpoints[POST /mpi/propagation-tasks/{id}/send]
        distinguishing_aspect: |
          Pins the HALF-OPEN interval semantics of dispatch windows on a single downstream
          system: a task whose window starts exactly where a SENT task's window ends is
          accepted (touching does not intersect because intersects uses x.start < y.end),
          while a third window straddling the seam intersects BOTH and breaches
          max_concurrent_dispatch 1.
