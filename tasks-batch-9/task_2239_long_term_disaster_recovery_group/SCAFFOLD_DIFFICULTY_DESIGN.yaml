              as_user_id: u_intake_1
              captures: { s22: "$.data.id" }
            - call: POST /recovery-cases
              payload: { survivor_id: "${s22}", disaster_code: "DR-4801", assigned_case_manager_user_id: "u_cm_1", primary_residence_status: "OWNER_OCCUPIED" }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { c22: "$.data.id" }
            - call: POST /recovery-cases/{id}/damage-items
              payload: { category: "STRUCTURE", item_description: "Roof structure and walls", documented_cost_cents: 3000000, photo_count: 10, is_habitability_critical: true }
              as: CaseManager
              as_user_id: u_cm_1
              captures: { d22: "$.data.id" }
            - call: POST /damage-items/{id}/verification
              payload: { verification_status: "VERIFIED", verified_cost_cents: 3000000 }
              as: ConstructionManager
              as_user_id: u_cn_1
            - call: POST /recovery-cases/{id}/assessments
              payload: { variant: "PURPOSE_MATCHED" }
              as: CaseManager
              as_user_id: u_cm_1
              captures: { a22: "$.data.id" }
            - call: POST /member-organizations
              payload: { org_name: "Rotary Recovery Fund", org_type: "CIVIC_CLUB", contact_email: "fund@rotary.example", annual_pledge_cap_cents: 1500000 }
              as: LTRGAdmin
              as_user_id: u_admin_1
              captures: { m22: "$.data.id" }
            - call: POST /funding-sources
              payload: { label: "General donations 2026", source_type: "INDIVIDUAL_DONATION", restriction_code: "UNRESTRICTED", total_cents: 2000000, admin_retention_allowed: true }
              as: LTRGAdmin
              as_user_id: u_admin_1
              captures: { fsu22: "$.data.id" }
            - call: POST /table-sessions
              payload: { session_label: "UNT 2026-09-22", scheduled_for: "2026-09-22T15:00:00Z", quorum_min_member_orgs: 1 }
