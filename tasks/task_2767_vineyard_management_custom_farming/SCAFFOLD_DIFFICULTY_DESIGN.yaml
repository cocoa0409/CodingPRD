  - rule_id: priority_pair_validation_conflict
    instances:
      - name: plan_not_approved_beats_budget_exceeded_on_work_order_create
        grounds:
          - validations[priority=65]
          - validations[priority=110]
          - errors[ERR_PLAN_NOT_APPROVED]
          - errors[ERR_PLAN_BUDGET_EXCEEDED]
          - calculations.work_order_labor_cost
          - calculations.farming_plan_total_budget
        distinguishing_aspect: |
          The same POST /work-orders body violates priority 65 (plan lifecycle state, 409) and
          priority 110 (fiscal ceiling, 409): while the plan is DRAFT the response is
          ERR_PLAN_NOT_APPROVED, and only after submit+approve does the identical payload surface
          ERR_PLAN_BUDGET_EXCEEDED — a lifecycle-vs-fiscal pair, distinct from the safety-vs-
          referential and temporal-vs-aggregate pairs in this rule's other instances.
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch with block B-14 (6.0 x 10.0 ft on 4.0 acres -> 726 vines_per_acre, 2904 vine_count), planted 2020."
            - "FarmingPlan P2 for B-14 plan_year 2026 in DRAFT with per-acre budgets 100.00 / 60.00 / 37.00 / 60.00 -> total_budget 1028.00, committed_cost 0.00."
            - "HOURLY crew CR3 (crew_size 1, base_hourly_rate 100.00, piece_rate_per_vine 0) ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
