  - rule_id: combinatorial_formula
    instances:
      - name: inherent_risk_three_component_caps_bind_on_inclusive_volume_tier_edge
        grounds:
          - calculations.inherent_risk_score
          - calculations.jurisdiction_risk_points
          - calculations.nested_exposure_rollup
          - calculations.ownership_verification_rollup
          - calculations.residual_risk_score
          - calculations.risk_rating_assignment
          - entities.RespondentBank.fields.inherent_risk_score
        distinguishing_aspect: |
          Mode (a) - four heterogeneous inputs combined non-linearly: the jurisdiction POINTS_CAP
          (43 raw -> 40.00), the OWNERSHIP_CAP (32 raw -> 24.0) and the NESTED_CAP (23 raw ->
          20.0) all clip simultaneously while the activity component sits exactly on the
          inclusive 1000000.00 tier edge (6, never 2) and SCORE_CAP stays inert at 92.00, so a
          single mis-ordered min() or an exclusive tier comparison changes the answer.
        test_recipe:
          setup: >
            Three JurisdictionProfiles: PK (RESTRICTED, CALL_FOR_ACTION, secrecy, basel 10.0 ->
            8+12+3+20 = 43 raw, clipped to 40.00), PA (RESTRICTED, used only as an owner's
            country of residence) and DE (PERMITTED, corridor weight 1.00, nesting allowed).
            Respondent R2 (home DE) already carries one DISCLOSED depth-1 nested row, so R1's
            row pointing at R2 computes depth 2. R1 (home PK, expected_monthly_volume_usd exactly
            1000000.00, expected_monthly_count 250, nested_activity_permitted true) is licensed
            (DD_IN_PROGRESS) and carries two VERIFIED owners - a PEP natural person at 40.00% in
            PK and a STATE owner at 20.00% in PA - so verified_ownership_pct is 60.00 and
            ownership_verified stays false. R1 also carries three live nested rows, all
            UNDISCLOSED_DETECTED (one at depth 2, two at depth 1), and an ASSESSED questionnaire
