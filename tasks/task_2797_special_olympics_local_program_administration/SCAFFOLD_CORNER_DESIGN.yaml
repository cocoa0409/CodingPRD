            - "replaying the same POST /credentials/${cred}/certify with header X-Role: Coach and X-User-ID: ${vol} on the READY_TO_CERTIFY credential returns HTTP 403 with data.error_id == ERR_FORBIDDEN_ROLE and leaves status READY_TO_CERTIFY with expires_on == null"
            - "POST /medical-forms/${form}/review with body {decision: APPROVE} sent with X-Role: ProgramManager returns HTTP 403 with data.error_id == ERR_FORBIDDEN_ROLE and MedicalForm.${form}.status stays SUBMITTED with reviewed_by_user_id == null"
            - "POST /competition-entries with body {season_id: ${season}, participant_type: ATHLETE, participant_id: ${ath}, event_code: 100M_DASH, skill_score: 40.0} sent with X-Role: CredentialingOfficer returns HTTP 403 with data.error_id == ERR_FORBIDDEN_ROLE and SportSeason.${season}.entry_count stays 0"
