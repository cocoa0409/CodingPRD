        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /payouts/00000000-0000-0000-0000-000000000000/settle"
              payload: { outcome: "PAID" }
              as: Member
              as_user_id: "member_x"
          assert:
            - "Response HTTP status == 403"
            - "Response data.error_id == ERR_FORBIDDEN"

      - name: creator_cannot_post_to_unowned_publication_forbidden
        claim_type: peer_roles
        grounds: [roles.Creator, "validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Creator_2 creating a post under a publication owned by creator_1 is rejected with ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["publication owned by creator_1"]
          setup_api_calls:
            - call: "POST /publications"
              payload: { name: "P1" }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
          trigger:
            - call: "POST /publications/${pub_id}/posts"
              payload: { title: "T", body: "B", content_type: "POST", min_tier_rank: 0 }
              as: Creator
              as_user_id: "creator_2"
          assert:
            - "Response HTTP status == 403"
            - "Response data.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: missing_user_id_header_returns_401
        claim_type: role denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A Member-role request omitting the X-User-ID header is rejected with ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["a publication with a member"]
          setup_api_calls:
            - call: "POST /publications"
              payload: { name: "P" }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /members/${m_id}"
              payload: {}
              as: Member
          assert:
            - "Response HTTP status == 401"
            - "Response data.error_id == ERR_UNAUTHENTICATED"

  # ------------------- Cross-Cutting Complexity Layers ----------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: payout_create_stale_publication_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[payout-create-stale-publication]", "errors[ERR_STALE_PUBLICATION_VERSION]"]
        distinguishing_aspect: "A payout carrying a publication version captured before another payout advanced it is rejected with ERR_STALE_PUBLICATION_VERSION (412)."
        test_recipe:
          setup: ["publication with payout_balance 2250 (one paid PRO invoice); a first payout already requested (version advanced)"]
          setup_api_calls:
            - call: "POST /publications"
              payload: { name: "P", platform_fee_bps: 1000 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Pro", tier_rank: 2, monthly_price_cents: 2500, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pro_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /members/${m_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /members/${m_id}/subscriptions"
              payload: { tier_id: "${pro_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /invoices?subscription_id=${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "GET /publications/${pub_id}"
              payload: {}
              as: Creator
              as_user_id: "creator_1"
              captures: { stale_v: $.data.version }
            - call: "POST /publications/${pub_id}/payouts"
              payload: { amount_cents: 1000, expected_publication_version: "${stale_v}" }
              as: Creator
              as_user_id: "creator_1"
          trigger:
            - call: "POST /publications/${pub_id}/payouts"
              payload: { amount_cents: 1000, expected_publication_version: "${stale_v}" }
              as: Creator
              as_user_id: "creator_1"
          assert:
            - "Response HTTP status == 412"
            - "Response data.error_id == ERR_STALE_PUBLICATION_VERSION"

      - name: change_tier_stale_subscription_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[change-tier-stale-subscription]", "errors[ERR_STALE_SUBSCRIPTION_VERSION]"]
        distinguishing_aspect: "A change-tier carrying a subscription version captured before an earlier change-tier advanced it is rejected with ERR_STALE_SUBSCRIPTION_VERSION (412)."
        test_recipe:
          setup: ["ACTIVE PLUS subscription; a first change-tier to PRO already applied (version advanced)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publications"
              payload: { name: "P", platform_fee_bps: 1000 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Plus", tier_rank: 1, monthly_price_cents: 1000, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { plus_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Pro", tier_rank: 2, monthly_price_cents: 2500, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pro_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Max", tier_rank: 3, monthly_price_cents: 4000, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { max_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /members/${m_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /members/${m_id}/subscriptions"
              payload: { tier_id: "${plus_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /invoices?subscription_id=${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { stale_sv: $.data.version }
            - call: "POST /subscriptions/${sub_id}/change-tier"
              payload: { new_tier_id: "${pro_id}", expected_subscription_version: "${stale_sv}" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/change-tier"
              payload: { new_tier_id: "${max_id}", expected_subscription_version: "${stale_sv}" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Response HTTP status == 412"
            - "Response data.error_id == ERR_STALE_SUBSCRIPTION_VERSION"

      - name: publication_version_increments_on_payout_create
        claim_type: optimistic_concurrency
        grounds: [entities.Publication.fields.version, "concurrency_rules[payout-create-stale-publication]"]
        distinguishing_aspect: "A successful payout create increments Publication.version by exactly 1 (so the next stale-version request fails)."
        test_recipe:
          setup: ["publication with payout_balance 2250"]
          setup_api_calls:
            - call: "POST /publications"
              payload: { name: "P", platform_fee_bps: 1000 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Pro", tier_rank: 2, monthly_price_cents: 2500, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pro_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /members/${m_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /members/${m_id}/subscriptions"
              payload: { tier_id: "${pro_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /invoices?subscription_id=${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { inv0: "$.data[0].id" }
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "GET /publications/${pub_id}"
              payload: {}
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_v: $.data.version }
          trigger:
            - call: "POST /publications/${pub_id}/payouts"
              payload: { amount_cents: 1000, expected_publication_version: "${pub_v}" }
              as: Creator
              as_user_id: "creator_1"
            - call: "GET /publications/${pub_id}"
              payload: {}
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_v2: $.data.version }
          assert:
            - "Publication.${pub_id}.version increased by exactly 1 versus the pre-payout value"
            - "Publication.${pub_id}.pending_payout_cents == 1000"
            - "Publication.${pub_id}.payout_balance_cents == 1250"

  # --------------------------- Consistency Model ----------------------------
  - section: consistency_model
    instances:
      - name: subscription_activation_credits_balance_same_request
        claim_type: immediate
        grounds: [calculations.platform_fee_and_creator_net, entities.Publication.fields.payout_balance_cents]
        distinguishing_aspect: "Paying the initial invoice credits Publication.payout_balance_cents to 2250 immediately (visible on the next read, no lag)."
        test_recipe:
          setup: ["TRIALING PRO subscription with an OPEN initial invoice"]
          setup_api_calls:
            - call: "POST /publications"
              payload: { name: "P", platform_fee_bps: 1000 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pub_id: $.data.id }
            - call: "POST /publications/${pub_id}/tiers"
              payload: { name: "Pro", tier_rank: 2, monthly_price_cents: 2500, trial_days: 0 }
              as: Creator
              as_user_id: "creator_1"
              captures: { pro_id: $.data.id }
            - call: "POST /publications/${pub_id}/members"
              payload: { email: "m@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /members/${m_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /members/${m_id}/subscriptions"
              payload: { tier_id: "${pro_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /invoices?subscription_id=${sub_id}"
              payload: {}
              as: PlatformAdmin
              captures: { inv0: "$.data[0].id" }
          trigger:
            - call: "POST /_payments/simulate"
              payload: { invoice_id: "${inv0}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "GET /publications/${pub_id}"
              payload: {}
              as: Creator
              as_user_id: "creator_1"
              captures: { bal: $.data.payout_balance_cents }
          assert:
            - "Subscription.${sub_id}.status == ACTIVE"
            - "Publication.${pub_id}.payout_balance_cents == 2250"

  # ------------------------ Excluded (covered by §1.8) ----------------------
  - section: errors
    instances:
      - name: error_publication_suspended_on_payout
        claim_type: Violation → Error
        grounds: ["errors[ERR_PUBLICATION_SUSPENDED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / payout_suspended_state_beats_insufficient_fiscal
          rationale: "ERR_PUBLICATION_SUSPENDED is asserted as the winning error of the named §1.8 priority-conflict instance."
      - name: error_registration_closed_on_register
        claim_type: Violation → Error
        grounds: ["errors[ERR_REGISTRATION_CLOSED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / registration_closed_temporal_beats_event_full_constraint
          rationale: "ERR_REGISTRATION_CLOSED is asserted as the winning error of the named §1.8 instance."
      - name: error_schedule_conflict_on_register
        claim_type: Violation → Error
        grounds: ["errors[ERR_SCHEDULE_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / member_double_booking_overlapping_events_rejected
          rationale: "ERR_SCHEDULE_CONFLICT is the asserted failure of the named §1.8 overlap instance."
      - name: error_send_window_conflict_on_send
        claim_type: Violation → Error
        grounds: ["errors[ERR_SEND_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / newsletter_send_window_overlap_rejected
          rationale: "ERR_SEND_WINDOW_CONFLICT is the asserted failure of the named §1.8 overlap instance."
      - name: error_subscription_required_on_comment
        claim_type: Violation → Error
        grounds: ["errors[ERR_SUBSCRIPTION_REQUIRED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / comment_creation_requires_active_subscription
          rationale: "ERR_SUBSCRIPTION_REQUIRED is the asserted failure of the named §1.8 cross-entity instance."
