          assert:
            - "hop 1: ChampionshipEvent.${ce_id}.net_event_revenue_cents == 39000000, .host_share_cents == 7800000, .participant_pool_cents == 31200000 and .status == SETTLED"
            - "hop 2: RevenuePool.${rp_id}.gross_revenue_cents == 531200000"
            - "hop 3: RevenuePool.${rp_id}.status == DRAFT and RevenuePool.${rp_id}.audited_expense_cents == null"
            - "hop 4: DistributionRun.${run_c_id}.status == SUPERSEDED"
            - "hop 5: all four DistributionLine rows with distribution_run_id == ${run_c_id} have status == VOIDED"
            - "the settle request body names no run and no line, so hops 4 and 5 are purely derived"
            - "GET /distribution-runs/${run_c_id}/lines returns 4 rows and every one has net_payable_cents unchanged from the computed values while status is VOIDED"

      - name: withdraw_execution_cascades_to_host_at_risk_depth_five
        grounds:
          - state_machines.MembershipAction.APPROVED_to_EXECUTED
          - state_machines.Member.FULL_SHARE_to_DEPARTED
          - state_machines.ScheduleGame.SCHEDULED_to_CANCELLED
          - state_machines.ProtectedRivalry.ACTIVE_to_LAPSED
          - state_machines.ChampionshipEvent.SCHEDULED_to_HOST_AT_RISK
