# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 0990: Textile & Clothing-Recycling Pickup
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# Names are unique across this file AND SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: create_zone_applies_defaults
        claim_type: defaults
        grounds: [entities.ServiceZone.fields.charity_splits]
        distinguishing_aspect: "POST /service-zones with only `name` yields charity_splits == [], version == 1, status-free zone."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /service-zones"
              payload: { name: "Zone E1" }
              as: ZoneOperator
              captures: { z_id: $.data.id, z_splits: $.data.charity_splits, z_v: $.data.version }
          assert:
            - "${id} == [] (default applied)"
            - "${id} == 1 and id/created_at/updated_at server-minted"

      - name: pickup_est_weight_computed_not_input
        claim_type: computed_fields
        grounds: [entities.PickupRequest.fields.est_weight_kg, calculations.estimated_pickup_weight]
        distinguishing_aspect: "est_weight_kg is computed as bags_claimed * 4.0 on create: 7 bags -> 28.0 in the create response."
        test_recipe:
          setup:
            - "Zone Z; resident R"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone E2" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Pia Pell", email: "pia@x.com", address: "18 Beech St" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 7 }
              as: Resident
              as_user_id: "${id}"
              captures: { p_est: $.data.est_weight_kg, p_status: $.data.status, p_v: $.data.version }
          assert:
            - "${id} == 28.0 (7 * 4.0)"
            - "${id} == SCHEDULED, ${id} == 1, reschedule_count == 0, rebook_count == 0"

      - name: create_pickup_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required bags_claimed from POST /pickup-requests yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Zone Z; resident R"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone E3" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Quinn Q", email: "quinn@x.com", address: "19 Chestnut Ave" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z" }
              as: Resident
              as_user_id: "${id}"
              captures: { err: $.data.error_id }
          assert:
            - "400 with ${id} == ERR_INVALID_REQUEST"

      - name: get_resident_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /residents/{id} with a well-formed but nonexistent UUID yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /residents/00000000-0000-0000-0000-000000000000"
              as: ZoneOperator
              captures: { err: $.data.error_id }
          assert:
            - "404 with ${id} == ERR_NOT_FOUND"

      - name: fill_reading_immutable_event_shape
        claim_type: immutability
        grounds: [entities.FillReading]
        distinguishing_aspect: "FillReading is common_fields:false — create response carries id and created_at but no version/updated_at; the entity declares no update or delete endpoint in §1.5."
        test_recipe:
          setup:
            - "Zone Z; drop box D"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone E5" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /dropboxes"
              payload: { zone_id: "${id}", label: "Box-1", location: "Depot" }
              as: ZoneOperator
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /dropboxes/${id}/fill-readings"
              payload: { fill_pct: 20.0, recorded_at: "2026-05-01T06:00:00Z" }
              as: SensorGateway
              captures: { fr_id: $.data.id }
          assert:
            - "201 response data has id and created_at, and has NO version and NO updated_at key"
            - "DropBox.fill_pct == 20.0 and posture == OK after the reading"

      - name: create_pickup_extra_field_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Undeclared body keys are rejected: POST /pickup-requests carrying driver_id (a system field) yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Zone Z; resident R"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone E6" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Rosa R", email: "rosa@x.com", address: "20 Sycamore Dr" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 2, driver_id: "drv-x" }
              as: Resident
              as_user_id: "${id}"
              captures: { err: $.data.error_id }
          assert:
            - "400 with ${id} == ERR_INVALID_REQUEST (undeclared field driver_id)"

      - name: fill_pct_out_of_range_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=3]", entities.FillReading.fields.fill_pct]
        distinguishing_aspect: "fill_pct range [0,100]: 100.5 rejected with ERR_INVALID_REQUEST; exactly 100.0 accepted."
        test_recipe:
          setup:
            - "Zone Z; drop box D"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone E7" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /dropboxes"
              payload: { zone_id: "${id}", label: "Box-2", location: "Depot" }
              as: ZoneOperator
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /dropboxes/${id}/fill-readings"
              payload: { fill_pct: 100.5, recorded_at: "2026-05-01T06:00:00Z" }
              as: SensorGateway
              captures: { err: $.data.error_id }
            - call: "POST /dropboxes/${id}/fill-readings"
              payload: { fill_pct: 100.0, recorded_at: "2026-05-01T07:00:00Z" }
              as: SensorGateway
              captures: { fr_id: $.data.id }
          assert:
            - "100.5 -> 400 ${id} == ERR_INVALID_REQUEST"
            - "100.0 -> 201 (reading ${id} created); box posture FULL_PENDING_COLLECTION"

      - name: resident_fk_requires_existing_zone
        claim_type: parent_relationships
        grounds: [entities.Resident.fields.zone_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /residents with a nonexistent zone_id yields 404 ERR_NOT_FOUND (body-referenced FK existence)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /residents"
              payload: { zone_id: "00000000-0000-0000-0000-000000000000", full_name: "Seth S", email: "seth@x.com", address: "21 Willow St" }
              as: ZoneOperator
              captures: { err: $.data.error_id }
          assert:
            - "404 with ${id} == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: pickup_initial_state_stub
        claim_type: initial_state
        grounds: [state_machines.PickupRequest]
        excluded_because:
          difficulty_instance: pickup_no_show_rebook_cycle
          rationale: "Its first assert pins p_status0 == SCHEDULED from the create response."

      - name: kit_full_lifecycle_valid_transitions
        claim_type: valid_transition
        grounds: [state_machines.BagKit]
        distinguishing_aspect: "Kit walks REQUESTED -> DISPATCHED -> DELIVERED -> RETIRED through dispatch/deliver/retire; each response shows the new status."
        test_recipe:
          setup:
            - "Zone Z; resident R; kit K created (REQUESTED)"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone SM1" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Tess T", email: "tess@x.com", address: "22 Aspen Ct" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /residents/${id}/bag-kits"
              payload: { kit_type: "BIN" }
              as: Resident
              as_user_id: "${id}"
              captures: { k_id: $.data.id, k_st0: $.data.status }
          trigger:
            - call: "POST /bag-kits/${id}/dispatch"
              payload: {}
              as: ZoneOperator
              captures: { k_st1: $.data.status }
            - call: "POST /bag-kits/${id}/deliver"
              payload: {}
              as: Driver
              captures: { k_st2: $.data.status }
            - call: "POST /bag-kits/${id}/retire"
              payload: {}
              as: Resident
              as_user_id: "${id}"
              captures: { k_st3: $.data.status }
          assert:
            - "${id} == REQUESTED, ${id} == DISPATCHED, ${id} == DELIVERED, ${id} == RETIRED"

      - name: kit_deliver_from_requested_rejected
        claim_type: invalid_transition
        grounds: [state_machines.BagKit, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "deliver on a REQUESTED (never dispatched) kit is not in the transition table -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Zone Z; resident R; kit K REQUESTED"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone SM2" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Uma U", email: "uma@x.com", address: "23 Alder Way" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /residents/${id}/bag-kits"
              payload: { kit_type: "BAG" }
              as: Resident
              as_user_id: "${id}"
              captures: { k_id: $.data.id }
          trigger:
            - call: "POST /bag-kits/${id}/deliver"
              payload: {}
              as: Driver
              captures: { err: $.data.error_id }
          assert:
            - "409 with ${id} == ERR_INVALID_STATE; kit remains REQUESTED"

      - name: cancel_cancelled_pickup_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PickupRequest, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel on the same pickup -> 409 ERR_INVALID_STATE, no side effects."
        test_recipe:
          setup:
            - "Zone Z; resident R; pickup P SCHEDULED"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone SM3" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Vic V", email: "vic@x.com", address: "24 Hemlock St" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 2 }
              as: Resident
              as_user_id: "${id}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /pickup-requests/${id}/cancel"
              payload: {}
              as: Resident
              as_user_id: "${id}"
              captures: { p_st1: $.data.status }
            - call: "POST /pickup-requests/${id}/cancel"
              payload: {}
              as: Resident
              as_user_id: "${id}"
              captures: { err: $.data.error_id }
          assert:
            - "first cancel: ${id} == CANCELLED"
            - "second cancel: 409 ${id} == ERR_INVALID_STATE"

      - name: mark_no_show_from_scheduled_rejected
        claim_type: invalid_transition
        grounds: [state_machines.PickupRequest.ROUTED_to_NO_SHOW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "mark-no-show requires ROUTED; on a SCHEDULED (never routed, driver_id null) pickup any Driver reaches the state check and gets 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Zone Z; resident R; pickup P SCHEDULED (not routed)"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone SM4" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Wes W", email: "wes@x.com", address: "25 Laurel Ln" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 2 }
              as: Resident
              as_user_id: "${id}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /pickup-requests/${id}/mark-no-show"
              payload: {}
              as: Driver
              as_user_id: "drv-1"
              captures: { err: $.data.error_id }
          assert:
            - "409 with ${id} == ERR_INVALID_STATE; pickup remains SCHEDULED"

      - name: certify_bubbles_pickup_to_weighed
        claim_type: side_effect_execution
        grounds: [state_machines.PickupRequest.COLLECTED_to_WEIGHED, state_machines.WeightTicket.PROVISIONAL_to_CERTIFIED]
        distinguishing_aspect: "Bubble-up: certifying the pickup's ticket moves the pickup COLLECTED -> WEIGHED in the same request; GET pickup confirms."
        test_recipe:
          setup:
            - "Zone Z; resident R with DELIVERED kit; pickup P collected (ticket T PROVISIONAL)"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone SM5" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Xena X", email: "xena@x.com", address: "26 Hickory Dr" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /residents/${id}/bag-kits"
              payload: { kit_type: "BAG" }
              as: Resident
              as_user_id: "${id}"
              captures: { k_id: $.data.id }
            - call: "POST /bag-kits/${id}/dispatch"
              payload: {}
              as: ZoneOperator
            - call: "POST /bag-kits/${id}/deliver"
              payload: {}
              as: Driver
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 10 }
              as: Resident
              as_user_id: "${id}"
              captures: { p_id: $.data.id }
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-1", service_date: "2026-05-10" }
              as: ZoneOperator
            - call: "POST /pickup-requests/${id}/mark-collected"
              payload: { provisional_weight_kg: 40.0 }
              as: Driver
              as_user_id: "drv-1"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /weight-tickets/${id}/certify"
              payload: { certified_weight_kg: 12.5, grade: "RESALE" }
              as: ZoneOperator
              captures: { t_status: $.data.status, t_certat: $.data.certified_at }
            - call: "GET /pickup-requests/${id}"
              as: ZoneOperator
              captures: { p_status: $.data.status }
          assert:
            - "ticket ${id} == CERTIFIED and certified_at == 2026-05-01T00:00:00Z (default logical clock)"
            - "pickup ${id} == WEIGHED (bubble-up side effect)"

      - name: settle_bubbles_pickup_and_pays_out
        claim_type: side_effect_execution
        grounds: [state_machines.PickupRequest.WEIGHED_to_SETTLED, state_machines.DiversionCredit.FINALIZED_to_SETTLED]
        distinguishing_aspect: "Settle executes every declared side effect: fund commit, frozen charity lines (990/495), resident share 165 to the balance, pickup WEIGHED -> SETTLED."
        test_recipe:
          setup:
            - "Zone Z with splits 60/30 on CH1/CH2; fund 100000; resident R with DELIVERED kit; pickup collected, certified 12.5 RESALE; credit finalized (gross 1650)"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone SM6" }
              as: ZoneOperator
              captures: { z_id: $.data.id, z_v: $.data.version }
            - call: "POST /charities"
              payload: { name: "ClothesAid" }
              as: ZoneOperator
              captures: { ch1: $.data.id }
            - call: "POST /charities"
              payload: { name: "FiberFund" }
              as: ZoneOperator
              captures: { ch2: $.data.id }
            - call: "PUT /service-zones/${id}/charity-split"
              payload: { charity_splits: [{ charity_id: "${id}", pct: 60 }, { charity_id: "${id}", pct: 30 }], expected_zone_version: "${id}" }
              as: ZoneOperator
            - call: "POST /sponsor-funds"
              payload: { zone_id: "${id}", sponsor_name: "EcoCorp", initial_cents: 100000 }
              as: ZoneOperator
              captures: { f_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Yara Y", email: "yara@x.com", address: "27 Sycamore St" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /residents/${id}/bag-kits"
              payload: { kit_type: "BAG" }
              as: Resident
              as_user_id: "${id}"
              captures: { k_id: $.data.id }
            - call: "POST /bag-kits/${id}/dispatch"
              payload: {}
              as: ZoneOperator
            - call: "POST /bag-kits/${id}/deliver"
              payload: {}
              as: Driver
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 10 }
              as: Resident
              as_user_id: "${id}"
              captures: { p_id: $.data.id }
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-1", service_date: "2026-05-10" }
              as: ZoneOperator
            - call: "POST /pickup-requests/${id}/mark-collected"
              payload: { provisional_weight_kg: 40.0 }
              as: Driver
              as_user_id: "drv-1"
              captures: { t_id: $.data.id }
            - call: "POST /weight-tickets/${id}/certify"
              payload: { certified_weight_kg: 12.5, grade: "RESALE" }
              as: ZoneOperator
            - call: "POST /weight-tickets/${id}/diversion-credits"
              payload: {}
              as: ZoneOperator
              captures: { c_id: $.data.id }
            - call: "POST /diversion-credits/${id}/finalize"
              payload: {}
              as: ZoneOperator
          trigger:
            - call: "POST /diversion-credits/${id}/settle"
              payload: {}
              as: ZoneOperator
              captures: { c_status: $.data.status, c_res: $.data.resident_share_cents }
            - call: "GET /pickup-requests/${id}"
              as: ZoneOperator
              captures: { p_status: $.data.status }
            - call: "GET /charities/${id}"
              as: ZoneOperator
              captures: { ch1_total: $.data.total_received_cents }
            - call: "GET /charities/${id}"
              as: ZoneOperator
              captures: { ch2_total: $.data.total_received_cents }
            - call: "GET /residents/${id}"
              as: ZoneOperator
              captures: { r_bal: $.data.credit_balance_cents }
            - call: "GET /sponsor-funds/${id}"
              as: ZoneOperator
              captures: { f_held: $.data.held_cents, f_paid: $.data.paid_cents }
          assert:
            - "credit ${id} == SETTLED, resident_share_cents == 165 (1650 - 990 - 495)"
            - "pickup ${id} == SETTLED (bubble-up)"
            - "Charity totals: CH1 ${id} == 990, CH2 ${id} == 495"
            - "Resident balance ${id} == 165"
            - "Fund: held ${id} == 0, paid ${id} == 1650"

      - name: collect_retires_delivered_kits
        claim_type: side_effect_execution
        grounds: [state_machines.BagKit, state_machines.PickupRequest.ROUTED_to_COLLECTED]
        distinguishing_aspect: "mark-collected auto-retires ALL of the resident's DELIVERED kits (conditional cascade down to a sibling entity), visible via the resident's kit list."
        test_recipe:
          setup:
            - "Zone Z; resident R with TWO DELIVERED kits; pickup P ROUTED to drv-1"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone SM7" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /residents"
              payload: { zone_id: "${id}", full_name: "Zack Z", email: "zack@x.com", address: "28 Redwood Rd" }
              as: ZoneOperator
              captures: { r_id: $.data.id }
            - call: "POST /residents/${id}/bag-kits"
              payload: { kit_type: "BAG" }
              as: Resident
              as_user_id: "${id}"
              captures: { k1: $.data.id }
            - call: "POST /residents/${id}/bag-kits"
              payload: { kit_type: "BIN" }
              as: Resident
              as_user_id: "${id}"
              captures: { k2: $.data.id }
            - call: "POST /bag-kits/${id}/dispatch"
              payload: {}
              as: ZoneOperator
            - call: "POST /bag-kits/${id}/deliver"
              payload: {}
              as: Driver
            - call: "POST /bag-kits/${id}/dispatch"
              payload: {}
              as: ZoneOperator
            - call: "POST /bag-kits/${id}/deliver"
              payload: {}
              as: Driver
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 2 }
              as: Resident
              as_user_id: "${id}"
              captures: { p_id: $.data.id }
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-1", service_date: "2026-05-10" }
              as: ZoneOperator
          trigger:
            - call: "POST /pickup-requests/${id}/mark-collected"
              payload: { provisional_weight_kg: 9.0 }
              as: Driver
              as_user_id: "drv-1"
              captures: { t_id: $.data.id }
            - call: "GET /residents/${id}/bag-kits"
              as: ZoneOperator
              captures: { k1_st: "$.data[0].status", k2_st: "$.data[1].status" }
          assert:
            - "both kits RETIRED after collection (${id} == RETIRED, ${id} == RETIRED)"

      - name: dropbox_fill_collect_cycle_returns_ok
        claim_type: valid_transition
