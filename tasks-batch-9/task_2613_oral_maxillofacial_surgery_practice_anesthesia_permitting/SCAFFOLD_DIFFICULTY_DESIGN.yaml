      - name: recovery_bay_pool_postop_window_capacity
        resource_entity: "Practice.recovery_bay_count (a counted pool, not a single named resource)"
        interval_semantics: |
          The interval is NOT the case's operating window at all: it is the derived post-operative
          window [planned_end, planned_end + RECOVERY_MINUTES) where RECOVERY_MINUTES is a function of
          planned_anesthesia_level (LOCAL_ONLY 0, MINIMAL 20, MODERATE 45, DEEP 90). Overlap alone is
          harmless; the rule compares PEAK CONCURRENCY over that derived window against a capacity
          integer, so it is an aggregate/counting rule rather than a pairwise one.
        grounds:
          - validations[priority=78]
          - errors.ERR_RECOVERY_CAPACITY_EXCEEDED
          - calculations.recovery_capacity_projection
          - entities.Practice.fields.recovery_bay_count
        distinguishing_aspect: |
          Third distinct interval semantics and third distinct resource: a shifted, level-derived
          window measured against a pool depth instead of a single occupant. With
          recovery_bay_count == 1 the pool degenerates to pairwise, but the derived offset means the
          colliding pair (13:30Z-14:30Z against 13:00Z-14:00Z) overlaps in the OR sense while the
          accepted pair (13:45Z-14:45Z against 13:00Z-14:00Z) overlaps even MORE in the OR sense - the
          verdicts invert relative to the operating windows, so an implementation that reuses the room
          or monitor comparison here gets both cases wrong. Distinct monitors and distinct rooms keep
          priorities 76 and 77 from firing first.
        test_recipe:
          setup:
            - "logical clock 2026-09-11T10:00:00Z -> 2026-09-12T10:00:00Z (inspection) -> 2026-09-14T12:00:00Z (day-of)"
            - "practice with recovery_bay_count 1"
            - "ACTIVE MODERATE_SEDATION permit: all four required drill types logged, inspection 0/0/0"
            - "two surgeons, THREE distinct certified monitors, one evaluation author, one verifier"
            - "three blocks on 2026-09-14 13:00Z-17:00Z in OR-1, OR-2, OR-3"
