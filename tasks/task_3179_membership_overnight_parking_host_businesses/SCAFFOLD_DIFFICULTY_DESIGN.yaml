            - "after the fourth call a POST /api/stay-requests with member_id ${m6} returns error_id ERR_MEMBER_NOT_ELIGIBLE with http 403"
            - "Member.${m6}.removal_status == \"NONE\" throughout, so the gate that fired was the subscription test and not the removal test"
            - "Member.${m6}.version has advanced once per accepted subscription_actions call"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: suspend_host_four_hop_conduct_cascade
        grounds:
          - state_machines.HostBusiness.APPROVED_to_SUSPENDED
          - state_machines.StayRequest.REQUESTED_to_DECLINED
          - state_machines.Member.LAPSED_to_ACTIVE
          - calculations.member_standing_score
        distinguishing_aspect: |
          Depth-5 cascade from a host suspension: hop 1 declines the CONFIRMED
          stay, hop 2 files a MAJOR REVIEW_REPORT incident on the member because
          of that decline, hop 3 lets the new incident raise strike_count to 3 and
          flip removal_status, hop 4 lets the removal decline the second member's
          countable request, hop 5 lets that decline empty the host of members.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-06-01T00:00:00Z"
            - "TX/FARM host approved with two 40-foot sites S1 and S2"
            - "Member A already carrying two strikes (SEVERE plus MAJOR) with one CONFIRMED stay on arrival 2026-07-01"
            - "Member B with one staying request at request_depth 2 left REQUESTED on arrival 2026-07-10"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
