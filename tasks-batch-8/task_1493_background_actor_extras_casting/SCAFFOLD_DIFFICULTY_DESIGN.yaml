            - { call: "POST /central-casting/actors/${act}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/actors", payload: { legal_name: "N Filler", union_status: "NONUNION" }, as: AgencyAdmin, captures: { actF: $.data.id } }
            - { call: "POST /central-casting/actors/${actF}/verify", payload: {}, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 600, location: "Lot 13", union_slots: 0, nonunion_slots: 1, union_rate_cents: 10000, nonunion_rate_cents: 10000 }, as: CastingDirector, captures: { cc1: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc1}/publish", payload: {}, as: CastingDirector }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc1}", actor_id: "${act}" }, as: CastingAssociate, captures: { bk1: $.data.id } }
            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-11", general_call_time: "2026-08-11T08:00:00Z", scheduled_duration_minutes: 600, location: "Lot 14", union_slots: 0, nonunion_slots: 1, union_rate_cents: 10000, nonunion_rate_cents: 10000 }, as: CastingDirector, captures: { cc2: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc2}/publish", payload: {}, as: CastingDirector }
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc2}", actor_id: "${actF}" }, as: CastingAssociate, captures: { bkF: $.data.id } }
          trigger:
            - { call: "POST /central-casting/bookings", payload: { casting_call_id: "${cc2}", actor_id: "${act}", call_time: "2026-08-11T01:00:00Z" }, as: CastingAssociate, captures: { err: $.data.error_id } }
          assert:
