              payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "STANDARD", effective_from: "2026-06-30", effective_to: "2026-12-31" }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
            - call: "POST /network-participations"
              payload: { specialist_id: "${s1}", insurance_plan_id: "${plan1}", tier: "STANDARD", effective_from: "2026-07-01", effective_to: "2026-12-31" }
              as: NetworkAdmin
          assert:
            - "window starting 2026-06-30 rejected: err == ERR_PARTICIPATION_WINDOW_OVERLAP, HTTP 409 (inclusive dates share 06-30)"
            - "window starting 2026-07-01 succeeds with HTTP 201 (next-day adjacency allowed)"

