      - name: create_credit_attempt_with_unknown_entry_rejected
        claim_type: parent_relationships
        grounds: ["entities.CreditAttempt.fields.credit_library_entry_id", "errors[ERR_CREDIT_ENTRY_NOT_FOUND]"]
        distinguishing_aspect: "Flat-topology FK integrity: a body FK referencing a non-existent CreditLibraryEntry yields 404 ERR_CREDIT_ENTRY_NOT_FOUND."
        test_recipe:
