scenario: |
  2846. Eye Bank Corneal Tissue Recovery & Distribution (Lions eye bank): donor referral,
  consent and medical/social history screening, recovery time limits from death to preservation
  with technician dispatch, serologic testing, slit lamp and specular evaluation grading of
  tissue, tissue classification for transplant, research or training use, distribution
  allocation across surgeon requests with expiry-driven priority, shipping with temperature
  monitoring and surgery date coordination, unused tissue return, re-issue and disposal rules,
  adverse reaction reporting and lookback investigation

domain_name: eye-bank-corneal-tissue
api_prefix: "/eye-bank"

datetime_convention: |
  Every datetime value carried in a request body, a query filter, or a response — input,
  computed, or system — is an ISO 8601 UTC instant with EXACTLY three fractional-second
  digits and a trailing `Z`, e.g. `2026-08-03T09:00:00.000Z`. Implementations MUST emit
  exactly this width (never 0 or 6 fractional digits) and MUST accept exactly this width on
  input. Whole-minute arithmetic (`death_to_preservation_minutes`,
  `temp_excursion_minutes_over`) truncates toward zero (floor on non-negative differences).
  Every server-stamped instant — the common `created_at` and `updated_at` fields as well as
  every `source: computed` datetime documented as "logical clock now" — is read from the
  logical clock described in the `POST /_clock/set_current_utc` endpoint, never from real
  wall-clock time.

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # Peer entities joined by explicit FKs plus a true many-to-many junction (Allocation
  # between CorneaTissue and SurgeonRequest), a self-referential edge
  # (Shipment.replaces_shipment_id -> Shipment.id) and a cross-aggregate audit edge
  # (LookbackInvestigation -> Donor AND -> AdverseReactionReport).

  state_machine_shape: parallel
  # CorneaTissue carries two INDEPENDENT state dimensions on one row —
  # `disposition_status` (regulatory/inventory fate) x `custody_status` (physical location).
  # Donor and SurgeonRequest add revision cycles; Shipment,
  # AdverseReactionReport and LookbackInvestigation add branching fork points with
  # divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Donor -> ScreeningRecord / SerologyPanel / Recovery
    - many_to_many         # CorneaTissue <-> SurgeonRequest via Allocation
    - self_referential     # Shipment.replaces_shipment_id -> Shipment.id (re-issue chain)
    - cross_aggregate      # CorneaTissue.donor_id, LookbackInvestigation.source_report_id

  role_model: segregation_of_duties
  # The Technician who performed a Recovery MUST NOT be the Technician who grades any
  # CorneaTissue produced by that Recovery; the Surgeon who reports an adverse reaction
  # cannot review it; the MedicalDirector who classifies tissue cannot create requests.

  consistency_model: immediate

difficulty_level: expert_plus

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Donor
    parent: null
    common_fields: true
    fields:
      - name: donor_code
        type: string
        source: input
        description: "Bank-assigned donor identifier printed on every recovery label"
        constraints: "1..32 chars; globally unique (ERR_DUPLICATE_DONOR_CODE)"
      - name: referral_source
        type: enum
        source: input
        description: "Who referred the donor"
        constraints: "enum: HOSPITAL|HOSPICE|MEDICAL_EXAMINER|FUNERAL_HOME"
      - name: death_at
        type: datetime
        source: input
        description: "Instant of death; anchor of every recovery time limit"
        constraints: "MUST be <= logical clock now (ERR_DEATH_TIME_IN_FUTURE)"
      - name: death_time_basis
        type: enum
        source: input
        description: "How death_at was established; selects the base recovery window"
        constraints: "enum: ASYSTOLE|PRONOUNCED"
      - name: body_cooled_at
        type: datetime
        source: input
        description: "Instant refrigeration began; null when the body was never cooled"
        default: null
        constraints: "when present MUST be >= death_at (ERR_INVALID_REQUEST)"
      - name: age_years
        type: integer
        source: input
        description: "Donor age in whole years at death"
        constraints: "0..110"
      - name: cause_of_death_category
        type: enum
        source: input
        description: "Coarse cause-of-death bucket used in the medical record"
        constraints: "enum: CARDIAC|TRAUMA|MALIGNANCY|NEUROLOGIC|INFECTIOUS|OTHER"
      - name: status
        type: enum
        source: computed
        description: "Donor workflow state (see 1.2 Donor state machine)"
        default: REFERRED
        constraints: "enum: REFERRED|SCREENING|CONSENT_OBTAINED|APPROVED_FOR_RECOVERY|RECOVERED|DEFERRED|RULED_OUT"
      - name: consent_type
        type: enum
        source: computed
        description: "Who authorized donation; set by POST /donors/{id}/consent"
        default: NONE
        constraints: "enum: NONE|FIRST_PERSON|NEXT_OF_KIN"
      - name: consent_scope
        type: enum
        source: computed
        description: "Permitted uses of recovered tissue; set by POST /donors/{id}/consent"
        default: NONE
        constraints: "enum: NONE|TRANSPLANT_ONLY|TRANSPLANT_AND_RESEARCH|RESEARCH_ONLY|TRAINING_ONLY"
      - name: authorizing_party_name
        type: string
        source: computed
        description: "Name recorded on the consent form; null until consent is obtained"
        default: null
      - name: consent_obtained_at
        type: datetime
        source: computed
        description: "Instant consent was obtained; null until consent is obtained"
        default: null
      - name: recovery_window_minutes
        type: integer
        source: computed
        description: "Allowable death-to-preservation window in whole minutes; see calculations.donor_recovery_window"
      - name: recovery_deadline_at
        type: datetime
        source: computed
        description: "death_at + recovery_window_minutes; hard cut-off for preservation"
      - name: screening_risk_score
        type: integer
        source: computed
        description: "Medical/social history risk score over this donor's ScreeningRecord rows; see calculations.donor_screening_risk_score"
        default: 0
      - name: screening_risk_variant
        type: enum
        source: computed
        description: "Which variant of donor_screening_risk_score produced screening_risk_score"
        default: INTERVIEW_ONLY
        constraints: "enum: INTERVIEW_ONLY|POST_SEROLOGY_RECONCILED"
      - name: serology_status
        type: enum
        source: computed
        description: "Derived from the latest non-INVALIDATED RESULTED SerologyPanel of this donor"
        default: PENDING
        constraints: "enum: PENDING|NEGATIVE|REACTIVE|INDETERMINATE"
      - name: deferral_reason
        type: string
        source: computed
        description: "Reason captured by POST /donors/{id}/defer; null when never deferred"
        default: null
      - name: lookback_flag
        type: boolean
        source: computed
        description: "True while any LookbackInvestigation for this donor is in OPEN or NOTIFIED, or after CLOSED_WITH_RECALL"
        default: false
      - name: tissues_recovered_count
        type: integer
        source: computed
        description: "Count of CorneaTissue rows whose donor_id equals this donor's id"
        default: 0

  - name: ScreeningRecord
    parent: Donor
    common_fields: false
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; the screened donor (taken from the path, not the body)"
      - name: question_code
        type: enum
        source: input
        description: "Medical/social history question being answered"
        constraints: "enum: IV_DRUG_USE|HIV_RISK|HEP_B_C_HISTORY|SEPSIS|UNEXPLAINED_NEURO|CJD_FAMILY|TATTOO_12M|INCARCERATION_12M; at most one row per (donor_id, question_code) (ERR_DUPLICATE_SCREENING_ANSWER)"
      - name: response
        type: enum
        source: input
        description: "Historian's answer"
        constraints: "enum: YES|NO|UNKNOWN"
      - name: historian_relationship
        type: enum
        source: input
        description: "Relationship of the person interviewed to the donor"
        constraints: "enum: SPOUSE|CHILD|PARENT|SIBLING|MEDICAL_RECORD|OTHER"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the EyeBankCoordinator who recorded this answer (not an entity id)"
      - name: weight_applied
        type: integer
        source: computed
        description: "Risk weight this row contributed under the donor's current screening_risk_variant"
        default: 0

  - name: SerologyPanel
    parent: Donor
    common_fields: true
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; donor whose blood was drawn (taken from the path)"
      - name: specimen_type
        type: enum
        source: input
        description: "When the specimen was collected relative to death"
        constraints: "enum: PRE_MORTEM|POST_MORTEM"
      - name: drawn_at
        type: datetime
        source: input
        description: "Instant the specimen was drawn"
      - name: hemodilution_pct
        type: number
        source: input
        description: "Plasma dilution percentage estimated for this specimen"
        constraints: "0.00..100.00, two decimal places"
      - name: status
        type: enum
        source: computed
        description: "Panel lifecycle (see 1.2 SerologyPanel state machine)"
        default: DRAWN
        constraints: "enum: DRAWN|RESULTED|INVALIDATED"
      - name: hiv_result
        type: enum
        source: computed
        description: "HIV-1/2 marker result; null until RESULTED"
        default: null
        constraints: "enum: NON_REACTIVE|REACTIVE|INDETERMINATE"
      - name: hbv_result
        type: enum
        source: computed
        description: "Hepatitis B marker result; null until RESULTED"
        default: null
        constraints: "enum: NON_REACTIVE|REACTIVE|INDETERMINATE"
      - name: hcv_result
        type: enum
        source: computed
        description: "Hepatitis C marker result; null until RESULTED"
        default: null
        constraints: "enum: NON_REACTIVE|REACTIVE|INDETERMINATE"
      - name: syphilis_result
        type: enum
        source: computed
        description: "Treponemal marker result; null until RESULTED"
        default: null
        constraints: "enum: NON_REACTIVE|REACTIVE|INDETERMINATE"
      - name: overall_result
        type: enum
        source: computed
        description: "Panel verdict; see calculations.serology_overall_result. Null until RESULTED"
        default: null
        constraints: "enum: NON_REACTIVE|REACTIVE|INDETERMINATE"
      - name: resulted_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which results were posted; null until RESULTED"
        default: null
      - name: donor_version_after
        type: integer
        source: computed
        description: "Value of Donor.version immediately after this panel's creation cascade settled; the OCC handle a client must echo on the next serology write"
      - name: superseded_at
        type: datetime
        source: computed
        description: "Logical-clock instant a newer panel for the same donor invalidated this one; null while this panel is current"
        default: null

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Technician display name"
        constraints: "1..80 chars"
      - name: certification_level
        type: enum
        source: input
        description: "RECOVERY_ONLY may only recover; RECOVERY_AND_EVAL may also grade tissue"
        constraints: "enum: RECOVERY_ONLY|RECOVERY_AND_EVAL"
      - name: certification_expires_at
        type: datetime
        source: input
        description: "Certification expiry; work is refused at or after this instant"
      - name: status
        type: enum
        source: computed
        description: "Roster availability"
        default: ACTIVE
        constraints: "enum: ACTIVE|INACTIVE"
      - name: open_dispatch_count
        type: integer
        source: computed
        description: "Count of this technician's Recovery rows whose status is DISPATCHED or ON_SITE"
        default: 0

  - name: Recovery
    parent: null
    common_fields: true
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; donor being recovered"
      - name: technician_id
        type: string
        source: input
        description: "FK -> Technician.id; dispatched recovery technician"
      - name: dispatched_at
        type: datetime
        source: input
        description: "Start of this recovery's technician occupation interval"
        constraints: "MUST be >= Donor.death_at (ERR_INVALID_REQUEST)"
      - name: planned_release_at
        type: datetime
        source: input
        description: "Planned end of on-site work; provisional end of the occupation interval"
        constraints: "MUST be > dispatched_at (ERR_INVALID_REQUEST)"
      - name: arrival_at
        type: datetime
        source: computed
        description: "Instant the technician reached the recovery site; null until ON_SITE"
        default: null
      - name: preservation_at
        type: datetime
        source: computed
        description: "Instant the cornea entered preservation medium; null until COMPLETED"
        default: null
      - name: preservation_medium
        type: enum
        source: computed
        description: "Storage medium selected at completion; null until COMPLETED"
        default: null
        constraints: "enum: OPTISOL_GS|LIFE4C"
      - name: status
        type: enum
        source: computed
        description: "Recovery lifecycle (see 1.2 Recovery state machine)"
        default: DISPATCHED
        constraints: "enum: DISPATCHED|ON_SITE|COMPLETED|ABORTED"
      - name: abort_reason
        type: string
        source: computed
        description: "Reason captured by POST /recoveries/{id}/abort; null unless ABORTED"
        default: null
      - name: occupation_end_at
        type: datetime
        source: computed
        description: "End of this recovery's technician occupation interval; see calculations.technician_occupation_interval"
      - name: death_to_preservation_minutes
        type: integer
        source: computed
        description: "Whole minutes from Donor.death_at to preservation_at; null until COMPLETED"
        default: null
      - name: time_limit_band
        type: enum
        source: computed
        description: "Band derived from death_to_preservation_minutes; null until COMPLETED"
        default: null
        constraints: "enum: WITHIN_STANDARD|WITHIN_EXTENDED|EXCEEDED"
      - name: recovered_lateralities
        type: array
        source: computed
        description: "Ordered list of lateralities recovered at completion; empty until COMPLETED"
        default: []
        constraints: "each member enum: OD|OS; no duplicates; 1..2 members"

  - name: CorneaTissue
    parent: null
    common_fields: true
    fields:
      - name: recovery_id
        type: string
        source: system
        description: "FK -> Recovery.id; the recovery that produced this tissue"
      - name: donor_id
        type: string
        source: system
        description: "FK -> Donor.id; denormalized cross-aggregate reference copied from Recovery.donor_id at creation"
      - name: laterality
        type: enum
        source: system
        description: "Which eye this tissue came from"
        constraints: "enum: OD|OS; unique per (recovery_id, laterality)"
      - name: preservation_medium
        type: enum
        source: system
        description: "Copied from Recovery.preservation_medium at creation"
        constraints: "enum: OPTISOL_GS|LIFE4C"
      - name: preserved_at
        type: datetime
        source: system
        description: "Copied from Recovery.preservation_at at creation; anchor of the shelf-life clock"
      - name: shelf_life_hours
        type: integer
        source: computed
        description: "Whole hours of shelf life currently credited; see calculations.tissue_shelf_life"
      - name: shelf_life_variant
        type: enum
        source: computed
        description: "Which variant of calculations.tissue_shelf_life produced shelf_life_hours"
        default: PROVISIONAL_AT_RECOVERY
        constraints: "enum: PROVISIONAL_AT_RECOVERY|FINAL_AT_CLASSIFICATION"
      - name: expires_at
        type: datetime
        source: computed
        description: "preserved_at + shelf_life_hours"
      - name: tissue_quality_score
        type: integer
        source: computed
        description: "0..100 composite grading score; null until both required evaluations exist; see calculations.tissue_quality_score"
        default: null
      - name: classification
        type: enum
        source: computed
        description: "Regulatory use classification; null until classified; see calculations.tissue_classification"
        default: null
        constraints: "enum: TRANSPLANT_OPTICAL|TRANSPLANT_THERAPEUTIC|RESEARCH|TRAINING|UNSUITABLE"
      - name: disposition_status
        type: enum
        source: computed
        description: "State dimension A — regulatory/inventory fate (see 1.2 CorneaTissue dimension A)"
        default: UNGRADED
        constraints: "enum: UNGRADED|ELIGIBLE|RESERVED|ISSUED|IMPLANTED|QUARANTINED|RELEASED_FOR_RESEARCH|RELEASED_FOR_TRAINING|DISCARDED"
      - name: custody_status
        type: enum
        source: computed
        description: "State dimension B — physical custody, evolves INDEPENDENTLY of disposition_status (see 1.2 CorneaTissue dimension B)"
        default: IN_HOUSE
        constraints: "enum: IN_HOUSE|IN_TRANSIT|AT_SURGEON|RETURNED_TO_BANK|DESTROYED"
      - name: issue_count
        type: integer
        source: computed
        description: "Number of times this tissue has been dispatched to a surgeon"
        default: 0
      - name: reissue_generation
        type: integer
        source: computed
        description: "Number of completed unused-tissue returns; a tissue with reissue_generation >= 2 can never be allocated again"
        default: 0
      - name: quarantine_reason
        type: string
        source: computed
        description: "Reason recorded on the most recent quarantine; null while never quarantined"
        default: null
      - name: disposal_method
        type: enum
        source: computed
        description: "How the tissue was destroyed; null unless DISCARDED"
        default: null
        constraints: "enum: INCINERATION|AUTOCLAVE|RESEARCH_TRANSFER"

  - name: TissueEvaluation
    parent: CorneaTissue
    common_fields: true
    fields:
      - name: tissue_id
        type: string
        source: input
        description: "FK -> CorneaTissue.id; graded tissue (taken from the path)"
      - name: evaluator_technician_id
        type: string
        source: input
        description: "FK -> Technician.id; technician who performed this exam"
      - name: method
        type: enum
        source: input
        description: "Which exam this row records; each method supplies a disjoint set of grades"
        constraints: "enum: SLIT_LAMP|SPECULAR"
      - name: performed_at
        type: datetime
        source: input
        description: "Instant the exam was performed"
      - name: epithelium_defect_grade
        type: integer
        source: input
        description: "Slit-lamp epithelial defect grade; REQUIRED when method == SLIT_LAMP, MUST be omitted when method == SPECULAR"
        default: null
        constraints: "0..4"
      - name: stromal_clarity_grade
        type: integer
        source: input
        description: "Slit-lamp stromal clarity grade; REQUIRED when method == SLIT_LAMP, MUST be omitted when method == SPECULAR"
        default: null
        constraints: "0..4"
      - name: dm_folds_grade
        type: integer
        source: input
        description: "Slit-lamp Descemet's-membrane folds grade; REQUIRED when method == SLIT_LAMP, MUST be omitted when method == SPECULAR"
        default: null
        constraints: "0..4"
      - name: guttata_grade
        type: integer
        source: input
        description: "Specular guttata grade; REQUIRED when method == SPECULAR, MUST be omitted when method == SLIT_LAMP"
        default: null
        constraints: "0..2"
      - name: endothelial_cell_count
        type: integer
        source: input
        description: "Specular endothelial cell density in cells/mm2; REQUIRED when method == SPECULAR, MUST be omitted when method == SLIT_LAMP"
        default: null
        constraints: "500..4000"
      - name: status
        type: enum
        source: computed
        description: "RECORDED while current; SUPERSEDED once a newer evaluation of the SAME method exists for this tissue"
        default: RECORDED
        constraints: "enum: RECORDED|SUPERSEDED"
      - name: tissue_version_after
        type: integer
        source: computed
        description: "Value of CorneaTissue.version immediately after this evaluation's cascade settled; the OCC handle a client must echo on the next evaluation write"

  - name: Surgeon
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Surgeon display name"
        constraints: "1..80 chars"
      - name: center_code
        type: string
        source: input
        description: "Transplant centre code"
        constraints: "1..16 chars"
      - name: specialty
        type: enum
        source: input
        description: "Primary keratoplasty specialty"
        constraints: "enum: PK|DSAEK|DMEK|THERAPEUTIC"
      - name: credential_status
        type: enum
        source: computed
        description: "Bank-side credentialling state; only ACTIVE surgeons may receive tissue"
        default: ACTIVE
        constraints: "enum: ACTIVE|PROBATION|SUSPENDED"
      - name: gross_billed_cents
        type: integer
        source: computed
        description: "Sum of processing fees ever billed to this surgeon; see calculations.surgeon_fee_ledger"
        default: 0
      - name: credited_fee_cents
        type: integer
        source: computed
        description: "Sum of processing fees credited back to this surgeon; see calculations.surgeon_fee_ledger"
        default: 0
      - name: outstanding_fee_cents
        type: integer
        source: computed
        description: "gross_billed_cents - credited_fee_cents; see calculations.surgeon_fee_ledger"
        default: 0
      - name: substantiated_reaction_count
        type: integer
        source: computed
        description: "Count of this surgeon's AdverseReactionReport rows in status SUBSTANTIATED"
        default: 0

  - name: SurgeonRequest
    parent: null
    common_fields: true
    fields:
      - name: surgeon_id
        type: string
        source: input
        description: "FK -> Surgeon.id; requesting surgeon"
      - name: procedure_type
        type: enum
        source: input
        description: "Planned procedure; constrains which tissue classifications may be matched"
        constraints: "enum: PK|DSAEK|DMEK|THERAPEUTIC"
      - name: surgery_date
        type: datetime
        source: input
        description: "Scheduled surgery instant; also the day bucket for surgeon capacity"
        constraints: "MUST be > logical clock now (ERR_SURGERY_DATE_IN_PAST)"
      - name: min_ecd
        type: integer
        source: input
        description: "Minimum acceptable endothelial cell density in cells/mm2"
        constraints: "500..4000"
      - name: max_donor_age_years
        type: integer
        source: input
        description: "Maximum acceptable donor age in whole years"
        constraints: "0..110"
      - name: laterality_preference
        type: enum
        source: input
        description: "Requested eye, or ANY"
        constraints: "enum: OD|OS|ANY"
      - name: urgency
        type: enum
        source: input
        description: "ROUTINE or URGENT; drives urgency_weight and the urgency surcharge"
        constraints: "enum: ROUTINE|URGENT"
      - name: status
        type: enum
        source: computed
        description: "Request lifecycle (see 1.2 SurgeonRequest state machine)"
        default: OPEN
        constraints: "enum: OPEN|ALLOCATED|FULFILLED|CANCELLED|EXPIRED"
      - name: base_score
        type: integer
        source: computed
        description: "Step-1 result of calculations.request_priority_score; the ONLY input to tier selection"
        default: 0
      - name: priority_tier
        type: enum
        source: computed
        description: "Step-2 tier selected from base_score alone, never re-derived from priority_score"
        default: STANDARD
        constraints: "enum: PLATINUM|GOLD|STANDARD"
      - name: priority_score
        type: integer
        source: computed
        description: "Step-3 result base_score + tier_bonus[priority_tier]; see calculations.request_priority_score"
        default: 0
      - name: cancel_reason
        type: string
        source: computed
        description: "Reason captured by POST /surgeon-requests/{id}/cancel; null unless CANCELLED"
        default: null

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - name: tissue_id
        type: string
        source: input
        description: "FK -> CorneaTissue.id; reserved tissue"
      - name: request_id
        type: string
        source: input
        description: "FK -> SurgeonRequest.id; request the tissue is reserved for"
      - name: allocated_at
        type: datetime
        source: computed
        description: "Logical-clock instant the reservation was made"
      - name: status
        type: enum
        source: computed
        description: "Allocation lifecycle (see 1.2 Allocation state machine)"
        default: RESERVED
        constraints: "enum: RESERVED|CONFIRMED|CONSUMED|RELEASED|CANCELLED"
      - name: source
        type: enum
        source: computed
        description: "MANUAL when created by POST /allocations, RUN when created by POST /allocation-runs"
        constraints: "enum: MANUAL|RUN"
      - name: reserved_ecd_snapshot
        type: integer
        source: computed
        description: "endothelial_cell_count of the tissue's RECORDED SPECULAR evaluation at reservation time"
      - name: reserved_classification_snapshot
        type: enum
        source: computed
        description: "CorneaTissue.classification pinned at reservation time; fee base is keyed on this snapshot, not on any later value"
        constraints: "enum: TRANSPLANT_OPTICAL|TRANSPLANT_THERAPEUTIC"
      - name: processing_fee_cents
        type: integer
        source: computed
        description: "Fee pinned at reservation; see calculations.allocation_processing_fee"
      - name: expiry_margin_hours
        type: integer
        source: computed
        description: "Whole hours between SurgeonRequest.surgery_date and CorneaTissue.expires_at at reservation time (floor; may be 0)"
      - name: cancel_reason
        type: string
        source: computed
        description: "Reason recorded when the allocation left RESERVED for CANCELLED or CONFIRMED for RELEASED"
        default: null

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - name: allocation_id
        type: string
        source: input
        description: "FK -> Allocation.id; the confirmed allocation being shipped"
      - name: replaces_shipment_id
        type: string
        source: input
        description: "FK -> Shipment.id; the RETURNED shipment this re-issue replaces; null on a first issue"
        default: null
      - name: carrier
        type: enum
        source: input
        description: "Transport mode"
        constraints: "enum: COURIER|AIR"
      - name: shipped_at
        type: datetime
        source: computed
        description: "Instant the parcel left the bank; null until IN_TRANSIT"
        default: null
      - name: delivered_at
        type: datetime
        source: computed
        description: "Instant the surgeon signed for the parcel; null until DELIVERED or REJECTED_ON_ARRIVAL"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Shipment lifecycle (see 1.2 Shipment state machine)"
        default: PREPARED
        constraints: "enum: PREPARED|IN_TRANSIT|DELIVERED|REJECTED_ON_ARRIVAL|RETURNED"
      - name: min_temp_c
        type: number
        source: computed
        description: "Minimum included TemperatureReading.temperature_c; null until delivery is recorded"
        default: null
      - name: max_temp_c
        type: number
        source: computed
        description: "Maximum included TemperatureReading.temperature_c; null until delivery is recorded"
        default: null
      - name: temp_excursion_minutes_over
        type: integer
        source: computed
        description: "Whole minutes spent outside 2.0..8.0 C; see calculations.shipment_integrity_verdict"
        default: null
      - name: integrity_verdict
        type: enum
        source: computed
        description: "Cold-chain verdict computed at delivery; null until delivery is recorded"
        default: null
        constraints: "enum: PASS|EXCURSION_MINOR|EXCURSION_MAJOR"

  - name: TemperatureReading
    parent: Shipment
    common_fields: false
    fields:
      - name: shipment_id
        type: string
        source: input
        description: "FK -> Shipment.id; monitored shipment (taken from the path)"
      - name: recorded_at
        type: datetime
        source: input
        description: "Instant the logger sampled the temperature"
      - name: temperature_c
        type: number
        source: input
        description: "Sampled temperature in degrees Celsius, one decimal place"
        constraints: "-40.0..60.0"

  - name: AdverseReactionReport
    parent: null
    common_fields: true
    fields:
      - name: tissue_id
        type: string
        source: input
        description: "FK -> CorneaTissue.id; the implanted tissue implicated in the reaction"
      - name: surgeon_id
        type: string
        source: input
        description: "FK -> Surgeon.id; reporting surgeon; MUST equal the surgeon of the tissue's CONSUMED allocation"
      - name: reaction_type
        type: enum
        source: input
        description: "Nature of the reaction"
        constraints: "enum: PRIMARY_GRAFT_FAILURE|ENDOPHTHALMITIS|INFECTIOUS_KERATITIS|REJECTION"
      - name: severity
        type: enum
        source: input
        description: "Reporter-assessed severity; SERIOUS reactions open a lookback on substantiation"
        constraints: "enum: MINOR|SERIOUS"
      - name: narrative
        type: string
        source: input
        description: "Free-text clinical narrative"
        constraints: "1..2000 chars"
      - name: reported_at
        type: datetime
        source: computed
        description: "Logical-clock instant the report was filed"
      - name: status
        type: enum
        source: computed
        description: "Report lifecycle (see 1.2 AdverseReactionReport state machine)"
        default: SUBMITTED
        constraints: "enum: SUBMITTED|SUBSTANTIATED|UNSUBSTANTIATED"
      - name: adjudication_note
        type: string
        source: computed
        description: "MedicalDirector note recorded on substantiate or dismiss; null while SUBMITTED"
        default: null

  - name: LookbackInvestigation
    parent: null
    common_fields: true
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; donor whose whole cohort is under investigation"
      - name: source_report_id
        type: string
        source: input
        description: "FK -> AdverseReactionReport.id; the substantiated report that opened this investigation; null when trigger_reason is POSITIVE_RETEST"
        default: null
      - name: trigger_reason
        type: enum
        source: computed
        description: "What opened the investigation"
        constraints: "enum: ADVERSE_REACTION|POSITIVE_RETEST"
      - name: status
        type: enum
        source: computed
        description: "Investigation lifecycle (see 1.2 LookbackInvestigation state machine)"
        default: OPEN
        constraints: "enum: OPEN|NOTIFIED|CLOSED_NO_ACTION|CLOSED_WITH_RECALL"
      - name: opened_at
        type: datetime
        source: computed
        description: "Logical-clock instant the investigation opened"
      - name: notified_at
        type: datetime
        source: computed
        description: "Logical-clock instant recipient notification was recorded; null until NOTIFIED"
        default: null
      - name: closed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of closure; null until closed"
        default: null
      - name: impacted_tissue_count
        type: integer
        source: computed
        description: "Count of every CorneaTissue of this donor, regardless of disposition; see calculations.lookback_impact_set"
        default: 0
      - name: quarantined_count
        type: integer
        source: computed
        description: "Count of this donor's tissues this investigation actually moved to QUARANTINED"
        default: 0
      - name: notified_recipient_count
        type: integer
        source: computed
        description: "Count of distinct Surgeon rows holding a non-CANCELLED allocation of an impacted tissue at notification time; null until NOTIFIED"
        default: null
      - name: closure_note
        type: string
        source: computed
        description: "MedicalDirector closure note; null until closed"
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Donor
    state_field: status
    initial_state: REFERRED
    terminal_states: [RECOVERED, RULED_OUT]
    shape: "branching with a DEFERRED -> SCREENING revision cycle"
    transitions:
      - from: REFERRED
        to: SCREENING
        trigger: "POST /eye-bank/donors/{id}/screening-records (the donor's FIRST screening record)"
        actor: EyeBankCoordinator
        preconditions: ["donor.status == REFERRED"]
        side_effects:
          - "creates the ScreeningRecord row"
          - "recomputes Donor.screening_risk_score and Donor.screening_risk_variant via calculations.donor_screening_risk_score"
          - "increments Donor.version by 1"
        note: "Second and later screening records do not change status; they still recompute screening_risk_score."
      - from: SCREENING
        to: CONSENT_OBTAINED
        trigger: "POST /eye-bank/donors/{id}/consent"
        actor: EyeBankCoordinator
        preconditions:
          - "donor.status == SCREENING"
          - "consent_scope != NONE"
        side_effects:
          - "sets consent_type, consent_scope, authorizing_party_name, consent_obtained_at"
          - "increments Donor.version by 1"
      - from: CONSENT_OBTAINED
        to: APPROVED_FOR_RECOVERY
        trigger: "POST /eye-bank/donors/{id}/approve-recovery"
        actor: MedicalDirector
        preconditions:
          - "donor.status == CONSENT_OBTAINED"
          - "donor.serology_status != REACTIVE"
          - "logical clock now < donor.recovery_deadline_at"
        side_effects: ["increments Donor.version by 1"]
      - from: APPROVED_FOR_RECOVERY
        to: RECOVERED
        trigger: "system, on POST /eye-bank/recoveries/{id}/complete for this donor"
        actor: system
        preconditions: ["donor.status == APPROVED_FOR_RECOVERY"]
        side_effects:
          - "sets Donor.tissues_recovered_count to the number of CorneaTissue rows created by the completing recovery"
          - "increments Donor.version by 1"
      - from: SCREENING
        to: DEFERRED
        trigger: "POST /eye-bank/donors/{id}/defer"
        actor: MedicalDirector
        preconditions: ["donor.status IN {SCREENING, CONSENT_OBTAINED, APPROVED_FOR_RECOVERY}"]
        side_effects: ["sets deferral_reason", "increments Donor.version by 1"]
      - from: CONSENT_OBTAINED
        to: DEFERRED
        trigger: "POST /eye-bank/donors/{id}/defer"
        actor: MedicalDirector
        preconditions: ["donor.status IN {SCREENING, CONSENT_OBTAINED, APPROVED_FOR_RECOVERY}"]
        side_effects: ["sets deferral_reason", "increments Donor.version by 1"]
      - from: APPROVED_FOR_RECOVERY
        to: DEFERRED
        trigger: "POST /eye-bank/donors/{id}/defer"
        actor: MedicalDirector
        preconditions:
          - "donor.status IN {SCREENING, CONSENT_OBTAINED, APPROVED_FOR_RECOVERY}"
        side_effects:
          - "sets deferral_reason"
          - "every Recovery of this donor whose status IN {DISPATCHED, ON_SITE} moves to ABORTED with abort_reason = 'DONOR_DEFERRED' (ordered by Recovery.created_at ASC)"
          - "each aborted Recovery decrements Technician.open_dispatch_count on its technician_id and increments that Technician.version by 1"
          - "increments Donor.version by 1"
      - from: DEFERRED
        to: SCREENING
        trigger: "POST /eye-bank/donors/{id}/reinstate"
        actor: MedicalDirector
        preconditions:
          - "donor.status == DEFERRED"
          - "donor.serology_status != REACTIVE"
        side_effects:
          - "clears deferral_reason to null"
          - "consent fields are preserved; the donor must pass consent again only if consent_scope == NONE"
          - "increments Donor.version by 1"
        note: "This is the revision cycle: SCREENING -> DEFERRED -> SCREENING may repeat any number of times."
      - from: SCREENING
        to: RULED_OUT
        trigger: "system, on POST /eye-bank/serology-panels/{id}/results resolving to overall_result == REACTIVE"
        actor: system
        preconditions: ["donor.status IN {SCREENING, CONSENT_OBTAINED, APPROVED_FOR_RECOVERY, DEFERRED}"]
        side_effects:
          - "sets Donor.serology_status = REACTIVE"
          - "increments Donor.version by 1"
      - from: CONSENT_OBTAINED
        to: RULED_OUT
        trigger: "system, on POST /eye-bank/serology-panels/{id}/results resolving to overall_result == REACTIVE"
        actor: system
        preconditions: ["donor.status IN {SCREENING, CONSENT_OBTAINED, APPROVED_FOR_RECOVERY, DEFERRED}"]
        side_effects: ["sets Donor.serology_status = REACTIVE", "increments Donor.version by 1"]
      - from: APPROVED_FOR_RECOVERY
        to: RULED_OUT
        trigger: "system, on POST /eye-bank/serology-panels/{id}/results resolving to overall_result == REACTIVE"
        actor: system
        preconditions: ["donor.status IN {SCREENING, CONSENT_OBTAINED, APPROVED_FOR_RECOVERY, DEFERRED}"]
        side_effects: ["sets Donor.serology_status = REACTIVE", "increments Donor.version by 1"]
      - from: DEFERRED
        to: RULED_OUT
        trigger: "system, on POST /eye-bank/serology-panels/{id}/results resolving to overall_result == REACTIVE"
        actor: system
        preconditions: ["donor.status IN {SCREENING, CONSENT_OBTAINED, APPROVED_FOR_RECOVERY, DEFERRED}"]
        side_effects: ["sets Donor.serology_status = REACTIVE", "increments Donor.version by 1"]
      - from: RECOVERED
        to: RECOVERED
        trigger: "system, on POST /eye-bank/serology-panels/{id}/results resolving to overall_result == REACTIVE for an already-RECOVERED donor"
        actor: system
        preconditions: ["donor.status == RECOVERED"]
        side_effects:
          - "sets Donor.serology_status = REACTIVE (status stays RECOVERED because tissue already exists)"
          - "opens a LookbackInvestigation with trigger_reason = POSITIVE_RETEST, source_report_id = null, status = OPEN"
          - "that opened investigation sets Donor.lookback_flag = true and runs the quarantine cascade described under LookbackInvestigation.OPEN"
          - "increments Donor.version by 1"

  - entity: SerologyPanel
    state_field: status
    initial_state: DRAWN
    terminal_states: [INVALIDATED]
    shape: "linear with a supersede sink"
    transitions:
      - from: DRAWN
        to: RESULTED
        trigger: "POST /eye-bank/serology-panels/{id}/results"
        actor: LabTechnician
        preconditions: ["panel.status == DRAWN"]
        side_effects:
          - "sets the four marker fields and resulted_at"
          - "computes overall_result via calculations.serology_overall_result"
          - "sets Donor.serology_status from overall_result (NON_REACTIVE -> NEGATIVE, REACTIVE -> REACTIVE, INDETERMINATE -> INDETERMINATE)"
          - "recomputes Donor.screening_risk_score under the POST_SEROLOGY_RECONCILED variant and sets Donor.screening_risk_variant = POST_SEROLOGY_RECONCILED"
          - "when overall_result == REACTIVE, drives the Donor REACTIVE transitions above"
          - "increments SerologyPanel.version by 1 and Donor.version by 1"
      - from: DRAWN
        to: INVALIDATED
        trigger: "system, on POST /eye-bank/donors/{id}/serology-panels creating a newer panel for the same donor"
        actor: system
        preconditions: ["panel.status IN {DRAWN, RESULTED}", "panel.donor_id == the new panel's donor_id"]
        side_effects: ["sets superseded_at", "increments SerologyPanel.version by 1"]
      - from: RESULTED
        to: INVALIDATED
        trigger: "system, on POST /eye-bank/donors/{id}/serology-panels creating a newer panel for the same donor"
        actor: system
        preconditions: ["panel.status IN {DRAWN, RESULTED}", "panel.donor_id == the new panel's donor_id"]
        side_effects:
          - "sets superseded_at"
          - "Donor.serology_status reverts to PENDING because no RESULTED non-INVALIDATED panel remains"
          - "Donor.screening_risk_variant reverts to INTERVIEW_ONLY and screening_risk_score is recomputed under that variant"
          - "increments SerologyPanel.version by 1 and Donor.version by 1"

  - entity: Recovery
    state_field: status
    initial_state: DISPATCHED
    terminal_states: [COMPLETED, ABORTED]
    shape: "branching (complete vs abort) from two different states"
    transitions:
      - from: DISPATCHED
        to: ON_SITE
        trigger: "POST /eye-bank/recoveries/{id}/arrive"
        actor: RecoveryTechnician
        preconditions:
          - "recovery.status == DISPATCHED"
          - "X-User-ID == recovery.technician_id"
          - "arrival_at >= recovery.dispatched_at"
        side_effects: ["sets arrival_at", "increments Recovery.version by 1"]
      - from: ON_SITE
        to: COMPLETED
        trigger: "POST /eye-bank/recoveries/{id}/complete"
        actor: RecoveryTechnician
        preconditions:
          - "recovery.status == ON_SITE"
          - "X-User-ID == recovery.technician_id"
          - "donor.status == APPROVED_FOR_RECOVERY"
          - "donor.consent_scope != NONE"
          - "preservation_at >= recovery.arrival_at"
          - "preservation_at <= donor.recovery_deadline_at"
        side_effects:
          - "sets preservation_at, preservation_medium, recovered_lateralities"
          - "computes death_to_preservation_minutes and time_limit_band via calculations.recovery_time_limit"
          - "sets occupation_end_at = preservation_at + TECHNICIAN_TURNAROUND_MINUTES"
          - "creates one CorneaTissue per member of recovered_lateralities, IN THE ORDER GIVEN, each with disposition_status = UNGRADED, custody_status = IN_HOUSE, shelf_life_variant = PROVISIONAL_AT_RECOVERY and expires_at from calculations.tissue_shelf_life"
          - "that tissue creation drives Donor APPROVED_FOR_RECOVERY -> RECOVERED and sets Donor.tissues_recovered_count"
          - "decrements Technician.open_dispatch_count and increments Technician.version by 1"
          - "increments Recovery.version by 1"
      - from: DISPATCHED
        to: ABORTED
        trigger: "POST /eye-bank/recoveries/{id}/abort"
        actor: RecoveryTechnician
        preconditions: ["recovery.status IN {DISPATCHED, ON_SITE}", "X-User-ID == recovery.technician_id"]
        side_effects:
          - "sets abort_reason"
          - "removes this recovery from the technician occupation set used by calculations.technician_occupation_interval"
          - "decrements Technician.open_dispatch_count and increments Technician.version by 1"
          - "increments Recovery.version by 1"
      - from: ON_SITE
        to: ABORTED
        trigger: "POST /eye-bank/recoveries/{id}/abort"
        actor: RecoveryTechnician
        preconditions: ["recovery.status IN {DISPATCHED, ON_SITE}", "X-User-ID == recovery.technician_id"]
        side_effects:
          - "sets abort_reason"
          - "removes this recovery from the technician occupation set"
          - "decrements Technician.open_dispatch_count and increments Technician.version by 1"
          - "increments Recovery.version by 1"

  - entity: CorneaTissue
    state_field: disposition_status
    dimension: "A of 2 — regulatory/inventory fate. Evolves INDEPENDENTLY of custody_status."
    initial_state: UNGRADED
    terminal_states: [IMPLANTED, DISCARDED]
    shape: "parallel dimension with three revision cycles (RESERVED->ELIGIBLE, ISSUED->ELIGIBLE, QUARANTINED->ELIGIBLE)"
    transitions:
      - from: UNGRADED
        to: ELIGIBLE
        trigger: "POST /eye-bank/tissues/{id}/classify resolving to classification IN {TRANSPLANT_OPTICAL, TRANSPLANT_THERAPEUTIC}"
        actor: MedicalDirector
        preconditions:
          - "tissue.disposition_status == UNGRADED"
          - "a RECORDED TissueEvaluation with method == SLIT_LAMP exists for this tissue"
          - "a RECORDED TissueEvaluation with method == SPECULAR exists for this tissue"
          - "donor.serology_status IN {NEGATIVE, INDETERMINATE}"
          - "donor.consent_scope != NONE"
          - "donor.lookback_flag == false"
        side_effects:
          - "computes tissue_quality_score via calculations.tissue_quality_score"
          - "computes classification via calculations.tissue_classification"
          - "recomputes shelf_life_hours and expires_at under the FINAL_AT_CLASSIFICATION variant and sets shelf_life_variant = FINAL_AT_CLASSIFICATION"
          - "increments CorneaTissue.version by 1"
      - from: UNGRADED
        to: RELEASED_FOR_RESEARCH
        trigger: "POST /eye-bank/tissues/{id}/classify resolving to classification == RESEARCH"
        actor: MedicalDirector
        preconditions:
          - "tissue.disposition_status == UNGRADED"
          - "both a RECORDED SLIT_LAMP and a RECORDED SPECULAR TissueEvaluation exist for this tissue"
          - "donor.consent_scope IN {TRANSPLANT_AND_RESEARCH, RESEARCH_ONLY}"
        side_effects:
          - "computes tissue_quality_score, classification, shelf_life_hours, expires_at as above"
          - "increments CorneaTissue.version by 1"
      - from: UNGRADED
        to: RELEASED_FOR_TRAINING
        trigger: "POST /eye-bank/tissues/{id}/classify resolving to classification == TRAINING"
        actor: MedicalDirector
        preconditions:
          - "tissue.disposition_status == UNGRADED"
          - "both a RECORDED SLIT_LAMP and a RECORDED SPECULAR TissueEvaluation exist for this tissue"
          - "donor.consent_scope == TRAINING_ONLY"
        side_effects:
          - "computes tissue_quality_score, classification, shelf_life_hours, expires_at as above"
          - "increments CorneaTissue.version by 1"
      - from: UNGRADED
        to: DISCARDED
        trigger: "POST /eye-bank/tissues/{id}/classify resolving to classification == UNSUITABLE"
        actor: MedicalDirector
        preconditions:
          - "tissue.disposition_status == UNGRADED"
          - "both a RECORDED SLIT_LAMP and a RECORDED SPECULAR TissueEvaluation exist for this tissue"
        side_effects:
          - "computes tissue_quality_score, classification, shelf_life_hours, expires_at as above"
          - "sets disposal_method = INCINERATION"
          - "sets custody_status = DESTROYED (the only classify path that also moves dimension B)"
          - "increments CorneaTissue.version by 1"
      - from: ELIGIBLE
        to: RESERVED
        trigger: "POST /eye-bank/allocations, or POST /eye-bank/allocation-runs selecting this tissue"
        actor: EyeBankCoordinator
        preconditions:
          - "tissue.disposition_status == ELIGIBLE"
          - "tissue.custody_status IN {IN_HOUSE, RETURNED_TO_BANK}"
          - "tissue.reissue_generation <= 1"
          - "tissue.expires_at > logical clock now"
          - "tissue.expires_at >= request.surgery_date"
          - "donor.lookback_flag == false"
          - "surgeon.credential_status == ACTIVE"
        side_effects:
          - "creates the Allocation row with status = RESERVED, source, reserved_ecd_snapshot, reserved_classification_snapshot, expiry_margin_hours and processing_fee_cents from calculations.allocation_processing_fee"
          - "that Allocation creation drives SurgeonRequest OPEN -> ALLOCATED"
          - "increments CorneaTissue.version by 1"
      - from: RESERVED
        to: ELIGIBLE
        trigger: "POST /eye-bank/allocations/{id}/cancel"
        actor: EyeBankCoordinator
        preconditions: ["tissue.disposition_status == RESERVED", "allocation.status == RESERVED"]
        side_effects:
          - "allocation moves RESERVED -> CANCELLED and records cancel_reason"
          - "that allocation cancellation drives SurgeonRequest ALLOCATED -> OPEN and recomputes its priority_score"
          - "custody_status is NOT touched (stays IN_HOUSE or RETURNED_TO_BANK)"
          - "increments CorneaTissue.version by 1"
      - from: RESERVED
        to: ISSUED
        trigger: "POST /eye-bank/shipments/{id}/dispatch"
        actor: EyeBankCoordinator
        preconditions:
          - "tissue.disposition_status == RESERVED"
          - "allocation.status == CONFIRMED"
          - "shipment.status == PREPARED"
          - "surgeon.credential_status == ACTIVE"
          - "tissue.expires_at >= request.surgery_date"
        side_effects:
          - "increments issue_count by 1"
          - "sets custody_status = IN_TRANSIT (dimension B advances in the same request)"
          - "increments CorneaTissue.version by 1"
      - from: ISSUED
        to: IMPLANTED
        trigger: "POST /eye-bank/tissues/{id}/implant"
        actor: Surgeon
        preconditions:
          - "tissue.disposition_status == ISSUED"
          - "tissue.custody_status == AT_SURGEON"
          - "shipment.integrity_verdict IN {PASS, EXCURSION_MINOR}"
          - "tissue.expires_at > logical clock now"
          - "X-User-ID == the surgeon_id of the tissue's CONFIRMED allocation's request"
        side_effects:
          - "allocation moves CONFIRMED -> CONSUMED"
          - "that allocation consumption drives SurgeonRequest ALLOCATED -> FULFILLED"
          - "custody_status REMAINS AT_SURGEON — dimension B does not move on implant"
          - "increments CorneaTissue.version by 1"
      - from: ISSUED
        to: ELIGIBLE
        trigger: "POST /eye-bank/tissues/{id}/return with shipment.integrity_verdict == PASS and tissue.expires_at > logical clock now"
        actor: Surgeon
        preconditions:
          - "tissue.disposition_status == ISSUED"
          - "tissue.custody_status == AT_SURGEON"
          - "X-User-ID == the surgeon_id of the tissue's CONFIRMED allocation's request"
        side_effects:
          - "sets custody_status = RETURNED_TO_BANK and increments reissue_generation by 1"
          - "shipment moves DELIVERED -> RETURNED"
          - "allocation moves CONFIRMED -> RELEASED with cancel_reason = 'UNUSED_TISSUE_RETURNED'"
          - "that allocation release credits Surgeon.credited_fee_cents by allocation.processing_fee_cents and recomputes Surgeon.outstanding_fee_cents"
          - "that allocation release drives SurgeonRequest ALLOCATED -> OPEN and recomputes its priority_score"
          - "increments CorneaTissue.version by 1"
      - from: ISSUED
        to: QUARANTINED
        trigger: "POST /eye-bank/tissues/{id}/return with shipment.integrity_verdict != PASS or tissue.expires_at <= logical clock now"
        actor: Surgeon
        preconditions:
          - "tissue.disposition_status == ISSUED"
          - "tissue.custody_status == AT_SURGEON"
          - "X-User-ID == the surgeon_id of the tissue's CONFIRMED allocation's request"
        side_effects:
          - "sets quarantine_reason = 'RETURN_INTEGRITY_OR_EXPIRY' and custody_status = RETURNED_TO_BANK, increments reissue_generation by 1"
          - "shipment moves DELIVERED -> RETURNED"
          - "allocation moves CONFIRMED -> RELEASED, crediting Surgeon.credited_fee_cents as above"
          - "that allocation release drives SurgeonRequest ALLOCATED -> OPEN"
          - "increments CorneaTissue.version by 1"
      - from: ISSUED
        to: QUARANTINED
        trigger: "system, on POST /eye-bank/shipments/{id}/deliver resolving to integrity_verdict == EXCURSION_MAJOR"
        actor: system
        preconditions: ["tissue.disposition_status == ISSUED", "tissue.custody_status == IN_TRANSIT"]
        side_effects:
          - "sets quarantine_reason = 'COLD_CHAIN_EXCURSION_MAJOR' and custody_status = RETURNED_TO_BANK"
          - "allocation moves CONFIRMED -> RELEASED, crediting Surgeon.credited_fee_cents"
          - "that allocation release drives SurgeonRequest ALLOCATED -> OPEN"
          - "increments CorneaTissue.version by 1"
        note: "reissue_generation is NOT incremented here — the tissue never reached the surgeon."
      - from: ELIGIBLE
        to: QUARANTINED
        trigger: "POST /eye-bank/tissues/{id}/quarantine, or the LookbackInvestigation OPEN cascade"
        actor: MedicalDirector
        preconditions: ["tissue.disposition_status IN {ELIGIBLE, RESERVED, ISSUED}"]
        side_effects: ["sets quarantine_reason", "increments CorneaTissue.version by 1"]
      - from: RESERVED
        to: QUARANTINED
        trigger: "POST /eye-bank/tissues/{id}/quarantine, or the LookbackInvestigation OPEN cascade"
        actor: MedicalDirector
        preconditions: ["tissue.disposition_status IN {ELIGIBLE, RESERVED, ISSUED}"]
        side_effects:
          - "sets quarantine_reason"
          - "the tissue's allocation with status == RESERVED moves to CANCELLED with cancel_reason = 'TISSUE_QUARANTINED'"
          - "that allocation cancellation drives SurgeonRequest ALLOCATED -> OPEN and recomputes its priority_score"
          - "increments CorneaTissue.version by 1"
      - from: QUARANTINED
        to: ELIGIBLE
        trigger: "POST /eye-bank/tissues/{id}/release-quarantine"
        actor: MedicalDirector
        preconditions:
          - "tissue.disposition_status == QUARANTINED"
          - "tissue.classification IN {TRANSPLANT_OPTICAL, TRANSPLANT_THERAPEUTIC}"
          - "donor.lookback_flag == false"
          - "donor.serology_status IN {NEGATIVE, INDETERMINATE}"
        side_effects:
          - "clears quarantine_reason to null"
          - "custody_status is NOT touched"
          - "increments CorneaTissue.version by 1"
        note: "This is the cycle ELIGIBLE -> QUARANTINED -> ELIGIBLE; it may repeat any number of times."
      - from: QUARANTINED
        to: DISCARDED
        trigger: "POST /eye-bank/tissues/{id}/discard, or the LookbackInvestigation CLOSED_WITH_RECALL cascade"
        actor: MedicalDirector
        preconditions: ["tissue.disposition_status IN {ELIGIBLE, QUARANTINED, RELEASED_FOR_RESEARCH, RELEASED_FOR_TRAINING}"]
        side_effects: ["sets disposal_method", "sets custody_status = DESTROYED", "increments CorneaTissue.version by 1"]
      - from: ELIGIBLE
        to: DISCARDED
        trigger: "POST /eye-bank/tissues/{id}/discard"
        actor: MedicalDirector
        preconditions: ["tissue.disposition_status IN {ELIGIBLE, QUARANTINED, RELEASED_FOR_RESEARCH, RELEASED_FOR_TRAINING}"]
        side_effects: ["sets disposal_method", "sets custody_status = DESTROYED", "increments CorneaTissue.version by 1"]
      - from: RELEASED_FOR_RESEARCH
        to: DISCARDED
        trigger: "POST /eye-bank/tissues/{id}/discard with disposal_method == RESEARCH_TRANSFER"
        actor: MedicalDirector
        preconditions: ["tissue.disposition_status IN {ELIGIBLE, QUARANTINED, RELEASED_FOR_RESEARCH, RELEASED_FOR_TRAINING}"]
        side_effects: ["sets disposal_method", "sets custody_status = DESTROYED", "increments CorneaTissue.version by 1"]
      - from: RELEASED_FOR_TRAINING
        to: DISCARDED
        trigger: "POST /eye-bank/tissues/{id}/discard"
        actor: MedicalDirector
        preconditions: ["tissue.disposition_status IN {ELIGIBLE, QUARANTINED, RELEASED_FOR_RESEARCH, RELEASED_FOR_TRAINING}"]
        side_effects: ["sets disposal_method", "sets custody_status = DESTROYED", "increments CorneaTissue.version by 1"]

  - entity: CorneaTissue
    state_field: custody_status
    dimension: "B of 2 — physical custody. Evolves INDEPENDENTLY of disposition_status."
    initial_state: IN_HOUSE
    terminal_states: [DESTROYED]
    shape: "parallel dimension with a RETURNED_TO_BANK -> IN_TRANSIT re-issue cycle"
    transitions:
      - from: IN_HOUSE
        to: IN_TRANSIT
        trigger: "POST /eye-bank/shipments/{id}/dispatch"
        actor: EyeBankCoordinator
        preconditions: ["tissue.custody_status IN {IN_HOUSE, RETURNED_TO_BANK}", "shipment.status == PREPARED"]
        side_effects: ["sets shipment.shipped_at", "dimension A moves RESERVED -> ISSUED in the same request", "increments CorneaTissue.version by 1"]
      - from: RETURNED_TO_BANK
        to: IN_TRANSIT
        trigger: "POST /eye-bank/shipments/{id}/dispatch on a re-issue shipment whose replaces_shipment_id points at the RETURNED shipment"
        actor: EyeBankCoordinator
        preconditions:
          - "tissue.custody_status == RETURNED_TO_BANK"
          - "tissue.reissue_generation <= 1"
          - "shipment.status == PREPARED"
        side_effects: ["sets shipment.shipped_at", "dimension A moves RESERVED -> ISSUED", "increments CorneaTissue.version by 1"]
        note: "This is the re-issue cycle IN_TRANSIT -> AT_SURGEON -> RETURNED_TO_BANK -> IN_TRANSIT."
      - from: IN_TRANSIT
        to: AT_SURGEON
        trigger: "POST /eye-bank/shipments/{id}/deliver resolving to integrity_verdict IN {PASS, EXCURSION_MINOR}"
        actor: Surgeon
        preconditions: ["tissue.custody_status == IN_TRANSIT", "shipment.status == IN_TRANSIT"]
        side_effects:
          - "shipment moves IN_TRANSIT -> DELIVERED and stores min_temp_c, max_temp_c, temp_excursion_minutes_over, integrity_verdict"
          - "disposition_status REMAINS ISSUED — dimension A does not move on delivery"
          - "increments CorneaTissue.version by 1"
      - from: IN_TRANSIT
        to: RETURNED_TO_BANK
        trigger: "POST /eye-bank/shipments/{id}/deliver resolving to integrity_verdict == EXCURSION_MAJOR"
        actor: Surgeon
        preconditions: ["tissue.custody_status == IN_TRANSIT", "shipment.status == IN_TRANSIT"]
        side_effects:
          - "shipment moves IN_TRANSIT -> REJECTED_ON_ARRIVAL"
          - "dimension A moves ISSUED -> QUARANTINED with quarantine_reason = 'COLD_CHAIN_EXCURSION_MAJOR'"
          - "increments CorneaTissue.version by 1"
      - from: AT_SURGEON
        to: RETURNED_TO_BANK
        trigger: "POST /eye-bank/tissues/{id}/return"
        actor: Surgeon
        preconditions: ["tissue.custody_status == AT_SURGEON", "tissue.disposition_status == ISSUED"]
        side_effects: ["increments reissue_generation by 1", "dimension A moves ISSUED -> ELIGIBLE or ISSUED -> QUARANTINED", "increments CorneaTissue.version by 1"]
      - from: IN_HOUSE
        to: DESTROYED
        trigger: "POST /eye-bank/tissues/{id}/discard, or POST /eye-bank/tissues/{id}/classify resolving to UNSUITABLE"
        actor: MedicalDirector
        preconditions: ["tissue.custody_status IN {IN_HOUSE, RETURNED_TO_BANK}"]
        side_effects: ["dimension A moves to DISCARDED", "increments CorneaTissue.version by 1"]
      - from: RETURNED_TO_BANK
        to: DESTROYED
        trigger: "POST /eye-bank/tissues/{id}/discard"
        actor: MedicalDirector
        preconditions: ["tissue.custody_status IN {IN_HOUSE, RETURNED_TO_BANK}"]
        side_effects: ["dimension A moves to DISCARDED", "increments CorneaTissue.version by 1"]

  - entity: SurgeonRequest
    state_field: status
    initial_state: OPEN
    terminal_states: [FULFILLED, CANCELLED, EXPIRED]
    shape: "cyclic — OPEN -> ALLOCATED -> OPEN may repeat"
    transitions:
      - from: OPEN
        to: ALLOCATED
        trigger: "system, on Allocation creation (POST /eye-bank/allocations or POST /eye-bank/allocation-runs)"
        actor: system
        preconditions: ["request.status == OPEN", "surgeon.credential_status == ACTIVE"]
        side_effects: ["increments SurgeonRequest.version by 1"]
      - from: ALLOCATED
        to: OPEN
        trigger: "system, on the request's allocation leaving RESERVED for CANCELLED or leaving CONFIRMED for RELEASED"
        actor: system
        preconditions: ["request.status == ALLOCATED"]
        side_effects:
          - "recomputes base_score, priority_tier and priority_score via calculations.request_priority_score against the logical clock at this instant"
          - "increments SurgeonRequest.version by 1"
        note: "This is the cycle; a request may be re-allocated and reopened repeatedly."
      - from: ALLOCATED
        to: FULFILLED
        trigger: "system, on POST /eye-bank/tissues/{id}/implant consuming the request's allocation"
        actor: system
        preconditions: ["request.status == ALLOCATED", "allocation.status == CONFIRMED"]
        side_effects: ["increments SurgeonRequest.version by 1"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /eye-bank/surgeon-requests/{id}/cancel"
        actor: Surgeon
        preconditions: ["request.status IN {OPEN, ALLOCATED}", "X-User-ID == request.surgeon_id"]
        side_effects: ["sets cancel_reason", "increments SurgeonRequest.version by 1"]
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /eye-bank/surgeon-requests/{id}/cancel"
        actor: Surgeon
        preconditions: ["request.status IN {OPEN, ALLOCATED}", "X-User-ID == request.surgeon_id"]
        side_effects:
          - "sets cancel_reason"
          - "the request's allocation with status == RESERVED moves to CANCELLED with cancel_reason = 'REQUEST_CANCELLED'"
          - "that allocation cancellation moves the tissue's disposition_status RESERVED -> ELIGIBLE"
          - "increments SurgeonRequest.version by 1"
        note: "Rejected when the request's allocation is already CONFIRMED, CONSUMED or RELEASED (ERR_ALLOCATION_STATE_INVALID)."
      - from: OPEN
        to: EXPIRED
        trigger: "system, on POST /eye-bank/allocation-runs when request.surgery_date <= logical clock now"
        actor: system
        preconditions: ["request.status == OPEN", "request.surgery_date <= logical clock now"]
        side_effects:
          - "the request id is returned in the run's expired_request_ids"
          - "increments SurgeonRequest.version by 1"

  - entity: Allocation
    state_field: status
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED, CANCELLED]
    shape: "branching — RESERVED forks to CONFIRMED or CANCELLED, CONFIRMED forks to CONSUMED or RELEASED"
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /eye-bank/allocations/{id}/confirm"
        actor: EyeBankCoordinator
        preconditions:
          - "allocation.status == RESERVED"
          - "tissue.disposition_status == RESERVED"
          - "surgeon.credential_status == ACTIVE"
          - "tissue.expires_at >= request.surgery_date"
          - "the surgeon holds at most 1 other allocation with status IN {RESERVED, CONFIRMED, CONSUMED} whose request.surgery_date falls on the same UTC calendar date"
        side_effects:
          - "increments Surgeon.gross_billed_cents by allocation.processing_fee_cents and recomputes Surgeon.outstanding_fee_cents"
          - "increments Surgeon.version by 1"
          - "increments Allocation.version by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /eye-bank/allocations/{id}/cancel, or a tissue quarantine cascade, or SurgeonRequest cancellation"
        actor: EyeBankCoordinator
        preconditions: ["allocation.status == RESERVED"]
        side_effects:
          - "sets cancel_reason"
          - "moves the tissue's disposition_status RESERVED -> ELIGIBLE (custody untouched)"
          - "that tissue release drives SurgeonRequest ALLOCATED -> OPEN"
          - "no fee is ever billed for a CANCELLED allocation"
          - "increments Allocation.version by 1"
      - from: CONFIRMED
        to: CONSUMED
        trigger: "system, on POST /eye-bank/tissues/{id}/implant"
        actor: system
        preconditions: ["allocation.status == CONFIRMED", "tissue.custody_status == AT_SURGEON"]
        side_effects: ["drives SurgeonRequest ALLOCATED -> FULFILLED", "increments Allocation.version by 1"]
      - from: CONFIRMED
        to: RELEASED
        trigger: "system, on POST /eye-bank/tissues/{id}/return or on a shipment resolving to integrity_verdict == EXCURSION_MAJOR"
        actor: system
        preconditions: ["allocation.status == CONFIRMED"]
        side_effects:
          - "sets cancel_reason"
          - "increments Surgeon.credited_fee_cents by allocation.processing_fee_cents and recomputes Surgeon.outstanding_fee_cents"
          - "drives SurgeonRequest ALLOCATED -> OPEN"
          - "increments Surgeon.version by 1 and Allocation.version by 1"

  - entity: Shipment
    state_field: status
    initial_state: PREPARED
    terminal_states: [REJECTED_ON_ARRIVAL, RETURNED]
    shape: "branching fork at delivery with divergent side-effect sets per branch"
    transitions:
      - from: PREPARED
        to: IN_TRANSIT
        trigger: "POST /eye-bank/shipments/{id}/dispatch"
        actor: EyeBankCoordinator
        preconditions:
          - "shipment.status == PREPARED"
          - "allocation.status == CONFIRMED"
          - "surgeon.credential_status == ACTIVE"
          - "tissue.expires_at >= request.surgery_date"
          - "at least one TemperatureReading exists for this shipment"
        side_effects:
          - "sets shipped_at"
          - "moves the tissue's disposition_status RESERVED -> ISSUED and custody_status to IN_TRANSIT"
          - "increments tissue.issue_count by 1"
          - "increments Shipment.version by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /eye-bank/shipments/{id}/deliver resolving to integrity_verdict IN {PASS, EXCURSION_MINOR}"
        actor: Surgeon
        preconditions:
          - "shipment.status == IN_TRANSIT"
          - "X-User-ID == the surgeon_id of the shipment's allocation's request"
          - "delivered_at >= shipped_at"
        side_effects:
          - "sets delivered_at, min_temp_c, max_temp_c, temp_excursion_minutes_over, integrity_verdict via calculations.shipment_integrity_verdict"
          - "moves the tissue's custody_status IN_TRANSIT -> AT_SURGEON, leaving disposition_status at ISSUED"
          - "increments Shipment.version by 1"
      - from: IN_TRANSIT
        to: REJECTED_ON_ARRIVAL
        trigger: "POST /eye-bank/shipments/{id}/deliver resolving to integrity_verdict == EXCURSION_MAJOR"
        actor: Surgeon
        preconditions:
          - "shipment.status == IN_TRANSIT"
          - "X-User-ID == the surgeon_id of the shipment's allocation's request"
          - "delivered_at >= shipped_at"
        side_effects:
          - "sets delivered_at, min_temp_c, max_temp_c, temp_excursion_minutes_over, integrity_verdict"
          - "moves the tissue's custody_status IN_TRANSIT -> RETURNED_TO_BANK and disposition_status ISSUED -> QUARANTINED with quarantine_reason = 'COLD_CHAIN_EXCURSION_MAJOR'"
          - "that tissue quarantine moves the allocation CONFIRMED -> RELEASED, crediting Surgeon.credited_fee_cents by allocation.processing_fee_cents"
          - "that allocation release moves the SurgeonRequest ALLOCATED -> OPEN and recomputes its priority_score"
          - "increments Shipment.version by 1"
      - from: DELIVERED
        to: RETURNED
        trigger: "system, on POST /eye-bank/tissues/{id}/return"
        actor: system
        preconditions: ["shipment.status == DELIVERED", "tissue.custody_status == AT_SURGEON"]
        side_effects: ["increments Shipment.version by 1"]

  - entity: AdverseReactionReport
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [SUBSTANTIATED, UNSUBSTANTIATED]
    shape: "branching — one fork point, two branches with disjoint side-effect sets"
    transitions:
      - from: SUBMITTED
        to: SUBSTANTIATED
        trigger: "POST /eye-bank/adverse-reaction-reports/{id}/substantiate"
        actor: MedicalDirector
        preconditions: ["report.status == SUBMITTED"]
        side_effects:
          - "sets adjudication_note"
          - "increments Surgeon.substantiated_reaction_count by 1 and Surgeon.version by 1"
          - "when severity == SERIOUS, opens a LookbackInvestigation for report.tissue's donor with trigger_reason = ADVERSE_REACTION, source_report_id = this report, status = OPEN"
          - "that opened investigation sets Donor.lookback_flag = true and runs the quarantine cascade described under LookbackInvestigation.OPEN"
          - "increments AdverseReactionReport.version by 1"
        note: "severity == MINOR substantiates the report without opening any investigation."
      - from: SUBMITTED
        to: UNSUBSTANTIATED
        trigger: "POST /eye-bank/adverse-reaction-reports/{id}/dismiss"
        actor: MedicalDirector
        preconditions: ["report.status == SUBMITTED"]
        side_effects:
          - "sets adjudication_note"
          - "Surgeon.substantiated_reaction_count is NOT changed and no LookbackInvestigation is opened"
          - "increments AdverseReactionReport.version by 1"

  - entity: LookbackInvestigation
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED_NO_ACTION, CLOSED_WITH_RECALL]
    shape: "branching — NOTIFIED forks into two closures with opposite cascades"
    transitions:
      - from: null
        to: OPEN
        trigger: "system, on AdverseReactionReport substantiation with severity == SERIOUS, or on a SerologyPanel resolving to REACTIVE for a RECOVERED donor; or operator-initiated via POST /eye-bank/lookback-investigations"
        actor: system
        preconditions: ["no LookbackInvestigation for this donor is in status OPEN or NOTIFIED"]
        side_effects:
          - "sets Donor.lookback_flag = true and increments Donor.version by 1"
          - "computes impacted_tissue_count via calculations.lookback_impact_set"
          - "for each CorneaTissue of this donor with disposition_status IN {ELIGIBLE, RESERVED, ISSUED}, processed in created_at ASC order, moves disposition_status to QUARANTINED with quarantine_reason = 'LOOKBACK_OPEN'"
          - "each such quarantine of a RESERVED tissue moves that tissue's RESERVED allocation to CANCELLED with cancel_reason = 'TISSUE_QUARANTINED'"
          - "each such allocation cancellation moves its SurgeonRequest ALLOCATED -> OPEN and recomputes its priority_score"
          - "each quarantine of an ISSUED tissue moves its CONFIRMED allocation to RELEASED, crediting Surgeon.credited_fee_cents, which in turn moves its SurgeonRequest ALLOCATED -> OPEN"
          - "sets quarantined_count to the number of tissues actually moved to QUARANTINED"
        note: "Tissues already IMPLANTED, DISCARDED, RELEASED_FOR_RESEARCH or RELEASED_FOR_TRAINING are counted in impacted_tissue_count but are NOT quarantined."
      - from: OPEN
        to: NOTIFIED
        trigger: "POST /eye-bank/lookback-investigations/{id}/notify"
        actor: MedicalDirector
        preconditions: ["investigation.status == OPEN"]
        side_effects:
          - "sets notified_at and notified_recipient_count"
          - "increments LookbackInvestigation.version by 1"
      - from: NOTIFIED
        to: CLOSED_NO_ACTION
        trigger: "POST /eye-bank/lookback-investigations/{id}/close with resolution == NO_ACTION"
        actor: MedicalDirector
        preconditions: ["investigation.status == NOTIFIED", "donor.serology_status != REACTIVE"]
        side_effects:
          - "sets closed_at and closure_note"
          - "sets Donor.lookback_flag = false and increments Donor.version by 1"
          - "for each CorneaTissue of this donor with disposition_status == QUARANTINED and quarantine_reason == 'LOOKBACK_OPEN' and classification IN {TRANSPLANT_OPTICAL, TRANSPLANT_THERAPEUTIC}, processed in created_at ASC order, moves disposition_status QUARANTINED -> ELIGIBLE and clears quarantine_reason"
          - "increments LookbackInvestigation.version by 1"
      - from: NOTIFIED
        to: CLOSED_WITH_RECALL
        trigger: "POST /eye-bank/lookback-investigations/{id}/close with resolution == RECALL"
        actor: MedicalDirector
        preconditions: ["investigation.status == NOTIFIED"]
        side_effects:
          - "sets closed_at and closure_note"
          - "Donor.lookback_flag REMAINS true (permanent bar) and Donor.version is incremented by 1"
          - "for each CorneaTissue of this donor with disposition_status == QUARANTINED, processed in created_at ASC order, moves disposition_status QUARANTINED -> DISCARDED with disposal_method = INCINERATION and custody_status = DESTROYED"
          - "increments LookbackInvestigation.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent entity's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: evaluation-create-stale-tissue
    parent_entity: CorneaTissue
    write_endpoint: "POST /eye-bank/tissues/{id}/evaluations"
    occ_field: "expected_tissue_version"
    description: |
      Recording a TissueEvaluation against a CorneaTissue whose version has advanced since the
      client last observed it is rejected. A new evaluation of a given method legitimately
      supersedes the prior RECORDED evaluation of that same method, so a write carrying a stale
      version would silently discard grading the client never saw. The rule is a stale-version
      check: the request must echo the tissue version it was derived from.
    error_id: ERR_STALE_TISSUE_VERSION
    http_status: 412

  - rule_id: serology-panel-create-stale-donor
    parent_entity: Donor
    write_endpoint: "POST /eye-bank/donors/{id}/serology-panels"
    occ_field: "expected_donor_version"
    description: |
      Drawing a new SerologyPanel for a Donor whose version has advanced since the client last
      observed it is rejected. A newly created panel legitimately INVALIDATES every earlier panel
      of that donor and can reset Donor.serology_status, so a write carrying a stale version
      would discard a result the client never saw. The rule is a stale-version check on
      Donor.version.
    error_id: ERR_STALE_DONOR_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: donor_recovery_window
    trigger: "on POST /eye-bank/donors (sets Donor.recovery_window_minutes and Donor.recovery_deadline_at)"
    algorithm: threshold
    formula: |
      base_window_minutes = 720 if death_time_basis == ASYSTOLE else 660
      if body_cooled_at is null:
          cooling_delay_minutes = null
          cooling_credit_minutes = 0
      else:
          cooling_delay_minutes = floor((body_cooled_at - death_at) / 60 seconds)
          cooling_credit_minutes = 240 if cooling_delay_minutes <= 240
                                   else 120 if cooling_delay_minutes <= 480
                                   else 0
      age_penalty_minutes = 60 if age_years >= 71 else 0
      recovery_window_minutes = max(360, base_window_minutes + cooling_credit_minutes - age_penalty_minutes)
      recovery_deadline_at = death_at + recovery_window_minutes
    input_set: "the Donor row alone; no other entity participates"
    constants:
      BASE_WINDOW_ASYSTOLE_MINUTES: 720
      BASE_WINDOW_PRONOUNCED_MINUTES: 660
      COOLING_CREDIT_FAST_MINUTES: 240
      COOLING_CREDIT_SLOW_MINUTES: 120
      COOLING_FAST_THRESHOLD_MINUTES: 240
      COOLING_SLOW_THRESHOLD_MINUTES: 480
      AGE_PENALTY_THRESHOLD_YEARS: 71
      AGE_PENALTY_MINUTES: 60
      WINDOW_FLOOR_MINUTES: 360
    precision: "whole minutes; recovery_deadline_at rendered with three fractional-second digits"

  - name: donor_screening_risk_score
    trigger: "on POST /eye-bank/donors/{id}/screening-records, on POST /eye-bank/serology-panels/{id}/results, and on the SerologyPanel RESULTED -> INVALIDATED transition (sets Donor.screening_risk_score and Donor.screening_risk_variant)"
    algorithm: weighted_scoring
    formula: |
      WEIGHTS = { CJD_FAMILY: 60, UNEXPLAINED_NEURO: 50, IV_DRUG_USE: 40, HIV_RISK: 35,
                  HEP_B_C_HISTORY: 30, SEPSIS: 25, INCARCERATION_12M: 15, TATTOO_12M: 10 }
      rows = every ScreeningRecord whose donor_id == donor.id   (no status filter: ScreeningRecord is append-only
             and carries at most one row per (donor_id, question_code))
      yes_sum     = sum(WEIGHTS[r.question_code] for r in rows if r.response == YES)
      unknown_sum = sum(WEIGHTS[r.question_code] for r in rows if r.response == UNKNOWN)
      # variant selection, see `variants:` below
      screening_risk_score = yes_sum                     (INTERVIEW_ONLY)
      screening_risk_score = yes_sum + unknown_sum       (POST_SEROLOGY_RECONCILED and the reconciliation
                                                          predicate below holds)
      screening_risk_score = yes_sum                     (POST_SEROLOGY_RECONCILED and the predicate fails)
      ScreeningRecord.weight_applied is set on every row of the donor to the weight that row
      actually contributed under the selected variant (0 for NO rows, and 0 for UNKNOWN rows
      whenever the reconciliation predicate fails).
      TRANSPLANT_RISK_CEILING = 50; a donor with screening_risk_score >= 50 can never yield a
      TRANSPLANT_* classification (see tissue_classification).
    input_set: "all ScreeningRecord rows of the donor; plus the donor's current (non-INVALIDATED) SerologyPanel when the POST_SEROLOGY_RECONCILED variant is selected"
    constants:
      TRANSPLANT_RISK_CEILING: 50
      HEMODILUTION_RECONCILE_PCT: 50.00
    precision: "integer points, no rounding"
    variants:
      - name: INTERVIEW_ONLY
        when: "donor.serology_status == PENDING (no RESULTED, non-INVALIDATED SerologyPanel exists for the donor)"
        difference: "UNKNOWN answers contribute 0 — the historian's uncertainty is not charged against the donor"
      - name: POST_SEROLOGY_RECONCILED
        when: "the donor has a RESULTED, non-INVALIDATED SerologyPanel"
        difference: |
          Reconciliation predicate: panel.overall_result == INDETERMINATE OR panel.hemodilution_pct > 50.00.
          When the predicate holds, every UNKNOWN answer is charged at its FULL weight, so the same
          ScreeningRecord rows yield a strictly larger score than under INTERVIEW_ONLY; when it fails,
          UNKNOWN answers still contribute 0 and the two variants agree.
    note: "The panel consulted is the donor's single non-INVALIDATED panel; when several panels exist only the newest survives (all earlier ones are INVALIDATED by the SerologyPanel state machine), so no ordering ambiguity remains."

  - name: serology_overall_result
    trigger: "on POST /eye-bank/serology-panels/{id}/results (sets SerologyPanel.overall_result and Donor.serology_status)"
    algorithm: aggregation
    formula: |
      markers = [hiv_result, hbv_result, hcv_result, syphilis_result]
      if any m in markers has m == REACTIVE:            overall_result = REACTIVE
      elif hemodilution_pct > 50.00:                    overall_result = INDETERMINATE
      elif any m in markers has m == INDETERMINATE:      overall_result = INDETERMINATE
      else:                                              overall_result = NON_REACTIVE
      Donor.serology_status = { NON_REACTIVE -> NEGATIVE, REACTIVE -> REACTIVE,
                                INDETERMINATE -> INDETERMINATE }[overall_result]
      Evaluation order is fixed: REACTIVE dominates, then the hemodilution gate, then marker
      indeterminacy. hemodilution_pct == 50.00 EXACTLY does NOT trigger the gate (strict `>`).
    input_set: "the four marker fields of this panel plus its hemodilution_pct; no other panel participates"
    constants:
      HEMODILUTION_INDETERMINATE_PCT: 50.00
    precision: "hemodilution_pct compared at two decimal places"

  - name: recovery_time_limit
    trigger: "on POST /eye-bank/recoveries/{id}/complete (sets Recovery.death_to_preservation_minutes and Recovery.time_limit_band)"
    algorithm: threshold
    formula: |
      death_to_preservation_minutes = floor((preservation_at - donor.death_at) / 60 seconds)
      band = WITHIN_STANDARD if death_to_preservation_minutes <= 720
             WITHIN_EXTENDED if 720 < death_to_preservation_minutes <= 900
             EXCEEDED        otherwise
      The request is REJECTED with ERR_PRESERVATION_WINDOW_EXCEEDED when
      preservation_at > donor.recovery_deadline_at (strict `>`; equality is accepted), so the
      EXCEEDED band is reachable only for donors whose recovery_window_minutes exceeds 900.
    input_set: "the completing Recovery and its Donor"
    constants:
      STANDARD_LIMIT_MINUTES: 720
      EXTENDED_LIMIT_MINUTES: 900
    precision: "whole minutes, floor"

  - name: technician_occupation_interval
    trigger: "on POST /eye-bank/recoveries (overlap admission check) and on POST /eye-bank/recoveries/{id}/complete (final occupation_end_at)"
    algorithm: interval_merge
    formula: |
      TECHNICIAN_TURNAROUND_MINUTES = 60
      occupation_end_at(r) = (r.preservation_at if r.status == COMPLETED else r.planned_release_at)
                             + TECHNICIAN_TURNAROUND_MINUTES
      occupation interval of r = [ r.dispatched_at , occupation_end_at(r) )      # HALF-OPEN
      candidate set for a new dispatch d on technician T =
          every Recovery r with r.technician_id == T.id AND r.status IN {DISPATCHED, ON_SITE, COMPLETED}
          (ABORTED recoveries are excluded)
      conflict(d, r) := d.dispatched_at < occupation_end_at(r) AND r.dispatched_at < occupation_end_at(d)
      A new dispatch is rejected with ERR_TECHNICIAN_DISPATCH_OVERLAP when conflict(d, r) holds for
      any r in the candidate set. Adjacency is legal: d.dispatched_at == occupation_end_at(r)
      produces NO conflict because the interval is half-open on the right.
    input_set: "all non-ABORTED Recovery rows of the target technician"
    constants:
      TECHNICIAN_TURNAROUND_MINUTES: 60
    precision: "instant comparison at millisecond resolution"

  - name: tissue_shelf_life
    trigger: "on CorneaTissue creation during POST /eye-bank/recoveries/{id}/complete (PROVISIONAL_AT_RECOVERY) and on POST /eye-bank/tissues/{id}/classify (FINAL_AT_CLASSIFICATION); sets shelf_life_hours, shelf_life_variant and expires_at"
    algorithm: decay_function
    formula: |
      MEDIUM_SHELF_LIFE_HOURS = { OPTISOL_GS: 336, LIFE4C: 264 }
      band_penalty_hours   = 48 if recovery.time_limit_band == WITHIN_EXTENDED else 0
      cooling_penalty_hours = 72 if (donor.body_cooled_at is null
                                     OR floor((donor.body_cooled_at - donor.death_at)/60s) > 480) else 0
      ecd_penalty_hours    = 24 if (RECORDED SPECULAR evaluation exists AND
                                    its endothelial_cell_count < 2200) else 0
      # variant selection, see `variants:`
      shelf_life_hours = MEDIUM_SHELF_LIFE_HOURS[preservation_medium] - band_penalty_hours     (PROVISIONAL_AT_RECOVERY)
      shelf_life_hours = MEDIUM_SHELF_LIFE_HOURS[preservation_medium] - band_penalty_hours
                         - cooling_penalty_hours - ecd_penalty_hours                            (FINAL_AT_CLASSIFICATION)
      shelf_life_hours = max(24, shelf_life_hours)
      expires_at = preserved_at + shelf_life_hours
    input_set: "the tissue, its Recovery (for time_limit_band and preservation_medium), its Donor (for cooling) and, under the final variant, the tissue's RECORDED SPECULAR TissueEvaluation"
    constants:
      OPTISOL_GS_SHELF_LIFE_HOURS: 336
      LIFE4C_SHELF_LIFE_HOURS: 264
      EXTENDED_BAND_PENALTY_HOURS: 48
      COOLING_PENALTY_HOURS: 72
      COOLING_PENALTY_THRESHOLD_MINUTES: 480
      LOW_ECD_PENALTY_HOURS: 24
      LOW_ECD_THRESHOLD: 2200
      SHELF_LIFE_FLOOR_HOURS: 24
    precision: "whole hours; expires_at rendered with three fractional-second digits"
    variants:
      - name: PROVISIONAL_AT_RECOVERY
        when: "tissue.disposition_status == UNGRADED (from creation until classification)"
        difference: "Charges only the recovery-window penalty; the donor cooling history and the endothelial count are deliberately ignored because grading has not happened yet, so this variant is always >= the final variant"
      - name: FINAL_AT_CLASSIFICATION
        when: "tissue.disposition_status != UNGRADED (from POST /tissues/{id}/classify onwards)"
        difference: "Additionally charges 72 h when the body was never cooled or cooling started more than 480 min after death, and 24 h when the RECORDED SPECULAR endothelial_cell_count is below 2200; for the same tissue data this produces a strictly EARLIER expires_at than the provisional variant whenever either penalty applies"
    note: "Once FINAL_AT_CLASSIFICATION has been applied the value is frozen; a later re-evaluation does not move expires_at."

  - name: tissue_quality_score
    trigger: "on POST /eye-bank/tissues/{id}/classify (sets CorneaTissue.tissue_quality_score)"
    algorithm: weighted_scoring
    formula: |
      slit = the tissue's RECORDED TissueEvaluation with method == SLIT_LAMP
      spec = the tissue's RECORDED TissueEvaluation with method == SPECULAR
      (exactly one RECORDED evaluation exists per method because a newer evaluation of the same
       method supersedes the older one)
      ecd_points      = min(40, max(0, floor((spec.endothelial_cell_count - 1800) / 50)))
      clarity_points  = 25 - 5 * slit.stromal_clarity_grade
      epithelium_points = 15 - 4 * slit.epithelium_defect_grade
      folds_points    = 10 - 3 * slit.dm_folds_grade
      guttata_points  = 10 - 5 * spec.guttata_grade
      age_adjust      = -8 if donor.age_years >= 71
                        else 0 if donor.age_years >= 46
                        else 5
      raw = ecd_points + clarity_points + epithelium_points + folds_points + guttata_points + age_adjust
      tissue_quality_score = max(0, min(100, raw))
    input_set: "the two RECORDED evaluations of the tissue (one per method) plus the Donor's age_years"
    constants:
      ECD_BASELINE: 1800
      ECD_POINTS_PER_STEP: 50
      ECD_POINTS_CAP: 40
      CLARITY_BASE_POINTS: 25
      CLARITY_POINTS_PER_GRADE: 5
      EPITHELIUM_BASE_POINTS: 15
      EPITHELIUM_POINTS_PER_GRADE: 4
      FOLDS_BASE_POINTS: 10
      FOLDS_POINTS_PER_GRADE: 3
      GUTTATA_BASE_POINTS: 10
      GUTTATA_POINTS_PER_GRADE: 5
      AGE_PENALTY_THRESHOLD_YEARS: 71
      AGE_PENALTY_POINTS: -8
      AGE_BONUS_CEILING_YEARS: 46
      AGE_BONUS_POINTS: 5
    precision: "integer points; the floor division and the min/max clamps are applied in exactly the order written"

  - name: tissue_classification
    trigger: "on POST /eye-bank/tissues/{id}/classify (sets CorneaTissue.classification and the resulting disposition_status)"
    algorithm: constraint_propagation
    formula: |
      Ordered decision table — the FIRST matching row wins, no later row is consulted:
       1. donor.serology_status == REACTIVE                                     -> UNSUITABLE
       2. donor.consent_scope == RESEARCH_ONLY                                   -> RESEARCH
       3. donor.consent_scope == TRAINING_ONLY                                   -> TRAINING
       4. donor.screening_risk_score >= 50                                       -> RESEARCH
       5. donor.serology_status == INDETERMINATE                                 -> RESEARCH
       6. recovery.time_limit_band == EXCEEDED                                   -> UNSUITABLE
       7. tissue_quality_score >= 70 AND spec.endothelial_cell_count >= 2000
          AND recovery.time_limit_band == WITHIN_STANDARD                        -> TRANSPLANT_OPTICAL
       8. tissue_quality_score >= 45 AND spec.endothelial_cell_count >= 1800     -> TRANSPLANT_THERAPEUTIC
       9. donor.consent_scope == TRANSPLANT_AND_RESEARCH                         -> RESEARCH
      10. otherwise                                                              -> UNSUITABLE
      Rows 2 and 3 fire even when the quality score would support transplant, because consent
      caps the permitted use. Rows 4 and 5 fire even when consent permits transplant.
      disposition_status mapping applied in the same request:
        TRANSPLANT_OPTICAL | TRANSPLANT_THERAPEUTIC -> ELIGIBLE
        RESEARCH  -> RELEASED_FOR_RESEARCH
        TRAINING  -> RELEASED_FOR_TRAINING
        UNSUITABLE -> DISCARDED (with disposal_method = INCINERATION and custody_status = DESTROYED)
    input_set: "the tissue, its two RECORDED evaluations, its Recovery and its Donor"
    constants:
      OPTICAL_QUALITY_FLOOR: 70
      OPTICAL_ECD_FLOOR: 2000
      THERAPEUTIC_QUALITY_FLOOR: 45
      THERAPEUTIC_ECD_FLOOR: 1800
      TRANSPLANT_RISK_CEILING: 50
    precision: "integer comparisons; every floor is inclusive (`>=`)"

  - name: request_priority_score
    trigger: "on POST /eye-bank/surgeon-requests, on the SurgeonRequest ALLOCATED -> OPEN transition, and at the start of every POST /eye-bank/allocation-runs (sets base_score, priority_tier, priority_score)"
    algorithm: tiered_pricing
    formula: |
      # THREE PINNED STEPS. The tier is selected from base_score ONLY. priority_score is never
      # fed back into step 2, even though priority_score can land in a higher tier's band.
      step 1: urgency_weight = 30 if urgency == URGENT else 10
              days_to_surgery = floor((surgery_date - clock_now) / 86400 seconds)
              surgery_proximity_points = 40 if days_to_surgery <= 2
                                         25 if 3 <= days_to_surgery <= 7
                                         10 if 8 <= days_to_surgery <= 21
                                         0  otherwise
              base_score = urgency_weight + surgery_proximity_points
      step 2: priority_tier = PLATINUM if base_score >= 60
                              GOLD     if 40 <= base_score < 60
                              STANDARD otherwise
      step 3: TIER_BONUS = { PLATINUM: 15, GOLD: 8, STANDARD: 0 }
              priority_score = base_score + TIER_BONUS[priority_tier]
      Worked counter-example proving the order matters: urgency == URGENT with
      days_to_surgery == 4 gives base_score 55 -> GOLD -> priority_score 63. Re-deriving the tier
      from 63 would yield PLATINUM and a priority_score of 70; that re-derivation is FORBIDDEN.
    input_set: "the SurgeonRequest row and the logical clock at evaluation time"
    constants:
      URGENCY_WEIGHT_URGENT: 30
      URGENCY_WEIGHT_ROUTINE: 10
      PROXIMITY_IMMINENT_DAYS: 2
      PROXIMITY_IMMINENT_POINTS: 40
      PROXIMITY_NEAR_DAYS: 7
      PROXIMITY_NEAR_POINTS: 25
      PROXIMITY_FAR_DAYS: 21
      PROXIMITY_FAR_POINTS: 10
      TIER_PLATINUM_FLOOR: 60
      TIER_GOLD_FLOOR: 40
      TIER_BONUS_PLATINUM: 15
      TIER_BONUS_GOLD: 8
      TIER_BONUS_STANDARD: 0
    precision: "integer; days_to_surgery uses floor and may be negative"

  - name: allocation_selector
    trigger: "on POST /eye-bank/allocation-runs"
    algorithm: waterfall_allocation
    formula: |
      STEP 0 — expiry sweep: every SurgeonRequest with status == OPEN and
        surgery_date <= clock_now moves OPEN -> EXPIRED and its id joins expired_request_ids.
      STEP 1 — request candidate set (eligibility filter, explicit predicates only):
        request.status == OPEN
        AND surgeon.credential_status == ACTIVE
        AND request.surgery_date > clock_now
      STEP 2 — request processing order (ranking expression):
        priority_score DESC, then surgery_date ASC, then SurgeonRequest.created_at ASC
        (created_at is the final tie-break; SurgeonRequest.id is NEVER consulted)
      STEP 3 — tissue candidate pool, recomputed before each request is served:
        tissue.disposition_status == ELIGIBLE
        AND tissue.custody_status IN {IN_HOUSE, RETURNED_TO_BANK}
        AND tissue.classification IN {TRANSPLANT_OPTICAL, TRANSPLANT_THERAPEUTIC}
        AND tissue.reissue_generation <= 1
        AND tissue.expires_at > clock_now
        AND donor.lookback_flag == false
        AND tissue not already reserved earlier in this same run
      STEP 4 — per-pair match filter:
        spec.endothelial_cell_count >= request.min_ecd
        AND donor.age_years <= request.max_donor_age_years
        AND (request.laterality_preference == ANY OR tissue.laterality == request.laterality_preference)
        AND request.procedure_type IN ALLOWED_PROCEDURES[tissue.classification]
        AND tissue.expires_at >= request.surgery_date
      STEP 5 — tissue choice within one request (expiry-driven ranking):
        expires_at ASC (the soonest-expiring matching tissue is issued first), then
        spec.endothelial_cell_count ASC (the weakest acceptable tissue is spent first, preserving
        the best tissue for a later request), then CorneaTissue.created_at ASC
      STEP 6 — fallbacks:
        a request whose STEP-4 result is empty stays OPEN and its id joins unmatched_request_ids;
        when EVERY request in STEP 1 ends with an empty STEP-4 result (including the case where
        STEP 1 or STEP 3 is itself empty), the whole run is rejected with
        ERR_NO_ELIGIBLE_TISSUE (422) and NO state change of any kind is persisted.
      ALLOWED_PROCEDURES = { TRANSPLANT_OPTICAL: [PK, DSAEK, DMEK, THERAPEUTIC],
                             TRANSPLANT_THERAPEUTIC: [THERAPEUTIC, PK] }
      Each matched pair creates an Allocation with source = RUN exactly as POST /eye-bank/allocations
      would, including processing_fee_cents from allocation_processing_fee.
    input_set: "all SurgeonRequest rows with status == OPEN and all CorneaTissue rows passing STEP 3; the STEP-0 sweep runs before any matching"
    constants:
      ALLOWED_PROCEDURES_OPTICAL: "[PK, DSAEK, DMEK, THERAPEUTIC]"
      ALLOWED_PROCEDURES_THERAPEUTIC: "[THERAPEUTIC, PK]"
    precision: "integer comparisons; instant comparisons at millisecond resolution"

  - name: allocation_processing_fee
    trigger: "on Allocation creation (POST /eye-bank/allocations and POST /eye-bank/allocation-runs); sets Allocation.processing_fee_cents"
    algorithm: tiered_pricing
    formula: |
      BASE_FEE_CENTS = { TRANSPLANT_OPTICAL: 245000, TRANSPLANT_THERAPEUTIC: 189000 }
      base = BASE_FEE_CENTS[allocation.reserved_classification_snapshot]
      days_to_surgery = floor((request.surgery_date - clock_now) / 86400 seconds)
      # ROUNDING ORDER IS PINNED: each surcharge is rounded to the whole cent INDEPENDENTLY
      # (round_half_up) and only THEN are the rounded surcharges summed. Summing the raw
      # percentages first and rounding once is FORBIDDEN and yields a different total.
      urgency_surcharge      = round_half_up(base * 0.0725) if request.urgency == URGENT else 0
      procedure_surcharge    = round_half_up(base * 0.0425) if request.procedure_type IN {DMEK, DSAEK} else 0
      short_notice_surcharge = round_half_up(base * 0.0175) if days_to_surgery <= 2 else 0
      processing_fee_cents = base + urgency_surcharge + procedure_surcharge + short_notice_surcharge
      Worked counter-example: base 245000 with all three surcharges applicable gives
      17762.5 -> 17763, 10412.5 -> 10413 and 4287.5 -> 4288, summing to 32464 and a total of
      277464. Summing first (245000 * 0.1325 = 32462.5 -> 32463) would give 277463 — one cent less.
    input_set: "the Allocation's reserved_classification_snapshot, its SurgeonRequest's urgency and procedure_type, and the logical clock at reservation time"
    constants:
      BASE_FEE_OPTICAL_CENTS: 245000
      BASE_FEE_THERAPEUTIC_CENTS: 189000
      URGENCY_SURCHARGE_RATE: 0.0725
      PROCEDURE_SURCHARGE_RATE: 0.0425
      SHORT_NOTICE_SURCHARGE_RATE: 0.0175
      SHORT_NOTICE_DAYS: 2
    precision: "whole cents, round_half_up, applied PER SURCHARGE COMPONENT before summation"

  - name: shipment_integrity_verdict
    trigger: "on POST /eye-bank/shipments/{id}/deliver (sets min_temp_c, max_temp_c, temp_excursion_minutes_over, integrity_verdict)"
    algorithm: interval_merge
    formula: |
      ACCEPTABLE_MIN_C = 2.0 ; ACCEPTABLE_MAX_C = 8.0
      included = every TemperatureReading of this shipment with
                 shipped_at <= recorded_at <= delivered_at (BOTH bounds inclusive),
                 ordered by recorded_at ASC, tie-break TemperatureReading.created_at ASC
      min_temp_c = min(r.temperature_c for r in included)
      max_temp_c = max(r.temperature_c for r in included)
      out_of_range(r) := r.temperature_c < 2.0 OR r.temperature_c > 8.0     (strict)
      An excursion SEGMENT is a maximal run of consecutive included readings that are all
      out_of_range. Its duration is:
          (recorded_at of the LAST reading of the run)
        - (recorded_at of the included reading IMMEDIATELY BEFORE the run,
           or shipped_at when the run starts at the first included reading)
      temp_excursion_minutes_over = sum over segments of floor(duration / 60 seconds)
      integrity_verdict = PASS            if temp_excursion_minutes_over == 0
                          EXCURSION_MINOR if 1 <= temp_excursion_minutes_over <= 45
                                             AND max_temp_c <= 12.0 AND min_temp_c >= -5.0
                          EXCURSION_MAJOR otherwise
      Boundary: 45 minutes exactly is MINOR; 46 minutes is MAJOR.
    input_set: "every TemperatureReading of this shipment inside the inclusive [shipped_at, delivered_at] window; readings outside the window are rejected at write time"
    constants:
      ACCEPTABLE_MIN_C: 2.0
      ACCEPTABLE_MAX_C: 8.0
      MINOR_MAX_MINUTES: 45
      MINOR_TEMP_CEILING_C: 12.0
      MINOR_TEMP_FLOOR_C: -5.0
    precision: "temperatures at one decimal place; durations floored to whole minutes"

  - name: surgeon_fee_ledger
    trigger: "on the Allocation RESERVED -> CONFIRMED transition and on the Allocation CONFIRMED -> RELEASED transition (sets Surgeon.gross_billed_cents, Surgeon.credited_fee_cents, Surgeon.outstanding_fee_cents)"
    algorithm: aggregation
    formula: |
      allocs = every Allocation whose request.surgeon_id == surgeon.id
      gross_billed_cents  = sum(a.processing_fee_cents for a in allocs
                                if a.status IN {CONFIRMED, CONSUMED, RELEASED})
      credited_fee_cents  = sum(a.processing_fee_cents for a in allocs if a.status == RELEASED)
      outstanding_fee_cents = gross_billed_cents - credited_fee_cents
      CONSERVED QUANTITY (money): for every Surgeon, at every observable instant,
          outstanding_fee_cents + credited_fee_cents == gross_billed_cents
      COMPENSATION INVARIANT: a CONFIRM (forward action) followed by its compensating RELEASE
      (unused-tissue return, or a cold-chain rejection) leaves outstanding_fee_cents at EXACTLY
      its pre-confirm value and increases credited_fee_cents by EXACTLY that allocation's
      processing_fee_cents; gross_billed_cents never decreases.
      A RESERVED -> CANCELLED allocation never enters any of the three sums.
    input_set: "all Allocation rows reachable through this surgeon's SurgeonRequest rows, filtered by the status sets above"
    constants: {}
    precision: "whole cents, exact integer arithmetic"

  - name: tissue_availability_ledger
    trigger: "recomputed on demand by GET /eye-bank/tissues (the filtered-list total_count) after every disposition_status change"
    algorithm: aggregation
    formula: |
      available_units = count(CorneaTissue where disposition_status == ELIGIBLE
                              AND custody_status IN {IN_HOUSE, RETURNED_TO_BANK})
      committed_units = count(CorneaTissue where disposition_status IN {RESERVED, ISSUED})
      held_units      = count(CorneaTissue where disposition_status == QUARANTINED)
      retired_units   = count(CorneaTissue where disposition_status IN {IMPLANTED, DISCARDED,
                              RELEASED_FOR_RESEARCH, RELEASED_FOR_TRAINING})
      graded_units    = count(CorneaTissue where disposition_status != UNGRADED)
      CONSERVED QUANTITY (unit count):
          available_units + committed_units + held_units + retired_units == graded_units
      COMPENSATION INVARIANT: a reservation (forward action, ELIGIBLE -> RESERVED) followed by its
      compensating cancellation (RESERVED -> ELIGIBLE) restores available_units to EXACTLY its
      pre-reservation value and leaves committed_units at EXACTLY its pre-reservation value; no
      unit is created or destroyed by the round trip.
      A tissue in custody IN_TRANSIT or AT_SURGEON is always counted in committed_units, never in
      available_units, so the two dimensions cannot double-count the same row.
    input_set: "all CorneaTissue rows; the counts are exposed through GET /eye-bank/tissues filtered by disposition_status, reading total_count from the pagination envelope"
    constants: {}
    precision: "exact integer counts"

  - name: lookback_impact_set
    trigger: "on LookbackInvestigation creation (sets impacted_tissue_count, quarantined_count) and on POST /eye-bank/lookback-investigations/{id}/notify (sets notified_recipient_count)"
    algorithm: topological
    formula: |
      donor_tissues = every CorneaTissue whose donor_id == investigation.donor_id,
                      traversed in CorneaTissue.created_at ASC order (never id order)
      impacted_tissue_count = count(donor_tissues)                    # every tissue, no status filter
      quarantinable = [ t in donor_tissues if t.disposition_status IN {ELIGIBLE, RESERVED} ]
      (an ISSUED tissue is already out of the bank's hands: it is reported through the
       investigation's notified_recipient_count instead of being quarantined in place)
      quarantined_count = count(quarantinable)                        # all of them are moved to QUARANTINED
      At notification time, walking donor_tissues -> Allocation -> SurgeonRequest -> Surgeon:
      notified_recipient_count = count of DISTINCT Surgeon rows holding at least one Allocation on
        an impacted tissue whose status IN {RESERVED, CONFIRMED, CONSUMED, RELEASED}
        (CANCELLED allocations are excluded)
    input_set: "all CorneaTissue rows of the donor, then their Allocation rows filtered by the status set above, then those allocations' SurgeonRequest.surgeon_id values de-duplicated"
    constants: {}
    precision: "exact integer counts; traversal order pinned to created_at ASC"

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST failing rule determines the response)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six roles declared in 1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the called endpoint's roles list in 1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "for an entity_backed role, X-User-ID resolves to an existing row of the backing entity (Technician for RecoveryTechnician and EvaluationTechnician, Surgeon for Surgeon)"
    error_id: ERR_UNKNOWN_ACTOR
    http_status: 403
    applies_to: "all endpoints whose roles include RecoveryTechnician, EvaluationTechnician or Surgeon"

  - priority: 4
    category: existence
    check: "every id in the request path resolves, validated left-to-right"
    error_id: "ERR_DONOR_NOT_FOUND | ERR_SEROLOGY_PANEL_NOT_FOUND | ERR_TECHNICIAN_NOT_FOUND | ERR_RECOVERY_NOT_FOUND | ERR_TISSUE_NOT_FOUND | ERR_SURGEON_NOT_FOUND | ERR_REQUEST_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_INVESTIGATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 5
    category: existence
    check: "every foreign key supplied in the request BODY resolves (donor_id, technician_id, evaluator_technician_id, surgeon_id, tissue_id, request_id, allocation_id, replaces_shipment_id)"
    error_id: "ERR_DONOR_NOT_FOUND | ERR_TECHNICIAN_NOT_FOUND | ERR_SURGEON_NOT_FOUND | ERR_TISSUE_NOT_FOUND | ERR_REQUEST_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /eye-bank/recoveries, POST /eye-bank/tissues/{id}/evaluations, POST /eye-bank/surgeon-requests, POST /eye-bank/allocations, POST /eye-bank/shipments, POST /eye-bank/adverse-reaction-reports"

  - priority: 6
    category: business_constraint
    check: "request body conforms to the endpoint's input schema: required fields present, enums in range, numerics inside their declared bounds, datetimes ISO-8601 UTC with exactly three fractional digits, and the per-method TissueEvaluation grade fields present/absent as declared"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 7
    category: business_constraint
    check: "pagination parameters are in range: 1 <= limit <= 100 and offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "GET /eye-bank/tissues, GET /eye-bank/donors, GET /eye-bank/recoveries, GET /eye-bank/allocations, GET /eye-bank/shipments, GET /eye-bank/surgeon-requests, GET /eye-bank/adverse-reaction-reports, GET /eye-bank/lookback-investigations"

  - priority: 8
    category: business_constraint
    check: "expected_tissue_version equals CorneaTissue.version (OCC per concurrency_rules[evaluation-create-stale-tissue])"
    error_id: ERR_STALE_TISSUE_VERSION
    http_status: 412
    applies_to: "POST /eye-bank/tissues/{id}/evaluations"

  - priority: 9
    category: business_constraint
    check: "expected_donor_version equals Donor.version (OCC per concurrency_rules[serology-panel-create-stale-donor])"
    error_id: ERR_STALE_DONOR_VERSION
    http_status: 412
    applies_to: "POST /eye-bank/donors/{id}/serology-panels"

  - priority: 10
    category: auth
    check: "for RecoveryTechnician actions on a Recovery, X-User-ID == recovery.technician_id; for EvaluationTechnician, X-User-ID == the body's evaluator_technician_id; for Surgeon actions on a SurgeonRequest, Shipment, Allocation or CorneaTissue, X-User-ID == the surgeon_id reachable from that resource"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /eye-bank/recoveries/{id}/arrive, POST /eye-bank/recoveries/{id}/complete, POST /eye-bank/recoveries/{id}/abort, POST /eye-bank/tissues/{id}/evaluations, POST /eye-bank/surgeon-requests, POST /eye-bank/surgeon-requests/{id}/cancel, POST /eye-bank/shipments/{id}/deliver, POST /eye-bank/tissues/{id}/implant, POST /eye-bank/tissues/{id}/return, POST /eye-bank/adverse-reaction-reports"

  - priority: 11
    category: state
    check: "Donor.status permits the operation (see the Donor state machine's from-states)"
    error_id: ERR_DONOR_STATE_INVALID
    http_status: 409
    applies_to: "POST /eye-bank/donors/{id}/consent, POST /eye-bank/donors/{id}/approve-recovery, POST /eye-bank/donors/{id}/defer, POST /eye-bank/donors/{id}/reinstate, POST /eye-bank/recoveries"

  - priority: 12
    category: state
    check: "SerologyPanel.status == DRAWN"
    error_id: ERR_PANEL_STATE_INVALID
    http_status: 409
    applies_to: "POST /eye-bank/serology-panels/{id}/results"

  - priority: 13
    category: state
    check: "Recovery.status permits the operation (DISPATCHED for arrive; ON_SITE for complete; DISPATCHED or ON_SITE for abort)"
    error_id: ERR_RECOVERY_STATE_INVALID
    http_status: 409
    applies_to: "POST /eye-bank/recoveries/{id}/arrive, POST /eye-bank/recoveries/{id}/complete, POST /eye-bank/recoveries/{id}/abort"

  - priority: 14
    category: state
    check: "CorneaTissue.disposition_status is a legal from-state for the requested dimension-A transition"
    error_id: ERR_TISSUE_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /eye-bank/tissues/{id}/classify, POST /eye-bank/tissues/{id}/quarantine, POST /eye-bank/tissues/{id}/release-quarantine, POST /eye-bank/tissues/{id}/discard, POST /eye-bank/tissues/{id}/implant, POST /eye-bank/tissues/{id}/return, POST /eye-bank/allocations, POST /eye-bank/tissues/{id}/evaluations"

  - priority: 15
    category: state
    check: "CorneaTissue.custody_status is a legal from-state for the requested dimension-B transition"
    error_id: ERR_TISSUE_CUSTODY_INVALID
    http_status: 409
    applies_to: "POST /eye-bank/tissues/{id}/implant, POST /eye-bank/tissues/{id}/return, POST /eye-bank/shipments/{id}/dispatch, POST /eye-bank/allocations"

  - priority: 16
    category: state
    check: "SurgeonRequest.status permits the operation (OPEN for allocation; OPEN or ALLOCATED for cancel)"
    error_id: ERR_REQUEST_STATE_INVALID
    http_status: 409
    applies_to: "POST /eye-bank/allocations, POST /eye-bank/surgeon-requests/{id}/cancel"

  - priority: 17
    category: state
    check: "Allocation.status permits the operation (RESERVED for confirm and cancel; CONFIRMED for shipment creation and dispatch)"
    error_id: ERR_ALLOCATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /eye-bank/allocations/{id}/confirm, POST /eye-bank/allocations/{id}/cancel, POST /eye-bank/shipments, POST /eye-bank/shipments/{id}/dispatch, POST /eye-bank/surgeon-requests/{id}/cancel"

  - priority: 18
    category: state
    check: "Shipment.status permits the operation (PREPARED for dispatch; PREPARED or IN_TRANSIT for temperature readings; IN_TRANSIT for deliver)"
    error_id: ERR_SHIPMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /eye-bank/shipments/{id}/dispatch, POST /eye-bank/shipments/{id}/deliver, POST /eye-bank/shipments/{id}/temperature-readings"

  - priority: 19
    category: state
    check: "AdverseReactionReport.status == SUBMITTED"
    error_id: ERR_REPORT_STATE_INVALID
    http_status: 409
    applies_to: "POST /eye-bank/adverse-reaction-reports/{id}/substantiate, POST /eye-bank/adverse-reaction-reports/{id}/dismiss"

  - priority: 20
    category: state
    check: "LookbackInvestigation.status permits the operation (OPEN for notify; NOTIFIED for close)"
    error_id: ERR_INVESTIGATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /eye-bank/lookback-investigations/{id}/notify, POST /eye-bank/lookback-investigations/{id}/close"

  - priority: 21
    category: business_safety
    check: "the donor's consent_scope is not NONE, and it permits the use the operation implies (transplant classification and every allocation require consent_scope IN {TRANSPLANT_ONLY, TRANSPLANT_AND_RESEARCH}; a TRAINING_ONLY or RESEARCH_ONLY donor's tissue can never be allocated to a surgeon request)"
    error_id: ERR_CONSENT_SCOPE_VIOLATION
    http_status: 422
    applies_to: "POST /eye-bank/recoveries/{id}/complete, POST /eye-bank/tissues/{id}/classify, POST /eye-bank/allocations, POST /eye-bank/allocation-runs"

  - priority: 22
    category: business_safety
    check: "the tissue's donor has serology_status != REACTIVE"
    error_id: ERR_SEROLOGY_REACTIVE
    http_status: 422
    applies_to: "POST /eye-bank/donors/{id}/approve-recovery, POST /eye-bank/donors/{id}/reinstate, POST /eye-bank/tissues/{id}/release-quarantine, POST /eye-bank/allocations"

  - priority: 23
    category: business_safety
    check: "the tissue's donor has serology_status != PENDING (a RESULTED, non-INVALIDATED SerologyPanel exists)"
    error_id: ERR_SEROLOGY_PENDING
    http_status: 422
    applies_to: "POST /eye-bank/tissues/{id}/classify"

  - priority: 24
    category: business_safety
    check: "the tissue's donor has lookback_flag == false"
    error_id: ERR_DONOR_UNDER_LOOKBACK
    http_status: 422
    applies_to: "POST /eye-bank/tissues/{id}/classify, POST /eye-bank/tissues/{id}/release-quarantine, POST /eye-bank/allocations, POST /eye-bank/allocation-runs"

  - priority: 25
    category: business_safety
    check: "the receiving surgeon has credential_status == ACTIVE"
    error_id: ERR_SURGEON_NOT_CREDENTIALED
    http_status: 422
    applies_to: "POST /eye-bank/surgeon-requests, POST /eye-bank/allocations, POST /eye-bank/allocations/{id}/confirm, POST /eye-bank/shipments/{id}/dispatch"

  - priority: 26
    category: business_safety
    check: "the evaluator_technician_id differs from the technician_id of the Recovery that produced the tissue (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /eye-bank/tissues/{id}/evaluations"

  - priority: 27
    category: business_safety
    check: "the acting technician has status == ACTIVE, certification_expires_at > logical clock now, and certification_level == RECOVERY_AND_EVAL when grading tissue"
    error_id: ERR_TECHNICIAN_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /eye-bank/recoveries, POST /eye-bank/tissues/{id}/evaluations"

  - priority: 28
    category: business_safety
    check: "both a RECORDED SLIT_LAMP evaluation and a RECORDED SPECULAR evaluation exist for the tissue"
    error_id: ERR_EVALUATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /eye-bank/tissues/{id}/classify"

  - priority: 29
    category: business_safety
    check: "when intended_use_override == TRANSPLANT, the donor's screening_risk_score is below the TRANSPLANT_RISK_CEILING of 50"
    error_id: ERR_SCREENING_RISK_TOO_HIGH
    http_status: 422
    applies_to: "POST /eye-bank/tissues/{id}/classify"

  - priority: 30
    category: business_temporal
    check: "Donor.death_at <= logical clock now"
    error_id: ERR_DEATH_TIME_IN_FUTURE
    http_status: 422
    applies_to: "POST /eye-bank/donors"

  - priority: 31
    category: business_temporal
    check: "preservation_at <= donor.recovery_deadline_at (equality accepted, strict `>` rejected)"
    error_id: ERR_PRESERVATION_WINDOW_EXCEEDED
    http_status: 422
    applies_to: "POST /eye-bank/recoveries/{id}/complete"

  - priority: 32
    category: business_temporal
    check: "the new dispatch's half-open occupation interval does not overlap any non-ABORTED occupation interval of the same technician (see calculations.technician_occupation_interval)"
    error_id: ERR_TECHNICIAN_DISPATCH_OVERLAP
    http_status: 409
    applies_to: "POST /eye-bank/recoveries"

  - priority: 33
    category: business_temporal
    check: "SurgeonRequest.surgery_date > logical clock now"
    error_id: ERR_SURGERY_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /eye-bank/surgeon-requests"

  - priority: 34
    category: business_temporal
    check: "CorneaTissue.expires_at > logical clock now"
    error_id: ERR_TISSUE_EXPIRED
    http_status: 422
    applies_to: "POST /eye-bank/allocations, POST /eye-bank/tissues/{id}/implant"

  - priority: 35
    category: business_temporal
    check: "CorneaTissue.expires_at >= SurgeonRequest.surgery_date (the tissue must still be viable on the scheduled surgery date)"
    error_id: ERR_EXPIRY_BEFORE_SURGERY_DATE
    http_status: 422
    applies_to: "POST /eye-bank/allocations, POST /eye-bank/allocations/{id}/confirm, POST /eye-bank/shipments/{id}/dispatch"

  - priority: 36
    category: business_referential
    check: "TemperatureReading.recorded_at lies inside the shipment's monitoring window: >= the shipment's created_at, and — once shipped_at is set — <= shipped_at + 168 hours (for a PREPARED shipment shipped_at is still null, so only the lower bound is enforced)"
    error_id: ERR_READING_OUTSIDE_SHIPMENT_WINDOW
    http_status: 422
    applies_to: "POST /eye-bank/shipments/{id}/temperature-readings"

  - priority: 37
    category: business_referential
    check: "replaces_shipment_id, when supplied, references a Shipment with status == RETURNED whose allocation's tissue_id equals the new shipment's allocation's tissue_id"
    error_id: ERR_INVALID_REISSUE_SOURCE
    http_status: 422
    applies_to: "POST /eye-bank/shipments"

  - priority: 38
    category: business_referential
    check: "the reported tissue has disposition_status == IMPLANTED and its CONSUMED allocation's request.surgeon_id equals the body's surgeon_id"
    error_id: ERR_REPORT_TISSUE_NOT_IMPLANTED_BY_SURGEON
    http_status: 422
    applies_to: "POST /eye-bank/adverse-reaction-reports"

  - priority: 39
    category: business_referential
    check: "shipment.integrity_verdict IN {PASS, EXCURSION_MINOR}"
    error_id: ERR_SHIPMENT_INTEGRITY_FAILED
    http_status: 422
    applies_to: "POST /eye-bank/tissues/{id}/implant"

  - priority: 40
    category: business_constraint
    check: "the tissue's classification permits the request's procedure_type per ALLOWED_PROCEDURES; and the tissue's classification IN {TRANSPLANT_OPTICAL, TRANSPLANT_THERAPEUTIC}"
    error_id: ERR_PROCEDURE_CLASSIFICATION_MISMATCH
    http_status: 422
    applies_to: "POST /eye-bank/allocations"

  - priority: 41
    category: business_constraint
    check: "the tissue's RECORDED SPECULAR endothelial_cell_count >= request.min_ecd"
    error_id: ERR_ECD_BELOW_REQUEST_MINIMUM
    http_status: 422
    applies_to: "POST /eye-bank/allocations"

  - priority: 42
    category: business_constraint
    check: "donor.age_years <= request.max_donor_age_years"
    error_id: ERR_DONOR_AGE_ABOVE_REQUEST_MAX
    http_status: 422
    applies_to: "POST /eye-bank/allocations"

  - priority: 43
    category: business_constraint
    check: "the tissue has reissue_generation <= 1 (a tissue returned twice can never be issued again)"
    error_id: ERR_REISSUE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /eye-bank/allocations, POST /eye-bank/shipments/{id}/dispatch"

  - priority: 44
    category: business_constraint
    check: "the donor_code is not already used by another Donor"
    error_id: ERR_DUPLICATE_DONOR_CODE
    http_status: 409
    applies_to: "POST /eye-bank/donors"

  - priority: 45
    category: business_constraint
    check: "no ScreeningRecord already exists for this (donor_id, question_code) pair"
    error_id: ERR_DUPLICATE_SCREENING_ANSWER
    http_status: 409
    applies_to: "POST /eye-bank/donors/{id}/screening-records"

  - priority: 46
    category: business_constraint
    check: "the surgeon holds at most 1 other Allocation with status IN {RESERVED, CONFIRMED, CONSUMED} whose request.surgery_date falls on the same UTC calendar date as this request's surgery_date (aggregate capacity 2 grafts per surgeon per day bucket)"
    error_id: ERR_SURGEON_DAY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /eye-bank/allocations, POST /eye-bank/allocations/{id}/confirm"

  - priority: 47
    category: business_constraint
    check: "the shipment being dispatched has at least one TemperatureReading"
    error_id: ERR_NO_TEMPERATURE_BASELINE
    http_status: 422
    applies_to: "POST /eye-bank/shipments/{id}/dispatch"

  - priority: 48
    category: business_constraint
    check: "the allocation run produced at least one match across all eligible requests (empty-pool fallback)"
    error_id: ERR_NO_ELIGIBLE_TISSUE
    http_status: 422
    applies_to: "POST /eye-bank/allocation-runs"

  - priority: 49
    category: business_temporal
    check: "the requested logical-clock instant is >= the current logical-clock instant (the clock never rewinds)"
    error_id: ERR_CLOCK_REWIND_FORBIDDEN
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

# =============================================================================
# 1.5 API Endpoint Table  (all business paths under api_prefix /eye-bank;
#     the single test-driving endpoint lives under the /_ namespace)
# =============================================================================
endpoints:

  # --- Donor referral, screening, consent -----------------------------------
  - method: POST
    path: "/eye-bank/donors"
    description: "Register a donor referral. Computes recovery_window_minutes and recovery_deadline_at from death_at, death_time_basis, body_cooled_at and cause_of_death_category."
    roles: [EyeBankCoordinator]
    code: 201
    input: [donor_code, referral_source, death_at, death_time_basis, "body_cooled_at?", age_years, cause_of_death_category]
    output: Donor
    side_effects:
      - "runs calculations.donor_recovery_window -> recovery_window_minutes, recovery_deadline_at"
      - "sets status = REFERRED, consent_type = NONE, consent_scope = NONE, serology_status = PENDING, screening_risk_score = 0, screening_risk_variant = INTERVIEW_ONLY, lookback_flag = false, tissues_recovered_count = 0"
      - "sets version = 1"

  - method: GET
    path: "/eye-bank/donors/{id}"
    description: "Read one donor, including its computed recovery window, screening risk, serology status and lookback flag."
    roles: [EyeBankCoordinator, LabTechnician, MedicalDirector, RecoveryTechnician, EvaluationTechnician]
    code: 200
    input: []
    output: Donor
    side_effects: []

  - method: GET
    path: "/eye-bank/donors"
    description: "List donors, newest created_at first, optionally filtered by status or lookback_flag."
    roles: [EyeBankCoordinator, LabTechnician, MedicalDirector]
    code: 200
    input: ["status?", "lookback_flag?", "limit?", "offset?"]
    output: Donor[]
    side_effects: []

  - method: POST
    path: "/eye-bank/donors/{id}/screening-records"
    description: "Record one medical/social-history answer for the donor. The donor's FIRST screening record moves REFERRED -> SCREENING."
    roles: [EyeBankCoordinator]
    code: 201
    input: [question_code, response, historian_relationship]
    output: ScreeningRecord
    side_effects:
      - "sets recorded_by_user_id from X-User-ID"
      - "runs calculations.donor_screening_risk_score -> donor.screening_risk_score (variant INTERVIEW_ONLY while donor.serology_status == PENDING)"
      - "on the first record for the donor: donor.status REFERRED -> SCREENING"
      - "increments Donor.version by 1"

  - method: GET
    path: "/eye-bank/donors/{id}/screening-records"
    description: "List the donor's screening answers with the risk weight each contributed."
    roles: [EyeBankCoordinator, LabTechnician, MedicalDirector]
    code: 200
    input: []
    output: ScreeningRecord[]
    side_effects: []

  - method: POST
    path: "/eye-bank/donors/{id}/consent"
    description: "Record authorization. Moves SCREENING -> CONSENT_OBTAINED and fixes the consent scope that gates every downstream use of the donor's tissue."
    roles: [EyeBankCoordinator]
    code: 200
    input: [consent_type, consent_scope, authorizing_party_name]
    output: Donor
    side_effects:
      - "sets consent_type, consent_scope, authorizing_party_name, consent_obtained_at = logical clock now"
      - "status SCREENING -> CONSENT_OBTAINED"
      - "increments Donor.version by 1"

  - method: POST
    path: "/eye-bank/donors/{id}/defer"
    description: "Defer a donor pending more information. Legal from SCREENING, CONSENT_OBTAINED or APPROVED_FOR_RECOVERY."
    roles: [EyeBankCoordinator, MedicalDirector]
    code: 200
    input: [deferral_reason]
    output: Donor
    side_effects:
      - "sets deferral_reason; status -> DEFERRED"
      - "increments Donor.version by 1"

  - method: POST
    path: "/eye-bank/donors/{id}/reinstate"
    description: "Return a DEFERRED donor to SCREENING (the cycle edge). Clears deferral_reason; consent already captured is retained."
    roles: [MedicalDirector]
    code: 200
    input: []
    output: Donor
    side_effects:
      - "sets deferral_reason = null; status DEFERRED -> SCREENING"
      - "increments Donor.version by 1"

  - method: POST
    path: "/eye-bank/donors/{id}/approve-recovery"
    description: "Medical-director release of the donor for recovery. Moves CONSENT_OBTAINED -> APPROVED_FOR_RECOVERY."
    roles: [MedicalDirector]
    code: 200
    input: []
    output: Donor
    side_effects:
      - "status CONSENT_OBTAINED -> APPROVED_FOR_RECOVERY"
      - "increments Donor.version by 1"

  # --- Serologic testing ----------------------------------------------------
  - method: POST
    path: "/eye-bank/donors/{id}/serology-panels"
    description: "Draw a serology specimen for the donor. OCC-guarded on the donor: expected_donor_version must equal the donor's current version. Creating a newer panel invalidates every earlier panel for that donor."
    roles: [LabTechnician]
    code: 201
    input: [specimen_type, drawn_at, hemodilution_pct, expected_donor_version]
    output: SerologyPanel
    side_effects:
      - "every earlier panel of the same donor: status -> INVALIDATED and superseded_at = logical clock now"
      - "donor.serology_status -> PENDING"
      - "increments Donor.version by 1"
      - "sets donor_version_after = donor.version after this write"

  - method: GET
    path: "/eye-bank/donors/{id}/serology-panels"
    description: "List the donor's serology panels, newest drawn_at first, including invalidated ones."
    roles: [EyeBankCoordinator, LabTechnician, MedicalDirector]
    code: 200
    input: []
    output: SerologyPanel[]
    side_effects: []

  - method: POST
    path: "/eye-bank/serology-panels/{id}/results"
    description: "Post the four marker results for a DRAWN panel. Resolves overall_result and republishes the donor's serology_status; a REACTIVE result rules the donor out and, if the donor is already RECOVERED, opens a lookback investigation."
    roles: [LabTechnician]
    code: 200
    input: [hiv_result, hbv_result, hcv_result, syphilis_result]
    output: SerologyPanel
    side_effects:
      - "runs calculations.serology_overall_result -> overall_result; status DRAWN -> RESULTED; resulted_at = logical clock now"
      - "donor.serology_status = NEGATIVE | REACTIVE | INDETERMINATE mirroring overall_result"
      - "re-runs calculations.donor_screening_risk_score with variant POST_SEROLOGY_RECONCILED -> donor.screening_risk_score, donor.screening_risk_variant"
      - "on REACTIVE for a donor in SCREENING, CONSENT_OBTAINED, APPROVED_FOR_RECOVERY or DEFERRED: donor.status -> RULED_OUT"
      - "on REACTIVE for a RECOVERED donor: creates LookbackInvestigation(trigger_reason = POSITIVE_RETEST, status = OPEN) and runs the OPEN cascade of calculations.lookback_impact_set"
      - "increments Donor.version by 1"

  # --- Technicians ----------------------------------------------------------
  - method: POST
    path: "/eye-bank/technicians"
    description: "Register a recovery/evaluation technician with a certification level and expiry."
    roles: [EyeBankCoordinator]
    code: 201
    input: [full_name, certification_level, certification_expires_at]
    output: Technician
    side_effects:
      - "sets status = ACTIVE, open_dispatch_count = 0"

  - method: GET
    path: "/eye-bank/technicians/{id}"
    description: "Read one technician, including the number of dispatches currently occupying them."
    roles: [EyeBankCoordinator, MedicalDirector, RecoveryTechnician, EvaluationTechnician]
    code: 200
    input: []
    output: Technician
    side_effects: []

  - method: POST
    path: "/eye-bank/technicians/{id}/status"
    description: "Activate or deactivate a technician. An INACTIVE technician can neither be dispatched nor grade tissue."
    roles: [EyeBankCoordinator]
    code: 200
    input: [status]
    output: Technician
    side_effects:
      - "sets status"
      - "increments Technician.version by 1"

  - method: GET
    path: "/eye-bank/technicians/{id}/tissue-evaluations"
    description: "List every tissue evaluation this technician performed, newest performed_at first."
    roles: [EyeBankCoordinator, MedicalDirector, EvaluationTechnician]
    code: 200
    input: []
    output: TissueEvaluation[]
    side_effects: []

  # --- Recovery dispatch ----------------------------------------------------
  - method: POST
    path: "/eye-bank/recoveries"
    description: "Dispatch a technician to recover from an APPROVED_FOR_RECOVERY donor. Rejects a dispatch whose occupation interval overlaps another live dispatch of the same technician."
    roles: [EyeBankCoordinator]
    code: 201
    input: [donor_id, technician_id, dispatched_at, planned_release_at]
    output: Recovery
    side_effects:
      - "runs calculations.technician_occupation_interval -> occupation_end_at"
      - "sets status = DISPATCHED"
      - "increments technician.open_dispatch_count by 1"
      - "increments Technician.version by 1"

  - method: GET
    path: "/eye-bank/recoveries/{id}"
    description: "Read one recovery, including its death-to-preservation minutes and time-limit band."
    roles: [EyeBankCoordinator, MedicalDirector, RecoveryTechnician, EvaluationTechnician]
    code: 200
    input: []
    output: Recovery
    side_effects: []

  - method: GET
    path: "/eye-bank/recoveries"
    description: "List recoveries, newest dispatched_at first, optionally filtered by donor, technician or status."
    roles: [EyeBankCoordinator, MedicalDirector, RecoveryTechnician]
    code: 200
    input: ["donor_id?", "technician_id?", "status?", "limit?", "offset?"]
    output: Recovery[]
    side_effects: []

  - method: POST
    path: "/eye-bank/recoveries/{id}/arrive"
    description: "The dispatched technician marks arrival on site. Moves DISPATCHED -> ON_SITE."
    roles: [RecoveryTechnician]
    code: 200
    input: [arrival_at]
    output: Recovery
    side_effects:
      - "sets arrival_at; status DISPATCHED -> ON_SITE"
      - "increments Recovery.version by 1"

  - method: POST
    path: "/eye-bank/recoveries/{id}/complete"
    description: "Record preservation. Rejects preservation_at strictly after the donor's recovery_deadline_at. On success creates one CorneaTissue per recovered laterality with a PROVISIONAL_AT_RECOVERY shelf life."
    roles: [RecoveryTechnician]
    code: 200
    input: [preservation_at, preservation_medium, recovered_lateralities]
    output: Recovery
    side_effects:
      - "runs calculations.recovery_time_limit -> death_to_preservation_minutes, time_limit_band"
      - "status ON_SITE -> COMPLETED; sets preservation_at, preservation_medium, recovered_lateralities"
      - "creates one CorneaTissue per member of recovered_lateralities with disposition_status = UNGRADED, custody_status = IN_HOUSE, preserved_at = preservation_at, issue_count = 0, reissue_generation = 0"
      - "runs calculations.tissue_shelf_life variant PROVISIONAL_AT_RECOVERY on each new tissue -> shelf_life_hours, expires_at, shelf_life_variant"
      - "donor.status APPROVED_FOR_RECOVERY -> RECOVERED; donor.tissues_recovered_count = number of tissues created"
      - "decrements technician.open_dispatch_count by 1"
      - "increments Recovery.version, Donor.version and Technician.version by 1 each"

  - method: POST
    path: "/eye-bank/recoveries/{id}/abort"
    description: "Abort a dispatch before preservation. Legal from DISPATCHED or ON_SITE; frees the technician's occupation interval."
    roles: [RecoveryTechnician, EyeBankCoordinator]
    code: 200
    input: [abort_reason]
    output: Recovery
    side_effects:
      - "sets abort_reason; status -> ABORTED; the recovery no longer occupies the technician"
      - "decrements technician.open_dispatch_count by 1"
      - "donor.status is unchanged (the donor stays APPROVED_FOR_RECOVERY and may be re-dispatched)"
      - "increments Recovery.version and Technician.version by 1 each"

  # --- Tissue evaluation, classification and disposition --------------------
  - method: GET
    path: "/eye-bank/tissues/{id}"
    description: "Read one cornea tissue, including both state dimensions, quality score, classification, shelf-life variant and expiry."
    roles: [EyeBankCoordinator, LabTechnician, MedicalDirector, EvaluationTechnician, Surgeon]
    code: 200
    input: []
    output: CorneaTissue
    side_effects: []

  - method: GET
    path: "/eye-bank/tissues"
    description: "List cornea tissues, newest preserved_at first, optionally filtered by donor, recovery, disposition or custody."
    roles: [EyeBankCoordinator, MedicalDirector, EvaluationTechnician, Surgeon]
    code: 200
    input: ["donor_id?", "recovery_id?", "disposition_status?", "custody_status?", "limit?", "offset?"]
    output: CorneaTissue[]
    side_effects: []

  - method: POST
    path: "/eye-bank/tissues/{id}/evaluations"
    description: "Record a slit-lamp or specular evaluation. OCC-guarded on the tissue: expected_tissue_version must equal the tissue's current version. SLIT_LAMP requires epithelium_defect_grade, stromal_clarity_grade and dm_folds_grade and forbids guttata_grade and endothelial_cell_count; SPECULAR requires guttata_grade and endothelial_cell_count and forbids the three slit-lamp grades. A newer evaluation of the SAME method supersedes the older one (status -> SUPERSEDED)."
    roles: [EvaluationTechnician]
    code: 201
    input: [evaluator_technician_id, method, performed_at, "epithelium_defect_grade?", "stromal_clarity_grade?", "dm_folds_grade?", "guttata_grade?", "endothelial_cell_count?", expected_tissue_version]
    output: TissueEvaluation
    side_effects:
      - "sets status = RECORDED"
      - "increments CorneaTissue.version by 1"
      - "sets tissue_version_after = the tissue's version after this write"

  - method: GET
    path: "/eye-bank/tissues/{id}/evaluations"
    description: "List the tissue's evaluations, newest performed_at first."
    roles: [EyeBankCoordinator, MedicalDirector, EvaluationTechnician]
    code: 200
    input: []
    output: TissueEvaluation[]
    side_effects: []

  - method: POST
    path: "/eye-bank/tissues/{id}/classify"
    description: "Medical-director classification of an UNGRADED tissue. Requires one RECORDED SLIT_LAMP and one RECORDED SPECULAR evaluation. Recomputes the shelf life under the FINAL_AT_CLASSIFICATION variant, which may shorten expires_at."
    roles: [MedicalDirector]
    code: 200
    input: ["intended_use_override?"]
    output: CorneaTissue
    side_effects:
      - "runs calculations.tissue_quality_score -> tissue_quality_score"
      - "runs calculations.tissue_classification -> classification"
      - "runs calculations.tissue_shelf_life variant FINAL_AT_CLASSIFICATION -> shelf_life_hours, expires_at, shelf_life_variant = FINAL_AT_CLASSIFICATION"
      - "disposition_status UNGRADED -> ELIGIBLE | RELEASED_FOR_RESEARCH | RELEASED_FOR_TRAINING | DISCARDED per classification"
      - "on classification == UNSUITABLE: custody_status IN_HOUSE -> DESTROYED and disposal_method = INCINERATION"
      - "runs calculations.tissue_availability_ledger"
      - "increments CorneaTissue.version by 1"

  - method: POST
    path: "/eye-bank/tissues/{id}/quarantine"
    description: "Quarantine an ELIGIBLE or RESERVED tissue. Cancels any RESERVED allocation on it, which reopens the surgeon request."
    roles: [MedicalDirector, EyeBankCoordinator]
    code: 200
    input: [quarantine_reason]
    output: CorneaTissue
    side_effects:
      - "sets quarantine_reason; disposition_status -> QUARANTINED"
      - "any RESERVED allocation on this tissue: status -> CANCELLED with cancel_reason = TISSUE_QUARANTINED, and its request.status ALLOCATED -> OPEN"
      - "runs calculations.tissue_availability_ledger"
      - "increments CorneaTissue.version by 1"

  - method: POST
    path: "/eye-bank/tissues/{id}/release-quarantine"
    description: "Return a QUARANTINED tissue to ELIGIBLE. Refused while the donor is REACTIVE or under lookback."
    roles: [MedicalDirector]
    code: 200
    input: []
    output: CorneaTissue
    side_effects:
      - "sets quarantine_reason = null; disposition_status QUARANTINED -> ELIGIBLE"
      - "runs calculations.tissue_availability_ledger"
      - "increments CorneaTissue.version by 1"

  - method: POST
    path: "/eye-bank/tissues/{id}/discard"
    description: "Dispose of a tissue. Legal from ELIGIBLE, QUARANTINED, RELEASED_FOR_RESEARCH (disposal_method must be RESEARCH_TRANSFER) or RELEASED_FOR_TRAINING."
    roles: [MedicalDirector, EyeBankCoordinator]
    code: 200
    input: [disposal_method]
    output: CorneaTissue
    side_effects:
      - "sets disposal_method; disposition_status -> DISCARDED; custody_status -> DESTROYED"
      - "runs calculations.tissue_availability_ledger"
      - "increments CorneaTissue.version by 1"

  - method: POST
    path: "/eye-bank/tissues/{id}/implant"
    description: "The receiving surgeon confirms the graft. Requires disposition_status == ISSUED, custody_status == AT_SURGEON, an unexpired tissue and a shipment integrity_verdict in {PASS, EXCURSION_MINOR}. Consumes the allocation, fulfils the request and credits the processing fee."
    roles: [Surgeon]
    code: 200
    input: []
    output: CorneaTissue
    side_effects:
      - "disposition_status ISSUED -> IMPLANTED; custody_status stays AT_SURGEON"
      - "the tissue's CONFIRMED allocation: status -> CONSUMED; its request.status ALLOCATED -> FULFILLED"
      - "per calculations.surgeon_fee_ledger the allocation moves from CONFIRMED to CONSUMED, so surgeon.gross_billed_cents, surgeon.credited_fee_cents and surgeon.outstanding_fee_cents are all UNCHANGED by implantation"
      - "runs calculations.tissue_availability_ledger"
      - "increments CorneaTissue.version, Allocation.version, SurgeonRequest.version and Surgeon.version by 1 each"

  - method: POST
    path: "/eye-bank/tissues/{id}/return"
    description: "The surgeon returns unused tissue. A PASS shipment and a still-unexpired tissue return it to ELIGIBLE and increment reissue_generation; otherwise it lands in QUARANTINED."
    roles: [Surgeon]
    code: 200
    input: [return_reason]
    output: CorneaTissue
    side_effects:
      - "custody_status AT_SURGEON -> RETURNED_TO_BANK; the delivering shipment: status DELIVERED -> RETURNED"
      - "on shipment.integrity_verdict == PASS and expires_at > logical clock now: disposition_status ISSUED -> ELIGIBLE and reissue_generation increments by 1"
      - "otherwise: disposition_status ISSUED -> QUARANTINED with quarantine_reason = return_reason"
      - "the tissue's CONFIRMED allocation: status -> RELEASED; its request.status ALLOCATED -> OPEN"
      - "runs calculations.surgeon_fee_ledger: the allocation moves CONFIRMED -> RELEASED, so surgeon.credited_fee_cents increases by allocation.processing_fee_cents and surgeon.outstanding_fee_cents decreases by the same amount; surgeon.gross_billed_cents is unchanged"
      - "runs calculations.tissue_availability_ledger"
      - "increments CorneaTissue.version, Shipment.version, Allocation.version, SurgeonRequest.version and Surgeon.version by 1 each"

  # --- Surgeons and their requests ------------------------------------------
  - method: POST
    path: "/eye-bank/surgeons"
    description: "Register a transplanting surgeon at a center with a declared specialty."
    roles: [EyeBankCoordinator]
    code: 201
    input: [full_name, center_code, specialty]
    output: Surgeon
    side_effects:
      - "sets credential_status = ACTIVE, gross_billed_cents = 0, credited_fee_cents = 0, outstanding_fee_cents = 0, substantiated_reaction_count = 0"

  - method: GET
    path: "/eye-bank/surgeons/{id}"
    description: "Read one surgeon, including the three money-ledger fields and the substantiated-reaction count."
    roles: [EyeBankCoordinator, MedicalDirector, Surgeon]
    code: 200
    input: []
    output: Surgeon
    side_effects: []

  - method: POST
    path: "/eye-bank/surgeons/{id}/credential-status"
    description: "Set a surgeon's credential status. Only an ACTIVE surgeon may open requests, hold allocations or receive shipments."
    roles: [MedicalDirector]
    code: 200
    input: [credential_status]
    output: Surgeon
    side_effects:
      - "sets credential_status"
      - "increments Surgeon.version by 1"

  - method: GET
    path: "/eye-bank/surgeons/{id}/requests"
    description: "List the surgeon's tissue requests, highest priority_score first then earliest created_at."
    roles: [EyeBankCoordinator, MedicalDirector, Surgeon]
    code: 200
    input: []
    output: SurgeonRequest[]
    side_effects: []

  - method: POST
    path: "/eye-bank/surgeon-requests"
    description: "Open a tissue request for a future surgery date. Computes base_score, priority_tier and the tier-adjusted priority_score used by allocation."
    roles: [Surgeon, EyeBankCoordinator]
    code: 201
    input: [surgeon_id, procedure_type, surgery_date, min_ecd, max_donor_age_years, laterality_preference, urgency]
    output: SurgeonRequest
    side_effects:
      - "runs calculations.request_priority_score -> base_score, priority_tier, priority_score"
      - "sets status = OPEN"

  - method: GET
    path: "/eye-bank/surgeon-requests/{id}"
    description: "Read one surgeon request, including its computed priority tier and score."
    roles: [EyeBankCoordinator, MedicalDirector, Surgeon]
    code: 200
    input: []
    output: SurgeonRequest
    side_effects: []

  - method: GET
    path: "/eye-bank/surgeon-requests"
    description: "List surgeon requests, highest priority_score first then earliest created_at, optionally filtered by surgeon or status."
    roles: [EyeBankCoordinator, MedicalDirector]
    code: 200
    input: ["surgeon_id?", "status?", "limit?", "offset?"]
    output: SurgeonRequest[]
    side_effects: []

  - method: POST
    path: "/eye-bank/surgeon-requests/{id}/cancel"
    description: "Cancel an OPEN or ALLOCATED request. An ALLOCATED request's RESERVED allocation is cancelled and its tissue returns to ELIGIBLE."
    roles: [Surgeon, EyeBankCoordinator]
    code: 200
    input: [cancel_reason]
    output: SurgeonRequest
    side_effects:
      - "sets cancel_reason; status -> CANCELLED"
      - "any RESERVED allocation for this request: status -> CANCELLED with cancel_reason = REQUEST_CANCELLED, and its tissue.disposition_status RESERVED -> ELIGIBLE"
      - "per calculations.surgeon_fee_ledger a RESERVED -> CANCELLED allocation never entered any ledger sum, so all three of the surgeon's money fields are UNCHANGED"
      - "runs calculations.tissue_availability_ledger"
      - "increments SurgeonRequest.version by 1"

  # --- Allocation -----------------------------------------------------------
  - method: POST
    path: "/eye-bank/allocations"
    description: "Manually reserve one ELIGIBLE tissue against one OPEN request. Enforces consent scope, serology, lookback, credentialing, procedure/classification compatibility, ECD floor, donor-age ceiling, expiry-vs-surgery-date and the surgeon's per-day graft capacity."
    roles: [EyeBankCoordinator]
    code: 201
    input: [tissue_id, request_id]
    output: Allocation
    side_effects:
      - "sets allocated_at = logical clock now, status = RESERVED, source = MANUAL"
      - "snapshots reserved_ecd_snapshot from the tissue's RECORDED SPECULAR endothelial_cell_count and reserved_classification_snapshot from tissue.classification"
      - "runs calculations.allocation_processing_fee -> processing_fee_cents and calculations.tissue_shelf_life-derived expiry_margin_hours"
      - "tissue.disposition_status ELIGIBLE -> RESERVED; tissue.issue_count is unchanged until dispatch"
      - "request.status OPEN -> ALLOCATED"
      - "per calculations.surgeon_fee_ledger a RESERVED allocation enters no ledger sum, so surgeon.gross_billed_cents, surgeon.credited_fee_cents and surgeon.outstanding_fee_cents all stay at their previous values"
      - "runs calculations.tissue_availability_ledger"
      - "increments CorneaTissue.version and SurgeonRequest.version by 1 each"

  - method: POST
    path: "/eye-bank/allocation-runs"
    description: "Run the expiry-driven allocation selector over every OPEN request and every ELIGIBLE tissue. Expires requests whose surgery_date has passed, then matches greedily in request-priority order per calculations.allocation_selector."
    roles: [EyeBankCoordinator]
    code: 200
    input: []
    output: "{ run_at: datetime, allocations_created: integer, allocation_ids: string[], unmatched_request_ids: string[], expired_request_ids: string[] }"
    side_effects:
      - "every OPEN request with surgery_date <= logical clock now: status -> EXPIRED (reported in expired_request_ids)"
      - "runs calculations.allocation_selector and creates one Allocation per match with source = RUN, status = RESERVED"
      - "each matched tissue: disposition_status ELIGIBLE -> RESERVED; each matched request: status OPEN -> ALLOCATED"
      - "runs calculations.allocation_processing_fee for every match and calculations.tissue_availability_ledger once; the surgeon money ledger is untouched because every allocation the run creates is RESERVED"
      - "increments the version of every tissue and request it touched by 1"

  - method: GET
    path: "/eye-bank/allocations/{id}"
    description: "Read one allocation, including its fee, expiry margin and the ECD/classification snapshot taken at reservation."
    roles: [EyeBankCoordinator, MedicalDirector, Surgeon]
    code: 200
    input: []
    output: Allocation
    side_effects: []

  - method: GET
    path: "/eye-bank/allocations"
    description: "List allocations, newest allocated_at first, optionally filtered by tissue, request or status."
    roles: [EyeBankCoordinator, MedicalDirector, Surgeon]
    code: 200
    input: ["tissue_id?", "request_id?", "status?", "limit?", "offset?"]
    output: Allocation[]
    side_effects: []

  - method: POST
    path: "/eye-bank/allocations/{id}/confirm"
    description: "Confirm a RESERVED allocation for shipping. Re-checks credentialing, expiry-vs-surgery-date and per-day capacity at confirmation time."
    roles: [EyeBankCoordinator]
    code: 200
    input: []
    output: Allocation
    side_effects:
      - "status RESERVED -> CONFIRMED"
      - "runs calculations.surgeon_fee_ledger: surgeon.gross_billed_cents and surgeon.outstanding_fee_cents each increase by allocation.processing_fee_cents; surgeon.credited_fee_cents is unchanged"
      - "increments Allocation.version and Surgeon.version by 1 each"

  - method: POST
    path: "/eye-bank/allocations/{id}/cancel"
    description: "Cancel a RESERVED allocation. Releases the tissue back to ELIGIBLE and reopens the request."
    roles: [EyeBankCoordinator]
    code: 200
    input: [cancel_reason]
    output: Allocation
    side_effects:
      - "sets cancel_reason; status RESERVED -> CANCELLED"
      - "tissue.disposition_status RESERVED -> ELIGIBLE; request.status ALLOCATED -> OPEN"
      - "per calculations.surgeon_fee_ledger a RESERVED -> CANCELLED allocation never entered any ledger sum, so all three of the surgeon's money fields are UNCHANGED"
      - "runs calculations.tissue_availability_ledger"
      - "increments Allocation.version, CorneaTissue.version and SurgeonRequest.version by 1 each"

  # --- Shipping with temperature monitoring ---------------------------------
  - method: POST
    path: "/eye-bank/shipments"
    description: "Prepare a shipment for a CONFIRMED allocation. replaces_shipment_id makes it a re-issue of a RETURNED shipment for the same tissue."
    roles: [EyeBankCoordinator]
    code: 201
    input: [allocation_id, "replaces_shipment_id?", carrier]
    output: Shipment
    side_effects:
      - "sets status = PREPARED; shipped_at, delivered_at, min_temp_c, max_temp_c, temp_excursion_minutes_over and integrity_verdict stay null"

  - method: GET
    path: "/eye-bank/shipments/{id}"
    description: "Read one shipment, including its temperature envelope, excursion minutes and integrity verdict."
    roles: [EyeBankCoordinator, MedicalDirector, Surgeon]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/eye-bank/shipments"
    description: "List shipments, newest created_at first, optionally filtered by allocation, by the shipment they replace, or by status."
    roles: [EyeBankCoordinator, MedicalDirector, Surgeon]
    code: 200
    input: ["allocation_id?", "replaces_shipment_id?", "status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: POST
    path: "/eye-bank/shipments/{id}/temperature-readings"
    description: "Append a temperature reading to a PREPARED or IN_TRANSIT shipment. The reading that precedes dispatch is the required baseline."
    roles: [EyeBankCoordinator, Surgeon]
    code: 201
    input: [recorded_at, temperature_c]
    output: TemperatureReading
    side_effects:
      - "recomputes shipment.min_temp_c and shipment.max_temp_c over all readings"
      - "increments Shipment.version by 1"

  - method: GET
    path: "/eye-bank/shipments/{id}/temperature-readings"
    description: "List the shipment's temperature readings in ascending recorded_at order."
    roles: [EyeBankCoordinator, MedicalDirector, Surgeon]
    code: 200
    input: []
    output: TemperatureReading[]
    side_effects: []

  - method: POST
    path: "/eye-bank/shipments/{id}/dispatch"
    description: "Hand a PREPARED shipment to the carrier. Requires a CONFIRMED allocation, an ACTIVE surgeon, at least one temperature reading, a tissue that is still viable on the surgery date, and reissue_generation <= 1."
    roles: [EyeBankCoordinator]
    code: 200
    input: [shipped_at]
    output: Shipment
    side_effects:
      - "sets shipped_at; status PREPARED -> IN_TRANSIT"
      - "tissue.disposition_status RESERVED -> ISSUED; tissue.custody_status IN_HOUSE (or RETURNED_TO_BANK on a re-issue) -> IN_TRANSIT; tissue.issue_count increments by 1"
      - "runs calculations.tissue_availability_ledger"
      - "increments Shipment.version and CorneaTissue.version by 1 each"

  - method: POST
    path: "/eye-bank/shipments/{id}/deliver"
    description: "The receiving surgeon acknowledges arrival. Computes the integrity verdict from the recorded temperature series; EXCURSION_MAJOR rejects the shipment on arrival and sends the tissue back into quarantine."
    roles: [Surgeon]
    code: 200
    input: [delivered_at]
    output: Shipment
    side_effects:
      - "sets delivered_at; runs calculations.shipment_integrity_verdict -> min_temp_c, max_temp_c, temp_excursion_minutes_over, integrity_verdict"
      - "on PASS or EXCURSION_MINOR: status IN_TRANSIT -> DELIVERED and tissue.custody_status IN_TRANSIT -> AT_SURGEON"
      - "on EXCURSION_MAJOR: status IN_TRANSIT -> REJECTED_ON_ARRIVAL, tissue.custody_status IN_TRANSIT -> RETURNED_TO_BANK, tissue.disposition_status ISSUED -> QUARANTINED with quarantine_reason = SHIPMENT_EXCURSION_MAJOR, the CONFIRMED allocation -> RELEASED, and its request.status ALLOCATED -> OPEN"
      - "on EXCURSION_MAJOR: runs calculations.surgeon_fee_ledger — the allocation moves CONFIRMED -> RELEASED, so surgeon.credited_fee_cents increases by allocation.processing_fee_cents and surgeon.outstanding_fee_cents decreases by the same amount"
      - "runs calculations.tissue_availability_ledger"
      - "increments Shipment.version and CorneaTissue.version by 1 each, plus Allocation.version, SurgeonRequest.version and Surgeon.version on EXCURSION_MAJOR"

  # --- Adverse reaction reporting and lookback ------------------------------
  - method: POST
    path: "/eye-bank/adverse-reaction-reports"
    description: "The implanting surgeon reports an adverse reaction. Only allowed for a tissue this surgeon actually implanted."
    roles: [Surgeon]
    code: 201
    input: [tissue_id, surgeon_id, reaction_type, severity, narrative]
    output: AdverseReactionReport
    side_effects:
      - "sets reported_at = logical clock now, status = SUBMITTED"

  - method: GET
    path: "/eye-bank/adverse-reaction-reports/{id}"
    description: "Read one adverse reaction report, including its adjudication note."
    roles: [EyeBankCoordinator, MedicalDirector, Surgeon]
    code: 200
    input: []
    output: AdverseReactionReport
    side_effects: []

  - method: GET
    path: "/eye-bank/adverse-reaction-reports"
    description: "List adverse reaction reports, newest reported_at first, optionally filtered by tissue, surgeon or status."
    roles: [EyeBankCoordinator, MedicalDirector, Surgeon]
    code: 200
    input: ["tissue_id?", "surgeon_id?", "status?", "limit?", "offset?"]
    output: AdverseReactionReport[]
    side_effects: []

  - method: POST
    path: "/eye-bank/adverse-reaction-reports/{id}/substantiate"
    description: "Medical-director adjudication upholding the report. A SERIOUS substantiated report opens a lookback investigation on the donor and quarantines every still-recoverable sibling tissue."
    roles: [MedicalDirector]
    code: 200
    input: [adjudication_note]
    output: AdverseReactionReport
    side_effects:
      - "sets adjudication_note; status SUBMITTED -> SUBSTANTIATED"
      - "increments surgeon.substantiated_reaction_count by 1"
      - "on severity == SERIOUS: donor.lookback_flag = true and creates LookbackInvestigation(donor_id = the tissue's donor, source_report_id = this report, trigger_reason = ADVERSE_REACTION, status = OPEN)"
      - "on severity == SERIOUS: runs the OPEN cascade of calculations.lookback_impact_set -> impacted_tissue_count, quarantined_count, and quarantines every impacted ELIGIBLE or RESERVED sibling tissue (cancelling their RESERVED allocations and reopening those requests)"
      - "increments AdverseReactionReport.version, Surgeon.version and Donor.version by 1 each"

  - method: POST
    path: "/eye-bank/adverse-reaction-reports/{id}/dismiss"
    description: "Medical-director adjudication rejecting the report. No lookback is opened and no tissue is quarantined."
    roles: [MedicalDirector]
    code: 200
    input: [adjudication_note]
    output: AdverseReactionReport
    side_effects:
      - "sets adjudication_note; status SUBMITTED -> UNSUBSTANTIATED"
      - "increments AdverseReactionReport.version by 1"

  - method: POST
    path: "/eye-bank/lookback-investigations"
    description: "Operator-initiated lookback on a donor (post-donation information arriving outside the adverse-reaction and retest paths). Sets the donor's lookback flag and runs the same OPEN cascade as the system-created path."
    roles: [MedicalDirector]
    code: 201
    input: [donor_id, "source_report_id?"]
    output: LookbackInvestigation
    side_effects:
      - "sets opened_at = logical clock now, status = OPEN, trigger_reason = ADVERSE_REACTION when source_report_id is supplied and POSITIVE_RETEST otherwise"
      - "donor.lookback_flag = true"
      - "runs the OPEN cascade of calculations.lookback_impact_set -> impacted_tissue_count, quarantined_count, and quarantines every impacted ELIGIBLE or RESERVED tissue of the donor (cancelling their RESERVED allocations and reopening those requests)"
      - "increments Donor.version by 1"

  - method: GET
    path: "/eye-bank/lookback-investigations/{id}"
    description: "Read one lookback investigation, including impacted, quarantined and notified counts."
    roles: [EyeBankCoordinator, MedicalDirector]
    code: 200
    input: []
    output: LookbackInvestigation
    side_effects: []

  - method: GET
    path: "/eye-bank/lookback-investigations"
    description: "List lookback investigations, newest opened_at first, optionally filtered by donor, source report or status."
    roles: [EyeBankCoordinator, MedicalDirector]
    code: 200
    input: ["donor_id?", "source_report_id?", "status?", "limit?", "offset?"]
    output: LookbackInvestigation[]
    side_effects: []

  - method: POST
    path: "/eye-bank/lookback-investigations/{id}/notify"
    description: "Record that every recipient surgeon reachable from the donor's distributed tissue has been notified. Moves OPEN -> NOTIFIED."
    roles: [MedicalDirector]
    code: 200
    input: []
    output: LookbackInvestigation
    side_effects:
      - "sets notified_at = logical clock now; status OPEN -> NOTIFIED"
      - "sets notified_recipient_count = the number of distinct surgeons holding an ISSUED, IMPLANTED or RETURNED-tissue allocation for this donor"
      - "increments LookbackInvestigation.version by 1"

  - method: POST
    path: "/eye-bank/lookback-investigations/{id}/close"
    description: "Close a NOTIFIED investigation. resolution == NO_ACTION clears the donor's lookback flag and returns every tissue quarantined by this investigation to ELIGIBLE; resolution == RECALL keeps the flag and discards them."
    roles: [MedicalDirector]
    code: 200
    input: [resolution, closure_note]
    output: LookbackInvestigation
    side_effects:
      - "sets closure_note, closed_at = logical clock now"
      - "on resolution == NO_ACTION: status NOTIFIED -> CLOSED_NO_ACTION, donor.lookback_flag = false, and every tissue this investigation quarantined moves QUARANTINED -> ELIGIBLE"
      - "on resolution == RECALL: status NOTIFIED -> CLOSED_WITH_RECALL, donor.lookback_flag stays true, and every tissue this investigation quarantined moves QUARANTINED -> DISCARDED with disposal_method = INCINERATION and custody_status -> DESTROYED"
      - "runs calculations.tissue_availability_ledger"
      - "increments LookbackInvestigation.version, Donor.version and every affected CorneaTissue.version by 1"

  # --- Test-driving endpoint (§1.5 priority ladder rung 3) -------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to any instant. The logical clock is the ONLY source of 'now' for every deadline, expiry, window and day-bucket rule in this API. Its startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the clock reads that instant and MUST NOT fall back to real wall-clock time. The clock never rewinds: to_iso8601 must be greater than or equal to the current logical instant."
    roles: [EyeBankCoordinator, MedicalDirector]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "sets the logical clock to to_iso8601; no entity is mutated and no derived field is recomputed"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  # --- auth / identity ------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six roles in §1.7"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_UNKNOWN_ACTOR
    http: 403
    condition: "an entity_backed role's X-User-ID does not resolve to an existing Technician or Surgeon row"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed actor targets a resource belonging to a different technician or surgeon"

  # --- not found ------------------------------------------------------------
  - id: ERR_DONOR_NOT_FOUND
    http: 404
    condition: "no Donor with the given path or body donor_id"
  - id: ERR_SEROLOGY_PANEL_NOT_FOUND
    http: 404
    condition: "no SerologyPanel with the given path id"
  - id: ERR_TECHNICIAN_NOT_FOUND
    http: 404
    condition: "no Technician with the given path id, technician_id or evaluator_technician_id"
  - id: ERR_RECOVERY_NOT_FOUND
    http: 404
    condition: "no Recovery with the given path or query recovery_id"
  - id: ERR_TISSUE_NOT_FOUND
    http: 404
    condition: "no CorneaTissue with the given path or body tissue_id"
  - id: ERR_SURGEON_NOT_FOUND
    http: 404
    condition: "no Surgeon with the given path or body surgeon_id"
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "no SurgeonRequest with the given path or body request_id"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "no Allocation with the given path or body allocation_id"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "no Shipment with the given path id or body replaces_shipment_id"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "no AdverseReactionReport with the given path id or body source_report_id"
  - id: ERR_INVESTIGATION_NOT_FOUND
    http: 404
    condition: "no LookbackInvestigation with the given path id"

  # --- schema / concurrency -------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, an enum value is out of range, a numeric is outside its declared bounds, a datetime is not ISO-8601 UTC with exactly three fractional digits, or a TissueEvaluation carries grade fields that do not match its method"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset < 0"
  - id: ERR_STALE_TISSUE_VERSION
    http: 412
    condition: "expected_tissue_version does not equal the tissue's current version on POST /eye-bank/tissues/{id}/evaluations"
  - id: ERR_STALE_DONOR_VERSION
    http: 412
    condition: "expected_donor_version does not equal the donor's current version on POST /eye-bank/donors/{id}/serology-panels"

  # --- state machine rejections --------------------------------------------
  - id: ERR_DONOR_STATE_INVALID
    http: 409
    condition: "the donor's status is not a legal from-state for the requested donor transition"
  - id: ERR_PANEL_STATE_INVALID
    http: 409
    condition: "results posted to a panel whose status is not DRAWN"
  - id: ERR_RECOVERY_STATE_INVALID
    http: 409
    condition: "arrive on a non-DISPATCHED recovery, complete on a non-ON_SITE recovery, or abort on a terminal recovery"
  - id: ERR_TISSUE_NOT_ELIGIBLE
    http: 409
    condition: "the tissue's disposition_status is not a legal from-state for the requested transition (dimension A)"
  - id: ERR_TISSUE_CUSTODY_INVALID
    http: 409
    condition: "the tissue's custody_status is not a legal from-state for the requested transition (dimension B)"
  - id: ERR_REQUEST_STATE_INVALID
    http: 409
    condition: "allocating against a non-OPEN request, or cancelling a request already FULFILLED, CANCELLED or EXPIRED"
  - id: ERR_ALLOCATION_STATE_INVALID
    http: 409
    condition: "confirming or cancelling a non-RESERVED allocation, or shipping/dispatching against a non-CONFIRMED allocation"
  - id: ERR_SHIPMENT_STATE_INVALID
    http: 409
    condition: "dispatching a non-PREPARED shipment, delivering a non-IN_TRANSIT shipment, or appending a reading to a shipment that is neither PREPARED nor IN_TRANSIT"
  - id: ERR_REPORT_STATE_INVALID
    http: 409
    condition: "substantiating or dismissing a report whose status is not SUBMITTED"
  - id: ERR_INVESTIGATION_STATE_INVALID
    http: 409
    condition: "notifying a non-OPEN investigation or closing a non-NOTIFIED investigation"

  # --- donor safety and consent --------------------------------------------
  - id: ERR_CONSENT_SCOPE_VIOLATION
    http: 422
    condition: "the operation's implied use exceeds the donor's consent_scope (no consent at all, or transplant use of a RESEARCH_ONLY / TRAINING_ONLY donor)"
  - id: ERR_SEROLOGY_REACTIVE
    http: 422
    condition: "the donor's serology_status is REACTIVE"
  - id: ERR_SEROLOGY_PENDING
    http: 422
    condition: "the donor has no RESULTED, non-INVALIDATED serology panel, so serology_status is still PENDING"
  - id: ERR_DONOR_UNDER_LOOKBACK
    http: 422
    condition: "the donor's lookback_flag is true"
  - id: ERR_SCREENING_RISK_TOO_HIGH
    http: 422
    condition: "a TRANSPLANT intended_use_override is requested for a donor whose screening_risk_score is 50 or above"
  - id: ERR_DEATH_TIME_IN_FUTURE
    http: 422
    condition: "death_at is later than the logical clock's current instant"
  - id: ERR_PRESERVATION_WINDOW_EXCEEDED
    http: 422
    condition: "preservation_at is strictly later than the donor's recovery_deadline_at"

  # --- staffing and segregation of duties -----------------------------------
  - id: ERR_TECHNICIAN_NOT_CERTIFIED
    http: 422
    condition: "the technician is INACTIVE, their certification_expires_at is at or before the logical clock, or grading was attempted with certification_level RECOVERY_ONLY"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "the evaluating technician is the same technician who performed the recovery that produced the tissue"
  - id: ERR_TECHNICIAN_DISPATCH_OVERLAP
    http: 409
    condition: "the new dispatch's occupation interval overlaps a live (non-ABORTED) occupation interval of the same technician"
  - id: ERR_EVALUATION_INCOMPLETE
    http: 422
    condition: "classification attempted without both a RECORDED SLIT_LAMP and a RECORDED SPECULAR evaluation for the tissue"

  # --- distribution matching -------------------------------------------------
  - id: ERR_SURGEON_NOT_CREDENTIALED
    http: 422
    condition: "the receiving surgeon's credential_status is PROBATION or SUSPENDED"
  - id: ERR_PROCEDURE_CLASSIFICATION_MISMATCH
    http: 422
    condition: "the tissue is not classified for transplant, or the request's procedure_type is not permitted for the tissue's classification"
  - id: ERR_ECD_BELOW_REQUEST_MINIMUM
    http: 422
    condition: "the tissue's RECORDED SPECULAR endothelial_cell_count is below the request's min_ecd"
  - id: ERR_DONOR_AGE_ABOVE_REQUEST_MAX
    http: 422
    condition: "the donor's age_years exceeds the request's max_donor_age_years"
  - id: ERR_SURGERY_DATE_IN_PAST
    http: 422
    condition: "surgery_date is at or before the logical clock's current instant at request creation"
  - id: ERR_TISSUE_EXPIRED
    http: 422
    condition: "the tissue's expires_at is at or before the logical clock's current instant"
  - id: ERR_EXPIRY_BEFORE_SURGERY_DATE
    http: 422
    condition: "the tissue's expires_at is strictly earlier than the request's surgery_date, so the graft would not be viable on the day of surgery"
  - id: ERR_SURGEON_DAY_CAPACITY_EXCEEDED
    http: 409
    condition: "the surgeon already holds 2 live allocations (RESERVED, CONFIRMED or CONSUMED) for requests whose surgery_date falls on the same UTC calendar date"
  - id: ERR_REISSUE_LIMIT_REACHED
    http: 409
    condition: "the tissue's reissue_generation is already 2 or higher, so it may never be issued again"
  - id: ERR_NO_ELIGIBLE_TISSUE
    http: 422
    condition: "an allocation run found no (tissue, request) pair satisfying every eligibility predicate"

  # --- shipping and monitoring ----------------------------------------------
  - id: ERR_NO_TEMPERATURE_BASELINE
    http: 422
    condition: "dispatch attempted on a shipment with zero temperature readings"
  - id: ERR_READING_OUTSIDE_SHIPMENT_WINDOW
    http: 422
    condition: "recorded_at is before the shipment's created_at or later than shipped_at plus 168 hours"
  - id: ERR_INVALID_REISSUE_SOURCE
    http: 422
    condition: "replaces_shipment_id points at a shipment that is not RETURNED, or at one whose allocation covers a different tissue"
  - id: ERR_SHIPMENT_INTEGRITY_FAILED
    http: 422
    condition: "implantation attempted after a shipment whose integrity_verdict is EXCURSION_MAJOR"

  # --- reporting and lookback -----------------------------------------------
  - id: ERR_REPORT_TISSUE_NOT_IMPLANTED_BY_SURGEON
    http: 422
    condition: "the reported tissue is not IMPLANTED, or its consumed allocation belongs to a different surgeon"

  # --- uniqueness -----------------------------------------------------------
  - id: ERR_DUPLICATE_DONOR_CODE
    http: 409
    condition: "another Donor already uses the submitted donor_code"
  - id: ERR_DUPLICATE_SCREENING_ANSWER
    http: 409
    condition: "a ScreeningRecord already exists for this (donor_id, question_code) pair"

  # --- logical clock --------------------------------------------------------
  - id: ERR_CLOCK_REWIND_FORBIDDEN
    http: 422
    condition: "to_iso8601 is strictly earlier than the current logical-clock instant"

# =============================================================================
# 1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:

  - name: EyeBankCoordinator
    description: "Operations staff who intake donor referrals, record screening and consent, dispatch technicians, allocate tissue and prepare/dispatch shipments. Never grades tissue and never adjudicates."
    identity: opaque
    exclusive_operations:
      - "POST /eye-bank/donors"
      - "POST /eye-bank/donors/{id}/screening-records"
      - "POST /eye-bank/donors/{id}/consent"
      - "POST /eye-bank/technicians"
      - "POST /eye-bank/technicians/{id}/status"
      - "POST /eye-bank/recoveries"
      - "POST /eye-bank/surgeons"
      - "POST /eye-bank/allocations"
      - "POST /eye-bank/allocation-runs"
      - "POST /eye-bank/allocations/{id}/confirm"
      - "POST /eye-bank/allocations/{id}/cancel"
      - "POST /eye-bank/shipments"
      - "POST /eye-bank/shipments/{id}/dispatch"
    shared_operations:
      - "POST /eye-bank/donors/{id}/defer (with MedicalDirector)"
      - "POST /eye-bank/recoveries/{id}/abort (with RecoveryTechnician)"
      - "POST /eye-bank/tissues/{id}/quarantine and /discard (with MedicalDirector)"
      - "POST /eye-bank/surgeon-requests and /{id}/cancel (with Surgeon)"
      - "POST /eye-bank/shipments/{id}/temperature-readings (with Surgeon)"
      - "POST /_clock/set_current_utc (with MedicalDirector)"
      - "all GET reads except GET /eye-bank/surgeons/{id} ownership-scoped reads"

  - name: LabTechnician
    description: "Serology laboratory staff. Draws specimens and posts marker results; has no authority over consent, classification, allocation or shipping."
    identity: opaque
    exclusive_operations:
      - "POST /eye-bank/donors/{id}/serology-panels"
      - "POST /eye-bank/serology-panels/{id}/results"
    shared_operations:
      - "GET /eye-bank/donors, GET /eye-bank/donors/{id}, GET /eye-bank/donors/{id}/screening-records, GET /eye-bank/donors/{id}/serology-panels, GET /eye-bank/tissues/{id}"

  - name: RecoveryTechnician
    description: "Field technician dispatched to a donor. Marks arrival, records preservation and may abort their own dispatch. Cannot grade the tissue they recovered (segregation of duties)."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /eye-bank/recoveries/{id}/arrive"
      - "POST /eye-bank/recoveries/{id}/complete"
    shared_operations:
      - "POST /eye-bank/recoveries/{id}/abort (with EyeBankCoordinator)"
      - "GET /eye-bank/recoveries, GET /eye-bank/recoveries/{id}, GET /eye-bank/donors/{id}, GET /eye-bank/technicians/{id}"

  - name: EvaluationTechnician
    description: "Certified grading technician who performs slit-lamp and specular evaluations. Must hold certification_level RECOVERY_AND_EVAL and must not be the recovering technician for the tissue being graded."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /eye-bank/tissues/{id}/evaluations"
    shared_operations:
      - "GET /eye-bank/tissues, GET /eye-bank/tissues/{id}, GET /eye-bank/tissues/{id}/evaluations, GET /eye-bank/technicians/{id}/tissue-evaluations, GET /eye-bank/donors/{id}, GET /eye-bank/recoveries/{id}"

  - name: MedicalDirector
    description: "Physician with release authority: approves donors for recovery, reinstates deferred donors, classifies tissue, manages quarantine and disposal, sets surgeon credential status, adjudicates adverse-reaction reports and runs lookback investigations. Never records screening answers, never allocates and never ships."
    identity: opaque
    exclusive_operations:
      - "POST /eye-bank/donors/{id}/approve-recovery"
      - "POST /eye-bank/donors/{id}/reinstate"
      - "POST /eye-bank/tissues/{id}/classify"
      - "POST /eye-bank/tissues/{id}/release-quarantine"
      - "POST /eye-bank/surgeons/{id}/credential-status"
      - "POST /eye-bank/adverse-reaction-reports/{id}/substantiate"
      - "POST /eye-bank/adverse-reaction-reports/{id}/dismiss"
      - "POST /eye-bank/lookback-investigations"
      - "POST /eye-bank/lookback-investigations/{id}/notify"
      - "POST /eye-bank/lookback-investigations/{id}/close"
    shared_operations:
      - "POST /eye-bank/donors/{id}/defer (with EyeBankCoordinator)"
      - "POST /eye-bank/tissues/{id}/quarantine and /discard (with EyeBankCoordinator)"
      - "POST /_clock/set_current_utc (with EyeBankCoordinator)"
      - "all GET reads"

  - name: Surgeon
    description: "Transplanting surgeon. Opens and cancels their own tissue requests, acknowledges delivery, confirms implantation, returns unused tissue and files adverse-reaction reports. Can only act on resources reachable from their own surgeon id."
    identity: "entity_backed:Surgeon"
    exclusive_operations:
      - "POST /eye-bank/shipments/{id}/deliver"
      - "POST /eye-bank/tissues/{id}/implant"
      - "POST /eye-bank/tissues/{id}/return"
      - "POST /eye-bank/adverse-reaction-reports"
    shared_operations:
      - "POST /eye-bank/surgeon-requests and /{id}/cancel (with EyeBankCoordinator)"
      - "POST /eye-bank/shipments/{id}/temperature-readings (with EyeBankCoordinator)"
      - "GET /eye-bank/surgeons/{id}, GET /eye-bank/surgeons/{id}/requests, GET /eye-bank/surgeon-requests/{id}, GET /eye-bank/allocations, GET /eye-bank/allocations/{id}, GET /eye-bank/shipments, GET /eye-bank/shipments/{id}, GET /eye-bank/shipments/{id}/temperature-readings, GET /eye-bank/tissues, GET /eye-bank/tissues/{id}, GET /eye-bank/adverse-reaction-reports"
