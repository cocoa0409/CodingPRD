# =============================================================================
# PRD Benchmark Seed Tables
# Task: cabinet_program_business_home_center_rollout_execution
# Domain: cabinet program business & home-center rollout execution
# =============================================================================

scenario: |
  Cabinet Program Business & Home Center Rollout Execution (American Woodmark):
  program business where a retailer adopts a full cabinet line with agreed styles,
  finishes and price points, kitchen design services delivered at retail with
  measurement, layout and order generation flowing to the manufacturer,
  made-to-order production scheduling with door style and finish combinations
  creating high variety, delivery to jobsites and retail stores with damage claims
  and replacement door logistics, program transition when a retailer changes lines
  requiring display resets and inventory disposition, dealer and builder channels
  served alongside retail with different pricing and lead times, finish and
  material changes requiring color match across replacement orders, capacity
  planning across plants by product family.

domain_name: cabinet-program-rollout
api_prefix: /cabinet

complexity_profile:
  primary_archetype: quota_allocation      # plant capacity slots + account credit pools competed for
  secondary_archetype: workflow_orchestration  # multi-stage order/design/claim pipelines with branching
  complexity_layers:
    - optimistic_concurrency               # OCC on Program.version for line supersede
    - cascading_side_effects               # supersede -> sunset -> reprice -> exposure -> hold chains
    - dual_variant_calculation             # quoted-vs-invoiced pricing; promised-vs-scheduled delivery week
    - selector_policy                      # capacity slot selection with eligibility/rank/tie-break/fallback
  entity_topology: flat                    # all entities top-level, FK links, no nested URL paths
  state_machine_shape: cyclic              # multiple cycles + one parallel-dimension machine
  relationship_patterns:
    - one_to_many
    - self_referential                     # ProgramLine.supersedes_line_id
    - cross_aggregate
  role_model: segregation_of_duties        # damage-claim filer cannot decide own claim; staff roles split per stage
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (11 entities, flat topology)
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Channel partner legal name" }
      - { name: channel, type: enum, source: input, description: "RETAIL | DEALER | BUILDER" }
      - { name: pricing_class, type: enum, source: input, description: "STANDARD | VOLUME | NATIONAL — drives channel price multiplier" }
      - { name: lead_time_class, type: enum, source: input, description: "STANDARD | EXTENDED — drives promised-lead-time table" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Credit ceiling for open order exposure; >= 0" }
      - { name: store_codes, type: array, source: input, default: [], description: "Store code strings operated by a RETAIL account; empty for DEALER/BUILDER" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | CLOSED" }
      - { name: open_exposure_cents, type: integer, source: computed, description: "Sum over this account's orders with status != CANCELLED: quoted_total_cents when payment_status IN {UNINVOICED, CREDIT_HOLD}, invoiced_total_cents when INVOICED, 0 when PAID" }

  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the adopting channel partner" }
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: program_discount_pct, type: number, source: input, description: "Program-level discount fraction applied multiplicatively after the volume tier, 0..0.5" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | TRANSITIONING" }
      - { name: transition_started_at, type: datetime, source: system, description: "Logical-clock instant when the program entered TRANSITIONING; null otherwise" }
      - { name: display_reset_deadline, type: datetime, source: computed, description: "transition_started_at + 45 days; null until TRANSITIONING" }
      - { name: disposition_deadline, type: datetime, source: computed, description: "transition_started_at + 90 days; null until TRANSITIONING" }
      - { name: open_order_count, type: integer, source: computed, description: "Count of orders for this program with status IN {SUBMITTED, ACKNOWLEDGED, SCHEDULED, IN_PRODUCTION, MFG_COMPLETE, SHIPPED}" }

  - name: ProgramLine
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: line_code, type: string, source: input, description: "Human line code, unique within the program" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUNSETTING | RETIRED" }
      - { name: effective_start_week, type: string, source: input, description: "ISO week 'YYYY-Www' from which the line is orderable" }
      - { name: families, type: array, source: input, description: "Agreed product families: [{family_code, standard_price_cents, base_lead_weeks, complexity_units_per_cabinet}]; family_code unique within the line" }
      - { name: supersedes_line_id, type: string, source: system, description: "FK -> ProgramLine.id; set on the NEW line when it supersedes an older line of the same program; null for a program's first line" }
      - { name: original_disposition_qty, type: integer, source: input, default: 0, description: "Old-line inventory units entering disposition at supersede; provided on the superseding line-create call" }
      - { name: remaining_disposition_qty, type: integer, source: computed, description: "original_disposition_qty minus sum of disposition_actions.qty" }
      - { name: disposition_actions, type: array, source: system, description: "Append-only [{action_type: RTV|LIQUIDATE|TRANSFER|DESTROY, qty, created_at}]" }

  - name: FinishBatch
    parent: null
    common_fields: true
    fields:
      - { name: finish_code, type: string, source: input, description: "Finish/material code, e.g. OAK_HONEY" }
      - { name: batch_code, type: string, source: input, description: "Manufacturer batch identifier" }
      - { name: lab_l, type: number, source: input, description: "CIELAB L* coordinate of the batch" }
      - { name: lab_a, type: number, source: input, description: "CIELAB a* coordinate" }
      - { name: lab_b, type: number, source: input, description: "CIELAB b* coordinate" }
      - { name: effective_from, type: datetime, source: input, description: "When the batch became usable" }
      - { name: status, type: enum, source: system, default: CURRENT, description: "CURRENT | RETIRED; creating a new batch for a finish_code auto-retires the prior CURRENT batch of that finish_code" }

  - name: DesignJob
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; must reference a RETAIL account" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; the account's cabinet program" }
      - { name: store_code, type: string, source: input, description: "Store where the kitchen design service happens; must be an element of Account.store_codes" }
      - { name: designer_user_id, type: string, source: system, description: "Acting RetailDesigner's X-User-ID, captured at creation; measurement-window overlap is enforced per designer_user_id" }
      - { name: measure_window_start, type: datetime, source: input, description: "Start of the on-site measurement window; half-open interval [start, end)" }
      - { name: measure_window_end, type: datetime, source: input, description: "End of the measurement window; must be strictly after start and start must be >= logical clock" }
      - { name: layout_lines, type: array, source: input, description: "Quoted BOM: [{family_code, finish_code, quantity}]; required when transitioning to LAYOUT_READY" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | MEASURED | LAYOUT_READY | QUOTED | CONVERTED | CANCELLED" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of backward transitions (QUOTED->LAYOUT_READY, QUOTED->MEASURED, LAYOUT_READY->MEASURED); hard cap 3" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "order_pricing quoted variant over layout_lines; set at QUOTED, cleared when revising back to LAYOUT_READY or MEASURED" }
      - { name: quoted_line_id, type: string, source: system, description: "FK -> ProgramLine.id; the program's ACTIVE line at quote time; stale-quote detection compares it at convert" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; for POST /orders must equal the DealerRep's X-User-ID" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: design_job_id, type: string, source: system, description: "FK -> DesignJob.id; set when the order was generated by a design-job conversion; null for dealer/builder direct orders" }
      - { name: destination_type, type: enum, source: input, description: "JOB_SITE | STORE" }
      - { name: store_code, type: string, source: input, description: "Required when destination_type == STORE; must be an element of Account.store_codes; null otherwise" }
      - { name: jobsite_address, type: string, source: input, description: "Required when destination_type == JOB_SITE; null otherwise" }
      - { name: requested_delivery_week, type: string, source: input, description: "ISO week 'YYYY-Www'; must satisfy requested_week >= current_week + min(base_lead_weeks of ordered families)" }
      - { name: lines, type: array, source: input, description: "Order BOM: [{family_code, finish_code, quantity}]; server adds per-line unit_quoted_cents, unit_invoiced_cents (nullable), finish_batch_id (nullable, pinned at IN_PRODUCTION), units (quantity x complexity_units_per_cabinet)" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "Fulfillment dimension: SUBMITTED | ACKNOWLEDGED | SCHEDULED | IN_PRODUCTION | MFG_COMPLETE | SHIPPED | DELIVERED | CANCELLED" }
      - { name: payment_status, type: enum, source: system, default: UNINVOICED, description: "Payment dimension (parallel to status): UNINVOICED | CREDIT_HOLD | INVOICED | PAID" }
      - { name: promised_delivery_week, type: string, source: computed, description: "delivery_week_estimation channel_table variant: submit week + effective lead (base_lead_weeks, +2 when account lead_time_class == EXTENDED)" }
      - { name: scheduled_week, type: string, source: system, description: "Production slot week chosen by capacity_slot_selection; null until SCHEDULED" }
      - { name: scheduled_delivery_week, type: string, source: computed, description: "delivery_week_estimation capacity_aware variant: scheduled_week + base_lead_weeks; null until SCHEDULED" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "order_pricing quoted variant, computed at submit; recomputed when a line supersede reprices a SUBMITTED order" }
      - { name: invoiced_total_cents, type: integer, source: computed, description: "order_pricing invoiced variant, computed at INVOICED; equals quoted_total_cents while price_lock holds, else repriced against the program's CURRENT ACTIVE line" }
      - { name: price_lock, type: boolean, source: system, default: false, description: "Set true at ACKNOWLEDGED; broken (set false) if a line supersede occurs while status IN {ACKNOWLEDGED, SCHEDULED, IN_PRODUCTION, MFG_COMPLETE} and payment_status IN {UNINVOICED, CREDIT_HOLD}" }
      - { name: repricing_required, type: boolean, source: system, default: false, description: "Set true on SUBMITTED orders when a line supersede recomputes quoted_total_cents" }

  - name: ProductionSlot
    parent: null
    common_fields: true
    fields:
      - { name: plant_code, type: enum, source: input, description: "PLANT_EAST | PLANT_WEST | PLANT_SOUTH" }
      - { name: family_code, type: string, source: input, description: "Product-family code this weekly bucket produces; matched by string equality against ProgramLine.families[].family_code" }
      - { name: week, type: string, source: input, description: "ISO week 'YYYY-Www'; must be >= the logical clock's current week at creation" }
      - { name: capacity_units, type: integer, source: input, description: "Total complexity-unit capacity for the bucket; > 0" }
      - { name: committed_units, type: integer, source: computed, default: 0, description: "Sum of units committed by SCHEDULED orders and SCHEDULED replacement orders against this slot; released on cancel from SCHEDULED" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | LOCKED; auto-LOCKED when committed_units == capacity_units; auto-OPEN when committed_units falls below capacity_units" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; auto-created in PLANNED when the order reaches MFG_COMPLETE (1:1 with the order)" }
      - { name: destination_type, type: enum, source: system, description: "JOB_SITE | STORE, copied from the order" }
      - { name: store_code, type: string, source: system, description: "Copied from the order; null for JOB_SITE" }
      - { name: jobsite_address, type: string, source: system, description: "Copied from the order; null for STORE" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | LOADED | IN_TRANSIT | DELIVERED | FAILED | RETURNED" }
      - { name: attempt_count, type: integer, source: system, default: 0, description: "Number of FAILED delivery attempts; at 3 a FAILED transition auto-moves the shipment to RETURNED" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock instant of the DELIVERED transition; null until delivered; basis of the claim window" }

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; must equal the shipment's order_id" }
      - { name: line_index, type: integer, source: input, description: "0-based index into Order.lines" }
      - { name: claimed_qty, type: integer, source: input, description: "Units claimed damaged; > 0" }
      - { name: filed_by_user_id, type: string, source: system, description: "Filer's X-User-ID, captured at creation; segregation-of-duties compares it at decide time" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock instant of filing; must be <= shipment.delivered_at + 14 days" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | UNDER_REVIEW | APPROVED | DENIED" }
      - { name: resolution, type: enum, source: input, description: "REPLACEMENT | CREDIT; required when transitioning to APPROVED; null until then" }
      - { name: settlement_cents, type: integer, source: computed, description: "damage_settlement result; 0 for REPLACEMENT, computed amount for CREDIT; null until APPROVED" }
      - { name: decided_by_user_id, type: string, source: system, description: "Deciding ClaimsAdjuster's X-User-ID; null until APPROVED/DENIED" }

  - name: ReplacementOrder
    parent: null
    common_fields: true
    fields:
      - { name: damage_claim_id, type: string, source: system, description: "FK -> DamageClaim.id; set when claim APPROVED with resolution REPLACEMENT" }
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; the original order" }
      - { name: line_index, type: integer, source: system, description: "Index into the original order's lines" }
      - { name: quantity, type: integer, source: system, description: "Equals DamageClaim.claimed_qty" }
      - { name: finish_batch_id, type: string, source: system, description: "FK -> FinishBatch.id; the CURRENT batch for the line's finish_code at claim-approval time" }
      - { name: original_finish_batch_id, type: string, source: system, description: "FK -> FinishBatch.id; the batch pinned on the original order line at IN_PRODUCTION" }
      - { name: status, type: enum, source: system, default: CREATED, description: "CREATED | SCHEDULED | IN_PRODUCTION | SHIPPED | RECEIVED | REMAKE | CANCELLED" }
      - { name: scheduled_week, type: string, source: system, description: "Slot week committed at the CREATED->SCHEDULED transition; null until then" }

  - name: DisplayReset
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: line_id, type: string, source: system, description: "FK -> ProgramLine.id; the SUNSETTING line whose displays are being reset" }
      - { name: store_code, type: string, source: system, description: "One element of the account's store_codes; one DisplayReset is created per store_code at supersede" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | SCHEDULED | COMPLETE | WAIVED" }
      - { name: scheduled_date, type: datetime, source: input, description: "Planned execution instant; required when transitioning to SCHEDULED; null otherwise" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock instant of the COMPLETE transition; null until then" }
      - { name: completed_late, type: boolean, source: computed, description: "completed_at > program.display_reset_deadline; false until COMPLETE" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /cabinet/programs/{id}/activate"
        actor: ProgramManager
        preconditions:
          - "Account referenced by program.account_id has status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "Program has exactly one ProgramLine with status == ACTIVE (ERR_NO_ACTIVE_LINE)"
        side_effects:
          - "Program.status -> ACTIVE; increments Program.version by 1"
      - from: ACTIVE
        to: TRANSITIONING
        trigger: "system (POST /cabinet/programs/{id}/lines creating a superseding line while program is ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "Program.status -> TRANSITIONING; transition_started_at = logical clock; display_reset_deadline = clock + 45 days; disposition_deadline = clock + 90 days"
          - "Prior ACTIVE ProgramLine -> SUNSETTING (see ProgramLine machine) — that transition's own side effects then fire (reprice cascade, display reset creation)"
      - from: TRANSITIONING
        to: ACTIVE
        trigger: "system (auto when no ProgramLine of this program remains in SUNSETTING — i.e., every sunsetting line reached RETIRED)"
        actor: system
        preconditions:
          - "Count of the program's lines with status == SUNSETTING == 0"
        side_effects:
          - "Program.status -> ACTIVE; transition_started_at/display_reset_deadline/disposition_deadline cleared to null"

  - entity: ProgramLine
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: SUNSETTING
        trigger: "system (a new ProgramLine created via POST /cabinet/programs/{id}/lines for the same program while this line is ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "supersedes_line_id set on the NEW line to this line's id"
          - "remaining_disposition_qty initialized to the new line's original_disposition_qty input"
          - "For each Order of this program with status == SUBMITTED: order_pricing quoted variant recomputed against the NEW line; repricing_required set true (Order mutation)"
          - "Each such Order recompute triggers credit_exposure recompute on the Account (Account mutation), which re-evaluates CREDIT_HOLD release on that account's held orders"
          - "For each Order of this program with status IN {ACKNOWLEDGED, SCHEDULED, IN_PRODUCTION, MFG_COMPLETE} and payment_status IN {UNINVOICED, CREDIT_HOLD}: price_lock set false"
          - "If program.account.channel == RETAIL: one DisplayReset per element of Account.store_codes created in PLANNED for this line"
      - from: SUNSETTING
        to: RETIRED
        trigger: "system (auto when remaining_disposition_qty == 0 AND every DisplayReset of the same program for this line has status IN {COMPLETE, WAIVED})"
        actor: system
        preconditions:
          - "remaining_disposition_qty == 0"
          - "All DisplayResets with line_id == this line are COMPLETE or WAIVED"
        side_effects:
          - "ProgramLine.status -> RETIRED"
          - "If this was the program's last SUNSETTING line: Program TRANSITIONING -> ACTIVE auto-transition fires"

  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /cabinet/accounts/{id}/status {to_status: SUSPENDED}"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["increments Account.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /cabinet/accounts/{id}/status {to_status: ACTIVE}"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "increments Account.version by 1"
          - "credit_exposure recompute + CREDIT_HOLD re-evaluation for this account's orders with payment_status == CREDIT_HOLD"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /cabinet/accounts/{id}/status {to_status: CLOSED}"
        actor: PlatformAdmin
        preconditions:
          - "No orders of this account with status IN {SUBMITTED, ACKNOWLEDGED, SCHEDULED, IN_PRODUCTION, MFG_COMPLETE, SHIPPED} (ERR_ACCOUNT_HAS_OPEN_ORDERS)"
        side_effects: ["increments Account.version by 1"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /cabinet/accounts/{id}/status {to_status: CLOSED}"
        actor: PlatformAdmin
        preconditions:
          - "No orders of this account with status IN {SUBMITTED, ACKNOWLEDGED, SCHEDULED, IN_PRODUCTION, MFG_COMPLETE, SHIPPED} (ERR_ACCOUNT_HAS_OPEN_ORDERS)"
        side_effects: ["increments Account.version by 1"]

  - entity: FinishBatch
    initial_state: CURRENT
    terminal_states: [RETIRED]
    transitions:
      - from: CURRENT
        to: RETIRED
        trigger: "POST /cabinet/finish-batches/{id}/retire OR system (a new FinishBatch created for the same finish_code auto-retires the prior CURRENT batch)"
        actor: PlatformAdmin | system
        preconditions: []
        side_effects:
          - "FinishBatch.status -> RETIRED"
          - "After retirement, no batch with status == CURRENT exists for that finish_code until a new batch is created (IN_PRODUCTION pinning and replacement color checks then raise ERR_NO_CURRENT_BATCH)"

  - entity: ProductionSlot
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "system (auto when committed_units == capacity_units after a commit)"
        actor: system
        preconditions: []
        side_effects: ["increments ProductionSlot.version by 1"]
      - from: LOCKED
        to: OPEN
        trigger: "system (auto when committed_units < capacity_units after a release)"
        actor: system
        preconditions: []
        side_effects: ["increments ProductionSlot.version by 1"]

  - entity: DesignJob
    initial_state: REQUESTED
    terminal_states: [CONVERTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: MEASURED
        trigger: "POST /cabinet/design-jobs/{id}/transition {to_status: MEASURED}"
        actor: RetailDesigner
        preconditions:
          - "X-User-ID == design_job.designer_user_id (ERR_FORBIDDEN)"
        side_effects: ["increments DesignJob.version by 1"]
      - from: MEASURED
        to: LAYOUT_READY
        trigger: "POST /cabinet/design-jobs/{id}/transition {to_status: LAYOUT_READY, layout_lines: [...]}"
        actor: RetailDesigner
        preconditions:
          - "X-User-ID == design_job.designer_user_id (ERR_FORBIDDEN)"
          - "layout_lines present and non-empty (ERR_INVALID_REQUEST)"
          - "Every layout_lines[].family_code exists in the program's ACTIVE line families (ERR_LINE_NOT_COVERED)"
        side_effects: ["layout_lines stored; increments DesignJob.version by 1"]
      - from: LAYOUT_READY
        to: QUOTED
        trigger: "POST /cabinet/design-jobs/{id}/transition {to_status: QUOTED}"
        actor: RetailDesigner
        preconditions:
          - "X-User-ID == design_job.designer_user_id (ERR_FORBIDDEN)"
        side_effects:
          - "order_pricing quoted variant computed over layout_lines -> quoted_total_cents"
          - "quoted_line_id = program's ACTIVE line id; increments DesignJob.version by 1"
      - from: QUOTED
        to: LAYOUT_READY
        trigger: "POST /cabinet/design-jobs/{id}/transition {to_status: LAYOUT_READY, layout_lines: [...]}"
        actor: RetailDesigner
        preconditions:
          - "X-User-ID == design_job.designer_user_id (ERR_FORBIDDEN)"
          - "revision_count < 3 (ERR_REVISION_LIMIT_EXCEEDED)"
          - "layout_lines present and non-empty (ERR_INVALID_REQUEST)"
        side_effects: ["revision_count += 1; quoted_total_cents cleared to null; layout_lines replaced"]
      - from: QUOTED
        to: MEASURED
        trigger: "POST /cabinet/design-jobs/{id}/transition {to_status: MEASURED, measure_window_start, measure_window_end}"
        actor: RetailDesigner
        preconditions:
          - "X-User-ID == design_job.designer_user_id (ERR_FORBIDDEN)"
          - "revision_count < 3 (ERR_REVISION_LIMIT_EXCEEDED)"
          - "New measure window present, end > start, start >= logical clock (ERR_MEASURE_WINDOW_INVALID)"
          - "New window passes the designer-overlap rule against this designer's other jobs with status IN {REQUESTED, MEASURED} (ERR_DESIGNER_WINDOW_OVERLAP)"
        side_effects: ["revision_count += 1; quoted_total_cents cleared; measure window replaced"]
      - from: LAYOUT_READY
        to: MEASURED
        trigger: "POST /cabinet/design-jobs/{id}/transition {to_status: MEASURED, measure_window_start, measure_window_end}"
        actor: RetailDesigner
        preconditions:
          - "X-User-ID == design_job.designer_user_id (ERR_FORBIDDEN)"
          - "revision_count < 3 (ERR_REVISION_LIMIT_EXCEEDED)"
          - "New measure window present, end > start, start >= logical clock (ERR_MEASURE_WINDOW_INVALID)"
          - "New window passes the designer-overlap rule (ERR_DESIGNER_WINDOW_OVERLAP)"
        side_effects: ["revision_count += 1; layout_lines cleared; measure window replaced"]
      - from: QUOTED
        to: CONVERTED
        trigger: "POST /cabinet/design-jobs/{id}/convert"
        actor: RetailDesigner
        preconditions:
          - "X-User-ID == design_job.designer_user_id (ERR_FORBIDDEN)"
          - "Account status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "Program status IN {ACTIVE, TRANSITIONING} (ERR_PROGRAM_NOT_ACTIVE)"
          - "quoted_line_id still identifies a ProgramLine with status == ACTIVE (ERR_QUOTE_STALE)"
        side_effects:
          - "Order created in SUBMITTED with payment_status UNINVOICED, lines copied from layout_lines, account_id/program_id copied, design_job_id set, order_pricing quoted variant computed, promised_delivery_week computed (delivery_week_estimation channel_table variant)"
          - "credit_exposure recompute on the Account"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /cabinet/design-jobs/{id}/transition {to_status: CANCELLED}"
        actor: RetailDesigner
        preconditions: ["X-User-ID == design_job.designer_user_id (ERR_FORBIDDEN)"]
        side_effects: []
      - from: MEASURED
        to: CANCELLED
        trigger: "POST /cabinet/design-jobs/{id}/transition {to_status: CANCELLED}"
        actor: RetailDesigner
        preconditions: ["X-User-ID == design_job.designer_user_id (ERR_FORBIDDEN)"]
        side_effects: []
      - from: LAYOUT_READY
        to: CANCELLED
        trigger: "POST /cabinet/design-jobs/{id}/transition {to_status: CANCELLED}"
        actor: RetailDesigner
        preconditions: ["X-User-ID == design_job.designer_user_id (ERR_FORBIDDEN)"]
        side_effects: []
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /cabinet/design-jobs/{id}/transition {to_status: CANCELLED}"
        actor: RetailDesigner
        preconditions: ["X-User-ID == design_job.designer_user_id (ERR_FORBIDDEN)"]
        side_effects: []

  - entity: Order
    initial_state: "SUBMITTED (payment_status: UNINVOICED)"
    terminal_states: [DELIVERED, CANCELLED]
    note: "Parallel state dimensions: `status` (fulfillment) and `payment_status` evolve independently, with two gates: SCHEDULED requires payment_status == UNINVOICED; financial INVOICED requires status IN {MFG_COMPLETE, SHIPPED, DELIVERED}."
    transitions:
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /cabinet/orders/{id}/transition {to_status: ACKNOWLEDGED}"
        actor: ProgramManager
        preconditions:
          - "Account status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "Program status IN {ACTIVE, TRANSITIONING} (ERR_PROGRAM_NOT_ACTIVE)"
        side_effects:
          - "price_lock set true"
          - "credit_exposure recompute on Account; if open_exposure_cents > credit_limit_cents after inclusion, payment_status -> CREDIT_HOLD, else stays UNINVOICED"
          - "increments Order.version by 1"
      - from: ACKNOWLEDGED
        to: SCHEDULED
        trigger: "POST /cabinet/orders/{id}/transition {to_status: SCHEDULED}"
        actor: PlantScheduler
        preconditions:
          - "payment_status == UNINVOICED (ERR_CREDIT_HOLD when CREDIT_HOLD)"
        side_effects:
          - "capacity_slot_selection strict variant picks one slot per distinct family_code in lines; committed_units increased on each picked slot (slot auto-LOCKED when full)"
          - "scheduled_week = latest picked slot week; scheduled_delivery_week = scheduled_week + max base_lead_weeks over the order's families"
          - "increments Order.version by 1"
      - from: SCHEDULED
        to: IN_PRODUCTION
        trigger: "POST /cabinet/orders/{id}/transition {to_status: IN_PRODUCTION}"
        actor: PlantScheduler
        preconditions:
          - "For every line: a FinishBatch with status == CURRENT exists for line.finish_code (ERR_NO_CURRENT_BATCH)"
        side_effects:
          - "Each line's finish_batch_id pinned to the CURRENT batch of its finish_code"
          - "increments Order.version by 1"
      - from: IN_PRODUCTION
        to: MFG_COMPLETE
        trigger: "POST /cabinet/orders/{id}/transition {to_status: MFG_COMPLETE}"
        actor: PlantScheduler
        preconditions: []
        side_effects:
          - "Shipment auto-created in PLANNED with destination copied from the order (Shipment creation mutation)"
          - "increments Order.version by 1"
      - from: MFG_COMPLETE
        to: SHIPPED
        trigger: "system (linked Shipment transitions to IN_TRANSIT)"
        actor: system
        preconditions: []
        side_effects: ["increments Order.version by 1"]
      - from: SHIPPED
        to: DELIVERED
        trigger: "system (linked Shipment transitions to DELIVERED)"
        actor: system
        preconditions: []
        side_effects: ["increments Order.version by 1"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /cabinet/orders/{id}/cancel"
        actor: DealerRep | ProgramManager
        preconditions: ["DealerRep caller: order.account_id == X-User-ID (ERR_FORBIDDEN)"]
        side_effects:
          - "credit_exposure recompute on Account; CREDIT_HOLD re-evaluation for the account's held orders"
      - from: ACKNOWLEDGED
        to: CANCELLED
        trigger: "POST /cabinet/orders/{id}/cancel"
        actor: DealerRep | ProgramManager
        preconditions: ["DealerRep caller: order.account_id == X-User-ID (ERR_FORBIDDEN)"]
        side_effects:
          - "credit_exposure recompute on Account; CREDIT_HOLD re-evaluation for the account's held orders"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /cabinet/orders/{id}/cancel"
        actor: DealerRep | ProgramManager
        preconditions: ["DealerRep caller: order.account_id == X-User-ID (ERR_FORBIDDEN)"]
        side_effects:
          - "Each picked slot's committed_units decreased by the order's units for that family (slot auto-OPEN when no longer full) — release mutation on ProductionSlot"
          - "credit_exposure recompute on Account; CREDIT_HOLD re-evaluation for the account's held orders"
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "POST /cabinet/orders/{id}/cancel — REJECTED"
        actor: DealerRep | ProgramManager
        preconditions: ["Never permitted from IN_PRODUCTION, MFG_COMPLETE, SHIPPED, DELIVERED, CANCELLED (ERR_ORDER_NOT_CANCELLABLE)"]
        side_effects: []
      - from: UNINVOICED
        to: CREDIT_HOLD
        trigger: "system (payment dimension: set at acknowledge when credit_exposure exceeds the limit, or at any credit_exposure recompute where the account's exposure > credit_limit_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CREDIT_HOLD
        to: UNINVOICED
        trigger: "system (payment dimension: at any credit_exposure recompute where the account's open_exposure_cents <= credit_limit_cents — cancel, payment, reprice, or credit-limit change)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNINVOICED
        to: INVOICED
        trigger: "POST /cabinet/orders/{id}/financial {to_status: INVOICED}"
        actor: ProgramManager
        preconditions:
          - "status IN {MFG_COMPLETE, SHIPPED, DELIVERED} (ERR_INVALID_STATE)"
        side_effects:
          - "order_pricing invoiced variant: if price_lock true, invoiced_total_cents = quoted_total_cents and each line's unit_invoiced_cents = unit_quoted_cents; else recomputed against the program's CURRENT ACTIVE line"
          - "credit_exposure recompute on Account (open amount switches from quoted to invoiced basis)"
      - from: INVOICED
        to: PAID
        trigger: "POST /cabinet/orders/{id}/financial {to_status: PAID}"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "credit_exposure recompute on Account (this order's contribution drops to 0)"
          - "CREDIT_HOLD re-evaluation for the account's other held orders"

  - entity: Shipment
    initial_state: PLANNED
    terminal_states: [DELIVERED, RETURNED]
    transitions:
      - from: PLANNED
        to: LOADED
        trigger: "POST /cabinet/shipments/{id}/transition {to_status: LOADED}"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: ["increments Shipment.version by 1"]
      - from: LOADED
        to: IN_TRANSIT
        trigger: "POST /cabinet/shipments/{id}/transition {to_status: IN_TRANSIT}"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: ["Linked Order MFG_COMPLETE -> SHIPPED (Order mutation)"]
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /cabinet/shipments/{id}/transition {to_status: DELIVERED}"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "delivered_at = logical clock"
          - "Linked Order SHIPPED -> DELIVERED (Order mutation)"
      - from: IN_TRANSIT
        to: FAILED
        trigger: "POST /cabinet/shipments/{id}/transition {to_status: FAILED}"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "attempt_count += 1"
          - "If attempt_count reaches 3: shipment auto-transitions FAILED -> RETURNED (system)"
      - from: FAILED
        to: PLANNED
        trigger: "POST /cabinet/shipments/{id}/transition {to_status: PLANNED}"
        actor: LogisticsCoordinator
        preconditions:
          - "attempt_count < 3 (ERR_INVALID_STATE otherwise — shipment is already RETURNED)"
        side_effects: ["re-plans the same shipment for another attempt"]
      - from: FAILED
        to: RETURNED
        trigger: "system (auto when a FAILED transition makes attempt_count == 3)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DamageClaim
    initial_state: FILED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /cabinet/claims/{id}/transition {to_status: UNDER_REVIEW}"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /cabinet/claims/{id}/transition {to_status: APPROVED, resolution: REPLACEMENT|CREDIT}"
        actor: ClaimsAdjuster
        preconditions:
          - "resolution present (ERR_INVALID_REQUEST)"
          - "deciding X-User-ID != claim.filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "If resolution == REPLACEMENT: a FinishBatch with status == CURRENT exists for the original line's finish_code (ERR_NO_CURRENT_BATCH)"
        side_effects:
          - "decided_by_user_id = X-User-ID"
          - "If resolution == CREDIT: settlement_cents = damage_settlement result"
          - "If resolution == REPLACEMENT: settlement_cents = 0 AND ReplacementOrder auto-created in CREATED (ReplacementOrder creation mutation) with quantity = claimed_qty, finish_batch_id = CURRENT batch of the line's finish_code, original_finish_batch_id = the pinned batch on the original order line"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /cabinet/claims/{id}/transition {to_status: DENIED}"
        actor: ClaimsAdjuster
        preconditions:
          - "deciding X-User-ID != claim.filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["decided_by_user_id = X-User-ID"]
      - from: FILED
        to: DENIED
        trigger: "POST /cabinet/claims/{id}/transition {to_status: DENIED}"
        actor: ClaimsAdjuster
        preconditions:
          - "deciding X-User-ID != claim.filed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["decided_by_user_id = X-User-ID"]

  - entity: ReplacementOrder
    initial_state: CREATED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: CREATED
        to: SCHEDULED
        trigger: "POST /cabinet/replacement-orders/{id}/transition {to_status: SCHEDULED}"
        actor: PlantScheduler
        preconditions:
          - "color_match_delta_e(finish_batch_id, original_finish_batch_id) <= 2.0 (ERR_COLOR_MISMATCH)"
          - "capacity_slot_selection expedite variant finds a slot (ERR_NO_CAPACITY)"
        side_effects:
          - "Picked slot's committed_units += quantity x complexity_units_per_cabinet of the line's family (expedite overbook allowed up to floor(capacity_units x 0.10) beyond capacity)"
          - "scheduled_week set; increments ReplacementOrder.version by 1"
      - from: SCHEDULED
        to: IN_PRODUCTION
        trigger: "POST /cabinet/replacement-orders/{id}/transition {to_status: IN_PRODUCTION}"
        actor: PlantScheduler
        preconditions: []
        side_effects: ["increments ReplacementOrder.version by 1"]
      - from: IN_PRODUCTION
        to: SHIPPED
        trigger: "POST /cabinet/replacement-orders/{id}/transition {to_status: SHIPPED}"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: ["increments ReplacementOrder.version by 1"]
      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /cabinet/replacement-orders/{id}/transition {to_status: RECEIVED}"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: REMAKE
        trigger: "POST /cabinet/replacement-orders/{id}/transition {to_status: REMAKE}"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: ["increments ReplacementOrder.version by 1 — cyclic remake loop re-enters scheduling"]
      - from: REMAKE
        to: SCHEDULED
        trigger: "POST /cabinet/replacement-orders/{id}/transition {to_status: SCHEDULED}"
        actor: PlantScheduler
        preconditions:
          - "color_match_delta_e re-evaluated against the CURRENT batch of the finish_code at this time (ERR_COLOR_MISMATCH)"
          - "capacity_slot_selection expedite variant finds a slot (ERR_NO_CAPACITY)"
        side_effects:
          - "finish_batch_id updated to the CURRENT batch of the finish_code"
          - "Picked slot's committed_units += units; scheduled_week set"
      - from: CREATED
        to: CANCELLED
        trigger: "POST /cabinet/replacement-orders/{id}/transition {to_status: CANCELLED}"
        actor: PlantScheduler
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /cabinet/replacement-orders/{id}/transition {to_status: CANCELLED}"
        actor: PlantScheduler
        preconditions: []
        side_effects: ["Picked slot's committed_units -= units (slot auto-OPEN when no longer full)"]

  - entity: DisplayReset
    initial_state: PLANNED
    terminal_states: [COMPLETE, WAIVED]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: "POST /cabinet/display-resets/{id}/transition {to_status: SCHEDULED, scheduled_date}"
        actor: FieldServiceRep
        preconditions:
          - "scheduled_date present (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: SCHEDULED
        to: COMPLETE
        trigger: "POST /cabinet/display-resets/{id}/transition {to_status: COMPLETE}"
        actor: FieldServiceRep
        preconditions: []
        side_effects:
          - "completed_at = logical clock; completed_late recomputed"
          - "If this completes the last non-terminal DisplayReset of the line AND the line's remaining_disposition_qty == 0: line auto-retires (ProgramLine SUNSETTING -> RETIRED)"
      - from: PLANNED
        to: COMPLETE
        trigger: "POST /cabinet/display-resets/{id}/transition {to_status: COMPLETE}"
        actor: FieldServiceRep
        preconditions: []
        side_effects:
          - "completed_at = logical clock; completed_late recomputed"
          - "Same line auto-retire check as SCHEDULED -> COMPLETE"
      - from: PLANNED
        to: WAIVED
        trigger: "POST /cabinet/display-resets/{id}/transition {to_status: WAIVED}"
        actor: ProgramManager
        preconditions: []
        side_effects: ["Same line auto-retire check as COMPLETE"]
      - from: SCHEDULED
        to: WAIVED
        trigger: "POST /cabinet/display-resets/{id}/transition {to_status: WAIVED}"
        actor: ProgramManager
        preconditions: []
        side_effects: ["Same line auto-retire check as COMPLETE"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; all other write conflicts are state preconditions)
# =============================================================================
concurrency_rules:
  - rule_id: line-create-stale-program
    parent_entity: Program
    write_endpoint: "POST /cabinet/programs/{id}/lines"
    occ_field: expected_program_version
    description: |
      Creating a ProgramLine against a Program whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just created a superseding line (which legitimately
      supersedes the prior ACTIVE line and moves the program to TRANSITIONING)
      and the current writer's view of the program is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_pricing
    trigger: "Order create / DesignJob quote (quoted variant); Order financial INVOICED (invoiced variant); ProgramLine supersede reprice of SUBMITTED orders (quoted variant against the new line)"
    algorithm: tiered_pricing
    formula: |
      Per line i with family standard_price_cents P_i and quantity q_i:
        unit_channel_i = round_half_up(P_i x channel_multiplier)          # step 1
      channel_multiplier by account.pricing_class: STANDARD 1.00, VOLUME 0.95, NATIONAL 0.90.
      gross = SUM(unit_channel_i x q_i)                                    # pre-discount
      tier = 0.08 if gross >= TIER2_GROSS_CENTS, else 0.05 if gross >= TIER1_GROSS_CENTS, else 0
        # tier is keyed on the PRE-discount gross; evaluation order is pinned:
        # compute gross first, select tier, then apply discounts — the tier does
        # NOT re-derive from the post-discount total even when the discount
        # pulls the total back below the threshold.
      unit_net_i = round_half_up(round_half_up(unit_channel_i x (1 - tier)) x (1 - program_discount_pct))
        # steps 2 and 3: round the tier-discounted unit FIRST, then apply the
        # program discount and round again — per-line, before multiplying by qty.
      line_total_i = unit_net_i x q_i
      total = SUM(line_total_i)                                            # sum AFTER per-line rounding
      (The unpinned alternative — summing raw values and rounding once — yields
       different cents; the pinned order above is authoritative.)
    input_set: "Order.lines / DesignJob.layout_lines; families resolved by family_code against the program's CURRENT ACTIVE ProgramLine; unknown family_code -> ERR_LINE_NOT_COVERED"
    constants:
      TIER1_GROSS_CENTS: 500000
      TIER2_GROSS_CENTS: 2000000
      MULT_STANDARD: 1.00
      MULT_VOLUME: 0.95
      MULT_NATIONAL: 0.90
    precision: "integer cents, round_half_up at each pinned step"
    variants:
      - name: quoted
        when: "At Order submit and DesignJob QUOTED"
        difference: "Priced against the ACTIVE line at submit/quote time; result stored in quoted_total_cents and per-line unit_quoted_cents"
      - name: invoiced
        when: "At financial INVOICED"
        difference: "If order.price_lock is true, equals the quoted values verbatim; if price_lock is false (a line supersede broke the lock), repriced against the CURRENT ACTIVE line at invoice time — identical carts can invoice at different totals"

  - name: delivery_week_estimation
    trigger: "Order create / DesignJob convert (channel_table variant -> promised_delivery_week); Order SCHEDULED (capacity_aware variant -> scheduled_week and scheduled_delivery_week)"
    algorithm: forward_looking
    formula: |
      effective_lead_weeks = max base_lead_weeks over the order's families
                             + (2 if account.lead_time_class == EXTENDED else 0)
      channel_table variant:   promised_delivery_week = iso_week(submit clock) + effective_lead_weeks
      capacity_aware variant:  scheduled_week = capacity_slot_selection result;
                               scheduled_delivery_week = scheduled_week + max base_lead_weeks over the order's families
      The two variants answer the same question ("when will this arrive?") with
      different algorithms; they diverge whenever capacity forces a slot later
      than the table lead time assumes.
    input_set: "Order families (for lead weeks), account lead_time_class, logical clock week, slot availability"
    constants:
      EXTENDED_CLASS_EXTRA_WEEKS: 2
    precision: "ISO week strings 'YYYY-Www'"
    variants:
      - name: channel_table
        when: "At order submit (the sales promise)"
        difference: "Capacity-blind table lookup; fast; may be optimistic"
      - name: capacity_aware
        when: "At order scheduling (the production reality)"
        difference: "Driven by capacity_slot_selection; slips past the promise when slots are full"

  - name: credit_exposure
    trigger: "Order create/acknowledge/cancel, financial INVOICED/PAID, ProgramLine supersede reprice, Account status change to ACTIVE"
    algorithm: aggregation
    formula: |
      open_exposure_cents = SUM over the account's orders where status != CANCELLED of:
        payment_status IN {UNINVOICED, CREDIT_HOLD} -> quoted_total_cents
        payment_status == INVOICED                 -> invoiced_total_cents
        payment_status == PAID                     -> 0
      CREDIT_HOLD evaluation for an order O (at acknowledge, and at every exposure
      recompute for already-held orders):
        hold  iff open_exposure_cents > account.credit_limit_cents   # strictly greater
        open_exposure_cents == credit_limit_cents exactly PASSES (no hold).
      On every recompute: each of the account's orders with payment_status ==
      CREDIT_HOLD flips back to UNINVOICED when open_exposure_cents <= credit_limit_cents.
    input_set: "All orders of the account with status != CANCELLED"
    constants: {}
    precision: "integer cents"

  - name: capacity_slot_selection
    trigger: "Order SCHEDULED (strict variant); ReplacementOrder CREATED->SCHEDULED and REMAKE->SCHEDULED (expedite variant)"
    algorithm: waterfall_allocation
    formula: |
      For each distinct family_code in the order/replacement:
        needed = SUM(quantity x complexity_units_per_cabinet) over its lines
        eligible slots: slot.family_code == family_code
          AND current_week <= slot.week
          AND strict variant:   slot.status == OPEN
                                AND slot.week IN [current_week, requested_delivery_week - base_lead_weeks]
                                AND slot.committed_units + needed <= slot.capacity_units
          AND expedite variant: slot.status IN {OPEN, LOCKED}
                                AND slot.week IN [current_week, current_week + 1]
                                AND slot.committed_units + needed <= slot.capacity_units + floor(capacity_units x EXPEDITE_OVERBOOK_PCT)
        ranking: slot.week ASC, then plant_code ASC, then created_at ASC (never id)
        pick the first eligible slot; if none exists -> ERR_NO_CAPACITY
      A picked slot's committed_units += needed; slot auto-LOCKED at equality.
      For a multi-family order, all picks must succeed or the whole transition
      fails with ERR_NO_CAPACITY (no partial commit).
    input_set: "ProductionSlots (OPEN, week >= current week), order/replacement lines, logical clock week"
    constants:
      EXPEDITE_OVERBOOK_PCT: 0.10
      MAX_SLIP_WEEKS: 4
    precision: "integer units"
    variants:
      - name: strict
        when: "Normal order scheduling"
        difference: "Primary window is [current_week, requested_delivery_week - base_lead_weeks]; if empty, slip window [requested_delivery_week - base_lead_weeks + 1, requested_delivery_week - base_lead_weeks + MAX_SLIP_WEEKS]; overbook NOT allowed"
      - name: expedite
        when: "ReplacementOrder scheduling"
        difference: "Window is [current_week, current_week + 1]; overbook up to floor(capacity x 0.10) extra units allowed"

  - name: color_match_delta_e
    trigger: "ReplacementOrder CREATED->SCHEDULED and REMAKE->SCHEDULED"
    algorithm: threshold
    formula: |
      deltaE = sqrt((L1 - L0)^2 + (a1 - a0)^2 + (b1 - b0)^2)
        where (L1,a1,b1) are the replacement batch lab coordinates and
        (L0,a0,b0) the original order line's pinned batch coordinates.
      PASS iff deltaE <= COLOR_MATCH_TOLERANCE (the boundary 2.0 exactly passes).
      If finish_batch_id == original_finish_batch_id (same batch), PASS trivially.
    input_set: "ReplacementOrder.finish_batch_id, ReplacementOrder.original_finish_batch_id"
    constants:
      COLOR_MATCH_TOLERANCE: 2.0
    precision: "deltaE compared in full floating point; threshold inclusive"

  - name: damage_settlement
    trigger: "DamageClaim UNDER_REVIEW -> APPROVED with resolution == CREDIT"
    algorithm: tiered_pricing
    formula: |
      base = min(claimed_qty x unit_invoiced_cents_of_line,
                 round_half_up(claimed_qty x standard_price_cents_of_family x SETTLEMENT_CAP_MULT))
      age_days = floor((claim approve clock - shipment.delivered_at) in days)
      age_factor = 1.0 if age_days <= EARLY_FULL_DAYS else LATE_FACTOR   # claim window already guarantees <= 14 days
      settlement_cents = round_half_up(base x age_factor)
      For resolution == REPLACEMENT: settlement_cents = 0 (goods, not money).
      Non-linear: nested min() cap, conditional age tier, branch on resolution.
    input_set: "The claim, its order line (unit_invoiced_cents; falls back to unit_quoted_cents when not yet invoiced), the family's standard_price_cents in the line the order priced against, shipment.delivered_at"
    constants:
      SETTLEMENT_CAP_MULT: 1.20
      EARLY_FULL_DAYS: 7
      LATE_FACTOR: 0.8
    precision: "integer cents, round_half_up at the final step"

  - name: disposition_reconciliation
    trigger: "POST /cabinet/lines/{id}/disposition-actions"
    algorithm: waterfall_allocation
    formula: |
      For a SUNSETTING line with original_disposition_qty Q:
        remaining = Q - SUM(disposition_actions[].qty)
      Each action of type RTV | LIQUIDATE | TRANSFER | DESTROY with qty:
        qty must satisfy 0 < qty <= remaining (ERR_DISPOSITION_OVERAGE otherwise)
      Action types RTV/LIQUIDATE/TRANSFER are rejected once the logical clock
      exceeds the program's disposition_deadline (ERR_DISPOSITION_WINDOW_EXPIRED);
      DESTROY is exempt from the deadline.
      When remaining reaches exactly 0 AND all of the line's DisplayResets are
      COMPLETE or WAIVED, the line auto-transitions SUNSETTING -> RETIRED.
      Invariant: SUM(actions.qty) + remaining_disposition_qty == original_disposition_qty at all times.
    input_set: "The line's disposition_actions, logical clock, program disposition_deadline"
    constants: {}
    precision: "integer units"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins when a
#     request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role authorization: caller's role is in the endpoint's role list; per-transition role pins (order ACKNOWLEDGED requires ProgramManager, SCHEDULED/IN_PRODUCTION/MFG_COMPLETE require PlantScheduler; replacement SCHEDULED/IN_PRODUCTION require PlantScheduler, SHIPPED/RECEIVED/REMAKE require LogisticsCoordinator; display-reset WAIVED requires ProgramManager, SCHEDULED/COMPLETE require FieldServiceRep); entity-backed ownership (DealerRep X-User-ID == order/claim account_id; RetailDesigner X-User-ID == design_job.designer_user_id; RetailDesigner filing a claim must own the order's design_job); segregation of duties on claim APPROVED/DENIED (deciding X-User-ID != filed_by_user_id -> ERR_SEGREGATION_OF_DUTIES)"
    error_id: "ERR_FORBIDDEN | ERR_SEGREGATION_OF_DUTIES"
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path ids and request-body FK ids (account_id, program_id, shipment_id, order_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 4
    category: state
    check: "OCC: expected_program_version on POST /cabinet/programs/{id}/lines equals the program's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /cabinet/programs/{id}/lines"
  - priority: 5
    category: state
    check: "State preconditions: from-state legal for the requested to_status per the entity's state machine (ERR_INVALID_STATE); account must be ACTIVE for order create / acknowledge / design-job create / convert / claim file (ERR_ACCOUNT_NOT_ACTIVE); program must be ACTIVE or TRANSITIONING for order create / convert / acknowledge (ERR_PROGRAM_NOT_ACTIVE); no line creation while TRANSITIONING (ERR_PROGRAM_TRANSITIONING); activate requires an ACTIVE line (ERR_NO_ACTIVE_LINE); convert requires quoted_line_id still ACTIVE (ERR_QUOTE_STALE); claims only on DELIVERED shipments (ERR_SHIPMENT_NOT_DELIVERED); cancel only from SUBMITTED/ACKNOWLEDGED/SCHEDULED (ERR_ORDER_NOT_CANCELLABLE); invoice only from MFG_COMPLETE/SHIPPED/DELIVERED (ERR_INVALID_STATE)"
    error_id: "ERR_INVALID_STATE | ERR_ACCOUNT_NOT_ACTIVE | ERR_PROGRAM_NOT_ACTIVE | ERR_PROGRAM_TRANSITIONING | ERR_NO_ACTIVE_LINE | ERR_QUOTE_STALE | ERR_SHIPMENT_NOT_DELIVERED | ERR_ORDER_NOT_CANCELLABLE"
    http_status: 409
    applies_to: "all state-transition and create endpoints"
  - priority: 6
    category: business_referential
    check: "Every referenced family_code exists among the program's ACTIVE line families (ERR_LINE_NOT_COVERED); destination/store_code of design jobs and STORE orders must be an element of the account's store_codes (ERR_STORE_NOT_SERVICED); a CURRENT FinishBatch exists for each ordered finish_code at IN_PRODUCTION and at replacement approval/scheduling (ERR_NO_CURRENT_BATCH); line_index within range of the order's lines and order_id matches shipment.order_id (ERR_INVALID_REQUEST); RETAIL accounts may not place direct orders and dealer/builder orders may not carry design_job_id (ERR_CHANNEL_REQUIRES_DESIGN_JOB)"
    error_id: "ERR_LINE_NOT_COVERED | ERR_STORE_NOT_SERVICED | ERR_NO_CURRENT_BATCH | ERR_INVALID_REQUEST | ERR_CHANNEL_REQUIRES_DESIGN_JOB"
    http_status: 422
    applies_to: "POST /cabinet/orders, POST /cabinet/design-jobs(+transitions), POST /cabinet/claims, POST /cabinet/design-jobs/{id}/convert, order/replacement production transitions"
  - priority: 7
    category: business_temporal
    check: "Designer measurement windows: per designer_user_id, windows of jobs with status IN {REQUESTED, MEASURED} must not overlap; half-open [start,end) so back-to-back at the SAME store_code is allowed, but across DIFFERENT store_codes a 30-minute travel buffer is required (gap >= 30 min) (ERR_DESIGNER_WINDOW_OVERLAP); measure_window_end > start and start >= logical clock (ERR_MEASURE_WINDOW_INVALID); requested_delivery_week - min(base_lead_weeks) >= current week at order create (ERR_DELIVERY_WEEK_INVALID); claim filed_at <= shipment.delivered_at + 14 days inclusive (ERR_CLAIM_WINDOW_EXPIRED); slot week >= current week at creation (ERR_SLOT_WEEK_PAST); disposition actions other than DESTROY rejected after disposition_deadline (ERR_DISPOSITION_WINDOW_EXPIRED)"
    error_id: "ERR_DESIGNER_WINDOW_OVERLAP | ERR_MEASURE_WINDOW_INVALID | ERR_DELIVERY_WEEK_INVALID | ERR_CLAIM_WINDOW_EXPIRED | ERR_SLOT_WEEK_PAST | ERR_DISPOSITION_WINDOW_EXPIRED"
    http_status: 422
    applies_to: "design-job create/revise, order create/convert, claim file, slot create, disposition actions"
  - priority: 8
    category: business_constraint
    check: "Slot (plant_code, family_code, week) unique (ERR_SLOT_EXISTS); design-job backward revisions capped at 3 (ERR_REVISION_LIMIT_EXCEEDED); aggregate claimed_qty over non-DENIED claims per (shipment, line_index) must not exceed the shipped line quantity (ERR_CLAIM_QUANTITY_EXCEEDED); replacement color match deltaE <= 2.0 inclusive (ERR_COLOR_MISMATCH); capacity selector found a slot else ERR_NO_CAPACITY; disposition action qty <= remaining (ERR_DISPOSITION_OVERAGE); account close requires no open orders (ERR_ACCOUNT_HAS_OPEN_ORDERS)"
    error_id: "ERR_SLOT_EXISTS | ERR_REVISION_LIMIT_EXCEEDED | ERR_CLAIM_QUANTITY_EXCEEDED | ERR_COLOR_MISMATCH | ERR_NO_CAPACITY | ERR_DISPOSITION_OVERAGE | ERR_ACCOUNT_HAS_OPEN_ORDERS"
    http_status: 422
    applies_to: "slot create, design-job revise, claim file/decide, replacement schedule, disposition actions, account status"
  - priority: 9
    category: business_fiscal
    check: "Credit gate at order scheduling: payment_status must be UNINVOICED (an order on CREDIT_HOLD cannot schedule)"
    error_id: ERR_CREDIT_HOLD
    http_status: 409
    applies_to: "POST /cabinet/orders/{id}/transition {to_status: SCHEDULED}"

# =============================================================================
# 1.5 API Endpoint Table (40 endpoints)
# =============================================================================
endpoints:
  # --- Platform / logical clock (UNPREFIXED, outside api_prefix) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used by every deadline/window/week rule. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["current week recomputed from the new clock; deadline gates re-evaluate lazily on next write"]

  # --- Accounts ---
  - method: POST
    path: "/cabinet/accounts"
    description: "Create a channel partner account (RETAIL/DEALER/BUILDER)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, channel, pricing_class, lead_time_class, credit_limit_cents, "store_codes?"]
    output: Account
    side_effects: ["status=ACTIVE, open_exposure_cents=0"]
  - method: GET
    path: "/cabinet/accounts/{id}"
    description: "Read one account including computed open_exposure_cents"
    roles: [PlatformAdmin, ProgramManager, PlantScheduler, LogisticsCoordinator, ClaimsAdjuster, FieldServiceRep, RetailDesigner, DealerRep]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: POST
    path: "/cabinet/accounts/{id}/status"
    description: "Account lifecycle: ACTIVE <-> SUSPENDED, ACTIVE/SUSPENDED -> CLOSED"
    roles: [PlatformAdmin]
    code: 200
    input: [to_status]
    output: Account
    side_effects: ["per Account state machine; increments Account.version by 1"]

  # --- Programs & lines ---
  - method: POST
    path: "/cabinet/programs"
    description: "Create a cabinet program for an account (starts DRAFT)"
    roles: [ProgramManager]
    code: 201
    input: [account_id, name, program_discount_pct]
    output: Program
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/cabinet/programs/{id}"
    description: "Read one program including computed deadlines and open_order_count"
    roles: [PlatformAdmin, ProgramManager, PlantScheduler, LogisticsCoordinator, ClaimsAdjuster, FieldServiceRep, RetailDesigner, DealerRep]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: GET
    path: "/cabinet/programs"
    description: "List programs; optional account_id/status filters; paginated"
    roles: [PlatformAdmin, ProgramManager, PlantScheduler, LogisticsCoordinator, ClaimsAdjuster, FieldServiceRep, RetailDesigner, DealerRep]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: Program[]
    side_effects: []
  - method: POST
    path: "/cabinet/programs/{id}/activate"
    description: "Activate a DRAFT program (requires exactly one ACTIVE line and ACTIVE account)"
    roles: [ProgramManager]
    code: 200
    input: []
    output: Program
    side_effects: ["Program DRAFT -> ACTIVE; increments Program.version by 1"]
  - method: POST
    path: "/cabinet/programs/{id}/lines"
    description: "Create a ProgramLine. On a DRAFT program: only when no ACTIVE line exists yet (first line). On an ACTIVE program: the new line SUPERSEDES the current ACTIVE line — old line -> SUNSETTING with disposition initialized, program -> TRANSITIONING, display resets created, SUBMITTED orders repriced (see ProgramLine machine). OCC-guarded via expected_program_version."
    roles: [ProgramManager]
    code: 201
    input: [line_code, effective_start_week, families, expected_program_version, "old_line_disposition_qty?"]
    output: ProgramLine
    side_effects: ["increments Program.version by 1", "new line ACTIVE with supersedes_line_id set when superseding", "prior ACTIVE line -> SUNSETTING cascade"]
  - method: GET
    path: "/cabinet/lines/{id}"
    description: "Read one program line including disposition fields"
    roles: [PlatformAdmin, ProgramManager, PlantScheduler, LogisticsCoordinator, ClaimsAdjuster, FieldServiceRep, RetailDesigner, DealerRep]
    code: 200
    input: []
    output: ProgramLine
    side_effects: []
  - method: GET
    path: "/cabinet/lines"
    description: "List program lines; optional program_id/supersedes_line_id/status filters; paginated"
    roles: [PlatformAdmin, ProgramManager, PlantScheduler, LogisticsCoordinator, ClaimsAdjuster, FieldServiceRep, RetailDesigner, DealerRep]
    code: 200
    input: ["program_id?", "supersedes_line_id?", "status?", "limit?", "offset?"]
    output: ProgramLine[]
    side_effects: []
  - method: POST
    path: "/cabinet/lines/{id}/disposition-actions"
    description: "Append a disposition action (RTV|LIQUIDATE|TRANSFER|DESTROY) to a SUNSETTING line; waterfall per disposition_reconciliation"
    roles: [ProgramManager]
    code: 201
    input: [action_type, qty]
    output: ProgramLine
    side_effects: ["remaining_disposition_qty -= qty", "at remaining == 0 with all resets terminal: line auto-RETIRES (may auto-complete program transition)"]

  # --- Finish batches ---
  - method: POST
    path: "/cabinet/finish-batches"
    description: "Register a finish/material batch; becomes CURRENT for its finish_code and auto-retires the prior CURRENT batch of that code"
    roles: [PlatformAdmin]
    code: 201
    input: [finish_code, batch_code, lab_l, lab_a, lab_b, effective_from]
    output: FinishBatch
    side_effects: ["prior CURRENT batch of same finish_code -> RETIRED"]
  - method: POST
    path: "/cabinet/finish-batches/{id}/retire"
    description: "Manually retire a batch (material change without replacement)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FinishBatch
    side_effects: ["status -> RETIRED"]

  # --- Capacity ---
  - method: POST
    path: "/cabinet/production-slots"
    description: "Open a weekly capacity bucket for a plant x product family"
    roles: [PlantScheduler]
    code: 201
    input: [plant_code, family_code, week, capacity_units]
    output: ProductionSlot
    side_effects: ["status=OPEN, committed_units=0"]
  - method: GET
    path: "/cabinet/production-slots"
    description: "List capacity slots; optional plant_code/family_code/week/status filters; paginated"
    roles: [PlatformAdmin, ProgramManager, PlantScheduler]
    code: 200
    input: ["plant_code?", "family_code?", "week?", "status?", "limit?", "offset?"]
    output: ProductionSlot[]
    side_effects: []

  # --- Design service (retail channel) ---
  - method: POST
    path: "/cabinet/design-jobs"
    description: "Book a retail kitchen design job with an on-site measurement window; designer_user_id = caller"
    roles: [RetailDesigner]
    code: 201
    input: [account_id, program_id, store_code, measure_window_start, measure_window_end]
    output: DesignJob
    side_effects: ["status=REQUESTED", "designer-overlap temporal rule enforced"]
  - method: GET
    path: "/cabinet/design-jobs/{id}"
    description: "Read one design job"
    roles: [RetailDesigner, ProgramManager, PlatformAdmin]
    code: 200
    input: []
    output: DesignJob
    side_effects: []
  - method: GET
    path: "/cabinet/design-jobs"
    description: "List design jobs; optional account_id/program_id/quoted_line_id/designer_user_id/status filters; paginated"
    roles: [RetailDesigner, ProgramManager, PlatformAdmin]
    code: 200
    input: ["account_id?", "program_id?", "quoted_line_id?", "designer_user_id?", "status?", "limit?", "offset?"]
    output: DesignJob[]
    side_effects: []
  - method: POST
    path: "/cabinet/design-jobs/{id}/transition"
    description: "Drive the design-job machine: MEASURED, LAYOUT_READY (requires layout_lines), QUOTED, revise back to LAYOUT_READY/MEASURED (revision-capped; MEASURED requires a fresh non-overlapping window), CANCELLED"
    roles: [RetailDesigner]
    code: 200
    input: [to_status, "layout_lines?", "measure_window_start?", "measure_window_end?"]
    output: DesignJob
    side_effects: ["per DesignJob state machine; QUOTED computes order_pricing quoted variant"]
  - method: POST
    path: "/cabinet/design-jobs/{id}/convert"
    description: "Convert a QUOTED design job into a SUBMITTED order (the only way a RETAIL-channel order is created)"
    roles: [RetailDesigner]
    code: 201
    input: [destination_type, requested_delivery_week, "store_code?", "jobsite_address?"]
    output: Order
    side_effects: ["DesignJob QUOTED -> CONVERTED", "Order created in SUBMITTED/UNINVOICED", "credit_exposure recompute"]

  # --- Orders ---
  - method: POST
    path: "/cabinet/orders"
    description: "Direct order placement for DEALER/BUILDER accounts only; account_id must equal the DealerRep X-User-ID"
    roles: [DealerRep]
    code: 201
    input: [account_id, program_id, destination_type, requested_delivery_week, lines, "store_code?", "jobsite_address?"]
    output: Order
    side_effects: ["status=SUBMITTED, payment_status=UNINVOICED", "order_pricing quoted variant computed", "promised_delivery_week computed", "credit_exposure recompute"]
  - method: GET
    path: "/cabinet/orders/{id}"
    description: "Read one order including computed pricing fields"
    roles: [PlatformAdmin, ProgramManager, PlantScheduler, LogisticsCoordinator, ClaimsAdjuster, RetailDesigner, DealerRep]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/cabinet/orders"
    description: "List orders; optional account_id/program_id/design_job_id/status filters; paginated"
    roles: [PlatformAdmin, ProgramManager, PlantScheduler, LogisticsCoordinator, ClaimsAdjuster, RetailDesigner, DealerRep]
    code: 200
    input: ["account_id?", "program_id?", "design_job_id?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/cabinet/orders/{id}/transition"
    description: "Drive the fulfillment dimension: ACKNOWLEDGED (ProgramManager; credit evaluation + price lock), SCHEDULED (PlantScheduler; capacity_slot_selection strict variant), IN_PRODUCTION (pins finish batches), MFG_COMPLETE (auto-creates the Shipment)"
    roles: [ProgramManager, PlantScheduler]
    code: 200
    input: [to_status]
    output: Order
    side_effects: ["per Order state machine; role pinned per to_status"]
  - method: POST
    path: "/cabinet/orders/{id}/financial"
    description: "Drive the payment dimension: INVOICED (order_pricing invoiced variant), PAID"
    roles: [ProgramManager]
    code: 200
    input: [to_status]
    output: Order
    side_effects: ["per Order payment machine", "credit_exposure recompute + CREDIT_HOLD re-evaluation"]
  - method: POST
    path: "/cabinet/orders/{id}/cancel"
    description: "Cancel from SUBMITTED/ACKNOWLEDGED/SCHEDULED only; compensating release of committed slot units when SCHEDULED"
    roles: [DealerRep, ProgramManager]
    code: 200
    input: []
    output: Order
    side_effects: ["slot committed_units released when SCHEDULED (slot may auto-OPEN)", "credit_exposure recompute + CREDIT_HOLD re-evaluation"]

  # --- Shipments ---
  - method: GET
    path: "/cabinet/shipments/{id}"
    description: "Read one shipment"
    roles: [LogisticsCoordinator, ProgramManager, DealerRep, PlatformAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: GET
    path: "/cabinet/shipments"
    description: "List shipments; optional order_id/status filters; paginated (an order's shipment is discoverable here after MFG_COMPLETE)"
    roles: [LogisticsCoordinator, ProgramManager, DealerRep, PlatformAdmin]
    code: 200
    input: ["order_id?", "status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []
  - method: POST
    path: "/cabinet/shipments/{id}/transition"
    description: "Drive the shipment machine: LOADED, IN_TRANSIT (order -> SHIPPED), DELIVERED (order -> DELIVERED, delivered_at set), FAILED (attempt_count++; auto-RETURNED at 3), PLANNED (retry from FAILED)"
    roles: [LogisticsCoordinator]
    code: 200
    input: [to_status]
    output: Shipment
    side_effects: ["per Shipment state machine; cascades into the linked Order"]

  # --- Damage claims & replacement logistics ---
  - method: POST
    path: "/cabinet/claims"
    description: "File a damage claim against a delivered shipment line; filed_by_user_id = caller"
    roles: [LogisticsCoordinator, DealerRep, RetailDesigner, ClaimsAdjuster]
    code: 201
    input: [shipment_id, order_id, line_index, claimed_qty]
    output: DamageClaim
    side_effects: ["status=FILED", "claim-window, aggregate-quantity and ownership validations"]
  - method: GET
    path: "/cabinet/claims/{id}"
    description: "Read one claim"
    roles: [ClaimsAdjuster, LogisticsCoordinator, DealerRep, RetailDesigner, ProgramManager, PlatformAdmin]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []
  - method: GET
    path: "/cabinet/claims"
    description: "List claims; optional shipment_id/order_id/status filters; paginated"
    roles: [ClaimsAdjuster, LogisticsCoordinator, DealerRep, RetailDesigner, ProgramManager, PlatformAdmin]
    code: 200
    input: ["shipment_id?", "order_id?", "status?", "limit?", "offset?"]
    output: DamageClaim[]
    side_effects: []
  - method: POST
    path: "/cabinet/claims/{id}/transition"
    description: "Drive the claim machine: UNDER_REVIEW, APPROVED (requires resolution; segregated from filer; REPLACEMENT auto-creates a ReplacementOrder, CREDIT computes damage_settlement), DENIED"
    roles: [ClaimsAdjuster]
    code: 200
    input: [to_status, "resolution?"]
    output: DamageClaim
    side_effects: ["per DamageClaim state machine; segregation of duties enforced"]
  - method: GET
    path: "/cabinet/replacement-orders/{id}"
    description: "Read one replacement order"
    roles: [PlantScheduler, LogisticsCoordinator, ClaimsAdjuster, ProgramManager, PlatformAdmin]
    code: 200
    input: []
    output: ReplacementOrder
    side_effects: []
  - method: GET
    path: "/cabinet/replacement-orders"
    description: "List replacement orders; optional damage_claim_id/finish_batch_id/original_finish_batch_id/order_id/status filters; paginated"
    roles: [PlantScheduler, LogisticsCoordinator, ClaimsAdjuster, ProgramManager, PlatformAdmin]
    code: 200
    input: ["damage_claim_id?", "finish_batch_id?", "original_finish_batch_id?", "order_id?", "status?", "limit?", "offset?"]
    output: ReplacementOrder[]
    side_effects: []
  - method: POST
    path: "/cabinet/replacement-orders/{id}/transition"
    description: "Drive the replacement machine: SCHEDULED (color-match + expedite capacity; PlantScheduler), IN_PRODUCTION (PlantScheduler), SHIPPED/RECEIVED/REMAKE (LogisticsCoordinator; REMAKE loops back toward SCHEDULED), CANCELLED (PlantScheduler from CREATED/SCHEDULED)"
    roles: [PlantScheduler, LogisticsCoordinator]
    code: 200
    input: [to_status]
    output: ReplacementOrder
    side_effects: ["per ReplacementOrder state machine; expedite overbook up to floor(capacity x 0.10)"]

  # --- Program transition: display resets ---
  - method: GET
    path: "/cabinet/display-resets/{id}"
    description: "Read one display reset"
    roles: [FieldServiceRep, ProgramManager, PlatformAdmin]
    code: 200
    input: []
    output: DisplayReset
    side_effects: []
  - method: GET
    path: "/cabinet/display-resets"
    description: "List display resets; optional program_id/line_id/store_code/status filters; paginated"
    roles: [FieldServiceRep, ProgramManager, PlatformAdmin]
    code: 200
    input: ["program_id?", "line_id?", "store_code?", "status?", "limit?", "offset?"]
    output: DisplayReset[]
    side_effects: []
  - method: POST
    path: "/cabinet/display-resets/{id}/transition"
    description: "Drive the reset machine: SCHEDULED (requires scheduled_date) / COMPLETE by FieldServiceRep; WAIVED by ProgramManager"
    roles: [FieldServiceRep, ProgramManager]
    code: 200
    input: [to_status, "scheduled_date?"]
    output: DisplayReset
    side_effects: ["per DisplayReset state machine; may trigger line auto-retire"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID header missing or role value unknown" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint/transition, or entity-backed ownership mismatch (DealerRep account match, RetailDesigner designer match)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "ClaimsAdjuster deciding a claim whose filed_by_user_id equals the decider's X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced body FK does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, malformed value, or conditionally-required field absent (layout_lines, resolution, scheduled_date, store_code/jobsite_address per destination_type, line_index out of range, order_id != shipment.order_id)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_program_version does not match the program's current version on POST /cabinet/programs/{id}/lines" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested to_status is not a legal edge from the entity's current state (including shipment replan when attempts exhausted, invoice before MFG_COMPLETE)" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Account SUSPENDED or CLOSED where the operation requires ACTIVE (order create/acknowledge, design-job create/convert, claim file, program activate)" }
  - { id: ERR_ACCOUNT_HAS_OPEN_ORDERS, http: 409, condition: "Account close attempted while orders exist with status IN {SUBMITTED, ACKNOWLEDGED, SCHEDULED, IN_PRODUCTION, MFG_COMPLETE, SHIPPED}" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Operation requires program ACTIVE or TRANSITIONING but program is DRAFT" }
  - { id: ERR_PROGRAM_TRANSITIONING, http: 409, condition: "Line creation or program activation attempted while the program is TRANSITIONING" }
  - { id: ERR_NO_ACTIVE_LINE, http: 409, condition: "Program activate attempted with no ProgramLine in ACTIVE status" }
  - { id: ERR_QUOTE_STALE, http: 409, condition: "Design-job convert attempted after the line the quote was priced against left ACTIVE status (superseded); re-quote required" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Cancel attempted from IN_PRODUCTION, MFG_COMPLETE, SHIPPED, DELIVERED, or CANCELLED" }
  - { id: ERR_SHIPMENT_NOT_DELIVERED, http: 409, condition: "Damage claim filed against a shipment not in DELIVERED status" }
  - { id: ERR_LINE_NOT_COVERED, http: 422, condition: "A referenced family_code is not present in the program's ACTIVE line families (unknown code, or family only on a SUNSETTING/RETIRED line)" }
  - { id: ERR_STORE_NOT_SERVICED, http: 422, condition: "store_code is not an element of the account's store_codes (design-job store, STORE destination)" }
  - { id: ERR_NO_CURRENT_BATCH, http: 422, condition: "No FinishBatch with status == CURRENT exists for a required finish_code (at IN_PRODUCTION pinning, replacement approval, or replacement scheduling)" }
  - { id: ERR_DESIGNER_WINDOW_OVERLAP, http: 409, condition: "Measurement window collides with another of the same designer's jobs in REQUESTED/MEASURED; same-store windows may touch (half-open), different-store windows need a 30-minute buffer" }
  - { id: ERR_MEASURE_WINDOW_INVALID, http: 422, condition: "measure_window_end <= start, or start before the logical clock" }
  - { id: ERR_DELIVERY_WEEK_INVALID, http: 422, condition: "requested_delivery_week - min(base_lead_weeks of ordered families) is before the current week" }
  - { id: ERR_CLAIM_WINDOW_EXPIRED, http: 422, condition: "Claim filed more than 14 days after shipment.delivered_at (deadline inclusive: filed_at <= delivered_at + 14 days passes)" }
  - { id: ERR_SLOT_WEEK_PAST, http: 422, condition: "Production slot created for a week before the current logical-clock week" }
  - { id: ERR_DISPOSITION_WINDOW_EXPIRED, http: 422, condition: "RTV/LIQUIDATE/TRANSFER disposition action after the program's disposition_deadline; DESTROY remains allowed" }
  - { id: ERR_SLOT_EXISTS, http: 409, condition: "A ProductionSlot already exists for (plant_code, family_code, week)" }
  - { id: ERR_REVISION_LIMIT_EXCEEDED, http: 422, condition: "A fourth backward revision of a design job (cap: 3)" }
  - { id: ERR_CLAIM_QUANTITY_EXCEEDED, http: 422, condition: "Aggregate claimed_qty over non-DENIED claims for the same (shipment, line_index) would exceed the shipped line quantity" }
  - { id: ERR_COLOR_MISMATCH, http: 422, condition: "Replacement color check failed: deltaE between replacement batch and original pinned batch > 2.0" }
  - { id: ERR_NO_CAPACITY, http: 422, condition: "capacity_slot_selection found no eligible slot within the applicable window (strict or expedite variant)" }
  - { id: ERR_CHANNEL_REQUIRES_DESIGN_JOB, http: 422, condition: "Direct POST /cabinet/orders for a RETAIL-channel account, or a dealer/builder order carrying a design_job_id" }
  - { id: ERR_DISPOSITION_OVERAGE, http: 422, condition: "Disposition action qty exceeds the line's remaining_disposition_qty (or qty <= 0)" }
  - { id: ERR_CREDIT_HOLD, http: 409, condition: "Order scheduling attempted while payment_status == CREDIT_HOLD" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Manufacturer platform operator: accounts, finish batches, logical clock"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc", "POST /cabinet/accounts", "POST /cabinet/accounts/{id}/status", "POST /cabinet/finish-batches", "POST /cabinet/finish-batches/{id}/retire"]
    shared_operations: ["read endpoints"]
  - name: ProgramManager
    description: "Manufacturer program office: programs, lines, disposition, order acknowledge/financial, reset waivers"
    identity: opaque
    exclusive_operations: ["POST /cabinet/programs", "POST /cabinet/programs/{id}/activate", "POST /cabinet/programs/{id}/lines", "POST /cabinet/lines/{id}/disposition-actions", "POST /cabinet/orders/{id}/financial", "order transition to ACKNOWLEDGED", "display-reset transition to WAIVED"]
    shared_operations: ["POST /cabinet/orders/{id}/cancel (shared with DealerRep)", "read endpoints"]
  - name: RetailDesigner
    description: "Retail kitchen designer: design jobs and retail order generation; owns a job via designer_user_id == X-User-ID"
    identity: opaque
    exclusive_operations: ["POST /cabinet/design-jobs", "POST /cabinet/design-jobs/{id}/transition", "POST /cabinet/design-jobs/{id}/convert"]
    shared_operations: ["POST /cabinet/claims for orders whose design job the designer owns", "read endpoints"]
  - name: DealerRep
    description: "Dealer/builder representative acting as their account: X-User-ID equals the Account id"
    identity: entity_backed:Account
    exclusive_operations: ["POST /cabinet/orders"]
    shared_operations: ["POST /cabinet/orders/{id}/cancel (own account only)", "POST /cabinet/claims (own account's orders only)", "read endpoints"]
  - name: PlantScheduler
    description: "Plant capacity planner: production slots, order production scheduling, replacement scheduling/production"
    identity: opaque
    exclusive_operations: ["POST /cabinet/production-slots", "order transitions to SCHEDULED/IN_PRODUCTION/MFG_COMPLETE", "replacement transitions to SCHEDULED/IN_PRODUCTION/CANCELLED"]
    shared_operations: ["read endpoints"]
  - name: LogisticsCoordinator
    description: "Delivery and claims intake: shipments, damage-claim filing, replacement shipping/receiving"
    identity: opaque
    exclusive_operations: ["POST /cabinet/shipments/{id}/transition", "replacement transitions to SHIPPED/RECEIVED/REMAKE"]
    shared_operations: ["POST /cabinet/claims", "read endpoints"]
  - name: ClaimsAdjuster
    description: "Independent claim adjudicator; segregated from the claim filer"
    identity: opaque
    exclusive_operations: ["POST /cabinet/claims/{id}/transition"]
    shared_operations: ["POST /cabinet/claims (may file; may never decide own filing)", "read endpoints"]
  - name: FieldServiceRep
    description: "Field merchandising crew executing display resets"
    identity: opaque
    exclusive_operations: ["display-reset transitions to SCHEDULED/COMPLETE"]
    shared_operations: ["read endpoints"]
