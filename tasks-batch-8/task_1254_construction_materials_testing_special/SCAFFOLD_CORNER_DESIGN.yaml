# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# task_1254_construction_materials_testing_special
# Breadth probe over §1.1–§1.7 claims NOT already covered by §1.8.
# Sections follow references/claim-extraction-guide.md.
# All chains replay from empty-DB; clock default is 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_project_defaults_applied
        claim_type: creation
        grounds: [entities.Project]
        distinguishing_aspect: "POST /api/projects with all required fields returns 201 and server-computed defaults: status ACTIVE, compliance_posture IN_PROGRESS, open_ncr_count 0, letter_status NONE, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/projects"
              payload: { name: "Defaults", permit_number: "P-ENT-1", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {pid: $.data.id, pstat: $.data.status, posture: $.data.compliance_posture, cnt: $.data.open_ncr_count, lstat: $.data.letter_status, ver: $.data.version}
          assert:
            - "status == ACTIVE and compliance_posture == IN_PROGRESS and open_ncr_count == 0 and letter_status == NONE and version == 1"
            - "id is a server-minted UUID; created_at/updated_at present with three fractional digits"

      - name: get_project_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Project, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent project id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/projects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ProjectManager
              captures: {err: $.data.error_id}
          assert:
            - "http status 404 and error_id == ERR_NOT_FOUND"

      - name: duplicate_permit_number_rejected
        claim_type: violation_to_error
        grounds: [entities.Project.fields.permit_number, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Second project created with an identical permit_number fails uniqueness with ERR_VALIDATION (400) while the first remains intact."
        test_recipe:
          setup: ["one project with permit_number P-ENT-2"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "First", permit_number: "P-ENT-2", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {p1: $.data.id}
          trigger:
            - call: "POST /api/projects"
              payload: { name: "Second", permit_number: "P-ENT-2", jurisdiction: "City B", contractor_name: "Other Co", building_official_name: "BO Jones" }
              as: AgencyAdmin
              captures: {err: $.data.error_id}
          assert:
            - "error_id == ERR_VALIDATION and http status 400"
            - "GET /api/projects/${p1} still returns the first project unchanged"

      - name: scope_items_created_as_revision_snapshot
        claim_type: creation
        grounds: [entities.ScopeItem, state_machines.SSIRevision]
        distinguishing_aspect: "Scope items exist only as children of a revision create: after POST ssi-revisions with two items, both are OPEN with completed_count 0 and the revision is DRAFT with revision_number 1."
        test_recipe:
          setup: ["one project"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Snapshot", permit_number: "P-ENT-3", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id}
          trigger:
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4000
                scope_items:
                  - { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 }
                  - { test_method: WELD_VISUAL, description: "frames", required_cert_level: 2, required_count: 3 }
              as: ProjectManager
              captures: {ssi_id: $.data.id, rnum: $.data.revision_number, rstat: $.data.status}
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {s1: "$.data[0].status", c1: "$.data[0].completed_count", s2: "$.data[1].status"}
          assert:
            - "revision status == DRAFT and revision_number == 1"
            - "both scope items status == OPEN and completed_count == 0"

      - name: lab_sample_computed_break_due_at
        claim_type: computed_fields
        grounds: [entities.LabSample.fields.break_due_at, calculations.break_window_tolerance]
        distinguishing_aspect: "break_due_at is computed as cast_at + required_break_age_days: cast 2026-05-01T08:00:00Z with age 7 yields exactly 2026-05-08T08:00:00Z; client-supplied break_due_at would be ignored."
        test_recipe:
          setup:
            - "project with APPROVED SSI (CONCRETE_STRENGTH item), lab, certified technician t1, DISPATCHED assignment"
          setup_api_calls:
            - call: "POST /api/labs"
              payload: { name: "Lab One", lab_code: "L1", daily_break_capacity: 10 }
              as: AgencyAdmin
              captures: {lab_id: $.data.id}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: CONCRETE_STRENGTH, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1: $.data.id}
            - call: "POST /api/projects"
              payload: { name: "DueAt", permit_number: "P-ENT-4", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload:
                specified_fc_psi: 4000
                scope_items:
                  - { test_method: CONCRETE_STRENGTH, description: "footings", required_cert_level: 1, required_count: 1 }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1}", work_date: "2026-05-01", start_time: "08:00", end_time: "09:00" }
              as: ProjectManager
              captures: {asg: $.data.id}
            - call: "POST /api/assignments/${asg}/dispatch"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /api/lab-samples"
              payload: { assignment_id: "${asg}", lab_id: "${lab_id}", cast_at: "2026-05-01T08:00:00Z", required_break_age_days: 7 }
              as: Technician
              as_user_id: "${t1}"
              captures: {due: $.data.break_due_at, stat: $.data.status}
          assert:
            - "LabSample.break_due_at == 2026-05-08T08:00:00Z and status == CAST"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: ssi_approve_supersedes_prior_revision
        claim_type: side_effect_execution
        grounds: [state_machines.SSIRevision.SUBMITTED_to_APPROVED, entities.Project.fields.current_approved_ssi_id]
        distinguishing_aspect: "Approving revision 2 while revision 1 is APPROVED cascades: revision 1 -> SUPERSEDED and project.current_approved_ssi_id switches to revision 2."
        test_recipe:
          setup: ["project with revision R1 APPROVED (project.version advanced to 2) and revision R2 SUBMITTED"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Supersede", permit_number: "P-SM-1", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, pv1: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload: { specified_fc_psi: 4000, scope_items: [ { test_method: WELD_VISUAL, description: "frames", required_cert_level: 1, required_count: 1 } ] }
              as: ProjectManager
              captures: {r1: $.data.id}
            - call: "POST /api/ssi-revisions/${r1}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${r1}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${pv1}" }
              as: EngineerOfRecord
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload: { specified_fc_psi: 4500, scope_items: [ { test_method: WELD_VISUAL, description: "frames v2", required_cert_level: 1, required_count: 2 } ] }
              as: ProjectManager
              captures: {r2: $.data.id}
            - call: "POST /api/ssi-revisions/${r2}/submit"
              payload: {}
              as: ProjectManager
            - call: "GET /api/projects/${proj_id}"
              as: ProjectManager
              captures: {pv2: $.data.version}
          trigger:
            - call: "POST /api/ssi-revisions/${r2}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${pv2}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${r1}"
              as: ProjectManager
              captures: {r1_stat: $.data.status}
            - call: "GET /api/projects/${proj_id}"
              as: ProjectManager
              captures: {cur: $.data.current_approved_ssi_id}
          assert:
            - "R1.status == SUPERSEDED after R2 approval"
            - "R2.status == APPROVED and project.current_approved_ssi_id == ${r2}"

      - name: ssi_reject_is_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SSIRevision.SUBMITTED_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A REJECTED revision is terminal: a subsequent submit attempt fails ERR_INVALID_STATE and the revision stays REJECTED."
        test_recipe:
          setup: ["project with one revision REJECTED by the engineer"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Reject", permit_number: "P-SM-2", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, pv1: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload: { specified_fc_psi: 4000, scope_items: [ { test_method: WELD_VISUAL, description: "frames", required_cert_level: 1, required_count: 1 } ] }
              as: ProjectManager
              captures: {r1: $.data.id}
            - call: "POST /api/ssi-revisions/${r1}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${r1}/approve"
              payload: { decision: "REJECT", expected_project_version: "${pv1}" }
              as: EngineerOfRecord
              captures: {rstat: $.data.status}
          trigger:
            - call: "POST /api/ssi-revisions/${r1}/submit"
              payload: {}
              as: ProjectManager
              captures: {err: $.data.error_id}
          assert:
            - "after REJECT decision: status == REJECTED"
            - "re-submit of REJECTED revision: error_id == ERR_INVALID_STATE"

      - name: assignment_requeue_loop_dispatched_to_requested
        claim_type: valid_transition
        grounds: [state_machines.InspectionAssignment.DISPATCHED_to_REQUESTED]
        distinguishing_aspect: "cancel with requeue=true loops a DISPATCHED assignment back to REQUESTED (cyclic shape), freeing the technician window; it can then be dispatched again."
        test_recipe:
          setup: ["project with APPROVED SSI (soil item), technician t1 with soil cert, one DISPATCHED assignment 2026-05-04 09:00-10:00"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Requeue", permit_number: "P-SM-3", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload: { specified_fc_psi: 4000, scope_items: [ { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 } ] }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {asg: $.data.id}
            - call: "POST /api/assignments/${asg}/dispatch"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /api/assignments/${asg}/cancel"
              payload: { requeue: true }
              as: ProjectManager
              captures: {st1: $.data.status}
            - call: "POST /api/assignments/${asg}/dispatch"
              payload: {}
              as: ProjectManager
              captures: {st2: $.data.status}
          assert:
            - "after requeue cancel: status == REQUESTED (loop back, not CANCELLED)"
            - "second dispatch succeeds: status == DISPATCHED"

      - name: complete_assignment_without_results_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.InspectionAssignment.DISPATCHED_to_COMPLETED, "errors[ERR_NO_RESULT_RECORDED]"]
        distinguishing_aspect: "Completing a DISPATCHED assignment that has zero FieldTests and zero LabSamples fails ERR_NO_RESULT_RECORDED; the assignment remains DISPATCHED."
        test_recipe:
          setup: ["project with APPROVED SSI (soil item), technician t1 with soil cert, one DISPATCHED assignment with no results"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "NoResult", permit_number: "P-SM-4", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload: { specified_fc_psi: 4000, scope_items: [ { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 } ] }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {asg: $.data.id}
            - call: "POST /api/assignments/${asg}/dispatch"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /api/assignments/${asg}/complete"
              payload: { completion_note: "nothing done" }
              as: Technician
              as_user_id: "${t1}"
              captures: {err: $.data.error_id}
          assert:
            - "error_id == ERR_NO_RESULT_RECORDED"
            - "GET /api/assignments/${asg}: status still DISPATCHED"

      - name: complete_assignment_by_other_technician_forbidden
        claim_type: precondition_enforcement
        grounds: [state_machines.InspectionAssignment.DISPATCHED_to_COMPLETED, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Entity-backed ownership: a Technician whose X-User-ID differs from assignment.technician_id cannot complete it (ERR_FORBIDDEN) even though the role is allowed on the endpoint."
        test_recipe:
          setup: ["project with APPROVED SSI (soil item), technicians t1 and t2 (both soil certs), one DISPATCHED assignment owned by t1 with one conforming result recorded by t1"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Owner", permit_number: "P-SM-5", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload: { specified_fc_psi: 4000, scope_items: [ { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 } ] }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1: $.data.id}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech Two", employee_code: "T2", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t2: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {asg: $.data.id}
            - call: "POST /api/assignments/${asg}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${asg}", measured_values: { field_dry_density_pcf: 118.0 } }
              as: Technician
              as_user_id: "${t1}"
          trigger:
            - call: "POST /api/assignments/${asg}/complete"
              payload: { completion_note: "t2 attempting" }
              as: Technician
              as_user_id: "${t2}"
              captures: {err: $.data.error_id}
          assert:
            - "error_id == ERR_FORBIDDEN and assignment remains DISPATCHED"

      - name: void_nonconforming_field_test_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.FieldTest.RECORDED_to_VOIDED, "errors[ERR_TEST_NOT_VOIDABLE]"]
        distinguishing_aspect: "Void is restricted to CONFORMING tests: voiding a NONCONFORMING test fails ERR_TEST_NOT_VOIDABLE and the auto-created NCR is untouched (open_ncr_count stays 1)."
        test_recipe:
          setup: ["project with APPROVED SSI (soil item, STANDARD, std max 124.0), technician t1, DISPATCHED assignment with one NONCONFORMING test (117.0 pcf) and its auto-created MAJOR NCR"]
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "VoidNC", permit_number: "P-SM-6", jurisdiction: "City A", contractor_name: "GC Co", building_official_name: "BO Smith" }
              as: AgencyAdmin
              captures: {proj_id: $.data.id, proj_v: $.data.version}
            - call: "POST /api/projects/${proj_id}/ssi-revisions"
              payload: { specified_fc_psi: 4000, scope_items: [ { test_method: SOIL_COMPACTION, description: "pad", required_cert_level: 1, required_count: 1, proctor_method: STANDARD, standard_max_density_pcf: 124.0, modified_max_density_pcf: 127.0 } ] }
              as: ProjectManager
              captures: {ssi_id: $.data.id}
            - call: "POST /api/ssi-revisions/${ssi_id}/submit"
              payload: {}
              as: ProjectManager
            - call: "POST /api/ssi-revisions/${ssi_id}/approve"
              payload: { decision: "APPROVE", expected_project_version: "${proj_v}" }
              as: EngineerOfRecord
            - call: "GET /api/ssi-revisions/${ssi_id}/scope-items"
              as: ProjectManager
              captures: {item_id: "$.data[0].id"}
            - call: "POST /api/technicians"
              payload: { full_name: "Tech One", employee_code: "T1", certifications: [ { method: SOIL_COMPACTION, level: 2, expires_at: "2027-01-01" } ] }
              as: AgencyAdmin
              captures: {t1: $.data.id}
            - call: "POST /api/assignments"
              payload: { project_id: "${proj_id}", scope_item_id: "${item_id}", technician_id: "${t1}", work_date: "2026-05-04", start_time: "09:00", end_time: "10:00" }
              as: ProjectManager
              captures: {asg: $.data.id}
            - call: "POST /api/assignments/${asg}/dispatch"
              payload: {}
              as: ProjectManager
            - call: "POST /api/field-tests"
              payload: { assignment_id: "${asg}", measured_values: { field_dry_density_pcf: 117.0 } }
              as: Technician
              as_user_id: "${t1}"
              captures: {ft: $.data.id}
          trigger:
            - call: "POST /api/field-tests/${ft}/void"
              payload: {}
              as: ProjectManager
              captures: {err: $.data.error_id}
            - call: "GET /api/projects/${proj_id}"
              as: ProjectManager
              captures: {cnt: $.data.open_ncr_count}
          assert:
            - "error_id == ERR_TEST_NOT_VOIDABLE"
            - "FieldTest status remains RECORDED and Project.open_ncr_count == 1 (NCR not disturbed)"

      - name: record_break_before_schedule_rejected
        claim_type: invalid_transition
        grounds: [state_machines.LabSample.BREAK_SCHEDULED_to_REPORTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "record-break is not a legal trigger from CAST: it fails ERR_INVALID_STATE until schedule-break moves the sample to BREAK_SCHEDULED."
        test_recipe:
          setup: ["project with APPROVED SSI (concrete item), lab, technician t1, DISPATCHED assignment, one CAST sample (unscheduled)"]
          setup_api_calls:
            - call: "POST /api/labs"
              payload: { name: "Lab One", lab_code: "L1", daily_break_capacity: 10 }
              as: AgencyAdmin
              captures: {lab_id: $.data.id}
            - call: "POST /api/technicians"
