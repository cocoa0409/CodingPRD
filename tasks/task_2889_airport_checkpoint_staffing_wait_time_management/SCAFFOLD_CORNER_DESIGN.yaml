              payload: { lane_type: "STANDARD", sampled_wait_seconds: 1200, measurement_method: "BLE_SENSOR", sample_size: 10 }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { obs2_pub: $.data.published_wait_minutes_snapshot }
            - call: "GET /escalation-tickets"
              payload: { checkpoint_id: "${cp_id}", state: "RAISED" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { tk_id: "$.data[0].id", tk_reason: "$.data[0].trigger_reason", tk_scope: "$.data[0].lane_type_scope" }
            - call: "POST /escalation-tickets/${tk_id}/acknowledge"
              payload: {}
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { tk_ack_state: $.data.state, tk_ack_by: $.data.acknowledged_by_officer_id }
          trigger:
            - call: "POST /escalation-tickets/${tk_id}/resolve"
              payload: { resolution: "LANE_OPENED", resolved_lane_id: "${lane_id}" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { tk_res_state: $.data.state, tk_res_lane: $.data.resolved_lane_id, tk_res_div: $.data.diverted_pax_count }
