          and the design-revision loop (CAPACITY_RESERVED -> SUPPLEMENTAL_REVIEW -> amend ->
          CAPACITY_RESERVED) both traverse backward edges; a linear pipeline cannot express either.
        test_recipe:
          setup:
            - "Program cap 1000000 (MONETARY_CREDIT, AVOIDED_COST_PAYOUT, tum 4, COMMITTED); feeder peak 1000000 pre-existing 140000 (limit 150000); transformer nameplate 10000000 pre 0; account COMMERCIAL usage 100000000; application initially 20000 W (production 30000000)."
