  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: film_sales_status_cycles_in_market_to_sold_out_and_back_on_reversion
        grounds:
          - state_machines.Film.IN_MARKET_to_SOLD_OUT
          - state_machines.Film.SOLD_OUT_to_IN_MARKET
          - state_machines.PreSaleContract.EXECUTED_to_REVERTED
          - entities.Film.fields.sales_status
          - entities.Film.fields.licensed_territory_count
          - entities.Film.fields.published_territory_count
          - entities.TerritoryValuation.fields.status
        distinguishing_aspect: |
          Non-linearity = a CYCLE on Film.sales_status with no operator edge in either direction.
          Both IN_MARKET -> SOLD_OUT and SOLD_OUT -> IN_MARKET are system-evaluated side effects of
          contract calls, so the film returns to a state it already left, its version has advanced
          twice, and the derived counters must be recomputed rather than toggled. Reversion is also
          asymmetric: rights come back (LICENSED -> PUBLISHED) but collected cash is not clawed
          back, so balance_usd stays 2000000.00 across the return edge.
