      - name: a_declared_chain_reaching_depth_three_is_rejected
        claim_type: error_triggerable
        grounds:
          - calculations.nested_chain_depth
          - calculations.nested_prohibition_precedence
          - errors[ERR_NESTED_DEPTH_EXCEEDED]
        distinguishing_aspect: "PROHIBIT_DEPTH_AT is 3 while NESTED_MAX_DEPTH is 4, so the ladder bites one level before the structural maximum: a row whose transitive walk reaches depth 3 is refused even though depth 3 is a legal stored value. The two-hop chain C then B is built first so that B's row already carries depth 2 and A's new row computes 3."
        test_recipe:
          setup: ["Three respondents A, B and C. C owns a plain German leaf row (depth 1); B owns a row pointing at C (depth 2). A now declares a row pointing at B."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
