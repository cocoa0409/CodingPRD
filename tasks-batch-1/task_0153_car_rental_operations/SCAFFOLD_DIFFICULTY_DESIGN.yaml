            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-05T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-02T10:00:00Z", dropoff_at: "2026-07-06T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { res2: $.data.id }
          trigger:
            - call: "POST /reservations/${res2}/confirm"
              payload: {}
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_LOCATION_CLASS_CAPACITY"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ledger_total_conserved_across_damage_then_void
        grounds:
          - state_machines.IncidentReport.FILED_to_VOID
          - entities.LedgerEntry.fields.amount_cents
          - entities.RentalAgreement.fields.final_total_cents
        distinguishing_aspect: |
          Conserved quantity = the agreement's ledger sum (cash). Forward action (DAMAGE +25000 emitted at
          close) paired with its compensation (INCIDENT_REVERSAL -25000 on void) leaves
          sum(LedgerEntry.amount_cents) == the pre-incident base 15000, exactly: 15000 == final_after.
        test_recipe:
          setup:
            - "A CLOSED 3-day ECON agreement with no usage charges (returned at exactly the 600-mi allowance, full fuel) so base==15000, plus a FILED MINOR no-LDW incident assessed 25000 -> DAMAGE 25000, making final_total_cents==40000 before the void."
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-001", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { veh1: $.data.id, veh1_ver: $.data.version }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-04T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /vehicles/${veh1}/hold"
              payload: { reservation_id: "${res1}", expected_vehicle_version: "${veh1_ver}" }
              as: RentalAgent
            - call: "POST /rental-agreements"
              payload: { reservation_id: "${res1}", vehicle_id: "${veh1}", odometer_out: 1000, fuel_out_eighths: 8 }
              as: RentalAgent
              captures: { agr1: $.data.id }
            - call: "POST /incident-reports"
              payload: { agreement_id: "${agr1}", severity: "MINOR", assessed_damage_cents: 25000 }
              as: RentalAgent
              captures: { inc1: $.data.id }
            - call: "POST /rental-agreements/${agr1}/close"
              payload: { odometer_in: 1600, fuel_in_eighths: 8 }
              as: RentalAgent
              captures: { final_before: $.data.final_total_cents }
          trigger:
            - call: "POST /incident-reports/${inc1}/void"
              payload: {}
              as: FleetManager
            - call: "GET /rental-agreements/${agr1}"
              payload: {}
              as: FleetManager
              captures: { final_after: $.data.final_total_cents }
          assert:
            - "RentalAgreement.${agr1}.final_total_cents (before void) == 40000"
            - "RentalAgreement.${agr1}.final_total_cents (after void) == 15000"
            - "sum of LedgerEntry.amount_cents for ${agr1} after void == 15000"

      - name: availability_count_conserved_across_hold_then_release
        grounds:
          - state_machines.Vehicle.AVAILABLE_to_RESERVED
          - state_machines.Vehicle.RESERVED_to_AVAILABLE
          - calculations.class_availability_reconcile
          - entities.VehicleClass.fields.available_count
        distinguishing_aspect: |
          Conserved quantity = VehicleClass.available_count (a fleet inventory count, not cash). Forward hold
          (-1) paired with its compensating release (+1) restores available_count to its pre-hold value 1,
          a different conserved quantity than the ledger-cash invariant.
        test_recipe:
          setup:
            - "One AVAILABLE ECON vehicle (available_count==1). A CONFIRMED reservation holds it (available_count==0)."
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-001", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { veh1: $.data.id, veh1_ver: $.data.version }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-04T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /vehicles/${veh1}/hold"
              payload: { reservation_id: "${res1}", expected_vehicle_version: "${veh1_ver}" }
              as: RentalAgent
            - call: "GET /vehicle-classes/${cls_econ}"
              payload: {}
              as: RentalAgent
              captures: { avail_mid: $.data.available_count }
          trigger:
            - call: "POST /vehicles/${veh1}/release"
              payload: {}
              as: RentalAgent
            - call: "GET /vehicle-classes/${cls_econ}"
              payload: {}
              as: RentalAgent
              captures: { avail_after: $.data.available_count }
          assert:
            - "VehicleClass.${cls_econ}.available_count after hold == 0"
            - "VehicleClass.${cls_econ}.available_count after release == 1"
