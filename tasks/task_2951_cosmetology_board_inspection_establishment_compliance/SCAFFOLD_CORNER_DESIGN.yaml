              as_user_id: "admin-001"
          assert:
            - "the MINOR-finding declaration returns HTTP 422 with data.error_id == ERR_HAZARD_FINDING_NOT_ELIGIBLE"
            - "the premature clearance returns HTTP 409 with data.error_id == ERR_HAZARD_NOT_DECLARED and NOT ERR_HAZARD_CLEARANCE_REINSPECTION_REQUIRED"
            - "the IMM-960 declaration returns HTTP 200"
            - "Inspection.${insp_id}.hazard_state == HAZARD_DECLARED and status is still IN_PROGRESS"
            - "ViolationFinding.${find_imm_id}.declared_hazard == true and ViolationFinding.${find_rec_id}.declared_hazard == false"
            - "Establishment.${est_id}.license_status == CLOSED_IMMINENT_HAZARD and compliance_posture == FROZEN"
            - "the repeat declaration returns HTTP 409 with data.error_id == ERR_HAZARD_ALREADY_DECLARED"
            - "the workstation create returns HTTP 409 with data.error_id == ERR_ESTABLISHMENT_NOT_OPERABLE and NOT ERR_POSTURE_FROZEN"
            - "Establishment.${est_id}.station_count == 0"

      - name: error_citation_adjudication_and_payment_state_gates
