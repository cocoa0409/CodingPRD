# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3341_battery_storage_system_delivery_performance_guarantee_management
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: project_create_computes_duration_and_sizing_and_returns_common_fields
        claim_type: Creation
        grounds:
          - entities.Project
          - endpoints.POST_/projects
        distinguishing_aspect: "A minimal project POST returns 201 with server-minted UUID id, version 1, computed duration_hours 4.00 (40/10), sizing_status VALID for CAPACITY_FIRMING at exactly 4h, commissioned_capacity_mwh 0, augmentation_count 0."
        test_recipe:
          setup: ["Logical clock at the 2026-09-01T00:00:00Z default. Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { name: "Boundary BESS", market_application: "CAPACITY_FIRMING", duty_cycle_profile: "ONE_CYCLE_DAILY", rated_power_mw: 10, rated_energy_mwh: 40, budget_cents: 1000000 }
              as: ProjectDeveloper
              captures: { proj_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Project.${proj_id}.duration_hours == 4.00 and sizing_status == VALID (inclusive 4.00 boundary)"
            - "Project.${proj_id}.commissioned_capacity_mwh == 0 and augmentation_count == 0"
            - "the response data carries non-null id, created_at, updated_at and version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: project_sizing_invalid_when_firming_duration_below_four_computed_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Project.fields.sizing_status
          - calculations.sizing_validation
        distinguishing_aspect: "CAPACITY_FIRMING with 11 MW x 33 MWh computes duration 3.00 -> sizing_status INVALID at creation time; client-supplied sizing_status/duration_hours inputs are ignored."
        test_recipe:
          setup: ["Empty database; clock at default."]
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { name: "Short BESS", market_application: "CAPACITY_FIRMING", duty_cycle_profile: "ONE_CYCLE_DAILY", rated_power_mw: 11, rated_energy_mwh: 33, budget_cents: 1000000, sizing_status: "VALID", duration_hours: 9 }
              as: ProjectDeveloper
              captures: { proj_id: $.data.id }
          assert:
            - "Project.${proj_id}.sizing_status == INVALID — computed, the injected VALID is ignored"
            - "Project.${proj_id}.duration_hours == 3.0 — computed, the injected 9 is ignored"
            - "the response status is 201 (invalid sizing is a computed fact, not a creation error)"

      - name: esa_create_computes_total_price_and_rejects_bad_shape
        claim_type: Type Constraints
        grounds:
          - entities.EquipmentSupplyAgreement
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "ESA creation computes total_price_cents = 40 * 300000 = 12000000; a guaranteed_capacity_mwh of 41 (> contracted 40) or a longstop_date not strictly after guaranteed_delivery_date is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One project exists."]
          setup_api_calls:
            - &ck
              call: "POST /projects"
              payload: { name: "P", market_application: "ENERGY_ARBITRAGE", duty_cycle_profile: "ONE_CYCLE_DAILY", rated_power_mw: 10, rated_energy_mwh: 40, budget_cents: 20000000 }
              as: ProjectDeveloper
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /equipment-supply-agreements"
              payload: { project_id: "${proj_id}", contracted_power_mw: 10, contracted_energy_mwh: 40, guaranteed_capacity_mwh: 38, guaranteed_rte_pct: 0.88, price_per_mwh_cents: 300000, ld_rate_per_day_cents: 40000, ld_cap_cents: 1200000, guaranteed_delivery_date: "2026-10-01T00:00:00Z", longstop_date: "2026-12-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { esa_id: $.data.id }
            - call: "POST /equipment-supply-agreements"
              payload: { project_id: "${proj_id}", contracted_power_mw: 10, contracted_energy_mwh: 40, guaranteed_capacity_mwh: 41, guaranteed_rte_pct: 0.88, price_per_mwh_cents: 300000, ld_rate_per_day_cents: 40000, ld_cap_cents: 1200000, guaranteed_delivery_date: "2026-10-01T00:00:00Z", longstop_date: "2026-12-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { err1: $.data.error_id }
            - call: "POST /equipment-supply-agreements"
              payload: { project_id: "${proj_id}", contracted_power_mw: 10, contracted_energy_mwh: 40, guaranteed_capacity_mwh: 38, guaranteed_rte_pct: 0.88, price_per_mwh_cents: 300000, ld_rate_per_day_cents: 40000, ld_cap_cents: 1200000, guaranteed_delivery_date: "2026-10-01T00:00:00Z", longstop_date: "2026-10-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { err2: $.data.error_id }
          assert:
            - "EquipmentSupplyAgreement.${esa_id}.total_price_cents == 12000000 and status == DRAFT and accrued_ld_cents == 0"
            - "guaranteed 41 > contracted 40: 400 err1 == ERR_INVALID_REQUEST"
            - "longstop equal to delivery date: 400 err2 == ERR_INVALID_REQUEST"

      - name: project_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/projects/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the path yields 404 ERR_NOT_FOUND with the error envelope shape."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProjectDeveloper
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: body_fk_to_missing_parent_returns_specific_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.DeliveryMilestone.fields.esa_id
          - errors.ERR_ESA_NOT_FOUND
        distinguishing_aspect: "A body FK to a non-existent ESA on POST /delivery-milestones yields 404 ERR_ESA_NOT_FOUND (body-FK specificity), not a bare 400."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /delivery-milestones"
              payload: { esa_id: "00000000-0000-4000-8000-000000000000", kind: "DELIVERY", planned_date: "2026-10-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_ESA_NOT_FOUND"

      - name: projects_list_paginates_with_limit_offset_total_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/projects
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three projects, limit=2 offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup: ["Three projects created."]
          setup_api_calls:
            - *ck
            - call: "POST /projects"
              payload: { name: "P2", market_application: "FREQUENCY_REGULATION", duty_cycle_profile: "CONTINUOUS", rated_power_mw: 10, rated_energy_mwh: 20, budget_cents: 20000000 }
              as: ProjectDeveloper
            - call: "POST /projects"
              payload: { name: "P3", market_application: "ENERGY_ARBITRAGE", duty_cycle_profile: "TWO_CYCLES_DAILY", rated_power_mw: 10, rated_energy_mwh: 40, budget_cents: 20000000 }
              as: ProjectDeveloper
          trigger:
            - call: "GET /projects"
              payload: { limit: 2, offset: 0 }
              as: MarketOperator
          assert:
            - "the response status is 200 and response_type is array"
            - "exactly 2 rows returned with total_count == 3 and has_more == true"
            - "GET /projects?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /projects with no parameters returns 3 rows under the default limit 10"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: milestone_second_record_outcome_rejected_from_terminal
        claim_type: invalid_transition
        grounds:
          - state_machines.DeliveryMilestone
          - errors.ERR_MILESTONE_NOT_SCHEDULED
        distinguishing_aspect: "A milestone already ACHIEVED rejects a second record-outcome with 409 ERR_MILESTONE_NOT_SCHEDULED; no LD deltas fire twice (idempotency of terminal states)."
        test_recipe:
          setup:
            - "Project + permits + executed ESA; DELIVERY milestone M planned 2026-10-01 recorded ACHIEVED on 2026-09-30."
          setup_api_calls:
            - *ck
            - call: "POST /equipment-supply-agreements"
              payload: { project_id: "${proj_id}", contracted_power_mw: 10, contracted_energy_mwh: 40, guaranteed_capacity_mwh: 38, guaranteed_rte_pct: 0.88, price_per_mwh_cents: 300000, ld_rate_per_day_cents: 40000, ld_cap_cents: 1200000, guaranteed_delivery_date: "2026-10-01T00:00:00Z", longstop_date: "2026-12-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { esa_id: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "THERMAL_RUNAWAY_PLAN", authority_reference: "T" }
              as: ProjectDeveloper
              captures: { p1: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "FIRE_CODE", authority_reference: "F" }
              as: ProjectDeveloper
              captures: { p2: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "LOCAL_APPROVAL", authority_reference: "L" }
              as: ProjectDeveloper
              captures: { p3: $.data.id }
            - call: "POST /safety-permits/${p1}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p2}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p3}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectDeveloper
              captures: { proj_v: $.data.version }
            - call: "POST /equipment-supply-agreements/${esa_id}/execute"
              payload: { expected_project_version: "${proj_v}" }
              as: ProjectDeveloper
            - call: "POST /delivery-milestones"
              payload: { esa_id: "${esa_id}", kind: "DELIVERY", planned_date: "2026-10-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { m1: $.data.id }
            - call: "POST /delivery-milestones/${m1}/record-outcome"
              payload: { outcome: "ACHIEVED", actual_date: "2026-09-30T00:00:00Z" }
              as: ProjectDeveloper
          trigger:
            - call: "POST /delivery-milestones/${m1}/record-outcome"
              payload: { outcome: "MISSED", actual_date: "2026-10-21T00:00:00Z" }
              as: ProjectDeveloper
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_MILESTONE_NOT_SCHEDULED"
            - "DeliveryMilestone.${m1}.status == ACHIEVED and ld_applied_cents == 0 (no double accrual)"

      - name: milestone_outcome_kind_must_match_date_ordering
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=6]
          - errors.ERR_MILESTONE_OUTCOME_MISMATCH
        distinguishing_aspect: "outcome ACHIEVED with actual_date after planned_date (and MISSED with actual_date on/before planned_date) is a 409 ERR_MILESTONE_OUTCOME_MISMATCH — the outcome enum cannot contradict the dates."
        test_recipe:
          setup: ["Project + permits + executed ESA; two SCHEDULED DELIVERY milestones planned 2026-10-01."]
          setup_api_calls:
            - *ck
            - call: "POST /equipment-supply-agreements"
              payload: { project_id: "${proj_id}", contracted_power_mw: 10, contracted_energy_mwh: 40, guaranteed_capacity_mwh: 38, guaranteed_rte_pct: 0.88, price_per_mwh_cents: 300000, ld_rate_per_day_cents: 40000, ld_cap_cents: 1200000, guaranteed_delivery_date: "2026-10-01T00:00:00Z", longstop_date: "2026-12-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { esa_id: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "THERMAL_RUNAWAY_PLAN", authority_reference: "T" }
              as: ProjectDeveloper
              captures: { p1: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "FIRE_CODE", authority_reference: "F" }
              as: ProjectDeveloper
              captures: { p2: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "LOCAL_APPROVAL", authority_reference: "L" }
              as: ProjectDeveloper
              captures: { p3: $.data.id }
            - call: "POST /safety-permits/${p1}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p2}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p3}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectDeveloper
              captures: { proj_v: $.data.version }
            - call: "POST /equipment-supply-agreements/${esa_id}/execute"
              payload: { expected_project_version: "${proj_v}" }
              as: ProjectDeveloper
            - call: "POST /delivery-milestones"
              payload: { esa_id: "${esa_id}", kind: "DELIVERY", planned_date: "2026-10-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { m1: $.data.id }
            - call: "POST /delivery-milestones"
              payload: { esa_id: "${esa_id}", kind: "DELIVERY", planned_date: "2026-10-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { m2: $.data.id }
          trigger:
            - call: "POST /delivery-milestones/${m1}/record-outcome"
              payload: { outcome: "ACHIEVED", actual_date: "2026-10-05T00:00:00Z" }
              as: ProjectDeveloper
              captures: { err_a: $.data.error_id }
            - call: "POST /delivery-milestones/${m2}/record-outcome"
              payload: { outcome: "MISSED", actual_date: "2026-10-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { err_b: $.data.error_id }
          assert:
            - "ACHIEVED with a late actual_date: 409 err_a == ERR_MILESTONE_OUTCOME_MISMATCH"
            - "MISSED with actual_date == planned_date: 409 err_b == ERR_MILESTONE_OUTCOME_MISMATCH (<= boundary)"
            - "both milestones remain SCHEDULED"

      - name: esa_complete_requires_delivery_achieved_and_commissioning_achieved
        claim_type: precondition_enforcement
        grounds:
          - state_machines.EquipmentSupplyAgreement.EXECUTED_to_COMPLETED
          - errors.ERR_DELIVERY_MILESTONES_OPEN
          - errors.ERR_NO_COMMISSIONING_ACHIEVED
        distinguishing_aspect: "Complete fails with ERR_DELIVERY_MILESTONES_OPEN while any DELIVERY milestone is SCHEDULED (MISSED or CANCELLED deliveries do not block — the LD ledger already priced them), and with ERR_NO_COMMISSIONING_ACHIEVED when deliveries are done but no commissioning milestone is ACHIEVED; both satisfied -> COMPLETED."
        test_recipe:
          setup:
            - "Project + permits + executed ESA; one DELIVERY (planned 2026-10-01) and one COMMISSIONING (planned 2026-11-01) milestone."
          setup_api_calls:
            - *ck
            - call: "POST /equipment-supply-agreements"
              payload: { project_id: "${proj_id}", contracted_power_mw: 10, contracted_energy_mwh: 40, guaranteed_capacity_mwh: 38, guaranteed_rte_pct: 0.88, price_per_mwh_cents: 300000, ld_rate_per_day_cents: 40000, ld_cap_cents: 1200000, guaranteed_delivery_date: "2026-10-01T00:00:00Z", longstop_date: "2026-12-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { esa_id: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "THERMAL_RUNAWAY_PLAN", authority_reference: "T" }
              as: ProjectDeveloper
              captures: { p1: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "FIRE_CODE", authority_reference: "F" }
              as: ProjectDeveloper
              captures: { p2: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "LOCAL_APPROVAL", authority_reference: "L" }
              as: ProjectDeveloper
              captures: { p3: $.data.id }
            - call: "POST /safety-permits/${p1}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p2}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p3}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectDeveloper
              captures: { proj_v: $.data.version }
            - call: "POST /equipment-supply-agreements/${esa_id}/execute"
              payload: { expected_project_version: "${proj_v}" }
              as: ProjectDeveloper
            - call: "POST /delivery-milestones"
              payload: { esa_id: "${esa_id}", kind: "DELIVERY", planned_date: "2026-10-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { md: $.data.id }
            - call: "POST /delivery-milestones"
              payload: { esa_id: "${esa_id}", kind: "COMMISSIONING", planned_date: "2026-11-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { mc: $.data.id }
          trigger:
            - call: "POST /equipment-supply-agreements/${esa_id}/complete"
              payload: {}
              as: ProjectDeveloper
              captures: { err1: $.data.error_id }
            - call: "POST /delivery-milestones/${md}/record-outcome"
              payload: { outcome: "ACHIEVED", actual_date: "2026-10-01T00:00:00Z" }
              as: ProjectDeveloper
            - call: "POST /equipment-supply-agreements/${esa_id}/complete"
              payload: {}
              as: ProjectDeveloper
              captures: { err2: $.data.error_id }
            - call: "POST /delivery-milestones/${mc}/record-outcome"
              payload: { outcome: "ACHIEVED", actual_date: "2026-10-20T00:00:00Z" }
              as: ProjectDeveloper
            - call: "POST /equipment-supply-agreements/${esa_id}/complete"
              payload: {}
              as: ProjectDeveloper
          assert:
            - "with the delivery milestone open: 409 err1 == ERR_DELIVERY_MILESTONES_OPEN"
            - "with delivery achieved but commissioning open: 409 err2 == ERR_NO_COMMISSIONING_ACHIEVED"
            - "after both achieved: 200 and EquipmentSupplyAgreement.${esa_id}.status == COMPLETED"
            - "Project.${proj_id}.commissioned_capacity_mwh == 40 (set by the commissioning achievement)"

      - name: test_record_results_outside_window_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=6]
          - errors.ERR_TEST_WINDOW_NOT_OPEN
        distinguishing_aspect: "Recording results when the logical clock is before window_start or at/after window_end is 409 ERR_TEST_WINDOW_NOT_OPEN; the half-open rule means recording exactly at window_end is rejected."
        test_recipe:
          setup: ["Project + permits + executed ESA; capacity test window [2026-09-10, 2026-09-20)."]
          setup_api_calls:
            - *ck
            - call: "POST /equipment-supply-agreements"
              payload: { project_id: "${proj_id}", contracted_power_mw: 10, contracted_energy_mwh: 40, guaranteed_capacity_mwh: 38, guaranteed_rte_pct: 0.88, price_per_mwh_cents: 300000, ld_rate_per_day_cents: 40000, ld_cap_cents: 1200000, guaranteed_delivery_date: "2026-10-01T00:00:00Z", longstop_date: "2026-12-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { esa_id: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "THERMAL_RUNAWAY_PLAN", authority_reference: "T" }
              as: ProjectDeveloper
              captures: { p1: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "FIRE_CODE", authority_reference: "F" }
              as: ProjectDeveloper
              captures: { p2: $.data.id }
            - call: "POST /safety-permits"
              payload: { project_id: "${proj_id}", permit_type: "LOCAL_APPROVAL", authority_reference: "L" }
              as: ProjectDeveloper
              captures: { p3: $.data.id }
            - call: "POST /safety-permits/${p1}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p2}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "POST /safety-permits/${p3}/decide"
              payload: { decision: "APPROVED" }
              as: SafetyAuthority
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectDeveloper
              captures: { proj_v: $.data.version }
            - call: "POST /equipment-supply-agreements/${esa_id}/execute"
              payload: { expected_project_version: "${proj_v}" }
              as: ProjectDeveloper
            - call: "POST /performance-tests"
              payload: { project_id: "${proj_id}", test_type: "CAPACITY_TEST", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-20T00:00:00Z" }
              as: PerformanceEngineer
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /performance-tests/${t1}/record-results"
              payload: { measured_capacity_mwh: 39, aux_load_mwh: 0.5 }
              as: PerformanceEngineer
              captures: { err_early: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /performance-tests/${t1}/record-results"
              payload: { measured_capacity_mwh: 39, aux_load_mwh: 0.5 }
              as: PerformanceEngineer
              captures: { err_late: $.data.error_id }
          assert:
            - "at the default clock 2026-09-01 (before window): 409 err_early == ERR_TEST_WINDOW_NOT_OPEN"
            - "at exactly window_end 2026-09-20 (exclusive end): 409 err_late == ERR_TEST_WINDOW_NOT_OPEN"
            - "PerformanceTest.${t1}.status == SCHEDULED (no transition occurred)"

      - name: augmentation_execute_outside_window_and_wrong_state
        claim_type: invalid_transition
        grounds:
          - state_machines.AugmentationEvent
          - errors.ERR_AUGMENTATION_WINDOW_NOT_OPEN
          - errors.ERR_AUGMENTATION_NOT_PLANNED
        distinguishing_aspect: "Execute before the planned window opens -> 409 ERR_AUGMENTATION_WINDOW_NOT_OPEN; executing an already-EXECUTED event -> 409 ERR_AUGMENTATION_NOT_PLANNED."
        test_recipe:
          setup: ["Project commissioned (via ESA + achieved COMMISSIONING milestone); one MANUAL augmentation window [2026-10-01, 2026-11-01)."]
          setup_api_calls:
            - *ck
            - call: "POST /equipment-supply-agreements"
              payload: { project_id: "${proj_id}", contracted_power_mw: 10, contracted_energy_mwh: 40, guaranteed_capacity_mwh: 38, guaranteed_rte_pct: 0.88, price_per_mwh_cents: 300000, ld_rate_per_day_cents: 40000, ld_cap_cents: 1200000, guaranteed_delivery_date: "2026-10-01T00:00:00Z", longstop_date: "2026-12-01T00:00:00Z" }
              as: ProjectDeveloper
              captures: { esa_id: $.data.id }
            - call: "POST /safety-permits"
