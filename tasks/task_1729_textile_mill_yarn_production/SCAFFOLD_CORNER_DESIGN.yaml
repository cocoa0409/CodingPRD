              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 100.0, actual_yarn_count_ne: 50.0 }
              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
            - call: "POST /mill/spinning-machines"
              payload: { machine_code: "SPIN-LOW", supported_count_min_ne: 10.0, supported_count_max_ne: 30.0 }
              as: MillAdmin
              captures: { sm_id: $.data.id }
          trigger:
            - call: "POST /mill/machine-assignments"
              payload: { machine_id: "${sm_id}", yarn_lot_id: "${yl_id}", window_start: "2026-08-14T08:00:00Z", window_end: "2026-08-14T12:00:00Z" }
              as: SpinningSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_COUNT_OUT_OF_RANGE"

      - name: shade_out_of_band_lab_dip_approval
        claim_type: violation_to_error
        grounds: ["errors[ERR_SHADE_OUT_OF_BAND]", "state_machines.LabDip.PENDING_to_APPROVED"]
        distinguishing_aspect: "LabDip with measured_delta_e > tolerance cannot be approved."
        test_recipe:
          setup: ["ShadeBand with tolerance 1.5; LabDip with measured_delta_e 2.0"]
          setup_api_calls:
