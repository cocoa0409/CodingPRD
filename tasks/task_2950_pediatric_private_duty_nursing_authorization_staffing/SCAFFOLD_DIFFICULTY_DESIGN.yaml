# =============================================================================
# 1.8 Scaffold Difficulty Design — pediatric private-duty nursing authorization
# and staffing. Nine §0.5 difficulty rules x 2 instances = 18 instances.
#
# Every instance drives the system from an empty database using only endpoints
# declared in SCAFFOLD.yaml §1.5. The logical clock is always set explicitly;
# ISO week 32 of 2026 is Monday 2026-08-03 .. Sunday 2026-08-09, which is the
# week every weekly aggregate below is keyed on.
#
# Canonical fixture chain reused by most instances:
#   Payer weekly_hour_cap 84, reduction_notice_days 10, STANDARD_15MIN ruleset
#   Patient requires_trach + requires_vent, parent backup available
#   PlanOfCare requested 56 h/wk -> submitted
#   Authorization approved 40.00 h/wk (= 2400 minutes per week) -> ACTIVE
#   Nurse N1: RN, licence to 2027-06-30, max_weekly_hours 48 (= 2880 minutes),
#             VALID TRACH + VENT competencies expiring 2027-07-01
#   Case: continuity_nurse_id = N1, concurrent_nurse_limit 1, supervisor sup-001
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: utilization_projected_versus_settled_diverge_on_identical_shift_data
        grounds:
          - calculations.authorization_weekly_utilization
          - calculations.authorization_weekly_utilization.variants.PROJECTED
          - calculations.authorization_weekly_utilization.variants.SETTLED
          - calculations.timesheet_net_billable_units
          - endpoints[GET /pdn/authorizations/{id}/utilization]
          - entities.Authorization.hours_committed_this_week
        distinguishing_aspect: >-
          One authorization, one worked shift, two bases: PROJECTED counts the 480 scheduled minutes
          of the ASSIGNED/COMPLETED shift and returns utilization_ratio 0.2000, while SETTLED counts
          the 28 accepted net billable units x 15 = 420 minutes and returns 0.1750. The 60-minute
          delta is the nurse leaving one hour early, which the scheduled view cannot see.
        test_recipe:
          setup:
            - "Authorization approved at 40.00 h/wk (2400 minutes) is ACTIVE for the week of 2026-08-03."
            - "One 8-hour shift on 2026-08-03 08:00-16:00 (480 scheduled minutes) is assigned to N1."
            - "N1 clocks in on time by GPS and clocks out at 15:00, one hour early; the timesheet is submitted and billing-accepted."
          setup_api_calls:
            - call: "POST /pdn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
            - call: "POST /pdn/payers"
              payload: { name: "Sunrise MCO", plan_type: "MEDICAID_MCO", weekly_hour_cap: 84, evv_required: true, billing_edit_ruleset: "STANDARD_15MIN", appeal_window_days: 30, reduction_notice_days: 10 }
              as: AgencyAdmin
              as_user_id: "admin-001"
              captures: { payer_id: $.data.id }
            - call: "POST /pdn/patients"
              payload: { payer_id: "${payer_id}", full_name: "Mia Reyes", date_of_birth: "2019-04-12", primary_diagnosis: "Chronic respiratory failure", requires_trach: true, requires_vent: true, requires_feeding_tube: false, parent_backup_available: true }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { patient_id: $.data.id }
            - call: "POST /pdn/plans-of-care"
              payload: { patient_id: "${patient_id}", requested_hours_per_week: 56, start_date: "2026-08-03", end_date: "2026-11-01", ordering_physician_npi: "1234567893" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { poc_id: $.data.id }
            - call: "POST /pdn/plans-of-care/${poc_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { poc_v: $.data.version }
            - call: "POST /pdn/authorizations"
              payload: { plan_of_care_id: "${poc_id}", payer_id: "${payer_id}", approved_hours_per_week: 40, effective_start: "2026-08-03T00:00:00Z", effective_end: "2026-11-01T00:00:00Z", expected_plan_of_care_version: "${poc_v}" }
              as: PayerReviewer
              as_user_id: "${payer_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /pdn/authorizations/${auth_id}/activate"
              payload: {}
              as: PayerReviewer
              as_user_id: "${payer_id}"
            - call: "POST /pdn/nurses"
              payload: { full_name: "Nora Vance", license_type: "RN", license_number: "RN-100001", license_expires_on: "2027-06-30", max_weekly_hours: 48 }
              as: AgencyAdmin
              as_user_id: "admin-001"
              captures: { n1_id: $.data.id }
            - call: "POST /pdn/nurses/${n1_id}/competencies"
              payload: { skill: "TRACH", validated_on: "2026-06-01", expires_on: "2027-07-01" }
              as: ClinicalSupervisor
              as_user_id: "sup-001"
            - call: "POST /pdn/nurses/${n1_id}/competencies"
              payload: { skill: "VENT", validated_on: "2026-06-01", expires_on: "2027-07-01" }
              as: ClinicalSupervisor
              as_user_id: "sup-001"
            - call: "POST /pdn/cases"
              payload: { patient_id: "${patient_id}", authorization_id: "${auth_id}", assigned_supervisor_user_id: "sup-001", continuity_nurse_id: "${n1_id}", concurrent_nurse_limit: 1, excluded_nurse_ids: [] }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { case_id: $.data.id }
            - call: "POST /pdn/cases/${case_id}/activate"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /pdn/shifts"
              payload: { case_id: "${case_id}", start_at: "2026-08-03T08:00:00Z", end_at: "2026-08-03T16:00:00Z", required_skills: ["TRACH", "VENT"] }
              as: Scheduler
              as_user_id: "sch-001"
              captures: { shift1_id: $.data.id, shift1_v: $.data.version }
            - call: "POST /pdn/shift-assignments"
              payload: { shift_id: "${shift1_id}", nurse_id: "${n1_id}", expected_shift_version: "${shift1_v}" }
              as: Scheduler
              as_user_id: "sch-001"
              captures: { asg1_id: $.data.id }
            - call: "POST /pdn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
            - call: "POST /pdn/shifts/${shift1_id}/clock-in"
              payload: { evv_method: "GPS", geo_verified: true }
              as: Nurse
              as_user_id: "${n1_id}"
              captures: { ts1_id: $.data.id }
            - call: "POST /pdn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T15:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
            - call: "POST /pdn/shifts/${shift1_id}/clock-out"
              payload: {}
              as: Nurse
              as_user_id: "${n1_id}"
            - call: "POST /pdn/timesheets/${ts1_id}/submit"
              payload: {}
              as: Scheduler
              as_user_id: "sch-001"
            - call: "POST /pdn/timesheets/${ts1_id}/billing-decision"
              payload: { decision: "ACCEPT" }
              as: PayerReviewer
              as_user_id: "${payer_id}"
          trigger:
            - call: "GET /pdn/authorizations/${auth_id}/utilization"
              payload: { basis: "PROJECTED", week_of: "2026-08-03T00:00:00Z" }
              as: PayerReviewer
              as_user_id: "${payer_id}"
            - call: "GET /pdn/authorizations/${auth_id}/utilization"
              payload: { basis: "SETTLED", week_of: "2026-08-03T00:00:00Z" }
              as: PayerReviewer
              as_user_id: "${payer_id}"
          assert:
            - "PROJECTED response: committed_minutes == 480, utilization_ratio == 0.2000, hours_remaining == 32.00"
            - "SETTLED response: settled_gross_units == 28, settled_net_units == 28, settled_minutes == 420, utilization_ratio == 0.1750, hours_remaining == 33.00"
            - "the two bases differ: PROJECTED utilization_ratio 0.2000 != SETTLED utilization_ratio 0.1750, and PROJECTED committed_minutes 480 - SETTLED settled_minutes 420 == 60"
            - "Authorization.${auth_id}.hours_committed_this_week == 8.00 (the PROJECTED basis is what the stored field tracks)"
            - "Timesheet.${ts1_id}.gross_billable_units == 28 and net_billable_units == 28 and edit_codes == []"

      - name: continuity_score_strict_versus_broad_on_one_history
        grounds:
          - calculations.nurse_continuity_score
          - calculations.nurse_continuity_score.variants.STRICT
          - calculations.nurse_continuity_score.variants.BROAD
          - endpoints[GET /pdn/nurses/{id}/continuity-score]
          - entities.ShiftAssignment.status
        distinguishing_aspect: >-
          The same three assignments score 15 under STRICT and 45 under BROAD: STRICT counts only the
          one COMPLETED assignment on this case inside the 28-day window, while BROAD also counts the
          CANCELLED assignment and the assignment on the patient's second case, capping at neither.
        test_recipe:
          setup:
            - "Patient with two cases under the same ACTIVE authorization; N1 is the continuity nurse of case 1."
            - "N1 has three assignment rows: COMPLETED on case 1 (2026-08-03), CANCELLED on case 1 (2026-08-05) and CANCELLED on case 2 (2026-08-06)."
          setup_api_calls:
            - call: "POST /pdn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
            - call: "POST /pdn/payers"
