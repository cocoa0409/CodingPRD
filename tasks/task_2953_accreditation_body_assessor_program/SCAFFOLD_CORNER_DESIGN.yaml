      distinguishing_aspect: 'The pagination window is 1..100 inclusive with offset >= 0, so limit 101, limit 0 and offset -1

        must each return ERR_INVALID_PAGINATION (400) while limit 100 and offset 0 succeed - the maximum

        itself is a legal value, not the first rejected one.

        '
      test_recipe:
        setup: [Clock 2026-08-10; one PUBLISHED scheme exists.]
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {current_utc: '2026-08-10T00:00:00Z'}
          as: SchemeManager
        - call: POST /accreditation/schemes
          payload: {program_code: ISO17025-CAL, name: Calibration laboratories, standard_ref: ISO_IEC_17025, complexity_multiplier: 1.0725, witness_min_count: 2, qualification_points_required: 60.0}
          as: SchemeManager
          captures: {scheme_id: $.data.id}
        - call: POST /accreditation/schemes/${scheme_id}/status
          payload: {to_status: UNDER_REVIEW}
          as: SchemeManager
        - call: POST /accreditation/schemes/${scheme_id}/status
          payload: {to_status: PUBLISHED}
          as: SchemeManager
        trigger:
        - call: GET /accreditation/schemes
          payload: {limit: 101}
          as: SchemeManager
        - call: GET /accreditation/schemes
          payload: {limit: 0}
          as: SchemeManager
        - call: GET /accreditation/schemes
          payload: {offset: -1}
          as: SchemeManager
        - call: GET /accreditation/schemes
          payload: {limit: 100, offset: 0}
