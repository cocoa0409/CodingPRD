              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with ERR_HAZARD_ANALYSIS_NOT_FOUND"

      - name: get_verification_record_with_unknown_id_returns_record_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_RECORD_NOT_FOUND
          - validations[priority=11]
        distinguishing_aspect: "Even though this read accepts an optional as_of_iso8601 recomputation parameter, a missing row must 404 before any retention arithmetic is attempted."
        test_recipe:
          setup:
            - "Clock set; no verification record is created."
          setup_api_calls:
