  # ==========================================================================
  # Section: validations
  # ==========================================================================
  - section: validations
    instances:
      - name: request_missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH_HEADERS]"]
        distinguishing_aspect: "A request with neither X-User-Role nor X-User-ID is rejected 401 ERR_MISSING_AUTH_HEADERS before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "NoAuth", code: "NAU" }
              as: NONE
              captures: { err: $.data.error_id }
          assert:
            - "request sent without X-User-Role and X-User-ID headers: HTTP 401, error_id == ERR_MISSING_AUTH_HEADERS"

      - name: unknown_role_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNKNOWN_ROLE]"]
        distinguishing_aspect: "An unrecognized X-User-Role value is rejected 401 ERR_UNKNOWN_ROLE (not 403)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "BadRole", code: "BRL" }
              as: SuperUser
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401; error_id == ERR_UNKNOWN_ROLE"

      - name: observation_on_nonexistent_participant_returns_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=8]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 5) precedes every business rule: a fully-formed observation payload against a nonexistent participant id returns 404 ERR_NOT_FOUND, never a consent or certification error."
        test_recipe:
          setup: ["empty database (no participant, indicator, or instrument exists)"]
          setup_api_calls: []
          trigger:
            - call: "POST /participants/11111111-2222-3333-4444-555555555555/observations"
              payload: { indicator_id: "11111111-2222-3333-4444-555555555556", instrument_id: "11111111-2222-3333-4444-555555555557", value: 1, collected_at: "2026-09-05T00:00:00Z" }
              as: FieldCollector
              as_user_id: "collector-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"

      - name: enrollment_window_inclusive_boundary
        claim_type: temporal_validation
        grounds: ["validations[priority=15]", "errors[ERR_ENROLLMENT_WINDOW_CLOSED]"]
        distinguishing_aspect: "The enrollment window is inclusive at both ends: at exactly enrollment_end the create succeeds; one second later it fails with ERR_ENROLLMENT_WINDOW_CLOSED."
        test_recipe:
          setup: ["program ACTIVE; cycle ENROLLING with enrollment_end 2026-08-31T23:59:59Z"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Window", code: "WND" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C1", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-01T00:00:00Z", cycle_end: "2026-09-30T23:59:59Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
              captures: { cyc: $.data.id }
