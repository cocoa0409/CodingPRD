              captures: { rent_id: $.data.id }
            - call: "POST /deliveries"
              payload: { rental_id: "${rent_id}", delivery_type: "INITIAL", address: "1 A St", window_start_clock: "2026-06-01T08:00:00Z", window_end_clock: "2026-06-01T12:00:00Z" }
