          trigger:
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: false }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ENTRY_RULE_VIOLATION, HTTP 422"
            - "WorkOrder.${wo_id}.status remains ASSIGNED"

      - name: notice_posted_start_timing_window
        claim_type: satisfaction_and_violation
        grounds: ["validations[priority=7]", "validations[priority=8]", "errors[ERR_ENTRY_RULE_VIOLATION]"]
