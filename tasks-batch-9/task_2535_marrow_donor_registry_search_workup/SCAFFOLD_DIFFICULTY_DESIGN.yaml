        distinguishing_aspect: |
          A different category pair (auth, business_safety) on a different endpoint: the same
          MedicalDirector who stamped physical_cleared_by_user_id asks for MARROW on a donor who only
          consented to PBSC. The 403 two-physician rule must be evaluated before the 422 consent rule,
          and the two control calls show each rule firing alone - a second director asking for MARROW
          gets the 422, and the same second director asking for PBSC succeeds.
