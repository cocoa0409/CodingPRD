            - "that single row has txn_type == \"CONTRIBUTION\", sequence_no == 1, signed_amount_cents == 8000000 and resulting_balance_cents == 8000000"

      - name: a_withdrawal_that_exactly_empties_the_reserve_is_allowed
        claim_type: satisfaction_to_pass
