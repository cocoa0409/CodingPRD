              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/fault-events"
              payload: { fault_code: "SPN3216_FMI4", severity: "CRITICAL", recommended_action: "STOP_IMMEDIATELY", occurred_at: "2026-09-01T11:00:00Z" }
              as: UptimeCoordinator
              captures: { fe_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: UptimeCoordinator
          trigger:
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases"
              payload: { fault_code: "SPN3216_FMI4", fault_event_id: "${fe_id}" }
              as: UptimeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422"
            - "err == ERR_CRITICAL_FAULT_WINDOW_LAPSED"
