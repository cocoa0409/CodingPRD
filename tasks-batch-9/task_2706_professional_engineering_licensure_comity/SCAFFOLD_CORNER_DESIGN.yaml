              as: BoardLicensingOfficer
              as_user_id: "LIC-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2030-01-15T00:00:00Z" }
              as: BoardSecretary
              as_user_id: "SEC-1"
            - call: "POST /licenses/${lic_zeb}/reinstate"
