        grounds:
          - state_machines.DecisionRecord.RATIFIED_to_RESCINDED
          - state_machines.AcademicProgram.TEACH_OUT_PENDING_to_UNDER_REVIEW
          - state_machines.AgencyNotification.PENDING_to_VOIDED
          - state_machines.TeachOutPlan.DRAFT_to_SUPERSEDED
          - entities.AcademicProgram.fields.catalog_status_pre_decision
        distinguishing_aspect: |
          RESCIND is the compensating edge for the whole ratification cascade
          and must undo every hop: both notices VOIDED (not deleted), the
          catalog axis restored from catalog_status_pre_decision to LISTED
          rather than merely stepped back one edge, the DRAFT plan SUPERSEDED,
          the retained appointment un-retained, the cycle returned to
          RESPONSE_SUBMITTED, and compliance_posture back to NOT_APPLICABLE
          because VOIDED notices leave the counters entirely.
        test_recipe:
          setup:
            - "Program HIST-BA carried to a RATIFIED DISCONTINUATION decision, with one AUTO_MINTED notice already SENT and the other still PENDING."
            - "A DRAFT teach-out plan exists on the program, and one ADJUNCT appointment (0.25 fte, 4000000 cents) is still ASSIGNED."
            - "catalog_status_pre_decision was captured as LISTED by the ratification cascade, which also moved catalog_status to MARKETING_SUPPRESSED."
