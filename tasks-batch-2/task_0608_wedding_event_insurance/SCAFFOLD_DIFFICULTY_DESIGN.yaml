  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # --- #1: state (p8) vs business_fiscal (p23) on pay -> state wins -------
      - name: pay_on_unbound_policy_state_beats_amount_mismatch
        grounds:
          - validations[priority=8]
          - validations[priority=23]
          - state_machines.Policy.UNPAID_to_PAID
        distinguishing_aspect: "Error-category pair state(p8) vs business_fiscal(p23): a QUOTED (never bound) policy paid with a wrong amount fails with ERR_POLICY_NOT_BOUND (state, p8) NOT ERR_PAYMENT_AMOUNT_MISMATCH (fiscal, p23)."
        test_recipe:
          setup:
            - "A QUOTED policy that has never been bound (total_premium_cents=0)."
          setup_api_calls:
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /policies/${policy_id}/pay"
              payload: { amount_cents: 99999 }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_POLICY_NOT_BOUND"
            - "http_status == 409"

      # --- #2: business_safety (p11) vs business_constraint (p12) on coverage add
      - name: liquor_on_dry_policy_safety_beats_retired_product
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - entities.Policy.fields.serves_alcohol
        distinguishing_aspect: "Error-category pair business_safety(p11) vs business_constraint(p12): adding a RETIRED LIQUOR_LIABILITY product to a dry (serves_alcohol=false) policy fails with ERR_LIQUOR_REQUIRES_ALCOHOL (safety, p11) which is checked before ERR_PRODUCT_RETIRED (constraint, p12)."
        test_recipe:
          setup:
            - "A RETIRED LIQUOR_LIABILITY/STANDARD product, and a QUOTED policy with serves_alcohol=false."
          setup_api_calls:
            - call: "POST /coverage-products"
              payload: { coverage_type: "LIQUOR_LIABILITY", tier: "STANDARD", base_premium_cents: 18000, per_guest_premium_cents: 250, coverage_limit_cents: 1000000, deposit_sublimit_pct: 1.0, liquor_required: true }
              as: PlatformAdmin
              captures: { liq_prod_id: $.data.id }
            - call: "POST /coverage-products/${liq_prod_id}/retire"
              payload: {}
              as: PlatformAdmin
            - call: "POST /policies"
              payload: { policy_form: "SINGLE_EVENT", serves_alcohol: false }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { policy_id: $.data.id }
          trigger:
            - call: "POST /policies/${policy_id}/coverages"
              payload: { coverage_product_id: "${liq_prod_id}" }
              as: Policyholder
              as_user_id: "ph-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_LIQUOR_REQUIRES_ALCOHOL"
            - "http_status == 422"

