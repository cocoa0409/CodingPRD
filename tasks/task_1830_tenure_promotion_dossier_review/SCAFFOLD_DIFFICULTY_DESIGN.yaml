      - name: invitation_create_constraint_before_temporal
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - calculations.reviewer_capacity
          - errors[ERR_REVIEWER_CAPACITY_EXCEEDED]
          - errors[ERR_REVIEW_WINDOW_CLOSED]
        distinguishing_aspect: |
          Pair business_constraint vs business_temporal: the reviewer already
          holds 2 invitations in status SOLICITED or ACCEPTED overlapping the new window (constraint, p9)
          AND the new window's end has already passed (temporal, p10). The
          constraint error ERR_REVIEWER_CAPACITY_EXCEEDED wins because
          priority 9 < priority 10.
