              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
          trigger:
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: ReviewCoordinator
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: Provost
              as_user_id: "provost-1"
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: HRPartner
              as_user_id: "hr-1"
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: ProgramChair
              as_user_id: "${prog_b}"
              captures: { e_other_chair: $.data.error_id }
            - call: "GET /provost/teach-out-plans"
              payload: { program_id: "${prog_id}", limit: 10, offset: 0 }
              as: HRPartner
              as_user_id: "hr-1"
            - call: "GET /provost/teach-out-plans"
              payload: { program_id: "${prog_id}", limit: 10, offset: 0 }
              as: Registrar
              as_user_id: "registrar-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: ExternalReviewer
              as_user_id: "reviewer-1"
          assert:
            - "the first five reads all return HTTP 200 with an identical data object: code HIST-BA, lifecycle_state ACTIVE, catalog_status LISTED, viability_band INSUFFICIENT_DATA, composite_score null, snapshot_count 0 and version ${prog_v}"
            - "${e_other_chair} == ERR_NOT_PROGRAM_OWNER with HTTP 403 and NOT ERR_ROLE_NOT_PERMITTED — ProgramChair IS on this endpoint's roles list, so the refusal comes from priority 4's identity scope, not priority 3"
            - "both teach-out-plan list reads return 200 with the standard paginated envelope — data [], total_count 0, has_more false — proving a shared read answers HRPartner and Registrar identically even when it has nothing to return; note that GET /provost/review-cycles/{id} is NOT shared with these two roles and would answer ERR_ROLE_NOT_PERMITTED"
            - "the clock write as ExternalReviewer returns 200 — POST /_clock/set_current_utc is shared by all six roles, and no role owns it exclusively"
            - "no read in this recipe increments any version: a follow-up GET still reports version ${prog_v}"

  # ==========================================================================
  # Cross-cutting complexity layers — optimistic_concurrency,
  # cascading_side_effects, dual_variant_calculation,
  # derived_field_reconciliation
  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: a_plan_author_working_from_a_pre_ratification_view_is_told_the_program_moved
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[teach-out-plan-create-stale-program]
          - validations[priority=10]
          - errors[ERR_STALE_PROGRAM_VERSION]
        distinguishing_aspect: |
          The stale view is produced by a cascade the author never issued: the
          ratification bumps the program's version behind their back, so the
          version they legitimately read before ratifying is no longer current.
          The OCC check sits at priority 10, which is BELOW the body-FK check at
          priority 8 and ABOVE every state check — so a stale write with a bad
          decision_id reports the 404, a stale write with a good decision_id
          reports the 412, and only a fresh version reaches the plan's own
          preconditions. The refused attempts leave the program's version
          untouched, so the retry with the value read after the refusal succeeds.
        test_recipe:
          setup:
            - "A NONVIABLE program whose cycle has a PROPOSED DISCONTINUATION decision; the chair reads the program version BEFORE ratification, then the decision is ratified, which cascades the program to TEACH_OUT_PENDING and bumps its version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
              as: ReviewCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2024FA", term_index: 1, enrollment_headcount: 30, credit_hours: 300, direct_cost_cents: 12000000, completions_count: 4, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025SP", term_index: 2, enrollment_headcount: 24, credit_hours: 240, direct_cost_cents: 11000000, completions_count: 3, market_demand_index: 40 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/metric-snapshots"
              payload: { term_code: "2025FA", term_index: 3, enrollment_headcount: 20, credit_hours: 200, direct_cost_cents: 11000000, completions_count: 2, market_demand_index: 42 }
              as: ReviewCoordinator
            - call: "POST /provost/academic-programs/${prog_id}/review-cycles"
              payload: { cycle_year: 2026, self_study_due_at: "2026-09-01T00:00:00Z", required_section_codes: ["S1"] }
              as: ReviewCoordinator
              captures: { cycle_id: $.data.id }
            - call: "POST /provost/review-cycles/${cycle_id}/self-studies"
              payload: { narrative: "History self-study", section_codes: ["S1"] }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { ss_id: $.data.id }
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/self-studies/${ss_id}/transitions"
              payload: { action: "ACCEPT" }
              as: ReviewCoordinator
            - call: "POST /provost/external-reviewers"
              payload: { full_name: "Dr Nala Osei", institution: "Westmoor University", specialty_code: "HIST" }
              as: ReviewCoordinator
              captures: { rev_id: $.data.id }
            - call: "POST /provost/reviewer-visits"
              payload: { cycle_id: "${cycle_id}", reviewer_id: "${rev_id}", window_start_at: "2026-08-20T09:00:00Z", window_end_at: "2026-08-22T17:00:00Z" }
              as: ReviewCoordinator
              captures: { visit_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-23T00:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/reviewer-visits/${visit_id}/complete"
              payload: {}
              as: ReviewCoordinator
            - call: "POST /provost/reviewer-visits/${visit_id}/reports"
              payload: { recommendation: "DISCONTINUE", finding_codes: ["F-ENROLL"], narrative: "Enrollment collapse." }
              as: ExternalReviewer
              as_user_id: "${rev_id}"
            - call: "POST /provost/review-cycles/${cycle_id}/program-response"
              payload: { response_concurrence: "CONCUR", response_text: "The department concurs." }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { cyc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T10:00:00Z" }
              as: ReviewCoordinator
            - call: "POST /provost/review-cycles/${cycle_id}/decision-records"
              payload: { outcome: "DISCONTINUATION", rationale: "Sustained nonviability.", effective_term_index: 4, expected_cycle_version: "${cyc_v}" }
              as: Provost
              as_user_id: "provost-proposer"
              captures: { dec_id: $.data.id }
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { stale_v: $.data.version }
            - call: "POST /provost/decision-records/${dec_id}/transitions"
              payload: { action: "RATIFY", ratification_note: "Board ratified." }
              as: Provost
              as_user_id: "provost-ratifier"
          trigger:
            - call: "POST /provost/academic-programs/${prog_id}/teach-out-plans"
              payload: { decision_id: "00000000-0000-4000-8000-000000000009", last_admit_term_index: 3, first_teach_out_term_index: 4, final_award_term_index: 5, expected_program_version: "${stale_v}" }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { e_fk: $.data.error_id }
            - call: "POST /provost/academic-programs/${prog_id}/teach-out-plans"
              payload: { decision_id: "${dec_id}", last_admit_term_index: 4, first_teach_out_term_index: 3, final_award_term_index: 5, expected_program_version: "${stale_v}" }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { e_stale_and_bad_body: $.data.error_id }
            - call: "POST /provost/academic-programs/${prog_id}/teach-out-plans"
              payload: { decision_id: "${dec_id}", last_admit_term_index: 3, first_teach_out_term_index: 4, final_award_term_index: 5, expected_program_version: "${stale_v}" }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { e_stale: $.data.error_id }
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { fresh_v: $.data.version }
            - call: "POST /provost/academic-programs/${prog_id}/teach-out-plans"
              payload: { decision_id: "${dec_id}", last_admit_term_index: 3, first_teach_out_term_index: 4, final_award_term_index: 5, expected_program_version: "${fresh_v}" }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { plan_id: $.data.id }
            - call: "GET /provost/academic-programs/${prog_id}"
              payload: {}
              as: ProgramChair
              as_user_id: "${prog_id}"
          assert:
            - "${e_fk} == ERR_DECISION_NOT_FOUND with HTTP 404 — the body FK check at priority 8 runs BEFORE the OCC check at priority 10, so an unknown decision_id masks the stale version"
            - "${e_stale_and_bad_body} == ERR_STALE_PROGRAM_VERSION with HTTP 412 and NOT ERR_VALIDATION (422) — priority 10 runs before the term-order check at priority 31, so a stale author is told their view is stale before their draft is critiqued"
            - "${e_stale} == ERR_STALE_PROGRAM_VERSION with HTTP 412 — ${stale_v} was read one request before the ratification cascade moved the program to TEACH_OUT_PENDING and suppressed admissions, which bumped the version"
            - "${fresh_v} is exactly ${stale_v} + 1 — the ratification cascade bumped the program once, and none of the three refused writes bumped it at all"
            - "the fifth call returns 201 with the plan in DRAFT, plan_revision_round 0, guaranteed_seat_total 0, required_seat_total 0 and seat_shortfall 0"
            - "the final program read reports version ${fresh_v} + 1 — the accepted plan create bumped the program exactly once, so a second author echoing ${fresh_v} would now be stale in turn"

      - name: a_second_proposal_needs_the_version_the_first_proposal_produced
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[decision-propose-stale-cycle]
          - validations[priority=10]
          - errors[ERR_STALE_CYCLE_VERSION]
          - state_machines.DecisionRecord.PROPOSED_to_WITHDRAWN
        distinguishing_aspect: |
          Superseding an earlier proposal is legitimate product behaviour, so the
          only thing standing between the second provost and the write is the
          version: proposing again with the version that was current before the
          FIRST proposal is refused 412, while the version read afterwards
          succeeds and auto-WITHDRAWs the earlier decision. The refused attempt
          neither creates a decision nor withdraws the incumbent, which is what
          distinguishes a rejected supersede from an accepted one.
        test_recipe:
          setup:
            - "A NONVIABLE program whose cycle is in RESPONSE_SUBMITTED, with the cycle version captured before any decision exists."
          setup_api_calls:
