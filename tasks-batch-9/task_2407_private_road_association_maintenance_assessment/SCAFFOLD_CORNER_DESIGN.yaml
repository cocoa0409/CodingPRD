            - "approving while DISPUTED returns HTTP 409 with error_id ERR_REQUEST_NOT_PENDING"
            - "resolve-dispute returns HTTP 200 with status SUBMITTED, easement_grant_recorded true, resolution_note recorded and dispute_reason null; a second resolve-dispute returns HTTP 409 with error_id ERR_REQUEST_NOT_PENDING"
