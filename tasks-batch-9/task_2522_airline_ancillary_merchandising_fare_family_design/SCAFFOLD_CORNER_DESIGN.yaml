            - "the earlier checks all passed: FareFamily.status == \"PUBLISHED\", GET /channel-publications/${pub_direct_id} is IN_PARITY, and the booking is HELD with disclosure_state ACKNOWLEDGED"
            - "GET /channel-publications?fare_family_id=${f_lite_id}&distribution_channel_id=${ch_ota_id} returns total_count == 0"
            - "GET /bookings/${bk_id} still shows booking_status \"HELD\", fare_component_cents null and channel_settlement_total_cents 0"

      - name: offer_acceptance_window_is_half_open_at_valid_until
        claim_type: temporal_validation
        grounds:
          - validations.priority_20
          - errors[ERR_OFFER_WINDOW_CLOSED]
          - global_constants.OFFER_TTL_MINUTES
        excluded_because:
          difficulty_instance: offer_window_halfopen_boundary_at_valid_until
          rationale: "The named 1.8 instance accepts one clone of the offer one minute before valid_until and is refused on another at exactly valid_until, pinning the half-open boundary."

      - name: two_individually_valid_segments_together_exceed_the_cabin
        claim_type: aggregate_validation
        grounds:
          - validations.priority_40
          - errors[ERR_SEGMENT_EXCEEDS_CABIN]
          - entities.Flight.fields.cabin_seat_total
        distinguishing_aspect: "On a flight with cabin_seat_total 10, a 6-seat segment is individually legal and a second 6-seat segment is individually legal, but their sum of 12 breaches the cabin, so the aggregate check refuses the second one."
        test_recipe:
          setup:
            - "flight AC534 declares cabin_seat_total 10"
            - "one OPEN MID segment for SEAT_STANDARD already covers rows 16..18 x [A, B] = 6 seats"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "SEAT_STANDARD", name: "Standard seat", category: "SEAT", list_price_cents: 1900, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4200", refundable: true }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_seat_std_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC534", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 10 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /seat-segments"
              payload: { flight_id: "${fl_id}", ancillary_product_id: "${p_seat_std_id}", zone: "MID", row_start: 16, row_end: 18, seat_letters: ["A", "B"], base_price_cents: 2000 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { seg_first_id: $.data.id }
          trigger:
            - call: "POST /seat-segments"
              payload: { flight_id: "${fl_id}", ancillary_product_id: "${p_seat_std_id}", zone: "AFT", row_start: 20, row_end: 22, seat_letters: ["A", "B"], base_price_cents: 2000 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 and data.error_id == \"ERR_SEGMENT_EXCEEDS_CABIN\""
            - "the refused segment is not an overlap case: rows 20..22 share no seat with rows 16..18"
            - "GET /seat-segments?flight_id=${fl_id} returns total_count == 1 and the surviving segment still reports total_seats 6"
            - "a third request for rows 20..21 x [A, B] (4 seats, sum 10) succeeds, proving the check is <= cabin_seat_total and not < it"

      - name: delay_waiver_threshold_applies_only_when_change_is_in_scope
        claim_type: conditional_validation
        grounds:
          - validations.priority_44
          - errors[ERR_DELAY_THRESHOLD_NOT_MET]
          - global_constants.IROPS_CHANGE_WAIVER_MIN_DELAY_MINUTES
        distinguishing_aspect: "delay_minutes 120 is accepted for a DELAY waiver scoping only BAGGAGE but refused for one scoping CHANGE, because the 180-minute floor is conditional on CHANGE being a member of waiver_scope."
        test_recipe:
          setup:
            - "flight AC535 already carries an ACTIVE DELAY waiver with delay_minutes 120 and waiver_scope [BAGGAGE], so its irops_state is IRREGULAR and active_waiver_count is 1"
          setup_api_calls:
            - call: "POST /flights"
              payload: { flight_no: "AC535", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /flights/${fl_id}/irops-waivers"
              payload: { event_type: "DELAY", delay_minutes: 120, waiver_scope: ["BAGGAGE"] }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { w_bag_id: $.data.id }
          trigger:
            - call: "POST /flights/${fl_id}/irops-waivers"
              payload: { event_type: "DELAY", delay_minutes: 120, waiver_scope: ["BAGGAGE", "CHANGE"] }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 and data.error_id == \"ERR_DELAY_THRESHOLD_NOT_MET\""
            - "GET /irops-waivers/${w_bag_id} is still ACTIVE with delay_minutes 120: the same 120 minutes was legal without CHANGE in scope"
            - "GET /flights/${fl_id} still reports irops_state \"IRREGULAR\" and active_waiver_count == 1"
            - "the same request with delay_minutes 180 succeeds, so the boundary is >= 180"

      - name: disclosure_ack_state_is_checked_before_the_fingerprint
        claim_type: cascading_validation
        grounds:
