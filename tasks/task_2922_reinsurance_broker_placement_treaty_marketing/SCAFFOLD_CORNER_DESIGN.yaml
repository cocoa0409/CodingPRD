      - name: the_documentation_chain_refuses_an_out_of_order_or_repeated_filing
        claim_type: linear
        grounds:
          - state_machines.Program.transitions[NOT_STARTED->SLIP_ISSUED]
          - state_machines.Program.transitions[SLIP_ISSUED->WORDING_DRAFTED]
          - validations[priority=22]
          - errors.ERR_DOCUMENT_SEQUENCE_INVALID
        distinguishing_aspect: |
          The documentation dimension only ever moves forward through SLIP → WORDING_DRAFT →
          AGREED_WORDING → EXECUTED_CONTRACT. On a BOUND program with documentation NOT_STARTED,
          filing WORDING_DRAFT first is 409 ERR_DOCUMENT_SEQUENCE_INVALID, and after SLIP_ISSUED a
