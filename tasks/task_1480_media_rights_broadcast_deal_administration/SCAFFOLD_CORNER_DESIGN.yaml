      - call: POST /rights-assets
        payload:
          asset_code: CALC1
          competition_name: CALC1
          season_label: '2026'
          season_start_date: '2026-01-01T00:00:00Z'
          season_end_date: '2026-12-31T23:59:59Z'
          total_package_pool: 1
          guaranteed_rating_basis_points: 3000
        as: RightsManager
        captures:
