# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine Difficulty Rules
# (§0.5). 9 rule_ids x >= 2 instances = 18 instances.
# All numeric asserts are literals computed against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: premium_earning_pro_rata_vs_short_rate_on_bond
        grounds:
          - calculations.premium_earning
          - state_machines.Bond.ACTIVE_to_CANCELLED
          - entities.Bond.fields.earned_premium_cents
        distinguishing_aspect: |
          Two valid earned-premium algorithms on the SAME Bond (written_premium_cents=180000,
          term_months=12, elapsed=3): PRO_RATA yields 45000 while SHORT_RATE yields 58500 —
          the dual-variant subject is the Bond domain.
        test_recipe:
          setup:
            - "A PREFERRED principal (credit_score 760, working_capital 5,000,000) with EXECUTED indemnity; program single_limit 20,000,000, aggregate_limit 50,000,000, referral_threshold 25,000,000."
            - "One ACTIVE bond bound from a PREFERRED/BID application penal 12,000,000 term 12: surcharge applies (12M*2 >= 20M) so rate 100+50=150 and written_premium 180,000. Clock advanced from default 2026-01-01 to 2026-04-01 (elapsed 3 months)."
          setup_api_calls:
            - call: "POST /surety/programs"
              payload: { name: "P1", single_limit_cents: 20000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 25000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
              captures: { prog_id: $.data.id }
            - call: "POST /surety/principals"
              payload: { legal_name: "Acme", credit_score: 760, working_capital_cents: 5000000 }
              as: Underwriter
              captures: { prin_id: $.data.id }
            - call: "POST /surety/indemnity-agreements"
              payload: { principal_id: "${prin_id}", indemnitor_count: 1, required_signature_count: 1 }
              as: Underwriter
              captures: { gia_id: $.data.id }
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications"
              payload: { principal_id: "${prin_id}", program_id: "${prog_id}", bond_type: "BID", requested_penal_sum_cents: 12000000, term_months: 12 }
              as: Underwriter
              captures: { app_id: $.data.id }
            - call: "POST /surety/applications/${app_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications/${app_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /surety/bonds"
              payload: { application_id: "${app_id}" }
              as: Underwriter
              captures: { bond_id: $.data.id }
            - call: "POST /surety/bonds/${bond_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /surety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: SeniorUnderwriter
          trigger:
            - call: "POST /surety/bonds/${bond_id}/cancel"
              payload: { cancel_mode: "SHORT_RATE" }
              as: Underwriter
              captures: { earned: $.data.earned_premium_cents }
          assert:
            - "Bond.${bond_id}.written_premium_cents == 180000"
            - "Bond.${bond_id}.earned_premium_cents == 58500"
            - "Bond.${bond_id}.status == CANCELLED"
            - "Under PRO_RATA the same bond would have earned 45000 (delta 13500 is the short-rate penalty)."

      - name: incurred_loss_case_reserve_vs_paid_actual_on_claim
        grounds:
          - calculations.incurred_loss
          - state_machines.Claim.INVESTIGATING_to_PAID
          - entities.Bond.fields.incurred_loss_cents
        distinguishing_aspect: |
          Two valid incurred-loss views of the SAME claim set on the Claim/Bond domain: while
          INVESTIGATING the bond shows case-reserve 800000; after settle PAY (paid 600000,
          salvage 100000) it shows paid-net-of-salvage 500000 — a different entity domain than
          premium_earning's Bond-premium variants.
        test_recipe:
          setup:
            - "An ACTIVE bond with penal 5,000,000; one claim FILED then INVESTIGATING with reserve 800,000."
          setup_api_calls:
            - call: "POST /surety/programs"
              payload: { name: "P2", single_limit_cents: 20000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 25000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
              captures: { prog_id: $.data.id }
            - call: "POST /surety/principals"
              payload: { legal_name: "Beta", credit_score: 700, working_capital_cents: 1000000 }
              as: Underwriter
              captures: { prin_id: $.data.id }
            - call: "POST /surety/indemnity-agreements"
              payload: { principal_id: "${prin_id}", indemnitor_count: 1, required_signature_count: 1 }
              as: Underwriter
              captures: { gia_id: $.data.id }
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications"
              payload: { principal_id: "${prin_id}", program_id: "${prog_id}", bond_type: "PERFORMANCE", requested_penal_sum_cents: 5000000, term_months: 12 }
              as: Underwriter
              captures: { app_id: $.data.id }
            - call: "POST /surety/applications/${app_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications/${app_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /surety/bonds"
              payload: { application_id: "${app_id}" }
              as: Underwriter
              captures: { bond_id: $.data.id }
            - call: "POST /surety/bonds/${bond_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /surety/claims"
              payload: { bond_id: "${bond_id}", claimant_name: "Obligee X", demand_cents: 900000, reserve_cents: 800000 }
              as: ClaimsExaminer
              captures: { claim_id: $.data.id }
            - call: "POST /surety/claims/${claim_id}/investigate"
              payload: { reserve_cents: 800000 }
              as: ClaimsExaminer
          trigger:
            - call: "POST /surety/claims/${claim_id}/settle"
              payload: { outcome: "PAY", paid_loss_cents: 600000, salvage_cents: 100000 }
              as: ClaimsExaminer
          assert:
            - "Before settle (INVESTIGATING) Bond.${bond_id}.incurred_loss_cents == 800000 (case-reserve variant)"
            - "After settle PAY Bond.${bond_id}.incurred_loss_cents == 500000 (paid 600000 - salvage 100000)"
            - "Claim.${claim_id}.status == PAID"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: premium_rating_table_surcharge_clamp_mode_a
        grounds:
          - calculations.premium_rating
          - state_machines.BondApplication.DRAFT_to_SUBMITTED
          - entities.BondApplication.fields.quoted_premium_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (credit_tier, bond_type, requested_penal_sum_cents) with non-linear
          interaction — RATE_TABLE lookup + conditional large-risk surcharge (penal*2 >= single_limit)
          + MAX_RATE clamp. SUBSTANDARD/PERFORMANCE base 375 + surcharge 50 = 425 clamps to 400, so
          penal 10,000,000 -> quoted_premium 400000, NOT 425-based 425000.
        test_recipe:
          setup:
            - "A SUBSTANDARD principal (credit_score 600, working_capital 0) with EXECUTED indemnity; program single_limit 20,000,000."
          setup_api_calls:
            - call: "POST /surety/programs"
              payload: { name: "P3", single_limit_cents: 20000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 25000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
              captures: { prog_id: $.data.id }
            - call: "POST /surety/principals"
              payload: { legal_name: "SubCo", credit_score: 600, working_capital_cents: 0 }
              as: Underwriter
              captures: { prin_id: $.data.id }
            - call: "POST /surety/indemnity-agreements"
              payload: { principal_id: "${prin_id}", indemnitor_count: 1, required_signature_count: 1 }
              as: Underwriter
              captures: { gia_id: $.data.id }
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications"
              payload: { principal_id: "${prin_id}", program_id: "${prog_id}", bond_type: "PERFORMANCE", requested_penal_sum_cents: 10000000, term_months: 12 }
              as: Underwriter
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /surety/applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              captures: { rate: $.data.quoted_premium_rate_bps, prem: $.data.quoted_premium_cents }
          assert:
            - "Principal.${prin_id}.credit_tier == SUBSTANDARD"
            - "BondApplication.${app_id}.quoted_premium_rate_bps == 400 (375 base + 50 surcharge clamped to MAX_RATE_BPS 400)"
            - "BondApplication.${app_id}.quoted_premium_cents == 400000"

      - name: rider_premium_round_then_multiply_mode_b
        grounds:
          - calculations.rider_premium
          - state_machines.Rider.DRAFT_to_APPLIED
          - entities.Rider.fields.additional_premium_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order is pinned. For an INCREASE delta 2,500,000 at
          rate_bps 225, term 12, remaining 6 months: round-per-month-FIRST gives monthly 4688
          (4687.5 rounded up) x 6 = 28128, whereas sum-then-round gives 28125. The scaffold pins
          round-then-multiply, so 28128 — a different combinatorial mode than premium_rating (a).
        test_recipe:
          setup:
            - "An ACTIVE bond penal 5,000,000, premium_rate_bps 225, term 12 (STANDARD/PERFORMANCE, no surcharge since 5M*2 < 20M); clock advanced 6 months; a DRAFT INCREASE rider delta 2,500,000."
          setup_api_calls:
            - call: "POST /surety/programs"
              payload: { name: "P4", single_limit_cents: 20000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 25000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
              captures: { prog_id: $.data.id }
            - call: "POST /surety/principals"
              payload: { legal_name: "Gamma", credit_score: 700, working_capital_cents: 1000000 }
              as: Underwriter
              captures: { prin_id: $.data.id }
            - call: "POST /surety/indemnity-agreements"
              payload: { principal_id: "${prin_id}", indemnitor_count: 1, required_signature_count: 1 }
              as: Underwriter
              captures: { gia_id: $.data.id }
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications"
              payload: { principal_id: "${prin_id}", program_id: "${prog_id}", bond_type: "PERFORMANCE", requested_penal_sum_cents: 5000000, term_months: 12 }
              as: Underwriter
              captures: { app_id: $.data.id }
            - call: "POST /surety/applications/${app_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications/${app_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /surety/bonds"
              payload: { application_id: "${app_id}" }
              as: Underwriter
              captures: { bond_id: $.data.id }
            - call: "POST /surety/bonds/${bond_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /surety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: SeniorUnderwriter
            - call: "POST /surety/riders"
              payload: { bond_id: "${bond_id}", rider_type: "INCREASE", penal_sum_delta_cents: 2500000 }
              as: Underwriter
              captures: { rider_id: $.data.id }
          trigger:
            - call: "POST /surety/riders/${rider_id}/apply"
              payload: {}
              as: Underwriter
              captures: { addl: $.data.additional_premium_cents }
          assert:
            - "Rider.${rider_id}.additional_premium_cents == 28128 (round-per-month 4688 x 6, NOT sum-then-round 28125)"
            - "Rider.${rider_id}.status == APPLIED"
            - "Bond.${bond_id}.penal_sum_cents == 7500000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: bond_application_branching_fork_submitted
        grounds:
          - state_machines.BondApplication.SUBMITTED_to_APPROVED
          - state_machines.BondApplication.SUBMITTED_to_REFERRED
          - state_machines.BondApplication.SUBMITTED_to_DECLINED
        distinguishing_aspect: |
          BondApplication is a branching fork-join: from SUBMITTED the same entity may go to
          APPROVED, REFERRED, or DECLINED with divergent side-effects (REFERRED only re-routes
          authority, DECLINED records decline_reason, APPROVED enables binding). Non-linear on the
          BondApplication entity.
        test_recipe:
          setup:
            - "A SUBMITTED application below referral threshold (penal 5,000,000, threshold 25,000,000)."
          setup_api_calls:
            - call: "POST /surety/programs"
              payload: { name: "P5", single_limit_cents: 20000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 25000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
              captures: { prog_id: $.data.id }
            - call: "POST /surety/principals"
              payload: { legal_name: "Delta", credit_score: 700, working_capital_cents: 1000000 }
              as: Underwriter
              captures: { prin_id: $.data.id }
            - call: "POST /surety/indemnity-agreements"
              payload: { principal_id: "${prin_id}", indemnitor_count: 1, required_signature_count: 1 }
              as: Underwriter
              captures: { gia_id: $.data.id }
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications"
              payload: { principal_id: "${prin_id}", program_id: "${prog_id}", bond_type: "PERFORMANCE", requested_penal_sum_cents: 5000000, term_months: 12 }
              as: Underwriter
              captures: { app_id: $.data.id }
            - call: "POST /surety/applications/${app_id}/submit"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /surety/applications/${app_id}/refer"
              payload: {}
              as: Underwriter
          assert:
            - "BondApplication.${app_id}.status == REFERRED (the REFERRED branch, distinct from APPROVED/DECLINED forks reachable from SUBMITTED)"

      - name: bond_branching_active_divergent_terminals
        grounds:
          - state_machines.Bond.ACTIVE_to_CANCELLED
          - state_machines.Bond.ACTIVE_to_RENEWED
          - state_machines.Bond.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Bond branches from ACTIVE to three terminals with divergent side-effects: CANCELLED
          (earned premium per cancel_mode + recapture), RENEWED (successor bond + superseded_by),
          EXPIRED (earned = written + recapture). Non-linear on the Bond entity — a different
          entity than BondApplication.
        test_recipe:
          setup:
            - "An ACTIVE bond penal 5,000,000 with no cessions and no open claims; clock at term end."
          setup_api_calls:
            - call: "POST /surety/programs"
              payload: { name: "P6", single_limit_cents: 20000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 25000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
              captures: { prog_id: $.data.id }
            - call: "POST /surety/principals"
              payload: { legal_name: "Epsilon", credit_score: 700, working_capital_cents: 1000000 }
              as: Underwriter
              captures: { prin_id: $.data.id }
            - call: "POST /surety/indemnity-agreements"
              payload: { principal_id: "${prin_id}", indemnitor_count: 1, required_signature_count: 1 }
              as: Underwriter
              captures: { gia_id: $.data.id }
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications"
              payload: { principal_id: "${prin_id}", program_id: "${prog_id}", bond_type: "PERFORMANCE", requested_penal_sum_cents: 5000000, term_months: 12 }
              as: Underwriter
              captures: { app_id: $.data.id }
            - call: "POST /surety/applications/${app_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications/${app_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /surety/bonds"
              payload: { application_id: "${app_id}" }
              as: Underwriter
              captures: { bond_id: $.data.id }
            - call: "POST /surety/bonds/${bond_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /surety/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: SeniorUnderwriter
          trigger:
            - call: "POST /surety/bonds/${bond_id}/expire"
              payload: {}
              as: Underwriter
          assert:
            - "Bond.${bond_id}.status == EXPIRED (the EXPIRED branch)"
            - "Bond.${bond_id}.earned_premium_cents == 112500 (fully earned at natural expiry, == written_premium)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: bond_cancel_cascades_recapture_treaty_and_program_depth3
        grounds:
          - state_machines.Bond.ACTIVE_to_CANCELLED
          - state_machines.Cession.ACTIVE_to_RECAPTURED
          - entities.ReinsuranceTreaty.fields.ceded_committed_cents
          - entities.SuretyProgram.fields.aggregate_committed_cents
        distinguishing_aspect: |
          Depth-3 chain from the Bond cancel trigger: cancel mutates the Bond (A) -> each ACTIVE
          Cession on it transitions to RECAPTURED (B, caused by A) -> each RECAPTURED cession
          decrements its ReinsuranceTreaty.ceded_committed_cents (C, caused by B). Each link is
          caused by the prior link.
        test_recipe:
          setup:
            - "An ACTIVE bond penal 12,000,000 with one ACTIVE cession ceding 3,600,000 (30%) to a treaty whose ceded_committed_cents is 3,600,000; no open claims."
          setup_api_calls:
            - call: "POST /surety/programs"
              payload: { name: "P7", single_limit_cents: 20000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 25000000, loss_alert_threshold_cents: 50000000 }
              as: SeniorUnderwriter
              captures: { prog_id: $.data.id }
            - call: "POST /surety/treaties"
              payload: { name: "T7", cession_pct_bps: 3000, treaty_capacity_cents: 10000000 }
              as: SeniorUnderwriter
              captures: { treaty_id: $.data.id }
            - call: "POST /surety/principals"
              payload: { legal_name: "Zeta", credit_score: 760, working_capital_cents: 5000000 }
              as: Underwriter
              captures: { prin_id: $.data.id }
            - call: "POST /surety/indemnity-agreements"
              payload: { principal_id: "${prin_id}", indemnitor_count: 1, required_signature_count: 1 }
              as: Underwriter
              captures: { gia_id: $.data.id }
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications"
              payload: { principal_id: "${prin_id}", program_id: "${prog_id}", bond_type: "BID", requested_penal_sum_cents: 12000000, term_months: 12 }
              as: Underwriter
              captures: { app_id: $.data.id }
            - call: "POST /surety/applications/${app_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications/${app_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /surety/bonds"
              payload: { application_id: "${app_id}" }
              as: Underwriter
              captures: { bond_id: $.data.id }
            - call: "POST /surety/bonds/${bond_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /surety/cessions"
              payload: { bond_id: "${bond_id}", treaty_id: "${treaty_id}" }
              as: Underwriter
              captures: { cession_id: $.data.id }
          trigger:
            - call: "POST /surety/bonds/${bond_id}/cancel"
              payload: { cancel_mode: "PRO_RATA" }
              as: Underwriter
          assert:
            - "Cession.${cession_id}.status == RECAPTURED (B, caused by the cancel)"
            - "ReinsuranceTreaty.${treaty_id}.ceded_committed_cents == 0 (C, caused by recapture: 3,600,000 released)"
            - "SuretyProgram.${prog_id}.aggregate_committed_cents == 0 (bond's net_retained released before recapture)"
            - "Bond.${bond_id}.status == CANCELLED"

      - name: claim_settle_pay_cascades_incurred_loss_then_program_suspend_depth3
        grounds:
          - state_machines.Claim.INVESTIGATING_to_PAID
          - entities.Bond.fields.incurred_loss_cents
          - entities.SuretyProgram.fields.status
          - calculations.incurred_loss
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (claim settle PAY): settle mutates the Claim (A)
          -> Bond.incurred_loss_cents recomputed (B, caused by A) -> when cumulative program
          incurred loss reaches loss_alert_threshold_cents the SuretyProgram.status -> SUSPENDED (C,
          caused by B). Different propagation pattern than the cancel cascade.
        test_recipe:
          setup:
            - "Program aggregate_limit_cents 50,000,000 (ample to bind) but loss_alert_threshold_cents 2,000,000 (low). An ACTIVE bond penal 3,000,000; a claim INVESTIGATING with reserve 4,500,000."
          setup_api_calls:
            - call: "POST /surety/programs"
              payload: { name: "P8", single_limit_cents: 20000000, aggregate_limit_cents: 50000000, referral_threshold_cents: 25000000, loss_alert_threshold_cents: 2000000 }
              as: SeniorUnderwriter
              captures: { prog_id: $.data.id }
            - call: "POST /surety/principals"
              payload: { legal_name: "Eta", credit_score: 700, working_capital_cents: 1000000 }
              as: Underwriter
              captures: { prin_id: $.data.id }
            - call: "POST /surety/indemnity-agreements"
              payload: { principal_id: "${prin_id}", indemnitor_count: 1, required_signature_count: 1 }
              as: Underwriter
              captures: { gia_id: $.data.id }
            - call: "POST /surety/indemnity-agreements/${gia_id}/sign"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications"
              payload: { principal_id: "${prin_id}", program_id: "${prog_id}", bond_type: "PERFORMANCE", requested_penal_sum_cents: 3000000, term_months: 12 }
              as: Underwriter
              captures: { app_id: $.data.id }
            - call: "POST /surety/applications/${app_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /surety/applications/${app_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /surety/bonds"
              payload: { application_id: "${app_id}" }
              as: Underwriter
              captures: { bond_id: $.data.id }
            - call: "POST /surety/bonds/${bond_id}/issue"
              payload: {}
              as: Underwriter
            - call: "POST /surety/claims"
              payload: { bond_id: "${bond_id}", claimant_name: "Obligee Y", demand_cents: 5000000, reserve_cents: 4500000 }
              as: ClaimsExaminer
              captures: { claim_id: $.data.id }
            - call: "POST /surety/claims/${claim_id}/investigate"
              payload: { reserve_cents: 4500000 }
              as: ClaimsExaminer
          trigger:
            - call: "POST /surety/claims/${claim_id}/settle"
              payload: { outcome: "PAY", paid_loss_cents: 2900000, salvage_cents: 0 }
              as: ClaimsExaminer
          assert:
            - "Bond.${bond_id}.incurred_loss_cents == 2900000 (B, paid 2900000 net of 0 salvage replaces the reserve)"
            - "SuretyProgram.${prog_id}.status == SUSPENDED (C, cumulative program incurred loss 2900000 >= loss_alert_threshold 2000000)"
            - "Claim.${claim_id}.status == PAID"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_referential_on_submit
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.BondApplication.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          On POST /surety/applications/{id}/submit an already-SUBMITTED application that also lacks
          indemnity-on-file violates BOTH state (priority 5, ERR_INVALID_STATE) and
          business_referential (priority 7, ERR_INDEMNITY_REQUIRED); priority 5 wins ->
          ERR_INVALID_STATE. Category pair: state vs business_referential.
        test_recipe:
          setup:
