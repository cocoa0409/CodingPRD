          - entities.GuildAgreement.fields.max_free_revision_rounds
          - entities.GuildAgreement.fields.turnaround_buffer_days
          - entities.GuildAgreement.fields.clearance_escalation_score
          - endpoints.POST_/guild-agreements
        distinguishing_aspect: |
          Ten of the rate card's fields are optional and every one of them has a non-null default that
          later calculations depend on; a card posted with only the fourteen mandatory fields must come
          back fully populated (0.5 / 1.2 / 20 / 0.1 / 2 / 33 / 0.667 / 10 / 2 / 30) rather than with nulls.
        test_recipe:
