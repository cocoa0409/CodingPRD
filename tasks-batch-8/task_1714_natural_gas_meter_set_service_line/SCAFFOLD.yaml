  # auth (401/403)
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Authenticated role not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNER, http: 403, condition: "Builder X-User-ID != resource builder_id, or Inspector X-User-ID != inspection.inspector_id on record-result" }
  # existence (404)
  - { id: ERR_BUILDER_NOT_FOUND, http: 404, condition: "builder_id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "service application id does not exist" }
  - { id: ERR_LOAD_NOT_FOUND, http: 404, condition: "appliance load id does not exist" }
  - { id: ERR_MAIN_EXTENSION_NOT_FOUND, http: 404, condition: "main extension id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "CIAC invoice id does not exist" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "CIAC payment/refund event id does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "permit id does not exist" }
  - { id: ERR_CREW_NOT_FOUND, http: 404, condition: "field crew id does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "crew booking id does not exist" }
  - { id: ERR_INSPECTOR_NOT_FOUND, http: 404, condition: "inspector id does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "inspection id does not exist" }
  - { id: ERR_METER_SET_NOT_FOUND, http: 404, condition: "meter set id does not exist" }
  - { id: ERR_TEST_NOT_FOUND, http: 404, condition: "purge/leak test id does not exist" }
  - { id: ERR_TURN_ON_NOT_FOUND, http: 404, condition: "turn-on event id does not exist" }
  - { id: ERR_COMMITMENT_NOT_FOUND, http: 404, condition: "timeline commitment id does not exist" }
  - { id: ERR_GIS_NOT_FOUND, http: 404, condition: "GIS as-built id does not exist" }
  # request shape (400)
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, invalid enum member, non-positive quantity/footage/amount, start_minute >= end_minute, or ROAD_CUT permit with empty crossings" }
  # optimistic concurrency (412)
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version in body does not equal the entity's current version" }
  # state (409)
  - { id: ERR_APPLICATION_TERMINAL, http: 409, condition: "Mutation attempted on a COMPLETED/REJECTED/CANCELLED/EXPIRED application or one of its children" }
  - { id: ERR_APPLICATION_ON_HOLD, http: 409, condition: "Application hold_status != NOT_HELD blocks child mutations and spine transitions" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity's current state does not permit the requested transition (generic machine violation)" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "Payment attempted on an invoice not in ISSUED/PARTIALLY_PAID" }
  - { id: ERR_INVOICE_NOT_REFUNDABLE, http: 409, condition: "Refund attempted on an invoice not in REFUND_PENDING" }
  - { id: ERR_COMMITMENT_NOT_REVISABLE, http: 409, condition: "propose-revision attempted while commitment not ACCEPTED" }
  - { id: ERR_SERVICE_LINE_NOT_INSTALLED, http: 409, condition: "MeterSet install attempted before the application's crew booking completed (application.status != SERVICE_INSTALLED)" }
  - { id: ERR_METER_NOT_READY, http: 409, condition: "Turn-on completion attempted before the application is in TURN_ON (meter set not READY_FOR_TURN_ON)" }
  # temporal (422)
  - { id: ERR_QUOTE_EXPIRED, http: 422, condition: "accept-quote after application.quote_valid_until" }
  - { id: ERR_DATE_IN_PAST, http: 422, condition: "work_date/inspection_date/requested_completion_date/expires_at before the current logical date" }
  # constraint (409/422)
  - { id: ERR_DUPLICATE_MAIN_EXTENSION, http: 409, condition: "A non-CANCELLED MainExtension already exists for the application" }
  - { id: ERR_DUPLICATE_METER_SET, http: 409, condition: "A non-CANCELLED MeterSet already exists for the application" }
  - { id: ERR_DUPLICATE_GIS, http: 409, condition: "A non-CANCELLED GISAsBuilt already exists for the application" }
  - { id: ERR_LOADS_LOCKED, http: 409, condition: "ApplianceLoad create/patch/delete after the application reached LOAD_CONFIRMED" }
  - { id: ERR_TEST_ALREADY_ACTIVE, http: 409, condition: "A PurgeLeakTest in RECORDED status already exists for the meter set" }
  - { id: ERR_INSPECTOR_NOT_CERTIFIED, http: 422, condition: "Inspector.certifications lacks the member required by the inspection type or PRESSURE_TEST witnessing" }
  - { id: ERR_CREW_WINDOW_CONFLICT, http: 409, condition: "Crew booking violates buffered closed-interval rule: same crew+date with new.start < existing.end + 30 AND new.end + 30 > existing.start (adjacency closer than 30 minutes is a conflict)" }
  - { id: ERR_INSPECTOR_WINDOW_CONFLICT, http: 409, condition: "Inspection violates half-open interval rule: same inspector+date with new.start < existing.end AND new.end > existing.start (back-to-back adjacency is ALLOWED)" }
  - { id: ERR_CREW_CAPACITY_EXCEEDED, http: 422, condition: "Sum of CONFIRMED booking durations for the crew-day plus the new duration exceeds crew.daily_capacity_minutes (equality allowed)" }
  - { id: ERR_METER_SIZE_UNAVAILABLE, http: 422, condition: "Diversity-adjusted load exceeds the largest meter model's pressure-adjusted capacity" }
  - { id: ERR_BUILDER_SUSPENDED, http: 422, condition: "Builder.status == SUSPENDED on application create/submit" }
  - { id: ERR_NO_APPLIANCE_LOADS, http: 422, condition: "Submit attempted with zero ApplianceLoad rows" }
  - { id: ERR_INVOICE_HAS_PAYMENTS, http: 409, condition: "MainExtension revise attempted after payments were applied to its invoice" }
  # safety / compliance (422)
  - { id: ERR_TEST_PARAMS_UNSAFE, http: 422, condition: "purge_duration_min < 5 or test_pressure_psi < 10.0 or test_duration_min < 15" }
  - { id: ERR_SOD_WITNESS_IS_INSTALLER, http: 422, condition: "Certifying inspector id equals the test's installer_user_id" }
  - { id: ERR_SOD_PAYMENT_BY_ISSUER, http: 422, condition: "Payment clerk X-User-ID equals invoice.issued_by_user_id" }
  - { id: ERR_SOD_REFUND_BY_PAYER, http: 422, condition: "Refund clerk X-User-ID equals the recorded_by_user_id of any PAYMENT event on the invoice" }
  - { id: ERR_GIS_DEPTH_VIOLATION, http: 422, condition: "GIS validate with depth_inches < 18" }
  # referential (422)
  - { id: ERR_PERMIT_NOT_APPROVED, http: 422, condition: "schedule-construction with a Permit outside {APPROVED, CLOSED}, or no APPROVED/CLOSED ROAD_CUT permit while crossings_count > 0" }
  - { id: ERR_NO_CONFIRMED_BOOKING, http: 422, condition: "schedule-construction without any CONFIRMED CrewBooking" }
  - { id: ERR_TURN_ON_INCOMPLETE, http: 422, condition: "energize while some ApplianceLoad lacks a VERIFIED TurnOnEvent" }
  - { id: ERR_GIS_NOT_VALIDATED, http: 422, condition: "complete without a VALIDATED GISAsBuilt" }
  - { id: ERR_LOAD_APP_MISMATCH, http: 422, condition: "TurnOnEvent.appliance_load_id belongs to a different application than service_application_id" }
  # fiscal (422)
  - { id: ERR_CIAC_UNPAID, http: 422, condition: "schedule-construction before invoice PAID, or complete before invoice SETTLED/REFUNDED" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment amount_cents > invoice balance_due_cents" }
  - { id: ERR_REFUND_AMOUNT_MISMATCH, http: 422, condition: "Refund amount_cents > remaining refund required" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Builder
    description: "External builder/developer coordinating new-service work; owns its applications"
    identity: "entity_backed:Builder"
    exclusive_operations: [create application, submit application, edit draft application, manage appliance loads, accept quote, accept commitment, propose commitment revision]
    shared_operations: [hold/resume/cancel own application, read any resource]
  - name: NewBusinessRep
    description: "Utility new-business coordinator; approves designs, manages commitments, closes applications"
    identity: "opaque"
    exclusive_operations: [confirm-load, reject application, approve-design, complete application, respond-revision, mark-delayed, register builder]
    shared_operations: [hold/resume/cancel, read any resource]
  - name: DesignEngineer
    description: "Utility engineer; designs main extensions and sizes meter sets"
    identity: "opaque"
    exclusive_operations: [create main extension, submit-design, revise design, meter sizing]
    shared_operations: [read any resource]
  - name: BillingClerk
    description: "Utility billing clerk; records CIAC payments/refunds and finalizes true-ups"
    identity: "opaque"
    exclusive_operations: [record payment, record refund, finalize main extension]
    shared_operations: [read any resource]
  - name: PermitCoordinator
    description: "Utility permit coordinator; files permits and schedules municipal/utility inspections"
    identity: "opaque"
    exclusive_operations: [create/file/decide/amend/close permits, create/cancel/reschedule inspections]
    shared_operations: [read any resource]
  - name: FieldSupervisor
    description: "Construction field supervisor; books crews, completes construction, records as-builts"
    identity: "opaque"
    exclusive_operations: [schedule-construction, manage crew bookings, record-as-built, submit/resubmit GIS as-built]
    shared_operations: [hold/resume, read any resource]
  - name: MeterTechnician
    description: "Meter shop technician; installs meter sets, documents purge/leak tests, performs turn-ons"
    identity: "opaque"
    exclusive_operations: [create meter set, mark-ordered, install, mark-repaired, record purge/leak test, manage turn-on events, energize]
    shared_operations: [read any resource]
  - name: Inspector
    description: "Certified inspector; witnesses leak tests and records inspection results (must be the assigned inspector)"
    identity: "entity_backed:Inspector"
    exclusive_operations: [certify/reject purge-leak tests, record inspection result]
    shared_operations: [read any resource]
  - name: GISAnalyst
    description: "GIS records analyst; validates as-built submissions"
    identity: "opaque"
    exclusive_operations: [validate/reject GIS as-built]
    shared_operations: [read any resource]
  - name: SystemAdmin
    description: "Platform administrator; manages reference resources and the logical clock"
    identity: "opaque"
    exclusive_operations: [suspend/reactivate builder, register field crew, register inspector, set logical clock]
    shared_operations: [register builder, read any resource]
