  # ===================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: tech_double_booked_half_open_minute_grain_overlap
        grounds:
          - validations[priority=14]
          - state_machines.ServiceVisit.SCHEDULED_to_DISPATCHED
          - errors[ERR_TECH_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Minute-grain half-open interval overlap on the Technician resource: a second
          dispatch whose [window_start, window_end) intersects the tech's already
          DISPATCHED visit window is rejected ERR_TECH_DOUBLE_BOOKED. Touching endpoints
          (a.end == b.start) do NOT overlap and would succeed; this case uses a genuine
          interior overlap.
        test_recipe:
          setup:
            - "Clock 2026-07-01T00:00:00Z; NORTH/HVAC tech capacity 5; ACTIVE membership; visit A DISPATCHED to the tech with window 09:00-11:00; visit B SCHEDULED with window 10:00-12:00 (overlaps A)"
