      - name: package_recommend_with_a_still_proposed_prerequisite_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=17]
          - errors[ERR_DEPENDENCY_NOT_RECOMMENDED]
          - state_machines.DecisionPackage.PROPOSED_to_RECOMMENDED
        distinguishing_aspect: |
          Separates the create-time rule (priority 16, prerequisite must not be DEFERRED) from
          the recommend-time rule (priority 17, prerequisite must already be RECOMMENDED): a
          PROPOSED prerequisite is legal at create and illegal at recommend, so the dependent
          package is rejected until the prerequisite is recommended first.
        test_recipe:
          setup:
            - "Agency DOT, BudgetCycle 2027 in phase DEVELOPMENT"
            - "ACCEPTED AgencyRequest carrying prerequisite package A (TECHNICAL 300000000, rank 1, PROPOSED) and dependent package B (TECHNICAL 200000000, rank 2, PROPOSED, depends_on_package_id = A)"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", base_budget_cents: 1000000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { req_id: $.data.id }
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 1, amount_cents: 300000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { pkg_a_id: $.data.id }
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "TECHNICAL", priority_rank: 2, amount_cents: 200000000, depends_on_package_id: "${pkg_a_id}" }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { pkg_b_id: $.data.id }
            - call: "POST /fiscal/agency-requests/${req_id}/submit"
              payload: {}
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/agency-requests/${req_id}/begin-review"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/agency-requests/${req_id}/accept"
              payload: {}
              as: BudgetAnalyst
          trigger:
            - call: "POST /fiscal/decision-packages/${pkg_b_id}/recommend"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/decision-packages/${pkg_a_id}/recommend"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/decision-packages/${pkg_b_id}/recommend"
              payload: {}
              as: BudgetAnalyst
          assert:
            - "the first recommend of B returns HTTP 422 with error_id == ERR_DEPENDENCY_NOT_RECOMMENDED and DecisionPackage.${pkg_b_id}.status is still PROPOSED"
            - "the recommend of A returns HTTP 200 with DecisionPackage.${pkg_a_id}.status == RECOMMENDED"
            - "the second recommend of B returns HTTP 200 with DecisionPackage.${pkg_b_id}.status == RECOMMENDED"
            - "AgencyRequest.${req_id}.total_request_cents == 1500000000 throughout, because recommending never changes membership of the additive set"

      - name: recommendation_package_membership_checks_fire_in_priority_order
        claim_type: Priority Ordering
        grounds:
          - validations[priority=18]
          - validations[priority=19]
          - errors[ERR_PACKAGE_NOT_RECOMMENDED]
          - errors[ERR_PACKAGE_REQUEST_MISMATCH]
        distinguishing_aspect: |
          Two adjacent referential rules on the same array field: with a PROPOSED package
          from a foreign request in recommended_package_ids both rules are violated at once,
          and the lower priority number wins — ERR_PACKAGE_NOT_RECOMMENDED (18) is returned,
          not ERR_PACKAGE_REQUEST_MISMATCH (19). Recommending that foreign package then
          flips the same call to ERR_PACKAGE_REQUEST_MISMATCH.
        setup_note: "Two agencies, each with one ACCEPTED request; agency B's package is used as the foreign reference."
