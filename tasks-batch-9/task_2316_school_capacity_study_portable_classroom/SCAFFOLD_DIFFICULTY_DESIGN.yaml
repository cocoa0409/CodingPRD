      - name: soft_cost_tier_keyed_to_direct_not_total
        grounds:
          calculations: [alternative_cost_comparison]
          entities: [PlacementRequest, CapacityStudy]
          endpoints: ["GET /facilities/placement-requests/{id}/cost-model"]
        mode: c
        formula_shape: "pct = soft_pct(direct_cents); soft = round_half_up(pct * direct_cents); total = direct_cents + soft - the tier is selected from direct_cents and the total is produced last, never the reverse"
        distinguishing_aspect: >
          A 12 seat deficit gives a permanent addition direct cost of exactly
          46,200,000 cents, which sits below the first tier break of 50,000,000, so
          the soft-cost percentage is 9 and the soft cost is 4,158,000, producing a
          total of 50,358,000. That total is itself above the tier break. An
          implementation that keys the tier off the total, or that solves for a
          self-consistent tier, selects 13 percent, produces a soft cost of
          6,006,000 and a total of 52,206,000 - a 1,848,000 cent divergence on the
          same single input. Evaluating direct, then tier, then soft, then total is
          the only order that yields 50,358,000.
        setup_api_calls:
          - call: "POST /facilities/_clock/set_current_utc"
            payload: { to_iso8601: "2027-03-01T00:00:00Z" }
            as: DistrictAdmin
