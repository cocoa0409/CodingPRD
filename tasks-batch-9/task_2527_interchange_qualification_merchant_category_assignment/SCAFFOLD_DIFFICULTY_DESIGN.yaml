              as: NetworkAdmin
            - call: "POST /merchants"
              payload: { legal_name: "City Water Co", business_type_key: "UTILITY_SERVICE", acquirer_id: "${acq_id}", home_country_code: "US" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { mer_id: $.data.id }
            - call: "POST /merchant-category-audits"
