scaffold_difficulty_design:
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cost_per_style_provisional_vs_final_diverge_on_one_snapshot
        grounds:
          - calculations.cost_per_style
          - calculations.session_cost_allocation
          - entities.Style.fields.allocated_cost_cents
          - entities.ShootSession.fields.planned_minutes
          - entities.ShootSession.fields.actual_minutes
          - endpoints[GET /studio/styles/{style_id}/cost-summary]
        distinguishing_aspect: |
          One read returns both variants of the SAME style's cost from the SAME snapshot: the
          provisional figure charges 240 planned minutes over 2 (ASSIGNED+CAPTURED) items and
          yields 122000, while the final figure charges 175 actual minutes over the single
          CAPTURED item and yields 101958 - so the style's per-asset cost moves from 61000 to
          101958 in the same response.
        test_recipe:
          setup:
            - "One IN_HOUSE provider at 18500 cents/station-hour and one OUTSOURCED provider quoting 120000 per style with capacity 40."
            - "Style TOP1001 (priority_tier A) with two required ON_MODEL items, both assigned to one 09:00-13:00 session (planned_minutes 240)."
            - "Session wrapped after 175 actual minutes with exactly one of the two items CAPTURED and one CONFIRMED photographer booking worth 48000."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
            - call: "POST /studio/asset-profiles"
              payload: { category: "APPAREL_TOP", required_angles: ["FRONT", "BACK"], required_detail_shots: 0, min_on_model_shots: 1, video_required: false, naming_pattern: "{style_number}_{angle_code}_{seq}", required_metadata_keys: ["season"] }
              as: StudioAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /studio/stations"
              payload: { station_code: "MODEL-1", station_type: "MODEL", daily_capacity_minutes: 1440, buffer_minutes: 0, max_concurrent_sessions: 1, calibrated_until: "2026-12-31T00:00:00Z" }
              as: StudioAdmin
              captures: { st_id: $.data.id }
            - call: "POST /studio/studio-providers"
              payload: { provider_code: "INHOUSE", provider_kind: "IN_HOUSE", station_hour_rate_cents: 18500, retouch_rate_cents_per_asset: 900, sla_hours: 12, quality_score: 92.00, style_quote_cents: 0, capacity_assets_per_day: 40 }
              as: StudioAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /studio/studio-providers"
              payload: { provider_code: "OUT1", provider_kind: "OUTSOURCED", station_hour_rate_cents: 21000, retouch_rate_cents_per_asset: 1200, sla_hours: 24, quality_score: 88.00, style_quote_cents: 120000, capacity_assets_per_day: 40 }
              as: StudioAdmin
              captures: { out_id: $.data.id }
            - call: "POST /studio/talent-profiles"
              payload: { full_name: "Pia Ren", talent_type: "PHOTOGRAPHER", hourly_rate_cents: 12000, day_rate_cents: 80000, minimum_call_hours: 4, max_daily_minutes: 480 }
              as: StudioAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /studio/styles"
              payload: { style_number: "TOP1001", category: "APPAREL_TOP", vendor_id: "${v_id}", asset_profile_id: "${ap_id}", priority_tier: "A" }
              as: StudioAdmin
              captures: { sty_id: $.data.id }
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-1001", vendor_id: "${v_id}", declared_style_number: "TOP1001" }
              as: SampleCoordinator
              captures: { smp_id: $.data.id }
            - call: "POST /studio/samples/${smp_id}/receive"
              payload: {}
              as: SampleCoordinator
            - call: "POST /studio/samples/${smp_id}/match"
              payload: { style_id: "${sty_id}" }
              as: SampleCoordinator
            - call: "POST /studio/samples/${smp_id}/custody-move"
              payload: { to_state: "IN_STUDIO" }
              as: SampleCoordinator
            - call: "GET /studio/styles/${sty_id}"
              as: Producer
              captures: { sty_v2: $.data.version }
            - call: "POST /studio/shot-list-items"
              payload: { style_id: "${sty_id}", asset_kind: "ON_MODEL", angle_code: "FRONT", estimated_minutes: 60, expected_style_version: "${sty_v2}", required: true }
              as: Producer
              captures: { it1_id: $.data.id }
            - call: "GET /studio/styles/${sty_id}"
              as: Producer
              captures: { sty_v3: $.data.version }
            - call: "POST /studio/shot-list-items"
              payload: { style_id: "${sty_id}", asset_kind: "ON_MODEL", angle_code: "BACK", estimated_minutes: 60, expected_style_version: "${sty_v3}", required: true }
              as: Producer
              captures: { it2_id: $.data.id }
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st_id}", provider_id: "${pr_id}", session_label: "TOP1001 day 1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T13:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
              captures: { ses_id: $.data.id, ses_v1: $.data.version }
            - call: "POST /studio/shot-list-items/${it1_id}/assign"
              payload: { session_id: "${ses_id}" }
              as: Producer
            - call: "POST /studio/shot-list-items/${it2_id}/assign"
              payload: { session_id: "${ses_id}" }
              as: Producer
            - call: "POST /studio/talent-bookings"
              payload: { session_id: "${ses_id}", talent_id: "${ph_id}", role_on_set: "PHOTOGRAPHER", call_time: "2026-08-03T09:00:00Z", wrap_time: "2026-08-03T13:00:00Z", expected_session_version: "${ses_v1}" }
              as: Producer
              captures: { bk_id: $.data.id }
            - call: "POST /studio/talent-bookings/${bk_id}/confirm"
              payload: {}
              as: Producer
            - call: "POST /studio/shoot-sessions/${ses_id}/lock"
              payload: {}
              as: Producer
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/shoot-sessions/${ses_id}/start"
              payload: {}
              as: Photographer
              as_user_id: "${ph_id}"
            - call: "POST /studio/assets"
              payload: { shot_list_item_id: "${it1_id}", file_name: "TOP1001_FRONT_001", sequence_number: 1, metadata_tags: { season: "FW26" } }
              as: Photographer
              as_user_id: "${ph_id}"
              captures: { as1_id: $.data.id }
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:55:00Z" }
              as: StudioAdmin
            - call: "POST /studio/shoot-sessions/${ses_id}/wrap"
              payload: {}
              as: Photographer
              as_user_id: "${ph_id}"
          trigger:
            - call: "GET /studio/styles/${sty_id}/cost-summary"
              as: ContentOps
          assert:
            - "response.data.provisional_cost_cents == 122000"
            - "response.data.final_cost_cents == 101958"
            - "response.data.provisional_cost_per_asset_cents == 61000"
            - "response.data.final_cost_per_asset_cents == 101958"
            - "response.data.outsourced_quote_cents == 120000"
            - "response.data.outsourced_provider_id == ${out_id}"
            - "response.data.variance_cents == -18042"
            - "response.data.recommended_source == \"IN_HOUSE\""
            - "Style.${sty_id}.allocated_cost_cents == 101958"
            - "ShotListItem.${it1_id}.allocated_cost_cents == 101958 and ShotListItem.${it2_id}.allocated_cost_cents == 0"
            - "ShootSession.${ses_id}.actual_minutes == 175"

      - name: retouch_turnaround_gross_breaches_while_net_sits_on_the_sla
        grounds:
          - calculations.retouch_turnaround_hours
          - entities.RetouchTask.fields.turnaround_hours_gross
          - entities.RetouchTask.fields.turnaround_hours_net
          - entities.RetouchTask.fields.rework_hours_total
          - entities.RetouchTask.fields.sla_state
          - state_machines.RetouchTask.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          The same approved task reports turnaround_hours_gross == 10.00 and
          turnaround_hours_net == 6.00 because 4.00 hours were spent in REWORK; sla_state is
          derived from the GROSS variant only, so it is BREACHED against the rushed
          sla_hours == 6 even though the net figure lands exactly on that service level.
        test_recipe:
          setup:
            - "Provider INHOUSE with sla_hours 12; style TOP1001 is priority_tier A, so the task's pinned sla_hours is ceil(12 * 0.5) = 6."
            - "Asset ingested at 2026-08-03T10:00:00Z, claimed, submitted at 11:00, rejected at 15:00, resubmitted at 19:00 (4.00 rework hours), approved at 20:00."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
