      - name: five_newborn_review_ids_from_both_edges_of_the_seventy_two_hour_window_to_the_second_rework_lap
        claim_type: Error Triggerability
        grounds: |
          §1.6 ERR_DEBRIEF_WINDOW_VIOLATION (422), ERR_DEBRIEF_NOT_HELD (422),
          ERR_DEBRIEF_NOTES_REQUIRED (422), ERR_CONTRIBUTING_FACTORS_REQUIRED (422) and
          ERR_REVIEW_REWORK_LIMIT_REACHED (409); §1.2 NewbornComplicationReview (shape cyclic_rework;
          schedule window clock_now <= debrief_scheduled_for_utc <= debrief_due_at with BOTH boundaries
          inclusive; submit-findings only once clock_now >= debrief_scheduled_for_utc; rework bounded by
          REWORK_LIMIT 2 and extending debrief_due_at to clock_now + REWORK_EXTENSION_HOURS 24, "the only
          way the 72-hour window moves"); §1.4 priority 9 (presence of findings_summary and
          contributing_factor_codes) and priority 14.2 (the two window clauses).
        distinguishing_aspect: |
          Both ends of the 72-hour window are probed as a triple: one second before clock_now is 422, an
          hour past debrief_due_at is 422, and debrief_due_at EXACTLY is 200 - so an implementation using
          strict comparisons on either side is caught. The window is then proven mutable in exactly one way:
          two rework laps push debrief_due_at from 2026-08-04T06:00:00Z to 2026-08-05T06:00:00Z and then to
          2026-08-05T12:00:00Z, each time to clock_now + 24h rather than by extending the original 72 hours.
          The two priority-9 fields are violated one at a time so neither probe can hide behind the other,
          and the third rework is 409 rather than a silent third lap.
        test_recipe:
          setup: |
            Clock 2026-08-01T06:00:00Z. One unit with two LDR beds and one ANTEPARTUM encounter that has no
            bed, no CareAssignment and no bundle activation (so submit-findings never trips the
            all-bundles-closed clause). One RN, facilitator_rn, who has never held a CareAssignment on the
            encounter and is therefore a legal facilitator under priority 10. One review with
            complication_code APGAR5_UNDER_7, so opened_at is 06:00 and debrief_due_at is exactly
            2026-08-04T06:00:00Z (72 hours later) with rework_count 0.
