              payload: { creator_id: "${pg_p}", name: "Page Ride A", sport_type: "RIDE", start_lat: 59.00, start_lng: -144.00, end_lat: 59.01, end_lng: -144.00, distance_m: 1000, city: "Pageville" }
              as: Athlete
              as_user_id: "${pg_p}"
            - call: "POST /v1/segments"
              payload: { creator_id: "${pg_p}", name: "Page Ride B", sport_type: "RIDE", start_lat: 59.10, start_lng: -144.10, end_lat: 59.11, end_lng: -144.10, distance_m: 1000, city: "Pageville" }
              as: Athlete
              as_user_id: "${pg_p}"
            - call: "POST /v1/segments"
              payload: { creator_id: "${pg_p}", name: "Page Run A", sport_type: "RUN", start_lat: 59.20, start_lng: -144.20, end_lat: 59.21, end_lng: -144.20, distance_m: 1000, city: "Pageville" }
