        distinguishing_aspect: |
          Trigger = AER close as SUBSTANTIATED. Chain: AdverseEventReport →
          SensorLot.complaint_count += 1 → complaint_posture recomputed →
          crosses to HOLD → all PENDING_PICK SensorOrders on that lot become
          unpickable (ERR_LOT_ON_HOLD). Depth ≥ 3. Distinct trigger from
          warranty-approval cascade.
