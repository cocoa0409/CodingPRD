# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# task_2008_builder_warranty_homeowner_callback
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: reserve_accrual_provisional_vs_trueup
        grounds:
          - calculations.reserve_accrual_schedule
          - entities.WarrantyReserve.fields.accrued_to_date_cents
          - entities.WarrantyReserve.fields.expected_lifetime_accrual_cents
        distinguishing_aspect: |
          On the WarrantyReserve/Home accounting domain, the provisional straight-line schedule
          (rate 0.005) and the TRUE_UP re-rated schedule (rate 0.0075) produce different
          accrued_to_date_cents (3334 vs 5000) for the identical home and identical 2 elapsed months.
        test_recipe:
          setup:
            - "Home h1: sale_price_cents 40000000, closing_date 2026-06-01, STANDARD program; expected_lifetime 200000, monthly accrual 1667"
            - "clock at 2026-08-01T00:00:00Z => 2 monthly anniversaries elapsed (2026-07-01, 2026-08-01)"
            - "sweep has posted 2 provisional ACCRUAL entries of 1667 each (accrued 3334)"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-101", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: WarrantyManager
            - call: "POST /ops/run-sweep"
              as: WarrantyManager
            - call: "GET /warranty-reserves?home_id=${home_id}"
              as: FinanceAdmin
              captures: { res_id: "$.data[0].id", res_v: "$.data[0].version", prov_accrued: "$.data[0].accrued_to_date_cents" }
          trigger:
            - call: "POST /warranty-reserves/${res_id}/adjustments"
              payload: { kind: "TRUE_UP", revised_accrual_rate: 0.0075, expected_reserve_version: "${res_v}" }
              as: FinanceAdmin
            - call: "GET /warranty-reserves/${res_id}"
              as: FinanceAdmin
              captures: { final_accrued: $.data.accrued_to_date_cents, final_expected: $.data.expected_lifetime_accrual_cents }
          assert:
            - "captured prov_accrued == 3334 (2 x round_half_up(200000/120) = 2 x 1667, provisional schedule)"
            - "final_expected == 300000 (round_half_up(40000000 x 0.0075))"
            - "final_accrued == 5000 (2 x round_half_up(300000/120) = 2 x 2500, true-up schedule)"
            - "prov_accrued != final_accrued (3334 != 5000) — identical home and elapsed months, different variant, different result"
      - name: chargeback_provisional_vs_final
        grounds:
          - calculations.chargeback_amount
          - entities.Chargeback.fields.amount_basis
          - state_machines.WorkOrder.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          On the Chargeback/TradePartner cost-recovery domain (different entity domain from the
          reserve instance), the provisional variant (estimate 150000 -> 137500) and the final
          variant (actual 110000 -> 93500) of the same formula produce different payable amounts
          for the same chargeback.
        test_recipe:
          setup:
            - "Home (STANDARD, closing 2026-06-01); approved PLUMBING request reported at the default clock 2026-08-01 (in SYSTEMS term)"
            - "Trade partner tp (PLUMBING); work order wo estimated 150000, defect_responsibility SUBCONTRACTOR, window 2026-08-10 09:00-11:00"
            - "Chargeback cb ISSUED with provisional_amount_cents computed from the estimate"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-102", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "PLUMBING", severity: "STANDARD", description: "Kitchen supply line leak" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
            - call: "POST /trade-partners"
              payload: { company_name: "FlowRight Plumbing", trade: "PLUMBING", contact_email: "dispatch@flowright.example.com" }
              as: WarrantyManager
              captures: { tp_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_request_id: "${sr_id}", trade_partner_id: "${tp_id}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T11:00:00Z", estimated_cost_cents: 150000, defect_responsibility: "SUBCONTRACTOR" }
              as: WarrantyRep
              captures: { wo_id: $.data.id }
            - call: "POST /chargebacks"
              payload: { work_order_id: "${wo_id}" }
              as: WarrantyRep
              captures: { cb_id: $.data.id, cb_prov: $.data.provisional_amount_cents, cb_basis0: $.data.amount_basis }
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_cost_cents: 110000 }
              as: TradePartner
              as_user_id: "${tp_id}"
            - call: "GET /chargebacks/${cb_id}"
              as: WarrantyRep
              captures: { cb_final: $.data.final_amount_cents, cb_basis1: $.data.amount_basis, cb_payable: $.data.payable_amount_cents }
          assert:
            - "cb_prov == 137500 (recoverable 125000 + fee min(12500, 15000)) and cb_basis0 == PROVISIONAL"
            - "cb_final == 93500 (recoverable 85000 + fee 8500) and cb_basis1 == FINAL"
            - "cb_payable == 93500"
            - "cb_prov != cb_final (137500 != 93500) — same chargeback, same formula, different cost basis variant"

  - rule_id: combinatorial_formula
    instances:
      - name: chargeback_cap_and_fee_tier_min_max
        grounds:
          - calculations.chargeback_amount
          - entities.Chargeback.fields.final_amount_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with non-linear interaction — nested max/min over
          (cost, deductible, cap) feeding a fee branch where BOTH min clamps bind:
          cost 2000000 -> capped 500000 (cap binds) and fee min(50000, 15000) = 15000 (fee max binds)
          => total exactly 515000.
        test_recipe:
          setup:
            - "Home (STANDARD, closing 2026-06-01); approved PLUMBING request; trade partner tp"
            - "Work order wo estimated 500000 SUBCONTRACTOR; chargeback cb ISSUED (provisional from estimate)"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-103", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "PLUMBING", severity: "STANDARD", description: "Sewer line failure" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
            - call: "POST /trade-partners"
              payload: { company_name: "FlowRight Plumbing", trade: "PLUMBING", contact_email: "dispatch@flowright.example.com" }
              as: WarrantyManager
              captures: { tp_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_request_id: "${sr_id}", trade_partner_id: "${tp_id}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T11:00:00Z", estimated_cost_cents: 500000, defect_responsibility: "SUBCONTRACTOR" }
              as: WarrantyRep
              captures: { wo_id: $.data.id }
            - call: "POST /chargebacks"
              payload: { work_order_id: "${wo_id}" }
              as: WarrantyRep
              captures: { cb_id: $.data.id, cb_prov: $.data.provisional_amount_cents }
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_cost_cents: 2000000 }
              as: TradePartner
              as_user_id: "${tp_id}"
            - call: "GET /chargebacks/${cb_id}"
              as: WarrantyRep
              captures: { cb_final: $.data.final_amount_cents }
          assert:
            - "cb_prov == 490000 (recoverable 475000 + fee min(47500, 15000) = 15000)"
            - "cb_final == 515000 (recoverable min(1975000, 500000) = 500000 capped, fee min(50000, 15000) = 15000)"
      - name: reserve_accrual_rounding_order
        grounds:
          - calculations.reserve_accrual_schedule
          - entities.ReserveEntry.fields.amount_cents
        distinguishing_aspect: |
          Mode (b) — different mode from the chargeback instance: pinned round-per-month-then-sum
          ordering. 3 elapsed months of the 200000-cent lifetime accrual give 3 x 1667 = 5001,
          whereas the forbidden sum-then-round order gives round_half_up(200000 x 3 / 120) = 5000.
        test_recipe:
          setup:
            - "Home: sale_price_cents 40000000, closing 2026-06-01 (expected lifetime 200000, monthly 1667, month 120 remainder 1627)"
            - "clock advanced to 2026-09-01T00:00:00Z => anniversaries 2026-07-01, 2026-08-01, 2026-09-01 => 3 elapsed months"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-104", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: WarrantyManager
          trigger:
            - call: "POST /ops/run-sweep"
              as: WarrantyManager
              captures: { n_accruals: $.data.accrual_entries_posted }
            - call: "GET /warranty-reserves?home_id=${home_id}"
              as: FinanceAdmin
              captures: { res_id: "$.data[0].id", accrued: "$.data[0].accrued_to_date_cents", month_idx: "$.data[0].last_accrual_month_index" }
            - call: "GET /warranty-reserves/${res_id}/entries?kind=ACCRUAL"
              as: FinanceAdmin
              captures: { first_amount: "$.data[0].amount_cents" }
          assert:
            - "n_accruals == 3"
            - "accrued == 5001 (3 x 1667), NOT 5000 (sum-then-round) — rounding order is per-month"
            - "first_amount == 1667 and every posted ACCRUAL entry has amount_cents == 1667"
            - "month_idx == 3 and a second POST /ops/run-sweep posts 0 additional ACCRUAL entries (idempotent per month)"

  - rule_id: non_linear_state_machine
    instances:
      - name: service_request_denial_dispute_reopen_cycle
        grounds:
          - state_machines.ServiceRequest.DENIED_to_DISPUTED
          - state_machines.ServiceRequest.DISPUTED_to_REOPENED
          - state_machines.ServiceRequest.REOPENED_to_APPROVED
        distinguishing_aspect: |
          Cyclic machine on ServiceRequest: RECEIVED -> DENIED -> DISPUTED -> REOPENED ->
          APPROVED loops back through assessment; a linear pipeline could never re-enter
          assessment after denial. Cycle counters (reopened_count) and re-anchored SLA prove the loop.
        test_recipe:
          setup:
            - "Home (STANDARD, closing 2026-06-01); request sr DRYWALL_PAINT STANDARD reported at default clock 2026-08-01"
            - "sr denied as HOMEOWNER_CAUSED with education packet EDU-CAULK-01; homeowner disputes within the 30-day window; manager overturns"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-201", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "DRYWALL_PAINT", severity: "STANDARD", description: "Hairline drywall crack at stairwell" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/assess"
              payload: { warrantable: false, denial_reason_code: "HOMEOWNER_CAUSED", education_packet_code: "EDU-CAULK-01" }
              as: WarrantyRep
            - call: "POST /service-requests/${sr_id}/dispute"
              payload: { dispute_reason: "Crack is at a tape joint, present since walkthrough" }
              as: Homeowner
              as_user_id: "${ho_id}"
            - call: "POST /service-requests/${sr_id}/resolve-dispute"
              payload: { outcome: "HOMEOWNER_PREVAILS", resolution_notes: "Arbitrator finds workmanship defect" }
              as: WarrantyManager
          trigger:
            - call: "POST /service-requests/${sr_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
            - call: "GET /service-requests/${sr_id}"
              as: WarrantyRep
              captures: { st: $.data.status, tier: $.data.determined_tier, rc: $.data.reopened_count, out: $.data.dispute_outcome }
          assert:
            - "st == APPROVED and tier == WORKMANSHIP (re-assessed after the cycle)"
            - "rc == 1 (the DENIED -> DISPUTED -> REOPENED loop was traversed exactly once)"
            - "out == HOMEOWNER_PREVAILS (dispute history retained through the cycle)"
            - "before the loop the request was DENIED; after the loop it is APPROVED — the machine is cyclic, not linear"
      - name: chargeback_contest_branching_divergent_effects
        grounds:
          - state_machines.Chargeback.CONTESTED_to_UPHELD
          - state_machines.Chargeback.CONTESTED_to_WAIVED
          - state_machines.Chargeback.APPROVED_to_PAID
        distinguishing_aspect: |
          Branching fork-join on Chargeback (different entity from the ServiceRequest cycle):
          from CONTESTED the UPHELD branch leads to payment and a reserve RECOVERY entry,
          while the WAIVED branch zeroes outstanding and posts NO reserve entry — divergent
          side-effect sets per branch.
        test_recipe:
          setup:
            - "Home (STANDARD, closing 2026-06-01, reserve balance 0); two approved PLUMBING requests sr1/sr2; trade partner tp"
            - "wo1 estimated 150000 SUBCONTRACTOR with cb1 ISSUED (provisional 137500); wo2 estimated 110000 SUBCONTRACTOR with cb2 ISSUED (provisional 93500)"
            - "both chargebacks contested by tp within the window"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-202", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "POST /trade-partners"
              payload: { company_name: "FlowRight Plumbing", trade: "PLUMBING", contact_email: "dispatch@flowright.example.com" }
              as: WarrantyManager
              captures: { tp_id: $.data.id }
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "PLUMBING", severity: "STANDARD", description: "Leak under master bath" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { sr1_id: $.data.id }
            - call: "POST /service-requests/${sr1_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
            - call: "POST /work-orders"
              payload: { service_request_id: "${sr1_id}", trade_partner_id: "${tp_id}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T11:00:00Z", estimated_cost_cents: 150000, defect_responsibility: "SUBCONTRACTOR" }
              as: WarrantyRep
              captures: { wo1_id: $.data.id }
            - call: "POST /chargebacks"
              payload: { work_order_id: "${wo1_id}" }
              as: WarrantyRep
              captures: { cb1_id: $.data.id, cb1_prov: $.data.provisional_amount_cents }
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "PLUMBING", severity: "STANDARD", description: "Hose bib drips" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { sr2_id: $.data.id }
            - call: "POST /service-requests/${sr2_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
            - call: "POST /work-orders"
              payload: { service_request_id: "${sr2_id}", trade_partner_id: "${tp_id}", window_start: "2026-08-11T09:00:00Z", window_end: "2026-08-11T11:00:00Z", estimated_cost_cents: 110000, defect_responsibility: "SUBCONTRACTOR" }
              as: WarrantyRep
              captures: { wo2_id: $.data.id }
            - call: "POST /chargebacks"
              payload: { work_order_id: "${wo2_id}" }
              as: WarrantyRep
              captures: { cb2_id: $.data.id }
            - call: "POST /chargebacks/${cb1_id}/contest"
              payload: { contest_reason: "Failure predates our rough-in" }
              as: TradePartner
              as_user_id: "${tp_id}"
            - call: "POST /chargebacks/${cb2_id}/contest"
              payload: { contest_reason: "Freeze damage, homeowner left heat off" }
              as: TradePartner
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /chargebacks/${cb1_id}/resolve"
              payload: { outcome: "UPHELD", resolution_notes: "Photos show solvent-weld failure" }
              as: WarrantyManager
            - call: "POST /chargebacks/${cb1_id}/payments"
              payload: { amount_cents: 137500 }
              as: FinanceAdmin
            - call: "POST /chargebacks/${cb2_id}/resolve"
              payload: { outcome: "WAIVED", resolution_notes: "Goodwill - first-year partner" }
              as: WarrantyManager
            - call: "GET /warranty-reserves?home_id=${home_id}"
              as: FinanceAdmin
              captures: { res_id: "$.data[0].id", res_balance: "$.data[0].balance_cents", res_recovered: "$.data[0].recovered_to_date_cents" }
            - call: "GET /warranty-reserves/${res_id}/entries?kind=RECOVERY"
              as: FinanceAdmin
              captures: { rec_entry_amount: "$.data[0].amount_cents", rec_entry_cb: "$.data[0].chargeback_ref" }
            - call: "GET /chargebacks/${cb2_id}"
              as: WarrantyRep
              captures: { cb2_status: $.data.status, cb2_outstanding: $.data.outstanding_cents }
          assert:
            - "cb1 ends PAID with collected_cents == 137500 (UPHELD branch proceeds to payment)"
            - "res_recovered == 137500 and res_balance == 137500 (RECOVERY entry posted only for the upheld branch)"
            - "rec_entry_amount == 137500 and rec_entry_cb == cb1_id"
            - "cb2_status == WAIVED and cb2_outstanding == 0 — and the entries list contains exactly one RECOVERY entry (waived branch posts nothing)"

  - rule_id: transitive_cascade
    instances:
      - name: work_order_completion_cost_cascade
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_COMPLETED
          - entities.ServiceRequest.fields.actual_cost_cents
          - entities.WarrantyReserve.fields.balance_cents
          - calculations.reserve_trend_alert
        distinguishing_aspect: |
          Depth-3 cascade from POST /work-orders/{id}/complete: work order completion (L1)
          recomputes ServiceRequest.actual_cost_cents (L2), whose cost change posts a reserve
          DRAW entry and recomputes balance_cents (L3), which re-evaluates alert_status —
          each link caused by the previous mutation, not by the original call in parallel.
        test_recipe:
          setup:
            - "Home price 40000000 closing 2026-06-01; clock 2026-08-01; sweep posted 2 accruals (balance 3334, NORMAL)"
            - "Approved PLUMBING request sr; trade partner tp; work order wo estimated 150000 SUBCONTRACTOR; chargeback ISSUED (provisional 137500)"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-301", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: WarrantyManager
            - call: "POST /ops/run-sweep"
              as: WarrantyManager
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "PLUMBING", severity: "STANDARD", description: "Water heater leak" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
            - call: "POST /trade-partners"
              payload: { company_name: "FlowRight Plumbing", trade: "PLUMBING", contact_email: "dispatch@flowright.example.com" }
              as: WarrantyManager
              captures: { tp_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_request_id: "${sr_id}", trade_partner_id: "${tp_id}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T11:00:00Z", estimated_cost_cents: 150000, defect_responsibility: "SUBCONTRACTOR" }
              as: WarrantyRep
              captures: { wo_id: $.data.id }
            - call: "POST /chargebacks"
              payload: { work_order_id: "${wo_id}" }
              as: WarrantyRep
              captures: { cb_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_cost_cents: 110000 }
              as: TradePartner
              as_user_id: "${tp_id}"
            - call: "GET /service-requests/${sr_id}"
              as: WarrantyRep
              captures: { sr_cost: $.data.actual_cost_cents }
            - call: "GET /warranty-reserves?home_id=${home_id}"
              as: FinanceAdmin
              captures: { res_id: "$.data[0].id", res_balance: "$.data[0].balance_cents", res_drawn: "$.data[0].drawn_to_date_cents", res_alert: "$.data[0].alert_status" }
            - call: "GET /warranty-reserves/${res_id}/entries?kind=DRAW"
              as: FinanceAdmin
              captures: { draw_amount: "$.data[0].amount_cents", draw_wo: "$.data[0].work_order_ref" }
            - call: "GET /chargebacks/${cb_id}"
              as: WarrantyRep
              captures: { cb_final: $.data.final_amount_cents, cb_basis: $.data.amount_basis }
          assert:
            - "L1: work order status == COMPLETED with actual_cost_cents == 110000"
            - "L2: sr_cost == 110000 (recomputed from the completed work order)"
            - "L3: draw_amount == -110000 and draw_wo == ${wo_id}; res_drawn == 110000"
            - "L3: res_balance == -106666 (3334 accrual minus 110000 draw) and res_alert == DEPLETED (balance < 0)"
            - "sibling effect: cb_final == 93500 and cb_basis == FINAL"
      - name: chargeback_payment_recovery_cascade
        grounds:
          - state_machines.Chargeback.APPROVED_to_PAID
          - entities.WarrantyReserve.fields.recovered_to_date_cents
          - entities.TradePartner.fields.outstanding_chargeback_cents
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (POST /chargebacks/{id}/payments): the
          payment completing the chargeback (PAID) causes the reserve to post a RECOVERY
          entry and recompute balance/alert — the reserve mutation is caused by the
          chargeback's transition, not directly by the payment request.
        test_recipe:
          setup:
            - "Home price 40000000 closing 2026-06-01 (reserve balance 0, no accruals posted; clock stays at default 2026-08-01)"
            - "Approved PLUMBING request; tp; wo estimated 150000 SUBCONTRACTOR; cb ISSUED 137500 then manager-approved"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
              as: WarrantyManager
              captures: { ho_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${ho_id}", lot_number: "L-302", community_name: "Cedar Ridge", sale_price_cents: 40000000, closing_date: "2026-06-01", warranty_program: "STANDARD" }
              as: WarrantyManager
              captures: { home_id: $.data.id }
            - call: "POST /service-requests"
              payload: { home_id: "${home_id}", item_category: "PLUMBING", severity: "STANDARD", description: "Vanity drain leak" }
              as: Homeowner
              as_user_id: "${ho_id}"
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/assess"
              payload: { warrantable: true }
              as: WarrantyRep
            - call: "POST /trade-partners"
              payload: { company_name: "FlowRight Plumbing", trade: "PLUMBING", contact_email: "dispatch@flowright.example.com" }
              as: WarrantyManager
              captures: { tp_id: $.data.id }
            - call: "POST /work-orders"
              payload: { service_request_id: "${sr_id}", trade_partner_id: "${tp_id}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T11:00:00Z", estimated_cost_cents: 150000, defect_responsibility: "SUBCONTRACTOR" }
              as: WarrantyRep
              captures: { wo_id: $.data.id }
            - call: "POST /chargebacks"
              payload: { work_order_id: "${wo_id}" }
              as: WarrantyRep
              captures: { cb_id: $.data.id }
            - call: "POST /chargebacks/${cb_id}/approve"
              as: WarrantyManager
          trigger:
            - call: "POST /chargebacks/${cb_id}/payments"
              payload: { amount_cents: 137500 }
              as: FinanceAdmin
              captures: { cb_status: $.data.status, cb_outstanding: $.data.outstanding_cents, cb_collected: $.data.collected_cents }
            - call: "GET /warranty-reserves?home_id=${home_id}"
              as: FinanceAdmin
              captures: { res_id: "$.data[0].id", res_balance: "$.data[0].balance_cents", res_recovered: "$.data[0].recovered_to_date_cents" }
            - call: "GET /trade-partners/${tp_id}"
              as: WarrantyManager
              captures: { tp_outstanding: $.data.outstanding_chargeback_cents }
          assert:
            - "L1: cb_status == PAID with cb_collected == 137500 and cb_outstanding == 0"
            - "L2: res_recovered == 137500 and res_balance == 137500 (RECOVERY +137500 posted by the PAID transition)"
            - "L2 side: tp_outstanding == 0 (no remaining open chargebacks)"
            - "reserve alert_status == NORMAL (137500 >= round_half_up(200000 x 0.20) = 40000)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: terminal_chargeback_overpayment_conflict
        grounds:
          - validations[priority=14]
          - validations[priority=29]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: a payment of 999999 on a WAIVED
          (terminal) chargeback violates both ERR_ALREADY_TERMINAL (priority 14) and
          ERR_OVERPAYMENT (priority 29); the state error MUST win.
        test_recipe:
          setup:
            - "Home, approved PLUMBING request, tp, wo estimated 110000 SUBCONTRACTOR, cb ISSUED 93500, contested, then resolved WAIVED (outstanding 0)"
          setup_api_calls:
            - call: "POST /homeowners"
