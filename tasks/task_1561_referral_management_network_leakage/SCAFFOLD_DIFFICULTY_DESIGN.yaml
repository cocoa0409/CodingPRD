  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: no_show_strike_threshold_cascade
        grounds:
          - state_machines.Appointment.SCHEDULED_to_NO_SHOW
          - state_machines.Patient.ACTIVE_to_OUTREACH_REQUIRED
          - calculations.strike_threshold_posture
          - entities.Referral.fields.escalation_flag
        distinguishing_aspect: |
          Trigger: coordinator's mark-no-show. Depth 3: Appointment -> NO_SHOW
          mutates Patient.no_show_strikes (link 1); the strike counter crossing 3
          flips Patient.status to OUTREACH_REQUIRED (link 2, caused by link 1, not
          by the original call); that posture flip sets escalation_flag on the
          patient's other referrals in {ACCEPTED, SCHEDULED} (link 3, caused by
          link 2).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan; specialist S1 (capacity 10, PREFERRED participation); provider PA; patient PT"
            - "R1/R2/R3 accepted, assigned S1, booked 2026-08-01 at 10:00/12:00/14:00 (1h each, buffer-safe); R4 accepted only, still ACCEPTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
