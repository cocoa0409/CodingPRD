  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depth >= 3 and >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: late_review_credit_cascades_to_invoice_cancel
        grounds:
          - state_machines.Submittal.UNDER_REVIEW_to_APPROVED
          - calculations.excusable_delay_credit
          - calculations.additional_service_billing
          - state_machines.AdditionalServiceInvoice.DRAFT_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade triggered by a submittal review (distinct trigger from the
          change-order instance): review APPROVED 97 days late (link 1: Submittal
          credited_delay_days := 97) -> link 2: CaProject.excusable_delay_days
          recomputed to 97, moving horizon_start_date to 2027-01-10 -> link 3: the
          DRAFT invoice recomputes to 0 billable days and auto-transitions to CANCELLED.
        test_recipe:
          setup:
            - "ACTIVE PER_DIEM_PRORATED project (base SCD 2026-09-30, grace 5, excusable 0 -> horizon_start 2026-10-05)."
            - "Submittal created at the 2026-08-01 default clock (due 2026-08-11)."
            - "Clock advanced to 2026-11-05; DRAFT invoice for 2026-10-01..2026-11-30 exists with billable_days 31, amount_cents 3720000, horizon_end_date 2026-11-05."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj C1", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 6000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 4000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/submittals"
              payload: { project_id: "${p_id}", spec_section: "05 12 00", required_on_site_date: "2026-08-25" }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { s_id: $.data.id }
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/additional-service-invoices"
              payload: { project_id: "${p_id}", period_start: "2026-10-01", period_end: "2026-11-30" }
              as: FirmAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-16T09:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /ca/submittals/${s_id}/review"
              payload: { outcome: "APPROVED" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
          assert:
            - "Submittal.${s_id}.credited_delay_days == 97  # 2026-08-11 -> 2026-11-16"
            - "CaProject.${p_id}.excusable_delay_days == 97"
            - "AdditionalServiceInvoice.${inv_id}.horizon_start_date == 2027-01-10  # 2026-09-30 + 97 + 5"
            - "AdditionalServiceInvoice.${inv_id}.billable_days == 0"
            - "AdditionalServiceInvoice.${inv_id}.status == CANCELLED"

      - name: change_order_incorporation_cascades_to_invoice_recompute
        grounds:
          - state_machines.ChangeOrder.OWNER_ACCEPTED_to_INCORPORATED
          - calculations.additional_service_billing
          - concurrency_rules[incorporate-stale-project]
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (change-order incorporation, not a
          review): link 1: CaProject.adjusted_substantial_completion_date += 20 days
          (to 2026-10-20) and version increments; link 2: the DRAFT invoice recomputes
          against the new horizon_start 2026-10-25, shrinking billable_days 31 -> 11
          and amount_cents 3720000 -> 1320000 while remaining DRAFT.
        test_recipe:
          setup:
            - "ACTIVE PER_DIEM_PRORATED project (base SCD 2026-09-30, grace 5, excusable 0)."
            - "Clock 2026-11-05; DRAFT invoice 2026-10-01..2026-11-30 with billable_days 31, amount_cents 3720000."
            - "Time-only change order (net 0, 20 days) OWNER_ACCEPTED; project version captured after owner acceptance."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj C2", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 6000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 4000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/additional-service-invoices"
              payload: { project_id: "${p_id}", period_start: "2026-10-01", period_end: "2026-11-30" }
              as: FirmAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /ca/change-orders"
              payload: { project_id: "${p_id}", title: "Weather extension", net_cost_change_cents: 0, time_extension_days: 20 }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { co_id: $.data.id }
            - call: "POST /ca/change-orders/${co_id}/recommend"
              payload: { recommendation: "ACCEPT" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "POST /ca/change-orders/${co_id}/owner-decision"
              payload: { decision: "ACCEPT" }
              as: Owner
              as_user_id: "user-owner-1"
            - call: "GET /ca/projects/${p_id}"
              as: FirmAdmin
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /ca/change-orders/${co_id}/incorporate"
              payload: { expected_project_version: "${p_v}" }
              as: Owner
              as_user_id: "user-owner-1"
          assert:
            - "ChangeOrder.${co_id}.status == INCORPORATED"
            - "CaProject.${p_id}.adjusted_substantial_completion_date == 2026-10-20"
            - "CaProject.${p_id}.version == ${p_v} + 1"
            - "AdditionalServiceInvoice.${inv_id}.horizon_start_date == 2026-10-25"
            - "AdditionalServiceInvoice.${inv_id}.billable_days == 11"
            - "AdditionalServiceInvoice.${inv_id}.amount_cents == 1320000"
            - "AdditionalServiceInvoice.${inv_id}.status == DRAFT"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: certify_rejected_app_state_beats_fiscal
        grounds:
          - validations[priority=10]
          - validations[priority=25]
          - errors[ERR_PAYMENT_APPLICATION_INVALID_STATE]
          - errors[ERR_CERTIFICATION_EXCEEDS_CONTRACT_BALANCE]
        distinguishing_aspect: |
          Category pair state (priority 10) vs business_fiscal (priority 25): the
          application is REJECTED and its recomputed gross (10000000) would exceed the
          adjusted contract sum (8000000 after a deduct incorporation) — the state
          error ERR_PAYMENT_APPLICATION_INVALID_STATE (409) must win, and the 402
          fiscal error must NOT be returned.
        test_recipe:
          setup:
            - "ACTIVE TIERED_MARGINAL project (sum 10000000, SOV A=6000000/B=4000000) with REPORT_ISSUED verification visit V1."
            - "Application submitted with lines A=6000000, B=4000000 (gross 10000000), then REJECTED."
            - "Deduct change order net -2000000 incorporated; adjusted_contract_sum_cents == 8000000."
          setup_api_calls:
            - call: "POST /ca/projects"
              payload: { name: "Proj PP1", owner_user_id: "user-owner-1", contractor_user_id: "user-contractor-1", original_contract_sum_cents: 10000000, sov_lines: [{ line_code: "A", description: "Concrete", scheduled_value_cents: 6000000 }, { line_code: "B", description: "Metals", scheduled_value_cents: 4000000 }], base_substantial_completion_date: "2026-09-30", daily_extension_rate_cents: 120000, monthly_extension_rate_cents: 3000000, billing_method: "PER_DIEM_PRORATED", retainage_mode: "TIERED_MARGINAL", grace_days: 5 }
              as: FirmAdmin
              captures: { p_id: $.data.id }
            - call: "POST /ca/projects/${p_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /ca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /ca/site-visits"
              payload: { project_id: "${p_id}", visit_date: "2026-08-20", purpose: "PAYMENT_VERIFICATION", performed_by_user_id: "user-arch-2" }
              as: ArchitectCA
              captures: { v1_id: $.data.id }
            - call: "POST /ca/site-visits/${v1_id}/perform"
              payload: {}
              as: ArchitectCA
            - call: "POST /ca/field-reports"
              payload: { site_visit_id: "${v1_id}", issued_by_user_id: "user-arch-lead", conformance_summary: "CONFORMING", nonconforming_work_flag: false }
              as: ArchitectCA
            - call: "POST /ca/payment-applications"
              payload: { project_id: "${p_id}", period_ending_date: "2026-08-31", verification_visit_id: "${v1_id}", lines: [{ sov_line_code: "A", work_completed_this_period_cents: 6000000, stored_materials_cents: 0 }, { sov_line_code: "B", work_completed_this_period_cents: 4000000, stored_materials_cents: 0 }] }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { app_id: $.data.id }
            - call: "POST /ca/payment-applications/${app_id}/reject"
              payload: { reason: "overstated" }
              as: ArchitectCA
              as_user_id: "user-arch-lead"
            - call: "POST /ca/change-orders"
              payload: { project_id: "${p_id}", title: "Scope removal", net_cost_change_cents: -2000000, time_extension_days: 0 }
              as: Contractor
              as_user_id: "user-contractor-1"
              captures: { co_id: $.data.id }
            - call: "POST /ca/change-orders/${co_id}/recommend"
              payload: { recommendation: "ACCEPT" }
