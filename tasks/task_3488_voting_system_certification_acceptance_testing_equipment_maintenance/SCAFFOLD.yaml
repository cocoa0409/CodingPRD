# =============================================================================
# PRD Benchmark Scaffold — Voting System Certification, Acceptance Testing &
# Equipment Maintenance (task_3488)
# =============================================================================
scenario: "Voting System Certification, Acceptance Testing & Equipment Maintenance (Election Systems and Software): voting system certification to federal voluntary guidelines and state-specific requirements with test laboratory campaigns, jurisdiction procurement with acceptance testing, ballot layout configuration and election definition programming, logic and accuracy test support before each election with tabulation verification, equipment maintenance, battery replacement and storage requirements between elections, ballot printing and paper stock compatibility with scanner calibration, software modification approval where any change may require recertification with long lead times, chain of custody, tamper evidence and audit log requirements, post-election audit support and public transparency requests for system documentation"

domain_name: voting-system-certification
api_prefix: /evote

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - version_pinning_on_approval
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: VotingSystem
    parent: null
    common_fields: true
    fields:
      - name: vendor_name
        type: string
        source: input
        description: "Legal name of the election-system vendor (e.g. Election Systems and Software)."
      - name: model_name
        type: string
        source: input
        description: "Product model name of the voting system."
      - name: software_baseline_version
        type: string
        source: input
        description: "Semver-ish baseline string of the certified software image; mutated only by an EFFECTIVE SoftwareModification."
      - name: hardware_class
        type: enum
        source: input
        description: "Device class of the system."
        constraints: "one of {OPTICAL_SCANNER, BALLOT_MARKING_DEVICE, CENTRAL_TABULATOR}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle: REGISTERED on create, auto-FIELDED when the first Certificate becomes ACTIVE, RETIRED via transition."
        default: REGISTERED
        constraints: "one of {REGISTERED, FIELDED, RETIRED}"

  - name: TestLaboratory
    parent: null
    common_fields: true
    fields:
      - name: lab_code
        type: string
        source: input
        description: "Globally unique accreditation code of the test laboratory."
        constraints: "unique across all TestLaboratory rows (ERR_DUPLICATE_LAB_CODE)"
      - name: lab_name
        type: string
        source: input
        description: "Display name of the laboratory."
      - name: accreditation_scope
        type: enum
        source: input
        description: "Which campaign scopes the lab may test."
        constraints: "one of {FEDERAL, STATE, DUAL}"
      - name: max_concurrent_campaigns
        type: integer
        source: input
        description: "Aggregate capacity: maximum number of the lab's campaigns that may be IN_TEST at once."
        default: 3
        constraints: "1 <= value <= 10"
      - name: status
        type: enum
        source: system
        description: "ACCREDITED or SUSPENDED; only ACCREDITED labs may start or certify campaigns."
        default: ACCREDITED
        constraints: "one of {ACCREDITED, SUSPENDED}"

  - name: CertificationCampaign
    parent: null
    common_fields: true
    fields:
      - name: voting_system_id
        type: string
        source: input
        description: "FK -> VotingSystem.id; the system under test."
      - name: lab_id
        type: string
        source: input
        description: "FK -> TestLaboratory.id; the laboratory running the campaign."
      - name: guidelines_baseline
        type: enum
        source: input
        description: "Federal voluntary-guideline baseline the campaign tests against."
        constraints: "one of {VVSG_1_1, VVSG_2_0}"
      - name: state_code
        type: string
        source: input
        description: "Two-letter state code for a STATE-scope campaign; null means a FEDERAL-only campaign."
        default: null
        constraints: "nullable; when present exactly two uppercase letters"
      - name: status
        type: enum
        source: system
        description: "Campaign lifecycle state (see state_machines.CertificationCampaign)."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, IN_TEST, DEFICIENCIES_FILED, CERTIFIED, DENIED, WITHDRAWN}"
      - name: resubmission_count
        type: integer
        source: system
        description: "Number of DEFICIENCIES_FILED -> SUBMITTED resubmission cycles completed."
        default: 0
      - name: open_critical_count
        type: integer
        source: system
        description: "Open CRITICAL deficiencies; mutated by file-deficiencies / resubmit."
        default: 0
      - name: open_major_count
        type: integer
        source: system
        description: "Open MAJOR deficiencies."
        default: 0
      - name: open_minor_count
        type: integer
        source: system
        description: "Open MINOR deficiencies."
        default: 0
      - name: conformity_screen_bp
        type: integer
        source: computed
        description: "LAB_SCREEN variant of campaign_conformity_score, basis points 0..10000, recomputed on every campaign mutation."
        default: 10000
      - name: conformity_final_bp
        type: integer
        source: computed
        description: "FINAL_AUDIT variant of campaign_conformity_score, basis points 0..10000, recomputed on every campaign mutation and re-evaluated fresh at certify time."
        default: 10000
      - name: last_submitted_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the most recent entry into SUBMITTED (creation or resubmission); drives the FINAL_AUDIT aging term."
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of entering CERTIFIED, DENIED or WITHDRAWN; null while active."
        default: null

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - name: voting_system_id
        type: string
        source: system
        description: "FK -> VotingSystem.id; copied from the certifying campaign."
      - name: campaign_id
        type: string
        source: system
        description: "FK -> CertificationCampaign.id; the campaign whose CERTIFIED transition minted this certificate."
      - name: scope
        type: enum
        source: system
        description: "STATE when the campaign carried a state_code, else FEDERAL."
        constraints: "one of {FEDERAL, STATE}"
      - name: state_code
        type: string
        source: system
        description: "Copied from the campaign; null for FEDERAL scope."
        default: null
      - name: guidelines_baseline
        type: enum
        source: system
        description: "Copied from the campaign."
        constraints: "one of {VVSG_1_1, VVSG_2_0}"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the CERTIFIED transition."
      - name: expires_at
        type: datetime
        source: system
        description: "issued_at + CERT_TTL_DAYS (730) days."
      - name: status
        type: enum
        source: system
        description: "ACTIVE, SUSPENDED (reversible), REVOKED or EXPIRED (terminal). EXPIRED is applied by the logical clock sweep when now >= expires_at."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, REVOKED, EXPIRED}"

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the county / jurisdiction."
      - name: state_code
        type: string
        source: input
        description: "Two-letter state code the jurisdiction belongs to."
        constraints: "exactly two uppercase letters"
      - name: budget_total_cents
        type: integer
        source: input
        description: "Total certified-equipment budget in cents; adjusted only via budget-adjustments."
        constraints: ">= 0"
      - name: available_cents
        type: integer
        source: computed
        description: "Unencumbered balance. Invariant: budget_total_cents == available_cents + encumbered_cents + spent_cents."
      - name: encumbered_cents
        type: integer
        source: computed
        description: "Funds reserved by procurements in PLACED, DELIVERED or ACCEPTANCE_TESTING."
      - name: spent_cents
        type: integer
        source: computed
        description: "Funds converted to spend by ACCEPTED procurements."

  - name: ElectionOfficial
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the jurisdiction this official belongs to."
      - name: full_name
        type: string
        source: input
        description: "Official's full name."
      - name: badge_no
        type: string
        source: input
        description: "Badge number, unique within the official's jurisdiction."
        constraints: "unique per jurisdiction_id (ERR_DUPLICATE_BADGE)"
      - name: status
        type: enum
        source: system
        description: "ACTIVE officials may act; INACTIVE officials are refused (ERR_OFFICIAL_INACTIVE)."
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: Procurement
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; buying jurisdiction."
      - name: voting_system_id
        type: string
        source: input
        description: "FK -> VotingSystem.id; system being purchased."
      - name: certificate_id
        type: string
        source: input
        description: "FK -> Certificate.id; the certificate authorizing this purchase."
      - name: certificate_version_pinned
        type: integer
        source: system
        description: "Certificate.version observed at placement; pinned for audit and never re-written."
      - name: quantity
        type: integer
        source: input
        description: "Number of units purchased."
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Price per unit in cents."
        constraints: ">= 0"
      - name: total_price_cents
        type: integer
        source: computed
        description: "quantity * unit_price_cents, computed at placement; encumbered from the jurisdiction budget."
      - name: cert_hold
        type: boolean
        source: system
        description: "Set true by the recertification cascade when the pinned certificate is suspended by a SoftwareModification; blocks ACCEPTED."
        default: false
      - name: status
        type: enum
        source: system
        description: "PLACED -> DELIVERED -> ACCEPTANCE_TESTING -> ACCEPTED | REJECTED; PLACED|DELIVERED -> CANCELLED."
        default: PLACED
        constraints: "one of {PLACED, DELIVERED, ACCEPTANCE_TESTING, ACCEPTED, REJECTED, CANCELLED}"
      - name: status_reason
        type: string
        source: input
        description: "Free-text reason captured on REJECTED / CANCELLED transitions."
        default: null

  - name: AcceptanceTest
    parent: null
    common_fields: false
    fields:
      - name: procurement_id
        type: string
        source: input
        description: "FK -> Procurement.id; the procurement under acceptance testing (path parent)."
      - name: test_type
        type: enum
        source: input
        description: "Which acceptance test battery was run; selects the deficiency weight triple."
        constraints: "one of {HARDWARE_DIAGNOSTIC, BALLOT_SCAN_CALIBRATION, LOGIC_VERIFICATION}"
      - name: critical_defects
        type: integer
        source: input
        description: "Count of critical defects found."
        constraints: ">= 0"
      - name: major_defects
        type: integer
        source: input
        description: "Count of major defects found."
        constraints: ">= 0"
      - name: minor_defects
        type: integer
        source: input
        description: "Count of minor defects found."
        constraints: ">= 0"
      - name: deficiency_index
        type: integer
        source: computed
        description: "acceptance_deficiency_index: min(100, wc*critical + wm*major + wn*minor) with per-test_type weights."
      - name: result
        type: enum
        source: computed
        description: "PASS iff critical_defects == 0 AND deficiency_index <= ACCEPTANCE_INDEX_MAX (20); else FAIL."
        constraints: "one of {PASS, FAIL}"

  - name: ElectionDefinition
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; jurisdiction running the election."
      - name: procurement_id
        type: string
        source: input
        description: "FK -> Procurement.id; the equipment procurement this election is programmed against."
      - name: name
        type: string
        source: input
        description: "Election name (e.g. 2026 General)."
      - name: election_date
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) of election day; must be at least ELECTION_MIN_LEAD_DAYS (30) after the current logical date at creation."
      - name: precinct_count
        type: integer
        source: input
        description: "Number of precincts; drives ballot print estimation."
        constraints: ">= 1"
      - name: ballot_layout
        type: object
        source: input
        description: "Layout payload (contests, choices, geometry) set via PUT layout; null until first layout is stored."
        default: null
      - name: layout_revision
        type: integer
        source: system
        description: "Starts at 0; increments by 1 on every successful PUT layout."
        default: 0
      - name: paper_weight_gsm
        type: integer
        source: input
        description: "Ballot paper weight in gsm; must be within [PAPER_WEIGHT_MIN_GSM=80, PAPER_WEIGHT_MAX_GSM=120]."
        default: null
      - name: paper_thickness_microns
        type: integer
        source: input
        description: "Ballot paper thickness; must be within [PAPER_THICKNESS_MIN_MICRONS=60, PAPER_THICKNESS_MAX_MICRONS=250]."
        default: null
      - name: paper_coating
        type: enum
        source: input
        description: "Paper coating; OPTICAL_SCANNER systems accept only UNCOATED."
        default: null
        constraints: "one of {UNCOATED, COATED}"
      - name: status
        type: enum
        source: system
        description: "DRAFT -> PROGRAMMED -> LA_PASSED -> LOCKED -> CANVASSING -> CLOSED; PROGRAMMED|LA_PASSED -> DRAFT revert; DRAFT|PROGRAMMED -> CANCELLED."
        default: DRAFT
        constraints: "one of {DRAFT, PROGRAMMED, LA_PASSED, LOCKED, CANVASSING, CLOSED, CANCELLED}"
      - name: status_reason
        type: string
        source: input
        description: "Reason captured on revert / cancel transitions."
        default: null

  - name: LogicAccuracyTest
    parent: null
    common_fields: true
    fields:
      - name: election_definition_id
        type: string
        source: input
        description: "FK -> ElectionDefinition.id; the election definition under test (path parent)."
      - name: conducted_by
        type: string
        source: system
        description: "FK -> ElectionOfficial.id; set from X-User-ID of the creating official."
      - name: certified_by
        type: string
        source: system
        description: "FK -> ElectionOfficial.id; set on CERTIFIED transition; MUST differ from conducted_by (segregation of duties)."
        default: null
      - name: expected_tallies
        type: object
        source: input
        description: "Map contest_id -> expected integer vote total."
      - name: scanned_tallies
        type: object
        source: input
        description: "Map contest_id -> scanned integer vote total; key set MUST equal expected_tallies key set."
      - name: total_expected
        type: integer
        source: computed
        description: "Sum of expected_tallies values; must be >= 1."
      - name: total_discrepancy
        type: integer
        source: computed
        description: "Sum over contests of |expected - scanned|."
      - name: discrepancy_bp
        type: integer
        source: computed
        description: "floor(10000 * total_discrepancy / total_expected), display only."
      - name: result
        type: enum
        source: computed
        description: "PASS iff 10000 * total_discrepancy <= LA_DISCREPANCY_MAX_BP (50) * total_expected (pure integer comparison, no rounding); else FAIL."
        constraints: "one of {PASS, FAIL}"
      - name: status
        type: enum
        source: system
        description: "CONDUCTED -> CERTIFIED | CHALLENGED; CHALLENGED -> CONDUCTED (reopen with new scanned_tallies)."
        default: CONDUCTED
        constraints: "one of {CONDUCTED, CERTIFIED, CHALLENGED}"

  - name: EquipmentUnit
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; owning jurisdiction."
      - name: voting_system_id
        type: string
        source: input
        description: "FK -> VotingSystem.id; the FIELDED system this unit belongs to."
      - name: serial_number
        type: string
        source: input
        description: "Globally unique device serial."
        constraints: "unique across all EquipmentUnit rows (ERR_DUPLICATE_SERIAL)"
      - name: operational_status
        type: enum
        source: system
        description: "Parallel dimension 1: IN_STORAGE (initial), IN_SERVICE, IN_MAINTENANCE (only via work-order start), QUARANTINED (via audit cascade or CertificationAuthority), RETIRED."
        default: IN_STORAGE
        constraints: "one of {IN_STORAGE, IN_SERVICE, IN_MAINTENANCE, QUARANTINED, RETIRED}"
      - name: custody_status
        type: enum
        source: system
        description: "Parallel dimension 2, evolves independently of operational_status: SECURED (initial), UNSEALED (set by a custody transfer with seal_intact=false; cleared only by completing a RESEAL work order)."
        default: SECURED
        constraints: "one of {SECURED, UNSEALED}"
      - name: current_custodian_id
        type: string
        source: system
        description: "FK -> ElectionOfficial.id; exactly one current custodian at all times; set from initial_custodian_id at creation and moved atomically by custody transfers."
      - name: battery_cycles
        type: integer
        source: system
        description: "Accumulated charge cycles via record-usage; deploy requires battery_cycles < BATTERY_CYCLE_MAX (500); reset to 0 by completing a BATTERY_REPLACEMENT work order."
        default: 0
      - name: storage_excursion_count
        type: integer
        source: system
        description: "Number of store transitions recorded outside the allowed environment band; reset to 0 by completing a PREVENTIVE work order."
        default: 0
      - name: pre_maintenance_status
        type: enum
        source: system
        description: "Operational status captured when a work order moves the unit into IN_MAINTENANCE; restored on COMPLETED/ABORTED; null otherwise."
        default: null
        constraints: "nullable; one of {IN_STORAGE, IN_SERVICE}"
      - name: calibrated_paper_weight_gsm
        type: integer
        source: system
        description: "Paper weight the scanner was last calibrated to by a CALIBRATION work order; null until then."
        default: null
      - name: calibrated_paper_thickness_microns
        type: integer
        source: system
        description: "Paper thickness the scanner was last calibrated to; null until a CALIBRATION work order completes."
        default: null

  - name: MaintenanceWorkOrder
    parent: null
    common_fields: true
    fields:
      - name: equipment_unit_id
        type: string
        source: input
        description: "FK -> EquipmentUnit.id; the unit under maintenance."
      - name: work_type
        type: enum
        source: input
        description: "Kind of work; selects completion side effects."
        constraints: "one of {PREVENTIVE, BATTERY_REPLACEMENT, REPAIR, CALIBRATION, RESEAL}"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Window start (inclusive). Half-open overlap rule: another open work order on the same unit conflicts iff [scheduled_start, scheduled_end) intersects."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Window end (exclusive); MUST be strictly after scheduled_start."
      - name: calibration_paper_weight_gsm
        type: integer
        source: input
        description: "Required iff work_type == CALIBRATION; must lie within [80, 120]."
        default: null
      - name: calibration_paper_thickness_microns
        type: integer
        source: input
        description: "Required iff work_type == CALIBRATION; must lie within [60, 250]."
        default: null
      - name: resolution_note
        type: string
        source: input
        description: "Free-text note captured on COMPLETED / ABORTED."
        default: null
      - name: status
        type: enum
        source: system
        description: "SCHEDULED -> IN_PROGRESS -> COMPLETED | ABORTED; SCHEDULED -> ABORTED."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, COMPLETED, ABORTED}"

  - name: CustodyTransfer
    parent: null
    common_fields: false
    fields:
      - name: equipment_unit_id
        type: string
        source: input
        description: "FK -> EquipmentUnit.id; unit changing hands (path parent)."
      - name: from_official_id
        type: string
        source: system
        description: "FK -> ElectionOfficial.id; set from X-User-ID; MUST equal the unit's current_custodian_id."
      - name: to_official_id
        type: string
        source: input
        description: "FK -> ElectionOfficial.id; receiving official of the same jurisdiction; MUST differ from from_official_id."
      - name: seal_number
        type: string
        source: input
        description: "Tamper-evident seal identifier; unique per equipment unit across all its transfers (ERR_SEAL_NUMBER_REUSED)."
      - name: seal_intact
        type: boolean
        source: input
        description: "False records broken tamper evidence and flips the unit's custody_status to UNSEALED."
      - name: transferred_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the transfer."

  - name: SoftwareModification
    parent: null
    common_fields: true
    fields:
      - name: voting_system_id
        type: string
        source: input
        description: "FK -> VotingSystem.id; system being modified."
      - name: description
        type: string
        source: input
        description: "Free-text description of the change."
      - name: component_codes
        type: array
        source: input
        description: "Non-empty array of affected component codes."
        constraints: "each one of {BALLOT_LAYOUT_ENGINE, TABULATION_FIRMWARE, ELECTION_MANAGEMENT_UI, AUDIT_LOG_SERVICE, SECURITY_MODULE}"
      - name: classification
        type: enum
        source: system
        description: "Set by CertificationAuthority classification: DE_MINIMIS when transitioned to DE_MINIMIS_APPROVED, RECERTIFICATION_REQUIRED when transitioned to RECERTIFICATION_PENDING; null while PROPOSED."
        default: null
        constraints: "nullable; one of {DE_MINIMIS, RECERTIFICATION_REQUIRED}"
      - name: lead_time_days
        type: integer
        source: computed
        description: "recertification_lead_time_days, computed at classification time from PRE-classification certificate states (see calculations); null while PROPOSED."
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of creation."
      - name: classified_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of classification; null until classified."
        default: null
      - name: effective_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of EFFECTIVE; null until then."
        default: null
      - name: new_baseline_version
        type: string
        source: input
        description: "Software baseline string applied to the VotingSystem when the modification goes EFFECTIVE."
        default: null
      - name: status
        type: enum
        source: system
        description: "PROPOSED -> DE_MINIMIS_APPROVED | RECERTIFICATION_PENDING -> EFFECTIVE; PROPOSED|DE_MINIMIS_APPROVED|RECERTIFICATION_PENDING -> REJECTED; PROPOSED -> WITHDRAWN."
        default: PROPOSED
        constraints: "one of {PROPOSED, DE_MINIMIS_APPROVED, RECERTIFICATION_PENDING, EFFECTIVE, REJECTED, WITHDRAWN}"

  - name: PostElectionAudit
    parent: null
    common_fields: true
    fields:
      - name: election_definition_id
        type: string
        source: input
        description: "FK -> ElectionDefinition.id; the CANVASSING election under audit."
      - name: audit_type
        type: enum
        source: input
        description: "Audit methodology."
        constraints: "one of {RISK_LIMITING, COMPLIANCE, FULL_RECOUNT}"
      - name: critical_findings
        type: integer
        source: system
        description: "Set by the FINDINGS_FILED transition payload; 0 before filing."
        default: 0
      - name: major_findings
        type: integer
        source: system
        description: "Set by the FINDINGS_FILED transition payload."
        default: 0
      - name: minor_findings
        type: integer
        source: system
        description: "Set by the FINDINGS_FILED transition payload."
        default: 0
      - name: report_public
        type: boolean
        source: system
        description: "Set true by the publish endpoint; gates inclusion in the public documentation read."
        default: false
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of publish; null until published."
        default: null
      - name: status
        type: enum
        source: system
        description: "INITIATED -> FINDINGS_FILED -> CLOSED_CONFIRMED | CLOSED_ESCALATED."
        default: INITIATED
        constraints: "one of {INITIATED, FINDINGS_FILED, CLOSED_CONFIRMED, CLOSED_ESCALATED}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: VotingSystem
    initial_state: REGISTERED
    terminal_states: [RETIRED]
    transitions:
      - from: REGISTERED
        to: FIELDED
        trigger: "system event: a CertificationCampaign for this system reaches CERTIFIED (first ACTIVE certificate)"
        actor: system
        preconditions:
          - "campaign certify succeeds for a campaign with voting_system_id == this system"
        side_effects:
          - "VotingSystem.status := FIELDED; VotingSystem.version += 1; VotingSystem.updated_at := now"
      - from: FIELDED
        to: RETIRED
        trigger: "POST /evote/voting-systems/{id}/transitions {to_state: RETIRED}"
        actor: PlatformAdmin
        preconditions:
          - "no EquipmentUnit with voting_system_id == this system has operational_status != RETIRED (else ERR_INVALID_STATE)"
        side_effects:
          - "VotingSystem.version += 1"
        note: "REGISTERED -> RETIRED is NOT allowed; the system must be FIELDED first."

  - entity: TestLaboratory
    initial_state: ACCREDITED
    terminal_states: []
    transitions:
      - from: ACCREDITED
        to: SUSPENDED
        trigger: "POST /evote/test-laboratories/{id}/transitions {to_state: SUSPENDED}"
        actor: CertificationAuthority
        preconditions: []
        side_effects:
          - "TestLaboratory.version += 1"
      - from: SUSPENDED
        to: ACCREDITED
        trigger: "POST /evote/test-laboratories/{id}/transitions {to_state: ACCREDITED}"
        actor: CertificationAuthority
        preconditions: []
        side_effects:
          - "TestLaboratory.version += 1"

  - entity: CertificationCampaign
    initial_state: SUBMITTED
    terminal_states: [CERTIFIED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: IN_TEST
        trigger: "POST /evote/certification-campaigns/{id}/transitions {to_state: IN_TEST}"
        actor: LabAgent
        preconditions:
          - "X-User-ID == campaign.lab_id (else ERR_FORBIDDEN_OWNERSHIP)"
          - "lab.status == ACCREDITED (else ERR_LAB_SUSPENDED)"
          - "count of the lab's campaigns currently IN_TEST < lab.max_concurrent_campaigns (else ERR_LAB_CAPACITY_EXCEEDED) — aggregate capacity semantics"
        side_effects:
          - "CertificationCampaign.version += 1"
      - from: IN_TEST
        to: DEFICIENCIES_FILED
        trigger: "POST /evote/certification-campaigns/{id}/transitions {to_state: DEFICIENCIES_FILED, critical_count, major_count, minor_count}"
        actor: LabAgent
        preconditions:
          - "X-User-ID == campaign.lab_id (else ERR_FORBIDDEN_OWNERSHIP)"
          - "critical_count + major_count + minor_count >= 1 and each >= 0 (else ERR_DEFICIENCY_COUNTS_INVALID)"
        side_effects:
          - "open_critical_count += critical_count; open_major_count += major_count; open_minor_count += minor_count"
          - "recompute conformity_screen_bp and conformity_final_bp per campaign_conformity_score"
          - "CertificationCampaign.version += 1"
      - from: DEFICIENCIES_FILED
        to: SUBMITTED
        trigger: "POST /evote/certification-campaigns/{id}/transitions {to_state: SUBMITTED, resolved_critical, resolved_major, resolved_minor}"
        actor: VendorRep
        preconditions:
          - "resolved_critical == open_critical_count AND resolved_major == open_major_count AND resolved_minor == open_minor_count (all-or-nothing resolution; else ERR_DEFICIENCY_COUNTS_INVALID)"
        side_effects:
          - "open_*_count := 0; resubmission_count += 1; last_submitted_at := now"
          - "recompute conformity_screen_bp and conformity_final_bp"
          - "CertificationCampaign.version += 1"
        note: "This is the resubmission loop; the cycle may repeat without bound."
      - from: IN_TEST
        to: CERTIFIED
        trigger: "POST /evote/certification-campaigns/{id}/transitions {to_state: CERTIFIED}"
        actor: CertificationAuthority
        preconditions:
          - "lab.status == ACCREDITED (else ERR_LAB_SUSPENDED)"
          - "open_critical_count == 0 AND open_major_count == 0 AND open_minor_count == 0"
          - "freshly evaluated FINAL_AUDIT conformity >= CONFORMITY_PASS_BP (8000) at current logical clock (else ERR_CONFORMITY_BELOW_THRESHOLD)"
        side_effects:
          - "create Certificate { voting_system_id, campaign_id, scope := STATE if campaign.state_code else FEDERAL, state_code := campaign.state_code, guidelines_baseline := campaign.guidelines_baseline, issued_at := now, expires_at := now + 730 days, status := ACTIVE }"
          - "if VotingSystem.status == REGISTERED then VotingSystem.status := FIELDED and VotingSystem.version += 1"
          - "completed_at := now; recompute both conformity scores; CertificationCampaign.version += 1"
      - from: DEFICIENCIES_FILED
        to: DENIED
        trigger: "POST /evote/certification-campaigns/{id}/transitions {to_state: DENIED}"
        actor: CertificationAuthority
        preconditions:
          - "open_critical_count >= 1 (else ERR_DEFICIENCY_COUNTS_INVALID)"
        side_effects:
          - "completed_at := now; CertificationCampaign.version += 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /evote/certification-campaigns/{id}/transitions {to_state: WITHDRAWN}"
        actor: VendorRep
        preconditions: []
        side_effects:
          - "completed_at := now; CertificationCampaign.version += 1"
      - from: DEFICIENCIES_FILED
        to: WITHDRAWN
        trigger: "POST /evote/certification-campaigns/{id}/transitions {to_state: WITHDRAWN}"
        actor: VendorRep
        preconditions: []
        side_effects:
          - "completed_at := now; CertificationCampaign.version += 1"

  - entity: Certificate
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /evote/certificates/{id}/transitions {to_state: SUSPENDED, reason} OR system cascade from a RECERTIFICATION_REQUIRED SoftwareModification classification"
        actor: CertificationAuthority
        preconditions: []
        side_effects:
          - "Certificate.version += 1"
        note: "Only the SoftwareModification-driven suspension fires the cascade into procurements and election definitions (see state_machines.SoftwareModification). Manual suspension only blocks future guards."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /evote/certificates/{id}/transitions {to_state: ACTIVE} OR system cascade from a SoftwareModification reaching EFFECTIVE"
        actor: CertificationAuthority
        preconditions:
          - "now < expires_at (else ERR_CERTIFICATE_EXPIRED)"
        side_effects:
          - "Certificate.version += 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /evote/certificates/{id}/transitions {to_state: REVOKED, reason}"
        actor: CertificationAuthority
        preconditions: []
        side_effects:
          - "every Procurement with certificate_id == this certificate and status in {PLACED, DELIVERED, ACCEPTANCE_TESTING} transitions to CANCELLED (status_reason := 'CERTIFICATE_REVOKED')"
          - "each such cancellation releases the encumbrance: Jurisdiction.encumbered_cents -= total_price_cents, Jurisdiction.available_cents += total_price_cents, Jurisdiction.version += 1"
          - "Certificate.version += 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /evote/certificates/{id}/transitions {to_state: REVOKED, reason}"
        actor: CertificationAuthority
        preconditions: []
        side_effects:
          - "same procurement cancellation cascade as ACTIVE -> REVOKED"
          - "Certificate.version += 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event: a certificate read (GET single or list) observes now >= expires_at; the read flips status to EXPIRED and bumps version"
        actor: system
        preconditions:
          - "now >= expires_at"
        side_effects:
          - "Certificate.version += 1"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system event: a certificate read (GET single or list) observes now >= expires_at; the read flips status to EXPIRED and bumps version"
        actor: system
        preconditions:
          - "now >= expires_at"
        side_effects:
          - "Certificate.version += 1"

  - entity: Procurement
    initial_state: PLACED
    terminal_states: [ACCEPTED, REJECTED, CANCELLED]
    transitions:
      - from: PLACED
        to: DELIVERED
        trigger: "POST /evote/procurements/{id}/transitions {to_state: DELIVERED}"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to procurement.jurisdiction_id (else ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "Procurement.version += 1"
      - from: DELIVERED
        to: ACCEPTANCE_TESTING
        trigger: "POST /evote/procurements/{id}/transitions {to_state: ACCEPTANCE_TESTING}"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to procurement.jurisdiction_id"
          - "Certificate referenced by certificate_id has status == ACTIVE at this moment (else ERR_CERTIFICATE_NOT_ACTIVE) — cross-entity state dependency"
        side_effects:
          - "Procurement.version += 1"
      - from: ACCEPTANCE_TESTING
        to: ACCEPTED
        trigger: "POST /evote/procurements/{id}/transitions {to_state: ACCEPTED}"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to procurement.jurisdiction_id"
          - "cert_hold == false AND Certificate.status == ACTIVE (else ERR_CERTIFICATE_NOT_ACTIVE)"
          - "at least one AcceptanceTest with test_type == HARDWARE_DIAGNOSTIC and at least one with test_type == BALLOT_SCAN_CALIBRATION exist for this procurement (else ERR_ACCEPTANCE_TESTS_INCOMPLETE)"
          - "no AcceptanceTest for this procurement has result == FAIL (else ERR_ACCEPTANCE_TEST_FAILURES_PRESENT)"
        side_effects:
          - "Jurisdiction.encumbered_cents -= total_price_cents; Jurisdiction.spent_cents += total_price_cents; Jurisdiction.version += 1"
          - "Procurement.version += 1"
      - from: ACCEPTANCE_TESTING
        to: REJECTED
        trigger: "POST /evote/procurements/{id}/transitions {to_state: REJECTED, reason}"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to procurement.jurisdiction_id"
          - "reason is non-empty (else ERR_INVALID_REQUEST)"
        side_effects:
          - "Jurisdiction.encumbered_cents -= total_price_cents; Jurisdiction.available_cents += total_price_cents; Jurisdiction.version += 1"
          - "Procurement.version += 1"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /evote/procurements/{id}/transitions {to_state: CANCELLED} OR certificate-revocation cascade"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to procurement.jurisdiction_id (not evaluated on the cascade path)"
        side_effects:
          - "Jurisdiction.encumbered_cents -= total_price_cents; Jurisdiction.available_cents += total_price_cents; Jurisdiction.version += 1"
          - "Procurement.version += 1"
      - from: DELIVERED
        to: CANCELLED
        trigger: "POST /evote/procurements/{id}/transitions {to_state: CANCELLED} OR certificate-revocation cascade"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to procurement.jurisdiction_id (not evaluated on the cascade path)"
        side_effects:
          - "Jurisdiction.encumbered_cents -= total_price_cents; Jurisdiction.available_cents += total_price_cents; Jurisdiction.version += 1"
          - "Procurement.version += 1"

  - entity: ElectionDefinition
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PROGRAMMED
        trigger: "POST /evote/election-definitions/{id}/transitions {to_state: PROGRAMMED}"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to election_definition.jurisdiction_id"
          - "ballot_layout is not null AND paper_weight_gsm, paper_thickness_microns, paper_coating are all non-null (else ERR_LAYOUT_REQUIRED)"
        side_effects:
          - "ElectionDefinition.version += 1"
      - from: PROGRAMMED
        to: LA_PASSED
        trigger: "POST /evote/election-definitions/{id}/transitions {to_state: LA_PASSED}"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to election_definition.jurisdiction_id"
          - "exists a LogicAccuracyTest with election_definition_id == this definition, status == CERTIFIED and result == PASS (else ERR_LA_TEST_NOT_CERTIFIED) — cross-entity state dependency"
        side_effects:
          - "ElectionDefinition.version += 1"
      - from: PROGRAMMED
        to: DRAFT
        trigger: "POST /evote/election-definitions/{id}/transitions {to_state: DRAFT, reason} OR recertification cascade"
        actor: ElectionOfficial
        preconditions:
          - "reason is non-empty on the manual path (else ERR_INVALID_REQUEST)"
        side_effects:
          - "ElectionDefinition.version += 1"
        note: "Revert loop for reprogramming; also the cascade target when the pinned certificate is suspended by a software modification."
      - from: LA_PASSED
        to: DRAFT
        trigger: "POST /evote/election-definitions/{id}/transitions {to_state: DRAFT, reason} OR recertification cascade"
        actor: ElectionOfficial
        preconditions:
          - "reason is non-empty on the manual path (else ERR_INVALID_REQUEST)"
        side_effects:
          - "ElectionDefinition.version += 1"
      - from: LA_PASSED
        to: LOCKED
        trigger: "POST /evote/election-definitions/{id}/transitions {to_state: LOCKED}"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to election_definition.jurisdiction_id"
          - "procurement referenced by procurement_id has status == ACCEPTED (else ERR_PROCUREMENT_NOT_ACCEPTED) — cross-entity state dependency"
          - "Certificate referenced by procurement.certificate_id has status == ACTIVE (else ERR_CERTIFICATE_NOT_ACTIVE)"
          - "election_date - current logical date >= ELECTION_FREEZE_DAYS (14) days (else ERR_ELECTION_FREEZE_WINDOW)"
        side_effects:
          - "ElectionDefinition.version += 1"
      - from: LOCKED
        to: CANVASSING
        trigger: "POST /evote/election-definitions/{id}/transitions {to_state: CANVASSING}"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to election_definition.jurisdiction_id"
          - "current logical date >= election_date (else ERR_ELECTION_NOT_HELD)"
        side_effects:
          - "ElectionDefinition.version += 1"
      - from: CANVASSING
        to: CLOSED
        trigger: "POST /evote/election-definitions/{id}/transitions {to_state: CLOSED}"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to election_definition.jurisdiction_id"
          - "every PostElectionAudit with election_definition_id == this definition has status in {CLOSED_CONFIRMED, CLOSED_ESCALATED} (else ERR_AUDIT_OPEN)"
        side_effects:
          - "ElectionDefinition.version += 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /evote/election-definitions/{id}/transitions {to_state: CANCELLED, reason}"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to election_definition.jurisdiction_id"
        side_effects:
          - "ElectionDefinition.version += 1"
      - from: PROGRAMMED
        to: CANCELLED
        trigger: "POST /evote/election-definitions/{id}/transitions {to_state: CANCELLED, reason}"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to election_definition.jurisdiction_id"
        side_effects:
          - "ElectionDefinition.version += 1"

  - entity: LogicAccuracyTest
    initial_state: CONDUCTED
    terminal_states: [CERTIFIED]
    transitions:
      - from: CONDUCTED
        to: CERTIFIED
        trigger: "POST /evote/logic-accuracy-tests/{id}/transitions {to_state: CERTIFIED}"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to the election definition's jurisdiction"
          - "X-User-ID != conducted_by (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "certified_by := X-User-ID; LogicAccuracyTest.version += 1"
      - from: CONDUCTED
        to: CHALLENGED
        trigger: "POST /evote/logic-accuracy-tests/{id}/transitions {to_state: CHALLENGED} OR recertification cascade"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to the election definition's jurisdiction"
          - "X-User-ID != conducted_by on the manual path (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "LogicAccuracyTest.version += 1"
      - from: CHALLENGED
        to: CONDUCTED
        trigger: "POST /evote/logic-accuracy-tests/{id}/transitions {to_state: CONDUCTED, scanned_tallies}"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to the election definition's jurisdiction"
          - "scanned_tallies present with key set equal to expected_tallies (else ERR_INVALID_TALLIES)"
        side_effects:
          - "recompute total_discrepancy, discrepancy_bp and result from the new scanned_tallies"
          - "certified_by := null"
          - "LogicAccuracyTest.version += 1"
        note: "Retest loop: a challenged test re-enters CONDUCTED with fresh tallies and may be certified later."

  - entity: EquipmentUnit
    initial_state: "operational_status=IN_STORAGE, custody_status=SECURED (two parallel dimensions)"
    terminal_states: [RETIRED]
    transitions:
      - from: IN_STORAGE
        to: IN_SERVICE
        trigger: "POST /evote/equipment-units/{id}/transitions {to_state: IN_SERVICE}"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to unit.jurisdiction_id"
          - "custody_status == SECURED (else ERR_UNIT_UNSEALED) — business_safety"
          - "battery_cycles < BATTERY_CYCLE_MAX (500); exactly 500 is rejected (else ERR_BATTERY_CYCLE_LIMIT) — boundary"
          - "unit's VotingSystem.status != RETIRED (else ERR_SYSTEM_RETIRED)"
        side_effects:
          - "EquipmentUnit.version += 1"
        note: "operational dimension; custody_status is unchanged by this transition (parallel dimensions evolve independently)."
      - from: IN_SERVICE
        to: IN_STORAGE
        trigger: "POST /evote/equipment-units/{id}/transitions {to_state: IN_STORAGE, storage_temperature_c, storage_humidity_pct}"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to unit.jurisdiction_id"
          - "storage_temperature_c and storage_humidity_pct present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "if storage_temperature_c not in [STORAGE_TEMP_MIN_C=10, STORAGE_TEMP_MAX_C=35] or storage_humidity_pct not in [STORAGE_HUMIDITY_MIN_PCT=20, STORAGE_HUMIDITY_MAX_PCT=70] then storage_excursion_count += 1 (the transition still succeeds)"
          - "EquipmentUnit.version += 1"
      - from: IN_SERVICE
        to: IN_MAINTENANCE
        trigger: "system: a MaintenanceWorkOrder for this unit transitions SCHEDULED -> IN_PROGRESS"
        actor: system
        preconditions: []
        side_effects:
          - "pre_maintenance_status := IN_SERVICE; EquipmentUnit.version += 1"
      - from: IN_STORAGE
        to: IN_MAINTENANCE
        trigger: "system: a MaintenanceWorkOrder for this unit transitions SCHEDULED -> IN_PROGRESS"
        actor: system
        preconditions: []
        side_effects:
          - "pre_maintenance_status := IN_STORAGE; EquipmentUnit.version += 1"
      - from: IN_MAINTENANCE
        to: IN_SERVICE
        trigger: "system: the unit's IN_PROGRESS work order completes or aborts and pre_maintenance_status == IN_SERVICE"
        actor: system
        preconditions: []
        side_effects:
          - "pre_maintenance_status := null; EquipmentUnit.version += 1"
        note: "Direct transition via the transitions endpoint is forbidden (ERR_INVALID_STATE); IN_MAINTENANCE is entered and exited only through work orders."
      - from: IN_MAINTENANCE
        to: IN_STORAGE
        trigger: "system: the unit's IN_PROGRESS work order completes or aborts and pre_maintenance_status == IN_STORAGE"
        actor: system
        preconditions: []
        side_effects:
          - "pre_maintenance_status := null; EquipmentUnit.version += 1"
      - from: IN_SERVICE
        to: QUARANTINED
        trigger: "POST /evote/equipment-units/{id}/transitions {to_state: QUARANTINED} by CertificationAuthority OR post-election-audit escalation cascade"
        actor: CertificationAuthority
        preconditions: []
        side_effects:
          - "every MaintenanceWorkOrder of this unit with status in {SCHEDULED, IN_PROGRESS} transitions to ABORTED (an IN_PROGRESS abort leaves operational_status QUARANTINED and clears pre_maintenance_status without restoring)"
          - "EquipmentUnit.version += 1"
      - from: IN_STORAGE
        to: QUARANTINED
        trigger: "POST /evote/equipment-units/{id}/transitions {to_state: QUARANTINED} by CertificationAuthority OR audit escalation cascade"
        actor: CertificationAuthority
        preconditions: []
        side_effects:
          - "open work orders aborted as above"
          - "EquipmentUnit.version += 1"
      - from: IN_MAINTENANCE
        to: QUARANTINED
        trigger: "audit escalation cascade only"
        actor: system
        preconditions: []
        side_effects:
          - "open work orders aborted as above (the IN_PROGRESS work order abort does not restore the pre-maintenance status)"
          - "EquipmentUnit.version += 1"
      - from: QUARANTINED
        to: IN_STORAGE
        trigger: "POST /evote/equipment-units/{id}/transitions {to_state: IN_STORAGE} by CertificationAuthority"
        actor: CertificationAuthority
        preconditions: []
        side_effects:
          - "EquipmentUnit.version += 1"
      - from: IN_SERVICE
        to: RETIRED
        trigger: "POST /evote/equipment-units/{id}/transitions {to_state: RETIRED}"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to unit.jurisdiction_id"
          - "custody_status == SECURED (else ERR_UNIT_UNSEALED)"
        side_effects:
          - "every MaintenanceWorkOrder of this unit with status in {SCHEDULED, IN_PROGRESS} transitions to ABORTED"
          - "EquipmentUnit.version += 1"
      - from: IN_STORAGE
        to: RETIRED
        trigger: "POST /evote/equipment-units/{id}/transitions {to_state: RETIRED}"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to unit.jurisdiction_id"
          - "custody_status == SECURED (else ERR_UNIT_UNSEALED)"
        side_effects:
          - "open work orders aborted as above"
          - "EquipmentUnit.version += 1"
      - from: SECURED
        to: UNSEALED
        trigger: "system: a CustodyTransfer for this unit is recorded with seal_intact == false"
        actor: system
        preconditions: []
        side_effects:
          - "EquipmentUnit.version += 1"
        note: "custody dimension; operational_status is unchanged (parallel dimensions)."
      - from: UNSEALED
        to: SECURED
        trigger: "system: a RESEAL MaintenanceWorkOrder for this unit transitions IN_PROGRESS -> COMPLETED"
        actor: system
        preconditions: []
        side_effects:
          - "EquipmentUnit.version += 1"

  - entity: MaintenanceWorkOrder
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /evote/maintenance-work-orders/{id}/transitions {to_state: IN_PROGRESS}"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to the unit's jurisdiction"
          - "unit.operational_status in {IN_SERVICE, IN_STORAGE} (else ERR_INVALID_STATE)"
        side_effects:
          - "unit.pre_maintenance_status := unit.operational_status; unit.operational_status := IN_MAINTENANCE; unit.version += 1"
          - "MaintenanceWorkOrder.version += 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /evote/maintenance-work-orders/{id}/transitions {to_state: COMPLETED, resolution_note}"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to the unit's jurisdiction"
          - "if work_type == RESEAL then unit.custody_status == UNSEALED (else ERR_INVALID_STATE)"
        side_effects:
          - "work_type == BATTERY_REPLACEMENT: unit.battery_cycles := 0"
          - "work_type == PREVENTIVE: unit.storage_excursion_count := 0"
          - "work_type == RESEAL: unit.custody_status := SECURED"
          - "work_type == CALIBRATION: unit.calibrated_paper_weight_gsm := calibration_paper_weight_gsm; unit.calibrated_paper_thickness_microns := calibration_paper_thickness_microns"
          - "unit.operational_status := unit.pre_maintenance_status; unit.pre_maintenance_status := null; unit.version += 1"
          - "MaintenanceWorkOrder.version += 1"
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /evote/maintenance-work-orders/{id}/transitions {to_state: ABORTED} OR unit quarantine/retire cascade"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to the unit's jurisdiction (not evaluated on the cascade path)"
        side_effects:
          - "no work-type effects are applied"
          - "if the unit is not being quarantined: unit.operational_status := unit.pre_maintenance_status; in all cases unit.pre_maintenance_status := null; unit.version += 1"
          - "MaintenanceWorkOrder.version += 1"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /evote/maintenance-work-orders/{id}/transitions {to_state: ABORTED} OR unit quarantine/retire cascade"
        actor: ElectionOfficial
        preconditions:
          - "acting official belongs to the unit's jurisdiction (not evaluated on the cascade path)"
        side_effects:
          - "MaintenanceWorkOrder.version += 1"

  - entity: SoftwareModification
    initial_state: PROPOSED
    terminal_states: [EFFECTIVE, REJECTED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: DE_MINIMIS_APPROVED
        trigger: "POST /evote/software-modifications/{id}/transitions {to_state: DE_MINIMIS_APPROVED}"
        actor: CertificationAuthority
        preconditions: []
        side_effects:
          - "classification := DE_MINIMIS; classified_at := now"
          - "lead_time_days := recertification_lead_time_days evaluated against PRE-classification state (step order pinned in the calculation)"
          - "SoftwareModification.version += 1"
      - from: PROPOSED
        to: RECERTIFICATION_PENDING
        trigger: "POST /evote/software-modifications/{id}/transitions {to_state: RECERTIFICATION_PENDING}"
        actor: CertificationAuthority
        preconditions: []
        side_effects:
          - "classification := RECERTIFICATION_REQUIRED; classified_at := now"
          - "lead_time_days := recertification_lead_time_days evaluated against PRE-classification state (BEFORE the cascade below mutates any certificate)"
          - "CASCADE hop 1: every Certificate with voting_system_id == this system and status == ACTIVE transitions to SUSPENDED (version += 1 each)"
          - "CASCADE hop 2: every ElectionDefinition whose procurement pins one of those certificates (procurement.certificate_id) and whose status is in {PROGRAMMED, LA_PASSED} reverts to DRAFT (status_reason := 'CERTIFICATE_SUSPENDED', version += 1 each); every Procurement with certificate_id among those certificates and status in {DELIVERED, ACCEPTANCE_TESTING} sets cert_hold := true (version += 1 each)"
          - "CASCADE hop 3: every LogicAccuracyTest whose election_definition_id is one of the reverted definitions and whose status == CONDUCTED transitions to CHALLENGED (version += 1 each)"
          - "SoftwareModification.version += 1"
      - from: DE_MINIMIS_APPROVED
        to: EFFECTIVE
        trigger: "POST /evote/software-modifications/{id}/transitions {to_state: EFFECTIVE, new_baseline_version}"
        actor: VendorRep
        preconditions:
          - "new_baseline_version present (else ERR_INVALID_REQUEST)"
          - "now >= classified_at + lead_time_days days (else ERR_LEAD_TIME_NOT_ELAPSED)"
        side_effects:
          - "VotingSystem.software_baseline_version := new_baseline_version; VotingSystem.version += 1"
          - "effective_at := now; SoftwareModification.version += 1"
      - from: RECERTIFICATION_PENDING
        to: EFFECTIVE
        trigger: "POST /evote/software-modifications/{id}/transitions {to_state: EFFECTIVE, new_baseline_version}"
        actor: VendorRep
        preconditions:
          - "new_baseline_version present (else ERR_INVALID_REQUEST)"
          - "now >= classified_at + lead_time_days days (else ERR_LEAD_TIME_NOT_ELAPSED)"
          - "exists a CertificationCampaign with voting_system_id == this system, status == CERTIFIED and completed_at > this modification's submitted_at (else ERR_RECERTIFICATION_CAMPAIGN_REQUIRED)"
        side_effects:
          - "VotingSystem.software_baseline_version := new_baseline_version; VotingSystem.version += 1"
          - "compensation: every Certificate of this system in SUSPENDED transitions back to ACTIVE (version += 1 each) and every Procurement of this system with cert_hold == true clears cert_hold (version += 1 each)"
          - "effective_at := now; SoftwareModification.version += 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /evote/software-modifications/{id}/transitions {to_state: REJECTED}"
        actor: CertificationAuthority
        preconditions: []
        side_effects:
          - "SoftwareModification.version += 1"
      - from: DE_MINIMIS_APPROVED
        to: REJECTED
        trigger: "POST /evote/software-modifications/{id}/transitions {to_state: REJECTED}"
        actor: CertificationAuthority
        preconditions: []
        side_effects:
          - "SoftwareModification.version += 1"
      - from: RECERTIFICATION_PENDING
        to: REJECTED
        trigger: "POST /evote/software-modifications/{id}/transitions {to_state: REJECTED}"
        actor: CertificationAuthority
        preconditions: []
        side_effects:
          - "compensation: Certificates of this system that are SUSPENDED remain SUSPENDED (rejection does not auto-reinstate); no procurement changes"
          - "SoftwareModification.version += 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /evote/software-modifications/{id}/transitions {to_state: WITHDRAWN}"
        actor: VendorRep
        preconditions: []
        side_effects:
          - "SoftwareModification.version += 1"

  - entity: PostElectionAudit
    initial_state: INITIATED
    terminal_states: [CLOSED_CONFIRMED, CLOSED_ESCALATED]
    transitions:
      - from: INITIATED
        to: FINDINGS_FILED
        trigger: "POST /evote/post-election-audits/{id}/transitions {to_state: FINDINGS_FILED, critical_findings, major_findings, minor_findings}"
        actor: Auditor
        preconditions:
          - "critical_findings, major_findings, minor_findings present and each >= 0 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "sets the three findings counters; PostElectionAudit.version += 1"
      - from: FINDINGS_FILED
        to: CLOSED_CONFIRMED
        trigger: "POST /evote/post-election-audits/{id}/transitions {to_state: CLOSED_CONFIRMED}"
        actor: Auditor
        preconditions: []
        side_effects:
          - "PostElectionAudit.version += 1"
      - from: FINDINGS_FILED
        to: CLOSED_ESCALATED
        trigger: "POST /evote/post-election-audits/{id}/transitions {to_state: CLOSED_ESCALATED}"
        actor: Auditor
        preconditions:
          - "critical_findings >= 1 (else ERR_ESCALATION_REQUIRES_CRITICAL)"
        side_effects:
          - "CASCADE hop 1: every EquipmentUnit with jurisdiction_id == the audit's election definition's jurisdiction and voting_system_id == that definition's procurement's system and operational_status in {IN_SERVICE, IN_STORAGE, IN_MAINTENANCE} transitions to QUARANTINED (version += 1 each)"
          - "CASCADE hop 2: every MaintenanceWorkOrder of each quarantined unit with status in {SCHEDULED, IN_PROGRESS} transitions to ABORTED (an IN_PROGRESS abort leaves the unit QUARANTINED and clears pre_maintenance_status)"
          - "PostElectionAudit.version += 1"

  - entity: ElectionOfficial
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /evote/officials/{id}/transitions {to_state: INACTIVE}"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "ElectionOfficial.version += 1"
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /evote/officials/{id}/transitions {to_state: ACTIVE}"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "ElectionOfficial.version += 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: occ-election-definition-layout
    parent_entity: ElectionDefinition
    write_endpoint: "PUT /evote/election-definitions/{id}/layout"
    occ_field: expected_election_definition_version
    description: |
      Storing a new ballot layout against an ElectionDefinition whose version
      has advanced since the client last read it is rejected. Each stored
      layout legitimately supersedes the prior layout content (layout_revision
      increments), so a writer holding a stale base version must re-read
      rather than silently overwrite another writer's layout.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: occ-voting-system-modification-create
    parent_entity: VotingSystem
    write_endpoint: "POST /evote/software-modifications"
    occ_field: expected_voting_system_version
    description: |
      Creating a SoftwareModification against a VotingSystem whose version has
      advanced since the client last read it is rejected. Multiple modification
      proposals against the same system are individually legitimate, so the
      stale-baseline proposal is rejected purely on the version check rather
      than on any state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: campaign_conformity_score
    trigger: "recomputed on every CertificationCampaign mutation (file-deficiencies, resubmit) and evaluated fresh at certify time against the current logical clock"
    algorithm: weighted_scoring
    formula: |
      LAB_SCREEN (forward-looking variant; stored as conformity_screen_bp):
        score = 10000 - 1200*open_critical_count - 300*open_major_count
                      - 75*open_minor_count - 250*resubmission_count
        score = max(0, score)
      FINAL_AUDIT (chronological audit variant; stored as conformity_final_bp):
        days_open = floor((now - last_submitted_at) / 86400 seconds)
        score = 10000 - 1500*open_critical_count - 250*open_major_count
                      - 50*open_minor_count - 400*resubmission_count
                      - 10*floor(days_open / 7)
        score = max(0, score)
      Both variants return basis points in [0, 10000].
    input_set: "the single CertificationCampaign row (its open deficiency counters, resubmission_count, last_submitted_at) and the logical clock"
    constants:
      SCREEN_CRITICAL_WEIGHT: 1200
      SCREEN_MAJOR_WEIGHT: 300
      SCREEN_MINOR_WEIGHT: 75
      SCREEN_RESUBMISSION_PENALTY: 250
      FINAL_CRITICAL_WEIGHT: 1500
      FINAL_MAJOR_WEIGHT: 250
      FINAL_MINOR_WEIGHT: 50
      FINAL_RESUBMISSION_PENALTY: 400
      FINAL_AGING_BP_PER_WEEK: 10
      CONFORMITY_PASS_BP: 8000
    precision: "integer basis points; all arithmetic exact integer math"
    variants:
      - name: LAB_SCREEN
        when: "stored screening view shown on campaign reads; NOT used for the certify gate"
        difference: "weights critical deficiencies lower (1200 vs 1500) and resubmissions lower (250 vs 400), and ignores calendar aging entirely"
      - name: FINAL_AUDIT
        when: "evaluated fresh at the CERTIFIED transition; the only score that gates certification"
        difference: "harsher critical/resubmission weights plus a chronological aging term of 10 bp per full week since last_submitted_at, so identical counter states score lower as time passes"
  - name: fleet_readiness
    trigger: "GET /evote/election-definitions/{id}/readiness"
    algorithm: forward_looking
    formula: |
      Let U = EquipmentUnit rows with jurisdiction_id == definition.jurisdiction_id
        AND voting_system_id == definition.procurement.voting_system_id.
      OPTIMISTIC variant (forward-looking, projected availability):
        ready if operational_status in {IN_SERVICE, IN_STORAGE}
          OR (operational_status == IN_MAINTENANCE AND exists a MaintenanceWorkOrder
              for the unit with status in {SCHEDULED, IN_PROGRESS}
              and scheduled_end <= definition.election_date end-of-day)
      CONSERVATIVE variant:
        ready iff operational_status == IN_SERVICE AND custody_status == SECURED
          AND battery_cycles < BATTERY_CYCLE_MAX (500) AND storage_excursion_count == 0
      Output: { unit_count: |U|, optimistic_ready_count, conservative_ready_count }.
    input_set: "EquipmentUnit rows of the definition's jurisdiction and voting system, any custody_status, plus their open work orders"
    constants:
      BATTERY_CYCLE_MAX: 500
    precision: "integer counts"
    variants:
      - name: OPTIMISTIC
        when: "planner's projection"
        difference: "counts stored units and in-maintenance units projected to finish before election day; ignores battery, custody and storage-excursion state"
      - name: CONSERVATIVE
        when: "certification-grade readiness"
        difference: "counts only units already IN_SERVICE with SECURED custody, battery under the 500-cycle limit and zero recorded storage excursions"
  - name: acceptance_deficiency_index
    trigger: "POST /evote/procurements/{id}/acceptance-tests (at record creation)"
    algorithm: weighted_scoring
    formula: |
      Weights (wc, wm, wn) selected by test_type:
        HARDWARE_DIAGNOSTIC:     (25, 8, 2)
        BALLOT_SCAN_CALIBRATION: (30, 10, 3)
        LOGIC_VERIFICATION:      (40, 12, 4)
      deficiency_index = min(100, wc*critical_defects + wm*major_defects + wn*minor_defects)
      result = PASS iff critical_defects == 0 AND deficiency_index <= ACCEPTANCE_INDEX_MAX
      else FAIL.
    input_set: "the single AcceptanceTest row's defect counts and test_type"
    constants:
      ACCEPTANCE_INDEX_MAX: 20
      W_HARDWARE: [25, 8, 2]
      W_CALIBRATION: [30, 10, 3]
      W_LOGIC: [40, 12, 4]
    precision: "integer index in [0, 100]; exact integer math"
    variants: []
  - name: ballot_print_cost
    trigger: "GET /evote/election-definitions/{id}/print-estimate?ballots_per_precinct=N"
    algorithm: tiered_pricing
    formula: |
      PINNED EVALUATION ORDER (order matters — do not rearrange):
        1. reams_per_precinct = ceil(ballots_per_precinct / REAM_SHEETS)
           -- the ceil is applied PER PRECINCT, before any aggregation.
        2. total_reams = reams_per_precinct * precinct_count
        3. tier_price_cents selected on the AGGREGATE total_reams:
             total_reams <= 100            -> 4200
             101 <= total_reams <= 500     -> 3900
             total_reams > 500             -> 3500
        4. total_cost_cents = total_reams * tier_price_cents
      The alternative orderings (ceil after summing ballots; tier chosen per
      precinct) are explicitly wrong and produce different totals.
    input_set: "the ElectionDefinition's precinct_count and the request's ballots_per_precinct (integer >= 1)"
    constants:
      REAM_SHEETS: 500
      TIER1_MAX_REAMS: 100
      TIER1_PRICE_CENTS: 4200
      TIER2_MAX_REAMS: 500
      TIER2_PRICE_CENTS: 3900
      TIER3_PRICE_CENTS: 3500
    precision: "integer cents; ceil division exact"
    variants: []

  - name: recertification_lead_time_days
    trigger: "SoftwareModification classification transitions (PROPOSED -> DE_MINIMIS_APPROVED | RECERTIFICATION_PENDING)"
    algorithm: threshold
    formula: |
      CIRCULAR-LOOKING DEPENDENCY, RESOLVED BY PINNED EVALUATION ORDER.
      The classification cascade suspends this system's ACTIVE certificates,
      but the lead time MUST be computed from the state BEFORE the cascade.
      Mandatory order inside the classify transition:
        step 1 (evaluate, pre-cascade):
          lead = MOD_BASE_LEAD_DAYS                       # 30
          if component_codes intersects SCOPE_TOUCHING_COMPONENTS
                              = {TABULATION_FIRMWARE, BALLOT_LAYOUT_ENGINE}:
              lead += MOD_SCOPE_TOUCHING_ADD_DAYS         # 60
          if exists a Certificate with voting_system_id == system
               AND scope == FEDERAL AND status in {ACTIVE, SUSPENDED}
               evaluated BEFORE any suspension fires:
              lead += MOD_FEDERAL_CERT_ADD_DAYS           # 45
        step 2: classification := ..., classified_at := now, lead_time_days := lead
        step 3: fire the certificate-suspension cascade
      Apply gate: to_state EFFECTIVE requires now >= classified_at + lead_time_days days.
    input_set: "the SoftwareModification's component_codes and the pre-cascade Certificate rows of its voting system"
    constants:
      MOD_BASE_LEAD_DAYS: 30
      MOD_SCOPE_TOUCHING_ADD_DAYS: 60
      MOD_FEDERAL_CERT_ADD_DAYS: 45
    precision: "integer days"
    variants: []
  - name: la_tabulation_verification
    trigger: "POST /evote/election-definitions/{id}/la-tests and the CHALLENGED -> CONDUCTED reopen transition"
    algorithm: threshold
    formula: |
      Validate first (else ERR_INVALID_TALLIES):
        keys(expected_tallies) == keys(scanned_tallies)
        every value is an integer >= 0
        total_expected = sum(expected_tallies.values()) >= 1
      total_discrepancy = sum over contests c of |expected[c] - scanned[c]|
      discrepancy_bp = floor(10000 * total_discrepancy / total_expected)   # display only
      result = PASS iff 10000 * total_discrepancy <= 50 * total_expected   # exact integer comparison
      else FAIL. The pass/fail decision NEVER uses the rounded discrepancy_bp.
    input_set: "the test's expected_tallies and scanned_tallies maps"
    constants:
      LA_DISCREPANCY_MAX_BP: 50
    precision: "integer; boundary exact: discrepancy*10000 == 50*total_expected PASSES; one unit above FAILS"
    variants: []
  - name: jurisdiction_budget_ledger
    trigger: "procurement placement, cancel, reject, accept, certificate-revocation cascade, and budget-adjustments"
    algorithm: waterfall_allocation
    formula: |
      INVARIANT (conserved quantity): at every observable instant,
        Jurisdiction.budget_total_cents
          == available_cents + encumbered_cents + spent_cents
      place procurement (total_price_cents = T):
        require T <= available_cents else ERR_BUDGET_EXCEEDED
        available_cents -= T; encumbered_cents += T
      cancel / reject / revoke-cascade (from PLACED|DELIVERED|ACCEPTANCE_TESTING):
        encumbered_cents -= T; available_cents += T      # compensating release
      accept:
        encumbered_cents -= T; spent_cents += T
      budget adjustment (delta_cents = d, may be negative):
        require available_cents + d >= 0 else ERR_BUDGET_ADJUSTMENT_INVALID
        budget_total_cents += d; available_cents += d
      A place followed by its cancel MUST restore the exact pre-place pair
      (available_cents, encumbered_cents) — zero drift.
    input_set: "the Jurisdiction row and the Procurement rows referencing it"
    constants: {}
    precision: "integer cents"
    variants: []
  - name: custody_conservation
    trigger: "POST /evote/equipment-units/{id}/custody-transfers"
    algorithm: constraint_propagation
    formula: |
      INVARIANT (conserved quantity): every non-deleted EquipmentUnit has
        exactly one current_custodian_id at all times, and a jurisdiction's
        unit count is unchanged by transfers (transfers are intra-jurisdiction
        only).
      transfer rules:
        from_official_id := X-User-ID; require from == unit.current_custodian_id
          (else ERR_FORBIDDEN_OWNERSHIP)
        require to_official_id != from_official_id (else ERR_SELF_TRANSFER)
        require to_official.status == ACTIVE (else ERR_OFFICIAL_INACTIVE)
        require to_official.jurisdiction_id == unit.jurisdiction_id
          (else ERR_OFFICIAL_JURISDICTION_MISMATCH)
        require seal_number unused on prior transfers of this unit
          (else ERR_SEAL_NUMBER_REUSED)
      effects: unit.current_custodian_id := to_official_id (atomic move);
        if seal_intact == false then unit.custody_status := UNSEALED.
      A transfer A->B followed by its compensating transfer B->A (both with
      seal_intact == true) MUST restore current_custodian_id == A and leave
      custody_status == SECURED throughout — zero drift.
    input_set: "the EquipmentUnit row, its CustodyTransfer history, and the two ElectionOfficial rows"
    constants: {}
    precision: "identity conservation; no arithmetic"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role. Missing or unknown -> ERR_UNAUTHENTICATED."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The declared role is allowed on this endpoint per the endpoint's roles list, AND — for */transitions endpoints — the role is the declared actor of the requested transition (transition-level RBAC) -> else ERR_UNAUTHORIZED."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path identifiers resolve left-to-right (parent before child) -> first missing segment ERR_NOT_FOUND."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 4
    category: existence
    check: "Request body is well-formed: required fields present, no undeclared fields, enum values in range, types match, integer bounds respected (quantity >= 1, counts >= 0, scheduled_end strictly after scheduled_start, max_concurrent_campaigns in [1,10]) -> else ERR_INVALID_REQUEST."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 5
    category: existence
    check: "Body-referenced resources exist: voting_system_id (ERR_SYSTEM_NOT_FOUND), lab_id (ERR_LAB_NOT_FOUND), certificate_id (ERR_CERTIFICATE_NOT_FOUND), jurisdiction_id in a body (ERR_JURISDICTION_NOT_FOUND), to_official_id / initial_custodian_id (ERR_OFFICIAL_NOT_FOUND), procurement_id in a body (ERR_PROCUREMENT_NOT_FOUND), election_definition_id in a body (ERR_ELECTION_DEFINITION_NOT_FOUND), equipment_unit_id in a body (ERR_UNIT_NOT_FOUND)."
    error_id: ERR_SYSTEM_NOT_FOUND
    http_status: 404
    applies_to: "creation endpoints with body foreign keys"
  - priority: 6
    category: auth
    check: "Entity-backed ownership: LabAgent X-User-ID must equal the campaign's lab_id; ElectionOfficial's jurisdiction_id must equal the target resource's jurisdiction (unit/procurement/election-definition custody and mutation); custody-transfer creator must be the unit's current custodian -> else ERR_FORBIDDEN_OWNERSHIP."
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "role-scoped mutation endpoints"
  - priority: 7
    category: auth
    check: "Segregation of duties: L&A test CERTIFIED/CHALLENGED transitions require X-User-ID != conducted_by -> else ERR_SEGREGATION_OF_DUTIES."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /evote/logic-accuracy-tests/{id}/transitions"
  - priority: 8
    category: state
    check: "Target resource's own state machine permits the requested transition from its current state -> else ERR_INVALID_STATE. Terminal rows reject every further transition. to_state values that name a valid state unreachable from the current state also fail here; a to_state that is not a state of the machine at all fails at priority 4 as ERR_INVALID_REQUEST."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all */transitions endpoints"
  - priority: 9
    category: state
    check: "OCC precondition: expected_election_definition_version == ElectionDefinition.version (layout PUT); expected_voting_system_version == VotingSystem.version (modification create) -> else ERR_STALE_VERSION."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /evote/election-definitions/{id}/layout; POST /evote/software-modifications"
  - priority: 10
    category: state
    check: "Custody/work-order specific state gates: transfer or deploy or work-order create against a QUARANTINED unit -> ERR_UNIT_QUARANTINED; direct to_state IN_MAINTENANCE on a unit -> ERR_INVALID_STATE; RESEAL completion while custody SECURED -> ERR_INVALID_STATE."
    error_id: ERR_UNIT_QUARANTINED
    http_status: 409
    applies_to: "equipment-unit transitions, custody-transfers, work-order create"
  - priority: 11
    category: business_safety
    check: "Tamper and battery safety: deploy or retire requires custody_status == SECURED (else ERR_UNIT_UNSEALED); deploy requires battery_cycles < 500 with exactly 500 rejected (else ERR_BATTERY_CYCLE_LIMIT)."
    error_id: ERR_UNIT_UNSEALED
    http_status: 422
    applies_to: "POST /evote/equipment-units/{id}/transitions"
  - priority: 12
    category: business_safety
    check: "Battery ceiling: battery_cycles >= BATTERY_CYCLE_MAX (500) blocks deploy (ERR_BATTERY_CYCLE_LIMIT)."
    error_id: ERR_BATTERY_CYCLE_LIMIT
    http_status: 422
    applies_to: "POST /evote/equipment-units/{id}/transitions"
  - priority: 13
    category: business_constraint
    check: "Uniqueness: lab_code (ERR_DUPLICATE_LAB_CODE), serial_number (ERR_DUPLICATE_SERIAL), badge_no per jurisdiction (ERR_DUPLICATE_BADGE), seal_number per unit (ERR_SEAL_NUMBER_REUSED) — all 409."
    error_id: ERR_DUPLICATE_LAB_CODE
    http_status: 409
    applies_to: "creation endpoints and custody transfers"
  - priority: 14
    category: business_constraint
    check: "Single-active aggregates: at most one campaign per system in {SUBMITTED, IN_TEST, DEFICIENCIES_FILED} (ERR_CAMPAIGN_ALREADY_ACTIVE); at most one audit per election definition in {INITIATED, FINDINGS_FILED} (ERR_AUDIT_ALREADY_ACTIVE); lab aggregate capacity (ERR_LAB_CAPACITY_EXCEEDED); half-open work-order window overlap per unit (ERR_WORK_ORDER_OVERLAP)."
    error_id: ERR_CAMPAIGN_ALREADY_ACTIVE
    http_status: 409
    applies_to: "campaign create, audit create, campaign begin-testing, work-order create"
  - priority: 15
    category: business_constraint
    check: "Deficiency arithmetic: file-deficiencies requires total >= 1; resubmit requires resolved_* exactly equal to open_* (all-or-nothing); deny requires open_critical_count >= 1 -> else ERR_DEFICIENCY_COUNTS_INVALID."
    error_id: ERR_DEFICIENCY_COUNTS_INVALID
    http_status: 422
    applies_to: "POST /evote/certification-campaigns/{id}/transitions"
  - priority: 16
    category: business_constraint
    check: "Paper/scanner compatibility: paper_weight_gsm in [80,120] and paper_thickness_microns in [60,250]; for OPTICAL_SCANNER systems paper_coating must be UNCOATED; CALIBRATION work orders carry both calibration fields in range -> else ERR_PAPER_INCOMPATIBLE."
    error_id: ERR_PAPER_INCOMPATIBLE
    http_status: 422
    applies_to: "PUT /evote/election-definitions/{id}/layout; POST /evote/maintenance-work-orders"
  - priority: 17
    category: business_constraint
    check: "Misc constraint: self-transfer (ERR_SELF_TRANSFER); program without layout (ERR_LAYOUT_REQUIRED); mark-la-passed without a CERTIFIED PASS L&A test (ERR_LA_TEST_NOT_CERTIFIED); close with a non-terminal audit (ERR_AUDIT_OPEN); malformed tallies / key mismatch / zero total (ERR_INVALID_TALLIES); accept with missing required test types (ERR_ACCEPTANCE_TESTS_INCOMPLETE) or any FAIL record (ERR_ACCEPTANCE_TEST_FAILURES_PRESENT)."
    error_id: ERR_SELF_TRANSFER
    http_status: 422
    applies_to: "various"
  - priority: 18
    category: business_temporal
    check: "Election calendar: election_date >= today + 30 days at creation (ERR_ELECTION_DATE_INVALID); lock requires election_date - today >= 14 days (ERR_ELECTION_FREEZE_WINDOW); canvass requires today >= election_date (ERR_ELECTION_NOT_HELD); certificate reinstate requires now < expires_at (ERR_CERTIFICATE_EXPIRED); modification EFFECTIVE requires now >= classified_at + lead_time_days (ERR_LEAD_TIME_NOT_ELAPSED)."
    error_id: ERR_ELECTION_DATE_INVALID
    http_status: 422
    applies_to: "election-definition create/transitions; certificate transitions; modification transitions"
  - priority: 19
    category: business_referential
    check: "Referenced-entity state and scope: certificate must be ACTIVE for acceptance-start / accept / lock (ERR_CERTIFICATE_NOT_ACTIVE); certificate system must equal procurement system (ERR_CERTIFICATE_SYSTEM_MISMATCH); certificate scope must cover the jurisdiction's state (FEDERAL covers all; STATE must match state_code) (ERR_CERTIFICATE_SCOPE_MISMATCH); lab must be ACCREDITED for campaign create/begin/certify (ERR_LAB_SUSPENDED); lab accreditation_scope must cover the campaign scope (ERR_LAB_SCOPE_MISMATCH); system must not be RETIRED for campaigns/mods/units/deploy (ERR_SYSTEM_RETIRED); unit create requires system FIELDED (ERR_SYSTEM_NOT_FIELDED); officials must be ACTIVE and same-jurisdiction (ERR_OFFICIAL_INACTIVE / ERR_OFFICIAL_JURISDICTION_MISMATCH); ED create requires procurement in {ACCEPTANCE_TESTING, ACCEPTED} and lock requires ACCEPTED (ERR_PROCUREMENT_NOT_ACCEPTED); certify requires FINAL_AUDIT >= 8000 (ERR_CONFORMITY_BELOW_THRESHOLD); RECERT apply requires a newer CERTIFIED campaign (ERR_RECERTIFICATION_CAMPAIGN_REQUIRED); escalate requires critical_findings >= 1 (ERR_ESCALATION_REQUIRES_CRITICAL)."
    error_id: ERR_CERTIFICATE_NOT_ACTIVE
    http_status: 422
    applies_to: "procurement create/transitions; election-definition create/transitions; campaign create/transitions; modification transitions; unit create/transitions; custody transfers; audit transitions"
  - priority: 20
    category: business_fiscal
    check: "Fiscal last: procurement total_price_cents <= jurisdiction.available_cents (ERR_BUDGET_EXCEEDED); budget adjustment must not drive available_cents negative (ERR_BUDGET_ADJUSTMENT_INVALID)."
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /evote/procurements; POST /evote/jurisdictions/{id}/budget-adjustments"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- platform / test-driving ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO8601 UTC). The server MUST boot with its logical clock fixed at 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time; every date rule (certificate expiry, election windows, lead times, conformity aging) reads this clock. Setting the clock also applies the certificate auto-expiry sweep."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["moves the logical clock only; certificate EXPIRED transitions are applied lazily on certificate reads (GET single or list), never at clock-set time"]

  # --- VotingSystem ---
  - method: POST
    path: "/evote/voting-systems"
    description: "Register a new voting system (status REGISTERED)."
    roles: [PlatformAdmin]
    code: 201
    input: [vendor_name, model_name, software_baseline_version, hardware_class]
    output: VotingSystem
    side_effects: []
  - method: GET
    path: "/evote/voting-systems/{id}"
    description: "Read one voting system."
    roles: &all_roles [PlatformAdmin, CertificationAuthority, VendorRep, LabAgent, ElectionOfficial, Auditor, PublicRequester]
    code: 200
    input: []
    output: VotingSystem
    side_effects: []
  - method: POST
    path: "/evote/voting-systems/{id}/transitions"
    description: "State transitions for a voting system; only to_state=RETIRED from FIELDED is exposed here."
    roles: [PlatformAdmin]
    code: 200
    input: [to_state]
    output: VotingSystem
    side_effects: ["increments VotingSystem.version by 1"]

  # --- TestLaboratory ---
  - method: POST
    path: "/evote/test-laboratories"
    description: "Accredit a test laboratory."
    roles: [PlatformAdmin]
    code: 201
    input: [lab_code, lab_name, accreditation_scope, "max_concurrent_campaigns?"]
    output: TestLaboratory
    side_effects: []
  - method: GET
    path: "/evote/test-laboratories/{id}"
    description: "Read one test laboratory."
    roles: *all_roles
    code: 200
    input: []
    output: TestLaboratory
    side_effects: []
  - method: POST
    path: "/evote/test-laboratories/{id}/transitions"
    description: "Suspend or reinstate a laboratory (to_state in {SUSPENDED, ACCREDITED})."
    roles: [CertificationAuthority]
    code: 200
    input: [to_state]
    output: TestLaboratory
    side_effects: ["increments TestLaboratory.version by 1"]

  # --- CertificationCampaign ---
  - method: POST
    path: "/evote/certification-campaigns"
    description: "Vendor submits a system for a certification campaign at a laboratory. Guards: lab ACCREDITED, lab scope covers campaign scope (state_code present -> STATE|DUAL, absent -> FEDERAL|DUAL), system not RETIRED, no other active campaign for the same system."
    roles: [VendorRep]
    code: 201
    input: [voting_system_id, lab_id, guidelines_baseline, "state_code?"]
    output: CertificationCampaign
    side_effects: ["last_submitted_at := now; conformity scores initialized to 10000"]
  - method: GET
    path: "/evote/certification-campaigns"
    description: "List campaigns with optional filters."
    roles: *all_roles
    code: 200
    input: ["voting_system_id?", "lab_id?", "status?", "limit?", "offset?"]
    output: CertificationCampaign[]
    side_effects: []
  - method: GET
    path: "/evote/certification-campaigns/{id}"
    description: "Read one campaign (includes both conformity score variants)."
    roles: *all_roles
    code: 200
    input: []
    output: CertificationCampaign
    side_effects: []
  - method: POST
    path: "/evote/certification-campaigns/{id}/transitions"
    description: "Campaign lifecycle: IN_TEST (LabAgent), DEFICIENCIES_FILED (LabAgent, requires critical_count/major_count/minor_count), SUBMITTED resubmission (VendorRep, requires resolved_*), CERTIFIED / DENIED (CertificationAuthority), WITHDRAWN (VendorRep)."
    roles: [LabAgent, VendorRep, CertificationAuthority]
    code: 200
    input: [to_state, "critical_count?", "major_count?", "minor_count?", "resolved_critical?", "resolved_major?", "resolved_minor?"]
    output: CertificationCampaign
    side_effects: ["increments CertificationCampaign.version by 1", "CERTIFIED mints the Certificate and may auto-FIELD the VotingSystem", "deficiency mutations recompute both conformity score variants"]

  # --- Certificate ---
  - method: GET
    path: "/evote/certificates"
    description: "List certificates with optional filters (public certificate registry)."
    roles: *all_roles
    code: 200
    input: ["voting_system_id?", "campaign_id?", "status?", "scope?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []
  - method: GET
    path: "/evote/certificates/{id}"
    description: "Read one certificate; the read applies the expiry sweep lazily."
    roles: *all_roles
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: POST
    path: "/evote/certificates/{id}/transitions"
    description: "Certificate lifecycle: SUSPENDED / ACTIVE (reinstate) / REVOKED. Revocation cascades: non-terminal procurements pinning it are CANCELLED with encumbrance release."
    roles: [CertificationAuthority]
    code: 200
    input: [to_state, "reason?"]
    output: Certificate
    side_effects: ["increments Certificate.version by 1", "REVOKED cancels PLACED/DELIVERED/ACCEPTANCE_TESTING procurements and releases their encumbrances"]

  # --- Jurisdiction ---
  - method: POST
    path: "/evote/jurisdictions"
    description: "Create a jurisdiction with a total budget; available_cents starts at budget_total_cents, encumbered_cents and spent_cents at 0."
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_code, budget_total_cents]
    output: Jurisdiction
    side_effects: []
  - method: GET
    path: "/evote/jurisdictions/{id}"
    description: "Read one jurisdiction including the budget ledger fields."
    roles: *all_roles
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []
  - method: POST
    path: "/evote/jurisdictions/{id}/budget-adjustments"
    description: "Adjust budget_total_cents and available_cents by delta_cents (may be negative, must not drive available negative)."
    roles: [PlatformAdmin]
    code: 201
    input: [delta_cents, reason]
    output: Jurisdiction
    side_effects: ["budget_total_cents += delta_cents; available_cents += delta_cents", "increments Jurisdiction.version by 1"]

  # --- ElectionOfficial ---
  - method: POST
    path: "/evote/jurisdictions/{id}/officials"
    description: "Create an election official inside a jurisdiction."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, badge_no]
    output: ElectionOfficial
    side_effects: []
  - method: GET
    path: "/evote/officials"
    description: "List officials, optionally filtered by jurisdiction or status."
    roles: *all_roles
    code: 200
    input: ["jurisdiction_id?", "status?", "limit?", "offset?"]
    output: ElectionOfficial[]
    side_effects: []
  - method: GET
    path: "/evote/officials/{id}"
    description: "Read one official."
    roles: *all_roles
    code: 200
    input: []
    output: ElectionOfficial
    side_effects: []
  - method: POST
    path: "/evote/officials/{id}/transitions"
    description: "Activate / deactivate an official (to_state in {ACTIVE, INACTIVE})."
    roles: [PlatformAdmin]
    code: 200
    input: [to_state]
    output: ElectionOfficial
    side_effects: ["increments ElectionOfficial.version by 1"]
  - method: GET
    path: "/evote/officials/{id}/la-tests"
    description: "List L&A tests conducted or certified by this official (matches conducted_by OR certified_by)."
    roles: *all_roles
    code: 200
    input: ["status?", "result?", "limit?", "offset?"]
    output: LogicAccuracyTest[]
    side_effects: []
  - method: GET
    path: "/evote/officials/{id}/custody-transfers"
    description: "List custody transfers involving this official on either side (from_official_id OR to_official_id)."
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: CustodyTransfer[]
    side_effects: []

  # --- Procurement ---
  - method: POST
    path: "/evote/procurements"
    description: "Place a procurement. Guards (in priority order): referenced rows exist; certificate belongs to the named system (ERR_CERTIFICATE_SYSTEM_MISMATCH); certificate scope covers the jurisdiction state (ERR_CERTIFICATE_SCOPE_MISMATCH); certificate ACTIVE (ERR_CERTIFICATE_NOT_ACTIVE); system not RETIRED; fiscal total <= available_cents (ERR_BUDGET_EXCEEDED)."
    roles: [ElectionOfficial]
    code: 201
    input: [jurisdiction_id, voting_system_id, certificate_id, quantity, unit_price_cents]
    output: Procurement
    side_effects: ["total_price_cents := quantity * unit_price_cents", "certificate_version_pinned := Certificate.version at placement", "Jurisdiction.available_cents -= total; Jurisdiction.encumbered_cents += total; Jurisdiction.version += 1"]
  - method: GET
    path: "/evote/procurements"
    description: "List procurements with optional filters."
    roles: *all_roles
    code: 200
    input: ["jurisdiction_id?", "voting_system_id?", "certificate_id?", "status?", "limit?", "offset?"]
    output: Procurement[]
    side_effects: []
  - method: GET
    path: "/evote/procurements/{id}"
    description: "Read one procurement."
    roles: *all_roles
    code: 200
    input: []
    output: Procurement
    side_effects: []
  - method: POST
    path: "/evote/procurements/{id}/transitions"
    description: "Procurement lifecycle: DELIVERED, ACCEPTANCE_TESTING, ACCEPTED, REJECTED (reason), CANCELLED. Ledger side effects per state_machines.Procurement."
    roles: [ElectionOfficial]
    code: 200
    input: [to_state, "reason?"]
    output: Procurement
    side_effects: ["increments Procurement.version by 1", "ACCEPTED moves encumbered->spent; REJECTED/CANCELLED release the encumbrance"]
  - method: POST
    path: "/evote/procurements/{id}/acceptance-tests"
    description: "Record an acceptance test against a procurement in ACCEPTANCE_TESTING; computes deficiency_index and result per acceptance_deficiency_index."
    roles: [ElectionOfficial]
    code: 201
    input: [test_type, critical_defects, major_defects, minor_defects]
    output: AcceptanceTest
    side_effects: []
  - method: GET
    path: "/evote/procurements/{id}/acceptance-tests"
    description: "List acceptance tests of one procurement."
    roles: *all_roles
    code: 200
    input: ["test_type?", "result?", "limit?", "offset?"]
    output: AcceptanceTest[]
    side_effects: []

  # --- ElectionDefinition ---
  - method: POST
    path: "/evote/election-definitions"
    description: "Create an election definition against a procurement in {ACCEPTANCE_TESTING, ACCEPTED}; election_date must be at least 30 days out."
    roles: [ElectionOfficial]
    code: 201
    input: [jurisdiction_id, procurement_id, name, election_date, precinct_count]
    output: ElectionDefinition
    side_effects: []
  - method: GET
    path: "/evote/election-definitions"
    description: "List election definitions with optional filters."
    roles: *all_roles
    code: 200
    input: ["jurisdiction_id?", "procurement_id?", "status?", "limit?", "offset?"]
    output: ElectionDefinition[]
    side_effects: []
  - method: GET
    path: "/evote/election-definitions/{id}"
    description: "Read one election definition."
    roles: *all_roles
    code: 200
    input: []
    output: ElectionDefinition
    side_effects: []
  - method: PUT
    path: "/evote/election-definitions/{id}/layout"
    description: "Store or supersede the ballot layout (OCC-guarded on the definition version). Paper stock compatibility enforced against scanner ranges; OPTICAL_SCANNER systems require UNCOATED paper. Only allowed from DRAFT."
    roles: [ElectionOfficial]
    code: 200
    input: [ballot_layout, paper_weight_gsm, paper_thickness_microns, paper_coating, expected_election_definition_version]
    output: ElectionDefinition
    side_effects: ["layout_revision += 1", "increments ElectionDefinition.version by 1"]
  - method: POST
    path: "/evote/election-definitions/{id}/transitions"
    description: "Election lifecycle: PROGRAMMED, LA_PASSED, DRAFT (revert, reason), LOCKED, CANVASSING, CLOSED, CANCELLED (reason)."
    roles: [ElectionOfficial]
    code: 200
    input: [to_state, "reason?"]
    output: ElectionDefinition
    side_effects: ["increments ElectionDefinition.version by 1"]
  - method: GET
    path: "/evote/election-definitions/{id}/readiness"
    description: "Computed read: fleet readiness of the definition's jurisdiction + voting system under BOTH fleet_readiness variants."
    roles: *all_roles
    code: 200
    input: []
    output: { jurisdiction_id: string, voting_system_id: string, unit_count: integer, optimistic_ready_count: integer, conservative_ready_count: integer }
    side_effects: []
  - method: GET
    path: "/evote/election-definitions/{id}/print-estimate"
    description: "Computed read: ballot printing cost per ballot_print_cost (per-precinct ream ceil BEFORE aggregation; tier on aggregate reams)."
    roles: *all_roles
    code: 200
    input: [ballots_per_precinct]
    output: { precinct_count: integer, ballots_per_precinct: integer, reams_per_precinct: integer, total_reams: integer, tier_price_cents: integer, total_cost_cents: integer }
    side_effects: []

  # --- LogicAccuracyTest ---
  - method: POST
    path: "/evote/election-definitions/{id}/la-tests"
    description: "Conduct an L&A test on a PROGRAMMED or LA_PASSED definition; conducted_by := X-User-ID; verifies tallies per la_tabulation_verification."
    roles: [ElectionOfficial]
    code: 201
    input: [expected_tallies, scanned_tallies]
    output: LogicAccuracyTest
    side_effects: []
  - method: GET
    path: "/evote/election-definitions/{id}/la-tests"
    description: "List L&A tests of one election definition."
    roles: *all_roles
    code: 200
    input: ["status?", "result?", "limit?", "offset?"]
    output: LogicAccuracyTest[]
    side_effects: []
  - method: POST
    path: "/evote/logic-accuracy-tests/{id}/transitions"
    description: "L&A lifecycle: CERTIFIED (SoD: certifier != conductor), CHALLENGED (SoD), CONDUCTED reopen with new scanned_tallies."
    roles: [ElectionOfficial]
    code: 200
    input: [to_state, "scanned_tallies?"]
    output: LogicAccuracyTest
    side_effects: ["reopen recomputes discrepancy and result and clears certified_by", "increments LogicAccuracyTest.version by 1"]

  # --- EquipmentUnit ---
  - method: POST
    path: "/evote/equipment-units"
    description: "Register an equipment unit. Guards: system FIELDED (ERR_SYSTEM_NOT_FIELDED), unique serial_number, initial custodian is an ACTIVE official of the same jurisdiction."
    roles: [ElectionOfficial]
    code: 201
    input: [jurisdiction_id, voting_system_id, serial_number, initial_custodian_id]
    output: EquipmentUnit
    side_effects: ["operational_status := IN_STORAGE; custody_status := SECURED; battery_cycles := 0; storage_excursion_count := 0; current_custodian_id := initial_custodian_id"]
  - method: GET
    path: "/evote/equipment-units"
    description: "List equipment units with optional filters."
    roles: *all_roles
    code: 200
    input: ["jurisdiction_id?", "voting_system_id?", "current_custodian_id?", "operational_status?", "custody_status?", "limit?", "offset?"]
    output: EquipmentUnit[]
    side_effects: []
  - method: GET
    path: "/evote/equipment-units/{id}"
    description: "Read one equipment unit."
    roles: *all_roles
    code: 200
    input: []
    output: EquipmentUnit
    side_effects: []
  - method: POST
    path: "/evote/equipment-units/{id}/transitions"
    description: "Operational transitions: IN_SERVICE (deploy), IN_STORAGE (store; requires storage_temperature_c + storage_humidity_pct, may record an excursion), QUARANTINED / release (CertificationAuthority only), RETIRED. Direct to_state=IN_MAINTENANCE is forbidden."
    roles: [ElectionOfficial, CertificationAuthority]
    code: 200
    input: [to_state, "storage_temperature_c?", "storage_humidity_pct?"]
    output: EquipmentUnit
    side_effects: ["store outside the [10,35]C / [20,70]% band increments storage_excursion_count", "RETIRED/QUARANTINED abort open work orders", "increments EquipmentUnit.version by 1"]
  - method: POST
    path: "/evote/equipment-units/{id}/record-usage"
    description: "Accumulate battery charge cycles on an IN_SERVICE unit."
    roles: [ElectionOfficial]
    code: 200
    input: [cycles_used]
    output: EquipmentUnit
    side_effects: ["battery_cycles += cycles_used", "increments EquipmentUnit.version by 1"]
  - method: POST
    path: "/evote/equipment-units/{id}/custody-transfers"
    description: "Transfer custody to another ACTIVE official of the same jurisdiction; seal_number unique per unit; seal_intact=false flips custody_status to UNSEALED."
    roles: [ElectionOfficial]
    code: 201
    input: [to_official_id, seal_number, seal_intact]
    output: CustodyTransfer
    side_effects: ["unit.current_custodian_id := to_official_id; unit.version += 1", "seal_intact false -> unit.custody_status := UNSEALED"]
  - method: GET
    path: "/evote/equipment-units/{id}/custody-transfers"
    description: "List the custody chain of one unit, oldest first."
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: CustodyTransfer[]
    side_effects: []
  - method: GET
    path: "/evote/equipment-units/{id}/maintenance-work-orders"
    description: "List work orders of one unit."
    roles: *all_roles
    code: 200
    input: ["status?", "work_type?", "limit?", "offset?"]
    output: MaintenanceWorkOrder[]
    side_effects: []

  # --- MaintenanceWorkOrder ---
  - method: POST
    path: "/evote/maintenance-work-orders"
    description: "Schedule a work order. Half-open [scheduled_start, scheduled_end) overlap with another SCHEDULED/IN_PROGRESS order on the same unit is rejected (adjacency allowed); CALIBRATION requires both calibration paper fields in scanner range."
    roles: [ElectionOfficial]
    code: 201
    input: [equipment_unit_id, work_type, scheduled_start, scheduled_end, "calibration_paper_weight_gsm?", "calibration_paper_thickness_microns?"]
    output: MaintenanceWorkOrder
    side_effects: []
  - method: POST
    path: "/evote/maintenance-work-orders/{id}/transitions"
    description: "Work-order lifecycle: IN_PROGRESS (unit enters IN_MAINTENANCE), COMPLETED (work-type effects; unit restored), ABORTED (no effects; unit restored unless quarantined)."
    roles: [ElectionOfficial]
    code: 200
    input: [to_state, "resolution_note?"]
    output: MaintenanceWorkOrder
    side_effects: ["start/complete/abort mutate the parent unit per state_machines.EquipmentUnit", "increments MaintenanceWorkOrder.version by 1"]

  # --- SoftwareModification ---
  - method: POST
    path: "/evote/software-modifications"
    description: "Vendor proposes a software modification (OCC-guarded on the system version via expected_voting_system_version)."
    roles: [VendorRep]
    code: 201
    input: [voting_system_id, description, component_codes, expected_voting_system_version]
    output: SoftwareModification
    side_effects: ["submitted_at := now", "increments VotingSystem.version by 1"]
  - method: GET
    path: "/evote/voting-systems/{id}/software-modifications"
    description: "List modification proposals of one voting system."
    roles: *all_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SoftwareModification[]
    side_effects: []
  - method: POST
    path: "/evote/software-modifications/{id}/transitions"
    description: "Modification lifecycle: DE_MINIMIS_APPROVED / RECERTIFICATION_PENDING (CertificationAuthority classification), EFFECTIVE (VendorRep; lead-time gate; RECERT path requires a newer CERTIFIED campaign), REJECTED (CertificationAuthority), WITHDRAWN (VendorRep from PROPOSED)."
    roles: [VendorRep, CertificationAuthority]
    code: 200
    input: [to_state, "new_baseline_version?"]
    output: SoftwareModification
    side_effects: ["classification computes lead_time_days from pre-cascade state", "RECERTIFICATION_PENDING fires the certificate-suspension cascade (3 hops)", "EFFECTIVE bumps the system baseline and reinstates suspended certificates", "increments SoftwareModification.version by 1"]

  # --- PostElectionAudit ---
  - method: POST
    path: "/evote/post-election-audits"
    description: "Open a post-election audit on a CANVASSING election definition; at most one non-terminal audit per definition."
    roles: [Auditor]
    code: 201
    input: [election_definition_id, audit_type]
    output: PostElectionAudit
    side_effects: []
  - method: GET
    path: "/evote/election-definitions/{id}/post-election-audits"
    description: "List audits of one election definition."
    roles: *all_roles
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PostElectionAudit[]
    side_effects: []
  - method: POST
    path: "/evote/post-election-audits/{id}/transitions"
    description: "Audit lifecycle: FINDINGS_FILED (findings payload), CLOSED_CONFIRMED, CLOSED_ESCALATED (requires critical_findings >= 1; quarantines the fleet and aborts its open work orders)."
    roles: [Auditor]
    code: 200
    input: [to_state, "critical_findings?", "major_findings?", "minor_findings?"]
    output: PostElectionAudit
    side_effects: ["CLOSED_ESCALATED quarantines matching EquipmentUnits and aborts their open work orders", "increments PostElectionAudit.version by 1"]
  - method: POST
    path: "/evote/post-election-audits/{id}/publish"
    description: "Publish the audit report for public transparency; only from a terminal state."
    roles: [Auditor]
    code: 200
    input: []
    output: PostElectionAudit
    side_effects: ["report_public := true; published_at := now", "increments PostElectionAudit.version by 1"]

  # --- Public transparency ---
  - method: GET
    path: "/evote/public/voting-systems/{id}/documentation"
    description: "Public transparency read: system summary, certificate counts, campaign count, and count of published audits for the named system. No ownership checks."
    roles: *all_roles
    code: 200
    input: []
    output: { system_id: string, model_name: string, software_baseline_version: string, hardware_class: string, system_status: string, active_certificate_count: integer, campaign_count: integer, public_audit_count: integer }
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role / X-User-ID missing, or the role is not a declared role."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role is authenticated but not in the endpoint's roles list."
  - id: ERR_FORBIDDEN_OWNERSHIP
    http: 403
    condition: "Entity-backed identity mismatch: LabAgent id != campaign.lab_id, ElectionOfficial jurisdiction mismatch, or custody transfer attempted by a non-custodian."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "L&A CERTIFIED/CHALLENGED attempted by the official recorded as conducted_by."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path segment id does not resolve (checked left-to-right)."
  - id: ERR_SYSTEM_NOT_FOUND
    http: 404
    condition: "Body field voting_system_id does not resolve."
  - id: ERR_LAB_NOT_FOUND
    http: 404
    condition: "Body field lab_id does not resolve."
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "Body field certificate_id does not resolve."
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "Body field jurisdiction_id does not resolve."
  - id: ERR_OFFICIAL_NOT_FOUND
    http: 404
    condition: "Body field to_official_id or initial_custodian_id does not resolve."
  - id: ERR_PROCUREMENT_NOT_FOUND
    http: 404
    condition: "Body field procurement_id does not resolve."
  - id: ERR_ELECTION_DEFINITION_NOT_FOUND
    http: 404
    condition: "Body field election_definition_id does not resolve."
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "Body field equipment_unit_id does not resolve."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Schema violation: missing required field, undeclared field, wrong type, unknown enum member, out-of-range integer, scheduled_end <= scheduled_start, empty component_codes, empty reason where required."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not equal the parent's current version (OCC)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target's state machine has no transition with that to_state from the current state; includes terminal-state lockdown and direct IN_MAINTENANCE writes."
  - id: ERR_UNIT_QUARANTINED
    http: 409
    condition: "Custody transfer, deploy/store, or work-order create attempted on a QUARANTINED unit."
  - id: ERR_UNIT_UNSEALED
    http: 422
    condition: "Deploy or retire attempted while custody_status == UNSEALED (broken tamper evidence without a completed RESEAL work order)."
  - id: ERR_BATTERY_CYCLE_LIMIT
    http: 422
    condition: "Deploy attempted with battery_cycles >= BATTERY_CYCLE_MAX (500); exactly 500 is rejected."
  - id: ERR_DUPLICATE_LAB_CODE
    http: 409
    condition: "lab_code already registered."
  - id: ERR_DUPLICATE_SERIAL
    http: 409
    condition: "serial_number already registered."
  - id: ERR_DUPLICATE_BADGE
    http: 409
    condition: "badge_no already used within the same jurisdiction."
  - id: ERR_SEAL_NUMBER_REUSED
    http: 409
    condition: "seal_number already appears in this unit's custody-transfer history."
  - id: ERR_WORK_ORDER_OVERLAP
    http: 409
    condition: "New work order's half-open [scheduled_start, scheduled_end) intersects another SCHEDULED/IN_PROGRESS order on the same unit; adjacency (end == start) is allowed."
  - id: ERR_LAB_CAPACITY_EXCEEDED
    http: 409
    condition: "Lab already has max_concurrent_campaigns campaigns in IN_TEST (aggregate capacity)."
  - id: ERR_CAMPAIGN_ALREADY_ACTIVE
    http: 409
    condition: "Another campaign for the same voting system is in SUBMITTED, IN_TEST or DEFICIENCIES_FILED."
  - id: ERR_AUDIT_ALREADY_ACTIVE
    http: 409
    condition: "Another audit for the same election definition is in INITIATED or FINDINGS_FILED."
  - id: ERR_DEFICIENCY_COUNTS_INVALID
    http: 422
    condition: "file-deficiencies with zero total counts; resubmit not exactly equal to open counts (all-or-nothing); deny without an open critical deficiency."
  - id: ERR_PAPER_INCOMPATIBLE
    http: 422
    condition: "Paper weight/thickness outside [80,120] gsm / [60,250] microns, or COATED paper on an OPTICAL_SCANNER system; applies to layout PUT and CALIBRATION work orders."
  - id: ERR_SELF_TRANSFER
    http: 422
    condition: "Custody transfer with to_official_id == from_official_id."
  - id: ERR_LAYOUT_REQUIRED
    http: 422
    condition: "PROGRAMMED requested while ballot_layout or any paper_* field is null."
  - id: ERR_LA_TEST_NOT_CERTIFIED
    http: 422
    condition: "LA_PASSED requested without a CERTIFIED LogicAccuracyTest with result PASS for this definition."
  - id: ERR_AUDIT_OPEN
    http: 422
    condition: "CLOSED requested while an audit of this definition is non-terminal."
  - id: ERR_INVALID_TALLIES
    http: 422
    condition: "Tally key sets differ, a value is negative/non-integer, or total_expected is zero."
  - id: ERR_ACCEPTANCE_TESTS_INCOMPLETE
    http: 422
    condition: "ACCEPTED requested without at least one HARDWARE_DIAGNOSTIC and one BALLOT_SCAN_CALIBRATION acceptance test."
  - id: ERR_ACCEPTANCE_TEST_FAILURES_PRESENT
    http: 422
    condition: "ACCEPTED requested while any acceptance test of the procurement has result FAIL."
  - id: ERR_ELECTION_DATE_INVALID
    http: 422
    condition: "election_date is not at least 30 days after the current logical date at creation."
  - id: ERR_ELECTION_FREEZE_WINDOW
    http: 422
    condition: "LOCKED requested with fewer than 14 days between the current logical date and election_date."
  - id: ERR_ELECTION_NOT_HELD
    http: 422
    condition: "CANVASSING requested before election_date."
  - id: ERR_CERTIFICATE_EXPIRED
    http: 422
    condition: "Reinstate attempted when now >= expires_at."
  - id: ERR_LEAD_TIME_NOT_ELAPSED
    http: 422
    condition: "EFFECTIVE attempted before classified_at + lead_time_days."
  - id: ERR_CERTIFICATE_NOT_ACTIVE
    http: 422
    condition: "Referenced certificate is not ACTIVE (acceptance start, accept, lock, or procurement placement)."
  - id: ERR_CERTIFICATE_SYSTEM_MISMATCH
    http: 422
    condition: "certificate_id belongs to a different voting system than the procurement's voting_system_id."
  - id: ERR_CERTIFICATE_SCOPE_MISMATCH
    http: 422
    condition: "STATE certificate's state_code differs from the jurisdiction's state_code (FEDERAL covers all states)."
  - id: ERR_LAB_SCOPE_MISMATCH
    http: 422
    condition: "Lab accreditation_scope does not cover the campaign scope (state campaign needs STATE or DUAL; federal-only needs FEDERAL or DUAL)."
  - id: ERR_LAB_SUSPENDED
    http: 422
    condition: "Campaign create / begin-testing / certify attempted with a SUSPENDED laboratory."
  - id: ERR_SYSTEM_RETIRED
    http: 422
    condition: "Operation references a RETIRED voting system (campaign create, modification create, unit deploy)."
  - id: ERR_SYSTEM_NOT_FIELDED
    http: 422
    condition: "Equipment unit creation requires the voting system to be FIELDED."
  - id: ERR_OFFICIAL_JURISDICTION_MISMATCH
    http: 422
    condition: "Referenced official belongs to a different jurisdiction than the target resource."
  - id: ERR_OFFICIAL_INACTIVE
    http: 422
    condition: "Referenced official has status INACTIVE."
  - id: ERR_PROCUREMENT_NOT_ACCEPTED
    http: 422
    condition: "Election-definition create requires procurement in {ACCEPTANCE_TESTING, ACCEPTED}; LOCKED requires ACCEPTED."
  - id: ERR_CONFORMITY_BELOW_THRESHOLD
    http: 422
    condition: "CERTIFIED attempted with freshly evaluated FINAL_AUDIT conformity < 8000 bp."
  - id: ERR_RECERTIFICATION_CAMPAIGN_REQUIRED
    http: 422
    condition: "RECERTIFICATION_PENDING -> EFFECTIVE attempted without a campaign CERTIFIED after the modification's submitted_at."
  - id: ERR_ESCALATION_REQUIRES_CRITICAL
    http: 422
    condition: "CLOSED_ESCALATED attempted with critical_findings == 0."
  - id: ERR_BUDGET_EXCEEDED
    http: 402
    condition: "Procurement total_price_cents exceeds jurisdiction available_cents."
  - id: ERR_BUDGET_ADJUSTMENT_INVALID
    http: 402
    condition: "Adjustment would drive available_cents below zero."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; onboards systems, laboratories, jurisdictions and officials; manages the logical clock and budgets; retires systems."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /evote/voting-systems"
      - "POST /evote/voting-systems/{id}/transitions"
      - "POST /evote/test-laboratories"
      - "POST /evote/jurisdictions"
      - "POST /evote/jurisdictions/{id}/budget-adjustments"
      - "POST /evote/jurisdictions/{id}/officials"
      - "POST /evote/officials/{id}/transitions"
    shared_operations:
      - "all GET endpoints"
  - name: CertificationAuthority
    description: "State/federal certification authority; suspends and reinstates laboratories, certifies or denies campaigns, manages certificates, classifies software modifications, quarantines equipment."
    identity: opaque
    exclusive_operations:
      - "POST /evote/test-laboratories/{id}/transitions"
      - "POST /evote/certificates/{id}/transitions"
      - "campaign CERTIFIED and DENIED transitions"
      - "modification classification and REJECTED transitions"
      - "equipment-unit QUARANTINED transitions and quarantine release"
    shared_operations:
      - "all GET endpoints"
  - name: VendorRep
    description: "Voting-system vendor representative; submits certification campaigns, resubmits or withdraws them, proposes software modifications and applies approved ones."
    identity: opaque
    exclusive_operations:
      - "POST /evote/certification-campaigns"
      - "campaign SUBMITTED (resubmission) and WITHDRAWN transitions"
      - "POST /evote/software-modifications"
      - "modification EFFECTIVE and WITHDRAWN transitions"
    shared_operations:
      - "all GET endpoints"
  - name: LabAgent
    description: "Test-laboratory agent; X-User-ID equals the TestLaboratory id. Runs begin-testing and deficiency filing on its own laboratory's campaigns."
    identity: "entity_backed:TestLaboratory"
    exclusive_operations:
      - "campaign IN_TEST and DEFICIENCIES_FILED transitions (own laboratory only)"
    shared_operations:
      - "all GET endpoints"
  - name: ElectionOfficial
    description: "Jurisdiction election official; X-User-ID equals the ElectionOfficial id. Drives procurement, acceptance testing, election programming, L&A testing, equipment operations, custody and maintenance within the official's own jurisdiction. Segregation of duties: the L&A conductor may not certify or challenge their own test."
    identity: "entity_backed:ElectionOfficial"
    exclusive_operations:
      - "POST /evote/procurements and procurement transitions"
      - "POST /evote/procurements/{id}/acceptance-tests"
      - "POST /evote/election-definitions, layout PUT and definition transitions"
      - "POST /evote/election-definitions/{id}/la-tests and L&A transitions"
      - "POST /evote/equipment-units, unit transitions (except quarantine), record-usage"
      - "POST /evote/equipment-units/{id}/custody-transfers"
      - "POST /evote/maintenance-work-orders and work-order transitions"
    shared_operations:
      - "all GET endpoints"
  - name: Auditor
    description: "Independent post-election auditor; opens audits, files findings, closes (confirming or escalating) and publishes reports."
    identity: opaque
    exclusive_operations:
      - "POST /evote/post-election-audits and audit transitions"
      - "POST /evote/post-election-audits/{id}/publish"
    shared_operations:
      - "all GET endpoints"
  - name: PublicRequester
    description: "Unauthenticated-equivalent public role for transparency reads of system documentation and the certificate registry."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "all GET endpoints"
