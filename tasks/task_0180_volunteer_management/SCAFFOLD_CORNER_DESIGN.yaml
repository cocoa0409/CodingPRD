              as: ShiftCoordinator
              captures: { sh2: $.data.id, sh2_v: $.data.version }
            - call: "POST /vm/opportunities/${opp_id}/publish"
              payload: {}
              as: ShiftCoordinator
            - call: "POST /vm/shifts/${sh1}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${sh1_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { su1: $.data.id }
            - call: "POST /vm/shifts/${sh2}/signups"
              payload: { volunteer_id: "${vol_id}", expected_shift_version: "${sh2_v}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { su2: $.data.id }
            - call: "POST /vm/signups/${su1}/confirm"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /vm/signups/${su2}/confirm"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /vm/signups/${su1}/mark-no-show"
              payload: {}
              as: ShiftCoordinator
            - call: "GET /vm/volunteers/${vol_id}"
              payload: {}
              as: ShiftCoordinator
              captures: { status_after_1: $.data.status }
          trigger:
            - call: "POST /vm/signups/${su2}/mark-no-show"
              payload: {}
              as: ShiftCoordinator
            - call: "GET /vm/volunteers/${vol_id}"
