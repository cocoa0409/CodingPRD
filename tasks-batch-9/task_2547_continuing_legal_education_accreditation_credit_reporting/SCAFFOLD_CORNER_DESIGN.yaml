      - name: a_roster_filed_one_second_past_its_due_date_costs_a_whole_late_day
        claim_type: precision
        grounds:
          - calculations.attendance_report_lateness
          - calculations.provider_risk_score
          - domain_constants.ROSTER_DUE_DAYS
          - entities.AttendanceReport.fields.days_late
