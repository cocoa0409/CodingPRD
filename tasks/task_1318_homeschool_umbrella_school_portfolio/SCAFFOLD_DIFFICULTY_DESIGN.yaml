  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: coop_meeting_time_half_open_overlap
        grounds:
          - validations[priority=10]
          - errors[ERR_COOP_SCHEDULE_OVERLAP]
          - entities.CoopClass.fields.meeting_start_minutes
          - entities.CoopClass.fields.meeting_end_minutes
        distinguishing_aspect: |
          Interval semantics = half-open [start, end) on weekly meeting windows of
          CoopClass (the resource): [540,630) and [630,720) touch at 630 and are
          allowed, while [540,630) vs [600,660) properly intersect and are
          rejected. Adjacency allowed distinguishes it from the buffered exam rule.
        test_recipe:
          setup:
            - "Year OPEN; family; grade-4 student; enrollment ACTIVE"
            - "Three OPEN classes, capacity 10, fee_base 1000, materials 0, start 2026-08-25: C1 MON [540,630), C2 MON [630,720), C3 MON [600,660)"
          setup_api_calls:
            - { call: "POST /academic-years", payload: { label: "2026-2027", start_date: "2026-08-01", end_date: "2027-05-31", notice_filing_deadline: "2026-09-15T00:00:00Z", portfolio_due_date: "2027-04-30T00:00:00Z", state_report_due_date: "2027-06-15T00:00:00Z", mid_year_date: "2027-01-15" }, as: AcademicDirector, captures: { yr: $.data.id } }
            - { call: "POST /academic-years/${yr}/open", payload: {}, as: AcademicDirector }
            - { call: "POST /families", payload: { display_name: "Fam Ovl", district_code: "D-22" }, as: Parent, captures: { fam: $.data.id } }
            - { call: "POST /families/${fam}/students", payload: { full_name: "Kid Ovl", date_of_birth: "2016-10-10" }, as: Parent, as_user_id: "${fam}", captures: { stu: $.data.id } }
            - { call: "POST /students/${stu}/enrollments", payload: { academic_year_id: "${yr}", grade_level: 4 }, as: Parent, as_user_id: "${fam}", captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/notices", payload: { district_code: "D-22" }, as: Parent, as_user_id: "${fam}", captures: { noi: $.data.id } }
            - { call: "POST /notices/${noi}/file", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /notices/${noi}/acknowledge", payload: {}, as: Registrar }
            - { call: "POST /enrollments/${enr}/curriculum-plans", payload: { subjects: ["READING", "WRITING", "MATH", "SCIENCE", "SOCIAL_STUDIES"] }, as: Parent, as_user_id: "${fam}", captures: { pln: $.data.id } }
            - { call: "POST /curriculum-plans/${pln}/submit", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /curriculum-plans/${pln}/review", payload: { decision: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /enrollments/${enr}/activate", payload: {}, as: Registrar }
            - { call: "POST /academic-years/${yr}/coop-classes", payload: { title: "C1", subject: "Art", grade_min: 0, grade_max: 12, meeting_day: "MON", meeting_start_minutes: 540, meeting_end_minutes: 630, start_date: "2026-08-25", end_date: "2026-12-15", capacity: 10, fee_base_cents: 1000, materials_fee_cents: 0 }, as: Registrar, captures: { cl1: $.data.id } }
            - { call: "POST /coop-classes/${cl1}/open", payload: {}, as: Registrar }
            - { call: "POST /academic-years/${yr}/coop-classes", payload: { title: "C2", subject: "Music", grade_min: 0, grade_max: 12, meeting_day: "MON", meeting_start_minutes: 630, meeting_end_minutes: 720, start_date: "2026-08-25", end_date: "2026-12-15", capacity: 10, fee_base_cents: 1000, materials_fee_cents: 0 }, as: Registrar, captures: { cl2: $.data.id } }
            - { call: "POST /coop-classes/${cl2}/open", payload: {}, as: Registrar }
            - { call: "POST /academic-years/${yr}/coop-classes", payload: { title: "C3", subject: "PE", grade_min: 0, grade_max: 12, meeting_day: "MON", meeting_start_minutes: 600, meeting_end_minutes: 660, start_date: "2026-08-25", end_date: "2026-12-15", capacity: 10, fee_base_cents: 1000, materials_fee_cents: 0 }, as: Registrar, captures: { cl3: $.data.id } }
            - { call: "POST /coop-classes/${cl3}/open", payload: {}, as: Registrar }
          trigger:
            - { call: "GET /coop-classes/${cl1}", payload: {}, as: Registrar, captures: { cv1: $.data.version } }
            - { call: "POST /coop-classes/${cl1}/enrollments", payload: { enrollment_id: "${enr}", expected_coop_class_version: "${cv1}" }, as: Parent, as_user_id: "${fam}", captures: { ce1: $.data.id, st1: $.data.status, fee1: $.data.fee_cents } }
            - { call: "GET /coop-classes/${cl2}", payload: {}, as: Registrar, captures: { cv2: $.data.version } }
            - { call: "POST /coop-classes/${cl2}/enrollments", payload: { enrollment_id: "${enr}", expected_coop_class_version: "${cv2}" }, as: Parent, as_user_id: "${fam}", captures: { ce2: $.data.id, st2: $.data.status, fee2: $.data.fee_cents } }
            - { call: "GET /coop-classes/${cl3}", payload: {}, as: Registrar, captures: { cv3: $.data.version } }
            - { call: "POST /coop-classes/${cl3}/enrollments", payload: { enrollment_id: "${enr}", expected_coop_class_version: "${cv3}" }, as: Parent, as_user_id: "${fam}", captures: { err: $.data.error_id } }
            - { call: "GET /coop-classes/${cl3}", payload: {}, as: Registrar, captures: { seats3: $.data.seats_taken } }
          assert:
            - "C1 registration CONFIRMED, fee_cents == 1000 (no early-bird, no sibling)"
            - "C2 registration CONFIRMED (adjacent [540,630) vs [630,720) allowed: 630 < 630 is false)"
            - "C2 fee_cents == 850 (sibling 15% on same-family second enrollment: round_half_up(1000*0.85))"
            - "C3 registration error_id == ERR_COOP_SCHEDULE_OVERLAP (HTTP 409): [600,660) vs [540,630) intersect (540 < 660 and 600 < 630)"
            - "CoopClass.${cl3}.seats_taken == 0 (rejection does not hold a seat)"

      - name: exam_session_thirty_minute_buffer_overlap
        grounds:
          - validations[priority=10]
          - errors[ERR_EXAM_SCHEDULE_CONFLICT]
          - entities.ExamSession.fields.start_minutes
          - entities.ExamSession.fields.end_minutes
        distinguishing_aspect: |
          Interval semantics = buffered windows on ExamSession (a different
          resource entity than CoopClass): two sessions on the same date conflict
          unless the gap between them is >= 30 minutes. Sessions 09:00-11:00 and
          11:15-12:30 conflict (15 < 30); 09:00-11:00 and 11:30-12:30 are allowed
          (exactly 30 satisfies >= 30). Adjacency-until-30 forbidden distinguishes
          this from the half-open co-op rule.
        test_recipe:
          setup:
            - "Year OPEN; family; grade-3 student; enrollment ACTIVE"
            - "Three sessions on 2026-09-15, capacity 10, deadline 2026-09-01, target_grades [3], all REGISTRATION_OPEN: SA 09:00-11:00 (540-660), SB 11:15-12:30 (675-750), SC 11:30-12:30 (690-750)"
