    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is 2026-01-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock time. All deadline/expiry/window rules read this clock."
    roles: [ShopAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock set to to_iso8601"]

  # --- Diver ---
  - method: POST
    path: "/divers"
    description: "Register a diver"
    roles: [ShopAdmin, Diver]
    code: 201
