scaffold_difficulty_design:
  # ===================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: liquidated_damages_provisional_vs_final
        grounds:
          - calculations.calc_liquidated_damages
          - state_machines.RepairProject.WORK_COMPLETE_to_DELIVERED
          - entities.RepairProject.fields.provisional_ld_cents
          - entities.RepairProject.fields.liquidated_damages_cents
        distinguishing_aspect: |
          Entity domain: RepairProject fiscal accrual. The provisional variant prices
          lateness off the forward-looking forecast_delivery_utc (2 chargeable days ->
          1000000 cents) while the final variant prices the same project off the actual
          delivery date (delivered early -> 0 cents): identical formula, different date
          source, different money.
        test_recipe:
          setup:
            - "Project (contract delivery 2026-08-10, contracted price 60000000 cents via one LUMP_SUM item 100 x 600000, duration 14d) is IN_DOCK since 2026-08-01T00:00:00Z"
            - "Forecast delivery = 2026-08-01 + 14d = 2026-08-15 -> 5 days late -> 2 chargeable days at tier-2 rate 500000 -> provisional LD 1000000"
            - "Work is actually completed and delivered on 2026-08-05, five days BEFORE the contract date"
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Hull plate renewal", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 14, quantity: 100, unit_price_cents: 600000 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { w_id: $.data.id }
            - call: "POST /v1/repair-projects/${p_id}/submit-bid"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/award"
              as: CommercialApprover
              as_user_id: "comm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-20T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_id: $.data.id }
            - call: "POST /v1/dock-reservations/${r_id}/activate"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { prov_mid: $.data.provisional_ld_cents }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: YardAdmin
            - call: "POST /v1/work-items/${w_id}/start"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/work-items/${w_id}/complete"
              as: ProjectManager
              as_user_id: "pm_1"
          trigger:
            - call: "POST /v1/repair-projects/${p_id}/deliver"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { ld_final: $.data.liquidated_damages_cents, p_status: $.data.status }
          assert:
            - "captured prov_mid == 1000000 (forecast 2026-08-15 vs contract 2026-08-10: 5 late days - 3 grace = 2 days x 500000)"
            - "captured ld_final == 0 (actual delivery 2026-08-05 is before contract date; late_days = 0)"
            - "captured p_status == DELIVERED"
            - "provisional variant value 1000000 differs from final variant value 0 for the same project"
      - name: bid_line_pricing_lump_sum_vs_time_and_materials
        grounds:
          - calculations.calc_bid_line_pricing
          - entities.WorkItem.fields.line_total_cents
          - entities.WorkItem.fields.pricing_mode
        distinguishing_aspect: |
          Entity domain: WorkItem bid pricing (different domain from the RepairProject
          LD accrual instance above). Two spec lines with identical labour content
          (7.5 hours at 9500 cents/hour) price differently under the two variants:
          LUMP_SUM yields 71250; TIME_AND_MATERIALS adds 15% marked-up materials
          (10000 -> 11500) yielding 82750.
        test_recipe:
          setup:
            - "DRAFT project with two work items of equal labour content, one priced LUMP_SUM (quantity 7.5 x 9500) and one priced TIME_AND_MATERIALS (7.5h x 9500 + 10000 materials)"
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Valve overhaul (lump)", trade_code: "MACHINERY", pricing_mode: "LUMP_SUM", duration_days: 3, quantity: 7.5, unit_price_cents: 9500 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { ls_total: $.data.line_total_cents }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Valve overhaul (T&M)", trade_code: "MACHINERY", pricing_mode: "TIME_AND_MATERIALS", duration_days: 3, estimated_hours: 7.5, hourly_rate_cents: 9500, materials_cost_cents: 10000 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { tm_total: $.data.line_total_cents }
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { bid_total: $.data.bid_total_cents }
          assert:
            - "captured ls_total == 71250 (round_half_up(7.5 x 9500))"
            - "captured tm_total == 82750 (71250 labour + round_half_up(10000 x 1.15) = 11500 marked-up materials)"
            - "captured bid_total == 154000 (71250 + 82750)"
            - "identical labour inputs price differently across the two variants: 82750 != 71250"

  # ===================================================================
  # Rule 2 — combinatorial formulas across different modes
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: liquidated_damages_tier_cap_grace_interplay
        grounds:
          - calculations.calc_liquidated_damages
          - state_machines.RepairProject.WORK_COMPLETE_to_DELIVERED
        distinguishing_aspect: |
          Mode (a): four inputs (late days, contracted price, tier table, percentage
          cap) interact non-linearly — tiered rate selection, grace subtraction, and a
          nested min against the 10% cap. Here accrued (58 chargeable days x 500000 =
          29000000) exceeds the cap (10% of 60000000 = 6000000), so the cap branch
          wins and LD lands exactly at 6000000.
        test_recipe:
          setup:
            - "IN_DOCK project, contracted price 60000000 cents (tier-2 rate 500000/day), contract delivery 2026-08-10"
            - "Actual delivery slips to 2026-10-10: 61 calendar days late, 58 chargeable after the 3-day grace"
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Hull plate renewal", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 14, quantity: 100, unit_price_cents: 600000 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { w_id: $.data.id }
            - call: "POST /v1/repair-projects/${p_id}/submit-bid"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/award"
              as: CommercialApprover
              as_user_id: "comm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-20T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_id: $.data.id }
            - call: "POST /v1/dock-reservations/${r_id}/activate"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T09:00:00Z" }
              as: YardAdmin
            - call: "POST /v1/work-items/${w_id}/start"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/work-items/${w_id}/complete"
              as: ProjectManager
              as_user_id: "pm_1"
          trigger:
            - call: "POST /v1/repair-projects/${p_id}/deliver"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { ld_final: $.data.liquidated_damages_cents, rate: $.data.ld_daily_rate_cents }
          assert:
            - "captured rate == 500000 (tier 2: 50000000 <= 60000000 <= 200000000)"
            - "captured ld_final == 6000000 (accrued 58 x 500000 = 29000000 exceeds cap 0.10 x 60000000 = 6000000; nested min selects the cap)"
      - name: bid_subtotal_per_line_rounding_then_sum
        grounds:
          - calculations.calc_bid_line_pricing
          - entities.RepairProject.fields.bid_total_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order (different mode from the tiered/min
          formula above): each line is rounded to integer cents BEFORE summation.
          Two lines of round_half_up(1.008 x 550) = 554 each sum to 1108, whereas
          the rejected sum-then-round order yields round_half_up(1108.8) = 1109.
        test_recipe:
          setup:
            - "DRAFT project with two LUMP_SUM items of quantity 1.008 at 550 cents each; raw products are 554.4 cents apiece"
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Blast zone A", trade_code: "COATINGS", pricing_mode: "LUMP_SUM", duration_days: 2, quantity: 1.008, unit_price_cents: 550 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { line_a: $.data.line_total_cents }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Blast zone B", trade_code: "COATINGS", pricing_mode: "LUMP_SUM", duration_days: 2, quantity: 1.008, unit_price_cents: 550 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { line_b: $.data.line_total_cents }
          trigger:
            - call: "POST /v1/repair-projects/${p_id}/submit-bid"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { bid_total: $.data.bid_total_cents }
          assert:
            - "captured line_a == 554 and captured line_b == 554 (per-line round_half_up of 554.4)"
            - "captured bid_total == 1108 (554 + 554), NOT 1109 which the sum-then-round order would produce"

  # ===================================================================
  # Rule 3 — non-linear state machines on different entities
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: change_order_reject_revise_resubmit_cycle
        grounds:
          - state_machines.ChangeOrder.UNDER_REVIEW_to_REJECTED
          - state_machines.ChangeOrder.REJECTED_to_UNDER_REVIEW
          - state_machines.ChangeOrder.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          ChangeOrder is cyclic: UNDER_REVIEW -> REJECTED -> UNDER_REVIEW -> APPROVED
          traverses the negotiation loop, and revising reprices the order (200000 ->
          300000) and clears recorded approvals before the cycle closes.
        test_recipe:
          setup:
            - "IN_DOCK project (contracted price 49900000 via one item 99.8 x 500000) with a change order proposed by pm_1 at cost 200000"
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Hull plate renewal", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 14, quantity: 99.8, unit_price_cents: 500000 }
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/submit-bid"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/award"
              as: CommercialApprover
              as_user_id: "comm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-20T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_id: $.data.id }
            - call: "POST /v1/dock-reservations/${r_id}/activate"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v2: $.data.version }
            - call: "POST /v1/change-orders"
              payload: { project_id: "${p_id}", expected_project_version: "${p_v2}", description: "Additional steel renewal found on opening", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 2, schedule_delta_days: 0, quantity: 0.4, unit_price_cents: 500000 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { co_id: $.data.id, co_cost: $.data.proposed_cost_cents }
          trigger:
            - call: "POST /v1/change-orders/${co_id}/reject"
              payload: { reason: "price too high" }
              as: CommercialApprover
              as_user_id: "comm_1"
              captures: { st_rej: $.data.status }
            - call: "POST /v1/change-orders/${co_id}/revise"
              payload: { quantity: 0.6 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { st_rev: $.data.status, co_cost2: $.data.proposed_cost_cents }
            - call: "POST /v1/change-orders/${co_id}/approve"
              as: CommercialApprover
              as_user_id: "comm_1"
              captures: { st_app: $.data.status }
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { price_after: $.data.contracted_price_cents }
          assert:
            - "captured co_cost == 200000 (round_half_up(0.4 x 500000))"
            - "captured st_rej == REJECTED"
            - "captured st_rev == UNDER_REVIEW and captured co_cost2 == 300000 (repriced at 0.6 x 500000) and approvals cleared"
            - "captured st_app == APPROVED"
            - "captured price_after == 50200000 (49900000 + 300000)"
      - name: survey_fail_then_resurvey_branch
        grounds:
          - state_machines.Survey.SCHEDULED_to_FAILED
          - state_machines.Survey.SCHEDULED_to_PASSED
          - state_machines.RepairProject.IN_DOCK_to_WORK_COMPLETE
        distinguishing_aspect: |
          Survey is a branching machine (SCHEDULED forks to PASSED or FAILED with
          divergent side-effect sets) and the re-survey loop runs across instances:
          the FAILED survey is terminal (a second record-result is rejected) while a
          freshly booked Survey of the same type carries the project forward.
        test_recipe:
          setup:
            - "IN_DOCK project with required_survey_types [USCG_INSPECTION]; its single work item is COMPLETE, so only the survey gate holds the project in IN_DOCK"
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10", required_survey_types: ["USCG_INSPECTION"] }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Propeller polish", trade_code: "MACHINERY", pricing_mode: "LUMP_SUM", duration_days: 3, quantity: 1, unit_price_cents: 800000 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { w_id: $.data.id }
            - call: "POST /v1/repair-projects/${p_id}/submit-bid"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/award"
              as: CommercialApprover
              as_user_id: "comm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-20T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_id: $.data.id }
            - call: "POST /v1/dock-reservations/${r_id}/activate"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/work-items/${w_id}/start"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/work-items/${w_id}/complete"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/surveys"
              payload: { project_id: "${p_id}", survey_type: "USCG_INSPECTION", scheduled_start_utc: "2026-08-02T09:00:00Z", scheduled_end_utc: "2026-08-02T12:00:00Z" }
              as: ClassSurveyor
              as_user_id: "sv_1"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /v1/surveys/${s1_id}/record-result"
              payload: { result: "FAILED", deficiency_count: 2 }
              as: ClassSurveyor
              as_user_id: "sv_1"
              captures: { s1_status: $.data.status }
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_status_mid: $.data.status }
            - call: "POST /v1/surveys"
              payload: { project_id: "${p_id}", survey_type: "USCG_INSPECTION", scheduled_start_utc: "2026-08-03T09:00:00Z", scheduled_end_utc: "2026-08-03T10:00:00Z" }
              as: ClassSurveyor
              as_user_id: "sv_1"
              captures: { s2_id: $.data.id }
            - call: "POST /v1/surveys/${s2_id}/record-result"
              payload: { result: "PASSED" }
              as: ClassSurveyor
              as_user_id: "sv_1"
              captures: { s2_status: $.data.status }
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_status_end: $.data.status }
            - call: "POST /v1/surveys/${s1_id}/record-result"
              payload: { result: "PASSED" }
              as: ClassSurveyor
              as_user_id: "sv_1"
              captures: { re_record_err: $.data.error_id }
          assert:
            - "captured s1_status == FAILED (branch taken with deficiency_count 2)"
            - "captured p_status_mid == IN_DOCK (FAILED branch does not release the project)"
            - "captured s2_status == PASSED on the replacement survey (re-survey loop across instances)"
            - "captured p_status_end == WORK_COMPLETE (PASSED branch fires the completion cascade)"
            - "captured re_record_err == ERR_INVALID_STATE (FAILED is terminal; the original survey cannot be re-recorded)"

  # ===================================================================
  # Rule 4 — transitive cascades from different triggers
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: change_order_approval_price_ripple
        grounds:
          - state_machines.ChangeOrder.UNDER_REVIEW_to_APPROVED
          - calculations.calc_bid_line_pricing
          - calculations.calc_liquidated_damages
          - entities.RepairProject.fields.contracted_price_cents
          - entities.RepairProject.fields.ld_daily_rate_cents
        distinguishing_aspect: |
          Depth-3 chain triggered by change-order approval: approval materialises a
          growth WorkItem (link 1); the new item's cost forces
          contracted_price_cents to recompute from 49900000 to 50100000 (link 2);
          the price change crosses the 50000000 tier boundary and re-selects
          ld_daily_rate_cents 200000 -> 500000, which in turn recomputes
          provisional_ld_cents 400000 -> 1000000 (link 3). Each link is caused by
          the previous link's mutation, not by the approval directly.
        test_recipe:
          setup:
            - "IN_DOCK project, docked 2026-08-01, contracted price 49900000 (tier-1 LD rate 200000/day), one 14-day work item so forecast delivery is 2026-08-15 against contract 2026-08-10 (2 chargeable days -> provisional LD 400000)"
            - "Growth work discovered: LUMP_SUM 0.4 x 500000 = 200000, schedule delta 0 days, duration 2 days (does not extend the critical path)"
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Hull plate renewal", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 14, quantity: 99.8, unit_price_cents: 500000 }
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/submit-bid"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/award"
              as: CommercialApprover
              as_user_id: "comm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-20T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_id: $.data.id }
            - call: "POST /v1/dock-reservations/${r_id}/activate"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { price_pre: $.data.contracted_price_cents, rate_pre: $.data.ld_daily_rate_cents, prov_pre: $.data.provisional_ld_cents, p_v2: $.data.version }
            - call: "POST /v1/change-orders"
              payload: { project_id: "${p_id}", expected_project_version: "${p_v2}", description: "Growth steel work", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 2, schedule_delta_days: 0, quantity: 0.4, unit_price_cents: 500000 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /v1/change-orders/${co_id}/approve"
              as: CommercialApprover
              as_user_id: "comm_1"
              captures: { co_status: $.data.status }
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { price_post: $.data.contracted_price_cents, rate_post: $.data.ld_daily_rate_cents, prov_post: $.data.provisional_ld_cents }
            - call: "GET /v1/work-items"
              payload: { origin_change_order_id: "${co_id}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { growth_total: "$.data[0].line_total_cents", growth_kind: "$.data[0].origin_kind"}
          assert:
            - "captured price_pre == 49900000 and rate_pre == 200000 and prov_pre == 400000"
            - "captured co_status == APPROVED"
            - "captured growth_kind == CHANGE_ORDER and growth_total == 200000 (link 1: growth item materialised)"
            - "captured price_post == 50100000 (link 2: 49900000 + 200000)"
            - "captured rate_post == 500000 (link 3a: 50100000 crosses the 50000000 tier boundary)"
            - "captured prov_post == 1000000 (link 3b: 2 chargeable days x 500000)"
      - name: final_survey_pass_undocks_project
        grounds:
          - state_machines.Survey.SCHEDULED_to_PASSED
          - state_machines.RepairProject.IN_DOCK_to_WORK_COMPLETE
          - state_machines.DockReservation.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          Depth-2 chain with a different trigger than change-order approval: the
          surveyor's record-result PASSED mutates the Survey (link 0); that mutation
          re-evaluates the project gate and auto-transitions RepairProject IN_DOCK ->
          WORK_COMPLETE (link 1); the project transition itself releases the ACTIVE
          DockReservation, setting status RELEASED with released_at_utc stamped
          (link 2) — the reservation is mutated by the project transition, not by
          the survey call directly.
        test_recipe:
          setup:
            - "IN_DOCK project with required_survey_types [CLASS_RENEWAL]; all work items COMPLETE; one CLASS_RENEWAL survey SCHEDULED; reservation ACTIVE"
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10", required_survey_types: ["CLASS_RENEWAL"] }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Propeller polish", trade_code: "MACHINERY", pricing_mode: "LUMP_SUM", duration_days: 3, quantity: 1, unit_price_cents: 800000 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { w_id: $.data.id }
            - call: "POST /v1/repair-projects/${p_id}/submit-bid"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/award"
              as: CommercialApprover
              as_user_id: "comm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-20T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_id: $.data.id }
            - call: "POST /v1/dock-reservations/${r_id}/activate"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/work-items/${w_id}/start"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/work-items/${w_id}/complete"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_status_gate: $.data.status }
            - call: "POST /v1/surveys"
              payload: { project_id: "${p_id}", survey_type: "CLASS_RENEWAL", scheduled_start_utc: "2026-08-02T09:00:00Z", scheduled_end_utc: "2026-08-02T12:00:00Z" }
              as: ClassSurveyor
              as_user_id: "sv_1"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /v1/surveys/${s_id}/record-result"
              payload: { result: "PASSED" }
              as: ClassSurveyor
              as_user_id: "sv_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_status: $.data.status }
            - call: "GET /v1/dock-reservations/${r_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_status: $.data.status }
          assert:
            - "captured p_status_gate == IN_DOCK (completion withheld while the required survey is not PASSED)"
            - "captured p_status == WORK_COMPLETE (link 1: survey PASSED auto-completes the project)"
            - "captured r_status == RELEASED (link 2: the project transition — not the survey call directly — released the reservation)"

  # ===================================================================
  # Rule 5 — validation priority conflicts across different error-category pairs
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_rejected_over_budget_change_order_returns_state_error
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors[ERR_CHANGE_ORDER_NOT_REVIEWABLE]
          - errors[ERR_CHANGE_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): the change order is
          REJECTED (state violation, priority 5) AND its 200000-cent cost exceeds
          the project's 100000-cent change budget (fiscal violation, priority 11).
          The state error ERR_CHANGE_ORDER_NOT_REVIEWABLE must win.
        test_recipe:
          setup:
            - "IN_DOCK project with change_budget_cents 100000; a 200000-cent change order has been REJECTED by the commercial approver"
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10", change_budget_cents: 100000 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Hull plate renewal", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 14, quantity: 99.8, unit_price_cents: 500000 }
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/submit-bid"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/award"
              as: CommercialApprover
              as_user_id: "comm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-20T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_id: $.data.id }
            - call: "POST /v1/dock-reservations/${r_id}/activate"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v2: $.data.version }
            - call: "POST /v1/change-orders"
              payload: { project_id: "${p_id}", expected_project_version: "${p_v2}", description: "Growth steel work", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 2, schedule_delta_days: 0, quantity: 0.4, unit_price_cents: 500000 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { co_id: $.data.id }
            - call: "POST /v1/change-orders/${co_id}/reject"
              payload: { reason: "not justified" }
              as: CommercialApprover
              as_user_id: "comm_1"
          trigger:
            - call: "POST /v1/change-orders/${co_id}/approve"
              as: CommercialApprover
              as_user_id: "comm_2"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_CHANGE_ORDER_NOT_REVIEWABLE (priority-5 state check beats the priority-11 ERR_CHANGE_BUDGET_EXCEEDED that the 200000 > 100000 budget overrun would also produce)"
      - name: start_hot_work_without_permit_and_unmet_dependency_returns_safety_error
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_HOT_WORK_PERMIT_REQUIRED]
          - errors[ERR_DEPENDENCY_NOT_MET]
        distinguishing_aspect: |
          Error-category pair (business_safety vs business_referential — a different
          pair from state-vs-fiscal above): the hot-work start violates both the
          missing-permit safety gate (priority 7) and the incomplete-dependency
          referential gate (priority 10); the safety error must win.
        test_recipe:
          setup:
            - "IN_DOCK project; work item A (2d) not started; hot-work item B depends on A; no HOT_WORK permit exists"
          setup_api_calls:
