            - call: "POST /pla-claims/${claim_id}/transcript-posting"
              payload: { posted_term: "2026FA" }
              as: Registrar
              captures: { post_status: "$.data.credit_status", post_term: "$.data.posted_term" }
          trigger:
            - call: "POST /pla-claims/${claim_id}/transcript-posting"
              payload: { posted_term: "2027SP" }
              as: Registrar
          assert:
            - "the first posting returned credit_status == POSTED, posted_term == 2026FA, posted_credits == 6 and moved Student.${stu_id} to pla_credits_awarded 0 / pla_credits_posted 6"
            - "the trigger returns status 409 with data.error_id == ERR_CREDIT_ALREADY_POSTED and posted_term stays 2026FA"
            - "POST /pla-claims/${claim_id}/request-revision {revision_note: 'Reopen'} returns 409 ERR_CLAIM_NOT_UNDER_ASSESSMENT"
            - "POST /pla-claims/${claim_id}/award {expected_student_version: <current>, credits_awarded: 6} returns 409 ERR_CLAIM_NOT_SCORED"
            - "POST /pla-claims/${claim_id}/deny {denial_reason: 'Reconsidered'} returns 409 ERR_CLAIM_NOT_SCORED"
            - "POST /appeals {claim_id: ${claim_id}, grounds: 'Wanted more credits'} returns 409 ERR_CLAIM_NOT_DENIED"
            - "POST /pla-claims/${claim_id}/submit returns 409 ERR_CLAIM_ALREADY_TERMINAL"
            - "the same reversal call issued before the first posting returned 409 ERR_CREDIT_NOT_POSTED, and issued now returns 200 with credit_status == REVERSED"
            - "requesting an assignment on a DRAFT claim of a second student returns 409 ERR_CLAIM_NOT_SUBMITTED"
            - "posting a claim that has only reached SCORED returns 409 ERR_CLAIM_NOT_AWARDED"
            - "POST /assessor-assignments/${asg_id}/complete {recommendation: PASS} returns 409 ERR_ASSIGNMENT_NOT_ACCEPTED because that assignment is already COMPLETED"

      - name: award_limit_family_is_rejected_by_recommendation_then_level_then_cap
        claim_type: triggerable
        grounds:
          - validations[priority 37].ERR_AWARD_EXCEEDS_RECOMMENDATION
          - validations[priority 37].ERR_LEVEL_MISMATCH
          - validations[priority 38].ERR_UPPER_DIVISION_CAP_EXCEEDED
          - entities.ArticulationRule.fields.awarded_credits
          - endpoints[POST /pla-claims/{claim_id}/award]
        distinguishing_aspect: |
          The pinned rule caps the award at 3 credits even though the course carries
          6, so awarding 6 returns ERR_AWARD_EXCEEDS_RECOMMENDATION (422) at
          priority 37; the same call becomes ERR_LEVEL_MISMATCH when the pinned
          recommendation's recommended_level is LOWER against this UPPER course, and
          only after both pass does the priority-38 upper-division cap speak.
        test_recipe:
          setup:
            - "Program BSCS-U: total 120, residency_min 30, pla_max_credits 30, pla_max_pct_bp 2500, pla_upper_division_max_credits 3."
