              as: ProgramAdministrator
          assert:
            - "trigger call 1 returns 400 ERR_INVALID_REQUEST naming severity"
            - "trigger call 2 returns 400 ERR_INVALID_REQUEST naming category"
            - "trigger call 3 returns 400 ERR_INVALID_REQUEST because limit exceeds the declared maximum 100"
            - "ChecklistTemplate.${tpl}.point_count == 0 and critical_item_count == 0 afterwards"

      - name: immutable_child_rows_carry_no_version_field
