      - name: remedy_on_a_clean_delivered_order_is_refused
        claim_type: violation_to_error
        grounds:
          - "validations[priority=61]"
          - "errors.ERR_INVALID_STATE_TRANSITION"
          - "state_machines.DeliveryOrder.DELIVERED_to_REFUNDED"
          - "entities.DeliveryOrder.fields.exception_reason"
        distinguishing_aspect: >-
          A remedy is gated on a latched exception rather than on the order state, so an order that was
          delivered before its promise has exception_reason null and its REFUND is refused with 409
          ERR_INVALID_STATE_TRANSITION even though DELIVERED -> REFUNDED is a declared edge; nothing is
          spent from the zone budget and no remedy fields are written.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z, advanced to 2026-08-03T09:12:00.000Z before completion"
            - "ServiceZone Z1 PERMITTED with remedy_budget_cents 50000 and remedy_spent_cents 0"
            - "order O1 promised 2026-08-03T09:40:00.000Z and completed at 09:12, so no LATE latch happened"
            - "order O1 is DELIVERED with settled_fee_cents 817 and exception_reason null"
            - "Merchant M1 has recognized_fee_cents 850 and exception_count 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /sidewalk-segments"
