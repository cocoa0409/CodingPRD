# =============================================================================
# §1.9 Scaffold Corner Design — coverage index for NON-difficulty tests
# Task: task_2660_firm_quality_control_peer_review
# Companion to SCAFFOLD.yaml (§1.0-§1.7); breadth probe over
# references/claim-extraction-guide.md. Every literal below is pre-computed
# against the §1.3 constants; the logical clock starts at 2026-08-01T00:00:00Z.
#
# Shared setup ladder (YAML anchors, defined at first use, reused by alias):
#   k_clock -> k_firm -> k_eqrp/k_mp/k_ep/k_qcd -> k_eng (REVIEW, no EQR)
#   -> k_eng_fw/k_eng_eqrp/k_eng_cleared/k_eng_released -> k_insp/k_insp_select
#   -> k_eng2 (ERISA_AUDIT, EQR required) -> EQR chain -> finding/RCA/plan chain
#   -> peer reviewer/peer review chain.
# Firm under test: "Harbor & Vance LLP", TX, aa_hours_last_year 9000.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: firm_create_returns_declared_defaults_and_version_one
        claim_type: Creation
        grounds:
          - entities.Firm
          - endpoints."POST /firms"
          - response_envelope.success_shape
        distinguishing_aspect: >-
          A Firm is born with every §1.1 computed field at its declared default
          (risk_posture STABLE, three counters 0, last_peer_review_rating NONE,
          prior_reviewer_ids [], unassigned_review_flag false) and version 1.
          An implementation that lazily leaves counters null, omits
          unassigned_review_flag, or starts version at 0 fails here.
        test_recipe:
          setup:
            - "Logical clock pinned to the declared startup instant."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-01"
          trigger:
            - &k_firm
              call: "POST /firms"
              payload:
                legal_name: "Harbor & Vance LLP"
                state_code: "TX"
                aa_hours_last_year: 9000
                enrolled_program: "AICPA_PRC"
                peer_review_year_end: "2026-06-30"
              as: SystemAdmin
              as_user_id: "sysadmin-01"
              captures: { firm_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "data.risk_posture == \"STABLE\""
            - "data.open_deficiency_count == 0 and data.open_material_failure_count == 0 and data.critical_risk_count == 0"
            - "data.last_peer_review_rating == \"NONE\""
            - "data.prior_reviewer_ids == [] and data.unassigned_review_flag == false"
            - "data.version == 1 and data.id is a non-empty string"

      - name: partner_get_round_trips_designations_and_computes_eqr_eligible
        claim_type: Retrieval
        grounds:
          - entities.Partner.eqr_eligible
          - endpoints."GET /partners/{partner_id}"
        distinguishing_aspect: >-
          GET returns exactly what was stored AND the derived eqr_eligible flag,
          which is true only when status ACTIVE + cpe_hours_last_3y >= 120 +
          designations contains EQ_REVIEWER. 150 CPE hours with EQ_REVIEWER
          clears all three conjuncts.
        test_recipe:
          setup:
            - "One firm with one EQ-reviewer-designated partner."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - &k_eqrp
              call: "POST /firms/${firm_id}/partners"
              payload:
                full_name: "Lena Ortiz"
                cpa_license_state: "TX"
                designations: ["EQ_REVIEWER"]
                cpe_hours_last_3y: 150
              as: SystemAdmin
              as_user_id: "sysadmin-01"
              captures: { eqrp_id: "$.data.id" }
          trigger:
            - call: "GET /partners/${eqrp_id}"
              payload: {}
              as: QualityControlDirector
              as_user_id: "sysadmin-01"
          assert:
            - "HTTP 200"
            - "data.full_name == \"Lena Ortiz\" and data.cpa_license_state == \"TX\""
            - "data.designations == [\"EQ_REVIEWER\"] and data.cpe_hours_last_3y == 150"
            - "data.eqr_eligible == true and data.status == \"ACTIVE\""
            - "data.open_eqr_count == 0 and data.open_engagement_count == 0 and data.last_inspected_year == null"

      - name: engagements_list_filters_by_workflow_state_and_paginates
        claim_type: Listing
        grounds:
          - endpoints."GET /engagements"
          - response_envelope.pagination_fields
        distinguishing_aspect: >-
          The list envelope must report total_count for the FILTERED set (3
          PLANNING engagements), not the whole table, and has_more must be true
          while limit 2 leaves a third row unreturned. An implementation that
          computes total_count after slicing, or ignores the filter when
          counting, fails.
        test_recipe:
          setup:
            - "One firm, one managing partner, one engagement partner, one QC director, three PLANNING engagements."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - &k_mp
              call: "POST /firms/${firm_id}/partners"
              payload:
                full_name: "Dana Vance"
                cpa_license_state: "TX"
                designations: ["MANAGING_PARTNER"]
                cpe_hours_last_3y: 40
              as: SystemAdmin
              as_user_id: "sysadmin-01"
              captures: { mp_id: "$.data.id" }
            - &k_ep
              call: "POST /firms/${firm_id}/partners"
              payload:
                full_name: "Ravi Shah"
                cpa_license_state: "TX"
                designations: ["ENGAGEMENT_PARTNER"]
                cpe_hours_last_3y: 60
              as: SystemAdmin
              as_user_id: "sysadmin-01"
              captures: { ep_id: "$.data.id" }
            - &k_qcd
              call: "POST /firms/${firm_id}/partners"
              payload:
                full_name: "Marcus Bell"
                cpa_license_state: "TX"
                designations: ["QC_DIRECTOR"]
                cpe_hours_last_3y: 80
              as: SystemAdmin
              as_user_id: "sysadmin-01"
              captures: { qcd_id: "$.data.id" }
            - &k_eng
              call: "POST /engagements"
              payload:
                firm_id: "${firm_id}"
                client_name: "Aurora Metals Inc"
                engagement_type: "REVIEW"
                period_end: "2026-03-31"
                engagement_partner_id: "${ep_id}"
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
              captures: { eng_id: "$.data.id" }
            - call: "POST /engagements"
              payload:
                firm_id: "${firm_id}"
                client_name: "Calder Foods LLC"
                engagement_type: "REVIEW"
                period_end: "2026-03-31"
                engagement_partner_id: "${ep_id}"
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
            - call: "POST /engagements"
              payload:
                firm_id: "${firm_id}"
                client_name: "Dunmore Paper Co"
                engagement_type: "ATTESTATION"
                period_end: "2026-03-31"
                engagement_partner_id: "${ep_id}"
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
          trigger:
            - call: "GET /engagements"
              payload: { firm_id: "${firm_id}", workflow_state: "PLANNING", limit: 2, offset: 0 }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
          assert:
            - "HTTP 200"
            - "len(data) == 2"
            - "meta.total_count == 3 and meta.has_more == true"
            - "meta.limit == 2 and meta.offset == 0"
            - "every returned row has workflow_state == \"PLANNING\" and file_state == \"OPEN\""

      - name: peer_review_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors.ERR_PEER_REVIEW_NOT_FOUND
          - endpoints."GET /peer-reviews/{peer_review_id}"
        distinguishing_aspect: >-
          A syntactically valid but unknown path id must yield the entity's OWN
          404 id (ERR_PEER_REVIEW_NOT_FOUND), not a generic 404 and not 500.
        test_recipe:
          setup:
            - "Nothing but a clock — path-existence checks precede everything except auth."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /peer-reviews/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PeerReviewCommittee
              as_user_id: "prc-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "error_id == \"ERR_PEER_REVIEW_NOT_FOUND\""
            - "response carries the §1.0 error envelope (error_id + message)"

      - name: engagement_create_missing_period_end_is_rejected
        claim_type: Required Fields
        grounds:
          - entities.Engagement.period_end
          - validations."shape/required fields"
          - errors.ERR_VALIDATION_FAILED
        distinguishing_aspect: >-
          period_end has source input with no default, so omitting it is a shape
          failure (422 ERR_VALIDATION_FAILED) that must fire BEFORE any FK or
          business rule work; no Engagement row may be created.
        test_recipe:
          setup:
            - "Firm plus managing/engagement partners exist so only the missing field is at fault."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
          trigger:
            - call: "POST /engagements"
              payload:
                firm_id: "${firm_id}"
                client_name: "Aurora Metals Inc"
                engagement_type: "REVIEW"
                engagement_partner_id: "${ep_id}"
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "error_id == \"ERR_VALIDATION_FAILED\""
            - "a follow-up GET /engagements?firm_id=${firm_id} returns meta.total_count == 0"

      - name: partner_create_omitting_optional_input_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Partner.designations
          - entities.Partner.cpe_hours_last_3y
          - entities.Partner.status
        distinguishing_aspect: >-
          Every optional Partner input has a declared default: arrays default to
          [] (not null), cpe_hours_last_3y to 0, status to ACTIVE — and with
          those defaults eqr_eligible must be false because EQ_REVIEWER is
          absent AND cpe is below the 120 gate.
        test_recipe:
          setup:
            - "One firm; create a partner with only the two required fields."
          setup_api_calls:
            - *k_clock
            - *k_firm
          trigger:
            - call: "POST /firms/${firm_id}/partners"
              payload: { full_name: "Priya Raman", cpa_license_state: "TX" }
              as: SystemAdmin
              as_user_id: "sysadmin-01"
              captures: { plain_partner_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "data.designations == [] and data.industry_specializations == []"
            - "data.prior_engagement_team_clients == [] and data.independence_conflict_client_names == []"
            - "data.cpe_hours_last_3y == 0 and data.status == \"ACTIVE\""
            - "data.eqr_eligible == false and data.last_inspected_year == null and data.version == 1"

      - name: engagement_create_computes_risk_score_and_eqr_required
        claim_type: Computed Fields
        grounds:
          - calculations.engagement_risk_score
          - calculations.eqr_required_determination
          - entities.Engagement.risk_score
        distinguishing_aspect: >-
          ERISA_AUDIT 30 + first-year 15 + min(20, 4*2)=8 = 53 base, load_penalty
          0, specialization credit 10 (partner holds EBP and SPEC_FOR_TYPE
          [ERISA_AUDIT] == EBP) => risk_score 43, and eqr_required is true from
          the engagement-type clause alone even though 43 < 70. Pins the nested
          prior-finding cap, the spec credit and the OR-clause independence.
        test_recipe:
          setup:
            - "One firm (posture STABLE), a managing partner, and an EBP-specialized engagement partner with no open engagements."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - &k_ep_ebp
              call: "POST /firms/${firm_id}/partners"
              payload:
                full_name: "Tomas Iglesias"
                cpa_license_state: "TX"
                designations: ["ENGAGEMENT_PARTNER"]
                industry_specializations: ["EBP"]
                cpe_hours_last_3y: 60
              as: SystemAdmin
              as_user_id: "sysadmin-01"
              captures: { ep_ebp_id: "$.data.id" }
          trigger:
            - call: "POST /engagements"
              payload:
                firm_id: "${firm_id}"
                client_name: "Sable Retirement Plan"
                engagement_type: "ERISA_AUDIT"
                period_end: "2026-04-30"
                engagement_partner_id: "${ep_ebp_id}"
                is_first_year_client: true
                prior_finding_count_3y: 2
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
          assert:
            - "HTTP 201"
            - "data.risk_score == 43"
            - "data.eqr_required == true"
            - "data.workflow_state == \"PLANNING\" and data.file_state == \"OPEN\""
            - "a follow-up GET /partners/${ep_ebp_id} returns open_engagement_count == 1"

      - name: finding_create_extra_classification_field_is_ignored_input
        claim_type: System Fields
        grounds:
          - entities.InspectionFinding.classification
          - entities.InspectionFinding.state
          - endpoints."POST /inspection-selections/{selection_id}/findings"
        distinguishing_aspect: >-
          classification, pervasiveness, affects_report_conclusion, class_points
          and state are §1.1 system/computed fields written only by the dedicated
          classification endpoint; a create body that smuggles them in must not
          move the row off UNCLASSIFIED / UNDETERMINED / IDENTIFIED / 0.
        test_recipe:
          setup:
            - "Concluded selection ladder: released engagement selected into an IN_PROGRESS 2026 inspection."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - &k_eng_fw
              call: "POST /engagements/${eng_id}/workflow-transitions"
              payload: { to_state: "FIELDWORK" }
              as: EngagementPartner
              as_user_id: "${ep_id}"
            - &k_eng_eqrp
              call: "POST /engagements/${eng_id}/workflow-transitions"
              payload: { to_state: "EQR_PENDING" }
              as: EngagementPartner
              as_user_id: "${ep_id}"
            - &k_eng_cleared
              call: "POST /engagements/${eng_id}/workflow-transitions"
              payload: { to_state: "EQR_CLEARED" }
              as: EngagementPartner
              as_user_id: "${ep_id}"
            - &k_eng_released
              call: "POST /engagements/${eng_id}/workflow-transitions"
              payload: { to_state: "REPORT_RELEASED" }
              as: EngagementPartner
              as_user_id: "${ep_id}"
              captures: { eng_v_rel: "$.data.version" }
            - &k_insp
              call: "POST /firms/${firm_id}/internal-inspections"
              payload: { inspection_year: 2026, target_engagement_count: 1 }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { insp_id: "$.data.id" }
            - &k_insp_select
              call: "POST /internal-inspections/${insp_id}/selections"
              payload: {}
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
            - &k_sel_lookup
              call: "GET /inspection-selections"
              payload: { inspection_id: "${insp_id}" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { sel_id: "$.data[0].id" }
            - &k_insp_inprog
              call: "POST /internal-inspections/${insp_id}/transitions"
              payload: { to_state: "IN_PROGRESS" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
          trigger:
            - call: "POST /inspection-selections/${sel_id}/findings"
              payload:
                title: "Group audit instructions undocumented"
                sqm_component: "ENGAGEMENT_PERFORMANCE"
                classification: "MATERIAL_FAILURE"
                state: "VERIFIED"
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
          assert:
            - "HTTP 201 (unknown keys ignored, not 422)"
            - "data.classification == \"UNCLASSIFIED\" and data.pervasiveness == \"UNDETERMINED\""
            - "data.affects_report_conclusion == false and data.class_points == 0"
            - "data.state == \"IDENTIFIED\" and data.prior_cycle_recurrence == false"
            - "a follow-up GET /firms/${firm_id} shows open_material_failure_count == 0"

      - name: partner_patch_unknown_designation_returns_invalid_enum
        claim_type: Type Constraints
        grounds:
          - entities.Partner.designations
          - errors.ERR_INVALID_ENUM_VALUE
        distinguishing_aspect: >-
          designations is a constrained array: an element outside
          {MANAGING_PARTNER, ENGAGEMENT_PARTNER, QC_DIRECTOR, EQ_REVIEWER} is
          422 ERR_INVALID_ENUM_VALUE, distinct from the generic
          ERR_VALIDATION_FAILED used for range/length failures.
        test_recipe:
          setup:
            - "One firm with one partner."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_eqrp
          trigger:
            - call: "PATCH /partners/${eqrp_id}"
              payload: { designations: ["CHIEF_AUDITOR"] }
              as: SystemAdmin
              as_user_id: "sysadmin-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "error_id == \"ERR_INVALID_ENUM_VALUE\""
            - "a follow-up GET /partners/${eqrp_id} still returns designations == [\"EQ_REVIEWER\"] and version == 1"

      - name: quality_risk_create_likelihood_above_range_is_rejected
        claim_type: Type Constraints
        grounds:
          - entities.QualityRisk.likelihood
          - errors.ERR_VALIDATION_FAILED
        distinguishing_aspect: >-
          likelihood/impact are 1..5 integers; 6 is a numeric-range failure
          (ERR_VALIDATION_FAILED, priority band 10-12) and must be caught before
          inherent_risk_score is ever computed, so no QualityRisk row appears.
        test_recipe:
          setup:
            - "One firm with a QC director."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_qcd
          trigger:
            - call: "POST /firms/${firm_id}/quality-risks"
              payload:
                component: "ENGAGEMENT_PERFORMANCE"
                quality_objective_code: "EP-01"
                risk_statement: "Insufficient review of significant judgements."
                likelihood: 6
                impact: 4
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "error_id == \"ERR_VALIDATION_FAILED\""
            - "a follow-up GET /quality-risks?firm_id=${firm_id} returns meta.total_count == 0"

      - name: engagement_create_with_foreign_firm_partner_is_rejected
        claim_type: Parent Relationships
        grounds:
          - validations."partner firm ownership"
          - errors.ERR_PARTNER_FIRM_MISMATCH
        distinguishing_aspect: >-
          engagement_partner_id must resolve AND belong to the same firm as the
          nested firm_id. A partner of another firm exists (so it is not a 404)
          but is still refused with 409 ERR_PARTNER_FIRM_MISMATCH — referential
          integrity across the graph, not mere existence.
        test_recipe:
          setup:
            - "Two firms; the engagement partner cited belongs to firm B while the engagement is created under firm A."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - &k_firm_b
              call: "POST /firms"
              payload:
                legal_name: "Northgate Audit Group"
                state_code: "NV"
                aa_hours_last_year: 400
                peer_review_year_end: "2026-06-30"
              as: SystemAdmin
              as_user_id: "sysadmin-01"
              captures: { firm_b_id: "$.data.id" }
            - &k_ep_b
              call: "POST /firms/${firm_b_id}/partners"
              payload:
                full_name: "Owen Fairchild"
                cpa_license_state: "NV"
                designations: ["ENGAGEMENT_PARTNER"]
              as: SystemAdmin
              as_user_id: "sysadmin-01"
              captures: { ep_b_id: "$.data.id" }
          trigger:
            - call: "POST /engagements"
              payload:
                firm_id: "${firm_id}"
                client_name: "Aurora Metals Inc"
                engagement_type: "REVIEW"
                period_end: "2026-03-31"
                engagement_partner_id: "${ep_b_id}"
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "error_id == \"ERR_PARTNER_FIRM_MISMATCH\""
            - "a follow-up GET /engagements?firm_id=${firm_id} returns meta.total_count == 0"

      - name: inspection_selection_junction_is_reachable_from_both_parents
        claim_type: Parent Relationships
        grounds:
          - complexity_profile.entity_topology
          - entities.InspectionSelection
          - endpoints."GET /inspection-selections"
        distinguishing_aspect: >-
          InspectionSelection is a many-to-many junction (InternalInspection x
          Engagement). The same row must be reachable by filtering on EITHER
          parent id, and it carries junction-only payload (selection_reason,
          selected_rank, is_must_select) that neither parent stores.
        test_recipe:
          setup:
            - "Released REVIEW engagement selected into a 2026 inspection cycle."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_insp
            - *k_insp_select
            - *k_sel_lookup
          trigger:
            - call: "GET /inspection-selections"
              payload: { engagement_id: "${eng_id}" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
          assert:
            - "HTTP 200 and meta.total_count == 1"
            - "data[0].id == ${sel_id} (same row as the inspection_id-filtered read)"
            - "data[0].inspection_id == ${insp_id} and data[0].engagement_id == ${eng_id}"
            - "data[0].selected_rank == 1 and data[0].is_must_select == true and data[0].selection_reason == \"MUST_SELECT_PARTNER_COVERAGE\" (block B, partner never inspected before)"
            - "data[0].finding_count == 0 and data[0].weighted_points == 0.00"

  - section: state_machines
    instances:

      - name: quality_risk_create_is_never_observable_in_draft
        claim_type: Initial State
        grounds:
          - state_machines.QualityRisk.initial_state
          - state_machines.QualityRisk.DRAFT_to_ASSESSED
        distinguishing_aspect: >-
          DRAFT is the declared initial_state but the DRAFT -> ASSESSED hop is
          automatic inside the create request, so the create response must
          already read ASSESSED with inherent_risk_score = 5 * 5 = 25 while
          residual_risk_score is still null and severity_band NONE.
        test_recipe:
          setup:
            - "One firm with a QC director."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_qcd
          trigger:
            - &k_risk_a
              call: "POST /firms/${firm_id}/quality-risks"
              payload:
                component: "ENGAGEMENT_PERFORMANCE"
                quality_objective_code: "EP-01"
                risk_statement: "Engagement teams may not obtain sufficient appropriate evidence over significant estimates."
                likelihood: 5
                impact: 5
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { risk_a_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "data.state == \"ASSESSED\" (never \"DRAFT\")"
            - "data.inherent_risk_score == 25"
            - "data.residual_risk_score == null and data.severity_band == \"NONE\" and data.evaluation_basis == \"NONE\""
            - "data.response_count == 0 and data.reopen_count == 0"

      - name: engagement_workflow_walks_planning_to_report_released
        claim_type: Valid Transition
        grounds:
          - state_machines.Engagement.workflow_state
          - endpoints."POST /engagements/{engagement_id}/workflow-transitions"
        distinguishing_aspect: >-
          Each of the four forward legs is driven by the engagement partner and
          bumps version by exactly 1, so a REVIEW engagement with
          eqr_required == false walks PLANNING -> FIELDWORK -> EQR_PENDING ->
          EQR_CLEARED -> REPORT_RELEASED and lands on version 5 with
          eqr_concurred_at still null (no EQR was required).
        test_recipe:
          setup:
            - "Firm, managing partner, engagement partner, one REVIEW engagement (risk_score 8, eqr_required false)."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
          trigger:
            - *k_eng_cleared
          assert:
            - "HTTP 200"
            - "data.workflow_state == \"EQR_CLEARED\" and data.file_state == \"OPEN\""
            - "data.eqr_concurred_at == null (eqr_required is false, so no CONCURRED review is needed)"
            - "data.version == 4 (create 1, FIELDWORK 2, EQR_PENDING 3, EQR_CLEARED 4)"
            - "data.risk_score == 8 and data.eqr_required == false"

      - name: report_released_stamps_release_date_and_frees_partner_load
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Engagement.EQR_CLEARED_to_REPORT_RELEASED.side_effects
          - entities.Partner.open_engagement_count
        distinguishing_aspect: >-
          The release leg has two observable side effects beyond the state
          change: report_release_date takes the DATE part of the logical clock
          (2026-08-01, not the full instant) and the partner's
          open_engagement_count drops to 0 because REPORT_RELEASED is outside
          the {PLANNING, FIELDWORK, EQR_PENDING, EQR_CLEARED} counted set.
        test_recipe:
          setup:
            - "REVIEW engagement walked to EQR_CLEARED with the clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
          trigger:
            - *k_eng_released
          assert:
            - "HTTP 200"
            - "data.workflow_state == \"REPORT_RELEASED\" and data.report_release_date == \"2026-08-01\""
            - "data.version == 5"
            - "a follow-up GET /partners/${ep_id} returns open_engagement_count == 0"
            - "a follow-up GET /partners/${ep_id} still returns last_inspected_year == null"

      - name: engagement_workflow_planning_to_report_released_is_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Engagement.workflow_state.transitions
          - errors.ERR_INVALID_TRANSITION
        distinguishing_aspect: >-
          PLANNING has exactly one outgoing leg (FIELDWORK); skipping straight to
          REPORT_RELEASED must be 409 ERR_INVALID_TRANSITION and must leave the
          row untouched (still PLANNING, version 1, report_release_date null) —
          no partial side effects.
        test_recipe:
          setup:
            - "One REVIEW engagement freshly created in PLANNING."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_eng
          trigger:
            - call: "POST /engagements/${eng_id}/workflow-transitions"
              payload: { to_state: "REPORT_RELEASED" }
              as: EngagementPartner
              as_user_id: "${ep_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "error_id == \"ERR_INVALID_TRANSITION\""
            - "a follow-up GET /engagements/${eng_id} returns workflow_state == \"PLANNING\", version == 1, report_release_date == null"

      - name: file_assembly_during_fieldwork_is_rejected_by_cross_dimension_guard
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Engagement.file_state.OPEN_to_ASSEMBLED.preconditions
          - complexity_profile.state_machine_shape
        distinguishing_aspect: >-
          The two Engagement dimensions are independent EXCEPT for this guard:
          OPEN -> ASSEMBLED requires workflow_state IN {EQR_CLEARED,
          REPORT_RELEASED}. With workflow_state == FIELDWORK the file leg is
          refused even though file_state is legitimately OPEN and the caller is
          the engagement partner.
        test_recipe:
          setup:
            - "REVIEW engagement moved to FIELDWORK only."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_eng
            - *k_eng_fw
          trigger:
            - call: "POST /engagements/${eng_id}/file-transitions"
              payload: { to_state: "ASSEMBLED" }
              as: EngagementPartner
              as_user_id: "${ep_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "error_id == \"ERR_INVALID_TRANSITION\""
            - "a follow-up GET /engagements/${eng_id} returns file_state == \"OPEN\" and workflow_state == \"FIELDWORK\" and version == 2"

      - name: eqr_concerns_raised_cascades_engagement_back_to_fieldwork
        claim_type: Side Effect Execution
        grounds:
          - state_machines.EngagementQualityReview.IN_PROGRESS_to_CONCERNS_RAISED.side_effects
          - state_machines.Engagement.EQR_PENDING_to_FIELDWORK
          - complexity_profile.state_machine_shape
        distinguishing_aspect: >-
          The cyclic shape: raising concerns is a cross-entity cascade that drives
          the linked engagement EQR_PENDING -> FIELDWORK, nulls eqr_concurred_at,
          bumps concern_round_count to 1 and stores last_concern_summary — all in
          the one request. The engagement is NOT left in EQR_PENDING.
        test_recipe:
          setup:
            - "ERISA_AUDIT engagement (eqr_required true) in EQR_PENDING with an IN_PROGRESS quality review held by an eligible EQ reviewer."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eqrp
            - &k_eng2
              call: "POST /engagements"
              payload:
                firm_id: "${firm_id}"
                client_name: "Borealis Pension Trust"
                engagement_type: "ERISA_AUDIT"
                period_end: "2026-04-30"
                engagement_partner_id: "${ep_id}"
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
              captures: { eng2_id: "$.data.id", eng2_v_create: "$.data.version" }
            - &k_eng2_fw
              call: "POST /engagements/${eng2_id}/workflow-transitions"
              payload: { to_state: "FIELDWORK" }
              as: EngagementPartner
              as_user_id: "${ep_id}"
              captures: { eng2_v_fw: "$.data.version" }
            - &k_eqr
              call: "POST /engagements/${eng2_id}/quality-reviews"
              payload:
                reviewer_partner_id: "${eqrp_id}"
                objectivity_attested: true
                expected_engagement_version: "${eng2_v_fw}"
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { eqr_id: "$.data.id" }
            - &k_eqr_start
              call: "POST /quality-reviews/${eqr_id}/transitions"
              payload: { to_state: "IN_PROGRESS" }
              as: EngagementQualityReviewer
              as_user_id: "${eqrp_id}"
            - &k_eng2_eqrp
              call: "POST /engagements/${eng2_id}/workflow-transitions"
              payload: { to_state: "EQR_PENDING" }
              as: EngagementPartner
              as_user_id: "${ep_id}"
          trigger:
            - &k_eqr_concerns
              call: "POST /quality-reviews/${eqr_id}/transitions"
              payload: { to_state: "CONCERNS_RAISED", concern_summary: "Group audit instructions for the plan trustee were not documented." }
              as: EngagementQualityReviewer
              as_user_id: "${eqrp_id}"
          assert:
            - "HTTP 200"
            - "data.state == \"CONCERNS_RAISED\" and data.concern_round_count == 1"
            - "data.last_concern_summary == \"Group audit instructions for the plan trustee were not documented.\""
            - "a follow-up GET /engagements/${eng2_id} returns workflow_state == \"FIELDWORK\" and eqr_concurred_at == null"
            - "a follow-up GET /partners/${eqrp_id} returns open_eqr_count == 1 (CONCERNS_RAISED is still an open review)"

      - name: finding_second_verification_returns_already_verified
        claim_type: Idempotency
        grounds:
          - errors.ERR_FINDING_ALREADY_VERIFIED
          - state_machines.InspectionFinding.REMEDIATED_to_VERIFIED
        distinguishing_aspect: >-
          Verification is not idempotent: replaying it must be refused with the
          dedicated ERR_FINDING_ALREADY_VERIFIED (409) rather than silently
          re-running the counter side effects, so Firm.open_deficiency_count
          stays 0 instead of going negative.
        test_recipe:
          setup:
            - "Full remediation ladder: released engagement -> 2026 inspection -> DEFICIENCY finding -> validated RCA -> accepted and completed plan -> finding VERIFIED once."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_insp
            - *k_insp_select
            - *k_sel_lookup
            - *k_insp_inprog
            - &k_finding
              call: "POST /inspection-selections/${sel_id}/findings"
              payload:
                title: "Review notes not cleared before report release"
                sqm_component: "ENGAGEMENT_PERFORMANCE"
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { finding_id: "$.data.id" }
            - &k_classify_def
              call: "POST /inspection-findings/${finding_id}/classification"
              payload: { classification: "DEFICIENCY", pervasiveness: "ISOLATED", affects_report_conclusion: false }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
            - &k_rca
              call: "POST /inspection-findings/${finding_id}/root-cause-analyses"
              payload:
                method: "FISHBONE"
                root_cause_category: "SUPERVISION_REVIEW"
                contributing_factor_count: 3
                narrative: "Supervisory review was performed after the report date and was not documented."
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { rca_id: "$.data.id" }
            - &k_rca_validate
              call: "POST /root-cause-analyses/${rca_id}/validation"
              payload: { outcome: "VALIDATED" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
            - &k_finding_v
              call: "GET /inspection-findings/${finding_id}"
              payload: {}
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { finding_v: "$.data.version" }
            - &k_plan
              call: "POST /inspection-findings/${finding_id}/remediation-plans"
              payload:
                root_cause_analysis_id: "${rca_id}"
                owner_partner_id: "${qcd_id}"
                target_completion_date: "2026-09-30"
                action_count: 4
                action_specificity_score: 8.00
                expected_finding_version: "${finding_v}"
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
              captures: { plan_id: "$.data.id" }
            - &k_plan_submit
              call: "POST /remediation-plans/${plan_id}/transitions"
              payload: { to_state: "SUBMITTED", completed_action_count: 4 }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
            - &k_plan_accept
              call: "POST /remediation-plans/${plan_id}/transitions"
              payload: { to_state: "ACCEPTED" }
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
            - &k_plan_completed
              call: "POST /remediation-plans/${plan_id}/transitions"
              payload: { to_state: "COMPLETED", completed_action_count: 4 }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
            - &k_finding_verify
              call: "POST /inspection-findings/${finding_id}/transitions"
              payload: { to_state: "VERIFIED" }
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
          trigger:
            - call: "POST /inspection-findings/${finding_id}/transitions"
              payload: { to_state: "VERIFIED" }
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "error_id == \"ERR_FINDING_ALREADY_VERIFIED\""
            - "a follow-up GET /inspection-findings/${finding_id} returns state == \"VERIFIED\" and reopen_count == 0"
            - "a follow-up GET /firms/${firm_id} returns open_deficiency_count == 0 (not -1) and risk_posture == \"STABLE\""

      - name: accepted_peer_review_cannot_transition_again
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.PeerReview.terminal_states
          - errors.ERR_INVALID_TRANSITION
        distinguishing_aspect: >-
          ACCEPTED is terminal: no leg leaves it, so re-issuing the report is 409
          ERR_INVALID_TRANSITION and the firm's derived
          last_peer_review_rating (PASS) must not be recomputed or duplicated.
        test_recipe:
          setup:
            - "Firm with one released REVIEW engagement, a concluded 2026 inspection, and a PASS peer review walked to ACCEPTED."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_insp
            - *k_insp_select
            - *k_insp_inprog
            - &k_insp_classified
              call: "POST /internal-inspections/${insp_id}/transitions"
              payload: { to_state: "FINDINGS_CLASSIFIED", severity_index_basis: "ENGAGEMENT_WEIGHTED" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
            - &k_insp_concluded
              call: "POST /internal-inspections/${insp_id}/transitions"
              payload: { to_state: "CONCLUDED" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
            - &k_reviewer
              call: "POST /peer-reviewers"
              payload:
                reviewer_firm_name: "Calder & Boone PC"
                license_state: "TX"
                qualified_categories: ["ERISA_AUDIT", "SINGLE_AUDIT", "BROKER_DEALER", "GOVERNMENTAL", "PUBLIC_INTEREST"]
                max_concurrent_reviews: 2
                experience_hours: 4000
              as: PeerReviewCommittee
              as_user_id: "prc-01"
              captures: { reviewer_id: "$.data.id" }
            - &k_pr
              call: "POST /firms/${firm_id}/peer-reviews"
              payload:
                review_type: "SYSTEM_REVIEW"
                year_end: "2026-06-30"
                scheduled_window_start: "2026-10-01"
                scheduled_window_end: "2026-10-15"
              as: PeerReviewCommittee
              as_user_id: "prc-01"
              captures: { pr_id: "$.data.id" }
            - &k_pr_assign
              call: "POST /peer-reviews/${pr_id}/reviewer-assignment"
              payload: { reviewer_id: "${reviewer_id}" }
              as: PeerReviewCommittee
              as_user_id: "prc-01"
            - &k_pr_scope
              call: "POST /peer-reviews/${pr_id}/scope"
              payload: {}
              as: PeerReviewer
              as_user_id: "${reviewer_id}"
              captures: { pr_v_scope: "$.data.version" }
            - &k_pr_sel
              call: "POST /peer-reviews/${pr_id}/selections"
              payload:
                engagement_id: "${eng_id}"
                hours_committed: 12
                expected_peer_review_version: "${pr_v_scope}"
              as: PeerReviewer
              as_user_id: "${reviewer_id}"
              captures: { prsel_id: "$.data.id" }
            - &k_pr_fieldwork
              call: "POST /peer-reviews/${pr_id}/transitions"
              payload: { to_state: "FIELDWORK" }
              as: PeerReviewer
              as_user_id: "${reviewer_id}"
            - &k_pr_disp_clean
              call: "POST /peer-review-selections/${prsel_id}/disposition"
              payload: { disposition: "NO_MATTER", non_conforming: false }
              as: PeerReviewer
              as_user_id: "${reviewer_id}"
            - &k_pr_rating
              call: "POST /peer-reviews/${pr_id}/transitions"
              payload: { to_state: "RATING_DRAFTED" }
              as: PeerReviewer
              as_user_id: "${reviewer_id}"
            - &k_pr_issue
              # §1.2 RATING_DRAFTED -> REPORT_ISSUED declares actor PeerReviewer with
              # X-User-ID == assigned_reviewer_id, so the leg is driven by the reviewer.
              call: "POST /peer-reviews/${pr_id}/transitions"
              payload: { to_state: "REPORT_ISSUED" }
              as: PeerReviewer
              as_user_id: "${reviewer_id}"
            - &k_pr_accept
              call: "POST /peer-reviews/${pr_id}/transitions"
              payload: { to_state: "ACCEPTED" }
              as: PeerReviewCommittee
              as_user_id: "prc-01"
          trigger:
            - call: "POST /peer-reviews/${pr_id}/transitions"
              payload: { to_state: "REPORT_ISSUED" }
              as: PeerReviewCommittee
              as_user_id: "prc-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "error_id == \"ERR_INVALID_TRANSITION\""
            - "a follow-up GET /peer-reviews/${pr_id} returns state == \"ACCEPTED\" and rating == \"PASS\""
            - "a follow-up GET /firms/${firm_id} returns last_peer_review_rating == \"PASS\" and risk_posture == \"STABLE\""
            - "a follow-up GET /peer-reviewers/${reviewer_id} returns active_review_count == 0"

      - name: finding_reopen_restores_firm_counters_exactly
        claim_type: Side Effect Execution
        grounds:
          - state_machines.InspectionFinding.VERIFIED_to_REOPENED.side_effects
          - calculations.firm_risk_posture
        distinguishing_aspect: >-
          The compensation leg must undo VERIFIED exactly: verified_at back to
          null, reopen_count 1, and Firm.open_deficiency_count back to its
          pre-verification value of 1 (not 0, not 2) with the posture recomputed
          from the restored counters.
        test_recipe:
          setup:
            - "The full remediation ladder with the DEFICIENCY finding already VERIFIED (open_deficiency_count == 0)."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_insp
            - *k_insp_select
            - *k_sel_lookup
            - *k_insp_inprog
            - *k_finding
            - *k_classify_def
            - *k_rca
            - *k_rca_validate
            - *k_finding_v
            - *k_plan
            - *k_plan_submit
            - *k_plan_accept
            - *k_plan_completed
            - *k_finding_verify
          trigger:
            - call: "POST /inspection-findings/${finding_id}/transitions"
              payload: { to_state: "REOPENED" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
          assert:
            - "HTTP 200"
            - "data.state == \"REOPENED\" and data.verified_at == null and data.reopen_count == 1"
            - "data.classification == \"DEFICIENCY\" and data.class_points == 3 (classification is not re-derived)"
            - "a follow-up GET /firms/${firm_id} returns open_deficiency_count == 1 and open_material_failure_count == 0"
            - "a follow-up GET /firms/${firm_id} returns risk_posture == \"STABLE\" (1 < the ELEVATED threshold of 5)"

  - section: calculations
    instances:

      - name: peer_review_scope_hours_use_base_tier_forty_with_no_categories
        claim_type: Correct Result
        grounds:
          - calculations.peer_review_hours_scope
          - state_machines.PeerReview.PLANNING_to_SCOPE_SET.side_effects
        distinguishing_aspect: >-
          aa_hours_last_year 9000 sits in the third tier (<= 10000) so BASE_TIER
          is 40; the firm's only released engagement is a REVIEW, so
          must_select_categories is empty and component_must_sel is 0.00; posture
          STABLE means uplift 0.00. component_base 40.00 + 0.00 -> ceil 40, and
          unallocated_hours opens equal to it.
        test_recipe:
          setup:
            - "Firm with one released REVIEW engagement; roster reviewer assigned to a SYSTEM_REVIEW for year_end 2026-06-30."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_reviewer
            - *k_pr
            - *k_pr_assign
          trigger:
            - *k_pr_scope
          assert:
            - "HTTP 200"
            - "data.state == \"SCOPE_SET\" and data.must_select_categories == []"
            - "data.total_scope_hours == 40 and data.unallocated_hours == 40"
            - "data.assigned_reviewer_id == ${reviewer_id} and data.rating == \"NONE\""
            - "a follow-up GET /firms/${firm_id} returns unassigned_review_flag == false"

      - name: peer_review_scope_hours_add_erisa_category_hours
        claim_type: Constants Applied
        grounds:
          - calculations.peer_review_hours_scope
          - entities.PeerReview.must_select_categories
        distinguishing_aspect: >-
          Releasing an ERISA_AUDIT engagement whose period_end (2026-04-30) is on
          or before year_end pushes ERISA_AUDIT into must_select_categories,
          adding CATEGORY_HOURS 8: component_base 40.00 + component_must_sel 8.00
          -> ceil 48. The category list is emitted in the fixed declaration
          order, never in engagement order.
        test_recipe:
          setup:
            - "Firm with a released REVIEW engagement and a released ERISA_AUDIT engagement (cleared through a CONCURRED quality review)."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eqrp
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_eng2
            - *k_eng2_fw
            - *k_eqr
            - *k_eqr_start
            - *k_eng2_eqrp
            - &k_eqr_concur
              call: "POST /quality-reviews/${eqr_id}/transitions"
              payload: { to_state: "CONCURRED" }
              as: EngagementQualityReviewer
              as_user_id: "${eqrp_id}"
            - &k_eng2_cleared
              call: "POST /engagements/${eng2_id}/workflow-transitions"
              payload: { to_state: "EQR_CLEARED" }
              as: EngagementPartner
              as_user_id: "${ep_id}"
            - &k_eng2_released
              call: "POST /engagements/${eng2_id}/workflow-transitions"
              payload: { to_state: "REPORT_RELEASED" }
              as: EngagementPartner
              as_user_id: "${ep_id}"
            - *k_reviewer
            - *k_pr
            - *k_pr_assign
          trigger:
            - *k_pr_scope
          assert:
            - "HTTP 200"
            - "data.must_select_categories == [\"ERISA_AUDIT\"]"
            - "data.total_scope_hours == 48 and data.unallocated_hours == 48"
            - "a follow-up GET /engagements/${eng2_id} returns eqr_concurred_at != null and workflow_state == \"REPORT_RELEASED\""

      - name: remediation_acceptance_score_is_strong_tier_eight_ninety
        claim_type: Precision
        grounds:
          - calculations.remediation_acceptance_score
          - calculations.root_cause_depth_score
        distinguishing_aspect: >-
          depth_score = min(10, 2*3 + FISHBONE 3) = 9.00; raw_completeness =
          round(0.40*9.00 + 0.35*8.00 + 0.25*(10*4/4), 2) = 8.90 -> tier STRONG
          (>= 8.00); the clock (2026-08-01) is before target_completion_date
          (2026-09-30) so late_days is 0 and acceptance_score stays 8.90. The
          tier is derived from raw_completeness ONLY, never re-derived from the
          penalised score.
        test_recipe:
          setup:
            - "DEFICIENCY finding with a VALIDATED FISHBONE RCA (3 factors) and a DRAFTED plan owned by the QC director."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_insp
            - *k_insp_select
