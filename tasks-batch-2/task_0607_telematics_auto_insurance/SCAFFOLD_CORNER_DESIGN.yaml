              as: DriverUser
              as_user_id: "${d_id}"
              captures: { e_id: $.data.id }
          assert:
            - "Enrollment.${e_id}.status == SCORING"
            - "Enrollment.${e_id}.captured_trip_count == 0"
            - "Enrollment.${e_id}.provisional_risk_score == 0"

