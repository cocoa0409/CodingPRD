scenario: "desgin task harder than expert level.!!!!2110. Sterilization Services & Lot Release (EtO/gamma/e-beam): cycle recipe by density & load map, dosimeter/biological indicator placement, quarantine & parametric release rules, residual aeration time & re-test, customer product qualification & VDmax dose audit, load scheduling & chamber capacity, emissions permit & abatement, adverse-event/re-sterilization"
domain_name: "sterilization-services-lot-release"
api_prefix: "/sterilization"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Lot <-> Cycle is many-to-many through LoadPosition; Lot is self-referential
  # (parent_lot_id, re-sterilization successor chain); ProductQualification is a
  # junction between Product and CycleRecipe; Chamber and EmissionPermit form a
  # cross-aggregate capacity edge that the Cycle scheduling rules traverse.

  state_machine_shape: cyclic
  # Cycle: branching fork at DOSIMETRY_REVIEW plus two cycles
  #   (READY -> LOADING on load-map revision; DOSE_DEVIATION -> DOSIMETRY_REVIEW on re-read).
  # Lot: two parallel state dimensions (status x residual_status) on one row.
  # ProductQualification: QUALIFIED -> AUDIT_DUE -> QUALIFIED audit loop.
  # AerationRecord: RETEST_REQUIRED self-loop.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The QualityReleaseOfficer who releases a Lot may not be the operator who ran
  # the governing Cycle nor the analyst who closed its dosimetry.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Deliberately at the top of the Expert band (13 entities / 48 endpoints /
  # 34 errors / 9 calculations / 6 state machines) because the scenario text
  # explicitly asks for "harder than expert level". Density is carried by the
  # nine Difficulty Rules, not by the raw counts.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the device manufacturer contracting sterilization services.
      - name: account_code
        type: string
        source: input
        description: Short account handle; unique across all Customer rows.
        constraints: "1-32 chars; unique (case-sensitive exact match)"
      - name: contracted_modalities
        type: array
        source: input
        description: Modalities this customer is contracted for; a Lot may only be loaded into a Cycle whose chamber modality appears here.
        constraints: "non-empty array; each member in {ETO, GAMMA, EBEAM}; no duplicates"
      - name: status
        type: enum
        source: input
        description: Commercial standing of the account.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: open_lot_count
        type: integer
        source: computed
        description: "Count of Lot rows with customer_id == this Customer.id whose status NOT IN {RELEASED, REJECTED, SCRAPPED, RECALLED}. Recomputed on every Lot status change."
        default: 0

  - name: Product
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; owning customer of this product family."
      - name: product_code
        type: string
        source: input
        description: Manufacturer part/family code.
        constraints: "1-32 chars; unique within a customer_id"
      - name: pallet_mass_kg
        type: number
        source: input
        description: Mass of one shipping pallet of this product, in kilograms. Feeds cycle_load_density.
        constraints: "> 0"
      - name: pallet_volume_m3
        type: number
        source: input
        description: Displaced volume of one shipping pallet of this product, in cubic metres. Feeds cycle_load_density.
        constraints: "> 0"
      - name: max_allowed_dose_kgy
        type: number
        source: input
        description: Per-cycle maximum absorbed dose the product tolerates, in kGy. Feeds dose_conformance_verdict overdose branch.
        constraints: "> 0"
      - name: max_cumulative_dose_kgy
        type: number
        source: input
        description: Lifetime absorbed-dose ceiling across all sterilization passes of one physical lot, in kGy.
        constraints: "> 0"
      - name: eto_residual_limit_ppm
        type: number
        source: input
        description: Maximum permitted ethylene-oxide residual concentration in ppm at residual test.
        constraints: ">= 0"
      - name: ech_residual_limit_ppm
        type: number
        source: input
        description: Maximum permitted ethylene-chlorohydrin residual concentration in ppm at residual test.
        constraints: ">= 0"
      - name: requires_aeration
        type: boolean
        source: input
        description: When true and the governing chamber modality is ETO, lots of this product enter residual_status PENDING_AERATION on cycle completion.
        default: true
      - name: status
        type: enum
        source: input
        description: Catalogue standing of the product.
        default: ACTIVE
        constraints: "one of {ACTIVE, DISCONTINUED}"

  - name: EmissionPermit
    parent: null
    common_fields: true
    fields:
      - name: permit_code
        type: string
        source: input
        description: Regulator-issued air permit identifier.
        constraints: "1-32 chars; unique"
      - name: permit_year
        type: integer
        source: input
        description: Calendar year the annual allowance applies to.
        constraints: ">= 2000"
      - name: annual_allowance_kg
        type: number
        source: input
        description: Annual post-abatement ethylene-oxide mass allowance, in kilograms.
        constraints: "> 0"
      - name: consumed_kg_ytd
        type: number
        source: computed
        description: "Running post-abatement EtO mass debited by cycle starts under this permit. Conserved quantity of the abated_eto_mass_ledger invariant."
        default: 0
      - name: total_emission_fee_usd
        type: number
        source: computed
        description: Running sum of emission_fee_usd charged by cycle starts under this permit, credited back on abort.
        default: 0
      - name: max_concurrent_eto_cycles
        type: integer
        source: input
        description: Maximum number of ETO cycles whose closed dwell intervals may pairwise intersect at once across every chamber under this permit.
        constraints: ">= 1"
      - name: status
        type: enum
        source: input
        description: Permit standing. Auto-set to SUSPENDED when consumed_kg_ytd reaches annual_allowance_kg.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, EXPIRED}"

  - name: Chamber
    parent: EmissionPermit
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: "FK -> EmissionPermit.id; the air permit whose allowance and concurrency cap this chamber draws on."
      - name: chamber_code
        type: string
        source: input
        description: Plant-floor chamber identifier.
        constraints: "1-32 chars; unique"
      - name: modality
        type: enum
        source: input
        description: Sterilization modality this chamber implements.
        constraints: "one of {ETO, GAMMA, EBEAM}"
      - name: pallet_capacity
        type: integer
        source: input
        description: Maximum total pallet_count summed over all LoadPosition rows of any one Cycle in this chamber.
        constraints: ">= 1"
      - name: turnaround_minutes
        type: integer
        source: input
        description: Purge/cooldown buffer appended to every cycle's scheduled_end_at to form its occupancy_end_at.
        constraints: ">= 0"
      - name: abatement_efficiency_pct
        type: number
        source: input
        description: Percentage of raw EtO charge destroyed by this chamber's abatement train; feeds emission_fee_usd step 1.
        constraints: "0 <= value <= 100"
      - name: status
        type: enum
        source: input
        description: Operational availability of the chamber.
        default: AVAILABLE
        constraints: "one of {AVAILABLE, MAINTENANCE, DECOMMISSIONED}"

  - name: CycleRecipe
    parent: null
    common_fields: true
    fields:
      - name: recipe_code
        type: string
        source: input
        description: Validated recipe identifier.
        constraints: "1-32 chars; unique"
      - name: modality
        type: enum
        source: input
        description: Modality this recipe is written for; must equal the chamber modality of any Cycle that uses it.
        constraints: "one of {ETO, GAMMA, EBEAM}"
      - name: density_min_g_per_cm3
        type: number
        source: input
        description: Inclusive lower edge of the load-density band this recipe is validated for.
        constraints: "> 0"
      - name: density_max_g_per_cm3
        type: number
        source: input
        description: EXCLUSIVE upper edge of the load-density band this recipe is validated for.
        constraints: "> density_min_g_per_cm3"
      - name: target_dose_kgy
        type: number
        source: input
        description: Nominal delivered dose the recipe aims for; used by the cumulative-dose headroom check at load time.
        constraints: "> 0"
      - name: min_dose_kgy
        type: number
        source: input
        description: Inclusive floor for delivered_dose_kgy; a cycle at exactly this value conforms.
        constraints: "> 0"
      - name: max_dose_kgy
        type: number
        source: input
        description: Recipe-level ceiling on max_observed_dose_kgy; exceeded strictly (>) it is an overdose deviation.
        constraints: "> min_dose_kgy"
      - name: dose_basis
        type: enum
        source: input
        description: Selects which variant of delivered_dose_kgy this recipe is released against.
        constraints: "one of {ROUTINE_MEAN, MIN_ZONE}"
      - name: aeration_base_hours
        type: integer
        source: input
        description: Base degassing hours before density derating; feeds aeration_required_hours.
        constraints: ">= 0"
      - name: required_min_zone_dosimeters
        type: integer
        source: input
        description: Minimum count of DOSIMETER indicators with placement_zone MIN_DOSE required before a cycle may go READY.
        constraints: ">= 0"
      - name: required_routine_dosimeters
        type: integer
        source: input
        description: Minimum count of DOSIMETER indicators with placement_zone ROUTINE required before a cycle may go READY.
        constraints: ">= 0"
      - name: required_biological_indicators
        type: integer
        source: input
        description: Minimum count of BIOLOGICAL indicators required before READY. When 0 the recipe is parametric-release qualified.
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: Approval standing; only APPROVED recipes may back a Cycle.
        default: DRAFT
        constraints: "one of {DRAFT, APPROVED}"

  - name: ProductQualification
    parent: Product
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product this dose qualification covers."
      - name: recipe_id
        type: string
        source: input
        description: "FK -> CycleRecipe.id; the recipe the product is qualified against."
      - name: method
        type: enum
        source: input
        description: Dose-setting method used to establish the qualification.
        constraints: "one of {VDMAX_15, VDMAX_25, METHOD_1}"
      - name: verification_dose_kgy
        type: number
        source: input
        description: Verification dose the quarterly dose audit is run at.
        constraints: "> 0"
      - name: sal_exponent
        type: integer
        source: input
        description: Negative log10 of the sterility assurance level (6 means 10^-6).
        constraints: ">= 1"
      - name: audit_interval_days
        type: integer
        source: computed
        description: Interval applied to the most recent DoseAudit outcome when scheduling the next audit.
        default: 90
      - name: last_audit_at
        type: datetime
        source: computed
        description: performed_at of the most recent DoseAudit under this qualification; null before the first audit.
      - name: next_audit_due_at
        type: datetime
        source: computed
        description: last_audit_at plus audit_interval_days; null when the qualification is SUSPENDED or REVOKED.
      - name: consecutive_conditional_count
        type: integer
        source: computed
        description: Number of consecutive CONDITIONAL_PASS audits; reset to 0 by a PASS. Reaching 2 revokes the qualification.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Qualification standing gating load-position creation.
        default: PENDING
        constraints: "one of {PENDING, QUALIFIED, CONDITIONAL, AUDIT_DUE, SUSPENDED, REVOKED}"

  - name: DoseAudit
    parent: ProductQualification
    common_fields: false
    fields:
      - name: qualification_id
        type: string
        source: input
        description: "FK -> ProductQualification.id; the qualification this VDmax audit belongs to."
      - name: performed_at
        type: datetime
        source: input
        description: Timestamp the audit sample set was irradiated and tested; anchors next_audit_due_at.
      - name: samples_tested
        type: integer
        source: input
        description: Number of sterility-tested units in the audit set; VDmax requires exactly 100.
        constraints: "must equal 100"
      - name: positives
        type: integer
        source: input
        description: Number of positive sterility tests in the audit set.
        constraints: "0 <= positives <= samples_tested"
      - name: verification_dose_kgy_applied
        type: number
        source: input
        description: Dose actually applied to the audit samples.
        constraints: "> 0"
      - name: outcome
        type: enum
        source: computed
        description: Verdict from vdmax_audit_verdict.
        constraints: "one of {PASS, CONDITIONAL_PASS, FAIL}"
      - name: next_audit_due_at
        type: datetime
        source: computed
        description: performed_at plus the interval selected by outcome; null when outcome is FAIL.
      - name: qualification_status_after
        type: enum
        source: computed
        description: Snapshot of ProductQualification.status immediately after this audit was applied.
        constraints: "one of {QUALIFIED, CONDITIONAL, SUSPENDED, REVOKED}"

  - name: Lot
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; owner of the physical goods."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; product family of the goods."
      - name: parent_lot_id
        type: string
        source: computed
        description: "FK -> Lot.id; set only on a re-sterilization successor created by an adverse-event RESTERILIZE disposition. Null on customer-created lots."
      - name: lot_code
        type: string
        source: input
        description: Customer lot identifier.
        constraints: "1-32 chars; unique within a customer_id"
      - name: total_pallet_count
        type: integer
        source: input
        description: Physical pallet count of the lot. Conserved quantity of the pallet_conservation invariant.
        constraints: ">= 1"
      - name: staged_pallet_count
        type: integer
        source: computed
        description: Sum of pallet_count over every LoadPosition row referencing this lot.
        default: 0
      - name: available_pallet_count
        type: integer
        source: computed
        description: total_pallet_count minus staged_pallet_count; must never be negative.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Primary lifecycle dimension of the lot.
        default: RECEIVED
        constraints: "one of {RECEIVED, STAGED, IN_PROCESS, PROCESSED, QUARANTINE, RELEASED, REJECTED, SCRAPPED, RECALLED}"
      - name: residual_status
        type: enum
        source: computed
        description: Second, independent state dimension tracking EtO residual clearance; evolves on the aeration endpoints only.
        default: NOT_APPLICABLE
        constraints: "one of {NOT_APPLICABLE, PENDING_AERATION, AERATING, RESIDUAL_PASS, RESIDUAL_FAIL}"
      - name: quarantine_reason
        type: enum
        source: computed
        description: Why the lot is being held.
        default: NONE
        constraints: "one of {NONE, ROUTINE, DOSE_DEVIATION, BI_POSITIVE, RESIDUAL_FAIL, ADVERSE_EVENT}"
      - name: cumulative_dose_kgy
        type: number
        source: computed
        description: Lifetime absorbed dose carried by the physical goods, inherited by re-sterilization successors.
        default: 0
      - name: resterilization_count
        type: integer
        source: computed
        description: Number of re-sterilization passes; 0 for a customer-created lot, parent value plus one for a successor.
        default: 0
      - name: schedulable
        type: boolean
        source: computed
        description: False blocks the lot from being placed into any load map; set by qualification and cumulative-dose cascades.
        default: true
      - name: release_mode
        type: enum
        source: computed
        description: Release pathway actually used.
        default: NONE
        constraints: "one of {NONE, PARAMETRIC, DOSIMETRIC}"
      - name: released_at
        type: datetime
        source: computed
        description: Logical-clock instant the release was recorded; null before release.
      - name: released_by_user_id
        type: string
        source: computed
        description: X-User-ID of the QualityReleaseOfficer who released the lot; null before release.
      - name: release_dose_kgy
        type: number
        source: computed
        description: delivered_dose_kgy of the governing cycle, snapshotted at release; null before release.

  - name: Cycle
    parent: Chamber
    common_fields: true
    fields:
      - name: chamber_id
        type: string
        source: input
        description: "FK -> Chamber.id; the chamber this cycle occupies."
      - name: recipe_id
        type: string
        source: input
        description: "FK -> CycleRecipe.id; the approved recipe this cycle runs."
      - name: cycle_code
        type: string
        source: input
        description: Plant-floor cycle identifier.
        constraints: "1-32 chars; unique"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: Start of the dwell interval used by both overlap rules.
      - name: scheduled_end_at
        type: datetime
        source: input
        description: End of the dwell interval used by both overlap rules.
        constraints: "> scheduled_start_at"
      - name: occupancy_end_at
        type: datetime
        source: computed
        description: scheduled_end_at plus chamber.turnaround_minutes; upper edge of the half-open chamber occupancy interval.
      - name: raw_eto_charge_kg
        type: number
        source: input
        description: Ethylene-oxide mass charged into the chamber before abatement; ignored for GAMMA and EBEAM chambers.
        default: 0
        constraints: ">= 0"
      - name: abated_eto_kg
        type: number
        source: computed
        description: Post-abatement EtO mass debited to the permit at start; zeroed on abort.
        default: 0
      - name: emission_fee_usd
        type: number
        source: computed
        description: Tiered emission fee charged at start; zeroed on abort.
        default: 0
      - name: loaded_pallet_count
        type: integer
        source: computed
        description: Sum of pallet_count over every LoadPosition row of this cycle.
        default: 0
      - name: load_density_g_per_cm3
        type: number
        source: computed
        description: Aggregate load density from cycle_load_density; recomputed on every load-map mutation.
        default: 0
      - name: delivered_dose_kgy
        type: number
        source: computed
        description: Variant-selected delivered dose set at dosimetry close; null before.
      - name: max_observed_dose_kgy
        type: number
        source: computed
        description: Highest measured_dose_kgy over all READ dosimeters of the cycle, set at dosimetry close; null before.
      - name: deviation_code
        type: enum
        source: computed
        description: Reason the cycle branched to DOSE_DEVIATION.
        default: NONE
        constraints: "one of {NONE, BI_POSITIVE, UNDERDOSE, OVERDOSE}"
      - name: operator_user_id
        type: string
        source: computed
        description: X-User-ID of the CycleOperator who started the cycle; null before start. Half of the segregation-of-duties pair.
      - name: dosimetry_closed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the DosimetryAnalyst who closed dosimetry; null before close. Other half of the segregation-of-duties pair.
      - name: status
        type: enum
        source: computed
        description: Cycle lifecycle state.
        default: PLANNED
        constraints: "one of {PLANNED, LOADING, READY, RUNNING, COMPLETED, DOSIMETRY_REVIEW, DOSE_CONFORMING, DOSE_DEVIATION, CANCELLED}"

  - name: LoadPosition
    parent: Cycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> Cycle.id; the cycle whose load map this position belongs to."
      - name: lot_id
        type: string
        source: input
        description: "FK -> Lot.id; the lot occupying this position."
      - name: position_index
        type: integer
        source: input
        description: Slot number inside the load map; unique within a cycle.
        constraints: ">= 1 and <= chamber.pallet_capacity"
      - name: zone
        type: enum
        source: input
        description: Geometric dose zone of this slot inside the chamber.
        constraints: "one of {MIN_DOSE, MAX_DOSE, INTERIOR, EDGE}"
      - name: pallet_count
        type: integer
        source: input
        description: Pallets of the lot placed in this slot.
        constraints: ">= 1"
      - name: cycle_version_after
        type: integer
        source: computed
        description: Snapshot of the parent Cycle.version immediately after this position was persisted; the OCC handle for the next load-map write.

  - name: Indicator
    parent: LoadPosition
    common_fields: true
    fields:
      - name: load_position_id
        type: string
        source: input
        description: "FK -> LoadPosition.id; the load-map slot this indicator is placed in."
      - name: indicator_type
        type: enum
        source: input
        description: Whether this is a physical dosimeter or a biological indicator.
        constraints: "one of {DOSIMETER, BIOLOGICAL}"
      - name: placement_zone
        type: enum
        source: input
        description: Dose zone the indicator is qualified to report on. MIN_DOSE indicators may only be placed on a LoadPosition whose zone is MIN_DOSE.
        constraints: "one of {MIN_DOSE, MAX_DOSE, ROUTINE}"
      - name: serial_code
        type: string
        source: input
        description: Indicator serial number.
        constraints: "1-32 chars; unique"
      - name: spore_population
        type: integer
        source: input
        description: Declared spore population for BIOLOGICAL indicators; must be omitted or null for DOSIMETER indicators.
        constraints: "required and >= 1 when indicator_type is BIOLOGICAL"
      - name: measured_dose_kgy
        type: number
        source: computed
        description: Dose read off a DOSIMETER indicator; null until read.
      - name: bi_result
        type: enum
        source: computed
        description: Incubation verdict of a BIOLOGICAL indicator.
        default: PENDING
        constraints: "one of {PENDING, NEGATIVE, POSITIVE}"
      - name: reading_status
        type: enum
        source: computed
        description: Whether this indicator has been read out.
        default: UNREAD
        constraints: "one of {UNREAD, READ}"
      - name: read_at
        type: datetime
        source: computed
        description: Logical-clock instant of the reading; null while UNREAD.
      - name: read_by_user_id
        type: string
        source: computed
        description: X-User-ID of the DosimetryAnalyst who recorded the reading; null while UNREAD.

  - name: AerationRecord
    parent: Lot
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> Lot.id; the lot being degassed."
      - name: aeration_start_at
        type: datetime
        source: computed
        description: Logical-clock instant the aeration record was opened.
      - name: base_hours
        type: integer
        source: computed
        description: Snapshot of the governing cycle recipe's aeration_base_hours taken at record creation.
      - name: density_factor
        type: number
        source: computed
        description: Derating factor selected from the governing cycle's load_density_g_per_cm3.
      - name: required_hours
        type: integer
        source: computed
        description: Whole hours of degassing required under the currently applied variant.
      - name: target_end_at
        type: datetime
        source: computed
        description: Earliest logical-clock instant a residual test may be recorded; anchor differs per variant.
      - name: retest_count
        type: integer
        source: computed
        description: Number of failed residual tests recorded so far.
        default: 0
      - name: last_failed_sample_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent failing residual test; anchor of the EXTENDED_RETEST variant. Null before any failure.
      - name: last_eto_ppm
        type: number
        source: computed
        description: Ethylene-oxide ppm of the most recent residual test; null before any test.
      - name: last_ech_ppm
        type: number
        source: computed
        description: Ethylene-chlorohydrin ppm of the most recent residual test; null before any test.
      - name: variant_applied
        type: enum
        source: computed
        description: Which aeration_required_hours variant produced the current required_hours and target_end_at.
        default: STANDARD
        constraints: "one of {STANDARD, EXTENDED_RETEST}"
      - name: status
        type: enum
        source: computed
        description: Aeration record lifecycle state.
        default: IN_PROGRESS
        constraints: "one of {IN_PROGRESS, RETEST_REQUIRED, PASSED, EXHAUSTED}"

  - name: AdverseEvent
    parent: Lot
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> Lot.id; the lot the complaint or exceedance was raised against."
      - name: lot_version_after
        type: integer
        source: computed
        description: Snapshot of the subject Lot.version immediately after this event was persisted; the OCC handle for the next adverse-event write on the same lot.
      - name: event_type
        type: enum
        source: input
        description: Nature of the reported event.
        constraints: "one of {STERILITY_COMPLAINT, RESIDUAL_EXCEEDANCE, FIELD_DOSE_DEVIATION, PACKAGING_BREACH}"
      - name: severity
        type: enum
        source: input
        description: Reporter-assigned severity.
        constraints: "one of {LOW, MEDIUM, HIGH, CRITICAL}"
      - name: description
        type: string
        source: input
        description: Free-text narrative of the event.
        constraints: "1-500 chars"
      - name: reported_by_user_id
        type: string
        source: computed
        description: X-User-ID of the reporter.
      - name: disposition
        type: enum
        source: computed
        description: Quality decision applied to the event; null while REPORTED.
        constraints: "one of {RESTERILIZE, SCRAP, DISMISS}"
      - name: status
        type: enum
        source: computed
        description: Event lifecycle state.
        default: REPORTED
        constraints: "one of {REPORTED, RESTERILIZE_APPROVED, SCRAP_APPROVED, DISMISSED}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Cycle ----
  # Non-linear: branching fork at DOSIMETRY_REVIEW with divergent side-effect
  # sets, PLUS two cycles (READY -> LOADING on load-map revision, and
  # DOSE_DEVIATION -> DOSIMETRY_REVIEW on a documented indicator re-read).
  - entity: Cycle
    dimension: status
    initial_state: PLANNED
    terminal_states: [DOSE_CONFORMING, CANCELLED]
    transitions:

      - from: PLANNED
        to: LOADING
        trigger: "POST /sterilization/cycles/{id}/load-positions (first position on this cycle)"
        actor: CycleOperator
        preconditions:
          - "cycle.status == PLANNED"
          - "payload.expected_cycle_version == cycle.version"
          - "lot.schedulable == true"
          - "a ProductQualification exists with product_id == lot.product_id AND recipe_id == cycle.recipe_id AND status IN {QUALIFIED, CONDITIONAL}"
          - "cycle.loaded_pallet_count + payload.pallet_count <= chamber.pallet_capacity"
          - "no existing LoadPosition on this cycle has position_index == payload.position_index"
          - "round_half_up(lot.cumulative_dose_kgy + recipe.target_dose_kgy, 2) <= product.max_cumulative_dose_kgy"
          - "chamber.modality IN customer.contracted_modalities"
        side_effects:
          - "LoadPosition created with cycle_version_after set to the cycle's version after this write"
          - "cycle.loaded_pallet_count += payload.pallet_count"
          - "cycle.load_density_g_per_cm3 recomputed via calculations.cycle_load_density"
          - "lot.staged_pallet_count += payload.pallet_count; lot.available_pallet_count = lot.total_pallet_count - lot.staged_pallet_count"
          - "lot.status RECEIVED -> STAGED"
          - "increments Cycle.version by 1"

      - from: LOADING
        to: LOADING
        trigger: "POST /sterilization/cycles/{id}/load-positions (subsequent position)"
        actor: CycleOperator
        preconditions:
          - "same preconditions as PLANNED_to_LOADING with cycle.status == LOADING"
        side_effects:
          - "same side effects as PLANNED_to_LOADING; lot.status stays STAGED when the lot was already staged"
          - "increments Cycle.version by 1"

      - from: READY
        to: LOADING
        trigger: "POST /sterilization/cycles/{id}/load-positions (load-map revision after readiness sign-off)"
        actor: CycleOperator
        preconditions:
          - "cycle.status == READY"
          - "payload.expected_cycle_version == cycle.version"
          - "all PLANNED_to_LOADING business preconditions"
        side_effects:
          - "same side effects as PLANNED_to_LOADING"
          - "cycle.status reverts READY -> LOADING so the readiness checks must be re-run"
          - "increments Cycle.version by 1"
        note: "This is the cycle A->B->A: READY -> LOADING -> READY."

      - from: LOADING
        to: LOADING
        trigger: "DELETE /sterilization/cycles/{id}/load-positions/{position_id} (positions remain)"
        actor: CycleOperator
        preconditions:
          - "cycle.status IN {PLANNED, LOADING, READY}"
          - "position.cycle_id == cycle.id"
          - "at least one other LoadPosition remains on this cycle after the delete"
        side_effects:
          - "LoadPosition row hard-deleted"
          - "cycle.loaded_pallet_count -= position.pallet_count"
          - "cycle.load_density_g_per_cm3 recomputed via calculations.cycle_load_density"
          - "lot.staged_pallet_count -= position.pallet_count; lot.available_pallet_count = lot.total_pallet_count - lot.staged_pallet_count"
          - "lot.status STAGED -> RECEIVED when the lot has no remaining LoadPosition on any cycle"
          - "cycle.status READY -> LOADING when it was READY"
          - "increments Cycle.version by 1"

      - from: LOADING
        to: PLANNED
        trigger: "DELETE /sterilization/cycles/{id}/load-positions/{position_id} (last position removed)"
        actor: CycleOperator
        preconditions:
          - "cycle.status IN {LOADING, READY}"
          - "this is the only remaining LoadPosition on the cycle"
        side_effects:
          - "all side effects of LOADING_to_LOADING delete"
          - "cycle.loaded_pallet_count == 0 and cycle.load_density_g_per_cm3 = 0.0000"
          - "increments Cycle.version by 1"

      - from: LOADING
        to: READY
        trigger: "POST /sterilization/cycles/{id}/ready"
        actor: CycleOperator
        preconditions:
          - "cycle.status IN {PLANNED, LOADING} - the endpoint's state gate deliberately admits PLANNED so that the empty-load-map check at validation priority 82 is reachable; a PLANNED cycle necessarily has no positions and therefore always fails with ERR_LOAD_MAP_EMPTY rather than reaching READY"
          - "cycle has at least one LoadPosition"
          - "count of Indicator rows on this cycle with indicator_type == DOSIMETER AND placement_zone == MIN_DOSE >= recipe.required_min_zone_dosimeters"
          - "count of Indicator rows on this cycle with indicator_type == DOSIMETER AND placement_zone == ROUTINE >= recipe.required_routine_dosimeters"
          - "count of Indicator rows on this cycle with indicator_type == BIOLOGICAL >= recipe.required_biological_indicators"
          - "recipe.density_min_g_per_cm3 <= cycle.load_density_g_per_cm3 < recipe.density_max_g_per_cm3 (lower inclusive, upper EXCLUSIVE)"
        side_effects:
          - "cycle.status = READY"
          - "increments Cycle.version by 1"

      - from: READY
        to: RUNNING
        trigger: "POST /sterilization/cycles/{id}/start"
        actor: CycleOperator
        preconditions:
          - "cycle.status == READY"
          - "chamber.status == AVAILABLE"
          - "permit.status == ACTIVE"
          - "for ETO chambers: prospective_ytd from calculations.emission_fee_usd step 2 <= permit.annual_allowance_kg (strict > rejects)"
        side_effects:
          - "calculations.emission_fee_usd executed; cycle.abated_eto_kg and cycle.emission_fee_usd set"
          - "permit.consumed_kg_ytd = prospective_ytd; permit.total_emission_fee_usd += cycle.emission_fee_usd"
          - "permit.status ACTIVE -> SUSPENDED when permit.consumed_kg_ytd >= permit.annual_allowance_kg after the commit"
          - "cycle.operator_user_id = X-User-ID of the caller"
          - "every Lot referenced by a LoadPosition of this cycle: status STAGED -> IN_PROCESS"
          - "cycle.status = RUNNING"

      - from: RUNNING
        to: COMPLETED
        trigger: "POST /sterilization/cycles/{id}/complete"
        actor: CycleOperator
        preconditions:
          - "cycle.status == RUNNING"
        side_effects:
          - "every Lot referenced by a LoadPosition of this cycle: status IN_PROCESS -> PROCESSED"
          - "for each such Lot, when chamber.modality == ETO AND product.requires_aeration == true: residual_status NOT_APPLICABLE -> PENDING_AERATION"
          - "cycle.status = COMPLETED"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /sterilization/cycles/{id}/abort"
        actor: CycleOperator
        preconditions:
          - "cycle.status IN {PLANNED, LOADING, READY}"
        side_effects:
          - "every LoadPosition of this cycle hard-deleted in created_at ASC order; each lot's staged_pallet_count decremented and available_pallet_count refreshed; each lot with no remaining LoadPosition anywhere: status STAGED -> RECEIVED"
          - "cycle.loaded_pallet_count = 0; cycle.load_density_g_per_cm3 = 0.0000"
          - "cycle.status = CANCELLED"

      - from: RUNNING
        to: CANCELLED
        trigger: "POST /sterilization/cycles/{id}/abort"
        actor: CycleOperator
        preconditions:
          - "cycle.status == RUNNING"
        side_effects:
          - "permit.consumed_kg_ytd = round_half_up(permit.consumed_kg_ytd - cycle.abated_eto_kg, 3); permit.total_emission_fee_usd = round_half_up(permit.total_emission_fee_usd - cycle.emission_fee_usd, 2)"
          - "permit.status SUSPENDED -> ACTIVE when permit.consumed_kg_ytd < permit.annual_allowance_kg after the credit AND the permit was auto-suspended (status == SUSPENDED)"
          - "cycle.abated_eto_kg = 0; cycle.emission_fee_usd = 0"
          - "every LoadPosition of this cycle hard-deleted in created_at ASC order; each lot's staged_pallet_count decremented and available_pallet_count refreshed; each lot: status IN_PROCESS -> RECEIVED"
          - "cycle.loaded_pallet_count = 0; cycle.load_density_g_per_cm3 = 0.0000"
          - "cycle.status = CANCELLED"
        note: "Compensating half of the abated_eto_mass_ledger invariant."

      - from: COMPLETED
        to: DOSIMETRY_REVIEW
        trigger: "system: first Indicator on this cycle transitions reading_status UNREAD -> READ"
        actor: system
        preconditions:
          - "cycle.status == COMPLETED"
        side_effects:
          - "cycle.status = DOSIMETRY_REVIEW"

      - from: DOSIMETRY_REVIEW
        to: DOSE_CONFORMING
        trigger: "POST /sterilization/cycles/{id}/dosimetry-close when calculations.dose_conformance_verdict yields CONFORMING"
        actor: DosimetryAnalyst
        preconditions:
          - "cycle.status == DOSIMETRY_REVIEW"
          - "every Indicator on this cycle has reading_status == READ"
        side_effects:
          - "calculations.delivered_dose_kgy sets cycle.delivered_dose_kgy and cycle.max_observed_dose_kgy"
          - "cycle.deviation_code = NONE"
          - "cycle.dosimetry_closed_by_user_id = X-User-ID of the caller"
          - "every Lot of this cycle with status == PROCESSED: status -> QUARANTINE, quarantine_reason = ROUTINE"
          - "every Lot of this cycle already in QUARANTINE with quarantine_reason IN {DOSE_DEVIATION, BI_POSITIVE}: quarantine_reason = ROUTINE, schedulable = true (compensation for a previously closed deviation on the same cycle)"
          - "calculations.lot_cumulative_dose applied to every Lot of this cycle"
          - "cycle.status = DOSE_CONFORMING"

      - from: DOSIMETRY_REVIEW
        to: DOSE_DEVIATION
        trigger: "POST /sterilization/cycles/{id}/dosimetry-close when calculations.dose_conformance_verdict yields DEVIATION"
        actor: DosimetryAnalyst
        preconditions:
          - "cycle.status == DOSIMETRY_REVIEW"
          - "every Indicator on this cycle has reading_status == READ"
        side_effects:
          - "CASCADE A hop 1: calculations.delivered_dose_kgy and calculations.dose_conformance_verdict run; cycle.deviation_code set to BI_POSITIVE | UNDERDOSE | OVERDOSE; cycle.dosimetry_closed_by_user_id set; cycle.status = DOSE_DEVIATION"
          - "CASCADE A hop 2 (caused by hop 1): every Lot of this cycle with status == PROCESSED -> QUARANTINE with quarantine_reason = BI_POSITIVE when deviation_code == BI_POSITIVE else DOSE_DEVIATION, and schedulable = false"
          - "CASCADE A hop 3 (caused by hop 2): for each Lot quarantined in hop 2, the ProductQualification with product_id == lot.product_id AND recipe_id == cycle.recipe_id whose status IN {QUALIFIED, CONDITIONAL} transitions to AUDIT_DUE and next_audit_due_at = clock_now"
          - "CASCADE A hop 4 (caused by hop 3): for each ProductQualification moved to AUDIT_DUE in hop 3, every OTHER Lot with the same product_id and status == STAGED gets schedulable = false and status STAGED -> RECEIVED; each of that lot's LoadPosition rows on cycles whose status IN {PLANNED, LOADING, READY} is hard-deleted in created_at ASC order, decrementing that cycle's loaded_pallet_count and recomputing its load_density_g_per_cm3, and reverting that cycle READY -> LOADING (or LOADING -> PLANNED when it is left with no positions)"
        note: "Depth-4 transitive cascade; each hop is caused by the preceding hop, not by the original request."

      - from: DOSE_DEVIATION
        to: DOSIMETRY_REVIEW
        trigger: "POST /sterilization/indicators/{id}/reading (documented re-read of an already-READ indicator on a deviated cycle)"
        actor: DosimetryAnalyst
        preconditions:
          - "cycle.status == DOSE_DEVIATION"
        side_effects:
          - "indicator.measured_dose_kgy and/or indicator.bi_result overwritten; read_at and read_by_user_id refreshed"
          - "cycle.deviation_code = NONE; cycle.delivered_dose_kgy = null; cycle.max_observed_dose_kgy = null"
          - "cycle.status = DOSIMETRY_REVIEW"
        note: "Second cycle in this machine: DOSIMETRY_REVIEW -> DOSE_DEVIATION -> DOSIMETRY_REVIEW."

  # -------------------------------------------------- Lot (status dimension) --
  - entity: Lot
    dimension: status
    initial_state: RECEIVED
    terminal_states: [REJECTED, SCRAPPED, RECALLED]
    transitions:
      - from: RECEIVED
        to: STAGED
        trigger: "POST /sterilization/cycles/{id}/load-positions"
        actor: CycleOperator
        preconditions: ["lot.status == RECEIVED", "lot.schedulable == true"]
        side_effects: ["lot.staged_pallet_count increased", "customer.open_lot_count unchanged"]
      - from: STAGED
        to: RECEIVED
        trigger: "DELETE /sterilization/cycles/{id}/load-positions/{position_id}, POST /sterilization/cycles/{id}/abort, or CASCADE A hop 4"
        actor: CycleOperator
        preconditions: ["lot has no remaining LoadPosition on any cycle after the delete"]
        side_effects: ["lot.staged_pallet_count decreased to 0"]
      - from: STAGED
        to: IN_PROCESS
        trigger: "POST /sterilization/cycles/{id}/start"
        actor: CycleOperator
        preconditions: ["lot.status == STAGED"]
        side_effects: []
      - from: IN_PROCESS
        to: RECEIVED
        trigger: "POST /sterilization/cycles/{id}/abort from RUNNING"
        actor: CycleOperator
        preconditions: ["lot.status == IN_PROCESS"]
        side_effects: ["lot.staged_pallet_count decreased to 0"]
      - from: IN_PROCESS
        to: PROCESSED
        trigger: "POST /sterilization/cycles/{id}/complete"
        actor: CycleOperator
        preconditions: ["lot.status == IN_PROCESS"]
        side_effects: ["residual_status dimension may move NOT_APPLICABLE -> PENDING_AERATION"]
      - from: PROCESSED
        to: QUARANTINE
        trigger: "POST /sterilization/cycles/{id}/dosimetry-close (both branches)"
        actor: DosimetryAnalyst
        preconditions: ["lot.status == PROCESSED"]
        side_effects:
          - "quarantine_reason = ROUTINE on the CONFORMING branch; BI_POSITIVE or DOSE_DEVIATION on the DEVIATION branch"
          - "schedulable = false on the DEVIATION branch only"
      - from: QUARANTINE
        to: RELEASED
        trigger: "POST /sterilization/lots/{id}/release"
        actor: QualityReleaseOfficer
        preconditions:
          - "lot.status == QUARANTINE"
          - "no BIOLOGICAL Indicator on the governing cycle has bi_result == POSITIVE"
          - "governing cycle.status == DOSE_CONFORMING"
          - "the ProductQualification for (lot.product_id, governing cycle.recipe_id) has status IN {QUALIFIED, CONDITIONAL}"
          - "X-User-ID != governing cycle.operator_user_id AND X-User-ID != governing cycle.dosimetry_closed_by_user_id"
          - "lot.residual_status IN {NOT_APPLICABLE, RESIDUAL_PASS}"
          - "payload.release_mode == PARAMETRIC requires recipe.required_biological_indicators == 0"
          - "payload.release_mode == DOSIMETRIC requires every BIOLOGICAL Indicator on the governing cycle to have reading_status == READ"
          - "customer.status == ACTIVE"
        side_effects:
          - "lot.release_mode, lot.released_at = clock_now, lot.released_by_user_id = X-User-ID"
          - "lot.release_dose_kgy = governing cycle.delivered_dose_kgy"
          - "lot.quarantine_reason = NONE"
          - "customer.open_lot_count -= 1"
      - from: QUARANTINE
        to: REJECTED
        trigger: "POST /sterilization/aeration-records/{id}/residual-test that exhausts the retest budget"
        actor: DosimetryAnalyst
        preconditions: ["aeration record transitions RETEST_REQUIRED -> EXHAUSTED"]
        side_effects: ["lot.quarantine_reason = RESIDUAL_FAIL", "lot.residual_status -> RESIDUAL_FAIL", "customer.open_lot_count -= 1"]
      - from: QUARANTINE
        to: SCRAPPED
        trigger: "POST /sterilization/adverse-events/{id}/disposition with disposition SCRAP"
        actor: QualityReleaseOfficer
        preconditions: ["lot.status == QUARANTINE", "event.status == REPORTED"]
        side_effects: ["lot.schedulable = false", "customer.open_lot_count -= 1"]
      - from: RELEASED
        to: SCRAPPED
        trigger: "POST /sterilization/adverse-events/{id}/disposition with disposition SCRAP"
        actor: QualityReleaseOfficer
        preconditions: ["lot.status == RELEASED", "event.status == REPORTED"]
        side_effects: ["lot.schedulable = false"]
      - from: RELEASED
        to: RECALLED
        trigger: "POST /sterilization/adverse-events/{id}/disposition with disposition RESTERILIZE"
        actor: QualityReleaseOfficer
        preconditions: ["lot.status == RELEASED", "event.status == REPORTED"]
        side_effects:
          - "CASCADE B hop 1: event.status = RESTERILIZE_APPROVED, event.disposition = RESTERILIZE"
          - "CASCADE B hop 2 (caused by hop 1): subject lot.status = RECALLED, quarantine_reason = ADVERSE_EVENT; a successor Lot is created with parent_lot_id = subject.id, customer_id/product_id/total_pallet_count copied, lot_code = subject.lot_code + '-R' + (subject.resterilization_count + 1), status = RECEIVED, residual_status = NOT_APPLICABLE, cumulative_dose_kgy = subject.cumulative_dose_kgy, resterilization_count = subject.resterilization_count + 1, schedulable = true"
          - "CASCADE B hop 3 (caused by hop 2): because the successor carries a non-zero cumulative_dose_kgy, every ProductQualification Q with product_id == successor.product_id and status IN {QUALIFIED, CONDITIONAL} is re-evaluated in created_at ASC order; when round_half_up(successor.cumulative_dose_kgy + Q's recipe.target_dose_kgy, 2) > product.max_cumulative_dose_kgy, Q.status -> SUSPENDED, Q.next_audit_due_at = null, and successor.schedulable = false"
          - "customer.open_lot_count is unchanged: the recalled lot leaves the open set and the successor enters it"
        note: "Depth-3 transitive cascade originating from a different trigger than CASCADE A."

  # ----------------------------------------- Lot (residual_status dimension) --
  # Second, independent state axis on the same Lot row. It advances only on the
  # aeration endpoints and never on the cycle or release endpoints, so the two
  # dimensions genuinely evolve independently.
  - entity: Lot
    dimension: residual_status
    initial_state: NOT_APPLICABLE
    terminal_states: [RESIDUAL_PASS, RESIDUAL_FAIL]
    transitions:
      - from: NOT_APPLICABLE
        to: PENDING_AERATION
        trigger: "POST /sterilization/cycles/{id}/complete"
        actor: CycleOperator
        preconditions: ["chamber.modality == ETO", "product.requires_aeration == true"]
        side_effects: ["lot becomes eligible for POST /sterilization/lots/{id}/aeration-records"]
      - from: PENDING_AERATION
        to: AERATING
        trigger: "POST /sterilization/lots/{id}/aeration-records"
        actor: CycleOperator
        preconditions: ["lot.residual_status == PENDING_AERATION"]
        side_effects: ["AerationRecord created in IN_PROGRESS with calculations.aeration_required_hours variant STANDARD"]
      - from: AERATING
        to: RESIDUAL_PASS
        trigger: "POST /sterilization/aeration-records/{id}/residual-test with a passing verdict"
        actor: DosimetryAnalyst
        preconditions: ["aeration record transitions to PASSED"]
        side_effects: ["lot becomes releasable on the residual axis"]
      - from: AERATING
        to: RESIDUAL_FAIL
        trigger: "POST /sterilization/aeration-records/{id}/residual-test that exhausts the retest budget"
        actor: DosimetryAnalyst
        preconditions: ["aeration record transitions RETEST_REQUIRED -> EXHAUSTED"]
        side_effects: ["lot.status QUARANTINE -> REJECTED on the status dimension"]

  # ------------------------------------------------- ProductQualification ----
  - entity: ProductQualification
    dimension: status
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /sterilization/qualifications/{id}/dose-audits with outcome PASS"
        actor: RegulatoryAdmin
        preconditions: ["qualification.status != REVOKED", "payload.samples_tested == 100"]
        side_effects: ["last_audit_at = payload.performed_at", "audit_interval_days = 90", "next_audit_due_at = performed_at + 90 days", "consecutive_conditional_count = 0"]
      - from: PENDING
        to: CONDITIONAL
        trigger: "POST /sterilization/qualifications/{id}/dose-audits with outcome CONDITIONAL_PASS"
        actor: RegulatoryAdmin
        preconditions: ["qualification.status != REVOKED"]
        side_effects: ["audit_interval_days = 30", "next_audit_due_at = performed_at + 30 days", "consecutive_conditional_count += 1"]
      - from: PENDING
        to: SUSPENDED
        trigger: "POST /sterilization/qualifications/{id}/dose-audits with outcome FAIL"
        actor: RegulatoryAdmin
        preconditions: ["qualification.status != REVOKED"]
        side_effects: ["audit_interval_days = 0", "next_audit_due_at = null", "consecutive_conditional_count = 0"]
      - from: QUALIFIED
        to: AUDIT_DUE
        trigger: "system: clock_now >= next_audit_due_at, evaluated lazily whenever the qualification is read by POST /sterilization/cycles/{id}/load-positions; OR CASCADE A hop 3"
        actor: system
        preconditions: ["status IN {QUALIFIED, CONDITIONAL}"]
        side_effects: ["load-position creation for this (product, recipe) pair is blocked with ERR_QUALIFICATION_NOT_CURRENT"]
      - from: CONDITIONAL
        to: AUDIT_DUE
        trigger: "system: clock_now >= next_audit_due_at; OR CASCADE A hop 3"
        actor: system
        preconditions: ["status == CONDITIONAL"]
        side_effects: ["load-position creation blocked"]
      - from: AUDIT_DUE
        to: QUALIFIED
        trigger: "POST /sterilization/qualifications/{id}/dose-audits with outcome PASS"
        actor: RegulatoryAdmin
        preconditions: ["status == AUDIT_DUE"]
        side_effects: ["consecutive_conditional_count = 0", "next_audit_due_at = performed_at + 90 days"]
      - from: AUDIT_DUE
        to: CONDITIONAL
        trigger: "POST /sterilization/qualifications/{id}/dose-audits with outcome CONDITIONAL_PASS"
        actor: RegulatoryAdmin
        preconditions: ["status == AUDIT_DUE", "consecutive_conditional_count + 1 < 2"]
        side_effects: ["consecutive_conditional_count += 1", "next_audit_due_at = performed_at + 30 days"]
      - from: AUDIT_DUE
        to: SUSPENDED
        trigger: "POST /sterilization/qualifications/{id}/dose-audits with outcome FAIL"
        actor: RegulatoryAdmin
        preconditions: ["status == AUDIT_DUE"]
        side_effects: ["next_audit_due_at = null"]
      - from: CONDITIONAL
        to: QUALIFIED
        trigger: "POST /sterilization/qualifications/{id}/dose-audits with outcome PASS"
        actor: RegulatoryAdmin
        preconditions: ["status == CONDITIONAL"]
        side_effects: ["consecutive_conditional_count = 0", "next_audit_due_at = performed_at + 90 days"]
      - from: CONDITIONAL
        to: REVOKED
        trigger: "POST /sterilization/qualifications/{id}/dose-audits with outcome CONDITIONAL_PASS pushing consecutive_conditional_count to 2"
        actor: RegulatoryAdmin
        preconditions: ["status IN {CONDITIONAL, AUDIT_DUE}", "consecutive_conditional_count + 1 >= 2"]
        side_effects: ["next_audit_due_at = null", "every Lot of this product with status IN {RECEIVED, STAGED} gets schedulable = false"]
      - from: CONDITIONAL
        to: SUSPENDED
        trigger: "POST /sterilization/qualifications/{id}/dose-audits with outcome FAIL; OR CASCADE B hop 3"
        actor: RegulatoryAdmin
        preconditions: ["status == CONDITIONAL"]
        side_effects: ["next_audit_due_at = null"]
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "CASCADE B hop 3 (cumulative-dose headroom breach) or a FAIL audit"
        actor: system
        preconditions: ["status == QUALIFIED"]
        side_effects: ["next_audit_due_at = null"]
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /sterilization/qualifications/{id}/dose-audits with outcome PASS (requalification)"
        actor: RegulatoryAdmin
        preconditions: ["status == SUSPENDED"]
        side_effects: ["consecutive_conditional_count = 0", "next_audit_due_at = performed_at + 90 days"]
      - from: SUSPENDED
        to: CONDITIONAL
        trigger: "POST /sterilization/qualifications/{id}/dose-audits with outcome CONDITIONAL_PASS (requalification)"
        actor: RegulatoryAdmin
        preconditions: ["status == SUSPENDED", "consecutive_conditional_count + 1 < 2"]
        side_effects: ["consecutive_conditional_count += 1", "next_audit_due_at = performed_at + 30 days"]

  # ------------------------------------------------------- AerationRecord ----
  - entity: AerationRecord
    dimension: status
    initial_state: IN_PROGRESS
    terminal_states: [PASSED, EXHAUSTED]
    transitions:
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /sterilization/aeration-records/{id}/residual-test"
        actor: DosimetryAnalyst
        preconditions:
          - "record.status == IN_PROGRESS"
          - "clock_now >= record.target_end_at"
          - "payload.eto_residual_ppm <= product.eto_residual_limit_ppm AND payload.ech_residual_ppm <= product.ech_residual_limit_ppm (both inclusive)"
        side_effects: ["last_eto_ppm and last_ech_ppm recorded", "lot.residual_status AERATING -> RESIDUAL_PASS"]
      - from: IN_PROGRESS
        to: RETEST_REQUIRED
        trigger: "POST /sterilization/aeration-records/{id}/residual-test with a failing verdict"
        actor: DosimetryAnalyst
        preconditions:
          - "record.status == IN_PROGRESS"
          - "clock_now >= record.target_end_at"
          - "retest_count + 1 <= MAX_RESIDUAL_RETESTS"
        side_effects:
          - "retest_count += 1; last_failed_sample_at = clock_now"
          - "variant_applied = EXTENDED_RETEST; required_hours and target_end_at recomputed from calculations.aeration_required_hours variant EXTENDED_RETEST anchored on last_failed_sample_at"
      - from: RETEST_REQUIRED
        to: RETEST_REQUIRED
        trigger: "POST /sterilization/aeration-records/{id}/residual-test with a failing verdict, budget not yet exhausted"
        actor: DosimetryAnalyst
        preconditions:
          - "record.status == RETEST_REQUIRED"
          - "clock_now >= record.target_end_at"
          - "retest_count + 1 <= MAX_RESIDUAL_RETESTS"
        side_effects: ["retest_count += 1; last_failed_sample_at = clock_now; required_hours and target_end_at recomputed"]
        note: "Self-loop; the required_hours multiplier grows with retest_count."
      - from: RETEST_REQUIRED
        to: PASSED
        trigger: "POST /sterilization/aeration-records/{id}/residual-test with a passing verdict"
        actor: DosimetryAnalyst
        preconditions: ["record.status == RETEST_REQUIRED", "clock_now >= record.target_end_at", "both residual readings within limits"]
        side_effects: ["lot.residual_status AERATING -> RESIDUAL_PASS"]
      - from: RETEST_REQUIRED
        to: EXHAUSTED
        trigger: "POST /sterilization/aeration-records/{id}/residual-test with a failing verdict, budget exhausted"
        actor: DosimetryAnalyst
        preconditions: ["record.status == RETEST_REQUIRED", "clock_now >= record.target_end_at", "retest_count + 1 > MAX_RESIDUAL_RETESTS"]
        side_effects:
          - "retest_count += 1"
          - "lot.residual_status AERATING -> RESIDUAL_FAIL"
          - "lot.status QUARANTINE -> REJECTED; lot.quarantine_reason = RESIDUAL_FAIL"
          - "customer.open_lot_count -= 1"

  # --------------------------------------------------------- AdverseEvent ----
  - entity: AdverseEvent
    dimension: status
    initial_state: REPORTED
    terminal_states: [RESTERILIZE_APPROVED, SCRAP_APPROVED, DISMISSED]
    transitions:
      - from: REPORTED
        to: RESTERILIZE_APPROVED
        trigger: "POST /sterilization/adverse-events/{id}/disposition with disposition RESTERILIZE"
        actor: QualityReleaseOfficer
        preconditions: ["event.status == REPORTED", "subject lot.status == RELEASED"]
        side_effects: ["CASCADE B hops 1-3 as documented on Lot.RELEASED_to_RECALLED"]
      - from: REPORTED
        to: SCRAP_APPROVED
        trigger: "POST /sterilization/adverse-events/{id}/disposition with disposition SCRAP"
        actor: QualityReleaseOfficer
        preconditions: ["event.status == REPORTED", "subject lot.status IN {RELEASED, QUARANTINE}"]
        side_effects: ["lot.status -> SCRAPPED", "lot.schedulable = false", "customer.open_lot_count -= 1 when the lot was in QUARANTINE"]
      - from: REPORTED
        to: DISMISSED
        trigger: "POST /sterilization/adverse-events/{id}/disposition with disposition DISMISS"
        actor: QualityReleaseOfficer
        preconditions: ["event.status == REPORTED"]
        side_effects: ["lot.quarantine_reason ADVERSE_EVENT -> ROUTINE when the lot is in QUARANTINE; lot status unchanged"]

  # -------------------------------------------------------- EmissionPermit ---
  - entity: EmissionPermit
    dimension: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: POST /sterilization/cycles/{id}/start commit leaves consumed_kg_ytd >= annual_allowance_kg; OR POST /sterilization/emission-permits/{id}/status with status SUSPENDED"
        actor: system
        preconditions: ["permit.status == ACTIVE"]
        side_effects: ["subsequent cycle starts under this permit are rejected with ERR_PERMIT_NOT_ACTIVE"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /sterilization/cycles/{id}/abort credit leaves consumed_kg_ytd < annual_allowance_kg; OR POST /sterilization/emission-permits/{id}/status with status ACTIVE"
        actor: system
        preconditions: ["permit.status == SUSPENDED"]
        side_effects: ["cycle starts under this permit are permitted again"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /sterilization/emission-permits/{id}/status with status EXPIRED"
        actor: RegulatoryAdmin
        preconditions: ["permit.status == ACTIVE"]
        side_effects: ["permanent; no transition out of EXPIRED"]
      - from: SUSPENDED
        to: EXPIRED
        trigger: "POST /sterilization/emission-permits/{id}/status with status EXPIRED"
        actor: RegulatoryAdmin
        preconditions: ["permit.status == SUSPENDED"]
        side_effects: ["permanent"]

  # ---------------------------------------------------------------- Chamber --
  - entity: Chamber
    dimension: status
    initial_state: AVAILABLE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /sterilization/chambers/{id}/status with status MAINTENANCE"
        actor: RegulatoryAdmin
        preconditions: ["chamber.status == AVAILABLE"]
        side_effects: ["POST /sterilization/cycles/{id}/start on this chamber is rejected with ERR_CHAMBER_UNAVAILABLE"]
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /sterilization/chambers/{id}/status with status AVAILABLE"
        actor: RegulatoryAdmin
        preconditions: ["chamber.status == MAINTENANCE"]
        side_effects: []
      - from: AVAILABLE
        to: DECOMMISSIONED
        trigger: "POST /sterilization/chambers/{id}/status with status DECOMMISSIONED"
        actor: RegulatoryAdmin
        preconditions: ["chamber.status IN {AVAILABLE, MAINTENANCE}"]
        side_effects: ["POST /sterilization/cycles referencing this chamber is rejected with ERR_CHAMBER_UNAVAILABLE"]
      - from: MAINTENANCE
        to: DECOMMISSIONED
        trigger: "POST /sterilization/chambers/{id}/status with status DECOMMISSIONED"
        actor: RegulatoryAdmin
        preconditions: ["chamber.status == MAINTENANCE"]
        side_effects: ["as above"]

  # ------------------------------------------------------------ CycleRecipe --
  - entity: CycleRecipe
    dimension: status
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /sterilization/cycle-recipes/{id}/approve"
        actor: RegulatoryAdmin
        preconditions: ["recipe.status == DRAFT"]
        side_effects: ["the recipe becomes usable by POST /sterilization/cycles"]

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: load-position-create-stale-cycle
    parent_entity: Cycle
    write_endpoint: "POST /sterilization/cycles/{id}/load-positions"
    occ_field: "expected_cycle_version"
    description: |
      Adding a LoadPosition to a Cycle whose version has advanced since the
      client last observed it is rejected. Extending a load map is a legitimate
      repeat operation - a second position on the same cycle would otherwise
      succeed on its own merits - so the only sound guard is a stale-version
      check on the parent Cycle. The version advances on every load-map write,
      on the READY sign-off, and on cascade-driven position removals, so a
      client working from an older read is operating on a load map and a
      load_density_g_per_cm3 that no longer exist.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

  - rule_id: adverse-event-create-stale-lot
    parent_entity: Lot
    write_endpoint: "POST /sterilization/lots/{id}/adverse-events"
    occ_field: "expected_lot_version"
    description: |
      Reporting an AdverseEvent against a Lot whose version has advanced since
      the client last observed it is rejected. Multiple adverse events on one
      lot are legitimate, so a second report cannot be turned away by any state
      precondition; the stale-version check on the parent Lot is what tells the
      reporter that the lot's disposition, quarantine_reason, or residual
      posture moved underneath their read.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  # -- combinatorial mode (b): nested rounding where the order changes cents --
  - name: cycle_load_density
    trigger: "Every load-map mutation: POST /sterilization/cycles/{id}/load-positions, DELETE /sterilization/cycles/{id}/load-positions/{position_id}, POST /sterilization/cycles/{id}/abort, and CASCADE A hop 4 position removals. Writes Cycle.load_density_g_per_cm3."
    algorithm: aggregation
    formula: |
      # Input set: every LoadPosition row p whose p.cycle_id == cycle.id.
      # product(p) := the Product row referenced by Lot(p.lot_id).product_id.
      #
      # PINNED EVALUATION ORDER (this is the whole point of the rule):
      #   1. accumulate total_mass_g   with NO intermediate rounding
      #   2. accumulate total_volume_cm3 with NO intermediate rounding
      #   3. divide ONCE
      #   4. round ONCE to 4 decimal places, round_half_up
      #
      # The rejected alternative - rounding each position's own density to 4dp
      # and then averaging those per-position densities - is explicitly NOT the
      # rule and produces a different number for any load whose positions have
      # unequal volumes.
      total_mass_g     = SUM over p of ( p.pallet_count * product(p).pallet_mass_kg   * 1000 )
      total_volume_cm3 = SUM over p of ( p.pallet_count * product(p).pallet_volume_m3 * 1000000 )
      if total_volume_cm3 == 0:
          load_density_g_per_cm3 = 0.0000
      else:
          load_density_g_per_cm3 = round_half_up( total_mass_g / total_volume_cm3 , 4 )
    input_set: "All LoadPosition rows of the cycle, regardless of the lot's status. Positions removed by a DELETE or by CASCADE A hop 4 are excluded because the row no longer exists."
    constants:
      KG_TO_G: 1000
      M3_TO_CM3: 1000000
    precision: "4 decimal places, round_half_up; a single rounding step applied to the quotient only"
    variants: []

  # ---- dual variant #1: dosimetry domain (Cycle / Indicator readings) -------
  - name: delivered_dose_kgy
    trigger: "POST /sterilization/cycles/{id}/dosimetry-close. Writes Cycle.delivered_dose_kgy and Cycle.max_observed_dose_kgy."
    algorithm: aggregation
    formula: |
      D = { Indicator i : LoadPosition(i.load_position_id).cycle_id == cycle.id
                          AND i.indicator_type == DOSIMETER
                          AND i.reading_status == READ }
      if D is empty: reject with ERR_DOSIMETRY_INCOMPLETE
      max_observed_dose_kgy = round_half_up( MAX over i in D of i.measured_dose_kgy , 2 )
      delivered_dose_kgy = <variant-selected, see variants below>
    input_set: "READ dosimeters only. BIOLOGICAL indicators never contribute to either dose figure; UNREAD dosimeters are excluded (and their presence separately blocks the close with ERR_DOSIMETRY_INCOMPLETE)."
    constants: {}
    precision: "2 decimal places, round_half_up, applied once to the variant's scalar result"
    variants:
      - name: ROUTINE_MEAN
        when: "CycleRecipe(cycle.recipe_id).dose_basis == ROUTINE_MEAN"
        difference: |
          S = { i in D : i.placement_zone == ROUTINE }
          if S is empty: reject with ERR_DOSIMETRY_INCOMPLETE
          delivered_dose_kgy = round_half_up( SUM(i.measured_dose_kgy for i in S) / COUNT(S) , 2 )
      - name: MIN_ZONE
        when: "CycleRecipe(cycle.recipe_id).dose_basis == MIN_ZONE"
        difference: |
          S = { i in D : i.placement_zone == MIN_DOSE }
          if S is empty: reject with ERR_DOSIMETRY_INCOMPLETE
          delivered_dose_kgy = round_half_up( MIN(i.measured_dose_kgy for i in S) , 2 )
          # For any load whose MIN_DOSE readings sit below the ROUTINE mean this
          # yields a strictly smaller number than ROUTINE_MEAN on identical
          # indicator data, and can flip dose_conformance_verdict from
          # CONFORMING to UNDERDOSE.

  - name: dose_conformance_verdict
    trigger: "POST /sterilization/cycles/{id}/dosimetry-close, immediately after delivered_dose_kgy. Selects the DOSIMETRY_REVIEW branch and writes Cycle.deviation_code."
    algorithm: threshold
    formula: |
      # PINNED EVALUATION ORDER - the first matching branch wins, later branches
      # are not evaluated. Reordering these three tests changes deviation_code
      # for loads that breach more than one condition.
      product_dose_ceiling = MIN over the distinct Products of the lots in this
                             cycle's load map of product.max_allowed_dose_kgy
      if EXISTS Indicator i on this cycle with i.indicator_type == BIOLOGICAL
                                          and i.bi_result == POSITIVE:
          verdict = DEVIATION ; deviation_code = BI_POSITIVE
      elif delivered_dose_kgy < recipe.min_dose_kgy:            # strict <, so == min conforms
          verdict = DEVIATION ; deviation_code = UNDERDOSE
      elif max_observed_dose_kgy > recipe.max_dose_kgy
        or max_observed_dose_kgy > product_dose_ceiling:        # strict >, so == ceiling conforms
          verdict = DEVIATION ; deviation_code = OVERDOSE
      else:
          verdict = CONFORMING ; deviation_code = NONE
    input_set: "All Indicator rows of the cycle plus the recipe's dose band plus every distinct Product represented in the load map."
    constants: {}
    precision: "comparisons are made on the already-rounded 2dp values of delivered_dose_kgy and max_observed_dose_kgy"
    variants: []

  - name: lot_cumulative_dose
    trigger: "The DOSIMETRY_REVIEW -> DOSE_CONFORMING transition only. Writes Lot.cumulative_dose_kgy for every lot of the cycle."
    algorithm: aggregation
    formula: |
      for each Lot L referenced by a LoadPosition of this cycle,
      processed in LoadPosition.created_at ASC order,
      tie-broken by LoadPosition.position_index ASC:
          L.cumulative_dose_kgy = round_half_up( L.cumulative_dose_kgy
                                                 + cycle.delivered_dose_kgy , 2 )
      # A lot occupying more than one LoadPosition of the same cycle is credited
      # exactly once: the distinct set of lot_id values is used, not the row set.
    input_set: "Distinct Lot rows referenced by the cycle's LoadPosition rows. A DEVIATION close does NOT touch cumulative_dose_kgy."
    constants: {}
    precision: "2 decimal places, round_half_up, applied on each accumulation step"
    variants: []

  # ---- dual variant #2: residual / aeration domain (AerationRecord / Lot) --
  - name: aeration_required_hours
    trigger: "POST /sterilization/lots/{id}/aeration-records (variant STANDARD) and every failing POST /sterilization/aeration-records/{id}/residual-test (variant EXTENDED_RETEST). Writes AerationRecord.required_hours, AerationRecord.target_end_at, AerationRecord.density_factor and AerationRecord.variant_applied."
    algorithm: threshold
    formula: |
      # governing cycle := the Cycle referenced by the LoadPosition row for this
      # lot with the greatest LoadPosition.created_at; ties broken by
      # LoadPosition.position_index ASC. base_hours and density_factor are
      # snapshotted onto the AerationRecord at creation and never re-read.
      d = governing_cycle.load_density_g_per_cm3
      density_factor(d) = 1.00  when d <  0.1000
                        = 1.25  when 0.1000 <= d < 0.2000
                        = 1.60  when d >= 0.2000
      # both breakpoints are lower-inclusive: d == 0.1000 selects 1.25, not 1.00
      required_hours = <variant-selected>
      target_end_at  = <variant-selected anchor> + required_hours hours
    input_set: "recipe.aeration_base_hours of the governing cycle's recipe and the governing cycle's load_density_g_per_cm3 at the moment the AerationRecord was opened."
    constants:
      DENSITY_FACTOR_LOW: 1.00
      DENSITY_FACTOR_MID: 1.25
      DENSITY_FACTOR_HIGH: 1.60
      DENSITY_BREAK_LOW: 0.1000
      DENSITY_BREAK_HIGH: 0.2000
      RETEST_MULTIPLIER_STEP: 0.5
    precision: "required_hours is a whole number produced by ceil() applied once to the full product; target_end_at is exact to the second"
    variants:
      - name: STANDARD
        when: "AerationRecord.retest_count == 0 (record just opened)"
        difference: |
          required_hours = ceil( base_hours * density_factor )
          anchor         = AerationRecord.aeration_start_at
      - name: EXTENDED_RETEST
        when: "AerationRecord.retest_count >= 1 (recomputed on every failing residual test)"
        difference: |
          required_hours = ceil( base_hours * density_factor
                                 * (1 + RETEST_MULTIPLIER_STEP * retest_count) )
          anchor         = AerationRecord.last_failed_sample_at
          # Two divergences from STANDARD on identical base_hours and density:
          # a strictly larger multiplier AND a later anchor instant, so the two
          # variants never agree on target_end_at once a retest has occurred.

  - name: residual_verdict
    trigger: "POST /sterilization/aeration-records/{id}/residual-test. Selects the AerationRecord branch."
    algorithm: threshold
    formula: |
      product := Product(Lot(record.lot_id).product_id)
      pass = ( payload.eto_residual_ppm <= product.eto_residual_limit_ppm     # inclusive
           AND payload.ech_residual_ppm <= product.ech_residual_limit_ppm )   # inclusive
      if pass:            record -> PASSED
      elif record.retest_count + 1 <= MAX_RESIDUAL_RETESTS:
                          record -> RETEST_REQUIRED with retest_count += 1
      else:               record -> EXHAUSTED with retest_count += 1
    input_set: "The two ppm readings in the request body and the two per-product limits. The elapsed-time gate (clock_now >= target_end_at) is a validation, not part of the verdict."
    constants:
      MAX_RESIDUAL_RETESTS: 2
    precision: "ppm comparisons are exact decimal comparisons; no rounding"
    variants: []

  # -- combinatorial mode (c): circular-looking dependency, order pinned ------
  - name: emission_fee_usd
    trigger: "POST /sterilization/cycles/{id}/start for a Cycle whose chamber.modality == ETO. Writes Cycle.abated_eto_kg, Cycle.emission_fee_usd, EmissionPermit.consumed_kg_ytd and EmissionPermit.total_emission_fee_usd."
    algorithm: tiered_pricing
    formula: |
      # The fee depends on the rate; the rate depends on the permit's YTD
      # consumption INCLUDING this cycle's own charge. That is the circularity,
      # and this is the pinned resolution order. Selecting the tier from the
      # PRE-charge consumed_kg_ytd is the wrong answer and produces a different
      # fee whenever a charge straddles a breakpoint.
      step 1: abated_kg       = round_half_up( cycle.raw_eto_charge_kg
                                               * (1 - chamber.abatement_efficiency_pct / 100) , 3 )
      step 2: prospective_ytd = round_half_up( permit.consumed_kg_ytd + abated_kg , 3 )
      step 3: reject with ERR_PERMIT_ALLOWANCE_EXCEEDED when
                          prospective_ytd > permit.annual_allowance_kg   # strict >, == is allowed
      step 4: rate_usd_per_kg = 12.00  when prospective_ytd <= 50.000
                              = 18.50  when 50.000 <  prospective_ytd <= 200.000
                              = 27.00  when prospective_ytd >  200.000
      step 5: emission_fee_usd = round_half_up( abated_kg * rate_usd_per_kg , 2 )
      step 6: commit  permit.consumed_kg_ytd       = prospective_ytd
                      permit.total_emission_fee_usd = round_half_up(
                          permit.total_emission_fee_usd + emission_fee_usd , 2 )
                      cycle.abated_eto_kg = abated_kg
      # GAMMA and EBEAM chambers: raw_eto_charge_kg is ignored, abated_kg = 0.000,
      # emission_fee_usd = 0.00, and steps 3-6 are skipped entirely.
    input_set: "The single Cycle being started, its Chamber's abatement_efficiency_pct, and the EmissionPermit referenced by that Chamber."
    constants:
      TIER1_MAX_KG: 50.000
      TIER2_MAX_KG: 200.000
      TIER1_RATE_USD: 12.00
      TIER2_RATE_USD: 18.50
      TIER3_RATE_USD: 27.00
    precision: "abated_kg and consumed_kg_ytd at 3 decimals round_half_up; fees at 2 decimals round_half_up"
    variants: []

  - name: cycle_occupancy_window
    trigger: "POST /sterilization/cycles. Writes Cycle.occupancy_end_at and drives both overlap validations."
    algorithm: interval_merge
    formula: |
      occupancy_start_at = cycle.scheduled_start_at
      occupancy_end_at   = cycle.scheduled_end_at + chamber.turnaround_minutes minutes
      dwell_start_at     = cycle.scheduled_start_at
      dwell_end_at       = cycle.scheduled_end_at
      #
      # RULE A - Chamber occupancy, PAIRWISE EXCLUSIVE, BUFFER-EXTENDED,
      #          HALF-OPEN [occupancy_start_at, occupancy_end_at):
      #   reject when EXISTS another Cycle X with X.chamber_id == cycle.chamber_id
      #   and X.status NOT IN {CANCELLED, DOSE_CONFORMING, DOSE_DEVIATION}
      #   and  new.occupancy_start_at <  X.occupancy_end_at
      #   and  X.occupancy_start_at   <  new.occupancy_end_at
      #   Touching endpoints do NOT collide: a cycle starting exactly at another
      #   cycle's occupancy_end_at is accepted.
      #
      # RULE B - Permit ETO concurrency, AGGREGATE COUNT, NO BUFFER,
      #          CLOSED [dwell_start_at, dwell_end_at]:
      #   applies only when chamber.modality == ETO.
      #   collisions = COUNT of Cycles Y such that
      #        Chamber(Y.chamber_id).permit_id == Chamber(cycle.chamber_id).permit_id
      #    and Chamber(Y.chamber_id).modality == ETO
      #    and Y.status NOT IN {CANCELLED, DOSE_CONFORMING, DOSE_DEVIATION}
      #    and new.dwell_start_at <= Y.dwell_end_at
      #    and Y.dwell_start_at   <= new.dwell_end_at      # both <=, so touching COLLIDES
      #   reject when collisions >= permit.max_concurrent_eto_cycles.
    input_set: "Non-terminal cycles only. CANCELLED, DOSE_CONFORMING and DOSE_DEVIATION cycles release both the chamber and the permit slot."
    constants: {}
    precision: "instant comparisons to the second; no rounding"
    variants: []

  - name: vdmax_audit_verdict
    trigger: "POST /sterilization/qualifications/{id}/dose-audits. Writes DoseAudit.outcome, DoseAudit.next_audit_due_at, DoseAudit.qualification_status_after and the parent ProductQualification's audit fields."
    algorithm: threshold
    formula: |
      # samples_tested must be exactly VDMAX_SAMPLE_SIZE; anything else is
      # rejected at validation priority 25 with ERR_VALIDATION.
      if positives == 0:      outcome = PASS             ; interval_days = 90
      elif positives == 1:    outcome = CONDITIONAL_PASS ; interval_days = 30
      else:                   outcome = FAIL             ; interval_days = 0
      # boundary: exactly 1 positive is a CONDITIONAL_PASS, exactly 2 is a FAIL.
      next_audit_due_at = performed_at + interval_days days   when outcome != FAIL
                        = null                                when outcome == FAIL
      qualification updates:
        PASS             -> status QUALIFIED   ; consecutive_conditional_count = 0
        CONDITIONAL_PASS -> consecutive_conditional_count += 1;
                            status CONDITIONAL when the new count < 2,
                            status REVOKED     when the new count >= 2
                            (a REVOKED qualification also sets next_audit_due_at = null)
        FAIL             -> status SUSPENDED   ; consecutive_conditional_count = 0
      qualification.audit_interval_days = interval_days
      qualification.last_audit_at       = performed_at
    input_set: "The single audit being recorded plus the parent qualification's consecutive_conditional_count."
    constants:
      VDMAX_SAMPLE_SIZE: 100
      PASS_INTERVAL_DAYS: 90
      CONDITIONAL_INTERVAL_DAYS: 30
      MAX_CONSECUTIVE_CONDITIONAL: 2
    precision: "date arithmetic in whole days on the UTC instant of performed_at"
    variants: []

  - name: governing_cycle_selector
    trigger: "Read by POST /sterilization/lots/{id}/release, POST /sterilization/lots/{id}/aeration-records, and calculations.aeration_required_hours whenever 'the governing cycle of a lot' is needed."
    algorithm: chronological
    formula: |
      candidates = { LoadPosition p : p.lot_id == lot.id }
      if candidates is empty -> the lot has no governing cycle; the calling
         endpoint rejects with ERR_LOT_NOT_RELEASABLE (release) or
         ERR_AERATION_NOT_APPLICABLE (aeration).
      ranking   = ORDER BY p.created_at DESC
      tie_break = then ORDER BY p.position_index ASC
      governing_cycle = Cycle( first row of the ranked candidate list .cycle_id )
      # Deliberately never uses any id value as an ordering key.
    input_set: "All LoadPosition rows referencing the lot, including positions on CANCELLED cycles - a lot whose only cycle was aborted has its positions hard-deleted, so it has no governing cycle."
    constants: {}
    precision: "created_at compared at millisecond resolution (three fractional digits)"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST rule that fails determines the returned error_id)
# =============================================================================
validations:

  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five roles declared in section 1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "The caller's role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 25
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: required fields present, types correct, enum members valid, numeric ranges satisfied (pallet_count >= 1, positives between 0 and samples_tested, samples_tested == 100, abatement_efficiency_pct in [0,100], scheduled_end_at > scheduled_start_at, exactly one of measured_dose_kgy / bi_result on an indicator reading and it must match indicator_type, spore_population required for BIOLOGICAL indicators and forbidden for DOSIMETER)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 30
    category: existence
    check: "Every path id resolves, checked left to right. Each resource type raises its own error id: ERR_CUSTOMER_NOT_FOUND for /customers/{id}, ERR_PRODUCT_NOT_FOUND for /products/{id}, ERR_PERMIT_NOT_FOUND for /emission-permits/{id}, ERR_CHAMBER_NOT_FOUND for /chambers/{id}, ERR_RECIPE_NOT_FOUND for /cycle-recipes/{id}, ERR_QUALIFICATION_NOT_FOUND for /qualifications/{id}, ERR_LOT_NOT_FOUND for /lots/{id}, ERR_CYCLE_NOT_FOUND for /cycles/{id}, ERR_LOAD_POSITION_NOT_FOUND for /load-positions/{id} and for the {position_id} segment of the load-position delete, ERR_INDICATOR_NOT_FOUND for /indicators/{id}, ERR_AERATION_RECORD_NOT_FOUND for /aeration-records/{id}, ERR_ADVERSE_EVENT_NOT_FOUND for /adverse-events/{id}. On a nested path the outer segment is resolved first."
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 35
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row, each raising its own error id: customer_id -> ERR_CUSTOMER_NOT_FOUND, product_id -> ERR_PRODUCT_NOT_FOUND, permit_id -> ERR_PERMIT_NOT_FOUND, recipe_id -> ERR_RECIPE_NOT_FOUND, chamber_id -> ERR_CHAMBER_NOT_FOUND, lot_id -> ERR_LOT_NOT_FOUND"
    error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "POST /sterilization/products, /emission-permits, /chambers, /qualifications, /lots, /cycles, /cycles/{id}/load-positions"

  - priority: 38
    category: business_constraint
    check: "Unique code constraints hold: Customer.account_code, Chamber.chamber_code, CycleRecipe.recipe_code, Cycle.cycle_code and Indicator.serial_code globally; Product.product_code within a customer_id; Lot.lot_code within a customer_id"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /sterilization/customers, /products, /chambers, /cycle-recipes, /lots, /cycles, /load-positions/{id}/indicators"

  - priority: 40
    category: auth
    check: "When the caller's role is CustomerRep, X-User-ID equals the customer_id of the addressed resource (the Customer itself, the Product's customer_id, or the Lot's customer_id)"
    error_id: ERR_CUSTOMER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /sterilization/customers/{id}, GET /sterilization/customers/{id}/products, GET /sterilization/products/{id}, POST /sterilization/lots, GET /sterilization/lots/{id}, POST /sterilization/lots/{id}/adverse-events"

  - priority: 45
    category: state
    check: "The target resource is in a state from which the requested transition is declared in section 1.2. POST /sterilization/cycles/{id}/ready admits both PLANNED and LOADING here so that the empty-load-map check at priority 82 stays reachable. Endpoint-specific error ids: ERR_CYCLE_NOT_READY for start on a non-READY cycle; ERR_RETEST_LIMIT_EXHAUSTED for a residual test on a PASSED or EXHAUSTED record; ERR_INDICATOR_ALREADY_READ for a reading on an already-READ indicator whose cycle is not in DOSE_DEVIATION; ERR_LOT_NOT_RELEASABLE for a release on a lot that is not in QUARANTINE or has residual_status RESIDUAL_FAIL or has no governing cycle; ERR_INVALID_STATE otherwise"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 46
    category: state
    check: "The referenced CycleRecipe has status APPROVED"
    error_id: ERR_RECIPE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /sterilization/cycles"

  - priority: 47
    category: state
    check: "The lot has schedulable == true"
    error_id: ERR_LOT_NOT_SCHEDULABLE
    http_status: 409
    applies_to: "POST /sterilization/cycles/{id}/load-positions"

  - priority: 50
    category: state
    check: "The OCC field equals the parent's current version: expected_cycle_version == Cycle.version, expected_lot_version == Lot.version"
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
    applies_to: "POST /sterilization/cycles/{id}/load-positions (ERR_STALE_CYCLE_VERSION), POST /sterilization/lots/{id}/adverse-events (ERR_STALE_LOT_VERSION)"

  - priority: 55
    category: business_safety
    check: "No BIOLOGICAL Indicator on the lot's governing cycle has bi_result == POSITIVE"
    error_id: ERR_BI_POSITIVE_BLOCKS_RELEASE
    http_status: 409
    applies_to: "POST /sterilization/lots/{id}/release"

  - priority: 58
    category: business_safety
    check: "The lot's governing cycle has status DOSE_CONFORMING"
    error_id: ERR_CYCLE_DEVIATION_BLOCKS_RELEASE
    http_status: 409
    applies_to: "POST /sterilization/lots/{id}/release"

  - priority: 60
    category: business_safety
    check: "A ProductQualification exists for the (product, recipe) pair with status IN {QUALIFIED, CONDITIONAL}. A qualification whose next_audit_due_at has been reached is first lazily moved to AUDIT_DUE and therefore fails this check."
    error_id: ERR_QUALIFICATION_NOT_CURRENT
    http_status: 409
    applies_to: "POST /sterilization/cycles/{id}/load-positions, POST /sterilization/lots/{id}/release"

  - priority: 65
    category: business_safety
    check: "The chamber has status AVAILABLE (for cycle start) or status != DECOMMISSIONED (for cycle creation)"
    error_id: ERR_CHAMBER_UNAVAILABLE
    http_status: 409
    applies_to: "POST /sterilization/cycles, POST /sterilization/cycles/{id}/start"

  - priority: 68
    category: business_safety
    check: "The EmissionPermit backing the chamber has status ACTIVE"
    error_id: ERR_PERMIT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /sterilization/cycles/{id}/start"

  - priority: 70
    category: business_referential
    check: "Segregation of duties: the releasing QualityReleaseOfficer's X-User-ID differs from both the governing cycle's operator_user_id and its dosimetry_closed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /sterilization/lots/{id}/release"

  - priority: 72
    category: business_referential
    check: "Modality coherence: CycleRecipe.modality == Chamber.modality on cycle creation, and Chamber.modality is a member of the lot's Customer.contracted_modalities on load-position creation"
    error_id: ERR_MODALITY_MISMATCH
    http_status: 422
    applies_to: "POST /sterilization/cycles, POST /sterilization/cycles/{id}/load-positions"

  - priority: 75
    category: business_temporal
    check: "Chamber occupancy rule A: the new cycle's half-open buffer-extended interval [scheduled_start_at, scheduled_end_at + turnaround_minutes) does not intersect that of any non-terminal cycle in the same chamber. Touching endpoints are accepted."
    error_id: ERR_CHAMBER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /sterilization/cycles"

  - priority: 78
    category: business_temporal
    check: "Permit concurrency rule B: for ETO chambers, the count of non-terminal ETO cycles under the same permit whose CLOSED dwell interval [scheduled_start_at, scheduled_end_at] intersects the new cycle's closed dwell interval is strictly less than permit.max_concurrent_eto_cycles. Touching endpoints DO count as intersecting."
    error_id: ERR_PERMIT_CONCURRENCY_EXCEEDED
    http_status: 409
    applies_to: "POST /sterilization/cycles"

  - priority: 80
    category: business_temporal
    check: "Residual timing: clock_now >= AerationRecord.target_end_at for a residual test; and for a release, lot.residual_status is not PENDING_AERATION and not AERATING"
    error_id: ERR_AERATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /sterilization/aeration-records/{id}/residual-test, POST /sterilization/lots/{id}/release"

  - priority: 81
    category: business_constraint
    check: "The lot's residual_status is PENDING_AERATION when opening an aeration record; a lot whose residual_status is NOT_APPLICABLE has no aeration obligation"
    error_id: ERR_AERATION_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /sterilization/lots/{id}/aeration-records"

  - priority: 82
    category: business_constraint
    check: "The cycle has at least one LoadPosition row"
    error_id: ERR_LOAD_MAP_EMPTY
    http_status: 422
    applies_to: "POST /sterilization/cycles/{id}/ready"

  - priority: 84
    category: business_constraint
    check: "Indicator placement is complete: MIN_DOSE dosimeter count >= recipe.required_min_zone_dosimeters, ROUTINE dosimeter count >= recipe.required_routine_dosimeters, BIOLOGICAL count >= recipe.required_biological_indicators, all counted across every LoadPosition of the cycle"
    error_id: ERR_INDICATOR_PLACEMENT_INCOMPLETE
    http_status: 422
    applies_to: "POST /sterilization/cycles/{id}/ready"

  - priority: 86
    category: business_constraint
    check: "recipe.density_min_g_per_cm3 <= cycle.load_density_g_per_cm3 < recipe.density_max_g_per_cm3 - lower edge inclusive, upper edge EXCLUSIVE"
    error_id: ERR_LOAD_DENSITY_OUT_OF_BAND
    http_status: 422
    applies_to: "POST /sterilization/cycles/{id}/ready"

  - priority: 88
    category: business_constraint
    check: "cycle.loaded_pallet_count + payload.pallet_count <= chamber.pallet_capacity, and payload.pallet_count <= lot.available_pallet_count"
    error_id: ERR_CHAMBER_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /sterilization/cycles/{id}/load-positions"

  - priority: 89
    category: business_constraint
    check: "No existing LoadPosition on the same cycle already uses payload.position_index"
    error_id: ERR_DUPLICATE_POSITION_INDEX
    http_status: 409
    applies_to: "POST /sterilization/cycles/{id}/load-positions"

  - priority: 90
    category: business_constraint
    check: "A PARAMETRIC release is only permitted when the governing cycle's recipe has required_biological_indicators == 0"
    error_id: ERR_PARAMETRIC_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /sterilization/lots/{id}/release"

  - priority: 91
    category: business_constraint
    check: "A DOSIMETRIC release requires every BIOLOGICAL Indicator on the governing cycle to have reading_status == READ"
    error_id: ERR_BI_INCUBATION_PENDING
    http_status: 409
    applies_to: "POST /sterilization/lots/{id}/release"

  - priority: 92
    category: business_constraint
    check: "round_half_up(lot.cumulative_dose_kgy + recipe.target_dose_kgy, 2) <= product.max_cumulative_dose_kgy"
    error_id: ERR_CUMULATIVE_DOSE_EXCEEDED
    http_status: 422
    applies_to: "POST /sterilization/cycles/{id}/load-positions"

  - priority: 93
    category: business_constraint
    check: "Every Indicator on the cycle has reading_status == READ, and the variant-selected dosimeter subset required by delivered_dose_kgy is non-empty"
    error_id: ERR_DOSIMETRY_INCOMPLETE
    http_status: 422
    applies_to: "POST /sterilization/cycles/{id}/dosimetry-close"

  - priority: 95
    category: business_fiscal
    check: "For ETO cycle starts, prospective_ytd (emission_fee_usd step 2) <= permit.annual_allowance_kg - strictly greater is rejected, exactly equal is accepted"
    error_id: ERR_PERMIT_ALLOWANCE_EXCEEDED
    http_status: 402
    applies_to: "POST /sterilization/cycles/{id}/start"

  - priority: 98
    category: business_fiscal
    check: "The lot's Customer has status ACTIVE"
    error_id: ERR_CUSTOMER_SUSPENDED
    http_status: 402
    applies_to: "POST /sterilization/lots, POST /sterilization/lots/{id}/release"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ------------------------------------------------------------- Customer ---
  - method: POST
    path: "/sterilization/customers"
    description: "Register a device manufacturer account."
    roles: [RegulatoryAdmin]
    code: 201
    input: [name, account_code, contracted_modalities, "status?"]
    output: Customer
    side_effects: ["open_lot_count initialised to 0"]

  - method: GET
    path: "/sterilization/customers/{id}"
    description: "Read one customer."
    roles: [RegulatoryAdmin, CustomerRep, QualityReleaseOfficer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/sterilization/customers"
    description: "List customers with pagination."
    roles: [RegulatoryAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: POST
    path: "/sterilization/customers/{id}/status"
    description: "Set a customer's commercial standing. status is one of ACTIVE or SUSPENDED."
    roles: [RegulatoryAdmin]
    code: 200
    input: [status]
    output: Customer
    side_effects: ["a SUSPENDED customer can no longer create lots or have lots released"]

  - method: GET
    path: "/sterilization/customers/{id}/products"
    description: "List the products of one customer (reverse reachability for Product.customer_id)."
    roles: [RegulatoryAdmin, CustomerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: Product[]
    side_effects: []

  # -------------------------------------------------------------- Product ---
  - method: POST
    path: "/sterilization/products"
    description: "Register a product family with its mass, volume, dose and residual limits."
    roles: [RegulatoryAdmin]
    code: 201
    input: [customer_id, product_code, pallet_mass_kg, pallet_volume_m3, max_allowed_dose_kgy, max_cumulative_dose_kgy, eto_residual_limit_ppm, ech_residual_limit_ppm, "requires_aeration?", "status?"]
    output: Product
    side_effects: []

  - method: GET
    path: "/sterilization/products/{id}"
    description: "Read one product."
    roles: [RegulatoryAdmin, CustomerRep, CycleOperator, QualityReleaseOfficer]
    code: 200
    input: []
    output: Product
    side_effects: []

  # ------------------------------------------------------- EmissionPermit ---
  - method: POST
    path: "/sterilization/emission-permits"
    description: "Create an annual air permit with an EtO mass allowance and a concurrency cap."
    roles: [RegulatoryAdmin]
    code: 201
    input: [permit_code, permit_year, annual_allowance_kg, max_concurrent_eto_cycles]
    output: EmissionPermit
    side_effects: ["consumed_kg_ytd and total_emission_fee_usd initialised to 0; status ACTIVE"]

  - method: GET
    path: "/sterilization/emission-permits/{id}"
    description: "Read one permit including its running consumption and fee ledger."
    roles: [RegulatoryAdmin, CycleOperator]
    code: 200
    input: []
    output: EmissionPermit
    side_effects: []

  - method: POST
    path: "/sterilization/emission-permits/{id}/status"
    description: "Set a permit's standing. status is one of ACTIVE, SUSPENDED or EXPIRED; EXPIRED is terminal."
    roles: [RegulatoryAdmin]
    code: 200
    input: [status]
    output: EmissionPermit
    side_effects: ["EXPIRED is terminal"]

  - method: GET
    path: "/sterilization/emission-permits/{id}/chambers"
    description: "List the chambers backed by one permit (reverse reachability for Chamber.permit_id)."
    roles: [RegulatoryAdmin, CycleOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: Chamber[]
    side_effects: []

  # -------------------------------------------------------------- Chamber ---
  - method: POST
    path: "/sterilization/chambers"
    description: "Commission a sterilization chamber under a permit."
    roles: [RegulatoryAdmin]
    code: 201
    input: [permit_id, chamber_code, modality, pallet_capacity, turnaround_minutes, abatement_efficiency_pct]
    output: Chamber
    side_effects: ["status AVAILABLE"]

  - method: GET
    path: "/sterilization/chambers/{id}"
    description: "Read one chamber."
    roles: [RegulatoryAdmin, CycleOperator]
    code: 200
    input: []
    output: Chamber
    side_effects: []

  - method: POST
    path: "/sterilization/chambers/{id}/status"
    description: "Set a chamber's operational availability. status is one of AVAILABLE, MAINTENANCE or DECOMMISSIONED; DECOMMISSIONED is terminal."
    roles: [RegulatoryAdmin]
    code: 200
    input: [status]
    output: Chamber
    side_effects: ["MAINTENANCE blocks cycle starts; DECOMMISSIONED is terminal and also blocks cycle creation"]

  # ---------------------------------------------------------- CycleRecipe ---
  - method: POST
    path: "/sterilization/cycle-recipes"
    description: "Draft a validated recipe with its density band, dose band, dose basis, aeration base and indicator placement requirements."
    roles: [RegulatoryAdmin]
    code: 201
    input: [recipe_code, modality, density_min_g_per_cm3, density_max_g_per_cm3, target_dose_kgy, min_dose_kgy, max_dose_kgy, dose_basis, aeration_base_hours, required_min_zone_dosimeters, required_routine_dosimeters, required_biological_indicators]
    output: CycleRecipe
    side_effects: ["status DRAFT"]

  - method: GET
    path: "/sterilization/cycle-recipes/{id}"
    description: "Read one recipe."
    roles: [RegulatoryAdmin, CycleOperator, DosimetryAnalyst, QualityReleaseOfficer]
    code: 200
    input: []
    output: CycleRecipe
    side_effects: []

  - method: POST
    path: "/sterilization/cycle-recipes/{id}/approve"
    description: "Approve a draft recipe so cycles may be scheduled against it."
    roles: [RegulatoryAdmin]
    code: 200
    input: []
    output: CycleRecipe
    side_effects: ["status DRAFT -> APPROVED"]

  # -------------------------------------------------- ProductQualification --
  - method: POST
    path: "/sterilization/qualifications"
    description: "Open a VDmax dose qualification binding a product to a recipe."
    roles: [RegulatoryAdmin]
    code: 201
    input: [product_id, recipe_id, method, verification_dose_kgy, sal_exponent]
    output: ProductQualification
    side_effects: ["status PENDING; audit_interval_days 90; last_audit_at and next_audit_due_at null"]

  - method: GET
    path: "/sterilization/qualifications/{id}"
    description: "Read one qualification including its audit schedule."
    roles: [RegulatoryAdmin, CycleOperator, QualityReleaseOfficer]
    code: 200
    input: []
    output: ProductQualification
    side_effects: []

  - method: GET
    path: "/sterilization/qualifications"
    description: "List qualifications filtered by product, recipe or status (reverse reachability for ProductQualification.product_id and .recipe_id)."
    roles: [RegulatoryAdmin, CycleOperator, QualityReleaseOfficer]
    code: 200
    input: ["product_id?", "recipe_id?", "status?", "limit?", "offset?"]
    output: ProductQualification[]
    side_effects: []

  - method: POST
    path: "/sterilization/qualifications/{id}/dose-audits"
    description: "Record a quarterly VDmax dose audit; the verdict drives the qualification state machine."
    roles: [RegulatoryAdmin]
    code: 201
    input: [performed_at, samples_tested, positives, verification_dose_kgy_applied]
    output: DoseAudit
    side_effects:
      - "calculations.vdmax_audit_verdict sets outcome, next_audit_due_at and qualification_status_after"
      - "ProductQualification.status, .last_audit_at, .audit_interval_days, .next_audit_due_at and .consecutive_conditional_count updated"
      - "a REVOKED qualification sets schedulable = false on every RECEIVED or STAGED lot of the product"

  - method: GET
    path: "/sterilization/qualifications/{id}/dose-audits"
    description: "List the audit history of one qualification (reverse reachability for DoseAudit.qualification_id)."
    roles: [RegulatoryAdmin, QualityReleaseOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: DoseAudit[]
    side_effects: []

  # ------------------------------------------------------------------ Lot ---
  - method: POST
    path: "/sterilization/lots"
    description: "Receive a customer lot into the facility."
    roles: [CustomerRep]
    code: 201
    input: [customer_id, product_id, lot_code, total_pallet_count]
    output: Lot
    side_effects: ["status RECEIVED; residual_status NOT_APPLICABLE; available_pallet_count = total_pallet_count; customer.open_lot_count += 1"]

  - method: GET
    path: "/sterilization/lots/{id}"
    description: "Read one lot on both state dimensions."
    roles: [CustomerRep, CycleOperator, DosimetryAnalyst, QualityReleaseOfficer, RegulatoryAdmin]
    code: 200
    input: []
    output: Lot
    side_effects: []

  - method: GET
    path: "/sterilization/lots"
    description: "List lots filtered by customer, product, parent lot or either state dimension (reverse reachability for Lot.customer_id, Lot.product_id and the self-referential Lot.parent_lot_id)."
    roles: [CustomerRep, CycleOperator, DosimetryAnalyst, QualityReleaseOfficer, RegulatoryAdmin]
    code: 200
    input: ["customer_id?", "product_id?", "parent_lot_id?", "status?", "residual_status?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []

  - method: POST
    path: "/sterilization/lots/{id}/release"
    description: "Release a quarantined lot. release_mode is one of PARAMETRIC or DOSIMETRIC (never NONE). Enforces the full release gate chain in priority order: state, BI positive, cycle deviation, qualification, segregation of duties, residual, release-mode eligibility, customer standing."
    roles: [QualityReleaseOfficer]
    code: 200
    input: [release_mode]
    output: Lot
    side_effects:
      - "lot.status QUARANTINE -> RELEASED"
      - "release_mode, released_at, released_by_user_id and release_dose_kgy stamped"
      - "quarantine_reason reset to NONE"
      - "customer.open_lot_count -= 1"

  - method: POST
    path: "/sterilization/lots/{id}/aeration-records"
    description: "Open an aeration (degassing) record for an EtO-processed lot; computes the STANDARD required hours and target end."
    roles: [CycleOperator]
    code: 201
    input: []
    output: AerationRecord
    side_effects:
      - "calculations.aeration_required_hours variant STANDARD sets density_factor, base_hours, required_hours and target_end_at"
      - "lot.residual_status PENDING_AERATION -> AERATING"

  - method: GET
    path: "/sterilization/lots/{id}/aeration-records"
    description: "List the aeration records of one lot (reverse reachability for AerationRecord.lot_id)."
    roles: [CycleOperator, DosimetryAnalyst, QualityReleaseOfficer, RegulatoryAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: AerationRecord[]
    side_effects: []

  - method: POST
    path: "/sterilization/lots/{id}/adverse-events"
    description: "Report an adverse event against a released or quarantined lot. Guarded by optimistic concurrency on the lot."
    roles: [CustomerRep, QualityReleaseOfficer]
    code: 201
    input: [event_type, severity, description, expected_lot_version]
    output: AdverseEvent
    side_effects:
      - "AdverseEvent created in REPORTED with reported_by_user_id and lot_version_after"
      - "lot.quarantine_reason set to ADVERSE_EVENT when the lot is in QUARANTINE"
      - "increments Lot.version by 1"

  - method: GET
    path: "/sterilization/lots/{id}/adverse-events"
    description: "List the adverse events of one lot (reverse reachability for AdverseEvent.lot_id)."
    roles: [CustomerRep, QualityReleaseOfficer, RegulatoryAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: AdverseEvent[]
    side_effects: []

  # ---------------------------------------------------------------- Cycle ---
  - method: POST
    path: "/sterilization/cycles"
    description: "Schedule a cycle in a chamber against an approved recipe. Runs both temporal overlap rules."
    roles: [CycleOperator]
    code: 201
    input: [chamber_id, recipe_id, cycle_code, scheduled_start_at, scheduled_end_at, "raw_eto_charge_kg?"]
    output: Cycle
    side_effects: ["calculations.cycle_occupancy_window sets occupancy_end_at", "status PLANNED"]

  - method: GET
    path: "/sterilization/cycles/{id}"
    description: "Read one cycle including its density, dose and emission ledger fields."
    roles: [CycleOperator, DosimetryAnalyst, QualityReleaseOfficer, RegulatoryAdmin]
    code: 200
    input: []
    output: Cycle
    side_effects: []

  - method: GET
    path: "/sterilization/cycles"
    description: "List cycles filtered by chamber, recipe or status (reverse reachability for Cycle.chamber_id and Cycle.recipe_id)."
    roles: [CycleOperator, DosimetryAnalyst, QualityReleaseOfficer, RegulatoryAdmin]
    code: 200
    input: ["chamber_id?", "recipe_id?", "status?", "limit?", "offset?"]
    output: Cycle[]
    side_effects: []

  - method: POST
    path: "/sterilization/cycles/{id}/load-positions"
    description: "Place a lot into a load-map slot. Guarded by optimistic concurrency on the cycle; recomputes the aggregate load density."
    roles: [CycleOperator]
    code: 201
    input: [lot_id, position_index, zone, pallet_count, expected_cycle_version]
    output: LoadPosition
    side_effects:
      - "cycle.loaded_pallet_count += pallet_count and calculations.cycle_load_density recomputes cycle.load_density_g_per_cm3"
      - "lot.staged_pallet_count += pallet_count; lot.available_pallet_count refreshed; lot.status RECEIVED -> STAGED"
      - "cycle.status PLANNED -> LOADING, or READY -> LOADING when the load map is revised after sign-off"
      - "increments Cycle.version by 1 and stamps LoadPosition.cycle_version_after"

  - method: DELETE
    path: "/sterilization/cycles/{id}/load-positions/{position_id}"
    description: "Remove a slot from the load map. Compensating half of the pallet-conservation invariant."
    roles: [CycleOperator]
    code: 204
    input: []
    output: null
    side_effects:
      - "cycle.loaded_pallet_count -= position.pallet_count and cycle.load_density_g_per_cm3 recomputed"
      - "lot.staged_pallet_count -= position.pallet_count; lot.available_pallet_count refreshed; lot.status STAGED -> RECEIVED when no positions remain for that lot"
      - "cycle.status READY -> LOADING, or LOADING -> PLANNED when the last position is removed"
      - "increments Cycle.version by 1"

  - method: POST
    path: "/sterilization/cycles/{id}/ready"
    description: "Sign the load map off as ready. Accepted from PLANNED or LOADING, then runs the empty-map, indicator-placement and density-band checks in that order; a PLANNED cycle always fails the first of them."
    roles: [CycleOperator]
    code: 200
    input: []
    output: Cycle
    side_effects: ["cycle.status LOADING -> READY", "increments Cycle.version by 1"]

  - method: POST
    path: "/sterilization/cycles/{id}/start"
    description: "Start the cycle. Debits the emission permit through the tiered fee calculation and stamps the operator identity."
    roles: [CycleOperator]
    code: 200
    input: []
    output: Cycle
    side_effects:
      - "calculations.emission_fee_usd sets cycle.abated_eto_kg and cycle.emission_fee_usd and commits permit.consumed_kg_ytd and permit.total_emission_fee_usd"
      - "permit.status ACTIVE -> SUSPENDED when consumed_kg_ytd reaches annual_allowance_kg"
      - "cycle.operator_user_id stamped; every staged lot moves STAGED -> IN_PROCESS"
      - "cycle.status READY -> RUNNING"

  - method: POST
    path: "/sterilization/cycles/{id}/complete"
    description: "Complete the dwell. Moves lots to PROCESSED and opens the residual dimension for EtO loads."
    roles: [CycleOperator]
    code: 200
    input: []
    output: Cycle
    side_effects:
      - "every lot IN_PROCESS -> PROCESSED"
      - "for ETO chambers and products with requires_aeration, lot.residual_status NOT_APPLICABLE -> PENDING_AERATION"
      - "cycle.status RUNNING -> COMPLETED"

  - method: POST
    path: "/sterilization/cycles/{id}/abort"
    description: "Abort a cycle before or during the dwell. From RUNNING this credits the permit ledger back exactly, which is the compensating half of the abated-EtO-mass invariant."
    roles: [CycleOperator]
    code: 200
    input: [reason]
    output: Cycle
    side_effects:
      - "from RUNNING: permit.consumed_kg_ytd and permit.total_emission_fee_usd credited by exactly cycle.abated_eto_kg and cycle.emission_fee_usd, which are then zeroed; permit.status SUSPENDED -> ACTIVE when the credit brings consumption back below the allowance"
      - "every LoadPosition hard-deleted in created_at ASC order; loaded_pallet_count and load_density_g_per_cm3 reset; each lot's staged_pallet_count decremented and status returned to RECEIVED"
      - "cycle.status -> CANCELLED"

  - method: POST
    path: "/sterilization/cycles/{id}/dosimetry-close"
    description: "Close dosimetry review. Computes the variant-selected delivered dose, evaluates the conformance verdict and branches to DOSE_CONFORMING or DOSE_DEVIATION (the latter firing the depth-4 cascade)."
    roles: [DosimetryAnalyst]
    code: 200
    input: []
    output: Cycle
    side_effects:
      - "calculations.delivered_dose_kgy and calculations.dose_conformance_verdict run"
      - "cycle.dosimetry_closed_by_user_id stamped"
      - "CONFORMING branch: lots PROCESSED -> QUARANTINE with reason ROUTINE and calculations.lot_cumulative_dose applied"
      - "DEVIATION branch: CASCADE A hops 1-4"

  # --------------------------------------------------------- LoadPosition ---
  - method: GET
    path: "/sterilization/load-positions/{id}"
    description: "Read one load-map slot including its cycle_version_after OCC handle."
    roles: [CycleOperator, DosimetryAnalyst, QualityReleaseOfficer, RegulatoryAdmin]
    code: 200
    input: []
    output: LoadPosition
    side_effects: []

  - method: GET
    path: "/sterilization/load-positions"
    description: "List load-map slots filtered by cycle or lot (reverse reachability for LoadPosition.cycle_id and LoadPosition.lot_id)."
    roles: [CycleOperator, DosimetryAnalyst, QualityReleaseOfficer, RegulatoryAdmin]
    code: 200
    input: ["cycle_id?", "lot_id?", "limit?", "offset?"]
    output: LoadPosition[]
    side_effects: []

  - method: POST
    path: "/sterilization/load-positions/{id}/indicators"
    description: "Place a dosimeter or biological indicator in a load-map slot."
    roles: [CycleOperator]
    code: 201
    input: [indicator_type, placement_zone, serial_code, "spore_population?"]
    output: Indicator
    side_effects: ["reading_status UNREAD; bi_result PENDING for BIOLOGICAL indicators"]

  - method: GET
    path: "/sterilization/load-positions/{id}/indicators"
    description: "List the indicators placed in one slot (reverse reachability for Indicator.load_position_id)."
    roles: [CycleOperator, DosimetryAnalyst, QualityReleaseOfficer, RegulatoryAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Indicator[]
    side_effects: []

  # ------------------------------------------------------------ Indicator ---
  - method: POST
    path: "/sterilization/indicators/{id}/reading"
    description: "Record a dosimeter dose or a biological indicator incubation result. Exactly one of measured_dose_kgy (DOSIMETER indicators only, > 0) or bi_result (BIOLOGICAL indicators only, one of NEGATIVE or POSITIVE - never PENDING) must be supplied and it must match the indicator_type. The first reading on a COMPLETED cycle advances it to DOSIMETRY_REVIEW; a re-read on a DOSE_DEVIATION cycle reopens review."
    roles: [DosimetryAnalyst]
    code: 200
    input: ["measured_dose_kgy?", "bi_result?"]
    output: Indicator
    side_effects:
      - "reading_status -> READ; read_at and read_by_user_id stamped"
      - "cycle.status COMPLETED -> DOSIMETRY_REVIEW on the first reading"
      - "cycle.status DOSE_DEVIATION -> DOSIMETRY_REVIEW on a documented re-read, clearing deviation_code, delivered_dose_kgy and max_observed_dose_kgy"

  # ------------------------------------------------------- AerationRecord ---
  - method: POST
    path: "/sterilization/aeration-records/{id}/residual-test"
    description: "Record a residual EtO/ECH sample. Passing closes the record; failing extends the required hours under the EXTENDED_RETEST variant until the retest budget is exhausted."
    roles: [DosimetryAnalyst]
    code: 200
    input: [eto_residual_ppm, ech_residual_ppm]
    output: AerationRecord
    side_effects:
      - "last_eto_ppm and last_ech_ppm recorded"
      - "PASS: record -> PASSED and lot.residual_status -> RESIDUAL_PASS"
      - "FAIL within budget: retest_count += 1, last_failed_sample_at stamped, required_hours and target_end_at recomputed under EXTENDED_RETEST"
      - "FAIL beyond budget: record -> EXHAUSTED, lot.residual_status -> RESIDUAL_FAIL, lot.status QUARANTINE -> REJECTED with quarantine_reason RESIDUAL_FAIL, customer.open_lot_count -= 1"

  # --------------------------------------------------------- AdverseEvent ---
  - method: POST
    path: "/sterilization/adverse-events/{id}/disposition"
    description: "Disposition a reported adverse event. disposition is one of RESTERILIZE, SCRAP or DISMISS, and all three outcomes are terminal. RESTERILIZE fires the depth-3 cascade that recalls the lot and mints its successor."
    roles: [QualityReleaseOfficer]
    code: 200
    input: [disposition]
    output: AdverseEvent
    side_effects:
      - "RESTERILIZE: CASCADE B hops 1-3 - event -> RESTERILIZE_APPROVED, subject lot -> RECALLED, successor Lot minted with parent_lot_id and inherited cumulative_dose_kgy, qualifications re-evaluated against the product's cumulative ceiling"
      - "SCRAP: event -> SCRAP_APPROVED, lot -> SCRAPPED, schedulable = false"
      - "DISMISS: event -> DISMISSED, lot.quarantine_reason ADVERSE_EVENT -> ROUTINE"

  # -------------------------------------------------- test-driving surface ---
  - method: POST
    path: "/sterilization/_clock/set_current_utc"
    description: "Set the server's logical clock, which every timestamp field and every deadline rule reads. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time. No plausible business endpoint moves the clock, so this is declared under the /_ test-driving namespace."
    roles: [RegulatoryAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all subsequent clock_now reads return the supplied instant until it is set again"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role is not listed in the endpoint's roles."
  - id: ERR_VALIDATION
    http: 400
    condition: "Request body fails the input schema: missing required field, wrong type, unknown enum member, out-of-range number, samples_tested != 100, scheduled_end_at <= scheduled_start_at, or an indicator reading whose payload does not match the indicator_type."
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer_id in the path or body does not resolve."
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product_id in the path or body does not resolve."
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "emission permit id in the path or permit_id in the body does not resolve."
  - id: ERR_CHAMBER_NOT_FOUND
    http: 404
    condition: "chamber id in the path or chamber_id in the body does not resolve."
  - id: ERR_RECIPE_NOT_FOUND
    http: 404
    condition: "cycle recipe id in the path or recipe_id in the body does not resolve."
  - id: ERR_QUALIFICATION_NOT_FOUND
    http: 404
    condition: "qualification id in the path does not resolve."
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "lot id in the path or lot_id in the body does not resolve."
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "cycle id in the path does not resolve."
  - id: ERR_LOAD_POSITION_NOT_FOUND
    http: 404
    condition: "load position id in the path does not resolve, or the position exists but belongs to a different cycle than the one named in the path."
  - id: ERR_INDICATOR_NOT_FOUND
    http: 404
    condition: "indicator id in the path does not resolve."
  - id: ERR_AERATION_RECORD_NOT_FOUND
    http: 404
    condition: "aeration record id in the path does not resolve."
  - id: ERR_ADVERSE_EVENT_NOT_FOUND
    http: 404
    condition: "adverse event id in the path does not resolve."
  - id: ERR_CUSTOMER_SCOPE_VIOLATION
    http: 403
    condition: "A CustomerRep addresses a Customer, Product or Lot whose customer_id differs from the caller's X-User-ID."
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "A uniqueness constraint is violated: account_code, chamber_code, recipe_code, cycle_code or serial_code globally; product_code or lot_code within the same customer_id."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a state from which the requested transition is declared, and no more specific state error applies."
  - id: ERR_RECIPE_NOT_APPROVED
    http: 409
    condition: "A cycle is scheduled against a CycleRecipe whose status is still DRAFT."
  - id: ERR_LOT_NOT_SCHEDULABLE
    http: 409
    condition: "A load position is created for a Lot whose schedulable flag was cleared by a qualification or cumulative-dose cascade."
  - id: ERR_CYCLE_NOT_READY
    http: 409
    condition: "POST /cycles/{id}/start on a cycle whose status is not READY."
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "expected_cycle_version does not equal the Cycle's current version."
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_lot_version does not equal the Lot's current version."
  - id: ERR_BI_POSITIVE_BLOCKS_RELEASE
    http: 409
    condition: "Release attempted while some BIOLOGICAL Indicator on the governing cycle has bi_result POSITIVE."
  - id: ERR_CYCLE_DEVIATION_BLOCKS_RELEASE
    http: 409
    condition: "Release attempted while the governing cycle's status is not DOSE_CONFORMING."
  - id: ERR_QUALIFICATION_NOT_CURRENT
    http: 409
    condition: "No ProductQualification for the (product, recipe) pair has status QUALIFIED or CONDITIONAL - it is missing, PENDING, AUDIT_DUE, SUSPENDED or REVOKED."
  - id: ERR_CHAMBER_UNAVAILABLE
    http: 409
    condition: "The chamber is in MAINTENANCE at cycle start, or DECOMMISSIONED at cycle creation or start."
  - id: ERR_PERMIT_NOT_ACTIVE
    http: 409
    condition: "The emission permit backing the chamber is SUSPENDED or EXPIRED at cycle start."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The releasing QualityReleaseOfficer's X-User-ID equals the governing cycle's operator_user_id or its dosimetry_closed_by_user_id."
  - id: ERR_MODALITY_MISMATCH
    http: 422
    condition: "Recipe modality differs from chamber modality at cycle creation, or the chamber's modality is absent from the lot's Customer.contracted_modalities at load-position creation."
  - id: ERR_CHAMBER_WINDOW_CONFLICT
    http: 409
    condition: "The new cycle's half-open buffer-extended occupancy interval intersects that of a non-terminal cycle in the same chamber."
  - id: ERR_PERMIT_CONCURRENCY_EXCEEDED
    http: 409
    condition: "The count of non-terminal ETO cycles under the same permit whose closed dwell interval intersects the new cycle's closed dwell interval already equals max_concurrent_eto_cycles."
  - id: ERR_AERATION_INCOMPLETE
    http: 409
    condition: "A residual test is recorded before clock_now reaches target_end_at, or a release is attempted while the lot's residual_status is PENDING_AERATION or AERATING."
  - id: ERR_AERATION_NOT_APPLICABLE
    http: 422
    condition: "An aeration record is opened for a lot whose residual_status is NOT_APPLICABLE."
  - id: ERR_RETEST_LIMIT_EXHAUSTED
    http: 409
    condition: "A residual test is recorded against an AerationRecord already in PASSED or EXHAUSTED."
  - id: ERR_LOAD_MAP_EMPTY
    http: 422
    condition: "POST /cycles/{id}/ready on a cycle with no LoadPosition rows."
  - id: ERR_INDICATOR_PLACEMENT_INCOMPLETE
    http: 422
    condition: "The cycle's dosimeter or biological indicator counts fall short of the recipe's required_min_zone_dosimeters, required_routine_dosimeters or required_biological_indicators."
  - id: ERR_LOAD_DENSITY_OUT_OF_BAND
    http: 422
    condition: "cycle.load_density_g_per_cm3 is below recipe.density_min_g_per_cm3 or at/above recipe.density_max_g_per_cm3."
  - id: ERR_CHAMBER_CAPACITY_EXCEEDED
    http: 422
    condition: "Adding the position would push cycle.loaded_pallet_count past chamber.pallet_capacity, or the requested pallet_count exceeds the lot's available_pallet_count."
  - id: ERR_DUPLICATE_POSITION_INDEX
    http: 409
    condition: "Another LoadPosition on the same cycle already uses the requested position_index."
  - id: ERR_PARAMETRIC_NOT_PERMITTED
    http: 422
    condition: "A PARAMETRIC release is requested for a lot whose governing recipe requires one or more biological indicators."
  - id: ERR_BI_INCUBATION_PENDING
    http: 409
    condition: "A DOSIMETRIC release is requested while some BIOLOGICAL Indicator on the governing cycle is still UNREAD."
  - id: ERR_CUMULATIVE_DOSE_EXCEEDED
    http: 422
    condition: "The lot's cumulative_dose_kgy plus the recipe's target_dose_kgy would exceed the product's max_cumulative_dose_kgy."
  - id: ERR_DOSIMETRY_INCOMPLETE
    http: 422
    condition: "Dosimetry close attempted while some Indicator on the cycle is UNREAD, or while the variant-selected dosimeter subset is empty."
  - id: ERR_INDICATOR_ALREADY_READ
    http: 409
    condition: "A reading is recorded against an already-READ indicator whose cycle is not in DOSE_DEVIATION."
  - id: ERR_LOT_NOT_RELEASABLE
    http: 409
    condition: "Release attempted on a lot that is not in QUARANTINE, has residual_status RESIDUAL_FAIL, or has no governing cycle."
  - id: ERR_PERMIT_ALLOWANCE_EXCEEDED
    http: 402
    condition: "Starting the ETO cycle would push the permit's consumed_kg_ytd strictly past annual_allowance_kg."
  - id: ERR_CUSTOMER_SUSPENDED
    http: 402
    condition: "The lot's Customer has status SUSPENDED at lot creation or at release."

