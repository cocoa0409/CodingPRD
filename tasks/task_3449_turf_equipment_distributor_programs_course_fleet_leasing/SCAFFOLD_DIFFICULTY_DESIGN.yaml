            - "round2_valued == 3571429 after switching back to BOOK"
            - "TradeInAppraisal.${ap1}.status == VALUED after two full dispute rounds"
            - "book_value_cents and market_value_cents both recomputed on each round (3571429 / 2773125)"

  - rule_id: transitive_cascade
    instances:
      - name: unit_return_closes_lease_and_renews_course
        grounds:
          - state_machines.LeaseUnit.RETURN_REQUESTED_to_RETURNED
          - state_machines.FleetLease.TURNOVER_IN_PROGRESS_to_CLOSED
          - state_machines.GolfCourse.ACTIVE_LEASE_to_IN_RENEWAL
        distinguishing_aspect: |
          Cascade C1, depth 3, triggered by record-return: the unit mutation
          (RETURNED) itself causes the lease mutation (TURNOVER_IN_PROGRESS ->
          CLOSED when the last unit leaves the active set), and the lease mutation
          itself causes the course mutation (ACTIVE_LEASE -> IN_RENEWAL) — each
          link is caused by the previous link, not by the original API call.
        test_recipe:
          setup:
            - "D1 ACTIVE; C1 CLUB; M1; lease L1 cycle 1 month starting 2026-09-01, APPROVED then ACTIVE; single unit IN_SERVICE"
            - "Clock advanced to 2026-10-02 and rollover run: lease in TURNOVER_IN_PROGRESS, unit auto-moved to RETURN_REQUESTED"
          setup_api_calls:
            - call: "POST /turf/distributors"
              payload: { name: "GreenFair Distribution", territory_codes: ["CA", "NV"], channel: "EQUIPMENT", min_parts_stock_value_cents: 0, labor_rate_cents: 14000, annual_claim_cap_cents: 50000000 }
              as: CorporateAdmin
              captures: { d1: $.data.id }
            - call: "POST /turf/technicians"
              payload: { full_name: "Tess Torque" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { t1: $.data.id }
            - call: "POST /turf/technicians/${t1}/certify"
              payload: { level: "MASTER", expires_at: "2028-06-01T00:00:00Z" }
              as: CorporateAdmin
            - call: "POST /turf/distributors/${d1}/compliance_review"
              as: CorporateAdmin
            - call: "POST /turf/courses"
              payload: { name: "Bent Pine CC", turf_profile: "BENTGRASS", cut_quality_standard: "CLUB", credit_limit_cents: 50000000, assigned_distributor_id: "${d1}" }
              as: CorporateAdmin
              captures: { c1: $.data.id }
            - call: "POST /turf/models"
              payload: { model_code: "RM-5010H", category: "MOWER", tier: "TOURNAMENT", list_price_cents: 7500000, eligible_turf_types: ["BENTGRASS", "POA_ANNUA", "MIXED"], factory_warranty_months: 24, warranty_labor_hourly_cap_cents: 9500, parts_support_years: 10 }
              as: CorporateAdmin
              captures: { m1: $.data.id }
            - call: "POST /turf/leases"
              payload: { course_id: "${c1}", cycle_months: 1, start_date: "2026-09-01", lines: [{ model_id: "${m1}", qty: 1 }] }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { l1: $.data.id, l_v: $.data.version }
            - call: "POST /turf/leases/${l1}/transition"
              payload: { to: "SPEC_REVIEW", expected_lease_version: "${l_v}" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { l_v2: $.data.version }
            - call: "POST /turf/leases/${l1}/transition"
              payload: { to: "APPROVED", expected_lease_version: "${l_v2}" }
              as: CorporateAdmin
              captures: { l_v3: $.data.version }
            - call: "POST /turf/leases/${l1}/transition"
              payload: { to: "ACTIVE", expected_lease_version: "${l_v3}" }
              as: DistributorManager
              as_user_id: "${d1}"
            - call: "GET /turf/units"
              payload: { lease_id: "${l1}" }
              as: CorporateAdmin
              captures: { u1: "$.data[0].id" }
            - call: "POST /turf/units/${u1}/transition"
              payload: { to: "DELIVERED", serial_number: "SN-A1" }
              as: DistributorManager
              as_user_id: "${d1}"
            - call: "POST /turf/units/${u1}/transition"
              payload: { to: "IN_SERVICE" }
              as: CourseManager
              as_user_id: "${c1}"
            - call: "POST /turf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: CorporateAdmin
            - call: "POST /turf/admin/run_season_rollover"
              as: CorporateAdmin
          trigger:
            - call: "POST /turf/units/${u1}/transition"
              payload: { to: "RETURNED", hours_used: 300, condition_grade: "B" }
              as: DistributorManager
              as_user_id: "${d1}"
          assert:
            - "LeaseUnit.${u1}.status == RETURNED with hours_used == 300 and condition_grade == B"
            - "FleetLease.${l1}.status == CLOSED (bubble-up from the unit mutation)"
            - "GolfCourse.${c1}.status == IN_RENEWAL (third link, caused by the lease closure)"
      - name: compliance_probation_reverts_lease_and_voids_appraisals
        grounds:
          - state_machines.Distributor.ACTIVE_to_PROBATION
          - state_machines.FleetLease.SPEC_REVIEW_to_DRAFT
          - state_machines.TradeInAppraisal.VALUED_to_VOIDED
          - calculations.parts_stocking_compliance
