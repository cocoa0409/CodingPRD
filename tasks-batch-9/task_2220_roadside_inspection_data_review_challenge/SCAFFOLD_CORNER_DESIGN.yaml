              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
            - call: "POST /inspection-reports"
              payload: { report_number: "OH2026070303", inspection_state: "OH", inspection_level: 2, inspection_start: "2026-07-01T14:00:00Z", inspection_end: "2026-07-01T15:00:00Z", vehicle_vin: "1FUJA6CK21LK00303", attributed_carrier_id: "${c1_id}", selection_source: "RANDOM" }
