          - state_machines.CapacityResource.REGISTERED_to_ACCREDITED
          - calculations.accreditation_ucap
        distinguishing_aspect: |
          Depth-2 chain from a different trigger than the assessment cascade:
          accreditation approve (A) runs accreditation_ucap and flips the
          Accreditation to EFFECTIVE, which itself promotes the CapacityResource
          REGISTERED->ACCREDITED and writes accredited_ucap_mw (B) — the
          resource mutation is caused by the accreditation transition, not by
          the original approve call directly touching the resource.
