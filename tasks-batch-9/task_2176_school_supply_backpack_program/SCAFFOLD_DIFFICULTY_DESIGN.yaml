      - name: purchase_admin_fee_rounded_per_pack_then_summed_mode_b
        grounds:
          - calculations.purchase_order_costing
          - entities.PurchaseOrder.fields.admin_fee_cents
          - entities.PurchaseOrder.fields.total_cost_cents
          - entities.SupplyItem.fields.bulk_pack_size
        distinguishing_aspect: |
          MODE (b): nested rounding whose order changes the cents — 7 packs of 3 glue
          sticks at 175 cents give a per-pack fee of round_half_up(525*0.09) = 47, so
          admin_fee_cents is 7*47 = 329 and total_cost_cents is 4004; rounding the
          whole line once would give 331 and 4006.
        test_recipe:
          setup:
            - "Cycle 'Back-to-School 2026' is COLLECTING."
            - "Catalog item GLU-03 costs 175 cents per unit and ships in packs of 3."
          setup_api_calls:
            - call: "POST /drive-cycles"
