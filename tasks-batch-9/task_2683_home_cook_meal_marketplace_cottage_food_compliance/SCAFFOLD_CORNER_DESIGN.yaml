            - "${ps_status_1} == DRAFT, gross_sales_cents == 800, commission_cents == 180, ${ps_chargeback} == 100 (ACCRUAL_WINDOW charges back PENDING refunds too), safety_hold_cents == 0, ${ps_net} == 520"
            - "${ps_status_2} == FINALIZED and ${ps_finalized_at} == 2026-08-08T18:00:00Z"
            - "${r_status_2} == SETTLED and ${r_settled_at} == 2026-08-08T18:00:00Z"
            - "${pending_2} == 0: the order is now covered by a FINALIZED statement, while ${lifetime_2} == 0 because nothing has been PAID"

      - name: cook_row_moves_its_two_dimensions_independently
        claim_type: parallel_shape
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Cook.onboarding_status
          - state_machines.Cook.compliance_standing
        excluded_because:
          difficulty_instance: "non_linear_state_machine / cook_onboarding_and_standing_dimensions_move_independently"
          rationale: >
            That instance already walks the full 4x4 grid of the two Cook dimensions, proving an
            ACTIVE + SUSPENDED combination and a REJECTED + WARNED combination, which is exactly what
            the parallel-shape row asks for.

      - name: menu_item_revision_loop_is_bounded
        claim_type: cyclic_shape
        grounds:
          - state_machines.MenuItem.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.MenuItem.REVISION_REQUESTED_to_UNDER_REVIEW
          - calculations_note.MAX_REVISION_ROUNDS
        excluded_because:
          difficulty_instance: "non_linear_state_machine / menu_item_revision_cycle_terminates_at_max_rounds"
          rationale: >
            The loop-count termination condition (revision_round reaching MAX_REVISION_ROUNDS forces
            REJECTED instead of a third REVISION_REQUESTED) is walked round by round there.

      - name: suspension_cascades_down_to_items_windows_and_orders
        claim_type: cascade_down_side_effect
        grounds:
          - state_machines.Cook.compliance_standing.CLEAR_to_SUSPENDED
          - state_machines.MenuItem.APPROVED_to_DELISTED
          - state_machines.ProductionWindow.OPEN_to_CANCELLED
          - state_machines.Order.PLACED_to_CANCELLED
        excluded_because:
          difficulty_instance: "transitive_cascade / cascade_a_substantiated_incident_to_payout_zeroing_depth_six"
          rationale: >
            All six links of the suspension cascade, including the "only non-terminal children are
            touched" clause and the depth-6 payout consequence, are asserted link by link there.

      - name: window_close_syncs_the_cook_ledger_fields
        claim_type: ledger_sync_side_effect
        grounds:
          - state_machines.ProductionWindow.IN_PRODUCTION_to_CLOSED
          - state_machines.Order.payment_status.AUTHORIZED_to_CAPTURED
          - calculations.cottage_revenue_recognition
        excluded_because:
          difficulty_instance: "transitive_cascade / cascade_b_window_close_to_cap_reached_menu_bounce_depth_four"
          rationale: >
            The before/after reconciliation of ytd_gross_sales_cents, ytd_cottage_revenue_cents,
            pending_payout_cents and cap_status on window close is the whole subject of that
            instance, including the CAP_REACHED bounce back onto the menu items.

  - section: calculations
    instances:
      - name: order_charge_breakdown_correct_result_and_rounding_direction
        claim_type: correct_result
        grounds:
          - calculations.order_charge_breakdown
          - calculations.order_charge_breakdown.precision
          - entities.Order.diner_service_fee_cents
          - entities.Order.platform_commission_cents
        distinguishing_aspect: >
          A price whose two percentage products both land on fractions that expose the rounding rule:
          1830 * 0.09 = 164.70 must round UP to 165 (truncation would give 164) and
          1830 * 0.225 = 411.75 must round UP to 412 (truncation would give 411). The cook's earnings
          are the exact complement of the rounded commission, never a separately rounded 77.5%.
        test_recipe:
          setup:
            - "Identical to the setup_api_calls of window_and_order_advance_walk_the_happy_path_with_clock_gated_rejections through POST /delivery-zones, with one substitution: the MenuItem unit_price_cents is 610 instead of 400."
            - "Captured ids from that chain: ${cook_id}, ${mi_id}, ${w_id}, ${dz_id} (DOOR_DELIVERY, max_cold_chain_minutes 240). Clock 2026-08-01T00:00:00Z; Cook.ytd_gross_sales_cents == 0."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
