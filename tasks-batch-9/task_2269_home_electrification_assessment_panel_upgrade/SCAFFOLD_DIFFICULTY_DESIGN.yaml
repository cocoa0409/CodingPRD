          assert:
            - "After trigger call 1: Contractor.${ctr_a}.status == SUSPENDED with suspension_reason == ADMIN_ACTION"
            - "After trigger call 2: Contractor.${ctr_a}.status == ENROLLED_ACTIVE again — the cycle closed and quality_score_rolling is still 100"
            - "After trigger call 3: Contractor.${ctr_a}.status == SUSPENDED again, this time with suspension_reason == QUALITY_SCORE, because the rolling score fell to 0 (< 70) on a single FAILED inspection"
            - "Contractor.${ctr_a}.quality_score_rolling == 0 and completed_inspection_count == 1 after trigger call 3"
            - "Contractor.${ctr_a}.version incremented on every one of the three accepted transitions (three distinct writes to the same aggregate)"
            - "Trigger call 4 returns 409 ERR_INVALID_STATE_TRANSITION: ENROLLMENT_REJECTED is terminal, so the identical REINSTATE payload that worked on contractor A is refused on contractor B"
            - "Contractor.${ctr_b}.status is still ENROLLMENT_REJECTED and its version did not change"
            - "Inspection.${sp_id}.status == FAILED and RebateProject.${proj_id}.status is still DRAFT (a SPOT result on a non-PAID project moves no money)"

