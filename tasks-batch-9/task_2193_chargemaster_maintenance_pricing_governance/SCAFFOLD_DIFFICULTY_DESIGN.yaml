- rule_id: cross_entity_state_dependency
  instances:
  - name: cross_entity_state_dependency__item_activate_and_reactivate_gated_by_revenue_code_status
    grounds:
    - state_machines.ChargeItem.APPROVED_to_ACTIVE
    - state_machines.ChargeItem.INACTIVE_to_ACTIVE
    - state_machines.ChargeItem.ACTIVE_to_INACTIVE
    - entities.RevenueCode.fields.status
    - entities.ChargeItem.fields.revenue_code_id
    - validations[priority=25]
    - errors.ERR_REVENUE_CODE_RETIRED
    - calculations.markup_compliance_ratio
    distinguishing_aspect: 'The dependency crosses the ChargeItem -> RevenueCode pair: two distinct ChargeItem

      transitions (APPROVED -> ACTIVE on one item and INACTIVE -> ACTIVE on another) both become

      inadmissible purely because the referenced RevenueCode moved ACTIVE -> RETIRED, while

      nothing about either ChargeItem''s own two status dimensions changed.

      '
    test_recipe:
      setup:
      - Logical clock pinned to 2026-09-01T00:00:00Z.
      - Facility with rounding_mode NEAREST_CENT and aggregate_markup_limit_bp 40000; no TransparencyFile and no CodeUpdateCycle, so posture stays OPEN throughout.
      - RevenueCode 0300 created ACTIVE; unrestricted Clinical Lab department; one ACTIVE COST_PLUS_MARKUP PriceRule with the default three tiers.
      - ChargeItem CDM-40001 driven to ACTIVE (gross 144000, version 5) and then DEACTIVATEd to INACTIVE (version 6, price_status still PRICED_CURRENT, duplicate_of_item_id null).
      - ChargeItem CDM-40002 driven only as far as lifecycle APPROVED (version 4, price_status PRICED_CURRENT).
      - RevenueCode 0300 then retired, so RevenueCode.status == RETIRED while both items still point at it.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemAdmin
      - call: POST /chargemaster/facilities
        payload:
          name: Northgate General
          cms_certification_number: CCN-2193-E
          rounding_mode: NEAREST_CENT
          aggregate_markup_limit_bp: 40000
        as: SystemAdmin
        captures:
          fac_id: $.data.id
      - call: POST /chargemaster/revenue-codes
        payload:
          code: '0300'
          description: Laboratory - general
          requires_hcpcs: false
          allowed_code_types:
          - CPT
          - HCPCS
          - REV_ONLY
          - CDM_INTERNAL
          pricing_class: PROCEDURE
          status: ACTIVE
        as: SystemAdmin
        captures:
          rc_lab_id: $.data.id
      - call: POST /chargemaster/departments
        payload:
          facility_id: ${fac_id}
          name: Clinical Lab
          cost_center_code: CC-7100
          manager_user_id: mgr_lab_01
          allowed_revenue_code_values: []
        as: SystemAdmin
        captures:
          dept_lab_id: $.data.id
      - call: POST /chargemaster/price-rules
        payload:
          facility_id: ${fac_id}
          revenue_code_id: ${rc_lab_id}
          pricing_method: COST_PLUS_MARKUP
          markup_tiers:
          - min_cost_basis_cents: 0
            markup_bp: 32000
          - min_cost_basis_cents: 50000
            markup_bp: 24000
          - min_cost_basis_cents: 250000
            markup_bp: 18000
          min_medicare_multiple_bp: 12000
          market_cap_multiple_bp: 11000
          effective_from: '2026-01-01T00:00:00Z'
        as: RevenueIntegrityAnalyst
        captures:
          pr_lab_id: $.data.id
      - call: POST /chargemaster/charge-items
        payload:
          facility_id: ${fac_id}
          department_id: ${dept_lab_id}
          revenue_code_id: ${rc_lab_id}
          cdm_number: CDM-40001
          description: Comprehensive metabolic panel
          code_type: CDM_INTERNAL
          cost_basis_cents: 60000
          medicare_rate_cents: 18000
          market_p75_cents: 200000
          effective_from: '2026-09-01T00:00:00Z'
        as: RevenueIntegrityAnalyst
        captures:
          item1_id: $.data.id
      - call: POST /chargemaster/charge-items/${item1_id}/reprice
        payload: {}
        as: RevenueIntegrityAnalyst
        as_user_id: ria_01
      - call: POST /chargemaster/charge-items/${item1_id}/lifecycle
        payload:
          action: SUBMIT_FOR_REVIEW
        as: RevenueIntegrityAnalyst
        as_user_id: ria_01
      - call: POST /chargemaster/charge-items/${item1_id}/lifecycle
        payload:
          action: APPROVE
        as: PricingCommitteeApprover
        as_user_id: pca_01
      - call: POST /chargemaster/charge-items/${item1_id}/lifecycle
        payload:
          action: ACTIVATE
        as: PricingCommitteeApprover
        as_user_id: pca_01
      - call: POST /chargemaster/charge-items
        payload:
          facility_id: ${fac_id}
          department_id: ${dept_lab_id}
          revenue_code_id: ${rc_lab_id}
          cdm_number: CDM-40002
          description: Basic metabolic panel
          code_type: CDM_INTERNAL
          cost_basis_cents: 60000
          medicare_rate_cents: 18000
          market_p75_cents: 200000
          effective_from: '2026-09-01T00:00:00Z'
        as: RevenueIntegrityAnalyst
        captures:
          item2_id: $.data.id
      - call: POST /chargemaster/charge-items/${item2_id}/reprice
        payload: {}
        as: RevenueIntegrityAnalyst
        as_user_id: ria_01
      - call: POST /chargemaster/charge-items/${item2_id}/lifecycle
        payload:
          action: SUBMIT_FOR_REVIEW
        as: RevenueIntegrityAnalyst
        as_user_id: ria_01
      - call: POST /chargemaster/charge-items/${item2_id}/lifecycle
        payload:
          action: APPROVE
        as: PricingCommitteeApprover
        as_user_id: pca_01
        captures:
          item2_ratio_ok_version: $.data.version
      - call: POST /chargemaster/charge-items/${item1_id}/lifecycle
        payload:
          action: DEACTIVATE
          note: temporarily withdrawn pending code retirement
        as: RevenueIntegrityAnalyst
        as_user_id: ria_01
        captures:
          item1_inactive_version: $.data.version
          item1_price_after_deactivate: $.data.price_status
      - call: POST /chargemaster/revenue-codes/${rc_lab_id}/retire
        payload: {}
        as: SystemAdmin
        captures:
          rc_status_after_retire: $.data.status
      trigger:
      - call: POST /chargemaster/charge-items/${item2_id}/lifecycle
        payload:
          action: ACTIVATE
        as: PricingCommitteeApprover
        as_user_id: pca_01
      - call: POST /chargemaster/charge-items/${item1_id}/lifecycle
        payload:
          action: REACTIVATE
        as: PricingCommitteeApprover
        as_user_id: pca_01
      assert:
      - ${item2_ratio_ok_version} == 4
      - ${item1_inactive_version} == 6
      - ${item1_price_after_deactivate} == PRICED_CURRENT
      - ${rc_status_after_retire} == RETIRED
      - The first trigger call returns HTTP 409 with data.error_id == ERR_REVENUE_CODE_RETIRED
      - The second trigger call returns HTTP 409 with data.error_id == ERR_REVENUE_CODE_RETIRED
      - ChargeItem.${item2_id}.lifecycle_status == APPROVED
      - ChargeItem.${item2_id}.price_status == PRICED_CURRENT
      - ChargeItem.${item2_id}.version == 4
      - ChargeItem.${item1_id}.lifecycle_status == INACTIVE
      - ChargeItem.${item1_id}.price_status == PRICED_CURRENT
      - ChargeItem.${item1_id}.duplicate_of_item_id == null
      - ChargeItem.${item1_id}.version == 6
      - Facility.${fac_id}.active_item_count == 0
      - Facility.${fac_id}.aggregate_gross_charge_cents == 0
      - Facility.${fac_id}.aggregate_cost_basis_cents == 0
      - Facility.${fac_id}.aggregate_markup_ratio_bp == 0
      - Facility.${fac_id}.chargemaster_posture == OPEN
  - name: cross_entity_state_dependency__transparency_publish_gated_by_mapping_code_update_cycle
    grounds:
    - state_machines.TransparencyFile.VALIDATED_to_PUBLISHED
    - state_machines.CodeUpdateCycle.LOADED_to_MAPPING
