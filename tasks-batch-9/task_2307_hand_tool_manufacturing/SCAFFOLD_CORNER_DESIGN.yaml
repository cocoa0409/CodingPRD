  - section: rbac
    instances:

      - name: authentication_and_role_gates_precede_every_business_rule
        claim_type: exclusive_operation_denied
        grounds:
          - validations[priority=100]
          - validations[priority=110]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "The header gates sit above everything: a request with no X-User-Role is 401 even when its body is malformed and its path id does not exist, and a request from a real but unlisted role is 403 rather than the 400 its malformed body would otherwise earn — so neither can be confused with a validation or a 404."
        test_recipe:
          setup:
            - "Empty database. Only header manipulation and role substitution vary between the calls."
          setup_api_calls:
            - call: "POST /toolworks/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: "<none: X-User-Role header omitted>"
              captures: { e_unauth: $.data.error_id }
            - call: "GET /toolworks/production-lots/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: "<none: X-User-Role header omitted>"
              captures: { e_unauth_404: $.data.error_id }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: "<unknown: X-User-Role: Auditor>"
              captures: { e_unknown_role: $.data.error_id }
            - call: "POST /toolworks/tool-skus"
              payload: { tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ProductionPlanner
              captures: { e_role_over_shape: $.data.error_id }
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
          assert:
            - "The header-less create returns HTTP 401 with error_id == 'ERR_UNAUTHENTICATED'"
            - "The header-less GET on a non-existent lot also returns HTTP 401 — 100 outranks the NOT_FOUND family at 200"
            - "An X-User-Role naming a role that does not exist in the role catalogue returns HTTP 401 with error_id == 'ERR_UNAUTHENTICATED' (the header does not name a declared role)"
            - "ProductionPlanner posting a SKU with sku_code missing returns HTTP 403 with error_id == 'ERR_ROLE_NOT_PERMITTED' — 110 outranks 300"
            - "The same body from ChannelManager returns HTTP 201, so the rejections were attributable to identity alone"
            - "GET /toolworks/tool-skus as PlatformAdmin returns total_count 1"

      - name: exclusive_duties_are_role_bound_while_shared_duties_are_not
        claim_type: peer_roles
        grounds:
          - roles.ProductionPlanner.exclusive_operations
          - roles.QualityEngineer.exclusive_operations
          - roles.WarrantyAdministrator.exclusive_operations
          - roles.BrandProtectionAnalyst.shared_operations
        distinguishing_aspect: "The two shop-floor roles are peers, not a hierarchy: ProductionPlanner cannot certify and QualityEngineer cannot advance, each earning ERR_ROLE_NOT_PERMITTED on the other's verb. On the warranty side BrandProtectionAnalyst may place a fraud hold (shared) but may not clear one (exclusive), and PlatformAdmin can do all four."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU on CR_MO, one CR_MO furnace, one lot with a COMPLETED campaign so an advance is otherwise legal."
            - "One programme, one claimant and one SUBMITTED claim so a hold is otherwise legal."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/heat-treat-furnaces"
              payload: { furnace_code: "FCE-1", max_charge_kg: 900, alloy_grades_supported: ["CR_MO"] }
              as: ProductionPlanner
              captures: { furnace_id: $.data.id }
            - call: "POST /toolworks/production-lots"
              payload: { sku_id: "${sku_id}", lot_code: "LOT-A", unit_count: 500, specimen_pool_total: 20 }
              as: ProductionPlanner
              captures: { lot_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns"
              payload: { lot_id: "${lot_id}", furnace_id: "${furnace_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T10:00:00Z", charge_kg: 800 }
              as: ProductionPlanner
              captures: { camp_id: $.data.id }
            - call: "POST /toolworks/furnace-campaigns/${camp_id}/complete"
              payload: { soak_minutes: 120 }
              as: ProductionPlanner
            - call: "POST /toolworks/warranty-programs"
              payload: { program_code: "LIFETIME-1", reserve_funded_cents: 5000000, fraud_score_threshold: 60 }
              as: WarrantyAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /toolworks/claimants"
              payload: { email: "c1@example.com", claimant_type: "CONSUMER" }
              as: WarrantyAdministrator
              captures: { claimant_id: $.data.id }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${claimant_id}", sku_id: "${sku_id}", program_id: "${prog_id}", serial_code: "SN-1", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "HEAT_TREATED" }
              as: QualityEngineer
              captures: { e_advance: $.data.error_id }
            - call: "POST /toolworks/production-lots/${lot_id}/advance"
              payload: { target_process_status: "HEAT_TREATED" }
              as: ProductionPlanner
              captures: { proc: $.data.process_status }
            - call: "POST /toolworks/production-lots/${lot_id}/certify"
              payload: {}
              as: ProductionPlanner
              captures: { e_certify: $.data.error_id }
            - call: "POST /toolworks/warranty-claims/${claim_id}/hold"
              payload: { hold_reason: "SECONDARY_CHANNEL_MATCH" }
              as: BrandProtectionAnalyst
              as_user_id: "bp-1"
              captures: { hold_status: $.data.status, holder: $.data.held_by_user_id }
            - call: "POST /toolworks/warranty-claims/${claim_id}/clear-hold"
              payload: { clearance_note: "Analyst attempting to clear their own hold" }
              as: BrandProtectionAnalyst
              as_user_id: "bp-1"
              captures: { e_clear: $.data.error_id }
            - call: "POST /toolworks/warranty-claims/${claim_id}/clear-hold"
              payload: { clearance_note: "Reviewed by warranty administration" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { cleared_status: $.data.status }
          assert:
            - "QualityEngineer advancing the lot returns HTTP 403 with error_id == 'ERR_ROLE_NOT_PERMITTED'; the identical call from ProductionPlanner returns HTTP 200 with process_status 'HEAT_TREATED'"
            - "ProductionPlanner certifying returns HTTP 403 with error_id == 'ERR_ROLE_NOT_PERMITTED' — not ERR_LOT_CERT_STATE_INVALID, even though the lot is also in the wrong state"
            - "BrandProtectionAnalyst placing the hold returns HTTP 200 with status 'FRAUD_HOLD' and held_by_user_id == 'bp-1' (a shared operation)"
            - "BrandProtectionAnalyst clearing it returns HTTP 403 with error_id == 'ERR_ROLE_NOT_PERMITTED' (110 fires on the role before the segregation rule at 902 is ever consulted)"
            - "PlatformAdmin (a different X-User-ID) clears it successfully: status 'SUBMITTED', fraud_cleared == true"

      - name: claimant_role_is_scoped_to_its_own_entity_row
        claim_type: entity_backed_role_scoping
        grounds:
          - validations[priority=120]
          - roles.Claimant.identity
          - errors[ERR_CLAIMANT_MISMATCH]
        distinguishing_aspect: "The Claimant role is bound to a row, not to a permission set: the same GET succeeds for the owning claimant and is ERR_CLAIMANT_MISMATCH for the other one, filing on someone else's claimant_id is refused, and a Claimant hitting the unscoped collection endpoint gets ERR_ROLE_NOT_PERMITTED because that path lists no Claimant role at all."
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU with warranty_tier LIFETIME, one programme, two claimants A and B, and one SUBMITTED claim owned by A."
          setup_api_calls:
            - call: "POST /toolworks/tool-skus"
              payload: { sku_code: "WR-17-BR", tool_family: "WRENCH", channel: "BRANDED", nominal_size_mm: 17, alloy_grade: "CR_MO", list_price_cents: 3300, warranty_tier: "LIFETIME" }
              as: ChannelManager
              captures: { sku_id: $.data.id }
            - call: "POST /toolworks/warranty-programs"
              payload: { program_code: "LIFETIME-1", reserve_funded_cents: 5000000, fraud_score_threshold: 60 }
              as: WarrantyAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /toolworks/claimants"
              payload: { email: "a@example.com", claimant_type: "CONSUMER" }
              as: WarrantyAdministrator
              captures: { c_a: $.data.id }
            - call: "POST /toolworks/claimants"
              payload: { email: "b@example.com", claimant_type: "PRO_ACCOUNT" }
              as: WarrantyAdministrator
              captures: { c_b: $.data.id }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${c_a}", sku_id: "${sku_id}", program_id: "${prog_id}", serial_code: "SN-1", claim_reason: "BREAKAGE" }
              as: WarrantyAdministrator
              captures: { claim_a: $.data.id }
          trigger:
            - call: "GET /toolworks/warranty-claims/${claim_a}"
              payload: {}
              as: Claimant
              as_user_id: "${c_a}"
              captures: { own_status: $.data.status }
            - call: "GET /toolworks/warranty-claims/${claim_a}"
              payload: {}
              as: Claimant
              as_user_id: "${c_b}"
              captures: { e_other_claim: $.data.error_id }
            - call: "GET /toolworks/claimants/${c_a}"
              payload: {}
              as: Claimant
              as_user_id: "${c_b}"
              captures: { e_other_profile: $.data.error_id }
            - call: "POST /toolworks/warranty-claims"
              payload: { claimant_id: "${c_a}", sku_id: "${sku_id}", program_id: "${prog_id}", serial_code: "SN-2", claim_reason: "BREAKAGE" }
              as: Claimant
              as_user_id: "${c_b}"
              captures: { e_file_for_other: $.data.error_id }
            - call: "GET /toolworks/warranty-claims"
              payload: { limit: 50, offset: 0 }
              as: Claimant
              as_user_id: "${c_a}"
              captures: { e_list: $.data.error_id }
            - call: "POST /toolworks/warranty-claims/${claim_a}/lines"
              payload: { component_code: "HANDLE", component_list_price_cents: 1099, quantity: 1 }
              as: Claimant
              as_user_id: "${c_b}"
              captures: { e_line: $.data.error_id }
          assert:
            - "Claimant A reading their own claim returns HTTP 200 with status 'SUBMITTED'"
            - "Claimant B reading A's claim returns HTTP 403 with error_id == 'ERR_CLAIMANT_MISMATCH', not 404 — the row exists, the caller is simply not its owner"
            - "Claimant B reading A's claimant profile returns HTTP 403 with error_id == 'ERR_CLAIMANT_MISMATCH'"
            - "Claimant B filing a claim under claimant_id == c_a returns HTTP 403 with error_id == 'ERR_CLAIMANT_MISMATCH' and creates no row"
            - "Any Claimant calling the unscoped list endpoint returns HTTP 403 with error_id == 'ERR_ROLE_NOT_PERMITTED' (Claimant is not among that endpoint's roles)"
            - "Claimant B adding a line to A's claim returns HTTP 403 with error_id == 'ERR_CLAIMANT_MISMATCH' and WarrantyClaim.${claim_a}.line_count stays 0"
            - "GET /toolworks/warranty-claims as WarrantyAdministrator returns total_count 1"

      - name: segregation_of_duties_binds_the_holding_user_across_two_verbs
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=902]
          - state_machines.WarrantyClaim.FRAUD_HOLD_to_SUBMITTED
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "held_by_user_id survives clear-hold precisely so it can bar the holder from BOTH follow-up verbs: wa-1 cannot clear its own hold and, after wa-2 clears it, wa-1 still cannot approve — while wa-2 can do both. The restriction is on the user identity, not on the role, and PlatformAdmin is not an escape hatch."
        test_recipe:
          setup:
            - "One BRANDED LIFETIME SKU with 10 units on hand, one programme with fraud_score_threshold 60 and reserve_funded_cents 5000000."
