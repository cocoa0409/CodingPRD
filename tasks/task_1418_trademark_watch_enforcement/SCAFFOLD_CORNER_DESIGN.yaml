            - call: "POST /brand/watch-alerts/${alert_id}/triage"
              as: Paralegal
              captures: { av: $.data.version }
          trigger:
            - call: "POST /brand/watch-alerts/${alert_id}/assess"
              payload: { weight_mark: 0.5, weight_goods: 0.3, weight_channels: 0.3, fame_adjustment: 0, rationale: "bad weights", expected_watch_alert_version: "${av}" }
              as: AssociateAttorney
              as_user_id: assoc_1
