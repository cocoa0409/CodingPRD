  - section: validations
    instances:

      - name: create_facility_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "The request is sent with NEITHER X-User-Role nor X-User-ID; priority 1 fires before role checks, so the response is 401 ERR_UNAUTHENTICATED and no facility is created."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              captures: { err: $.data.error_id }
          assert:
            - "the request omits both the X-User-Role and X-User-ID headers"
            - "HTTP status == 401 and data.error_id == ERR_UNAUTHENTICATED"

      - name: dept_steward_cannot_report_fault_on_another_departments_device
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_OWNERSHIP_VIOLATION]"
          - "roles.DeptSteward.identity"
        distinguishing_aspect: "DeptSteward is entity_backed:Department, so X-User-ID must equal the target device's department_id; reporting a fault on a device owned by department B while acting as department A returns 403 ERR_OWNERSHIP_VIOLATION."
        test_recipe:
          setup: ["Two departments at one facility and one device owned by the second."]
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
