        actor: OwnerRepPM
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /engagements/{id}/cancel"
        actor: OwnerRepPM
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /engagements/{id}/cancel"
        actor: OwnerRepPM
        preconditions: []
        side_effects:
          - "Frees the group's calendar slot and daily-cap minutes"

  - entity: OccupancyPlan
    initial_state: PLANNING
    terminal_states: [COMPLETE]
    transitions:
      - from: PLANNING
        to: COORDINATING
        trigger: "POST /occupancy-plans/{id}/coordinate"
        actor: OwnerRepPM
        preconditions: []
        side_effects: []
      - from: READY
        to: COORDINATING
        trigger: "POST /occupancy-plans/{id}/coordinate (re-plan loop)"
        actor: OwnerRepPM
        preconditions: []
        side_effects: []
      - from: COORDINATING
        to: READY
        trigger: "POST /occupancy-plans/{id}/mark-ready"
        actor: OwnerRepPM
        preconditions:
          - "An APPROVED Baseline exists for the program (ERR_NO_APPROVED_BASELINE)"
        side_effects:
