              payload: { title_name: "Goodnight Cabin", author: "M Brown", age_band: "TODDLER", available_from_month: "2026-01", available_until_month: "2027-12" }
              as: PlatformAdmin
              captures: { t_tod: $.data.id }
            - &t_two
