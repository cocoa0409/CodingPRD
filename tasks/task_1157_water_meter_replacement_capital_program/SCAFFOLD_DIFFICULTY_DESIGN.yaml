# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_1157 Water Meter Replacement Capital Program
# 9 difficulty rules x >= 2 instances = 19 instances.
# All money math pre-computed: rate 450 cents/CCF; allowance 20000; price 18500.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: trueup_prorated_vs_measured_variants
        grounds:
          - calculations.swap_trueup
          - entities.WorkOrder.fields.provisional_trueup_cents
          - entities.WorkOrder.fields.trueup_amount_cents
          - entities.WorkOrder.fields.trueup_delta_cents
        distinguishing_aspect: |
          Same account data priced two ways on the WorkOrder/MeterReading domain:
          PRORATED_ESTIMATE at swap = 2.0 CCF/day x 21 days x 450 = 18900 cents;
          MEASURED at reconcile = (1060 - 1000) x 450 = 27000 cents; the two
          variants diverge by 8100 cents for identical account inputs.
        test_recipe:
          setup:
            - "Program (budget 5000000, rate 450, allowance 20000, notice_days 3) ACTIVE; contractor (capacity 2, price 18500) ACTIVE"
            - "Account A-1001 OUTSIDE, avg_daily_usage_ccf 2.0, last_billed_read_value 1000 at 2026-04-15T00:00:00Z; legacy meter L-0001 INSTALLED; AMI meter N-9001 IN_STOCK"
            - "Wave 1 [2026-05-01, 2026-06-01) OPEN; work order assigned; USPS notification DELIVERED 2026-05-02; appointment BOOKED 2026-05-06 AM and COMPLETED; clock at 2026-05-06T09:00:00Z; swap recorded (final 1060, initial 0)"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 5000000, target_meter_count: 2400, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000, notice_days: 3 }, as: ProgramManager, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /api/contractors", payload: { program_id: "${prog}", name: "AquaWorks", crew_capacity_per_window: 2, unit_price_cents: 18500 }, as: ProgramManager, captures: { contr: $.data.id } }
            - { call: "POST /api/accounts", payload: { account_number: "A-1001", service_address: "1 Main St", meter_location: "OUTSIDE", customer_name: "Pat", customer_phone: "555-0100", priority_tier: "STANDARD", avg_daily_usage_ccf: 2.0, last_billed_read_value: 1000, last_billed_read_at: "2026-04-15T00:00:00Z" }, as: Scheduler, captures: { acct: $.data.id } }
            - { call: "POST /api/meters", payload: { serial_number: "L-0001", size_code: "S_5_8", technology: "LEGACY" }, as: Scheduler, captures: { oldm: $.data.id } }
            - { call: "POST /api/meters/${oldm}/install", payload: { service_account_id: "${acct}", initial_read_value: 1000, installed_at: "2026-04-16T00:00:00Z" }, as: Scheduler }
            - { call: "POST /api/meters", payload: { serial_number: "N-9001", size_code: "S_5_8", technology: "AMI" }, as: Scheduler, captures: { newm: $.data.id } }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 1, window_start: "2026-05-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", capacity: 10 }, as: ProgramManager, captures: { wave: $.data.id } }
            - { call: "POST /api/waves/${wave}/open", payload: {}, as: ProgramManager }
            - { call: "POST /api/work-orders", payload: { wave_id: "${wave}", service_account_id: "${acct}" }, as: Scheduler, captures: { wo: $.data.id, wo_v: $.data.version } }
            - { call: "POST /api/work-orders/${wo}/assign", payload: { contractor_id: "${contr}", expected_work_order_version: "${wo_v}" }, as: Scheduler, captures: { wo_v2: $.data.version } }
            - { call: "POST /api/notifications", payload: { work_order_id: "${wo}", channel: "USPS_MAIL" }, as: Scheduler, captures: { notif: $.data.id } }
            - { call: "POST /api/notifications/${notif}/confirm-delivery", payload: { outcome: "DELIVERED", delivered_at: "2026-05-02T10:00:00Z" }, as: Scheduler }
            - { call: "GET /api/work-orders/${wo}", payload: {}, as: Scheduler, captures: { wo_v3: $.data.version } }
            - { call: "POST /api/appointments", payload: { work_order_id: "${wo}", slot_date: "2026-05-06", window: "AM", expected_work_order_version: "${wo_v3}" }, as: Scheduler, captures: { appt: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T09:00:00Z" }, as: ProgramManager }
            - { call: "POST /api/appointments/${appt}/complete", payload: {}, as: FieldContractor, as_user_id: "${contr}" }
            - { call: "GET /api/work-orders/${wo}", payload: {}, as: Scheduler, captures: { wo_v4: $.data.version } }
            - { call: "POST /api/work-orders/${wo}/swap", payload: { expected_work_order_version: "${wo_v4}", new_meter_id: "${newm}", final_read_value: 1060, initial_read_value: 0 }, as: FieldContractor, as_user_id: "${contr}", captures: { wo_v5: $.data.version } }
            - { call: "POST /api/readings", payload: { work_order_id: "${wo}", meter_id: "${oldm}", read_type: "FINAL", value: 1060, source: "FIELD_CREW", read_at: "2026-05-06T09:30:00Z" }, as: FieldContractor, as_user_id: "${contr}" }
            - { call: "POST /api/readings", payload: { work_order_id: "${wo}", meter_id: "${newm}", read_type: "INITIAL", value: 0, source: "FIELD_CREW", read_at: "2026-05-06T09:30:00Z" }, as: FieldContractor, as_user_id: "${contr}" }
          trigger:
            - { call: "POST /api/work-orders/${wo}/reconcile", payload: { expected_work_order_version: "${wo_v5}" }, as: FieldContractor, as_user_id: "${contr}" }
          assert:
            - "swap response: WorkOrder.${wo}.provisional_trueup_cents == 18900 (PRORATED: 2.0 x 21 days x 450)"
            - "reconcile response: WorkOrder.${wo}.trueup_amount_cents == 27000 (MEASURED: (1060-1000) x 450)"
            - "WorkOrder.${wo}.trueup_delta_cents == 8100"
            - "WorkOrder.${wo}.lifecycle_status == RECONCILED"

      - name: complaint_registration_error_vs_goodwill_variants
        grounds:
          - calculations.complaint_adjustment
          - entities.HighBillComplaint.fields.adjustment_cents
          - entities.HighBillComplaint.fields.adjudication_variant
        distinguishing_aspect: |
          Identical money (claimed 16800, baseline 12000, variance 40%) on the
          HighBillComplaint domain: without a FAIL bench test GOODWILL_TIERED gives
          round(4800 x 0.10) = 480; with a linked FAIL bench test (weighted accuracy
          105.00) REGISTRATION_ERROR gives 16800 - round(16800 x 100 / 105) = 800.
          Different entity domain from trueup_prorated_vs_measured_variants.
        test_recipe:
          setup:
            - "Program ACTIVE; contractor ACTIVE; two accounts (A-2001, A-2002) each with legacy meter installed and AMI meter in stock; wave OPEN"
            - "Two work orders swapped (final 1060/initial 0 each); complaint A filed with claimed 16800 / baseline 12000 and NO bench test; complaint B identical money, bench test ordered and recorded FAIL with weighted accuracy 105.00"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 5000000, target_meter_count: 2400, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000, notice_days: 3 }, as: ProgramManager, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /api/contractors", payload: { program_id: "${prog}", name: "AquaWorks", crew_capacity_per_window: 2, unit_price_cents: 18500 }, as: ProgramManager, captures: { contr: $.data.id } }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 1, window_start: "2026-05-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", capacity: 10 }, as: ProgramManager, captures: { wave: $.data.id } }
            - { call: "POST /api/waves/${wave}/open", payload: {}, as: ProgramManager }
            # --- work order A ---
            - { call: "POST /api/accounts", payload: { account_number: "A-2001", service_address: "2 Oak Ave", meter_location: "OUTSIDE", customer_name: "Dee", customer_phone: "555-0200", avg_daily_usage_ccf: 2.0, last_billed_read_value: 1000, last_billed_read_at: "2026-04-15T00:00:00Z" }, as: Scheduler, captures: { acctA: $.data.id } }
            - { call: "POST /api/meters", payload: { serial_number: "L-2001", size_code: "S_5_8", technology: "LEGACY" }, as: Scheduler, captures: { oldmA: $.data.id } }
            - { call: "POST /api/meters/${oldmA}/install", payload: { service_account_id: "${acctA}", initial_read_value: 1000, installed_at: "2026-04-16T00:00:00Z" }, as: Scheduler }
            - { call: "POST /api/meters", payload: { serial_number: "N-2001", size_code: "S_5_8", technology: "AMI" }, as: Scheduler, captures: { newmA: $.data.id } }
            - { call: "POST /api/work-orders", payload: { wave_id: "${wave}", service_account_id: "${acctA}" }, as: Scheduler, captures: { woA: $.data.id, woA_v: $.data.version } }
            - { call: "POST /api/work-orders/${woA}/assign", payload: { contractor_id: "${contr}", expected_work_order_version: "${woA_v}" }, as: Scheduler }
            - { call: "POST /api/notifications", payload: { work_order_id: "${woA}", channel: "USPS_MAIL" }, as: Scheduler, captures: { notifA: $.data.id } }
            - { call: "POST /api/notifications/${notifA}/confirm-delivery", payload: { outcome: "DELIVERED", delivered_at: "2026-05-02T10:00:00Z" }, as: Scheduler }
            - { call: "GET /api/work-orders/${woA}", payload: {}, as: Scheduler, captures: { woA_v3: $.data.version } }
            - { call: "POST /api/appointments", payload: { work_order_id: "${woA}", slot_date: "2026-05-06", window: "AM", expected_work_order_version: "${woA_v3}" }, as: Scheduler, captures: { apptA: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T09:00:00Z" }, as: ProgramManager }
            - { call: "POST /api/appointments/${apptA}/complete", payload: {}, as: FieldContractor, as_user_id: "${contr}" }
            - { call: "GET /api/work-orders/${woA}", payload: {}, as: Scheduler, captures: { woA_v4: $.data.version } }
            - { call: "POST /api/work-orders/${woA}/swap", payload: { expected_work_order_version: "${woA_v4}", new_meter_id: "${newmA}", final_read_value: 1060, initial_read_value: 0 }, as: FieldContractor, as_user_id: "${contr}" }
            # --- work order B ---
            - { call: "POST /api/accounts", payload: { account_number: "A-2002", service_address: "3 Oak Ave", meter_location: "OUTSIDE", customer_name: "Kim", customer_phone: "555-0201", avg_daily_usage_ccf: 2.0, last_billed_read_value: 1000, last_billed_read_at: "2026-04-15T00:00:00Z" }, as: Scheduler, captures: { acctB: $.data.id } }
            - { call: "POST /api/meters", payload: { serial_number: "L-2002", size_code: "S_5_8", technology: "LEGACY" }, as: Scheduler, captures: { oldmB: $.data.id } }
            - { call: "POST /api/meters/${oldmB}/install", payload: { service_account_id: "${acctB}", initial_read_value: 1000, installed_at: "2026-04-16T00:00:00Z" }, as: Scheduler }
            - { call: "POST /api/meters", payload: { serial_number: "N-2002", size_code: "S_5_8", technology: "AMI" }, as: Scheduler, captures: { newmB: $.data.id } }
            - { call: "POST /api/work-orders", payload: { wave_id: "${wave}", service_account_id: "${acctB}" }, as: Scheduler, captures: { woB: $.data.id, woB_v: $.data.version } }
            - { call: "POST /api/work-orders/${woB}/assign", payload: { contractor_id: "${contr}", expected_work_order_version: "${woB_v}" }, as: Scheduler }
            - { call: "POST /api/notifications", payload: { work_order_id: "${woB}", channel: "USPS_MAIL" }, as: Scheduler, captures: { notifB: $.data.id } }
            - { call: "POST /api/notifications/${notifB}/confirm-delivery", payload: { outcome: "DELIVERED", delivered_at: "2026-05-02T10:00:00Z" }, as: Scheduler }
            - { call: "GET /api/work-orders/${woB}", payload: {}, as: Scheduler, captures: { woB_v3: $.data.version } }
            - { call: "POST /api/appointments", payload: { work_order_id: "${woB}", slot_date: "2026-05-07", window: "AM", expected_work_order_version: "${woB_v3}" }, as: Scheduler, captures: { apptB: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-07T09:00:00Z" }, as: ProgramManager }
            - { call: "POST /api/appointments/${apptB}/complete", payload: {}, as: FieldContractor, as_user_id: "${contr}" }
            - { call: "GET /api/work-orders/${woB}", payload: {}, as: Scheduler, captures: { woB_v4: $.data.version } }
            - { call: "POST /api/work-orders/${woB}/swap", payload: { expected_work_order_version: "${woB_v4}", new_meter_id: "${newmB}", final_read_value: 1060, initial_read_value: 0 }, as: FieldContractor, as_user_id: "${contr}" }
            # --- complaint A: goodwill path ---
            - { call: "POST /api/complaints", payload: { service_account_id: "${acctA}", work_order_id: "${woA}", claimed_bill_cents: 16800, baseline_bill_cents: 12000, billing_period_start: "2026-05-01T00:00:00Z", billing_period_end: "2026-06-01T00:00:00Z" }, as: CustomerService, captures: { cmpA: $.data.id } }
            - { call: "POST /api/complaints/${cmpA}/triage", payload: {}, as: CustomerService }
            # --- complaint B: bench-fail path ---
            - { call: "POST /api/complaints", payload: { service_account_id: "${acctB}", work_order_id: "${woB}", claimed_bill_cents: 16800, baseline_bill_cents: 12000, billing_period_start: "2026-05-01T00:00:00Z", billing_period_end: "2026-06-01T00:00:00Z" }, as: CustomerService, captures: { cmpB: $.data.id } }
            - { call: "POST /api/complaints/${cmpB}/triage", payload: {}, as: CustomerService }
            - { call: "POST /api/complaints/${cmpB}/order-bench-test", payload: {}, as: CustomerService }
            - { call: "POST /api/bench-tests", payload: { meter_id: "${oldmB}", work_order_id: "${woB}", complaint_id: "${cmpB}", measured_low_ccf: 2.10, measured_mid_ccf: 21.00, measured_high_ccf: 31.50 }, as: QualityAuditor, captures: { btB: $.data.id } }
          trigger:
            - { call: "POST /api/complaints/${cmpA}/adjudicate", payload: { decision: "ADJUSTED" }, as: CustomerService }
            - { call: "POST /api/complaints/${cmpB}/adjudicate", payload: { decision: "ADJUSTED" }, as: CustomerService }
          assert:
            - "BenchTest.${btB}.weighted_accuracy_pct == 105.00 and result == FAIL (over-registration: 105.00 > 101.5 upper band)"
            - "complaint A (${cmpA}): adjustment_cents == 480, adjudication_variant == GOODWILL_TIERED (round((16800-12000) x 0.10))"
            - "complaint B (${cmpB}): adjustment_cents == 800, adjudication_variant == REGISTRATION_ERROR (16800 - round(16800 x 100 / 105) = 16800 - 16000)"
            - "complaint A.status == ADJUSTED; complaint B.status == ADJUSTED"
            - "WorkOrder.${woA}.hold_status == CLEAR and WorkOrder.${woB}.hold_status == CLEAR after terminal adjudications"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_settlement_conditional_minmax
        grounds:
          - calculations.invoice_settlement
          - calculations.quality_score_recompute
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: units (2) x unit_price
          (18500) = gross 37000; bonus branch keyed on quality_score_bp (9200 < 9800
          -> 0); penalty = min(2 x round(37000 x 0.01), round(37000 x 0.10)) =
          min(740, 3700) = 740; retainage branch keyed on contractor status
          (ACTIVE -> 5% = 1850); net = 37000 + 0 - 740 - 1850 = 34410.
        test_recipe:
          setup:
            - "Contractor with 2 recorded FAIL audits in 2026-05 (score 9200, still ACTIVE), and 2 work orders CLOSED with closed_at in [2026-05-01, 2026-06-01)"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AMI-2027", fiscal_year: "FY2027", budget_total_cents: 5000000, target_meter_count: 2400, rate_per_ccf_cents: 450, default_unit_allowance_cents: 20000, notice_days: 3 }, as: ProgramManager, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /api/contractors", payload: { program_id: "${prog}", name: "AquaWorks", crew_capacity_per_window: 2, unit_price_cents: 18500 }, as: ProgramManager, captures: { contr: $.data.id } }
            - { call: "POST /api/waves", payload: { program_id: "${prog}", wave_number: 1, window_start: "2026-05-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z", capacity: 10 }, as: ProgramManager, captures: { wave: $.data.id } }
            - { call: "POST /api/waves/${wave}/open", payload: {}, as: ProgramManager }
            # --- WO1 to CLOSED with one FAIL audit then rework ---
            - { call: "POST /api/accounts", payload: { account_number: "A-3001", service_address: "4 Elm St", meter_location: "OUTSIDE", customer_name: "Lee", customer_phone: "555-0300", avg_daily_usage_ccf: 2.0, last_billed_read_value: 1000, last_billed_read_at: "2026-04-15T00:00:00Z" }, as: Scheduler, captures: { acct1: $.data.id } }
            - { call: "POST /api/meters", payload: { serial_number: "L-3001", size_code: "S_5_8", technology: "LEGACY" }, as: Scheduler, captures: { oldm1: $.data.id } }
            - { call: "POST /api/meters/${oldm1}/install", payload: { service_account_id: "${acct1}", initial_read_value: 1000, installed_at: "2026-04-16T00:00:00Z" }, as: Scheduler }
            - { call: "POST /api/meters", payload: { serial_number: "N-3001", size_code: "S_5_8", technology: "AMI" }, as: Scheduler, captures: { newm1: $.data.id } }
            - { call: "POST /api/work-orders", payload: { wave_id: "${wave}", service_account_id: "${acct1}" }, as: Scheduler, captures: { wo1: $.data.id, wo1_v: $.data.version } }
            - { call: "POST /api/work-orders/${wo1}/assign", payload: { contractor_id: "${contr}", expected_work_order_version: "${wo1_v}" }, as: Scheduler }
            - { call: "POST /api/notifications", payload: { work_order_id: "${wo1}", channel: "USPS_MAIL" }, as: Scheduler, captures: { notif1: $.data.id } }
            - { call: "POST /api/notifications/${notif1}/confirm-delivery", payload: { outcome: "DELIVERED", delivered_at: "2026-05-02T10:00:00Z" }, as: Scheduler }
            - { call: "GET /api/work-orders/${wo1}", payload: {}, as: Scheduler, captures: { wo1_v3: $.data.version } }
            - { call: "POST /api/appointments", payload: { work_order_id: "${wo1}", slot_date: "2026-05-06", window: "AM", expected_work_order_version: "${wo1_v3}" }, as: Scheduler, captures: { appt1: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T09:00:00Z" }, as: ProgramManager }
            - { call: "POST /api/appointments/${appt1}/complete", payload: {}, as: FieldContractor, as_user_id: "${contr}" }
            - { call: "GET /api/work-orders/${wo1}", payload: {}, as: Scheduler, captures: { wo1_v4: $.data.version } }
            - { call: "POST /api/work-orders/${wo1}/swap", payload: { expected_work_order_version: "${wo1_v4}", new_meter_id: "${newm1}", final_read_value: 1060, initial_read_value: 0 }, as: FieldContractor, as_user_id: "${contr}", captures: { wo1_v5: $.data.version } }
            - { call: "POST /api/readings", payload: { work_order_id: "${wo1}", meter_id: "${oldm1}", read_type: "FINAL", value: 1060, source: "FIELD_CREW", read_at: "2026-05-06T09:30:00Z" }, as: FieldContractor, as_user_id: "${contr}" }
            - { call: "POST /api/readings", payload: { work_order_id: "${wo1}", meter_id: "${newm1}", read_type: "INITIAL", value: 0, source: "FIELD_CREW", read_at: "2026-05-06T09:30:00Z" }, as: FieldContractor, as_user_id: "${contr}" }
            - { call: "POST /api/work-orders/${wo1}/reconcile", payload: { expected_work_order_version: "${wo1_v5}" }, as: FieldContractor, as_user_id: "${contr}" }
            - { call: "POST /api/endpoint-registrations", payload: { work_order_id: "${wo1}", endpoint_serial: "EP-3001" }, as: AmiOperator, captures: { reg1: $.data.id } }
            - { call: "POST /api/_ami/ingest-read", payload: { endpoint_registration_id: "${reg1}", rssi_dbm: -90, read_at: "2026-05-06T12:00:00Z" }, as: AmiOperator }
            - { call: "POST /api/_ami/ingest-read", payload: { endpoint_registration_id: "${reg1}", rssi_dbm: -90, read_at: "2026-05-06T18:00:00Z" }, as: AmiOperator }
            - { call: "POST /api/_ami/ingest-read", payload: { endpoint_registration_id: "${reg1}", rssi_dbm: -90, read_at: "2026-05-07T06:00:00Z" }, as: AmiOperator }
            - { call: "POST /api/_ami/ingest-read", payload: { endpoint_registration_id: "${reg1}", rssi_dbm: -90, read_at: "2026-05-07T12:00:00Z" }, as: AmiOperator }
            - { call: "POST /api/endpoint-registrations/${reg1}/verify", payload: {}, as: AmiOperator }
            - { call: "POST /api/quality-audits", payload: { work_order_id: "${wo1}", audit_type: "FOR_CAUSE" }, as: QualityAuditor, captures: { qa1: $.data.id } }
            - { call: "POST /api/quality-audits/${qa1}/record", payload: { checks_total: 10, checks_passed: 9, defects_found: 1 }, as: QualityAuditor }
            - { call: "GET /api/work-orders/${wo1}", payload: {}, as: Scheduler, captures: { wo1_v6: $.data.version } }
            - { call: "POST /api/work-orders/${wo1}/submit-rework", payload: { expected_work_order_version: "${wo1_v6}" }, as: FieldContractor, as_user_id: "${contr}" }
            - { call: "POST /api/work-orders/${wo1}/close", payload: {}, as: Scheduler }
            # --- WO2 to CLOSED with second FAIL audit ---
            - { call: "POST /api/accounts", payload: { account_number: "A-3002", service_address: "5 Elm St", meter_location: "OUTSIDE", customer_name: "Sam", customer_phone: "555-0301", avg_daily_usage_ccf: 2.0, last_billed_read_value: 1000, last_billed_read_at: "2026-04-15T00:00:00Z" }, as: Scheduler, captures: { acct2: $.data.id } }
            - { call: "POST /api/meters", payload: { serial_number: "L-3002", size_code: "S_5_8", technology: "LEGACY" }, as: Scheduler, captures: { oldm2: $.data.id } }
            - { call: "POST /api/meters/${oldm2}/install", payload: { service_account_id: "${acct2}", initial_read_value: 1000, installed_at: "2026-04-16T00:00:00Z" }, as: Scheduler }
            - { call: "POST /api/meters", payload: { serial_number: "N-3002", size_code: "S_5_8", technology: "AMI" }, as: Scheduler, captures: { newm2: $.data.id } }
