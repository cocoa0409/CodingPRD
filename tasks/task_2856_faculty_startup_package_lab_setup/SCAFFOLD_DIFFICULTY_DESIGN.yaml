            - "identity restored exactly for every tranche: amount_cents + carried_in_cents == available_balance_cents + encumbered_cents + disbursed_cents + carried_out_cents + expired_cents + recaptured_cents, with zero tolerance"
            - "compensation, not recomputation: the RELEASE row's amount_cents == 12345679, its reverses_transaction_id points at the ENCUMBRANCE row, and its shares are exactly 5555555 / 4320988 / 2469136 copied from that row"
            - "FundingUnit.${dept16_id}.committed_cents == 0 and FundingUnit.${col16_id}.committed_cents == 0 and FundingUnit.${dean16_id}.committed_cents == 0 - a cancel that re-splits 12345679 independently would still zero these, but a cancel that releases floor values only would leave 1 and 1 cents of drift on the college and dean office"
            - "FundingUnit.${dept16_id}.disbursed_cents == 0 and refunded_cents == 0 and reserved_cents unchanged from its post-activation value (a release is not a refund)"
            - "StartupPackage.${pkg16_id}.total_encumbered_cents == 0 and total_available_cents == 72000000 and total_disbursed_cents == 0"
            - "CommitmentTranche.${tr16_eq_b}.encumbered_cents == 0 and available_balance_cents == 15000000 (the waterfall never reached the second tranche, and the compensation must not touch it either)"

      - name: appointment_early_end_conserves_committed_equals_encumbered_across_funders
        grounds:
          - calculations.staff_encumbrance_rounding
          - calculations.cost_share_split
          - state_machines.StaffAppointment.transitions.ACTIVE_to_ENDED
          - entities.FundingUnit.fields.committed_cents
          - entities.SpendTransaction.fields.dept_share_cents
        distinguishing_aspect: |
          A different conserved quantity: the cross-entity aggregate
          sum(FundingUnit.committed_cents) == sum(CommitmentTranche.encumbered_cents), which must
          hold at 5_389_992 while the appointment is ACTIVE and at 0 once it ends, and must be
          conserved through a PARTIAL compensation - one encumbrance settled by a DISBURSEMENT of
          1_347_498 plus a RELEASE of 4_042_494 - rather than a whole reversal. The pin is that the
          RELEASE row carries the arithmetic remainder of the stored encumbrance shares
          (1_819_123 / 1_414_873 / 808_498) and not an independent split of 4_042_494
          (1_819_122 / 1_414_873 / 808_499); the two differ on two funders, so any implementation
          that re-splits the remainder breaks the aggregate by construction.
        test_recipe:
          setup:
            - "BASE fixture (package ACTIVE, spend_status SPENDING, faculty ACTIVE), clock 2026-08-01T00:00:00Z."
            - "One LAB_MANAGER appointment at fte 0.77 and monthly_cost_cents 583333 over 2026-09-01 .. 2027-08-31, activated: monthly_charge_cents == 449166 and encumbrance_total == 5_389_992 against the single PERSONNEL tranche of 9_600_000."
            - "The aggregate sum(committed_cents) == sum(encumbered_cents) == 5_389_992 is recorded before the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { col17_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${col17_id}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { dept17_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${col17_id}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { dean17_id: $.data.id }
            - call: "POST /faculty"
              payload: { full_name: "Ada Reyes", rank: "ASSISTANT", funding_unit_id: "${dept17_id}", planned_start_date: "2026-08-15" }
              as: DeanOffice
              captures: { fac17_id: $.data.id }
            - call: "POST /startup-packages"
              payload: { faculty_id: "${fac17_id}", package_kind: "INITIAL", dean_unit_id: "${dean17_id}", dept_share_pct: 45, college_share_pct: 35, dean_share_pct: 20, proposed_total_cents: 72000000, spend_deadline_on: "2028-06-30" }
              as: DeanOffice
              captures: { pkg17_id: $.data.id }
            - call: "POST /startup-packages/${pkg17_id}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2027, amount_cents: 25000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", carryforward_policy: "CAPPED", carryforward_cap_pct: 50 }
              as: DeanOffice
            - call: "POST /startup-packages/${pkg17_id}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2027, amount_cents: 15000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "FULL" }
              as: DeanOffice
            - call: "POST /startup-packages/${pkg17_id}/tranches"
              payload: { category: "EQUIPMENT", fiscal_year: 2028, amount_cents: 8000000, available_on: "2027-07-01T00:00:00Z", expires_on: "2028-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
            - call: "POST /startup-packages/${pkg17_id}/tranches"
              payload: { category: "RENOVATION", fiscal_year: 2027, amount_cents: 12000000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
            - call: "POST /startup-packages/${pkg17_id}/tranches"
              payload: { category: "PERSONNEL", fiscal_year: 2027, amount_cents: 9600000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "FULL" }
              as: DeanOffice
              captures: { tr17_pers: $.data.id }
            - call: "POST /startup-packages/${pkg17_id}/tranches"
              payload: { category: "DISCRETIONARY", fiscal_year: 2027, amount_cents: 2400000, available_on: "2026-07-01T00:00:00Z", expires_on: "2027-07-01T00:00:00Z", carryforward_policy: "NONE" }
              as: DeanOffice
            - call: "POST /startup-packages/${pkg17_id}/submit"
              payload: {}
              as: DeanOffice
              as_user_id: "U-DEANOFFICE-1"
            - call: "POST /startup-packages/${pkg17_id}/endorse"
              payload: {}
              as: DepartmentChair
              as_user_id: "${dept17_id}"
            - call: "POST /startup-packages/${pkg17_id}/approve"
              payload: {}
              as: Dean
              as_user_id: "${col17_id}"
            - call: "POST /faculty/${fac17_id}/activate"
              payload: {}
              as: DeanOffice
            - call: "POST /startup-packages/${pkg17_id}/activate"
              payload: {}
              as: DeanOffice
            - call: "POST /staff-appointments"
              payload: { package_id: "${pkg17_id}", appointment_type: "LAB_MANAGER", fte: 0.77, monthly_cost_cents: 583333, start_date: "2026-09-01", end_date: "2027-08-31" }
              as: DeanOffice
              captures: { appt17_id: $.data.id }
            - call: "POST /staff-appointments/${appt17_id}/activate"
              payload: {}
              as: DeanOffice
          trigger:
            - call: "POST /staff-appointments/${appt17_id}/end"
              payload: { end_date: "2026-11-30" }
              as: DeanOffice
          assert:
            - "before the trigger: StaffAppointment.${appt17_id}.committed_months == 12, encumbered_cents == 5389992, and CommitmentTranche.${tr17_pers}.encumbered_cents == 5389992 with available_balance_cents == 4210008"
            - "before the trigger the aggregate holds: FundingUnit committed_cents are 2425497 / 1886497 / 1077998 for department / college / dean office and their sum 5389992 equals the sum of all tranche encumbered_cents"
            - "after the trigger: StaffAppointment.${appt17_id}.status == ENDED, ended_on == 2026-08-01T00:00:00Z, end_date == 2026-11-30, months_served == 3, disbursed_cents == 1347498, encumbered_cents == 0"
            - "partial compensation: one DISBURSEMENT row of 1347498 with shares 606374 / 471624 / 269500 and one RELEASE row of 4042494 with shares 1819123 / 1414873 / 808498, both pointing at the single ENCUMBRANCE row of 5389992"
            - "the RELEASE shares are the arithmetic remainder of the stored encumbrance shares, NOT an independent split of 4042494 - which would have produced 1819122 / 1414873 / 808499 and drifted the department and dean office by one cent each"
            - "per-row conservation: 606374 + 1819123 == 2425497, 471624 + 1414873 == 1886497, 269500 + 808498 == 1077998"
            - "after the trigger the aggregate holds at zero: FundingUnit.${dept17_id}.committed_cents == 0, FundingUnit.${col17_id}.committed_cents == 0, FundingUnit.${dean17_id}.committed_cents == 0 and every tranche's encumbered_cents == 0"
            - "FundingUnit.${dept17_id}.disbursed_cents == 606374 and FundingUnit.${col17_id}.disbursed_cents == 471624 and FundingUnit.${dean17_id}.disbursed_cents == 269500"
            - "CommitmentTranche.${tr17_pers}.disbursed_cents == 1347498 and available_balance_cents == 8252502 and 9600000 == 8252502 + 1347498 (the released cents are spendable again because the tranche is still OPEN, not OBLIGATED)"
            - "StartupPackage.${pkg17_id}.total_encumbered_cents == 0, total_disbursed_cents == 1347498, total_available_cents == 70652502 and spend_down_ratio == 0.0187"
