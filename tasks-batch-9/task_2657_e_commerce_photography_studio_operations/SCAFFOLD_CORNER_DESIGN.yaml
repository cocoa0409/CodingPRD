      - name: sample_lateness_ceilings_a_partial_day_up_to_a_whole_day
        claim_type: precision
        grounds:
          - calculations.sample_return_lateness
          - entities.Sample.fields.return_days_late
          - entities.Vendor.fields.late_return_count
        distinguishing_aspect: "Received 01 Aug 08:00 with a 2-day vendor SLA (due 03 Aug 08:00) and returned 04 Aug 20:00: 129600 overdue seconds is 1.5 days, and the ceiling must report 2 whole days late - not 1 and not 1.5."
        test_recipe:
          setup:
            - "Vendor NRTH with sample_sla_days 2; sample SMP-1001 received at 2026-08-01T08:00:00Z and moved to RETURN_PENDING."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: StudioAdmin
