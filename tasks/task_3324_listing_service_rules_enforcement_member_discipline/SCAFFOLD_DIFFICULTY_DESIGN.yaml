            - "auto_citation_id non-null: FEED_ABUSE citation issued against broker ${mb_id} (deterministic selector: broker of office owning most-recently-activated ACTIVE listing)"
            - "R1 status == SUPERSEDED and R2 status == ACTIVE (newest-effective_at-wins)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: listing_withdrawn_reactivation_cycle_with_policy_reselection
        grounds:
          - state_machines.Listing.ACTIVE_to_WITHDRAWN
          - state_machines.Listing.WITHDRAWN_to_ACTIVE
        distinguishing_aspect: |
          Listing has a genuine cycle ACTIVE -> WITHDRAWN -> ACTIVE; each pass
          through activation re-runs the policy-revision selector, so a listing
          withdrawn under revision R1 and re-activated after R2 activates carries
          policy_revision_id == R2 — the cycle mutates derived state rather than
          restoring it.
        test_recipe:
          setup:
            - "Association A; broker+member MB; office O; revisions R1 (COMP_DISPLAY_ON, effective day 0) then R2 (COMP_DISPLAY_ON, effective day 5)"
            - "Listing L activated under R1, then withdrawn while accuracy_flag == CLEAN"
          setup_api_calls:
            - call: "POST /mls/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AssociationStaff
            - call: "POST /mls/associations"
              payload: { association_code: "NL1", name: "Cycle Assoc", membership_dues_cents: 120000, late_fee_tier1_cents: 5000, late_fee_tier2_cents: 15000 }
