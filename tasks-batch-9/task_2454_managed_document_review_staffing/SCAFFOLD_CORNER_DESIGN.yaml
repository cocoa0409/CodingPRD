                privilege_sample_pct: 0.20
                max_discrepancy_pct: 0.05
                min_pace_dph: 55
                second_level_required: true
              as: EngagementManager
              captures: { p_id: $.data.id }
            - *c_proto_submit
            - *c_proto_approve
            - *c_rev_a
            - *c_rev_a_verify
            - *c_screen_a
            - *c_screen_a_clear
            - *c_ca_a
            - *c_ca_a_exec
            - *c_sess_a
            - *c_sess_a_active
            - &c_rev_b
              call: "POST /reviewers"
              payload:
                full_name: "Ben Calder"
                bar_admissions: ["NY"]
                languages: ["EN", "JA"]
                subject_matter_tags: ["ANTITRUST"]
                tier: "SECOND_LEVEL"
                hourly_cost_cents: 7400
                max_concurrent_batches: 2
                remote_work_authorized: true
              as: StaffingCoordinator
              captures: { rb_id: $.data.id }
            - &c_rev_b_verify
              call: "POST /reviewers/${rb_id}/credential-status"
              payload: { to_status: "VERIFIED", bar_admissions: ["NY"] }
              as: StaffingCoordinator
            - &c_screen_b
