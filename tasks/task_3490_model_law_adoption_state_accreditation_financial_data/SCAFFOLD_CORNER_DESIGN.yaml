            - { call: "POST /naic/reviews", payload: { state_id: "${s_ca_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", team_lead_id: "lead-1", self_assessment_compliant: 0, self_assessment_total: 1 }, as: AssociationStaff, captures: { rv1: $.data.id } }
