      - name: supplement_approval_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Supplement.SUBMITTED_to_APPROVED
          - calculations.estimate_totals
          - calculations.authorization_posture_derivation
          - entities.RepairOrder.fields.approved_supplement_total_cents
        excluded_because:
          difficulty_instance: "transitive_cascade / supplement_approval_cascades_lines_totals_posture_and_stale_consent"
          rationale: >-
            That instance already walks the four-level chain from the adjuster's approval through the
            PENDING_SUPPLEMENT lines, the labor and money rollups, the re-derived authorization posture
            and the invalidated consent, asserting each level, so a separate end-to-end cascade claim
            would duplicate it exactly.

      - name: parts_return_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PartsLine.INSTALLED_to_RETURNED
          - state_machines.RepairOrder.REFINISH_CALIBRATION_to_REPAIR
          - calculations.stall_occupancy_rollup
          - entities.RepairOrder.fields.parts_return_credit_cents
        excluded_because:
          difficulty_instance: "transitive_cascade / parts_return_cascades_stage_rollback_assignment_cancel_and_stall_release"
          rationale: >-
            That instance already returns a fitted part from a post-repair stage and asserts the whole
            chain - line to RETURNED, order dragged back to REPAIR, the downstream assignment cancelled
            and the stall's booked_minutes released - including the ordering sensitivity between the
            rollback and the release.

      - name: both_refinish_variants_are_verified_on_one_data_set
        claim_type: dual_variant_calculation
        grounds:
          - calculations.refinish_hours_provisional
          - calculations.refinish_hours_final
          - entities.RepairOrder.fields.refinish_hours_provisional
          - entities.RepairOrder.fields.refinish_hours_final
        excluded_because:
          difficulty_instance: "dual_variant_calc / refinish_allocation_provisional_versus_final_on_identical_lines"
          rationale: >-
            That instance computes both variants over one identical set of refinish lines, shows the
            divergence the overlap allowance and blend rule create, and pins the delta that appears when
            the estimate is locked, which is strictly more than a two-variant smoke check.

  - section: consistency_model
    instances:
      - name: an_accepted_price_is_visible_in_the_totals_within_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.parts_extended_price
          - calculations.estimate_totals
          - endpoints.POST_/parts-lines/{id}/accept-price
        distinguishing_aspect: >-
          Nothing in this domain settles later: the response to accept-price already carries the priced
          line, and the order's rollups already agree with it on the very next read - no sweep, no
          re-read delay, no background job. An implementation that recomputes totals lazily shows stale
          money here even though a second read would look right.
        test_recipe:
          setup:
            - "A RepairOrder locked on a BODY 4.5 h line (labor 27000, supplies 1080, pre_tax 28080) with one OEM PartsLine, list 30000, qty 2, quoted by a zero-discount vendor at unit 20000."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Pia Quill", phone: "555-1063", email: "pia@example.com" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /insurers"
