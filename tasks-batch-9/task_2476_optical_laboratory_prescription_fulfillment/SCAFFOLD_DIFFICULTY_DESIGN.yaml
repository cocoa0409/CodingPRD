      - name: lab_job_rework_cycle_reenters_edged_and_invalidates_the_previous_cycle_pass
        grounds:
          - state_machines.LabJob.EDGED_to_REWORK_QUEUED
          - state_machines.LabJob.REWORK_QUEUED_to_EDGING
          - state_machines.LabJob.EDGED_to_PASSED
          - entities.LabJob.fields.rework_cycle_count
          - entities.QualityInspection.fields.cycle_index
        distinguishing_aspect: |
