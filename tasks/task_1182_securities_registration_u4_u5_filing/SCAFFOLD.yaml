scenario: "1182. Securities Registration & U4/U5 Filing (FINRA member firm registration desk): registration request & state/SRO jurisdiction selection, fingerprint & background disclosure review, exam requirement & window tracking, amendment filing deadlines for disclosure events, termination (U5) filing & comment accuracy, dual registration & affiliation rules, continuing registration fees & renewal cycle, regulatory inquiry from filing content"

domain_name: securities-registration-u4-u5-filing
api_prefix: /registration-desk

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Firm
    parent: null
    common_fields: true
    fields:
      - name: crd_number
        type: string
        source: input
        description: "Central Registration Depository number of the member firm; unique across firms"
        constraints: "required; unique; 1-7 digits"
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the member firm"
        constraints: "required; 1-120 chars"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state of the firm record"
        default: ACTIVE
        constraints: "enum {ACTIVE, SUSPENDED}"
      - name: open_inquiry_count
        type: integer
        source: computed
        description: "Count of RegulatoryInquiry rows for this firm whose status IN {OPEN, PENDING_RESPONSE}; recomputed on every inquiry status change"
        default: 0

  - name: IndividualApplicant
    parent: null
    common_fields: true
    fields:
      - name: crd_number
        type: string
        source: input
        description: "Individual CRD number; unique across applicants"
        constraints: "required; unique; 1-7 digits"
      - name: full_name
        type: string
        source: input
        description: "Legal full name as it appears on the U4"
        constraints: "required; 1-120 chars"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 date of birth used for fingerprint identity matching"
        constraints: "required; ISO YYYY-MM-DD"
      - name: fingerprint_required
        type: boolean
        source: computed
        description: "True when applicant has no FingerprintSubmission with status CLEARED; derived on read"
        default: true

  - name: RegistrationRequest
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> IndividualApplicant.id; the person being registered"
        constraints: "required"
      - name: firm_id
        type: string
        source: input
        description: "FK -> Firm.id; the sponsoring member firm"
        constraints: "required"
      - name: registration_category
        type: enum
        source: input
        description: "Registration category requested on the U4"
        constraints: "required; enum {RR, IA, PRINCIPAL}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state of the registration request"
        default: DRAFT
        constraints: "enum {DRAFT, SUBMITTED, DEFICIENT, APPROVED, ACTIVE, WITHDRAWN, DENIED, TERMINATED}"
      - name: deficiency_count
        type: integer
        source: system
        description: "Number of times the request has been returned to DEFICIENT; increments on each return; request auto-withdraws on the third return (deficiency_count reaches 3)"
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: "Server-stamped timestamp of the most recent DRAFT-or-DEFICIENT -> SUBMITTED transition"
      - name: approved_at
        type: datetime
        source: system
        description: "Server-stamped timestamp of the SUBMITTED -> APPROVED transition"

  - name: JurisdictionSelection
    parent: null
    common_fields: true
    fields:
      - name: registration_request_id
        type: string
        source: input
        description: "FK -> RegistrationRequest.id; the request this jurisdiction row belongs to"
        constraints: "required"
      - name: jurisdiction_code
        type: string
        source: input
        description: "Two-letter state code or SRO identifier selected for registration"
        constraints: "required; 2-letter uppercase state code or one of {FINRA, NYSE, NASDAQ}"
      - name: jurisdiction_type
        type: enum
        source: input
        description: "Whether the selection is a state securities regulator or a self-regulatory organization"
        constraints: "required; enum {STATE, SRO}"
      - name: status
        type: enum
        source: system
        description: "Per-jurisdiction approval state"
        default: SELECTED
        constraints: "enum {SELECTED, APPROVED, REJECTED, RELINQUISHED}"
      - name: annual_fee_cents
        type: integer
        source: system
        description: "Per-jurisdiction renewal fee component, copied from the fee schedule at selection time: STATE rows cost 5000 cents, SRO rows cost 0 (covered by firm base fee)"
        default: 0

  - name: FingerprintSubmission
    parent: null
    common_fields: true
    fields:
      - name: registration_request_id
        type: string
        source: input
        description: "FK -> RegistrationRequest.id; the request whose applicant is fingerprinted"
        constraints: "required"
      - name: submission_channel
        type: enum
        source: input
        description: "How fingerprints were captured"
        constraints: "required; enum {ELECTRONIC, HARD_CARD}"
      - name: status
        type: enum
        source: system
        description: "FBI processing result state"
        default: SUBMITTED
        constraints: "enum {SUBMITTED, CLEARED, REJECTED}"
      - name: rejection_reason
        type: string
        source: system
        description: "Illegibility or identity-mismatch reason recorded when status becomes REJECTED; null otherwise"
        default: null
      - name: processed_at
        type: datetime
        source: system
        description: "Server-stamped timestamp of the terminal SUBMITTED -> {CLEARED, REJECTED} transition"

  - name: BackgroundDisclosure
    parent: null
    common_fields: true
    fields:
      - name: registration_request_id
        type: string
        source: input
        description: "FK -> RegistrationRequest.id; the request this disclosure answer belongs to"
        constraints: "required"
      - name: question_code
        type: enum
        source: input
        description: "U4 disclosure question identifier"
        constraints: "required; enum {CRIMINAL, REGULATORY, FINANCIAL, CIVIL, EMPLOYMENT}"
      - name: answer
        type: boolean
        source: input
        description: "True means the applicant answers YES (reportable event exists); false means NO"
        constraints: "required"
      - name: explanation_text
        type: string
        source: input
        description: "Free-text explanation; required and min length 20 chars when answer is true"
        constraints: "optional when answer=false; required with min length 20 when answer=true"
      - name: review_status
        type: enum
        source: system
        description: "Review disposition of an answer=true disclosure"
        default: PENDING_REVIEW
        constraints: "enum {PENDING_REVIEW, CLEARED, FLAGGED}; rows with answer=false are stored with review_status CLEARED at creation"

  - name: ExamRequirement
    parent: null
    common_fields: true
    fields:
      - name: registration_request_id
        type: string
        source: input
        description: "FK -> RegistrationRequest.id; the request whose category creates this exam obligation"
        constraints: "required"
      - name: exam_code
        type: enum
        source: input
        description: "Qualification exam code; SIE is prerequisite to every top-off exam"
        constraints: "required; enum {SIE, S7, S63, S66, S24}"
      - name: status
        type: enum
        source: system
        description: "Obligation satisfaction state"
        default: REQUIRED
        constraints: "enum {REQUIRED, SCHEDULED, PASSED, WAIVED, EXPIRED}"
      - name: pass_recorded_at
        type: datetime
        source: system
        description: "Server-stamped timestamp when a passing result was recorded; null until PASSED"
        default: null
      - name: credit_expiry_at
        type: datetime
        source: computed
        description: "pass_recorded_at + 120 days; the exam credit lapses (status auto-flips to EXPIRED) when the server clock passes this instant while status is PASSED and the parent request is not yet ACTIVE"
        default: null

  - name: ExamWindow
    parent: null
    common_fields: true
    fields:
      - name: exam_requirement_id
        type: string
        source: input
        description: "FK -> ExamRequirement.id; the obligation this sitting window belongs to"
        constraints: "required"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the sitting window"
        constraints: "required; ISO 8601 UTC"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the sitting window; must be strictly after window_start"
        constraints: "required; ISO 8601 UTC; window_end > window_start"
      - name: status
        type: enum
        source: system
        description: "Window lifecycle; only one OPEN or SCHEDULED window per ExamRequirement may exist at a time"
        default: SCHEDULED
        constraints: "enum {SCHEDULED, OPEN, USED, CANCELLED}"
      - name: result_recorded
        type: enum
        source: system
        description: "Outcome recorded when the window is closed by an exam result"
        default: null
        constraints: "enum {PASS, FAIL, NO_SHOW, null}"

  - name: DisclosureEvent
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> IndividualApplicant.id; the person the reportable event attaches to"
        constraints: "required"
      - name: event_type
        type: enum
        source: input
        description: "Category of the reportable event"
        constraints: "required; enum {CRIMINAL_CHARGE, REGULATORY_ACTION, BANKRUPTCY, CIVIL_JUDGMENT, CUSTOMER_COMPLAINT}"
      - name: event_date
        type: string
        source: input
        description: "ISO 8601 date the underlying event occurred; may not be in the future relative to the server clock"
        constraints: "required; ISO YYYY-MM-DD; event_date <= current server date"
      - name: reported_at
        type: datetime
        source: system
        description: "Server-stamped timestamp the event was entered into the desk"
      - name: amendment_due_at
        type: datetime
        source: computed
        description: "Amendment deadline: reported_at plus 30 days under the firm-selected deadline basis; computed by amendment_deadline calculation at event creation"
        default: null
      - name: status
        type: enum
        source: system
        description: "Whether the event has been folded into a filed amendment"
        default: OPEN
        constraints: "enum {OPEN, AMENDED, LATE_AMENDED}"

  - name: AmendmentFiling
    parent: null
    common_fields: true
    fields:
      - name: disclosure_event_id
        type: string
        source: input
        description: "FK -> DisclosureEvent.id; the event this amendment reports"
        constraints: "required"
      - name: registration_request_id
        type: string
        source: computed
        description: "FK -> RegistrationRequest.id; the applicant's registration request in status ACTIVE at filing time (the most recently ACTIVE one by approved_at, tie-break created_at ASC); resolved by the server at creation"
        constraints: "system-resolved"
      - name: filed_at
        type: datetime
        source: system
        description: "Server-stamped filing timestamp"
      - name: is_late
        type: boolean
        source: computed
        description: "True when filed_at is strictly after the parent DisclosureEvent.amendment_due_at"
        default: false
      - name: narrative_text
        type: string
        source: input
        description: "Amendment narrative; required, min length 20 chars"
        constraints: "required; min length 20"
      - name: status
        type: enum
        source: system
        description: "Amendment review state"
        default: FILED
        constraints: "enum {FILED, ACCEPTED, RETURNED}"

  - name: TerminationFiling
    parent: null
    common_fields: true
    fields:
      - name: registration_request_id
        type: string
        source: input
        description: "FK -> RegistrationRequest.id; the ACTIVE registration being terminated (U5)"
        constraints: "required"
      - name: termination_reason
        type: enum
        source: input
        description: "U5 reason code"
        constraints: "required; enum {VOLUNTARY, PERMITTED_TO_RESIGN, DISCHARGED, DECEASED}"
      - name: termination_date
        type: string
        source: input
        description: "ISO 8601 effective date of termination; may not be in the future relative to the server clock"
        constraints: "required; ISO YYYY-MM-DD; termination_date <= current server date"
      - name: filed_at
        type: datetime
        source: system
        description: "Server-stamped U5 filing timestamp"
      - name: filing_deadline_at
        type: datetime
        source: computed
        description: "filed at creation: termination_date plus 30 days under the firm-selected deadline basis; computed by amendment_deadline calculation"
        default: null
      - name: is_late
        type: boolean
        source: computed
        description: "True when filed_at is strictly after filing_deadline_at"
        default: false
      - name: status
        type: enum
        source: system
        description: "U5 review state"
        default: FILED
        constraints: "enum {FILED, AMENDMENT_OPEN, CLOSED}"

  - name: U5Comment
    parent: null
    common_fields: true
    fields:
      - name: termination_filing_id
        type: string
        source: input
        description: "FK -> TerminationFiling.id; the U5 this comment attaches to"
        constraints: "required"
      - name: author_role
        type: enum
        source: system
        description: "Server-recorded role of the comment author, copied from X-User-Role at creation"
        constraints: "enum {COMPLIANCE_OFFICER, REGISTRATION_PRINCIPAL}"
      - name: comment_text
        type: string
        source: input
        description: "Comment body; required, min length 10 chars; must not contradict termination_reason per comment_accuracy rule"
        constraints: "required; min length 10"
      - name: disposition
        type: enum
        source: system
        description: "Review disposition; INCONSISTENT when the comment contradicts the parent U5 termination_reason keyword map"
        default: PENDING
        constraints: "enum {PENDING, CONSISTENT, INCONSISTENT}"

  - name: AffiliationRequest
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: "FK -> IndividualApplicant.id; the person seeking dual registration"
        constraints: "required"
      - name: second_firm_id
        type: string
        source: input
        description: "FK -> Firm.id; the second firm the applicant seeks affiliation with"
        constraints: "required; must differ from the first registration's firm"
      - name: first_registration_request_id
        type: string
        source: input
        description: "FK -> RegistrationRequest.id; the existing ACTIVE registration the dual affiliation builds on"
        constraints: "required"
      - name: status
        type: enum
        source: system
        description: "Dual-registration approval state"
        default: PENDING
        constraints: "enum {PENDING, APPROVED, DENIED, REVOKED}"
      - name: denial_reason
        type: string
        source: system
        description: "Reason recorded when status becomes DENIED"
        default: null

  - name: RenewalInvoice
    parent: null
    common_fields: true
    fields:
      - name: registration_request_id
        type: string
        source: input
        description: "FK -> RegistrationRequest.id; the ACTIVE registration being renewed for the next calendar year"
        constraints: "required"
      - name: cycle_year
        type: integer
        source: input
        description: "Calendar year the renewal pays for; uniqueness rule: at most one RenewalInvoice per (registration_request_id, cycle_year)"
        constraints: "required; 2026-2100"
      - name: jurisdiction_fee_cents
        type: integer
        source: computed
        description: "Sum of annual_fee_cents over the request's JurisdictionSelection rows with status APPROVED; 0 when none"
        default: 0
      - name: base_fee_cents
        type: integer
        source: computed
        description: "Firm base renewal: 10000 cents for the first registration of the firm in the cycle, 5000 cents for each additional registration; pinned per-invoice at creation"
        default: 0
      - name: late_surcharge_cents
        type: integer
        source: computed
        description: "Late surcharge on base_fee_cents: 25% per full 14-day block of lateness past Jan 1 of cycle_year, capped at 100%; computed by renewal_fee calculation"
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "jurisdiction_fee_cents + base_fee_cents + late_surcharge_cents"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Payment state; invoice auto-voids when the registration leaves ACTIVE before payment"
        default: ISSUED
        constraints: "enum {ISSUED, PAID, VOID}"

  - name: RegulatoryInquiry
    parent: null
    common_fields: true
    fields:
      - name: firm_id
        type: string
        source: computed
        description: "FK -> Firm.id; copied from the subject filing's firm at inquiry creation"
        constraints: "system-resolved"
      - name: subject_filing_type
        type: enum
        source: input
        description: "Which filing the inquiry examines"
        constraints: "required; enum {REGISTRATION_REQUEST, AMENDMENT_FILING, TERMINATION_FILING}"
      - name: subject_filing_id
        type: string
        source: input
        description: "Polymorphic FK: id of a RegistrationRequest, AmendmentFiling, or TerminationFiling per subject_filing_type; must exist"
        constraints: "required"
      - name: inquiry_text
        type: string
        source: input
        description: "Regulator's question text; required, min length 20 chars"
        constraints: "required; min length 20"
      - name: response_due_at
        type: datetime
        source: computed
        description: "Inquiry creation timestamp plus 15 business days per amendment_deadline REGULATORY basis"
        default: null
      - name: response_text
        type: string
        source: input
        description: "Firm's response text; required on respond, min length 20 chars"
        default: null
      - name: status
        type: enum
        source: system
        description: "Inquiry lifecycle"
        default: OPEN
        constraints: "enum {OPEN, PENDING_RESPONSE, RESPONDED, CLOSED}"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RegistrationRequest
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, DENIED, TERMINATED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /registration-desk/registration-requests/{id}/submit"
        actor: RegistrationPrincipal
        preconditions:
          - "request.status == DRAFT"
          - "at least one JurisdictionSelection row with status SELECTED exists for this request"
          - "every BackgroundDisclosure row for this request with answer == true has explanation_text length >= 20"
        side_effects:
          - "sets submitted_at to current server time"
          - "creates ExamRequirement rows per registration_category: RR -> {SIE, S7, S63}; IA -> {SIE, S65-equivalent S66}; PRINCIPAL -> {SIE, S7, S24}; all status REQUIRED"
          - "increments RegistrationRequest.version by 1"
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /registration-desk/registration-requests/{id}/return-deficient"
        actor: ComplianceOfficer
        preconditions:
          - "request.status == SUBMITTED"
          - "the acting ComplianceOfficer's X-User-ID differs from the X-User-ID that submitted the request (segregation of duties)"
        side_effects:
          - "increments deficiency_count by 1"
          - "when deficiency_count reaches 3, the request transitions to WITHDRAWN instead of DEFICIENT (auto-withdraw on third return)"
          - "increments RegistrationRequest.version by 1"
      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /registration-desk/registration-requests/{id}/submit"
        actor: RegistrationPrincipal
        preconditions:
          - "request.status == DEFICIENT"
          - "every BackgroundDisclosure row for this request with answer == true has explanation_text length >= 20"
        side_effects:
          - "sets submitted_at to current server time"
          - "increments RegistrationRequest.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /registration-desk/registration-requests/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "request.status == SUBMITTED"
          - "the acting ComplianceOfficer's X-User-ID differs from the X-User-ID that submitted the request (segregation of duties)"
          - "every ExamRequirement row for this request has status IN {PASSED, WAIVED}"
          - "at least one FingerprintSubmission row for this request has status CLEARED"
          - "every BackgroundDisclosure row with answer == true has review_status IN {CLEARED}"
          - "applicant.fingerprint_required == false"
        side_effects:
          - "sets approved_at to current server time"
          - "flips every JurisdictionSelection row with status SELECTED to APPROVED"
          - "increments RegistrationRequest.version by 1"
      - from: APPROVED
        to: ACTIVE
        trigger: "system event: first moment of the calendar day following approved_at (server clock evaluation)"
        actor: system
        preconditions:
          - "request.status == APPROVED"
          - "server clock current date is strictly after date(approved_at)"
        side_effects:
          - "no additional mutations beyond status and version"
          - "increments RegistrationRequest.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /registration-desk/registration-requests/{id}/deny"
        actor: ComplianceOfficer
        preconditions:
          - "request.status == SUBMITTED"
          - "at least one BackgroundDisclosure row has review_status == FLAGGED OR at least one ExamRequirement has status EXPIRED"
          - "the acting ComplianceOfficer's X-User-ID differs from the X-User-ID that submitted the request (segregation of duties)"
        side_effects:
          - "flips every JurisdictionSelection row with status SELECTED to REJECTED"
          - "increments RegistrationRequest.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /registration-desk/registration-requests/{id}/withdraw"
        actor: RegistrationPrincipal
        preconditions:
          - "request.status IN {DRAFT, DEFICIENT, SUBMITTED}"
        side_effects:
          - "flips every JurisdictionSelection row with status SELECTED to RELINQUISHED"
          - "voids every RenewalInvoice row with status ISSUED for this request (status -> VOID)"
          - "increments RegistrationRequest.version by 1"
      - from: DEFICIENT
        to: WITHDRAWN
        trigger: "POST /registration-desk/registration-requests/{id}/withdraw"
        actor: RegistrationPrincipal
        preconditions:
          - "request.status IN {DRAFT, DEFICIENT, SUBMITTED}"
        side_effects:
          - "flips every JurisdictionSelection row with status SELECTED to RELINQUISHED"
          - "voids every RenewalInvoice row with status ISSUED for this request (status -> VOID)"
          - "increments RegistrationRequest.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /registration-desk/registration-requests/{id}/withdraw"
        actor: RegistrationPrincipal
        preconditions:
          - "request.status IN {DRAFT, DEFICIENT, SUBMITTED}"
        side_effects:
          - "flips every JurisdictionSelection row with status SELECTED to RELINQUISHED"
          - "voids every RenewalInvoice row with status ISSUED for this request (status -> VOID)"
          - "increments RegistrationRequest.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /registration-desk/termination-filings (creates the U5)"
        actor: RegistrationPrincipal
        preconditions:
          - "request.status == ACTIVE"
        side_effects:
          - "creates TerminationFiling with status FILED"
          - "sets this request's status to TERMINATED"
          - "flips every JurisdictionSelection row with status APPROVED to RELINQUISHED"
          - "voids every RenewalInvoice row with status ISSUED for this request (status -> VOID)"
          - "revokes every AffiliationRequest row with first_registration_request_id == this request and status APPROVED (status -> REVOKED); each such revocation itself cascades: the revoked AffiliationRequest's applicant loses dual-registration status and any RenewalInvoice with status ISSUED on the second firm's corresponding registration is voided"
          - "increments RegistrationRequest.version by 1"

  - entity: JurisdictionSelection
    initial_state: SELECTED
    terminal_states: [REJECTED, RELINQUISHED]
    transitions:
      - from: SELECTED
        to: APPROVED
        trigger: "cascade from RegistrationRequest SUBMITTED -> APPROVED"
        actor: system
        preconditions:
          - "parent RegistrationRequest transitions SUBMITTED -> APPROVED"
        side_effects:
          - "locks annual_fee_cents at its current value"
      - from: SELECTED
        to: REJECTED
        trigger: "cascade from RegistrationRequest SUBMITTED -> DENIED"
        actor: system
        preconditions:
          - "parent RegistrationRequest transitions SUBMITTED -> DENIED"
        side_effects: []
      - from: SELECTED
        to: RELINQUISHED
        trigger: "cascade from RegistrationRequest -> WITHDRAWN"
        actor: system
        preconditions:
          - "parent RegistrationRequest transitions to WITHDRAWN"
        side_effects: []
      - from: APPROVED
        to: RELINQUISHED
        trigger: "cascade from RegistrationRequest ACTIVE -> TERMINATED, or POST /registration-desk/jurisdiction-selections/{id}/relinquish"
        actor: system | RegistrationPrincipal
        preconditions:
          - "selection.status == APPROVED"
        side_effects:
          - "when triggered via relinquish endpoint: recomputes jurisdiction_fee_cents on every RenewalInvoice with status ISSUED for the same registration request"

  - entity: FingerprintSubmission
    initial_state: SUBMITTED
    terminal_states: [CLEARED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /registration-desk/fingerprint-submissions/{id}/process with outcome=CLEARED"
        actor: SystemOperator
        preconditions:
          - "submission.status == SUBMITTED"
        side_effects:
          - "sets processed_at to current server time"
          - "recomputes applicant.fingerprint_required to false"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /registration-desk/fingerprint-submissions/{id}/process with outcome=REJECTED"
        actor: SystemOperator
        preconditions:
          - "submission.status == SUBMITTED"
        side_effects:
          - "sets processed_at to current server time"
          - "records rejection_reason from payload"
          - "applicant.fingerprint_required remains true; a fresh FingerprintSubmission may be created"

  - entity: ExamRequirement
    initial_state: REQUIRED
    terminal_states: [PASSED, WAIVED, EXPIRED]
    transitions:
      - from: REQUIRED
        to: SCHEDULED
        trigger: "POST /registration-desk/exam-windows (creating an ExamWindow against this requirement)"
        actor: RegistrationPrincipal
        preconditions:
          - "requirement.status == REQUIRED"
          - "no other ExamWindow for this requirement has status IN {SCHEDULED, OPEN}"
          - "when exam_code != SIE: the same registration request has an ExamRequirement with exam_code == SIE and status IN {SCHEDULED, PASSED, WAIVED}"
        side_effects:
          - "requirement.status -> SCHEDULED"
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /registration-desk/exam-windows/{id}/record-result with result=PASS"
        actor: SystemOperator
        preconditions:
          - "window.status IN {SCHEDULED, OPEN}"
          - "window.window_start <= current server time < window.window_end"
        side_effects:
          - "window.status -> USED; window.result_recorded -> PASS"
          - "requirement.status -> PASSED; sets pass_recorded_at and credit_expiry_at = pass_recorded_at + 120 days"
      - from: SCHEDULED
        to: REQUIRED
        trigger: "POST /registration-desk/exam-windows/{id}/record-result with result=FAIL or NO_SHOW"
        actor: SystemOperator
        preconditions:
          - "window.status IN {SCHEDULED, OPEN}"
        side_effects:
          - "window.status -> USED; window.result_recorded -> result"
          - "requirement.status -> REQUIRED (cycle back; a new ExamWindow may then be created)"
      - from: REQUIRED
        to: WAIVED
        trigger: "POST /registration-desk/exam-requirements/{id}/waive"
        actor: ComplianceOfficer
        preconditions:
          - "requirement.status == REQUIRED"
          - "parent RegistrationRequest.status IN {DRAFT, DEFICIENT}"
        side_effects: []
      - from: PASSED
        to: EXPIRED
        trigger: "system event: server clock passes credit_expiry_at while parent RegistrationRequest.status NOT IN {ACTIVE, TERMINATED}"
        actor: system
        preconditions:
          - "requirement.status == PASSED"
          - "current server time >= credit_expiry_at"
          - "parent RegistrationRequest.status NOT IN {ACTIVE, TERMINATED}"
        side_effects:
          - "the flip to EXPIRED itself makes the parent request deniable: a ComplianceOfficer may then run POST /registration-desk/registration-requests/{id}/deny (precondition 'at least one ExamRequirement has status EXPIRED' becomes satisfied)"

  - entity: DisclosureEvent
    initial_state: OPEN
    terminal_states: [AMENDED, LATE_AMENDED]
    transitions:
      - from: OPEN
        to: AMENDED
        trigger: "POST /registration-desk/amendment-filings with filed_at <= amendment_due_at"
        actor: RegistrationPrincipal
        preconditions:
          - "event.status == OPEN"
          - "the applicant has a RegistrationRequest in status ACTIVE at filing time"
        side_effects:
          - "creates AmendmentFiling with is_late=false"
          - "event.status -> AMENDED"
      - from: OPEN
        to: LATE_AMENDED
        trigger: "POST /registration-desk/amendment-filings with filed_at strictly after amendment_due_at"
        actor: RegistrationPrincipal
        preconditions:
          - "event.status == OPEN"
          - "the applicant has a RegistrationRequest in status ACTIVE at filing time"
        side_effects:
          - "creates AmendmentFiling with is_late=true"
          - "event.status -> LATE_AMENDED"

  - entity: AmendmentFiling
    initial_state: FILED
    terminal_states: [ACCEPTED]
    transitions:
      - from: FILED
        to: ACCEPTED
        trigger: "POST /registration-desk/amendment-filings/{id}/accept"
        actor: ComplianceOfficer
        preconditions:
          - "filing.status == FILED"
          - "the acting ComplianceOfficer's X-User-ID differs from the X-User-ID that filed the amendment (segregation of duties)"
        side_effects: []
      - from: FILED
        to: RETURNED
        trigger: "POST /registration-desk/amendment-filings/{id}/return"
        actor: ComplianceOfficer
        preconditions:
          - "filing.status == FILED"
          - "the acting ComplianceOfficer's X-User-ID differs from the X-User-ID that filed the amendment (segregation of duties)"
        side_effects:
          - "the parent DisclosureEvent reverts to OPEN and its amendment_due_at is recomputed from the original reported_at under the same deadline basis (the 30-day clock does not restart from the return date); the amendment filing remains queryable in RETURNED state"
      - from: RETURNED
        to: FILED
        trigger: "POST /registration-desk/amendment-filings with the same disclosure_event_id (re-filing creates a new AmendmentFiling row; the RETURNED row is immutable)"
        actor: RegistrationPrincipal
        preconditions: []
        side_effects: []
        note: "re-filing is a new row; RETURNED is quasi-terminal for the old row but the event cycle continues"

  - entity: TerminationFiling
    initial_state: FILED
    terminal_states: [CLOSED]
    transitions:
      - from: FILED
        to: AMENDMENT_OPEN
        trigger: "POST /registration-desk/termination-filings/{id}/open-amendment"
        actor: RegistrationPrincipal
        preconditions:
          - "filing.status == FILED"
          - "no RegulatoryInquiry with subject_filing_type == TERMINATION_FILING and subject_filing_id == this filing has status IN {OPEN, PENDING_RESPONSE}"
        side_effects:
          - "permits PATCH of termination_reason and narrative fields while AMENDMENT_OPEN"
      - from: AMENDMENT_OPEN
        to: FILED
        trigger: "POST /registration-desk/termination-filings/{id}/close-amendment"
        actor: RegistrationPrincipal
        preconditions:
          - "filing.status == AMENDMENT_OPEN"
          - "every U5Comment row for this filing has disposition == CONSISTENT"
        side_effects: []
      - from: FILED
        to: CLOSED
        trigger: "POST /registration-desk/termination-filings/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "filing.status == FILED"
          - "every U5Comment row for this filing has disposition IN {CONSISTENT}"
          - "every RegulatoryInquiry with subject_filing_id == this filing has status IN {CLOSED}"
          - "the acting ComplianceOfficer's X-User-ID differs from the X-User-ID that filed the U5 (segregation of duties)"
        side_effects: []

  - entity: AffiliationRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED, REVOKED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /registration-desk/affiliation-requests/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "affiliation.status == PENDING"
          - "first RegistrationRequest (first_registration_request_id) has status ACTIVE"
          - "second_firm_id != firm_id of the first RegistrationRequest"
          - "applicant has no other AffiliationRequest with status IN {PENDING, APPROVED} for the same second_firm_id"
        side_effects: []
      - from: PENDING
        to: DENIED
        trigger: "POST /registration-desk/affiliation-requests/{id}/deny"
        actor: ComplianceOfficer
        preconditions:
          - "affiliation.status == PENDING"
        side_effects:
          - "records denial_reason from payload"
      - from: APPROVED
        to: REVOKED
        trigger: "cascade from first RegistrationRequest ACTIVE -> TERMINATED, or POST /registration-desk/affiliation-requests/{id}/revoke"
        actor: system | ComplianceOfficer
        preconditions:
          - "affiliation.status == APPROVED"
        side_effects: []

  - entity: RenewalInvoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /registration-desk/renewal-invoices/{id}/pay"
        actor: FinanceClerk
        preconditions:
          - "invoice.status == ISSUED"
          - "parent RegistrationRequest.status == ACTIVE"
          - "payload expected_renewal_invoice_version == invoice.version (OCC)"
        side_effects:
          - "increments RenewalInvoice.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "cascade from RegistrationRequest -> {WITHDRAWN, TERMINATED}, or POST /registration-desk/renewal-invoices/{id}/void"
        actor: system | FinanceClerk
        preconditions:
          - "invoice.status == ISSUED"
        side_effects: []

  - entity: RegulatoryInquiry
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: PENDING_RESPONSE
        trigger: "POST /registration-desk/regulatory-inquiries/{id}/route"
        actor: SystemOperator
        preconditions:
          - "inquiry.status == OPEN"
        side_effects:
          - "recomputes firm.open_inquiry_count (status leaves OPEN set membership unchanged — both OPEN and PENDING_RESPONSE count)"
      - from: PENDING_RESPONSE
        to: RESPONDED
        trigger: "POST /registration-desk/regulatory-inquiries/{id}/respond"
        actor: ComplianceOfficer
        preconditions:
          - "inquiry.status == PENDING_RESPONSE"
          - "current server time <= response_due_at (late responses rejected)"
        side_effects:
          - "stores response_text"
          - "recomputes firm.open_inquiry_count (decrements by 1: RESPONDED is outside {OPEN, PENDING_RESPONSE})"
      - from: RESPONDED
        to: CLOSED
        trigger: "POST /registration-desk/regulatory-inquiries/{id}/close"
        actor: SystemOperator
        preconditions:
          - "inquiry.status == RESPONDED"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: renewal-pay-stale-invoice
    parent_entity: RenewalInvoice
    write_endpoint: "POST /registration-desk/renewal-invoices/{id}/pay"
    occ_field: "expected_renewal_invoice_version"
    description: |
      Paying a RenewalInvoice whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just paid or voided the invoice and the current writer's view of the
      invoice is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: registration-amend-stale-request
    parent_entity: RegistrationRequest
    write_endpoint: "PATCH /registration-desk/registration-requests/{id}"
    occ_field: "expected_registration_request_version"
    description: |
      Patching a RegistrationRequest whose version has advanced since the
      client last observed it is rejected. This captures the case where a
      system transition or another writer has just mutated the request and
      the current writer's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: amendment_deadline
    trigger: "at DisclosureEvent creation (amendment_due_at), at TerminationFiling creation (filing_deadline_at), at RegulatoryInquiry creation (response_due_at, always REGULATORY basis)"
    algorithm: chronological
    formula: |
      deadline(deadline_basis, anchor_date, n_days):
        if deadline_basis == CALENDAR:
          return anchor_date + n_days calendar days
        if deadline_basis == REGULATORY:
          d = anchor_date
          added = 0
          while added < n_days:
            d = d + 1 day
            if weekday(d) IN {Mon..Fri}:   # system holiday calendar is empty
              added = added + 1
          return d
    input_set: "anchor date = DisclosureEvent.reported_at (event) or TerminationFiling.termination_date (U5) or inquiry creation timestamp; n_days = 30 for amendments/U5, 15 for inquiries"
    constants:
      AMENDMENT_WINDOW_DAYS: 30
      U5_WINDOW_DAYS: 30
      INQUIRY_RESPONSE_DAYS: 15
    precision: "date precision; deadline is inclusive through end-of-day 23:59:59.999Z on the returned date"
    variants:
      - name: calendar_basis
        when: "the firm has configured deadline_basis=CALENDAR (PATCH /registration-desk/firms/{id} with deadline_basis=CALENDAR; default when never patched)"
        difference: "anchor + N calendar days; weekends and holidays ignored"
      - name: regulatory_basis
        when: "the firm has configured deadline_basis=REGULATORY"
        difference: "anchor + N business days (Mon-Fri only); weekends skipped; same anchor and N produce a strictly later-or-equal date than calendar_basis whenever the anchor window spans at least one weekend"

  - name: renewal_fee
    trigger: "at RenewalInvoice creation (POST /registration-desk/renewal-invoices); late_surcharge_cents recomputed at payment time if the invoice is still ISSUED"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned: (1) jurisdiction component, (2) base component,
      # (3) surcharge on base only, (4) total. Rounding: each component rounded
      # to whole cents with round_half_up BEFORE summing (per-component-then-sum).
      jurisdiction_fee_cents = sum(sel.annual_fee_cents for sel in JurisdictionSelection
                                   where sel.registration_request_id == request.id
                                     and sel.status == APPROVED)
      firm_rank = count of RegistrationRequest rows for the same firm with
                  status == ACTIVE and approved_at < this.approved_at
                  (tie-break: created_at ASC); rank 0 => first registration
      base_fee_cents = 10000 if firm_rank == 0 else 5000
      days_late = max(0, (current server date) - date(cycle_year, 1, 1)) in whole days
      blocks = floor(days_late / 14)
      surcharge_pct = min(blocks * 25, 100)
      late_surcharge_cents = round_half_up(base_fee_cents * surcharge_pct / 100)
      total_cents = jurisdiction_fee_cents + base_fee_cents + late_surcharge_cents
    input_set: "RegistrationRequest must be ACTIVE at invoice creation; JurisdictionSelection rows included only when status == APPROVED (SELECTED/REJECTED/RELINQUISHED excluded)"
    constants:
      FIRST_REGISTRATION_BASE_CENTS: 10000
      ADDITIONAL_REGISTRATION_BASE_CENTS: 5000
      STATE_JURISDICTION_FEE_CENTS: 5000
      SRO_JURISDICTION_FEE_CENTS: 0
      LATE_BLOCK_DAYS: 14
      LATE_PCT_PER_BLOCK: 25
      LATE_PCT_CAP: 100
    precision: "whole cents; round_half_up per component, components summed after rounding"
    variants:
      - name: provisional_estimate
        when: "GET /registration-desk/registration-requests/{id}/renewal-estimate?cycle_year=Y"
        difference: "computes the same formula but firm_rank is evaluated as of the estimate call (projected rank) and days_late uses the current server date; the estimate is NOT persisted and may differ from the final invoice if another registration of the firm activates before the invoice is created"
      - name: final_invoice
        when: "POST /registration-desk/renewal-invoices"
        difference: "firm_rank and days_late are pinned at creation; late_surcharge_cents is additionally recomputed at payment time using the payment date (the stored value is the creation-time value; the amount actually collected is the payment-time recompute, and GET on the invoice always returns the creation-time components plus a recomputed payable_total_cents field)"

  - name: exam_credit_window
    trigger: "on ExamRequirement SCHEDULED -> PASSED (sets credit_expiry_at) and on every server clock evaluation (status PASSED -> EXPIRED check)"
    algorithm: threshold
    formula: |
      credit_expiry_at = pass_recorded_at + 120 days (EXAM_CREDIT_DAYS)
      if current_server_time >= credit_expiry_at
         and requirement.status == PASSED
         and parent_request.status NOT IN {ACTIVE, TERMINATED}:
        requirement.status -> EXPIRED
      # boundary: exactly at credit_expiry_at the credit IS expired (>=, not >)
    input_set: "ExamRequirement rows with status PASSED whose parent RegistrationRequest.status NOT IN {ACTIVE, TERMINATED}"
    constants:
      EXAM_CREDIT_DAYS: 120
    precision: "second precision on timestamps; boundary comparison is >= (expired at exactly credit_expiry_at)"

  - name: comment_accuracy_check
    trigger: "on U5Comment creation"
    algorithm: weighted_scoring
    formula: |
      # Keyword contradiction map (case-insensitive substring match on comment_text):
      #   VOLUNTARY           -> forbidden substrings {fired, discharged, terminated for cause}
      #   PERMITTED_TO_RESIGN -> forbidden substrings {voluntary resignation of}
      #   DISCHARGED          -> forbidden substrings {resigned voluntarily, quit}
      #   DECEASED            -> forbidden substrings {resigned, fired, discharged}
      # score = count of forbidden substrings present in comment_text
      # disposition = CONSISTENT if score == 0 else INCONSISTENT
      # boundary: score == 0 is CONSISTENT; score >= 1 is INCONSISTENT
    input_set: "the comment_text and the parent TerminationFiling.termination_reason"
    constants:
      CONTRADICTION_THRESHOLD: 1
    precision: "exact substring count; case-insensitive"

  - name: deficiency_auto_withdraw
    trigger: "on RegistrationRequest SUBMITTED -> DEFICIENT transition"
    algorithm: threshold
    formula: |
      new_count = deficiency_count + 1
      if new_count >= MAX_DEFICIENCIES:   # >= boundary: the third return withdraws
        target_state = WITHDRAWN
      else:
        target_state = DEFICIENT
      deficiency_count = new_count
    input_set: "the RegistrationRequest being returned"
    constants:
      MAX_DEFICIENCIES: 3
    precision: "integer count; boundary is >= 3 (third return withdraws; second return stays DEFICIENT)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the role in X-User-Role is permitted for this endpoint per the roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path id and body FK resolves to an existing entity (validated left-to-right: path ids first, then body FKs in input order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "uniqueness constraints: Firm.crd_number, IndividualApplicant.crd_number, (registration_request_id, cycle_year) on RenewalInvoice, one OPEN-or-SCHEDULED ExamWindow per ExamRequirement, one AffiliationRequest per (applicant_id, second_firm_id) in status PENDING-or-APPROVED"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST creation endpoints"
  - priority: 5
    category: state
    check: "target entity's status permits the requested transition per the state machine"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "OCC: payload expected_<parent>_version equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /registration-desk/renewal-invoices/{id}/pay, PATCH /registration-desk/registration-requests/{id}"
  - priority: 7
    category: business_safety
    check: "segregation of duties: on approve / return-deficient / deny / amendment accept-return / U5 close, the acting ComplianceOfficer's X-User-ID differs from the X-User-ID recorded as the filer/submitter of the target"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST .../approve, POST .../return-deficient, POST .../deny, POST .../amendment-filings/{id}/accept, POST .../amendment-filings/{id}/return, POST .../termination-filings/{id}/close"
  - priority: 8
    category: business_safety
    check: "regulatory gating: approve requires every ExamRequirement in {PASSED, WAIVED}, a CLEARED FingerprintSubmission, every answer=true BackgroundDisclosure CLEARED, and applicant.fingerprint_required == false"
    error_id: ERR_REGULATORY_GATE
    http_status: 422
    applies_to: "POST /registration-desk/registration-requests/{id}/approve"
  - priority: 9
    category: business_constraint
    check: "field shape: required fields present; enums in declared sets; min lengths (explanation_text>=20 when answer true; narrative_text>=20; inquiry_text>=20; response_text>=20; comment_text>=10); jurisdiction_code matches state/SRO pattern and jurisdiction_type; window_end > window_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 10
    category: business_temporal
    check: "event_date and termination_date not in the future relative to server clock; exam result recording requires current server time within [window_start, window_end); inquiry respond requires current server time <= response_due_at"
    error_id: ERR_TEMPORAL_VIOLATION
    http_status: 422
    applies_to: "POST /registration-desk/disclosure-events, POST /registration-desk/termination-filings, POST /registration-desk/exam-windows/{id}/record-result, POST /registration-desk/regulatory-inquiries/{id}/respond"
  - priority: 11
    category: business_referential
    check: "cross-entity referential rules: affiliation second_firm_id differs from first registration's firm; amendment filing requires an ACTIVE registration for the applicant; exam window for non-SIE requires SIE satisfied; jurisdiction selection requires parent request in DRAFT or DEFICIENT"
    error_id: ERR_REFERENTIAL_VIOLATION
    http_status: 422
    applies_to: "POST /registration-desk/affiliation-requests, POST /registration-desk/amendment-filings, POST /registration-desk/exam-windows, POST /registration-desk/jurisdiction-selections"
  - priority: 12
    category: business_fiscal
    check: "renewal invoice creation requires the registration ACTIVE and no existing invoice for (registration_request_id, cycle_year); payment amount sanity: payable_total_cents >= 0"
    error_id: ERR_FISCAL_VIOLATION
    http_status: 422
    applies_to: "POST /registration-desk/renewal-invoices, POST /registration-desk/renewal-invoices/{id}/pay"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving; default clock fixed) ---
  - method: POST
    path: /registration-desk/_clock/set_current_utc
    description: "Sets the server logical clock. Before any call to this endpoint the clock reads exactly 2026-05-01T00:00:00Z (the fixed startup default) and never falls back to wall-clock time."
    roles: [SystemOperator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "evaluates time-based system transitions: ExamRequirement PASSED->EXPIRED sweeps, RegistrationRequest APPROVED->ACTIVE day rollover"

  # --- firms ---
  - method: POST
    path: /registration-desk/firms
    description: "Create a member firm record"
    roles: [SystemOperator]
    code: 201
    input: [crd_number, legal_name]
    output: Firm
    side_effects: []
  - method: GET
    path: /registration-desk/firms/{id}
    description: "Read one firm including computed open_inquiry_count"
    roles: [SystemOperator, ComplianceOfficer, RegistrationPrincipal, FinanceClerk, Regulator]
    code: 200
    input: []
    output: Firm
    side_effects: []
  - method: GET
    path: /registration-desk/firms
    description: "List firms, paginated"
    roles: [SystemOperator, ComplianceOfficer, RegistrationPrincipal, FinanceClerk, Regulator]
    code: 200
    input: ["limit?", "offset?"]
    output: Firm[]
    side_effects: []
  - method: PATCH
    path: /registration-desk/firms/{id}
    description: "Update firm configuration; deadline_basis accepted here (CALENDAR default, REGULATORY optional) and applies prospectively to deadlines computed after the patch"
    roles: [SystemOperator]
    code: 200
    input: ["legal_name?", "deadline_basis?", "status?"]
    output: Firm
    side_effects:
      - "increments Firm.version by 1"

  # --- applicants ---
  - method: POST
    path: /registration-desk/applicants
    description: "Create an individual applicant record"
    roles: [RegistrationPrincipal]
    code: 201
    input: [crd_number, full_name, date_of_birth]
    output: IndividualApplicant
    side_effects: []
  - method: GET
    path: /registration-desk/applicants/{id}
    description: "Read one applicant including computed fingerprint_required"
    roles: [SystemOperator, ComplianceOfficer, RegistrationPrincipal, Regulator]
    code: 200
    input: []
    output: IndividualApplicant
    side_effects: []
  - method: GET
    path: /registration-desk/applicants
    description: "List applicants, paginated"
    roles: [SystemOperator, ComplianceOfficer, RegistrationPrincipal, Regulator]
    code: 200
    input: ["limit?", "offset?"]
    output: IndividualApplicant[]
    side_effects: []

  # --- registration requests ---
  - method: POST
    path: /registration-desk/registration-requests
    description: "Create a registration request (U4) in DRAFT"
    roles: [RegistrationPrincipal]
    code: 201
    input: [applicant_id, firm_id, registration_category]
    output: RegistrationRequest
    side_effects: []
  - method: GET
    path: /registration-desk/registration-requests/{id}
    description: "Read one registration request"
    roles: [SystemOperator, ComplianceOfficer, RegistrationPrincipal, Regulator]
    code: 200
    input: []
    output: RegistrationRequest
    side_effects: []
  - method: GET
    path: /registration-desk/registration-requests
    description: "List registration requests with optional filters"
    roles: [SystemOperator, ComplianceOfficer, RegistrationPrincipal, Regulator]
    code: 200
    input: ["limit?", "offset?", "applicant_id?", "firm_id?", "status?"]
    output: RegistrationRequest[]
    side_effects: []
  - method: PATCH
    path: /registration-desk/registration-requests/{id}
    description: "Amend editable fields (registration_category) while DRAFT or DEFICIENT; OCC-guarded"
    roles: [RegistrationPrincipal]
    code: 200
    input: ["registration_category?", expected_registration_request_version]
    output: RegistrationRequest
    side_effects:
      - "increments RegistrationRequest.version by 1"
  - method: POST
    path: /registration-desk/registration-requests/{id}/submit
    description: "Submit a DRAFT or DEFICIENT request"
    roles: [RegistrationPrincipal]
    code: 200
    input: []
    output: RegistrationRequest
    side_effects:
      - "DRAFT-or-DEFICIENT -> SUBMITTED transition with ExamRequirement creation on first submit"
      - "records submitter_user_id (the X-User-ID) for segregation-of-duties checks"
  - method: POST
    path: /registration-desk/registration-requests/{id}/approve
    description: "Approve a SUBMITTED request (regulatory gate applies)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RegistrationRequest
    side_effects:
      - "SUBMITTED -> APPROVED; jurisdiction selections flip to APPROVED; approved_at stamped"
  - method: POST
    path: /registration-desk/registration-requests/{id}/return-deficient
    description: "Return a SUBMITTED request to DEFICIENT; third return auto-withdraws"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RegistrationRequest
    side_effects:
      - "SUBMITTED -> DEFICIENT or WITHDRAWN per deficiency_auto_withdraw"
  - method: POST
    path: /registration-desk/registration-requests/{id}/deny
    description: "Deny a SUBMITTED request (requires a FLAGGED disclosure or an EXPIRED exam requirement)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RegistrationRequest
    side_effects:
      - "SUBMITTED -> DENIED; jurisdiction selections flip to REJECTED"
  - method: POST
    path: /registration-desk/registration-requests/{id}/withdraw
    description: "Withdraw a request in DRAFT, DEFICIENT, or SUBMITTED"
    roles: [RegistrationPrincipal]
    code: 200
    input: []
    output: RegistrationRequest
    side_effects:
      - "-> WITHDRAWN; selections RELINQUISHED; ISSUED invoices VOID"
  - method: GET
    path: /registration-desk/registration-requests/{id}/renewal-estimate
    description: "Provisional renewal fee estimate for a cycle year (not persisted)"
    roles: [RegistrationPrincipal, FinanceClerk, ComplianceOfficer]
    code: 200
    input: [cycle_year]
    output: "{ estimated_total_cents: integer, jurisdiction_fee_cents: integer, base_fee_cents: integer, late_surcharge_cents: integer }"
    side_effects: []

