              payload: { name: "Owner Lot", site_type: "CAMPUS", capacity: 3, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_own2_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_own2_id}", vin: "VIN3160V1", model: "Santro", capacity_seats: 5, next_service_miles: 50000 }
