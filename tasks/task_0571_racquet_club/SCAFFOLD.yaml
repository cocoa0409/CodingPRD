# =============================================================================
# Task 0571 — Tennis & Pickleball Club Management (racquet-club)
# Expert difficulty scaffold (§1.0–§1.7)
# =============================================================================

scenario: |
  571. Tennis & Pickleball Club Management: court inventory & reservation (indoor/outdoor),
  membership & court-time package, league/ladder & round-robin, lesson/clinic & pro scheduling,
  ball-machine & guest fee, tournament bracket & seeding, recurring billing & freeze, pro-shop stringing

domain_name: racquet-club
api_prefix: /racquet

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing        # overlapping court/pro time intervals with gap rules
  secondary_archetype: ledger_reconciliation   # forward-looking vs chronological subscription billing
  complexity_layers:
    - optimistic_concurrency                    # OCC on parent version for change-plan / reschedule
    - cascading_side_effects                    # no-show→suspend→freeze; maintenance→cancel→credit-refund
    - dual_variant_calculation                  # provisional vs final charge; forward vs chronological billing
    - rate_threshold_triggers                   # no-show suspension threshold; clinic capacity boundary

  entity_topology: flat                         # peer entities linked by FK; no nested URL ownership
  state_machine_shape: cyclic                   # Subscription ACTIVE<->FROZEN, Court AVAILABLE<->MAINTENANCE; Reservation branches
  relationship_patterns:
    - one_to_many                               # Court -> Reservations, Lesson -> Enrollments
    - many_to_many                              # Member <-> Lesson via Enrollment; Member <-> Competition via Participant
    - self_referential                          # Participant bracket advancement references sibling participants
  role_model: peer_roles                        # Member owns bookings, Pro owns lessons, FrontDesk operates
  consistency_model: immediate

  entity_count: 11
  state_machine_count: 8
  calculation_count: 9
  validation_layers: 10
  endpoint_count: 58
  error_code_count: 26
  role_count: 3

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Court
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Court label, e.g. 'Indoor 1'" }
      - { name: surface, type: enum, source: input, description: "Playing surface", constraints: "HARD | CLAY | GRASS" }
      - { name: location_type, type: enum, source: input, description: "Indoor or outdoor court", constraints: "INDOOR | OUTDOOR" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Cash rate per booked hour, integer cents", constraints: ">= 0" }
      - { name: has_ball_machine, type: boolean, source: input, description: "Whether a ball machine is available on this court", default: false }
      - { name: ball_machine_fee_cents, type: integer, source: input, description: "Flat fee charged per reservation that uses the ball machine", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", default: AVAILABLE, constraints: "AVAILABLE | MAINTENANCE | RETIRED" }

  - name: MembershipPlan
    parent: null
    common_fields: true
    fields:
