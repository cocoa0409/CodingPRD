      - name: body_foreign_keys_are_validated_in_declaration_order_left_to_right
        claim_type: foreign_key_integrity
        grounds:
          - validations[5]
          - entities.CourseShell.fields.term_id
          - entities.CourseShell.fields.owner_person_id
          - endpoints.GET_/course-shells
        distinguishing_aspect: "Flat topology means every relationship is a body FK. With BOTH term_id and owner_person_id unknown the response must be ERR_TERM_NOT_FOUND, because §1.4 priority 5 validates body FKs in the order §1.5 declares them — an implementation validating owner first answers ERR_PERSON_NOT_FOUND."
        test_recipe:
          setup:
            - "One PLANNING term and one FACULTY person exist; the unknown ids are well-formed UUIDs."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "F-5006", full_name: "Frances Allen", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
          trigger:
            - call: "POST /course-shells"
              payload: { term_id: "00000000-0000-4000-8000-0000000000f1", owner_person_id: "00000000-0000-4000-8000-0000000000f2", sis_section_code: "PHY100-01", shell_type: "OFFICIAL" }
              as: LmsAdmin
              captures: { err_both: $.data.error_id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "00000000-0000-4000-8000-0000000000f2", sis_section_code: "PHY100-01", shell_type: "OFFICIAL" }
              as: LmsAdmin
              captures: { err_person: $.data.error_id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "PHY100-01", shell_type: "OFFICIAL" }
              as: LmsAdmin
              captures: { shell_id: $.data.id, back_term: $.data.term_id, back_owner: $.data.owner_person_id }
            - call: "GET /course-shells"
              payload: { owner_person_id: "${prof_id}" }
              as: LmsAdmin
              captures: { first_shell: "$.data[0].id" }
          assert:
            - "${err_both} == ERR_TERM_NOT_FOUND at HTTP 404 — term_id is declared first in POST /course-shells input, so it is checked first"
            - "${err_person} == ERR_PERSON_NOT_FOUND once term_id resolves"
            - "the third call returns 201 with ${back_term} == ${term_id} and ${back_owner} == ${prof_id} — the link is stored, not merely validated"
            - "${first_shell} == ${shell_id} — GET /course-shells?owner_person_id gives the FK its reverse-reachability path"

  # ===========================================================================
  # 2. State Machines  (state_machine_shape: parallel)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: newly_created_rows_start_in_their_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.CourseShell.provisioning_state.initial_state
          - state_machines.ToolIntegration.approval_state.initial_state
          - state_machines.ToolPlacement.placement_state.initial_state
          - state_machines.Enrollment.enrollment_state.initial_state
        distinguishing_aspect: "Four machines with four different initial states, and ToolIntegration starts THREE dimensions at once (approval_state DRAFT plus both review dimensions PENDING). A create that jumps a row straight to a usable state — e.g. a shell born PROVISIONED — fails here."
        test_recipe:
          setup:
            - "Term 2026FA is IN_SESSION with one FACULTY owner and one STUDENT."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
            - call: "POST /people"
              payload: { sis_person_id: "F-6001", full_name: "Edsger Dijkstra", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-6001", full_name: "Learner C", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { stud_id: $.data.id }
          trigger:
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "CS100-01", shell_type: "OFFICIAL", base_seat_cap: 20 }
              as: LmsAdmin
              captures: { shell_id: $.data.id, shell_state: $.data.provisioning_state, ready: $.data.publish_readiness }
            - call: "POST /tool-integrations"
              payload: { vendor_name: "Beta", tool_name: "PollTool", tool_version: "2.1.0", data_sharing_scope: "NONE" }
              as: LmsAdmin
              captures: { tool_id: $.data.id, appr: $.data.approval_state, priv: $.data.privacy_review_state, acc: $.data.accessibility_review_state, risk: $.data.risk_score, appr_ver: $.data.approved_version }
            - call: "POST /course-shells/${shell_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /tool-placements"
              payload: { tool_id: "${tool_id}", shell_id: "${shell_id}" }
              as: LmsAdmin
              captures: { place_id: $.data.id, place_state: $.data.placement_state, pinned: $.data.pinned_tool_version }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${stud_id}", role: "STUDENT" }
              as: Registrar
              captures: { enr_state: $.data.enrollment_state, enr_v: $.data.version }
          assert:
            - "${shell_state} == REQUESTED with ${ready} == true — the declared initial state and the declared field default"
            - "${appr} == DRAFT, ${priv} == PENDING and ${acc} == PENDING — all three ToolIntegration dimensions start independently at their own initial states"
            - "${risk} == 0.00 and ${appr_ver} is null before any review"
            - "${place_state} == REQUESTED with ${pinned} null — a placement is not usable until ACTIVATE pins the version"
            - "${enr_state} == ACTIVE and ${enr_v} == 1"

      - name: enrollment_walks_its_full_declared_transition_set_including_the_drop_reinstate_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.Enrollment.enrollment_state.WAITLISTED_to_ACTIVE
          - state_machines.Enrollment.enrollment_state.ACTIVE_to_DROPPED
          - state_machines.Enrollment.enrollment_state.DROPPED_to_ACTIVE
          - state_machines.Enrollment.enrollment_state.ACTIVE_to_COMPLETED
        distinguishing_aspect: "All five Enrollment edges are exercised on one row in one chain, including the genuine cycle ACTIVE -> DROPPED -> ACTIVE. reinstatement_count must reach 1 and dropped_at must be non-null after the drop and null again after the reinstate, so the cycle is observable rather than idempotent."
        test_recipe:
          setup:
            - "Term 2026FA is IN_SESSION; the shell is PUBLISHED with base_seat_cap 2 so COMPLETE is legal (it requires PUBLISHED or CONCLUDED) and a promotion has a free seat."
            - "Student A takes the only occupied seat; Student B is enrolled with requested_state WAITLISTED so the queue is entered explicitly."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
            - call: "POST /people"
              payload: { sis_person_id: "F-6002", full_name: "Tony Hoare", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "CS200-01", shell_type: "OFFICIAL", base_seat_cap: 2 }
              as: LmsAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /course-shells/${shell_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /course-shells/${shell_id}/publish"
              payload: {}
              as: LmsAdmin
              captures: { shell_state: $.data.provisioning_state }
            - call: "POST /people"
              payload: { sis_person_id: "S-6002", full_name: "Learner D", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { pa: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-6003", full_name: "Learner E", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { pb: $.data.id }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${pa}", role: "STUDENT", requested_state: "ACTIVE" }
              as: Registrar
              captures: { ea: $.data.id }
            - call: "POST /enrollments"
              payload: { shell_id: "${shell_id}", person_id: "${pb}", role: "STUDENT", requested_state: "WAITLISTED" }
              as: Registrar
              captures: { eb: $.data.id, eb_state0: $.data.enrollment_state, eb_pos0: $.data.waitlist_position }
          trigger:
            - call: "POST /enrollments/${eb}/transitions"
              payload: { action: "PROMOTE" }
              as: Registrar
              captures: { eb_state1: $.data.enrollment_state, eb_pos1: $.data.waitlist_position }
            - call: "GET /course-shells/${shell_id}"
              payload: {}
              as: LmsAdmin
              captures: { active1: $.data.active_enrollment_count, wl1: $.data.waitlisted_enrollment_count, util1: $.data.seat_utilization_pct }
            - call: "POST /enrollments/${eb}/transitions"
              payload: { action: "DROP", reason: "student withdrew" }
              as: Registrar
              captures: { eb_state2: $.data.enrollment_state, dropped_at: $.data.dropped_at }
            - call: "POST /enrollments/${eb}/transitions"
              payload: { action: "REINSTATE" }
              as: Registrar
              captures: { eb_state3: $.data.enrollment_state, reinstated: $.data.reinstatement_count, dropped_at2: $.data.dropped_at }
            - call: "POST /enrollments/${eb}/transitions"
              payload: { action: "COMPLETE" }
              as: Registrar
              captures: { eb_state4: $.data.enrollment_state }
            - call: "GET /course-shells/${shell_id}"
              payload: {}
              as: LmsAdmin
              captures: { active2: $.data.active_enrollment_count, util2: $.data.seat_utilization_pct }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: Registrar
              captures: { headcount: $.data.total_active_enrollments }
          assert:
            - "${shell_state} == PUBLISHED; ${eb_state0} == WAITLISTED with ${eb_pos0} == 1"
            - "${eb_state1} == ACTIVE with ${eb_pos1} null; ${active1} == 2, ${wl1} == 0 and ${util1} == 100.00 (2 / 2)"
            - "${eb_state2} == DROPPED with ${dropped_at} == \"2026-08-01T00:00:00Z\" — stamped from the logical clock"
            - "${eb_state3} == ACTIVE with ${reinstated} == 1 and ${dropped_at2} null — the cycle closes and is counted"
            - "${eb_state4} == COMPLETED (the terminal state) and ${active2} == 1 with ${util2} == 50.00"
            - "${headcount} == 1 — Student A only; the COMPLETED row left the conserved headcount"

      - name: merge_request_rejects_every_trigger_that_is_not_declared_from_its_current_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.MergeRequest.merge_state
          - validations[11]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Three out-of-order triggers on one row: APPLY from DRAFT, APPLY from SUBMITTED and REVERSE from APPROVED. All three must return ERR_INVALID_STATE_TRANSITION at 409 and leave merge_state and the shells untouched, and the legal APPLY afterwards must still succeed — proving the rejections had no side effects."
        test_recipe:
          setup:
            - "Term 2026FA is IN_SESSION with two PROVISIONED OFFICIAL shells (no enrollments, so the merge moves zero rows)."
            - "adm-1 submits; adm-2 decides, satisfying segregation of duties."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
            - call: "POST /people"
              payload: { sis_person_id: "F-6003", full_name: "Niklaus Wirth", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "CS300-01", shell_type: "OFFICIAL", base_seat_cap: 30 }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { parent_id: $.data.id }
            - call: "POST /course-shells/${parent_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              as_user_id: "adm-1"
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "CS300-02", shell_type: "OFFICIAL", base_seat_cap: 30 }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { child_id: $.data.id }
            - call: "POST /course-shells/${child_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              as_user_id: "adm-1"
            - call: "GET /course-shells/${parent_id}"
              payload: {}
              as: LmsAdmin
              captures: { parent_v: $.data.version }
            - call: "POST /merge-requests"
              payload: { parent_shell_id: "${parent_id}", child_shell_id: "${child_id}", expected_parent_shell_version: "${parent_v}", justification: "cross-list" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { mr_id: $.data.id, mr_state0: $.data.merge_state }
          trigger:
            - call: "POST /merge-requests/${mr_id}/transitions"
              payload: { action: "APPLY" }
              as: LmsAdmin
              as_user_id: "adm-2"
              captures: { err_draft: $.data.error_id }
            - call: "GET /merge-requests/${mr_id}"
              payload: {}
              as: LmsAdmin
              captures: { mr_state1: $.data.merge_state, mr_v1: $.data.version }
            - call: "POST /merge-requests/${mr_id}/transitions"
              payload: { action: "SUBMIT" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { mr_state2: $.data.merge_state }
            - call: "POST /merge-requests/${mr_id}/transitions"
              payload: { action: "APPLY" }
              as: LmsAdmin
              as_user_id: "adm-2"
              captures: { err_submitted: $.data.error_id }
            - call: "POST /merge-requests/${mr_id}/transitions"
              payload: { action: "APPROVE" }
              as: LmsAdmin
              as_user_id: "adm-2"
              captures: { mr_state3: $.data.merge_state }
            - call: "POST /merge-requests/${mr_id}/transitions"
              payload: { action: "REVERSE" }
              as: LmsAdmin
              as_user_id: "adm-2"
              captures: { err_approved: $.data.error_id }
            - call: "POST /merge-requests/${mr_id}/transitions"
              payload: { action: "APPLY" }
              as: LmsAdmin
              as_user_id: "adm-2"
              captures: { mr_state4: $.data.merge_state, moved: $.data.moved_enrollment_count }
            - call: "GET /course-shells/${child_id}"
              payload: {}
              as: LmsAdmin
              captures: { child_state: $.data.provisioning_state }
          assert:
            - "${mr_state0} == DRAFT; ${err_draft} == ERR_INVALID_STATE_TRANSITION at HTTP 409 — DRAFT declares only SUBMIT"
            - "${mr_state1} == DRAFT and ${mr_v1} == 1 — a rejected transition bumps no version"
            - "${mr_state2} == SUBMITTED, then ${err_submitted} == ERR_INVALID_STATE_TRANSITION — APPLY may only follow APPROVE"
            - "${mr_state3} == APPROVED, then ${err_approved} == ERR_INVALID_STATE_TRANSITION — REVERSE may only follow APPLIED"
            - "${mr_state4} == APPLIED with ${moved} == 0 and ${child_state} == MERGED — the legal path still works after three rejections"

      - name: a_declined_merge_request_is_terminal_and_refuses_every_further_transition
        claim_type: terminal_state_lockdown
