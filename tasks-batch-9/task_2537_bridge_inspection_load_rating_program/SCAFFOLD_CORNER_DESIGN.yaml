      - name: load_rating_operating_and_inventory_variants_diverge
        excluded_because:
          difficulty_instance: load_rating_operating_vs_inventory_diverge
          rationale: "The two-variant rating formula, the divergent live-load factors and the posting decision taken from the operating factor while the posted limit comes from the inventory tonnage are the whole subject of that dual_variant_calc instance."

      - name: candidate_priority_score_variant_chosen_by_ranking_policy
        excluded_because:
          difficulty_instance: candidate_priority_condition_vs_risk_policy_diverge
          rationale: "Variant selection by ProgramCycle.ranking_policy, and the numeric divergence between CONDITION_BASED 43.41 and RISK_BASED 36.21 on identical condition data, are asserted there."

      - name: inspection_interval_nested_min_and_extension_ladder
        excluded_because:
          difficulty_instance: inspection_interval_nested_min_max_fracture_critical_extended
          rationale: "The nested min/max ladder over min_nbi_rating, year_built, adt, fracture_critical, scour_status and service_posture is exercised across three PATCH-driven recomputations by that combinatorial_formula instance."

      - name: permit_gross_weight_rounds_per_axle_before_summing
        excluded_because:
          difficulty_instance: permit_gross_weight_per_axle_rounding_order
          rationale: "The per-axle-then-sum rounding order (39.6 rather than 39.4) and the downstream permit rating factor are asserted there; repeating the arithmetic here would test the same constant set twice."

      - name: program_budget_identity_after_program_and_withdraw
        excluded_because:
          difficulty_instance: program_then_withdraw_restores_budget_identity
          rationale: "Reconciliation of authorized = reserve + committed + remaining across a program/withdraw round trip, including the counter bucket moves, is that compensating_invariant instance's entire assertion set."

