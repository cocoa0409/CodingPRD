      - name: aging_completion_day_boundary
        grounds:
          - validations[priority=8]
          - state_machines.InventoryLot.AGING_to_AVAILABLE
          - entities.InventoryLot.fields.aging_target_days
        distinguishing_aspect: |
          Distinct metric (elapsed aging days, not a weight count) reached through a distinct endpoint
          (POST /inventory-lots/{id}/complete-aging): at exactly aging_target_days elapsed (7 days, clock
          06-08) completion SUCCEEDS; one day short (clock 06-07) returns ERR_AGING_NOT_COMPLETE.
        test_recipe:
          setup:
            - "DRY_RIBEYE AGING lot, aging_started_at 2026-06-01, aging_target_days 7, OPERATIONAL locker."
            - "Clock advanced to exactly 2026-06-08 (7 days elapsed)."
