# =============================================================================
# §1.8 Scaffold Difficulty Design — Part 135 Air Charter Operations
# Test Targeting Index: 9 rules x >=2 instances = 22 instances.
# All numeric asserts were computed by hand from SCAFFOLD.yaml §1.3 constants.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: trip_quote_vs_final_price_diverge
        grounds:
          - calculations.quote_price
          - calculations.final_price
          - state_machines.TripRequest.DISPATCHED_to_COMPLETED
        distinguishing_aspect: |
          Dual variant on the TripRequest pricing domain: identical itinerary
          priced by the QUOTED variant (planned minutes, category rate card,
          discount+surcharge) yields 621000 cents while the FINAL variant
          (logged actuals, aircraft hourly rate, 60-min minimum, no
          discount/surcharge) yields 472000 cents for the same legs.
        test_recipe:
          setup:
            - "Owner (80%, no guarantee), LIGHT_JET aircraft rate 240000 on ops spec, one PIC crew, clock 2026-08-01T00:00:00Z"
            - "Trip dep 2026-08-10T10:00:00Z KLAX->KTEB, 2 pax, domestic; legs REV 120min + POS 30min; booked, paid in full (621000), confirmed, vetted, screened, dispatched"
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner A", contact_email: "a@x.com", revenue_share_pct: 80, guarantee_cents_per_block_min: 0 }, as: OpsAdmin, captures: { own_a: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_a}", tail_number: "N100AA", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_a: $.data.id } }
            - { call: "POST /charter/crew-members", payload: { name: "Pic One", base_icao: "KLAX", qualified_categories: ["LIGHT_JET"] }, as: OpsAdmin, captures: { crew_a: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust One", customer_email: "c1@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 2, international: false }, as: SalesAgent, captures: { trip_a: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_a}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 120, fuel_stop: false }, as: SalesAgent, captures: { leg_a1: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_a}", seq_no: 2, leg_type: "POSITIONING", origin_icao: "KTEB", destination_icao: "KLAX", block_minutes: 30, fuel_stop: false }, as: SalesAgent, captures: { leg_a2: $.data.id } }
            - { call: "POST /charter/trip-requests/${trip_a}/quote", payload: {}, as: SalesAgent, captures: { trip_a_q: $.data.quoted_total_cents, trip_a_v: $.data.version } }
            - { call: "POST /charter/trip-requests/${trip_a}/book", payload: { deposit_cents: 155250 }, as: SalesAgent, captures: { trip_a_v2: $.data.version } }
            - { call: "POST /charter/payments", payload: { trip_request_id: "${trip_a}", payment_type: "BALANCE", amount_cents: 465750 }, as: SalesAgent }
            - { call: "POST /charter/aircraft-assignments", payload: { trip_request_id: "${trip_a}", aircraft_id: "${ac_a}", expected_trip_request_version: "${trip_a_v2}" }, as: DispatchManager, captures: { asg_a: $.data.id } }
            - { call: "POST /charter/aircraft-assignments/${asg_a}/confirm", payload: {}, as: DispatchManager }
            - { call: "POST /charter/crew-assignments", payload: { trip_request_id: "${trip_a}", crew_member_id: "${crew_a}", duty_role: "PIC" }, as: DispatchManager, captures: { ca_a: $.data.id } }
            - { call: "POST /charter/crew-assignments/${ca_a}/vet", payload: {}, as: DispatchManager }
            - { call: "POST /charter/passengers", payload: { trip_request_id: "${trip_a}", full_name: "Pax One", date_of_birth: "1980-01-01" }, as: SalesAgent, captures: { pax_a1: $.data.id } }
            - { call: "POST /charter/passengers", payload: { trip_request_id: "${trip_a}", full_name: "Pax Two", date_of_birth: "1985-05-05" }, as: SalesAgent, captures: { pax_a2: $.data.id } }
            - { call: "POST /charter/passengers/${pax_a1}/screen", payload: { outcome: "CLEARED" }, as: ComplianceOfficer }
            - { call: "POST /charter/passengers/${pax_a2}/screen", payload: { outcome: "CLEARED" }, as: ComplianceOfficer }
            - { call: "POST /charter/trip-requests/${trip_a}/dispatch", payload: {}, as: DispatchManager }
          trigger:
            - { call: "POST /charter/flight-logs", payload: { trip_request_id: "${trip_a}", quote_leg_id: "${leg_a1}", actual_block_minutes: 100, departed_at: "2026-08-10T10:00:00Z", arrived_at: "2026-08-10T11:40:00Z" }, as: CrewMember, as_user_id: "${crew_a}" }
            - { call: "POST /charter/flight-logs", payload: { trip_request_id: "${trip_a}", quote_leg_id: "${leg_a2}", actual_block_minutes: 30, departed_at: "2026-08-10T12:00:00Z", arrived_at: "2026-08-10T12:30:00Z" }, as: CrewMember, as_user_id: "${crew_a}" }
            - { call: "GET /charter/trip-requests/${trip_a}", payload: {}, as: OpsAdmin, captures: { trip_a_final: $.data.final_total_cents, trip_a_status: $.data.status } }
            - { call: "GET /charter/aircraft-owners/${own_a}/owner-statements", payload: {}, as: OpsAdmin, captures: { stmt_gross: "$.data[0].gross_cents", stmt_share: "$.data[0].owner_share_cents", stmt_retained: "$.data[0].operator_retained_cents" } }
          assert:
            - "TripRequest.${trip_a}.quoted_total_cents == 621000 (QUOTED variant: 500000+75000 legs, surcharge 46000)"
            - "TripRequest.${trip_a}.final_total_cents == 472000 (FINAL variant: max(100,60)*240000/60=400000 + 30*240000*0.6/60=72000; no discount/surcharge)"
            - "TripRequest.${trip_a}.status == COMPLETED"
            - "OwnerStatement[0].gross_cents == 472000 and owner_share_cents == 377600 and operator_retained_cents == 94400"

      - name: owner_standard_vs_guaranteed_diverge
        grounds:
          - calculations.owner_statement
          - entities.AircraftOwner.fields.guarantee_cents_per_block_min
        distinguishing_aspect: |
          Dual variant on the OwnerStatement payout domain (different entity
          domain than trip pricing): identical trip economics (gross 472000,
          130 logged minutes) pay the STANDARD owner 377600 (80% of gross) but
          the GUARANTEED owner 520000 (4000/min x 130min floor binds), proving
          max(standard, guarantee) selects different variants per owner config.
        test_recipe:
          setup:
            - "Owner S (80%, guarantee 0) with aircraft N200SS; Owner G (80%, guarantee 4000/min) with aircraft N300GG; same LIGHT_JET rate 240000; one shared PIC; clock 2026-08-01T00:00:00Z"
            - "Two identical trips (legs REV 120 + POS 30, pax 0, domestic), each booked/paid/confirmed/vetted/dispatched on its own aircraft; actuals 100 + 30 minutes"
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner S", contact_email: "s@x.com", revenue_share_pct: 80, guarantee_cents_per_block_min: 0 }, as: OpsAdmin, captures: { own_s: $.data.id } }
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner G", contact_email: "g@x.com", revenue_share_pct: 80, guarantee_cents_per_block_min: 4000 }, as: OpsAdmin, captures: { own_g: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_s}", tail_number: "N200SS", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_s: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_g}", tail_number: "N300GG", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_g: $.data.id } }
            - { call: "POST /charter/crew-members", payload: { name: "Pic Two", base_icao: "KLAX", qualified_categories: ["LIGHT_JET"] }, as: OpsAdmin, captures: { crew_b: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust S", customer_email: "cs@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_s: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_s}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 120, fuel_stop: false }, as: SalesAgent, captures: { leg_s1: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_s}", seq_no: 2, leg_type: "POSITIONING", origin_icao: "KTEB", destination_icao: "KLAX", block_minutes: 30, fuel_stop: false }, as: SalesAgent, captures: { leg_s2: $.data.id } }
            - { call: "POST /charter/trip-requests/${trip_s}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_s}/book", payload: { deposit_cents: 155250 }, as: SalesAgent, captures: { trip_s_v: $.data.version } }
            - { call: "POST /charter/payments", payload: { trip_request_id: "${trip_s}", payment_type: "BALANCE", amount_cents: 465750 }, as: SalesAgent }
            - { call: "POST /charter/aircraft-assignments", payload: { trip_request_id: "${trip_s}", aircraft_id: "${ac_s}", expected_trip_request_version: "${trip_s_v}" }, as: DispatchManager, captures: { asg_s: $.data.id } }
            - { call: "POST /charter/aircraft-assignments/${asg_s}/confirm", payload: {}, as: DispatchManager }
            - { call: "POST /charter/crew-assignments", payload: { trip_request_id: "${trip_s}", crew_member_id: "${crew_b}", duty_role: "PIC" }, as: DispatchManager, captures: { ca_s: $.data.id } }
            - { call: "POST /charter/crew-assignments/${ca_s}/vet", payload: {}, as: DispatchManager }
            - { call: "POST /charter/trip-requests/${trip_s}/dispatch", payload: {}, as: DispatchManager }
            - { call: "POST /charter/flight-logs", payload: { trip_request_id: "${trip_s}", quote_leg_id: "${leg_s1}", actual_block_minutes: 100, departed_at: "2026-08-10T10:00:00Z", arrived_at: "2026-08-10T11:40:00Z" }, as: CrewMember, as_user_id: "${crew_b}" }
            - { call: "POST /charter/flight-logs", payload: { trip_request_id: "${trip_s}", quote_leg_id: "${leg_s2}", actual_block_minutes: 30, departed_at: "2026-08-10T12:00:00Z", arrived_at: "2026-08-10T12:30:00Z" }, as: CrewMember, as_user_id: "${crew_b}" }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust G", customer_email: "cg@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-12T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_g: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_g}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 120, fuel_stop: false }, as: SalesAgent, captures: { leg_g1: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_g}", seq_no: 2, leg_type: "POSITIONING", origin_icao: "KTEB", destination_icao: "KLAX", block_minutes: 30, fuel_stop: false }, as: SalesAgent, captures: { leg_g2: $.data.id } }
            - { call: "POST /charter/trip-requests/${trip_g}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_g}/book", payload: { deposit_cents: 155250 }, as: SalesAgent, captures: { trip_g_v: $.data.version } }
            - { call: "POST /charter/payments", payload: { trip_request_id: "${trip_g}", payment_type: "BALANCE", amount_cents: 465750 }, as: SalesAgent }
            - { call: "POST /charter/aircraft-assignments", payload: { trip_request_id: "${trip_g}", aircraft_id: "${ac_g}", expected_trip_request_version: "${trip_g_v}" }, as: DispatchManager, captures: { asg_g: $.data.id } }
            - { call: "POST /charter/aircraft-assignments/${asg_g}/confirm", payload: {}, as: DispatchManager }
            - { call: "POST /charter/crew-assignments", payload: { trip_request_id: "${trip_g}", crew_member_id: "${crew_b}", duty_role: "PIC" }, as: DispatchManager, captures: { ca_g: $.data.id } }
            - { call: "POST /charter/crew-assignments/${ca_g}/vet", payload: {}, as: DispatchManager }
            - { call: "POST /charter/trip-requests/${trip_g}/dispatch", payload: {}, as: DispatchManager }
            - { call: "POST /charter/flight-logs", payload: { trip_request_id: "${trip_g}", quote_leg_id: "${leg_g1}", actual_block_minutes: 100, departed_at: "2026-08-12T10:00:00Z", arrived_at: "2026-08-12T11:40:00Z" }, as: CrewMember, as_user_id: "${crew_b}" }
            - { call: "POST /charter/flight-logs", payload: { trip_request_id: "${trip_g}", quote_leg_id: "${leg_g2}", actual_block_minutes: 30, departed_at: "2026-08-12T12:00:00Z", arrived_at: "2026-08-12T12:30:00Z" }, as: CrewMember, as_user_id: "${crew_b}" }
          trigger:
            - { call: "GET /charter/aircraft-owners/${own_s}/owner-statements", payload: {}, as: OpsAdmin, captures: { s_share: "$.data[0].owner_share_cents", s_std: "$.data[0].standard_share_cents", s_floor: "$.data[0].guarantee_floor_cents" } }
            - { call: "GET /charter/aircraft-owners/${own_g}/owner-statements", payload: {}, as: OpsAdmin, captures: { g_share: "$.data[0].owner_share_cents", g_std: "$.data[0].standard_share_cents", g_floor: "$.data[0].guarantee_floor_cents", g_ret: "$.data[0].operator_retained_cents" } }
          assert:
            - "Owner S statement: standard_share_cents == 377600, guarantee_floor_cents == 0, owner_share_cents == 377600"
            - "Owner G statement: standard_share_cents == 377600, guarantee_floor_cents == 520000 (4000 x 130 logged minutes), owner_share_cents == 520000"
            - "Owner G operator_retained_cents == -48000 (residual goes negative when the guarantee binds)"
            - "Same gross 472000, different payout: 520000 != 377600"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: quote_per_leg_rounding_pinned
        grounds:
          - calculations.quote_price
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-leg-then-sum.
          Legs 37+37min REVENUE and 10min POSITIONING on LIGHT_JET give
          154167+154167+25000 = 333334 legs_total and total 360001; the
          forbidden sum-then-round order would give legs_total 333333 and
          total 360000 — a 1-cent divergence the test pins.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; LIGHT_JET trip dep 2026-08-20T10:00:00Z, 1 pax, domestic"
            - "Legs: REV 37min, REV 37min, POS 10min, no fuel stops"
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust R", customer_email: "r@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-20T10:00:00Z", passenger_count: 1, international: false }, as: SalesAgent, captures: { trip_r: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_r}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KPHX", block_minutes: 37, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_r}", seq_no: 2, leg_type: "REVENUE", origin_icao: "KPHX", destination_icao: "KTEB", block_minutes: 37, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_r}", seq_no: 3, leg_type: "POSITIONING", origin_icao: "KTEB", destination_icao: "KLAX", block_minutes: 10, fuel_stop: false }, as: SalesAgent }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_r}/quote", payload: {}, as: SalesAgent, captures: { q_total: $.data.quoted_total_cents, q_dep: $.data.deposit_required_cents } }
          assert:
            - "TripRequest.${trip_r}.quoted_total_cents == 360001 (legs 333334 + surcharge 26667)"
            - "TripRequest.${trip_r}.deposit_required_cents == 90000 (round_half_up(360001 x 0.25) = round_half_up(90000.25))"

      - name: cancellation_refund_three_input_tier
        grounds:
          - calculations.cancellation_refund
          - state_machines.TripRequest.BOOKED_to_CANCELLED
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: refund depends on
          hours_before (tiered 10/50/100%), reason (CUSTOMER vs WEATHER/OPS
          waiver), and collected_cents (base). At 30h before departure with
          reason CUSTOMER the 50% tier applies to collected 2052000.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; trip dep 2026-08-04T00:00:00Z, LIGHT_JET, single REV leg 480min, domestic, 0 pax"
            - "Quoted 2052000 (legs 2000000, 5% discount 100000, 8% surcharge on 1900000 = 152000); booked deposit 513000 + balance 1539000 -> collected 2052000"
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust C", customer_email: "c@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-04T00:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_c: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_c}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 480, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_c}/quote", payload: {}, as: SalesAgent, captures: { trip_c_q: $.data.quoted_total_cents } }
            - { call: "POST /charter/trip-requests/${trip_c}/book", payload: { deposit_cents: 513000 }, as: SalesAgent }
            - { call: "POST /charter/payments", payload: { trip_request_id: "${trip_c}", payment_type: "BALANCE", amount_cents: 1539000 }, as: SalesAgent }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T18:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_c}/cancel", payload: { reason: "CUSTOMER" }, as: SalesAgent, captures: { c_fee: $.data.cancellation_fee_cents, c_ref: $.data.refund_cents, c_posture: $.data.payment_posture } }
          assert:
            - "TripRequest.${trip_c}.cancellation_fee_cents == 1026000 (50% tier: 30h before departure, 24 <= 30 < 72)"
            - "TripRequest.${trip_c}.refund_cents == 1026000"
            - "TripRequest.${trip_c}.status == CANCELLED and payment_posture == REFUNDED_PARTIAL"

      - name: quote_discount_surcharge_order_pinned
        grounds:
          - calculations.quote_price
        distinguishing_aspect: |
          Mode (c) circular-looking evaluation order: the volume discount tier
          is keyed on legs_total, the fuel surcharge is computed on the
          DISCOUNTED legs_total, and the total includes both. Pinned order
          legs_total -> discount -> surcharge -> total yields 2052000 for a
          480min LIGHT_JET leg; the wrong order (surcharge on pre-discount)
          yields 2060000.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; LIGHT_JET trip dep 2026-08-15T10:00:00Z, 0 pax, domestic; single REV leg 480min (legs_total exactly 2000000, the >= tier1 boundary)"
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust D", customer_email: "d@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-15T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_d: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_d}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 480, fuel_stop: false }, as: SalesAgent }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_d}/quote", payload: {}, as: SalesAgent, captures: { d_total: $.data.quoted_total_cents, d_dep: $.data.deposit_required_cents } }
          assert:
            - "TripRequest.${trip_d}.quoted_total_cents == 2052000 (2000000 - 100000 discount + 152000 surcharge-on-discounted)"
            - "TripRequest.${trip_d}.deposit_required_cents == 513000"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: trip_request_requote_cycle
        grounds:
          - state_machines.TripRequest.QUOTED_to_QUOTE_DRAFT
          - state_machines.TripRequest.QUOTE_DRAFT_to_QUOTED
        distinguishing_aspect: |
          TripRequest is cyclic (QUOTED -> QUOTE_DRAFT -> QUOTED via requote)
          AND carries a parallel derived axis: payment_posture stays UNPAID
          throughout the cycle, proving the two state dimensions evolve
          independently on the same entity.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; LIGHT_JET trip dep 2026-08-20T10:00:00Z, 0 pax, domestic; leg REV 60min; quoted once (270000)"
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust Q", customer_email: "q@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-20T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_q: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_q}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_q}/quote", payload: {}, as: SalesAgent, captures: { trip_q_v1: $.data.version, trip_q_q1: $.data.quoted_total_cents } }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_q}/requote", payload: { expected_trip_request_version: "${trip_q_v1}" }, as: SalesAgent, captures: { trip_q_st: $.data.status, trip_q_v2: $.data.version } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_q}", seq_no: 2, leg_type: "POSITIONING", origin_icao: "KTEB", destination_icao: "KLAX", block_minutes: 30, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_q}/quote", payload: {}, as: SalesAgent, captures: { trip_q_q2: $.data.quoted_total_cents, trip_q_posture: $.data.payment_posture } }
          assert:
            - "First quote: quoted_total_cents == 270000 (250000 legs + 20000 surcharge)"
            - "After requote: status == QUOTE_DRAFT and quoted_total_cents is null (cleared) and version incremented"
            - "After re-quote: status == QUOTED and quoted_total_cents == 351000 (325000 legs + 26000 surcharge)"
            - "payment_posture == UNPAID throughout the cycle (parallel axis untouched)"

      - name: crew_assignment_revet_loop
        grounds:
          - state_machines.CrewAssignment.PROPOSED_to_VETTED
          - state_machines.CrewAssignment.VETTED_to_PROPOSED
        distinguishing_aspect: |
          CrewAssignment is cyclic on a different entity than TripRequest:
          PROPOSED -> VETTED, then an itinerary change (leg added after
          requote) auto-reverts it VETTED -> PROPOSED, and a second vet closes
          the loop with a recomputed planned_duty_minutes (180 -> 240).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; crew qualified LIGHT_JET; trip dep 2026-08-10T10:00:00Z, leg REV 120, quoted"
            - "PIC assigned and vetted (duty 180 legal, no rest conflicts) -> VETTED"
          setup_api_calls:
            - { call: "POST /charter/crew-members", payload: { name: "Pic Loop", base_icao: "KLAX", qualified_categories: ["LIGHT_JET"] }, as: OpsAdmin, captures: { crew_l: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust L", customer_email: "l@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_l: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_l}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 120, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_l}/quote", payload: {}, as: SalesAgent, captures: { trip_l_v1: $.data.version } }
            - { call: "POST /charter/crew-assignments", payload: { trip_request_id: "${trip_l}", crew_member_id: "${crew_l}", duty_role: "PIC" }, as: DispatchManager, captures: { ca_l: $.data.id } }
            - { call: "POST /charter/crew-assignments/${ca_l}/vet", payload: {}, as: DispatchManager, captures: { ca_l_st1: $.data.status, ca_l_duty1: $.data.planned_duty_minutes } }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_l}/requote", payload: { expected_trip_request_version: "${trip_l_v1}" }, as: SalesAgent }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_l}", seq_no: 2, leg_type: "POSITIONING", origin_icao: "KTEB", destination_icao: "KLAX", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "GET /charter/crew-assignments/${ca_l}", payload: {}, as: DispatchManager, captures: { ca_l_st2: $.data.status } }
            - { call: "POST /charter/trip-requests/${trip_l}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/crew-assignments/${ca_l}/vet", payload: {}, as: DispatchManager, captures: { ca_l_st3: $.data.status, ca_l_duty2: $.data.planned_duty_minutes } }
          assert:
            - "First vet: status == VETTED, planned_duty_minutes == 180 (120 block + 60 report/debrief)"
            - "After requote + leg add: CrewAssignment auto-reverted to PROPOSED (VETTED -> PROPOSED loop), duty_legal null"
            - "Second vet: status == VETTED, planned_duty_minutes == 240 (180 block + 60)"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: flight_log_final_leg_cascade
        grounds:
          - state_machines.TripRequest.DISPATCHED_to_COMPLETED
          - state_machines.Aircraft.IN_TRIP_to_MAINTENANCE_HOLD
          - calculations.final_price
          - calculations.owner_statement
        distinguishing_aspect: |
          Depth-4 chain from the flight-log trigger: FlightLog posted ->
          TripRequest COMPLETED (bubble up) -> Aircraft accumulates minutes and
          flips to MAINTENANCE_HOLD (6000 >= 6000) -> the TENTATIVE assignment
          of a DIFFERENT trip on that aircraft auto-RELEASED. Plus a DRAFT
          OwnerStatement fans out from the completion link.
        test_recipe:
          setup:
            - "Owner (80%, no guarantee); aircraft N400HH LIGHT_JET rate 240000, initial 5940, next check due 6000, on ops spec; PIC crew; clock 2026-08-01T00:00:00Z"
            - "Trip1 dep 2026-08-10T10:00:00Z, leg REV 60, booked in full (270000), confirmed, vetted, dispatched"
            - "Trip2 dep 2026-08-12T10:00:00Z, leg REV 60, QUOTED, with a TENTATIVE assignment on the SAME aircraft"
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner H", contact_email: "h@x.com", revenue_share_pct: 80, guarantee_cents_per_block_min: 0 }, as: OpsAdmin, captures: { own_h: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_h}", tail_number: "N400HH", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 5940, next_check_due_minutes: 6000 }, as: OpsAdmin, captures: { ac_h: $.data.id } }
            - { call: "POST /charter/crew-members", payload: { name: "Pic H", base_icao: "KLAX", qualified_categories: ["LIGHT_JET"] }, as: OpsAdmin, captures: { crew_h: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust H1", customer_email: "h1@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_h1: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_h1}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent, captures: { leg_h1: $.data.id } }
            - { call: "POST /charter/trip-requests/${trip_h1}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_h1}/book", payload: { deposit_cents: 67500 }, as: SalesAgent, captures: { trip_h1_v: $.data.version } }
            - { call: "POST /charter/payments", payload: { trip_request_id: "${trip_h1}", payment_type: "BALANCE", amount_cents: 202500 }, as: SalesAgent }
            - { call: "POST /charter/aircraft-assignments", payload: { trip_request_id: "${trip_h1}", aircraft_id: "${ac_h}", expected_trip_request_version: "${trip_h1_v}" }, as: DispatchManager, captures: { asg_h1: $.data.id } }
            - { call: "POST /charter/aircraft-assignments/${asg_h1}/confirm", payload: {}, as: DispatchManager }
            - { call: "POST /charter/crew-assignments", payload: { trip_request_id: "${trip_h1}", crew_member_id: "${crew_h}", duty_role: "PIC" }, as: DispatchManager, captures: { ca_h1: $.data.id } }
            - { call: "POST /charter/crew-assignments/${ca_h1}/vet", payload: {}, as: DispatchManager }
            - { call: "POST /charter/trip-requests/${trip_h1}/dispatch", payload: {}, as: DispatchManager }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust H2", customer_email: "h2@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-12T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_h2: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_h2}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_h2}/quote", payload: {}, as: SalesAgent, captures: { trip_h2_v: $.data.version } }
            - { call: "POST /charter/aircraft-assignments", payload: { trip_request_id: "${trip_h2}", aircraft_id: "${ac_h}", expected_trip_request_version: "${trip_h2_v}" }, as: DispatchManager, captures: { asg_h2: $.data.id, asg_h2_st: $.data.status } }
          trigger:
            - { call: "POST /charter/flight-logs", payload: { trip_request_id: "${trip_h1}", quote_leg_id: "${leg_h1}", actual_block_minutes: 60, departed_at: "2026-08-10T10:00:00Z", arrived_at: "2026-08-10T11:00:00Z" }, as: CrewMember, as_user_id: "${crew_h}" }
            - { call: "GET /charter/trip-requests/${trip_h1}", payload: {}, as: OpsAdmin, captures: { h1_st: $.data.status, h1_final: $.data.final_total_cents } }
            - { call: "GET /charter/aircraft/${ac_h}", payload: {}, as: OpsAdmin, captures: { ac_h_st: $.data.status, ac_h_min: $.data.total_airframe_minutes } }
            - { call: "GET /charter/aircraft-assignments/${asg_h2}", payload: {}, as: OpsAdmin, captures: { asg_h2_st2: $.data.status } }
            - { call: "GET /charter/aircraft-owners/${own_h}/owner-statements", payload: {}, as: OpsAdmin, captures: { h_stmt_gross: "$.data[0].gross_cents", h_stmt_share: "$.data[0].owner_share_cents", h_stmt_st: "$.data[0].status" } }
          assert:
            - "Link 1-2: TripRequest.${trip_h1}.status == COMPLETED and final_total_cents == 240000 (60min at 240000/h)"
            - "Link 3: Aircraft.${ac_h}.total_airframe_minutes == 6000 and status == MAINTENANCE_HOLD (6000 >= 6000 check-due)"
            - "Link 4: AircraftAssignment.${asg_h2} (different trip, was TENTATIVE) == RELEASED"
            - "Fan-out: OwnerStatement created DRAFT with gross_cents == 240000 and owner_share_cents == 192000"

      - name: ground_aircraft_cascade
        grounds:
          - state_machines.Aircraft.AVAILABLE_to_GROUNDED
          - state_machines.AircraftAssignment.CONFIRMED_to_RELEASED
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (compliance ground, not a
          flight log): Aircraft -> GROUNDED forces its CONFIRMED assignment ->
          RELEASED, and that release forces the BOOKED TripRequest back to
          QUOTED (link 2 caused by link 1, link 3 caused by link 2).
        test_recipe:
          setup:
            - "Owner, aircraft N500GG LIGHT_JET ops-listed, PIC crew, clock 2026-08-01T00:00:00Z"
            - "Trip dep 2026-08-10T10:00:00Z, leg REV 60, quoted 270000, BOOKED (deposit 67500), assignment CONFIRMED"
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner G2", contact_email: "g2@x.com", revenue_share_pct: 80, guarantee_cents_per_block_min: 0 }, as: OpsAdmin, captures: { own_g2: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_g2}", tail_number: "N500GG", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_g2: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust G", customer_email: "g@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_gc: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_gc}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_gc}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_gc}/book", payload: { deposit_cents: 67500 }, as: SalesAgent, captures: { trip_gc_v: $.data.version } }
            - { call: "POST /charter/aircraft-assignments", payload: { trip_request_id: "${trip_gc}", aircraft_id: "${ac_g2}", expected_trip_request_version: "${trip_gc_v}" }, as: DispatchManager, captures: { asg_gc: $.data.id } }
            - { call: "POST /charter/aircraft-assignments/${asg_gc}/confirm", payload: {}, as: DispatchManager }
          trigger:
            - { call: "POST /charter/aircraft/${ac_g2}/ground", payload: {}, as: ComplianceOfficer, captures: { ac_g2_st: $.data.status } }
            - { call: "GET /charter/aircraft-assignments/${asg_gc}", payload: {}, as: OpsAdmin, captures: { asg_gc_st: $.data.status } }
            - { call: "GET /charter/trip-requests/${trip_gc}", payload: {}, as: OpsAdmin, captures: { trip_gc_st: $.data.status, trip_gc_q: $.data.quoted_total_cents } }
          assert:
            - "Link 1: Aircraft.${ac_g2}.status == GROUNDED"
            - "Link 2: AircraftAssignment.${asg_gc}.status == RELEASED (forced by the ground)"
            - "Link 3: TripRequest.${trip_gc}.status reverted BOOKED -> QUOTED with quoted_total_cents == 270000 retained"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispatch_state_error_beats_safety
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_TRIP_NOT_BOOKED]
          - errors[ERR_TSA_NOT_CLEARED]
        distinguishing_aspect: |
          Error-category pair state (p7) vs business_safety (p8): the trip is
          QUOTED (never booked) AND has a DENIED passenger; dispatch must
          return ERR_TRIP_NOT_BOOKED, not ERR_TSA_NOT_CLEARED.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; trip dep 2026-08-10T10:00:00Z, 1 pax, leg REV 60, QUOTED (never booked); passenger screened DENIED"
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust P", customer_email: "p@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 1, international: false }, as: SalesAgent, captures: { trip_p: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_p}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_p}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/passengers", payload: { trip_request_id: "${trip_p}", full_name: "Bad Pax", date_of_birth: "1970-01-01" }, as: SalesAgent, captures: { pax_p: $.data.id } }
            - { call: "POST /charter/passengers/${pax_p}/screen", payload: { outcome: "DENIED" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_p}/dispatch", payload: {}, as: DispatchManager, captures: { err_p: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_TRIP_NOT_BOOKED (state p7 beats business_safety p8; TSA failure is masked)"

      - name: dispatch_safety_beats_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_TSA_NOT_CLEARED]
          - errors[ERR_BALANCE_NOT_SETTLED]
        distinguishing_aspect: |
          Error-category pair business_safety (p8) vs business_fiscal (p11) —
          a different pair than state-vs-safety: the BOOKED trip has a DENIED
          passenger AND an unpaid balance; dispatch must return
          ERR_TSA_NOT_CLEARED, not ERR_BALANCE_NOT_SETTLED.
        test_recipe:
          setup:
            - "Owner + aircraft (initial 0, due 60000) + PIC crew; clock 2026-08-01T00:00:00Z"
            - "Trip dep 2026-08-10T10:00:00Z, 1 pax, leg REV 480 (quote 2052000); BOOKED with deposit 513000 only (collected < quoted -> fiscal fails); assignment CONFIRMED; PIC VETTED legal (duty 540); manifest count satisfied; the single passenger is DENIED"
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner F", contact_email: "f@x.com", revenue_share_pct: 80, guarantee_cents_per_block_min: 0 }, as: OpsAdmin, captures: { own_f: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_f}", tail_number: "N600FF", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_f: $.data.id } }
            - { call: "POST /charter/crew-members", payload: { name: "Pic F", base_icao: "KLAX", qualified_categories: ["LIGHT_JET"] }, as: OpsAdmin, captures: { crew_f: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust F", customer_email: "f@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 1, international: false }, as: SalesAgent, captures: { trip_f: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_f}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 480, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_f}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_f}/book", payload: { deposit_cents: 513000 }, as: SalesAgent, captures: { trip_f_v: $.data.version } }
            - { call: "POST /charter/aircraft-assignments", payload: { trip_request_id: "${trip_f}", aircraft_id: "${ac_f}", expected_trip_request_version: "${trip_f_v}" }, as: DispatchManager, captures: { asg_f: $.data.id } }
            - { call: "POST /charter/aircraft-assignments/${asg_f}/confirm", payload: {}, as: DispatchManager }
            - { call: "POST /charter/crew-assignments", payload: { trip_request_id: "${trip_f}", crew_member_id: "${crew_f}", duty_role: "PIC" }, as: DispatchManager, captures: { ca_f: $.data.id } }
            - { call: "POST /charter/crew-assignments/${ca_f}/vet", payload: {}, as: DispatchManager }
            - { call: "POST /charter/passengers", payload: { trip_request_id: "${trip_f}", full_name: "Bad Pax", date_of_birth: "1970-01-01" }, as: SalesAgent, captures: { pax_f: $.data.id } }
            - { call: "POST /charter/passengers/${pax_f}/screen", payload: { outcome: "DENIED" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_f}/dispatch", payload: {}, as: DispatchManager, captures: { err_f: $.data.error_id } }
          assert:
            - "HTTP 422 with error_id == ERR_TSA_NOT_CLEARED (business_safety p8 beats business_fiscal p11; the unpaid balance is masked)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: rest_gap_exactly_600_legal
        grounds:
          - calculations.crew_duty_legality
          - state_machines.CrewAssignment.PROPOSED_to_VETTED
        distinguishing_aspect: |
          Boundary on the rest-minutes metric via the vet endpoint: a 600.0-
          minute gap between duty intervals is legal (>=), while instance
          crew_rest_minimum_gap_violation shows 570 illegal — the comparison
          operator is the behavior under test.
