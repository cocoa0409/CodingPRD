  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: campaign_submit_gated_by_part_lifecycle_phase_out
        grounds:
          - state_machines.LastTimeBuyCampaign.DRAFT_to_SUBMITTED
          - entities.Part.fields.lifecycle_state
          - errors[ERR_PART_LIFECYCLE_INVALID]
        distinguishing_aspect: |
          Entity pair LastTimeBuyCampaign -> Part: the campaign is a perfectly valid DRAFT, yet
          its DRAFT -> SUBMITTED transition is refused while the Part is still ACTIVE and
          succeeds unchanged the moment the Part reaches PHASE_OUT. The campaign's own state
          never changed between the two attempts.
        test_recipe:
          setup:
            - "a dealer, an equipment model and one ACTIVE installed unit at build_revision 100"
            - "part GATE-1 in lifecycle_state ACTIVE with an ACTIVE applicability row (qty_per_unit 50) and a CURRENT 12-month INSTALLED_BASE_RATE forecast of 10 units"
            - "a DRAFT LastTimeBuyCampaign on that part"
          setup_api_calls:
            - call: "POST /aftermarket/dealers"
              payload: { dealer_code: "D-GATE", tier: "SILVER", region: "EU", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { d_id: $.data.id }
