          trigger:
            - call: "POST /host-agency/clients/${cli_id}/trust-ledger-entries"
              payload: { direction: "DEPOSIT", amount_cents: 300000, memo: "Initial deposit", expected_client_version: "${cli_v0}" }
              as: Advisor
              as_user_id: "${adv_id}"
              captures: { bal_1: $.data.balance_after_cents }
            - call: "POST /host-agency/clients/${cli_id}/trust-ledger-entries"
              payload: { direction: "DISBURSEMENT", amount_cents: 300000, memo: "Prepared against the pre-deposit read", expected_client_version: "${cli_v0}" }
              as: HostController
              as_user_id: "ctrl-1"
              captures: { err_stale_client: $.data.error_id }
            - call: "GET /host-agency/clients/${cli_id}"
              payload: {}
              as: HostController
              as_user_id: "ctrl-1"
              captures: { cli_v1: $.data.version, bal_read: $.data.trust_balance_cents }
            - call: "POST /host-agency/clients/${cli_id}/trust-ledger-entries"
              payload: { direction: "DISBURSEMENT", amount_cents: 120000, memo: "Supplier payment", expected_client_version: "${cli_v1}" }
              as: HostController
              as_user_id: "ctrl-1"
              captures: { bal_2: $.data.balance_after_cents }
          assert:
            - "FIRST LINE: bal_1 == 300000 and the client's version moved from ${cli_v0} to ${cli_v0} + 1"
            - "STALE BASELINE: HTTP 412 and err_stale_client == ERR_CLIENT_VERSION_STALE"
            - "the refusal wrote nothing: bal_read == 300000 and cli_v1 == ${cli_v0} + 1"
            - "FRESH BASELINE: bal_2 == 180000 and the client's version is ${cli_v0} + 2"
            - "GET /host-agency/clients/${cli_id}/trust-ledger-entries returns exactly 2 rows in created_at ASC order, with signed_amount_cents +300000 then -120000 and balance_after_cents 300000 then 180000"
            - "no TrustLedgerEntry carries a version field at all — the OCC token lives on the parent Client"

      - name: corner_supplier_outstanding_reconciles_across_the_receivable_lifecycle
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.supplier_commission_aging
          - entities.Supplier.fields.total_outstanding_cents
          - entities.Supplier.fields.aging_0_30_cents
        distinguishing_aspect: "One derived field is checked after every kind of source mutation: after creation of the receivable (confirm), after removal of a source row (cancel to WRITTEN_OFF), after partial collection (receipt moves the booking out of the cohort), after re-entry (a claim puts it back at expected minus received) and after final collection (resolution), returning to 0 with no residue."
        test_recipe:
          setup:
            - "Meridian Air with remit_terms_days 30, so a booking whose travel ends 2026-06-10 is due 2026-07-10 and is 22 days old at the default clock 2026-08-01."
            - "Dana Reyes ACTIVE in NY, accredited, one client with max_concurrent_trips 4."
            - "B1 gross 1000000 -> expected 100000 and B2 gross 500000 -> expected 50000, both travelling 2026-06-01..2026-06-10."
          setup_api_calls:
            - call: "POST /host-agency/split-schedules"
              payload: { name: "Standard 2026", tiers: [{ tier_level: 1, min_production_cents: 0, advisor_pct: 0.70 }, { tier_level: 2, min_production_cents: 5000000, advisor_pct: 0.80 }], platform_fee_tiers: [{ min_share_cents: 0, fee_pct: 0.05 }], chargeback_retention_pct: 0.10 }
