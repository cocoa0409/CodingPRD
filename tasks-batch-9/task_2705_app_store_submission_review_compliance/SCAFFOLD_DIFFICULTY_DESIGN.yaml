            - { call: "POST /submissions/${sub_b_id}/decision", payload: { outcome: "APPROVE" }, as: PlatformReviewer, as_user_id: "u-reviewer-1" }
            - { call: "GET /review-capacity-windows/${win_id}", payload: {}, as: PlatformPolicyAdmin, as_user_id: "u-policy-1" }
          assert:
            - "Observation 1 (pre-queue): slots_reserved == 0, slots_consumed == 0, slots_available == 5"
            - "Observation 2 (A queued): slots_reserved == 1, slots_consumed == 0, slots_available == 4; Submission.${sub_a_id}.review_window_id == ${win_id} and state == WAITING_FOR_REVIEW"
            - "Observation 3 (A withdrawn): slots_reserved == 0, slots_consumed == 0, slots_available == 5 — the exact pre-queue integer, not merely 'some free slot'"
            - "Submission.${sub_a_id}.state == DEVELOPER_WITHDRAWN and review_window_id == null"
            - "Observation 4 (B queued): slots_reserved == 1, slots_consumed == 0, slots_available == 4"
            - "Observation 5 (B claimed, IN_REVIEW): slots_reserved == 1, slots_consumed == 0, slots_available == 4 — a claim moves the submission's state but not the accounting bucket"
            - "Observation 6 (B approved): slots_reserved == 0, slots_consumed == 1, slots_available == 4 — consumption is permanent and is NOT compensated"
            - "slots_reserved + slots_consumed + slots_available == 5 at all six observations"
            - "Submission.${sub_b_id}.review_window_id == ${win_id} still after APPROVE (consumed slots keep their window pointer)"
            - "POST /submissions/${sub_a_id}/queue again -> 409 ERR_INVALID_SUBMISSION_STATE (DEVELOPER_WITHDRAWN is terminal; the restored slot cannot be re-reserved by the same build)"

      - name: expedite_credit_conservation_grant_consume_then_refund
        grounds:
          - calculations.expedite_credit_ledger
          - constants.EXPEDITE_CREDITS_PER_WINDOW
          - state_machines.ExpediteRequest.REQUESTED_to_GRANTED
          - state_machines.ExpediteRequest.GRANTED_to_CONSUMED
          - state_machines.ExpediteRequest.CONSUMED_to_REFUNDED
          - state_machines.ExpediteRequest.REQUESTED_to_REFUNDED
          - calculations.review_priority_score
          - errors.ERR_EXPEDITE_QUOTA_EXHAUSTED
          - endpoints.GET_/publisher-accounts/{id}/standing
        distinguishing_aspect: |
          GRANTED and CONSUMED both count against the 2-credit window while REQUESTED and REFUNDED never do,
          so a single withdrawal refunds a CONSUMED credit and a GRANTED credit but only voids the REQUESTED
          row, taking expedite_credits_remaining from 0 back to exactly 2 (not 1, not 3) and making a grant
          legal again on the next build.
        test_recipe:
          setup:
            - "PublisherAccount ACTIVE, brand new, so standing_score_rolling_365 == 100.00 (>= EXPEDITE_STANDING_FLOOR 60.00) and expedite_credits_remaining == 2"
            - "AppRecord IOS with one PASSED PRIVACY FeatureMapping; Submission A build 10 in PRE_REVIEW_PASSED"
            - "One OPEN ReviewCapacityWindow POOL_A capacity_slots 5 covering the clock; clock at its 2026-08-01T00:00:00Z default"
