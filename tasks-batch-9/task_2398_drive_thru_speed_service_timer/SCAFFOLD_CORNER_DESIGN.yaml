  # ==========================================================================
  # §1.9 SECTION 5 — ENDPOINTS
  # ==========================================================================
  - section: endpoints
    instances:

      - name: ep_restaurant_patch_updates_staffing_basis_and_budget
        claim_type: correct_result
        grounds:
          - endpoints[PATCH /drive-thru/restaurants/{restaurantId}]
          - entities.Restaurant.fields.staffing_basis
          - calculations.restaurant_rollup_recompute
        distinguishing_aspect: "The store PATCH is a standard-CRUD update that writes both mutable fields, re-derives the labor ledger against the NEW budget and bumps version by exactly one."
        test_recipe:
          setup:
            - "One unbounded VolumeTierPolicy band; one SINGLE-lane store created without staffing_basis (default OBSERVED) and labor_minutes_budget 300, with no children of any kind."
          setup_api_calls:
            - call: "POST /drive-thru/volume-tier-policies"
              payload: { tier: "TIER_1", cars_per_hour_floor: 0, target_relief_pct: 0.00, min_oot_count: 0, merge_award_bias: "ALTERNATE" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /drive-thru/restaurants"
              payload: { name: "Corner Patch Store", store_number: "C-2398-45", lane_config: "SINGLE", merge_slots_capacity: 1, labor_minutes_budget: 300 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { r_id: $.data.id, v0: $.data.version, basis0: $.data.staffing_basis, avail0: $.data.labor_minutes_available }
          trigger:
            - call: "PATCH /drive-thru/restaurants/${r_id}"
              payload: { staffing_basis: "FORECAST_ADJUSTED", labor_minutes_budget: 500 }
              as: Operator
              as_user_id: "${r_id}"
              captures: { basis1: $.data.staffing_basis, budget1: $.data.labor_minutes_budget, avail1: $.data.labor_minutes_available, v1: $.data.version, tier1: $.data.volume_tier, cphe: $.data.cars_per_hour_effective, posture: $.data.service_posture }
          assert:
            - "${basis0} == OBSERVED (declared default) and ${avail0} == 300"
            - "HTTP 200, ${basis1} == FORECAST_ADJUSTED and ${budget1} == 500"
            - "${avail1} == 500 — the recompute re-derives available from the new budget minus committed 0, it does not carry the old 300 forward"
            - "${v1} == ${v0} + 1 (exactly one bump for the one write)"
            - "${cphe} == 0.0 and ${tier1} == TIER_1 — FORECAST_ADJUSTED with no APPLIED override falls back to cars_per_hour_observed"
            - "${posture} == OPEN"
            - "GET /drive-thru/restaurants/${r_id} echoes staffing_basis FORECAST_ADJUSTED, labor_minutes_budget 500, version ${v1}"

