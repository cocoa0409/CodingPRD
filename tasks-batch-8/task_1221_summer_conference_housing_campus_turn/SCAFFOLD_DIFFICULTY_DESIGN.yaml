  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: group_cancel_cascade_depth3
        grounds:
          - state_machines.ConferenceGroup.CONFIRMED_to_CANCELLED
          - state_machines.StayAssignment.RESERVED_to_CANCELLED
          - state_machines.Room.RESERVED_to_RELEASED
          - entities.Building.fields.reserved_bed_count
        distinguishing_aspect: |
          Depth-3 chain from trigger POST /conference-groups/{id}/cancel: group
          CANCELLED -> each RESERVED StayAssignment CANCELLED (link 1) -> each
          emptied room RESERVED -> RELEASED (link 2, caused by the assignment
          cancellations, not by the cancel action directly) -> Building
