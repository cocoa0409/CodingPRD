      - name: occ_stale_enrollment_adjustment_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[enrollment-adjustment-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential adjustments carrying the same observed enrollment version: the first succeeds (version advances), the second is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["employer + ACTIVE program + employee + ACTIVE enrollment; version captured after accept"]
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
