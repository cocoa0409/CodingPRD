              as: BedManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: planner_exclusive_forecast_publish
        claim_type: role_denial
        grounds: ["roles[CapacityPlanner]"]
        distinguishing_aspect: "TransferCenterCoordinator cannot publish forecasts (CapacityPlanner-exclusive); HouseSupervisor cannot create them."
        test_recipe:
          setup: ["Clock at 00:00; facility with one PROVISIONAL forecast"]
