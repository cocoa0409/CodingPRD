      - name: subscription_cancel_with_balance_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_OUTSTANDING_BALANCE]", state_machines.Subscription.ACTIVE_to_CANCELLED]
        distinguishing_aspect: "Cancellation is fiscally gated: an unpaid invoice blocks it with ERR_OUTSTANDING_BALANCE; paying the invoice then allows the same cancel."
