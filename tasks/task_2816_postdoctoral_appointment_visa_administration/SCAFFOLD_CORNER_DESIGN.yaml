            - "${ua_norole} == ERR_UNAUTHENTICATED"
            - "${ua_nouser} == ERR_UNAUTHENTICATED"
            - "${ua_badrole} == ERR_UNAUTHENTICATED"
            - "${ua_clock} == ERR_UNAUTHENTICATED"
