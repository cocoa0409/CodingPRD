            - "${a_status} == VACATED and ${b_status} == CALCULATED  # only orders M and C are ENTERED"
            - "${t_status} == REGISTERED  # direction RESPONDING plus an ENTERED order whose origin_state_code equals other_state_code WI"
            - "${t_coid} == ${ordc}  # the sole ENTERED CURRENT_SUPPORT order"
            - "${t_cstate} == WI  # copied from the winning order's origin_state_code"
            - "${t_coid} != ${ordm}  # the MEDICAL_SUPPORT order is filtered out by order_type even though its effective_date 2026-05-01 is the smallest and its origin MN matches child_home_state_code"
            - "${t_coid} != ${orda}  # VACATED is not ENTERED"
            - "${t_coid} != ${ordb}  # CALCULATED is not ENTERED"
            - "${t_role} == RESPONDING  # registration stamps the case's interstate role"

      - name: ncp_risk_score_weight_vectors
        claim_type: weighted_scoring
        grounds:
          - "calculations.ncp_compliance_risk_score"
          - "entities.Participant.fields.enforcement_risk_score"
          - "entities.Participant.fields.compromise_risk_score"
        excluded_because:
          difficulty_instance: risk_variant_tier_flip_on_noncustodial_participant
          rationale: >
            That instance already computes both weight vectors over one identical
            component set and asserts each of the six components, both scores and both
            tier labels, including the 34 and 67 tier cut points. Re-testing the
            weighted sum here would duplicate it exactly.

      - name: interest_two_variants_diverge
        claim_type: variant_divergence
        grounds:
          - "calculations.arrears_interest_accrual.variants"
          - "entities.SupportCase.fields.interest_receivable_cents"
          - "entities.Participant.fields.total_arrears_certified_cents"
        excluded_because:
          difficulty_instance: interest_variant_divergence_on_case_ledger
          rationale: >
            That instance holds one charge set fixed and shows statutory_per_charge
            and aggregate_month_end returning different totals from the same input,
            which is precisely the divergence claim.

      - name: interest_variant_is_chosen_by_the_figure_being_reported
        claim_type: variant_selection
        grounds:
          - "calculations.arrears_interest_accrual.variant_usage"
          - "entities.EnforcementAction.fields.arrears_certified_snapshot_cents"
          - "entities.CompromiseOffer.fields.interest_due_snapshot_cents"
        excluded_because:
          difficulty_instance: interest_variant_divergence_on_case_ledger
          rationale: >
            That instance reads the same moment through four different surfaces - the
            case ledger, the certified participant total, the enforcement snapshot and
            the compromise snapshot - and asserts which variant each one is required
            to use, so the selection rule is already pinned end to end.

  # ====================================================================
  # Tables 4 and 5 - Validations. §1.4 declares 48 rules across 12 priority
  # bands; the two priority-pair conflicts are proven in
  # SCAFFOLD_DIFFICULTY_DESIGN.yaml and stubbed here. Every instance below
  # asserts the error_id AND the http_status from §1.6, and every boundary is
  # probed on both sides of the declared comparison operator.
  # ====================================================================
  - section: validations
    instances:

      - name: genetic_collection_window_and_rejection_ceiling
        claim_type: temporal_validation
        grounds:
          - "validations[priority 19]"
          - "validations[priority 30]"
          - "errors[ERR_COLLECTION_APPOINTMENT_NOT_REACHED]"
          - "errors[ERR_SPECIMEN_REJECTION_LIMIT]"
          - "state_machines.PaternityAction.GENETIC_ORDERED -> GENETIC_ORDERED"
        distinguishing_aspect: >
          Priority 19 carries two clauses that pull in opposite directions and both
          are probed at their exact boundary: the appointment must be set STRICTLY
          in the future (an appointment equal to the current clock is refused) while
          the collection may happen AT OR AFTER it (a collection at the exact
          appointment instant is accepted). Priority 30 then caps only the rejection
          self-loop at two: the third rejected specimen is refused while a clean
          collection is still accepted from the same GENETIC_ORDERED state, so the
          limit guards the loop rather than the state.
        test_recipe:
          setup:
            - "Empty database. Clock pinned to 2026-08-01T00:00:00Z."
            - "CP 200000 and NCP 300000, both VERIFIED_WAGE_RECORD; NCP LOCATED."
            - "DIRECT_APPLICATION case with a GENETIC_TEST PaternityAction in PENDING."
            - "SPECIMEN_REJECTION_LIMIT is 2 and the appointment will be set to 2026-08-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Halle Bergstrom", ssn_last4: "6201", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cpv1: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Soren Bergstrom", ssn_last4: "6202", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpv1: "$.data.id" }
            - call: "POST /child-support/participants/${ncpv1}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpv1}", noncustodial_party_id: "${ncpv1}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { casev1: "$.data.id" }
            - call: "POST /child-support/cases/${casev1}/paternity-actions"
              payload: { method: "GENETIC_TEST" }
              as: CaseWorker
              captures: { pav1: "$.data.id" }
          trigger:
            - call: "POST /child-support/paternity-actions/${pav1}/genetic-test-order"
              payload: { collection_appointment_at: "2026-08-01T00:00:00Z" }
              as: SupervisingAttorney
              captures: { e_appt_now: "$.data.error_id" }
            - call: "POST /child-support/paternity-actions/${pav1}/genetic-test-order"
              payload: { collection_appointment_at: "2026-08-10T00:00:00Z" }
              as: SupervisingAttorney
              captures: { v1_status: "$.data.status", v1_appt: "$.data.collection_appointment_at" }
            - call: "POST /child-support/paternity-actions/${pav1}/specimen-collection"
              payload: { chain_of_custody_ok: true }
              as: CaseWorker
              captures: { e_early: "$.data.error_id" }
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/paternity-actions/${pav1}/specimen-collection"
              payload: { chain_of_custody_ok: false }
              as: CaseWorker
              captures: { r1_status: "$.data.status", r1_count: "$.data.specimen_rejection_count" }
            - call: "POST /child-support/paternity-actions/${pav1}/specimen-collection"
              payload: { chain_of_custody_ok: false }
              as: CaseWorker
              captures: { r2_count: "$.data.specimen_rejection_count" }
            - call: "POST /child-support/paternity-actions/${pav1}/specimen-collection"
              payload: { chain_of_custody_ok: false }
              as: CaseWorker
              captures: { e_limit: "$.data.error_id" }
            - call: "POST /child-support/paternity-actions/${pav1}/specimen-collection"
              payload: { chain_of_custody_ok: true }
              as: CaseWorker
              captures: { ok_status: "$.data.status", ok_at: "$.data.specimen_collected_at", ok_count: "$.data.specimen_rejection_count" }
          assert:
            - "HTTP 409 and ${e_appt_now} == ERR_COLLECTION_APPOINTMENT_NOT_REACHED  # 2026-08-01T00:00:00Z is not STRICTLY after the clock 2026-08-01T00:00:00Z"
            - "${v1_status} == GENETIC_ORDERED and ${v1_appt} == 2026-08-10T00:00:00Z"
            - "HTTP 409 and ${e_early} == ERR_COLLECTION_APPOINTMENT_NOT_REACHED  # collection attempted at 2026-08-01, before the appointment"
            - "${r1_status} == GENETIC_ORDERED and ${r1_count} == 1  # the collection at exactly 2026-08-10T00:00:00Z is accepted because the clause is `at or after`"
            - "${r2_count} == 2  # the self-loop is legal while specimen_rejection_count < 2"
            - "HTTP 409 and ${e_limit} == ERR_SPECIMEN_REJECTION_LIMIT  # count is 2, so 2 < 2 fails"
            - "${ok_count} == 2  # the refused third rejection did not increment the counter"
            - "${ok_status} == GENETIC_COLLECTED and ${ok_at} == 2026-08-10T00:00:00Z  # priority 30 guards only the rejection self-loop, never the clean transition"

      - name: lapse_before_due_then_default_locks_out_remittances
        claim_type: violation_to_error
        grounds:
          - "validations[priority 26]"
          - "validations[priority 46]"
          - "errors[ERR_REMITTANCE_NOT_YET_DUE]"
          - "errors[ERR_IWO_DEFAULTED]"
          - "state_machines.IncomeWithholdingOrder.remittance_status"
        distinguishing_aspect: >
          The lapse gate is `clock strictly past next_remittance_due_at`, so a lapse
          declared at the exact due instant 2026-08-15T00:00:00Z is refused with
          ERR_REMITTANCE_NOT_YET_DUE and the identical call one second later
          succeeds. Two lapses then reach EMPLOYER_DEFAULT_LAPSES and the remittance
          dimension becomes DEFAULTED, at which point a remittance the employer
          actually sends is refused with ERR_IWO_DEFAULTED - money is rejected
          because of a status, which is the surprising half of priority 46.
        test_recipe:
          setup:
            - "Empty database. Clock starts at 2026-08-01T00:00:00Z."
            - "CP 200000, NCP 300000, ENTERED order with monthly_obligation_cents 75000."
            - "One CURRENT_SUPPORT charge of 75000 due 2026-08-15, so arrears_principal_cents is 75000 and arrears_recovery is round_half_up(75000 * 0.20) == 15000, making the requested amount 90000."
            - "MN employer, remittance_fee_cents 0, reported_disposable_income_cents 155000 so withholding is 90000."
            - "IWO SERVED at 2026-08-01, giving first_withholding_due_at and next_remittance_due_at of 2026-08-15T00:00:00Z (served_at + 14 days)."
            - "EMPLOYER_DEFAULT_LAPSES is 2."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Ingrid Sollie", ssn_last4: "6203", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cpv2: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Anders Sollie", ssn_last4: "6204", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpv2: "$.data.id" }
            - call: "POST /child-support/participants/${ncpv2}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpv2}", noncustodial_party_id: "${ncpv2}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { casev2: "$.data.id" }
            - call: "POST /child-support/cases/${casev2}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${casev2}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { orderv2: "$.data.id" }
            - call: "POST /child-support/orders/${orderv2}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/orders/${orderv2}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { monv2: "$.data.monthly_obligation_cents" }
            - call: "POST /child-support/orders/${orderv2}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15", amount_cents: 75000 }
              as: FinanceOfficer
            - call: "POST /child-support/employers"
              payload: { legal_name: "Sollie Transport Co", fein: "41-0000107", state_code: "MN", pay_frequency: "MONTHLY", remittance_fee_cents: 0 }
              as: ProgramAdmin
              captures: { empv2: "$.data.id" }
            - call: "GET /child-support/orders/${orderv2}"
              as: CaseWorker
              captures: { vv2: "$.data.version" }
            - call: "POST /child-support/orders/${orderv2}/withholding-orders"
              payload: { employer_id: "${empv2}", expected_order_version: "${vv2}", reported_disposable_income_cents: 155000 }
              as: CaseWorker
              captures: { iwov2: "$.data.id", whv2: "$.data.withholding_amount_cents" }
            - call: "POST /child-support/withholding-orders/${iwov2}/service"
              payload: {}
              as: CaseWorker
              captures: { srv_at: "$.data.served_at", due1: "$.data.next_remittance_due_at", rem0: "$.data.remittance_status" }
          trigger:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/withholding-orders/${iwov2}/lapse"
              payload: {}
              as: FinanceOfficer
              captures: { e_notdue: "$.data.error_id" }
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:01Z" }
              as: ProgramAdmin
            - call: "POST /child-support/withholding-orders/${iwov2}/lapse"
              payload: {}
              as: FinanceOfficer
              captures: { lap1: "$.data.remittance_status", miss1: "$.data.missed_remittance_count" }
            - call: "POST /child-support/withholding-orders/${iwov2}/lapse"
              payload: {}
              as: FinanceOfficer
              captures: { lap2: "$.data.remittance_status", miss2: "$.data.missed_remittance_count" }
            - call: "POST /child-support/withholding-orders/${iwov2}/remittances"
              payload: { amount_cents: 90000 }
              as: EmployerAgent
              as_user_id: "${empv2}"
              captures: { e_defaulted: "$.data.error_id" }
            - call: "GET /child-support/payments"
              payload: { iwo_id: "${iwov2}" }
              as: FinanceOfficer
              captures: { pay_count: "$.meta.total_count" }
            - call: "GET /child-support/withholding-orders/${iwov2}"
              as: CaseWorker
              captures: { final_rem: "$.data.remittance_status", final_miss: "$.data.missed_remittance_count" }
          assert:
            - "${monv2} == 75000 and ${whv2} == 90000  # floor(155000 * 0.60) == 93000 of cap room against a requested 90000"
            - "${srv_at} == 2026-08-01T00:00:00Z and ${due1} == 2026-08-15T00:00:00Z and ${rem0} == NOT_DUE  # service does not start the remittance clock"
            - "HTTP 409 and ${e_notdue} == ERR_REMITTANCE_NOT_YET_DUE  # the clock equals next_remittance_due_at and the rule demands STRICTLY past"
            - "${lap1} == DELINQUENT and ${miss1} == 1  # one second later the same call is legal"
            - "${lap2} == DEFAULTED and ${miss2} == 2  # missed_remittance_count + 1 >= EMPLOYER_DEFAULT_LAPSES (2)"
            - "HTTP 409 and ${e_defaulted} == ERR_IWO_DEFAULTED  # a genuine 90000 remittance is refused purely because remittance_status is DEFAULTED"
            - "${pay_count} == 0  # the refused remittance created no PaymentTransaction"
            - "${final_rem} == DEFAULTED and ${final_miss} == 2  # DEFAULTED is terminal on the remittance dimension"

      - name: aggregate_withholding_cap_binds_at_the_lowest_state_percentage
        claim_type: aggregate_validation
        grounds:
          - "validations[priority 40]"
          - "calculations.withholding_amount.aggregate_rule"
          - "errors[ERR_AGGREGATE_WITHHOLDING_EXCEEDS_CAP]"
          - "calculations.withholding_amount.constants.EMPLOYER_STATE_CAPS"
        distinguishing_aspect: >
          Both IWOs individually sit EXACTLY at their own employer-state cap - 90000
          of 90000 in MN at 0.60 and 50000 of 50000 in WI at 0.50 - and the second
          one is still refused, because the aggregate rule re-evaluates the whole
          collection at min(ccpa_cap_pct) 0.50 over the summed disposable income:
          140000 withheld against floor(250000 * 0.50) == 125000. Terminating the MN
          order then makes the identical WI request succeed, proving the sum ranges
          over non-TERMINATED IWOs only and that the comparison is <= rather than <.
        test_recipe:
          setup:
            - "Empty database. Clock pinned to 2026-08-01T00:00:00Z."
            - "CP 200000, NCP 300000 with supports_second_family false; ENTERED order, monthly 75000, medical 0."
            - "One CURRENT_SUPPORT charge of 75000 due 2026-08-15, so arrears_principal_cents is 75000 - one month of obligation, below ARREARS_BUMP_MONTHS 3, so the federal cap stays 0.60 and the requested amount is 75000 + 0 + 15000 == 90000."
            - "Employer MN-A: EMPLOYER_STATE_CAPS[MN] is null so the federal 0.60 governs; remittance_fee_cents 0."
            - "Employer WI-B: EMPLOYER_STATE_CAPS[WI] is 0.50; remittance_fee_cents 0."
            - "Requested amount is 75000 + 0 + round_half_up(75000 * 0.20) == 90000 for both."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
