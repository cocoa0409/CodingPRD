              captures: { e_days: $.data.error_id }
            - call: "POST /cafo/permits/${pm_id}/initiate-renewal"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
              captures: { e_window: $.data.error_id }
          assert:
            - "ManureStorage.${st_id}.design_capacity_gallons == 538596.00, freeboard_reserve_gallons == 89766.00 and operating_capacity_gallons == 448830.00"
            - "Operation.${op_id}.design_storage_days == 48"
