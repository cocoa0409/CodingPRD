          assert:
            - "${stale_version} == 2 and ${fresh_version} == 3 — the renewal survey incremented the parent version"
            - "the stale create returns HTTP 412 with data.error_id == ERR_STALE_SUBSCRIPTION_VERSION"
            - "after the 412 GET /subscription-transfers has total_count == 0 and Subscription.${sub_a_id}.version is still 3 and status is still ACTIVE"
            - "the create carrying ${fresh_version} returns HTTP 201 with status == REQUESTED and Subscription.${sub_a_id}.status becomes TRANSFER_PENDING with version 4"
            - "replaying the SAME create with expected_subscription_version 3 now returns HTTP 412 as well, because the successful write advanced the version past the token"

