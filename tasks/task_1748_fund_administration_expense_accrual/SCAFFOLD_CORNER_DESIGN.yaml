  # --------------------------------------------------------------- endpoints
  - section: endpoints
    instances:
      - name: response_envelope_shape
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Every response carries the fixed envelope: success has meta.api_request_id + response_type object/array + data; errors carry response_type error with data.error_id and data.message."
        test_recipe:
          setup: ["One fund exists (success case), and a nonexistent id (error case)"]
          setup_api_calls:
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
          trigger:
            - { call: "GET /securities/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: FundController, captures: { err: "$.data.error_id" } }
          assert:
            - "Create response: meta.api_request_id present, response_type == object, data.id == ${fund_id}"
            - "Error response: response_type == error, data.error_id == ERR_NOT_FOUND (${err}), data.message non-empty"
            - "List responses expose limit/offset/total_count/has_more with defaults limit=10 offset=0"

  # ------------------------------------------------------------------ errors
  - section: errors
    instances:
      - name: error_price_not_approved
        claim_type: violation_to_error
        grounds: ["errors[ERR_PRICE_NOT_APPROVED]"]
        excluded_because:
          difficulty_instance: finalize_requires_all_prices_approved
          rationale: "Error is triggered and asserted there."
      - name: error_break_escalated_blocks
        claim_type: violation_to_error
        grounds: ["errors[ERR_BREAK_ESCALATED_BLOCKS]"]
        excluded_because:
          difficulty_instance: filing_approve_blocked_by_escalated_break
          rationale: "Error is triggered and asserted there."
      - name: error_cap_agreement_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_CAP_AGREEMENT_OVERLAP]"]
        excluded_because:
          difficulty_instance: waiver_agreement_closed_interval_adjacency_rejected
          rationale: "Error is triggered and asserted there."
      - name: error_fee_period_not_contiguous
        claim_type: violation_to_error
        grounds: ["errors[ERR_FEE_PERIOD_NOT_CONTIGUOUS]"]
        excluded_because:
          difficulty_instance: fee_invoice_contiguous_tiling_required
          rationale: "Error is triggered and asserted there."
      - name: error_recoup_window_expired
        claim_type: violation_to_error
        grounds: ["errors[ERR_RECOUP_WINDOW_EXPIRED]"]
        excluded_because:
          difficulty_instance: recoup_window_last_day_inclusive
          rationale: "Error is triggered and asserted there."
      # All other catalog errors are triggered by live instances in the
      # validations / state_machines / rbac / complexity_layers sections above
      # and below (no stub needed for in-file coverage).

  # -------------------------------------------------------------------- rbac
  - section: rbac
    instances:
      - name: accountant_cannot_finalize_nav
        claim_type: rbac_denied
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN_ROLE]", roles]
        distinguishing_aspect: "FundAccountant holds every prepare permission but is denied the FundController-exclusive finalize."
        test_recipe:
          setup: ["Base kit with NavRecord 2026-08-04 ESTIMATED (version 1)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_id: "$.data.id" } }
            - { call: "POST /price-observations/${px_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_id: "$.data.id", nav_v: "$.data.version" } }
          trigger:
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v}" }, as: FundAccountant, as_user_id: "acct_1", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE (http 403); record stays ESTIMATED"

      - name: pricing_committee_cannot_create_fund
        claim_type: rbac_denied
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN_ROLE]", roles]
        distinguishing_aspect: "PricingCommittee is the narrowest role: price governance only, no fund creation."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: PricingCommittee, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE (http 403)"

      - name: sod_same_user_finalize_rejected
        claim_type: segregation_of_duties
        grounds: ["validations[priority=6]", "errors[ERR_SOD_VIOLATION]", entities.NavRecord.fields.created_by_user_id]
        distinguishing_aspect: "Segregation of duties is user-based, not role-based: a FundController whose X-User-ID equals the record's created_by_user_id is rejected even though the ROLE is allowed (priority 6 fires after priority 3 passes)."
        test_recipe:
          setup: ["Base kit; NavRecord created by accountant with X-User-ID alice"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant, as_user_id: "alice" }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, as_user_id: "alice", captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant, as_user_id: "alice" }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, as_user_id: "alice", captures: { px_id: "$.data.id" } }
            - { call: "POST /price-observations/${px_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "alice", captures: { nav_id: "$.data.id", nav_v: "$.data.version" } }
          trigger:
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v}" }, as: FundController, as_user_id: "alice", captures: { err: "$.data.error_id" } }
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v}" }, as: FundController, as_user_id: "bob", captures: { st: "$.data.status" } }
          assert:
            - "Same user alice (different role): ${err} == ERR_SOD_VIOLATION (http 403)"
            - "Different user bob: ${st} == FINAL"

      - name: controller_who_prepared_cannot_approve_filing
        claim_type: segregation_of_duties
        grounds: ["validations[priority=6]", "errors[ERR_SOD_VIOLATION]", entities.RegulatoryFiling.fields.prepared_by_user_id]
        distinguishing_aspect: "The same SoD rule guards filings on a different resource: the approving FundController must not be the preparing user (comp_9) — a second, independent SoD enforcement point."
        test_recipe:
          setup: ["Fund; N_PORT filing period_end 2026-07-31 prepared by comp_9, PENDING_REVIEW; clock 2026-08-04; no breaks"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /regulatory-filings", payload: { fund_id: "${fund_id}", filing_type: "N_PORT", period_end: "2026-07-31" }, as: ComplianceOfficer, as_user_id: "comp_9", captures: { fil_id: "$.data.id" } }
            - { call: "POST /regulatory-filings/${fil_id}/submit-review", payload: {}, as: ComplianceOfficer, as_user_id: "comp_9" }
          trigger:
            - { call: "POST /regulatory-filings/${fil_id}/approve", payload: {}, as: FundController, as_user_id: "comp_9", captures: { err: "$.data.error_id" } }
            - { call: "POST /regulatory-filings/${fil_id}/approve", payload: {}, as: FundController, as_user_id: "ctl_1", captures: { st: "$.data.status" } }
          assert:
            - "Approver == preparer (comp_9): ${err} == ERR_SOD_VIOLATION (http 403)"
            - "Approver ctl_1: ${st} == APPROVED"

  # ------------------------------------------------- cross-cutting layers
  - section: complexity_layers
    instances:
      - name: pagination_limit_offset_has_more
        claim_type: pagination_with_filtering
        grounds: [response_envelope.pagination_defaults]
        distinguishing_aspect: "Filter + paginate interaction: a class with two positions returns total_count 2, has_more true at limit 1, and the second row at offset 1."
        test_recipe:
          setup: ["Fund/class with two positions (securities CUSIP0001 qty 1000, CUSIP0002 qty 500)"]
          setup_api_calls:
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_a: "$.data.id" } }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0002", description: "Beta Inc", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_b: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_a}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_b}", quantity: 500, cost_basis_total: 5000, opened_date: "2026-08-03" }, as: FundAccountant }
          trigger:
            - { call: "GET /positions", payload: { share_class_id: "${class_id}", limit: 1, offset: 0 }, as: FundController, captures: { first_qty: "$.data[0].quantity" } }
            - { call: "GET /positions", payload: { share_class_id: "${class_id}", limit: 1, offset: 1 }, as: FundController, captures: { second_qty: "$.data[0].quantity" } }
          assert:
            - "Page 1: exactly 1 row (${first_qty} == 1000), total_count == 2, has_more == true, limit == 1, offset == 0"
            - "Page 2: exactly 1 row (${second_qty} == 500), has_more == false"
            - "Filter correctness: both pages contain only positions of ${class_id}"

      - name: occ_finalize_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[nav-finalize-stale-version]", "errors[ERR_STALE_NAV_VERSION]"]
        distinguishing_aspect: "OCC on NavRecord.version: a manual accrual create bumps the record's version 1 -> 2; a finalize still carrying version 1 is rejected 412, and re-reading then finalizing succeeds."
        test_recipe:
          setup: ["Base kit; NavRecord 2026-08-04 ESTIMATED at version 1 (observed by the client before the accrual lands)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_id: "$.data.id" } }
            - { call: "POST /price-observations/${px_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_id: "$.data.id", nav_v1: "$.data.version" } }
            - { call: "POST /expense-accruals", payload: { share_class_id: "${class_id}", accrual_date: "2026-08-04", category: "CUSTODY_FEE", annual_rate_bps: 5 }, as: FundAccountant }
          trigger:
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v1}" }, as: FundController, as_user_id: "ctl_1", captures: { err: "$.data.error_id" } }
            - { call: "GET /nav-records/${nav_id}", payload: {}, as: FundController, captures: { nav_v2: "$.data.version", accr_total: "$.data.expense_accrual_total" } }
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v2}" }, as: FundController, as_user_id: "ctl_1", captures: { st: "$.data.status" } }
          assert:
            - "Stale finalize: ${err} == ERR_STALE_NAV_VERSION (http 412) — the accrual bumped version ${nav_v1} -> ${nav_v2} (== 2)"
            - "After re-read: expense_accrual_total == 0.41 (0.27 admin + round2(100000 x 5/10000/365) = 0.14 custody) and ${st} == FINAL"

      - name: price_override_reopens_final_nav
        claim_type: cascading_side_effects
        grounds: [state_machines.PriceObservation.APPROVED_to_OVERRIDDEN, state_machines.NavRecord.FINAL_to_REOPENED]
        distinguishing_aspect: "Cross-entity cascade: overriding the APPROVED price of a FINAL record's date auto-reopens the record and recomputes it under the committee price (GAV 100000.00 -> 120000.00), bumping version to 3."
        test_recipe:
          setup: ["Base kit with NavRecord 2026-08-04 FINAL at version 2"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_id: "$.data.id" } }
            - { call: "POST /price-observations/${px_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_id: "$.data.id", nav_v1: "$.data.version" } }
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v1}" }, as: FundController, as_user_id: "ctl_1" }
          trigger:
            - { call: "POST /price-observations/${px_id}/override", payload: { override_price: 120.00, pricing_level: "LEVEL_3" }, as: PricingCommittee, captures: { new_px: "$.data.id", new_src: "$.data.source", new_flag: "$.data.is_fair_value_override" } }
            - { call: "GET /nav-records/${nav_id}", payload: {}, as: FundController, captures: { nav_st: "$.data.status", nav_gav: "$.data.gross_asset_value", nav_v: "$.data.version" } }
            - { call: "GET /securities/${sec_id}/prices", payload: { price_date: "2026-08-04", status: "OVERRIDDEN" }, as: FundController, captures: { overridden_src: "$.data[0].source" } }
          assert:
            - "New observation ${new_px}: source ${new_src} == FAIR_VALUE_COMMITTEE, is_fair_value_override ${new_flag} == true, status APPROVED"
            - "Original observation is OVERRIDDEN (${overridden_src} == EXCHANGE_CLOSE in the OVERRIDDEN-filtered list)"
            - "NavRecord.${nav_id}: ${nav_st} == REOPENED, gross_asset_value == 120000.00 (${nav_gav}), expense_accrual_total == 0.33 (first-record base recomputed), version ${nav_v} == 3"

      - name: dual_variant_layer_coverage
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: nav_provisional_vs_final_pricing_variant
          rationale: "Both dual-variant calculations are covered by Rule-1 instances (pricing and accrual day-count)."
      - name: rate_threshold_layer_coverage
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: expense_cap_exact_equality_no_waiver
          rationale: "Cap threshold boundary (== vs >) is covered there and in expense_cap_circular_evaluation_order."

  # ------------------------------------------------------- consistency model
  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_write
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: a write's effects (including computed fields) are fully visible in the very next GET — no lag, no stale read."
        test_recipe:
          setup: ["Base kit; NavRecord created"]
          setup_api_calls:
