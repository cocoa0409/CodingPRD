# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. Every money literal in
# an `assert:` line was computed from the §1.3 formulas and their constants.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_versus_final_export_zero_rating
        grounds:
          - calculations.buyer_settlement_total
          - calculations.storage_fee_accrual
          - entities.Invoice.fields.settlement_variant
          - state_machines.ExportDocumentPacket.CUSTOMS_FILED_to_EXPORT_CLEARED
        distinguishing_aspect: |
          The same cross-border invoice yields total_due_cents 14213950 under the
          PROVISIONAL variant (19% German rate, zero storage) and 11717000 under
          the FINAL variant (zero-rated because the packet reached EXPORT_CLEARED,
          plus one chargeable storage day of 12000), a delta of 2496950 driven by
          two independent variant differences at once.
        test_recipe:
          setup:
            - "US yard, RESERVE consignment, one 36000 kg lot with reserve 10000000, title clear, report published"
            - "German bidder (TIER_A, NET_7 terms, deposit hold 1500000), lot hammered at 12000000 on 2026-08-10T16:00:00Z"
            - "export packet driven to EXPORT_CLEARED; clock advanced to 2026-08-16T16:00:00Z, exactly one whole day past the 5-day free-storage grace end 2026-08-15T16:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yards"
              payload: { code: "YRD-DAL", country_code: "US", teardown_buffer_minutes: 120, loadout_deadline_days: 10, currency_code: "USD" }
              as: PlatformAdmin
              captures: { yard_id: "$.data.id" }
            - call: "POST /consignors"
              payload: { legal_name: "Lone Star Fleet", country_code: "US", seller_type: "FLEET_OWNER", unreserved_policy_ack: false }
              as: PlatformAdmin
              captures: { consignor_id: "$.data.id" }
            - call: "POST /consignments"
              payload: { consignor_id: "${consignor_id}", agreement_type: "RESERVE", commission_schedule_code: "RESERVE_STD", refurb_authorization_cap_cents: 500000, advance_paid_cents: 0 }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { consignment_id: "$.data.id" }
            - call: "POST /lots"
              payload: { consignment_id: "${consignment_id}", make: "Caterpillar", model: "D8T", model_year: 2019, serial_number: "CAT-D8T-0001", hour_meter_reading: 6200, weight_kg: 36000, title_required: false, reserve_price_cents: 10000000 }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { lot1_id: "$.data.id" }
            - call: "POST /consignments/${consignment_id}/submit"
              payload: {}
              as: Consignor
              as_user_id: "${consignor_id}"
            - call: "POST /consignments/${consignment_id}/intake-decision"
              payload: { decision: "ACCEPT" }
              as: AuctionOperator
            - call: "POST /lots/${lot1_id}/lien-search"
              payload: { lien_search_reference: "LS-0001" }
              as: ComplianceOfficer
            - call: "POST /lots/${lot1_id}/lien-result"
              payload: { encumbrance_found: false }
              as: ComplianceOfficer
            - call: "POST /lots/${lot1_id}/condition-reports"
              payload: { structural_score: 83.5, powertrain_score: 77.5, hydraulics_score: 64.5, tires_score: 58.5, observed_hour_meter_reading: 6200, hour_meter_verified: true }
              as: IntakeInspector
              as_user_id: "inspector-1"
              captures: { report1_id: "$.data.id" }
            - call: "POST /condition-reports/${report1_id}/publish"
              payload: {}
              as: IntakeInspector
              as_user_id: "inspector-1"
            - call: "POST /auctions"
              payload: { yard_id: "${yard_id}", kind: "LIVE_ONSITE", reserve_policy: "RESERVE_ALLOWED", premium_schedule_code: "STANDARD", window_start: "2026-08-10T14:00:00Z", window_end: "2026-08-10T22:00:00Z" }
              as: AuctionOperator
              captures: { auction_id: "$.data.id" }
            - call: "POST /auctions/${auction_id}/lot-assignments"
              payload: { lot_id: "${lot1_id}" }
              as: AuctionOperator
            - call: "POST /bidders"
              payload: { legal_name: "Rheintal Baumaschinen GmbH", country_code: "DE", tax_id: "DE811234567" }
              as: PlatformAdmin
              captures: { bidder_de_id: "$.data.id" }
            - call: "POST /bidders/${bidder_de_id}/deposits"
              payload: { amount_cents: 1500000, reference: "WIRE-DE-1" }
              as: SettlementOfficer
            - call: "POST /bidder-registrations"
              payload: { bidder_id: "${bidder_de_id}", auction_id: "${auction_id}", deposit_hold_cents: 1500000, financing_requested: false }
              as: Bidder
              as_user_id: "${bidder_de_id}"
              captures: { reg_de_id: "$.data.id" }
            - call: "POST /bidder-registrations/${reg_de_id}/credit-decision"
              payload: { decision: "APPROVE", approved_credit_limit_cents: 0 }
              as: SettlementOfficer
              as_user_id: "credit-officer-1"
            - call: "POST /auctions/${auction_id}/open"
              payload: {}
              as: AuctionOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bids"
              payload: { registration_id: "${reg_de_id}", lot_id: "${lot1_id}", amount_cents: 12000000 }
              as: Bidder
              as_user_id: "${bidder_de_id}"
            - call: "POST /lots/${lot1_id}/hammer"
              payload: {}
              as: AuctionOperator
              captures: { sale1_id: "$.data.id" }
            - call: "GET /invoices"
              payload: { sale_id: "${sale1_id}" }
              as: SettlementOfficer
              captures: { inv1_id: "$.data[0].id" }
            - call: "POST /export-packets"
              payload: { invoice_id: "${inv1_id}", destination_country_code: "DE" }
              as: ComplianceOfficer
              captures: { pkt1_id: "$.data.id" }
            - call: "POST /export-packets/${pkt1_id}/transition"
              payload: { action: "ATTACH_TITLE", title_document_ref: "MSO-DE-0001" }
              as: ComplianceOfficer
            - call: "POST /export-packets/${pkt1_id}/transition"
              payload: { action: "FILE_CUSTOMS", customs_entry_ref: "EEI-0001" }
              as: ComplianceOfficer
            - call: "POST /export-packets/${pkt1_id}/transition"
              payload: { action: "CLEAR" }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-16T16:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /invoices/${inv1_id}/settlement-preview"
              payload: { variant: "PROVISIONAL" }
              as: SettlementOfficer
            - call: "GET /invoices/${inv1_id}/settlement-preview"
              payload: { variant: "FINAL" }
              as: SettlementOfficer
          assert:
            - "PROVISIONAL preview: buyer_premium_cents == 1160000"
            - "PROVISIONAL preview: documentation_fee_cents == 45000 and subtotal_cents == 13205000"
            - "PROVISIONAL preview: tax_rate_applied == 0.1900 and tax_cents == 2508950"
            - "PROVISIONAL preview: chargeable_storage_days == 0 and storage_fee_cents == 0"
            - "PROVISIONAL preview: deposit_applied_cents == 1500000 and total_due_cents == 14213950"
            - "FINAL preview: tax_rate_applied == 0.0000 and tax_cents == 0"
            - "FINAL preview: chargeable_storage_days == 1 and storage_fee_cents == 12000"
            - "FINAL preview: total_due_cents == 11717000"
            - "Invoice.${inv1_id}.settlement_variant == PROVISIONAL and Invoice.${inv1_id}.total_due_cents == 14213950 (neither preview mutated the invoice)"

      - name: bid_cap_forecast_versus_chronological_replay
        grounds:
          - calculations.bidder_exposure_and_bid_cap
          - entities.BidderRegistration.fields.bid_cap_cents
          - entities.Bidder.fields.open_exposure_cents
          - state_machines.Sale.PROVISIONAL_to_CONFIRMED
        distinguishing_aspect: |
          For one registration holding a CONFIRMED 4000000 sale and an unresolved
          PROVISIONAL 3000000 sale, REGISTRATION_FORECAST returns bid_cap_cents
          11724062 (deposit-net invoice obligation 3275938 subtracted) while
          LIVE_CHRONOLOGICAL returns 8000000 (both gross hammers subtracted),
          a 3724062 divergence on identical data.
        test_recipe:
          setup:
            - "US yard, RESERVE consignment with two published lots: lot A reserve 1000000, lot B reserve 5000000"
            - "US bidder TIER_A, deposit hold 1500000, leverage 10, credit limit 0"
            - "bid 4000000 on lot A and 3000000 on lot B placed while the auction is OPEN, then lot A hammered at 2026-08-10T16:00:00Z and lot B hammered at 2026-08-10T16:05:00Z"
            - "lot A sale CONFIRMED with an invoice (total_due 3275938); lot B sale left PROVISIONAL because 3000000 is below its 5000000 reserve"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yards"
              payload: { code: "YRD-DAL", country_code: "US", teardown_buffer_minutes: 120, loadout_deadline_days: 10, currency_code: "USD" }
              as: PlatformAdmin
              captures: { yard_id: "$.data.id" }
            - call: "POST /consignors"
              payload: { legal_name: "Lone Star Fleet", country_code: "US", seller_type: "FLEET_OWNER", unreserved_policy_ack: false }
              as: PlatformAdmin
              captures: { consignor_id: "$.data.id" }
            - call: "POST /consignments"
              payload: { consignor_id: "${consignor_id}", agreement_type: "RESERVE", commission_schedule_code: "RESERVE_STD", refurb_authorization_cap_cents: 500000, advance_paid_cents: 0 }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { consignment_id: "$.data.id" }
            - call: "POST /lots"
              payload: { consignment_id: "${consignment_id}", make: "Caterpillar", model: "D8T", model_year: 2019, serial_number: "CAT-D8T-0001", hour_meter_reading: 6200, weight_kg: 36000, title_required: false, reserve_price_cents: 1000000 }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { lot_a_id: "$.data.id" }
            - call: "POST /lots"
              payload: { consignment_id: "${consignment_id}", make: "Bobcat", model: "S76", model_year: 2021, serial_number: "BOB-S76-0002", hour_meter_reading: 900, weight_kg: 6000, title_required: false, reserve_price_cents: 5000000 }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { lot_b_id: "$.data.id" }
            - call: "POST /consignments/${consignment_id}/submit"
              payload: {}
              as: Consignor
              as_user_id: "${consignor_id}"
            - call: "POST /consignments/${consignment_id}/intake-decision"
              payload: { decision: "ACCEPT" }
              as: AuctionOperator
            - call: "POST /lots/${lot_a_id}/lien-search"
              payload: { lien_search_reference: "LS-0001" }
              as: ComplianceOfficer
            - call: "POST /lots/${lot_a_id}/lien-result"
              payload: { encumbrance_found: false }
              as: ComplianceOfficer
            - call: "POST /lots/${lot_b_id}/lien-search"
              payload: { lien_search_reference: "LS-0002" }
              as: ComplianceOfficer
            - call: "POST /lots/${lot_b_id}/lien-result"
              payload: { encumbrance_found: false }
              as: ComplianceOfficer
            - call: "POST /lots/${lot_a_id}/condition-reports"
              payload: { structural_score: 90.0, powertrain_score: 90.0, hydraulics_score: 90.0, tires_score: 90.0, observed_hour_meter_reading: 6200, hour_meter_verified: true }
              as: IntakeInspector
              as_user_id: "inspector-1"
              captures: { report_a_id: "$.data.id" }
            - call: "POST /lots/${lot_b_id}/condition-reports"
              payload: { structural_score: 90.0, powertrain_score: 90.0, hydraulics_score: 90.0, tires_score: 90.0, observed_hour_meter_reading: 900, hour_meter_verified: true }
              as: IntakeInspector
              as_user_id: "inspector-1"
              captures: { report_b_id: "$.data.id" }
            - call: "POST /condition-reports/${report_a_id}/publish"
              payload: {}
              as: IntakeInspector
              as_user_id: "inspector-1"
            - call: "POST /condition-reports/${report_b_id}/publish"
              payload: {}
              as: IntakeInspector
              as_user_id: "inspector-1"
            - call: "POST /auctions"
              payload: { yard_id: "${yard_id}", kind: "LIVE_ONSITE", reserve_policy: "RESERVE_ALLOWED", premium_schedule_code: "STANDARD", window_start: "2026-08-10T14:00:00Z", window_end: "2026-08-10T22:00:00Z" }
              as: AuctionOperator
              captures: { auction_id: "$.data.id" }
            - call: "POST /auctions/${auction_id}/lot-assignments"
              payload: { lot_id: "${lot_a_id}" }
              as: AuctionOperator
            - call: "POST /auctions/${auction_id}/lot-assignments"
              payload: { lot_id: "${lot_b_id}" }
              as: AuctionOperator
            - call: "POST /bidders"
              payload: { legal_name: "Permian Iron LLC", country_code: "US", tax_id: "US-74-0000001" }
              as: PlatformAdmin
              captures: { bidder_us_id: "$.data.id" }
            - call: "POST /bidders/${bidder_us_id}/deposits"
              payload: { amount_cents: 1500000, reference: "WIRE-US-1" }
              as: SettlementOfficer
            - call: "POST /bidder-registrations"
              payload: { bidder_id: "${bidder_us_id}", auction_id: "${auction_id}", deposit_hold_cents: 1500000, financing_requested: false }
              as: Bidder
              as_user_id: "${bidder_us_id}"
              captures: { reg_us_id: "$.data.id" }
            - call: "POST /bidder-registrations/${reg_us_id}/credit-decision"
              payload: { decision: "APPROVE", approved_credit_limit_cents: 0 }
              as: SettlementOfficer
              as_user_id: "credit-officer-1"
            - call: "POST /auctions/${auction_id}/open"
              payload: {}
              as: AuctionOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bids"
              payload: { registration_id: "${reg_us_id}", lot_id: "${lot_a_id}", amount_cents: 4000000 }
              as: Bidder
              as_user_id: "${bidder_us_id}"
            - call: "POST /bids"
              payload: { registration_id: "${reg_us_id}", lot_id: "${lot_b_id}", amount_cents: 3000000 }
              as: Bidder
              as_user_id: "${bidder_us_id}"
            - call: "POST /lots/${lot_a_id}/hammer"
              payload: {}
              as: AuctionOperator
              captures: { sale_a_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T16:05:00Z" }
              as: PlatformAdmin
            - call: "POST /lots/${lot_b_id}/hammer"
              payload: {}
              as: AuctionOperator
              captures: { sale_b_id: "$.data.id" }
          trigger:
            - call: "GET /bidders/${bidder_us_id}/exposure"
              payload: { auction_id: "${auction_id}", variant: "REGISTRATION_FORECAST" }
              as: SettlementOfficer
            - call: "GET /bidders/${bidder_us_id}/exposure"
              payload: { auction_id: "${auction_id}", variant: "LIVE_CHRONOLOGICAL" }
              as: AuctionOperator
          assert:
            - "Sale.${sale_a_id}.status == CONFIRMED and Sale.${sale_b_id}.status == PROVISIONAL"
            - "REGISTRATION_FORECAST: base_headroom_cents == 15000000, exposure_cents == 3275938, bid_cap_cents == 11724062"
            - "LIVE_CHRONOLOGICAL: base_headroom_cents == 15000000, exposure_cents == 7000000, bid_cap_cents == 8000000"
            - "LIVE_CHRONOLOGICAL: breached_at_sale_id == null"
            - "the two variants differ by exactly 3724062 on identical data"

  - rule_id: combinatorial_formula
    instances:
      - name: premium_tier_sum_then_online_surcharge_then_ceiling_clamp
        grounds:
          - calculations.buyer_premium_computation
          - calculations.buyer_settlement_total
          - entities.Auction.fields.kind
          - entities.Invoice.fields.buyer_premium_cents
        distinguishing_aspect: |
          A 60000000 hammer in a TIMED_ONLINE auction produces tier sum 3950000
          plus a 900000 online surcharge = 4850000, which the ceiling clamps to
          exactly PREMIUM_MAX_CENTS 4000000; clamping before the surcharge would
          leave 4000000 as well but yield subtotal 64015000 only under this order,
          and the recorded tax 4000938 pins the half-up rounding of 4000937.5.
        test_recipe:
          setup:
            - "US yard, RESERVE consignment, one 36000 kg lot with reserve 50000000, report published"
            - "TIMED_ONLINE auction with premium_schedule_code STANDARD"
            - "US bidder TIER_A with deposit total 10000000 and a 9000000 deposit hold (bid cap 90000000)"
            - "clock at 2026-08-10T16:00:00Z inside the online window; bid 60000000 accepted and the lot hammered"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yards"
              payload: { code: "YRD-DAL", country_code: "US", teardown_buffer_minutes: 120, loadout_deadline_days: 10, currency_code: "USD" }
              as: PlatformAdmin
              captures: { yard_id: "$.data.id" }
            - call: "POST /consignors"
              payload: { legal_name: "Lone Star Fleet", country_code: "US", seller_type: "FLEET_OWNER", unreserved_policy_ack: false }
              as: PlatformAdmin
              captures: { consignor_id: "$.data.id" }
            - call: "POST /consignments"
              payload: { consignor_id: "${consignor_id}", agreement_type: "RESERVE", commission_schedule_code: "RESERVE_STD", refurb_authorization_cap_cents: 500000, advance_paid_cents: 0 }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { consignment_id: "$.data.id" }
            - call: "POST /lots"
              payload: { consignment_id: "${consignment_id}", make: "Liebherr", model: "R9200", model_year: 2020, serial_number: "LIE-R9200-0001", hour_meter_reading: 4100, weight_kg: 36000, title_required: false, reserve_price_cents: 50000000 }
              as: Consignor
              as_user_id: "${consignor_id}"
              captures: { lot1_id: "$.data.id" }
            - call: "POST /consignments/${consignment_id}/submit"
              payload: {}
              as: Consignor
              as_user_id: "${consignor_id}"
            - call: "POST /consignments/${consignment_id}/intake-decision"
              payload: { decision: "ACCEPT" }
              as: AuctionOperator
            - call: "POST /lots/${lot1_id}/lien-search"
              payload: { lien_search_reference: "LS-0001" }
              as: ComplianceOfficer
            - call: "POST /lots/${lot1_id}/lien-result"
              payload: { encumbrance_found: false }
              as: ComplianceOfficer
            - call: "POST /lots/${lot1_id}/condition-reports"
              payload: { structural_score: 90.0, powertrain_score: 90.0, hydraulics_score: 90.0, tires_score: 90.0, observed_hour_meter_reading: 4100, hour_meter_verified: true }
              as: IntakeInspector
              as_user_id: "inspector-1"
              captures: { report1_id: "$.data.id" }
            - call: "POST /condition-reports/${report1_id}/publish"
              payload: {}
              as: IntakeInspector
              as_user_id: "inspector-1"
            - call: "POST /auctions"
              payload: { yard_id: "${yard_id}", kind: "TIMED_ONLINE", reserve_policy: "RESERVE_ALLOWED", premium_schedule_code: "STANDARD", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-12T00:00:00Z" }
              as: AuctionOperator
              captures: { auction_id: "$.data.id" }
            - call: "POST /auctions/${auction_id}/lot-assignments"
              payload: { lot_id: "${lot1_id}" }
              as: AuctionOperator
            - call: "POST /bidders"
              payload: { legal_name: "Permian Iron LLC", country_code: "US", tax_id: "US-74-0000001" }
              as: PlatformAdmin
              captures: { bidder_us_id: "$.data.id" }
            - call: "POST /bidders/${bidder_us_id}/deposits"
              payload: { amount_cents: 10000000, reference: "WIRE-US-1" }
              as: SettlementOfficer
            - call: "POST /bidder-registrations"
              payload: { bidder_id: "${bidder_us_id}", auction_id: "${auction_id}", deposit_hold_cents: 9000000, financing_requested: false }
              as: Bidder
              as_user_id: "${bidder_us_id}"
              captures: { reg_us_id: "$.data.id" }
            - call: "POST /bidder-registrations/${reg_us_id}/credit-decision"
              payload: { decision: "APPROVE", approved_credit_limit_cents: 0 }
              as: SettlementOfficer
              as_user_id: "credit-officer-1"
            - call: "POST /auctions/${auction_id}/open"
              payload: {}
              as: AuctionOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bids"
              payload: { registration_id: "${reg_us_id}", lot_id: "${lot1_id}", amount_cents: 60000000 }
              as: Bidder
              as_user_id: "${bidder_us_id}"
          trigger:
            - call: "POST /lots/${lot1_id}/hammer"
              payload: {}
              as: AuctionOperator
              captures: { sale1_id: "$.data.id" }
            - call: "GET /invoices"
              payload: { sale_id: "${sale1_id}" }
              as: SettlementOfficer
              captures: { inv1_id: "$.data[0].id" }
          assert:
            - "Invoice.${inv1_id}.buyer_premium_cents == 4000000"
            - "Invoice.${inv1_id}.documentation_fee_cents == 15000 and Invoice.${inv1_id}.subtotal_cents == 64015000"
            - "Invoice.${inv1_id}.tax_rate_applied == 0.0625 and Invoice.${inv1_id}.tax_cents == 4000938"
            - "Invoice.${inv1_id}.deposit_applied_cents == 9000000"
            - "Invoice.${inv1_id}.total_due_cents == 59015938"
            - "Invoice.${inv1_id}.storage_fee_cents == 0 and Invoice.${inv1_id}.settlement_variant == PROVISIONAL"

      - name: condition_grade_rounds_per_component_before_summing
        grounds:
          - calculations.lot_condition_grade
          - entities.ConditionReport.fields.grade_score
          - entities.ConditionReport.fields.grade_band
          - state_machines.Lot.INTAKE_to_INSPECTED
        distinguishing_aspect: |
          Scores 83.5/77.5/64.5/58.5 weighted 0.35/0.30/0.20/0.15 give 74.16 when
          each component is rounded half-up to 2 decimals before summing
          (29.23+23.25+12.90+8.78) and 74.15 when the products are summed first;
          the assertion pins 74.16, so the rounding order alone decides the test.
        test_recipe:
          setup:
            - "RESERVE consignment accepted at intake with one lot whose declared hour meter is 6200"
            - "no refurbishment order, no auction needed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /consignors"
              payload: { legal_name: "Lone Star Fleet", country_code: "US", seller_type: "FLEET_OWNER", unreserved_policy_ack: false }
