      - name: usps_grace_window_boundaries_at_deadline_and_at_grace_limit
        claim_type: Correct Result
        grounds:
          - calculations.envelope_timeliness
          - entities.ReturnEnvelope.fields.preliminary_timeliness
          - entities.ReturnEnvelope.fields.final_timeliness
          - endpoints[POST /vote-by-mail/elections/{id}/canvass-sweep]
        distinguishing_aspect: "Three USPS envelopes received at return_deadline_at exactly, at grace_limit_at exactly (deadline + 7 days) and one second past it resolve to TIMELY / PROVISIONAL_TIMELY_POSTMARK / UNTIMELY preliminarily and TIMELY / TIMELY_BY_POSTMARK / UNTIMELY after the sweep, with only the third sequestered."
        test_recipe:
          setup:
            - "Election e1 (return_deadline_at 2026-11-03T20:00:00Z, postmark_grace_days 7 so grace_limit_at == 2026-11-10T20:00:00Z) with three dispatched packets pk1, pk2, pk3; all three envelopes arrive by USPS with legible postmarks on or before election_date 2026-11-03."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_voter2
            - *c_request2
            - *c_av2_lookup
            - *c_av2_same
            - *c_approve2
            - *c_voter3
            - *c_request3
            - *c_av3_lookup
            - *c_av3_same
            - *c_approve3
            - *c_batch1
            - *c_packet1
            - *c_packet2
            - *c_packet3
            - *c_seal1
            - *c_dispatch1
          trigger:
            - call: "POST /vote-by-mail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T20:00:00Z" }
              as: ElectionsAdmin
            - call: "POST /vote-by-mail/return-envelopes"
              payload: { ballot_packet_id: "${pk1}", intake_channel: "USPS", postmark_date: "2026-11-01", postmark_legible: true }
              as: ElectionsClerk
              captures: { enA: $.data.id }
            - call: "POST /vote-by-mail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-10T20:00:00Z" }
              as: ElectionsAdmin
            - call: "POST /vote-by-mail/return-envelopes"
              payload: { ballot_packet_id: "${pk2}", intake_channel: "USPS", postmark_date: "2026-11-02", postmark_legible: true }
              as: ElectionsClerk
              captures: { enB: $.data.id }
            - call: "POST /vote-by-mail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-10T20:00:01Z" }
              as: ElectionsAdmin
            - call: "POST /vote-by-mail/return-envelopes"
              payload: { ballot_packet_id: "${pk3}", intake_channel: "USPS", postmark_date: "2026-11-03", postmark_legible: true }
              as: ElectionsClerk
              captures: { enC: $.data.id }
            - call: "POST /vote-by-mail/elections/${e1}/canvass-sweep"
              payload: {}
              as: ElectionsAdmin
          assert:
            - "Envelope enA received at exactly 2026-11-03T20:00:00Z: preliminary_timeliness == \"TIMELY\" (the deadline comparison is <=)"
            - "Envelope enB received at exactly 2026-11-10T20:00:00Z: preliminary_timeliness == \"PROVISIONAL_TIMELY_POSTMARK\" (grace_limit_at is inclusive)"
            - "Envelope enC received at 2026-11-10T20:00:01Z: preliminary_timeliness == \"UNTIMELY\" (one second past grace_limit_at)"
            - "Canvass sweep response: canvass_sweep_index == 1, finalized_envelope_count == 3, expired_cure_count == 0, sequestered_envelope_count == 1"
            - "After the sweep: enA.final_timeliness == \"TIMELY\", enB.final_timeliness == \"TIMELY_BY_POSTMARK\", enC.final_timeliness == \"UNTIMELY\""
            - "After the sweep: enA.custody_status == \"SEALED\", enB.custody_status == \"SEALED\", enC.custody_status == \"SEQUESTERED\""

      - name: two_no_match_rounds_resolve_to_cure_required_with_mismatch_reason
        claim_type: Correct Result
        grounds:
          - calculations.escalation_quorum_resolution
          - calculations.signature_confidence_score
          - state_machines.ReturnEnvelope.transitions.PENDING_REVIEW_to_ESCALATED
          - state_machines.ReturnEnvelope.transitions.PENDING_REVIEW_to_CURE_REQUIRED
        distinguishing_aspect: "Round 1 NO_MATCH at similarity 60 (confidence_score 0.6000) escalates without demanding a lead, round 2 by a different reviewer NO_MATCH at similarity 58 (confidence_score 0.5800) resolves to CURE_REQUIRED, and the issued notice carries reason_code SIGNATURE_MISMATCH."
        test_recipe:
          setup:
            - "Envelope en1 in PENDING_REVIEW with round-1 review sr1 assigned to rv1; reviewer rvB (REP, TRAINED) available for round 2; voter v1 has signature_on_file_count 1 and last_signature_update_at 2026-01-05T00:00:00Z, so signature_age_days == 302 and no staleness penalty applies at clock 2026-11-03T12:00:00Z."
          setup_api_calls:
            - *c_clock_sep10
            - *c_election
            - *c_voter1
            - *c_reviewer1
            - *c_reviewer_b
            - *c_request1
            - *c_av1_lookup
            - *c_av1_same
            - *c_approve1
            - *c_batch1
            - *c_packet1
            - *c_seal1
            - *c_dispatch1
            - *c_clock_nov3
            - *c_envelope1
            - *c_review1
          trigger:
            - call: "POST /vote-by-mail/signature-reviews/${sr1}/decision"
              payload: { decision: "NO_MATCH", similarity_score: 60, notes: "slant and letter forms differ" }
              as: SignatureReviewer
              as_user_id: "${rv1}"
            - call: "POST /vote-by-mail/return-envelopes/${en1}/signature-reviews"
              payload: {}
              as: ElectionsClerk
              captures: { sr2: $.data.id, sr2_reviewer: $.data.reviewer_id }
            - call: "POST /vote-by-mail/signature-reviews/${sr2}/decision"
              payload: { decision: "NO_MATCH", similarity_score: 58, notes: "second reader agrees" }
              as: SignatureReviewer
              as_user_id: "${rvB}"
            - *c_cure1
          assert:
            - "Round 1: SignatureReview ${sr1}.confidence_score == 0.6000 and status == \"SUBMITTED\""
            - "After round 1: envelope signature_status == \"ESCALATED\" and review_round_count == 1"
            - "Round 2 assignment: ${sr2_reviewer} == ${rvB} and review_round == 2 — rv1 is excluded from its own envelope by segregation of duties"
            - "Round 2: SignatureReview ${sr2}.confidence_score == 0.5800"
            - "After round 2: envelope signature_status == \"CURE_REQUIRED\", review_round_count == 2, resolved_signature_confidence == 0.5800"
            - "CureNotice ${cn1}.reason_code == \"SIGNATURE_MISMATCH\" and status == \"ISSUED\""
            - "GET /vote-by-mail/transparency-log?election_id=${e1}&event_type=SIGNATURE_ESCALATION returns total_count == 1"

