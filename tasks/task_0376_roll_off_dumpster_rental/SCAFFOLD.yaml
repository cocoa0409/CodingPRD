# =============================================================================
# Roll-Off Dumpster Rental — benchmark seed tables (Expert tier)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Roll-Off Dumpster Rental: container size & inventory, delivery/swap/pickup
  scheduling, rental period & overage day, tonnage/weight billing & overage,
  prohibited-item & contamination fee, route dispatch, street-placement permit,
  contractor account

domain_name: roll-off-dumpster-rental
api_prefix: /          # flat topology: peer collections rooted at /; no single top-level resource path

# Step 0 — Complexity Profile
complexity_profile:
  primary_archetype: quota_allocation        # finite container fleet competed for, reserved, swapped, released
  secondary_archetype: pricing_engine        # tonnage + overage-day + contamination billing with tiered/dual-variant math
  complexity_layers:
    - optimistic_concurrency                 # OCC on Container.version for fleet assignment + on Route.version for stop sequencing
    - cascading_side_effects                 # order completion cascades order→container→permit→invoice→account
    - dual_variant_calculation               # provisional (at-delivery estimate) vs final (at-dump weigh ticket) billing
    - rate_threshold_triggers                # included-tonnage breakpoint, included-day breakpoint, contamination tier breakpoint

  entity_topology: flat                       # peer entities linked by FK; no deep nested URL chains
  state_machine_shape: parallel               # RentalOrder carries logistics_status × billing_status evolving independently; Container cyclic
  relationship_patterns:
    - one_to_many                             # account→orders, order→service-stops, route→service-stops
    - many_to_many                            # container reused across many sequential orders (via assignment history)
    - cross_aggregate                         # ServiceStop references both RentalOrder and Route
  role_model: peer_roles                      # Contractor owns own orders; Dispatcher owns routes/stops; Scale/Billing/Admin operational
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ContainerType
    parent: null
    common_fields: true
    fields:
      - { name: size_code, type: enum, source: input, description: "Container nominal size", constraints: "one of {YD10, YD20, YD30, YD40}; unique across active types" }
      - { name: base_rate_cents, type: integer, source: input, description: "Base haul price in cents charged once per delivered order", constraints: ">= 0" }
      - { name: included_days, type: integer, source: input, description: "Number of rental days included in base_rate before overage-day fees apply", constraints: ">= 1" }
      - { name: overage_day_cents, type: integer, source: input, description: "Per-day fee in cents for each rental day beyond included_days", constraints: ">= 0" }
      - { name: included_tonnage_lbs, type: integer, source: input, description: "Pounds of disposed material included in base_rate before tonnage overage applies", constraints: ">= 0" }
      - { name: overage_rate_cents_per_lb, type: integer, source: input, description: "Per-pound fee in cents for disposed weight above included_tonnage_lbs", constraints: ">= 0" }
      - { name: active, type: boolean, source: system, default: true, description: "Whether new orders may select this type; set false by retire endpoint" }

  - name: ContractorAccount
    parent: null
    common_fields: true
    fields:
      - { name: business_name, type: string, source: input, description: "Contractor legal/business name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum unpaid balance the account may carry", constraints: ">= 0" }
      - { name: outstanding_cents, type: integer, source: computed, default: 0, description: "Read-only = sum of finalized Invoice.total_cents on this account that are not yet PAID" }
      - { name: available_credit_cents, type: integer, source: computed, description: "Read-only = credit_limit_cents - outstanding_cents" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> SUSPENDED -> ACTIVE; SUSPENDED blocks new orders", constraints: "one of {ACTIVE, SUSPENDED}" }

  - name: Container
    parent: null
    common_fields: true
    fields:
      - { name: container_type_id, type: string, source: input, description: "FK -> ContainerType.id; size/pricing class of this physical can" }
      - { name: asset_tag, type: string, source: input, description: "Yard asset tag stencilled on the can", constraints: "unique across all containers" }
      - { name: yard_code, type: string, source: input, description: "Home yard / depot code where the empty can stages" }
      - { name: status, type: enum, source: system, default: IN_YARD, description: "IN_YARD -> ASSIGNED -> ON_SITE -> AWAITING_DUMP -> IN_YARD; or -> OUT_OF_SERVICE", constraints: "one of {IN_YARD, ASSIGNED, ON_SITE, AWAITING_DUMP, OUT_OF_SERVICE}" }
      - { name: current_order_id, type: string, source: system, default: null, description: "FK -> RentalOrder.id; the order this can is committed to while not IN_YARD, else null" }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: service_date, type: string, source: input, description: "Calendar date the route runs, ISO date YYYY-MM-DD" }
      - { name: truck_code, type: string, source: input, description: "Truck/driver identifier running this route", constraints: "unique per service_date" }
      - { name: capacity_stops, type: integer, source: input, description: "Maximum number of ServiceStops this route may hold", constraints: ">= 1" }
      - { name: stop_count, type: integer, source: computed, default: 0, description: "Read-only = count of ServiceStops on this route not in CANCELLED status" }
      - { name: status, type: enum, source: system, default: PLANNING, description: "PLANNING -> DISPATCHED -> CLOSED", constraints: "one of {PLANNING, DISPATCHED, CLOSED}" }

  - name: RentalOrder
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> ContractorAccount.id; the contractor renting the can" }
      - { name: container_type_id, type: string, source: input, description: "FK -> ContainerType.id; requested size at order time" }
      - { name: container_id, type: string, source: system, default: null, description: "FK -> Container.id; the physical can assigned at delivery dispatch, else null" }
      - { name: site_address, type: string, source: input, description: "Drop site street address" }
      - { name: requested_delivery_date, type: string, source: input, description: "Desired delivery calendar date, ISO date YYYY-MM-DD" }
      - { name: delivered_on, type: string, source: system, default: null, description: "Date the delivery ServiceStop was completed, ISO date YYYY-MM-DD" }
      - { name: picked_up_on, type: string, source: system, default: null, description: "Date the terminal pickup ServiceStop was completed, ISO date YYYY-MM-DD" }
      - { name: rental_days, type: integer, source: computed, default: 0, description: "Read-only = inclusive day span from delivered_on to picked_up_on (= picked_up_on - delivered_on + 1); 0 until picked up" }
      - { name: requires_street_permit, type: boolean, source: input, default: false, description: "Whether the drop site sits on a public street and needs a StreetPermit" }
      - { name: logistics_status, type: enum, source: system, default: BOOKED, description: "BOOKED -> SCHEDULED -> ON_SITE -> AWAITING_PICKUP -> COMPLETED; or -> CANCELLED", constraints: "one of {BOOKED, SCHEDULED, ON_SITE, AWAITING_PICKUP, COMPLETED, CANCELLED}" }
      - { name: billing_status, type: enum, source: system, default: UNBILLED, description: "UNBILLED -> ESTIMATED -> FINALIZED; independent of logistics_status", constraints: "one of {UNBILLED, ESTIMATED, FINALIZED}" }
      - { name: estimated_total_cents, type: integer, source: computed, default: 0, description: "Read-only provisional bill computed at delivery from estimated weight; see calc estimated_charge" }
      - { name: final_total_cents, type: integer, source: computed, default: 0, description: "Read-only finalized bill computed from the dump WeighTicket; see calc final_charge" }

  - name: ServiceStop
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> RentalOrder.id; the order this stop services" }
      - { name: route_id, type: string, source: system, default: null, description: "FK -> Route.id; route the stop is sequenced onto, else null while UNASSIGNED" }
      - { name: stop_type, type: enum, source: input, description: "Kind of service", constraints: "one of {DELIVERY, SWAP, PICKUP}" }
      - { name: sequence, type: integer, source: system, default: null, description: "1-based position within the route; null while UNASSIGNED" }
      - { name: estimated_weight_lbs, type: integer, source: input, default: 0, description: "Operator estimate of loaded weight for SWAP/PICKUP stops; 0 for DELIVERY", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: UNASSIGNED, description: "UNASSIGNED -> ASSIGNED -> COMPLETED; or -> CANCELLED", constraints: "one of {UNASSIGNED, ASSIGNED, COMPLETED, CANCELLED}" }

  - name: WeighTicket
    parent: null
    common_fields: false       # append-only scale event; immutable after creation
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> RentalOrder.id; order whose can was weighed" }
      - { name: service_stop_id, type: string, source: input, description: "FK -> ServiceStop.id; the SWAP or PICKUP stop that hauled the can to the scale" }
      - { name: gross_weight_lbs, type: integer, source: input, description: "Gross scale weight of truck plus loaded can", constraints: ">= 0" }
      - { name: tare_weight_lbs, type: integer, source: input, description: "Empty truck-plus-can tare weight", constraints: ">= 0" }
      - { name: net_weight_lbs, type: integer, source: computed, description: "Read-only = max(0, gross_weight_lbs - tare_weight_lbs)" }
      - { name: contaminated, type: boolean, source: input, default: false, description: "Whether prohibited items were found in the load at the scale" }
      - { name: contamination_kind, type: enum, source: input, default: NONE, description: "Prohibited material class driving the contamination fee", constraints: "one of {NONE, TIRES, APPLIANCES, HAZMAT}" }

  - name: StreetPermit
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> RentalOrder.id; the order whose street placement this permit covers" }
      - { name: municipality, type: string, source: input, description: "Issuing municipality name" }
      - { name: permit_fee_cents, type: integer, source: input, description: "Flat municipal fee passed through to the order's bill", constraints: ">= 0" }
      - { name: valid_from, type: string, source: input, description: "First date placement is permitted, ISO date YYYY-MM-DD" }
      - { name: valid_until, type: string, source: input, description: "Last date placement is permitted, ISO date YYYY-MM-DD; must be >= valid_from" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED -> APPROVED -> EXPIRED; or REQUESTED -> DENIED", constraints: "one of {REQUESTED, APPROVED, DENIED, EXPIRED}" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> RentalOrder.id; the order being billed" }
      - { name: account_id, type: string, source: system, description: "FK -> ContractorAccount.id; copied from the order at finalization" }
      - { name: base_cents, type: integer, source: computed, description: "Read-only base haul charge copied from ContainerType.base_rate_cents at finalization" }
      - { name: overage_day_cents, type: integer, source: computed, description: "Read-only computed overage-day charge; see calc final_charge" }
      - { name: tonnage_cents, type: integer, source: computed, description: "Read-only computed tonnage-overage charge; see calc final_charge" }
      - { name: permit_cents, type: integer, source: computed, default: 0, description: "Read-only StreetPermit.permit_fee_cents if an APPROVED permit exists, else 0" }
      - { name: contamination_cents, type: integer, source: computed, default: 0, description: "Read-only contamination fee; see calc contamination_fee" }
      - { name: total_cents, type: integer, source: computed, description: "Read-only = base_cents + overage_day_cents + tonnage_cents + permit_cents + contamination_cents" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED -> PAID -> VOID; or ISSUED -> VOID", constraints: "one of {ISSUED, PAID, VOID}" }

  - name: ClockState
    parent: null
    common_fields: false
    fields:
      - { name: current_date, type: string, source: input, description: "Server business date used for permit-expiry and overage-day evaluation, ISO date YYYY-MM-DD" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Container
    initial_state: IN_YARD
    terminal_states: []      # OUT_OF_SERVICE is reversible by admin restore; no true terminal
    transitions:
      - from: IN_YARD
        to: ASSIGNED
        trigger: "POST /rental-orders/{orderId}/dispatch-delivery (assigns this container to the order's DELIVERY stop)"
        actor: Dispatcher
        preconditions:
          - "Container.status == IN_YARD (ERR_CONTAINER_NOT_AVAILABLE)"
          - "Container.container_type_id == RentalOrder.container_type_id (ERR_CONTAINER_TYPE_MISMATCH)"
          - "request body expected_container_version matches Container.version (ERR_STALE_CONTAINER_VERSION)"
        side_effects:
          - "Container.current_order_id = order.id"
          - "increments Container.version by 1"
          - "RentalOrder.container_id = container.id"
          - "the order's DELIVERY ServiceStop.status UNASSIGNED -> ASSIGNED and is sequenced onto the route (see ServiceStop machine)"
      - from: ASSIGNED
        to: ON_SITE
        trigger: "POST /service-stops/{stopId}/complete on the DELIVERY stop"
        actor: Dispatcher
        preconditions:
          - "the completing ServiceStop is the DELIVERY stop of Container.current_order_id"
        side_effects:
          - "increments Container.version by 1"
      - from: ON_SITE
        to: AWAITING_DUMP
        trigger: "POST /service-stops/{stopId}/complete on a SWAP or PICKUP stop"
        actor: Dispatcher
        preconditions:
          - "the completing ServiceStop services Container.current_order_id"
          - "a WeighTicket exists for the completing stop (ERR_WEIGH_TICKET_REQUIRED)"
        side_effects:
          - "increments Container.version by 1"
          - "on PICKUP: this container is now headed to the scale/yard (see return transition)"
          - "on SWAP: a fresh container is dispatched and this one goes AWAITING_DUMP"
      - from: AWAITING_DUMP
        to: IN_YARD
        trigger: "POST /containers/{containerId}/return-to-yard"
        actor: Dispatcher
        preconditions:
          - "Container.status == AWAITING_DUMP (ERR_CONTAINER_NOT_AWAITING_DUMP)"
        side_effects:
          - "Container.current_order_id = null"
          - "increments Container.version by 1"
      - from: IN_YARD
        to: OUT_OF_SERVICE
        trigger: "POST /containers/{containerId}/retire-asset"
        actor: YardAdmin
        preconditions:
          - "Container.status == IN_YARD (ERR_CONTAINER_NOT_AVAILABLE)"
        side_effects:
          - "increments Container.version by 1"
      - from: OUT_OF_SERVICE
        to: IN_YARD
        trigger: "POST /containers/{containerId}/restore-asset"
        actor: YardAdmin
        preconditions:
          - "Container.status == OUT_OF_SERVICE (ERR_CONTAINER_NOT_OUT_OF_SERVICE)"
        side_effects:
          - "increments Container.version by 1"

  - entity: RentalOrder
    initial_state: BOOKED                # logistics_status dimension (parallel with billing_status)
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: SCHEDULED
        trigger: "POST /rental-orders/{orderId}/dispatch-delivery"
        actor: Dispatcher
        preconditions:
          - "RentalOrder.logistics_status == BOOKED (ERR_ORDER_NOT_BOOKED)"
          - "ContractorAccount.status == ACTIVE (ERR_ACCOUNT_SUSPENDED)"
          - "if RentalOrder.requires_street_permit then an APPROVED StreetPermit exists for the order whose [valid_from, valid_until] covers requested_delivery_date (ERR_PERMIT_NOT_APPROVED)"
          - "a Container of the matching type is assignable (see Container IN_YARD->ASSIGNED)"
        side_effects:
          - "Container assigned (Container IN_YARD -> ASSIGNED cascade); RentalOrder.container_id set"
        note: "the order's DELIVERY ServiceStop is sequenced onto a route separately via POST /routes/{routeId}/stops; it must be ASSIGNED (on a DISPATCHED route) before it can be completed"
      - from: SCHEDULED
        to: ON_SITE
        trigger: "POST /service-stops/{stopId}/complete on the DELIVERY stop"
        actor: Dispatcher
        preconditions:
          - "RentalOrder.logistics_status == SCHEDULED (ERR_ORDER_NOT_SCHEDULED)"
        side_effects:
          - "RentalOrder.delivered_on = Route.service_date of the completing stop"
          - "Container ASSIGNED -> ON_SITE cascade"
      - from: ON_SITE
        to: AWAITING_PICKUP
        trigger: "POST /service-stops/{stopId}/complete on a PICKUP stop"
        actor: Dispatcher
        preconditions:
          - "RentalOrder.logistics_status == ON_SITE (ERR_ORDER_NOT_ON_SITE)"
          - "a WeighTicket exists for the completing PICKUP stop (ERR_WEIGH_TICKET_REQUIRED)"
        side_effects:
          - "RentalOrder.picked_up_on = Route.service_date of the completing stop"
          - "RentalOrder.rental_days recomputed = picked_up_on - delivered_on + 1"
          - "billing dimension: order auto-estimated then finalized in the billing machine on the SAME complete call (see RentalOrder.billing UNBILLED->ESTIMATED->FINALIZED note)"
          - "Container ON_SITE -> AWAITING_DUMP cascade"
      - from: AWAITING_PICKUP
        to: COMPLETED
        trigger: "system (automatic on the same PICKUP-complete call, immediately after billing finalizes)"
        actor: system
        preconditions:
          - "RentalOrder.billing_status == FINALIZED"
        side_effects:
          - "this is the cascade tail: PICKUP complete -> order finalize -> Invoice issue -> account.outstanding recompute"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /rental-orders/{orderId}/cancel"
        actor: Contractor
        preconditions:
          - "RentalOrder.logistics_status == BOOKED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "any UNASSIGNED ServiceStops on the order -> CANCELLED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /rental-orders/{orderId}/cancel"
        actor: Contractor
        preconditions:
          - "RentalOrder.logistics_status == SCHEDULED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "the assigned DELIVERY ServiceStop -> CANCELLED (Route.stop_count recomputed)"
          - "the assigned Container is released: Container ASSIGNED -> IN_YARD directly, Container.current_order_id = null, Container.version += 1"
          - "RentalOrder.container_id = null"

  # RentalOrder billing dimension (parallel state axis on the same row)
  - entity: RentalOrder
    initial_state: UNBILLED              # billing_status dimension
    terminal_states: [FINALIZED]
    transitions:
      - from: UNBILLED
        to: ESTIMATED
        trigger: "system (on PICKUP-stop complete, before finalize)"
        actor: system
        preconditions:
          - "RentalOrder.billing_status == UNBILLED"
        side_effects:
          - "RentalOrder.estimated_total_cents = calc estimated_charge using the PICKUP ServiceStop.estimated_weight_lbs"
      - from: ESTIMATED
        to: FINALIZED
        trigger: "system (on PICKUP-stop complete, immediately after estimate, using the stop's WeighTicket)"
        actor: system
        preconditions:
          - "RentalOrder.billing_status == ESTIMATED"
          - "a WeighTicket exists for the PICKUP stop"
        side_effects:
          - "RentalOrder.final_total_cents = calc final_charge using WeighTicket.net_weight_lbs"
          - "an Invoice is issued (Invoice.status = ISSUED) with line items base/overage_day/tonnage/permit/contamination"
          - "ContractorAccount.outstanding_cents recomputed (ledger sync, see calc account_outstanding)"

  - entity: ServiceStop
    initial_state: UNASSIGNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: "POST /routes/{routeId}/stops (sequences this stop onto the route) with expected_route_version"
        actor: Dispatcher
        preconditions:
          - "ServiceStop.status == UNASSIGNED (ERR_STOP_NOT_UNASSIGNED)"
          - "Route.status == PLANNING (ERR_ROUTE_NOT_PLANNING)"
          - "Route.stop_count < Route.capacity_stops (ERR_ROUTE_AT_CAPACITY)"
          - "request body expected_route_version matches Route.version (ERR_STALE_ROUTE_VERSION)"
        side_effects:
          - "ServiceStop.route_id = route.id"
          - "ServiceStop.sequence = Route.stop_count + 1 (appended last)"
          - "Route.stop_count += 1"
          - "increments Route.version by 1"
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /service-stops/{stopId}/complete"
        actor: Dispatcher
        preconditions:
          - "ServiceStop.status == ASSIGNED (ERR_STOP_NOT_ASSIGNED)"
          - "Route.status == DISPATCHED (ERR_ROUTE_NOT_DISPATCHED)"
          - "for SWAP/PICKUP: a WeighTicket exists referencing this stop (ERR_WEIGH_TICKET_REQUIRED)"
        side_effects:
          - "drives the owning RentalOrder logistics transition (DELIVERY->ON_SITE, PICKUP->AWAITING_PICKUP->COMPLETED, see RentalOrder machine)"
          - "drives the assigned Container transition (see Container machine)"
      - from: UNASSIGNED
        to: CANCELLED
        trigger: "POST /rental-orders/{orderId}/cancel (cascade) or POST /service-stops/{stopId}/cancel"
        actor: Contractor
        preconditions:
          - "ServiceStop.status == UNASSIGNED (ERR_STOP_NOT_CANCELLABLE)"
        side_effects: []
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /rental-orders/{orderId}/cancel (cascade on SCHEDULED order) or POST /service-stops/{stopId}/cancel"
        actor: Dispatcher
        preconditions:
          - "ServiceStop.status == ASSIGNED (ERR_STOP_NOT_CANCELLABLE)"
          - "Route.status == PLANNING (ERR_ROUTE_NOT_PLANNING)"
        side_effects:
          - "Route.stop_count -= 1 (recomputed over non-CANCELLED stops)"
          - "increments Route.version by 1"

  - entity: Route
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: DISPATCHED
        trigger: "POST /routes/{routeId}/dispatch"
        actor: Dispatcher
        preconditions:
          - "Route.status == PLANNING (ERR_ROUTE_NOT_PLANNING)"
          - "Route.stop_count >= 1 (ERR_ROUTE_EMPTY)"
        side_effects:
          - "increments Route.version by 1"
      - from: DISPATCHED
        to: CLOSED
        trigger: "POST /routes/{routeId}/close"
        actor: Dispatcher
        preconditions:
          - "Route.status == DISPATCHED (ERR_ROUTE_NOT_DISPATCHED)"
          - "every non-CANCELLED ServiceStop on the route is COMPLETED (ERR_ROUTE_HAS_OPEN_STOPS)"
        side_effects:
          - "increments Route.version by 1"

  - entity: StreetPermit
    initial_state: REQUESTED
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /street-permits/{permitId}/approve"
        actor: PermitOfficer
        preconditions:
          - "StreetPermit.status == REQUESTED (ERR_PERMIT_NOT_REQUESTED)"
          - "ClockState.current_date <= StreetPermit.valid_until (ERR_PERMIT_WINDOW_PASSED)"
          - "no other APPROVED StreetPermit on the same order has a [valid_from, valid_until] window overlapping this one — closed-interval overlap, sharing any single calendar day counts (ERR_PERMIT_WINDOW_OVERLAP)"
        side_effects: []
      - from: REQUESTED
        to: DENIED
        trigger: "POST /street-permits/{permitId}/deny"
        actor: PermitOfficer
        preconditions:
          - "StreetPermit.status == REQUESTED (ERR_PERMIT_NOT_REQUESTED)"
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /street-permits/{permitId}/expire-check"
        actor: PermitOfficer
        preconditions:
          - "StreetPermit.status == APPROVED (ERR_PERMIT_NOT_APPROVED)"
          - "ClockState.current_date > StreetPermit.valid_until (ERR_PERMIT_NOT_EXPIRED)"
        side_effects: []

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{invoiceId}/pay"
        actor: BillingClerk
        preconditions:
          - "Invoice.status == ISSUED (ERR_INVOICE_NOT_ISSUED)"
        side_effects:
          - "ContractorAccount.outstanding_cents recomputed (this invoice leaves the unpaid set)"
      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{invoiceId}/void"
        actor: BillingClerk
        preconditions:
          - "Invoice.status == ISSUED (ERR_INVOICE_NOT_ISSUED)"
        side_effects:
          - "ContractorAccount.outstanding_cents recomputed (this invoice leaves the unpaid set)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: dispatch-delivery-stale-container
    parent_entity: Container
    write_endpoint: "POST /rental-orders/{orderId}/dispatch-delivery"
    occ_field: "expected_container_version"
    description: |
      Dispatching a delivery commits a specific IN_YARD container to the order.
      If the container's version has advanced since the dispatcher last read it
      (because the same can was committed to a different order, retired, or
      restored in the interim), the dispatch carries a stale view of the can and
      is rejected. The losing dispatch observed an IN_YARD can that another
      sanctioned dispatch legitimately took first.
    error_id: ERR_STALE_CONTAINER_VERSION
    http_status: 412

  - rule_id: route-add-stop-stale-route
    parent_entity: Route
    write_endpoint: "POST /routes/{routeId}/stops"
    occ_field: "expected_route_version"
    description: |
      Appending a ServiceStop to a route assigns it the next sequence number and
      increments stop_count. If the route's version has advanced since the
      dispatcher last read it (another stop was appended or cancelled, changing
      stop_count and the next free sequence), the append carries a stale view of
      the route's sequencing and is rejected, so two appends cannot both claim
      the same sequence slot.
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: net_weight
    trigger: "WeighTicket creation (POST /weigh-tickets)"
    algorithm: aggregation
    formula: |
      net_weight_lbs = max(0, gross_weight_lbs - tare_weight_lbs)
    input_set: "the single WeighTicket being created"
    constants: {}
    precision: "integer pounds, no rounding"

  - name: overage_day_charge
    trigger: "billing finalize (PICKUP-stop complete) and estimate"
    algorithm: threshold
    formula: |
      # rental_days is inclusive: picked_up_on - delivered_on + 1
      billable_overage_days = max(0, rental_days - ContainerType.included_days)
      overage_day_cents = billable_overage_days * ContainerType.overage_day_cents
      # boundary: rental_days == included_days yields 0; included_days + 1 yields one overage day
    input_set: "the order's delivered_on / picked_up_on and its ContainerType"
    constants: {}
    precision: "integer cents"

  - name: tonnage_overage_charge
    trigger: "billing finalize and estimate"
    algorithm: threshold
    formula: |
      # weight source differs by variant (see variants)
      billable_overage_lbs = max(0, weight_lbs - ContainerType.included_tonnage_lbs)
      tonnage_cents = billable_overage_lbs * ContainerType.overage_rate_cents_per_lb
      # boundary: weight_lbs == included_tonnage_lbs yields 0; +1 lb yields overage_rate_cents_per_lb
    input_set: "weight_lbs (estimate vs final per variant) and the order's ContainerType"
    constants: {}
    precision: "integer cents"
    variants:
      - name: estimated_tonnage
        when: "billing_status UNBILLED -> ESTIMATED on PICKUP complete"
        difference: "weight_lbs = the PICKUP ServiceStop.estimated_weight_lbs (operator estimate)"
      - name: final_tonnage
        when: "billing_status ESTIMATED -> FINALIZED on the same PICKUP complete"
        difference: "weight_lbs = the PICKUP stop's WeighTicket.net_weight_lbs (scale truth); replaces the estimate"

  - name: contamination_fee
    trigger: "billing finalize"
    algorithm: tiered_pricing
    formula: |
      # tiered on the WeighTicket.contamination_kind of the PICKUP stop's ticket;
      # fee is a flat per-kind amount PLUS a surcharge on overage tonnage for HAZMAT
      if not WeighTicket.contaminated or contamination_kind == NONE:
        contamination_cents = 0
      elif contamination_kind == TIRES:
        contamination_cents = TIRES_FLAT_CENTS
      elif contamination_kind == APPLIANCES:
        contamination_cents = APPLIANCES_FLAT_CENTS
      elif contamination_kind == HAZMAT:
        # HAZMAT: flat fee + a per-pound surcharge applied to the SAME overage pounds
        # billed in tonnage_overage_charge final variant (not the full net weight)
        billable_overage_lbs = max(0, net_weight_lbs - ContainerType.included_tonnage_lbs)
        contamination_cents = HAZMAT_FLAT_CENTS + billable_overage_lbs * HAZMAT_SURCHARGE_CENTS_PER_LB
    input_set: "the PICKUP stop's WeighTicket and the order's ContainerType"
    constants:
      TIRES_FLAT_CENTS: 7500
      APPLIANCES_FLAT_CENTS: 12000
      HAZMAT_FLAT_CENTS: 50000
      HAZMAT_SURCHARGE_CENTS_PER_LB: 15
    precision: "integer cents"

  - name: estimated_charge
    trigger: "billing_status UNBILLED -> ESTIMATED (PICKUP complete)"
    algorithm: aggregation
    formula: |
      # provisional bill before the scale ticket is read; contamination is NOT
      # knowable from an estimate, so it is excluded and permit is included only
      # if APPROVED. Evaluation order is pinned:
      #   1. base = ContainerType.base_rate_cents
      #   2. overage_day = overage_day_charge (uses rental_days)
      #   3. tonnage = tonnage_overage_charge[estimated_tonnage variant]
      #   4. permit = APPROVED StreetPermit.permit_fee_cents for the order else 0
      # estimated_total_cents = base + overage_day + tonnage + permit
      estimated_total_cents = base_cents + overage_day_cents + tonnage_cents_estimated + permit_cents
    input_set: "order's ContainerType, rental_days, PICKUP stop estimated_weight_lbs, APPROVED permit if any"
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional
        when: "at ESTIMATED"
        difference: "uses estimated_weight_lbs; omits contamination_cents entirely"

  - name: final_charge
    trigger: "billing_status ESTIMATED -> FINALIZED (same PICKUP complete)"
    algorithm: aggregation
    formula: |
      # finalized bill from the scale. Evaluation order pinned (same skeleton as
      # estimated_charge but with the scale weight and contamination added):
      #   1. base = ContainerType.base_rate_cents
      #   2. overage_day = overage_day_charge (uses rental_days)
      #   3. tonnage = tonnage_overage_charge[final_tonnage variant] (WeighTicket.net_weight_lbs)
      #   4. permit = APPROVED StreetPermit.permit_fee_cents for the order else 0
      #   5. contamination = contamination_fee (reads net_weight overage for HAZMAT surcharge,
      #      so tonnage MUST be computed before contamination — pinned order)
      # final_total_cents = base + overage_day + tonnage + permit + contamination
      final_total_cents = base_cents + overage_day_cents + tonnage_cents_final + permit_cents + contamination_cents
    input_set: "order's ContainerType, rental_days, PICKUP stop's WeighTicket.net_weight_lbs + contamination, APPROVED permit if any"
    constants: {}
    precision: "integer cents"
    variants:
      - name: final
        when: "at FINALIZED"
        difference: "uses WeighTicket.net_weight_lbs (scale) and includes contamination_cents; differs from provisional whenever estimate != scale or any contamination is found"

  - name: account_outstanding
    trigger: "Invoice issue, Invoice pay, Invoice void"
    algorithm: aggregation
    formula: |
      outstanding_cents = sum(inv.total_cents
                              for inv in Invoices where inv.account_id == account.id
                              and inv.status == ISSUED)
      # only ISSUED invoices count; PAID and VOID are excluded.
      available_credit_cents = credit_limit_cents - outstanding_cents
    input_set: "all Invoices on the account; only status == ISSUED enter the sum"
    constants: {}
    precision: "integer cents"

  - name: credit_availability
    trigger: "account read (current variant) and order booking credit check (projected variant)"
    algorithm: forward_looking
    formula: |
      # Two valid readings of the SAME account credit, on the ContractorAccount
      # domain (distinct from the RentalOrder billing dual-variant):
      #   current   = credit_limit_cents - outstanding_cents
      #             (what GET /contractor-accounts/{id} reports as available_credit_cents)
      #   projected = current - prospective_base_rate_cents
      #             (used by the POST /rental-orders credit gate: a booking is
      #              rejected with ERR_CREDIT_LIMIT_EXCEEDED iff projected < 0, i.e.
      #              the new order's ContainerType.base_rate_cents would push the
      #              account past its credit_limit)
      # The two readings diverge by exactly the prospective order's base_rate_cents.
    input_set: "the account's credit_limit_cents, outstanding_cents, and (projected only) the new order's ContainerType.base_rate_cents"
    constants: {}
    precision: "integer cents"
    variants:
      - name: current
        when: "GET /contractor-accounts/{id} — available_credit_cents shown to the client"
        difference: "credit_limit_cents - outstanding_cents; ignores any in-flight booking"
      - name: projected
        when: "POST /rental-orders credit gate"
        difference: "subtracts the prospective order's base_rate_cents; the booking is rejected iff this is < 0"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource ids exist (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints referencing a resource id

  - priority: 4
    category: business_referential
    check: "Contractor acting on a RentalOrder/ServiceStop/Invoice must own it (resource.account_id == X-User-ID for entity-backed Contractor)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Contractor-scoped reads/writes on orders, stops, invoices"

  - priority: 5
    category: state
    check: "Target resource is in the correct state for the requested transition"
    error_id: "varies (ERR_ORDER_NOT_BOOKED, ERR_STOP_NOT_ASSIGNED, ERR_ROUTE_NOT_PLANNING, ERR_INVOICE_NOT_ISSUED, ERR_PERMIT_NOT_REQUESTED, ERR_CONTAINER_NOT_AVAILABLE, ...)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "On dispatch-delivery, the selected container's container_type_id must equal the order's container_type_id"
    error_id: ERR_CONTAINER_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /rental-orders/{orderId}/dispatch-delivery"

  - priority: 7
    category: business_safety
    check: "On dispatch-delivery, if order.requires_street_permit then an APPROVED StreetPermit for the order covering requested_delivery_date must exist"
    error_id: ERR_PERMIT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /rental-orders/{orderId}/dispatch-delivery"

  - priority: 8
    category: business_safety
    check: "Completing a SWAP/PICKUP stop requires a WeighTicket referencing that stop"
    error_id: ERR_WEIGH_TICKET_REQUIRED
    http_status: 409
    applies_to: "POST /service-stops/{stopId}/complete (SWAP/PICKUP)"

  - priority: 9
    category: business_constraint
    check: "Appending a stop to a route requires Route.stop_count < Route.capacity_stops"
    error_id: ERR_ROUTE_AT_CAPACITY
    http_status: 409
    applies_to: "POST /routes/{routeId}/stops"

  - priority: 10
    category: business_temporal
    check: "Permit approval requires current_date <= valid_until; permit window [valid_from, valid_until] must cover requested_delivery_date at dispatch"
    error_id: ERR_PERMIT_WINDOW_PASSED
    http_status: 409
    applies_to: "POST /street-permits/{permitId}/approve, dispatch-delivery"

  - priority: 11
    category: business_temporal
    check: "Approving a permit when the order already holds another APPROVED permit whose closed date window [valid_from, valid_until] overlaps this one (windows sharing any single calendar day overlap) is rejected"
    error_id: ERR_PERMIT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /street-permits/{permitId}/approve"

  - priority: 12
    category: business_temporal
    check: "valid_until must be >= valid_from on permit creation; end_hour/date ordering"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /street-permits, POST /routes"

  - priority: 13
    category: business_fiscal
    check: "Creating a new RentalOrder requires account.status == ACTIVE and the order's projected base_rate_cents <= available_credit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /rental-orders"

  - priority: 14
    category: business_constraint
    check: "Required input fields present and well-typed (enum membership, non-negative integers)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all create/update endpoints

  - priority: 15
    category: business_constraint
    check: "asset_tag unique across containers; truck_code unique per service_date; size_code unique across active ContainerTypes"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /containers, POST /routes, POST /container-types"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- ContainerType ----
  - method: POST
    path: "/container-types"
    description: "Create a container size/pricing type"
    roles: [YardAdmin]
    code: 201
    input: [size_code, base_rate_cents, included_days, overage_day_cents, included_tonnage_lbs, overage_rate_cents_per_lb]
    output: ContainerType
    side_effects: ["active = true"]
  - method: GET
    path: "/container-types"
    description: "List container types"
    roles: [YardAdmin, Dispatcher, Contractor, BillingClerk, ScaleOperator, PermitOfficer]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: "ContainerType[]"
    side_effects: []
  - method: GET
    path: "/container-types/{typeId}"
    description: "Get a container type"
    roles: [YardAdmin, Dispatcher, Contractor, BillingClerk, ScaleOperator, PermitOfficer]
    code: 200
    input: []
    output: ContainerType
    side_effects: []
  - method: POST
    path: "/container-types/{typeId}/retire"
    description: "Mark a container type inactive for new orders"
    roles: [YardAdmin]
    code: 200
    input: []
    output: ContainerType
    side_effects: ["active = false"]

  # ---- ContractorAccount ----
  - method: POST
    path: "/contractor-accounts"
    description: "Open a contractor credit account"
    roles: [YardAdmin]
    code: 201
    input: [business_name, credit_limit_cents]
    output: ContractorAccount
    side_effects: ["outstanding_cents = 0", "status = ACTIVE"]
  - method: GET
    path: "/contractor-accounts"
    description: "List contractor accounts"
    roles: [YardAdmin, BillingClerk, Dispatcher]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ContractorAccount[]"
    side_effects: []
  - method: GET
    path: "/contractor-accounts/{accountId}"
    description: "Get a contractor account (computed outstanding/available)"
    roles: [YardAdmin, BillingClerk, Dispatcher, Contractor]
    code: 200
    input: []
    output: ContractorAccount
    side_effects: []
  - method: POST
    path: "/contractor-accounts/{accountId}/suspend"
    description: "Suspend an account (blocks new orders)"
    roles: [YardAdmin, BillingClerk]
    code: 200
    input: []
    output: ContractorAccount
    side_effects: ["status = SUSPENDED"]
  - method: POST
    path: "/contractor-accounts/{accountId}/reinstate"
    description: "Reinstate a suspended account"
    roles: [YardAdmin, BillingClerk]
    code: 200
    input: []
    output: ContractorAccount
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/contractor-accounts/{accountId}/orders"
    description: "List rental orders for an account (FK reverse-reachability for RentalOrder.account_id)"
    roles: [YardAdmin, BillingClerk, Dispatcher, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: "RentalOrder[]"
    side_effects: []
  - method: GET
    path: "/contractor-accounts/{accountId}/invoices"
    description: "List invoices for an account (FK reverse-reachability for Invoice.account_id)"
    roles: [YardAdmin, BillingClerk, Contractor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  # ---- Container ----
  - method: POST
    path: "/containers"
    description: "Register a physical container in the yard"
    roles: [YardAdmin]
    code: 201
    input: [container_type_id, asset_tag, yard_code]
    output: Container
    side_effects: ["status = IN_YARD"]
  - method: GET
    path: "/containers"
    description: "List/filter containers (filtered-list reverse-reachability for Container.container_type_id and Container.current_order_id)"
    roles: [YardAdmin, Dispatcher]
    code: 200
    input: ["container_type_id?", "current_order_id?", "status?", "yard_code?", "limit?", "offset?"]
    output: "Container[]"
    side_effects: []
  - method: GET
    path: "/containers/{containerId}"
    description: "Get a container"
    roles: [YardAdmin, Dispatcher]
    code: 200
    input: []
    output: Container
    side_effects: []
  - method: POST
    path: "/containers/{containerId}/return-to-yard"
    description: "Return an AWAITING_DUMP container to the yard"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Container
    side_effects: ["status AWAITING_DUMP -> IN_YARD", "current_order_id = null", "increments Container.version by 1"]
  - method: POST
    path: "/containers/{containerId}/retire-asset"
    description: "Take an IN_YARD container out of service"
    roles: [YardAdmin]
    code: 200
    input: []
    output: Container
    side_effects: ["status IN_YARD -> OUT_OF_SERVICE", "increments Container.version by 1"]
  - method: POST
    path: "/containers/{containerId}/restore-asset"
    description: "Restore an OUT_OF_SERVICE container to the yard"
    roles: [YardAdmin]
    code: 200
    input: []
    output: Container
    side_effects: ["status OUT_OF_SERVICE -> IN_YARD", "increments Container.version by 1"]

  # ---- RentalOrder ----
  - method: POST
    path: "/rental-orders"
    description: "Book a rental order (credit-checked against the account)"
    roles: [Contractor, Dispatcher]
    code: 201
    input: [account_id, container_type_id, site_address, requested_delivery_date, "requires_street_permit?"]
    output: RentalOrder
    side_effects:
      - "logistics_status = BOOKED, billing_status = UNBILLED"
      - "a DELIVERY ServiceStop is created in UNASSIGNED status for the order"
      - "credit check: base_rate_cents <= available_credit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
  - method: GET
    path: "/rental-orders"
    description: "List/filter rental orders (filtered-list reverse-reachability for RentalOrder.container_type_id and RentalOrder.container_id)"
    roles: [YardAdmin, Dispatcher, BillingClerk, Contractor]
    code: 200
    input: ["account_id?", "container_type_id?", "container_id?", "logistics_status?", "billing_status?", "limit?", "offset?"]
    output: "RentalOrder[]"
    side_effects: []
  - method: GET
    path: "/rental-orders/{orderId}"
    description: "Get a rental order (computed estimated/final totals)"
    roles: [YardAdmin, Dispatcher, BillingClerk, Contractor]
    code: 200
    input: []
    output: RentalOrder
    side_effects: []
  - method: GET
    path: "/rental-orders/{orderId}/service-stops"
    description: "List service stops for an order (FK reverse-reachability for ServiceStop.order_id)"
    roles: [YardAdmin, Dispatcher, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: "ServiceStop[]"
    side_effects: []
  - method: GET
    path: "/rental-orders/{orderId}/weigh-tickets"
    description: "List weigh tickets for an order (FK reverse-reachability for WeighTicket.order_id)"
    roles: [YardAdmin, Dispatcher, BillingClerk, ScaleOperator, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: "WeighTicket[]"
    side_effects: []
  - method: GET
    path: "/rental-orders/{orderId}/street-permits"
    description: "List street permits for an order (FK reverse-reachability for StreetPermit.order_id)"
    roles: [YardAdmin, Dispatcher, PermitOfficer, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: "StreetPermit[]"
    side_effects: []
  - method: GET
    path: "/rental-orders/{orderId}/invoice"
    description: "List the invoice(s) for an order (FK reverse-reachability for Invoice.order_id; array of 0-1)"
    roles: [YardAdmin, Dispatcher, BillingClerk, Contractor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []
  - method: POST
    path: "/rental-orders/{orderId}/swap-stop"
    description: "Create an UNASSIGNED SWAP ServiceStop for an ON_SITE order"
    roles: [Dispatcher, Contractor]
    code: 201
    input: ["estimated_weight_lbs?"]
    output: ServiceStop
    side_effects: ["a SWAP ServiceStop is created in UNASSIGNED status for the order"]
  - method: POST
    path: "/rental-orders/{orderId}/pickup-stop"
    description: "Create an UNASSIGNED PICKUP ServiceStop for an ON_SITE order"
    roles: [Dispatcher, Contractor]
    code: 201
    input: ["estimated_weight_lbs?"]
    output: ServiceStop
    side_effects: ["a PICKUP ServiceStop is created in UNASSIGNED status for the order"]
  - method: POST
    path: "/rental-orders/{orderId}/dispatch-delivery"
    description: "Commit a container and schedule the order's DELIVERY stop onto a route (OCC on the chosen container)"
    roles: [Dispatcher]
    code: 200
    input: [container_id, expected_container_version]
    output: RentalOrder
    side_effects:
      - "logistics_status BOOKED -> SCHEDULED"
      - "Container IN_YARD -> ASSIGNED, current_order_id = order.id, increments Container.version by 1"
      - "RentalOrder.container_id = container_id"
      - "note: the DELIVERY ServiceStop is sequenced onto a route separately via POST /routes/{routeId}/stops"
  - method: POST
    path: "/rental-orders/{orderId}/cancel"
    description: "Cancel a BOOKED or SCHEDULED order"
    roles: [Contractor, Dispatcher]
    code: 200
    input: []
    output: RentalOrder
    side_effects:
      - "logistics_status -> CANCELLED"
      - "UNASSIGNED stops -> CANCELLED; ASSIGNED DELIVERY stop -> CANCELLED (Route.stop_count recomputed, Route.version += 1)"
      - "if a container was assigned: Container ASSIGNED -> IN_YARD, current_order_id = null, Container.version += 1, order.container_id = null"

  # ---- Route ----
  - method: POST
    path: "/routes"
    description: "Create a dispatch route for a service date"
    roles: [Dispatcher]
    code: 201
    input: [service_date, truck_code, capacity_stops]
    output: Route
    side_effects: ["status = PLANNING", "stop_count = 0"]
  - method: GET
    path: "/routes"
    description: "List/filter routes"
    roles: [YardAdmin, Dispatcher]
    code: 200
    input: ["service_date?", "status?", "limit?", "offset?"]
    output: "Route[]"
    side_effects: []
  - method: GET
    path: "/routes/{routeId}"
    description: "Get a route"
    roles: [YardAdmin, Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects: []
  - method: GET
    path: "/routes/{routeId}/stops"
    description: "List service stops sequenced on a route (FK reverse-reachability for ServiceStop.route_id)"
    roles: [YardAdmin, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: "ServiceStop[]"
    side_effects: []
  - method: POST
    path: "/routes/{routeId}/stops"
    description: "Append an UNASSIGNED service stop to a PLANNING route (OCC on the route)"
    roles: [Dispatcher]
    code: 200
    input: [service_stop_id, expected_route_version]
    output: ServiceStop
    side_effects:
      - "ServiceStop UNASSIGNED -> ASSIGNED, route_id set, sequence = old stop_count + 1"
      - "Route.stop_count += 1, increments Route.version by 1"
  - method: POST
    path: "/routes/{routeId}/dispatch"
    description: "Dispatch a planned route (locks sequence; stops become completable)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects: ["status PLANNING -> DISPATCHED", "increments Route.version by 1"]
  - method: POST
    path: "/routes/{routeId}/close"
    description: "Close a dispatched route once all its stops are completed"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects: ["status DISPATCHED -> CLOSED", "increments Route.version by 1"]

  # ---- ServiceStop ----
  - method: GET
    path: "/service-stops"
    description: "List/filter service stops (filtered-list reverse-reachability for ServiceStop.order_id and ServiceStop.route_id)"
    roles: [YardAdmin, Dispatcher, Contractor]
    code: 200
    input: ["order_id?", "route_id?", "stop_type?", "status?", "limit?", "offset?"]
    output: "ServiceStop[]"
    side_effects: []
  - method: GET
    path: "/service-stops/{stopId}"
    description: "Get a service stop"
    roles: [YardAdmin, Dispatcher, Contractor]
    code: 200
    input: []
    output: ServiceStop
    side_effects: []
  - method: POST
    path: "/service-stops/{stopId}/complete"
    description: "Complete an ASSIGNED stop on a DISPATCHED route; drives order + container + billing cascade"
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServiceStop
    side_effects:
      - "ServiceStop ASSIGNED -> COMPLETED"
      - "DELIVERY: order BOOKED logistics SCHEDULED -> ON_SITE, order.delivered_on set, Container ASSIGNED -> ON_SITE"
      - "PICKUP: order ON_SITE -> AWAITING_PICKUP -> COMPLETED, order.picked_up_on + rental_days set, billing UNBILLED -> ESTIMATED -> FINALIZED, Invoice issued, account.outstanding recomputed, Container ON_SITE -> AWAITING_DUMP"
      - "SWAP: Container ON_SITE -> AWAITING_DUMP (old can), order stays ON_SITE"
  - method: POST
    path: "/service-stops/{stopId}/cancel"
    description: "Cancel an UNASSIGNED stop, or an ASSIGNED stop while its route is still PLANNING"
    roles: [Dispatcher, Contractor]
    code: 200
    input: []
    output: ServiceStop
    side_effects: ["status -> CANCELLED", "if was ASSIGNED: Route.stop_count -= 1, Route.version += 1"]

  # ---- WeighTicket ----
  - method: POST
    path: "/weigh-tickets"
    description: "Record a scale ticket for a SWAP/PICKUP stop"
    roles: [ScaleOperator]
    code: 201
    input: [order_id, service_stop_id, gross_weight_lbs, tare_weight_lbs, "contaminated?", "contamination_kind?"]
    output: WeighTicket
    side_effects: ["net_weight_lbs = max(0, gross - tare)"]
  - method: GET
    path: "/weigh-tickets"
    description: "List/filter weigh tickets (filtered-list reverse-reachability for WeighTicket.order_id and WeighTicket.service_stop_id)"
    roles: [YardAdmin, Dispatcher, BillingClerk, ScaleOperator]
    code: 200
    input: ["order_id?", "service_stop_id?", "contaminated?", "limit?", "offset?"]
    output: "WeighTicket[]"
    side_effects: []
  - method: GET
    path: "/weigh-tickets/{ticketId}"
    description: "Get a weigh ticket"
    roles: [YardAdmin, Dispatcher, BillingClerk, ScaleOperator]
    code: 200
    input: []
    output: WeighTicket
    side_effects: []

  # ---- StreetPermit ----
  - method: POST
    path: "/street-permits"
    description: "Request a street-placement permit for an order"
    roles: [PermitOfficer, Dispatcher, Contractor]
    code: 201
    input: [order_id, municipality, permit_fee_cents, valid_from, valid_until]
    output: StreetPermit
    side_effects: ["status = REQUESTED"]
  - method: GET
    path: "/street-permits"
    description: "List/filter street permits (filtered-list reverse-reachability for StreetPermit.order_id)"
    roles: [YardAdmin, Dispatcher, PermitOfficer, Contractor]
    code: 200
    input: ["order_id?", "status?", "limit?", "offset?"]
    output: "StreetPermit[]"
    side_effects: []
  - method: GET
    path: "/street-permits/{permitId}"
    description: "Get a street permit"
    roles: [YardAdmin, Dispatcher, PermitOfficer, Contractor]
    code: 200
    input: []
    output: StreetPermit
    side_effects: []
  - method: POST
    path: "/street-permits/{permitId}/approve"
    description: "Approve a requested permit"
    roles: [PermitOfficer]
    code: 200
    input: []
    output: StreetPermit
    side_effects: ["status REQUESTED -> APPROVED"]
  - method: POST
    path: "/street-permits/{permitId}/deny"
    description: "Deny a requested permit"
    roles: [PermitOfficer]
    code: 200
    input: []
    output: StreetPermit
    side_effects: ["status REQUESTED -> DENIED"]
  - method: POST
    path: "/street-permits/{permitId}/expire-check"
    description: "Expire an approved permit whose window has passed"
    roles: [PermitOfficer]
    code: 200
    input: []
    output: StreetPermit
    side_effects: ["status APPROVED -> EXPIRED (requires current_date > valid_until)"]

  # ---- Invoice ----
  - method: GET
    path: "/invoices"
    description: "List/filter invoices (filtered-list reverse-reachability for Invoice.order_id and Invoice.account_id)"
    roles: [YardAdmin, BillingClerk, Contractor]
    code: 200
    input: ["order_id?", "account_id?", "status?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []
  - method: GET
    path: "/invoices/{invoiceId}"
    description: "Get an invoice with line items"
    roles: [YardAdmin, BillingClerk, Contractor]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/invoices/{invoiceId}/pay"
    description: "Mark an issued invoice paid"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status ISSUED -> PAID", "account.outstanding recomputed"]
  - method: POST
    path: "/invoices/{invoiceId}/void"
    description: "Void an issued invoice"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status ISSUED -> VOID", "account.outstanding recomputed"]

  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set-current-date"
    description: "Set the server business date (test-driving endpoint for permit-expiry/overage evaluation)"
    roles: [YardAdmin]
    code: 200
    input: [current_date]
    output: ClockState
    side_effects: ["ClockState.current_date = current_date"]
  - method: GET
    path: "/_clock"
    description: "Read the current server business date"
    roles: [YardAdmin, Dispatcher, BillingClerk, ScaleOperator, PermitOfficer, Contractor]
    code: 200
    input: []
    output: ClockState
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth
  - { id: ERR_MISSING_AUTH_HEADERS, http: 401, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Contractor acting on an order/stop/invoice it does not own" }
  # existence
  - { id: ERR_CONTAINER_TYPE_NOT_FOUND, http: 404, condition: "ContainerType id not found" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "ContractorAccount id not found" }
  - { id: ERR_CONTAINER_NOT_FOUND, http: 404, condition: "Container id not found" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "RentalOrder id not found" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "Route id not found" }
  - { id: ERR_STOP_NOT_FOUND, http: 404, condition: "ServiceStop id not found" }
  - { id: ERR_WEIGH_TICKET_NOT_FOUND, http: 404, condition: "WeighTicket id not found" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "StreetPermit id not found" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id not found" }
  # validation / input
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/ill-typed required field or invalid enum value" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "valid_until < valid_from (or analogous reversed range)" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "asset_tag, (truck_code,service_date), or active size_code uniqueness violated" }
  # state
  - { id: ERR_ORDER_NOT_BOOKED, http: 409, condition: "dispatch-delivery requires order logistics_status BOOKED" }
  - { id: ERR_ORDER_NOT_SCHEDULED, http: 409, condition: "DELIVERY complete requires order logistics_status SCHEDULED" }
  - { id: ERR_ORDER_NOT_ON_SITE, http: 409, condition: "SWAP/PICKUP stop creation or PICKUP complete requires order logistics_status ON_SITE" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "cancel requires order logistics_status BOOKED or SCHEDULED" }
  - { id: ERR_STOP_NOT_UNASSIGNED, http: 409, condition: "route append requires stop status UNASSIGNED" }
  - { id: ERR_STOP_NOT_ASSIGNED, http: 409, condition: "complete requires stop status ASSIGNED" }
  - { id: ERR_STOP_NOT_CANCELLABLE, http: 409, condition: "stop cancel requires UNASSIGNED, or ASSIGNED while route is PLANNING" }
  - { id: ERR_ROUTE_NOT_PLANNING, http: 409, condition: "append/cancel-assigned/dispatch requires route status PLANNING" }
  - { id: ERR_ROUTE_NOT_DISPATCHED, http: 409, condition: "stop complete / route close requires route status DISPATCHED" }
  - { id: ERR_ROUTE_EMPTY, http: 409, condition: "dispatch requires stop_count >= 1" }
  - { id: ERR_ROUTE_HAS_OPEN_STOPS, http: 409, condition: "close requires every non-CANCELLED stop COMPLETED" }
  - { id: ERR_ROUTE_AT_CAPACITY, http: 409, condition: "append requires stop_count < capacity_stops" }
  - { id: ERR_CONTAINER_NOT_AVAILABLE, http: 409, condition: "dispatch/retire requires container status IN_YARD" }
  - { id: ERR_CONTAINER_NOT_AWAITING_DUMP, http: 409, condition: "return-to-yard requires container status AWAITING_DUMP" }
  - { id: ERR_CONTAINER_NOT_OUT_OF_SERVICE, http: 409, condition: "restore requires container status OUT_OF_SERVICE" }
  - { id: ERR_CONTAINER_TYPE_MISMATCH, http: 409, condition: "dispatched container type != order container type" }
  - { id: ERR_PERMIT_NOT_REQUESTED, http: 409, condition: "approve/deny requires permit status REQUESTED" }
  - { id: ERR_PERMIT_NOT_APPROVED, http: 409, condition: "dispatch requires APPROVED permit covering delivery date; or expire-check requires status APPROVED" }
  - { id: ERR_PERMIT_NOT_EXPIRED, http: 409, condition: "expire-check requires current_date > valid_until" }
  - { id: ERR_PERMIT_WINDOW_PASSED, http: 409, condition: "approve requires current_date <= valid_until; dispatch requires window covering requested_delivery_date" }
  - { id: ERR_PERMIT_WINDOW_OVERLAP, http: 409, condition: "approving a permit whose closed date window overlaps another APPROVED permit on the same order" }
  - { id: ERR_INVOICE_NOT_ISSUED, http: 409, condition: "pay/void requires invoice status ISSUED" }
  - { id: ERR_WEIGH_TICKET_REQUIRED, http: 409, condition: "completing a SWAP/PICKUP stop requires a WeighTicket for that stop" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 409, condition: "dispatch/create-order requires account status ACTIVE" }
  # fiscal
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "new order base_rate_cents exceeds account available_credit_cents" }
  # concurrency
  - { id: ERR_STALE_CONTAINER_VERSION, http: 412, condition: "expected_container_version != Container.version at dispatch-delivery" }
  - { id: ERR_STALE_ROUTE_VERSION, http: 412, condition: "expected_route_version != Route.version at route stop append" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Contractor
    description: "Renting customer; books and cancels own orders, requests swaps/pickups/permits, views own bills"
    identity: "entity_backed:ContractorAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /rental-orders — book own order (account_id must equal X-User-ID)"
      - "POST /rental-orders/{orderId}/cancel — cancel own order"
      - "POST /rental-orders/{orderId}/swap-stop — request swap on own order"
      - "POST /rental-orders/{orderId}/pickup-stop — request pickup on own order"
      - "POST /service-stops/{stopId}/cancel — cancel own UNASSIGNED stop"
      - "POST /street-permits — request permit for own order"
      - "GET own orders/stops/permits/weigh-tickets/invoices/accounts"

  - name: Dispatcher
    description: "Fleet/route operations; assigns containers, sequences stops, dispatches routes, completes stops"
    identity: "opaque"
    exclusive_operations:
      - "POST /rental-orders/{orderId}/dispatch-delivery — commit container + schedule"
      - "POST /containers/{containerId}/return-to-yard"
      - "POST /routes — create route"
      - "POST /routes/{routeId}/stops — append stop"
      - "POST /routes/{routeId}/dispatch"
      - "POST /routes/{routeId}/close"
      - "POST /service-stops/{stopId}/complete"
    shared_operations:
      - "POST /rental-orders — book order on behalf of contractor"
      - "POST /rental-orders/{orderId}/cancel"
      - "POST /rental-orders/{orderId}/swap-stop"
      - "POST /rental-orders/{orderId}/pickup-stop"
      - "POST /service-stops/{stopId}/cancel"
      - "POST /street-permits — request permit"
      - "GET routes/containers/orders/stops/weigh-tickets/permits"

  - name: YardAdmin
    description: "Yard/fleet master data; manages container types, containers, accounts"
    identity: "opaque"
    exclusive_operations:
      - "POST /container-types — create type"
      - "POST /container-types/{typeId}/retire"
      - "POST /containers — register container"
      - "POST /containers/{containerId}/retire-asset"
      - "POST /containers/{containerId}/restore-asset"
      - "POST /contractor-accounts — open account"
      - "POST /_clock/set-current-date — set business date"
    shared_operations:
      - "POST /contractor-accounts/{accountId}/suspend"
      - "POST /contractor-accounts/{accountId}/reinstate"
      - "GET most resources"

  - name: ScaleOperator
    description: "Scale-house staff; records weigh tickets and contamination findings"
    identity: "opaque"
    exclusive_operations:
      - "POST /weigh-tickets — record scale ticket"
    shared_operations:
      - "GET weigh-tickets, orders, container-types"

  - name: PermitOfficer
    description: "Municipal liaison; approves/denies/expires street permits"
    identity: "opaque"
    exclusive_operations:
      - "POST /street-permits/{permitId}/approve"
      - "POST /street-permits/{permitId}/deny"
      - "POST /street-permits/{permitId}/expire-check"
    shared_operations:
      - "POST /street-permits — request permit"
      - "GET permits, orders"

  - name: BillingClerk
    description: "Accounts-receivable; pays/voids invoices, suspends/reinstates accounts"
    identity: "opaque"
    exclusive_operations:
      - "POST /invoices/{invoiceId}/pay"
      - "POST /invoices/{invoiceId}/void"
    shared_operations:
      - "POST /contractor-accounts/{accountId}/suspend"
      - "POST /contractor-accounts/{accountId}/reinstate"
      - "GET invoices, accounts, orders, weigh-tickets"
