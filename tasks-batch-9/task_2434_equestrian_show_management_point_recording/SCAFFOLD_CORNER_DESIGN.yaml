            - call: "POST /shows"
              payload: { name: "Spring Classic", federation_show_id: "FED-2436", venue: "Ridgeline Park", competition_level: "LOCAL", start_utc: "2027-04-10T13:00:00Z", end_utc: "2027-04-13T22:00:00Z", entry_close_utc: "2027-04-01T00:00:00Z", prize_money_pool_cents: 500000, stall_capacity: 20, stall_fee_cents: 7500 }
              as: ShowSecretary
              captures: { show2_id: $.data.id }
            - call: "POST /shows/${show2_id}/divisions"
              payload: { name: "Open Jumper", discipline: "JUMPER", age_group: "OPEN", min_jump_height_cm: 100, max_jump_height_cm: 130, division_share_bp: 3333, jumpoff_enabled: true }
              as: ShowSecretary
              captures: { div_j2_id: $.data.id }
          trigger:
            - call: "POST /divisions/00000000-0000-0000-0000-0000000000d1/classes"
              payload: { class_number: 901, name: "Orphan Class", jump_height_cm: 120, entry_fee_cents: 25000, class_share_bp: 1000, max_entries: 30 }
              as: ShowSecretary
            - call: "POST /divisions/${div_j2_id}/classes"
              payload: { class_number: 301, name: "Cross Show Qualifier", jump_height_cm: 120, entry_fee_cents: 25000, class_share_bp: 1000, max_entries: 30, qualifier_for_class_id: "${class101_id}" }
