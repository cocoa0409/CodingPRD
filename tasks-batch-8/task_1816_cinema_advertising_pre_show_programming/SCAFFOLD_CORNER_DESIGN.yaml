            - { call: "POST /network/reels/${r_id}/slots", payload: { campaign_id: "${c_id}", start_offset_seconds: 120, expected_reel_version: "${rv3}" }, as: SalesManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400) even though the reel is also not ASSEMBLING"

      - name: existence_checked_before_state_on_lock
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=7]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 5) precedes state/OCC (priority 7): locking a nonexistent reel id returns 404 ERR_NOT_FOUND regardless of the expected_reel_version value carried."
        test_recipe:
          setup: ["one real reel exists so its version is observable; the trigger targets a different, nonexistent reel id"]
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { st_id: "$.data.id" } }
            - { call: "GET /network/showtimes/${st_id}/reel", payload: {}, as: NetworkOps, captures: { rv: "$.data[0].version" } }
          trigger:
            - { call: "POST /network/reels/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/lock", payload: { expected_reel_version: "${rv}" }, as: NetworkOps, captures: { err: "$.data.error_id" } }
          assert:
            - "http status 404 and error_id == ERR_NOT_FOUND (not 412, not 409)"

      - name: error_priority_pair_state_vs_fiscal
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "validations[priority=11]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_beats_fiscal_on_slot_create"
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_priority_pair_safety_vs_constraint
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "validations[priority=9]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / safety_beats_constraint_on_slot_create"
          rationale: "Asserted as the failure path of the named §1.8 instance."

