      - name: corner_val_close_claim_state_check_beats_moratorium_safety
        claim_type: priority_ordering
        grounds:
          - validations[priority=19]
          - errors[ERR_CLAIM_NOT_INSPECTED]
          - validations[priority=21]
          - errors[ERR_MORATORIUM_ACTIVE]
        excluded_because:
          difficulty_instance: pair_a_close_claim_state_19_beats_moratorium_safety_21
          rationale: "That §1.8 instance already stages a TRIAGED claim under an EFFECTIVE CANCELLATION_MORATORIUM and asserts ERR_CLAIM_NOT_INSPECTED wins."

      - name: corner_val_confirm_deployment_rest_buffer_beats_housing_capacity
        claim_type: priority_ordering
        grounds:
          - validations[priority=23]
          - errors[ERR_DEPLOYMENT_WINDOW_CONFLICT]
          - validations[priority=38]
          - errors[ERR_HOUSING_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: pair_b_confirm_deployment_temporal_23_beats_fiscal_38
          rationale: "That §1.8 instance already stages a confirm that simultaneously breaches the 12-hour rest buffer and the block's rooms_available and asserts ERR_DEPLOYMENT_WINDOW_CONFLICT wins."

      - name: corner_val_schedule_assignment_mode_mismatch_beats_adjuster_capacity
        claim_type: priority_ordering
        grounds:
          - validations[priority=29]
          - errors[ERR_INSPECTION_MODE_MISMATCH]
          - validations[priority=32]
          - errors[ERR_ADJUSTER_AT_CAPACITY]
        excluded_because:
          difficulty_instance: pair_c_schedule_assignment_referential_29_beats_constraint_32
          rationale: "That §1.8 instance already stages a FIELD request against an AERIAL-mode claim with an at-capacity adjuster and asserts ERR_INSPECTION_MODE_MISMATCH wins."

      - name: corner_val_advance_headroom_exactly_zero_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=39]
          - errors[ERR_ADVANCE_CAP_EXCEEDED]
          - calculations.advance_payment_amount
        excluded_because:
          difficulty_instance: advance_headroom_exact_zero_cents_rejected_one_cent_accepted
          rationale: "That §1.8 instance already pins the strict > 0.00 headroom boundary at exactly zero cents and one cent of remaining room."

      - name: corner_val_housing_block_with_zero_rooms_cannot_open
        claim_type: violation_to_error
        grounds:
          - validations[priority=36]
          - errors[ERR_HOUSING_BLOCK_EMPTY]
          - entities.HousingBlock.fields.rooms_total
        excluded_because:
          difficulty_instance: housing_block_rooms_total_zero_cannot_open_one_can
          rationale: "That §1.8 instance already pins the rooms_total zero-quantity boundary against rooms_total 1 on the open transition."

      - name: corner_val_deployment_rest_buffer_exact_twelve_hour_gap_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=23]
          - errors[ERR_DEPLOYMENT_WINDOW_CONFLICT]
          - state_machines.Deployment.REQUESTED_to_CONFIRMED
        excluded_because:
          difficulty_instance: adjuster_deployment_buffered_semantics_12h_gap_exact_boundary
          rationale: "That §1.8 instance already pins the buffered-overlap boundary at an exact 12-hour gap and one second under it."

      - name: corner_val_housing_overlap_alone_is_not_a_capacity_conflict
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=24]
          - errors[ERR_HOUSING_CAPACITY_EXCEEDED]
          - entities.HousingBlock.fields.rooms_total
        excluded_because:
          difficulty_instance: housing_block_aggregate_nightly_capacity_not_overlap_per_se
          rationale: "That §1.8 instance already shows overlapping deployments sharing one block legally and failing only when the aggregate nightly rooms exceed rooms_total."

      - name: corner_val_assignment_one_second_outside_deployment_window_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=26]
          - errors[ERR_ASSIGNMENT_OUTSIDE_DEPLOYMENT]
          - entities.InspectionAssignment.fields.deployment_id
        excluded_because:
          difficulty_instance: deployment_containment_semantics_inclusive_bounds_one_second_out
          rationale: "That §1.8 instance already pins the inclusive containment bounds and the one-second overhang that breaks them."
# §1.9 corner design — PART B (sections: endpoints, errors)
# Concatenated under the top-level `scaffold_corner_design:` key.
# Clock default is exactly 2026-08-01T00:00:00Z (see §1.5 POST /_clock/set_current_utc).

  - section: endpoints
    instances:
      - name: corner_ep_create_event_returns_monitoring_open_version_one
        claim_type: Standard CRUD
        grounds: [endpoints."POST /catastrophe-events"]
        distinguishing_aspect: "A freshly created CatastropheEvent is returned inside the §1.0 success envelope with status MONITORING, posture OPEN, version 1 and declared_at_utc null."
        test_recipe:
          setup: ["Empty database; logical clock pinned to the startup default 2026-08-01T00:00:00.000Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: CatastropheManager
              as_user_id: "cm-001"
          trigger:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-114", peril_type: "HURRICANE", jurisdiction_state: "FL", event_start_utc: "2026-07-28T00:00:00.000Z", exposure_count: 1000, avg_insured_value: 250000, expected_severity_index: 0.0500 }
              as: CatastropheManager
              as_user_id: "cm-001"
          assert:
            - "HTTP 201."
            - "response_type == 'object' and meta.api_request_id and meta.api_request_timestamp are both present."
            - "data.status == 'MONITORING'."
            - "data.posture == 'OPEN'."
            - "data.version == 1."
            - "data.declared_at_utc == null."
            - "data.cat_code == 'CAT-2026-114' and data.peril_type == 'HURRICANE' and data.jurisdiction_state == 'FL'."

      - name: corner_ep_read_event_returns_zeroed_rollups
        claim_type: Standard CRUD
        grounds: ['endpoints."GET /catastrophe-events/{eventId}"']
        distinguishing_aspect: "Reading an event that has no children returns every computed roll-up at its zero identity (0.00 money, 0 counts, moratorium_active false), not null."
        test_recipe:
          setup: ["One CatastropheEvent in MONITORING with zero Claim, Deployment, HousingBlock, ReserveEntry and LossEstimateSnapshot children."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: CatastropheManager
              as_user_id: "cm-001"
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-115", peril_type: "HAIL", jurisdiction_state: "TX", event_start_utc: "2026-07-28T00:00:00.000Z", exposure_count: 500, avg_insured_value: 180000, expected_severity_index: 0.0200 }
              as: CatastropheManager
              as_user_id: "cm-001"
              captures: { ev: $.data.id }
          trigger:
            - call: "GET /catastrophe-events/${ev}"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm-001"
          assert:
            - "HTTP 200."
            - "data.open_claim_count == 0 and data.surge_adjuster_count == 0."
            - "data.case_reserve_total == 0.00 and data.paid_total == 0.00 and data.incurred_total == 0.00."
            - "data.housing_committed_cost == 0.00 and data.deployment_settled_cost == 0.00."
            - "data.gross_loss_estimate == 0.00."
            - "data.moratorium_active == false."
            - "data.posture == 'OPEN' and data.version == 1."

      - name: corner_ep_list_events_pagination_envelope_and_created_at_order
        claim_type: Standard CRUD
        grounds: [endpoints."GET /catastrophe-events"]
        distinguishing_aspect: "With three events stored, limit=2/offset=0 returns exactly the two earliest-created rows in created_at ASC order with total_count 3 and has_more true."
        test_recipe:
          setup: ["Three CatastropheEvent rows created in the order CAT-2026-201, CAT-2026-202, CAT-2026-203."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: CatastropheManager
              as_user_id: "cm-001"
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-201", peril_type: "HURRICANE", jurisdiction_state: "FL", event_start_utc: "2026-07-28T00:00:00.000Z", exposure_count: 100, avg_insured_value: 100000, expected_severity_index: 0.0100 }
              as: CatastropheManager
              as_user_id: "cm-001"
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-202", peril_type: "WILDFIRE", jurisdiction_state: "CA", event_start_utc: "2026-07-29T00:00:00.000Z", exposure_count: 200, avg_insured_value: 120000, expected_severity_index: 0.0200 }
              as: CatastropheManager
              as_user_id: "cm-001"
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-203", peril_type: "FLOOD", jurisdiction_state: "LA", event_start_utc: "2026-07-30T00:00:00.000Z", exposure_count: 300, avg_insured_value: 140000, expected_severity_index: 0.0300 }
              as: CatastropheManager
              as_user_id: "cm-001"
          trigger:
            - call: "GET /catastrophe-events?limit=2&offset=0"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm-001"
          assert:
            - "HTTP 200 and response_type == 'array'."
            - "total_count == 3 and limit == 2 and offset == 0 and has_more == true."
            - "len(data) == 2."
            - "data[0].cat_code == 'CAT-2026-201' and data[1].cat_code == 'CAT-2026-202'."

      - name: corner_ep_open_housing_block_activates_and_commits_cost
        claim_type: Action endpoint
        grounds: ['endpoints."POST /housing-blocks/{housingBlockId}/open"', state_machines.HousingBlock.transitions.PENDING_to_ACTIVE]
        distinguishing_aspect: "Opening a PENDING block on a DECLARED event flips it to ACTIVE and makes the parent event's housing_committed_cost exactly 10000.00 (200 * 10 rooms * 5 nights)."
        test_recipe:
