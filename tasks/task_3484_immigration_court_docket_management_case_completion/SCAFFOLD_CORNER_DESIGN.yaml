      - name: motion_referential_and_state_guards
        claim_type: Violation → Error
        grounds:
          - errors.ERR_CASE_NOT_IN_ABSENTIA
          - errors.ERR_DECISION_CASE_MISMATCH
          - validations[priority=5]
          - validations[priority=6]
        distinguishing_aspect: "Motion filing checks case state (priority 5) before cross-entity linkage (priority 6): a motion naming a CALENDAR case with someone else's in-absentia decision fails ERR_CASE_NOT_IN_ABSENTIA; only after BOTH cases sit in IN_ABSENTIA does a cross-filed decision surface ERR_DECISION_CASE_MISMATCH."
        test_recipe:
          setup:
