scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: toll_pricing_transponder_vs_plate_on_tollevent
        grounds:
          - calculations.toll_pricing
          - state_machines.TollEvent.PENDING_to_POSTED
          - state_machines.TollEvent.PENDING_to_TOLL_BY_PLATE_INVOICED
          - entities.TollEvent.fields.capture_method
          - entities.TollEvent.fields.net_toll_cents
        distinguishing_aspect: |
          Operates on the TollEvent domain (pricing of a vehicle crossing). The same gantry
          read produces a transponder-billed price WITHOUT the 1500-bps plate surcharge,
          versus a toll-by-plate price WITH the 1500-bps surcharge, even though every
          other input — base_rate, class, interop adjustment — is identical.
        test_recipe:
          setup:
            - "Create Account A (home_agency_code=NY_EZPASS, balance_cents=20000, auto_reload_enabled=true, auto_reload_topup_cents=4000, auto_reload_threshold_cents=1000)"
            - "Create Vehicle V on A (plate_number='ABC123', plate_state='NY', axle_count=3) — vehicle_class=CLASS_3"
            - "Create Transponder T on A; bind T to V"
            - "No InteropPolicy rows; gantry NJ_EZPASS"
          trigger:
            - "POST /toll-events ingest #1 (gantry NJ_EZPASS, base_rate_cents=237, transponder_serial=T.serial, plate_number=null) — TRANSPONDER path"
            - "Create a second identical Vehicle V2 on A; do NOT bind a transponder. POST /toll-events ingest #2 (gantry NJ_EZPASS, base_rate_cents=237, transponder_serial=null, plate_number='V2_PLATE', plate_state='NY') — PLATE path"
          assert:
            - "TollEvent #1.capture_method == 'TRANSPONDER' AND TollEvent #1.net_toll_cents == 356 (gross=356, interop=0 (no policy), plate_surcharge=0)"
            - "TollEvent #2.capture_method == 'PLATE' AND TollEvent #2.net_toll_cents == 409 (gross=356, interop=0, plate_surcharge=round_half_up(356*0.15)=53, total=409)"
            - "TollEvent #1.net_toll_cents != TollEvent #2.net_toll_cents"

      - name: fine_amount_initial_vs_overdue_on_fine
        grounds:
          - calculations.fine_amount
          - state_machines.Fine.PENDING_to_OVERDUE
          - entities.Fine.fields.amount_cents
          - entities.Fine.fields.civil_penalty_cents
        distinguishing_aspect: |
          Operates on the Fine entity domain (penalty assessment), distinct from the
          TollEvent pricing domain above. Initial issuance variant assesses base_penalty
          for reason_code; overdue_compounding variant adds LATE_PENALTY_CENTS=2000.
          Identical Violation produces different Fine.amount_cents depending on whether
          due_at has passed when read.
        test_recipe:
          setup:
            - "Create Account A (home_agency_code=NY_EZPASS, balance_cents=0, auto_reload_enabled=false)"
            - "Create Vehicle V on A (plate_number='OWE001', plate_state='NY', axle_count=2)"
          trigger:
            - "POST /toll-events ingest at t=T0 (gantry NY_EZPASS, base_rate_cents=200, plate_number='OWE001', plate_state='NY', no transponder) — VIOLATED with reason=INSUFFICIENT_FUNDS_ON_PLATE_BILL"
            - "Snapshot Fine F1 via GET /fines/{F1.id}"
            - "POST /_clock/advance to T0 + 31 days"
            - "Snapshot Fine F1 via GET /fines/{F1.id} again"
          assert:
            - "At T0: F1.amount_cents == 2730 (toll_component PLATE variant: gross=200, interop=0, plate_surcharge=30 → 230; civil_penalty=2500; total=2730)"
            - "At T0+31d: F1.settlement_status == 'OVERDUE' AND F1.amount_cents == 4730 (added LATE_PENALTY_CENTS=2000)"
            - "F1.civil_penalty_cents went from 2500 to 4500"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes (a/b/c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: toll_pricing_mode_b_per_step_rounding
        grounds:
          - calculations.toll_pricing
          - calculations.toll_pricing.precision
          - calculations.toll_pricing.constants.CLASS_MULT
          - calculations.toll_pricing.constants.PLATE_BILL_SURCHARGE_BPS
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold pins per-step
          rounding (class → interop → plate-surcharge), so a base_rate of 237 with
          CLASS_3 and a 5%/2% interop differential and a 15% plate surcharge yields a
          DIFFERENT integer cents from rounding-once-at-end on the same inputs.
        test_recipe:
          setup:
            - "Create Account A (home_agency_code=NY_EZPASS, balance_cents=50000, auto_reload_enabled=false)"
            - "Create Vehicle V (axle_count=3 → CLASS_3); register but do NOT bind a transponder"
            - "POST /interop-policies (home_agency=NY_EZPASS, gantry_agency=NJ_EZPASS, surcharge_bps=500, discount_bps=200)"
          trigger:
            - "POST /toll-events (gantry NJ_EZPASS, agency_code=NJ_EZPASS, base_rate_cents=237, plate_number=V.plate, plate_state='NY') — PLATE variant"
          assert:
            - "TollEvent.gross_toll_cents == 356 (round_half_up(237*1.50)=round_half_up(355.5)=356)"
            - "TollEvent.net_toll_cents == 420 (interop=round_half_up(356*300/10000)=round_half_up(10.68)=11; plate=round_half_up(356*1500/10000)=round_half_up(53.4)=53; 356+11+53=420)"
            - "If a naive implementation rounds only once at the end it would compute 419; the pinned per-step order gives 420"

      - name: fine_amount_mode_c_circular_dependency_pinned_order
        grounds:
          - calculations.fine_amount
          - calculations.fine_amount.formula
          - calculations.toll_pricing
          - state_machines.TollEvent.PENDING_to_VIOLATED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by explicit order. Fine.amount
          depends on toll_component, which is computed from the toll_pricing PLATE variant
          using TollEvent.base_rate × class × interop × plate-surcharge. The order
          'compute toll_pricing PLATE variant FIRST, then add civil_penalty_cents'
          is pinned — civil_penalty must NOT be folded into the surcharge base, and
          plate_surcharge must NOT apply to civil_penalty. Reversing the order changes
          the integer.
        test_recipe:
          setup:
            - "Create Account A (home_agency_code=PA_TURNPIKE, balance_cents=0, auto_reload_enabled=false)"
            - "Create Vehicle V (axle_count=2 → CLASS_2, plate_number='HOV01', plate_state='PA', hov_capable=true)"
          trigger:
            - "POST /toll-events (gantry PA_TURNPIKE, base_rate_cents=200, plate_number='HOV01', plate_state='PA', hov_lane=true, declared_occupants=1) — fails HOV check → VIOLATED with reason_code=HOV_FRAUD"
          assert:
            - "Created Fine F.civil_penalty_cents == 10000 (HOV_FRAUD base_penalty)"
            - "Created Fine F.amount_cents == 10230 (toll_component PLATE variant: gross=200, interop=0, plate_surcharge=30 → 230; plus 10000 base penalty)"
            - "F.amount_cents != round_half_up((200 + 10000) * 1.15) (the wrong-order computation would be 11730)"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: fine_dispute_cycle_pending_disputed_pending
        grounds:
          - state_machines.Fine
          - state_machines.Fine.PENDING_to_DISPUTED
          - state_machines.Fine.DISPUTED_to_PENDING
          - entities.Fine.fields.dispute_count
        distinguishing_aspect: |
          Cycle on Fine entity: PENDING → DISPUTED → PENDING is reachable; the loop is
          bounded by Fine.dispute_count < 2 (third dispute rejected with
          ERR_DISPUTE_LIMIT_REACHED). This is a non-linear cyclic shape on Fine.
        test_recipe:
          setup:
            - "Create Account A, Vehicle V, ingest a toll-event that lands VIOLATED → Fine F created in PENDING"
          trigger:
            - "POST /fines/{F.id}/dispute (dispute_count: 0 → 1; status PENDING → DISPUTED)"
            - "POST /fines/{F.id}/dispute/reject (status DISPUTED → PENDING)"
            - "POST /fines/{F.id}/dispute (dispute_count: 1 → 2; status PENDING → DISPUTED)"
            - "POST /fines/{F.id}/dispute/reject (status DISPUTED → PENDING)"
            - "POST /fines/{F.id}/dispute (third attempt)"
          assert:
            - "Third dispute returns HTTP 409 with error_id ERR_DISPUTE_LIMIT_REACHED"
            - "Final F.dispute_count == 2 AND F.settlement_status == 'PENDING'"

      - name: tollevent_parallel_capture_and_billing_dimensions
        grounds:
          - state_machines.TollEvent
          - entities.TollEvent.fields.capture_method
          - entities.TollEvent.fields.billing_status
          - entities.TollEvent.fields.hov_exempt_applied
        distinguishing_aspect: |
          Parallel state dimensions on the same TollEvent row — capture_method
          ({TRANSPONDER, PLATE, UNRESOLVED}) and billing_status ({PENDING, POSTED,
          TOLL_BY_PLATE_INVOICED, VIOLATED, EXEMPTED, VOIDED}) evolve through different
          state spaces driven by the same ingest. The combination is not a simple linear
          A→B→C — it is a Cartesian product gated by attribution. Entity is TollEvent
          (distinct from the Fine cycle above).
        test_recipe:
          setup:
            - "Create Account, Vehicle V (hov_capable=true); bind a Transponder T to V"
          trigger:
            - "POST /toll-events #1: hov_lane=true, declared_occupants=3, transponder_serial=T.serial → EXEMPTED + capture_method=TRANSPONDER"
            - "POST /toll-events #2: hov_lane=false, transponder_serial=T.serial → POSTED + capture_method=TRANSPONDER"
            - "POST /toll-events #3 (with unregistered plate, no transponder) → VIOLATED + capture_method=UNRESOLVED"
          assert:
            - "Event #1.billing_status == 'EXEMPTED' AND Event #1.capture_method == 'TRANSPONDER' AND Event #1.hov_exempt_applied == true"
            - "Event #2.billing_status == 'POSTED' AND Event #2.capture_method == 'TRANSPONDER'"
            - "Event #3.billing_status == 'VIOLATED' AND Event #3.capture_method == 'UNRESOLVED'"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: clock_advance_overdue_outstanding_suspend_block_chain
        grounds:
          - state_machines.Fine.PENDING_to_OVERDUE
          - state_machines.Account.ACTIVE_to_SUSPENDED
          - calculations.fine_amount
          - calculations.account_outstanding_fines
          - entities.Account.fields.status
          - entities.Vehicle.fields.status
          - entities.Transponder.fields.status
        distinguishing_aspect: |
          Depth-4 cascade from a single trigger (POST /_clock/advance). Link 1: clock
          push forces Fine.PENDING→OVERDUE (caused by clock). Link 2: that state
          transition triggers fine_amount overdue_compounding which adds
          LATE_PENALTY_CENTS to Fine.amount_cents (caused by link 1). Link 3: the
          enlarged Fine.amount_cents recomputes Account.outstanding_fine_cents which
          now crosses SUSPEND_THRESHOLD_CENTS=15000 (caused by link 2). Link 4: the
          aggregate crossing flips Account.ACTIVE→SUSPENDED and cascades
          Vehicle.status:=BLOCKED and Transponder.status:=SUSPENDED (caused by link 3).
        test_recipe:
          setup:
            - "Create Account A (home_agency_code=NY_EZPASS, balance_cents=0, auto_reload_enabled=false)"
            - "Create Vehicle V1 (plate='F1PL', plate_state='NY', axle_count=2, hov_capable=true) and Vehicle V2 (plate='F2PL', plate_state='NY', axle_count=2, hov_capable=true) on A; bind Transponder T to V1"
            - "Ingest TollEvent E1 at clock T0 (gantry NY_EZPASS, base_rate_cents=200, hov_lane=true, declared_occupants=1, plate_number='F1PL', plate_state='NY', no transponder) → VIOLATED reason=HOV_FRAUD; Fine F1 created with amount_cents = 230 + 10000 = 10230"
            - "Ingest TollEvent E2 at clock T0 (gantry NY_EZPASS, base_rate_cents=200, plate_number='F2PL', plate_state='NY', no transponder) → VIOLATED reason=INSUFFICIENT_FUNDS_ON_PLATE_BILL; Fine F2 created with amount_cents = 230 + 2500 = 2730"
            - "After setup: Account.outstanding_fine_cents == 10230 + 2730 = 12960 < 15000 → Account.status == 'ACTIVE'"
          trigger:
            - "POST /_clock/advance to T0 + 31 days (triggers OVERDUE sweep)"
          assert:
            - "Link 1: F1.settlement_status == 'OVERDUE' AND F2.settlement_status == 'OVERDUE'"
            - "Link 2: F1.amount_cents == 12230 (10230 + 2000 LATE) AND F2.amount_cents == 4730 (2730 + 2000 LATE)"
            - "Link 3: Account.outstanding_fine_cents == 16960 (>= 15000)"
            - "Link 4: Account.status == 'SUSPENDED' AND V1.status == 'BLOCKED' AND V2.status == 'BLOCKED' AND T.status == 'SUSPENDED'"

      - name: void_dismiss_outstanding_recompute_account_reactivate_chain
        grounds:
          - state_machines.TollEvent.VIOLATED_to_VOIDED
          - state_machines.Violation.OPEN_to_CLEARED
          - state_machines.Fine.PENDING_to_DISMISSED
          - state_machines.Account.SUSPENDED_to_ACTIVE
          - calculations.account_outstanding_fines
        distinguishing_aspect: |
          Depth-3 cascade originating from a DIFFERENT triggering transition
          (TollEvent.VIOLATED→VOIDED, operator action) than instance 1 (clock advance).
          Link 1: void transition (caused by API call). Link 2: Fine.PENDING→DISMISSED
          and Violation.OPEN→CLEARED (caused by link 1). Link 3: outstanding_fine_cents
          recompute flips Account.SUSPENDED→ACTIVE with vehicle/transponder unblock
          (caused by link 2). No clock advance is involved.
        test_recipe:
          setup:
            - "Create Account A (home_agency_code=NY_EZPASS, balance_cents=0, auto_reload_enabled=false), Vehicle V1 (plate='HF01', plate_state='NY', axle_count=2, hov_capable=true), Vehicle V2 (plate='HF02', plate_state='NY', axle_count=2, hov_capable=true); bind Transponder T to V1"
            - "Ingest E1 (gantry NY_EZPASS, base_rate_cents=200, plate='HF01', plate_state='NY', no transponder, hov_lane=true, declared_occupants=1) → VIOLATED HOV_FRAUD; Fine F1 amount=10230"
            - "Ingest E2 (gantry NY_EZPASS, base_rate_cents=200, plate='HF02', plate_state='NY', no transponder, hov_lane=true, declared_occupants=1) → VIOLATED HOV_FRAUD; Fine F2 amount=10230"
            - "After setup: Account.outstanding_fine_cents == 20460 (>= 15000), Account.status == 'SUSPENDED', V1 and V2 BLOCKED, T SUSPENDED"
          trigger:
            - "POST /toll-events/{E1.id}/void (within 24h since both events were just ingested)"
          assert:
            - "Link 1: E1.billing_status == 'VOIDED'"
            - "Link 2: F1.settlement_status == 'DISMISSED' AND Violation1.status == 'CLEARED'"
            - "Link 3: Account.outstanding_fine_cents == 10230 (< 15000) AND Account.status == 'ACTIVE' AND V1.status == 'ACTIVE' AND V2.status == 'ACTIVE' AND T.status == 'ACTIVE'"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_delete_suspended_account_with_outstanding_fines
        grounds:
          - validations[priority=6]    # state: ERR_ACCOUNT_NOT_ACTIVE
          - validations[priority=18]   # business_fiscal: ERR_ACCOUNT_HAS_OBLIGATIONS
        distinguishing_aspect: |
          Category pair: `state` (priority 6, ERR_ACCOUNT_NOT_ACTIVE) versus
          `business_fiscal` (priority 18, ERR_ACCOUNT_HAS_OBLIGATIONS). The same DELETE
          /accounts/{id} request hits both checks simultaneously (Account is SUSPENDED
          AND has outstanding fines). The lower-priority-number wins, so the response
          MUST be ERR_ACCOUNT_NOT_ACTIVE, not ERR_ACCOUNT_HAS_OBLIGATIONS.
        test_recipe:
          setup:
            - "Create Account A (home_agency_code=NY_EZPASS, balance_cents=0, auto_reload_enabled=false), Vehicle V1 (plate='HF01', plate_state='NY', axle_count=2, hov_capable=true), Vehicle V2 (plate='HF02', plate_state='NY', axle_count=2, hov_capable=true)"
            - "Ingest two HOV_FRAUD violations as in the void-cascade instance → Fines F1, F2 each amount_cents=10230; Account.outstanding_fine_cents == 20460; Account.status == 'SUSPENDED'"
          trigger:
            - "DELETE /accounts/{A.id} as AgencyAdmin"
          assert:
            - "HTTP 409 returned"
            - "error_id == 'ERR_ACCOUNT_NOT_ACTIVE' (priority 6, state category) — NOT 'ERR_ACCOUNT_HAS_OBLIGATIONS' (priority 18, business_fiscal category)"

      - name: business_safety_vs_business_constraint_blocked_vehicle_double_bind
        grounds:
          - validations[priority=10]   # business_safety: ERR_VEHICLE_BLOCKED
          - validations[priority=13]   # business_constraint: ERR_VEHICLE_ALREADY_BOUND
        distinguishing_aspect: |
          Different category pair from the first instance: `business_safety` (priority 10,
          ERR_VEHICLE_BLOCKED) versus `business_constraint` (priority 13,
          ERR_VEHICLE_ALREADY_BOUND). A bind request against a Vehicle that is BOTH
          BLOCKED AND already has an ACTIVE Transponder must fail with VEHICLE_BLOCKED
          (the higher-priority safety check), NOT VEHICLE_ALREADY_BOUND.
        test_recipe:
          setup:
            - "Create Account A (home_agency_code=NY_EZPASS, balance_cents=0, auto_reload_enabled=false), Vehicle V (plate='ESC01', plate_state='NY', axle_count=2, hov_capable=true), Transponder T1 (UNBOUND) on A; bind T1 to V → T1.status='ACTIVE'"
            - "Ingest a PLATE-only violation on V (gantry NY_EZPASS, base_rate_cents=200, plate='ESC01', no transponder) → VIOLATED INSUFFICIENT_FUNDS; Fine F amount=2730"
            - "POST /fines/{F.id}/dispute (dispute_count: 0→1); POST /fines/{F.id}/dispute/reject (back to PENDING); POST /fines/{F.id}/dispute (1→2); POST /fines/{F.id}/dispute/reject (back to PENDING)"
            - "POST /_clock/advance to issued_at + 31 days → F.PENDING→OVERDUE with dispute_count==2 → cascade Violation.OPEN→ESCALATED → V.status := 'BLOCKED'. Account.outstanding_fine_cents == 4730 < 15000, so Account.status remains 'ACTIVE'"
            - "Create Transponder T2 on A (UNBOUND)"
          trigger:
            - "POST /accounts/{A.id}/transponders/{T2.id}/bind with vehicle_id=V.id (V is BLOCKED AND already has T1 bound)"
          assert:
            - "HTTP 409 returned"
            - "error_id == 'ERR_VEHICLE_BLOCKED' (priority 10, business_safety), NOT 'ERR_VEHICLE_ALREADY_BOUND' (priority 13, business_constraint)"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: auto_reload_threshold_inclusive_boundary
        grounds:
          - calculations.auto_reload_topup
          - calculations.auto_reload_topup.formula
          - entities.Account.fields.auto_reload_threshold_cents
          - state_machines.TollEvent.PENDING_to_POSTED
        distinguishing_aspect: |
          Numeric threshold metric (Account.balance_cents <= auto_reload_threshold_cents)
          on endpoint POST /toll-events. Boundary is `<=` (inclusive); a post-debit
          balance equal to the threshold MUST trigger reload, while a balance one cent
          above MUST NOT. Endpoint exercised: POST /toll-events.
        test_recipe:
          setup:
            - "Create Account A1 (auto_reload_enabled=true, auto_reload_threshold_cents=2500, auto_reload_topup_cents=4000, balance_cents=3000) — Vehicle V1, Transponder T1 bound"
            - "Create Account A2 (auto_reload_enabled=true, auto_reload_threshold_cents=2500, auto_reload_topup_cents=4000, balance_cents=3001) — Vehicle V2, Transponder T2 bound"
            - "No interop policy; same-agency gantry"
          trigger:
            - "POST /toll-events (gantry NY_EZPASS, base_rate_cents=500, transponder=T1.serial) — debit 500; post-debit balance for A1 = 2500"
            - "POST /toll-events (gantry NY_EZPASS, base_rate_cents=500, transponder=T2.serial) — debit 500; post-debit balance for A2 = 2501"
          assert:
            - "A1: a ReloadEvent of kind=AUTO with amount_cents=4000 was created; A1.balance_cents == 6500 (2500 + 4000 reload)"
            - "A2: NO ReloadEvent created; A2.balance_cents == 2501"
            - "The inclusive boundary at 2500 distinguishes the two outcomes by exactly one cent"

      - name: empty_interop_policy_set_fallback
        grounds:
          - calculations.toll_pricing
          - calculations.toll_pricing.formula
          - validations[priority=12]
          - entities.InteropPolicy
        distinguishing_aspect: |
          Empty-collection metric on a different endpoint (POST /toll-events again
          but exercising a different code path): when InteropPolicy lookup returns
          ZERO rows for the (home_agency, gantry_agency) pair, interop_adjust MUST
          default to 0 (no error, no surcharge, no discount). This is the empty-set
          boundary distinct from the numeric threshold above.
        test_recipe:
          setup:
            - "Create Account A (home_agency_code=NY_EZPASS, balance_cents=20000); Vehicle V (axle_count=2 → CLASS_2); bind Transponder T"
            - "Delete or never insert any InteropPolicy rows"
          trigger:
            - "POST /toll-events (gantry NJ_EZPASS, agency_code=NJ_EZPASS, base_rate_cents=300, transponder=T.serial)"
          assert:
            - "TollEvent.gross_toll_cents == 300 (300 * 1.00)"
            - "TollEvent.net_toll_cents == 300 (interop_adjust == 0 because zero matching policy rows; no error returned)"
            - "Account.balance_cents == 19700 (decremented by exactly 300)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: transponder_bind_requires_vehicle_active_and_account_active
        grounds:
          - state_machines.Transponder.UNBOUND_to_ACTIVE
          - validations[priority=6]
          - validations[priority=10]
          - entities.Account.fields.status
          - entities.Vehicle.fields.status
        distinguishing_aspect: |
          Entity pair: Transponder ↔ {Account, Vehicle}. Transponder UNBOUND→ACTIVE is
          gated by Vehicle.status==ACTIVE AND Account.status==ACTIVE. Either parent in a
          non-ACTIVE state forces a different error and blocks the transition. The
          dependency crosses the Transponder→Vehicle→Account ownership chain.
        test_recipe:
          setup:
            - "Create Account A (home_agency_code=NY_EZPASS, balance_cents=0, auto_reload_enabled=false), Vehicle V_target (plate='TG01', plate_state='NY', axle_count=2, hov_capable=true), Vehicle V_fraud1 (plate='HF11', plate_state='NY', axle_count=2, hov_capable=true), Vehicle V_fraud2 (plate='HF12', plate_state='NY', axle_count=2, hov_capable=true); Transponder T (UNBOUND) on A"
            - "Ingest two HOV_FRAUD violations on V_fraud1 and V_fraud2 (gantry NY_EZPASS, base_rate_cents=200, hov_lane=true, declared_occupants=1, plates HF11/HF12, no transponder) → two Fines amount_cents=10230 each; outstanding=20460 → Account.status='SUSPENDED'"
            - "Cascade has set V_target.status := BLOCKED (along with V_fraud1, V_fraud2)"
          trigger:
            - "POST /accounts/{A.id}/transponders/{T.id}/bind with vehicle_id=V_target.id while Account is SUSPENDED"
          assert:
            - "HTTP 409 with error_id 'ERR_ACCOUNT_NOT_ACTIVE' (priority 6 fires first; transponder transition blocked)"
            - "T.status remains 'UNBOUND'; T.bound_vehicle_id is null"

      - name: tollevent_posted_requires_transponder_active_and_vehicle_active
        grounds:
          - state_machines.TollEvent.PENDING_to_POSTED
          - state_machines.TollEvent.PENDING_to_VIOLATED
          - entities.Transponder.fields.status
          - entities.Vehicle.fields.status
        distinguishing_aspect: |
          Different entity pair: TollEvent ↔ {Transponder, Vehicle}. TollEvent
          PENDING→POSTED requires Transponder.status==ACTIVE and bound Vehicle.status==
          ACTIVE. If the transponder is SUSPENDED (because owning Account was
          suspended), the same gantry read DOES NOT post via TRANSPONDER — instead
          falls through to PLATE/VIOLATED branches. The dependency crosses
          TollEvent→Transponder and TollEvent→Vehicle.
        test_recipe:
          setup:
            - "Create Account A (home_agency_code=NY_EZPASS, balance_cents=10000, auto_reload_enabled=false), Vehicle V (plate='V001', plate_state='NY', axle_count=2, hov_capable=true), Transponder T (UNBOUND) on A; bind T to V → T.status='ACTIVE'"
            - "Create Vehicles V_fraud1 (plate='HF21', plate_state='NY') and V_fraud2 (plate='HF22', plate_state='NY') on A; ingest two HOV_FRAUD violations on those plates → two Fines amount_cents=10230 each; outstanding=20460 → Account.status='SUSPENDED'; cascade V.status:='BLOCKED', T.status:='SUSPENDED'"
            - "Snapshot Account.balance_cents == 10000"
          trigger:
            - "POST /toll-events with transponder_serial=T.serial AND plate_number='V001' AND plate_state='NY', gantry NY_EZPASS, base_rate_cents=200"
          assert:
            - "TollEvent.billing_status == 'VIOLATED' (NOT 'POSTED')"
            - "Transponder remains 'SUSPENDED'; Vehicle remains 'BLOCKED'"
            - "Account.balance_cents == 10000 (unchanged — POSTED branch never taken)"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: tollevent_dedup_minute_truncation_window
        grounds:
          - validations[priority=14]
          - concurrency_rules[duplicate_toll_event]
          - entities.TollEvent.fields.read_at
          - entities.TollEvent.fields.gantry_id
        distinguishing_aspect: |
          Interval semantics: read_at TRUNCATED to the minute (60-second discrete
          buckets). Two posts for the same (gantry_id, minute-bucket, plate-or-transponder)
          collide regardless of sub-second offset. Resource entity: TollEvent.
        test_recipe:
          setup:
            - "Create Account A, Vehicle V, Transponder T bound to V"
          trigger:
            - "POST /toll-events with read_at='2026-05-20T10:15:00.000Z', gantry_id='G1', transponder_serial=T.serial"
            - "POST /toll-events with read_at='2026-05-20T10:15:59.999Z' (same minute), gantry_id='G1', transponder_serial=T.serial"
            - "POST /toll-events with read_at='2026-05-20T10:16:00.000Z' (next minute), gantry_id='G1', transponder_serial=T.serial"
          assert:
            - "First post: HTTP 201 success"
            - "Second post (same minute bucket, 59.999s later): HTTP 409 with error_id 'ERR_DUPLICATE_TOLL_EVENT'"
            - "Third post (different minute): HTTP 201 success"

      - name: void_window_24h_inclusive_boundary
        grounds:
          - validations[priority=16]
          - state_machines.TollEvent.POSTED_to_VOIDED
          - state_machines.TollEvent.TOLL_BY_PLATE_INVOICED_to_VOIDED
          - state_machines.TollEvent.VIOLATED_to_VOIDED
        distinguishing_aspect: |
          Different interval semantics: continuous 24-hour rolling window measured
          from TollEvent.created_at. Buffer-style interval (now - created_at < 24h),
          NOT a bucket truncation. Resource entity: TollEvent. The geometric
          treatment is duration-since rather than bucket-equality used in dedup.
        test_recipe:
          setup:
            - "Create Account, Vehicle, ingest a POSTED toll-event Event1 at clock T0"
            - "Ingest a second POSTED toll-event Event2 at clock T0"
          trigger:
            - "POST /_clock/advance to T0 + 23h59m59s"
            - "POST /toll-events/{Event1.id}/void"
            - "POST /_clock/advance to T0 + 24h00m01s"
            - "POST /toll-events/{Event2.id}/void"
          assert:
            - "Event1 void: HTTP 200, Event1.billing_status == 'VOIDED'"
            - "Event2 void: HTTP 409 with error_id 'ERR_VOID_WINDOW_EXPIRED'"
            - "Event2.billing_status remains 'POSTED'"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: toll_post_then_void_preserves_account_balance
        grounds:
          - state_machines.TollEvent.PENDING_to_POSTED
          - state_machines.TollEvent.POSTED_to_VOIDED
          - calculations.toll_pricing
          - entities.Account.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity: Account.balance_cents (monetary balance). Posting a toll
          debits balance by net_toll_cents; voiding that same toll within 24h credits
          back EXACTLY net_toll_cents — no rounding drift, no fee. Pinned invariant
          formula: Account.balance_cents(after_void) == Account.balance_cents(before_post).
        test_recipe:
          setup:
            - "Create Account A (auto_reload_enabled=false, balance_cents=10000), Vehicle V (axle_count=2), Transponder T bound to V"
            - "No InteropPolicy; same-agency gantry"
          trigger:
            - "Snapshot Account.balance_cents B0 == 10000"
            - "POST /toll-events (gantry NY_EZPASS, base_rate_cents=347, transponder=T.serial) — TRANSPONDER POSTED; net_toll_cents=347"
            - "Snapshot Account.balance_cents B1"
            - "POST /toll-events/{Event.id}/void"
            - "Snapshot Account.balance_cents B2"
          assert:
            - "B1 == 9653 (10000 - 347)"
            - "B2 == 10000 (10000 - 347 + 347)"
            - "B2 == B0 (invariant: post+void on monetary balance is zero-drift)"

      - name: violation_create_then_void_preserves_outstanding_fines_total
        grounds:
          - state_machines.TollEvent.PENDING_to_VIOLATED
          - state_machines.TollEvent.VIOLATED_to_VOIDED
          - calculations.account_outstanding_fines
          - entities.Account.fields.outstanding_fine_cents
        distinguishing_aspect: |
          Different conserved quantity: Account.outstanding_fine_cents (sum-of-fines
          aggregate, NOT monetary balance). Creating a violation+fine increases
          outstanding_fine_cents by Fine.amount_cents; voiding the underlying TollEvent
          dismisses the fine and the aggregate returns to its pre-violation value.
          Pinned invariant:
          outstanding_fine_cents(after_void) == outstanding_fine_cents(before_violation).
        test_recipe:
          setup:
            - "Create Account A (balance_cents=0, auto_reload_enabled=false), Vehicle V (plate='X1', plate_state='NY', axle_count=2)"
            - "Snapshot Account.outstanding_fine_cents O0 == 0"
          trigger:
            - "POST /toll-events (gantry NY_EZPASS, base_rate_cents=200, plate_number='X1', plate_state='NY') → VIOLATED (INSUFFICIENT_FUNDS_ON_PLATE_BILL), Fine F created with amount_cents=2730"
            - "Snapshot Account.outstanding_fine_cents O1"
            - "POST /toll-events/{Event.id}/void"
            - "Snapshot Account.outstanding_fine_cents O2"
          assert:
            - "O1 == 2730"
            - "O2 == 0"
            - "O2 == O0 (invariant: violation+void leaves outstanding_fine_cents unchanged on this aggregate quantity)"
            - "Fine F.settlement_status == 'DISMISSED'; Violation.status == 'CLEARED'"
