            - "Setting coverage_population to 100 and re-running the restore yields operations_score 55.00 exactly and succeeds"
            - "A station at 55.00 is admitted while one at 54.99 is refused, so the comparison is >= and not >"
      - name: boundary_class_gate_exact_household_index
        grounds:
          - calculations.membership_class_assignment
          - calculations.station_operations_score
          - entities.MemberStation.fields.membership_class
        distinguishing_aspect: "The class ladder is a gate pair, not a threshold chain: a station with households_index exactly 30 clears CLASS_B while the identical station one step lower falls to CLASS_C, and the gate order is fixed."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z; empty database"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /network/member-stations"
              payload: { call_sign: "WACC", licensee_name: "Hillsborough Licensee", state_code: "NH", dma_market_rank: 12, dma_households: 600000, coverage_population: 1000000, full_time_staff_count: 6, newsroom_staff_count: 9, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_NORTHEAST" }
              as: PlatformAdmin
            - call: "POST /network/member-stations"
