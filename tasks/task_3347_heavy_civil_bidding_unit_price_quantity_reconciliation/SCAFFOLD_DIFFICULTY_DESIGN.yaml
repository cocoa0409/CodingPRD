# §1.8 Scaffold Difficulty Design — Test Targeting Index (single top-level key)
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: bid_extension_dual_variant_open_vs_sealed
    grounds:
    - calculations.project_bid_extension
    - calculations.bid_unbalanced_unit_price_extension
    - entities.Project.fields.total_bid_cents
    distinguishing_aspect: 'The same takeoff (one pay item, estimated_quantity 1000, bid_unit_price_cents 3000,

      balanced_unit_price_cents 2000) produces two different totals: project_bid_extension

      reports 3000000 while bid_unbalanced_unit_price_extension reports 2010000, because the

      latter re-prices every item at its crew-productivity cost floor and applies the

      materially-unbalanced band multiplier 1.005.

      '
    test_recipe:
      setup:
      - one Project in bid_status SEALED whose single BidItem is SUBMITTED with estimated_quantity 1000, bid_unit_price_cents 3000 and balanced_unit_price_cents 2000
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /construction/projects
        payload:
          project_code: CALTRANS-04-1J5604
          owner_agency_name: Caltrans District 4
          contract_type: UNIT_PRICE
          bid_deadline_at: '2026-12-01T00:00:00Z'
          retention_rate_pct: 5.0
          advertised_dbe_goal_pct: 0.0
        as: Estimator
        captures:
          p_dual_variant: $.data.id
      - call: POST /construction/projects/${p_dual_variant}/bid-items
        payload:
          item_code: 2025-390102
          item_description: Class 2 aggregate base
          unit_of_measure: TON
          estimated_quantity: 1000
          overrun_threshold_pct: 15.0
          underrun_threshold_pct: 15.0
        as: Estimator
        captures:
          bi_dual_variant: $.data.id
      - call: POST /construction/projects/${p_dual_variant}/bid-items/${bi_dual_variant}/price
        payload:
          bid_unit_price_cents: 3000
          crew_day_labor_cents: 1200000
          crew_day_equipment_cents: 800000
          daily_productivity_units: 1000
        as: Estimator
      - call: POST /construction/projects/${p_dual_variant}/bid-items/${bi_dual_variant}/submit
        payload: {}
        as: Estimator
      trigger:
      - call: POST /construction/projects/${p_dual_variant}/seal-bid
        payload: {}
        as: Estimator
      assert:
      - Project.${p_dual_variant}.bid_status == SEALED
      - Project.${p_dual_variant}.total_bid_cents == 3000000
      - Project.${p_dual_variant}.unbalanced_bid_score == 2010000
      - Project.${p_dual_variant}.unbalanced_bid_score != Project.${p_dual_variant}.total_bid_cents
  - name: retention_percentage_basis_versus_pace_grade
    grounds:
    - calculations.retention_settlement
    - calculations.absolute_retention_reconciliation
    - entities.QuantityReconciliation.fields.pace_basis_retention_cents
    distinguishing_aspect: 'Over one identically-measured project (approved 1000 TON at 2000 cents, gross payable

      2000000) the percentage basis holds 100000 cents of retention while the absolute-grade

      basis holds 16666667 cents, because retention_settlement grades on dollars withheld and

      absolute_retention_reconciliation grades on work-in-place pace — a different entity

      domain and a different unit.

      '
    test_recipe:
      setup:
      - one ACTIVE Project whose single BidItem has one PAYABLE measurement of 1000 TON at 2000 cents and whose QuantityReconciliation is OPEN
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /construction/sureties
        payload:
          surety_name: Pacific Surety Co
          aggregate_capacity_cents: 200000000
          single_job_limit_cents: 150000000
        as: PlatformAdmin
        captures:
          s_ret: $.data.id
      - call: POST /construction/projects
        payload:
          project_code: CALTRANS-04-1J5605
          owner_agency_name: Caltrans District 4
          contract_type: UNIT_PRICE
          bid_deadline_at: '2026-12-01T00:00:00Z'
          retention_rate_pct: 5.0
          advertised_dbe_goal_pct: 0.0
        as: Estimator
        captures:
          p_ret: $.data.id
      - call: POST /construction/projects/${p_ret}/bid-items
        payload:
          item_code: 2025-390103
          item_description: Class 2 aggregate base
          unit_of_measure: TON
          estimated_quantity: 1000
          overrun_threshold_pct: 15.0
          underrun_threshold_pct: 15.0
        as: Estimator
        captures:
          bi_ret: $.data.id
      - call: POST /construction/projects/${p_ret}/bid-items/${bi_ret}/price
        payload:
          bid_unit_price_cents: 2000
          crew_day_labor_cents: 1200000
          crew_day_equipment_cents: 800000
          daily_productivity_units: 1000
        as: Estimator
      - call: POST /construction/projects/${p_ret}/bid-items/${bi_ret}/submit
        payload: {}
        as: Estimator
      - call: POST /construction/surety-commitments
        payload:
          surety_id: ${s_ret}
          project_id: ${p_ret}
          committed_amount_cents: 12000000
        as: ContractingOfficer
      - call: POST /construction/bonds
        payload:
          project_id: ${p_ret}
          surety_id: ${s_ret}
          bond_type: PERFORMANCE
          bond_amount_cents: 12000000
          effective_from: '2026-09-01T00:00:00Z'
          effective_to: '2027-09-01T00:00:00Z'
          maintain_bond_horizon_days: 30
        as: Estimator
        captures:
          b_ret: $.data.id
      - call: POST /construction/projects/${p_ret}/seal-bid
        payload: {}
        as: Estimator
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-12-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /construction/projects/${p_ret}/open-bid
        payload: {}
        as: ContractingOfficer
      - call: POST /construction/bonds/${b_ret}/issue
        payload: {}
        as: Surety
        as_user_id: ${s_ret}
      - call: POST /construction/projects/${p_ret}/start-work
        payload: {}
        as: ProjectManager
      - call: POST /construction/projects/${p_ret}/reconciliations
        payload: {}
        as: ContractingOfficer
        captures:
          rc_ret: $.data.id
      - call: GET /construction/bid-items/${bi_ret}
        payload: {}
        as: Estimator
        captures:
          biv_ret: $.data.version
      - call: POST /construction/bid-items/${bi_ret}/measurements
        payload:
          measured_quantity: 1000
          measured_at: '2026-12-02T00:00:00Z'
          expected_bid_item_version: ${biv_ret}
        as: ProjectManager
        captures:
          m_ret: $.data.id
      - call: POST /construction/measurements/${m_ret}/approve
        payload: {}
        as: ProjectManager
      - call: POST /construction/measurements/${m_ret}/pay
        payload: {}
        as: ProjectManager
      trigger:
      - call: GET /construction/reconciliations/${rc_ret}
        payload: {}
        as: ContractingOfficer
      assert:
      - QuantityReconciliation.${rc_ret}.retention_held_cents == 100000
      - QuantityReconciliation.${rc_ret}.pace_basis_retention_cents == 16666667
      - QuantityReconciliation.${rc_ret}.retention_released_cents == 0
- rule_id: combinatorial_formula
  instances:
  - name: performance_bond_tier_selection_feeding_capacity_gate
    grounds:
    - calculations.performance_bond_requirement
    - calculations.surety_exposure_capacity
    - validations[priority=33]
    distinguishing_aspect: 'The required face amount is selected from four contract-size tiers by a whole-tier

      comparison (contract_value_cents 3000000 falls in the tier bounded by 10000000, giving

      50 percent and 1500000 cents), and that same derived value is one of the three inputs to

      the capacity gate on the next hop — a non-linear interaction between tier selection,

      the surety''s single-job limit and its aggregate headroom, not a straight multiplication.

      '
    test_recipe:
      setup:
      - one Project in bid_status OPEN with contract_value_cents 3000000 and a PENDING PERFORMANCE bond of 1200000 cents against a surety with 200000000 cents of aggregate capacity
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /construction/sureties
        payload:
          surety_name: Sierra Bonding Corp
          aggregate_capacity_cents: 200000000
          single_job_limit_cents: 150000000
        as: PlatformAdmin
        captures:
          s_bond_tier: $.data.id
      - call: POST /construction/projects
        payload:
          project_code: CALTRANS-04-1J5606
          owner_agency_name: Caltrans District 4
          contract_type: UNIT_PRICE
          bid_deadline_at: '2026-12-01T00:00:00Z'
          retention_rate_pct: 5.0
          advertised_dbe_goal_pct: 0.0
        as: Estimator
        captures:
          p_bond_tier: $.data.id
      - call: POST /construction/projects/${p_bond_tier}/bid-items
        payload:
          item_code: 2025-390104
          item_description: Class 2 aggregate base
          unit_of_measure: TON
          estimated_quantity: 1000
          overrun_threshold_pct: 15.0
          underrun_threshold_pct: 15.0
        as: Estimator
        captures:
          bi_bond_tier: $.data.id
      - call: POST /construction/projects/${p_bond_tier}/bid-items/${bi_bond_tier}/price
        payload:
          bid_unit_price_cents: 3000
          crew_day_labor_cents: 1200000
          crew_day_equipment_cents: 800000
          daily_productivity_units: 1000
        as: Estimator
      - call: POST /construction/projects/${p_bond_tier}/bid-items/${bi_bond_tier}/submit
        payload: {}
        as: Estimator
      - call: POST /construction/projects/${p_bond_tier}/seal-bid
        payload: {}
        as: Estimator
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-12-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /construction/projects/${p_bond_tier}/open-bid
        payload: {}
        as: ContractingOfficer
      - call: POST /construction/bonds
        payload:
          project_id: ${p_bond_tier}
          surety_id: ${s_bond_tier}
          bond_type: PERFORMANCE
          bond_amount_cents: 1200000
          effective_from: '2026-09-01T00:00:00Z'
          effective_to: '2027-09-01T00:00:00Z'
          maintain_bond_horizon_days: 30
        as: Estimator
        captures:
          b_bond_tier: $.data.id
      trigger:
      - call: POST /construction/bonds/${b_bond_tier}/issue
        payload: {}
        as: Surety
        as_user_id: ${s_bond_tier}
      - call: POST /construction/bonds
        payload:
          project_id: ${p_bond_tier}
          surety_id: ${s_bond_tier}
          bond_type: PAYMENT
          bond_amount_cents: 2999999
          effective_from: '2026-09-01T00:00:00Z'
          effective_to: '2027-09-01T00:00:00Z'
          maintain_bond_horizon_days: 30
        as: Estimator
        captures:
          b_bond_tier2: $.data.id
      assert:
      - Bond.${b_bond_tier}.required_bond_cents == 1500000
      - Bond.${b_bond_tier}.bond_status == ISSUED
      - Bond.${b_bond_tier2}.required_bond_cents == 3000000
      - Surety.${s_bond_tier}.capacity_consumed_cents == 1200000
  - name: net_adjustment_circular_evaluation_order_pinned
    grounds:
    - calculations.quantity_variance_adjustment
    - calculations.retention_settlement
    - entities.QuantityReconciliation.fields.final_contract_value_cents
    distinguishing_aspect: 'The closeout value looks circular — net_adjustment_cents derives from variance_pct, and

      final_contract_value_cents = contract_value_cents + net_adjustment_cents, while

      retention_held_cents derives from gross payable rather than from the final value — so the

      scaffold pins the evaluation order (variance, then uplift, then contract value, then

      retention on the untouched gross-payable base) and the pinned order still yields

      3000000 because a measured quantity exactly equal to the estimate gives variance_pct 0.0,

      which is not strictly greater than the 15.0 threshold.

      '
    test_recipe:
      setup:
      - one ACTIVE Project with contract_value_cents 3000000, one BidItem measured 1000 TON against an estimate of 1000 with thresholds 15.0, and an OPEN QuantityReconciliation
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
