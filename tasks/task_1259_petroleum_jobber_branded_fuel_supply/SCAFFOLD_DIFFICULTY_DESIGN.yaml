# =============================================================================
# Task 1259 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every numeric literal below was computed by executing the SCAFFOLD.yaml §1.3
# formulas (round_half_up, tc = tenths-of-a-cent per gallon, integer cents).
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: buyout_dual_method_divergence
        grounds:
          - calculations.buyout_base_cents
          - calculations.buyout_net_settlement_cents
          - entities.SupplyAgreement.fields.buyout_method
        distinguishing_aspect: |
          Dual-variant calculation on the SupplyAgreement domain: for identical
          term, allowance, margin and fulfillment data, the LOST_MARGIN base
          (2500000) differs from the UNAMORTIZED_DISCOUNT base (2527473), and
          buyout-quote exposes both on one agreement.
        test_recipe:
          setup:
            - "ACTIVE station S with an ACTIVE agreement: term 2026-01-01..2026-12-31, committed 1000000 gal, imaging_allowance 5000000 cents, margin 25 tc/gal, shortfall 20 tc/gal, method LOST_MARGIN, fulfilled 0"
            - "logical clock at 2026-06-30 (remaining_days=184, total_days=364)"
          setup_api_calls:
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Buyout", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 100000000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-12-31", committed_gallons: 1000000, imaging_allowance_cents: 5000000, margin_tc_per_gal: 25, shortfall_penalty_tc_per_gal: 20, buyout_method: "LOST_MARGIN" }
              as: JobberAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/supply-agreements/${a_id}/activate"
              as: JobberAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: JobberAdmin
          trigger:
            - call: "GET /api/supply-agreements/${a_id}/buyout-quote"
              as: JobberAdmin
          assert:
            - "response base_cents == 2500000  (LOST_MARGIN: 1000000 gal * 25 tc / 10)"
            - "response alternate_base_cents == 2527473  (UNAMORTIZED_DISCOUNT: round_half_up(5000000 * 184/364))"
            - "response shortfall_penalty_cents == 2000000  (1000000 * 20 / 10)"
            - "response net_settlement_cents == 500000  (2500000 - 2000000)"
            - "base_cents != alternate_base_cents"

      - name: variance_gross_vs_net_temperature
        grounds:
          - calculations.inventory_variance_gallons
          - entities.InventoryReconciliation.fields.variance_net_gallons
          - entities.InventoryReconciliation.fields.variance_gross_gallons
        distinguishing_aspect: |
          Dual-variant calculation on the InventoryReconciliation/StorageTank
          domain: the same physical and book data produce variance_gross = -200
          (would breach the 130-gal threshold) but variance_net = -70 after
          80F temperature correction, and flagging uses ONLY the net variant,
          so the reconciliation stays OPEN.
        test_recipe:
          setup:
            - "ACTIVE station with ACTIVE agreement, POSTED gasoline price, truck"
            - "Tank capacity 20000, opening physical 10000; gauged 10000 @ 80F (gasoline coeff 0.00065 -> corrected physical 10130)"
            - "A 200-gal drop delivered and reconciled -> book 10200"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Var", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 100000000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-12-31", committed_gallons: 100000, imaging_allowance_cents: 100000, margin_tc_per_gal: 25, shortfall_penalty_tc_per_gal: 20, buyout_method: "LOST_MARGIN" }
              as: JobberAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/supply-agreements/${a_id}/activate"
              as: JobberAdmin
            - call: "POST /api/rack-price-postings"
              payload: { terminal_code: "TX-NORTH", product_id: "${p_gas}", effective_date: "2026-05-01", price_tc_per_gal: 2000 }
              as: PricingDesk
              captures: { pp_id: $.data.id }
            - call: "POST /api/rack-price-postings/${pp_id}/post"
              as: PricingDesk
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_gas}", capacity_gallons: 20000, opening_physical_gallons: 10000 }
              as: JobberAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/storage-tanks/${t_id}/gauge"
              payload: { reading_gallons: 10000, observed_temp_f: 80 }
              as: DealerOperator
              as_user_id: "${s_id}"
            - call: "POST /api/trucks"
              payload: { truck_code: "TRK-1", capacity_gallons: 12000 }
              as: JobberAdmin
              captures: { tr_id: $.data.id }
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t_id}", truck_id: "${tr_id}", product_id: "${p_gas}", planned_gallons: 200, window_start: "2026-05-02T08:00:00Z", window_end: "2026-05-02T12:00:00Z" }
              as: Dispatcher
              captures: { d_id: $.data.id }
            - call: "POST /api/transport-drops/${d_id}/schedule"
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/dispatch"
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/deliver"
              payload: { delivered_gallons: 200 }
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/reconcile"
              as: Dispatcher
          trigger:
            - call: "POST /api/inventory-reconciliations"
              payload: { station_id: "${s_id}", period_start: "2026-05-01", period_end: "2026-05-31" }
              as: JobberAdmin
              as_user_id: "ops-alice"
          assert:
            - "response variance_gross_gallons == -200  (physical 10000 - book 10200)"
            - "response variance_net_gallons == -70  (round_half_up(10000 * (1 + 0.00065*20)) = 10130; 10130 - 10200)"
            - "response status == OPEN  (abs(-70) <= 130 even though abs(-200) > 130 — flagging uses ONLY the net variant)"
            - "response threshold_gallons == 130 (default applied)"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_total_tiered_freight_diesel_branch
        grounds:
          - calculations.invoice_total_cents
          - entities.Invoice.fields.freight_amount_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs with non-linear interaction —
          tiered freight selection on delivered gallons (mid tier 40 tc/gal on
          ALL gallons) combined with the diesel-vs-gasoline federal excise
          branch (244 vs 184 tc) and per-component rounding before summation.
        test_recipe:
          setup:
            - "ACTIVE station (TX excise 200 tc, local 0, terminal TX-NORTH) with ACTIVE agreement and POSTED diesel posting (3059 tc, effective 2026-05-01)"
            - "Tank capacity 30000 opening 0; truck capacity 12000"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "DIESEL_ULSD", display_name: "ULSD Diesel", category: "DIESEL", federal_excise_tc_per_gal: 244, temp_coeff: 0.00040 }
              as: JobberAdmin
              captures: { p_dsl: $.data.id }
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Inv", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 100000000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-12-31", committed_gallons: 100000, imaging_allowance_cents: 100000, margin_tc_per_gal: 25, shortfall_penalty_tc_per_gal: 20, buyout_method: "LOST_MARGIN" }
              as: JobberAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/supply-agreements/${a_id}/activate"
              as: JobberAdmin
            - call: "POST /api/rack-price-postings"
              payload: { terminal_code: "TX-NORTH", product_id: "${p_dsl}", effective_date: "2026-05-01", price_tc_per_gal: 3059 }
              as: PricingDesk
              captures: { pp_id: $.data.id }
            - call: "POST /api/rack-price-postings/${pp_id}/post"
              as: PricingDesk
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_dsl}", capacity_gallons: 30000, opening_physical_gallons: 0 }
              as: JobberAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/trucks"
              payload: { truck_code: "TRK-1", capacity_gallons: 12000 }
              as: JobberAdmin
              captures: { tr_id: $.data.id }
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t_id}", truck_id: "${tr_id}", product_id: "${p_dsl}", planned_gallons: 5500, window_start: "2026-05-02T08:00:00Z", window_end: "2026-05-02T12:00:00Z" }
              as: Dispatcher
              captures: { d_id: $.data.id, d_est: $.data.estimated_amount_cents }
            - call: "POST /api/transport-drops/${d_id}/schedule"
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/dispatch"
              as: Dispatcher
          trigger:
            - call: "POST /api/transport-drops/${d_id}/deliver"
              payload: { delivered_gallons: 5500 }
              as: Dispatcher
              captures: { inv_id: $.data.invoice_id }
            - call: "GET /api/invoices/${inv_id}"
              as: Dispatcher
              captures: { fuel: $.data.fuel_amount_cents, freight: $.data.freight_amount_cents, tax: $.data.tax_amount_cents, total: $.data.total_cents }
          assert:
            - "drop estimated_amount_cents (${d_est}) == 1948650"
            - "Invoice fuel_amount_cents == 1682450  (round_half_up(5500*3059/10))"
            - "Invoice freight_amount_cents == 22000  (5500 in 2001-6000 tier: 5500*40/10)"
            - "Invoice tax_amount_cents == 244200  (5500*(244+200+0)/10 — diesel federal branch)"
            - "Invoice total_cents == 1948650"

      - name: remittance_per_line_rounding_order
        grounds:
          - calculations.tax_remittance_amount
          - entities.TaxRemittance.fields.tax_amount_cents
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding order is pinned — each
          (category) line is rounded half-up BEFORE summation
          (68327 + 20521 = 88848); the alternative sum-then-round order yields
          88847, a 1-cent divergence the test must catch.
        test_recipe:
          setup:
            - "ACTIVE station in TX (state excise 205 tc) with ACTIVE agreement, POSTED gasoline and diesel prices, two tanks, one truck"
            - "Gasoline invoice: 3333 gal delivered 2026-05-10; diesel invoice: 1001 gal delivered 2026-05-11"
            - "Remittance for TX, period 2026-05-01..2026-05-31, filed before due date (2026-06-20)"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/products"
              payload: { product_code: "DIESEL_ULSD", display_name: "ULSD Diesel", category: "DIESEL", federal_excise_tc_per_gal: 244, temp_coeff: 0.00040 }
              as: JobberAdmin
              captures: { p_dsl: $.data.id }
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Tax", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 205, credit_limit_cents: 100000000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-12-31", committed_gallons: 100000, imaging_allowance_cents: 100000, margin_tc_per_gal: 25, shortfall_penalty_tc_per_gal: 20, buyout_method: "LOST_MARGIN" }
              as: JobberAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/supply-agreements/${a_id}/activate"
              as: JobberAdmin
            - call: "POST /api/rack-price-postings"
              payload: { terminal_code: "TX-NORTH", product_id: "${p_gas}", effective_date: "2026-05-01", price_tc_per_gal: 3000 }
              as: PricingDesk
              captures: { pp_gas: $.data.id }
            - call: "POST /api/rack-price-postings/${pp_gas}/post"
              as: PricingDesk
            - call: "POST /api/rack-price-postings"
              payload: { terminal_code: "TX-NORTH", product_id: "${p_dsl}", effective_date: "2026-05-01", price_tc_per_gal: 3059 }
              as: PricingDesk
              captures: { pp_dsl: $.data.id }
            - call: "POST /api/rack-price-postings/${pp_dsl}/post"
              as: PricingDesk
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_gas}", capacity_gallons: 20000, opening_physical_gallons: 0 }
              as: JobberAdmin
              captures: { t_gas: $.data.id }
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_dsl}", capacity_gallons: 20000, opening_physical_gallons: 0 }
              as: JobberAdmin
              captures: { t_dsl: $.data.id }
            - call: "POST /api/trucks"
              payload: { truck_code: "TRK-1", capacity_gallons: 12000 }
              as: JobberAdmin
              captures: { tr_id: $.data.id }
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t_gas}", truck_id: "${tr_id}", product_id: "${p_gas}", planned_gallons: 3333, window_start: "2026-05-09T08:00:00Z", window_end: "2026-05-09T12:00:00Z" }
              as: Dispatcher
              captures: { d1: $.data.id }
            - call: "POST /api/transport-drops/${d1}/schedule"
              as: Dispatcher
            - call: "POST /api/transport-drops/${d1}/dispatch"
              as: Dispatcher
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: JobberAdmin
            - call: "POST /api/transport-drops/${d1}/deliver"
              payload: { delivered_gallons: 3333 }
              as: Dispatcher
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t_dsl}", truck_id: "${tr_id}", product_id: "${p_dsl}", planned_gallons: 1001, window_start: "2026-05-11T08:00:00Z", window_end: "2026-05-11T12:00:00Z" }
              as: Dispatcher
              captures: { d2: $.data.id }
            - call: "POST /api/transport-drops/${d2}/schedule"
              as: Dispatcher
            - call: "POST /api/transport-drops/${d2}/dispatch"
              as: Dispatcher
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: JobberAdmin
            - call: "POST /api/transport-drops/${d2}/deliver"
              payload: { delivered_gallons: 1001 }
              as: Dispatcher
            - call: "POST /api/tax-remittances"
              payload: { state_code: "TX", period_start: "2026-05-01", period_end: "2026-05-31" }
              as: TaxAccountant
              captures: { rem_id: $.data.id }
          trigger:
            - call: "POST /api/tax-remittances/${rem_id}/file"
              as: TaxAccountant
              captures: { tax: $.data.tax_amount_cents, pen: $.data.late_penalty_cents, due: $.data.total_due_cents, ggal: $.data.gasoline_gallons, dgal: $.data.diesel_gallons }
          assert:
            - "Remittance gasoline_gallons == 3333"
            - "Remittance diesel_gallons == 1001"
            - "Remittance tax_amount_cents == 88848  (round_half_up(3333*205/10)=68327 plus round_half_up(1001*205/10)=20521; per-line rounding pinned)"
            - "Remittance late_penalty_cents == 0  (filed 2026-05-11, due 2026-06-20)"
            - "Remittance total_due_cents == 88848"

      - name: buyout_netting_order_floor
        grounds:
          - calculations.buyout_net_settlement_cents
          - entities.SupplyAgreement.fields.buyout_settlement_cents
        distinguishing_aspect: |
          Mode (c) combinatorial: circular-looking dependency with pinned
          evaluation order — base (calendar pro-rata) computed first, shortfall
          penalty computed from unfulfilled gallons second, net = max(0, base -
          penalty); with penalty 3000000 > base 2527473 the floor binds and the
          settlement is exactly 0, never negative.
        test_recipe:
          setup:
            - "ACTIVE station with ACTIVE agreement: term 2026-01-01..2026-12-31, committed 1000000, allowance 5000000, margin 25, shortfall 30, method UNAMORTIZED_DISCOUNT, fulfilled 0; clock 2026-06-30"
          setup_api_calls:
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Net", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 100000000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-12-31", committed_gallons: 1000000, imaging_allowance_cents: 5000000, margin_tc_per_gal: 25, shortfall_penalty_tc_per_gal: 30, buyout_method: "UNAMORTIZED_DISCOUNT" }
              as: JobberAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/supply-agreements/${a_id}/activate"
              as: JobberAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: JobberAdmin
            - call: "POST /api/supply-agreements/${a_id}/initiate-buyout"
              as: JobberAdmin
          trigger:
            - call: "POST /api/supply-agreements/${a_id}/execute-buyout"
              as: JobberAdmin
              captures: { settle: $.data.buyout_settlement_cents, st: $.data.status }
          assert:
            - "Agreement status == BOUGHT_OUT"
            - "buyout_settlement_cents == 0  (base 2527473 - penalty 3000000 floored at 0 by the pinned max(0, ...) order)"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_renewal_cycle
        grounds:
          - state_machines.SupplyAgreement.ACTIVE_to_RENEWAL_PENDING
          - state_machines.SupplyAgreement.RENEWAL_PENDING_to_ACTIVE
          - state_machines.SupplyAgreement
        distinguishing_aspect: |
          Cyclic machine on SupplyAgreement: ACTIVE -> RENEWAL_PENDING -> ACTIVE
          traversed TWICE (two renewal rounds), with renewal_count advancing to
          2 — not a linear pipeline.
        test_recipe:
          setup:
            - "ACTIVE station; agreement term1 2026-01-01..2026-06-30 committed 1000, allowance 100000, margin 10, shortfall 10, LOST_MARGIN; no drops (fulfillment 0 -> no incentive)"
          setup_api_calls:
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Ren", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 100000000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-06-30", committed_gallons: 1000, imaging_allowance_cents: 100000, margin_tc_per_gal: 10, shortfall_penalty_tc_per_gal: 10, buyout_method: "LOST_MARGIN" }
              as: JobberAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/supply-agreements/${a_id}/activate"
              as: JobberAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: JobberAdmin
          trigger:
            - call: "POST /api/supply-agreements/${a_id}/start-renewal"
              as: JobberAdmin
            - call: "POST /api/supply-agreements/${a_id}/renew"
              payload: { new_term_start_date: "2026-07-01", new_term_end_date: "2026-12-31" }
              as: JobberAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: JobberAdmin
            - call: "POST /api/supply-agreements/${a_id}/start-renewal"
              as: JobberAdmin
            - call: "POST /api/supply-agreements/${a_id}/renew"
              payload: { new_term_start_date: "2027-01-01", new_term_end_date: "2027-06-30" }
              as: JobberAdmin
              captures: { rc: $.data.renewal_count, st: $.data.status, credit: $.data.renewal_credit_cents }
          assert:
            - "Agreement status == ACTIVE after two loop iterations"
            - "renewal_count == 2"
            - "renewal_credit_cents == 0  (fulfillment 0% < 95%)"

      - name: drop_fail_replan_cycle
        grounds:
          - state_machines.TransportDrop.EN_ROUTE_to_DELIVERY_FAILED
          - state_machines.TransportDrop.DELIVERY_FAILED_to_PLANNED
          - concurrency_rules[drop-replan-stale-version]
        distinguishing_aspect: |
          Cyclic machine on TransportDrop (different entity than the agreement
          cycle): EN_ROUTE -> DELIVERY_FAILED -> PLANNED -> SCHEDULED ->
          EN_ROUTE -> DELIVERED, with failure_count advancing to 1 and OCC
          expected_drop_version satisfied from a fresh read.
        test_recipe:
          setup:
            - "Full fixture: ACTIVE station/agreement, POSTED gasoline price (2000 tc), tank cap 20000 opening 0, truck TRK-1"
            - "Drop 1000 gal created, scheduled, dispatched, then failed once"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Cyc", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 100000000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
