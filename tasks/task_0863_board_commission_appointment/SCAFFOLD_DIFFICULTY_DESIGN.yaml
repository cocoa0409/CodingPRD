              payload: { full_name: "Ben Cole", email: "ben@x.com", residence_district: "D1", resides_in_jurisdiction: true, is_registered_voter: true }
              as: Applicant
              captures: { ap2: "$.data.id" }
            - call: "POST /civic/vacancies"
              payload: { seat_id: "${s1}", reason: "NEW_SEAT", application_deadline: "2026-12-31T00:00:00Z" }
              as: BoardClerk
              captures: { v1: "$.data.id" }
            - call: "POST /civic/applications"
              payload: { applicant_id: "${ap1}", vacancy_id: "${v1}", residency_attested: true }
              as: Applicant
              as_user_id: "${ap1}"
              captures: { app1: "$.data.id" }
            - call: "POST /civic/applications/${app1}/start-review"
              payload: {}
              as: BoardClerk
            - call: "POST /civic/applications/${app1}/decide-eligibility"
              payload: { eligible: true }
              as: BoardClerk
            - call: "POST /civic/appointments"
              payload: { application_id: "${app1}", seat_id: "${s1}", term_start_date: "2026-06-01T00:00:00Z", expected_seat_version: "${s1v}" }
              as: AppointingAuthority
              as_user_id: "auth-1"
              captures: { appt1: "$.data.id" }
            - call: "POST /civic/appointments/${appt1}/confirm"
              payload: { yes_votes: 3, no_votes: 0 }
              as: ConfirmingMember
              as_user_id: "cm-1"
            - call: "GET /civic/terms"
              payload: { seat_id: "${s1}" }
              as: BoardClerk
              captures: { t1: "$.data[0].id" }
            - call: "POST /civic/vacancies"
              payload: { seat_id: "${s2}", reason: "NEW_SEAT", application_deadline: "2026-12-31T00:00:00Z" }
              as: BoardClerk
              captures: { v2: "$.data.id" }
            - call: "POST /civic/applications"
              payload: { applicant_id: "${ap2}", vacancy_id: "${v2}", residency_attested: true }
