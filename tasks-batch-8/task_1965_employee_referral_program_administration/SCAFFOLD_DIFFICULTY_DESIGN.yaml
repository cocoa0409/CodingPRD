  # =================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: referral_info_request_cycle
        grounds:
          - state_machines.Referral.UNDER_REVIEW_to_NEEDS_INFO
          - state_machines.Referral.NEEDS_INFO_to_UNDER_REVIEW
        distinguishing_aspect: |
          Referral machine is cyclic: UNDER_REVIEW -> NEEDS_INFO ->
          UNDER_REVIEW loops (not a linear pipeline), and the loop is
          repeatable with the event log recording each lap.
        test_recipe:
          setup:
            - "Default policy ACTIVE; eligible referrer; OPEN IC requisition; one SUBMITTED referral"
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E900", full_name: "Rec Ru", email: "rec@corp.com", department: "TALENT", job_level: "IC", is_recruiter: true, hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-IC-1", title: "Engineer", department: "ENGINEERING", level: "IC" }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "ca@x.com", candidate_full_name: "C A" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_a: $.data.id }
            - call: "POST /erp/referrals/${ref_a}/review"
              as: Recruiter
              as_user_id: "${rec_id}"
          trigger:
            - call: "POST /erp/referrals/${ref_a}/request-info"
              payload: { note: "need resume" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/provide-info"
              payload: { note: "attached" }
              as: Employee
              as_user_id: "${emp_a}"
            - call: "POST /erp/referrals/${ref_a}/request-info"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/provide-info"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_a}/qualify"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "GET /erp/referrals/${ref_a}/events"
              as: Recruiter
          assert:
            - "Referral.${ref_a}.status == QUALIFIED after two full loop laps"
            - "Events list contains exactly 7 entries in order: SUBMIT, REVIEW, REQUEST_INFO, PROVIDE_INFO, REQUEST_INFO, PROVIDE_INFO, QUALIFY"
            - "Second REQUEST_INFO succeeded from UNDER_REVIEW — proving the cycle re-entered"

      - name: requisition_pause_resume_cycle
        grounds:
          - state_machines.JobRequisition.OPEN_to_PAUSED
          - state_machines.JobRequisition.PAUSED_to_OPEN
          - validations[priority=8]
        distinguishing_aspect: |
          JobRequisition machine is cyclic (OPEN -> PAUSED -> OPEN), a
          different entity than the Referral cycle; submissions are rejected
          while PAUSED and accepted again after resume, proving the loop
          actually re-opens the intake gate.
        test_recipe:
          setup:
            - "Default policy ACTIVE; eligible referrer; requisition created and opened"
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-IC-1", title: "Engineer", department: "ENGINEERING", level: "IC" }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/job-requisitions/${req_id}/pause"
              as: TalentAdmin
          trigger:
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "c1@x.com", candidate_full_name: "C One" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { err: $.data.error_id }
            - call: "POST /erp/job-requisitions/${req_id}/resume"
              as: TalentAdmin
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "c1@x.com", candidate_full_name: "C One" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_a: $.data.id, st: $.data.status }
          assert:
            - "First submission while PAUSED rejected with ERR_REQUISITION_NOT_OPEN (409)"
            - "JobRequisition.${req_id}.status == OPEN after resume"
            - "Second submission succeeds: Referral.${ref_a}.status == SUBMITTED"
            - "open_referral_count == 1 after the cycle completes"

      - name: offer_declined_interviewing_loop
        grounds:
          - state_machines.Referral.OFFER_EXTENDED_to_INTERVIEWING
          - state_machines.Referral.OFFER_EXTENDED_to_HIRED
        distinguishing_aspect: |
          Referral machine has a second, independent cycle: a declined offer
          loops OFFER_EXTENDED back to INTERVIEWING and the referral can be
          re-offered and hired; milestones exist only after the final HIRE,
          not after the declined offer.
        test_recipe:
          setup:
            - "Default policy ACTIVE; eligible referrer; OPEN IC requisition; referral advanced to OFFER_EXTENDED"
          setup_api_calls:
