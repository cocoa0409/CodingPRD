            - { call: "GET /suppliers/${sup_id}/scorecard", payload: {}, as: ComplianceOfficer, captures: { ver_after2: $.data.verified_score, tier_after2: $.data.consequence_tier, pen2: $.data.escalation_penalty_points } }
