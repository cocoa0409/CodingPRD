            - { call: "POST /co-pack-contracts/${ct1}/submit", payload: {}, as: CustomerRep, as_user_id: "${c_pl}" }
            - { call: "POST /co-pack-contracts/${ct1}/approve", payload: {}, as: PlantManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: PlantManager }
            - { call: "POST /lines", payload: { line_code: "L-1", format: NOVELTY, rate_units_per_hour: 12000 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /tunnels", payload: { tunnel_code: "T-1", max_units_per_hour: 20000 }, as: PlantManager, captures: { t1: $.data.id } }
            - { call: "POST /freezer-zones", payload: { zone_code: "Z-A", pallet_capacity: 400 }, as: PlantManager, captures: { z_a: $.data.id } }
            - { call: "POST /mix-batches", payload: { batch_code: "MB-C", product_id: "${p_cp}", litres_produced: 500 }, as: ProductionPlanner, captures: { m1: $.data.id } }
            - { call: "POST /mix-batches/${m1}/pasteurize", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /mix-batches/${m1}/release", payload: {}, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /production-runs", payload: { run_code: "R-C1", product_id: "${p_cp}", line_id: "${l1}", planned_units: 4000, scheduled_start: "2026-08-05T10:00:00Z" }, as: ProductionPlanner, captures: { r1: $.data.id } }
            - { call: "POST /changeovers", payload: { line_id: "${l1}", to_product_id: "${p_cp}" }, as: ProductionPlanner, captures: { ch1: $.data.id } }
            - { call: "POST /changeovers/${ch1}/complete", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /changeovers/${ch1}/verify", payload: { outcome: PASS }, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /tunnel-bookings", payload: { tunnel_id: "${t1}", run_id: "${r1}", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T10:00:00Z" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${r1}/assign-mix", payload: { mix_batch_id: "${m1}" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${r1}/start", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /production-runs/${r1}/complete", payload: { actual_units: 4000, mix_metered_litres: 200.0, zone_id: "${z_a}" }, as: LineOperator, as_user_id: "op_1" }
            - { call: "GET /inventory-lots", payload: { run_id: "${r1}" }, as: QAManager, captures: { lot1: "$.data[0].id" } }
            - { call: "POST /shipments", payload: { shipment_code: "SH-C1", customer_id: "${c_pl}", contract_id: "${ct1}" }, as: WarehouseLead, captures: { s1: $.data.id } }
            - { call: "POST /shipments/${s1}/allocations", payload: { lot_id: "${lot1}", units: 4000 }, as: WarehouseLead }
            - { call: "POST /shipments/${s1}/load", payload: {}, as: WarehouseLead }
            - { call: "POST /shipments/${s1}/dispatch", payload: {}, as: WarehouseLead }
            - { call: "POST /shipments/${s1}/deliver", payload: {}, as: WarehouseLead }
          trigger:
            - call: "POST /co-pack-contracts/${ct1}/cancel"
              payload: {}
              as: PlantManager
              captures: { ct_status: $.data.status, ct_pct: $.data.fulfillment_pct, ct_pen: $.data.shortfall_penalty_cents }
          assert:
            - "CoPackContract.${ct1}.status == CANCELED"
            - "delivered_units == 4000 and fulfillment_pct == 40.0 (2dp round_half_up of 4000/10000*100)"
            - "shortfall_penalty_cents == 525000 ((10000-4000) * 250 * 0.35; pct 40.0 < 50 selects the 0.35 tier — pinned order delivered -> pct -> tier -> penalty)"

