        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[revoke-designation-stale-estate]
          - errors[ERR_STALE_ESTATE_VERSION]
        distinguishing_aspect: |
          Client reads estate.version=V, then a second writer revokes a different designation (bumping estate.version to V+1). The original writer's POST /beneficiary-designations/{id}/revoke with expected_estate_version=V is rejected with ERR_STALE_ESTATE_VERSION (412).
        test_recipe:
          setup:
            - "Estate ALIVE with two ACTIVE designations (A 6000bp, B 4000bp); estate.version observed at V."
          setup_api_calls:
