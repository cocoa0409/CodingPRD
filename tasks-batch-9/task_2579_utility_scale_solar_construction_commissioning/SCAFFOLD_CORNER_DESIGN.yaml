      - name: energization_marks_the_approved_backfeed_window_executed
        claim_type: cross_entity
        grounds:
          - state_machines.Substation.BACKFEED_REQUESTED_to_ENERGIZED
          - state_machines.OutageWindow.APPROVED_to_EXECUTED
          - entities.Substation.fields.energizing_outage_window_id
        distinguishing_aspect: "One write on the Substation mutates a sibling aggregate: the OutageWindow whose closed interval contains the clock moves APPROVED -> EXECUTED and gains a version, while a second APPROVED window on the same substation is left strictly alone."
        test_recipe:
          setup:
            - "One substation at BACKFEED_REQUESTED with two APPROVED windows — a BACKFEED window [2026-08-10T00:00Z, 04:00Z] and a TIE_IN window [2026-08-11T00:00Z, 04:00Z] — and the clock at 2026-08-10T02:00:00Z"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Cross Entity Gap", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/substations"
              payload: { substation_code: "S1", interconnection_voltage_kv: 138.0, mv_collection_km: 12.5 }
              as: UtilityCoordinator
              captures: { sub: $.data.id }
            - call: "POST /solar/substations/${sub}/outage-windows"
              payload: { start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-10T04:00:00Z", purpose: "BACKFEED" }
              as: UtilityCoordinator
              captures: { ow1: $.data.id }
            - call: "POST /solar/outage-windows/${ow1}/utility-response"
              payload: { decision: "APPROVE", utility_reference: "SO-4471" }
              as: UtilityCoordinator
              captures: { ow1v: $.data.version }
            - call: "POST /solar/substations/${sub}/outage-windows"
              payload: { start_at: "2026-08-11T00:00:00Z", end_at: "2026-08-11T04:00:00Z", purpose: "TIE_IN" }
              as: UtilityCoordinator
              captures: { ow2: $.data.id }
            - call: "POST /solar/outage-windows/${ow2}/utility-response"
              payload: { decision: "APPROVE", utility_reference: "SO-4480" }
              as: UtilityCoordinator
              captures: { ow2v: $.data.version }
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "STEEL_ERECTED", utility_witness_ref: "W-1" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "EQUIPMENT_SET", utility_witness_ref: "W-2" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "BACKFEED_REQUESTED", utility_witness_ref: "W-3" }
              as: UtilityCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-10T02:00:00Z" }
              as: UtilityCoordinator
          trigger:
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "ENERGIZED", utility_witness_ref: "W-4" }
              as: UtilityCoordinator
              captures: { st: $.data.status, en: $.data.energized_at, link: $.data.energizing_outage_window_id }
            - call: "GET /solar/outage-windows/${ow1}"
              payload: {}
              as: UtilityCoordinator
              captures: { ow1_st: $.data.status, ow1_v2: $.data.version }
            - call: "GET /solar/outage-windows/${ow2}"
              payload: {}
              as: UtilityCoordinator
              captures: { ow2_st: $.data.status, ow2_v2: $.data.version }
          assert:
            - "${st} == ENERGIZED, ${en} == 2026-08-10T02:00:00.000Z (the logical clock) and ${link} == ${ow1}"
            - "${ow1_st} == EXECUTED and ${ow1_v2} == ${ow1v} + 1 — the sibling entity was mutated by a write addressed to the substation"
            - "${ow2_st} == APPROVED and ${ow2_v2} == ${ow2v} — the TIE_IN window does not contain the clock and is untouched"
            - "a further advance on ${sub} is impossible: ENERGIZED is terminal"

      - name: rejected_delivery_receipt_releases_the_yard_reservation
        claim_type: ledger_sync
        grounds:
          - state_machines.Delivery.ARRIVED_to_REJECTED
          - calculations.yard_zone_pallet_ledger
          - entities.YardZone.fields.reserved_pallets
        distinguishing_aspect: "The divergent receipt branch keeps the ancestor ledger in sync: a damage ratio above MAX_DAMAGE_RATIO sets accepted_unit_qty to 0 AND recomputes the zone's reserved/available pallets excluding this delivery, so a reservation that previously exhausted the zone frees it in the same request."
