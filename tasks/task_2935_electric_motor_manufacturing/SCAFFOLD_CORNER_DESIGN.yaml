  # ===========================================================================
  # Cross-cutting complexity layers — cascading_side_effects,
  # dual_variant_calculation, rate_threshold_triggers, optimistic_concurrency
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: scheduling_a_test_under_a_stale_work_order_version_is_rejected_twice_over
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[performance-test-schedule-stale-work-order]
          - endpoints[POST /performance-tests]
          - errors[ERR_STALE_WORK_ORDER_VERSION]
        distinguishing_aspect: |
          The guard is exercised three times against the same work order: one version behind is
          refused; the observed version succeeds; and replaying that very same version immediately
          afterwards is refused, because the successful schedule incremented WorkOrder.version. Only
          a re-read of the row yields a version that works again — which is exactly the claim that
          version increments on every write and that the client must carry the observed value.
        test_recipe:
          setup:
            - "Work order WO1 on design D1 in build_status ASSEMBLED, with dynamometer cell DYNO-1 (max_concurrent_kw 20.0)."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Nordwind Antriebe", tier: "GOLD", jurisdiction: "EU", stocking_program_enrolled: true, committed_annual_units: 500, stock_buffer_units: 10 }
