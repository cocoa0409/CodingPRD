# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2004_traveling_exhibit_tour_management
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: participation_fee_provisional_vs_final_diverge
        grounds:
          - calculations.participation_fee
          - entities.ParticipationContract.fields.provisional_fee_cents
          - entities.ParticipationContract.fields.final_fee_cents
        distinguishing_aspect: |
          PROVISIONAL (projected_attendance=8000, tier1, no uplift) yields
          1_700_000 cents while FINAL (actual_attendance=60000, tier3, 25%
          uplift) yields 2_200_000 cents on the identical contract; the two
          variants of the fee domain diverge purely on the attendance input.
        test_recipe:
          setup:
            - "Tour T in ON_TOUR with one stop S whose contract C is SIGNED with base_fee_cents=2000000, sponsorship_credit_cents=300000 at venue cap 500000"
            - "S.projected_attendance=8000, S.actual_attendance=60000, venue climate_controlled=true so no supervisor needed"
            - "Certificate covering S; shipment leg from null origin to S received and cleared; all crates unpacked with accepted reports"
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Dinosaurs", exhibit_code: "DINO-2026", crate_count: 1, declared_value_cents: 5000000, refurbishment_gap_days: 7 }
              as: TourManager
              captures: { tour_id: $.data.id, tour_v0: $.data.version }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-01", contents_value_cents: 5000000 }
              as: TourManager
              captures: { crate_id: $.data.id }
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /venues"
              payload: { name: "City Museum", city: "Denver", climate_controlled: true, max_gallery_sqm: 2000, local_sponsorship_cap_cents: 500000 }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tour_v1: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-09-01T00:00:00Z", open_date: "2026-09-05T00:00:00Z", close_date: "2026-11-01T00:00:00Z", teardown_end: "2026-11-05T00:00:00Z", projected_attendance: 8000, expected_tour_version: "${tour_v1}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract"
              payload: { base_fee_cents: 2000000, sponsorship_credit_cents: 300000 }
              as: TourManager
              captures: { contract_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract/transition"
              payload: { action: "SEND" }
              as: TourManager
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract/transition"
              payload: { action: "SIGN" }
              as: VenueRegistrar
            - call: "POST /tours/${tour_id}/certificates"
              payload: { tour_stop_id: "${stop_id}", insurer_name: "Axis", coverage_cents: 5000000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: Insurer
            - call: "POST /tours/${tour_id}/shipments"
              payload: { origin_stop_id: null, destination_stop_id: "${stop_id}", depart_at: "2026-08-25T00:00:00Z", arrive_at: "2026-08-30T00:00:00Z", carrier_name: "FineArt Freight", crate_ids: ["${crate_id}"] }
              as: TourManager
              captures: { ship_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "DISPATCH" }
              as: Shipper
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "DEPART" }
              as: Shipper
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "RECEIVE" }
              as: Registrar
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports"
              payload: { crate_id: "${crate_id}", inspector_name: "R. Registrar", phase: "UNPACK", surface_score: 90, structural_score: 80, seal_intact: true }
              as: Registrar
              captures: { report_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports/${report_id}/transition"
              payload: { action: "SUBMIT" }
              as: Registrar
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports/${report_id}/transition"
              payload: { action: "ACCEPT" }
              as: TourManager
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "CLEAR" }
              as: Registrar
            - call: "POST /tours/${tour_id}/stops/${stop_id}/transition"
              payload: { action: "BEGIN_INSTALL" }
              as: TourManager
            - call: "POST /tours/${tour_id}/stops/${stop_id}/transition"
              payload: { action: "OPEN_TO_PUBLIC" }
              as: TourManager
            - call: "POST /tours/${tour_id}/stops/${stop_id}/transition"
              payload: { action: "BEGIN_TEARDOWN" }
              as: TourManager
            - call: "PATCH /tours/${tour_id}/stops/${stop_id}"
              payload: { actual_attendance: 60000 }
              as: VenueRegistrar
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports"
              payload: { crate_id: "${crate_id}", inspector_name: "R. Registrar", phase: "PACK", surface_score: 90, structural_score: 80, seal_intact: true }
              as: Registrar
              captures: { pack_report_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports/${pack_report_id}/transition"
              payload: { action: "SUBMIT" }
              as: Registrar
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports/${pack_report_id}/transition"
              payload: { action: "ACCEPT" }
              as: TourManager
          trigger:
            - call: "POST /tours/${tour_id}/stops/${stop_id}/transition"
              payload: { action: "CLOSE_STOP" }
              as: TourManager
            - call: "GET /tours/${tour_id}/stops/${stop_id}/contract"
              payload: {}
              as: TourManager
              captures: { prov_fee: "$.data[0].provisional_fee_cents", final_fee: "$.data[0].final_fee_cents" }
          assert:
            - "ParticipationContract.${contract_id}.provisional_fee_cents == 1700000"
            - "ParticipationContract.${contract_id}.final_fee_cents == 2200000"
            - "ParticipationContract.${contract_id}.status == FINALIZED"
            - "Tour.${tour_id}.total_billed_cents == 2200000"

      - name: condition_score_seal_breach_vs_intact_diverge
        grounds:
          - calculations.condition_score
          - entities.ConditionReport.fields.composite_score
        distinguishing_aspect: |
          Two ConditionReports with identical surface_score=90 and
          structural_score=84 diverge solely on seal_intact: intact yields 84,
          breached yields 40 (SEAL_BREACH_CAP) — a second entity domain
          (condition/inspection, not fees) exhibiting dual-variant behavior.
        test_recipe:
          setup:
            - "Tour T BOOKING->ON_TOUR-capable, stop S CONTRACTED, certificate issued, shipment leg RECEIVED with two crates C1 and C2 on the manifest"
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Gems", exhibit_code: "GEMS-2026", crate_count: 2, declared_value_cents: 9000000, refurbishment_gap_days: 5 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-01", contents_value_cents: 4000000 }
              as: TourManager
              captures: { crate1_id: $.data.id }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-02", contents_value_cents: 5000000 }
              as: TourManager
              captures: { crate2_id: $.data.id }
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /venues"
              payload: { name: "Hall A", city: "Portland", climate_controlled: true, max_gallery_sqm: 1500, local_sponsorship_cap_cents: 100000 }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tour_v: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-09-10T00:00:00Z", open_date: "2026-09-15T00:00:00Z", close_date: "2026-10-15T00:00:00Z", teardown_end: "2026-10-20T00:00:00Z", projected_attendance: 5000, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "POST /tours/${tour_id}/certificates"
              payload: { tour_stop_id: "${stop_id}", insurer_name: "Axis", coverage_cents: 9000000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z" }
              as: Insurer
            - call: "POST /tours/${tour_id}/shipments"
              payload: { origin_stop_id: null, destination_stop_id: "${stop_id}", depart_at: "2026-09-01T00:00:00Z", arrive_at: "2026-09-08T00:00:00Z", carrier_name: "FineArt Freight", crate_ids: ["${crate1_id}", "${crate2_id}"] }
              as: TourManager
              captures: { ship_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "DISPATCH" }
              as: Shipper
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "DEPART" }
              as: Shipper
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "RECEIVE" }
              as: Registrar
          trigger:
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports"
              payload: { crate_id: "${crate1_id}", inspector_name: "Reg A", phase: "UNPACK", surface_score: 90, structural_score: 80, seal_intact: true }
              as: Registrar
              captures: { rep1_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports/${rep1_id}/transition"
              payload: { action: "SUBMIT" }
              as: Registrar
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports"
              payload: { crate_id: "${crate2_id}", inspector_name: "Reg B", phase: "UNPACK", surface_score: 90, structural_score: 80, seal_intact: false }
              as: Registrar
              captures: { rep2_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports/${rep2_id}/transition"
              payload: { action: "SUBMIT" }
              as: Registrar
          assert:
            - "ConditionReport.${rep1_id}.composite_score == 84"
            - "ConditionReport.${rep2_id}.composite_score == 40"
            - "Shipment.${ship_id}.status == DAMAGE_HOLD  # rep2 score 40 < DAMAGE_THRESHOLD 70"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: participation_fee_tiered_uplift_with_credit_cap
        grounds:
          - calculations.participation_fee
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — tiered attendance
          uplift on base fee followed by a sponsorship credit capped by min of
          three values; at base=1_000_000, projected=20_000, credit=200_000,
          venue cap=150_000 the venue cap binds and provisional fee = 950_000.
        test_recipe:
          setup:
            - "Tour T in BOOKING, venue V with local_sponsorship_cap_cents=150000, stop S TENTATIVE with projected_attendance=20000"
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Textiles", exhibit_code: "TEXT-2026", crate_count: 1, declared_value_cents: 1000000, refurbishment_gap_days: 3 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-01", contents_value_cents: 1000000 }
              as: TourManager
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /venues"
              payload: { name: "Fiber Hall", city: "Raleigh", climate_controlled: true, max_gallery_sqm: 900, local_sponsorship_cap_cents: 150000 }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tour_v: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-09-01T00:00:00Z", open_date: "2026-09-05T00:00:00Z", close_date: "2026-10-05T00:00:00Z", teardown_end: "2026-10-09T00:00:00Z", projected_attendance: 20000, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract"
              payload: { base_fee_cents: 1000000, sponsorship_credit_cents: 200000 }
              as: TourManager
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /tours/${tour_id}/stops/${stop_id}/contract/transition"
              payload: { action: "SEND" }
              as: TourManager
          assert:
            - "ParticipationContract.${contract_id}.provisional_fee_cents == 950000  # uplift 100000 (tier2), credit capped at venue cap 150000"

      - name: damage_claim_payout_rounding_order
        grounds:
          - calculations.damage_claim_payout
        distinguishing_aspect: |
          Mode (b): rounding order pinned — round per line item first then sum.
          Three 13-cent lines yield per-line round(10.4)=10, sum 30; the
          alternative sum-then-round yields round(31.2)=31. Scaffold pins 30.
        test_recipe:
          setup:
            - "Tour T with stop S, certificate coverage 9000000, shipment RECEIVED in DAMAGE_HOLD via a low-scoring UNPACK report, claim filed with 3 line items of 13 cents each and claimed_amount_cents=39"
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Icons", exhibit_code: "ICON-2026", crate_count: 1, declared_value_cents: 8000000, refurbishment_gap_days: 2 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-01", contents_value_cents: 8000000 }
              as: TourManager
              captures: { crate_id: $.data.id }
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /venues"
              payload: { name: "Chapel Gallery", city: "Santa Fe", climate_controlled: true, max_gallery_sqm: 600, local_sponsorship_cap_cents: 0 }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tour_v: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-09-01T00:00:00Z", open_date: "2026-09-03T00:00:00Z", close_date: "2026-10-03T00:00:00Z", teardown_end: "2026-10-06T00:00:00Z", projected_attendance: 3000, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "POST /tours/${tour_id}/certificates"
              payload: { tour_stop_id: "${stop_id}", insurer_name: "Axis", coverage_cents: 9000000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z" }
              as: Insurer
            - call: "POST /tours/${tour_id}/shipments"
              payload: { origin_stop_id: null, destination_stop_id: "${stop_id}", depart_at: "2026-08-20T00:00:00Z", arrive_at: "2026-08-28T00:00:00Z", carrier_name: "Carrier X", crate_ids: ["${crate_id}"] }
              as: TourManager
              captures: { ship_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "DISPATCH" }
              as: Shipper
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "DEPART" }
              as: Shipper
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "RECEIVE" }
              as: Registrar
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports"
              payload: { crate_id: "${crate_id}", inspector_name: "Reg", phase: "UNPACK", surface_score: 60, structural_score: 50, seal_intact: true }
              as: Registrar
              captures: { rep_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports/${rep_id}/transition"
              payload: { action: "SUBMIT" }
              as: Registrar
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/claims"
              payload:
                condition_report_id: "${rep_id}"
                claimed_amount_cents: 39
                line_items:
                  - { description: "corner chip", amount_cents: 13 }
                  - { description: "frame scratch", amount_cents: 13 }
                  - { description: "glass scuff", amount_cents: 13 }
              as: Registrar
              captures: { claim_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/claims/${claim_id}/transition"
              payload: { action: "REVIEW" }
              as: TourManager
          trigger:
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/claims/${claim_id}/transition"
              payload: { action: "APPROVE" }
              as: Insurer
          assert:
            - "DamageClaim.${claim_id}.assessed_payout_cents == 30  # per-line round_half_up(13*0.8)=10, summed 30, cap round(39*0.9)=35 not binding"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: shipment_received_damage_hold_cycle
        grounds:
          - state_machines.Shipment.RECEIVED_to_DAMAGE_HOLD
          - state_machines.Shipment.DAMAGE_HOLD_to_RECEIVED
        distinguishing_aspect: |
          Shipment has a cycle RECEIVED -> DAMAGE_HOLD -> RECEIVED; after the
          last open DamageClaim reaches DENIED the shipment returns to RECEIVED
          and can later be damaged again — a non-linear cyclic machine.
        test_recipe:
          setup:
            - "Shipment RECEIVED in DAMAGE_HOLD due to UNPACK report with composite 40; one DamageClaim FILED"
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Masks", exhibit_code: "MASK-2026", crate_count: 1, declared_value_cents: 2000000, refurbishment_gap_days: 2 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-01", contents_value_cents: 2000000 }
              as: TourManager
              captures: { crate_id: $.data.id }
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
            - call: "POST /venues"
              payload: { name: "Tribal Arts Hall", city: "Chicago", climate_controlled: true, max_gallery_sqm: 700, local_sponsorship_cap_cents: 0 }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tour_v: $.data.version }
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", install_start: "2026-09-01T00:00:00Z", open_date: "2026-09-04T00:00:00Z", close_date: "2026-10-04T00:00:00Z", teardown_end: "2026-10-07T00:00:00Z", projected_attendance: 4000, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: $.data.id }
            - call: "POST /tours/${tour_id}/certificates"
              payload: { tour_stop_id: "${stop_id}", insurer_name: "Axis", coverage_cents: 2000000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z" }
              as: Insurer
            - call: "POST /tours/${tour_id}/shipments"
              payload: { origin_stop_id: null, destination_stop_id: "${stop_id}", depart_at: "2026-08-20T00:00:00Z", arrive_at: "2026-08-28T00:00:00Z", carrier_name: "Carrier X", crate_ids: ["${crate_id}"] }
              as: TourManager
              captures: { ship_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "DISPATCH" }
              as: Shipper
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "DEPART" }
              as: Shipper
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/transition"
              payload: { action: "RECEIVE" }
              as: Registrar
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports"
              payload: { crate_id: "${crate_id}", inspector_name: "Reg", phase: "UNPACK", surface_score: 90, structural_score: 80, seal_intact: false }
              as: Registrar
              captures: { rep_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/reports/${rep_id}/transition"
              payload: { action: "SUBMIT" }
              as: Registrar
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/claims"
              payload:
                condition_report_id: "${rep_id}"
                claimed_amount_cents: 100000
                line_items:
                  - { description: "seal breach handling", amount_cents: 100000 }
              as: Registrar
              captures: { claim_id: $.data.id }
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/claims/${claim_id}/transition"
              payload: { action: "REVIEW" }
              as: TourManager
          trigger:
            - call: "POST /tours/${tour_id}/shipments/${ship_id}/claims/${claim_id}/transition"
              payload: { action: "DENY" }
              as: Insurer
          assert:
            - "Shipment.${ship_id}.status == RECEIVED  # cycle returned once all claims terminal"
            - "DamageClaim.${claim_id}.status == DENIED"
            - "DamageClaim.${claim_id}.assessed_payout_cents == 0"

      - name: tourstop_teardown_reopen_branching
        grounds:
          - state_machines.TourStop.TEARDOWN_to_OPEN
          - state_machines.TourStop.OPEN_to_TEARDOWN
        distinguishing_aspect: |
          TourStop supports a branching revert TEARDOWN -> OPEN (REOPEN) while
          the contract is not FINALIZED, distinct from Shipment's cycle; the
          forward path TEARDOWN -> CLOSED remains available afterwards.
        test_recipe:
          setup:
            - "Stop S in TEARDOWN after a clean OPEN period; contract SIGNED (not FINALIZED)"
          setup_api_calls:
            - call: "POST /tours"
              payload: { title: "Coders", exhibit_code: "CODE-2026", crate_count: 1, declared_value_cents: 1000000, refurbishment_gap_days: 1 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/crates"
              payload: { crate_label: "CRATE-01", contents_value_cents: 1000000 }
              as: TourManager
              captures: { crate_id: $.data.id }
            - call: "POST /tours/${tour_id}/transition"
              payload: { action: "OPEN_BOOKING" }
              as: TourManager
