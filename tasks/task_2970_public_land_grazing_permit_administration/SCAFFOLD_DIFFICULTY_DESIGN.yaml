              payload: { name: "Short Season Cattle", contact_email: "shortseason@example.com" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { m17_id: "$.data.id" }
            - call: "POST /permittees/${m17_id}/base-properties"
              payload: { base_property_type: "LAND", legal_description: "T35N R62E Sec 20 SE", carrying_capacity_aums: 400, controlled_since_date: "2014-07-01" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { bp17_id: "$.data.id" }
            - call: "POST /grazing-permits"
              payload: { allotment_id: "${a12_id}", permittee_id: "${m17_id}", base_property_id: "${bp17_id}", requested_aums: 300, term_start_date: "2026-01-01", term_end_date: "2030-12-31", livestock_kind: "CATTLE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { g13_id: "$.data.id" }
            - call: "POST /grazing-permits/${g13_id}/issue"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /annual-operating-instructions"
              payload: { permit_id: "${g13_id}", grazing_year: 2026, authorized_aums: 300, season_start_date: "2026-01-01", season_end_date: "2026-12-31" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { aoi13_id: "$.data.id" }
            - call: "POST /annual-operating-instructions/${aoi13_id}/use-records"
              payload: { pasture_id: "${p15_id}", planned_entry_date: "2026-04-01", planned_exit_date: "2026-05-02", planned_head_count: 100, livestock_kind: "CATTLE" }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { ur13_id: "$.data.id" }
            - call: "POST /annual-operating-instructions/${aoi13_id}/issue"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "GET /grazing-bills"
              payload: { aoi_id: "${aoi13_id}", bill_type: "PRELIMINARY_USE" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
              captures: { bill13_id: "$.data.items[0].id" }
            - call: "POST /pasture-use-records/${ur13_id}/report-actual-use"
              payload: { actual_entry_date: "2026-04-01", actual_exit_date: "2026-05-03", actual_head_count: 70 }
              as: Permittee
