            - { call: "POST /api/servers", payload: { tournament_id: "${t}", label: "S1", region: NA }, as: OrganizerAdmin, captures: { s1: $.data.id } }
            - { call: "GET /api/matches?tournament_id=${t}", as: TournamentDirector, captures: { mf: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/matches/${mf}/schedule", payload: { server_id: "${s1}", scheduled_start_at: "2026-08-11T20:00:00Z", duration_minutes: 120, assigned_referee_id: "ref-1" }, as: TournamentDirector, captures: { err: $.data.error_id } }
            - { call: "POST /api/matches/${mf}/schedule", payload: { server_id: "${s1}", scheduled_start_at: "2026-08-11T20:00:00Z", duration_minutes: 119, assigned_referee_id: "ref-1" }, as: TournamentDirector }
