      - name: case_state_rung_outranks_the_escalation_floor_rung
        claim_type: error_triggerable
        grounds: [validations.priority_41, validations.priority_88, errors.ERR_SEVERITY_BELOW_ESCALATION_FLOOR]
        distinguishing_aspect: >-
          The same escalate call is made twice against the same low-severity case: once from DETECTED
          and once from TAKEDOWN_ISSUED. The first must report the state rung (priority 41) and the
          second the severity floor (priority 88), which is the only way to show the ordering rather
          than a lucky single error. A third attempt from the terminal RESOLVED_REMOVED proves the
          terminal lockdown answers with the state rung again.
        test_recipe:
          setup:
            - "CA profile and one LIVING CA talent with no grants, so rights_posture is CLEAR (POSTURE_FACTOR 0.30)"
            - "One case at match_confidence 0.500 and 400000 detected views: 0.60*0.500 + 0.25*0.04 + 0.15*0.30 = 0.3550, below ESCALATION_FLOOR 0.5000 and below MANDATORY_TAKEDOWN_THRESHOLD 0.7500"
          setup_api_calls:
            - call: "POST /state-law-profiles"
              payload: { state_code: "CA", postmortem_rights_years: 70, postmortem_requires_registration: true, biometric_retention_max_days: 3650, deletion_grace_days: 30, removal_window_days: 14, disclosure_required_advertising: true, disclosure_required_entertainment: true, min_disclosure_rank_advertising: 3, min_disclosure_rank_entertainment: 2 }
              as: RightsAdministrator
            - call: "POST /talents"
              payload: { legal_name: "Ava Reyes", domicile_state_code: "CA" }
              as: RightsAdministrator
              captures: { t_id: $.data.id }
            - call: "POST /infringement-cases"
              payload: { talent_id: "${t_id}", detection_source: "MONITORING_FEED", suspect_url: "https://pirate.example/low", detected_channel: "ENTERTAINMENT", detected_state_code: "CA", detected_view_count: 400000, match_confidence: 0.500 }
              as: ComplianceOfficer
              as_user_id: "co-001"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /infringement-cases/${c_id}/escalate"
              payload: { escalation_note: "too early" }
              as: RightsAdministrator
              as_user_id: "ra-001"
            - call: "POST /infringement-cases/${c_id}/triage"
              payload: { decision: "ISSUE_TAKEDOWN" }
              as: ComplianceOfficer
              as_user_id: "co-001"
            - call: "POST /infringement-cases/${c_id}/escalate"
              payload: { escalation_note: "now try legal" }
              as: RightsAdministrator
              as_user_id: "ra-001"
            - call: "POST /infringement-cases/${c_id}/close"
              payload: { outcome: "REMOVED" }
              as: RightsAdministrator
              as_user_id: "ra-001"
            - call: "POST /infringement-cases/${c_id}/escalate"
              payload: { escalation_note: "after the fact" }
              as: RightsAdministrator
              as_user_id: "ra-002"
          assert:
            - "the created case reports severity_score == 0.3550 exactly"
            - "trigger call 1 -> 409 with data.error_id == \"ERR_INVALID_CASE_STATE\": escalate requires TAKEDOWN_ISSUED, and the severity floor is NOT consulted because priority 41 precedes priority 88"
            - "trigger call 2 -> 200 with status \"TAKEDOWN_ISSUED\", triaged_by_user_id == \"co-001\" and takedown_issued_at == \"2026-08-01T00:00:00Z\""
            - "trigger call 3 -> 409 with data.error_id == \"ERR_SEVERITY_BELOW_ESCALATION_FLOOR\" — now the state rung passes and the floor rung bites; escalated_by_user_id stays null and the talent's rights_posture stays \"CLEAR\" (no FROZEN leak from a refused escalation)"
            - "trigger call 4 -> 200 with status \"RESOLVED_REMOVED\", closure_outcome \"REMOVED\", closed_by_user_id \"ra-001\" and legal_hold_applied_count still 0"
            - "trigger call 5 -> 409 ERR_INVALID_CASE_STATE again: RESOLVED_REMOVED is terminal, and the case is not readmitted to the escalation path even by a different administrator"

      - name: impounded_asset_refuses_purge_until_the_case_closes
        claim_type: error_triggerable
        grounds: [validations.priority_36, validations.priority_52, errors.ERR_ASSET_UNDER_LEGAL_HOLD, errors.ERR_TAKEDOWN_MANDATORY]
        distinguishing_aspect: >-
          ERR_ASSET_UNDER_LEGAL_HOLD is reachable only because the priority-36 state rung deliberately
          admits LEGAL_HOLD and defers. This walks the whole arc — mandatory takedown at severity
          0.8950, escalation, refused purge, closure, permitted purge — so an implementation that
          folds the hold into the generic asset-state error is caught, and so is one that forgets to
          release the hold at closure.
        test_recipe:
          setup:
            - "CA profile; one CA talent with an ACTIVE grant and one stored asset bound to no replica"
            - "One case at match_confidence 1.000 with 10000000 views: 0.60 + 0.25*1.0 + 0.15*0.30 = 0.8950, above MANDATORY_TAKEDOWN_THRESHOLD"
