          trigger:
            - { call: "POST /orders/${o1}/return-order", payload: {}, as: ProcurementCoordinator }
          assert:
            - "ProcurementOrder.${o1}.status == RETURNED (hop A)"
            - "PunchListItem.${pi}.status == WAIVED and DesignSelection.${s1}.status == SPECIFIED (hop B)"
            - "Project.${pid}.committed_cents == 0 (hop C: returned order leaves the committed set)"
