scaffold_corner_design:
  - section: entities
    instances:
      - name: create_audit_program_with_all_required_fields_returns_full_row
        claim_type: creation
        grounds:
          - entities.AuditProgram
          - endpoints.POST_/audit-programs
          - response_envelope.success
        distinguishing_aspect: "A 201 must carry the whole AuditProgram row inside the fixed envelope: meta.api_request_id, response_type object, and data holding the four common fields plus every configured threshold and the four computed rollup fields at their initial values."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /audit-programs"
              payload: { name: "Basin EMD QA", accreditation_body: "IAED", target_compliance_pct: 92.0, watch_floor_pct: 81.0, high_risk_target_pct: 86.0, review_deadline_days: 21, rebuttal_window_days: 10, max_rebuttal_rounds: 3, escalated_sample_floor: 30, hours_owed_restriction_threshold: 5.0 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          assert:
            - "HTTP 201 and response_type == object"
            - "meta.api_request_id and meta.api_request_timestamp are present"
            - "data.id is a UUID with no type prefix, data.version == 1, data.created_at and data.updated_at are ISO 8601 UTC with three fractional digits"
            - "data.name == Basin EMD QA, data.accreditation_body == IAED, data.target_compliance_pct == 92.0, data.watch_floor_pct == 81.0, data.high_risk_target_pct == 86.0, data.review_deadline_days == 21, data.rebuttal_window_days == 10, data.max_rebuttal_rounds == 3, data.escalated_sample_floor == 30, data.hours_owed_restriction_threshold == 5.0"
            - "data.accreditation_status == SETUP, data.latest_compliance_pct == null, data.submitted_report_count == 0, data.sentinel_event_count == 0"

      - name: audit_program_threshold_defaults_are_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.AuditProgram.fields.target_compliance_pct
          - entities.AuditProgram.fields.watch_floor_pct
          - entities.AuditProgram.fields.hours_owed_restriction_threshold
        distinguishing_aspect: "Every accreditation threshold has a declared default; omitting all eight optional inputs must produce 90.0 / 80.0 / 85.0 / 30 / 14 / 2 / 25 / 6.0 rather than nulls or zeros."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /audit-programs"
              payload: { name: "Minimal EMD QA", accreditation_body: "STATE_OEMS" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          assert:
            - "data.target_compliance_pct == 90.0, data.watch_floor_pct == 80.0, data.high_risk_target_pct == 85.0"
            - "data.review_deadline_days == 30, data.rebuttal_window_days == 14, data.max_rebuttal_rounds == 2"
            - "data.escalated_sample_floor == 25, data.hours_owed_restriction_threshold == 6.0"
            - "GET /audit-programs/${prog_id} returns the same defaults, proving they were persisted rather than only echoed"

      - name: get_dispatcher_returns_the_stored_row_with_ledger_defaults
        claim_type: retrieval
        grounds:
          - entities.Dispatcher
          - endpoints.GET_/dispatchers/{id}
        distinguishing_aspect: "A freshly enrolled dispatcher reads back with certification_status PROVISIONAL, compliance_pct null (not 0.0), compliance_posture UNRATED, dispatch_privilege FULL and both ledgers at zero — the untouched baseline every rollup test depends on."
        test_recipe:
          setup:
            - "One AuditProgram."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Basin EMD QA", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-001", full_name: "Ada Rune", hire_date: "2025-04-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id }
          trigger:
            - call: "GET /dispatchers/${d1_id}"
              payload: {}
              as: QaSupervisor
              as_user_id: "sup-1"
          assert:
            - "HTTP 200, response_type == object, data.id == ${d1_id}, data.version == 1"
            - "data.program_id == ${prog_id}, data.employee_code == EMD-001, data.full_name == Ada Rune, data.hire_date == 2025-04-01T00:00:00Z"
            - "data.certification_status == PROVISIONAL, data.certified_protocol_version_id == null, data.certified_at == null"
            - "data.reviewed_case_count == 0, data.compliance_points_total == 0.0, data.compliance_pct == null, data.compliance_posture == UNRATED"
            - "data.remediation_hours_owed == 0.0, data.sentinel_event_count == 0, data.dispatch_privilege == FULL"

      - name: list_dispatchers_filtered_by_program_and_privilege
        claim_type: listing
        grounds:
          - endpoints.GET_/dispatchers
          - response_envelope.pagination_fields
        distinguishing_aspect: "The collection read must return response_type array with total_count and has_more computed against the FILTERED set, not the whole table: two programs are populated and only one program's dispatchers may appear."
        test_recipe:
          setup:
            - "Program A with two dispatchers, program B with one dispatcher."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Program A", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { proga_id: $.data.id }
            - call: "POST /audit-programs"
              payload: { name: "Program B", accreditation_body: "NAED_LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { progb_id: $.data.id }
            - call: "POST /dispatchers"
              payload: { program_id: "${proga_id}", employee_code: "EMD-A1", full_name: "Ada Rune" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { da1_id: $.data.id }
            - call: "POST /dispatchers"
              payload: { program_id: "${proga_id}", employee_code: "EMD-A2", full_name: "Bo Wexler" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { da2_id: $.data.id }
            - call: "POST /dispatchers"
              payload: { program_id: "${progb_id}", employee_code: "EMD-B1", full_name: "Cai Nogueira" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { db1_id: $.data.id }
          trigger:
            - call: "GET /dispatchers"
              payload: { program_id: "${proga_id}", dispatch_privilege: "FULL", limit: 10, offset: 0 }
              as: QaReviewer
              as_user_id: "rev-1"
              captures: { first_id: "$.data[0].id" }
          assert:
            - "HTTP 200 and response_type == array"
            - "data contains exactly 2 elements, both with program_id ${proga_id}; ${db1_id} is absent"
            - "total_count == 2 and has_more == false (the count is scoped to the filter, not to all 3 dispatchers)"
            - "GET /dispatchers with no program_id filter returns total_count == 3"

      - name: get_review_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_REVIEW_NOT_FOUND
          - validations.priority_20_existence
        distinguishing_aspect: "A syntactically valid UUID that matches no Review must produce the entity-specific 404 ERR_REVIEW_NOT_FOUND in the error envelope, not a generic 404 body and not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /reviews/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: QaSupervisor
              as_user_id: "sup-1"
          assert:
            - "HTTP 404, response_type == error, data.error_id == ERR_REVIEW_NOT_FOUND"
            - "meta.api_request_id is still present on the error envelope"
            - "The same unknown-id probe against GET /dispatchers/{id} yields ERR_DISPATCHER_NOT_FOUND, against GET /protocol-versions/{id} yields ERR_PROTOCOL_VERSION_NOT_FOUND, against GET /coaching-plans/{id} yields ERR_COACHING_PLAN_NOT_FOUND and against GET /audit-programs/{id} yields ERR_PROGRAM_NOT_FOUND"

      - name: create_call_record_missing_required_determinant_code_is_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_10_business_constraint
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST_/dispatchers/{id}/call-records
        distinguishing_aspect: "dispatched_determinant_code carries no default, so omitting it is a request-shape failure (ERR_INVALID_REQUEST at priority 10) that must be reported before any determinant decoding is attempted."
        test_recipe:
          setup:
            - "One program with one dispatcher; clock at 2026-08-20T00:00:00Z."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Basin EMD QA", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-001", full_name: "Ada Rune" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /dispatchers/${d1_id}/call-records"
              payload: { call_reference: "C-0001", call_type: "CHEST_PAIN", received_at: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "HTTP 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /dispatchers/${d1_id}/call-records returns 0 elements — nothing was persisted"
            - "Omitting call_reference, call_type or received_at instead produces the same ERR_INVALID_REQUEST, while omitting only the optional cardiac_arrest_confirmed / bystander_cpr_in_progress succeeds with both defaulting to false"

      - name: call_record_computed_priority_and_response_mode_from_determinant_code
        claim_type: computed_fields
        grounds:
          - calculations.determinant_code_decoding
          - entities.CallRecord.fields.dispatched_priority_rank
          - entities.CallRecord.fields.response_mode_assigned
          - entities.CallRecord.fields.resource_assigned
        distinguishing_aspect: "Three fields are derived from the single level letter between the hyphens: 9-E-1 must decode to rank 6 / HOT / ALS, and the suffix and chief-complaint digits must not influence any of them."
        test_recipe:
          setup:
            - "One program with one dispatcher; clock at 2026-08-20T00:00:00Z."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Basin EMD QA", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-001", full_name: "Ada Rune" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /dispatchers/${d1_id}/call-records"
              payload: { call_reference: "C-0001", call_type: "CARDIAC_ARREST", received_at: "2026-08-05T09:00:00Z", dispatched_determinant_code: "9-E-1", cardiac_arrest_confirmed: true, bystander_cpr_in_progress: false }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c1_id: $.data.id }
          assert:
            - "data.dispatched_priority_rank == 6, data.response_mode_assigned == HOT, data.resource_assigned == ALS, data.status == INGESTED"
            - "A second call with dispatched_determinant_code 26-A-1 decodes to dispatched_priority_rank 2, response_mode_assigned COLD, resource_assigned BLS"
            - "A third call with dispatched_determinant_code 10-C-4 decodes to dispatched_priority_rank 4, response_mode_assigned COLD, resource_assigned ALS — level C is ALS but not HOT"
            - "A fourth call with dispatched_determinant_code 6-D-2 decodes to dispatched_priority_rank 5, response_mode_assigned HOT, resource_assigned ALS"

      - name: review_status_and_identity_are_system_minted_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Review.fields.status
          - entities.Review.fields.selection_mode
          - endpoints.POST_/sampling-periods/{id}/target-review
        distinguishing_aspect: "The selection endpoint accepts only call_record_id and selection_reason; a client that also sends id, status, selection_mode, dispatcher_id or version must have those values discarded, with the server minting SELECTED / TARGETED and deriving dispatcher_id from the CallRecord."
        test_recipe:
          setup:
            - "Program with an APPROVED MPDS_CARDSET version in force over 2026-07-01 onward, one dispatcher, one ingested CHEST_PAIN call, and an OPEN TARGETED period [2026-08-01, 2026-09-01) with target_sample_count 1."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Basin EMD QA", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.0", effective_from: "2026-07-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv_id: $.data.id }
            - call: "POST /protocol-versions/${pv_id}/approve"
              payload: { approval_note: "adopted" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-001", full_name: "Ada Rune" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /dispatchers/${d1_id}/call-records"
              payload: { call_reference: "C-0001", call_type: "CHEST_PAIN", received_at: "2026-08-05T09:00:00Z", dispatched_determinant_code: "10-C-4" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c1_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/sampling-periods"
              payload: { call_type: "CHEST_PAIN", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", sampling_mode: "TARGETED", target_sample_count: 1 }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /sampling-periods/${sp_id}/target-review"
              payload: { call_record_id: "${c1_id}", selection_reason: "COMPLAINT", id: "00000000-0000-0000-0000-000000000001", status: "FINALIZED", selection_mode: "RANDOM", version: 99, final_composite_score: 100.0 }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { r1_id: $.data.id }
          assert:
            - "HTTP 201 and data.id != 00000000-0000-0000-0000-000000000001 (the server mints its own UUID)"
            - "data.status == SELECTED and data.version == 1, not FINALIZED and not 99"
            - "data.selection_mode == TARGETED (stamped by the endpoint, not copied from the payload) and data.selection_reason == COMPLAINT"
            - "data.final_composite_score == null and data.current_sheet_round == 0"
            - "data.dispatcher_id == ${d1_id} and data.protocol_version_id == ${pv_id}, both derived rather than supplied"

      - name: sampling_period_with_an_unknown_call_type_enum_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.SamplingPeriod.fields.call_type
          - validations.priority_10_business_constraint
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "call_type is a closed enum of five chief-complaint buckets; a plausible but undeclared value such as STROKE must be refused at request-shape level rather than stored and later mismatched against call records."
        test_recipe:
          setup:
            - "One program."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Basin EMD QA", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /audit-programs/${prog_id}/sampling-periods"
              payload: { call_type: "STROKE", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", sampling_mode: "MIXED", target_sample_count: 5 }
              as: QaSupervisor
              as_user_id: "sup-1"
          assert:
            - "HTTP 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /audit-programs/${prog_id}/sampling-periods returns 0 elements"
            - "sampling_mode PARTIAL is refused the same way, as is a negative target_sample_count"
            - "Control — call_type BREATHING_PROBLEM with sampling_mode RANDOM is accepted with 201"

      - name: score_sheet_carries_no_version_field_and_cannot_be_mutated
        claim_type: immutability
        grounds:
          - entities.ScoreSheet
          - state_machines.Review.SCORED_to_SCORED
        distinguishing_aspect: "ScoreSheet is declared common_fields: false — it has id and created_at only, no updated_at and no version, and §1.5 exposes no update or delete route for it. Correction happens by appending a superseding sheet at the next sheet_round, and the earlier sheet's numbers must remain byte-identical."
        test_recipe:
          setup:
            - "A SCORED review with one sheet (round 1, provisional 78.7) produced from 18/20, 26/30, 2/3, 5/7 with reviewer code 10-C-2 against a dispatched 10-C-4."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Basin EMD QA", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.0", effective_from: "2026-07-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv_id: $.data.id }
            - call: "POST /protocol-versions/${pv_id}/approve"
              payload: { approval_note: "adopted" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-001", full_name: "Ada Rune" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /dispatchers/${d1_id}/call-records"
              payload: { call_reference: "C-0001", call_type: "CHEST_PAIN", received_at: "2026-08-05T09:00:00Z", dispatched_determinant_code: "10-C-4" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c1_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/sampling-periods"
              payload: { call_type: "CHEST_PAIN", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", sampling_mode: "TARGETED", target_sample_count: 1 }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { sp_id: $.data.id }
            - call: "POST /sampling-periods/${sp_id}/target-review"
              payload: { call_record_id: "${c1_id}", selection_reason: "COMPLAINT" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /reviews/${r1_id}/scores"
              payload: { expected_review_version: "${r1_v}", case_entry_points_earned: 18, case_entry_points_possible: 20, key_questions_points_earned: 26, key_questions_points_possible: 30, pre_arrival_points_earned: 2, pre_arrival_points_possible: 3, final_coding_points_earned: 5, final_coding_points_possible: 7, reviewer_determinant_code: "10-C-2" }
              as: QaReviewer
              as_user_id: "rev-1"
              captures: { sheet1_id: $.data.id }
          trigger:
            - call: "GET /reviews/${r1_id}"
              payload: {}
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { r1_v2: $.data.version }
            - call: "POST /reviews/${r1_id}/scores"
              payload: { expected_review_version: "${r1_v2}", case_entry_points_earned: 20, case_entry_points_possible: 20, key_questions_points_earned: 30, key_questions_points_possible: 30, pre_arrival_points_earned: 3, pre_arrival_points_possible: 3, final_coding_points_earned: 7, final_coding_points_possible: 7, reviewer_determinant_code: "10-C-4" }
              as: QaReviewer
              as_user_id: "rev-1"
              captures: { sheet2_id: $.data.id }
          assert:
            - "ScoreSheet.${sheet1_id} exposes id and created_at but no updated_at and no version field"
            - "ScoreSheet.${sheet1_id}.sheet_round == 1 and provisional_composite_score == 78.7 and determinant_accuracy == MINOR_MISCODE, unchanged after the second submission"
            - "ScoreSheet.${sheet2_id}.sheet_round == 2 and provisional_composite_score == 100.0 and determinant_accuracy == ACCURATE"
            - "GET /reviews/${r1_id}/score-sheets returns exactly 2 elements ordered by sheet_round; Review.${r1_id}.current_sheet_round == 2 and Review.${r1_id}.provisional_composite_score == 100.0"

      - name: create_protocol_version_under_an_unknown_program_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ProtocolVersion.fields.program_id
          - validations.priority_20_existence
          - errors.ERR_PROGRAM_NOT_FOUND
        distinguishing_aspect: "The parent id lives in the path, so an unknown program must fail with ERR_PROGRAM_NOT_FOUND (404) before any weight-normalization or window checks run, and no orphan version may be persisted."
        test_recipe:
          setup:
            - "One real program exists, so the failure is attributable to the wrong parent rather than to an empty table."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Basin EMD QA", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /audit-programs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.0", effective_from: "2026-07-01T00:00:00Z", case_entry_weight: 0.5000, key_questions_weight: 0.5000, pre_arrival_weight: 0.5000, final_coding_weight: 0.5000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "HTTP 404 and data.error_id == ERR_PROGRAM_NOT_FOUND — the existence check at priority 20 outranks the weight check, which the deliberately unnormalized 0.5 weights would otherwise trip"
            - "GET /audit-programs/${prog_id}/protocol-versions returns 0 elements"

  - section: state_machines
    instances:
      - name: rejected_rebuttal_decision_restores_the_scored_review
        claim_type: valid_transition
        grounds:
          - state_machines.Review.DISPUTED_to_SCORED
          - state_machines.Rebuttal.SUBMITTED_to_REJECTED
          - endpoints.POST_/rebuttals/{id}/decide
        distinguishing_aspect: "The REJECTED arm is the score-preserving half of the cyclic machine: unlike UPHELD it must leave provisional_composite_score and scored_at exactly as they were, while still stamping decided_by_user_id and bumping Review.version."
        test_recipe:
          setup:
            - "A SCORED review (provisional 78.7) with a SUBMITTED round-1 rebuttal filed by the dispatcher."
          setup_api_calls:
            - call: "POST /audit-programs"
              payload: { name: "Basin EMD QA", accreditation_body: "IAED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.0", effective_from: "2026-07-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv_id: $.data.id }
            - call: "POST /protocol-versions/${pv_id}/approve"
              payload: { approval_note: "adopted" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-001", full_name: "Ada Rune" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /dispatchers/${d1_id}/call-records"
              payload: { call_reference: "C-0001", call_type: "CHEST_PAIN", received_at: "2026-08-05T09:00:00Z", dispatched_determinant_code: "10-C-4" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c1_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/sampling-periods"
              payload: { call_type: "CHEST_PAIN", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", sampling_mode: "TARGETED", target_sample_count: 1 }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { sp_id: $.data.id }
            - call: "POST /sampling-periods/${sp_id}/target-review"
              payload: { call_record_id: "${c1_id}", selection_reason: "COMPLAINT" }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /reviews/${r1_id}/scores"
              payload: { expected_review_version: "${r1_v}", case_entry_points_earned: 18, case_entry_points_possible: 20, key_questions_points_earned: 26, key_questions_points_possible: 30, pre_arrival_points_earned: 2, pre_arrival_points_possible: 3, final_coding_points_earned: 5, final_coding_points_possible: 7, reviewer_determinant_code: "10-C-2" }
              as: QaReviewer
              as_user_id: "rev-1"
            - call: "POST /reviews/${r1_id}/rebuttals"
              payload: { grounds_category: "AUDIO_QUALITY", narrative: "background noise obscured the caller's answers" }
              as: Dispatcher
              as_user_id: "${d1_id}"
              captures: { reb1_id: $.data.id }
          trigger:
            - call: "POST /rebuttals/${reb1_id}/decide"
              payload: { decision: "REJECTED", decision_notes: "audio was audible on the master recording" }
              as: QaSupervisor
              as_user_id: "sup-1"
          assert:
            - "HTTP 200, data.status == REJECTED, data.decided_by_user_id == sup-1, data.round_index == 1"
            - "GET /reviews/${r1_id} shows status == SCORED with provisional_composite_score still 78.7 and scored_at still 2026-08-20T00:00:00.000Z"
            - "Review.rebuttal_round_count remains 1 and Review.version has advanced by exactly 1 relative to the DISPUTED read"
            - "GET /reviews/${r1_id}/score-sheets still returns exactly 1 sheet (a rejected rebuttal creates no new round)"

