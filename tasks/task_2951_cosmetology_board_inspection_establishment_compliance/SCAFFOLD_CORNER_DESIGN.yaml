            - "Inspection.${insp_id}.hazard_state == HAZARD_CLEARED"
            - "Inspection.${insp_id}.status == FINALIZED"
            - "Inspection.${reinsp_id}.final_adjusted_score == 0.00 and final_outcome == PASS and hazard_state == NONE"
            - "Establishment.${est_id}.license_status == ACTIVE"
            - "Establishment.${est_id}.demerit_balance == 8.00"
            - "Establishment.${est_id}.compliance_posture == CLEAR"

      - name: state_machine_parallel_dimensions_move_independently
        claim_type: parallel
        excluded_because:
          difficulty_instance: inspection_hazard_dimension_advances_independently_of_status
          rationale: "The §1.8 non_linear_state_machine instance already drives Inspection.hazard_state NONE -> HAZARD_DECLARED while status stays IN_PROGRESS and then advances status to PENDING_REVIEW and FINALIZED with hazard_state pinned, which is exactly the parallel-dimension independence claim for this scaffold's only two-dimension entity."

      - name: state_machine_cyclic_loop_is_bounded_by_a_termination_condition
        claim_type: cyclic
        excluded_because:
          difficulty_instance: citation_amendment_cycle_loops_back_to_contested_until_rounds_exhausted
          rationale: "The §1.8 non_linear_state_machine instance already walks the AMENDED -> CONTESTED -> HEARING_SCHEDULED -> AMENDED cycle twice and proves the loop terminates at MAX_HEARING_ROUNDS with ERR_HEARING_ROUNDS_EXHAUSTED, covering the loop-count termination claim."

      - name: state_machine_cascade_down_and_ledger_sync_from_one_transition
        claim_type: side_effect_execution
        excluded_because:
          difficulty_instance: finalize_score_to_ledger_to_balance_to_license_status_to_posture
          rationale: "The §1.8 transitive_cascade instance already verifies the five-hop finalize cascade end to end — score to LedgerEntry to Establishment.demerit_balance to license_status to compliance_posture and on to the PROPOSED booth rentals — which is both the cascade-down and the ledger-sync side-effect pattern for this scaffold."

      - name: state_machine_compensating_transition_reverses_its_original_side_effects
        claim_type: side_effect_execution
        excluded_because:
          difficulty_instance: reinstatement_conserves_sanction_points_without_restoring_terminated_rental
          rationale: "The §1.8 compensating_invariant instance already covers the compensation pattern: REINSTATE posts the reversal that returns sanction_points to exactly 0.00 while deliberately NOT resurrecting the TERMINATED booth rental, so it pins both what the undo restores and what it does not."

