scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cost_seg_with_bonus_vs_without_bonus
        grounds:
          - calculations.cost_seg_first_year_depreciation
          - entities.Study.fields.first_year_depreciation_cents
          - entities.Study.fields.first_year_depreciation_no_bonus_cents
        distinguishing_aspect: |
          Same ALLOCATED components (year 2024, bonus 60%) yield first_year_depreciation_cents=20994800
          (WITH_BONUS) versus first_year_depreciation_no_bonus_cents=4794800 (WITHOUT_BONUS); this variant
          pair lives in the cost-seg depreciation domain (Property/AssetComponent).
        test_recipe:
          setup:
            - "ACTIVE client (marginal_tax_rate 0.21); COMMERCIAL property basis 100000000, placed in service 2024"
            - "COST_SEGREGATION study 2024 scoped to that property, engineer assigned (ENGINEERING)"
            - "Three ALLOCATED components: FIVE_YEAR 10000000, FIFTEEN_YEAR 20000000, THIRTY_NINE_YEAR 70000000"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Acme C-Corp", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "Prep Eng", email: "prep@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "1 Main", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-03-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "PERCENT", fee_percent_bps: 2500, property_id: "${prop}" }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "5yr", asset_class: "FIVE_YEAR", allocated_cost_cents: 10000000 }, as: Engineer, as_user_id: "${eng}", captures: { c5: "$.data.id" } }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "15yr", asset_class: "FIFTEEN_YEAR", allocated_cost_cents: 20000000 }, as: Engineer, as_user_id: "${eng}", captures: { c15: "$.data.id" } }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "39yr", asset_class: "THIRTY_NINE_YEAR", allocated_cost_cents: 70000000 }, as: Engineer, as_user_id: "${eng}", captures: { c39: "$.data.id" } }
            - { call: "POST /asset-components/${c5}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /asset-components/${c15}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /asset-components/${c39}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
          trigger:
            - { call: "POST /studies/${st}/submit-review", payload: {}, as: Engineer, as_user_id: "${eng}", captures: { fyb: "$.data.first_year_depreciation_cents", fynb: "$.data.first_year_depreciation_no_bonus_cents" } }
          assert:
            - "Study.${st}.first_year_depreciation_cents == 20994800"
            - "Study.${st}.first_year_depreciation_no_bonus_cents == 4794800"
            - "Study.${st}.estimated_tax_benefit_cents == 4408908"

      - name: rd_credit_asc_vs_regular
        grounds:
          - calculations.rd_credit
          - entities.Study.fields.rd_credit_asc_cents
          - entities.Study.fields.rd_credit_regular_cents
        distinguishing_aspect: |
          Same QUALIFIED QREs (current_qre=7950000) yield rd_credit_asc_cents=833000 versus
          rd_credit_regular_cents=795000; this variant pair lives in the R&D credit domain
          (QreLineItem), a different entity domain from the cost-seg depreciation variant.
        test_recipe:
          setup:
            - "ACTIVE client; RD_CREDIT study 2024, credit_method ASC, priors 6000000/4000000/2000000, regular params fixed_base_pct 0.03 avg receipts 100000000, engineer assigned (ENGINEERING)"
            - "Three QUALIFIED QRE lines: WAGES 5000000@0.80, SUPPLIES 2000000@1.00, CONTRACT_RESEARCH 3000000@0.80"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "RD Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "Prep Eng", email: "prep@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "RD_CREDIT", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 500000, credit_method: "ASC", fixed_base_pct: 0.03, avg_annual_gross_receipts_cents: 100000000, prior_qre_year1_cents: 6000000, prior_qre_year2_cents: 4000000, prior_qre_year3_cents: 2000000 }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
            - { call: "POST /studies/${st}/qre-line-items", payload: { qre_category: "WAGES", gross_amount_cents: 5000000, qualified_percent: 0.80 }, as: Engineer, as_user_id: "${eng}", captures: { q1: "$.data.id" } }
            - { call: "POST /studies/${st}/qre-line-items", payload: { qre_category: "SUPPLIES", gross_amount_cents: 2000000, qualified_percent: 1.00 }, as: Engineer, as_user_id: "${eng}", captures: { q2: "$.data.id" } }
            - { call: "POST /studies/${st}/qre-line-items", payload: { qre_category: "CONTRACT_RESEARCH", gross_amount_cents: 3000000, qualified_percent: 0.80 }, as: Engineer, as_user_id: "${eng}", captures: { q3: "$.data.id" } }
            - { call: "POST /qre-line-items/${q1}/qualify", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /qre-line-items/${q2}/qualify", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /qre-line-items/${q3}/qualify", payload: {}, as: Engineer, as_user_id: "${eng}" }
          trigger:
            - { call: "POST /studies/${st}/submit-review", payload: {}, as: Engineer, as_user_id: "${eng}", captures: { asc: "$.data.rd_credit_asc_cents", reg: "$.data.rd_credit_regular_cents" } }
          assert:
            - "Study.${st}.rd_credit_asc_cents == 833000"
            - "Study.${st}.rd_credit_regular_cents == 795000"
            - "Study.${st}.estimated_tax_benefit_cents == 833000"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rd_asc_three_input_conditional_branch
        claim_note: "mode (a): >=3 inputs with non-linear conditional branch"
        grounds:
          - calculations.rd_credit
          - entities.Study.fields.prior_qre_year1_cents
          - entities.Study.fields.rd_credit_asc_cents
        distinguishing_aspect: |
          ASC combines current_qre plus three prior-year inputs through avg_prior and a conditional
          branch (avg_prior>0 uses ASC_RATE 0.14 over (current - 0.5*avg_prior); avg_prior==0 uses
          ASC_STARTUP_RATE 0.06): mode (a), non-linear multi-input. current_qre=7950000, avg_prior=4000000
          → 0.14*(7950000-2000000)=833000.
        test_recipe:
          setup:
            - "ACTIVE client; RD_CREDIT study 2024 credit_method ASC priors 6000000/4000000/2000000; engineer assigned"
            - "One QUALIFIED QRE per category totalling current_qre 7950000"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "RD Co2", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "Prep Eng", email: "prep2@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "RD_CREDIT", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 500000, credit_method: "ASC", fixed_base_pct: 0.03, avg_annual_gross_receipts_cents: 100000000, prior_qre_year1_cents: 6000000, prior_qre_year2_cents: 4000000, prior_qre_year3_cents: 2000000 }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
            - { call: "POST /studies/${st}/qre-line-items", payload: { qre_category: "WAGES", gross_amount_cents: 5000000, qualified_percent: 0.80 }, as: Engineer, as_user_id: "${eng}", captures: { q1: "$.data.id" } }
            - { call: "POST /studies/${st}/qre-line-items", payload: { qre_category: "SUPPLIES", gross_amount_cents: 2000000, qualified_percent: 1.00 }, as: Engineer, as_user_id: "${eng}", captures: { q2: "$.data.id" } }
            - { call: "POST /studies/${st}/qre-line-items", payload: { qre_category: "CONTRACT_RESEARCH", gross_amount_cents: 3000000, qualified_percent: 0.80 }, as: Engineer, as_user_id: "${eng}", captures: { q3: "$.data.id" } }
            - { call: "POST /qre-line-items/${q1}/qualify", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /qre-line-items/${q2}/qualify", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /qre-line-items/${q3}/qualify", payload: {}, as: Engineer, as_user_id: "${eng}" }
          trigger:
            - { call: "POST /studies/${st}/submit-review", payload: {}, as: Engineer, as_user_id: "${eng}", captures: { asc: "$.data.rd_credit_asc_cents" } }
          assert:
            - "Study.${st}.rd_credit_asc_cents == 833000"

      - name: cost_seg_per_component_rounding_then_sum
        claim_note: "mode (b): nested rounding where per-component-then-sum differs from sum-then-round"
        grounds:
          - calculations.cost_seg_first_year_depreciation
          - entities.Study.fields.first_year_depreciation_no_bonus_cents
        distinguishing_aspect: |
          Two FIFTEEN_YEAR components each cost 10 cents at rate 0.05: per-component round_half_up gives
          round(0.5)+round(0.5)=1+1=2, whereas summing raw then rounding gives round(20*0.05)=round(1.0)=1.
          The pinned per-component order yields first_year_depreciation_no_bonus_cents=2, not 1: mode (b),
          distinct from the mode (a) ASC instance.
        test_recipe:
          setup:
            - "ACTIVE client; COMMERCIAL property basis 100000000 placed in service 2024; COST_SEGREGATION study 2024 scoped, engineer assigned"
            - "Two ALLOCATED FIFTEEN_YEAR components each allocated_cost_cents 10"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Round Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "Prep Eng", email: "prep3@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "2 Main", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-06-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 100000, property_id: "${prop}" }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "a", asset_class: "FIFTEEN_YEAR", allocated_cost_cents: 10 }, as: Engineer, as_user_id: "${eng}", captures: { ca: "$.data.id" } }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "b", asset_class: "FIFTEEN_YEAR", allocated_cost_cents: 10 }, as: Engineer, as_user_id: "${eng}", captures: { cb: "$.data.id" } }
            - { call: "POST /asset-components/${ca}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /asset-components/${cb}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
          trigger:
            - { call: "POST /studies/${st}/submit-review", payload: {}, as: Engineer, as_user_id: "${eng}", captures: { fynb: "$.data.first_year_depreciation_no_bonus_cents" } }
          assert:
            - "Study.${st}.first_year_depreciation_no_bonus_cents == 2"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: study_review_engineering_cycle
        grounds:
          - state_machines.Study.IN_REVIEW_to_ENGINEERING
          - state_machines.Study.ENGINEERING_to_IN_REVIEW
        distinguishing_aspect: |
          A COST_SEGREGATION study loops IN_REVIEW -> ENGINEERING (reject) -> IN_REVIEW (re-submit),
          a genuine cycle on the Study entity (not a linear pipeline).
        test_recipe:
          setup:
            - "ACTIVE client; property; COST_SEGREGATION study scoped, engineer assigned; one ALLOCATED FIVE_YEAR component 10000000; submitted to IN_REVIEW"
            - "A second engineer exists to act as independent Reviewer"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Cyc Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "Prep Eng", email: "prep4@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /engineers", payload: { full_name: "Rev Eng", email: "rev4@x.com" }, as: StudyManager, captures: { rev: "$.data.id" } }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "3 Main", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-03-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 100000, property_id: "${prop}" }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "5yr", asset_class: "FIVE_YEAR", allocated_cost_cents: 10000000 }, as: Engineer, as_user_id: "${eng}", captures: { c5: "$.data.id" } }
            - { call: "POST /asset-components/${c5}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /studies/${st}/submit-review", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /studies/${st}/reject", payload: { review_note: "revise" }, as: Reviewer, as_user_id: "${rev}" }
          trigger:
            - { call: "POST /studies/${st}/submit-review", payload: {}, as: Engineer, as_user_id: "${eng}", captures: { status: "$.data.status" } }
          assert:
            - "Study.${st}.status == IN_REVIEW"

      - name: report_revision_request_draft_loop
        grounds:
          - state_machines.Report.DRAFT_to_REVISION_REQUESTED
          - state_machines.Report.REVISION_REQUESTED_to_DRAFT
          - entities.Report.fields.revision_count
        distinguishing_aspect: |
          The Report cycles DRAFT -> REVISION_REQUESTED (on study reject) -> DRAFT (on re-submit) with
          revision_count incremented to 1: a cycle on the Report entity, a different entity from Study.
        test_recipe:
          setup:
            - "Same as study_review_engineering_cycle up to the second submit-review; the study's Report has looped once"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Cyc Co2", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "Prep Eng", email: "prep5@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /engineers", payload: { full_name: "Rev Eng", email: "rev5@x.com" }, as: StudyManager, captures: { rev: "$.data.id" } }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "4 Main", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-03-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "FIXED", fee_fixed_amount_cents: 100000, property_id: "${prop}" }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "5yr", asset_class: "FIVE_YEAR", allocated_cost_cents: 10000000 }, as: Engineer, as_user_id: "${eng}", captures: { c5: "$.data.id" } }
            - { call: "POST /asset-components/${c5}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /studies/${st}/submit-review", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /studies/${st}/reject", payload: {}, as: Reviewer, as_user_id: "${rev}" }
            - { call: "POST /studies/${st}/submit-review", payload: {}, as: Engineer, as_user_id: "${eng}" }
          trigger:
            - { call: "GET /studies/${st}/reports", payload: {}, as: StudyManager }
          assert:
            - "Report for study ${st} has status == DRAFT"
            - "Report for study ${st} has revision_count == 1"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: finalize_report_fee_client_chain
        grounds:
          - state_machines.Study.IN_REVIEW_to_FINALIZED
          - state_machines.Report.DRAFT_to_ISSUED
          - state_machines.FeeInvoice.initial_state
          - entities.Client.fields.outstanding_fee_cents
        distinguishing_aspect: |
          Depth-3 chain from finalize: Study->FINALIZED mutates Report (DRAFT->ISSUED); that Report ISSUED
          itself creates a FeeInvoice (ISSUED, amount 1102227); that FeeInvoice ISSUED itself adds 1102227
          to client.outstanding_fee_cents. Each link is caused by the previous, not by finalize directly.
        test_recipe:
          setup:
            - "The cost_seg_with_bonus_vs_without_bonus study submitted to IN_REVIEW (estimated_tax_benefit 4408908, fee PERCENT 2500 bps); second engineer as Reviewer"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Casc Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
            - { call: "POST /clients/${cli}/activate", payload: {}, as: StudyManager }
            - { call: "POST /engineers", payload: { full_name: "Prep Eng", email: "prep6@x.com" }, as: StudyManager, captures: { eng: "$.data.id" } }
            - { call: "POST /engineers", payload: { full_name: "Rev Eng", email: "rev6@x.com" }, as: StudyManager, captures: { rev: "$.data.id" } }
            - { call: "POST /properties", payload: { client_id: "${cli}", address: "5 Main", building_type: "COMMERCIAL", purchase_price_cents: 120000000, land_value_cents: 20000000, placed_in_service_date: "2024-03-01T00:00:00.000Z" }, as: StudyManager, captures: { prop: "$.data.id" } }
            - { call: "POST /studies", payload: { client_id: "${cli}", study_type: "COST_SEGREGATION", tax_year: 2024 }, as: StudyManager, captures: { st: "$.data.id" } }
            - { call: "POST /studies/${st}/scope", payload: { fee_type: "PERCENT", fee_percent_bps: 2500, property_id: "${prop}" }, as: StudyManager }
            - { call: "POST /studies/${st}/assign-engineer", payload: { assigned_engineer_id: "${eng}" }, as: StudyManager }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "5yr", asset_class: "FIVE_YEAR", allocated_cost_cents: 10000000 }, as: Engineer, as_user_id: "${eng}", captures: { c5: "$.data.id" } }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "15yr", asset_class: "FIFTEEN_YEAR", allocated_cost_cents: 20000000 }, as: Engineer, as_user_id: "${eng}", captures: { c15: "$.data.id" } }
            - { call: "POST /studies/${st}/asset-components", payload: { component_name: "39yr", asset_class: "THIRTY_NINE_YEAR", allocated_cost_cents: 70000000 }, as: Engineer, as_user_id: "${eng}", captures: { c39: "$.data.id" } }
            - { call: "POST /asset-components/${c5}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /asset-components/${c15}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /asset-components/${c39}/allocate", payload: {}, as: Engineer, as_user_id: "${eng}" }
            - { call: "POST /studies/${st}/submit-review", payload: {}, as: Engineer, as_user_id: "${eng}" }
          trigger:
            - { call: "POST /studies/${st}/finalize", payload: {}, as: Reviewer, as_user_id: "${rev}", captures: { status: "$.data.status" } }
          assert:
            - "Study.${st}.status == FINALIZED"
            - "Report for study ${st} has status == ISSUED"
            - "A FeeInvoice for study ${st} exists with status == ISSUED and amount_cents == 1102227"
            - "Client.${cli}.outstanding_fee_cents == 1102227"

      - name: amend_file_study_report_supersede_chain
        grounds:
          - state_machines.AmendedReturn.DRAFT_to_FILED
          - entities.Study.fields.section_481a_cents
          - state_machines.Report.ISSUED_to_SUPERSEDED
          - calculations.section_481a_adjustment
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (amended-return file): AmendedReturn->FILED mutates the
          Study (section_481a_cents=18430800); that Study mutation itself drives the Report ISSUED->SUPERSEDED.
        test_recipe:
          setup:
            - "A DELIVERED look-back COST_SEGREGATION study (same 3 components, first_year_depreciation 20994800, basis 100000000) with an ISSUED Report and a DRAFT amended return"
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Amend Co", entity_type: "C_CORP", marginal_tax_rate: 0.21 }, as: StudyManager, captures: { cli: "$.data.id" } }
