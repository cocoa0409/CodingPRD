              as_user_id: "acct-1"
          trigger:
            - call: "POST /portfolio/leases/${lease_a}/default-notices"
              payload: { default_type: "UNPERMITTED_USE" }
              as: AssetManager
              as_user_id: "am-1"
              captures: { notice_a: $.data.id }
            - call: "POST /portfolio/leases/${lease_b}/default-notices"
              payload: { default_type: "PERCENTAGE_RENT_UNDERPAYMENT", claimed_amount_cents: 2000000 }
              as: LeaseAccountant
              as_user_id: "acct-1"
              captures: { notice_b: $.data.id }
          assert:
            - "trigger[0]: DefaultNotice.${notice_a}.lessee_cure_deadline == 2026-08-31T00:00:00Z (30 non-monetary days) and mortgagee_cure_deadline == null"
            - "trigger[1]: DefaultNotice.${notice_b}.lessee_cure_deadline == 2026-08-11T00:00:00Z (10 monetary days) and mortgagee_cure_deadline == 2026-09-25T00:00:00Z (lessee deadline + 45)"
            - "both notices carry served_at 2026-08-01T00:00:00Z and status SERVED; both leases are IN_DEFAULT"

      - name: award_waterfall_fills_buckets_in_order_and_the_residual_absorbs_the_rest
        claim_type: waterfall_allocation
        grounds:
          - calculations.loss_proceeds_allocation
          - endpoints.POST_/portfolio/loss-events/{id}/allocate
        distinguishing_aspect: |
          A pool large enough to overflow the first two buckets pins the whole order: arrears 1000000 is
          taken first, both mortgages are paid in priority_rank order (2000000 then 500000) and are
          EXTINGUISHED at zero, the lessee share is computed on the FULL 10000000 pool rather than on
          what is left (6000000, not 6000000 of the 6500000 remainder), and bucket 4 takes the residual
          500000 so the four buckets sum to the pool exactly.
        test_recipe:
          setup:
            - "One lease with arrears 1000000, mortgages of 2000000 (rank 1) and 500000 (rank 2), and an ADJUSTED CONDEMNATION pool of 10000000 on BONUS_VALUE."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-101", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/leasehold-mortgages"
              payload: { mortgagee_legal_name: "Keystone Senior Debt Fund", notice_email: "servicing@keystone.example", original_principal_cents: 2000000, priority_rank: 1, cure_extension_days: 30 }
              as: LessorAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/leasehold-mortgages"
              payload: { mortgagee_legal_name: "Tidewater Mezzanine Partners", notice_email: "agent@tidewater.example", original_principal_cents: 500000, priority_rank: 2, cure_extension_days: 15 }
              as: LessorAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/rent-charges"
              payload: { amount_cents: 1000000, memo: "arrears" }
              as: LeaseAccountant
              as_user_id: "acct-1"
            - call: "POST /portfolio/leases/${lease_id}/loss-events"
              payload: { event_type: "CONDEMNATION", scope_code: "PARTIAL", occurred_at: "2026-07-01T00:00:00Z", damage_estimate_cents: 10000000, damaged_area_sqft: 30000 }
              as: AssetManager
              as_user_id: "am-1"
              captures: { loss_id: $.data.id }
            - call: "POST /portfolio/loss-events/${loss_id}/adjust"
              payload: { distributable_pool_cents: 10000000, allocation_method: "BONUS_VALUE" }
              as: AssetManager
              as_user_id: "am-1"
          trigger:
            - call: "POST /portfolio/loss-events/${loss_id}/allocate"
              payload: {}
              as: LeaseAccountant
              as_user_id: "acct-1"
          assert:
            - "returns 200 with allocated_arrears_cents 1000000, allocated_mortgagee_cents 2500000, lessee_share_bps 6000, allocated_lessee_cents 6000000 and allocated_lessor_cents 500000, summing to exactly 10000000"
            - "allocation_detail is ordered [{${m1_id}, 2000000}, {${m2_id}, 500000}] - priority_rank ASC"
            - "LeaseholdMortgage.${m1_id}.status == EXTINGUISHED with outstanding_principal_cents 0, and likewise ${m2_id}"
            - "Lease.${lease_id}.arrears_balance_cents == 0 and status == ALLOCATED"

      - name: percentage_rent_breakpoint_crossing_corner
        claim_type: threshold
        excluded_because:
          difficulty_instance: percentage_rent_at_breakpoint_with_empty_sublease_set_and_rounding_floor
          rationale: |
            The threshold-algorithm claims for percentage_rent_due - at breakpoint-1, at the breakpoint and
            above it, with the split calculation on the excess only - are the named §1.8
            boundary_precision_check instance, which also pins the empty-sublease-set and the
            offset-credit floor at 0.

      - name: assignment_fee_tier_boundaries_corner
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: assignment_tier_boundary_at_below_above_and_the_minimum_fee_floor
          rationale: |
            Every tiered_pricing claim on transfer_fee - each tier boundary, flat-by-tier rather than
            marginal, and the MIN_ASSIGNMENT_FEE_CENTS floor - is the named §1.8 instance, and the
            surcharge tier selected on the pre-surcharge base total is
            transfer_fee_surcharge_tier_pinned_on_pre_surcharge_base_total.

      - name: reversion_weight_table_scoring_corner
        claim_type: weighted_scoring
        excluded_because:
          difficulty_instance: reversion_holdback_weight_table_then_deficiency_then_deposit_cap
          rationale: |
            The weighted_scoring claims - weights summing to 10000 per standard, per-component
            round_half_up before summing so no drift accumulates, and a different standard re-scoring the
            same three raw scores - are the named §1.8 combinatorial_formula instance.

      - name: sublease_inclusion_per_line_rounding_corner
        claim_type: precision
        excluded_because:
          difficulty_instance: sublease_inclusion_base_per_line_rounding_beats_sum_first
          rationale: |
            The precision claim on sublease_inclusion_base - round_half_up per row BEFORE summing, which
            differs by a cent from summing first - is the named §1.8 instance; this section's
            input-set-filtering instance covers the membership rule instead.

      - name: construction_window_interval_merge_corner
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: construction_windows_touch_is_allowed_overlap_by_one_second_is_not_and_the_recheck_bites_at_decision
          rationale: |
            The interval_merge claims - adjacent windows with a zero gap allowed, overlapping windows
            refused, disjoint windows preserved - are the named §1.8 resource_temporal_overlap instance,
            which also re-checks at decision time.

      - name: award_allocation_variant_divergence_corner
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: condemnation_proceeds_bonus_value_vs_pro_rata_share
          rationale: |
            The variant-divergence claim for loss_proceeds_allocation - the same pool and ledger yielding
            different bucket-3 figures under BONUS_VALUE and PRO_RATA_VALUE, with the delta asserted - is
            the named §1.8 dual_variant_calc instance.

      - name: revaluation_resolution_variant_selection_corner
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: revaluation_reset_midpoint_settlement_vs_arbitration_award
          rationale: |
            The variant-selection claim for revaluation_reset_rent - midpoint settlement in the settle
            context versus the arbitrator's award in the award context, each stamping its own
            resolution_method - is the named §1.8 instance.

      - name: percentage_rent_variant_reconciliation_corner
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: percentage_rent_provisional_then_audited_final_reconciliation
          rationale: |
            The reconciliation claim - switching from the provisional to the audited_final variant and
            posting only the delta plus the under-report penalty to the ledger - is the named §1.8
            instance, which also covers the downward-audit direction.

  - section: validations
    instances:
      - name: lease_terms_coherence_violations_rejected
        claim_type: violation_error
        grounds:
          - validations.priority_16_terms_coherence
          - errors.ERR_TERMS_INCOHERENT
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Four separate coherence clauses live behind one error code and each must fire on its own:
          collar min not strictly below max, a percentage rate outside 100-2000 in both directions, an
          expiration that is not strictly after commencement, and a GFA below 1. The boundary between
          P3 and P16 also matters: total_permitted_gfa_sqft of 0 is incoherent (422) while -1 is a
          malformed body (400), so the two must not be conflated.
        test_recipe:
          setup:
            - "One registered lessee; every trigger is a fresh lease creation with one clause broken."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
          trigger:
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-102A", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 5000, reval_collar_max_uplift_bps: 1000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-102B", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 50, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-102C", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 2500, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-102D", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2020-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-102E", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 0, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-102F", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: -1, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
          assert:
            - "trigger[0] returns ERR_TERMS_INCOHERENT (422) - min uplift must be strictly below max"
            - "trigger[1] and trigger[2] both return ERR_TERMS_INCOHERENT (422) - the 100-2000 bps band is closed on both sides"
            - "trigger[3] returns ERR_TERMS_INCOHERENT (422) - expiration must be strictly after commencement, equality is not enough"
            - "trigger[4] returns ERR_TERMS_INCOHERENT (422) for GFA 0 while trigger[5] returns ERR_INVALID_REQUEST (400) for GFA -1"
            - "GET /portfolio/leases returns total_count 0 - not one of the six rows was persisted"

      - name: boundary_lease_terms_at_the_legal_extremes_accepted
        claim_type: satisfaction_pass
        grounds:
          - validations.priority_16_terms_coherence
          - endpoints.POST_/portfolio/leases
        distinguishing_aspect: |
          The same clauses must accept their inclusive extremes: a percentage rate of exactly 100 and of
          exactly 2000, a collar of 1 versus 2 bps (strictly increasing by the smallest possible step)
          and a total_permitted_gfa_sqft of exactly 1 are all legal. An implementation that guards with
          > / < instead of >= / <= rejects these.
        test_recipe:
          setup:
            - "One registered lessee."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
          trigger:
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-103A", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1, reval_collar_max_uplift_bps: 2, percentage_rent_rate_bps: 100, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 1, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
