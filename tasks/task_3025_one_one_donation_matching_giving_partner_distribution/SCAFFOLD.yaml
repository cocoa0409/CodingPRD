  - method: GET
    path: "/impact-program/sales-orders/{order_id}/lines"
    description: "Find the lines of a sales order"
    roles: [CustomerService, ImpactAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SalesOrderLine[]"
    side_effects: []

  - method: POST
    path: "/impact-program/sales-orders/{order_id}/pay"
    description: "Settle payment for an order, starting the return window"
    roles: [CustomerService]
    code: 200
    input: []
    output: SalesOrder
    side_effects:
      - "status → PAID and paid_at stamped"
      - "DonationLiability.final_liability_units recomputed"

  - method: POST
    path: "/impact-program/sales-orders/{order_id}/lines/{line_id}/settle"
    description: "Settle the donation obligation of one line as its units leave the warehouse"
    roles: [FulfillmentOperator]
    code: 200
    input: [shipped_units]
    output: SalesOrderLine
    side_effects:
      - "DonationLiability.final_liability_units recomputed for the line's season"
      - "ImpactSeason.total_shipped_units recomputed"

  - method: GET
    path: "/impact-program/sales-orders/{order_id}/lines/{line_id}"
    description: "Get one sales order line"
    roles: [CustomerService, ImpactAuditor]
    code: 200
    input: []
    output: SalesOrderLine
    side_effects: []

  - method: POST
    path: "/impact-program/sales-orders/{order_id}/cancel"
    description: "Cancel an unpaid order before its obligations vest"
    roles: [CustomerService]
    code: 200
    input: ["reason?"]
    output: SalesOrder
    side_effects:
      - "status → CANCELLED and fulfillment_status → CANCELLED"
      - "DonationLiability.provisional_liability_units recomputed without this order's lines"

  - method: PATCH
    path: "/impact-program/sales-orders/{order_id}/fulfillment"
