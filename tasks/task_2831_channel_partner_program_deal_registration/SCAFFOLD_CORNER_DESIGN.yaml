          - roles.Partner
        distinguishing_aspect: "Partner scope is checked at priority 4, after the role check and the existence check: a second partner with a perfectly valid Partner role submitting a foreign registration gets ERR_PARTNER_SCOPE_VIOLATION 403, not ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00.000Z; two RESELLER partners, each with one TECH_ASSOCIATE certification; one account."
            - "Partner A owns one DRAFT ANALYTICS_ADDON registration."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
