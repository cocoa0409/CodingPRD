  - section: calculations
    instances:
      - name: staffing_ceiling_exact_multiple_then_overflow
        claim_type: constants_applied
        grounds: [calculations.staffing_requirement, "errors[ERR_INSUFFICIENT_STAFFING]"]
        distinguishing_aspect: "Ceiling division against STAFF_COVERAGE_SLOTS_PER_STAFF=25: totals 25 and 50 divide exactly (1 and 2 staff, allowed with staff_on_duty 2); total 51 requires 3 and is rejected."
        test_recipe:
          setup: ["ACTIVE season; field created; SalesDay 2026-08-04 staff_on_duty 2 (PLANNED is sufficient for window creation); window A 09:00-12:00 cap 25"]
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
