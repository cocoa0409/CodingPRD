          trigger:
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${pkg}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { err1: $.data.error_id } }
            - { call: "POST /api/sales-orders", payload: { customer_name: "Acme Builders", contract_id: "${cid}", species: CEDAR, grade: NO_2, length_spec: 12, volume_mbf: 5 }, as: SalesRep, captures: { err2: $.data.error_id } }
