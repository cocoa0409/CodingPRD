scenario: |
  generate task hard than expert level! 1189. Microschool & Learning Pod Management (Prenda style microschool): family cohort formation & tuition per seat, guide/teacher staffing & ratio compliance, multi-age curriculum plan & progress conferencing, facility/zoning & licensing exemption determination, health/safety policy & emergency plan, mid-year enrollment & prorated tuition, state funding or ESA voucher acceptance, pod dissolution & refund

domain_name: microschool-pod-management
api_prefix: ""

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: Pod
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Human-readable pod name (e.g., "Maple Street Microschool")
      - name: pod_code
        type: string
        source: input
        description: Unique pod identifier code; case-insensitive, unique across all pods
        constraints: "unique; 4-24 chars alphanumeric"
      - name: academic_year
        type: string
        source: input
        description: Academic year label (e.g., "2026-2027"); immutable after first enrollment
      - name: term_start_date
        type: datetime
        source: input
        description: First instructional day of the academic year (ISO 8601 date)
      - name: term_end_date
        type: datetime
        source: input
        description: Last instructional day of the academic year
      - name: seat_capacity
        type: integer
        source: input
        description: Maximum number of concurrent ENROLLED seats; 5..30 per zoning rules
        constraints: "integer >= 5 and <= 30"
      - name: enrolled_count
        type: integer
        source: computed
        description: Derived count of seats currently in ENROLLED state
      - name: tuition_full_year_cents
        type: integer
        source: input
        description: Published full-year tuition per seat in cents; must be > 0
        constraints: "integer > 0"
      - name: min_guides_required
        type: integer
        source: input
        description: Minimum guide FTE count required for compliance; derived from seat_capacity at creation
        constraints: "integer >= 1"
      - name: facility_site_id
        type: string
        source: input
        description: FK -> FacilitySite.id; the physical site where the pod operates
      - name: status
        type: enum
        source: system
        description: Lifecycle state
        constraints: "one of DRAFT, FORMING, LICENSING_REVIEW, ACTIVE, SUSPENDED, DISSOLVING, DISSOLVED"
        default: DRAFT
      - name: posture
        type: enum
        source: computed
        description: Derived operational posture gating child operations
        constraints: "one of OPEN, RESTRICTED, FROZEN, CLOSED"
      - name: compliance_flag
        type: enum
        source: computed
        description: Latest ratio/licensing compliance evaluation
        constraints: "one of COMPLIANT, AT_RISK, VIOLATION"
      - name: dissolution_reason
        type: string
        source: input
        description: Required when status transitions into DISSOLVING; free-text rationale
      - name: dissolved_at
        type: datetime
        source: system
        description: UTC timestamp when terminal DISSOLVED state was reached; null until then

  - name: FacilitySite
    parent: null
    common_fields: true
    fields:
      - name: site_name
        type: string
        source: input
        description: Site identifier
      - name: address_line1
        type: string
        source: input
        description: Street address
      - name: jurisdiction_code
        type: string
        source: input
        description: State/county code determining zoning regime (e.g., "AZ-MARICOPA", "TX-HARRIS")
      - name: zoning_class
        type: enum
        source: input
        description: Municipal zoning classification of the parcel
        constraints: "one of RESIDENTIAL_SINGLE, RESIDENTIAL_MULTI, COMMERCIAL, MIXED_USE, RELIGIOUS, AGRICULTURAL"
      - name: max_occupancy
        type: integer
        source: input
        description: Fire-marshal occupancy limit
        constraints: "integer > 0"
      - name: indoor_sqft
        type: integer
        source: input
        description: Net instructional indoor square footage
        constraints: "integer > 0"
      - name: site_status
        type: enum
        source: system
        description: Site lifecycle; ARCHIVED sites cannot host new pods but remain queryable
        constraints: "one of AVAILABLE, LEASED, ARCHIVED"
        default: AVAILABLE

  - name: Family
    parent: null
    common_fields: true
    fields:
      - name: family_name
        type: string
        source: input
        description: Household last name
      - name: primary_contact_email
        type: string
        source: input
        description: Contact email; unique across families
        constraints: "unique; RFC 5322"
      - name: billing_address_state
        type: string
        source: input
        description: Two-letter US state code for the billing address; determines ESA eligibility
      - name: family_status
        type: enum
        source: system
        description: Lifecycle of the family account
        constraints: "one of PROSPECT, ACTIVE, INACTIVE"
        default: PROSPECT

  - name: Student
    parent: Family
    common_fields: true
    fields:
      - name: family_id
        type: string
        source: input
        description: FK -> Family.id; owning household
      - name: legal_first_name
        type: string
        source: input
        description: Legal first name
      - name: legal_last_name
        type: string
        source: input
        description: Legal last name
      - name: date_of_birth
        type: datetime
        source: input
        description: Date of birth (ISO 8601 date); determines grade-band placement
      - name: grade_band
        type: enum
        source: computed
        description: Derived from date_of_birth and pod's academic year; recomputed on enrollment
        constraints: "one of LOWER_EL, UPPER_EL, MIDDLE, HIGH"
      - name: esa_account_id
        type: string
        source: input
        description: FK -> VoucherAccount.id; optional ESA voucher account linked to this student
        constraints: "nullable"
      - name: student_status
        type: enum
        source: system
        description: Lifecycle
        constraints: "one of APPLICANT, ENROLLED, WITHDRAWN, GRADUATED"
        default: APPLICANT

  - name: Seat
    parent: Pod
    common_fields: true
    fields:
      - name: pod_id
        type: string
        source: input
        description: FK -> Pod.id
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id; the student holding this seat
      - name: reserved_at
        type: datetime
        source: system
        description: UTC timestamp when seat was first reserved
      - name: enrolled_on
        type: datetime
        source: input
        description: First instructional date for this seat (drives proration); must be within pod term
      - name: withdrawn_on
        type: datetime
        source: system
        description: Date of withdrawal; set by withdrawal transition, null while active
      - name: seat_status
        type: enum
        source: system
        description: Seat lifecycle
        constraints: "one of RESERVED, ENROLLED, WITHDRAWN, RELEASED"
        default: RESERVED
      - name: tuition_basis_cents
        type: integer
        source: computed
        description: Full-year tuition snapshot from Pod at enrollment time; pinned
      - name: prorated_due_cents
        type: integer
        source: computed
        description: Prorated tuition owed given enrolled_on (mid-year) or withdrawal date
      - name: paid_cents
        type: integer
        source: computed
        description: Sum of Payment.amount_cents linked to this seat with status CLEARED
        default: 0
      - name: refund_due_cents
        type: integer
        source: computed
        description: Refund owed upon withdrawal or dissolution; 0 until computed

  - name: Guide
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Guide legal name
      - name: email
        type: string
        source: input
        description: Contact email; unique across guides
        constraints: "unique"
      - name: certification_tier
        type: enum
        source: input
        description: Certification level affecting ratio weight
        constraints: "one of APPRENTICE, CERTIFIED, LEAD"
      - name: fte_weight
        type: number
        source: computed
        description: Derived from certification_tier (APPRENTICE=0.5, CERTIFIED=1.0, LEAD=1.0)
      - name: guide_status
        type: enum
        source: system
        description: Lifecycle
        constraints: "one of CANDIDATE, ACTIVE, INACTIVE"
        default: CANDIDATE

  - name: GuideAssignment
    parent: Pod
    common_fields: true
    fields:
      - name: pod_id
        type: string
        source: input
        description: FK -> Pod.id
      - name: guide_id
        type: string
        source: input
        description: FK -> Guide.id
      - name: window_start_date
        type: datetime
        source: input
        description: First day of the assignment window (ISO date)
      - name: window_end_date
        type: datetime
        source: input
        description: Last day of the assignment window (inclusive, ISO date)
      - name: weekly_hours
        type: integer
        source: input
        description: Scheduled on-site hours per week
        constraints: "integer in [4..40]"
      - name: assignment_status
        type: enum
        source: system
        description: Lifecycle
        constraints: "one of SCHEDULED, ACTIVE, ENDED, TERMINATED_EARLY"
        default: SCHEDULED
      - name: is_primary
        type: boolean
        source: input
        description: Exactly one primary assignment may be ACTIVE per pod at any time
        default: false

  - name: CurriculumPlan
    parent: Pod
    common_fields: true
    fields:
      - name: pod_id
        type: string
        source: input
        description: FK -> Pod.id
      - name: plan_name
        type: string
        source: input
        description: Human-readable plan name
      - name: grade_bands_covered
        type: array
        source: input
        description: List of grade_band values this plan serves; subset of {LOWER_EL, UPPER_EL, MIDDLE, HIGH}
      - name: multi_age_grouping
        type: boolean
        source: input
        description: Whether the plan deliberately mixes grade bands in shared blocks
      - name: total_instructional_minutes_per_week
        type: integer
        source: input
        description: Planned instructional minutes per week across all bands
        constraints: "integer >= 1200"
      - name: plan_status
        type: enum
        source: system
        description: Lifecycle; only APPROVED plans can be linked to conferences
        constraints: "one of DRAFT, SUBMITTED, APPROVED, SUPERSEDED"
        default: DRAFT
      - name: approved_at
        type: datetime
        source: system
        description: UTC timestamp of approval; null until approved
      - name: approved_safety_policy_id
        type: string
        source: system
        description: FK -> SafetyPolicy.id pinned at approval time; version-locked reference

  - name: ProgressConference
    parent: Pod
    common_fields: true
    fields:
      - name: pod_id
        type: string
        source: input
        description: FK -> Pod.id
      - name: seat_id
        type: string
        source: input
        description: FK -> Seat.id; conference is held per enrolled seat
      - name: curriculum_plan_id
        type: string
        source: input
        description: FK -> CurriculumPlan.id; must reference an APPROVED plan
      - name: scheduled_start
        type: datetime
        source: input
        description: UTC start of the conference window
      - name: scheduled_end
        type: datetime
        source: input
        description: UTC end of the conference window; must be strictly after scheduled_start
      - name: conference_status
        type: enum
        source: system
        description: Lifecycle
        constraints: "one of REQUESTED, SCHEDULED, COMPLETED, NO_SHOW, RESCHEDULED, CANCELLED"
        default: REQUESTED
      - name: notes_summary
        type: string
        source: input
        description: Free-text conference notes; required to mark COMPLETED
        constraints: "nullable"
      - name: cycle_count
        type: integer
        source: system
        description: Number of times this conference has entered RESCHEDULED; capped at 3
        default: 0

  - name: LicensingDetermination
    parent: Pod
    common_fields: true
    fields:
      - name: pod_id
        type: string
        source: input
        description: FK -> Pod.id
      - name: jurisdiction_code
        type: string
        source: input
        description: Jurisdiction the determination applies to (mirrors FacilitySite.jurisdiction_code at submission)
      - name: submission_kind
        type: enum
        source: input
        description: Whether the pod seeks exemption or full licensure
        constraints: "one of EXEMPTION_CLAIM, FULL_LICENSE"
      - name: determination_status
        type: enum
        source: system
        description: Lifecycle
        constraints: "one of SUBMITTED, UNDER_REVIEW, EXEMPT_GRANTED, LICENSE_REQUIRED, LICENSE_GRANTED, DENIED, RESUBMITTED"
        default: SUBMITTED
      - name: decided_at
        type: datetime
        source: system
        description: UTC timestamp of decision; null while in SUBMITTED/UNDER_REVIEW
      - name: revision_number
        type: integer
        source: system
        description: Incremented on every resubmission (cyclic loop counter)
        default: 0
      - name: denial_reason
        type: string
        source: input
        description: Required when entering DENIED; free text
        constraints: "nullable"

  - name: SafetyPolicy
    parent: Pod
    common_fields: true
    fields:
      - name: pod_id
        type: string
        source: input
        description: FK -> Pod.id
      - name: policy_version
        type: integer
        source: input
        description: Monotonically increasing per pod; new version supersedes prior
        constraints: "integer >= 1"
      - name: emergency_plan_text
        type: string
        source: input
        description: Full emergency preparedness plan; >= 200 chars
      - name: immunization_policy
        type: enum
        source: input
        description: Policy on student immunization records
        constraints: "one of REQUIRED, EXEMPTION_ALLOWED, NOT_REQUIRED"
      - name: background_check_required
        type: boolean
        source: input
        description: Whether all guides must clear a background check
      - name: drill_cadence_days
        type: integer
        source: input
        description: Emergency drill cadence in days
        constraints: "integer in [7..90]"
      - name: policy_status
        type: enum
        source: system
        description: Lifecycle; only APPROVED policies may be pinned to a CurriculumPlan
        constraints: "one of DRAFT, APPROVED, SUPERSEDED"
        default: DRAFT
      - name: approved_at
        type: datetime
        source: system
        description: UTC timestamp when approved; null until then

  - name: VoucherAccount
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: FK -> Student.id
      - name: program_code
        type: string
        source: input
        description: State ESA/voucher program code (e.g., "AZ-ESA", "FL-FES")
      - name: awarded_annual_cents
        type: integer
        source: input
        description: Total award for the academic year in cents
        constraints: "integer > 0"
      - name: disbursable_balance_cents
        type: integer
        source: computed
        description: Remaining balance available for disbursement; updated by disbursement calc
      - name: verification_status
        type: enum
        source: system
        description: Parallel dimension 1 — verification lifecycle
        constraints: "one of PENDING_VERIFICATION, VERIFIED, REJECTED"
        default: PENDING_VERIFICATION
      - name: funding_status
        type: enum
        source: system
        description: Parallel dimension 2 — funding posture
        constraints: "one of FUNDED, PARTIALLY_DEPLETED, DEPLETED, FROZEN"
        default: FUNDED
      - name: accepted_by_pod
        type: boolean
        source: computed
        description: True only when verification_status==VERIFIED AND funding_status in {FUNDED, PARTIALLY_DEPLETED} AND Pod.status==ACTIVE
        default: false

  - name: TuitionInvoice
    parent: Seat
    common_fields: true
    fields:
      - name: seat_id
        type: string
        source: input
        description: FK -> Seat.id
      - name: billing_period_start
        type: datetime
        source: input
        description: First day of the billing period (ISO date)
      - name: billing_period_end
        type: datetime
        source: input
        description: Last day of the billing period (ISO date)
      - name: line_items
        type: array
        source: input
        description: Array of {description, quantity, unit_amount_cents, kind} items; kinds in {TUITION, FEE, CREDIT}
      - name: subtotal_cents
        type: integer
        source: computed
        description: Sum of per-line rounded amounts (round-per-line-then-sum rule)
      - name: admin_fee_cents
        type: integer
        source: computed
        description: Tiered admin fee computed from pod enrolled_count
      - name: total_cents
        type: integer
        source: computed
        description: subtotal_cents + admin_fee_cents; evaluation order pinned by calculation
      - name: paid_cents
        type: integer
        source: computed
        description: Sum of Payment.amount_cents with status CLEARED applied to this invoice
        default: 0
      - name: invoice_status
        type: enum
        source: system
        description: Lifecycle
        constraints: "one of DRAFT, ISSUED, PARTIALLY_PAID, PAID, OVERDUE, WRITTEN_OFF"
        default: DRAFT
      - name: due_date
        type: datetime
        source: input
        description: Payment due date (ISO date)

  - name: Payment
    parent: TuitionInvoice
    common_fields: false
    fields:
      - name: invoice_id
        type: string
        source: input
        description: FK -> TuitionInvoice.id
      - name: seat_id
        type: string
        source: input
        description: FK -> Seat.id; denormalized for reporting
      - name: source_kind
        type: enum
        source: input
        description: Who paid
        constraints: "one of FAMILY, VOUCHER, SCHOLARSHIP, REFUND_REVERSAL"
      - name: voucher_account_id
        type: string
        source: input
        description: FK -> VoucherAccount.id; required iff source_kind == VOUCHER
        constraints: "nullable"
      - name: amount_cents
        type: integer
        source: input
        description: Payment amount in cents; positive for payments
        constraints: "integer > 0"
      - name: paid_at
        type: datetime
        source: system
        description: UTC timestamp when payment was recorded
      - name: payment_status
        type: enum
        source: system
        description: Lifecycle; CLEARED is the only state counted toward paid_cents
        constraints: "one of PENDING, CLEARED, FAILED, REVERSED"
        default: PENDING

  - name: RefundClaim
    parent: Pod
    common_fields: true
    fields:
      - name: pod_id
        type: string
        source: input
        description: FK -> Pod.id
      - name: seat_id
        type: string
        source: input
        description: FK -> Seat.id; the seat whose withdrawal/dissolution triggers this claim
      - name: claim_kind
        type: enum
        source: input
        description: Origin of the claim
        constraints: "one of WITHDRAWAL, DISSOLUTION, OVERPAYMENT"
      - name: claimed_amount_cents
        type: integer
        source: computed
        description: Refund computed by refund_on_withdrawal or dissolution_refund_pool calculation
      - name: approved_amount_cents
        type: integer
        source: system
        description: Final approved amount after review; may differ from claimed_amount_cents
        constraints: "nullable"
      - name: claim_status
        type: enum
        source: system
        description: Lifecycle
        constraints: "one of FILED, UNDER_REVIEW, APPROVED, DENIED, PAID"
        default: FILED
      - name: reviewed_by_user_id
        type: string
        source: system
        description: Opaque id of the Registrar or PlatformAdmin who decided; set on APPROVED/DENIED
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID of the filer; segregation-of-duties check compares reviewer against filer

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: Pod
    initial_state: DRAFT
    terminal_states: [DISSOLVED]
    transitions:
      - from: DRAFT
        to: FORMING
        trigger: "POST /pods/{id}/open-enrollment"
        actor: PodOperator
        preconditions:
          - "Pod.facility_site_id references a FacilitySite with site_status in {AVAILABLE, LEASED}"
          - "Pod has at least one SafetyPolicy with policy_status == APPROVED"
          - "Pod has at least one CurriculumPlan with plan_status == APPROVED"
        side_effects:
          - "Pod.posture recomputed (likely OPEN)"
          - "FacilitySite.site_status transitions to LEASED if previously AVAILABLE"
          - "Pod.version increments by 1"
      - from: FORMING
        to: DRAFT
        trigger: "POST /pods/{id}/revert-to-draft"
        actor: PodOperator
        preconditions:
          - "No Seat with seat_status in {RESERVED, ENROLLED} exists for this pod"
        side_effects:
          - "Pod.posture recomputed"
          - "Pod.version increments by 1"
      - from: FORMING
        to: LICENSING_REVIEW
        trigger: "POST /pods/{id}/licensing-determinations"
        actor: PodOperator
        preconditions:
          - "No LicensingDetermination with determination_status in {SUBMITTED, UNDER_REVIEW} already exists for this pod"
        side_effects:
          - "Creates a LicensingDetermination with determination_status=SUBMITTED"
          - "Pod.posture := RESTRICTED (licensing in flight)"
          - "Pod.version increments by 1"
      - from: LICENSING_REVIEW
        to: ACTIVE
        trigger: "LicensingDetermination enters EXEMPT_GRANTED or LICENSE_GRANTED"
        actor: system
        preconditions:
          - "Latest LicensingDetermination.determination_status in {EXEMPT_GRANTED, LICENSE_GRANTED}"
          - "Pod has at least one GuideAssignment with assignment_status in {SCHEDULED, ACTIVE} covering term_start_date"
        side_effects:
          - "Pod.posture recomputed"
          - "Pod.compliance_flag := COMPLIANT"
          - "Pod.version increments by 1"
      - from: LICENSING_REVIEW
        to: FORMING
        trigger: "LicensingDetermination enters DENIED or LICENSE_REQUIRED without a license-grant path"
        actor: system
        preconditions: []
        side_effects:
          - "Pod.posture recomputed"
          - "Pod.compliance_flag := AT_RISK"
          - "Pod.version increments by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /pods/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "Pod.compliance_flag in {AT_RISK, VIOLATION}"
        side_effects:
          - "Pod.posture := FROZEN"
          - "All Seat records remain but enrollment actions blocked while FROZEN"
          - "Pod.version increments by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /pods/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "Pod.compliance_flag == COMPLIANT (after re-evaluation)"
        side_effects:
          - "Pod.posture recomputed"
          - "Pod.version increments by 1"
      - from: ACTIVE
        to: DISSOLVING
        trigger: "POST /pods/{id}/dissolve"
        actor: PodOperator
        preconditions:
          - "Pod has at least one Seat with seat_status == ENROLLED (otherwise use immediate DISSOLVED path via revert-to-draft semantics; see note)"
          - "Request body carries expected_pod_version matching current Pod.version (OCC)"
        side_effects:
          - "Pod.dissolution_reason recorded"
          - "Pod.posture := CLOSED"
          - "CASCADE: every Seat with seat_status == ENROLLED transitions to WITHDRAWN with withdrawn_on := today"
          - "CASCADE: every GuideAssignment with assignment_status in {SCHEDULED, ACTIVE} transitions to TERMINATED_EARLY"
          - "CASCADE: every CurriculumPlan with plan_status == APPROVED transitions to SUPERSEDED"
          - "CASCADE: creates a RefundClaim with claim_kind=DISSOLUTION per withdrawn Seat"
          - "CASCADE: each VoucherAccount linked to a withdrawn Student receives funding_status := FROZEN (held pending refund reconciliation)"
          - "Pod.version increments by 1"
        note: "If no ENROLLED seats, PodOperator may transition DRAFT->DISSOLVED directly via a specialized endpoint POST /pods/{id}/dissolve with zero-seat branch."
      - from: SUSPENDED
        to: DISSOLVING
        trigger: "POST /pods/{id}/dissolve"
        actor: PodOperator
        preconditions:
          - "Request body carries expected_pod_version matching current Pod.version (OCC)"
        side_effects:
          - "Identical cascade as ACTIVE -> DISSOLVING"
          - "Pod.version increments by 1"
      - from: DISSOLVING
        to: DISSOLVED
        trigger: "POST /pods/{id}/finalize-dissolution"
        actor: PlatformAdmin
        preconditions:
          - "Every RefundClaim with claim_kind=DISSOLUTION for this pod has claim_status in {APPROVED, PAID, DENIED}"
          - "Every VoucherAccount previously FROZEN by the cascade has funding_status != FROZEN (released)"
        side_effects:
          - "Pod.dissolved_at := current UTC"
          - "Pod.posture := CLOSED"
          - "CASCADE: every Seat with seat_status == WITHDRAWN transitions to RELEASED"
          - "CASCADE: every Family with zero remaining ENROLLED students transitions family_status := INACTIVE"
          - "Pod.version increments by 1"

  - entity: Seat
    initial_state: RESERVED
    terminal_states: [WITHDRAWN, RELEASED]
    transitions:
      - from: RESERVED
        to: ENROLLED
        trigger: "POST /pods/{pod_id}/seats/{id}/enroll"
        actor: Family
        preconditions:
          - "Pod.status == ACTIVE"
          - "Pod.posture in {OPEN, RESTRICTED}"
          - "Pod.enrolled_count < Pod.seat_capacity"
          - "Student linked to this seat has student_status == APPLICANT"
          - "If Student.esa_account_id is set: VoucherAccount.accepted_by_pod == true"
          - "Pod holds at least one GuideAssignment with assignment_status in {SCHEDULED, ACTIVE} covering Seat.enrolled_on"
        side_effects:
          - "Pod.enrolled_count recomputed (increments by 1)"
          - "Student.student_status := ENROLLED"
          - "Family.family_status := ACTIVE"
          - "Seat.tuition_basis_cents := Pod.tuition_full_year_cents (pinned snapshot)"
          - "Seat.prorated_due_cents := prorated_tuition(pod, enrolled_on)"
          - "Pod.posture recomputed (capacity check)"
          - "Pod.compliance_flag recomputed via guide_to_student_ratio"
          - "Seat.version increments by 1"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /pods/{pod_id}/seats/{id}/withdraw"
        actor: Family
        preconditions:
          - "Pod.status in {ACTIVE, SUSPENDED}"
          - "Request body carries withdrawn_on date >= today (the logical clock)"
        side_effects:
          - "Seat.withdrawn_on := payload.withdrawn_on"
          - "Student.student_status := WITHDRAWN"
          - "Pod.enrolled_count recomputed (decrements by 1)"
          - "Pod.compliance_flag recomputed via guide_to_student_ratio"
          - "Creates a RefundClaim with claim_kind=WITHDRAWN (computed via refund_on_withdrawal)"
          - "CASCADE: every TuitionInvoice with invoice_status in {DRAFT, ISSUED} for this seat transitions to WRITTEN_OFF if its total exceeds recomputed prorated_due; otherwise PARTIALLY_PAID/PAID recompute"
          - "Seat.version increments by 1"
      - from: WITHDRAWN
        to: RELEASED
        trigger: "system cascade from Pod DISSOLVING -> DISSOLVED finalization"
        actor: system
        preconditions:
          - "Pod.status == DISSOLVED"
        side_effects:
          - "Seat.version increments by 1"

  - entity: GuideAssignment
    initial_state: SCHEDULED
    terminal_states: [ENDED, TERMINATED_EARLY]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system: when logical clock reaches window_start_date AND Pod.status == ACTIVE"
        actor: system
        preconditions:
          - "Pod.status == ACTIVE at window_start_date"
        side_effects:
          - "Pod.compliance_flag recomputed via guide_to_student_ratio"
          - "GuideAssignment.version increments by 1"
      - from: ACTIVE
        to: ENDED
        trigger: "system: when logical clock passes window_end_date"
        actor: system
        preconditions: []
        side_effects:
          - "Pod.compliance_flag recomputed via guide_to_student_ratio"
          - "GuideAssignment.version increments by 1"
      - from: ACTIVE
        to: TERMINATED_EARLY
        trigger: "POST /pods/{pod_id}/guide-assignments/{id}/terminate"
        actor: PodOperator
        preconditions:
          - "Pod.status in {ACTIVE, SUSPENDED}"
          - "After termination, projected guide_to_student_ratio on remaining ACTIVE+SCHEDULED assignments must still satisfy min_guides_required OR a replacement assignment is already SCHEDULED starting within 7 calendar days"
        side_effects:
          - "Pod.compliance_flag recomputed; if ratio violated -> Pod.status := SUSPENDED (auto-cascade) AND Pod.posture := FROZEN"
          - "GuideAssignment.version increments by 1"
      - from: SCHEDULED
        to: TERMINATED_EARLY
        trigger: "POST /pods/{pod_id}/guide-assignments/{id}/terminate"
        actor: PodOperator
        preconditions:
          - "Pod.status in {DRAFT, FORMING, LICENSING_REVIEW, ACTIVE, SUSPENDED}"
        side_effects:
          - "GuideAssignment.version increments by 1"

  - entity: LicensingDetermination
    initial_state: SUBMITTED
    terminal_states: [EXEMPT_GRANTED, LICENSE_GRANTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /pods/{pod_id}/licensing-determinations/{id}/begin-review"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "LicensingDetermination.version increments by 1"
      - from: UNDER_REVIEW
        to: EXEMPT_GRANTED
        trigger: "POST /pods/{pod_id}/licensing-determinations/{id}/decide"
        actor: ComplianceOfficer
        preconditions:
          - "Payload.decision == 'EXEMPT_GRANTED'"
          - "Pod.seat_capacity <= 10 (exemption eligibility threshold; >10 requires full license)"
          - "FacilitySite.zoning_class in {RESIDENTIAL_SINGLE, RELIGIOUS, AGRICULTURAL}"
        side_effects:
          - "LicensingDetermination.decided_at := now"
          - "CASCADE: Pod LICENSING_REVIEW -> ACTIVE if other preconditions hold"
          - "LicensingDetermination.version increments by 1"
      - from: UNDER_REVIEW
        to: LICENSE_GRANTED
        trigger: "POST /pods/{pod_id}/licensing-determinations/{id}/decide"
        actor: ComplianceOfficer
        preconditions:
          - "Payload.decision == 'LICENSE_GRANTED'"
          - "Pod.submission_kind == FULL_LICENSE"
        side_effects:
          - "LicensingDetermination.decided_at := now"
          - "CASCADE: Pod LICENSING_REVIEW -> ACTIVE if other preconditions hold"
          - "LicensingDetermination.version increments by 1"
      - from: UNDER_REVIEW
        to: LICENSE_REQUIRED
        trigger: "POST /pods/{pod_id}/licensing-determinations/{id}/decide"
        actor: ComplianceOfficer
        preconditions:
          - "Payload.decision == 'LICENSE_REQUIRED'"
        side_effects:
          - "CASCADE: Pod LICENSING_REVIEW -> FORMING (exemption denied; needs full license)"
          - "LicensingDetermination.version increments by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /pods/{pod_id}/licensing-determinations/{id}/decide"
        actor: ComplianceOfficer
        preconditions:
          - "Payload.decision == 'DENIED'"
          - "Payload.denial_reason non-empty"
        side_effects:
          - "CASCADE: Pod LICENSING_REVIEW -> FORMING"
          - "Pod.compliance_flag := AT_RISK"
          - "LicensingDetermination.version increments by 1"
      - from: DENIED
        to: RESUBMITTED
        trigger: "POST /pods/{pod_id}/licensing-determinations/{id}/resubmit"
        actor: PodOperator
        preconditions:
          - "Payload.revision_number == current revision_number + 1"
        side_effects:
          - "LicensingDetermination.revision_number incremented"
          - "LicensingDetermination.version increments by 1"
      - from: RESUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /pods/{pod_id}/licensing-determinations/{id}/begin-review"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "LicensingDetermination.version increments by 1"
      - from: LICENSE_REQUIRED
        to: RESUBMITTED
        trigger: "POST /pods/{pod_id}/licensing-determinations/{id}/resubmit"
        actor: PodOperator
        preconditions:
          - "Payload.submission_kind == 'FULL_LICENSE' (switches from EXEMPTION_CLAIM)"
        side_effects:
          - "LicensingDetermination.revision_number incremented"
          - "LicensingDetermination.version increments by 1"

  - entity: CurriculumPlan
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pods/{pod_id}/curriculum-plans/{id}/submit"
        actor: PodOperator
        preconditions:
          - "Plan covers every grade_band present among the pod's currently ENROLLED seats OR pod has zero ENROLLED seats"
        side_effects:
          - "CurriculumPlan.version increments by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /pods/{pod_id}/curriculum-plans/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "Pod has at least one SafetyPolicy with policy_status == APPROVED"
          - "Total instructional minutes >= 1200"
        side_effects:
          - "CurriculumPlan.approved_at := now"
          - "CurriculumPlan.approved_safety_policy_id := the pod's APPROVED SafetyPolicy with the highest policy_version at this moment (version-pinned reference)"
          - "CurriculumPlan.version increments by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /pods/{pod_id}/curriculum-plans/{id}/revise"
        actor: PodOperator
        preconditions: []
        side_effects:
          - "CurriculumPlan.version increments by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "System: another CurriculumPlan for the same Pod becomes APPROVED, OR Pod dissolution cascade"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE: any ProgressConference referencing this plan with conference_status in {REQUESTED, SCHEDULED, RESCHEDULED} transitions to CANCELLED"
          - "CurriculumPlan.version increments by 1"

  - entity: ProgressConference
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /pods/{pod_id}/progress-conferences/{id}/schedule"
        actor: Guide
        preconditions:
          - "Pod.status == ACTIVE"
          - "Seat.seat_status == ENROLLED"
          - "CurriculumPlan.plan_status == APPROVED"
          - "No other ProgressConference for the same guide has overlapping [scheduled_start, scheduled_end) with non-terminal status"
        side_effects:
          - "ProgressConference.version increments by 1"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /pods/{pod_id}/progress-conferences/{id}/complete"
        actor: Guide
        preconditions:
          - "Payload.notes_summary non-empty"
        side_effects:
          - "ProgressConference.version increments by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /pods/{pod_id}/progress-conferences/{id}/mark-no-show"
        actor: Guide
        preconditions:
          - "Current logical clock >= scheduled_end"
        side_effects:
          - "ProgressConference.version increments by 1"
      - from: NO_SHOW
        to: RESCHEDULED
        trigger: "POST /pods/{pod_id}/progress-conferences/{id}/reschedule"
        actor: Family
        preconditions:
          - "ProgressConference.cycle_count < 3"
        side_effects:
          - "ProgressConference.cycle_count incremented"
          - "ProgressConference.version increments by 1"
      - from: RESCHEDULED
        to: SCHEDULED
        trigger: "POST /pods/{pod_id}/progress-conferences/{id}/schedule"
        actor: Guide
        preconditions:
          - "Same as REQUESTED -> SCHEDULED"
        side_effects:
          - "ProgressConference.version increments by 1"
      - from: RESCHEDULED
        to: CANCELLED
        trigger: "POST /pods/{pod_id}/progress-conferences/{id}/cancel"
        actor: Family
        preconditions: []
        side_effects:
          - "ProgressConference.version increments by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /pods/{pod_id}/progress-conferences/{id}/cancel"
        actor: Family
        preconditions: []
        side_effects:
          - "ProgressConference.version increments by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pods/{pod_id}/progress-conferences/{id}/cancel"
        actor: Family
        preconditions: []
        side_effects:
          - "ProgressConference.version increments by 1"

  - entity: SafetyPolicy
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /pods/{pod_id}/safety-policies/{id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "Length(emergency_plan_text) >= 200 chars"
          - "drill_cadence_days in [7..90]"
        side_effects:
          - "SafetyPolicy.approved_at := now"
          - "CASCADE: any prior APPROVED SafetyPolicy for the same Pod transitions to SUPERSEDED"
          - "SafetyPolicy.version increments by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "System cascade: a newer SafetyPolicy for the same Pod is APPROVED"
        actor: system
        preconditions: []
        side_effects:
          - "SafetyPolicy.version increments by 1"

  - entity: TuitionInvoice
    initial_state: DRAFT
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /pods/{pod_id}/seats/{seat_id}/invoices/{id}/issue"
        actor: PodOperator
        preconditions:
          - "Seat.seat_status == ENROLLED"
        side_effects:
          - "Invoice subtotal_cents, admin_fee_cents, total_cents recomputed"
          - "TuitionInvoice.version increments by 1"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "Payment posted against this invoice with paid_cents > 0 AND paid_cents < total_cents"
        actor: system
        preconditions: []
        side_effects:
          - "TuitionInvoice.paid_cents recomputed"
          - "TuitionInvoice.version increments by 1"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "Payment posted; cumulative paid_cents >= total_cents"
        actor: system
        preconditions: []
        side_effects:
          - "TuitionInvoice.version increments by 1"
      - from: ISSUED
        to: PAID
        trigger: "Payment posted; cumulative paid_cents >= total_cents in one shot"
        actor: system
        preconditions: []
        side_effects:
          - "TuitionInvoice.version increments by 1"
      - from: ISSUED
        to: OVERDUE
        trigger: "system: logical clock passes due_date with paid_cents < total_cents"
        actor: system
        preconditions: []
        side_effects:
          - "TuitionInvoice.version increments by 1"
      - from: PARTIALLY_PAID
        to: OVERDUE
        trigger: "system: logical clock passes due_date with paid_cents < total_cents"
        actor: system
        preconditions: []
        side_effects:
          - "TuitionInvoice.version increments by 1"
      - from: OVERDUE
        to: PAID
        trigger: "Payment posted; cumulative paid_cents >= total_cents"
        actor: system
        preconditions: []
        side_effects:
          - "TuitionInvoice.version increments by 1"
      - from: ISSUED
        to: WRITTEN_OFF
        trigger: "POST /pods/{pod_id}/seats/{seat_id}/invoices/{id}/write-off"
        actor: PodOperator
        preconditions:
          - "Seat.seat_status == WITHDRAWN"
          - "paid_cents == 0"
        side_effects:
          - "TuitionInvoice.version increments by 1"
      - from: OVERDUE
        to: WRITTEN_OFF
        trigger: "POST /pods/{pod_id}/seats/{seat_id}/invoices/{id}/write-off"
        actor: PodOperator
        preconditions:
          - "Seat.seat_status == WITHDRAWN"
          - "paid_cents == 0"
        side_effects:
          - "TuitionInvoice.version increments by 1"

  - entity: Payment
    initial_state: PENDING
    terminal_states: [CLEARED, FAILED, REVERSED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /payments/{id}/clear"
        actor: PodOperator
        preconditions:
          - "If source_kind == VOUCHER: VoucherAccount.verification_status == VERIFIED AND VoucherAccount.disbursable_balance_cents >= Payment.amount_cents"
        side_effects:
          - "TuitionInvoice.paid_cents recomputed; invoice may transition"
          - "Seat.paid_cents recomputed"
          - "If source_kind == VOUCHER: VoucherAccount.disbursable_balance_cents -= Payment.amount_cents; funding_status recomputed via esa_voucher_disbursement thresholds"
      - from: PENDING
        to: FAILED
        trigger: "POST /payments/{id}/fail"
        actor: PodOperator
        preconditions: []
        side_effects: []
      - from: CLEARED
        to: REVERSED
        trigger: "POST /payments/{id}/reverse"
        actor: PlatformAdmin
        preconditions:
          - "Linked Seat.seat_status == WITHDRAWN OR RefundClaim in {APPROVED, PAID} exists referencing this seat"
        side_effects:
          - "TuitionInvoice.paid_cents recomputed (decremented)"
          - "Seat.paid_cents recomputed"
          - "If source_kind == VOUCHER: VoucherAccount.disbursable_balance_cents += Payment.amount_cents"

  - entity: VoucherAccount
    initial_state: PENDING_VERIFICATION
    terminal_states: []
    note: "Two parallel state dimensions on one entity: verification_status (initial PENDING_VERIFICATION) and funding_status (initial FUNDED) evolve independently."
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /voucher-accounts/{id}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "Student.date_of_birth yields an eligible grade_band for the program_code jurisdiction"
        side_effects:
          - "VoucherAccount.accepted_by_pod recomputed"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /voucher-accounts/{id}/reject"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: FUNDED
        to: PARTIALLY_DEPLETED
        trigger: "system: when disbursable_balance_cents drops below 50% of awarded_annual_cents"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_DEPLETED
        to: DEPLETED
        trigger: "system: when disbursable_balance_cents reaches 0"
        actor: system
        preconditions: []
        side_effects: []
      - from: FUNDED
        to: FROZEN
        trigger: "system cascade: Pod dissolution freezes linked accounts"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_DEPLETED
        to: FROZEN
        trigger: "system cascade: Pod dissolution freezes linked accounts"
        actor: system
        preconditions: []
        side_effects: []
      - from: FROZEN
        to: FUNDED
        trigger: "POST /voucher-accounts/{id}/release"
        actor: PlatformAdmin
        preconditions:
          - "Owning Pod.status == DISSOLVED"
          - "All RefundClaims for the seat have been decided"
        side_effects:
          - "funding_status recomputed from balance thresholds"

  - entity: RefundClaim
    initial_state: FILED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /pods/{pod_id}/refund-claims/{id}/begin-review"
        actor: Registrar
        preconditions: []
        side_effects:
          - "RefundClaim.version increments by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /pods/{pod_id}/refund-claims/{id}/decide"
        actor: Registrar
        preconditions:
          - "Payload.decision == 'APPROVED'"
          - "Payload.approved_amount_cents <= claimed_amount_cents"
          - "Segregation of duties: X-User-ID != RefundClaim.filed_by_user_id"
        side_effects:
          - "RefundClaim.approved_amount_cents := payload.approved_amount_cents"
          - "RefundClaim.reviewed_by_user_id := X-User-ID"
          - "Seat.refund_due_cents := approved_amount_cents"
          - "RefundClaim.version increments by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /pods/{pod_id}/refund-claims/{id}/decide"
        actor: Registrar
        preconditions:
          - "Payload.decision == 'DENIED'"
          - "Segregation of duties: X-User-ID != RefundClaim.filed_by_user_id"
        side_effects:
          - "RefundClaim.reviewed_by_user_id := X-User-ID"
          - "Seat.refund_due_cents := 0"
          - "RefundClaim.version increments by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /pods/{pod_id}/refund-claims/{id}/disburse"
        actor: PlatformAdmin
        preconditions:
          - "If Seat's student's VoucherAccount is set and claim_kind == DISSOLUTION: disbursement routes via voucher release (VoucherAccount.funding_status must not be FROZEN at the moment of disburse, OR disburse triggers the release then posts)"
        side_effects:
          - "Creates a Payment with source_kind=REFUND_REVERSAL on the original TuitionInvoice(s), OR a negative ledger entry — for this benchmark we model it as a Payment row with source_kind=REFUND_REVERSAL and amount=approved_amount_cents on a synthesized zero-balance invoice scoped to the seat"
          - "RefundClaim.version increments by 1"

  - entity: Family
    initial_state: PROSPECT
    terminal_states: [INACTIVE]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "system: first Seat transitions to ENROLLED for any student of this family"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: INACTIVE
        trigger: "system cascade: Pod DISSOLVED finalization leaves family with zero ENROLLED students"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FacilitySite
    initial_state: AVAILABLE
    terminal_states: [ARCHIVED]
    transitions:
      - from: AVAILABLE
        to: LEASED
        trigger: "system cascade: a Pod referencing this site transitions DRAFT -> FORMING"
        actor: system
        preconditions: []
        side_effects: []
      - from: LEASED
        to: AVAILABLE
        trigger: "POST /facility-sites/{id}/release"
        actor: PlatformAdmin
        preconditions:
          - "No Pod with status in {DRAFT, FORMING, LICENSING_REVIEW, ACTIVE, SUSPENDED, DISSOLVING} references this site"
        side_effects: []
      - from: AVAILABLE
        to: ARCHIVED
        trigger: "POST /facility-sites/{id}/archive"
        actor: PlatformAdmin
        preconditions:
          - "No Pod with status not in {DISSOLVED} references this site"
        side_effects: []

  - entity: Guide
    initial_state: CANDIDATE
    terminal_states: [INACTIVE]
    transitions:
      - from: CANDIDATE
        to: ACTIVE
        trigger: "POST /guides/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "If pod SafetyPolicy.background_check_required == true for any pod the guide will be assigned to, a clearance record must exist (out of scope for this benchmark; assume true)"
        side_effects: []
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /guides/{id}/deactivate"
        actor: PlatformAdmin
        preconditions:
          - "No GuideAssignment with assignment_status in {SCHEDULED, ACTIVE} references this guide"
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: seat-enroll-stale-pod
    parent_entity: Pod
    write_endpoint: "POST /pods/{pod_id}/seats/{id}/enroll"
    occ_field: "expected_pod_version"
    description: |
      Enrolling a Seat against a Pod whose version has advanced since the
      client last observed it is rejected. This captures the case where
      another writer has just enrolled a different seat (advancing
      Pod.enrolled_count and Pod.version) and the current writer's view of
      remaining capacity is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: pod-dissolve-stale-pod
    parent_entity: Pod
    write_endpoint: "POST /pods/{id}/dissolve"
    occ_field: "expected_pod_version"
    description: |
      Initiating dissolution against a Pod whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just enrolled a new seat or posted a payment (each
      of which bumps Pod.version) and the current writer's view of the
      pod's dissolution-refund baseline is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: prorated_tuition
    trigger: "When a Seat transitions RESERVED -> ENROLLED with an enrolled_on date later than Pod.term_start_date; also recomputed on withdrawal to determine earned-vs-unearned split"
    algorithm: chronological
    formula: |
      # Step 1: compute total instructional days in the pod's academic year (inclusive both ends).
      total_days = (Pod.term_end_date - Pod.term_start_date).days + 1
      # Step 2: compute enrolled days.
      enrolled_days = (Pod.term_end_date - Seat.enrolled_on).days + 1
      # Step 3: two valid proration variants (see variants[]).
      #   variant PER_DAY:
      #     prorated = round_half_up( Pod.tuition_full_year_cents * enrolled_days / total_days )
      #   variant PER_WEEK:
      #     enrolled_weeks = ceil( enrolled_days / 7 )
      #     total_weeks    = ceil( total_days / 7 )
      #     prorated = round_half_up( Pod.tuition_full_year_cents * enrolled_weeks / total_weeks )
      # The variant is selected by Pod-level configuration (not modeled as a field —
      # the PRD pins it via scenario); tests must exercise BOTH variants and assert
      # the numerical difference for a mid-year enrollment.
    input_set: "Seat being enrolled; Pod.term_start_date, Pod.term_end_date, Pod.tuition_full_year_cents"
    constants:
      DAYS_PER_WEEK: 7
    precision: "integer cents; round_half_up after division"
    variants:
      - name: per_day
        when: "Pod configured for daily proration"
        difference: "Uses calendar-day granularity"
      - name: per_week
        when: "Pod configured for weekly proration"
        difference: "Uses ceil'd week counts; differs from per_day by up to 6 days' worth of tuition"

  - name: refund_on_withdrawal
    trigger: "When a Seat transitions ENROLLED -> WITHDRAWN"
    algorithm: tiered_pricing
    formula: |
      # Input: days_enrolled = (Seat.withdrawn_on - Seat.enrolled_on).days + 1
      #        paid = Seat.paid_cents (CLEARED payments only)
      #        prorated_earned = prorated_tuition(pod, enrolled_on, upto=withdrawn_on)  [PER_DAY variant always for withdrawal]
      # Sliding-scale refund of the UNEARNED portion, tiered by days_enrolled:
      #   days_enrolled <= 14:                refund_pct of unearned = 100%
      #   14  < days_enrolled <= 45:          refund_pct = 75%
      #   45  < days_enrolled <= 90:          refund_pct = 50%
      #   days_enrolled > 90:                 refund_pct = 0%
      # unearned = max(0, paid - prorated_earned)
      # refund_claimed = round_half_up( unearned * refund_pct )
      # Boundary: at exactly 14, refund_pct = 100%; at exactly 45, refund_pct = 75%; at exactly 90, refund_pct = 50%; at 91, refund_pct = 0%.
    input_set: "Seat being withdrawn; Seat.paid_cents; Pod.tuition_full_year_cents; Pod.term dates"
    constants:
      TIER1_MAX_DAYS: 14
      TIER2_MAX_DAYS: 45
      TIER3_MAX_DAYS: 90
      TIER1_PCT: 1.00
      TIER2_PCT: 0.75
      TIER3_PCT: 0.50
      TIER4_PCT: 0.00
    precision: "integer cents; round_half_up"
    variants:
      - name: sliding_scale
        when: "Standard pod policy"
        difference: "Tiered refund percentages as defined above"
      - name: flat_fee
        when: "Pod configured with administrative flat-fee withdrawal"
        difference: "Always refunds max(0, paid - flat_fee_cents); ignores days_enrolled"

  - name: guide_to_student_ratio
    trigger: "Recomputed whenever a Seat enters/exits ENROLLED, a GuideAssignment starts/ends/terminates, or a Guide's certification_tier changes"
    algorithm: weighted_scoring
    formula: |
      # Numerator: total weighted guide FTE in window covering today.
      # For each GuideAssignment g where g.assignment_status == ACTIVE
      #   AND g.window_start_date <= today <= g.window_end_date:
      #   contribution = Guide.fte_weight * min(1.0, g.weekly_hours / 30)
      #     -- weekly_hours capped at 30 for ratio purposes
      # fte_total = sum( contribution )
      # Denominator: count of Seats with seat_status == ENROLLED.
      # ratio = fte_total / max(1, enrolled_count)
      # Compliance:
      #   ratio >= 1 / 10        -> COMPLIANT       (one FTE per 10 students)
      #   1/15 <= ratio < 1/10   -> AT_RISK
      #   ratio < 1/15           -> VIOLATION -> auto-suspend Pod
      # Boundary precision: ratio >= 0.1 exactly is COMPLIANT; ratio == 0.0999... is AT_RISK.
      # At ratio exactly 1/15 (== 0.0666...), classification is AT_RISK (inclusive lower bound);
      # strictly below 1/15 is VIOLATION.
    input_set: "GuideAssignments where assignment_status == ACTIVE; Seats where seat_status == ENROLLED; Guides via GuideAssignment.guide_id"
    constants:
      WEEKLY_HOURS_CAP: 30
      COMPLIANT_MIN_RATIO: 0.1
      VIOLATION_MIN_RATIO: 0.0666667
    precision: "4 decimal places for ratio; exact comparison at boundaries"
    variants:
      - name: fte_weighted
        when: "Standard evaluation"
        difference: "APPRENTICE counts as 0.5 FTE; CERTIFIED and LEAD count as 1.0"
      - name: headcount
        when: "Alternate evaluation used by some jurisdictions"
        difference: "Every guide counts as 1.0 regardless of certification_tier; produces different compliance_flag when APPRENTICEs are present"

  - name: esa_voucher_disbursement
    trigger: "When a Payment with source_kind=VOUCHER transitions PENDING -> CLEARED"
    algorithm: threshold
    formula: |
      # On clear:
      #   new_balance = VoucherAccount.disbursable_balance_cents - Payment.amount_cents
      #   funding_status =
      #     FUNDED              if new_balance >= awarded_annual_cents * 0.50
      #     PARTIALLY_DEPLETED  if 0 < new_balance < awarded_annual_cents * 0.50
      #     DEPLETED            if new_balance == 0
      # Boundary precision: at new_balance exactly == awarded * 0.50, status is FUNDED (>= inclusive).
      # At new_balance == 1 cent, status is PARTIALLY_DEPLETED. At 0, DEPLETED.
      # Disbursement REJECTED with ERR_INSUFFICIENT_VOUCHER_FUNDS if Payment.amount_cents > disbursable_balance_cents.
    input_set: "VoucherAccount; Payment.amount_cents; VoucherAccount.awarded_annual_cents"
    constants:
      FUNDED_THRESHOLD_PCT: 0.50
    precision: "integer cents"
    variants:
      - name: quarterly_release
        when: "Standard ESA program"
        difference: "Funding_status evaluated against full awarded_annual_cents"
      - name: monthly_release
        when: "Some programs release funds monthly; disbursable balance is capped at awarded_annual_cents / 10 per month"
        difference: "Same thresholds, but applied to monthly cap; produces different FUNDED/PARTIALLY_DEPLETED boundary for identical balances"

  - name: dissolution_refund_pool
    trigger: "When Pod transitions ACTIVE or SUSPENDED -> DISSOLVING"
    algorithm: waterfall_allocation
    formula: |
      # Pool computation:
      #   gross_collected = sum( Seat.paid_cents for Seat where Seat.seat_status transitioned to WITHDRAWN in this cascade )
      #   earned_through_dissolution = sum( prorated_tuition(pod, seat.enrolled_on, upto=pod.dissolved_at) for each such seat )
      #   pool = max(0, gross_collected - earned_through_dissolution)
      # Waterfall (priority order; each bucket fills before overflow to next):
      #   Bucket 1: VoucherAccount reimbursements (pro-rata by voucher-paid cents) — up to total voucher-paid
      #   Bucket 2: Family direct-paid refunds (pro-rata by family-paid cents)
      #   Bucket 3: Scholarship fund returns
      # Pro-rata within a bucket: each claimant's share = pool_remaining * (claimant_paid / bucket_total_paid),
      # rounded half-up to integer cents. Rounding remainder (pool_remaining - sum of shares) is allocated
      # to the claimant with the EARLIEST Seat.created_at (tie-break: created_at ASC — never id).
      # Overflow beyond the pool: each bucket capped at its total_paid; if pool < bucket_total, pro-rata applies.
    input_set: "All Seats transitioned to WITHDRAWN by the dissolution cascade; their CLEARED Payments grouped by source_kind"
    constants: {}
    precision: "integer cents; rounding remainder goes to earliest-created-at claimant"
    variants: []

  - name: tiered_admin_fee
    trigger: "When a TuitionInvoice transitions DRAFT -> ISSUED (or line_items change on a DRAFT invoice)"
    algorithm: tiered_pricing
    formula: |
      # Admin fee is a percentage of the invoice subtotal, tiered by the pod's enrolled_count
      # at the moment of issuance (NOT the student's own seat count).
      #   enrolled_count <= 8:   fee_pct = 0.04
      #   8  < enrolled_count <= 16:  fee_pct = 0.03
      #   16 < enrolled_count <= 24:  fee_pct = 0.02
      #   enrolled_count > 24:   fee_pct = 0.015
      # admin_fee_cents = round_half_up( subtotal_cents * fee_pct )
      # Boundary: at enrolled_count == 8, fee_pct = 0.04; at 9, fee_pct = 0.03; at 16, 0.03; at 17, 0.02; at 24, 0.02; at 25, 0.015.
      # EVALUATION ORDER (pinned): subtotal_cents is computed first via round-per-line-then-sum
      # (each line's extended amount = round_half_up(quantity * unit_amount_cents)), then admin_fee_cents
      # is computed from that subtotal, then total_cents = subtotal_cents + admin_fee_cents.
      # A 'sum-then-round' alternative would produce different cents for fractional line items; this
      # scaffold pins the per-line-then-sum order.
    input_set: "TuitionInvoice.line_items; Pod.enrolled_count at time of issue"
    constants:
      TIER1_MAX_ENROLLED: 8
      TIER2_MAX_ENROLLED: 16
      TIER3_MAX_ENROLLED: 24
      TIER1_PCT: 0.04
      TIER2_PCT: 0.03
      TIER3_PCT: 0.02
      TIER4_PCT: 0.015
    precision: "integer cents; round_half_up per line, then per fee"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (§1.4) — ordered by priority
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and value is one of the declared roles; X-User-ID header present for all non-Anonymous roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role in X-User-Role is permitted to invoke this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-templated resources exist; checked left-to-right along the URL path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Body-referenced foreign keys resolve to existing entities (e.g., pod_id, student_id, facility_site_id, guide_id, curriculum_plan_id, esa_account_id, seat_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all POST/PUT/PATCH endpoints with body FKs"

  - priority: 5
    category: state
    check: "Target entity is in a state from which the requested transition is valid per its state machine"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Pod.posture gates child mutations: posture == FROZEN blocks enroll/withdraw/schedule; posture == CLOSED blocks everything"
    error_id: ERR_POD_FROZEN
    http_status: 409
    applies_to: "POST /pods/{id}/seats, POST /pods/{id}/seats/{id}/enroll, POST /pods/{id}/seats/{id}/withdraw, POST /pods/{id}/progress-conferences, POST /pods/{id}/guide-assignments"

  - priority: 7
    category: business_safety
    check: "Pod has at least one APPROVED SafetyPolicy before FORMING; SafetyPolicy approval requires emergency_plan_text >= 200 chars and drill_cadence_days in [7..90]"
    error_id: ERR_SAFETY_POLICY_MISSING
    http_status: 422
    applies_to: "POST /pods/{id}/open-enrollment, POST /pods/{id}/safety-policies/{id}/approve"

  - priority: 8
    category: business_safety
    check: "LicensingDetermination EXEMPT_GRANTED requires Pod.seat_capacity <= 10 AND FacilitySite.zoning_class in {RESIDENTIAL_SINGLE, RELIGIOUS, AGRICULTURAL}"
    error_id: ERR_EXEMPTION_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /pods/{pod_id}/licensing-determinations/{id}/decide"

  - priority: 9
    category: business_safety
    check: "Segregation of duties: RefundClaim reviewer X-User-ID must differ from filed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /pods/{pod_id}/refund-claims/{id}/decide"

  - priority: 10
    category: business_constraint
    check: "GuideAssignment windows for the same guide must not overlap in [window_start_date, window_end_date] (inclusive both ends) while assignment_status in {SCHEDULED, ACTIVE}"
    error_id: ERR_GUIDE_WINDOW_OVERLAP
    http_status: 422
    applies_to: "POST /pods/{id}/guide-assignments"

  - priority: 11
    category: business_constraint
    check: "ProgressConference windows for the same guide must not overlap in [scheduled_start, scheduled_end) (half-open) while conference_status in {REQUESTED, SCHEDULED, RESCHEDULED}"
    error_id: ERR_CONFERENCE_OVERLAP
    http_status: 422
    applies_to: "POST /pods/{id}/progress-conferences, POST /pods/{pod_id}/progress-conferences/{id}/schedule"

  - priority: 12
    category: business_constraint
    check: "Seat claim uniqueness: at most one Seat with seat_status in {RESERVED, ENROLLED} per (pod_id, student_id)"
    error_id: ERR_DUPLICATE_SEAT
    http_status: 422
    applies_to: "POST /pods/{id}/seats"

  - priority: 13
    category: business_constraint
    check: "Pod capacity: enrolling would exceed Pod.seat_capacity (enrolled_count + 1 > seat_capacity is rejected)"
    error_id: ERR_CAPACITY_FULL
    http_status: 422
    applies_to: "POST /pods/{pod_id}/seats/{id}/enroll"

  - priority: 14
    category: business_constraint
    check: "CurriculumPlan approval requires total_instructional_minutes_per_week >= 1200 AND grade_bands_covered covers every band among the pod's ENROLLED seats"
    error_id: ERR_CURRICULUM_INADEQUATE
    http_status: 422
    applies_to: "POST /pods/{pod_id}/curriculum-plans/{id}/approve"

  - priority: 15
    category: business_temporal
    check: "Seat.enrolled_on must lie within [Pod.term_start_date, Pod.term_end_date] inclusive; mid-year enrollment is permitted (proration applies)"
    error_id: ERR_ENROLLMENT_OUT_OF_TERM
    http_status: 422
    applies_to: "POST /pods/{id}/seats, POST /pods/{pod_id}/seats/{id}/enroll"

  - priority: 16
    category: business_temporal
    check: "GuideAssignment.window_start_date <= window_end_date; window must intersect Pod term"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /pods/{id}/guide-assignments"

  - priority: 17
    category: business_temporal
    check: "ProgressConference.scheduled_start < scheduled_end; both must be in the future relative to logical clock at schedule time"
    error_id: ERR_INVALID_CONFERENCE_WINDOW
    http_status: 422
    applies_to: "POST /pods/{id}/progress-conferences"

  - priority: 18
    category: business_temporal
    check: "Invoice billing_period_start <= billing_period_end; due_date >= billing_period_end"
    error_id: ERR_INVALID_INVOICE_PERIOD
    http_status: 422
    applies_to: "POST /pods/{pod_id}/seats/{seat_id}/invoices"

  - priority: 19
    category: business_fiscal
    check: "Voucher-sourced Payment: VoucherAccount.verification_status == VERIFIED AND VoucherAccount.disbursable_balance_cents >= Payment.amount_cents AND VoucherAccount.funding_status != FROZEN"
    error_id: ERR_INSUFFICIENT_VOUCHER_FUNDS
    http_status: 422
    applies_to: "POST /pods/{pod_id}/seats/{seat_id}/invoices/{invoice_id}/payments, POST /payments/{id}/clear"

  - priority: 20
    category: business_fiscal
    check: "Payment.amount_cents > 0; for FAMILY/SCHOLARSHIP sources, cumulative cleared payments against an invoice may not exceed its total_cents (overpayment rejected)"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /pods/{pod_id}/seats/{seat_id}/invoices/{invoice_id}/payments, POST /payments/{id}/clear"

  - priority: 21
    category: business_fiscal
    check: "RefundClaim approval: approved_amount_cents <= claimed_amount_cents AND approved_amount_cents >= 0"
    error_id: ERR_REFUND_EXCEEDS_CLAIM
    http_status: 422
    applies_to: "POST /pods/{pod_id}/refund-claims/{id}/decide"

  - priority: 22
    category: business_fiscal
    check: "Invoice write-off: paid_cents must be 0 (invoices with any cleared payment cannot be written off; must be refunded instead)"
    error_id: ERR_INVOICE_HAS_PAYMENTS
    http_status: 422
    applies_to: "POST /pods/{pod_id}/seats/{seat_id}/invoices/{id}/write-off"

  - priority: 23
    category: business_referential
    check: "Student.esa_account_id, if set, must reference a VoucherAccount owned by that same student"
    error_id: ERR_VOUCHER_STUDENT_MISMATCH
    http_status: 422
    applies_to: "POST /families/{family_id}/students, PATCH /students/{id}"

  - priority: 24
    category: business_referential
    check: "ProgressConference.curriculum_plan_id must reference an APPROVED CurriculumPlan belonging to the same pod"
    error_id: ERR_PLAN_NOT_APPROVED
    http_status: 422
    applies_to: "POST /pods/{id}/progress-conferences"

  - priority: 25
    category: business_referential
    check: "GuideAssignment.guide_id must reference a Guide with guide_status == ACTIVE"
    error_id: ERR_GUIDE_INACTIVE
    http_status: 422
    applies_to: "POST /pods/{id}/guide-assignments"

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
endpoints:
  # ----- Logical clock (test-driving) -----
  - method: POST
    path: /_clock/set_current_utc
    description: "Set the server's logical clock. Default at startup (before any call): 2026-05-01T00:00:00Z. Used to deterministically drive date-dependent transitions and calculations."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string }
    side_effects: ["May trigger system-side transitions whose preconditions depend on the logical clock (e.g., GuideAssignment SCHEDULED->ACTIVE, TuitionInvoice -> OVERDUE, VoucherAccount threshold recomputes, ProgressConference -> NO_SHOW eligibility)"]

  # ----- FacilitySite CRUD -----
  - method: POST
    path: /facility-sites
    description: Create a facility site
    roles: [PlatformAdmin]
    code: 201
    input: ["site_name", "address_line1", "jurisdiction_code", "zoning_class", "max_occupancy", "indoor_sqft"]
    output: FacilitySite
    side_effects: []
  - method: GET
    path: /facility-sites/{id}
    description: Fetch a site
    roles: [PlatformAdmin, PodOperator, ComplianceOfficer]
    code: 200
    input: []
    output: FacilitySite
    side_effects: []
  - method: GET
    path: /facility-sites
    description: List sites
    roles: [PlatformAdmin, PodOperator, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "site_status?", "jurisdiction_code?"]
    output: FacilitySite[]
    side_effects: []
  - method: POST
    path: /facility-sites/{id}/archive
    description: Archive a site (soft delete); site must not be referenced by any non-DISSOLVED pod
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FacilitySite
    side_effects: ["site_status := ARCHIVED"]
  - method: POST
    path: /facility-sites/{id}/release
    description: Release a leased site back to AVAILABLE
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FacilitySite
    side_effects: ["site_status := AVAILABLE"]

  # ----- Pod CRUD + lifecycle -----
  - method: POST
    path: /pods
    description: Create a new pod in DRAFT status
    roles: [PodOperator]
    code: 201
    input: ["name", "pod_code", "academic_year", "term_start_date", "term_end_date", "seat_capacity", "tuition_full_year_cents", "min_guides_required", "facility_site_id"]
    output: Pod
    side_effects: []
  - method: GET
    path: /pods/{id}
    description: Fetch a pod
    roles: [PlatformAdmin, PodOperator, ComplianceOfficer, Guide, Family, Registrar]
    code: 200
    input: []
    output: Pod
    side_effects: []
  - method: GET
    path: /pods
    description: List pods
    roles: [PlatformAdmin, PodOperator, ComplianceOfficer, Guide, Family, Registrar]
    code: 200
    input: ["limit?", "offset?", "status?", "posture?", "facility_site_id?"]
    output: Pod[]
    side_effects: []
  - method: POST
    path: /pods/{id}/open-enrollment
    description: Transition Pod DRAFT -> FORMING
    roles: [PodOperator]
    code: 200
    input: []
    output: Pod
    side_effects: ["FacilitySite.site_status := LEASED if previously AVAILABLE"]
  - method: POST
    path: /pods/{id}/revert-to-draft
    description: Transition Pod FORMING -> DRAFT
    roles: [PodOperator]
    code: 200
    input: []
    output: Pod
    side_effects: []
  - method: POST
    path: /pods/{id}/suspend
    description: ComplianceOfficer suspends a pod (ACTIVE -> SUSPENDED)
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Pod
    side_effects: ["Pod.posture := FROZEN"]
  - method: POST
    path: /pods/{id}/reinstate
    description: ComplianceOfficer reinstates a suspended pod (SUSPENDED -> ACTIVE)
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Pod
    side_effects: ["Pod.posture recomputed"]
  - method: POST
    path: /pods/{id}/dissolve
    description: Initiate pod dissolution with full cascade
    roles: [PodOperator]
    code: 200
    input: ["expected_pod_version", "dissolution_reason"]
    output: Pod
    side_effects: ["increments Pod.version by 1", "CASCADE per state machine"]
  - method: POST
    path: /pods/{id}/finalize-dissolution
    description: Finalize dissolution once all refund claims decided
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Pod
    side_effects: ["Pod.status := DISSOLVED", "CASCADE per state machine"]

  # ----- SafetyPolicy -----
  - method: POST
    path: /pods/{id}/safety-policies
    description: Create a safety policy for a pod (DRAFT)
    roles: [PodOperator]
    code: 201
    input: ["policy_version", "emergency_plan_text", "immunization_policy", "background_check_required", "drill_cadence_days"]
    output: SafetyPolicy
    side_effects: []
  - method: GET
    path: /pods/{id}/safety-policies
    description: List safety policies for a pod
    roles: [PlatformAdmin, PodOperator, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "policy_status?"]
    output: SafetyPolicy[]
    side_effects: []
  - method: GET
    path: /safety-policies/{id}
    description: Fetch a single safety policy
    roles: [PlatformAdmin, PodOperator, ComplianceOfficer]
    code: 200
    input: []
    output: SafetyPolicy
    side_effects: []
  - method: GET
    path: /safety-policies
    description: List safety policies across pods (filtered)
    roles: [PlatformAdmin, PodOperator, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "pod_id?", "policy_status?"]
    output: SafetyPolicy[]
    side_effects: []
  - method: POST
    path: /pods/{id}/safety-policies/{policy_id}/approve
    description: Approve a safety policy (cascades prior APPROVED to SUPERSEDED)
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SafetyPolicy
    side_effects: ["Prior APPROVED policies SUPERSEDED"]

  # ----- CurriculumPlan -----
  - method: POST
    path: /pods/{id}/curriculum-plans
    description: Create a curriculum plan (DRAFT)
    roles: [PodOperator]
    code: 201
    input: ["plan_name", "grade_bands_covered", "multi_age_grouping", "total_instructional_minutes_per_week"]
    output: CurriculumPlan
    side_effects: []
  - method: GET
    path: /pods/{id}/curriculum-plans
    description: List curriculum plans for a pod
    roles: [PlatformAdmin, PodOperator, ComplianceOfficer, Guide]
    code: 200
    input: ["limit?", "offset?", "plan_status?"]
    output: CurriculumPlan[]
    side_effects: []
  - method: GET
    path: /curriculum-plans/{id}
    description: Fetch a single curriculum plan
    roles: [PlatformAdmin, PodOperator, ComplianceOfficer, Guide]
    code: 200
    input: []
    output: CurriculumPlan
    side_effects: []
  - method: GET
    path: /curriculum-plans
    description: List curriculum plans across pods (filtered)
    roles: [PlatformAdmin, PodOperator, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "pod_id?", "approved_safety_policy_id?", "plan_status?"]
    output: CurriculumPlan[]
    side_effects: []
  - method: POST
    path: /pods/{id}/curriculum-plans/{plan_id}/submit
    description: Submit plan for approval
    roles: [PodOperator]
    code: 200
    input: []
    output: CurriculumPlan
    side_effects: []
  - method: POST
    path: /pods/{id}/curriculum-plans/{plan_id}/approve
    description: Approve plan; pins the current APPROVED SafetyPolicy id
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CurriculumPlan
    side_effects: ["approved_safety_policy_id pinned", "Prior APPROVED plans SUPERSEDED"]
  - method: POST
    path: /pods/{id}/curriculum-plans/{plan_id}/revise
    description: Send SUBMITTED plan back to DRAFT for revision
    roles: [PodOperator]
    code: 200
    input: []
    output: CurriculumPlan
    side_effects: []

  # ----- LicensingDetermination -----
  - method: POST
