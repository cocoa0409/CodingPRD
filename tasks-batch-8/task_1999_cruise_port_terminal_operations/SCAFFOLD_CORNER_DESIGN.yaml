          assert:
            - "PortCall.${pc}.status == CANCELLED"
            - "bast == SUPERSEDED and sost == CANCELLED and tsst == EXPIRED and est == CANCELLED"
      - name: lane_open_close_cycle_resets_officers
        claim_type: valid_transition
        grounds:
          - state_machines.ScreeningLane.CLOSED_to_OPEN
          - state_machines.ScreeningLane.OPEN_to_CLOSED
        distinguishing_aspect: "open sets officers_assigned from payload; close resets it to 0; the toggle is repeatable."
        test_recipe:
          setup: ["Terminal with lane L1 CLOSED"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/screening-lanes", payload: { terminal_id: "${term}", lane_code: "L1" }, as: PortAuthorityAdmin, captures: { lane: $.data.id, st0: $.data.status, off0: $.data.officers_assigned } }
          trigger:
            - { call: "POST /port-ops/screening-lanes/${lane}/open", payload: { officers_assigned: 3 }, as: TerminalOperator, captures: { st1: $.data.status, off1: $.data.officers_assigned } }
            - { call: "POST /port-ops/screening-lanes/${lane}/close", as: TerminalOperator, captures: { st2: $.data.status, off2: $.data.officers_assigned } }
          assert:
            - "st0 == CLOSED and off0 == 0 (initial state)"
            - "st1 == OPEN and off1 == 3; st2 == CLOSED and off2 == 0"

  # ========================================================= calculations ====
  - section: calculations
    instances:
      - name: dockage_tier_boundaries_by_loa
        claim_type: correct_result
        grounds:
          - calculations.dockage_fee
        distinguishing_aspect: "Tier edges: LOA 700 -> tier1 (95c), 701 -> tier2 (125c), 1000 -> tier2, 1001 -> tier3 (150c); 12h scheduled each."
        test_recipe:
          setup:
            - "Berth B1 length 1300; four vessels LOA 700/701/1000/1001; four calls on different days, each with CONFIRMED assignment"
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1300, max_draft_ft: 45.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV T700", loa_ft: 700, draft_ft: 25.0, pax_capacity: 2000, crew_count: 500 }, as: PortAuthorityAdmin, captures: { v700: $.data.id } }
