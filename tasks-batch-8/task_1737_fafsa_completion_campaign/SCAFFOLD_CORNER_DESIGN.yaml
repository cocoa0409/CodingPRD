  - section: complexity_layers
    instances:
      - name: occ_match_link_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[match-link-create-stale-senior]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on SeniorRecord.version: after a first link (AUTO_REJECTED, terminal — so the dedupe constraint does NOT block a retry) bumps the version, a second create carrying the pre-first-create version is rejected 412; resending with the fresh version succeeds."
