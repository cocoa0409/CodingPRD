          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /bone-density/densitometers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /bone-density/qc-runs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /bone-density/calibration-events/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /bone-density/scan-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
            - call: "GET /bone-density/scan-appointments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
