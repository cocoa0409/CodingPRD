      - name: verify_before_lab_result_rejected
        claim_type: invalid_transition
        grounds: ["errors[ERR_TEST_NOT_LAB_REPORTED]"]
        distinguishing_aspect: "verify requires LAB_REPORTED: verifying a COLLECTED test -> ERR_TEST_NOT_LAB_REPORTED (state fires before the SoD check)."
        test_recipe:
