        test_recipe:
          setup: ["grower exists"]
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C30", legal_name: "Cap Farm" }
              as: CoopAdmin
              captures: { g: $.data.id }
          trigger:
