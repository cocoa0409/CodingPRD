          assert:
            - "Calls 1-3: HTTP 400 with ${err1} == ${err2} == ${err3} == \"ERR_INVALID_REQUEST\" - missing title, seats_open 0 below the declared minimum of 1, and contest_type outside {CANDIDATE, MEASURE} all fail at priority 30 while the path id is still unresolved."
