            - "the third rule brings the uncapped sum to 450, above STACK_CAP_BPS 400"
            - "the cap is applied rather than rejected, so the stored stack clamps to 400 and the diagnostic reports uncapped_bps 450"
            - "a request that instead asks to store the uncapped 450 is the only one that returns 422 ERR_STACK_CAP_EXCEEDED"

      - name: conditional_direct_deposit_requirement_changes_the_rule_set_by_member
        claim_type: conditional_validation
        grounds:
          - calculations.discount_stack_total_bps
          - entities.RateDiscountRule.fields.requires_direct_deposit
