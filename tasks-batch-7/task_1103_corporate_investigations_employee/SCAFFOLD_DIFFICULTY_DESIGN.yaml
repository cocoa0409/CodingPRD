            - { call: "POST /api/evidence-items/${ev_id}/transition", payload: { to_status: ADMITTED }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/collection-scopes/${scope_id}/transition", payload: { to_status: COLLECTED }, as: Investigator, as_user_id: "inv-1" }
            - call: "POST /api/cases/${case_id}/interviews"
