  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: bay_window_half_open_adjacency
        grounds:
          - validations[priority=7]
          - entities.WorkOrder.fields.bay_window_start
        distinguishing_aspect: |
          Resource = hangar bay on WorkOrder, interval semantics = half-open [start, end):
          a booking whose start equals the existing booking's end (adjacency) is accepted,
          while a one-day-earlier overlapping start is rejected with ERR_BAY_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "One customer, three available aircraft; work order 1 occupies BAY-1 over [2026-08-01, 2026-08-20)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/customers", payload: { name: "Bay Owner", contact_email: "bay@x.com", customer_kind: "FLEET_OPERATOR" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N500BA", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_1: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N501BB", make_model: "Cirrus SR22", baseline_empty_weight_lb: 1700.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_2: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N502BC", make_model: "Piper PA-32", baseline_empty_weight_lb: 1900.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_3: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_1}", scope_description: "bay holder", estimated_downtime_days: 15, quoted_labor_hours: 20, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { wo_1: "$.data.id" } }
          trigger:
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_2}", scope_description: "adjacent booking", estimated_downtime_days: 10, quoted_labor_hours: 10, bay_code: "BAY-1", bay_window_start: "2026-08-20T00:00:00Z", bay_window_end: "2026-09-01T00:00:00Z" }, as: ShopManager, captures: { wo_2: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_3}", scope_description: "overlapping booking", estimated_downtime_days: 10, quoted_labor_hours: 10, bay_code: "BAY-1", bay_window_start: "2026-08-19T00:00:00Z", bay_window_end: "2026-09-01T00:00:00Z" }, as: ShopManager, captures: { err: "$.data.error_id" } }
          assert:
            - "adjacent booking (start == prior end) succeeds: WorkOrder.${wo_2} created with status DRAFT — half-open interval permits adjacency"
            - "overlapping booking: error_id == ERR_BAY_WINDOW_CONFLICT"
            - "Aircraft N502BC remains AVAILABLE (rejected creation does not flip status)"

      - name: flight_window_sixty_minute_buffer
        grounds:
          - validations[priority=7]
          - entities.TestEvent.fields.scheduled_start
        distinguishing_aspect: |
          Resource = aircraft (via its work order's flight tests), interval semantics =
          60-minute buffer exclusion: a new flight at exactly end+60min is accepted (>=
          boundary), but adjacency (start == prior end) is REJECTED — opposite adjacency
          treatment from the bay half-open rule above, on a different resource entity.
        test_recipe:
          setup:
            - "Work order in TESTING with GROUND test PASSED; flight-1 scheduled [2026-08-18T14:00, 2026-08-18T15:30)"
          setup_api_calls:
