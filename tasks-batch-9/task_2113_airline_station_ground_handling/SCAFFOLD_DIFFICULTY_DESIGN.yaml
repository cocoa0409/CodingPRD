  # =======================================================================
  # Rule 3 - non-linear state-machine shape on different entities
  # =======================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: incident_closed_reopened_under_investigation_cycle
        grounds:
          - state_machines.Incident.CLOSED_to_REOPENED
          - state_machines.Incident.REOPENED_to_UNDER_INVESTIGATION
          - entities.Incident.fields.reopen_count
          - calculations.station_oversight_posture
        distinguishing_aspect: |
          NON-LINEARITY = a true CYCLE on the Incident entity: CLOSED re-enters
          UNDER_INVESTIGATION through REOPENED, so the same state is visited twice in one
          lifetime, reopen_count advances 0 -> 1, and the station's oversight_posture flips
          NORMAL -> ENHANCED because a closed MAJOR incident becomes open again.
        test_recipe:
          setup:
            - "Station ZRH is OPEN with no other incidents."
            - "Incident I is PERSONAL_INJURY / MAJOR, reported by user duty-01, investigated by safety-01, findings issued by safety-01 and CLOSED by safety-02."
            - "Immediately before the trigger the incident is CLOSED with reopen_count 0 and the station's oversight_posture is NORMAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /incidents"
              payload: { station_id: "${st_id}", incident_type: "PERSONAL_INJURY", severity: "MAJOR", occurred_at: "2026-03-30T09:00:00Z", description: "Slip on stand 12" }
              as: DutyOfficer
              as_user_id: "duty-01"
              captures: { i_id: $.data.id }
            - call: "POST /incidents/${i_id}/transitions"
              payload: { action: "INVESTIGATE" }
              as: SafetyOfficer
              as_user_id: "safety-01"
            - call: "POST /incidents/${i_id}/transitions"
              payload: { action: "ISSUE_FINDINGS", root_cause_code: "SURFACE_CONTAMINATION", liability_party: "HANDLER" }
              as: SafetyOfficer
              as_user_id: "safety-01"
            - call: "POST /incidents/${i_id}/transitions"
              payload: { action: "CLOSE" }
              as: SafetyOfficer
              as_user_id: "safety-02"
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationManager
              captures: { posture_before: $.data.oversight_posture, open_major_before: $.data.open_major_incident_count }
          trigger:
            - call: "POST /incidents/${i_id}/transitions"
              payload: { action: "REOPEN", note: "New CCTV evidence" }
              as: SafetyOfficer
              as_user_id: "safety-02"
              captures: { reopened_status: $.data.status, reopen_n: $.data.reopen_count }
            - call: "POST /incidents/${i_id}/transitions"
              payload: { action: "INVESTIGATE" }
              as: SafetyOfficer
              as_user_id: "safety-03"
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationManager
              captures: { posture_after: $.data.oversight_posture, open_major_after: $.data.open_major_incident_count }
          assert:
            - "${posture_before} == NORMAL"
            - "${open_major_before} == 0"
            - "${reopened_status} == REOPENED"
            - "${reopen_n} == 1"
            - "Incident.${i_id}.status == UNDER_INVESTIGATION"
            - "Incident.${i_id}.investigator_user_id == safety-03"
            - "Incident.${i_id}.reopen_count == 1"
            - "${posture_after} == ENHANCED"
            - "${open_major_after} == 1"

      - name: flight_bank_two_status_axes_move_independently
        grounds:
          - state_machines.FlightBank.DRAFT_to_PUBLISHED
          - state_machines.FlightBank.DRAFT_to_SUBMITTED
          - state_machines.FlightBank.SUBMITTED_to_REVISION_REQUIRED
          - state_machines.FlightBank.REVISION_REQUIRED_to_DRAFT
          - state_machines.FlightBank.SUBMITTED_to_APPROVED
          - state_machines.FlightBank.PUBLISHED_to_LOCKED
          - entities.FlightBank.fields.bank_status
          - entities.FlightBank.fields.staffing_status
        distinguishing_aspect: |
          NON-LINEARITY = two PARALLEL state dimensions on one FlightBank row, on a different
          entity from the Incident cycle: bank_status walks DRAFT -> PUBLISHED -> LOCKED while
          staffing_status independently walks DRAFT -> SUBMITTED -> REVISION_REQUIRED -> DRAFT ->
          SUBMITTED -> APPROVED, and every staffing move leaves bank_status at PUBLISHED.
        test_recipe:
          setup:
            - "Station ZRH is OPEN, season SUMMER."
            - "FlightBank AM1 exists in bank_status DRAFT and staffing_status DRAFT with planned_headcount 0."
            - "One TOWING_ONLY turn sits in the bank, so required_headcount is 1 and publication is admissible."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 0 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /flight-banks/${fb_id}/lifecycle"
              payload: { action: "PUBLISH" }
              as: DutyOfficer
              captures: { bs1: $.data.bank_status, ss1: $.data.staffing_status }
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "SUBMIT" }
              as: DutyOfficer
              captures: { bs2: $.data.bank_status, ss2: $.data.staffing_status, cov2: $.data.staffing_coverage_pct }
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "REJECT" }
              as: StationManager
              as_user_id: "sm-01"
              captures: { bs3: $.data.bank_status, ss3: $.data.staffing_status }
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "REVISE", planned_headcount: 1 }
              as: DutyOfficer
              captures: { bs4: $.data.bank_status, ss4: $.data.staffing_status, cov4: $.data.staffing_coverage_pct }
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "SUBMIT" }
              as: DutyOfficer
              captures: { bs5: $.data.bank_status, ss5: $.data.staffing_status }
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "APPROVE" }
              as: StationManager
              as_user_id: "sm-02"
              captures: { bs6: $.data.bank_status, ss6: $.data.staffing_status }
            - call: "POST /flight-banks/${fb_id}/lifecycle"
              payload: { action: "LOCK" }
              as: StationManager
              captures: { bs7: $.data.bank_status, ss7: $.data.staffing_status }
          assert:
            - "${bs1} == PUBLISHED and ${ss1} == DRAFT"
            - "${bs2} == PUBLISHED and ${ss2} == SUBMITTED"
            - "${cov2} == 0.00"
            - "${bs3} == PUBLISHED and ${ss3} == REVISION_REQUIRED"
            - "${bs4} == PUBLISHED and ${ss4} == DRAFT"
            - "${cov4} == 100.00"
            - "${bs5} == PUBLISHED and ${ss5} == SUBMITTED"
            - "${bs6} == PUBLISHED and ${ss6} == APPROVED"
            - "${bs7} == LOCKED and ${ss7} == APPROVED"
            - "FlightBank.${fb_id}.required_headcount == 1"
            - "FlightBank.${fb_id}.planned_headcount == 1"
            - "FlightBank.${fb_id}.last_staffing_decision_by_user_id == sm-02"

  # =======================================================================
  # Rule 4 - transitive cascade chains from different triggers
  # =======================================================================
  - rule_id: transitive_cascade
    instances:

      - name: critical_gse_incident_four_hop_cascade
        grounds:
          - state_machines.GseUnit.AVAILABLE_to_QUARANTINED
          - state_machines.TurnResource.RESERVED_to_CANCELLED
          - state_machines.Turn.RESOURCED_to_SCHEDULED
          - state_machines.FlightBank.APPROVED_to_REVISION_REQUIRED
          - entities.GseUnit.fields.committed_occupation_minutes
          - calculations.station_oversight_posture
          - errors[ERR_STATION_POSTURE_RESTRICTED]
        distinguishing_aspect: |
          Cascade originating from POST /incidents (equipment damage): hop 1 quarantines the
          GseUnit BECAUSE the incident is CRITICAL and names the unit; hop 2 cancels that unit's
          reserved occupations BECAUSE the unit became QUARANTINED; hop 3 demotes the Turn
          RESOURCED -> SCHEDULED BECAUSE its GSE coverage was cancelled; hop 4 moves the
