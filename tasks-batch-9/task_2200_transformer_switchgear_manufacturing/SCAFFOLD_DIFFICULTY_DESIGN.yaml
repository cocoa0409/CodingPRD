              payload: { claim_number: "WC-XED-1", suspect_component_id: "${comp_id}", failure_reported_at: "2026-08-31T12:00:00Z", parts_claim_cents: 100000, labor_claim_cents: 50000, freight_claim_cents: 20000, consequential_claim_cents: 0 }
              as: ContractAdmin
