  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]

        distinguishing_aspect: "Priority 1: a request with no X-User-Role/X-User-ID headers fails with 401 ERR_UNAUTHENTICATED before any role, existence, or business check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /clients", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED (http 401)"

      - name: role_denial_precedes_existence_forbidden
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=2]", "validations[priority=4]", "errors[ERR_FORBIDDEN]"]

        distinguishing_aspect: "Priority 2 before priority 4: a CaseManager calling the FiduciaryAdmin-only activate endpoint with a NONEXISTENT client id gets 403 ERR_FORBIDDEN, not 404 — the role wall hides existence."
        test_recipe:
          setup: ["Empty DB (id does not exist)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /clients/11111111-1111-4111-8111-111111111111/activate", payload: {}, as: CaseManager, as_user_id: "cm-9", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN (not ERR_CLIENT_NOT_FOUND)"

      - name: sod_disbursement_approve_same_user_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.Disbursement.REQUESTED_to_APPROVED]

        distinguishing_aspect: "Approver X-User-ID equal to requested_by_user_id violates segregation of duties even across different roles (CM requested, FO approves, same person id)."
        test_recipe:
          setup: ["ACTIVE client with account and DRAFT budget; disbursement requested by user 'shared-1'"]
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "SoD Stan", date_of_birth: "1976-05-17", ssn_last4: "9898", county_of_residence: "TRV", medicaid_enrolled: false }, as: FiduciaryAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /benefit-entitlements", payload: { client_id: "${c_id}", claim_type: "SSI", monthly_benefit_cents: 80000, effective_start_date: "2026-01-01" }, as: FiduciaryAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /benefit-entitlements/${e_id}/verify", payload: {}, as: FiduciaryAdmin }
            - { call: "POST /trust-accounts", payload: { client_id: "${c_id}", account_type: "OPERATING", bank_account_ref: "BA-SD-101" }, as: FinancialOfficer, captures: { a_id: $.data.id } }
            - { call: "POST /clients/${c_id}/activate", payload: {}, as: FiduciaryAdmin }
            - { call: "GET /clients/${c_id}", payload: {}, as: FiduciaryAdmin, captures: { c_v: $.data.version } }
            - { call: "POST /budget-plans", payload: { client_id: "${c_id}", period_month: "2026-06", source_benefit_cents: 100000, lines: [{ category: "HOUSING", percent: 100 }], expected_client_version: "${c_v}" }, as: CaseManager, as_user_id: "shared-1", captures: { p_id: $.data.id } }
            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "SoD Payee", category: "HOUSING", amount_cents: 5000, scheduled_release_date: "2026-06-10" }, as: CaseManager, as_user_id: "shared-1", captures: { w_id: $.data.id } }
          trigger:
            - { call: "POST /disbursements/${w_id}/approve", payload: {}, as: FinancialOfficer, as_user_id: "shared-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES (http 403); disbursement stays REQUESTED"

      - name: sod_budget_approve_same_user_rejected
        claim_type: conditional_validation
        grounds: ["validations[priority=10]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.BudgetPlan.PROPOSED_to_APPROVED]

        distinguishing_aspect: "The same segregation rule guards budget approval: the FinancialOfficer approving must not be the CaseManager user who created the plan."
        test_recipe:
