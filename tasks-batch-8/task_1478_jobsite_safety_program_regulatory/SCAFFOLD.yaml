scenario: "Jobsite Safety Program & Regulatory Compliance (contractor safety department): site-specific safety plan & orientation for all workers, daily huddle & job hazard analysis by task, inspection cadence & deficiency correction tracking, incident investigation & OSHA recordability determination, subcontractor safety performance & removal authority, fall protection/excavation/hot work permit programs, drug-free workplace policy & post-incident procedure, training/certification verification (OSHA 10/30)"

domain_name: jobsite-safety-compliance
api_prefix: /safety

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - rate_threshold_triggers
    - optimistic_concurrency
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (12 entities, flat topology, FK links in body)
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Jobsite project name" }
      - { name: location, type: string, source: input, description: "Jobsite address / site identifier" }
      - { name: annual_hours_worked, type: integer, source: input, description: "Total annual worker-hours exposure for OSHA rate denominators", constraints: "integer > 0" }
      - { name: safety_posture, type: enum, source: computed, description: "Derived posture: NORMAL | RESTRICTED | FROZEN (see project_posture calculation); gates permit issue/reinstate and worker clear", default: "NORMAL" }
      - { name: current_active_plan_id, type: string, source: system, description: "id of the currently ACTIVE SafetyPlan; null until first activation" }
      - { name: issued_permit_count, type: integer, source: computed, description: "Count of Permits with project_id = this Project and status == ISSUED", default: 0 }
      - { name: open_deficiency_count, type: integer, source: computed, description: "Count of Deficiencies with project_id = this Project and status IN {OPEN, OVERDUE, CORRECTION_SUBMITTED}", default: 0 }

  - name: SafetyPlan
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; owning jobsite" }
      - { name: effective_date, type: string, source: input, description: "ISO date the plan takes effect (YYYY-MM-DD)" }
      - { name: revision_notes, type: string, source: input, description: "Free-text revision summary", default: "" }
      - { name: revision_no, type: integer, source: computed, description: "1 + count of pre-existing SafetyPlans for the same project at creation time" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> SUPERSEDED; supersede is automatic when another plan activates" }
      - { name: activated_at, type: datetime, source: system, description: "Timestamp of activation; null while DRAFT" }

  - name: Worker
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; jobsite the worker is badged on" }
      - { name: full_name, type: string, source: input, description: "Worker legal name" }
      - { name: employer_type, type: enum, source: input, description: "DIRECT | SUBCONTRACTOR" }
      - { name: subcontractor_id, type: string, source: input, description: "FK -> Subcontractor.id; required iff employer_type == SUBCONTRACTOR, must be null for DIRECT", default: null }
      - { name: is_supervisor, type: boolean, source: input, description: "Supervisors require OSHA_30 for clearance", default: false }
      - { name: status, type: enum, source: system, description: "PENDING_ORIENTATION -> ORIENTED -> CLEARED -> SUSPENDED -> ORIENTED (cycle); any non-terminal -> REMOVED" }
      - { name: orientation_completed_at, type: datetime, source: system, description: "Timestamp of site orientation completion; null until done" }
      - { name: suspension_reason, type: string, source: system, description: "Reason recorded on the most recent suspension; null when not suspended" }

  - name: TrainingCertificate
    parent: null
    common_fields: true
    fields:
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id; certificate holder" }
      - { name: cert_type, type: enum, source: input, description: "OSHA_10 | OSHA_30 | FIRST_AID | FLAGGING" }
      - { name: issued_date, type: string, source: input, description: "ISO date issued (YYYY-MM-DD)" }
      - { name: expires_date, type: string, source: input, description: "ISO expiry date; must be strictly after issued_date. Certificate is valid iff current_utc <= expires_dateT23:59:59Z end-of-day (inclusive)" }
      - { name: status, type: enum, source: system, description: "UNVERIFIED -> VERIFIED -> EXPIRED (auto); UNVERIFIED -> EXPIRED (auto) when clock passes expires_date" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the SafetyInspector who verified; null while UNVERIFIED" }

  - name: Subcontractor
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; jobsite the sub is engaged on" }
      - { name: company_name, type: string, source: input, description: "Subcontractor company name" }
      - { name: trade, type: string, source: input, description: "Trade (e.g., electrical, excavation)" }
      - { name: standing, type: enum, source: system, description: "GOOD_STANDING -> PROBATION -> REMOVED; PROBATION -> GOOD_STANDING (restore cycle); REMOVED is terminal" }
      - { name: compliance_score_realtime, type: integer, source: computed, description: "Realtime variant of subcontractor_compliance_score (open deficiencies only, overdue doubling); 0..100", default: 100 }
      - { name: compliance_score_period_90d, type: integer, source: computed, description: "Period variant of subcontractor_compliance_score (all deficiencies/incidents in trailing 90 days, no doubling); 0..100", default: 100 }

  - name: Huddle
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: huddle_date, type: string, source: input, description: "ISO date of the daily huddle (YYYY-MM-DD); unique per project" }
      - { name: topics, type: string, source: input, description: "Topics covered / tasks previewed" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> CONDUCTED; SCHEDULED -> MISSED (auto when current_utc > huddle_date + 1 day)" }
      - { name: attendee_worker_ids, type: array, source: system, description: "Worker ids recorded at conduct time", default: [] }
      - { name: conducted_at, type: datetime, source: system, description: "Timestamp huddle was conducted; null while SCHEDULED/MISSED" }

  - name: JobHazardAnalysis
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: huddle_id, type: string, source: input, description: "FK -> Huddle.id; huddle at which this task's hazards were reviewed" }
      - { name: task_description, type: string, source: input, description: "Task being analyzed" }
      - { name: hazards, type: string, source: input, description: "Identified hazards" }
      - { name: controls, type: string, source: input, description: "Control measures" }
      - { name: status, type: enum, source: system, description: "DRAFT -> APPROVED -> RE_REVIEW_REQUIRED -> APPROVED (cycle); RE_REVIEW_REQUIRED is set by permit-suspension cascades" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: inspection_type, type: enum, source: input, description: "DAILY | WEEKLY | QUARTERLY_REGULATORY" }
      - { name: due_date, type: datetime, source: input, description: "When the inspection must be completed by" }
      - { name: status, type: enum, source: system, description: "DUE -> COMPLETED; DUE -> OVERDUE (auto when current_utc > due_date); OVERDUE -> COMPLETED (late completion allowed)" }
      - { name: completed_at, type: datetime, source: system, description: "Completion timestamp; null until COMPLETED" }
      - { name: findings_summary, type: string, source: system, description: "Recorded at completion", default: "" }

  - name: Deficiency
    parent: null
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; inspection during which the deficiency was found" }
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; denormalized from the parent Inspection at creation" }
      - { name: description, type: string, source: input, description: "Deficiency description" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL | IMMINENT_DANGER" }
      - { name: assigned_subcontractor_id, type: string, source: input, description: "FK -> Subcontractor.id; subcontractor responsible for correction; null means general contractor self-perform", default: null }
      - { name: due_at, type: datetime, source: computed, description: "created_at + severity SLA (MINOR 14d, MAJOR 7d, CRITICAL 3d, IMMINENT_DANGER 0d = due immediately)" }
      - { name: status, type: enum, source: system, description: "OPEN -> CORRECTION_SUBMITTED -> VERIFIED_CLOSED; CORRECTION_SUBMITTED -> OPEN on verify REJECTED (cycle); OPEN -> OVERDUE (auto when current_utc > due_at, strictly greater); OVERDUE -> CORRECTION_SUBMITTED" }
      - { name: correction_notes, type: string, source: system, description: "Notes from latest submit-correction", default: "" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creating SafetyInspector (segregation-of-duties anchor)" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of verifying SafetyInspector; must differ from created_by_user_id" }
      - { name: closed_disposition, type: enum, source: system, description: "CONFIRMED | NOT_SUB_FAULT; null until VERIFIED_CLOSED; NOT_SUB_FAULT refunds the subcontractor score deduction", default: null }

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id; injured/involved worker; null for pure property damage", default: null }
      - { name: incident_type, type: enum, source: input, description: "INJURY | ILLNESS | NEAR_MISS | PROPERTY_DAMAGE" }
      - { name: severity, type: enum, source: input, description: "MINOR | SERIOUS | CRITICAL | FATALITY" }
      - { name: occurred_at, type: datetime, source: input, description: "When the incident occurred" }
      - { name: work_related, type: boolean, source: input, description: "OSHA work-relatedness flag" }
      - { name: description, type: string, source: input, description: "Incident description" }
      - { name: status, type: enum, source: system, description: "REPORTED -> UNDER_INVESTIGATION -> DETERMINATION_MADE -> CLOSED" }
      - { name: investigator_user_id, type: string, source: system, description: "X-User-ID of SafetyInspector who opened the investigation; determination must be by a different user (segregation of duties)" }
      - { name: investigation_notes, type: string, source: system, description: "Recorded at investigate", default: "" }
      - { name: medical_treatment_beyond_first_aid, type: boolean, source: input, description: "Determination flag (OSHA recordability)", default: false }
      - { name: days_away_from_work, type: integer, source: input, description: "Determination flag; calendar days away, >= 0", default: 0 }
      - { name: restricted_duty, type: boolean, source: input, description: "Determination flag", default: false }
      - { name: loss_of_consciousness, type: boolean, source: input, description: "Determination flag", default: false }
      - { name: significant_diagnosis, type: boolean, source: input, description: "Determination flag", default: false }
      - { name: is_osha_recordable, type: boolean, source: computed, description: "work_related AND (medical_treatment_beyond_first_aid OR days_away_from_work > 0 OR restricted_duty OR loss_of_consciousness OR significant_diagnosis); null until DETERMINATION_MADE" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: jha_id, type: string, source: input, description: "FK -> JobHazardAnalysis.id; the JHA covering this permitted task" }
      - { name: permit_type, type: enum, source: input, description: "FALL_PROTECTION | EXCAVATION | HOT_WORK" }
      - { name: work_start, type: datetime, source: input, description: "Window start; must be strictly before work_end" }
      - { name: work_end, type: datetime, source: input, description: "Window end" }
      - { name: authorized_worker_ids, type: array, source: input, description: "Worker ids authorized on this permit's crew; each must be CLEARED at create/issue/reinstate" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> ISSUED -> CLOSED; ISSUED -> SUSPENDED -> ISSUED (cycle); REQUESTED|ISSUED|SUSPENDED -> EXPIRED (auto when current_utc > work_end)" }
      - { name: suspension_reason, type: string, source: system, description: "Reason recorded on most recent suspension (manual or cascade)", default: "" }

  - name: DrugTestRecord
    parent: null
    common_fields: true
    fields:
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id; tested worker" }
      - { name: test_type, type: enum, source: input, description: "PRE_EMPLOYMENT | RANDOM | POST_INCIDENT" }
      - { name: incident_id, type: string, source: input, description: "FK -> Incident.id; required iff test_type == POST_INCIDENT, must be null otherwise", default: null }
      - { name: collected_at, type: datetime, source: input, description: "Specimen collection timestamp; POST_INCIDENT requires occurred_at <= collected_at <= occurred_at + 32h (inclusive both ends)" }
      - { name: status, type: enum, source: system, description: "PENDING_RESULT -> NEGATIVE | POSITIVE (branching fork)" }
      - { name: window_compliant, type: boolean, source: computed, description: "For POST_INCIDENT: whether collected_at fell inside the 32h window; null for other test types", default: null }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SafetyPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /safety/safety-plans/{planId}/activate
        actor: SafetyManager
        preconditions:
          - "Plan status == DRAFT (else ERR_PLAN_NOT_DRAFT)"
          - "Request body expected_project_version == Project.version (OCC; else ERR_STALE_VERSION 412)"
        side_effects:
          - "Project.current_active_plan_id := this plan id; Project.version increments by 1"
          - "Any other SafetyPlan of the same project with status ACTIVE -> SUPERSEDED"
          - "activated_at := current_utc"
        note: "Activating a new revision legitimately supersedes the prior ACTIVE plan — the OCC rule on Project.version is the sanctioned conflict mechanism."

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when another SafetyPlan of the same project is activated)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Worker
    initial_state: PENDING_ORIENTATION
    terminal_states: [REMOVED]
    transitions:
      - from: PENDING_ORIENTATION
        to: ORIENTED
        trigger: POST /safety/workers/{workerId}/complete-orientation
        actor: SiteSuperintendent
        preconditions:
          - "Worker status == PENDING_ORIENTATION (else ERR_WORKER_INVALID_STATE)"
          - "Worker's project has a SafetyPlan with status == ACTIVE (else ERR_NO_ACTIVE_SAFETY_PLAN)"
        side_effects:
          - "orientation_completed_at := current_utc"

      - from: ORIENTED
        to: CLEARED
        trigger: POST /safety/workers/{workerId}/clear
        actor: SiteSuperintendent
        preconditions:
          - "Worker status == ORIENTED (else ERR_WORKER_INVALID_STATE)"
          - "Training requirement: is_supervisor == true requires a VERIFIED non-EXPIRED OSHA_30 certificate; is_supervisor == false requires a VERIFIED non-EXPIRED OSHA_10 or OSHA_30 certificate (else ERR_TRAINING_REQUIREMENT_NOT_MET 422)"
          - "If employer_type == SUBCONTRACTOR: linked Subcontractor.standing == GOOD_STANDING (else ERR_SUBCONTRACTOR_NOT_IN_GOOD_STANDING)"
          - "Project.safety_posture != FROZEN (else ERR_PROJECT_POSTURE_BLOCKED)"
        side_effects: []

      - from: ORIENTED
        to: SUSPENDED
        trigger: POST /safety/workers/{workerId}/suspend
        actor: SafetyManager
        preconditions:
          - "Worker status == ORIENTED (else ERR_WORKER_INVALID_STATE)"
        side_effects:
          - "suspension_reason := request reason"

      - from: CLEARED
        to: SUSPENDED
        trigger: POST /safety/workers/{workerId}/suspend OR system (automatic when a DrugTestRecord for this worker records POSITIVE, or when the worker's Subcontractor is removed — removal goes straight to REMOVED)"
        actor: SafetyManager | system
        preconditions:
          - "Worker status == CLEARED (else ERR_WORKER_INVALID_STATE)"
        side_effects:
          - "suspension_reason := reason (manual) or 'POSITIVE_DRUG_TEST' (system)"
          - "Cascade link 2: every Permit with status == ISSUED whose authorized_worker_ids contains this worker -> SUSPENDED with suspension_reason 'CREW_MEMBER_SUSPENDED'"
          - "Cascade link 3: each Permit so suspended causes its linked JobHazardAnalysis (if APPROVED) -> RE_REVIEW_REQUIRED"

      - from: SUSPENDED
        to: ORIENTED
        trigger: POST /safety/workers/{workerId}/reinstate
        actor: SafetyManager
        preconditions:
          - "Worker status == SUSPENDED (else ERR_WORKER_INVALID_STATE)"
          - "If employer_type == SUBCONTRACTOR: linked Subcontractor.standing != REMOVED (else ERR_SUBCONTRACTOR_NOT_IN_GOOD_STANDING)"
        side_effects:
          - "suspension_reason := ''"
          - "Worker returns to ORIENTED (must re-clear via training check)"

      - from: CLEARED
        to: REMOVED
        trigger: "system (automatic when the worker's Subcontractor transitions to REMOVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 2: every Permit with status == ISSUED whose authorized_worker_ids contains this worker -> SUSPENDED with suspension_reason 'CREW_MEMBER_REMOVED'"
          - "Cascade link 3: each Permit so suspended causes its linked JobHazardAnalysis (if APPROVED) -> RE_REVIEW_REQUIRED"

      - from: ORIENTED
        to: REMOVED
        trigger: "system (automatic when the worker's Subcontractor transitions to REMOVED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TrainingCertificate
    initial_state: UNVERIFIED
    terminal_states: [EXPIRED]
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: POST /safety/training-certificates/{certificateId}/verify
        actor: SafetyInspector
        preconditions:
          - "Certificate status == UNVERIFIED (else ERR_CERTIFICATE_INVALID_STATE)"
          - "current_utc <= expires_date end-of-day (else ERR_CERTIFICATE_EXPIRED)"
        side_effects:
          - "verified_by_user_id := X-User-ID"

      - from: UNVERIFIED
        to: EXPIRED
        trigger: "system (automatic on clock sweep when current_utc > expires_date end-of-day)"
        actor: system
        preconditions: []
        side_effects: []

      - from: VERIFIED
        to: EXPIRED
        trigger: "system (automatic on clock sweep when current_utc > expires_date end-of-day)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Subcontractor
    initial_state: GOOD_STANDING
    terminal_states: [REMOVED]
    transitions:
      - from: GOOD_STANDING
        to: PROBATION
        trigger: POST /safety/subcontractors/{subcontractorId}/probation-review with action DEMOTE
        actor: SafetyManager
        preconditions:
          - "Standing == GOOD_STANDING (else ERR_SUBCONTRACTOR_INVALID_STANDING)"
          - "compliance_score_realtime < 80 (else ERR_SCORE_THRESHOLD_NOT_MET; exactly 80 does NOT qualify — strict less-than)"
        side_effects: []

      - from: PROBATION
        to: GOOD_STANDING
        trigger: POST /safety/subcontractors/{subcontractorId}/probation-review with action RESTORE
        actor: SafetyManager
        preconditions:
          - "Standing == PROBATION (else ERR_SUBCONTRACTOR_INVALID_STANDING)"
          - "compliance_score_realtime >= 80 (else ERR_SCORE_THRESHOLD_NOT_MET; exactly 80 qualifies — inclusive)"
        side_effects: []

      - from: PROBATION
        to: REMOVED
        trigger: POST /safety/subcontractors/{subcontractorId}/remove
        actor: SafetyManager
        preconditions:
          - "Standing == PROBATION (else ERR_SUBCONTRACTOR_INVALID_STANDING)"
        side_effects:
          - "Cascade link 1: every Worker with subcontractor_id == this sub and status IN {ORIENTED, CLEARED} -> REMOVED"
          - "Cascade link 2 (via worker removal): every Permit ISSUED listing a removed worker -> SUSPENDED ('CREW_MEMBER_REMOVED')"
          - "Cascade link 3 (via permit suspension): linked JobHazardAnalysis (if APPROVED) -> RE_REVIEW_REQUIRED"
          - "Deficiencies assigned to this sub keep assigned_subcontractor_id and remain open (posture unaffected)"

  - entity: Huddle
    initial_state: SCHEDULED
    terminal_states: [CONDUCTED, MISSED]
    transitions:
      - from: SCHEDULED
        to: CONDUCTED
        trigger: POST /safety/huddles/{huddleId}/conduct
        actor: SiteSuperintendent
        preconditions:
          - "Huddle status == SCHEDULED (else ERR_HUDDLE_INVALID_STATE)"
          - "Every id in attendee_worker_ids is a Worker of this project with status IN {ORIENTED, CLEARED} (else ERR_WORKER_NOT_CLEARED)"
        side_effects:
          - "conducted_at := current_utc; attendee_worker_ids := request list"

      - from: SCHEDULED
        to: MISSED
        trigger: "system (automatic on clock sweep when current_utc > huddle_date + 1 day, i.e. the date has fully elapsed)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: JobHazardAnalysis
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: POST /safety/jhas/{jhaId}/approve
        actor: SafetyManager
        preconditions:
          - "JHA status == DRAFT (else ERR_JHA_INVALID_STATE)"
          - "Linked Huddle.status == CONDUCTED (else ERR_HUDDLE_NOT_CONDUCTED)"
        side_effects: []

      - from: RE_REVIEW_REQUIRED
        to: APPROVED
        trigger: POST /safety/jhas/{jhaId}/approve
        actor: SafetyManager
        preconditions:
          - "JHA status == RE_REVIEW_REQUIRED (else ERR_JHA_INVALID_STATE)"
          - "Linked Huddle.status == CONDUCTED (else ERR_HUDDLE_NOT_CONDUCTED)"
        side_effects: []

      - from: APPROVED
        to: RE_REVIEW_REQUIRED
        trigger: "system (automatic whenever any Permit referencing this JHA transitions ISSUED -> SUSPENDED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "This is cascade link 3 of the incident-freeze, drug-test, and subcontractor-removal cascades."

  - entity: Inspection
    initial_state: DUE
    terminal_states: [COMPLETED]
    transitions:
      - from: DUE
        to: COMPLETED
        trigger: POST /safety/inspections/{inspectionId}/complete
        actor: SafetyInspector
        preconditions:
          - "Inspection status == DUE (else ERR_INSPECTION_INVALID_STATE)"
        side_effects:
          - "completed_at := current_utc; findings_summary := request value"

      - from: DUE
        to: OVERDUE
        trigger: "system (automatic on clock sweep when current_utc > due_date, strictly greater)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OVERDUE
        to: COMPLETED
        trigger: POST /safety/inspections/{inspectionId}/complete
        actor: SafetyInspector
        preconditions:
          - "Inspection status == OVERDUE (else ERR_INSPECTION_INVALID_STATE)"
        side_effects:
          - "completed_at := current_utc; findings_summary := request value"

  - entity: Deficiency
    initial_state: OPEN
    terminal_states: [VERIFIED_CLOSED]
    transitions:
      - from: OPEN
        to: CORRECTION_SUBMITTED
        trigger: POST /safety/deficiencies/{deficiencyId}/submit-correction
        actor: SiteSuperintendent | SubcontractorRep
        preconditions:
          - "Deficiency status == OPEN (else ERR_DEFICIENCY_INVALID_STATE)"
          - "If actor is SubcontractorRep: X-User-ID == assigned_subcontractor_id (else ERR_INSUFFICIENT_PERMISSIONS 403)"
        side_effects:
          - "correction_notes := request value"
          - "Posture is NOT recomputed on submission (deficiency still counts as open)"

      - from: OVERDUE
        to: CORRECTION_SUBMITTED
        trigger: POST /safety/deficiencies/{deficiencyId}/submit-correction
        actor: SiteSuperintendent | SubcontractorRep
        preconditions:
          - "Deficiency status == OVERDUE (else ERR_DEFICIENCY_INVALID_STATE)"
          - "If actor is SubcontractorRep: X-User-ID == assigned_subcontractor_id (else ERR_INSUFFICIENT_PERMISSIONS 403)"
        side_effects:
          - "correction_notes := request value"
          - "Posture recompute: deficiency leaves the OVERDUE bucket, so a RESTRICTED posture caused by it may lift"

      - from: CORRECTION_SUBMITTED
        to: VERIFIED_CLOSED
        trigger: POST /safety/deficiencies/{deficiencyId}/verify with outcome CLOSED
        actor: SafetyInspector
        preconditions:
          - "Deficiency status == CORRECTION_SUBMITTED (else ERR_DEFICIENCY_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES_VIOLATION 403)"
        side_effects:
          - "verified_by_user_id := X-User-ID; closed_disposition := request disposition (CONFIRMED | NOT_SUB_FAULT)"
          - "If assigned_subcontractor_id set AND disposition == NOT_SUB_FAULT: refund the severity deduction to Subcontractor.compliance_score_realtime AND compliance_score_period_90d (score returns toward pre-creation value)"
          - "Project.open_deficiency_count decrements; Project.version increments"
          - "Project posture recompute"

      - from: CORRECTION_SUBMITTED
        to: OPEN
        trigger: POST /safety/deficiencies/{deficiencyId}/verify with outcome REJECTED
        actor: SafetyInspector
        preconditions:
          - "Deficiency status == CORRECTION_SUBMITTED (else ERR_DEFICIENCY_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES_VIOLATION 403)"
        side_effects:
          - "verified_by_user_id := null; correction_notes retained"
          - "Cascade link 1: if current_utc > due_at at rejection time the deficiency immediately re-flips OPEN -> OVERDUE (severity deduction doubles in compliance_score_realtime)"
          - "Cascade link 2: the OVERDUE flip triggers Project posture recompute (a MAJOR/CRITICAL overdue sets RESTRICTED)"

      - from: OPEN
        to: OVERDUE
        trigger: "system (automatic on clock sweep when current_utc > due_at, strictly greater; at current_utc == due_at the deficiency remains OPEN)"
        actor: system
        preconditions: []
        side_effects:
          - "Project posture recompute"
          - "If assigned_subcontractor_id set: compliance_score_realtime deduction for this deficiency doubles (see subcontractor_compliance_score)"

  - entity: Incident
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: UNDER_INVESTIGATION
        trigger: POST /safety/incidents/{incidentId}/investigate
        actor: SafetyInspector
        preconditions:
          - "Incident status == REPORTED (else ERR_INCIDENT_INVALID_STATE)"
        side_effects:
          - "investigator_user_id := X-User-ID; investigation_notes := request value"

      - from: UNDER_INVESTIGATION
        to: DETERMINATION_MADE
        trigger: POST /safety/incidents/{incidentId}/determination
        actor: SafetyManager
        preconditions:
          - "Incident status == UNDER_INVESTIGATION (else ERR_INCIDENT_INVALID_STATE)"
          - "X-User-ID != investigator_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES_VIOLATION 403)"
        side_effects:
          - "Determination flags stored from request"
          - "is_osha_recordable computed per osha_recordability calculation"

      - from: DETERMINATION_MADE
        to: CLOSED
        trigger: POST /safety/incidents/{incidentId}/close
        actor: SafetyManager
        preconditions:
          - "Incident status == DETERMINATION_MADE (else ERR_INCIDENT_INVALID_STATE)"
          - "If is_osha_recordable == true AND worker_id is not null: a DrugTestRecord exists with incident_id == this incident, test_type == POST_INCIDENT, status IN {NEGATIVE, POSITIVE} (else ERR_DRUG_TEST_REQUIRED)"
        side_effects:
          - "Project posture recompute (closing a CRITICAL/FATALITY incident lifts its FROZEN contribution); SUSPENDED permits remain SUSPENDED (manual reinstate only)"

  - entity: Permit
    initial_state: REQUESTED
    terminal_states: [CLOSED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: POST /safety/permits/{permitId}/issue
        actor: SafetyManager
        preconditions:
          - "Permit status == REQUESTED (else ERR_PERMIT_INVALID_STATE)"
          - "Project.safety_posture == NORMAL (else ERR_PROJECT_POSTURE_BLOCKED)"
          - "Linked JobHazardAnalysis.status == APPROVED (else ERR_JHA_NOT_APPROVED)"
          - "Temporal conflict rules re-evaluated (excavation overlap, hot-work buffer, crew closed-interval) against current data (else ERR_PERMIT_TIME_CONFLICT)"
          - "Every authorized_worker_ids worker status == CLEARED (else ERR_WORKER_NOT_CLEARED)"
        side_effects:
          - "Project.issued_permit_count increments; Project.version increments"

      - from: ISSUED
        to: CLOSED
        trigger: POST /safety/permits/{permitId}/close
        actor: SiteSuperintendent
        preconditions:
          - "Permit status == ISSUED (else ERR_PERMIT_INVALID_STATE)"
        side_effects:
          - "Project.issued_permit_count decrements; Project.version increments"

      - from: ISSUED
        to: SUSPENDED
        trigger: "system (automatic cascade: CRITICAL/FATALITY incident freezes posture -> all ISSUED permits suspend; crew-member suspension/removal; or IMMINENT_DANGER deficiency freeze)"
        actor: system
        preconditions: []
        side_effects:
          - "suspension_reason := cascade cause ('POSTURE_FROZEN' | 'CREW_MEMBER_SUSPENDED' | 'CREW_MEMBER_REMOVED')"
          - "Project.issued_permit_count decrements; Project.version increments"
          - "Cascade link 3: linked JobHazardAnalysis (if APPROVED) -> RE_REVIEW_REQUIRED"

      - from: SUSPENDED
        to: ISSUED
        trigger: POST /safety/permits/{permitId}/reinstate
        actor: SafetyManager
        preconditions:
          - "Permit status == SUSPENDED (else ERR_PERMIT_INVALID_STATE)"
          - "Project.safety_posture == NORMAL (else ERR_PROJECT_POSTURE_BLOCKED)"
          - "Linked JobHazardAnalysis.status == APPROVED (else ERR_JHA_NOT_APPROVED)"
          - "Temporal conflict rules re-evaluated (else ERR_PERMIT_TIME_CONFLICT)"
          - "Every authorized_worker_ids worker status == CLEARED (else ERR_WORKER_NOT_CLEARED)"
        side_effects:
          - "suspension_reason := ''"
          - "Project.issued_permit_count increments; Project.version increments"

      - from: REQUESTED
        to: EXPIRED
        trigger: "system (automatic on clock sweep when current_utc > work_end)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ISSUED
        to: EXPIRED
        trigger: "system (automatic on clock sweep when current_utc > work_end)"
        actor: system
        preconditions: []
        side_effects:
          - "Project.issued_permit_count decrements; Project.version increments"

      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (automatic on clock sweep when current_utc > work_end)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DrugTestRecord
    initial_state: PENDING_RESULT
    terminal_states: [NEGATIVE, POSITIVE]
    transitions:
      - from: PENDING_RESULT
        to: NEGATIVE
        trigger: POST /safety/drug-tests/{drugTestId}/record-result with result NEGATIVE
        actor: SafetyManager
        preconditions:
          - "Record status == PENDING_RESULT (else ERR_DRUG_TEST_INVALID_STATE)"
        side_effects: []

      - from: PENDING_RESULT
        to: POSITIVE
        trigger: POST /safety/drug-tests/{drugTestId}/record-result with result POSITIVE
        actor: SafetyManager
        preconditions:
          - "Record status == PENDING_RESULT (else ERR_DRUG_TEST_INVALID_STATE)"
        side_effects:
          - "Cascade link 1: Worker -> SUSPENDED with suspension_reason 'POSITIVE_DRUG_TEST' (from ORIENTED or CLEARED)"
          - "Cascade link 2 (via worker suspension): every ISSUED Permit listing the worker -> SUSPENDED ('CREW_MEMBER_SUSPENDED')"
          - "Cascade link 3 (via permit suspension): linked JobHazardAnalysis (if APPROVED) -> RE_REVIEW_REQUIRED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: safety-plan-activate-stale-project
    parent_entity: Project
    write_endpoint: "POST /safety/safety-plans/{planId}/activate"
    occ_field: "expected_project_version"
    description: |
      Activating a SafetyPlan supersedes whichever plan is currently ACTIVE and
      rewrites Project.current_active_plan_id. If the Project.version the client
      last observed has advanced (e.g., another plan was just activated against
      it, which is a legitimate supersede under the plan lifecycle), the
      activation is rejected as stale rather than silently double-superseding.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: deficiency_due_at
    trigger: "Deficiency creation (POST /safety/deficiencies)"
    algorithm: threshold
    formula: |
      due_at = created_at + SLA[severity]
      SLA = { MINOR: 14 days, MAJOR: 7 days, CRITICAL: 3 days, IMMINENT_DANGER: 0 days }
      IMMINENT_DANGER is therefore due AT creation (due_at == created_at);
      the strictly-greater overdue rule means it flips to OVERDUE on the first
      clock advance past created_at.
    input_set: "the single Deficiency being created"
    constants:
      SLA_MINOR_DAYS: 14
      SLA_MAJOR_DAYS: 7
      SLA_CRITICAL_DAYS: 3
      SLA_IMMINENT_DANGER_DAYS: 0
    precision: "second-precision timestamps; no rounding"

  - name: subcontractor_compliance_score
    trigger: "Recomputed on: Deficiency create (assigned to sub), Deficiency OVERDUE flip, Deficiency verify-close, Incident determination (recordable, worker belongs to sub), and on every read of the Subcontractor"
    algorithm: weighted_scoring
    formula: |
      score = 100
      for each Deficiency d in the variant's input set:
        deduct SEVERITY_DEDUCTION[d.severity]            # MINOR 5, MAJOR 15, CRITICAL 30, IMMINENT_DANGER 50
        if variant == realtime AND d.status == OVERDUE: deduct SEVERITY_DEDUCTION[d.severity] again   # overdue doubling
      for each Incident i in the variant's input set:
        deduct RECORDABLE_INCIDENT_DEDUCTION              # 25
      score = max(0, min(100, score))
      Standing thresholds (consumed by probation-review, NOT part of the score):
        DEMOTE to PROBATION requires realtime < 80 (strict)
        RESTORE to GOOD_STANDING requires realtime >= 80 (inclusive)
    input_set: |
      realtime variant: Deficiencies with assigned_subcontractor_id == sub AND status IN {OPEN, OVERDUE, CORRECTION_SUBMITTED}
                        (VERIFIED_CLOSED deficiencies contribute 0 unless closed_disposition == CONFIRMED — CONFIRMED closures
                        keep their deduction in period_90d only; realtime drops them entirely);
                        Incidents with is_osha_recordable == true AND status IN {DETERMINATION_MADE, CLOSED} AND
                        worker_id references a Worker with subcontractor_id == sub.
      period_90d variant: Deficiencies with assigned_subcontractor_id == sub AND created_at IN [current_utc - 90 days, current_utc]
                        regardless of current status, EXCEPT those VERIFIED_CLOSED with closed_disposition == NOT_SUB_FAULT
                        (refunded); no overdue doubling. Incidents as above but with occurred_at IN [current_utc - 90 days, current_utc].
    constants:
      BASE: 100
      SEVERITY_DEDUCTION: { MINOR: 5, MAJOR: 15, CRITICAL: 30, IMMINENT_DANGER: 50 }
      RECORDABLE_INCIDENT_DEDUCTION: 25
      DEMOTE_THRESHOLD: 80
    precision: "integer arithmetic; floor 0, cap 100"
    variants:
      - name: realtime
        when: "standing decisions (probation-review), worker clearance standing checks, removal authority"
        difference: "Only currently-open deficiencies count (status IN {OPEN, OVERDUE, CORRECTION_SUBMITTED}); OVERDUE doubles the severity deduction; VERIFIED_CLOSED deficiencies always contribute 0."
      - name: period_90d
        when: "quarterly compliance review / trending read on GET /safety/subcontractors/{id}"
        difference: "Every deficiency created within trailing 90 days counts (even if VERIFIED_CLOSED with disposition CONFIRMED); no overdue doubling; NOT_SUB_FAULT closures are refunded."

  - name: osha_recordability
    trigger: "POST /safety/incidents/{incidentId}/determination"
    algorithm: threshold
    formula: |
      is_osha_recordable = work_related AND (
        medical_treatment_beyond_first_aid
        OR days_away_from_work > 0
        OR restricted_duty
        OR loss_of_consciousness
        OR significant_diagnosis
      )
      is_dart = is_osha_recordable AND (days_away_from_work > 0 OR restricted_duty)
    input_set: "the single Incident under determination"
    constants: {}
    precision: "boolean; days_away_from_work compared with strict > 0"
    note: "A work-related NEAR_MISS with all flags false is NOT recordable. is_osha_recordable is null until DETERMINATION_MADE."

  - name: osha_incident_rates
    trigger: "GET /safety/projects/{projectId}/osha-summary"
    algorithm: aggregation
    formula: |
      Let Y = requested year. Incident set = Incidents of this project with occurred_at within calendar year Y.
      recordable_count_final       = |{ i : i.status IN {DETERMINATION_MADE, CLOSED} AND i.is_osha_recordable == true }|
      recordable_count_provisional = recordable_count_final + |{ i : i.status IN {REPORTED, UNDER_INVESTIGATION} }|   # worst case
      dart_count_final             = |{ i in recordable final set : i.days_away_from_work > 0 OR i.restricted_duty }|
      dart_count_provisional       = dart_count_final + |{ i : i.status IN {REPORTED, UNDER_INVESTIGATION} }|
      hours = project.annual_hours_worked
      # PINNED ROUNDING ORDER (mode b): each rate is rounded FIRST; spreads are computed FROM THE ROUNDED rates.
      trir_final        = round_half_up(recordable_count_final * 200000 / hours, 1)
      dart_rate_final   = round_half_up(dart_count_final * 200000 / hours, 1)
      rate_spread_final = round_half_up(trir_final, 1) - round_half_up(dart_rate_final, 1)   # i.e. trir_final - dart_rate_final, NOT round((recordable-dart)*200000/hours, 1)
      trir_provisional  = round_half_up(recordable_count_provisional * 200000 / hours, 1)
      dart_rate_provisional = round_half_up(dart_count_provisional * 200000 / hours, 1)
    input_set: "Incidents of the project filtered by occurred_at calendar year; final counts exclude REPORTED/UNDER_INVESTIGATION; provisional counts include them as worst-case recordable AND worst-case DART"
    constants:
      OSHA_BASE_HOURS: 200000
    precision: "1 decimal place, round_half_up; spread derived from rounded components"
    variants:
      - name: final
        when: "regulatory reporting posture — only determined recordables"
        difference: "counts only Incidents in {DETERMINATION_MADE, CLOSED} with is_osha_recordable == true"
      - name: provisional
        when: "internal worst-case exposure view while investigations are open"
        difference: "adds REPORTED and UNDER_INVESTIGATION incidents to both recordable and DART counts"

  - name: project_posture
    trigger: "Recomputed on: Deficiency create, every Deficiency status change (including clock-sweep OVERDUE flips), Incident create, Incident close, and after every clock sweep"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED to break the apparent cycle posture<->permits:
      # (1) sweep auto-transitions first (overdue flips, expiries); (2) compute posture from the
      #     resulting deficiency/incident sets ONLY (posture never reads permit states);
      # (3) apply posture gates/cascades to permits afterwards. Permits therefore never
      #     influence posture and no fixed-point iteration is needed.
      if EXISTS Deficiency d: d.project_id == P AND d.severity == IMMINENT_DANGER AND d.status IN {OPEN, OVERDUE}
         OR EXISTS Incident i: i.project_id == P AND i.severity IN {CRITICAL, FATALITY} AND i.status IN {REPORTED, UNDER_INVESTIGATION, DETERMINATION_MADE}:
        posture = FROZEN
      elif COUNT(Deficiency d: d.project_id == P AND d.status == OVERDUE AND d.severity IN {MAJOR, CRITICAL}) >= 1
         OR COUNT(Deficiency d: d.project_id == P AND d.status == OVERDUE) >= 3:
        posture = RESTRICTED
      else:
        posture = NORMAL
      On a transition INTO FROZEN: every Permit of P with status == ISSUED -> SUSPENDED ('POSTURE_FROZEN'),
      and each such suspension cascades to its JHA (APPROVED -> RE_REVIEW_REQUIRED).
      On a transition OUT of FROZEN: no automatic permit reinstatement (manual reinstate only).
    input_set: "all Deficiencies and Incidents of the project in the statuses enumerated above; permits are outputs, never inputs"
    constants:
      RESTRICTED_OVERDUE_COUNT: 3
    precision: "exact set membership; no rounding"

  - name: permit_conflict_check
    trigger: "POST /safety/permits (create), POST /safety/permits/{id}/issue, POST /safety/permits/{id}/reinstate"
    algorithm: interval_merge
    formula: |
      Three independent interval rules; first failure raises ERR_PERMIT_TIME_CONFLICT (409).
      (1) EXCAVATION project rule (HALF-OPEN [start, end) semantics):
          for each other Permit o with o.project_id == P, o.permit_type == EXCAVATION,
          o.status IN {REQUESTED, ISSUED, SUSPENDED}:
            conflict iff new.work_start < o.work_end AND o.work_start < new.work_end
          => back-to-back adjacency (new.work_start == o.work_end) is ALLOWED.
      (2) HOT_WORK buffer rule (BUFFER-GAP semantics):
          for each other Permit o with o.project_id == P, o.permit_type == HOT_WORK,
          o.status IN {REQUESTED, ISSUED, SUSPENDED}:
            conflict iff NOT (new.work_start >= o.work_end + 60 minutes OR new.work_end + 60 minutes <= o.work_start)
          => a gap of exactly 60 minutes is ALLOWED (>=), 59 minutes is a CONFLICT.
      (3) Crew rule (CLOSED-INTERVAL [start, end] semantics, resource = Worker):
          for each worker w in new.authorized_worker_ids,
          for each other Permit o with w IN o.authorized_worker_ids AND o.status IN {ISSUED, SUSPENDED}:
            conflict iff new.work_start <= o.work_end AND o.work_start <= new.work_end   (inclusive both ends)
          => touching endpoints (new.work_start == o.work_end) CONFLICT for crew, unlike rule (1).
          Crew conflicts consider only {ISSUED, SUSPENDED} permits (committed work); REQUESTED permits do not block crews.
    input_set: "Permits of the same project in the status sets enumerated per rule; Workers named in authorized_worker_ids"
    constants:
      HOT_WORK_BUFFER_MINUTES: 60
    precision: "second-precision timestamps"

  - name: drug_test_window_compliance
    trigger: "POST /safety/drug-tests when test_type == POST_INCIDENT"
    algorithm: threshold
    formula: |
      window_open  = incident.occurred_at
      window_close = incident.occurred_at + 32 hours
      compliant    = (window_open <= collected_at) AND (collected_at <= window_close)   # BOTH bounds inclusive
      if not compliant: reject with ERR_DRUG_TEST_WINDOW_VIOLATION (422); the record is never persisted.
      window_compliant field is therefore always true on persisted POST_INCIDENT records.
      Also requires: if incident.worker_id is not null, request worker_id MUST equal incident.worker_id
      (else ERR_INVALID_REQUEST 400, checked earlier at priority 4).
    input_set: "the single DrugTestRecord being created plus its linked Incident"
    constants:
      POST_INCIDENT_WINDOW_HOURS: 32
    precision: "second-precision; boundary at exactly occurred_at + 32h is compliant"

  - name: training_clearance_check
    trigger: "POST /safety/workers/{workerId}/clear"
    algorithm: threshold
    formula: |
      candidate certs = TrainingCertificates with worker_id == W AND status == VERIFIED
                        AND current_utc <= expires_date end-of-day (inclusive expiry date = still valid that day)
      if W.is_supervisor: pass iff any candidate has cert_type == OSHA_30
      else:               pass iff any candidate has cert_type IN {OSHA_10, OSHA_30}
      failure -> ERR_TRAINING_REQUIREMENT_NOT_MET (422)
    input_set: "VERIFIED, non-expired TrainingCertificates of the worker"
    constants: {}
    precision: "date comparison at day granularity (expires_date treated as end-of-day UTC)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and non-empty; X-User-Role must be one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The role in X-User-Role must be listed in the endpoint's roles; for SubcontractorRep on submit-correction, X-User-ID must additionally equal the Deficiency's assigned_subcontractor_id"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id in the path must exist (validated left-to-right); every FK id in the body (project_id, worker_id, subcontractor_id, huddle_id, inspection_id, jha_id, incident_id, assigned_subcontractor_id, ids inside authorized_worker_ids / attendee_worker_ids) must exist and belong to the same Project as the parent context"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_PROJECT_NOT_FOUND, ERR_SAFETY_PLAN_NOT_FOUND, ERR_WORKER_NOT_FOUND, ERR_CERTIFICATE_NOT_FOUND, ERR_SUBCONTRACTOR_NOT_FOUND, ERR_HUDDLE_NOT_FOUND, ERR_JHA_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_DEFICIENCY_NOT_FOUND, ERR_INCIDENT_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_DRUG_TEST_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with path ids or body FKs"
    note: "Cross-project references (e.g., a huddle_id belonging to another project) are treated as NOT_FOUND."

  - priority: 4
    category: existence
    check: "Request shape: all required fields present, types match, enum values within declared sets; conditional fields: Worker.subcontractor_id required iff employer_type == SUBCONTRACTOR and must be null for DIRECT; DrugTestRecord.incident_id required iff test_type == POST_INCIDENT and must be null otherwise; deficiency verify disposition required iff outcome == CLOSED and forbidden when outcome == REJECTED; expires_date strictly after issued_date; work_end strictly after work_start; POST_INCIDENT worker_id must equal the linked Incident.worker_id when the incident has one; server-managed fields (status, computed fields, version, id) in a create/action body are rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: state
    check: "Target resource must be in the required state for the operation (per state_machines): plan DRAFT for activate; worker exact from-state; certificate UNVERIFIED; huddle SCHEDULED; JHA DRAFT or RE_REVIEW_REQUIRED for approve; inspection DUE|OVERDUE for complete; deficiency OPEN|OVERDUE for submit, CORRECTION_SUBMITTED for verify; incident exact pipeline state; permit exact from-state; drug test PENDING_RESULT"
    error_id: "ERR_PLAN_NOT_DRAFT | ERR_WORKER_INVALID_STATE | ERR_CERTIFICATE_INVALID_STATE | ERR_HUDDLE_INVALID_STATE | ERR_JHA_INVALID_STATE | ERR_INSPECTION_INVALID_STATE | ERR_DEFICIENCY_INVALID_STATE | ERR_INCIDENT_INVALID_STATE | ERR_PERMIT_INVALID_STATE | ERR_DRUG_TEST_INVALID_STATE"
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 6
    category: business_safety
    check: "Safety gates: (a) worker clear requires training_clearance_check pass; (b) worker clear blocked when Project.safety_posture == FROZEN; (c) permit issue/reinstate require posture == NORMAL; (d) segregation of duties — deficiency verify X-User-ID != created_by_user_id, incident determination X-User-ID != investigator_user_id; (e) incident close of a recordable incident with worker_id requires a resulted POST_INCIDENT drug test; (f) certificate verify on an already-expired certificate"
    error_id: "ERR_TRAINING_REQUIREMENT_NOT_MET (422, a) | ERR_PROJECT_POSTURE_BLOCKED (409, b/c) | ERR_SEGREGATION_OF_DUTIES_VIOLATION (403, d) | ERR_DRUG_TEST_REQUIRED (409, e) | ERR_CERTIFICATE_EXPIRED (409, f)"
    http_status: 409
    applies_to: "clear, issue, reinstate, verify (deficiency), determination, close (incident), verify (certificate)"

  - priority: 7
    category: business_referential
    check: "Cross-entity reference state: (a) permit create/issue/reinstate requires linked JHA status == APPROVED; (b) JHA approve requires linked Huddle status == CONDUCTED; (c) deficiency create requires parent Inspection status == COMPLETED; (d) worker clear (SUBCONTRACTOR) and reinstate require Subcontractor.standing constraint (GOOD_STANDING for clear, != REMOVED for reinstate); (e) permit create/issue/reinstate requires every authorized worker status == CLEARED; (f) huddle conduct requires every attendee status IN {ORIENTED, CLEARED}; (g) worker orientation requires an ACTIVE SafetyPlan on the project"
    error_id: "ERR_JHA_NOT_APPROVED (a) | ERR_HUDDLE_NOT_CONDUCTED (b) | ERR_INSPECTION_NOT_COMPLETED (c) | ERR_SUBCONTRACTOR_NOT_IN_GOOD_STANDING (d) | ERR_WORKER_NOT_CLEARED (e/f) | ERR_NO_ACTIVE_SAFETY_PLAN (g)"
    http_status: 409
    applies_to: "permit create/issue/reinstate, jha approve, deficiency create, worker clear/reinstate/orient, huddle conduct"

  - priority: 8
    category: business_temporal
    check: "Interval rules: (a) permit_conflict_check rules 1-3 (excavation half-open overlap, hot-work 60-minute buffer, crew closed-interval overlap); (b) certificate window overlap — a worker may not hold two certificates of the same cert_type with status != EXPIRED whose [issued_date, expires_date] windows overlap (renewal starting exactly on the prior expires_date is ALLOWED — day-granularity half-open); (c) POST_INCIDENT drug test 32-hour window"
    error_id: "ERR_PERMIT_TIME_CONFLICT (a) | ERR_CERTIFICATE_WINDOW_OVERLAP (b) | ERR_DRUG_TEST_WINDOW_VIOLATION (422, c)"
    http_status: 409
    applies_to: "permit create/issue/reinstate, training-certificate create, drug-test create"

  - priority: 9
    category: business_constraint
    check: "Uniqueness and threshold constraints: (a) at most one Huddle per (project_id, huddle_date); (b) probation-review DEMOTE requires compliance_score_realtime < 80 (strict), RESTORE requires >= 80 (inclusive)"
    error_id: "ERR_HUDDLE_ALREADY_EXISTS (a) | ERR_SCORE_THRESHOLD_NOT_MET (b)"
    http_status: 409
    applies_to: "huddle create, subcontractor probation-review"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/safety/_clock/set_current_utc"
    description: "Advance the server logical clock. Startup default (before any set call) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Each set runs the sweep: deficiency OPEN->OVERDUE flips (current_utc > due_at), inspection DUE->OVERDUE flips, huddle SCHEDULED->MISSED flips, certificate ->EXPIRED flips, permit ->EXPIRED flips (REQUESTED/ISSUED/SUSPENDED past work_end), then posture recompute per project."
    roles: [SafetyManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Clock sweep auto-transitions + posture recompute per project"]

  # --- Project ---
  - method: POST
    path: "/safety/projects"
    description: "Create a jobsite project"
    roles: [SafetyManager]
    code: 201
    input: [name, location, annual_hours_worked]
    output: Project
    side_effects: ["safety_posture := NORMAL, issued_permit_count := 0, open_deficiency_count := 0"]

  - method: GET
    path: "/safety/projects"
    description: "List projects"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Project[]"
    side_effects: []

  - method: GET
    path: "/safety/projects/{projectId}"
    description: "Get a project (includes computed posture and counters)"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: GET
    path: "/safety/projects/{projectId}/osha-summary"
    description: "Computed OSHA 300A-style summary for a calendar year (osha_incident_rates calculation, both variants)"
    roles: [SafetyManager, ComplianceAuditor]
    code: 200
    input: [year]
    output: "{ year: integer, hours_worked: integer, recordable_count_final: integer, recordable_count_provisional: integer, dart_count_final: integer, dart_count_provisional: integer, trir_final: number, trir_provisional: number, dart_rate_final: number, dart_rate_provisional: number, rate_spread_final: number }"
    side_effects: []

  # --- SafetyPlan ---
  - method: POST
    path: "/safety/safety-plans"
    description: "Create a new SafetyPlan revision (starts DRAFT; revision_no computed)"
    roles: [SafetyManager]
    code: 201
    input: [project_id, effective_date, "revision_notes?"]
    output: SafetyPlan
    side_effects: ["revision_no := 1 + count of existing plans for the project"]

  - method: GET
    path: "/safety/safety-plans"
    description: "List safety plans, optionally filtered by project"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: ["project_id?", "limit?", "offset?"]
    output: "SafetyPlan[]"
    side_effects: []

  - method: GET
    path: "/safety/safety-plans/{planId}"
    description: "Get a safety plan"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: []
    output: SafetyPlan
    side_effects: []

  - method: POST
    path: "/safety/safety-plans/{planId}/activate"
    description: "Activate a DRAFT plan; supersedes the currently ACTIVE plan of the same project. OCC: expected_project_version must match Project.version."
    roles: [SafetyManager]
    code: 200
    input: [expected_project_version]
    output: SafetyPlan
    side_effects: ["status -> ACTIVE", "prior ACTIVE plan -> SUPERSEDED", "Project.current_active_plan_id updated", "increments Project.version by 1", "activated_at := current_utc"]

  # --- Worker ---
  - method: POST
    path: "/safety/workers"
    description: "Badge a worker onto a project (starts PENDING_ORIENTATION)"
    roles: [SiteSuperintendent]
    code: 201
    input: [project_id, full_name, employer_type, "subcontractor_id?", "is_supervisor?"]
    output: Worker
    side_effects: []

  - method: GET
    path: "/safety/workers"
    description: "List workers; filterable by project or subcontractor"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: ["project_id?", "subcontractor_id?", "status?", "limit?", "offset?"]
    output: "Worker[]"
    side_effects: []

  - method: GET
    path: "/safety/workers/{workerId}"
    description: "Get a worker"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: []
    output: Worker
    side_effects: []

  - method: POST
    path: "/safety/workers/{workerId}/complete-orientation"
    description: "Record site-specific orientation (requires an ACTIVE SafetyPlan on the project)"
    roles: [SiteSuperintendent]
    code: 200
    input: []
    output: Worker
    side_effects: ["status PENDING_ORIENTATION -> ORIENTED", "orientation_completed_at := current_utc"]

  - method: POST
    path: "/safety/workers/{workerId}/clear"
    description: "Clear an oriented worker for work (training check + subcontractor standing + posture gate)"
    roles: [SiteSuperintendent]
    code: 200
    input: []
    output: Worker
    side_effects: ["status ORIENTED -> CLEARED"]

  - method: POST
    path: "/safety/workers/{workerId}/suspend"
    description: "Suspend a worker (manual safety action)"
    roles: [SafetyManager]
    code: 200
    input: [reason]
    output: Worker
    side_effects: ["status -> SUSPENDED", "cascade: ISSUED permits listing worker -> SUSPENDED -> linked JHAs -> RE_REVIEW_REQUIRED"]

  - method: POST
    path: "/safety/workers/{workerId}/reinstate"
    description: "Reinstate a suspended worker (returns to ORIENTED; must re-clear)"
    roles: [SafetyManager]
    code: 200
    input: []
    output: Worker
    side_effects: ["status SUSPENDED -> ORIENTED"]

  # --- TrainingCertificate ---
  - method: POST
    path: "/safety/training-certificates"
    description: "Register a training certificate (starts UNVERIFIED; same-type window overlap rejected)"
    roles: [SiteSuperintendent]
    code: 201
    input: [worker_id, cert_type, issued_date, expires_date]
    output: TrainingCertificate
    side_effects: []

  - method: GET
    path: "/safety/training-certificates"
    description: "List certificates, filterable by worker"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: ["worker_id?", "cert_type?", "status?", "limit?", "offset?"]
    output: "TrainingCertificate[]"
    side_effects: []

  - method: GET
    path: "/safety/training-certificates/{certificateId}"
    description: "Get a certificate"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: []
    output: TrainingCertificate
    side_effects: []

  - method: POST
    path: "/safety/training-certificates/{certificateId}/verify"
    description: "Verify a certificate (SafetyInspector); expired certificates cannot be verified"
    roles: [SafetyInspector]
    code: 200
    input: []
    output: TrainingCertificate
    side_effects: ["status UNVERIFIED -> VERIFIED", "verified_by_user_id := X-User-ID"]

  # --- Subcontractor ---
  - method: POST
    path: "/safety/subcontractors"
    description: "Engage a subcontractor on a project (starts GOOD_STANDING, scores 100)"
    roles: [SafetyManager]
    code: 201
    input: [project_id, company_name, trade]
    output: Subcontractor
    side_effects: []

  - method: GET
    path: "/safety/subcontractors"
    description: "List subcontractors, filterable by project"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: ["project_id?", "standing?", "limit?", "offset?"]
    output: "Subcontractor[]"
    side_effects: []

  - method: GET
    path: "/safety/subcontractors/{subcontractorId}"
    description: "Get a subcontractor (includes both compliance score variants)"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: []
    output: Subcontractor
    side_effects: []

  - method: POST
    path: "/safety/subcontractors/{subcontractorId}/probation-review"
    description: "DEMOTE (GOOD_STANDING -> PROBATION, requires realtime score < 80) or RESTORE (PROBATION -> GOOD_STANDING, requires >= 80)"
    roles: [SafetyManager]
    code: 200
    input: [action]
    output: Subcontractor
    side_effects: ["standing transition per action"]

  - method: POST
    path: "/safety/subcontractors/{subcontractorId}/remove"
    description: "Removal authority: PROBATION -> REMOVED; cascades to workers, permits, JHAs"
    roles: [SafetyManager]
    code: 200
    input: [reason]
    output: Subcontractor
    side_effects: ["standing -> REMOVED", "workers -> REMOVED", "ISSUED permits with removed crew -> SUSPENDED", "linked JHAs -> RE_REVIEW_REQUIRED"]

  # --- Huddle ---
  - method: POST
    path: "/safety/huddles"
    description: "Schedule the daily huddle for a project date (unique per project+date)"
    roles: [SiteSuperintendent]
    code: 201
    input: [project_id, huddle_date, topics]
    output: Huddle
    side_effects: []

  - method: GET
    path: "/safety/huddles"
    description: "List huddles, filterable by project/date"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: ["project_id?", "huddle_date?", "status?", "limit?", "offset?"]
    output: "Huddle[]"
    side_effects: []

  - method: GET
    path: "/safety/huddles/{huddleId}"
    description: "Get a huddle"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: []
    output: Huddle
    side_effects: []

  - method: POST
    path: "/safety/huddles/{huddleId}/conduct"
    description: "Record huddle attendance and mark CONDUCTED"
    roles: [SiteSuperintendent]
    code: 200
    input: [attendee_worker_ids]
    output: Huddle
    side_effects: ["status SCHEDULED -> CONDUCTED", "attendee_worker_ids + conducted_at recorded"]

  # --- JobHazardAnalysis ---
  - method: POST
    path: "/safety/jhas"
    description: "Create a JHA for a task, linked to the huddle where it was reviewed (starts DRAFT)"
    roles: [SiteSuperintendent]
    code: 201
    input: [project_id, huddle_id, task_description, hazards, controls]
    output: JobHazardAnalysis
    side_effects: []

  - method: GET
    path: "/safety/jhas"
    description: "List JHAs, filterable by project or huddle"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: ["project_id?", "huddle_id?", "status?", "limit?", "offset?"]
    output: "JobHazardAnalysis[]"
    side_effects: []

  - method: GET
    path: "/safety/jhas/{jhaId}"
    description: "Get a JHA"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: []
    output: JobHazardAnalysis
    side_effects: []

  - method: POST
    path: "/safety/jhas/{jhaId}/approve"
    description: "Approve a JHA (from DRAFT or RE_REVIEW_REQUIRED); requires the linked huddle to be CONDUCTED"
    roles: [SafetyManager]
    code: 200
    input: []
    output: JobHazardAnalysis
    side_effects: ["status -> APPROVED"]

  # --- Inspection ---
  - method: POST
    path: "/safety/inspections"
    description: "Schedule an inspection (starts DUE)"
    roles: [SafetyInspector]
    code: 201
    input: [project_id, inspection_type, due_date]
    output: Inspection
    side_effects: []

  - method: GET
    path: "/safety/inspections"
    description: "List inspections, filterable by project"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: ["project_id?", "inspection_type?", "status?", "limit?", "offset?"]
    output: "Inspection[]"
    side_effects: []

  - method: GET
    path: "/safety/inspections/{inspectionId}"
    description: "Get an inspection"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: POST
    path: "/safety/inspections/{inspectionId}/complete"
    description: "Complete an inspection (late completion from OVERDUE allowed)"
    roles: [SafetyInspector]
    code: 200
    input: ["findings_summary?"]
    output: Inspection
    side_effects: ["status -> COMPLETED", "completed_at := current_utc"]

  # --- Deficiency ---
  - method: POST
    path: "/safety/deficiencies"
    description: "Log a deficiency found during a COMPLETED inspection; due_at computed from severity SLA; IMMINENT_DANGER creation freezes posture"
    roles: [SafetyInspector]
    code: 201
    input: [inspection_id, description, severity, "assigned_subcontractor_id?"]
    output: Deficiency
    side_effects: ["due_at computed per deficiency_due_at", "created_by_user_id := X-User-ID", "Project.open_deficiency_count increments", "compliance score deduction if assigned", "posture recompute (IMMINENT_DANGER -> FROZEN cascade: ISSUED permits -> SUSPENDED -> JHAs -> RE_REVIEW_REQUIRED)"]

  - method: GET
    path: "/safety/deficiencies"
    description: "List deficiencies, filterable by inspection, project, subcontractor, status"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: ["inspection_id?", "project_id?", "assigned_subcontractor_id?", "status?", "limit?", "offset?"]
    output: "Deficiency[]"
    side_effects: []

  - method: GET
    path: "/safety/deficiencies/{deficiencyId}"
    description: "Get a deficiency"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: []
    output: Deficiency
    side_effects: []

  - method: POST
    path: "/safety/deficiencies/{deficiencyId}/submit-correction"
    description: "Submit corrective action (SubcontractorRep only for own assigned deficiencies)"
    roles: [SiteSuperintendent, SubcontractorRep]
    code: 200
    input: [correction_notes]
    output: Deficiency
    side_effects: ["status OPEN|OVERDUE -> CORRECTION_SUBMITTED", "posture recompute when leaving OVERDUE"]

  - method: POST
    path: "/safety/deficiencies/{deficiencyId}/verify"
    description: "Verify correction: outcome CLOSED -> VERIFIED_CLOSED (disposition CONFIRMED | NOT_SUB_FAULT), outcome REJECTED -> OPEN. Verifier must differ from creator (segregation of duties)."
    roles: [SafetyInspector]
    code: 200
    input: [outcome, "disposition?", "notes?"]
    output: Deficiency
    side_effects: ["CLOSED: status -> VERIFIED_CLOSED, open_deficiency_count decrements, NOT_SUB_FAULT refunds score deduction", "REJECTED: status -> OPEN (may re-flip OVERDUE), posture recompute"]

  # --- Incident ---
  - method: POST
    path: "/safety/incidents"
    description: "Report an incident (starts REPORTED); CRITICAL/FATALITY creation freezes posture and cascades"
    roles: [SiteSuperintendent]
    code: 201
    input: [project_id, "worker_id?", incident_type, severity, occurred_at, work_related, description]
    output: Incident
    side_effects: ["posture recompute; CRITICAL/FATALITY -> FROZEN cascade: ISSUED permits -> SUSPENDED -> linked JHAs -> RE_REVIEW_REQUIRED"]

  - method: GET
    path: "/safety/incidents"
    description: "List incidents, filterable by project or worker"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: ["project_id?", "worker_id?", "status?", "limit?", "offset?"]
    output: "Incident[]"
    side_effects: []

  - method: GET
    path: "/safety/incidents/{incidentId}"
    description: "Get an incident"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: POST
    path: "/safety/incidents/{incidentId}/investigate"
    description: "Open investigation (records investigator identity)"
    roles: [SafetyInspector]
    code: 200
    input: [investigation_notes]
    output: Incident
    side_effects: ["status REPORTED -> UNDER_INVESTIGATION", "investigator_user_id := X-User-ID"]

  - method: POST
    path: "/safety/incidents/{incidentId}/determination"
    description: "Record OSHA recordability determination (must be a different user than the investigator)"
    roles: [SafetyManager]
    code: 200
    input: [medical_treatment_beyond_first_aid, days_away_from_work, restricted_duty, loss_of_consciousness, significant_diagnosis]
    output: Incident
    side_effects: ["status -> DETERMINATION_MADE", "is_osha_recordable computed", "compliance score recompute for involved subcontractor"]

  - method: POST
    path: "/safety/incidents/{incidentId}/close"
    description: "Close after determination; recordable incidents with an involved worker require a resulted POST_INCIDENT drug test"
    roles: [SafetyManager]
    code: 200
    input: []
    output: Incident
    side_effects: ["status -> CLOSED", "posture recompute (may lift FROZEN); SUSPENDED permits stay SUSPENDED"]

  # --- Permit ---
  - method: POST
    path: "/safety/permits"
    description: "Request a fall-protection / excavation / hot-work permit (JHA must be APPROVED; conflict + crew checks run)"
    roles: [SiteSuperintendent]
    code: 201
    input: [project_id, jha_id, permit_type, work_start, work_end, authorized_worker_ids]
    output: Permit
    side_effects: []

  - method: GET
    path: "/safety/permits"
    description: "List permits, filterable by project or JHA"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: ["project_id?", "jha_id?", "permit_type?", "status?", "limit?", "offset?"]
    output: "Permit[]"
    side_effects: []

  - method: GET
    path: "/safety/permits/{permitId}"
    description: "Get a permit"
    roles: [SafetyManager, SiteSuperintendent, SafetyInspector, SubcontractorRep, ComplianceAuditor]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: POST
    path: "/safety/permits/{permitId}/issue"
    description: "Issue a REQUESTED permit (posture NORMAL gate + revalidation)"
    roles: [SafetyManager]
    code: 200
    input: []
    output: Permit
    side_effects: ["status -> ISSUED", "Project.issued_permit_count increments", "increments Project.version by 1"]

  - method: POST
    path: "/safety/permits/{permitId}/close"
    description: "Close an ISSUED permit (work complete)"
    roles: [SiteSuperintendent]
    code: 200
    input: ["completion_notes?"]
    output: Permit
    side_effects: ["status -> CLOSED", "Project.issued_permit_count decrements", "increments Project.version by 1"]

  - method: POST
    path: "/safety/permits/{permitId}/reinstate"
    description: "Reinstate a SUSPENDED permit (posture NORMAL gate + revalidation)"
    roles: [SafetyManager]
    code: 200
    input: []
    output: Permit
    side_effects: ["status SUSPENDED -> ISSUED", "Project.issued_permit_count increments", "increments Project.version by 1"]

  # --- DrugTestRecord ---
  - method: POST
    path: "/safety/drug-tests"
    description: "Record a drug test collection; POST_INCIDENT enforces the 32-hour window and worker-incident match"
    roles: [SafetyManager]
    code: 201
    input: [worker_id, test_type, "incident_id?", collected_at]
    output: DrugTestRecord
    side_effects: ["window_compliant computed for POST_INCIDENT"]

  - method: GET
    path: "/safety/drug-tests"
    description: "List drug test records, filterable by worker or incident"
    roles: [SafetyManager, ComplianceAuditor]
    code: 200
    input: ["worker_id?", "incident_id?", "test_type?", "limit?", "offset?"]
    output: "DrugTestRecord[]"
    side_effects: []

  - method: GET
    path: "/safety/drug-tests/{drugTestId}"
    description: "Get a drug test record"
    roles: [SafetyManager, ComplianceAuditor]
    code: 200
    input: []
    output: DrugTestRecord
    side_effects: []

  - method: POST
    path: "/safety/drug-tests/{drugTestId}/record-result"
    description: "Record the laboratory result; POSITIVE cascades worker suspension -> permit suspension -> JHA re-review"
    roles: [SafetyManager]
    code: 200
    input: [result]
    output: DrugTestRecord
    side_effects: ["status PENDING_RESULT -> NEGATIVE | POSITIVE", "POSITIVE: worker SUSPENDED -> ISSUED permits SUSPENDED -> JHAs RE_REVIEW_REQUIRED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, empty, or role not a declared role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint, or SubcontractorRep acting on a deficiency not assigned to their subcontractor" }
  # --- Not found ---
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "No Project with the given id" }
  - { id: ERR_SAFETY_PLAN_NOT_FOUND, http: 404, condition: "No SafetyPlan with the given id" }
  - { id: ERR_WORKER_NOT_FOUND, http: 404, condition: "No Worker with the given id (also for body FKs, crew lists, attendee lists)" }
  - { id: ERR_CERTIFICATE_NOT_FOUND, http: 404, condition: "No TrainingCertificate with the given id" }
  - { id: ERR_SUBCONTRACTOR_NOT_FOUND, http: 404, condition: "No Subcontractor with the given id" }
  - { id: ERR_HUDDLE_NOT_FOUND, http: 404, condition: "No Huddle with the given id" }
  - { id: ERR_JHA_NOT_FOUND, http: 404, condition: "No JobHazardAnalysis with the given id" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "No Inspection with the given id" }
  - { id: ERR_DEFICIENCY_NOT_FOUND, http: 404, condition: "No Deficiency with the given id" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "No Incident with the given id" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "No Permit with the given id" }
  - { id: ERR_DRUG_TEST_NOT_FOUND, http: 404, condition: "No DrugTestRecord with the given id" }
  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, enum value outside declared set, conditional-field violation (subcontractor_id / incident_id rules), expires_date <= issued_date, work_end <= work_start, POST_INCIDENT worker mismatch with linked incident's worker, or server-managed field supplied in body" }
  # --- State ---
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "activate requires the SafetyPlan to be DRAFT" }
  - { id: ERR_WORKER_INVALID_STATE, http: 409, condition: "Worker not in the required from-state for orientation/clear/suspend/reinstate (including terminal REMOVED lockdown)" }
  - { id: ERR_CERTIFICATE_INVALID_STATE, http: 409, condition: "Certificate not UNVERIFIED for verify" }
  - { id: ERR_HUDDLE_INVALID_STATE, http: 409, condition: "conduct requires SCHEDULED (CONDUCTED/MISSED rejected)" }
  - { id: ERR_JHA_INVALID_STATE, http: 409, condition: "approve requires DRAFT or RE_REVIEW_REQUIRED" }
  - { id: ERR_INSPECTION_INVALID_STATE, http: 409, condition: "complete requires DUE or OVERDUE" }
  - { id: ERR_DEFICIENCY_INVALID_STATE, http: 409, condition: "submit-correction requires OPEN or OVERDUE; verify requires CORRECTION_SUBMITTED" }
  - { id: ERR_INCIDENT_INVALID_STATE, http: 409, condition: "investigate requires REPORTED; determination requires UNDER_INVESTIGATION; close requires DETERMINATION_MADE" }
  - { id: ERR_PERMIT_INVALID_STATE, http: 409, condition: "issue requires REQUESTED; close requires ISSUED; reinstate requires SUSPENDED" }
  - { id: ERR_DRUG_TEST_INVALID_STATE, http: 409, condition: "record-result requires PENDING_RESULT" }
  - { id: ERR_SUBCONTRACTOR_INVALID_STANDING, http: 409, condition: "probation-review/remove requires the documented from-standing (DEMOTE from GOOD_STANDING, RESTORE/REMOVE from PROBATION); REMOVED is terminal" }
  # --- Business: safety ---
  - { id: ERR_TRAINING_REQUIREMENT_NOT_MET, http: 422, condition: "Worker lacks a VERIFIED, non-expired certificate of the required OSHA level (OSHA_30 for supervisors; OSHA_10 or OSHA_30 otherwise)" }
  - { id: ERR_PROJECT_POSTURE_BLOCKED, http: 409, condition: "Operation gated by project posture: clear blocked when FROZEN; permit issue/reinstate require NORMAL" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Deficiency verifier == creator, or incident determination user == investigator" }
  - { id: ERR_DRUG_TEST_REQUIRED, http: 409, condition: "Closing a recordable incident with an involved worker requires a resulted (NEGATIVE/POSITIVE) POST_INCIDENT DrugTestRecord" }
  - { id: ERR_CERTIFICATE_EXPIRED, http: 409, condition: "verify attempted on a certificate whose expires_date has passed" }
  # --- Business: referential ---
  - { id: ERR_NO_ACTIVE_SAFETY_PLAN, http: 409, condition: "Worker orientation requires an ACTIVE SafetyPlan on the project" }
  - { id: ERR_JHA_NOT_APPROVED, http: 409, condition: "Permit create/issue/reinstate requires linked JHA status == APPROVED" }
  - { id: ERR_HUDDLE_NOT_CONDUCTED, http: 409, condition: "JHA approve requires linked Huddle status == CONDUCTED" }
  - { id: ERR_INSPECTION_NOT_COMPLETED, http: 409, condition: "Deficiency create requires parent Inspection status == COMPLETED" }
  - { id: ERR_SUBCONTRACTOR_NOT_IN_GOOD_STANDING, http: 409, condition: "Sub-worker clear requires standing == GOOD_STANDING; reinstate requires standing != REMOVED" }
  - { id: ERR_WORKER_NOT_CLEARED, http: 409, condition: "Permit crew members must be CLEARED; huddle attendees must be ORIENTED or CLEARED" }
  # --- Business: temporal ---
  - { id: ERR_PERMIT_TIME_CONFLICT, http: 409, condition: "Excavation half-open overlap, hot-work 60-minute buffer violation, or crew closed-interval overlap" }
  - { id: ERR_CERTIFICATE_WINDOW_OVERLAP, http: 409, condition: "Same worker + cert_type window overlaps an existing non-EXPIRED certificate (renewal starting exactly on prior expires_date allowed)" }
  - { id: ERR_DRUG_TEST_WINDOW_VIOLATION, http: 422, condition: "POST_INCIDENT collected_at outside [occurred_at, occurred_at + 32h]" }
  # --- Business: constraint ---
  - { id: ERR_HUDDLE_ALREADY_EXISTS, http: 409, condition: "A Huddle already exists for this (project_id, huddle_date)" }
  - { id: ERR_SCORE_THRESHOLD_NOT_MET, http: 409, condition: "DEMOTE requires compliance_score_realtime < 80 (exactly 80 rejected); RESTORE requires >= 80" }
  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_project_version does not match current Project.version on safety-plan activation (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SafetyManager
    description: "Corporate safety department lead — owns plans, recordability determinations, subcontractor standing/removal, permits issuance, drug-free workplace program, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /safety/_clock/set_current_utc"
      - "POST /safety/projects"
      - "POST /safety/safety-plans and .../activate"
      - "POST /safety/workers/{id}/suspend and .../reinstate"
      - "POST /safety/subcontractors and .../probation-review and .../remove"
      - "POST /safety/jhas/{id}/approve"
      - "POST /safety/incidents/{id}/determination and .../close"
      - "POST /safety/permits/{id}/issue and .../reinstate"
      - "POST /safety/drug-tests and .../record-result"
    shared_operations:
      - "All GET list/detail endpoints including osha-summary"

  - name: SiteSuperintendent
    description: "Jobsite superintendent — runs orientations, daily huddles, JHAs, permit requests/closures, incident reporting, and correction submission"
    identity: opaque
    exclusive_operations:
      - "POST /safety/workers and .../complete-orientation and .../clear"
      - "POST /safety/training-certificates"
      - "POST /safety/huddles and .../conduct"
      - "POST /safety/jhas"
      - "POST /safety/incidents"
      - "POST /safety/permits and .../close"
    shared_operations:
      - "POST /safety/deficiencies/{id}/submit-correction (shared with SubcontractorRep)"
      - "All GET list/detail endpoints except drug-tests and osha-summary"

  - name: SafetyInspector
    description: "Field safety inspector — runs inspections, logs and verifies deficiencies, verifies training certificates, investigates incidents. Segregation of duties: cannot verify a deficiency they created; cannot be the determining voice on an incident they investigated (enforced via X-User-ID comparison)."
    identity: opaque
    exclusive_operations:
      - "POST /safety/inspections and .../complete"
      - "POST /safety/deficiencies and .../verify"
      - "POST /safety/training-certificates/{id}/verify"
      - "POST /safety/incidents/{id}/investigate"
    shared_operations:
      - "All GET list/detail endpoints except drug-tests and osha-summary"

  - name: SubcontractorRep
    description: "Subcontractor representative — X-User-ID equals the Subcontractor.id they represent; may view project data and submit corrections only for deficiencies assigned to their subcontractor"
    identity: "entity_backed:Subcontractor"
    exclusive_operations: []
    shared_operations:
      - "POST /safety/deficiencies/{id}/submit-correction (only when assigned_subcontractor_id == X-User-ID)"
      - "All GET list/detail endpoints except drug-tests and osha-summary"

  - name: ComplianceAuditor
    description: "Read-only regulatory auditor — full read access including drug tests and OSHA summaries; no write operations"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET list/detail endpoints including drug-tests and osha-summary"
