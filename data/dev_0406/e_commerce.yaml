# =============================================================================
# 电商多卖家平台：订单履约与结算系统
# 极其复杂场景 — 7 个实体、5 个状态机、10 条计算规则、33 个端点、40 个错误码
# =============================================================================

scenario: |
  多卖家电商平台的履约与结算系统。管理卖家账户的完整生命周期：从入驻审核、
  销售渠道开设、商品上架、仓储配置，到物流分配、折扣核销、佣金阶梯计费和
  最终结算。需要考虑：角色权限、费用预算控制（平台服务费）、卖家合规评分、
  仓库认证匹配、物流周转间隔协议、发货限制规则（仓库互斥配对）、
  高发货量仓库双倍运费、佣金大卖家阶梯折扣、折扣券预算独立核算。
  系统包含两套独立账本（费用账本 + 折扣券账本）和两组分歧计算
  （运费前瞻/时序分歧 + 佣金前瞻/时序分歧）。

domain_name: e-commerce
api_prefix: /seller-accounts

# =============================================================================
# 表 1: 实体关系表（7 个实体）
# =============================================================================
entities:
  # ---- 1. SellerAccount（顶层容器，类比 TreatmentPlan）----
  - name: SellerAccount
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: seller_name, type: string, source: input, description: 卖家名称 }
      - { name: business_category, type: string, source: input, description: 经营类目 }
      - { name: base_commission_rate, type: number, source: input, description: "基础佣金比例，如 0.10 表示 10%" }
      - { name: fee_budget, type: number, source: input, description: "本结算周期的平台服务费预算上限（运费+佣金）" }
      - { name: fee_balance, type: number, source: computed, description: "剩余费用余额，初始值=fee_budget，随 allocation 增减" }
      - { name: compliance_score, type: number, source: computed, description: "合规分数，初始值=0，越低越好，违规累加" }
      - { name: status, type: enum, source: system, description: "ONBOARDING → ACTIVE → SETTLEMENT_PENDING → SETTLED" }

  # ---- 2. SalesChannel（销售渠道/活动，类比 WardRotation）----
  - name: SalesChannel
    parent: SellerAccount
    common_fields: true
    fields:
      - { name: seller_account_id, type: string, source: system, description: 关联的卖家账户ID }
      - { name: channel_name, type: string, source: input, description: 渠道/活动名称 }
      - { name: start_minute, type: integer, source: input, description: "开始时刻（非负整数时间偏移量）" }
      - { name: end_minute, type: integer, source: input, description: "结束时刻（必须 > start_minute）" }
      - { name: status, type: enum, source: system, description: "PLANNING → READY_FOR_DISPATCH → FULFILLED → CANCELLED" }

  # ---- 3. ProductOffer（商品上架，类比 Procedure）----
  - name: ProductOffer
    parent: SalesChannel
    common_fields: true
    fields:
      - { name: sales_channel_id, type: string, source: system, description: 关联的销售渠道ID }
      - { name: seller_account_id, type: string, source: system, description: 关联的卖家账户ID }
      - { name: product_name, type: string, source: input, description: 商品名称 }
      - { name: product_category, type: string, source: input, description: "商品类目（自由字符串，同类目无需物流周转间隔）" }
      - { name: unit_price, type: number, source: input, description: 单价 }
      - { name: quantity_available, type: integer, source: input, description: 可售数量 }
      - { name: required_warehouse_certification, type: enum, source: input, default: "NONE", description: "COLD_CHAIN_CERTIFIED | HAZMAT_LICENSED | FRAGILE_HANDLING | NONE" }
      - { name: start_minute, type: integer, source: input, description: "上架开始时刻（必须在渠道时间窗口内）" }
      - { name: end_minute, type: integer, source: input, description: "上架结束时刻（必须在渠道时间窗口内）" }
      - { name: duration_minutes, type: integer, source: computed, description: "只读字段，= end_minute - start_minute" }
      - { name: status, type: enum, source: system, description: "PENDING → RESERVED → CONFIRMED → FULFILLED / CANCELLED" }

  # ---- 4. FulfillmentCenter（仓储节点，类比 MedicalResource）----
  - name: FulfillmentCenter
    parent: SellerAccount
    common_fields: true
    fields:
      - { name: seller_account_id, type: string, source: system, description: 关联的卖家账户ID }
      - { name: center_name, type: string, source: input, description: 仓库名称 }
      - { name: center_region, type: string, source: input, description: 仓库所在区域 }
      - { name: cost_per_unit, type: number, source: input, description: 每单位商品的运费成本 }
      - { name: max_capacity, type: integer, source: input, description: 仓库最大总发货量（硬上限，超出则拒绝） }
      - { name: warehouse_certifications, type: array, source: system, description: "认证列表，每项含 id, name, certified_date" }

  # ---- 5. FulfillmentAllocation（物流分配，类比 Assignment）----
  - name: FulfillmentAllocation
    parent: SellerAccount
    common_fields: true
    fields:
      - { name: seller_account_id, type: string, source: system, description: 关联的卖家账户ID }
      - { name: product_offer_id, type: string, source: input, description: 关联的商品上架ID }
      - { name: fulfillment_center_id, type: string, source: input, description: 关联的仓储节点ID }
      - { name: voucher_id, type: string, source: input, required: false, description: "可选折扣券ID，用于减免佣金计算基数" }
      - { name: override_compliance_check, type: boolean, source: input, default: false, description: "是否绕过合规评分阈值检查" }
      - { name: compliance_override_penalty_applied, type: boolean, source: computed, description: "是否实际施加了 override 惩罚（+80分）" }
      - { name: is_high_volume, type: boolean, source: computed, description: "仓库累计发货量是否超过 SURGE_THRESHOLD（10000 件）" }
      - { name: discount_amount, type: number, source: computed, description: "折扣券计算的折扣金额（无券则为 0）" }
      - { name: provisional_shipping_cost, type: number, source: computed, description: "临时运费（前瞻性计算）" }
      - { name: final_shipping_cost, type: number, source: computed, description: "最终运费（按时间顺序计算，settlement 时填入）" }
      - { name: provisional_commission, type: number, source: computed, description: "临时佣金（前瞻性计算）" }
      - { name: final_commission, type: number, source: computed, description: "最终佣金（按时间顺序计算，settlement 时填入）" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW → QUALITY_CHECKED → DISPATCHED → DELIVERED → SETTLED / REJECTED / CANCELLED" }

  # ---- 6. ShippingRestriction（发货限制，类比 InfectionRiskPairing）----
  - name: ShippingRestriction
    parent: SellerAccount
    common_fields: false  # 只有 id 和 created_at
    fields:
      - { name: seller_account_id, type: string, source: system, description: 关联的卖家账户ID }
      - { name: fulfillment_center_id_1, type: string, source: input, description: 限制配对仓库1 }
      - { name: fulfillment_center_id_2, type: string, source: input, description: 限制配对仓库2 }
      - { name: reason, type: string, source: input, required: false, description: 限制原因 }

  # ---- 7. DiscountVoucher（折扣券，hospital-shifts 无对应，新增复杂度来源）----
  - name: DiscountVoucher
    parent: SellerAccount
    common_fields: true
    fields:
      - { name: seller_account_id, type: string, source: system, description: 关联的卖家账户ID }
      - { name: voucher_code, type: string, source: input, description: 券码 }
      - { name: discount_type, type: enum, source: input, description: "PERCENTAGE | FIXED_AMOUNT" }
      - { name: discount_value, type: number, source: input, description: "折扣值（百分比如 10 表示 10%，固定金额如 500）" }
      - { name: min_order_value, type: number, source: input, description: 最低使用门槛（商品总价 ≥ 此值方可使用） }
      - { name: max_discount_cap, type: number, source: input, description: 单次最大折扣金额 }
      - { name: total_budget, type: number, source: input, description: 折扣券总预算 }
      - { name: budget_remaining, type: number, source: computed, description: "剩余预算，初始值=total_budget" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE → EXHAUSTED（可因退款回退到 ACTIVE）" }

# =============================================================================
# 表 2: 状态机表（5 个状态机）
# =============================================================================
state_machines:
  # ---- SellerAccount ----
  - entity: SellerAccount
    initial_state: ONBOARDING
    terminal_states: [SETTLED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: POST /seller-accounts/{accountId}/activate
        actor: SettlementAdmin
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: SETTLEMENT_PENDING
        trigger: POST /seller-accounts/{accountId}/initiate-settlement
        actor: OrderProcessor
        preconditions:
          - 不存在未解决的 allocations（PENDING_REVIEW 或 QUALITY_CHECKED 状态）
        side_effects: []

      - from: SETTLEMENT_PENDING
        to: SETTLED
        trigger: POST /seller-accounts/{accountId}/finalize-settlement
        actor: SettlementAdmin
        preconditions:
          - "sum(final_shipping_cost + final_commission) ≤ fee_budget（否则 ERR_SETTLEMENT_EXCEEDS_BUDGET）"
        side_effects:
          - 所有 DELIVERED allocations 计算 final_shipping_cost 和 final_commission 并转 SETTLED
          - 所有 READY_FOR_DISPATCH channels 转 FULFILLED
          - 所有 CONFIRMED offers 转 FULFILLED
          - "fee_balance = fee_budget - sum(final_shipping_costs + final_commissions)"

  # ---- SalesChannel ----
  - entity: SalesChannel
    initial_state: PLANNING
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PLANNING
        to: READY_FOR_DISPATCH
        trigger: PUT /seller-accounts/{accountId}/sales-channels/{channelId}
        actor: OrderProcessor
        preconditions:
          - 卖家账户状态为 ACTIVE
          - "所有 product offers 必须为 CONFIRMED 状态（否则 ERR_OFFERS_NOT_CONFIRMED）"
        side_effects: []

      - from: READY_FOR_DISPATCH
        to: FULFILLED
        trigger: system（finalize-settlement 时自动）
        actor: system
        preconditions:
          - 所有 product offers 已到终态（FULFILLED 或 CANCELLED）
        side_effects: []

      - from: PLANNING
        to: CANCELLED
        trigger: PUT /seller-accounts/{accountId}/sales-channels/{channelId}
        actor: OrderProcessor
        preconditions:
          - 卖家账户状态为 ACTIVE
        side_effects:
          - 所有 PENDING offers → CANCELLED
          - 所有 RESERVED offers 的关联 allocations（PENDING_REVIEW）→ CANCELLED，然后 offers → CANCELLED
          - 关联 allocations 的费用退还到 fee_balance
          - 关联 allocations 的合规分退还
          - 关联 allocations 的折扣券预算退还

      - from: READY_FOR_DISPATCH
        to: CANCELLED
        trigger: PUT /seller-accounts/{accountId}/sales-channels/{channelId}
        actor: OrderProcessor
        preconditions:
          - 卖家账户状态为 ACTIVE
          - 不存在 DELIVERED 状态的 allocations（否则无法取消）
        side_effects:
          - 所有 CONFIRMED offers 的关联 allocations（DISPATCHED）→ CANCELLED
          - offers → CANCELLED
          - 费用、合规分、折扣券退还

  # ---- ProductOffer ----
  - entity: ProductOffer
    initial_state: PENDING
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PENDING
        to: RESERVED
        trigger: system（FulfillmentAllocation 创建时自动）
        actor: system
        preconditions: []
        side_effects: []
        note: 当一个 allocation 被创建，关联的 offer 从 PENDING 变为 RESERVED

      - from: RESERVED
        to: CONFIRMED
        trigger: system（FulfillmentAllocation dispatch 时自动）
        actor: system
        preconditions: []
        side_effects: []
        note: 当关联的 allocation 从 QUALITY_CHECKED 变为 DISPATCHED，offer 变为 CONFIRMED

      - from: RESERVED
        to: PENDING
        trigger: system（allocation reject/cancel 时自动回退）
        actor: system
        preconditions: []
        side_effects: []
        note: 当 PENDING_REVIEW 的 allocation 被 reject/cancel，offer 回退到 PENDING

      - from: CONFIRMED
        to: PENDING
        trigger: system（DISPATCHED allocation cancel 时自动回退）
        actor: system
        preconditions: []
        side_effects: []
        note: 当 DISPATCHED 的 allocation 被 cancel（召回），offer 回退到 PENDING

      - from: CONFIRMED
        to: FULFILLED
        trigger: system（finalize-settlement 时自动）
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING
        to: CANCELLED
        trigger: POST .../product-offers/{offerId}/cancel
        actor: SellerManager
        preconditions:
          - "offer 必须在 PENDING 状态（否则 ERR_OFFER_NOT_PENDING_FOR_CANCEL）"
        side_effects: []

  # ---- FulfillmentAllocation ----
  - entity: FulfillmentAllocation
    initial_state: PENDING_REVIEW
    terminal_states: [SETTLED, REJECTED, CANCELLED]
    transitions:
      - from: PENDING_REVIEW
        to: QUALITY_CHECKED
        trigger: POST .../fulfillment-allocations/{allocationId}/quality-check
        actor: OrderProcessor
        preconditions: []
        side_effects: []

      - from: PENDING_REVIEW
        to: REJECTED
        trigger: POST .../fulfillment-allocations/{allocationId}/reject
        actor: OrderProcessor
        preconditions: []
        side_effects:
          - offer 回退到 PENDING
          - "fee_balance += provisional_shipping_cost + provisional_commission"
          - "compliance_score 退还（high_volume 惩罚 + override 惩罚）"
          - "如有折扣券：voucher.budget_remaining += discount_amount，若 EXHAUSTED 且 budget > 0 则回退到 ACTIVE"

      - from: PENDING_REVIEW
        to: CANCELLED
        trigger: POST .../fulfillment-allocations/{allocationId}/cancel
        actor: OrderProcessor
        preconditions: []
        side_effects:
          - 同 REJECTED 的 side_effects

      - from: QUALITY_CHECKED
        to: DISPATCHED
        trigger: POST .../fulfillment-allocations/{allocationId}/dispatch
        actor: OrderProcessor
        preconditions: []
        side_effects:
          - offer 状态 → CONFIRMED
          - "重新计算 provisional_shipping_cost（仅看同仓库 start_minute 之前的已 DISPATCHED allocations）"
          - "重新计算 provisional_commission（仅看全卖家 start_minute 之前的已 DISPATCHED allocations）"
          - "fee_balance 调整（退旧扣新）"
          - is_high_volume 可能变化
          - compliance_score 可能调整

      - from: QUALITY_CHECKED
        to: CANCELLED
        trigger: POST .../fulfillment-allocations/{allocationId}/cancel
        actor: OrderProcessor
        preconditions: []
        side_effects:
          - offer 回退到 PENDING
          - 退还所有费用和分数

      - from: DISPATCHED
        to: DELIVERED
        trigger: POST .../fulfillment-allocations/{allocationId}/confirm-delivery
        actor: OrderProcessor
        preconditions: []
        side_effects: []
        note: 仅状态确认，无财务重算

      - from: DISPATCHED
        to: CANCELLED
        trigger: POST .../fulfillment-allocations/{allocationId}/cancel
        actor: OrderProcessor
        preconditions: []
        side_effects:
          - offer 回退到 PENDING
          - 退还所有费用和分数
        note: 代表物流召回场景

      - from: DELIVERED
        to: SETTLED
        trigger: system（finalize-settlement 时自动）
        actor: system
        preconditions: []
        side_effects:
          - 计算 final_shipping_cost（按时间顺序）
          - 计算 final_commission（按时间顺序）
          - fee_balance 最终调整

  # ---- DiscountVoucher ----
  - entity: DiscountVoucher
    initial_state: DRAFT
    terminal_states: []  # EXHAUSTED 可回退，无真正终态
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST .../discount-vouchers/{voucherId}/activate
        actor: SellerManager
        preconditions:
          - 卖家账户状态为 ACTIVE
        side_effects: []

      - from: ACTIVE
        to: EXHAUSTED
        trigger: system（budget_remaining ≤ 0 时自动）
        actor: system
        preconditions: []
        side_effects: []

      - from: EXHAUSTED
        to: ACTIVE
        trigger: system（allocation cancel/reject 退款导致 budget_remaining > 0 时自动）
        actor: system
        preconditions: []
        side_effects: []
        note: 取消 allocation 时折扣券预算退回，可能使 EXHAUSTED 的券回退到 ACTIVE

# =============================================================================
# 表 3: 计算规则表（10 条规则）
# =============================================================================
calculations:
  # ---- 规则 1：临时运费（前瞻性）----
  - name: provisional_shipping_cost
    trigger: "allocation 创建时和 dispatch（确认发货）时"
    algorithm: forward_looking
    formula: |
      1. 确定同仓库的"相关 allocations 集合"
         - 创建时: 同一 fulfillment_center 的所有非终态 allocations
         - dispatch 时: 同一 fulfillment_center 的所有已 DISPATCHED 且 offer.start_minute < 当前 offer.start_minute 的 allocations
      2. total_units = sum(相关 allocations 的 offer.quantity_available) + 当前 offer.quantity_available
      3. 判断是否超过 SURGE_THRESHOLD:
         if total_units > SURGE_THRESHOLD:
           excess = total_units - SURGE_THRESHOLD
           if excess >= current_quantity:
             shipping = current_quantity * cost_per_unit * SURGE_MULTIPLIER  # 全部加价
           else:
             normal_part = current_quantity - excess
             shipping = normal_part * cost_per_unit + excess * cost_per_unit * SURGE_MULTIPLIER
         else:
           shipping = current_quantity * cost_per_unit
    constants:
      SURGE_THRESHOLD: 10000  # 1 万件
      SURGE_MULTIPLIER: 2     # 超量双倍运费
    precision: "2 decimal places, round_half_up"
    scope: "per-center（按仓库维度）"
    note: "创建和 dispatch 对同一 allocation 可能算出不同的 provisional_shipping_cost"

  # ---- 规则 2：最终运费（时序性）----
  - name: final_shipping_cost
    trigger: finalize-settlement
    algorithm: chronological
    formula: |
      1. 收集同仓库所有 DELIVERED allocations
      2. 按 offer.start_minute 升序排列
      3. running_units = 0
      4. for each allocation in sorted order:
           quantity = allocation 关联的 offer.quantity_available
           running_units += quantity
           if running_units > SURGE_THRESHOLD:
             excess = running_units - SURGE_THRESHOLD
             if excess >= quantity:
               final_shipping = quantity * cost_per_unit * SURGE_MULTIPLIER
             else:
               normal_part = quantity - excess
               final_shipping = normal_part * cost_per_unit + excess * cost_per_unit * SURGE_MULTIPLIER
           else:
             final_shipping = quantity * cost_per_unit
    constants: { SURGE_THRESHOLD: 10000, SURGE_MULTIPLIER: 2 }
    precision: "2 decimal places, round_half_up"
    scope: "per-center"
    key_insight: |
      provisional_shipping（前瞻性、包含所有未解决的）和 final_shipping（按时间顺序、
      只看已确认的）对同一组数据可能产生不同结果——这是第一组分歧计算。

  # ---- 规则 3：临时佣金（前瞻性）----
  - name: provisional_commission
    trigger: "allocation 创建时和 dispatch 时"
    algorithm: forward_looking
    formula: |
      1. 确定卖家全局的"相关 allocations 集合"
         - 创建时: 该卖家所有非终态 allocations（跨所有仓库）
         - dispatch 时: 该卖家所有已 DISPATCHED 且 offer.start_minute < 当前的 allocations
      2. total_seller_units = sum(相关 allocations 的 offer.quantity_available) + 当前 quantity
      3. 确定有效佣金率:
         if total_seller_units > VOLUME_TIER_THRESHOLD:
           effective_rate = base_commission_rate * VOLUME_DISCOUNT_FACTOR  # 大卖家折扣
         else:
           effective_rate = base_commission_rate
      4. 计算佣金基数:
         gross_value = current_quantity * unit_price
         net_value = gross_value - discount_amount
      5. 判断是否部分跨越阈值:
         if total_seller_units > VOLUME_TIER_THRESHOLD:
           excess = total_seller_units - VOLUME_TIER_THRESHOLD
           if excess >= current_quantity:
             commission = net_value * discounted_rate  # 全部享受折扣率
           else:
             discounted_portion_units = excess
             full_portion_units = current_quantity - excess
             discounted_revenue = (discounted_portion_units / current_quantity) * net_value
             full_revenue = net_value - discounted_revenue
             commission = full_revenue * base_rate + discounted_revenue * discounted_rate
         else:
           commission = net_value * base_rate
    constants:
      VOLUME_TIER_THRESHOLD: 50000  # 5 万件触发大卖家佣金折扣
      VOLUME_DISCOUNT_FACTOR: 0.8   # 佣金率打八折（降低 20%）
    precision: "2 decimal places, round_half_up"
    scope: "per-seller（按卖家维度，跨仓库汇总）"
    note: |
      佣金方向与运费相反：超量 → 佣金率降低（对卖家有利），而运费超量 → 运费增加。
      这使得高发货量的净效应不确定——需要精确计算。

  # ---- 规则 4：最终佣金（时序性）----
  - name: final_commission
    trigger: finalize-settlement
    algorithm: chronological
    formula: |
      1. 收集该卖家所有 DELIVERED allocations（跨所有仓库）
      2. 按 offer.start_minute 升序排列
      3. running_seller_units = 0
      4. for each allocation in sorted order:
           quantity = offer.quantity_available
           running_seller_units += quantity
           gross_value = quantity * offer.unit_price
           net_value = gross_value - allocation.discount_amount
           if running_seller_units > VOLUME_TIER_THRESHOLD:
             excess = running_seller_units - VOLUME_TIER_THRESHOLD
             if excess >= quantity:
               final_commission = net_value * (base_rate * VOLUME_DISCOUNT_FACTOR)
             else:
               discounted_portion = excess
               full_portion = quantity - excess
               discounted_rev = (discounted_portion / quantity) * net_value
               full_rev = net_value - discounted_rev
               final_commission = full_rev * base_rate + discounted_rev * (base_rate * VOLUME_DISCOUNT_FACTOR)
           else:
             final_commission = net_value * base_rate
    constants: { VOLUME_TIER_THRESHOLD: 50000, VOLUME_DISCOUNT_FACTOR: 0.8 }
    precision: "2 decimal places, round_half_up"
    scope: "per-seller"
    key_insight: |
      provisional_commission（前瞻，包含所有 pending）和 final_commission（时序，按 start_minute 排列）
      对同一数据可能产生不同结果——这是第二组分歧计算。
      与运费分歧独立存在，使得总费用差异更加复杂。

  # ---- 规则 5：is_high_volume 判定 ----
  - name: is_high_volume
    trigger: 与 provisional_shipping_cost 同步计算
    algorithm: threshold
    formula: |
      使用与 provisional_shipping_cost 相同的"相关 allocations 集合"（per-center 维度）
      if total_units > SURGE_THRESHOLD:
        is_high_volume = true
      else:
        is_high_volume = false
    constants:
      SURGE_THRESHOLD: 10000
    note: "is_high_volume 触发 compliance_score 惩罚"

  # ---- 规则 6：折扣金额计算 ----
  - name: discount_amount
    trigger: allocation 创建时（如提供了 voucher_id）
    algorithm: conditional
    formula: |
      if voucher_id is null:
        discount_amount = 0
        return

      gross_value = offer.quantity_available * offer.unit_price

      前置验证:
        - voucher.status == ACTIVE（否则 ERR_VOUCHER_NOT_ACTIVE）
        - gross_value >= voucher.min_order_value（否则 ERR_ORDER_VALUE_BELOW_MINIMUM）

      计算:
        if voucher.discount_type == PERCENTAGE:
          raw_discount = gross_value * voucher.discount_value / 100
        else:  # FIXED_AMOUNT
          raw_discount = min(voucher.discount_value, gross_value)

        discount_amount = min(raw_discount, voucher.max_discount_cap)

      预算验证:
        - discount_amount <= voucher.budget_remaining（否则 ERR_VOUCHER_BUDGET_EXHAUSTED）

      副作用:
        - voucher.budget_remaining -= discount_amount
        - if voucher.budget_remaining <= 0: voucher.status = EXHAUSTED
    precision: "2 decimal places, round_half_up"

  # ---- 规则 7：fee_balance 更新 ----
  - name: fee_balance_update
    trigger: allocation 创建、dispatch、reject、cancel、finalize-settlement
    algorithm: aggregation
    formula: |
      provisional_total = provisional_shipping_cost + provisional_commission

      创建 allocation: fee_balance -= provisional_total
      dispatch: fee_balance += old_provisional_total - new_provisional_total（退旧扣新）
      reject/cancel: fee_balance += provisional_total（退款）
      finalize: fee_balance = fee_budget - sum(final_shipping_cost + final_commission) for all SETTLED allocations
    note: "seller_account.updated_at 和 seller_account.version 随每次 fee_balance 变化而递增"

  # ---- 规则 8：compliance_score 更新 ----
  - name: compliance_score
    trigger: allocation 创建、dispatch、reject、cancel
    algorithm: aggregation
    formula: |
      创建 allocation:
        if is_high_volume: compliance_score += HIGH_VOLUME_PENALTY
        if override_compliance_check AND compliance_score 已达 threshold:
          compliance_score += OVERRIDE_PENALTY
          compliance_override_penalty_applied = true
      dispatch: 重新计算 is_high_volume
        if 原来非 high_volume 现在变成 high_volume: compliance_score += HIGH_VOLUME_PENALTY
        if 原来 high_volume 现在变成非 high_volume: compliance_score -= HIGH_VOLUME_PENALTY
      reject/cancel: 退还之前加的所有罚分
      floor: max(0, score)  # 永不为负
    constants:
      HIGH_VOLUME_PENALTY: 30
      OVERRIDE_PENALTY: 80
      COMPLIANCE_THRESHOLD: 300  # 达到此值则阻止新 allocation（除非 override）
    note: "验证优先级：先检查 compliance_score 是否会超 threshold，再检查 fee_balance 是否充足"

  # ---- 规则 9：物流周转间隔检查 ----
  - name: logistics_turnaround_check
    trigger: allocation 创建时
    algorithm: time_gap
    formula: |
      对于同一仓库上的两个不同 product_category 的 offers:
        gap = later.start_minute - earlier.end_minute
        if gap < TURNAROUND_MINUTES:
          reject with ERR_FULFILLMENT_WINDOW_VIOLATION
      同一 product_category 的 offers 不需要周转间隔（可连续发货）
    constants:
      TURNAROUND_MINUTES: 60  # 1 小时

  # ---- 规则 10：发货限制检查 ----
  - name: shipping_restriction_check
    trigger: allocation 创建时
    algorithm: pairing
    formula: |
      如果两个仓库被标记为 ShippingRestriction 配对:
        且其中一个仓库已有 committed（非终态）allocation 在某个 sales_channel 中
        则另一个仓库不能被分配到同一 sales_channel 中的 product_offer

# =============================================================================
# 表 4: 验证规则表（按优先级排序，17 级验证链）
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID 和 X-User-Role headers 必须存在且有效"
    error_id: ERR_MISSING_OR_INVALID_AUTH_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "角色是否有权限执行此操作"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "路径中的资源ID是否存在（从左到右依次验证）"
    error_id: "ERR_{RESOURCE}_NOT_FOUND（按资源类型）"
    http_status: 404
    applies_to: all nested resource endpoints
    note: "先验 accountId，再验 channelId，再验 offerId，第一个不存在即返回"

  - priority: 4
    category: existence
    check: "请求体中引用的资源是否存在（product_offer_id, fulfillment_center_id, voucher_id）"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "POST /fulfillment-allocations"

  - priority: 5
    category: state
    check: "父卖家账户是否为 ACTIVE 状态"
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "创建子资源、修改子资源状态的所有端点"

  - priority: 6
    category: state
    check: "目标资源是否在正确的状态可执行当前操作"
    error_id: "varies（ERR_OFFER_NOT_PENDING, ERR_ALLOCATION_NOT_PENDING_REVIEW 等）"
    http_status: 409
    applies_to: 状态转换端点

  - priority: 7
    category: state
    check: "如提供 voucher_id，券是否为 ACTIVE 状态"
    error_id: ERR_VOUCHER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /fulfillment-allocations（有 voucher_id 时）"

  - priority: 8
    category: business_safety
    check: "仓库认证匹配 offer 的 required_warehouse_certification"
    error_id: ERR_CERTIFICATION_MISMATCH
    http_status: 400
    applies_to: "POST /fulfillment-allocations"

  - priority: 9
    category: business_validation
    check: "如有折扣券，商品总价 ≥ voucher.min_order_value"
    error_id: ERR_ORDER_VALUE_BELOW_MINIMUM
    http_status: 400
    applies_to: "POST /fulfillment-allocations（有 voucher_id 时）"

  - priority: 10
    category: business_validation
    check: "如有折扣券，discount_amount ≤ voucher.budget_remaining"
    error_id: ERR_VOUCHER_BUDGET_EXHAUSTED
    http_status: 402
    applies_to: "POST /fulfillment-allocations（有 voucher_id 时）"

  - priority: 11
    category: business_safety
    check: "物流周转间隔（不同 category 的 offers 之间 ≥ 60 分钟）"
    error_id: ERR_FULFILLMENT_WINDOW_VIOLATION
    http_status: 409
    applies_to: "POST /fulfillment-allocations"

  - priority: 12
    category: business_safety
    check: "发货限制检查（限制配对仓库不能在同一 channel）"
    error_id: ERR_SHIPPING_RESTRICTION_CONFLICT
    http_status: 409
    applies_to: "POST /fulfillment-allocations"

  - priority: 13
    category: business_safety
    check: "仓库容量检查（累计发货量 ≤ max_capacity）"
    error_id: ERR_WAREHOUSE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /fulfillment-allocations"

  - priority: 14
    category: business_safety
    check: "合规评分是否会达到/超过阈值 300（且未设置 override）"
    error_id: ERR_COMPLIANCE_THRESHOLD_BREACHED
    http_status: 403
    applies_to: "POST /fulfillment-allocations"

  - priority: 15
    category: business_fiscal
    check: "费用预算是否充足（provisional_total ≤ fee_balance）"
    error_id: ERR_INSUFFICIENT_FEE_BUDGET
    http_status: 402
    applies_to: "POST /fulfillment-allocations"

# =============================================================================
# 表 5: API 端点表（完整 33 个端点）
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "uuid", "api_request_timestamp": "ISO8601",
      "limit": 10, "offset": 0, "total_count": N, "has_more": bool },
      "response_type": "object" | "array", "data": {} | [] }
  error: |
    { "meta": { "api_request_id": "uuid", "api_request_timestamp": "ISO8601" },
      "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }
  sorting: "created_at ascending"

endpoints:
  # --- SellerAccount (6) ---
  - method: POST
    path: "/seller-accounts"
    description: "Create a new Seller Account"
    roles: [SellerManager]
    code: 201
    input: [seller_name, business_category, base_commission_rate, fee_budget]
    output: SellerAccount
    side_effects: ["fee_balance 初始化为 fee_budget, compliance_score 初始化为 0"]

  - method: GET
    path: "/seller-accounts"
    description: "List all Seller Accounts"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "SellerAccount[]"
    side_effects: []

  - method: GET
    path: "/seller-accounts/{accountId}"
    description: "Get a specific Seller Account"
    roles: [Any]
    code: 200
    input: []
    output: SellerAccount
    side_effects: []

  - method: POST
    path: "/seller-accounts/{accountId}/activate"
    description: "Activate a seller account"
    roles: [SettlementAdmin]
    code: 200
    input: []
    output: SellerAccount
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/seller-accounts/{accountId}/initiate-settlement"
    description: "Move account to settlement pending state"
    roles: [OrderProcessor]
    code: 200
    input: []
    output: SellerAccount
    side_effects:
      - "status → SETTLEMENT_PENDING"
      - "前提：无未解决的 allocations（ERR_UNRESOLVED_ALLOCATIONS_EXIST）"

  - method: POST
    path: "/seller-accounts/{accountId}/finalize-settlement"
    description: "Finalize costs and settle the account"
    roles: [SettlementAdmin]
    code: 200
    input: []
    output: SellerAccount
    side_effects:
      - "status → SETTLED"
      - "所有 DELIVERED allocations → 计算 final_shipping_cost + final_commission → SETTLED"
      - "所有 CONFIRMED offers → FULFILLED"
      - "所有 READY_FOR_DISPATCH channels → FULFILLED"
      - "fee_balance 最终结算"
      - "前提：sum(final costs) ≤ fee_budget（ERR_SETTLEMENT_EXCEEDS_BUDGET）"

  # --- SalesChannel (4) ---
  - method: POST
    path: "/seller-accounts/{accountId}/sales-channels"
    description: "Create a new Sales Channel within a Seller Account"
    roles: [SellerManager]
    code: 201
    input: [channel_name, start_minute, end_minute]
    output: SalesChannel
    side_effects: []

  - method: GET
    path: "/seller-accounts/{accountId}/sales-channels"
    description: "List Sales Channels for a Seller Account"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "SalesChannel[]"
    side_effects: []

  - method: GET
    path: "/seller-accounts/{accountId}/sales-channels/{channelId}"
    description: "Get a specific Sales Channel"
    roles: [Any]
    code: 200
    input: []
    output: SalesChannel
    side_effects: []

  - method: PUT
    path: "/seller-accounts/{accountId}/sales-channels/{channelId}"
    description: "Update a Sales Channel's status"
    roles: [OrderProcessor]
    code: 200
    input: ["status, version?"]
    output: SalesChannel
    side_effects: ["状态转换 + 可能的 cascade 取消"]

  # --- ProductOffer (4) ---
  - method: POST
    path: "/seller-accounts/{accountId}/sales-channels/{channelId}/product-offers"
    description: "Create a new Product Offer within a Sales Channel"
    roles: [SellerManager]
    code: 201
    input: ["product_name, product_category, unit_price, quantity_available, required_warehouse_certification?, start_minute, end_minute"]
    output: ProductOffer
    side_effects: ["duration_minutes 自动计算"]

  - method: GET
    path: "/seller-accounts/{accountId}/sales-channels/{channelId}/product-offers"
    description: "List Product Offers for a Sales Channel"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "ProductOffer[]"
    side_effects: []

  - method: GET
    path: "/seller-accounts/{accountId}/sales-channels/{channelId}/product-offers/{offerId}"
    description: "Get a specific Product Offer"
    roles: [Any]
    code: 200
    input: []
    output: ProductOffer
    side_effects: []

  - method: POST
    path: "/seller-accounts/{accountId}/sales-channels/{channelId}/product-offers/{offerId}/cancel"
    description: "Cancel a specific Product Offer"
    roles: [SellerManager]
    code: 200
    input: []
    output: ProductOffer
    side_effects: ["status → CANCELLED（仅 PENDING 状态可取消）"]

  # --- FulfillmentCenter (4) ---
  - method: POST
    path: "/seller-accounts/{accountId}/fulfillment-centers"
    description: "Create a new Fulfillment Center profile for a Seller Account"
    roles: [SellerManager]
    code: 201
    input: [center_name, center_region, cost_per_unit, max_capacity]
    output: FulfillmentCenter
    side_effects: ["warehouse_certifications 初始化为空数组"]

  - method: GET
    path: "/seller-accounts/{accountId}/fulfillment-centers"
    description: "List Fulfillment Center profiles for a Seller Account"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "FulfillmentCenter[]"
    side_effects: []

  - method: GET
    path: "/seller-accounts/{accountId}/fulfillment-centers/{centerId}"
    description: "Get a specific Fulfillment Center profile"
    roles: [Any]
    code: 200
    input: []
    output: FulfillmentCenter
    side_effects: []

  - method: POST
    path: "/seller-accounts/{accountId}/fulfillment-centers/{centerId}/certifications"
    description: "Add a certification to a Fulfillment Center"
    roles: [SellerManager]
    code: 200
    input: ["name (COLD_CHAIN_CERTIFIED | HAZMAT_LICENSED | FRAGILE_HANDLING), certified_date"]
    output: FulfillmentCenter
    side_effects: ["认证添加到 warehouse_certifications 数组"]

  # --- FulfillmentAllocation (8) ---
  - method: POST
    path: "/seller-accounts/{accountId}/fulfillment-allocations"
    description: "Propose a new Fulfillment Allocation for a Product Offer"
    roles: [SellerManager]
    code: 201
    input: ["product_offer_id, fulfillment_center_id, voucher_id?, override_compliance_check?"]
    output: FulfillmentAllocation
    side_effects:
      - "计算 discount_amount（如有折扣券）"
      - "计算 provisional_shipping_cost（前瞻性，per-center）"
      - "计算 provisional_commission（前瞻性，per-seller）"
      - "扣减 fee_balance"
      - "计算 is_high_volume"
      - "更新 compliance_score"
      - "扣减 voucher.budget_remaining（如有折扣券）"
      - "offer 状态 → RESERVED"
      - "触发完整 17 级验证链"

  - method: GET
    path: "/seller-accounts/{accountId}/fulfillment-allocations"
    description: "List all Fulfillment Allocations for a Seller Account"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "FulfillmentAllocation[]"
    side_effects: []

  - method: GET
    path: "/seller-accounts/{accountId}/fulfillment-allocations/{allocationId}"
    description: "Get a specific Fulfillment Allocation"
    roles: [Any]
    code: 200
    input: []
    output: FulfillmentAllocation
    side_effects: []

  - method: POST
    path: "/seller-accounts/{accountId}/fulfillment-allocations/{allocationId}/reject"
    description: "Reject a proposed Fulfillment Allocation"
    roles: [OrderProcessor]
    code: 200
    input: []
    output: FulfillmentAllocation
    side_effects:
      - "status → REJECTED"
      - "offer 回退到 PENDING"
      - "退还 fee_balance"
      - "退还 compliance_score 罚分"
      - "退还 voucher.budget_remaining（如有折扣券，券可能从 EXHAUSTED 回退到 ACTIVE）"

  - method: POST
    path: "/seller-accounts/{accountId}/fulfillment-allocations/{allocationId}/cancel"
    description: "Cancel a Fulfillment Allocation"
    roles: [OrderProcessor]
    code: 200
    input: []
    output: FulfillmentAllocation
    side_effects:
      - "status → CANCELLED"
      - "offer 回退到 PENDING（RESERVED→PENDING 或 CONFIRMED→PENDING）"
      - "退还 fee_balance"
      - "退还 compliance_score 罚分"
      - "退还 voucher.budget_remaining"

  - method: POST
    path: "/seller-accounts/{accountId}/fulfillment-allocations/{allocationId}/quality-check"
    description: "Quality Check approve a proposed Allocation"
    roles: [OrderProcessor]
    code: 200
    input: []
    output: FulfillmentAllocation
    side_effects: ["status → QUALITY_CHECKED"]

  - method: POST
    path: "/seller-accounts/{accountId}/fulfillment-allocations/{allocationId}/dispatch"
    description: "Dispatch a Quality Checked Allocation"
    roles: [OrderProcessor]
    code: 200
    input: []
    output: FulfillmentAllocation
    side_effects:
      - "status → DISPATCHED"
      - "offer 状态 → CONFIRMED"
      - "重新计算 provisional_shipping_cost（per-center, 只看 start_minute 之前的 DISPATCHED）"
      - "重新计算 provisional_commission（per-seller, 只看 start_minute 之前的 DISPATCHED）"
      - "fee_balance 调整（退旧 provisional + 扣新 provisional）"
      - "is_high_volume 可能变化"
      - "compliance_score 可能调整"

  - method: POST
    path: "/seller-accounts/{accountId}/fulfillment-allocations/{allocationId}/confirm-delivery"
    description: "Confirm delivery of a Dispatched Allocation"
    roles: [OrderProcessor]
    code: 200
    input: []
    output: FulfillmentAllocation
    side_effects: ["status → DELIVERED"]

  # --- ShippingRestriction (3) ---
  - method: POST
    path: "/seller-accounts/{accountId}/shipping-restrictions"
    description: "Create a Shipping Restriction within a Seller Account"
    roles: [SellerManager]
    code: 201
    input: ["fulfillment_center_id_1, fulfillment_center_id_2, reason?"]
    output: ShippingRestriction
    side_effects: []

  - method: GET
    path: "/seller-accounts/{accountId}/shipping-restrictions"
    description: "List Shipping Restrictions for a Seller Account"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "ShippingRestriction[]"
    side_effects: []

  - method: GET
    path: "/seller-accounts/{accountId}/shipping-restrictions/{restrictionId}"
    description: "Get a specific Shipping Restriction"
    roles: [Any]
    code: 200
    input: []
    output: ShippingRestriction
    side_effects: []

  # --- DiscountVoucher (4) ---
  - method: POST
    path: "/seller-accounts/{accountId}/discount-vouchers"
    description: "Create a new Discount Voucher for a Seller Account"
    roles: [SellerManager]
    code: 201
    input: ["voucher_code, discount_type, discount_value, min_order_value, max_discount_cap, total_budget"]
    output: DiscountVoucher
    side_effects: ["budget_remaining 初始化为 total_budget"]

  - method: GET
    path: "/seller-accounts/{accountId}/discount-vouchers"
    description: "List Discount Vouchers for a Seller Account"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "DiscountVoucher[]"
    side_effects: []

  - method: GET
    path: "/seller-accounts/{accountId}/discount-vouchers/{voucherId}"
    description: "Get a specific Discount Voucher"
    roles: [Any]
    code: 200
    input: []
    output: DiscountVoucher
    side_effects: []

  - method: POST
    path: "/seller-accounts/{accountId}/discount-vouchers/{voucherId}/activate"
    description: "Activate a Discount Voucher"
    roles: [SellerManager]
    code: 200
    input: []
    output: DiscountVoucher
    side_effects: ["status → ACTIVE"]

# =============================================================================
# 表 6: 错误码目录（完整 40 个错误码）
# =============================================================================
errors:
  # --- 认证与权限 ---
  - id: ERR_MISSING_OR_INVALID_AUTH_HEADER
    http: 400
    condition: "X-User-ID 或 X-User-Role header 缺失或无效"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "当前角色无权执行此操作"

  # --- 资源不存在 ---
  - id: ERR_SELLER_ACCOUNT_NOT_FOUND
    http: 404
    condition: "accountId 对应的卖家账户不存在"

  - id: ERR_SALES_CHANNEL_NOT_FOUND
    http: 404
    condition: "channelId 对应的销售渠道不存在"

  - id: ERR_PRODUCT_OFFER_NOT_FOUND
    http: 404
    condition: "offerId 对应的商品上架不存在"

  - id: ERR_FULFILLMENT_CENTER_NOT_FOUND
    http: 404
    condition: "centerId / fulfillment_center_id 对应的仓储节点不存在"

  - id: ERR_FULFILLMENT_ALLOCATION_NOT_FOUND
    http: 404
    condition: "allocationId 对应的物流分配不存在"

  - id: ERR_SHIPPING_RESTRICTION_NOT_FOUND
    http: 404
    condition: "restrictionId 对应的发货限制不存在"

  - id: ERR_VOUCHER_NOT_FOUND
    http: 404
    condition: "voucherId / voucher_id 对应的折扣券不存在"

  # --- 状态约束：账户 ---
  - id: ERR_ACCOUNT_NOT_ACTIVE
    http: 409
    condition: "操作要求卖家账户处于 ACTIVE 状态，但当前不是"

  - id: ERR_ACCOUNT_NOT_IN_ONBOARDING
    http: 409
    condition: "activate 要求账户处于 ONBOARDING 状态"

  - id: ERR_ACCOUNT_NOT_READY_FOR_SETTLEMENT
    http: 409
    condition: "finalize-settlement 要求账户处于 SETTLEMENT_PENDING 状态"

  # --- 状态约束：渠道 ---
  - id: ERR_ILLEGAL_CHANNEL_STATE_TRANSITION
    http: 409
    condition: "渠道状态转换不合法（如从 FULFILLED 转到其他状态）"

  # --- 状态约束：商品上架 ---
  - id: ERR_OFFER_NOT_PENDING
    http: 409
    condition: "创建 allocation 时 offer 必须为 PENDING 状态"

  - id: ERR_OFFER_NOT_PENDING_FOR_CANCEL
    http: 409
    condition: "取消 offer 时必须为 PENDING 状态"

  # --- 状态约束：物流分配 ---
  - id: ERR_ALLOCATION_NOT_PENDING_REVIEW
    http: 409
    condition: "quality-check / reject 要求 allocation 处于 PENDING_REVIEW 状态"

  - id: ERR_ALLOCATION_NOT_QUALITY_CHECKED
    http: 409
    condition: "dispatch 要求 allocation 处于 QUALITY_CHECKED 状态"

  - id: ERR_ALLOCATION_NOT_DISPATCHED
    http: 409
    condition: "confirm-delivery 要求 allocation 处于 DISPATCHED 状态"

  - id: ERR_ALLOCATION_NOT_CANCELLABLE
    http: 409
    condition: "cancel 要求 allocation 处于可取消状态（PENDING_REVIEW, QUALITY_CHECKED, DISPATCHED）"

  # --- 状态约束：折扣券 ---
  - id: ERR_VOUCHER_NOT_ACTIVE
    http: 409
    condition: "使用折扣券时券必须处于 ACTIVE 状态"

  - id: ERR_VOUCHER_NOT_DRAFT
    http: 409
    condition: "activate 要求折扣券处于 DRAFT 状态"

  # --- 业务验证：时间 ---
  - id: ERR_INVALID_CHANNEL_MINUTES
    http: 400
    condition: "渠道时间参数无效（非整数、end ≤ start、负数等）"

  - id: ERR_INVALID_OFFER_MINUTES
    http: 400
    condition: "商品上架时间参数无效（非整数、end ≤ start、负数等）"

  - id: ERR_OFFER_TIME_OUTSIDE_CHANNEL
    http: 400
    condition: "offer 的时间窗口超出其所属 channel 的时间范围"

  # --- 业务验证：数据 ---
  - id: ERR_INVALID_OFFER_QUANTITY
    http: 400
    condition: "quantity_available 不是正整数"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "通用请求格式错误（缺少必填字段、类型不匹配等）"

  # --- 业务安全 ---
  - id: ERR_CERTIFICATION_MISMATCH
    http: 400
    condition: "仓库不具备 offer 要求的认证"

  - id: ERR_FULFILLMENT_WINDOW_VIOLATION
    http: 409
    condition: "同一仓库上不同 category 的 offers 之间物流周转间隔不足 60 分钟"

  - id: ERR_SHIPPING_RESTRICTION_CONFLICT
    http: 409
    condition: "已配对限制的两个仓库不能同时出现在同一 channel 中（其中一个已有 committed allocation）"

  - id: ERR_WAREHOUSE_CAPACITY_EXCEEDED
    http: 409
    condition: "仓库累计分配量超过 max_capacity"

  - id: ERR_SELF_RESTRICTION
    http: 400
    condition: "尝试将仓库与自身配对（center_id_1 == center_id_2）"

  - id: ERR_DUPLICATE_RESTRICTION
    http: 409
    condition: "同一账户中已存在相同仓库对的限制（无序：{A,B} == {B,A}）"

  # --- 折扣券 ---
  - id: ERR_ORDER_VALUE_BELOW_MINIMUM
    http: 400
    condition: "商品总价（quantity × unit_price）低于折扣券的 min_order_value"

  - id: ERR_VOUCHER_BUDGET_EXHAUSTED
    http: 402
    condition: "计算出的 discount_amount 超过折扣券的 budget_remaining"

  # --- 合规与财务 ---
  - id: ERR_COMPLIANCE_THRESHOLD_BREACHED
    http: 403
    condition: "新 allocation 会使 compliance_score 达到/超过 300 阈值，且未设置 override_compliance_check"

  - id: ERR_INSUFFICIENT_FEE_BUDGET
    http: 402
    condition: "provisional_total（运费+佣金）超过当前 fee_balance"

  - id: ERR_SETTLEMENT_EXCEEDS_BUDGET
    http: 402
    condition: "finalize 时所有 final 费用总和超过 fee_budget"

  # --- 流程约束 ---
  - id: ERR_OFFERS_NOT_CONFIRMED
    http: 409
    condition: "渠道转 READY_FOR_DISPATCH 时，并非所有 offers 都已 CONFIRMED"

  - id: ERR_UNRESOLVED_ALLOCATIONS_EXIST
    http: 409
    condition: "initiate-settlement 时存在未解决的 allocations（PENDING_REVIEW 或 QUALITY_CHECKED）"

  # --- 并发控制 ---
  - id: ERR_STALE_DATA
    http: 409
    condition: "请求中的 version 与服务器当前 version 不匹配（乐观并发控制）"

# =============================================================================
# RBAC 角色权限矩阵
# =============================================================================
roles:
  - name: SellerManager
    description: "卖家运营，负责店铺管理、商品上架、仓储配置和分配提案"
    exclusive_operations:
      - "POST /seller-accounts — 创建卖家账户"
      - "POST .../sales-channels — 创建销售渠道"
      - "POST .../product-offers — 创建商品上架"
      - "POST .../product-offers/{id}/cancel — 取消商品上架"
      - "POST .../fulfillment-centers — 创建仓储节点"
      - "POST .../fulfillment-centers/{id}/certifications — 添加仓库认证"
      - "POST .../fulfillment-allocations — 提出物流分配提案"
      - "POST .../shipping-restrictions — 创建发货限制"
      - "POST .../discount-vouchers — 创建折扣券"
      - "POST .../discount-vouchers/{id}/activate — 激活折扣券"

  - name: OrderProcessor
    description: "订单处理员，负责审核分配、物流管控和结算发起"
    exclusive_operations:
      - "PUT .../sales-channels/{id} — 更新渠道状态（开放/取消）"
      - "POST .../fulfillment-allocations/{id}/quality-check — 质检通过"
      - "POST .../fulfillment-allocations/{id}/dispatch — 确认发货"
      - "POST .../fulfillment-allocations/{id}/confirm-delivery — 确认送达"
      - "POST .../fulfillment-allocations/{id}/reject — 拒绝分配"
      - "POST .../fulfillment-allocations/{id}/cancel — 取消分配"
      - "POST .../initiate-settlement — 发起结算"

  - name: SettlementAdmin
    description: "结算管理员，负责账户激活和最终清算"
    exclusive_operations:
      - "POST .../activate — 激活卖家账户"
      - "POST .../finalize-settlement — 最终结算"

  - name: Any
    description: "所有角色共享"
    shared_operations:
      - "GET /seller-accounts — 查看账户列表"
      - "GET /seller-accounts/{accountId} — 查看账户详情"
      - "GET .../sales-channels — 查看渠道列表"
      - "GET .../sales-channels/{channelId} — 查看渠道详情"
      - "GET .../product-offers — 查看商品上架列表"
      - "GET .../product-offers/{offerId} — 查看商品上架详情"
      - "GET .../fulfillment-centers — 查看仓库列表"
      - "GET .../fulfillment-centers/{centerId} — 查看仓库详情"
      - "GET .../fulfillment-allocations — 查看分配列表"
      - "GET .../fulfillment-allocations/{allocationId} — 查看分配详情"
      - "GET .../shipping-restrictions — 查看限制列表"
      - "GET .../shipping-restrictions/{restrictionId} — 查看限制详情"
      - "GET .../discount-vouchers — 查看折扣券列表"
      - "GET .../discount-vouchers/{voucherId} — 查看折扣券详情"

# =============================================================================
# 复杂度对照（vs hospital-shifts v1）
# =============================================================================
# 维度                    | hospital-shifts | e-commerce
# ----------------------- | --------------- | ----------
# 实体数                   | 6               | 7（+DiscountVoucher）
# 状态机数                  | 4               | 5（+DiscountVoucher 含自动回退）
# 总状态数                  | 19              | 23
# 计算规则数                | ~8              | 10
# 分歧计算组数              | 1（运费）        | 2（运费 + 佣金，且方向相反）
# 独立账本数                | 1（cost_balance）| 2（fee_balance + voucher.budget_remaining）
# API 端点数                | 29              | 33
# 错误码数                  | 32              | 40
# 验证链最大深度             | 10              | 15
# 嵌入常量数                | ~5              | 9
# 认证类型数                | 2               | 3
