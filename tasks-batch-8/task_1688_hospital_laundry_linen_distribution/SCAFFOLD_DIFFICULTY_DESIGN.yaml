            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "ISO-GOWN", display_name: "Isolation Gown", category: "ISOLATION", piece_weight_lbs: 0.50, unit_cost_cents: 300, max_wash_cycles: 30, reorder_point_pieces: 10, opening_pieces: 200, opening_reserve_pieces: 20 }, as: LinenManager, as_user_id: "lm-1", captures: { s2: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1", captures: { p1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s2}", base_par_quantity: 30, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1", captures: { p2: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u2}", stock_id: "${s1}", base_par_quantity: 10, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1", captures: { p3: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u2}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r2: $.data.id } }
            - { call: "POST /cart-runs/${r2}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /surge-events", payload: { facility_id: "${fac}", severity: "LEVEL_2", par_multiplier: 1.5, starts_at: "2026-08-03T00:00:00Z", ends_at: "2026-08-10T00:00:00Z" }, as: LinenManager, as_user_id: "lm-1", captures: { sg: $.data.id } }
          trigger:
            - { call: "POST /surge-events/${sg}/activate", payload: {}, as: LinenManager, as_user_id: "lm-1" }
            - { call: "GET /facilities/${fac}", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { posture: $.data.surge_posture } }
            - { call: "GET /par-levels/${p1}", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { p1_eff: $.data.effective_par, p1_hand: $.data.on_hand } }
            - { call: "GET /par-levels/${p2}", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { p2_eff: $.data.effective_par, p2_hand: $.data.on_hand } }
