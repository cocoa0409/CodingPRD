        grounds: ["calculations.corporate_rollup_metrics", "endpoints[POST /corporate-rollups]"]
        distinguishing_aspect: "Membership is decided by date(captured_at) against the inclusive period, so a 2000 g capture on 2026-08-02 is invisible to a rollup whose period is 2026-08-01 to 2026-08-01 even though the entry belongs to the in-scope site."
        test_recipe:
          setup: ["Site HK-01 with a 1000 g capture on 2026-08-01 (AM shift, 250 meals) and a 2000 g capture on 2026-08-02 (AM shift, 250 meals) after the clock advances. The rollup period is the single day 2026-08-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: "*"
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Chicken Breast", category: "PROTEIN", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: false, compostable: true, donation_shelf_life_hours: 720 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-08-01", shift_code: "AM", meals_served: 250 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { day1_shift_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${day1_shift_id}", food_type_id: "${food_type_id}", weight_grams: 1000, loss_reason: "TRIM", captured_at: "2026-08-01T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T12:00:00Z" }
              as: "*"
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-08-02", shift_code: "AM", meals_served: 250 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { day2_shift_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${day2_shift_id}", food_type_id: "${food_type_id}", weight_grams: 2000, loss_reason: "TRIM", captured_at: "2026-08-02T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
          trigger:
            - call: "POST /corporate-rollups"
              payload: { period_start: "2026-08-01", period_end: "2026-08-01", site_ids: ["${site_id}"] }
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
          assert:
            - "HTTP 201 with total_captured_weight_grams == 1000 and total_valued_cost_cents == 640 — only the first day counts"
            - "GET /sites/${site_id} independently reports total_captured_weight_grams == 3000, so the difference is the period filter and not a missing row"
            - "GET /waste-entries?site_id=${site_id} returns total_count == 2"

      - name: recipe_cost_per_kg_line_rounding_order
        claim_type: aggregation
        grounds: ["calculations.recipe_cost_per_kg", "calculations.recipe_cost_per_kg.constants[LINE_ROUNDING_ORDER]"]
        excluded_because:
          difficulty_instance: recipe_cost_per_kg_rounds_per_line_before_summing
          rationale: "The depth probe asserts the pinned per-line rounding against the sum-then-round result (1029 versus 1028) on the canonical three-line recipe, which is the only observable difference this rule has."

      - name: hauler_ticket_settlement_tier_selection
        claim_type: tiered_pricing
        grounds: ["calculations.hauler_ticket_settlement", "calculations.hauler_ticket_settlement.constants[SURCHARGE_TIER_2_CENTS]"]
        excluded_because:
          difficulty_instance: hauler_ticket_surcharge_tier_keyed_on_base_fee_not_on_subtotal
          rationale: "Tier boundaries, the keying trap and the cross-tier straddle are all exercised by the depth probe's worked 15688-versus-16132 case."

      - name: leaderboard_score_weighting
        claim_type: weighted_scoring
        grounds: ["calculations.shift_leaderboard_score", "calculations.shift_leaderboard_score.constants[PENALTY_CAP]"]
        excluded_because:
          difficulty_instance: shift_leaderboard_score_weights_penalty_cap_and_conditional_bonus
          rationale: "Weight application, the clamped penalty and the conditional pre-consumer bonus are all asserted together by the depth probe; splitting them out would only re-run the same arithmetic."

      - name: valuation_variant_divergence
        claim_type: variant_divergence
        grounds: ["calculations.waste_entry_valuation.variants", "entities.WasteEntry.valuation_delta_cents"]
        excluded_because:
          difficulty_instance: waste_entry_valuation_catalog_provisional_versus_recipe_final_delta
          rationale: "Same grams valued under both variants with the 1568 / 2521 / 953 delta is exactly the divergence claim, already asserted in depth."

      - name: valuation_variant_reconciliation_on_shift_close
        claim_type: reconciliation
        grounds: ["state_machines.Shift.OPEN_to_CLOSED", "calculations.waste_entry_valuation", "calculations.site_waste_aggregates"]
        excluded_because:
          difficulty_instance: close_shift_cascades_four_hops_along_the_money_path_and_expires_the_alert
          rationale: "The provisional-to-final switch and the resulting delta applied to Site.valued_waste_cost_cents are walked hop by hop by the depth probe."

      - name: forward_looking_valuation_reacts_to_a_pending_change
        claim_type: forward_looking
        grounds: ["calculations.waste_entry_valuation", "endpoints[POST /waste-entries/{id}/corrections]"]
        excluded_because:
          difficulty_instance: voiding_a_correcting_entry_restores_the_site_cost_ledger_to_the_exact_cent
          rationale: "The forward-looking property — a still-pending correction changes the valuation that the ledger carries, and reverting it restores the prior cent — is asserted end to end by the depth probe."

  # =========================================================================
  # validations
  # =========================================================================
  - section: validations
    instances:
      - name: capture_without_a_role_header_is_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_UNAUTHENTICATED]", "endpoints[POST /waste-entries]"]
        distinguishing_aspect: "Priority 10 fires before any body parsing, so a request with a well-formed payload but no X-User-Role header is 401 rather than 400 or 404."
        test_recipe:
          setup: ["Site HK-01, station PREP-1, food type, OPEN AM shift. The trigger sends a fully valid capture body with no X-User-Role and no X-User-ID header at all."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: "*"
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Chicken Breast", category: "PROTEIN", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: false, compostable: true, donation_shelf_life_hours: 720 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-08-01", shift_code: "AM", meals_served: 250 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
          trigger:
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 1000, loss_reason: "TRIM", captured_at: "2026-08-01T10:00:00Z" }
              as: "(no X-User-Role header)"
          assert:
            - "HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "GET /waste-entries?shift_id=${shift_id} returns total_count == 0 — nothing was written"

      - name: role_check_outranks_body_schema_and_returns_403
        claim_type: priority_ordering
        grounds: ["validations[priority=20]", "validations[priority=30]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Two rules are violated at once — KitchenStaff is not on POST /sites and the body is missing site_code — and the lower priority number wins, so the answer is 403 ERR_UNAUTHORIZED, never 400."
        test_recipe:
          setup: ["Empty database; the clock is left at its default."]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", region_code: "NE" }
              as: KitchenStaff
              as_user_id: "ks-1"
          assert:
            - "HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\" (not ERR_INVALID_REQUEST)"
            - "GET /sites as PlatformAdmin returns total_count == 0"

      - name: site_manager_identity_that_is_not_a_site_is_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=25]", "errors[ERR_IDENTITY_NOT_RECOGNIZED]", "rbac.SiteSustainabilityManager"]
        distinguishing_aspect: "SiteSustainabilityManager is entity_backed by Site, so an X-User-ID that resolves to no Site row is refused at priority 25 — before the body's own site_id is even looked up."
        test_recipe:
          setup: ["Site HK-01 exists. The trigger acts as SiteSustainabilityManager with an X-User-ID that is a syntactically valid but unknown identifier."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: "*"
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
          trigger:
            - call: "POST /baseline-periods"
              payload: { site_id: "${site_id}", start_date: "2026-08-01", end_date: "2026-08-01" }
              as: SiteSustainabilityManager
              as_user_id: "00000000-0000-0000-0000-0000000000ff"
          assert:
            - "HTTP 403 with data.error_id == \"ERR_IDENTITY_NOT_RECOGNIZED\""
            - "GET /baseline-periods?site_id=${site_id} returns total_count == 0"

      - name: pagination_limit_above_one_hundred_is_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=35]", "errors[ERR_INVALID_PAGINATION]", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "The declared maximum limit is 100, so 101 is a pagination error rather than a silently clamped page — and it is reported as ERR_INVALID_PAGINATION, not the generic schema error."
        test_recipe:
          setup: ["One site exists so the listing would otherwise return a row."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "GET /sites?limit=101"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_PAGINATION\""
            - "GET /sites?limit=100 succeeds with HTTP 200 and total_count == 1"

      - name: site_manager_cannot_open_a_baseline_for_another_site
        claim_type: violation_to_error
        grounds: ["validations[priority=50]", "errors[ERR_SITE_SCOPE_VIOLATION]", "rbac.SiteSustainabilityManager"]
        distinguishing_aspect: "The scope rule compares the body's site_id against the acting identity, so a recognised manager of HK-01 is still refused on a body naming HK-02 — a 403 that is distinct from both the identity check and any 404."
        test_recipe:
          setup: ["Two sites, HK-01 and HK-02, both created by the platform admin. The actor is the recognised manager of HK-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: "*"
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_a_id: "$.data.id" }
            - call: "POST /sites"
              payload: { name: "Hillside Kitchen", site_code: "HK-02", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_b_id: "$.data.id" }
          trigger:
            - call: "POST /baseline-periods"
              payload: { site_id: "${site_b_id}", start_date: "2026-08-01", end_date: "2026-08-01" }
              as: SiteSustainabilityManager
              as_user_id: "${site_a_id}"
          assert:
            - "HTTP 403 with data.error_id == \"ERR_SITE_SCOPE_VIOLATION\""
            - "GET /baseline-periods?site_id=${site_b_id} returns total_count == 0"

      - name: hauler_cannot_dispatch_another_haulers_consignment
        claim_type: violation_to_error
        grounds: ["validations[priority=52]", "errors[ERR_HAULER_SCOPE_VIOLATION]", "rbac.HaulerOperator"]
        distinguishing_aspect: "HaulerOperator is entity_backed by Hauler, and the peer check at priority 52 fires before the consignment's own state is examined, so a second approved hauler cannot dispatch a STAGED load that is not theirs."
        test_recipe:
          setup: ["Site HK-01 with a 1000 g capture; two APPROVED haulers, Green Haul and Blue Haul; a COMPOST consignment on Green Haul carrying one 400 g line and already STAGED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: "*"
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Chicken Breast", category: "PROTEIN", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: false, compostable: true, donation_shelf_life_hours: 720 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-08-01", shift_code: "AM", meals_served: 250 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 1000, loss_reason: "TRIM", captured_at: "2026-08-01T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { entry_id: "$.data.id" }
            - call: "POST /haulers"
              payload: { name: "Green Haul", channels: ["COMPOST"], rate_cents_per_tonne: 52000, stop_fee_cents: 1800, capacity_kg_per_pickup: 500 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { hauler_a_id: "$.data.id" }
            - call: "POST /haulers"
              payload: { name: "Blue Haul", channels: ["COMPOST"], rate_cents_per_tonne: 49000, stop_fee_cents: 1500, capacity_kg_per_pickup: 500 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { hauler_b_id: "$.data.id" }
            - call: "POST /haulers/${hauler_a_id}/approve"
              payload: {}
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
            - call: "POST /haulers/${hauler_b_id}/approve"
              payload: {}
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
            - call: "POST /diversion-consignments"
              payload: { site_id: "${site_id}", hauler_id: "${hauler_a_id}", channel: "COMPOST", pickup_window_start: "2026-08-02T09:00:00Z", pickup_window_end: "2026-08-02T11:00:00Z" }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
              captures: { consignment_id: "$.data.id" }
            - call: "POST /consignment-lines"
              payload: { consignment_id: "${consignment_id}", waste_entry_id: "${entry_id}", allocated_weight_grams: 400 }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
            - call: "POST /diversion-consignments/${consignment_id}/stage"
              payload: {}
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
          trigger:
            - call: "POST /diversion-consignments/${consignment_id}/dispatch"
              payload: {}
              as: HaulerOperator
              as_user_id: "${hauler_b_id}"
          assert:
            - "HTTP 403 with data.error_id == \"ERR_HAULER_SCOPE_VIOLATION\""
            - "GET /diversion-consignments/${consignment_id} still shows logistics_status == \"STAGED\""
            - "the same call as HaulerOperator ${hauler_a_id} then succeeds with logistics_status == \"DISPATCHED\""

      - name: unknown_correction_path_id_outranks_the_unknown_body_food_type_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=40]", "validations[priority=45]", "errors[ERR_ENTRY_NOT_FOUND]"]
        distinguishing_aspect: "Path existence at priority 40 is settled before body foreign keys at priority 45, so a correction aimed at a non-existent entry with a non-existent food_type_id answers ERR_ENTRY_NOT_FOUND, not ERR_FOOD_TYPE_NOT_FOUND."
        test_recipe:
          setup: ["Site HK-01 with one real RECORDED capture, whose version is read only so the correction body can carry a well-formed expected_entry_version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: "*"
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Chicken Breast", category: "PROTEIN", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: false, compostable: true, donation_shelf_life_hours: 720 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-08-01", shift_code: "AM", meals_served: 250 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 1000, loss_reason: "TRIM", captured_at: "2026-08-01T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { entry_version: "$.data.version" }
          trigger:
            - call: "POST /waste-entries/00000000-0000-0000-0000-0000000000ff/corrections"
              payload: { expected_entry_version: "${entry_version}", correction_note: "aimed at nothing", food_type_id: "00000000-0000-0000-0000-0000000000fe" }
              as: ShiftLead
              as_user_id: "sl-2"
          assert:
            - "HTTP 404 with data.error_id == \"ERR_ENTRY_NOT_FOUND\""
            - "GET /waste-entries?shift_id=${shift_id} still returns total_count == 1"

      - name: capture_timestamped_after_the_clock_is_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=82]", "errors[ERR_CAPTURE_IN_FUTURE]", "endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "captured_at is compared against the logical clock, not against wall time, so one second past the pinned clock is already the future even though the date still matches the shift."
        test_recipe:
          setup: ["Clock pinned at 2026-08-01T12:00:00Z; site HK-01, station PREP-1, food type, OPEN AM shift on 2026-08-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: "*"
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Chicken Breast", category: "PROTEIN", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: false, compostable: true, donation_shelf_life_hours: 720 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-08-01", shift_code: "AM", meals_served: 250 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
          trigger:
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 1000, loss_reason: "TRIM", captured_at: "2026-08-01T12:00:01Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
          assert:
            - "HTTP 422 with data.error_id == \"ERR_CAPTURE_IN_FUTURE\""
            - "the same body with captured_at == \"2026-08-01T12:00:00Z\" (exactly the clock) succeeds with HTTP 201"

      - name: setting_the_clock_backwards_is_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=130]", "errors[ERR_CLOCK_NOT_MONOTONIC]", "endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "The clock is strictly increasing, so a second set to any earlier instant — even one second earlier — is refused and the previous value survives."
        test_recipe:
          setup: ["Clock advanced to 2026-08-02T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: "*"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T23:59:59Z" }
              as: "*"
          assert:
