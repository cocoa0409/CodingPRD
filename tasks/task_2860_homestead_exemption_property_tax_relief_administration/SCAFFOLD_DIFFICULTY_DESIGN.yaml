            - "RetroactiveClaim C1 (filing_tax_year 2026, requested_start_tax_year 2023) was APPROVED while no fraud case existed, so offset_applied_cents 0, net_refund_cents 315000, refund_interest_cents 25200, total_payable_cents 340200 and taxpayer.lifetime_refund_cents 340200."
            - "A CERTIFIED IncomeCertification for certification_year 2024 exists inside the improper interval."
