scenario: |
  Smart warehouse robot dispatch system: task queue management with task source aggregation
  (inbound/outbound/replenishment/relocation), task priority classification, task-splitting and
  merging, queue-level scheduling strategy, and task expiration handling; robot status tracking
  with online/offline status, battery level, current task, position coordinates, fault status,
  and historical-trajectory archiving; path planning and conflict avoidance with map model
  maintenance (lanes/intersections/lifting points), shortest-path planning, multi-robot conflict
  prediction, slot-time-based right-of-way assignment, dynamic re-routing on obstacles, and
  deadlock detection and recovery; charging dispatch with battery-threshold-triggered charging,
  charging station availability, opportunity-charging during idle periods, queuing rules at
  charging stations, and full-charge return to pool; fault failover with fault detection
  (communication-loss/sensor-anomaly/mechanical-fault), in-progress task rollback, task
  reassignment to standby robot, isolation zone establishment around faulty robot, and manual
  takeover workflow; throughput statistics with task completion rate, average task duration,
  robot utilization, fault rate, charging-time ratio, and bottleneck-zone analysis;
  event-driven synchronization with WMS, equipment monitoring, and elevator/door-control
  systems; audit logging for task status and fault events.

domain_name: warehouse-robot-dispatch
api_prefix: /fleets

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - selector_policy
    - scheduled_deferred_actions
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - self_referential
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Fleet
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Warehouse / fleet identifier" }
      - { name: clock_now, type: datetime, source: system, description: "Virtual clock for tests; ISO 8601 UTC", default: "1970-01-01T00:00:00.000Z" }
      - { name: charging_low_threshold_pct, type: integer, source: input, description: "Battery percentage at or below which charging is forced", default: 20, constraints: "0 <= x <= 100" }
      - { name: charging_opportunity_pct, type: integer, source: input, description: "Battery percentage at or below which idle robots opportunistically charge", default: 60, constraints: "0 <= x <= 100; must be > charging_low_threshold_pct" }
      - { name: charging_full_pct, type: integer, source: input, description: "Percentage considered fully charged; robot must leave station and return to pool", default: 95, constraints: "0 <= x <= 100; must be > charging_opportunity_pct" }
      - { name: slot_seconds, type: integer, source: input, description: "Duration in seconds of one right-of-way slot at an intersection", default: 10, constraints: "x >= 1" }
      - { name: task_expiry_seconds, type: integer, source: input, description: "QUEUED tasks expire if not assigned within this many seconds", default: 600, constraints: "x >= 1" }
      - { name: deadlock_wait_seconds, type: integer, source: input, description: "WAITING_RIGHT_OF_WAY duration that triggers deadlock recovery", default: 30, constraints: "x >= 1" }

  - name: MapNode
    parent: Fleet
    common_fields: true
    fields:
      - { name: fleet_id, type: string, source: system, description: "Owning fleet" }
      - { name: code, type: string, source: input, description: "Stable map-code (unique within fleet)" }
      - { name: kind, type: enum, source: input, description: "LANE | INTERSECTION | LIFT_POINT | CHARGER | PARK | SHELF", constraints: "enum closed" }
      - { name: x, type: integer, source: input, description: "Grid x-coordinate" }
      - { name: y, type: integer, source: input, description: "Grid y-coordinate" }
      - { name: capacity, type: integer, source: input, description: "Max simultaneous occupants on this node (1 for INTERSECTION/LIFT_POINT/CHARGER; >=1 for LANE/PARK)", default: 1, constraints: "x >= 1" }
      - { name: status, type: enum, source: system, description: "OPEN | BLOCKED (set by obstacle/equipment event)", default: "OPEN" }
      - { name: blocked_reason, type: enum, source: system, description: "OBSTACLE | EQUIPMENT_LOCKED | MANUAL | null", default: null }

  - name: MapEdge
    parent: Fleet
    common_fields: false
    fields:
      - { name: fleet_id, type: string, source: system, description: "Owning fleet" }
      - { name: from_node_id, type: string, source: input, description: "Origin MapNode.id" }
      - { name: to_node_id, type: string, source: input, description: "Destination MapNode.id" }
      - { name: cost, type: integer, source: input, description: "Traversal cost (positive integer; used as tie-breaker on shortest path)", default: 1, constraints: "x >= 1" }
      - { name: directional, type: boolean, source: input, description: "true = one-way; false = bidirectional logical edge (system materializes the reverse on create)", default: false }

  - name: ChargingStation
    parent: Fleet
    common_fields: true
    fields:
      - { name: fleet_id, type: string, source: system, description: "Owning fleet" }
      - { name: node_id, type: string, source: input, description: "MapNode of kind=CHARGER" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OCCUPIED | DISABLED", default: "AVAILABLE" }
      - { name: occupying_robot_id, type: string, source: system, description: "Robot currently docked; null when AVAILABLE", default: null }
      - { name: queue_length, type: integer, source: computed, description: "Number of robots whose state = WAITING_CHARGER for this station" }
      - { name: charge_rate_pct_per_second, type: integer, source: input, description: "Battery percentage gained per second while OCCUPIED", default: 1, constraints: "x >= 1" }

  - name: Robot
    parent: Fleet
    common_fields: true
    fields:
      - { name: fleet_id, type: string, source: system, description: "Owning fleet" }
      - { name: code, type: string, source: input, description: "Robot label, unique within fleet" }
      - { name: connectivity, type: enum, source: system, description: "ONLINE | OFFLINE", default: "ONLINE" }
      - { name: operational_state, type: enum, source: system, description: "IDLE | EXECUTING | WAITING_RIGHT_OF_WAY | CHARGING | WAITING_CHARGER | UNDER_MANUAL_CONTROL | OUT_OF_SERVICE", default: "IDLE" }
      - { name: fault_state, type: enum, source: system, description: "OK | FAULTED", default: "OK" }
      - { name: battery_pct, type: integer, source: input, description: "Battery percentage 0..100", default: 100, constraints: "0 <= x <= 100" }
      - { name: position_node_id, type: string, source: input, description: "Current MapNode" }
      - { name: current_task_id, type: string, source: system, description: "Task currently executing (null when not EXECUTING)", default: null }
      - { name: charging_station_id, type: string, source: system, description: "Station the robot is docked at or queued for", default: null }
      - { name: last_heartbeat_at, type: datetime, source: system, description: "Last heartbeat received; used by fault detection" }
      - { name: standby_priority, type: integer, source: input, description: "Lower value = higher priority for failover reassignment (tie-broken by Robot.code asc)", default: 100, constraints: "x >= 0" }
      - { name: trajectory_archived_count, type: integer, source: computed, description: "Count of TrajectoryRecord rows archived for this robot" }

  - name: Task
    parent: Fleet
    common_fields: true
    fields:
      - { name: fleet_id, type: string, source: system, description: "Owning fleet" }
      - { name: source, type: enum, source: input, description: "INBOUND | OUTBOUND | REPLENISHMENT | RELOCATION", constraints: "enum closed" }
      - { name: priority_class, type: enum, source: input, description: "CRITICAL | HIGH | NORMAL | LOW", default: "NORMAL", constraints: "enum closed" }
      - { name: priority_score, type: integer, source: computed, description: "Numeric scheduling key derived from priority_class and waiting time; lower = scheduled first" }
      - { name: payload_units, type: integer, source: input, description: "Logical units to move (used by splitting)", default: 1, constraints: "x >= 1" }
      - { name: max_units_per_robot, type: integer, source: input, description: "Hard upper bound enforced at split; payload_units > max_units_per_robot is rejected at split time", default: 10, constraints: "x >= 1" }
      - { name: pickup_node_id, type: string, source: input, description: "MapNode where load is picked up" }
      - { name: dropoff_node_id, type: string, source: input, description: "MapNode where load is delivered" }
      - { name: status, type: enum, source: system, description: "QUEUED | ASSIGNED | EXECUTING | COMPLETED | CANCELLED | EXPIRED | ROLLED_BACK | MERGED", default: "QUEUED" }
      - { name: assigned_robot_id, type: string, source: system, description: "Robot executing the task (null when QUEUED)", default: null }
      - { name: parent_task_id, type: string, source: system, description: "When this task is a child of a split (self-referential)", default: null }
      - { name: merged_into_task_id, type: string, source: system, description: "When this task was merged into another", default: null }
      - { name: queued_at, type: datetime, source: system, description: "Fleet.clock_now at QUEUED entry; reset on rollback" }
      - { name: assigned_at, type: datetime, source: system, description: "Fleet.clock_now when ASSIGNED", default: null }
      - { name: started_at, type: datetime, source: system, description: "Fleet.clock_now when EXECUTING", default: null }
      - { name: completed_at, type: datetime, source: system, description: "Fleet.clock_now when COMPLETED", default: null }
      - { name: planned_path_node_ids, type: array, source: system, description: "Ordered MapNode.id list from current position through dropoff; recomputed on rollback or reroute" }
      - { name: rollback_count, type: integer, source: computed, description: "Number of ROLLED_BACK→QUEUED loops; capped at MAX_ROLLBACKS=3 before CANCELLED" }

  - name: SlotReservation
    parent: Fleet
    common_fields: false
    fields:
      - { name: fleet_id, type: string, source: system, description: "Owning fleet" }
      - { name: node_id, type: string, source: input, description: "Intersection/lift-point node whose right-of-way is reserved" }
      - { name: robot_id, type: string, source: input, description: "Robot holding the reservation" }
      - { name: task_id, type: string, source: system, description: "Task this reservation supports" }
      - { name: slot_index, type: integer, source: input, description: "Slot ordinal: floor((scheduled_at - epoch)/slot_seconds)" }
      - { name: scheduled_at, type: datetime, source: input, description: "Wall-clock start of the slot (aligned to slot_seconds)" }
      - { name: status, type: enum, source: system, description: "HELD | CONSUMED | RELEASED", default: "HELD" }

  - name: ChargingSession
    parent: Fleet
    common_fields: true
    fields:
      - { name: fleet_id, type: string, source: system, description: "Owning fleet" }
      - { name: robot_id, type: string, source: input, description: "Charging robot" }
      - { name: charging_station_id, type: string, source: input, description: "Station being used" }
      - { name: trigger, type: enum, source: input, description: "FORCED_LOW | OPPORTUNITY | MANUAL", constraints: "enum closed" }
      - { name: status, type: enum, source: system, description: "QUEUED | CHARGING | COMPLETED | CANCELLED", default: "QUEUED" }
      - { name: start_battery_pct, type: integer, source: system, description: "Battery at CHARGING entry" }
      - { name: end_battery_pct, type: integer, source: system, description: "Battery at COMPLETED entry", default: null }
      - { name: started_at, type: datetime, source: system, description: "Fleet.clock_now at CHARGING entry", default: null }
      - { name: completed_at, type: datetime, source: system, description: "Fleet.clock_now at COMPLETED entry", default: null }

  - name: FaultIncident
    parent: Fleet
    common_fields: true
    fields:
      - { name: fleet_id, type: string, source: system, description: "Owning fleet" }
      - { name: robot_id, type: string, source: input, description: "Robot in fault" }
      - { name: kind, type: enum, source: input, description: "COMM_LOSS | SENSOR_ANOMALY | MECHANICAL_FAULT", constraints: "enum closed" }
      - { name: status, type: enum, source: system, description: "OPEN | TAKEOVER | RESOLVED", default: "OPEN" }
      - { name: isolation_node_ids, type: array, source: system, description: "Node ids put into BLOCKED with reason=OBSTACLE while incident OPEN/TAKEOVER" }
      - { name: rolled_back_task_id, type: string, source: system, description: "Task that was reverted when fault opened (null if no task in progress)", default: null }
      - { name: reassigned_task_id, type: string, source: system, description: "New task id minted for the standby robot (null if no in-progress task or rollback exhausted)", default: null }
      - { name: detected_at, type: datetime, source: system, description: "Fleet.clock_now at OPEN" }
      - { name: takeover_started_at, type: datetime, source: system, description: "Fleet.clock_now at TAKEOVER" , default: null }
      - { name: resolved_at, type: datetime, source: system, description: "Fleet.clock_now at RESOLVED" , default: null }

  - name: TrajectoryRecord
    parent: Robot
    common_fields: false
    fields:
      - { name: robot_id, type: string, source: system, description: "Owning robot" }
      - { name: from_node_id, type: string, source: system, description: "Node moved from" }
      - { name: to_node_id, type: string, source: system, description: "Node moved to" }
      - { name: occurred_at, type: datetime, source: system, description: "Fleet.clock_now when motion recorded" }

  - name: AuditEvent
    parent: Fleet
    common_fields: false
    fields:
      - { name: fleet_id, type: string, source: system, description: "Owning fleet" }
      - { name: event_kind, type: enum, source: system, description: "TASK_STATUS | FAULT | WMS_SYNC | EQUIPMENT_LOCK | EQUIPMENT_UNLOCK", constraints: "enum closed" }
      - { name: subject_kind, type: enum, source: system, description: "Task | Robot | FaultIncident | MapNode" }
      - { name: subject_id, type: string, source: system, description: "Subject entity id" }
      - { name: from_state, type: string, source: system, description: "Previous state value (string-encoded; null for create)", default: null }
      - { name: to_state, type: string, source: system, description: "New state value (string-encoded)" }
      - { name: actor_role, type: string, source: system, description: "Role that initiated the event ('system' for automatic)" }
      - { name: occurred_at, type: datetime, source: system, description: "Fleet.clock_now at write" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Task
    initial_state: QUEUED
    terminal_states: [COMPLETED, CANCELLED, EXPIRED, MERGED]
    transitions:
      - from: QUEUED
        to: ASSIGNED
        trigger: "POST /fleets/{fleet_id}/dispatch (system scheduler) or POST /fleets/{fleet_id}/tasks/{task_id}:assign (Operator)"
        actor: system
        preconditions:
          - "Task.status == QUEUED"
          - "A selected Robot exists (see calculation 'robot_selection'); empty pool => task stays QUEUED"
          - "Selected Robot.fault_state == OK AND connectivity == ONLINE AND operational_state IN {IDLE} AND battery_pct > Fleet.charging_low_threshold_pct"
          - "Robot is not currently charging"
          - "A planned path exists from Robot.position_node_id to Task.dropoff_node_id via Task.pickup_node_id (calculation 'shortest_path')"
        side_effects:
          - "Task.assigned_robot_id = selected_robot.id"
          - "Task.assigned_at = Fleet.clock_now"
          - "Task.planned_path_node_ids = shortest_path(robot.position, pickup, dropoff)"
          - "Robot.current_task_id = Task.id (Robot stays IDLE until START step)"
          - "AuditEvent(event_kind=TASK_STATUS, from=QUEUED, to=ASSIGNED) written"

      - from: ASSIGNED
        to: EXECUTING
        trigger: "POST /fleets/{fleet_id}/tasks/{task_id}:start"
        actor: Operator
        preconditions:
          - "Task.status == ASSIGNED"
          - "Robot.fault_state == OK AND connectivity == ONLINE"
        side_effects:
          - "Robot.operational_state = EXECUTING"
          - "Task.started_at = Fleet.clock_now"
          - "AuditEvent(event_kind=TASK_STATUS, from=ASSIGNED, to=EXECUTING) written"

      - from: EXECUTING
        to: COMPLETED
        trigger: "POST /fleets/{fleet_id}/tasks/{task_id}:complete"
        actor: Operator
        preconditions:
          - "Task.status == EXECUTING"
          - "Robot.position_node_id == Task.dropoff_node_id"
        side_effects:
          - "Task.completed_at = Fleet.clock_now"
          - "Robot.operational_state = IDLE"
          - "Robot.current_task_id = null"
          - "All SlotReservation rows where robot_id=Robot.id AND status=HELD AND scheduled_at >= Fleet.clock_now → RELEASED"
          - "AuditEvent(event_kind=TASK_STATUS, from=EXECUTING, to=COMPLETED) written"

      - from: "QUEUED|ASSIGNED|EXECUTING"
        to: CANCELLED
        trigger: "POST /fleets/{fleet_id}/tasks/{task_id}:cancel"
        actor: Operator
        preconditions:
          - "Task.status IN {QUEUED, ASSIGNED, EXECUTING}"
          - "Task has no descendant tasks with status NOT IN {CANCELLED, COMPLETED, EXPIRED, MERGED}; otherwise ERR_HAS_DEPENDENCIES"
        side_effects:
          - "If Task.assigned_robot_id is set: that Robot.current_task_id = null AND Robot.operational_state = IDLE"
          - "All HELD SlotReservations for the task with scheduled_at >= Fleet.clock_now → RELEASED"
          - "AuditEvent(event_kind=TASK_STATUS, from=<prev>, to=CANCELLED) written"

      - from: QUEUED
        to: EXPIRED
        trigger: "system (Fleet.clock_now - Task.queued_at >= Fleet.task_expiry_seconds at clock-advance time)"
        actor: system
        preconditions:
          - "Task.status == QUEUED"
          - "Task age in seconds >= Fleet.task_expiry_seconds"
        side_effects:
          - "AuditEvent(event_kind=TASK_STATUS, from=QUEUED, to=EXPIRED) written"
        note: "Evaluated during POST /fleets/{fleet_id}:advance_clock and POST /fleets/{fleet_id}/dispatch."

      - from: EXECUTING
        to: ROLLED_BACK
        trigger: "system (Robot enters FAULTED via FaultIncident OPEN, see Robot state machine)"
        actor: system
        preconditions:
          - "Task.status == EXECUTING"
        side_effects:
          - "Task.assigned_robot_id = null"
          - "Task.planned_path_node_ids = []"
          - "Task.started_at = null; assigned_at = null"
          - "Task.rollback_count += 1"
          - "AuditEvent(event_kind=TASK_STATUS, from=EXECUTING, to=ROLLED_BACK) written"

      - from: ROLLED_BACK
        to: QUEUED
        trigger: "system (immediately after ROLLED_BACK, within the FaultIncident OPEN transition)"
        actor: system
        preconditions:
          - "Task.status == ROLLED_BACK"
          - "Task.rollback_count <= MAX_ROLLBACKS (constant = 3)"
        side_effects:
          - "Task.queued_at = Fleet.clock_now"
          - "FaultIncident.reassigned_task_id = Task.id"
          - "AuditEvent(event_kind=TASK_STATUS, from=ROLLED_BACK, to=QUEUED) written"

      - from: ROLLED_BACK
        to: CANCELLED
        trigger: "system (Task.rollback_count > MAX_ROLLBACKS after a rollback)"
        actor: system
        preconditions:
          - "Task.status == ROLLED_BACK"
          - "Task.rollback_count > 3"
        side_effects:
          - "AuditEvent(event_kind=TASK_STATUS, from=ROLLED_BACK, to=CANCELLED) written"

      - from: QUEUED
        to: MERGED
        trigger: "POST /fleets/{fleet_id}/tasks:merge"
        actor: Operator
        preconditions:
          - "Both source tasks status == QUEUED"
          - "Same source, same priority_class, same pickup_node_id, same dropoff_node_id, neither has parent_task_id"
          - "merged payload_units sum <= max_units_per_robot of the surviving task"
        side_effects:
          - "Source-loser task.merged_into_task_id = surviving_task.id"
          - "Surviving task.payload_units += loser.payload_units"
          - "AuditEvent(event_kind=TASK_STATUS, from=QUEUED, to=MERGED) written for the loser"
        note: "The 'surviving' task is the one with the lexicographically smaller id; the other becomes MERGED."

      - from: QUEUED
        to: QUEUED
        trigger: "POST /fleets/{fleet_id}/tasks/{task_id}:split"
        actor: Operator
        preconditions:
          - "Task.status == QUEUED"
          - "Task.payload_units > Task.max_units_per_robot"
          - "Task.parent_task_id is null (splits are not nested)"
        side_effects:
          - "Create N child Task rows where N = ceil(payload_units / max_units_per_robot); child.parent_task_id = this.id; children inherit source, priority_class, pickup, dropoff, max_units_per_robot"
          - "Children's payload_units sum equals parent.payload_units; the last child absorbs the remainder"
          - "Parent task remains QUEUED but is excluded from dispatch (selection ignores tasks with descendants whose status NOT IN {CANCELLED, EXPIRED, MERGED})"
        note: "Parent terminates only when every child terminates (compound semantics; see calculation 'parent_task_status')."

  - entity: Robot
    initial_state: IDLE
    terminal_states: []
    transitions:
      - from: IDLE
        to: EXECUTING
        trigger: "Task ASSIGNED→EXECUTING side effect"
        actor: system
        preconditions:
          - "Robot.fault_state == OK"
          - "Robot.connectivity == ONLINE"
        side_effects: []

      - from: EXECUTING
        to: WAITING_RIGHT_OF_WAY
        trigger: "POST /fleets/{fleet_id}/robots/{robot_id}:step (next node would exceed capacity OR no SlotReservation HELD for that slot)"
        actor: Operator
        preconditions:
          - "Robot.operational_state == EXECUTING"
        side_effects:
          - "Robot.position_node_id unchanged"
          - "Robot.last_heartbeat_at = Fleet.clock_now"

      - from: WAITING_RIGHT_OF_WAY
        to: EXECUTING
        trigger: "POST /fleets/{fleet_id}/robots/{robot_id}:step (capacity available AND robot holds HELD SlotReservation for current slot)"
        actor: Operator
        preconditions:
          - "Robot.operational_state == WAITING_RIGHT_OF_WAY"
        side_effects:
          - "Robot.position_node_id = next_node_id"
          - "TrajectoryRecord row appended"
          - "Robot.battery_pct -= MapEdge.cost (clamped at 0)"
          - "SlotReservation status HELD→CONSUMED"

      - from: EXECUTING
        to: EXECUTING
        trigger: "POST /fleets/{fleet_id}/robots/{robot_id}:step (clear path, capacity available)"
        actor: Operator
        preconditions:
          - "Robot.operational_state == EXECUTING"
          - "Next MapNode.status == OPEN AND current occupants < capacity"
        side_effects:
          - "Robot.position_node_id advances along Task.planned_path_node_ids"
          - "TrajectoryRecord appended"
          - "Robot.battery_pct -= MapEdge.cost"

      - from: WAITING_RIGHT_OF_WAY
        to: WAITING_RIGHT_OF_WAY
        trigger: "system (POST /fleets/{fleet_id}:advance_clock — robot still blocked but within deadlock window)"
        actor: system
        preconditions:
          - "Fleet.clock_now - last transition_at < Fleet.deadlock_wait_seconds"
        side_effects: []

      - from: WAITING_RIGHT_OF_WAY
        to: EXECUTING
        trigger: "system (deadlock recovery during POST /fleets/{fleet_id}:advance_clock when Fleet.clock_now - last transition_at >= Fleet.deadlock_wait_seconds)"
        actor: system
        preconditions:
          - "Two or more Robots in WAITING_RIGHT_OF_WAY whose next-node graph forms a cycle"
        side_effects:
          - "Lowest Robot.standby_priority (tie-break Robot.code asc) in the cycle: Task.planned_path_node_ids recomputed via 'shortest_path' with the contested node cost multiplied by DEADLOCK_PENALTY=1000"
          - "Existing HELD SlotReservations of the rerouted robot at scheduled_at >= Fleet.clock_now → RELEASED"
          - "AuditEvent(event_kind=TASK_STATUS, from=WAITING_RIGHT_OF_WAY, to=EXECUTING) written"

      - from: "IDLE|EXECUTING|WAITING_RIGHT_OF_WAY"
        to: CHARGING
        trigger: "POST /fleets/{fleet_id}/robots/{robot_id}:dock"
        actor: Operator
        preconditions:
          - "Robot.fault_state == OK"
          - "Robot.position_node_id == ChargingStation.node_id"
          - "ChargingStation.status == AVAILABLE"
          - "If Robot.operational_state == EXECUTING: this dock is rejected with ERR_INVALID_STATE (must complete or cancel task first)"
          - "Trigger is FORCED_LOW iff battery_pct <= charging_low_threshold_pct, OPPORTUNITY iff IDLE with charging_low_threshold_pct < battery_pct <= charging_opportunity_pct, otherwise MANUAL"
        side_effects:
          - "Create ChargingSession with trigger and start_battery_pct=Robot.battery_pct; status=CHARGING"
          - "ChargingStation.status=OCCUPIED; occupying_robot_id=Robot.id"
          - "Robot.charging_station_id=ChargingStation.id"

      - from: CHARGING
        to: IDLE
        trigger: "system (POST /fleets/{fleet_id}:advance_clock pushes battery_pct >= Fleet.charging_full_pct) OR POST /fleets/{fleet_id}/robots/{robot_id}:undock"
        actor: system
        preconditions:
          - "Robot.operational_state == CHARGING"
          - "For automatic completion: battery_pct >= Fleet.charging_full_pct"
        side_effects:
          - "ChargingSession.status=COMPLETED; end_battery_pct=Robot.battery_pct; completed_at=Fleet.clock_now"
          - "ChargingStation.status=AVAILABLE; occupying_robot_id=null"
          - "Robot.charging_station_id=null"
          - "If WAITING_CHARGER queue non-empty: lowest battery_pct (tie-break Robot.code asc) Robot → CHARGING at this station; otherwise station remains AVAILABLE"

      - from: "IDLE|EXECUTING|WAITING_RIGHT_OF_WAY"
        to: WAITING_CHARGER
        trigger: "POST /fleets/{fleet_id}/robots/{robot_id}:queue_charger"
        actor: Operator
        preconditions:
          - "Robot.fault_state == OK"
          - "ChargingStation exists in fleet"
        side_effects:
          - "Robot.charging_station_id set; ChargingSession row created with status=QUEUED"

      - from: WAITING_CHARGER
        to: CHARGING
        trigger: "system (station becomes AVAILABLE; selection rule per ChargingSession→CHARGING)"
        actor: system
        preconditions:
          - "Robot.fault_state == OK"
        side_effects:
          - "ChargingSession.status=QUEUED→CHARGING"
          - "ChargingStation.status=OCCUPIED"

      - from: "IDLE|EXECUTING|WAITING_RIGHT_OF_WAY|CHARGING|WAITING_CHARGER"
        to: OUT_OF_SERVICE
        trigger: "POST /fleets/{fleet_id}/robots/{robot_id}/faults (system event after detection rule fires)"
        actor: system
        preconditions:
          - "FaultIncident OPEN created for this robot"
        side_effects:
          - "Robot.fault_state = FAULTED"
          - "Robot.connectivity unchanged (COMM_LOSS still flips connectivity=OFFLINE separately)"
          - "Robot.current_task_id task → ROLLED_BACK then QUEUED (or CANCELLED if rollback_count > 3); Robot.current_task_id = null"
          - "All HELD SlotReservations for this robot → RELEASED"
          - "If Robot.operational_state was CHARGING: ChargingSession.status = CANCELLED; ChargingStation.status = AVAILABLE; queue advancement runs"
          - "FaultIncident.isolation_node_ids = MapNode list within Manhattan distance 1 of Robot.position_node_id; those nodes status=BLOCKED, blocked_reason=OBSTACLE"
          - "AuditEvent(event_kind=FAULT, from=<prev>, to=OUT_OF_SERVICE) written"

      - from: OUT_OF_SERVICE
        to: UNDER_MANUAL_CONTROL
        trigger: "POST /fleets/{fleet_id}/fault_incidents/{incident_id}:takeover"
        actor: Operator
        preconditions:
          - "FaultIncident.status == OPEN"
        side_effects:
          - "FaultIncident.status = TAKEOVER; takeover_started_at = Fleet.clock_now"
          - "AuditEvent(event_kind=FAULT, from=OUT_OF_SERVICE, to=UNDER_MANUAL_CONTROL) written"

      - from: UNDER_MANUAL_CONTROL
        to: IDLE
        trigger: "POST /fleets/{fleet_id}/fault_incidents/{incident_id}:resolve"
        actor: Operator
        preconditions:
          - "FaultIncident.status == TAKEOVER"
        side_effects:
          - "FaultIncident.status = RESOLVED; resolved_at = Fleet.clock_now"
          - "Robot.fault_state = OK"
          - "Isolation node ids: status=OPEN, blocked_reason=null"
          - "AuditEvent(event_kind=FAULT, from=UNDER_MANUAL_CONTROL, to=IDLE) written"

      - from: "ONLINE"
        to: "OFFLINE"
        trigger: "system (POST /fleets/{fleet_id}:advance_clock when Fleet.clock_now - Robot.last_heartbeat_at >= HEARTBEAT_TIMEOUT_SECONDS=15)"
        actor: system
        preconditions:
          - "Robot.connectivity == ONLINE"
        side_effects:
          - "Robot.connectivity = OFFLINE"
          - "FaultIncident(kind=COMM_LOSS) auto-created → triggers OUT_OF_SERVICE chain"
        note: "Tracked as a second dimension on Robot (connectivity) that evolves in parallel with operational_state."

      - from: "OFFLINE"
        to: "ONLINE"
        trigger: "POST /fleets/{fleet_id}/robots/{robot_id}:heartbeat"
        actor: Operator
        preconditions:
          - "Robot exists"
        side_effects:
          - "Robot.last_heartbeat_at = Fleet.clock_now"
          - "Robot.connectivity = ONLINE"
        note: "Does NOT auto-resolve an OPEN fault; that requires manual takeover→resolve."

  - entity: ChargingSession
    initial_state: QUEUED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: QUEUED
        to: CHARGING
        trigger: "system (station AVAILABLE; selection: lowest battery_pct first, tie-break Robot.code asc, but FORCED_LOW always outranks OPPORTUNITY and MANUAL)"
        actor: system
        preconditions:
          - "Owning Robot.fault_state == OK"
          - "ChargingStation.status == AVAILABLE"
        side_effects:
          - "Robot.operational_state = CHARGING; Robot moves logically into station node"
          - "started_at = Fleet.clock_now; start_battery_pct = Robot.battery_pct"

      - from: CHARGING
        to: COMPLETED
        trigger: "system (battery_pct >= Fleet.charging_full_pct during clock-advance) OR POST :undock"
        actor: system
        preconditions:
          - "Owning Robot.operational_state == CHARGING"
        side_effects:
          - "Robot.operational_state = IDLE"
          - "Robot.battery_pct clamped at 100"
          - "ChargingStation.status=AVAILABLE; queue advance runs"

      - from: "QUEUED|CHARGING"
        to: CANCELLED
        trigger: "POST /fleets/{fleet_id}/charging_sessions/{session_id}:cancel OR system (Robot enters OUT_OF_SERVICE)"
        actor: "Operator | system"
        preconditions: []
        side_effects:
          - "If CHARGING: ChargingStation.status=AVAILABLE; Robot.operational_state=IDLE; queue advance runs"
          - "If QUEUED: Robot.operational_state=IDLE; Robot.charging_station_id=null"

  - entity: FaultIncident
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: TAKEOVER
        trigger: "POST /fleets/{fleet_id}/fault_incidents/{incident_id}:takeover"
        actor: Operator
        preconditions:
          - "Robot is OUT_OF_SERVICE"
        side_effects: ["see Robot OUT_OF_SERVICE→UNDER_MANUAL_CONTROL"]

      - from: TAKEOVER
        to: RESOLVED
        trigger: "POST /fleets/{fleet_id}/fault_incidents/{incident_id}:resolve"
        actor: Operator
        preconditions:
          - "Robot under manual control"
        side_effects: ["see Robot UNDER_MANUAL_CONTROL→IDLE"]

  - entity: MapNode
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: BLOCKED
        trigger: "POST /fleets/{fleet_id}/events:emit (event_kind=EQUIPMENT_LOCK with target node_ids) OR system (FaultIncident OPEN isolation)"
        actor: "system"
        preconditions: []
        side_effects:
          - "If a Robot currently EXECUTING with planned_path containing the blocked node and still upstream of it: Task.planned_path_node_ids recomputed via 'shortest_path' from current position with node cost = infinity for blocked nodes"
          - "If no alternative path exists: Robot.operational_state = WAITING_RIGHT_OF_WAY (it parks) and Task stays EXECUTING"

      - from: BLOCKED
        to: OPEN
        trigger: "POST /fleets/{fleet_id}/events:emit (event_kind=EQUIPMENT_UNLOCK) OR FaultIncident RESOLVED (isolation lift)"
        actor: "system"
        preconditions: []
        side_effects:
          - "MapNode.blocked_reason = null"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two operators assign the same QUEUED task to two different robots simultaneously"
    guarantee: "Exactly one assignment wins; the loser is rejected"
    error_id: ERR_TASK_ALREADY_ASSIGNED
    http_status: 409
    serialization: "First-writer-wins on Task.status; loser observes Task.status != QUEUED at write"

  - scenario: "Two robots reserve the same intersection slot at the same scheduled_at"
    guarantee: "At most one HELD SlotReservation exists per (node_id, slot_index); the second creation is rejected"
    error_id: ERR_SLOT_ALREADY_RESERVED
    http_status: 409
    serialization: "First-writer-wins on unique (node_id, slot_index) where status=HELD"

  - scenario: "Two robots simultaneously dock at the same ChargingStation"
    guarantee: "First dock wins; the second observes status != AVAILABLE and is rejected"
    error_id: ERR_CHARGER_UNAVAILABLE
    http_status: 409
    serialization: "First-writer-wins on ChargingStation.status flip to OCCUPIED"

  - scenario: "Cancel and complete arrive simultaneously for the same EXECUTING task"
    guarantee: "Exactly one operation succeeds; the loser observes Task.status != EXECUTING"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Task.status"

  - scenario: "Two operators run merge concurrently with the same QUEUED loser task"
    guarantee: "Exactly one merge succeeds; the loser observes Task.status != QUEUED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on the loser task's Task.status flip to MERGED"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: priority_score
    trigger: "On Task QUEUED entry and on every POST /fleets/{fleet_id}:advance_clock"
    algorithm: weighted_scoring
    formula: |
      base = PRIORITY_BASE[Task.priority_class]    # CRITICAL=0, HIGH=1000, NORMAL=2000, LOW=3000
      age_seconds = max(0, Fleet.clock_now - Task.queued_at) in seconds
      priority_score = base - floor(age_seconds / AGING_BUCKET_SECONDS) * AGING_BUCKET_WEIGHT
      Lower priority_score sorts FIRST in dispatch.
    input_set: "Task rows where status == QUEUED AND parent task (if any) has no other non-terminal children chain blocking it"
    constants:
      PRIORITY_BASE: { CRITICAL: 0, HIGH: 1000, NORMAL: 2000, LOW: 3000 }
      AGING_BUCKET_SECONDS: 60
      AGING_BUCKET_WEIGHT: 10
    precision: "integer (no decimals)"

  - name: shortest_path
    trigger: "On Task ASSIGNED, on rollback→QUEUED→ASSIGNED, on MapNode→BLOCKED reroute, on deadlock recovery"
    algorithm: topological
    formula: |
      Dijkstra on MapEdge.cost over nodes with status == OPEN.
      The returned path visits, in order:
        source_node = Robot.position_node_id
        via_node = Task.pickup_node_id  (must be reached before dropoff)
        target_node = Task.dropoff_node_id
      Tie-breaks at equal total cost: select the path that sorts smaller by the
        lexicographic comparison of its concatenated node-code list.
      If no path exists with all nodes OPEN, return empty list and dispatch fails
      (ERR_NO_PATH at assign time; task stays QUEUED).
    input_set: "MapNode rows where status == OPEN; MapEdge rows where both endpoints' status == OPEN"
    constants:
      DEADLOCK_PENALTY: 1000
    precision: "integer cost"

  - name: robot_selection
    trigger: "On POST /fleets/{fleet_id}/dispatch and on POST /fleets/{fleet_id}/tasks/{task_id}:assign"
    algorithm: weighted_scoring
    formula: |
      Candidate filter:
        Robot.fleet_id == Fleet.id
        AND Robot.fault_state == OK
        AND Robot.connectivity == ONLINE
        AND Robot.operational_state == IDLE
        AND Robot.current_task_id == null
        AND Robot.battery_pct > Fleet.charging_low_threshold_pct
        AND shortest_path(Robot.position_node_id, task.pickup, task.dropoff) is non-empty
      Ranking (lower wins):
        rank_key = (path_total_cost, -battery_pct, Robot.code)
      Tie-break: lexicographic on rank_key (path_total_cost asc, then battery_pct desc, then code asc).
      If no candidate exists: task stays QUEUED and no error is raised.
    input_set: "Robot rows in the fleet meeting the candidate filter"
    constants: {}
    precision: "integer keys; deterministic comparator"

  - name: parent_task_status
    trigger: "On any child Task entering a terminal status; on POST /fleets/{fleet_id}:advance_clock"
    algorithm: aggregation
    formula: |
      Let parent = Task with parent_task_id == null and at least one direct child.
      Let children = Task rows where parent_task_id == parent.id.
      If every child.status IN {COMPLETED}: parent.status = COMPLETED
      Else if every child.status IN {CANCELLED, EXPIRED, MERGED, COMPLETED} AND at least one is CANCELLED: parent.status = CANCELLED
      Else if every child.status IN {EXPIRED, MERGED, COMPLETED} AND at least one is EXPIRED: parent.status = EXPIRED
      Else parent.status remains QUEUED.
      Ordering: chronological in (clock_now, child.id asc) — evaluated after every child terminal transition.
    input_set: "Direct children of the parent task"
    constants: {}
    precision: "enum"
    variants:
      - name: provisional_status
        when: "Read endpoint GET /fleets/{fleet_id}/tasks/{task_id} with query ?view=projected"
        difference: "Computes parent status as if all non-terminal children COMPLETED — used to preview the projected outcome without mutating; calling without ?view=projected returns the persisted aggregated status."
      - name: persisted_status
        when: "Read endpoint without ?view=projected"
        difference: "Returns the persisted .status updated by the latest aggregation pass; different from provisional when non-terminal children exist."

  - name: charge_progression
    trigger: "POST /fleets/{fleet_id}:advance_clock with delta_seconds > 0"
    algorithm: chronological
    formula: |
      For each Robot.operational_state == CHARGING at advance start:
        gained = delta_seconds * ChargingStation.charge_rate_pct_per_second
        new_battery = min(100, Robot.battery_pct + gained)
        Robot.battery_pct = new_battery
        If new_battery >= Fleet.charging_full_pct AND ChargingSession.status == CHARGING:
          end_battery_pct = new_battery
          completed_at = Fleet.clock_now + delta_seconds  (boundary at the moment the threshold is crossed within the delta)
          ChargingSession→COMPLETED; Robot.operational_state=IDLE; station queue advances.
      Boundary: completion uses ">=" (battery_pct >= charging_full_pct triggers); the wall-clock completed_at is computed by linear back-solving:
        seconds_to_full = ceil((charging_full_pct - start_battery_at_advance) / charge_rate_pct_per_second)
        completed_at = advance_start + seconds_to_full * 1s
    input_set: "Robots whose operational_state was CHARGING at advance start"
    constants: {}
    precision: "battery integer percent; timestamp integer second granularity"

  - name: throughput_metrics
    trigger: "GET /fleets/{fleet_id}/metrics"
    algorithm: aggregation
    formula: |
      window_seconds = query parameter; default 3600. Cutoff: Fleet.clock_now - window_seconds.
      Set S = Tasks with completed_at >= cutoff AND status == COMPLETED.
      Set T = Tasks with queued_at >= cutoff (ALL statuses; includes CANCELLED, EXPIRED).
      task_completion_rate = round(|S| / max(1, |T|), 4)   # 4 decimal places, round_half_up
      average_task_duration_seconds = round(sum(completed_at - started_at over S) / max(1, |S|), 2)  # round_half_up
      Robot utilization per robot:
        executing_seconds = sum of intervals where Robot.operational_state was EXECUTING within window (derived from AuditEvent + TrajectoryRecord)
        utilization = round(executing_seconds / window_seconds, 4)
      fleet_robot_utilization = round(mean(utilization over Robots), 4)
      fault_rate = round(count(FaultIncident.detected_at >= cutoff) / max(1, count(Robot in fleet)), 4)
      charging_time_ratio = round(sum(charging_seconds within window) / (sum(charging_seconds) + sum(executing_seconds)), 4)
      bottleneck_zones: For every MapNode with kind IN {INTERSECTION, LIFT_POINT}, count SlotReservation rows with scheduled_at >= cutoff AND status IN {HELD, CONSUMED};
        return the top K=5 by count, tie-break MapNode.code asc.
    input_set: "Tasks, TrajectoryRecord, AuditEvent, FaultIncident, SlotReservation in window"
    constants:
      DEFAULT_WINDOW_SECONDS: 3600
      BOTTLENECK_TOP_K: 5
    precision: "ratios round_half_up to 4 decimals; durations to 2 decimals"
    variants:
      - name: closed_window
        when: "Default — boundary uses >= cutoff (inclusive of cutoff exactly)"
        difference: "A task queued exactly at cutoff counts in the denominator T; a task completed exactly at cutoff counts in numerator S."
      - name: open_window
        when: "Query parameter ?window_boundary=open"
        difference: "Boundary uses > cutoff (exclusive); tasks at the exact cutoff are excluded. Returns different completion_rate when timestamps lie precisely on the cutoff."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role in {Operator, FleetAdmin, WMS}"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-segment IDs resolve left-to-right (fleet → robot/task/station/incident); first missing yields ERR_NOT_FOUND"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints :assign/:start/:complete/:cancel/:split/:merge/:dock/:undock/:queue_charger/:takeover/:resolve/:step"

  - priority: 5
    category: business_safety
    check: "Operator cannot direct a robot whose fault_state == FAULTED (must use :takeover/:resolve workflow instead)"
    error_id: ERR_ROBOT_FAULTED
    http_status: 409
    applies_to: ":start, :step, :dock, :queue_charger, :cancel-as-robot-action"

  - priority: 6
    category: business_safety
    check: "Robot.connectivity must be ONLINE for :start and :step"
    error_id: ERR_ROBOT_OFFLINE
    http_status: 409
    applies_to: ":start, :step"

  - priority: 7
    category: business_referential
    check: "Task.assigned_robot_id consistency: assignment may not target a robot that already has current_task_id set"
    error_id: ERR_ROBOT_BUSY
    http_status: 409
    applies_to: ":assign"

  - priority: 8
    category: business_constraint
    check: "Battery sufficiency: Robot.battery_pct > Fleet.charging_low_threshold_pct at :assign"
    error_id: ERR_BATTERY_LOW
    http_status: 409
    applies_to: ":assign"

  - priority: 9
    category: business_constraint
    check: "Path feasibility: shortest_path returns non-empty path with all nodes OPEN at :assign"
    error_id: ERR_NO_PATH
    http_status: 409
    applies_to: ":assign"

  - priority: 10
    category: business_constraint
    check: "MapNode capacity: at :step, occupants(next_node) < capacity. Failure surfaces as transition to WAITING_RIGHT_OF_WAY, NOT a 4xx error — except when the robot lacks a HELD SlotReservation for the slot at an INTERSECTION/LIFT_POINT, which is rejected"
    error_id: ERR_RIGHT_OF_WAY_MISSING
    http_status: 409
    applies_to: ":step"

  - priority: 11
    category: business_constraint
    check: "Charger queuing rules: :dock requires station status AVAILABLE; :queue_charger does not."
    error_id: ERR_CHARGER_UNAVAILABLE
    http_status: 409
    applies_to: ":dock"

  - priority: 12
    category: business_constraint
    check: "Slot reservation uniqueness: (node_id, slot_index, status=HELD) is unique within fleet"
    error_id: ERR_SLOT_ALREADY_RESERVED
    http_status: 409
    applies_to: "POST /fleets/{fleet_id}/slot_reservations"

  - priority: 13
    category: business_constraint
    check: "Split preconditions: Task.payload_units > Task.max_units_per_robot AND parent_task_id IS NULL"
    error_id: ERR_SPLIT_NOT_APPLICABLE
    http_status: 422
    applies_to: ":split"

  - priority: 14
    category: business_constraint
    check: "Merge preconditions: same source, priority_class, pickup_node_id, dropoff_node_id; both QUEUED; combined payload_units <= max_units_per_robot of survivor"
    error_id: ERR_MERGE_INCOMPATIBLE
    http_status: 422
    applies_to: ":merge"

  - priority: 15
    category: business_referential
    check: "Dependency: Task with non-terminal descendants cannot be cancelled directly"
    error_id: ERR_HAS_DEPENDENCIES
    http_status: 409
    applies_to: ":cancel"

  - priority: 16
    category: business_temporal
    check: "Slot reservation: scheduled_at must be aligned to Fleet.slot_seconds (scheduled_at_unix % slot_seconds == 0) AND scheduled_at >= Fleet.clock_now"
    error_id: ERR_SLOT_TIME_INVALID
    http_status: 422
    applies_to: "POST /fleets/{fleet_id}/slot_reservations"

  - priority: 17
    category: business_fiscal
    check: "Rollback ceiling: a task entering ROLLED_BACK with rollback_count > MAX_ROLLBACKS (=3) is auto-CANCELLED (no error returned, but :start on such a task yields ERR_INVALID_STATE)"
    error_id: ERR_ROLLBACK_LIMIT_REACHED
    http_status: 409
    applies_to: "system transitions and :start on cancelled tasks"

  - priority: 18
    category: business_constraint
    check: "Clock monotonicity: POST :advance_clock requires delta_seconds >= 1 AND new clock_now > current clock_now"
    error_id: ERR_CLOCK_BACKWARDS
    http_status: 422
    applies_to: "POST /fleets/{fleet_id}:advance_clock"

  - priority: 19
    category: business_constraint
    check: "Body schema: required fields present and typed correctly"
    error_id: ERR_BAD_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Fleet ---
  - method: POST
    path: "/fleets"
    description: "Create a fleet (warehouse instance)"
    roles: [FleetAdmin]
    code: 201
    input: [name, "charging_low_threshold_pct?", "charging_opportunity_pct?", "charging_full_pct?", "slot_seconds?", "task_expiry_seconds?", "deadlock_wait_seconds?"]
    output: Fleet
    side_effects: ["clock_now initialized to 1970-01-01T00:00:00.000Z"]

  - method: GET
    path: "/fleets/{fleet_id}"
    description: "Get fleet config and current virtual clock"
    roles: [Operator, FleetAdmin, WMS]
    code: 200
    input: []
    output: Fleet
    side_effects: []

  - method: POST
    path: "/fleets/{fleet_id}:advance_clock"
    description: "Advance virtual clock by delta_seconds; runs charge_progression, task expiry, heartbeat timeout, deadlock recovery, parent_task_status aggregation"
    roles: [Operator, FleetAdmin]
    code: 200
    input: [delta_seconds]
    output: Fleet
    side_effects:
      - "Fleet.clock_now += delta_seconds"
      - "Tasks with QUEUED and age >= task_expiry_seconds → EXPIRED"
      - "Robots with Fleet.clock_now - last_heartbeat_at >= HEARTBEAT_TIMEOUT_SECONDS → connectivity=OFFLINE → FaultIncident(COMM_LOSS)"
      - "Robots CHARGING with battery_pct crossing charging_full_pct → COMPLETED + queue advance"
      - "WAITING_RIGHT_OF_WAY robots beyond deadlock_wait_seconds in a cycle → reroute"

  - method: POST
    path: "/fleets/{fleet_id}/dispatch"
    description: "Run a scheduling pass: for each QUEUED task in priority order, attempt assignment"
    roles: [Operator, FleetAdmin]
    code: 200
    input: []
    output: "array of Task"
    side_effects:
      - "For each QUEUED task in ascending priority_score order (tie-break Task.id asc), attempt assignment via robot_selection; commit assignments in order; later tasks see updated robot pool"

  - method: GET
    path: "/fleets/{fleet_id}/metrics"
    description: "Throughput statistics report"
    roles: [Operator, FleetAdmin, WMS]
    code: 200
    input: ["window_seconds?", "window_boundary?"]
    output: "MetricsReport (computed)"
    side_effects: []

  # --- Map ---
  - method: POST
    path: "/fleets/{fleet_id}/map_nodes"
    description: "Create a map node"
    roles: [FleetAdmin]
    code: 201
    input: [code, kind, x, y, "capacity?"]
    output: MapNode
    side_effects: []

  - method: POST
    path: "/fleets/{fleet_id}/map_edges"
    description: "Create a map edge"
    roles: [FleetAdmin]
    code: 201
    input: [from_node_id, to_node_id, "cost?", "directional?"]
    output: MapEdge
    side_effects: ["If directional=false, system also materializes a reverse MapEdge row"]

  - method: POST
    path: "/fleets/{fleet_id}/events:emit"
    description: "Inbound event from WMS / equipment / elevator-door control: equipment lock/unlock, WMS task push"
    roles: [WMS, FleetAdmin]
    code: 200
    input: [event_kind, "node_ids?", "wms_task_payload?"]
    output: "AuditEvent (sync record)"
    side_effects:
      - "EQUIPMENT_LOCK: target MapNodes → BLOCKED with reason=EQUIPMENT_LOCKED; reroute side effect"
      - "EQUIPMENT_UNLOCK: target MapNodes → OPEN"
      - "WMS_SYNC with wms_task_payload: equivalent to POST /tasks; sets the new task's actor_role audit to 'WMS'"

  # --- Charging Station ---
  - method: POST
    path: "/fleets/{fleet_id}/charging_stations"
    description: "Create a charging station at a CHARGER MapNode"
    roles: [FleetAdmin]
    code: 201
    input: [node_id, "charge_rate_pct_per_second?"]
    output: ChargingStation
    side_effects: ["status initialized to AVAILABLE"]

  - method: GET
    path: "/fleets/{fleet_id}/charging_stations/{station_id}"
    description: "Read charging station state"
    roles: [Operator, FleetAdmin, WMS]
    code: 200
    input: []
    output: ChargingStation
    side_effects: []

  # --- Robot ---
  - method: POST
    path: "/fleets/{fleet_id}/robots"
    description: "Register a robot"
    roles: [FleetAdmin]
    code: 201
    input: [code, position_node_id, "battery_pct?", "standby_priority?"]
    output: Robot
    side_effects: ["operational_state=IDLE, connectivity=ONLINE, fault_state=OK, last_heartbeat_at=Fleet.clock_now"]

  - method: GET
    path: "/fleets/{fleet_id}/robots/{robot_id}"
    description: "Read robot state"
    roles: [Operator, FleetAdmin, WMS]
    code: 200
    input: []
    output: Robot
    side_effects: []

  - method: GET
    path: "/fleets/{fleet_id}/robots"
    description: "List robots (paginated, filter by operational_state, connectivity, fault_state)"
    roles: [Operator, FleetAdmin, WMS]
    code: 200
    input: ["limit?", "offset?", "operational_state?", "connectivity?", "fault_state?"]
    output: "array of Robot"
    side_effects: []

  - method: POST
    path: "/fleets/{fleet_id}/robots/{robot_id}:heartbeat"
    description: "Robot heartbeat — updates last_heartbeat_at and clears OFFLINE if currently OFFLINE"
    roles: [Operator]
    code: 200
    input: []
    output: Robot
    side_effects: ["Robot.last_heartbeat_at = Fleet.clock_now", "OFFLINE → ONLINE (does not auto-resolve fault)"]

  - method: POST
    path: "/fleets/{fleet_id}/robots/{robot_id}:step"
    description: "Advance robot one node along Task.planned_path_node_ids"
    roles: [Operator]
    code: 200
    input: []
    output: Robot
    side_effects: ["Position update, battery debit, TrajectoryRecord append; may transition operational_state EXECUTING ↔ WAITING_RIGHT_OF_WAY"]

  - method: POST
    path: "/fleets/{fleet_id}/robots/{robot_id}:dock"
    description: "Dock robot at the charging station co-located on its current node"
    roles: [Operator]
    code: 200
    input: []
    output: ChargingSession
    side_effects: ["ChargingSession created CHARGING; ChargingStation OCCUPIED"]

  - method: POST
    path: "/fleets/{fleet_id}/robots/{robot_id}:undock"
    description: "Manually undock from charging station"
    roles: [Operator]
    code: 200
    input: []
    output: Robot
    side_effects: ["ChargingSession COMPLETED; station AVAILABLE; queue advance"]

  - method: POST
    path: "/fleets/{fleet_id}/robots/{robot_id}:queue_charger"
    description: "Enqueue robot at a charging station (used when station OCCUPIED)"
    roles: [Operator]
    code: 200
    input: [charging_station_id]
    output: ChargingSession
    side_effects: ["ChargingSession created QUEUED; robot operational_state=WAITING_CHARGER"]

  # --- Task ---
  - method: POST
    path: "/fleets/{fleet_id}/tasks"
    description: "Create a task in QUEUED"
    roles: [Operator, WMS]
    code: 201
    input: [source, pickup_node_id, dropoff_node_id, "priority_class?", "payload_units?", "max_units_per_robot?"]
    output: Task
    side_effects: ["status=QUEUED, queued_at=Fleet.clock_now, priority_score computed"]

  - method: GET
    path: "/fleets/{fleet_id}/tasks/{task_id}"
    description: "Read task (supports ?view=projected for parent_task_status provisional variant)"
    roles: [Operator, FleetAdmin, WMS]
    code: 200
    input: ["view?"]
    output: Task
    side_effects: []

  - method: GET
    path: "/fleets/{fleet_id}/tasks"
    description: "List tasks (paginated, filter by status, source, priority_class)"
    roles: [Operator, FleetAdmin, WMS]
    code: 200
    input: ["limit?", "offset?", "status?", "source?", "priority_class?"]
    output: "array of Task"
    side_effects: []

  - method: POST
    path: "/fleets/{fleet_id}/tasks/{task_id}:assign"
    description: "Assign task to a specific robot (Operator override of automatic dispatch)"
    roles: [Operator]
    code: 200
    input: [robot_id]
    output: Task
    side_effects: ["Robot.current_task_id set; planned_path_node_ids computed"]

  - method: POST
    path: "/fleets/{fleet_id}/tasks/{task_id}:start"
    description: "Begin executing an ASSIGNED task"
    roles: [Operator]
    code: 200
    input: []
    output: Task
    side_effects: ["status ASSIGNED→EXECUTING; Robot operational_state→EXECUTING; started_at recorded"]

  - method: POST
    path: "/fleets/{fleet_id}/tasks/{task_id}:complete"
    description: "Mark a task COMPLETED (robot has reached dropoff_node_id)"
    roles: [Operator]
    code: 200
    input: []
    output: Task
    side_effects: ["status COMPLETED; Robot IDLE; HELD reservations RELEASED"]

  - method: POST
    path: "/fleets/{fleet_id}/tasks/{task_id}:cancel"
    description: "Cancel a QUEUED/ASSIGNED/EXECUTING task"
    roles: [Operator]
    code: 200
    input: []
    output: Task
    side_effects: ["status CANCELLED; robot freed; reservations RELEASED"]

  - method: POST
    path: "/fleets/{fleet_id}/tasks/{task_id}:split"
    description: "Split an oversized QUEUED task into children"
    roles: [Operator]
    code: 200
    input: []
    output: "array of Task (children)"
    side_effects: ["Parent stays QUEUED, excluded from dispatch; children created"]

  - method: POST
    path: "/fleets/{fleet_id}/tasks:merge"
    description: "Merge two compatible QUEUED tasks"
    roles: [Operator]
    code: 200
    input: [task_id_a, task_id_b]
    output: Task
    side_effects: ["Loser task MERGED; survivor.payload_units += loser.payload_units"]

  # --- Slot Reservations ---
  - method: POST
    path: "/fleets/{fleet_id}/slot_reservations"
    description: "Reserve right-of-way slot at an INTERSECTION/LIFT_POINT for a robot"
    roles: [Operator]
    code: 201
    input: [node_id, robot_id, scheduled_at]
    output: SlotReservation
    side_effects: ["slot_index computed; status=HELD"]

  - method: GET
    path: "/fleets/{fleet_id}/slot_reservations"
    description: "List slot reservations (filter by node_id, robot_id, status, scheduled_at range)"
    roles: [Operator, FleetAdmin]
    code: 200
    input: ["limit?", "offset?", "node_id?", "robot_id?", "status?", "scheduled_at_min?", "scheduled_at_max?"]
    output: "array of SlotReservation"
    side_effects: []

  # --- Fault Incidents ---
  - method: POST
    path: "/fleets/{fleet_id}/robots/{robot_id}/faults"
    description: "Open a fault incident on a robot (sensor anomaly or mechanical fault; comm-loss is auto-emitted by heartbeat timeout)"
    roles: [Operator, FleetAdmin]
    code: 201
    input: [kind]
    output: FaultIncident
    side_effects: ["Robot enters OUT_OF_SERVICE; task rollback chain; isolation nodes BLOCKED"]

  - method: GET
    path: "/fleets/{fleet_id}/fault_incidents/{incident_id}"
    description: "Read a fault incident"
    roles: [Operator, FleetAdmin, WMS]
    code: 200
    input: []
    output: FaultIncident
    side_effects: []

  - method: POST
    path: "/fleets/{fleet_id}/fault_incidents/{incident_id}:takeover"
    description: "Operator takes manual control"
    roles: [Operator]
    code: 200
    input: []
    output: FaultIncident
    side_effects: ["status=TAKEOVER; Robot=UNDER_MANUAL_CONTROL"]

  - method: POST
    path: "/fleets/{fleet_id}/fault_incidents/{incident_id}:resolve"
    description: "Resolve fault: lift isolation, robot returns to IDLE"
    roles: [Operator]
    code: 200
    input: []
    output: FaultIncident
    side_effects: ["status=RESOLVED; isolation nodes OPEN; Robot.fault_state=OK; Robot.operational_state=IDLE"]

  # --- Audit ---
  - method: GET
    path: "/fleets/{fleet_id}/audit_events"
    description: "List audit events (paginated, filter by event_kind, subject_kind)"
    roles: [Operator, FleetAdmin, WMS]
    code: 200
    input: ["limit?", "offset?", "event_kind?", "subject_kind?", "subject_id?"]
    output: "array of AuditEvent"
    side_effects: []

  - method: GET
    path: "/fleets/{fleet_id}/robots/{robot_id}/trajectory"
    description: "List archived trajectory records for a robot"
    roles: [Operator, FleetAdmin, WMS]
    code: 200
    input: ["limit?", "offset?"]
    output: "array of TrajectoryRecord"
    side_effects: []

  # --- Charging Session ---
  - method: POST
    path: "/fleets/{fleet_id}/charging_sessions/{session_id}:cancel"
    description: "Cancel an in-progress or queued charging session"
    roles: [Operator]
    code: 200
    input: []
    output: ChargingSession
    side_effects: ["station AVAILABLE; queue advance; Robot.operational_state=IDLE"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-ID/X-User-Role headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Caller's role is not permitted for the endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Resource referenced in path does not exist within the fleet" }
  - { id: ERR_BAD_REQUEST, http: 400, condition: "Request body or query parameter shape is invalid" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not defined from the resource's current state" }
  - { id: ERR_ROBOT_FAULTED, http: 409, condition: "Operation refers to a robot whose fault_state == FAULTED (must use takeover/resolve flow)" }
  - { id: ERR_ROBOT_OFFLINE, http: 409, condition: "Operation requires Robot.connectivity == ONLINE" }
  - { id: ERR_ROBOT_BUSY, http: 409, condition: "Target robot already has current_task_id set" }
  - { id: ERR_BATTERY_LOW, http: 409, condition: "Robot.battery_pct <= Fleet.charging_low_threshold_pct at assignment" }
  - { id: ERR_NO_PATH, http: 409, condition: "No path exists from robot position through pickup to dropoff over OPEN nodes" }
  - { id: ERR_RIGHT_OF_WAY_MISSING, http: 409, condition: "Step into an INTERSECTION/LIFT_POINT without a HELD SlotReservation for the current slot" }
  - { id: ERR_CHARGER_UNAVAILABLE, http: 409, condition: "ChargingStation.status != AVAILABLE at dock attempt" }
  - { id: ERR_SLOT_ALREADY_RESERVED, http: 409, condition: "A HELD SlotReservation already exists for (node_id, slot_index)" }
  - { id: ERR_SLOT_TIME_INVALID, http: 422, condition: "scheduled_at not aligned to slot_seconds OR in the past relative to Fleet.clock_now" }
  - { id: ERR_SPLIT_NOT_APPLICABLE, http: 422, condition: "Task does not satisfy the split preconditions (payload_units <= max_units_per_robot OR already a child)" }
  - { id: ERR_MERGE_INCOMPATIBLE, http: 422, condition: "Source/priority/pickup/dropoff do not match OR combined units exceed max_units_per_robot OR not both QUEUED" }
  - { id: ERR_HAS_DEPENDENCIES, http: 409, condition: "Cancellation blocked by non-terminal descendant tasks" }
  - { id: ERR_TASK_ALREADY_ASSIGNED, http: 409, condition: "Task.status != QUEUED when an :assign or scheduler attempts to mutate it" }
  - { id: ERR_CLOCK_BACKWARDS, http: 422, condition: "delta_seconds < 1 or would move clock_now backwards" }
  - { id: ERR_ROLLBACK_LIMIT_REACHED, http: 409, condition: "Attempt to :start a task whose rollback_count exceeded MAX_ROLLBACKS and is therefore CANCELLED" }
  - { id: ERR_OBSTACLE_BLOCKING, http: 409, condition: "Step into a MapNode whose status == BLOCKED" }
  - { id: ERR_ISOLATION_VIOLATION, http: 409, condition: "Attempt to assign a task whose pickup/dropoff is inside an active FaultIncident isolation zone" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Operator
    description: "Floor operator: drives robots, manages tasks, handles charging and faults"
    identity: "opaque"
    exclusive_operations:
      - "POST /fleets/{fleet_id}/tasks/{task_id}:assign"
      - "POST /fleets/{fleet_id}/tasks/{task_id}:start"
      - "POST /fleets/{fleet_id}/tasks/{task_id}:complete"
      - "POST /fleets/{fleet_id}/tasks/{task_id}:cancel"
      - "POST /fleets/{fleet_id}/tasks/{task_id}:split"
      - "POST /fleets/{fleet_id}/tasks:merge"
      - "POST /fleets/{fleet_id}/robots/{robot_id}:step"
      - "POST /fleets/{fleet_id}/robots/{robot_id}:dock"
      - "POST /fleets/{fleet_id}/robots/{robot_id}:undock"
      - "POST /fleets/{fleet_id}/robots/{robot_id}:queue_charger"
      - "POST /fleets/{fleet_id}/robots/{robot_id}:heartbeat"
      - "POST /fleets/{fleet_id}/slot_reservations"
      - "POST /fleets/{fleet_id}/fault_incidents/{incident_id}:takeover"
      - "POST /fleets/{fleet_id}/fault_incidents/{incident_id}:resolve"
      - "POST /fleets/{fleet_id}/charging_sessions/{session_id}:cancel"
    shared_operations:
      - "POST /fleets/{fleet_id}/tasks (with WMS)"
      - "POST /fleets/{fleet_id}/dispatch (with FleetAdmin)"
      - "POST /fleets/{fleet_id}:advance_clock (with FleetAdmin)"
      - "POST /fleets/{fleet_id}/robots/{robot_id}/faults (with FleetAdmin)"
      - "GET endpoints (with FleetAdmin, WMS)"

  - name: FleetAdmin
    description: "Warehouse administrator: configures fleet, map, charging stations, and robots; oversees scheduler"
    identity: "opaque"
    exclusive_operations:
      - "POST /fleets"
      - "POST /fleets/{fleet_id}/map_nodes"
      - "POST /fleets/{fleet_id}/map_edges"
      - "POST /fleets/{fleet_id}/charging_stations"
      - "POST /fleets/{fleet_id}/robots"
    shared_operations:
      - "POST /fleets/{fleet_id}/dispatch (with Operator)"
      - "POST /fleets/{fleet_id}:advance_clock (with Operator)"
      - "POST /fleets/{fleet_id}/robots/{robot_id}/faults (with Operator)"
      - "GET endpoints (with Operator, WMS)"

  - name: WMS
    description: "Warehouse Management System integrator: pushes tasks and equipment events"
    identity: "opaque"
    exclusive_operations:
      - "POST /fleets/{fleet_id}/events:emit"
    shared_operations:
      - "POST /fleets/{fleet_id}/tasks (with Operator)"
      - "GET endpoints (with Operator, FleetAdmin)"
