# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 Difficulty Rules x 2 instances each = 18 instances.
# All fixture literals pre-computed by executing the §1.3 formulas.
# Logical clock default is 2026-09-01T00:00:00Z; fixture dates are chosen
# accordingly (agreement window 2026-08-01..2027-08-31 contains the default).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: fill_rate_provisional_undercuts_final_on_cancelled_units
        grounds:
          - calculations.order_fill_rate
          - state_machines.DistributionOrder.PARTIALLY_SHIPPED_to_SHIPPED
          - state_machines.DistributionOrder.SHIPPED_to_RECEIVED
        distinguishing_aspect: |
          Dual-variant logic on the LOGISTICS entity domain (DistributionOrder):
          identical line data yields provisional 93.33 (cancelled units count
          against) vs final 100.00 (cancelled units leave the denominator).
        test_recipe:
          setup:
            - "Facility F with an ACTIVE PrimeVendorAgreement (committed_fill_rate_pct 95.0, lum_commitment true, window 2026-08-01..2027-08-31)"
            - "Products P1, P2 both availability ACTIVE, units_per_case 1, order_multiple 1"
            - "Order O under the agreement: P1 x100, P2 x50"
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac A", health_system_name: "HS A", facility_type: "ACUTE_CARE", ship_to_address: "1 Main St" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "P-100", name: "Gauze", brand_type: "PRIVATE_LABEL", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 100 }
              as: SupplyChainAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "P-200", name: "Tape", brand_type: "BRANDED", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 100 }
              as: SupplyChainAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /supply/prime-vendor-agreements"
              payload: { facility_id: "${fac_id}", committed_fill_rate_pct: 95.0, deliveries_per_week: 5, lum_commitment: true, annual_commitment_cents: 100000000, start_date: "2026-08-01", end_date: "2027-08-31" }
              as: SupplyChainAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /supply/distribution-orders"
              payload: { agreement_id: "${agr_id}", requested_delivery_date: "2026-09-15", lines: [ { product_id: "${p1_id}", ordered_qty: 100 }, { product_id: "${p2_id}", ordered_qty: 50 } ] }
              as: FacilitySupplyDirector
              as_user_id: "${fac_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /supply/distribution-orders/${ord_id}/fulfillment-events"
              payload: { event: "SHIPPED", shipped_lines: [ { product_id: "${p1_id}", shipped_qty: 90, backorder_cancelled: true }, { product_id: "${p2_id}", shipped_qty: 50, backorder_cancelled: false } ] }
              as: SupplyChainAdmin
              captures: { prov_rate: $.data.provisional_fill_rate_pct }
            - call: "POST /supply/distribution-orders/${ord_id}/fulfillment-events"
              payload: { event: "RECEIVED", shipped_lines: [] }
              as: SupplyChainAdmin
              captures: { final_rate: $.data.final_fill_rate_pct }
          assert:
            - "After SHIPPED: DistributionOrder.${ord_id}.provisional_fill_rate_pct == 93.33 and status == SHIPPED"
            - "After RECEIVED: DistributionOrder.${ord_id}.final_fill_rate_pct == 100.00 and status == RECEIVED"
            - "provisional != final for identical line data (93.33 != 100.00)"
            - "GET /supply/prime-vendor-agreements/${agr_id}: rolling_fill_rate_pct == 100.00 and status == ACTIVE (100.00 >= 95.0, no breach)"

      - name: rebate_provisional_ignores_bonus_and_compliance
        grounds:
          - calculations.rebate_amount
          - state_machines.RebateClaim.ACCRUED_to_SUBMITTED
        distinguishing_aspect: |
          Dual-variant logic on the FINANCIAL entity domain (RebateClaim) —
          a different subject from the logistics fill rate: provisional accrual
          (plain tier rate) yields 36000 cents while the validated variant
          (tier + private-label bonus, compliant) yields 42000 cents for the
          same claim fields.
        test_recipe:
          setup:
            - "Facility F"
            - "RebateClaim: eligible_purchase_cents 1200000 (tier 0.03), private_label_share 0.35 (bonus applies), compliant true"
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac R", health_system_name: "HS R", facility_type: "SURGERY_CENTER", ship_to_address: "2 Oak Ave" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/rebate-claims"
              payload: { facility_id: "${fac_id}", gpo_name: "GPO-A", period_start: "2026-01-01", period_end: "2026-03-31", eligible_purchase_cents: 1200000, private_label_share: 0.35, compliant: true }
              as: GPOAnalyst
              captures: { claim_id: $.data.id, prov_amt: $.data.provisional_amount_cents }
          trigger:
            - call: "POST /supply/rebate-claims/${claim_id}/lifecycle-events"
              payload: { event: "SUBMIT" }
              as: GPOAnalyst
              captures: { final_amt: $.data.final_amount_cents }
          assert:
            - "RebateClaim.${claim_id}.provisional_amount_cents == 36000 (1200000 x 0.03, no bonus, no multiplier)"
            - "After SUBMIT: final_amount_cents == 42000 (1200000 x (0.03 + 0.005) x 1.0)"
            - "provisional != final for identical claim data (36000 != 42000); delta == 6000"
            - "RebateClaim.${claim_id}.status == SUBMITTED"

  - rule_id: combinatorial_formula
    instances:
      - name: rebate_validated_formula_tier_bonus_multiplier
        grounds:
          - calculations.rebate_amount
          - state_machines.RebateClaim.ACCRUED_to_SUBMITTED
        distinguishing_aspect: |
          Mode (a) combinatorial formula: the validated rebate rate combines
          >= 3 inputs with non-linear interaction — a 5-branch tier lookup on
          eligible_purchase_cents, a conditional bonus gated on
          private_label_share >= 0.30, and a compliance multiplier — yielding
          21000 cents when non-compliant (vs 42000 compliant) for identical
          volume and share.
        test_recipe:
          setup:
            - "Facility F"
            - "RebateClaim: eligible_purchase_cents 1200000, private_label_share 0.35, compliant FALSE"
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac NC", health_system_name: "HS NC", facility_type: "CLINIC", ship_to_address: "3 Elm St" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/rebate-claims"
              payload: { facility_id: "${fac_id}", gpo_name: "GPO-A", period_start: "2026-01-01", period_end: "2026-03-31", eligible_purchase_cents: 1200000, private_label_share: 0.35, compliant: false }
              as: GPOAnalyst
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /supply/rebate-claims/${claim_id}/lifecycle-events"
              payload: { event: "SUBMIT" }
              as: GPOAnalyst
          assert:
            - "RebateClaim.${claim_id}.provisional_amount_cents == 36000 (tier 0.03 only)"
            - "RebateClaim.${claim_id}.final_amount_cents == 21000 (round_half_up(1200000 x 0.035, 0) = 42000; 42000 x 0.5 = 21000)"
            - "The bonus branch fired (0.35 >= 0.30) AND the non-compliance multiplier fired (x 0.5), proving the conditional branches compose"
      - name: order_price_per_line_case_ceiling
        grounds:
          - calculations.order_price
          - endpoints."POST /supply/distribution-orders"
        distinguishing_aspect: |
          Mode (b) combinatorial formula — nested rounding with a pinned order:
          per-line case-ceiling BEFORE summation yields 9560 cents; the
          forbidden order-level alternative (raw each-extension sum) yields
          8060 cents for the same cart.
        test_recipe:
          setup:
            - "Facility F with ACTIVE agreement (lum_commitment true, annual_commitment_cents 100000000)"
            - "P-CASE: units_per_case 12, each_price_cents 250, lum_eligible false, order_multiple 1"
            - "P-LUM: units_per_case 10, each_price_cents 80, lum_eligible true, order_multiple 1"
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac L", health_system_name: "HS L", facility_type: "ACUTE_CARE", ship_to_address: "4 Pine Rd" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "PC-1", name: "Suture case", brand_type: "BRANDED", category: "SURGICAL_INSTRUMENTS", sterile: true, device_class: "CLASS_II", units_per_case: 12, each_price_cents: 250, lum_eligible: false }
              as: SupplyChainAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "PL-1", name: "Bandage each", brand_type: "PRIVATE_LABEL", category: "WOUND_CARE", sterile: true, device_class: "CLASS_I", units_per_case: 10, each_price_cents: 80, lum_eligible: true }
              as: SupplyChainAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /supply/prime-vendor-agreements"
              payload: { facility_id: "${fac_id}", committed_fill_rate_pct: 90.0, deliveries_per_week: 3, lum_commitment: true, annual_commitment_cents: 100000000, start_date: "2026-08-01", end_date: "2027-08-31" }
              as: SupplyChainAdmin
              captures: { agr_id: $.data.id }
          trigger:
            - call: "POST /supply/distribution-orders"
              payload: { agreement_id: "${agr_id}", requested_delivery_date: "2026-09-15", lines: [ { product_id: "${pc_id}", ordered_qty: 30 }, { product_id: "${pl_id}", ordered_qty: 7 } ] }
              as: FacilitySupplyDirector
              as_user_id: "${fac_id}"
              captures: { ord_id: $.data.id, total: $.data.total_price_cents }
          assert:
            - "DistributionOrder.${ord_id}.total_price_cents == 9560 (line 1: ceil(30/12)=3 cases x 12 x 250 = 9000; line 2 (LUM applies): 7 x 80 = 560; 9000 + 560)"
            - "9560 != 8060 (raw each-extension 30 x 250 + 7 x 80) — the pinned per-line rounding is observable"

  - rule_id: non_linear_state_machine
    instances:
      - name: tray_template_change_management_cycle
        grounds:
          - state_machines.TrayTemplate.ACTIVE_to_PENDING_APPROVAL
          - state_machines.TrayTemplate.PENDING_APPROVAL_to_UNDER_CHANGE
          - state_machines.TrayTemplate.UNDER_CHANGE_to_PENDING_APPROVAL
          - concurrency_rules[tray-propose-stale-version]
        distinguishing_aspect: |
          Cyclic machine on TrayTemplate: DRAFT -> PENDING_APPROVAL ->
          UNDER_CHANGE -> PENDING_APPROVAL -> ACTIVE -> PENDING_APPROVAL ->
          ACTIVE, exercising the preference-shift change loop twice and
          version-pinning approved_version at each approval.
        test_recipe:
          setup:
            - "Facility F; products C1, C2 both ACTIVE and sterile"
            - "TrayTemplate T created DRAFT by SupplyChainAdmin admin-1 with components [C1 x1] (version 1)"
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac T", health_system_name: "HS T", facility_type: "SURGERY_CENTER", ship_to_address: "5 Birch Ln" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "TC-1", name: "Scalpel", brand_type: "BRANDED", category: "SURGICAL_INSTRUMENTS", sterile: true, device_class: "CLASS_II", units_per_case: 1, each_price_cents: 500 }
              as: SupplyChainAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "TC-2", name: "Forceps", brand_type: "BRANDED", category: "SURGICAL_INSTRUMENTS", sterile: true, device_class: "CLASS_II", units_per_case: 1, each_price_cents: 300 }
              as: SupplyChainAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /supply/tray-templates"
              payload: { facility_id: "${fac_id}", name: "Laceration tray", procedure_type: "LACERATION_REPAIR", sterile_assembly: true, components: [ { product_id: "${c1_id}", quantity: 1 } ] }
              as: SupplyChainAdmin
              as_user_id: "admin-1"
              captures: { tray_id: $.data.id, tray_v1: $.data.version }
          trigger:
            - call: "POST /supply/tray-templates/${tray_id}/propose-change"
              payload: { components: [ { product_id: "${c1_id}", quantity: 1 }, { product_id: "${c2_id}", quantity: 2 } ], expected_template_version: "${tray_v1}" }
              as: SupplyChainAdmin
              as_user_id: "admin-1"
              captures: { tray_v2: $.data.version }
            - call: "POST /supply/tray-templates/${tray_id}/approval-decision"
              payload: { decision: "REJECT" }
              as: SupplyChainAdmin
              as_user_id: "admin-2"
              captures: { tray_v3: $.data.version }
            - call: "POST /supply/tray-templates/${tray_id}/propose-change"
              payload: { components: [ { product_id: "${c2_id}", quantity: 3 } ], expected_template_version: "${tray_v3}" }
              as: SupplyChainAdmin
              as_user_id: "admin-1"
              captures: { tray_v4: $.data.version }
            - call: "POST /supply/tray-templates/${tray_id}/approval-decision"
              payload: { decision: "APPROVE" }
              as: SupplyChainAdmin
              as_user_id: "admin-2"
              captures: { tray_v5: $.data.version, av1: $.data.approved_version }
            - call: "POST /supply/tray-templates/${tray_id}/propose-change"
              payload: { components: [ { product_id: "${c1_id}", quantity: 2 } ], expected_template_version: "${tray_v5}" }
              as: SupplyChainAdmin
              as_user_id: "admin-1"
              captures: { tray_v6: $.data.version }
            - call: "POST /supply/tray-templates/${tray_id}/approval-decision"
              payload: { decision: "APPROVE" }
              as: SupplyChainAdmin
              as_user_id: "admin-2"
              captures: { tray_v7: $.data.version, av2: $.data.approved_version }
          assert:
            - "Path walked: v1 DRAFT -> propose v2 PENDING_APPROVAL -> REJECT v3 UNDER_CHANGE -> propose v4 PENDING_APPROVAL -> APPROVE v5 ACTIVE (approved_version == 5) -> propose v6 PENDING_APPROVAL -> APPROVE v7 ACTIVE (approved_version == 7)"
            - "Final TrayTemplate.${tray_id}.status == ACTIVE, version == 7, approved_version == 7"
            - "approved_version pins the post-increment version at each approval (5 then 7), proving version-pinning on approval"
      - name: rebate_claim_dispute_resubmission_cycle
        grounds:
          - state_machines.RebateClaim.SUBMITTED_to_DISPUTED
          - state_machines.RebateClaim.DISPUTED_to_SUBMITTED
          - state_machines.RebateClaim.SUBMITTED_to_PAID
        distinguishing_aspect: |
          Cyclic machine on RebateClaim (different entity from TrayTemplate):
          ACCRUED -> SUBMITTED -> DISPUTED -> SUBMITTED -> PAID, with
          final_amount_cents recomputed on the RESUBMIT leg and dispute_reason
          cleared.
        test_recipe:
          setup:
            - "Facility F; claim eligible 250000 (tier 0.01), private_label_share 0.40, compliant true -> provisional 2500, validated rate 0.015 -> final 3750"
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac D", health_system_name: "HS D", facility_type: "LONG_TERM_CARE", ship_to_address: "6 Cedar Ct" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/rebate-claims"
              payload: { facility_id: "${fac_id}", gpo_name: "GPO-A", period_start: "2026-01-01", period_end: "2026-03-31", eligible_purchase_cents: 250000, private_label_share: 0.40, compliant: true }
              as: GPOAnalyst
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /supply/rebate-claims/${claim_id}/lifecycle-events"
              payload: { event: "SUBMIT" }
              as: GPOAnalyst
              captures: { f1: $.data.final_amount_cents }
            - call: "POST /supply/rebate-claims/${claim_id}/lifecycle-events"
              payload: { event: "SETTLE_DISPUTED", dispute_reason: "volume mismatch" }
              as: GPOAnalyst
            - call: "POST /supply/rebate-claims/${claim_id}/lifecycle-events"
              payload: { event: "RESUBMIT" }
              as: GPOAnalyst
              captures: { f2: $.data.final_amount_cents }
            - call: "POST /supply/rebate-claims/${claim_id}/lifecycle-events"
              payload: { event: "SETTLE_PAID" }
              as: GPOAnalyst
          assert:
            - "Status path: ACCRUED -> SUBMITTED -> DISPUTED -> SUBMITTED -> PAID (cycle exercised once)"
            - "final_amount_cents == 3750 after SUBMIT and == 3750 again after RESUBMIT (round_half_up(250000 x 0.015, 0) x 1.0)"
            - "dispute_reason == 'volume mismatch' while DISPUTED and null after RESUBMIT"
            - "Final RebateClaim.${claim_id}.status == PAID (terminal)"

  - rule_id: transitive_cascade
    instances:
      - name: receive_breach_cascades_suspend_and_mutes_programs
        grounds:
          - state_machines.DistributionOrder.SHIPPED_to_RECEIVED
          - state_machines.PrimeVendorAgreement.ACTIVE_to_SUSPENDED
          - calculations.rolling_agreement_fill_rate
        distinguishing_aspect: |
          Depth-3 cascade triggered by a fulfillment RECEIVED event:
          order final-fill computation mutates the agreement's rolling rate
          (link 1), the breach flips the agreement ACTIVE -> SUSPENDED
          (link 2), and that flip mutes auto_replenish_enabled on the
          facility's inventory program (link 3) — each link caused by the
          previous one, not by the original request.
        test_recipe:
          setup:
            - "Facility F; agreement committed_fill_rate_pct 95.0, lum_commitment false, window 2026-08-01..2027-08-31"
            - "Product P1 price 100, units_per_case 1, order_multiple 1"
            - "InventoryProgram IP for F: position {P1, par 50, reorder_point 10, on_hand 5} (DUE, suggested 45 while enabled)"
            - "Order O1 (P1 x100) fully shipped and received -> rolling 100.00, agreement ACTIVE"
            - "Order O2 (P1 x200): ship 170 with backorder_cancelled true -> final 89.47"
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac C", health_system_name: "HS C", facility_type: "ACUTE_CARE", ship_to_address: "7 Walnut Dr" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "CF-1", name: "Syringe", brand_type: "PRIVATE_LABEL", category: "UROLOGICAL", sterile: true, device_class: "CLASS_II", units_per_case: 1, each_price_cents: 100 }
              as: SupplyChainAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /supply/prime-vendor-agreements"
              payload: { facility_id: "${fac_id}", committed_fill_rate_pct: 95.0, deliveries_per_week: 5, lum_commitment: false, annual_commitment_cents: 100000000, start_date: "2026-08-01", end_date: "2027-08-31" }
              as: SupplyChainAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /supply/inventory-programs"
              payload: { facility_id: "${fac_id}", program_type: "STOCKROOM_MANAGED", positions: [ { product_id: "${p1_id}", par_level: 50, reorder_point: 10, on_hand: 5 } ] }
              as: SupplyChainAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /supply/distribution-orders"
              payload: { agreement_id: "${agr_id}", requested_delivery_date: "2026-09-10", lines: [ { product_id: "${p1_id}", ordered_qty: 100 } ] }
              as: FacilitySupplyDirector
              as_user_id: "${fac_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /supply/distribution-orders/${o1_id}/fulfillment-events"
              payload: { event: "SHIPPED", shipped_lines: [ { product_id: "${p1_id}", shipped_qty: 100, backorder_cancelled: false } ] }
              as: SupplyChainAdmin
            - call: "POST /supply/distribution-orders/${o1_id}/fulfillment-events"
              payload: { event: "RECEIVED", shipped_lines: [] }
              as: SupplyChainAdmin
            - call: "POST /supply/distribution-orders"
              payload: { agreement_id: "${agr_id}", requested_delivery_date: "2026-09-16", lines: [ { product_id: "${p1_id}", ordered_qty: 200 } ] }
              as: FacilitySupplyDirector
              as_user_id: "${fac_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /supply/distribution-orders/${o2_id}/fulfillment-events"
              payload: { event: "SHIPPED", shipped_lines: [ { product_id: "${p1_id}", shipped_qty: 170, backorder_cancelled: true } ] }
              as: SupplyChainAdmin
          trigger:
            - call: "POST /supply/distribution-orders/${o2_id}/fulfillment-events"
              payload: { event: "RECEIVED", shipped_lines: [] }
              as: SupplyChainAdmin
              captures: { o2_final: $.data.final_fill_rate_pct }
            - call: "GET /supply/prime-vendor-agreements/${agr_id}"
              payload: {}
              as: SupplyChainAdmin
              captures: { agr_status: $.data.status, agr_roll: $.data.rolling_fill_rate_pct, agr_spent: $.data.spent_cents }
            - call: "GET /supply/inventory-programs/${prog_id}"
              payload: {}
              as: SupplyChainAdmin
              captures: { prog_muted: $.data.auto_replenish_enabled }
          assert:
            - "DistributionOrder.${o2_id}.final_fill_rate_pct == 89.47 (170 / (200 - 10))"
            - "PrimeVendorAgreement.${agr_id}.rolling_fill_rate_pct == 93.10 (270 / 290 unit-weighted) and spent_cents == 30000"
            - "PrimeVendorAgreement.${agr_id}.status == SUSPENDED (93.10 < 95.0) — link 2 fired from the recompute"
            - "InventoryProgram.${prog_id}.auto_replenish_enabled == false — link 3 fired from the suspension"
            - "InventoryProgram.${prog_id} position suggested_order_qty == 0 while muted (was 45 when enabled: max(0, 50 - 5 - 0) rounded to order_multiple 1)"
      - name: substitution_approval_resolves_and_rejects_pending
        grounds:
          - state_machines.SupplyDisruption.MITIGATING_to_RESOLVED
          - state_machines.SupplyDisruption.DECLARED_to_MITIGATING
          - entities.SupplyDisruption.fields.substitution_requests
        distinguishing_aspect: |
          Depth-3 cascade triggered by a Clinician substitution DECIDE (a
          different trigger from fulfillment): APPROVE mutates the disruption's
          coverage totals (link 1), coverage >= disrupted_quantity flips the
          disruption MITIGATING -> RESOLVED (link 2), and the resolution
          auto-rejects every other PENDING substitution request with
          rationale AUTO_RESOLVED (link 3).
        test_recipe:
          setup:
            - "Facilities F1, F2; disrupted product DP (WOUND_CARE, ACTIVE); substitute SP (WOUND_CARE, REGISTERED, ACTIVE)"
            - "Disruption D: disrupted_quantity 100; allocation 40 to F1 already posted (remaining_pool 60, status MITIGATING)"
            - "Substitution requests: R1 (F1, SP, covered 60) and R2 (F2, SP, covered 50), both PENDING"
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac S1", health_system_name: "HS S", facility_type: "ACUTE_CARE", ship_to_address: "8 Ash Way" }
              as: SupplyChainAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /supply/facilities"
              payload: { name: "Fac S2", health_system_name: "HS S", facility_type: "CLINIC", ship_to_address: "9 Ash Way" }
              as: SupplyChainAdmin
              captures: { f2_id: $.data.id }
            - call: "POST /supply/products"
