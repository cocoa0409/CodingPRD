      - name: configuration_posture_endpoints_are_bodyless_actions
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /aircraft/{id}/ground]
          - endpoints[POST /runways/{id}/close]
          - endpoints[POST /weight-programs/{id}/withdraw]
        distinguishing_aspect: |
          Three reference-data actions take no body at all and each answers 200
          with the mutated row rather than 201: the airframe becomes GROUNDED,
          the runway CLOSED and the weight program WITHDRAWN, each with its
          version advanced by exactly one, and no other row is touched.
