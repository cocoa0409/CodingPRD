      - name: on_sale_and_perform_preconditions_each_fail_with_their_own_error
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Show.CONFIRMED_to_ON_SALE"
          - "state_machines.Show.ON_SALE_to_PERFORMED"
          - "validations[priority=17]"
          - "validations[priority=28]"
          - "validations[priority=29]"
          - "validations[priority=30]"
          - "validations[priority=44]"
        distinguishing_aspect: |
          The CONFIRMED -> ON_SALE edge carries four preconditions, and each one has a DIFFERENT error
          id — collapsing them into a single ERR_INVALID_STATE fails. The instance also records the
          audit finding that the edge's fourth precondition (sum of allocations <= capacity) is
          unreachable from CONFIRMED because validations priority 44 already refuses the over-capacity
          tier at creation time. The same audit removed the former priority 31 (ERR_NO_ACCEPTED_OFFER)
          from §1.4 and §1.6 outright: CONFIRMED is reachable only through offer acceptance, so no
          call could ever observe a CONFIRMED show without an ACCEPTED offer, and an error nothing can
          trigger is worse than no error at all. Announce equality is included: clock == announce_at
          must PASS.
        test_recipe:
          setup:
