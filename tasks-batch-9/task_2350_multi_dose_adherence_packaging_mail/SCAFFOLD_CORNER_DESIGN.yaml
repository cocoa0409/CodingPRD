          - endpoints.POST_/pharmacy/prescriptions/{id}/regimen-change
        distinguishing_aspect: "The prescriber writes and answers but never operates: the two clinical write routes accept X-Role Prescriber while the pharmacy-side chase routes on the very same authorization do not."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; patient with one ACTIVE tablet whose refills_authorized is 0"
            - "PharmacyOperations has opened a refill authorization asking for 3 refills"
          setup_api_calls:
