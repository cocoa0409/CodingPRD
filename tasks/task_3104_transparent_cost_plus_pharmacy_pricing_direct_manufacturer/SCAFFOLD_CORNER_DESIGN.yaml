              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "Claim.${c_id}.status is still PENDING and reserved_quantity is 0"
            - "the same PharmacyOps role succeeds on its own exclusive POST /formularies/${d_id}/expansion after the demand gate is satisfied"

      - name: anonymous_reaches_only_the_health_probe
        claim_type: Role denial
        grounds:
          - roles.Anonymous.shared_operations
          - endpoints.GET_/_health
          - endpoints.GET_/drugs
          - errors[ERR_MISSING_ROLE_HEADER]
        distinguishing_aspect: >
          Anonymous holds exactly one shared operation, so the health probe succeeds
          while a drug read under the same role header is refused, and an absent role
          header is refused with ERR_MISSING_ROLE_HEADER rather than a 403.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PharmacyOps
          trigger:
            - call: "GET /_health"
              payload: {}
              as: Anonymous
            - call: "GET /drugs"
              payload: {}
              as: Anonymous
              captures: { err_role: $.data.error_id }
            - call: "GET /drugs"
              payload: {}
              as: ""
              captures: { err_header: $.data.error_id }
          assert:
            - "the health probe returns 200"
            - "the Anonymous drug read returns 403 with error_id ERR_ROLE_NOT_PERMITTED"
            - "the headerless drug read returns 401 with error_id ERR_MISSING_ROLE_HEADER, a different error from the rising role failure"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: rate_threshold_licence_expiry_requires_expiry_strictly_after_the_clock
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.PharmacyLicense.transitions.PENDING_to_ACTIVE
          - state_machines.PharmacyLicense.transitions.ACTIVE_to_EXPIRED
          - endpoints.POST_/pharmacies/{id}/licenses/{license_id}/verification
        distinguishing_aspect: >
          The verification threshold is a strict-after comparison against the logical
          clock, so verifying one second before expiry activates the licence while
          verifying at or after expiry expires it, and the same endpoint produces two
          different states from the clock alone.
        test_recipe:
          setup:
            - "Pharmacy PH has a PENDING CA licence L expiring 2026-10-01T00:00:00Z. Logical clock starts at 2026-09-30T23:59:59Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T23:59:59Z" }
              as: PharmacyOps
            - call: "POST /pharmacies"
              payload: { pharmacy_name: "Sunbelt Mail Pharmacy", domicile_state_code: "TX", shipping_enabled: true }
              as: PharmacyOps
              captures: { ph_id: $.data.id }
            - call: "POST /pharmacies/${ph_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-MP-1001", expiry_at: "2026-10-01T00:00:00Z" }
              as: PharmacyOps
              captures: { l_id: $.data.id }
            - call: "POST /pharmacies/${ph_id}/licenses"
              payload: { state_code: "TX", license_number: "TX-MP-1001", expiry_at: "2026-10-01T00:00:00Z" }
              as: PharmacyOps
              captures: { l2_id: $.data.id }
          trigger:
            - call: "POST /pharmacies/${ph_id}/licenses/${l_id}/verification"
              payload: {}
              as: PharmacyOps
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PharmacyOps
            - call: "POST /pharmacies/${ph_id}/licenses/${l2_id}/verification"
              payload: {}
              as: PharmacyOps
          assert:
            - "the first verification at 2026-09-30T23:59:59Z returns 200 and PharmacyLicense.${l_id}.status == \"ACTIVE\" with verified_at set"
            - "the second verification at exactly 2026-10-01T00:00:00Z returns 200 and PharmacyLicense.${l2_id}.status == \"EXPIRED\""
            - "the threshold is strict-after, so expiry equal to the clock does not activate"

      - name: derived_drug_supply_units_reconcile_with_the_eligible_pool_after_a_sourcing_change
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Drug.fields.supply_units
          - entities.Drug.fields.sourcing_status
          - calculations.sourcing_status
          - endpoints.POST_/manufacturer-drug-prices/{id}/sourcing
        distinguishing_aspect: >
          supply_units is a denormalized aggregate over the eligible pool, so moving a
          500-unit row out of SOURCED drops supply_units from 500 to 0 and flips
          sourcing_status to UNDER_REVIEW in the same request.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Drug D has one ACTIVE+SOURCED row P with 500 units, so supply_units is 500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PharmacyOps
            - call: "POST /manufacturers"
              payload: { manufacturer_name: "Bexley Generics" }
              as: PharmacyOps
              captures: { m_id: $.data.id }
            - call: "POST /drugs"
              payload: { drug_name: "Metformin HCL", strength: "500MG", dosage_form: "Tablet", is_controlled: false, retail_reference_price_cents: 4200, insured_reference_price_cents: 3600 }
              as: PharmacyOps
              captures: { d_id: $.data.id }
            - call: "POST /manufacturer-drug-prices"
              payload: { drug_id: "${d_id}", manufacturer_id: "${m_id}", unit_cost_cents: 12, available_units: 500, reliability_tier: "A", packaging: "500-count bottle" }
              as: PharmacyOps
              captures: { p_id: $.data.id }
            - call: "POST /manufacturer-drug-prices/${p_id}/activation"
              payload: {}
              as: PharmacyOps
            - call: "POST /manufacturer-drug-prices/${p_id}/sourcing"
              payload: { to_sourcing_status: "SOURCED" }
              as: PharmacyOps
          trigger:
            - call: "GET /drugs/${d_id}"
              payload: {}
              as: PharmacyOps
            - call: "POST /manufacturer-drug-prices/${p_id}/sourcing"
              payload: { to_sourcing_status: "UNDER_REVIEW" }
              as: PharmacyOps
            - call: "GET /drugs/${d_id}"
              payload: {}
              as: PharmacyOps
          assert:
            - "before the change Drug.${d_id}.supply_units == 500 and sourcing_status == \"SOURCED\""
            - "after the change Drug.${d_id}.supply_units == 0 and sourcing_status == \"UNDER_REVIEW\""
            - "the price row itself is unchanged apart from sourcing_status: unit_cost_cents is still 12 and available_units is still 500"

      - name: cascading_side_effects_are_covered_by_the_difficulty_cascade_instances
        claim_type: cascading_side_effects
        grounds:
