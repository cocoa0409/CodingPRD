              as: Resident
              as_user_id: "${r1_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "Response HTTP status is 409"
            - "Response data.error_id == \"ERR_GROUP_EVENT_CAPACITY\""
            - "Fourth overlapping event rejected due to aggregate concurrent-cap = 3"

