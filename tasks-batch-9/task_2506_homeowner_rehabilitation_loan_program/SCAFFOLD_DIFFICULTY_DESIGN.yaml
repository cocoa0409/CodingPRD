          setup:
            - "one RehabApplication in BID_OPEN whose solicitation has min_bids_required 2 and independent_cost_estimate_cents 2,200,000, so the responsive window is 1,650,000 to 2,420,000"
            - "two APPROVED contractors: c1 bids 2,000,000, c2 bids 1,900,000"
