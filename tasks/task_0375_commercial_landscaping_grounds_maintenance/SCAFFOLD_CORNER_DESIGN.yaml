# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Commercial Landscaping & Grounds Maintenance (Expert)
# Breadth probe over §1.1-§1.7. excluded_because stubs cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_contract_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.ServiceContract, endpoints]
        distinguishing_aspect: "POST /v1/contracts with all required fields returns 201; status=DRAFT, committed_cents=0, budget_remaining_cents==annual_budget_cents, version=1."
        test_recipe:
          setup: ["An account and a site exist."]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
              captures: { site: $.data.id }
          trigger:
            - call: "POST /v1/contracts"
              payload: { service_account_id: "${acct}", site_id: "${site}", annual_budget_cents: 5000000, billing_cycle: "MONTHLY" }
              as: AccountManager
              captures: { contract: $.data.id }
          assert:
            - "response.status == 201"
            - "ServiceContract.${contract}.status == DRAFT"
            - "ServiceContract.${contract}.committed_cents == 0"
            - "ServiceContract.${contract}.budget_remaining_cents == 5000000"
            - "ServiceContract.${contract}.version == 1"

      - name: get_contract_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.ServiceContract, "errors[ERR_CONTRACT_NOT_FOUND]"]
        distinguishing_aspect: "GET /v1/contracts/{id} with a non-existent UUID returns ERR_CONTRACT_NOT_FOUND (404)."
        test_recipe:
          setup: ["An account exists; no contract with the queried id."]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
          trigger:
            - call: "GET /v1/contracts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_CONTRACT_NOT_FOUND"

      - name: create_site_missing_turf_area_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Site.fields.turf_area_sqft, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /v1/sites omitting required turf_area_sqft returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An account exists."]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_site_zero_turf_area_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Site.fields.turf_area_sqft, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "turf_area_sqft=0 violates the '> 0' constraint and returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["An account exists."]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 0 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: site_snow_zone_defaults_to_standard
        claim_type: Defaults
        grounds: [entities.Site.fields.snow_zone]
        distinguishing_aspect: "Omitting snow_zone on site creation applies the default STANDARD."
        test_recipe:
          setup: ["An account exists."]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
              captures: { site: $.data.id }
          assert:
            - "Site.${site}.snow_zone == STANDARD"

      - name: visit_estimated_charge_is_computed_not_client_supplied
        claim_type: Computed Fields
        grounds: [entities.ServiceVisit.fields.estimated_charge_cents, calculations.visit_estimated_charge]
        distinguishing_aspect: "estimated_charge_cents is server-computed (50000 area + 9000 labor = 59000) regardless of any client-sent value; not an input field."
        test_recipe:
          setup: ["Account/site(turf=5000)/ACTIVE contract/plan(base_rate=10000)/crew(hourly=6000)/OPEN route."]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
              captures: { site: $.data.id }
            - call: "POST /v1/contracts"
              payload: { service_account_id: "${acct}", site_id: "${site}", annual_budget_cents: 100000000, billing_cycle: "MONTHLY" }
              as: AccountManager
              captures: { contract: $.data.id }
            - call: "POST /v1/plans"
              payload: { service_contract_id: "${contract}", service_type: "MOWING", frequency: "WEEKLY", base_rate_cents: 10000 }
              as: AccountManager
              captures: { plan: $.data.id }
            - call: "POST /v1/contracts/${contract}/activate"
              payload: {}
              as: AccountManager
              captures: { cver: $.data.version }
            - call: "POST /v1/crews"
              payload: { service_account_id: "${acct}", name: "Crew A", hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { crew: $.data.id }
            - call: "POST /v1/routes"
              payload: { crew_id: "${crew}", route_date: "2026-06-01", shift_start_minute: 400, shift_end_minute: 800 }
              as: CrewLead
              captures: { route: $.data.id }
          trigger:
            - call: "POST /v1/visits"
              payload: { service_plan_id: "${plan}", route_schedule_id: "${route}", slot_start_minute: 480, slot_duration_minute: 90, expected_service_contract_version: "${cver}" }
              as: CrewLead
              captures: { visit: $.data.id }
          assert:
            - "ServiceVisit.${visit}.estimated_charge_cents == 59000"

      - name: list_sites_filtered_by_account_paginated
        claim_type: Listing
        grounds: [entities.Site, endpoints]
        distinguishing_aspect: "GET /v1/sites?service_account_id=... returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["An account with two sites."]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "S1", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "S2", address: "2 Main", turf_area_sqft: 6000 }
              as: AccountManager
          trigger:
            - call: "GET /v1/sites"
              payload: { service_account_id: "${acct}" }
              as: AccountManager
          assert:
            - "response.response_type == array"
            - "response.meta has total_count == 2 and has_more == false"

      - name: fk_reverse_list_plans_by_contract
        claim_type: Parent Relationships
        grounds: [entities.ServicePlan.fields.service_contract_id, endpoints]
        distinguishing_aspect: "GET /v1/plans?service_contract_id=... returns ServicePlan[] for that contract (FK reverse-reachability)."
        test_recipe:
          setup: ["A contract with one plan."]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
              captures: { site: $.data.id }
            - call: "POST /v1/contracts"
              payload: { service_account_id: "${acct}", site_id: "${site}", annual_budget_cents: 100000000, billing_cycle: "MONTHLY" }
              as: AccountManager
              captures: { contract: $.data.id }
            - call: "POST /v1/plans"
              payload: { service_contract_id: "${contract}", service_type: "MOWING", frequency: "WEEKLY", base_rate_cents: 10000 }
              as: AccountManager
              captures: { plan: $.data.id }
          trigger:
            - call: "GET /v1/plans"
              payload: { service_contract_id: "${contract}" }
              as: AccountManager
          assert:
            - "response.response_type == array"
            - "response.data contains a ServicePlan with id == ${plan}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_contract_with_no_plan_returns_no_plan_defined
        claim_type: Precondition Enforcement
        grounds: [state_machines.ServiceContract.DRAFT_to_ACTIVE, "errors[ERR_NO_PLAN_DEFINED]"]
        distinguishing_aspect: "Activating a DRAFT contract with zero plans returns ERR_NO_PLAN_DEFINED (409)."
        test_recipe:
          setup: ["A DRAFT contract with no plans."]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
              captures: { site: $.data.id }
            - call: "POST /v1/contracts"
              payload: { service_account_id: "${acct}", site_id: "${site}", annual_budget_cents: 100000000, billing_cycle: "MONTHLY" }
              as: AccountManager
              captures: { contract: $.data.id }
          trigger:
            - call: "POST /v1/contracts/${contract}/activate"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_PLAN_DEFINED"

      - name: cancel_already_cancelled_visit_returns_not_cancellable
        claim_type: invalid_transition
        grounds: [state_machines.ServiceVisit.SCHEDULED_to_CANCELLED, "errors[ERR_VISIT_NOT_CANCELLABLE]"]
        distinguishing_aspect: "A second cancel on an already-CANCELLED visit returns ERR_VISIT_NOT_CANCELLABLE (409); no side effects fire."
        test_recipe:
          setup: ["Account/site/ACTIVE contract/plan/crew/route; a SCHEDULED visit already cancelled once."]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
              captures: { site: $.data.id }
            - call: "POST /v1/contracts"
              payload: { service_account_id: "${acct}", site_id: "${site}", annual_budget_cents: 100000000, billing_cycle: "MONTHLY" }
              as: AccountManager
              captures: { contract: $.data.id }
            - call: "POST /v1/plans"
              payload: { service_contract_id: "${contract}", service_type: "MOWING", frequency: "WEEKLY", base_rate_cents: 10000 }
              as: AccountManager
              captures: { plan: $.data.id }
            - call: "POST /v1/contracts/${contract}/activate"
              payload: {}
              as: AccountManager
              captures: { cver: $.data.version }
            - call: "POST /v1/crews"
              payload: { service_account_id: "${acct}", name: "Crew A", hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { crew: $.data.id }
            - call: "POST /v1/routes"
              payload: { crew_id: "${crew}", route_date: "2026-06-01", shift_start_minute: 400, shift_end_minute: 800 }
              as: CrewLead
              captures: { route: $.data.id }
            - call: "POST /v1/visits"
              payload: { service_plan_id: "${plan}", route_schedule_id: "${route}", slot_start_minute: 480, slot_duration_minute: 90, expected_service_contract_version: "${cver}" }
              as: CrewLead
              captures: { visit: $.data.id }
            - call: "POST /v1/visits/${visit}/cancel"
              payload: {}
              as: CrewLead
          trigger:
            - call: "POST /v1/visits/${visit}/cancel"
              payload: {}
              as: CrewLead
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_VISIT_NOT_CANCELLABLE"

      - name: terminate_contract_is_terminal_no_reactivation
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ServiceContract.ACTIVE_to_TERMINATED, "errors[ERR_CONTRACT_NOT_SUSPENDED]"]
        distinguishing_aspect: "A TERMINATED contract cannot be reactivated; activate returns ERR_CONTRACT_NOT_SUSPENDED (the activate-from-SUSPENDED guard) (409)."
        test_recipe:
          setup: ["Account/site/contract activated then terminated (no IN_PROGRESS visits)."]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
              captures: { site: $.data.id }
            - call: "POST /v1/contracts"
              payload: { service_account_id: "${acct}", site_id: "${site}", annual_budget_cents: 100000000, billing_cycle: "MONTHLY" }
              as: AccountManager
              captures: { contract: $.data.id }
            - call: "POST /v1/plans"
              payload: { service_contract_id: "${contract}", service_type: "MOWING", frequency: "WEEKLY", base_rate_cents: 10000 }
              as: AccountManager
              captures: { plan: $.data.id }
            - call: "POST /v1/contracts/${contract}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /v1/contracts/${contract}/terminate"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /v1/contracts/${contract}/activate"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CONTRACT_NOT_SUSPENDED"

      - name: storm_event_redispatch_loop_clears_crew
        claim_type: cyclic
        grounds: [state_machines.SnowStormEvent.DISPATCHED_to_REPORTED, entities.SnowStormEvent.fields.assigned_crew_id]
        distinguishing_aspect: "Abandon returns a DISPATCHED event to REPORTED and resets assigned_crew_id to null, enabling re-dispatch."
        test_recipe:
          setup: ["Account/site/certified crew; a storm event DISPATCHED (assigned_crew_id set)."]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "HQ", address: "9 Oak", turf_area_sqft: 4000, snow_zone: "STANDARD" }
              as: AccountManager
              captures: { site: $.data.id }
            - call: "POST /v1/crews"
              payload: { service_account_id: "${acct}", name: "Snow Crew", hourly_rate_cents: 5000, certified_for_snow: true }
              as: AccountManager
              captures: { crew: $.data.id }
            - call: "POST /v1/storm-events"
              payload: { site_id: "${site}", snowfall_inches: 5, response_deadline_minute: 600 }
              as: DispatchOperator
              captures: { event: $.data.id }
            - call: "POST /v1/storm-events/${event}/dispatch"
              payload: {}
              as: DispatchOperator
          trigger:
            - call: "POST /v1/storm-events/${event}/abandon"
              payload: {}
              as: DispatchOperator
          assert:
            - "SnowStormEvent.${event}.status == REPORTED"
            - "SnowStormEvent.${event}.assigned_crew_id == null"

      - name: complete_visit_consumes_reserved_equipment
        claim_type: Side Effect Execution
        grounds: [state_machines.ServiceVisit.IN_PROGRESS_to_COMPLETED, state_machines.EquipmentReservation.RESERVED_to_CONSUMED]
        distinguishing_aspect: "Completing a visit transitions its RESERVED reservation to CONSUMED while retaining its usage minutes on the asset (accumulated_usage_minutes stays 120)."
        test_recipe:
          setup: ["Account/site/ACTIVE contract/plan/crew/LOCKED route; visit started; one RESERVED reservation [480,600] on a 100-hr-interval asset (accumulated_usage_minutes=120)."]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
              captures: { site: $.data.id }
            - call: "POST /v1/contracts"
              payload: { service_account_id: "${acct}", site_id: "${site}", annual_budget_cents: 100000000, billing_cycle: "MONTHLY" }
              as: AccountManager
              captures: { contract: $.data.id }
            - call: "POST /v1/plans"
              payload: { service_contract_id: "${contract}", service_type: "MOWING", frequency: "WEEKLY", base_rate_cents: 10000 }
              as: AccountManager
              captures: { plan: $.data.id }
            - call: "POST /v1/contracts/${contract}/activate"
              payload: {}
              as: AccountManager
              captures: { cver: $.data.version }
            - call: "POST /v1/crews"
              payload: { service_account_id: "${acct}", name: "Crew A", hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { crew: $.data.id }
            - call: "POST /v1/routes"
              payload: { crew_id: "${crew}", route_date: "2026-06-01", shift_start_minute: 400, shift_end_minute: 800 }
              as: CrewLead
              captures: { route: $.data.id }
            - call: "POST /v1/visits"
              payload: { service_plan_id: "${plan}", route_schedule_id: "${route}", slot_start_minute: 480, slot_duration_minute: 90, expected_service_contract_version: "${cver}" }
              as: CrewLead
              captures: { visit: $.data.id }
            - call: "POST /v1/equipment"
              payload: { service_account_id: "${acct}", name: "Mower 3", hourly_usage_cost_cents: 3000, service_interval_hours: 100 }
              as: AccountManager
              captures: { asset: $.data.id }
            - call: "POST /v1/reservations"
              payload: { equipment_asset_id: "${asset}", service_visit_id: "${visit}", window_start_minute: 480, window_end_minute: 600 }
              as: CrewLead
              captures: { resv: $.data.id }
            - call: "POST /v1/routes/${route}/lock"
              payload: {}
              as: CrewLead
            - call: "POST /v1/visits/${visit}/start"
              payload: {}
              as: CrewLead
          trigger:
            - call: "POST /v1/visits/${visit}/complete"
              payload: { actual_labor_minutes: 90 }
              as: CrewLead
          assert:
            - "ServiceVisit.${visit}.execution_status == COMPLETED"
            - "EquipmentReservation.${resv}.status == CONSUMED"
            - "EquipmentAsset.${asset}.accumulated_usage_minutes == 120"

      - name: failed_inspection_writes_off_visit_billing
        claim_type: Side Effect Execution
        grounds: [state_machines.QualityInspection.PENDING_to_FAILED, entities.ServiceVisit.fields.billing_status]
        distinguishing_aspect: "Grading score=40 (< REWORK_FLOOR=60) FAILS the inspection and sets the parent visit billing_status to WRITTEN_OFF."
        test_recipe:
          setup: ["Account/site/ACTIVE contract/plan/crew/LOCKED route; visit completed (actual=90); a PENDING inspection."]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
              captures: { site: $.data.id }
            - call: "POST /v1/contracts"
              payload: { service_account_id: "${acct}", site_id: "${site}", annual_budget_cents: 100000000, billing_cycle: "MONTHLY" }
              as: AccountManager
              captures: { contract: $.data.id }
            - call: "POST /v1/plans"
              payload: { service_contract_id: "${contract}", service_type: "MOWING", frequency: "WEEKLY", base_rate_cents: 10000 }
              as: AccountManager
              captures: { plan: $.data.id }
            - call: "POST /v1/contracts/${contract}/activate"
              payload: {}
              as: AccountManager
              captures: { cver: $.data.version }
            - call: "POST /v1/crews"
              payload: { service_account_id: "${acct}", name: "Crew A", hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { crew: $.data.id }
            - call: "POST /v1/routes"
              payload: { crew_id: "${crew}", route_date: "2026-06-01", shift_start_minute: 400, shift_end_minute: 800 }
              as: CrewLead
              captures: { route: $.data.id }
            - call: "POST /v1/visits"
              payload: { service_plan_id: "${plan}", route_schedule_id: "${route}", slot_start_minute: 480, slot_duration_minute: 90, expected_service_contract_version: "${cver}" }
              as: CrewLead
              captures: { visit: $.data.id }
            - call: "POST /v1/routes/${route}/lock"
              payload: {}
              as: CrewLead
            - call: "POST /v1/visits/${visit}/start"
              payload: {}
              as: CrewLead
            - call: "POST /v1/visits/${visit}/complete"
              payload: { actual_labor_minutes: 90 }
              as: CrewLead
            - call: "POST /v1/inspections"
              payload: { service_visit_id: "${visit}" }
              as: QualityInspector
              captures: { insp: $.data.id }
          trigger:
            - call: "POST /v1/inspections/${insp}/grade"
              payload: { score: 40 }
              as: QualityInspector
          assert:
            - "QualityInspection.${insp}.status == FAILED"
            - "ServiceVisit.${visit}.billing_status == WRITTEN_OFF"

      - name: new_contract_initial_state_is_draft
        claim_type: Initial State
        grounds: [state_machines.ServiceContract, entities.ServiceContract.fields.status]
        distinguishing_aspect: "A newly created contract starts in DRAFT (the declared initial_state)."
        test_recipe:
          setup: ["An account and site exist."]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
              captures: { site: $.data.id }
          trigger:
            - call: "POST /v1/contracts"
              payload: { service_account_id: "${acct}", site_id: "${site}", annual_budget_cents: 100000000, billing_cycle: "MONTHLY" }
              as: AccountManager
