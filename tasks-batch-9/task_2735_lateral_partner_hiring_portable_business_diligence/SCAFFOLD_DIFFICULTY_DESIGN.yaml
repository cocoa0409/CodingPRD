  - rule_id: resource_temporal_overlap
    instances:

      - name: practice_group_engagement_half_open_plus_tail_off_gap
        grounds:
          - validations[priority=17]
          - errors[ERR_ENGAGEMENT_EXCLUSIVITY_CONFLICT]
          - state_machines.SearchFirmEngagement.null_to_ACTIVE
          - entities.SearchFirmEngagement.fields.tail_off_days
          - entities.SearchFirmEngagement.fields.exclusivity_end_date
        distinguishing_aspect: |
          Resource = the PRACTICE GROUP, and the interval semantics are HALF-OPEN
          [start, end) overlap PLUS a mandatory tail-off OFFSET: a new engagement must clear
          existing.exclusivity_end_date + existing.tail_off_days days. Three probes are
          refused for two different reasons — a genuine mid-window overlap (2026-10-01), a
          merely TOUCHING window that half-open geometry alone would admit (2026-12-01, gap
          0), and a near miss one day short of the 90-day tail (2027-02-28, gap 89) — while
          the exact gap boundary 2027-03-01 is admitted. max_concurrent_engagements is 3 so
          the search-firm capacity rule can never account for any of it.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup and one SearchFirm with max_fee_pct 0.3000 and max_concurrent_engagements 3."
            - "One ACTIVE SearchFirmEngagement on that practice group with exclusivity [2026-08-01, 2026-12-01) and tail_off_days 90, so the earliest compliant next start is 2026-12-01 + 90 days = 2027-03-01."
            - "The logical clock is at its default 2026-08-01T00:00:00.000Z, well before the tail-off end, so nothing has auto-expired."
          setup_api_calls:
            - call: "POST /lateral-hiring/practice-groups"
              payload: { name: "Corporate & Securities", guarantee_budget_total_usd: 5000000.00, onboarding_capacity: 2, leverage_ratio: 3.20, target_standard_rate_usd: 950.00 }
              as: SystemAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /lateral-hiring/search-firms"
              payload: { name: "Meridian Legal Search", max_fee_pct: 0.3000, max_concurrent_engagements: 3 }
              as: SystemAdmin
              captures: { sf_id: $.data.id }
            - call: "POST /lateral-hiring/search-firm-engagements"
              payload: { search_firm_id: "${sf_id}", practice_group_id: "${pg_id}", fee_pct: 0.2500, fee_cap_usd: 400000.00, exclusivity_start_date: "2026-08-01T00:00:00.000Z", exclusivity_end_date: "2026-12-01T00:00:00.000Z", tail_off_days: 90 }
              as: RecruitingCoordinator
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /lateral-hiring/search-firm-engagements"
              payload: { search_firm_id: "${sf_id}", practice_group_id: "${pg_id}", fee_pct: 0.2500, fee_cap_usd: 400000.00, exclusivity_start_date: "2026-10-01T00:00:00.000Z", exclusivity_end_date: "2027-01-01T00:00:00.000Z", tail_off_days: 90 }
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/search-firm-engagements"
              payload: { search_firm_id: "${sf_id}", practice_group_id: "${pg_id}", fee_pct: 0.2500, fee_cap_usd: 400000.00, exclusivity_start_date: "2026-12-01T00:00:00.000Z", exclusivity_end_date: "2027-03-01T00:00:00.000Z", tail_off_days: 90 }
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/search-firm-engagements"
              payload: { search_firm_id: "${sf_id}", practice_group_id: "${pg_id}", fee_pct: 0.2500, fee_cap_usd: 400000.00, exclusivity_start_date: "2027-02-28T00:00:00.000Z", exclusivity_end_date: "2027-05-28T00:00:00.000Z", tail_off_days: 90 }
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/search-firm-engagements"
              payload: { search_firm_id: "${sf_id}", practice_group_id: "${pg_id}", fee_pct: 0.2500, fee_cap_usd: 400000.00, exclusivity_start_date: "2027-03-01T00:00:00.000Z", exclusivity_end_date: "2027-06-01T00:00:00.000Z", tail_off_days: 90 }
              as: RecruitingCoordinator
              captures: { eng2_id: $.data.id }
          assert:
            - "the mid-window 2026-10-01 request is rejected with ERR_ENGAGEMENT_EXCLUSIVITY_CONFLICT (409)"
            - "the touching 2026-12-01 request is rejected with ERR_ENGAGEMENT_EXCLUSIVITY_CONFLICT (409)"
            - "the 2027-02-28 request, exactly one day short of the 90-day tail, is rejected with ERR_ENGAGEMENT_EXCLUSIVITY_CONFLICT (409)"
            - "none of the three rejections is ERR_SEARCH_FIRM_CAPACITY_EXCEEDED (409)"
            - "the 2027-03-01 request is accepted"
            - "SearchFirmEngagement.${eng2_id}.status == ACTIVE"
            - "SearchFirmEngagement.${eng2_id}.exclusivity_start_date == 2027-03-01T00:00:00.000Z"
            - "SearchFirmEngagement.${eng2_id}.tail_off_days == 90"
            - "SearchFirmEngagement.${eng2_id}.fee_status == NOT_DUE"
            - "SearchFirmEngagement.${eng_id}.status == ACTIVE"
            - "SearchFirm.${sf_id}.engagement_count == 2"

      - name: search_firm_closed_interval_capacity_touching_endpoints
        grounds:
          - validations[priority=18]
          - errors[ERR_SEARCH_FIRM_CAPACITY_EXCEEDED]
          - entities.SearchFirm.fields.max_concurrent_engagements
          - entities.SearchFirm.fields.engagement_count
          - state_machines.SearchFirmEngagement.null_to_ACTIVE
        distinguishing_aspect: |
          Resource = the SEARCH FIRM, and the interval semantics are the opposite of the
          practice-group rule: CLOSED [start, end] INTERSECTION COUNTING against
          max_concurrent_engagements, with no offset term at all. Every engagement sits on a
          DIFFERENT practice group so the exclusivity rule can never fire. The refused
          request [2026-12-01, 2027-01-01) touches engagement A only at the single instant
          2026-12-01 — under half-open geometry its concurrency count would be 1 and it
          would be admitted; under closed geometry the count is 2 and it must be refused.
          The later disjoint window is then admitted, proving the counter is windowed and
          not a running total.
        test_recipe:
          setup:
            - "Three OPEN PracticeGroups (Corporate & Securities, Litigation, Tax) and one SearchFirm with max_concurrent_engagements 2."
            - "One ACTIVE SearchFirmEngagement A on the Corporate group with exclusivity [2026-08-01, 2026-12-01) and tail_off_days 0."
            - "The logical clock is at its default 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /lateral-hiring/practice-groups"
              payload: { name: "Corporate & Securities", guarantee_budget_total_usd: 5000000.00, onboarding_capacity: 2, leverage_ratio: 3.20, target_standard_rate_usd: 950.00 }
              as: SystemAdmin
              captures: { pg_a_id: $.data.id }
            - call: "POST /lateral-hiring/practice-groups"
              payload: { name: "Litigation", guarantee_budget_total_usd: 5000000.00, onboarding_capacity: 2, leverage_ratio: 3.20, target_standard_rate_usd: 950.00 }
              as: SystemAdmin
              captures: { pg_b_id: $.data.id }
            - call: "POST /lateral-hiring/practice-groups"
              payload: { name: "Tax", guarantee_budget_total_usd: 5000000.00, onboarding_capacity: 2, leverage_ratio: 3.20, target_standard_rate_usd: 950.00 }
              as: SystemAdmin
              captures: { pg_c_id: $.data.id }
            - call: "POST /lateral-hiring/search-firms"
              payload: { name: "Meridian Legal Search", max_fee_pct: 0.3000, max_concurrent_engagements: 2 }
              as: SystemAdmin
              captures: { sf_id: $.data.id }
            - call: "POST /lateral-hiring/search-firm-engagements"
              payload: { search_firm_id: "${sf_id}", practice_group_id: "${pg_a_id}", fee_pct: 0.2500, fee_cap_usd: 400000.00, exclusivity_start_date: "2026-08-01T00:00:00.000Z", exclusivity_end_date: "2026-12-01T00:00:00.000Z", tail_off_days: 0 }
              as: RecruitingCoordinator
              captures: { eng_a_id: $.data.id }
          trigger:
            - call: "POST /lateral-hiring/search-firm-engagements"
              payload: { search_firm_id: "${sf_id}", practice_group_id: "${pg_b_id}", fee_pct: 0.2500, fee_cap_usd: 400000.00, exclusivity_start_date: "2026-12-01T00:00:00.000Z", exclusivity_end_date: "2027-04-01T00:00:00.000Z", tail_off_days: 0 }
              as: RecruitingCoordinator
              captures: { eng_b_id: $.data.id }
            - call: "POST /lateral-hiring/search-firm-engagements"
              payload: { search_firm_id: "${sf_id}", practice_group_id: "${pg_c_id}", fee_pct: 0.2500, fee_cap_usd: 400000.00, exclusivity_start_date: "2026-12-01T00:00:00.000Z", exclusivity_end_date: "2027-01-01T00:00:00.000Z", tail_off_days: 0 }
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/search-firm-engagements"
              payload: { search_firm_id: "${sf_id}", practice_group_id: "${pg_c_id}", fee_pct: 0.2500, fee_cap_usd: 400000.00, exclusivity_start_date: "2027-05-01T00:00:00.000Z", exclusivity_end_date: "2027-08-01T00:00:00.000Z", tail_off_days: 0 }
              as: RecruitingCoordinator
              captures: { eng_d_id: $.data.id }
          assert:
            - "engagement B is accepted even though its CLOSED window touches engagement A at 2026-12-01, because the resulting count 1 is below the capacity 2"
            - "the third request on the Tax group is rejected with ERR_SEARCH_FIRM_CAPACITY_EXCEEDED (409)"
            - "the third request is NOT rejected with ERR_ENGAGEMENT_EXCLUSIVITY_CONFLICT (409)"
            - "the disjoint 2027-05-01 request is accepted"
            - "SearchFirmEngagement.${eng_a_id}.status == ACTIVE"
            - "SearchFirmEngagement.${eng_b_id}.status == ACTIVE"
            - "SearchFirmEngagement.${eng_b_id}.exclusivity_start_date == 2026-12-01T00:00:00.000Z"
            - "SearchFirmEngagement.${eng_d_id}.status == ACTIVE"
            - "SearchFirm.${sf_id}.engagement_count == 3"

      - name: introduction_closed_slot_pairwise_and_containment
        grounds:
          - validations[priority=19]
          - errors[ERR_INTRODUCTION_SLOT_CONFLICT]
          - errors[ERR_INTRODUCTION_OUTSIDE_WINDOW]
          - state_machines.CrossSellIntroduction.null_to_PROPOSED
          - entities.IntegrationPlan.fields.introduction_count
        distinguishing_aspect: |
          Resource = the INTEGRATION PLAN, and the semantics are a THIRD variety: CLOSED
          [start, end] PAIRWISE EXCLUSION combined with CLOSED CONTAINMENT inside
          [onboarding_start_date, onboarding_end_date]. The probe pair is one millisecond
          apart — a slot starting exactly at the incumbent's end instant is refused
          (touching intersects under closed semantics) while the same slot shifted by
          0.001 s is admitted — and a fourth slot that starts inside the onboarding window
          but ends one day past it is refused by containment rather than by collision, so the
          two error ids in this rule are not interchangeable.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup (onboarding_capacity 2) and one Candidate HIRED at 2026-08-01 with resignation_date 2026-08-01, non_solicit_days 30 and earliest_start_date 2026-09-15."
            - "One ACTIVE IntegrationPlan with onboarding_start_date 2026-10-01T00:00:00.000Z and onboarding_end_date 2027-06-30T00:00:00.000Z, introduction_count 0."
            - "PracticeGroup.active_onboarding_count is 1 because the plan was activated."
          setup_api_calls:
            - call: "POST /lateral-hiring/practice-groups"
              payload: { name: "Corporate & Securities", guarantee_budget_total_usd: 5000000.00, onboarding_capacity: 2, leverage_ratio: 3.20, target_standard_rate_usd: 950.00 }
              as: SystemAdmin
