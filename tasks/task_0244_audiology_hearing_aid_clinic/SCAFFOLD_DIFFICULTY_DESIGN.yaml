  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: purchase_then_return_conserves_net_patient_charge_to_restock
        grounds:
          - state_machines.FittingOrder.TRIAL_to_PURCHASED
          - state_machines.FittingOrder.PURCHASED_to_RETURNED
          - calculations.return_refund
          - entities.FittingOrder.fields.refund_cents
        distinguishing_aspect: |
          Conserved quantity = net patient charge: patient_due_cents - refund_cents == restock_fee_cents
          (15000). Purchase (forward) + in-window return (compensating) leave the patient's net bill exactly
          the restocking fee, with zero drift.
        test_recipe:
          setup:
            - "Clock 2026-03-01. A self-pay monaural order (model 300000, restock 15000) PURCHASED (due=300000)."
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "NetCharge Pt", date_of_birth: "1956-08-08" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-NET-1", name: "NetModel", list_price_cents: 300000, restock_fee_cents: 15000, min_severity: "MILD", firmware_version: "1.0.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 50 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1 }
              as: Audiologist
              captures: { order_id: $.data.id }
            - call: "POST /clinic/orders/${order_id}/start-trial"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders/${order_id}/purchase"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /clinic/orders/${order_id}/return"
              payload: {}
              as: BillingClerk
              captures: { refund: $.data.refund_cents, due: $.data.patient_due_cents }
          assert:
            - "FittingOrder.${order_id}.status == RETURNED"
            - "FittingOrder.${order_id}.refund_cents == 285000"
            - "FittingOrder.${order_id}.patient_due_cents == 300000"

      - name: warranty_settlement_conserves_assessed_value_split
        grounds:
          - calculations.warranty_settlement
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
          - entities.WarrantyClaim.fields.deductible_cents
          - entities.WarrantyClaim.fields.clinic_cost_cents
        distinguishing_aspect: |
          Different conserved quantity = assessed value split: deductible_cents + clinic_cost_cents ==
          assessed_value_cents (120000) for a DAMAGE claim (30000 + 90000), so the patient/clinic
          allocation conserves the total with no drift.
        test_recipe:
          setup:
            - "A WARRANTY_ACTIVE order with a SUBMITTED DAMAGE claim assessed 120000."
          setup_api_calls:
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/patients"
              payload: { full_name: "Damage Pt", date_of_birth: "1955-09-09" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinic/device-models"
              payload: { model_code: "DV-DMG-1", name: "DamageModel", list_price_cents: 250000, restock_fee_cents: 15000, min_severity: "MILD", firmware_version: "1.0.0", warranty_months: 24 }
              as: ClinicAdmin
              captures: { model_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { patient_id: "${pat_id}", audiologist_user_id: "aud-1", pure_tone_avg_db: 50 }
              as: Audiologist
              captures: { eval_id: $.data.id }
            - call: "POST /clinic/evaluations/${eval_id}/finalize"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders"
              payload: { patient_id: "${pat_id}", evaluation_id: "${eval_id}", device_model_id: "${model_id}", ear_count: 1 }
              as: Audiologist
              captures: { order_id: $.data.id }
            - call: "POST /clinic/orders/${order_id}/start-trial"
              payload: {}
              as: Audiologist
            - call: "POST /clinic/orders/${order_id}/purchase"
              payload: {}
              as: BillingClerk
            - call: "POST /clinic/_clock/set"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/orders/${order_id}/activate-warranty"
              payload: {}
              as: BillingClerk
            - call: "POST /clinic/orders/${order_id}/warranty-claims"
              payload: { claim_type: "DAMAGE", incident_date: "2026-04-15", assessed_value_cents: 120000 }
              as: BillingClerk
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /clinic/warranty-claims/${claim_id}/approve"
              payload: {}
              as: BillingClerk
              captures: { ded: $.data.deductible_cents, cc: $.data.clinic_cost_cents }
          assert:
            - "WarrantyClaim.${claim_id}.deductible_cents == 30000"
            - "WarrantyClaim.${claim_id}.clinic_cost_cents == 90000"
