  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cpl_issue_requires_active_appointment_in_that_state_rejected
        grounds:
          - validations.priority_110.ERR_NO_ACTIVE_APPOINTMENT_IN_STATE
          - state_machines.ClosingProtectionLetter.REQUESTED_to_ISSUED
          - state_machines.AgencyAppointment.ACTIVE_to_LAPSED
          - entities.AgencyAppointment.fields.status
        distinguishing_aspect: |
          Entity pair ClosingProtectionLetter -> AgencyAppointment: the letter's
          own state is legal for issuance and its agency is OPEN, yet issuance
          is refused purely because the sibling AgencyAppointment row for
          (agency, state_program) sits in LAPSED. Re-verifying that appointment
          back to ACTIVE, with nothing else changed, makes the identical request
          succeed — so the dependency is on the other entity's state alone.
        test_recipe:
          setup:
            - "APPOINTED agency in CA, posture OPEN, E&O valid to 2027-06-30, with one REQUESTED letter for 30000000 of FULL_SETTLEMENT coverage."
            - "The CA appointment is then LAPSED, while Agency.appointment_status stays APPOINTED so the posture stays OPEN and the priority-80 frozen check cannot fire."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", cpl_permitted: true, cpl_coverage_cap_cents: 100000000, cpl_scope_allowed: ["FULL_SETTLEMENT", "LENDER_ONLY", "SELLER_PROCEEDS"], premium_split_agency_pct: 0.80, policy_issuance_deadline_days: 30, three_way_tolerance_cents: 100000, counsel_referral_threshold_cents: 60000000 }
              as: ComplianceOfficer
              captures: { sp_ca_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-1001", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id" }
            - call: "POST /agencies/${ag_id}/financial-review"
              payload: { submitted_eo_policy_limit_cents: 200000000, submitted_eo_expires_on: "2027-06-30", submitted_net_worth_cents: 20000000, submitted_fidelity_bond_cents: 10000000 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /agencies/${ag_id}/financial-review-decision"
              payload: { decision: "ACCEPT" }
              as: LicensingAnalyst
            - call: "POST /agency-appointments"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", license_number: "CA-4477", license_expires_on: "2027-12-31" }
