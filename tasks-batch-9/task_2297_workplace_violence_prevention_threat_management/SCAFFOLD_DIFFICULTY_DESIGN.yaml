  - rule_id: non_linear_state_machine
    instances:
      - name: threat_case_deliberation_reassess_cycle_clears_ballots_and_changes_outcome
        grounds:
          - state_machines.ThreatCase.DELIBERATION_to_ASSESSING
          - state_machines.ThreatCase.ASSESSING_to_DELIBERATION
          - entities.ThreatCase.fields.assessment_round
          - entities.ThreatCase.fields.ballot_count_current_round
          - calculations.behavioral_risk_score
        distinguishing_aspect: |
          The ThreatCase machine is cyclic: DELIBERATION returns to ASSESSING via reassess, the
          loop is bounded by MAX_ASSESSMENT_ROUNDS 3, and traversing it wipes every ballot so the
          second lap produces a different consensus_risk_score (37.45 / MODERATE / MONITOR) from the
          first lap (60.94 / HIGH / ELEVATED_RISK) on identical case inputs.
