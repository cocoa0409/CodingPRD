# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3112_therapist_network_credentialing_insurance_billed_session_payouts
#
# Nine §0.5 Difficulty Rules, two or more instances each. Every `grounds:`
# entry resolves into SCAFFOLD.yaml §1.1–§1.6. Every numeric assertion below was
# produced by executing the referenced §1.3 formula by hand against the pinned
# constants in the same instance's `setup:` block.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: cost_share_provisional_quote_diverges_from_final_adjudication
        grounds:
          - calculations.patient_cost_share_cents
          - calculations.patient_cost_share_cents.variants.provisional_quote
          - calculations.patient_cost_share_cents.variants.final_adjudicated
          - calculations.claim_billed_and_allowed_cents
          - calculations.resolved_session_rate_cents
          - endpoints.POST_/network/sessions/{id}/schedule
          - endpoints.POST_/network/claims/{id}/adjudicate
        distinguishing_aspect: "The patient-cost-share calculation carries two variants on the PatientClient domain whose shared body reads two different deductible bases and two different out-of-pocket bases; for one identical session the provisional quote is 8400 cents while the final adjudicated responsibility is 14500 cents, a divergence of 6100 cents produced by the basis choice alone."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z while the payer, rate schedule, clinician, license, malpractice policy, enrollment and patient are created, so Clinician.onboarded_at is 2026-03-01T00:00:00Z."
            - "The logical clock is advanced to 2026-06-20T00:00:00Z before any session is completed, which is past onboarded_at + 90 days, so the new-clinician differential is skipped."
            - "Payer PAX is ACTIVE with timely_filing_days 90 and allowed_cpt_codes [90837]."
            - "One PayerRate row: rate_set_version 1, license_type LCSW, geography CA, cpt_code 90837, rate_cents 15000, effective_from 2026-01-01T00:00:00Z, effective_to null."
            - "Clinician Dana Reyes is LCSW, primary_state CA, weekly_caseload_target 8, availability Monday and Tuesday 08:00-18:00 UTC. License LCSW-CA-77120 expires 2027-06-30T00:00:00Z and is VERIFIED. Malpractice coverage 500000000 is ACTIVE. Enrollment is EFFECTIVE from 2026-02-01T00:00:00Z. billing_posture is therefore BILLABLE and status ACTIVE."
            - "Patient Priya Anand has payer PAX, state CA, deductible_cents 100000, coinsurance_rate 0.20, oop_max_cents 200000, oop_met_cents 0."
            - "The newest VERIFIED BenefitVerification snapshot reports deductible_remaining_cents 5000, coinsurance_rate 0.20, copay_cents 2500, oop_remaining_cents 200000."
            - "Session runs 2026-06-16T14:00:00Z to 15:00:00Z, cpt_code 90837, modality VIDEO, with one SIGNED 60-minute note."
          setup_api_calls:
            - &k_clock_early
              call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/payers"
              payload: { payer_name: "Pacific Assurance Exchange", payer_code: "PAX", delegated_credentialing: true, min_malpractice_coverage_cents: 100000000, timely_filing_days: 90, credentialing_sla_days: 14, allowed_cpt_codes: ["90837"] }
              as: OpsAdmin
              captures: { payer_id: $.data.id }
            - call: "POST /network/payers/${payer_id}/rates"
              payload: { rate_set_version: 1, license_type: "LCSW", geography: "CA", cpt_code: "90837", rate_cents: 15000, effective_from: "2026-01-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/clinicians"
              payload: { full_name: "Dana Reyes", license_type: "LCSW", primary_state: "CA", specialty_tags: ["ANXIETY"], weekly_caseload_target: 8, availability_blocks: [{ weekday: 1, start_minute: 480, end_minute: 1080 }, { weekday: 2, start_minute: 480, end_minute: 1080 }] }
              as: OpsAdmin
              captures: { clinician_id: $.data.id }
            - call: "POST /network/clinicians/${clinician_id}/licenses"
              payload: { license_number: "LCSW-CA-77120", license_type: "LCSW", issuing_state: "CA", expires_on: "2027-06-30T00:00:00Z", telehealth_eligible: true }
              as: OpsAdmin
              captures: { license_id: $.data.id }
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/submit-credentials"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - call: "POST /network/payer-enrollments"
              payload: { clinician_id: "${clinician_id}", payer_id: "${payer_id}", delegated: true, effective_from: "2026-02-01T00:00:00Z" }
              as: OpsAdmin
              captures: { enrollment_id: $.data.id }
            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
            - call: "POST /network/patients"
              payload: { full_name: "Priya Anand", member_id: "MBR-4410", payer_id: "${payer_id}", plan_code: "PPO-2000", state_code: "CA", deductible_cents: 100000, coinsurance_rate: 0.20, oop_max_cents: 200000 }
              as: OpsAdmin
              captures: { patient_id: $.data.id }
            - call: "POST /network/patients/${patient_id}/verification"
              payload: { deductible_remaining_cents: 5000, coinsurance_rate: 0.20, copay_cents: 2500, oop_remaining_cents: 200000 }
              as: OpsAdmin
            - call: "POST /network/sessions"
              payload: { clinician_id: "${clinician_id}", patient_id: "${patient_id}", scheduled_start: "2026-06-16T14:00:00Z", scheduled_end: "2026-06-16T15:00:00Z", cpt_code: "90837", modality: "VIDEO" }
              as: OpsAdmin
              captures: { session_id: $.data.id }
            - call: "POST /network/sessions/${session_id}/schedule"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { session_v1: $.data.version }
            - call: "POST /network/sessions/${session_id}/notes"
              payload: { diagnosis_code: "F41.1", duration_minutes: 60, cpt_code: "90837", narrative: "Patient reports reduced anxiety frequency since the prior course of care.", expected_session_version: "${session_v1}" }
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { note_id: $.data.id }
            - call: "POST /network/sessions/${session_id}/notes/${note_id}/sign"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-06-20T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/sessions/${session_id}/complete"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
            - call: "POST /network/claims"
              payload: { session_id: "${session_id}" }
              as: OpsAdmin
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /network/claims/${claim_id}/adjudicate"
              payload: { outcome: "PAID" }
              as: OpsAdmin
          assert:
            - "Session.${session_id}.quoted_cost_share_cents == 8400"
            - "Claim.${claim_id}.billed_cents == 15000 and Claim.${claim_id}.allowed_cents == 12000"
            - "Claim.${claim_id}.patient_resp_cents == 14500"
            - "Claim.${claim_id}.patient_resp_cents != Session.${session_id}.quoted_cost_share_cents"
            - "Claim.${claim_id}.patient_resp_cents - Session.${session_id}.quoted_cost_share_cents == 6100"
            - "the provisional variant uses the snapshot deductible_remaining_cents 5000, giving d = min(12000, 5000) = 5000, after_deductible 7000, coins 1400, raw 5000+1400+2500 = 8900, less the 500 offset = 8400"
            - "the final variant uses deductible_cents 100000, giving d = min(12000, 100000) = 12000, after_deductible 0, coins 0, raw 14500, with the offset skipped = 14500"
            - "Claim.${claim_id}.payer_paid_cents == 0"
            - "Session.${session_id}.quoted_cost_share_cents is still 8400 after adjudication — the provisional quote is never rewritten"

      - name: payout_line_scheduled_basis_exceeds_cash_basis_for_identical_sessions
        grounds:
          - calculations.clinician_payout_line_amount_cents
          - calculations.clinician_payout_line_amount_cents.variants.scheduled_basis
          - calculations.clinician_payout_line_amount_cents.variants.cash_basis
          - calculations.denial_clawback_adjustment_cents
          - calculations.resolved_session_rate_cents
          - endpoints.POST_/network/payout-batches/{id}/lock
          - concurrency_rules[payout-batch-period-supersede]
        distinguishing_aspect: "The payout-line calculation carries two variants on the PayoutLine domain whose inclusion filters differ on Claim.claim_status; across the two batches the same four completed sessions resolve to the same 15000-cent rate, yet the scheduled-basis line reports gross 30000 while the cash-basis line reports gross 15000 with no clawback in either, so the divergence of 15000 cents comes from the inclusion filter alone."
