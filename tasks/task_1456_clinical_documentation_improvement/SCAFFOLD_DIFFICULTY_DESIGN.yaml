      - Provider.${prov}.education_score == 91
      - Provider.${prov}.education_flag == NONE
      - Provider.${prov}.pattern_tally_json.NO_RESPONSE_PATTERN == 2
- rule_id: priority_pair_validation_conflict
  instances:
  - name: stale_version_vs_invalid_state_on_close
    grounds:
    - concurrency_rules[cdi-review-close-stale-version]
    - validations[priority=5]
    distinguishing_aspect: 'Pair: state (priority 5 ERR_INVALID_STATE) vs OCC version

      (ERR_STALE_VERSION, 412). OCC is checked BEFORE business/state

      checks per §1.2.1 — a stale expected_review_version wins over the

      state check even when the review is in a non-closable state.

      Different pair from the next instance.

      '
    test_recipe:
      setup:
      - Review is in DRAFT (cannot close); client has stale version=1 (current is also 1 — no mutation has happened, so we need to force a version advance first)
      - 'Force version bump by: activate -> version becomes 2; review now in ACTIVE. Then attempt close with expected_review_version=1 (stale) AND no closed_reason violated indirectly — but primary assertion:
        stale version fires before state'
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
