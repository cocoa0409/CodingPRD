              as: TransferCoordinator
              captures: { phys_r: $.data.id }
            - call: "POST /facilities/${fac_r}/diversion-events"
              payload: { scope: "SPECIFIC_UNIT", unit_type: "TELEMETRY", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T04:00:00Z", reason: "Telemetry monitoring capacity exhausted" }
              as: BedManager
              as_user_id: "${fac_r}"
              captures: { div_id: $.data.id, div_eff: $.data.effective_status }
            - call: "POST /transfer-cases"
              payload: { patient_ref: "PT-DIV-ICU", sending_facility_id: "${fac_s}", sending_physician_id: "${phys_s}", acuity_level: "CRITICAL", required_unit_type: "ICU", requires_isolation: false, required_capability: "CARDIAC_CATH" }
              as: TransferCoordinator
              captures: { case_icu: $.data.id }
            - call: "POST /transfer-cases/${case_icu}/emtala-screening"
