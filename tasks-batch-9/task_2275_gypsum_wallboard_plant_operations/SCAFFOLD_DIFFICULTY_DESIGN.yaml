      - name: run_windows_half_open_touch_allowed_overlap_rejected
        grounds:
          - validations[priority=14]
          - errors[ERR_LINE_WINDOW_CONFLICT]
          - calculations.run_line_capacity_and_reservation
          - endpoints[POST /plant-ops/production-runs/{runId}/schedule]
        distinguishing_aspect: |
          Resource BoardLine under HALF-OPEN [window_start, window_end) exclusivity: a run starting at
          the exact instant the previous one ends is accepted (and becomes its changeover predecessor
          with gap_minutes 0), while a run whose window strictly straddles the boundary is rejected
          with ERR_LINE_WINDOW_CONFLICT. Only SCHEDULED and RUNNING siblings occupy the line.
