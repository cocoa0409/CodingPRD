    - entities.SupportRequest.fields.total_charge_cents
    - concurrency_rules[support-request-create-stale-grant]
    distinguishing_aspect: 'Mode (c): a circular-looking dependency with a pinned evaluation order — admin_fee_cents
      is derived from requested_cents and total_charge_cents from admin_fee_cents, so re-reading the tier off the
      20600 total would jump T2 (0.03) to T3 (0.05) and yield 1030 instead of 600.'
    test_recipe:
      setup:
