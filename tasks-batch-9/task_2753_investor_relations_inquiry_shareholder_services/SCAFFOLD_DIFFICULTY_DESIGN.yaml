              as: IRAdmin
              as_user_id: "u_ir_admin_1"
          assert:
            - "trigger step 1 response: $.data.evaluated_count == 3, $.data.allocated_count == 1, $.data.waitlisted_count == 2, $.data.threshold_deferred_count == 0"
            - "after trigger step 1: final_priority_score values are 99.60 (${m1_id}), 67.20 (${m2_id}) and 32.40 (${m3_id}); RoadshowEvent.${ev_id}.request_ledger_total == 3 == 1 allocated + 2 waitlisted"
            - "after trigger step 2: MeetingRequest.${m1_id}.status == RELEASED, MeetingRequest.${m2_id}.status == ALLOCATED with promoted_from_waitlist == true, MeetingRequest.${m3_id}.status == WAITLISTED"
            - "after trigger step 2: RoadshowEvent.${ev_id} counters are allocated_count 1, waitlisted_count 1, released_count 1, declined_count 0 and request_ledger_total 3 == 1 + 1 + 1 + 0"
