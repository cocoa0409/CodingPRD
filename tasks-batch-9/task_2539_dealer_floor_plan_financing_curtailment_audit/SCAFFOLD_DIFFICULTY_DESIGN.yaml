# §1.8 Scaffold Difficulty Design — task_2539_dealer_floor_plan_financing_curtailment_audit
# Nine Difficulty Rules from §0.5, two or more differentiated instances each.
# Every grounds entry resolves into SCAFFOLD.yaml §1.1-§1.7. Every numeric assert
# below was computed against the named calculations[].formula and its constants.
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: curtailment_projected_versus_assessed_after_voluntary_prepayment
        grounds:
          - calculations.curtailment_requirement
          - calculations.curtailment_requirement.variants.FORWARD_PROJECTED
          - calculations.curtailment_requirement.variants.ASSESSED_ACTUAL
          - state_machines.CurtailmentObligation.SCHEDULED_to_DUE
          - entities.CurtailmentObligation.fields.projected_principal_cents
          - entities.CurtailmentObligation.fields.required_principal_cents
          - entities.InventoryUnit.fields.principal_paid_cents
          - endpoints["GET /floorplan/units/{id}/curtailment-schedule"]
        distinguishing_aspect: |
          The two variants are separated by their PAYMENT AWARENESS on the same
          CurtailmentObligation row: FORWARD_PROJECTED is frozen at funding from the
          adjacent-tier cumulative difference and still reads 450000 on the second
          obligation, while ASSESSED_ACTUAL is computed at the SCHEDULED->DUE
          transition against the unit's real principal_paid_cents of 500000 and
          therefore reads 250000 - a 200000 delta on one row.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE Dealer with one ACTIVE CreditLine whose credit_limit_cents is 500000000 and advance_rate_bps_new is 10000."
            - "The line carries three NEW curtailment tiers: [90,180) at 1000 bps, [180,270) at 2500 bps and [270,unbounded) at 5000 bps."
            - "One NEW InventoryUnit with invoice_amount_cents 3000000, title LENDER_HELD, FLOORED on 2026-08-01 with advance_amount_cents 3000000, so its three SCHEDULED obligations carry projected_principal_cents 300000 / 450000 / 750000 and due_dates 2026-10-30 / 2027-01-28 / 2027-04-28."
            - "At clock 2026-10-30 the first obligation has been matured to DUE with required_principal_cents 300000, paid in full by a CURTAILMENT remittance, and a further 200000 has been prepaid against the unit, leaving principal_paid_cents 500000 and outstanding_principal_cents 2500000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Cascade Motors LLC", dba_name: "Cascade Auto", franchise_type: "FRANCHISE_NEW_CAR", state_code: "WA" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { d1: "$.data.id" }
            - call: "POST /floorplan/credit-lines"
              payload: { dealer_id: "${d1}", credit_limit_cents: 500000000, advance_rate_bps_new: 10000, advance_rate_bps_used: 9000, advance_rate_bps_demonstrator: 8500, max_unit_advance_cents_new: 20000000, max_unit_advance_cents_used: 10000000, max_unit_advance_cents_demonstrator: 10000000, class_sublimit_cents_used: 100000000, class_sublimit_cents_demonstrator: 50000000, curtailment_grace_days: 5 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { cl1: "$.data.id" }
            - call: "POST /floorplan/credit-lines/${cl1}/curtailment-tiers"
              payload: { inventory_class: "NEW", age_days_from: 90, age_days_to: 180, cumulative_paydown_bps: 1000 }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/credit-lines/${cl1}/curtailment-tiers"
              payload: { inventory_class: "NEW", age_days_from: 180, age_days_to: 270, cumulative_paydown_bps: 2500 }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/credit-lines/${cl1}/curtailment-tiers"
              payload: { inventory_class: "NEW", age_days_from: 270, age_days_to: null, cumulative_paydown_bps: 5000 }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/credit-lines/${cl1}/activate"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units"
              payload: { dealer_id: "${d1}", credit_line_id: "${cl1}", vin: "1NEWUNIT000000010", inventory_class: "NEW", invoice_amount_cents: 3000000, invoice_date: "2026-08-01", odometer_miles: 12, title_document_type: "MSO" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { u1: "$.data.id" }
            - call: "POST /floorplan/units/${u1}/title-custody"
              payload: { new_custody_status: "LENDER_HELD", document_reference: "MSO-0001" }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units/${u1}/funding-advances"
              payload: { requested_amount_cents: 3000000, dealer_invoice_reference: "INV-0001" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { a1: "$.data.id" }
            - call: "GET /floorplan/credit-lines/${cl1}"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { cl1_v: "$.data.version" }
            - call: "POST /floorplan/funding-advances/${a1}/fund"
              payload: { expected_credit_line_version: "${cl1_v}", disbursement_reference: "WIRE-0001" }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-30T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/curtailment-runs"
              payload: { dealer_id: "${d1}", as_of_date: "2026-10-30" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "GET /floorplan/curtailment-obligations"
              payload: { unit_id: "${u1}", status: "DUE" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { o1: "$.data[0].id" }
            - call: "GET /floorplan/dealers/${d1}"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { d1_v1: "$.data.version" }
            - call: "POST /floorplan/remittances"
              payload: { dealer_id: "${d1}", intent: "CURTAILMENT", amount_cents: 300000, payment_reference: "ACH-0001", expected_dealer_version: "${d1_v1}", target_obligation_id: "${o1}" }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /floorplan/dealers/${d1}"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { d1_v2: "$.data.version" }
            - call: "POST /floorplan/remittances"
              payload: { dealer_id: "${d1}", intent: "PRINCIPAL_PREPAYMENT", amount_cents: 200000, payment_reference: "ACH-0002", expected_dealer_version: "${d1_v2}", target_unit_id: "${u1}" }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-28T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
          trigger:
            - call: "POST /floorplan/curtailment-runs"
              payload: { dealer_id: "${d1}", as_of_date: "2027-01-28" }
              as: SystemOperator
              as_user_id: "u-sys-1"
              captures: { run2_due: "$.data.obligations_marked_due_count", run2_total: "$.data.total_required_paydown_cents" }
            - call: "GET /floorplan/curtailment-obligations"
              payload: { unit_id: "${u1}", status: "DUE" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { o2: "$.data[0].id" }
            - call: "GET /floorplan/units/${u1}/curtailment-schedule"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
          assert:
            - "InventoryUnit.${u1}.principal_paid_cents == 500000 and InventoryUnit.${u1}.outstanding_principal_cents == 2500000 before the trigger run"
            - "CurtailmentObligation.${o2}.tier_cumulative_paydown_bps == 2500 and CurtailmentObligation.${o2}.due_date == \"2027-01-28\""
            - "CurtailmentObligation.${o2}.projected_principal_cents == 450000"
            - "CurtailmentObligation.${o2}.required_principal_cents == 250000"
            - "CurtailmentObligation.${o2}.projected_principal_cents - CurtailmentObligation.${o2}.required_principal_cents == 200000"
            - "${run2_due} == 1 and ${run2_total} == 250000"
            - "CurtailmentObligation.${o1}.status == PAID and CurtailmentObligation.${o1}.required_principal_cents == 300000 and CurtailmentObligation.${o1}.projected_principal_cents == 300000"
            - "GET /floorplan/units/${u1}/curtailment-schedule returns basis == \"FORWARD_PROJECTED\" and projected_total_required_cents == 1500000, unchanged by either remittance"
            - "The third obligation is still SCHEDULED with projected_principal_cents == 750000 and required_principal_cents == 0"

      - name: covenant_dscr_lender_standard_fails_while_dealer_adjusted_permits_reinstatement
        grounds:
          - calculations.covenant_dscr
          - calculations.covenant_dscr.variants.LENDER_STANDARD
          - calculations.covenant_dscr.variants.DEALER_ADJUSTED
          - entities.CovenantTest.fields.dscr_lender_standard
          - entities.CovenantTest.fields.dscr_dealer_adjusted
          - entities.CovenantTest.fields.failure_reason_codes
          - validations[priority=72]
          - state_machines.CreditLine.SUSPENDED_to_ACTIVE
          - global_constants.COVENANT_MIN_DSCR_LENDER_STANDARD
          - global_constants.REINSTATEMENT_MIN_DSCR_DEALER_ADJUSTED
        distinguishing_aspect: |
          The two variants are separated by ADD-BACK TREATMENT of interest expense on
          the same filing and by which decision consults them: from identical inputs
          LENDER_STANDARD yields 1.0417 and is the only figure that sets
          CovenantTest.result to FAIL, while DEALER_ADJUSTED yields 1.4583 and is the
          only figure validations[priority=72] consults, so one filing simultaneously
          breaches the covenant and satisfies the reinstatement test.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE Dealer with one ACTIVE CreditLine whose credit_limit_cents is 500000000, so calculations.covenant_dscr requires tangible net worth of 50000000."
            - "No inventory, no audits and no out-of-trust incidents exist, so the only covenant dimension that can fail is cash flow."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Rainier Auto Group Inc", franchise_type: "FRANCHISE_NEW_CAR", state_code: "WA" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { d2: "$.data.id" }
            - call: "POST /floorplan/credit-lines"
              payload: { dealer_id: "${d2}", credit_limit_cents: 500000000, advance_rate_bps_new: 10000, advance_rate_bps_used: 9000, advance_rate_bps_demonstrator: 8500, max_unit_advance_cents_new: 20000000, max_unit_advance_cents_used: 10000000, max_unit_advance_cents_demonstrator: 10000000, class_sublimit_cents_used: 100000000, class_sublimit_cents_demonstrator: 50000000, curtailment_grace_days: 5 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { cl2: "$.data.id" }
            - call: "POST /floorplan/credit-lines/${cl2}/curtailment-tiers"
              payload: { inventory_class: "NEW", age_days_from: 90, age_days_to: null, cumulative_paydown_bps: 1000 }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/credit-lines/${cl2}/activate"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
          trigger:
            - call: "POST /floorplan/dealers/${d2}/covenant-tests"
              payload: { period_end_date: "2026-06-30", reported_tangible_net_worth_cents: 60000000, reported_ebitda_cents: 1000000, reported_interest_expense_cents: 400000, reported_curtailment_paid_cents: 560000, reported_unrestricted_cash_cents: 2000000, trailing_sot_incident_count: 0 }
              as: CreditRiskManager
              as_user_id: "u-crm-1"
              captures: { ct1: "$.data.id", ct1_lender: "$.data.dscr_lender_standard", ct1_adjusted: "$.data.dscr_dealer_adjusted" }
            - call: "POST /floorplan/dealers/${d2}/covenant-tests"
              payload: { period_end_date: "2026-09-30", reported_tangible_net_worth_cents: 60000000, reported_ebitda_cents: 1000000, reported_interest_expense_cents: 400000, reported_curtailment_paid_cents: 560000, reported_unrestricted_cash_cents: 2000000, trailing_sot_incident_count: 0 }
              as: CreditRiskManager
              as_user_id: "u-crm-1"
              captures: { ct2: "$.data.id" }
            - call: "POST /floorplan/credit-lines/${cl2}/reinstate"
              payload: { reason_code: "COVENANT_CURE_PLAN" }
              as: CreditRiskManager
              as_user_id: "u-crm-2"
          assert:
            - "CovenantTest.${ct1}.required_tangible_net_worth_cents == 50000000"
            - "CovenantTest.${ct1}.dscr_lender_standard == \"1.0417\""
            - "CovenantTest.${ct1}.dscr_dealer_adjusted == \"1.4583\""
            - "CovenantTest.${ct1}.result == FAIL and CovenantTest.${ct1}.failure_reason_codes == [\"CASH_FLOW\"]"
            - "Dealer.${d2}.last_covenant_result == FAIL and Dealer.${d2}.covenant_breach_count == 1 after the first filing"
            - "Dealer.${d2}.risk_score == 80, Dealer.${d2}.risk_rating == \"B\" and Dealer.${d2}.audit_frequency_days == 90 after the first filing"
            - "CreditLine.${cl2}.status == ACTIVE after the first filing (one breach is below COVENANT_BREACH_SUSPENSION_COUNT)"
            - "CovenantTest.${ct2}.dscr_lender_standard == \"1.0417\" and CovenantTest.${ct2}.dscr_dealer_adjusted == \"1.4583\""
            - "Dealer.${d2}.covenant_breach_count == 2, CreditLine.${cl2}.status == SUSPENDED with suspension_reason_code == COVENANT_BREACH_LIMIT and Dealer.${d2}.status == SUSPENDED after the second filing"
            - "The reinstate call returns 200 and CreditLine.${cl2}.status == ACTIVE with suspension_reason_code == null, because 1.4583 >= 1.4000 even though the covenant result is FAIL"
            - "Dealer.${d2}.status == ACTIVE and Dealer.${d2}.last_covenant_result is still FAIL after reinstatement"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: demonstrator_advance_stacks_mileage_and_aged_invoice_haircuts_mode_a
        grounds:
          - calculations.unit_advance_amount
          - entities.FundingAdvance.fields.effective_advance_rate_bps
          - entities.FundingAdvance.fields.rate_adjustment_codes
          - entities.FundingAdvance.fields.invoice_age_days_at_funding
          - entities.FundingAdvance.fields.approved_advance_amount_cents
          - global_constants.DEMO_HIGH_MILEAGE_THRESHOLD_MILES
          - global_constants.DEMO_HIGH_MILEAGE_HAIRCUT_BPS
          - global_constants.AGED_INVOICE_HAIRCUT_DAYS
          - global_constants.AGED_INVOICE_HAIRCUT_BPS
          - state_machines.FundingAdvance.REQUESTED_to_FUNDED
        distinguishing_aspect: |
          This is the mode (a) shape: FOUR independent inputs - inventory_class,
          per-class cap, odometer_miles and invoice age - are folded into one
          effective rate before a single rounding step, and the two haircuts STACK
          additively (8500 - 500 - 250 = 7750) rather than the larger one winning,
          so the advance is 3875000 and not 4250000, 4000000 or 3812500.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE Dealer with one ACTIVE CreditLine whose advance_rate_bps_demonstrator is 8500 and max_unit_advance_cents_demonstrator is 10000000, and which carries a DEMONSTRATOR tier [90,unbounded) at 2000 bps."
            - "One DEMONSTRATOR InventoryUnit with invoice_amount_cents 5000000, invoice_date 2026-06-17 (exactly 45 days before the clock), odometer_miles 3001 (one mile past the threshold) and title_custody_status LENDER_HELD."
            - "A FundingAdvance in REQUESTED exists for that unit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Olympic Demo Motors LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "OR" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { d3: "$.data.id" }
            - call: "POST /floorplan/credit-lines"
              payload: { dealer_id: "${d3}", credit_limit_cents: 500000000, advance_rate_bps_new: 10000, advance_rate_bps_used: 9000, advance_rate_bps_demonstrator: 8500, max_unit_advance_cents_new: 20000000, max_unit_advance_cents_used: 10000000, max_unit_advance_cents_demonstrator: 10000000, class_sublimit_cents_used: 100000000, class_sublimit_cents_demonstrator: 50000000, curtailment_grace_days: 5 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { cl3: "$.data.id" }
            - call: "POST /floorplan/credit-lines/${cl3}/curtailment-tiers"
              payload: { inventory_class: "DEMONSTRATOR", age_days_from: 90, age_days_to: null, cumulative_paydown_bps: 2000 }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/credit-lines/${cl3}/activate"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units"
              payload: { dealer_id: "${d3}", credit_line_id: "${cl3}", vin: "1DEMOUNIT00000010", inventory_class: "DEMONSTRATOR", invoice_amount_cents: 5000000, invoice_date: "2026-06-17", odometer_miles: 3001, title_document_type: "MSO" }
              as: DealerPrincipal
              as_user_id: "${d3}"
              captures: { u3: "$.data.id" }
            - call: "POST /floorplan/units/${u3}/title-custody"
              payload: { new_custody_status: "LENDER_HELD", document_reference: "MSO-0003" }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units/${u3}/funding-advances"
              payload: { requested_amount_cents: 5000000, dealer_invoice_reference: "INV-0003" }
              as: DealerPrincipal
              as_user_id: "${d3}"
              captures: { a3: "$.data.id" }
            - call: "GET /floorplan/credit-lines/${cl3}"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { cl3_v: "$.data.version" }
          trigger:
            - call: "POST /floorplan/funding-advances/${a3}/fund"
              payload: { expected_credit_line_version: "${cl3_v}", disbursement_reference: "WIRE-0003" }
              as: CreditOfficer
              as_user_id: "u-co-1"
          assert:
            - "FundingAdvance.${a3}.invoice_age_days_at_funding == 45"
            - "FundingAdvance.${a3}.effective_advance_rate_bps == 7750"
            - "FundingAdvance.${a3}.rate_adjustment_codes == [\"HIGH_MILEAGE_DEMO\", \"AGED_INVOICE\"]"
            - "FundingAdvance.${a3}.approved_advance_amount_cents == 3875000"
            - "InventoryUnit.${u3}.advance_amount_cents == 3875000 and InventoryUnit.${u3}.outstanding_principal_cents == 3875000"
            - "InventoryUnit.${u3}.funding_status == FLOORED"
            - "CreditLine.${cl3}.outstanding_principal_cents == 3875000 and CreditLine.${cl3}.available_credit_cents == 496125000"
            - "CreditLine.${cl3}.class_outstanding_cents_demonstrator == 3875000"
            - "Exactly one CurtailmentObligation exists for the unit, SCHEDULED, due_date == \"2026-10-30\" with projected_principal_cents == 775000"

      - name: curtailment_run_total_rounds_per_unit_before_summation_mode_b
        grounds:
          - calculations.curtailment_run_dealer_total
          - calculations.curtailment_requirement.variants.ASSESSED_ACTUAL
          - endpoints["POST /floorplan/curtailment-runs"]
          - state_machines.CurtailmentObligation.SCHEDULED_to_DUE
        distinguishing_aspect: |
          This is the mode (b) shape: an ORDER-OF-OPERATIONS combination where three
          identical units each round 3333333 * 1000 / 10000 to 333333 before the sum,
          producing 999999; summing first and rounding once would produce 1000000, so
          the run total falsifies one of the two orders by exactly one cent.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE Dealer with one ACTIVE CreditLine whose advance_rate_bps_new is 10000 and which carries a single NEW tier [90,unbounded) at 1000 bps."
            - "Three NEW InventoryUnits, each with invoice_amount_cents 3333333, each LENDER_HELD and each FLOORED on 2026-08-01 with advance_amount_cents 3333333, so each carries one SCHEDULED obligation due 2026-10-30."
            - "No payment has been made against any of the three units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Puget Rounding Motors LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "WA" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { d4: "$.data.id" }
            - call: "POST /floorplan/credit-lines"
              payload: { dealer_id: "${d4}", credit_limit_cents: 500000000, advance_rate_bps_new: 10000, advance_rate_bps_used: 9000, advance_rate_bps_demonstrator: 8500, max_unit_advance_cents_new: 20000000, max_unit_advance_cents_used: 10000000, max_unit_advance_cents_demonstrator: 10000000, class_sublimit_cents_used: 100000000, class_sublimit_cents_demonstrator: 50000000, curtailment_grace_days: 5 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { cl4: "$.data.id" }
            - call: "POST /floorplan/credit-lines/${cl4}/curtailment-tiers"
              payload: { inventory_class: "NEW", age_days_from: 90, age_days_to: null, cumulative_paydown_bps: 1000 }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/credit-lines/${cl4}/activate"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units"
              payload: { dealer_id: "${d4}", credit_line_id: "${cl4}", vin: "1ROUNDUNIT0000010", inventory_class: "NEW", invoice_amount_cents: 3333333, invoice_date: "2026-08-01", odometer_miles: 5, title_document_type: "MSO" }
              as: DealerPrincipal
              as_user_id: "${d4}"
              captures: { u4a: "$.data.id" }
            - call: "POST /floorplan/units/${u4a}/title-custody"
              payload: { new_custody_status: "LENDER_HELD", document_reference: "MSO-0004A" }
              as: CreditOfficer
              as_user_id: "u-co-1"
            - call: "POST /floorplan/units/${u4a}/funding-advances"
              payload: { requested_amount_cents: 3333333, dealer_invoice_reference: "INV-0004A" }
              as: DealerPrincipal
              as_user_id: "${d4}"
              captures: { a4a: "$.data.id" }
            - call: "GET /floorplan/credit-lines/${cl4}"
              payload: {}
