    description: "Retire course"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: EducationCourse
    side_effects: ["status → RETIRED"]

  # --- EducationCompletion ---
  - method: POST
    path: "/programs/{id}/households/{householdId}/education-completions"
