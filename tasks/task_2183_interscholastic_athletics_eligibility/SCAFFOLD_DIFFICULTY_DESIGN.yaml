  - rule_id: transitive_cascade
    instances:

      - name: credential_revocation_cascades_four_hops_to_release_minute_restitution
        grounds:
          - state_machines.StaffCredential.CLEARED_to_REVOKED
          - state_machines.Contest.OFFICIALS_ASSIGNED_to_SCHEDULED
          - state_machines.OfficialAssignment.ACCEPTED_to_WITHDRAWN
          - state_machines.TransportRequest.APPROVED_to_CANCELLED
          - entities.School.fields.credential_gap_sports
          - entities.School.fields.release_minutes_used
          - entities.TransportRequest.fields.cancelled_reason
        distinguishing_aspect: |
          A depth-4 chain fired by the StaffCredential CLEARED -> REVOKED transition, where each
          link is caused strictly by the previous one: the revoke reopens School.credential_gap_sports
          (link 1), the reopened gap knocks the CONFIRMED contest back to SCHEDULED and withdraws its
          assignments (link 2), the contest leaving CONFIRMED cancels the APPROVED trip (link 3),
          and only because that trip became CANCELLED is School.release_minutes_used decremented
          from 60 to 0 (link 4).
