          - complexity_profile.state_machine_shape
          - state_machines.StateRegistration.transitions.DEFICIENT_to_SUBMITTED
        excluded_because:
          difficulty_instance: registration_deficiency_revision_cycle_accumulates_rounds
          rationale: "That instance already drives SUBMITTED -> DEFICIENT -> SUBMITTED twice and asserts that deficiency_round_count accumulates to 2 while deficiency_reasons is cleared on each re-entry, which subsumes any single-lap cyclic probe."

      - name: posture_dimensions_move_independently_on_one_organization
        claim_type: parallel_dimensions
        grounds:
          - state_machines.Organization.shape
          - entities.Organization.fields.solicitation_posture
          - entities.Organization.fields.filing_posture
        excluded_because:
          difficulty_instance: escalation_cascade_e1_e2_e3_halts_filed_coventure_promotion
          rationale: "The escalation cascade already asserts that solicitation_posture moves to RESTRICTED or HALTED while filing_posture keeps the value the earlier sweep gave it, which is exactly the independence claim for the two derived dimensions."

      - name: vacate_reverses_the_issuance_side_effects
        claim_type: compensation
        grounds:
          - state_machines.EnforcementAction.transitions.OPEN_to_VACATED
          - calculations.penalty_ledger_conservation
        excluded_because:
          difficulty_instance: penalty_ledger_conserved_when_assessment_is_vacated
          rationale: "That compensating-invariant instance measures penalty_outstanding_cents before issuance, after issuance and after vacatur on the same organization and asserts exact return with no drift, so a separate side-effect-reversal probe would repeat it."

  # ---------------------------------------------------------------------------
  # From Table 3 (Calculations)
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:

      - name: filing_fee_counts_only_filed_contracts_in_the_state
        claim_type: input_set_filtering
        grounds:
          - calculations.filing_fee_assessment.input_set
          - entities.FundraisingContract.fields.status
        distinguishing_aspect: "The per-contract component is driven by the contract's status, not its existence: with the engagement still DRAFT the INITIAL fee is 24000, and once the same contract is FILED the recomputation at submit adds one 1500 unit before the 1.5 multiplier, giving 26250."
        test_recipe:
          setup:
            - "StateProfile CA with per_contract_fee_cents 1500 and online_surcharge_cents 1000; an Organization with an online donation page; a CURRENT FY2026 statement with contributions 20000000; a PROFESSIONAL_SOLICITOR with an ACTIVE CA FundraiserRegistration; a DRAFT CA contract starting 2026-08-01."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, online_presence_counts: true, fundraiser_contract_filing_days: 10, fundraiser_bond_minimum_cents: 2500000, base_filing_fee_cents: 2500, online_surcharge_cents: 1000, per_contract_fee_cents: 1500, filing_fee_cap_cents: 30000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6, has_online_donation_page: true }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
            - call: "POST /officer-disclosures"
              payload: { organization_id: "${org_id}", officer_name: "Dana Reyes", title: "PRESIDENT", is_certifying_officer: true }
              as: ComplianceOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /officer-disclosures"
              payload: { organization_id: "${org_id}", officer_name: "Sam Okoye", title: "SECRETARY" }
              as: ComplianceOfficer
              captures: { prep_id: $.data.id }
            - call: "POST /professional-fundraisers"
              payload: { legal_name: "Northline Donor Services", fundraiser_type: "PROFESSIONAL_SOLICITOR", bond_amount_cents: 2500000, bond_expires_at: "2028-12-31T00:00:00Z" }
              as: SystemAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /fundraiser-registrations"
              payload: { fundraiser_id: "${pf_id}", state_code: "CA", bond_on_file_cents: 2500000, expires_at: "2027-12-31T00:00:00Z" }
              as: FundraiserAgent
              as_user_id: "${pf_id}"
            - call: "POST /fundraising-contracts"
              payload: { organization_id: "${org_id}", fundraiser_id: "${pf_id}", state_codes: ["CA"], contract_start: "2026-08-01T00:00:00Z", contract_end: "2027-08-01T00:00:00Z", compensation_type: "PERCENT_OF_GROSS", percent_of_gross: 0.15 }
              as: ComplianceOfficer
              captures: { ct_id: $.data.id }
          trigger:
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_id: $.data.id }
            - call: "POST /fundraising-contracts/${ct_id}/file"
              payload: {}
              as: FundraiserAgent
              as_user_id: "${pf_id}"
            - call: "POST /registration-documents"
              payload: { registration_id: "${reg_id}", doc_type: "GOVERNING_DOCUMENT", prepared_by_officer_id: "${prep_id}", page_count: 12 }
              as: ComplianceOfficer
            - call: "POST /registration-documents"
              payload: { registration_id: "${reg_id}", doc_type: "FINANCIAL_STATEMENT", prepared_by_officer_id: "${prep_id}", page_count: 8 }
              as: ComplianceOfficer
            - call: "POST /registration-documents"
              payload: { registration_id: "${reg_id}", doc_type: "REVIEW_REPORT", prepared_by_officer_id: "${prep_id}", page_count: 4 }
              as: ComplianceOfficer
            - call: "POST /state-registrations/${reg_id}/submit"
              payload: { certification_note: "Certified under penalty of perjury." }
              as: CertifyingOfficer
              as_user_id: "${cert_id}"
          assert:
            - "responses[0].data.filing_fee_cents == 24000"
            - "FundraisingContract.${ct_id}.status == FILED"
            - "FundraisingContract.${ct_id}.late_filing_surcharge_cents == 0"
            - "StateRegistration.${reg_id}.filing_fee_cents == 26250"
            - "StateRegistration.${reg_id}.status == SUBMITTED"

      - name: filing_fee_tier_boundary_at_contributions_2500000
        claim_type: tiered_pricing
        grounds:
          - calculations.filing_fee_assessment.constants
          - entities.FinancialStatement.fields.contributions_cents
        distinguishing_aspect: "TIER_1_UPPER_EXCLUSIVE_CENTS is exclusive: contributions 2499999 stay in the 2500 tier for a RENEWAL fee of 3500, while contributions of exactly 2500000 jump to the 5000 tier for 6000 — measured on two organizations that are otherwise identical."
        test_recipe:
          setup:
            - "StateProfile CA; two Organizations each with an online donation page and FYE month 6; one CURRENT FY2026 statement per organization, at 2499999 and 2500000 contributions."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, online_presence_counts: true, base_filing_fee_cents: 2500, online_surcharge_cents: 1000, per_contract_fee_cents: 1500, filing_fee_cap_cents: 30000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6, has_online_donation_page: true }
              as: ComplianceOfficer
              captures: { org_a_id: $.data.id, org_a_v: $.data.version }
            - call: "POST /organizations"
              payload: { legal_name: "Cedar Ridge Alliance", ein: "223456789", domicile_state_code: "CA", fiscal_year_end_month: 6, has_online_donation_page: true }
              as: ComplianceOfficer
              captures: { org_b_id: $.data.id, org_b_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_a_id}", fiscal_year: 2026, total_revenue_cents: 2499999, contributions_cents: 2499999, program_expense_cents: 1800000, fundraising_expense_cents: 400000, management_expense_cents: 200000, expected_organization_version: "${org_a_v}" }
              as: ComplianceOfficer
              captures: { fs_a_id: $.data.id }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_b_id}", fiscal_year: 2026, total_revenue_cents: 2500000, contributions_cents: 2500000, program_expense_cents: 1800000, fundraising_expense_cents: 400000, management_expense_cents: 200000, expected_organization_version: "${org_b_v}" }
              as: ComplianceOfficer
              captures: { fs_b_id: $.data.id }
          trigger:
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_a_id}", state_code: "CA", registration_type: "RENEWAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_a_id}" }
              as: ComplianceOfficer
              captures: { reg_a_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_b_id}", state_code: "CA", registration_type: "RENEWAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_b_id}" }
              as: ComplianceOfficer
              captures: { reg_b_id: $.data.id }
          assert:
            - "StateRegistration.${reg_a_id}.filing_fee_cents == 3500"
            - "StateRegistration.${reg_b_id}.filing_fee_cents == 6000"
            - "StateRegistration.${reg_a_id}.required_financial_attestation == NONE"
            - "StateRegistration.${reg_b_id}.required_financial_attestation == NONE"

      - name: extension_grant_ignores_requested_days_under_irs_basis
        claim_type: constants_applied
        grounds:
          - calculations.extension_grant_length
          - calculations.renewal_deadline_derivation
          - state_machines.ExtensionRequest.transitions.PENDING_to_GRANTED
        distinguishing_aspect: "Under IRS_990_EXTENSION the requested_days field is discarded entirely and the grant is min(IRS_990_EXTENSION_DAYS, extension_max_days) = 90, so a request that asked for 5 days moves the effective deadline from 2026-11-14 to 2027-02-12."
        test_recipe:
          setup:
            - "StateProfile CA with extension_allowed true and extension_max_days 90; an Organization with FYE month 6; a DRAFT CA FY2026 filing whose renewal_due_date is 2026-11-14."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, extension_allowed: true, extension_max_days: 90 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_id: $.data.id, reg_v: $.data.version }
            - call: "POST /extension-requests"
              payload: { registration_id: "${reg_id}", basis: "IRS_990_EXTENSION", requested_days: 5, expected_registration_version: "${reg_v}" }
              as: ComplianceOfficer
              captures: { ext_id: $.data.id }
          trigger:
            - call: "POST /extension-requests/${ext_id}/decide"
              payload: { decision: "GRANT" }
              as: StateRegulator
          assert:
            - "response.http_status == 200"
            - "ExtensionRequest.${ext_id}.status == GRANTED"
            - "ExtensionRequest.${ext_id}.granted_days == 90"
            - "ExtensionRequest.${ext_id}.requested_days == 5"
            - "ExtensionRequest.${ext_id}.decided_at == 2026-08-01T00:00:00Z"
            - "StateRegistration.${reg_id}.renewal_due_date == 2026-11-14T00:00:00Z"
            - "StateRegistration.${reg_id}.extended_due_date == 2027-02-12T00:00:00Z"
            - "StateRegistration.${reg_id}.effective_due_date == 2027-02-12T00:00:00Z"

      - name: disclosure_resolution_adds_both_conditional_clauses_in_canonical_order
        claim_type: correct_result
        grounds:
          - calculations.disclosure_requirement_resolution
          - entities.DisclosureStatement.fields.required_clauses
          - endpoints[POST /disclosure-statements]
        distinguishing_aspect: "Both existence probes fire at once — a FILED professional-solicitor contract and a FILED co-venture promotion in the same state — and the two conditional clauses are interleaved into CANONICAL_CLAUSE_ORDER rather than appended, so required_clauses is [REGISTRATION_DISCLOSURE, FINANCIAL_STATEMENT_AVAILABILITY, PAID_SOLICITOR_IDENTITY, PERCENT_TO_CHARITY]."
        test_recipe:
          setup:
            - "StateProfile CA requiring REGISTRATION_DISCLOSURE and FINANCIAL_STATEMENT_AVAILABILITY, with coventure_filing_required true; an Organization; a PROFESSIONAL_SOLICITOR and a COMMERCIAL_COVENTURER each holding an ACTIVE CA FundraiserRegistration; a FILED CA contract; a FILED CA promotion for the window 2026-09-01 to 2026-09-30."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, disclosure_required_clauses: ["REGISTRATION_DISCLOSURE", "FINANCIAL_STATEMENT_AVAILABILITY"], fundraiser_contract_filing_days: 10, fundraiser_bond_minimum_cents: 2500000, coventure_filing_required: true, coventure_buffer_days: 7 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
            - call: "POST /professional-fundraisers"
              payload: { legal_name: "Northline Donor Services", fundraiser_type: "PROFESSIONAL_SOLICITOR", bond_amount_cents: 2500000, bond_expires_at: "2028-12-31T00:00:00Z" }
              as: SystemAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /professional-fundraisers"
              payload: { legal_name: "BrightMart Retail Co", fundraiser_type: "COMMERCIAL_COVENTURER", bond_amount_cents: 2500000, bond_expires_at: "2028-12-31T00:00:00Z" }
              as: SystemAdmin
              captures: { cv_id: $.data.id }
            - call: "POST /fundraiser-registrations"
              payload: { fundraiser_id: "${pf_id}", state_code: "CA", bond_on_file_cents: 2500000, expires_at: "2027-12-31T00:00:00Z" }
              as: FundraiserAgent
              as_user_id: "${pf_id}"
            - call: "POST /fundraiser-registrations"
              payload: { fundraiser_id: "${cv_id}", state_code: "CA", bond_on_file_cents: 2500000, expires_at: "2027-12-31T00:00:00Z" }
              as: FundraiserAgent
              as_user_id: "${cv_id}"
            - call: "POST /fundraising-contracts"
              payload: { organization_id: "${org_id}", fundraiser_id: "${pf_id}", state_codes: ["CA"], contract_start: "2026-08-01T00:00:00Z", contract_end: "2027-08-01T00:00:00Z", compensation_type: "PERCENT_OF_GROSS", percent_of_gross: 0.15 }
              as: ComplianceOfficer
              captures: { ct_id: $.data.id }
            - call: "POST /fundraising-contracts/${ct_id}/file"
              payload: {}
              as: FundraiserAgent
              as_user_id: "${pf_id}"
            - call: "POST /coventure-promotions"
              payload: { organization_id: "${org_id}", coventurer_id: "${cv_id}", state_codes: ["CA"], promo_start: "2026-09-01T00:00:00Z", promo_end: "2026-09-30T00:00:00Z", guaranteed_minimum_cents: 500000, per_unit_cents: 250, projected_units: 3000 }
              as: ComplianceOfficer
              captures: { promo_id: $.data.id }
            - call: "POST /coventure-promotions/${promo_id}/file"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /disclosure-statements"
              payload: { organization_id: "${org_id}", state_code: "CA", material_type: "WEB", included_clauses: ["FINANCIAL_STATEMENT_AVAILABILITY"] }
              as: ComplianceOfficer
              captures: { ds_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "DisclosureStatement.${ds_id}.required_clauses == [REGISTRATION_DISCLOSURE, FINANCIAL_STATEMENT_AVAILABILITY, PAID_SOLICITOR_IDENTITY, PERCENT_TO_CHARITY]"
            - "DisclosureStatement.${ds_id}.missing_clauses == [REGISTRATION_DISCLOSURE, PAID_SOLICITOR_IDENTITY, PERCENT_TO_CHARITY]"
            - "DisclosureStatement.${ds_id}.compliance_status == NON_COMPLIANT"
            - "CoventurePromotion.${promo_id}.projected_benefit_cents == 750000"

      - name: disclosure_empty_required_set_is_compliant_with_no_clauses
        claim_type: threshold_boundary
        grounds:
          - calculations.disclosure_requirement_resolution.note
          - entities.DisclosureStatement.fields.compliance_status
        distinguishing_aspect: "The empty-set boundary: a state that lists no required clauses and has neither a filed solicitor engagement nor a live promotion yields required_clauses [] and missing_clauses [], so an empty material is COMPLIANT rather than NON_COMPLIANT."
        test_recipe:
          setup:
            - "StateProfile TX with disclosure_required_clauses omitted, and one Organization with no contracts or promotions."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "TX", registration_required: false, renewal_due_rule: "CALENDAR_MAY_15", assurance_basis: "CONTRIBUTIONS_ONLY", review_threshold_cents: 100000000, audit_threshold_cents: 500000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "TX", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /disclosure-statements"
              payload: { organization_id: "${org_id}", state_code: "TX", material_type: "PRINT", included_clauses: [] }
              as: ComplianceOfficer
              captures: { ds_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "DisclosureStatement.${ds_id}.required_clauses == []"
            - "DisclosureStatement.${ds_id}.missing_clauses == []"
            - "DisclosureStatement.${ds_id}.compliance_status == COMPLIANT"

      - name: renewal_deadline_clamps_the_day_before_day_arithmetic
        claim_type: precision
        grounds:
          - calculations.renewal_deadline_derivation.formula
          - entities.StateProfile.fields.renewal_due_rule
        distinguishing_aspect: "One December fiscal year end feeds all three renewal rules at once: FYE_PLUS_4M_15D must clamp 2025-12-31 to 2026-04-30 before adding 15 days to reach 2026-05-15 (adding days first would yield September), FYE_PLUS_6M clamps to 2026-06-30, and CALENDAR_MAY_15 ignores the fiscal year end entirely."
        test_recipe:
          setup:
            - "Three StateProfiles CA, FL and WA carrying the three distinct renewal rules; one Organization with fiscal_year_end_month 12; one CURRENT FY2025 statement."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /state-profiles"
              payload: { state_code: "FL", registration_required: true, renewal_due_rule: "FYE_PLUS_6M", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 50000000, audit_threshold_cents: 100000000 }
              as: SystemAdmin
            - call: "POST /state-profiles"
              payload: { state_code: "WA", registration_required: true, renewal_due_rule: "CALENDAR_MAY_15", assurance_basis: "CONTRIBUTIONS_ONLY", review_threshold_cents: 300000000, audit_threshold_cents: 500000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 12 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2025, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
          trigger:
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2025, coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2026-01-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_ca_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "FL", registration_type: "INITIAL", fiscal_year: 2025, coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2026-01-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_fl_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "WA", registration_type: "INITIAL", fiscal_year: 2025, coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2026-01-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_wa_id: $.data.id }
          assert:
            - "StateRegistration.${reg_ca_id}.renewal_due_date == 2026-05-15T00:00:00Z"
            - "StateRegistration.${reg_ca_id}.effective_due_date == 2026-05-15T00:00:00Z"
            - "StateRegistration.${reg_fl_id}.renewal_due_date == 2026-06-30T00:00:00Z"
            - "StateRegistration.${reg_wa_id}.renewal_due_date == 2026-05-15T00:00:00Z"
            - "StateRegistration.${reg_ca_id}.required_financial_attestation == REVIEW"
            - "StateRegistration.${reg_wa_id}.required_financial_attestation == NONE"

      - name: assurance_threshold_inclusive_at_the_review_boundary
        claim_type: threshold_boundary
        grounds:
          - calculations.assurance_requirement_derivation
        excluded_because:
          difficulty_instance: assurance_threshold_exact_boundary_on_gross_revenue_basis
          rationale: "That boundary-precision instance already probes total_revenue_cents at threshold-1, exactly at the threshold and at threshold+1 against the same CA profile and asserts NONE / REVIEW / REVIEW."

      - name: late_penalty_rounds_each_month_before_summing
        claim_type: precision
        grounds:
          - calculations.late_penalty_accrual.precision
        excluded_because:
          difficulty_instance: late_penalty_per_month_rounding_before_summation_ca
          rationale: "The pinned per-month round_half_up order is already observed there by comparing the produced penalty against the sum-then-round alternative on the same escalation percentage."

      - name: settlement_discount_tier_is_keyed_on_the_penalty_subtotal
        claim_type: waterfall_allocation
        grounds:
          - calculations.remediation_settlement_total.formula
        excluded_because:
          difficulty_instance: remediation_settlement_discount_keyed_on_penalty_subtotal_ca
          rationale: "That instance already contrasts the correct subtotal-keyed tier against the total-keyed misreading on the same action set, which is the only interesting claim about the waterfall's step order."

      - name: assurance_basis_variant_divergence_across_two_states
        claim_type: variant_divergence
        grounds:
          - calculations.assurance_requirement_derivation.variants
        excluded_because:
          difficulty_instance: assurance_basis_divergence_ca_review_vs_ny_none
          rationale: "The same FinancialStatement is already filed into a GROSS_REVENUE state and a CONTRIBUTIONS_ONLY state there, with the divergent REVIEW / NONE outcomes asserted side by side."

      - name: coventure_variant_selection_by_lifecycle_stage
        claim_type: variant_selection
        grounds:
          - calculations.coventure_benefit_determination.variants
        excluded_because:
          difficulty_instance: coventure_projected_vs_actual_benefit_divergence
          rationale: "That instance already asserts the projected variant at the DRAFT -> FILED transition and the actual variant at settlement on one promotion row, including the guarantee binding only in the second variant."

      - name: filing_fee_clamp_evaluated_after_the_initial_multiplier
        claim_type: constants_applied
        grounds:
          - calculations.filing_fee_assessment.formula
        excluded_because:
          difficulty_instance: filing_fee_clamp_applied_after_initial_multiplier_ca
          rationale: "The cap-binding case is already constructed there so that clamping before the multiplier would return a different fee, which is the only way the step order is observable."

  # ---------------------------------------------------------------------------
  # From Table 4 (Validations)
  # ---------------------------------------------------------------------------
  - section: validations
    instances:

      - name: submit_with_an_incomplete_officer_disclosure_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors[ERR_OFFICER_DISCLOSURE_INCOMPLETE]
          - entities.OfficerDisclosure.fields.disclosure_status
        distinguishing_aspect: "disclosure_status is derived, not supplied: an officer who discloses a conviction without an explanation is INCOMPLETE, and priority 17 blocks the submit at 422 before priority 29 can complain that the filing carries no documents at all."
        test_recipe:
          setup:
            - "StateProfile CA; an Organization; a complete certifying officer; a second officer who disclosed a conviction with no explanation; a DRAFT CA FY2026 filing with no documents."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
            - call: "POST /officer-disclosures"
              payload: { organization_id: "${org_id}", officer_name: "Dana Reyes", title: "PRESIDENT", is_certifying_officer: true }
              as: ComplianceOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /officer-disclosures"
              payload: { organization_id: "${org_id}", officer_name: "Rae Mensah", title: "TREASURER", criminal_conviction_disclosed: true }
              as: ComplianceOfficer
              captures: { bad_officer_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /state-registrations/${reg_id}/submit"
              payload: { certification_note: "Certified under penalty of perjury." }
              as: CertifyingOfficer
              as_user_id: "${cert_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.http_status == 422"
            - "${err_id} == ERR_OFFICER_DISCLOSURE_INCOMPLETE"
            - "OfficerDisclosure.${bad_officer_id}.disclosure_status == INCOMPLETE"
            - "OfficerDisclosure.${cert_id}.disclosure_status == COMPLETE"
            - "StateRegistration.${reg_id}.status == DRAFT"

      - name: submit_without_the_required_review_report_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=29]
          - errors[ERR_REQUIRED_DOCUMENT_MISSING]
          - entities.RegistrationDocument.fields.doc_type
        distinguishing_aspect: "The required document set is a function of required_financial_attestation: with REVIEW derived from gross revenue, a packet holding GOVERNING_DOCUMENT and FINANCIAL_STATEMENT is still short one REVIEW_REPORT and the submit is refused 422 even though every officer disclosure is COMPLETE."
        test_recipe:
          setup:
            - "StateProfile CA; an Organization; a CURRENT FY2026 statement at REVIEW; a complete certifying officer and a preparing officer; a DRAFT CA FY2026 filing carrying only GOVERNING_DOCUMENT and FINANCIAL_STATEMENT."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
            - call: "POST /officer-disclosures"
              payload: { organization_id: "${org_id}", officer_name: "Dana Reyes", title: "PRESIDENT", is_certifying_officer: true }
              as: ComplianceOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /officer-disclosures"
              payload: { organization_id: "${org_id}", officer_name: "Sam Okoye", title: "SECRETARY" }
              as: ComplianceOfficer
              captures: { prep_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_id: $.data.id }
            - call: "POST /registration-documents"
              payload: { registration_id: "${reg_id}", doc_type: "GOVERNING_DOCUMENT", prepared_by_officer_id: "${prep_id}", page_count: 12 }
              as: ComplianceOfficer
            - call: "POST /registration-documents"
              payload: { registration_id: "${reg_id}", doc_type: "FINANCIAL_STATEMENT", prepared_by_officer_id: "${prep_id}", page_count: 8 }
              as: ComplianceOfficer
          trigger:
            - call: "POST /state-registrations/${reg_id}/submit"
              payload: { certification_note: "Certified under penalty of perjury." }
              as: CertifyingOfficer
              as_user_id: "${cert_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.http_status == 422"
            - "${err_id} == ERR_REQUIRED_DOCUMENT_MISSING"
            - "StateRegistration.${reg_id}.required_financial_attestation == REVIEW"
            - "StateRegistration.${reg_id}.status == DRAFT"
            - "StateRegistration.${reg_id}.submitted_at == null"

      - name: registration_in_a_state_that_does_not_require_it_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=18]
          - errors[ERR_STATE_REGISTRATION_NOT_REQUIRED]
          - entities.StateProfile.fields.registration_required
        distinguishing_aspect: "The rule is conditional on the target state's own profile flag: an identical create payload that succeeds against CA is refused 422 against TX because TX carries registration_required false and the organization logged no triggering activity there."
        test_recipe:
          setup:
            - "StateProfile TX with registration_required false; an Organization with a CURRENT FY2026 statement; no SolicitationActivity in TX."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "TX", registration_required: false, renewal_due_rule: "CALENDAR_MAY_15", assurance_basis: "CONTRIBUTIONS_ONLY", review_threshold_cents: 100000000, audit_threshold_cents: 500000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "TX", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
          trigger:
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "TX", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response.http_status == 422"
            - "${err_id} == ERR_STATE_REGISTRATION_NOT_REQUIRED"
            - "Organization.${org_id}.registered_state_count == 0"

      - name: duplicate_registration_rule_permits_the_same_year_in_a_second_state
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=27]
          - validations[priority=22]
        distinguishing_aspect: "The uniqueness key is (organization_id, state_code, fiscal_year) and the overlap check is scoped per state, so a second FY2026 filing with byte-identical coverage dates succeeds in NV and both filings coexist as DRAFT."
        test_recipe:
          setup:
            - "StateProfiles CA and NV; an Organization with a CURRENT FY2026 statement; a DRAFT CA FY2026 filing covering [2025-07-01, 2026-07-01)."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /state-profiles"
              payload: { state_code: "NV", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_ca_id: $.data.id }
          trigger:
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "NV", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_nv_id: $.data.id }
          assert:
            - "response.http_status == 201"
            - "StateRegistration.${reg_nv_id}.status == DRAFT"
            - "StateRegistration.${reg_ca_id}.status == DRAFT"
            - "StateRegistration.${reg_nv_id}.state_code == NV"

      - name: duplicate_ein_on_a_second_organization_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=28]
          - errors[ERR_DUPLICATE_IDENTIFIER]
          - entities.Organization.fields.ein
        distinguishing_aspect: "Uniqueness is on ein alone, not on the (ein, legal_name) pair: a differently named charity in a different domicile state reusing the same nine-digit ein is refused 409."
        test_recipe:
          setup:
            - "StateProfiles CA and NV and one Organization already holding ein 123456789."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /state-profiles"
              payload: { state_code: "NV", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /organizations"
              payload: { legal_name: "Cedar Ridge Alliance", ein: "123456789", domicile_state_code: "NV", fiscal_year_end_month: 12 }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "${err_id} == ERR_DUPLICATE_IDENTIFIER"
            - "Organization.${org_id}.legal_name == Harbor Light Foundation"

      - name: fundraiser_registration_below_the_state_bond_minimum_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=32]
          - errors[ERR_BOND_INSUFFICIENT]
          - entities.StateProfile.fields.fundraiser_bond_minimum_cents
        distinguishing_aspect: "The bond floor is inclusive, so one cent short of the state's 2500000 minimum is refused 422 and no FundraiserRegistration exists to satisfy a later contract filing."
        test_recipe:
          setup:
            - "StateProfile CA with fundraiser_bond_minimum_cents 2500000 and a PROFESSIONAL_SOLICITOR whose corporate bond runs to 2028-12-31."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, fundraiser_bond_minimum_cents: 2500000, fundraiser_contract_filing_days: 10 }
              as: SystemAdmin
            - call: "POST /professional-fundraisers"
              payload: { legal_name: "Northline Donor Services", fundraiser_type: "PROFESSIONAL_SOLICITOR", bond_amount_cents: 2500000, bond_expires_at: "2028-12-31T00:00:00Z" }
              as: SystemAdmin
              captures: { pf_id: $.data.id }
          trigger:
            - call: "POST /fundraiser-registrations"
              payload: { fundraiser_id: "${pf_id}", state_code: "CA", bond_on_file_cents: 2499999, expires_at: "2027-12-31T00:00:00Z" }
              as: FundraiserAgent
              as_user_id: "${pf_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.http_status == 422"
            - "${err_id} == ERR_BOND_INSUFFICIENT"

      - name: contract_filed_past_the_hard_stop_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=24]
          - errors[ERR_CONTRACT_FILING_WINDOW_CLOSED]
          - calculations.contract_filing_deadline.constants
        distinguishing_aspect: "Two deadlines govern the same contract: filing_due_date 2026-08-11 only downgrades the outcome to LATE_FILED, while filing_due_date + CONTRACT_FILING_HARD_STOP_DAYS = 2026-10-10 is an absolute bar, so a file attempt on 2026-10-11 is refused 422 and the contract stays DRAFT forever."
        test_recipe:
          setup:
            - "StateProfile CA with fundraiser_contract_filing_days 10; a PROFESSIONAL_SOLICITOR with an ACTIVE CA registration; a DRAFT CA contract starting 2026-08-01; the clock advanced to 2026-10-11."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, fundraiser_contract_filing_days: 10, fundraiser_bond_minimum_cents: 2500000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
            - call: "POST /professional-fundraisers"
              payload: { legal_name: "Northline Donor Services", fundraiser_type: "PROFESSIONAL_SOLICITOR", bond_amount_cents: 2500000, bond_expires_at: "2028-12-31T00:00:00Z" }
              as: SystemAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /fundraiser-registrations"
              payload: { fundraiser_id: "${pf_id}", state_code: "CA", bond_on_file_cents: 2500000, expires_at: "2027-12-31T00:00:00Z" }
              as: FundraiserAgent
              as_user_id: "${pf_id}"
            - call: "POST /fundraising-contracts"
              payload: { organization_id: "${org_id}", fundraiser_id: "${pf_id}", state_codes: ["CA"], contract_start: "2026-08-01T00:00:00Z", contract_end: "2027-08-01T00:00:00Z", compensation_type: "PERCENT_OF_GROSS", percent_of_gross: 0.15 }
              as: ComplianceOfficer
              captures: { ct_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-11T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /fundraising-contracts/${ct_id}/file"
              payload: {}
              as: FundraiserAgent
              as_user_id: "${pf_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.http_status == 422"
            - "${err_id} == ERR_CONTRACT_FILING_WINDOW_CLOSED"
            - "FundraisingContract.${ct_id}.status == DRAFT"
            - "FundraisingContract.${ct_id}.filing_due_date == 2026-08-11T00:00:00Z"
            - "FundraisingContract.${ct_id}.filed_at == null"

      - name: contract_filed_inside_the_grace_band_becomes_late_filed
        claim_type: temporal_validation
        grounds:
          - state_machines.FundraisingContract.transitions.DRAFT_to_LATE_FILED
          - calculations.contract_filing_deadline.constants
        distinguishing_aspect: "The band strictly after filing_due_date and at or before the hard stop routes to a different branch rather than to an error: on 2026-08-20 the contract lands in LATE_FILED with late_filing_surcharge_cents 10000 instead of FILED with 0, and the LATE_FILED branch still carries the disclosure recomputation side effect, so the CA phone script that only names the charity flips to NON_COMPLIANT."
        test_recipe:
          setup:
            - "The same CA profile, solicitor with an ACTIVE CA registration and DRAFT contract starting 2026-08-01, with the clock advanced to 2026-08-20."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, fundraiser_contract_filing_days: 10, fundraiser_bond_minimum_cents: 2500000, disclosure_required_clauses: ["REGISTRATION_DISCLOSURE"] }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
            - call: "POST /professional-fundraisers"
              payload: { legal_name: "Northline Donor Services", fundraiser_type: "PROFESSIONAL_SOLICITOR", bond_amount_cents: 2500000, bond_expires_at: "2028-12-31T00:00:00Z" }
              as: SystemAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /fundraiser-registrations"
              payload: { fundraiser_id: "${pf_id}", state_code: "CA", bond_on_file_cents: 2500000, expires_at: "2027-12-31T00:00:00Z" }
              as: FundraiserAgent
              as_user_id: "${pf_id}"
            - call: "POST /fundraising-contracts"
              payload: { organization_id: "${org_id}", fundraiser_id: "${pf_id}", state_codes: ["CA"], contract_start: "2026-08-01T00:00:00Z", contract_end: "2027-08-01T00:00:00Z", compensation_type: "FLAT_FEE", flat_fee_cents: 900000 }
              as: ComplianceOfficer
              captures: { ct_id: $.data.id }
            - call: "POST /disclosure-statements"
              payload: { organization_id: "${org_id}", state_code: "CA", material_type: "PHONE_SCRIPT", included_clauses: ["REGISTRATION_DISCLOSURE"] }
              as: ComplianceOfficer
              captures: { ds_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /fundraising-contracts/${ct_id}/file"
              payload: {}
              as: FundraiserAgent
              as_user_id: "${pf_id}"
          assert:
            - "response.http_status == 200"
            - "FundraisingContract.${ct_id}.status == LATE_FILED"
            - "FundraisingContract.${ct_id}.late_filing_surcharge_cents == 10000"
            - "FundraisingContract.${ct_id}.filed_at == 2026-08-20T00:00:00Z"
            - "DisclosureStatement.${ds_id}.compliance_status == NON_COMPLIANT"

      - name: posture_gate_outranks_the_assurance_check_on_submit
        claim_type: priority_ordering
        grounds:
          - validations[priority=14]
          - validations[priority=34]
        excluded_because:
          difficulty_instance: halted_posture_p14_beats_assurance_insufficient_p34_on_submit
          rationale: "That instance builds one FL filing that violates both rules at once — a cease-solicitation order in the domicile state and a statement whose assurance_level is below the required attestation — and asserts ERR_SOLICITATION_HALTED with 409, which is the whole priority-conflict claim; the losing rule at priority 34 is exercised standalone by assurance_level_below_the_required_attestation_rejected."

      - name: contract_state_check_outranks_the_fundraiser_coverage_check
        claim_type: cascading_validation
        grounds:
          - validations[priority=11]
          - validations[priority=19]
        excluded_because:
          difficulty_instance: contract_state_p11_beats_fundraiser_registration_p19_on_file
          rationale: "The already-filed contract with a lapsed state registration is exactly the double violation that instance uses to prove the ascending-priority ordering."

      - name: coverage_overlap_check_outranks_the_duplicate_year_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=22]
          - validations[priority=27]
        excluded_because:
          difficulty_instance: coverage_overlap_p22_beats_duplicate_registration_p27_on_create
          rationale: "That instance constructs a create that trips both the overlap and the duplicate-year rules and asserts the overlap error, so a second probe would add nothing."

      - name: coverage_interval_overlap_is_half_open
        claim_type: temporal_validation
        grounds:
          - validations[priority=22]
        excluded_because:
          difficulty_instance: registration_coverage_half_open_adjacency_allowed_overlap_rejected
          rationale: "Adjacency at the shared instant and a one-second overlap are both already probed there against the same existing REGISTERED filing."

      - name: promotion_window_conflict_includes_the_state_buffer
        claim_type: temporal_validation
        grounds:
          - validations[priority=23]
        excluded_because:
          difficulty_instance: promotion_window_closed_interval_plus_buffer_day_boundary
          rationale: "That resource-temporal-overlap instance already walks the last rejected day and the first accepted day of the buffered closed window for the same co-venturer and state."

  # ---------------------------------------------------------------------------
  # From Table 5 (Endpoints)
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:

      - name: compliance_calendar_orders_entries_by_effective_due_date
        claim_type: computed_read
        grounds:
          - endpoints[GET /organizations/{id}/compliance-calendar]
          - calculations.renewal_deadline_derivation
        distinguishing_aspect: "The calendar is a pure computed read that sorts on effective_due_date ASC, not on creation order: the FL filing is created first but the CA entry with the earlier 2026-11-14 deadline is emitted first, and next_effective_due_date echoes that same instant while delinquent_state_codes stays empty."
        test_recipe:
          setup:
            - "StateProfiles CA (FYE_PLUS_4M_15D) and FL (FYE_PLUS_6M); an Organization with FYE month 6; a CURRENT FY2026 statement; a DRAFT FL FY2026 filing created before a DRAFT CA FY2026 filing."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /state-profiles"
              payload: { state_code: "FL", registration_required: true, renewal_due_rule: "FYE_PLUS_6M", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 50000000, audit_threshold_cents: 100000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "FL", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_fl_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_ca_id: $.data.id }
          trigger:
            - call: "GET /organizations/${org_id}/compliance-calendar"
              payload: { fiscal_year: 2026 }
              as: ComplianceOfficer
          assert:
            - "response.http_status == 200"
            - "response.data.organization_id == ${org_id}"
            - "response.data.entry_count == 2"
            - "response.data.entries[0].state_code == CA"
            - "response.data.entries[0].effective_due_date == 2026-11-14T00:00:00Z"
            - "response.data.entries[0].status == DRAFT"
            - "response.data.entries[1].state_code == FL"
            - "response.data.entries[1].effective_due_date == 2026-12-30T00:00:00Z"
            - "response.data.next_effective_due_date == 2026-11-14T00:00:00Z"
            - "response.data.delinquent_state_codes == []"

      - name: clock_endpoint_governs_every_later_deadline_stamp
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities.EnforcementAction.fields.issued_at
          - entities.EnforcementAction.fields.cure_deadline
        distinguishing_aspect: "The logical clock is the only time source: after moving it to 2026-09-15 an enforcement action issued against the filing stamps issued_at at that instant and derives cure_deadline as 2026-10-15 from the state's 30-day cure period, with no dependence on wall-clock time."
        test_recipe:
          setup:
            - "StateProfile CA with cure_period_days 30; an Organization; a CURRENT FY2026 statement; a DRAFT CA FY2026 filing created while the clock still read 2026-08-01."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, cure_period_days: 30, reinstatement_fee_cents: 12500 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /enforcement-actions"
              payload: { organization_id: "${org_id}", registration_id: "${reg_id}", action_type: "PENALTY_ASSESSMENT", penalty_cents_override: 5000 }
              as: StateRegulator
              captures: { act_id: $.data.id }
          assert:
            - "responses[0].http_status == 200"
            - "responses[0].data.current_utc == 2026-09-15T00:00:00Z"
            - "responses[1].http_status == 201"
            - "EnforcementAction.${act_id}.issued_at == 2026-09-15T00:00:00Z"
            - "EnforcementAction.${act_id}.cure_deadline == 2026-10-15T00:00:00Z"
            - "EnforcementAction.${act_id}.state_code == CA"
            - "EnforcementAction.${act_id}.penalty_cents == 5000"
            - "EnforcementAction.${act_id}.settlement_total_cents == 0"

      - name: promotion_activation_before_the_window_opens_rejected
        claim_type: conditional_action
        grounds:
          - endpoints[POST /coventure-promotions/{id}/activate]
          - validations[priority=26]
          - errors[ERR_PROMOTION_WINDOW_NOT_OPEN]
        distinguishing_aspect: "file and activate read the same window with opposite polarity: filing is legal only strictly before promo_start, so the very clock instant that made the file call succeed makes the immediately following activate call fail 422 with the promotion left in FILED."
        test_recipe:
          setup:
            - "StateProfile CA with coventure_filing_required true; an Organization; a COMMERCIAL_COVENTURER with an ACTIVE CA registration; a FILED CA promotion for the closed window 2026-09-01 to 2026-09-30, with the clock still at 2026-08-01."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, fundraiser_bond_minimum_cents: 2500000, coventure_filing_required: true, coventure_buffer_days: 7 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
            - call: "POST /professional-fundraisers"
              payload: { legal_name: "BrightMart Retail Co", fundraiser_type: "COMMERCIAL_COVENTURER", bond_amount_cents: 2500000, bond_expires_at: "2028-12-31T00:00:00Z" }
              as: SystemAdmin
              captures: { cv_id: $.data.id }
            - call: "POST /fundraiser-registrations"
              payload: { fundraiser_id: "${cv_id}", state_code: "CA", bond_on_file_cents: 2500000, expires_at: "2027-12-31T00:00:00Z" }
              as: FundraiserAgent
              as_user_id: "${cv_id}"
            - call: "POST /coventure-promotions"
              payload: { organization_id: "${org_id}", coventurer_id: "${cv_id}", state_codes: ["CA"], promo_start: "2026-09-01T00:00:00Z", promo_end: "2026-09-30T00:00:00Z", guaranteed_minimum_cents: 500000, per_unit_cents: 250, projected_units: 3000 }
              as: ComplianceOfficer
              captures: { promo_id: $.data.id }
            - call: "POST /coventure-promotions/${promo_id}/file"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /coventure-promotions/${promo_id}/activate"
              payload: {}
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response.http_status == 422"
            - "${err_id} == ERR_PROMOTION_WINDOW_NOT_OPEN"
            - "CoventurePromotion.${promo_id}.status == FILED"
            - "CoventurePromotion.${promo_id}.projected_benefit_cents == 750000"
            - "CoventurePromotion.${promo_id}.disclosure_clause_required == true"

      - name: registration_create_with_unknown_financial_statement_returns_not_found
        claim_type: cross_reference_link
        grounds:
          - validations[priority=5]
          - errors[ERR_FINANCIAL_STATEMENT_NOT_FOUND]
          - endpoints[POST /state-registrations]
        distinguishing_aspect: "Body foreign keys are resolved in the declared order organization_id, state_code, financial_statement_id, so with a valid organization and a valid state the unresolvable statement id is what surfaces, as ERR_FINANCIAL_STATEMENT_NOT_FOUND rather than a generic 422."
        test_recipe:
          setup:
            - "StateProfile CA and one Organization that owns no FinancialStatement."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "00000000-0000-0000-0000-000000000000" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response.http_status == 404"
            - "${err_id} == ERR_FINANCIAL_STATEMENT_NOT_FOUND"
            - "Organization.${org_id}.registered_state_count == 0"

      - name: compliance_sweep_bulk_action_reports_what_it_touched
        claim_type: bulk_action
        grounds:
          - endpoints[POST /compliance-sweeps]
        excluded_because:
          difficulty_instance: late_penalty_month_bucket_boundary_at_90_and_91_days
          rationale: "That instance already runs the sweep twice with the state_code filter and reads the resulting per-state enforcement actions, exercising both the bulk selection and the per-row cascade reporting of this endpoint."

      - name: settle_action_endpoint_branches_on_the_remittance
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /coventure-promotions/{id}/settle]
        excluded_because:
          difficulty_instance: coventure_remittance_shortfall_boundary_of_one_cent
          rationale: "The SETTLED versus DEFICIENT_REMITTANCE fork of this endpoint is already walked one cent either side of final_benefit_cents there."

  # ---------------------------------------------------------------------------
  # From Table 6 (Errors) — every catalog entry must be triggerable
  # ---------------------------------------------------------------------------
  - section: errors
    instances:

      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Authentication is checked at priority 1, ahead of authorization and of path existence, so a read of a real organization with no X-User-Role header at all returns 401 ERR_UNAUTHENTICATED rather than 403 or 404."
        test_recipe:
          setup:
            - "StateProfile CA and one Organization."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
          trigger:
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: "(request sent with no X-User-Role and no X-User-ID header)"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.http_status == 401"
            - "${err_id} == ERR_UNAUTHENTICATED"
            - "response.response_type == error"

      - name: unseeded_state_code_returns_state_profile_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_STATE_PROFILE_NOT_FOUND]
          - validations[priority=4]
          - validations[priority=5]
        distinguishing_aspect: "A state whose rule set was never seeded is a 404 on both surfaces: the direct profile read and the registration create that names it in the body, the latter proving state_code is resolved as a foreign key and not merely as a two-letter string."
        test_recipe:
          setup:
            - "StateProfile CA only; an Organization with a CURRENT FY2026 statement. OR is never seeded."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
          trigger:
            - call: "GET /state-profiles/OR"
              payload: {}
              as: ComplianceOfficer
              captures: { err_read: $.data.error_id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "OR", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { err_create: $.data.error_id }
          assert:
            - "responses[0].http_status == 404"
            - "${err_read} == ERR_STATE_PROFILE_NOT_FOUND"
            - "responses[1].http_status == 404"
            - "${err_create} == ERR_STATE_PROFILE_NOT_FOUND"

      - name: document_naming_an_unknown_preparer_returns_officer_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_OFFICER_NOT_FOUND]
          - validations[priority=5]
          - entities.RegistrationDocument.fields.prepared_by_officer_id
        distinguishing_aspect: "prepared_by_officer_id is resolved after registration_id in the declared body-key order, so with a real DRAFT filing in hand the unknown officer id is what fails, as 404 ERR_OFFICER_NOT_FOUND."
        test_recipe:
          setup:
            - "StateProfile CA; an Organization with a CURRENT FY2026 statement; a DRAFT CA FY2026 filing; no OfficerDisclosure rows at all."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6 }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /registration-documents"
              payload: { registration_id: "${reg_id}", doc_type: "GOVERNING_DOCUMENT", prepared_by_officer_id: "00000000-0000-0000-0000-000000000000", page_count: 12 }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response.http_status == 404"
            - "${err_id} == ERR_OFFICER_NOT_FOUND"

      - name: unknown_path_ids_return_their_own_not_found_codes
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ENFORCEMENT_ACTION_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - errors[ERR_PROMOTION_NOT_FOUND]
          - errors[ERR_EXTENSION_REQUEST_NOT_FOUND]
          - errors[ERR_REGISTRATION_DOCUMENT_NOT_FOUND]
          - errors[ERR_FUNDRAISER_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "Each resource family owns a distinct 404 code rather than sharing one generic ERR_NOT_FOUND, and the code is chosen from the path segment being resolved, not from the acting role or the HTTP verb."
        test_recipe:
          setup:
            - "StateProfile CA and one ProfessionalFundraiser, so the acting FundraiserAgent identity resolves; no contracts, promotions, documents, extension requests or enforcement actions exist."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, fundraiser_bond_minimum_cents: 2500000 }
              as: SystemAdmin
            - call: "POST /professional-fundraisers"
              payload: { legal_name: "Northline Donor Services", fundraiser_type: "PROFESSIONAL_SOLICITOR", bond_amount_cents: 2500000, bond_expires_at: "2028-12-31T00:00:00Z" }
              as: SystemAdmin
              captures: { pf_id: $.data.id }
          trigger:
            - call: "POST /enforcement-actions/00000000-0000-0000-0000-000000000001/remediate"
              payload: { remediation_note: "Answering a notice that does not exist." }
              as: ComplianceOfficer
              captures: { err_action: $.data.error_id }
            - call: "POST /fundraising-contracts/00000000-0000-0000-0000-000000000002/file"
              payload: {}
              as: FundraiserAgent
              as_user_id: "${pf_id}"
              captures: { err_contract: $.data.error_id }
            - call: "POST /coventure-promotions/00000000-0000-0000-0000-000000000003/activate"
              payload: {}
              as: ComplianceOfficer
              captures: { err_promotion: $.data.error_id }
            - call: "POST /extension-requests/00000000-0000-0000-0000-000000000004/decide"
              payload: { decision: "GRANT" }
              as: StateRegulator
              captures: { err_extension: $.data.error_id }
            - call: "GET /registration-documents/00000000-0000-0000-0000-000000000005"
              payload: {}
              as: ComplianceOfficer
              captures: { err_document: $.data.error_id }
            - call: "GET /professional-fundraisers/00000000-0000-0000-0000-000000000006"
              payload: {}
              as: ComplianceOfficer
              captures: { err_fundraiser: $.data.error_id }
          assert:
            - "${err_action} == ERR_ENFORCEMENT_ACTION_NOT_FOUND"
            - "${err_contract} == ERR_CONTRACT_NOT_FOUND"
            - "${err_promotion} == ERR_PROMOTION_NOT_FOUND"
            - "${err_extension} == ERR_EXTENSION_REQUEST_NOT_FOUND"
            - "${err_document} == ERR_REGISTRATION_DOCUMENT_NOT_FOUND"
            - "${err_fundraiser} == ERR_FUNDRAISER_NOT_FOUND"
            - "every response.http_status == 404"

      - name: second_active_registration_for_the_same_state_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=33]
          - errors[ERR_DUPLICATE_FUNDRAISER_REGISTRATION]
        distinguishing_aspect: "The uniqueness key is (fundraiser_id, state_code) restricted to ACTIVE rows, so a second CA registration with a larger bond and a later expiry is still refused 409 while the firm's first CA registration remains ACTIVE."
        test_recipe:
          setup:
            - "StateProfile CA with fundraiser_bond_minimum_cents 2500000; a PROFESSIONAL_SOLICITOR holding an ACTIVE CA registration."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, fundraiser_bond_minimum_cents: 2500000 }
              as: SystemAdmin
            - call: "POST /professional-fundraisers"
              payload: { legal_name: "Northline Donor Services", fundraiser_type: "PROFESSIONAL_SOLICITOR", bond_amount_cents: 5000000, bond_expires_at: "2028-12-31T00:00:00Z" }
              as: SystemAdmin
              captures: { pf_id: $.data.id }
            - call: "POST /fundraiser-registrations"
              payload: { fundraiser_id: "${pf_id}", state_code: "CA", bond_on_file_cents: 2500000, expires_at: "2027-12-31T00:00:00Z" }
              as: FundraiserAgent
              as_user_id: "${pf_id}"
              captures: { fr_id: $.data.id }
          trigger:
            - call: "POST /fundraiser-registrations"
              payload: { fundraiser_id: "${pf_id}", state_code: "CA", bond_on_file_cents: 4000000, expires_at: "2028-06-30T00:00:00Z" }
              as: FundraiserAgent
              as_user_id: "${pf_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "${err_id} == ERR_DUPLICATE_FUNDRAISER_REGISTRATION"
            - "FundraiserRegistration.${fr_id}.status == ACTIVE"
            - "FundraiserRegistration.${fr_id}.bond_on_file_cents == 2500000"

      - name: remediating_a_vacated_action_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_ENFORCEMENT_STATE]
          - state_machines.EnforcementAction.terminal_states
        distinguishing_aspect: "VACATED is terminal for the enforcement machine, so remediate is refused 409 at priority 10 even though the cure window is still open at priority 25 — the state check runs first and the vacated penalty stays out of the ledger."
        test_recipe:
          setup:
