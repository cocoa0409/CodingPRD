        distinguishing_aspect: >-
          Declining is a compensation edge that has to unwind three things at once in a single call:
          the foreign deposit goes RESERVED -> BANKED, the request goes MATCHED -> WAITLISTED with
          matched_deposit_id and matched_hold_expires_at cleared, and decline_count increments, which
          costs the member 5 priority points on the next pass. The frozen settlement_power must
          survive the decline — it is not recomputed when the deposit returns to the pool.
