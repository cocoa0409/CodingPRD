  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: payout_retry_wrong_state_beats_threshold
        grounds:
          - "validations[priority=6]"
          - "validations[priority=24]"
          - state_machines.Payout
        distinguishing_aspect: |
          Error-category pair {state, business_fiscal}: RETRY on a CANCELLED (terminal) payout
