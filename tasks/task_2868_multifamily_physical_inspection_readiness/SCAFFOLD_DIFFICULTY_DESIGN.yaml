  - rule_id: priority_pair_validation_conflict
    instances:
      - name: score_rejected_with_life_threatening_error_not_access_not_recorded
        grounds:
          - validations[priority=32]
          - validations[priority=61]
          - errors[ERR_LIFE_THREATENING_UNCORRECTED]
          - errors[ERR_ACCESS_NOT_RECORDED]
          - state_machines.Inspection.IN_PROGRESS_to_SCORED
        distinguishing_aspect: |
          Scoring is blocked twice over: unit 102's ACTIVE selection is still merely NOTIFIED
          (priority 61, business_constraint, ERR_ACCESS_NOT_RECORDED) and unit 101 carries an
          OPEN LIFE_THREATENING deficiency (priority 32, business_safety,
          ERR_LIFE_THREATENING_UNCORRECTED). Both are 409s on the same call, so only the
          priority ladder decides: the life-threatening safety rule at 32 must win and the
          access rule at 61 must not surface.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026 standard with LT_GAS."
            - "Property Maple Court (total_unit_count 4) with units 101 and 102 both drawn and both noticed, so the inspection reaches IN_PROGRESS."
            - "Access is recorded GRANTED for unit 101 only; unit 102's ACTIVE selection stays at access_status NOTIFIED, violating priority 61."
            - "An LT_GAS deficiency is recorded on unit 101 and never corrected, violating priority 32."
