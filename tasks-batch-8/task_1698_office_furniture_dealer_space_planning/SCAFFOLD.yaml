    path: "/api/install-events"
    description: "Schedule an install or reconfiguration event (TENTATIVE); crew overlap incl. buffer checked against CONFIRMED/IN_PROGRESS events"
    roles: [ProjectManager]
    code: 201
    input: [order_id, crew_id, kind, scheduled_date, start_minute, end_minute, "labor_hours_estimated?", "asset_moves?"]
    output: InstallEvent
    side_effects: ["status=TENTATIVE; after_hours computed; ERR_ORDER_NOT_ACKNOWLEDGED unless order ACKNOWLEDGED or DELIVERED; ERR_CREW_OVERLAP / ERR_CREW_NOT_ACTIVE as applicable; ERR_INVALID_DATE_RANGE if end_minute <= start_minute"]

  - method: GET
    path: "/api/install-events"
    description: "List install events"
    roles: [DealerAdmin, AccountExecutive, ContractsOfficer, Designer, ClientApprover, ProjectManager, WarehouseLead, ClaimsCoordinator, ManufacturerRep, LiquidationAppraiser, FinanceManager]
    code: 200
    input: ["order_id?", "crew_id?", "scheduled_date?", "status?", "limit?", "offset?"]
    output: "InstallEvent[]"
    side_effects: []

  - method: GET
    path: "/api/install-events/{id}"
    description: "Get an install event"
    roles: [DealerAdmin, AccountExecutive, ContractsOfficer, Designer, ClientApprover, ProjectManager, WarehouseLead, ClaimsCoordinator, ManufacturerRep, LiquidationAppraiser, FinanceManager]
    code: 200
    input: []
    output: InstallEvent
    side_effects: []

  - method: POST
    path: "/api/install-events/{id}/confirm"
    description: "Confirm a TENTATIVE event (re-checks crew overlap incl. buffer)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: InstallEvent
    side_effects: ["status -> CONFIRMED; install_posture recomputed"]

  - method: POST
    path: "/api/install-events/{id}/unconfirm"
    description: "Return a CONFIRMED event to TENTATIVE (reschedule loop)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: InstallEvent
    side_effects: ["status -> TENTATIVE; install_posture recomputed"]

  - method: POST
    path: "/api/install-events/{id}/start"
    description: "Start a CONFIRMED event"
    roles: [ProjectManager]
    code: 200
    input: []
    output: InstallEvent
    side_effects: ["status -> IN_PROGRESS; ERR_ORDER_BLOCKED when install_posture == BLOCKED"]

  - method: POST
    path: "/api/install-events/{id}/complete"
    description: "Complete an event; computes labor cost; applies reconfiguration asset moves"
    roles: [ProjectManager]
    code: 200
    input: [labor_hours_actual]
    output: InstallEvent
    side_effects: ["status -> COMPLETED; labor_cost_cents computed; asset moves applied (ERR_ASSET_NOT_MOVABLE); order may auto-advance to INSTALLED"]

  - method: POST
    path: "/api/install-events/{id}/cancel"
    description: "Cancel a TENTATIVE or CONFIRMED event"
    roles: [ProjectManager]
    code: 200
    input: []
    output: InstallEvent
    side_effects: ["status -> CANCELLED; install_posture recomputed"]

  # --- StagingReservation (warehouse receipt & staging) ---
  - method: POST
    path: "/api/staging-reservations"
    description: "Reserve staging space for an order line over an inclusive date range; aggregate capacity checked per day"
    roles: [ProjectManager]
    code: 201
    input: [order_line_id, units, start_date, end_date]
    output: StagingReservation
    side_effects: ["status=RESERVED; ERR_ORDER_NOT_ACKNOWLEDGED unless line status == ACKNOWLEDGED or line is_replacement == true; ERR_CAPACITY_EXCEEDED on per-day overflow; ERR_INVALID_DATE_RANGE if end_date < start_date"]

  - method: GET
    path: "/api/staging-reservations"
    description: "List staging reservations"
    roles: [DealerAdmin, AccountExecutive, ContractsOfficer, Designer, ClientApprover, ProjectManager, WarehouseLead, ClaimsCoordinator, ManufacturerRep, LiquidationAppraiser, FinanceManager]
    code: 200
    input: ["order_line_id?", "status?", "limit?", "offset?"]
    output: "StagingReservation[]"
    side_effects: []

  - method: GET
    path: "/api/staging-reservations/{id}"
    description: "Get a staging reservation"
    roles: [DealerAdmin, AccountExecutive, ContractsOfficer, Designer, ClientApprover, ProjectManager, WarehouseLead, ClaimsCoordinator, ManufacturerRep, LiquidationAppraiser, FinanceManager]
    code: 200
    input: []
    output: StagingReservation
    side_effects: []

  - method: POST
    path: "/api/staging-reservations/{id}/receive"
    description: "Receive units into staging; DAMAGED condition auto-creates a warehouse punch item"
    roles: [WarehouseLead]
    code: 200
    input: [received_units, condition]
    output: StagingReservation
    side_effects: ["status -> OCCUPIED; received_units tracked; line.received_units recomputed; DAMAGED -> auto PunchItem(source=WAREHOUSE); full receipt bubbles line -> RECEIVED and possibly order -> DELIVERED"]

  - method: POST
    path: "/api/staging-reservations/{id}/release"
    description: "Release staged units to the site"
    roles: [WarehouseLead]
    code: 200
    input: []
    output: StagingReservation
    side_effects: ["status -> RELEASED; occupancy freed"]

  - method: POST
    path: "/api/staging-reservations/{id}/cancel"
    description: "Cancel a RESERVED reservation"
    roles: [ProjectManager]
    code: 200
    input: []
    output: StagingReservation
    side_effects: ["status -> CANCELLED; occupancy freed"]

  # --- PunchItem & ManufacturerClaim ---
  - method: POST
    path: "/api/punch-items"
    description: "Open a punch/deficiency item on an order"
    roles: [ProjectManager]
    code: 201
    input: [order_id, severity, description, "order_line_id?", "install_event_id?", "affected_units?"]
    output: PunchItem
    side_effects: ["status=OPEN; source=INSTALL; CRITICAL severity recomputes install_posture to BLOCKED; ERR_INVALID_STATE if the order is CANCELLED or CLOSED"]

  - method: GET
    path: "/api/punch-items"
    description: "List punch items"
    roles: [DealerAdmin, AccountExecutive, ContractsOfficer, Designer, ClientApprover, ProjectManager, WarehouseLead, ClaimsCoordinator, ManufacturerRep, LiquidationAppraiser, FinanceManager]
    code: 200
    input: ["order_id?", "order_line_id?", "install_event_id?", "status?", "severity?", "limit?", "offset?"]
    output: "PunchItem[]"
    side_effects: []

  - method: GET
    path: "/api/punch-items/{id}"
    description: "Get a punch item"
    roles: [DealerAdmin, AccountExecutive, ContractsOfficer, Designer, ClientApprover, ProjectManager, WarehouseLead, ClaimsCoordinator, ManufacturerRep, LiquidationAppraiser, FinanceManager]
    code: 200
    input: []
    output: PunchItem
    side_effects: []

  - method: POST
    path: "/api/punch-items/{id}/ready_for_verify"
    description: "Mark remediation work ready for verification"
    roles: [ProjectManager]
    code: 200
    input: []
    output: PunchItem
    side_effects: ["status -> READY_FOR_VERIFY"]

  - method: POST
    path: "/api/punch-items/{id}/verify"
    description: "Verify remediation; failed verification reopens; CRITICAL pass auto-creates a claim and sets the series quality hold"
    roles: [ClaimsCoordinator]
    code: 200
    input: [passed]
    output: PunchItem
    side_effects: ["passed=true -> VERIFIED (+ CRITICAL cascade: auto ManufacturerClaim DRAFT, series quality_hold=true); passed=false -> OPEN"]

  - method: POST
    path: "/api/punch-items/{id}/close"
    description: "Close a VERIFIED punch item once its claims are terminal"
    roles: [ProjectManager]
    code: 200
    input: []
    output: PunchItem
    side_effects: ["status -> CLOSED; ERR_CLAIM_NOT_SETTLED while any linked claim is non-terminal; install_posture recomputed"]

  - method: POST
    path: "/api/manufacturer-claims"
    description: "File a claim against the manufacturer for a VERIFIED punch item"
    roles: [ClaimsCoordinator]
    code: 201
    input: [punch_item_id, claim_type, remedy_requested, claimed_amount_cents]
    output: ManufacturerClaim
    side_effects: ["status=DRAFT; series_id derived from punch item's order line; ERR_PUNCH_NOT_VERIFIED unless punch VERIFIED"]

  - method: GET
    path: "/api/manufacturer-claims"
    description: "List manufacturer claims"
    roles: [DealerAdmin, AccountExecutive, ContractsOfficer, Designer, ClientApprover, ProjectManager, WarehouseLead, ClaimsCoordinator, ManufacturerRep, LiquidationAppraiser, FinanceManager]
    code: 200
    input: ["punch_item_id?", "series_id?", "replacement_order_line_id?", "status?", "limit?", "offset?"]
    output: "ManufacturerClaim[]"
    side_effects: []

  - method: GET
    path: "/api/manufacturer-claims/{id}"
    description: "Get a manufacturer claim"
    roles: [DealerAdmin, AccountExecutive, ContractsOfficer, Designer, ClientApprover, ProjectManager, WarehouseLead, ClaimsCoordinator, ManufacturerRep, LiquidationAppraiser, FinanceManager]
    code: 200
    input: []
    output: ManufacturerClaim
    side_effects: []

  - method: POST
    path: "/api/manufacturer-claims/{id}/submit"
    description: "Submit a claim to the manufacturer"
    roles: [ClaimsCoordinator]
    code: 200
    input: []
    output: ManufacturerClaim
    side_effects: ["status -> SUBMITTED"]

  - method: POST
    path: "/api/manufacturer-claims/{id}/acknowledge"
    description: "Manufacturer acknowledges a claim"
    roles: [ManufacturerRep]
    code: 200
    input: []
    output: ManufacturerClaim
    side_effects: ["status -> ACKNOWLEDGED"]

  - method: POST
    path: "/api/manufacturer-claims/{id}/offer_settlement"
    description: "Manufacturer offers a settlement amount"
    roles: [ManufacturerRep]
    code: 200
    input: [settlement_amount_cents]
    output: ManufacturerClaim
    side_effects: ["status -> SETTLEMENT_OFFERED; settlement_amount_cents recorded"]

  - method: POST
    path: "/api/manufacturer-claims/{id}/accept_settlement"
    description: "Accept the settlement; REPLACE remedy spawns a replacement line cascade; CREDIT remedy credits the customer ledger"
    roles: [ClaimsCoordinator]
    code: 200
    input: []
    output: ManufacturerClaim
    side_effects: ["status -> SETTLED; settled_amount_cents recorded; REPLACE -> replacement OrderLine -> order totals/promised_date recompute -> affected CONFIRMED events -> TENTATIVE; CREDIT -> customer credit ledger += settled_amount_cents"]

  - method: POST
    path: "/api/manufacturer-claims/{id}/counter"
    description: "Counter the offer; returns the claim to SUBMITTED (negotiation cycle)"
    roles: [ClaimsCoordinator]
    code: 200
    input: []
    output: ManufacturerClaim
    side_effects: ["status -> SUBMITTED; settlement_amount_cents cleared"]

  - method: POST
    path: "/api/manufacturer-claims/{id}/deny"
    description: "Manufacturer denies the claim"
    roles: [ManufacturerRep]
    code: 200
    input: []
    output: ManufacturerClaim
    side_effects: ["status -> DENIED"]

  - method: POST
    path: "/api/manufacturer-claims/{id}/withdraw"
    description: "Withdraw a claim before settlement"
    roles: [ClaimsCoordinator]
    code: 200
    input: []
    output: ManufacturerClaim
    side_effects: ["status -> WITHDRAWN"]

  # --- AssetTag (asset inventory / reconfiguration service) ---
  - method: POST
    path: "/api/asset-tags"
    description: "Register a tagged customer asset"
    roles: [AccountExecutive]
    code: 201
    input: [customer_id, description, condition, current_location, source, "series_id?"]
    output: AssetTag
    side_effects: ["status = IN_SERVICE if source == PURCHASED else IN_STORAGE"]

  - method: GET
    path: "/api/asset-tags"
    description: "List asset tags"
    roles: [DealerAdmin, AccountExecutive, ContractsOfficer, Designer, ClientApprover, ProjectManager, WarehouseLead, ClaimsCoordinator, ManufacturerRep, LiquidationAppraiser, FinanceManager]
    code: 200
    input: ["customer_id?", "series_id?", "status?", "limit?", "offset?"]
    output: "AssetTag[]"
    side_effects: []

  - method: GET
    path: "/api/asset-tags/{id}"
    description: "Get an asset tag"
    roles: [DealerAdmin, AccountExecutive, ContractsOfficer, Designer, ClientApprover, ProjectManager, WarehouseLead, ClaimsCoordinator, ManufacturerRep, LiquidationAppraiser, FinanceManager]
    code: 200
    input: []
    output: AssetTag
    side_effects: []

  - method: POST
    path: "/api/asset-tags/{id}/dispose"
    description: "Dispose of an asset"
    roles: [AccountExecutive]
    code: 200
    input: []
    output: AssetTag
    side_effects: ["status -> DISPOSED"]

  # --- LiquidationLot (used/liquidation credit) ---
  - method: POST
    path: "/api/liquidation-lots"
    description: "Offer a used-furniture lot; provisional credit estimate computed (assumes grade B with haircut)"
    roles: [AccountExecutive]
    code: 201
    input: [customer_id, description, item_count]
    output: LiquidationLot
    side_effects: ["status=OFFERED; estimated_credit_cents computed per liquidation_credit_valuation (estimated variant)"]

  - method: GET
    path: "/api/liquidation-lots"
    description: "List liquidation lots"
    roles: [DealerAdmin, AccountExecutive, ContractsOfficer, Designer, ClientApprover, ProjectManager, WarehouseLead, ClaimsCoordinator, ManufacturerRep, LiquidationAppraiser, FinanceManager]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: "LiquidationLot[]"
    side_effects: []

  - method: GET
    path: "/api/liquidation-lots/{id}"
    description: "Get a liquidation lot"
    roles: [DealerAdmin, AccountExecutive, ContractsOfficer, Designer, ClientApprover, ProjectManager, WarehouseLead, ClaimsCoordinator, ManufacturerRep, LiquidationAppraiser, FinanceManager]
    code: 200
    input: []
    output: LiquidationLot
    side_effects: []

  - method: POST
    path: "/api/liquidation-lots/{id}/appraise"
    description: "Appraise (or re-appraise, superseding) a lot (OCC-guarded)"
    roles: [LiquidationAppraiser]
    code: 200
    input: [condition_grade, appraised_value_cents, expected_lot_version]
    output: LiquidationLot
    side_effects: ["ERR_STALE_VERSION (412) if expected_lot_version != current version; status OFFERED/APPRAISED -> APPRAISED; appraised_at = current UTC date; appraised_by_user_id recorded; increments LiquidationLot.version by 1"]

  - method: POST
    path: "/api/liquidation-lots/{id}/issue_credit"
    description: "Issue final credit for an APPRAISED lot; SoD: issuer must differ from appraiser"
    roles: [FinanceManager]
    code: 200
    input: []
    output: LiquidationLot
    side_effects: ["status -> CREDIT_ISSUED; final_credit_cents computed (final variant); customer credit ledger credited"]

  - method: POST
    path: "/api/liquidation-lots/{id}/redeem"
    description: "Administratively redeem a CREDIT_ISSUED lot; any unredeemed remainder is forfeited"
    roles: [FinanceManager]
    code: 200
    input: []
    output: LiquidationLot
    side_effects: ["status -> REDEEMED; forfeited remainder debited from customer credit ledger"]

  - method: POST
    path: "/api/liquidation-lots/{id}/decline"
    description: "Customer declines the offer before credit issuance"
    roles: [AccountExecutive]
    code: 200
    input: []
    output: LiquidationLot
    side_effects: ["status -> DECLINED"]

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not listed for this endpoint" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties breached: contract activator == creator, or credit issuer == lot appraiser" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum value, non-positive quantity/amount, unknown option code" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "end before start (contract effective window, staging dates, event minutes)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is in a state from which the requested transition does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match the parent's current version on amend/appraise" }
  - { id: ERR_CUSTOMER_NOT_ACTIVE, http: 409, condition: "Customer is CREDIT_HOLD or CLOSED where ACTIVE is required (order create/submit, close preconditions)" }
  - { id: ERR_CUSTOMER_NOT_SETTLED, http: 409, condition: "Customer close blocked by nonzero credit balance or open orders" }
  - { id: ERR_CONTRACT_NOT_EFFECTIVE, http: 409, condition: "Contract not ACTIVE, outside [effective_from, effective_to], or pinned contract version superseded at acknowledge" }
  - { id: ERR_CONTRACT_PRICING_VIOLATION, http: 422, condition: "A tier/default discount exceeds MAX_DISCOUNT_PCT (55) at activate, or a resolved line discount violates it at submit" }
  - { id: ERR_PLAN_NOT_APPROVED, http: 409, condition: "Space plan is not APPROVED (order submit/acknowledge)" }
  - { id: ERR_PLAN_SUPERSEDED, http: 409, condition: "Space plan SUPERSEDED, or pinned plan version stale at acknowledge" }
  - { id: ERR_TYPICAL_PLAN_MISMATCH, http: 409, condition: "Line's typical_id does not belong to the order's space plan" }
  - { id: ERR_SERIES_DISCONTINUED, http: 409, condition: "Order line references a DISCONTINUED series" }
  - { id: ERR_SERIES_ON_QUALITY_HOLD, http: 409, condition: "Order line references a series with quality_hold = true" }
  - { id: ERR_DUPLICATE_REFERENCE, http: 409, condition: "Uniqueness violation: customer external_ref per dealership, typical code per plan, series_code per dealership" }
  - { id: ERR_ORDER_NOT_ACKNOWLEDGED, http: 409, condition: "Staging reservation or install event created before the order reached ACKNOWLEDGED" }
  - { id: ERR_ORDER_BLOCKED, http: 409, condition: "Install event start blocked: install_posture == BLOCKED by an unresolved CRITICAL punch item" }
  - { id: ERR_ORDER_HAS_OPEN_PUNCH, http: 409, condition: "Order close blocked by a punch item not yet CLOSED" }
  - { id: ERR_INSTALL_NOT_COMPLETE, http: 409, condition: "Order close blocked: install_posture != COMPLETE" }
  - { id: ERR_CLAIM_NOT_SETTLED, http: 409, condition: "Punch close blocked by a linked claim that is not SETTLED/DENIED/WITHDRAWN" }
  - { id: ERR_PUNCH_NOT_VERIFIED, http: 409, condition: "Manual claim creation requires the punch item in VERIFIED" }
  - { id: ERR_CREW_NOT_ACTIVE, http: 409, condition: "Install event create/confirm on a SUSPENDED crew" }
  - { id: ERR_CREW_OVERLAP, http: 409, condition: "Event window collides with a CONFIRMED/IN_PROGRESS event on the same crew and date once the turnover buffer is applied" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Per-day aggregate staging occupancy would exceed dealership.staging_capacity_units" }
  - { id: ERR_OVER_RECEIPT, http: 409, condition: "Receive would exceed reservation units or the line's remaining unreceived quantity" }
  - { id: ERR_ASSET_NOT_MOVABLE, http: 409, condition: "Reconfiguration move references a DISPOSED asset" }
  - { id: ERR_CREDIT_CAP_EXCEEDED, http: 422, condition: "apply_credit amount would push credit_applied_cents beyond credit_cap_pct of (total_net + install_fee)" }
  - { id: ERR_INSUFFICIENT_CREDIT, http: 422, condition: "apply_credit amount exceeds the customer's available credit ledger balance" }

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: DealerAdmin
    description: "Dealership administrator: owns catalog, crews, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/dealerships"
      - "POST /api/_clock/set_current_utc"
      - "POST /api/product-series; POST /api/product-series/{id}/discontinue; POST /api/product-series/{id}/clear_quality_hold"
      - "POST /api/crews; POST /api/crews/{id}/suspend; POST /api/crews/{id}/activate"
    shared_operations: ["all GET endpoints"]

  - name: AccountExecutive
    description: "Seller-side account owner: customers, contracts (draft), orders, asset registry, liquidation offers"
    identity: opaque
    exclusive_operations:
      - "POST /api/customers; POST /api/customers/{id}/hold; POST /api/customers/{id}/release_hold; POST /api/customers/{id}/close"
      - "POST /api/pricing-contracts"
      - "POST /api/project-orders; POST /api/project-orders/{id}/submit; POST /api/project-orders/{id}/revise; POST /api/project-orders/{id}/cancel"
      - "POST /api/order-lines; POST /api/order-lines/{id}/cancel"
      - "POST /api/asset-tags; POST /api/asset-tags/{id}/dispose"
      - "POST /api/liquidation-lots; POST /api/liquidation-lots/{id}/decline"
    shared_operations: ["all GET endpoints"]

  - name: ContractsOfficer
    description: "Pricing compliance officer: activates/terminates/amends contracts; must not be the contract's creator (SoD)"
    identity: opaque
    exclusive_operations:
      - "POST /api/pricing-contracts/{id}/activate"
      - "POST /api/pricing-contracts/{id}/terminate"
      - "POST /api/pricing-contracts/{id}/amend"
    shared_operations: ["all GET endpoints"]

  - name: Designer
    description: "Space planning: plans and typicals"
    identity: opaque
    exclusive_operations:
      - "POST /api/space-plans; POST /api/space-plans/{id}/submit; POST /api/space-plans/{id}/revise"
      - "POST /api/typicals; PATCH /api/typicals/{id}"
    shared_operations: ["all GET endpoints"]

  - name: ClientApprover
    description: "Customer-side approver for space plans"
    identity: opaque
    exclusive_operations:
      - "POST /api/space-plans/{id}/approve"
    shared_operations: ["all GET endpoints"]

  - name: ProjectManager
    description: "Dealer project manager: install scheduling, staging, punch workflow, order close"
    identity: opaque
    exclusive_operations:
      - "POST /api/install-events and /confirm /unconfirm /start /complete /cancel"
      - "POST /api/staging-reservations; POST /api/staging-reservations/{id}/cancel"
      - "POST /api/punch-items; POST /api/punch-items/{id}/ready_for_verify; POST /api/punch-items/{id}/close"
      - "POST /api/project-orders/{id}/close"
    shared_operations: ["all GET endpoints"]

  - name: WarehouseLead
    description: "Warehouse: receipts into staging and releases to site"
    identity: opaque
    exclusive_operations:
      - "POST /api/staging-reservations/{id}/receive"
      - "POST /api/staging-reservations/{id}/release"
    shared_operations: ["all GET endpoints"]

  - name: ClaimsCoordinator
    description: "Dealer claims desk: verifies punch items, files and negotiates manufacturer claims"
    identity: opaque
    exclusive_operations:
      - "POST /api/punch-items/{id}/verify"
      - "POST /api/manufacturer-claims; POST /api/manufacturer-claims/{id}/submit"
      - "POST /api/manufacturer-claims/{id}/accept_settlement; POST /api/manufacturer-claims/{id}/counter; POST /api/manufacturer-claims/{id}/withdraw"
    shared_operations: ["all GET endpoints"]

  - name: ManufacturerRep
    description: "External manufacturer representative: acknowledges orders, answers claims"
    identity: opaque
    exclusive_operations:
      - "POST /api/project-orders/{id}/acknowledge"
      - "POST /api/manufacturer-claims/{id}/acknowledge; POST /api/manufacturer-claims/{id}/offer_settlement; POST /api/manufacturer-claims/{id}/deny"
    shared_operations: ["all GET endpoints"]

  - name: LiquidationAppraiser
    description: "Used-furniture appraiser; cannot issue credit for a lot they appraised (SoD)"
    identity: opaque
    exclusive_operations:
      - "POST /api/liquidation-lots/{id}/appraise"
    shared_operations: ["all GET endpoints"]

  - name: FinanceManager
    description: "Dealer finance: issues/redeems liquidation credit, applies credit to orders"
    identity: opaque
    exclusive_operations:
      - "POST /api/liquidation-lots/{id}/issue_credit; POST /api/liquidation-lots/{id}/redeem"
      - "POST /api/project-orders/{id}/apply_credit"
    shared_operations: ["all GET endpoints"]
