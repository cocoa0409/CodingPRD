            - "After close-addendum: InterpretationReport.${r1}.status == FINALIZED (cycle closed), addendum_count == 1"
            - "SleepStudy.${st1}.status == REPORT_FINALIZED throughout the addendum cycle"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: adjudication_remediation_recall_depth3
        grounds:
          - state_machines.InterRaterCase.OPEN_to_ADJUDICATED
          - state_machines.ScoringTask.ASSIGNED_to_RECALLED
          - calculations.inter_rater_agreement
        distinguishing_aspect: |
          Depth-3 cascade from the adjudicate trigger: case ADJUDICATED (non-concordant)
          mutates Scorer.consecutive_nonconcordant (link 1); the counter crossing 2 flips
          Scorer.reliability_status to REMEDIATION (link 2); entering REMEDIATION recalls the
          scorer's open ScoringTasks and reverts their PRIMARY studies to SCORING_QUEUED
          (link 3). Trigger differs from the auth-decision cascade.
        test_recipe:
          setup:
            - "ST1 and ST4: HST studies with ACCEPTED PRIMARY by S1 (REI 10.0) and ACCEPTED RELIABILITY_RESCORE by S2 (REI 3.3)"
            - "ST2: HST study whose PRIMARY task T3 is IN_PROGRESS under S2 (study SCORING_IN_PROGRESS)"
            - "S2 consecutive_nonconcordant == 0, reliability_status PROVISIONAL"
          setup_api_calls:
            - { call: "POST /patients", payload: { mrn: "MRN-D4A-01", full_name: "Pat Seven", date_of_birth: "1976-07-07" }, as: Scheduler, captures: { p1: $.data.id } }
