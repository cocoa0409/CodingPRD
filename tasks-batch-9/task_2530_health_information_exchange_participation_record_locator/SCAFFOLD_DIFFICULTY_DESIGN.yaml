              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pW_id}"
            - call: "POST /hie/participants/${pW_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
              captures: { pW_v3: $.data.version }
            - call: "POST /hie/participants/${pW_id}/data-feeds"
              payload: { feed_type: "ADT", expected_participant_version: "${pW_v3}" }
