# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# task_1009_fine_watch_boutique. Same seven-point contract as §1.8.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------- Entities
  - section: entities
    instances:
      - name: customer_create_success_system_fields
        claim_type: Creation
        grounds:
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: "POST /customers with full_name+email returns 201, store_credit_cents defaults to 0, and system fields id/created_at/version are minted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Amy One", email: "amy@x.com" }
              as: Associate
              captures: { cid: $.data.id, sc: $.data.store_credit_cents, v: $.data.version }
          assert:
            - "Response 201; Customer.store_credit_cents == 0"
            - "Customer.version == 1 and Customer.id is a non-empty UUID"

      - name: watch_create_bad_model_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Watch.fields.model_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /watches whose model_id references no WatchModel returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no models)."]
          setup_api_calls: []
          trigger:
            - call: "POST /watches"
              payload: { model_id: "00000000-0000-0000-0000-000000000000", serial_number: "NF-1", condition_grade: "NEW", list_price_cents: 100000 }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "Returns ERR_NOT_FOUND (unknown model_id)"

      - name: watch_serial_duplicate_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Watch.fields.serial_number
          - validations[priority=5]
          - errors[ERR_SERIAL_DUPLICATE]
        distinguishing_aspect: "Two watches with the same serial_number: the second POST /watches returns ERR_SERIAL_DUPLICATE (409)."
        test_recipe:
          setup: ["One model; one watch with serial DUP-X already created."]
          setup_api_calls:
            - call: "POST /watch-models"
              payload: { brand: "Rolex", reference_number: "R1", display_name: "M1", msrp_cents: 500000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "DUP-X", condition_grade: "NEW", list_price_cents: 500000 }
              as: Associate
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "DUP-X", condition_grade: "MINT", list_price_cents: 500000 }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "Second create returns ERR_SERIAL_DUPLICATE"

      - name: watch_computed_status_and_auth_defaults
        claim_type: System Fields
        grounds:
          - entities.Watch.fields.status
          - entities.Watch.fields.authentication_status
        distinguishing_aspect: "A newly created watch has status=IN_STOCK and authentication_status=UNVERIFIED regardless of any client input; source defaults to PURCHASE."
        test_recipe:
          setup: ["One model."]
          setup_api_calls:
            - call: "POST /watch-models"
              payload: { brand: "Omega", reference_number: "O1", display_name: "M2", msrp_cents: 300000 }
              as: Associate
              captures: { model_id: $.data.id }
          trigger:
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "DF-1", condition_grade: "GOOD", list_price_cents: 320000 }
              as: Associate
              captures: { st: $.data.status, au: $.data.authentication_status, src: $.data.source }
          assert:
            - "Watch.status == IN_STOCK"
            - "Watch.authentication_status == UNVERIFIED"
            - "Watch.source == PURCHASE"

  # ------------------------------------------------------------ State machines
  - section: state_machines
    instances:
      - name: accept_waiting_entry_without_offer_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.WaitlistEntry.OFFERED_to_ALLOCATED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Accepting a WAITING entry that was never offered returns ERR_INVALID_STATE (accept requires OFFERED)."
        test_recipe:
          setup: ["A WAITING waitlist entry on an ACTIVE model."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Bo Two", email: "bo@x.com" }
              as: Associate
              captures: { cid: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "Rolex", reference_number: "R2", display_name: "M3", msrp_cents: 900000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /waitlist-entries"
              payload: { customer_id: "${cid}", model_id: "${model_id}" }
              as: Associate
              captures: { wl_id: $.data.id }
          trigger:
            - call: "POST /waitlist-entries/${wl_id}/accept"
              payload: {}
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "Returns ERR_INVALID_STATE (entry is WAITING, not OFFERED)"

      - name: diagnose_collected_ticket_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ServiceTicket.RECEIVED_to_DIAGNOSED
          - state_machines.ServiceTicket.READY_to_COLLECTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Once a ticket is COLLECTED (terminal), POST /diagnose returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A ticket fully processed to COLLECTED: diagnosed (quote 12000), finished, paid 12000, collected."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: Associate
            - call: "POST /customers"
              payload: { full_name: "Cy Three", email: "cy@x.com" }
              as: Associate
              captures: { cid: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "Tissot", reference_number: "T2", display_name: "M4", msrp_cents: 60000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "TL-1", condition_grade: "GOOD", list_price_cents: 60000 }
              as: Associate
              captures: { watch_id: $.data.id }
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
            - call: "POST /watchmakers"
              payload: { display_name: "Bench T" }
              as: Associate
              captures: { wm_id: $.data.id }
            - call: "POST /service-tickets"
              payload: { watch_id: "${watch_id}", customer_id: "${cid}", watchmaker_id: "${wm_id}", service_type: "BATTERY", appt_start: "2026-07-03T09:00:00Z", appt_end: "2026-07-03T09:30:00Z" }
              as: Associate
              captures: { ticket_id: $.data.id }
            - call: "POST /service-tickets/${ticket_id}/diagnose"
              payload: {}
              as: Watchmaker
              as_user_id: "${wm_id}"
            - call: "POST /service-tickets/${ticket_id}/finish"
              payload: {}
              as: Watchmaker
              as_user_id: "${wm_id}"
            - call: "POST /service-tickets/${ticket_id}/payments"
              payload: { amount_cents: 12000 }
              as: Associate
            - call: "POST /service-tickets/${ticket_id}/collect"
              payload: {}
              as: Associate
          trigger:
            - call: "POST /service-tickets/${ticket_id}/diagnose"
              payload: {}
              as: Watchmaker
              as_user_id: "${wm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Returns ERR_INVALID_STATE (ticket is COLLECTED, terminal)"

      - name: layaway_on_reserved_watch_unavailable
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Watch.IN_STOCK_to_RESERVED
          - validations[priority=16]
          - errors[ERR_WATCH_UNAVAILABLE]
        distinguishing_aspect: "A second layaway plan against an already-RESERVED watch returns ERR_WATCH_UNAVAILABLE (watch not IN_STOCK)."
        test_recipe:
          setup: ["Authenticated watch (list 500000) already reserved by an ACTIVE layaway."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Di Four", email: "di@x.com" }
              as: Associate
              captures: { cid: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "Rolex", reference_number: "R3", display_name: "M5", msrp_cents: 500000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "RS-1", condition_grade: "NEW", list_price_cents: 500000 }
              as: Associate
              captures: { watch_id: $.data.id }
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
            - call: "POST /layaway-plans"
              payload: { customer_id: "${cid}", watch_id: "${watch_id}", deposit_cents: 100000, term_months: 5, first_due_at: "2026-09-01T00:00:00Z" }
              as: Associate
              captures: { plan1: $.data.id }
          trigger:
            - call: "POST /layaway-plans"
              payload: { customer_id: "${cid}", watch_id: "${watch_id}", deposit_cents: 100000, term_months: 5, first_due_at: "2026-09-01T00:00:00Z" }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "Second layaway returns ERR_WATCH_UNAVAILABLE (watch is RESERVED)"

  # -------------------------------------------------------------- Calculations
  - section: calculations
    instances:
      - name: appraisal_insurance_basis_selects_replacement
        claim_type: Variant Selection
        grounds:
          - calculations.appraisal_valuation
          - entities.Appraisal.fields.appraised_value_cents
        distinguishing_aspect: "With valuation_basis=INSURANCE_REPLACEMENT the appraised_value_cents equals replacement_value_cents (1250000), not market (950400)."
        test_recipe:
          setup: ["Model msrp 1000000, market_premium_bps 2500; watch EXCELLENT with box+papers, version 1."]
          setup_api_calls:
            - call: "POST /watch-models"
              payload: { brand: "Rolex", reference_number: "R4", display_name: "M6", msrp_cents: 1000000, market_premium_bps: 2500 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "AP-INS-1", condition_grade: "EXCELLENT", list_price_cents: 1200000, has_box_papers: true }
              as: Associate
              captures: { watch_id: $.data.id, watch_v: $.data.version }
          trigger:
            - call: "POST /watches/${watch_id}/appraisals"
              payload: { purpose: "INSURANCE", valuation_basis: "INSURANCE_REPLACEMENT", expected_watch_version: "${watch_v}" }
              as: Associate
              captures: { appr: $.data.appraised_value_cents, repl: $.data.replacement_value_cents }
          assert:
            - "Appraisal.appraised_value_cents == 1250000"
            - "Appraisal.replacement_value_cents == 1250000"
            - "Appraisal.market_value_cents == 950400"

      - name: layaway_cancellation_refund_minus_restock
        claim_type: Correct Result
        grounds:
          - calculations.layaway_cancellation
          - state_machines.LayawayPlan.ACTIVE_to_CANCELLED
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: "Cancelling an ACTIVE plan (total 400000, paid 80000) refunds paid - round_half_up(0.05*400000)=80000-20000=60000 to store credit; watch returns IN_STOCK."
        test_recipe:
          setup: ["Authenticated watch list 400000 reserved by an ACTIVE layaway with deposit 80000."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ed Five", email: "ed@x.com" }
              as: Associate
              captures: { cid: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "Tudor", reference_number: "T3", display_name: "M7", msrp_cents: 400000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "CN-1", condition_grade: "NEW", list_price_cents: 400000 }
              as: Associate
              captures: { watch_id: $.data.id }
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
            - call: "POST /layaway-plans"
              payload: { customer_id: "${cid}", watch_id: "${watch_id}", deposit_cents: 80000, term_months: 4, first_due_at: "2026-09-01T00:00:00Z" }
              as: Associate
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /layaway-plans/${plan_id}/cancel"
              payload: {}
              as: Associate
              captures: { st: $.data.status }
          assert:
            - "LayawayPlan.status == CANCELLED"
            - "Customer.${cid}.store_credit_cents == 60000"
            - "Watch.${watch_id}.status == IN_STOCK"

  # --------------------------------------------------------------- Validations
  - section: validations
    instances:
      - name: overpayment_on_active_plan_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=19]
          - errors[ERR_OVERPAYMENT]
        distinguishing_aspect: "A payment exceeding remaining balance on an ACTIVE plan (remaining 320000, pay 999999) returns ERR_OVERPAYMENT."
        test_recipe:
          setup: ["Authenticated watch list 400000, ACTIVE layaway deposit 80000 (remaining 320000)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Fi Six", email: "fi@x.com" }
              as: Associate
              captures: { cid: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "Rolex", reference_number: "R5", display_name: "M8", msrp_cents: 400000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "OV-1", condition_grade: "NEW", list_price_cents: 400000 }
              as: Associate
              captures: { watch_id: $.data.id }
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
            - call: "POST /layaway-plans"
              payload: { customer_id: "${cid}", watch_id: "${watch_id}", deposit_cents: 80000, term_months: 4, first_due_at: "2026-09-01T00:00:00Z" }
              as: Associate
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /layaway-plans/${plan_id}/payments"
              payload: { amount_cents: 999999 }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "Returns ERR_OVERPAYMENT (would exceed total_price_cents)"

      - name: duplicate_waitlist_same_model_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=6]
          - errors[ERR_DUPLICATE_WAITLIST]
        distinguishing_aspect: "A customer joining the same model's waitlist twice (while first is WAITING) returns ERR_DUPLICATE_WAITLIST."
        test_recipe:
          setup: ["A customer already WAITING on model M."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Gy Sev", email: "gy@x.com" }
              as: Associate
              captures: { cid: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "Rolex", reference_number: "R6", display_name: "M9", msrp_cents: 900000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /waitlist-entries"
              payload: { customer_id: "${cid}", model_id: "${model_id}" }
              as: Associate
              captures: { wl1: $.data.id }
          trigger:
            - call: "POST /waitlist-entries"
              payload: { customer_id: "${cid}", model_id: "${model_id}" }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "Returns ERR_DUPLICATE_WAITLIST"

      - name: appointment_in_past_rejected
        claim_type: Temporal validation
        grounds:
          - validations[priority=14]
          - errors[ERR_APPOINTMENT_IN_PAST]
        distinguishing_aspect: "With the clock at 2026-07-05, a service ticket whose appt_start is 2026-07-03 (before now) returns ERR_APPOINTMENT_IN_PAST."
        test_recipe:
          setup: ["Authenticated watch, watchmaker, customer; clock advanced to 2026-07-05."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: Associate
            - call: "POST /customers"
              payload: { full_name: "Ha Eig", email: "ha@x.com" }
              as: Associate
              captures: { cid: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "Omega", reference_number: "O2", display_name: "M10", msrp_cents: 500000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "PA-1", condition_grade: "NEW", list_price_cents: 500000 }
              as: Associate
              captures: { watch_id: $.data.id }
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
            - call: "POST /watchmakers"
              payload: { display_name: "Bench P" }
              as: Associate
              captures: { wm_id: $.data.id }
          trigger:
            - call: "POST /service-tickets"
              payload: { watch_id: "${watch_id}", customer_id: "${cid}", watchmaker_id: "${wm_id}", service_type: "BATTERY", appt_start: "2026-07-03T09:00:00Z", appt_end: "2026-07-03T09:30:00Z" }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "Returns ERR_APPOINTMENT_IN_PAST (appt_start before the logical clock)"

      - name: insufficient_store_credit_for_deposit
        claim_type: Aggregate validation
        grounds:
          - validations[priority=18]
          - errors[ERR_INSUFFICIENT_STORE_CREDIT]
          - entities.LayawayPlan.fields.use_store_credit
        distinguishing_aspect: "use_store_credit=true with a 200000 deposit but a 0 store-credit balance returns ERR_INSUFFICIENT_STORE_CREDIT."
        test_recipe:
          setup: ["Customer store_credit_cents=0; authenticated watch list 1000000."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Iz Nin", email: "iz@x.com" }
              as: Associate
              captures: { cid: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "Rolex", reference_number: "R7", display_name: "M11", msrp_cents: 1000000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "SC-1", condition_grade: "NEW", list_price_cents: 1000000 }
              as: Associate
              captures: { watch_id: $.data.id }
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
          trigger:
            - call: "POST /layaway-plans"
              payload: { customer_id: "${cid}", watch_id: "${watch_id}", deposit_cents: 200000, term_months: 8, first_due_at: "2026-09-01T00:00:00Z", use_store_credit: true }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "Returns ERR_INSUFFICIENT_STORE_CREDIT (balance 0 < deposit 200000)"

      - name: create_customer_missing_email_validation
        claim_type: Violation to Error
        grounds:
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /customers omitting the required email field returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "No Email" }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "Returns ERR_VALIDATION (missing required field email)"

  # ----------------------------------------------------------------- Endpoints
  - section: endpoints
    instances:
      - name: offer_with_empty_waitlist_no_eligible
        claim_type: Conditional action
        grounds:
          - state_machines.Watch.IN_STOCK_to_OFFERED
          - validations[priority=15]
          - errors[ERR_NO_ELIGIBLE_WAITLIST]
        distinguishing_aspect: "Offering an authenticated watch whose model has no WAITING entries returns ERR_NO_ELIGIBLE_WAITLIST (empty candidate set)."
        test_recipe:
          setup: ["An authenticated IN_STOCK watch on an allocation_controlled model with zero waitlist entries."]
          setup_api_calls:
            - call: "POST /watch-models"
              payload: { brand: "Patek", reference_number: "P1", display_name: "M12", msrp_cents: 3000000, allocation_controlled: true }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "NE-1", condition_grade: "NEW", list_price_cents: 3000000 }
              as: Associate
              captures: { watch_id: $.data.id }
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
          trigger:
            - call: "POST /watches/${watch_id}/offer"
              payload: {}
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "Returns ERR_NO_ELIGIBLE_WAITLIST (no WAITING entries for the model)"

      - name: consignment_settle_requires_kyc
        claim_type: Conditional action
        grounds:
          - state_machines.TradeInOffer.ACCEPTED_to_SETTLED
          - validations[priority=11]
          - errors[ERR_KYC_REQUIRED]
        distinguishing_aspect: "Settling an ACCEPTED CONSIGNMENT offer for a customer with kyc_verified=false returns ERR_KYC_REQUIRED."
        test_recipe:
          setup: ["Customer kyc_verified=false; an ACCEPTED CONSIGNMENT offer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ky Ten", email: "ky@x.com", kyc_verified: false }
              as: Associate
              captures: { cid: $.data.id }
            - call: "POST /trade-in-offers"
              payload: { customer_id: "${cid}", incoming_brand: "Rolex", incoming_reference: "126610LN", serial_number: "KY-1", est_model_msrp_cents: 1000000, condition_grade: "EXCELLENT", disposition: "CONSIGNMENT", has_box_papers: true }
              as: Associate
              captures: { offer_id: $.data.id }
            - call: "POST /trade-in-offers/${offer_id}/accept"
              payload: {}
              as: Associate
          trigger:
            - call: "POST /trade-in-offers/${offer_id}/settle"
              payload: {}
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "Returns ERR_KYC_REQUIRED (consignment settlement needs kyc_verified)"

      - name: consignment_settle_success_mints_consigned_watch
        claim_type: Computed read
        grounds:
          - state_machines.TradeInOffer.ACCEPTED_to_SETTLED
          - entities.TradeInOffer.fields.resulting_watch_id
          - entities.Customer.fields.store_credit_cents
        distinguishing_aspect: "A KYC-verified CONSIGNMENT settle mints a Watch (source=CONSIGNMENT, status=CONSIGNED), sets resulting_watch_id, and credits 807840 to store credit."
        test_recipe:
          setup: ["Customer kyc_verified=true; ACCEPTED CONSIGNMENT offer (est 1000000, EXCELLENT, box → market 950400, 15% commission)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Lo 11", email: "lo@x.com", kyc_verified: true }
              as: Associate
              captures: { cid: $.data.id }
            - call: "POST /trade-in-offers"
              payload: { customer_id: "${cid}", incoming_brand: "Rolex", incoming_reference: "126610LN", serial_number: "LO-1", est_model_msrp_cents: 1000000, condition_grade: "EXCELLENT", disposition: "CONSIGNMENT", has_box_papers: true }
              as: Associate
              captures: { offer_id: $.data.id, credit: $.data.quoted_credit_cents }
            - call: "POST /trade-in-offers/${offer_id}/accept"
              payload: {}
              as: Associate
          trigger:
            - call: "POST /trade-in-offers/${offer_id}/settle"
              payload: {}
              as: Associate
              captures: { st: $.data.status, rw_id: $.data.resulting_watch_id }
          assert:
            - "TradeInOffer.status == SETTLED and TradeInOffer.quoted_credit_cents == 807840"
            - "Customer.${cid}.store_credit_cents == 807840"
            - "The minted Watch (resulting_watch_id) has status == CONSIGNED and source == CONSIGNMENT"

      - name: list_watches_pagination_envelope
        claim_type: Standard CRUD
        grounds:
          - entities.Watch.fields.status
        distinguishing_aspect: "GET /watches with limit=1 over two watches returns an array envelope with total_count=2 and has_more=true."
        test_recipe:
          setup: ["Two watches on one model."]
          setup_api_calls:
            - call: "POST /watch-models"
              payload: { brand: "Seiko", reference_number: "S1", display_name: "M13", msrp_cents: 50000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "PG-1", condition_grade: "NEW", list_price_cents: 50000 }
              as: Associate
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "PG-2", condition_grade: "NEW", list_price_cents: 50000 }
              as: Associate
          trigger:
            - call: "GET /watches"
              payload: { model_id: "${model_id}", limit: 1, offset: 0 }
              as: Associate
          assert:
            - "response_type == array; meta.total_count == 2; has_more == true; data length == 1"

      - name: provenance_history_after_authenticate
        claim_type: Computed read
        grounds:
          - entities.ProvenanceEvent.fields.event_type
          - state_machines.Watch.UNVERIFIED_to_AUTHENTICATED
        distinguishing_aspect: "GET /watches/{id}/provenance after intake+authenticate returns at least an INTAKE and an AUTHENTICATED event (append-only)."
        test_recipe:
          setup: ["A watch created then authenticated."]
          setup_api_calls:
            - call: "POST /watch-models"
              payload: { brand: "Rolex", reference_number: "R8", display_name: "M14", msrp_cents: 700000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "PV-1", condition_grade: "NEW", list_price_cents: 700000 }
              as: Associate
              captures: { watch_id: $.data.id }
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
          trigger:
            - call: "GET /watches/${watch_id}/provenance"
              payload: {}
              as: Associate
          assert:
            - "response_type == array; the events include event_type INTAKE and event_type AUTHENTICATED for this watch"

  # -------------------------------------------------------------------- Errors
  - section: errors
    instances:
      - name: error_payment_not_complete_stub
        claim_type: Violation to Error
        grounds:
          - errors[ERR_PAYMENT_NOT_COMPLETE]
        excluded_because:
          difficulty_instance: non_linear_state_machine / service_ticket_parallel_status_payment
          rationale: "The READY+UNPAID collect rejection with ERR_PAYMENT_NOT_COMPLETE is asserted as the first trigger of that §1.8 instance."

      - name: error_stale_version_stub
        claim_type: Violation to Error
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[appraisal-create-stale-watch]
        excluded_because:
          difficulty_instance: cross_cutting / occ_stale_expected_watch_version
          rationale: "ERR_STALE_VERSION is the asserted outcome of the OCC corner instance occ_stale_expected_watch_version below (kept in cross_cutting section)."

  # ------------------------------------------------------------------- RBAC
  - section: rbac
    instances:
      - name: diagnose_by_associate_unauthorized
        claim_type: peer_roles
        grounds:
          - roles.Watchmaker
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "POST /service-tickets/{id}/diagnose as Associate (only Watchmaker may) returns ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["A RECEIVED ticket on an authenticated watch."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: Associate
            - call: "POST /customers"
              payload: { full_name: "Ma 12", email: "ma@x.com" }
              as: Associate
              captures: { cid: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "Omega", reference_number: "O3", display_name: "M15", msrp_cents: 500000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "AZ-1", condition_grade: "NEW", list_price_cents: 500000 }
              as: Associate
              captures: { watch_id: $.data.id }
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
            - call: "POST /watchmakers"
              payload: { display_name: "Bench Z" }
              as: Associate
              captures: { wm_id: $.data.id }
            - call: "POST /service-tickets"
              payload: { watch_id: "${watch_id}", customer_id: "${cid}", watchmaker_id: "${wm_id}", service_type: "BATTERY", appt_start: "2026-07-03T09:00:00Z", appt_end: "2026-07-03T09:30:00Z" }
              as: Associate
              captures: { ticket_id: $.data.id }
          trigger:
            - call: "POST /service-tickets/${ticket_id}/diagnose"
              payload: {}
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "Returns ERR_UNAUTHORIZED (diagnose is Watchmaker-exclusive)"

      - name: authenticate_by_client_unauthorized
        claim_type: peer_roles
        grounds:
          - roles.Associate
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "POST /watches/{id}/authenticate as Client (only Associate may) returns ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["A watch and a customer (acting as Client)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ne 13", email: "ne@x.com" }
              as: Associate
              captures: { cid: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "Rolex", reference_number: "R9", display_name: "M16", msrp_cents: 600000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "AU-1", condition_grade: "NEW", list_price_cents: 600000 }
              as: Associate
              captures: { watch_id: $.data.id }
          trigger:
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Client
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "Returns ERR_UNAUTHORIZED (authenticate is Associate-exclusive)"

      - name: create_watch_missing_headers_unauthenticated
        claim_type: peer_roles
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "POST /watches with no X-User-Role/X-User-ID headers returns ERR_UNAUTHENTICATED (401); the test omits the auth headers entirely."
        test_recipe:
          setup: ["One model exists; the create call is sent WITHOUT auth headers."]
          setup_api_calls:
            - call: "POST /watch-models"
              payload: { brand: "Rolex", reference_number: "R10", display_name: "M17", msrp_cents: 600000 }
              as: Associate
              captures: { model_id: $.data.id }
          trigger:
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "UH-1", condition_grade: "NEW", list_price_cents: 600000 }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "With auth headers omitted the request returns ERR_UNAUTHENTICATED (401)"

  # ------------------------------------------------- Cross-cutting layers
  - section: cross_cutting
    instances:
      - name: occ_stale_expected_watch_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[appraisal-create-stale-watch]
          - errors[ERR_STALE_VERSION]
          - entities.Watch.fields.version
        distinguishing_aspect: "A first appraisal with the observed Watch.version succeeds and bumps the version; a second appraisal still carrying that now-stale version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["An authenticated watch (create v1, authenticate v2); watch_v captured = 2."]
          setup_api_calls:
            - call: "POST /watch-models"
              payload: { brand: "Rolex", reference_number: "R11", display_name: "M18", msrp_cents: 1000000, market_premium_bps: 1000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "OCC-1", condition_grade: "MINT", list_price_cents: 1000000 }
              as: Associate
              captures: { watch_id: $.data.id }
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
              captures: { watch_v: $.data.version }
            - call: "POST /watches/${watch_id}/appraisals"
              payload: { purpose: "SALE", valuation_basis: "MARKET", expected_watch_version: "${watch_v}" }
              as: Associate
              captures: { first_ap: $.data.id }
          trigger:
            - call: "POST /watches/${watch_id}/appraisals"
              payload: { purpose: "WARRANTY", valuation_basis: "MARKET", expected_watch_version: "${watch_v}" }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "First appraisal succeeds (expected_watch_version matched, Watch.version bumped to 3)"
            - "Second appraisal with the stale watch_v (2) returns ERR_STALE_VERSION (412)"

      - name: occ_missing_expected_version_required
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[appraisal-create-stale-watch]
          - errors[ERR_VERSION_REQUIRED]
        distinguishing_aspect: "POST /watches/{id}/appraisals omitting expected_watch_version returns ERR_VERSION_REQUIRED (400)."
        test_recipe:
          setup: ["An authenticated watch."]
          setup_api_calls:
            - call: "POST /watch-models"
              payload: { brand: "Rolex", reference_number: "R12", display_name: "M19", msrp_cents: 800000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "OCC-2", condition_grade: "MINT", list_price_cents: 800000 }
              as: Associate
              captures: { watch_id: $.data.id }
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
          trigger:
            - call: "POST /watches/${watch_id}/appraisals"
              payload: { purpose: "SALE", valuation_basis: "MARKET" }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "Returns ERR_VERSION_REQUIRED (expected_watch_version is a required OCC input)"

  # ------------------------------------------------- Consistency model
  - section: consistency_model
    instances:
      - name: layaway_payoff_immediate_fulfillment
        claim_type: immediate
        grounds:
          - state_machines.LayawayPlan.ACTIVE_to_PAID_OFF
          - state_machines.LayawayPlan.PAID_OFF_to_FULFILLED
          - state_machines.Watch.RESERVED_to_SOLD
        distinguishing_aspect: "Paying the full remaining balance in one request immediately reflects status FULFILLED and the reserved Watch SOLD in the same response cycle (immediate consistency)."
        test_recipe:
          setup: ["Authenticated watch list 200000 reserved by an ACTIVE layaway with deposit 200000 (paid 200000 == total, remaining 0 already) — instead use deposit 40000 then pay remaining 160000."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Pa 14", email: "pa@x.com" }
              as: Associate
              captures: { cid: $.data.id }
            - call: "POST /watch-models"
              payload: { brand: "Seiko", reference_number: "S2", display_name: "M20", msrp_cents: 200000 }
              as: Associate
              captures: { model_id: $.data.id }
            - call: "POST /watches"
              payload: { model_id: "${model_id}", serial_number: "PF-1", condition_grade: "NEW", list_price_cents: 200000 }
              as: Associate
              captures: { watch_id: $.data.id }
            - call: "POST /watches/${watch_id}/authenticate"
              payload: {}
              as: Associate
            - call: "POST /layaway-plans"
              payload: { customer_id: "${cid}", watch_id: "${watch_id}", deposit_cents: 40000, term_months: 4, first_due_at: "2026-09-01T00:00:00Z" }
              as: Associate
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /layaway-plans/${plan_id}/payments"
              payload: { amount_cents: 160000 }
              as: Associate
              captures: { st: $.data.status, paid: $.data.paid_cents }
          assert:
            - "LayawayPlan.paid_cents == 200000 and LayawayPlan.status == FULFILLED (immediately)"
            - "Watch.${watch_id}.status == SOLD in the same cycle"
