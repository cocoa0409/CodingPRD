              payload: { loan_id: "${loan}", predecessor_workout_plan_id: "${plan_no_letter}", option: "PAYMENT_DEFERRAL", deferral_months: 3, denominational_support_letter: true, narrative: "Deferral succeeding a plan that was never approved", expected_loan_version: "${loan_v3}" }
