scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: live_vs_underwriting_risk_diverge_on_identical_alert_set
        grounds:
          - calculations.identity_risk_score
          - entities.Subscriber.fields.risk_score
          - entities.Subscriber.fields.underwriting_risk_score
          - state_machines.Alert.NEW_to_ACKNOWLEDGED
        distinguishing_aspect: |
          Dual variant on the Subscriber domain: over the identical alert set, LIVE counts a NEW
          CREDIT_INQUIRY (+8) and an ACKNOWLEDGED DARK_WEB (+15) while UNDERWRITING counts neither,
          so risk_score == 58 and underwriting_risk_score == 35 in the same response.
        test_recipe:
          setup:
            - "One ULTIMATE TRI plan; one verified subscriber (enrollment ACTIVE, monitoring PENDING_DATA)."
            - "Three alerts on that subscriber: an SSN_TRACE acknowledged then confirmed as fraud, a DARK_WEB acknowledged only, and a CREDIT_INQUIRY left in NEW."
            - "No bureau score has been refreshed, so no score-drop term applies; no family members exist."
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "dv1@example.com", full_name: "Dana Vale", date_of_birth: "1985-04-02", ssn_last4: "4321", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "SSN_TRACE", severity: "MEDIUM", source_detail: "SSN seen in ACME breach dump" }
              as: PlatformAdmin
              captures: { a_ssn: $.data.id }
            - call: "POST /idp/alerts/${a_ssn}/acknowledge"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts/${a_ssn}/confirm-fraud"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "DARK_WEB", severity: "LOW", source_detail: "email+password pair on paste site" }
              as: PlatformAdmin
              captures: { a_dw: $.data.id }
            - call: "POST /idp/alerts/${a_dw}/acknowledge"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "CREDIT_INQUIRY", severity: "LOW", source_detail: "hard pull by Zenith Auto" }
              as: PlatformAdmin
          trigger:
            - call: "GET /idp/subscribers/${sub_id}/credit-summary"
              payload: {}
              as: PlatformAdmin
              captures: { live: $.data.risk_score, uw: $.data.underwriting_risk_score }
          assert:
            - "Subscriber.${sub_id}.risk_score == 58"
            - "Subscriber.${sub_id}.underwriting_risk_score == 35"
            - "credit-summary.risk_score == 58 and credit-summary.underwriting_risk_score == 35 in one and the same response body"
            - "Subscriber.${sub_id}.composite_credit_score == null"

      - name: claim_provisional_vs_final_diverge_on_identical_expenses
        grounds:
          - calculations.claim_reimbursement
          - entities.InsuranceClaim.fields.provisional_amount_cents
          - entities.InsuranceClaim.fields.approved_cents
          - state_machines.InsuranceClaim.DRAFT_to_SUBMITTED
          - state_machines.InsuranceClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Dual variant on the InsuranceClaim domain (a different entity domain from the Subscriber
          risk instance): the identical six-line expense array yields provisional_amount_cents == 382003
          at submit (undocumented CHILDCARE credited at 0.50) and approved_cents == 374503 at approve
          (undocumented credited at 0.00) — a 18500-cent divergence on the same row.
        test_recipe:
          setup:
            - "ULTIMATE TRI plan with insurance_limit_cents = 500000; verified subscriber."
            - "One SSN_TRACE alert acknowledged and confirmed as fraud, producing a RestorationCase."
            - "A TIER2 specialist assigned to that case; an engagement booked (case -> IN_PROGRESS); the case then RESOLVED."
            - "A DRAFT claim on the resolved case carrying six expenses: LEGAL_FEES 120000 documented, LOST_WAGES 333333 documented, TRAVEL 4501 documented, TRAVEL 4501 documented, CHILDCARE 30001 UNdocumented, NOTARY 2501 documented."
            - "Claim submitted (PROVISIONAL variant already written)."
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "dv2@example.com", full_name: "Cyrus Ng", date_of_birth: "1979-11-30", ssn_last4: "8812", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /idp/specialists"
              payload: { full_name: "Rae Okonkwo", tier: "TIER2", max_caseload: 3, max_concurrent_engagements: 1 }
              as: PlatformAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "SSN_TRACE", severity: "MEDIUM", source_detail: "tax return filed with subscriber SSN" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /idp/alerts/${a_id}/acknowledge"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts/${a_id}/confirm-fraud"
              payload: {}
              as: PlatformAdmin
            - call: "GET /idp/restoration-cases"
              payload: { origin_alert_id: "${a_id}" }
              as: PlatformAdmin
              captures: { case_id: "$.data[0].id" }
            - call: "POST /idp/restoration-cases/${case_id}/assign"
              payload: { specialist_id: "${sp_id}" }
              as: PlatformAdmin
            - call: "GET /idp/specialists/${sp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { sp_v: $.data.version }
            - call: "POST /idp/specialist-engagements"
              payload: { specialist_id: "${sp_id}", case_id: "${case_id}", window_start: "2026-05-10T09:00:00Z", window_end: "2026-05-10T11:00:00Z", expected_specialist_version: "${sp_v}" }
              as: PlatformAdmin
            - call: "POST /idp/restoration-cases/${case_id}/resolve"
              payload: { resolution_summary: "Fraudulent return withdrawn; IRS PIN issued." }
              as: RestorationSpecialist
              as_user_id: "${sp_id}"
            - call: "GET /idp/restoration-cases/${case_id}"
              payload: {}
              as: PlatformAdmin
              captures: { case_v: $.data.version }
            - call: "POST /idp/insurance-claims"
              payload:
                case_id: "${case_id}"
                expected_case_version: "${case_v}"
                expenses:
                  - { category: "LEGAL_FEES", amount_cents: 120000, documented: true }
                  - { category: "LOST_WAGES", amount_cents: 333333, documented: true }
                  - { category: "TRAVEL", amount_cents: 4501, documented: true }
                  - { category: "TRAVEL", amount_cents: 4501, documented: true }
                  - { category: "CHILDCARE", amount_cents: 30001, documented: false }
                  - { category: "NOTARY", amount_cents: 2501, documented: true }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /idp/insurance-claims/${claim_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
          trigger:
            - call: "POST /idp/insurance-claims/${claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adjuster-001"
          assert:
            - "InsuranceClaim.${claim_id}.provisional_amount_cents == 382003"
            - "InsuranceClaim.${claim_id}.approved_cents == 374503"
            - "InsuranceClaim.${claim_id}.approved_cents != InsuranceClaim.${claim_id}.provisional_amount_cents"
            - "InsuranceClaim.${claim_id}.status == APPROVED"
            - "InsuranceClaim.${claim_id}.approved_by_user_id == 'adjuster-001'"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: claim_rounding_pinned_round_per_expense_then_sum
        grounds:
          - calculations.claim_reimbursement
          - entities.InsuranceClaim.fields.expenses
          - entities.InsuranceClaim.fields.approved_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. Two TRAVEL line items of 4501 cents at
          COVERAGE_PCT 0.50 each round_half_up to 2251, summing to 4502; the forbidden sum-then-round
          order gives round_half_up(9002 * 0.50) = 4501. approved_cents is therefore 374503, and 374502
          is the wrong-order answer.
        test_recipe:
          setup:
            - "Same plan / subscriber / resolved-case chain as the dual-variant claim instance, insurance_limit_cents = 500000."
            - "DRAFT claim carrying two TRAVEL expenses of exactly 4501 cents each (both documented), plus LEGAL_FEES 120000, LOST_WAGES 333333, CHILDCARE 30001 undocumented, NOTARY 2501."
            - "Claim SUBMITTED."
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "cf1@example.com", full_name: "Iris Pham", date_of_birth: "1990-02-14", ssn_last4: "1199", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /idp/specialists"
              payload: { full_name: "Ken Marsh", tier: "TIER2", max_caseload: 3, max_concurrent_engagements: 1 }
              as: PlatformAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "SSN_TRACE", severity: "MEDIUM", source_detail: "credit file shows unknown address" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /idp/alerts/${a_id}/acknowledge"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts/${a_id}/confirm-fraud"
              payload: {}
              as: PlatformAdmin
            - call: "GET /idp/restoration-cases"
              payload: { origin_alert_id: "${a_id}" }
              as: PlatformAdmin
              captures: { case_id: "$.data[0].id" }
            - call: "POST /idp/restoration-cases/${case_id}/assign"
              payload: { specialist_id: "${sp_id}" }
              as: PlatformAdmin
            - call: "GET /idp/specialists/${sp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { sp_v: $.data.version }
            - call: "POST /idp/specialist-engagements"
              payload: { specialist_id: "${sp_id}", case_id: "${case_id}", window_start: "2026-05-11T09:00:00Z", window_end: "2026-05-11T11:00:00Z", expected_specialist_version: "${sp_v}" }
              as: PlatformAdmin
            - call: "POST /idp/restoration-cases/${case_id}/resolve"
              payload: { resolution_summary: "Address reversed; file corrected." }
              as: RestorationSpecialist
              as_user_id: "${sp_id}"
            - call: "GET /idp/restoration-cases/${case_id}"
              payload: {}
              as: PlatformAdmin
              captures: { case_v: $.data.version }
            - call: "POST /idp/insurance-claims"
              payload:
                case_id: "${case_id}"
                expected_case_version: "${case_v}"
                expenses:
                  - { category: "LEGAL_FEES", amount_cents: 120000, documented: true }
                  - { category: "LOST_WAGES", amount_cents: 333333, documented: true }
                  - { category: "TRAVEL", amount_cents: 4501, documented: true }
                  - { category: "TRAVEL", amount_cents: 4501, documented: true }
                  - { category: "CHILDCARE", amount_cents: 30001, documented: false }
                  - { category: "NOTARY", amount_cents: 2501, documented: true }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /idp/insurance-claims/${claim_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
          trigger:
            - call: "POST /idp/insurance-claims/${claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adjuster-002"
          assert:
            - "InsuranceClaim.${claim_id}.approved_cents == 374503"
            - "InsuranceClaim.${claim_id}.approved_cents != 374502  # 374502 is the sum-then-round answer and is wrong"
            - "InsuranceClaim.${claim_id}.provisional_amount_cents == 382003"

      - name: escalation_tier_pinned_to_pre_transition_risk_snapshot
        grounds:
          - calculations.alert_escalation_tier
          - calculations.identity_risk_score
          - state_machines.Alert.CONFIRMED_FRAUD_to_ESCALATED
          - entities.Alert.fields.escalation_tier
          - entities.Alert.fields.escalation_deadline
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order. risk_score counts
          ESCALATED alerts (+10) and the tier is read from risk_score; the snapshot rule fixes the
          tier from the pre-transition value r0 == 63 (=> TIER2), whereas recomputing risk first
          gives 73 (>= 70 => TIER3). Correct output is escalation_tier == TIER2 with the recomputed
          risk_score == 73 stored afterwards.
        test_recipe:
          setup:
            - "Logical clock set to 2026-06-01T00:00:00Z."
            - "Verified subscriber with three alerts: SSN_TRACE (MEDIUM) confirmed as fraud, ACCOUNT_TAKEOVER (MEDIUM) confirmed as fraud, CREDIT_INQUIRY (LOW) left NEW."
            - "Persisted risk_score before escalation is exactly 63 (10 + 25 + 20 + 8) and underwriting_risk_score is 55 (10 + 25 + 20)."
          setup_api_calls:
            - call: "POST /idp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /idp/plans"
              payload: { tier: "ADVANTAGE", monthly_fee_cents: 1999, insurance_limit_cents: 500000, max_family_members: 2, child_monitoring_included: false, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "cf2@example.com", full_name: "Omar Diaz", date_of_birth: "1972-07-19", ssn_last4: "6060", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "SSN_TRACE", severity: "MEDIUM", source_detail: "SSN used on new utility account" }
              as: PlatformAdmin
              captures: { a_ssn: $.data.id }
            - call: "POST /idp/alerts/${a_ssn}/acknowledge"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts/${a_ssn}/confirm-fraud"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "ACCOUNT_TAKEOVER", severity: "MEDIUM", source_detail: "password reset from unknown device" }
              as: PlatformAdmin
              captures: { a_ato: $.data.id }
            - call: "POST /idp/alerts/${a_ato}/acknowledge"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts/${a_ato}/confirm-fraud"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/alerts"
              payload: { subscriber_id: "${sub_id}", alert_type: "CREDIT_INQUIRY", severity: "LOW", source_detail: "hard pull by Meridian Bank" }
              as: PlatformAdmin
          trigger:
            - call: "POST /idp/alerts/${a_ssn}/escalate"
              payload: {}
              as: PlatformAdmin
              captures: { tier: $.data.escalation_tier }
          assert:
            - "Alert.${a_ssn}.escalation_tier == 'TIER2'  # NOT TIER3 — the tier reads r0 = 63, not the post-transition 73"
            - "Alert.${a_ssn}.status == ESCALATED"
            - "Alert.${a_ssn}.escalation_deadline == '2026-06-02T00:00:00.000Z'  # clock + SLA_HOURS[TIER2] = 24h"
            - "Subscriber.${sub_id}.risk_score == 73  # recomputed only AFTER the tier was fixed"
            - "Subscriber.${sub_id}.underwriting_risk_score == 65"
            - "RestorationCase where origin_alert_id == ${a_ssn} has required_specialist_tier == 'TIER2'"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: bureau_profile_freeze_thaw_full_cycle_returns_to_unfrozen
        grounds:
          - state_machines.BureauProfile.UNFROZEN_to_FREEZE_PENDING
          - state_machines.BureauProfile.FREEZE_PENDING_to_FROZEN
          - state_machines.BureauProfile.FROZEN_to_THAW_PENDING
          - state_machines.BureauProfile.THAW_PENDING_to_UNFROZEN
          - entities.BureauProfile.fields.freeze_status
        distinguishing_aspect: |
          Non-linear shape #1: a true CYCLE on BureauProfile — UNFROZEN -> FREEZE_PENDING -> FROZEN ->
          THAW_PENDING -> UNFROZEN returns the row to its initial state with version 5, and the cycle
          may then be re-entered (a second FREEZE request from the returned UNFROZEN state succeeds).
        test_recipe:
          setup:
            - "Verified subscriber on a TRI plan; three UNFROZEN BureauProfiles exist (EQUIFAX, EXPERIAN, TRANSUNION in created_at order)."
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "nl1@example.com", full_name: "Tess Aubry", date_of_birth: "1988-01-05", ssn_last4: "7777", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "GET /idp/subscribers/${sub_id}/bureau-profiles"
              payload: {}
              as: PlatformAdmin
              captures: { bp_eq: "$.data[0].id" }
          trigger:
            - call: "POST /idp/bureau-profiles/${bp_eq}/freeze-request"
              payload: { action: "FREEZE" }
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /idp/bureau-profiles/${bp_eq}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/bureau-profiles/${bp_eq}/freeze-request"
              payload: { action: "THAW" }
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /idp/bureau-profiles/${bp_eq}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /idp/bureau-profiles/${bp_eq}/freeze-request"
              payload: { action: "FREEZE" }
              as: Subscriber
              as_user_id: "${sub_id}"
          assert:
            - "After the 4th trigger call, BureauProfile.${bp_eq}.freeze_status == UNFROZEN"
            - "After the 4th trigger call, BureauProfile.${bp_eq}.version == 5"
            - "After the 5th trigger call, BureauProfile.${bp_eq}.freeze_status == FREEZE_PENDING  # the cycle is re-enterable"
            - "BureauProfile.${bp_eq}.bureau == 'EQUIFAX'"

      - name: subscriber_enrollment_and_monitoring_dimensions_move_independently
        grounds:
          - state_machines.Subscriber.PENDING_DATA_to_MONITORED
          - state_machines.Subscriber.ACTIVE_to_SUSPENDED
          - state_machines.Subscriber.SUSPENDED_to_ACTIVE
          - entities.Subscriber.fields.enrollment_status
          - entities.Subscriber.fields.monitoring_status
        distinguishing_aspect: |
          Non-linear shape #2 on a DIFFERENT entity (Subscriber): two PARALLEL state dimensions on one
          row. A score-refresh moves monitoring_status PENDING_DATA -> MONITORED while enrollment_status
          stays ACTIVE (untouched); a suspend then moves enrollment ACTIVE -> SUSPENDED and drives
          monitoring to PAUSED; reactivate restores both, with monitoring returning to MONITORED (not
          PENDING_DATA) because composite_credit_score is non-null.
        test_recipe:
          setup:
            - "Verified subscriber on a TRI plan: enrollment_status ACTIVE, monitoring_status PENDING_DATA, composite_credit_score null."
          setup_api_calls:
            - call: "POST /idp/plans"
              payload: { tier: "ULTIMATE", monthly_fee_cents: 3499, insurance_limit_cents: 500000, max_family_members: 4, child_monitoring_included: true, bureau_scope: "TRI", min_specialist_tier: "TIER1" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /idp/subscribers"
              payload: { email: "nl2@example.com", full_name: "Ravi Kohl", date_of_birth: "1994-09-09", ssn_last4: "2020", plan_id: "${plan_id}" }
              as: Anonymous
              captures: { sub_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /idp/subscribers/${sub_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Anonymous
            - call: "GET /idp/subscribers/${sub_id}/bureau-profiles"
              payload: {}
              as: PlatformAdmin
              captures: { bp_eq: "$.data[0].id" }
          trigger:
            - call: "POST /idp/bureau-profiles/${bp_eq}/score-refresh"
              payload: { credit_score: 700 }
              as: PlatformAdmin
            - call: "POST /idp/subscribers/${sub_id}/suspend"
              payload: { reason: "Payment method declined" }
              as: PlatformAdmin
            - call: "POST /idp/subscribers/${sub_id}/reactivate"
              payload: {}
              as: PlatformAdmin
          assert:
            - "After trigger 1: Subscriber.${sub_id}.monitoring_status == MONITORED AND Subscriber.${sub_id}.enrollment_status == ACTIVE (unchanged)"
            - "After trigger 1: Subscriber.${sub_id}.composite_credit_score == 700 AND baseline_composite_credit_score == 700"
            - "After trigger 2: Subscriber.${sub_id}.enrollment_status == SUSPENDED AND monitoring_status == PAUSED"
            - "After trigger 3: Subscriber.${sub_id}.enrollment_status == ACTIVE AND monitoring_status == MONITORED"
            - "After trigger 3: Subscriber.${sub_id}.suspension_reason == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: assign_cascade_count_then_capacity_then_selector_exclusion
        grounds:
          - state_machines.RestorationCase.OPEN_to_ASSIGNED
          - calculations.specialist_active_case_count
          - calculations.specialist_selection
          - state_machines.Specialist.AVAILABLE_to_AT_CAPACITY
          - entities.Specialist.fields.active_case_count
        distinguishing_aspect: |
          Depth-4 chain from the case-assign transition: (1) assign sets RestorationCase.specialist_id;
          (2) BECAUSE the case now points at the specialist, active_case_count recomputes 0 -> 1;
          (3) BECAUSE the count reached max_caseload = 1, Specialist.status flips AVAILABLE -> AT_CAPACITY;
          (4) BECAUSE the specialist is AT_CAPACITY, specialist_selection's eligibility filter drops it,
          so the next auto-assign resolves to the second (later-created) specialist instead.
        test_recipe:
          setup:
