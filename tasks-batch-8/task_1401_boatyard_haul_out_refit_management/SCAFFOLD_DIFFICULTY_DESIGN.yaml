scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: storage_daily_vs_monthly_divergence
        grounds:
          - calculations.storage_accrual
          - entities.RefitJob.fields.billing_mode
          - entities.LedgerEntry
        distinguishing_aspect: |
          Entity domain = RefitJob storage billing: identical lay days (10 summer
          days) and LOA (40 ft) produce 21800 cents under the DAILY marginal-tier
          variant but 56000 cents under the MONTHLY_CONTRACT block variant — two
          variants of the same metric on the same inputs diverge.
        test_recipe:
          setup:
            - "Two vessels (LOA 40 ft) each with a qualifying certificate; job A billing_mode DAILY, job B billing_mode MONTHLY_CONTRACT, both hauled 2026-08-02"
            - "Clock advanced to 2026-08-11 and one daily close executed, accruing 10 lay days on each job"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Daily", owner_name: "O A", owner_user_id: "owner-1", loa_ft: 40, beam_ft: 13, hull_type: "POWER", displacement_tons: 20 }, as: ServiceWriter, captures: { v_a: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_a}", provider: "P", policy_no: "PA", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_a}", billing_mode: "DAILY" }, as: ServiceWriter, captures: { j_a: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_a}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/vessels", payload: { name: "MV Monthly", owner_name: "O B", owner_user_id: "owner-2", loa_ft: 40, beam_ft: 13, hull_type: "SAIL", displacement_tons: 18 }, as: ServiceWriter, captures: { v_b: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_b}", provider: "P", policy_no: "PB", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_b}", billing_mode: "MONTHLY_CONTRACT" }, as: ServiceWriter, captures: { j_b: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_b}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/yard-rows", payload: { code: "A", total_stands: 10 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_a}", stands_used: 4, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "GET /yard/yard-rows/${row_id}", payload: {}, as: YardManager, captures: { row_v2: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_b}", stands_used: 4, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v2}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_a}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 20 }, as: YardManager, captures: { slot_a: $.data.id } }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_b}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T09:30:00Z", scheduled_end: "2026-08-02T10:30:00Z", vessel_displacement_tons: 18 }, as: YardManager, captures: { slot_b: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${slot_a}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:45:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${slot_b}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T12:00:00Z" }, as: YardManager }
            - { call: "POST /yard/ops/run-daily-close", payload: {}, as: YardManager }
          trigger:
            - { call: "GET /yard/refit-jobs/${j_a}/statement", payload: {}, as: Accountant, captures: { store_a: $.data.storage_charges_cents, days_a: $.data.lay_days } }
            - { call: "GET /yard/refit-jobs/${j_b}/statement", payload: {}, as: Accountant, captures: { store_b: $.data.storage_charges_cents, days_b: $.data.lay_days } }
          assert:
            - "statement A lay_days == 10 and statement B lay_days == 10 (identical accrual windows)"
            - "statement A storage_charges_cents == 21800 (7 days x 2000 + 3 days x 2600)"
            - "statement B storage_charges_cents == 56000 (one 30-day block: 40 x 1400)"
            - "storage_charges_cents A != storage_charges_cents B for identical lay_days and LOA"

      - name: work_order_estimate_vs_actual_divergence
        grounds:
          - calculations.work_order_cost
          - entities.WorkOrder.fields.quoted_total_cents
          - entities.WorkOrder.fields.actual_cost_cents
        distinguishing_aspect: |
          Entity domain = WorkOrder labor costing (different domain from the
          storage instance above): the ESTIMATE variant yields 85000 cents while
          the ACTUAL variant over logged lines (yard crew + subcontractor at
          1.15 markup) yields 89400 cents for the same work order.
        test_recipe:
          setup:
            - "Job ON_HARD for a 40 ft vessel; one MECHANICAL work order quoted 10h x 8000c + 5000c parts, approved and started"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Diverge", owner_name: "O A", owner_user_id: "owner-1", loa_ft: 40, beam_ft: 13, hull_type: "POWER", displacement_tons: 20 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PN1", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/yard-rows", payload: { code: "A", total_stands: 10 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 4, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 20 }, as: YardManager, captures: { slot_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${slot_id}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "MECHANICAL", description: "Engine service", quoted_hours: 10, quoted_rate_cents: 8000, quoted_parts_cents: 5000 }, as: ServiceWriter, captures: { wo_id: $.data.id, wo_quoted: $.data.quoted_total_cents } }
            - { call: "POST /yard/work-orders/${wo_id}/approve", payload: {}, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /yard/work-orders/${wo_id}/start", payload: {}, as: ServiceWriter }
          trigger:
            - { call: "POST /yard/labor-entries", payload: { work_order_id: "${wo_id}", worker_type: "YARD_CREW", hours: 6, rate_cents: 8000 }, as: ServiceWriter }
            - { call: "POST /yard/labor-entries", payload: { work_order_id: "${wo_id}", worker_type: "SUBCONTRACTOR", hours: 4, rate_cents: 9000, subcontractor_name: "Coastal Marine LLC" }, as: ServiceWriter }
            - { call: "GET /yard/work-orders/${wo_id}", payload: {}, as: ServiceWriter, captures: { wo_q: $.data.quoted_total_cents, wo_actual: $.data.actual_cost_cents } }
          assert:
            - "WorkOrder.quoted_total_cents == 85000 (estimate variant)"
            - "WorkOrder.actual_cost_cents == 89400 (actual variant: 48000 + round(4 x 9000 x 1.15)=41400)"
            - "actual_cost_cents != quoted_total_cents for the same work order"

  # =====================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) vs (b))
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: storage_winter_tier_per_day_rounding
        grounds:
          - calculations.storage_accrual
          - entities.LedgerEntry
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction (lay-day tier
          selection x winter-season branch x LOA): 7 winter tier-1 days at LOA 37
          cost 11011 cents because each day rounds half-up (1572.5 -> 1573)
          before summing; a sum-then-round reading would give 11008.
        test_recipe:
          setup:
            - "37 ft vessel hauled 2026-11-01 (winter multiplier window), DAILY billing"
            - "Clock advanced to 2026-11-07 and one daily close executed (7 lay days, all tier 1, all winter)"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-10-28T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "SV Winter", owner_name: "O W", owner_user_id: "owner-1", loa_ft: 37, beam_ft: 12, hull_type: "SAIL", displacement_tons: 15 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PW", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}", billing_mode: "DAILY" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/yard-rows", payload: { code: "W", total_stands: 8 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 3, start_date: "2026-11-01", end_date: "2026-12-15", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-11-01T10:00:00Z", scheduled_end: "2026-11-01T11:00:00Z", vessel_displacement_tons: 15 }, as: YardManager, captures: { slot_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T10:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${slot_id}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-11-07T12:00:00Z" }, as: YardManager }
            - { call: "POST /yard/ops/run-daily-close", payload: {}, as: YardManager }
          trigger:
            - { call: "GET /yard/refit-jobs/${j_id}/statement", payload: {}, as: Accountant, captures: { store: $.data.storage_charges_cents, days: $.data.lay_days } }
          assert:
            - "statement lay_days == 7 (2026-11-01 through 2026-11-07 inclusive)"
            - "statement storage_charges_cents == 11011 (7 x round_half_up(37 x 50 x 0.85) = 7 x 1573)"
            - "storage_charges_cents != 11008 (the sum-then-round value) — per-day rounding is pinned"

      - name: labor_per_line_rounding_then_sum
        grounds:
          - calculations.work_order_cost
          - calculations.labor_line_cost
        distinguishing_aspect: |
          Mode (b) — nested rounding order (different mode from the tiered
          formula above): subcontractor lines 2.5h x 6100c x 1.15 = 17537.5 and
          1.5h x 7700c x 1.15 = 13282.5 round per line to 17538 + 13283 = 30821;
          sum-then-round would give 30820. The scaffold pins round-per-line.
        test_recipe:
          setup:
            - "Job ON_HARD; MECHANICAL work order approved and started"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Round", owner_name: "O R", owner_user_id: "owner-1", loa_ft: 32, beam_ft: 11, hull_type: "POWER", displacement_tons: 12 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PR", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/yard-rows", payload: { code: "R", total_stands: 6 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 3, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 12 }, as: YardManager, captures: { slot_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${slot_id}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "MECHANICAL", description: "Sub work", quoted_hours: 1, quoted_rate_cents: 1000, quoted_parts_cents: 0 }, as: ServiceWriter, captures: { wo_id: $.data.id } }
            - { call: "POST /yard/work-orders/${wo_id}/approve", payload: {}, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /yard/work-orders/${wo_id}/start", payload: {}, as: ServiceWriter }
          trigger:
            - { call: "POST /yard/labor-entries", payload: { work_order_id: "${wo_id}", worker_type: "SUBCONTRACTOR", hours: 2.5, rate_cents: 6100, subcontractor_name: "Sub A" }, as: ServiceWriter }
            - { call: "POST /yard/labor-entries", payload: { work_order_id: "${wo_id}", worker_type: "SUBCONTRACTOR", hours: 1.5, rate_cents: 7700, subcontractor_name: "Sub A" }, as: ServiceWriter }
            - { call: "GET /yard/work-orders/${wo_id}", payload: {}, as: ServiceWriter, captures: { wo_actual: $.data.actual_cost_cents } }
            - { call: "POST /yard/work-orders/${wo_id}/complete", payload: {}, as: ServiceWriter }
            - { call: "GET /yard/refit-jobs/${j_id}/statement", payload: {}, as: Accountant, captures: { stmt_labor: $.data.labor_charges_cents } }
          assert:
            - "WorkOrder.actual_cost_cents == 30821 (17538 + 13283, per-line round_half_up)"
            - "actual_cost_cents != 30820 (the sum-then-round value)"
            - "statement labor_charges_cents == 30821 after completion posts the LABOR charge"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_change_order_cycle
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_CHANGE_REQUESTED
          - state_machines.WorkOrder.CHANGE_REQUESTED_to_ESTIMATE
        distinguishing_aspect: |
          Entity = WorkOrder: cyclic change-order loop
          ESTIMATE -> APPROVED -> IN_PROGRESS -> CHANGE_REQUESTED -> ESTIMATE
          increments revision to 1 and replaces the quote, after which the work
          order can be re-approved — a true cycle, not a linear pipeline.
        test_recipe:
          setup:
            - "Job ON_HARD; MECHANICAL work order created, approved, started"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Cycle", owner_name: "O C", owner_user_id: "owner-1", loa_ft: 32, beam_ft: 11, hull_type: "POWER", displacement_tons: 12 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PC", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/yard-rows", payload: { code: "C", total_stands: 6 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 3, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 12 }, as: YardManager, captures: { slot_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${slot_id}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "MECHANICAL", description: "Engine", quoted_hours: 10, quoted_rate_cents: 8000, quoted_parts_cents: 5000 }, as: ServiceWriter, captures: { wo_id: $.data.id, q0: $.data.quoted_total_cents } }
            - { call: "POST /yard/work-orders/${wo_id}/approve", payload: {}, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /yard/work-orders/${wo_id}/start", payload: {}, as: ServiceWriter }
          trigger:
            - { call: "POST /yard/work-orders/${wo_id}/request-change", payload: { change_note: "Add raw-water pump" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /yard/work-orders/${wo_id}/requote", payload: { quoted_hours: 12, quoted_rate_cents: 8000, quoted_parts_cents: 5000 }, as: ServiceWriter, captures: { rev_after: $.data.revision, q_after: $.data.quoted_total_cents, st_after: $.data.status } }
            - { call: "POST /yard/work-orders/${wo_id}/approve", payload: {}, as: Owner, as_user_id: "owner-1", captures: { st_final: $.data.status } }
          assert:
            - "initial quoted_total_cents == 85000"
            - "after request-change + requote: status == ESTIMATE, revision == 1, quoted_total_cents == 101000"
            - "after re-approval the cycle closes: status == APPROVED"

      - name: job_sea_trial_fail_full_cycle
        grounds:
          - state_machines.RefitJob.AWAITING_TRIAL_to_WORK_IN_PROGRESS
          - state_machines.RefitJob.WORK_IN_PROGRESS_to_READY_FOR_SPLASH
        distinguishing_aspect: |
          Entity = RefitJob (different entity from the WorkOrder cycle):
          WORK_IN_PROGRESS -> READY_FOR_SPLASH -> AWAITING_TRIAL ->
          WORK_IN_PROGRESS on trial FAIL, and the loop re-traverses to
          READY_FOR_SPLASH after the failed work order is requoted and completed.
        test_recipe:
          setup:
            - "Job fully worked to READY_FOR_SPLASH with one COMPLETE work order (quoted 85000), deposit 21250 posted, splash slot booked and completed -> AWAITING_TRIAL"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Trial", owner_name: "O T", owner_user_id: "owner-1", loa_ft: 40, beam_ft: 13, hull_type: "POWER", displacement_tons: 20 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PT", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/yard-rows", payload: { code: "T", total_stands: 10 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 4, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 20 }, as: YardManager, captures: { haul_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${haul_id}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "MECHANICAL", description: "Engine", quoted_hours: 10, quoted_rate_cents: 8000, quoted_parts_cents: 5000 }, as: ServiceWriter, captures: { wo_id: $.data.id } }
            - { call: "POST /yard/work-orders/${wo_id}/approve", payload: {}, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /yard/work-orders/${wo_id}/start", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/work-orders/${wo_id}/complete", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/ledger-entries", payload: { job_id: "${j_id}", kind: "DEPOSIT", amount_cents: 21250, memo: "25% deposit" }, as: Accountant }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "SPLASH", scheduled_start: "2026-08-20T08:00:00Z", scheduled_end: "2026-08-20T09:00:00Z", vessel_displacement_tons: 20 }, as: YardManager, captures: { splash_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${splash_id}/complete", payload: {}, as: YardManager, captures: { st_trial: $.data.status } }
          trigger:
            - { call: "POST /yard/refit-jobs/${j_id}/record-sea-trial", payload: { outcome: "FAIL", failed_work_order_id: "${wo_id}", notes: "Vibration at cruise RPM" }, as: YardManager, captures: { st_fail: $.data.status } }
            - { call: "POST /yard/work-orders/${wo_id}/requote", payload: { quoted_hours: 12, quoted_rate_cents: 8000, quoted_parts_cents: 9000 }, as: ServiceWriter }
            - { call: "POST /yard/work-orders/${wo_id}/approve", payload: {}, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /yard/work-orders/${wo_id}/start", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/work-orders/${wo_id}/complete", payload: {}, as: ServiceWriter }
            - { call: "GET /yard/refit-jobs/${j_id}", payload: {}, as: YardManager, captures: { st_final: $.data.status } }
          assert:
            - "after splash completion the job is AWAITING_TRIAL (${st_trial} == AWAITING_TRIAL)"
            - "FAIL drives job back to WORK_IN_PROGRESS (${st_fail} == WORK_IN_PROGRESS)"
            - "the failed work order is reopened to CHANGE_REQUESTED by the cascade"
            - "after requote -> approve -> start -> complete, job status == READY_FOR_SPLASH again (cycle closed)"

  # =====================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: env_violation_cascade_to_splash_cancel
        grounds:
          - calculations.runoff_compliance_check
          - state_machines.ComplianceHold.OPEN_to_RELEASED
          - state_machines.RefitJob.READY_FOR_SPLASH_to_WORK_IN_PROGRESS
          - state_machines.LiftSlot.BOOKED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain from the environmental-event trigger (different trigger
          from the sea-trial instance): event flagged VIOLATION_FLAGGED ->
          AUTO_VIOLATION ComplianceHold created (hop 1) -> job exits
          READY_FOR_SPLASH to WORK_IN_PROGRESS (hop 2, caused by the hold) ->
          BOOKED SPLASH slot auto-CANCELLED (hop 3, caused by the job leaving
          READY_FOR_SPLASH).
        test_recipe:
          setup:
            - "Job READY_FOR_SPLASH (one COMPLETE work order, quoted 85000), deposit 21250 posted, SPLASH slot BOOKED for 2026-08-20"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Sand", owner_name: "O S", owner_user_id: "owner-1", loa_ft: 40, beam_ft: 13, hull_type: "SAIL", displacement_tons: 20 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PS", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/yard-rows", payload: { code: "S", total_stands: 10 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 4, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 20 }, as: YardManager, captures: { haul_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${haul_id}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "BOTTOM_PAINT", description: "Ablative bottom paint", quoted_hours: 10, quoted_rate_cents: 8000, quoted_parts_cents: 5000 }, as: ServiceWriter, captures: { wo_id: $.data.id } }
            - { call: "POST /yard/work-orders/${wo_id}/approve", payload: {}, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /yard/work-orders/${wo_id}/start", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/work-orders/${wo_id}/complete", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/ledger-entries", payload: { job_id: "${j_id}", kind: "DEPOSIT", amount_cents: 21250 }, as: Accountant }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "SPLASH", scheduled_start: "2026-08-20T08:00:00Z", scheduled_end: "2026-08-20T09:00:00Z", vessel_displacement_tons: 20 }, as: YardManager, captures: { splash_id: $.data.id } }
          trigger:
            - { call: "POST /yard/environmental-events", payload: { job_id: "${j_id}", kind: "SANDING", containment_used: true, runoff_tss_ppm: 150 }, as: EnvironmentalOfficer, captures: { ev_id: $.data.id, ev_status: $.data.status } }
            - { call: "GET /yard/refit-jobs/${j_id}/compliance-holds", payload: {}, as: EnvironmentalOfficer, captures: { hold_status: "$.data[0].status", hold_kind: "$.data[0].kind", hold_source: "$.data[0].source" } }
            - { call: "GET /yard/refit-jobs/${j_id}", payload: {}, as: YardManager, captures: { job_status: $.data.status } }
            - { call: "GET /yard/refit-jobs/${j_id}/lift-slots", payload: { status: "CANCELLED" }, as: YardManager, captures: { cancelled_slot_status: "$.data[0].status" } }
          assert:
            - "event ${ev_id} status == VIOLATION_FLAGGED (150 >= 100.0)"
            - "exactly one hold exists: status OPEN, kind ENVIRONMENTAL, source AUTO_VIOLATION (hop 1)"
            - "job status == WORK_IN_PROGRESS (hop 2 — readiness revoked by the open hold)"
            - "the BOOKED splash slot ${splash_id} is CANCELLED (hop 3 — caused by the job leaving READY_FOR_SPLASH)"

      - name: sea_trial_fail_cascade_reopens_work
        grounds:
          - state_machines.RefitJob.AWAITING_TRIAL_to_WORK_IN_PROGRESS
          - state_machines.WorkOrder.COMPLETE_to_CHANGE_REQUESTED
          - entities.LedgerEntry
        distinguishing_aspect: |
          Depth-2 chain from the sea-trial FAIL trigger (different trigger from
          the environmental instance): trial FAIL mutates the job
          AWAITING_TRIAL -> WORK_IN_PROGRESS (hop 1), and that job mutation
          reopens the referenced COMPLETE work order to CHANGE_REQUESTED
          (hop 2) — while the previously posted LABOR charge stays POSTED
          (no drift in the ledger).
        test_recipe:
          setup:
            - "Job AWAITING_TRIAL: one COMPLETE MECHANICAL work order with 5h yard labor (LABOR charge 40000 POSTED), deposit 21250 posted, splash completed 2026-08-20"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Cascade", owner_name: "O C", owner_user_id: "owner-1", loa_ft: 40, beam_ft: 13, hull_type: "POWER", displacement_tons: 20 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PC2", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/yard-rows", payload: { code: "C2", total_stands: 10 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 4, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 20 }, as: YardManager, captures: { haul_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${haul_id}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "MECHANICAL", description: "Engine", quoted_hours: 10, quoted_rate_cents: 8000, quoted_parts_cents: 5000 }, as: ServiceWriter, captures: { wo_id: $.data.id } }
            - { call: "POST /yard/work-orders/${wo_id}/approve", payload: {}, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /yard/work-orders/${wo_id}/start", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/labor-entries", payload: { work_order_id: "${wo_id}", worker_type: "YARD_CREW", hours: 5, rate_cents: 8000 }, as: ServiceWriter }
            - { call: "POST /yard/work-orders/${wo_id}/complete", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/ledger-entries", payload: { job_id: "${j_id}", kind: "DEPOSIT", amount_cents: 21250 }, as: Accountant }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "SPLASH", scheduled_start: "2026-08-20T08:00:00Z", scheduled_end: "2026-08-20T09:00:00Z", vessel_displacement_tons: 20 }, as: YardManager, captures: { splash_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${splash_id}/complete", payload: {}, as: YardManager }
          trigger:
            - { call: "POST /yard/refit-jobs/${j_id}/record-sea-trial", payload: { outcome: "FAIL", failed_work_order_id: "${wo_id}" }, as: YardManager, captures: { job_status: $.data.status } }
            - { call: "GET /yard/work-orders/${wo_id}", payload: {}, as: ServiceWriter, captures: { wo_status: $.data.status } }
            - { call: "GET /yard/refit-jobs/${j_id}/ledger-entries", payload: { kind: "CHARGE" }, as: Accountant, captures: { charge_status: "$.data[0].status", charge_amount: "$.data[0].amount_cents" } }
          assert:
            - "hop 1: job status == WORK_IN_PROGRESS"
            - "hop 2: work order ${wo_id} status == CHANGE_REQUESTED"
            - "the LABOR charge from the first completion remains POSTED with amount_cents == 40000 (cascade does not void charges)"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: splash_booking_state_beats_deposit_fiscal
        grounds:
          - "validations[priority=7]"
          - "validations[priority=19]"
          - "errors[ERR_JOB_NOT_READY_FOR_SPLASH]"
          - "errors[ERR_DEPOSIT_SHORTFALL]"
        distinguishing_aspect: |
          Category pair state vs business_fiscal: a SPLASH booking on a job in
          WORK_IN_PROGRESS with zero deposits violates both rules; the
          state-priority error ERR_JOB_NOT_READY_FOR_SPLASH (priority 7) must
          win over ERR_DEPOSIT_SHORTFALL (priority 19).
        test_recipe:
          setup:
            - "Job ON_HARD with one APPROVED-then-STARTED work order (job WORK_IN_PROGRESS); NO deposit posted (required would be 21250)"
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Priority", owner_name: "O P", owner_user_id: "owner-1", loa_ft: 40, beam_ft: 13, hull_type: "POWER", displacement_tons: 20 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PP", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/yard-rows", payload: { code: "P", total_stands: 10 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 4, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 20 }, as: YardManager, captures: { haul_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${haul_id}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/work-orders", payload: { job_id: "${j_id}", type: "MECHANICAL", description: "Engine", quoted_hours: 10, quoted_rate_cents: 8000, quoted_parts_cents: 5000 }, as: ServiceWriter, captures: { wo_id: $.data.id } }
            - { call: "POST /yard/work-orders/${wo_id}/approve", payload: {}, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /yard/work-orders/${wo_id}/start", payload: {}, as: ServiceWriter }
          trigger:
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "SPLASH", scheduled_start: "2026-08-20T08:00:00Z", scheduled_end: "2026-08-20T09:00:00Z", vessel_displacement_tons: 20 }, as: YardManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_JOB_NOT_READY_FOR_SPLASH (state priority 7) — NOT ERR_DEPOSIT_SHORTFALL (fiscal priority 19), although deposits posted == 0 < 21250"

      - name: moratorium_safety_beats_slot_conflict
        grounds:
          - "validations[priority=8]"
          - "validations[priority=12]"
          - "errors[ERR_ENV_MORATORIUM]"
          - "errors[ERR_LIFT_SLOT_CONFLICT]"
        distinguishing_aspect: |
          Category pair business_safety vs business_constraint (different pair
          from the state-vs-fiscal instance): a HAUL_OUT booking whose start
          (2026-04-10) falls inside the moratorium AND whose window collides
          with an existing slot must return ERR_ENV_MORATORIUM (priority 8),
          not ERR_LIFT_SLOT_CONFLICT (priority 12).
        test_recipe:
          setup:
            - "Job A fully worked and READY_FOR_SPLASH with a BOOKED SPLASH slot 2026-04-10T08:00-09:00 (deposit posted)"
            - "Job B (second vessel) in INTAKE; booking its HAUL_OUT at 2026-04-10T08:30 violates both the moratorium and the slot buffer"
          setup_api_calls:
