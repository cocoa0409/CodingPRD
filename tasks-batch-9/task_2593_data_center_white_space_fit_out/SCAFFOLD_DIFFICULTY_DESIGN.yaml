              as_user_id: "u-elec-1"
              captures: { mop3_id: $.data.id }
            - call: "POST /mops/${mop3_id}/submit"
              payload: {}
              as: ElectricalContractor
              as_user_id: "u-elec-1"
            - call: "POST /mops/${mop3_id}/approvals"
