            - "Cycle C 2027 (total 500000000, both contingency pct 0.00); two requests of 100000000 each, both screened and scored -> composite 39.69 each."
            - "allocate RANK_ORDERED: demand 200000000, allocated 200000000, available 200000000, posture ACTIVE, allocation_count 1, unallocated 300000000."
