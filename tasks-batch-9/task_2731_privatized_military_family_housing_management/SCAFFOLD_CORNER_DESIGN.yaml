      - name: two_live_rungs_are_reported_in_priority_order
        claim_type: priority_conflict
        grounds:
          - validations[priority=22]
          - validations[priority=45]
          - errors[ERR_APPLICATION_NOT_ACCEPTED]
          - errors[ERR_BAH_RATE_NOT_ON_FILE]
        excluded_because:
          difficulty_instance: lease_state_gate_outranks_bah_rate_fiscal_gate
          rationale: "A genuine conflict needs one request that breaks a state rung and a fiscal rung at once and then a repair of only the lower one, which is exactly the fixture the difficulty instance builds; repeating it here would duplicate that setup without adding coverage."

      - name: clearing_the_upstream_rung_exposes_the_next_one
        claim_type: cascading_validation
        grounds:
          - validations[priority=24]
          - validations[priority=30]
          - errors[ERR_INSPECTION_NOT_ACKNOWLEDGED]
          - errors[ERR_UNRESOLVED_CRITICAL_DEFICIENCY]
        excluded_because:
          difficulty_instance: move_in_gated_on_move_in_inspection_critical_deficiency_clearing
          rationale: "The cascade only shows itself when a critical deficiency spawns a work order whose completion then re-opens the gate, a chain of three dependent checks the difficulty instance already walks end to end."


  # =========================================================================
  # ENDPOINTS - the §1.5 surface itself: the one array-bodied bulk action,
  # a read whose payload is entirely derived, and an action whose single
  # boolean input forks the whole case. Standard CRUD shapes are exercised
  # by the entities section above.
  # =========================================================================
  - section: endpoints
    instances:

      - name: one_deficiency_call_appends_the_whole_walkthrough_list
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/move-in-inspections/{id}/deficiencies
          - entities.MoveInInspection.fields.deficiencies
          - entities.MoveInInspection.fields.critical_open_count
          - state_machines.MoveInInspection.SCHEDULED_to_DEFICIENCIES_LOGGED
        distinguishing_aspect: "A single array-bodied call appends three entries at once and recomputes two derived counts over them - deficiency_count over the whole array and critical_open_count over only the HABITABILITY_CRITICAL ones - while deliberately creating NO work order: the spawn happens later, at acknowledgment, so a work-order listing on the unit is still empty immediately after the bulk write."
        test_recipe:
          setup:
            - "One installation with the declared defaults and one 2026 BahRate row for E5 with dependents (245000 / 19500)."
            - "One unit A-101, 2 bedrooms, TOWNHOME, JUNIOR_ENLISTED, historic_flag false."
            - "One E5 sponsor with three full-time-custody dependents applied, was offered A-101, accepted, and the lease starting 2026-09-01 for 12 months was written."
            - "A MoveInInspection scheduled for 2026-08-31 stands in status SCHEDULED with an empty deficiencies array, deficiency_count 0 and critical_open_count 0."
            - "No work order exists on the unit; the logical clock stands at 2026-08-31T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: "$.data.id" }
            - call: "POST /bah-rates"
              payload: { installation_id: "${inst_id}", pay_grade: "E5", with_dependents: true, effective_year: 2026, monthly_rate_cents: 245000, utility_allowance_cents: 19500 }
              as: PlatformAdmin
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-101", bedroom_count: 2, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /service-members"
              payload: { dodid: "1000000001", last_name: "Reyes", first_name: "Ana", branch: "ARMY", pay_grade: "E5" }
              as: PlatformAdmin
              captures: { sm1_id: "$.data.id" }
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "SPOUSE", date_of_birth: "1992-03-04", gender: "FEMALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2018-04-10", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2022-03-15", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /waitlist-applications"
              payload: { installation_id: "${inst_id}", service_member_id: "${sm1_id}", pcs_orders_date: "2026-08-25", expected_arrival_date: "2026-09-01", accessibility_required: false }
              as: ServiceMember
              as_user_id: "${sm1_id}"
              captures: { app1_id: "$.data.id" }
            - call: "POST /installations/${inst_id}/waitlist-offer-run"
              payload: {}
              as: PropertyManager
            - call: "POST /waitlist-applications/${app1_id}/accept-offer"
              payload: {}
              as: ServiceMember
              as_user_id: "${sm1_id}"
            - call: "POST /leases"
              payload: { application_id: "${app1_id}", housing_unit_id: "${u1_id}", start_date: "2026-09-01", term_months: 12 }
              as: PropertyManager
              captures: { l1_id: "$.data.id" }
            - call: "POST /move-in-inspections"
              payload: { lease_id: "${l1_id}", scheduled_date: "2026-08-31" }
              as: PropertyManager
              captures: { insp1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /move-in-inspections/${insp1_id}/deficiencies"
              payload: { deficiencies: [{ deficiency_code: "NO_HEAT", room: "LIVING_ROOM", severity: "HABITABILITY_CRITICAL" }, { deficiency_code: "PLUMBING_LEAK", room: "KITCHEN", severity: "HABITABILITY_CRITICAL" }, { deficiency_code: "COSMETIC", room: "BEDROOM_2", severity: "COSMETIC" }] }
              as: PropertyManager
              captures: { ep1_status: "$.data.status", ep1_count: "$.data.deficiency_count", ep1_crit: "$.data.critical_open_count", ep1_d0_status: "$.data.deficiencies[0].status", ep1_d0_wo: "$.data.deficiencies[0].work_order_id", ep1_d2_sev: "$.data.deficiencies[2].severity" }
            - call: "GET /move-in-inspections/${insp1_id}"
              payload: {}
              as: ServiceMember
              as_user_id: "${sm1_id}"
              captures: { ep1_reread_crit: "$.data.critical_open_count", ep1_reread_count: "$.data.deficiency_count" }
            - call: "GET /work-orders?housing_unit_id=${u1_id}"
              payload: {}
              as: PropertyManager
          assert:
            - "the bulk call returns HTTP 200 with ${ep1_status} == DEFICIENCIES_LOGGED"
            - "${ep1_count} == 3 - all three entries were appended by the one request"
            - "${ep1_crit} == 2 - only the two HABITABILITY_CRITICAL entries count toward the move-in blocker"
            - "${ep1_d0_status} == OPEN and ${ep1_d0_wo} == null and ${ep1_d2_sev} == COSMETIC"
            - "the work-order listing for the unit reports total_count == 0 - logging deficiencies spawns nothing"
            - "${ep1_reread_count} == 3 and ${ep1_reread_crit} == 2 on re-read"

