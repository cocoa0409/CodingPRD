      - call: POST /commercial/inventory-items
        payload:
          store_id: ${s_sat}
          part_id: ${p_o}
          on_hand_units: 20
        as: PartsCategoryManager
      - call: POST /commercial/commercial-accounts
        payload:
          shop_name: Occ Garage
          tax_id: TX-C022
          billing_address: 1 Occ St
          home_store_id: ${s_sat}
          credit_limit_cents: 250000
          credit_terms_days: 30
          delivery_service_level: SHOP_DELIVERY
        as: CommercialSalesRep
        captures:
          acct: $.data.id
          acct_v: $.data.version
      trigger:
      - call: POST /commercial/part-orders
        payload:
          account_id: ${acct}
          line_items:
          - part_id: ${p_o}
            quantity: 1
          expected_account_version: ${acct_v}
        as: CommercialSalesRep
        captures:
          ord1: $.data.id
      - call: POST /commercial/part-orders
        payload:
          account_id: ${acct}
          line_items:
          - part_id: ${p_o}
            quantity: 1
          expected_account_version: ${acct_v}
        as: CommercialSalesRep
        captures:
          err_id: $.data.error_id
      - call: GET /commercial/commercial-accounts/${acct}
        payload: {}
        as: CommercialSalesRep
        captures:
          acct_v_fresh: $.data.version
      - call: POST /commercial/part-orders
        payload:
          account_id: ${acct}
          line_items:
          - part_id: ${p_o}
            quantity: 1
          expected_account_version: ${acct_v_fresh}
        as: CommercialSalesRep
      assert:
      - the first create succeeds and CommercialAccount.${acct}.version advances to 2
      - the second create carrying the stale version is rejected with status 412 and ${err_id} == "ERR_STALE_ACCOUNT_VERSION"
      - the third create carrying the freshly read version succeeds
      - CommercialAccount.${acct}.order_sequence == 2 and only two orders exist
      - commercial-accounts read reports version 4 after three mutating calls, and the two live orders carry member_sequence 1 and 2
  - name: loan_checkout_occ_rejects_a_stale_account_version
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[loan-checkout-stale-account]
    - errors[ERR_STALE_ACCOUNT_VERSION]
    distinguishing_aspect: 'The same OCC mechanism on a different parent write endpoint: the checkout carries the version the client last read, and a deposit take that happened in between makes that version stale.'
    test_recipe:
