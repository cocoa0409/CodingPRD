# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 for task_2483 (microtransit-on-demand)
#
# Fixture conventions used throughout (all literals pinned, no wall clock):
#   * The logical clock's startup default is 2026-08-01T00:00:00Z; every recipe
#     sets it explicitly. 2026-08-03 is a Monday, so the ISO-week fare-cap
#     window and the UTC service date coincide for the whole fixture day.
#   * Primary zone "RBM": max_walk_meters 600, detour_tolerance_pct 0.25,
#     detour_tolerance_floor_minutes 6, base_fare_cents 250,
#     fare_cap_cents_daily 600, fare_cap_cents_weekly 2500,
#     on_time_window_minutes 10, curb_capacity_per_bucket 2.
#   * Corridor stops are named by their corridor_index (S0, S4, S6, S7, S10);
#     TRAVEL_MINUTES_PER_INDEX = 3, so S0->S4 is a 12-minute baseline ride.
#   * Every numeric literal in every `assert:` below was computed by executing
#     the §1.3 formula against these fixtures.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: trip_fare_provisional_quote_vs_settled_charge_band_shift
        grounds:
          - calculations.trip_fare
          - calculations.corridor_travel_geometry
          - entities.TripRequest.fields.quoted_fare_cents
          - entities.TripRequest.fields.charged_fare_cents
          - state_machines.TripRequest.fare_status.QUOTED_to_CHARGED
        distinguishing_aspect: |
          The two variants read different minute bases for the SAME trip — PROVISIONAL_QUOTE
          uses PoolAssignment.baseline_direct_minutes (12, MEDIUM band, 75c surcharge) while
          SETTLED_CHARGE uses the measured TripRequest.ride_minutes (22, LONG band, 150c
          surcharge) — so the quote is 325 and the charge is 400, a 75-cent divergence on
          one unmodified trip row.
        test_recipe:
          setup:
            - "Zone RBM ACTIVE with base_fare_cents 250, fare_cap_cents_daily 600, fare_cap_cents_weekly 2500."
            - "Approved stops S0 (corridor_index 0) and S4 (corridor_index 4); baseline_direct_minutes = 3 * 4 = 12."
            - "Vehicle V1 (6 seats, 2 securement positions) and Driver D1 (wav_certified) on OPEN block B1 spanning 06:00-10:00Z on 2026-08-03."
            - "Rider R1 with fare_category FULL and no prior fare transactions, so both cap counters are 0."
            - "Trip T1 S0->S4 requested for 07:00Z, party_size 1, no fixed-route connection, already OFFERED on B1 (fare_status QUOTED)."
            - "The ride is then driven slowly: boarded exactly at 07:00Z and dropped off at 07:22Z, so ride_minutes = 22."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S0", corridor_index: 0, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s0_id: $.data.id }
            - call: "POST /virtual-stops/${s0_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S4", corridor_index: 4, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s4_id: $.data.id }
            - call: "POST /virtual-stops/${s4_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D1", wav_certified: true }
              as: ZoneAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /riders"
              payload: { zone_id: "${z_id}", rider_code: "R1", fare_category: "FULL", mobility_device: "NONE" }
              as: ZoneAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d1_id}", block_type: "BASE", start_utc: "2026-08-03T06:00:00Z", end_utc: "2026-08-03T10:00:00Z" }
              as: Dispatcher
              captures: { b1_id: $.data.id }
            - call: "POST /vehicle-blocks/${b1_id}/open"
              payload: {}
              as: Dispatcher
              captures: { b1_v: $.data.version }
            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${r1_id}", origin_stop_id: "${s0_id}", destination_stop_id: "${s4_id}", requested_pickup_utc: "2026-08-03T07:00:00Z", party_size: 1 }
              as: Rider
              as_user_id: "${r1_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /pool-assignments"
              payload: { trip_request_id: "${t1_id}", block_id: "${b1_id}", expected_vehicle_block_version: "${b1_v}" }
              as: Dispatcher
              captures: { pa1_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00Z" }
              as: Dispatcher
            - call: "POST /pool-assignments/${pa1_id}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d1_id}"
            - call: "POST /pool-assignments/${pa1_id}/board"
              payload: {}
              as: DriverUser
              as_user_id: "${d1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:22:00Z" }
              as: Dispatcher
            - call: "POST /pool-assignments/${pa1_id}/complete"
              payload: {}
              as: DriverUser
              as_user_id: "${d1_id}"
          assert:
            - "TripRequest.${t1_id}.baseline_direct_minutes == 12"
            - "TripRequest.${t1_id}.quoted_fare_cents == 325"
            - "TripRequest.${t1_id}.ride_minutes == 22"
            - "TripRequest.${t1_id}.charged_fare_cents == 400"
            - "TripRequest.${t1_id}.charged_fare_cents - TripRequest.${t1_id}.quoted_fare_cents == 75"
            - "TripRequest.${t1_id}.applied_cap == NONE"
            - "TripRequest.${t1_id}.wait_minutes == 0"
            - "TripRequest.${t1_id}.fare_status == CHARGED"
            - "GET /fare-transactions?trip_request_id=${t1_id} returns exactly 1 row with kind == CHARGE and amount_cents == 400"
            - "Rider.${r1_id}.daily_fare_paid_cents == 400"

      - name: subsidy_per_trip_provisional_vs_final_scope_and_hours_diverge
        grounds:
          - calculations.subsidy_per_trip
          - entities.SubsidyReport.fields.total_operating_cost_cents
          - entities.SubsidyReport.fields.subsidy_per_trip_cents
          - entities.VehicleBlock.fields.scheduled_revenue_hours
          - entities.VehicleBlock.fields.actual_revenue_hours
        distinguishing_aspect: |
          Divergence here is structural rather than band-driven and lives on a different entity
          than the trip_fare instance: PROVISIONAL sums scheduled_revenue_hours over blocks in
          {SCHEDULED, OPEN, CLOSED} and counts trips in {ASSIGNED, PICKED_UP, COMPLETED}
          (64680c less 325c revenue over 2 trips -> 32178c per trip), while FINAL sums actual_revenue_hours over
          CLOSED blocks only and counts COMPLETED trips only (13860c less 325c over 1 trip -> 13535c).
        test_recipe:
          setup:
            - "Zone RBM ACTIVE, stops S0/S4/S6/S10 approved, logical clock walked across 2026-08-03."
            - "Block B1 (V1/D1) scheduled 06:00-10:00Z => scheduled_revenue_hours 4.00; opened at 06:00Z and closed at 07:30Z => actual_revenue_hours 1.50."
            - "Block B2 (V2/D2) scheduled 06:00-09:00Z => scheduled_revenue_hours 3.00; opened and left OPEN, so actual_revenue_hours stays 0.00."
            - "Trip T1 (R1, S0->S4, FULL) runs on B1 and reaches COMPLETED with charged_fare_cents 325 (ride_minutes 12, MEDIUM band, no cap)."
            - "Trip T2 (R2, S6->S10, FULL) is offered on B2 and only ACCEPTED, never boarded, so it holds status ASSIGNED and fare_status QUOTED with no ledger rows."
            - "Two reports are then opened over 2026-08-01..2026-08-31 for the same zone, one per variant (the overlap rule is variant-scoped, so both are permitted)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S0", corridor_index: 0, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s0_id: $.data.id }
            - call: "POST /virtual-stops/${s0_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S4", corridor_index: 4, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s4_id: $.data.id }
            - call: "POST /virtual-stops/${s4_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S6", corridor_index: 6, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s6_id: $.data.id }
            - call: "POST /virtual-stops/${s6_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S10", corridor_index: 10, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s10_id: $.data.id }
            - call: "POST /virtual-stops/${s10_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V2", seat_capacity: 6, wav_positions: 0 }
              as: ZoneAdmin
              captures: { v2_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D1", wav_certified: true }
              as: ZoneAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D2", wav_certified: false }
              as: ZoneAdmin
              captures: { d2_id: $.data.id }
            - call: "POST /riders"
              payload: { zone_id: "${z_id}", rider_code: "R1", fare_category: "FULL", mobility_device: "NONE" }
              as: ZoneAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /riders"
              payload: { zone_id: "${z_id}", rider_code: "R2", fare_category: "FULL", mobility_device: "NONE" }
              as: ZoneAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d1_id}", block_type: "BASE", start_utc: "2026-08-03T06:00:00Z", end_utc: "2026-08-03T10:00:00Z" }
              as: Dispatcher
              captures: { b1_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v2_id}", driver_id: "${d2_id}", block_type: "BASE", start_utc: "2026-08-03T06:00:00Z", end_utc: "2026-08-03T09:00:00Z" }
              as: Dispatcher
              captures: { b2_id: $.data.id }
            - call: "POST /vehicle-blocks/${b1_id}/open"
              payload: {}
              as: Dispatcher
              captures: { b1_v: $.data.version }
            - call: "POST /vehicle-blocks/${b2_id}/open"
              payload: {}
              as: Dispatcher
              captures: { b2_v: $.data.version }
            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${r1_id}", origin_stop_id: "${s0_id}", destination_stop_id: "${s4_id}", requested_pickup_utc: "2026-08-03T07:00:00Z", party_size: 1 }
              as: Rider
              as_user_id: "${r1_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /pool-assignments"
              payload: { trip_request_id: "${t1_id}", block_id: "${b1_id}", expected_vehicle_block_version: "${b1_v}" }
              as: Dispatcher
              captures: { pa1_id: $.data.id }
            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${r2_id}", origin_stop_id: "${s6_id}", destination_stop_id: "${s10_id}", requested_pickup_utc: "2026-08-03T07:00:00Z", party_size: 1 }
              as: Rider
              as_user_id: "${r2_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /pool-assignments"
              payload: { trip_request_id: "${t2_id}", block_id: "${b2_id}", expected_vehicle_block_version: "${b2_v}" }
              as: Dispatcher
              captures: { pa2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00Z" }
              as: Dispatcher
            - call: "POST /pool-assignments/${pa1_id}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d1_id}"
            - call: "POST /pool-assignments/${pa1_id}/board"
              payload: {}
              as: DriverUser
              as_user_id: "${d1_id}"
            - call: "POST /pool-assignments/${pa2_id}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:12:00Z" }
              as: Dispatcher
            - call: "POST /pool-assignments/${pa1_id}/complete"
              payload: {}
              as: DriverUser
              as_user_id: "${d1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:30:00Z" }
              as: Dispatcher
            - call: "POST /vehicle-blocks/${b1_id}/close"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /subsidy-reports"
              payload: { zone_id: "${z_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", variant: "PROVISIONAL" }
              as: FinanceAnalyst
              as_user_id: "fa-1"
              captures: { rep_prov_id: $.data.id }
            - call: "POST /subsidy-reports/${rep_prov_id}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "fa-1"
            - call: "POST /subsidy-reports"
              payload: { zone_id: "${z_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", variant: "FINAL" }
              as: FinanceAnalyst
              as_user_id: "fa-1"
              captures: { rep_final_id: $.data.id }
            - call: "POST /subsidy-reports/${rep_final_id}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "fa-1"
          assert:
            - "VehicleBlock.${b1_id}.scheduled_revenue_hours == 4.00"
            - "VehicleBlock.${b1_id}.actual_revenue_hours == 1.50"
            - "VehicleBlock.${b2_id}.scheduled_revenue_hours == 3.00"
            - "VehicleBlock.${b2_id}.actual_revenue_hours == 0.00"
            - "SubsidyReport.${rep_prov_id}.total_operating_cost_cents == 64680"
            - "SubsidyReport.${rep_prov_id}.total_trips == 2"
            - "SubsidyReport.${rep_prov_id}.total_fare_revenue_cents == 325"
            - "SubsidyReport.${rep_prov_id}.subsidy_per_trip_cents == 32178"
            - "SubsidyReport.${rep_final_id}.total_operating_cost_cents == 13860"
            - "SubsidyReport.${rep_final_id}.total_trips == 1"
            - "SubsidyReport.${rep_final_id}.total_fare_revenue_cents == 325"
            - "SubsidyReport.${rep_final_id}.subsidy_per_trip_cents == 13535"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pool_match_score_seat_slack_saturation_forces_tiebreak
        grounds:
          - calculations.pool_match_selection
          - calculations.corridor_travel_geometry
          - entities.PoolAssignment.fields.match_score
          - entities.TripRequest.fields.assigned_block_id
        distinguishing_aspect: |
          Mode (a) — nested min/max: the seat-slack term is min(SEAT_SLACK_CAP=12, remaining_seats)
          * SEAT_SLACK_WEIGHT=2, so a 20-seat block (19 slack) and a 14-seat block (13 slack) both
          saturate at 12 and score exactly 24, and the winner is decided by the pinned tie-break
          (start_utc ASC) rather than by the arithmetic. Without the inner min the scores would be
          38 and 26 and the 14-seat block would win, so the assertion falsifies a non-saturating
          implementation.
        test_recipe:
          setup:
            - "Zone RBM ACTIVE; stops S0 and S4 approved (baseline_direct_minutes 12, detour allowance max(6, ceil(12*0.25)=3) = 6)."
            - "Block BA: BASE, vehicle VA with seat_capacity 20, driver DA, window 06:00-10:00Z, OPEN, no assignments (committed_index_min null)."
            - "Block BB: BASE, vehicle VB with seat_capacity 14, driver DB, window 06:30-10:00Z, OPEN, no assignments."
            - "Trip T1: rider R1 FULL, S0->S4, requested_pickup 07:00Z (inside both windows), party_size 1, no connection, status RECEIVED."
            - "Both blocks are therefore eligible with projected_detour_minutes 0; scores are BA = min(100,0) + 0 + 0 + min(12,19)*2 = 24 and BB = min(100,0) + 0 + 0 + min(12,13)*2 = 24."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S0", corridor_index: 0, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s0_id: $.data.id }
            - call: "POST /virtual-stops/${s0_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S4", corridor_index: 4, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s4_id: $.data.id }
            - call: "POST /virtual-stops/${s4_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "VA", seat_capacity: 20, wav_positions: 0 }
              as: ZoneAdmin
              captures: { va_id: $.data.id }
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "VB", seat_capacity: 14, wav_positions: 0 }
              as: ZoneAdmin
              captures: { vb_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "DA", wav_certified: false }
              as: ZoneAdmin
              captures: { da_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "DB", wav_certified: false }
              as: ZoneAdmin
              captures: { db_id: $.data.id }
            - call: "POST /riders"
              payload: { zone_id: "${z_id}", rider_code: "R1", fare_category: "FULL", mobility_device: "NONE" }
              as: ZoneAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${va_id}", driver_id: "${da_id}", block_type: "BASE", start_utc: "2026-08-03T06:00:00Z", end_utc: "2026-08-03T10:00:00Z" }
              as: Dispatcher
              captures: { ba_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${vb_id}", driver_id: "${db_id}", block_type: "BASE", start_utc: "2026-08-03T06:30:00Z", end_utc: "2026-08-03T10:00:00Z" }
              as: Dispatcher
              captures: { bb_id: $.data.id }
            - call: "POST /vehicle-blocks/${ba_id}/open"
              payload: {}
              as: Dispatcher
            - call: "POST /vehicle-blocks/${bb_id}/open"
              payload: {}
              as: Dispatcher
            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${r1_id}", origin_stop_id: "${s0_id}", destination_stop_id: "${s4_id}", requested_pickup_utc: "2026-08-03T07:00:00Z", party_size: 1 }
              as: Rider
              as_user_id: "${r1_id}"
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /trip-requests/${t1_id}/match"
              payload: {}
              as: Dispatcher
          assert:
            - "TripRequest.${t1_id}.status == OFFERED"
            - "TripRequest.${t1_id}.assigned_block_id == ${ba_id}"
            - "TripRequest.${t1_id}.match_attempt_count == 1"
            - "GET /pool-assignments?trip_request_id=${t1_id} returns exactly 1 row"
            - "that PoolAssignment.block_id == ${ba_id}"
            - "that PoolAssignment.match_score == 24"
            - "that PoolAssignment.offer_origin == AUTO_MATCH"
            - "that PoolAssignment.projected_detour_minutes == 0"
            - "VehicleBlock.${bb_id}.seats_committed == 0"

      - name: operating_cost_rounds_per_block_before_summing
        grounds:
          - calculations.subsidy_per_trip
          - entities.VehicleBlock.fields.scheduled_revenue_hours
          - entities.SubsidyReport.fields.total_operating_cost_cents
        distinguishing_aspect: |
          Mode (b) — rounding-order sensitivity: with two blocks of 2.01 h and 1.01 h the exact
