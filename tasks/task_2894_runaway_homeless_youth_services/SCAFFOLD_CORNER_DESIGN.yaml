      - name: escalated_screening_outranks_the_age_band_on_admission
        claim_type: priority_ordering
        grounds:
          - validations[priority=19]
          - validations[priority=25]
          - errors.ERR_SCREENING_ESCALATED_BLOCKS_ACTION
        distinguishing_aspect: "One request violates priority 19 (latest screening ESCALATED) and priority 25 (age 11 below the 12..17 band) at once; the response is ERR_SCREENING_ESCALATED_BLOCKS_ACTION, never ERR_AGE_OUTSIDE_PROGRAM_BAND, because the safety gate is evaluated first."
        test_recipe:
          setup:
            - "an OPEN EMERGENCY_SHELTER program with age band 12..17 and free beds"
            - "youth Bram Osei, dob 2015-03-15 (age 11), whose only SafetyScreening was dispositioned ESCALATED with specialized_response_code LAW_ENFORCEMENT_LIAISON, so risk_posture is FROZEN"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
