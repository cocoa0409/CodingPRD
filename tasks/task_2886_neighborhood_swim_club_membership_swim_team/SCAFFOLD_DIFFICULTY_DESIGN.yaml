            - call: "POST /swim-club/conduct-cases"
              payload: { household_id: "${h_a_id}", subject_name: "Guest of the Alvarez household", severity: "MAJOR", narrative: "Repeated refusal to leave the deck at closing after a lifeguard instruction." }
              as: PoolManager
