            - { call: "GET /um/determinations", payload: { request_id: "${d1r}" }, as: UMAdmin, captures: { det1: "$.data[0].id" } }
            - { call: "GET /um/determinations", payload: { request_id: "${d2r}" }, as: UMAdmin, captures: { det2: "$.data[0].id" } }
            - { call: "POST /um/determinations/${det1}/void", payload: {}, as: UMAdmin }
            - { call: "POST /um/determinations/${det2}/void", payload: {}, as: UMAdmin }
            - { call: "GET /um/providers/${p_id}", payload: {}, as: UMAdmin, captures: { cnt_after_void: $.data.rolling_determination_count, rate_after_void: $.data.rolling_approval_rate } }
          trigger:
            - { call: "POST /um/providers/${p_id}/gold-card-evaluations", payload: { service_category: "IMAGING" }, as: UMAdmin, captures: { decision2: $.data.decision } }
