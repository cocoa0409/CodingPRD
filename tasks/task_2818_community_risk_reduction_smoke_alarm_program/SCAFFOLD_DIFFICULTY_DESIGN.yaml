  - rule_id: boundary_precision_check
    instances:
      - name: risk_tier_boundary_at_exactly_seventy_points_is_tier_1
        grounds:
          - calculations.zone_risk_score
          - entities.ZoneAssessment.fields.risk_tier
          - endpoints[POST /crr/zones/{id}/assessments]
        distinguishing_aspect: |
          Metric under test: risk_score against the TIER_1 lower bound, on the assessments endpoint.
          The bound is inclusive, so 70.00 is TIER_1 while 69.99 is TIER_2. The two zones differ only
          in assumed_alarm_absence_pct (66.0 vs 65.9), which moves alarm_points by 0.01 - proving
          the comparison is >= 70.00 and that alarm_points is rounded to 2 decimals, not truncated.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Two zones identical except for assumed_alarm_absence_pct: Z-EDGE-HI at 66.0 and Z-EDGE-LO at 65.9."
            - "Both have occupied_units 2000, 20 structure fires and 2 injuries over 5 years, pre_1980_unit_pct 60.0 and 25.0/10.0/5.0 senior/under-5/disability percentages, giving 63.40 points before the alarm term."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-EDGE-HI", name: "Edge High", occupied_units: 2000, structure_fire_count_5yr: 20, fire_injury_count_5yr: 2, pre_1980_unit_pct: 60.0, senior_household_pct: 25.0, under5_household_pct: 10.0, disability_household_pct: 5.0, assumed_alarm_absence_pct: 66.0, daily_visit_cap: 8 }
              as: RiskAnalyst
              captures: { z_hi_id: $.data.id, z_hi_v0: $.data.version }
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-EDGE-LO", name: "Edge Low", occupied_units: 2000, structure_fire_count_5yr: 20, fire_injury_count_5yr: 2, pre_1980_unit_pct: 60.0, senior_household_pct: 25.0, under5_household_pct: 10.0, disability_household_pct: 5.0, assumed_alarm_absence_pct: 65.9, daily_visit_cap: 8 }
              as: RiskAnalyst
              captures: { z_lo_id: $.data.id, z_lo_v0: $.data.version }
          trigger:
            - call: "POST /crr/zones/${z_hi_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_hi_v0}" }
              as: RiskAnalyst
              captures: { a_hi_id: $.data.id }
            - call: "POST /crr/zones/${z_lo_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_lo_v0}" }
              as: RiskAnalyst
              captures: { a_lo_id: $.data.id }
          assert:
            - "ZoneAssessment.${a_hi_id}.incident_points == 40.00"
            - "ZoneAssessment.${a_hi_id}.injury_points == 10.00"
            - "ZoneAssessment.${a_hi_id}.building_points == 9.00"
            - "ZoneAssessment.${a_hi_id}.vulnerability_points == 4.40"
            - "ZoneAssessment.${a_hi_id}.alarm_points == 6.60"
            - "ZoneAssessment.${a_hi_id}.risk_score == 70.00"
            - "ZoneAssessment.${a_hi_id}.risk_tier == TIER_1"
            - "ZoneAssessment.${a_lo_id}.alarm_points == 6.59"
            - "ZoneAssessment.${a_lo_id}.risk_score == 69.99"
            - "ZoneAssessment.${a_lo_id}.risk_tier == TIER_2"
            - "RiskZone.${z_hi_id}.risk_tier == TIER_1"
            - "RiskZone.${z_lo_id}.risk_tier == TIER_2"

