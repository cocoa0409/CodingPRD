      - name: open_corrections_outrank_the_quality_index_gate_on_certify
        claim_type: priority_ordering
        grounds:
          - validations[priority=67]
          - validations[priority=68]
          - validations[priority=69]
          - validations[priority=46]
          - calculations.event_tag_quality_index
        distinguishing_aspect: |
          With the single accepted tag pulled into UNDER_CORRECTION the game has accepted_tag_count 0 AND
          under_correction_tag_count 1, so rules 67 and 68 are violated together: the answer must be
          ERR_OPEN_CORRECTIONS. Rejecting the correction returns the tag to ACCEPTED but stamps the 0.25
          rejected-correction penalty, dropping quality_index to 0.7250, so the next certify attempt must
          reach ERR_QUALITY_INDEX_BELOW_THRESHOLD (69) rather than 67 or 68. A second resolution of the same
          request is refused by rule 46.
