  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_AUTH_HEADER]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID fails 401 ERR_MISSING_AUTH_HEADER at priority 1, before any role or existence check (the test harness strips the headers on this call)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/markets"
              payload: { name: "NoAuth", state_code: "TX", population: 500000, median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response 401 ERR_MISSING_AUTH_HEADER (headers omitted at the HTTP layer for this call)"

      - name: role_denial_precedes_existence
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "A RealEstateAnalyst calling withdraw on a NON-EXISTENT site id gets 403 ERR_FORBIDDEN_ROLE, not 404 — authorization (priority 2) is evaluated before existence (priority 3)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/sites/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/withdraw"
              payload: {}
              as: RealEstateAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "Response 403 ERR_FORBIDDEN_ROLE (role check wins over the unknown path id)"

      - name: existence_precedes_occ_and_state
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Locking a non-existent model id returns 404 ERR_NOT_FOUND even though the payload's expected_site_version would also fail — existence (3) precedes OCC (4) and state (5)."
        test_recipe:
          setup: ["QUALIFIED market; site SCREENED (so a real site exists to reference in the version field)"]
          setup_api_calls:
            - call: "POST /api/markets"
              payload: { name: "Metro EO", state_code: "TX", population: 500000, median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /api/markets/${mkt_id}/evaluate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { market_id: "${mkt_id}", address: "5 Elm St", format_type: "STANDARD", square_footage: 10000, asking_rent_psf_cents: 3000, cam_psf_cents: 800, tax_psf_cents: 400, build_cost_cents: 500000000 }
              as: RealEstateAnalyst
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/run-screening"
              payload: {}
              as: RealEstateAnalyst
            - call: "GET /api/sites/${site_id}"
              as: RealEstateAnalyst
              captures: { site_v: $.data.version }
          trigger:
            - call: "POST /api/trade-area-models/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/lock"
              payload: { expected_site_version: "${site_v}" }
              as: RealEstateAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "Response 404 ERR_NOT_FOUND (unknown model id; OCC and state checks never reached)"

