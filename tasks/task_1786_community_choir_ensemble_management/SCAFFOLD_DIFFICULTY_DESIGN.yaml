          assert:
            - "Concert.${c_id}.status == CANCELLED"
            - "VenueBooking.${b_id}.status == RELEASED (link 1) and deposit refunded (link 2)"
            - "ProgramPiece.${p_id}.status == VOID (link 1b)"
            - "GuestContract.${gc}.status == CANCELLED (link 2b) with cancellation_fee_cents == 6000 (link 3b = round_half_up(0.20 * 30000))"
            - "Season.${s_id}.treasury_balance_cents == 12000"

      - name: member_drop_depth2_cascade
        grounds:
          - state_machines.Member.ACTIVE_to_DROPPED
          - state_machines.ScoreCheckout.CHECKED_OUT_to_LOST
          - entities.MusicScore.fields.copies_lost
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (member DROP, not concert cancel):
          DROP -> checkout LOST -> replacement charge 7000 posted to member ledger
          and score.copies_lost incremented.
        test_recipe:
          setup:
            - "Season OPEN; member ACTIVE (dues paid); score with copy_count 2, replacement 7000; one checkout CHECKED_OUT"
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 2 }, as: ChoirDirector, captures: { sec_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
            - { call: "POST /v1/auditions/${a_id}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a_id}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/dues-invoices", payload: { member_id: "${m_id}" }, as: Treasurer }
            - { call: "POST /v1/dues-payments", payload: { member_id: "${m_id}", amount_cents: 18000, method: "CARD" }, as: Treasurer }
            - { call: "POST /v1/music-scores", payload: { title: "Mass in G", copy_count: 2, replacement_cost_cents: 7000 }, as: Librarian, captures: { sc: $.data.id } }
            - { call: "POST /v1/score-checkouts", payload: { score_id: "${sc}", member_id: "${m_id}", due_date: "2026-08-10T00:00:00Z" }, as: Librarian, captures: { co: $.data.id } }
          trigger:
            - { call: "POST /v1/members/${m_id}/status", payload: { action: "DROP" }, as: ChoirDirector }
          assert:
            - "Member.${m_id}.status == DROPPED"
            - "ScoreCheckout.${co}.status == LOST (link 1)"
            - "ScoreCheckout.${co}.charge_cents == 7000"
            - "Member.${m_id}.ledger_balance_cents == 7000 (link 2)"
            - "MusicScore.${sc}.copies_lost == 1 and copies_available == 1"

  # ---------------------------------------------------------------- rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: grant_apply_state_beats_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - errors[ERR_GRANT_NOT_APPROVED]
          - errors[ERR_GRANT_EXCEEDS_INVOICE_BALANCE]
        distinguishing_aspect: |
          Pair state-vs-business_fiscal: apply on a REQUESTED grant with an
          amount exceeding the invoice balance returns ERR_GRANT_NOT_APPROVED
          (priority 8), not the fiscal error (priority 13).
        test_recipe:
          setup:
            - "Season OPEN; member ENROLLED with invoice PAID in full (18000); grant REQUESTED for 5000 (never approved)"
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 2 }, as: ChoirDirector, captures: { sec_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
            - { call: "POST /v1/auditions/${a_id}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a_id}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/dues-invoices", payload: { member_id: "${m_id}" }, as: Treasurer, captures: { inv: $.data.id } }
            - { call: "POST /v1/dues-payments", payload: { member_id: "${m_id}", amount_cents: 18000, method: "CARD" }, as: Treasurer }
            - { call: "POST /v1/scholarship-grants", payload: { member_id: "${m_id}", requested_cents: 5000 }, as: Treasurer, captures: { g_id: $.data.id } }
          trigger:
            - { call: "POST /v1/scholarship-grants/${g_id}/apply", payload: { invoice_id: "${inv}", amount_cents: 999999 }, as: Treasurer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_GRANT_NOT_APPROVED (state priority 8 beats fiscal priority 13)"
            - "ScholarshipGrant.${g_id}.status unchanged == REQUESTED"

      - name: venue_overlap_beats_lead_time
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_VENUE_OVERLAP]
          - errors[ERR_BOOKING_LEAD_TIME]
        distinguishing_aspect: |
          Pair business_constraint-vs-business_temporal (different pair than
          state-vs-fiscal): a booking that overlaps AND violates the 72h lead
          returns ERR_VENUE_OVERLAP (priority 11), not ERR_BOOKING_LEAD_TIME (12).
        test_recipe:
          setup:
            - "Season REHEARSING; venue; concert; existing booking 2026-09-10 18:00-21:00 REQUESTED; clock at 2026-09-08"
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 2 }, as: ChoirDirector, captures: { sec_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
            - { call: "POST /v1/auditions/${a_id}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a_id}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/dues-invoices", payload: { member_id: "${m_id}" }, as: Treasurer }
            - { call: "POST /v1/dues-payments", payload: { member_id: "${m_id}", amount_cents: 18000, method: "CARD" }, as: Treasurer }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "REHEARSING" }, as: President }
            - { call: "POST /v1/venues", payload: { name: "Hall", capacity: 100 }, as: President, captures: { v_id: $.data.id } }
            - { call: "POST /v1/concerts", payload: { season_id: "${s_id}", title: "Gala", expected_attendance: 80 }, as: ChoirDirector, captures: { c1: $.data.id } }
            - { call: "POST /v1/venue-bookings", payload: { concert_id: "${c1}", venue_id: "${v_id}", start_at: "2026-09-10T18:00:00Z", end_at: "2026-09-10T21:00:00Z", deposit_cents: 1000 }, as: ChoirDirector }
            - { call: "POST /v1/concerts", payload: { season_id: "${s_id}", title: "Gala 2", expected_attendance: 50 }, as: ChoirDirector, captures: { c2: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-08T00:00:00Z" }, as: President }
          trigger:
            - { call: "POST /v1/venue-bookings", payload: { concert_id: "${c2}", venue_id: "${v_id}", start_at: "2026-09-10T20:00:00Z", end_at: "2026-09-10T22:00:00Z", deposit_cents: 1000 }, as: ChoirDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VENUE_OVERLAP (constraint priority 11 beats temporal priority 12)"

  # ---------------------------------------------------------------- rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: attendance_threshold_exact_boundary
        grounds:
          - calculations.performance_eligibility
          - calculations.attendance_rate
          - entities.Member.fields.performance_eligible
        distinguishing_aspect: |
          Rate metric boundary: exactly 0.75 (3 PRESENT + 1 ABSENT_UNEXCUSED over
          4 counted rehearsals) satisfies the >= threshold and stays eligible.
        test_recipe:
          setup:
            - "Season REHEARSING; one ACTIVE member; 4 rehearsals held; records P,P,P,U; clock 2026-08-27"
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000, attendance_threshold: 0.75 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 2 }, as: ChoirDirector, captures: { sec_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
            - { call: "POST /v1/auditions/${a_id}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a_id}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/dues-invoices", payload: { member_id: "${m_id}" }, as: Treasurer }
            - { call: "POST /v1/dues-payments", payload: { member_id: "${m_id}", amount_cents: 18000, method: "CARD" }, as: Treasurer }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "REHEARSING" }, as: President }
            - { call: "POST /v1/rehearsals", payload: { season_id: "${s_id}", scheduled_at: "2026-08-05T19:00:00Z" }, as: ChoirDirector, captures: { r1: $.data.id } }
            - { call: "POST /v1/rehearsals", payload: { season_id: "${s_id}", scheduled_at: "2026-08-12T19:00:00Z" }, as: ChoirDirector, captures: { r2: $.data.id } }
            - { call: "POST /v1/rehearsals", payload: { season_id: "${s_id}", scheduled_at: "2026-08-19T19:00:00Z" }, as: ChoirDirector, captures: { r3: $.data.id } }
            - { call: "POST /v1/rehearsals", payload: { season_id: "${s_id}", scheduled_at: "2026-08-26T19:00:00Z" }, as: ChoirDirector, captures: { r4: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-27T00:00:00Z" }, as: President }
            - { call: "POST /v1/rehearsals/${r1}/attendance", payload: { records: [ { member_id: "${m_id}", status: "PRESENT" } ] }, as: ChoirDirector }
            - { call: "POST /v1/rehearsals/${r2}/attendance", payload: { records: [ { member_id: "${m_id}", status: "PRESENT" } ] }, as: ChoirDirector }
            - { call: "POST /v1/rehearsals/${r3}/attendance", payload: { records: [ { member_id: "${m_id}", status: "PRESENT" } ] }, as: ChoirDirector }
          trigger:
            - { call: "POST /v1/rehearsals/${r4}/attendance", payload: { records: [ { member_id: "${m_id}", status: "ABSENT_UNEXCUSED" } ] }, as: ChoirDirector }
            - { call: "GET /v1/members/${m_id}", payload: {}, as: ChoirDirector }
          assert:
            - "Member.${m_id}.attendance_rate == 0.75 exactly"
            - "Member.${m_id}.performance_eligible == true (>= threshold, not >)"

      - name: scholarship_pool_exact_boundary
        grounds:
          - calculations.scholarship_pool_ledger
          - validations[priority=13]
          - errors[ERR_SCHOLARSHIP_POOL_EXHAUSTED]
        distinguishing_aspect: |
          Cents metric on a different endpoint (grant decision, not attendance):
          approved amount exactly equal to pool_available succeeds; one cent more
          on a subsequent grant fails.
        test_recipe:
          setup:
            - "Season OPEN with scholarship_pool_cents 50000; member ENROLLED; grant1 REQUESTED 50000; grant2 REQUESTED 1"
          setup_api_calls:
            - { call: "POST /v1/seasons", payload: { name: "Fall", base_dues_cents: 20000, early_bird_pct: 0.10, early_bird_cutoff: "2026-08-15T00:00:00Z", dues_due_date: "2026-09-01T00:00:00Z", late_fee_weekly_cents: 500, late_fee_cap_cents: 2000, scholarship_pool_cents: 50000 }, as: President, captures: { s_id: $.data.id } }
            - { call: "POST /v1/sections", payload: { season_id: "${s_id}", voice_part: "SOPRANO", target_min: 1, target_max: 2 }, as: ChoirDirector, captures: { sec_id: $.data.id } }
            - { call: "POST /v1/seasons/${s_id}/posture", payload: { posture: "OPEN" }, as: President }
            - { call: "POST /v1/members", payload: { season_id: "${s_id}", full_name: "Ada", email: "ada@x.org" }, as: ChoirDirector, captures: { m_id: $.data.id } }
            - { call: "POST /v1/auditions", payload: { member_id: "${m_id}", scheduled_at: "2026-08-02T10:00:00Z" }, as: ChoirDirector, captures: { a_id: $.data.id } }
            - { call: "POST /v1/auditions/${a_id}/score", payload: { tone_score: 8, pitch_score: 7, sight_score: 9 }, as: ChoirDirector }
            - { call: "POST /v1/auditions/${a_id}/decision", payload: { decision: "ACCEPT", section_id: "${sec_id}" }, as: ChoirDirector }
            - { call: "POST /v1/scholarship-grants", payload: { member_id: "${m_id}", requested_cents: 50000 }, as: Treasurer, captures: { g1: $.data.id } }
            - { call: "POST /v1/scholarship-grants", payload: { member_id: "${m_id}", requested_cents: 1 }, as: Treasurer, captures: { g2: $.data.id } }
          trigger:
            - { call: "POST /v1/scholarship-grants/${g1}/decision", payload: { decision: "APPROVE" }, as: Treasurer }
            - { call: "POST /v1/scholarship-grants/${g2}/decision", payload: { decision: "APPROVE" }, as: Treasurer, captures: { err: $.data.error_id } }
            - { call: "GET /v1/seasons/${s_id}", payload: {}, as: Treasurer }
          assert:
            - "ScholarshipGrant.${g1}.approved_cents == 50000 and status == APPROVED (exact-equality boundary passes)"
            - "Grant2 decision error_id == ERR_SCHOLARSHIP_POOL_EXHAUSTED (pool_available == 0)"
            - "Season.${s_id}.pool_available_cents == 0 and pool_reserved_cents == 50000"

