  # ===========================================================================
  # RULE 9 - compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: settlement_void_restores_accrued_penalty_and_open_notice_count
        grounds:
          - state_machines.Settlement.EXECUTED_to_VOID
          - state_machines.NoticeOfViolation.SETTLED_to_SETTLEMENT_NEGOTIATION
          - entities.Product.fields.accrued_penalty_cents
          - entities.Product.fields.open_notice_count
          - calculations.settlement_money
          - validations[priority=93]
        distinguishing_aspect: |
          VOID must reverse every one of ACCEPT_EXECUTE's three cascade levels exactly - the same
          adjusted_penalty_cents is subtracted back out, open_notice_count returns to its
          pre-execution value, the notice returns from SETTLED to SETTLEMENT_NEGOTIATION and the
          posture re-enters ENFORCEMENT_HOLD - so an implementation that recomputes accrued penalty
          from scratch, or that only re-opens the notice without unwinding the money, leaves drift.
        test_recipe:
          setup:
            - "Benzene is LISTED. Product SKU-CI1 has ZERO ProductComponent rows, so warranty_defense_applies is false and mitigation_factor is exactly 1.0."
            - "The logical clock is 2026-08-01T00:00:00Z."
            - "A PRIVATE_PARTY notice alleges 4000 units with earliest_violation_date 2026-06-01 and served_at 2026-07-01, so violation_days is 61 at settlement create."
            - "base_penalty_cents = min(250000 x 61 = 15250000, 500 x 4000 = 2000000) = 2000000; mitigation_factor 1.0; adjusted_penalty_cents 2000000; fee_cap_cents = 2000000 x 0.60 = 1200000; requested fees 300000 so allowed_fees_cents 300000; state_share_cents 1500000; noticing_party_share_cents 500000; total_settlement_cents 2300000."
            - "reformulation_commitment is false, so the VOID-blocking rule at priority 93 cannot fire."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Benzene", cas_number: "71-43-2", endpoint_type: "CANCER", safe_harbor_basis: "NSRL", safe_harbor_level_ug_per_day: 6.4 }
              as: RegistryAdmin
              captures: { chem_bz: $.data.id }
            - call: "POST /listed-chemicals/${chem_bz}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-CI1", product_name: "Solvent Wipe", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 4000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /notices"
              payload: { product_id: "${prod_1}", chemical_id: "${chem_bz}", noticing_party_name: "Coastal Watch Alliance", noticing_party_type: "PRIVATE_PARTY", alleged_violation_type: "FAILURE_TO_WARN", alleged_units: 4000, earliest_violation_date: "2026-06-01T00:00:00Z", served_at: "2026-07-01T00:00:00Z" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { notice_1: $.data.id }
            - call: "POST /notices/${notice_1}/transitions"
              payload: { action: "EVALUATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${notice_1}/transitions"
              payload: { action: "ESCALATE", evaluation_note: "No cure path; negotiating" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "GET /notices/${notice_1}"
              payload: {}
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { nv_1: $.data.version }
            - call: "POST /notices/${notice_1}/settlements"
              payload: { requested_attorney_fees_cents: 300000, reformulation_commitment: false, expected_notice_version: "${nv_1}" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { stl_1: $.data.id }
            - call: "GET /products/${prod_1}"
              payload: {}
              as: RegulatoryCounsel
              as_user_id: "rc_1"
          trigger:
            - call: "POST /settlements/${stl_1}/transitions"
              payload: { action: "ACCEPT_EXECUTE" }
              as: RegulatoryCounsel
              as_user_id: "rc_2"
            - call: "GET /products/${prod_1}"
              payload: {}
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /settlements/${stl_1}/transitions"
              payload: { action: "VOID" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "GET /products/${prod_1}"
              payload: {}
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "GET /notices/${notice_1}"
              payload: {}
              as: RegulatoryCounsel
              as_user_id: "rc_1"
          assert:
            - "Settlement.${stl_1}.violation_days == 61 and base_penalty_cents == 2000000"
            - "Settlement.${stl_1}.mitigation_factor == 1.0 (zero ACTIVE components means no warranty defense) and adjusted_penalty_cents == 2000000"
            - "Settlement.${stl_1}.fee_cap_cents == 1200000, allowed_fees_cents == 300000, state_share_cents == 1500000, noticing_party_share_cents == 500000, total_settlement_cents == 2300000"
            - "before ACCEPT_EXECUTE: Product.${prod_1}.accrued_penalty_cents == 0, open_notice_count == 1, compliance_posture == ENFORCEMENT_HOLD"
            - "after ACCEPT_EXECUTE: Settlement.${stl_1}.status == EXECUTED, Product.${prod_1}.accrued_penalty_cents == 2000000, open_notice_count == 0, compliance_posture == EXPOSURE_UNKNOWN"
            - "after VOID: Settlement.${stl_1}.status == VOID, Product.${prod_1}.accrued_penalty_cents == 0 exactly (not 2000000 and not any residue), open_notice_count == 1, compliance_posture == ENFORCEMENT_HOLD"
            - "after VOID: NoticeOfViolation.${notice_1}.status == SETTLEMENT_NEGOTIATION and cure_attempted is false"
            - "state_share_cents + noticing_party_share_cents == adjusted_penalty_cents both before and after the void cycle"

      - name: component_quantity_roundtrip_conserves_total_chemical_load
        grounds:
          - calculations.total_listed_chemical_load_ug
          - endpoints[PATCH /product-components/{component_id}]
          - state_machines.ProductComponent.ACTIVE_to_REMOVED
          - entities.Product.fields.total_listed_chemical_load_ug
        distinguishing_aspect: |
          total_listed_chemical_load_ug is a conserved mass roll-up that must be recomputed from the
          ACTIVE components rather than nudged by deltas: changing a quantity away and back must
          land on the byte-identical value 7.080 with no accumulated rounding drift, editing
          contact_factor must not move it at all, and removing one component must leave exactly the
          other component's own rounded contribution.
        test_recipe:
          setup:
            - "Bisphenol A (declared 12.345 ppm on RM-100) and Benzene (declared 6.789 ppm on RM-200) are both LISTED, and both materials have VERIFIED COMPLETE disclosures so effective_concentration_ppm equals the declared value."
            - "Product SKU-CI2 has component A (RM-100, quantity 0.37) and component B (RM-200, quantity 0.37)."
            - "Per-component contributions round half-up to 3 decimals first: A = round(12.345 x 0.37) = 4.568, B = round(6.789 x 0.37) = 2.512, sum 7.080."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Benzene", cas_number: "71-43-2", endpoint_type: "CANCER", safe_harbor_basis: "NSRL", safe_harbor_level_ug_per_day: 6.4 }
              as: RegistryAdmin
              captures: { chem_bz: $.data.id }
            - call: "POST /listed-chemicals/${chem_bz}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-100", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 12.345 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /materials"
              payload: { material_code: "RM-200", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_2: $.data.id }
            - call: "POST /materials/${mat_2}/chemicals"
              payload: { chemical_id: "${chem_bz}", declared_concentration_ppm: 6.789 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_2}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_2}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_2}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-CI2", product_name: "Garden Hose", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 50000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.37, contact_factor: 0.5 }
              as: ComplianceAnalyst
              captures: { comp_a: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_2}", quantity_grams_per_unit: 0.37, contact_factor: 0.5 }
              as: ComplianceAnalyst
              captures: { comp_b: $.data.id }
            - call: "GET /products/${prod_1}"
              payload: {}
              as: ComplianceAnalyst
          trigger:
            - call: "PATCH /product-components/${comp_a}"
              payload: { quantity_grams_per_unit: 0.7101 }
              as: ComplianceAnalyst
            - call: "GET /products/${prod_1}"
              payload: {}
              as: ComplianceAnalyst
            - call: "PATCH /product-components/${comp_a}"
              payload: { quantity_grams_per_unit: 0.37 }
              as: ComplianceAnalyst
