            - { call: "POST /corrective-action-plans/${cap_id}/verify", payload: { outcome: "FAIL", verification_note: "Guards not yet installed" }, as: Auditor, as_user_id: "${aud2_id}", captures: { cs6: $.data.status, esc: $.data.escalation_count } }
            - { call: "POST /corrective-action-plans/${cap_id}/request-verification", payload: {}, as: SupplierContact, as_user_id: "${sup_id}", captures: { cs7: $.data.status } }
