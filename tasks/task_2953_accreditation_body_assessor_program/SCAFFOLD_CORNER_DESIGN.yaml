      - name: witness_coverage_counts_only_completed_sessions
        claim_type: input_set_filtering
        grounds:
          - validations[priority=13].ERR_WITNESS_COVERAGE_INSUFFICIENT
          - errors[ERR_WITNESS_COVERAGE_INSUFFICIENT]
          - entities.AccreditationApplication.fields.completed_witness_session_count
          - entities.AssessmentPlan.fields.witness_days_planned
          - calculations.witness_session_day_count
        distinguishing_aspect: |
          The coverage gate reads only COMPLETED sessions: with one COMPLETED 8-hour session
          (day_count 1) and one SCHEDULED 32-hour session (day_count 4) under the APPROVED plan,
          completed_witness_session_count is 1 against witness_min_count 2 and the completed day
          total is 1 against witness_days_planned 2, so close-assessment must return
          ERR_WITNESS_COVERAGE_INSUFFICIENT (422) even though 5 booked days exist.
        test_recipe:
          setup:
            - "Clock 2026-08-10; one PUBLISHED scheme with witness_min_count 2; one GRANTED, QUALIFIED, SCREENED LEAD_ASSESSOR (capacity 20) CONFIRMED on an INITIAL 3-line cycle."
            - "An APPROVED plan (witness_days_planned 2) with two sessions booked for the same assessor at the same site: an 8-hour one on 2026-09-07 and a 32-hour one starting 2026-09-08."
            - "The clock is moved to 2026-09-07T17:00:00Z and only the 8-hour session is recorded COMPLETED / SATISFACTORY, so the cycle is IN_ASSESSMENT and the 32-hour session is still SCHEDULED."
