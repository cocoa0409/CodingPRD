      - name: competency_decay_ladder
        claim_type: correct_result
        grounds:
          - "calculations.technician_competency_score"
        distinguishing_aspect: "Age-weighted decay is exact: one FAIL verification (-2) scores 98 at age 30d (weight 1.0, boundary inclusive), 99 at age 45d (weight 0.5), and the rolling variant returns to 100 at age 91d while the lifetime variant stays 98."
        test_recipe:
          setup: ["template, technician A, tray v1 in IN_ASSEMBLY; one FAIL verification recorded at 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "GEN-01", name: "General", specialty: "GEN", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-06-01T00:00:00Z" }, as: FacilityAdmin, captures: { ta: "$.data.id" } }
