          - entities.PhenotypeObservation.fields.qc_status
          - entities.PhenotypeObservation.fields.is_outlier
        distinguishing_aspect: "The rollup's inclusion set is a triple filter - trait_code = YIELD_KG_PLOT, qc_status = ACCEPTED, is_outlier = false - and every excluded row must leave both the count and the sum untouched: five yield rows plus one protein row must produce valid_rep_count 3 and plot_mean_yield_kg 15.000, not the 19.000 an unfiltered mean would give."
