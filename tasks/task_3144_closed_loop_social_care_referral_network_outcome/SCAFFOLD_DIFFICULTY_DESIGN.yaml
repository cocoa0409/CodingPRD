              payload: { expected_claim_version: "${cl2_v}" }
              as: FunderAdmin
              as_user_id: "${f_id}#rev2"
          assert:
            - "PaymentClaim.${cl1_id}.approved_amount_cents == 20000 (September window)"
            - "PaymentClaim.${cl2_id}.approved_amount_cents == 20000 (October window: fresh cap, NOT clamped to 5000)"

      - name: agreement_effective_at_half_open_temporal_gate
        grounds:
          - validations[priority=23]
          - state_machines.DataSharingAgreement.PENDING_to_ACTIVE
        distinguishing_aspect: |
          Different interval semantics than a monthly aggregate: a half-open
          point-in-time gate on a single instant — agreement with effective_at
          exactly equal to the clock approves (<=, inclusive), while one
          second in the future rejects with
          ERR_AGREEMENT_NOT_YET_EFFECTIVE. Two agreements differ only in
          effective_at straddling the clock.
        test_recipe:
          setup:
            - "Clock fixed at 2026-09-01T12:00:00Z"
            - "Agreement A1 effective_at 2026-09-01T12:00:00Z (inclusive pass); A2 effective_at 2026-09-01T12:00:01Z (future, reject)"
          setup_api_calls:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T12:00:00Z" }, as: NetworkCoordinator }
            - call: "POST /care-network/networks"
              payload: { name: "Net", coordinator_org_name: "Coord" }
              as: NetworkCoordinator
            - call: "POST /care-network/organizations"
