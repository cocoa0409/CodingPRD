            - call: "POST /prosthetics/payment-plans"
              payload: { patient_id: "${pat_id}", case_id: "${case_id}", installment_count: 3, down_payment_amount: 240.00, first_due_date: "2026-05-05T00:00:00Z", frequency: "MONTHLY", expected_prosthesis_case_version: "${case_v}", pay_in_full: false }
              as: FrontOffice
