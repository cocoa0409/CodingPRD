# =============================================================================
# Task 1012 — Kitchenware & Culinary Store (Williams-Sonoma style)
# SCAFFOLD.yaml  (§1.0–§1.7)
# =============================================================================

scenario: |
  1012. Kitchenware & Culinary Store (Williams-Sonoma style): SKU & registry,
  cooking-class linkage & demo, knife/coffee service, loyalty & rewards,
  BOPIS/ship-from-store, gift & bundle, return, special order

domain_name: kitchenware-culinary
api_prefix: "/"

complexity_profile:
  primary_archetype: "Pricing engine"
  secondary_archetype: "Event sourcing"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat            # peer entities linked by FK, no nested URLs
  state_machine_shape: parallel    # Order carries payment_status x fulfillment_status; SpecialOrder is cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: state_code, type: enum, source: input, description: "Tax jurisdiction", constraints: "one of CA, OR, NY" }
      - { name: status, type: enum, source: input, description: "Operational status", default: "OPEN", constraints: "OPEN | CLOSED" }

  - name: Sku
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: category, type: enum, source: input, description: "Merchandise category", constraints: "COOKWARE | KNIVES | COFFEE | APPLIANCE | TABLETOP" }
      - { name: list_price_cents, type: integer, source: input, description: "Unit list price in cents", constraints: ">= 0" }
      - { name: is_bundle, type: boolean, source: input, description: "True when this SKU is a gift bundle of component SKUs", default: false }
      - { name: component_sku_ids, type: array, source: input, description: "For bundles: array of component Sku ids (not FK-checked; validated at create)", default: "[]" }
      - { name: bundle_price_cents, type: integer, source: input, description: "For bundles: fixed bundle price in cents; null for non-bundles", default: null }
      - { name: on_hand_qty, type: integer, source: input, description: "Physical units on hand at the store network", constraints: ">= 0" }
      - { name: reserved_qty, type: integer, source: computed, description: "Units reserved by RESERVED order lines; see calc sku_inventory" }
      - { name: available_qty, type: integer, source: computed, description: "on_hand_qty - reserved_qty, never negative; see calc sku_inventory" }
      - { name: status, type: enum, source: input, description: "Catalog status", default: "ACTIVE", constraints: "ACTIVE | DISCONTINUED" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Member email (unique)" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: home_store_id, type: string, source: input, description: "FK -> Store.id; the member's home store" }
      - { name: tier, type: enum, source: computed, description: "Loyalty tier derived from annual_spend_cents; see calc member_tier", constraints: "STANDARD | SILVER | GOLD" }
      - { name: annual_spend_cents, type: integer, source: computed, description: "Trailing-365-day fulfilled gross spend net of returns; see calc annual_spend" }
      - { name: pending_points, type: integer, source: system, description: "Provisional loyalty points from RESERVED (unfulfilled) orders" }
      - { name: earned_points, type: integer, source: system, description: "Posted loyalty points from FULFILLED orders, net of returns" }
      - { name: wallet_credit_cents, type: integer, source: system, description: "Store-credit wallet balance in cents" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the purchasing member" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; fulfilling store" }
      - { name: fulfillment_type, type: enum, source: input, description: "Fulfillment channel", constraints: "BOPIS | SHIP_FROM_STORE | IN_STORE" }
      - { name: lines, type: array, source: input, description: "Array of line objects {line_id, sku_id, qty, unit_price_cents, line_status, is_gift}; line_id server-minted, unit_price_cents/line_status server-set" }
      - { name: payment_status, type: enum, source: system, description: "Payment dimension", constraints: "UNPAID | PAID | REFUNDED" }
      - { name: fulfillment_status, type: enum, source: system, description: "Fulfillment dimension", constraints: "RESERVED | FULFILLED | CANCELED" }
      - { name: tier_at_pricing, type: enum, source: computed, description: "Member.tier snapshot at order creation; drives discount + points multiplier", constraints: "STANDARD | SILVER | GOLD" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of unit_price_cents*qty; provisional over all lines, final over FULFILLED lines; see calc order_pricing" }
      - { name: tier_discount_cents, type: integer, source: computed, description: "Capped tier discount; see calc order_pricing" }
      - { name: tax_cents, type: integer, source: computed, description: "Tax on (subtotal - tier_discount) by store state; see calc order_pricing" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal - tier_discount + tax; provisional at create, final at fulfill; see calc order_pricing" }
      - { name: pending_points, type: integer, source: computed, description: "Provisional points over all lines at create; see calc loyalty_points_accrual" }
      - { name: earned_points, type: integer, source: computed, description: "Posted points over FULFILLED lines at fulfill; 0 until fulfilled; see calc loyalty_points_accrual" }
      - { name: refunded_cents, type: integer, source: computed, description: "Cumulative refunded amount from cancel/returns" }
      - { name: fulfilled_at, type: datetime, source: system, description: "Logical-clock timestamp when fulfilled; null until FULFILLED" }

  - name: CookingClass
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; hosting store" }
      - { name: title, type: string, source: input, description: "Class title" }
      - { name: station, type: enum, source: input, description: "Physical demo station resource at the store", constraints: "DEMO_KITCHEN | HEARTH_BAR" }
      - { name: start_at, type: datetime, source: input, description: "Class start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Class end (exclusive); must be > start_at" }
      - { name: capacity, type: integer, source: input, description: "Max BOOKED registrations", constraints: ">= 1" }
      - { name: price_cents, type: integer, source: input, description: "Per-seat price in cents" }
      - { name: registered_count, type: integer, source: computed, description: "Count of BOOKED registrations; see calc class_registered_count" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "DRAFT | OPEN | COMPLETED | CANCELED" }

  - name: ClassRegistration
    parent: null
    common_fields: true
    fields:
      - { name: class_id, type: string, source: input, description: "FK -> CookingClass.id; the class" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the registrant" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; optional linked purchase order; null when booked directly", default: null }
      - { name: seat_price_cents, type: integer, source: computed, description: "Snapshot of CookingClass.price_cents at booking" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "BOOKED | ATTENDED | NO_SHOW | CANCELED" }

  - name: ServiceTicket
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; servicing store" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; optional owning member; null for walk-in", default: null }
      - { name: service_type, type: enum, source: input, description: "Service bar resource", constraints: "KNIFE_SHARPENING | COFFEE_SERVICE" }
      - { name: start_at, type: datetime, source: input, description: "Appointment start" }
      - { name: end_at, type: datetime, source: input, description: "Appointment end; must be > start_at" }
      - { name: price_cents, type: integer, source: input, description: "Service price in cents" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "SCHEDULED | COMPLETED | CANCELED" }

  - name: Return
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the order being returned" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the returning member (order owner)" }
      - { name: line_id, type: string, source: input, description: "Target line_id within the order's lines array" }
      - { name: return_qty, type: integer, source: input, description: "Units returned from the target line", constraints: ">= 1, <= line.qty" }
      - { name: reason, type: enum, source: input, description: "Return reason", constraints: "DEFECTIVE | UNWANTED | WRONG_ITEM" }
      - { name: refund_destination, type: enum, source: input, description: "Where the refund goes", constraints: "ORIGINAL | WALLET" }
      - { name: refund_amount_cents, type: integer, source: computed, description: "Refund posted at approval; see calc return_refund" }
      - { name: points_reversed, type: integer, source: computed, description: "Loyalty points clawed back at approval; see calc return_refund" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "REQUESTED | APPROVED | REJECTED" }

  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; requesting member" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; fulfilling store" }
      - { name: description, type: string, source: input, description: "Free-text description of the special/custom item" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Customer's estimated budget in cents" }
      - { name: quoted_total_cents, type: integer, source: system, description: "Latest staff quote in cents; null until first quote" }
      - { name: quote_revision, type: integer, source: system, description: "Count of quotes issued; starts at 0, increments each quote" }
      - { name: deposit_cents, type: integer, source: system, description: "Deposit recorded with the latest quote; null until first quote" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "DRAFT | QUOTED | REVISION_REQUESTED | ACCEPTED | CANCELED" }

  - name: Registry
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; registry owner" }
      - { name: event_type, type: enum, source: input, description: "Registry event", constraints: "WEDDING | HOUSEWARMING | BIRTHDAY" }
      - { name: event_date, type: datetime, source: input, description: "Event date" }
      - { name: items, type: array, source: input, description: "Array of {sku_id, desired_qty, purchased_qty}; purchased_qty server-maintained, starts 0" }
      - { name: status, type: enum, source: system, description: "Registry status; registries are created ACTIVE and have no close lifecycle in this version", default: "ACTIVE", constraints: "ACTIVE" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ----- Order: PARALLEL dimensions (payment_status x fulfillment_status) -----
  - entity: Order
    note: "Two independent state axes on one row: payment_status and fulfillment_status evolve on separate transitions."
    initial_state: "payment_status=UNPAID, fulfillment_status=RESERVED"
    terminal_states: ["fulfillment_status=FULFILLED", "fulfillment_status=CANCELED"]
    transitions:
      - from: "fulfillment_status=RESERVED (any payment_status)"
        to: "fulfillment_status=RESERVED"
        trigger: "POST /orders"
        actor: StoreAssociate
        preconditions:
          - "every line.sku exists and status == ACTIVE (else ERR_DISCONTINUED_SKU)"
          - "for each line, sku.available_qty >= qty (else ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "line_status=RESERVED for every line; unit_price_cents set from sku (bundle_price_cents for bundles, else list_price_cents)"
          - "sku.reserved_qty += line.qty; sku.available_qty recomputed (calc sku_inventory)"
          - "tier_at_pricing = Member.tier snapshot; compute subtotal_cents/tier_discount_cents/tax_cents/total_cents provisional (calc order_pricing)"
          - "compute pending_points over all lines (calc loyalty_points_accrual); Member.pending_points += Order.pending_points"
          - "payment_status=UNPAID, fulfillment_status=RESERVED"
      - from: "payment_status=UNPAID"
        to: "payment_status=PAID"
        trigger: "POST /orders/{id}/pay"
        actor: StoreAssociate
        preconditions:
          - "fulfillment_status == RESERVED (not CANCELED)"
        side_effects:
          - "payment_status=PAID"
      - from: "fulfillment_status=RESERVED"
        to: "fulfillment_status=FULFILLED"
        trigger: "POST /orders/{id}/fulfill"
        actor: StoreAssociate
        preconditions:
          - "payment_status == PAID (else ERR_PAYMENT_REQUIRED)"
          - "Store.status == OPEN (else ERR_STORE_CLOSED)  # cross-entity: Order depends on Store"
        side_effects:
          - "lines in exclude_line_ids -> line_status=VOID and sku.reserved_qty -= qty (released, not sold)"
          - "remaining RESERVED lines -> line_status=FULFILLED; sku.on_hand_qty -= qty and sku.reserved_qty -= qty"
          - "recompute subtotal_cents/tax_cents/total_cents FINAL over FULFILLED lines only (calc order_pricing final variant)"
          - "earned_points computed over FULFILLED lines using tier_at_pricing (calc loyalty_points_accrual); Member.earned_points += Order.earned_points; Member.pending_points -= Order.pending_points"
          - "Member.annual_spend_cents += sum(FULFILLED line gross) BEFORE tier recompute; then Member.tier recomputed (calc member_tier)"
          - "fulfilled_at = current logical clock; fulfillment_status=FULFILLED"
      - from: "fulfillment_status=RESERVED"
        to: "fulfillment_status=CANCELED"
        trigger: "POST /orders/{id}/cancel"
        actor: StoreAssociate
        preconditions:
          - "fulfillment_status == RESERVED (not FULFILLED)"
        side_effects:
          - "CASCADE depth-2: every RESERVED line -> line_status=VOID (link1); each VOID line releases sku.reserved_qty -= qty and sku.available_qty recomputed (link2, caused by the line becoming VOID)"
          - "Member.pending_points -= Order.pending_points"
          - "if payment_status == PAID: refund total_cents to Member.wallet_credit_cents, refunded_cents += total_cents, payment_status=REFUNDED"
          - "fulfillment_status=CANCELED"

  # ----- SpecialOrder: CYCLIC (QUOTED <-> REVISION_REQUESTED) -----
  - entity: SpecialOrder
    initial_state: DRAFT
    terminal_states: [ACCEPTED, CANCELED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /special-orders/{id}/quote"
        actor: StoreAssociate
        preconditions:
          - "expected_special_order_version matches SpecialOrder.version (else ERR_STALE_VERSION)"
        side_effects:
          - "quoted_total_cents set; deposit_cents set; quote_revision += 1"
          - "increments SpecialOrder.version by 1"
          - "status=QUOTED"
      - from: QUOTED
        to: REVISION_REQUESTED
        trigger: "POST /special-orders/{id}/request-revision"
        actor: Member
        preconditions:
          - "status == QUOTED"
        side_effects:
          - "increments SpecialOrder.version by 1"
          - "status=REVISION_REQUESTED"
      - from: REVISION_REQUESTED
        to: QUOTED
        trigger: "POST /special-orders/{id}/quote"
        actor: StoreAssociate
        note: "The revision cycle: staff re-quotes a revision-requested order, returning it to QUOTED (A->B->A)."
        preconditions:
          - "expected_special_order_version matches SpecialOrder.version (else ERR_STALE_VERSION)"
        side_effects:
          - "quoted_total_cents updated; deposit_cents updated; quote_revision += 1"
          - "increments SpecialOrder.version by 1"
          - "status=QUOTED"
      - from: QUOTED
        to: ACCEPTED
        trigger: "POST /special-orders/{id}/accept"
        actor: Member
        preconditions:
          - "status == QUOTED"
        side_effects:
          - "increments SpecialOrder.version by 1"
          - "status=ACCEPTED (terminal)"
      - from: [DRAFT, QUOTED, REVISION_REQUESTED]
        to: CANCELED
        trigger: "POST /special-orders/{id}/cancel"
        actor: Member
        preconditions:
          - "status != ACCEPTED"
        side_effects:
          - "increments SpecialOrder.version by 1"
          - "status=CANCELED (terminal)"

  # ----- Return: branching (approve | reject) -----
  - entity: Return
    initial_state: REQUESTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: null
        to: REQUESTED
        trigger: "POST /returns"
        actor: Member
        preconditions:
          - "Order.fulfillment_status == FULFILLED (else ERR_ORDER_NOT_FULFILLED)  # cross-entity: Return depends on Order"
          - "current clock <= Order.fulfilled_at + RETURN_WINDOW_DAYS (=30) (else ERR_RETURN_WINDOW_EXPIRED)"
          - "target line exists and line_status == FULFILLED; return_qty in [1, line.qty]"
        side_effects:
          - "status=REQUESTED (refund/points computed at approval)"
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /returns/{id}/approve"
        actor: StoreAssociate
        preconditions:
          - "target line.line_status == FULFILLED, NOT already RETURNED (else ERR_LINE_ALREADY_RETURNED)  # state"
          - "refund_amount_cents <= (Order paid amount not yet refunded) (else ERR_REFUND_EXCEEDS_PAID)  # fiscal"
        side_effects:
          - "CASCADE depth-3: target line -> line_status=RETURNED (link1); the line becoming RETURNED reverses Member.annual_spend_cents -= line gross returned and Member.earned_points -= points_reversed (link2, caused by link1); the spend change triggers Member.tier recompute which may downgrade tier (link3, caused by link2)"
          - "compute refund_amount_cents and points_reversed (calc return_refund)"
          - "line RETURNED also restocks sku.on_hand_qty += return_qty (side of link1)"
          - "refund_destination WALLET -> Member.wallet_credit_cents += refund_amount_cents; ORIGINAL -> Order.refunded_cents += refund_amount_cents"
          - "status=APPROVED (terminal)"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /returns/{id}/reject"
        actor: StoreAssociate
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "status=REJECTED (terminal); no refund, no cascade"

  # ----- CookingClass: linear + cancel -----
  - entity: CookingClass
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /cooking-classes"
        actor: StoreAssociate
        preconditions:
          - "end_at > start_at"
          - "no other non-CANCELED CookingClass on the same store_id + station whose [start_at, end_at) overlaps (else ERR_CLASS_STATION_CONFLICT)  # half-open; adjacency end==start allowed"
        side_effects:
          - "status=DRAFT; registered_count=0"
      - from: DRAFT
        to: OPEN
        trigger: "POST /cooking-classes/{id}/open"
        actor: StoreAssociate
        preconditions: ["status == DRAFT"]
        side_effects: ["status=OPEN; registrations now accepted"]
      - from: OPEN
        to: COMPLETED
        trigger: "POST /cooking-classes/{id}/complete"
        actor: StoreAssociate
        preconditions: ["status == OPEN"]
        side_effects: ["status=COMPLETED (terminal)"]
      - from: [DRAFT, OPEN]
        to: CANCELED
        trigger: "POST /cooking-classes/{id}/cancel"
        actor: StoreAssociate
        preconditions: ["status in {DRAFT, OPEN}"]
        side_effects:
          - "every BOOKED ClassRegistration on this class -> status=CANCELED (cascade-down)"
          - "status=CANCELED (terminal)"

  # ----- ClassRegistration: branching -----
  - entity: ClassRegistration
    initial_state: BOOKED
    terminal_states: [ATTENDED, NO_SHOW, CANCELED]
    transitions:
      - from: null
        to: BOOKED
        trigger: "POST /class-registrations"
        actor: Member
        preconditions:
          - "CookingClass.status == OPEN (else ERR_CLASS_NOT_OPEN)  # cross-entity state"
          - "current clock < CookingClass.start_at (else ERR_REGISTRATION_CLOSED)  # temporal"
          - "CookingClass.registered_count < CookingClass.capacity (else ERR_CLASS_FULL)  # constraint"
        side_effects:
          - "seat_price_cents = CookingClass.price_cents snapshot; status=BOOKED; class.registered_count recomputed (calc class_registered_count)"
      - from: BOOKED
        to: ATTENDED
        trigger: "POST /class-registrations/{id}/mark-attendance (attended=true)"
        actor: StoreAssociate
        preconditions: ["status == BOOKED"]
        side_effects: ["status=ATTENDED (terminal); class.registered_count recomputed"]
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /class-registrations/{id}/mark-attendance (attended=false)"
        actor: StoreAssociate
        preconditions: ["status == BOOKED"]
        side_effects: ["status=NO_SHOW (terminal); class.registered_count recomputed"]
      - from: BOOKED
        to: CANCELED
        trigger: "POST /class-registrations/{id}/cancel"
        actor: Member
        preconditions: ["status == BOOKED"]
        side_effects: ["status=CANCELED (terminal); class.registered_count recomputed (frees a seat)"]

  # ----- ServiceTicket: linear + cancel -----
  - entity: ServiceTicket
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /service-tickets"
        actor: StoreAssociate
        preconditions:
          - "end_at > start_at"
          - "no other non-CANCELED ServiceTicket on the same store_id + service_type within SERVICE_BUFFER_MINUTES (=30) of this interval (else ERR_SERVICE_SLOT_CONFLICT)  # closed intervals padded by buffer on both ends"
        side_effects: ["status=SCHEDULED"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /service-tickets/{id}/complete"
        actor: StoreAssociate
        preconditions: ["status == SCHEDULED"]
        side_effects: ["status=COMPLETED (terminal)"]
      - from: SCHEDULED
        to: CANCELED
        trigger: "POST /service-tickets/{id}/cancel"
        actor: Member
        preconditions: ["status == SCHEDULED"]
        side_effects: ["status=CANCELED (terminal)"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: special-order-quote-supersede
    parent_entity: SpecialOrder
    write_endpoint: "POST /special-orders/{id}/quote"
    occ_field: "expected_special_order_version"
    description: |
      Issuing a quote against a SpecialOrder whose version has advanced since the
      client last observed it is rejected as a stale-version write. A new quote
      legitimately supersedes the prior quote (DRAFT->QUOTED or REVISION_REQUESTED
      ->QUOTED), so a writer whose view of the special order is stale — because a
      prior quote or a request-revision has already advanced the version — must be
      turned away rather than silently overwriting the newer quote.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_pricing
    trigger: "POST /orders (provisional variant); POST /orders/{id}/fulfill (final variant)"
    algorithm: tiered_pricing
    formula: |
      TIER_DISCOUNT_PCT = { STANDARD: 0.00, SILVER: 0.05, GOLD: 0.10 }[tier_at_pricing]
      TAX_RATE = { CA: 0.0875, OR: 0.00, NY: 0.08 }[Store.state_code]
      line_set = (provisional) all lines ; (final) lines whose line_status == FULFILLED
      subtotal_cents   = sum(line.unit_price_cents * line.qty for line in line_set)
      tier_discount_cents = min( round_half_up(subtotal_cents * TIER_DISCOUNT_PCT), DISCOUNT_CAP_CENTS )
      taxable_cents    = subtotal_cents - tier_discount_cents
      tax_cents        = round_half_up(taxable_cents * TAX_RATE)
      total_cents      = subtotal_cents - tier_discount_cents + tax_cents
    input_set: "provisional: every line; final: only line_status == FULFILLED (excluded/VOID lines dropped)"
    constants:
      TIER_DISCOUNT_PCT: { STANDARD: 0.00, SILVER: 0.05, GOLD: 0.10 }
      TAX_RATE: { CA: 0.0875, OR: 0.00, NY: 0.08 }
      DISCOUNT_CAP_CENTS: 20000
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "at order creation, over every ordered line, using tier_at_pricing snapshot"
        difference: "includes lines that may later be excluded at fulfillment"
      - name: final
        when: "at fulfillment, over FULFILLED lines only"
        difference: "excludes VOID (out-of-stock/excluded) lines, yielding a different subtotal/tax/total"

  - name: loyalty_points_accrual
    trigger: "POST /orders (pending variant); POST /orders/{id}/fulfill (earned variant)"
    algorithm: weighted_scoring
    formula: |
      MULT = { STANDARD: 1.00, SILVER: 1.25, GOLD: 1.50 }[tier_at_pricing]   # snapshot on the Order
      line_set = (pending) all lines ; (earned) lines whose line_status == FULFILLED
      # ROUND PER LINE, THEN SUM (this order is pinned; sum-then-round is WRONG)
      points = sum( round_half_up( (line.unit_price_cents * line.qty) / 100 * MULT ) for line in line_set )
    input_set: "pending: all lines; earned: FULFILLED lines only"
    constants:
      MULT: { STANDARD: 1.00, SILVER: 1.25, GOLD: 1.50 }
      POINTS_PER_CENT_DIVISOR: 100
    precision: "integer points, round_half_up, rounding applied PER LINE before summation"
    variants:
      - name: pending
        when: "at order creation over all lines"
        difference: "provisional; not posted to Member.earned_points"
      - name: earned
        when: "at fulfillment over FULFILLED lines"
        difference: "posted to Member.earned_points; excludes VOID lines"

  - name: member_tier
    trigger: "recomputed AFTER Member.annual_spend_cents changes on order fulfill and on return approve"
    algorithm: threshold
    formula: |
      if   annual_spend_cents >= GOLD_THRESHOLD_CENTS:   tier = GOLD
      elif annual_spend_cents >= SILVER_THRESHOLD_CENTS: tier = SILVER
      else:                                              tier = STANDARD
      # boundary is inclusive (>=): exactly SILVER_THRESHOLD_CENTS -> SILVER
    input_set: "Member.annual_spend_cents"
    constants:
      SILVER_THRESHOLD_CENTS: 50000
      GOLD_THRESHOLD_CENTS: 150000
    precision: "integer comparison, inclusive lower bound"

  - name: annual_spend
    trigger: "order fulfill (+); return approve (-)"
    algorithm: aggregation
    formula: |
      annual_spend_cents = sum over the member's orders with fulfillment_status == FULFILLED and
        fulfilled_at within [current_clock - 365 days, current_clock] of
        ( sum(FULFILLED line.unit_price_cents * line.qty)
          - sum(approved-return line gross for that order) )
      Maintained incrementally: += fulfilled line gross at fulfill, -= returned line gross at return approve.
      Never negative.
    input_set: "FULFILLED orders in trailing 365-day window, net of APPROVED returns"
    constants:
      SPEND_WINDOW_DAYS: 365
    precision: "integer cents"

  - name: sku_inventory
    trigger: "order create/fulfill/cancel; return approve"
    algorithm: aggregation
    formula: |
      reserved_qty  = sum(line.qty for RESERVED lines referencing this sku across all orders)
      available_qty = max(on_hand_qty - reserved_qty, 0)
      # on_hand_qty changes only on fulfill (-qty of FULFILLED lines) and return approve (+return_qty restock)
      # INVARIANT: available_qty + reserved_qty == on_hand_qty at all times
    input_set: "RESERVED order lines referencing the sku"
    precision: "integer units, never negative"

  - name: return_refund
    trigger: "POST /returns/{id}/approve"
    algorithm: aggregation
    formula: |
      line = the target order line
      MULT = { STANDARD: 1.00, SILVER: 1.25, GOLD: 1.50 }[Order.tier_at_pricing]
      refund_amount_cents = line.unit_price_cents * return_qty           # line gross, no re-proration
      points_reversed     = round_half_up( (line.unit_price_cents * return_qty) / 100 * MULT )
    input_set: "single target line; uses the Order's tier_at_pricing snapshot so earn and reversal use the same multiplier"
    constants:
      MULT: { STANDARD: 1.00, SILVER: 1.25, GOLD: 1.50 }
    precision: "integer cents / integer points, round_half_up"

  - name: class_registered_count
    trigger: "registration create/cancel/mark-attendance; class cancel"
    algorithm: aggregation
    formula: |
      registered_count = count(ClassRegistration where class_id == this class AND status == BOOKED)
    input_set: "BOOKED registrations for the class"
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "All referenced resources (path ids and FK body fields) exist, validated left-to-right"
    error_id: "ERR_*_NOT_FOUND (per resource type)"
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_referential
    check: "A Member acting on a resource must own it (X-User-ID == resource.member_id / order.member_id)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "member self-service: returns create, class-registrations create/cancel, special-orders request-revision/accept/cancel, members redeem"
  - priority: 5
    category: state
    check: "OCC: expected_special_order_version == SpecialOrder.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /special-orders/{id}/quote"
  - priority: 6
    category: state
    check: "Target resource in a valid state for the requested transition (includes cross-entity state: Order.fulfillment_status==FULFILLED for returns; Store.status==OPEN and Order.payment_status==PAID for fulfill; CookingClass.status==OPEN for registration; line not already RETURNED; sku ACTIVE)"
    error_id: "ERR_INVALID_STATE | ERR_ORDER_NOT_FULFILLED | ERR_STORE_CLOSED | ERR_PAYMENT_REQUIRED | ERR_CLASS_NOT_OPEN | ERR_LINE_ALREADY_RETURNED | ERR_DISCONTINUED_SKU"
    http_status: 409
    applies_to: "all transition + create endpoints"
  - priority: 7
    category: business_temporal
    check: "Time-window rules: registration before class start; return within RETURN_WINDOW_DAYS of fulfilled_at"
    error_id: "ERR_REGISTRATION_CLOSED | ERR_RETURN_WINDOW_EXPIRED"
    http_status: 422
    applies_to: "class-registrations create; returns create"
  - priority: 8
    category: business_constraint
    check: "Capacity / overlap / stock: class capacity; class station overlap; service buffer overlap; sku availability"
    error_id: "ERR_CLASS_FULL | ERR_CLASS_STATION_CONFLICT | ERR_SERVICE_SLOT_CONFLICT | ERR_INSUFFICIENT_STOCK"
    http_status: 409
    applies_to: "class-registrations create; cooking-classes create; service-tickets create; orders create"
  - priority: 9
    category: business_fiscal
    check: "Fiscal: refund must not exceed unrefunded paid amount; redemption must not exceed earned_points"
    error_id: "ERR_REFUND_EXCEEDS_PAID | ERR_INSUFFICIENT_POINTS"
    http_status: 422
    applies_to: "returns approve; members redeem"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

  # ---- Store ----
  - method: POST
    path: "/stores"
    description: "Create a store"
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_code, "status?"]
    output: Store
    side_effects: ["status defaults to OPEN"]
  - method: GET
    path: "/stores/{id}"
    description: "Get a store"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: []
    output: Store
    side_effects: []

  # ---- Sku ----
  - method: POST
    path: "/skus"
    description: "Create a SKU (or bundle when is_bundle=true)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, category, list_price_cents, on_hand_qty, "is_bundle?", "component_sku_ids?", "bundle_price_cents?", "status?"]
    output: Sku
    side_effects: ["reserved_qty=0, available_qty=on_hand_qty, status defaults ACTIVE"]
  - method: GET
    path: "/skus/{id}"
    description: "Get a SKU"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: []
    output: Sku
    side_effects: []

  # ---- Member ----
  - method: POST
    path: "/members"
    description: "Enroll a loyalty member"
    roles: [PlatformAdmin, StoreAssociate]
    code: 201
    input: [email, full_name, home_store_id]
    output: Member
    side_effects: ["tier=STANDARD, annual_spend_cents=0, pending_points=0, earned_points=0, wallet_credit_cents=0"]
  - method: GET
    path: "/members/{id}"
    description: "Get a member"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/members"
    description: "List members, optionally filtered by home_store_id"
    roles: [PlatformAdmin, StoreAssociate]
    code: 200
    input: ["home_store_id?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: POST
    path: "/members/{id}/redeem"
    description: "Redeem earned points for wallet credit (1 point = 1 cent)"
    roles: [Member, StoreAssociate]
    code: 200
    input: [points]
    output: Member
    side_effects:
      - "points <= earned_points (else ERR_INSUFFICIENT_POINTS)"
      - "earned_points -= points; wallet_credit_cents += points"

  # ---- Order ----
  - method: POST
    path: "/orders"
    description: "Create an order (reserves inventory, prices provisionally)"
    roles: [StoreAssociate, PlatformAdmin]
    code: 201
    input: [member_id, store_id, fulfillment_type, lines]
    output: Order
    side_effects: ["see Order create transition"]
  - method: GET
    path: "/orders/{id}"
    description: "Get an order"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List orders, optionally filtered by member_id and/or store_id"
    roles: [PlatformAdmin, StoreAssociate]
    code: 200
    input: ["member_id?", "store_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/pay"
    description: "Mark order paid"
    roles: [StoreAssociate, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["payment_status=PAID"]
  - method: POST
    path: "/orders/{id}/fulfill"
    description: "Fulfill an order (BOPIS pickup / ship); optionally exclude out-of-stock lines"
    roles: [StoreAssociate, PlatformAdmin]
    code: 200
    input: ["exclude_line_ids?"]
    output: Order
    side_effects: ["see Order fulfill transition (final pricing, earned points, spend, tier recompute)"]
  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an unfulfilled order (releases inventory, refunds if paid)"
    roles: [StoreAssociate, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["see Order cancel transition (depth-2 cascade)"]

  # ---- CookingClass ----
  - method: POST
    path: "/cooking-classes"
    description: "Schedule a cooking class at a station (station overlap enforced)"
    roles: [StoreAssociate, PlatformAdmin]
    code: 201
    input: [store_id, title, station, start_at, end_at, capacity, price_cents]
    output: CookingClass
    side_effects: ["status=DRAFT, registered_count=0"]
  - method: GET
    path: "/cooking-classes/{id}"
    description: "Get a cooking class"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: []
    output: CookingClass
    side_effects: []
  - method: GET
    path: "/cooking-classes"
    description: "List cooking classes, optionally filtered by store_id"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: ["store_id?", "limit?", "offset?"]
    output: CookingClass[]
    side_effects: []
  - method: POST
    path: "/cooking-classes/{id}/open"
    description: "Open a class for registration"
    roles: [StoreAssociate, PlatformAdmin]
    code: 200
    input: []
    output: CookingClass
    side_effects: ["status=OPEN"]
  - method: POST
    path: "/cooking-classes/{id}/complete"
    description: "Complete a class"
    roles: [StoreAssociate, PlatformAdmin]
    code: 200
    input: []
    output: CookingClass
    side_effects: ["status=COMPLETED"]
  - method: POST
    path: "/cooking-classes/{id}/cancel"
    description: "Cancel a class (cascades BOOKED registrations to CANCELED)"
    roles: [StoreAssociate, PlatformAdmin]
    code: 200
    input: []
    output: CookingClass
    side_effects: ["BOOKED registrations -> CANCELED; status=CANCELED"]

  # ---- ClassRegistration ----
  - method: POST
    path: "/class-registrations"
    description: "Register a member for an OPEN class"
    roles: [Member, StoreAssociate, PlatformAdmin]
    code: 201
    input: [class_id, member_id, "order_id?"]
    output: ClassRegistration
    side_effects: ["status=BOOKED; class.registered_count recomputed"]
  - method: GET
    path: "/class-registrations/{id}"
    description: "Get a registration"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: []
    output: ClassRegistration
    side_effects: []
  - method: GET
    path: "/class-registrations"
    description: "List registrations, optionally filtered by class_id, member_id, order_id"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: ["class_id?", "member_id?", "order_id?", "limit?", "offset?"]
    output: ClassRegistration[]
    side_effects: []
  - method: POST
    path: "/class-registrations/{id}/mark-attendance"
    description: "Mark a registration ATTENDED or NO_SHOW"
    roles: [StoreAssociate, PlatformAdmin]
    code: 200
    input: [attended]
    output: ClassRegistration
    side_effects: ["status=ATTENDED (attended=true) or NO_SHOW (attended=false); registered_count recomputed"]
  - method: POST
    path: "/class-registrations/{id}/cancel"
    description: "Cancel a booked registration (frees a seat)"
    roles: [Member, StoreAssociate, PlatformAdmin]
    code: 200
    input: []
    output: ClassRegistration
    side_effects: ["status=CANCELED; registered_count recomputed"]

  # ---- ServiceTicket ----
  - method: POST
    path: "/service-tickets"
    description: "Book a knife/coffee service appointment (buffer overlap enforced)"
    roles: [Member, StoreAssociate, PlatformAdmin]
    code: 201
    input: [store_id, service_type, start_at, end_at, price_cents, "member_id?"]
    output: ServiceTicket
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/service-tickets/{id}"
    description: "Get a service ticket"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: []
  - method: GET
    path: "/service-tickets"
    description: "List service tickets, optionally filtered by store_id, member_id"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: ["store_id?", "member_id?", "limit?", "offset?"]
    output: ServiceTicket[]
    side_effects: []
  - method: POST
    path: "/service-tickets/{id}/complete"
    description: "Complete a service ticket"
    roles: [StoreAssociate, PlatformAdmin]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status=COMPLETED"]
  - method: POST
    path: "/service-tickets/{id}/cancel"
    description: "Cancel a service ticket"
    roles: [Member, StoreAssociate, PlatformAdmin]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status=CANCELED"]

  # ---- Return ----
  - method: POST
    path: "/returns"
    description: "Request a return against a fulfilled order line"
    roles: [Member, StoreAssociate, PlatformAdmin]
    code: 201
    input: [order_id, member_id, line_id, return_qty, reason, refund_destination]
    output: Return
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/returns/{id}"
    description: "Get a return"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: []
    output: Return
    side_effects: []
  - method: GET
    path: "/returns"
    description: "List returns, optionally filtered by order_id, member_id"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: ["order_id?", "member_id?", "limit?", "offset?"]
    output: Return[]
    side_effects: []
  - method: POST
    path: "/returns/{id}/approve"
    description: "Approve a return (refund + depth-3 loyalty/tier cascade)"
    roles: [StoreAssociate, PlatformAdmin]
    code: 200
    input: []
    output: Return
    side_effects: ["see Return approve transition"]
  - method: POST
    path: "/returns/{id}/reject"
    description: "Reject a return"
    roles: [StoreAssociate, PlatformAdmin]
    code: 200
    input: []
    output: Return
    side_effects: ["status=REJECTED"]

  # ---- SpecialOrder ----
  - method: POST
    path: "/special-orders"
    description: "Open a special-order request (DRAFT)"
    roles: [Member, StoreAssociate, PlatformAdmin]
    code: 201
    input: [member_id, store_id, description, estimated_cost_cents]
    output: SpecialOrder
    side_effects: ["status=DRAFT, quote_revision=0, version=1"]
  - method: GET
    path: "/special-orders/{id}"
    description: "Get a special order"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: []
  - method: GET
    path: "/special-orders"
    description: "List special orders, optionally filtered by member_id, store_id"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: ["member_id?", "store_id?", "limit?", "offset?"]
    output: SpecialOrder[]
    side_effects: []
  - method: POST
    path: "/special-orders/{id}/quote"
    description: "Issue/re-issue a quote (OCC on version; supersedes prior quote)"
    roles: [StoreAssociate, PlatformAdmin]
    code: 200
    input: [expected_special_order_version, quoted_total_cents, "deposit_cents?"]
    output: SpecialOrder
    side_effects: ["quoted_total_cents/deposit_cents set; quote_revision+=1; increments SpecialOrder.version by 1; status=QUOTED"]
  - method: POST
    path: "/special-orders/{id}/request-revision"
    description: "Member requests a revised quote"
    roles: [Member, StoreAssociate, PlatformAdmin]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["increments SpecialOrder.version by 1; status=REVISION_REQUESTED"]
  - method: POST
    path: "/special-orders/{id}/accept"
    description: "Member accepts the current quote"
    roles: [Member, StoreAssociate, PlatformAdmin]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["increments SpecialOrder.version by 1; status=ACCEPTED"]
  - method: POST
    path: "/special-orders/{id}/cancel"
    description: "Cancel a non-accepted special order"
    roles: [Member, StoreAssociate, PlatformAdmin]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["increments SpecialOrder.version by 1; status=CANCELED"]

  # ---- Registry ----
  - method: POST
    path: "/registries"
    description: "Create a gift registry"
    roles: [Member, StoreAssociate, PlatformAdmin]
    code: 201
    input: [member_id, event_type, event_date, "items?"]
    output: Registry
    side_effects: ["status=ACTIVE; each item purchased_qty=0"]
  - method: GET
    path: "/registries/{id}"
    description: "Get a registry"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: []
    output: Registry
    side_effects: []
  - method: GET
    path: "/registries"
    description: "List registries, optionally filtered by member_id"
    roles: [PlatformAdmin, StoreAssociate, Member]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: Registry[]
    side_effects: []
  - method: POST
    path: "/registries/{id}/purchase"
    description: "Record a gift purchase against a registry item"
    roles: [Member, StoreAssociate, PlatformAdmin]
    code: 200
    input: [sku_id, qty]
    output: Registry
    side_effects: ["matching item.purchased_qty += qty (capped at desired_qty)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers or unknown role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Member acting on a resource they do not own" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, or invalid enum/type" }
  - { id: ERR_STORE_NOT_FOUND, http: 404, condition: "store_id references no Store" }
  - { id: ERR_SKU_NOT_FOUND, http: 404, condition: "sku_id references no Sku" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "member_id references no Member" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "order_id references no Order" }
  - { id: ERR_CLASS_NOT_FOUND, http: 404, condition: "class_id references no CookingClass" }
  - { id: ERR_REGISTRATION_NOT_FOUND, http: 404, condition: "registration id references no ClassRegistration" }
  - { id: ERR_SERVICE_TICKET_NOT_FOUND, http: 404, condition: "service ticket id references no ServiceTicket" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "return id references no Return" }
  - { id: ERR_SPECIAL_ORDER_NOT_FOUND, http: 404, condition: "special order id references no SpecialOrder" }
  - { id: ERR_REGISTRY_NOT_FOUND, http: 404, condition: "registry id references no Registry" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "line_id references no line on the order" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_special_order_version does not match SpecialOrder.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_ORDER_NOT_FULFILLED, http: 409, condition: "Return requested against an order whose fulfillment_status != FULFILLED" }
  - { id: ERR_STORE_CLOSED, http: 409, condition: "Fulfill attempted while Store.status == CLOSED" }
  - { id: ERR_PAYMENT_REQUIRED, http: 409, condition: "Fulfill attempted while payment_status != PAID" }
  - { id: ERR_CLASS_NOT_OPEN, http: 409, condition: "Registration against a class whose status != OPEN" }
  - { id: ERR_LINE_ALREADY_RETURNED, http: 409, condition: "Approve a return whose target line is already RETURNED" }
  - { id: ERR_DISCONTINUED_SKU, http: 409, condition: "Order line references a DISCONTINUED sku" }
  - { id: ERR_REGISTRATION_CLOSED, http: 422, condition: "Registration after class start_at" }
  - { id: ERR_RETURN_WINDOW_EXPIRED, http: 422, condition: "Return requested more than RETURN_WINDOW_DAYS after fulfilled_at" }
  - { id: ERR_CLASS_FULL, http: 409, condition: "registered_count == capacity" }
  - { id: ERR_CLASS_STATION_CONFLICT, http: 409, condition: "Class overlaps another non-CANCELED class on same store+station (half-open)" }
  - { id: ERR_SERVICE_SLOT_CONFLICT, http: 409, condition: "Service ticket within SERVICE_BUFFER_MINUTES of another on same store+service_type" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Order line qty exceeds sku.available_qty" }
  - { id: ERR_REFUND_EXCEEDS_PAID, http: 422, condition: "Approved refund would exceed the order's unrefunded paid amount" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 422, condition: "Redemption exceeds Member.earned_points" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Chain/HQ operator: manages catalog (skus), stores, the logical clock, and may perform every operational action (superset)."
    identity: "opaque"
    exclusive_operations:
      - "POST /stores — create store"
      - "POST /skus — create sku/bundle"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "all order, cooking-class, class-registration, service-ticket, return, special-order, registry, and member operations (superset of StoreAssociate + Member)"
  - name: StoreAssociate
    description: "Store staff: creates and fulfills orders, runs classes and service tickets, approves/rejects returns, issues special-order quotes, enrolls members."
    identity: "opaque"
    exclusive_operations:
      - "POST /orders, /orders/{id}/pay, /orders/{id}/fulfill, /orders/{id}/cancel"
      - "POST /cooking-classes and its open/complete/cancel actions"
      - "POST /class-registrations/{id}/mark-attendance"
      - "POST /returns/{id}/approve, /returns/{id}/reject"
      - "POST /special-orders/{id}/quote"
      - "POST /members — enroll member"
    shared_operations:
      - "POST /class-registrations, /service-tickets, /returns, /special-orders, /registries and their member-shared actions"
      - "all GET reads"
  - name: Member
    description: "Loyalty customer; entity-backed. Self-service: registers for classes, books service, requests/accepts/cancels special orders, requests returns on own orders, redeems points, manages own registries."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /class-registrations (self), /class-registrations/{id}/cancel (own)"
      - "POST /service-tickets (self), /service-tickets/{id}/cancel (own)"
      - "POST /returns (own order), /special-orders (self), /special-orders/{id}/request-revision|accept|cancel (own)"
      - "POST /registries (self), /registries/{id}/purchase, /members/{id}/redeem (own)"
      - "GET reads of own resources"
