              as: BranchManager
              captures: { book: $.data.id }
            - call: "POST /price-books/${book}/activate"
              payload: {}
              as: BranchManager
            - call: "PATCH /customers/${cid}"
              payload: { price_book_id: "${book}" }
              as: CounterRep
            - call: "POST /products"
              payload: { sku: "HG-CA7", name: "Sleeves", category: "HARDGOOD", retail_price_cents: 10000 }
              as: BranchManager
              captures: { pid: $.data.id }
            - call: "POST /products/${pid}/receive"
              payload: { qty: 5 }
              as: BranchManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: BranchManager
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cid}", order_type: "RETAIL", fulfillment: "WILL_CALL", lines: [{ product_id: "${pid}", qty: 1 }] }
              as: CounterRep
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/confirm"
              payload: {}
              as: CounterRep
              captures: { tot: $.data.total_cents }
            - call: "GET /price-books"
