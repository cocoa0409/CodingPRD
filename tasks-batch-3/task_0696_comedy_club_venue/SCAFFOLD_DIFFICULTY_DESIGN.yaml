          assert:
            - "response error_id == ERR_INVALID_STATE (PrivateEvent already CANCELLED; Show no longer PRIVATE_HELD)"
            - "http status == 409"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: show_room_window_overlap_with_doors_buffer
        grounds:
          - validations[priority=12]
          - errors[ERR_SHOW_TIME_CONFLICT]
          - entities.Show.fields.doors_buffer_minutes
          - entities.Show.fields.starts_at
        distinguishing_aspect: "Show-room interval semantics: the occupied window is [starts_at - doors_buffer_minutes, ends_at]; a second show whose start lands inside the first show's ends_at + the second's doors buffer overlaps and is rejected with ERR_SHOW_TIME_CONFLICT — a time-window with an asymmetric leading buffer."
        test_recipe:
          setup:
            - "One non-CANCELLED show occupies 2026-04-14T03:00:00Z..05:00:00Z (doors buffer 30 -> window opens 02:30Z); a second show starting 05:15Z with doors_buffer_minutes=30 opens its window at 04:45Z, overlapping the first show's 05:00Z end."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Overlap Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Early Show", starts_at: "2026-04-14T03:00:00Z", ends_at: "2026-04-14T05:00:00Z", doors_buffer_minutes: 30 }
              as: Booker
              captures: { show1_id: $.data.id }
          trigger:
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Late Show", starts_at: "2026-04-14T05:15:00Z", ends_at: "2026-04-14T07:00:00Z", doors_buffer_minutes: 30 }
              as: Booker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SHOW_TIME_CONFLICT (second window opens 04:45Z, before first ends 05:00Z)"
            - "http status == 409"

      - name: table_double_hold_overlap
        grounds:
          - validations[priority=13]
          - errors[ERR_TABLE_UNAVAILABLE]
          - state_machines.SeatTable.AVAILABLE_to_HELD
          - entities.SeatTable.fields.status
        distinguishing_aspect: "SeatTable occupancy semantics (point-in-time, not a time window): a table already HELD by one reservation cannot be assigned to a second reservation of the same show — rejected with ERR_TABLE_UNAVAILABLE; the interval arithmetic is single-slot mutual exclusion, distinct from the show's buffered time-window."
        test_recipe:
          setup:
            - "TABLE show ON_SALE, one table T1 (server assigned), already HELD by reservation A; a second reservation B (party fits) attempts to take the same table."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Table Venue", settlement_currency: "USD" }
              as: Booker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows"
              payload: { title: "Table Night", starts_at: "2026-04-15T03:00:00Z", ends_at: "2026-04-15T05:00:00Z" }
              as: Booker
              captures: { show_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections"
              payload: { kind: "TABLE", label: "Floor" }
              as: Booker
              captures: { section_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/sections/${section_id}/tables"
              payload: { table_number: "T1", seats: 4 }
              as: FloorManager
              captures: { table_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/tiers"
              payload: { section_id: "${section_id}", name: "Table", price_cents: 4500 }
              as: Booker
              captures: { tier_id: $.data.id }
            - call: "POST /servers"
              payload: { name: "Hal", max_tables: 4 }
              as: FloorManager
              captures: { server_id: $.data.id }
            - call: "POST /tables/${table_id}/assign-server"
              payload: { server_id: "${server_id}" }
              as: FloorManager
              captures: { tbl_v1: $.data.version }
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-iA", party_size: 2 }
              as: BoxOffice
              captures: { resA: $.data.id }
            - call: "POST /reservations/${resA}/assign-table"
              payload: { table_id: "${table_id}", expected_table_version: "${tbl_v1}" }
              as: FloorManager
              captures: { tbl_v2: $.data.version }
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-iB", party_size: 2 }
              as: BoxOffice
              captures: { resB: $.data.id }
          trigger:
            - call: "POST /reservations/${resB}/assign-table"
              payload: { table_id: "${table_id}", expected_table_version: "${tbl_v2}" }
              as: FloorManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TABLE_UNAVAILABLE (table already HELD by reservation A)"
            - "http status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ga_seat_count_conserved_on_cancel
        grounds:
          - calculations.compute_section_availability
          - state_machines.Reservation.BOOKED_to_CANCELLED
          - entities.Show.fields.ga_sold_count
        distinguishing_aspect: "Conserved quantity = GA headcount: after booking a party of 3 then cancelling it, Show.ga_sold_count returns to exactly its pre-booking value 0 (ga_sold_count_after_cancel == ga_sold_count_before_book), with no drift."
