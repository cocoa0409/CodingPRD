            - { call: "POST /newsroom/corrections/${c2_id}/issue", payload: {}, as: ManagingEditor, as_user_id: "${me_id}", captures: { err: "$.data.error_id" } }
            - { call: "GET /newsroom/stories/${story_id}", payload: {}, as: NewsDirector, captures: { s_status: "$.data.status" } }
            - { call: "GET /newsroom/stories/${story_id}/corrections", payload: {}, as: NewsDirector, captures: { c2_status: "$.data[1].status" } }
          assert:
            - "err == ERR_STORY_NOT_PUBLISHED (c1's issuance retracted the story, closing c2's window)"
            - "s_status == RETRACTED"
            - "c2_status == APPROVED (failed issue did not transition c2)"

      - name: assignment_accept_requires_active_staff
        grounds:
          - state_machines.Assignment.PROPOSED_to_ACCEPTED
          - validations[priority=11]
          - errors[ERR_STAFF_INACTIVE]
        distinguishing_aspect: |
          Entity pair Assignment -> StaffMember (different from Correction ->
          Story): an assignment proposed while the reporter was ACTIVE cannot be
          accepted after the reporter goes ON_LEAVE, and becomes acceptable again
          when reactivated — the gate reads the referenced staff member's live
          state, not the proposal-time state.
        test_recipe:
          setup:
            - "Reporter ACTIVE with a PROPOSED assignment on a DRAFT story; NewsDirector then sets the reporter ON_LEAVE"
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk Fourteen", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep Fourteen", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "Library hours", summary: "Library cuts hours", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches/${p_id}/start-review", payload: {}, as: AssignmentEditor, as_user_id: "${desk_id}" }
            - { call: "POST /newsroom/pitches/${p_id}/greenlight", payload: { story_type: PRINT }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { story_id: "$.data.greenlit_story_id" } }
            - { call: "POST /newsroom/assignments", payload: { story_id: "${story_id}", staff_id: "${rep_id}", assignment_role: REPORTER, start_at: "2026-08-01T08:00:00Z", end_at: "2026-08-01T09:00:00Z", planned_effort_minutes: 45 }, as: AssignmentEditor, as_user_id: "${desk_id}", captures: { asg_id: "$.data.id" } }
            - { call: "PATCH /newsroom/staff/${rep_id}", payload: { employment_status: ON_LEAVE }, as: NewsDirector }
          trigger:
            - { call: "POST /newsroom/assignments/${asg_id}/accept", payload: {}, as: Reporter, as_user_id: "${rep_id}", captures: { err: "$.data.error_id" } }
            - { call: "PATCH /newsroom/staff/${rep_id}", payload: { employment_status: ACTIVE }, as: NewsDirector }
            - { call: "POST /newsroom/assignments/${asg_id}/accept", payload: {}, as: Reporter, as_user_id: "${rep_id}", captures: { st: "$.data.status" } }
          assert:
            - "err == ERR_STAFF_INACTIVE (accept gated on the staff member's live employment_status)"
            - "st == ACCEPTED after reactivation (satisfaction path)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: staff_assignment_half_open_adjacency
        grounds:
          - validations[priority=13]
          - errors[ERR_STAFF_TIME_CONFLICT]
          - state_machines.Assignment
        distinguishing_aspect: |
          Half-open interval semantics on the StaffMember resource: [10:00,12:00)
          and [12:00,14:00) touch but do NOT conflict, while [13:00,15:00) fails;
          the second overlap instance uses different semantics (closed windows
          with a 30-minute buffer) on a different resource (PublicationSlot
          channel).
        test_recipe:
          setup:
            - "One reporter; three DRAFT stories A, B, C; A holds assignment [2026-08-01T10:00, 2026-08-01T12:00)"
          setup_api_calls:
            - { call: "POST /newsroom/staff", payload: { full_name: "Desk Fifteen", role_capability: DESK_EDITOR, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { desk_id: "$.data.id" } }
            - { call: "POST /newsroom/staff", payload: { full_name: "Rep Fifteen", role_capability: REPORTER, home_desk: METRO, hourly_rate_cents: 6000 }, as: NewsDirector, captures: { rep_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "Story A", summary: "a", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { pa_id: "$.data.id" } }
            - { call: "POST /newsroom/pitches", payload: { title: "Story B", summary: "b", desk: METRO, deadline_at: "2026-08-03T00:00:00Z", urgency: STANDARD }, as: Reporter, as_user_id: "${rep_id}", captures: { pb_id: "$.data.id" } }
