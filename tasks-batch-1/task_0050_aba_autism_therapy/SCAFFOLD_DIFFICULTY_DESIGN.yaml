            - "POST /treatment-plans/${plan_id}/submit returns 409 ERR_EVALUATION_NOT_FINALIZED"

      - name: session_deliver_requires_active_authorization
        grounds:
          - validations[priority=5]
          - state_machines.TherapySession.SCHEDULED_to_DELIVERED
          - errors[ERR_AUTHORIZATION_NOT_ACTIVE]
          - entities.Authorization.fields.status
        distinguishing_aspect: |
          Entity pair TherapySession -> Authorization (different pair from
          Plan->Evaluation): delivering a still-SCHEDULED session is rejected with
          ERR_AUTHORIZATION_NOT_ACTIVE when its owning Authorization is RENEWED
          (renew does not cascade-cancel sessions, so the session stays SCHEDULED
          while the authorization leaves the ACTIVE/EXHAUSTED set).
        test_recipe:
          setup:
