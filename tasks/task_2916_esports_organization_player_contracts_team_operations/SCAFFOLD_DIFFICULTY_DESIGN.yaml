              as: Scout
              captures: { p2_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Ilya Novak", birth_date: "2010-02-20", region_code: "US", association_member: false, education_enrollment_status: "NOT_ENROLLED" }
              as: Scout
              captures: { p3_id: $.data.id }
            - call: "POST /players/${p3_id}/guardian-consent"
              payload: { guardian_name: "Vera Novak", guardian_email: "vera@example.com", guardian_weekly_cap_minutes: 1080 }
              as: GuardianRepresentative
