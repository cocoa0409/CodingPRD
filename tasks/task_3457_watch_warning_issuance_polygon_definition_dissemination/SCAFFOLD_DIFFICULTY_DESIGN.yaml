        distinguishing_aspect: "Ratio threshold metric: a zone whose rounded overlap_pct lands exactly on 0.100 is included in resolved_zone_ids while one at 0.090 is excluded — the >= 0.10 boundary is inclusive, observed through GET /alerts/products/{id} (a different endpoint and metric than the wind threshold)."
