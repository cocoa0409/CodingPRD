scaffold_corner_design:

  # =================================================================
  - section: entities
    instances:
      - name: create_patient_returns_201_with_fields
        claim_type: Creation
        grounds:
          - entities.Patient
          - "endpoints[\"POST /op/patients\"]"
        distinguishing_aspect: "POST /op/patients with all required fields returns 201 and a Patient with system id, created_at, version==1, payer_type echoed."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /op/patients"
              payload: { full_name: "New Pat", date_of_birth: "1970-02-02", payer_type: "COMMERCIAL" }
              as: BillingSpecialist
              captures: { pid: $.data.id, ver: $.data.version }
          assert:
            - "HTTP 201; data.payer_type == COMMERCIAL"
            - "Patient.${pid}.version == 1 and id is a UUID with no prefix"

      - name: get_patient_not_found
        claim_type: Not Found
        grounds:
          - entities.Patient
          - "endpoints[\"GET /op/patients/{id}\"]"
          - "errors[ERR_RESOURCE_NOT_FOUND]"
        distinguishing_aspect: "GET /op/patients/{id} with a non-existent UUID returns ERR_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /op/patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: create_patient_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.Patient.fields.payer_type
          - "validations[priority=16]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /op/patients omitting payer_type returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /op/patients"
              payload: { full_name: "No Payer", date_of_birth: "1970-02-02" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; data.error_id == ERR_INVALID_REQUEST"

      - name: create_patient_bad_enum_payer_type
        claim_type: Type Constraints
        grounds:
          - entities.Patient.fields.payer_type
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /op/patients with payer_type='AETNA' (not in enum) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /op/patients"
              payload: { full_name: "Bad Enum", date_of_birth: "1970-02-02", payer_type: "AETNA" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; data.error_id == ERR_INVALID_REQUEST"

      - name: prescription_default_status_draft
        claim_type: Defaults
        grounds:
          - entities.Prescription.fields.status
          - "endpoints[\"POST /op/prescriptions\"]"
        distinguishing_aspect: "A newly created Prescription defaults to status DRAFT regardless of input."
        test_recipe:
          setup: ["A Patient and a Physician exist."]
          setup_api_calls:
            - call: "POST /op/physicians"
              payload: { full_name: "Dr A", npi: "1111111111", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { phys_id: $.data.id }
            - call: "POST /op/patients"
              payload: { full_name: "Pat D", date_of_birth: "1970-02-02", payer_type: "COMMERCIAL" }
              as: BillingSpecialist
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /op/prescriptions"
              payload: { patient_id: "${pat_id}", physician_id: "${phys_id}", device_category: "SPINAL_ORTHOSIS", primary_diagnosis_code: "M54.5", face_to_face_date: "2026-04-20" }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { rx_id: $.data.id, st: $.data.status }
          assert:
            - "Prescription.${rx_id}.status == DRAFT"

      - name: compliancecheck_is_immutable_no_version
        claim_type: Immutability
        grounds:
          - entities.ComplianceCheck
          - "endpoints[\"GET /op/device-orders/{id}/compliance-checks\"]"
        distinguishing_aspect: "ComplianceCheck has common_fields:false — it carries id+created_at only, no version field, and there is no update/transition endpoint for it (append-only audit record)."
        test_recipe:
          setup: ["A delivered order produced exactly one ComplianceCheck."]
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /op/physicians"
              payload: { full_name: "Dr Rx", npi: "1111111111", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { rx_phys_id: $.data.id }
            - call: "POST /op/physicians"
              payload: { full_name: "Tech Fit", npi: "2222222222", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { fit_id: $.data.id }
            - call: "POST /op/suppliers"
              payload: { legal_name: "Acme O&P", accreditation_expiry: "2027-01-01T00:00:00Z", surety_bond_active: true }
              as: ComplianceOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /op/patients"
              payload: { full_name: "Pat CC", date_of_birth: "1960-01-01", payer_type: "COMMERCIAL" }
              as: BillingSpecialist
              captures: { pat_id: $.data.id }
            - call: "POST /op/prescriptions"
              payload: { patient_id: "${pat_id}", physician_id: "${rx_phys_id}", device_category: "LOWER_EXTREMITY_ORTHOSIS", primary_diagnosis_code: "M21.6X1", face_to_face_date: "2026-05-20" }
              as: Physician
              as_user_id: "${rx_phys_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /op/prescriptions/${rx_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "${rx_phys_id}"
            - call: "POST /op/device-orders"
              payload: { prescription_id: "${rx_id}", supplier_id: "${sup_id}", fitting_practitioner_id: "${fit_id}" }
              as: BillingSpecialist
              captures: { ord_id: $.data.id }
            - call: "POST /op/device-orders/${ord_id}/fabrication-milestones"
              payload: { step: "ASSEMBLY", weight: 1 }
              as: Practitioner
              as_user_id: "${fit_id}"
              captures: { ms_id: $.data.id }
            - call: "POST /op/device-orders/${ord_id}/start-fabrication"
              payload: {}
              as: Practitioner
              as_user_id: "${fit_id}"
            - call: "POST /op/fabrication-milestones/${ms_id}/complete"
              payload: {}
              as: Practitioner
              as_user_id: "${fit_id}"
            - call: "GET /op/device-orders/${ord_id}"
              payload: {}
              as: Practitioner
              as_user_id: "${fit_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /op/device-orders/${ord_id}/deliver"
              payload: { expected_device_order_version: "${ord_v}" }
              as: Practitioner
              as_user_id: "${fit_id}"
          trigger:
            - call: "GET /op/device-orders/${ord_id}/compliance-checks"
              payload: {}
              as: ComplianceOfficer
              captures: { cc_passed: "$.data[0].passed" }
          assert:
            - "exactly one ComplianceCheck returned; data[0].passed == true; data[0].failure_reasons == []"
            - "ComplianceCheck record has no version field"

  # =================================================================
  - section: state_machines
    instances:
      - name: sign_prescription_from_signed_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Prescription.DRAFT_to_SIGNED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Signing a Prescription already in SIGNED returns ERR_INVALID_STATE (409); no version bump beyond the first sign."
        test_recipe:
          setup: ["A SIGNED Prescription."]
          setup_api_calls:
            - call: "POST /op/physicians"
              payload: { full_name: "Dr A", npi: "1111111111", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { phys_id: $.data.id }
            - call: "POST /op/patients"
              payload: { full_name: "Pat S", date_of_birth: "1970-02-02", payer_type: "COMMERCIAL" }
              as: BillingSpecialist
              captures: { pat_id: $.data.id }
            - call: "POST /op/prescriptions"
              payload: { patient_id: "${pat_id}", physician_id: "${phys_id}", device_category: "SPINAL_ORTHOSIS", primary_diagnosis_code: "M54.5", face_to_face_date: "2026-04-20" }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /op/prescriptions/${rx_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
          trigger:
            - call: "POST /op/prescriptions/${rx_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE"

      - name: deliver_from_intake_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.DeviceOrder.READY_FOR_FITTING_to_DELIVERED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Delivering an order still at INTAKE returns ERR_INVALID_STATE (409); OCC and compliance gates never run because state precondition (p5) fails first."
        test_recipe:
          setup: ["A no-auth orthosis order at INTAKE."]
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /op/physicians"
              payload: { full_name: "Dr Rx", npi: "1111111111", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { rx_phys_id: $.data.id }
            - call: "POST /op/physicians"
              payload: { full_name: "Tech Fit", npi: "2222222222", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { fit_id: $.data.id }
            - call: "POST /op/suppliers"
              payload: { legal_name: "Acme O&P", accreditation_expiry: "2027-01-01T00:00:00Z", surety_bond_active: true }
              as: ComplianceOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /op/patients"
              payload: { full_name: "Pat IS", date_of_birth: "1960-01-01", payer_type: "COMMERCIAL" }
              as: BillingSpecialist
              captures: { pat_id: $.data.id }
            - call: "POST /op/prescriptions"
              payload: { patient_id: "${pat_id}", physician_id: "${rx_phys_id}", device_category: "LOWER_EXTREMITY_ORTHOSIS", primary_diagnosis_code: "M21.6X1", face_to_face_date: "2026-05-20" }
              as: Physician
              as_user_id: "${rx_phys_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /op/prescriptions/${rx_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "${rx_phys_id}"
            - call: "POST /op/device-orders"
              payload: { prescription_id: "${rx_id}", supplier_id: "${sup_id}", fitting_practitioner_id: "${fit_id}" }
              as: BillingSpecialist
              captures: { ord_id: $.data.id, ord_v: $.data.version }
          trigger:
            - call: "POST /op/device-orders/${ord_id}/deliver"
              payload: { expected_device_order_version: "${ord_v}" }
              as: Practitioner
              as_user_id: "${fit_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE"

      - name: terminal_state_lockdown_cancelled_order
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.DeviceOrder.INTAKE_to_CANCELLED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A CANCELLED DeviceOrder is terminal — a second cancel returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A CANCELLED order."]
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /op/physicians"
              payload: { full_name: "Dr Rx", npi: "1111111111", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { rx_phys_id: $.data.id }
            - call: "POST /op/physicians"
              payload: { full_name: "Tech Fit", npi: "2222222222", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { fit_id: $.data.id }
            - call: "POST /op/suppliers"
              payload: { legal_name: "Acme O&P", accreditation_expiry: "2027-01-01T00:00:00Z", surety_bond_active: true }
              as: ComplianceOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /op/patients"
              payload: { full_name: "Pat TL", date_of_birth: "1960-01-01", payer_type: "COMMERCIAL" }
              as: BillingSpecialist
              captures: { pat_id: $.data.id }
            - call: "POST /op/prescriptions"
              payload: { patient_id: "${pat_id}", physician_id: "${rx_phys_id}", device_category: "LOWER_EXTREMITY_ORTHOSIS", primary_diagnosis_code: "M21.6X1", face_to_face_date: "2026-05-20" }
              as: Physician
              as_user_id: "${rx_phys_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /op/prescriptions/${rx_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "${rx_phys_id}"
            - call: "POST /op/device-orders"
              payload: { prescription_id: "${rx_id}", supplier_id: "${sup_id}", fitting_practitioner_id: "${fit_id}" }
              as: BillingSpecialist
              captures: { ord_id: $.data.id }
            - call: "POST /op/device-orders/${ord_id}/cancel"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /op/device-orders/${ord_id}/cancel"
              payload: {}
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE"

      - name: initial_state_priorauth_submitted
        claim_type: Initial State
        grounds: [state_machines.PriorAuth.SUBMITTED_to_PENDED, entities.PriorAuth.fields.status]
        distinguishing_aspect: "A PriorAuth cascaded by submit-auth starts in SUBMITTED with submission_round==1 and decision_deadline == clock+14d == 2026-06-15T00:00:00Z."
        test_recipe:
          setup: ["Medicare lower-limb order; clock 2026-06-01."]
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /op/physicians"
              payload: { full_name: "Dr Rx", npi: "1111111111", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { rx_phys_id: $.data.id }
            - call: "POST /op/physicians"
              payload: { full_name: "Tech Fit", npi: "2222222222", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { fit_id: $.data.id }
            - call: "POST /op/suppliers"
              payload: { legal_name: "Acme O&P", accreditation_expiry: "2027-01-01T00:00:00Z", surety_bond_active: true }
              as: ComplianceOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /op/patients"
              payload: { full_name: "Med Pat", date_of_birth: "1955-01-01", payer_type: "MEDICARE", medicare_beneficiary_id: "1EG4TE5MK72", functional_k_level: 3 }
              as: BillingSpecialist
              captures: { pat_id: $.data.id }
            - call: "POST /op/prescriptions"
              payload: { patient_id: "${pat_id}", physician_id: "${rx_phys_id}", device_category: "LOWER_LIMB_PROSTHETIC", primary_diagnosis_code: "Z89.511", face_to_face_date: "2026-05-20" }
              as: Physician
              as_user_id: "${rx_phys_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /op/prescriptions/${rx_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "${rx_phys_id}"
            - call: "POST /op/device-orders"
              payload: { prescription_id: "${rx_id}", supplier_id: "${sup_id}", fitting_practitioner_id: "${fit_id}" }
              as: BillingSpecialist
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /op/device-orders/${ord_id}/submit-auth"
              payload: {}
              as: BillingSpecialist
              captures: { pa_id: $.data.id, st: $.data.status, dd: $.data.decision_deadline, sr: $.data.submission_round }
          assert:
            - "PriorAuth.${pa_id}.status == SUBMITTED; submission_round == 1; decision_deadline == 2026-06-15T00:00:00Z"

      - name: priorauth_auto_expire_on_clock_sweep
        claim_type: cyclic
        grounds: [state_machines.PriorAuth.SUBMITTED_to_EXPIRED, entities.PriorAuth.fields.decision_deadline]
        distinguishing_aspect: "Advancing the clock past decision_deadline (to 2026-06-16, > 2026-06-15) auto-EXPIRES a SUBMITTED PriorAuth via the clock-set sweep."
        test_recipe:
          setup: ["A SUBMITTED PriorAuth with decision_deadline 2026-06-15."]
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /op/physicians"
              payload: { full_name: "Dr Rx", npi: "1111111111", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { rx_phys_id: $.data.id }
            - call: "POST /op/physicians"
              payload: { full_name: "Tech Fit", npi: "2222222222", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { fit_id: $.data.id }
            - call: "POST /op/suppliers"
              payload: { legal_name: "Acme O&P", accreditation_expiry: "2027-01-01T00:00:00Z", surety_bond_active: true }
              as: ComplianceOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /op/patients"
              payload: { full_name: "Med Pat", date_of_birth: "1955-01-01", payer_type: "MEDICARE", medicare_beneficiary_id: "1EG4TE5MK72", functional_k_level: 3 }
              as: BillingSpecialist
              captures: { pat_id: $.data.id }
            - call: "POST /op/prescriptions"
              payload: { patient_id: "${pat_id}", physician_id: "${rx_phys_id}", device_category: "LOWER_LIMB_PROSTHETIC", primary_diagnosis_code: "Z89.511", face_to_face_date: "2026-05-20" }
              as: Physician
              as_user_id: "${rx_phys_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /op/prescriptions/${rx_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "${rx_phys_id}"
            - call: "POST /op/device-orders"
              payload: { prescription_id: "${rx_id}", supplier_id: "${sup_id}", fitting_practitioner_id: "${fit_id}" }
              as: BillingSpecialist
              captures: { ord_id: $.data.id }
            - call: "POST /op/device-orders/${ord_id}/submit-auth"
              payload: {}
              as: BillingSpecialist
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /op/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /op/prior-auths/${pa_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { st: $.data.status }
          assert:
            - "PriorAuth.${pa_id}.status == EXPIRED"

      - name: bubble_up_fabrication_to_ready_on_last_milestone
        claim_type: Bubble up
        grounds: [state_machines.DeviceOrder.FABRICATION_to_READY_FOR_FITTING, calculations.fabrication_progress]
        distinguishing_aspect: "When the final FabricationMilestone is completed, milestone_progress_pct reaches 100 and the DeviceOrder bubbles FABRICATION->READY_FOR_FITTING automatically."
        test_recipe:
          setup: ["No-auth orthosis order in FABRICATION with two milestones (weights 2 and 3); first already complete."]
          setup_api_calls:
            - call: "POST /op/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /op/physicians"
              payload: { full_name: "Dr Rx", npi: "1111111111", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { rx_phys_id: $.data.id }
            - call: "POST /op/physicians"
              payload: { full_name: "Tech Fit", npi: "2222222222", pecos_enrolled: true }
              as: ComplianceOfficer
              captures: { fit_id: $.data.id }
            - call: "POST /op/suppliers"
              payload: { legal_name: "Acme O&P", accreditation_expiry: "2027-01-01T00:00:00Z", surety_bond_active: true }
              as: ComplianceOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /op/patients"
              payload: { full_name: "Pat BU", date_of_birth: "1960-01-01", payer_type: "COMMERCIAL" }
              as: BillingSpecialist
              captures: { pat_id: $.data.id }
            - call: "POST /op/prescriptions"
              payload: { patient_id: "${pat_id}", physician_id: "${rx_phys_id}", device_category: "LOWER_EXTREMITY_ORTHOSIS", primary_diagnosis_code: "M21.6X1", face_to_face_date: "2026-05-20" }
              as: Physician
              as_user_id: "${rx_phys_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /op/prescriptions/${rx_id}/sign"
              payload: {}
              as: Physician
              as_user_id: "${rx_phys_id}"
            - call: "POST /op/device-orders"
              payload: { prescription_id: "${rx_id}", supplier_id: "${sup_id}", fitting_practitioner_id: "${fit_id}" }
              as: BillingSpecialist
              captures: { ord_id: $.data.id }
            - call: "POST /op/device-orders/${ord_id}/fabrication-milestones"
              payload: { step: "CASTING", weight: 2 }
              as: Practitioner
              as_user_id: "${fit_id}"
              captures: { ms1_id: $.data.id }
            - call: "POST /op/device-orders/${ord_id}/fabrication-milestones"
              payload: { step: "ASSEMBLY", weight: 3 }
              as: Practitioner
              as_user_id: "${fit_id}"
              captures: { ms2_id: $.data.id }
            - call: "POST /op/device-orders/${ord_id}/start-fabrication"
              payload: {}
              as: Practitioner
              as_user_id: "${fit_id}"
            - call: "POST /op/fabrication-milestones/${ms1_id}/complete"
              payload: {}
              as: Practitioner
              as_user_id: "${fit_id}"
              captures: { pct1: $.data.id }
          trigger:
            - call: "POST /op/fabrication-milestones/${ms2_id}/complete"
              payload: {}
              as: Practitioner
              as_user_id: "${fit_id}"
            - call: "GET /op/device-orders/${ord_id}"
              payload: {}
              as: Practitioner
              as_user_id: "${fit_id}"
              captures: { st: $.data.status, pct: $.data.milestone_progress_pct }
          assert:
            - "DeviceOrder.${ord_id}.milestone_progress_pct == 100"
            - "DeviceOrder.${ord_id}.status == READY_FOR_FITTING"

      - name: start_fabrication_requires_milestone
        claim_type: Precondition Enforcement
        grounds:
