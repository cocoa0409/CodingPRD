  # =========================================================================
  # 3. From Table 3 (Calculations)
  # =========================================================================
  - section: calculations
    instances:
      - name: service_event_exactly_730_days_old_is_inside_the_window_and_731_is_outside
        claim_type: input_set_filtering
        grounds:
          - calculations.asset_ruls_score.input_set
          - calculations.asset_ruls_score.constants.SERVICE_WINDOW_DAYS
        distinguishing_aspect: >-
          The trailing service window is CLOSED at both ends: with the clock at 2026-08-01, an event
          dated 2024-08-01 is exactly 730 days old and counts, while 2024-07-31 is 731 days old and is
          excluded — two otherwise identical assets end at adjusted 35.00 and 40.00.
        test_recipe:
          setup:
            - "Facility NRH, department DEPT-A1, two assets install 2020-08-02 with expected_life_years 10 -> age 6.00, nominal 40.00, oem 2029-06-01 (eos penalty 0.00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH", region: "NORTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_a_id: $.data.id }
            - call: "POST /capital/departments"
              payload: { facility_id: "${fac_a_id}", name: "Diagnostic Imaging CT", modality_scope: "CT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { dept_a1_id: $.data.id }
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-IN", install_date: "2020-08-02T00:00:00Z", expected_life_years: 10, acquisition_cost_cents: 100000000, oem_support_end_date: "2029-06-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_in_id: $.data.id }
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-OUT", install_date: "2020-08-02T00:00:00Z", expected_life_years: 10, acquisition_cost_cents: 100000000, oem_support_end_date: "2029-06-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_out_id: $.data.id }
          trigger:
            - call: "POST /capital/assets/${asset_in_id}/service-events"
              payload: { event_date: "2024-08-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 4.00, cost_cents: 250000 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/assets/${asset_out_id}/service-events"
              payload: { event_date: "2024-07-31T00:00:00Z", category: "CORRECTIVE", downtime_hours: 4.00, cost_cents: 250000 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
          assert:
            - "GET /capital/assets/${asset_in_id}: corrective_count_24m == 1, downtime_hours_24m == 4.00, service_penalty_points == 5.00 (3.00 + 0.50*4.00), adjusted_ruls_score == 35.00, nominal_ruls_score == 40.00, status IN_SERVICE"
            - "GET /capital/assets/${asset_out_id}: corrective_count_24m == 0, downtime_hours_24m == 0.00, service_penalty_points == 0.00, adjusted_ruls_score == 40.00, status IN_SERVICE"
            - "Both service-event rows exist and are returned by GET /capital/assets/{id}/service-events — the out-of-window event is stored, only the aggregation ignores it"
            - "Both assets' version == 2 (the append re-runs the score on both)"

      - name: service_penalty_cap_binds_only_the_service_term_and_can_drive_the_score_to_zero
        claim_type: constants_applied
        grounds:
          - calculations.asset_ruls_score.constants.SERVICE_PENALTY_CAP
          - calculations.asset_ruls_score.formula
        distinguishing_aspect: >-
          The 40.00 cap is applied to service_penalty_points ALONE (raw 3.00 + 0.50*100.00 = 53.00 is
          clipped to 40.00), and the clipped value then drives nominal 40.00 down to exactly 0.00 —
          which is the clamp floor, not a negative score, and derates the asset.
        test_recipe:
          setup:
            - "Facility NRH, department DEPT-A1, asset install 2020-08-02, expected_life_years 10 -> nominal 40.00, oem 2029-06-01 (eos penalty 0.00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH", region: "NORTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_a_id: $.data.id }
            - call: "POST /capital/departments"
              payload: { facility_id: "${fac_a_id}", name: "Diagnostic Imaging CT", modality_scope: "CT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { dept_a1_id: $.data.id }
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-CAP", install_date: "2020-08-02T00:00:00Z", expected_life_years: 10, acquisition_cost_cents: 100000000, oem_support_end_date: "2029-06-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_cap_id: $.data.id }
          trigger:
            - call: "POST /capital/assets/${asset_cap_id}/service-events"
              payload: { event_date: "2026-03-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 100.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
          assert:
            - "HTTP 201; GET /capital/assets/${asset_cap_id} -> service_penalty_points == 40.00 (raw 53.00 clipped by the cap), corrective_count_24m == 1, downtime_hours_24m == 100.00"
            - "adjusted_ruls_score == 0.00 (40.00 - 40.00, clamped at the floor and never negative) while nominal_ruls_score stays 40.00"
            - "status == DERATED (0.00 <= 15.00) and the asset is replacement-eligible"
            - "A hypothetical implementation that capped the SUM of all penalties instead of the service term alone would report the same 0.00 here but 20.00 on an asset that also carries an elapsed-support penalty — the cap's scope is only visible on the service term"

      - name: unresolved_recall_is_read_over_all_history_and_gates_status_both_ways
        claim_type: input_set_filtering
        grounds:
          - calculations.asset_ruls_score.formula
          - state_machines.EquipmentAsset.transitions[DERATED->IN_SERVICE]
        distinguishing_aspect: >-
          unresolved_recall reads the latest RECALL event over ALL history (not the 730-day window), so a
          2023 recall still derates a 2026 asset whose adjusted score is a healthy 30.00; appending a
          resolving RECALL clears the flag and restores IN_SERVICE with adjusted back to 40.00.
        test_recipe:
          setup:
            - "Facility NRH, department DEPT-A1, asset install 2020-08-02, expected_life_years 10 -> nominal 40.00, oem 2029-06-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH", region: "NORTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_a_id: $.data.id }
            - call: "POST /capital/departments"
              payload: { facility_id: "${fac_a_id}", name: "Diagnostic Imaging CT", modality_scope: "CT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { dept_a1_id: $.data.id }
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-REC", install_date: "2020-08-02T00:00:00Z", expected_life_years: 10, acquisition_cost_cents: 100000000, oem_support_end_date: "2029-06-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_rec_id: $.data.id }
          trigger:
            - call: "POST /capital/assets/${asset_rec_id}/service-events"
              payload: { event_date: "2023-01-01T00:00:00Z", category: "RECALL", downtime_hours: 0.00, recall_resolved: false, notes: "Vendor recall on the tube assembly." }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/assets/${asset_rec_id}/service-events"
              payload: { event_date: "2026-07-01T00:00:00Z", category: "RECALL", downtime_hours: 0.00, recall_resolved: true, notes: "Tube assembly replaced under the recall." }
              as: CapitalPlanner
              as_user_id: "planner-setup"
          assert:
            - "After trigger step 1: unresolved_recall == true, service_penalty_points == 0.00 (a RECALL is not a CORRECTIVE and carried no downtime), adjusted_ruls_score == 30.00 (40.00 - 10.00 recall penalty)"
            - "After trigger step 1: status == DERATED even though 30.00 > 15.00 — the recall flag alone derates, and the event is 947 days old, far outside the 730-day service window"
            - "After trigger step 2: unresolved_recall == false, adjusted_ruls_score == 40.00, status == IN_SERVICE (the DERATED -> IN_SERVICE edge), asset.version == 3"
            - "GET /capital/assets/${asset_rec_id}/service-events?category=RECALL returns both rows; the latest by (event_date DESC, created_at DESC) is authoritative"

      - name: growth_tier_break_is_read_after_the_two_decimal_rounding
        claim_type: threshold
        grounds:
          - calculations.priority_composite_score.formula
          - calculations.priority_composite_score.constants.GROWTH_TIER_BREAKS
        distinguishing_aspect: >-
          The volume growth percentage is rounded to 2 decimals BEFORE the tier lookup, so 1999/20000
          (raw 9.995) becomes 10.00 and lands in the 50.00 tier while 1998/20000 (raw 9.99) stays in the
          25.00 tier — a one-unit change in projected volume moves the composite by 5.00 points.
