# =============================================================================
# PRD Benchmark Scaffold — Voter Guide Production & Candidate Questionnaire
# Administration (League of Women Voters). Difficulty target: beyond-Expert
# (dense coupling over 14 entities, segregation-of-duties RBAC, logical clock,
# OCC, snapshot version pinning, cascading compliance enforcement).
# =============================================================================

scenario: |
  Voter Guide Production & Candidate Questionnaire Administration (League of Women Voters):
  race identification for a jurisdiction from official candidate filings with contest and
  ballot measure inventory, candidate questionnaire distribution with deadlines, word limits
  and unedited publication policies, nonresponse handling with clear indication when a
  candidate did not reply, ballot measure explanation drafting with pro and con arguments
  reviewed for neutrality, multilingual production and accessibility formatting with
  distribution through print, web and partner channels, candidate forum organization with
  moderator neutrality rules, participation criteria and question sourcing, nonpartisanship
  policy enforcement across chapters and volunteers, voter registration and education
  activities separated from advocacy positions.

domain_name: voter-guide-production
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit        # nonpartisanship enforcement, SoD, audit trail
  secondary_archetype: workflow_orchestration # guide production pipeline with branching
  complexity_layers:
    - optimistic_concurrency        # OCC on Contest.version and Questionnaire.version
    - cascading_side_effects        # incident substantiation -> suspension -> remand -> contest revert
    - dual_variant_calculation      # word counting STRICT/LENIENT; reading grade FK/SMOG
    - version_pinning_on_approval   # guide edition pins questionnaire versions at READY
    - scheduled_deferred_actions    # logical clock drives deadlines, sweeps, attestation lapse
    - derived_field_reconciliation  # completion_index, counters, snapshot staleness
  entity_topology: hybrid           # ElectionCycle->Jurisdiction->Contest tree + cross-cutting Volunteer refs
  state_machine_shape: branching    # cycles (refile, remand, amend, reopen) + reverts across entities
  relationship_patterns:
    - one_to_many
    - cross_aggregate               # CandidateResponse joins Questionnaire x CandidateFiling; Volunteer refs everywhere
  role_model: segregation_of_duties # drafter != reviewer; moderator != own-question selector
  consistency_model: immediate      # all mutations atomic and visible in the same response

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ElectionCycle
    parent: null
    common_fields: true
    fields:
      - { name: cycle_name, type: string, source: input, description: "Cycle name, e.g. '2026 General Election'" }
      - { name: election_date, type: string, source: input, description: "ISO calendar date of the election (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> OPEN -> PUBLISHED -> ARCHIVED", constraints: "enum: DRAFT | OPEN | PUBLISHED | ARCHIVED" }
      - { name: distributed_edition_count, type: integer, source: computed, description: "Count of GuideEdition rows of this cycle with status DISTRIBUTED" }

  - name: Jurisdiction
    parent: ElectionCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> ElectionCycle.id" }
      - { name: jurisdiction_name, type: string, source: input, description: "Jurisdiction name, e.g. 'City of Springfield'" }
      - { name: fips_code, type: string, source: input, description: "Official FIPS code; unique within the parent ElectionCycle", constraints: "unique per cycle_id" }
      - { name: supported_language_codes, type: array, source: input, description: "Languages this jurisdiction's guide material is produced in", constraints: "non-empty subset of EN | ES | ZH | VI | TL" }
      - { name: reading_level_metric, type: enum, source: input, description: "Which readability algorithm gates this jurisdiction's accessible editions", constraints: "enum: FLESCH_KINCAID | SMOG" }

  - name: Contest
    parent: Jurisdiction
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: system, description: "FK -> Jurisdiction.id" }
      - { name: kind, type: enum, source: input, description: "CANDIDATE_RACE holds filings+questionnaire; BALLOT_MEASURE holds one measure", constraints: "enum: CANDIDATE_RACE | BALLOT_MEASURE" }
      - { name: office_name, type: string, source: input, description: "Office name; required iff kind=CANDIDATE_RACE, must be omitted when kind=BALLOT_MEASURE (else ERR_INVALID_REQUEST)" }
      - { name: seat_count, type: integer, source: input, default: 1, description: "Number of seats" }
      - { name: vote_for_count, type: integer, source: input, default: 1, description: "Number a voter may select" }
      - { name: filing_deadline, type: datetime, source: input, description: "Last instant a CandidateFiling may be created or refiled (inclusive)" }
      - { name: questionnaire_word_limit, type: integer, source: input, default: 100, description: "Default per-answer word limit for this contest's questionnaire" }
      - { name: word_count_policy, type: enum, source: input, default: STRICT, description: "Word counting algorithm for answers in this contest", constraints: "enum: STRICT | LENIENT" }
      - { name: status, type: enum, source: system, description: "FILING_OPEN -> QUESTIONNAIRE_PHASE -> GUIDE_READY -> LOCKED; GUIDE_READY/LOCKED may revert to QUESTIONNAIRE_PHASE via incident cascade", constraints: "enum: FILING_OPEN | QUESTIONNAIRE_PHASE | GUIDE_READY | LOCKED" }
      - { name: verified_candidate_count, type: integer, source: computed, description: "Count of CandidateFiling rows of this contest with status VERIFIED" }
      - { name: completion_index, type: number, source: computed, description: "Derived on read: 100 * questionnaire.submitted_count / questionnaire.invited_count rounded to 1dp half-up; 0.0 when no questionnaire or invited_count == 0" }

  - name: CandidateFiling
    parent: Contest
    common_fields: true
    fields:
      - { name: contest_id, type: string, source: system, description: "FK -> Contest.id" }
      - { name: candidate_name, type: string, source: input, description: "Candidate name as officially filed" }
      - { name: party_label, type: string, source: input, description: "Party label as officially filed (may be 'Nonpartisan')" }
      - { name: filing_reference, type: string, source: input, description: "Official filing reference; unique within the parent Contest", constraints: "unique per contest_id" }
      - { name: status, type: enum, source: system, description: "FILED -> VERIFIED -> WITHDRAWN -> FILED cycle; VERIFIED -> DISQUALIFIED terminal", constraints: "enum: FILED | VERIFIED | WITHDRAWN | DISQUALIFIED" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent create/refile" }
      - { name: verified_at, type: datetime, source: system, description: "Logical-clock timestamp of most recent verification; null until first verify" }
      - { name: withdrawal_count, type: integer, source: computed, description: "Number of times this filing has entered WITHDRAWN" }

  - name: Questionnaire
    parent: Contest
    common_fields: true
    fields:
      - { name: contest_id, type: string, source: system, description: "FK -> Contest.id (contest.kind must be CANDIDATE_RACE); at most one Questionnaire per Contest" }
      - { name: due_at, type: datetime, source: input, description: "Submission deadline; submissions accepted while current_utc <= due_at" }
      - { name: questions, type: array, source: input, description: "Ordered question objects [{position_index:int, prompt_text:str, word_limit_override:int?}]; position_index unique within the questionnaire; word_limit_override null falls back to contest.questionnaire_word_limit" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ISSUED -> CLOSED -> PINNED; ISSUED -> ISSUED self-amend; DRAFT -> DRAFT self-amend", constraints: "enum: DRAFT | ISSUED | CLOSED | PINNED" }
      - { name: invited_count, type: integer, source: computed, description: "Total CandidateResponse shells ever created for this questionnaire" }
      - { name: submitted_count, type: integer, source: computed, description: "Responses currently in status SUBMITTED" }
      - { name: nonresponse_count, type: integer, source: computed, description: "Responses currently NONRESPONSE_MARKED" }
      - { name: late_count, type: integer, source: computed, description: "Responses currently LATE_UNPUBLISHED" }

  - name: CandidateResponse
    parent: Questionnaire
    common_fields: true
    fields:
      - { name: questionnaire_id, type: string, source: system, description: "FK -> Questionnaire.id" }
      - { name: filing_id, type: string, source: system, description: "CandidateFiling.id of the responding candidate; equals the Candidate role's X-User-ID (shell identified by (questionnaire_id, filing_id) pair)" }
      - { name: answers, type: array, source: input, description: "[{position_index:int, text:str}]; every declared question position must be answered exactly once" }
      - { name: status, type: enum, source: system, description: "INVITED -> SUBMITTED | OVER_LIMIT_RETURNED; OVER_LIMIT_RETURNED -> SUBMITTED | OVER_LIMIT_RETURNED; INVITED -> NONRESPONSE_MARKED (sweep); OVER_LIMIT_RETURNED -> LATE_UNPUBLISHED (sweep); any -> WITHDRAWN_HIDDEN (filing withdraw); WITHDRAWN_HIDDEN -> INVITED (refile)", constraints: "enum: INVITED | SUBMITTED | OVER_LIMIT_RETURNED | NONRESPONSE_MARKED | LATE_UNPUBLISHED | WITHDRAWN_HIDDEN" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of last successful (in-window) submission; null until then" }
      - { name: per_answer_word_counts, type: array, source: computed, description: "Word count per answer in answers order, computed with the contest's word_count_policy" }
      - { name: over_limit_positions, type: array, source: computed, description: "position_index values whose word count strictly exceeds the effective limit; empty when submission passes" }
      - { name: published_indicator, type: enum, source: computed, description: "Voter-facing indicator: SUBMITTED -> PUBLISHED_UNEDITED; NONRESPONSE_MARKED -> DID_NOT_RESPOND; LATE_UNPUBLISHED -> LATE; WITHDRAWN_HIDDEN -> WITHDRAWN; INVITED/OVER_LIMIT_RETURNED -> PENDING", constraints: "enum: PENDING | PUBLISHED_UNEDITED | DID_NOT_RESPOND | LATE | WITHDRAWN" }

  - name: BallotMeasure
    parent: Contest
    common_fields: true
    fields:
      - { name: contest_id, type: string, source: system, description: "FK -> Contest.id (contest.kind must be BALLOT_MEASURE); at most one BallotMeasure per Contest" }
      - { name: measure_title, type: string, source: input, description: "Measure title" }
      - { name: official_text, type: string, source: input, description: "Official ballot text" }
      - { name: explanation_text, type: string, source: input, description: "League-drafted neutral explanation" }
      - { name: drafter_volunteer_id, type: string, source: system, description: "Volunteer.id of the drafting editor = X-User-ID at creation; attribution stamp for segregation of duties" }
      - { name: status, type: enum, source: system, description: "DRAFTING -> IN_NEUTRALITY_REVIEW -> APPROVED_FOR_GUIDE | REMANDED; REMANDED -> DRAFTING via revise; any non-terminal review state -> REMANDED via incident quarantine", constraints: "enum: DRAFTING | IN_NEUTRALITY_REVIEW | REMANDED | APPROVED_FOR_GUIDE" }
      - { name: review_round_count, type: integer, source: computed, description: "Number of times this measure has entered IN_NEUTRALITY_REVIEW" }
      - { name: approvals_this_round, type: integer, source: computed, description: "Distinct-reviewer NEUTRAL verdicts with round_index == review_round_count; reset to 0 on each submit-for-review; measure approves when this reaches 2" }
      - { name: pro_word_total, type: integer, source: computed, description: "Sum of word_count over ACCEPTED PRO arguments" }
      - { name: con_word_total, type: integer, source: computed, description: "Sum of word_count over ACCEPTED CON arguments" }
      - { name: balance_ratio, type: number, source: computed, description: "abs(pro_word_total - con_word_total) / max(pro_word_total, con_word_total, 1), 4dp round_half_up" }
      - { name: balance_flag, type: boolean, source: computed, description: "true when balance_ratio > 0.15 (advisory to reviewer)" }
      - { name: grade_fk, type: number, source: computed, description: "Flesch-Kincaid grade of explanation_text, 2dp round_half_up (see reading_grade_level)" }
      - { name: grade_smog, type: number, source: computed, description: "SMOG grade of explanation_text, 2dp round_half_up (see reading_grade_level)" }

  - name: MeasureArgument
    parent: BallotMeasure
    common_fields: true
    fields:
      - { name: measure_id, type: string, source: system, description: "FK -> BallotMeasure.id" }
      - { name: side, type: enum, source: input, description: "Which side the argument advocates", constraints: "enum: PRO | CON" }
      - { name: argument_text, type: string, source: input, description: "Argument text" }
      - { name: author_credit, type: string, source: input, description: "Attribution line published with the argument" }
      - { name: word_count, type: integer, source: computed, description: "STRICT word count of argument_text" }
      - { name: status, type: enum, source: system, description: "SUBMITTED rows are immediately evaluated: word_count <= 250 -> ACCEPTED, else REJECTED", constraints: "enum: SUBMITTED | ACCEPTED | REJECTED" }

  - name: NeutralityReview
    parent: BallotMeasure
    common_fields: true
    fields:
      - { name: measure_id, type: string, source: system, description: "FK -> BallotMeasure.id" }
      - { name: reviewer_volunteer_id, type: string, source: system, description: "Volunteer.id of the reviewer = X-User-ID at creation; attribution stamp for segregation of duties" }
      - { name: verdict, type: enum, source: input, description: "NEUTRAL approves; LOADED_LANGUAGE or UNBALANCED remands", constraints: "enum: NEUTRAL | LOADED_LANGUAGE | UNBALANCED" }
      - { name: notes, type: string, source: input, description: "Reviewer notes" }
      - { name: round_index, type: integer, source: computed, description: "Measure.review_round_count at the time this review was created" }

  - name: GuideEdition
    parent: ElectionCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> ElectionCycle.id" }
      - { name: language_code, type: enum, source: input, description: "Language of this edition", constraints: "enum: EN | ES | ZH | VI | TL" }
      - { name: channel, type: enum, source: input, description: "Distribution channel", constraints: "enum: PRINT | WEB | PARTNER" }
      - { name: accessibility_format, type: enum, source: input, description: "Accessibility format; non-STANDARD formats trigger the reading-grade gate at READY", constraints: "enum: STANDARD | LARGE_PRINT | SCREEN_READER" }
      - { name: status, type: enum, source: system, description: "ASSEMBLING -> READY -> DISTRIBUTED -> RETIRED; READY -> ASSEMBLING re-open", constraints: "enum: ASSEMBLING | READY | DISTRIBUTED | RETIRED" }
      - { name: snapshot_contest_ids, type: array, source: computed, description: "Contest ids pinned at READY (all contests of the cycle with status LOCKED at that instant); emptied on re-open" }
      - { name: pinned_questionnaire_versions, type: object, source: computed, description: "{contest_id: questionnaire.version} pinned at READY for each snapshot candidate contest" }
      - { name: estimated_page_count, type: integer, source: computed, description: "Computed at READY per guide_page_estimate; stable while READY" }
      - { name: print_run_total, type: integer, source: input, description: "Total printable copies declared at distribute" }
      - { name: allocations, type: array, source: computed, description: "[{channel_code, requested, priority_tier, allocated}] produced by print_copy_allocation at distribute" }
      - { name: unallocated_copies, type: integer, source: computed, description: "print_run_total - sum(allocated) after distribute" }

  - name: Forum
    parent: Contest
    common_fields: true
    fields:
      - { name: contest_id, type: string, source: system, description: "FK -> Contest.id (contest.kind must be CANDIDATE_RACE)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Forum start (UTC); must be strictly before scheduled_end" }
      - { name: scheduled_end, type: datetime, source: input, description: "Forum end (UTC)" }
      - { name: moderator_volunteer_id, type: string, source: input, description: "Volunteer.id of the assigned moderator (must carry MODERATOR role, be ACTIVE, CURRENT attestation, advocacy_flag false)" }
      - { name: status, type: enum, source: system, description: "PLANNED -> CONFIRMED -> HELD; PLANNED/CONFIRMED -> CANCELLED", constraints: "enum: PLANNED | CONFIRMED | HELD | CANCELLED" }
      - { name: eligible_candidate_count, type: integer, source: computed, description: "Count of CandidateFiling rows of this forum's contest with status VERIFIED; recomputed on create and on confirm" }
      - { name: minutes_text, type: string, source: input, description: "Forum minutes; required when transitioning to HELD" }

  - name: ForumQuestion
    parent: Forum
    common_fields: true
    fields:
      - { name: forum_id, type: string, source: system, description: "FK -> Forum.id" }
      - { name: question_text, type: string, source: input, description: "Question text" }
      - { name: source, type: enum, source: input, description: "PUBLIC_SUBMISSION (PublicUser or moderator on behalf of public) or MODERATOR_AUTHORED", constraints: "enum: PUBLIC_SUBMISSION | MODERATOR_AUTHORED" }
      - { name: author_volunteer_id, type: string, source: system, description: "Volunteer.id when source=MODERATOR_AUTHORED (equals X-User-ID); null for PUBLIC_SUBMISSION" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> SELECTED | REJECTED", constraints: "enum: SUBMITTED | SELECTED | REJECTED" }

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_name, type: string, source: input, description: "Volunteer name" }
      - { name: chapter_code, type: string, source: input, description: "Chapter code the volunteer belongs to" }
      - { name: roles, type: array, source: input, description: "Capability tags gating entity-backed roles", constraints: "non-empty subset of COORDINATOR | EDITOR | REVIEWER | MODERATOR" }
      - { name: advocacy_flag, type: boolean, source: input, default: false, description: "true when the volunteer holds an advocacy position; bars drafting/reviewing/moderating (voter-education separation)" }
      - { name: attestation_status, type: enum, source: system, description: "CURRENT until current_utc > attestation_expires_at, then lazily evaluated as LAPSED; attest resets", constraints: "enum: CURRENT | LAPSED" }
      - { name: attestation_expires_at, type: datetime, source: system, description: "created_at + 90 days at creation; reset to now + 90 days on attest" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SUSPENDED (incident substantiation); SUSPENDED is terminal", constraints: "enum: ACTIVE | SUSPENDED" }
      - { name: substantiated_incident_count, type: integer, source: computed, description: "Count of PolicyIncident rows for this volunteer with status SUBSTANTIATED" }

  - name: PolicyIncident
    parent: Volunteer
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id" }
      - { name: incident_type, type: enum, source: input, description: "Category of alleged nonpartisanship breach", constraints: "enum: PARTISAN_STATEMENT | ADVOCACY_ROLE_CONFLICT | MODERATOR_BIAS | QUESTIONNAIRE_SLANT" }
      - { name: description, type: string, source: input, description: "Incident description" }
      - { name: status, type: enum, source: system, description: "REPORTED -> SUBSTANTIATED | DISMISSED", constraints: "enum: REPORTED | SUBSTANTIATED | DISMISSED" }
      - { name: corrective_action, type: string, source: input, description: "Required when resolving to SUBSTANTIATED" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock timestamp of substantiate/dismiss; null while REPORTED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ElectionCycle
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /election-cycles/{id}/transitions {to: OPEN}"
        actor: LeagueAdmin
        preconditions: []
        side_effects: ["ElectionCycle.version increments by 1"]
      - from: OPEN
        to: PUBLISHED
        trigger: "POST /election-cycles/{id}/transitions {to: PUBLISHED}"
        actor: LeagueAdmin
        preconditions:
          - "Cycle has >= 1 Contest and every Contest of the cycle has status LOCKED (ERR_CONTESTS_NOT_LOCKED)"
          - "No PolicyIncident whose volunteer_id belongs to any Volunteer referenced by this cycle's activity has status REPORTED (ERR_UNRESOLVED_INCIDENTS_EXIST)"
          - "distributed_edition_count >= 1 (ERR_NO_DISTRIBUTED_EDITION)"
        side_effects: ["ElectionCycle.version increments by 1"]
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /election-cycles/{id}/transitions {to: ARCHIVED}"
        actor: LeagueAdmin
        preconditions: []
        side_effects: ["ElectionCycle.version increments by 1"]

  - entity: Contest
    initial_state: FILING_OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: FILING_OPEN
        to: QUESTIONNAIRE_PHASE
        trigger: "POST /contests/{id}/transitions {to: QUESTIONNAIRE_PHASE, expected_contest_version}"
        actor: ChapterCoordinator
        preconditions:
          - "Parent ElectionCycle.status == OPEN (ERR_CYCLE_NOT_OPEN)"
          - "current_utc > filing_deadline (ERR_FILING_STILL_OPEN; at exactly filing_deadline the phase advance is rejected and filings remain acceptable)"
          - "expected_contest_version == Contest.version (ERR_STALE_VERSION)"
        side_effects: ["Contest.version increments by 1"]
      - from: QUESTIONNAIRE_PHASE
        to: GUIDE_READY
        trigger: "POST /contests/{id}/transitions {to: GUIDE_READY, expected_contest_version}"
        actor: ChapterCoordinator
        preconditions:
          - "kind == CANDIDATE_RACE: the contest's Questionnaire has status PINNED (ERR_QUESTIONNAIRE_NOT_PINNED)"
          - "kind == BALLOT_MEASURE: the contest's BallotMeasure has status APPROVED_FOR_GUIDE (ERR_NEUTRALITY_REVIEW_OUTSTANDING)"
          - "expected_contest_version == Contest.version (ERR_STALE_VERSION)"
        side_effects: ["Contest.version increments by 1"]
      - from: GUIDE_READY
        to: LOCKED
        trigger: "POST /contests/{id}/transitions {to: LOCKED, expected_contest_version}"
        actor: ChapterCoordinator
        preconditions:
          - "expected_contest_version == Contest.version (ERR_STALE_VERSION)"
        side_effects: ["Contest.version increments by 1"]
      - from: GUIDE_READY
        to: QUESTIONNAIRE_PHASE
        trigger: "system (PolicyIncident substantiation cascade on the drafter of this contest's BallotMeasure)"
        actor: system
        preconditions: []
        side_effects: ["Contest.version increments by 1"]
        note: "Fires only for BALLOT_MEASURE contests whose measure was quarantined to REMANDED; candidate contests are not reverted."
      - from: LOCKED
        to: QUESTIONNAIRE_PHASE
        trigger: "system (PolicyIncident substantiation cascade on the drafter of this contest's BallotMeasure)"
        actor: system
        preconditions: []
        side_effects: ["Contest.version increments by 1"]
        note: "Unlocking a LOCKED contest makes every READY/DISTRIBUTED-attempted GuideEdition snapshot stale (see ERR_STALE_SNAPSHOT)."

  - entity: CandidateFiling
    initial_state: FILED
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: FILED
        to: VERIFIED
        trigger: "POST /filings/{id}/verify"
        actor: ChapterCoordinator
        preconditions:
          - "Contest.status == FILING_OPEN or QUESTIONNAIRE_PHASE (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "verified_at = current_utc; Contest.verified_candidate_count recomputed; Contest.version increments by 1"
          - "If the contest's Questionnaire exists with status ISSUED, current_utc <= due_at, and no CandidateResponse shell exists for (questionnaire, filing): create shell INVITED and recompute Questionnaire.invited_count"
      - from: VERIFIED
        to: WITHDRAWN
        trigger: "POST /filings/{id}/withdraw"
        actor: ChapterCoordinator
        preconditions: []
        side_effects:
          - "withdrawal_count += 1; Contest.verified_candidate_count recomputed; Contest.version increments by 1"
          - "Cascade link 1: the CandidateResponse shell for this filing (if one exists) -> WITHDRAWN_HIDDEN regardless of its current status"
          - "Cascade link 2 (caused by link 1): Questionnaire.submitted_count / nonresponse_count / late_count recomputed; Contest.completion_index re-derives on read"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /filings/{id}/withdraw"
        actor: ChapterCoordinator
        preconditions: []
        side_effects: ["withdrawal_count += 1 (no shell can exist for an unverified filing)"]
      - from: VERIFIED
        to: DISQUALIFIED
        trigger: "POST /filings/{id}/disqualify {reason}"
        actor: ChapterCoordinator
        preconditions: []
        side_effects:
          - "Contest.verified_candidate_count recomputed; Contest.version increments by 1"
          - "CandidateResponse shell for this filing (if any) -> WITHDRAWN_HIDDEN; Questionnaire counters recomputed"
      - from: WITHDRAWN
        to: FILED
        trigger: "POST /filings/{id}/refile"
        actor: ChapterCoordinator
        preconditions:
          - "Contest.status == FILING_OPEN with current_utc <= filing_deadline, OR Contest.status == QUESTIONNAIRE_PHASE with the contest's Questionnaire ISSUED and current_utc <= due_at (otherwise ERR_FILING_DEADLINE_PASSED)"
        side_effects:
          - "filed_at = current_utc; withdrawal_count unchanged"
          - "If a WITHDRAWN_HIDDEN shell exists for this filing: shell -> INVITED (answers preserved); Questionnaire counters recomputed"

  - entity: Questionnaire
    initial_state: DRAFT
    terminal_states: [PINNED]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "POST /questionnaires/{id}/amend"
        actor: QuestionnaireEditor
        preconditions: ["expected_questionnaire_version == Questionnaire.version (ERR_STALE_VERSION)"]
        side_effects: ["due_at and/or questions replaced when supplied; Questionnaire.version increments by 1"]
        note: "Free edit loop while DRAFT."
      - from: DRAFT
        to: ISSUED
        trigger: "POST /questionnaires/{id}/issue"
        actor: QuestionnaireEditor
        preconditions:
          - "questions array non-empty (ERR_INVALID_REQUEST)"
          - "Contest.status == QUESTIONNAIRE_PHASE (ERR_INVALID_STATE)"
        side_effects:
          - "For each CandidateFiling of the contest with status VERIFIED: create CandidateResponse shell INVITED with empty answers"
          - "Questionnaire.invited_count = number of shells created; Questionnaire.version increments by 1"
      - from: ISSUED
        to: ISSUED
        trigger: "POST /questionnaires/{id}/amend"
        actor: QuestionnaireEditor
        preconditions: ["expected_questionnaire_version == Questionnaire.version (ERR_STALE_VERSION)"]
        side_effects:
          - "due_at and/or questions replaced when supplied; Questionnaire.version increments by 1"
          - "Cascade link 1: if due_at was extended to a value > current_utc, every NONRESPONSE_MARKED shell -> INVITED"
          - "Cascade link 2 (caused by link 1): Questionnaire.nonresponse_count and invited-vs-outstanding counters recomputed; Contest.completion_index re-derives on read"
      - from: ISSUED
        to: CLOSED
        trigger: "POST /questionnaires/{id}/close"
        actor: QuestionnaireEditor
        preconditions: ["current_utc > due_at (ERR_CLOSE_BEFORE_DEADLINE)"]
        side_effects: ["Questionnaire.version increments by 1"]
      - from: CLOSED
        to: PINNED
        trigger: "POST /questionnaires/{id}/pin"
        actor: QuestionnaireEditor
        preconditions: []
        side_effects: ["Questionnaire.version increments by 1; snapshot eligibility for GuideEdition READY established"]

  - entity: CandidateResponse
    initial_state: INVITED
    terminal_states: [NONRESPONSE_MARKED, LATE_UNPUBLISHED]
    transitions:
      - from: INVITED
        to: SUBMITTED
        trigger: "POST /questionnaires/{qid}/responses (Candidate, X-User-ID = filing_id)"
        actor: Candidate
        preconditions:
          - "Shell exists for (questionnaire_id, X-User-ID) (ERR_NOT_FOUND otherwise)"
          - "Questionnaire.status == ISSUED (ERR_QUESTIONNAIRE_NOT_ACCEPTING_SUBMISSIONS)"
          - "Shell filing.status == VERIFIED, i.e. shell not WITHDRAWN_HIDDEN (ERR_FILING_NOT_VERIFIED)"
          - "current_utc <= due_at (ERR_SUBMISSION_WINDOW_CLOSED)"
          - "answers cover every declared position_index exactly once (ERR_INVALID_REQUEST)"
        side_effects:
          - "per_answer_word_counts computed with contest.word_count_policy; when every answer is within its effective limit: status SUBMITTED, submitted_at = current_utc, over_limit_positions = []"
          - "Questionnaire.submitted_count recomputed; Questionnaire.version increments by 1"
        note: "Word-limit excess is NOT an error: the same call lands in OVER_LIMIT_RETURNED instead (see below)."
      - from: INVITED
        to: OVER_LIMIT_RETURNED
        trigger: "POST /questionnaires/{qid}/responses (same preconditions as INVITED -> SUBMITTED)"
        actor: Candidate
        preconditions: ["Same preconditions as INVITED -> SUBMITTED"]
        side_effects: ["over_limit_positions lists each position_index whose count exceeds its effective limit; status OVER_LIMIT_RETURNED"]
      - from: OVER_LIMIT_RETURNED
        to: SUBMITTED
        trigger: "POST /responses/{id}/resubmit"
        actor: Candidate
        preconditions:
          - "Questionnaire.status == ISSUED (ERR_QUESTIONNAIRE_NOT_ACCEPTING_SUBMISSIONS)"
          - "Shell filing.status == VERIFIED (ERR_FILING_NOT_VERIFIED)"
          - "current_utc <= due_at (ERR_SUBMISSION_WINDOW_CLOSED)"
          - "answers cover every declared position_index exactly once (ERR_INVALID_REQUEST)"
        side_effects: ["Counts recomputed; when all within limit: SUBMITTED, submitted_at set, Questionnaire.submitted_count recomputed, Questionnaire.version increments by 1"]
      - from: OVER_LIMIT_RETURNED
        to: OVER_LIMIT_RETURNED
        trigger: "POST /responses/{id}/resubmit"
        actor: Candidate
        preconditions: ["Same preconditions as OVER_LIMIT_RETURNED -> SUBMITTED"]
        side_effects: ["over_limit_positions refreshed; answers replaced"]
      - from: INVITED
        to: NONRESPONSE_MARKED
        trigger: "POST /contests/{id}/sweep-nonresponses (system bookkeeping executed by ChapterCoordinator)"
        actor: system
        preconditions: ["Questionnaire.status == ISSUED and current_utc > due_at"]
        side_effects: ["Questionnaire.nonresponse_count recomputed; published_indicator becomes DID_NOT_RESPOND"]
      - from: OVER_LIMIT_RETURNED
        to: LATE_UNPUBLISHED
        trigger: "POST /contests/{id}/sweep-nonresponses"
        actor: system
        preconditions: ["Questionnaire.status == ISSUED and current_utc > due_at"]
        side_effects: ["Questionnaire.late_count recomputed; published_indicator becomes LATE"]
      - from: INVITED
        to: WITHDRAWN_HIDDEN
        trigger: "system (filing withdraw/disqualify cascade)"
        actor: system
        preconditions: []
        side_effects: ["published_indicator becomes WITHDRAWN"]
      - from: SUBMITTED
        to: WITHDRAWN_HIDDEN
        trigger: "system (filing withdraw/disqualify cascade)"
        actor: system
        preconditions: []
        side_effects: ["Questionnaire.submitted_count recomputed"]
      - from: OVER_LIMIT_RETURNED
        to: WITHDRAWN_HIDDEN
        trigger: "system (filing withdraw/disqualify cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: NONRESPONSE_MARKED
        to: WITHDRAWN_HIDDEN
        trigger: "system (filing withdraw/disqualify cascade)"
        actor: system
        preconditions: []
        side_effects: ["Questionnaire.nonresponse_count recomputed"]
      - from: WITHDRAWN_HIDDEN
        to: INVITED
        trigger: "system (filing refile)"
        actor: system
        preconditions: []
        side_effects: ["answers preserved; Questionnaire counters recomputed"]
      - from: NONRESPONSE_MARKED
        to: INVITED
        trigger: "system (questionnaire amend with due_at extended beyond current_utc)"
        actor: system
        preconditions: []
        side_effects: ["published_indicator returns to PENDING; Questionnaire.nonresponse_count recomputed"]

  - entity: BallotMeasure
    initial_state: DRAFTING
    terminal_states: []
    transitions:
      - from: DRAFTING
        to: IN_NEUTRALITY_REVIEW
        trigger: "POST /measures/{id}/submit-for-review"
        actor: QuestionnaireEditor
        preconditions:
          - "X-User-ID == drafter_volunteer_id (ERR_ONLY_DRAFTER_MAY_REVISE)"
          - ">= 1 ACCEPTED PRO argument and >= 1 ACCEPTED CON argument (ERR_MISSING_PRO_OR_CON)"
        side_effects: ["review_round_count += 1; BallotMeasure.version increments by 1"]
      - from: REMANDED
        to: DRAFTING
        trigger: "POST /measures/{id}/revise"
        actor: QuestionnaireEditor
        preconditions: ["X-User-ID == drafter_volunteer_id (ERR_ONLY_DRAFTER_MAY_REVISE)"]
        side_effects: ["explanation_text replaced; grade_fk / grade_smog recomputed; BallotMeasure.version increments by 1"]
      - from: DRAFTING
        to: DRAFTING
        trigger: "POST /measures/{id}/revise"
        actor: QuestionnaireEditor
        preconditions: ["X-User-ID == drafter_volunteer_id (ERR_ONLY_DRAFTER_MAY_REVISE)"]
        side_effects: ["explanation_text replaced; grade_fk / grade_smog recomputed; BallotMeasure.version increments by 1"]
      - from: IN_NEUTRALITY_REVIEW
        to: APPROVED_FOR_GUIDE
        trigger: "POST /measures/{id}/reviews {verdict: NEUTRAL} (effective only when this is the 2nd distinct-reviewer NEUTRAL verdict of the current round)"
        actor: NeutralityReviewer
        preconditions:
          - "reviewer_volunteer_id (X-User-ID) != drafter_volunteer_id (ERR_SOD_DRAFTER_CANNOT_REVIEW)"
          - "Reviewer Volunteer: status ACTIVE (ERR_VOLUNTEER_SUSPENDED), attestation CURRENT (ERR_ATTESTATION_LAPSED), advocacy_flag == false (ERR_ADVOCACY_SEPARATION)"
          - "No existing NeutralityReview by this reviewer with round_index == measure.review_round_count (ERR_DUPLICATE_REVIEW_THIS_ROUND)"
        side_effects: ["approvals_this_round += 1; transition fires only when approvals_this_round reaches 2, otherwise the measure remains IN_NEUTRALITY_REVIEW; BallotMeasure.version increments by 1"]
        note: "Neutrality approval requires NEUTRAL_APPROVALS_REQUIRED = 2 distinct reviewers per round; a single remanding verdict (LOADED_LANGUAGE / UNBALANCED) ends the round immediately."
      - from: IN_NEUTRALITY_REVIEW
        to: REMANDED
        trigger: "POST /measures/{id}/reviews {verdict: LOADED_LANGUAGE | UNBALANCED}"
        actor: NeutralityReviewer
        preconditions: ["Same reviewer preconditions as the NEUTRAL verdict"]
        side_effects: ["BallotMeasure.version increments by 1"]
      - from: DRAFTING
        to: REMANDED
        trigger: "system (PolicyIncident substantiation quarantine on drafter)"
        actor: system
        preconditions: []
        side_effects: ["Contest of this measure, if GUIDE_READY or LOCKED, -> QUESTIONNAIRE_PHASE"]
      - from: IN_NEUTRALITY_REVIEW
        to: REMANDED
        trigger: "system (PolicyIncident substantiation quarantine on drafter)"
        actor: system
        preconditions: []
        side_effects: ["Contest of this measure, if GUIDE_READY or LOCKED, -> QUESTIONNAIRE_PHASE"]
      - from: APPROVED_FOR_GUIDE
        to: REMANDED
        trigger: "system (PolicyIncident substantiation quarantine on drafter)"
        actor: system
        preconditions: []
        side_effects: ["Contest of this measure, if GUIDE_READY or LOCKED, -> QUESTIONNAIRE_PHASE"]

  - entity: MeasureArgument
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "system (automatic at creation when word_count <= 250)"
        actor: system
        preconditions: []
        side_effects: ["Measure pro_word_total / con_word_total / balance_ratio / balance_flag recomputed"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "system (automatic at creation when word_count > 250)"
        actor: system
        preconditions: []
        side_effects: ["Measure totals NOT recomputed (rejected arguments never count)"]

  - entity: GuideEdition
    initial_state: ASSEMBLING
    terminal_states: [RETIRED]
    transitions:
      - from: ASSEMBLING
        to: READY
        trigger: "POST /guide-editions/{id}/transitions {to: READY}"
        actor: QuestionnaireEditor
        preconditions:
          - "ElectionCycle.status == OPEN (ERR_CYCLE_NOT_OPEN)"
          - ">= 1 Contest of the cycle has status LOCKED (ERR_CONTESTS_NOT_LOCKED)"
          - "No BallotMeasure in any contest of the cycle has status IN_NEUTRALITY_REVIEW or REMANDED (ERR_NEUTRALITY_REVIEW_OUTSTANDING)"
          - "language_code is an element of supported_language_codes of EVERY Jurisdiction of the cycle (ERR_LANGUAGE_UNSUPPORTED)"
          - "accessibility_format != STANDARD: for every APPROVED_FOR_GUIDE BallotMeasure in the cycle, the grade under its contest's jurisdiction's reading_level_metric <= 8.0 (ERR_ACCESSIBILITY_GRADE_EXCEEDED)"
        side_effects:
          - "snapshot_contest_ids = ids of all LOCKED contests of the cycle; pinned_questionnaire_versions captured"
          - "estimated_page_count computed via guide_page_estimate; GuideEdition.version increments by 1"
      - from: READY
        to: ASSEMBLING
        trigger: "POST /guide-editions/{id}/transitions {to: ASSEMBLING}"
        actor: QuestionnaireEditor
        preconditions: []
        side_effects: ["snapshot_contest_ids and pinned_questionnaire_versions cleared; estimated_page_count retained until next READY; version increments"]
      - from: READY
        to: DISTRIBUTED
        trigger: "POST /guide-editions/{id}/distribute"
        actor: QuestionnaireEditor
        preconditions:
          - "Every contest id in snapshot_contest_ids still has status LOCKED and each pinned questionnaire version still matches (ERR_STALE_SNAPSHOT)"
          - "print_run_total > 0 and channel_requests non-empty (ERR_INVALID_REQUEST)"
        side_effects: ["print_copy_allocation computes allocations + unallocated_copies; ElectionCycle.distributed_edition_count recomputed; version increments"]
      - from: DISTRIBUTED
        to: RETIRED
        trigger: "POST /guide-editions/{id}/transitions {to: RETIRED}"
        actor: QuestionnaireEditor
        preconditions: []
        side_effects: ["ElectionCycle.distributed_edition_count recomputed; version increments"]

  - entity: Forum
    initial_state: PLANNED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /forums/{id}/transitions {to: CONFIRMED}"
        actor: ForumModerator
        preconditions:
          - "X-User-ID == moderator_volunteer_id (ERR_UNAUTHORIZED_ROLE)"
          - "eligible_candidate_count >= 2 (ERR_FORUM_QUORUM_NOT_MET)"
        side_effects: ["eligible_candidate_count recomputed at confirm time; Forum.version increments by 1"]
      - from: CONFIRMED
        to: HELD
        trigger: "POST /forums/{id}/transitions {to: HELD, minutes_text}"
        actor: ForumModerator
        preconditions:
          - "X-User-ID == moderator_volunteer_id (ERR_UNAUTHORIZED_ROLE)"
          - "current_utc >= scheduled_end (ERR_FORUM_NOT_CONCLUDED)"
          - "minutes_text supplied and non-empty (ERR_INVALID_REQUEST)"
        side_effects: ["Forum.version increments by 1"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /forums/{id}/transitions {to: CANCELLED} or system (moderator suspension cascade)"
        actor: "ForumModerator | system"
        preconditions: ["Manual cancel: X-User-ID == moderator_volunteer_id (ERR_UNAUTHORIZED_ROLE)"]
        side_effects: ["Forum.version increments by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /forums/{id}/transitions {to: CANCELLED} or system (moderator suspension cascade)"
        actor: "ForumModerator | system"
        preconditions: ["Manual cancel: X-User-ID == moderator_volunteer_id (ERR_UNAUTHORIZED_ROLE)"]
        side_effects: ["Forum.version increments by 1"]

  - entity: ForumQuestion
    initial_state: SUBMITTED
    terminal_states: [SELECTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: SELECTED
        trigger: "POST /forum-questions/{id}/select"
        actor: ForumModerator
        preconditions:
          - "X-User-ID == forum.moderator_volunteer_id (ERR_UNAUTHORIZED_ROLE)"
          - "Forum.status == CONFIRMED (ERR_INVALID_STATE)"
          - "When source == MODERATOR_AUTHORED: author_volunteer_id != X-User-ID (ERR_SOD_MODERATOR_OWN_QUESTION)"
          - "Count of SELECTED questions of this forum < 5 (ERR_QUESTION_CAP_REACHED)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /forum-questions/{id}/reject"
        actor: ForumModerator
        preconditions:
          - "X-User-ID == forum.moderator_volunteer_id (ERR_UNAUTHORIZED_ROLE)"
          - "Forum.status == CONFIRMED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: Volunteer
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /volunteers/{id}/attest (self: X-User-ID == id)"
        actor: "ChapterCoordinator | QuestionnaireEditor | NeutralityReviewer | ForumModerator"
        preconditions: []
        side_effects: ["attestation_expires_at = current_utc + 90 days; attestation_status recomputed to CURRENT; version increments"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (PolicyIncident substantiation cascade link 1)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 2a: every BallotMeasure with drafter_volunteer_id == this volunteer and status in {DRAFTING, IN_NEUTRALITY_REVIEW, APPROVED_FOR_GUIDE} -> REMANDED"
          - "Cascade link 2b: every Forum with moderator_volunteer_id == this volunteer and status in {PLANNED, CONFIRMED} -> CANCELLED"
          - "Cascade link 3 (caused by 2a): each contest of a quarantined measure with status GUIDE_READY or LOCKED -> QUESTIONNAIRE_PHASE"
        note: "Attestation is a parallel dimension: attestation_status CURRENT/LAPSED evolves by clock + attest independently of status ACTIVE/SUSPENDED."
      - from: ACTIVE
        to: ACTIVE
        trigger: "system (lazy attestation lapse: when current_utc > attestation_expires_at, attestation_status evaluates as LAPSED until attest)"
        actor: system
        preconditions: []
        side_effects: ["Privileged mutations by this volunteer fail with ERR_ATTESTATION_LAPSED while LAPSED"]
        note: "Parallel state dimension (attestation_status), cyclic: CURRENT -> LAPSED -> CURRENT via attest."

  - entity: PolicyIncident
    initial_state: REPORTED
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: REPORTED
        to: SUBSTANTIATED
        trigger: "POST /incidents/{id}/transitions {to: SUBSTANTIATED, corrective_action}"
        actor: LeagueAdmin
        preconditions: ["corrective_action supplied and non-empty (ERR_INVALID_REQUEST)"]
        side_effects:
          - "resolved_at = current_utc; Volunteer.substantiated_incident_count recomputed"
          - "Fires the Volunteer ACTIVE -> SUSPENDED cascade (see Volunteer machine links 1-3)"
      - from: REPORTED
        to: DISMISSED
        trigger: "POST /incidents/{id}/transitions {to: DISMISSED}"
        actor: LeagueAdmin
        preconditions: []
        side_effects: ["resolved_at = current_utc; no volunteer state change"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: contest-transition-stale-version
    parent_entity: Contest
    write_endpoint: "POST /contests/{id}/transitions"
    occ_field: "expected_contest_version"
    description: |
      A Contest transition request whose expected_contest_version no longer
      equals Contest.version is rejected. Filing verifications, withdrawals,
      sweeps and incident cascades all advance Contest.version, so a transition
      built on a previously observed version is stale and must be re-read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: questionnaire-amend-stale-version
    parent_entity: Questionnaire
    write_endpoint: "POST /questionnaires/{id}/amend"
    occ_field: "expected_questionnaire_version"
    description: |
      A Questionnaire amend whose expected_questionnaire_version no longer
      equals Questionnaire.version is rejected. Issuing the questionnaire and
      every candidate submission advance Questionnaire.version, so an amend
      built on a previously observed version is stale and must be re-read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: response_word_count
    trigger: "On CandidateResponse submit/resubmit (per answer) and on MeasureArgument creation (whole text, STRICT variant, limit ARGUMENT_WORD_LIMIT)"
    algorithm: aggregation
    formula: |
      tokens = whitespace-split(text), each stripped of leading/trailing punctuation , . : ; ! ? " '
      is_url(t)  = (t contains "://") or (t starts with "www.")
      STRICT:  count(t) = 0 when is_url(t), else (number of hyphen-separated parts of t)
      LENIENT: count(t) = 1 for every token (a URL counts 1, a hyphenated compound counts 1)
      word_count = sum of count(t) over tokens
      effective_limit(answer) = question.word_limit_override if set else contest.questionnaire_word_limit
      over-limit iff word_count > effective_limit (exactly at limit passes)
    input_set: "The single submitted answer text (per position_index) or argument text"
    constants:
      DEFAULT_WORD_LIMIT: 100
      ARGUMENT_WORD_LIMIT: 250
    precision: "integer word counts"
    variants:
      - name: STRICT
        when: "contest.word_count_policy == STRICT (and always for MeasureArgument)"
        difference: "Hyphenated compound counts as its hyphen-separated part count; URL tokens count 0"
      - name: LENIENT
        when: "contest.word_count_policy == LENIENT"
        difference: "Hyphenated compound counts 1; URL tokens count 1; identical text yields a lower or equal count than STRICT"

  - name: reading_grade_level
    trigger: "On BallotMeasure create and revise (both variants computed and stored as grade_fk / grade_smog); gated variant read at GuideEdition READY"
    algorithm: weighted_scoring
    formula: |
      words      = whitespace-split tokens stripped of punctuation (as in response_word_count)
      sentences  = count of non-empty segments of explanation_text split on [. ! ?]
      syllables(w) = max(1, number of vowel-group runs [aeiouy]+ in lowercased w)
      polysyllables = count of words with syllables(w) >= 3
      FLESCH_KINCAID: grade = 0.39 * (W / S) + 11.8 * (SYL / W) - 15.59
      SMOG:           grade = 1.043 * sqrt(POLY * 30 / S) + 3.1291
      Accessibility gate (edition READY, accessibility_format != STANDARD):
      the variant selected by the measure's contest's jurisdiction.reading_level_metric must be <= 8.0
      (exactly 8.0 passes; 8.01 fails)
    input_set: "BallotMeasure.explanation_text"
    constants:
      GRADE_THRESHOLD: 8.0
    precision: "2 decimal places, round_half_up, applied once at the end"
    variants:
      - name: FLESCH_KINCAID
        when: "jurisdiction.reading_level_metric == FLESCH_KINCAID"
        difference: "Word/sentence length driven; long low-syllable prose scores low"
      - name: SMOG
        when: "jurisdiction.reading_level_metric == SMOG"
        difference: "Polysyllable-density driven; a single 3+-syllable word in a short text scores far higher than FK"

  - name: print_copy_allocation
    trigger: "On POST /guide-editions/{id}/distribute"
    algorithm: waterfall_allocation
    formula: |
      remaining = print_run_total
      for tier in [1, 2, 3] ascending:
          tier_requests = channel_requests with priority_tier == tier,
                            ordered by requested DESC, tie-break channel_code ASC (lexicographic)
          for r in tier_requests:
              allocated[r.channel_code] = min(r.requested, remaining)
              remaining -= allocated[r.channel_code]
      channels with priority_tier outside [1,2,3] are rejected at input validation (ERR_INVALID_REQUEST)
      unallocated_copies = remaining
      CONSERVED QUANTITY: sum(a.allocated for a in allocations) + unallocated_copies == print_run_total
    input_set: "print_run_total and channel_requests [{channel_code, requested, priority_tier}] from the distribute payload"
    constants: {}
    precision: "integer copies"
    variants: []

  - name: guide_page_estimate
    trigger: "On GuideEdition transition ASSEMBLING -> READY (computed over the pinned snapshot)"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER (nested rounding, order is significant): round per contest, then sum.
      For each contest in snapshot_contest_ids:
        candidate contest: contest_words = sum of per_answer_word_counts (STRICT recompute) over
                           responses of its questionnaire with status SUBMITTED
        measure contest:   contest_words = STRICT word count of explanation_text
                           + sum of word_count over ACCEPTED arguments
        columns = ceil(contest_words / WORDS_PER_COLUMN)          # per-contest roundup #1
        pages   = ceil(columns / COLUMNS_PER_PAGE)                # per-contest roundup #2
      estimated_page_count = FRONT_MATTER_PAGES + sum(pages over snapshot contests)
      (The unpinned alternative — sum all words, then ceil once — yields smaller values;
       e.g. two contests of 21 words each: pinned gives 2*ceil(ceil(21/10)/2)+2 = 6,
       unpinned gives ceil(ceil(42/10)/2)+2 = 5.)
    input_set: "Contests in snapshot_contest_ids and their pinned content at READY time"
    constants:
      WORDS_PER_COLUMN: 10
      COLUMNS_PER_PAGE: 2
      FRONT_MATTER_PAGES: 2
    precision: "integer pages"
    variants: []

  - name: contest_completion_index
    trigger: "Derived on every Contest read; inputs mutate on response submit / sweep / withdraw / refile / amend"
    algorithm: aggregation
    formula: |
      q = the contest's Questionnaire (none -> 0.0)
      completion_index = 0.0 when q.invited_count == 0
      else round_half_up(100 * q.submitted_count / q.invited_count, 1)
      Buckets INVITED, SUBMITTED, OVER_LIMIT_RETURNED, NONRESPONSE_MARKED, LATE_UNPUBLISHED,
      WITHDRAWN_HIDDEN always partition the shells: their counts sum to q.invited_count.
    input_set: "Questionnaire counters of the contest"
    constants: {}
    precision: "1 decimal place, round_half_up"
    variants: []

  - name: measure_balance_ratio
    trigger: "On MeasureArgument acceptance (create) for the parent measure"
    algorithm: threshold
    formula: |
      pro_word_total = sum(word_count over ACCEPTED arguments with side PRO)
      con_word_total = sum(word_count over ACCEPTED arguments with side CON)
      balance_ratio = round_half_up(abs(pro_word_total - con_word_total) / max(pro_word_total, con_word_total, 1), 4)
      balance_flag  = balance_ratio > BALANCE_THRESHOLD   # exactly 0.15 does NOT flag
    input_set: "ACCEPTED MeasureArgument rows of the measure"
    constants:
      BALANCE_THRESHOLD: 0.15
    precision: "4 decimal places, round_half_up"
    variants: []

  - name: forum_eligibility_count
    trigger: "On Forum creation and on Forum PLANNED -> CONFIRMED"
    algorithm: threshold
    formula: |
      eligible_candidate_count = count of CandidateFiling rows of the forum's contest
                                 with status == VERIFIED
      Forum may be CONFIRMED iff eligible_candidate_count >= FORUM_QUORUM
      (exactly FORUM_QUORUM passes)
    input_set: "CandidateFiling rows of the forum's contest"
    constants:
      FORUM_QUORUM: 2
    precision: "integer count"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; first match wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role; X-User-ID additionally required for every role except PublicUser; for entity-backed volunteer roles X-User-ID must reference a Volunteer whose roles array contains the mapped capability (COORDINATOR/EDITOR/REVIEWER/MODERATOR); for Candidate, X-User-ID must reference a CandidateFiling", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is listed in the endpoint's roles; ownership-flavored denials (wrong moderator on a forum, candidate shell of another filing) also surface here as ERR_UNAUTHORIZED_ROLE where specified", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request body is well-formed: every required input present, no undeclared fields, types and enum members valid, office_name present iff kind=CANDIDATE_RACE and absent otherwise, question position_index values unique, answers cover declared positions exactly once, channel priority_tier in [1,2,3], minutes_text present on HELD transition, corrective_action present on SUBSTANTIATED transition", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Every path id resolves, validated left-to-right; the (questionnaire_id, X-User-ID filing) response shell exists", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "Mutations scoped under an ElectionCycle (contest/questionnaire/measure/forum/edition creation) require the cycle's status == OPEN", error_id: ERR_CYCLE_NOT_OPEN, http_status: 409, applies_to: ["POST /jurisdictions/{id}/contests", "POST /contests/{id}/questionnaire", "POST /contests/{id}/measure", "POST /contests/{id}/forums", "POST /election-cycles/{id}/guide-editions", "POST /guide-editions/{id}/transitions"] }
  - { priority: 6, category: state, check: "Generic from-state check: the entity's current status is one of the transition's allowed from-states (covers invalid to-state requests, terminal-state lockout, resubmit of a non-OVER_LIMIT_RETURNED response, question select on a non-CONFIRMED forum, forum create on a non-{QUESTIONNAIRE_PHASE,GUIDE_READY} contest)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition/action endpoints" }
  - { priority: 7, category: state, check: "Submit/resubmit requires Questionnaire.status == ISSUED (a CLOSED questionnaire is rejected here even when the window is also past due — state beats temporal)", error_id: ERR_QUESTIONNAIRE_NOT_ACCEPTING_SUBMISSIONS, http_status: 409, applies_to: ["POST /questionnaires/{id}/responses", "POST /responses/{id}/resubmit"] }
  - { priority: 8, category: state, check: "Submit/resubmit requires the shell's filing to be VERIFIED (shell not WITHDRAWN_HIDDEN)", error_id: ERR_FILING_NOT_VERIFIED, http_status: 409, applies_to: ["POST /questionnaires/{id}/responses", "POST /responses/{id}/resubmit"] }
  - { priority: 9, category: state, check: "OCC: expected_contest_version == Contest.version on contest transitions; expected_questionnaire_version == Questionnaire.version on amend", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /contests/{id}/transitions", "POST /questionnaires/{id}/amend"] }
  - { priority: 10, category: business_safety, check: "Acting (or referenced moderator/drafter/reviewer) Volunteer has status ACTIVE", error_id: ERR_VOLUNTEER_SUSPENDED, http_status: 403, applies_to: "all volunteer-backed role mutations" }
  - { priority: 11, category: business_safety, check: "Acting (or referenced moderator) Volunteer's attestation is CURRENT at current_utc (lazy lapse evaluation)", error_id: ERR_ATTESTATION_LAPSED, http_status: 403, applies_to: "all volunteer-backed role mutations EXCEPT POST /volunteers/{id}/attest (the cure path)" }
  - { priority: 12, category: business_safety, check: "advocacy_flag == false for a volunteer assigned as measure drafter, neutrality reviewer, or forum moderator (voter-education/advocacy separation)", error_id: ERR_ADVOCACY_SEPARATION, http_status: 403, applies_to: ["POST /contests/{id}/measure", "POST /measures/{id}/reviews", "POST /contests/{id}/forums"] }
  - { priority: 13, category: business_safety, check: "Referenced forum moderator's Volunteer.roles contains MODERATOR", error_id: ERR_MODERATOR_NOT_QUALIFIED, http_status: 422, applies_to: ["POST /contests/{id}/forums"] }
  - { priority: 14, category: business_safety, check: "Segregation of duties: reviewer's X-User-ID != measure.drafter_volunteer_id", error_id: ERR_SOD_DRAFTER_CANNOT_REVIEW, http_status: 403, applies_to: ["POST /measures/{id}/reviews"] }
  - { priority: 15, category: business_safety, check: "Segregation of duties: a MODERATOR_AUTHORED question may not be selected by its own author", error_id: ERR_SOD_MODERATOR_OWN_QUESTION, http_status: 403, applies_to: ["POST /forum-questions/{id}/select"] }
  - { priority: 15.5, category: business_safety, check: "Drafter ownership: only the measure's drafter_volunteer_id may revise its explanation or submit it for review", error_id: ERR_ONLY_DRAFTER_MAY_REVISE, http_status: 403, applies_to: ["POST /measures/{id}/revise", "POST /measures/{id}/submit-for-review"] }
  - { priority: 16, category: business_safety, check: "Compliance posture: no BallotMeasure anywhere in the cycle has status IN_NEUTRALITY_REVIEW or REMANDED at edition READY; measure contest may not reach GUIDE_READY unless its measure is APPROVED_FOR_GUIDE", error_id: ERR_NEUTRALITY_REVIEW_OUTSTANDING, http_status: 422, applies_to: ["POST /guide-editions/{id}/transitions", "POST /contests/{id}/transitions"] }
  - { priority: 17, category: business_temporal, check: "Filing create requires current_utc <= contest.filing_deadline (exactly at the deadline is accepted)", error_id: ERR_FILING_DEADLINE_PASSED, http_status: 422, applies_to: ["POST /contests/{id}/filings"] }
  - { priority: 18, category: business_temporal, check: "Contest FILING_OPEN -> QUESTIONNAIRE_PHASE requires current_utc > filing_deadline", error_id: ERR_FILING_STILL_OPEN, http_status: 422, applies_to: ["POST /contests/{id}/transitions"] }
  - { priority: 19, category: business_temporal, check: "Submit/resubmit requires current_utc <= questionnaire.due_at (exactly at due_at is accepted)", error_id: ERR_SUBMISSION_WINDOW_CLOSED, http_status: 422, applies_to: ["POST /questionnaires/{id}/responses", "POST /responses/{id}/resubmit"] }
  - { priority: 20, category: business_temporal, check: "Questionnaire close requires current_utc > due_at", error_id: ERR_CLOSE_BEFORE_DEADLINE, http_status: 422, applies_to: ["POST /questionnaires/{id}/close"] }
  - { priority: 21, category: business_temporal, check: "Forum overlap: within one jurisdiction, no two forums in {PLANNED, CONFIRMED} may have half-open intervals [scheduled_start, scheduled_end) that overlap; adjacency (end == start) is allowed", error_id: ERR_FORUM_TIME_OVERLAP, http_status: 422, applies_to: ["POST /contests/{id}/forums"] }
  - { priority: 22, category: business_temporal, check: "Moderator buffer: for one moderator, any two forums in {PLANNED, CONFIRMED} must satisfy |start - other.end| >= 24h (gap measured end-to-start; exactly 24h is allowed)", error_id: ERR_MODERATOR_BUFFER_VIOLATION, http_status: 422, applies_to: ["POST /contests/{id}/forums"] }
  - { priority: 23, category: business_temporal, check: "Forum CONFIRMED -> HELD requires current_utc >= scheduled_end", error_id: ERR_FORUM_NOT_CONCLUDED, http_status: 422, applies_to: ["POST /forums/{id}/transitions"] }
  - { priority: 24, category: business_constraint, check: "Jurisdiction fips_code unique within its cycle", error_id: ERR_DUPLICATE_FIPS, http_status: 409, applies_to: ["POST /election-cycles/{id}/jurisdictions"] }
  - { priority: 25, category: business_constraint, check: "CandidateFiling filing_reference unique within its contest", error_id: ERR_DUPLICATE_FILING_REFERENCE, http_status: 409, applies_to: ["POST /contests/{id}/filings"] }
  - { priority: 26, category: business_constraint, check: "At most one Questionnaire per contest", error_id: ERR_DUPLICATE_QUESTIONNAIRE, http_status: 409, applies_to: ["POST /contests/{id}/questionnaire"] }
  - { priority: 27, category: business_constraint, check: "At most one BallotMeasure per contest", error_id: ERR_DUPLICATE_MEASURE, http_status: 409, applies_to: ["POST /contests/{id}/measure"] }
  - { priority: 28, category: business_constraint, check: "A reviewer may review a given measure at most once per review_round_count", error_id: ERR_DUPLICATE_REVIEW_THIS_ROUND, http_status: 409, applies_to: ["POST /measures/{id}/reviews"] }
  - { priority: 29, category: business_constraint, check: "Kind routing: questionnaire only on CANDIDATE_RACE contests; measure only on BALLOT_MEASURE contests; forums only on CANDIDATE_RACE contests", error_id: ERR_CONTEST_KIND_MISMATCH, http_status: 422, applies_to: ["POST /contests/{id}/questionnaire", "POST /contests/{id}/measure", "POST /contests/{id}/forums"] }
  - { priority: 30, category: business_constraint, check: "submit-for-review requires >= 1 ACCEPTED PRO and >= 1 ACCEPTED CON argument", error_id: ERR_MISSING_PRO_OR_CON, http_status: 422, applies_to: ["POST /measures/{id}/submit-for-review"] }
  - { priority: 31, category: business_constraint, check: "Forum confirm requires eligible_candidate_count >= 2", error_id: ERR_FORUM_QUORUM_NOT_MET, http_status: 422, applies_to: ["POST /forums/{id}/transitions"] }
  - { priority: 32, category: business_constraint, check: "At most 5 SELECTED ForumQuestions per forum", error_id: ERR_QUESTION_CAP_REACHED, http_status: 422, applies_to: ["POST /forum-questions/{id}/select"] }
  - { priority: 33, category: business_constraint, check: "Edition language_code must be an element of supported_language_codes of every Jurisdiction of the cycle", error_id: ERR_LANGUAGE_UNSUPPORTED, http_status: 422, applies_to: ["POST /guide-editions/{id}/transitions"] }
  - { priority: 34, category: business_constraint, check: "Non-STANDARD accessibility format requires every APPROVED_FOR_GUIDE measure in the cycle to grade <= 8.0 under its jurisdiction's reading_level_metric", error_id: ERR_ACCESSIBILITY_GRADE_EXCEEDED, http_status: 422, applies_to: ["POST /guide-editions/{id}/transitions"] }
  - { priority: 35, category: business_constraint, check: "Distribute requires every snapshot contest still LOCKED and every pinned questionnaire version still current", error_id: ERR_STALE_SNAPSHOT, http_status: 422, applies_to: ["POST /guide-editions/{id}/distribute"] }
  - { priority: 36, category: business_constraint, check: "Cycle publish requires >= 1 contest and every contest LOCKED; edition READY requires >= 1 LOCKED contest", error_id: ERR_CONTESTS_NOT_LOCKED, http_status: 422, applies_to: ["POST /election-cycles/{id}/transitions", "POST /guide-editions/{id}/transitions"] }
  - { priority: 37, category: business_constraint, check: "Cycle publish requires no PolicyIncident in status REPORTED", error_id: ERR_UNRESOLVED_INCIDENTS_EXIST, http_status: 422, applies_to: ["POST /election-cycles/{id}/transitions"] }
  - { priority: 38, category: business_fiscal, check: "Cycle publish requires distributed_edition_count >= 1 (at least one channel actually distributed)", error_id: ERR_NO_DISTRIBUTED_EDITION, http_status: 422, applies_to: ["POST /election-cycles/{id}/transitions"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Before any call the clock reads exactly 2026-09-01T00:00:00Z (server startup default; never wall-clock). All deadlines, sweeps and attestation lapse read this clock.", roles: [LeagueAdmin], code: 200, input: [current_utc], output: "{ current_utc: string }", side_effects: ["Lazy re-evaluation of attestation_status on subsequent reads/actions"] }

  - { method: POST, path: "/election-cycles", description: "Create an ElectionCycle in DRAFT", roles: [LeagueAdmin], code: 201, input: [cycle_name, election_date], output: ElectionCycle, side_effects: [] }
  - { method: GET, path: "/election-cycles/{id}", description: "Read one ElectionCycle", roles: [LeagueAdmin, ChapterCoordinator, QuestionnaireEditor], code: 200, input: [], output: ElectionCycle, side_effects: [] }
  - { method: POST, path: "/election-cycles/{id}/transitions", description: "Cycle lifecycle: to=OPEN (from DRAFT), to=PUBLISHED (from OPEN; gated), to=ARCHIVED (from PUBLISHED)", roles: [LeagueAdmin], code: 200, input: [to], output: ElectionCycle, side_effects: ["ElectionCycle.version increments by 1"] }
  - { method: POST, path: "/election-cycles/{id}/jurisdictions", description: "Create a Jurisdiction in a cycle (cycle any status; uniqueness of fips_code enforced per cycle)", roles: [LeagueAdmin], code: 201, input: [jurisdiction_name, fips_code, supported_language_codes, reading_level_metric], output: Jurisdiction, side_effects: [] }
  - { method: GET, path: "/election-cycles/{id}/jurisdictions", description: "List jurisdictions of a cycle", roles: [LeagueAdmin, ChapterCoordinator, QuestionnaireEditor], code: 200, input: ["limit?", "offset?"], output: "Jurisdiction[]", side_effects: [] }
  - { method: GET, path: "/jurisdictions/{id}", description: "Read one Jurisdiction", roles: [LeagueAdmin, ChapterCoordinator, QuestionnaireEditor], code: 200, input: [], output: Jurisdiction, side_effects: [] }

  - { method: POST, path: "/jurisdictions/{id}/contests", description: "Create a Contest (candidate race or ballot measure) in a jurisdiction; requires cycle OPEN", roles: [ChapterCoordinator], code: 201, input: [kind, "office_name?", "seat_count?", "vote_for_count?", filing_deadline, "questionnaire_word_limit?", "word_count_policy?"], output: Contest, side_effects: [] }
  - { method: GET, path: "/jurisdictions/{id}/contests", description: "List contests of a jurisdiction", roles: [LeagueAdmin, ChapterCoordinator, QuestionnaireEditor, ForumModerator], code: 200, input: ["limit?", "offset?"], output: "Contest[]", side_effects: [] }
  - { method: GET, path: "/contests/{id}", description: "Read one Contest including computed verified_candidate_count and completion_index", roles: [LeagueAdmin, ChapterCoordinator, QuestionnaireEditor], code: 200, input: [], output: Contest, side_effects: ["completion_index derived on read"] }
  - { method: POST, path: "/contests/{id}/transitions", description: "Contest lifecycle with OCC: to=QUESTIONNAIRE_PHASE | GUIDE_READY | LOCKED", roles: [ChapterCoordinator], code: 200, input: [to, expected_contest_version], output: Contest, side_effects: ["Contest.version increments by 1"] }

  - { method: POST, path: "/contests/{id}/filings", description: "Record an official CandidateFiling (status FILED); contest must be FILING_OPEN and current_utc <= filing_deadline", roles: [ChapterCoordinator], code: 201, input: [candidate_name, party_label, filing_reference], output: CandidateFiling, side_effects: ["filed_at = current_utc"] }
  - { method: GET, path: "/contests/{id}/filings", description: "List filings of a contest", roles: [LeagueAdmin, ChapterCoordinator, QuestionnaireEditor], code: 200, input: ["limit?", "offset?", "status?"], output: "CandidateFiling[]", side_effects: [] }
  - { method: POST, path: "/filings/{id}/verify", description: "Verify a filing; late verification while questionnaire ISSUED and in-window creates the INVITED shell", roles: [ChapterCoordinator], code: 200, input: [], output: CandidateFiling, side_effects: ["Contest.verified_candidate_count recomputed; conditional response-shell creation"] }
  - { method: POST, path: "/filings/{id}/withdraw", description: "Withdraw a filing; cascades its response shell to WITHDRAWN_HIDDEN", roles: [ChapterCoordinator], code: 200, input: [], output: CandidateFiling, side_effects: ["Shell -> WITHDRAWN_HIDDEN; questionnaire counters recomputed; withdrawal_count += 1"] }
  - { method: POST, path: "/filings/{id}/disqualify", description: "Disqualify a verified filing (terminal); cascades like withdraw", roles: [ChapterCoordinator], code: 200, input: [reason], output: CandidateFiling, side_effects: ["Shell -> WITHDRAWN_HIDDEN; counters recomputed"] }
  - { method: POST, path: "/filings/{id}/refile", description: "Refile a WITHDRAWN filing back to FILED (deadline-gated); restores a hidden shell to INVITED", roles: [ChapterCoordinator], code: 200, input: [], output: CandidateFiling, side_effects: ["filed_at refreshed; WITHDRAWN_HIDDEN shell -> INVITED when questionnaire ISSUED in window"] }

  - { method: POST, path: "/contests/{id}/questionnaire", description: "Create the contest's Questionnaire in DRAFT (CANDIDATE_RACE contests only, one per contest, contest must be in QUESTIONNAIRE_PHASE else ERR_INVALID_STATE)", roles: [QuestionnaireEditor], code: 201, input: [due_at, questions], output: Questionnaire, side_effects: [] }
  - { method: GET, path: "/contests/{id}/questionnaire", description: "Fetch the contest's questionnaire (array of 0 or 1)", roles: [LeagueAdmin, ChapterCoordinator, QuestionnaireEditor], code: 200, input: [], output: "Questionnaire[]", side_effects: [] }
  - { method: GET, path: "/questionnaires/{id}", description: "Read one Questionnaire with counters and version", roles: [LeagueAdmin, ChapterCoordinator, QuestionnaireEditor], code: 200, input: [], output: Questionnaire, side_effects: [] }
  - { method: POST, path: "/questionnaires/{id}/amend", description: "Amend due_at and/or questions with OCC; allowed in DRAFT and ISSUED; extending due_at beyond current_utc re-invites NONRESPONSE_MARKED shells", roles: [QuestionnaireEditor], code: 200, input: [expected_questionnaire_version, "due_at?", "questions?"], output: Questionnaire, side_effects: ["Questionnaire.version increments by 1; NONRESPONSE_MARKED shells -> INVITED when due_at extended; counters recomputed"] }
  - { method: POST, path: "/questionnaires/{id}/issue", description: "Issue the questionnaire: creates INVITED shells for all VERIFIED filings of the contest", roles: [QuestionnaireEditor], code: 200, input: [], output: Questionnaire, side_effects: ["CandidateResponse shells created; invited_count set; version increments"] }
  - { method: POST, path: "/questionnaires/{id}/close", description: "Close submissions (requires current_utc > due_at)", roles: [QuestionnaireEditor], code: 200, input: [], output: Questionnaire, side_effects: ["version increments"] }
  - { method: POST, path: "/questionnaires/{id}/pin", description: "Pin the closed questionnaire as the guide snapshot source", roles: [QuestionnaireEditor], code: 200, input: [], output: Questionnaire, side_effects: ["version increments"] }

  - { method: POST, path: "/questionnaires/{id}/responses", description: "Candidate submits answers against their own shell (X-User-ID = filing id); over-limit answers land the shell in OVER_LIMIT_RETURNED, not an error", roles: [Candidate], code: 201, input: [answers], output: CandidateResponse, side_effects: ["response_word_count per answer; questionnaire counters recomputed; Questionnaire.version increments"] }
  - { method: GET, path: "/questionnaires/{id}/responses", description: "List response shells of a questionnaire", roles: [LeagueAdmin, ChapterCoordinator, QuestionnaireEditor], code: 200, input: ["limit?", "offset?", "status?"], output: "CandidateResponse[]", side_effects: [] }
  - { method: POST, path: "/responses/{id}/resubmit", description: "Candidate resubmits from OVER_LIMIT_RETURNED", roles: [Candidate], code: 200, input: [answers], output: CandidateResponse, side_effects: ["Counts recomputed; may land SUBMITTED or stay OVER_LIMIT_RETURNED"] }
  - { method: POST, path: "/contests/{id}/sweep-nonresponses", description: "Mark INVITED shells NONRESPONSE_MARKED and OVER_LIMIT_RETURNED shells LATE_UNPUBLISHED (requires current_utc > due_at); second sweep marks zero", roles: [ChapterCoordinator], code: 200, input: [], output: "{ marked_nonresponse_count: integer, marked_late_count: integer }", side_effects: ["Shell status flips; questionnaire counters recomputed"] }

  - { method: POST, path: "/contests/{id}/measure", description: "Create the contest's BallotMeasure (BALLOT_MEASURE contests only, one per contest, contest must be in QUESTIONNAIRE_PHASE else ERR_INVALID_STATE); drafter = acting editor", roles: [QuestionnaireEditor], code: 201, input: [measure_title, official_text, explanation_text], output: BallotMeasure, side_effects: ["reading_grade_level computes grade_fk and grade_smog"] }
  - { method: GET, path: "/contests/{id}/measure", description: "Fetch the contest's measure (array of 0 or 1)", roles: [LeagueAdmin, ChapterCoordinator, QuestionnaireEditor, NeutralityReviewer], code: 200, input: [], output: "BallotMeasure[]", side_effects: [] }
  - { method: GET, path: "/measures/{id}", description: "Read one BallotMeasure with computed grades and balance fields", roles: [LeagueAdmin, QuestionnaireEditor, NeutralityReviewer], code: 200, input: [], output: BallotMeasure, side_effects: [] }
  - { method: POST, path: "/measures/{id}/revise", description: "Drafter edits explanation_text (DRAFTING or REMANDED)", roles: [QuestionnaireEditor], code: 200, input: [explanation_text], output: BallotMeasure, side_effects: ["Grades recomputed; version increments; REMANDED -> DRAFTING"] }
  - { method: POST, path: "/measures/{id}/arguments", description: "Add a PRO or CON argument; auto-ACCEPTED when word_count <= 250 else auto-REJECTED", roles: [QuestionnaireEditor], code: 201, input: [side, argument_text, author_credit], output: MeasureArgument, side_effects: ["Automatic verdict; measure totals recomputed on acceptance"] }
  - { method: GET, path: "/measures/{id}/arguments", description: "List arguments of a measure", roles: [LeagueAdmin, QuestionnaireEditor, NeutralityReviewer], code: 200, input: ["limit?", "offset?", "side?", "status?"], output: "MeasureArgument[]", side_effects: [] }
  - { method: POST, path: "/measures/{id}/submit-for-review", description: "Drafter submits measure for neutrality review (requires >= 1 ACCEPTED argument on each side)", roles: [QuestionnaireEditor], code: 200, input: [], output: BallotMeasure, side_effects: ["review_round_count += 1; version increments"] }
  - { method: POST, path: "/measures/{id}/reviews", description: "Reviewer records a verdict; NEUTRAL approves, LOADED_LANGUAGE/UNBALANCED remands; SoD and advocacy gates apply", roles: [NeutralityReviewer], code: 201, input: [verdict, notes], output: NeutralityReview, side_effects: ["Measure transitions per verdict; version increments"] }
  - { method: GET, path: "/measures/{id}/reviews", description: "List reviews of a measure", roles: [LeagueAdmin, QuestionnaireEditor, NeutralityReviewer], code: 200, input: ["limit?", "offset?"], output: "NeutralityReview[]", side_effects: [] }

  - { method: POST, path: "/election-cycles/{id}/guide-editions", description: "Create a GuideEdition (language + channel + accessibility format) in ASSEMBLING", roles: [QuestionnaireEditor], code: 201, input: [language_code, channel, accessibility_format], output: GuideEdition, side_effects: [] }
  - { method: GET, path: "/election-cycles/{id}/guide-editions", description: "List editions of a cycle", roles: [LeagueAdmin, QuestionnaireEditor], code: 200, input: ["limit?", "offset?"], output: "GuideEdition[]", side_effects: [] }
  - { method: GET, path: "/guide-editions/{id}", description: "Read one GuideEdition with snapshot and allocation fields", roles: [LeagueAdmin, QuestionnaireEditor], code: 200, input: [], output: GuideEdition, side_effects: [] }
  - { method: POST, path: "/guide-editions/{id}/transitions", description: "Edition lifecycle: to=READY (pins snapshot, computes pages; gated), to=ASSEMBLING (re-open from READY), to=RETIRED (from DISTRIBUTED)", roles: [QuestionnaireEditor], code: 200, input: [to], output: GuideEdition, side_effects: ["READY pins snapshot_contest_ids + pinned_questionnaire_versions + estimated_page_count; version increments"] }
  - { method: POST, path: "/guide-editions/{id}/distribute", description: "Distribute a READY edition: runs print_copy_allocation over channel_requests", roles: [QuestionnaireEditor], code: 200, input: [print_run_total, channel_requests], output: GuideEdition, side_effects: ["allocations + unallocated_copies computed; distributed_edition_count recomputed; version increments"] }

  - { method: POST, path: "/contests/{id}/forums", description: "Schedule a candidate forum (CANDIDATE_RACE contests in QUESTIONNAIRE_PHASE or GUIDE_READY); moderator eligibility, jurisdiction overlap and moderator buffer enforced", roles: [ChapterCoordinator], code: 201, input: [scheduled_start, scheduled_end, moderator_volunteer_id], output: Forum, side_effects: ["eligible_candidate_count computed"] }
  - { method: GET, path: "/contests/{id}/forums", description: "List forums of a contest", roles: [LeagueAdmin, ChapterCoordinator, QuestionnaireEditor, ForumModerator], code: 200, input: ["limit?", "offset?"], output: "Forum[]", side_effects: [] }
  - { method: GET, path: "/forums/{id}", description: "Read one Forum", roles: [LeagueAdmin, ChapterCoordinator, ForumModerator], code: 200, input: [], output: Forum, side_effects: [] }
  - { method: POST, path: "/forums/{id}/transitions", description: "Forum lifecycle by the assigned moderator: to=CONFIRMED (quorum-gated), to=HELD (requires minutes_text and current_utc >= scheduled_end), to=CANCELLED", roles: [ForumModerator], code: 200, input: [to, "minutes_text?"], output: Forum, side_effects: ["version increments; eligible_candidate_count recomputed at CONFIRMED"] }
  - { method: POST, path: "/forums/{id}/questions", description: "Submit a forum question (PublicUser sources PUBLIC_SUBMISSION; assigned moderator may source MODERATOR_AUTHORED); forum must be PLANNED or CONFIRMED", roles: [PublicUser, ForumModerator], code: 201, input: [question_text, source], output: ForumQuestion, side_effects: [] }
  - { method: GET, path: "/forums/{id}/questions", description: "List questions of a forum", roles: [LeagueAdmin, ChapterCoordinator, ForumModerator, PublicUser], code: 200, input: ["limit?", "offset?", "status?"], output: "ForumQuestion[]", side_effects: [] }
  - { method: POST, path: "/forum-questions/{id}/select", description: "Moderator selects a submitted question (max 5 per forum; cannot select own MODERATOR_AUTHORED question)", roles: [ForumModerator], code: 200, input: [], output: ForumQuestion, side_effects: [] }
  - { method: POST, path: "/forum-questions/{id}/reject", description: "Moderator rejects a submitted question", roles: [ForumModerator], code: 200, input: [], output: ForumQuestion, side_effects: [] }

  - { method: POST, path: "/volunteers", description: "Register a Volunteer (attestation CURRENT, expires created_at + 90 days, status ACTIVE)", roles: [LeagueAdmin], code: 201, input: [volunteer_name, chapter_code, roles, "advocacy_flag?"], output: Volunteer, side_effects: ["attestation_expires_at initialized"] }
  - { method: GET, path: "/volunteers/{id}", description: "Read one Volunteer (attestation_status lazily evaluated against the logical clock)", roles: [LeagueAdmin, ChapterCoordinator, QuestionnaireEditor, NeutralityReviewer, ForumModerator], code: 200, input: [], output: Volunteer, side_effects: ["Lazy attestation lapse evaluation"] }
  - { method: POST, path: "/volunteers/{id}/attest", description: "Renew the caller's own nonpartisanship attestation (X-User-ID must equal the path id)", roles: [ChapterCoordinator, QuestionnaireEditor, NeutralityReviewer, ForumModerator], code: 200, input: [], output: Volunteer, side_effects: ["attestation_expires_at = current_utc + 90 days; version increments"] }
  - { method: POST, path: "/volunteers/{id}/flag-advocacy", description: "Set or clear a volunteer's advocacy position flag", roles: [LeagueAdmin], code: 200, input: [advocacy_flag], output: Volunteer, side_effects: ["version increments"] }
  - { method: POST, path: "/incidents", description: "Report a nonpartisanship PolicyIncident against a volunteer", roles: [ChapterCoordinator], code: 201, input: [volunteer_id, incident_type, description], output: PolicyIncident, side_effects: [] }
  - { method: GET, path: "/volunteers/{id}/incidents", description: "List incidents filed against a volunteer", roles: [LeagueAdmin, ChapterCoordinator], code: 200, input: ["limit?", "offset?"], output: "PolicyIncident[]", side_effects: [] }
  - { method: POST, path: "/incidents/{id}/transitions", description: "Resolve an incident: to=SUBSTANTIATED (requires corrective_action; fires the suspension/remand/contest-revert cascade) or to=DISMISSED", roles: [LeagueAdmin], code: 200, input: [to, "corrective_action?"], output: PolicyIncident, side_effects: ["SUBSTANTIATED: Volunteer -> SUSPENDED, drafter's measures -> REMANDED, affected contests -> QUESTIONNAIRE_PHASE, moderator's forums -> CANCELLED"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role missing/unknown, X-User-ID missing for a non-PublicUser role, or an entity-backed X-User-ID that does not reference a live entity of the role's backing type with the required capability tag" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles, or ownership denial (non-assigned moderator driving a forum, candidate hitting another filing's shell path is 404 instead)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, undeclared field, bad type/enum, kind-field mismatch (office_name), duplicate question positions, incomplete answer coverage, bad priority_tier, missing minutes_text/corrective_action where required" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Any path id fails to resolve, or no response shell exists for (questionnaire_id, X-User-ID)" }
  - { id: ERR_CYCLE_NOT_OPEN, http: 409, condition: "Cycle-scoped creation or edition READY while the parent ElectionCycle is not OPEN" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity's current status is not an allowed from-state for the requested transition/action (incl. terminal lockout and bad to= values)" }
  - { id: ERR_QUESTIONNAIRE_NOT_ACCEPTING_SUBMISSIONS, http: 409, condition: "Submit/resubmit while Questionnaire.status != ISSUED" }
  - { id: ERR_FILING_NOT_VERIFIED, http: 409, condition: "Submit/resubmit while the shell's filing is not VERIFIED (shell WITHDRAWN_HIDDEN)" }
  - { id: ERR_QUESTIONNAIRE_NOT_PINNED, http: 422, condition: "Candidate-race contest transition to GUIDE_READY while its questionnaire is not PINNED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_contest_version / expected_questionnaire_version does not match the entity's current version" }
  - { id: ERR_VOLUNTEER_SUSPENDED, http: 403, condition: "Acting or referenced volunteer has status SUSPENDED" }
  - { id: ERR_ATTESTATION_LAPSED, http: 403, condition: "Acting or referenced volunteer's attestation is LAPSED at current_utc" }
  - { id: ERR_ADVOCACY_SEPARATION, http: 403, condition: "advocacy_flag=true volunteer assigned as measure drafter, neutrality reviewer, or forum moderator" }
  - { id: ERR_MODERATOR_NOT_QUALIFIED, http: 422, condition: "Referenced moderator's roles array lacks MODERATOR" }
  - { id: ERR_SOD_DRAFTER_CANNOT_REVIEW, http: 403, condition: "Neutrality reviewer's X-User-ID equals the measure's drafter_volunteer_id" }
  - { id: ERR_SOD_MODERATOR_OWN_QUESTION, http: 403, condition: "Moderator selects a MODERATOR_AUTHORED question whose author_volunteer_id equals the moderator's X-User-ID" }
  - { id: ERR_ONLY_DRAFTER_MAY_REVISE, http: 403, condition: "Revise or submit-for-review attempted by an editor whose X-User-ID is not the measure's drafter_volunteer_id" }
  - { id: ERR_NEUTRALITY_REVIEW_OUTSTANDING, http: 422, condition: "Edition READY while any measure in the cycle is IN_NEUTRALITY_REVIEW or REMANDED; or measure contest to GUIDE_READY without APPROVED_FOR_GUIDE measure" }
  - { id: ERR_FILING_DEADLINE_PASSED, http: 422, condition: "Filing create/refile after the contest filing_deadline (or outside the questionnaire window for refile in QUESTIONNAIRE_PHASE)" }
  - { id: ERR_FILING_STILL_OPEN, http: 422, condition: "Contest transition to QUESTIONNAIRE_PHASE at or before filing_deadline" }
  - { id: ERR_SUBMISSION_WINDOW_CLOSED, http: 422, condition: "Submit/resubmit after questionnaire.due_at" }
  - { id: ERR_CLOSE_BEFORE_DEADLINE, http: 422, condition: "Questionnaire close at or before due_at" }
  - { id: ERR_FORUM_TIME_OVERLAP, http: 422, condition: "New forum's half-open interval overlaps another PLANNED/CONFIRMED forum in the same jurisdiction" }
  - { id: ERR_MODERATOR_BUFFER_VIOLATION, http: 422, condition: "New forum leaves less than 24h between this moderator's forums in {PLANNED, CONFIRMED}" }
  - { id: ERR_FORUM_NOT_CONCLUDED, http: 422, condition: "Forum transition to HELD before scheduled_end" }
  - { id: ERR_DUPLICATE_FIPS, http: 409, condition: "fips_code already used by another jurisdiction of the cycle" }
  - { id: ERR_DUPLICATE_FILING_REFERENCE, http: 409, condition: "filing_reference already used by another filing of the contest" }
  - { id: ERR_DUPLICATE_QUESTIONNAIRE, http: 409, condition: "Contest already has a questionnaire" }
  - { id: ERR_DUPLICATE_MEASURE, http: 409, condition: "Contest already has a ballot measure" }
  - { id: ERR_DUPLICATE_REVIEW_THIS_ROUND, http: 409, condition: "Reviewer already reviewed this measure in the current review_round_count" }
  - { id: ERR_CONTEST_KIND_MISMATCH, http: 422, condition: "Questionnaire or forum on a BALLOT_MEASURE contest, or measure on a CANDIDATE_RACE contest" }
  - { id: ERR_MISSING_PRO_OR_CON, http: 422, condition: "submit-for-review without at least one ACCEPTED argument on each side" }
  - { id: ERR_FORUM_QUORUM_NOT_MET, http: 422, condition: "Forum confirm with eligible_candidate_count < 2" }
  - { id: ERR_QUESTION_CAP_REACHED, http: 422, condition: "Selecting a 6th question for one forum" }
  - { id: ERR_LANGUAGE_UNSUPPORTED, http: 422, condition: "Edition language not in every jurisdiction's supported_language_codes" }
  - { id: ERR_ACCESSIBILITY_GRADE_EXCEEDED, http: 422, condition: "Non-STANDARD edition while an APPROVED measure grades > 8.0 under its jurisdiction's metric" }
  - { id: ERR_STALE_SNAPSHOT, http: 422, condition: "Distribute while a snapshot contest is no longer LOCKED or a pinned questionnaire version advanced" }
  - { id: ERR_CONTESTS_NOT_LOCKED, http: 422, condition: "Cycle publish without every contest LOCKED (or zero contests); edition READY with no LOCKED contest" }
  - { id: ERR_UNRESOLVED_INCIDENTS_EXIST, http: 422, condition: "Cycle publish while any PolicyIncident is REPORTED" }
  - { id: ERR_NO_DISTRIBUTED_EDITION, http: 422, condition: "Cycle publish before any edition reaches DISTRIBUTED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LeagueAdmin
    description: "League operations administrator: cycles, jurisdictions, clock, volunteer registry, advocacy flags, incident adjudication"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc", "POST /election-cycles", "POST /election-cycles/{id}/transitions", "POST /election-cycles/{id}/jurisdictions", "POST /volunteers", "POST /volunteers/{id}/flag-advocacy", "POST /incidents/{id}/transitions"]
    shared_operations: ["GET reads across the surface", "POST /volunteers/{id}/attest is NOT available to LeagueAdmin (self-service only for volunteer-backed roles)"]
  - name: ChapterCoordinator
    description: "Chapter coordinator: contest inventory, official filings, nonresponse sweeps, forum scheduling, incident reporting"
    identity: "entity_backed:Volunteer (roles contains COORDINATOR)"
    exclusive_operations: ["POST /jurisdictions/{id}/contests", "POST /contests/{id}/transitions", "POST /contests/{id}/filings", "POST /filings/{id}/verify", "POST /filings/{id}/withdraw", "POST /filings/{id}/disqualify", "POST /filings/{id}/refile", "POST /contests/{id}/sweep-nonresponses", "POST /contests/{id}/forums", "POST /incidents"]
    shared_operations: ["GET reads", "POST /volunteers/{id}/attest (self)"]
  - name: QuestionnaireEditor
    description: "Questionnaire and guide editor: questionnaires, measure drafting, arguments, guide editions"
    identity: "entity_backed:Volunteer (roles contains EDITOR)"
    exclusive_operations: ["POST /contests/{id}/questionnaire", "POST /questionnaires/{id}/amend", "POST /questionnaires/{id}/issue", "POST /questionnaires/{id}/close", "POST /questionnaires/{id}/pin", "POST /contests/{id}/measure", "POST /measures/{id}/revise", "POST /measures/{id}/arguments", "POST /measures/{id}/submit-for-review", "POST /election-cycles/{id}/guide-editions", "POST /guide-editions/{id}/transitions", "POST /guide-editions/{id}/distribute"]
    shared_operations: ["GET reads", "POST /volunteers/{id}/attest (self)"]
  - name: NeutralityReviewer
    description: "Neutrality reviewer: reviews ballot measure explanations; barred from reviewing own drafts"
    identity: "entity_backed:Volunteer (roles contains REVIEWER)"
    exclusive_operations: ["POST /measures/{id}/reviews"]
    shared_operations: ["GET reads", "POST /volunteers/{id}/attest (self)"]
  - name: ForumModerator
    description: "Forum moderator: drives assigned forums and curates questions; cannot select own-authored questions"
    identity: "entity_backed:Volunteer (roles contains MODERATOR)"
    exclusive_operations: ["POST /forums/{id}/transitions", "POST /forum-questions/{id}/select", "POST /forum-questions/{id}/reject"]
    shared_operations: ["POST /forums/{id}/questions (with PublicUser)", "GET reads", "POST /volunteers/{id}/attest (self)"]
  - name: Candidate
    description: "Filed candidate responding to a questionnaire; X-User-ID equals the CandidateFiling id"
    identity: "entity_backed:CandidateFiling"
    exclusive_operations: ["POST /questionnaires/{id}/responses", "POST /responses/{id}/resubmit"]
    shared_operations: []
  - name: PublicUser
    description: "Unauthenticated-equivalent public: submits forum questions and reads published material; only role exempt from X-User-ID"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["POST /forums/{id}/questions (with ForumModerator)", "GET /forums/{id}/questions"]
