              as: ProductionEngineer
            - call: "POST /production-lots"
              payload: { production_asset_id: "${asset_id}", lot_code: "LOT-E5", mass_kg: 300.000, energy_consumed_kwh: 15600.0, feedstock_consumed_mmbtu: 0.000, carryover_kg: 0.000, production_start_at: "2026-07-20T00:00:00Z", production_end_at: "2026-07-21T00:00:00Z" }
