              captures: { prog_2025_id: $.data.id, default_method: $.data.accrual_method_default }
            - call: "GET /trade-marketing/programs/${prog_2026_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { read_budget: $.data.total_budget_amount }
            - call: "GET /trade-marketing/programs?fiscal_year=2026"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
          assert:
            - "${created_status} == OPEN and ${read_budget} == 500000.00"
            - "${default_method} == CONSUMPTION — the documented default when the field is omitted"
            - "the filtered list returns exactly 1 row and it is TradeProgram.${prog_2026_id}"
            - "TradeProgram.${prog_2025_id} is absent from that list but readable at its own path"
            - "TradeProgram.${prog_2026_id}.allocated_amount == 0.00 and .unallocated_amount == 500000.00"

      - name: allocation_approve_action_seeds_the_ledger_rollup
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/trade-marketing/budget-allocations/{allocationId}/approve
          - state_machines.BudgetAllocation.DRAFT_to_APPROVED
          - calculations.allocation_ledger_rollup
        distinguishing_aspect: |
          A bodiless action endpoint carries all of its meaning in its side effects: status
          DRAFT -> APPROVED, version 1 -> 2, approved_at stamped from the logical clock, and
          the ledger rollup initialised so available_amount equals planned_amount and
          unreserved_units equals planned_incremental_units.
        test_recipe:
          setup:
            - "One program, one brand, one customer and one DRAFT allocation of 75000.00 / 12000 incremental units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 500000.00, accrual_method_default: "CONSUMPTION" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id }
            - call: "POST /trade-marketing/brands"
              payload: { program_id: "${prog_id}", name: "Crisp Oat Cereal", list_price_per_case: 24.00, cogs_per_case: 8.70, baseline_units_per_week: 1200 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { brand_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_id}", brand_id: "${brand_id}", event_type: "NEW_ITEM", planned_amount: 75000.00, baseline_units: 30000, planned_incremental_units: 12000 }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { alloc_id: $.data.id, v_before: $.data.version, status_before: $.data.status }
          trigger:
            - call: "POST /trade-marketing/budget-allocations/${alloc_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { v_after: $.data.version, avail: $.data.available_amount, unres: $.data.unreserved_units }
          assert:
            - "${status_before} == DRAFT and ${v_before} == 1"
            - "HTTP 200, BudgetAllocation.${alloc_id}.status == APPROVED and ${v_after} == 2"
            - "BudgetAllocation.${alloc_id}.approved_at == 2026-08-01T00:00:00.000Z — the logical clock, not wall time"
            - "${avail} == 75000.00 and ${unres} == 12000"
            - "BudgetAllocation.${alloc_id}.committed_amount == 0.00, .accrued_amount == 0.00, .settled_amount == 0.00, .at_risk_amount == 0.00"
            - "BudgetAllocation.${alloc_id}.posture == OPEN and .overspend_event_count == 0"

      - name: activation_run_returns_per_entity_id_lists
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/trade-marketing/promotion-activation-runs
          - state_machines.Promotion.APPROVED_to_LIVE
          - state_machines.PromotionTactic.PLANNED_to_ACTIVE
        distinguishing_aspect: |
          One bodiless run sweeps every APPROVED promotion and reports four disjoint id lists.
