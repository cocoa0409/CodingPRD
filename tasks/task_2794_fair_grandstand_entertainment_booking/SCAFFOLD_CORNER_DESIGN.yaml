              payload: { expected_show_booking_version: "${bkv_a7}", action_type: "CANCEL", reason_code: "SEVERE_WEATHER", refund_policy: "RAIN_CHECK", replacement_show_date: "2026-08-26" }
              as: FairOperationsDirector
