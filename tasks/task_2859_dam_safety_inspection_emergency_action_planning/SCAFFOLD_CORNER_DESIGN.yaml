              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Elk Hollow Dam", nid_code: "ST00123", height_ft: 62, gross_storage_acre_ft: 1500, crest_elevation_ft: 1042.5, normal_pool_elevation_ft: 1038.0, year_completed: 1968, registered_at: "2019-04-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam_id: "$.data.id" }
            - call: "POST /consequence-assessments"
              payload: { dam_id: "${dam_id}", population_at_risk: 3, habitable_structures: 2, critical_facilities: 0, breach_peak_outflow_cfs: 9000, breach_travel_time_minutes: 200, inundation_area_acres: 50, inundation_map_ref: "IM-2019-A" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /consequence-assessments/${a1_id}/certify"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
            - call: "POST /high-water-events"
              payload: { dam_id: "${dam_id}", declared_at: "2026-08-01T06:00:00Z", trigger_description: "Frontal storm", declared_inflow_cfs: 900 }
              as: EmergencyCoordinator
              captures: { event_id: "$.data.id" }
            - call: "POST /drawdown-orders"
              payload: { dam_id: "${dam_id}", high_water_event_id: "${event_id}", requested_release_cfs: 200, window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T06:00:00Z" }
              as: EmergencyCoordinator
              captures: { order_id: "$.data.id" }
            - call: "GET /river-reaches/${reach_id}"
              payload: {}
              as: ProgramAdmin
              captures: { reach_v: "$.data.version" }
          trigger:
            - call: "POST /drawdown-orders/${order_id}/coordinate"
              payload: { expected_reach_version: "${reach_v}" }
              as: ProgramAdmin
            - call: "GET /river-reaches/${reach_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /dams/${dam_id}/compliance-summary"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the coordinate response reports status == COORDINATED and planned_release_acre_ft == 99.174"
            - "the immediately following reach read reports committed_release_cfs == 200 and available_capacity_cfs == 1000"
            - "the compliance summary reports committed_drawdown_acre_ft == 99.174 and available_conservation_storage_acre_ft == 1400.826"
            - "no second call is needed for any of these figures to appear, and RiverReach.${reach_id}.version == ${reach_v} + 1"

      - name: fee_adjustment_response_carries_the_recomputed_balance
        claim_type: immediate
        grounds:
          - endpoints[POST /owners/{id}/fee-adjustments]
          - entities.FeeLedgerEntry.computed_fields.balance_after_cents
          - calculations.owner_fee_balance_and_delinquency
        distinguishing_aspect: |
          The ledger is append-only with a running balance, so each posting must return its own
          balance_after_cents computed from the immediately preceding row, and the owner's
          delinquency_status must already reflect that balance in the same response.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z with one owner and an empty ledger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
          trigger:
            - call: "POST /owners/${owner_id}/fee-adjustments"
              payload: { entry_type: "ANNUAL_REGISTRATION_FEE", amount_cents: 20000, memo: "2026 registration" }
              as: ProgramAdmin
            - call: "POST /owners/${owner_id}/fee-adjustments"
              payload: { entry_type: "CIVIL_PENALTY", amount_cents: 10000, memo: "Late response" }
              as: ProgramAdmin
            - call: "POST /owners/${owner_id}/fee-adjustments"
              payload: { entry_type: "PAYMENT_RECEIVED", amount_cents: -30000, memo: "Cleared in full" }
              as: ProgramAdmin
            - call: "GET /owners/${owner_id}/fee-ledger-entries"
              payload: {}
              as: DamOwner
              as_user_id: "${owner_id}"
          assert:
            - "the three responses report balance_after_cents 20000, 30000 and 0 with sequence_number 1, 2 and 3"
            - "the second response already reports the owner as DELINQUENT because 30000 is at or above the 25000-cent threshold"
            - "the third response already reports the owner as CURRENT in the same reply that posts the payment"
            - "the ledger read returns total_count 3 ordered by sequence_number ASC with matching balances and Owner.${owner_id}.outstanding_penalty_cents == 0"
