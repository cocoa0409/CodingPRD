            - "GrantProgram.${prog}.status == EXHAUSTED (hop 3: caused by the pool reaching exactly 0)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: grant_create_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors[ERR_PROJECT_STATE_FORBIDS]
          - errors[ERR_INCOME_ABOVE_CAP]
        distinguishing_aspect: |
          Pair (state, business_fiscal): one submission violates both — project is DRAFT
          (no product selected) AND household_income 70000.00 exceeds the 60000.00 cap.
          Priority 5 must win: ERR_PROJECT_STATE_FORBIDS, never ERR_INCOME_ABOVE_CAP.
        test_recipe:
          setup:
            - "Project in DRAFT (survey COMPLETED, product NOT selected)"
            - "Program OPEN with income_cap 60000.00"
          setup_api_calls:
            - { call: "POST /api/properties", payload: { owner_user_id: "u-own-1", address_line: "1 Pine St", state_code: "CA" }, as: ProjectCoordinator, captures: { prop: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Sam Surveyor", certification: "CET_AND_QEI", home_region: "north" }, as: DealerAdmin, captures: { t_surv: $.data.id } }
