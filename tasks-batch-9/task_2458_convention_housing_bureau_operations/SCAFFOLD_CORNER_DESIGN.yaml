        grounds:
          - state_machines.HotelBlock.initial_state
          - entities.HotelBlock.fields.unassigned_rooms_per_night
        distinguishing_aspect: "A freshly created block is DRAFT with revision_round 0, unassigned_rooms_per_night 0 (rooms only enter inventory at contract time), released_rooms_per_night 0 and version 1."
        test_recipe:
          setup: ["One event and one hotel exist."]
          setup_api_calls:
            - call: "POST /housing/events"
              payload: { name: "Annual Summit", code: "SUM26", event_start_date: "2026-09-14", event_end_date: "2026-09-18", cutoff_date: "2026-08-21", attrition_deadline_date: "2026-08-15", standard_commission_pct: 0.10, standard_rebate_per_room_night_cents: 500 }
              as: BureauCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /housing/hotels"
              payload: { name: "Grand Plaza", distance_to_venue_miles: 0.3, room_tax_pct: 0.1475, total_rooms: 400 }
              as: BureauCoordinator
              captures: { hotel_id: $.data.id }
          trigger:
            - call: "POST /housing/hotel-blocks"
              payload: { event_id: "${event_id}", hotel_id: "${hotel_id}", contracted_rooms_per_night: 10, negotiated_nightly_rate_cents: 21900, commission_pct: 0.12, rebate_per_room_night_cents: 700, cutoff_date: "2026-08-21", reduction_rights_pct: 0.20 }
