            - "after the first FAILED attempt Turbine.${t_id}.remote_reset_count_24h == 1 with reset_window_start_utc == 2026-08-01T00:00:00Z, the clock at the first attempt"
            - "after the SUCCEEDED attempt on the same event remote_reset_count_24h == 2 and FaultEvent.${fe1}.reset_attempt_count == 2, both attempts having been spent inside the per-event quota of 2"
            - "the attempt at 2026-08-01T23:59:59Z, one second short of the window edge, takes remote_reset_count_24h to 3 and leaves reset_window_start_utc at 2026-08-01T00:00:00Z"
            - "the attempt at exactly 2026-08-02T00:00:00Z rolls the window: reset_window_start_utc == 2026-08-02T00:00:00Z and remote_reset_count_24h == 1, counting the triggering attempt itself"
            - "FaultEvent.${fe2}.reset_attempt_count == 1 and FaultEvent.${fe3}.reset_attempt_count == 1, since the per-event counters are independent of the turbine's rolling counter"
            - "all three events end CLEARED and Turbine.${t_id}.availability_state == ONLINE"
