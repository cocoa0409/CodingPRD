      - name: officer_of_one_lender_cannot_reach_another_lenders_records
        claim_type: tenant_scope_isolation
        grounds:
          - validations[priority=12]
          - errors.ERR_INSTITUTION_SCOPE_VIOLATION
          - roles.InstitutionOfficer.identity
        distinguishing_aspect: |
          The officer's identity IS an institution id, so scope is enforced per row and answers
          403 ERR_INSTITUTION_SCOPE_VIOLATION - not 404 and not 403 ERR_UNAUTHORIZED: officer B
          may neither read institution A's loan nor register a borrower under institution A, while
          officer A reads the same loan successfully.
        test_recipe:
          setup:
            - "Institution A with one product, one borrower and one loan for 1,000,000 cents in SCREENING."
            - "Institution B, unrelated, with its own officer identity."
