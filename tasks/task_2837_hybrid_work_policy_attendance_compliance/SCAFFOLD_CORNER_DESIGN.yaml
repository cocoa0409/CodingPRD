              as: WorkplaceProgramOffice
              captures: { n2: $.data.id, n2_v1: $.data.version }
          trigger:
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1}", team_id: "${t_a}", allocated_seats: 6, window_start_week: "2026-W37", window_end_week: "2026-W40", expected_neighborhood_version: "${n1_v1}" }
              as: WorkplaceProgramOffice
              captures: { a1: $.data.id }
            - call: "GET /neighborhoods/${n1}"
              payload: {}
              as: WorkplaceProgramOffice
              captures: { n1_v2: $.data.version }
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1}", team_id: "${t_b}", allocated_seats: 8, window_start_week: "2026-W37", window_end_week: "2026-W40", expected_neighborhood_version: "${n1_v2}" }
              as: WorkplaceProgramOffice
              captures: { a2: $.data.id }
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n2}", team_id: "${t_a}", allocated_seats: 4, window_start_week: "2026-W37", window_end_week: "2026-W40", expected_neighborhood_version: "${n2_v1}" }
              as: WorkplaceProgramOffice
              captures: { a3: $.data.id }
            - call: "GET /neighborhoods/${n1}"
              payload: {}
              as: WorkplaceProgramOffice
              captures: { n1_v3: $.data.version }
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1}", team_id: "${t_z}", allocated_seats: 2, window_start_week: "2026-W37", window_end_week: "2026-W40", expected_neighborhood_version: "${n1_v3}" }
