      - name: supersede_approve_retires_old_guide
        claim_type: side_effect_execution
        grounds: ["state_machines.InterviewGuide.APPROVED_to_RETIRED", "entities.InterviewGuide.fields.superseded_by_guide_id", "concurrency_rules[guide-supersede-stale-head]"]
        distinguishing_aspect: "Cyclic supersede chain: creating g2 with supersedes_guide_id=g1 bumps g1.version and sets superseded_by; approving g2 (by a non-author) auto-retires APPROVED g1 and stamps version_label 2."
        test_recipe:
          setup: ["guide g1 APPROVED (created by admin-1, approved by admin-2)"]
          setup_api_calls:
            - { call: "POST /talent/interview-guides", payload: { title: "Guide v1", rubric_items: [{ competency_code: "COMM", weight: 0.6, scale_max: 5 }, { competency_code: "ANAL", weight: 0.4, scale_max: 5 }] }, as: TalentAssessmentAdmin, as_user_id: admin-1, captures: { g1: $.data.id } }
            - { call: "POST /talent/interview-guides/${g1}/pilot", as: TalentAssessmentAdmin, as_user_id: admin-1 }
            - { call: "POST /talent/interview-guides/${g1}/approve", as: TalentAssessmentAdmin, as_user_id: admin-2 }
            - { call: "GET /talent/interview-guides/${g1}", as: TalentAssessmentAdmin, captures: { g1v: $.data.version } }
          trigger:
            - { call: "POST /talent/interview-guides/${g1}/revisions", payload: { title: "Guide v2", rubric_items: [{ competency_code: "COMM", weight: 0.7, scale_max: 5 }, { competency_code: "ANAL", weight: 0.3, scale_max: 5 }], expected_superseded_guide_version: "${g1v}" }, as: TalentAssessmentAdmin, as_user_id: admin-2, captures: { g2: $.data.id, g2label: $.data.version_label } }
            - { call: "POST /talent/interview-guides/${g2}/pilot", as: TalentAssessmentAdmin, as_user_id: admin-2 }
            - { call: "POST /talent/interview-guides/${g2}/approve", as: TalentAssessmentAdmin, as_user_id: admin-1 }
            - { call: "GET /talent/interview-guides/${g1}", as: TalentAssessmentAdmin, captures: { g1st: $.data.status, g1by: $.data.superseded_by_guide_id } }
            - { call: "GET /talent/interview-guides", payload: { supersedes_guide_id: "${g1}" }, as: TalentAssessmentAdmin }
          assert:
            - "g2 created with version_label == 2 (g1's 1 + 1) and status DRAFT at create"
            - "after g2 approve: g1.status == RETIRED (auto) AND g1.superseded_by_guide_id == ${g2}; g2.status == APPROVED"
            - "GET /talent/interview-guides?supersedes_guide_id=${g1} returns exactly [${g2}] (self-FK reverse reachability)"

