              as_user_id: "hos-signer-1"
            - call: "POST /film-sales/films/${film_id}/state"
              payload: { to_status: "PACKAGING" }
              as: PlatformAdmin
            - call: "POST /film-sales/territory-valuations"
              payload: { film_id: "${film_id}", territory_id: "${terr_de_id}", method: "CAST_ADJUSTED" }
              as: SalesAgent
              captures: { val_de_id: $.data.id }
            - call: "GET /film-sales/films/${film_id}"
              payload: {}
              as: HeadOfSales
              captures: { film_v1: $.data.version }
            - call: "POST /film-sales/territory-valuations/${val_de_id}/publish"
              payload: { expected_film_version: "${film_v1}" }
              as: HeadOfSales
              as_user_id: "hos-valuer-1"
            - call: "POST /film-sales/films/${film_id}/state"
              payload: { to_status: "IN_MARKET" }
              as: HeadOfSales
            - call: "GET /film-sales/buyers/${buyer_de_id}"
              payload: {}
