  # =====================================================================
  # RULE 5 — priority_pair_validation_conflict
  # Three instances, three DIFFERENT error-category pairs:
  #   I1  state (26)          vs business_temporal   (73)
  #   I2  business_safety (45) vs business_referential (66)
  #   I3  state (34)          vs business_fiscal     (80)
  # Each instance first proves the LOWER-priority rule is live on the very
  # same request, then adds the higher-priority violation and shows the
  # higher-priority error replaces it.
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: season_not_open_outranks_slot_return_deadline_passed_on_the_same_return
        grounds:
          - "validations.priority_26_ERR_SEASON_NOT_OPEN"
          - "validations.priority_73_ERR_SLOT_RETURN_DEADLINE_PASSED"
          - state_machines.SlotHolding.HELD_to_RETURNED
        distinguishing_aspect: |
          Category pair is state (priority 26, ERR_SEASON_NOT_OPEN, 409) versus business_temporal
          (priority 73, ERR_SLOT_RETURN_DEADLINE_PASSED, 422). The byte-identical return request is
          issued twice against the same holding under the same clock; the only difference is that the
          season has moved OPEN -> CLOSED in between, and the response flips from the 422 temporal error
          to the 409 state error. An implementation that evaluates the deadline first returns 422 both
          times and fails.
        test_recipe:
          setup:
            - "Home carrier HX (DE); FRA LEVEL_3_COORDINATED gate_count 2."
            - "Season W26 with slot_return_deadline_utc 2026-09-15T23:59:59Z, transitioned to OPEN."
            - "One FRA DEPARTURE SlotHolding held by HX, historic_precedence false, holding_status HELD, pending_transaction_id null."
            - "Logical clock advanced to 2026-09-20T00:00:00Z, i.e. AFTER slot_return_deadline_utc, so the business_temporal rule at priority 73 is already violated."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: false }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { sh_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
          trigger:
            - call: "POST /slot-holdings/${sh_id}/return"
              payload: { reason: "NETWORK_RESTRUCTURE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "CLOSED" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /slot-holdings/${sh_id}/return"
              payload: { reason: "NETWORK_RESTRUCTURE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          assert:
            - "trigger call 1 (season OPEN, deadline passed) -> HTTP 422 with error_id == \"ERR_SLOT_RETURN_DEADLINE_PASSED\", proving the priority 73 business_temporal rule is genuinely violated by this request"
            - "trigger call 3 (identical payload, identical clock, season now CLOSED) -> HTTP 409 with error_id == \"ERR_SEASON_NOT_OPEN\", NOT ERR_SLOT_RETURN_DEADLINE_PASSED"
            - "after both failures SlotHolding.${sh_id}.holding_status == HELD, returned_before_deadline == null, retains_historic_precedence == null, returned_reason == null — neither rejection mutated the holding"
            - "Season.${season_id}.status == CLOSED and Season.${season_id}.held_series_count == 1"

      - name: curfew_violation_outranks_route_authority_missing_on_the_same_leg_creation
        grounds:
          - "validations.priority_45_ERR_CURFEW_VIOLATION"
          - "validations.priority_66_ERR_ROUTE_AUTHORITY_MISSING"
          - endpoints.POST_flight_legs
        distinguishing_aspect: |
          A different category pair from instance 1 — business_safety (priority 45, ERR_CURFEW_VIOLATION,
          422) versus business_referential (priority 66, ERR_ROUTE_AUTHORITY_MISSING, 422). Both errors
          carry the SAME http_status 422, so the test cannot be passed by status-code luck: the
          discriminator is error_id alone. Supplying curfew_waiver_reference clears only the safety rule
          and exposes the referential one, proving both were violated by the unwaived request.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Home carrier HX (DE); MUC LEVEL_2_FACILITATED gate_count 3 utc_offset_minutes 120; LIS LEVEL_2_FACILITATED gate_count 2 utc_offset_minutes 0 with curfew_start_local_minutes 1380 and curfew_end_local_minutes 330."
            - "Season W26 is OPEN; ScheduleVersion W26-P2 exists in DRAFT."
            - "NO RouteAuthority exists for DE -> PT, so the priority 66 business_referential rule is violated for any MUC -> LIS leg."
            - "The candidate leg arrives LIS at 2026-11-03T23:30:00Z; LIS utc_offset_minutes is 0 so local arrival minute-of-day is 1410, inside the curfew window [1380, 330), violating the priority 45 business_safety rule as well."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "LIS", country_code: "PT", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 0, gate_count: 2, curfew_start_local_minutes: 1380, curfew_end_local_minutes: 330, maintenance_capable: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { lis_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-P2" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
          trigger:
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX880", origin_station_id: "${muc_id}", dest_station_id: "${lis_id}", dep_utc: "2026-11-03T21:00:00Z", arr_utc: "2026-11-03T23:30:00Z", fleet_type_code: "B738", curfew_waiver_reference: "NIGHT-01" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX880", origin_station_id: "${muc_id}", dest_station_id: "${lis_id}", dep_utc: "2026-11-03T21:00:00Z", arr_utc: "2026-11-03T23:30:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          assert:
            - "trigger call 1 (curfew waived, still no traffic right) -> HTTP 422 with error_id == \"ERR_ROUTE_AUTHORITY_MISSING\", proving the priority 66 business_referential rule is genuinely violated"
            - "trigger call 2 (identical leg, curfew_waiver_reference omitted) -> HTTP 422 with error_id == \"ERR_CURFEW_VIOLATION\", NOT ERR_ROUTE_AUTHORITY_MISSING"
            - "both rejections share http_status 422, so error_id is the only discriminator"
            - "ScheduleVersion.${sv_id}.leg_count == 0, curfew_violation_count == 0, schedule_compliance_score == 100.00 and compliance_state == CLEAN — neither rejected creation left a partial FlightLeg or moved a counter"
            - "GET /flight-legs?schedule_version_id=${sv_id} returns total_count == 0"

      - name: schedule_blocked_outranks_filing_charge_budget_exceeded_on_the_same_transmit
        grounds:
          - "validations.priority_34_ERR_SCHEDULE_BLOCKED"
          - "validations.priority_80_ERR_FILING_CHARGE_BUDGET_EXCEEDED"
          - state_machines.FilingSubmission.QUEUED_to_TRANSMITTED
          - calculations.filing_change_charge_cents
        distinguishing_aspect: |
          A third distinct category pair — state (priority 34, ERR_SCHEDULE_BLOCKED, 409) versus
          business_fiscal (priority 80, ERR_FILING_CHARGE_BUDGET_EXCEEDED, 402). The SAME QUEUED
          submission is transmitted twice: the first attempt proves the fiscal rule fires with 402
          because total_charge_cents 16900 exceeds filing_charge_budget_cents 1000, then a leg retime
