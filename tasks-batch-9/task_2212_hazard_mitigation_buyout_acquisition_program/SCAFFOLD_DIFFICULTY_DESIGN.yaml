            - "the response status is 422 and data.error_id == ERR_ASBESTOS_SURVEY_MISSING"
            - "data.error_id != ERR_UTILITY_DISCONNECT_INCOMPLETE and the response status is not 409"
            - "DemolitionWorkOrder.${wo}.status == UTILITY_HOLD"
