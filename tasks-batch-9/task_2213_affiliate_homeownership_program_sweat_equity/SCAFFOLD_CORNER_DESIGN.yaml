          assert:
            - "Second HOMEBUYER_CORE: HTTP 409 and ${e_dup} == ERR_DUPLICATE_ENROLLMENT — the existing row is IN_PROGRESS, which is inside the blocking set"
            - "BUDGET_COACHING and HOME_MAINTENANCE enrollments: HTTP 201 each, status == ENROLLED — the constraint is per curriculum_code"
            - "HOMEBUYER_CORE filtered list: total_count == 1 and that row is ${enr_id} with passed_module_count == 1 and status == IN_PROGRESS"
            - "Unfiltered list for the household: total_count == 3"

