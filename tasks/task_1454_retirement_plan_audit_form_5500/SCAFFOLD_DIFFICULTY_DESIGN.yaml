              payload: { sponsor_ein: "12-3456789", plan_number: "013", plan_name: "Mu 401(k) Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC_401K", funding_arrangement: "TRUST", prior_year_schedule_type: "NONE_FIRST_YEAR" }
