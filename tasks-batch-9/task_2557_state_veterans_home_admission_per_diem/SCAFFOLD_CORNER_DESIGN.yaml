            - call: "POST /svh/clinical-assessments/${asmt_id}/submit"
              payload: {}
              as: ClinicalAssessor
              as_user_id: "assessor-1"
          trigger:
            - call: "GET /svh/care-units/${u2_id}"
              payload: {}
              as: AdmissionsCoordinator
              captures: { u2_v0: "$.data.version", u2_posture: "$.data.operational_posture", u2_avail0: "$.data.available_bed_count" }
            - call: "POST /svh/applicants/${app_id}/admission-decision"
              payload: { decision: "APPROVED", care_unit_id: "${u2_id}", clinical_assessment_id: "${asmt_id}", expected_care_unit_version: "${u2_v0}", admission_date: "2026-08-01" }
              as: AdmissionsCoordinator
              as_user_id: "coordinator-1"
              captures: { wrong_unit_err: "$.data.error_id" }
            - call: "POST /svh/waitlist-entries"
              payload: { applicant_id: "${app_id}", care_unit_id: "${u2_id}" }
              as: AdmissionsCoordinator
              captures: { e2_id: "$.data.id", e2_status0: "$.data.status" }
            - call: "GET /svh/care-units/${u2_id}"
              payload: {}
              as: AdmissionsCoordinator
              captures: { u2_v1: "$.data.version" }
            - call: "POST /svh/applicants/${app_id}/admission-decision"
              payload: { decision: "APPROVED", care_unit_id: "${u2_id}", clinical_assessment_id: "${asmt_id}", expected_care_unit_version: "${u2_v1}", admission_date: "2026-08-01" }
              as: AdmissionsCoordinator
              as_user_id: "coordinator-1"
              captures: { res_id: "$.data.id", res_unit: "$.data.care_unit_id", res_level: "$.data.current_care_level", res_occ: "$.data.occupancy_status" }
            - call: "GET /svh/care-units/${u1_id}/waitlist-entries"
              payload: { limit: 10 }
              as: AdmissionsCoordinator
              captures: { u1_e_total: "$.meta.total_count", u1_e_status: "$.data[0].status", u1_e_pos: "$.data[0].queue_position" }
