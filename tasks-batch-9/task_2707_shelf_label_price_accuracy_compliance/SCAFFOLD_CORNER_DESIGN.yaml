          difficulty_instance: unit_price_rounding_mode_decides_the_exact_half_cent_tie
          rationale: "The rounding-mode claim (ROUND_HALF_UP vs ROUND_HALF_DOWN on an exact .5 tie, and the non-tie neighbours) is asserted there with pinned literals."

      - name: corner_audit_outcome_threshold_boundary_excluded
        claim_type: threshold
        excluded_because:
          difficulty_instance: audit_outcome_threshold_is_inclusive_at_exactly_the_percentage
          rationale: "The threshold-1 / threshold / threshold+1 sweep on scanner_audit_error_rate, including the inclusive >= at the exact percentage, is that instance's whole subject."

      - name: corner_scanner_rate_variant_divergence_excluded
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: audit_error_rate_gross_vs_net_variant_divergence
          rationale: "Same scan set, both variants, opposite outcomes with the delta asserted — already covered; this section only adds the selection-and-fallback claim above it."

      - name: corner_accountability_variant_divergence_excluded
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: accountability_score_occurrence_vs_task_weighted_divergence
          rationale: "The OCCURRENCE_WEIGHTED vs TASK_WEIGHTED divergence on identical actions is asserted there; the corner above adds only the lazy re-derivation after a variant switch."

      - name: corner_inspection_net_settlement_order_excluded
        claim_type: correct_result
        excluded_because:
          difficulty_instance: inspection_net_settlement_pinned_order_breaks_apparent_circularity
          rationale: "All five pinned steps of inspection_net_settlement, including the double FLOOR then min in step 3, are asserted with literals in §1.8."

      - name: corner_backlog_derived_field_excluded
        claim_type: correct_result
        excluded_because:
          difficulty_instance: label_backlog_counter_survives_reject_replace_and_withdrawal
          rationale: "store_label_backlog_count's input-set filter and its recompute-from-scratch behaviour are exercised across every mutation path in that instance."

  # ==========================================================================
  # Table 4 — Validations
  # ==========================================================================
  - section: Validations
    instances:
      - name: corner_certification_gate_applies_with_and_without_a_live_certificate
        claim_type: conditional_validation
        grounds:
          - validations.priority_51
          - errors.ERR_ASSOCIATE_NOT_CERTIFIED
          - endpoints.POST_/price-integrity/associates/{id}/training-completions
        distinguishing_aspect: "Priority 51 is a two-part predicate — CERTIFIED *and* certification_expires_at > clock_now — so the same associate is refused three times for two different reasons: not yet certified (UNTRAINED and then IN_TRAINING after a 79 score), and certified-but-expired at exactly certification_expires_at, where the comparison is strict."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one jurisdiction, one store, one aisle; a PRICE_AUDITOR associate who starts UNTRAINED."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California" }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { ai_1: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-PA1", full_name: "Pat Auditor", role_code: "PRICE_AUDITOR" }
              as: PricingAdmin
              captures: { pa1: $.data.id, st_new: $.data.training_status, exp_new: $.data.certification_expires_at }
          trigger:
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${ai_1}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-02T08:00:00Z", scan_window_end: "2026-08-02T09:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { err_untrained: $.data.error_id }
            - call: "POST /price-integrity/associates/${pa1}/training-completions"
              payload: { module_code: "AUDIT_101", score_pct: 79 }
              as: PricingAdmin
              captures: { st_79: $.data.training_status, exp_79: $.data.certification_expires_at, last_79: $.data.last_training_score_pct }
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${ai_1}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-02T08:00:00Z", scan_window_end: "2026-08-02T09:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { err_in_training: $.data.error_id }
            - call: "POST /price-integrity/associates/${pa1}/training-completions"
              payload: { module_code: "AUDIT_101", score_pct: 80 }
              as: PricingAdmin
              captures: { st_80: $.data.training_status, exp_80: $.data.certification_expires_at }
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${ai_1}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-02T08:00:00Z", scan_window_end: "2026-08-02T09:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { au_1: $.data.id, au_status: $.data.status }
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2027-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/scanner-audits/${au_1}/scan-lines"
              payload: { item_upc: "00000000006001", shelf_price_cents: 100, register_price_cents: 150 }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { err_expired: $.data.error_id }
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T08:30:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/scanner-audits/${au_1}/scan-lines"
              payload: { item_upc: "00000000006001", shelf_price_cents: 100, register_price_cents: 150 }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { sl_1: $.data.id, cls_1: $.data.classification }
          assert:
            - "${st_new} == UNTRAINED and ${exp_new} == null on hire"
            - "First audit attempt: HTTP 422 with ${err_untrained} == ERR_ASSOCIATE_NOT_CERTIFIED"
            - "${st_79} == IN_TRAINING, ${exp_79} == null, ${last_79} == 79 — a failing score is recorded, not rejected (79 < TRAINING_PASS_SCORE_PCT 80)"
            - "Second audit attempt: HTTP 422 with ${err_in_training} == ERR_ASSOCIATE_NOT_CERTIFIED"
            - "${st_80} == CERTIFIED and ${exp_80} == 2027-08-01T00:00:00Z == 2026-08-01T00:00:00Z + CERTIFICATION_VALID_DAYS 365 — exactly 80 passes, the comparison is >="
            - "Third audit attempt: HTTP 201 with ${au_status} == OPEN"
            - "With the clock at exactly 2027-08-01T00:00:00Z the scan line is refused: HTTP 422 with ${err_expired} == ERR_ASSOCIATE_NOT_CERTIFIED, because the rule needs certification_expires_at > clock_now and equality fails"
            - "Rewinding the clock inside the certificate's life makes the identical call succeed: HTTP 201, ${cls_1} == OVERCHARGE, and GET /price-integrity/scanner-audits/${au_1} now reports status SCANNING with sample_size 1"

      - name: corner_posture_gate_blocks_restricted_without_override_and_frozen_outright
        claim_type: conditional_validation
        grounds:
          - validations.priority_52
          - errors.ERR_STORE_POSTURE_BLOCKED
          - calculations.store_compliance_posture
        distinguishing_aspect: "The same error id has two different escape hatches: at RESTRICTED the posting is allowed with override_acknowledged == true, at FROZEN the identical override is ignored and every one of the three posture-gated endpoints refuses, including the label-task create that has already passed its OCC check at priority 45."
        test_recipe:
          setup:
            - "Jurisdiction with scanner_error_rate_threshold_pct 20.0, grace_period_hours 48 and no required disclosure codes."
            - "One store; aisle A01 assigned to la1, plus unassigned A02 and A03; certified la1 (LABEL_ASSOCIATE), pa1 (PRICE_AUDITOR) and sm1 (STORE_MANAGER)."
            - "A distributed two-line file, one label task already created while the posture was OPEN, and two DRAFT signs."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", scanner_error_rate_threshold_pct: 20.0, grace_period_hours: 48 }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id, posture_new: $.data.compliance_posture }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-SM1", full_name: "Sam Manager", role_code: "STORE_MANAGER" }
              as: PricingAdmin
              captures: { sm1: $.data.id }
            - call: "POST /price-integrity/associates/${sm1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-LA1", full_name: "Lee Label", role_code: "LABEL_ASSOCIATE" }
              as: PricingAdmin
              captures: { la1: $.data.id }
            - call: "POST /price-integrity/associates/${la1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-PA1", full_name: "Pat Auditor", role_code: "PRICE_AUDITOR" }
