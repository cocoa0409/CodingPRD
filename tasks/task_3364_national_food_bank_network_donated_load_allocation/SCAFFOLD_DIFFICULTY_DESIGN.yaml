        distinguishing_aspect: |
          The state/fiscal pair: a bid on a POSTED load by a member whose share_balance is 0
          violates both the load-state rule (priority 16) and the share-sufficiency rule
          (priority 31); the state error ERR_LOAD_NOT_BIDDING must win.
