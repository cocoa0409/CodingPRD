# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2462 - Short-Term Rental Turnover & Cleaning Coordination
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1-§1.7.
# Logical clock starts at 2026-08-01T00:00:00Z (POST /_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pay_variant_divergence_provisional_vs_final_linen_units
        grounds:
          - calculations.cleaner_pay_line
          - entities.PayLine.fields.linen_units
          - entities.PayLine.fields.net_cents
          - state_machines.PayLine.PROVISIONAL_to_FINAL
          - endpoints["GET /turnovers/{id}/pay-preview"]
        distinguishing_aspect: |
          The PROVISIONAL variant estimates linen_units from the property's summed ACTIVE LINEN
          par_qty (6 + 8 = 14 units, adder 1680) while FINAL counts only the 2 LINEN units actually
          consumed on VERIFIED RESTOCK tasks (adder 240), so the same turnover settles at
          net_cents 11114 instead of the 12554 promised at acceptance - a delta of exactly -1440.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, then advanced to 2026-08-08T16:00:00Z."
            - "Property P1 'AUS-101': ZONE_A, TWO_BR, 2 bathrooms, 3 beds, min_clean_minutes 120, min_skill_level 2, local_utc_offset_minutes -300."
            - "P1 carries four ACTIVE supply lines: LIN-SHEET-Q (LINEN, 260c, par 6, on_hand 6), LIN-TOWEL-B (LINEN, 180c, par 8, on_hand 8), CON-COFFEE (CONSUMABLE, 340c, par 4, on_hand 4), WEL-WINE (WELCOME, 900c, par 1, on_hand 1). Summed ACTIVE LINEN par_qty = 14."
            - "Cleaner C: home ZONE_A, skill_level 4, quality_score 92.00, max_daily_turnovers 3."
            - "Outgoing booking OUT-1 [2026-08-05T21:00Z, 2026-08-08T16:00Z), incoming booking IN-1 [2026-08-08T21:00Z, 2026-08-11T16:00Z)."
            - "Turnover T1 derived: window 16:00Z-20:30Z, window_minutes 270, required_minutes 198, slack 72, is_tight false, turn_type SAME_DAY."
            - "T1 assigned to C, accepted (PROVISIONAL PayLine minted), outgoing guest CHECKED_OUT, clean started, all four checklist tasks submitted with the restock task consuming exactly 1 unit of each of the four lines, and all four APPROVED so the turnover sits in AWAITING_VERIFICATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, local_utc_offset_minutes: -300, min_clean_minutes: 120, min_skill_level: 2, owner_notify_min_cost_cents: 5000 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /properties/${p1}/supply-lines"
              payload: { sku: "LIN-SHEET-Q", name: "Queen sheet set", category: "LINEN", unit_cost_cents: 260, par_qty: 6, unit: "SET", initial_on_hand_qty: 6 }
              as: PlatformAdmin
              captures: { sl1: "$.data.id" }
            - call: "POST /properties/${p1}/supply-lines"
              payload: { sku: "LIN-TOWEL-B", name: "Bath towel", category: "LINEN", unit_cost_cents: 180, par_qty: 8, unit: "EACH", initial_on_hand_qty: 8 }
              as: PlatformAdmin
              captures: { sl2: "$.data.id" }
            - call: "POST /properties/${p1}/supply-lines"
              payload: { sku: "CON-COFFEE", name: "Coffee pods", category: "CONSUMABLE", unit_cost_cents: 340, par_qty: 4, unit: "BOX", initial_on_hand_qty: 4 }
              as: PlatformAdmin
              captures: { sl3: "$.data.id" }
            - call: "POST /properties/${p1}/supply-lines"
              payload: { sku: "WEL-WINE", name: "Welcome wine", category: "WELCOME", unit_cost_cents: 900, par_qty: 1, unit: "BOTTLE", initial_on_hand_qty: 1 }
              as: PlatformAdmin
              captures: { sl4: "$.data.id" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner C", home_zone_code: "ZONE_A", skill_level: 4, max_daily_turnovers: 3, initial_quality_score: 92.00 }
              as: PlatformAdmin
              captures: { cc: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z", party_size: 2 }
              as: Coordinator
              captures: { b_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z", party_size: 2 }
              as: Coordinator
              captures: { b_in: "$.data.id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "${b_in}" }
              as: Coordinator
              captures: { t1: "$.data.id", t1_v: "$.data.version" }
            - call: "POST /turnovers/${t1}/assign"
              payload: { expected_turnover_version: "${t1_v}", cleaner_id: "${cc}" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { a1: "$.data.id" }
            - call: "POST /assignments/${a1}/accept"
              payload: {}
              as: Cleaner
              as_user_id: "${cc}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${b_out}/checkout"
              payload: {}
              as: Coordinator
            - call: "POST /turnovers/${t1}/start"
              payload: {}
              as: Cleaner
              as_user_id: "${cc}"
            - call: "GET /turnovers/${t1}/checklist-tasks"
              payload: {}
              as: Cleaner
              as_user_id: "${cc}"
              captures: { ck_strip: "$.data[0].id", ck_bath: "$.data[1].id", ck_bed: "$.data[2].id", ck_restock: "$.data[3].id" }
            - call: "POST /checklist-tasks/${ck_strip}/submit"
              payload: { note: "linens stripped" }
              as: Cleaner
              as_user_id: "${cc}"
            - call: "POST /checklist-tasks/${ck_bath}/submit"
              payload: { photo_uri: "https://ph/bath.jpg" }
              as: Cleaner
              as_user_id: "${cc}"
            - call: "POST /checklist-tasks/${ck_bed}/submit"
              payload: { photo_uri: "https://ph/bed.jpg" }
              as: Cleaner
              as_user_id: "${cc}"
            - call: "POST /checklist-tasks/${ck_restock}/submit"
              payload: { photo_uri: "https://ph/restock.jpg", restock_entries: [{ supply_line_id: "${sl1}", qty_used: 1 }, { supply_line_id: "${sl2}", qty_used: 1 }, { supply_line_id: "${sl3}", qty_used: 1 }, { supply_line_id: "${sl4}", qty_used: 1 }] }
              as: Cleaner
              as_user_id: "${cc}"
            - call: "POST /checklist-tasks/${ck_strip}/review"
              payload: { action: "APPROVE" }
              as: Coordinator
              as_user_id: "coord-2"
            - call: "POST /checklist-tasks/${ck_bath}/review"
              payload: { action: "APPROVE" }
              as: Coordinator
              as_user_id: "coord-2"
            - call: "POST /checklist-tasks/${ck_bed}/review"
              payload: { action: "APPROVE" }
              as: Coordinator
              as_user_id: "coord-2"
            - call: "POST /checklist-tasks/${ck_restock}/review"
              payload: { action: "APPROVE" }
              as: Coordinator
              as_user_id: "coord-2"
          trigger:
            - call: "GET /turnovers/${t1}/pay-preview"
              payload: {}
              as: Coordinator
              captures: { prov_net: "$.data.net_cents", prov_linen: "$.data.linen_units" }
            - call: "POST /turnovers/${t1}/complete"
              payload: { completion_note: "done" }
              as: Cleaner
              as_user_id: "${cc}"
            - call: "GET /pay-lines"
              payload: { turnover_id: "${t1}" }
              as: Coordinator
              captures: { pay_net: "$.data[0].net_cents", pay_linen: "$.data[0].linen_units" }
          assert:
            - "pay-preview before completion: PayLine.variant == PROVISIONAL"
            - "${prov_linen} == 14 and PayLine.linen_adder_cents == 1680"
            - "${prov_net} == 12554 (size_base 8325 + rush 1249 + linen 1680 = gross 11254, bonus 1300, penalty 0)"
            - "${pay_linen} == 2 and PayLine.linen_adder_cents == 240"
            - "${pay_net} == 11114 (gross 9814 + bonus 1300 - penalty 0)"
            - "${pay_net} - ${prov_net} == -1440"
            - "PayLine.${t1}.variant == FINAL and PayLine.status == FINAL"
            - "Cleaner.${cc}.pending_payout_cents == 11114"

      - name: quality_variant_divergence_blended_vs_audit_only_same_audit_score
        grounds:
          - calculations.cleaner_quality_score_recompute
          - entities.QualityAudit.fields.variant_applied
          - entities.QualityAudit.fields.observed_score
          - entities.Cleaner.fields.quality_score
          - state_machines.QualityAudit.SAMPLED_to_FINALIZED
        distinguishing_aspect: |
          Two audits carrying the identical score 88 against two cleaners both seeded at
          quality_score 92.00 diverge purely on whether the audited turnover has an incoming
          booking with a landed cleanliness_rating: BLENDED yields observed_score 84.80 and
          resulting_quality_score 89.84, AUDIT_ONLY yields 88.00 and 90.80.
        test_recipe:
          setup:
            - "Clock advanced to 2026-08-08T16:00:00Z."
            - "Property P1 as above (TWO_BR, ZONE_A) with its four supply lines; property P1B 'AUS-102' STUDIO, ZONE_A, min_skill_level 1, no supply lines."
            - "Cleaner CA and cleaner CB, both home ZONE_A, skill_level 4, initial_quality_score 92.00."
            - "T1 on P1 has both an outgoing (OUT-1) and an incoming (IN-1) booking and is COMPLETED by CA."
            - "T2 on P1B has only an outgoing booking OUT-2 (checkout 2026-08-08T16:00Z), so it is a VACANT_GAP turnover with no incoming booking, and is COMPLETED by CB after its single RESTOCK task is WAIVED from PENDING."
            - "The guest of IN-1 files cleanliness_rating 4 at 2026-08-08T21:00Z, before either audit is finalized; no rating can exist for T2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
