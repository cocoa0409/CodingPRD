      - name: corner_missing_or_unknown_role_header_is_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations.priority_1
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers and a request carrying the undeclared role YardHostler both return ERR_UNAUTHENTICATED 401 — not 403 — because priority 1 precedes the role-membership check at priority 2."
        test_recipe:
          setup:
            - "One center exists so the target route is otherwise operable."
            - "The first trigger call is sent with NO X-User-Role and NO X-User-ID header; the second carries X-User-Role: YardHostler, a value absent from §1.7."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
          trigger:
            - call: "GET /vpc/processing-centers/${center_id}"
              payload: {}
              as: NONE
              captures: { no_header_error: $.data.error_id }
            - call: "GET /vpc/processing-centers/${center_id}"
              payload: {}
              as: YardHostler
              captures: { unknown_role_error: $.data.error_id }
          assert:
            - "${no_header_error} == ERR_UNAUTHENTICATED with HTTP 401"
            - "${unknown_role_error} == ERR_UNAUTHENTICATED with HTTP 401 (an undeclared role is not authenticated, not merely forbidden)"
            - "The same GET as PortOperationsPlanner returns HTTP 200 with data.port_code == USNPT"

      - name: corner_declared_role_outside_the_endpoint_list_is_forbidden
        claim_type: error_triggerable
        grounds:
          - validations.priority_2
          - errors.ERR_FORBIDDEN_ROLE
          - endpoints.POST_/vpc/vessels
        distinguishing_aspect: "AccessoryTechnician — a declared role, but absent from the POST /vpc/vessels role list — receives ERR_FORBIDDEN_ROLE 403 and no Vessel row is created."
        test_recipe:
          setup:
            - "One center and one berth exist."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
            - call: "POST /vpc/berths"
