          - validations[priority=37]
          - validations[priority=39]
        distinguishing_aspect: "The two referential gates fire on different rows of the same request: with the change request still IN_REVIEW the answer is ERR_CHANGE_REQUEST_NOT_APPROVED, and once it is APPROVED a PENDING asset of the correct product yields ERR_MEDIA_ASSET_NOT_APPROVED (priority 38 passes because the product matches)."
