            - "South's schedule compliance score is 95 (two home games, no away games), and South has been awarded a FY2027 basketball championship at the Northfield Dome that is still SCHEDULED."
            - "A WITHDRAW membership action against North proposed by u_com_1 has been approved by a 30000-to-10000 weighted vote."
