  - section: errors
    instances:
      - name: unknown_path_ids_return_the_entity_specific_not_found_error
        claim_type: error_triggerable
        grounds:
          - validations.priority_3_existence
          - errors.ERR_BANK_NOT_FOUND
          - errors.ERR_BENEFICIARY_NOT_FOUND
          - errors.ERR_AMENDMENT_NOT_FOUND
          - errors.ERR_PRESENTATION_NOT_FOUND
          - errors.ERR_WAIVER_REQUEST_NOT_FOUND
          - errors.ERR_SETTLEMENT_CLAIM_NOT_FOUND
          - errors.ERR_SCREENING_CHECK_NOT_FOUND
        distinguishing_aspect: |
          Seven endpoints are addressed with the same unknown id string and each
          must answer 404 with the error_id belonging to ITS OWN entity type - not
          one shared ERR_NOT_FOUND and not a 422. The path id is resolved before
          any payload is looked at, so the writes carry deliberately harmless
          payloads and still get the 404.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z. The store is otherwise empty, so no id resolves."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
          trigger:
            - call: "GET /banks/no_such_bank"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { e_bank: $.data.error_id }
            - call: "GET /beneficiaries/no_such_beneficiary"
              payload: {}
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { e_ben: $.data.error_id }
            - call: "POST /amendments/no_such_amendment/issue"
              payload: { issue_note: "nothing to issue" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { e_amd: $.data.error_id }
            - call: "GET /presentations/no_such_presentation"
              payload: {}
              as: DocumentExaminer
              as_user_id: "dx_1"
              captures: { e_pres: $.data.error_id }
            - call: "POST /waiver-requests/no_such_waiver/respond"
              payload: { decision: "GRANT", applicant_note: "nothing to waive" }
              as: ApplicantUser
              as_user_id: "no_such_applicant"
              captures: { e_wr: $.data.error_id }
            - call: "POST /settlement-claims/no_such_claim/settle"
              payload: { settlement_note: "nothing to settle" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { e_claim: $.data.error_id }
            - call: "POST /screening-checks/no_such_check/review"
              payload: { decision: "RELEASE", review_note: "nothing to review" }
              as: ComplianceOfficer
              as_user_id: "cmp_1"
              captures: { e_chk: $.data.error_id }
          assert:
            - "every trigger call returns HTTP 404"
            - "${e_bank} == ERR_BANK_NOT_FOUND"
            - "${e_ben} == ERR_BENEFICIARY_NOT_FOUND"
            - "${e_amd} == ERR_AMENDMENT_NOT_FOUND"
            - "${e_pres} == ERR_PRESENTATION_NOT_FOUND"
            - "${e_wr} == ERR_WAIVER_REQUEST_NOT_FOUND"
            - "${e_claim} == ERR_SETTLEMENT_CLAIM_NOT_FOUND"
            - "${e_chk} == ERR_SCREENING_CHECK_NOT_FOUND"
            - "every error response carries response_type \"error\" with data.error_id and data.message and no other data keys"

      - name: uniqueness_clock_and_facility_reinstate_guards_are_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DUPLICATE_KEY
          - errors.ERR_CLOCK_REGRESSION
          - errors.ERR_FACILITY_STILL_RESTRICTED
          - state_machines.CreditFacility.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Three unrelated guards fire in one recipe. A second bank with the same
          swift_bic is 409 ERR_DUPLICATE_KEY, not 422. Rewinding the clock from
          2026-08-10 to 2026-08-01 is 422 ERR_CLOCK_REGRESSION and the clock must
          not move. And a facility that the system itself suspended for breaching
          restrict_threshold_cents (19050000 against a threshold of 19000000)
          cannot be talked back to ACTIVE by a CreditOfficer: REINSTATE returns
          409 ERR_FACILITY_STILL_RESTRICTED because suspended_reason is
          RESTRICT_THRESHOLD_BREACH rather than MANUAL_SUSPENSION - only releasing
          exposure clears it.
