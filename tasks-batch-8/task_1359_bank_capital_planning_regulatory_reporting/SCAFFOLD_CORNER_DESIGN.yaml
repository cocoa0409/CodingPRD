              as: CapitalAnalyst
            - call: "POST /banks/${b}/reporting-periods/${p2}/risk-exposures"
              payload: { reporting_period_id: "${p2}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
