              as: Brewer
              as_user_id: "${af_id}"
              captures: { af_plain_recipe_id: $.data.id }
            - call: "POST /brewer-recipes"
              payload: { brewer_id: "${af_id}", malt_product_id: "${af_prod_id}", yeast_strain_id: "${af_strain_id}", name: "Corn Lager", batch_volume_bbl: 30.0, original_gravity_plato: 12.50, target_color_lovibond: 2.50, target_extract_pct: 80.00, target_protein_pct: 11.00, requested_pitch_rate_million_cells_per_ml_per_plato: 0.75, adjunct_pct: 25.0 }
              as: Brewer
              as_user_id: "${af_id}"
              captures: { af_adjunct_recipe_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${af_prod_id}", lot_code: "LOT-AF-1", quantity_lbs: 5000 }
