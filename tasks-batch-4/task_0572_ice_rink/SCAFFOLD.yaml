  - method: POST
    path: "/ice-slots/{id}/slot-bookings"
    description: "Book a slot for private rental / broomball / party; computes quoted_cents and charges wallet"
    roles: [Skater, RinkManager]
    code: 201
    input: [skater_id, booking_type, "includes_resurface?", "base_fee_cents?", "per_guest_cents?", "guest_count_booked?", "guest_count_final?", "tax_rate?"]
    output: SlotBooking
    side_effects: ["quoted_cents computed; wallet -= quoted_cents; captured_cents = quoted_cents"]
  - method: GET
    path: "/slot-bookings/{id}"
    description: "Fetch a slot booking"
    roles: [RinkManager, FrontDesk, Skater]
    code: 200
    input: []
    output: SlotBooking
  - method: GET
    path: "/slot-bookings"
    description: "List slot bookings, filterable (reverse-reachability for ice_slot_id, skater_id)"
    roles: [RinkManager, FrontDesk, Skater]
    code: 200
    input: ["ice_slot_id?", "skater_id?", "booking_type?", "status?", "limit?", "offset?"]
    output: SlotBooking[]
  - method: POST
    path: "/slot-bookings/{id}/complete"
    description: "Complete a booking after slot end; PARTY recomputes final on guest_count_final"
    roles: [RinkManager]
    code: 200
    input: ["guest_count_final?"]
    output: SlotBooking
    side_effects: ["final_cents computed; wallet adjusted by (final_cents - captured_cents); captured_cents = final_cents; status=COMPLETED; increments version"]
  - method: POST
    path: "/slot-bookings/{id}/cancel"
    description: "Cancel a booking; refunds captured_cents"
    roles: [Skater, RinkManager]
    code: 200
    input: []
    output: SlotBooking
    side_effects: ["wallet += captured_cents; captured_cents = 0; status=CANCELLED; increments version"]

  - method: POST
    path: "/sharpening-orders"
    description: "Submit a skate-sharpening order; computes queue_position"
    roles: [Skater, FrontDesk]
    code: 201
    input: [skater_id, skate_type, price_cents]
    output: SharpeningOrder
    side_effects: ["queue_position computed from live queue"]
  - method: GET
    path: "/sharpening-orders/{id}"
    description: "Fetch a sharpening order (includes queue_position)"
    roles: [RinkManager, FrontDesk, Skater]
    code: 200
    input: []
    output: SharpeningOrder
  - method: GET
    path: "/sharpening-orders"
    description: "List sharpening orders, filterable (reverse-reachability for skater_id)"
    roles: [RinkManager, FrontDesk, Skater]
    code: 200
    input: ["skater_id?", "status?", "limit?", "offset?"]
    output: SharpeningOrder[]
  - method: POST
    path: "/sharpening-orders/{id}/advance"
    description: "Advance one step RECEIVED->IN_PROGRESS->READY->PICKED_UP; moving to READY leaves the queue"
    roles: [FrontDesk]
    code: 200
    input: []
    output: SharpeningOrder
    side_effects: ["status advances one step; on ->READY, later orders' queue_position recomputed; increments version"]

# =====================================================================
# 1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted, or Skater acting on a resource it does not own (X-User-ID != skater_id)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource (by path id or FK body field) does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state permitting the requested transition (wrong slot status/purpose, class not OPEN, league not REGISTRATION_OPEN, subscription not in required state, advance-cycle before cycle end, etc.)"
  - id: ERR_PREREQUISITE_NOT_MET
    http: 422
    condition: "Enrolling in a class whose prerequisite_class_id the skater has not COMPLETED"
  - id: ERR_SLOT_OVERLAP
    http: 409
    condition: "Publishing an ice slot whose buffered window collides with another non-terminal slot on the same rink"
  - id: ERR_LOCKER_OCCUPIED
    http: 409
    condition: "Locker season range collides with an existing ACTIVE assignment on the same rink and locker_number"
  - id: ERR_CAPACITY_FULL
    http: 409
    condition: "Public-skate capacity, class capacity, or league roster is full; or locker_number outside 1..locker_count"
  - id: ERR_NO_RENTAL_SKATES
    http: 409
    condition: "Rental admission requested but no rental skates available on the rink"
  - id: ERR_INSUFFICIENT_FUNDS
    http: 402
    condition: "Skater wallet credit is less than the required charge"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_enrollment_version does not match Enrollment.version"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, invalid enum, end<=start, negative amount, pagination out of 1..100"

# =====================================================================
# 1.7 RBAC Matrix
# =====================================================================
roles:
  - name: RinkManager
    description: "Operations manager; superset operator role for scheduling, catalog, billing, and overrides"
    identity: "opaque"
    exclusive_operations:
      - "create/publish/unpublish/cancel/complete ice slots"
      - "create rinks, classes, leagues; wallet adjustments"
      - "advance-cycle; complete enrollments; start/cancel leagues; complete slot bookings"
      - "set logical clock"
    shared_operations:
      - "enroll, register, book, assign lockers, create tuition subscriptions, cancel/refund (may act on behalf of any skater)"
  - name: FrontDesk
    description: "Desk staff for admissions, refunds, sharpening intake"
    identity: "opaque"
    exclusive_operations:
      - "advance sharpening orders"
      - "refund admissions"
    shared_operations:
      - "register skaters; admit to public skate; submit sharpening orders; read resources"
  - name: Skater
    description: "A registered customer acting on their own resources"
    identity: "entity_backed:Skater"
    exclusive_operations: []
    shared_operations:
      - "admit self; enroll self; create own tuition subscription; pay/cancel own subscription; register self for leagues; assign/release own lockers; book own slots; submit/read own sharpening orders; read own resources"
