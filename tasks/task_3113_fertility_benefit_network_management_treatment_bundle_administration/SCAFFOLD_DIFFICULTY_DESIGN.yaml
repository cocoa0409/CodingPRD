              captures: { e19: $.data.id }
            - call: "POST /bundle-entitlements"
              payload: { employer_account_id: "${e19}", bundle_type: "IVF_RETRIEVAL_TRANSFER", lifetime_max_cycles: 6, max_cycles_per_year: 6, max_transfers_per_cycle: 2, pharmacy_pool_cents: 1000000, copay_max: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { b19: $.data.id }
            - call: "POST /bundle-entitlements/${b19}/activate"
              payload: {}
              as: PlanAdministrator
            - call: "POST /care-advocates"
              payload: { full_name: "A19", states_licensed: ["TX"], specializations: ["STANDARD_IVF"], caseload_limit: 5, credentials_expire_on: "2027-12-31T00:00:00Z" }
              as: PlanAdministrator
              captures: { adv19: $.data.id }
            - call: "POST /members"
              payload: { employer_account_id: "${e19}", external_ref: "M25", full_name: "M25", state_code: "TX", required_track: "STANDARD_IVF" }
              as: CareAdvocate
              captures: { m25: $.data.id }
            - call: "POST /members/${m25}/assign-advocate"
              payload: { allocation_strategy: "ROUND_ROBIN" }
              as: NetworkManager
            - call: "POST /members/${m25}/complete-intake"
              payload: {}
              as: CareAdvocate
              as_user_id: "${adv19}"
            - call: "POST /clinics"
              payload: { legal_name: "C19", npi: "1000000019", state_code: "TX", network_tier: "PREFERRED", min_live_birth_rate_bps: 6000, max_multiple_birth_rate_bps: 10000, required_quality_report_count: 0, maturity_report_threshold: 1, bundles_offered: ["IVF_RETRIEVAL_TRANSFER"] }
              as: NetworkManager
              captures: { c19: $.data.id }
            - call: "POST /clinics/${c19}/contracts"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", bundle_rates: { IVF_RETRIEVAL_TRANSFER: 1450000 } }
              as: NetworkManager
              captures: { ct19: $.data.id }
            - call: "GET /clinics/${c19}"
              payload: {}
              as: NetworkManager
              captures: { c19v: $.data.version }
            - call: "POST /clinic-contracts/${ct19}/activate"
              payload: { expected_clinic_version: "${c19v}" }
              as: NetworkManager
            - call: "POST /treatment-plans"
              payload: { member_id: "${m25}", bundle_entitlement_id: "${b19}", pathway_type: "STANDARD_IVF", planned_cycles: 1 }
              as: CareAdvocate
              as_user_id: "${adv19}"
              captures: { p21: $.data.id }
            - call: "GET /members/${m25}"
              payload: {}
              as: CareAdvocate
              as_user_id: "${adv19}"
              captures: { m25v: $.data.version }
            - call: "POST /treatment-plans/${p21}/select-clinic"
              payload: { clinic_id: "${c19}", expected_member_version: "${m25v}" }
              as: CareAdvocate
              as_user_id: "${adv19}"
              captures: { p21v: $.data.version }
            - call: "POST /treatment-plans/${p21}/preauthorizations"
              payload: { cycle_sequence_index: 1, criteria_inputs: { age_years: 33, amh_ng_ml: 2.0, prior_cycles: 0, prior_live_birth: false, fsh_iu_l: 6 }, member_cost_share_pct: 20 }
              as: CareAdvocate
