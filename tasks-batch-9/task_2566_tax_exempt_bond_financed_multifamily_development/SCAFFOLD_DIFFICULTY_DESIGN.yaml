          setup:
            - "Canonical fixture through bond issuance with draw 1 funded, so the project is UNDER_CONSTRUCTION."
            - "Twelve contiguous operating months recorded: month_index 1-9 with noi_cents 15000000 and debt_service_cents 15000000, month_index 10-12 with noi_cents 18000000 and debt_service_cents 15000000; occupied_units 9 in every month."
