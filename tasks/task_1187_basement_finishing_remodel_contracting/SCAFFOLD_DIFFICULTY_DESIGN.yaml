            - { call: "POST /api/subcontractors", payload: { name: "Pipe Co", trade: "PLUMBING" }, as: PlatformAdmin, captures: { sub2: $.data.id } }
            - { call: "POST /api/subcontractors", payload: { name: "Wire2 Co", trade: "ELECTRICAL" }, as: PlatformAdmin, captures: { sub3: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "18 R St", basement_sqft: 1100, base_contract_cents: 6500000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /api/projects/${proj_id}/moisture-assessments", payload: { slab_moisture_lbs: 2.0, interior_rh_pct: 50, efflorescence_observed: false, grading_deficit: false, egress_windows_existing: 1, ceiling_height_in: 86 }, as: Contractor, as_user_id: "${ctr_id}", captures: { ma_id: $.data.id } }
            - { call: "POST /api/moisture-assessments/${ma_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/projects/${proj_id}/design-packages", payload: { layout_notes: "full finish", mechanical_relocations: [] }, as: Contractor, as_user_id: "${ctr_id}", captures: { dp_id: $.data.id } }
            - { call: "POST /api/design-packages/${dp_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/design-packages/${dp_id}/approve", payload: {}, as: Homeowner, as_user_id: "${ho_id}" }
            - { call: "POST /api/projects/${proj_id}/permits", payload: { bedroom_count: 0, windows: [], ceiling_height_in: 86, finished_area_sqft: 1100, low_area_sqft: 100, prohibited_area_sqft: 0 }, as: Contractor, as_user_id: "${ctr_id}", captures: { pm_id: $.data.id } }
            - { call: "POST /api/permits/${pm_id}/submit", payload: {}, as: Contractor, as_user_id: "${ctr_id}" }
            - { call: "POST /api/permits/${pm_id}/record-decision", payload: { outcome: "ISSUED" }, as: Inspector }
            - { call: "POST /api/projects/${proj_id}/work-phases", payload: { trade: "FRAMING", zone: "Z1", start_date: "2026-06-01", end_date: "2026-06-10", crew_count: 2, subcontractor_id: "${sub1}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { wp_a: $.data.id } }
            - { call: "POST /api/projects/${proj_id}/work-phases", payload: { trade: "PLUMBING", zone: "Z2", start_date: "2026-06-05", end_date: "2026-06-12", crew_count: 2, subcontractor_id: "${sub2}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { wp_b: $.data.id } }
          trigger:
            - { call: "POST /api/projects/${proj_id}/work-phases", payload: { trade: "ELECTRICAL", zone: "Z3", start_date: "2026-06-06", end_date: "2026-06-08", crew_count: 1, subcontractor_id: "${sub3}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { err: $.data.error_id } }
            - { call: "POST /api/projects/${proj_id}/work-phases", payload: { trade: "ELECTRICAL", zone: "Z3", start_date: "2026-06-12", end_date: "2026-06-20", crew_count: 1, subcontractor_id: "${sub3}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { wp_c: $.data.id } }
          assert:
            - "phases A+B coexist (sum exactly 4 on shared dates — cap is inclusive)"
            - "phase C over [2026-06-06,2026-06-08) rejected with ERR_CREW_CAPACITY_EXCEEDED (sum would be 5)"
            - "phase D over [2026-06-12,2026-06-20) accepted (A and B intervals both ended — half-open ends exclusive)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: allowance_reserve_release_conservation
        grounds:
          - entities.AllowanceLine.fields.remaining_cents
          - state_machines.ChangeOrder.PROPOSED_to_REJECTED
          - state_machines.ChangeOrder.PROPOSED_to_SUPERSEDED
          - calculations.change_order_pricing
        distinguishing_aspect: |
          Conserved quantity ALLOWANCE_REMAINING: forward action (change-order
          creation reserving a 30,000-cent draw drops remaining to 70,000) paired
          with its compensating action (rejection releasing the reservation)
          restores remaining_cents to exactly 100,000 and preserves
          budgeted == reserved + drawn + actual + remaining. Sibling conserves a
          different quantity (CONTRACT_PRICE composition).
        test_recipe:
          setup:
            - "Project INTAKE base 5000000 with AllowanceLine FIXTURES budgeted 100000; project version captured after line creation"
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC Seventeen", license_no: "LIC-17" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H S", email: "hs@x.com", phone: "19" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "19 S St", basement_sqft: 750, base_contract_cents: 5000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /api/projects/${proj_id}/allowance-lines", payload: { name: "FIXTURES", budgeted_cents: 100000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { al_id: $.data.id, rem0: $.data.remaining_cents } }
            - { call: "GET /api/projects/${proj_id}", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_v: $.data.version } }
          trigger:
            - { call: "POST /api/projects/${proj_id}/change-orders", payload: { scope_description: "add vanity fixture", kind: "ADD", scope_items: [{ description: "vanity set", qty: 20, unit_cost_cents: 1500 }], allowance_draws: [{ allowance_line_id: "${al_id}", amount_cents: 30000 }], expected_project_version: "${proj_v}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { co_id: $.data.id, co_delta: $.data.price_delta_cents } }
            - { call: "GET /api/projects/${proj_id}/allowance-lines", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { rem_reserved: "$.data[0].remaining_cents", res_reserved: "$.data[0].reserved_cents" } }
            - { call: "POST /api/change-orders/${co_id}/reject", payload: { reason: "too pricey" }, as: Homeowner, as_user_id: "${ho_id}" }
            - { call: "GET /api/projects/${proj_id}/allowance-lines", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { rem_final: "$.data[0].remaining_cents", res_final: "$.data[0].reserved_cents", drawn_final: "$.data[0].drawn_cents" } }
          assert:
            - "initial remaining_cents == 100000"
            - "ChangeOrder.${co_id}.price_delta_cents == 4500 (round_half_up(20*1500*1.15)=34500 minus 30000 draw)"
            - "while PROPOSED: reserved_cents == 30000 and remaining_cents == 70000"
            - "after reject: reserved_cents == 0, drawn_cents == 0, remaining_cents == 100000 — invariant budgeted(100000) == reserved(0)+drawn(0)+actual(0)+remaining(100000) restored"

      - name: contract_price_debit_credit_conservation
        grounds:
          - calculations.project_price
          - calculations.change_order_pricing
          - state_machines.ChangeOrder.PROPOSED_to_APPROVED
          - entities.Project.fields.contract_price_cents
        distinguishing_aspect: |
          Conserved quantity CONTRACT_PRICE composition: approving an ADD order
          (+234 cents) followed by a CREDIT order (-234 cents, same scope items)
          returns contract_price_cents to exactly base_contract_cents, preserving
          contract_price == base + sum(APPROVED deltas). Sibling conserves the
          allowance sub-ledger, a different quantity.
        test_recipe:
          setup:
            - "Project INTAKE base 5000000 with no allowance lines (price_variant FINAL); version re-captured before each change-order create"
          setup_api_calls:
            - { call: "POST /api/contractors", payload: { name: "GC Eighteen", license_no: "LIC-18" }, as: PlatformAdmin, captures: { ctr_id: $.data.id } }
            - { call: "POST /api/homeowners", payload: { name: "H T", email: "ht@x.com", phone: "20" }, as: Contractor, as_user_id: "${ctr_id}", captures: { ho_id: $.data.id } }
            - { call: "POST /api/projects", payload: { homeowner_id: "${ho_id}", address: "20 T St", basement_sqft: 780, base_contract_cents: 5000000 }, as: Contractor, as_user_id: "${ctr_id}", captures: { proj_id: $.data.id, v0: $.data.version } }
          trigger:
            - { call: "POST /api/projects/${proj_id}/change-orders", payload: { scope_description: "add pot light + outlet", kind: "ADD", scope_items: [{ description: "pot light", qty: 1, unit_cost_cents: 101 }, { description: "outlet", qty: 1, unit_cost_cents: 103 }], allowance_draws: [], expected_project_version: "${v0}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { co1: $.data.id, d1: $.data.price_delta_cents } }
            - { call: "POST /api/change-orders/${co1}/approve", payload: {}, as: Homeowner, as_user_id: "${ho_id}" }
            - { call: "GET /api/projects/${proj_id}", payload: {}, as: Contractor, as_user_id: "${ctr_id}", captures: { price_mid: $.data.contract_price_cents, v_mid: $.data.version } }
            - { call: "POST /api/projects/${proj_id}/change-orders", payload: { scope_description: "remove pot light + outlet", kind: "CREDIT", scope_items: [{ description: "pot light removal", qty: 1, unit_cost_cents: 101 }, { description: "outlet removal", qty: 1, unit_cost_cents: 103 }], allowance_draws: [], expected_project_version: "${v_mid}" }, as: Contractor, as_user_id: "${ctr_id}", captures: { co2: $.data.id, d2: $.data.price_delta_cents } }
            - { call: "POST /api/change-orders/${co2}/approve", payload: {}, as: Homeowner, as_user_id: "${ho_id}" }
