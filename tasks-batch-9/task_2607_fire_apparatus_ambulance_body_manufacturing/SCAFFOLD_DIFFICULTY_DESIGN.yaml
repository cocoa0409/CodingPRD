              captures: { r1_id: $.data.id }
            - call: "GET /slot-lines/${line_id}"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", slot_start_date: "2026-09-15T00:00:00Z", slot_end_date: "2026-09-29T00:00:00Z", reserved_price_cents: 30000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${v1}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", slot_start_date: "2026-09-21T00:00:00Z", slot_end_date: "2026-10-05T00:00:00Z", reserved_price_cents: 30000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${v1}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", slot_start_date: "2026-08-01T00:00:00Z", slot_end_date: "2026-08-26T00:00:00Z", reserved_price_cents: 30000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${v1}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", slot_start_date: "2026-08-01T00:00:00Z", slot_end_date: "2026-08-25T00:00:00Z", reserved_price_cents: 30000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${v1}" }
              as: ProgramAdmin
