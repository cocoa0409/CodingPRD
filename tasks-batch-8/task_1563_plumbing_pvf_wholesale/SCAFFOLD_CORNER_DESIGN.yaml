  - section: cross_cutting_layers
    instances:
      - name: occ_stale_quote_revision_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[quote-revision-stale-quote]"
        distinguishing_aspect: "OCC on Quote.version: after award bumps the version, a revision request carrying the pre-award version is rejected ERR_STALE_QUOTE_VERSION 412 while the quote is still legitimately AWARDED (pure stale-version rejection, not a state error)."
        test_recipe:
          setup: ["quote submitted (v2) and awarded (v3); the pre-award version 2 is stale"]
          setup_api_calls:
            - { call: "POST /pvf/branches", payload: { name: "Main", code: "M1" }, as: BranchManager, captures: { b: $.data.id } }
            - { call: "POST /pvf/products", payload: { sku: "P1", description: "PVC pipe", category: "PIPE", list_price_cents: 10000, cost_cents: 5000, manufacturer_name: "Acme", cubes_per_unit: 10 }, as: BranchManager, captures: { p1: $.data.id } }
            - { call: "POST /pvf/contractor-accounts", payload: { company_name: "GC Corp", pricing_tier: "GOLD", terms: "NET_30", credit_limit_cents: 10000000 }, as: InsideSales, captures: { acct: $.data.id } }
            - { call: "POST /pvf/quotes", payload: { account_id: "${acct}", branch_id: "${b}", job_name: "J", valid_until: "2026-12-31T00:00:00Z", lines: [ { product_id: "${p1}", qty: 1, unit_price_cents: 9000 } ] }, as: InsideSales, captures: { q: $.data.id } }
            - { call: "POST /pvf/quotes/${q}/submit", payload: {}, as: InsideSales }
            - { call: "POST /pvf/quotes/${q}/award", payload: {}, as: Contractor, as_user_id: "${acct}", captures: { qv: $.data.version } }
          trigger:
            - call: "POST /pvf/quotes/${q}/revisions"
              payload: { expected_quote_version: "${qv} - 1", valid_until: "2027-01-31T00:00:00Z" }
              as: InsideSales
              captures: { err: $.data.error_id }
            - call: "POST /pvf/quotes/${q}/revisions"
              payload: { expected_quote_version: "${qv}", valid_until: "2027-01-31T00:00:00Z" }
              as: InsideSales
              captures: { q2: $.data.id }
          assert:
            - "stale version (${qv} - 1): error_id == ERR_STALE_QUOTE_VERSION with http 412"
            - "current version (${qv}): 201 success — proves the 412 was the version check, not state"

      - name: occ_stale_booking_rejected
        claim_type: optimistic_concurrency
        grounds:
