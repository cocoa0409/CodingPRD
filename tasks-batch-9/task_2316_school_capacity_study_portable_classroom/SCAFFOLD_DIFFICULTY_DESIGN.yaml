  # =========================================================================
  # RULE 9 - compensating_invariant
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: capital_budget_partition_restored_on_withdrawal
        grounds:
          calculations: [budget_partition]
          state_machines: [PlacementRequest]
          entities: [CapitalBudget, PlacementRequest, PortableUnit, PlacementSite]
          endpoints: ["POST /facilities/permits/{id}/decision", "POST /facilities/placement-requests/{id}/withdraw"]
        invariant: "CapitalBudget.authorized_cents == uncommitted_cents + encumbered_cents + expended_cents, and encumbered_cents equals the sum of encumbered_cost_cents over PlacementRequests in PERMITTED, SCHEDULED or INSTALLING status against that budget"
        compensating_pair:
          forward: "the permit join moving the request to PERMITTED encumbers 7,741,440 cents: uncommitted falls to 492,258,560 and encumbered rises to 7,741,440"
          reverse: "POST /facilities/placement-requests/{id}/withdraw releases exactly the stored encumbered_cost_cents: encumbered returns to 0 and uncommitted returns to 500,000,000"
        distinguishing_aspect: >
          The three-way money partition must hold before the encumbrance, while it
          is held, and after it is released, and the released amount must be read
          from the request's own stored encumbered_cost_cents rather than
          recomputed. The request keeps its 7,741,440 cent estimate after
          withdrawal while its encumbered_cost_cents drops to zero, so an
          implementation that releases the estimate, or that recomputes the cost at
          withdrawal time, leaves the partition off by the difference. Withdrawing
          twice must not release twice: the second attempt is rejected on state and
          the budget is unchanged.
