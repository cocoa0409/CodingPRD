# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1269: College & Career Readiness Advising
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and ships an executable
# setup_api_calls chain (empty-DB -> precondition state) + trigger + asserts.
# Logical clock default: 2026-05-01T00:00:00Z unless a chain sets it.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (3 instances, 3 different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: plan_alignment_provisional_vs_official
        grounds:
          - calculations.plan_alignment
          - calculations.plan_readiness_score
          - entities.StudentPlan.fields.alignment_provisional_pct
          - entities.StudentPlan.fields.alignment_official_pct
        distinguishing_aspect: |
          StudentPlan-domain dual variant: with MATH101 COMPLETED and ENG101 merely
          PLANNED, the identical enrollment set yields alignment_provisional_pct ==
          100.0 but alignment_official_pct == 50.0 (inclusion set is the only
          difference); grounded separately from the Application- and Advisor-domain
          variants below.
        test_recipe:
          setup:
            - "Advisor A; pathway STEM requires [MATH101, ENG101], no cert, 0 hours"
            - "Grade-12 student assigned to A; plan created and ACTIVE"
            - "MATH101 enrollment COMPLETED (grade A); ENG101 enrollment PLANNED"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "A One", email: "a1@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "STEM", name: "STEM", required_course_codes: ["MATH101", "ENG101"] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "S001", full_name: "Stu One", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/students/${s_id}/enrollments", payload: { plan_id: "${pl_id}", course_code: "MATH101", term: "2026-SPRING", credits: 4 }, as: Advisor, as_user_id: "${ad_id}", captures: { en1: $.data.id } }
            - { call: "POST /ccr/enrollments/${en1}/transition", payload: { to_status: "ENROLLED" }, as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/enrollments/${en1}/transition", payload: { to_status: "COMPLETED", grade: "A" }, as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/students/${s_id}/enrollments", payload: { plan_id: "${pl_id}", course_code: "ENG101", term: "2026-FALL", credits: 4 }, as: Advisor, as_user_id: "${ad_id}" }
          trigger:
            - { call: "GET /ccr/plans/${pl_id}", as: Advisor, as_user_id: "${ad_id}" }
          assert:
            - "StudentPlan.${pl_id}.alignment_provisional_pct == 100.0"
            - "StudentPlan.${pl_id}.alignment_official_pct == 50.0"
            - "StudentPlan.${pl_id}.readiness_provisional == 100.0"
            - "StudentPlan.${pl_id}.readiness_official == 85.0"

      - name: milestone_pct_strict_vs_lenient
        grounds:
          - calculations.milestone_completion_pct
          - entities.StudentPlan.fields.milestone_pct
          - entities.StudentPlan.fields.milestone_pct_lenient
        distinguishing_aspect: |
          Application-domain dual variant: with a milestone pool of 4 (2 COMPLETED,
          1 WAIVED, 1 READY), STRICT excludes the WAIVED entry from the denominator
          (2/3 -> 66.67) while LENIENT counts WAIVED as completed (3/4 -> 75.0) —
          a different entity domain and a different variant shape (denominator
          semantics) than plan_alignment's inclusion-set variant.
        test_recipe:
          setup:
            - "Advisor A; pathway TRADE with empty required_course_codes; grade-12 student; ACTIVE plan"
            - "Application (deadline 2026-06-15) auto-seeds ESSAY, TRANSCRIPT, FEE_PAYMENT (READY, required)"
            - "ESSAY and TRANSCRIPT COMPLETED; FEE_PAYMENT WAIVED by advisor; extra INTERVIEW milestone added and left READY"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "A Two", email: "a2@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "TRADE", name: "Trades", required_course_codes: [] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "S002", full_name: "Stu Two", grade_level: 12, demographic_group: "GROUP_B", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/students/${s_id}/applications", payload: { college_name: "State U", program_type: "COLLEGE_4YR", deadline_at: "2026-06-15T00:00:00Z" }, as: Student, as_user_id: "${s_id}", captures: { ap_id: $.data.id } }
            - { call: "GET /ccr/applications/${ap_id}/milestones", as: Student, as_user_id: "${s_id}", captures: { m0: "$.data[0].id", m1: "$.data[1].id", m2: "$.data[2].id" } }
            - { call: "POST /ccr/milestones/${m0}/transition", payload: { to_status: "COMPLETED" }, as: Student, as_user_id: "${s_id}" }
            - { call: "POST /ccr/milestones/${m1}/transition", payload: { to_status: "COMPLETED" }, as: Student, as_user_id: "${s_id}" }
            - { call: "POST /ccr/milestones/${m2}/transition", payload: { to_status: "WAIVED" }, as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/applications/${ap_id}/milestones", payload: { kind: "INTERVIEW", due_at: "2026-06-01T00:00:00Z" }, as: Student, as_user_id: "${s_id}" }
          trigger:
            - { call: "GET /ccr/plans/${pl_id}", as: Advisor, as_user_id: "${ad_id}" }
          assert:
            - "StudentPlan.${pl_id}.milestone_pct == 66.67 (STRICT: 2 COMPLETED / (4 - 1 WAIVED))"
            - "StudentPlan.${pl_id}.milestone_pct_lenient == 75.0 (LENIENT: 3 / 4)"
            - "STRICT and LENIENT diverge for identical milestone data"

      - name: caseload_load_simple_vs_weighted
        grounds:
          - calculations.caseload_load
          - entities.Advisor.fields.caseload_load_simple
          - entities.Advisor.fields.caseload_load_weighted
        distinguishing_aspect: |
          Advisor-domain dual variant: three ENROLLED advisees (grade 12 with no
          ACTIVE plan, grade 11 with ACTIVE plan, grade 10 with ACTIVE plan) give
          caseload_load_simple == 3 but caseload_load_weighted == 5.0
          (2.5 + 1.5 + 1.0) — a weighting variant, structurally different from the
          two inclusion-set variants above.
        test_recipe:
          setup:
            - "Advisor A (max 50); pathway GEN (no requirements)"
            - "S1 grade 12 (no plan), S2 grade 11 (ACTIVE plan), S3 grade 10 (ACTIVE plan); all assigned to A"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "A Three", email: "a3@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GEN", name: "General", required_course_codes: [] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "S101", full_name: "Senior NoPlan", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "S102", full_name: "Junior Plan", grade_level: 11, demographic_group: "GROUP_B", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s2_id: $.data.id, s2_v: $.data.version } }
            - { call: "POST /ccr/students", payload: { student_ref: "S103", full_name: "Soph Plan", grade_level: 10, demographic_group: "GROUP_C", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s3_id: $.data.id, s3_v: $.data.version } }
            - { call: "POST /ccr/students/${s2_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s2_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { p2_id: $.data.id } }
            - { call: "POST /ccr/plans/${p2_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/students/${s3_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s3_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { p3_id: $.data.id } }
            - { call: "POST /ccr/plans/${p3_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
          trigger:
            - { call: "GET /ccr/advisors/${ad_id}/equity-report", as: DistrictAdmin }
          assert:
            - "equity-report.caseload_load_simple == 3"
            - "equity-report.caseload_load_weighted == 5.0"
            - "Advisor.${ad_id}.active_caseload_count == 3"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (3 instances, modes (a), (b), (c))
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: readiness_weighted_band_formula
        grounds:
          - calculations.plan_readiness_score
          - calculations.plan_alignment
          - calculations.wbl_hours_progress
          - calculations.certification_points
        distinguishing_aspect: |
          Mode (a): readiness combines 4 inputs with a conditional weight band
          (grade_level == 12 -> 0.30/0.40/0.20/0.10), a nested min(100, ...) cap
          applied AFTER round_half_up(.,2). Fixture pins every component so both
          variants are exact literals: provisional 65.0, official 35.0.
        test_recipe:
          setup:
            - "Advisor A; pathway HEALTH requires [BIO201], required_certification_code CNA, required_work_hours 40"
            - "Grade-12 student; plan ACTIVE; BIO201 enrollment PLANNED (align prov 100 / off 0)"
            - "Application with 4 milestones (3 seeded + 1 INTERVIEW), exactly 2 COMPLETED -> milestone_pct 50.0"
            - "Placement COMPLETED with hours_logged 20 -> wbl_hours_pct 50.0"
            - "Certification OSHA PASSED (not the required CNA) -> certification_points 50"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "A Four", email: "a4@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "HEALTH", name: "Health Sciences", required_course_codes: ["BIO201"], required_certification_code: "CNA", required_work_hours: 40 }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "S201", full_name: "Stu Health", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/students/${s_id}/enrollments", payload: { plan_id: "${pl_id}", course_code: "BIO201", term: "2026-SPRING", credits: 4 }, as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/students/${s_id}/applications", payload: { college_name: "State U", program_type: "COLLEGE_4YR", deadline_at: "2026-06-15T00:00:00Z" }, as: Student, as_user_id: "${s_id}", captures: { ap_id: $.data.id } }
            - { call: "GET /ccr/applications/${ap_id}/milestones", as: Student, as_user_id: "${s_id}", captures: { m0: "$.data[0].id", m1: "$.data[1].id" } }
            - { call: "POST /ccr/milestones/${m0}/transition", payload: { to_status: "COMPLETED" }, as: Student, as_user_id: "${s_id}" }
            - { call: "POST /ccr/milestones/${m1}/transition", payload: { to_status: "COMPLETED" }, as: Student, as_user_id: "${s_id}" }
            - { call: "POST /ccr/applications/${ap_id}/milestones", payload: { kind: "INTERVIEW", due_at: "2026-06-01T00:00:00Z" }, as: Student, as_user_id: "${s_id}" }
            - { call: "POST /ccr/placement-sites", payload: { site_code: "HOSP1", name: "General Hospital", max_concurrent_placements: 10 }, as: DistrictAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /ccr/students/${s_id}/placements", payload: { site_id: "${site_id}", term_start: "2026-04-01T00:00:00Z", term_end: "2026-06-01T00:00:00Z", hours_per_week: 10 }, as: WblCoordinator, captures: { plc_id: $.data.id } }
            - { call: "POST /ccr/placements/${plc_id}/transition", payload: { to_status: "CONFIRMED" }, as: WblCoordinator }
            - { call: "POST /ccr/placements/${plc_id}/transition", payload: { to_status: "ACTIVE" }, as: WblCoordinator }
            - { call: "POST /ccr/placements/${plc_id}/transition", payload: { to_status: "COMPLETED", hours_logged: 20 }, as: WblCoordinator }
            - { call: "POST /ccr/students/${s_id}/certifications", payload: { cert_code: "OSHA" }, as: WblCoordinator, captures: { cert_id: $.data.id } }
            - { call: "POST /ccr/certifications/${cert_id}/transition", payload: { to_status: "EXAM_SCHEDULED", exam_at: "2026-05-10T09:00:00Z" }, as: WblCoordinator }
            - { call: "POST /ccr/certifications/${cert_id}/transition", payload: { to_status: "PASSED" }, as: WblCoordinator }
          trigger:
            - { call: "GET /ccr/plans/${pl_id}", as: Advisor, as_user_id: "${ad_id}" }
          assert:
            - "StudentPlan.${pl_id}.alignment_provisional_pct == 100.0"
            - "StudentPlan.${pl_id}.alignment_official_pct == 0.0"
            - "StudentPlan.${pl_id}.milestone_pct == 50.0"
            - "StudentPlan.${pl_id}.wbl_hours_pct == 50.0"
            - "StudentPlan.${pl_id}.certification_points == 50"
            - "StudentPlan.${pl_id}.readiness_provisional == 65.0   # 100*.30 + 50*.40 + 50*.20 + 50*.10"
            - "StudentPlan.${pl_id}.readiness_official == 35.0      # 0*.30 + 50*.40 + 50*.20 + 50*.10"

      - name: equity_gap_per_group_rounding
        grounds:
          - calculations.caseload_equity_gap_index
          - entities.Advisor.fields.equity_gap_index
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the pinned order rounds
          each per-group gap to 4 decimals BEFORE summing (0.3810+0.0476+0.2857+0.1429
          = 0.8572 -> 85.72); summing raw gaps then rounding yields 85.71. The
          fixture (district shares 2/7,2/7,2/7,1/7 vs advisor shares 2/3,1/3,0,0)
          makes the two orders disagree in the final 2-decimal output.
        test_recipe:
          setup:
            - "Advisors AX (max 50) and AY (max 50)"
            - "7 ENROLLED students: groups A,A,B assigned to AX; B,C,C,D assigned to AY (district shares 2/7,2/7,2/7,1/7)"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "Eq X", email: "eqx@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ax_id: $.data.id } }
            - { call: "POST /ccr/advisors", payload: { full_name: "Eq Y", email: "eqy@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ay_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "E01", full_name: "E One", grade_level: 11, demographic_group: "GROUP_A", advisor_id: "${ax_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "E02", full_name: "E Two", grade_level: 11, demographic_group: "GROUP_A", advisor_id: "${ax_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "E03", full_name: "E Three", grade_level: 11, demographic_group: "GROUP_B", advisor_id: "${ax_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "E04", full_name: "E Four", grade_level: 11, demographic_group: "GROUP_B", advisor_id: "${ay_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "E05", full_name: "E Five", grade_level: 11, demographic_group: "GROUP_C", advisor_id: "${ay_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "E06", full_name: "E Six", grade_level: 11, demographic_group: "GROUP_C", advisor_id: "${ay_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "E07", full_name: "E Seven", grade_level: 11, demographic_group: "GROUP_D", advisor_id: "${ay_id}" }, as: DistrictAdmin }
          trigger:
            - { call: "GET /ccr/advisors/${ax_id}/equity-report", as: DistrictAdmin }
          assert:
            - "equity-report.equity_gap_index == 85.72  # per-group round(.,4) then sum; the forbidden sum-then-round order would yield 85.71"
            - "equity-report.district_total_students == 7"
            - "equity-report.active_caseload_count == 3"

      - name: district_target_caseload_snapshot
        grounds:
          - calculations.district_target_caseload
          - entities.Advisor.fields.target_caseload
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — advisor X's target depends on the
          district ratio which itself includes X's own max_caseload. The scaffold
          pins snapshot-first evaluation: ratio = ENROLLED count / sum(max_caseload
          over ACTIVE advisors) computed once, then target = round_half_up(ratio *
          max_caseload, 2). 10 students over capacities 10+30 give targets 2.50/7.50;
          adding an 11th student re-evaluates to 2.75/8.25.
        test_recipe:
          setup:
            - "Advisors AX (max 10) and AY (max 30), both ACTIVE"
            - "10 ENROLLED students assigned to AY (capacity 30 not exceeded)"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "T X", email: "tx@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ax_id: $.data.id } }
            - { call: "POST /ccr/advisors", payload: { full_name: "T Y", email: "ty@d.org", max_caseload: 30 }, as: DistrictAdmin, captures: { ay_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "T01", full_name: "T One", grade_level: 9, demographic_group: "GROUP_A", advisor_id: "${ay_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "T02", full_name: "T Two", grade_level: 9, demographic_group: "GROUP_A", advisor_id: "${ay_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "T03", full_name: "T Three", grade_level: 10, demographic_group: "GROUP_B", advisor_id: "${ay_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "T04", full_name: "T Four", grade_level: 10, demographic_group: "GROUP_B", advisor_id: "${ay_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "T05", full_name: "T Five", grade_level: 10, demographic_group: "GROUP_B", advisor_id: "${ay_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "T06", full_name: "T Six", grade_level: 11, demographic_group: "GROUP_C", advisor_id: "${ay_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "T07", full_name: "T Seven", grade_level: 11, demographic_group: "GROUP_C", advisor_id: "${ay_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "T08", full_name: "T Eight", grade_level: 11, demographic_group: "GROUP_C", advisor_id: "${ay_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "T09", full_name: "T Nine", grade_level: 12, demographic_group: "GROUP_D", advisor_id: "${ay_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "T10", full_name: "T Ten", grade_level: 12, demographic_group: "GROUP_D", advisor_id: "${ay_id}" }, as: DistrictAdmin }
          trigger:
            - { call: "GET /ccr/advisors/${ax_id}/equity-report", as: DistrictAdmin }
            - { call: "GET /ccr/advisors/${ay_id}/equity-report", as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "T11", full_name: "T Eleven", grade_level: 12, demographic_group: "GROUP_D", advisor_id: "${ax_id}" }, as: DistrictAdmin }
            - { call: "GET /ccr/advisors/${ax_id}/equity-report", as: DistrictAdmin }
          assert:
            - "First GET AX: target_caseload == 2.5 and district_total_capacity == 40 (ratio 10/40 = 0.25)"
            - "GET AY: target_caseload == 7.5"
            - "After the 11th student, GET AX: target_caseload == 2.75 (ratio 11/40 = 0.275) and AY recomputes to 8.25 on its next read"
  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (3 instances, 3 different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: rec_request_reroute_cycle
        grounds:
          - state_machines.RecommendationRequest.DECLINED_to_REQUESTED
          - state_machines.RecommendationRequest.REQUESTED_to_DECLINED
          - entities.RecommendationRequest.fields.reroute_count
        distinguishing_aspect: |
          Cyclic machine on RecommendationRequest: REQUESTED -> DECLINED ->
          REQUESTED (reroute to a new teacher) is a true loop back to a previously
          visited state, with reroute_count and teacher capacity as loop-carried
          state — not a linear pipeline.
        test_recipe:
          setup:
            - "Advisor A; grade-12 student S (ENROLLED); teachers T1 and T2 (max_active_letters 5 each)"
            - "Letter request routed to T1, due 2026-06-01; T1 declines"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "R Adv", email: "ra@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/teachers", payload: { full_name: "T One", department: "ELA", max_active_letters: 5 }, as: DistrictAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /ccr/teachers", payload: { full_name: "T Two", department: "MATH", max_active_letters: 5 }, as: DistrictAdmin, captures: { t2_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "R001", full_name: "Stu Rec", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /ccr/students/${s_id}/recommendation-requests", payload: { teacher_id: "${t1_id}", due_at: "2026-06-01T00:00:00Z" }, as: Student, as_user_id: "${s_id}", captures: { rr_id: $.data.id } }
            - { call: "POST /ccr/recommendation-requests/${rr_id}/transition", payload: { to_status: "DECLINED" }, as: Teacher, as_user_id: "${t1_id}" }
          trigger:
            - { call: "POST /ccr/recommendation-requests/${rr_id}/transition", payload: { to_status: "REQUESTED", new_teacher_id: "${t2_id}" }, as: Advisor, as_user_id: "${ad_id}" }
            - { call: "GET /ccr/recommendation-requests/${rr_id}", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "GET /ccr/teachers/${t1_id}", as: DistrictAdmin }
            - { call: "GET /ccr/teachers/${t2_id}", as: DistrictAdmin }
          assert:
            - "RecommendationRequest.${rr_id}.status == REQUESTED (loop closed)"
            - "RecommendationRequest.${rr_id}.reroute_count == 1"
            - "RecommendationRequest.${rr_id}.teacher_id == ${t2_id}"
            - "Teacher.${t1_id}.open_request_count == 0 and Teacher.${t2_id}.open_request_count == 1"

      - name: application_parallel_dimensions
        grounds:
          - state_machines.Application.READY_to_SUBMITTED
          - state_machines.Application.SUBMITTED_to_CONFIRMED
          - state_machines.ApplicationDecision.PENDING_to_WAITLISTED
          - state_machines.ApplicationDecision.WAITLISTED_to_ACCEPTED
        distinguishing_aspect: |
          Parallel state dimensions on one entity: Application.submission_status and
          Application.decision_status evolve independently — a decision can move
          PENDING -> WAITLISTED while submission is still SUBMITTED, and submission
          can later move to CONFIRMED without touching the decision dimension.
        test_recipe:
          setup:
            - "Advisor A; pathway GEN (empty); grade-12 student with ACTIVE plan"
            - "Application (deadline 2026-06-15) with all 3 seeded milestones COMPLETED; moved DRAFT->READY->SUBMITTED"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "P Adv", email: "pa@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GENP", name: "General", required_course_codes: [] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "P001", full_name: "Stu Par", grade_level: 12, demographic_group: "GROUP_B", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/students/${s_id}/applications", payload: { college_name: "State U", program_type: "COLLEGE_4YR", deadline_at: "2026-06-15T00:00:00Z" }, as: Student, as_user_id: "${s_id}", captures: { ap_id: $.data.id } }
            - { call: "GET /ccr/applications/${ap_id}/milestones", as: Student, as_user_id: "${s_id}", captures: { m0: "$.data[0].id", m1: "$.data[1].id", m2: "$.data[2].id" } }
            - { call: "POST /ccr/milestones/${m0}/transition", payload: { to_status: "COMPLETED" }, as: Student, as_user_id: "${s_id}" }
            - { call: "POST /ccr/milestones/${m1}/transition", payload: { to_status: "COMPLETED" }, as: Student, as_user_id: "${s_id}" }
            - { call: "POST /ccr/milestones/${m2}/transition", payload: { to_status: "COMPLETED" }, as: Student, as_user_id: "${s_id}" }
            - { call: "POST /ccr/applications/${ap_id}/transition", payload: { to_status: "READY" }, as: Student, as_user_id: "${s_id}" }
            - { call: "POST /ccr/applications/${ap_id}/transition", payload: { to_status: "SUBMITTED" }, as: Student, as_user_id: "${s_id}" }
          trigger:
            - { call: "POST /ccr/applications/${ap_id}/decision", payload: { to_decision: "WAITLISTED" }, as: DistrictAdmin }
            - { call: "POST /ccr/applications/${ap_id}/transition", payload: { to_status: "CONFIRMED" }, as: DistrictAdmin }
            - { call: "POST /ccr/applications/${ap_id}/decision", payload: { to_decision: "ACCEPTED" }, as: DistrictAdmin }
            - { call: "GET /ccr/applications/${ap_id}", as: DistrictAdmin }
          assert:
            - "Application.${ap_id}.submission_status == CONFIRMED"
            - "Application.${ap_id}.decision_status == ACCEPTED"
            - "Decision moved PENDING->WAITLISTED while submission_status was still SUBMITTED (dimensions independent)"
            - "Application.${ap_id}.submitted_at != null and decided_at != null"

      - name: certification_retake_loop
        grounds:
          - state_machines.Certification.FAILED_to_EXAM_SCHEDULED
          - state_machines.Certification.EXAM_SCHEDULED_to_FAILED
          - entities.Certification.fields.retake_count
        distinguishing_aspect: |
          Cyclic machine on Certification: REGISTERED -> EXAM_SCHEDULED -> FAILED ->
          EXAM_SCHEDULED -> PASSED traverses a retake loop with retake_count as
          loop-carried state — a third non-linear shape on a third entity.
        test_recipe:
          setup:
            - "Grade-10 student (ENROLLED); certification OSHA registered"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "C Adv", email: "ca@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "C001", full_name: "Stu Cert", grade_level: 10, demographic_group: "GROUP_C", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /ccr/students/${s_id}/certifications", payload: { cert_code: "OSHA" }, as: WblCoordinator, captures: { cert_id: $.data.id } }
            - { call: "POST /ccr/certifications/${cert_id}/transition", payload: { to_status: "EXAM_SCHEDULED", exam_at: "2026-05-10T09:00:00Z" }, as: WblCoordinator }
            - { call: "POST /ccr/certifications/${cert_id}/transition", payload: { to_status: "FAILED" }, as: WblCoordinator }
          trigger:
            - { call: "POST /ccr/certifications/${cert_id}/transition", payload: { to_status: "EXAM_SCHEDULED", exam_at: "2026-05-20T09:00:00Z" }, as: WblCoordinator }
            - { call: "POST /ccr/certifications/${cert_id}/transition", payload: { to_status: "PASSED" }, as: WblCoordinator }
            - { call: "GET /ccr/certifications/${cert_id}", as: WblCoordinator }
          assert:
            - "Certification.${cert_id}.status == PASSED"
            - "Certification.${cert_id}.retake_count == 1"
            - "Certification.${cert_id}.exam_at == 2026-05-20T09:00:00Z (overwritten by the retake)"
            - "Certification.${cert_id}.earned_at != null"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (2 instances, different triggers, depth 3 and 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: ops_run_missed_milestone_regresses_application
        grounds:
          - state_machines.ApplicationMilestone.READY_to_MISSED
          - state_machines.Application.READY_to_DRAFT
          - calculations.milestone_completion_pct
          - endpoints: POST /ccr/ops-runs
        distinguishing_aspect: |
          Depth-3 chain from trigger POST /ccr/ops-runs: sweep flips the overdue
          INTERVIEW milestone READY -> MISSED (link 1); that flip regresses the
          READY application to DRAFT (link 2, caused by the milestone flip); the
          regression recomputes the plan's milestone_pct/readiness (link 3, caused
          by link 2). Distinct trigger from the enrollment-driven chain below.
        test_recipe:
          setup:
            - "Advisor A; pathway GEN (empty); grade-12 student; ACTIVE plan"
            - "Application deadline 2026-06-15; 3 seeded milestones COMPLETED; app READY"
            - "Required INTERVIEW milestone added with due_at 2026-05-10; clock advanced to 2026-05-11"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "O Adv", email: "oa@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GENO", name: "General", required_course_codes: [] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "O001", full_name: "Stu Ops", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/students/${s_id}/applications", payload: { college_name: "State U", program_type: "COLLEGE_4YR", deadline_at: "2026-06-15T00:00:00Z" }, as: Student, as_user_id: "${s_id}", captures: { ap_id: $.data.id } }
            - { call: "GET /ccr/applications/${ap_id}/milestones", as: Student, as_user_id: "${s_id}", captures: { m0: "$.data[0].id", m1: "$.data[1].id", m2: "$.data[2].id" } }
            - { call: "POST /ccr/milestones/${m0}/transition", payload: { to_status: "COMPLETED" }, as: Student, as_user_id: "${s_id}" }
            - { call: "POST /ccr/milestones/${m1}/transition", payload: { to_status: "COMPLETED" }, as: Student, as_user_id: "${s_id}" }
            - { call: "POST /ccr/milestones/${m2}/transition", payload: { to_status: "COMPLETED" }, as: Student, as_user_id: "${s_id}" }
            - { call: "POST /ccr/applications/${ap_id}/transition", payload: { to_status: "READY" }, as: Student, as_user_id: "${s_id}" }
            - { call: "POST /ccr/applications/${ap_id}/milestones", payload: { kind: "INTERVIEW", due_at: "2026-05-10T00:00:00Z" }, as: Student, as_user_id: "${s_id}", captures: { m3: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: DistrictAdmin }
          trigger:
            - { call: "POST /ccr/ops-runs", as: DistrictAdmin, captures: { run_id: $.data.id } }
            - { call: "GET /ccr/milestones/${m3}", as: DistrictAdmin }
            - { call: "GET /ccr/applications/${ap_id}", as: DistrictAdmin }
            - { call: "GET /ccr/plans/${pl_id}", as: DistrictAdmin }
          assert:
            - "OpsRun.${run_id}.milestones_marked_missed == 1"
            - "OpsRun.${run_id}.applications_regressed == 1"
            - "ApplicationMilestone.${m3}.status == MISSED"
            - "Application.${ap_id}.submission_status == DRAFT (regressed by the milestone flip, not by the ops-run directly)"
            - "StudentPlan.${pl_id}.milestone_pct == 75.0 and readiness_official == 90.0 (align 100, ms 75, wbl 100, cert 100 -> 100*.30+75*.40+100*.20+100*.10)"

      - name: enrollment_completion_flags_certified_audit
        grounds:
          - state_machines.CourseEnrollment.ENROLLED_to_COMPLETED
          - state_machines.SeniorAudit.CERTIFIED_to_FLAGGED
          - calculations.audit_credits
        distinguishing_aspect: |
          Depth-2 chain from trigger POST /ccr/enrollments/{id}/transition: the
          completion recomputes plan/audit derived fields (link 1); the refresh of
          the CERTIFIED audit's drifted inputs flips it CERTIFIED -> FLAGGED with
          flag_reason AUTO_DRIFT (link 2, caused by the refresh). Different
          triggering transition from the ops-run chain.
        test_recipe:
          setup:
            - "Advisors AX (assigned) and AY (auditor); pathway CR (empty requirements, 0 hours, no cert)"
            - "Grade-12 student; ACTIVE plan; one 24-credit course COMPLETED (grade PASS)"
            - "Senior audit by AY moved DRAFT->IN_REVIEW->CERTIFIED (credits_earned == 24 == required)"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "Ax", email: "ax2@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ax_id: $.data.id } }
            - { call: "POST /ccr/advisors", payload: { full_name: "Ay", email: "ay2@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ay_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "CR", name: "Credit Path", required_course_codes: [] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "A001", full_name: "Stu Audit", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ax_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ax_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ax_id}" }
            - { call: "POST /ccr/students/${s_id}/enrollments", payload: { plan_id: "${pl_id}", course_code: "CR24", term: "2026-SPRING", credits: 24 }, as: Advisor, as_user_id: "${ax_id}", captures: { en1: $.data.id } }
            - { call: "POST /ccr/enrollments/${en1}/transition", payload: { to_status: "ENROLLED" }, as: Advisor, as_user_id: "${ax_id}" }
            - { call: "POST /ccr/enrollments/${en1}/transition", payload: { to_status: "COMPLETED", grade: "PASS" }, as: Advisor, as_user_id: "${ax_id}" }
            - { call: "POST /ccr/students/${s_id}/senior-audits", payload: { auditor_advisor_id: "${ay_id}" }, as: DistrictAdmin, captures: { aud_id: $.data.id } }
            - { call: "POST /ccr/senior-audits/${aud_id}/transition", payload: { to_status: "IN_REVIEW" }, as: Advisor, as_user_id: "${ay_id}" }
            - { call: "POST /ccr/senior-audits/${aud_id}/transition", payload: { to_status: "CERTIFIED" }, as: Advisor, as_user_id: "${ay_id}" }
            - { call: "POST /ccr/students/${s_id}/enrollments", payload: { plan_id: "${pl_id}", course_code: "ELECT6", term: "2026-SPRING", credits: 4 }, as: Advisor, as_user_id: "${ax_id}", captures: { en2: $.data.id } }
            - { call: "POST /ccr/enrollments/${en2}/transition", payload: { to_status: "ENROLLED" }, as: Advisor, as_user_id: "${ax_id}" }
          trigger:
            - { call: "POST /ccr/enrollments/${en2}/transition", payload: { to_status: "COMPLETED", grade: "A" }, as: Advisor, as_user_id: "${ax_id}" }
            - { call: "GET /ccr/senior-audits/${aud_id}", as: DistrictAdmin }
          assert:
            - "SeniorAudit.${aud_id}.status == FLAGGED (auto-flag caused by the post-certification drift)"
            - "SeniorAudit.${aud_id}.flag_reason == AUTO_DRIFT"
            - "SeniorAudit.${aud_id}.certified_at == null"
            - "SeniorAudit.${aud_id}.credits_earned == 28 (refresh resumed once FLAGGED)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (2 instances, different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ready_after_withdraw_state_beats_deadline
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DEADLINE_PASSED]
        distinguishing_aspect: |
          Category pair (state, business_temporal): the DRAFT->READY request on a
          WITHDRAWN application after its deadline violates both priority 7 (from-state
          membership) and priority 10 (now > deadline_at); the state error
          ERR_INVALID_STATE must win because 7 < 10.
        test_recipe:
          setup:
            - "Advisor A; pathway GEN (empty); grade-12 student; ACTIVE plan"
            - "Application deadline 2026-05-10 created and WITHDRAWN by the student"
            - "Clock advanced to 2026-05-20 (past the deadline)"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "V Adv", email: "va@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GENV", name: "General", required_course_codes: [] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "V001", full_name: "Stu Val", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/students/${s_id}/applications", payload: { college_name: "State U", program_type: "COLLEGE_4YR", deadline_at: "2026-05-10T00:00:00Z" }, as: Student, as_user_id: "${s_id}", captures: { ap_id: $.data.id } }
            - { call: "POST /ccr/applications/${ap_id}/transition", payload: { to_status: "WITHDRAWN" }, as: Student, as_user_id: "${s_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: DistrictAdmin }
          trigger:
            - call: "POST /ccr/applications/${ap_id}/transition"
              payload: { to_status: "READY" }
              as: Student
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 7 outranks business_temporal priority 10; ERR_DEADLINE_PASSED must NOT surface)"
            - "Application.${ap_id}.submission_status remains WITHDRAWN"

      - name: placement_confirm_overlap_beats_capacity
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - errors[ERR_PLACEMENT_OVERLAP]
          - errors[ERR_SITE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Category pair (business_temporal, business_fiscal): one CONFIRM request on
          P_B1 violates both the student pairwise overlap rule (vs P_B0, priority 10)
          and the site aggregate capacity rule (site S1 already at max 1, priority
          12); ERR_PLACEMENT_OVERLAP must win because 10 < 12. Different category
          pair than the (state, business_temporal) instance above.
        test_recipe:
          setup:
            - "Site S1 (max_concurrent_placements 1) and site S2 (max 10)"
            - "Student A: placement P_A at S1 [2026-04-01, 2026-06-01) CONFIRMED (site full)"
            - "Student B: placement P_B0 at S2 [2026-04-10, 2026-05-10) CONFIRMED; placement P_B1 at S1 [2026-04-15, 2026-05-15) OFFERED"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "W Adv", email: "wa@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/placement-sites", payload: { site_code: "S1", name: "Site One", max_concurrent_placements: 1 }, as: DistrictAdmin, captures: { site1: $.data.id } }
            - { call: "POST /ccr/placement-sites", payload: { site_code: "S2", name: "Site Two", max_concurrent_placements: 10 }, as: DistrictAdmin, captures: { site2: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "W001", full_name: "Stu A", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { sa_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "W002", full_name: "Stu B", grade_level: 12, demographic_group: "GROUP_B", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { sb_id: $.data.id } }
            - { call: "POST /ccr/students/${sa_id}/placements", payload: { site_id: "${site1}", term_start: "2026-04-01T00:00:00Z", term_end: "2026-06-01T00:00:00Z", hours_per_week: 10 }, as: WblCoordinator, captures: { pa_id: $.data.id } }
            - { call: "POST /ccr/placements/${pa_id}/transition", payload: { to_status: "CONFIRMED" }, as: WblCoordinator }
            - { call: "POST /ccr/students/${sb_id}/placements", payload: { site_id: "${site2}", term_start: "2026-04-10T00:00:00Z", term_end: "2026-05-10T00:00:00Z", hours_per_week: 8 }, as: WblCoordinator, captures: { pb0_id: $.data.id } }
            - { call: "POST /ccr/placements/${pb0_id}/transition", payload: { to_status: "CONFIRMED" }, as: WblCoordinator }
            - { call: "POST /ccr/students/${sb_id}/placements", payload: { site_id: "${site1}", term_start: "2026-04-15T00:00:00Z", term_end: "2026-05-15T00:00:00Z", hours_per_week: 8 }, as: WblCoordinator, captures: { pb1_id: $.data.id } }
          trigger:
            - call: "POST /ccr/placements/${pb1_id}/transition"
              payload: { to_status: "CONFIRMED" }
              as: WblCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PLACEMENT_OVERLAP (business_temporal priority 10 outranks business_fiscal priority 12; ERR_SITE_CAPACITY_EXCEEDED must NOT surface)"
            - "Placement.${pb1_id}.status remains OFFERED"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (3 instances, different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: caseload_full_at_exact_max
        grounds:
          - validations[priority=12]
          - errors[ERR_CASELOAD_FULL]
          - entities.Advisor.fields.active_caseload_count
        distinguishing_aspect: |
          Metric: integer headcount on POST /ccr/students. The rule is >= — at
          active_caseload_count == max_caseload (2 == 2) the assignment is rejected;
          one below (1 < 2) succeeds. Exact equality is the boundary under test.
        test_recipe:
          setup:
            - "Advisor A with max_caseload 2; students S1 and S2 already assigned (count == 2)"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "B Adv", email: "ba@d.org", max_caseload: 2 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "B001", full_name: "Stu B1", grade_level: 11, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "B002", full_name: "Stu B2", grade_level: 11, demographic_group: "GROUP_B", advisor_id: "${ad_id}" }, as: DistrictAdmin }
          trigger:
            - call: "POST /ccr/students"
              payload: { student_ref: "B003", full_name: "Stu B3", grade_level: 11, demographic_group: "GROUP_C", advisor_id: "${ad_id}" }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
            - { call: "GET /ccr/advisors/${ad_id}", as: DistrictAdmin }
          assert:
            - "error_id == ERR_CASELOAD_FULL at active_caseload_count == max_caseload (equality rejects)"
            - "Advisor.${ad_id}.active_caseload_count == 2 (unchanged by the rejected create)"
            - "S1/S2 creations succeeded when count was 0 and 1 (< 2 passes)"

      - name: audit_credits_exact_threshold
        grounds:
          - calculations.audit_credits
          - state_machines.SeniorAudit.IN_REVIEW_to_CERTIFIED
          - errors[ERR_CREDITS_SHORTFALL]
        distinguishing_aspect: |
          Metric: credit sum on POST /ccr/senior-audits/{id}/transition (CERTIFIED).
          credits_earned == 24 exactly PASSES (the comparison is >=, not >), while
          23.5 fails with ERR_CREDITS_SHORTFALL — equality at the threshold is the
          boundary under test, on a different metric and endpoint than the caseload
          instance.
        test_recipe:
          setup:
            - "Advisors AX (assigned) and AY (auditor); pathway CR (empty requirements)"
            - "Student C1: one 24-credit course COMPLETED -> credits_earned 24"
            - "Student C2: one 23.5-credit course COMPLETED -> credits_earned 23.5"
            - "Both audits IN_REVIEW under auditor AY"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "Cx", email: "cx@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ax_id: $.data.id } }
            - { call: "POST /ccr/advisors", payload: { full_name: "Cy", email: "cy@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ay_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "CRB", name: "Credit Path", required_course_codes: [] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "C101", full_name: "Exact Credits", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ax_id}" }, as: DistrictAdmin, captures: { c1_id: $.data.id, c1_v: $.data.version } }
            - { call: "POST /ccr/students/${c1_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${c1_v}" }, as: Advisor, as_user_id: "${ax_id}", captures: { p1_id: $.data.id } }
            - { call: "POST /ccr/plans/${p1_id}/activate", as: Advisor, as_user_id: "${ax_id}" }
            - { call: "POST /ccr/students/${c1_id}/enrollments", payload: { plan_id: "${p1_id}", course_code: "CR24", term: "2026-SPRING", credits: 24 }, as: Advisor, as_user_id: "${ax_id}", captures: { e1_id: $.data.id } }
            - { call: "POST /ccr/enrollments/${e1_id}/transition", payload: { to_status: "ENROLLED" }, as: Advisor, as_user_id: "${ax_id}" }
            - { call: "POST /ccr/enrollments/${e1_id}/transition", payload: { to_status: "COMPLETED", grade: "PASS" }, as: Advisor, as_user_id: "${ax_id}" }
            - { call: "POST /ccr/students/${c1_id}/senior-audits", payload: { auditor_advisor_id: "${ay_id}" }, as: DistrictAdmin, captures: { aud1_id: $.data.id } }
            - { call: "POST /ccr/senior-audits/${aud1_id}/transition", payload: { to_status: "IN_REVIEW" }, as: Advisor, as_user_id: "${ay_id}" }
            - { call: "POST /ccr/students", payload: { student_ref: "C102", full_name: "Short Credits", grade_level: 12, demographic_group: "GROUP_B", advisor_id: "${ax_id}" }, as: DistrictAdmin, captures: { c2_id: $.data.id, c2_v: $.data.version } }
            - { call: "POST /ccr/students/${c2_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${c2_v}" }, as: Advisor, as_user_id: "${ax_id}", captures: { p2_id: $.data.id } }
            - { call: "POST /ccr/plans/${p2_id}/activate", as: Advisor, as_user_id: "${ax_id}" }
            - { call: "POST /ccr/students/${c2_id}/enrollments", payload: { plan_id: "${p2_id}", course_code: "CR235", term: "2026-SPRING", credits: 23.5 }, as: Advisor, as_user_id: "${ax_id}", captures: { e2_id: $.data.id } }
            - { call: "POST /ccr/enrollments/${e2_id}/transition", payload: { to_status: "ENROLLED" }, as: Advisor, as_user_id: "${ax_id}" }
            - { call: "POST /ccr/enrollments/${e2_id}/transition", payload: { to_status: "COMPLETED", grade: "B" }, as: Advisor, as_user_id: "${ax_id}" }
            - { call: "POST /ccr/students/${c2_id}/senior-audits", payload: { auditor_advisor_id: "${ay_id}" }, as: DistrictAdmin, captures: { aud2_id: $.data.id } }
            - { call: "POST /ccr/senior-audits/${aud2_id}/transition", payload: { to_status: "IN_REVIEW" }, as: Advisor, as_user_id: "${ay_id}" }
          trigger:
            - { call: "POST /ccr/senior-audits/${aud1_id}/transition", payload: { to_status: "CERTIFIED" }, as: Advisor, as_user_id: "${ay_id}" }
            - call: "POST /ccr/senior-audits/${aud2_id}/transition"
              payload: { to_status: "CERTIFIED" }
              as: Advisor
              as_user_id: "${ay_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "SeniorAudit.${aud1_id}.status == CERTIFIED (credits_earned == 24 == required_credits passes because the gate is >=)"
            - "error_id for audit2 == ERR_CREDITS_SHORTFALL (23.5 < 24 fails)"
            - "SeniorAudit.${aud2_id}.status remains IN_REVIEW"

      - name: site_capacity_at_exact_max
        grounds:
          - calculations.site_overlap_max
          - errors[ERR_SITE_CAPACITY_EXCEEDED]
          - entities.PlacementSite.fields.max_concurrent_placements
        distinguishing_aspect: |
          Metric: interval overlap count on POST /ccr/placements/{id}/transition
          (CONFIRMED). max_overlap + 1 == max_concurrent_placements is ALLOWED (the
          check is >, not >=, on the resulting count), while max_overlap + 1 ==
          max + 1 is rejected; an interval adjacent to an expiring one (start ==
          other's end) does not count toward the overlap at that instant.
        test_recipe:
          setup:
            - "Site SC with max_concurrent_placements 2; three students A, B, C"
            - "P_A [2026-05-04, 2026-06-04) CONFIRMED; P_B [2026-05-10, 2026-06-10) CONFIRMED (overlap max reaches exactly 2 — allowed)"
            - "P_C [2026-05-15, 2026-05-20) OFFERED (would push overlap max to 3); P_C2 [2026-06-04, 2026-07-01) OFFERED (adjacent to P_A's end)"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "S Adv", email: "sa@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/placement-sites", payload: { site_code: "SC", name: "Site Cap", max_concurrent_placements: 2 }, as: DistrictAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "SC1", full_name: "Stu SA", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { sa_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "SC2", full_name: "Stu SB", grade_level: 12, demographic_group: "GROUP_B", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { sb_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "SC3", full_name: "Stu SC", grade_level: 12, demographic_group: "GROUP_C", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { sc_id: $.data.id } }
            - { call: "POST /ccr/students/${sa_id}/placements", payload: { site_id: "${site_id}", term_start: "2026-05-04T00:00:00Z", term_end: "2026-06-04T00:00:00Z", hours_per_week: 10 }, as: WblCoordinator, captures: { pa_id: $.data.id } }
            - { call: "POST /ccr/placements/${pa_id}/transition", payload: { to_status: "CONFIRMED" }, as: WblCoordinator }
            - { call: "POST /ccr/students/${sb_id}/placements", payload: { site_id: "${site_id}", term_start: "2026-05-10T00:00:00Z", term_end: "2026-06-10T00:00:00Z", hours_per_week: 10 }, as: WblCoordinator, captures: { pb_id: $.data.id } }
            - { call: "POST /ccr/placements/${pb_id}/transition", payload: { to_status: "CONFIRMED" }, as: WblCoordinator }
            - { call: "POST /ccr/students/${sc_id}/placements", payload: { site_id: "${site_id}", term_start: "2026-05-15T00:00:00Z", term_end: "2026-05-20T00:00:00Z", hours_per_week: 10 }, as: WblCoordinator, captures: { pc_id: $.data.id } }
            - { call: "POST /ccr/students/${sc_id}/placements", payload: { site_id: "${site_id}", term_start: "2026-06-04T00:00:00Z", term_end: "2026-07-01T00:00:00Z", hours_per_week: 10 }, as: WblCoordinator, captures: { pc2_id: $.data.id } }
          trigger:
            - call: "POST /ccr/placements/${pc_id}/transition"
              payload: { to_status: "CONFIRMED" }
              as: WblCoordinator
              captures: { err: $.data.error_id }
            - { call: "POST /ccr/placements/${pc2_id}/transition", payload: { to_status: "CONFIRMED" }, as: WblCoordinator }
          assert:
            - "P_B confirm succeeded with max_overlap + 1 == 2 == max_concurrent_placements (exact capacity is allowed)"
            - "error_id for P_C == ERR_SITE_CAPACITY_EXCEEDED (max_overlap 2 + 1 = 3 > 2)"
            - "Placement.${pc2_id}.status == CONFIRMED (at t=2026-06-04 P_A's half-open interval has ended; overlap max 1 + 1 = 2 allowed)"
            - "PlacementSite.${site_id}.confirmed_active_count == 3 after the adjacent confirm"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (3 instances, different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: audit_certify_blocked_by_open_enrollment
        grounds:
          - state_machines.SeniorAudit.IN_REVIEW_to_CERTIFIED
          - errors[ERR_OPEN_ENROLLMENTS]
          - validations[priority=11]
        distinguishing_aspect: |
          Pair SeniorAudit x CourseEnrollment: CERTIFIED is reachable only when
          every enrollment of the student is terminal; one ENROLLED enrollment
          blocks certification with ERR_OPEN_ENROLLMENTS.
        test_recipe:
          setup:
            - "Advisors AX (assigned) and AY (auditor); pathway CR (empty); grade-12 student; ACTIVE plan"
            - "A 24-credit course COMPLETED (credits gate satisfied) plus one enrollment still ENROLLED (only the open-enrollments gate fails)"
            - "Audit IN_REVIEW under AY"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "Dx", email: "dx@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ax_id: $.data.id } }
            - { call: "POST /ccr/advisors", payload: { full_name: "Dy", email: "dy@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ay_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "CRD", name: "Credit Path", required_course_codes: [] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "D001", full_name: "Stu Dep", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ax_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ax_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ax_id}" }
            - { call: "POST /ccr/students/${s_id}/enrollments", payload: { plan_id: "${pl_id}", course_code: "CR24", term: "2026-SPRING", credits: 24 }, as: Advisor, as_user_id: "${ax_id}", captures: { en0: $.data.id } }
            - { call: "POST /ccr/enrollments/${en0}/transition", payload: { to_status: "ENROLLED" }, as: Advisor, as_user_id: "${ax_id}" }
            - { call: "POST /ccr/enrollments/${en0}/transition", payload: { to_status: "COMPLETED", grade: "PASS" }, as: Advisor, as_user_id: "${ax_id}" }
            - { call: "POST /ccr/students/${s_id}/enrollments", payload: { plan_id: "${pl_id}", course_code: "OPEN1", term: "2026-SPRING", credits: 2 }, as: Advisor, as_user_id: "${ax_id}", captures: { en_id: $.data.id } }
            - { call: "POST /ccr/enrollments/${en_id}/transition", payload: { to_status: "ENROLLED" }, as: Advisor, as_user_id: "${ax_id}" }
            - { call: "POST /ccr/students/${s_id}/senior-audits", payload: { auditor_advisor_id: "${ay_id}" }, as: DistrictAdmin, captures: { aud_id: $.data.id } }
            - { call: "POST /ccr/senior-audits/${aud_id}/transition", payload: { to_status: "IN_REVIEW" }, as: Advisor, as_user_id: "${ay_id}" }
          trigger:
            - call: "POST /ccr/senior-audits/${aud_id}/transition"
              payload: { to_status: "CERTIFIED" }
              as: Advisor
              as_user_id: "${ay_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OPEN_ENROLLMENTS (SeniorAudit gate reads CourseEnrollment state)"
            - "SeniorAudit.${aud_id}.status remains IN_REVIEW"

      - name: outcome_requires_graduated_student
        grounds:
          - state_machines.Student.ENROLLED_to_GRADUATED
          - errors[ERR_STUDENT_NOT_GRADUATED]
          - validations[priority=11]
        distinguishing_aspect: |
          Pair OutcomeRecord x Student: outcome creation is legal only once the
          Student row is GRADUATED (which itself needs a CERTIFIED audit); the same
          create fails with ERR_STUDENT_NOT_GRADUATED while ENROLLED.
        test_recipe:
          setup:
            - "Advisors AX (assigned), AY (auditor); pathway CR (empty); grade-12 student; ACTIVE plan"
            - "24-credit course COMPLETED; audit CERTIFIED by AY"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "Fx", email: "fx@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ax_id: $.data.id } }
            - { call: "POST /ccr/advisors", payload: { full_name: "Fy", email: "fy@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ay_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "CRF", name: "Credit Path", required_course_codes: [] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "F001", full_name: "Stu Out", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ax_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ax_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ax_id}" }
            - { call: "POST /ccr/students/${s_id}/enrollments", payload: { plan_id: "${pl_id}", course_code: "CR24", term: "2026-SPRING", credits: 24 }, as: Advisor, as_user_id: "${ax_id}", captures: { en_id: $.data.id } }
            - { call: "POST /ccr/enrollments/${en_id}/transition", payload: { to_status: "ENROLLED" }, as: Advisor, as_user_id: "${ax_id}" }
            - { call: "POST /ccr/enrollments/${en_id}/transition", payload: { to_status: "COMPLETED", grade: "PASS" }, as: Advisor, as_user_id: "${ax_id}" }
            - { call: "POST /ccr/students/${s_id}/senior-audits", payload: { auditor_advisor_id: "${ay_id}" }, as: DistrictAdmin, captures: { aud_id: $.data.id } }
            - { call: "POST /ccr/senior-audits/${aud_id}/transition", payload: { to_status: "IN_REVIEW" }, as: Advisor, as_user_id: "${ay_id}" }
            - call: "POST /ccr/students/${s_id}/outcome-records"
              payload: { outcome_type: "ENROLLED_4YR", reported_at: "2026-05-02T00:00:00Z", institution_name: "State U" }
              as: DistrictAdmin
              captures: { err_pre: $.data.error_id }
          trigger:
            - { call: "POST /ccr/senior-audits/${aud_id}/transition", payload: { to_status: "CERTIFIED" }, as: Advisor, as_user_id: "${ay_id}" }
            - { call: "POST /ccr/students/${s_id}/graduate", as: DistrictAdmin }
            - { call: "POST /ccr/students/${s_id}/outcome-records", payload: { outcome_type: "ENROLLED_4YR", reported_at: "2026-05-02T00:00:00Z", institution_name: "State U" }, as: DistrictAdmin, captures: { oc_id: $.data.id } }
          assert:
            - "Pre-graduation create failed with error_id == ERR_STUDENT_NOT_GRADUATED"
            - "Post-graduation create succeeds: OutcomeRecord.${oc_id}.verification_status == UNVERIFIED"
            - "Student.${s_id}.status == GRADUATED and graduated_at != null"

      - name: application_submit_blocked_by_pending_letter
        grounds:
          - state_machines.Application.READY_to_SUBMITTED
          - errors[ERR_PENDING_REC_LETTERS]
          - validations[priority=11]
        distinguishing_aspect: |
          Pair Application x RecommendationRequest: READY->SUBMITTED is gated on the
          state of a different entity — any linked letter request still REQUESTED or
          ACCEPTED blocks submission with ERR_PENDING_REC_LETTERS until the teacher
          submits it.
        test_recipe:
          setup:
            - "Advisor A; teacher T; pathway GEN (empty); grade-12 student; ACTIVE plan"
            - "Application (deadline 2026-06-15) with 3 seeded milestones COMPLETED; letter request linked to the application and ACCEPTED by T"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "G Adv", email: "ga@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/teachers", payload: { full_name: "G Tee", department: "ELA", max_active_letters: 5 }, as: DistrictAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GENG", name: "General", required_course_codes: [] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "G001", full_name: "Stu Gate", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /ccr/plans/${pl_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "POST /ccr/students/${s_id}/applications", payload: { college_name: "State U", program_type: "COLLEGE_4YR", deadline_at: "2026-06-15T00:00:00Z" }, as: Student, as_user_id: "${s_id}", captures: { ap_id: $.data.id } }
            - { call: "GET /ccr/applications/${ap_id}/milestones", as: Student, as_user_id: "${s_id}", captures: { m0: "$.data[0].id", m1: "$.data[1].id", m2: "$.data[2].id" } }
            - { call: "POST /ccr/milestones/${m0}/transition", payload: { to_status: "COMPLETED" }, as: Student, as_user_id: "${s_id}" }
            - { call: "POST /ccr/milestones/${m1}/transition", payload: { to_status: "COMPLETED" }, as: Student, as_user_id: "${s_id}" }
            - { call: "POST /ccr/milestones/${m2}/transition", payload: { to_status: "COMPLETED" }, as: Student, as_user_id: "${s_id}" }
            - { call: "POST /ccr/students/${s_id}/recommendation-requests", payload: { teacher_id: "${t_id}", due_at: "2026-06-01T00:00:00Z", application_id: "${ap_id}" }, as: Student, as_user_id: "${s_id}", captures: { rr_id: $.data.id } }
            - { call: "POST /ccr/recommendation-requests/${rr_id}/transition", payload: { to_status: "ACCEPTED" }, as: Teacher, as_user_id: "${t_id}" }
            - { call: "POST /ccr/applications/${ap_id}/transition", payload: { to_status: "READY" }, as: Student, as_user_id: "${s_id}" }
            - call: "POST /ccr/applications/${ap_id}/transition"
              payload: { to_status: "SUBMITTED" }
              as: Student
              as_user_id: "${s_id}"
              captures: { err_block: $.data.error_id }
          trigger:
            - { call: "POST /ccr/recommendation-requests/${rr_id}/transition", payload: { to_status: "SUBMITTED" }, as: Teacher, as_user_id: "${t_id}" }
            - { call: "POST /ccr/applications/${ap_id}/transition", payload: { to_status: "SUBMITTED" }, as: Student, as_user_id: "${s_id}" }
          assert:
            - "First SUBMITTED attempt failed with error_id == ERR_PENDING_REC_LETTERS"
            - "After the teacher's SUBMITTED transition, the retry succeeds: Application.${ap_id}.submission_status == SUBMITTED"
            - "Application.${ap_id}.decision_status == PENDING (auto-advanced on submit)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: student_pairwise_half_open_overlap
        grounds:
          - state_machines.Placement.OFFERED_to_CONFIRMED
          - errors[ERR_PLACEMENT_OVERLAP]
          - validations[priority=10]
        distinguishing_aspect: |
          Resource: one student's placement timeline; semantics: pairwise HALF-OPEN
          exclusion — [04-01,05-01) and [05-01,06-01) touch but do not conflict
          (confirm succeeds), while [04-15,05-15) intersects the first interval's
          interior and is rejected. Different resource entity and different
          semantics than the site aggregate rule below.
        test_recipe:
          setup:
            - "Site SP (max 10); grade-12 student S"
            - "P1 [2026-04-01, 2026-05-01) CONFIRMED for S; P2 [2026-05-01, 2026-06-01) OFFERED (adjacent); P3 [2026-04-15, 2026-05-15) OFFERED (interior overlap)"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "H Adv", email: "ha@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/placement-sites", payload: { site_code: "SP", name: "Site P", max_concurrent_placements: 10 }, as: DistrictAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "H001", full_name: "Stu Half", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /ccr/students/${s_id}/placements", payload: { site_id: "${site_id}", term_start: "2026-04-01T00:00:00Z", term_end: "2026-05-01T00:00:00Z", hours_per_week: 10 }, as: WblCoordinator, captures: { p1_id: $.data.id } }
            - { call: "POST /ccr/placements/${p1_id}/transition", payload: { to_status: "CONFIRMED" }, as: WblCoordinator }
            - { call: "POST /ccr/students/${s_id}/placements", payload: { site_id: "${site_id}", term_start: "2026-05-01T00:00:00Z", term_end: "2026-06-01T00:00:00Z", hours_per_week: 10 }, as: WblCoordinator, captures: { p2_id: $.data.id } }
            - { call: "POST /ccr/students/${s_id}/placements", payload: { site_id: "${site_id}", term_start: "2026-04-15T00:00:00Z", term_end: "2026-05-15T00:00:00Z", hours_per_week: 10 }, as: WblCoordinator, captures: { p3_id: $.data.id } }
          trigger:
            - { call: "POST /ccr/placements/${p2_id}/transition", payload: { to_status: "CONFIRMED" }, as: WblCoordinator }
            - call: "POST /ccr/placements/${p3_id}/transition"
              payload: { to_status: "CONFIRMED" }
              as: WblCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Placement.${p2_id}.status == CONFIRMED (adjacency p1.term_end == p2.term_start is allowed under half-open semantics)"
            - "error_id for P3 == ERR_PLACEMENT_OVERLAP (04-15 < 05-01 intersects P1's interior)"
            - "Placement.${p3_id}.status remains OFFERED"

      - name: site_aggregate_capacity_overlap
        grounds:
          - calculations.site_overlap_max
          - errors[ERR_SITE_CAPACITY_EXCEEDED]
          - validations[priority=12]
        distinguishing_aspect: |
          Resource: PlacementSite; semantics: AGGREGATE interval capacity — three
          placements belonging to three DIFFERENT students (so the pairwise student
          rule never fires) are evaluated by the maximum simultaneous overlap over
          the candidate window; the third overlapping confirm is rejected purely by
          aggregate capacity, and a back-to-back adjacent confirm is accepted.
        test_recipe:
          setup:
            - "Site SG (max_concurrent_placements 2); students A, B, C (each with at most one placement — pairwise rule inert)"
            - "P_A [2026-05-04, 2026-06-04) CONFIRMED; P_B [2026-05-10, 2026-06-10) CONFIRMED (aggregate overlap 2 == capacity)"
            - "P_C [2026-05-15, 2026-05-20) OFFERED; P_D (student C) [2026-06-04, 2026-07-01) OFFERED (starts exactly when P_A ends)"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "I Adv", email: "ia@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/placement-sites", payload: { site_code: "SG", name: "Site G", max_concurrent_placements: 2 }, as: DistrictAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "I001", full_name: "Stu IA", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { sa_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "I002", full_name: "Stu IB", grade_level: 12, demographic_group: "GROUP_B", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { sb_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "I003", full_name: "Stu IC", grade_level: 12, demographic_group: "GROUP_C", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { sc_id: $.data.id } }
            - { call: "POST /ccr/students/${sa_id}/placements", payload: { site_id: "${site_id}", term_start: "2026-05-04T00:00:00Z", term_end: "2026-06-04T00:00:00Z", hours_per_week: 10 }, as: WblCoordinator, captures: { pa_id: $.data.id } }
            - { call: "POST /ccr/placements/${pa_id}/transition", payload: { to_status: "CONFIRMED" }, as: WblCoordinator }
            - { call: "POST /ccr/students/${sb_id}/placements", payload: { site_id: "${site_id}", term_start: "2026-05-10T00:00:00Z", term_end: "2026-06-10T00:00:00Z", hours_per_week: 10 }, as: WblCoordinator, captures: { pb_id: $.data.id } }
            - { call: "POST /ccr/placements/${pb_id}/transition", payload: { to_status: "CONFIRMED" }, as: WblCoordinator }
            - { call: "POST /ccr/students/${sc_id}/placements", payload: { site_id: "${site_id}", term_start: "2026-05-15T00:00:00Z", term_end: "2026-05-20T00:00:00Z", hours_per_week: 10 }, as: WblCoordinator, captures: { pc_id: $.data.id } }
            - { call: "POST /ccr/students/${sc_id}/placements", payload: { site_id: "${site_id}", term_start: "2026-06-04T00:00:00Z", term_end: "2026-07-01T00:00:00Z", hours_per_week: 10 }, as: WblCoordinator, captures: { pd_id: $.data.id } }
          trigger:
            - call: "POST /ccr/placements/${pc_id}/transition"
              payload: { to_status: "CONFIRMED" }
              as: WblCoordinator
              captures: { err: $.data.error_id }
            - { call: "POST /ccr/placements/${pd_id}/transition", payload: { to_status: "CONFIRMED" }, as: WblCoordinator }
          assert:
            - "error_id for P_C == ERR_SITE_CAPACITY_EXCEEDED (aggregate overlap 2 + candidate = 3 > max 2)"
            - "Placement.${pd_id}.status == CONFIRMED (at t=2026-06-04 only P_B occupies the site; aggregate 1 + 1 = 2 <= 2)"
            - "No ERR_PLACEMENT_OVERLAP raised anywhere in this instance — each student holds at most one overlapping placement"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (3 instances, different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: caseload_sum_conserved_on_reassignment
        grounds:
          - concurrency_rules[reassignment-stale-advisor]
          - entities.Advisor.fields.active_caseload_count
          - calculations.caseload_load
        distinguishing_aspect: |
          Conserved quantity: district-wide SUM of Advisor.active_caseload_count.
          Forward action (reassignment moving S1 AX->AY) paired with its inverse
          reading leaves the sum unchanged: 2+1 = 3 before, 1+2 = 3 after; no
          student is double-counted or dropped.
        test_recipe:
          setup:
            - "Advisors AX (max 10, version captured) and AY (max 10)"
            - "Students S1, S2 assigned to AX; S3 assigned to AY (district sum of active_caseload_count == 3)"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "Jx", email: "jx@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ax_id: $.data.id, ax_v: $.data.version } }
            - { call: "POST /ccr/advisors", payload: { full_name: "Jy", email: "jy@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ay_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "J001", full_name: "Stu J1", grade_level: 11, demographic_group: "GROUP_A", advisor_id: "${ax_id}" }, as: DistrictAdmin, captures: { s1_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "J002", full_name: "Stu J2", grade_level: 11, demographic_group: "GROUP_B", advisor_id: "${ax_id}" }, as: DistrictAdmin }
            - { call: "POST /ccr/students", payload: { student_ref: "J003", full_name: "Stu J3", grade_level: 11, demographic_group: "GROUP_C", advisor_id: "${ay_id}" }, as: DistrictAdmin }
          trigger:
            - { call: "POST /ccr/advisors/${ax_id}/reassignments", payload: { student_ids: ["${s1_id}"], target_advisor_id: "${ay_id}", expected_advisor_version: "${ax_v}" }, as: DistrictAdmin }
            - { call: "GET /ccr/advisors/${ax_id}", as: DistrictAdmin }
            - { call: "GET /ccr/advisors/${ay_id}", as: DistrictAdmin }
            - { call: "GET /ccr/students/${s1_id}", as: DistrictAdmin }
          assert:
            - "Advisor.${ax_id}.active_caseload_count == 1 (was 2)"
            - "Advisor.${ay_id}.active_caseload_count == 2 (was 1)"
            - "INVARIANT: sum of active_caseload_count over all advisors == 3 before and after the reassignment"
            - "Student.${s1_id}.assigned_advisor_id == ${ay_id}"

      - name: active_plan_cardinality_conserved_on_supersede
        grounds:
          - state_machines.StudentPlan.DRAFT_to_ACTIVE
          - state_machines.StudentPlan.ACTIVE_to_SUPERSEDED
          - concurrency_rules[plan-create-stale-student]
        distinguishing_aspect: |
          Conserved quantity: the per-student COUNT of plans with status ACTIVE.
          The forward action (activate plan2) paired with its compensating
          side effect (plan1 -> SUPERSEDED) keeps count(ACTIVE plans of student)
          == 1 at every observable point — different conserved quantity (cardinality
          constraint) than the caseload sum.
        test_recipe:
          setup:
            - "Advisor A; pathway GEN (empty); grade-12 student; plan1 created and ACTIVE"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "K Adv", email: "ka@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GENK", name: "General", required_course_codes: [] }, as: DistrictAdmin, captures: { pw_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "K001", full_name: "Stu K", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad_id}", captures: { p1_id: $.data.id } }
            - { call: "POST /ccr/plans/${p1_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "GET /ccr/students/${s_id}", as: Advisor, as_user_id: "${ad_id}", captures: { s_v2: $.data.version } }
          trigger:
            - { call: "POST /ccr/students/${s_id}/plans", payload: { pathway_id: "${pw_id}", expected_student_version: "${s_v2}" }, as: Advisor, as_user_id: "${ad_id}", captures: { p2_id: $.data.id } }
            - { call: "POST /ccr/plans/${p2_id}/activate", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "GET /ccr/plans/${p1_id}", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "GET /ccr/plans/${p2_id}", as: Advisor, as_user_id: "${ad_id}" }
            - { call: "GET /ccr/students/${s_id}/plans", as: Advisor, as_user_id: "${ad_id}", payload: { status: "ACTIVE" } }
          assert:
            - "StudentPlan.${p1_id}.status == SUPERSEDED"
            - "StudentPlan.${p2_id}.status == ACTIVE"
            - "INVARIANT: GET /ccr/students/${s_id}/plans?status=ACTIVE returns exactly 1 plan (cardinality 1 conserved across the supersede)"

      - name: site_slot_conserved_on_confirm_terminate
        grounds:
          - state_machines.Placement.OFFERED_to_CONFIRMED
          - state_machines.Placement.CONFIRMED_to_TERMINATED
          - entities.PlacementSite.fields.confirmed_active_count
        distinguishing_aspect: |
          Conserved quantity: PlacementSite.confirmed_active_count across a
          confirm/terminate pair — 0 -> 1 -> 0, i.e. the forward action (CONFIRMED)
          and its compensating action (TERMINATED) return the slot ledger to its
          prior value with no drift; a different quantity (site slot count) than
          caseload sum or plan cardinality.
        test_recipe:
          setup:
            - "Site SL (max 5); grade-12 student S; placement P1 [2026-04-01, 2026-06-01) OFFERED"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "L Adv", email: "la@d.org", max_caseload: 50 }, as: DistrictAdmin, captures: { ad_id: $.data.id } }
            - { call: "POST /ccr/placement-sites", payload: { site_code: "SL", name: "Site L", max_concurrent_placements: 5 }, as: DistrictAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "L001", full_name: "Stu L", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad_id}" }, as: DistrictAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /ccr/students/${s_id}/placements", payload: { site_id: "${site_id}", term_start: "2026-04-01T00:00:00Z", term_end: "2026-06-01T00:00:00Z", hours_per_week: 10 }, as: WblCoordinator, captures: { p1_id: $.data.id } }
            - { call: "GET /ccr/placement-sites/${site_id}", as: DistrictAdmin, captures: { cnt0: $.data.confirmed_active_count } }
          trigger:
            - { call: "POST /ccr/placements/${p1_id}/transition", payload: { to_status: "CONFIRMED" }, as: WblCoordinator }
            - { call: "POST /ccr/placements/${p1_id}/transition", payload: { to_status: "TERMINATED" }, as: WblCoordinator }
            - { call: "GET /ccr/placement-sites/${site_id}", as: DistrictAdmin }
          assert:
            - "confirmed_active_count was 0 before the pair"
            - "Placement.${p1_id}.status == TERMINATED and terminated_reason == MANUAL"
            - "INVARIANT: PlacementSite.${site_id}.confirmed_active_count == 0 after CONFIRMED followed by TERMINATED (no ledger drift)"
