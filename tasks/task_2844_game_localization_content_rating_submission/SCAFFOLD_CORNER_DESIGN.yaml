      - name: defect_density_open_set_excludes_verified_rejected_and_duplicate_bugs
        claim_type: input_set_filtering
        grounds:
          - calculations.qa_defect_density.input_set
          - calculations.qa_defect_density.constants
        distinguishing_aspect: "The density numerator is exactly {NEW, TRIAGED, FIX_SUBMITTED}: rejecting a bug, marking one duplicate and verifying a fix each drop out of the sum, while FIX_SUBMITTED stays IN - the most common off-by-one-state error is treating a submitted fix as already resolved."
        test_recipe:
          setup:
            - "Title NOVA-54 driven to LQA (one delivered unit), one LINGUISTIC QaPass with inspected_unit_count 100 opened by lqa-1, and four bugs of severity S1/S2/S3/S4 logged by lqa-1."
