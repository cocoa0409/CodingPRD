          - calculations.pm_compliance_pct
        distinguishing_aspect: "The three-hop teardown is selective: a SCHEDULED visit is cancelled, its assignment released and its technician's minutes returned, while a visit already IN_PROGRESS and its CONFIRMED assignment are left completely alone — and neither counter of pm_compliance_pct moves."
