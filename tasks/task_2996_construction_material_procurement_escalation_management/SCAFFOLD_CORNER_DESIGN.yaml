  - name: variant_divergence_provisional_and_final_escalation_on_the_same_commitment
    claim_type: variant_divergence
    grounds:
    - calculations.escalation_adjustment.variants.provisional_at_release
    - calculations.escalation_adjustment.variants.final_at_delivery
    excluded_because:
      difficulty_instance: dual_variant_calc / escalation_provisional_at_release_versus_final_at_delivery
      rationale: The §1.8 instance runs both variants on one commitment and asserts the 32941.98 -> 55200.00 divergence with the look-back versus exact-month reading selection.
  - name: reconciliation_the_variant_switch_moves_the_project_contingency_by_the_delta
    claim_type: reconciliation
    grounds:
    - calculations.escalation_adjustment.variants.final_at_delivery
    - entities.Project.fields.escalation_contingency_committed
    excluded_because:
      difficulty_instance: dual_variant_calc / escalation_provisional_at_release_versus_final_at_delivery
      rationale: The same §1.8 instance asserts the ledger before and after the switch, so the 22258.02 reconciliation delta is already pinned.
  - name: variant_selection_snapshot_gates_a_buyout_while_forward_gates_a_substitution
    claim_type: variant_selection
    grounds:
    - calculations.supplier_exposure_score.variants.snapshot_exposure
    - calculations.supplier_exposure_score.variants.forward_exposure
    excluded_because:
      difficulty_instance: dual_variant_calc / supplier_exposure_snapshot_versus_forward_on_one_supplier
      rationale: The §1.8 instance proves the correct variant is applied at each gate from one supplier row that is simultaneously LOW on read and refused as a substitute.
  - name: aggregation_reversal_returns_the_running_totals_to_their_pre_release_values
    claim_type: aggregation
    grounds:
    - calculations.buyout_variance
    - entities.Project.fields.escalation_contingency_remaining
    excluded_because:
      difficulty_instance: compensating_invariant / cancel_returns_the_escalation_contingency_ledger_to_zero
      rationale: 'The §1.8 instance is the reversal case for every aggregate on the project: it cancels a released commitment and asserts each sum returns exactly to its pre-release value.'
- section: validations
