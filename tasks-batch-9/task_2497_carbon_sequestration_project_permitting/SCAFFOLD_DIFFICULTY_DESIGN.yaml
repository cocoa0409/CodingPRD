              as_user_id: "reviewer-2"
              captures: { cs_at_approval: $.data.construction_status }
            - call: "POST /ccs/injection-well-permits/${permit_id}/advance-construction"
              payload: { to_construction_status: "DRILLING" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { ps_after_drilling: $.data.permit_status }
            - call: "POST /ccs/injection-well-permits/${permit_id}/advance-construction"
              payload: { to_construction_status: "CASING_SET" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
          assert:
            - "${cs_after_revision} == NOT_STARTED"
            - "${cs_at_approval} == NOT_STARTED"
            - "${rr_after_resubmit} == 2"
            - "${ps_after_drilling} == APPROVED"
            - "InjectionWellPermit.${permit_id}.permit_status == APPROVED"
            - "InjectionWellPermit.${permit_id}.construction_status == CASING_SET"
            - "InjectionWellPermit.${permit_id}.revision_round_count == 2"
            - "InjectionWellPermit.${permit_id}.technical_reviewer_user_id == reviewer-2"
            - "InjectionWellPermit.${permit_id}.authorized_injection_rate_tpy == 0"
            - "InjectionWellPermit.${permit_id}.max_injection_pressure_psi == 4050.00"

      - name: monitoring_plan_fork_join_requires_both_review_tracks
        grounds:
          - state_machines.MonitoringPlan.DRAFT_to_SUBMITTED
          - state_machines.MonitoringPlan.SUBMITTED_to_SUBMITTED
          - state_machines.MonitoringPlan.SUBMITTED_to_REVIEW_COMPLETE
          - state_machines.MonitoringPlan.REVIEW_COMPLETE_to_APPROVED
          - entities.MonitoringPlan.fields.technical_review_complete
          - entities.MonitoringPlan.fields.public_comment_complete
          - validations[priority=63]
        distinguishing_aspect: |
          Fork-join on the MonitoringPlan entity (a different entity from
          permit_status_and_construction_status_advance_independently): SUBMITTED forks two review tracks
          whose flags are set in either order, the join to REVIEW_COMPLETE fires only on the second flag,
          and an APPROVE issued while only public_comment_complete is true is rejected with
          ERR_INVALID_PLAN_STATE (409) rather than approving the plan.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in status DRAFT, operational_posture OPEN"
            - "one MonitoringPlan 'MRV-1' in status SUBMITTED with technical_review_complete false and public_comment_complete false"
            - "three ACTIVE MonitoringMethod rows giving subsurface_subscore 1.0000, surface_subscore 0.8000, atmospheric_subscore 0.5500 and coverage_score 85.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /ccs/monitoring-plans"
              payload: { project_id: "${proj_id}", plan_label: "MRV-1" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /ccs/monitoring-plans/${plan_id}/methods"
              payload: { domain: "SUBSURFACE", technique: "TIME_LAPSE_SEISMIC", detection_threshold_tpy: 500, frequency_per_year: 2, spatial_coverage_pct: 100 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/monitoring-plans/${plan_id}/methods"
              payload: { domain: "SURFACE", technique: "SOIL_GAS_FLUX", detection_threshold_tpy: 100, frequency_per_year: 4, spatial_coverage_pct: 80 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/monitoring-plans/${plan_id}/methods"
              payload: { domain: "ATMOSPHERIC", technique: "EDDY_COVARIANCE", detection_threshold_tpy: 25, frequency_per_year: 12, spatial_coverage_pct: 55 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
            - call: "POST /ccs/monitoring-plans/${plan_id}/submit"
              payload: { submission_note: "MRV plan for review" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
          trigger:
            - call: "POST /ccs/monitoring-plans/${plan_id}/review"
              payload: { decision: "COMPLETE_PUBLIC_COMMENT", review_note: "comment period closed first" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
              captures: { status_after_public: $.data.status, pc_flag: $.data.public_comment_complete, tr_flag: $.data.technical_review_complete }
            - call: "POST /ccs/monitoring-plans/${plan_id}/review"
              payload: { decision: "APPROVE", condition_count: 0, review_note: "premature approval attempt" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
            - call: "POST /ccs/monitoring-plans/${plan_id}/review"
              payload: { decision: "COMPLETE_TECHNICAL_REVIEW", review_note: "technical track closed second" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
              captures: { status_after_join: $.data.status }
            - call: "POST /ccs/monitoring-plans/${plan_id}/review"
              payload: { decision: "APPROVE", condition_count: 0, review_note: "coverage sufficient" }
              as: RegulatoryReviewer
              as_user_id: "reviewer-1"
          assert:
            - "${pc_flag} == true and ${tr_flag} == false"
            - "${status_after_public} == SUBMITTED"
            - "the second trigger call returns HTTP 409 with error_id ERR_INVALID_PLAN_STATE"
            - "${status_after_join} == REVIEW_COMPLETE"
            - "MonitoringPlan.${plan_id}.technical_review_complete == true"
            - "MonitoringPlan.${plan_id}.public_comment_complete == true"
            - "MonitoringPlan.${plan_id}.subsurface_subscore == 1.0000"
            - "MonitoringPlan.${plan_id}.surface_subscore == 0.8000"
            - "MonitoringPlan.${plan_id}.atmospheric_subscore == 0.5500"
            - "MonitoringPlan.${plan_id}.coverage_score == 85.00"
            - "MonitoringPlan.${plan_id}.status == APPROVED"
            - "MonitoringPlan.${plan_id}.condition_count == 0"
            - "StorageProject.${proj_id}.effective_annual_monitoring_cost_usd == 200000"

      - name: tract_negotiation_cycle_counts_three_offer_rounds
        grounds:
          - state_machines.PoreSpaceTract.UNLEASED_to_OFFER_SENT
          - state_machines.PoreSpaceTract.OFFER_SENT_to_COUNTERED
          - state_machines.PoreSpaceTract.COUNTERED_to_OFFER_SENT
          - state_machines.PoreSpaceTract.OFFER_SENT_to_EXECUTED
          - entities.PoreSpaceTract.fields.negotiation_round_count
          - concurrency_rules[tract-offer-stale-tract]
        distinguishing_aspect: |
          Cycle on the PoreSpaceTract entity (a third distinct entity): OFFER_SENT <-> COUNTERED is
          traversed twice before the accepting exit, so negotiation_round_count lands on exactly 3 and the
          executed terms are those of the third offer (20.00 USD per acre, 14.0 percent royalty), while the
          counter field is cleared by the re-offer rather than carried into the executed lease.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in status DRAFT with total_project_acreage 4000"
