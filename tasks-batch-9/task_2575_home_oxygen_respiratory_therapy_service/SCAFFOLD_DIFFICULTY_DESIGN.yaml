      - name: travel_cylinder_pinned_evaluation_order_with_surcharge
        grounds:
          - calculations.travel_supply_authorization
          - calculations.travel_supply_authorization.constants.HANDLING_SURCHARGE_THRESHOLD
          - calculations.travel_supply_authorization.constants.CYLINDER_LITERS
          - calculations.travel_supply_authorization.constants.RESERVE_PCT_TIER_2
          - concurrency_rules[travel-auth-create-stale-contract]
          - endpoints[POST /home-oxygen/rental-contracts/{contract_id}/travel-authorizations]
        distinguishing_aspect: |
          Mode (c): STEP 7 must read cylinders_raw and not supply_cylinders_authorized, so a 40-hour
          trip yields cylinders_raw 5, surcharge 0 and authorized 5, while a 48-hour trip yields
          cylinders_raw 6, surcharge 1 and authorized 7 — an implementation that re-tests the
          threshold against the running authorized total would push 6 -> 7 -> 8 and never settle.
        test_recipe:
          setup:
            - "One branch (Tampa Bay, FL) and one ACTIVE patient at altitude 500 ft."
            - "One GROUP_I study (SpO2 87%) and one ACTIVE certificate prescribing 1.0 LPM, 24 h/day, portable NOT prescribed, lifetime need, three narrative elements (documentation_score 100.00)."
