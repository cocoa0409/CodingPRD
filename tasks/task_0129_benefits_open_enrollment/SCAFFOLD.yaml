    output: Employee
    side_effects: ["eligibility_status set INELIGIBLE if SEASONAL else WAITING"]

  - method: GET
    path: "/employees/{id}"
    description: "Fetch an employee"
    roles: [BenefitsAdmin, PayrollOfficer, ComplianceOfficer, DependentVerifier]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: GET
    path: "/employees"
    description: "List employees (paginated)"
    roles: [BenefitsAdmin, PayrollOfficer, ComplianceOfficer, DependentVerifier]
    code: 200
    input: ["employment_type?", "eligibility_status?", "limit?", "offset?"]
    output: Employee[]
    side_effects: []

  - method: POST
    path: "/employees/{id}/terminate"
    description: "Terminate an employee; cascades to supersede ACTIVE enrollments and emit TERM feed records"
