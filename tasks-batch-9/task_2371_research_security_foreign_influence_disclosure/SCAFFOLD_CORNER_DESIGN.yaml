              as: Investigator
              as_user_id: "${inv_id}"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /disclosures/${d_id}/submit"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /project-personnel/${pp_sp}/status"
              payload: { to_status: "ACTIVE" }
              as: SystemAdmin
            - call: "POST /projects/${p_id}/security-status"
              payload: { to_status: "CLEARED" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
          assert:
            - "after setup: incident status == AGENCY_NOTIFIED, notified_late == false, Investigator.${inv_id}.disclosure_posture == SUSPENDED"
            - "creating the disclosure itself succeeded — suspension gates transitions, not record keeping"
            - "call 1 returns 409 with data.error_id == ERR_INVESTIGATOR_SUSPENDED and the disclosure stays DRAFT"
            - "call 2 returns 409 with data.error_id == ERR_INVESTIGATOR_SUSPENDED; committed_effort_pct stays 50.00 (only the PI row counts)"
            - "call 3 returns 409 with data.error_id == ERR_INVESTIGATOR_SUSPENDED and security_status stays PENDING_CLEARANCE"
            - "Project.${p_id}.activation_blockers == [SECURITY_NOT_CLEARED, DISCLOSURE_NOT_CERTIFIED, INVESTIGATOR_SUSPENDED] in BLOCKER_ORDER"

      - name: stale_parent_version_error_is_covered_by_the_priority_probe
        claim_type: error_triggerable
        grounds:
          - errors.ERR_STALE_VERSION
          - concurrency_rules
        excluded_because:
          difficulty_instance: body_fk_existence_outranks_optimistic_concurrency_on_grant_create
          rationale: "That instance issues the same grant create with a stale expected_project_version and asserts the 412 ERR_STALE_VERSION in isolation before showing that a bad body FK outranks it, so a standalone 412 corner would duplicate it."

      - name: activation_blocked_error_is_covered_by_the_blocker_order_probe
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ACTIVATION_BLOCKED
          - calculations.project_activation_blockers
        excluded_because:
          difficulty_instance: project_activation_depends_on_disclosure_then_training_in_blocker_order
          rationale: "The cross-entity dependency instance already asserts ERR_ACTIVATION_BLOCKED twice with the message naming activation_blockers[0] as it walks the blocker list down to empty."

      - name: area_capacity_and_training_errors_are_covered_by_the_priority_probe
        claim_type: error_triggerable
        grounds:
          - errors.ERR_AREA_CAPACITY_EXCEEDED
          - errors.ERR_AREA_TRAINING_INCOMPLETE
        excluded_because:
          difficulty_instance: area_training_check_outranks_area_capacity_check_on_activation
          rationale: "Both codes are triggered there from a single fixture: the training code first while the capacity violation is also present, then the capacity code once the training is completed."

      - name: restricted_entity_error_is_covered_by_the_terminal_state_probe
        claim_type: error_triggerable
        grounds:
          - errors.ERR_RESTRICTED_ENTITY_BLOCKED
          - errors.ERR_INVALID_SUBAWARD_TRANSITION
        excluded_because:
          difficulty_instance: terminal_state_check_outranks_restricted_entity_check_on_mitigation
          rationale: "The SDN mitigation attempt raises ERR_RESTRICTED_ENTITY_BLOCKED there while the subaward is still BLOCKED, and ERR_INVALID_SUBAWARD_TRANSITION once it is TERMINATED."

      - name: incident_join_errors_are_covered_by_the_convergence_probe
        claim_type: error_triggerable
        grounds:
          - errors.ERR_AGENCY_NOTIFICATION_REQUIRED
          - errors.ERR_REMEDIATION_INCOMPLETE
        excluded_because:
          difficulty_instance: incident_closure_requires_both_branch_legs_to_converge
          rationale: "Both join-point codes are raised there in sequence, which is the only place their ordering relative to each other is observable."

      - name: travel_window_conflict_error_is_covered_by_the_closed_interval_probe
        claim_type: error_triggerable
        grounds:
          - errors.ERR_TRAVEL_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: travel_windows_are_closed_so_adjacent_trips_conflict
          rationale: "The touching-endpoint case is the sharpest trigger for this code and is already asserted alongside the one-day-gap success case."

      - name: grant_precondition_errors_are_covered_by_the_dependency_probe
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PROJECT_NOT_CLEARED
          - errors.ERR_INVESTIGATOR_POSTURE_BLOCKS_ACCESS
        excluded_because:
          difficulty_instance: grant_activation_depends_on_project_security_and_investigator_posture_and_plan
          rationale: "Both codes are asserted there as the three independent dimensions are satisfied one at a time, which also fixes their evaluation order."

      - name: reject_too_early_error_is_covered_by_the_revision_cycle_probe
        claim_type: error_triggerable
        grounds:
          - errors.ERR_REJECT_TOO_EARLY
          - errors.ERR_INVALID_DISCLOSURE_TRANSITION
        excluded_because:
          difficulty_instance: disclosure_revision_cycle_gates_reject_until_second_round
          rationale: "ERR_REJECT_TOO_EARLY only exists relative to revision_round, so it is asserted at round 0 and round 1 there before the round-2 REJECT succeeds."

