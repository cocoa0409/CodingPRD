            - call: "POST /procedure-bookings/${bk_b}/complete"
              payload: { prep_quality_bbps: 8, polyps_removed_count: 0, largest_polyp_mm: 0, specimen_count: 1 }
              as: Endoscopist
              as_user_id: "${endo_id}"
            - call: "POST /procedure-bookings/${bk_b}/pathology-reports"
              payload: { accession_number: "ACC-B", specimens: [ { label: "A", histology: "NORMAL_MUCOSA", size_mm: 0 } ], high_grade_dysplasia: false }
              as: Pathologist
              captures: { rep_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T10:00:00Z" }
              as: PracticeAdmin
            - call: "POST /pathology-reports/${rep_b}/finalize"
              payload: {}
              as: Pathologist
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-06T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /quality-periods"
              payload: { endoscopist_id: "${endo_id}", period_start_date: "2026-09-01", period_end_date: "2026-09-30", attribution_basis: "PROCEDURE_DATE" }
              as: QualityOfficer
              captures: { qp_proc: $.data.id }
            - call: "POST /quality-periods"
