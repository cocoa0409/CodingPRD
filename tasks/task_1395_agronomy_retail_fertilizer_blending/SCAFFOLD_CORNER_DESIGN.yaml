      - name: rbac_grower_cannot_read_other_grower_account
        claim_type: rbac_denied
        grounds:
          - roles.Grower
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Entity-backed ownership: Grower A reading Grower B's account is denied 403 (X-User-ID must equal the path grower id)."
        test_recipe:
          setup: ["growers A and B exist"]
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Grower A", credit_limit_cents: 100000 }
              as: CreditManager
              captures: { ga_id: $.data.id }
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Grower B", credit_limit_cents: 200000 }
              as: CreditManager
              captures: { gb_id: $.data.id }
          trigger:
            - call: "GET /agronomy/growers/${gb_id}"
              as: Grower
              as_user_id: "${ga_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE"

      - name: rbac_dispatcher_cannot_fund_prepay_contract
        claim_type: rbac_denied
        grounds:
          - roles.CreditManager
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Contract funding is CreditManager-exclusive; LogisticsDispatcher is denied."
        test_recipe:
          setup: ["grower, MOP sheet, FALL program, SIGNED contract"]
