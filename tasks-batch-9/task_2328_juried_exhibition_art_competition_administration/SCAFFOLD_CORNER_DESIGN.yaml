            - "POST /entries/${e1_id}/withdraw as CallManager returns 200 with Entry.${e1_id}.status == WITHDRAWN and Artwork.${aw_id}.status == WITHDRAWN"
            - "every one of these calls is a shared operation, so none returns ERR_ROLE_NOT_PERMITTED"

  # =========================================================================
  # SECTION: cross_cutting_layers
  # One OCC instance per §1.2.1 concurrency rule (write_endpoint + occ_field),
  # plus stubs for the layers already driven by §1.8.
  # =========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_assignment_create_stale_jury_round_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assignment-create-stale-round]
          - endpoints[POST /jury-rounds/{id}/assignments]
        distinguishing_aspect: "Booking a session bumps the round's version even though the created row is a JurorAssignment, so a chair who read the round once and books twice from that read must be refused on the second call with 412 and succeed after re-reading."
        test_recipe:
          setup: ["Exhibition JURYING; jurors j1 and j2 CONFIRMED; round 1 PENDING with version captured once as r1_v1."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
            - { call: "POST /exhibitions", payload: { title: "Regional Juried Biennial", season_year: 2026, call_opens_at: "2026-09-01T00:00:00Z", call_closes_at: "2026-10-01T00:00:00Z", notification_at: "2026-10-20T00:00:00Z", delivery_window_start_at: "2026-11-02T00:00:00Z", delivery_window_end_at: "2026-11-06T23:59:59Z", opening_at: "2026-11-12T18:00:00Z", closing_at: "2026-12-13T00:00:00Z", entry_fee_base_cents: 4500, entry_fee_additional_cents: 1500, max_dimension_cm: 200, max_weight_kg: 40, per_work_insurance_cap_cents: 5000000, allowed_media_categories: ["PAINTING", "PHOTOGRAPHY", "SCULPTURE"], eligible_state_codes: ["CA", "OR"], acceptance_capacity: 3, waitlist_capacity: 1, jury_quorum: 1, advance_score_threshold: 7.0, score_weight_technique: 0.4, score_weight_originality: 0.35, score_weight_relevance: 0.25, commission_pct: 0.35, sales_tax_pct: 0.0875, award_budget_cents: 500000, claim_deadline_days: 30, works_included_in_base: 2, member_discount_pct: 0.175, max_works_per_entry: 5, max_entries_per_artist: 1 }, as: CallManager, captures: { ex_id: $.data.id } }
            - { call: "POST /exhibitions/${ex_id}/phase-advance", payload: { target_status: "OPEN_FOR_ENTRIES" }, as: CallManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: CallManager }
            - { call: "POST /exhibitions/${ex_id}/phase-advance", payload: { target_status: "JURYING" }, as: CallManager }
            - { call: "POST /jurors", payload: { display_name: "Iris Vega", email: "iris@example.org", expertise_categories: ["PAINTING"], honorarium_cents: 50000 }, as: JuryChair, captures: { j1_id: $.data.id } }
            - { call: "POST /jurors/${j1_id}/confirm", payload: {}, as: Juror, as_user_id: "${j1_id}" }
            - { call: "POST /jurors", payload: { display_name: "Omar Fell", email: "omar@example.org", expertise_categories: ["PAINTING"], honorarium_cents: 40000 }, as: JuryChair, captures: { j2_id: $.data.id } }
            - { call: "POST /jurors/${j2_id}/confirm", payload: {}, as: Juror, as_user_id: "${j2_id}" }
            - { call: "POST /jury-rounds", payload: { exhibition_id: "${ex_id}", round_number: 1, round_type: "BLIND_SCORING", opens_at: "2026-10-05T00:00:00Z", closes_at: "2026-10-12T00:00:00Z", quorum_required: 2 }, as: JuryChair, captures: { r1_id: $.data.id, r1_v1: $.data.version } }
          trigger:
            - { call: "POST /jury-rounds/${r1_id}/assignments", payload: { juror_id: "${j1_id}", session_start_at: "2026-10-06T09:00:00Z", session_end_at: "2026-10-06T13:00:00Z", expected_jury_round_version: "${r1_v1}" }, as: JuryChair, captures: { asg1_id: $.data.id } }
            - { call: "POST /jury-rounds/${r1_id}/assignments", payload: { juror_id: "${j2_id}", session_start_at: "2026-10-07T09:00:00Z", session_end_at: "2026-10-07T11:00:00Z", expected_jury_round_version: "${r1_v1}" }, as: JuryChair, captures: { e_stale: $.data.error_id } }
            - { call: "GET /jury-rounds/${r1_id}", payload: {}, as: JuryChair, captures: { r1_v2: $.data.version } }
            - { call: "POST /jury-rounds/${r1_id}/assignments", payload: { juror_id: "${j2_id}", session_start_at: "2026-10-07T09:00:00Z", session_end_at: "2026-10-07T11:00:00Z", expected_jury_round_version: "${r1_v2}" }, as: JuryChair, captures: { asg2_id: $.data.id } }
          assert:
            - "the first booking succeeds and JuryRound.${r1_id}.version becomes ${r1_v1} + 1"
            - "the second booking reusing ${r1_v1} returns 412 ERR_STALE_VERSION and creates no JurorAssignment"
            - "JuryRound.${r1_id}.assignment_count stays 1 and Juror.${j2_id}.assignment_count stays 0 after the refusal"
            - "the identical retry with the re-read ${r1_v2} returns 201, so the only cause of the refusal was the stale version"
            - "after the retry assignment_count == 2 and version has advanced twice from ${r1_v1}"

