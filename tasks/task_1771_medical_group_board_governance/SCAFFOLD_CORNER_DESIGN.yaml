        grounds: ["errors[ERR_DISPUTE_LIMIT_REACHED]"]
        excluded_because: { difficulty_instance: "non_linear_state_machine / exit_valuation_appraised_disputed_cycle", rationale: "Asserted as the third-dispute failure of the named §1.8 instance." }
      - name: error_committee_impaired_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_COMMITTEE_IMPAIRED]"]
        excluded_because: { difficulty_instance: "cross_entity_state_dependency / charter_amendment_open_requires_active_committee", rationale: "Asserted as the blocked-open path of the named §1.8 instance." }
      - name: error_buyout_not_approved_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_BUYOUT_NOT_APPROVED]"]
        excluded_because: { difficulty_instance: "cross_entity_state_dependency / exit_finalize_requires_adopted_buyout_motion", rationale: "Asserted as the failure path of the named §1.8 instance." }
      - name: error_distribution_cap_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_DISTRIBUTION_CAP_EXCEEDED]"]
        excluded_because: { difficulty_instance: "combinatorial_formula / distributable_cap_bonus_first_evaluation_order", rationale: "Asserted as the over-cap create failure of the named §1.8 instance." }
      - name: error_assessment_not_payable_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_ASSESSMENT_NOT_PAYABLE]"]
        excluded_because: { difficulty_instance: "priority_pair_validation_conflict / assessment_pay_state_beats_fiscal", rationale: "Asserted as the winning error of the named §1.8 instance." }
      - name: error_voter_recused_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_VOTER_RECUSED]"]
        excluded_because: { difficulty_instance: "priority_pair_validation_conflict / recused_vote_safety_beats_temporal", rationale: "Asserted as the winning error of the named §1.8 instance." }

  # ===================================================== 7. rbac
  - section: rbac
    instances:
      - name: physician_cannot_administer_forbidden
        claim_type: rbac_denial
        grounds: [roles, "validations[priority=3]"]
        distinguishing_aspect: "Physician role is denied BoardAdmin exclusives: creating physicians, creating board seats, billing a capital call all return ERR_FORBIDDEN."
        test_recipe:
          setup: ["Policy; SHAREHOLDER A acting as caller"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
          trigger:
            - { call: "POST /governance/physicians", payload: { full_name: "Dr Rogue", hire_date: "2020-01-01T00:00:00Z" }, as: Physician, as_user_id: "${a_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /governance/board-seats", payload: { seat_label: "SEAT-X", seat_class: AT_LARGE }, as: Physician, as_user_id: "${a_id}", captures: { err2: $.data.error_id } }
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 5 }, as: Physician, as_user_id: "${a_id}", captures: { err3: $.data.error_id } }
          assert:
            - "err1 == err2 == err3 == ERR_FORBIDDEN (HTTP 403)"

      - name: compliance_officer_exclusive_coi_review
        claim_type: rbac_denial
        grounds: [roles]
        distinguishing_aspect: "Segregation of duties at the role level: BoardAdmin may NOT review COI disclosures (ERR_FORBIDDEN) and ComplianceOfficer may NOT perform admin actions like billing; only ComplianceOfficer reviews."
        test_recipe:
          setup: ["Policy quorum 1; SHAREHOLDERs A, B; OPEN motion; B's FILED disclosure; an adopted+billed capital call awaiting nothing"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr B", hire_date: "2016-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 50000, due_date: "2026-08-20T00:00:00Z", purpose: "RBAC" } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/coi-disclosures", payload: { related_motion_id: "${m_id}", description: "Review target" }, as: Physician, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin }
            - { call: "GET /governance/capital-calls?motion_id=${m_id}", as: BoardAdmin, captures: { cc_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /governance/coi-disclosures/${d_id}/review", payload: { outcome: CLEARED }, as: BoardAdmin, captures: { err_admin: $.data.error_id } }
            - { call: "POST /governance/capital-calls/${cc_id}/bill", payload: {}, as: ComplianceOfficer, captures: { err_co: $.data.error_id } }
            - { call: "POST /governance/coi-disclosures/${d_id}/review", payload: { outcome: CLEARED }, as: ComplianceOfficer }
          assert:
            - "err_admin == ERR_FORBIDDEN (admin is not the compliance reviewer — SoD)"
            - "err_co == ERR_FORBIDDEN (compliance cannot bill)"
            - "ComplianceOfficer review succeeds: COIDisclosure.${d_id}.status == CLEARED, reviewed_by set"

      - name: physician_close_motion_forbidden
        claim_type: rbac_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Tallying is a BoardAdmin exclusive: the sponsoring Physician closing their own OPEN motion gets ERR_FORBIDDEN even though every other precondition holds."
        test_recipe:
          setup: ["Policy quorum 1; SHAREHOLDER A; motion OPEN with A's FOR ballot"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 50000, due_date: "2026-08-20T00:00:00Z", purpose: "RBAC close" } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${a_id}" }
          trigger:
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: Physician, as_user_id: "${a_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN; motion remains OPEN"

  # ===================================================== 8. cross-cutting layers
  - section: cross_cutting_layers
    instances:
      - name: occ_policy_update_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[policy-update-stale-version]"]
        distinguishing_aspect: "PATCH with the just-read version succeeds and bumps version to 2; replaying the same stale expected_policy_version is then rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Policy created (version 1)"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin, captures: { pol_v: $.data.version } }
          trigger:
            - { call: "PATCH /governance/policy", payload: { expected_policy_version: "${pol_v}", board_quorum_count: 7 }, as: BoardAdmin, captures: { pol_v2: $.data.version } }
            - { call: "PATCH /governance/policy", payload: { expected_policy_version: "${pol_v}", board_quorum_count: 9 }, as: BoardAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /governance/policy", as: BoardAdmin }
          assert:
            - "First PATCH succeeds: version 2, board_quorum_count == 7"
            - "Second PATCH with stale version: err == ERR_STALE_VERSION, HTTP 412"
            - "Policy still has board_quorum_count == 7 (failed write applied nothing)"

      - name: occ_valuation_appraise_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[valuation-appraise-stale-version]"]
        distinguishing_aspect: "A corrected appraisal supersedes the prior one legitimately; a writer holding the pre-correction version is rejected 412 ERR_STALE_VERSION while the fresh-version rewrite succeeds."
        test_recipe:
          setup: ["Policy; sole SHAREHOLDER X; exit valuation INITIATED (version 1)"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr X", hire_date: "2010-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { x_id: $.data.id } }
            - { call: "POST /governance/exit-valuations", payload: { physician_id: "${x_id}", trigger_type: VOLUNTARY }, as: BoardAdmin, captures: { v_id: $.data.id, v1: $.data.version } }
          trigger:
            - { call: "POST /governance/exit-valuations/${v_id}/appraise", payload: { appraised_practice_value_cents: 90000000, expected_valuation_version: "${v1}" }, as: BoardAdmin, captures: { v2: $.data.version } }
            - { call: "POST /governance/exit-valuations/${v_id}/appraise", payload: { appraised_practice_value_cents: 80000000, expected_valuation_version: "${v1}" }, as: BoardAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /governance/exit-valuations/${v_id}/appraise", payload: { appraised_practice_value_cents: 95000000, expected_valuation_version: "${v2}" }, as: BoardAdmin }
          assert:
            - "First appraise succeeds: APPRAISED, final_value_cents == 76500000 (90000000 x 1.0 x 0.85), version 2"
            - "Stale replay: err == ERR_STALE_VERSION (412); value unchanged"
            - "Fresh-version correction succeeds: final_value_cents == 80750000 (95000000 x 0.85), version 3"

      - name: ownership_and_treasury_reconcile_after_exit
        claim_type: derived_field_reconciliation
        grounds: [calculations.ownership_recalc, entities.Physician.fields.ownership_pct]
        distinguishing_aspect: "Derived fields reconcile immediately after the exit cascade: the remaining shareholder's ownership_pct becomes 1.0 and treasury_shares reflects the returned 1000 shares."
        test_recipe:
          setup: ["Policy quorum 1, 1000000 authorized; X 1000 shares exiting, Y 1000 shares remaining; valuation APPRAISED; BUYOUT_APPROVAL adopted"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr X", hire_date: "2010-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { x_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr Y", hire_date: "2011-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { y_id: $.data.id } }
            - { call: "POST /governance/exit-valuations", payload: { physician_id: "${x_id}", trigger_type: RETIREMENT }, as: BoardAdmin, captures: { v_id: $.data.id, v_v: $.data.version } }
            - { call: "POST /governance/exit-valuations/${v_id}/appraise", payload: { appraised_practice_value_cents: 90000000, expected_valuation_version: "${v_v}" }, as: BoardAdmin }
            - { call: "POST /governance/motions", payload: { motion_type: BUYOUT_APPROVAL, sponsor_physician_id: "${y_id}", payload: { exit_valuation_id: "${v_id}" } }, as: Physician, as_user_id: "${y_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${y_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${y_id}" }
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: FOR }, as: Physician, as_user_id: "${y_id}" }
            - { call: "POST /governance/motions/${m_id}/close", payload: {}, as: BoardAdmin }
          trigger:
            - { call: "POST /governance/exit-valuations/${v_id}/finalize", payload: { motion_id: "${m_id}" }, as: BoardAdmin }
            - { call: "GET /governance/physicians/${y_id}", as: BoardAdmin }
            - { call: "GET /governance/policy", as: BoardAdmin }
          assert:
            - "Physician.${y_id}.ownership_pct == 1.0 (sole remaining holder)"
            - "GovernancePolicy.treasury_shares == 999000"
            - "GET /governance/physicians?partnership_status=SHAREHOLDER returns exactly [Y]"

      - name: clock_sweep_aggregate_report
        claim_type: cascading_side_effects
        grounds: [entities.Motion.fields.closes_at, entities.BuyInOffer.fields.acceptance_deadline]
        distinguishing_aspect: "One clock-set fans out into all sweeps and reports them: an OPEN motion past closes_at and an OFFERED offer past deadline are both expired by the same call, with swept_counts reporting each."
        test_recipe:
          setup: ["Policy defaults (window 14d, offer window 30d, quorum 1); SHAREHOLDER A; motion OPEN since 2026-08-01 (closes 2026-08-15); offer to associate P OFFERED since 2026-08-01 (deadline 2026-08-31)"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr P", hire_date: "2024-01-01T00:00:00Z" }, as: BoardAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 50000, due_date: "2026-12-01T00:00:00Z", purpose: "Sweep" } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/buy-in-offers", payload: { physician_id: "${p_id}", target_tier: PARTNER_TRACK, share_grant: 0, installment_count: 1 }, as: BoardAdmin, captures: { o_id: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BoardAdmin }
          assert:
            - "Response: current_utc == 2026-09-01T00:00:00Z and swept_counts reports 1 expired motion and 1 expired offer"
            - "Motion.${m_id}.status == EXPIRED; BuyInOffer.${o_id}.status == EXPIRED"

  # ===================================================== 9. consistency model
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate
        grounds: [response_envelope]
        distinguishing_aspect: "Immediate consistency: a created entity is retrievable in the very next request, and a cast ballot is reflected in the motion's tallies on the immediately following GET."
        test_recipe:
          setup: ["Policy quorum 1; SHAREHOLDER A; OPEN motion"]
          setup_api_calls:
            - { call: "POST /governance/policy", payload: { total_shares_authorized: 1000000, board_quorum_count: 1 }, as: BoardAdmin }
            - { call: "POST /governance/physicians", payload: { full_name: "Dr A", hire_date: "2015-01-01T00:00:00Z", founding_shareholder: true, initial_shares: 1000 }, as: BoardAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /governance/motions", payload: { motion_type: CAPITAL_CALL, sponsor_physician_id: "${a_id}", payload: { amount_cents: 50000, due_date: "2026-08-20T00:00:00Z", purpose: "Consistency" } }, as: Physician, as_user_id: "${a_id}", captures: { m_id: $.data.id } }
            - { call: "POST /governance/motions/${m_id}/propose", payload: {}, as: Physician, as_user_id: "${a_id}" }
            - { call: "POST /governance/motions/${m_id}/open", payload: {}, as: Physician, as_user_id: "${a_id}" }
          trigger:
            - { call: "POST /governance/motions/${m_id}/votes", payload: { vote_choice: AGAINST }, as: Physician, as_user_id: "${a_id}", captures: { vote_id: $.data.id } }
            - { call: "GET /governance/motions/${m_id}", as: ComplianceOfficer }
          assert:
            - "GET immediately after the vote: Motion.${m_id}.votes_against == 1 and eligible_voter_count == 1 (no lag, no recompute delay)"
            - "Vote.${vote_id} visible in GET /governance/motions/${m_id}/votes immediately"
