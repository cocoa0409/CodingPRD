  - rule_id: cross_entity_state_dependency
    instances:
      - name: commitment_activation_requires_open_program
        grounds:
          - state_machines.ServiceCommitment.ASSIGNED_to_ACTIVE
          - state_machines.EsyProgram.STAFFING_LOCKED_to_OPEN
          - validations.priority_9_ERR_INVALID_STATE
          - endpoints.POST_/esy/service-commitments/{commitment_id}/status
        distinguishing_aspect: |
          ENTITY PAIR ServiceCommitment x EsyProgram. The commitment's own state is
          already legal (ASSIGNED) and the request body is identical in both attempts;
          only the PARENT program's state differs. STAFFING_LOCKED blocks activation
          with ERR_INVALID_STATE, OPEN permits it, so the gate is proven to read the
          other entity rather than the commitment.
