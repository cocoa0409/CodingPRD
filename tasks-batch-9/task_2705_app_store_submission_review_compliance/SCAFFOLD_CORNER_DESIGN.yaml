          - errors.ERR_REJECTION_NOT_CONTESTED
        distinguishing_aspect: "The appeal gate reads the cited RejectionReason's disposition, not the submission state: with the reason still PENDING the same body returns 409 ERR_REJECTION_NOT_CONTESTED and the build stays REJECTED."
        test_recipe:
          setup:
