          setup:
            - "member c14 ELIGIBLE, limit 2000 (2 settled deposits, tenure 365d)"
            - "a qualifying deposit settled then returned (demotion) -> second eval computes bucket 0 -> score 250 -> score_cap 2000, but n==1 -> bucket 0 -> score 250 >= 200 -> limit min(2000,2000,20000)=2000; sharpen: use member with ONE settled deposit only (n==1 -> bucket 0 -> score 250 -> limit 2000) then return it -> n==0 bucket 0 -> score 250 — flat; instead pin: member with 2 settled deposits evaluated to 2000, then BOTH deposits returned -> n==0, returned_in_window true, score 250 -> score_cap 2000 == no decrease. FINAL PIN: member has 4 settled deposits (bucket 300, score 550, score_cap 10000, repay_cap 2000 -> limit 2000); after 2 deposits returned n==2 bucket 150 demoted to 0 -> score 250 -> score_cap 2000 -> limit still 2000. The observable decrease instead comes from SUSPENSION-adjacent case already covered; HERE pin the PENDING_NOTICE mechanics via a constructed higher limit: member with 6 settled deposits + 1 on-time repayment -> score 400+250+25=675 -> score_cap 10000, repay_cap 5000, tenure_cap 20000 -> limit 5000; then 4 deposits returned -> n==2, demoted bucket 0 -> score 250+25=275 -> score_cap 2000 -> DECREASE 5000 -> 2000 PENDING_NOTICE"
