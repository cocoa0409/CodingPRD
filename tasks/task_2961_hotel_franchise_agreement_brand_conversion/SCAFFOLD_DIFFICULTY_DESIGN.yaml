# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2961 — Hotel Franchise Agreement & Brand Conversion
#
# Nine §0.5 rule_id blocks, two differentiated instances each (18 total).
# Every literal in an `assert:` was computed with decimal.Decimal / ROUND_HALF_UP
# against the §1.3 formula and its `constants:` block, and every date literal was
# computed by day arithmetic from the logical clock the chain last set.
# The logical clock reads 2026-08-01T00:00:00Z before the first set_current_utc
# call, per §1.5's POST /_clock/set_current_utc description.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: owner_capacity_standalone_vs_portfolio_adjusted_diverges_in_both_directions
        grounds:
          - calculations.owner_capacity_score
          - entities.Owner.fields.capacity_score_standalone
          - entities.Owner.fields.capacity_score_portfolio_adjusted
          - entities.Owner.fields.capacity_band_standalone
          - entities.Owner.fields.capacity_band_portfolio_adjusted
        distinguishing_aspect: |
          Entity domain: risk scoring on an Owner. The reserve deduction and the experience bonus
          pull in opposite directions, so PORTFOLIO_ADJUSTED is 2.25 points BELOW STANDALONE on a
          thin-liquidity three-unit owner (49.35 vs 51.60) and 3.33 points ABOVE it on a liquid
          four-unit owner (100.00 vs 96.67) — one shared formula cannot produce a sign reversal.
        test_recipe:
          setup:
            - "Empty database; logical clock parked at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FranchiseDevelopmentManager
          trigger:
            - call: "POST /owners"
              payload: { legal_name: "Cascade Thin Portfolio LLC", contact_email: "thin@cascadethin.example", liquid_assets_amount: 2400000.00, net_worth_amount: 7500000.00, credit_score: 680, existing_units_count: 3 }
              as: FranchiseDevelopmentManager
              captures: { owner_thin_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Harbor Point Hospitality LP", contact_email: "deals@harborpointhosp.example", liquid_assets_amount: 6000000.00, net_worth_amount: 18000000.00, credit_score: 760, existing_units_count: 4 }
              as: FranchiseDevelopmentManager
              captures: { owner_strong_id: $.data.id }
          assert:
            - "Owner.${owner_thin_id}.capacity_score_standalone == 51.60"
            - "Owner.${owner_thin_id}.capacity_score_portfolio_adjusted == 49.35"
            - "Owner.${owner_thin_id}.capacity_band_standalone == INSUFFICIENT"
            - "Owner.${owner_thin_id}.capacity_band_portfolio_adjusted == INSUFFICIENT"
            - "Owner.${owner_strong_id}.capacity_score_standalone == 96.67"
            - "Owner.${owner_strong_id}.capacity_score_portfolio_adjusted == 100.00"
            - "Owner.${owner_strong_id}.capacity_band_standalone == STRONG"
            - "Owner.${owner_strong_id}.capacity_band_portfolio_adjusted == STRONG"
            - "Owner.${owner_thin_id}.capacity_score_portfolio_adjusted < Owner.${owner_thin_id}.capacity_score_standalone, while Owner.${owner_strong_id}.capacity_score_portfolio_adjusted > Owner.${owner_strong_id}.capacity_score_standalone"
            - "Owner.${owner_thin_id}.financial_profile_revision == 0 and Owner.${owner_thin_id}.status == PROSPECT"

      - name: liquidated_damages_discounted_pv_on_mutual_termination
        grounds:
          - calculations.liquidated_damages
          - state_machines.LicenseAgreement.OPEN_to_TERMINATION_PENDING
          - entities.LicenseAgreement.fields.liquidated_damages_formula
          - entities.LicenseAgreement.fields.liquidated_damages_amount
          - entities.LicenseAgreement.fields.trailing_avg_monthly_fee
          - validations[priority=41]
        distinguishing_aspect: |
          Entity domain: exit-cost accounting on a LicenseAgreement, not owner risk scoring. From
          trailing_avg_monthly_fee == 32000.01 and capped_months == 36, the MUTUAL cause selects
          DISCOUNTED_PV and freezes 1051872.86, exactly 100127.50 below the 1152000.36 that the
          CONTRACTUAL_MULTIPLE variant freezes from the identical basis (see corner instance
          liquidated_damages_contractual_multiple_on_for_cause_qa_termination).
        test_recipe:
          setup:
            - "Brand SOLARIS (base royalty 5.00, marketing 2.50, radius 5.00, min rooms 80, standard term 20 years) with no existing units, so the market impact study scores 0.00."
            - "A STRONG four-unit owner; a 120-room COMPETITOR conversion approved and licensed at royalty 5.25 / marketing 2.50 / term 20, effective 2026-10-01 and expiring 2046-10-01."
            - "Agreement OPEN since 2026-11-01 with two surviving revenue periods (2026-11 and 2026-12) totalling 78000.02 in assessed fees."
            - "Logical clock at 2027-03-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FranchiseDevelopmentManager
            - call: "POST /brands"
              payload: { code: "SOLARIS", name: "Solaris Collection", tier: "UPSCALE", base_royalty_rate_pct: 5.00, marketing_fund_rate_pct: 2.50, protected_radius_miles: 5.00, min_room_count: 80, standard_term_years: 20 }
              as: BrandStandardsDirector
              captures: { brand_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Harbor Point Hospitality LP", contact_email: "deals@harborpointhosp.example", liquid_assets_amount: 6000000.00, net_worth_amount: 18000000.00, credit_score: 760, existing_units_count: 4 }
              as: FranchiseDevelopmentManager
              captures: { owner_id: $.data.id }
            - call: "POST /applications"
              payload: { owner_id: "${owner_id}", brand_id: "${brand_id}", property_name: "Harbor Point Hotel", market_code: "SEADT", property_x_miles: 0.00, property_y_miles: 0.00, room_count: 120, current_affiliation: "COMPETITOR", building_age_years: 18, requested_term_years: 20, requested_conversion_date: "2026-10-01" }
              as: FranchiseDevelopmentManager
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: FranchiseDevelopmentManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: FranchiseDevelopmentManager
            - call: "POST /applications/${app_id}/financial-review"
              payload: { capacity_basis: "PORTFOLIO_ADJUSTED" }
              as: FranchiseDevelopmentManager
              as_user_id: "fdm-review-01"
            - call: "POST /applications/${app_id}/impact-analysis"
              payload: {}
              as: BrandStandardsDirector
            - call: "POST /applications/${app_id}/finalize-impact"
              payload: {}
              as: BrandStandardsDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FranchiseDevelopmentManager
            - call: "POST /applications/${app_id}/decision"
              payload: { outcome: "APPROVE", decision_notes: "Approved by development committee." }
              as: FranchiseDevelopmentManager
              as_user_id: "fdm-decision-02"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: FranchiseDevelopmentManager
            - call: "POST /applications/${app_id}/agreements"
              payload: { effective_date: "2026-10-01" }
              as: FranchiseDevelopmentManager
              captures: { agr_id: $.data.id }
            - call: "GET /applications/${app_id}"
              payload: {}
              as: FranchiseDevelopmentManager
              captures: { app_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: FranchiseDevelopmentManager
            - call: "POST /agreements/${agr_id}/execute"
              payload: { expected_application_version: "${app_v}" }
              as: FranchiseDevelopmentManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: BrandStandardsDirector
            - call: "POST /agreements/${agr_id}/pips"
              payload: { scope_notes: "Full brand conversion scope, three work packages." }
              as: BrandStandardsDirector
              captures: { pip_id: $.data.id }
            - call: "POST /pips/${pip_id}/items"
              payload: { category: "GUESTROOM", priority: "MAJOR", description: "Guestroom soft goods and case goods replacement", estimated_cost: 2400000.00 }
              as: BrandStandardsDirector
              captures: { item_guest_id: $.data.id }
            - call: "POST /pips/${pip_id}/items"
              payload: { category: "LIFE_SAFETY", priority: "CRITICAL", description: "Sprinkler and addressable alarm upgrade", estimated_cost: 480000.00 }
              as: BrandStandardsDirector
              captures: { item_ls_id: $.data.id }
            - call: "POST /pips/${pip_id}/items"
              payload: { category: "EXTERIOR", priority: "MINOR", description: "Porte-cochere rebuild and signage", estimated_cost: 240000.00 }
              as: BrandStandardsDirector
              captures: { item_ext_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: BrandStandardsDirector
            - call: "POST /pips/${pip_id}/accept"
              payload: { acknowledgement: "ACCEPTED_IN_FULL" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: Owner
            - call: "POST /pip-items/${item_ls_id}/complete"
              payload: { completion_evidence: "NFPA-72 acceptance certificate 4471" }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-22T00:00:00Z" }
              as: BrandStandardsDirector
            - call: "POST /pip-items/${item_ls_id}/verify"
              payload: { outcome: "VERIFY", verification_notes: "Life-safety package witnessed on site." }
              as: BrandStandardsDirector
            - call: "POST /agreements/${agr_id}/onboarding-milestone"
              payload: { track: "TRAINING", to_status: "COMPLETED" }
              as: FranchiseDevelopmentManager
            - call: "POST /agreements/${agr_id}/onboarding-milestone"
              payload: { track: "SYSTEMS", to_status: "PROVISIONED" }
              as: FranchiseDevelopmentManager
            - call: "POST /agreements/${agr_id}/onboarding-milestone"
              payload: { track: "SYSTEMS", to_status: "VALIDATED" }
              as: FranchiseDevelopmentManager
            - call: "POST /agreements/${agr_id}/onboarding-milestone"
              payload: { track: "CHANNEL", to_status: "TESTING" }
              as: FranchiseDevelopmentManager
            - call: "POST /agreements/${agr_id}/onboarding-milestone"
              payload: { track: "CHANNEL", to_status: "CONNECTED" }
              as: FranchiseDevelopmentManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: BrandStandardsDirector
            - call: "POST /agreements/${agr_id}/open"
              payload: {}
              as: BrandStandardsDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-05T00:00:00Z" }
              as: Owner
            - call: "POST /agreements/${agr_id}/revenue-reports"
              payload: { period_month: "2026-11", gross_room_revenue: 320000.16 }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: Owner
            - call: "POST /agreements/${agr_id}/revenue-reports"
              payload: { period_month: "2026-12", gross_room_revenue: 480000.16 }
              as: Owner
              as_user_id: "${owner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: BrandStandardsDirector
          trigger:
            - call: "POST /agreements/${agr_id}/terminate"
              payload: { cause: "MUTUAL", termination_notes: "Negotiated exit; owner selling the asset unbranded." }
              as: BrandStandardsDirector
          assert:
            - "LicenseAgreement.${agr_id}.liquidated_damages_formula == DISCOUNTED_PV"
            - "LicenseAgreement.${agr_id}.trailing_avg_monthly_fee == 32000.01"
            - "LicenseAgreement.${agr_id}.remaining_term_months_at_termination == 235"
            - "LicenseAgreement.${agr_id}.liquidated_damages_amount == 1051872.86"
            - "LicenseAgreement.${agr_id}.status == TERMINATION_PENDING"
            - "LicenseAgreement.${agr_id}.termination_cause == MUTUAL"
            - "LicenseAgreement.${agr_id}.terminated_at == 2027-03-01T00:00:00.000Z"
            - "LicenseAgreement.${agr_id}.de_identification_status == PENDING"
            - "LicenseAgreement.${agr_id}.de_identification_deadline == 2027-03-31T00:00:00.000Z"
            - "LicenseAgreement.${agr_id}.channel_status == SUSPENDED"
            - "LicenseAgreement.${agr_id}.post_termination_status == OPEN"
            - "PropertyImprovementPlan.${pip_id}.status == SUSPENDED"
            - "LicenseAgreement.${agr_id}.total_fees_assessed == 78000.02 (unchanged by the termination)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: license_terms_three_independent_clamps_all_bind_at_draft
        grounds:
          - calculations.license_terms_derivation
          - entities.LicenseAgreement.fields.royalty_rate_pct
          - entities.LicenseAgreement.fields.marketing_fund_rate_pct
          - entities.LicenseAgreement.fields.term_years
          - entities.LicenseAgreement.fields.expiry_date
          - validations[priority=39]
        distinguishing_aspect: |
          Mode (a): a nested min/max over three independent inputs — the brand rate card, the
          conversion origin and the owner's capacity band — where every clamp binds at once.
          The inner max(3.50, 7.00 + 0.75 - 0.50) yields 7.25 and the outer min clips it to 7.00;
          the marketing surcharge pushes 2.80 + 0.50 = 3.30 to the 3.00 ceiling; and the requested
          25-year term is clipped to the brand's 20. A linear implementation returns 7.25 / 3.30 / 25.
        test_recipe:
          setup:
            - "Brand AURORA priced at the royalty ceiling already (base royalty 7.00, marketing 2.80, radius 5.00, min rooms 80, standard term 20 years)."
            - "One operating AURORA hotel two miles from the applicant property whose territory term ends 2026-09-30, one day before the requested conversion date, so no territory conflict exists."
            - "A STRONG owner operating four hotels, qualifying for the deep capacity discount."
            - "A 120-room COMPETITOR conversion requesting a 25-year term from 2026-10-01, reviewed on the PORTFOLIO_ADJUSTED basis, with the encroachment verdict waived at approval."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BrandStandardsDirector
            - call: "POST /brands"
              payload: { code: "AURORA", name: "Aurora Grand", tier: "LUXURY", base_royalty_rate_pct: 7.00, marketing_fund_rate_pct: 2.80, protected_radius_miles: 5.00, min_room_count: 80, standard_term_years: 20 }
              as: BrandStandardsDirector
              captures: { brand_id: $.data.id }
            - call: "POST /existing-units"
              payload: { brand_id: "${brand_id}", unit_name: "Aurora Grand Lakeside", market_code: "SEADT", x_miles: 1.20, y_miles: 1.60, room_count: 100, adr_amount: 310.00, occupancy_pct: 72.00, territory_start_date: "2016-06-01", territory_end_date: "2026-09-30" }
              as: BrandStandardsDirector
              captures: { unit_near_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Harbor Point Hospitality LP", contact_email: "deals@harborpointhosp.example", liquid_assets_amount: 6000000.00, net_worth_amount: 18000000.00, credit_score: 760, existing_units_count: 4 }
              as: FranchiseDevelopmentManager
              captures: { owner_id: $.data.id }
            - call: "POST /applications"
              payload: { owner_id: "${owner_id}", brand_id: "${brand_id}", property_name: "Lakeside Tower Hotel", market_code: "SEADT", property_x_miles: 0.00, property_y_miles: 0.00, room_count: 120, current_affiliation: "COMPETITOR", building_age_years: 22, requested_term_years: 25, requested_conversion_date: "2026-10-01" }
              as: FranchiseDevelopmentManager
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: FranchiseDevelopmentManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: FranchiseDevelopmentManager
            - call: "POST /applications/${app_id}/financial-review"
              payload: { capacity_basis: "PORTFOLIO_ADJUSTED" }
              as: FranchiseDevelopmentManager
              as_user_id: "fdm-review-01"
            - call: "POST /applications/${app_id}/impact-analysis"
              payload: {}
              as: BrandStandardsDirector
            - call: "POST /applications/${app_id}/finalize-impact"
              payload: {}
              as: BrandStandardsDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FranchiseDevelopmentManager
            - call: "POST /applications/${app_id}/decision"
              payload: { outcome: "APPROVE", decision_notes: "Approved with an encroachment waiver.", encroachment_waiver_granted: true }
              as: FranchiseDevelopmentManager
              as_user_id: "fdm-decision-02"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: FranchiseDevelopmentManager
          trigger:
            - call: "POST /applications/${app_id}/agreements"
              payload: { effective_date: "2026-10-01" }
              as: FranchiseDevelopmentManager
              captures: { agr_id: $.data.id }
          assert:
            - "Application.${app_id}.capacity_score_at_review == 100.00"
            - "Application.${app_id}.capacity_band_at_review == STRONG"
            - "Application.${app_id}.final_impact_score == 32.73"
            - "Application.${app_id}.encroachment_verdict == ENCROACHMENT_CONFIRMED"
            - "LicenseAgreement.${agr_id}.royalty_rate_pct == 7.00"
            - "LicenseAgreement.${agr_id}.marketing_fund_rate_pct == 3.00"
            - "LicenseAgreement.${agr_id}.term_years == 20"
            - "LicenseAgreement.${agr_id}.effective_date == 2026-10-01"
            - "LicenseAgreement.${agr_id}.expiry_date == 2046-10-01"
            - "LicenseAgreement.${agr_id}.status == DRAFT"
            - "LicenseAgreement.${agr_id}.brand_code == AURORA"
            - "LicenseAgreement.${agr_id}.liquidated_damages_cap_months == 36"

      - name: marketing_fund_total_rounds_per_period_then_sums
        grounds:
          - calculations.monthly_fee_assessment
          - entities.LicenseAgreement.fields.revenue_periods
          - entities.LicenseAgreement.fields.marketing_fund_contributed_total
          - entities.LicenseAgreement.fields.royalty_fee_to_date
          - entities.LicenseAgreement.fields.total_fees_assessed
        distinguishing_aspect: |
          Mode (b): nested rounding whose order is observable in cents. Marketing fees of
          320000.16 and 480000.16 at 2.50% are 8000.0040 and 12000.0040 unrounded; rounding each
          period first and summing gives marketing_fund_contributed_total == 20000.00, while summing
          the raw products and rounding once gives 20000.01. The scaffold pins per-period rounding,
          so the 1-cent gap is a hard pass/fail — a different axis from the nested min/max clamp of
          license_terms_three_independent_clamps_all_bind_at_draft.
        test_recipe:
          setup:
            - "The SOLARIS 120-room conversion OPEN since 2026-11-01 at royalty 5.25 / marketing 2.50."
            - "One surviving revenue period already filed for 2026-11 on gross room revenue 320000.16."
            - "Logical clock at 2027-01-05T00:00:00Z, filing the 2026-12 period."
          setup_api_calls:
