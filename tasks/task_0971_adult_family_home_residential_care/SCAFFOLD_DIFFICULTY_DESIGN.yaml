  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: med_window_inclusive_lower_exclusive_upper
        grounds:
          - calculations.med_admin_window
          - errors[ERR_OUTSIDE_MED_WINDOW]
        distinguishing_aspect: |
          Minute-metric boundary on POST /medication-logs: for an 08:00-local schedule the window
          is [T-60min, T+60min) — administered_at exactly 60 minutes before is accepted (inclusive
          lower bound), exactly 60 minutes after is rejected (exclusive upper bound), and the two
          probes land on different days to isolate boundary semantics from duplicate detection.
        test_recipe:
          setup:
