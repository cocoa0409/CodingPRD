            - "${al_due} == 2026-08-01T10:00:00Z   # SANCTIONS_HIT ALERT_SLA_HOURS 24 added to triggered_at 2026-07-31T10:00:00Z"
            - "${s1_alerts} == 1"
            - "${s1_posture} == FROZEN   # link 2, caused only by link 1"
            - "${s1_fbo} == FROZEN and ${s1_res} == FROZEN   # link 3"
            - "${s2_alerts} == 0"
            - "${s2_posture} == OPEN   # cause removed"
            - "${s2_fbo} == FROZEN   # the freeze is NOT auto-reverted when the posture recovers"
            - "MarketingReview.${mr_id}.status == SUBMITTED   # the refused decision left the review untouched"
            - "MarketingReview.${mr_id}.review_round == 1"
            - "CustodyAccount.${fbo_id}.status == ACTIVE   # after cycle close: the depth-2 tail thaws it"
            - "CustodyAccount.${res_id}.status == ACTIVE"
            - "Partner.${p_id}.required_reserve_cents == 250000   # RESERVE_ABSOLUTE_FLOOR_CENTS binds: 5000000 * 500 bps = 250000 ties it, trailing volume is 0"
            - "Partner.${p_id}.reserve_shortfall_cents == 0"
            - "Partner.${p_id}.oversight_posture == OPEN"
            - "${c1_frozen} == 0   # posture was already back to OPEN when the cycle closed"
            - "${c1_expired} == 0   # the marketing review never reached APPROVED, so nothing could expire"
            - "${c1_growth} == 0   # OversightCycle.growth_breach_partner_count"
            - "OversightCycle.${c1_id}.status == CLOSED"
            - "TransactionMonitoringAlert.${al_id}.disposition == CLEARED and TransactionMonitoringAlert.${al_id}.sla_breach_count == 0"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: frozen_posture_inflow_gate_outranks_frozen_custody_account_gate
        grounds:
          - validations[priority=52]
          - validations[priority=46]
          - calculations.oversight_posture_computation
          - state_machines.CustodyAccount.ACTIVE_to_FROZEN
        distinguishing_aspect: |
          A single END_USER_CREDIT request violates both a business_safety rule
          (priority 52, posture FROZEN blocks inflows, 403) and a state rule
          (priority 46, target CustodyAccount is not ACTIVE, 409) because the
          same SANCTIONS_HIT alert caused both conditions; the response must be
          403 ERR_POSTURE_BLOCKS_INFLOW, proving 52 is evaluated before 46 and
          that the lower-priority state error is never reported.
        test_recipe:
          setup:
            - "Partner 'Kestrel Deposits' LIVE at reserve_requirement_bps = 500 with FBO_END_USER 5000000 and RESERVE 312500 (shortfall 0)."
            - "An OPEN SANCTIONS_HIT alert drives oversight_posture to FROZEN, which in the same operation freezes both CustodyAccounts, making both preconditions true at once."
            - "The OCC token expected_custody_account_version is captured AFTER the freeze so that no stale-version error can pre-empt the pair under test."
