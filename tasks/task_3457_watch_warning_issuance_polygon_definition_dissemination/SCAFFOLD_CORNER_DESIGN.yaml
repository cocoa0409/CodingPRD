            - call: "GET /alerts/coordination-requests"
              payload: { product_id: "${dl_w}" }
              as: Forecaster
              as_user_id: "${dl_fc}"
              captures: { dl_req: "$.data[0].id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:15:00Z" }
              as: PlatformAdmin
          assert:
            - "CoordinationRequest.${dl_req}.deadline_at == 2026-09-01T09:15:00Z (requested_at 09:00 + 15 minutes)"
            - "after the clock reaches the deadline the request is EXPIRED with responded_at null"
            - "Product.${dl_w} is DRAFT again (revert on expiry), version 3 (create 1, submit 2, revert 3)"

      - name: acknowledge_twice_returns_invalid_coordination_state
