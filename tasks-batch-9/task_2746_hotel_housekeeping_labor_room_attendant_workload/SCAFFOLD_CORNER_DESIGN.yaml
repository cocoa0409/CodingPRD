# SCAFFOLD_CORNER_DESIGN.yaml
# Breadth probe (§1.9) for task_2746 Hotel Housekeeping Labor & Room Attendant Workload.
# Sections and claim_type values are taken verbatim from references/claim-extraction-guide.md.
# Corners already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.

scaffold_corner_design:
  - section: entities
    instances:
      - name: entity_property_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.Property
          - endpoints[POST /housekeeping/properties]
          - response_envelope
        distinguishing_aspect: "A property created with all fourteen required inputs returns HTTP 201 with the ok envelope, version 1, total_rooms 0 and outstanding_incentive_points 0."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-03T07:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
          trigger:
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id, prop_v: $.data.version }
          assert:
            - "HTTP 201 with body shape { ok: true, data: {...}, error_id: null, message: null }"
            - "Property.${prop_id}.name == 'Harborview Hotel' and ordinance_profile == SQFT_CAP_2200"
            - "Property.${prop_id}.credit_minute_value == 30 and max_daily_credits == 16.00"
            - "Property.${prop_id}.total_rooms == 0"
            - "Property.${prop_id}.outstanding_incentive_points == 0"
            - "Property.${prop_id}.version == 1"

      - name: entity_room_retrieval_returns_the_stored_room
        claim_type: retrieval
        grounds:
          - entities.Room
          - endpoints[GET /housekeeping/rooms/{id}]
        distinguishing_aspect: "GET /housekeeping/rooms/{id} echoes exactly the room_number, floor, occupancy_state and room_type_id that were stored, with cleanliness_status DIRTY."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z; one property with a KING room type and room 101 created in DUE_OUT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "KING", square_feet: 420, checkout_credits: 1.00, stayover_credits: 0.50, deep_clean_credits: 2.00, linen_sets_per_room: 2 }
              as: HousekeepingDirector
              captures: { rt_king_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "101", floor: 1, occupancy_state: "DUE_OUT" }
              as: HousekeepingDirector
              captures: { room101_id: $.data.id }
          trigger:
            - call: "GET /housekeeping/rooms/${room101_id}"
              payload: {}
              as: FrontDeskAgent
              captures: { read_number: $.data.room_number, read_state: $.data.occupancy_state, read_clean: $.data.cleanliness_status }
          assert:
            - "HTTP 200 with ok == true"
            - "Room.${room101_id}.room_number == '101' and floor == 1"
            - "Room.${room101_id}.room_type_id == ${rt_king_id} and property_id == ${prop_id}"
            - "Room.${room101_id}.occupancy_state == DUE_OUT"
            - "Room.${room101_id}.cleanliness_status == DIRTY"

      - name: entity_room_listing_filtered_by_room_type_returns_only_matches
        claim_type: listing
        grounds:
          - endpoints[GET /housekeeping/rooms]
          - entities.Room.fields.room_type_id
        distinguishing_aspect: "GET /housekeeping/rooms?room_type_id=<suite> returns exactly the one SUITE room and omits both KING rooms."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z; one property with a KING type (rooms 101 and 102) and a SUITE type (room 201)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "KING", square_feet: 420, checkout_credits: 1.00, stayover_credits: 0.50, deep_clean_credits: 2.00, linen_sets_per_room: 2 }
              as: HousekeepingDirector
              captures: { rt_king_id: $.data.id }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "SUITE", square_feet: 780, checkout_credits: 2.00, stayover_credits: 1.00, deep_clean_credits: 3.50, linen_sets_per_room: 3 }
              as: HousekeepingDirector
              captures: { rt_suite_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "101", floor: 1, occupancy_state: "DUE_OUT" }
              as: HousekeepingDirector
              captures: { room101_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "102", floor: 1, occupancy_state: "VACANT" }
              as: HousekeepingDirector
              captures: { room102_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_suite_id}", room_number: "201", floor: 2, occupancy_state: "VACANT" }
              as: HousekeepingDirector
              captures: { room201_id: $.data.id }
          trigger:
            - call: "GET /housekeeping/rooms"
              payload: { room_type_id: "${rt_suite_id}" }
              as: Supervisor
          assert:
            - "HTTP 200 and data is a list of length 1"
            - "The single element has id == ${room201_id} and room_number == '201'"
            - "Neither ${room101_id} nor ${room102_id} appears in the list"
            - "An unfiltered GET /housekeeping/rooms for the same property returns 3 elements"

      - name: entity_room_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=5]
          - errors[ERR_ROOM_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown room id yields ERR_ROOM_NOT_FOUND with HTTP 404 and the error envelope, not an empty 200."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z; no Room rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
          trigger:
            - call: "GET /housekeeping/rooms/00000000-0000-0000-0000-000000000999"
              payload: {}
              as: Supervisor
              captures: { nf_error: $.data.error_id }
          assert:
            - "HTTP 404 with body shape { ok: false, data: null, error_id: 'ERR_ROOM_NOT_FOUND', message: <non-empty> }"
            - "error_id == ERR_ROOM_NOT_FOUND"

      - name: entity_room_creation_missing_required_room_number_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /housekeeping/rooms]
        distinguishing_aspect: "Omitting room_number - an input field with no default - yields ERR_INVALID_REQUEST with HTTP 400 and creates no Room row."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z; one property with a KING room type and no rooms."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "KING", square_feet: 420, checkout_credits: 1.00, stayover_credits: 0.50, deep_clean_credits: 2.00, linen_sets_per_room: 2 }
              as: HousekeepingDirector
              captures: { rt_king_id: $.data.id }
          trigger:
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", floor: 1, occupancy_state: "DUE_OUT" }
              as: HousekeepingDirector
              captures: { invalid_error: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /housekeeping/rooms?property_id=${prop_id} returns an empty list"
            - "Property.${prop_id}.total_rooms == 0"

      - name: entity_room_defaults_applied_when_optional_inputs_are_omitted
        claim_type: defaults
        grounds:
          - entities.Room.fields.service_program
          - entities.Room.fields.occupancy_state
          - entities.Room.fields.cleanliness_status
          - entities.Room.fields.last_serviced_business_date
        distinguishing_aspect: "Omitting service_program, occupancy_state and both business-date fields yields DAILY, VACANT, DIRTY and null respectively - the declared defaults, not nulls or empty strings."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z; one property with a KING room type."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "KING", square_feet: 420, checkout_credits: 1.00, stayover_credits: 0.50, deep_clean_credits: 2.00, linen_sets_per_room: 2 }
              as: HousekeepingDirector
              captures: { rt_king_id: $.data.id }
          trigger:
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "110", floor: 1 }
              as: HousekeepingDirector
              captures: { room_id: $.data.id, def_program: $.data.service_program, def_occupancy: $.data.occupancy_state }
          assert:
            - "HTTP 201"
            - "Room.${room_id}.service_program == DAILY"
            - "Room.${room_id}.occupancy_state == VACANT"
            - "Room.${room_id}.cleanliness_status == DIRTY"
            - "Room.${room_id}.last_serviced_business_date == null and last_deep_cleaned_business_date == null"
            - "Property.${prop_id}.total_rooms == 1 and RoomType.${rt_king_id}.room_count == 1"

      - name: entity_assignment_credits_and_square_feet_are_computed_from_the_room_type
        claim_type: computed_fields
        grounds:
          - entities.RoomAssignment.fields.credits
          - entities.RoomAssignment.fields.square_feet_snapshot
          - calculations.assignment_credit_value
        distinguishing_aspect: "credits and square_feet_snapshot are absent from the endpoint's input yet arrive as 1.00 and 420 on the response, snapshotted from RoomType rather than supplied by the caller."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z."
            - "Property with a KING room type (square_feet 420, checkout_credits 1.00) and room 101 in DUE_OUT."
            - "Attendant E-101, supervisor E-900, a PUBLISHED ForecastDay 2026-08-03 and a CLOCKED_IN roster for E-101."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "KING", square_feet: 420, checkout_credits: 1.00, stayover_credits: 0.50, deep_clean_credits: 2.00, linen_sets_per_room: 2 }
              as: HousekeepingDirector
              captures: { rt_king_id: $.data.id }
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "101", floor: 1, occupancy_state: "DUE_OUT" }
              as: HousekeepingDirector
              captures: { room101_id: $.data.id }
            - call: "POST /housekeeping/attendants"
              payload: { property_id: "${prop_id}", employee_code: "E-101", full_name: "Rosa Diaz", seniority_date: "2019-04-01", hourly_rate_cents: 3000 }
              as: HousekeepingDirector
              captures: { ra1_id: $.data.id }
            - call: "POST /housekeeping/attendants"
              payload: { property_id: "${prop_id}", employee_code: "E-900", full_name: "Ivan Petrov", seniority_date: "2014-02-01", hourly_rate_cents: 4200, can_inspect: true }
              as: HousekeepingDirector
              captures: { sup_id: $.data.id }
            - call: "POST /housekeeping/forecast-days"
              payload: { property_id: "${prop_id}", business_date: "2026-08-03", forecast_occupied_rooms: 1, forecast_arrivals: 0, forecast_departures: 1, planned_deep_clean_rooms: 0 }
              as: HousekeepingDirector
              captures: { fd_id: $.data.id }
            - call: "POST /housekeeping/forecast-days/${fd_id}/publish"
              payload: {}
              as: HousekeepingDirector
            - call: "POST /housekeeping/shift-rosters"
              payload: { forecast_day_id: "${fd_id}", attendant_id: "${ra1_id}", planned_start_at: "2026-08-03T08:00:00.000Z" }
              as: HousekeepingDirector
              captures: { roster_id: $.data.id }
            - call: "POST /housekeeping/shift-rosters/${roster_id}/clock-in"
              payload: {}
              as: RoomAttendant
              as_user_id: "${ra1_id}"
              captures: { r_v1: $.data.version }
          trigger:
            - call: "POST /housekeeping/room-assignments"
              payload: { roster_id: "${roster_id}", room_id: "${room101_id}", service_type: "CHECKOUT", expected_roster_version: "${r_v1}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { a1_id: $.data.id, a1_credits: $.data.credits, a1_sqft: $.data.square_feet_snapshot, a1_gen: $.data.reclean_generation }
          assert:
            - "HTTP 201"
            - "RoomAssignment.${a1_id}.credits == 1.00"
            - "RoomAssignment.${a1_id}.square_feet_snapshot == 420"
            - "RoomAssignment.${a1_id}.reclean_generation == 0"
            - "RoomAssignment.${a1_id}.linen_sets_debited == 0, since nothing has been completed yet"
            - "RoomAssignment.${a1_id}.actual_minutes == null and supersedes_assignment_id == null"

      - name: entity_system_fields_are_server_generated_from_the_logical_clock
        claim_type: system_fields
        grounds:
          - response_envelope
          - entities.Room
        distinguishing_aspect: "id, created_at, updated_at and version are stamped by the server: created_at equals the pinned logical clock 2026-08-03T07:00:00.000Z and version starts at 1."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-03T07:00:00.000Z; one property with a KING room type."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id }
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "KING", square_feet: 420, checkout_credits: 1.00, stayover_credits: 0.50, deep_clean_credits: 2.00, linen_sets_per_room: 2 }
              as: HousekeepingDirector
              captures: { rt_king_id: $.data.id }
          trigger:
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "${rt_king_id}", room_number: "120", floor: 1, occupancy_state: "VACANT" }
              as: HousekeepingDirector
              captures: { room_id: $.data.id, room_created: $.data.created_at, room_updated: $.data.updated_at, room_v: $.data.version }
          assert:
            - "Room.${room_id}.id is a non-empty server-minted string that the request never supplied"
            - "Room.${room_id}.created_at == 2026-08-03T07:00:00.000Z"
            - "Room.${room_id}.updated_at == 2026-08-03T07:00:00.000Z"
            - "Room.${room_id}.version == 1"

      - name: entity_room_type_square_feet_out_of_range_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.RoomType.fields.square_feet
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "square_feet 40 sits below the declared 50..5000 range, so the create is refused with ERR_INVALID_REQUEST and no RoomType row appears."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z; one property with no room types."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /housekeeping/room-types"
              payload: { property_id: "${prop_id}", code: "CLOSET", square_feet: 40, checkout_credits: 1.00, stayover_credits: 0.50, deep_clean_credits: 2.00, linen_sets_per_room: 2 }
              as: HousekeepingDirector
              captures: { range_error: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /housekeeping/room-types?property_id=${prop_id} returns an empty list"

      - name: entity_room_creation_with_unknown_room_type_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_ROOM_TYPE_NOT_FOUND]
          - entities.Room.fields.room_type_id
        distinguishing_aspect: "A body foreign key that resolves to nothing is caught as ERR_ROOM_TYPE_NOT_FOUND (404), distinct from the path-id existence check on the property."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z; one property exists, no room types."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
              payload: { name: "Harborview Hotel", ordinance_profile: "SQFT_CAP_2200", credit_minute_value: 30, standard_shift_minutes: 480, pre_post_shift_minutes: 45, min_daily_paid_minutes: 240, max_daily_credits: 16.00, max_daily_square_feet: 2200, laundry_sla_minutes: 240, laundry_capacity_sets: 300, reclean_threshold_score: 85.0, inspection_sample_rate: 0.20, probation_sample_rate: 0.50, rest_buffer_minutes: 10 }
              as: HousekeepingDirector
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /housekeeping/rooms"
              payload: { property_id: "${prop_id}", room_type_id: "00000000-0000-0000-0000-0000000000aa", room_number: "101", floor: 1, occupancy_state: "DUE_OUT" }
              as: HousekeepingDirector
              captures: { fk_error: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_ROOM_TYPE_NOT_FOUND"
            - "Property.${prop_id}.total_rooms == 0"

      - name: entity_assignment_room_fk_is_reverse_reachable_by_filtered_list
        claim_type: flat
        grounds:
          - endpoints[GET /housekeeping/room-assignments]
          - entities.RoomAssignment.fields.room_id
        distinguishing_aspect: "The Room -> RoomAssignment edge is navigable in reverse: GET /housekeeping/room-assignments?room_id=<room 101> returns the one assignment created against that room."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z."
            - "Property with a KING type, rooms 101 (DUE_OUT) and 102 (DUE_OUT), attendant E-101, supervisor E-900, PUBLISHED ForecastDay 2026-08-03 and a CLOCKED_IN roster carrying one CHECKOUT on room 101 only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
