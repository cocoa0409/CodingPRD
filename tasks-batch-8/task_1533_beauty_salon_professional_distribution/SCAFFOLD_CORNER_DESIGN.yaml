            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-48A", name: "Gel", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 3000, weight_grams: 100 }, as: DistributionAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-48B", name: "Balm", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 2000, weight_grams: 50 }, as: DistributionAdmin, captures: { p2: "$.data.id" } }
            - { call: "POST /api/orders", payload: { salon_account_id: "${s_id}", items: [ { product_id: "${p1}", quantity: 1 } ] }, as: SalonBuyer, as_user_id: "${s_id}", captures: { o_id: "$.data.id", o_v: "$.data.version" } }
          trigger:
            - { call: "POST /api/orders/${o_id}/items", payload: { product_id: "${p2}", quantity: 1, expected_order_version: "${o_v}" }, as: SalonBuyer, as_user_id: "${s_id}" }
            - { call: "POST /api/orders/${o_id}/items", payload: { product_id: "${p2}", quantity: 1, expected_order_version: "${o_v}" }, as: SalonBuyer, as_user_id: "${s_id}", captures: { err: "$.data.error_id" } }
          assert:
