              as_user_id: "admin-001"
              captures: { vc_imm_id: $.data.id }
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "REC-960", category: "RECORDKEEPING", severity: "MINOR", base_points: 2.0, fine_cents_base: 3000 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { vc_rec_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Hazard Salon", establishment_type: "SALON", county_code: "ADC", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-03T09:00:00Z", window_end_at: "2026-08-03T17:00:00Z", inspector_user_id: "insp-070" }
              as: Inspector
              as_user_id: "insp-070"
              captures: { insp_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "insp-070"
            - call: "POST /cosmetology/inspections/${insp_id}/findings"
              payload: { violation_code_id: "${vc_imm_id}", observed_count: 1, corrected_on_site: false, note: "Autoclave inoperable; used implements stored wet." }
              as: Inspector
              as_user_id: "insp-070"
              captures: { find_imm_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_id}/findings"
              payload: { violation_code_id: "${vc_rec_id}", observed_count: 1, corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-070"
              captures: { find_rec_id: $.data.id }
          trigger:
            - call: "POST /cosmetology/inspections/${insp_id}/hazard-declaration"
              payload: { hazard_violation_finding_id: "${find_rec_id}", narrative: "Attempting closure on a paperwork finding." }
              as: Inspector
              as_user_id: "insp-070"
            - call: "POST /cosmetology/inspections/${insp_id}/hazard-clearance"
              payload: { clearing_reinspection_id: "${insp_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/inspections/${insp_id}/hazard-declaration"
              payload: { hazard_violation_finding_id: "${find_imm_id}", narrative: "Autoclave inoperable; immediate closure ordered." }
              as: Inspector
              as_user_id: "insp-070"
            - call: "POST /cosmetology/inspections/${insp_id}/hazard-declaration"
              payload: { hazard_violation_finding_id: "${find_imm_id}", narrative: "Duplicate closure order." }
              as: Inspector
