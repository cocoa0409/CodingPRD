          setup_api_calls: []
          trigger:
            - { call: "POST /endowment/funds/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/activate", payload: {}, as: BoardMember, captures: { ax_err: $.data.error_id } }
          assert:
