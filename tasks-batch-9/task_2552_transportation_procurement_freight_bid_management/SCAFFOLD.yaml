        description: Shipper load identifier; unique per rate_record_id.
        constraints: "1..32 chars; unique per (rate_record_id, load_reference) -> ERR_DUPLICATE_LOAD_REFERENCE"
      - name: reject_reason
        type: string
        source: input
        description: Reason supplied when outcome is REJECTED; null otherwise.
        default: null
      - name: position_used
        type: enum
        source: computed
        description: Copy of RateRecord.routing_position at append time.
        constraints: "PRIMARY | BACKUP_1 | BACKUP_2"
      - name: tendered_at
        type: datetime
        source: system
        description: Logical-clock instant at which the tender was recorded.

  - name: MiniBid
    parent: BidEvent
    common_fields: true
    entity_kind: resource
    fields:
      - name: bid_event_id
        type: string
        source: input
        description: "FK -> BidEvent.id; the event whose routing guide is being adjusted."
      - name: lane_id
        type: string
        source: input
        description: "FK -> Lane.id; the lane under mid-contract adjustment."
      - name: rate_record_id
        type: string
        source: input
        description: "FK -> RateRecord.id; the live rate this mini-bid targets."
      - name: applied_rate_record_id
        type: string
        source: system
        description: "FK -> RateRecord.id; the replacement record created when the mini-bid was applied; null before apply."
        default: null
      - name: proposed_by_carrier_id
        type: string
        source: computed
        description: "FK -> Carrier.id; the carrier that submitted the proposal; null before a proposal exists."
        default: null
      - name: trigger_reason
        type: enum
        source: input
        description: Why the mini-bid was opened.
        constraints: "TENDER_REJECTION_RATE | MARKET_INDEX | CAPACITY_FAILURE"
      - name: origin
        type: enum
        source: computed
        description: MANUAL when requested through the API, SYSTEM when auto-created by the tender-risk cascade.
        default: MANUAL
        constraints: "MANUAL | SYSTEM"
      - name: status
        type: enum
        source: computed
        description: Mini-bid lifecycle including the compensating revert.
        default: REQUESTED
        constraints: "REQUESTED | OPEN | APPLIED | DENIED | REVERTED"
      - name: window_open_at
        type: datetime
        source: input
        description: Inclusive start of the adjustment window on this lane.
      - name: window_close_at
        type: datetime
        source: input
        description: Inclusive end of the adjustment window on this lane; MUST be strictly after window_open_at.
      - name: proposed_rate_per_mile
        type: number
        source: computed
        description: Rate offered by the carrier in its proposal.
        default: null
        constraints: "> 0, 4 decimal places"
      - name: adjustment_pct
        type: number
        source: computed
        description: Percentage delta of proposed_rate_per_mile against the targeted RateRecord.rate_per_mile.
        default: null
      - name: contract_value_before_usd
        type: number
        source: computed
        description: Contract.total_committed_value_usd snapshot taken immediately before apply.
        default: null
      - name: contract_value_after_usd
        type: number
        source: computed
        description: Contract.total_committed_value_usd immediately after apply.
        default: null
      - name: denial_reason
        type: string
        source: computed
        description: Reason recorded when the mini-bid was denied.
        default: null
      - name: revert_reason
        type: string
        source: computed
        description: Reason recorded when the applied mini-bid was reverted.
        default: null
      - name: applied_at
        type: datetime
        source: system
        description: Logical-clock instant of apply.
        default: null
      - name: reverted_at
