            - "response.data.error_id == ERR_INVOICE_NOT_DISPUTED"

      - name: settle_disputed_invoice_blocked
        claim_type: guarded transitions
        grounds:
          - state_machines.Invoice.ISSUED_to_SETTLED
          - "errors[ERR_INVOICE_DISPUTED]"
        distinguishing_aspect: "Settling an ISSUED invoice while dispute_status==DISPUTED returns ERR_INVOICE_DISPUTED (409); the parallel dispute dimension guards the billing transition."
        test_recipe:
          setup: ["A COMPLETED job's SERVICE invoice that has been DISPUTED (still ISSUED)."]
          setup_api_calls:
            - call: "POST /pricing-policies"
              payload: { name: "std_policy", full_truck_cents: 60000, tier_breaks: [{upper_fraction: 0.25, marginal_multiplier: 1.0}, {upper_fraction: 0.5, marginal_multiplier: 0.9}, {upper_fraction: 1.0, marginal_multiplier: 0.8}], mattress_surcharge_cents: 3500, appliance_surcharge_cents: 2500, freon_surcharge_cents: 5000, dump_fee_per_ton_cents: 9000, full_truck_dump_cents: 12000, recycle_fee_per_ton_cents: 4000, diversion_credit_per_ton_cents: 1500 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "d5@x.com", full_name: "D5", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew D5", shift_start_utc: "2026-06-10T08:00:00.000Z", shift_end_utc: "2026-06-10T18:00:00.000Z" }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /trucks"
              payload: { name: "TD5" }
              as: PlatformAdmin
