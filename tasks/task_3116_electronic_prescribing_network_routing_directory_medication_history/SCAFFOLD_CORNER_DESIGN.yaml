          - endpoints.GET_/network/prescriptions/{id}/active-attempt
          - endpoints.GET_/network/prescriptions/{id}/signature-session
        distinguishing_aspect: "Prescription exposes four relationship read paths at once — a filtered list by receiving_pharmacy_id, routed_endpoint_id and significance, plus three sub-resource reads — and each returns the array shape clients can consume uniformly."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Both participants certified; Riverbend Pharmacy owns two NEW_RX endpoints; one controlled SCHEDULE_II order has been signed and routed, one non-controlled order is still DRAFT."
          setup_api_calls:
