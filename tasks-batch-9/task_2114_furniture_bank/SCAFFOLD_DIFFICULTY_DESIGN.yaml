      - name: second_no_show_cascades_hold_denial_and_waitlist_cancel
        grounds:
          - state_machines.DeliveryStop.SCHEDULED_to_NO_SHOW
          - entities.Client.fields.no_show_strikes
          - entities.Client.fields.delivery_ban_until
          - state_machines.Referral.SUBMITTED_to_DENIED
          - state_machines.WaitlistEntry.WAITING_to_CANCELLED
          - calculations.no_show_chargeback
        distinguishing_aspect: |
          A three-link chain fired from a completely different trigger than the bed-bug cascade:
          the second NO_SHOW raises no_show_strikes to the STRIKE_BAN_THRESHOLD, that raised count
          is what flips the household to ON_HOLD, and the ON_HOLD flip is what denies the
          household's other SUBMITTED referral and cancels its WAITING waitlist entry.
        test_recipe:
