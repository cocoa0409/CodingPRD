      - name: disputing_a_pending_tag_and_regrading_a_decided_tag_are_rejected_409
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.WeighTag.disposition
          - validations.priority_25
          - errors[ERR_TAG_NOT_DISPUTABLE]
        distinguishing_aspect: |
          Priority 25 is a two-sided guard on the disposition dimension and both sides
          must bite. Before grading, the tag is PENDING: there is no decision to contest,
          so a dispute is refused. After grading, the tag is ACCEPTED: the decision stands,
          so a second grade is refused UNLESS a dispute reopened it. Getting only one side
          right is the common failure, and it is exactly the pair that makes the
          dispute-then-regrade cycle the sole legal re-grade path.
