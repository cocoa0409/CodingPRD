scaffold_difficulty_design:

  # =================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: reservation_estimate_vs_final_diverge_on_fuel_and_late
        grounds:
          - calculations.estimate_reservation_quote
          - calculations.final_settlement
          - calculations.fuel_charge
          - calculations.late_fee
          - state_machines.Reservation.CHECKED_OUT_to_RETURNED
        distinguishing_aspect: |
          Same Reservation: the confirmation estimate (15345) excludes fuel and late, but the
          final settlement adds fuel (1800) and late (2500), so estimated_total_cents != Settlement
          rental+fuel+late total — divergence sits on the Reservation/Settlement billing domain.
        test_recipe:
          setup:
            - "Trail UTILITY, OPEN, max_riders 20."
            - "Unit UTILITY, daily_rate 8000, deposit 30000, tank 40L."
            - "Departure on that trail 2026-12-01T09:00Z -> 2026-12-01T17:00Z, required_guide_class UTILITY, capacity 20."
            - "Member SEASON (active), waiver SIGNED, helmet+suit assigned, reservation CONFIRMED with estimated_total_cents 15345 and deposit_hold 30000."
            - "Guide UTILITY assigned, departure LOCKED then DEPARTED (reservation CHECKED_OUT). Clock advanced to 2026-12-01T18:30Z so return is 90 min after ends_at."
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "Ridge", required_class: "UTILITY", max_riders: 20 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "U-1", unit_class: "UTILITY", daily_rate_cents: 8000, deposit_cents: 30000, tank_capacity_liters: 40 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /gear-items"
              payload: { kind: "HELMET", size_code: "M", replacement_cost_cents: 12000 }
              as: DispatchOperator
              captures: { helmet_id: $.data.id }
            - call: "POST /gear-items"
              payload: { kind: "SUIT", size_code: "L", replacement_cost_cents: 20000 }
              as: DispatchOperator
              captures: { suit_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "G One", max_class: "UTILITY" }
              as: DispatchOperator
              captures: { guide_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2026-12-01T09:00:00Z", ends_at: "2026-12-01T17:00:00Z", required_guide_class: "UTILITY", capacity_riders: 20 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "Mem A", email: "a@x.com", date_of_birth: "1990-01-01", membership_tier: "SEASON", membership_expires_at: "2027-04-01T00:00:00Z" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}", helmet_gear_id: "${helmet_id}", suit_gear_id: "${suit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { est_total: $.data.estimated_total_cents }
            - call: "POST /tour-departures/${dep_id}/assign-guide"
              payload: { guide_id: "${guide_id}" }
              as: DispatchOperator
            - call: "POST /tour-departures/${dep_id}/lock"
              payload: {}
              as: DispatchOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /tour-departures/${dep_id}/depart"
              payload: {}
              as: Guide
              as_user_id: "${guide_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T18:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /reservations/${res_id}/return"
              payload: { fuel_return_fraction: 0.70 }
              as: DispatchOperator
              captures: { settle_id: $.data.id }
          assert:
            - "Reservation.${res_id}.estimated_total_cents == 15345"
            - "Settlement.${settle_id}.rental_charge_cents == 15345"
            - "Settlement.${settle_id}.fuel_charge_cents == 1800"
            - "Settlement.${settle_id}.late_charge_cents == 2500"
            - "Settlement.${settle_id}.deposit_applied_cents == 19645"
            - "Settlement.${settle_id}.refund_cents == 10355"
            - "Settlement.${settle_id}.net_charge_cents == 0"

      - name: member_deposit_hold_premier_waived_vs_standard_diverge
        grounds:
          - calculations.deposit_hold
          - entities.Member.fields.deposit_hold_cents
          - entities.Member.fields.lifetime_damage_strikes
          - state_machines.Reservation.PENDING_to_CONFIRMED
        distinguishing_aspect: |
          On the Member entity (different domain from the Settlement billing above): a PREMIER member
          with zero damage strikes holds deposit 0, whereas a standard member on the same unit holds
          Unit.deposit_cents (30000) — the deposit_hold calc yields two different results from the same Unit input.
        test_recipe:
          setup:
            - "Trail TRAIL OPEN max_riders 10; Unit TRAIL daily_rate 5000 deposit 30000 tank 30L."
            - "Departure 2026-12-05T09:00Z->2026-12-05T12:00Z required_guide_class TRAIL capacity 10."
            - "Member PREMIER active, zero damage strikes, waiver SIGNED, reservation CONFIRMED."
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "Flat", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "U-2", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 30000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2026-12-05T09:00:00Z", ends_at: "2026-12-05T12:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "Prem A", email: "prem@x.com", date_of_birth: "1985-03-03", membership_tier: "PREMIER", membership_expires_at: "2027-04-01T00:00:00Z" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver}" }
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "Reservation.${res_id}.deposit_hold_cents == 0"
            - "Member.${mem_id}.deposit_hold_cents == 0"
            - "Reservation.${res_id}.settlement_status == HELD"

  # =================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_membership_tiered_nonlinear_mode_a
        grounds:
          - calculations.estimate_reservation_quote
          - entities.Member.fields.membership_tier
          - entities.Member.fields.membership_expires_at
        distinguishing_aspect: |
          Mode (a): the quote has >=4 inputs (daily_rate*days, tiered tour fee by trail class, gear
          surcharge*count, membership tier with active-vs-expired branch) and a non-linear conditional
          on membership_active — an EXPIRED SEASON membership zeroes the discount even though tier==SEASON.
        test_recipe:
          setup:
            - "Trail MOUNTAIN OPEN max_riders 8; Unit MOUNTAIN daily_rate 12000 deposit 40000 tank 50L."
            - "Departure 2026-12-10T09:00Z->2026-12-11T09:00Z (1 day window) required_guide_class MOUNTAIN capacity 8."
            - "Member SEASON but membership_expires_at 2026-05-01 (EXPIRED at confirm clock 2026-12-09) -> discount 0; training ADVANCED; waiver SIGNED; helmet+suit assigned."
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "Peak", required_class: "MOUNTAIN", max_riders: 8 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "U-3", unit_class: "MOUNTAIN", daily_rate_cents: 12000, deposit_cents: 40000, tank_capacity_liters: 50 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /gear-items"
              payload: { kind: "HELMET", size_code: "M", replacement_cost_cents: 12000 }
              as: DispatchOperator
              captures: { helmet_id: $.data.id }
            - call: "POST /gear-items"
              payload: { kind: "SUIT", size_code: "L", replacement_cost_cents: 20000 }
              as: DispatchOperator
              captures: { suit_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2026-12-10T09:00:00Z", ends_at: "2026-12-11T09:00:00Z", required_guide_class: "MOUNTAIN", capacity_riders: 8 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "Exp Mem", email: "exp@x.com", date_of_birth: "1988-01-01", membership_tier: "SEASON", membership_expires_at: "2026-05-01T00:00:00Z" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-09T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /members/${mem_id}/complete-training"
              payload: { level: "BASIC" }
              as: DispatchOperator
            - call: "POST /members/${mem_id}/complete-training"
              payload: { level: "ADVANCED" }
              as: DispatchOperator
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}", helmet_gear_id: "${helmet_id}", suit_gear_id: "${suit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver}" }
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "Reservation.${res_id}.estimated_total_cents == 24050"
            - "Reservation.${res_id}.reservation_status == CONFIRMED"

      - name: quote_discount_rounding_order_pinned_mode_b
        grounds:
          - calculations.estimate_reservation_quote
          - calculations.estimate_reservation_quote.variants.estimate
          - entities.Reservation.fields.estimated_total_cents
        distinguishing_aspect: |
          Mode (b): pinned rounding ORDER. gross 12050 with SEASON 0.10 -> round_half_up(1205.0) once on the
          combined gross gives discount 1205 and estimated_total 10845; discounting rental (4525), tour (6000),
          gear (1525) per-line then summing rounds to 1206 (=10844) — the scaffold pins the combined-once order.
        test_recipe:
          setup:
            - "Trail UTILITY OPEN max_riders 10; Unit UTILITY daily_rate 4525 deposit 20000 tank 30L."
            - "Departure 2026-12-12T09:00Z->2026-12-12T15:00Z (1 day) required_guide_class UTILITY capacity 10."
            - "Member SEASON active, waiver SIGNED, ONE gear item assigned (helmet only) -> gear_surcharge 1525."
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "Mid", required_class: "UTILITY", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "U-4", unit_class: "UTILITY", daily_rate_cents: 4525, deposit_cents: 20000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /gear-items"
              payload: { kind: "HELMET", size_code: "M", replacement_cost_cents: 12000 }
              as: DispatchOperator
              captures: { helmet_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2026-12-12T09:00:00Z", ends_at: "2026-12-12T15:00:00Z", required_guide_class: "UTILITY", capacity_riders: 10 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "Round Mem", email: "round@x.com", date_of_birth: "1991-02-02", membership_tier: "SEASON", membership_expires_at: "2027-04-01T00:00:00Z" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}", helmet_gear_id: "${helmet_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver}" }
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "Reservation.${res_id}.estimated_total_cents == 10845"

      - name: settlement_waterfall_pinned_eval_order_mode_c
        grounds:
          - calculations.final_settlement
          - entities.Settlement.fields.deposit_applied_cents
          - entities.Settlement.fields.refund_cents
          - entities.Settlement.fields.net_charge_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order. total_charges is the sum of five
          lines; deposit_applied = min(deposit_hold, total_charges); refund = deposit_hold - deposit_applied;
          net = max(0, total_charges - deposit_hold) — the scaffold pins compute total first, then waterfall,
          so deposit_applied (28860) + net (0) reconcile against deposit_hold (30000) exactly.
        test_recipe:
          setup:
            - "Same shape as instance 1 but charges fully consume the deposit: rental 15345, fuel 1800, late 5000, damage 6000, gear_loss 0 -> total 28145 < deposit 30000."
            - "Trail UTILITY OPEN; Unit UTILITY daily_rate 8000 deposit 30000 tank 40L; departure 2026-12-15T09:00Z->17:00Z; Member SEASON active CONFIRMED CHECKED_OUT; clock at 2026-12-15T19:00Z (120 min late)."
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "Ridge2", required_class: "UTILITY", max_riders: 20 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "U-5", unit_class: "UTILITY", daily_rate_cents: 8000, deposit_cents: 30000, tank_capacity_liters: 40 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /gear-items"
              payload: { kind: "HELMET", size_code: "M", replacement_cost_cents: 12000 }
              as: DispatchOperator
              captures: { helmet_id: $.data.id }
            - call: "POST /gear-items"
              payload: { kind: "SUIT", size_code: "L", replacement_cost_cents: 20000 }
              as: DispatchOperator
              captures: { suit_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "G Two", max_class: "UTILITY" }
              as: DispatchOperator
              captures: { guide_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2026-12-15T09:00:00Z", ends_at: "2026-12-15T17:00:00Z", required_guide_class: "UTILITY", capacity_riders: 20 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "WF Mem", email: "wf@x.com", date_of_birth: "1990-01-01", membership_tier: "SEASON", membership_expires_at: "2027-04-01T00:00:00Z" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}", helmet_gear_id: "${helmet_id}", suit_gear_id: "${suit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /tour-departures/${dep_id}/assign-guide"
              payload: { guide_id: "${guide_id}" }
              as: DispatchOperator
            - call: "POST /tour-departures/${dep_id}/lock"
              payload: {}
              as: DispatchOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /tour-departures/${dep_id}/depart"
              payload: {}
              as: Guide
              as_user_id: "${guide_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T19:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /reservations/${res_id}/return"
              payload: { fuel_return_fraction: 0.70, damage_assessed_cents: 6000 }
              as: DispatchOperator
              captures: { settle_id: $.data.id }
          assert:
            - "Settlement.${settle_id}.rental_charge_cents == 15345"
            - "Settlement.${settle_id}.fuel_charge_cents == 1800"
            - "Settlement.${settle_id}.late_charge_cents == 5000"
            - "Settlement.${settle_id}.damage_assessed_cents == 6000"
            - "Settlement.${settle_id}.deposit_applied_cents == 28145"
            - "Settlement.${settle_id}.refund_cents == 1855"
            - "Settlement.${settle_id}.net_charge_cents == 0"

  # =================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_parallel_dimensions_status_vs_settlement
        grounds:
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - state_machines.Reservation.NONE_to_HELD
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.Reservation.HELD_to_REFUNDED
          - entities.Reservation.fields.reservation_status
          - entities.Reservation.fields.settlement_status
        distinguishing_aspect: |
          Reservation carries two independent state axes: confirming moves reservation_status PENDING->CONFIRMED
          while settlement_status moves NONE->HELD; cancelling then moves reservation_status CONFIRMED->CANCELLED
          AND settlement_status HELD->REFUNDED on the same row — two dimensions evolving on one entity.
        test_recipe:
          setup:
            - "Trail TRAIL OPEN max_riders 10; Unit TRAIL daily_rate 5000 deposit 25000 tank 30L."
            - "Departure 2026-12-18T09:00Z->12:00Z required TRAIL capacity 10; Member NONE-tier waiver SIGNED; reservation CONFIRMED (HELD, deposit 25000)."
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "Loop", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "U-6", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2026-12-18T09:00:00Z", ends_at: "2026-12-18T12:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "Par Mem", email: "par@x.com", date_of_birth: "1992-06-06" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver}" }
              as: Member
              as_user_id: "${mem_id}"
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
              captures: { rstatus: $.data.reservation_status, sstatus: $.data.settlement_status }
          assert:
            - "Reservation.${res_id}.reservation_status == CANCELLED"
            - "Reservation.${res_id}.settlement_status == REFUNDED"
            - "Member.${mem_id}.deposit_hold_cents == 0"

      - name: trail_condition_revert_open_caution_open_cycle
        grounds:
          - state_machines.Trail.OPEN_to_CAUTION
          - state_machines.Trail.CAUTION_to_OPEN
          - entities.Trail.fields.condition
        distinguishing_aspect: |
          On the Trail entity (different entity from Reservation): condition cycles OPEN->CAUTION->OPEN, a
          revert loop — not a one-way linear pipeline; the second OPEN is reached only by going back from CAUTION.
        test_recipe:
          setup:
            - "Trail OPEN."
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "Cycle", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /trails/${trail_id}/closure"
              payload: { new_condition: "CAUTION", reason: "wind" }
              as: DispatchOperator
          trigger:
            - call: "POST /trails/${trail_id}/closure"
              payload: { new_condition: "OPEN", reason: "cleared" }
              as: DispatchOperator
              captures: { cond_event_id: $.data.trail_id }
          assert:
            - "Trail.${trail_id}.condition == OPEN"
            - "ClosureEvent.cancelled_departure_count == 0"

  # =================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: trail_close_cascades_departure_then_reservation_then_deposit_depth3
        grounds:
          - state_machines.Trail.OPEN_to_CLOSED
          - state_machines.TourDeparture.SCHEDULED_to_CANCELLED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.Reservation.HELD_to_REFUNDED
          - entities.ClosureEvent.fields.cancelled_departure_count
        distinguishing_aspect: |
          Depth-3 chain from one trigger: closing the Trail (A) cancels its SCHEDULED departure (B is caused by A);
          that departure cancel cancels its CONFIRMED reservation (C is caused by B); that reservation cancel
          refunds the HELD deposit (D is caused by C) — each hop caused by the prior, not the original close.
        test_recipe:
          setup:
            - "Trail OPEN max_riders 10; Unit TRAIL deposit 25000; departure SCHEDULED with one CONFIRMED reservation (HELD deposit 25000)."
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "ClsTrail", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "U-7", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2026-12-20T09:00:00Z", ends_at: "2026-12-20T12:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "Cas Mem", email: "cas@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver}" }
              as: Member
              as_user_id: "${mem_id}"
          trigger:
            - call: "POST /trails/${trail_id}/closure"
              payload: { new_condition: "CLOSED", reason: "avalanche risk" }
              as: DispatchOperator
              captures: { closed_count: $.data.cancelled_departure_count }
          assert:
            - "Trail.${trail_id}.condition == CLOSED"
            - "ClosureEvent.cancelled_departure_count == 1"
            - "TourDeparture.${dep_id}.status == CANCELLED"
            - "Reservation.${res_id}.reservation_status == CANCELLED"
            - "Reservation.${res_id}.settlement_status == REFUNDED"
            - "Unit.${unit_id}.status == AVAILABLE"
            - "Member.${mem_id}.deposit_hold_cents == 0"

      - name: depart_cascades_confirmed_to_checkedout_then_unit_out_depth2
        grounds:
          - state_machines.TourDeparture.LOCKED_to_DEPARTED
          - state_machines.Reservation.CONFIRMED_to_CHECKED_OUT
          - state_machines.Unit.RESERVED_to_OUT
          - state_machines.GearItem.ASSIGNED_to_OUT
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (departure depart, not trail close): departing the departure (A)
          checks out its CONFIRMED reservation (B caused by A); that reservation check-out flips its Unit
          RESERVED->OUT and gear ASSIGNED->OUT (C caused by B).
        test_recipe:
          setup:
            - "Trail TRAIL OPEN; Unit TRAIL; helmet+suit; guide TRAIL; departure LOCKED with one CONFIRMED reservation; clock >= starts_at."
          setup_api_calls:
            - call: "POST /trails"
              payload: { name: "DepTrail", required_class: "TRAIL", max_riders: 10 }
              as: DispatchOperator
              captures: { trail_id: $.data.id }
            - call: "POST /units"
              payload: { vin_tag: "U-8", unit_class: "TRAIL", daily_rate_cents: 5000, deposit_cents: 25000, tank_capacity_liters: 30 }
              as: DispatchOperator
              captures: { unit_id: $.data.id }
            - call: "POST /gear-items"
              payload: { kind: "HELMET", size_code: "M", replacement_cost_cents: 12000 }
              as: DispatchOperator
              captures: { helmet_id: $.data.id }
            - call: "POST /gear-items"
              payload: { kind: "SUIT", size_code: "L", replacement_cost_cents: 20000 }
              as: DispatchOperator
              captures: { suit_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "G Three", max_class: "TRAIL" }
              as: DispatchOperator
              captures: { guide_id: $.data.id }
            - call: "POST /tour-departures"
              payload: { trail_id: "${trail_id}", starts_at: "2026-12-22T09:00:00Z", ends_at: "2026-12-22T12:00:00Z", required_guide_class: "TRAIL", capacity_riders: 10 }
              as: DispatchOperator
              captures: { dep_id: $.data.id, dep_ver: $.data.version }
            - call: "POST /members/register"
              payload: { full_name: "Dep Mem", email: "dep@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { mem_id: $.data.id }
            - call: "POST /members/${mem_id}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /reservations"
              payload: { member_id: "${mem_id}", tour_departure_id: "${dep_id}", unit_id: "${unit_id}", helmet_gear_id: "${helmet_id}", suit_gear_id: "${suit_id}" }
              as: Member
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: { expected_tour_departure_version: "${dep_ver}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /tour-departures/${dep_id}/assign-guide"
