            - "Seventh trigger call: HTTP status == 200 and status == UNDERWRITING - after the clock moves to 2027-09-01 the same event yields seasoning_months_elapsed == 36 and seasoning_satisfied == true, so exactly 36 months is enough"
            - "Both refused doc-type-selection calls left their loan files in status == DRAFT with doc_type == null"

      - name: corner_terminal_finding_and_non_member_removal_codes_are_reachable
