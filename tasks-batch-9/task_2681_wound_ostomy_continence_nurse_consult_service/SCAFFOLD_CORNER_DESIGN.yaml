      - name: rental_days_exceeding_authorization_rejected_then_passes_at_equality
        claim_type: Violation → Error
        grounds:
          - validations[priority=70]
          - errors[ERR_RENTAL_DAYS_EXCEED_AUTHORIZATION]
          - entities.SupportSurfaceOrder.fields.billable_days
        distinguishing_aspect: "The comparison is billable_days <= authorized_days, and billable_days is CEILED — so a 49-hour rental authorized for 2 days is refused at approval time even though the requester thought two days was enough, while the same interval authorized for 3 days passes at exact equality."
        test_recipe:
          setup:
            - "Unit 3E has rental_budget_cap_cents 200000 and one ADMITTED patient MRN-Y1."
            - "SupportSurface BED-202 is AVAILABLE at daily_rate_cents 10000."
            - "Order O1 covers 2026-08-01T00:00:00Z..2026-08-03T01:00:00Z (49 hours, so billable_days 3) but declares authorized_days 2; order O2 covers the identical interval with authorized_days 3."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 200000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-Y1", unit_id: "${u1_id}", admitted_at: "2026-07-31T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /support-surfaces"
              payload: { asset_tag: "BED-202", surface_class: "ALTERNATING_PRESSURE", daily_rate_cents: 10000, vendor_name: "AirBeds Inc" }
              as: MaterialsCoordinator
              captures: { s1_id: "$.data.id" }
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p1_id}", unit_id: "${u1_id}", support_surface_id: "${s1_id}", rental_start: "2026-08-01T00:00:00Z", rental_end: "2026-08-03T01:00:00Z", authorized_days: 2 }
              as: MaterialsCoordinator
              captures: { o1_id: "$.data.id" }
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p1_id}", unit_id: "${u1_id}", support_surface_id: "${s1_id}", rental_start: "2026-08-01T00:00:00Z", rental_end: "2026-08-03T01:00:00Z", authorized_days: 3 }
              as: MaterialsCoordinator
              captures: { o2_id: "$.data.id" }
            - call: "GET /units/${u1_id}"
              payload: {}
              as: MaterialsCoordinator
              captures: { u1_v: "$.data.version" }
          trigger:
            - call: "POST /support-surface-orders/${o1_id}/approve"
              payload: { expected_unit_version: "${u1_v}" }
              as: MaterialsCoordinator
              captures: { err_id: "$.data.error_id" }
            - call: "POST /support-surface-orders/${o2_id}/approve"
              payload: { expected_unit_version: "${u1_v}" }
              as: MaterialsCoordinator
          assert:
            - "Both orders were created with HTTP 201 and BOTH report billable_days == 3 — the day count comes from the interval, never from authorized_days"
            - "Call 1 returns HTTP 422 with data.error_id == ERR_RENTAL_DAYS_EXCEED_AUTHORIZATION: 3 > 2"
            - "After call 1 SupportSurfaceOrder.${o1_id}.fulfillment_status is still REQUESTED, Unit.${u1_id}.rental_encumbered_cents == 0 and Unit.${u1_id}.version is unchanged, so ${u1_v} is still current for the second call"
            - "Call 2 returns HTTP 200: 3 <= 3 passes at the exact boundary"
            - "The two orders share the same surface and interval, yet call 2 raises no ERR_SURFACE_UNAVAILABLE, because O1 never left fulfillment_status REQUESTED and the occupation rule only looks at APPROVED and DELIVERED orders"
            - "Unit.${u1_id}.rental_encumbered_cents == 32400 and rental_available_cents == 167600; SupportSurface.${s1_id}.status == IN_USE"

      - name: budget_ceiling_passes_at_equality_then_rejects_order_and_negative_adjustment
        claim_type: Aggregate validation
        grounds:
          - validations[priority=72]
          - errors[ERR_RENTAL_BUDGET_EXCEEDED]
          - entities.Unit.fields.rental_available_cents
          - endpoints[POST /units/{unit_id}/budget-adjustments]
        distinguishing_aspect: "Two identical orders are each individually affordable against the cap; only their sum breaches it, and the check is against the DERIVED rental_available_cents rather than the raw cap. The same 402 also guards budget-adjustments in the opposite direction — a downward adjustment may not drive availability negative — and topping the cap back up re-admits the previously refused order unchanged."
        test_recipe:
          setup:
            - "Unit 3E has rental_budget_cap_cents 52920, chosen to equal exactly one order's authorized cost."
            - "Patient MRN-Z1 is ADMITTED on 3E; surfaces BED-203 and BED-204 are both AVAILABLE at daily_rate_cents 7000 so the two orders never contend for one asset."
            - "Orders O1 and O2 each cover 2026-08-01T00:00:00Z..2026-08-08T00:00:00Z (168 hours, 7 billable days) with authorized_days 7, giving projected 49000, fee 3920 and authorized_cost_cents 52920 each."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 52920 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
