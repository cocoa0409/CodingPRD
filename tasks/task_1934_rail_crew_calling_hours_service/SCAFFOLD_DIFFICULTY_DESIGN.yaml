            - call: "POST /api/extra-boards"
              payload: { board_code: "CHI-CONDR-07", craft: "CONDUCTOR", terminal: "CHI", guaranteed_slots: 1 }
              as: CrewManager
              captures: { board_id: $.data.id }
          trigger:
            - call: "POST /api/leave-bids"
              payload: { employee_id: "${emp1_id}", leave_type: "PERSONAL_DAY", start_date: "2026-08-20T00:00:00Z", end_date: "2026-08-18T00:00:00Z" }
              as: Employee
              as_user_id: "${emp1_id}"
              captures: { err_temporal: $.data.error_id }
            - call: "POST /api/extra-boards/${board_id}/slots"
              payload: { employee_id: "${emp2_id}" }
              as: CrewManager
              captures: { err_referential: $.data.error_id }
          assert:
            - "captured err_temporal == ERR_TEMPORAL_WINDOW (start after end; temporal p9)"
            - "captured err_referential == ERR_REFERENTIAL_MISMATCH (engineer on conductor board; referential p12)"
            - "the two failures surface different category-pair errors from the same ordered validation table"

