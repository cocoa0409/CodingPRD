    distinguishing_aspect: "The p16 probe uses a licence whose stored verification_status is still VERIFIED and a therapist whose status is still ACTIVE, because no compliance sweep has run: booking must reject it purely by comparing expires_on with the current logical-clock date, so an implementation that trusts the stored status accepts the booking."
