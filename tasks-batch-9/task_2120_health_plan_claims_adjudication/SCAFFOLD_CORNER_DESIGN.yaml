              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/benefit-plans/${plan_id}/fee-schedule-rates"
              payload: { procedure_code: "73721", allowed_amount_cents: 40000, effective_date: "2026-01-01" }
              as: NetworkManager
            - call: "POST /adjudication/members"
              payload: { member_number: "M-RB-2", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /adjudication/members/${mem_id}/coverages"
              payload: { effective_date: "2026-01-01", cob_order: "PRIMARY" }
              as: PlanAdmin
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-RB-2", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /adjudication/claims/${c_id}/adjudicate"
              payload: {}
              as: ClaimsIntake
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_FORBIDDEN_ROLE"
            - "HTTP status is 403"
            - "Claim.${c_id}.status == RECEIVED and adjudication_pass == 0"

      - name: request_with_an_unrecognised_role_header_returns_unauthenticated
        claim_type: other_role_denied
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "The priority-1 auth check rejects any X-User-Role outside the seven declared roles with ERR_UNAUTHENTICATED (401), which outranks the priority-2 role check and every existence check."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z; no other data is required."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
