          - entities.Reservation.fields.table_code
        distinguishing_aspect: |
          Reservation table resource, half-open [starts_at, ends_at) semantics:
          CONFIRMING a second reservation on table T1 for 18:30-20:00 overlapping an
          existing CONFIRMED 18:00-19:00 is rejected with ERR_TABLE_DOUBLE_BOOKED;
          adjacency (ends_at == other.starts_at) would NOT conflict.
