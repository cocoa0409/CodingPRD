      - name: remote_hands_per_segment_ceiling_then_per_segment_rounding
        grounds:
          - calculations.remote_hands_labor_charge
          - entities.RemoteHandsTicket.fields.billable_increments
          - entities.RemoteHandsTicket.fields.included_increments_applied
          - entities.RemoteHandsTicket.fields.labor_charge_usd
          - entities.Contract.fields.remote_hands_remaining_minutes
          - state_machines.RemoteHandsTicket.execution_DISPATCHED_to_COMPLETED
        distinguishing_aspect: |
          Three chained rounding decisions compose in a pinned order: ceiling PER SEGMENT
          (7, 10 and 12 minutes each become 1 increment, not ceil(29/15) = 2), the bundled-minute
          waterfall consumes the CHRONOLOGICALLY FIRST segment (the 08:00 in-hours one, so the
          waiver is worth 62.50 rather than 84.38), and the after-hours money is rounded PER
          SEGMENT then summed for 84.38 + 84.38 = 168.76 — summing raw then rounding once gives
          168.75.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "Contract ACTIVE with remote_hands_included_minutes 15, so remote_hands_remaining_minutes is 15."
            - "One cabinet INSTALLED on the contract; two authorized contacts both holding the REMOTE_HANDS scope (requester and a different authorizer)."
            - "One STANDARD-severity ticket AUTHORIZED at 2026-08-01T00:00:00Z (response_deadline_at 2026-08-01T08:00:00Z) and DISPATCHED at 2026-08-01T00:00:00Z, so sla_breached is false."
            - "Clock advanced to 2026-08-02T00:00:00Z before completion."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
