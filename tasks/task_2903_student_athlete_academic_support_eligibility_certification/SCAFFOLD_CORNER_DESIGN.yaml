            - "The declaration returns HTTP 200 with data.declared_program_id == ${dp55_id} and data.major_declared_term_index == 1"
            - "StudentAthlete.${s55_id}.degree_applicable_credits == 0.00 and progress_pct == 0.0000 - the audit re-ran but found no COMPLETED enrollment"
            - "StudentAthlete.${s55_id}.eligibility_state == NOT_CERTIFIED because no certification governs the student yet"

      - name: tutor_assignment_links_tutor_and_enrollment
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /athletics/tutor-assignments]
          - endpoints[GET /athletics/tutor-assignments]
          - entities.TutorAssignment.fields.enrollment_id
        distinguishing_aspect: "The junction row is reachable from both sides - the tutor_id filter and the enrollment_id filter each return exactly this assignment - and while it is still PROPOSED the tutor's assigned_weekly_hours stays 0.00."
        test_recipe:
          setup:
            - "Tutor T56 is TRAINED with subject_codes [\"MATH\"] and student S56 is ENROLLED in MATH-101 in 2026FA."
          setup_api_calls:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
