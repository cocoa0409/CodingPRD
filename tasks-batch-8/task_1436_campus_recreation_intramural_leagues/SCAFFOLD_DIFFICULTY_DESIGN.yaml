          trigger:
            - { call: "POST /v1/games/${g_id}/officiating-assignments", payload: { staff_id: "${o_id}" }, as: LeagueCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "game status is RESCHEDULE_REQUIRED at trigger time (closure already bumped it)"
            - "error_id == ERR_INVALID_STATE (409): assignments require a SCHEDULED game — the cross-entity gate fires"
            - "no assignment row exists for the game afterwards (GET /v1/officiating-assignments?game_id=g total_count == 0)"
      - name: checkout_gated_by_membership_state
        grounds:
          - state_machines.Membership.ACTIVE_to_EXPIRED
          - validations[priority=8]
          - errors[ERR_MEMBERSHIP_INACTIVE]
        distinguishing_aspect: |
          Entity pair EquipmentCheckout -> Membership (different pair from the sibling): lazily evaluated membership
          expiry (logical date 2026-12-12 > FALL_2026 end 2026-12-11) flips the membership to EXPIRED and the checkout
          fails with ERR_MEMBERSHIP_INACTIVE — while the waiver (same AY) is still valid, isolating the dependency.
        test_recipe:
          setup:
            - "Member M: waiver signed 2026-08-24, FALL_2026 membership purchased 2026-08-24 (ACTIVE); pool exists; clock advanced to 2026-12-12"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/members", payload: { email: "mm@x.edu", full_name: "Mem M", affiliation: "STUDENT" }, as: RecAdmin, captures: { mM_id: "$.data.id", mM_v: "$.data.version" } }
            - { call: "POST /v1/members/${mM_id}/waiver-sign", payload: {}, as: Member, as_user_id: "${mM_id}", captures: { mM_v2: "$.data.version" } }
            - { call: "POST /v1/members/${mM_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${mM_v2}" }, as: Member, as_user_id: "${mM_id}", captures: { ms_id: "$.data.id" } }
            - { call: "POST /v1/equipment-pools", payload: { item_type: "BASKETBALL", total_qty: 5, daily_late_fee_cents: 150, unit_replacement_cents: 900 }, as: RecAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-12-12T09:00:00Z" }, as: RecAdmin }
          trigger:
            - { call: "POST /v1/equipment-checkouts", payload: { equipment_pool_id: "${p_id}", member_id: "${mM_id}", quantity: 1, due_at: "2026-12-13T17:00:00Z" }, as: Member, as_user_id: "${mM_id}", captures: { err: "$.data.error_id" } }
            - { call: "GET /v1/memberships/${ms_id}", payload: {}, as: FacilityManager, captures: { ms_status: "$.data.status" } }
          assert:
            - "error_id == ERR_MEMBERSHIP_INACTIVE (409) — the membership, not the waiver (valid through 2027-07-31), gates"
            - "membership lazily reads as status == EXPIRED (current date 2026-12-12 > term end 2026-12-11; end date itself was inclusive)"
            - "pool available_qty unchanged at 5 (rejection performed no debit)"
