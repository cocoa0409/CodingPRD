            - "before the trigger: PlanElement.${el_land}.policy_count == 8 and consistency_status == STALE; ConsistencyLink.${lk}.status == STALE with staled_by_amendment_id == ${amd}; PlanUpdate.${pu}.open_consistency_link_count == 1 and compliance_posture == CONSISTENCY_HOLD; Hearing.${h2}.status == BLOCKED; Hearing.${h1}.adopted_amendment_count == 1"
            - "COMPENSATION LINK 1: PlanElement.${el_land}.policy_count == 6 (exactly the pre-amendment value), status == APPROVED (restored from prior_element_status) and consistency_status == CLEARED (the element sources no ConsistencyLink, so the recomputation is vacuously CLEARED)"
            - "COMPENSATION LINK 2: ConsistencyLink.${lk}.status == CLEARED with staled_by_amendment_id == null, and its reconciled_by_user_id and reconciliation_note are still the values set at reconciliation (the compensation restores the link without re-reconciling it)"
            - "COMPENSATION LINK 3: PlanElement.${el_trans}.consistency_status == CLEARED"
            - "COMPENSATION LINK 4: PlanUpdate.${pu}.open_consistency_link_count == 0, compliance_posture == CLEAR and Hearing.${h2}.status == SCHEDULED (BLOCKED -> SCHEDULED on the posture returning to CLEAR)"
            - "Amendment.${amd}.status == RESCINDED while policy_delta == 2 and applied_policy_count == 8 are retained as the audit trail; Hearing.${h1}.adopted_amendment_count == 0 and Hearing.${h1}.amendment_count == 1"
            - "Hearing.${h1}.status == OPEN throughout (rescission requires the hearing to still be open) and PlanUpdate.${pu}.status == STATE_CERTIFIED"
            - "the invariant policy_count_conservation holds: PlanElement.${el_land}.policy_count equals its creation value plus the sum of policy_delta over ADOPTED amendments targeting it (6 + 0 == 6)"
            - "PlanUpdate.${pu}.required_elements_complete_count == 5 and equity_share_pct == 40.0 (untouched by the amendment lifecycle)"
