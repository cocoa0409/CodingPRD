              as_user_id: "${prep_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /documents/${doc_id}/status"
              payload: { status: "RECEIVED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/assign"
              payload: { preparer_id: "${prep_id}" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "DOCS_PENDING" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "IN_PREP" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "PREPARED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /refund-advances"
              payload: { tax_return_id: "${ret_id}", requested_cents: 60000 }
