              payload: { registration_request_id: "${req_x1_id}", submission_channel: "ELECTRONIC" }
              as: RegistrationPrincipal
              captures: { fp_x1_id: $.data.id }
            - call: "POST /registration-desk/fingerprint-submissions/${fp_x1_id}/process"
              payload: { outcome: "CLEARED" }
              as: SystemOperator
            - call: "POST /registration-desk/registration-requests/${req_x1_id}/submit"
