scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_engagement_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.CleanupEngagement.fields.workflow_status, entities.CleanupEngagement.fields.billing_status]
        distinguishing_aspect: "POST /engagements with required fields returns 201; workflow_status=DRAFT, billing_status=UNBILLED, scope_locked=false, complexity_tier defaults MEDIUM."
        test_recipe:
          setup: ["Empty DB; one Client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "C1", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "E1", period_start: "2025-01-01", period_end: "2025-06-30" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
          assert:
            - "CleanupEngagement.${eng_id}.workflow_status == DRAFT"
            - "CleanupEngagement.${eng_id}.billing_status == UNBILLED"
            - "CleanupEngagement.${eng_id}.scope_locked == false"
            - "CleanupEngagement.${eng_id}.complexity_tier == MEDIUM"
            - "CleanupEngagement.${eng_id}.version == 1"

      - name: get_engagement_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.CleanupEngagement", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /engagements/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /engagements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_engagement_missing_required_field
        claim_type: Required Fields
        grounds: [entities.CleanupEngagement.fields.period_start]
        distinguishing_aspect: "POST /engagements omitting period_start returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One Client exists."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "C2", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "E2", period_end: "2025-06-30" }
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: client_default_accounting_basis_accrual
        claim_type: Defaults
        grounds: [entities.Client.fields.accounting_basis]
        distinguishing_aspect: "POST /clients omitting accounting_basis applies default ACCRUAL."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { legal_name: "DefCli", entity_type: "SOLE_PROP" }
              as: EngagementManager
              captures: { client_id: $.data.id }
          assert:
            - "Client.${client_id}.accounting_basis == ACCRUAL"

      - name: account_normal_side_computed_from_type
        claim_type: Computed Fields
        grounds: [entities.LedgerAccount.fields.normal_side, entities.LedgerAccount.fields.account_type]
        distinguishing_aspect: "An EXPENSE account derives normal_side DEBIT regardless of any input; an INCOME account derives CREDIT."
        test_recipe:
          setup: ["Engagement in any state; create two accounts."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "NS Co", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "NS", period_start: "2025-01-01", period_end: "2025-06-30" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/accounts"
              payload: { account_code: "5000", name: "Exp", account_type: "EXPENSE" }
              as: Bookkeeper
              captures: { exp: $.data.id, ns: $.data.normal_side }
          assert:
            - "LedgerAccount.${exp}.normal_side == DEBIT"

      - name: duplicate_account_code_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=14]", "errors[ERR_DUPLICATE_ACCOUNT_CODE]"]
        distinguishing_aspect: "A second non-EXCLUDED account with the same account_code in one engagement returns ERR_DUPLICATE_ACCOUNT_CODE (409)."
        test_recipe:
          setup: ["Engagement with one account code '1000'."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Dup Co", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Dup", period_start: "2025-01-01", period_end: "2025-06-30" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/accounts"
              payload: { account_code: "1000", name: "Cash", account_type: "ASSET" }
              as: Bookkeeper
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/accounts"
              payload: { account_code: "1000", name: "Cash 2", account_type: "ASSET" }
              as: Bookkeeper
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_DUPLICATE_ACCOUNT_CODE"
            - "HTTP status == 409"

      - name: list_engagements_pagination_envelope
        claim_type: Listing
        grounds: [endpoints.GET /engagements]
        distinguishing_aspect: "GET /engagements returns an array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["One client, one engagement."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "List Co", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "L", period_start: "2025-01-01", period_end: "2025-06-30" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
          trigger:
            - call: "GET /engagements"
              payload: { client_id: "${client_id}" }
              as: EngagementManager
          assert:
            - "response_type == array"
            - "response includes total_count and has_more"

  # =========================================================================
  - section: state_machines
    instances:
      - name: start_scoping_from_scoping_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.CleanupEngagement.DRAFT_to_SCOPING", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling start-scoping on an engagement already in SCOPING returns ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["Engagement already in SCOPING."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "IS Co", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "IS", period_start: "2025-01-01", period_end: "2025-06-30" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/start-scoping"
              payload: {}
              as: EngagementManager
          trigger:
            - call: "POST /engagements/${eng_id}/start-scoping"
              payload: {}
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: cancel_completed_terminal_locked
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.CleanupEngagement.DRAFT_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "cancel from CANCELLED (terminal) returns ERR_INVALID_STATE; terminal states accept no transitions."
        test_recipe:
          setup: ["Engagement CANCELLED from DRAFT."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Term Co", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "T", period_start: "2025-01-01", period_end: "2025-06-30" }
              as: EngagementManager
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/cancel"
              payload: {}
              as: EngagementManager
          trigger:
            - call: "POST /engagements/${eng_id}/cancel"
              payload: {}
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: categorize_without_posted_entries_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.LedgerAccount.DRAFT_to_CATEGORIZED", "errors[ERR_NO_POSTED_ENTRIES]"]
        distinguishing_aspect: "Categorizing an account with no POSTED entries returns ERR_NO_POSTED_ENTRIES (409)."
        test_recipe:
          setup: ["Engagement in RECONSTRUCTION; account with only a DRAFT entry."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Cat Co", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Cat", period_start: "2025-01-01", period_end: "2025-06-30" }
              as: EngagementManager
              captures: { eng_id: $.data.id, eng_v0: $.data.version }
            - call: "POST /engagements/${eng_id}/start-scoping"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/scope-estimates"
              payload: { monthly_txn_rate: 220 }
              as: EngagementManager
              captures: { se_id: $.data.id }
            - call: "POST /engagements/${eng_id}/scope-estimates/${se_id}/accept"
              payload: { expected_engagement_version: "${eng_v0}" }
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/accounts"
              payload: { account_code: "1000", name: "Cash", account_type: "ASSET" }
              as: Bookkeeper
              captures: { acct: $.data.id }
            - call: "POST /engagements/${eng_id}/entries"
              payload: { account_id: "${acct}", txn_date: "2025-02-01", side: "DEBIT", amount_cents: 1000 }
              as: Bookkeeper
              captures: { en: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/accounts/${acct}/categorize"
              payload: {}
              as: Bookkeeper
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_NO_POSTED_ENTRIES"
            - "HTTP status == 409"

      - name: advance_reconciliation_with_draft_entries_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.CleanupEngagement.RECONSTRUCTION_to_RECONCILIATION", "errors[ERR_UNPOSTED_ENTRIES]"]
        distinguishing_aspect: "Advancing to reconciliation while a DRAFT entry remains returns ERR_UNPOSTED_ENTRIES (409)."
        test_recipe:
          setup: ["RECONSTRUCTION engagement; one categorized account, plus a stray DRAFT entry on another account."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Adv Co", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Adv", period_start: "2025-01-01", period_end: "2025-06-30" }
              as: EngagementManager
              captures: { eng_id: $.data.id, eng_v0: $.data.version }
            - call: "POST /engagements/${eng_id}/start-scoping"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/scope-estimates"
              payload: { monthly_txn_rate: 220 }
              as: EngagementManager
              captures: { se_id: $.data.id }
            - call: "POST /engagements/${eng_id}/scope-estimates/${se_id}/accept"
              payload: { expected_engagement_version: "${eng_v0}" }
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/accounts"
              payload: { account_code: "1000", name: "Cash", account_type: "ASSET" }
              as: Bookkeeper
              captures: { a1: $.data.id }
            - call: "POST /engagements/${eng_id}/entries"
              payload: { account_id: "${a1}", txn_date: "2025-02-01", side: "DEBIT", amount_cents: 1000 }
              as: Bookkeeper
              captures: { en1: $.data.id }
            - call: "POST /engagements/${eng_id}/entries/${en1}/post"
              payload: {}
              as: Bookkeeper
            - call: "POST /engagements/${eng_id}/accounts/${a1}/categorize"
              payload: {}
              as: Bookkeeper
            - call: "POST /engagements/${eng_id}/entries"
              payload: { account_id: "${a1}", txn_date: "2025-03-01", side: "CREDIT", amount_cents: 500 }
              as: Bookkeeper
              captures: { en2: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/advance-to-reconciliation"
              payload: {}
              as: EngagementManager
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_UNPOSTED_ENTRIES"
            - "HTTP status == 409"

      - name: waive_unreconciled_diff_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Exception.OPEN_to_WAIVED", "errors[ERR_CANNOT_WAIVE_DIFF]"]
        distinguishing_aspect: "Waiving an UNRECONCILED_DIFF exception returns ERR_CANNOT_WAIVE_DIFF (409)."
        test_recipe:
          setup: ["Engagement with an OPEN UNRECONCILED_DIFF exception on an account."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Wv Co", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Wv", period_start: "2025-01-01", period_end: "2025-06-30" }
              as: EngagementManager
              captures: { eng_id: $.data.id, eng_v0: $.data.version }
            - call: "POST /engagements/${eng_id}/start-scoping"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/scope-estimates"
              payload: { monthly_txn_rate: 220 }
              as: EngagementManager
              captures: { se_id: $.data.id }
            - call: "POST /engagements/${eng_id}/scope-estimates/${se_id}/accept"
              payload: { expected_engagement_version: "${eng_v0}" }
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/accounts"
              payload: { account_code: "1010", name: "Checking", account_type: "ASSET", is_bank_account: true }
              as: Bookkeeper
              captures: { bank: $.data.id }
            - call: "POST /engagements/${eng_id}/exceptions"
              payload: { account_id: "${bank}", kind: "UNRECONCILED_DIFF", severity: "BLOCKING" }
              as: Reviewer
              as_user_id: "reviewer-1"
              captures: { x_id: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/exceptions/${x_id}/waive"
              payload: {}
              as: Reviewer
              as_user_id: "reviewer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_CANNOT_WAIVE_DIFF"
            - "HTTP status == 409"

      - name: reverse_entry_creates_reversing_entry_self_reference
        claim_type: Side Effect Execution
        grounds: [state_machines.LedgerEntry.POSTED_to_REVERSED, entities.LedgerEntry.fields.reversed_entry_id]
        distinguishing_aspect: "Reversing a POSTED DEBIT 1000 creates a new POSTED CREDIT 1000 entry whose reversed_entry_id points to the original."
        test_recipe:
          setup: ["Account with one POSTED DEBIT 1000 entry."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Rev Co", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Rev", period_start: "2025-01-01", period_end: "2025-06-30" }
              as: EngagementManager
              captures: { eng_id: $.data.id, eng_v0: $.data.version }
            - call: "POST /engagements/${eng_id}/start-scoping"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/scope-estimates"
              payload: { monthly_txn_rate: 220 }
              as: EngagementManager
              captures: { se_id: $.data.id }
            - call: "POST /engagements/${eng_id}/scope-estimates/${se_id}/accept"
              payload: { expected_engagement_version: "${eng_v0}" }
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/accounts"
              payload: { account_code: "1000", name: "Cash", account_type: "ASSET" }
              as: Bookkeeper
              captures: { acct: $.data.id }
            - call: "POST /engagements/${eng_id}/entries"
              payload: { account_id: "${acct}", txn_date: "2025-02-01", side: "DEBIT", amount_cents: 1000 }
              as: Bookkeeper
              captures: { en: $.data.id }
            - call: "POST /engagements/${eng_id}/entries/${en}/post"
              payload: {}
              as: Bookkeeper
          trigger:
            - call: "POST /engagements/${eng_id}/entries/${en}/reverse"
              payload: {}
              as: Bookkeeper
          assert:
            - "LedgerEntry.${en}.status == REVERSED"
            - "GET /engagements/${eng_id}/entries?reversed_entry_id=${en} returns exactly 1 POSTED CREDIT entry of 1000"

      - name: engagement_initial_state_draft
        claim_type: Initial State
        grounds: [state_machines.CleanupEngagement.workflow_status]
        excluded_because:
          difficulty_instance: dual_variant_calc / taxable_income_cash_vs_accrual_diverge
          rationale: "Newly created engagement starting in DRAFT is exercised as the first chain step in the §1.8 setup."

  # =========================================================================
  - section: calculations
    instances:
      - name: service_proration_mid_month
        claim_type: Correct Result
        grounds: [calculations.service_proration, entities.ServicePlan.fields.first_month_prorated_cents]
        distinguishing_aspect: "ServicePlan monthly_fee 30000, conversion 2026-04-10 (April, 30 days, 21 days remaining inclusive) -> first_month_prorated_cents == 21000 on activate."
        test_recipe:
          setup: ["Engagement in TAX_HANDOFF with a PENDING service plan."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Pro Co", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Pro", period_start: "2025-01-01", period_end: "2025-06-30" }
              as: EngagementManager
              captures: { eng_id: $.data.id, eng_v0: $.data.version }
            - call: "POST /engagements/${eng_id}/start-scoping"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/scope-estimates"
              payload: { monthly_txn_rate: 220 }
              as: EngagementManager
              captures: { se_id: $.data.id }
            - call: "POST /engagements/${eng_id}/scope-estimates/${se_id}/accept"
              payload: { expected_engagement_version: "${eng_v0}" }
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/accounts"
              payload: { account_code: "1000", name: "Cash", account_type: "ASSET" }
              as: Bookkeeper
              captures: { acct: $.data.id }
            - call: "POST /engagements/${eng_id}/entries"
              payload: { account_id: "${acct}", txn_date: "2025-02-01", side: "DEBIT", amount_cents: 1000 }
              as: Bookkeeper
              captures: { en: $.data.id }
            - call: "POST /engagements/${eng_id}/entries/${en}/post"
              payload: {}
              as: Bookkeeper
            - call: "POST /engagements/${eng_id}/accounts/${acct}/categorize"
              payload: {}
              as: Bookkeeper
            - call: "POST /engagements/${eng_id}/advance-to-reconciliation"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/accounts/${acct}/mark-reconciled"
              payload: {}
              as: Reviewer
              as_user_id: "reviewer-1"
            - call: "POST /engagements/${eng_id}/tax-packages"
              payload: {}
              as: TaxPreparer
              captures: { tp: $.data.id }
            - call: "POST /engagements/${eng_id}/service-plans"
              payload: { monthly_fee_cents: 30000, conversion_date: "2026-04-10" }
              as: EngagementManager
              captures: { sp: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/service-plans/${sp}/activate"
              payload: {}
              as: EngagementManager
          assert:
            - "ServicePlan.${sp}.first_month_prorated_cents == 21000"
            - "ServicePlan.${sp}.status == ACTIVE"

      - name: readiness_score_with_blocking_penalty
        claim_type: Constants Applied
        grounds: [calculations.readiness_score, entities.CleanupEngagement.fields.readiness_score]
        distinguishing_aspect: "1 of 2 accounts reconciled with 1 open BLOCKING exception -> readiness_score == 42 (floor(100*1/2) - 1*8)."
        test_recipe:
          setup: ["Engagement with 2 non-excluded accounts, 1 reconciled, plus 1 OPEN BLOCKING exception."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Rd Co", entity_type: "LLC", accounting_basis: "ACCRUAL" }
              as: EngagementManager
              captures: { client_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", title: "Rd", period_start: "2025-01-01", period_end: "2025-06-30" }
              as: EngagementManager
              captures: { eng_id: $.data.id, eng_v0: $.data.version }
            - call: "POST /engagements/${eng_id}/start-scoping"
              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/scope-estimates"
              payload: { monthly_txn_rate: 220 }
              as: EngagementManager
              captures: { se_id: $.data.id }
            - call: "POST /engagements/${eng_id}/scope-estimates/${se_id}/accept"
              payload: { expected_engagement_version: "${eng_v0}" }
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/accounts"
              payload: { account_code: "1000", name: "Cash", account_type: "ASSET" }
              as: Bookkeeper
              captures: { a1: $.data.id }
            - call: "POST /engagements/${eng_id}/accounts"
              payload: { account_code: "5000", name: "Exp", account_type: "EXPENSE" }
              as: Bookkeeper
              captures: { a2: $.data.id }
            - call: "POST /engagements/${eng_id}/entries"
              payload: { account_id: "${a1}", txn_date: "2025-02-01", side: "DEBIT", amount_cents: 1000 }
              as: Bookkeeper
              captures: { e1: $.data.id }
            - call: "POST /engagements/${eng_id}/entries/${e1}/post"
              payload: {}
              as: Bookkeeper
            - call: "POST /engagements/${eng_id}/entries"
