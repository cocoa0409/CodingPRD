  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_account_version_on_contribution
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[contribution-create-stale-account]"
          - "errors[ERR_STALE_ACCOUNT_VERSION]"
          - "endpoints['POST /able/accounts/{id}/contributions']"
        distinguishing_aspect: "After one contribution advances Account.version, a second contribution still carrying the pre-advance version (${acct_v} from account creation) is rejected ERR_STALE_ACCOUNT_VERSION (412)."
        test_recipe:
          setup: ["OPEN account just created (version observed as acct_v); one contribution then advances version to acct_v2."]
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Occ O", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}" }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 100000, expected_account_version: "${acct_v}" }
              as: ProgramAdministrator
              captures: { acct_v2: $.data.version }
          trigger:
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 100000, expected_account_version: "${acct_v}" }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_ACCOUNT_VERSION, HTTP 412"
            - "second contribution NOT recorded; Account.${acct_id}.basis_cents == 100000 (only the first)"

      - name: occ_correct_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[contribution-create-stale-account]"
          - entities.Account.fields.version
        distinguishing_aspect: "A contribution carrying the current Account.version succeeds and bumps Account.version by exactly 1."
        test_recipe:
