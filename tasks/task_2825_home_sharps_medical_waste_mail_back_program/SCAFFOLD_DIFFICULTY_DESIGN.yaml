  - rule_id: cross_entity_state_dependency
    instances:

      - name: kit_seal_blocked_when_enrollment_paused
        grounds:
          - validations.priority_6_ERR_INVALID_ENROLLMENT_STATE
          - state_machines.Kit.ACTIVE_FILLING_to_SEALED
          - state_machines.Patient.ENROLLED_to_SUSPENDED
          - state_machines.Enrollment.ACTIVE_to_PAUSED
        distinguishing_aspect: |
          The blocking entity is TWO hops away from the endpoint's own row and in a DIFFERENT aggregate
          direction: sealing writes a Kit, but the gate reads Kit -> Enrollment.status, which was changed
          indirectly by a Patient status action. The kit itself is in the perfectly legal ACTIVE_FILLING
          state and the payload is valid, so only the cross-entity read can reject the call. The setup
          deliberately uses SUSPEND (which voids ISSUED kits but leaves ACTIVE_FILLING kits in the
          patient's hands) so that a sealable kit still exists after the cascade.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Baseline CA state rule, PS-A spec, CA-TF-0001 facility, NovaPen MANUFACTURER program NPD-2026 (500000 ceiling, 6000 allowance)."
            - "Dana Reyes ENROLLED with a 30-day / 5-kit ACTIVE enrollment; kit 1 issued and acknowledged, so it is ACTIVE_FILLING (physically in the patient's hands)."
            - "The ProgramAdmin then SUSPENDs the patient: Patient ENROLLED -> SUSPENDED, the enrollment ACTIVE -> PAUSED, and because the only kit is ACTIVE_FILLING rather than ISSUED it is NOT voided and its 1465-cent reservation stays booked."
