      - { name: out_the_door_cents, type: integer, source: computed, description: "Total OTD price; see calc deal_out_the_door" }
      - { name: amount_financed_cents, type: integer, source: computed, description: "Amount sent to lender; provisional vs final per calc deal_amount_financed" }
      - { name: status, type: enum, source: system, description: "DRAFT | QUOTED | FINANCE_SUBMITTED | APPROVED | DELIVERED | DECLINED | CANCELLED", constraints: "set by Deal state machine" }
      - { name: approved_lender_payoff_cents, type: integer, source: input, default: 0, description: "Lender-confirmed trade payoff used at approval (final variant input)", constraints: ">= 0" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  # ---------------------------------------------------------------------------
  - name: TradeIn
    parent: null
