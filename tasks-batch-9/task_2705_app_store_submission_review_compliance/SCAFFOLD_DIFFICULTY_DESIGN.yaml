          subscriber_retention_months == 12 qualifies for RETAINED_SUBSCRIBER_RATE and 11 does not, and
          the qualifying line lands on a half-cent: 6710 * 0.15 == 1006.5 must round_half_up to 1007
          (not truncate to 1006 and not banker's-round to 1006), while the non-qualifying line at
          6710 * 0.30 == 2013 is exact — so the two periods differ by both the rate boundary and the
          rounding direction, and each settlement reports line_count 1.
