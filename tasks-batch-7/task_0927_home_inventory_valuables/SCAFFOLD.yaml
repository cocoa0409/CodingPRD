    output: Item
    side_effects:
      - "Household.item_count and Room.item_count incremented"
      - "acv_value_cents computed at the current clock"

  - method: GET
    path: "/vault/items/{item_id}"
    description: "Reads one item with all derived valuation and coverage fields."
    roles: [Homeowner, HouseholdMember, EstateExecutor, InsuranceAgent, ClaimsAdjuster, Appraiser, PlatformAdmin]
    code: 200
    input: []
    output: Item
    side_effects: []

  - method: GET
    path: "/vault/items"
    description: "Lists items with filters. Reverse-reachability channel for all six Item foreign keys."
    roles: [Homeowner, HouseholdMember, EstateExecutor, InsuranceAgent, ClaimsAdjuster, Appraiser, PlatformAdmin]
    code: 200
    input: ["household_id?", "room_id?", "declared_by_member_id?", "scheduled_policy_id?", "replaces_item_id?", "frozen_by_claim_id?", "evidence_tier?", "lifecycle_state?", "valuation_state?", "limit?", "offset?"]
    output: Item[]
    side_effects: []

  - method: PATCH
    path: "/vault/items/{item_id}"
    description: "Edits mutable item fields. Blocked by the records freeze and by the global write gate."
    roles: [Homeowner, HouseholdMember]
    code: 200
    input: ["name?", "room_id?", "serial_number?", "purchase_price_cents?", "replacement_cost_cents?", "quantity?"]
    output: Item
    side_effects:
      - "recomputes item_evidence_tier when serial_number changes, then effective_value_resolution"
      - "increments Item.version by 1"

  - method: POST
    path: "/vault/items/{item_id}/declare-value"
    description: "Records the owner-declared value and stamps declared_by_member_id, which is the input to the segregation-of-duties bar on appraisals."
    roles: [Homeowner, HouseholdMember]
    code: 200
    input: [declared_value_cents]
    output: Item
    side_effects:
      - "declared_by_member_id := X-User-ID"
      - "runs effective_value_resolution; may set valuation_state to APPRAISAL_REQUIRED"
      - "may complete the DRAFT -> CATALOGED auto-transition"
      - "increments Item.version by 1"

  - method: POST
    path: "/vault/items/{item_id}/schedule"
    description: "Individually schedules the item on a policy, consuming scheduled allowance. OCC parent is the Policy."
    roles: [Homeowner]
    code: 200
    input: [policy_id, scheduled_value_cents, expected_policy_version]
    output: Item
    side_effects:
      - "coverage_mode := SCHEDULED; scheduled_policy_id and scheduled_value_cents written"
      - "Policy.scheduled_consumed_cents += scheduled_value_cents; scheduled_remaining_cents recomputed; coverage_gap_cents recomputed"
      - "increments Policy.version by 1 and Item.version by 1"

  - method: POST
    path: "/vault/items/{item_id}/unschedule"
    description: "Compensating action for schedule: releases the item's allowance back to the policy."
    roles: [Homeowner]
    code: 200
    input: []
    output: Item
    side_effects:
      - "Policy.scheduled_consumed_cents -= the exact amount this item consumed; scheduled_remaining_cents recomputed"
      - "coverage_mode := BLANKET; scheduled_policy_id := null; scheduled_value_cents := 0"
      - "increments Policy.version by 1 and Item.version by 1"

  - method: POST
    path: "/vault/items/{item_id}/replace"
    description: "Registers a re-photographed replacement item; the predecessor moves to REPLACED and the serial chain is evaluated."
    roles: [Homeowner]
    code: 201
    input: [name, acquired_at, "serial_number?", "purchase_price_cents?", "replacement_cost_cents?", "quantity?"]
    output: Item
    side_effects:
      - "creates a new DRAFT Item with replaces_item_id set, inheriting household_id, room_id and category"
      - "serial_chain_intact := (submitted serial_number equals the predecessor's serial_number)"
      - "predecessor transitions CATALOGED -> REPLACED and releases any scheduled allowance"
      - "increments Item.version by 1 on the predecessor and Policy.version by 1 when an allowance was released"

  - method: POST
    path: "/vault/items/{item_id}/assets"
    description: "Uploads one evidence blob and re-derives the item's evidence tier."
    roles: [Homeowner, HouseholdMember]
    code: 201
    input: [asset_kind, byte_size, checksum, captured_at]
    output: Asset
    side_effects:
      - "Household.asset_count and asset_bytes_used incremented"
      - "runs item_evidence_tier; may complete the DRAFT -> CATALOGED auto-transition"
      - "increments Item.version by 1"

  - method: GET
    path: "/vault/assets/{asset_id}"
    description: "Reads one evidence blob."
    roles: [Homeowner, HouseholdMember, Appraiser, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: Asset
    side_effects: []

  - method: GET
    path: "/vault/assets"
    description: "Lists evidence blobs. Reverse-reachability channel for Asset.item_id."
    roles: [Homeowner, HouseholdMember, Appraiser, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["item_id?", "status?", "asset_kind?", "limit?", "offset?"]
    output: Asset[]
    side_effects: []

  - method: DELETE
    path: "/vault/assets/{asset_id}"
    description: "Soft-deletes an evidence blob, which can downgrade the item's evidence tier and cascade into pending claim lines."
    roles: [Homeowner]
    code: 200
    input: []
    output: Asset
    side_effects:
      - "Asset.status := DELETED; Household.asset_count and asset_bytes_used decremented"
      - "runs the four-hop evidence-downgrade cascade documented on the Item.evidence_tier PHOTO_SERIAL -> PHOTO_ONLY transition"
      - "increments Item.version by 1"

  - method: POST
