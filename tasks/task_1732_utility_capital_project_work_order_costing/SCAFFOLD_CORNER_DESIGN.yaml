            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Prior period reversal", initial_estimated_cost_cents: 500000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { wo: $.data.id } }
            - { call: "POST /ucp/work-orders/${wo}/submit", payload: {}, as: ProjectEngineer, as_user_id: eng-1, captures: { wo_v2: $.data.version } }
            - { call: "GET /ucp/estimates", payload: { work_order_id: "${wo}" }, as: Auditor, captures: { est: "$.data[0].id" } }
            - { call: "POST /ucp/estimates/${est}/approve", payload: { expected_work_order_version: "${wo_v2}" }, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/authorize", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/work-orders/${wo}/start", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
            - { call: "POST /ucp/cost-charges", payload: { work_order_id: "${wo}", cost_type: MATERIAL, base_amount_cents: 30000, charge_date: "2026-08-10" }, as: FieldClerk, as_user_id: clerk-1, captures: { chg: $.data.id } }
            - { call: "POST /ucp/accounting-periods/${per1}/close", payload: {}, as: Controller, as_user_id: ctrl-1 }
          trigger:
            - { call: "POST /ucp/cost-charges/${chg}/reverse", payload: {}, as: FieldClerk, as_user_id: clerk-1, captures: { err: $.data.error_id } }
            - { call: "POST /ucp/accounting-periods", payload: { fiscal_year: 2026, period_no: 9, start_date: "2026-09-01", end_date: "2026-09-30" }, as: SystemAdmin, as_user_id: admin-1, captures: { per2: $.data.id } }
            - { call: "POST /ucp/cost-charges/${chg}/reverse", payload: {}, as: FieldClerk, as_user_id: clerk-1, captures: { rev_period: $.data.accounting_period_id, rev_total: $.data.total_cents } }
          assert:
            - "No open period: ${err} == ERR_PERIOD_NOT_FOUND"
            - "Reversal posts into the current period: accounting_period_id ${rev_period} == ${per2} (not ${per1}), total ${rev_total} == -30000"

      - name: list_filtering_by_status
        claim_type: standard_crud
        grounds: ["endpoints[GET /ucp/work-orders]"]
        distinguishing_aspect: "Filtered list returns only matching rows: with one DRAFT and one CANCELLED order, status=CANCELLED returns exactly the cancelled one."
        test_recipe:
          setup: ["Program with two work orders; the second cancelled from DRAFT"]
          setup_api_calls:
            - { call: "POST /ucp/capital-programs", payload: { code: "CAP-FILT", fiscal_year: 2026, authorized_amount_cents: 50000000, afudc_debt_rate_pct: 12.0, afudc_equity_rate_pct: 0.0, afudc_debt_weight_pct: 100, afudc_method: HALF_MONTH, ciac_method: NET_OF_CIAC }, as: SystemAdmin, as_user_id: admin-1, captures: { prog: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Keep", initial_estimated_cost_cents: 100000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { w1: $.data.id } }
            - { call: "POST /ucp/work-orders", payload: { program_id: "${prog}", order_type: CAPITAL, title: "Drop", initial_estimated_cost_cents: 100000 }, as: ProjectEngineer, as_user_id: eng-1, captures: { w2: $.data.id } }
            - { call: "POST /ucp/work-orders/${w2}/cancel", payload: {}, as: WorkOrderSupervisor, as_user_id: sup-1 }
          trigger:
            - { call: "GET /ucp/work-orders", payload: { program_id: "${prog}", status: "CANCELLED" }, as: Auditor, captures: { only: "$.data[0].id", total: "$.total_count" } }
          assert:
            - "Filter matches exactly the cancelled order: id ${only} == ${w2}, total_count ${total} == 1"

  # ===========================================================================
  - section: rbac
    instances:
      - name: rbac_exclusive_operation_denials
        claim_type: role_denied
        grounds: ["errors[ERR_FORBIDDEN]", "validations[priority=2]"]
        distinguishing_aspect: "Each role is refused another role's exclusive operation with 403 ERR_FORBIDDEN: FieldClerk cannot authorize, Auditor cannot post charges, ProjectEngineer cannot close a period, WorkOrderSupervisor cannot close out, RateAnalyst cannot create catalog rows."
        test_recipe:
          setup: ["Program, MATERIAL/CAPITAL 0% schedule, period 2026-08, and an authorized/started/completed work order with a TRANSFORMER catalog row (closeout attempt target)"]
          setup_api_calls:
