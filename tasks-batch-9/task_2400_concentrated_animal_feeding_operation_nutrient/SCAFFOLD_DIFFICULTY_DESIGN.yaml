  # =====================================================================
  # Rule 6 — boundary_precision_check
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: animal_units_exactly_one_thousand_is_large
        grounds:
          - calculations.operation_animal_units_and_class
          - entities.Operation.fields.size_class
          - entities.Operation.fields.animal_units
        distinguishing_aspect: |
          Inclusive numeric threshold on LARGE_AU_THRESHOLD: 1000 BEEF_FEEDER head yield animal_units
          exactly 1000.0 and size_class LARGE, while 999 head yield 999.0 and MEDIUM, so the boundary
          value itself belongs to the upper class.
        test_recipe:
          setup:
            - "Two operations differing only in head_count: 1000 and 999 BEEF_FEEDER animals, DRY handling, no open lot, STORMWATER_ONLY discharge potential"
            - "Logical clock at its default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Boundary Feeders A", county: "Story", animal_type: "BEEF_FEEDER", head_count: 1000, manure_handling: "DRY", open_lot_area_sqft: 0, discharge_potential: "STORMWATER_ONLY", has_conservation_plan: false }
              as: ComplianceAdmin
              as_user_id: "admin-1"
