  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: listing_windows_half_open_adjacency_permitted
        grounds:
          - validations[priority=11]
          - errors[ERR_LISTING_AUCTION_OVERLAP]
        distinguishing_aspect: |
          Resource = Listing, semantics = half-open [start, end) with adjacency PERMITTED: an
          auction starting exactly at another's end (12:00 == 12:00) is accepted, while a window
          overlapping by one hour is rejected ERR_LISTING_AUCTION_OVERLAP. The other Rule-8
          instance uses buffer semantics on a different resource (BrokerAgent).
        test_recipe:
          setup:
            - "MARKETED WHOLE listing L4 (80ac, T4 min 200000, reserve 430000; floor 0.85 x 500000 = 425000 passes)"
          setup_api_calls:
            - { call: "POST /api/sellers", payload: { full_name: "Seller One", email: "s1@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /api/agents", payload: { full_name: "Agent One", license_number: "LIC-001" }, as: PlatformAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2026-01-15T00:00:00Z", sale_price_total: 900000, gross_acres: 100, tillable_acres: 95, soil_productivity_index: 80 }, as: PlatformAdmin }
            - { call: "POST /api/listings", payload: { seller_id: "${s_id}", title: "L4", county: "Dallas", state_code: "IA", total_gross_acres: 80, packaging_strategy: "WHOLE", reserve_price_total: 430000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /api/tracts", payload: { listing_id: "${l_id}", tract_number: 1, gross_acres: 80, tillable_acres: 40, soil_productivity_index: 60, min_price: 200000, expected_listing_version: "${l_v}" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { t4_id: $.data.id } }
            - { call: "POST /api/rights", payload: { tract_id: "${t4_id}", mineral_rights: "CONVEYED", wind_rights: "CONVEYED" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/package", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l_id}/market", as: BrokerAgent, as_user_id: "${g_id}" }
          trigger:
            - { call: "POST /api/auctions", payload: { listing_id: "${l_id}", method: "LIVE", scheduled_start: "2026-08-12T10:00:00Z", scheduled_end: "2026-08-12T12:00:00Z" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { a1_id: $.data.id, a1_st: $.data.status } }
            - { call: "POST /api/auctions", payload: { listing_id: "${l_id}", method: "LIVE", scheduled_start: "2026-08-12T12:00:00Z", scheduled_end: "2026-08-12T14:00:00Z" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { a2_id: $.data.id, a2_st: $.data.status } }
            - { call: "POST /api/auctions", payload: { listing_id: "${l_id}", method: "LIVE", scheduled_start: "2026-08-12T11:00:00Z", scheduled_end: "2026-08-12T13:00:00Z" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { err: $.data.error_id } }
          assert:
            - "a1_st == SCHEDULED and a2_st == SCHEDULED (adjacent half-open windows [10:00,12:00) and [12:00,14:00) do not overlap)"
            - "err == ERR_LISTING_AUCTION_OVERLAP for [11:00,13:00)"

      - name: auctioneer_two_hour_buffer_across_listings
        grounds:
          - validations[priority=12]
          - errors[ERR_AUCTIONEER_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Resource = BrokerAgent, semantics = mandatory 2h BUFFER between auctions of different
          listings (adjacency forbidden): a window starting 1.5h after the other's end is rejected
          ERR_AUCTIONEER_SCHEDULE_CONFLICT, while a gap of exactly 2h is accepted — a different
          interval geometry than the half-open adjacency rule on Listing.
        test_recipe:
          setup:
            - "Two MARKETED listings L4 (80ac, reserve 430000) and L5 (40ac, reserve 310000; floor 0.85 x 360000 = 306000 passes) under the SAME agent G1"
          setup_api_calls:
            - { call: "POST /api/sellers", payload: { full_name: "Seller One", email: "s1@x.com" }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /api/agents", payload: { full_name: "Agent One", license_number: "LIC-001" }, as: PlatformAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/comparables", payload: { county: "Dallas", state_code: "IA", sale_date: "2026-01-15T00:00:00Z", sale_price_total: 900000, gross_acres: 100, tillable_acres: 95, soil_productivity_index: 80 }, as: PlatformAdmin }
            - { call: "POST /api/listings", payload: { seller_id: "${s_id}", title: "L4", county: "Dallas", state_code: "IA", total_gross_acres: 80, packaging_strategy: "WHOLE", reserve_price_total: 430000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { l4_id: $.data.id, l4_v: $.data.version } }
            - { call: "POST /api/tracts", payload: { listing_id: "${l4_id}", tract_number: 1, gross_acres: 80, tillable_acres: 40, soil_productivity_index: 60, min_price: 200000, expected_listing_version: "${l4_v}" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { t4_id: $.data.id } }
            - { call: "POST /api/rights", payload: { tract_id: "${t4_id}", mineral_rights: "CONVEYED", wind_rights: "CONVEYED" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l4_id}/package", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l4_id}/market", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings", payload: { seller_id: "${s_id}", title: "L5", county: "Dallas", state_code: "IA", total_gross_acres: 40, packaging_strategy: "WHOLE", reserve_price_total: 310000 }, as: BrokerAgent, as_user_id: "${g_id}", captures: { l5_id: $.data.id, l5_v: $.data.version } }
            - { call: "POST /api/tracts", payload: { listing_id: "${l5_id}", tract_number: 1, gross_acres: 40, tillable_acres: 40, soil_productivity_index: 80, min_price: 100000, expected_listing_version: "${l5_v}" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { t5_id: $.data.id } }
            - { call: "POST /api/rights", payload: { tract_id: "${t5_id}", mineral_rights: "CONVEYED", wind_rights: "CONVEYED" }, as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l5_id}/package", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/listings/${l5_id}/market", as: BrokerAgent, as_user_id: "${g_id}" }
            - { call: "POST /api/auctions", payload: { listing_id: "${l4_id}", method: "LIVE", scheduled_start: "2026-08-12T10:00:00Z", scheduled_end: "2026-08-12T12:00:00Z" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { a4_id: $.data.id } }
          trigger:
            - { call: "POST /api/auctions", payload: { listing_id: "${l5_id}", method: "LIVE", scheduled_start: "2026-08-12T13:30:00Z", scheduled_end: "2026-08-12T15:00:00Z" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { err: $.data.error_id } }
            - { call: "POST /api/auctions", payload: { listing_id: "${l5_id}", method: "LIVE", scheduled_start: "2026-08-12T14:00:00Z", scheduled_end: "2026-08-12T16:00:00Z" }, as: BrokerAgent, as_user_id: "${g_id}", captures: { a5_id: $.data.id, a5_st: $.data.status } }
          assert:
            - "err == ERR_AUCTIONEER_SCHEDULE_CONFLICT (13:30 < 12:00 + 2h)"
            - "a5_st == SCHEDULED — exactly 2h gap (14:00 == 12:00 + 2h) passes the buffer"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: acreage_conserved_across_award_and_forfeit
        grounds:
          - state_machines.Tract.OFFERED_to_SOLD
          - state_machines.Tract.SOLD_to_OFFERED
          - validations[priority=14]
        distinguishing_aspect: |
          Conserved quantity = ACREAGE: sum of tracts' gross_acres == listing.total_gross_acres
          (160) holds after packaging, after the award flips both tracts OFFERED -> SOLD (forward
          action), and after the forfeiture cascade flips them SOLD -> OFFERED (compensating
          action) — status mutations never create or destroy acres.
