  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_fiscal_on_confirm_after_event_start
        grounds:
          - validations[priority=10]
          - validations[priority=30]
          - errors[ERR_EVENT_NOT_ACCEPTING_REGISTRATIONS]
          - errors[ERR_EVENT_SLOT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          The error-category pair here is `state` (priority 10) versus `business_fiscal` (priority 30):
          one CONFIRM request violates BOTH — the event has already left OPEN_FOR_REGISTRATION and
          reserved_slot_count 1 + 1 exceeds slot_capacity 1 — and the response must be
          ERR_EVENT_NOT_ACCEPTING_REGISTRATIONS (409), never ERR_EVENT_SLOT_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Program (ceiling 500000), APPROVED site, event 2026-09-12T08:00Z..20:00Z"
            - "A single 15-minute lane assignment (0.25 h) makes staffing_capacity 1, so slot_capacity == 1"
            - "Resident Ana holds a CONFIRMED appointment (reserved_slot_count == 1); Resident Ben holds a REQUESTED appointment"
            - "The logical clock is moved to 2026-09-12T09:00Z and the event is STARTed, so lifecycle_status == IN_PROGRESS"
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN", "CO-ARV"] }
