            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:20:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 1, sampled_at: "2026-08-10T14:15:00Z", measured_mw: 20.0, measured_mvar: 0.0, soc_mwh_reading: 75.0, max_cell_temp_c: 80.0 }
              as: SiteController
