              as: Scheduler
              captures: { ap4: $.data.id, ap4_chair: $.data.chair_id, ap4_nurse: $.data.nurse_id, ap4_start: $.data.start_minute }
          assert:
            - "${ap1_start} == 540, ${ap2_start} == 540, ${ap3_start} == 540 and ${ap4_start} == 900 — no candidate push was needed, so only the ranking keys are under test"
            - "${ap1_chair} == ${ch1} — all three chairs tie at committed_minutes 0, so label ASC picks A1 and NOT the first-created A3"
            - "${ap1_nurse} == ${nr1} — both nurses tie at 0 assigned points, so created_at ASC picks N1"
            - "${ap2_chair} == ${ch2} — A1 is buffer-blocked at 540, and A2 beats A3 on label with both still at committed_minutes 0"
            - "${ap2_nurse} == ${nr2} — N1 now carries 3 points, so assigned_acuity_points ASC picks N2 before created_at is consulted"
            - "${ap3_chair} == ${ch3} — A3 is the only chair left at 540"
            - "${ap3_nurse} == ${nr1} — both nurses now carry 3 points, so the created_at tie-break returns to N1"
            - "${ap4_chair} == ${ch1} — at 900 every chair is free again and all three tie at committed_minutes 240, so label ASC picks A1 a second time"
            - "${ap4_nurse} == ${nr2} — N1 carries 6 points against N2's 3, so the load key decides even though the 900 band is empty for both"
            - "Chair.${ch1}.committed_minutes == 480, Chair.${ch2}.committed_minutes == 240 and Chair.${ch3}.committed_minutes == 240"
            - "Nurse.${nr1}.assigned_acuity_points == 6 and Nurse.${nr2}.assigned_acuity_points == 6"
            - "All four calls return HTTP 201 — three chairs and two nurses are enough for four first-dose visits in two time bands"

      - name: the_daily_sweep_is_a_per_run_checkpoint_with_an_inclusive_no_show_edge
        claim_type: ops_run_checkpoint
        grounds:
          - complexity_profile.complexity_layers[ops_run_checkpoint]
          - calculations[daily_sweep_run]
          - endpoints[POST /infusion-centers/{id}/daily-sweep]
          - entities.Patient.fields.no_show_strikes
        distinguishing_aspect: |
          A checkpoint run must report what THIS run changed, not the standing backlog, and its
          no-show edge is inclusive at start_minute + 30. Sweeping one minute early therefore
          reports zero no-shows while still expiring the lot, sweeping at the exact grace
          instant reports the no-show but zero lots (the lot is already EXPIRED), and sweeping
          again at the same clock reports zeroes across the board. A later run then catches the
          afternoon visit only. Four runs pin all three properties — inclusivity, per-run
          counters and same-clock idempotence — that a naive implementation returning standing
          totals would fail.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. One center (open 480, close 1140, buffer 15), one AVAILABLE chair, one nurse with capacity 12, one drug, one MID template."
            - "One lot LOT-AUG with 10 units expiring 2026-08-10T00:00:00Z and no preparation against it."
            - "Two 70 kg patients, each on an ACTIVE 6-cycle plan, with TENTATIVE visits on 2026-08-10: patient one at 540 (window [540, 780)) and patient two at 900 (window [900, 1140))."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 12, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /drug-lots"
              payload: { drug_id: "${dr1}", lot_number: "LOT-AUG", units_received: 10, expires_on: "2026-08-10T00:00:00Z" }
              as: Pharmacist
              captures: { lot1: $.data.id, lot1_status0: $.data.status }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0002", full_name: "Pat Two", weight_kg: 70 }
              as: Scheduler
              captures: { pt2: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: MedicalDirector
              captures: { pl1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt2}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: MedicalDirector
              captures: { pl2: $.data.id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap1: $.data.id, ap1_start: $.data.start_minute }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt2}", treatment_plan_id: "${pl2}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 900, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap2: $.data.id, ap2_start: $.data.start_minute }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:29:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers/${ctr}/daily-sweep"
              payload: { service_date: "2026-08-10" }
              as: Scheduler
              captures: { r1_lots: $.data.expired_lot_count, r1_auths: $.data.expired_authorization_count, r1_preps: $.data.wasted_preparation_count, r1_no_shows: $.data.no_show_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:30:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers/${ctr}/daily-sweep"
              payload: { service_date: "2026-08-10" }
              as: Scheduler
              captures: { r2_lots: $.data.expired_lot_count, r2_no_shows: $.data.no_show_count }
            - call: "POST /infusion-centers/${ctr}/daily-sweep"
              payload: { service_date: "2026-08-10" }
              as: Scheduler
              captures: { r3_lots: $.data.expired_lot_count, r3_auths: $.data.expired_authorization_count, r3_preps: $.data.wasted_preparation_count, r3_no_shows: $.data.no_show_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T15:30:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers/${ctr}/daily-sweep"
              payload: { service_date: "2026-08-10" }
              as: Scheduler
              captures: { r4_lots: $.data.expired_lot_count, r4_no_shows: $.data.no_show_count }
          assert:
            - "${lot1_status0} == 'AVAILABLE' and ${ap1_start} == 540 and ${ap2_start} == 900"
            - "Run 1 at 09:29: ${r1_lots} == 1, ${r1_auths} == 0, ${r1_preps} == 0 and ${r1_no_shows} == 0 — minute 569 is one short of 540 + 30, so the grace has not elapsed"
            - "Run 2 at 09:30: ${r2_no_shows} == 1 and ${r2_lots} == 0 — the edge is inclusive, and the lot is not re-counted because it left AVAILABLE in run 1"
            - "Run 3 at the same clock: ${r3_lots} == 0, ${r3_auths} == 0, ${r3_preps} == 0 and ${r3_no_shows} == 0 — a repeat run at one clock is a pure no-op"
            - "Run 4 at 15:30: ${r4_no_shows} == 1 and ${r4_lots} == 0 — minute 930 is exactly 900 + 30 for the afternoon visit"
            - "DrugLot.${lot1}.status == 'EXPIRED' with units_received 10 and units_available 10 — expiry changes the status only"
            - "Appointment.${ap1}.schedule_status == 'NO_SHOW' and Appointment.${ap2}.schedule_status == 'NO_SHOW'"
            - "Patient.${pt1}.no_show_strikes == 1 and Patient.${pt2}.no_show_strikes == 1, both with steering_status 'SUITE' — one strike is below the 3-strike flip"
            - "Chair.${ch1}.committed_minutes == 0 and Nurse.${nr1}.assigned_acuity_points == 0 — NO_SHOW rows free their slot"
            - "Appointment.${ap1}.version is unchanged between run 2 and run 3 — the idempotent run writes nothing"

  - section: consistency_model
    instances:
      - name: every_write_response_already_carries_its_derived_fields_and_cascades
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.Appointment.fields.chair_minutes
          - entities.Chair.fields.committed_minutes
          - entities.DrugLot.fields.units_available
          - calculations[chair_utilization_pct]
        distinguishing_aspect: |
          Under an immediate consistency model there is no window in which a derived field is
          allowed to be stale: the booking response itself must already contain the whole window
          build and the selector's choices, the very next read of the chair and the nurse must
          already show the committed minutes and the acuity load, and an analytics read taken in
          the same breath must already include the new visit. The reverse holds for the release
          path — the cancel response carries the charge, and the chair is free on the following
          read with no settling step. The lot adjustment is included because it is the one write
          whose response has to show a field it did not receive: units_available is re-derived
          from the new units_received inside the same call.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. One center (open 480, close 1140, buffer 15, grid 15), one AVAILABLE chair, one nurse with capacity 12, one drug, one 10-unit lot, one MID template."
            - "One 70 kg patient on an ACTIVE 6-cycle plan, nothing booked yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id, ch1_committed0: $.data.committed_minutes }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 12, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id, nr1_load0: $.data.assigned_acuity_points }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /drug-lots"
              payload: { drug_id: "${dr1}", lot_number: "LOT-DEC", units_received: 10, expires_on: "2026-12-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot1: $.data.id, lot1_v1: $.data.version }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id, tp1_v1: $.data.version }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: MedicalDirector
              captures: { pl1: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap1: $.data.id, ap1_chair: $.data.chair_id, ap1_nurse: $.data.nurse_id, ap1_start: $.data.start_minute, ap1_end: $.data.end_minute, ap1_chair_min: $.data.chair_minutes, ap1_acuity: $.data.acuity_points, ap1_pin: $.data.template_version_pinned, ap1_ready: $.data.readiness_status }
            - call: "GET /chairs/${ch1}"
              payload: {}
              as: Scheduler
              captures: { ch1_committed1: $.data.committed_minutes }
            - call: "GET /nurses/${nr1}"
              payload: {}
              as: Scheduler
              captures: { nr1_load1: $.data.assigned_acuity_points }
            - call: "GET /infusion-centers/${ctr}/utilization"
              payload: { service_date: "2026-08-10", variant: "SCHEDULED" }
              as: Scheduler
              captures: { util1: $.data.utilization_pct, util1_count: $.data.appointment_count }
            - call: "POST /drug-lots/${lot1}/adjustments"
              payload: { units_delta: 5, reason: "Second carton received", expected_drug_lot_version: "${lot1_v1}" }
              as: Pharmacist
              captures: { adj_recv: $.data.units_received, adj_avail: $.data.units_available, adj_status: $.data.status }
            - call: "POST /appointments/${ap1}/cancel"
              payload: { reason: "Patient travelling" }
              as: Scheduler
              captures: { ap1_cancel_status: $.data.schedule_status, ap1_cancel_charge: $.data.cancellation_charge_cents, ap1_cancel_chair: $.data.chair_id }
            - call: "GET /chairs/${ch1}"
              payload: {}
              as: Scheduler
              captures: { ch1_committed2: $.data.committed_minutes }
            - call: "GET /infusion-centers/${ctr}/utilization"
              payload: { service_date: "2026-08-10", variant: "SCHEDULED" }
              as: Scheduler
              captures: { util2: $.data.utilization_pct, util2_count: $.data.appointment_count }
          assert:
            - "${ch1_committed0} == 0 and ${nr1_load0} == 0 — the creation responses already carry their zeroed derived counters"
            - "The booking response already contains the full window build: ${ap1_start} == 540, ${ap1_end} == 780, ${ap1_chair_min} == 240, ${ap1_acuity} == 3, ${ap1_pin} == ${tp1_v1} and ${ap1_ready} == 'PENDING'"
            - "The booking response already names the selector's picks: ${ap1_chair} == ${ch1} and ${ap1_nurse} == ${nr1}"
            - "${ch1_committed1} == 240 and ${nr1_load1} == 3 on the immediately following reads — no settling step is permitted"
            - "${util1} == 36.36 and ${util1_count} == 1 — an analytics read taken straight after the write already includes the visit"
            - "${adj_recv} == 15 and ${adj_avail} == 15 with ${adj_status} == 'AVAILABLE' — units_available is re-derived inside the same response that received only units_delta"
            - "${ap1_cancel_status} == 'CANCELLED' with ${ap1_cancel_charge} == 0 in the cancel response itself, and ${ap1_cancel_chair} is null"
            - "${ch1_committed2} == 0, ${util2} == 0.00 and ${util2_count} == 0 — the release is visible on the next read with no lag"
            - "Nurse.${nr1}.assigned_acuity_points == 0 after the cancel"
