          assert:
            - "response error_id == ERR_ASSET_FROZEN"
            - "response error_id != ERR_ASSET_MISMATCH"
            - "RouteStop.${c5b_st}.status == ARRIVED (no SAMPLED transition fired)"
            - "SystemAsset.${c5b_asset}.consecutive_out_of_range_count == 0"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary precision on DIFFERENT metrics via DISTINCT endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: lsi_classification_at_exactly_2_5
        grounds:
          - calculations.lsi_saturation_index
          - entities.WaterTestResult.fields.classification
        distinguishing_aspect: |
          Numeric threshold boundary: stored LSI exactly 2.50 (ph input 8.6211
          in the pinned fixture) classifies SCALE_FORMING because the band is
          >= 2.5, while ph 8.6111 stores 2.49 and classifies BALANCED —
          exercised via POST /wt/route-stops/{stopId}/water-test-results.
        test_recipe:
          setup:
            - "Commissioned asset with ACCEPTED design (ph 7.0-10.0, cond max 20000 so results stay IN_RANGE), ONLINE station; two published stops on 2026-08-02 windows; clock 2026-08-02T01:00:00Z and 2026-08-02T07:00:00Z"
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
              payload: { account_name: "Boundary Co" }
