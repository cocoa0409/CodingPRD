# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2872 — Independent Sales Organization Residual Accounting
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only. Every numeric literal
# in an `assert:` was computed by executing the §1.3 formula in code (integer
# cents, round_half_up) against the literals pinned in `setup_api_calls`.
# The logical clock's startup default is 2026-08-01T00:00:00Z; instances that
# depend on another instant set it explicitly.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: normalize_variant_divergence_net_vs_gross
        grounds:
          - calculations.normalize_residual_line
          - entities.ProcessorProgram.fields.normalization_mode
          - entities.ResidualLine.fields.normalized_net_revenue_cents
          - entities.ResidualLine.fields.normalization_mode_applied
          - state_machines.ResidualBatch.RECEIVED_to_NORMALIZED
        distinguishing_aspect: |
          Byte-identical processor file data (volume 4812355, 1240 authorizations,
          interchange 92140, assessments 6255, gross income 168430) normalized under
          NET_REVENUE_SPLIT yields 40939 while GROSS_SPLIT yields 70035; the gap is
          exactly the line's processor_cost_cents (29096), which the GROSS variant
          still computes and stores but does not deduct.
        test_recipe:
          setup:
            - "Two ProcessorPrograms with identical rates (buy_rate_bps 45, buy_rate_per_item_cents 6, assessment_bps 13) differing only in normalization_mode."
            - "One ACTIVE agent owning one merchant on each program."
            - "One RECEIVED batch per program for 2026-07, each holding one line with identical file numbers."
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "FirstAtlantic Net", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT" }
              as: IsoAdmin
              captures: { p_net: $.data.id }
            - call: "POST /processor-programs"
              payload: { name: "FirstAtlantic Gross", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "GROSS_SPLIT" }
              as: IsoAdmin
              captures: { p_gross: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Principal", split_pct: 0.45, override_pct: 0.45, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p_net}", mid: "MID-1001", monthly_minimum_cents: 2500, per_transaction_fee_cents: 15, equipment_lease_monthly_cents: 3900, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m_net: $.data.id }
            - call: "POST /merchants/${m_net}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p_gross}", mid: "MID-1002", monthly_minimum_cents: 2500, per_transaction_fee_cents: 15, equipment_lease_monthly_cents: 3900, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m_gross: $.data.id }
            - call: "POST /merchants/${m_gross}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p_net}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:net-0001" }
              as: ResidualAnalyst
              captures: { b_net: $.data.id }
            - call: "POST /residual-batches/${b_net}/lines"
              payload: { merchant_id: "${m_net}", transaction_count: 1240, sales_volume_cents: 4812355, interchange_cents: 92140, assessments_cents: 6255, gross_income_cents: 168430 }
              as: ResidualAnalyst
              captures: { l_net: $.data.id }
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p_gross}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:gross-0001" }
              as: ResidualAnalyst
              captures: { b_gross: $.data.id }
            - call: "POST /residual-batches/${b_gross}/lines"
              payload: { merchant_id: "${m_gross}", transaction_count: 1240, sales_volume_cents: 4812355, interchange_cents: 92140, assessments_cents: 6255, gross_income_cents: 168430 }
              as: ResidualAnalyst
              captures: { l_gross: $.data.id }
          trigger:
            - call: "POST /residual-batches/${b_net}/normalize"
              payload: {}
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b_gross}/normalize"
              payload: {}
              as: ResidualAnalyst
          assert:
            - "ResidualLine.${l_net}.processor_cost_cents == 29096"
            - "ResidualLine.${l_net}.normalized_net_revenue_cents == 40939"
            - "ResidualLine.${l_net}.normalization_mode_applied == NET_REVENUE_SPLIT"
            - "ResidualLine.${l_gross}.processor_cost_cents == 29096"
            - "ResidualLine.${l_gross}.normalized_net_revenue_cents == 70035"
            - "ResidualLine.${l_gross}.normalization_mode_applied == GROSS_SPLIT"
            - "ResidualLine.${l_gross}.normalized_net_revenue_cents - ResidualLine.${l_net}.normalized_net_revenue_cents == 29096"
            - "ResidualBatch.${b_net}.total_normalized_net_revenue_cents == 40939 and ResidualBatch.${b_gross}.total_normalized_net_revenue_cents == 70035"

      - name: advance_recoupment_variant_divergence_percent_vs_straight_line
        grounds:
          - calculations.advance_recoupment_schedule
          - calculations.statement_net_payable
          - entities.AgentAdvance.fields.recoupment_mode
          - entities.AgentStatement.fields.advance_recoupment_cents
          - concurrency_rules[advance-create-stale-agent]
          - state_machines.AgentStatement.lifecycle_DRAFT_to_ISSUED
        distinguishing_aspect: |
          Two agents holding identical statements (gross_after_trueup_cents 14643) and
          identical principal 50000 recoup different amounts at issue: PERCENT_OF_RESIDUAL
          takes 3661 (its requested 0.40 is truncated to the 0.25 tier cap because
          14643 < 50000), STRAIGHT_LINE_AMORTIZATION takes the fixed 5000 instalment —
          a 1339-cent divergence driven only by recoupment_mode.
        test_recipe:
          setup:
            - "Program P1 (NET_REVENUE_SPLIT, buy_rate_bps 45, per-item 6)."
            - "Two top-level agents AX and AY, each split_pct 0.45, each owning one merchant with identical file data and identical chargebacks."
            - "One POSTED batch for 2026-07 carrying both merchants' lines, so each agent has a DRAFT statement worth 14643."
            - "AX holds a PERCENT_OF_RESIDUAL advance (principal 50000, recoupment_pct 0.40); AY holds a STRAIGHT_LINE_AMORTIZATION advance (principal 50000, amortization_months 10, window 2026-07..2027-04)."
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "FirstAtlantic Core", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "AX Percent", split_pct: 0.45, override_pct: 0.45, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { ax: $.data.id }
            - call: "POST /agents"
              payload: { name: "AY Straight", split_pct: 0.45, override_pct: 0.45, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { ay: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${ax}", processor_program_id: "${p1}", mid: "MID-2001", monthly_minimum_cents: 2500, per_transaction_fee_cents: 15, equipment_lease_monthly_cents: 3900, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { mx: $.data.id }
            - call: "POST /merchants/${mx}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants"
              payload: { owning_agent_id: "${ay}", processor_program_id: "${p1}", mid: "MID-2002", monthly_minimum_cents: 2500, per_transaction_fee_cents: 15, equipment_lease_monthly_cents: 3900, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { my: $.data.id }
            - call: "POST /merchants/${my}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants/${mx}/chargebacks"
              payload: { amount_cents: 4500, occurred_on: "2026-07-12", period_month: "2026-07", liability: "AGENT_CHARGED" }
              as: ResidualAnalyst
            - call: "POST /merchants/${mx}/chargebacks"
              payload: { amount_cents: 12000, occurred_on: "2026-07-20", period_month: "2026-07", liability: "ISO_ABSORBED" }
              as: ResidualAnalyst
            - call: "POST /merchants/${my}/chargebacks"
              payload: { amount_cents: 4500, occurred_on: "2026-07-12", period_month: "2026-07", liability: "AGENT_CHARGED" }
              as: ResidualAnalyst
            - call: "POST /merchants/${my}/chargebacks"
              payload: { amount_cents: 12000, occurred_on: "2026-07-20", period_month: "2026-07", liability: "ISO_ABSORBED" }
              as: ResidualAnalyst
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:aaa1" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${mx}", transaction_count: 1240, sales_volume_cents: 4812355, interchange_cents: 92140, assessments_cents: 6255, gross_income_cents: 168430 }
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${my}", transaction_count: 1240, sales_volume_cents: 4812355, interchange_cents: 92140, assessments_cents: 6255, gross_income_cents: 168430 }
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/post"
              payload: {}
              as: ResidualController
            - call: "GET /agents/${ax}"
              payload: {}
              as: IsoAdmin
              captures: { ax_v: $.data.version }
            - call: "POST /agents/${ax}/advances"
              payload: { advance_type: "CASH_ADVANCE", recoupment_mode: "PERCENT_OF_RESIDUAL", principal_cents: 50000, recoupment_pct: 0.40, first_recoupment_month: "2026-07", last_recoupment_month: "2027-04", funded_on: "2026-07-05", expected_agent_version: "${ax_v}" }
              as: IsoAdmin
              captures: { adv_x: $.data.id }
            - call: "GET /agents/${ay}"
              payload: {}
              as: IsoAdmin
              captures: { ay_v: $.data.version }
            - call: "POST /agents/${ay}/advances"
              payload: { advance_type: "CASH_ADVANCE", recoupment_mode: "STRAIGHT_LINE_AMORTIZATION", principal_cents: 50000, amortization_months: 10, first_recoupment_month: "2026-07", last_recoupment_month: "2027-04", funded_on: "2026-07-05", expected_agent_version: "${ay_v}" }
              as: IsoAdmin
              captures: { adv_y: $.data.id }
            - call: "GET /agent-statements"
              payload: { agent_id: "${ax}", period_month: "2026-07" }
              as: ResidualController
              captures: { st_x: "$.data[0].id" }
            - call: "GET /agent-statements"
              payload: { agent_id: "${ay}", period_month: "2026-07" }
              as: ResidualController
              captures: { st_y: "$.data[0].id" }
          trigger:
            - call: "POST /agent-statements/${st_x}/issue"
              payload: {}
              as: ResidualController
            - call: "POST /agent-statements/${st_y}/issue"
              payload: {}
              as: ResidualController
          assert:
            - "AgentStatement.${st_x}.gross_after_trueup_cents == 14643 and AgentStatement.${st_y}.gross_after_trueup_cents == 14643"
            - "AgentStatement.${st_x}.advance_recoupment_cents == 3661"
            - "AgentStatement.${st_x}.net_payable_cents == 10982"
            - "AgentStatement.${st_y}.advance_recoupment_cents == 5000"
            - "AgentStatement.${st_y}.net_payable_cents == 9643"
            - "AgentAdvance.${adv_x}.outstanding_cents == 46339 and AgentAdvance.${adv_x}.months_recouped == 1"
            - "AgentAdvance.${adv_y}.outstanding_cents == 45000 and AgentAdvance.${adv_y}.months_recouped == 1"
            - "AgentStatement.${st_y}.advance_recoupment_cents - AgentStatement.${st_x}.advance_recoupment_cents == 1339"

  - rule_id: combinatorial_formula
    instances:

      - name: normalization_rounding_order_per_line_then_sum
        grounds:
          - calculations.normalize_residual_line
          - calculations.batch_totals
          - entities.ResidualBatch.fields.total_normalized_net_revenue_cents
          - entities.ResidualBatch.fields.gross_volume_cents
        distinguishing_aspect: |
          Mode (b) — same inputs, different evaluation ORDER. Three lines of 101000
          cents volume each make the buy-rate product 454.5 cents per line. Rounding
          per line before summation (the pinned order) gives processor_cost 1955 and
          net 2845 per line, total 8535. Summing volume to 303000 first and rounding
          the single product 1363.5 once gives cost 5864 and total 8536 — a one-cent
          fingerprint of the wrong order that no other assertion in the suite exposes.
        test_recipe:
          setup:
            - "Program P1 (NET_REVENUE_SPLIT, buy_rate_bps 45, buy_rate_per_item_cents 6)."
            - "One agent owning three ACTIVE merchants on P1."
            - "One RECEIVED batch for 2026-07 with one line per merchant, all three lines carrying identical half-cent-producing volume 101000."
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "FirstAtlantic Core", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Principal", split_pct: 0.45, override_pct: 0.45, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-3001", monthly_minimum_cents: 0, per_transaction_fee_cents: 15, equipment_lease_monthly_cents: 0, boarded_on: "2026-01-05" }
              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants/${m1}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-3002", monthly_minimum_cents: 0, per_transaction_fee_cents: 15, equipment_lease_monthly_cents: 0, boarded_on: "2026-01-05" }
              as: IsoAdmin
              captures: { m2: $.data.id }
            - call: "POST /merchants/${m2}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-3003", monthly_minimum_cents: 0, per_transaction_fee_cents: 15, equipment_lease_monthly_cents: 0, boarded_on: "2026-01-05" }
              as: IsoAdmin
              captures: { m3: $.data.id }
            - call: "POST /merchants/${m3}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:round-0001" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m1}", transaction_count: 250, sales_volume_cents: 101000, interchange_cents: 3000, assessments_cents: 200, gross_income_cents: 8000 }
              as: ResidualAnalyst
              captures: { l1: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m2}", transaction_count: 250, sales_volume_cents: 101000, interchange_cents: 3000, assessments_cents: 200, gross_income_cents: 8000 }
              as: ResidualAnalyst
              captures: { l2: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m3}", transaction_count: 250, sales_volume_cents: 101000, interchange_cents: 3000, assessments_cents: 200, gross_income_cents: 8000 }
              as: ResidualAnalyst
              captures: { l3: $.data.id }
          trigger:
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
          assert:
            - "ResidualLine.${l1}.processor_cost_cents == 1955 and ResidualLine.${l2}.processor_cost_cents == 1955 and ResidualLine.${l3}.processor_cost_cents == 1955"
            - "ResidualLine.${l1}.normalized_net_revenue_cents == 2845 and ResidualLine.${l2}.normalized_net_revenue_cents == 2845 and ResidualLine.${l3}.normalized_net_revenue_cents == 2845"
            - "ResidualBatch.${b1}.line_count == 3"
            - "ResidualBatch.${b1}.gross_volume_cents == 303000"
            - "ResidualBatch.${b1}.total_normalized_net_revenue_cents == 8535"
            - "ResidualBatch.${b1}.total_normalized_net_revenue_cents != 8536   # the sum-then-round result is explicitly excluded"
            - "ResidualBatch.${b1}.state == NORMALIZED"

      - name: statement_issue_order_trueup_feeds_recoupment_tier
        grounds:
          - calculations.statement_net_payable
          - calculations.minimum_fee_reconciliation
          - calculations.advance_recoupment_schedule
          - state_machines.AgentStatement.lifecycle_DRAFT_to_ISSUED
        distinguishing_aspect: |
          Mode (c) — the pinned step order of statement_net_payable. The 5-cent minimum
          true-up computed in step 3 raises G from 14677 to 14682 in step 4, and step 5
          takes 25% of THAT G: round_half_up(14682 * 0.25) = 3671, not the 3669 that a
          recoupment computed before the true-up would produce. Net payable 11011 is
          reachable by exactly one ordering of the six steps.
        test_recipe:
          setup:
            - "Program P1 (NET_REVENUE_SPLIT, 45 bps / 6 cents, SHORTFALL_BILLED)."
            - "One agent A1 (split_pct 0.45) owning M1 (rich merchant, per-transaction fee 15, minimum 2500) and M2 (thin merchant, per-transaction fee 20, minimum 2500, no equipment)."
            - "M1 carries a 4500 AGENT_CHARGED and a 12000 ISO_ABSORBED chargeback for 2026-07."
            - "A POSTED 2026-07 batch holding both lines; M2's 124 authorizations leave its billable fee 20 cents short of the minimum."
            - "A PERCENT_OF_RESIDUAL advance with recoupment_pct 0.40 and principal 60000, whose window contains 2026-07."
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "FirstAtlantic Core", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "SHORTFALL_BILLED" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Principal", split_pct: 0.45, override_pct: 0.45, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-4001", monthly_minimum_cents: 2500, per_transaction_fee_cents: 15, equipment_lease_monthly_cents: 3900, upfront_bonus_cents: 25000, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants/${m1}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-4002", monthly_minimum_cents: 2500, per_transaction_fee_cents: 20, equipment_lease_monthly_cents: 0, boarded_on: "2026-01-05" }
              as: IsoAdmin
              captures: { m2: $.data.id }
            - call: "POST /merchants/${m2}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants/${m1}/chargebacks"
              payload: { amount_cents: 4500, occurred_on: "2026-07-12", period_month: "2026-07", liability: "AGENT_CHARGED" }
              as: ResidualAnalyst
            - call: "POST /merchants/${m1}/chargebacks"
              payload: { amount_cents: 12000, occurred_on: "2026-07-20", period_month: "2026-07", liability: "ISO_ABSORBED" }
              as: ResidualAnalyst
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:aaa1" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m1}", transaction_count: 1240, sales_volume_cents: 4812355, interchange_cents: 92140, assessments_cents: 6255, gross_income_cents: 168430 }
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m2}", transaction_count: 124, sales_volume_cents: 100000, interchange_cents: 1800, assessments_cents: 130, gross_income_cents: 3200 }
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/post"
              payload: {}
              as: ResidualController
            - call: "GET /agents/${a1}"
              payload: {}
              as: IsoAdmin
              captures: { a1_v: $.data.version }
            - call: "POST /agents/${a1}/advances"
              payload: { advance_type: "CASH_ADVANCE", recoupment_mode: "PERCENT_OF_RESIDUAL", principal_cents: 60000, recoupment_pct: 0.40, first_recoupment_month: "2026-07", last_recoupment_month: "2026-12", funded_on: "2026-07-05", expected_agent_version: "${a1_v}" }
              as: IsoAdmin
              captures: { adv: $.data.id }
            - call: "GET /agent-statements"
              payload: { agent_id: "${a1}", period_month: "2026-07" }
              as: ResidualController
              captures: { st: "$.data[0].id" }
          trigger:
            - call: "POST /agent-statements/${st}/issue"
              payload: {}
              as: ResidualController
          assert:
            - "AgentStatement.${st}.direct_residual_cents == 14677   # 14643 from M1 + 34 from M2"
            - "AgentStatement.${st}.override_residual_cents == 0"
            - "AgentStatement.${st}.minimum_true_up_cents == 5   # only M2 is short: round_half_up(20 * 0.45 * 0.5)"
            - "AgentStatement.${st}.gross_after_trueup_cents == 14682"
            - "AgentStatement.${st}.advance_recoupment_cents == 3671   # 25% tier applied to 14682, NOT 3669 from 14677"
            - "AgentStatement.${st}.net_payable_cents == 11011"
            - "AgentStatement.${st}.carry_forward_deficit_cents == 0"
            - "AgentAdvance.${adv}.outstanding_cents == 56329 and AgentAdvance.${adv}.cumulative_recouped_cents == 3671"

      - name: profitability_equipment_proration_nested_conditional
        grounds:
          - calculations.merchant_profitability
          - calculations.residual_split_allocation
          - calculations.bonus_clawback
          - entities.MerchantProfitability.fields.equipment_cost_cents
          - state_machines.Merchant.ACTIVE_to_ATTRITED
        distinguishing_aspect: |
          Mode (a) — the same posting endpoint takes a different arithmetic path per
          merchant status. M1 attrites on 2026-07-20, inside the batch period, so the
          nested conditional prorates equipment by min(active_days, days_in_period) /
          days_in_period = 20/31: round_half_up(3900 * 20 / 31) = 2516 rather than the
          full 3900 an ACTIVE merchant is charged or the 0 a merchant attrited in an
