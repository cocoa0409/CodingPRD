              payload: {}
              as: LeagueTreasurer
              as_user_id: "${tre_id}"
            - call: "POST /fee-remittances/${fr1_id}/national-decision"
              payload: { decision: "ACCEPT", national_receipt_no: "NR-2913-0001" }
              as: AssociationOfficer
          trigger:
            - call: "GET /memberships?league_id=${lg_id}&sanction_status=SANCTIONED"
              payload: {}
              as: LeagueSecretary
              as_user_id: "${sec_id}"
            - call: "GET /memberships?league_id=${lg_id}&team_id=${t1_id}"
              payload: {}
              as: LeagueSecretary
              as_user_id: "${sec_id}"
            - call: "GET /memberships?league_id=${lg_id}&sanction_status=UNSANCTIONED"
              payload: {}
              as: LeagueSecretary
              as_user_id: "${sec_id}"
            - call: "GET /memberships?league_id=${lg_id}&limit=2&offset=2"
              payload: {}
              as: LeagueSecretary
              as_user_id: "${sec_id}"
          assert:
