            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r8}", target_weight_kg: 20.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b2: $.data.id } }
            - { call: "POST /tea-ops/batches/${b2}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { b2v2: $.data.version } }
