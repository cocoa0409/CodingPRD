scaffold_corner_design:
  - section: entities
    instances:
      - name: product_creation_applies_defaults_and_common_fields
        claim_type: creation
        grounds:
          - "entities.Product"
          - "endpoints.POST_/snack-mfg/products"
        distinguishing_aspect: "POST with all required fields and bags_per_case omitted returns 201 with bags_per_case == 12 (default applied), server-minted id, version == 1, created_at/updated_at stamped."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
          trigger:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000 }
              as: PlantManager
              captures: { p_id: $.data.id }
          assert:
            - "201; Product.${p_id}.bags_per_case == 12 (default)"
            - "Product.${p_id}.version == 1 and id/created_at/updated_at present"
            - "response envelope has meta.api_request_id and response_type == object"

      - name: product_missing_required_name_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Product.fields.name"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Omitting required field name yields 400 ERR_VALIDATION; no product persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
          trigger:
            - call: "POST /snack-mfg/products"
              payload: { process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000 }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "400 with error_id == ERR_VALIDATION"

      - name: product_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.Product.fields.process_type"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "process_type 'AIRFRY' is not a declared enum member -> 400 ERR_VALIDATION; duplicate allergen entries are likewise rejected."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
          trigger:
            - call: "POST /snack-mfg/products"
              payload: { name: "Bad", process_type: AIRFRY, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000 }
              as: PlantManager
              captures: { err: $.data.error_id }
            - call: "POST /snack-mfg/products"
              payload: { name: "Dup", process_type: FRYER, allergen_profile: [DAIRY, DAIRY], flavor_group: CHEESE, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000 }
              as: PlantManager
              captures: { err2: $.data.error_id }
          assert:
            - "first trigger: 400 ERR_VALIDATION (bad enum member)"
            - "second trigger: 400 ERR_VALIDATION (duplicate allergen entries)"

      - name: product_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - "entities.Product"
          - "response_envelope"
        distinguishing_aspect: "Client-supplied id/version in a create body are ignored: the server mints its own UUID id and version starts at 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
          trigger:
            - call: "POST /snack-mfg/products"
              payload: { id: "11111111-2222-3333-4444-555555555555", version: 99, name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000 }
              as: PlantManager
              captures: { p_id: $.data.id }
          assert:
            - "201; Product.${p_id}.id != 11111111-2222-3333-4444-555555555555 (server-minted)"
            - "Product.${p_id}.version == 1 (client 99 ignored)"

      - name: line_creation_creates_fryer_oil_child
        claim_type: computed_fields
        grounds:
          - "entities.ProductionLine"
          - "entities.FryerOil"
          - "endpoints.POST_/snack-mfg/lines"
        distinguishing_aspect: "Creating a line atomically creates its 1:1 FryerOil with initial_charge == oil_capacity_gallons, current_gallons == 100, tpm_pct == 0.5, state ACTIVE; the line reads posture IDLE and empty current profile."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
          trigger:
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "GET /snack-mfg/fryer-oils"
              as: PlantManager
          assert:
            - "GET /snack-mfg/fryer-oils returns exactly 1 record with line_id == ${line_id}"
            - "that FryerOil: current_gallons == 100, initial_charge_gallons == 100, tpm_pct == 0.5, state == ACTIVE, total_lbs_since_replace == 0"
            - "ProductionLine.${line_id}.posture == IDLE, current_allergen_profile == [], current_flavor_group == PLAIN, cleaning_minutes_full_wash == 120, cleaning_minutes_dry == 30 (defaults)"

      - name: weight_check_reject_threshold_exact_boundary
        claim_type: computed_fields
        grounds:
          - "entities.WeightCheck.fields.is_reject"
          - "entities.Product.fields.tne_g"
        distinguishing_aspect: "is_reject uses a STRICT less-than: a bag at exactly declared - 2*tne (97.0 g for 100.0/1.5) is NOT a reject; 96.99 g is."
        test_recipe:
          setup:
            - "product declared 100.0 g, tne 1.5 g (reject iff < 97.0 g); run started"
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_id: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_id}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: PlantManager
            - call: "POST /snack-mfg/production-runs/${run_id}/start"
              as: LineOperator
          trigger:
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 97.0, lbs_fried_since_last_check: 0, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
              captures: { wc1: $.data.id }
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 96.99, lbs_fried_since_last_check: 0, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
              captures: { wc2: $.data.id }
          assert:
            - "WeightCheck.${wc1}.is_reject == false (exactly at declared - 2*tne is not a reject)"
            - "WeightCheck.${wc2}.is_reject == true (strictly below)"

      - name: oil_movement_immutable_event_record
        claim_type: immutability
        grounds:
          - "entities.OilMovement"
        distinguishing_aspect: "OilMovement has common_fields false: the read carries id and created_at but no version/updated_at, and no update/delete endpoint exists."
        test_recipe:
          setup:
            - "line created (FryerOil auto-created, 100 gal)"
          setup_api_calls:
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "GET /snack-mfg/fryer-oils"
              as: PlantManager
              captures: { oil_id: "$.data[0].id", oil_v: "$.data[0].version" }
            - call: "POST /snack-mfg/oil-movements"
              payload: { fryer_oil_id: "${oil_id}", movement_type: DISCARD, gallons: 5, expected_oil_version: "${oil_v}" }
              as: LineOperator
              captures: { mv_id: $.data.id }
          trigger:
            - call: "GET /snack-mfg/oil-movements/${mv_id}"
              as: PlantManager
          assert:
            - "OilMovement.${mv_id} has id and created_at but no version and no updated_at field"
            - "OilMovement.${mv_id}.tpm_after_pct == 0.5 and gallons == 5, recorded_by_user_id present"

      - name: line_posture_recomputes_across_changeover_lifecycle
        claim_type: computed_fields
        grounds:
          - "entities.ProductionLine.fields.posture"
        distinguishing_aspect: "Posture is derived, not stored: IDLE at creation, CLEANING while a changeover is REQUIRED/CLEANING/SWAB_PENDING, back to IDLE only after VALIDATION — each read reflects the current child states."
        test_recipe:
          setup:
            - "run1 (DAIRY product) completed; run2 (PLAIN product) created -> REQUIRED changeover exists"
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Cheese Puffs", process_type: FRYER, allergen_profile: [DAIRY], flavor_group: CHEESE, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_dairy: $.data.id }
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_plain: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_dairy}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run1_id: $.data.id }
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: PlantManager
            - call: "POST /snack-mfg/production-runs/${run1_id}/start"
              as: LineOperator
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run1_id}", bag_weight_g: 100.0, lbs_fried_since_last_check: 100, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
            - call: "POST /snack-mfg/production-runs/${run1_id}/complete"
              payload: { lbs_produced: 100, cases_produced: 10, rejected_cases: 0, seasoning_actual_pct: 4.0 }
              as: LineOperator
            - call: "GET /snack-mfg/lines/${line_id}"
              as: PlantManager
              captures: { line_v2: $.data.version, posture_after_complete: $.data.posture }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_plain}", scheduled_start: "2026-08-02T12:00:00Z", scheduled_end: "2026-08-02T14:00:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${line_v2}" }
              as: PlantManager
              captures: { run2_id: $.data.id }
            - call: "GET /snack-mfg/changeovers"
              as: PlantManager
              captures: { co_id: "$.data[0].id" }
          trigger:
            - call: "GET /snack-mfg/lines/${line_id}"
              as: PlantManager
              captures: { posture_open: $.data.posture }
            - call: "POST /snack-mfg/changeovers/${co_id}/begin-cleaning"
              as: LineOperator
              as_user_id: "op-1"
            - call: "POST /snack-mfg/changeovers/${co_id}/record-swab"
              payload: { result: PASS }
              as: QualityTechnician
              as_user_id: "qt-1"
            - call: "POST /snack-mfg/changeovers/${co_id}/validate"
              as: QualityTechnician
              as_user_id: "qt-1"
            - call: "GET /snack-mfg/lines/${line_id}"
              as: PlantManager
              captures: { posture_validated: $.data.posture }
          assert:
            - "posture after run1 completion == IDLE (completed runs do not hold posture)"
            - "posture with the REQUIRED changeover open == CLEANING"
            - "posture after validation == IDLE again (derived from child states, never stored)"

  - section: state_machines
    instances:
      - name: run_create_initial_state_and_no_spurious_changeover
        claim_type: initial_state
        grounds:
          - "state_machines.ProductionRun"
        distinguishing_aspect: "A new run starts as execution SCHEDULED x quality PENDING; with an allergen-free product on a fresh line the requirement is NONE, so NO changeover is auto-created."
        test_recipe:
          setup: ["product (allergen-free PLAIN) and line exist"]
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_id: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
          trigger:
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_id}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "GET /snack-mfg/changeovers"
              as: PlantManager
          assert:
            - "ProductionRun.${run_id}.execution_status == SCHEDULED and quality_status == PENDING"
            - "GET /snack-mfg/changeovers returns an empty list (requirement NONE -> no auto-created changeover)"

      - name: run_start_from_running_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.ProductionRun.SCHEDULED_to_RUNNING"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Starting an already-RUNNING run is not idempotent: the second start is 409 ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["run started (execution RUNNING)"]
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_id: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_id}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: PlantManager
            - call: "POST /snack-mfg/production-runs/${run_id}/start"
              as: LineOperator
          trigger:
            - call: "POST /snack-mfg/production-runs/${run_id}/start"
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "409 ERR_INVALID_STATE; execution_status remains RUNNING, started_at unchanged"

      - name: run_complete_from_scheduled_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.ProductionRun.RUNNING_to_COMPLETED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Complete is only legal from RUNNING; from SCHEDULED it fails 409 ERR_INVALID_STATE before any compliance or margin computation runs."
        test_recipe:
          setup: ["run created but never started"]
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_id: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_id}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /snack-mfg/production-runs/${run_id}/complete"
              payload: { lbs_produced: 100, cases_produced: 10, rejected_cases: 0, seasoning_actual_pct: 4.0 }
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "409 ERR_INVALID_STATE; execution_status remains SCHEDULED"

      - name: terminal_lockdown_dispatched_shipment
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.Shipment"
          - "errors[ERR_ALREADY_TERMINAL]"
        distinguishing_aspect: "DISPATCHED is terminal: further dispatch and cancel attempts both fail 409 ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["run completed PASSED at default clock; shipment DSD planned and dispatched"]
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_id: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_id}", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T02:00:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "POST /snack-mfg/production-runs/${run_id}/start"
              as: LineOperator
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 100.0, lbs_fried_since_last_check: 100, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
            - call: "POST /snack-mfg/production-runs/${run_id}/complete"
              payload: { lbs_produced: 100, cases_produced: 10, rejected_cases: 0, seasoning_actual_pct: 4.0 }
              as: LineOperator
            - call: "POST /snack-mfg/production-runs/${run_id}/quality-disposition"
              payload: { disposition: PASS }
