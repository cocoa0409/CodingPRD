            - "the 2026-09-30 complete returned 200: status == \"COMPLETED\" and seats_taken == 0"
            - "BenchSpell.${bs_id}.state == \"MONITORING\", age_reset_on == 2026-09-30, age_days == 0, investment_ended_on == 2026-09-30, escalation_count is STILL 1 (a lifetime counter)"
