              as: AuditManager
              as_user_id: "aud-01"
              captures: { case1: $.data.id }
            - call: "POST /mft/audit-cases/${case1}/advance"
              payload: { to_status: "FIELDWORK" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /mft/audit-cases/${case1}/advance"
              payload: { to_status: "PRELIM_FINDINGS" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /mft/audit-cases"
              payload: { subject_licensee_id: "${d2_id}", selection_method: "MANUAL_REFERRAL", period_start_month: "2026-08", period_end_month: "2026-08" }
              as: AuditManager
              as_user_id: "aud-01"
              captures: { case2: $.data.id }
            - call: "POST /mft/audit-cases/${case2}/advance"
              payload: { to_status: "FIELDWORK" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /mft/audit-cases/${case2}/advance"
              payload: { to_status: "PRELIM_FINDINGS" }
              as: AuditManager
              as_user_id: "aud-01"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-25T00:00:00Z" }
              as: TaxSupervisor
              as_user_id: "sup-01"
            - call: "POST /mft/audit-cases/${case1}/assessments"
              payload: { additional_tax_cents: 250000, evasion_indicator: false }
              as: TaxSupervisor
