              as: ProgramCoordinator
              captures: { f1_id: "$.data.id" }
            - call: "POST /faculty-members"
              payload: { program_id: "${prog_id}", full_name: "Bea Osei", is_program_director: false, is_committee_member: false, conflict_applicant_ids: [] }
              as: ProgramCoordinator
              captures: { f2_id: "$.data.id" }
            - call: "POST /applicants"
              payload: { eras_id: "E-9001", full_name: "Nia Patel", medical_school_type: "US_MD", visa_status: "US_CITIZEN", step2_score: 251, pipeline_program_alum: true, self_identified_group: "GROUP_A" }
              as: NrmpAdmin
              captures: { cand1_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/advance-phase"
              payload: { to_phase: "REVIEW_OPEN" }
