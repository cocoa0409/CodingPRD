# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Union Dues & Membership Administration
# Breadth probe across the claim-extraction-guide taxonomy. Instances already
# covered by §1.8 appear as excluded_because stubs. All chains replay from
# empty DB; logical clock defaults to 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: member_creation_defaults_and_initial_state
        claim_type: defaults
        grounds: [entities.Member.fields.status, entities.Member.fields.arrears_cents, entities.Member.fields.good_standing, state_machines.Member]
        distinguishing_aspect: "A freshly registered member starts ACTIVE with zeroed computed money fields and good standing."
        test_recipe:
          setup: ["PCT local with JOURNEYMAN class exists"]
          setup_api_calls:
            - call: "POST /api/locals"
              payload: { name: "Local 100", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 3000, max_monthly_dues_cents: 20000 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
          trigger:
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "New Ned", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { m_status: "$.data.status", m_arrears: "$.data.arrears_cents", m_credit: "$.data.credit_balance_cents", m_gs: "$.data.good_standing", m_v: "$.data.version", m_susp: "$.data.suspension_count" }
          assert:
            - "${m_status} == ACTIVE (initial state)"
            - "${m_arrears} == 0 and ${m_credit} == 0 and ${m_susp} == 0"
            - "${m_gs} == true and ${m_v} == 1"

      - name: member_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Member.fields.full_name, "errors[ERR_INVALID_REQUEST]", "validations[priority=9]"]
        distinguishing_aspect: "Omitting required full_name is a 400 schema rejection before any state work."
        test_recipe:
          setup: ["PCT local with JOURNEYMAN class exists"]
          setup_api_calls:
            - call: "POST /api/locals"
              payload: { name: "Local 100", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 3000 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
          trigger:
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_INVALID_REQUEST (400) — full_name is required"

      - name: member_body_ref_employer_not_found_returns_422
        claim_type: parent_relationships
        grounds: [entities.Member.fields.employer_id, "errors[ERR_EMPLOYER_NOT_FOUND]", "validations[priority=7]"]
        distinguishing_aspect: "A body-referenced employer id that does not exist is a 422 referential rejection (not 404 — that is reserved for path ids)."
        test_recipe:
          setup: ["PCT local with JOURNEYMAN class exists"]
          setup_api_calls:
            - call: "POST /api/locals"
              payload: { name: "Local 100", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 3000 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
          trigger:
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", employer_id: "00000000-0000-0000-0000-000000000000", full_name: "Ghost Gary", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_EMPLOYER_NOT_FOUND with http 422 (body reference)"

      - name: duplicate_member_number_rejected
        claim_type: type_constraints
        grounds: [entities.Member.fields.member_number, "errors[ERR_DUPLICATE_MEMBER_NUMBER]", "validations[priority=9]"]
        distinguishing_aspect: "member_number is unique per local; the second registration with the same number in the same local is a 409."
        test_recipe:
          setup: ["PCT local with JOURNEYMAN class; member M-001 already registered"]
          setup_api_calls:
            - call: "POST /api/locals"
              payload: { name: "Local 100", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 3000 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "First Fred", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
          trigger:
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Second Fred", member_number: "M-001", joined_at: "2026-02-01" }
              as: OfficeClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_DUPLICATE_MEMBER_NUMBER (409)"

      - name: classification_duplicate_code_rejected
        claim_type: type_constraints
        grounds: [entities.MemberClassification.fields.code, "errors[ERR_DUPLICATE_CLASSIFICATION]"]
        distinguishing_aspect: "Classification code is unique within a local."
        test_recipe:
          setup: ["PCT local exists with a JOURNEYMAN classification"]
          setup_api_calls:
            - call: "POST /api/locals"
              payload: { name: "Local 100", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 3000 }
              as: LocalAdmin
          trigger:
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 1000 }
              as: LocalAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_DUPLICATE_CLASSIFICATION (409)"

      - name: member_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Member, "errors[ERR_MEMBER_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "Path-id existence: a random UUID in the member position is a 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
          trigger:
            - call: "GET /api/members/00000000-0000-0000-0000-000000000000"
              as: SecretaryTreasurer
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_MEMBER_NOT_FOUND (404)"

      - name: assessment_run_computed_counts
        claim_type: computed_fields
        grounds: [entities.AssessmentRun.fields.assessments_created_count, entities.AssessmentRun.fields.assessments_finalized_count]
        distinguishing_aspect: "The run's batch counters are computed: 2 members created for 2026-06, and the run finalizes the 1 stale PROVISIONAL from 2026-05."
        test_recipe:
          setup: ["FLAT local (flat 5000); members M1, M2; run for 2026-05 already executed (2 PROVISIONALs)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Batch Bill", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Batch Barb", member_number: "M-002", joined_at: "2026-01-15" }
              as: OfficeClerk
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-05" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ParentBodyAdmin }
          trigger:
            - call: "POST /api/assessment-runs"
              payload: { local_id: "${loc}", period: "2026-06" }
              as: SecretaryTreasurer
              captures: { created: "$.data.assessments_created_count", finalized: "$.data.assessments_finalized_count" }
          assert:
            - "${created} == 2 (M1 and M2 for 2026-06)"
            - "${finalized} == 2 (both members' stale 2026-05 PROVISIONALs finalized at gross 0)"

      - name: ledger_entry_system_generated_fields
        claim_type: system_fields
        grounds: [entities.LedgerEntry, entities.LedgerEntry.fields.entry_type]
        distinguishing_aspect: "LedgerEntry is append-only (common_fields false): a payment response carries server-minted id, entry_type DIRECT_PAYMENT, signed amount, and current-period tag — client input cannot set them."
        test_recipe:
          setup: ["FLAT local; member M with one FINAL assessment (runs 2026-05 + 2026-06 -> arrears 10000)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Ledger Lou", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-05" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-06" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
          trigger:
            - call: "POST /api/members/${mem}/payments"
              payload: { amount_cents: 4000 }
              as: Member
              as_user_id: "${mem}"
              captures: { le_type: "$.data.entry_type", le_amt: "$.data.amount_cents", le_period: "$.data.period" }
          assert:
            - "${le_type} == DIRECT_PAYMENT (system-assigned, not client-supplied)"
            - "${le_amt} == -4000 (credits are negative)"
            - "${le_period} == 2026-08 (current clock period at posting)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: withdrawn_member_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Member, "errors[ERR_MEMBER_TERMINAL_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal: a subsequent payment attempt is rejected and no ledger entry is written."
        test_recipe:
          setup: ["FLAT local; member M with arrears 0 withdrew successfully"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Gone Gina", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/members/${mem}/withdraw", payload: {}, as: Member, as_user_id: "${mem}" }
          trigger:
            - call: "POST /api/members/${mem}/payments"
              payload: { amount_cents: 1000 }
              as: SecretaryTreasurer
              captures: { err: "$.data.error_id" }
            - call: "GET /api/members/${mem}/ledger"
              as: SecretaryTreasurer
              captures: { entries: "$.data" }
          assert:
            - "${err} == ERR_MEMBER_TERMINAL_STATE (409)"
            - "ledger remains empty (${entries} has length 0) — the rejected payment wrote nothing"

      - name: reinstate_non_suspended_member_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Member.SUSPENDED_to_ACTIVE, "errors[ERR_MEMBER_NOT_SUSPENDED]"]
        distinguishing_aspect: "Reinstate is only valid from SUSPENDED; an ACTIVE member draws ERR_MEMBER_NOT_SUSPENDED."
        test_recipe:
          setup: ["FLAT local; member M ACTIVE"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Active Al", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
          trigger:
            - call: "POST /api/members/${mem}/reinstate"
              payload: { amount_cents: 2500 }
              as: SecretaryTreasurer
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_MEMBER_NOT_SUSPENDED (409)"

      - name: void_received_remittance_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CheckoffRemittance.POSTED_to_VOID, "errors[ERR_REMITTANCE_NOT_POSTED]"]
        distinguishing_aspect: "Void is only valid from POSTED; a RECEIVED remittance draws ERR_REMITTANCE_NOT_POSTED."
        test_recipe:
          setup: ["PCT local; employer E; remittance R RECEIVED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 100", dues_method: "PERCENTAGE_OF_GROSS", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 30, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/employers"
              payload: { name: "Acme Widgets" }
              as: OfficeClerk
              captures: { emp: "$.data.id" }
            - call: "POST /api/remittances"
              payload: { employer_id: "${emp}", local_id: "${loc}", period: "2026-08", remitted_cents: 0 }
              as: OfficeClerk
              as_user_id: clerk_1
              captures: { rem: "$.data.id" }
          trigger:
            - call: "POST /api/remittances/${rem}/void"
              payload: {}
              as: LocalAdmin
              as_user_id: admin_1
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_REMITTANCE_NOT_POSTED (409)"

      - name: notice_send_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.DelinquencyNotice.DRAFT_to_SENT, "errors[ERR_NOTICE_STATE_FORBIDDEN]"]
        distinguishing_aspect: "Re-sending an already SENT notice is a state error (state guard precedes the temporal window check)."
        test_recipe:
          setup: ["FLAT local (cure 10); member M DELINQUENT with DRAFT notice N (sweep at 2026-08-01); N sent"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { loc: "$.data.id" }
            - call: "POST /api/locals/${loc}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${loc}", classification_id: "${cls}", full_name: "Twice Tina", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id" }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-05" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/assessment-runs", payload: { local_id: "${loc}", period: "2026-06" }, as: SecretaryTreasurer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - { call: "POST /api/system/sweeps/delinquency", payload: { local_id: "${loc}" }, as: LocalAdmin }
            - call: "GET /api/members/${mem}/notices"
              as: OfficeClerk
              captures: { nid: "$.data[0].id" }
            - { call: "POST /api/members/${mem}/notices/${nid}/send", payload: {}, as: OfficeClerk }
          trigger:
            - call: "POST /api/members/${mem}/notices/${nid}/send"
              payload: {}
              as: OfficeClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_NOTICE_STATE_FORBIDDEN (409) — the SENT notice is not DRAFT; the window check never runs"

      - name: transfer_reject_branch_then_terminal_lockdown
        claim_type: invalid_transition
        grounds: [state_machines.MemberTransfer.PENDING_TARGET_to_REJECTED_BY_TARGET, "errors[ERR_TRANSFER_STATE_FORBIDDEN]"]
        distinguishing_aspect: "The reject fork lands in a terminal state; a later accept draws ERR_TRANSFER_STATE_FORBIDDEN."
        test_recipe:
          setup: ["Two FLAT locals L1, L2; member M ACTIVE with transfer certified to PENDING_TARGET"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
              payload: { name: "Local 200", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 5000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { l1: "$.data.id" }
            - call: "POST /api/locals"
              payload: { name: "Local 400", dues_method: "FLAT_RATE", default_dues_percent_bp: 200, default_flat_dues_cents: 1000, per_capita_rate_cents: 1500, delinquency_threshold_cents: 10000, grace_periods: 2, notice_cure_days: 10, reinstatement_base_fee_cents: 2500, max_suspensions: 3, expel_after_months: 12 }
              as: ParentBodyAdmin
              captures: { l2: "$.data.id" }
            - call: "POST /api/locals/${l1}/classifications"
              payload: { code: "JOURNEYMAN", min_monthly_dues_cents: 0 }
              as: LocalAdmin
              captures: { cls: "$.data.id" }
            - call: "POST /api/members"
              payload: { local_id: "${l1}", classification_id: "${cls}", full_name: "Branch Brad", member_number: "M-001", joined_at: "2026-01-15" }
              as: OfficeClerk
              captures: { mem: "$.data.id", m_v: "$.data.version" }
            - call: "POST /api/members/${mem}/transfers"
              payload: { to_local_id: "${l2}", effective_period: "2026-09", expected_member_version: "${m_v}" }
              as: Member
