  # ===========================================================================
  - section: errors
    instances:
      - name: error_response_envelope_is_uniform_across_status_codes
        claim_type: triggerability
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_DISASTER_NOT_FOUND]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Every rejection, whatever its priority band, answers with the same envelope carrying error_id and a non-empty message, and with the http status declared for that id in §1.6 (401, 403, 404, 422)."
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z with one declaration DR-4989 already created."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4989", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 2000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
          trigger:
            - call: "GET /public-assistance/disasters/${disaster_id}"
              payload: {}
              as: "(request sent with no X-User-Role and no X-User-ID header)"
              captures: { err_401: $.data.error_id }
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4989-B", state_code: "OK", incident_type: "FLOOD", incident_start_at: "2026-08-01T00:00:00Z", incident_end_at: "2026-08-10T00:00:00Z", population: 400000 }
              as: ProgramSpecialist
              as_user_id: "spec-1"
              captures: { err_403: $.data.error_id }
            - call: "GET /public-assistance/disasters/00000000-0000-4000-8000-000000009999"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_404: $.data.error_id, msg_404: $.data.message }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "City of Harborview", population_served: 120000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_422: $.data.error_id }
          assert:
            - "missing headers -> HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "ProgramSpecialist declaring a disaster -> HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "unknown disaster id -> HTTP 404 with error_id ERR_DISASTER_NOT_FOUND and a non-empty message"
            - "applicant creation without applicant_type -> HTTP 422 with error_id ERR_INVALID_REQUEST"
            - "all four bodies expose exactly the fields error_id and message under data, and none creates or mutates a row"

      - name: path_id_resolution_precedes_body_shape_validation
        claim_type: triggerability
        grounds:
          - validations[priority 4]
          - validations[priority 5]
          - validations[priority 6]
        distinguishing_aspect: "The priority ladder is observable through error ids alone: an unknown path id beats a malformed body (404, not 422), while a malformed body beats an unresolvable body foreign key (422, not 404)."
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z, declaration DR-4990 with one applicant."
          setup_api_calls:
            - call: "POST /public-assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /public-assistance/disasters"
              payload: { declaration_number: "DR-4990", state_code: "TX", incident_type: "FLOOD", incident_start_at: "2026-06-10T00:00:00Z", incident_end_at: "2026-06-25T00:00:00Z", population: 2000000 }
              as: PlatformAdmin
              captures: { disaster_id: $.data.id }
            - call: "POST /public-assistance/applicants"
              payload: { disaster_id: "${disaster_id}", name: "City of Harborview", applicant_type: "LOCAL_GOVERNMENT", population_served: 120000 }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /public-assistance/projects/00000000-0000-4000-8000-000000009999/cost-review"
              payload: { decision: "MAYBE" }
              as: ProgramSpecialist
              as_user_id: "spec-1"
              captures: { err_path: $.data.error_id }
            - call: "POST /public-assistance/cost-line-items"
              payload: { project_id: "00000000-0000-4000-8000-000000009999", cost_type: "GRAVEL", claimed_cents: 1000, work_start_at: "2026-06-12T08:00:00Z", work_end_at: "2026-06-12T17:00:00Z" }
              as: ApplicantAgent
              as_user_id: "${applicant_id}"
              captures: { err_body: $.data.error_id }
          assert:
            - "unknown project id plus an invalid decision enum -> HTTP 404 with error_id ERR_PROJECT_NOT_FOUND (priority 4 before priority 5)"
            - "invalid cost_type plus an unknown project_id in the body -> HTTP 422 with error_id ERR_INVALID_REQUEST (priority 5 before priority 6)"
            - "neither request creates a row: GET /public-assistance/cost-line-items -> total_count == 0"

      - name: drawdown_above_available_returns_402
        claim_type: triggerability
        grounds:
          - errors[ERR_DRAWDOWN_EXCEEDS_AVAILABLE]
        excluded_because:
          difficulty_instance: boundary_precision_check / drawdown_request_exactly_equal_to_available_is_accepted
          rationale: "That §1.8 instance triggers the only 402 in the catalog by requesting one cent above available_drawdown_cents."

      - name: stale_parent_versions_return_412
        claim_type: triggerability
        grounds:
          - errors[ERR_STALE_APPLICANT_VERSION]
          - errors[ERR_STALE_PROJECT_VERSION]
        excluded_because:
          difficulty_instance: compensating_invariant / obligation_ledger_conserved_by_full_final_deobligation
          rationale: "The two 412 ids are exercised by the optimistic_concurrency instances in the cross_cutting_complexity_layers section below, whose ledger arithmetic is pinned by that §1.8 instance."

