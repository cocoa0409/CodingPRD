              as: ProgramAdmin
              captures: { el2_id: $.data.id, el2_v: $.data.version }
            - call: "POST /benefits/order-batches"
              payload: { election_window_id: "${win_id}", region_code: "US-TX-AUS" }
              as: OrderDesk
              as_user_id: "desk-sealer"
              captures: { bat_id: $.data.id }
            - call: "POST /benefits/media-orders"
              payload: { election_id: "${el1_id}", transit_media_id: "${med_half_id}", order_batch_id: "${bat_id}", quantity: 1, coverage_start_at: "2026-08-01T00:00:00Z", coverage_end_at: "2026-08-31T00:00:00Z", expected_election_version: "${el1_v}" }
