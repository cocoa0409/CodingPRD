scenario: "2274. Water Treatment Equipment Manufacturing (water and wastewater equipment manufacturer): application engineering from influent water quality and treatment objectives with process selection, equipment design across filtration, disinfection, membrane and biological treatment systems, custom fabrication with materials selection for corrosive service and code compliance, factory testing and skid assembly with controls integration and factory acceptance testing, municipal bid participation with specification compliance and pre-approval as an equal product, installation support, startup services and performance guarantee demonstration testing, operator training, operations manuals and spare parts recommendations, long-term service, membrane replacement and consumable supply agreements"

domain_name: water-treatment-equipment-manufacturing
api_prefix: "/water-treatment"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - selector_policy
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: graph
  # The treatment train is a linked chain of TreatmentStage rows
  # (`upstream_stage_id` is self-referential), stages point at a shared
  # ProcessTechnology catalog, EquipmentPackage points at both a stage and a
  # shared MaterialSpec catalog, and FatRun joins Skid x TestBay. Reads are
  # therefore predominantly flat/filtered rather than deeply nested.

  state_machine_shape: cyclic
  # EquipmentPackage carries two cycles (IN_REVIEW -> DRAFT revision loop and
  # RELEASED_FOR_FAB -> REWORK_HOLD -> RELEASED_FOR_FAB rework loop);
  # OrEqualSubmittal carries a SUBMITTED -> DRAFT negotiation loop;
  # ServiceAgreement carries an ACTIVE -> SUSPENDED -> ACTIVE loop; Skid carries
  # two independent state dimensions (mechanical_status, controls_status) that
  # advance on separate axes and are folded into a derived `fat_readiness`.

  relationship_patterns:
    - one_to_many          # Project -> InfluentProfile / TreatmentObjective / TreatmentStage / OrEqualSubmittal / PerformanceDemo / ServiceAgreement
    - self_referential     # TreatmentStage.upstream_stage_id -> TreatmentStage.id; ConsumableDraw.reverses_draw_id -> ConsumableDraw.id
    - cross_aggregate      # EquipmentPackage -> MaterialSpec; FatRun -> TestBay; PerformanceDemo -> Skid
    - polymorphic_none     # no polymorphic references in this scaffold

  role_model: segregation_of_duties
  # The user who authored an EquipmentPackage revision cannot be the user who
  # renders its review decision; the user who authored an OrEqualSubmittal
  # cannot be the user who submits the project's bid; the user who recorded a
  # PerformanceDemo's readings cannot be the user who certifies it.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 15 entities / 65 endpoints / 60 error codes / 15 calculations (2 dual-variant
  # on different domains) / 11 state machines (4 non-linear) / 60 ordered
  # validations / 3 OCC rules / 9 roles.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: municipal project name
        constraints: non-empty, max 160 chars
      - name: owner_agency_name
        type: string
        source: input
        description: owning water/wastewater agency
        constraints: non-empty
      - name: procurement_type
        type: enum
        source: input
        description: how the package is procured
        default: MUNICIPAL_BID
        constraints: "MUNICIPAL_BID | DESIGN_BUILD | SOLE_SOURCE"
      - name: bid_due_at
        type: datetime
        source: input
        description: bid closing instant; bids are refused at or after this instant
        constraints: ISO 8601 UTC, three fractional digits
      - name: guarantee_deadline_at
        type: datetime
        source: input
        description: contractual instant by which the performance guarantee must be demonstrated
        constraints: ISO 8601 UTC, must be strictly after bid_due_at
      - name: footprint_allowance_sf_per_stage
        type: number
        source: input
        description: square feet of plant footprint budgeted for each treatment stage; excess footprint is penalised by the process-selection ranking
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: project lifecycle state
        default: DRAFT
        constraints: "DRAFT | SCOPED | BID_READY | BID_SUBMITTED | BID_BLOCKED | AWARDED | IN_FABRICATION | COMMISSIONING | GUARANTEED | REMEDIATION | SERVICE_ACTIVE | CLOSED"
      - name: delivery_posture
        type: enum
        source: computed
        description: derived posture over every EquipmentPackage and FatRun in the project; see calculations.project_delivery_posture
        default: ON_TRACK
        constraints: "ON_TRACK | AT_RISK | HELD"
      - name: guarantee_status
        type: enum
        source: system
        description: performance-guarantee demonstration state
        default: NOT_STARTED
        constraints: "NOT_STARTED | DEMONSTRATING | MET | DEFAULTED"
      - name: governing_influent_profile_id
        type: string
        source: computed
        description: "FK -> InfluentProfile.id; the profile selected by calculations.governing_influent_profile_selection; null until process selection runs"
        default: null
      - name: om_manual_status
        type: enum
        source: system
        description: owner acceptance state of the operations and maintenance manual package
        default: PENDING
        constraints: "PENDING | ACCEPTED | REJECTED"
      - name: operator_training_status
        type: enum
        source: system
        description: owner acceptance state of the operator training deliverable
        default: PENDING
        constraints: "PENDING | ACCEPTED | REJECTED"
      - name: spare_parts_list_status
        type: enum
        source: system
        description: owner acceptance state of the recommended spare parts list
        default: PENDING
        constraints: "PENDING | ACCEPTED | REJECTED"
      - name: base_bid_amount_cents
        type: integer
        source: computed
        description: per-stage line-item rollup pinned by calculations.bid_evaluated_price step 1
        default: 0
      - name: bond_premium_cents
        type: integer
        source: computed
        description: payment/performance bond premium from calculations.bid_evaluated_price step 3
        default: 0
      - name: contingency_cents
        type: integer
        source: computed
        description: posture-keyed contingency from calculations.bid_evaluated_price step 4
        default: 0
      - name: evaluated_bid_price_cents
        type: integer
        source: computed
        description: internal evaluated cost floor from calculations.bid_evaluated_price step 5
        default: 0
      - name: offered_price_cents
        type: integer
        source: system
        description: price actually offered to the agency, captured from the bid request body
        default: 0
      - name: contract_amount_cents
        type: integer
        source: system
        description: awarded contract value; copied from offered_price_cents when the bid is submitted
        default: 0
      - name: liquidated_damages_cents
        type: integer
        source: computed
        description: accrued liquidated damages from calculations.liquidated_damages
        default: 0
      - name: awarded_at
        type: datetime
        source: system
        description: logical-clock instant the project was awarded
        default: null

  - name: InfluentProfile
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; owning municipal project"
      - name: sample_label
        type: string
        source: input
        description: field label of the influent sample
        constraints: non-empty
      - name: design_flow_mgd
        type: number
        source: input
        description: average design flow in million gallons per day represented by this sample
        constraints: "> 0, three decimal places"
      - name: peak_factor
        type: number
        source: input
        description: peak-to-average hydraulic multiplier
        default: 1.5
        constraints: ">= 1.0"
      - name: turbidity_ntu
        type: number
        source: input
        description: influent turbidity in NTU
        constraints: ">= 0"
      - name: tds_mg_l
        type: number
        source: input
        description: total dissolved solids in mg/L
        constraints: ">= 0"
      - name: toc_mg_l
        type: number
        source: input
        description: total organic carbon in mg/L
        constraints: ">= 0"
      - name: chloride_mg_l
        type: number
        source: input
        description: chloride concentration in mg/L; drives corrosive-service material screening
        constraints: ">= 0"
      - name: temperature_c
        type: number
        source: input
        description: design water temperature in degrees Celsius
      - name: ph
        type: number
        source: input
        description: influent pH
        constraints: "0 <= ph <= 14"
      - name: qa_status
        type: enum
        source: system
        description: laboratory QA acceptance state of this sample
        default: SUBMITTED
        constraints: "SUBMITTED | ACCEPTED | REJECTED"
      - name: qa_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityEngineer who accepted or rejected the sample
        default: null
      - name: qa_note
        type: string
        source: system
        description: free-text QA note captured with the decision
        default: null

  - name: TreatmentObjective
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; owning municipal project"
      - name: parameter
        type: enum
        source: input
        description: regulated parameter the plant must meet
        constraints: "TURBIDITY_NTU | TOC_MG_L | TDS_MG_L | CHLORIDE_MG_L | ECOLI_CFU_100ML | GIARDIA_LOG_REMOVAL | BOD5_MG_L | AMMONIA_N_MG_L"
      - name: limit_value
        type: number
        source: input
        description: numeric effluent limit for the parameter
        constraints: "> 0, three decimal places"
      - name: basis
        type: enum
        source: input
        description: statistical basis the limit is evaluated on during the performance demonstration
        constraints: "MAX_DAY | MONTHLY_AVERAGE"
      - name: regulatory_driver
        type: string
        source: input
        description: citation of the permit or rule imposing the limit
        constraints: non-empty
      - name: status
        type: enum
        source: system
        description: whether this objective is the governing row for its parameter
        default: ACTIVE
        constraints: "ACTIVE | RETIRED"

  - name: ProcessTechnology
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: catalog code of the unit process
        constraints: non-empty, unique across ProcessTechnology
      - name: name
        type: string
        source: input
        description: human-readable technology name
        constraints: non-empty
      - name: role
        type: enum
        source: input
        description: treatment role this technology fills in a train
        constraints: "BIOLOGICAL | FILTRATION | DESALINATION | DISINFECTION"
      - name: max_feed_turbidity_ntu
        type: number
        source: input
        description: highest influent turbidity the technology tolerates
        constraints: ">= 0"
      - name: max_feed_tds_mg_l
        type: number
        source: input
        description: highest influent TDS the technology tolerates
        constraints: ">= 0"
      - name: min_design_flow_mgd
        type: number
        source: input
        description: lowest stage design flow the technology can be built for
        constraints: ">= 0"
      - name: max_design_flow_mgd
        type: number
        source: input
        description: highest stage design flow the technology can be built for
        constraints: ">= min_design_flow_mgd"
      - name: unit_capex_cents_per_mgd
        type: integer
        source: input
        description: equipment capital cost in cents per MGD of stage design flow
        constraints: "> 0"
      - name: energy_kwh_per_mg
        type: number
        source: input
        description: electrical energy in kWh per million gallons treated
        constraints: ">= 0"
      - name: footprint_sf_per_mgd
        type: number
        source: input
        description: plan footprint in square feet per MGD of stage design flow
        constraints: "> 0"
      - name: requires_code_stamp
        type: enum
        source: input
        description: pressure-vessel or potable-water code stamp the technology's equipment must carry
        default: NONE
        constraints: "NONE | AWWA | NSF61 | ASME_U"
      - name: chemical_service_class
        type: enum
        source: input
        description: wetted chemical service the equipment sees; screened against MaterialSpec.service_classes_allowed
        constraints: "NEUTRAL | CHLORINATED | HIGH_CHLORIDE | CAUSTIC | ACIDIC"
      - name: consumable_item_code
        type: string
        source: input
        description: item code of the recurring consumable or membrane element, null for technologies with no consumable
        default: null
      - name: status
        type: enum
        source: input
        description: catalog availability; only ACTIVE rows enter the process-selection candidate pool
        default: ACTIVE
        constraints: "ACTIVE | DEPRECATED"

  - name: MaterialSpec
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: material designation such as SS316L or DUPLEX_2205
        constraints: non-empty, unique across MaterialSpec
      - name: max_chloride_ppm
        type: number
        source: input
        description: highest chloride concentration the alloy is rated for in wetted service
        constraints: ">= 0"
      - name: max_temp_c
        type: number
        source: input
        description: highest design temperature the material is rated for
      - name: max_pressure_psig
        type: integer
        source: input
        description: highest design pressure the material is rated for
        constraints: "> 0"
      - name: ph_min
        type: number
        source: input
        description: lowest pH the material tolerates
        constraints: "0 <= ph_min <= 14"
      - name: ph_max
        type: number
        source: input
        description: highest pH the material tolerates
        constraints: "ph_min <= ph_max <= 14"
      - name: asme_u_capable
        type: boolean
        source: input
        description: material may carry an ASME Section VIII U stamp
        default: false
      - name: nsf61_certified
        type: boolean
        source: input
        description: material is NSF/ANSI 61 certified for potable contact
        default: false
      - name: awwa_compliant
        type: boolean
        source: input
        description: material satisfies the referenced AWWA standard
        default: false
      - name: cost_index
        type: number
        source: input
        description: multiplier applied to the stage equipment base cost in the FIRM cost variant
        constraints: ">= 1.0, two decimal places"
      - name: service_classes_allowed
        type: array
        source: input
        description: chemical service classes the material may contact; elements drawn from ProcessTechnology.chemical_service_class
        constraints: non-empty array of "NEUTRAL | CHLORINATED | HIGH_CHLORIDE | CAUSTIC | ACIDIC"

  - name: TreatmentStage
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; owning municipal project"
      - name: technology_id
        type: string
        source: computed
        description: "FK -> ProcessTechnology.id; winner of calculations.process_train_selection for this stage role"
      - name: upstream_stage_id
        type: string
        source: computed
        description: "FK -> TreatmentStage.id; the stage immediately upstream in the train, null for the head stage"
        default: null
      - name: role
        type: enum
        source: computed
        description: copied from the winning ProcessTechnology.role
        constraints: "BIOLOGICAL | FILTRATION | DESALINATION | DISINFECTION"
      - name: stage_index
        type: integer
        source: computed
        description: 1-based position in the train, assigned from the pinned STAGE_ORDER constant
        constraints: ">= 1"
      - name: design_flow_mgd
        type: number
        source: computed
        description: stage design flow from calculations.stage_design_flow
        constraints: three decimal places
      - name: evaluated_cost_cents
        type: integer
        source: computed
        description: 20-year evaluated cost of the winning technology from calculations.process_train_selection
      - name: equipment_base_cost_cents
        type: integer
        source: computed
        description: capital-only component of the evaluated cost; the base every EquipmentPackage cost variant multiplies
      - name: status
        type: enum
        source: system
        description: stage lifecycle state
        default: SELECTED
        constraints: "SELECTED | ENGINEERED | SUPERSEDED"

  - name: EquipmentPackage
    parent: TreatmentStage
    common_fields: true
    fields:
      - name: treatment_stage_id
        type: string
        source: input
        description: "FK -> TreatmentStage.id; the stage this package equips"
      - name: material_spec_id
        type: string
        source: input
        description: "FK -> MaterialSpec.id; wetted material selected for corrosive service"
      - name: tag_number
        type: string
        source: input
        description: equipment tag number on the P and ID
        constraints: non-empty, unique across EquipmentPackage rows of the same treatment_stage_id
      - name: design_pressure_psig
        type: integer
        source: input
        description: design pressure of the package in psig
        constraints: "> 0"
      - name: design_temp_c
        type: number
        source: input
        description: design temperature of the package in degrees Celsius
      - name: code_stamp_required
        type: enum
        source: computed
        description: copied from the stage technology's requires_code_stamp at package creation
        constraints: "NONE | AWWA | NSF61 | ASME_U"
      - name: status
        type: enum
        source: system
        description: design and fabrication state
        default: DRAFT
        constraints: "DRAFT | IN_REVIEW | APPROVED | RELEASED_FOR_FAB | REWORK_HOLD | FAT_PASSED | SHIPPED"
      - name: revision_round
        type: integer
        source: system
        description: number of completed IN_REVIEW to DRAFT revision loops
        default: 0
      - name: designed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ApplicationEngineer who created or last revised the package
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the DesignReviewer who rendered the most recent review decision
        default: null
      - name: budgetary_cost_cents
        type: integer
        source: computed
        description: BUDGETARY variant of calculations.equipment_package_cost, stamped when the package enters IN_REVIEW
        default: 0
      - name: firm_cost_cents
        type: integer
        source: computed
        description: FIRM variant of calculations.equipment_package_cost, stamped when the package is released for fabrication
        default: 0
      - name: cost_variance_pct
        type: number
        source: computed
        description: (firm_cost_cents - budgetary_cost_cents) / budgetary_cost_cents rounded to four decimal places, 0 until release
        default: 0
      - name: variance_flag
        type: boolean
        source: computed
        description: true when cost_variance_pct exceeds MAX_COST_VARIANCE_PCT at release
        default: false
      - name: approved_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent APPROVED transition; the escalation baseline for the FIRM cost variant
        default: null
      - name: released_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent RELEASED_FOR_FAB transition
        default: null

  - name: Skid
    parent: EquipmentPackage
    common_fields: true
    fields:
      - name: equipment_package_id
        type: string
        source: computed
        description: "FK -> EquipmentPackage.id; the package this physical skid realises"
      - name: serial_no
        type: string
        source: system
        description: shop serial number minted as SKID-<stage_index>-<revision_round> at release for fabrication
      - name: footprint_sf
        type: number
        source: computed
        description: ceil(technology.footprint_sf_per_mgd * stage.design_flow_mgd) snapshotted at skid creation
      - name: requires_exclusive_bay
        type: boolean
        source: computed
        description: true when the package's code_stamp_required is ASME_U, because hydrostatic proof testing occupies the whole bay
      - name: mechanical_status
        type: enum
        source: system
        description: mechanical assembly dimension, advanced independently of controls_status
        default: FRAME_SET
        constraints: "FRAME_SET | PIPING_COMPLETE | HYDROTEST_PASSED | MECH_COMPLETE | REWORK"
      - name: controls_status
        type: enum
        source: system
        description: controls integration dimension, advanced independently of mechanical_status
        default: PANEL_BUILD
        constraints: "PANEL_BUILD | IO_CHECKED | LOOP_TESTED | CONTROLS_COMPLETE"
      - name: fat_readiness
        type: enum
        source: computed
        description: derived fold of both state dimensions plus package status; see calculations.skid_fat_readiness
        default: NOT_READY
        constraints: "NOT_READY | READY | BLOCKED"
      - name: rework_count
        type: integer
        source: system
        description: number of times the skid has entered mechanical REWORK
        default: 0

  - name: TestBay
    parent: null
    common_fields: true
    fields:
      - name: bay_code
        type: string
        source: input
        description: shop bay identifier
        constraints: non-empty, unique across TestBay
      - name: max_skid_footprint_sf
        type: number
        source: input
        description: total skid footprint the bay can host at one time
        constraints: "> 0"
      - name: changeover_buffer_minutes
        type: integer
        source: input
        description: rigging and changeover buffer applied symmetrically to both ends of every booked interval
        default: 120
        constraints: ">= 0"
      - name: crane_capacity_tons
        type: number
        source: input
        description: overhead crane rating of the bay
        constraints: "> 0"
      - name: reserved_footprint_minutes
        type: number
        source: computed
        description: conserved ledger of footprint-minutes held by non-released FatRun rows on this bay; see calculations.bay_footprint_minute_ledger
        default: 0
      - name: status
        type: enum
        source: input
        description: bay availability
        default: AVAILABLE
        constraints: "AVAILABLE | OUT_OF_SERVICE"

  - name: FatRun
    parent: Skid
    common_fields: true
    fields:
      - name: skid_id
        type: string
        source: input
        description: "FK -> Skid.id; the skid under factory acceptance test"
      - name: test_bay_id
        type: string
        source: input
        description: "FK -> TestBay.id; the bay the run occupies"
      - name: round_no
        type: integer
        source: computed
        description: 1 plus the count of FatRun rows on this skid whose status is in {PASSED, FAILED, CONDITIONAL, SUPERSEDED, CANCELLED}
        constraints: ">= 1"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: start of the booked bay interval, treated as inclusive
        constraints: ISO 8601 UTC, three fractional digits
      - name: scheduled_end_at
        type: datetime
        source: input
        description: end of the booked bay interval, treated as exclusive
        constraints: strictly after scheduled_start_at
      - name: footprint_sf
        type: number
        source: computed
        description: snapshot of Skid.footprint_sf at scheduling time, used by the bay capacity check
      - name: duration_minutes
        type: integer
        source: computed
        description: whole minutes between scheduled_start_at and scheduled_end_at
      - name: status
        type: enum
        source: system
        description: run lifecycle state
        default: SCHEDULED
        constraints: "SCHEDULED | PASSED | FAILED | CONDITIONAL | CANCELLED | SUPERSEDED"
      - name: punchlist_item_count
        type: integer
        source: system
        description: punchlist items recorded by the witnessing QualityEngineer
        default: 0
      - name: witnessed_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityEngineer who recorded the result
        default: null
      - name: result_note
        type: string
        source: system
        description: witness note captured with the result
        default: null

  - name: OrEqualSubmittal
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project whose specification the submittal answers"
      - name: spec_section
        type: string
        source: input
        description: specification section the or-equal request is filed against
        constraints: non-empty
      - name: named_basis_of_design
        type: string
        source: input
        description: manufacturer named in the specification that this submittal claims equality with
        constraints: non-empty
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the ApplicationEngineer who created the submittal
      - name: status
        type: enum
        source: system
        description: submittal negotiation state
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | PRE_APPROVED | REJECTED"
      - name: revision_round
        type: integer
        source: system
        description: number of completed SUBMITTED to DRAFT revision loops
        default: 0
      - name: compliance_score
        type: number
        source: computed
        description: 100 minus weighted deviation penalty points; see calculations.or_equal_compliance_score
        default: 100
        constraints: "0 <= compliance_score <= 100, two decimal places"
      - name: open_fundamental_count
        type: integer
        source: computed
        description: count of child SpecDeviation rows with severity FUNDAMENTAL and disposition in {PENDING, REJECTED}
        default: 0
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the EngineerOfRecord who rendered the most recent decision
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent DRAFT to SUBMITTED transition
        default: null

  - name: SpecDeviation
    parent: OrEqualSubmittal
    common_fields: true
    fields:
      - name: or_equal_submittal_id
        type: string
        source: input
        description: "FK -> OrEqualSubmittal.id; submittal that declares this deviation"
      - name: spec_paragraph
        type: string
        source: input
        description: specification paragraph the offered product deviates from
        constraints: non-empty
      - name: severity
        type: enum
        source: input
        description: severity band that fixes the deviation's penalty weight
        constraints: "MINOR | MODERATE | MAJOR | FUNDAMENTAL"
      - name: description
        type: string
        source: input
        description: narrative of the deviation
        constraints: non-empty
      - name: disposition
        type: enum
        source: system
        description: engineer-of-record disposition of the deviation
        default: PENDING
        constraints: "PENDING | ACCEPTED | REJECTED | WITHDRAWN"
      - name: weighted_penalty_points
        type: number
        source: computed
        description: DEVIATION_WEIGHTS[severity] * DISPOSITION_MULTIPLIER[disposition] rounded to two decimal places
        constraints: ">= 0"
      - name: dispositioned_by_user_id
        type: string
        source: system
        description: X-User-ID of the EngineerOfRecord who dispositioned the deviation, null while PENDING
        default: null

  - name: PerformanceDemo
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project whose guarantee is being demonstrated"
      - name: skid_id
        type: string
        source: input
        description: "FK -> Skid.id; skid whose installed equipment is under demonstration"
      - name: round_no
        type: integer
        source: computed
        description: 1 plus the count of PerformanceDemo rows on this project whose result is in {PASSED, FAILED, CONDITIONAL_PASS}
        constraints: ">= 1"
      - name: window_start_at
        type: datetime
        source: input
        description: start of the demonstration window on the skid, treated as inclusive
        constraints: ISO 8601 UTC, three fractional digits
      - name: window_end_at
        type: datetime
        source: input
        description: end of the demonstration window on the skid, treated as inclusive
        constraints: strictly after window_start_at
      - name: readings
        type: array
        source: input
        description: array of objects "{ parameter, measured_value }"; may hold several rows per parameter
        constraints: non-empty array; parameter drawn from TreatmentObjective.parameter; measured_value >= 0
      - name: evaluation
        type: array
        source: computed
        description: per-objective array of objects "{ parameter, basis, limit_value, compared_value, margin_pct, passed }" from calculations.performance_guarantee_evaluation
        default: []
      - name: min_margin_pct
        type: number
        source: computed
        description: smallest margin_pct across the evaluation array, null until certification
        default: null
      - name: result
        type: enum
        source: system
        description: certification outcome
        default: PENDING
        constraints: "PENDING | PASSED | FAILED | CONDITIONAL_PASS"
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the CommissioningEngineer who recorded the readings
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityEngineer who certified the demonstration
        default: null

  - name: ServiceAgreement
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project the long-term service agreement covers"
      - name: term_months
        type: integer
        source: input
        description: agreement term in months; expiry uses pinned 30-day months
        constraints: ">= 12"
      - name: annual_fee_cents
        type: integer
        source: input
        description: annual service fee
        constraints: "> 0"
      - name: reserve_funded_cents
        type: integer
        source: input
        description: consumable and membrane replacement reserve funded at agreement creation
        constraints: "> 0"
      - name: membrane_installed_at
        type: datetime
        source: input
        description: installation instant of the membrane elements; the warranty-credit baseline
        constraints: ISO 8601 UTC, three fractional digits
      - name: reserve_committed_accrual_cents
        type: integer
        source: computed
        description: ACCRUAL variant commitment total; the variant that governs availability
        default: 0
      - name: reserve_committed_settled_cents
        type: integer
        source: computed
        description: SETTLED variant commitment total computed from invoiced cost, freight and warranty credit
        default: 0
      - name: reserve_available_cents
        type: integer
        source: computed
        description: reserve_funded_cents minus reserve_committed_accrual_cents; conserved by calculations.service_reserve_conservation
        default: 0
      - name: settlement_variance_cents
        type: integer
        source: computed
        description: reserve_committed_settled_cents minus reserve_committed_accrual_cents
        default: 0
      - name: status
        type: enum
        source: system
        description: agreement lifecycle state
        default: PENDING_ACTIVATION
        constraints: "PENDING_ACTIVATION | ACTIVE | SUSPENDED | EXPIRED"
      - name: activated_at
        type: datetime
        source: system
        description: logical-clock instant the agreement became ACTIVE
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: activated_at plus term_months * 30 days, null while PENDING_ACTIVATION
        default: null

  - name: ConsumableDraw
    parent: ServiceAgreement
    common_fields: false
    fields:
      - name: service_agreement_id
        type: string
        source: input
        description: "FK -> ServiceAgreement.id; agreement the draw is posted against"
      - name: reverses_draw_id
        type: string
        source: computed
        description: "FK -> ConsumableDraw.id; the draw this REVERSAL row compensates, null on forward draws"
        default: null
      - name: draw_type
        type: enum
        source: input
        description: kind of draw; REVERSAL rows are only ever minted by the reversal endpoint
        constraints: "CONSUMABLE | MEMBRANE_REPLACEMENT | REVERSAL"
      - name: item_code
        type: string
        source: input
        description: consumable or membrane element item code
        constraints: non-empty
      - name: quantity
        type: integer
        source: input
        description: number of units drawn; the >= 1 floor is a business rule, not a schema range, and is enforced by validations priority 59 (ERR_INVALID_DRAW_QUANTITY) rather than by the request schema
        constraints: "integer"
      - name: catalog_unit_cost_cents
        type: integer
        source: input
        description: catalog unit cost driving the ACCRUAL variant
        constraints: "> 0"
      - name: invoiced_unit_cost_cents
        type: integer
        source: input
        description: actual invoiced unit cost driving the SETTLED variant
        constraints: "> 0"
      - name: accrual_amount_cents
        type: integer
        source: computed
        description: ACCRUAL variant line amount from calculations.service_reserve_balance; negative on REVERSAL rows
      - name: settled_amount_cents
        type: integer
        source: computed
        description: SETTLED variant line amount from calculations.service_reserve_balance; negative on REVERSAL rows
      - name: warranty_credit_cents
        type: integer
        source: computed
        description: prorated membrane warranty credit netted out of the SETTLED line amount, 0 for non-membrane draws
        default: 0
      - name: posted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ContractsAdministrator who posted the draw

state_machines:
  - entity: Project
    initial_state: DRAFT
    terminal_states: [REMEDIATION, SERVICE_ACTIVE, CLOSED]
    transitions:
      - from: DRAFT
        to: SCOPED
        trigger: "POST /water-treatment/projects/{project_id}/process-selection"
        actor: ApplicationEngineer
        preconditions:
          - "project.status == DRAFT"
          - "at least one InfluentProfile with project_id == project.id and qa_status == ACCEPTED exists"
          - "at least one TreatmentObjective with project_id == project.id and status == ACTIVE exists"
        side_effects:
          - "run calculations.governing_influent_profile_selection and write Project.governing_influent_profile_id"
          - "run calculations.process_train_selection: create one TreatmentStage per required role in STAGE_ORDER, each with status SELECTED, stage_index, role, technology_id, design_flow_mgd, evaluated_cost_cents, equipment_base_cost_cents and upstream_stage_id linked to the previously created stage"
          - "recompute Project.delivery_posture (calculations.project_delivery_posture)"
          - "increments Project.version by 1"
      - from: SCOPED
        to: SCOPED
        trigger: "POST /water-treatment/projects/{project_id}/process-selection (re-run after influent or objective change)"
        actor: ApplicationEngineer
        preconditions:
          - "project.status == SCOPED"
          - "no EquipmentPackage on any TreatmentStage of this project has status in {RELEASED_FOR_FAB, REWORK_HOLD, FAT_PASSED, SHIPPED}"
        side_effects:
          - "every TreatmentStage with project_id == project.id and status in {SELECTED, ENGINEERED} transitions to SUPERSEDED"
          - "each EquipmentPackage whose treatment_stage_id now points at a SUPERSEDED stage keeps its own status; its stage precondition then blocks further review transitions"
          - "a fresh set of TreatmentStage rows is created exactly as in the DRAFT to SCOPED transition"
          - "Project.governing_influent_profile_id re-selected"
          - "increments Project.version by 1"
        note: "self-loop; the re-run is the cyclic edge that supersedes an already-selected train"
      - from: SCOPED
        to: BID_READY
        trigger: "POST /water-treatment/or-equal-submittals/{submittal_id}/engineer-decision with decision == PRE_APPROVED"
        actor: system
        preconditions:
          - "project.status in {SCOPED, BID_BLOCKED}"
          - "the submittal reaching PRE_APPROVED belongs to this project"
        side_effects:
          - "increments Project.version by 1"
      - from: BID_BLOCKED
        to: BID_READY
        trigger: "POST /water-treatment/or-equal-submittals/{submittal_id}/engineer-decision with decision == PRE_APPROVED on a later submittal"
        actor: system
        preconditions:
          - "project.status == BID_BLOCKED"
        side_effects:
          - "increments Project.version by 1"
        note: "recovery edge; the project may cycle SCOPED -> BID_BLOCKED -> BID_READY across submittal rounds"
      - from: SCOPED
        to: BID_BLOCKED
        trigger: "POST /water-treatment/or-equal-submittals/{submittal_id}/engineer-decision with decision == REJECTED"
        actor: system
        preconditions:
          - "project.status in {SCOPED, BID_READY}"
          - "the submittal reaching REJECTED belongs to this project"
          - "no other OrEqualSubmittal of this project has status PRE_APPROVED"
        side_effects:
          - "cascade link 3 of the submittal-rejection chain; see state_machines.OrEqualSubmittal SUBMITTED_to_REJECTED"
          - "increments Project.version by 1"
      - from: BID_READY
        to: BID_SUBMITTED
        trigger: "POST /water-treatment/projects/{project_id}/bid"
        actor: ContractsAdministrator
        preconditions:
          - "project.status == BID_READY"
          - "logical clock now < project.bid_due_at"
          - "every TreatmentStage with status SELECTED or ENGINEERED has exactly one EquipmentPackage with status in {APPROVED, RELEASED_FOR_FAB, FAT_PASSED, SHIPPED} and firm_cost_cents > 0"
          - "at least one OrEqualSubmittal of this project has status PRE_APPROVED"
          - "X-User-ID differs from that submittal's authored_by_user_id"
          - "offered_price_cents * 10000 >= evaluated_bid_price_cents * 10800"
        side_effects:
          - "run calculations.bid_evaluated_price and write base_bid_amount_cents, bond_premium_cents, contingency_cents, evaluated_bid_price_cents"
          - "write offered_price_cents from the request body"
          - "increments Project.version by 1"
      - from: BID_SUBMITTED
        to: AWARDED
        trigger: "POST /water-treatment/projects/{project_id}/award with award_decision == AWARDED"
        actor: ContractsAdministrator
        preconditions:
          - "project.status == BID_SUBMITTED"
        side_effects:
          - "write Project.contract_amount_cents = Project.offered_price_cents"
          - "write Project.awarded_at = logical clock now"
          - "increments Project.version by 1"
      - from: BID_SUBMITTED
        to: CLOSED
        trigger: "POST /water-treatment/projects/{project_id}/award with award_decision == NOT_AWARDED"
        actor: ContractsAdministrator
        preconditions:
          - "project.status == BID_SUBMITTED"
        side_effects:
          - "every OrEqualSubmittal of the project with status in {DRAFT, SUBMITTED} transitions to REJECTED"
          - "increments Project.version by 1"
      - from: AWARDED
        to: IN_FABRICATION
        trigger: "POST /water-treatment/equipment-packages/{package_id}/release-for-fabrication (first release on the project)"
        actor: system
        preconditions:
          - "project.status == AWARDED"
        side_effects:
          - "recompute Project.delivery_posture"
          - "increments Project.version by 1"
      - from: IN_FABRICATION
        to: COMMISSIONING
        trigger: "POST /water-treatment/fat-runs/{run_id}/witness-result with result == PASS (last outstanding package)"
        actor: system
        preconditions:
          - "project.status == IN_FABRICATION"
          - "after this transition every EquipmentPackage on a non-SUPERSEDED TreatmentStage of the project has status in {FAT_PASSED, SHIPPED}"
        side_effects:
          - "recompute Project.delivery_posture"
          - "increments Project.version by 1"
      - from: COMMISSIONING
        to: GUARANTEED
        trigger: "POST /water-treatment/performance-demos/{demo_id}/certify with certification == PASS"
        actor: system
        preconditions:
          - "project.status == COMMISSIONING"
          - "calculations.performance_guarantee_evaluation yields result PASSED"
        side_effects:
          - "write Project.guarantee_status = MET"
          - "cascade: every ServiceAgreement of this project with status PENDING_ACTIVATION transitions to ACTIVE"
          - "increments Project.version by 1"
      - from: GUARANTEED
        to: SERVICE_ACTIVE
        trigger: "system, immediately after a ServiceAgreement of this project reaches ACTIVE"
        actor: system
        preconditions:
          - "project.status == GUARANTEED"
          - "at least one ServiceAgreement of this project has status ACTIVE"
        side_effects:
          - "increments Project.version by 1"
        note: "cascade link 4 of the certify-PASS chain; also fires when a ServiceAgreement is created while the project already sits in GUARANTEED"
      - from: COMMISSIONING
        to: REMEDIATION
        trigger: "POST /water-treatment/performance-demos/{demo_id}/certify (final round failure)"
        actor: system
        preconditions:
          - "project.status == COMMISSIONING"
          - "demo.round_no == MAX_DEMO_ROUNDS"
          - "calculations.performance_guarantee_evaluation yields result FAILED or CONDITIONAL_PASS"
        side_effects:
          - "write Project.guarantee_status = DEFAULTED"
          - "run calculations.liquidated_damages and write Project.liquidated_damages_cents"
          - "recompute Project.delivery_posture (becomes AT_RISK or HELD)"
          - "increments Project.version by 1"

  - entity: InfluentProfile
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /water-treatment/influent-profiles/{profile_id}/qa-decision with decision == ACCEPT"
        actor: QualityEngineer
        preconditions:
          - "profile.qa_status == SUBMITTED"
        side_effects:
          - "write qa_decided_by_user_id and qa_note"
          - "if the owning Project.status == SCOPED, re-run calculations.governing_influent_profile_selection and rewrite Project.governing_influent_profile_id (the train itself is NOT rebuilt until process-selection is re-run)"
          - "increments InfluentProfile.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /water-treatment/influent-profiles/{profile_id}/qa-decision with decision == REJECT"
        actor: QualityEngineer
        preconditions:
          - "profile.qa_status == SUBMITTED"
        side_effects:
          - "write qa_decided_by_user_id and qa_note"
          - "if this profile is the Project.governing_influent_profile_id, re-run the selection over the remaining ACCEPTED profiles; when none remain, write Project.governing_influent_profile_id = null"
          - "increments InfluentProfile.version by 1"

  - entity: TreatmentObjective
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /water-treatment/projects/{project_id}/treatment-objectives (a newer objective for the same parameter)"
        actor: system
        preconditions:
          - "an incoming objective declares the same project_id and parameter"
        side_effects:
          - "increments TreatmentObjective.version by 1"
        note: "at most one ACTIVE objective per (project_id, parameter) pair"

  - entity: TreatmentStage
    initial_state: SELECTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SELECTED
        to: ENGINEERED
        trigger: "POST /water-treatment/equipment-packages/{package_id}/review-decision with decision == APPROVE"
        actor: system
        preconditions:
          - "stage.status == SELECTED"
          - "the approved package's treatment_stage_id == stage.id"
        side_effects:
          - "increments TreatmentStage.version by 1"
      - from: SELECTED
        to: SUPERSEDED
        trigger: "POST /water-treatment/projects/{project_id}/process-selection (re-run)"
        actor: system
        preconditions:
          - "stage.status == SELECTED"
        side_effects:
          - "increments TreatmentStage.version by 1"
      - from: ENGINEERED
        to: SUPERSEDED
        trigger: "POST /water-treatment/projects/{project_id}/process-selection (re-run)"
        actor: system
        preconditions:
          - "stage.status == ENGINEERED"
          - "no EquipmentPackage on this stage has status in {RELEASED_FOR_FAB, REWORK_HOLD, FAT_PASSED, SHIPPED}"
        side_effects:
          - "increments TreatmentStage.version by 1"

  - entity: EquipmentPackage
    initial_state: DRAFT
    terminal_states: [SHIPPED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /water-treatment/equipment-packages/{package_id}/submit-for-review"
        actor: ApplicationEngineer
        preconditions:
          - "package.status == DRAFT"
          - "the parent TreatmentStage.status == SELECTED or ENGINEERED (a SUPERSEDED stage rejects the submission)"
          - "material screening in validations priorities 14-16 passes"
        side_effects:
          - "run calculations.equipment_package_cost variant BUDGETARY and write budgetary_cost_cents"
          - "increments EquipmentPackage.version by 1"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /water-treatment/equipment-packages/{package_id}/review-decision with decision == REQUEST_REVISION"
        actor: DesignReviewer
        preconditions:
          - "package.status == IN_REVIEW"
          - "X-User-ID != package.designed_by_user_id"
        side_effects:
          - "increment revision_round by 1"
          - "write reviewed_by_user_id"
          - "increments EquipmentPackage.version by 1"
        note: "revision cycle edge; the package may loop DRAFT -> IN_REVIEW -> DRAFT any number of times"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /water-treatment/equipment-packages/{package_id}/review-decision with decision == APPROVE"
        actor: DesignReviewer
        preconditions:
          - "package.status == IN_REVIEW"
          - "X-User-ID != package.designed_by_user_id"
        side_effects:
          - "write reviewed_by_user_id and approved_at = logical clock now"
          - "run calculations.equipment_package_cost variant FIRM and write firm_cost_cents, cost_variance_pct, variance_flag"
          - "cascade: the parent TreatmentStage transitions SELECTED -> ENGINEERED"
          - "if variance_flag becomes true, recompute Project.delivery_posture to AT_RISK"
          - "increments EquipmentPackage.version by 1"
      - from: APPROVED
        to: RELEASED_FOR_FAB
        trigger: "POST /water-treatment/equipment-packages/{package_id}/release-for-fabrication"
        actor: FabricationManager
        preconditions:
          - "package.status == APPROVED"
          - "the owning Project.status in {AWARDED, IN_FABRICATION}"
          - "the parent TreatmentStage.status == ENGINEERED"
        side_effects:
          - "write released_at = logical clock now"
          - "create one Skid with mechanical_status FRAME_SET, controls_status PANEL_BUILD, fat_readiness NOT_READY, footprint_sf and requires_exclusive_bay snapshotted"
          - "if the owning Project.status == AWARDED it transitions to IN_FABRICATION"
          - "increments EquipmentPackage.version by 1"
      - from: RELEASED_FOR_FAB
        to: REWORK_HOLD
        trigger: "POST /water-treatment/fat-runs/{run_id}/witness-result with result == FAIL"
        actor: system
        preconditions:
          - "package.status == RELEASED_FOR_FAB"
          - "the failing FatRun's skid belongs to this package"
        side_effects:
          - "cascade link 2 of the FAT-failure chain; see state_machines.Skid MECH_COMPLETE_to_REWORK"
          - "recompute Project.delivery_posture to HELD (cascade link 3)"
          - "increments EquipmentPackage.version by 1"
      - from: REWORK_HOLD
        to: RELEASED_FOR_FAB
        trigger: "POST /water-treatment/skids/{skid_id}/milestones with dimension == MECHANICAL and to_state == MECH_COMPLETE"
        actor: system
        preconditions:
          - "package.status == REWORK_HOLD"
          - "the skid's mechanical_status reaches MECH_COMPLETE again"
        side_effects:
          - "recompute Project.delivery_posture"
          - "increments EquipmentPackage.version by 1"
        note: "rework cycle edge; RELEASED_FOR_FAB -> REWORK_HOLD -> RELEASED_FOR_FAB may repeat"
      - from: RELEASED_FOR_FAB
        to: FAT_PASSED
        trigger: "POST /water-treatment/fat-runs/{run_id}/witness-result with result == PASS"
        actor: system
        preconditions:
          - "package.status == RELEASED_FOR_FAB"
        side_effects:
          - "if every EquipmentPackage on a non-SUPERSEDED stage of the project is now in {FAT_PASSED, SHIPPED}, the Project transitions IN_FABRICATION -> COMMISSIONING"
          - "increments EquipmentPackage.version by 1"
      - from: FAT_PASSED
        to: SHIPPED
        trigger: "POST /water-treatment/performance-demos (a demo is recorded against this package's skid)"
        actor: system
        preconditions:
          - "package.status == FAT_PASSED"
        side_effects:
          - "increments EquipmentPackage.version by 1"
        note: "recording field readings implies the skid shipped and was installed"

  - entity: Skid
    initial_state: "FRAME_SET x PANEL_BUILD"
    terminal_states: []
    transitions:
      - from: FRAME_SET
        to: PIPING_COMPLETE
        trigger: "POST /water-treatment/skids/{skid_id}/milestones with dimension == MECHANICAL and to_state == PIPING_COMPLETE"
        actor: FabricationManager
        preconditions:
          - "skid.mechanical_status == FRAME_SET or skid.mechanical_status == REWORK"
        side_effects:
          - "recompute skid.fat_readiness"
          - "increments Skid.version by 1"
        note: "mechanical dimension only; controls_status is untouched"
      - from: PIPING_COMPLETE
        to: HYDROTEST_PASSED
        trigger: "POST /water-treatment/skids/{skid_id}/milestones with dimension == MECHANICAL and to_state == HYDROTEST_PASSED"
        actor: FabricationManager
        preconditions:
          - "skid.mechanical_status == PIPING_COMPLETE"
        side_effects:
          - "recompute skid.fat_readiness"
          - "increments Skid.version by 1"
      - from: HYDROTEST_PASSED
        to: MECH_COMPLETE
        trigger: "POST /water-treatment/skids/{skid_id}/milestones with dimension == MECHANICAL and to_state == MECH_COMPLETE"
        actor: FabricationManager
        preconditions:
          - "skid.mechanical_status == HYDROTEST_PASSED"
        side_effects:
          - "recompute skid.fat_readiness (READY once controls_status == CONTROLS_COMPLETE and package.status == RELEASED_FOR_FAB)"
          - "if the parent EquipmentPackage.status == REWORK_HOLD it transitions back to RELEASED_FOR_FAB"
          - "increments Skid.version by 1"
      - from: MECH_COMPLETE
        to: REWORK
        trigger: "POST /water-treatment/fat-runs/{run_id}/witness-result with result == FAIL"
        actor: system
        preconditions:
          - "skid.mechanical_status == MECH_COMPLETE"
          - "the failing FatRun.skid_id == skid.id"
        side_effects:
          - "increment rework_count by 1"
          - "recompute skid.fat_readiness to BLOCKED"
          - "cascade link 2: the parent EquipmentPackage transitions RELEASED_FOR_FAB -> REWORK_HOLD"
          - "increments Skid.version by 1"
        note: "cascade link 1 of the FAT-failure chain; mechanical dimension reverts while controls_status is preserved"
      - from: PANEL_BUILD
        to: IO_CHECKED
        trigger: "POST /water-treatment/skids/{skid_id}/milestones with dimension == CONTROLS and to_state == IO_CHECKED"
        actor: FabricationManager
        preconditions:
          - "skid.controls_status == PANEL_BUILD"
        side_effects:
          - "recompute skid.fat_readiness"
          - "increments Skid.version by 1"
        note: "controls dimension only; mechanical_status is untouched"
      - from: IO_CHECKED
        to: LOOP_TESTED
        trigger: "POST /water-treatment/skids/{skid_id}/milestones with dimension == CONTROLS and to_state == LOOP_TESTED"
        actor: FabricationManager
        preconditions:
          - "skid.controls_status == IO_CHECKED"
        side_effects:
          - "recompute skid.fat_readiness"
          - "increments Skid.version by 1"
      - from: LOOP_TESTED
        to: CONTROLS_COMPLETE
        trigger: "POST /water-treatment/skids/{skid_id}/milestones with dimension == CONTROLS and to_state == CONTROLS_COMPLETE"
        actor: FabricationManager
        preconditions:
          - "skid.controls_status == LOOP_TESTED"
        side_effects:
          - "recompute skid.fat_readiness (READY once mechanical_status == MECH_COMPLETE and package.status == RELEASED_FOR_FAB)"
          - "increments Skid.version by 1"

  - entity: FatRun
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CONDITIONAL, CANCELLED, SUPERSEDED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /water-treatment/fat-runs/{run_id}/witness-result with result == PASS"
        actor: QualityEngineer
        preconditions:
          - "run.status == SCHEDULED"
          - "the skid's fat_readiness == READY"
          - "X-User-ID != the skid's package designed_by_user_id"
          - "punchlist_item_count <= MAX_PASS_PUNCHLIST_ITEMS (3); a larger count downgrades the outcome to CONDITIONAL rather than rejecting the request"
        side_effects:
          - "write witnessed_by_user_id, punchlist_item_count and result_note"
          - "release the bay reservation: TestBay.reserved_footprint_minutes -= run.footprint_sf * run.duration_minutes"
          - "the parent EquipmentPackage transitions RELEASED_FOR_FAB -> FAT_PASSED"
          - "increments FatRun.version by 1"
      - from: SCHEDULED
        to: CONDITIONAL
        trigger: "POST /water-treatment/fat-runs/{run_id}/witness-result with result == CONDITIONAL, or with result == PASS and punchlist_item_count > MAX_PASS_PUNCHLIST_ITEMS (calculations.skid_fat_readiness)"
        actor: QualityEngineer
        preconditions:
          - "run.status == SCHEDULED"
          - "the skid's fat_readiness == READY"
          - "X-User-ID != the skid's package designed_by_user_id"
        side_effects:
          - "write witnessed_by_user_id, punchlist_item_count and result_note"
          - "release the bay reservation: TestBay.reserved_footprint_minutes -= run.footprint_sf * run.duration_minutes"
          - "the parent EquipmentPackage keeps status RELEASED_FOR_FAB; recompute Project.delivery_posture to AT_RISK"
          - "increments FatRun.version by 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /water-treatment/fat-runs/{run_id}/witness-result with result == FAIL"
        actor: QualityEngineer
        preconditions:
          - "run.status == SCHEDULED"
          - "the skid's fat_readiness == READY"
          - "X-User-ID != the skid's package designed_by_user_id"
        side_effects:
          - "write witnessed_by_user_id, punchlist_item_count and result_note"
          - "release the bay reservation: TestBay.reserved_footprint_minutes -= run.footprint_sf * run.duration_minutes"
          - "cascade link 1: the Skid transitions mechanical_status MECH_COMPLETE -> REWORK and rework_count increments"
          - "increments FatRun.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /water-treatment/fat-runs/{run_id}/cancel"
        actor: FabricationManager
        preconditions:
          - "run.status == SCHEDULED"
        side_effects:
          - "release the bay reservation: TestBay.reserved_footprint_minutes -= run.footprint_sf * run.duration_minutes, restoring the pre-scheduling value exactly"
          - "increments FatRun.version by 1"
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "POST /water-treatment/fat-runs (a newer run is scheduled for the same skid)"
        actor: system
        preconditions:
          - "run.status == SCHEDULED"
          - "a new FatRun is accepted with the same skid_id"
        side_effects:
          - "release the bay reservation: TestBay.reserved_footprint_minutes -= run.footprint_sf * run.duration_minutes"
          - "increments FatRun.version by 1"
        note: "the retest legitimately supersedes the outstanding run; this is why POST /fat-runs is guarded by OCC on Skid.version"

  - entity: OrEqualSubmittal
    initial_state: DRAFT
    terminal_states: [PRE_APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /water-treatment/or-equal-submittals/{submittal_id}/submit"
        actor: ApplicationEngineer
        preconditions:
          - "submittal.status == DRAFT"
          - "at least one SpecDeviation child exists"
          - "submittal.compliance_score >= MIN_COMPLIANCE_SCORE"
          - "the owning Project.status in {SCOPED, BID_BLOCKED}"
          - "logical clock now < project.bid_due_at"
        side_effects:
          - "write submitted_at = logical clock now"
          - "increments OrEqualSubmittal.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /water-treatment/or-equal-submittals/{submittal_id}/engineer-decision with decision == REQUEST_REVISION"
        actor: EngineerOfRecord
        preconditions:
          - "submittal.status == SUBMITTED"
        side_effects:
          - "increment revision_round by 1"
          - "write decided_by_user_id"
          - "every child SpecDeviation with disposition == PENDING and severity == FUNDAMENTAL is dispositioned REJECTED; recompute compliance_score and open_fundamental_count"
          - "increments OrEqualSubmittal.version by 1"
        note: "negotiation cycle edge; DRAFT -> SUBMITTED -> DRAFT may repeat"
      - from: SUBMITTED
        to: PRE_APPROVED
        trigger: "POST /water-treatment/or-equal-submittals/{submittal_id}/engineer-decision with decision == PRE_APPROVED"
        actor: EngineerOfRecord
        preconditions:
          - "submittal.status == SUBMITTED"
          - "submittal.open_fundamental_count == 0"
          - "submittal.compliance_score >= MIN_COMPLIANCE_SCORE"
        side_effects:
          - "write decided_by_user_id"
          - "every child SpecDeviation with disposition == PENDING is dispositioned ACCEPTED; recompute compliance_score"
          - "the owning Project transitions SCOPED -> BID_READY or BID_BLOCKED -> BID_READY"
          - "increments OrEqualSubmittal.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /water-treatment/or-equal-submittals/{submittal_id}/engineer-decision with decision == REJECTED"
        actor: EngineerOfRecord
        preconditions:
          - "submittal.status == SUBMITTED"
        side_effects:
          - "write decided_by_user_id"
          - "cascade link 1: every child SpecDeviation with disposition == PENDING transitions to WITHDRAWN"
          - "cascade link 2: because those deviations are now WITHDRAWN their weighted_penalty_points collapse to 0.00, so calculations.or_equal_compliance_score is re-run and compliance_score rises while open_fundamental_count drops"
          - "cascade link 3: because the submittal is REJECTED the project loses its only pre-approval path, so the owning Project transitions to BID_BLOCKED"
          - "increments OrEqualSubmittal.version by 1"
        note: "depth-3 cascade rooted at a single engineer decision; each link is caused by the previous link"

  - entity: SpecDeviation
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /water-treatment/spec-deviations/{deviation_id}/disposition with disposition == ACCEPTED"
        actor: EngineerOfRecord
        preconditions:
          - "deviation.disposition == PENDING"
          - "the parent OrEqualSubmittal.status == SUBMITTED"
        side_effects:
          - "write dispositioned_by_user_id and weighted_penalty_points"
          - "recompute parent compliance_score and open_fundamental_count"
          - "increments SpecDeviation.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /water-treatment/spec-deviations/{deviation_id}/disposition with disposition == REJECTED"
        actor: EngineerOfRecord
        preconditions:
          - "deviation.disposition == PENDING"
          - "the parent OrEqualSubmittal.status == SUBMITTED"
        side_effects:
          - "write dispositioned_by_user_id and weighted_penalty_points"
          - "recompute parent compliance_score and open_fundamental_count"
          - "increments SpecDeviation.version by 1"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /water-treatment/spec-deviations/{deviation_id}/disposition with disposition == WITHDRAWN, or the submittal-rejection cascade"
        actor: EngineerOfRecord
        preconditions:
          - "deviation.disposition == PENDING"
        side_effects:
          - "write weighted_penalty_points = 0.00"
          - "recompute parent compliance_score and open_fundamental_count"
          - "increments SpecDeviation.version by 1"

  - entity: PerformanceDemo
    initial_state: PENDING
    terminal_states: [PASSED, FAILED, CONDITIONAL_PASS]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /water-treatment/performance-demos/{demo_id}/certify with certification == PASS"
        actor: QualityEngineer
        preconditions:
          - "demo.result == PENDING"
          - "X-User-ID != demo.recorded_by_user_id"
          - "calculations.performance_guarantee_evaluation yields PASSED for the recorded readings"
        side_effects:
          - "write evaluation, min_margin_pct and certified_by_user_id"
          - "the owning Project transitions COMMISSIONING -> GUARANTEED with guarantee_status MET"
          - "increments PerformanceDemo.version by 1"
      - from: PENDING
        to: CONDITIONAL_PASS
        trigger: "POST /water-treatment/performance-demos/{demo_id}/certify with certification == PASS"
        actor: QualityEngineer
        preconditions:
          - "demo.result == PENDING"
          - "X-User-ID != demo.recorded_by_user_id"
          - "every objective is met but the smallest margin_pct < GUARANTEE_MARGIN_PCT"
        side_effects:
          - "write evaluation, min_margin_pct and certified_by_user_id"
          - "recompute Project.delivery_posture to AT_RISK"
          - "if demo.round_no == MAX_DEMO_ROUNDS the Project transitions COMMISSIONING -> REMEDIATION with guarantee_status DEFAULTED and liquidated damages accrued"
          - "increments PerformanceDemo.version by 1"
      - from: PENDING
        to: FAILED
        trigger: "POST /water-treatment/performance-demos/{demo_id}/certify with certification == PASS or FAIL"
        actor: QualityEngineer
        preconditions:
          - "demo.result == PENDING"
          - "X-User-ID != demo.recorded_by_user_id"
          - "at least one ACTIVE objective is not met, or the witness explicitly certifies FAIL"
        side_effects:
          - "write evaluation, min_margin_pct and certified_by_user_id"
          - "recompute Project.delivery_posture to AT_RISK"
          - "if demo.round_no == MAX_DEMO_ROUNDS the Project transitions COMMISSIONING -> REMEDIATION with guarantee_status DEFAULTED and liquidated damages accrued; otherwise Project.guarantee_status stays DEMONSTRATING and a retest round is permitted"
          - "increments PerformanceDemo.version by 1"

  - entity: ServiceAgreement
    initial_state: PENDING_ACTIVATION
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /water-treatment/performance-demos/{demo_id}/certify with certification == PASS (cascade), or POST /water-treatment/projects/{project_id}/service-agreements when the project already sits in GUARANTEED"
        actor: system
        preconditions:
          - "agreement.status == PENDING_ACTIVATION"
          - "the owning Project.status == GUARANTEED"
        side_effects:
          - "write activated_at = logical clock now and expires_at = activated_at + term_months * 30 days"
          - "write reserve_available_cents = reserve_funded_cents - reserve_committed_accrual_cents"
          - "cascade link 4: the owning Project transitions GUARANTEED -> SERVICE_ACTIVE"
          - "increments ServiceAgreement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /water-treatment/service-agreements/{agreement_id}/consumable-draws (the draw that exhausts the reserve)"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
          - "reserve_available_cents becomes exactly 0 after the draw"
        side_effects:
          - "increments ServiceAgreement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /water-treatment/consumable-draws/{draw_id}/reversal"
        actor: system
        preconditions:
          - "agreement.status == SUSPENDED"
          - "reserve_available_cents becomes > 0 after the reversal"
        side_effects:
          - "increments ServiceAgreement.version by 1"
        note: "suspension cycle edge; ACTIVE -> SUSPENDED -> ACTIVE may repeat"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /water-treatment/service-agreements/{agreement_id}/consumable-draws attempted at or after expires_at"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
          - "logical clock now >= agreement.expires_at"
        side_effects:
          - "the status change is persisted and the triggering draw is refused with ERR_AGREEMENT_EXPIRED; no ConsumableDraw row is created and reserve totals are untouched"
          - "increments ServiceAgreement.version by 1"
        note: "lazy expiry sweep evaluated before any other draw check other than authentication, authorization and existence"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "POST /water-treatment/service-agreements/{agreement_id}/consumable-draws attempted at or after expires_at"
        actor: system
        preconditions:
          - "agreement.status == SUSPENDED"
          - "logical clock now >= agreement.expires_at"
        side_effects:
          - "the status change is persisted and the triggering draw is refused with ERR_AGREEMENT_EXPIRED"
          - "increments ServiceAgreement.version by 1"

concurrency_rules:
  - rule_id: fat-run-schedule-stale-skid
    parent_entity: Skid
    write_endpoint: "POST /water-treatment/fat-runs"
    occ_field: "expected_skid_version"
    description: |
      Scheduling a FatRun against a Skid whose version has advanced since the
      client last read it is refused with a stale-version error. The rule exists
      because a newly accepted run legitimately supersedes the skid's
      outstanding SCHEDULED run and releases its bay footprint-minutes, so a
      writer holding an out-of-date view of the skid would silently cancel a
      booking it never saw.
    error_id: ERR_STALE_SKID_VERSION
    http_status: 412

  - rule_id: consumable-draw-stale-agreement
    parent_entity: ServiceAgreement
    write_endpoint: "POST /water-treatment/service-agreements/{agreement_id}/consumable-draws"
    occ_field: "expected_service_agreement_version"
    description: |
      Posting a consumable or membrane draw against a ServiceAgreement whose
      version has advanced since the client last read it is refused with a
      stale-version error. Each accepted draw legitimately reduces
      reserve_available_cents, so a writer working from an out-of-date reserve
      balance would overdraw a reserve it believes is still full.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

  - rule_id: spec-deviation-stale-submittal
    parent_entity: OrEqualSubmittal
    write_endpoint: "POST /water-treatment/or-equal-submittals/{submittal_id}/spec-deviations"
    occ_field: "expected_or_equal_submittal_version"
    description: |
      Adding a SpecDeviation to an OrEqualSubmittal whose version has advanced
      since the client last read it is refused with a stale-version error. Every
      accepted deviation legitimately lowers compliance_score, so a writer
      holding an out-of-date score would push the submittal below
      MIN_COMPLIANCE_SCORE without having observed the penalty it is adding to.
    error_id: ERR_STALE_SUBMITTAL_VERSION
    http_status: 412

calculations:
  - name: governing_influent_profile_selection
    trigger: "on POST /water-treatment/projects/{project_id}/process-selection, and again on every POST /water-treatment/influent-profiles/{profile_id}/qa-decision once the project has reached SCOPED"
    algorithm: selector_policy
    formula: |
      candidates = [p for p in InfluentProfile
                    if p.project_id == project.id and p.qa_status == 'ACCEPTED']
      if candidates is empty:
          if project.status == 'DRAFT': raise ERR_NO_ACCEPTED_INFLUENT_PROFILE   # 422
          else: project.governing_influent_profile_id = null                     # re-selection after a rejection
      else:
          # rank: worst-case hydraulic load first
          winner = min(candidates, key=lambda p: (-p.design_flow_mgd, p.created_at))
          project.governing_influent_profile_id = winner.id
    input_set: "InfluentProfile rows of this project with qa_status == ACCEPTED; SUBMITTED and REJECTED rows are excluded"
    constants: {}
    precision: "design_flow_mgd compared at three decimal places"
    variants:
      - name: eligibility_filter
        when: "always"
        difference: "candidate set is exactly qa_status == ACCEPTED; there is no fallback to SUBMITTED samples"
      - name: ranking_and_tie_break
        when: "two or more ACCEPTED profiles share the same design_flow_mgd"
        difference: "primary key is design_flow_mgd DESC; the tie-break is created_at ASC (earliest accepted sample wins). Entity id is never a decision input."

  - name: stage_design_flow
    trigger: "inside calculations.process_train_selection, once per required stage role"
    algorithm: threshold
    formula: |
      PEAK_ROLES = {'FILTRATION', 'DISINFECTION'}
      if role in PEAK_ROLES:
          design_flow_mgd = round_half_up(profile.design_flow_mgd * profile.peak_factor, 3)
      else:
          design_flow_mgd = round_half_up(profile.design_flow_mgd, 3)
    input_set: "the governing InfluentProfile only"
    constants:
      PEAK_ROLES: [FILTRATION, DISINFECTION]
    precision: "3 decimal places, round_half_up"
    variants:
      - name: hydraulic_peak
        when: "role is FILTRATION or DISINFECTION"
        difference: "sized on peak flow (design_flow_mgd * peak_factor)"
      - name: average_day
        when: "role is BIOLOGICAL or DESALINATION"
        difference: "sized on average design flow; peak_factor is ignored"

  - name: process_train_selection
    trigger: "on POST /water-treatment/projects/{project_id}/process-selection"
    algorithm: constraint_propagation
    formula: |
      required_roles = { OBJECTIVE_ROLE_MAP[o.parameter]
                         for o in TreatmentObjective
                         if o.project_id == project.id and o.status == 'ACTIVE' }
      if required_roles is empty: raise ERR_NO_TREATMENT_OBJECTIVES          # 422
      ordered_roles = [r for r in STAGE_ORDER if r in required_roles]         # pinned train order

      previous_stage_id = null
      for stage_index, role in enumerate(ordered_roles, start=1):
          flow = stage_design_flow(role, governing_profile)
          candidates = [t for t in ProcessTechnology
                        if t.role == role
                        and t.status == 'ACTIVE'
                        and t.max_feed_turbidity_ntu >= governing_profile.turbidity_ntu
                        and t.max_feed_tds_mg_l      >= governing_profile.tds_mg_l
                        and t.min_design_flow_mgd    <= flow
                        and t.max_design_flow_mgd    >= flow]
          if candidates is empty: raise ERR_NO_ELIGIBLE_TECHNOLOGY            # 422

          for t in candidates:
              capex_cents  = ceil(t.unit_capex_cents_per_mgd * flow)
              energy_cents = LIFECYCLE_YEARS * ceil(t.energy_kwh_per_mg * flow * 365
                                                    * ENERGY_COST_CENTS_PER_KWH)
              excess_sf    = max(0.0, round_half_up(t.footprint_sf_per_mgd * flow, 3)
                                       - project.footprint_allowance_sf_per_stage)
              penalty_cents = ceil(excess_sf * FOOTPRINT_PENALTY_CENTS_PER_SF)
              t.evaluated_cost_cents = capex_cents + energy_cents + penalty_cents
              t.capex_cents = capex_cents

          winner = min(candidates, key=lambda t: (t.evaluated_cost_cents,
                                                  t.footprint_sf_per_mgd,
                                                  t.created_at))
          stage = TreatmentStage(project_id=project.id,
                                 technology_id=winner.id,
                                 upstream_stage_id=previous_stage_id,
                                 role=role,
                                 stage_index=stage_index,
                                 design_flow_mgd=flow,
                                 evaluated_cost_cents=winner.evaluated_cost_cents,
                                 equipment_base_cost_cents=winner.capex_cents,
                                 status='SELECTED')
          previous_stage_id = stage.id
    input_set: "TreatmentObjective rows of this project with status == ACTIVE; ProcessTechnology rows with status == ACTIVE only"
    constants:
      LIFECYCLE_YEARS: 20
      ENERGY_COST_CENTS_PER_KWH: 12
      FOOTPRINT_PENALTY_CENTS_PER_SF: 45000
      STAGE_ORDER: [BIOLOGICAL, FILTRATION, DESALINATION, DISINFECTION]
      OBJECTIVE_ROLE_MAP:
        TURBIDITY_NTU: FILTRATION
        TOC_MG_L: FILTRATION
        TDS_MG_L: DESALINATION
        CHLORIDE_MG_L: DESALINATION
        ECOLI_CFU_100ML: DISINFECTION
        GIARDIA_LOG_REMOVAL: DISINFECTION
        BOD5_MG_L: BIOLOGICAL
        AMMONIA_N_MG_L: BIOLOGICAL
    precision: "all money in whole cents; every intermediate cost term is ceil-ed to whole cents before summation"
    variants:
      - name: eligibility_filter
        when: "always"
        difference: "five simultaneous predicates (role, status ACTIVE, feed turbidity ceiling, feed TDS ceiling, flow window inclusive on both ends) define the candidate pool; DEPRECATED technologies never enter it"
      - name: ranking_and_tie_break
        when: "two candidates evaluate to the same evaluated_cost_cents"
        difference: "sort key is evaluated_cost_cents ASC, then footprint_sf_per_mgd ASC, then created_at ASC. Entity id is never a decision input."
      - name: empty_pool_fallback
        when: "no ProcessTechnology satisfies the filter for a required role"
        difference: "the whole request fails with ERR_NO_ELIGIBLE_TECHNOLOGY and no TreatmentStage row is created for any role"

  - name: equipment_package_cost
    trigger: "BUDGETARY on POST /water-treatment/treatment-stages/{stage_id}/equipment-packages, on PATCH /water-treatment/equipment-packages/{package_id}, and re-stamped on POST /water-treatment/equipment-packages/{package_id}/submit-for-review; FIRM on POST /water-treatment/equipment-packages/{package_id}/review-decision with decision == APPROVE"
    algorithm: tiered_pricing
    formula: |
      base            = stage.equipment_base_cost_cents
      pressure_factor = 1 + PRESSURE_UPLIFT_PCT_PER_100_PSIG * (package.design_pressure_psig / 100)
      stamp_factor    = 1 + CODE_STAMP_SURCHARGE_PCT[package.code_stamp_required]

      # variant BUDGETARY - stamped at submit-for-review
      budgetary_cost_cents = round_half_up(base * MATERIAL_FACTOR_NOMINAL
                                                * pressure_factor
                                                * stamp_factor, 0)

      # variant FIRM - stamped at release-for-fabrication
      months_elapsed  = floor(seconds_between(stage.created_at, now) / 2592000)      # pinned 30-day months, from process selection
      escalation      = 1 + ESCALATION_PCT_PER_MONTH * months_elapsed
      firm_cost_cents = round_half_up(base * material.cost_index
                                           * pressure_factor
                                           * stamp_factor
                                           * escalation, 0)

      cost_variance_pct = round_half_up((firm_cost_cents - budgetary_cost_cents)
                                        / budgetary_cost_cents, 4)
      variance_flag     = cost_variance_pct > MAX_COST_VARIANCE_PCT
    input_set: "the package's own design_pressure_psig / code_stamp_required, the parent TreatmentStage.equipment_base_cost_cents, and (FIRM only) MaterialSpec.cost_index plus the whole 30-day months elapsed between the parent TreatmentStage.created_at and the review decision"
    constants:
      MATERIAL_FACTOR_NOMINAL: 1.0
      PRESSURE_UPLIFT_PCT_PER_100_PSIG: 0.03
      ESCALATION_PCT_PER_MONTH: 0.0075
      MAX_COST_VARIANCE_PCT: 0.15
      CODE_STAMP_SURCHARGE_PCT:
        NONE: 0.0
        AWWA: 0.04
        NSF61: 0.06
        ASME_U: 0.115
    precision: "single round_half_up to whole cents at the end of each variant; cost_variance_pct to 4 decimal places, round_half_up"
    variants:
      - name: BUDGETARY
        when: "the package is created, revised, or re-submitted for review"
        difference: "uses MATERIAL_FACTOR_NOMINAL (1.0) instead of the selected MaterialSpec.cost_index and applies no escalation, because the material and the release date are not yet committed"
      - name: FIRM
        when: "the package is approved at design review"
        difference: "multiplies by the actual MaterialSpec.cost_index and by escalation over the whole 30-day months elapsed since the parent TreatmentStage.created_at; for the same package data FIRM is strictly greater than BUDGETARY whenever cost_index > 1.0"

  - name: or_equal_compliance_score
    trigger: "on POST /water-treatment/or-equal-submittals/{submittal_id}/spec-deviations, on POST /water-treatment/spec-deviations/{deviation_id}/disposition, and on every POST /water-treatment/or-equal-submittals/{submittal_id}/engineer-decision"
    algorithm: weighted_scoring
    formula: |
      for d in SpecDeviation where d.or_equal_submittal_id == submittal.id:
          d.weighted_penalty_points = round_half_up(
              DEVIATION_WEIGHTS[d.severity] * DISPOSITION_MULTIPLIER[d.disposition], 2)

      penalty_points   = round_half_up(sum(d.weighted_penalty_points), 2)
      compliance_score = max(0.0, round_half_up(100 - penalty_points, 2))

      open_fundamental_count = count(d for d in children
                                     if d.severity == 'FUNDAMENTAL'
                                     and d.disposition in {'PENDING', 'REJECTED'})
    input_set: "every SpecDeviation child of the submittal regardless of disposition; WITHDRAWN rows contribute a 0.00 multiplier rather than being dropped from the sum"
    constants:
      DEVIATION_WEIGHTS: { MINOR: 2, MODERATE: 6, MAJOR: 15, FUNDAMENTAL: 30 }
      DISPOSITION_MULTIPLIER: { PENDING: 1.0, REJECTED: 1.0, ACCEPTED: 0.25, WITHDRAWN: 0.0 }
      MIN_COMPLIANCE_SCORE: 70
    precision: "2 decimal places, round_half_up; comparison against MIN_COMPLIANCE_SCORE is >= so a score of exactly 70.00 passes"
    variants:
      - name: per_item_then_sum
        when: "always"
        difference: "each deviation's weight x multiplier is rounded to 2 dp before the sum; the sum is then rounded again to 2 dp"

  - name: bid_evaluated_price
    trigger: "on POST /water-treatment/projects/{project_id}/bid"
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 - per-line rounding THEN sum. Pinned order: each stage line item is
      # rounded to whole cents first and only then summed. Summing the unrounded
      # products and rounding once at the end is the WRONG order and is rejected.
      lines = [pkg for pkg in EquipmentPackage
               if pkg.treatment_stage_id in stages(project) with status != 'SUPERSEDED'
               and pkg.status in {'APPROVED','RELEASED_FOR_FAB','FAT_PASSED','SHIPPED'}]
      base_bid_amount_cents = sum(
          round_half_up(pkg.firm_cost_cents * (1 + OVERHEAD_PCT), 0)
          for pkg in lines ordered by stage.stage_index ASC)

      # STEP 2 - the bond rate tier is keyed on base_bid_amount_cents, NOT on the
      # evaluated total that the premium is later added into. This pin is what
      # makes the otherwise circular definition well defined.
      bond_rate = first tier.rate in BOND_RATE_TIERS
                  where tier.max_base_cents is null or base_bid_amount_cents <= tier.max_base_cents

      # STEP 3
      bond_premium_cents = round_half_up(base_bid_amount_cents * bond_rate, 0)

      # STEP 4 - contingency is also keyed on the base, using the project's posture
      contingency_cents = round_half_up(
          base_bid_amount_cents * CONTINGENCY_PCT_BY_POSTURE[project.delivery_posture], 0)

      # STEP 5
      evaluated_bid_price_cents = base_bid_amount_cents + bond_premium_cents + contingency_cents

      # STEP 6 - integer margin floor, no floating point division
      if offered_price_cents * 10000 < evaluated_bid_price_cents * (10000 + 800):
          raise ERR_BID_MARGIN_BELOW_FLOOR                                    # 422
    input_set: "one line per non-SUPERSEDED TreatmentStage of the project, taken from that stage's EquipmentPackage in status APPROVED or later; DRAFT and IN_REVIEW packages are excluded"
    constants:
      OVERHEAD_PCT: 0.185
      MIN_MARGIN_PCT: 0.08
      BOND_RATE_TIERS:
        - { max_base_cents: 100000000, rate: 0.0125 }
        - { max_base_cents: 500000000, rate: 0.0100 }
        - { max_base_cents: null, rate: 0.0085 }
      CONTINGENCY_PCT_BY_POSTURE: { ON_TRACK: 0.02, AT_RISK: 0.05, HELD: 0.09 }
    precision: "whole cents, round_half_up per line item then integer summation; the margin floor is evaluated as an integer cross-multiplication so a margin of exactly 8% passes"
    variants:
      - name: pinned_evaluation_order
        when: "always"
        difference: "steps 1 to 5 run in the stated order; the bond tier is selected from base_bid_amount_cents so bond_premium_cents never feeds back into the tier lookup"

  - name: skid_fat_readiness
    trigger: "on every POST /water-treatment/skids/{skid_id}/milestones, on EquipmentPackage status changes affecting the skid, and on FAT witness results"
    algorithm: aggregation
    formula: |
      if skid.mechanical_status == 'REWORK':
          fat_readiness = 'BLOCKED'
      elif skid.mechanical_status == 'MECH_COMPLETE'
           and skid.controls_status == 'CONTROLS_COMPLETE'
           and package.status == 'RELEASED_FOR_FAB':
          fat_readiness = 'READY'
      else:
          fat_readiness = 'NOT_READY'

      # --- FAT witness routing (same constant family). A witness who asks for
      # --- PASS while recording more than MAX_PASS_PUNCHLIST_ITEMS open items
      # --- is recorded as CONDITIONAL, never PASSED. The comparison is
      # --- strictly greater-than, so exactly MAX_PASS_PUNCHLIST_ITEMS passes.
      if requested_result == 'PASS' and punchlist_item_count > MAX_PASS_PUNCHLIST_ITEMS:
          witnessed_result = 'CONDITIONAL'
      else:
          witnessed_result = requested_result
    input_set: "the skid's own two state dimensions plus the parent EquipmentPackage.status; for witness routing, the requested result and punchlist_item_count of the FatRun being witnessed"
    constants:
      MAX_PASS_PUNCHLIST_ITEMS: 3
    precision: "exact enum fold; no numeric rounding; the punchlist comparison is strictly greater-than so a PASS with exactly 3 punchlist items stays PASSED"
    variants:
      - name: dimension_independence
        when: "always"
        difference: "READY requires both dimensions at their terminal value; advancing only one dimension leaves fat_readiness at NOT_READY"
      - name: punchlist_routing
        when: "a FAT result is witnessed"
        difference: "a requested PASS carrying more than 3 punchlist items is downgraded to CONDITIONAL; the requested enum is not what is stored"

  - name: bay_footprint_minute_ledger
    trigger: "on POST /water-treatment/fat-runs (reserve), and on every FatRun exit from SCHEDULED - witness-result, cancel or supersede (release)"
    algorithm: interval_merge
    formula: |
      duration_minutes = floor(seconds_between(scheduled_start_at, scheduled_end_at) / 60)
      footprint_minutes = run.footprint_sf * duration_minutes

      # --- overlap geometry: half-open [start, end) widened by the bay's
      # --- changeover buffer on BOTH ends. Two runs that merely touch
      # --- (gap == 0) DO collide; a gap strictly greater than the buffer does not.
      buffer = bay.changeover_buffer_minutes
      overlapping = [r for r in FatRun
                     if r.test_bay_id == bay.id
                     and r.status == 'SCHEDULED'
                     and new.scheduled_start_at < r.scheduled_end_at   + buffer_minutes(buffer)
                     and r.scheduled_start_at   < new.scheduled_end_at + buffer_minutes(buffer)]

      if any(r.requires_exclusive_bay or new.requires_exclusive_bay for r in overlapping):
          raise ERR_TEST_BAY_EXCLUSIVE_CONFLICT                               # 409
      if sum(r.footprint_sf for r in overlapping) + new.footprint_sf > bay.max_skid_footprint_sf:
          raise ERR_TEST_BAY_CAPACITY_EXCEEDED                                # 409

      bay.reserved_footprint_minutes += footprint_minutes                     # on reserve
      bay.reserved_footprint_minutes -= footprint_minutes                     # on release
    input_set: "FatRun rows on the same test_bay_id with status == SCHEDULED; PASSED, FAILED, CONDITIONAL, CANCELLED and SUPERSEDED rows are excluded from both the overlap set and the ledger"
    constants: {}
    precision: "duration in whole minutes (floor); footprint-minutes to 2 decimal places, round_half_up; the capacity comparison is strictly greater-than so a sum exactly equal to max_skid_footprint_sf is accepted"
    variants:
      - name: buffered_half_open_interval
        when: "always"
        difference: "adjacency is a conflict: the buffer is added to both ends, so two runs whose scheduled windows touch (gap 0) or are separated by strictly less than changeover_buffer_minutes fall in the same overlap set, while a gap of exactly changeover_buffer_minutes or more is free"
      - name: aggregate_capacity
        when: "neither the incumbent nor the incoming run requires an exclusive bay"
        difference: "several runs may share one bay as long as the summed footprint_sf of the overlap set plus the new run stays at or below max_skid_footprint_sf"

  - name: demo_window_occupancy
    trigger: "on POST /water-treatment/performance-demos"
    algorithm: interval_merge
    formula: |
      # --- overlap geometry: CLOSED interval [start, end] on the Skid, no buffer,
      # --- strictly exclusive occupancy. Touching endpoints DO collide.
      conflicts = [d for d in PerformanceDemo
                   if d.skid_id == new.skid_id
                   and d.result == 'PENDING'
                   and new.window_start_at <= d.window_end_at
                   and d.window_start_at   <= new.window_end_at]
      if conflicts is non-empty:
          raise ERR_DEMO_WINDOW_CONFLICT                                      # 409
    input_set: "PerformanceDemo rows on the same skid_id whose result is still PENDING; PASSED, FAILED and CONDITIONAL_PASS rows never conflict"
    constants: {}
    precision: "instant comparison at millisecond resolution; both endpoints are inclusive"
    variants:
      - name: closed_interval_exclusive
        when: "always"
        difference: "unlike the TestBay rule there is no buffer and no aggregate capacity: a single PENDING demo blocks the skid, and a new window whose start equals the incumbent's end is rejected"

  - name: performance_guarantee_evaluation
    trigger: "on POST /water-treatment/performance-demos/{demo_id}/certify"
    algorithm: threshold
    formula: |
      evaluation = []
      for o in TreatmentObjective where o.project_id == demo.project_id and o.status == 'ACTIVE'
              ordered by o.parameter ASC, then o.created_at ASC:
          samples = [r.measured_value for r in demo.readings if r.parameter == o.parameter]
          if samples is empty: raise ERR_DEMO_READING_MISSING                 # 422
          if o.basis == 'MAX_DAY':
              compared_value = round_half_up(max(samples), 3)
          else:                                    # MONTHLY_AVERAGE
              compared_value = round_half_up(sum(samples) / len(samples), 3)
          passed    = compared_value <= o.limit_value                          # equality passes
          margin_pct = round_half_up((o.limit_value - compared_value)
                                     / o.limit_value * 100, 2)
          evaluation.append({parameter, basis, limit_value, compared_value, margin_pct, passed})

      min_margin_pct = min(e.margin_pct for e in evaluation)

      if certification == 'FAIL' or any(not e.passed for e in evaluation): result = 'FAILED'
      elif min_margin_pct >= GUARANTEE_MARGIN_PCT:                            result = 'PASSED'
      else:                                                                   result = 'CONDITIONAL_PASS'
    input_set: "TreatmentObjective rows of the project with status == ACTIVE only; RETIRED objectives are never evaluated. All readings recorded on the demo for that parameter enter the basis aggregate."
    constants:
      GUARANTEE_MARGIN_PCT: 5.0
      MAX_DEMO_ROUNDS: 2
    precision: "compared_value to 3 decimal places, margin_pct to 2 decimal places, both round_half_up; the limit test is <= and the margin test is >= so exact equality passes in both places"
    variants:
      - name: MAX_DAY
        when: "objective.basis == MAX_DAY"
        difference: "compared_value is the maximum reading for the parameter"
      - name: MONTHLY_AVERAGE
        when: "objective.basis == MONTHLY_AVERAGE"
        difference: "compared_value is the arithmetic mean of the readings for the parameter, so the same reading set can pass one basis and fail the other"

  - name: liquidated_damages
    trigger: "on POST /water-treatment/performance-demos/{demo_id}/certify when the evaluated result is FAILED or CONDITIONAL_PASS and demo.round_no == MAX_DEMO_ROUNDS"
    algorithm: decay_function
    formula: |
      ld_days   = max(0, floor(seconds_between(project.guarantee_deadline_at, now) / 86400))
      daily_ld  = round_half_up(project.contract_amount_cents * LD_RATE_PER_DAY, 0)
      ld_cap    = round_half_up(project.contract_amount_cents * LD_CAP_PCT, 0)
      project.liquidated_damages_cents = min(daily_ld * ld_days, ld_cap)
    input_set: "the project's own contract_amount_cents and guarantee_deadline_at against the logical clock"
    constants:
      LD_RATE_PER_DAY: 0.0005
      LD_CAP_PCT: 0.05
    precision: "whole cents; the daily rate is rounded once and then multiplied by whole elapsed days, so the cap binds at exactly 100 days of delay"
    variants:
      - name: pre_deadline
        when: "the logical clock is at or before guarantee_deadline_at"
        difference: "ld_days is 0 and liquidated_damages_cents stays 0 even though the guarantee defaulted"
      - name: capped
        when: "daily_ld * ld_days exceeds ld_cap"
        difference: "the accrual is truncated at LD_CAP_PCT of the contract amount"

  - name: service_reserve_balance
    trigger: "on POST /water-treatment/service-agreements/{agreement_id}/consumable-draws and on POST /water-treatment/consumable-draws/{draw_id}/reversal"
    algorithm: aggregation
    formula: |
      # ---------- variant ACCRUAL (governs availability) ----------
      accrual_amount_cents = round_half_up(
          draw.quantity * draw.catalog_unit_cost_cents * (1 + CONSUMABLE_MARKUP_PCT), 0)

      # ---------- variant SETTLED (reported, does NOT gate) ----------
      if draw.draw_type == 'MEMBRANE_REPLACEMENT':
          months_in_service   = floor(seconds_between(agreement.membrane_installed_at, now) / 2592000)
          months_remaining    = max(0, MEMBRANE_WARRANTY_MONTHS - months_in_service)
          warranty_credit_cents = round_half_up(
              draw.quantity * draw.invoiced_unit_cost_cents
              * WARRANTY_CREDIT_PCT_PER_MONTH_REMAINING * months_remaining, 0)
      else:
          warranty_credit_cents = 0
      settled_amount_cents = round_half_up(
          draw.quantity * draw.invoiced_unit_cost_cents * (1 + FREIGHT_PCT), 0
      ) - warranty_credit_cents

      # ---------- per-draw rounding THEN sum (pinned) ----------
      # Each draw line is rounded to whole cents when it is written; the agreement
      # totals are integer sums of those already-rounded lines. Re-deriving the
      # totals from unrounded products and rounding once is the WRONG order.
      agreement.reserve_committed_accrual_cents = sum(d.accrual_amount_cents for d in draws)
      agreement.reserve_committed_settled_cents = sum(d.settled_amount_cents for d in draws)
      agreement.reserve_available_cents         = agreement.reserve_funded_cents
                                                 - agreement.reserve_committed_accrual_cents
      agreement.settlement_variance_cents       = agreement.reserve_committed_settled_cents
                                                 - agreement.reserve_committed_accrual_cents

      # ---------- fiscal gate (ACCRUAL variant only) ----------
      if accrual_amount_cents > agreement.reserve_available_cents:
          raise ERR_RESERVE_INSUFFICIENT                                      # 422

      # ---------- reversal ----------
      # a REVERSAL row copies the original's quantity and unit costs and negates
      # both line amounts: accrual_amount_cents = -original.accrual_amount_cents,
      # settled_amount_cents = -original.settled_amount_cents
    input_set: "every ConsumableDraw row of the agreement, including REVERSAL rows (which carry negative line amounts); no status filter exists because ConsumableDraw is append-only"
    constants:
      CONSUMABLE_MARKUP_PCT: 0.22
      FREIGHT_PCT: 0.065
      MEMBRANE_WARRANTY_MONTHS: 60
      WARRANTY_CREDIT_PCT_PER_MONTH_REMAINING: 0.01
    precision: "whole cents, round_half_up per draw line before summation; the reserve gate is strictly greater-than so a draw exactly equal to reserve_available_cents is accepted and drives the agreement to SUSPENDED"
    variants:
      - name: ACCRUAL
        when: "always, at draw creation"
        difference: "uses catalog_unit_cost_cents and CONSUMABLE_MARKUP_PCT; this is the only variant that gates availability and suspension"
      - name: SETTLED
        when: "always, at draw creation"
        difference: "uses invoiced_unit_cost_cents plus FREIGHT_PCT and subtracts the prorated membrane warranty credit; for identical draw data it yields a different number from ACCRUAL, exposed as settlement_variance_cents"

  - name: service_reserve_conservation
    trigger: "invariant checked after every ConsumableDraw creation and every reversal"
    algorithm: aggregation
    formula: |
      invariant A: agreement.reserve_committed_accrual_cents + agreement.reserve_available_cents
                   == agreement.reserve_funded_cents
      invariant B: for a forward draw D followed by its REVERSAL R,
                   agreement.reserve_available_cents after R
                   == agreement.reserve_available_cents before D
                   and agreement.reserve_committed_accrual_cents after R
                   == agreement.reserve_committed_accrual_cents before D
    input_set: "all ConsumableDraw rows of the agreement"
    constants: {}
    precision: "exact integer equality in cents; no drift is tolerated"
    variants:
      - name: forward_and_compensation
        when: "a draw is reversed"
        difference: "the conserved quantity is reserve money in cents; the reversal restores it exactly rather than approximately"

  - name: bay_footprint_minute_conservation
    trigger: "invariant checked after every FatRun creation and every FatRun exit from SCHEDULED"
    algorithm: aggregation
    formula: |
      invariant A: bay.reserved_footprint_minutes
                   == sum(r.footprint_sf * r.duration_minutes
                          for r in FatRun
                          if r.test_bay_id == bay.id and r.status == 'SCHEDULED')
      invariant B: scheduling a run and then cancelling it restores
                   bay.reserved_footprint_minutes to its exact pre-scheduling value
    input_set: "FatRun rows on the bay with status == SCHEDULED only"
    constants: {}
    precision: "2 decimal places, round_half_up; the conserved quantity is resource-time (footprint-minutes), not money"
    variants:
      - name: forward_and_compensation
        when: "a run is cancelled or superseded"
        difference: "the release subtracts exactly the footprint-minutes the reservation added, including when the release happens through the supersede path rather than the cancel path"

  - name: project_delivery_posture
    trigger: "recomputed on process-selection, package release, FAT witness result, skid milestone, and demo certification"
    algorithm: aggregation
    formula: |
      packages = EquipmentPackage rows on non-SUPERSEDED TreatmentStage rows of the project
      if any(p.status == 'REWORK_HOLD' for p in packages):
          delivery_posture = 'HELD'
      elif any(p.variance_flag for p in packages)
           or any(r.status in {'FAILED','CONDITIONAL'} for r in FatRun rows on those packages' skids)
           or any(d.result in {'FAILED','CONDITIONAL_PASS'} for d in PerformanceDemo rows of the project):
          delivery_posture = 'AT_RISK'
      else:
          delivery_posture = 'ON_TRACK'
    input_set: "EquipmentPackage rows on non-SUPERSEDED stages, their FatRun rows in any terminal state, and every PerformanceDemo of the project"
    constants: {}
    precision: "exact enum fold, evaluated in the stated precedence order (HELD dominates AT_RISK dominates ON_TRACK)"
    variants:
      - name: precedence_order
        when: "a project has both a REWORK_HOLD package and a variance-flagged package"
        difference: "HELD wins; the posture is not a set but a single dominating value, and it feeds CONTINGENCY_PCT_BY_POSTURE in the bid calculation"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the nine declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list in section 1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "{project_id} in the path resolves to a Project"
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "all /projects/{project_id}... routes"
  - priority: 4
    category: existence
    check: "{profile_id} in the path resolves to an InfluentProfile"
    error_id: ERR_INFLUENT_PROFILE_NOT_FOUND
    http_status: 404
    applies_to: "POST /influent-profiles/{profile_id}/qa-decision"
  - priority: 5
    category: existence
    check: "{stage_id} in the path resolves to a TreatmentStage"
    error_id: ERR_TREATMENT_STAGE_NOT_FOUND
    http_status: 404
    applies_to: "GET /treatment-stages/{stage_id}, POST /treatment-stages/{stage_id}/equipment-packages"
  - priority: 6
    category: existence
    check: "{package_id} in the path resolves to an EquipmentPackage"
    error_id: ERR_EQUIPMENT_PACKAGE_NOT_FOUND
    http_status: 404
    applies_to: "all /equipment-packages/{package_id}... routes"
  - priority: 7
    category: existence
    check: "{skid_id} in the path resolves to a Skid"
    error_id: ERR_SKID_NOT_FOUND
    http_status: 404
    applies_to: "GET /skids/{skid_id}, POST /skids/{skid_id}/milestones"
  - priority: 8
    category: existence
    check: "{run_id} in the path resolves to a FatRun"
    error_id: ERR_FAT_RUN_NOT_FOUND
    http_status: 404
    applies_to: "all /fat-runs/{run_id}... routes"
  - priority: 9
    category: existence
    check: "{submittal_id} in the path resolves to an OrEqualSubmittal"
    error_id: ERR_SUBMITTAL_NOT_FOUND
    http_status: 404
    applies_to: "all /or-equal-submittals/{submittal_id}... routes"
  - priority: 10
    category: existence
    check: "{deviation_id} in the path resolves to a SpecDeviation"
    error_id: ERR_DEVIATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /spec-deviations/{deviation_id}/disposition"
  - priority: 11
    category: existence
    check: "{demo_id} in the path resolves to a PerformanceDemo"
    error_id: ERR_DEMO_NOT_FOUND
    http_status: 404
    applies_to: "GET /performance-demos/{demo_id}, POST /performance-demos/{demo_id}/certify"
  - priority: 12
    category: existence
    check: "{agreement_id} in the path resolves to a ServiceAgreement"
    error_id: ERR_SERVICE_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /service-agreements/{agreement_id}, POST /service-agreements/{agreement_id}/consumable-draws"
  - priority: 13
    category: existence
    check: "{draw_id} in the path resolves to a ConsumableDraw"
    error_id: ERR_CONSUMABLE_DRAW_NOT_FOUND
    http_status: 404
    applies_to: "GET /consumable-draws/{draw_id}, POST /consumable-draws/{draw_id}/reversal"
  - priority: 14
    category: existence
    check: "{objective_id} in the path resolves to a TreatmentObjective"
    error_id: ERR_TREATMENT_OBJECTIVE_NOT_FOUND
    http_status: 404
    applies_to: "GET /treatment-objectives/{objective_id}"
  - priority: 15
    category: existence
    check: "every foreign key supplied in the request body (material_spec_id, skid_id, test_bay_id, project_id) resolves to a live row"
    error_id: ERR_CATALOG_REF_NOT_FOUND
    http_status: 404
    applies_to: "POST /treatment-stages/{stage_id}/equipment-packages, PATCH /equipment-packages/{package_id}, POST /fat-runs, POST /performance-demos"
  - priority: 16
    category: business_constraint
    check: "request body satisfies the endpoint input schema: required fields present, types correct, enum members valid, datetime pairs ordered (end strictly after start), numeric fields within their declared constraints"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 17
    category: business_constraint
    check: "ProcessTechnology.code, MaterialSpec.code and TestBay.bay_code are unique within their catalog"
    error_id: ERR_DUPLICATE_CATALOG_CODE
    http_status: 409
    applies_to: "POST /process-technologies, POST /material-specs, POST /test-bays"
  - priority: 18
    category: business_constraint
    check: "tag_number is unique among EquipmentPackage rows sharing the same treatment_stage_id"
    error_id: ERR_DUPLICATE_TAG_NUMBER
    http_status: 409
    applies_to: "POST /treatment-stages/{stage_id}/equipment-packages"
  - priority: 19
    category: state
    check: "expected_skid_version equals the target Skid.version"
    error_id: ERR_STALE_SKID_VERSION
    http_status: 412
    applies_to: "POST /fat-runs"
  - priority: 20
    category: state
    check: "expected_service_agreement_version equals the target ServiceAgreement.version"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /service-agreements/{agreement_id}/consumable-draws"
  - priority: 21
    category: state
    check: "expected_or_equal_submittal_version equals the target OrEqualSubmittal.version"
    error_id: ERR_STALE_SUBMITTAL_VERSION
    http_status: 412
    applies_to: "POST /or-equal-submittals/{submittal_id}/spec-deviations"
  - priority: 22
    category: state
    check: "lazy expiry sweep: when the logical clock is at or after agreement.expires_at the agreement is written to EXPIRED and the draw is refused; this check runs before the ACTIVE-state check"
    error_id: ERR_AGREEMENT_EXPIRED
    http_status: 409
    applies_to: "POST /service-agreements/{agreement_id}/consumable-draws"
  - priority: 23
    category: state
    check: "project.status equals the state the requested transition departs from (DRAFT or SCOPED for process-selection, BID_SUBMITTED for award, COMMISSIONING or GUARANTEED for service-agreement creation). For POST /bid this rule only rejects a project that has not yet reached bidding - status DRAFT, SCOPED or BID_BLOCKED; a project already at BID_SUBMITTED or beyond falls through to priority 24"
    error_id: ERR_INVALID_PROJECT_STATE
    http_status: 409
    applies_to: "POST /projects/{project_id}/process-selection, POST /projects/{project_id}/bid, POST /projects/{project_id}/award, POST /projects/{project_id}/service-agreements"
  - priority: 24
    category: state
    check: "project.status == BID_READY when a bid is posted; a project already in BID_SUBMITTED, AWARDED, IN_FABRICATION, COMMISSIONING, GUARANTEED, REMEDIATION, SERVICE_ACTIVE or CLOSED is refused because its bid is already on record"
    error_id: ERR_BID_ALREADY_SUBMITTED
    http_status: 409
    applies_to: "POST /projects/{project_id}/bid"
  - priority: 25
    category: state
    check: "profile.qa_status == SUBMITTED"
    error_id: ERR_PROFILE_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /influent-profiles/{profile_id}/qa-decision"
  - priority: 26
    category: state
    check: "package.status equals the state the requested transition departs from (DRAFT for submit-for-review and PATCH, IN_REVIEW for review-decision, APPROVED for release-for-fabrication)"
    error_id: ERR_PACKAGE_INVALID_STATE
    http_status: 409
    applies_to: "PATCH /equipment-packages/{package_id}, POST /equipment-packages/{package_id}/submit-for-review, POST /equipment-packages/{package_id}/review-decision, POST /equipment-packages/{package_id}/release-for-fabrication"
  - priority: 27
    category: state
    check: "the requested milestone is the immediate successor on its dimension per state_machines.Skid; MECHANICAL from REWORK may only go to PIPING_COMPLETE"
    error_id: ERR_SKID_MILESTONE_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /skids/{skid_id}/milestones"
  - priority: 28
    category: state
    check: "run.status == SCHEDULED"
    error_id: ERR_FAT_RUN_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /fat-runs/{run_id}/witness-result, POST /fat-runs/{run_id}/cancel"
  - priority: 29
    category: state
    check: "submittal.status equals the state the requested transition departs from (DRAFT for spec-deviations and submit, SUBMITTED for engineer-decision)"
    error_id: ERR_SUBMITTAL_INVALID_STATE
    http_status: 409
    applies_to: "POST /or-equal-submittals/{submittal_id}/spec-deviations, POST /or-equal-submittals/{submittal_id}/submit, POST /or-equal-submittals/{submittal_id}/engineer-decision"
  - priority: 30
    category: state
    check: "deviation.disposition == PENDING"
    error_id: ERR_DEVIATION_ALREADY_DISPOSITIONED
    http_status: 409
    applies_to: "POST /spec-deviations/{deviation_id}/disposition"
  - priority: 31
    category: state
    check: "demo.result == PENDING"
    error_id: ERR_DEMO_ALREADY_CERTIFIED
    http_status: 409
    applies_to: "POST /performance-demos/{demo_id}/certify"
  - priority: 32
    category: state
    check: "agreement.status == ACTIVE (a SUSPENDED or PENDING_ACTIVATION agreement accepts no draw)"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /service-agreements/{agreement_id}/consumable-draws"
  - priority: 33
    category: state
    check: "no ConsumableDraw row already exists whose reverses_draw_id equals the target draw id, and the target draw's own draw_type != REVERSAL"
    error_id: ERR_DRAW_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /consumable-draws/{draw_id}/reversal"
  - priority: 34
    category: state
    check: "the addressed deliverable status on the Project is not already ACCEPTED"
    error_id: ERR_DELIVERABLE_ALREADY_ACCEPTED
    http_status: 409
    applies_to: "POST /projects/{project_id}/deliverable-acceptance"
  - priority: 35
    category: business_referential
    check: "the parent TreatmentStage.status is SELECTED or ENGINEERED; a SUPERSEDED stage accepts no package creation, revision or review"
    error_id: ERR_STAGE_SUPERSEDED
    http_status: 409
    applies_to: "POST /treatment-stages/{stage_id}/equipment-packages, PATCH /equipment-packages/{package_id}, POST /equipment-packages/{package_id}/submit-for-review, POST /equipment-packages/{package_id}/review-decision"
  - priority: 36
    category: auth
    check: "X-User-ID != package.designed_by_user_id when a review decision is rendered, and X-User-ID != the skid package's designed_by_user_id when a FAT result is witnessed"
    error_id: ERR_SOD_DESIGNER_IS_REVIEWER
    http_status: 403
    applies_to: "POST /equipment-packages/{package_id}/review-decision, POST /fat-runs/{run_id}/witness-result"
  - priority: 37
    category: auth
    check: "X-User-ID != the pre-approved OrEqualSubmittal.authored_by_user_id when the project's bid is posted"
    error_id: ERR_SOD_AUTHOR_IS_BIDDER
    http_status: 403
    applies_to: "POST /projects/{project_id}/bid"
  - priority: 38
    category: auth
    check: "X-User-ID != demo.recorded_by_user_id when the demonstration is certified"
    error_id: ERR_SOD_RECORDER_IS_CERTIFIER
    http_status: 403
    applies_to: "POST /performance-demos/{demo_id}/certify"
  - priority: 39
    category: business_safety
    check: "the selected MaterialSpec is rated for the wetted service: governing_profile.chloride_mg_l <= material.max_chloride_ppm, governing_profile.temperature_c <= material.max_temp_c, material.ph_min <= governing_profile.ph <= material.ph_max, and technology.chemical_service_class is a member of material.service_classes_allowed"
    error_id: ERR_MATERIAL_NOT_RATED_FOR_SERVICE
    http_status: 422
    applies_to: "POST /treatment-stages/{stage_id}/equipment-packages, PATCH /equipment-packages/{package_id}, POST /equipment-packages/{package_id}/submit-for-review"
  - priority: 40
    category: business_safety
    check: "package.design_pressure_psig <= material.max_pressure_psig"
    error_id: ERR_MATERIAL_PRESSURE_EXCEEDED
    http_status: 422
    applies_to: "POST /treatment-stages/{stage_id}/equipment-packages, PATCH /equipment-packages/{package_id}, POST /equipment-packages/{package_id}/submit-for-review"
  - priority: 41
    category: business_constraint
    check: "the material carries the stage technology's required code stamp: ASME_U needs asme_u_capable, NSF61 needs nsf61_certified, AWWA needs awwa_compliant, NONE needs nothing"
    error_id: ERR_MATERIAL_NOT_CODE_STAMPABLE
    http_status: 422
    applies_to: "POST /treatment-stages/{stage_id}/equipment-packages, PATCH /equipment-packages/{package_id}, POST /equipment-packages/{package_id}/submit-for-review"
  - priority: 42
    category: business_constraint
    check: "at least one InfluentProfile of the project has qa_status == ACCEPTED"
    error_id: ERR_NO_ACCEPTED_INFLUENT_PROFILE
    http_status: 422
    applies_to: "POST /projects/{project_id}/process-selection"
  - priority: 43
    category: business_constraint
    check: "at least one TreatmentObjective of the project has status == ACTIVE"
    error_id: ERR_NO_TREATMENT_OBJECTIVES
    http_status: 422
    applies_to: "POST /projects/{project_id}/process-selection"
  - priority: 44
    category: business_constraint
    check: "for every required stage role the ProcessTechnology candidate pool is non-empty per calculations.process_train_selection"
    error_id: ERR_NO_ELIGIBLE_TECHNOLOGY
    http_status: 422
    applies_to: "POST /projects/{project_id}/process-selection"
  - priority: 45
    category: business_referential
    check: "the parent EquipmentPackage.status == RELEASED_FOR_FAB and skid.fat_readiness == READY"
    error_id: ERR_SKID_NOT_FAT_READY
    http_status: 422
    applies_to: "POST /fat-runs, POST /fat-runs/{run_id}/witness-result"
  - priority: 46
    category: business_constraint
    check: "the target TestBay.status == AVAILABLE"
    error_id: ERR_TEST_BAY_UNAVAILABLE
    http_status: 409
    applies_to: "POST /fat-runs"
  - priority: 47
    category: business_temporal
    check: "no run in the buffered overlap set requires an exclusive bay, and the incoming run does not require one while the overlap set is non-empty"
    error_id: ERR_TEST_BAY_EXCLUSIVE_CONFLICT
    http_status: 409
    applies_to: "POST /fat-runs"
  - priority: 48
    category: business_constraint
    check: "summed footprint_sf of the buffered overlap set plus the incoming run is at most bay.max_skid_footprint_sf"
    error_id: ERR_TEST_BAY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /fat-runs"
  - priority: 49
    category: business_temporal
    check: "no PENDING PerformanceDemo on the same skid shares a closed-interval overlap with the requested window"
    error_id: ERR_DEMO_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /performance-demos"
  - priority: 50
    category: business_constraint
    check: "submittal.open_fundamental_count == 0 when the engineer pre-approves"
    error_id: ERR_FUNDAMENTAL_DEVIATION_OPEN
    http_status: 422
    applies_to: "POST /or-equal-submittals/{submittal_id}/engineer-decision"
  - priority: 51
    category: business_constraint
    check: "submittal.compliance_score >= MIN_COMPLIANCE_SCORE (70.00) on submit and on an engineer-decision of PRE_APPROVED (a decision of REJECTED or REQUEST_REVISION is never blocked by the floor); the submittal must also carry at least one SpecDeviation child on submit"
    error_id: ERR_COMPLIANCE_SCORE_TOO_LOW
    http_status: 422
    applies_to: "POST /or-equal-submittals/{submittal_id}/submit, POST /or-equal-submittals/{submittal_id}/engineer-decision"
  - priority: 52
    category: business_referential
    check: "at least one OrEqualSubmittal of the project has status == PRE_APPROVED, and every non-SUPERSEDED stage carries one EquipmentPackage with firm_cost_cents > 0"
    error_id: ERR_OR_EQUAL_NOT_PREAPPROVED
    http_status: 422
    applies_to: "POST /projects/{project_id}/bid"
  - priority: 53
    category: business_temporal
    check: "the logical clock is strictly before project.bid_due_at"
    error_id: ERR_BID_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /projects/{project_id}/bid, POST /or-equal-submittals/{submittal_id}/submit"
  - priority: 54
    category: business_fiscal
    check: "offered_price_cents * 10000 >= evaluated_bid_price_cents * 10800 (an 8.00% margin floor evaluated as integer cross-multiplication)"
    error_id: ERR_BID_MARGIN_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /projects/{project_id}/bid"
  - priority: 55
    category: business_constraint
    check: "the count of PerformanceDemo rows of the project with result in {PASSED, FAILED, CONDITIONAL_PASS} is below MAX_DEMO_ROUNDS (2). This check deliberately outranks the COMMISSIONING prerequisite at priority 56, because a project that has burned both demonstration rounds has already left COMMISSIONING for GUARANTEED or REMEDIATION and the retest cap is the more specific diagnosis"
    error_id: ERR_MAX_DEMO_ROUNDS_EXCEEDED
    http_status: 422
    applies_to: "POST /performance-demos"
  - priority: 56
    category: business_referential
    check: "the project is in COMMISSIONING, the referenced skid's EquipmentPackage.status is FAT_PASSED or SHIPPED, and the skid belongs to the same project"
    error_id: ERR_GUARANTEE_PREREQ_NOT_MET
    http_status: 422
    applies_to: "POST /performance-demos"
  - priority: 57
    category: business_constraint
    check: "every ACTIVE TreatmentObjective of the project has at least one reading of its parameter in demo.readings"
    error_id: ERR_DEMO_READING_MISSING
    http_status: 422
    applies_to: "POST /performance-demos/{demo_id}/certify"
  - priority: 58
    category: business_referential
    check: "Project.om_manual_status, Project.operator_training_status and Project.spare_parts_list_status are all ACCEPTED"
    error_id: ERR_DELIVERABLES_INCOMPLETE
    http_status: 422
    applies_to: "POST /projects/{project_id}/service-agreements"
  - priority: 59
    category: business_constraint
    check: "quantity is an integer greater than or equal to 1"
    error_id: ERR_INVALID_DRAW_QUANTITY
    http_status: 422
    applies_to: "POST /service-agreements/{agreement_id}/consumable-draws"
  - priority: 60
    category: business_fiscal
    check: "the draw's ACCRUAL line amount is at most agreement.reserve_available_cents"
    error_id: ERR_RESERVE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /service-agreements/{agreement_id}/consumable-draws"

endpoints:
  - method: POST
    path: /water-treatment/_clock/set_current_utc
    purpose: "Set the logical clock used by every temporal rule. The clock starts at 2026-08-01T00:00:00Z on a fresh instance; every datetime comparison in this domain reads this clock, never the wall clock."
    roles: [PlatformAdmin]
    input: [now]
    output: "{ now: datetime }"
    side_effects:
      - "the logical clock is set to the supplied instant; no domain rows are touched"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
  - method: POST
    path: /water-treatment/process-technologies
    purpose: "Register a unit-process technology in the shared catalog (role, feed-quality envelope, flow envelope, capex/energy/footprint coefficients, required code stamp, chemical service class)."
    roles: [PlatformAdmin]
    input: [code, name, role, max_feed_turbidity_ntu, max_feed_tds_mg_l, min_design_flow_mgd, max_design_flow_mgd, unit_capex_cents_per_mgd, energy_kwh_per_mg, footprint_sf_per_mgd, "requires_code_stamp?", chemical_service_class, "consumable_item_code?", "status?"]
    output: ProcessTechnology
    side_effects:
      - "creates a ProcessTechnology row; status defaults to ACTIVE and may be seeded as DEPRECATED, in which case the row is excluded from every process-selection candidate pool"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_DUPLICATE_CATALOG_CODE]
  - method: POST
    path: /water-treatment/material-specs
    purpose: "Register a wetted-material specification with its corrosion, temperature, pH and pressure envelope, code-stamp capabilities and cost index."
    roles: [PlatformAdmin]
    input: [code, max_chloride_ppm, max_temp_c, max_pressure_psig, ph_min, ph_max, "asme_u_capable?", "nsf61_certified?", "awwa_compliant?", cost_index, service_classes_allowed]
    output: MaterialSpec
    side_effects:
      - "creates a MaterialSpec row"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_DUPLICATE_CATALOG_CODE]
  - method: POST
    path: /water-treatment/test-bays
    purpose: "Register a factory acceptance test bay with its footprint capacity, changeover buffer and crane capacity."
    roles: [PlatformAdmin]
    input: [bay_code, max_skid_footprint_sf, "changeover_buffer_minutes?", crane_capacity_tons, "status?"]
    output: TestBay
    side_effects:
      - "creates a TestBay row with reserved_footprint_minutes = 0; status defaults to AVAILABLE and may be seeded as OUT_OF_SERVICE"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_DUPLICATE_CATALOG_CODE]
  - method: POST
    path: /water-treatment/projects
    purpose: "Open a municipal equipment project with its procurement type, bid due date, performance-guarantee deadline and per-stage footprint allowance."
    roles: [ContractsAdministrator, ApplicationEngineer]
    input: [name, owner_agency_name, "procurement_type?", bid_due_at, guarantee_deadline_at, footprint_allowance_sf_per_stage]
    output: Project
    side_effects:
      - "creates a Project in status DRAFT with delivery_posture ON_TRACK, guarantee_status NOT_STARTED, all three deliverable statuses PENDING and every money field 0"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
  - method: POST
    path: /water-treatment/projects/{project_id}/influent-profiles
    purpose: "Log a sampled influent water-quality profile against the project. Multiple profiles may be logged; only ACCEPTED profiles can govern design."
    roles: [ApplicationEngineer]
    input: [sample_label, design_flow_mgd, "peak_factor?", turbidity_ntu, tds_mg_l, toc_mg_l, chloride_mg_l, temperature_c, ph]
    output: InfluentProfile
    side_effects:
      - "creates an InfluentProfile in qa_status SUBMITTED under the path project"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PROJECT_NOT_FOUND, ERR_INVALID_REQUEST]
  - method: POST
    path: /water-treatment/influent-profiles/{profile_id}/qa-decision
    purpose: "Accept or reject a logged influent profile. Acceptance re-derives the project's governing profile per calculations.governing_influent_profile_selection."
    roles: [QualityEngineer]
    input: [decision, "qa_note?"]
    output: InfluentProfile
    side_effects:
      - "sets qa_status to ACCEPTED or REJECTED, stores qa_decided_by_user_id from X-User-ID and qa_note"
      - "on ACCEPT, re-derives Project.governing_influent_profile_id over the project's ACCEPTED profiles"
      - "increments InfluentProfile.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INFLUENT_PROFILE_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PROFILE_ALREADY_DECIDED]
  - method: POST
    path: /water-treatment/projects/{project_id}/treatment-objectives
    purpose: "Declare a finished-water treatment objective (parameter, limit, averaging basis, regulatory driver). A newer objective for the same parameter retires the incumbent."
    roles: [ApplicationEngineer]
    input: [parameter, limit_value, basis, regulatory_driver]
    output: TreatmentObjective
    side_effects:
      - "creates a TreatmentObjective in status ACTIVE"
      - "any existing ACTIVE TreatmentObjective of the same project with the same parameter is written to RETIRED"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PROJECT_NOT_FOUND, ERR_INVALID_REQUEST]
  - method: POST
    path: /water-treatment/projects/{project_id}/process-selection
    purpose: "Run application engineering: derive the required stage roles from the ACTIVE objectives, pick the least evaluated-cost eligible technology per role against the governing influent profile, and lay out the treatment train. Re-running supersedes the previous train."
    roles: [ApplicationEngineer]
    input: []
    output: TreatmentStage[]
    side_effects:
      - "supersedes every existing TreatmentStage of the project (SELECTED or ENGINEERED to SUPERSEDED)"
      - "creates one TreatmentStage per required role in STAGE_ORDER with computed technology_id, upstream_stage_id, stage_index, design_flow_mgd, evaluated_cost_cents and equipment_base_cost_cents"
      - "moves Project.status DRAFT to SCOPED (a re-run leaves SCOPED unchanged)"
      - "recomputes Project.delivery_posture"
      - "increments Project.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PROJECT_NOT_FOUND, ERR_INVALID_PROJECT_STATE, ERR_NO_ACCEPTED_INFLUENT_PROFILE, ERR_NO_TREATMENT_OBJECTIVES, ERR_NO_ELIGIBLE_TECHNOLOGY]
  - method: POST
    path: /water-treatment/treatment-stages/{stage_id}/equipment-packages
    purpose: "Design an equipment package for a selected stage: choose the wetted material, design pressure and design temperature, and get budgetary pricing."
    roles: [ApplicationEngineer]
    input: [material_spec_id, tag_number, design_pressure_psig, design_temp_c]
    output: EquipmentPackage
    side_effects:
      - "creates an EquipmentPackage in status DRAFT with revision_round 0, code_stamp_required copied from the stage technology's requires_code_stamp and designed_by_user_id from X-User-ID"
      - "computes budgetary_cost_cents from the BUDGETARY variant of calculations.equipment_package_cost; firm_cost_cents stays 0"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_TREATMENT_STAGE_NOT_FOUND, ERR_CATALOG_REF_NOT_FOUND, ERR_INVALID_REQUEST, ERR_DUPLICATE_TAG_NUMBER, ERR_STAGE_SUPERSEDED, ERR_MATERIAL_NOT_RATED_FOR_SERVICE, ERR_MATERIAL_PRESSURE_EXCEEDED, ERR_MATERIAL_NOT_CODE_STAMPABLE]
  - method: PATCH
    path: /water-treatment/equipment-packages/{package_id}
    purpose: "Revise a DRAFT equipment package - swap material, retag, or change the design pressure or temperature - and re-price it budgetarily."
    roles: [ApplicationEngineer]
    input: ["material_spec_id?", "tag_number?", "design_pressure_psig?", "design_temp_c?"]
    output: EquipmentPackage
    side_effects:
      - "overwrites the supplied fields; omitted fields keep their stored values"
      - "recomputes budgetary_cost_cents"
      - "increments EquipmentPackage.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_EQUIPMENT_PACKAGE_NOT_FOUND, ERR_CATALOG_REF_NOT_FOUND, ERR_INVALID_REQUEST, ERR_DUPLICATE_TAG_NUMBER, ERR_PACKAGE_INVALID_STATE, ERR_STAGE_SUPERSEDED, ERR_MATERIAL_NOT_RATED_FOR_SERVICE, ERR_MATERIAL_PRESSURE_EXCEEDED, ERR_MATERIAL_NOT_CODE_STAMPABLE]
  - method: POST
    path: /water-treatment/equipment-packages/{package_id}/submit-for-review
    purpose: "Submit a DRAFT package for independent design review. All material safety and code-stamp screens are re-run at submission against the current governing influent profile."
    roles: [ApplicationEngineer]
    input: ["submittal_note?"]
    output: EquipmentPackage
    side_effects:
      - "moves EquipmentPackage.status DRAFT to IN_REVIEW"
      - "re-stamps budgetary_cost_cents from the BUDGETARY variant of calculations.equipment_package_cost"
      - "increments EquipmentPackage.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_EQUIPMENT_PACKAGE_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PACKAGE_INVALID_STATE, ERR_STAGE_SUPERSEDED, ERR_MATERIAL_NOT_RATED_FOR_SERVICE, ERR_MATERIAL_PRESSURE_EXCEEDED, ERR_MATERIAL_NOT_CODE_STAMPABLE]
  - method: POST
    path: /water-treatment/equipment-packages/{package_id}/review-decision
    purpose: "Render the independent design review: APPROVE freezes the firm price and engineers the stage, REQUEST_REVISION pushes the package back to DRAFT and bumps the revision round."
    roles: [DesignReviewer]
    input: [decision, "review_note?"]
    output: EquipmentPackage
    side_effects:
      - "on APPROVE: status IN_REVIEW to APPROVED, approved_at set to the logical clock, reviewed_by_user_id set from X-User-ID, firm_cost_cents computed from the FIRM variant of calculations.equipment_package_cost together with cost_variance_pct and variance_flag, and the parent TreatmentStage SELECTED to ENGINEERED"
      - "on REQUEST_REVISION: status IN_REVIEW to DRAFT and revision_round incremented by 1"
      - "recomputes Project.delivery_posture; a set variance_flag drives AT_RISK"
      - "increments EquipmentPackage.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SOD_DESIGNER_IS_REVIEWER, ERR_EQUIPMENT_PACKAGE_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PACKAGE_INVALID_STATE, ERR_STAGE_SUPERSEDED]
  - method: POST
    path: /water-treatment/equipment-packages/{package_id}/release-for-fabrication
    purpose: "Release an APPROVED package to the shop floor, minting its skid."
    roles: [FabricationManager]
    input: ["release_note?"]
    output: EquipmentPackage
    side_effects:
      - "moves EquipmentPackage.status APPROVED to RELEASED_FOR_FAB and sets released_at to the logical clock"
      - "creates exactly one Skid with mechanical_status FRAME_SET, controls_status PANEL_BUILD, fat_readiness NOT_READY, rework_count 0, serial_no assigned by the system, and footprint_sf and requires_exclusive_bay derived from the stage technology footprint coefficient and code stamp"
      - "moves Project.status AWARDED to IN_FABRICATION on the project's first release"
      - "increments EquipmentPackage.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_EQUIPMENT_PACKAGE_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PACKAGE_INVALID_STATE, ERR_INVALID_PROJECT_STATE]
  - method: POST
    path: /water-treatment/skids/{skid_id}/milestones
    purpose: "Advance one of the skid's two independent build dimensions (MECHANICAL fabrication, CONTROLS integration) by exactly one step."
    roles: [FabricationManager]
    input: [dimension, to_state, "milestone_note?"]
    output: Skid
    side_effects:
      - "advances mechanical_status or controls_status to the requested successor state"
      - "recomputes fat_readiness per calculations.skid_fat_readiness"
      - "when dimension is MECHANICAL and to_state is MECH_COMPLETE and the parent package sits in REWORK_HOLD, the package returns to RELEASED_FOR_FAB and Project.delivery_posture is recomputed"
      - "increments Skid.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SKID_NOT_FOUND, ERR_INVALID_REQUEST, ERR_SKID_MILESTONE_OUT_OF_ORDER]
  - method: POST
    path: /water-treatment/fat-runs
    purpose: "Book a factory acceptance test run for a FAT-ready skid into a test bay. Bay occupancy is evaluated over the changeover-buffered interval with aggregate footprint capacity."
    roles: [FabricationManager]
    input: [skid_id, test_bay_id, scheduled_start_at, scheduled_end_at, expected_skid_version]
    output: FatRun
    side_effects:
      - "creates a FatRun in status SCHEDULED with round_no one greater than the skid's highest existing round_no, footprint_sf copied from the skid and duration_minutes derived from the scheduled window"
      - "any existing SCHEDULED FatRun of the same skid is written to SUPERSEDED and its footprint-minutes are released from its bay ledger"
      - "adds footprint_sf * duration_minutes to TestBay.reserved_footprint_minutes"
      - "increments Skid.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CATALOG_REF_NOT_FOUND, ERR_INVALID_REQUEST, ERR_STALE_SKID_VERSION, ERR_SKID_NOT_FAT_READY, ERR_TEST_BAY_UNAVAILABLE, ERR_TEST_BAY_EXCLUSIVE_CONFLICT, ERR_TEST_BAY_CAPACITY_EXCEEDED]
  - method: POST
    path: /water-treatment/fat-runs/{run_id}/witness-result
    purpose: "Witness and record the outcome of a scheduled FAT run. FAIL drives the skid and its package into rework; PASS may complete fabrication for the whole project."
    roles: [QualityEngineer]
    input: [result, punchlist_item_count, "result_note?"]
    output: FatRun
    side_effects:
      - "moves FatRun.status SCHEDULED to PASSED, CONDITIONAL or FAILED, stores punchlist_item_count, witnessed_by_user_id from X-User-ID and result_note"
      - "releases footprint_sf * duration_minutes from TestBay.reserved_footprint_minutes"
      - "on PASS: the parent EquipmentPackage moves RELEASED_FOR_FAB to FAT_PASSED, and when it is the project's last outstanding package the Project moves IN_FABRICATION to COMMISSIONING"
      - "on FAIL: Skid.mechanical_status MECH_COMPLETE to REWORK, rework_count incremented, fat_readiness recomputed to BLOCKED, the parent EquipmentPackage moves RELEASED_FOR_FAB to REWORK_HOLD and Project.delivery_posture becomes HELD"
      - "on CONDITIONAL: no package or skid transition, but Project.delivery_posture is recomputed to AT_RISK"
      - "increments FatRun.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SOD_DESIGNER_IS_REVIEWER, ERR_FAT_RUN_NOT_FOUND, ERR_INVALID_REQUEST, ERR_FAT_RUN_NOT_SCHEDULED, ERR_SKID_NOT_FAT_READY]
  - method: POST
    path: /water-treatment/fat-runs/{run_id}/cancel
    purpose: "Cancel a scheduled FAT run and hand the reserved bay footprint-minutes back."
    roles: [FabricationManager]
    input: ["cancel_reason?"]
    output: FatRun
    side_effects:
      - "moves FatRun.status SCHEDULED to CANCELLED"
      - "subtracts footprint_sf * duration_minutes from TestBay.reserved_footprint_minutes, restoring the ledger exactly"
      - "increments FatRun.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_FAT_RUN_NOT_FOUND, ERR_INVALID_REQUEST, ERR_FAT_RUN_NOT_SCHEDULED]
  - method: POST
    path: /water-treatment/or-equal-submittals
    purpose: "Open an or-equal submittal against a municipal specification section, naming the basis-of-design product the offered equipment claims equality with."
    roles: [ApplicationEngineer]
    input: [project_id, spec_section, named_basis_of_design]
    output: OrEqualSubmittal
    side_effects:
      - "creates an OrEqualSubmittal in status DRAFT with revision_round 0, compliance_score 100.00, open_fundamental_count 0 and authored_by_user_id from X-User-ID"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CATALOG_REF_NOT_FOUND, ERR_INVALID_REQUEST]
  - method: POST
    path: /water-treatment/or-equal-submittals/{submittal_id}/spec-deviations
    purpose: "Disclose one deviation from the specified basis of design on a DRAFT submittal. Each disclosure re-scores the submittal's specification compliance."
    roles: [ApplicationEngineer]
    input: [spec_paragraph, severity, description, expected_or_equal_submittal_version]
    output: SpecDeviation
    side_effects:
      - "creates a SpecDeviation in disposition PENDING with weighted_penalty_points from DEVIATION_WEIGHTS"
      - "recomputes OrEqualSubmittal.compliance_score and open_fundamental_count per calculations.or_equal_compliance_score"
      - "increments OrEqualSubmittal.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SUBMITTAL_NOT_FOUND, ERR_INVALID_REQUEST, ERR_STALE_SUBMITTAL_VERSION, ERR_SUBMITTAL_INVALID_STATE]
  - method: POST
    path: /water-treatment/spec-deviations/{deviation_id}/disposition
    purpose: "The engineer of record dispositions a disclosed deviation. ACCEPTED deviations carry a quarter of their penalty, WITHDRAWN deviations carry none."
    roles: [EngineerOfRecord]
    input: [disposition, "disposition_note?"]
    output: SpecDeviation
    side_effects:
      - "moves SpecDeviation.disposition PENDING to ACCEPTED, REJECTED or WITHDRAWN and stores dispositioned_by_user_id from X-User-ID"
      - "recomputes the parent submittal's compliance_score and open_fundamental_count"
      - "increments SpecDeviation.version by 1 and OrEqualSubmittal.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_DEVIATION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_DEVIATION_ALREADY_DISPOSITIONED]
  - method: POST
    path: /water-treatment/or-equal-submittals/{submittal_id}/submit
    purpose: "Submit the or-equal package to the engineer of record for pre-approval as an equal product. The compliance-score floor and the bid window are both enforced here."
    roles: [ApplicationEngineer]
    input: ["transmittal_note?"]
    output: OrEqualSubmittal
    side_effects:
      - "moves OrEqualSubmittal.status DRAFT to SUBMITTED and sets submitted_at to the logical clock"
      - "increments OrEqualSubmittal.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SUBMITTAL_NOT_FOUND, ERR_INVALID_REQUEST, ERR_SUBMITTAL_INVALID_STATE, ERR_COMPLIANCE_SCORE_TOO_LOW, ERR_BID_WINDOW_CLOSED]
  - method: POST
    path: /water-treatment/or-equal-submittals/{submittal_id}/engineer-decision
    purpose: "The engineer of record pre-approves, rejects or returns the or-equal submittal. Pre-approval unblocks bidding; rejection withdraws every pending deviation and blocks the bid."
    roles: [EngineerOfRecord]
    input: [decision, "decision_note?"]
    output: OrEqualSubmittal
    side_effects:
      - "on PRE_APPROVED: status SUBMITTED to PRE_APPROVED, decided_by_user_id set from X-User-ID, and Project.status SCOPED or BID_BLOCKED moves to BID_READY"
      - "on REQUEST_REVISION: status SUBMITTED to DRAFT and revision_round incremented by 1"
      - "on REJECTED: status SUBMITTED to REJECTED, every PENDING child SpecDeviation is written to WITHDRAWN, compliance_score and open_fundamental_count are recomputed over the new dispositions, and Project.status SCOPED moves to BID_BLOCKED"
      - "increments OrEqualSubmittal.version by 1 and Project.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SUBMITTAL_NOT_FOUND, ERR_INVALID_REQUEST, ERR_SUBMITTAL_INVALID_STATE, ERR_FUNDAMENTAL_DEVIATION_OPEN, ERR_COMPLIANCE_SCORE_TOO_LOW]
  - method: POST
    path: /water-treatment/projects/{project_id}/bid
    purpose: "Post the municipal bid: roll up firm package costs into the evaluated bid price with overhead, tiered bond premium and posture contingency, then check the offered price against the margin floor."
    roles: [ContractsAdministrator]
    input: [offered_price_cents]
    output: Project
    side_effects:
      - "computes and stores base_bid_amount_cents, bond_premium_cents, contingency_cents and evaluated_bid_price_cents per calculations.bid_evaluated_price"
      - "stores offered_price_cents and moves Project.status BID_READY to BID_SUBMITTED"
      - "increments Project.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SOD_AUTHOR_IS_BIDDER, ERR_PROJECT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_PROJECT_STATE, ERR_BID_ALREADY_SUBMITTED, ERR_OR_EQUAL_NOT_PREAPPROVED, ERR_BID_WINDOW_CLOSED, ERR_BID_MARGIN_BELOW_FLOOR]
  - method: POST
    path: /water-treatment/projects/{project_id}/award
    purpose: "Record the owner's award decision. An award freezes the contract amount at the offered price; a non-award closes the project."
    roles: [ContractsAdministrator]
    input: [award_decision]
    output: Project
    side_effects:
      - "on AWARDED: status BID_SUBMITTED to AWARDED, contract_amount_cents set to offered_price_cents and awarded_at set to the logical clock"
      - "on NOT_AWARDED: status BID_SUBMITTED to CLOSED"
      - "increments Project.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PROJECT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_PROJECT_STATE]
  - method: POST
    path: /water-treatment/performance-demos
    purpose: "Record a performance-guarantee demonstration run on a commissioned skid, with one or more finished-water readings per objective parameter."
    roles: [CommissioningEngineer]
    input: [project_id, skid_id, window_start_at, window_end_at, readings]
    output: PerformanceDemo
    side_effects:
      - "creates a PerformanceDemo in result PENDING with round_no one greater than the project's highest existing round_no, evaluation empty, min_margin_pct null and recorded_by_user_id from X-User-ID"
      - "moves the skid's EquipmentPackage FAT_PASSED to SHIPPED"
      - "moves Project.guarantee_status NOT_STARTED to DEMONSTRATING"
      - "increments Project.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CATALOG_REF_NOT_FOUND, ERR_INVALID_REQUEST, ERR_DEMO_WINDOW_CONFLICT, ERR_GUARANTEE_PREREQ_NOT_MET, ERR_MAX_DEMO_ROUNDS_EXCEEDED]
  - method: POST
    path: /water-treatment/performance-demos/{demo_id}/certify
    purpose: "Certify a recorded demonstration against every ACTIVE treatment objective on its declared averaging basis, applying the guarantee margin band and, on final-round failure, the liquidated-damages formula."
    roles: [QualityEngineer]
    input: [certification, "certification_note?"]
    output: PerformanceDemo
    side_effects:
      - "computes evaluation and min_margin_pct per calculations.performance_guarantee_evaluation and writes result to PASSED, CONDITIONAL_PASS or FAILED"
      - "stores certified_by_user_id from X-User-ID"
      - "on PASSED: Project.guarantee_status becomes MET, Project.status COMMISSIONING moves to GUARANTEED, and every PENDING_ACTIVATION ServiceAgreement of the project becomes ACTIVE with activated_at set to the logical clock and reserve_available_cents seeded to reserve_funded_cents, after which the Project moves GUARANTEED to SERVICE_ACTIVE"
      - "on FAILED at the final allowed round: Project.guarantee_status becomes DEFAULTED, Project.status COMMISSIONING moves to REMEDIATION and liquidated_damages_cents is computed per calculations.liquidated_damages"
      - "recomputes Project.delivery_posture"
      - "increments PerformanceDemo.version by 1 and Project.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SOD_RECORDER_IS_CERTIFIER, ERR_DEMO_NOT_FOUND, ERR_INVALID_REQUEST, ERR_DEMO_ALREADY_CERTIFIED, ERR_DEMO_READING_MISSING]
  - method: POST
    path: /water-treatment/projects/{project_id}/deliverable-acceptance
    purpose: "The owner's representative accepts or rejects one closeout deliverable: the operations and maintenance manual, the operator training programme, or the recommended spare-parts list. deliverable_type is one of OM_MANUAL, OPERATOR_TRAINING or SPARE_PARTS_LIST, addressing Project.om_manual_status, Project.operator_training_status and Project.spare_parts_list_status respectively; decision is ACCEPT or REJECT."
    roles: [OwnerRepresentative]
    input: [deliverable_type, decision]
    output: Project
    side_effects:
      - "writes the addressed deliverable status field to ACCEPTED or REJECTED"
      - "increments Project.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PROJECT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_DELIVERABLE_ALREADY_ACCEPTED]
  - method: POST
    path: /water-treatment/projects/{project_id}/service-agreements
    purpose: "Open the long-term service, membrane replacement and consumable supply agreement once all three closeout deliverables are accepted."
    roles: [ContractsAdministrator]
    input: [term_months, annual_fee_cents, reserve_funded_cents, membrane_installed_at]
    output: ServiceAgreement
    side_effects:
      - "creates a ServiceAgreement with expires_at derived as membrane_installed_at plus term_months, all three reserve commitment fields 0 and settlement_variance_cents 0"
      - "status is PENDING_ACTIVATION, or ACTIVE with activated_at set and reserve_available_cents seeded to reserve_funded_cents when the project already sits in GUARANTEED, in which case the Project moves GUARANTEED to SERVICE_ACTIVE"
      - "increments Project.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PROJECT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_PROJECT_STATE, ERR_DELIVERABLES_INCOMPLETE]
  - method: POST
    path: /water-treatment/service-agreements/{agreement_id}/consumable-draws
    purpose: "Post a consumable or membrane-replacement draw against the service reserve. The accrual line governs availability; the settled line records the invoiced truth."
    roles: [ContractsAdministrator]
    input: [draw_type, item_code, quantity, catalog_unit_cost_cents, invoiced_unit_cost_cents, expected_service_agreement_version]
    output: ConsumableDraw
    side_effects:
      - "creates an append-only ConsumableDraw row with accrual_amount_cents, settled_amount_cents and warranty_credit_cents from calculations.service_reserve_balance and posted_by_user_id from X-User-ID"
      - "adds the accrual line to reserve_committed_accrual_cents, adds the settled line to reserve_committed_settled_cents, decreases reserve_available_cents by the accrual line and recomputes settlement_variance_cents"
      - "when the draw drives reserve_available_cents to exactly 0 the agreement moves ACTIVE to SUSPENDED"
      - "increments ServiceAgreement.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SERVICE_AGREEMENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_STALE_AGREEMENT_VERSION, ERR_AGREEMENT_EXPIRED, ERR_AGREEMENT_NOT_ACTIVE, ERR_INVALID_DRAW_QUANTITY, ERR_RESERVE_INSUFFICIENT]
  - method: POST
    path: /water-treatment/consumable-draws/{draw_id}/reversal
    purpose: "Compensate a posted draw by minting a REVERSAL row. The original row is never mutated; the reserve invariant is restored exactly."
    roles: [ContractsAdministrator]
    input: ["reversal_reason?"]
    output: ConsumableDraw
    side_effects:
      - "creates a new ConsumableDraw row with draw_type REVERSAL, reverses_draw_id pointing at the target draw, and accrual_amount_cents and settled_amount_cents equal to the negated amounts of the target"
      - "subtracts the reversed accrual from reserve_committed_accrual_cents, subtracts the reversed settled amount from reserve_committed_settled_cents, adds the reversed accrual back to reserve_available_cents and recomputes settlement_variance_cents"
      - "a SUSPENDED agreement returns to ACTIVE once reserve_available_cents is positive again"
      - "increments ServiceAgreement.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONSUMABLE_DRAW_NOT_FOUND, ERR_INVALID_REQUEST, ERR_DRAW_ALREADY_REVERSED, ERR_AGREEMENT_EXPIRED]
