  - section: cross_cutting_complexity_layers
    instances:
      - name: measurement_create_with_stale_expected_commitment_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.measurement-create-stale-commitment
          - errors.ERR_STALE_COMMITMENT_VERSION
          - validations[priority=9]
          - endpoints[POST /gpo/compliance-measurements]
        distinguishing_aspect: "The OCC guard here protects a write that no state rule would stop: two measurements over DIFFERENT periods on the same commitment are both legal, so only the version token catches the second writer working from a snapshot the first create already moved. Because the create itself bumps Commitment.version, a client that opens one period and then reuses the same token for the next period is always stale by exactly one — the token has to be re-read between writes, and the failure is 412 with no row created."
        test_recipe:
          setup: ["ACTIVE contract C-OCC; member M-1 with a countersigned ACTIVE commitment; no purchase data (the measurement rows stay at zero, which keeps the focus on the token)."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-OCC", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/members"
              payload: { member_code: "M-1", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 } ] }
              as: ContractManager
              captures: { m1: $.data.id }
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m1}", contract_id: "${c1}", elected_tier_code: "TIER_0", committed_volume_units: 100, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { k1: $.data.id }
            - call: "POST /gpo/commitments/${k1}/lop/issue"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/commitments/${k1}/lop/sign"
              payload: { signer_name: "Dana Whitfield" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
            - call: "POST /gpo/commitments/${k1}/lop/countersign"
              payload: {}
              as: ContractManager
            - call: "GET /gpo/commitments/${k1}"
              payload: {}
              as: ComplianceAnalyst
              captures: { kv1: $.data.version }
          trigger:
            - call: "POST /gpo/compliance-measurements"
              payload: { commitment_id: "${k1}", period_start: "2026-08-01", period_end: "2026-09-01", expected_commitment_version: "${kv1}" }
              as: ComplianceAnalyst
              captures: { ms1: $.data.id }
            - call: "GET /gpo/commitments/${k1}"
              payload: {}
              as: ComplianceAnalyst
              captures: { kv2: $.data.version }
            - call: "POST /gpo/compliance-measurements"
              payload: { commitment_id: "${k1}", period_start: "2026-09-01", period_end: "2026-10-01", expected_commitment_version: "${kv1}" }
              as: ComplianceAnalyst
              captures: { e1: $.data.error_id }
            - call: "POST /gpo/compliance-measurements"
              payload: { commitment_id: "${k1}", period_start: "2026-09-01", period_end: "2026-10-01", expected_commitment_version: "${kv2}" }
              as: ComplianceAnalyst
              captures: { ms2: $.data.id, st2: $.data.status }
            - call: "GET /gpo/commitments/${k1}"
              payload: {}
              as: ComplianceAnalyst
              captures: { kv3: $.data.version }
            - call: "POST /gpo/compliance-measurements"
              payload: { commitment_id: "${k1}", period_start: "2026-09-01", period_end: "2026-10-01", expected_commitment_version: "${kv3}" }
              as: ComplianceAnalyst
              captures: { e2: $.data.error_id }
          assert:
            - "the first create returns 201 and ${kv2} == ${kv1} + 1 — the create is itself a write against the commitment"
            - "${e1} == ERR_STALE_COMMITMENT_VERSION with HTTP 412 — the September period is legal but the token is one behind"
            - "no ComplianceMeasurement was created by the refused call: listing the commitment's measurements right after it still returns exactly one row, ${ms1}"
            - "the retry with the re-read token returns 201 with ${ms2} != ${ms1} and ${st2} == DRAFT, and ${kv3} == ${kv2} + 1"
            - "${e2} == ERR_DUPLICATE_MEASUREMENT_PERIOD with HTTP 409 and NOT 412 — with a fresh token the duplicate-period rule at priority 15 is what refuses, which pins the token check strictly earlier"

      - name: contract_item_base_price_patch_with_stale_expected_contract_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.item-price-update-stale-contract
          - errors.ERR_STALE_CONTRACT_VERSION
          - errors.ERR_BASE_PRICE_BELOW_FLOOR
          - validations[priority=9]
          - validations[priority=23]
        distinguishing_aspect: "This is the second concurrency rule and it guards a CHILD write with the PARENT's version: repricing an item consumes Contract.version, so two successive edits to the same item need two different tokens even though the item's own version also moves. Pairing the stale token with a below-floor price shows the ordering directly — the same request that would fail the fiscal floor check at priority 23 fails with 412 at priority 9 instead, and neither the price nor either version moves."
        test_recipe:
          setup: ["ACTIVE contract C-RP with item V-1 at base 10000 and floor 8200."]
          setup_api_calls:
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-RP", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/contracts/${c1}/items"
              payload: { vendor_item_number: "V-1", item_description: "Suture 3-0 absorbable", uom: "EA", units_per_uom: 1, base_price_cents: 10000, floor_price_cents: 8200, requires_evidence: false }
              as: ContractManager
              captures: { i1: $.data.id, iv1: $.data.version }
            - call: "GET /gpo/contracts/${c1}"
              payload: {}
              as: ContractManager
              captures: { cv1: $.data.version }
          trigger:
            - call: "PATCH /gpo/contract-items/${i1}/base-price"
              payload: { base_price_cents: 9500, expected_contract_version: "${cv1}" }
              as: ContractManager
              captures: { bp1: $.data.base_price_cents, iv2: $.data.version }
            - call: "GET /gpo/contracts/${c1}"
              payload: {}
              as: ContractManager
              captures: { cv2: $.data.version }
            - call: "PATCH /gpo/contract-items/${i1}/base-price"
              payload: { base_price_cents: 9300, expected_contract_version: "${cv1}" }
              as: ContractManager
              captures: { e1: $.data.error_id }
            - call: "PATCH /gpo/contract-items/${i1}/base-price"
              payload: { base_price_cents: 8000, expected_contract_version: "${cv1}" }
              as: ContractManager
              captures: { e2: $.data.error_id }
            - call: "PATCH /gpo/contract-items/${i1}/base-price"
              payload: { base_price_cents: 8000, expected_contract_version: "${cv2}" }
              as: ContractManager
              captures: { e3: $.data.error_id }
            - call: "PATCH /gpo/contract-items/${i1}/base-price"
              payload: { base_price_cents: 8200, expected_contract_version: "${cv2}" }
              as: ContractManager
              captures: { bp2: $.data.base_price_cents, iv3: $.data.version }
            - call: "GET /gpo/contract-items/${i1}"
              payload: {}
              as: ContractManager
              captures: { bp3: $.data.base_price_cents }
          assert:
            - "the first patch returns 200 with ${bp1} == 9500, ${iv2} == ${iv1} + 1 and ${cv2} == ${cv1} + 1 — one edit consumes one parent version"
            - "${e1} == ERR_STALE_CONTRACT_VERSION with HTTP 412 — a perfectly legal second edit is refused purely on the token"
            - "${e2} == ERR_STALE_CONTRACT_VERSION and NOT ERR_BASE_PRICE_BELOW_FLOOR, even though 8000 is under the 8200 floor: priority 9 precedes priority 23"
            - "${e3} == ERR_BASE_PRICE_BELOW_FLOOR with HTTP 409 — with the current token the same body reaches the fiscal check"
            - "the floor is inclusive: 8200 is accepted, so ${bp2} == 8200 with ${iv3} == ${iv2} + 1"
            - "${bp3} == 8200 — none of the three refused calls left a partial write, so the price moved exactly twice across seven calls"

      - name: leakage_flag_not_raised_at_exactly_the_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.DistributorFile.VALIDATING_to_LOADED
          - entities.Commitment.fields.leakage_flag
          - entities.Member.fields.watchlist_status
          - entities.Contract.fields.leakage_alert_threshold_pct
        distinguishing_aspect: "The alert is a cumulative rate over the year-to-date ledgers, not a per-file rate, and its comparison is strictly greater-than against leakage_alert_threshold_pct. A first file landing on EXACTLY 15.00 percent leaves both the flag and the member watchlist alone; a second, tiny file that nudges the cumulative rate to 15.13 raises both in one cascade; reversing that second file drops the rate back to exactly 15.00 and resets both. The boundary is therefore exercised from below, from above, and on the way back down through the same threshold."
        test_recipe:
          setup: ["ACTIVE contract C-TH taking the default leakage_alert_threshold_pct of 15.00, item V-1 at base 10000 (TIER_0 discount 0, so the governing price is 10000); member M-1 with a countersigned ACTIVE commitment, APPROVED cross-reference MI-1 to V-1 (conversion_factor 1.0) and one ACTIVE TIER_PRICE activation covering 2026-08-01 to 2026-12-31."]
