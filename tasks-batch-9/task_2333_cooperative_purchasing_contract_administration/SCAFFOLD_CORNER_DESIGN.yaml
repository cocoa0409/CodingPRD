              payload: { action: "VERIFY" }
              as: CoopAdministrator
              as_user_id: "adm-review-02"
              captures: { e_np: $.data.error_id }
            - call: "POST /coop/member-agencies/${mem_np3_id}/registration"
              payload: { action: "VERIFY" }
