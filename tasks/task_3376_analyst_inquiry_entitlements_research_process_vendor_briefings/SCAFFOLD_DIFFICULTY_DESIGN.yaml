            - "Analyst.${an1_id}.conflicted_vendor_ids == [${ven1_id}]"
            - "VendorBriefing.${brief_id}.status == REVOKED_BY_SEPARATION"
            - "VendorBriefing.${brief_id}.separation_check_result == FAIL_SALES_RELATIONSHIP"
