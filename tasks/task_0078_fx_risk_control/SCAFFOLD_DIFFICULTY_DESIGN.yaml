scaffold_difficulty_design:

  # =============================================================================
  # Rule 1 — Dual-variant calculations across different entity domains (≥2)
  # =============================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: limit_utilization_intraday_vs_overnight
        grounds:
          - calculations.limit_utilization
          - entities.Limit.fields.bucket
          - entities.Limit.fields.notional_cap_usd
          - entities.Position.fields.net_open_usd
        distinguishing_aspect: |
          The same Position.net_open_usd produces two different utilization_pct values when read against
          the INTRADAY Limit row vs the OVERNIGHT Limit row because both the cap (notional_cap_usd)
          and the inclusion window differ. Domain: Limit entity (trader limit management).
        test_recipe:
          setup:
            - "Clock set to 2026-05-13T10:00:00Z (intraday window)."
            - "POST /fx-risk/currency-pairs {code=EURUSD, base_ccy=EUR, quote_ccy=USD, mid_rate=1.000000, daily_volatility=0.008}"
            - "POST /fx-risk/traders {name=Alice, desk_code=G10_SPOT} → trader_alice"
            - "POST /fx-risk/traders/{trader_alice}/limits {pair_code=EURUSD, bucket=INTRADAY, notional_cap_usd=10000000.00, stop_loss_cap_usd=100000.00}"
            - "POST /fx-risk/traders/{trader_alice}/limits {pair_code=EURUSD, bucket=OVERNIGHT, notional_cap_usd=5000000.00, stop_loss_cap_usd=100000.00}"
            - "Counterparty C with rating INVESTMENT (external=AAA, internal=90) so credit_limit_usd=100000000."
          trigger:
            - "POST /fx-risk/trades {pair_code=EURUSD, side=BUY, notional_base=4000000.00, entry_rate=1.000000, counterparty_id=C} as Alice"
          assert:
            - "GET /fx-risk/traders/{trader_alice}/limits returns INTRADAY row with utilization_pct == 40.00 and warning_status == NORMAL"
            - "Same call returns OVERNIGHT row with utilization_pct == 80.00 and warning_status == WARNING"
            - "Both rows share identical Position.net_open_usd == 4000000.00 (proving the divergence is from different caps, not different inputs)"

      - name: counterparty_credit_band_worse_of_two
        grounds:
          - calculations.counterparty_credit_limit
          - entities.Counterparty.fields.external_rating
          - entities.Counterparty.fields.internal_score
          - entities.Counterparty.fields.rating_band
          - entities.Counterparty.fields.credit_limit_usd
        distinguishing_aspect: |
          Counterparty.rating_band depends on the worse of band_from_external and band_from_internal.
          With (external=A, internal=70) the band is STANDARD → credit_limit_usd=50000000.00.
          With (external=A, internal=30) the band collapses to WATCH → credit_limit_usd=1000000.00.
          Same external input, different internal input, two valid algorithms (external-only vs internal-only)
          that would each produce STANDARD or WATCH alone; the worse-of rule pins the answer.
          Domain: Counterparty entity (credit rating), distinct from Limit-utilization domain.
        test_recipe:
          setup:
            - "POST /fx-risk/counterparties {name=CpStandard, external_rating=A, internal_score=70} → cp_std"
            - "POST /fx-risk/counterparties {name=CpWatch, external_rating=A, internal_score=30} → cp_watch"
          trigger:
            - "GET /fx-risk/counterparties/{cp_std} (or equivalently in any reads of these objects)"
            - "GET /fx-risk/counterparties/{cp_watch}"
          assert:
            - "Counterparty cp_std.rating_band == 'STANDARD' and credit_limit_usd == 50000000.00 and on_watchlist == false"
            - "Counterparty cp_watch.rating_band == 'WATCH'    and credit_limit_usd == 1000000.00  and on_watchlist == true"

  # =============================================================================
  # Rule 2 — Combinatorial formulas across different modes (≥2, ≥2 modes)
  # =============================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: var_round_per_position_then_sum
        grounds:
          - calculations.value_at_risk
          - entities.CurrencyPair.fields.daily_volatility
          - entities.Position.fields.net_open_usd
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins ROUND_ORDER=per_position_then_sum
          (see calculations.value_at_risk.constants.ROUND_ORDER). A correct VaR implementation MUST round each
          per-position contribution to 2 dp half-up BEFORE summing; any implementation that sums raw products and
          rounds once at the end is wrong even when the final cent happens to coincide for some inputs. The
          assertion below pins both the per-position literals and the final literal so the test fails if either
          stage is wrong.
        test_recipe:
          setup:
            - "POST /fx-risk/currency-pairs {code=EURUSD, base_ccy=EUR, quote_ccy=USD, mid_rate=1.000000, daily_volatility=0.001595}"
            - "POST /fx-risk/currency-pairs {code=GBPUSD, base_ccy=GBP, quote_ccy=USD, mid_rate=1.000000, daily_volatility=0.001597}"
            - "Trader alice with INTRADAY limit notional_cap_usd=10000000, INVESTMENT counterparty C"
            - "POST /fx-risk/trades {pair_code=EURUSD, side=BUY, notional_base=1000000.00, entry_rate=1.000000, counterparty_id=C}"
            - "POST /fx-risk/trades {pair_code=GBPUSD, side=BUY, notional_base=1000000.00, entry_rate=1.000000, counterparty_id=C}"
          trigger:
            - "GET /fx-risk/traders/{alice}/var"
          assert:
            - "Response.data.var_99_1d_usd == round_half_up(1000000*0.001595*2.326, 2) + round_half_up(1000000*0.001597*2.326, 2) == 3710.17 + 3714.82 == 7424.99"
            - "Note: literal 7424.99 was computed by the scaffold author: 1000000*0.001595*2.326 = 3710.17, 1000000*0.001597*2.326 = 3714.8222 → 3714.82; sum = 7424.99 USD"

      - name: net_vs_gross_combinatorial_aggregation
        grounds:
          - calculations.gross_exposure
          - entities.Position.fields.net_open_usd
        distinguishing_aspect: |
          Mode (a): ≥3 inputs with non-linear interaction. Three Positions across three pairs combine via two
          DIFFERENT aggregation paths (gross = sum of absolute USD per pair; net = leg decomposition into ISO
          currencies, then sum of absolute leg USD). Same inputs, two formulas, two answers, both defined.
          Distinct mode from instance 1 (rounding-order) so the two instances exercise different combinatorial
          axes per §0.5 Rule 2.
        test_recipe:
          setup:
            - "CurrencyPair EURUSD mid_rate 1.10; GBPUSD mid_rate 1.25; EURGBP mid_rate 0.88"
            - "Trader alice with INTRADAY notional_cap_usd 100000000, INVESTMENT counterparty C"
            - "POST /fx-risk/trades {pair=EURUSD, side=BUY, notional_base=1000000, entry_rate=1.10, counterparty=C}  # +1.1M USD position"
            - "POST /fx-risk/trades {pair=GBPUSD, side=SELL, notional_base=1000000, entry_rate=1.25, counterparty=C} # -1.25M USD position"
          trigger:
            - "GET /fx-risk/traders/{alice}/exposure"
          assert:
            - "gross_usd == abs(1100000.00) + abs(-1250000.00) == 2350000.00"
            - "net_usd is computed from leg decomposition; gross_usd != net_usd (gross strictly larger because legs partially offset on the USD axis)"
            - "Specifically gross_usd == 2350000.00 — pinned literal computed by scaffold author"

  # =============================================================================
  # Rule 3 — Non-linear state-machine shape on different entities (≥2)
  # =============================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: limit_adjustment_revision_cycle
        grounds:
          - state_machines.LimitAdjustmentRequest.PENDING_to_REVISION_REQUESTED
          - state_machines.LimitAdjustmentRequest.REVISION_REQUESTED_to_PENDING
          - state_machines.LimitAdjustmentRequest.PENDING_to_APPROVED
        distinguishing_aspect: |
          LimitAdjustmentRequest exhibits a cycle PENDING → REVISION_REQUESTED → PENDING that can repeat
          before terminating at APPROVED/REJECTED/EXPIRED — non-linear by §0.5 (cycle on this entity).
        test_recipe:
          setup:
            - "Trader bob with one Limit row L1; RiskOfficer ro1."
            - "POST /fx-risk/limit-adjustments {limit_id=L1, requested_delta_usd=1000000, justification='vol', expires_at='2026-06-13T00:00:00Z'} as bob → req1 (PENDING)"
          trigger:
            - "POST /fx-risk/limit-adjustments/{req1}/request-revision as ro1 → REVISION_REQUESTED"
            - "PATCH /fx-risk/limit-adjustments/{req1} {justification='vol-rev', version=2} as bob → PENDING"
            - "POST /fx-risk/limit-adjustments/{req1}/approve as ro1 → APPROVED"
          assert:
            - "After the three transitions req1.status == 'APPROVED' and the entity has cycled PENDING→REVISION_REQUESTED→PENDING→APPROVED"
            - "req1.version >= 4 (each transition is a mutation that bumps version)"

      - name: stop_loss_override_cycle
        grounds:
          - state_machines.StopLossEvent.TRIGGERED_to_ACKNOWLEDGED
          - state_machines.StopLossEvent.ACKNOWLEDGED_to_OVERRIDDEN
          - state_machines.StopLossEvent.OVERRIDDEN_to_ARMED
        distinguishing_aspect: |
          StopLossEvent has a cycle ARMED → TRIGGERED → ACKNOWLEDGED → OVERRIDDEN → ARMED. Different entity
          from instance 1 (LimitAdjustmentRequest), so the two non-linear machines belong to different entities
          as §0.5 requires.
        test_recipe:
          setup:
            - "Trader carol with a BUY position on EURUSD; RiskOfficer ro1."
            - "POST /fx-risk/stop-loss {trader_id=carol, pair_code=EURUSD, rule_mode=PRICE, threshold_value=1.0950, action=ALERT} as ro1 → sl1 (ARMED)"
            - "POST /fx-risk/market-data/quote {code=EURUSD, mid_rate=1.0950} → sl1 transitions to TRIGGERED"
          trigger:
            - "POST /fx-risk/stop-loss/{sl1}/acknowledge as carol → ACKNOWLEDGED"
            - "POST /fx-risk/stop-loss/{sl1}/override as ro1 → OVERRIDDEN"
            - "POST /fx-risk/_sweep/run as ro1 → ARMED"
          assert:
            - "After the sweep, sl1.state == 'ARMED' and sl1.triggered_at is null and sl1.triggering_value is null"

  # =============================================================================
  # Rule 4 — Transitive cascade chains from different triggers (≥2, depths ≥3 and ≥2)
  # =============================================================================
  - rule_id: transitive_cascade
    instances:
      - name: settlement_failure_to_trader_suspension_depth_4
        grounds:
          - state_machines.SettlementInstruction.SENT_to_FAILED
          - entities.Counterparty.fields.internal_score
          - entities.Counterparty.fields.rating_band
          - entities.Counterparty.fields.credit_limit_usd
          - entities.Trader.fields.status
        distinguishing_aspect: |
          Depth-4 chain originating at POST /settlements/{id}/mark-failed:
          step 1 (SettlementInstruction → Counterparty): internal_score decremented by 5;
          step 2 (Counterparty → Counterparty): step-1 score change ITSELF recomputes rating_band;
          step 3 (Counterparty → Counterparty.credit_limit_usd): step-2 band change recomputes credit_limit;
          step 4 (Counterparty.credit_limit → Trader.status): step-3 limit drop ITSELF re-evaluates aggregate
          notional facing this counterparty and suspends any trader whose exposure exceeds the new ceiling.
          Each link caused by the previous link (not by the original mark-failed call directly).
        test_recipe:
          setup:
            - "Counterparty cp with external_rating=BBB, internal_score=44 (just above SPECULATIVE/WATCH edge → rating_band=SPECULATIVE, credit_limit_usd=10000000)"
            - "Trader dave with INTRADAY limit 50000000; books trade BUY EURUSD notional_base=9000000 entry_rate=1.0000 counterparty=cp → 9M USD facing cp"
            - "POST /fx-risk/settlements/generate as SettlementOperator → instruction si1; POST /settlements/{si1}/send"
          trigger:
            - "POST /fx-risk/settlements/{si1}/mark-failed as SettlementOperator"
          assert:
            - "Counterparty cp.internal_score == 39 (44 - 5; step 1)"
            - "Counterparty cp.rating_band == 'WATCH' (step 2, since 39 < 40)"
            - "Counterparty cp.credit_limit_usd == 1000000.00 (step 3)"
            - "Trader dave.status == 'SUSPENDED' (step 4 — 9M facing exposure now exceeds 1M ceiling)"

      - name: limit_approval_recasts_warning_depth_3
        grounds:
          - state_machines.LimitAdjustmentRequest.PENDING_to_APPROVED
          - entities.Limit.fields.temporary_override_usd
          - entities.Limit.fields.utilization_pct
          - entities.Position.fields.warning_status
        distinguishing_aspect: |
          Depth-3 chain originating at POST /limit-adjustments/{id}/approve:
          step 1: Limit.temporary_override_usd increased;
          step 2: step-1 change ITSELF causes Limit.utilization_pct recompute (denominator grew);
          step 3: step-2 change ITSELF flips Position.warning_status from BREACH back to WARNING/NORMAL.
          Different trigger from instance 1 (settlement failure), satisfying §0.5 "different triggering transitions".
        test_recipe:
          setup:
            - "Trader eve with INTRADAY notional_cap_usd=5000000; Position at net_open_usd=5500000 → utilization_pct=110, warning_status=BREACH"
            - "POST /fx-risk/limit-adjustments {limit_id=L, requested_delta_usd=2000000, expires_at=future} as eve → req"
          trigger:
            - "POST /fx-risk/limit-adjustments/{req}/approve as RiskOfficer"
          assert:
            - "Limit.temporary_override_usd == 2000000.00 (step 1)"
            - "Limit.utilization_pct == round_half_up(5500000/7000000*100, 2) == 78.57 (step 2)"
            - "Position.warning_status == 'NORMAL' (step 3 — 78.57 < 80)"

  # =============================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs (≥2)
  # =============================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_segregation_on_approve
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors.ERR_INVALID_STATE
          - errors.ERR_SEGREGATION_VIOLATION
        distinguishing_aspect: |
          Pair: state (priority 4, ERR_INVALID_STATE) vs business_safety/segregation (priority 5,
          ERR_SEGREGATION_VIOLATION). When a Trader tries to call /approve on their OWN request that is
          ALREADY REJECTED, both fail; priority pins ERR_INVALID_STATE first.
        test_recipe:
          setup:
            - "Trader frank submits request req1; RiskOfficer rejects it (req1.status=REJECTED)."
          trigger:
            - "POST /fx-risk/limit-adjustments/{req1}/approve with headers X-User-Role=Trader, X-User-ID=frank"
          assert:
            - "Response HTTP 403 ERR_FORBIDDEN actually wins at priority 2 (auth/role); to isolate the state-vs-segregation conflict, use a RiskOfficer role where X-User-ID==frank's trader_id (operator pretending to be the requester). Then HTTP 409 ERR_INVALID_STATE wins (priority 4) over ERR_SEGREGATION_VIOLATION (priority 5)."
            - "Specifically: response.data.error_id == 'ERR_INVALID_STATE' (NOT 'ERR_SEGREGATION_VIOLATION')"

      - name: limit_breach_vs_counterparty_limit_breach_on_trade
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors.ERR_LIMIT_BREACH
          - errors.ERR_COUNTERPARTY_LIMIT_BREACH
        distinguishing_aspect: |
          Pair: business_fiscal (priority 10, trader limit) vs business_fiscal (priority 11, counterparty limit) —
          a different error-category pair from instance 1 (state vs business_safety). Two fiscal sub-categories
          that can both fail on a single POST /trades; priority 10 wins.
        test_recipe:
          setup:
            - "Trader gail with INTRADAY notional_cap_usd=1000000."
            - "Counterparty cpW with rating_band=WATCH → credit_limit_usd=1000000."
            - "Gail already holds a BUY EURUSD position of net_open_usd=900000 against cpW."
          trigger:
            - "POST /fx-risk/trades {pair_code=EURUSD, side=BUY, notional_base=200000, entry_rate=1.000000, counterparty_id=cpW} as gail (would push trader util to 1.1M > 1.0M cap AND counterparty exposure to 1.1M > 1.0M credit_limit)"
          assert:
            - "Response HTTP 409 with error_id == 'ERR_LIMIT_BREACH' (priority 10 wins over priority 11 ERR_COUNTERPARTY_LIMIT_BREACH)"

  # =============================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints (≥2)
  # =============================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: warning_threshold_80_pct_inclusive
        grounds:
          - calculations.limit_utilization
          - entities.Position.fields.warning_status
        distinguishing_aspect: |
          Numeric threshold: utilization_pct >= 80 is WARNING (inclusive), utilization_pct < 80 is NORMAL.
          Endpoint: GET /fx-risk/traders/{id}/limits. Distinct metric (percentage) and distinct endpoint
          from instance 2 (stop-loss price boundary on /market-data/quote).
        test_recipe:
          setup:
            - "Trader hannah, INTRADAY notional_cap_usd=10000000.00, OVERNIGHT cap=10000000.00"
            - "POST /fx-risk/trades {side=BUY, notional_base=7999999.00, entry_rate=1.000000} → utilization_pct=79.99"
          trigger:
            - "GET /fx-risk/traders/{hannah}/limits"
            - "Then POST /fx-risk/trades {notional_base=1.00} → utilization_pct=80.00"
            - "GET /fx-risk/traders/{hannah}/limits"
          assert:
            - "First GET: warning_status == 'NORMAL' for the INTRADAY row (79.99 < 80)"
            - "Second GET: warning_status == 'WARNING' for the INTRADAY row (80.00 >= 80, inclusive)"

      - name: stop_loss_price_le_inclusive
        grounds:
          - calculations.stop_loss_evaluation
          - state_machines.StopLossEvent.ARMED_to_TRIGGERED
        distinguishing_aspect: |
          Inequality boundary: long-side PRICE stop triggers iff current_mid <= threshold_value (inclusive).
          Endpoint: POST /fx-risk/market-data/quote. Metric is FX rate (six-decimal price), distinct from
          instance 1's percentage metric and exercised via a different endpoint.
        test_recipe:
          setup:
            - "Trader ivy with BUY EURUSD net position (long base)."
            - "POST /fx-risk/stop-loss {trader_id=ivy, pair_code=EURUSD, rule_mode=PRICE, threshold_value=1.0950, action=ALERT} → sl_ivy (ARMED)"
          trigger:
            - "POST /fx-risk/market-data/quote {code=EURUSD, mid_rate=1.0951} → does NOT trigger"
            - "POST /fx-risk/market-data/quote {code=EURUSD, mid_rate=1.0950} → triggers"
          assert:
            - "After first quote: sl_ivy.state == 'ARMED'"
            - "After second quote: sl_ivy.state == 'TRIGGERED' and sl_ivy.triggering_value == 1.095000"

  # =============================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs (≥2)
  # =============================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: settlement_send_gated_by_counterparty_watchlist
        grounds:
          - state_machines.SettlementInstruction.GENERATED_to_SENT
          - state_machines.Counterparty.STANDARD_to_WATCH
          - validations[priority=6]
          - errors.ERR_COUNTERPARTY_WATCHLIST
        distinguishing_aspect: |
          Entity pair: SettlementInstruction ↔ Counterparty. The GENERATED → SENT transition is blocked
          unless Counterparty.on_watchlist == false. Different entities and different transition family
          from instance 2 (Trade ↔ Trader).
        test_recipe:
          setup:
            - "Counterparty cp (external=A, internal=70) created; instruction si generated (status=GENERATED)."
            - "ComplianceOfficer PATCH cp setting internal_score=30 → rating_band=WATCH, on_watchlist=true."
          trigger:
            - "POST /fx-risk/settlements/{si}/send as SettlementOperator"
          assert:
            - "Response HTTP 409 ERR_COUNTERPARTY_WATCHLIST; si.status remains 'GENERATED'"

      - name: trade_booking_gated_by_trader_status
        grounds:
          - validations[priority=7]
          - entities.Trader.fields.status
          - errors.ERR_TRADER_SUSPENDED
        distinguishing_aspect: |
          Entity pair: Trade ↔ Trader. POST /trades requires Trader.status == 'ACTIVE'; if a prior
          settlement-failure cascade flipped Trader.status to 'SUSPENDED', the next /trades call from that
          trader is rejected. Different entity pair from instance 1 (Settlement ↔ Counterparty).
        test_recipe:
          setup:
            - "Trader jack suspended via cascade from instance 4 (transitive_cascade.settlement_failure_to_trader_suspension_depth_4) — reuse setup or seed Trader.status='SUSPENDED' via an equivalent settlement-failure chain"
          trigger:
            - "POST /fx-risk/trades {pair_code=EURUSD, side=BUY, notional_base=1.00, entry_rate=1.000000, counterparty_id=any_active_cp} as jack"
          assert:
            - "Response HTTP 409 ERR_TRADER_SUSPENDED; no Trade row created"

  # =============================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics (≥2)
  # =============================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: limit_override_temporal_window_overlap
        grounds:
          - state_machines.LimitAdjustmentRequest.PENDING_to_APPROVED
          - state_machines.LimitAdjustmentRequest.APPROVED_to_EXPIRED
          - entities.LimitAdjustmentRequest.fields.expires_at
          - entities.Limit.fields.temporary_override_usd
        distinguishing_aspect: |
          Resource: Limit row. Interval semantics: an APPROVED override occupies the half-open interval
          [approval_time, expires_at). Two APPROVED requests on the same Limit STACK (additively combine)
          rather than block — uses ADDITIVE-aggregate-capacity semantics over overlapping intervals.
          This is the additive-stacking flavor of temporal overlap.
        test_recipe:
          setup:
            - "Limit L with notional_cap_usd=1000000."
            - "Trader keith submits req1 (delta=500000, expires_at=T+1h) and req2 (delta=300000, expires_at=T+2h); both PENDING."
          trigger:
            - "POST /fx-risk/limit-adjustments/{req1}/approve as RiskOfficer → Limit.temporary_override_usd=500000"
            - "POST /fx-risk/limit-adjustments/{req2}/approve as RiskOfficer → Limit.temporary_override_usd=800000 (stacks)"
            - "POST /fx-risk/_clock/advance to T+1h then POST /fx-risk/_sweep/run → req1 EXPIRED, override drops by 500000"
            - "GET /fx-risk/limits/{L}"
          assert:
            - "After both approvals: Limit.temporary_override_usd == 800000.00 (additive aggregate over overlapping intervals)"
            - "After req1 expires: Limit.temporary_override_usd == 300000.00 (only req2's interval remains active)"

      - name: stop_loss_overridden_rearm_window
        grounds:
          - state_machines.StopLossEvent.ACKNOWLEDGED_to_OVERRIDDEN
          - state_machines.StopLossEvent.OVERRIDDEN_to_ARMED
          - calculations.end_of_day_reconciliation
        distinguishing_aspect: |
          Resource: StopLossEvent. Interval semantics: an OVERRIDDEN event is dormant in the closed interval
          [override_time, next_sweep_time]; during that interval no quote can re-trigger it. Distinct from
          instance 1's additive-stacking semantics — this is exclusion-over-a-closed-interval (the event is
          blocked from re-triggering for as long as it sits in OVERRIDDEN). Different resource entity and
          different interval geometry as §0.5 requires.
        test_recipe:
          setup:
            - "StopLossEvent sl in OVERRIDDEN (achieved via setup of rule_id=non_linear_state_machine.stop_loss_override_cycle, stopping before the sweep)."
            - "Trader's BUY EURUSD position still open."
          trigger:
            - "POST /fx-risk/market-data/quote {code=EURUSD, mid_rate=1.0900} (well below the original 1.0950 threshold)"
            - "GET /fx-risk/stop-loss/{sl} via list endpoint"
          assert:
            - "sl.state remains 'OVERRIDDEN' (quote during the dormant interval cannot re-trigger)"
            - "Subsequent POST /fx-risk/_sweep/run moves sl to 'ARMED'; only after that may a new quote trigger it again"

  # =============================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities (≥2)
  # =============================================================================
  - rule_id: compensating_invariant
    instances:
      - name: limit_override_expiry_returns_cap
        grounds:
          - state_machines.LimitAdjustmentRequest.PENDING_to_APPROVED
          - state_machines.LimitAdjustmentRequest.APPROVED_to_EXPIRED
          - entities.Limit.fields.notional_cap_usd
          - entities.Limit.fields.temporary_override_usd
        distinguishing_aspect: |
          Conserved quantity: baseline Limit.notional_cap_usd. Forward = approve override (+delta on
          temporary_override_usd). Compensating = expire override (-delta on temporary_override_usd).
          Invariant pinned as a formula: at every quiet point Limit.notional_cap_usd
          (the base cap) is unchanged across the cycle; temporary_override_usd returns to 0 when no
          APPROVED, non-expired adjustments remain.
        test_recipe:
          setup:
            - "Limit L with notional_cap_usd=1000000 (record initial value)."
          trigger:
            - "Approve one LimitAdjustmentRequest with delta=400000; advance clock past expires_at; run /_sweep/run."
          assert:
            - "Throughout the cycle, Limit.notional_cap_usd has NEVER changed (still 1000000.00 — the base cap is the conserved quantity)"
            - "After expiry sweep, Limit.temporary_override_usd == 0.00 (compensating action zeroed the override)"

      - name: settlement_netting_cash_conservation
        grounds:
          - calculations.multilateral_netting
          - entities.SettlementInstruction.fields.gross_pay_amount
          - entities.SettlementInstruction.fields.gross_receive_amount
          - entities.SettlementInstruction.fields.net_amount
        distinguishing_aspect: |
          Conserved quantity: per-currency cash balance. Forward = sum of gross_pay - sum of gross_receive
          (over all Trades feeding the instruction). Compensating = net_amount value posted on settlement.
          Invariant pinned as a formula:
              net_amount == round_half_up(gross_pay_amount - gross_receive_amount, 2)
          for every (counterparty_id, value_date, ccy). Different conserved quantity from instance 1
          (cash flow per currency, not a cap quantity).
        test_recipe:
          setup:
            - "Counterparty C. Two trades: BUY EURUSD 1000000@1.10 (receive 1M EUR, pay 1.1M USD); SELL EURUSD 600000@1.10 (pay 600k EUR, receive 660k USD). Both BOOKED with same value_date."
          trigger:
            - "POST /fx-risk/settlements/generate {counterparty_id=C, value_date=V, client_request_id=req1}"
          assert:
            - "EUR instruction: gross_pay_amount == 600000.00 and gross_receive_amount == 1000000.00 and net_amount == round_half_up(600000.00 - 1000000.00, 2) == -400000.00"
            - "USD instruction: gross_pay_amount == 1100000.00 and gross_receive_amount == 660000.00 and net_amount == round_half_up(1100000.00 - 660000.00, 2) == 440000.00"
            - "Invariant: for every emitted instruction, net_amount == round_half_up(gross_pay_amount - gross_receive_amount, 2) exactly"
