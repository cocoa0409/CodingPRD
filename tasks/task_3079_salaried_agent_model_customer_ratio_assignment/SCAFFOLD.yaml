# =============================================================================
# SCAFFOLD.yaml — Salaried Agent Model & Customer-Ratio Assignment
# Task: task_3079_salaried_agent_model_customer_ratio_assignment
# §1.0–§1.7 (neither scaffold_difficulty_design nor scaffold_corner_design here)
# =============================================================================

scenario: |
  Salaried Agent Model & Customer-Ratio Assignment (Redfin): employed agents paid salary plus bonus rather than pure commission with benefits and expense coverage, customer assignment by geography, capacity and satisfaction scores with a target ratio of clients per agent, associate agent staffing for tours to protect lead agent capacity, listing fee structure below traditional rates with service level commitments, partner agent referral for overflow demand with referral fee accounting, agent performance measured on close rate and customer survey with bonus computation, tour scheduling automation with access instructions and feedback capture, transaction coordination centralized away from the agent

domain_name: salaried-agent-customer-ratio
api_prefix: ""   # flat topology: every resource has its own top-level collection

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: Quota / allocation
  secondary_archetype: Pricing engine
  complexity_layers:
    - selector_policy
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Flat: every entity is a peer with foreign-key references; no nesting beyond
  # one region-scoped collection segment. Cross-agent comparison is required.

  state_machine_shape: compound
  # LeadCapacity is compound (state derived from the agent's OpenClientCount
  # children). Transaction shifts on its own parallel dimension. Referral is
  # cyclic (OPS_COMPUTED -> RECONCILED -> OPS_COMPUTED on re-derivation).

  relationship_patterns:
    - one_to_many
    - cross_aggregate

  role_model: peer_roles

  consistency_model: immediate
  # Every derived field (LeadCapacity.current_state, Agent.bonus_cents,
  # ListingAgreement.final_listing_fee_cents, AgentReferral.referral_fee_cents)
  # is recomputed inside the request that mutates its source data.

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Region
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Metro region name (e.g. Puget Sound)" }
      - { name: service_area_codes, type: array, source: input, description: "Zip/postal codes served by this region; a customer address or listing address whose postal_code is a member is in-geography", constraints: "non-empty array of strings" }
      - { name: traditional_commission_pct, type: number, source: input, description: "Incumbent-brokerage listing commission used as the comparison baseline for savings_pct", constraints: "0 < traditional_commission_pct <= 1" }
      - { name: target_client_ratio, type: number, source: input, description: "Target clients per employed agent for this region; drives OVER_TARGET / UNDER_TARGET lead capacity", constraints: "> 0" }
      - { name: agent_count, type: integer, source: computed, default: 0, description: "Count of Agent rows in this region whose status IN {ACTIVE, AT_CAPACITY}" }
      - { name: occupancy_pct, type: number, source: computed, default: 0, description: "= round_half_up(clients_in_pipeline / (agent_count * target_client_ratio), 4); 0.0 when agent_count == 0" }
      - { name: occupancy_band, type: enum, source: computed, description: "UNDER_TARGET | NEAR_TARGET | OVER_TARGET — band selected from occupancy_pct at the 0.75 and 1.00 edges, with the 1.00 to 1.25 veto band joining OVER_TARGET; a derived read-only field", constraints: "one of UNDER_TARGET, NEAR_TARGET, OVER_TARGET" }
      - { name: clients_in_pipeline, type: integer, source: computed, default: 0, description: "Count of Client rows in this region whose status IN {UNASSIGNED, ASSIGNED, IN_TRANSACTION} — regional demand, not just assigned load" }
      - { name: referral_count, type: integer, source: computed, default: 0, description: "Count of AgentReferral rows in this region" }
      - { name: open_referral_count, type: integer, source: computed, default: 0, description: "Count of AgentReferral rows in this region whose settlement_status IN {PENDING, COMPUTED} — SETTLED rows leave this open-referral ledger" }
      - { name: enrolment_is_required, type: boolean, source: input, default: false, description: "When true the region enforces the benefit-enrolment rule for its agents; default false keeps the rule inert so the flag can be toggled independently" }
      - { name: capacity, type: integer, source: input, default: 10, description: "Region listing-programme capacity, counted by the region open-referral backfill against outstanding requirements" }

  - name: Agent
    parent: Region
    common_fields: true
    fields:
      - { name: region_id, type: string, source: input, description: "FK -> Region.id; the region whose service_area_codes this agent's home_zip is a member of" }
      - { name: full_name, type: string, source: input, description: "Agent legal name" }
      - { name: agent_kind, type: enum, source: input, description: "LEAD | ASSOCIATE — associate agents staff tours so lead agents keep client capacity", constraints: "one of LEAD, ASSOCIATE" }
      - { name: home_zip, type: string, source: input, description: "Agent's home postal code; must be a member of the parent region's service_area_codes" }
      - { name: base_salary_cents, type: integer, source: input, description: "Annual salaried base, paid instead of pure commission", constraints: "> 0" }
      - { name: benefits_cents, type: integer, source: input, default: 0, description: "Annual employer-funded benefits allowance", constraints: ">= 0" }
      - { name: expense_allowance_cents, type: integer, source: input, default: 0, description: "Annual reimbursable expense coverage", constraints: ">= 0" }
      - { name: satisfaction_score, type: number, source: computed, description: "= round_half_up(mean of Survey.score over the agent's SATISFACTION_INCLUDED_STATES surveys, 2); null when the agent has no included survey" }
      - { name: close_rate, type: number, source: computed, description: "= round_half_up(closed_transactions / total_transactions, 4); closed_transactions counts Transaction rows of this agent in status CLOSED; total_transactions excludes CANCELLED; 0.0 when total_transactions == 0" }
      - { name: bonus_pct, type: number, source: computed, default: 0, description: "Rate applied by the compensation calculation; derived from close_rate, satisfaction_score and the region occupancy_pct" }
      - { name: bonus_cents, type: integer, source: computed, default: 0, description: "= round_half_up(base_salary_cents * bonus_pct, 0), 0 when not BONUS_ELIGIBLE" }
      - { name: salary_commitment_cents, type: integer, source: computed, default: 0, description: "Salary, bonus, benefits and expense allowance carried by this salaried agent" }
      - { name: open_referral_count, type: integer, source: computed, default: 0, description: "Count of AgentReferral rows of this region whose settlement_status IN {PENDING, COMPUTED} — the referral ledger the region backfill draws down" }
      - { name: referral_fee_bps, type: integer, source: computed, default: 0, description: "Referral fee basis points this agent is carried at, derived from base_salary_cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> AT_CAPACITY (when active_client_count >= floor(target_client_ratio)) -> ACTIVE; ON_LEAVE while the agent is away", constraints: "one of ACTIVE, AT_CAPACITY, ON_LEAVE" }

  - name: OpenClientCount
    parent: Agent
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; the agent whose open-client tally this row carries (one row per agent)" }
      - { name: active_client_count, type: integer, source: system, default: 0, description: "Clients currently assigned to the agent; increments when a client is assigned, decrements when the client's originating transaction reaches CLOSED or CANCELLED" }
      - { name: ratio_state, type: enum, source: computed, description: "UNDER_TARGET | ON_TARGET | OVER_TARGET — band selected from active_client_count against the region target_client_ratio", constraints: "one of UNDER_TARGET, ON_TARGET, OVER_TARGET" }

  - name: Client
    parent: Region
    common_fields: true
    fields:
      - { name: region_id, type: string, source: system, description: "FK -> Region.id; derived from the service_area_code argument at registration" }
      - { name: full_name, type: string, source: input, description: "Home-buyer or home-seller legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique within the whole system" }
      - { name: service_area_code, type: string, source: input, description: "Postal code of the client; selects the region by membership in Region.service_area_codes" }
      - { name: need_kind, type: enum, source: input, description: "BUY | SELL — BUY clients consume listing-independent capacity, SELL clients anchor a ListingAgreement", constraints: "one of BUY, SELL" }
      - { name: assigned_agent_id, type: string, source: system, description: "FK -> Agent.id; the lead agent chosen by the assignment selector; null until assigned" }
      - { name: assignment_mode, type: enum, source: system, description: "ASSIGNED_DIRECT | REFERRED_PARTNER | UNASSIGNED — how the client's assignment was satisfied", constraints: "one of ASSIGNED_DIRECT, REFERRED_PARTNER, UNASSIGNED" }
      - { name: assignment_reason, type: enum, source: system, description: "Selector outcome code; null until an assignment attempt runs", constraints: "one of GEOGRAPHY_MATCH, ALL_AT_CAPACITY, MANUAL_PARTNER" }
      - { name: status, type: enum, source: system, description: "UNASSIGNED -> ASSIGNED -> IN_TRANSACTION -> CLOSED; UNASSIGNED -> REFERRED (terminal)", constraints: "one of UNASSIGNED, ASSIGNED, IN_TRANSACTION, CLOSED, REFERRED" }

  - name: LeadCapacity
    parent: Agent
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; the lead agent whose capacity posture this row carries (one row per agent)" }
      - { name: current_state, type: enum, source: computed, description: "OPEN | AT_CAPACITY | OVER_TARGET — posture derived from the agent's OpenClientCount.ratio_state and the agent's status", constraints: "one of OPEN, AT_CAPACITY, OVER_TARGET" }
      - { name: tours_in_week, type: integer, source: computed, default: 0, description: "Count of Tour rows of this agent in status SCHEDULED or COMPLETED whose scheduled_at falls in the inclusive window [now, now + 7 days]" }
      - { name: associate_capacity_used, type: integer, source: computed, default: 0, description: "Count of Tour rows of this agent in status SCHEDULED whose associate_agent_id is not null" }
      - { name: close_rate, type: number, source: computed, default: 0, description: "Copy of the lead agent's Agent.close_rate at recomputation time (rolling-window view; the unpinned variant widens the window to lifetime closes)" }
      - { name: graded_transactions, type: integer, source: computed, default: 0, description: "Count of this agent's Transaction rows whose coordination_status IN {CLOSED, CANCELLED}, observed strictly BEFORE the recompute sweep (the pinned ordering)" }
      - { name: trailing_tours, type: integer, source: computed, default: 0, description: "Sum of Tour.tours_next_36_hours over this agent's Tour rows (a windowed projection; the unpinned variant sums lifetime tour counts)" }
      - { name: unassigned_tours, type: integer, source: computed, default: 0, description: "Tours carried by this agent whose associate_agent_id is null — the ledger the region open-referral backfill tops up to the region capacity" }

  - name: Transaction
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; the client whose side this transaction represents" }
      - { name: lead_agent_id, type: string, source: system, description: "FK -> Agent.id; copied from the client's assigned_agent_id at opening (null when the client has no agent)" }
      - { name: coordination_status, type: enum, source: system, description: "UNASSIGNED -> ASSIGNED -> REVIEW -> CLOSED | CANCELLED — the centralized transaction-coordination dimension, changed only by the TransactionCoordinator", constraints: "one of UNASSIGNED, ASSIGNED, REVIEW, CLOSED, CANCELLED" }
      - { name: contract_price_cents, type: integer, source: input, default: 0, description: "Agreed purchase price; drives the listing fee and the marginal-tier roadmap", constraints: ">= 0" }
      - { name: closed_at, type: datetime, source: system, description: "Set when coordination_status enters CLOSED; null otherwise" }
      - { name: agent_satisfaction_credit, type: number, source: computed, default: 0, description: "+0.05 when the existing CLOSED transaction this row replaces was closed more than 180 days before the replacement opens, else 0.0" }

  - name: ListingAgreement
    parent: Region
    common_fields: true
    fields:
      - { name: region_id, type: string, source: system, description: "FK -> Region.id; the region whose traditional_commission_pct is the savings baseline" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the selling client" }
      - { name: list_price_cents, type: integer, source: input, description: "Asking price used as the gross fee base", constraints: ">= 10000000" }
      - { name: list_fee_rate_pct, type: number, source: input, description: "Flat listing fee rate, below the traditional brokerage rate", constraints: "0 < list_fee_rate_pct <= 0.015" }
      - { name: service_tier, type: enum, source: input, description: "FULL_SERVICE | LIMITED_SERVICE | MLS_ONLY — each tier carries a distinct service-level commitment", constraints: "one of FULL_SERVICE, LIMITED_SERVICE, MLS_ONLY" }
      - { name: traditional_listing_fee_cents, type: integer, source: computed, description: "= round_half_up(list_price_cents * region.traditional_commission_pct, 0) - the incumbent-brokerage baseline the savings are measured against" }
      - { name: partner_referral_fee_cents, type: integer, source: computed, default: 0, description: "Referral fee carried by the same client's AgentReferral row, 0 when the client carries no referral; deducted by min() so the final fee never goes negative" }
      - { name: gross_listing_fee_cents, type: integer, source: computed, description: "= round_half_up(list_price_cents * list_fee_rate_pct, 0)" }
      - { name: savings_amount_cents, type: integer, source: computed, description: "= round_half_up(traditional_listing_fee_cents - gross_listing_fee_cents, 0) using the flat-rate variant" }
      - { name: savings_pct, type: number, source: computed, description: "= proportional_definite(round_half_up(traditional_listing_fee_cents - gross_listing_fee_cents, 0) / traditional_listing_fee_cents) — the FINAL variant; the PROVISIONAL variant divides by gross_listing_fee_cents instead" }
      - { name: final_listing_fee_cents, type: integer, source: computed, description: "= gross_listing_fee_cents - min(partner_referral_fee_cents, gross_listing_fee_cents); the base MINUS a non-negative fee, so it never exceeds gross_listing_fee_cents and never goes negative" }
      - { name: service_commitment_hours, type: integer, source: computed, description: "24 for FULL_SERVICE, 48 for LIMITED_SERVICE, 0 for MLS_ONLY; revised to service_commitment_hours + 24 when the window breaches the on-time rule" }
      - { name: posted_at, type: datetime, source: system, description: "Set when status enters ACTIVE" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> UNDER_CONTRACT -> CLOSED / WITHDRAWN", constraints: "one of DRAFT, ACTIVE, UNDER_CONTRACT, CLOSED, WITHDRAWN" }

  - name: Tour
    parent: Agent
    common_fields: true
    fields:
      - { name: lead_agent_id, type: string, source: system, description: "FK -> Agent.id; the lead agent whose capacity this tour draws on, copied from Client.assigned_agent_id" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the client viewing the property" }
      - { name: listing_agreement_id, type: string, source: system, description: "FK -> ListingAgreement.id; set when client_id owns a non-WITHDRAWN ListingAgreement, else null" }
      - { name: associate_agent_id, type: string, source: input, description: "FK -> Agent.id; the associate agent staffing the tour, required when the lead agent's UniServicedTourCount equals or exceeds the block threshold (target_client_ratio rounded UP, floor 1)" }
      - { name: scheduled_at, type: datetime, source: input, description: "Tour start instant; drives the access-code lead window and the conflict rule", constraints: "must be later than the logical clock" }
      - { name: access_instructions, type: string, source: input, description: "Showing instructions relayed to the companion; access_code is omitted from the response unless the clock is within access_code_release_lead_minutes of scheduled_at", constraints: "1..500 characters" }
      - { name: access_code, type: string, source: system, description: "Server-issued keybox code; null in the response until the access window opens" }
      - { name: status, type: enum, source: system, description: "ACCESS_PENDING -> CONFIRMED -> COMPLETED / CANCELLED_NO_SHOW / CANCELLED", constraints: "one of ACCESS_PENDING, CONFIRMED, COMPLETED, CANCELLED_NO_SHOW, CANCELLED" }
      - { name: feedback_rating, type: integer, source: input, description: "1..5 star rating captured after the tour", constraints: "1..5 or null" }
      - { name: feedback_notes, type: string, source: input, description: "Free-text showing feedback" }
      - { name: tours_next_36_hours, type: integer, source: computed, default: 0, description: "1 when scheduled_at falls in the next 36 hours, else 0 — the trailing tour projection summed across a lead agent's tours" }

  - name: Survey
    parent: Transaction
    common_fields: true
    fields:
      - { name: transaction_id, type: string, source: system, description: "FK -> Transaction.id; the closing being reviewed" }
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; the lead agent credited, copied from Transaction.lead_agent_id" }
      - { name: score, type: integer, source: input, description: "1..5 satisfaction score", constraints: "1..5" }
      - { name: response_status, type: enum, source: system, description: "DISPATCHED -> RESPONDED; DISPATCHED ages to EXPIRED_DISPATCH during run_ops after 2 ops runs without a response", constraints: "one of DISPATCHED, RESPONDED, EXPIRED_DISPATCH" }
      - { name: bonus_eligible, type: boolean, source: system, description: "true when this survey is created RESPONDED (agent-initiated close), false when created DISPATCHED and answered later" }
      - { name: dispatched_at, type: datetime, source: system, description: "Set at creation; the ops-run ageing anchor" }
      - { name: responded_at, type: datetime, source: system, description: "Set when response_status enters RESPONDED; null otherwise" }

  - name: AgentReferral
    parent: Region
    common_fields: true
    fields:
      - { name: region_id, type: string, source: system, description: "FK -> Region.id; the region whose partner pool this referral draws on" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the overflow client being referred away" }
      - { name: partner_name, type: string, source: input, description: "External partner brokerage receiving the referral" }
      - { name: referral_fee_bps, type: integer, source: input, description: "Referral fee in basis points of the eventual contract price", constraints: "0 < referral_fee_bps <= 2500" }
      - { name: referral_fee_cents, type: integer, source: computed, description: "= round_half_up(contract_price_cents * referral_fee_bps / 10000, 0); provisional until a contract price exists underneath" }
      - { name: settlement_status, type: enum, source: system, description: "PENDING -> COMPUTED -> SETTLED; a referral may revisit PENDING -> COMPUTED -> PENDING when a late contract price supersedes the basis", constraints: "one of PENDING, COMPUTED, SETTLED" }
      - { name: split_policy, type: enum, source: input, description: "SPLIT_25_PARTNER | SPLIT_50_PARTNER — selects which side of the referral conservation split the partner receives", constraints: "one of SPLIT_25_PARTNER, SPLIT_50_PARTNER" }
      - { name: partner_cents, type: integer, source: computed, description: "= round_half_up(referral_fee_cents * partner_share, 0) - the partner brokerage's side of the split" }
      - { name: house_cents, type: integer, source: computed, description: "= referral_fee_cents - partner_cents - the retained side of the split, the second leg of the conservation equality" }
      - { name: settlement_reference, type: string, source: input, description: "External settlement identifier recorded at computation time" }

  - name: ActivityAudit
    parent: Region
    common_fields: false
    fields:
      - { name: region_id, type: string, source: system, description: "FK -> Region.id; the region this audit row belongs to" }
      - { name: entity_type, type: string, source: system, description: "Entity name the row describes (Transaction, OpenClientCount, ListingAgreement, AgentReferral)" }
      - { name: entity_ref_id, type: string, source: system, description: "id of the described row; identity only, never a decision input" }
      - { name: kind, type: string, source: system, description: "Audit kind: TRANSACTION_CREATED, TRANSACTION_STATUS_CHANGED, CLIENT_CAPACITY_RELEASED, SERVICE_COMMITMENT_BREACH" }
      - { name: detail, type: string, source: system, description: "Human-readable description of the recorded change" }# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- State machine 1: LeadCapacity (compound / posture-driven) -------------
  - entity: LeadCapacity
    initial_state: OPEN
    terminal_states: []
    note: "Compound / posture-driven: current_state is derived, not assigned. OPEN gates assignment; AT_CAPACITY and OVER_TARGET both refuse it. The machine also carries ON_LEAVE, reached only through the agent status endpoint."
    transitions:
      - from: OPEN
        to: AT_CAPACITY
        trigger: "system (automatic when the agent's OpenClientCount.active_client_count reaches floor(target_client_ratio), evaluated from the region floor up)"
        actor: system
        preconditions:
          - "OpenClientCount.ratio_state IN {ON_TARGET, OVER_TARGET}"
        side_effects:
          - "Agent.status (when active_client_count >= ceil(target_client_ratio)) -> AT_CAPACITY"
          - "Region.agent_count recomputed"
      - from: AT_CAPACITY
        to: OPEN
        trigger: "system (automatic when a client's originating transaction reaches CLOSED or CANCELLED and OpenClientCount.active_client_count falls below floor(target_client_ratio))"
        actor: system
        preconditions:
          - "agent.status == AT_CAPACITY"
          - "OpenClientCount.ratio_state == UNDER_TARGET"
        side_effects:
          - "Agent.status -> ACTIVE"
          - "Agent.bonus_pct and Agent.bonus_cents recomputed via salaried_bonus"
          - "Region.agent_count recomputed"
      - from: OPEN
        to: ON_LEAVE
        trigger: POST /agents/{agentId}/status
        actor: PlatformAdmin
        preconditions:
          - "an on-leave agent keeps its capacity posture while it is away"
        side_effects:
          - "Agent.bonus_pct and Agent.bonus_cents recomputed via salaried_bonus (not eligible while on leave)"
          - "Agent.salary_commitment_cents recomputed; Region.agent_count recomputed"
      - from: ON_LEAVE
        to: OPEN
        trigger: POST /agents/{agentId}/status
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Agent.bonus_pct, bonus_cents and salary_commitment_cents recomputed"
          - "Region.agent_count recomputed"

  # --- State machine 2: Client (branching) -----------------------------------
  - entity: Client
    initial_state: UNASSIGNED
    terminal_states: [REFERRED]
    transitions:
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: POST /clients/{clientId}/assign-agent
        actor: OperationsCoordinator
        preconditions:
          - "selector returns an agent whose LeadCapacity.current_state == OPEN for the requested service_area_code"
          - "the region is not in the OVER_TARGET band (Region.occupancy_pct < 1.0 adjusted by its rate band)"
        side_effects:
          - "Client.assigned_agent_id = selected agent"
          - "Client.assignment_mode = ASSIGNED_DIRECT"
          - "Client.assignment_reason = GEOGRAPHY_MATCH"
          - "cascade: OpenClientCount.active_client_count += 1 for the selected agent"
          - "cascade (depth 2): OpenClientCount.ratio_state recomputed; when active_client_count >= floor(target_client_ratio) the agent's LeadCapacity.current_state -> AT_CAPACITY"
          - "cascade (depth 3): when active_client_count >= ceil(target_client_ratio) the selected Agent.status -> AT_CAPACITY and Region.agent_count recomputed"
          - "Agent.bonus_pct and Agent.bonus_cents recomputed via salaried_bonus for the selected agent"
      - from: UNASSIGNED
        to: UNASSIGNED
        trigger: POST /clients/{clientId}/assign-agent
        actor: OperationsCoordinator
        preconditions:
          - "every in-geography agent has LeadCapacity.current_state != OPEN (ERR_NO_ELIGIBLE_AGENT)"
        side_effects:
          - "Client.assignment_reason = ALL_AT_CAPACITY"
      - from: UNASSIGNED
        to: UNASSIGNED
        trigger: POST /clients/{clientId}/assign-agent
        actor: OperationsCoordinator
        preconditions:
          - "no agent has home_zip in the region's service_area_codes (ERR_NO_ELIGIBLE_AGENT, reason NO_IN_GEOGRAPHY_AGENT)"
        side_effects:
          - "Client.assignment_reason = NO_IN_GEOGRAPHY_AGENT"
      - from: UNASSIGNED
        to: UNASSIGNED
        trigger: POST /clients/{clientId}/assign-agent
        actor: OperationsCoordinator
        preconditions:
          - "a candidate's satisfaction_score is null and satisfaction_is_required is true (ERR_AGENT_NOT_ELIGIBLE)"
        side_effects:
          - "Client.assignment_reason = NO_SATISFACTION_SCORE"
      - from: UNASSIGNED
        to: REFERRED
        trigger: POST /clients/{clientId}/assign-agent with manual_partner=true, or POST /referrals
        actor: OperationsCoordinator
        preconditions:
          - "Client.assignment_mode becomes REFERRED_PARTNER"
        side_effects:
          - "Client.assigned_agent_id remains null"
          - "Client.assignment_reason = REGION_OCCUPANCY_AT_CAPACITY when the region band is OVER_TARGET, else the manual reason"
          - "cascade: Region.referral_count += 1 (only on the POST /referrals path)"
          - "cascade (depth 2): Region.occupancy_pct recomputed from clients_in_pipeline and agent_count"
      - from: ASSIGNED
        to: IN_TRANSACTION
        trigger: POST /clients/{clientId}/transactions
        actor: OperationsCoordinator
        preconditions:
          - "no existing Transaction of this client with coordination_status in {UNASSIGNED, ASSIGNED, REVIEW} (ERR_TRANSACTION_ALREADY_OPEN)"
        side_effects:
          - "cascade: Transaction.coordination_status = UNASSIGNED"
          - "cascade (depth 2): ActivityAudit row appended for the new transaction"
      - from: IN_TRANSACTION
        to: CLOSED
        trigger: POST /transactions/{transactionId}/close
        actor: TransactionCoordinator
        preconditions:
          - "coordination_status == REVIEW"
        side_effects:
          - "Client.status -> CLOSED"
          - "Transaction.closed_at = now"
          - "cascade: OpenClientCount.active_client_count -= 1"
          - "cascade (depth 2): OpenClientCount.ratio_state recomputed; the agent's LeadCapacity.current_state -> OPEN when ratio_state == UNDER_TARGET"
          - "cascade (depth 3): when LeadCapacity.current_state -> OPEN, Agent.status -> ACTIVE and Region.agent_count recomputed"
          - "cascade (depth 4): ActivityAudit row appended for the OpenClientCount change"
          - "Agent.close_rate, Agent.bonus_pct and Agent.bonus_cents recomputed via salaried_bonus"
      - from: IN_TRANSACTION
        to: CLOSED
        trigger: POST /clients/{clientId}/transactions/{transactionId}/close
        actor: TransactionCoordinator
        preconditions:
          - "coordination_status IN {ASSIGNED, REVIEW}"
        side_effects:
          - "Client.status -> CLOSED"
          - "cascade: OpenClientCount.active_client_count -= 1"
          - "cascade (depth 2): OpenClientCount.ratio_state recomputed"
          - "Agent.close_rate and Agent.bonus_cents recomputed"
      - from: ASSIGNED
        to: ASSIGNED
        trigger: POST /referrals/{clientId}/manual-referral
        actor: OperationsCoordinator
        preconditions:
          - "the client already carries a partner referral, so the operation is a pass-through that writes no new Referral"
        side_effects:
          - "Client.assignment_reason unchanged"
        note: "Pass-through: the enclosing setter returns the pass-through verdict and the caller writes nothing."
      - from: IN_TRANSACTION
        to: IN_TRANSACTION
        trigger: POST /referrals/{clientId}/manual-referral
        actor: OperationsCoordinator
        preconditions:
          - "the client already carries a partner referral"
        side_effects:
          - "Client.assignment_reason unchanged"
        note: "Pass-through branch on a second client status."
      - from: CLOSED
        to: IN_TRANSACTION
        trigger: POST /clients/{clientId}/transactions
        actor: TransactionCoordinator
        preconditions:
          - "the client's most recent Transaction has coordination_status CLOSED and closed_at <= now - 180 days"
        side_effects:
          - "a new Transaction opens with agent_satisfaction_credit = 0.05"
        note: "Date-based re-open: this is the only path that lets a client reopen after CLOSED, and it is where the 180-day decay window becomes observable."
      - from: REFERRED
        to: REFERRED
        trigger: POST /referrals/{referralId}/reconcile
        actor: TransactionCoordinator
        preconditions:
          - "Reconcile is this scaffold's accepted test-driving entry point for re-deriving a referral after a late contract price (see §1.5)"
        side_effects:
          - "Region.referral_count recomputed"
        note: "No transition out of REFERRED: the client stays with the partner brokerage."

  # --- State machine 3: Transaction (parallel dimension + cycle) -------------
  - entity: Transaction
    initial_state: UNASSIGNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: POST /clients/{clientId}/transactions
        actor: TransactionCoordinator
        preconditions:
          - "client.assignment_mode == ASSIGNED_DIRECT"
        side_effects:
          - "Transaction.lead_agent_id = Client.assigned_agent_id"
          - "ActivityAudit row appended"
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: POST /transactions/{transactionId}/coordination
        actor: TransactionCoordinator
        preconditions: []
        side_effects:
          - "ActivityAudit row appended"
        note: "Used when the client was referred: lead_agent_id stays null."
      - from: ASSIGNED
        to: REVIEW
        trigger: POST /transactions/{transactionId}/coordination
        actor: TransactionCoordinator
        preconditions:
          - "Contract review requested"
        side_effects:
          - "ActivityAudit row appended"
      - from: REVIEW
        to: ASSIGNED
        trigger: POST /transactions/{transactionId}/coordination
        actor: TransactionCoordinator
        preconditions:
          - "Review returned for correction; the agent never touches this dimension"
        side_effects:
          - "ActivityAudit row appended"
        note: "Cyclic leg — transaction coordination is centralized away from the agent."
      - from: REVIEW
        to: CLOSED
        trigger: POST /transactions/{transactionId}/close
        actor: TransactionCoordinator
        preconditions:
          - "contract_price_cents > 0"
        side_effects:
          - "Transaction.closed_at = now"
          - "cascade: the client's originating OpenClientCount.active_client_count -= 1"
          - "cascade (depth 2): Agent.close_rate recomputed, then Agent.bonus_pct and Agent.bonus_cents recomputed via salaried_bonus"
          - "cascade (depth 3): the ListingAgreement whose client_id is this transaction's client -> CLOSED"
          - "cascade (depth 4): the now-CLOSED ListingAgreement's final_listing_fee_cents recomputed"
          - "Client.status -> CLOSED"
      - from: ASSIGNED
        to: CANCELLED
        trigger: POST /transactions/{transactionId}/cancel
        actor: TransactionCoordinator
        preconditions:
          - "no contract price recorded"
        side_effects:
          - "cascade: the client's originating OpenClientCount.active_client_count -= 1"
          - "cascade (depth 2): OpenClientCount.ratio_state recomputed"
          - "Client.status -> UNASSIGNED when the client still has no other open transaction"
      - from: REVIEW
        to: CANCELLED
        trigger: POST /transactions/{transactionId}/cancel
        actor: TransactionCoordinator
        preconditions: []
        side_effects:
          - "cascade: the client's originating OpenClientCount.active_client_count -= 1"
          - "Client.status -> UNASSIGNED when the client still has no other open transaction"

  # --- State machine 4: ListingAgreement (branching with revert) -------------
  - entity: ListingAgreement
    initial_state: DRAFT
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /listing-agreements/{agreementId}/publish
        actor: ListingAgent
        preconditions:
          - "the client's status IN {UNASSIGNED, ASSIGNED, IN_TRANSACTION}"
          - "gross_listing_fee_cents > 0"
        side_effects:
          - "ListingAgreement.posted_at = now"
          - "cascade: Region.occupancy_pct recomputed"
      - from: ACTIVE
        to: UNDER_CONTRACT
        trigger: POST /listing-agreements/{agreementId}/accept-offer
        actor: ListingAgent
        preconditions:
          - "contract_price_cents >= 1"
        side_effects:
          - "cascade: AgentReferral for the same client (if any) recomputed via referrer_split; settlement_status PENDING -> COMPUTED"
          - "cascade (depth 2): ListingAgreement.final_listing_fee_cents recomputed from the new partner_referral_fee_cents"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: POST /listing-agreements/{agreementId}/withdraw
        actor: ListingAgent
        preconditions: []
        side_effects:
          - "cascade: AgentReferral for the same client -> settlement_status PENDING"
      - from: UNDER_CONTRACT
        to: ACTIVE
        trigger: POST /listing-agreements/{agreementId}/revert-to-active
        actor: ListingAgent
        preconditions:
          - "the listing's client has no non-CANCELLED Transaction in coordination_status CLOSED"
        side_effects:
          - "cascade: AgentReferral for the same client -> PENDING"
          - "cascade (depth 2): ListingAgreement.final_listing_fee_cents recomputed to gross_listing_fee_cents"
        note: "Cyclic leg — a failed contract returns the listing to market."
      - from: UNDER_CONTRACT
        to: CLOSED
        trigger: "system (automatic when the listing's client has a Transaction entering coordination_status CLOSED)"
        actor: system
        preconditions: []
        side_effects:
          - "ListingAgreement.final_listing_fee_cents frozen at its current value"

  # --- State machine 5: Tour (branching) -------------------------------------
  - entity: Tour
    initial_state: ACCESS_PENDING
    terminal_states: [COMPLETED, CANCELLED_NO_SHOW, CANCELLED]
    transitions:
      - from: ACCESS_PENDING
        to: CONFIRMED
        trigger: POST /tours/{tourId}/confirm
        actor: AssociateAgent
        preconditions:
          - "the access window has opened: now >= scheduled_at - access_code_release_lead_minutes"
          - "an associate_agent_id is set when the lead agent's UniServicedTourCount >= block threshold"
        side_effects:
          - "cascade: LeadCapacity.associate_capacity_used += 1 when associate_agent_id is not null"
          - "cascade (depth 2): LeadCapacity.tours_in_week recomputed for the lead agent"
      - from: CONFIRMED
        to: COMPLETED
        trigger: POST /tours/{tourId}/complete
        actor: AssociateAgent
        preconditions:
          - "feedback_rating is provided (1..5)"
        side_effects:
          - "hop 0 -> 1: Tour.status -> COMPLETED, caused by this request"
          - "hop 1 -> 2: a Survey row is created for the client's Transaction with response_status RESPONDED and bonus_eligible true, caused by the tour completing"
          - "hop 2 -> 3: Agent.satisfaction_score is recomputed into its new band, caused by the new RESPONDED survey"
          - "hop 3 -> 4: Agent.bonus_pct and Agent.bonus_cents are recomputed from the changed satisfaction_score, caused by the score change"
          - "hop 4 -> 5: LeadCapacity.current_state is recomputed, caused by the bonus band change, and the recomputed Agent.salary_commitment_cents is persisted"
      - from: CONFIRMED
        to: CANCELLED_NO_SHOW
        trigger: POST /tours/{tourId}/no-show
        actor: AssociateAgent
        preconditions: []
        side_effects:
          - "cascade: Tour is voided from the lead agent's tour load — LeadCapacity.tours_in_week recomputed"
          - "Agent.satisfaction_score unaffected (no feedback was captured)"
      - from: ACCESS_PENDING
        to: CANCELLED
        trigger: POST /tours/{tourId}/cancel
        actor: OperationsCoordinator
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: POST /tours/{tourId}/cancel
        actor: OperationsCoordinator
        preconditions: []
        side_effects:
          - "cascade: LeadCapacity.associate_capacity_used -= 1 when associate_agent_id is not null"
      - from: ACCESS_PENDING
        to: ACCESS_PENDING
        trigger: POST /tours
        actor: OperationsCoordinator
        preconditions:
          - "the lead agent already has a Tour in status IN {ACCESS_PENDING, CONFIRMED, COMPLETED} whose [scheduled_at, scheduled_at + 60 min) overlaps the requested window (ERR_TOUR_SCHEDULE_CONFLICT)"
        side_effects: []
      - from: CONFIRMED
        to: CONFIRMED
        trigger: POST /tours/{tourId}/feedback
        actor: AssociateAgent
        preconditions: []
        side_effects:
          - "cascade: Agent.satisfaction_score recomputed"
          - "cascade (depth 2): Agent.bonus_pct and Agent.bonus_cents recomputed via salaried_bonus"
        note: "Feedback capture on an already-confirmed tour; status does not change."

  # --- State machine 6: Survey (linear) --------------------------------------
  - entity: Survey
    initial_state: DISPATCHED
    terminal_states: [RESPONDED, EXPIRED_DISPATCH]
    transitions:
      - from: DISPATCHED
        to: RESPONDED
        trigger: POST /surveys/{surveyId}/respond
        actor: OperationsCoordinator
        preconditions:
          - "score is provided (1..5)"
          - "the survey has not been through 2 ops runs without a response"
        side_effects:
          - "Survey.bonus_eligible remains false — a manually answered dispatch never earns bonus credit"
          - "cascade: Agent.satisfaction_score recomputed"
          - "cascade (depth 2): Agent.bonus_pct and Agent.bonus_cents recomputed via salaried_bonus"
          - "cascade (depth 3): LeadCapacity.current_state recomputed when the bonus band changed"
      - from: DISPATCHED
        to: EXPIRED_DISPATCH
        trigger: "system (automatic during run_ops when the survey has been DISPATCHED through 2 ops runs)"
        actor: system
        preconditions: []
        side_effects:
          - "Agent.satisfaction_score recomputed excluding this survey"
      - from: EXPIRED_DISPATCH
        to: RESPONDED
        trigger: POST /surveys/{surveyId}/respond
        actor: OperationsCoordinator
        preconditions:
          - "score is provided (1..5)"
        side_effects:
          - "Survey.bonus_eligible remains false"
          - "cascade: Agent.satisfaction_score recomputed"

  # --- State machine 7: AgentReferral (cyclic) -------------------------------
  - entity: AgentReferral
    initial_state: PENDING
    terminal_states: [SETTLED]
    transitions:
      - from: PENDING
        to: COMPUTED
        trigger: POST /referrals/{referralId}/reconcile
        actor: TransactionCoordinator
        preconditions:
          - "the referred client has a ListingAgreement or Transaction carrying a contract price"
        side_effects:
          - "AgentReferral.referral_fee_cents recomputed via referrer_split"
          - "cascade: the same client's ListingAgreement.final_listing_fee_cents recomputed from the new referral fee"
      - from: COMPUTED
        to: COMPUTED
        trigger: POST /referrals/{referralId}/reconcile
        actor: TransactionCoordinator
        preconditions:
          - "a superseding contract price has been recorded since the previous computation"
        side_effects:
          - "AgentReferral.referral_fee_cents recomputed from the superseding price"
        note: "Cyclic leg — re-derivation in place with no settlement postings, so the conservation invariant holds."
      - from: COMPUTED
        to: SETTLED
        trigger: POST /referrals/{referralId}/settle
        actor: TransactionCoordinator
        preconditions:
          - "a settlement_reference is provided"
        side_effects:
          - "AgentReferral.settlement_status -> SETTLED (terminal)"
      - from: COMPUTED
        to: PENDING
        trigger: "system (automatic when a late contract price supersedes the basis before settlement)"
        actor: system
        preconditions: []
        side_effects:
          - "AgentReferral.referral_fee_cents recomputed from the late price"
        note: "Cyclic leg — COMPUTED -> PENDING -> COMPUTED is the late-price supersession round."
      - from: PENDING
        to: PENDING
        trigger: POST /referrals/{referralId}/reconcile
        actor: TransactionCoordinator
        preconditions:
          - "no contract price exists yet for the referred client (ERR_NO_CONTRACT_PRICE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: listing-agreement-revise-stale-region
    parent_entity: Region
    write_endpoint: "POST /listing-agreements"
    occ_field: "expected_region_version"
    description: |
      A ListingAgreement created against a Region whose version has advanced
      since the client last observed it is rejected: the region's derived
      fields (agent_count, occupancy_pct) changed under the writer's feet, so
      the fee baseline it was priced against is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: referral-setup-stale-region
    parent_entity: Region
    write_endpoint: "POST /referrals"
    occ_field: "expected_region_version"
    description: |
      A referral recorded against a Region whose version has advanced since
      the client last observed it is rejected, because the partner pool and
      referral_count snapshot the writer priced its fee against is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: agent-status-stale-agent
    parent_entity: Agent
    write_endpoint: "POST /agents/{id}/status"
    occ_field: "expected_agent_version"
    description: |
      A status change or a benefit-enrolment merge written against an Agent
      whose version has advanced since the client last observed it is
      rejected: the agent's stored benefits and salary fields the writer
      merged into are stale.
    error_id: ERR_STALE_VERSION
    http_status: 412# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: lead_capacity_band
    trigger: "any change to OpenClientCount.active_client_count, or creation of an Agent"
    algorithm: threshold
    formula: |
      floor_n = floor(target_client_ratio)        # target_client_ratio from the agent's Region
      ceil_n  = ceil(target_client_ratio)
      if active_client_count < floor_n:
          OpenClientCount.ratio_state = UNDER_TARGET
      elif active_client_count >= ceil_n:
          OpenClientCount.ratio_state = OVER_TARGET
      else:
          OpenClientCount.ratio_state = ON_TARGET      # the exact equality band
      # LeadCapacity.current_state - the posture that GATES the assignment selector:
      if agent.status == ON_LEAVE:                 LeadCapacity.current_state = OVER_TARGET
      elif active_client_count >= ceil_n:          LeadCapacity.current_state = OVER_TARGET
      elif active_client_count >= floor_n:         LeadCapacity.current_state = AT_CAPACITY
      else:                                        LeadCapacity.current_state = OPEN
      # Agent.status -> AT_CAPACITY in the same request that pushes active_client_count to floor_n
      # target_client_ratio < 1 degrades to floor_n = ceil_n = 1
    input_set: "OpenClientCount rows of exactly one agent; Region.target_client_ratio of that agent's region"
    constants:
      DEFAULT_TARGET_CLIENT_RATIO: 1.0
    precision: "ratio_state is an enum; no numeric rounding"
    variants:
      - name: count_normalized_vs_absolute_deficit
        when: "both bands are observable on the same active_client_count whenever target_client_ratio is not a whole number"
        difference: |
          count_normalized (the stored band): compares active_client_count against
            floor(target_client_ratio) and ceil(target_client_ratio) of the REGION target,
            so 1 client against a target of 1.5 reads ON_TARGET (1 >= floor 1).
          absolute_deficit (not stored): compares active_client_count against the fractional
            target directly, so the same 1 client against 1.5 reads UNDER_TARGET (1 < 1.5).
          The scaffold pins count_normalized as ratio_state; the two approaches therefore
          disagree for every target whose fractional part is non-zero.

  - name: region_occupancy
    trigger: "POST /regions/{regionId}/run-ops; any Agent status change; any OpenClientCount change"
    algorithm: threshold
    formula: |
      active_agents   = count(Agent where status IN {ACTIVE, AT_CAPACITY})
      clients_in_pipeline = count(Client where region_id == region.id
                                  and status IN {UNASSIGNED, ASSIGNED, IN_TRANSACTION})
      denominator     = active_agents * target_client_ratio
      occupancy_pct   = 0.0 if denominator == 0 else round_half_up(clients_in_pipeline / denominator, 4)
      # band edges (rate / threshold triggers):
      #   occupancy_pct >= 1.00  -> OVER_TARGET band ... EXCEPT when occupancy_pct >= 1.00 and
      #                             occupancy_pct <= OVER_TARGET_VETO_CEILING, which forms the
      #                             veto band
      #   occupancy_pct >= 0.75  -> NEAR_TARGET band
      #   otherwise              -> UNDER_TARGET band
    input_set: "Agent rows of the region with status IN {ACTIVE, AT_CAPACITY}; OpenClientCount rows of those agents"
    constants:
      NEAR_TARGET_BAND_MIN: 0.75
      OVER_TARGET_BAND_MIN: 1.00
      OVER_TARGET_VETO_CEILING: 1.25
    precision: "4 decimal places, round_half_up"
    evaluation_order: |
      occupancy_pct is circular-looking: it is derived alongside assignment, and assignment changes
      OpenClientCount.active_client_count, that changes LeadCapacity.current_state, that changes
      Agent.status, and Agent.status feeds back into agent_count - the denominator of
      occupancy_pct. The order is therefore pinned:
        1. recompute agent_count from Agent.status AS OBSERVED AT REQUEST ENTRY
        2. recompute clients_in_pipeline from OpenClientCount.active_client_count as observed
           at request entry (before this request's own increments)
        3. compute occupancy_pct, then occupancy_band
        4. evaluate the band gate with THAT value - the gate never re-reads a value it changed
        5. run cascades, then recompute agent_count and occupancy_pct ONCE more so the persisted
           value reflects the post-cascade state
      Step 4 makes the gate deterministic; step 5 keeps the stored value consistent with the
      stored Agent.status.

  - name: listing_fee_and_savings
    trigger: "ListingAgreement creation, publish, accept-offer, revert-to-active"
    algorithm: tiered_pricing
    formula: |
      traditional_listing_fee_cents = round_half_up(list_price_cents * region.traditional_commission_pct, 0)
      gross_listing_fee_cents       = round_half_up(list_price_cents * list_fee_rate_pct, 0)
      # Base (flat-rate) variant:
      savings_amount_cents = round_half_up(traditional_listing_fee_cents - gross_listing_fee_cents, 0)
      savings_pct          = proportional_definite(savings_amount_cents / traditional_listing_fee_cents)
      # Marginal-tier roadmap (reported alongside; NOT the charged fee):
      MARGINAL_TIER_BREAKS = [50000000,   # $500,000
                              100000000,  # $1,000,000
                              200000000]  # $2,000,000
      MARGINAL_TIER_RATES  = [0.015, 0.0125, 0.010]
      roadmap = sum over each slice of list_price_cents that falls in a band of
                round_half_up(slice * MARGINAL_TIER_RATES[band], 0)
    input_set: "ListingAgreement rows whose status IN {ACTIVE, UNDER_CONTRACT, CLOSED}; DRAFT rows are excluded from region roll-ups"
    constants:
      MARGINAL_TIER_BREAKS: [50000000, 100000000, 200000000]
      MARGINAL_TIER_RATES: [0.015, 0.0125, 0.010]
    precision: "2 decimal places on cents amounts via round_half_up at each step; savings_pct 4 dp"
    rounding_order: |
      The flat base has no nested rounding: gross_listing_fee_cents, traditional_listing_fee_cents
      and savings_amount_cents are each produced by a single round_half_up at whole cents, so
      round-per-line-then-sum and sum-then-round coincide. The marginal roadmap (reported, not
      charged) sums with round-per-slice-then-sum pinned; no response field carries it, so the
      contract surface pins only savings_pct, whose rounding MODE is what the variant changes.
    variants:
      - name: provisional_vs_final_base
        when: "PROVISIONAL is reported while status == UNDER_CONTRACT with a partner referral present; FINAL is reported once the referral fee is deducted"
        difference: |
          provisional: final_listing_fee_cents = gross_listing_fee_cents - partner_referral_fee_cents
                       savings_pct            = proportional_definite(savings_amount_cents / gross_listing_fee_cents)
          final:       final_listing_fee_cents = gross_listing_fee_cents - 0
                       savings_pct            = proportional_definite(savings_amount_cents / traditional_listing_fee_cents)
          Same list_price_cents and list_fee_rate_pct -> the two variants report
          different savings_pct. The final variant is the one persisted on the row.

  - name: salaried_bonus
    trigger: "Agent close_rate change, Survey response, tour completion, run-ops satisfaction revision"
    algorithm: weighted_scoring
    formula: |
      eligibility_gate:
        if Agent.status == ON_LEAVE                  -> NOT_ELIGIBLE ("on_leave")
        closed = count(Transaction where lead_agent_id == agent.id and coordination_status == CLOSED)
        if closed < BONUS_MIN_CLOSED_TRANSACTIONS    -> NOT_ELIGIBLE ("insufficient_closed_transactions")
        if Agent.satisfaction_score is null          -> NOT_ELIGIBLE ("no_satisfaction_score")
        if has_responded_survey_with_bonus_eligible_false_since_last_bonus -> NOT_ELIGIBLE ("penalty_block_active")

      if NOT_ELIGIBLE: Agent.bonus_pct = 0; Agent.bonus_cents = 0

      if BONUS_ELIGIBLE:
        close_component = BONUS_CLOSE_WEIGHT        * Agent.close_rate
        csat_component  = BONUS_CSAT_WEIGHT         * (Agent.satisfaction_score / 5.0)
        occ_component   = BONUS_OCCUPANCY_WEIGHT    * min(region.occupancy_pct, 1.0)
        bonus_pct_raw   = close_component + csat_component + occ_component
        if bonus_pct_raw > BONUS_PCT_CAP: bonus_pct_raw = BONUS_PCT_CAP
        Agent.bonus_pct = round_half_up(bonus_pct_raw, 4)
        Agent.bonus_cents = round_half_up(Agent.base_salary_cents * Agent.bonus_pct, 0)
    input_set: "Survey rows of the agent whose response_status == RESPONDED; Transaction rows of the agent whose coordination_status IN {CLOSED, CANCELLED}"
    constants:
      BONUS_CLOSE_WEIGHT: 0.2
      BONUS_CSAT_WEIGHT: 0.15
      BONUS_OCCUPANCY_WEIGHT: 0.1
      BONUS_PCT_CAP: 0.30
      BONUS_MIN_CLOSED_TRANSACTIONS: 3
      SATISFACTION_INCLUDED_STATES: ["RESPONDED"]
    precision: "bonus_pct 4 decimal places round_half_up; bonus_cents integer round_half_up"
    variants:
      - name: provisional_vs_final_csat
        when: "PROVISIONAL is reported while any of the agent's surveys is DISPATCHED; FINAL is reported once every dispatched survey has resolved"
        difference: |
          provisional: satisfaction_score = round_half_up(mean of Survey.score over surveys
                       whose response_status == RESPONDED, 2)
          final:       satisfaction_score = round_half_up(mean of Survey.score over surveys
                       whose response_status IN {RESPONDED} UNION {DISPATCHED surveys answered later},
                       2)  -- and a survey answered after EXPIRED_DISPATCH that has
                       bonus_eligible == false zeroes csat_component entirely
          The final variant also applies the penalty: any answered survey with
          bonus_eligible == false sets csat_component = 0 for this period.

  - name: listing_service_commitment
    trigger: "ListingAgreement creation and publish"
    algorithm: threshold
    formula: |
      if service_tier == FULL_SERVICE:    service_commitment_hours = 24
      elif service_tier == LIMITED_SERVICE: service_commitment_hours = 48
      else (MLS_ONLY):                    service_commitment_hours = 0
      on-time rule: first_response_at must be at or before posted_at + service_commitment_hours hours
      if first_response_at > posted_at + service_commitment_hours * 1 hour:
          service_commitment_hours = service_commitment_hours + 24
          an ActivityAudit row of kind SERVICE_COMMITMENT_BREACH is appended
      # MLS_ONLY (0 hours) never breaches — the rule is skipped when commitment == 0
      trailing_slice_tuning(list_price_cents):
          slices = the part of list_price_cents in each band of TRAILING_SLICE_BREAKS
          tuning = sum over bands of round_half_up(slice * TRAILING_SLICE_HOURS[band], 0)
          # rounding order is PINNED to round-per-slice-then-sum: for list_price_cents
          # 100000019 the slice tails are 33333333 / 66666667 / 19, giving
          # 490000 + 753333 + 0 = 1243333, while summing the raw products first
          # (1243333.5029) and rounding once gives 1243334. The pinned order is
          # round-per-slice-then-sum, and 1243333 != 1243334 identifies it.
    input_set: "ListingAgreement rows whose status IN {ACTIVE, UNDER_CONTRACT, CLOSED}"
    constants:
      FULL_SERVICE_HOURS: 24
      LIMITED_SERVICE_HOURS: 48
      MLS_ONLY_HOURS: 0
      BREACH_REVISION_HOURS: 24
      TRAILING_SLICE_BREAKS: [33333333, 100000000, 200000000]
      TRAILING_SLICE_HOURS: [0.0147, 0.0113, 0.0091]
    rounding_order: |
      round-per-slice-then-sum is pinned (see the formula). The two orders diverge for
      list_price_cents 100000019 (1243333 vs 1243334) and coincide for list_price_cents
      100000000 (1243333 both ways) - so the rounding order is observable only on a slice
      tail that multiplies to a half-hour or above.
    precision: "integer hours; reference instants compared to the second"

  - name: tour_access_release
    trigger: "Tour creation; any GET of a Tour"
    algorithm: threshold
    formula: |
      release_at = scheduled_at - (access_code_release_lead_minutes * 60) seconds
      access_code is included in the response payload  iff  now >= release_at
      access_code is null in the response payload           iff  now <  release_at
      # the boundary is inclusive on the release instant
    input_set: "Tour rows in status ACCESS_PENDING or CONFIRMED"
    constants:
      access_code_release_lead_minutes: 120
    precision: "second-level comparison against the logical clock"

  - name: tour_no_show_timeout
    trigger: "POST /regions/{regionId}/run-ops"
    algorithm: projection
    formula: |
      for each Tour with status == CONFIRMED:
          if now >= scheduled_at + (no_show_grace_minutes * 60) seconds:
              Tour.status = CANCELLED_NO_SHOW
              cascade: LeadCapacity.tours_in_week recomputed for the lead agent
    input_set: "Tour rows whose status == CONFIRMED"
    constants:
      no_show_grace_minutes: 30
    precision: "second-level comparison against the logical clock"

  - name: tour_block_threshold
    trigger: "Tour creation"
    algorithm: threshold
    formula: |
      block_n = max(1, ceil(region.target_client_ratio))
      if region.target_client_ratio < 1.0: block_n = 1
      if UniServicedTourCount(lead_agent) >= block_n:
          associate_agent_id is REQUIRED (ERR_ASSOCIATE_AGENT_REQUIRED when absent)
      else:
          associate_agent_id is optional
      UniServicedTourCount = count(Tour where lead_agent_id == lead_agent and
                                   associate_agent_id IS NULL and
                                   status IN {ACCESS_PENDING, CONFIRMED, COMPLETED} and
                                   scheduled_at in [now, now + 7 days])
    input_set: "Tour rows whose status IN {ACCESS_PENDING, CONFIRMED, COMPLETED}"
    constants:
      ASSOCIATE_CAPACITY_LIMIT: 4
    precision: "integer count; the window is inclusive at both ends"

  - name: referrer_split
    trigger: "AgentReferral creation; POST /referrals/{referralId}/reconcile; accept-offer on the referred client's listing"
    algorithm: tiered_pricing
    formula: |
      basis_cents       = max(contract_price_cents, 1)
      fee_cents         = round_half_up(basis_cents * referral_fee_bps / 10000, 0)
      partner_share     = 0.25 when split_policy == SPLIT_25_PARTNER
                          0.50 when split_policy == SPLIT_50_PARTNER
      partner_cents     = round_half_up(fee_cents * partner_share, 0)
      house_cents       = fee_cents - partner_cents
      conservation: partner_cents + house_cents == fee_cents   (exact integer equality)
    input_set: "AgentReferral rows in any settlement_status"
    constants:
      MAX_REFERRAL_FEE_BPS: 2500
      REFERRAL_PARTNER_CAPACITY: 3
    precision: "integer cents, round_half_up; conservation equality is exact"
    variants:
      - name: fee_on_contract_price_vs_fee_on_listing_fee
        when: "whenever the referred client also carries a ListingAgreement, so both bases are available at once"
        difference: |
          fee_on_contract_price (PINNED, the stored value):
              fee_cents = round_half_up(contract_price_cents * referral_fee_bps / 10000, 0)
          fee_on_listing_fee (unpinned alternative):
              fee_cents = round_half_up(ListingAgreement.gross_listing_fee_cents * referral_fee_bps / 10000, 0)
          For contract_price_cents = 100000000, referral_fee_bps = 1500 and a listing whose
          gross_listing_fee_cents is 1500000 the two bases produce 15000000 and 225000 - a
          systematic divergence, not a rounding artifact. The scaffold pins fee_on_contract_price.

  - name: tour_load_bands
    trigger: "LeadCapacity recomputation; any Tour status change"
    algorithm: interval_merge
    formula: |
      window = [now, now + 7 days]        # inclusive at both ends
      tours_in_week = count(Tour where lead_agent_id == agent and status IN {ACCESS_PENDING, CONFIRMED, COMPLETED}
                            and scheduled_at in window)
      # band edges
      #   tours_in_week == 0            -> "idle"
      #   tours_in_week == 1            -> "light"
      #   2 <= tours_in_week <= 5       -> "normal"
      #   tours_in_week > 5             -> "overloaded"
      associate_capacity_used = count(Tour where lead_agent_id == agent and status == SCHEDULED
                                      and associate_agent_id IS NOT NULL)
    input_set: "Tour rows whose status IN {ACCESS_PENDING, CONFIRMED, COMPLETED} for one lead agent"
    constants:
      TOUR_WINDOW_DAYS: 7
      TOUR_LOAD_BAND_EDGES: [0, 1, 5]
    precision: "integer count"

  - name: agent_satisfaction_score
    trigger: "Tour completion, tour feedback, POST /surveys/{surveyId}/respond, run-ops expiry, date-based re-open"
    algorithm: aggregation
    formula: |
      included = Survey rows of the agent whose response_status == RESPONDED
      Agent.satisfaction_score = null if included is empty
                               = round_half_up(sum(score for s in included) / len(included), 2) otherwise
      excluded = Survey rows whose response_status == DISPATCHED or EXPIRED_DISPATCH
    input_set: "Survey rows of one agent whose response_status == RESPONDED"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: transaction_satisfaction_credit
    trigger: "POST /clients/{clientId}/transactions"
    algorithm: decay_function
    formula: |
      previous = the client's most recent Transaction with coordination_status == CLOSED
                 ordered by closed_at DESC, created_at DESC
      if previous is null:                                        credit = 0.0
      elif previous.closed_at <= now - 180 days:                  credit = 0.05
      elif previous.closed_at >  now - 180 days:                  credit = 0.0
      # boundary: exactly 180 days before now is INSIDE the eligible side
    input_set: "Transaction rows of one client whose coordination_status IN {CLOSED, CANCELLED}"
    constants:
      SATISFACTION_CREDIT: 0.05
      SATISFACTION_CREDIT_WINDOW_DAYS: 180
    precision: "2 decimal places, round_half_up"

  - name: agent_close_rate
    trigger: "Transaction close or cancel; POST /transactions/{transactionId}/coordination"
    algorithm: aggregation
    formula: |
      closed = count(Transaction where lead_agent_id == agent.id and coordination_status == CLOSED)
      total  = count(Transaction where lead_agent_id == agent.id and coordination_status != CANCELLED)
      Agent.close_rate = 0.0 if total == 0 else round_half_up(closed / total, 4)
    input_set: "Transaction rows of one agent whose coordination_status != CANCELLED"
    constants: {}
    precision: "4 decimal places, round_half_up"

  - name: region_open_referral_count
    trigger: "POST /referrals; POST /referrals/{referralId}/settle; POST /transactions/{transactionId}/close"
    algorithm: aggregation
    formula: |
      # Re-derived AFTER the mutation in the SAME request (immediate consistency).
      open_referral_count = count(AgentReferral where region_id == region.id
                                  and settlement_status IN {PENDING, COMPUTED})
      # SETTLED referrals leave the ledger; nothing re-adds them.
      # The gate on POST /referrals and POST /referrals/{id}/accept reads
      #   Region.open_referral_count >= Region.capacity  -> ERR_REGION_CAPACITY_EXCEEDED
    input_set: "AgentReferral rows of one region whose settlement_status IN {PENDING, COMPUTED}"
    constants: {}
    precision: "integer count"

  - name: agent_salary_commitment
    trigger: "POST /agents; POST /agents/{agentId}/status; any Survey response; any tour completion"
    algorithm: aggregation
    formula: |
      salary_commitment_cents = base_salary_cents + bonus_cents + benefits_cents + expense_allowance_cents
      # The four components are read AFTER any §1.3 bonus recompute in the same request, so a
      # bonus change moves the commitment in the same response.
    input_set: "Agent rows in any non-TERMINATED status"
    constants: {}
    precision: "integer cents"

  - name: region_referral_backfill
    trigger: "POST /referrals; POST /referrals/{referralId}/settle; POST /tours; POST /regions/{regionId}/run-ops"
    algorithm: waterfall_allocation
    formula: |
      shortfall = region.capacity - region.open_referral_count
      # the backfill draws the region's outstanding tour requirement from the region ledger,
      # ordered by created_at ASC and tie-broken by tour id ASC (never by row id ordering),
      # SETTLED referrals are excluded from the ledger
      while shortfall > 0:
          pick the earliest Team row whose unassigned_tours > 0 and whose tours are not yet covered
          unassigned_tours -= 1
          open_referral_count += 1
          shortfall         -= 1
      if every row is exhausted before shortfall reaches 0: stop (the backfill is bounded by the ledger)
    input_set: "AgentReferral rows of one region whose settlement_status IN {PENDING, COMPUTED}; Agent rows of that region with unassigned_tours > 0"
    constants:
      REFERRAL_PARTNER_CAPACITY: 3
    precision: "integer counts"

  - name: agent_referral_fee_bps
    trigger: "POST /agents; POST /agents/{agentId}/status"
    algorithm: derived_field_reconciliation
    formula: |
      # derived-and-stored field, recomputed inside any request that mutates its inputs
      referral_fee_bps = min(REFERRAL_FEE_CAP_BPS, int(round(base_salary_cents / 10000)))
      # REFERRAL_FEE_CAP_BPS = 2500; an agent with a 20,000,000-cent base lands exactly on the cap
    input_set: "Agent rows in any status"
    constants:
      REFERRAL_FEE_CAP_BPS: 2500
      REFERRAL_FEE_BPS_PER_10K_SALARY_CENTS: 1
    precision: "integer basis points"

  - name: transaction_coordination_reconcile
    trigger: "POST /transactions/{transactionId}/coordination; POST /transactions/{transactionId}/close; POST /transactions/{transactionId}/cancel"
    algorithm: aggregation
    formula: |
      # PINNED ordering: the reconciliation sweep reads the agent's transactions as observed at
      # request entry (graded_transactions is the pre-write count), then this request's own
      # transition is applied and the derived fields are written once.
      # UNPINNED variant: sweep after the write, so the new CLOSED row is already inside the count.
      graded_transactions = count(Transaction where lead_agent_id == agent.id
                                  and coordination_status IN {CLOSED, CANCELLED})
      LeadCapacity.close_rate    = Agent.close_rate recomputed over the same pre-write set
      LeadCapacity.trailing_tours = sum(Tour.tours_next_36_hours for that agent)
    input_set: "Transaction rows of one lead agent whose coordination_status IN {CLOSED, CANCELLED}"
    constants:
      COORDINATION_RECONCILE_WINDOW_HOURS: 36
    precision: "close_rate 4 dp round_half_up; counts are integers"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and resolvable; when a logical clock exists the clock also starts at the fixed default 2026-09-01T00:00:00Z"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /regions and GET /regions/{regionId}"

  - priority: 2
    category: auth
    check: "The role in X-User-Role permits the operation; for entity_backed roles the X-User-ID must equal an existing entity id; for the ListingAgent role the acting agent must own the client referenced in the request"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "every endpoint whose §1.5 roles list excludes the caller's role; POST /listing-agreements"

  - priority: 3
    category: existence
    check: "Referenced ids exist and are resolved left-to-right in the order the endpoint's input list declares; an unresolvable agent_id is checked before client_id"
    error_id: "ERR_AGENT_NOT_FOUND / ERR_CLIENT_NOT_FOUND / ERR_REGION_NOT_FOUND / ERR_TRANSACTION_NOT_FOUND / ERR_LISTING_NOT_FOUND / ERR_TOUR_NOT_FOUND / ERR_SURVEY_NOT_FOUND / ERR_REFERRAL_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 3a
    category: business_constraint
    check: "Request shape: every required input is present, every enum field carries a declared member, and a supplied survey score sits inside 1..5"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all request bodies"

  - priority: 4
    category: state
    check: "The target resource is in a state from which the requested operation is declared in §1.2; for POST /tours this includes the cross-entity rule that the referenced client is in ASSIGNED or IN_TRANSACTION, and for POST /listing-agreements it includes the cross-entity rule that the referenced client has need_kind SELL"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 5
    category: business_temporal
    check: "Overlap and clock-window rules: no LeadCapacity block-window tour collision, no duplicate Tour at the same client_id, no second client originating a transaction for the same listing, access window and no-show grace compared against the logical clock"
    error_id: "ERR_TOUR_SCHEDULE_CONFLICT / ERR_ACCESS_WINDOW_NOT_OPEN"
    http_status: 409
    applies_to: "POST /tours, POST /tours/{tourId}/confirm"

  - priority: 6
    category: business_safety
    check: "Workload protection: an associate agent is mandatory once the lead agent's UniServicedTourCount reaches the block threshold, so a lead agent is never made to staff every tour itself"
    error_id: "ERR_ASSOCIATE_AGENT_REQUIRED / ERR_REGION_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "POST /tours, POST /clients/{clientId}/assign-agent, POST /referrals"

  - priority: 6a
    category: business_referential
    check: "Partner-pool capacity and benefit-enrolment: the region's partner pool is bounded by Region.capacity against the open-referral ledger, and a region with enrolment_is_required set refuses a referral, listing registration or agent-status merge that does not acknowledge enrolment"
    error_id: "ERR_REGION_CAPACITY_EXCEEDED / ERR_ENROLMENT_NOT_CONFIRMED"
    http_status: 409
    applies_to: "POST /referrals, POST /referrals/{referralId}/accept, POST /listing-agreements/{agreementId}/register, POST /agents/{agentId}/status"

  - priority: 7
    category: business_constraint
    check: "Referential and uniqueness constraints: agent home_zip must be a member of the region's service_area_codes; client email must be unique system-wide; a listing must belong to a SELL client"
    error_id: "ERR_GEOGRAPHY_MISMATCH / ERR_CLIENT_EMAIL_DUPLICATE / ERR_LISTING_CLIENT_MISMATCH"
    http_status: 409
    applies_to: "POST /agents, POST /clients, POST /listing-agreements"

  - priority: 8
    category: business_fiscal
    check: "Fiscal and capacity caps: list price ceiling, listing fee rate ceiling on the flat band, referral fee ceiling, and the region occupancy cap adjusted by its band"
    error_id: "ERR_LIST_PRICE_OUT_OF_BAND / ERR_LIST_FEE_RATE_EXCEEDED / ERR_REFERRAL_FEE_EXCEEDED / ERR_CONTRACT_PRICE_MISSING"
    http_status: 409
    applies_to: "POST /listing-agreements, POST /referrals, POST /referrals/{referralId}/reconcile"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Region ---------------------------------------------------------------
  - method: POST
    path: "/regions"
    description: "Create a metro region with its service area and ratio target"
    roles: [PlatformAdmin]
    code: 201
    input: [name, service_area_codes, traditional_commission_pct, target_client_ratio, "capacity?", "enrolment_is_required?"]
    output: Region
    side_effects:
      - "agent_count=0, clients_in_pipeline=0, occupancy_pct=0.0, referral_count=0, open_referral_count=0"
      - "admission_band defaults to UNDER_TARGET"

  - method: GET
    path: "/regions/{id}"
    description: "Get a region and its derived occupancy fields"
    roles: [PlatformAdmin, OperationsCoordinator, TransactionCoordinator]
    code: 200
    input: []
    output: Region
    side_effects: []

  - method: GET
    path: "/regions/{id}/agents"
    description: "List the agents of a region"
    roles: [PlatformAdmin, OperationsCoordinator, TransactionCoordinator]
    code: 200
    input: ["region_id?", "agent_kind?", "status?", "limit?", "offset?"]
    output: Agent[]
    side_effects: []

  - method: POST
    path: "/regions/{id}/run-ops"
    description: "Run the regional operations checkpoint. The logical clock default is fixed at 2026-09-01T00:00:00Z; this endpoint never reads wall-clock time. It ages surveys and tours and recomputes every occupancy-derived field"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Region
    side_effects:
      - "ops_run_index += 1"
      - "DISPATCHED surveys aged through 2 ops runs -> EXPIRED_DISPATCH"
      - "CONFIRMED tours past scheduled_at + 30 minutes -> CANCELLED_NO_SHOW"
      - "Agent.satisfaction_score, Region.occupancy_pct and Region.agent_count recomputed"
      - "Agent.salary_commitment_cents and Agent.referral_fee_bps recomputed for every agent"
      - "region_referral_backfill draws the region's outstanding tour requirement down from Region.open_referral_count"
      - "transaction_coordination_reconcile refreshes LeadCapacity.close_rate, graded_transactions and trailing_tours"
      - "increments Region.version by 1"

  - method: GET
    path: "/regions/{id}/referrals"
    description: "List the partner referrals of a region"
    roles: [PlatformAdmin, OperationsCoordinator, TransactionCoordinator]
    code: 200
    input: ["settlement_status?", "limit?", "offset?"]
    output: AgentReferral[]
    side_effects: []

  # --- Agent ----------------------------------------------------------------
  - method: POST
    path: "/agents"
    description: "Create a lead or associate agent inside a region; seeds the agent's OpenClientCount and LeadCapacity rows"
    roles: [PlatformAdmin]
    code: 201
    input: [region_id, full_name, agent_kind, home_zip, base_salary_cents, "benefits_cents?", "expense_allowance_cents?"]
    output: Agent
    side_effects:
      - "status=ACTIVE, close_rate=0.0, satisfaction_score=null, bonus_pct=0, bonus_cents=0"
      - "creates OpenClientCount with active_client_count=0, ratio_state=UNDER_TARGET"
      - "creates LeadCapacity with current_state=OPEN, tours_in_week=0, associate_capacity_used=0, close_rate=0"
      - "salary_commitment_cents = base_salary_cents + benefits_cents + expense_allowance_cents"
      - "referral_fee_bps computed via agent_referral_fee_bps; open_referral_count read from the region ledger"
      - "Region.agent_count and Region.occupancy_pct recomputed; increments Region.version by 1"

  - method: GET
    path: "/agents/{id}"
    description: "Get an agent with its current salary, bonus and score fields"
    roles: [PlatformAdmin, OperationsCoordinator, TransactionCoordinator, AssociateAgent]
    code: 200
    input: []
    output: Agent
    side_effects: []

  - method: GET
    path: "/agents"
    description: "List agents, optionally filtered by region, kind or status"
    roles: [PlatformAdmin, OperationsCoordinator, TransactionCoordinator, AssociateAgent]
    code: 200
    input: ["region_id?", "agent_kind?", "status?", "limit?", "offset?"]
    output: Agent[]
    side_effects: []

  - method: POST
    path: "/agents/{id}/status"
    description: "Set an agent's employment status (sabbatical or return)"
    roles: [PlatformAdmin]
    code: 200
    input: [new_status, "enrolment_acknowledged?", expected_agent_version]
    output: Agent
    side_effects:
      - "Agent.status -> new_status; bonus_pct and bonus_cents recomputed via salaried_bonus"
      - "salary_commitment_cents and referral_fee_bps recomputed via agent_salary_commitment and agent_referral_fee_bps"
      - "LeadCapacity.current_state recomputed; Region.agent_count recomputed"
      - "when Region.enrolment_is_required and enrolment_acknowledged is false: ERR_ENROLMENT_NOT_CONFIRMED and no field is written"
      - "increments Agent.version and Region.version by 1 each"

  # --- OpenClientCount (FK reverse-reachability for Agent) -------------------
  - method: GET
    path: "/agents/{id}/open-client-counts"
    description: "Read the agent's open-client tally row"
    roles: [PlatformAdmin, OperationsCoordinator, TransactionCoordinator, AssociateAgent]
    code: 200
    input: []
    output: OpenClientCount[]
    side_effects: []

  # --- LeadCapacity (FK reverse-reachability for Agent) ----------------------
  - method: GET
    path: "/agents/{id}/lead-capacity"
    description: "Read the agent's capacity posture row"
    roles: [PlatformAdmin, OperationsCoordinator, TransactionCoordinator, AssociateAgent]
    code: 200
    input: []
    output: LeadCapacity[]
    side_effects: []

  # --- Client ---------------------------------------------------------------
  - method: POST
    path: "/clients"
    description: "Register a client; the region is resolved from the service area code"
    roles: [OperationsCoordinator]
    code: 201
    input: [full_name, email, service_area_code, need_kind]
    output: Client
    side_effects:
      - "status=UNASSIGNED, assigned_agent_id=null, assignment_mode=UNASSIGNED"
      - "Region.clients_in_pipeline recomputed; increments Region.version by 1"

  - method: GET
    path: "/clients/{id}"
    description: "Get a client with its assignment fields"
    roles: [PlatformAdmin, OperationsCoordinator, TransactionCoordinator, ListingAgent]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/clients"
    description: "List clients, optionally filtered by region, status or service area code"
    roles: [PlatformAdmin, OperationsCoordinator, TransactionCoordinator, ListingAgent]
    code: 200
    input: ["region_id?", "status?", "service_area_code?", "need_kind?", "assigned_agent_id?", "limit?", "offset?"]
    output: Client[]
    side_effects: []

  - method: POST
    path: "/clients/{id}/assign-agent"
    description: >
      Run the geographic customer-assignment selector for a client. The candidate set is every Agent
      whose region_id equals the client's region and whose LeadCapacity.current_state == OPEN; the
      candidates are ranked by OpenClientCount.active_client_count ASC and tie-broken by
      Agent.created_at ASC. When the candidate set is empty the client stays UNASSIGNED with
      assignment_reason ALL_AT_CAPACITY and the call reports ERR_NO_ELIGIBLE_AGENT; when manual_partner
      is true and the region's partner pool is not full the client is routed to REFERRED_PARTNER
      instead. Row ids never participate in the ranking or the tie-break.
    roles: [OperationsCoordinator]
    code: 200
    input: ["manual_partner?"]
    output: Client
    side_effects:
      - "when manual_partner is true the client is routed to a partner: Client.status -> REFERRED, assignment_mode -> REFERRED_PARTNER, assignment_reason -> MANUAL_PARTNER, and no agent is selected"
      - "partner routing is refused with ERR_REGION_CAPACITY_EXCEEDED when Region.open_referral_count >= Region.capacity"
      - "cascade: selected agent's OpenClientCount.active_client_count += 1; ratio_state recomputed"
      - "cascade (depth 2): selected agent's LeadCapacity.current_state recomputed -> AT_CAPACITY when active_client_count >= floor(target_client_ratio)"
      - "cascade (depth 3): selected Agent.status -> AT_CAPACITY when active_client_count >= ceil(target_client_ratio); Region.agent_count recomputed"
      - "Agent.bonus_pct and Agent.bonus_cents recomputed via salaried_bonus"
      - "increments Agent.version and Region.version by 1 each"

  # --- Transaction ----------------------------------------------------------
  - method: POST
    path: "/clients/{id}/transactions"
    description: "Open a transaction for a client; transaction coordination is centralized and the agent gains nothing from it"
    roles: [TransactionCoordinator]
    code: 201
    input: []
    output: Transaction
    side_effects:
      - "coordination_status=ASSIGNED when the client has an agent, else UNASSIGNED"
      - "lead_agent_id copied from Client.assigned_agent_id"
      - "agent_satisfaction_credit computed via transaction_satisfaction_credit"
      - "append-only ActivityAudit row for the new transaction"
      - "Client.status -> IN_TRANSACTION"

  - method: GET
    path: "/transactions/{id}"
    description: "Get a transaction with its coordination status"
    roles: [PlatformAdmin, TransactionCoordinator, OperationsCoordinator]
    code: 200
    input: []
    output: Transaction
    side_effects: []

  - method: GET
    path: "/clients/{id}/transactions"
    description: "List a client's transactions"
    roles: [PlatformAdmin, TransactionCoordinator, OperationsCoordinator]
    code: 200
    input: ["coordination_status?", "limit?", "offset?"]
    output: Transaction[]
    side_effects: []

  - method: POST
    path: "/transactions/{id}/coordination"
    description: "Advance the transaction-coordination dimension without the agent being involved"
    roles: [TransactionCoordinator]
    code: 200
    input: [coordination_status, "contract_price_cents?"]
    output: Transaction
    side_effects:
      - "coordination_status -> requested value when §1.2 allows it"
      - "append-only ActivityAudit row"
      - "Agent.close_rate recomputed; Agent.bonus_pct and Agent.bonus_cents recomputed via salaried_bonus"
      - "transaction_coordination_reconcile refreshes LeadCapacity.close_rate, graded_transactions and trailing_tours"

  - method: POST
    path: "/transactions/{id}/close"
    description: "Close a transaction in review and release the agent's client capacity"
    roles: [TransactionCoordinator]
    code: 200
    input: []
    output: Transaction
    side_effects:
      - "cascade: the client's OpenClientCount.active_client_count -= 1; ratio_state recomputed"
      - "cascade (depth 2): LeadCapacity.current_state -> OPEN when ratio_state == UNDER_TARGET"
      - "cascade (depth 3): Agent.status -> ACTIVE and Region.agent_count recomputed when the posture opened"
      - "cascade (depth 4): append-only ActivityAudit row for the count change"
      - "cascade (depth 3 alt): the client's ListingAgreement -> CLOSED and its final_listing_fee_cents recomputed"
      - "Client.status -> CLOSED; Agent.close_rate, bonus_pct and bonus_cents recomputed"
      - "transaction_coordination_reconcile refreshes LeadCapacity.close_rate, graded_transactions and trailing_tours"

  - method: POST
    path: "/clients/{id}/transactions/{id}/close"
    description: "Client-scoped close of a transaction in review; rejects a transaction that does not belong to the path client"
    roles: [TransactionCoordinator]
    code: 200
    input: []
    output: Transaction
    side_effects:
      - "same cascades as POST /transactions/{transactionId}/close"
      - "ERR_TRANSACTION_NOT_FOUND when transaction.client_id != clientId"

  - method: POST
    path: "/transactions/{id}/cancel"
    description: "Cancel a transaction that has no contract price; releases the agent's client capacity without counting against close rate"
    roles: [TransactionCoordinator]
    code: 200
    input: []
    output: Transaction
    side_effects:
      - "cascade: the client's OpenClientCount.active_client_count -= 1"
      - "cascade (depth 2): ratio_state recomputed; Client.status -> UNASSIGNED when the client has no other open transaction"
      - "Agent.close_rate unaffected (CANCELLED transactions leave the denominator)"

  - method: GET
    path: "/transactions"
    description: "List transactions across clients, optionally filtered by lead agent or coordination status"
    roles: [PlatformAdmin, TransactionCoordinator, OperationsCoordinator]
    code: 200
    input: ["lead_agent_id?", "client_id?", "coordination_status?", "limit?", "offset?"]
    output: Transaction[]
    side_effects: []

  # --- Survey ---------------------------------------------------------------
  - method: POST
    path: "/transactions/{id}/surveys"
    description: "Create a satisfaction survey for a closed transaction. Supplying a score records an immediate RESPONDED survey; omitting it dispatches the survey for later response"
    roles: [TransactionCoordinator]
    code: 201
    input: [agent_id, "score?"]
    output: Survey
    side_effects:
      - "response_status=RESPONDED and bonus_eligible=true when score supplied; DISPATCHED and bonus_eligible=false otherwise"
      - "Agent.satisfaction_score recomputed when score supplied"
      - "Agent.bonus_pct and Agent.bonus_cents recomputed via salaried_bonus"

  - method: GET
    path: "/transactions/{id}/surveys"
    description: "List the surveys attached to a transaction"
    roles: [PlatformAdmin, TransactionCoordinator, OperationsCoordinator]
    code: 200
    input: []
    output: Survey[]
    side_effects: []

  - method: POST
    path: "/surveys/{id}/respond"
    description: "Record a client's survey answer"
    roles: [TransactionCoordinator]
    code: 200
    input: [score]
    output: Survey
    side_effects:
      - "response_status -> RESPONDED; responded_at stamped"
      - "cascade: Agent.satisfaction_score recomputed"
      - "cascade (depth 2): Agent.bonus_pct and Agent.bonus_cents recomputed; bonus_eligible stays false for a manually answered dispatch"

  - method: GET
    path: "/surveys/{id}"
    description: "Get a single satisfaction survey"
    roles: [PlatformAdmin, TransactionCoordinator, OperationsCoordinator]
    code: 200
    input: []
    output: Survey
    side_effects: []

  - method: GET
    path: "/surveys"
    description: "List surveys, optionally filtered by credited agent or response status"
    roles: [PlatformAdmin, TransactionCoordinator, OperationsCoordinator]
    code: 200
    input: ["agent_id?", "transaction_id?", "response_status?", "limit?", "offset?"]
    output: Survey[]
    side_effects: []

  # --- ListingAgreement -----------------------------------------------------
  - method: POST
    path: "/listing-agreements"
    description: "Create a listing agreement at the flat listing fee rate; expected_region_version pins the fee baseline observed by the caller"
    roles: [ListingAgent]
    code: 201
    input: [client_id, list_price_cents, list_fee_rate_pct, service_tier, expected_region_version]
    output: ListingAgreement
    side_effects:
      - "gross_listing_fee_cents, savings_amount_cents, savings_pct and service_commitment_hours computed"
      - "status=DRAFT; final_listing_fee_cents = gross_listing_fee_cents"
      - "increments Region.version by 1"

  - method: GET
    path: "/listing-agreements/{id}"
    description: "Get a listing agreement with its fee breakdown"
    roles: [PlatformAdmin, ListingAgent, OperationsCoordinator]
    code: 200
    input: []
    output: ListingAgreement
    side_effects: []

  - method: GET
    path: "/listing-agreements"
    description: "List listing agreements, optionally filtered by region or client"
    roles: [PlatformAdmin, ListingAgent, OperationsCoordinator]
    code: 200
    input: ["region_id?", "client_id?", "status?", "limit?", "offset?"]
    output: ListingAgreement[]
    side_effects: []

  - method: POST
    path: "/listing-agreements/{id}/publish"
    description: "Take a listing live"
    roles: [ListingAgent]
    code: 200
    input: []
    output: ListingAgreement
    side_effects:
      - "status -> ACTIVE; posted_at stamped"
      - "Region.occupancy_pct recomputed; increments Region.version by 1"

  - method: POST
    path: "/listing-agreements/{id}/accept-offer"
    description: "Record an accepted offer price on an active listing"
    roles: [ListingAgent]
    code: 200
    input: [contract_price_cents]
    output: ListingAgreement
    side_effects:
      - "status -> UNDER_CONTRACT"
      - "cascade: any AgentReferral for the same client recomputed via referrer_split; settlement_status PENDING -> COMPUTED"
      - "cascade (depth 2): final_listing_fee_cents recomputed from the new partner_referral_fee_cents"

  - method: POST
    path: "/listing-agreements/{id}/revert-to-active"
    description: "Return a listing to market after a failed contract"
    roles: [ListingAgent]
    code: 200
    input: []
    output: ListingAgreement
    side_effects:
      - "status -> ACTIVE"
      - "cascade: any AgentReferral for the same client -> settlement_status PENDING"
      - "cascade (depth 2): final_listing_fee_cents recomputed to gross_listing_fee_cents"

  - method: POST
    path: "/listing-agreements/{id}/withdraw"
    description: "Withdraw a listing from the market"
    roles: [ListingAgent]
    code: 200
    input: []
    output: ListingAgreement
    side_effects:
      - "status -> WITHDRAWN"
      - "cascade: any AgentReferral for the same client -> settlement_status PENDING"

  # --- Tour -----------------------------------------------------------------
  - method: POST
    path: "/tours"
    description: "Schedule a showing with access instructions; the lead agent is derived from the client's assignment"
    roles: [OperationsCoordinator]
    code: 201
    input: [client_id, "associate_agent_id?", scheduled_at, access_instructions]
    output: Tour
    side_effects:
      - "status=ACCESS_PENDING; access_code issued but omitted from the response until the access window opens"
      - "cascade: LeadCapacity.tours_in_week and associate_capacity_used recomputed"
      - "cascade (depth 2): when associate_capacity_used exceeds ASSOCIATE_CAPACITY_LIMIT the tour is force-routed and associate_agent_id cleared"

  - method: GET
    path: "/tours"
    description: "List tours, optionally filtered by lead agent, client or status"
    roles: [PlatformAdmin, OperationsCoordinator, AssociateAgent]
    code: 200
    input: ["lead_agent_id?", "client_id?", "status?", "listing_agreement_id?", "associate_agent_id?", "limit?", "offset?"]
    output: Tour[]
    side_effects: []

  - method: GET
    path: "/tours/{id}"
    description: "Get a tour; access_code is surfaced only inside the release window"
    roles: [PlatformAdmin, OperationsCoordinator, AssociateAgent]
    code: 200
    input: []
    output: Tour
    side_effects: []

  - method: POST
    path: "/tours/{id}/confirm"
    description: "Confirm a scheduled tour and release the access code"
    roles: [AssociateAgent]
    code: 200
    input: []
    output: Tour
    side_effects:
      - "status -> CONFIRMED; access_code surfaced"
      - "cascade: LeadCapacity.associate_capacity_used += 1 when associate_agent_id is not null"

  - method: POST
    path: "/tours/{id}/complete"
    description: "Complete a tour and capture the companion's feedback"
    roles: [AssociateAgent]
    code: 200
    input: [feedback_rating, "feedback_notes?"]
    output: Tour
    side_effects:
      - "status -> COMPLETED; feedback captured"
      - "cascade: a Survey is created RESPONDED with bonus_eligible=true for the client's transaction"
      - "cascade (depth 2): Agent.satisfaction_score recomputed, then bonus_pct and bonus_cents recomputed"
      - "cascade (depth 3): LeadCapacity.current_state recomputed when the bonus band moved"

  - method: POST
    path: "/tours/{id}/no-show"
    description: "Mark a confirmed tour as a no-show"
    roles: [AssociateAgent]
    code: 200
    input: []
    output: Tour
    side_effects:
      - "status -> CANCELLED_NO_SHOW"
      - "cascade: LeadCapacity.tours_in_week recomputed; associate_capacity_used -= 1 when an associate was staffed"

  - method: POST
    path: "/tours/{id}/cancel"
    description: "Cancel a tour before it happens"
    roles: [OperationsCoordinator]
    code: 200
    input: []
    output: Tour
    side_effects:
      - "status -> CANCELLED"
      - "cascade: LeadCapacity.associate_capacity_used -= 1 when an associate was staffed"

  # --- AgentReferral --------------------------------------------------------
  - method: POST
    path: "/referrals"
    description: "Refer an overflow client to a partner brokerage; expected_region_version pins the partner pool the caller observed"
    roles: [OperationsCoordinator]
    code: 201
    input: [client_id, partner_name, referral_fee_bps, split_policy, expected_region_version]
    output: AgentReferral
    side_effects:
      - "settlement_status=PENDING; referral_fee_cents computed provisionally"
      - "Client.status -> REFERRED, assignment_mode -> REFERRED_PARTNER, assigned_agent_id stays null"
      - "Region.referral_count += 1; Region.occupancy_pct recomputed; increments Region.version by 1"

  - method: GET
    path: "/referrals/{id}"
    description: "Get a referral with its fee and settlement fields"
    roles: [PlatformAdmin, OperationsCoordinator, TransactionCoordinator]
    code: 200
    input: []
    output: AgentReferral
    side_effects: []

  - method: GET
    path: "/referrals"
    description: "List referrals, optionally filtered by region, client or settlement status"
    roles: [PlatformAdmin, OperationsCoordinator, TransactionCoordinator]
    code: 200
    input: ["region_id?", "client_id?", "settlement_status?", "limit?", "offset?"]
    output: AgentReferral[]
    side_effects: []

  - method: POST
    path: "/referrals/{id}/reconcile"
    description: "Compute or re-derive the referral fee from a contract price; a re-derivation on an already-COMPUTED referral supersedes in place"
    roles: [TransactionCoordinator]
    code: 200
    input: [contract_price_cents]
    output: AgentReferral
    side_effects:
      - "settlement_status PENDING -> COMPUTED, or stays COMPUTED on a supersession re-derivation"
      - "referral_fee_cents recomputed via referrer_split"
      - "cascade: the same client's ListingAgreement.final_listing_fee_cents recomputed"

  - method: POST
    path: "/referrals/{id}/settle"
    description: "Post the computed referral fee to settlement"
    roles: [TransactionCoordinator]
    code: 200
    input: [settlement_reference]
    output: AgentReferral
    side_effects:
      - "settlement_status -> SETTLED"
      - "referral_fee_cents frozen; ListingAgreement.final_listing_fee_cents recomputed"

  # --- Referral client paths -------------------------------------------------
  - method: POST
    path: "/referrals/{id}/manual-referral"
    description: "Route a client to a partner brokerage by hand. When the client already carries a partner referral this is a pass-through: the enclosing setter returns the existing verdict and writes nothing"
    roles: [OperationsCoordinator]
    code: 200
    input: [partner_name, referral_fee_bps, split_policy]
    output: Client
    side_effects:
      - "no new AgentReferral is written when the client already carries one; Client.assignment_reason is unchanged"
      - "when Region.enrolment_is_required and Region.open_referral_count >= Region.capacity: ERR_REGION_CAPACITY_EXCEEDED"
      - "otherwise Client.status -> REFERRED, assignment_mode -> REFERRED_PARTNER"
      - "increments Region.version by 1"

  - method: POST
    path: "/referrals/{id}/accept"
    description: "Accept a partner brokerage's referral offer, enforcing the region's open-referral capacity against its partner pool"
    roles: [TransactionCoordinator]
    code: 200
    input: [accepted_partner, expected_region_version]
    output: AgentReferral
    side_effects:
      - "Region.open_referral_count re-derived via region_open_referral_count"
      - "when Region.open_referral_count would exceed Region.capacity the call is refused with ERR_REGION_CAPACITY_EXCEEDED"
      - "when Region.enrolment_is_required and the partner acknowledgement is absent: ERR_ENROLMENT_NOT_CONFIRMED"
      - "increments Region.version by 1"

  # --- Listing registration window -------------------------------------------
  - method: POST
    path: "/listing-agreements/{id}/register"
    description: "Register a listing for the service-level window, confirming the seller's benefit enrolment where the region requires it"
    roles: [ListingAgent]
    code: 200
    input: [enrolment_acknowledged, window_days]
    output: ListingAgreement
    side_effects:
      - "when Region.enrolment_is_required and enrolment_acknowledged is false: ERR_ENROLMENT_NOT_CONFIRMED and the window is not written"
      - "the registration window is written only when each adjacent window leaves no unregistered gap"
      - "increments Region.version by 1"

  # --- ActivityAudit --------------------------------------------------------
  - method: GET
    path: "/activity-audits"
    description: "Read the centralised audit stream of transaction-coordination and cascade activity"
    roles: [PlatformAdmin, TransactionCoordinator, OperationsCoordinator]
    code: 200
    input: ["region_id?", "entity_type?", "limit?", "offset?"]
    output: ActivityAudit[]
    side_effects: []

  - method: GET
    path: "/regions/{id}/activity-audits"
    description: "Read the audit stream of a single region"
    roles: [PlatformAdmin, TransactionCoordinator, OperationsCoordinator]
    code: 200
    input: []
    output: ActivityAudit[]
    side_effects: []

  # --- Logical clock (test-driving) -----------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before this is ever called the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time"
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "The caller's role does not permit the operation, or the caller does not own the referenced resource"

  - id: ERR_REGION_NOT_FOUND
    http: 404
    condition: "No region matches the regionId path segment or region_id body field"

  - id: ERR_AGENT_NOT_FOUND
    http: 404
    condition: "No agent matches the agentId path segment or agent_id/associate_agent_id body field"

  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "No client matches the clientId path segment or client_id body field"

  - id: ERR_TRANSACTION_NOT_FOUND
    http: 404
    condition: "No transaction matches the transactionId segment, or the transaction does not belong to the client in the path"

  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "No listing agreement matches the agreementId segment"

  - id: ERR_TOUR_NOT_FOUND
    http: 404
    condition: "No tour matches the tourId segment"

  - id: ERR_SURVEY_NOT_FOUND
    http: 404
    condition: "No survey matches the surveyId segment"

  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "No referral matches the referralId segment"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input is absent, an enum value is outside its declared set, or a score/rating is outside 1..5"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a state from which §1.2 declares the requested operation"

  - id: ERR_GEOGRAPHY_MISMATCH
    http: 409
    condition: "The agent's home_zip is not a member of the region's service_area_codes"

  - id: ERR_CLIENT_EMAIL_DUPLICATE
    http: 409
    condition: "A client with the same email already exists"

  - id: ERR_LISTING_CLIENT_MISMATCH
    http: 409
    condition: "The listing agreement's client has need_kind BUY rather than SELL"

  - id: ERR_NO_ELIGIBLE_AGENT
    http: 409
    condition: "The assignment selector found no in-geography agent with an OPEN capacity posture; the client stays UNASSIGNED with an explanatory reason code"

  - id: ERR_REGION_CAPACITY_EXCEEDED
    http: 409
    condition: "The region's partner pool is full: Region.open_referral_count is already at or above Region.capacity, so a further referral cannot be placed"

  - id: ERR_TRANSACTION_ALREADY_OPEN
    http: 409
    condition: "The client already has a transaction whose coordination_status is UNASSIGNED, ASSIGNED or REVIEW"

  - id: ERR_ASSOCIATE_AGENT_REQUIRED
    http: 409
    condition: "The lead agent's UniServicedTourCount has reached the block threshold and no associate agent was staffed on the tour"

  - id: ERR_TOUR_SCHEDULE_CONFLICT
    http: 409
    condition: "The lead agent already has a tour whose block window overlaps the requested window"

  - id: ERR_ACCESS_WINDOW_NOT_OPEN
    http: 409
    condition: "The tour was confirmed before its access-code release instant"

  - id: ERR_LIST_PRICE_OUT_OF_BAND
    http: 409
    condition: "list_price_cents is below the minimum or above the maximum supported by the region's listing programme"

  - id: ERR_LIST_FEE_RATE_EXCEEDED
    http: 409
    condition: "list_fee_rate_pct exceeds the flat listing fee ceiling, which is below the traditional brokerage rate"

  - id: ERR_REFERRAL_FEE_EXCEEDED
    http: 409
    condition: "referral_fee_bps exceeds the partner referral fee ceiling"

  - id: ERR_CONTRACT_PRICE_MISSING
    http: 409
    condition: "A referral fee computation was requested before any contract price exists for the referred client"

  - id: ERR_ENROLMENT_NOT_CONFIRMED
    http: 409
    condition: "The region requires benefit enrolment and the request did not acknowledge it"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_region_version or expected_agent_version does not match the resource's current version"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Regional operations administrator who seeds regions and agents and runs the periodic checkpoint"
    identity: opaque
    exclusive_operations:
      - "POST /regions"
      - "POST /agents"
      - "POST /agents/{agentId}/status"
      - "POST /regions/{regionId}/run-ops"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /regions/{regionId}"
      - "GET /regions/{regionId}/agents"
      - "GET /agents"
      - "GET /agents/{agentId}"
      - "GET /agents/{agentId}/open-client-counts"
      - "GET /agents/{agentId}/lead-capacity"
      - "GET /clients"
      - "GET /clients/{clientId}"
      - "GET /transactions"
      - "GET /transactions/{transactionId}"
      - "GET /clients/{clientId}/transactions"
      - "GET /transactions/{transactionId}/surveys"
      - "GET /surveys"
      - "GET /surveys/{surveyId}"
      - "GET /listing-agreements"
      - "GET /listing-agreements/{agreementId}"
      - "GET /tours"
      - "GET /tours/{tourId}"
      - "GET /referrals"
      - "GET /referrals/{referralId}"
      - "GET /activity-audits"
      - "GET /regions/{id}/activity-audits"
      - "GET /regions/{id}/referrals"

  - name: OperationsCoordinator
    description: "Front-office operator who registers clients, runs the assignment selector, refers overflow demand and schedules tours"
    identity: opaque
    exclusive_operations:
      - "POST /clients"
      - "POST /clients/{clientId}/assign-agent"
      - "POST /referrals"
      - "POST /tours"
      - "POST /tours/{tourId}/cancel"
      - "POST /referrals/{id}/manual-referral"
    shared_operations:
      - "GET /regions/{regionId}"
      - "GET /regions/{regionId}/agents"
      - "GET /agents"
      - "GET /agents/{agentId}"
      - "GET /agents/{agentId}/open-client-counts"
      - "GET /agents/{agentId}/lead-capacity"
      - "GET /clients"
      - "GET /clients/{clientId}"
      - "GET /transactions"
      - "GET /transactions/{transactionId}"
      - "GET /clients/{clientId}/transactions"
      - "GET /transactions/{transactionId}/surveys"
      - "GET /surveys"
      - "GET /surveys/{surveyId}"
      - "GET /listing-agreements"
      - "GET /listing-agreements/{agreementId}"
      - "GET /tours"
      - "GET /tours/{tourId}"
      - "GET /referrals"
      - "GET /referrals/{referralId}"
      - "GET /activity-audits"
      - "GET /regions/{id}/activity-audits"
      - "GET /regions/{id}/referrals"

  - name: TransactionCoordinator
    description: "Centralised transaction-coordination desk that owns the transaction lifecycle, surveys and referral settlement, deliberately kept away from the agent"
    identity: opaque
    exclusive_operations:
      - "POST /clients/{clientId}/transactions"
      - "POST /transactions/{transactionId}/coordination"
      - "POST /transactions/{transactionId}/close"
      - "POST /clients/{clientId}/transactions/{transactionId}/close"
      - "POST /transactions/{transactionId}/cancel"
      - "POST /transactions/{transactionId}/surveys"
      - "POST /surveys/{surveyId}/respond"
      - "POST /referrals/{referralId}/reconcile"
      - "POST /referrals/{id}/accept"
    shared_operations:
      - "GET /regions/{regionId}"
      - "GET /regions/{regionId}/agents"
      - "GET /agents"
      - "GET /agents/{agentId}"
      - "GET /agents/{agentId}/open-client-counts"
      - "GET /agents/{agentId}/lead-capacity"
      - "GET /clients"
      - "GET /clients/{clientId}"
      - "GET /transactions"
      - "GET /transactions/{transactionId}"
      - "GET /clients/{clientId}/transactions"
      - "GET /transactions/{transactionId}/surveys"
      - "GET /surveys"
      - "GET /surveys/{surveyId}"
      - "GET /referrals"
      - "GET /referrals/{referralId}"
      - "GET /activity-audits"
      - "GET /regions/{id}/activity-audits"
      - "GET /regions/{id}/referrals"

  - name: ListingAgent
    description: "Salaried lead agent who owns their clients' listings; may only act on clients whose assigned_agent_id is their own id"
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST /listing-agreements"
      - "POST /listing-agreements/{agreementId}/publish"
      - "POST /listing-agreements/{agreementId}/accept-offer"
      - "POST /listing-agreements/{agreementId}/revert-to-active"
      - "POST /listing-agreements/{agreementId}/withdraw"
      - "POST /listing-agreements/{id}/register"
    shared_operations:
      - "GET /clients/{clientId}"
      - "GET /clients"
      - "GET /listing-agreements"
      - "GET /listing-agreements/{agreementId}"

  - name: AssociateAgent
    description: "Salaried associate who staffs tours so lead agents keep client capacity"
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST /tours/{tourId}/confirm"
      - "POST /tours/{tourId}/complete"
      - "POST /tours/{tourId}/no-show"
    shared_operations:
      - "GET /agents/{agentId}"
      - "GET /agents"
      - "GET /agents/{agentId}/open-client-counts"
      - "GET /agents/{agentId}/lead-capacity"
      - "GET /tours"
      - "GET /tours/{tourId}"