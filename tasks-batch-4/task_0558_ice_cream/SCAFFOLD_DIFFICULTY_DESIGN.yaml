  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: par_threshold_at_par_vs_below
        grounds:
          - calculations.flavor_stock_status
          - entities.Flavor.fields.stock_status
          - entities.Flavor.fields.total_available_ml
        distinguishing_aspect: |
          Metric = flavor volume via the waste endpoint. total_available_ml==500
          (exactly par) is IN_STOCK (>=); a single 1 ml MELT drops it to 499
          (< par) flipping stock_status to BELOW_PAR.
        test_recipe:
          setup:
            - "Vanilla flavor par 500; Batch initial 500, remaining 500, AVAILABLE => total_available_ml 500 => IN_STOCK"
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 500 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 500, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
          trigger:
            - call: "POST /waste-events"
              payload: { batch_id: "${b}", waste_type: "MELT", volume_ml: 1 }
              as: Baker
          assert:
            - "Flavor.${van}.total_available_ml == 499"
            - "Flavor.${van}.stock_status == BELOW_PAR"

      - name: loyalty_punch_threshold_exact_reset
        grounds:
          - calculations.loyalty_punch_accrual
          - entities.LoyaltyAccount.fields.punches
          - entities.LoyaltyAccount.fields.free_scoop_credits
        distinguishing_aspect: |
          Metric = punch count via the pay endpoint (distinct metric/endpoint
          from the par boundary). A member at 9 punches earning 1 more scoop hits
          running==10 (== PUNCH_THRESHOLD): free_scoop_credits becomes 1 and
          punches reset to 0.
        test_recipe:
          setup:
            - "Vanilla par 300; DOUBLE (2) + SINGLE (1) sizes; batch 2000 ml AVAILABLE"
            - "LoyaltyAccount; OPEN drawer"
            - "Order 1 (loyalty attached): DOUBLE x4 (8 scoops) + SINGLE x1 (1 scoop) = 9 scoops, PAID => account.punches 9, credits 0"
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /size-options"
              payload: { code: "DOUBLE", scoop_count: 2, base_price_cents: 550 }
              as: Manager
              captures: { dbl: $.data.id }
            - call: "POST /size-options"
              payload: { code: "SINGLE", scoop_count: 1, base_price_cents: 350 }
              as: Manager
              captures: { sng: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 2000, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /loyalty-accounts"
              payload: { phone: "555-0111" }
              as: Scooper
              captures: { acc: $.data.id }
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}", loyalty_account_id: "${acc}" }
              as: Scooper
              captures: { ord1: $.data.id }
            - call: "POST /orders/${ord1}/lines"
              payload: { size_option_id: "${dbl}", flavor_id: "${van}", quantity: 4 }
              as: Scooper
            - call: "POST /orders/${ord1}/lines"
              payload: { size_option_id: "${sng}", flavor_id: "${van}", quantity: 1 }
              as: Scooper
            - call: "POST /orders/${ord1}/pay"
              payload: { payment_method: "CARD" }
              as: Scooper
            - call: "POST /orders"
              payload: { drawer_id: "${dr}", loyalty_account_id: "${acc}" }
              as: Scooper
              captures: { ord2: $.data.id }
            - call: "POST /orders/${ord2}/lines"
              payload: { size_option_id: "${sng}", flavor_id: "${van}", quantity: 1 }
              as: Scooper
          trigger:
            - call: "POST /orders/${ord2}/pay"
              payload: { payment_method: "CARD" }
              as: Scooper
          assert:
            - "LoyaltyAccount.${acc}.punches == 0"
            - "LoyaltyAccount.${acc}.free_scoop_credits == 1"
            - "LoyaltyAccount.${acc}.lifetime_scoops == 10"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: pay_requires_drawer_open
        grounds:
          - state_machines.Order.OPEN_to_PAID
          - state_machines.CashDrawerSession.OPEN_to_CLOSED
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair Order->CashDrawerSession: an OPEN order with a valid line
          cannot be paid once its drawer is CLOSED — pay returns ERR_DRAWER_NOT_OPEN
          driven by the sibling drawer's state, not the order's own.
        test_recipe:
          setup:
            - "Vanilla par 500; SINGLE size; vanilla batch AVAILABLE"
            - "OPEN drawer; OPEN order with one SINGLE line; then drawer CLOSED (counted 10000, balanced)"
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 500 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /size-options"
              payload: { code: "SINGLE", scoop_count: 1, base_price_cents: 350 }
              as: Manager
              captures: { sng: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 500, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}" }
              as: Scooper
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "${sng}", flavor_id: "${van}" }
              as: Scooper
            - call: "POST /cash-drawer-sessions/${dr}/close"
              payload: { counted_cash_cents: 10000 }
              as: ShiftLead
          trigger:
            - call: "POST /orders/${ord}/pay"
              payload: { payment_method: "CARD" }
              as: Scooper
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DRAWER_NOT_OPEN"

      - name: startproduction_requires_flavor_available
        grounds:
          - state_machines.PreOrder.CONFIRMED_to_IN_PRODUCTION
          - validations[priority=8]
          - entities.Flavor.fields.is_active
        distinguishing_aspect: |
          Entity pair PreOrder->Flavor (different from Order->CashDrawerSession):
          a CONFIRMED pre-order cannot start production once its base flavor is
          set inactive — start-production returns ERR_FLAVOR_UNAVAILABLE.
        test_recipe:
          setup:
            - "Vanilla flavor active; DecoratingStation; PreOrder QUOTED -> CONFIRMED"
            - "Then PATCH the flavor is_active=false"
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /decorating-stations"
              payload: { name: "Station 1" }
              as: Manager
              captures: { st: $.data.id }
            - call: "POST /pre-orders"
              payload: { flavor_id: "${van}", decorating_station_id: "${st}", customer_name: "Finn", decorate_start_utc: "2026-05-03T10:00:00Z", decorate_end_utc: "2026-05-03T12:00:00Z", pickup_utc: "2026-05-04T09:00:00Z", quoted_price_cents: 4000 }
              as: Scooper
              captures: { po: $.data.id }
            - call: "POST /pre-orders/${po}/confirm"
              payload: {}
              as: Scooper
            - call: "PATCH /flavors/${van}"
              payload: { is_active: false }
              as: Manager
          trigger:
            - call: "POST /pre-orders/${po}/start-production"
              payload: {}
              as: Baker
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FLAVOR_UNAVAILABLE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: event_cart_overlap_halfopen
        grounds:
          - validations[priority=9]
          - entities.CateringBooking.fields.event_start_utc
          - entities.CateringBooking.fields.event_end_utc
          - entities.EventCart.fields.id
        distinguishing_aspect: |
          Resource EventCart, half-open interval semantics (touching allowed):
          booking B [11:00,13:00) overlaps existing booking A [10:00,12:00) on the
          same cart => ERR_CART_OVERLAP.
        test_recipe:
          setup:
            - "Vanilla flavor + 1000 ml batch AVAILABLE; EventCart capacity 5000"
            - "Booking A on the cart for [2026-05-02T10:00Z, 2026-05-02T12:00Z), 100 ml vanilla reserved"
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 1000, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-30T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /event-carts"
              payload: { name: "Cart 1", capacity_ml: 5000 }
              as: Manager
              captures: { ec: $.data.id }
            - call: "POST /catering-bookings"
              payload: { event_cart_id: "${ec}", event_start_utc: "2026-05-02T10:00:00Z", event_end_utc: "2026-05-02T12:00:00Z", requested_items: [{ flavor_id: "${van}", volume_ml: 100 }] }
              as: Manager
              captures: { bkA: $.data.id }
          trigger:
            - call: "POST /catering-bookings"
              payload: { event_cart_id: "${ec}", event_start_utc: "2026-05-02T11:00:00Z", event_end_utc: "2026-05-02T13:00:00Z", requested_items: [{ flavor_id: "${van}", volume_ml: 100 }] }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CART_OVERLAP"

      - name: station_overlap_buffered_touching_rejected
        grounds:
          - validations[priority=9]
          - entities.PreOrder.fields.decorate_start_utc
          - entities.PreOrder.fields.decorate_end_utc
          - entities.DecoratingStation.fields.id
        distinguishing_aspect: |
          Resource DecoratingStation, buffered interval semantics (touching NOT
          allowed within STATION_CLEAN_BUFFER_MIN=30): pre-order B decorating
          [12:00,12:30) directly abuts A [10:00,12:00) with a 0-minute gap < 30 =>
          ERR_STATION_OVERLAP, unlike the cart rule where touching is legal.
        test_recipe:
          setup:
            - "Vanilla flavor; DecoratingStation"
            - "Pre-order A decorating window [2026-05-02T10:00Z, 2026-05-02T12:00Z) on the station"
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 300 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /decorating-stations"
              payload: { name: "Station 1" }
              as: Manager
              captures: { st: $.data.id }
            - call: "POST /pre-orders"
              payload: { flavor_id: "${van}", decorating_station_id: "${st}", customer_name: "Poe", decorate_start_utc: "2026-05-02T10:00:00Z", decorate_end_utc: "2026-05-02T12:00:00Z", pickup_utc: "2026-05-03T09:00:00Z", quoted_price_cents: 4000 }
              as: Scooper
              captures: { poA: $.data.id }
          trigger:
            - call: "POST /pre-orders"
              payload: { flavor_id: "${van}", decorating_station_id: "${st}", customer_name: "BB", decorate_start_utc: "2026-05-02T12:00:00Z", decorate_end_utc: "2026-05-02T12:30:00Z", pickup_utc: "2026-05-03T10:00:00Z", quoted_price_cents: 4000 }
              as: Scooper
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STATION_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: batch_volume_conserved_across_pay_refund
        grounds:
          - state_machines.Order.OPEN_to_PAID
          - state_machines.Order.PAID_to_REFUNDED
          - entities.Batch.fields.initial_volume_ml
          - entities.Batch.fields.remaining_volume_ml
          - entities.Batch.fields.committed_volume_ml
        distinguishing_aspect: |
          Conserved quantity = batch volume. The invariant
          initial_volume_ml == remaining_volume_ml + committed_volume_ml + wasted_volume_ml
          holds before pay (180==180+0+0) and after the pay->refund pair returns
          the batch to remaining 180, committed 0 (180==180+0+0), zero drift.
        test_recipe:
          setup:
            - "Vanilla par 500; DOUBLE size; Batch initial 180, AVAILABLE"
            - "OPEN drawer; order with one DOUBLE line; PAID (committed 180, remaining 0)"
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 500 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /size-options"
              payload: { code: "DOUBLE", scoop_count: 2, base_price_cents: 550 }
              as: Manager
              captures: { dbl: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 180, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}" }
              as: Scooper
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "${dbl}", flavor_id: "${van}" }
              as: Scooper
            - call: "POST /orders/${ord}/pay"
              payload: { payment_method: "CARD" }
              as: Scooper
          trigger:
            - call: "POST /orders/${ord}/refund"
              payload: {}
              as: ShiftLead
          assert:
            - "Batch.${b}.remaining_volume_ml == 180"
            - "Batch.${b}.committed_volume_ml == 0"
            - "Batch.${b}.wasted_volume_ml == 0"
            - "Batch.${b}.initial_volume_ml == 180"

      - name: drawer_cash_conserved_across_pay_refund
        grounds:
          - state_machines.Order.OPEN_to_PAID
          - state_machines.Order.PAID_to_REFUNDED
          - calculations.drawer_reconciliation
          - entities.CashDrawerSession.fields.expected_cash_cents
          - entities.Order.fields.cash_refunded_cents
        distinguishing_aspect: |
          Conserved quantity = drawer cash (a different quantity than batch
          volume). expected_cash = opening + sum(cash_collected) - sum(cash_refunded);
          a CASH order (total 381) pushes expected to 10381, and the refund
          returns it exactly to the 10000 opening float, net_sales back to 0.
        test_recipe:
          setup:
            - "Vanilla par 500; SINGLE size (350); vanilla batch AVAILABLE"
            - "OPEN drawer float 10000; order with one SINGLE line; PAID CASH tendered 400 (total 381) => expected 10381"
          setup_api_calls:
            - call: "POST /flavors"
              payload: { name: "Vanilla", standard_cost_cents_per_ml: 1.80, par_level_ml: 500 }
              as: Manager
              captures: { van: $.data.id }
            - call: "POST /size-options"
              payload: { code: "SINGLE", scoop_count: 1, base_price_cents: 350 }
              as: Manager
              captures: { sng: $.data.id }
            - call: "POST /batches"
              payload: { flavor_id: "${van}", initial_volume_ml: 500, unit_cost_cents_per_ml: 1.80, produced_at: "2026-05-01T00:00:00Z", expiry_at: "2026-05-20T00:00:00Z" }
              as: Baker
              captures: { b: $.data.id }
            - call: "POST /batches/${b}/release"
              payload: {}
              as: Baker
            - call: "POST /cash-drawer-sessions"
              payload: { opening_float_cents: 10000 }
              as: ShiftLead
              captures: { dr: $.data.id }
            - call: "POST /orders"
              payload: { drawer_id: "${dr}" }
              as: Scooper
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/lines"
              payload: { size_option_id: "${sng}", flavor_id: "${van}" }
              as: Scooper
            - call: "POST /orders/${ord}/pay"
              payload: { payment_method: "CASH", tendered_cash_cents: 400 }
              as: Scooper
          trigger:
            - call: "POST /orders/${ord}/refund"
              payload: {}
              as: ShiftLead
          assert:
            - "Order.${ord}.cash_refunded_cents == 381"
            - "CashDrawerSession.${dr}.expected_cash_cents == 10000"
            - "CashDrawerSession.${dr}.net_sales_cents == 0"
            - "CashDrawerSession.${dr}.gross_sales_cents == 381"
