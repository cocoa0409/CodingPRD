  - rule_id: cross_entity_state_dependency
    instances:
      - name: subcontract_creation_requires_the_named_bid_to_be_the_awarded_one
        grounds:
          - validations.priority_65_ERR_BID_STATE_INVALID
          - state_machines.SelfPerformBid.OPENED_to_NOT_AWARDED
          - state_machines.SelfPerformBid.OPENED_to_AWARDED
          - concurrency_rules.subcontract-create-stale-work-package
          - entities.Subcontract.fields.awarded_bid_id
        distinguishing_aspect: |
          Whether POST /subcontracts succeeds is decided entirely by the status of a DIFFERENT
          entity - the SelfPerformBid named in awarded_bid_id - with every field of the
          Subcontract payload itself valid and identical between the two attempts. The losing
          bid on the very same package is a well-formed, existing, correctly-parented row, so
          the check cannot be reduced to existence or ownership; and because the rejected
          attempt performs no write, the same expected_work_package_version still satisfies the
          optimistic-concurrency rule on the retry.
