# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1351: HRIS Data Governance & Organizational Change Management
# 9 rules x 2 instances = 18 instances. Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: corrected_salary_as_is_vs_as_was
        grounds:
          - calculations.field_value_as_of
          - state_machines.ChangeRequest.APPROVED_to_APPLIED
          - entities.AuditEntry.fields.action
          - entities.ChangeRequest.fields.correction_mode
        distinguishing_aspect: |
          Same (worker, field, as_of_date) inputs return different values under
          the two variants: AS_IS reads the corrected row (9500), AS_WAS replays
          the CORRECT audit log to the first-recorded value (10000). This
          instance operates on the Worker/assignment domain.
        test_recipe:
          setup:
            - "Worker W with one ACTIVE assignment row R1 [2026-01-05, null) salary 10000"
            - "DataField assignment.salary_cents CONFIDENTIAL/CORRECTABLE, ACTIVE, channels [PAYROLL]"
            - "appr-1 holds PROVISIONED CHANGE_APPROVER grant"
            - "CORRECT_HISTORY change applied: R1 salary overwritten 10000 -> 9500 (audit entry written)"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "W One", worker_number: "W1", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
              captures: { w_id: $.data.id, w_v: $.data.version }
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.salary_cents", display_name: "Salary", sensitivity: "CONFIDENTIAL", history_policy: "CORRECTABLE", downstream_channels: ["PAYROLL"], owner_team: "comp" }
              as: DataSteward
              captures: { df_id: $.data.id }
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
            - call: "GET /hris/position-assignments"
              payload: { worker_id: "${w_id}" }
              as: HrisAnalyst
              captures: { row1_id: "$.data[0].id" }
            - call: "POST /hris/security-role-assignments"
              payload: { user_id: "appr-1", role_code: "CHANGE_APPROVER", valid_from: "2026-08-01", valid_until: "2027-08-01" }
              as: SecurityAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /hris/security-role-assignments/${g1_id}/approve"
              payload: {}
              as: SecurityAdmin
              as_user_id: "secadmin-1"
            - call: "POST /hris/workers/${w_id}/change-requests"
              payload: { target_type: "WORKER_FIELD", target_field_id: "${df_id}", new_value: "9500", correction_mode: "CORRECT_HISTORY", target_row_id: "${row1_id}", expected_worker_version: "${w_v}" }
              as: HrisAnalyst
              as_user_id: "analyst-1"
              captures: { cr_id: $.data.id }
            - call: "POST /hris/change-requests/${cr_id}/approve"
              payload: {}
              as: ChangeApprover
              as_user_id: "appr-1"
            - call: "POST /hris/change-requests/${cr_id}/apply"
              payload: {}
              as: HrisAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "GET /hris/workers/${w_id}/field-history"
              payload: { field_id: "${df_id}", as_of_date: "2026-06-01", mode: "AS_IS" }
              as: DataSteward
              captures: { asis_val: $.data.value }
            - call: "GET /hris/workers/${w_id}/field-history"
              payload: { field_id: "${df_id}", as_of_date: "2026-06-01", mode: "AS_WAS" }
              as: DataSteward
              captures: { aswas_val: $.data.value }
          assert:
            - "AS_IS value == \"9500\""
            - "AS_WAS value == \"10000\""
            - "${asis_val} != ${aswas_val}"

      - name: subtree_headcount_filled_vs_budgeted
        grounds:
          - calculations.subtree_headcount
          - entities.Position.fields.headcount_budget
        distinguishing_aspect: |
          Same subtree, same instant: FILLED_ONLY counts one actually-assigned
          worker (1) while BUDGETED_CAPACITY sums position budgets (10+4=14).
          This instance operates on the Position hierarchy domain — a different
          entity domain than corrected_salary_as_is_vs_as_was (Worker).
        test_recipe:
          setup:
            - "Root position budget 10; child position budget 4; one worker with ACTIVE row into the child"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Root", department: "HQ", headcount_budget: 10 }
              as: HrisAnalyst
              captures: { p_root: $.data.id }
            - call: "POST /hris/positions"
              payload: { title: "Child", department: "ENG", parent_position_id: "${p_root}", headcount_budget: 4 }
              as: HrisAnalyst
              captures: { p_child: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "W Two", worker_number: "W2", hire_date: "2026-01-05", initial_position_id: "${p_child}", initial_salary_cents: 10000 }
              as: HrisAnalyst
              captures: { w_id: $.data.id }
          trigger:
            - call: "GET /hris/positions/${p_root}/subtree-metrics"
              payload: { mode: "FILLED_ONLY" }
              as: HrisAnalyst
              captures: { filled: $.data.headcount }
            - call: "GET /hris/positions/${p_root}/subtree-metrics"
              payload: { mode: "BUDGETED_CAPACITY" }
              as: HrisAnalyst
              captures: { budgeted: $.data.headcount }
          assert:
            - "FILLED_ONLY headcount == 1"
            - "BUDGETED_CAPACITY headcount == 14"
            - "${filled} != ${budgeted}"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: exception_priority_score_tiered_inputs
        grounds:
          - calculations.exception_priority_score
          - entities.ExceptionRecord.fields.priority_score
        distinguishing_aspect: |
          Mode (a): three inputs interact non-linearly — severity base (100)
          multiplied by sensitivity (CONFIDENTIAL x2) plus a tiered age bonus
          with an inclusive lower bound: age_days == 7 lands exactly on the
          [7,30) tier (+50), so score = min(1000, 100*2+50) = 250.
        test_recipe:
          setup:
            - "Worker salary 10000; salary field CONFIDENTIAL with ACTIVE WARNING RANGE rule [5000, 20000]"
            - "NEW_RECORD change to 99999 applied at default clock 2026-08-01: WARNING opens an ExceptionRecord (created_at date 2026-08-01)"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "W Three", worker_number: "W3", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
              captures: { w_id: $.data.id, w_v: $.data.version }
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.salary_cents", display_name: "Salary", sensitivity: "CONFIDENTIAL", history_policy: "CORRECTABLE", downstream_channels: [], owner_team: "comp" }
              as: DataSteward
              captures: { df_id: $.data.id }
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /hris/data-quality-rules"
              payload: { target_field_id: "${df_id}", rule_type: "RANGE", severity: "WARNING", param_min: 5000, param_max: 20000 }
              as: DataSteward
            - call: "POST /hris/security-role-assignments"
              payload: { user_id: "appr-1", role_code: "CHANGE_APPROVER", valid_from: "2026-08-01", valid_until: "2027-08-01" }
              as: SecurityAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /hris/security-role-assignments/${g1_id}/approve"
              payload: {}
              as: SecurityAdmin
              as_user_id: "secadmin-1"
            - call: "POST /hris/workers/${w_id}/change-requests"
              payload: { target_type: "WORKER_FIELD", target_field_id: "${df_id}", new_value: "99999", effective_date: "2026-09-01", expected_worker_version: "${w_v}" }
              as: HrisAnalyst
              as_user_id: "analyst-1"
              captures: { cr_id: $.data.id }
            - call: "POST /hris/change-requests/${cr_id}/approve"
              payload: {}
              as: ChangeApprover
              as_user_id: "appr-1"
            - call: "POST /hris/change-requests/${cr_id}/apply"
              payload: {}
              as: HrisAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: SecurityAdmin
            - call: "GET /hris/exception-records"
              payload: { worker_id: "${w_id}" }
              as: DataSteward
              captures: { exc_score: "$.data[0].priority_score", exc_status: "$.data[0].status" }
          assert:
            - "ExceptionRecord.status == OPEN"
            - "ExceptionRecord.priority_score == 250   # 100 (WARNING base) * 2 (CONFIDENTIAL) + 50 (age_days==7 tier)"

      - name: batch_comp_adjust_per_line_rounding
        grounds:
          - calculations.batch_total_delta_cents
          - entities.MassChangeBatch.fields.total_delta_cents
          - entities.BatchLine.fields.resolved_delta_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-line-then-sum.
          Two 10010-cent salaries at +2.5% give 10260 per line (250.25 rounds
          down half_up) and total_delta_cents == 500; the forbidden
          sum-then-round order would give 501.
        test_recipe:
          setup:
            - "Workers WA and WB each with ACTIVE row salary 10010"
            - "ACTIVE INTERNAL salary field (no channels); batch with two +2.5% salary lines effective 2026-09-01, submitted VALIDATED and SCHEDULED"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 9 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "WA", worker_number: "WA1", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10010 }
              as: HrisAnalyst
              captures: { wa_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "WB", worker_number: "WB1", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10010 }
              as: HrisAnalyst
              captures: { wb_id: $.data.id }
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.salary_cents", display_name: "Salary", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", downstream_channels: [], owner_team: "comp" }
              as: DataSteward
              captures: { df_id: $.data.id }
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /hris/mass-change-batches"
              payload: { name: "reorg-2026" }
              as: HrisAnalyst
              captures: { b_id: $.data.id }
            - call: "POST /hris/mass-change-batches/${b_id}/lines"
              payload: { line_index: 1, target_worker_id: "${wa_id}", target_field_id: "${df_id}", new_value: "+2.5%", effective_date: "2026-09-01" }
              as: HrisAnalyst
            - call: "POST /hris/mass-change-batches/${b_id}/lines"
              payload: { line_index: 2, target_worker_id: "${wb_id}", target_field_id: "${df_id}", new_value: "+2.5%", effective_date: "2026-09-01" }
              as: HrisAnalyst
            - call: "GET /hris/mass-change-batches/${b_id}"
              payload: {}
              as: HrisAnalyst
              captures: { b_v: $.data.version }
            - call: "POST /hris/mass-change-batches/${b_id}/submit"
              payload: { expected_batch_version: "${b_v}" }
              as: HrisAnalyst
            - call: "POST /hris/mass-change-batches/${b_id}/schedule"
              payload: { scheduled_effective_date: "2026-08-15" }
              as: HrisAnalyst
          trigger:
            - call: "POST /hris/mass-change-batches/${b_id}/execute"
              payload: {}
              as: HrisAnalyst
            - call: "GET /hris/mass-change-batches/${b_id}"
              payload: {}
              as: HrisAnalyst
              captures: { b_status: $.data.status, b_delta: $.data.total_delta_cents }
            - call: "GET /hris/position-assignments"
              payload: { worker_id: "${wa_id}", row_status: "FUTURE" }
              as: HrisAnalyst
              captures: { wa_new_salary: "$.data[0].salary_cents" }
          assert:
            - "MassChangeBatch.status == COMPLETED"
            - "MassChangeBatch.total_delta_cents == 500   # 2 x (10260 - 10010); sum-then-round would give 501"
            - "WA future-row salary_cents == 10260"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: batch_validation_failure_reopen_cycle
        grounds:
          - state_machines.MassChangeBatch.DRAFT_to_VALIDATION_FAILED
          - state_machines.MassChangeBatch.VALIDATION_FAILED_to_DRAFT
          - state_machines.BatchLine.FAILED_to_PENDING
        distinguishing_aspect: |
          Cyclic machine on MassChangeBatch: DRAFT -> VALIDATION_FAILED ->
          DRAFT -> VALIDATED; reopen resets ALL lines (including the previously
          FAILED one) to PENDING so the loop can repeat after the external
          cause (DRAFT data field) is fixed.
        test_recipe:
          setup:
            - "Worker; ACTIVE location field df1; DRAFT pay-grade field df2"
            - "Batch with line1 (df1, valid) and line2 (df2, fails: field not ACTIVE)"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "W Four", worker_number: "W4", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
              captures: { w_id: $.data.id }
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.location_code", display_name: "Location", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", downstream_channels: [], owner_team: "people" }
              as: DataSteward
              captures: { df1_id: $.data.id }
            - call: "POST /hris/data-fields/${df1_id}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.pay_grade", display_name: "Grade", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", downstream_channels: [], owner_team: "people" }
              as: DataSteward
              captures: { df2_id: $.data.id }
            - call: "POST /hris/mass-change-batches"
              payload: { name: "reorg-cycle" }
              as: HrisAnalyst
              captures: { b_id: $.data.id }
            - call: "POST /hris/mass-change-batches/${b_id}/lines"
              payload: { line_index: 1, target_worker_id: "${w_id}", target_field_id: "${df1_id}", new_value: "SF", effective_date: "2026-09-01" }
              as: HrisAnalyst
            - call: "POST /hris/mass-change-batches/${b_id}/lines"
              payload: { line_index: 2, target_worker_id: "${w_id}", target_field_id: "${df2_id}", new_value: "G7", effective_date: "2026-09-01" }
              as: HrisAnalyst
            - call: "GET /hris/mass-change-batches/${b_id}"
              payload: {}
              as: HrisAnalyst
              captures: { b_v1: $.data.version }
            - call: "POST /hris/mass-change-batches/${b_id}/submit"
              payload: { expected_batch_version: "${b_v1}" }
              as: HrisAnalyst
              captures: { b_status_1: $.data.status }
          trigger:
            - call: "POST /hris/mass-change-batches/${b_id}/reopen"
              payload: {}
              as: HrisAnalyst
              captures: { b_status_2: $.data.status }
            - call: "POST /hris/data-fields/${df2_id}/activate"
              payload: {}
              as: DataSteward
            - call: "GET /hris/mass-change-batches/${b_id}"
              payload: {}
              as: HrisAnalyst
              captures: { b_v2: $.data.version }
            - call: "POST /hris/mass-change-batches/${b_id}/submit"
              payload: { expected_batch_version: "${b_v2}" }
              as: HrisAnalyst
              captures: { b_status_3: $.data.status }
            - call: "GET /hris/batch-lines"
              payload: { batch_id: "${b_id}" }
              as: HrisAnalyst
              captures: { line1_status: "$.data[0].status", line2_status: "$.data[1].status" }
          assert:
            - "first submit status == VALIDATION_FAILED"
            - "after reopen status == DRAFT"
            - "second submit status == VALIDATED   # cycle DRAFT -> VALIDATION_FAILED -> DRAFT -> VALIDATED"
            - "both lines VALIDATED after second submit"

      - name: integration_event_retry_loop_until_dead_letter
        grounds:
          - state_machines.IntegrationEvent.FAILED_to_QUEUED
          - state_machines.IntegrationEvent.DISPATCHED_to_FAILED
          - entities.IntegrationEvent.fields.retry_count
        distinguishing_aspect: |
          Cyclic machine on IntegrationEvent (different entity than the batch
          loop): QUEUED -> DISPATCHED -> FAILED -> QUEUED repeats while
          retry_count < 3; the loop terminates into DEAD_LETTERED on the third
          failure, after which retry is rejected with ERR_EVENT_INVALID_STATE.
        test_recipe:
          setup:
            - "Worker salary 10000; INTERNAL salary field with channels [PAYROLL]"
            - "APPLIED NEW_RECORD change -> exactly one QUEUED IntegrationEvent"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "W Five", worker_number: "W5", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
              captures: { w_id: $.data.id, w_v: $.data.version }
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.salary_cents", display_name: "Salary", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", downstream_channels: ["PAYROLL"], owner_team: "comp" }
              as: DataSteward
              captures: { df_id: $.data.id }
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /hris/security-role-assignments"
              payload: { user_id: "appr-1", role_code: "CHANGE_APPROVER", valid_from: "2026-08-01", valid_until: "2027-08-01" }
              as: SecurityAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /hris/security-role-assignments/${g1_id}/approve"
              payload: {}
              as: SecurityAdmin
              as_user_id: "secadmin-1"
            - call: "POST /hris/workers/${w_id}/change-requests"
              payload: { target_type: "WORKER_FIELD", target_field_id: "${df_id}", new_value: "12000", effective_date: "2026-09-01", expected_worker_version: "${w_v}" }
              as: HrisAnalyst
              as_user_id: "analyst-1"
              captures: { cr_id: $.data.id }
            - call: "POST /hris/change-requests/${cr_id}/approve"
              payload: {}
              as: ChangeApprover
              as_user_id: "appr-1"
            - call: "POST /hris/change-requests/${cr_id}/apply"
              payload: {}
              as: HrisAnalyst
              as_user_id: "analyst-1"
            - call: "GET /hris/integration-events"
              payload: { change_request_id: "${cr_id}" }
              as: IntegrationOperator
              captures: { ev_id: "$.data[0].id" }
          trigger:
            - call: "POST /hris/integration-events/${ev_id}/dispatch"
              payload: { outcome: "FAILED" }
              as: IntegrationOperator
              captures: { rc1: $.data.retry_count, st1: $.data.status }
            - call: "POST /hris/integration-events/${ev_id}/retry"
              payload: {}
              as: IntegrationOperator
            - call: "POST /hris/integration-events/${ev_id}/dispatch"
              payload: { outcome: "FAILED" }
              as: IntegrationOperator
              captures: { rc2: $.data.retry_count, st2: $.data.status }
            - call: "POST /hris/integration-events/${ev_id}/retry"
              payload: {}
              as: IntegrationOperator
            - call: "POST /hris/integration-events/${ev_id}/dispatch"
              payload: { outcome: "FAILED" }
              as: IntegrationOperator
              captures: { rc3: $.data.retry_count, st3: $.data.status }
            - call: "POST /hris/integration-events/${ev_id}/retry"
              payload: {}
              as: IntegrationOperator
              captures: { err: $.data.error_id }
          assert:
            - "after failure 1: status FAILED, retry_count == 1"
            - "after failure 2: status FAILED, retry_count == 2"
            - "after failure 3: status DEAD_LETTERED, retry_count == 3"
            - "retry after dead-letter rejected: ${err} == ERR_EVENT_INVALID_STATE"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: batch_execute_cascade_depth3
        grounds:
          - state_machines.MassChangeBatch.SCHEDULED_to_COMPLETED
          - state_machines.BatchLine.VALIDATED_to_APPLIED
          - state_machines.ChangeRequest.APPROVED_to_APPLIED
          - entities.IntegrationEvent.fields.status
        distinguishing_aspect: |
          Depth-3 chain originating at execute: batch execute mutates the line
          (VALIDATED -> APPLIED); the line application itself mutates the
          worker's assignment rows (truncate + insert); the row insert itself
          emits one QUEUED IntegrationEvent per downstream channel (2 here).
          Trigger differs from dispatch_third_failure_deadletters_and_opens_exception.
        test_recipe:
          setup:
            - "Worker location NY, ACTIVE row [2026-01-05, null); location field INTERNAL channels [PAYROLL, IDENTITY]"
            - "Batch with one location line SF @2026-09-01, submitted VALIDATED, SCHEDULED 2026-08-15"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "W Six", worker_number: "W6", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000, initial_location_code: "NY" }
              as: HrisAnalyst
              captures: { w_id: $.data.id }
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.location_code", display_name: "Location", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", downstream_channels: ["PAYROLL", "IDENTITY"], owner_team: "people" }
              as: DataSteward
              captures: { df_id: $.data.id }
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /hris/mass-change-batches"
              payload: { name: "loc-move" }
              as: HrisAnalyst
              captures: { b_id: $.data.id }
            - call: "POST /hris/mass-change-batches/${b_id}/lines"
              payload: { line_index: 1, target_worker_id: "${w_id}", target_field_id: "${df_id}", new_value: "SF", effective_date: "2026-09-01" }
              as: HrisAnalyst
            - call: "GET /hris/mass-change-batches/${b_id}"
              payload: {}
              as: HrisAnalyst
              captures: { b_v: $.data.version }
            - call: "POST /hris/mass-change-batches/${b_id}/submit"
              payload: { expected_batch_version: "${b_v}" }
              as: HrisAnalyst
            - call: "POST /hris/mass-change-batches/${b_id}/schedule"
              payload: { scheduled_effective_date: "2026-08-15" }
              as: HrisAnalyst
          trigger:
            - call: "POST /hris/mass-change-batches/${b_id}/execute"
              payload: {}
              as: HrisAnalyst
              captures: { b_status: $.data.status, b_applied: $.data.applied_lines }
            - call: "GET /hris/batch-lines"
              payload: { batch_id: "${b_id}" }
              as: HrisAnalyst
              captures: { ln_status: "$.data[0].status" }
            - call: "GET /hris/position-assignments"
              payload: { worker_id: "${w_id}" }
              as: HrisAnalyst
              captures: { r1_end: "$.data[0].effective_end_date", r2_start: "$.data[1].effective_start_date", r2_loc: "$.data[1].location_code", r2_status: "$.data[1].row_status" }
            - call: "GET /hris/integration-events"
              payload: { batch_id: "${b_id}", status: "QUEUED" }
              as: IntegrationOperator
              captures: { ev0_ch: "$.data[0].channel", ev1_ch: "$.data[1].channel" }
          assert:
            - "batch status == COMPLETED, applied_lines == 1"
            - "line status == APPLIED"
            - "original row truncated: effective_end_date == \"2026-09-01\""
            - "new row: effective_start_date == \"2026-09-01\", location_code == \"SF\", row_status == FUTURE"
            - "exactly 2 QUEUED IntegrationEvents (PAYROLL and IDENTITY), batch_id set"

      - name: dispatch_third_failure_deadletters_and_opens_exception
        grounds:
          - state_machines.IntegrationEvent.DISPATCHED_to_FAILED
          - entities.ExceptionRecord.fields.integration_event_id
          - calculations.exception_priority_score
        distinguishing_aspect: |
          Depth-2 chain originating at dispatch (different trigger than the
          batch-execute cascade): the third FAILED dispatch flips the event to
          DEAD_LETTERED, and that flip itself opens an ExceptionRecord
          (rule_id null, dead-letter base 300, age bonus 0 => score 300).
        test_recipe:
          setup:
            - "Worker salary 10000; INTERNAL salary field channels [PAYROLL]; applied change -> one event"
            - "Event already FAILED twice (retry_count == 2), currently QUEUED after retry"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "W Seven", worker_number: "W7", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
              captures: { w_id: $.data.id, w_v: $.data.version }
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.salary_cents", display_name: "Salary", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", downstream_channels: ["PAYROLL"], owner_team: "comp" }
              as: DataSteward
              captures: { df_id: $.data.id }
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /hris/security-role-assignments"
              payload: { user_id: "appr-1", role_code: "CHANGE_APPROVER", valid_from: "2026-08-01", valid_until: "2027-08-01" }
              as: SecurityAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /hris/security-role-assignments/${g1_id}/approve"
              payload: {}
              as: SecurityAdmin
              as_user_id: "secadmin-1"
            - call: "POST /hris/workers/${w_id}/change-requests"
              payload: { target_type: "WORKER_FIELD", target_field_id: "${df_id}", new_value: "12000", effective_date: "2026-09-01", expected_worker_version: "${w_v}" }
              as: HrisAnalyst
              as_user_id: "analyst-1"
              captures: { cr_id: $.data.id }
            - call: "POST /hris/change-requests/${cr_id}/approve"
              payload: {}
              as: ChangeApprover
              as_user_id: "appr-1"
            - call: "POST /hris/change-requests/${cr_id}/apply"
              payload: {}
              as: HrisAnalyst
              as_user_id: "analyst-1"
            - call: "GET /hris/integration-events"
              payload: { change_request_id: "${cr_id}" }
              as: IntegrationOperator
              captures: { ev_id: "$.data[0].id" }
            - call: "POST /hris/integration-events/${ev_id}/dispatch"
              payload: { outcome: "FAILED" }
              as: IntegrationOperator
            - call: "POST /hris/integration-events/${ev_id}/retry"
              payload: {}
              as: IntegrationOperator
            - call: "POST /hris/integration-events/${ev_id}/dispatch"
              payload: { outcome: "FAILED" }
              as: IntegrationOperator
            - call: "POST /hris/integration-events/${ev_id}/retry"
              payload: {}
              as: IntegrationOperator
          trigger:
            - call: "POST /hris/integration-events/${ev_id}/dispatch"
              payload: { outcome: "FAILED" }
              as: IntegrationOperator
              captures: { ev_status: $.data.status, ev_rc: $.data.retry_count }
            - call: "GET /hris/exception-records"
              payload: { worker_id: "${w_id}" }
              as: DataSteward
              captures: { exc_status: "$.data[0].status", exc_ev: "$.data[0].integration_event_id", exc_score: "$.data[0].priority_score" }
          assert:
            - "event status == DEAD_LETTERED, retry_count == 3"
            - "exactly one ExceptionRecord OPEN with integration_event_id == ${ev_id}"
            - "exception priority_score == 300   # dead-letter base 300 x mult 1 + age 0"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: apply_rejected_request_state_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_REQUEST_INVALID_STATE]
          - errors[ERR_EFFECTIVE_DATE_OUT_OF_WINDOW]
        distinguishing_aspect: |
          Category pair (state vs business_temporal): the request is REJECTED
          (state, priority 6) AND its effective_date 2028-06-01 is outside the
          [clock-730d, clock+365d] window (temporal, priority 10); the state
          error ERR_REQUEST_INVALID_STATE must win.
        test_recipe:
          setup:
            - "Worker; ACTIVE INTERNAL salary field; appr-1 provisioned"
            - "Change request with effective_date 2028-06-01 created, then REJECTED"
          setup_api_calls:
            - call: "POST /hris/positions"
              payload: { title: "Eng", department: "ENG", headcount_budget: 5 }
              as: HrisAnalyst
              captures: { pos_id: $.data.id }
            - call: "POST /hris/workers"
              payload: { legal_name: "W Eight", worker_number: "W8", hire_date: "2026-01-05", initial_position_id: "${pos_id}", initial_salary_cents: 10000 }
              as: HrisAnalyst
              captures: { w_id: $.data.id, w_v: $.data.version }
            - call: "POST /hris/data-fields"
              payload: { field_key: "assignment.salary_cents", display_name: "Salary", sensitivity: "INTERNAL", history_policy: "CORRECTABLE", downstream_channels: [], owner_team: "comp" }
              as: DataSteward
              captures: { df_id: $.data.id }
            - call: "POST /hris/data-fields/${df_id}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /hris/security-role-assignments"
              payload: { user_id: "appr-1", role_code: "CHANGE_APPROVER", valid_from: "2026-08-01", valid_until: "2027-08-01" }
              as: SecurityAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /hris/security-role-assignments/${g1_id}/approve"
              payload: {}
              as: SecurityAdmin
              as_user_id: "secadmin-1"
            - call: "POST /hris/workers/${w_id}/change-requests"
              payload: { target_type: "WORKER_FIELD", target_field_id: "${df_id}", new_value: "12000", effective_date: "2028-06-01", expected_worker_version: "${w_v}" }
              as: HrisAnalyst
              as_user_id: "analyst-1"
              captures: { cr_id: $.data.id }
            - call: "POST /hris/change-requests/${cr_id}/reject"
              payload: {}
              as: ChangeApprover
              as_user_id: "appr-1"
          trigger:
            - call: "POST /hris/change-requests/${cr_id}/apply"
              payload: {}
              as: HrisAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
            - call: "GET /hris/change-requests/${cr_id}"
              payload: {}
              as: HrisAnalyst
              captures: { cr_status: $.data.status }
          assert:
            - "error_id == ERR_REQUEST_INVALID_STATE   # state (p6) beats business_temporal (p10)"
            - "request status remains REJECTED"

      - name: grant_approve_self_approval_beats_window_overlap
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_SELF_APPROVAL_FORBIDDEN]
          - errors[ERR_GRANT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Category pair (business_safety vs business_constraint) — different
          from the state-vs-temporal pair above: approving a grant where the
          approver IS the grantee (safety, p7) and the window overlaps an
          existing same-(user, role) grant (constraint, p9) must return
          ERR_SELF_APPROVAL_FORBIDDEN.
        test_recipe:
          setup:
            - "secadmin-1 holds APPROVED DATA_STEWARD grant G1 [2026-08-01, 2026-12-31] (approved by a different admin)"
            - "G2 requested: same user secadmin-1, same role DATA_STEWARD, window [2026-10-01, 2027-03-01] overlapping G1"
          setup_api_calls:
            - call: "POST /hris/security-role-assignments"
              payload: { user_id: "secadmin-1", role_code: "DATA_STEWARD", valid_from: "2026-08-01", valid_until: "2026-12-31" }
              as: SecurityAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /hris/security-role-assignments/${g1_id}/approve"
              payload: {}
              as: SecurityAdmin
              as_user_id: "secadmin-2"
            - call: "POST /hris/security-role-assignments"
              payload: { user_id: "secadmin-1", role_code: "DATA_STEWARD", valid_from: "2026-10-01", valid_until: "2027-03-01" }
              as: SecurityAdmin
              captures: { g2_id: $.data.id }
          trigger:
            - call: "POST /hris/security-role-assignments/${g2_id}/approve"
              payload: {}
              as: SecurityAdmin
              as_user_id: "secadmin-1"
              captures: { err: $.data.error_id }
            - call: "GET /hris/security-role-assignments"
              payload: { user_id: "secadmin-1" }
              as: SecurityAdmin
              captures: { g2_status: "$.data[1].status" }
          assert:
            - "error_id == ERR_SELF_APPROVAL_FORBIDDEN   # business_safety (p7) beats business_constraint (p9)"
            - "G2 status remains REQUESTED"
