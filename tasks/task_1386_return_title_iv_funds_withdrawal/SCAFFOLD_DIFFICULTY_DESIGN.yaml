            - call: "POST /r2t4/withdrawal-cases/${co}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
            - call: "GET /r2t4/enrollments/${eo}"
              payload: {}
              as: RegistrarClerk
              captures: { eo_bal_mid: $.data.balance_cents }
          trigger:
            - call: "POST /r2t4/enrollments/${eo}/rescind-withdrawal"
              payload: {}
              as: RegistrarClerk
              captures: { eo_bal_post: $.data.balance_cents, eo_notif: $.data.balance_notification_sent }
            - call: "GET /r2t4/account-entries"
              payload: { enrollment_id: "${eo}", entry_type: "REVERSAL" }
              as: RegistrarClerk
          assert:
            - "Pre-withdrawal balance == 100000 (600000 CHARGE - 500000 AID_CREDITs)"
            - "After calculate: balance == 102500 (100000 - 450000 refund + 452500 chargeback)"
            - "After rescind: Enrollment.${eo}.balance_cents == 100000 — exactly the pre-withdrawal value"
            - "Exactly 2 REVERSAL entries exist, one negating -450000 (so +450000) and one negating +452500 (so -452500), each with reversal_of_entry_id pointing at the original entry"
            - "Enrollment.${eo}.balance_notification_sent == false (notification state compensated along with the money)"
            - "WithdrawalCase.${co}.status == CANCELLED"
