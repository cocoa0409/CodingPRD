  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: sizing_study_load_step_input_set_filtering
        claim_type: input_set_filtering
        grounds: [calculations.sizing_required_kva]
        distinguishing_aspect: "Steps with duty STANDBY_START never enter running_kva: steps 100 CONTINUOUS + 500 STANDBY_START with largest_motor 50 give running 100 and starting 100 - 50 + 150 = 200; the 500-kVA standby step inflates neither term, so required_kva == 200.0."
        test_recipe:
          setup: ["customer, engine, alternator, order exist"]
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "Oscar Filter", credit_limit_cents: 100000000, primary_locale: "US_TX" }
              as: PlatformAdmin
              captures: { fl_c: $.data.id }
            - call: "POST /genset-packaging/engine-models"
              payload: { model_code: "E15", manufacturer: "G", rated_kw: 400, fuel_burn_gph_at_75: 15.0, emissions_tier_capability: "EPA_TIER_4", list_price_cents: 30000000 }
              as: PlatformAdmin
              captures: { fl_e: $.data.id }
            - call: "POST /genset-packaging/alternator-models"
              payload: { model_code: "A700", rated_kva: 700, efficiency_pct: 96.0, list_price_cents: 15000000 }
              as: PlatformAdmin
              captures: { fl_a: $.data.id }
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${fl_c}", site_locale: "US_TX", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
              captures: { fl_o: $.data.id, fl_ov: $.data.version }
          trigger:
            - call: "POST /genset-packaging/sizing-studies"
              payload: { order_id: "${fl_o}", engine_model_id: "${fl_e}", alternator_model_id: "${fl_a}", load_steps: [ { description: "run", kva: 100, duty: "CONTINUOUS" }, { description: "stdby", kva: 500, duty: "STANDBY_START" } ], largest_motor_kva: 50, starting_method: "DOL", altitude_m: 500, ambient_c: 40, method: "NAMEPLATE_SUM", expected_order_version: "${fl_ov}" }
              as: ApplicationEngineer
              captures: { fl_s: $.data.id, fl_kva: $.data.required_kva }
          assert:
            - "SizingStudy.${fl_s}.required_kva == 200.0 (running 100; starting 100 - 50 + 150 = 200; max(100, 200))"
            - "the 500-kVA STANDBY_START step was excluded from both terms (otherwise required_kva would exceed 600)"

      - name: sizing_derated_floor_at_070
        claim_type: constants_applied
        grounds: [calculations.sizing_required_kva]
        distinguishing_aspect: "Extreme derates clamp at the 0.70 DERATE_FLOOR: altitude 15000 m gives 0.01*floor(14000/500) = 0.28 and ambient 60 C gives 0.02*floor(20/5) = 0.08, so raw derate 0.64 is clamped to 0.70; required_kva = 300/0.70*1.10 = 471.4 instead of the unclamped 515.6."
        test_recipe:
          setup: ["customer, engine, alternator, order exist"]
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "Papa Floor", credit_limit_cents: 100000000, primary_locale: "US_TX" }
              as: PlatformAdmin
              captures: { df2_c: $.data.id }
            - call: "POST /genset-packaging/engine-models"
              payload: { model_code: "E15", manufacturer: "G", rated_kw: 400, fuel_burn_gph_at_75: 15.0, emissions_tier_capability: "EPA_TIER_4", list_price_cents: 30000000 }
              as: PlatformAdmin
              captures: { df2_e: $.data.id }
            - call: "POST /genset-packaging/alternator-models"
              payload: { model_code: "A700", rated_kva: 700, efficiency_pct: 96.0, list_price_cents: 15000000 }
              as: PlatformAdmin
              captures: { df2_a: $.data.id }
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${df2_c}", site_locale: "US_TX", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
              captures: { df2_o: $.data.id, df2_ov: $.data.version }
          trigger:
            - call: "POST /genset-packaging/sizing-studies"
              payload: { order_id: "${df2_o}", engine_model_id: "${df2_e}", alternator_model_id: "${df2_a}", load_steps: [ { description: "A", kva: 100, duty: "CONTINUOUS" } ], largest_motor_kva: 100, starting_method: "DOL", altitude_m: 15000, ambient_c: 60, method: "DERATED_STOCHASTIC", expected_order_version: "${df2_ov}" }
              as: ApplicationEngineer
              captures: { df2_s: $.data.id, df2_kva: $.data.required_kva }
          assert:
            - "SizingStudy.${df2_s}.required_kva == 471.4 (base 300 / 0.70 floor = 428.5714; x 1.10 = 471.4286; round 1 dp half-up = 471.4)"
            - "471.4 (not the unclamped 300/0.64*1.10 = 515.6) proves the 0.70 DERATE_FLOOR engaged"

