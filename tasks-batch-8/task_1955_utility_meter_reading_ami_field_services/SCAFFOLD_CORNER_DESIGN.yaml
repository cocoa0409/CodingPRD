          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION"
            - "OpsSnapshot.${snap_id}.snapshot_status == FINALIZED"

      - name: account_suspend_cancels_pending_stops
        claim_type: side_effect_execution
        grounds: [state_machines.ServiceAccount.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "Suspension cascades: the account's PENDING stop on a non-terminal route flips to CANCELLED."
