      - name: inspection_measurement_count_six_accepted_vs_five_rejected
        grounds:
          - calculations.wall_thickness_distribution
          - validations[priority=25]
          - errors.ERR_INSUFFICIENT_MEASUREMENTS
          - calculations.inspection_verdict
          - state_machines.FinishedUnit.OUTFITTED_to_SELLABLE
        distinguishing_aspect: |
          The boundary metric is the CARDINALITY of a client-supplied collection on
          POST /finished-units/{finished_unit_id}/inspect — an empty-collection / count edge
          rather than either of the two numeric threshold crossings above: MIN_MEASUREMENT_POINTS
          is 6, so the same OUTFITTED hull is refused 422 with ERR_INSUFFICIENT_MEASUREMENTS at
          n == 5 and passes to SELLABLE at n == 6, the smallest representable step on this axis
          being one measurement.
        test_recipe:
          setup:
            - "ProductModel PM-X6C-KM: KAYAK/MID, wall_thickness_min_mm 4.50, wall_cv_max_pct 12.00, impact_test_min_joules 90.00, min_cooling_minutes 30, nominal_charge_kg 24.000, charge_tolerance_pct 5.00."
