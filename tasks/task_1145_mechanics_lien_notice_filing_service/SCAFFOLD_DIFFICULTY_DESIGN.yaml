  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: waiver_period_half_open_overlap
        grounds:
          - validations[priority=9]
          - entities.Waiver.fields.period_start
          - entities.Waiver.fields.period_end
        distinguishing_aspect: |
          HALF-OPEN interval semantics on the Waiver resource: [period_start,
          period_end) — a new waiver starting exactly at another's period_end
          (2026-05-31) is legal adjacency, while a true interior overlap is
          rejected with ERR_WAIVER_PERIOD_OVERLAP. The companion instance uses
          CLOSED semantics on a different resource (StopNotice).
        test_recipe:
          setup:
            - "CA project (no verification needed for waivers) with no waivers yet"
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "Ov Co", contact_email: "o@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id } }
            - { call: "POST /lien/projects", payload: { name: "Ov Job", state_code: "CA", county: "Tehama", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 101", contract_value_cents: 500000, approved_extras_cents: 100000, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /lien/waivers", payload: { project_id: "${proj_id}", waiver_type: "UNCONDITIONAL_PROGRESS", amount_cents: 10000, period_start: "2026-05-01", period_end: "2026-05-31" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { wa_id: $.data.id } }
          trigger:
            - { call: "POST /lien/waivers", payload: { project_id: "${proj_id}", waiver_type: "UNCONDITIONAL_PROGRESS", amount_cents: 20000, period_start: "2026-05-31", period_end: "2026-06-30" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { wb_id: $.data.id, wb_status: $.data.status } }
            - { call: "POST /lien/waivers", payload: { project_id: "${proj_id}", waiver_type: "CONDITIONAL_FINAL", amount_cents: 5000, period_start: "2026-05-15", period_end: "2026-06-15" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { wc_err: $.data.error_id } }
          assert:
            - "Waiver B (starts 2026-05-31 == A's period_end) is created: status RECEIVED — adjacency is NOT overlap under half-open semantics"
            - "Waiver C ([2026-05-15, 2026-06-15) intersects A) returns ERR_WAIVER_PERIOD_OVERLAP"

      - name: stop_notice_closed_interval_overlap
        grounds:
          - validations[priority=9]
          - entities.StopNotice.fields.coverage_start
          - entities.StopNotice.fields.coverage_end
        distinguishing_aspect: |
          CLOSED interval semantics on the StopNotice resource: [coverage_start,
          coverage_end] both inclusive — a new stop notice whose coverage_start
          (2026-06-30) merely touches a SERVED stop notice's coverage_end is
          ALREADY overlap and is rejected with ERR_STOP_NOTICE_OVERLAP, while a
          start one day later (2026-07-01) is accepted. Different resource and
          different interval geometry from waiver_period_half_open_overlap.
        test_recipe:
          setup:
            - "TX STATE_PUBLIC project with ACTIVE BASE_CONTRACT span 2026-05-02..2026-06-10 (stop-notice deadline 2026-07-10)"
            - "Stop notice A coverage [2026-06-01, 2026-06-30] SERVED on 2026-06-20"
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "Stop Co", contact_email: "s@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id } }
            - { call: "POST /lien/jurisdiction-rules", payload: { state_code: "TX", project_type: "STATE_PUBLIC", prelim_notice_required: false, prelim_days: 15, prelim_day_basis: "CALENDAR", refused_counts_as_served: true, allowed_delivery_methods: ["CERTIFIED_MAIL", "PERSONAL_SERVICE", "EMAIL_STATUTORY"], filing_window_days: 90, foreclosure_deadline_days: 90, stop_notice_days: 30, bond_claim_days: 45, counts_punch_list: true, retainage_claimable: true, cap_mode: "UNCAPPED", interest_annual_rate: 0.10, bond_pct: 1.25, effective_from: "2026-01-01" }, as: PlatformAdmin }
            - { call: "POST /lien/projects", payload: { name: "Stop Job", state_code: "TX", county: "Travis", project_type: "STATE_PUBLIC", property_legal_description: "Lot 111", contract_value_cents: 900000, approved_extras_cents: 0, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { proj_id: $.data.id, pv0: $.data.version } }
            - { call: "POST /lien/furnishing-spans", payload: { project_id: "${proj_id}", span_kind: "BASE_CONTRACT", start_date: "2026-05-02", end_date: "2026-06-10", expected_project_version: "${pv0}" }, as: CustomerAdmin, as_user_id: "${comp_id}" }
            - { call: "POST /lien/stop-notices", payload: { project_id: "${proj_id}", amount_cents: 50000, coverage_start: "2026-06-01", coverage_end: "2026-06-30" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { sna_id: $.data.id } }
            - { call: "POST /lien/stop-notices/${sna_id}/serve", payload: { served_at: "2026-06-20" }, as: OpsAgent, captures: { sna_status: $.data.status } }
          trigger:
            - { call: "POST /lien/stop-notices", payload: { project_id: "${proj_id}", amount_cents: 30000, coverage_start: "2026-06-30", coverage_end: "2026-07-15" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { snb_err: $.data.error_id } }
            - { call: "POST /lien/stop-notices", payload: { project_id: "${proj_id}", amount_cents: 30000, coverage_start: "2026-07-01", coverage_end: "2026-07-15" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { snc_id: $.data.id, snc_status: $.data.status } }
          assert:
            - "StopNotice A status == SERVED (served 2026-06-20 <= deadline 2026-07-10)"
            - "Stop notice B (coverage_start 2026-06-30 touches A's coverage_end) returns ERR_STOP_NOTICE_OVERLAP — shared endpoint counts as overlap under CLOSED semantics"
            - "Stop notice C (starts 2026-07-01, one day clear) is created: status DRAFT"
