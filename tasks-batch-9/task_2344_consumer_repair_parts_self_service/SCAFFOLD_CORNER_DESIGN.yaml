      - name: attestation_is_rejected_while_verification_is_false_or_the_posture_is_not_current
        claim_type: error_triggerable
        grounds:
          - validations[priority=90]
          - errors[ERR_ATTESTATION_UNSUPPORTED]
          - state_machines.ComplianceObligation.transitions[OPEN | AT_RISK | BREACHED_DOCUMENTATION | BREACHED_PARTS -> ATTESTED]
          - calculations.documentation_posture_rollup.formula
        distinguishing_aspect: |
          The same error code guards two independent conditions — an attestation
          that does not actually assert verification, and one filed while the model
          has no CURRENT documentation posture — and clearing only the first still
          leaves the second in force.
        test_recipe:
          setup:
            - "Profile US-CA; model CRX-E7 (still in production) with PUBLISHED part SKU-E7-A and an in-window compatibility row but NO published manual, so documentation_posture is MISSING."
