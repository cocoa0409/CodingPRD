            - { call: "POST /parcels", payload: {landowner_id: "${lo}", name: "PB", acreage: 400, fuel_model: "GRASS", slope_class: "FLAT", wui_adjacent: false, airshed_id: "ASH-1", drought_index: 5}, as: Landowner, as_user_id: "${lo}", captures: {parcelB: $.data.id, parcelB_v: $.data.version} }
            - { call: "POST /burn-plans", payload: {parcel_id: "${parcelA}", expected_parcel_version: "${parcelA_v}", planned_acres: 300, planned_window_start: "2026-05-10", planned_window_end: "2026-05-20", max_wind_mph: 15, min_fuel_moisture_pct: 8, max_fuel_moisture_pct: 20, min_rh_pct: 25, min_temp_f: 40, max_temp_f: 85, min_mixing_height_ft: 1500, treatment_lines: [{category: "BROADCAST", rate_class: "GRASS", acres: 300}]}, as: BurnBoss, as_user_id: "${bossA}", captures: {planA: $.data.id} }
            - { call: "POST /burn-plans/${planA}/submit", payload: {}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /burn-plans/${planA}/approve", payload: {}, as: AgencyReviewer, as_user_id: "${bossR}" }
            - { call: "POST /burn-plans", payload: {parcel_id: "${parcelB}", expected_parcel_version: "${parcelB_v}", planned_acres: 201, planned_window_start: "2026-05-10", planned_window_end: "2026-05-20", max_wind_mph: 15, min_fuel_moisture_pct: 8, max_fuel_moisture_pct: 20, min_rh_pct: 25, min_temp_f: 40, max_temp_f: 85, min_mixing_height_ft: 1500, treatment_lines: [{category: "BROADCAST", rate_class: "GRASS", acres: 201}]}, as: BurnBoss, as_user_id: "${bossA}", captures: {planB: $.data.id} }
            - { call: "POST /burn-plans/${planB}/submit", payload: {}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "POST /burn-plans/${planB}/approve", payload: {}, as: AgencyReviewer, as_user_id: "${bossR}" }
            - { call: "POST /burn-plans/${planA}/smoke-approvals", payload: {requested_burn_date: "2026-05-12", requested_acres: 300}, as: BurnBoss, as_user_id: "${bossA}", captures: {smokeA: $.data.id} }
            - { call: "POST /smoke-approvals/${smokeA}/decide", payload: {decision: "CONDITIONALLY_APPROVED"}, as: AirQualityOfficer }
            - { call: "POST /burn-plans/${planB}/smoke-approvals", payload: {requested_burn_date: "2026-05-12", requested_acres: 201}, as: BurnBoss, as_user_id: "${bossA}", captures: {smokeB: $.data.id} }
          trigger:
            - { call: "POST /smoke-approvals/${smokeB}/decide", payload: {decision: "APPROVED"}, as: AirQualityOfficer, captures: {err: "$.data.error_id"} }
          assert:
            - "err == ERR_AIRSHED_CAPACITY_EXCEEDED (300 committed by a CONDITIONALLY_APPROVED approval + 201 > cap 500)"
            - "smokeB remains SUBMITTED"

