  - name: award_out_of_range_error_is_triggerable
    claim_type: Errors
    grounds:
    - errors[ERR_AWARD_OUT_OF_RANGE]
    excluded_because:
      difficulty_instance: boundary_precision_check / idr_award_at_the_inclusive_band_edge_is_accepted_while_one_cent_below_is_rejected
      rationale: That instance triggers the error one cent below the band and then proves the edge is accepted.
  - name: observation_capacity_error_is_triggerable
    claim_type: Errors
    grounds:
    - errors[ERR_OBSERVATION_CAPACITY_EXCEEDED]
    excluded_because:
      difficulty_instance: compensating_invariant / observation_admission_and_discharge_conserve_the_licensed_bed_count
      rationale: The third admission against two licensed beds triggers the error there.
  - name: coverage_capacity_and_double_booking_errors_are_triggerable
    claim_type: Errors
    grounds:
    - errors[ERR_COVERAGE_CAPACITY_EXCEEDED]
    - errors[ERR_CLINICIAN_DOUBLE_BOOKED]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / physician_shifts_use_half_open_intervals_so_touching_is_free_but_third_overlap_breaks_the_cap
      rationale: Both shift errors are triggered there, including their relative priority.
  - name: agreement_window_conflict_error_is_triggerable
    claim_type: Errors
    grounds:
    - errors[ERR_AGREEMENT_WINDOW_CONFLICT]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / transfer_agreement_windows_require_one_clear_calendar_day_so_adjacent_is_rejected
      rationale: The adjacent-window rejection there is the error's trigger.
  - name: facility_posture_blocked_error_is_triggerable
    claim_type: Errors
    grounds:
    - errors[ERR_FACILITY_POSTURE_BLOCKED]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / restricted_posture_with_out_of_scope_mri_yields_posture_error_not_scope_error
      rationale: The RESTRICTED posture gate returns this error there, and the SUSPENDED variant is exercised by the cross-entity instance.
  - name: invalid_claim_state_error_is_triggerable
    claim_type: Errors
    grounds:
    - errors[ERR_INVALID_CLAIM_STATE]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / dispute_case_creation_blocked_by_draft_claim_then_allowed_after_adjudication
      rationale: Opening a dispute on a DRAFT claim triggers the error there.
