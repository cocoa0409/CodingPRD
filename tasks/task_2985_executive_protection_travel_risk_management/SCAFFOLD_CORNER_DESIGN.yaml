        claim_type: computed_read
        grounds:
          - endpoints.GET_/exec-protection/executives/{id}/perquisite-disclosure
          - calculations.perquisite_allocation
          - state_machines.Trip.readiness_state.DEGRADED_to_CLOSED.side_effects
        distinguishing_aspect: |
          The disclosure endpoint returns an inline projection rather than an entity, so every
          field must be re-derived from the CLOSED trips of that executive and must agree, cent
          for cent, with the ledger the close wrote: taxable 11250 plus business-borne 101250
          equals the trip's own FINAL total of 112500. closed_trip_count must count only CLOSED
          trips, and latest_perquisite_rate_applied must echo the 0.10 first-tier rate the close
          selected because the prior disclosure ledger was 0.
        test_recipe:
          setup:
            - "an APPROVED trip whose single LEAD_AGENT assignment has been RELEASED for the full ten hours; clock advanced to the trip's return instant so it can be closed"
