            - call: "POST /warranty-claims/${claim}/storage-review"
              payload: { outcome: "VIOLATED", storage_description: "hull stored on bare concrete without cradles" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /warranty-claims/${claim}/waive-storage-finding"
              payload: { waiver_note: "goodwill waiver for a first-season owner" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /warranty-claims/${claim}/return-to-queue"
              payload: { return_note: "hull photographs are illegible; re-open the file" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /warranty-claims/${claim}/waive-storage-finding"
              payload: { waiver_note: "attempt to re-use the revoked waiver" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-02T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /warranty-claims/${claim}/start-review"
              payload: {}
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /warranty-claims/${claim}/storage-review"
              payload: { outcome: "VERIFIED", storage_description: "cradled under cover on the second review" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "GET /warranty-claims/${claim}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "first start-review: 200 with claim_status == 'UNDER_REVIEW' and months_in_service == 2 (complete calendar months from 2026-08-02T00:00:00Z to 2026-10-02T00:00:00Z)"
            - "storage-review VIOLATED: 200 with storage_review_status == 'GUIDANCE_VIOLATED' and claim_status STILL 'UNDER_REVIEW' — the two axes are independent"
            - "waive-storage-finding: 200 with storage_review_status == 'WAIVED'"
            - "return-to-queue: 200 with claim_status == 'SUBMITTED', storage_review_status back to 'NOT_STARTED', months_in_service == null and storage_description == null — one lap of the loop erased the whole review"
            - "the second waive attempt: 409 ERR_STORAGE_FINDING_NOT_WAIVABLE, because the axis is NOT_STARTED rather than GUIDANCE_VIOLATED — this is the falsifier that the waiver was revoked and not merely hidden"
            - "second start-review: 200 with claim_status == 'UNDER_REVIEW' and months_in_service == 3 — the age was RE-measured against the 2026-11-02 clock, not restored from the first pass"
            - "second storage-review VERIFIED: 200 with storage_review_status == 'GUIDANCE_VERIFIED'; it is admitted only because return-to-queue reset the axis, since §1.4 priority 46 refuses a second decision on an already-decided axis"
            - "final GET: claim_status == 'UNDER_REVIEW', storage_review_status == 'GUIDANCE_VERIFIED', months_in_service == 3, storage_description == 'cradled under cover on the second review'"
            - "WarrantyClaim.${claim}.version == 7  # 1 create + start-review + storage-review + waive + return-to-queue + start-review + storage-review; the refused waive added nothing"
            - "every money field is still null: no reserve moved anywhere in the lap, so ProductModel.${pm}.warranty_reserve_cents == 500000 and warranty_paid_cents == 0"

      - name: sm_cyclic_mold_service_round_trip_repeats_and_resets_the_counter_to_zero_each_lap
        claim_type: "Shape: cyclic"
        grounds:
          - state_machines.Mold.AVAILABLE_to_MAINTENANCE
          - state_machines.Mold.MAINTENANCE_to_AVAILABLE
          - endpoints.POST_/molds/{mold_id}/complete-service
          - calculations.mold_selection
          - errors.ERR_NO_ELIGIBLE_MOLD
        distinguishing_aspect: "The AVAILABLE -> MAINTENANCE -> AVAILABLE loop can be traversed repeatedly, and each complete-service performs a FULL reset of cycles_since_service to 0 rather than a decrement: the counter reads 1 after the first demould, 0 after the first service, 1 again after the second demould and 0 again after the second service, while a mould parked in MAINTENANCE is absent from the selection pool."
        test_recipe:
          setup:
            - "ProductModel PM-SM-SVC with a SINGLE mould MLD-SM-SVC whose service_interval_cycles is 5, chosen well above 2 so the CASCADE-B automatic service hold at the interval never fires and every MAINTENANCE entry in this instance is the operator's own service-hold."
            - "ProductionOrder POR-SM-SVC with ordered_qty 2 admits exactly two single-cavity cycles: 2 <= floor(2 * 1.20) == 2."
            - "The two cycles occupy disjoint mould spans [09:00, 10:30) and [13:00, 14:30) on 2026-08-01, and the second cycle is created only AFTER the first complete-service, so no SCHEDULED cycle is ever caught by a service-hold cascade."
