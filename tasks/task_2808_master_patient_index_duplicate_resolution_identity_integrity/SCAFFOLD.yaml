  # --- duplicate candidate pairs & work queue ------------------------------
  - method: POST
    path: "/mpi/candidate-pairs"
    purpose: |
      Score two records against a rule set under one score_variant and place the
      pair on the triage work queue. rule_set_id may name a rule set in ANY status
      (DRAFT, ACTIVE or RETIRED) — pinning the exact rule set is what makes a
      score reproducible and auditable years later.
    roles: [IdentityAnalyst, MpiAdmin]
    input:
      - record_a_id
      - record_b_id
      - rule_set_id
      - score_variant
    output: DuplicateCandidatePair
    side_effects:
      - "Computes attribute_score_breakdown, raw_score, conflict_flags and match_score per calculations.pair_match_score."
      - "Sets classification from the rule set's thresholds, and subject_record_mrn to the mrn of the subject record (the member with the later created_at; on identical created_at the lexicographically greater mrn)."
      - "Computes evidence_points (0), base_band, evidence_adjustment, effective_score and priority_band per calculations.pair_triage_effective_score."
      - "queue_state initialised to NEW; detected_at_site_id set to the subject record's site_id."
      - "When conflict_flags contains BIOMETRIC_CONFLICT or INSURANCE_CONFLICT AND raw_score >= FRAUD_AUTO_OPEN_RAW_SCORE_MIN, exactly one FraudInvestigation is auto-opened (opened_by SYSTEM, opened_by_user_id null, pair_id this pair, state OPEN) on the SUBJECT record only, the subject record's integrity_state becomes FRAUD_SUSPECTED, the subject's site flagged_record_count is recomputed, risk_score is then computed per calculations.fraud_risk_score, and the pair's queue_state jumps to ESCALATED_FRAUD instead of NEW. The non-subject member record is not modified. SSN4_CONFLICT alone never triggers this branch."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_RULE_SET_NOT_FOUND, ERR_RECORD_NOT_FOUND, ERR_MERGE_SELF_REFERENCE, ERR_PAIR_ALREADY_EXISTS]

  - method: GET
    path: "/mpi/candidate-pairs/{id}"
    purpose: "Read one candidate pair including its full score breakdown and triage band."
    roles: [SiteRegistrar, IdentityAnalyst, IdentityStewardApprover, PrivacyOfficer, MpiAdmin]
    input: []
    output: DuplicateCandidatePair
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PAIR_NOT_FOUND]

  - method: GET
    path: "/mpi/candidate-pairs"
    purpose: "The work queue list. Reverse reachability for record_a_id, record_b_id, rule_set_id and detected_at_site_id."
    roles: [SiteRegistrar, IdentityAnalyst, IdentityStewardApprover, PrivacyOfficer, MpiAdmin]
    input:
      - record_a_id?
      - record_b_id?
      - rule_set_id?
      - detected_at_site_id?
      - queue_state?
      - classification?
      - priority_band?
      - limit?
      - offset?
    output: DuplicateCandidatePair[]
    side_effects:
      - "Default ordering: priority_band ASC (P1 first), then effective_score DESC, then created_at ASC, then subject_record_mrn ASC."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: POST
    path: "/mpi/candidate-pairs/{id}/rescore"
    purpose: "Re-run scoring for a pair under a (possibly different) rule set and/or score_variant. Guarded by OCC on the pair's version."
    roles: [IdentityAnalyst, MpiAdmin]
    input:
      - rule_set_id
      - score_variant
      - expected_pair_version
    output: DuplicateCandidatePair
    side_effects:
      - "Recomputes the full score chain (raw_score, conflict_flags, match_score, classification, attribute_score_breakdown) and the triage chain (base_band, evidence_adjustment, effective_score, priority_band); rule_set_id and score_variant are overwritten with the submitted values."
      - "queue_state is left UNCHANGED — rescore is not a queue transition. It is permitted only from NEW, TRIAGED or UNDER_REVIEW."
      - "version += 1. Existing ReviewEvidence rows are preserved, so evidence_points and evidence_adjustment are recomputed from them."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_RULE_SET_NOT_FOUND, ERR_PAIR_NOT_FOUND, ERR_STALE_PAIR_VERSION, ERR_PAIR_INVALID_STATE]

  - method: POST
    path: "/mpi/candidate-pairs/{id}/triage"
    purpose: "Analyst triages a NEW pair, attaching a triage note."
    roles: [IdentityAnalyst]
    input:
      - triage_note
    output: DuplicateCandidatePair
    side_effects:
      - "queue_state NEW -> TRIAGED; version += 1."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PAIR_NOT_FOUND, ERR_RECORD_UNDER_FRAUD_HOLD, ERR_PAIR_INVALID_STATE]

  - method: POST
    path: "/mpi/candidate-pairs/{id}/start-review"
    purpose: "Open manual review on a triaged pair so evidence can be attached."
    roles: [IdentityAnalyst]
    input: []
    output: DuplicateCandidatePair
    side_effects:
      - "queue_state TRIAGED -> UNDER_REVIEW; version += 1."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PAIR_NOT_FOUND, ERR_RECORD_UNDER_FRAUD_HOLD, ERR_PAIR_INVALID_STATE]

  - method: POST
    path: "/mpi/candidate-pairs/{id}/evidence"
    purpose: "Attach one immutable piece of manual-review evidence to a pair under review."
    roles: [IdentityAnalyst]
    input:
      - evidence_type
      - outcome
      - weight_points
      - note?
    output: ReviewEvidence
    side_effects:
      - "weight_points is stored verbatim as supplied (0.00-10.00); its SIGN is not stored — the sign comes from outcome inside calculations.pair_triage_effective_score."
      - "submitted_by_user_id set from the X-User-ID header."
      - "The parent pair's evidence_points, evidence_adjustment, effective_score and priority_band are recomputed; pair.version += 1."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PAIR_NOT_FOUND, ERR_RECORD_UNDER_FRAUD_HOLD, ERR_PAIR_INVALID_STATE]

  - method: GET
    path: "/mpi/candidate-pairs/{id}/evidence"
    purpose: "List a pair's review evidence (reverse reachability for ReviewEvidence.pair_id)."
    roles: [SiteRegistrar, IdentityAnalyst, IdentityStewardApprover, PrivacyOfficer, MpiAdmin]
    input:
      - limit?
      - offset?
    output: ReviewEvidence[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PAIR_NOT_FOUND]

  - method: POST
    path: "/mpi/candidate-pairs/{id}/recommend"
    purpose: "Analyst records a MERGE or DISTINCT recommendation, which requires at least MIN_EVIDENCE_COUNT evidence rows."
    roles: [IdentityAnalyst]
    input:
      - recommendation
    output: DuplicateCandidatePair
    side_effects:
      - "queue_state UNDER_REVIEW -> RECOMMENDED_MERGE or RECOMMENDED_DISTINCT according to recommendation."
      - "recommended_by_user_id set from X-User-ID (the anchor for the segregation-of-duties check on approval)."
      - "version += 1."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PAIR_NOT_FOUND, ERR_RECORD_UNDER_FRAUD_HOLD, ERR_PAIR_INVALID_STATE, ERR_INSUFFICIENT_REVIEW_EVIDENCE]

  - method: POST
    path: "/mpi/candidate-pairs/{id}/return-to-review"
    purpose: "Approver rejects a recommendation and sends the pair back for more evidence (the queue cycle)."
    roles: [IdentityStewardApprover]
    input:
      - triage_note?
    output: DuplicateCandidatePair
    side_effects:
      - "queue_state RECOMMENDED_MERGE or RECOMMENDED_DISTINCT -> UNDER_REVIEW."
      - "recommendation and recommended_by_user_id are cleared to null, which releases the segregation-of-duties lock."
      - "version += 1."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PAIR_NOT_FOUND, ERR_PAIR_INVALID_STATE]

  - method: POST
    path: "/mpi/candidate-pairs/{id}/resolve-distinct"
    purpose: "Approver confirms the two records are genuinely different people, closing the pair without a merge."
    roles: [IdentityStewardApprover]
    input:
      - resolution_note?
    output: DuplicateCandidatePair
    side_effects:
      - "queue_state RECOMMENDED_DISTINCT -> RESOLVED_DISTINCT (terminal); approved_by_user_id set from X-User-ID; version += 1."
      - "Neither record's identity_state changes; the pair stops suppressing a future pair on the same record set only because RESOLVED_* states are excluded from the ERR_PAIR_ALREADY_EXISTS check."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PAIR_NOT_FOUND, ERR_PAIR_INVALID_STATE, ERR_SEGREGATION_OF_DUTIES]

  # --- merge / unmerge -----------------------------------------------------
  - method: POST
    path: "/mpi/merge-operations"
    purpose: "Approve a merge: subsume one record into the survivor, move clinical elements, and fan out propagation tasks."
    roles: [IdentityStewardApprover]
    input:
      - pair_id
      - survivor_record_id
      - subsumed_record_id
      - rationale
    output: MergeOperation
    side_effects:
      - "pair.queue_state RECOMMENDED_MERGE -> RESOLVED_MERGED; pair.approved_by_user_id set; pair.version += 1."
      - "subsumed.identity_state ACTIVE -> MERGED_SUBSUMED; subsumed.survivor_record_id = survivor.id; subsumed.clinical_element_count = 0."
      - "survivor.clinical_element_count += moved_clinical_element_count per calculations.merge_element_transfer; survivor.subsumed_member_count recomputed."
      - "subsumed_prior_enterprise_id records the subsumed record's enterprise_id before the merge (the only way unmerge can restore it)."
      - "Transitive cascade: every record whose survivor_record_id pointed at the subsumed record is re-pointed to the survivor; recompressed_record_mrns lists their mrns in created_at ASC order."
      - "Each member site's active_record_count is recomputed (the subsumed record leaves the ACTIVE population)."
      - "One PropagationTask (operation_kind MERGE) is created per ACTIVE DownstreamSystem, in system_code ASC order; propagation_task_count records how many. A task for a system with ack_required == true is minted QUEUED; a task for a system with ack_required == false is minted directly in ACKED and never enters QUEUED."
      - "state is COMPLETED when propagation_task_count == 0 or when no created task belongs to an ack_required system, otherwise PENDING_PROPAGATION."
      - "When state becomes COMPLETED in this request, completed_at is set and reversal_deadline_at = completed_at + REVERSAL_WINDOW_DAYS days."
      - "When moved_clinical_element_count > CONTAMINATION_REVIEW_ELEMENT_THRESHOLD, a ContaminationRemediation (source_type MERGE, state OPEN) is opened on the survivor and the survivor's integrity_state becomes REMEDIATION_PENDING."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_RECORD_NOT_FOUND, ERR_PAIR_NOT_FOUND, ERR_RECORD_UNDER_FRAUD_HOLD, ERR_RECORD_REMEDIATION_PENDING, ERR_RECORD_NOT_ACTIVE, ERR_PAIR_INVALID_STATE, ERR_SEGREGATION_OF_DUTIES, ERR_MERGE_SELF_REFERENCE, ERR_PAIR_RECORD_MISMATCH]

  - method: GET
    path: "/mpi/merge-operations/{id}"
    purpose: "Historical merge audit: read one merge with its element counts, recompression list and reversal deadline."
    roles: [SiteRegistrar, IdentityAnalyst, IdentityStewardApprover, PrivacyOfficer, MpiAdmin]
    input: []
    output: MergeOperation
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_MERGE_NOT_FOUND]

  - method: GET
    path: "/mpi/merge-operations"
    purpose: "Merge audit list. Reverse reachability for pair_id, survivor_record_id and subsumed_record_id."
    roles: [SiteRegistrar, IdentityAnalyst, IdentityStewardApprover, PrivacyOfficer, MpiAdmin]
    input:
      - pair_id?
      - survivor_record_id?
      - subsumed_record_id?
      - state?
      - limit?
      - offset?
    output: MergeOperation[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: POST
    path: "/mpi/merge-operations/{id}/unmerge"
    purpose: "Reverse a completed merge inside the reversal window, restoring both identities exactly."
    roles: [IdentityStewardApprover, MpiAdmin]
    input:
      - unmerge_reason
    output: MergeOperation
    side_effects:
      - "state COMPLETED -> UNMERGED (terminal); unmerged_at set to the logical clock; version += 1."
      - "subsumed.identity_state MERGED_SUBSUMED -> ACTIVE; survivor_record_id cleared; enterprise_id restored to subsumed_prior_enterprise_id."
      - "Exact mirror of calculations.merge_element_transfer: survivor.clinical_element_count -= moved_clinical_element_count and subsumed.clinical_element_count = moved_clinical_element_count, so the conservation invariant holds bit-for-bit."
      - "Every record listed in recompressed_record_mrns has its survivor_record_id re-pointed back to the subsumed record."
      - "Both sites' active_record_count and subsumed_member_count are recomputed."
      - "Every PropagationTask for this merge in state QUEUED or FAILED transitions to CANCELLED; one new PropagationTask (operation_kind UNMERGE) is created per ACTIVE DownstreamSystem under the same QUEUED / directly-ACKED rule as merge creation."
      - "Any ContaminationRemediation opened by this merge that is still OPEN is closed as CLOSED with a system closure_note, and the survivor's integrity_state is re-derived."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_MERGE_NOT_FOUND, ERR_MERGE_INVALID_STATE, ERR_PROPAGATION_IN_FLIGHT, ERR_REVERSAL_WINDOW_EXPIRED]

  # --- overlay correction --------------------------------------------------
  - method: POST
    path: "/mpi/overlay-corrections"
    purpose: |
      Open an overlay correction: an overlay is one patient's data written onto
      another patient's record, so correcting it is not a merge but a field-level
      restoration plus clinical-element extraction. Guarded by OCC on the record.
    roles: [IdentityAnalyst, IdentityStewardApprover]
    input:
      - record_id
      - overlay_type
      - corrected_field_snapshot
      - affected_clinical_element_count
      - encounter_from_date
      - encounter_to_date
      - expected_record_version
    output: OverlayCorrection
    side_effects:
      - "state initialised to DETECTED; created_by_user_id set from X-User-ID."
      - "prior_field_snapshot captures the record's current values for exactly the keys present in corrected_field_snapshot (the audit basis for reversal)."
      - "No demographic field on the PatientRecord is written yet — those change only on apply. The single record-level effect of this call is the CLEAR -> REMEDIATION_PENDING integrity re-derivation (the new OverlayCorrection is in DETECTED), which increments record.version by 1. The OCC check on expected_record_version is evaluated against the record version BEFORE that increment."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_RECORD_NOT_FOUND, ERR_STALE_RECORD_VERSION, ERR_RECORD_UNDER_FRAUD_HOLD, ERR_RECORD_NOT_ACTIVE]

  - method: GET
    path: "/mpi/overlay-corrections/{id}"
    purpose: "Read one overlay correction with both field snapshots."
    roles: [SiteRegistrar, IdentityAnalyst, IdentityStewardApprover, PrivacyOfficer, MpiAdmin]
    input: []
    output: OverlayCorrection
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_OVERLAY_NOT_FOUND]

  - method: GET
    path: "/mpi/overlay-corrections"
    purpose: "List overlay corrections (reverse reachability for OverlayCorrection.record_id)."
    roles: [SiteRegistrar, IdentityAnalyst, IdentityStewardApprover, PrivacyOfficer, MpiAdmin]
    input:
      - record_id?
      - state?
      - overlay_type?
      - limit?
      - offset?
    output: OverlayCorrection[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: POST
    path: "/mpi/overlay-corrections/{id}/apply"
    purpose: "Write the corrected field values onto the record and fan out correction propagation."
    roles: [IdentityStewardApprover]
    input: []
    output: OverlayCorrection
    side_effects:
      - "state DETECTED -> UNDER_CORRECTION; version += 1."
      - "Every key in corrected_field_snapshot is written onto the PatientRecord; record.version += 1. enterprise_id is NOT recomputed: mrn and site_id are outside the allowed corrected_field_snapshot key set, so the enterprise identity is stable across an overlay correction."
      - "One PropagationTask (operation_kind OVERLAY_CORRECTION) is created per ACTIVE DownstreamSystem, in system_code ASC order, under the same QUEUED / directly-ACKED rule as merge creation."
      - "When affected_clinical_element_count > CONTAMINATION_REVIEW_ELEMENT_THRESHOLD a ContaminationRemediation (source_type OVERLAY, state OPEN) is opened with element_count_subject = affected_clinical_element_count; the record's integrity_state is REMEDIATION_PENDING for the whole DETECTED/UNDER_CORRECTION span regardless."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_OVERLAY_NOT_FOUND, ERR_RECORD_UNDER_FRAUD_HOLD, ERR_OVERLAY_INVALID_STATE]

  - method: POST
    path: "/mpi/overlay-corrections/{id}/complete"
    purpose: "Close an overlay correction once its remediation has been resolved."
    roles: [IdentityStewardApprover]
    input:
      - closure_note
    output: OverlayCorrection
    side_effects:
      - "state UNDER_CORRECTION -> CORRECTED (terminal); version += 1."
      - "The record's integrity_state is re-derived, which returns it to CLEAR once no OPEN/QUARANTINED/REASSIGNED remediation remains."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_OVERLAY_NOT_FOUND, ERR_OVERLAY_INVALID_STATE]

  # --- clinical cross-contamination remediation ----------------------------
  - method: GET
    path: "/mpi/contamination-remediations/{id}"
    purpose: "Read one remediation with its three element counts."
    roles: [SiteRegistrar, IdentityAnalyst, IdentityStewardApprover, PrivacyOfficer, MpiAdmin]
    input: []
    output: ContaminationRemediation
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_REMEDIATION_NOT_FOUND]

  - method: GET
    path: "/mpi/contamination-remediations"
    purpose: "List remediations. Reverse reachability for merge_operation_id, overlay_correction_id and record_id."
    roles: [SiteRegistrar, IdentityAnalyst, IdentityStewardApprover, PrivacyOfficer, MpiAdmin]
    input:
      - merge_operation_id?
      - overlay_correction_id?
      - record_id?
      - state?
      - limit?
      - offset?
    output: ContaminationRemediation[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: POST
    path: "/mpi/contamination-remediations/{id}/quarantine"
    purpose: "Quarantine the clinical elements suspected of belonging to the wrong patient."
    roles: [IdentityAnalyst, PrivacyOfficer]
    input:
      - element_count_quarantined
    output: ContaminationRemediation
    side_effects:
      - "state OPEN -> QUARANTINED; version += 1."
      - "No PatientRecord field changes: quarantine only records the count. Elements physically leave the subject record on reassign, so the subject record's clinical_element_count and version are untouched here."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_REMEDIATION_NOT_FOUND, ERR_REMEDIATION_INVALID_STATE, ERR_REMEDIATION_COUNT_INVALID]

  - method: POST
    path: "/mpi/contamination-remediations/{id}/reassign"
    purpose: "Move quarantined elements to the patient they actually belong to."
    roles: [PrivacyOfficer]
    input:
      - target_record_id
      - element_count_reassigned
    output: ContaminationRemediation
    side_effects:
      - "state QUARANTINED -> REASSIGNED; version += 1; reassigned_to_record_mrn stores the target record's mrn as an audit copy."
      - "The target record's clinical_element_count += element_count_reassigned and the remediation record's clinical_element_count -= element_count_reassigned; both PatientRecord.version values += 1."
      - "Elements not reassigned (element_count_quarantined - element_count_reassigned) remain quarantined and are conserved by calculations.clinical_element_conservation."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_RECORD_NOT_FOUND, ERR_REMEDIATION_NOT_FOUND, ERR_RECORD_UNDER_FRAUD_HOLD, ERR_RECORD_NOT_ACTIVE, ERR_REMEDIATION_INVALID_STATE, ERR_REASSIGN_TARGET_INVALID, ERR_REMEDIATION_COUNT_INVALID]

  - method: POST
    path: "/mpi/contamination-remediations/{id}/close"
    purpose: "Close a remediation, releasing the subject record's REMEDIATION_PENDING hold."
    roles: [PrivacyOfficer]
    input:
      - closure_note
    output: ContaminationRemediation
    side_effects:
      - "state QUARANTINED or REASSIGNED -> CLOSED (terminal); version += 1."
      - "The subject record's integrity_state is re-derived per calculations.record_integrity_state_derivation."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_REMEDIATION_NOT_FOUND, ERR_REMEDIATION_INVALID_STATE]

  # --- downstream systems & propagation ------------------------------------
  - method: POST
    path: "/mpi/downstream-systems"
    purpose: "Register a downstream consumer of identity changes (EHR, lab, billing, HIE gateway)."
    roles: [MpiAdmin]
    input:
      - system_code
      - name
      - propagation_mode
      - ack_required
      - max_concurrent_dispatch
    output: DownstreamSystem
    side_effects:
      - "status initialised to ACTIVE; unacked_task_count initialised to 0."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: PATCH
    path: "/mpi/downstream-systems/{id}"
    purpose: "Pause/resume a downstream system or change its dispatch concurrency ceiling."
    roles: [MpiAdmin]
    input:
      - name?
      - status?
      - max_concurrent_dispatch?
    output: DownstreamSystem
    side_effects:
      - "version += 1. Lowering max_concurrent_dispatch does not retroactively invalidate already-SENT tasks; it only tightens the next dispatch_window_occupancy check."
      - "A PAUSED system receives no new tasks from later merges/overlays and cannot be sent to."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_DOWNSTREAM_SYSTEM_NOT_FOUND]

  - method: GET
    path: "/mpi/downstream-systems/{id}"
    purpose: "Read one downstream system including its computed unacked_task_count."
    roles: [SiteRegistrar, IdentityAnalyst, IdentityStewardApprover, PrivacyOfficer, MpiAdmin]
    input: []
    output: DownstreamSystem
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_DOWNSTREAM_SYSTEM_NOT_FOUND]

  - method: GET
    path: "/mpi/propagation-tasks/{id}"
    purpose: "Read one propagation task with its dispatch window and deadline."
    roles: [SiteRegistrar, IdentityAnalyst, IdentityStewardApprover, PrivacyOfficer, MpiAdmin]
    input: []
    output: PropagationTask
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_TASK_NOT_FOUND]

  - method: GET
    path: "/mpi/propagation-tasks"
    purpose: "List propagation tasks. Reverse reachability for merge_operation_id, overlay_correction_id and downstream_system_id."
    roles: [SiteRegistrar, IdentityAnalyst, IdentityStewardApprover, PrivacyOfficer, MpiAdmin]
    input:
      - merge_operation_id?
      - overlay_correction_id?
      - downstream_system_id?
      - state?
      - operation_kind?
      - limit?
      - offset?
    output: PropagationTask[]
    side_effects:
      - "Default ordering: created_at ASC, then id ASC only as a total-order stabiliser for identical timestamps (never as a business decision input)."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: POST
    path: "/mpi/propagation-tasks/{id}/send"
    purpose: "Dispatch a queued or previously failed task inside an explicit half-open dispatch window."
    roles: [MpiAdmin, IdentityAnalyst]
    input:
      - dispatch_window_start_at
      - dispatch_window_end_at
    output: PropagationTask
    side_effects:
      - "state QUEUED or FAILED -> SENT; attempt_count += 1; version += 1; the window fields are stored."
      - "The downstream system's unacked_task_count is recomputed."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_TASK_NOT_FOUND, ERR_TASK_INVALID_STATE, ERR_DOWNSTREAM_SYSTEM_PAUSED, ERR_PROPAGATION_WINDOW_EXPIRED, ERR_DISPATCH_CAPACITY_EXCEEDED]

  - method: POST
    path: "/mpi/propagation-tasks/{id}/ack"
    purpose: "Record the downstream acknowledgement, which can complete the parent merge."
    roles: [MpiAdmin]
    input: []
    output: PropagationTask
    side_effects:
      - "state SENT -> ACKED (terminal); version += 1; the system's unacked_task_count is recomputed."
      - "Bubble up: when the parent MergeOperation is PENDING_PROPAGATION and every one of its tasks belonging to an ack_required system is now ACKED (CANCELLED tasks ignored), the merge transitions to COMPLETED, completed_at is set to the logical clock, and reversal_deadline_at = completed_at + REVERSAL_WINDOW_DAYS days."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_TASK_NOT_FOUND, ERR_TASK_INVALID_STATE]

  - method: POST
    path: "/mpi/propagation-tasks/{id}/fail"
    purpose: "Record a downstream rejection so the task can be re-sent (the retry cycle)."
    roles: [MpiAdmin]
    input:
      - last_error_code
    output: PropagationTask
    side_effects:
      - "state SENT -> FAILED; version += 1; the dispatch window fields are cleared so the slot is released for other tasks."
      - "The parent merge stays PENDING_PROPAGATION; the system's unacked_task_count is recomputed."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_TASK_NOT_FOUND, ERR_TASK_INVALID_STATE]

  # --- identity fraud detection --------------------------------------------
  - method: POST
    path: "/mpi/fraud-investigations"
    purpose: "Open a manual identity-fraud investigation on a record showing conflicting biometrics or insurance."
    roles: [PrivacyOfficer]
    input:
      - record_id
      - pair_id?
      - trigger_kind
      - note?
    output: FraudInvestigation
    side_effects:
      - "state initialised to OPEN; opened_by set to OFFICER; opened_by_user_id set from X-User-ID."
      - "risk_score computed per calculations.fraud_risk_score."
      - "The record's integrity_state becomes FRAUD_SUSPECTED and its site's flagged_record_count is recomputed BEFORE risk_score is evaluated."
      - "Every DuplicateCandidatePair having this record as a member with queue_state IN {NEW, TRIAGED, UNDER_REVIEW, RECOMMENDED_MERGE, RECOMMENDED_DISTINCT} moves to ESCALATED_FRAUD (version += 1 each); on the two RECOMMENDED_* edges recommended_by_user_id and recommendation are cleared."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_RECORD_NOT_FOUND, ERR_PAIR_NOT_FOUND]

  - method: GET
    path: "/mpi/fraud-investigations/{id}"
    purpose: "Read one investigation with its computed risk_score."
    roles: [SiteRegistrar, IdentityAnalyst, IdentityStewardApprover, PrivacyOfficer, MpiAdmin]
    input: []
    output: FraudInvestigation
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVESTIGATION_NOT_FOUND]

  - method: GET
    path: "/mpi/fraud-investigations"
    purpose: "List investigations. Reverse reachability for record_id and pair_id."
    roles: [SiteRegistrar, IdentityAnalyst, IdentityStewardApprover, PrivacyOfficer, MpiAdmin]
    input:
      - record_id?
      - pair_id?
      - state?
      - trigger_kind?
      - limit?
      - offset?
    output: FraudInvestigation[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: POST
    path: "/mpi/fraud-investigations/{id}/substantiate"
    purpose: "Confirm the fraud finding, hardening the record's hold to FRAUD_CONFIRMED."
    roles: [PrivacyOfficer]
    input:
      - finding_note
    output: FraudInvestigation
    side_effects:
      - "state OPEN -> SUBSTANTIATED; version += 1."
      - "The record's integrity_state becomes FRAUD_CONFIRMED; the site's flagged_record_count is recomputed."
      - "Every DuplicateCandidatePair having this record as a member with queue_state IN {NEW, TRIAGED, UNDER_REVIEW, RECOMMENDED_MERGE, RECOMMENDED_DISTINCT} moves to ESCALATED_FRAUD (version += 1 each); on the two RECOMMENDED_* edges recommended_by_user_id and recommendation are cleared. RESOLVED_MERGED, RESOLVED_DISTINCT and already-ESCALATED_FRAUD pairs are untouched."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVESTIGATION_NOT_FOUND, ERR_INVESTIGATION_INVALID_STATE]

  - method: POST
    path: "/mpi/fraud-investigations/{id}/unsubstantiate"
    purpose: "Clear the record: the conflict was a data-entry artefact, not fraud."
    roles: [PrivacyOfficer]
    input:
      - finding_note
    output: FraudInvestigation
    side_effects:
      - "state OPEN -> UNSUBSTANTIATED (terminal); version += 1."
      - "The record's integrity_state is re-derived; it returns to CLEAR only when no other open investigation and no open remediation remain."
      - "Every pair with queue_state == ESCALATED_FRAUD having this investigation's record as a member returns to UNDER_REVIEW once that record's integrity_state re-derives to CLEAR (the cyclic queue re-entry path); version += 1."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVESTIGATION_NOT_FOUND, ERR_INVESTIGATION_INVALID_STATE]

  - method: POST
    path: "/mpi/fraud-investigations/{id}/refer"
    purpose: "Refer a substantiated case to law enforcement (terminal escalation)."
    roles: [PrivacyOfficer]
    input:
      - referral_reference
    output: FraudInvestigation
    side_effects:
      - "state SUBSTANTIATED -> REFERRED_LAW_ENFORCEMENT (terminal); version += 1."
      - "The record's integrity_state remains FRAUD_CONFIRMED — referral never releases the hold."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVESTIGATION_NOT_FOUND, ERR_INVESTIGATION_INVALID_STATE]

  # --- external identity matching for exchange participation ---------------
  - method: POST
    path: "/mpi/external-match-requests"
    purpose: "Submit a record's demographics to a health-information-exchange partner for external identity matching."
    roles: [IdentityAnalyst]
    input:
      - record_id
      - exchange_partner_code
      - consent_on_file
      - external_demographics
    output: ExternalMatchRequest
    side_effects:
      - "external_score computed with the TOLERANT variant of calculations.pair_match_score against external_demographics using the ACTIVE MatchRuleSet."
      - "state is MATCHED when external_score >= the active rule set's auto_link_threshold, otherwise NO_MATCH (branching fork resolved in the same request)."
      - "Terminal on creation: both MATCHED and NO_MATCH are terminal states, so no further transition endpoint exists for this entity."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_RECORD_NOT_FOUND, ERR_RECORD_UNDER_FRAUD_HOLD, ERR_RECORD_REMEDIATION_PENDING, ERR_EXCHANGE_CONSENT_MISSING, ERR_RECORD_NOT_ACTIVE]

  - method: GET
    path: "/mpi/external-match-requests/{id}"
    purpose: "Read one external match request and its score."
    roles: [SiteRegistrar, IdentityAnalyst, IdentityStewardApprover, PrivacyOfficer, MpiAdmin]
    input: []
    output: ExternalMatchRequest
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_RECORD_NOT_FOUND]

  - method: GET
    path: "/mpi/external-match-requests"
    purpose: "List external match requests (reverse reachability for ExternalMatchRequest.record_id)."
    roles: [SiteRegistrar, IdentityAnalyst, IdentityStewardApprover, PrivacyOfficer, MpiAdmin]
    input:
      - record_id?
      - state?
      - exchange_partner_code?
      - limit?
      - offset?
    output: ExternalMatchRequest[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  # --- duplicate rate metrics by registration site -------------------------
  - method: POST
    path: "/mpi/registration-sites/{id}/duplicate-metric-runs"
    purpose: "Compute a site's duplicate rate over a closed date window under one of the two attribution variants."
    roles: [MpiAdmin, IdentityAnalyst]
    input:
      - window_start_date
      - window_end_date
      - attribution_variant
    output: SiteDuplicateMetric
    side_effects:
      - "records_created, confirmed_duplicates and duplicate_rate_bps computed per calculations.site_duplicate_rate."
      - "sample_size_sufficient set to (records_created >= METRIC_MIN_SAMPLE_SIZE)."
      - "rule_set_version_label snapshots the currently ACTIVE rule set's version_label."
      - "Immutable once written (common_fields: false)."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_SITE_NOT_FOUND, ERR_METRIC_WINDOW_OVERLAP]

  - method: GET
    path: "/mpi/registration-sites/{id}/duplicate-metric-runs"
    purpose: "List a site's metric runs (reverse reachability for SiteDuplicateMetric.site_id)."
    roles: [SiteRegistrar, IdentityAnalyst, IdentityStewardApprover, PrivacyOfficer, MpiAdmin]
    input:
      - attribution_variant?
      - limit?
      - offset?
    output: SiteDuplicateMetric[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_SITE_NOT_FOUND]

# =============================================================================
# 1.6 Error Catalog (every code is reachable from at least one §1.4 row)
# =============================================================================
errors:

  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Missing or unrecognised authentication headers"
    triggered_by: "§1.4 priority 1 — X-User-ID or X-User-Role absent, or X-User-Role not one of the five declared roles"

  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message: "Role {role} may not perform this operation"
    triggered_by: "§1.4 priority 2 — role not in the endpoint's roles list"

  - error_id: ERR_SITE_SCOPE_VIOLATION
    http_status: 403
    message: "SiteRegistrar {user_id} may only act on its own registration site"
    triggered_by: "§1.4 priority 3 — SiteRegistrar X-User-ID does not equal the site in scope"

  - error_id: ERR_INVALID_REQUEST
