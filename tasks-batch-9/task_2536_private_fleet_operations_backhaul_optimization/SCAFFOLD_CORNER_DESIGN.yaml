        distinguishing_aspect: "DRAFT has exactly two outgoing triggers, plan and cancel; dispatch is not one of them, so a DRAFT trip that is fully staffed and stopped still answers 409 ERR_INVALID_STATE_TRANSITION rather than skipping the PLANNED step."
