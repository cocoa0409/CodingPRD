  - rule_id: compensating_invariant
    instances:
      - name: preempt_conserves_technician_active_assignment_count
        grounds:
          - state_machines.DispatchAssignment.EN_ROUTE_to_PREEMPTED
          - entities.FieldTechnician.fields.active_assignment_count
        distinguishing_aspect: |
          Conserved quantity: per-technician active_assignment_count. The
          preempt forward action (-1 on the source assignment) paired with its
          compensating auto-create (+1 on the target) leaves the count
          invariant — observable as count 1 before and 1 after the preempt.
        test_recipe:
          setup:
            - "T1; technician TECH1 on shift; incident A (P2) DISPATCHED with TECH1 EN_ROUTE (count == 1)"
            - "Incident B (P1) TRIAGED with no assignment"
