              as: BankExaminer
              captures: { ex_id: $.data.id }
            - call: "POST /cra/exam-cycles/${ex_id}/begin-data-collection"
              payload: {}
              as: BankExaminer
            - call: "POST /cra/exam-cycles/${ex_id}/begin-fieldwork"
              payload: {}
              as: BankExaminer
            - call: "POST /cra/exam-cycles/${ex_id}/assign-preliminary-rating"
