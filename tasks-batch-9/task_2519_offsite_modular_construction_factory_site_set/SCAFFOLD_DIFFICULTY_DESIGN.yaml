            - "at the half-open boundary: the 23:00 request succeeds, ${p3} == 'SLOTTED' and ${n3} == 570, because M-01's window ends AT 23:00 and therefore does not cover it (only M-02 does, so the count is 1)"
            - "GET /modular/factories/${fac} reports committed_line_minutes == 1680 (540 + 570 + 570); the rejected 18:00 attempt added nothing"
            - "GET /modular/modules?production_status=SLOTTED returns all three modules"

      - name: project_crane_window_closed_interval_with_rigging_buffer_and_exclusive_capacity
        grounds:
          - validations[priority=69]
          - entities.Project.fields.crane_rigging_buffer_minutes
          - entities.ModuleUnit.fields.pick_window_start
          - endpoints[POST /modular/modules/{moduleId}/schedule-pick]
        resource_entity: Project (site crane)
        interval_semantics: closed [pick_window_start - 45 min, pick_window_end + 45 min], exclusive (capacity 1), touching endpoints count as overlap
        distinguishing_aspect: |
          A different resource (one crane per PROJECT, not a plant-wide counting line) with the
          opposite interval convention: the compared intervals are CLOSED and symmetrically expanded
          by the 45-minute rigging buffer, and capacity is 1, so a single touching endpoint is
          already a conflict. The pair 11:15 (expanded start 10:30, touching M-01's expanded end
          10:30) versus 11:30 (expanded start 10:45) isolates exactly that convention — under
          half-open semantics the 11:15 pick would be admitted.
        test_recipe:
          setup:
            - "clock at 2026-09-01T08:00:00Z; crane_rigging_buffer_minutes 45 (project default)"
            - "modules M-01 and M-02 both AT_FACTORY, each 76_600 lb, picked at radius 90 with 5_000 lb of rigging"
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
