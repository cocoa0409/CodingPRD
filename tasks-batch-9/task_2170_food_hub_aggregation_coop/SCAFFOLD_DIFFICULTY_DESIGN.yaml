  instances:
  - name: dock_slot_aggregate_capacity_with_sanitation_buffer_geometry
    grounds:
    - calculations.dock_slot_occupancy
    - validations[priority=20]
    - validations[priority=21]
    - errors[ERR_DOCK_CAPACITY_EXCEEDED]
    - errors[ERR_SANITATION_BUFFER_VIOLATION]
