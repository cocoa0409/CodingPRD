  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: capacity_bucket_full_at_inclusive_threshold
        grounds:
          - calculations.capacity_bucket_load
          - validations[priority=22]
          - endpoints["POST /orders"]
        distinguishing_aspect: |
          Metric is a numeric admission threshold on POST /orders where the
          comparison is inclusive (bucket_load >= prep_capacity_per_bucket
          rejects): load 1 of 2 is admitted, load 2 of 2 rejects, and the same
          request succeeds once the clock rolls into the next 15-minute bucket
          (bucket_index 44 -> 45).
        test_recipe:
          setup:
            - "Clock 2026-08-03T16:00:00Z, local minute 660 at offset -300, so bucket_index is 44"
            - "Store S1 published with prep_capacity_per_bucket 2"
            - "Two MARKETMAX orders already created in bucket 44, both PENDING and PREPARING, so bucket_load is exactly 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
