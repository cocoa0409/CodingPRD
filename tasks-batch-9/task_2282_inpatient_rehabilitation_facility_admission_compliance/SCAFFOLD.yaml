    roles: [HimCoder]
    code: 201
    input: [admission_id, assessment_type, coder_clinician_id]
    output: PatientAssessmentInstrument
    side_effects: ["status = DRAFT; assessment_reference_date, completion_deadline_at and transmission_deadline_at computed"]

  - method: GET
    path: "/assessments/{assessmentId}"
    description: "Read one assessment with its deadlines and lateness"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: []
    output: PatientAssessmentInstrument
    side_effects: []

  - method: GET
    path: "/assessments"
    description: "List assessments, filterable by admission, coder, transmitter, type and status"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: ["admission_id?", "coder_clinician_id?", "transmitted_by_clinician_id?", "assessment_type?", "status?", "limit?", "offset?"]
    output: PatientAssessmentInstrument[]
    side_effects: []

  - method: POST
    path: "/assessments/{assessmentId}/complete"
    description: "Complete the assessment item set"
    roles: [HimCoder]
    code: 200
    input: [item_set_complete]
    output: PatientAssessmentInstrument
    side_effects: ["DRAFT -> COMPLETED; completed_at set; completion_late computed"]

  - method: POST
    path: "/assessments/{assessmentId}/transmit"
    description: "Transmit the assessment; timeliness is decided by the clock against transmission_deadline_at"
    roles: [HimCoder]
    code: 200
    input: []
    output: PatientAssessmentInstrument
    side_effects: ["COMPLETED -> TRANSMITTED or LATE_TRANSMITTED; late_days and transmitted_by_clinician_id set; Admission.documentation_status POC_SIGNED -> PAI_TRANSMITTED for DISCHARGE assessments"]

  # ----------------------------------------------------- ComplianceReview ----
  - method: POST
    path: "/compliance-reviews"
    description: "Open a compliance review for a facility period under a chosen method (OCC on Facility.version)"
    roles: [ComplianceOfficer]
    code: 201
    input: [facility_id, expected_facility_version, method, period_start, period_end]
    output: ComplianceReview
    side_effects: ["status = DRAFT; created_by_user_id = X-User-ID; increments Facility.version by 1"]

  - method: GET
    path: "/compliance-reviews/{reviewId}"
    description: "Read one compliance review with its cohort counts, percentage and outcome"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: []
    output: ComplianceReview
    side_effects: []

  - method: GET
    path: "/compliance-reviews"
    description: "List compliance reviews, filterable by facility, method and status"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: ["facility_id?", "method?", "status?", "limit?", "offset?"]
    output: ComplianceReview[]
    side_effects: []

  - method: POST
    path: "/compliance-reviews/{reviewId}/compute"
    description: "Compute the compliance percentage for the review's cohort under its method"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceReview
    side_effects: ["DRAFT or STALE -> COMPUTED; total_cases, qualifying_cases, compliance_pct, outcome and computed_at set"]

  - method: POST
    path: "/compliance-reviews/{reviewId}/certify"
    description: "Certify a computed review; a FAIL outcome freezes admissions at the facility"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceReview
    side_effects:
      - "COMPUTED -> CERTIFIED; certified_at and certified_by_user_id set"
      - "Facility.certified_compliance_pct = compliance_pct; posture re-derived; SUBMITTED screenings frozen when posture becomes ADMISSION_FREEZE; Facility.version += 1"

  # -------------------------------------------------------- QrpAssessment ----
  - method: POST
    path: "/qrp-assessments"
    description: "Open a quality reporting program assessment for a facility reporting period"
    roles: [ComplianceOfficer]
    code: 201
    input: [facility_id, fiscal_year, reporting_period_start, reporting_period_end]
    output: QrpAssessment
    side_effects: ["status = DRAFT; cohort_count, timely_count, data_completeness_pct and penalty_pct computed from current data"]

  - method: GET
    path: "/qrp-assessments/{qrpId}"
    description: "Read one QRP assessment with its completeness percentage and penalty"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: []
    output: QrpAssessment
    side_effects: []

  - method: GET
    path: "/qrp-assessments"
    description: "List QRP assessments, filterable by facility, fiscal year and status"
    roles: [ComplianceOfficer, RehabPhysician, NurseCaseManager, TherapyLead, HimCoder]
    code: 200
    input: ["facility_id?", "fiscal_year?", "status?", "limit?", "offset?"]
    output: QrpAssessment[]
    side_effects: []

  - method: POST
    path: "/qrp-assessments/{qrpId}/finalize"
    description: "Finalize the QRP assessment and put its payment reduction into force for future admissions"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: QrpAssessment
    side_effects:
      - "DRAFT -> FINALIZED; metrics recomputed; finalized_at set"
      - "Facility.active_qrp_penalty_pct = penalty_pct; Facility.qrp_penalty_effective_at = finalized_at; Facility.version += 1"

  # --------------------------------------------------------- test driving ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time. Advancing the clock expires stale screenings past their 48-hour window and marks assessments MISSED once the clock reaches transmission_deadline_at + 30 days."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, expired_screening_count: integer, missed_assessment_count: integer }"
    side_effects:
      - "Screenings in DRAFT, SUBMITTED, CHANGES_REQUESTED or ON_HOLD whose conducted_at + 48h <= new clock -> EXPIRED"
      - "Assessments in DRAFT or COMPLETED whose transmission_deadline_at + 30 days <= new clock -> MISSED"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID missing, or the role is not one of the five declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "The authenticated role is not listed for the endpoint in §1.7" }
  - { id: ERR_ROLE_CREDENTIAL_MISMATCH, http: 403, condition: "X-User-ID resolves to a Clinician whose credential does not match the asserted entity_backed role" }
  - { id: ERR_ACTING_CLINICIAN_INACTIVE, http: 403, condition: "The acting Clinician has status INACTIVE" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Screening reviewer equals its screener, assessment transmitter equals its coder, or review certifier equals the officer who opened it" }
  - { id: ERR_FACILITY_ADMISSION_FROZEN, http: 403, condition: "Admission attempted while Facility.posture == ADMISSION_FREEZE" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing or malformed body field, invalid enum, bad timestamp or date, pagination out of range, discharged_at in the future or before admitted_at" }
  - { id: ERR_INVALID_SESSION_INTERVAL, http: 400, condition: "end_at is not strictly after start_at, or the interval is shorter than one minute" }
  - { id: ERR_GROUP_SIZE_INVALID, http: 400, condition: "group_size does not match the modality (1 for INDIVIDUAL, 2 for CONCURRENT, 3–6 for GROUP)" }
  - { id: ERR_INVALID_PERIOD, http: 400, condition: "period_end precedes period_start on a facility, compliance review or QRP assessment" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "An id referenced in the path or body does not exist" }
  - { id: ERR_SCREENING_PATIENT_MISMATCH, http: 409, condition: "The referenced screening belongs to a different patient than the admission, or a predecessor admission belongs to a different patient" }
  - { id: ERR_WEEK_ADMISSION_MISMATCH, http: 409, condition: "The referenced therapy week belongs to a different admission" }
  - { id: ERR_CROSS_FACILITY_MISMATCH, http: 409, condition: "A referenced clinician or patient belongs to a different facility than the target resource" }
  - { id: ERR_STALE_ADMISSION_VERSION, http: 412, condition: "expected_admission_version does not equal Admission.version" }
  - { id: ERR_STALE_FACILITY_VERSION, http: 412, condition: "expected_facility_version does not equal Facility.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The requested transition is not declared from the resource's current state" }
  - { id: ERR_ADMISSION_NOT_ACTIVE, http: 409, condition: "Therapy or plan documentation attempted while the admission is not ADMITTED" }
  - { id: ERR_ADMISSION_NOT_DISCHARGED, http: 409, condition: "A DISCHARGE assessment was opened, or an assessment transmitted, while the admission is not DISCHARGED" }
  - { id: ERR_EXCEPTION_NOT_ALLOWED, http: 409, condition: "A three-hour-rule exception was requested for a week that is not NOT_MET" }
  - { id: ERR_NOT_INTERRUPTED_STAY, http: 409, condition: "Rescind-interruption called on an admission whose interrupted_stay_flag is false" }
  - { id: ERR_SCREENING_NOT_CONCURRED, http: 422, condition: "The screening is not PHYSICIAN_CONCURRED, or its reviewed_at is later than admitted_at" }
  - { id: ERR_SCREENING_WINDOW_EXPIRED, http: 422, condition: "More than 48 hours elapsed between screening.conducted_at and admitted_at" }
  - { id: ERR_SCREENING_DOCUMENTATION_INCOMPLETE, http: 422, condition: "A screening was submitted with any of the four required documentation flags false" }
  - { id: ERR_SCREENER_CREDENTIAL_INVALID, http: 422, condition: "conducted_by_clinician_id has a credential other than NURSE or REHAB_PHYSICIAN" }
  - { id: ERR_PLAN_OF_CARE_MISSING, http: 422, condition: "No ACTIVE overall plan of care exists for the admission" }
  - { id: ERR_DISCIPLINE_NOT_IN_PLAN, http: 422, condition: "The session discipline is absent from the ACTIVE plan's disciplines" }
  - { id: ERR_CLINICIAN_DISCIPLINE_MISMATCH, http: 422, condition: "The treating clinician's credential does not match the session discipline" }
  - { id: ERR_CONFERENCE_LEAD_NOT_PHYSICIAN, http: 422, condition: "led_by_clinician_id does not have credential REHAB_PHYSICIAN" }
  - { id: ERR_CONFERENCE_PARTICIPANTS_INCOMPLETE, http: 422, condition: "Conference participants lack a nurse or a therapist for a plan discipline" }
  - { id: ERR_CONFERENCE_OUTSIDE_WEEK, http: 409, condition: "date(held_at) falls outside the therapy week window" }
  - { id: ERR_CONFERENCE_ALREADY_RECORDED, http: 409, condition: "A RECORDED conference already exists for the therapy week" }
  - { id: ERR_PAI_ITEM_SET_INCOMPLETE, http: 422, condition: "Assessment completion attempted with item_set_complete false" }
  - { id: ERR_ASSESSMENT_TYPE_DUPLICATE, http: 409, condition: "An assessment of the same type already exists for the admission and is not MISSED" }
  - { id: ERR_CLINICIAN_SCHEDULE_CONFLICT, http: 409, condition: "The new session's half-open interval intersects another SCHEDULED or DELIVERED session of the same clinician" }
  - { id: ERR_PATIENT_REST_BUFFER_VIOLATION, http: 409, condition: "The new session is separated from another session of the same admission by less than 10 minutes" }
  - { id: ERR_NO_OPEN_THERAPY_WEEK, http: 422, condition: "No therapy week of the admission contains the session's start date" }
  - { id: ERR_THERAPY_WEEK_OVERLAP, http: 409, condition: "The new 7-day window overlaps an existing week window of the admission" }
  - { id: ERR_WEEK_BEFORE_ADMISSION, http: 422, condition: "week_start_date precedes the admission date" }
  - { id: ERR_WEEK_INDEX_DUPLICATE, http: 409, condition: "week_index already exists for the admission" }
  - { id: ERR_DAILY_THERAPY_CAP_EXCEEDED, http: 409, condition: "Credited minutes for the admission on that calendar date would exceed Facility.daily_therapy_cap_minutes" }
  - { id: ERR_MRN_DUPLICATE, http: 409, condition: "mrn already exists at the facility, or npi already exists across clinicians" }
  - { id: ERR_CCN_DUPLICATE, http: 409, condition: "cms_ccn already exists across facilities" }
  - { id: ERR_INTERRUPTION_WINDOW_EXCEEDED, http: 422, condition: "A predecessor was named but it is not DISCHARGED or the gap exceeds 3 calendar days" }
  - { id: ERR_PREDECESSOR_ALREADY_CONTINUED, http: 409, condition: "The named predecessor already has a continuation admission" }
  - { id: ERR_INTERRUPTED_STAY_LINK_REQUIRED, http: 422, condition: "A prior discharge of the same patient falls within 3 calendar days and no predecessor_admission_id was supplied" }
  - { id: ERR_EMPTY_COMPLIANCE_COHORT, http: 422, condition: "The review period contains no eligible discharged admissions" }
  - { id: ERR_COHORT_PAYMENT_UNSETTLED, http: 422, condition: "A cohort member has payment_status REOPENED at certification time" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ComplianceOfficer
    description: "Facility compliance and reimbursement operator: registers facilities and clinicians, opens and certifies compliance reviews, scores the quality reporting program, corrects interrupted-stay linkage, and controls the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /facilities — register a facility"
      - "POST /clinicians — register a clinician"
      - "POST /clinicians/{clinicianId}/deactivate — deactivate a clinician"
      - "POST /admissions/{admissionId}/rescind-interruption — unlink an interrupted-stay continuation"
      - "POST /compliance-reviews — open a compliance review"
      - "POST /compliance-reviews/{reviewId}/compute — compute the compliance percentage"
      - "POST /compliance-reviews/{reviewId}/certify — certify a computed review (certifier must differ from opener)"
      - "POST /qrp-assessments — open a QRP assessment"
      - "POST /qrp-assessments/{qrpId}/finalize — finalize and enforce the QRP penalty"
      - "POST /_clock/set_current_utc — set the logical clock"
    shared_operations:
      - "All GET endpoints"

  - name: NurseCaseManager
    description: "Nurse case manager: owns patient records, preadmission screenings, admission and discharge events, and weekly team conference records."
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /patients — register a patient"
      - "POST /screenings — open a preadmission screening"
      - "PATCH /screenings/{screeningId} — revise a screening"
      - "POST /screenings/{screeningId}/submit — submit a screening for review"
      - "POST /admissions — open a pending admission"
      - "POST /admissions/{admissionId}/admit — admit the patient"
      - "POST /admissions/{admissionId}/discharge — discharge the patient"
      - "POST /team-conferences — record a weekly team conference"
    shared_operations:
      - "All GET endpoints"

  - name: RehabPhysician
    description: "Rehabilitation physician: reviews preadmission screenings, denies unsuitable admissions, signs the overall plan of care, and grants documented three-hour-rule exceptions."
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /screenings/{screeningId}/review — concur or request changes"
      - "POST /admissions/{admissionId}/deny — deny a pending admission"
      - "POST /plans-of-care — sign an overall plan of care"
      - "POST /therapy-weeks/{weekId}/exception — grant a three-hour-rule exception"
    shared_operations:
      - "All GET endpoints"

  - name: TherapyLead
    description: "Therapy lead: opens therapy measurement weeks, schedules and documents therapy sessions, voids erroneous sessions, and evaluates the three-hour rule."
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /therapy-weeks — open a therapy week"
      - "POST /therapy-weeks/{weekId}/evaluate — evaluate the three-hour rule"
      - "POST /therapy-sessions — schedule a session"
      - "POST /therapy-sessions/{sessionId}/deliver — document delivery"
      - "POST /therapy-sessions/{sessionId}/void — void a session"
    shared_operations:
      - "All GET endpoints"

  - name: HimCoder
    description: "Health information management coder: opens, completes and transmits IRF patient assessment instruments; the transmitting coder must differ from the completing coder."
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /assessments — open an assessment"
      - "POST /assessments/{assessmentId}/complete — complete the item set"
      - "POST /assessments/{assessmentId}/transmit — transmit the assessment"
    shared_operations:
      - "All GET endpoints"
