# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "Required auth headers missing or malformed" }
  - { id: ERR_UNAUTHORIZED_ROLE,                     http: 403, condition: "Role does not have permission for this endpoint" }
  - { id: ERR_NOT_FOUND,                             http: 404, condition: "Path id does not resolve to an existing entity" }
  - { id: ERR_INVALID_REQUEST,                       http: 400, condition: "Required input field missing or wrong type" }
  - { id: ERR_INVALID_STATE,                         http: 409, condition: "Entity is in a state that forbids the requested transition" }
  - { id: ERR_STALE_VERSION,                         http: 412, condition: "OCC: expected_*_version does not match current entity version" }
  - { id: ERR_DEADLINE_PASSED,                       http: 409, condition: "Logical clock is past the relevant deadline (drop, transfer, tour window)" }
  - { id: ERR_PREREQUISITE_NOT_MET,                  http: 422, condition: "Student's satisfied codes do not cover the target level's prerequisite closure" }
  - { id: ERR_PREREQUISITE_CYCLE,                    http: 422, condition: "CurriculumLevel.requires_level_code introduces a cycle" }
  - { id: ERR_PLACEMENT_NOT_ALLOWED,                 http: 422, condition: "Target level does not allow placement bypass" }
  - { id: ERR_PORTFOLIO_SCORE_TOO_LOW,               http: 422, condition: "PORTFOLIO_REVIEW variant requires portfolio_score >= 70" }
  - { id: ERR_UNRECOGNIZED_INSTITUTION,              http: 422, condition: "AUDITION_BYPASS variant requires prior_institution in RECOGNIZED_INSTITUTIONS" }
  - { id: ERR_INSTRUCTOR_UNAVAILABLE,                http: 422, condition: "Instructor not certified for track or would exceed max_weekly_hours" }
  - { id: ERR_SECTION_UNSTAFFED,                     http: 409, condition: "Term cannot open enrollment while a non-CANCELLED section has no instructor" }
  - { id: ERR_SECTION_FULL,                          http: 409, condition: "Section has no vacant seats and waitlist is not being accepted for this operation" }
  - { id: ERR_VENUE_SLOT_CONFLICT,                   http: 409, condition: "Venue slot overlaps another RESERVED/BOOKED slot or violates turnover buffer" }
  - { id: ERR_VENUE_CAPACITY_EXCEEDED,               http: 422, condition: "Performer count exceeds venue capacity" }
  - { id: ERR_SOURCE_POLICY_VIOLATION,               http: 422, condition: "Audition source does not satisfy EnsembleCast.source_policy" }
  - { id: ERR_NO_ELIGIBLE_AUDITIONS,                 http: 422, condition: "Selector pool is empty after applying source policy" }
  - { id: ERR_CAST_INCOMPLETE,                       http: 409, condition: "lock-cast requires principal_ids==cast_size and understudy_ids==understudy_slots" }
  - { id: ERR_UNDERSTUDY_INELIGIBLE,                 http: 422, condition: "Understudy fails coverage predicate (alumni or CREDITED in track)" }
  - { id: ERR_TOUR_WINDOW_INVALID,                   http: 422, condition: "tour_start_utc >= tour_end_utc or tour overlaps cast's other tours" }
  - { id: ERR_SCHOLARSHIP_EXHAUSTED,                 http: 422, condition: "Scholarship disbursement would exceed remaining award balance" }
  - { id: ERR_SCHOLARSHIP_NOT_REVOCABLE,             http: 409, condition: "Award has non-zero disbursed_cents" }
  - { id: ERR_INVOICE_OVERPAYMENT,                   http: 422, condition: "Payment would exceed amount_due_cents" }
  - { id: ERR_INVOICE_ALREADY_SETTLED,               http: 409, condition: "Invoice is in a terminal state (PAID, REFUNDED, TRANSFERRED, VOID)" }
  - { id: ERR_GRADES_INCOMPLETE,                     http: 422, condition: "grade_by_enrollment does not cover every performer_enrollment_ids entry" }
  - { id: ERR_COHORT_OVER_CAPACITY,                  http: 422, condition: "admit would exceed cohort_size" }
  - { id: ERR_MIN_TRACK_LEVEL_NOT_MET,               http: 422, condition: "Student has not CREDITED the cohort's min_track_level_code" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramDirector
    description: "Runs the training center — owns terms, sections, levels, cohorts, showcases"
    identity: opaque
    exclusive_operations:
      - "POST /curriculum-levels"
      - "POST /terms and all /terms/{id}/* transitions"
      - "POST /instructors, GET /instructors"
      - "POST /sections, PATCH /sections/{id}, POST /sections/{id}/cancel"
      - "POST /venue-slots"
      - "POST /showcases and all /showcases/{id}/* transitions"
      - "POST /cohort-programs and all /cohort-programs/{id}/* transitions"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET on all resources"

  - name: Registrar
    description: "Back-office staff — registers students, manages enrollments"
    identity: opaque
    exclusive_operations:
      - "POST /students"
    shared_operations:
      - "POST /enrollments, POST /enrollments/{id}/confirm, POST /enrollments/{id}/drop, POST /enrollments/{id}/transfer"
      - "POST /tuition-invoices"
      - "GET on most resources"

  - name: PlacementOfficer
    description: "Reviews advanced-standing petitions"
    identity: opaque
    exclusive_operations:
      - "POST /placement-evaluations/{id}/begin-review"
      - "POST /placement-evaluations/{id}/grant"
      - "POST /placement-evaluations/{id}/deny"
    shared_operations:
      - "POST /placement-evaluations (on behalf of a student)"
      - "GET /placement-evaluations*"

  - name: CastingDirector
    description: "Owns auditions, ensemble casting, touring"
    identity: opaque
    exclusive_operations:
      - "POST /auditions and all /auditions/{id}/* transitions"
      - "POST /ensemble-casts and all /ensemble-casts/{id}/* transitions"
      - "POST /touring-assignments and /touring-assignments/{id}/replace"
    shared_operations:
      - "GET on auditions, casts, touring assignments, students"

  - name: FinanceOfficer
    description: "Owns scholarships and invoices"
    identity: opaque
    exclusive_operations:
      - "POST /scholarships/{id}/award, /deny, /revoke"
    shared_operations:
      - "POST /scholarships, POST /tuition-invoices, POST /tuition-invoices/{id}/pay"
      - "GET /scholarships*, GET /tuition-invoices*"

  - name: Student
    description: "The end user — enrolls, drops, transfers, petitions placement, accepts touring"
    identity: entity_backed:Student
    exclusive_operations:
      - "POST /placement-evaluations/{id}/appeal (must own the evaluation)"
      - "POST /touring-assignments/{id}/accept, /decline (must be the principal)"
    shared_operations:
      - "POST /enrollments, /confirm, /drop, /transfer (must own the enrollment)"
      - "POST /placement-evaluations (must own student_id)"
      - "POST /scholarships (must own student_id)"
      - "POST /tuition-invoices/{id}/pay (must own the invoice)"
      - "GET on own resources"
