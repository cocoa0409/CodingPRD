              as: ReporterAgent
              as_user_id: "${ent_a}"
            - call: "POST /submissions/${sub_po}/submit"
              payload: {}
              as: ReporterAgent
              as_user_id: "${ent_a}"
            - call: "POST /submissions/${sub_po}/review"
              payload: { decision: "ACCEPT", review_note: "packer-owned transfer only" }
              as: MarketAnalyst
            - call: "POST /market-reports"
              payload: { reporting_window_id: "${win_1}", category: "LIVE_STEER_HEIFER", weighting_variant: "HEAD_WEIGHTED", purchase_type_filter: "ALL_PRICED" }
