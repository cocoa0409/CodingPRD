              payload: { name: "Corner Network", fee_model: "PERCENT_OF_COMMISSION", fee_bps: 0, flat_fee_cents: 0, statement_currency: "USD" }
              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { net_id: "$.data.id" }
            - call: "POST /affiliates"
              payload: { legal_name: "Beacon Content LLC", contact_email: "beacon@example.com", partner_type: "CONTENT", network_id: "${net_id}", payout_currency: "USD" }
              as: Anonymous
              captures: { aff_a: "$.data.id" }
            - call: "POST /affiliates"
              payload: { legal_name: "SaverFeed Coupons LLC", contact_email: "saver@example.com", partner_type: "COUPON", network_id: "${net_id}", payout_currency: "USD" }
              as: Anonymous
              captures: { aff_b: "$.data.id" }
          trigger:
            - call: "GET /affiliates"
              payload: { limit: 0, offset: 0 }
              as: ProgramAdmin
