        distinguishing_aspect: "Termination is a recorded two-step: terminate is not reachable straight from FILED, terminated_date is stamped from the clock at the moment of recording rather than from filed_date or from the request step, and — unlike record-subordination — it carries no two-person control, so the same TitleAgent legitimately does both halves. A termination nobody's transfer asked for must also leave requested_by_transfer_case_id null."
