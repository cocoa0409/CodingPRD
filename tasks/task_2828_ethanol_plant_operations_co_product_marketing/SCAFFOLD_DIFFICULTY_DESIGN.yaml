  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: fermentation_health_watch_intervention_cycle_third_intervention_blocked
        grounds:
          - state_machines.FermentationBatch.status.HEALTH_WATCH_to_FERMENTING
          - state_machines.FermentationBatch.status.FERMENTING_to_HEALTH_WATCH
          - calculations.fermentation_health_index
          - validations[priority=52]
          - errors[ERR_INTERVENTION_LIMIT_REACHED]
          - entities.FermentationBatch.fields.intervention_count
        distinguishing_aspect: |
          FermentationBatch.status is a genuine cycle — HEALTH_WATCH returns to
          FERMENTING only through /intervene, and a fresh bad reading pushes it
          back — and the loop is bounded by intervention_count, so the third
          /intervene on the same batch returns ERR_INTERVENTION_LIMIT_REACHED
          while intervention_count stays at 2.
        test_recipe:
          setup:
            - "Plant exists with base_grind_cap_bushels 120000 and coverage_floor_bushels 5000."
            - "Tank T-101 is an empty ETHANOL_200_PROOF tank; contract C-1 is PRICED and one 940.00-bushel delivery is SETTLED."
            - "Batch FB-3001 is charged with 900.00 bushels at charge test weight 54.0."
            - "Two full health-watch / intervene cycles have already run on identical bad readings (lactic 1237, acetic 552, 36.9 C -> reading_score 41.89), so intervention_count is 2 and the batch is back in HEALTH_WATCH on a third bad reading."
          setup_api_calls:
            - call: "POST /ethanol-ops/plants"
              payload: { name: "Prairie Gold Ethanol", nameplate_capacity_gallons: 120000000, base_grind_cap_bushels: 120000, coverage_floor_bushels: 5000, baseline_ci_g_per_mj: 60.0, rin_generation_enabled: true }
              as: PlantManager
              as_user_id: "pm-01"
              captures: { plant_id: $.data.id }
            - call: "POST /ethanol-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantManager
              as_user_id: "pm-01"
            - call: "POST /ethanol-ops/product-tanks"
              payload: { tank_code: "T-101", product_type: "ETHANOL_200_PROOF", capacity_gallons: 1000000.00, opening_gallons: 0.00 }
              as: ProcessOperator
              as_user_id: "op-01"
              captures: { t101_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts"
              payload: { supplier_name: "Cedar Ridge Elevator", delivery_month: "2026-10", bushels_contracted: 200000.00, basis_cents_per_bushel: -18.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
              captures: { c1_id: $.data.id }
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/price"
              payload: { futures_price_cents_per_bushel: 458.0 }
              as: GrainBuyer
              as_user_id: "gb-01"
            - call: "POST /ethanol-ops/corn-contracts/${c1_id}/deliveries"
              payload: { ticket_number: "TK-0001", gross_weight_lbs: 78640.00, tare_weight_lbs: 26000.00 }
              as: ScaleOperator
