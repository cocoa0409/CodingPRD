      - name: match_throttled_shortfall_reports_the_match_error_not_the_shortfall
        claim_type: Priority Ordering
        grounds:
          - validations[priority 78].ERR_FEDERAL_MATCH_INSUFFICIENT
          - validations[priority 79].ERR_FUNDING_SHORTFALL
          - calculations.job_funding_waterfall.formula
        distinguishing_aspect: |
          The same job with the same 5070196-cent gap reports two different errors depending only on
          whether a federal grant was throttled on the way down: with just a 1000000 state fund the
          answer is ERR_FUNDING_SHORTFALL, and adding a 10000000 federal grant that gets capped to 0
          (its match base is empty because it is evaluated first) changes the answer to
          ERR_FEDERAL_MATCH_INSUFFICIENT while the arithmetic gap is identical.
