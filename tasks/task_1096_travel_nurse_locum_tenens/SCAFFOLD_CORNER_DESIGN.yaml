          setup_api_calls:
            - call: "POST /per-diem-localities"
              payload: { locality_code: "PHX-AZ", state_code: "AZ", daily_lodging_cents: 15000, daily_mie_cents: 7900, effective_from: "2026-01-01" }
              as: PlatformAdmin
            - call: "POST /facilities"
              payload: { name: "Desert Valley Medical Center", state_code: "AZ", per_diem_locality_code: "PHX-AZ", billing_contact_email: "ap@dvmc.example", is_compact_member: true, max_concurrent_travelers: 2 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /clinicians"
              payload: { full_name: "Ada Reyes", discipline: "RN", specialty: "ICU", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX", tax_home_verified: true }
              as: Recruiter
              captures: { clin_id: "$.data.id" }
            - call: "POST /licenses"
              payload: { clinician_id: "${clin_id}", state_code: "TX", license_type: "RN", license_number: "TX-RN-88120", expires_on: "2027-12-31", is_compact: true }
              as: Recruiter
              captures: { lic_id: "$.data.id" }
            - call: "POST /licenses/${lic_id}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /assignments"
              payload: { clinician_id: "${clin_id}", facility_id: "${fac_id}", specialty: "ICU", required_license_type: "RN", start_date: "2026-06-07", term_weeks: 13, weekly_guaranteed_hours: 36, base_pay_rate_cents_per_hour: 5200, bill_rate_cents_per_hour: 14000, shift: "DAY" }
              as: Recruiter
              captures: { asg_id: "$.data.id" }
            - call: "GET /assignments/${asg_id}/contracts"
              as: Recruiter
              captures: { con_id: "$.data[0].id" }
            - call: "POST /contracts/${con_id}/transition"
              payload: { to: "SENT_FOR_SIGNATURE" }
              as: Recruiter
            - call: "POST /contracts/${con_id}/transition"
              payload: { to: "FULLY_EXECUTED" }
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "GET /assignments/${asg_id}"
              as: Recruiter
              captures: { asg_v1: "$.data.version" }
            - call: "POST /assignments/${asg_id}/extensions"
              payload: { expected_assignment_version: "${asg_v1}", proposed_additional_weeks: 14, proposed_pay_rate_cents_per_hour: 5300, proposed_bill_rate_cents_per_hour: 14200 }
              as: Recruiter
              captures: { ext_too_long_id: "$.data.id" }
          trigger:
            - call: "POST /extension-requests/${ext_too_long_id}/respond"
              payload: { action: "ACCEPT" }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /assignments/${asg_id}"
              as: Recruiter
              captures: { asg_v2: "$.data.version" }
            - call: "POST /assignments/${asg_id}/extensions"
              payload: { expected_assignment_version: "${asg_v2}", proposed_additional_weeks: 13, proposed_pay_rate_cents_per_hour: 5300, proposed_bill_rate_cents_per_hour: 14200 }
              as: Recruiter
              captures: { ext_ok_id: "$.data.id" }
            - call: "POST /extension-requests/${ext_ok_id}/respond"
              payload: { action: "ACCEPT" }
              as: Clinician
              as_user_id: "${clin_id}"
          assert:
            - "The 14-week accept returns 422 with error_id == ERR_TERM_LIMIT_EXCEEDED; ExtensionRequest.${ext_too_long_id}.status is still PROPOSED and Assignment.${asg_id}.term_weeks is still 13"
            - "Opening the replacement request withdraws the first: ExtensionRequest.${ext_too_long_id}.status == WITHDRAWN with resolved_at set"
            - "The 13-week accept returns 200; ExtensionRequest.${ext_ok_id}.status == ACCEPTED with resolved_at set"
            - "Assignment.${asg_id}.term_weeks == 26, end_date == 2026-12-05, extension_round_count == 1"
            - "Assignment.${asg_id}.guaranteed_hours_total == 936, guaranteed_hours_remaining == 936, guaranteed_hours_consumed == 0, guaranteed_hours_waived == 0"
            - "Contract.${con_id}.term_weeks == 26, base_pay_rate_cents_per_hour == 5300, bill_rate_cents_per_hour == 14200"
            - "Assignment.${asg_id}.projected_gross_bill_cents == 13291200, projected_pay_cost_cents == 10046348, projected_margin_cents == 3244852, projected_margin_pct == 0.2441"
            - "Assignment.${asg_id}.covering_license_id == ${lic_id} (the license still covers 2026-12-05)"

      - name: corner_extension_accept_rejected_when_license_lapses_before_new_end_date
        claim_type: cascading_side_effects
        grounds:
          - calculations.license_coverage_resolution
          - errors[ERR_LICENSE_COVERAGE_MISSING]
          - state_machines.ExtensionRequest.PROPOSED_to_ACCEPTED
        distinguishing_aspect: "Licensure is re-resolved against the NEW end date on acceptance: a license expiring 2026-10-31 covers the original 2026-09-05 term but not the extended 2026-12-05 term, so the accept is refused 422 ERR_LICENSE_COVERAGE_MISSING and the assignment term is untouched."
        test_recipe:
          setup:
            - "Clinician Ada Reyes holds a single VERIFIED compact TX RN license expiring 2026-10-31."
            - "Assignment 2026-06-07 .. 2026-09-05 with contract FULLY_EXECUTED; covering_license_id is pinned to that license."
            - "A Recruiter-opened ExtensionRequest proposes 13 additional weeks, which would move end_date to 2026-12-05."
          setup_api_calls:
            - call: "POST /per-diem-localities"
              payload: { locality_code: "PHX-AZ", state_code: "AZ", daily_lodging_cents: 15000, daily_mie_cents: 7900, effective_from: "2026-01-01" }
              as: PlatformAdmin
            - call: "POST /facilities"
              payload: { name: "Desert Valley Medical Center", state_code: "AZ", per_diem_locality_code: "PHX-AZ", billing_contact_email: "ap@dvmc.example", is_compact_member: true, max_concurrent_travelers: 2 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /clinicians"
              payload: { full_name: "Ada Reyes", discipline: "RN", specialty: "ICU", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX", tax_home_verified: true }
              as: Recruiter
              captures: { clin_id: "$.data.id" }
            - call: "POST /licenses"
              payload: { clinician_id: "${clin_id}", state_code: "TX", license_type: "RN", license_number: "TX-RN-88120", expires_on: "2026-10-31", is_compact: true }
              as: Recruiter
              captures: { lic_id: "$.data.id" }
            - call: "POST /licenses/${lic_id}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /assignments"
              payload: { clinician_id: "${clin_id}", facility_id: "${fac_id}", specialty: "ICU", required_license_type: "RN", start_date: "2026-06-07", term_weeks: 13, weekly_guaranteed_hours: 36, base_pay_rate_cents_per_hour: 5200, bill_rate_cents_per_hour: 14000, shift: "DAY" }
              as: Recruiter
              captures: { asg_id: "$.data.id" }
            - call: "GET /assignments/${asg_id}/contracts"
              as: Recruiter
              captures: { con_id: "$.data[0].id" }
            - call: "POST /contracts/${con_id}/transition"
              payload: { to: "SENT_FOR_SIGNATURE" }
              as: Recruiter
            - call: "POST /contracts/${con_id}/transition"
              payload: { to: "FULLY_EXECUTED" }
              as: Clinician
              as_user_id: "${clin_id}"
            - call: "GET /assignments/${asg_id}"
              as: Recruiter
              captures: { asg_v1: "$.data.version" }
            - call: "POST /assignments/${asg_id}/extensions"
              payload: { expected_assignment_version: "${asg_v1}", proposed_additional_weeks: 13, proposed_pay_rate_cents_per_hour: 5300, proposed_bill_rate_cents_per_hour: 14200 }
              as: Recruiter
              captures: { ext_id: "$.data.id" }
          trigger:
            - call: "POST /extension-requests/${ext_id}/respond"
              payload: { action: "ACCEPT" }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "Assignment.${asg_id}.covering_license_id == ${lic_id} before the trigger (the license covered the original 2026-09-05 end date)"
            - "Response status is 422 with error_id == ERR_LICENSE_COVERAGE_MISSING"
            - "Assignment.${asg_id}.term_weeks is still 13, end_date is still 2026-09-05, guaranteed_hours_total is still 468, extension_round_count == 0"
            - "ExtensionRequest.${ext_id}.status is still PROPOSED and resolved_at == null"
            - "Contract.${con_id}.base_pay_rate_cents_per_hour is still 5200 and bill_rate_cents_per_hour is still 14000"

