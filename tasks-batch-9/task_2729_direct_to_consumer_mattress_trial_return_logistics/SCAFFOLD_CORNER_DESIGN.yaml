# ===========================================================================
# 1.9 Scaffold Corner Design - Direct-to-Consumer Mattress Trial & Return
# Logistics. Breadth walk of references/claim-extraction-guide.md against
# SCAFFOLD.yaml 1.1-1.7. Sections and claim_type values come from that guide
# only. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml are
# emitted as excluded_because stubs citing the 1.8 instance by name.
# Logical clock starts at 2026-08-01T00:00:00Z in every instance.
# ===========================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_mattress_model_returns_every_declared_field
        claim_type: Creation
        grounds:
          - entities.MattressModel
          - endpoints[POST /mattress-models]
          - response_envelope.success
        distinguishing_aspect: "POST /mattress-models with all five required inputs returns 201 and a data object carrying sku, name, firmness, size, list_price_cents plus the five defaulted fields and the common id/created_at/updated_at/version."
        test_recipe:
          setup:
            - "Empty database; PlatformAdmin is the only role allowed to write the catalog."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-K-FIRM-E1", name: "Comfort K Firm", firmness: "FIRM", size: "KING", list_price_cents: 189000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
          assert:
            - "response code == 201 and response_type == object"
            - "MattressModel.${model_id}.sku == MDL-K-FIRM-E1 and name == Comfort K Firm"
            - "MattressModel.${model_id}.firmness == FIRM and size == KING and list_price_cents == 189000"
            - "MattressModel.${model_id}.break_in_nights == 21, trial_nights == 100, indentation_warranty_threshold_mm == 25, warranty_years == 10, donation_eligible == true"
            - "MattressModel.${model_id}.version == 1 and created_at == 2026-08-01T00:00:00Z"

      - name: get_trial_order_by_id_returns_the_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints[GET /trial-orders/{id}]
          - entities.TrialOrder
        distinguishing_aspect: "GET /trial-orders/{id} returns the same field values POST /trial-orders persisted, including the computed paid_amount_cents and both status axes."
        test_recipe:
          setup:
            - "One QUEEN MattressModel at 120000 cents and one Customer with a freshly created DTC TrialOrder, no bundle."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-E2", name: "Comfort Q", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e2@example.com", full_name: "Ed Two", household_hash: "HH-E2" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", channel: "DTC", gross_price_cents: 120000 }
              as: TrialSupportAgent
              captures: { order_id: $.data.id }
          trigger:
            - call: "GET /trial-orders/${order_id}"
              payload: {}
              as: TrialSupportAgent
          assert:
            - "response code == 200 and data.id == ${order_id}"
            - "TrialOrder.${order_id}.customer_id == ${cust_id} and model_id == ${model_id}"
            - "TrialOrder.${order_id}.paid_amount_cents == 120000 and bundle_discount_cents == 0"
            - "TrialOrder.${order_id}.fulfillment_status == CREATED and trial_status == NOT_STARTED"
            - "TrialOrder.${order_id}.delivered_at == null and nights_slept == null"

      - name: list_return_cases_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /return-cases]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three ReturnCases present, GET /return-cases?limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining 1 row with has_more false."
        test_recipe:
          setup:
            - "One QUEEN MattressModel, three customers in three households, three DTC orders delivered 2026-08-01, and three ReturnCases opened 2026-08-25."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-E3", name: "Comfort Q", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e3a@example.com", full_name: "Ann Three", household_hash: "HH-E3A" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /customers"
              payload: { email: "e3b@example.com", full_name: "Ben Three", household_hash: "HH-E3B" }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /customers"
              payload: { email: "e3c@example.com", full_name: "Cal Three", household_hash: "HH-E3C" }
              as: PlatformAdmin
              captures: { c3: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${c1}", model_id: "${model_id}", channel: "DTC", gross_price_cents: 120000 }
              as: TrialSupportAgent
              captures: { o1: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${c2}", model_id: "${model_id}", channel: "DTC", gross_price_cents: 120000 }
              as: TrialSupportAgent
              captures: { o2: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${c3}", model_id: "${model_id}", channel: "DTC", gross_price_cents: 120000 }
              as: TrialSupportAgent
              captures: { o3: $.data.id }
            - call: "POST /trial-orders/${o1}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${o1}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${o2}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${o2}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${o3}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /trial-orders/${o3}/deliver"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /return-cases"
              payload: { order_id: "${o1}", reason_code: "COMFORT" }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /return-cases"
              payload: { order_id: "${o2}", reason_code: "COMFORT" }
              as: Customer
              as_user_id: "${c2}"
            - call: "POST /return-cases"
              payload: { order_id: "${o3}", reason_code: "COMFORT" }
              as: Customer
              as_user_id: "${c3}"
          trigger:
            - call: "GET /return-cases"
              payload: { limit: 2, offset: 0 }
              as: TrialSupportAgent
            - call: "GET /return-cases"
              payload: { limit: 2, offset: 2 }
              as: TrialSupportAgent
          assert:
            - "trigger call 1 -> 200 with response_type == array, exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "trigger call 2 -> 200 with exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "the two pages together contain the three distinct ReturnCase ids and no duplicates"

      - name: get_trial_order_with_unknown_id_returns_order_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors.ERR_ORDER_NOT_FOUND
        distinguishing_aspect: "GET /trial-orders/{id} for a syntactically valid but absent id returns 404 with error_id ERR_ORDER_NOT_FOUND and no data payload."
        test_recipe:
          setup:
            - "Empty database apart from one Customer, so the caller is authenticated but the order id does not exist."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e4@example.com", full_name: "Eve Four", household_hash: "HH-E4" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /trial-orders/00000000-0000-0000-0000-000000000404"
              payload: {}
              as: TrialSupportAgent
          assert:
            - "response code == 404 with response_type == error and data.error_id == ERR_ORDER_NOT_FOUND"
            - "Customer.${cust_id} is unchanged (a read miss writes nothing)"

      - name: create_customer_without_household_hash_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - entities.Customer.fields.household_hash
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "household_hash has source input and no default, so omitting it returns 400 ERR_INVALID_REQUEST and no Customer row is created."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /customers"
              payload: { email: "e5@example.com", full_name: "Fay Five" }
              as: PlatformAdmin
          assert:
            - "response code == 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no Customer row exists"

      - name: create_pickup_route_without_buffer_minutes_applies_the_default_30
        claim_type: Defaults
        grounds:
          - entities.PickupRoute.fields.buffer_minutes
          - endpoints[POST /pickup-routes]
        distinguishing_aspect: "buffer_minutes is optional with default 30, so a route created without it reports buffer_minutes == 30, status DRAFT, booked_units 0 and available_units equal to capacity_units."
        test_recipe:
          setup:
            - "Empty database; no appointment exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pickup-routes"
              payload: { region_code: "CA", route_date: "2026-09-15", window_start_at: "2026-09-15T08:00:00Z", window_end_at: "2026-09-15T18:00:00Z", capacity_units: 7 }
              as: LogisticsCoordinator
              captures: { route_id: $.data.id }
          assert:
            - "response code == 201"
            - "PickupRoute.${route_id}.buffer_minutes == 30"
            - "PickupRoute.${route_id}.status == DRAFT"
            - "PickupRoute.${route_id}.booked_units == 0 and available_units == 7 and capacity_units == 7"

      - name: trial_order_paid_amount_is_computed_from_the_bundle_percent_off
        claim_type: Computed Fields
        grounds:
          - calculations.order_pricing
          - entities.TrialOrder.fields.bundle_discount_cents
          - entities.TrialOrder.fields.paid_amount_cents
          - entities.TrialOrder.fields.outstanding_refundable_cents
        distinguishing_aspect: "With gross_price_cents 120000 and a bundle at 1000 percent_off_bps, bundle_discount_cents == 12000 and paid_amount_cents == 108000; neither field is an input, so the client cannot set them."
        test_recipe:
          setup:
            - "One QUEEN MattressModel at 120000 cents and one DEDUCT_PRORATED PromotionBundle with percent_off_bps 1000."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-E7", name: "Comfort Q", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /promotion-bundles"
              payload: { code: "BUNDLE-E7", unwind_policy: "DEDUCT_PRORATED", accessory_retail_cents: 12340, gift_card_cents: 7701, percent_off_bps: 1000, requires_accessory_return: false }
              as: PlatformAdmin
              captures: { bundle_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e7@example.com", full_name: "Gus Seven", household_hash: "HH-E7" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", channel: "DTC", gross_price_cents: 120000, bundle_id: "${bundle_id}" }
              as: TrialSupportAgent
              captures: { order_id: $.data.id }
          assert:
            - "TrialOrder.${order_id}.bundle_discount_cents == 12000"
            - "TrialOrder.${order_id}.paid_amount_cents == 108000"
            - "TrialOrder.${order_id}.outstanding_refundable_cents == 108000"
            - "TrialOrder.${order_id}.refunded_total_cents == 0 and retained_amount_cents == 0"
            - "TrialOrder.${order_id}.exchange_chain_depth == 0 and exchanged_from_order_id == null"

      - name: create_customer_stamps_system_id_and_clock_timestamps
        claim_type: System Fields
        grounds:
          - entities.Customer
          - endpoints[POST /customers]
        distinguishing_aspect: "id, created_at, updated_at and version are system-assigned: created_at equals the logical clock 2026-08-01T00:00:00Z and version starts at 1, with the counters status ACTIVE / scores 0."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { now: $.data.current_utc }
          trigger:
            - call: "POST /customers"
              payload: { email: "e8@example.com", full_name: "Hal Eight", household_hash: "HH-E8" }
              as: TrialSupportAgent
              captures: { cust_id: $.data.id }
          assert:
            - "Customer.${cust_id}.created_at == ${now} == 2026-08-01T00:00:00Z and updated_at == created_at"
            - "Customer.${cust_id}.version == 1"
            - "Customer.${cust_id}.status == ACTIVE, abuse_score_rolling == 0, abuse_score_lifetime == 0, signal_count == 0"
            - "Customer.${cust_id}.lifetime_trial_count == 0, completed_return_count == 0, trial_block_until == null"

      - name: create_mattress_model_with_an_unknown_firmness_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.MattressModel.fields.firmness
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "firmness is constrained to {SOFT, MEDIUM, FIRM}, so PLUSH is rejected with 400 ERR_INVALID_REQUEST and no catalog row is written."
        test_recipe:
          setup:
            - "Empty catalog."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-E9", name: "Comfort Q Plush", firmness: "PLUSH", size: "QUEEN", list_price_cents: 120000 }
              as: PlatformAdmin
          assert:
            - "response code == 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no MattressModel row exists"

      - name: trial_abuse_signal_is_append_only_and_exposes_no_version_field
        claim_type: Immutability
        grounds:
          - entities.TrialAbuseSignal
          - entities.TrialAbuseSignal.fields.weight
          - endpoints[POST /trial-abuse-signals]
          - endpoints[GET /customers/{id}/abuse-signals]
        distinguishing_aspect: "TrialAbuseSignal declares common_fields false: the row carries id/created_at plus customer_id, signal_type, recorded_at, weight and source_note but no version and no update endpoint, and its computed weight 30 comes from calculations.abuse_score's W table."
        test_recipe:
          setup:
            - "One Customer with no signals."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e10@example.com", full_name: "Ida Ten", household_hash: "HH-E10" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /trial-abuse-signals"
              payload: { customer_id: "${cust_id}", signal_type: "HOUSEHOLD_MATCH", recorded_at: "2026-08-01T00:00:00Z", source_note: "same household hash" }
              as: PlatformAdmin
              captures: { sig_id: $.data.id }
            - call: "GET /customers/${cust_id}/abuse-signals"
              payload: { signal_type: "HOUSEHOLD_MATCH" }
              as: PlatformAdmin
          assert:
            - "TrialAbuseSignal.${sig_id}.weight == 30 and recorded_at == 2026-08-01T00:00:00Z"
            - "TrialAbuseSignal.${sig_id} exposes no version field and no update or delete endpoint exists in 1.5"
            - "GET /customers/${cust_id}/abuse-signals returns exactly 1 row"
            - "Customer.${cust_id}.signal_count == 1 and abuse_score_rolling == 30 and status == ACTIVE"

      - name: create_trial_order_with_an_unknown_model_id_returns_catalog_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - entities.TrialOrder.fields.model_id
          - errors.ERR_CATALOG_NOT_FOUND
        distinguishing_aspect: "Entity topology is flat, so every FK is validated by lookup: a TrialOrder naming an absent model_id is refused with 404 ERR_CATALOG_NOT_FOUND even though customer_id resolves."
        test_recipe:
          setup:
            - "One Customer and an empty catalog."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e11@example.com", full_name: "Jon Eleven", household_hash: "HH-E11" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_id}", model_id: "00000000-0000-0000-0000-0000000000cc", channel: "DTC", gross_price_cents: 120000 }
              as: TrialSupportAgent
          assert:
            - "response code == 404 with data.error_id == ERR_CATALOG_NOT_FOUND"
            - "GET /trial-orders?customer_id=${cust_id} returns 0 rows"
            - "Customer.${cust_id}.lifetime_trial_count == 0"

  - section: state_machines
    instances:
      - name: new_trial_order_starts_in_created_and_not_started
        claim_type: Initial State
        grounds:
          - state_machines.TrialOrder.fulfillment_status.initial_state
          - state_machines.TrialOrder.trial_status.initial_state
        distinguishing_aspect: "A freshly created TrialOrder sits at fulfillment_status CREATED and trial_status NOT_STARTED simultaneously, with delivered_at, break_in_ends_at and trial_ends_at all null."
        test_recipe:
          setup:
            - "One QUEEN MattressModel and one Customer."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-S1", name: "Comfort Q", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "s1@example.com", full_name: "Sam One", household_hash: "HH-S1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", channel: "DTC", gross_price_cents: 120000 }
              as: TrialSupportAgent
              captures: { order_id: $.data.id }
          assert:
            - "TrialOrder.${order_id}.fulfillment_status == CREATED"
            - "TrialOrder.${order_id}.trial_status == NOT_STARTED"
            - "TrialOrder.${order_id}.delivered_at == null, break_in_ends_at == null, trial_ends_at == null"
            - "Customer.${cust_id}.lifetime_trial_count == 0 (the counter moves on delivery, not on creation)"

      - name: dispatch_advances_the_fulfillment_axis_only
        claim_type: Valid Transition
        grounds:
          - state_machines.TrialOrder.fulfillment_status.CREATED_to_IN_TRANSIT
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "The state machine shape is parallel: POST /trial-orders/{id}/dispatch moves fulfillment_status CREATED -> IN_TRANSIT, bumps version to 2, and leaves trial_status at NOT_STARTED with delivered_at still null."
        test_recipe:
          setup:
            - "One QUEEN MattressModel, one Customer, one DTC TrialOrder in CREATED / NOT_STARTED at version 1."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-S2", name: "Comfort Q", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "s2@example.com", full_name: "Sue Two", household_hash: "HH-S2" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", channel: "DTC", gross_price_cents: 120000 }
              as: TrialSupportAgent
              captures: { order_id: $.data.id, order_v1: $.data.version }
          trigger:
            - call: "POST /trial-orders/${order_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
          assert:
            - "response code == 200"
            - "TrialOrder.${order_id}.fulfillment_status == IN_TRANSIT"
            - "TrialOrder.${order_id}.trial_status == NOT_STARTED"
            - "TrialOrder.${order_id}.delivered_at == null"
            - "TrialOrder.${order_id}.version == ${order_v1} + 1"

      - name: deliver_before_dispatch_returns_invalid_order_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.TrialOrder.fulfillment_status.IN_TRANSIT_to_DELIVERED
          - validations[priority=7]
          - errors.ERR_INVALID_ORDER_STATE
        distinguishing_aspect: "DELIVER is not a transition out of CREATED, so calling it on an undispatched order returns 409 ERR_INVALID_ORDER_STATE and delivered_at stays null."
        test_recipe:
          setup:
            - "One QUEEN MattressModel, one Customer, one DTC TrialOrder still in CREATED."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-S3", name: "Comfort Q", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "s3@example.com", full_name: "Sid Three", household_hash: "HH-S3" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", channel: "DTC", gross_price_cents: 120000 }
              as: TrialSupportAgent
              captures: { order_id: $.data.id, order_v1: $.data.version }
          trigger:
            - call: "POST /trial-orders/${order_id}/deliver"
              payload: {}
              as: LogisticsCoordinator
          assert:
            - "response code == 409 with data.error_id == ERR_INVALID_ORDER_STATE"
            - "TrialOrder.${order_id}.fulfillment_status == CREATED and delivered_at == null"
            - "TrialOrder.${order_id}.version == ${order_v1}"
            - "Customer.${cust_id}.lifetime_trial_count == 0"

      - name: dispatching_an_already_dispatched_order_returns_invalid_order_state
        claim_type: Idempotency
        grounds:
          - state_machines.TrialOrder.fulfillment_status.CREATED_to_IN_TRANSIT
          - validations[priority=7]
          - errors.ERR_INVALID_ORDER_STATE
        distinguishing_aspect: "Transitions are not idempotent: the second POST /trial-orders/{id}/dispatch on an IN_TRANSIT order returns 409 ERR_INVALID_ORDER_STATE and does not bump version a second time."
        test_recipe:
          setup:
            - "One QUEEN MattressModel, one Customer, one DTC TrialOrder already dispatched to IN_TRANSIT."
          setup_api_calls:
            - call: "POST /mattress-models"
              payload: { sku: "MDL-Q-S4", name: "Comfort Q", firmness: "MEDIUM", size: "QUEEN", list_price_cents: 120000 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "s4@example.com", full_name: "Sal Four", household_hash: "HH-S4" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /trial-orders"
              payload: { customer_id: "${cust_id}", model_id: "${model_id}", channel: "DTC", gross_price_cents: 120000 }
              as: TrialSupportAgent
