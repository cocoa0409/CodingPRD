              payload: { order_line_id: "${ord2_line}", storage_unit_id: "${unit_u}", lot_number: "LOT-O2A", expires_on: "2027-06-30", quantity_doses: 5 }
              as: VaccineManager
            - call: "GET /provider-sites/${site_s}/vaccine-orders/${ord1}"
