scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_bike_model_returns_201_with_defaults
        claim_type: Creation
        grounds: ["entities.BikeModel", "endpoints"]
        distinguishing_aspect: "POST /bike-models with all required fields -> 201, status ACTIVE, total_bikes 0, available_count 0, version 1."
        test_recipe:
          setup: ["Empty DB; clock at default."]
          setup_api_calls: []
          trigger:
            - call: "POST /bike-models"
              payload: { name: "City E", model_class: "EBIKE", monthly_fee_cents: 12000, daily_rate_cents: 4000, purchase_price_cents: 180000, deposit_cents: 20000, fleet_size: 10 }
              as: OpsAdmin
              captures: { mid: $.data.id, st: $.data.status, tb: $.data.total_bikes, ac: $.data.available_count, v: $.data.version }
          assert:
            - "response code == 201"
            - "BikeModel.status == ACTIVE, total_bikes == 0, available_count == 0, version == 1"

      - name: get_bike_model_not_found
        claim_type: Not Found
        grounds: ["entities.BikeModel", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /bike-models/{unknown-uuid} -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /bike-models/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND, HTTP 404"

      - name: create_account_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Account", "errors[ERR_INVALID_REQUEST]", "validations[priority=15]"]
        distinguishing_aspect: "POST /accounts omitting account_type -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { display_name: "NoType", email: "nt@x.com" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: create_account_default_rental_cap_applied
        claim_type: Defaults
        grounds: ["entities.Account.fields.rental_cap"]
        distinguishing_aspect: "POST /accounts without rental_cap -> default 1 applied."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Sam", email: "sam@x.com" }
              as: Anonymous
              captures: { aid: $.data.id, cap: $.data.rental_cap }
          assert:
            - "Account.rental_cap == 1 (default)"

      - name: bike_model_computed_available_count_tracks_pool
        claim_type: Computed Fields
        grounds: ["entities.BikeModel.fields.available_count", "entities.BikeModel.fields.total_bikes"]
        distinguishing_aspect: "Adding 2 bikes makes available_count and total_bikes == 2; the field is server-computed and any input value would be ignored."
        test_recipe:
          setup: ["Model created; 2 bikes added."]
          setup_api_calls:
            - call: "POST /bike-models"
              payload: { name: "Std", model_class: "STANDARD", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 10000, fleet_size: 5 }
              as: OpsAdmin
              captures: { mid: $.data.id }
            - call: "POST /bikes"
              payload: { model_id: "${mid}", serial_number: "S-1" }
              as: OpsAdmin
            - call: "POST /bikes"
              payload: { model_id: "${mid}", serial_number: "S-2" }
              as: OpsAdmin
          trigger:
            - call: "GET /bike-models/${mid}"
              payload: {}
              as: OpsAdmin
              captures: { ac: $.data.available_count, tb: $.data.total_bikes }
          assert:
            - "BikeModel.available_count == 2 and total_bikes == 2 (computed from Bike pool)"

      - name: bike_model_invalid_enum_class_rejected
        claim_type: Type Constraints
        grounds: ["entities.BikeModel.fields.model_class", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /bike-models with model_class not in {STANDARD,EBIKE,CARGO_EBIKE} -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /bike-models"
              payload: { name: "Bad", model_class: "SCOOTER", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 10000, fleet_size: 5 }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: duplicate_account_email_rejected
        claim_type: Type Constraints
        grounds: ["entities.Account.fields.email", "errors[ERR_DUPLICATE_RESOURCE]", "validations[priority=16]"]
        distinguishing_aspect: "Second POST /accounts with an already-used email -> ERR_DUPLICATE_RESOURCE 409."
        test_recipe:
          setup: ["One account with email dup@x.com exists."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "First", email: "dup@x.com" }
              as: Anonymous
          trigger:
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Second", email: "dup@x.com" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_RESOURCE, HTTP 409"

      - name: duplicate_bike_serial_rejected
        claim_type: Type Constraints
        grounds: ["entities.Bike.fields.serial_number", "errors[ERR_DUPLICATE_RESOURCE]", "validations[priority=16]"]
        distinguishing_aspect: "Second POST /bikes with an already-used serial_number -> ERR_DUPLICATE_RESOURCE 409."
        test_recipe:
          setup: ["A model with a bike serial DUP-1."]
          setup_api_calls:
            - call: "POST /bike-models"
              payload: { name: "Std", model_class: "STANDARD", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 10000, fleet_size: 5 }
              as: OpsAdmin
              captures: { mid: $.data.id }
            - call: "POST /bikes"
              payload: { model_id: "${mid}", serial_number: "DUP-1" }
              as: OpsAdmin
          trigger:
            - call: "POST /bikes"
              payload: { model_id: "${mid}", serial_number: "DUP-1" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_RESOURCE, HTTP 409"

      - name: inspection_report_immutable_no_version_field
        claim_type: Immutability
        grounds: ["entities.InspectionReport"]
        distinguishing_aspect: "InspectionReport has common_fields:false — it exposes id and created_at, no version, and has no update endpoint."
        test_recipe:
          setup: ["A returned rental with one InspectionReport (filed via inspect)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "Std", model_class: "STANDARD", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 20000, fleet_size: 2 }
              as: OpsAdmin
              captures: { mid: $.data.id }
            - call: "POST /bikes"
              payload: { model_id: "${mid}", serial_number: "S-1" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Sam", email: "sam@x.com", rental_cap: 1 }
              as: Anonymous
              captures: { aid: $.data.id }
            - call: "GET /bike-models/${mid}"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
              captures: { mv0: $.data.version }
            - call: "POST /rentals"
              payload: { account_id: "${aid}", model_id: "${mid}", rental_mode: "DAILY", return_due_clock: "2026-06-30T00:00:00Z", expected_model_version: "${mv0}" }
              as: Subscriber
              as_user_id: "${aid}"
              captures: { rid: $.data.id }
            - call: "POST /deliveries"
              payload: { rental_id: "${rid}", delivery_type: "INITIAL", address: "1 A St", window_start_clock: "2026-06-01T08:00:00Z", window_end_clock: "2026-06-01T12:00:00Z" }
              as: OpsAdmin
              captures: { did: $.data.id }
            - call: "POST /deliveries/${did}/complete"
              payload: {}
              as: FieldTech
            - call: "POST /rentals/${rid}/activate"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
            - call: "POST /rentals/${rid}/request-return"
              payload: { return_address: "1 A St" }
              as: Subscriber
              as_user_id: "${aid}"
            - call: "POST /rentals/${rid}/inspect"
              payload: { bike_condition: "GOOD", damage_charge_cents: 0, cleaning_fee_cents: 0 }
              as: FieldTech
              captures: { irid: $.data.id }
          trigger:
            - call: "GET /inspection-reports/${irid}"
              payload: {}
              as: FieldTech
              captures: { irid2: $.data.id }
          assert:
            - "InspectionReport carries id and created_at; no version field is present (common_fields:false)"

      - name: bike_requires_existing_parent_model
        claim_type: Parent Relationships
        grounds: ["entities.Bike.fields.model_id", "errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "POST /bikes referencing a non-existent model_id -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /bikes"
              payload: { model_id: "00000000-0000-0000-0000-000000000000", serial_number: "S-1" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND, HTTP 404"

      - name: list_bike_models_paginated_envelope
        claim_type: Listing
        grounds: ["entities.BikeModel", "endpoints"]
        distinguishing_aspect: "GET /bike-models returns an array with pagination meta (total_count, has_more) per §1.0."
        test_recipe:
          setup: ["Two models created."]
          setup_api_calls:
            - call: "POST /bike-models"
              payload: { name: "M1", model_class: "STANDARD", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 10000, fleet_size: 2 }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "M2", model_class: "EBIKE", monthly_fee_cents: 12000, daily_rate_cents: 4000, purchase_price_cents: 180000, deposit_cents: 20000, fleet_size: 2 }
              as: OpsAdmin
          trigger:
            - call: "GET /bike-models"
              payload: { limit: 1, offset: 0 }
              as: OpsAdmin
          assert:
            - "response_type == array; total_count == 2; has_more == true with limit 1"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: activate_from_reserved_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.RentalAgreement.DELIVERED_to_ACTIVE", "errors[ERR_INVALID_STATE]", "validations[priority=4]"]
        distinguishing_aspect: "Activating a still-RESERVED rental (no INITIAL delivery completed) -> ERR_INVALID_STATE 409; activate is only defined from DELIVERED."
        test_recipe:
          setup: ["A RESERVED rental (no delivery completed)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "Std", model_class: "STANDARD", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 10000, fleet_size: 2 }
              as: OpsAdmin
              captures: { mid: $.data.id }
            - call: "POST /bikes"
              payload: { model_id: "${mid}", serial_number: "S-1" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Sam", email: "sam@x.com", rental_cap: 1 }
              as: Anonymous
              captures: { aid: $.data.id }
            - call: "GET /bike-models/${mid}"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
              captures: { mv0: $.data.version }
            - call: "POST /rentals"
              payload: { account_id: "${aid}", model_id: "${mid}", rental_mode: "MONTHLY", return_due_clock: "2027-06-01T00:00:00Z", expected_model_version: "${mv0}" }
              as: Subscriber
              as_user_id: "${aid}"
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /rentals/${rid}/activate"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE, HTTP 409"

      - name: cancel_active_rental_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.RentalAgreement.RESERVED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancel is defined only from RESERVED; cancelling an ACTIVE rental -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["An ACTIVE rental."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "Std", model_class: "STANDARD", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 10000, fleet_size: 2 }
              as: OpsAdmin
              captures: { mid: $.data.id }
            - call: "POST /bikes"
              payload: { model_id: "${mid}", serial_number: "S-1" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Sam", email: "sam@x.com", rental_cap: 1 }
              as: Anonymous
              captures: { aid: $.data.id }
            - call: "GET /bike-models/${mid}"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
              captures: { mv0: $.data.version }
            - call: "POST /rentals"
              payload: { account_id: "${aid}", model_id: "${mid}", rental_mode: "MONTHLY", return_due_clock: "2027-06-01T00:00:00Z", expected_model_version: "${mv0}" }
              as: Subscriber
              as_user_id: "${aid}"
              captures: { rid: $.data.id }
            - call: "POST /deliveries"
              payload: { rental_id: "${rid}", delivery_type: "INITIAL", address: "1 A St", window_start_clock: "2026-06-01T08:00:00Z", window_end_clock: "2026-06-01T12:00:00Z" }
              as: OpsAdmin
              captures: { did: $.data.id }
            - call: "POST /deliveries/${did}/complete"
              payload: {}
              as: FieldTech
            - call: "POST /rentals/${rid}/activate"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
          trigger:
            - call: "POST /rentals/${rid}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE, HTTP 409"

      - name: close_unreviewed_claim_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.CoverageClaim.APPROVED_to_CLOSED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing a FILED (not yet APPROVED/DENIED) claim -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A FILED DAMAGE claim on an ACTIVE rental."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "Std", model_class: "STANDARD", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 10000, fleet_size: 2 }
              as: OpsAdmin
              captures: { mid: $.data.id }
            - call: "POST /bikes"
              payload: { model_id: "${mid}", serial_number: "S-1" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Sam", email: "sam@x.com", rental_cap: 1 }
              as: Anonymous
              captures: { aid: $.data.id }
            - call: "GET /bike-models/${mid}"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
              captures: { mv0: $.data.version }
            - call: "POST /rentals"
              payload: { account_id: "${aid}", model_id: "${mid}", rental_mode: "MONTHLY", return_due_clock: "2027-06-01T00:00:00Z", expected_model_version: "${mv0}" }
              as: Subscriber
              as_user_id: "${aid}"
              captures: { rid: $.data.id }
            - call: "POST /deliveries"
              payload: { rental_id: "${rid}", delivery_type: "INITIAL", address: "1 A St", window_start_clock: "2026-06-01T08:00:00Z", window_end_clock: "2026-06-01T12:00:00Z" }
              as: OpsAdmin
              captures: { did: $.data.id }
            - call: "POST /deliveries/${did}/complete"
              payload: {}
              as: FieldTech
            - call: "POST /rentals/${rid}/activate"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
            - call: "POST /coverage-claims"
              payload: { rental_id: "${rid}", claim_type: "DAMAGE", incident_clock: "2026-06-02T00:00:00Z", claimed_amount_cents: 5000 }
              as: Subscriber
              as_user_id: "${aid}"
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /coverage-claims/${cid}/close"
              payload: {}
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE, HTTP 409"

      - name: closed_ticket_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.ServiceTicket", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CLOSED ServiceTicket is terminal; starting it again -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A MINOR ticket walked OPEN->IN_PROGRESS->RESOLVED->CLOSED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "Std", model_class: "STANDARD", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 10000, fleet_size: 2 }
              as: OpsAdmin
              captures: { mid: $.data.id }
            - call: "POST /bikes"
              payload: { model_id: "${mid}", serial_number: "S-1" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Sam", email: "sam@x.com", rental_cap: 1 }
              as: Anonymous
              captures: { aid: $.data.id }
            - call: "GET /bike-models/${mid}"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
              captures: { mv0: $.data.version }
            - call: "POST /rentals"
              payload: { account_id: "${aid}", model_id: "${mid}", rental_mode: "MONTHLY", return_due_clock: "2027-06-01T00:00:00Z", expected_model_version: "${mv0}" }
              as: Subscriber
              as_user_id: "${aid}"
              captures: { rid: $.data.id }
            - call: "POST /deliveries"
              payload: { rental_id: "${rid}", delivery_type: "INITIAL", address: "1 A St", window_start_clock: "2026-06-01T08:00:00Z", window_end_clock: "2026-06-01T12:00:00Z" }
              as: OpsAdmin
              captures: { did: $.data.id }
            - call: "POST /deliveries/${did}/complete"
              payload: {}
              as: FieldTech
            - call: "POST /rentals/${rid}/activate"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
            - call: "POST /service-tickets"
              payload: { rental_id: "${rid}", issue_type: "FLAT_TIRE", severity: "MINOR", description: "flat" }
              as: Subscriber
              as_user_id: "${aid}"
              captures: { tid: $.data.id }
            - call: "POST /service-tickets/${tid}/start"
              payload: {}
              as: FieldTech
            - call: "POST /service-tickets/${tid}/resolve"
              payload: { resolution_note: "patched" }
              as: FieldTech
            - call: "POST /service-tickets/${tid}/close"
              payload: {}
              as: FieldTech
          trigger:
            - call: "POST /service-tickets/${tid}/start"
              payload: {}
              as: FieldTech
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE, HTTP 409 (CLOSED is terminal)"

      - name: critical_ticket_freezes_rental_to_in_service
        claim_type: Side Effect Execution
        grounds: ["state_machines.RentalAgreement.ACTIVE_to_IN_SERVICE", "entities.Bike.fields.bike_status"]
        distinguishing_aspect: "Filing a CRITICAL ServiceTicket on an ACTIVE rental sets rental lifecycle_status IN_SERVICE and Bike bike_status SERVICING as a side effect."
        test_recipe:
          setup: ["An ACTIVE rental."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "Std", model_class: "STANDARD", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 10000, fleet_size: 2 }
              as: OpsAdmin
              captures: { mid: $.data.id }
            - call: "POST /bikes"
              payload: { model_id: "${mid}", serial_number: "S-1" }
              as: OpsAdmin
              captures: { bid: $.data.id }
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Sam", email: "sam@x.com", rental_cap: 1 }
              as: Anonymous
              captures: { aid: $.data.id }
            - call: "GET /bike-models/${mid}"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
              captures: { mv0: $.data.version }
            - call: "POST /rentals"
              payload: { account_id: "${aid}", model_id: "${mid}", rental_mode: "MONTHLY", return_due_clock: "2027-06-01T00:00:00Z", expected_model_version: "${mv0}" }
              as: Subscriber
              as_user_id: "${aid}"
              captures: { rid: $.data.id }
            - call: "POST /deliveries"
              payload: { rental_id: "${rid}", delivery_type: "INITIAL", address: "1 A St", window_start_clock: "2026-06-01T08:00:00Z", window_end_clock: "2026-06-01T12:00:00Z" }
              as: OpsAdmin
              captures: { did: $.data.id }
            - call: "POST /deliveries/${did}/complete"
              payload: {}
              as: FieldTech
            - call: "POST /rentals/${rid}/activate"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
          trigger:
            - call: "POST /service-tickets"
              payload: { rental_id: "${rid}", issue_type: "BATTERY", severity: "CRITICAL", description: "battery fault" }
              as: Subscriber
              as_user_id: "${aid}"
            - call: "GET /rentals/${rid}"
              payload: {}
              as: Subscriber
              as_user_id: "${aid}"
              captures: { ls: $.data.lifecycle_status }
            - call: "GET /bikes/${bid}"
              payload: {}
              as: OpsAdmin
              captures: { bs: $.data.bike_status }
          assert:
            - "RentalAgreement.${rid}.lifecycle_status == IN_SERVICE"
            - "Bike.${bid}.bike_status == SERVICING"

