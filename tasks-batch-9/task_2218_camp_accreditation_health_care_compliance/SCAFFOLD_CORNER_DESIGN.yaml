              as_user_id: "officer-1"
            - call: "POST /accreditation/deficiencies/${def_id}/review"
              payload: { decision: "WAIVE", reviewer_note: "waiver after the deadline" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          assert:
            - "after setup: Deficiency.${def_id}.severity == SCORED, penalty_points == 2, correction_due_date == 2026-10-30, status == OPEN; AccreditationCycle.${cycle_id}.decision_level == ACCREDITED_WITH_CORRECTION, status == IN_CORRECTION, correction_deadline_at == 2026-10-30T23:59:59.999Z; Camp.${camp_id}.accreditation_status == ACCREDITED_WITH_CORRECTION and compliance_posture == OPEN"
            - "call 1: 409 ERR_DEFICIENCY_INVALID_STATE - VERIFY_CORRECTION needs PLAN_ACCEPTED, the finding is OPEN"
            - "call 2: 200 with status PLAN_SUBMITTED and plan_revision_count == 1"
            - "call 3: 200 with status PLAN_SUBMITTED and plan_revision_count == 2 - the self-loop replaced the unreviewed plan"
            - "call 4: 200 with status PLAN_SUBMITTED and plan_revision_count == 3"
            - "call 5: 422 ERR_PLAN_REVISION_LIMIT - the budget is exhausted with no office action at all, and plan_revision_count stays 3"
            - "call 6: 200 with escalated_deficiency_count == 0 and terminated_cycle_count == 0 - a PLAN_SUBMITTED finding is sheltered from clock escalation past 2026-10-30"
            - "after call 6: Deficiency.${def_id}.status == PLAN_SUBMITTED, AccreditationCycle.${cycle_id}.status == IN_CORRECTION, Camp.${camp_id}.accreditation_status == ACCREDITED_WITH_CORRECTION"
            - "call 7: 422 ERR_CORRECTION_WINDOW_EXPIRED - the clock date 2026-10-31 is past the due date"
            - "call 8: 422 ERR_CORRECTION_WINDOW_EXPIRED - the same window rule answers regardless of the review decision"
            - "call 9: 409 ERR_DEFICIENCY_INVALID_STATE - WAIVE needs OPEN, and priority 25 answers before the expired window at priority 54"
            - "Camp.${camp_id}.penalty_point_balance == 2 throughout - PLAN_SUBMITTED stays inside the counted set"

      - name: scoring_guards_require_the_matching_specialist_the_right_cycle_and_a_complete_mandatory_sweep
        claim_type: Cascading validation
        grounds:
          - validations[priority 35]
          - validations[priority 46]
          - validations[priority 50]
          - errors[ERR_SPECIALIST_CERTIFICATION_REQUIRED]
          - errors[ERR_MANDATORY_SCORING_INCOMPLETE]
          - errors[ERR_VISIT_CYCLE_MISMATCH]
        distinguishing_aspect: "The lead visitor satisfies the seat check at priority 17 yet still cannot score an AQUATICS standard without the matching endorsement, and cannot score a standard belonging to another camp's cycle - the seat check passes and the referential rule at priority 50 is what answers; finalize is then refused while one mandatory row is still unscored."
