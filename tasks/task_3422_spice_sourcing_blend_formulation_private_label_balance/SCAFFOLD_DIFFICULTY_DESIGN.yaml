            - { call: "POST /spice/formulas/${f}/lines", payload: { spice_code: BLACK_PEPPER, target_proportion_pct: 60.0, allergen_profile: NONE, organic_required: false, min_lot_flavor_units: 80.0 }, as: FlavorScientist }
            - { call: "POST /spice/formulas/${f}/lines", payload: { spice_code: PAPRIKA, target_proportion_pct: 40.0, allergen_profile: NONE, organic_required: false, min_lot_flavor_units: 50.0 }, as: FlavorScientist }
            - { call: "POST /spice/formulas/${f}/activate", payload: {}, as: FlavorScientist }
            - { call: "POST /spice/blend-runs", payload: { formula_id: "${f}", selection_policy: COST_MIN, target_batch_kg: 200 }, as: FlavorScientist, captures: { br: $.data.id } }
          trigger:
            - { call: "POST /spice/blend-runs/${br}/commit", payload: {}, as: FlavorScientist, captures: { br_status: $.data.status } }
          assert:
            - "commit succeeds: ${br_status} == COMMITTED"
            - "pepper line (needed 120.000 kg, per-lot cap 48.000): allocations are ${p2}=48.000 @280, ${p1}=48.000 @300, ${p3}=24.000 @320 — the 40% cap binds twice, forcing the third lot"
            - "paprika line (needed 80.000 kg, cap 32.000): allocations are ${k2}=32.000 @180, ${k1}=32.000 @200, ${k3}=16.000 @220"
            - "cost_total_cents == 52992 (subtotal 35520 + 15680 = 51200; overhead round_half_up(51200 * 0.035) = 1792)"
            - "residual_flavor_pct == 0.8 (blended 75.6 vs target 75.0) and spec_status == WITHIN_SPEC"
            - "BlendRun ${br}.selected_allocations preserves formula-line creation order: all BLACK_PEPPER entries precede all PAPRIKA entries"

      - name: blend_cost_rollup_rounding_order_mode_b
        grounds:
          - calculations.blend_cost_rollup
          - entities.BlendRun.fields.cost_total_cents
        distinguishing_aspect: |
          Mode (b) combinatorial instance: nested rounding where order matters.
          Per-allocation round_half_up then sum then overhead yields 261 cents;
          the alternative sum-then-round yields 260 — the scaffold pins the
          per-allocation-first order, and exact decimal arithmetic makes
          1.005 kg * 100 cents exactly 100.5 (binary float would give 100).
        test_recipe:
          setup:
            - "supplier S; three ACCEPTED CUMIN lots M1/M2/M3 (all crop 2025, flavor 100.0, moisture 5.0, cost 100 cents/kg, qty 100 kg)"
