            - "DistributionRequest.${req}.approve_count == 1 and decline_count == 0 and status == VOTING"

      - name: inactive_member_vote_rejected
        claim_type: violation_to_error
        grounds: ["state_machines.CommitteeMember.ACTIVE_to_INACTIVE", "errors[ERR_MEMBER_NOT_ACTIVE]"]
        distinguishing_aspect: "A member deactivated after voting opened cannot cast a vote (ERR_MEMBER_NOT_ACTIVE); their absence does not shrink the committee_size_snapshot captured earlier."
        test_recipe:
