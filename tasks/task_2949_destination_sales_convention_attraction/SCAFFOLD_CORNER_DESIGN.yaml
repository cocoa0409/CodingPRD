            - "${posture_a} == CHALLENGED and ${posture_b} == NONE - only the challenged opportunity's posture moves"
            - "GET /space-holds?challenged_by_space_hold_id=${hold_b_id} returns exactly 1 row, ${hold_a_id}"

      - name: challenge_by_a_first_rank_hold_returns_challenge_target_invalid
        claim_type: invalid_transition
        grounds:
          - state_machines[SpaceHold HELD -> CHALLENGED]
          - errors[ERR_CHALLENGE_TARGET_INVALID]
        distinguishing_aspect: "Direction matters: pointing the challenge the other way round - the FIRST hold challenging the SECOND - fails 422 ERR_CHALLENGE_TARGET_INVALID, as does a self-challenge where challenging_space_hold_id equals the path hold; neither writes a challenge_deadline."
        test_recipe:
          setup:
            - "the setup of challenge_stamps_a_fourteen_day_deadline_and_sets_posture_challenged, no challenge issued yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /space-holds/${hold_b_id}/challenge"
              payload: { challenging_space_hold_id: "${hold_a_id}" }
              as: CenterScheduler
              captures: { err_reverse: $.data.error_id }
            - call: "POST /space-holds/${hold_a_id}/challenge"
              payload: { challenging_space_hold_id: "${hold_a_id}" }
              as: CenterScheduler
              captures: { err_self: $.data.error_id }
            - call: "POST /space-holds/${hold_a_id}/challenge"
              payload: { challenging_space_hold_id: "00000000-0000-0000-0000-000000000000" }
              as: CenterScheduler
              captures: { err_missing: $.data.error_id }
          assert:
            - "first call: HTTP 422 and ${err_reverse} == ERR_CHALLENGE_TARGET_INVALID - the path hold must be the HELD FIRST-rank hold"
            - "second call: HTTP 422 and ${err_self} == ERR_CHALLENGE_TARGET_INVALID - both holds would belong to the same opportunity"
            - "third call: HTTP 404 and ${err_missing} == ERR_SPACE_HOLD_NOT_FOUND - the body FK is resolved before the 422 rank rules"
            - "GET /space-holds/${hold_a_id} still shows status HELD with challenge_deadline null"

      - name: lapsed_challenge_releases_the_first_hold_and_promotes_the_challenger
        claim_type: side_effect_execution
        grounds:
          - state_machines[SpaceHold CHALLENGED -> RELEASED]
          - state_machines[Opportunity hold_posture CHALLENGED -> RELEASED]
          - calculations.second_hold_promotion_selection
        distinguishing_aspect: "Letting the 14-day challenge window lapse (clock 2026-08-16 > deadline 2026-08-15) makes the expiry run report lapsed_challenge_count 1 with expired_count 0, releases the FIRST hold with CHALLENGE_LAPSED and promotes the challenger to FIRST with a fresh 2026-09-15 expiry."
        test_recipe:
          setup:
            - "the end state of challenge_stamps_a_fourteen_day_deadline_and_sets_posture_challenged: ${hold_a_id} CHALLENGED with deadline 2026-08-15T00:00:00Z, ${hold_b_id} HELD SECOND"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /space-hold-expiry-runs"
              payload: {}
              as: BureauAdmin
              captures: { expired_count: $.data.expired_count, lapsed_count: $.data.lapsed_challenge_count, promoted_count: $.data.promoted_count, promoted_ids: $.data.promoted_space_hold_ids }
            - call: "GET /space-holds/${hold_a_id}"
              payload: {}
              as: CenterScheduler
              captures: { status_a: $.data.status, reason_a: $.data.release_reason }
            - call: "GET /space-holds/${hold_b_id}"
              payload: {}
              as: CenterScheduler
              captures: { rank_b: $.data.hold_rank, expiry_b: $.data.expires_at }
            - call: "GET /opportunities/${opp_a_id}"
              payload: {}
              as: SalesManager
              captures: { posture_a: $.data.hold_posture }
            - call: "GET /opportunities/${opp_b_id}"
              payload: {}
              as: SalesManager
              captures: { posture_b: $.data.hold_posture }
          assert:
            - "${expired_count} == 0, ${lapsed_count} == 1, ${promoted_count} == 1, ${promoted_ids} == [${hold_b_id}]"
            - "${status_a} == RELEASED and ${reason_a} == CHALLENGE_LAPSED - not HOLD_EXPIRED, the hold's own expires_at (2026-10-30) is still in the future"
            - "${rank_b} == FIRST and ${expiry_b} == 2026-09-15T00:00:00Z"
            - "${posture_a} == RELEASED and ${posture_b} == TENTATIVE"

      - name: commit_and_pickup_on_an_invited_block_return_invalid_commitment_state
