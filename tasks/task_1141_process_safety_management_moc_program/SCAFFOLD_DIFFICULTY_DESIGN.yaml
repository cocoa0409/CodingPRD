            - "After second trigger: PlantUnit.${u_id}.overdue_action_count == 3, process_safety_index == 45, psm_posture == RESTRICTED (link 3)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_state_beats_safety_posture
        grounds:
          - validations[priority=5]
          - validations[priority=6.3]
          - errors[ERR_MOC_INVALID_STATE]
          - errors[ERR_UNIT_POSTURE_FROZEN]
        distinguishing_aspect: |
          Pair (state vs business_safety): a WITHDRAWN MOC submitted while its unit is
          FROZEN fails BOTH priority 5 (ERR_MOC_INVALID_STATE) and priority 6.3
          (ERR_UNIT_POSTURE_FROZEN) — the state error at the lower priority number wins.
        test_recipe:
          setup:
            - "Unit U, study CURRENT (validated 2026-01-15), REQ, INV, AUD exist"
            - "MOC M created, classified PERMANENT, then withdrawn (WITHDRAWN) while posture NORMAL"
            - "Unit driven FROZEN: 3 P1 manual items due_in_days 1 (+45 once overdue) and study OVERDUE after clock 2027-01-11 (+25) → index 70"
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/pha-studies", payload: { method: "HAZOP", initial_validated_at: "2026-01-15" }, as: PsmManager }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "M", description: "d", discipline: "CHEMICAL" }, as: Requester, as_user_id: "${req_id}", captures: { m_id: $.data.id } }
            - { call: "POST /psm/moc-requests/${m_id}/classify", payload: { change_class: "PERMANENT", screening_severity: 1, screening_likelihood: 1 }, as: PsmManager }
            - { call: "POST /psm/moc-requests/${m_id}/withdraw", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "a1", priority: "P1", assignee_id: "${req_id}", due_in_days: 1 }, as: PsmManager }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "a2", priority: "P1", assignee_id: "${req_id}", due_in_days: 1 }, as: PsmManager }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "a3", priority: "P1", assignee_id: "${req_id}", due_in_days: 1 }, as: PsmManager }
            - { call: "POST /psm/_clock/set_current_utc", payload: { to_iso8601: "2027-01-11T00:00:00Z" }, as: PsmAdmin }
          trigger:
            - { call: "POST /psm/moc-requests/${m_id}/submit", payload: {}, as: Requester, as_user_id: "${req_id}", captures: { err: $.data.error_id } }
          assert:
            - "PlantUnit.${u_id}.process_safety_index == 70 and psm_posture == FROZEN (both rules violated)"
            - "trigger rejected: error_id == ERR_MOC_INVALID_STATE (priority 5 state beats priority 6.3 business_safety)"

      - name: authorize_safety_beats_referential_pssr
        grounds:
          - validations[priority=6.3]
          - validations[priority=9]
          - errors[ERR_UNIT_POSTURE_FROZEN]
          - errors[ERR_PSSR_NOT_APPROVED]
        distinguishing_aspect: |
          Pair (business_safety vs business_referential) — a different category pair than
          submit_state_beats_safety_posture: authorize-startup on a unit that is FROZEN
          while the MOC also lacks any APPROVED PSSR fails both priority 6.3 and priority 9;
          the safety error ERR_UNIT_POSTURE_FROZEN wins over ERR_PSSR_NOT_APPROVED.
        test_recipe:
          setup:
            - "Unit U, study CURRENT (validated 2026-01-15), REQ/REV(CHEMICAL)/APP exist"
            - "PERMANENT MOC M driven to IMPLEMENTED_PSSR_PENDING (requires_pssr == true, NO PSSR created)"
            - "Unit then driven FROZEN exactly as in submit_state_beats_safety_posture (index 70)"
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/pha-studies", payload: { method: "HAZOP", initial_validated_at: "2026-01-15" }, as: PsmManager }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Rev", employee_ref: "E-REV", qualifications: ["CHEMICAL"] }, as: PsmAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "App", employee_ref: "E-APP" }, as: PsmAdmin, captures: { app_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Inv", employee_ref: "E-INV" }, as: PsmAdmin, captures: { inv_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Aud", employee_ref: "E-AUD" }, as: PsmAdmin, captures: { aud_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "M", description: "d", discipline: "CHEMICAL" }, as: Requester, as_user_id: "${req_id}", captures: { m_id: $.data.id } }
            - { call: "POST /psm/moc-requests/${m_id}/classify", payload: { change_class: "PERMANENT", screening_severity: 2, screening_likelihood: 2 }, as: PsmManager }
            - { call: "POST /psm/moc-requests/${m_id}/submit", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "GET /psm/moc-requests/${m_id}/technical-reviews", as: PsmManager, captures: { r_id: "$.data[0].id" } }
            - { call: "POST /psm/technical-reviews/${r_id}/submit-verdict", payload: { design_basis_ok: true, codes_standards_ok: true, relief_systems_ok: true, materials_compat_ok: true, severity_score: 2, likelihood_score: 2, detection_score: 1, verdict: "ACCEPT" }, as: TechnicalReviewer, as_user_id: "${rev_id}" }
            - { call: "POST /psm/moc-requests/${m_id}/approve", payload: {}, as: OpsApprover, as_user_id: "${app_id}" }
            - { call: "POST /psm/moc-requests/${m_id}/procedure-updates", payload: { document_ref: "SOP-1" }, as: TrainingCoordinator, captures: { pu: $.data.id } }
            - { call: "POST /psm/procedure-updates/${pu}/training-assignments", payload: { personnel_id: "${req_id}" }, as: TrainingCoordinator, captures: { ta: $.data.id } }
            - { call: "POST /psm/procedure-updates/${pu}/publish", payload: {}, as: TrainingCoordinator }
            - { call: "POST /psm/training-assignments/${ta}/complete", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "POST /psm/moc-requests/${m_id}/mark-implemented", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "a1", priority: "P1", assignee_id: "${req_id}", due_in_days: 1 }, as: PsmManager }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "a2", priority: "P1", assignee_id: "${req_id}", due_in_days: 1 }, as: PsmManager }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "a3", priority: "P1", assignee_id: "${req_id}", due_in_days: 1 }, as: PsmManager }
            - { call: "POST /psm/_clock/set_current_utc", payload: { to_iso8601: "2027-01-11T00:00:00Z" }, as: PsmAdmin }
          trigger:
            - { call: "POST /psm/moc-requests/${m_id}/authorize-startup", payload: {}, as: PsmManager, captures: { err: $.data.error_id } }
          assert:
            - "trigger rejected: error_id == ERR_UNIT_POSTURE_FROZEN (priority 6.3 business_safety beats priority 9 business_referential ERR_PSSR_NOT_APPROVED)"
            - "MocRequest.${m_id}.status remains IMPLEMENTED_PSSR_PENDING"

  - rule_id: boundary_precision_check
    instances:
      - name: temp_duration_max_inclusive_boundary
        grounds:
          - validations[priority=8.1]
          - entities.PlantUnit.fields.temp_moc_max_days
          - errors[ERR_TEMP_DURATION_EXCEEDS_MAX]
        distinguishing_aspect: |
          Duration boundary (in days) on POST /psm/moc-requests/{id}/classify: the check is
          inclusive — duration exactly == temp_moc_max_days (180) succeeds and yields
          end 2026-11-28, while 181 is rejected. Metric: duration days; endpoint: classify.
        test_recipe:
          setup:
            - "Unit U with default temp_moc_max_days 180; REQ exists; MOC-1 and MOC-2 both DRAFT"
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "M1", description: "d", discipline: "CHEMICAL" }, as: Requester, as_user_id: "${req_id}", captures: { m1: $.data.id } }
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "M2", description: "d", discipline: "CHEMICAL" }, as: Requester, as_user_id: "${req_id}", captures: { m2: $.data.id } }
          trigger:
            - { call: "POST /psm/moc-requests/${m1}/classify", payload: { change_class: "TEMPORARY", screening_severity: 1, screening_likelihood: 1, temporary_start_date: "2026-06-01", temporary_duration_days: 180 }, as: PsmManager }
            - { call: "POST /psm/moc-requests/${m2}/classify", payload: { change_class: "TEMPORARY", screening_severity: 1, screening_likelihood: 1, temporary_start_date: "2026-06-01", temporary_duration_days: 181 }, as: PsmManager, captures: { err: $.data.error_id } }
          assert:
            - "MocRequest.${m1}.status == CLASSIFIED and temporary_end_date == 2026-11-28T00:00:00Z (180 is allowed, <=)"
            - "MOC-2 classify rejected: error_id == ERR_TEMP_DURATION_EXCEEDS_MAX (181 > 180); MocRequest.${m2}.status remains DRAFT"

      - name: extension_count_cap_boundary
        grounds:
          - validations[priority=8.1]
          - calculations.extension_end_date_arithmetic
          - concurrency_rules[extension-create-stale-moc]
          - errors[ERR_MAX_EXTENSIONS_REACHED]
        distinguishing_aspect: |
          Count boundary on POST /psm/moc-requests/{id}/extension-requests (different metric
          and endpoint than the duration boundary): max_extensions == 2 means the 2nd
          extension succeeds and the 3rd fails with ERR_MAX_EXTENSIONS_REACHED — checked
          BEFORE the day caps, so the error proves check ordering (3rd request of 30 days
          would pass both day caps: candidate end 2027-03-27 <= cap 2027-04-26).
        test_recipe:
          setup:
            - "Unit U (defaults: max_extensions 2, extension_max_days 90, total_temp_cap_days 360), study CURRENT"
            - "TEMPORARY MOC M in IN_SERVICE: start 2026-05-01, duration 180 → end 2026-10-28"
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/pha-studies", payload: { method: "HAZOP", initial_validated_at: "2026-04-01" }, as: PsmManager }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Rev", employee_ref: "E-REV", qualifications: ["CHEMICAL"] }, as: PsmAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "App", employee_ref: "E-APP" }, as: PsmAdmin, captures: { app_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Lead", employee_ref: "E-LEAD", qualifications: ["PSSR_CERTIFIED"] }, as: PsmAdmin, captures: { lead_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "T", description: "d", discipline: "CHEMICAL" }, as: Requester, as_user_id: "${req_id}", captures: { m_id: $.data.id } }
            - { call: "POST /psm/moc-requests/${m_id}/classify", payload: { change_class: "TEMPORARY", screening_severity: 1, screening_likelihood: 1, temporary_start_date: "2026-05-01", temporary_duration_days: 180 }, as: PsmManager }
            - { call: "POST /psm/moc-requests/${m_id}/submit", payload: {}, as: Requester, as_user_id: "${req_id}" }
