  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_p13_meeting_not_in_session_beats_business_fiscal_p43_reserve_too_low_on_ratify
        grounds:
          - validations[priority=13]  # ERR_MEETING_NOT_IN_SESSION
          - validations[priority=43]  # ERR_RESERVE_CONTRIBUTION_TOO_LOW
          - endpoints[POST /budgets/{id}/ratify]
          - calculations.assessment_allocation
        distinguishing_aspect: |
          Category pair state (priority 13) vs business_fiscal (priority 43) on the SAME call
          POST /budgets/{id}/ratify. Both checks are genuinely violated at once: the hosting
          meeting is still NOTICED and the association raised reserve_contribution_min_bp from
          1000 to 2000 AFTER the budget legally passed proposal, so 1200000 < 2400000. The
          response MUST be 409 ERR_MEETING_NOT_IN_SESSION, never 422
          ERR_RESERVE_CONTRIBUTION_TOO_LOW; convening the meeting then surfaces the fiscal error,
          proving the second violation was live and merely lower-priority.
        test_recipe:
          setup:
            - "Association with defaults: reserve_contribution_min_bp 1000, budget_notice_days 30, board_quorum_seats 3."
            - "Three seated directors, each owning one unit: 101 (3400 bp), 102 (3300 bp), 103 (3300 bp); total_interest_bp == 10000."
            - "Budget FY2026 operating_total_cents 12000000, reserve_contribution_cents 1200000 — exactly the 1000 bp minimum, so proposal succeeds on equality."
            - "Budget is NOTICED against a BUDGET_RATIFICATION meeting on 2026-09-05T18:00:00Z, noticed 35 days ahead."
            - "AFTER the notice, reserve_contribution_min_bp is raised to 2000, making the minimum 2400000 and the noticed budget retroactively under-funded."
            - "The meeting is deliberately NOT convened before the first ratify attempt."
