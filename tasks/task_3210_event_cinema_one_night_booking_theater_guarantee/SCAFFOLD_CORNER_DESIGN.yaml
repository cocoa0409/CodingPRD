              as: ContentOfficer
              as_user_id: "co-operator-7"
              captures: { co_err: "$.data.error_id" }
            - call: "POST /event-cinema/bookings/${b_id}/lines"
              payload: { theater_id: "${th_id}", committed_screens: 20, expected_attendance: 40, expected_booking_version: "${b_v1}" }
              as: Exhibitor
              as_user_id: "${circ_id}"
              captures: { ok2: $.data.exhibit_state }
          assert:
            - "the content officer is refused with 403 — ${co_err} == ERR_FORBIDDEN"
            - "no line was created on the refusal — GET /event-cinema/bookings/${b_id}/lines returns 0 rows"
            - "the owning exhibitor can create it — ${ok2} == PROPOSED"

