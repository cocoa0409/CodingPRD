scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: build_price_provisional_vs_final
        grounds:
          - calculations.build_price
          - state_machines.BoardBuild.DRAFT_to_COMPONENTS_RESERVED
          - state_machines.BoardBuild.ASSEMBLED_to_SETUP_COMPLETE
          - entities.BoardBuild.fields.provisional_total_cents
          - entities.BoardBuild.fields.final_total_cents
        distinguishing_aspect: |
          On BoardBuild, the provisional variant (raw list-price sum, 16500) and the final variant
          (per-line PRO-tier discount rounded then summed plus 2500 setup fee, 17350) produce different
          totals for the identical component_lines.
        test_recipe:
          setup:
            - "PRO member; five ACTIVE buildable products (6000/4000/3500/2000/1000 cents, stock 5 each); a build with one line of each at qty 1"
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "DECK1", name: "Deck", category: "DECK", unit_price_cents: 6000, buildable_component: true, stock_on_hand: 5 }, as: ShopManager, captures: { deck_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "TRK1", name: "Trucks", category: "TRUCK", unit_price_cents: 4000, buildable_component: true, stock_on_hand: 5 }, as: ShopManager, captures: { truck_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "WHL1", name: "Wheels", category: "WHEELS", unit_price_cents: 3500, buildable_component: true, stock_on_hand: 5 }, as: ShopManager, captures: { wheel_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "BRG1", name: "Bearings", category: "BEARINGS", unit_price_cents: 2000, buildable_component: true, stock_on_hand: 5 }, as: ShopManager, captures: { bear_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "GRP1", name: "Grip", category: "GRIP", unit_price_cents: 1000, buildable_component: true, stock_on_hand: 5 }, as: ShopManager, captures: { grip_id: "$.data.id" } }
            - { call: "POST /members", payload: { email: "pro@x.com", full_name: "Pro Rider", tier: "PRO" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /board-builds", payload: { member_id: "${m_id}", component_lines: [ { product_id: "${deck_id}", qty: 1 }, { product_id: "${truck_id}", qty: 1 }, { product_id: "${wheel_id}", qty: 1 }, { product_id: "${bear_id}", qty: 1 }, { product_id: "${grip_id}", qty: 1 } ] }, as: Associate, captures: { build_id: "$.data.id" } }
            - { call: "POST /board-builds/${build_id}/reserve", payload: {}, as: Associate, captures: { prov: "$.data.provisional_total_cents" } }
            - { call: "POST /board-builds/${build_id}/assemble", payload: {}, as: Associate }
          trigger:
            - { call: "POST /board-builds/${build_id}/setup", payload: {}, as: Associate, captures: { fin: "$.data.final_total_cents" } }
          assert:
            - "BoardBuild.${build_id}.provisional_total_cents == 16500"
            - "BoardBuild.${build_id}.final_total_cents == 17350"

      - name: tradein_cash_vs_store_credit_payout
        grounds:
          - calculations.tradein_payout
          - state_machines.TradeIn.APPRAISED_to_CASH_SETTLED
          - entities.TradeIn.fields.payout_cents
          - entities.Member.fields.store_credit_cents
        distinguishing_aspect: |
          On TradeIn (a different entity domain than BoardBuild), the same appraised_value_cents (10000)
          yields payout 5000 under CASH but 7000 under STORE_CREDIT, and only STORE_CREDIT changes
          Member.store_credit_cents.
        test_recipe:
          setup:
            - "One member and two RECEIVED trade-ins both appraised at 10000 cents"
          setup_api_calls:
            - { call: "POST /members", payload: { email: "t@x.com", full_name: "Trader" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /trade-ins", payload: { member_id: "${m_id}", description: "Used deck A" }, as: Associate, captures: { ti_a: "$.data.id" } }
            - { call: "POST /trade-ins", payload: { member_id: "${m_id}", description: "Used deck B" }, as: Associate, captures: { ti_b: "$.data.id" } }
            - { call: "POST /trade-ins/${ti_a}/appraise", payload: { appraised_value_cents: 10000 }, as: ShopManager }
            - { call: "POST /trade-ins/${ti_b}/appraise", payload: { appraised_value_cents: 10000 }, as: ShopManager }
          trigger:
            - { call: "POST /trade-ins/${ti_a}/buyout", payload: { payout_method: "CASH" }, as: Associate }
            - { call: "POST /trade-ins/${ti_b}/buyout", payload: { payout_method: "STORE_CREDIT" }, as: Associate }
          assert:
            - "TradeIn.${ti_a}.payout_cents == 5000"
            - "TradeIn.${ti_a}.payout_method == CASH"
            - "TradeIn.${ti_b}.payout_cents == 7000"
            - "Member.${m_id}.store_credit_cents == 7000"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: build_final_price_round_per_line_then_sum
        grounds:
          - calculations.build_price
          - state_machines.BoardBuild.ASSEMBLED_to_SETUP_COMPLETE
        distinguishing_aspect: |
          Mode (b) nested rounding order: one line of a 105-cent product at qty 3 under PRO 0.10 discount
          gives round_half_up(94.5)=95 per unit -> 95*3=285, +2500 setup = 2785; the sum-then-round order
          (round_half_up(283.5)=284 -> 2784) is explicitly NOT used.
        test_recipe:
          setup:
            - "PRO member; one ACTIVE buildable product priced 105 cents, stock 5; a build with one line qty 3; reserved and assembled"
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "ODD1", name: "Odd Grip", category: "GRIP", unit_price_cents: 105, buildable_component: true, stock_on_hand: 5 }, as: ShopManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /members", payload: { email: "pro2@x.com", full_name: "Pro Two", tier: "PRO" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /board-builds", payload: { member_id: "${m_id}", component_lines: [ { product_id: "${p_id}", qty: 3 } ] }, as: Associate, captures: { build_id: "$.data.id" } }
            - { call: "POST /board-builds/${build_id}/reserve", payload: {}, as: Associate }
            - { call: "POST /board-builds/${build_id}/assemble", payload: {}, as: Associate }
          trigger:
            - { call: "POST /board-builds/${build_id}/setup", payload: {}, as: Associate, captures: { fin: "$.data.final_total_cents" } }
          assert:
            - "BoardBuild.${build_id}.final_total_cents == 2785"

      - name: loyalty_earn_tier_multiplier_double_points
        grounds:
          - calculations.loyalty_earn
          - state_machines.Lesson.CONFIRMED_to_COMPLETED
          - entities.Member.fields.points_balance
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear formula: net_amount 6000, TEAM multiplier 3, double_points true ->
          floor(6000/100)*3*2 = 360, under the 500 min-cap, so earned = 360 (a STANDARD single-point run
          would be 60).
        test_recipe:
          setup:
            - "TEAM member; instructor; a CONFIRMED lesson with fee 6000"
          setup_api_calls:
            - { call: "POST /members", payload: { email: "team@x.com", full_name: "Team Rider", tier: "TEAM" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /instructors", payload: { full_name: "Coach A", discipline: "SKATE" }, as: ShopManager, captures: { i_id: "$.data.id" } }
            - { call: "POST /lessons", payload: { member_id: "${m_id}", instructor_id: "${i_id}", discipline: "SKATE", start_at: "2026-07-05T10:00:00Z", end_at: "2026-07-05T11:00:00Z", fee_cents: 6000 }, as: Associate, captures: { l_id: "$.data.id" } }
            - { call: "POST /lessons/${l_id}/confirm", payload: {}, as: ShopManager }
          trigger:
            - { call: "POST /lessons/${l_id}/complete", payload: { double_points: true }, as: ShopManager }
          assert:
            - "Member.${m_id}.points_balance == 360"
            - "Member.${m_id}.lifetime_points == 360"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: board_build_revision_cycle
        grounds:
          - state_machines.BoardBuild.ASSEMBLED_to_DRAFT
          - entities.BoardBuild.fields.status
          - entities.Product.fields.stock_reserved
        distinguishing_aspect: |
          BoardBuild is cyclic: ASSEMBLED->DRAFT returns the build to an earlier state, releasing the
          component reservation (Product.stock_reserved 1 -> 0) and clearing provisional_total_cents.
        test_recipe:
          setup:
            - "A build with one component (stock 3, qty 1) reserved then assembled; Product.stock_reserved == 1"
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "DECK2", name: "Deck2", category: "DECK", unit_price_cents: 3000, buildable_component: true, stock_on_hand: 3 }, as: ShopManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /members", payload: { email: "rev@x.com", full_name: "Rev" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /board-builds", payload: { member_id: "${m_id}", component_lines: [ { product_id: "${p_id}", qty: 1 } ] }, as: Associate, captures: { build_id: "$.data.id" } }
            - { call: "POST /board-builds/${build_id}/reserve", payload: {}, as: Associate }
            - { call: "POST /board-builds/${build_id}/assemble", payload: {}, as: Associate }
          trigger:
            - { call: "POST /board-builds/${build_id}/revise", payload: {}, as: Associate }
          assert:
            - "BoardBuild.${build_id}.status == DRAFT"
            - "Product.${p_id}.stock_reserved == 0"
            - "BoardBuild.${build_id}.provisional_total_cents == null"

      - name: tradein_consignment_branch_credits_store_credit
        grounds:
          - state_machines.TradeIn.APPRAISED_to_LISTED
          - state_machines.TradeIn.LISTED_to_SOLD
          - calculations.tradein_payout
          - entities.Member.fields.store_credit_cents
        distinguishing_aspect: |
          TradeIn forks at APPRAISED into {CASH_SETTLED, LISTED}; the LISTED->SOLD consignment branch
          applies a distinct side-effect set (payout = 70% of list_price_cents 20000 = 14000 to store credit,
          payout_method CONSIGNMENT), diverging from the buyout branch. Non-linear branching on a different
          entity than BoardBuild.
        test_recipe:
          setup:
            - "A member; a trade-in appraised at 10000 then LISTED at list_price 20000"
          setup_api_calls:
            - { call: "POST /members", payload: { email: "con@x.com", full_name: "Consignor" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /trade-ins", payload: { member_id: "${m_id}", description: "Vintage board" }, as: Associate, captures: { ti_id: "$.data.id" } }
            - { call: "POST /trade-ins/${ti_id}/appraise", payload: { appraised_value_cents: 10000 }, as: ShopManager }
            - { call: "POST /trade-ins/${ti_id}/list", payload: { list_price_cents: 20000 }, as: Associate }
          trigger:
            - { call: "POST /trade-ins/${ti_id}/sell", payload: {}, as: Associate }
          assert:
            - "TradeIn.${ti_id}.status == SOLD"
            - "TradeIn.${ti_id}.payout_cents == 14000"
            - "TradeIn.${ti_id}.payout_method == CONSIGNMENT"
            - "Member.${m_id}.store_credit_cents == 14000"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: member_suspend_cascade_member_build_serviceorder_product
        grounds:
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.BoardBuild.SETUP_COMPLETE_to_CANCELLED
          - state_machines.ServiceOrder.SCHEDULED_to_CANCELLED
          - entities.Product.fields.stock_reserved
        distinguishing_aspect: |
          Depth-3 chain: member suspend cancels the SETUP_COMPLETE build (hop1), which cancels the linked
          SCHEDULED service order (hop2), which releases its reserved part so part-Product.stock_reserved
          1 -> 0 (hop3); the component-Product.stock_reserved also returns to 0 via the build cancel.
        test_recipe:
          setup:
            - "ACTIVE member; SETUP_COMPLETE build reserving 1 component (stock 2); an OPEN bay; a SCHEDULED service order on that build reserving 1 wax part (stock 3)"
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "DECK3", name: "Deck3", category: "DECK", unit_price_cents: 6000, buildable_component: true, stock_on_hand: 2 }, as: ShopManager, captures: { comp_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "WAX1", name: "Wax", category: "WAX", unit_price_cents: 500, buildable_component: false, stock_on_hand: 3 }, as: ShopManager, captures: { part_id: "$.data.id" } }
            - { call: "POST /members", payload: { email: "sus@x.com", full_name: "Suspendable" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /service-bays", payload: { name: "Bay 1" }, as: ShopManager, captures: { bay_id: "$.data.id" } }
            - { call: "POST /board-builds", payload: { member_id: "${m_id}", component_lines: [ { product_id: "${comp_id}", qty: 1 } ] }, as: Associate, captures: { build_id: "$.data.id" } }
            - { call: "POST /board-builds/${build_id}/reserve", payload: {}, as: Associate }
            - { call: "POST /board-builds/${build_id}/assemble", payload: {}, as: Associate }
            - { call: "POST /board-builds/${build_id}/setup", payload: {}, as: Associate }
            - { call: "POST /service-orders", payload: { member_id: "${m_id}", bay_id: "${bay_id}", build_id: "${build_id}", service_type: "WAX", parts_lines: [ { product_id: "${part_id}", qty: 1 } ], slot_start: "2026-07-05T10:00:00Z", slot_end: "2026-07-05T11:00:00Z" }, as: Associate, captures: { so_id: "$.data.id" } }
          trigger:
            - { call: "POST /members/${m_id}/suspend", payload: {}, as: ShopManager }
          assert:
            - "Member.${m_id}.status == SUSPENDED"
            - "BoardBuild.${build_id}.status == CANCELLED"
            - "ServiceOrder.${so_id}.status == CANCELLED"
            - "Product.${part_id}.stock_reserved == 0"
            - "Product.${comp_id}.stock_reserved == 0"

      - name: event_close_cascade_event_registration_member
        grounds:
          - state_machines.Event.OPEN_to_CLOSED
          - state_machines.EventRegistration.REGISTERED_to_CANCELLED
          - entities.Member.fields.points_balance
          - entities.Event.fields.registration_count
        distinguishing_aspect: |
          Depth-2 chain from a different trigger than member-suspend: event close cancels the REGISTERED
          registration (hop1), which refunds points_charged 300 to the member so points_balance 0 -> 300 and
          registration_count 1 -> 0 (hop2).
        test_recipe:
          setup:
            - "Member holding exactly 300 points (earned via a completed 30000-cent lesson); an OPEN event cost 300 cap 5; member REGISTERED (points_balance 0, registration_count 1)"
          setup_api_calls:
            - { call: "POST /members", payload: { email: "ev@x.com", full_name: "Eventer" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /instructors", payload: { full_name: "Coach B", discipline: "SURF" }, as: ShopManager, captures: { i_id: "$.data.id" } }
            - { call: "POST /lessons", payload: { member_id: "${m_id}", instructor_id: "${i_id}", discipline: "SURF", start_at: "2026-07-05T10:00:00Z", end_at: "2026-07-05T11:00:00Z", fee_cents: 30000 }, as: Associate, captures: { l_id: "$.data.id" } }
            - { call: "POST /lessons/${l_id}/confirm", payload: {}, as: ShopManager }
            - { call: "POST /lessons/${l_id}/complete", payload: {}, as: ShopManager }
            - { call: "POST /events", payload: { name: "Demo Day", capacity: 5, entry_points_cost: 300 }, as: ShopManager, captures: { e_id: "$.data.id" } }
            - { call: "POST /events/${e_id}/register", payload: { member_id: "${m_id}" }, as: Associate, captures: { reg_id: "$.data.id" } }
          trigger:
            - { call: "POST /events/${e_id}/close", payload: {}, as: ShopManager }
          assert:
            - "Event.${e_id}.status == CLOSED"
            - "EventRegistration.${reg_id}.status == CANCELLED"
            - "Member.${m_id}.points_balance == 300"
            - "Event.${e_id}.registration_count == 0"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: register_event_closed_beats_insufficient_points
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_EVENT_CLOSED]
          - errors[ERR_INSUFFICIENT_POINTS]
        distinguishing_aspect: |
          Category pair {state, business_fiscal}: registering on a CLOSED event by a member with 0 points
          (cost 100) fails both the state check (prio 5) and the fiscal check (prio 9); the higher-priority
          state error ERR_EVENT_CLOSED is returned.
        test_recipe:
          setup:
            - "Member with 0 points; an event cost 100 cap 5 that has been CLOSED"
          setup_api_calls:
            - { call: "POST /members", payload: { email: "poor@x.com", full_name: "Zero Points" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /events", payload: { name: "Closed Event", capacity: 5, entry_points_cost: 100 }, as: ShopManager, captures: { e_id: "$.data.id" } }
            - { call: "POST /events/${e_id}/close", payload: {}, as: ShopManager }
          trigger:
            - { call: "POST /events/${e_id}/register", payload: { member_id: "${m_id}" }, as: Associate, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_EVENT_CLOSED"
            - "HTTP status == 409"

      - name: rental_too_long_beats_unit_unavailable
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_RENTAL_TOO_LONG]
          - errors[ERR_UNIT_UNAVAILABLE]
        distinguishing_aspect: |
          Category pair {business_constraint, business_temporal}: a new rental of 20 days (>14) that also
          overlaps an existing reservation on the same unit fails both; the higher-priority constraint error
          ERR_RENTAL_TOO_LONG (prio 7) beats the temporal overlap error (prio 8).
        test_recipe:
          setup:
            - "A unit with an existing RESERVED rental 2026-07-10..2026-07-12"
          setup_api_calls:
            - { call: "POST /members", payload: { email: "r1@x.com", full_name: "Renter One" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /rental-units", payload: { name: "SurfA", kind: "SURFBOARD", daily_rate_cents: 2500 }, as: ShopManager, captures: { u_id: "$.data.id" } }
            - { call: "POST /rentals", payload: { member_id: "${m_id}", unit_id: "${u_id}", start_date: "2026-07-10", end_date: "2026-07-12" }, as: Associate, captures: { r_id: "$.data.id" } }
          trigger:
            - { call: "POST /rentals", payload: { member_id: "${m_id}", unit_id: "${u_id}", start_date: "2026-07-11", end_date: "2026-07-30" }, as: Associate, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_RENTAL_TOO_LONG"
            - "HTTP status == 422"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: register_points_exactly_equal_cost_allowed
        grounds:
          - validations[priority=9]
          - state_machines.EventRegistration.null_to_REGISTERED
          - entities.Member.fields.points_balance
        distinguishing_aspect: |
          Metric = loyalty points via POST /events/{id}/register: points_balance 300 == entry_points_cost 300
          is allowed (>=), leaving points_balance 0; a 299 balance would be rejected.
        test_recipe:
          setup:
            - "Member with exactly 300 points (completed 30000-cent lesson); OPEN event cost 300 cap 5"
          setup_api_calls:
            - { call: "POST /members", payload: { email: "eq@x.com", full_name: "Exact" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /instructors", payload: { full_name: "Coach C", discipline: "SKATE" }, as: ShopManager, captures: { i_id: "$.data.id" } }
            - { call: "POST /lessons", payload: { member_id: "${m_id}", instructor_id: "${i_id}", discipline: "SKATE", start_at: "2026-07-06T09:00:00Z", end_at: "2026-07-06T10:00:00Z", fee_cents: 30000 }, as: Associate, captures: { l_id: "$.data.id" } }
            - { call: "POST /lessons/${l_id}/confirm", payload: {}, as: ShopManager }
            - { call: "POST /lessons/${l_id}/complete", payload: {}, as: ShopManager }
            - { call: "POST /events", payload: { name: "Comp", capacity: 5, entry_points_cost: 300 }, as: ShopManager, captures: { e_id: "$.data.id" } }
          trigger:
            - { call: "POST /events/${e_id}/register", payload: { member_id: "${m_id}" }, as: Associate, captures: { reg_id: "$.data.id" } }
          assert:
            - "EventRegistration.${reg_id}.status == REGISTERED"
            - "Member.${m_id}.points_balance == 0"

      - name: rental_duration_exactly_max_days_allowed
        grounds:
          - validations[priority=7]
          - state_machines.Rental.null_to_RESERVED
          - entities.Rental.fields.status
        distinguishing_aspect: |
          Metric = rental days via POST /rentals: duration_days 14 (2026-07-01..2026-07-14, inclusive) equals
          MAX_RENTAL_DAYS 14 and is allowed; a 15-day span is rejected with ERR_RENTAL_TOO_LONG.
        test_recipe:
          setup:
            - "A member and an AVAILABLE rental unit"
          setup_api_calls:
            - { call: "POST /members", payload: { email: "max@x.com", full_name: "Max Days" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /rental-units", payload: { name: "SkateA", kind: "SKATEBOARD", daily_rate_cents: 1000 }, as: ShopManager, captures: { u_id: "$.data.id" } }
          trigger:
            - { call: "POST /rentals", payload: { member_id: "${m_id}", unit_id: "${u_id}", start_date: "2026-07-01", end_date: "2026-07-14" }, as: Associate, captures: { r_id: "$.data.id" } }
          assert:
            - "Rental.${r_id}.status == RESERVED"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: service_order_requires_build_setup_complete
        grounds:
          - validations[priority=6]
          - state_machines.ServiceOrder.null_to_SCHEDULED
          - errors[ERR_BUILD_NOT_READY]
        distinguishing_aspect: |
          Pair ServiceOrder->BoardBuild: scheduling a service order on a build still in ASSEMBLED
          (not in {SETUP_COMPLETE, COMPLETED}) is rejected with ERR_BUILD_NOT_READY.
        test_recipe:
          setup:
            - "A member; a build reserved and assembled (ASSEMBLED, not setup); an OPEN bay"
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "DECK4", name: "Deck4", category: "DECK", unit_price_cents: 6000, buildable_component: true, stock_on_hand: 3 }, as: ShopManager, captures: { comp_id: "$.data.id" } }
            - { call: "POST /members", payload: { email: "cross1@x.com", full_name: "Cross One" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /service-bays", payload: { name: "Bay 2" }, as: ShopManager, captures: { bay_id: "$.data.id" } }
            - { call: "POST /board-builds", payload: { member_id: "${m_id}", component_lines: [ { product_id: "${comp_id}", qty: 1 } ] }, as: Associate, captures: { build_id: "$.data.id" } }
            - { call: "POST /board-builds/${build_id}/reserve", payload: {}, as: Associate }
            - { call: "POST /board-builds/${build_id}/assemble", payload: {}, as: Associate }
          trigger:
            - { call: "POST /service-orders", payload: { member_id: "${m_id}", bay_id: "${bay_id}", build_id: "${build_id}", service_type: "GRIP", slot_start: "2026-07-07T10:00:00Z", slot_end: "2026-07-07T11:00:00Z" }, as: Associate, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_BUILD_NOT_READY"
            - "HTTP status == 409"

      - name: lesson_confirm_requires_linked_rental_ready
        grounds:
          - validations[priority=6]
          - state_machines.Lesson.BOOKED_to_CONFIRMED
          - errors[ERR_RENTAL_NOT_READY]
        distinguishing_aspect: |
          Pair Lesson->Rental (a different entity pair than ServiceOrder->BoardBuild): confirming a lesson
          whose linked rental has been CANCELLED (not in {RESERVED, CHECKED_OUT}) is rejected with
          ERR_RENTAL_NOT_READY.
        test_recipe:
          setup:
            - "A BOOKED lesson; a rental linked to it (lesson_id set) that is then CANCELLED"
          setup_api_calls:
            - { call: "POST /members", payload: { email: "cross2@x.com", full_name: "Cross Two" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /instructors", payload: { full_name: "Coach D", discipline: "SURF" }, as: ShopManager, captures: { i_id: "$.data.id" } }
            - { call: "POST /rental-units", payload: { name: "WetsuitA", kind: "WETSUIT", daily_rate_cents: 800 }, as: ShopManager, captures: { u_id: "$.data.id" } }
            - { call: "POST /lessons", payload: { member_id: "${m_id}", instructor_id: "${i_id}", discipline: "SURF", start_at: "2026-07-08T10:00:00Z", end_at: "2026-07-08T11:00:00Z", fee_cents: 5000 }, as: Associate, captures: { l_id: "$.data.id" } }
            - { call: "POST /rentals", payload: { member_id: "${m_id}", unit_id: "${u_id}", start_date: "2026-07-08", end_date: "2026-07-08", lesson_id: "${l_id}" }, as: Associate, captures: { r_id: "$.data.id" } }
            - { call: "POST /rentals/${r_id}/cancel", payload: {}, as: Associate }
          trigger:
            - { call: "POST /lessons/${l_id}/confirm", payload: {}, as: ShopManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_RENTAL_NOT_READY"
            - "HTTP status == 409"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: instructor_half_open_adjacency_allowed
        grounds:
          - validations[priority=8]
          - state_machines.Lesson.null_to_BOOKED
          - errors[ERR_INSTRUCTOR_UNAVAILABLE]
        distinguishing_aspect: |
          Instructor interval semantics = half-open [start_at, end_at): a lesson starting exactly at the
          prior lesson's end (11:00 after 10:00-11:00) is accepted (adjacency allowed), unlike an
          overlapping slot which would raise ERR_INSTRUCTOR_UNAVAILABLE.
        test_recipe:
          setup:
            - "An instructor with one BOOKED lesson 2026-07-09T10:00:00Z..11:00:00Z"
          setup_api_calls:
            - { call: "POST /members", payload: { email: "tov1@x.com", full_name: "TOV One" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /instructors", payload: { full_name: "Coach E", discipline: "SKATE" }, as: ShopManager, captures: { i_id: "$.data.id" } }
            - { call: "POST /lessons", payload: { member_id: "${m_id}", instructor_id: "${i_id}", discipline: "SKATE", start_at: "2026-07-09T10:00:00Z", end_at: "2026-07-09T11:00:00Z", fee_cents: 5000 }, as: Associate, captures: { l1: "$.data.id" } }
          trigger:
            - { call: "POST /lessons", payload: { member_id: "${m_id}", instructor_id: "${i_id}", discipline: "SKATE", start_at: "2026-07-09T11:00:00Z", end_at: "2026-07-09T12:00:00Z", fee_cents: 5000 }, as: Associate, captures: { l2: "$.data.id" } }
          assert:
            - "Lesson.${l2}.status == BOOKED"

      - name: service_bay_buffer_separation_rejected
        grounds:
          - validations[priority=8]
          - state_machines.ServiceOrder.null_to_SCHEDULED
          - errors[ERR_BAY_UNAVAILABLE]
        distinguishing_aspect: |
          ServiceBay interval semantics = SETUP_BUFFER_MINUTES 30 separation (distinct from instructor
          half-open adjacency, on a different resource): a slot starting 11:15 (only 15 min after a
          10:00-11:00 slot) is rejected with ERR_BAY_UNAVAILABLE; exactly 30 min apart would be accepted.
        test_recipe:
          setup:
            - "A bay with one SCHEDULED service order 2026-07-09T10:00:00Z..11:00:00Z"
          setup_api_calls:
            - { call: "POST /members", payload: { email: "tov2@x.com", full_name: "TOV Two" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /service-bays", payload: { name: "Bay 3" }, as: ShopManager, captures: { bay_id: "$.data.id" } }
            - { call: "POST /service-orders", payload: { member_id: "${m_id}", bay_id: "${bay_id}", service_type: "WAX", slot_start: "2026-07-09T10:00:00Z", slot_end: "2026-07-09T11:00:00Z" }, as: Associate, captures: { so1: "$.data.id" } }
          trigger:
            - { call: "POST /service-orders", payload: { member_id: "${m_id}", bay_id: "${bay_id}", service_type: "GRIP", slot_start: "2026-07-09T11:15:00Z", slot_end: "2026-07-09T11:45:00Z" }, as: Associate, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_BAY_UNAVAILABLE"
            - "HTTP status == 409"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: inventory_reserved_conserved_reserve_then_cancel
        grounds:
          - state_machines.BoardBuild.DRAFT_to_COMPONENTS_RESERVED
          - state_machines.BoardBuild.COMPONENTS_RESERVED_to_CANCELLED
          - entities.Product.fields.stock_on_hand
          - entities.Product.fields.stock_reserved
        distinguishing_aspect: |
          Conserved quantity = physical inventory units: reserve (stock_reserved 0->2) then cancel
          (stock_reserved 2->0) leaves Product.stock_on_hand == 5 and stock_reserved == 0, so
          stock_available returns to its pre-reserve value 5 with zero drift.
        test_recipe:
          setup:
            - "A buildable product stock_on_hand 5; a build with one line qty 2; reserved"
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "DECK5", name: "Deck5", category: "DECK", unit_price_cents: 3000, buildable_component: true, stock_on_hand: 5 }, as: ShopManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /members", payload: { email: "inv@x.com", full_name: "Inv" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /board-builds", payload: { member_id: "${m_id}", component_lines: [ { product_id: "${p_id}", qty: 2 } ] }, as: Associate, captures: { build_id: "$.data.id" } }
            - { call: "POST /board-builds/${build_id}/reserve", payload: {}, as: Associate }
          trigger:
            - { call: "POST /board-builds/${build_id}/cancel", payload: {}, as: Associate }
          assert:
            - "Product.${p_id}.stock_on_hand == 5"
            - "Product.${p_id}.stock_reserved == 0"
            - "Product.${p_id}.stock_available == 5"

      - name: loyalty_points_conserved_register_then_cancel
        grounds:
          - state_machines.EventRegistration.null_to_REGISTERED
          - state_machines.EventRegistration.REGISTERED_to_CANCELLED
          - entities.Member.fields.points_balance
          - entities.EventRegistration.fields.points_charged
        distinguishing_aspect: |
          Conserved quantity = loyalty points (distinct from inventory units): register debits points_charged
          300 (points_balance 300->0) and registration cancel refunds exactly 300 (0->300), leaving
          Member.points_balance == 300 with zero drift.
        test_recipe:
          setup:
            - "Member with 300 points (completed 30000-cent lesson); OPEN event cost 300 cap 5; member REGISTERED"
          setup_api_calls:
            - { call: "POST /members", payload: { email: "loy@x.com", full_name: "Loyal" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /instructors", payload: { full_name: "Coach F", discipline: "SKATE" }, as: ShopManager, captures: { i_id: "$.data.id" } }
            - { call: "POST /lessons", payload: { member_id: "${m_id}", instructor_id: "${i_id}", discipline: "SKATE", start_at: "2026-07-10T10:00:00Z", end_at: "2026-07-10T11:00:00Z", fee_cents: 30000 }, as: Associate, captures: { l_id: "$.data.id" } }
            - { call: "POST /lessons/${l_id}/confirm", payload: {}, as: ShopManager }
            - { call: "POST /lessons/${l_id}/complete", payload: {}, as: ShopManager }
            - { call: "POST /events", payload: { name: "Jam", capacity: 5, entry_points_cost: 300 }, as: ShopManager, captures: { e_id: "$.data.id" } }
            - { call: "POST /events/${e_id}/register", payload: { member_id: "${m_id}" }, as: Associate, captures: { reg_id: "$.data.id" } }
          trigger:
            - { call: "POST /event-registrations/${reg_id}/cancel", payload: {}, as: ShopManager }
          assert:
            - "Member.${m_id}.points_balance == 300"
            - "EventRegistration.${reg_id}.status == CANCELLED"
            - "Event.${e_id}.registration_count == 0"
