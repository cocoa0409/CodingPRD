            - "after deleting the second line: OrderLine.${ag_line_b}.status == REMOVED and SalesOrder.${ag_o_id}.chargeable_lbs == 3000"
            - "second confirm: HTTP 200 with ${ag_status} == CONFIRMED and ${ag_total} == 808500 — subtotal 750000, freight 36000 rate-based plus 18000 reefer, pallet break 4500, no small-order surcharge because 3000 >= MOQ_ORDER_LBS, and no volume discount because 750000 is under 1000000"
