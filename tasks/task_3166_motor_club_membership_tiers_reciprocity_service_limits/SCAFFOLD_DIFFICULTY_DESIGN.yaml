          - calculations.settlement_sweep
          - state_machines.SettlementPeriod.OPEN_to_CLOSED
          - entities.SettlementPeriod.fields.period_end_date
        distinguishing_aspect: |
          Empty-set/interval boundary: a call completing at exactly period_end_date is
          EXCLUDED (half-open window), one at period_end_date - 1 second is INCLUDED,
          and closing a period with zero in-window lines yields total_foreign_call_count
          == 0 and total_gross_cents == 0 rather than an error. Metric: completion-time
          window on POST /motor-club/settlement-periods/{id}/close — a different
          endpoint and metric than the call cap.
