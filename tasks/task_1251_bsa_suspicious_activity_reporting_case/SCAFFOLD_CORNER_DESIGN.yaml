        excluded_because:
          difficulty_instance: "file_sar_deadline_instant_boundary / sar_activity_window_closed_overlap / threshold_window_half_open_overlap / send_314b_safety_beats_temporal / qa_quota_pool_snapshot_order"
          rationale: "Each error's trigger path is asserted as the failure branch of the named §1.8 instances (deadline+1s, one-day window overlap, pipeline window overlap, LE-open send, 4th QA sample)."

      - name: case_close_blocked_by_open_inquiry
        claim_type: violation_to_error
        grounds: ["errors[ERR_LE_INQUIRY_OPEN]", state_machines.Case.PENDING_QA_to_CLOSED, "validations[priority=8]"]
        distinguishing_aspect: "The case-close path of the LE safety gate (distinct from the 314(b) send path): qa-review PASS on a PENDING_QA case with a linked open inquiry is rejected; after the inquiry is responded and closed, the same qa-review succeeds."
        test_recipe:
          setup: ["Case k1 in PENDING_QA (NO_SAR path); LE inquiry le1 for the same customer linked to k1 (status UNDER_REVIEW)"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Quinn QA", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { qa1: $.data.id } }
