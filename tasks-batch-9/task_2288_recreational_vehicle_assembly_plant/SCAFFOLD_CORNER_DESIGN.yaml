              as: ProductionScheduler
            - call: "POST /unit-orders/${ord_id}/release-to-line"
              payload: {}
              as: ProductionScheduler
              captures: { build_id: $.data.id, order_v: $.data.version }
            - call: "POST /quality-inspections"
              payload: { unit_build_id: "${build_id}", inspection_type: "PDI" }
              as: QualityInspector
              as_user_id: "QI-1"
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /floor-plans"
              payload: { model_code: "FP-SNEAK", chassis_class: "TOWABLE", length_ft: 24, base_msrp_cents: 7000000, base_station_hours: 30.00, base_dry_weight_lbs: 5000, gvwr_lbs: 8000, required_wheelbase_in: 170, electrical_service_amps: 30, fresh_water_capacity_gal: 40 }
              as: ProductionScheduler
              captures: { e_ps: $.data.error_id }
            - call: "POST /unit-orders/${ord_id}/production-slots"
              payload: { line_id: "${line_id}", slot_date: "2026-08-06T00:00:00Z", expected_unit_order_version: "${order_v}" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { e_dp: $.data.error_id }
            - call: "POST /quality-inspections/${insp_id}/complete"
              payload: { defect_points: 0, leak_detected: false }
              as: LineSupervisor
              as_user_id: "LS-1"
              captures: { e_ls: $.data.error_id }
            - call: "POST /unit-builds/${build_id}/advance"
              payload: { to_station: "SIDEWALL_LAM", station_hours_used: 6.00 }
              as: QualityInspector
              as_user_id: "QI-1"
              captures: { e_qi: $.data.error_id }
            - call: "POST /recall-campaigns"
              payload: { supplier_id: "${sup_ch}", campaign_code: "RC-SNEAK", part_number: "PN-AXLE", lot_codes: ["LOT-X1"], severity: "SAFETY" }
              as: WarrantyAdministrator
              as_user_id: "WA-1"
              captures: { e_wa: $.data.error_id }
            - call: "POST /component-installations"
              payload: { unit_build_id: "${build_id}", component_lot_id: "${lot_id}", station: "CHASSIS_PREP", quantity: 1 }
              as: RecallCoordinator
              as_user_id: "RC-1"
              captures: { e_rc: $.data.error_id }
            - call: "POST /unit-orders/00000000-0000-0000-0000-000000000000/submit"
              payload: {}
              as: PlantAdmin
              captures: { e_pa: $.data.error_id }
          assert:
            - "e_ps == ERR_ROLE_NOT_PERMITTED with status 403: floor-plan authoring is PlantAdmin-exclusive, and no FP-SNEAK row exists afterwards"
            - "e_dp == ERR_ROLE_NOT_PERMITTED with status 403: slot reservation is ProductionScheduler-exclusive even on the dealer's own order — the role gate at priority 2 answers before the dealer-scope gate at priority 6"
            - "e_ls == ERR_ROLE_NOT_PERMITTED with status 403 and QualityInspection.${insp_id}.status is still SCHEDULED"
            - "e_qi == ERR_ROLE_NOT_PERMITTED with status 403 and UnitBuild.${build_id}.current_station is still CHASSIS_PREP"
            - "e_wa == ERR_ROLE_NOT_PERMITTED with status 403 and no RC-SNEAK campaign exists, so ComponentLot.${lot_id}.status is still AVAILABLE"
            - "e_rc == ERR_ROLE_NOT_PERMITTED with status 403 and ComponentLot.${lot_id}.quantity_available is still 10 — the RecallCoordinator may remedy installations but never create one"
            - "e_pa == ERR_ROLE_NOT_PERMITTED with status 403, not ERR_UNIT_ORDER_NOT_FOUND: priority 2 precedes priority 4, so the role gate never leaks whether that id exists"

      - name: warranty_approver_must_not_also_pay_the_claim
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - roles.WarrantyAdministrator
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "The second, independent segregation pair: within one role, the X-User-ID that recorded the APPROVED decision is barred from the payment step, while any other administrator may pay — and the claim survives the refusal in APPROVED rather than falling back."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; TOW kit; one delivered unit is injected for dealer D-TOW and one APPLIANCE claim is filed and approved by WA-1."
          setup_api_calls:
            - call: "POST /floor-plans"
              payload: { model_code: "FP-TOW", chassis_class: "TOWABLE", length_ft: 28, base_msrp_cents: 8000000, base_station_hours: 40.00, base_dry_weight_lbs: 6000, gvwr_lbs: 9000, required_wheelbase_in: 180, electrical_service_amps: 50, fresh_water_capacity_gal: 60 }
              as: PlantAdmin
              captures: { fp_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-TOW", region: "CENTRAL", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_id: $.data.id }
            - call: "POST /_inject/delivered-unit"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "${fp_id}" }
              as: PlantAdmin
              captures: { build_id: $.data.id }
            - call: "POST /warranty-claims"
              payload: { unit_build_id: "${build_id}", claim_type: "APPLIANCE", labor_hours: 3.50, parts_cost_cents: 68000, narrative: "furnace blower seized" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /warranty-claims/${claim_id}/decide"
              payload: { decision: "APPROVED" }
              as: WarrantyAdministrator
              as_user_id: "WA-1"
              captures: { st_appr: $.data.status, total: $.data.total_reimbursement_cents }
          trigger:
            - call: "POST /warranty-claims/${claim_id}/pay"
              payload: {}
              as: WarrantyAdministrator
              as_user_id: "WA-1"
              captures: { e_sod: $.data.error_id }
            - call: "POST /warranty-claims/${claim_id}/pay"
              payload: {}
              as: WarrantyAdministrator
              as_user_id: "WA-2"
              captures: { st_paid: $.data.status, paid_by: $.data.paid_by_user_id }
          assert:
            - "st_appr == APPROVED with total == 105500 (labour 27300 plus parts 78200, no goodwill requested) and approved_by_user_id == WA-1"
            - "e_sod == ERR_SEGREGATION_OF_DUTIES with status 409 for WA-1, and WarrantyClaim.${claim_id}.status is still APPROVED with paid_by_user_id null"
            - "st_paid == PAID for WA-2 with paid_by == WA-2, while approved_by_user_id remains WA-1"
            - "the refusal is identity-based, not role-based: both calls carry X-User-Role WarrantyAdministrator, so a 403 ERR_ROLE_NOT_PERMITTED would be wrong"

  # ---------------------------------------------------------------------------
  # Cross-cutting complexity layers — complexity_profile.complexity_layers
  # ---------------------------------------------------------------------------
  - section: cross-cutting complexity layers
    instances:
      - name: stale_expected_versions_are_rejected_on_both_occ_write_endpoints
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.slot-reserve-stale-order
          - concurrency_rules.recall-expand-stale-campaign
          - validations.priority_8
          - errors.ERR_STALE_UNIT_ORDER_VERSION
          - errors.ERR_STALE_RECALL_CAMPAIGN_VERSION
        distinguishing_aspect: "Both §1.2.1 rules are exercised through the same three-beat shape — a write that succeeds and bumps the parent version, a replay of the now-stale version that is refused with 412, and a refreshed read that lets the write through — and the second campaign expansion shows the just-refreshed version going stale in turn."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; TOW kit with LINE-T, an appliance supplier and two lots LOT-A1 and LOT-A2 of PN-FRIDGE."
            - "One order is submitted (version 2, required_station_hours 41.00) and one slot is reserved on 2026-08-05 with that version, taking the order to version 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-AP", name: "Northline Appliance", component_categories: ["APPLIANCE"] }
              as: PlantAdmin
              captures: { sup_ap: $.data.id }
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_ap}", part_number: "PN-FRIDGE", lot_code: "LOT-A1", category: "APPLIANCE", quantity_received: 10 }
              as: PlantAdmin
              captures: { lot_a1: $.data.id }
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_ap}", part_number: "PN-FRIDGE", lot_code: "LOT-A2", category: "APPLIANCE", quantity_received: 6 }
              as: PlantAdmin
              captures: { lot_a2: $.data.id }
            - call: "POST /floor-plans"
              payload: { model_code: "FP-TOW", chassis_class: "TOWABLE", length_ft: 28, base_msrp_cents: 8000000, base_station_hours: 40.00, base_dry_weight_lbs: 6000, gvwr_lbs: 9000, required_wheelbase_in: 180, electrical_service_amps: 50, fresh_water_capacity_gal: 60 }
              as: PlantAdmin
              captures: { fp_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-E1", category: "ELECTRICAL", install_station: "ROUGH_IN", price_cents: 100000, weight_lbs: 0, added_station_hours: 1.00, amp_draw: 20, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_e1_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-TOW", region: "CENTRAL", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_id: $.data.id }
            - call: "POST /production-lines"
              payload: { line_code: "LINE-T", chassis_class_supported: "TOWABLE", daily_station_hour_capacity: 240.00, max_units_per_day: 4 }
              as: PlantAdmin
              captures: { line_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "${fp_id}", order_type: "SOLD", selected_option_ids: ["${opt_e1_id}"], requested_delivery_date: "2026-10-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /unit-orders/${ord_id}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { ord_v_a: $.data.version }
            - call: "POST /unit-orders/${ord_id}/production-slots"
              payload: { line_id: "${line_id}", slot_date: "2026-08-05T00:00:00Z", expected_unit_order_version: "${ord_v_a}" }
              as: ProductionScheduler
              captures: { slot_1: $.data.id, seq_1: $.data.sequence_position }
          trigger:
            - call: "POST /unit-orders/${ord_id}/production-slots"
              payload: { line_id: "${line_id}", slot_date: "2026-08-06T00:00:00Z", expected_unit_order_version: "${ord_v_a}" }
              as: ProductionScheduler
              captures: { e_ord: $.data.error_id }
            - call: "GET /unit-orders/${ord_id}"
              payload: {}
              as: ProductionScheduler
              captures: { ord_v_b: $.data.version }
            - call: "POST /unit-orders/${ord_id}/production-slots"
              payload: { line_id: "${line_id}", slot_date: "2026-08-06T00:00:00Z", expected_unit_order_version: "${ord_v_b}" }
              as: ProductionScheduler
              captures: { slot_2: $.data.id, seq_2: $.data.sequence_position }
            - call: "POST /recall-campaigns"
              payload: { supplier_id: "${sup_ap}", campaign_code: "RC-FRIDGE", part_number: "PN-FRIDGE", lot_codes: ["LOT-A1"], severity: "ADVISORY" }
              as: RecallCoordinator
              as_user_id: "RC-1"
              captures: { camp_id: $.data.id, camp_v_a: $.data.version }
            - call: "POST /recall-campaigns/${camp_id}/open"
              payload: {}
              as: RecallCoordinator
              as_user_id: "RC-1"
              captures: { camp_status: $.data.status }
            - call: "POST /recall-campaigns/${camp_id}/expand"
              payload: { additional_lot_codes: ["LOT-A2"], expected_recall_campaign_version: "${camp_v_a}" }
              as: RecallCoordinator
              as_user_id: "RC-1"
              captures: { e_camp_1: $.data.error_id }
            - call: "GET /recall-campaigns/${camp_id}"
              payload: {}
              as: RecallCoordinator
              as_user_id: "RC-1"
              captures: { camp_v_b: $.data.version }
            - call: "POST /recall-campaigns/${camp_id}/expand"
              payload: { additional_lot_codes: ["LOT-A2"], expected_recall_campaign_version: "${camp_v_b}" }
              as: RecallCoordinator
              as_user_id: "RC-1"
              captures: { camp_v_c: $.data.version, quarantined: $.data.quarantined_piece_count }
            - call: "POST /recall-campaigns/${camp_id}/expand"
              payload: { additional_lot_codes: ["LOT-A2"], expected_recall_campaign_version: "${camp_v_b}" }
              as: RecallCoordinator
              as_user_id: "RC-1"
              captures: { e_camp_2: $.data.error_id }
          assert:
            - "ord_v_a == 2 and seq_1 == 1: the setup reservation succeeded against a current version and left the order at version 3"
            - "e_ord == ERR_STALE_UNIT_ORDER_VERSION with status 412, and ProductionSlot.${slot_1} is still RESERVED on 2026-08-05 — the refused replay superseded nothing"
            - "ord_v_b == 3 from the refreshed read, and the retry with it returns 201 with seq_2 == 1 on the 2026-08-06 bucket while ${slot_1} becomes RELEASED"
            - "UnitOrder.${ord_id}.version == 4 after the successful re-slot: every accepted write increments the parent version by exactly 1"
            - "camp_v_a == 1 at creation and camp_status == OPEN, which takes the campaign to version 2"
            - "e_camp_1 == ERR_STALE_RECALL_CAMPAIGN_VERSION with status 412 for version 1, and lot_codes is still exactly [LOT-A1]"
            - "camp_v_b == 2, and the expansion carrying it returns 200 with camp_v_c == 3, lot_codes [LOT-A1, LOT-A2] and quarantined == 16 (10 from LOT-A1 at open plus 6 from LOT-A2)"
            - "e_camp_2 == ERR_STALE_RECALL_CAMPAIGN_VERSION with status 412: version 2 went stale the moment the accepted expansion landed, and ComponentLot.${lot_a2}.quantity_quarantined is still 6, not 12"

      - name: warranty_claim_listing_combines_three_filters_with_offset_paging
        claim_type: pagination_with_filtering
        grounds:
          - endpoints.GET /warranty-claims
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three filters are stacked on one list endpoint and then paged, and the same filtered query is re-issued after a decision moves one row out of the filtered set — so the count is proven to be computed from current state rather than cached from the first page."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; two dealers D-A and D-B on FP-TOW; six delivered units are injected (five for D-A, one for D-B)."
            - "D-A files three APPLIANCE claims and two STRUCTURAL claims; D-B files one APPLIANCE claim."
          setup_api_calls:
            - call: "POST /floor-plans"
              payload: { model_code: "FP-TOW", chassis_class: "TOWABLE", length_ft: 28, base_msrp_cents: 8000000, base_station_hours: 40.00, base_dry_weight_lbs: 6000, gvwr_lbs: 9000, required_wheelbase_in: 180, electrical_service_amps: 50, fresh_water_capacity_gal: 60 }
              as: PlantAdmin
              captures: { fp_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-A", region: "CENTRAL", allocation_share_bp: 1000, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_a: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-B", region: "EAST", allocation_share_bp: 1000, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_b: $.data.id }
            - call: "POST /_inject/delivered-unit"
              payload: { dealer_id: "${dlr_a}", floor_plan_id: "${fp_id}" }
              as: PlantAdmin
              captures: { b_a1: $.data.id }
            - call: "POST /_inject/delivered-unit"
              payload: { dealer_id: "${dlr_a}", floor_plan_id: "${fp_id}" }
              as: PlantAdmin
              captures: { b_a2: $.data.id }
            - call: "POST /_inject/delivered-unit"
              payload: { dealer_id: "${dlr_a}", floor_plan_id: "${fp_id}" }
              as: PlantAdmin
              captures: { b_a3: $.data.id }
            - call: "POST /_inject/delivered-unit"
              payload: { dealer_id: "${dlr_a}", floor_plan_id: "${fp_id}" }
              as: PlantAdmin
              captures: { b_a4: $.data.id }
            - call: "POST /_inject/delivered-unit"
              payload: { dealer_id: "${dlr_a}", floor_plan_id: "${fp_id}" }
              as: PlantAdmin
              captures: { b_a5: $.data.id }
            - call: "POST /_inject/delivered-unit"
              payload: { dealer_id: "${dlr_b}", floor_plan_id: "${fp_id}" }
              as: PlantAdmin
              captures: { b_b1: $.data.id }
            - call: "POST /warranty-claims"
              payload: { unit_build_id: "${b_a1}", claim_type: "APPLIANCE", labor_hours: 2.00, parts_cost_cents: 0, narrative: "furnace fault one" }
              as: DealerPrincipal
              as_user_id: "${dlr_a}"
              captures: { c_ap1: $.data.id }
            - call: "POST /warranty-claims"
              payload: { unit_build_id: "${b_a2}", claim_type: "APPLIANCE", labor_hours: 2.00, parts_cost_cents: 0, narrative: "furnace fault two" }
              as: DealerPrincipal
              as_user_id: "${dlr_a}"
              captures: { c_ap2: $.data.id }
            - call: "POST /warranty-claims"
              payload: { unit_build_id: "${b_a3}", claim_type: "APPLIANCE", labor_hours: 2.00, parts_cost_cents: 0, narrative: "furnace fault three" }
              as: DealerPrincipal
              as_user_id: "${dlr_a}"
              captures: { c_ap3: $.data.id }
            - call: "POST /warranty-claims"
              payload: { unit_build_id: "${b_a4}", claim_type: "STRUCTURAL", labor_hours: 2.00, parts_cost_cents: 0, narrative: "roof seam one" }
              as: DealerPrincipal
              as_user_id: "${dlr_a}"
              captures: { c_st1: $.data.id }
            - call: "POST /warranty-claims"
              payload: { unit_build_id: "${b_a5}", claim_type: "STRUCTURAL", labor_hours: 2.00, parts_cost_cents: 0, narrative: "roof seam two" }
              as: DealerPrincipal
              as_user_id: "${dlr_a}"
              captures: { c_st2: $.data.id }
            - call: "POST /warranty-claims"
              payload: { unit_build_id: "${b_b1}", claim_type: "APPLIANCE", labor_hours: 2.00, parts_cost_cents: 0, narrative: "other dealer furnace" }
              as: DealerPrincipal
              as_user_id: "${dlr_b}"
              captures: { c_b1: $.data.id }
          trigger:
            - call: "GET /warranty-claims?dealer_id=${dlr_a}&claim_type=APPLIANCE&status=SUBMITTED&limit=2&offset=0"
              payload: {}
              as: WarrantyAdministrator
              as_user_id: "WA-1"
              captures: { p1_first: "$.data[0].id" }
            - call: "GET /warranty-claims?dealer_id=${dlr_a}&claim_type=APPLIANCE&status=SUBMITTED&limit=2&offset=2"
              payload: {}
              as: WarrantyAdministrator
              as_user_id: "WA-1"
              captures: { p2_first: "$.data[0].id" }
            - call: "POST /warranty-claims/${c_ap1}/decide"
              payload: { decision: "APPROVED" }
              as: WarrantyAdministrator
              as_user_id: "WA-1"
              captures: { ap1_status: $.data.status }
            - call: "GET /warranty-claims?dealer_id=${dlr_a}&claim_type=APPLIANCE&status=SUBMITTED&limit=2&offset=0"
              payload: {}
              as: WarrantyAdministrator
              as_user_id: "WA-1"
              captures: { p3_first: "$.data[0].id" }
            - call: "GET /warranty-claims?dealer_id=${dlr_a}"
              payload: {}
              as: WarrantyAdministrator
              as_user_id: "WA-1"
            - call: "GET /warranty-claims"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_b}"
              captures: { own_first: "$.data[0].id" }
          assert:
            - "the first call returns total_count 3, has_more true, limit 2, offset 0, exactly two rows, and p1_first == ${c_ap1} (creation order)"
            - "the second call returns total_count 3, has_more false, exactly one row and p2_first == ${c_ap3}; the two pages are disjoint and together cover ${c_ap1}, ${c_ap2}, ${c_ap3}"
            - "no row on either page is ${c_st1}, ${c_st2} or ${c_b1}: the claim_type and dealer_id filters both bite, and the six claims are never mixed"
            - "ap1_status == APPROVED, so the third call now returns total_count 2, has_more false and p3_first == ${c_ap2} — the count follows current state and the approved row leaves the filtered set"
            - "the fifth call returns total_count 5 with limit 10 and offset 0 by default: dropping claim_type and status widens the same dealer filter"
            - "the sixth call returns total_count 1 with own_first == ${c_b1}: an entity-backed DealerPrincipal is scoped to its own rows even with no dealer_id filter supplied"

      - name: campaign_open_cascade_is_covered_by_the_transitive_cascade_instance
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ComponentLot.AVAILABLE_to_QUARANTINED
          - state_machines.ComponentInstallation.INSTALLED_to_RECALL_AFFECTED
          - state_machines.UnitBuild.recall_hold
          - state_machines.UnitOrder.ship_hold_reason
        excluded_because:
          difficulty_instance: recall_open_quarantines_lot_holds_build_and_order
          rationale: "The §1.8 instance already walks all four cascade hops end-to-end from POST /recall-campaigns/{id}/open — lot QUARANTINED, installation RECALL_AFFECTED, build recall_hold, order ship_hold_reason RECALL_HOLD — and checks the ordering sensitivity and the remedy that unwinds it. A corner-level restatement would test nothing further."

      - name: invoice_variant_switch_is_covered_by_the_dual_variant_instance
        claim_type: dual_variant_calculation
        grounds:
          - calculations.dealer_invoice_amount
        excluded_because:
          difficulty_instance: invoice_provisional_at_submit_versus_final_at_ship_diverge_on_one_unit
          rationale: "The §1.8 instance drives both PROVISIONAL_AT_SUBMIT and FINAL_AT_SHIP over the same unit and pins the exact delta produced by overtime hours, rework and the quality credit. The corner claim would be the same two numbers with fewer moving parts."

      - name: chassis_selector_policy_is_covered_by_the_margin_boundary_instance
        claim_type: selector_policy
        grounds:
          - calculations.chassis_match_selection
        excluded_because:
          difficulty_instance: chassis_gvwr_margin_boundary_admits_23420_and_skips_23419
          rationale: "The §1.8 instance already pins the eligibility predicate and the deterministic three-key ranking of the selector at its exact boundary; the corner version would only re-run the ranking one candidate wide."

      - name: daily_close_checkpoint_is_covered_by_the_slot_expiry_instance
        claim_type: ops_run_checkpoint
        grounds:
          - endpoints.POST /daily-close
        excluded_because:
          difficulty_instance: daily_close_slot_expiry_releases_order_and_chassis
          rationale: "The §1.8 instance runs the checkpoint over a mixed population (one expired slot, one still inside its 72-hour window, one already consumed), checks the returned run summary counts and shows the sweep is idempotent on a second run within the same logical day."

  # ---------------------------------------------------------------------------
  # Consistency model — complexity_profile.consistency_model: immediate
  # ---------------------------------------------------------------------------
  - section: consistency model
    instances:
      - name: derived_dealer_positions_are_readable_in_the_same_response_and_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.dealer_credit_utilization
          - calculations.dealer_slot_entitlement
          - entities.Dealer.allocation_hours_consumed
        distinguishing_aspect: "Every computed Dealer position is asserted twice — once inside the mutating call's own response body and once in the very next read, with no intervening write and no re-computation trigger — so no derived field is allowed to lag behind the write that moved it."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; TOW kit with LINE-T (240.00 daily hours, so plant_month_hours 4800.00) and dealer D-TOW at 1500 bp with a 100000000 cent credit line."
            - "One STOCK order on [OPT-E1] is submitted (required_station_hours 41.00, provisional_invoice_cents 6620350)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-CH", name: "Cascade Chassis Works", component_categories: ["CHASSIS"] }
              as: PlantAdmin
              captures: { sup_ch: $.data.id }
            - call: "POST /floor-plans"
              payload: { model_code: "FP-TOW", chassis_class: "TOWABLE", length_ft: 28, base_msrp_cents: 8000000, base_station_hours: 40.00, base_dry_weight_lbs: 6000, gvwr_lbs: 9000, required_wheelbase_in: 180, electrical_service_amps: 50, fresh_water_capacity_gal: 60 }
              as: PlantAdmin
              captures: { fp_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-E1", category: "ELECTRICAL", install_station: "ROUGH_IN", price_cents: 100000, weight_lbs: 0, added_station_hours: 1.00, amp_draw: 20, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_e1_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-TOW", region: "CENTRAL", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_id: $.data.id }
            - call: "POST /production-lines"
              payload: { line_code: "LINE-T", chassis_class_supported: "TOWABLE", daily_station_hour_capacity: 240.00, max_units_per_day: 4 }
              as: PlantAdmin
              captures: { line_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "${fp_id}", order_type: "STOCK", selected_option_ids: ["${opt_e1_id}"], requested_delivery_date: "2026-10-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /unit-orders/${ord_id}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { ord_v: $.data.version, prov: $.data.provisional_invoice_cents }
          trigger:
            - call: "POST /unit-orders/${ord_id}/production-slots"
              payload: { line_id: "${line_id}", slot_date: "2026-08-05T00:00:00Z", expected_unit_order_version: "${ord_v}" }
              as: ProductionScheduler
              captures: { hours_committed: $.data.station_hours_committed }
            - call: "GET /dealers/${dlr_id}"
              payload: {}
              as: PlantAdmin
              captures: { hours_1: $.data.allocation_hours_consumed, slots_1: $.data.allocation_slots_reserved, ent_1: $.data.entitlement_hours }
            - call: "POST /unit-orders/${ord_id}/request-funding"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { fin_req: $.data.financing_status }
            - call: "POST /unit-orders/${ord_id}/funding-decision"
              payload: { decision: "APPROVED" }
              as: PlantAdmin
              captures: { principal: $.data.financed_principal_cents, fin_funded: $.data.financing_status }
            - call: "GET /dealers/${dlr_id}"
              payload: {}
              as: PlantAdmin
              captures: { exposure_1: $.data.financed_exposure_cents, util_1: $.data.credit_utilization_bp, cs_1: $.data.credit_status }
            - call: "POST /unit-orders/${ord_id}/floor-plan-payment"
              payload: { amount_cents: 1000000 }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { paid: $.data.curtailment_paid_cents }
            - call: "GET /dealers/${dlr_id}"
              payload: {}
              as: PlantAdmin
              captures: { exposure_2: $.data.financed_exposure_cents, util_2: $.data.credit_utilization_bp }
            - call: "POST /production-lines/${line_id}/status"
              payload: { status: "PAUSED" }
              as: ProductionScheduler
              captures: { line_status: $.data.status }
            - call: "GET /dealers/${dlr_id}"
              payload: {}
              as: PlantAdmin
              captures: { ent_2: $.data.entitlement_hours }
          assert:
            - "prov == 6620350 in the submit response itself — the provisional invoice is not deferred to a later read"
            - "hours_committed == 41.00 in the slot response, and the immediately following read shows hours_1 == 41.00 and slots_1 == 1 with no sweep or close in between"
            - "ent_1 == 720.00 in that same read: 4800.00 plant month hours at 1500 bp"
            - "fin_req == FUNDING_REQUESTED and then fin_funded == FLOOR_PLAN_FUNDED with principal == 5958315 inside the decision response"
            - "exposure_1 == 5958315 with util_1 == 595 and cs_1 == GOOD_STANDING in the next read — the exposure roll-up is visible without any recomputation call"
            - "paid == 1000000 in the payment response, and exposure_2 == 4958315 with util_2 == 495 in the next read"
            - "line_status == PAUSED, and ent_2 == 720.00 immediately afterwards: PAUSED lines still count toward plant capacity, and the entitlement is recomputed on read rather than stored"
            - "no assertion in this recipe needs a retry, a delay or a second read of the same value: consistency_model immediate means the first read after the write is already correct"
