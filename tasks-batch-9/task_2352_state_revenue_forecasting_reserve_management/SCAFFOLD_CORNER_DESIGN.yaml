          trigger:
            - { call: "POST /disagreement-records/${dis}/resolve", payload: { resolution_method: "MIDPOINT", rationale: "Splitting the difference between the two filed PIT estimates." }, as: ForecastDirector, as_user_id: "leg-eco-1", captures: { err: $.data.error_id } }
            - { call: "POST /disagreement-records/${dis}/resolve", payload: { resolution_method: "MIDPOINT", rationale: "Splitting the difference between the two filed PIT estimates." }, as: ForecastDirector, as_user_id: "dir-1", captures: { resolved: $.data.resolved_amount_cents } }
          assert:
