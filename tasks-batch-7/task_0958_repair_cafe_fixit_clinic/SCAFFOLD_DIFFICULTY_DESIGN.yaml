            - { call: "POST /api/stations", payload: { event_id: "${ev}", category: "ELECTRONICS", label: "E1", capacity: 1 }, as: Coordinator, captures: { st: $.data.id } }
            - { call: "POST /api/fixer-profiles", payload: { display_name: "Fixer A", email: "a@x.com", safety_induction_completed_at: "2026-01-01T00:00:00Z" }, as: Coordinator, captures: { fa: $.data.id } }
            - { call: "POST /api/fixer-skills", payload: { fixer_id: "${fa}", category: "ELECTRONICS", level: 4 }, as: Coordinator }
