# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_1644_office_sublease_assignment_administration
# =============================================================================
# Fixture shorthand (identical to §1.8 header): clock default 2026-08-01T00:00:00.000Z;
# standard building total_rentable_sf 200000 loss_factor_bps 1200; standard lease
# base 5200 c/RSF/yr, window 5bd, deemed enabled, tiers 5000bps/10,000,000c/7500bps;
# standard measurement METHOD_A usable 8000 -> RSF 8960, prorata 448bps.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: party_creation_and_retrieval_roundtrip
        claim_type: creation
        grounds: ["entities.Party", "endpoints.POST_/sublease-admin/parties", "endpoints.GET_/sublease-admin/parties/{id}"]
        distinguishing_aspect: "POST with all required fields returns 201 with system-minted id/version; GET returns the stored row with identical field values."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Landlord One LLC", party_kind: "LANDLORD", credit_rating_bps: 9000 }
              as: AssetManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /sublease-admin/parties/${p_id}"
              payload: {}
              as: AssetManager
          assert:
            - "Party.${p_id}.legal_name == 'Landlord One LLC'"
            - "Party.${p_id}.party_kind == LANDLORD"
            - "Party.${p_id}.credit_rating_bps == 9000"
            - "Party.${p_id}.version == 1 and created_at is not null"

      - name: party_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Party.fields.party_kind", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input field party_kind is rejected with ERR_INVALID_REQUEST (400); no row is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "No Kind Co", credit_rating_bps: 5000 }
              as: AssetManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /sublease-admin/parties list remains empty"

      - name: party_invalid_enum_value_rejected
        claim_type: type_constraints
        grounds: ["entities.Party.fields.party_kind", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "party_kind outside {LANDLORD,TENANT,SUBTENANT,ASSIGNEE} rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Bad Enum Co", party_kind: "BROKER", credit_rating_bps: 5000 }
              as: AssetManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: lease_system_fields_ignore_client_input
        claim_type: system_fields
        grounds: ["entities.Lease", "entities.Lease.fields.status"]
        distinguishing_aspect: "Client cannot inject id/created_at/version/status/cumulative_profit_share_cents at lease creation; server mints id, sets status=ACTIVE, counters 0, version 1."
        test_recipe:
          setup: ["building and parties exist"]
          setup_api_calls:
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Landlord One LLC", party_kind: "LANDLORD", credit_rating_bps: 9000 }
              as: AssetManager
              captures: { pl_id: $.data.id }
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Tenant Alpha Inc", party_kind: "TENANT", credit_rating_bps: 8000 }
              as: AssetManager
              captures: { pt_id: $.data.id }
            - call: "POST /sublease-admin/buildings"
              payload: { name: "Tower One", total_rentable_sf: 200000, loss_factor_bps: 1200 }
              as: AssetManager
              captures: { bld_id: $.data.id }
          trigger:
            - call: "POST /sublease-admin/leases"
              payload: { building_id: "${bld_id}", tenant_party_id: "${pt_id}", landlord_party_id: "${pl_id}", base_rent_per_rsf_annual_cents: 5200, leased_rsf: 10000, consent_window_business_days: 5, deemed_approval_enabled: true, profit_share_tier1_pct_bps: 5000, profit_share_tier1_threshold_annual_cents: 10000000, profit_share_tier2_pct_bps: 7500 }
              as: AssetManager
              captures: { lease_id: $.data.id }
          assert:
            - "Lease.${lease_id}.status == ACTIVE (system-set)"
            - "Lease.${lease_id}.cumulative_profit_share_cents == 0"
            - "Lease.${lease_id}.open_transfer_count == 0"
            - "Lease.${lease_id}.version == 1"

      - name: lease_get_not_found_returns_404
        claim_type: not_found
        grounds: ["entities.Lease", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /sublease-admin/leases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AssetManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: lease_list_pagination_defaults
        claim_type: listing
        grounds: ["response_envelope", "endpoints.GET_/sublease-admin/leases"]
        distinguishing_aspect: "List endpoint returns data as array plus pagination fields limit/offset/total_count/has_more with defaults limit=10 offset=0."
        test_recipe:
          setup: ["two leases exist"]
          setup_api_calls:
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Landlord One LLC", party_kind: "LANDLORD", credit_rating_bps: 9000 }
              as: AssetManager
              captures: { pl_id: $.data.id }
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Tenant Alpha Inc", party_kind: "TENANT", credit_rating_bps: 8000 }
              as: AssetManager
              captures: { pt_id: $.data.id }
            - call: "POST /sublease-admin/buildings"
              payload: { name: "Tower One", total_rentable_sf: 200000, loss_factor_bps: 1200 }
              as: AssetManager
              captures: { bld_id: $.data.id }
            - call: "POST /sublease-admin/leases"
              payload: { building_id: "${bld_id}", tenant_party_id: "${pt_id}", landlord_party_id: "${pl_id}", base_rent_per_rsf_annual_cents: 5200, leased_rsf: 10000, consent_window_business_days: 5, deemed_approval_enabled: true, profit_share_tier1_pct_bps: 5000, profit_share_tier1_threshold_annual_cents: 10000000, profit_share_tier2_pct_bps: 7500 }
              as: AssetManager
            - call: "POST /sublease-admin/leases"
              payload: { building_id: "${bld_id}", tenant_party_id: "${pt_id}", landlord_party_id: "${pl_id}", base_rent_per_rsf_annual_cents: 6000, leased_rsf: 5000, consent_window_business_days: 10, deemed_approval_enabled: false, profit_share_tier1_pct_bps: 2500, profit_share_tier1_threshold_annual_cents: 5000000, profit_share_tier2_pct_bps: 5000 }
              as: AssetManager
          trigger:
            - call: "GET /sublease-admin/leases?limit=1&offset=0"
              payload: {}
              as: AssetManager
          assert:
            - "response_type == array"
            - "data has exactly 1 row; total_count == 2; has_more == true; limit == 1; offset == 0"
            - "GET with limit=1&offset=1 returns the other lease and has_more == false"

      - name: demised_area_defaults_and_computed_fields
        claim_type: defaults
        grounds: ["entities.DemisedArea.fields.status", "entities.DemisedArea.fields.rentable_sf"]
        distinguishing_aspect: "New DemisedArea starts status=DRAFT (default) and computed fields rentable_sf/prorata_share_bps/is_partial_floor are populated by the server (provisional variant), ignoring any client-supplied values."
        test_recipe:
          setup: ["standard fixture: parties, building, lease, DRAFT transfer T1"]
          setup_api_calls:
            - call: "POST /sublease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: AssetManager
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Landlord One LLC", party_kind: "LANDLORD", credit_rating_bps: 9000 }
              as: AssetManager
              captures: { pl_id: $.data.id }
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Tenant Alpha Inc", party_kind: "TENANT", credit_rating_bps: 8000 }
              as: AssetManager
              captures: { pt_id: $.data.id }
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "SubOne Corp", party_kind: "SUBTENANT", credit_rating_bps: 7000 }
              as: AssetManager
              captures: { ps_id: $.data.id }
            - call: "POST /sublease-admin/buildings"
              payload: { name: "Tower One", total_rentable_sf: 200000, loss_factor_bps: 1200 }
              as: AssetManager
              captures: { bld_id: $.data.id }
            - call: "POST /sublease-admin/leases"
              payload: { building_id: "${bld_id}", tenant_party_id: "${pt_id}", landlord_party_id: "${pl_id}", base_rent_per_rsf_annual_cents: 5200, leased_rsf: 10000, consent_window_business_days: 5, deemed_approval_enabled: true, profit_share_tier1_pct_bps: 5000, profit_share_tier1_threshold_annual_cents: 10000000, profit_share_tier2_pct_bps: 7500 }
              as: AssetManager
              captures: { lease_id: $.data.id, lease_v0: $.data.version }
            - call: "POST /sublease-admin/leases/${lease_id}/transfer-requests"
              payload: { counterparty_id: "${ps_id}", transfer_type: "SUBLEASE", proposed_rent_per_rsf_annual_cents: 6400, term_start: "2026-09-01T00:00:00.000Z", term_end: "2027-08-31T00:00:00.000Z", marketing_period_days: 45, expected_lease_version: "${lease_v0}" }
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { tr_id: $.data.id }
          trigger:
            - call: "POST /sublease-admin/transfer-requests/${tr_id}/demised-areas"
              payload: { measurement_standard: "METHOD_A", usable_sf: 8000 }
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { da_id: $.data.id }
          assert:
            - "DemisedArea.${da_id}.status == DRAFT"
            - "DemisedArea.${da_id}.rentable_sf == 8960 (provisional computed, not client-supplied)"
            - "DemisedArea.${da_id}.prorata_share_bps == 448"
            - "DemisedArea.${da_id}.is_partial_floor == true"
            - "DemisedArea.${da_id}.superseded_by_id is null"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: transfer_initial_state_is_draft
        claim_type: initial_state
        grounds: ["state_machines.TransferRequest"]
        distinguishing_aspect: "A newly created TransferRequest has status DRAFT, submitted_at null, and consent_deadline null until submit."
        test_recipe:
          setup: ["standard fixture through lease creation"]
          setup_api_calls:
            - call: "POST /sublease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: AssetManager
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Landlord One LLC", party_kind: "LANDLORD", credit_rating_bps: 9000 }
              as: AssetManager
              captures: { pl_id: $.data.id }
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Tenant Alpha Inc", party_kind: "TENANT", credit_rating_bps: 8000 }
              as: AssetManager
              captures: { pt_id: $.data.id }
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "SubOne Corp", party_kind: "SUBTENANT", credit_rating_bps: 7000 }
              as: AssetManager
              captures: { ps_id: $.data.id }
            - call: "POST /sublease-admin/buildings"
              payload: { name: "Tower One", total_rentable_sf: 200000, loss_factor_bps: 1200 }
              as: AssetManager
              captures: { bld_id: $.data.id }
            - call: "POST /sublease-admin/leases"
              payload: { building_id: "${bld_id}", tenant_party_id: "${pt_id}", landlord_party_id: "${pl_id}", base_rent_per_rsf_annual_cents: 5200, leased_rsf: 10000, consent_window_business_days: 5, deemed_approval_enabled: true, profit_share_tier1_pct_bps: 5000, profit_share_tier1_threshold_annual_cents: 10000000, profit_share_tier2_pct_bps: 7500 }
              as: AssetManager
              captures: { lease_id: $.data.id, lease_v0: $.data.version }
          trigger:
            - call: "POST /sublease-admin/leases/${lease_id}/transfer-requests"
              payload: { counterparty_id: "${ps_id}", transfer_type: "ASSIGNMENT", proposed_rent_per_rsf_annual_cents: 6400, term_start: "2026-09-01T00:00:00.000Z", term_end: "2027-08-31T00:00:00.000Z", marketing_period_days: 45, expected_lease_version: "${lease_v0}" }
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { tr_id: $.data.id }
          assert:
            - "TransferRequest.${tr_id}.status == DRAFT"
            - "TransferRequest.${tr_id}.submitted_at is null"
            - "TransferRequest.${tr_id}.consent_deadline is null"
            - "TransferRequest.${tr_id}.broker_user_id == 'broker-1'"
            - "Lease.${lease_id}.open_transfer_count == 0 (DRAFT does not occupy the slot until submit)"

      - name: submit_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.TransferRequest.SUBMITTED_to_SUBMITTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submitting an already-SUBMITTED transfer fails with ERR_INVALID_STATE; idempotency is NOT granted to action endpoints — second trigger is an error, not a replay."
        test_recipe:
          setup: ["standard fixture; T1 SUBMITTED"]
          setup_api_calls:
            - call: "POST /sublease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: AssetManager
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Landlord One LLC", party_kind: "LANDLORD", credit_rating_bps: 9000 }
              as: AssetManager
              captures: { pl_id: $.data.id }
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Tenant Alpha Inc", party_kind: "TENANT", credit_rating_bps: 8000 }
              as: AssetManager
              captures: { pt_id: $.data.id }
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "SubOne Corp", party_kind: "SUBTENANT", credit_rating_bps: 7000 }
              as: AssetManager
              captures: { ps_id: $.data.id }
            - call: "POST /sublease-admin/buildings"
              payload: { name: "Tower One", total_rentable_sf: 200000, loss_factor_bps: 1200 }
              as: AssetManager
              captures: { bld_id: $.data.id }
            - call: "POST /sublease-admin/leases"
              payload: { building_id: "${bld_id}", tenant_party_id: "${pt_id}", landlord_party_id: "${pl_id}", base_rent_per_rsf_annual_cents: 5200, leased_rsf: 10000, consent_window_business_days: 5, deemed_approval_enabled: true, profit_share_tier1_pct_bps: 5000, profit_share_tier1_threshold_annual_cents: 10000000, profit_share_tier2_pct_bps: 7500 }
              as: AssetManager
              captures: { lease_id: $.data.id, lease_v0: $.data.version }
            - call: "POST /sublease-admin/leases/${lease_id}/transfer-requests"
              payload: { counterparty_id: "${ps_id}", transfer_type: "SUBLEASE", proposed_rent_per_rsf_annual_cents: 6400, term_start: "2026-09-01T00:00:00.000Z", term_end: "2027-08-31T00:00:00.000Z", marketing_period_days: 45, expected_lease_version: "${lease_v0}" }
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { tr_id: $.data.id }
            - call: "POST /sublease-admin/transfer-requests/${tr_id}/demised-areas"
              payload: { measurement_standard: "METHOD_A", usable_sf: 8000 }
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { da_id: $.data.id }
            - call: "POST /sublease-admin/demised-areas/${da_id}/certify"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
            - call: "POST /sublease-admin/transfer-requests/${tr_id}/submit"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
          trigger:
            - call: "POST /sublease-admin/transfer-requests/${tr_id}/submit"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "TransferRequest.${tr_id}.status remains SUBMITTED"

      - name: terminal_consent_denied_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.TransferRequest", "state_machines.ConsentReview"]
        distinguishing_aspect: "From terminal CONSENT_DENIED, withdraw/document/decide are all rejected ERR_INVALID_STATE; the review is terminal DENIED and cannot be re-decided."
        test_recipe:
          setup: ["standard fixture; T1 SUBMITTED; credit PASS; landlord DENIED with USE_CONFLICT"]
          setup_api_calls:
            - call: "POST /sublease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: AssetManager
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Landlord One LLC", party_kind: "LANDLORD", credit_rating_bps: 9000 }
              as: AssetManager
              captures: { pl_id: $.data.id }
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Tenant Alpha Inc", party_kind: "TENANT", credit_rating_bps: 8000 }
              as: AssetManager
              captures: { pt_id: $.data.id }
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "SubOne Corp", party_kind: "SUBTENANT", credit_rating_bps: 7000 }
              as: AssetManager
              captures: { ps_id: $.data.id }
            - call: "POST /sublease-admin/buildings"
              payload: { name: "Tower One", total_rentable_sf: 200000, loss_factor_bps: 1200 }
              as: AssetManager
              captures: { bld_id: $.data.id }
            - call: "POST /sublease-admin/leases"
              payload: { building_id: "${bld_id}", tenant_party_id: "${pt_id}", landlord_party_id: "${pl_id}", base_rent_per_rsf_annual_cents: 5200, leased_rsf: 10000, consent_window_business_days: 5, deemed_approval_enabled: true, profit_share_tier1_pct_bps: 5000, profit_share_tier1_threshold_annual_cents: 10000000, profit_share_tier2_pct_bps: 7500 }
              as: AssetManager
              captures: { lease_id: $.data.id, lease_v0: $.data.version }
            - call: "POST /sublease-admin/leases/${lease_id}/transfer-requests"
              payload: { counterparty_id: "${ps_id}", transfer_type: "SUBLEASE", proposed_rent_per_rsf_annual_cents: 6400, term_start: "2026-09-01T00:00:00.000Z", term_end: "2027-08-31T00:00:00.000Z", marketing_period_days: 45, expected_lease_version: "${lease_v0}" }
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { tr_id: $.data.id }
            - call: "POST /sublease-admin/transfer-requests/${tr_id}/demised-areas"
              payload: { measurement_standard: "METHOD_A", usable_sf: 8000 }
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { da_id: $.data.id }
            - call: "POST /sublease-admin/demised-areas/${da_id}/certify"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
            - call: "POST /sublease-admin/transfer-requests/${tr_id}/submit"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
            - call: "GET /sublease-admin/transfer-requests/${tr_id}/consent-review"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { cr_id: "$.data[0].id", cr_v0: "$.data[0].version" }
            - call: "GET /sublease-admin/transfer-requests/${tr_id}/credit-review"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { kr_id: "$.data[0].id" }
            - call: "POST /sublease-admin/credit-reviews/${kr_id}/attest"
              payload: { reviewed_credit_rating_bps: 7000 }
              as: TenantRepBroker
              as_user_id: "broker-2"
            - call: "POST /sublease-admin/consent-reviews/${cr_id}/decide"
              payload: { decision: "DENIED", denial_reason_code: "USE_CONFLICT", expected_consent_review_version: "${cr_v0}" }
              as: Landlord
              as_user_id: "${pl_id}"
          trigger:
            - call: "POST /sublease-admin/transfer-requests/${tr_id}/withdraw"
              payload: {}
              as: TenantRepBroker
              as_user_id: "broker-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (CONSENT_DENIED is terminal; withdraw is not an exit)"
            - "TransferRequest.${tr_id}.status remains CONSENT_DENIED"
            - "Lease.${lease_id}.open_transfer_count == 0 (decremented at denial)"

      - name: certify_revision_rejected_after_grant_document_pins_m1
        claim_type: precondition_enforcement
        grounds: ["state_machines.DemisedArea.DRAFT_to_CERTIFIED", "state_machines.TransferRequest.CONSENT_GRANTED_to_DOCUMENTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Guarded transition: DemisedArea certification is only valid while the parent transfer is in {DRAFT, SUBMITTED, CONSENT_PENDING}; after consent is granted the certify transition is rejected ERR_INVALID_STATE and documentation pins the pre-grant certified measurement M1 (version-pinning on approval)."
        test_recipe:
          setup: ["standard fixture; T1 CONSENT_GRANTED via express grant; M1 certified pre-grant; revision M2 created (supersedes M1) but certification is now locked"]
          setup_api_calls:
            - call: "POST /sublease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00.000Z" }
              as: AssetManager
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Landlord One LLC", party_kind: "LANDLORD", credit_rating_bps: 9000 }
              as: AssetManager
              captures: { pl_id: $.data.id }
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "Tenant Alpha Inc", party_kind: "TENANT", credit_rating_bps: 8000 }
              as: AssetManager
              captures: { pt_id: $.data.id }
            - call: "POST /sublease-admin/parties"
              payload: { legal_name: "SubOne Corp", party_kind: "SUBTENANT", credit_rating_bps: 7000 }
              as: AssetManager
              captures: { ps_id: $.data.id }
            - call: "POST /sublease-admin/buildings"
              payload: { name: "Tower One", total_rentable_sf: 200000, loss_factor_bps: 1200 }
              as: AssetManager
              captures: { bld_id: $.data.id }
            - call: "POST /sublease-admin/leases"
              payload: { building_id: "${bld_id}", tenant_party_id: "${pt_id}", landlord_party_id: "${pl_id}", base_rent_per_rsf_annual_cents: 5200, leased_rsf: 10000, consent_window_business_days: 5, deemed_approval_enabled: true, profit_share_tier1_pct_bps: 5000, profit_share_tier1_threshold_annual_cents: 10000000, profit_share_tier2_pct_bps: 7500 }
              as: AssetManager
              captures: { lease_id: $.data.id, lease_v0: $.data.version }
            - call: "POST /sublease-admin/leases/${lease_id}/transfer-requests"
