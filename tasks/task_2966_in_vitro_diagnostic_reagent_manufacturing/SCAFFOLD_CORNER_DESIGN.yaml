              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { bs_id: $.data.id, mean_at_limit: $.data.mean_bias_pct, max_at_limit: $.data.max_bias_pct, verdict_at_limit: $.data.equivalence_verdict }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /test-results"
              payload: { subject_type: "REAGENT_LOT", reagent_lot_id: "${rlq_id}", test_code: "ACTIVITY", measured_value: 101.1, reference_measured_value: 100.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
