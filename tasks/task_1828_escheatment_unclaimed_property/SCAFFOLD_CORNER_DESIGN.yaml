# =============================================================================
# Task 1828 — Escheatment & Unclaimed Property
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Sections and claim_type values follow references/claim-extraction-guide.md.
# Every recipe replays from empty-DB using only SCAFFOLD.yaml §1.5 endpoints.
# Logical clock default: 2026-08-01T00:00:00Z unless the recipe sets it.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: owner_create_missing_required_full_name_rejected
        claim_type: required_fields
        grounds:
          - "entities.Owner.fields.full_name"
          - "endpoints[POST /escheatment/owners]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "full_name is required input; omitting it yields 400 ERR_INVALID_REQUEST before any persistence."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /escheatment/owners", payload: { last_known_address: "1 Nowhere, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400; no Owner row created (subsequent GET /escheatment/owners total_count == 0)"

      - name: owner_create_defaults_and_system_fields
        claim_type: defaults
        grounds:
          - "entities.Owner.fields.deceased_date"
          - "entities.Owner"
        distinguishing_aspect: "Omitting optional deceased_date stores null; system stamps id/created_at/updated_at and version == 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /escheatment/owners", payload: { full_name: "Def Ault", last_known_address: "2 A St, Davis, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { oid: $.data.id, v: $.data.version, dd: $.data.deceased_date } }
          assert:
            - "201; deceased_date == null (default applied)"
            - "id is a server-minted UUID; created_at == updated_at (ISO8601, 3 fractional digits); version == 1"

      - name: property_create_system_field_input_ignored
        claim_type: system_fields
        grounds:
          - "entities.Property.fields.status"
          - "endpoints[POST /escheatment/properties]"
        distinguishing_aspect: "Client-supplied value for the system field status is ignored; the entity is created in initial state ACTIVE regardless."
        test_recipe:
          setup: ["Rule + owner exist so property creation is otherwise valid."]
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Sys Field", last_known_address: "3 B St, Davis, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
          trigger:
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 12345, last_contact_date: "2023-03-15", status: "DORMANT" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p_st: $.data.status, p_id: $.data.id } }
          assert:
            - "201; response status == ACTIVE (client-supplied DORMANT ignored); dormancy_date == null; version == 1"

      - name: dormancy_rule_defaults_applied
        claim_type: defaults
        grounds:
          - "entities.DormancyRule"
        distinguishing_aspect: "Every optional DormancyRule parameter lands its documented default when omitted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "TX", property_type: "CHECKING", dormancy_years: 5, effective_from: "2021-01-01" }, as: HolderAdmin, as_user_id: "ha-1", captures: { rid: $.data.id } }
            - { call: "GET /escheatment/dormancy-rules/${rid}", as: Any, captures: { th: $.data.dd_threshold_cents, wmin: $.data.dd_window_min_days, wmax: $.data.dd_window_max_days, bp: $.data.annual_interest_rate_bp, dp: $.data.daily_penalty_cents, gp: $.data.gross_daily_penalty_cents, gt: $.data.gross_negligence_day_threshold, cap: $.data.penalty_cap_pct, cut: $.data.report_cutoff_month_day, due: $.data.report_due_month_day, eto: $.data.effective_to } }
          assert:
            - "dd_threshold_cents == 5000; dd_window_min_days == 60; dd_window_max_days == 180"
            - "annual_interest_rate_bp == 1200; daily_penalty_cents == 10000; gross_daily_penalty_cents == 25000; gross_negligence_day_threshold == 30; penalty_cap_pct == 25"
            - "report_cutoff_month_day == 06-30; report_due_month_day == 11-01; effective_to == null (open-ended)"

      - name: contact_event_qualifies_and_last_contact_maintenance
        claim_type: computed_fields
        grounds:
          - "entities.ContactEvent.fields.qualifies_for_reactivation"
          - "entities.Property.fields.last_contact_date"
        distinguishing_aspect: "qualifies_for_reactivation is derived from contact_type (WITHDRAWAL/DEPOSIT/WRITTEN_CORRESPONDENCE/IN_PERSON qualify; LOGIN_VERIFIED/PHONE_VERIFIED do not), and property.last_contact_date is a max-accumulator that never regresses."
        test_recipe:
          setup: ["Rule, owner, and an ACTIVE property with last_contact_date 2023-03-15."]
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Con Tact", last_known_address: "4 C St, Davis, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 45000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /escheatment/properties/${p1}/contact-events", payload: { contact_type: "WITHDRAWAL", contact_date: "2026-05-05", evidence_ref: "wd-1" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { q1: $.data.qualifies_for_reactivation } }
            - { call: "GET /escheatment/properties/${p1}", as: Any, captures: { lc1: $.data.last_contact_date } }
            - { call: "POST /escheatment/properties/${p1}/contact-events", payload: { contact_type: "DEPOSIT", contact_date: "2024-01-01", evidence_ref: "dep-old" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { q2: $.data.qualifies_for_reactivation } }
            - { call: "POST /escheatment/properties/${p1}/contact-events", payload: { contact_type: "LOGIN_VERIFIED", contact_date: "2026-06-01", evidence_ref: "login-1" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { q3: $.data.qualifies_for_reactivation } }
            - { call: "GET /escheatment/properties/${p1}", as: Any, captures: { lc2: $.data.last_contact_date } }
          assert:
            - "WITHDRAWAL event: qualifies_for_reactivation == true; property.last_contact_date advances to 2026-05-05"
            - "Backdated DEPOSIT (2024-01-01): qualifies == true but last_contact_date stays 2026-05-05 (max-accumulator never regresses)"
            - "LOGIN_VERIFIED (2026-06-01): qualifies_for_reactivation == false; last_contact_date advances to 2026-06-01 — ALL contact events feed the max-accumulator, qualification only gates reactivation evidence"

      - name: property_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "endpoints[GET /escheatment/properties/{propertyId}]"
          - "errors[ERR_PROPERTY_NOT_FOUND]"
        distinguishing_aspect: "A well-formed but unknown UUID yields the resource-specific 404, not a generic error."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /escheatment/properties/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Any, captures: { err_id: $.data.error_id } }
          assert:
            - "http 404; error_id == ERR_PROPERTY_NOT_FOUND; response_type == error with meta present"

      - name: document_record_retention_until_computed
        claim_type: computed_fields
        grounds:
          - "entities.DocumentRecord.fields.retention_until"
        distinguishing_aspect: "retention_until is derived from artifact_type at creation: LETTER_COPY 5y, REPORT_FILE 10y, CLAIM_EVIDENCE 7y, REMITTANCE_RECEIPT 10y from the creation date."
        test_recipe:
          setup: ["Empty DB; clock at default 2026-08-01."]
          setup_api_calls: []
          trigger:
            - { call: "POST /escheatment/document-records", payload: { artifact_type: "LETTER_COPY", related_entity_type: "DueDiligenceLetter", related_entity_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { d1: $.data.retention_until } }
            - { call: "POST /escheatment/document-records", payload: { artifact_type: "REPORT_FILE", related_entity_type: "HolderReport", related_entity_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { d2: $.data.retention_until } }
            - { call: "POST /escheatment/document-records", payload: { artifact_type: "CLAIM_EVIDENCE", related_entity_type: "OwnerClaim", related_entity_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { d3: $.data.retention_until } }
            - { call: "POST /escheatment/document-records", payload: { artifact_type: "REMITTANCE_RECEIPT", related_entity_type: "Remittance", related_entity_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { d4: $.data.retention_until } }
          assert:
            - "LETTER_COPY -> retention_until 2031-08-01; CLAIM_EVIDENCE -> 2033-08-01; REPORT_FILE and REMITTANCE_RECEIPT -> 2036-08-01"
            - "All four records created REGISTERED with purged_at null"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: letter_initial_state_and_deadline
        claim_type: initial_state
        grounds:
          - "state_machines.DueDiligenceLetter"
          - "entities.DueDiligenceLetter.fields.response_deadline"
        distinguishing_aspect: "A created letter starts SENT with sent_date == clock date, response_deadline == sent_date + 30 days, applicable_due_date == 2026-11-01 for a 2026 dormancy."
        test_recipe:
          setup: ["CA SAVINGS property 60000c swept to DORMANT at default clock."]
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Ini Tial", last_known_address: "5 D St, Davis, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 60000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
          trigger:
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1", captures: { l_st: $.data.status, l_sent: $.data.sent_date, l_dead: $.data.response_deadline, l_due: $.data.applicable_due_date } }
          assert:
            - "status == SENT; sent_date == 2026-08-01; response_deadline == 2026-08-31; applicable_due_date == 2026-11-01"
            - "Property now DUE_DILIGENCE"

      - name: letter_mark_delivered_twice_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.DueDiligenceLetter.SENT_to_DELIVERED"
          - "errors[ERR_LETTER_NOT_ACTIONABLE]"
        distinguishing_aspect: "mark-delivered requires SENT; from DELIVERED the same trigger is an invalid transition (no self-loop)."
        test_recipe:
          setup: ["DORMANT property with a letter SENT."]
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Del Twice", last_known_address: "6 E St, Davis, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 60000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1", captures: { l1: $.data.id } }
            - { call: "POST /escheatment/due-diligence-letters/${l1}/mark-delivered", as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /escheatment/due-diligence-letters/${l1}/mark-delivered", as: ComplianceOfficer, as_user_id: "co-1", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_LETTER_NOT_ACTIONABLE (409); letter remains DELIVERED"

      - name: letter_undeliverable_makes_property_reportable
        claim_type: side_effect_execution
        grounds:
          - "state_machines.DueDiligenceLetter.DELIVERED_to_UNDELIVERABLE"
          - "state_machines.Property.DUE_DILIGENCE_to_REPORTABLE"
        distinguishing_aspect: "mark-undeliverable is the non-sweep path to REPORTABLE: letter goes terminal UNDELIVERABLE and the property advances in the same request."
        test_recipe:
          setup: ["DORMANT property 60000c with letter SENT, then DELIVERED."]
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Undel Iver", last_known_address: "7 F St, Davis, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 60000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1", captures: { l1: $.data.id } }
            - { call: "POST /escheatment/due-diligence-letters/${l1}/mark-delivered", as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /escheatment/due-diligence-letters/${l1}/mark-undeliverable", as: ComplianceOfficer, as_user_id: "co-1", captures: { l_st: $.data.status } }
            - { call: "GET /escheatment/properties/${p1}", as: Any, captures: { p_st: $.data.status } }
          assert:
            - "letter status == UNDELIVERABLE (terminal); property status == REPORTABLE in the same request (immediate consistency)"

      - name: letter_response_reactivates_property
        claim_type: valid_transition
        grounds:
          - "state_machines.DueDiligenceLetter.DELIVERED_to_RESPONDED"
          - "state_machines.Property.DUE_DILIGENCE_to_ACTIVE"
        distinguishing_aspect: "record-response requires a qualifying contact event dated on/after sent_date; success flips letter RESPONDED and property ACTIVE with response_contact_event_id pinned."
        test_recipe:
          setup: ["DORMANT property with DELIVERED letter (sent 2026-08-01); a WRITTEN_CORRESPONDENCE contact dated 2026-08-20."]
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Resp Onse", last_known_address: "8 G St, Davis, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 60000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1", captures: { l1: $.data.id } }
            - { call: "POST /escheatment/due-diligence-letters/${l1}/mark-delivered", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/properties/${p1}/contact-events", payload: { contact_type: "WRITTEN_CORRESPONDENCE", contact_date: "2026-08-20", evidence_ref: "letter-back-1" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { ev1: $.data.id } }
          trigger:
            - { call: "POST /escheatment/due-diligence-letters/${l1}/record-response", payload: { response_contact_event_id: "${ev1}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { l_st: $.data.status, l_resp: $.data.response_contact_event_id } }
            - { call: "GET /escheatment/properties/${p1}", as: Any, captures: { p_st: $.data.status, p_lc: $.data.last_contact_date } }
          assert:
            - "letter RESPONDED with response_contact_event_id == ${ev1}; property ACTIVE; last_contact_date == 2026-08-20"

      - name: sweep_expires_letter_and_advances_property
        claim_type: side_effect_execution
        grounds:
          - "calculations.letter_response_deadline"
          - "state_machines.DueDiligenceLetter.SENT_to_EXPIRED"
          - "state_machines.Property.DUE_DILIGENCE_to_REPORTABLE"
        distinguishing_aspect: "Expiry boundary: a sweep exactly ON the 30-day response deadline leaves the letter open; the next day's sweep expires it and advances the property — the automatic transition is only observable via the sweep."
        test_recipe:
          setup: ["DORMANT property 60000c with letter SENT at 2026-08-01 (deadline 2026-08-31)."]
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Exp Ire", last_known_address: "9 H St, Davis, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 60000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1", captures: { l1: $.data.id } }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "GET /escheatment/due-diligence-letters/${l1}", as: Any, captures: { st_deadline_day: $.data.status } }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
          trigger:
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1", captures: { exp_ids: $.data.expired_letter_ids, rep_ids: $.data.reportable_property_ids } }
            - { call: "GET /escheatment/due-diligence-letters/${l1}", as: Any, captures: { l_st: $.data.status } }
            - { call: "GET /escheatment/properties/${p1}", as: Any, captures: { p_st: $.data.status } }
          assert:
            - "Sweep on the deadline day 2026-08-31: letter still SENT (strictly-greater expiry comparison)"
            - "Sweep on 2026-09-01: letter EXPIRED, property REPORTABLE, and the sweep response lists both ids"

      - name: property_terminal_reunited_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Property"
          - "errors[ERR_PROPERTY_NOT_REACTIVATABLE]"
        distinguishing_aspect: "REUNITED is the sole terminal property state: reactivation from it is rejected and no transition leaves it."
        test_recipe:
          setup: ["CA SAVINGS property 100000c carried through report accept, remittance confirm, claim approve, and pay — property REUNITED."]
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Term Inal", last_known_address: "10 I St, Davis, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 100000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r1: $.data.id, r1_v1: $.data.version } }
