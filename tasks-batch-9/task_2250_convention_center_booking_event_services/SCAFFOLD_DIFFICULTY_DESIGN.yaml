            - "EventSettlement.${set_id}.revision_round == 0"

      - name: facility_fee_tier_reselected_on_lower_subtotal_yields_higher_fee
        grounds:
          - calculations.facility_service_fee
          - calculations.settlement_line_extension
          - state_machines.EventSettlement.DISPUTED_to_ISSUED
          - entities.SettlementLineItem.fields.line_kind
        distinguishing_aspect: |
          Mode (c) tier boundary combined with an interaction: a credit ADJUSTMENT of -600000
          drops line_subtotal_cents from 5400000 to 4800000, which crosses FEE_TIER_1_CENTS
          downward and raises facility_service_fee_cents from 378000 to 432000. Keying the
          tier on grand_total_cents (5232000) would have kept FEE_PCT_MID and produced
          336000, so the fee must rise while the subtotal falls.
        test_recipe:
          setup:
            - "Ballroom B has daily_base_rate_cents 1200000 and the CONSUMER_SHOW window has rental_discount_pct 0.0"
            - "the booking runs move-in 2027-06-08, show 2027-06-10 to 2027-06-12, move-out 2027-06-13, so contracted_rental_cents is 5400000 and deposit_required_cents is 1350000"
            - "the booking is CLOSED at logical clock 2027-06-14T09:00:00Z"
            - "an EventSettlement with basis CONTRACTED carries one RENTAL line of 5400000 and has been ISSUED, producing facility_service_fee_cents 378000 and grand_total_cents 5778000"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Ballroom B", space_class: "BALLROOM", rentable_sqft: 40000, daily_base_rate_cents: 1200000 }
              as: VenueAdmin
              captures: { sp_bb_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
