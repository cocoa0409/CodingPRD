  - section: state_machines
    instances:

      - name: every_machine_starts_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - "state_machines.InspectionTemplate.initial_state"
          - "state_machines.DowntimeEvent.initial_state"
          - "state_machines.PartRequisition.initial_state"
          - "state_machines.MaintenanceBulletin.initial_state"
          - "state_machines.IncidentReport.transitions.None_to_REPORTED"
          - "state_machines.OverhaulWorkOrder.initial_state"
        distinguishing_aspect: "Six freshly created rows report exactly DRAFT / OPEN / REQUESTED / ISSUED / REPORTED / SCHEDULED, with each machine's pre-transition fields still null (activated_at, ended_at, acknowledged_at, regulator_notification_due_at, recommissioned_at)."
        test_recipe:
          setup:
            - "One attraction with one component and one shop bay; one template, one downtime event, one requisition, one ADVISORY bulletin, one MINOR incident and one work order created in that order at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /park-ops/attractions"
              payload: { name: "Initial State Ride", park_area: "SKYLINE", manufacturer: "Intamin", model_code: "IS-1", ride_class: "THRILL", theoretical_hourly_capacity: 1000, min_operators_required: 2, parts_budget_cents: 9000000 }
