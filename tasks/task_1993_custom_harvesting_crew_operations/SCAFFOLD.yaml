# =============================================================================
# SCAFFOLD.yaml — task_1993_custom_harvesting_crew_operations
# Great Plains custom harvesting crew operations.
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 lives in
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1993. Custom Harvesting Crew Operations (Great Plains custom harvester):
  customer route & acreage commitment across states, machine/crew logistics &
  lodging, per-acre/per-bushel rate & fuel surcharge, weather delay &
  sequencing conflicts, grain cart/truck coordination & hauling add-on,
  machine breakdown & backup capacity, settlement & moisture-based
  adjustments, seasonal labor visas & housing

domain_name: custom-harvesting-crew-operations
api_prefix: /harvest

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency

  entity_topology: hierarchical
  state_machine_shape: branching

  relationship_patterns:
    - one_to_many
    - cross_aggregate

  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: HarvestSeason
    parent: null
    common_fields: true
    fields:
      - { name: season_year, type: integer, source: input, description: "Calendar year of the harvest season (e.g., 2026)" }
      - { name: diesel_baseline_per_gallon_cents, type: integer, source: input, description: "Baseline diesel price in cents per gallon used to compute fuel surcharge" }
      - { name: current_diesel_per_gallon_cents, type: integer, source: input, description: "Current diesel price in cents per gallon; editable while season is DRAFT or ACTIVE" }
      - { name: committed_acres_total, type: number, source: computed, default: 0, description: "Read-only sum of committed_acres across contracts whose status is COMMITTED or IN_PROGRESS or HARVESTED" }
      - { name: harvested_acres_total, type: number, source: computed, default: 0, description: "Read-only sum of actual_acres across route stops whose status is COMPLETED" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SETTLING | CLOSED" }

  - name: CustomerContract
    parent: HarvestSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> HarvestSeason.id" }
      - { name: grower_name, type: string, source: input, description: "Grower / farm business name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code for the fields under this contract (TX, OK, KS, NE, SD, ND)" }
      - { name: crop, type: enum, source: input, description: "WHEAT | CORN | SOYBEAN | SORGHUM" }
      - { name: rate_basis, type: enum, source: input, description: "PER_ACRE | PER_BUSHEL — drives which invoice variant is used at settlement" }
      - { name: rate_cents_per_acre, type: integer, source: input, description: "Cents charged per harvested acre when rate_basis = PER_ACRE; ignored for PER_BUSHEL" }
      - { name: rate_cents_per_bushel, type: integer, source: input, description: "Cents charged per delivered bushel when rate_basis = PER_BUSHEL; ignored for PER_ACRE" }
      - { name: committed_acres, type: number, source: input, description: "Total acres the grower commits for the season" }
      - { name: harvested_acres, type: number, source: computed, default: 0, description: "Read-only sum of actual_acres over this contract's route stops whose status = COMPLETED" }
      - { name: moisture_discount_total_cents, type: integer, source: computed, default: 0, description: "Read-only accumulated moisture discount across issued settlements for this contract" }
      - { name: status, type: enum, source: system, description: "DRAFT | COMMITTED | IN_PROGRESS | HARVESTED | SETTLED | CANCELLED" }

  - name: RouteStop
    parent: CustomerContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> CustomerContract.id" }
      - { name: season_id, type: string, source: system, description: "FK -> HarvestSeason.id (denormalized for filtering)" }
      - { name: planned_start_date, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD) of planned cutting start" }
      - { name: planned_end_date, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD) of planned cutting end, INCLUSIVE; must be >= planned_start_date" }
      - { name: planned_acres, type: number, source: input, description: "Acres scheduled at this stop" }
      - { name: actual_acres, type: number, source: input, default: 0, description: "Acres actually cut; editable only while stop is CUTTING or PAUSED_WEATHER" }
      - { name: sequence_index, type: integer, source: input, description: "Stop ordering within the season; unique per season across all contracts" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | EN_ROUTE | CUTTING | PAUSED_WEATHER | COMPLETED | SKIPPED" }

  - name: Machine
    parent: HarvestSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> HarvestSeason.id" }
      - { name: machine_kind, type: enum, source: input, description: "COMBINE | GRAIN_CART | TRUCK" }
      - { name: label, type: string, source: input, description: "Operator-facing label (e.g., 'Combine-03')" }
      - { name: daily_capacity_acres, type: number, source: input, description: "Max acres per day for COMBINE; ignored for other kinds but must be > 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ASSIGNED | IN_FIELD | DOWN | REPAIRING | RETIRED" }

  - name: CrewMember
    parent: HarvestSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> HarvestSeason.id" }
      - { name: full_name, type: string, source: input, description: "Worker legal name" }
      - { name: visa_type, type: enum, source: input, description: "US_CITIZEN | H2A | TN | PERMANENT_RESIDENT" }
      - { name: visa_expiry_date, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD); required for H2A and TN; ignored otherwise" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Regular hourly wage in cents" }
      - { name: requires_housing, type: boolean, source: input, default: true, description: "Whether the operator must provide lodging" }
      - { name: status, type: enum, source: system, description: "ONBOARDED | ACTIVE | RELEASED" }

  - name: MachineAssignment
    parent: RouteStop
    common_fields: true
    fields:
      - { name: route_stop_id, type: string, source: system, description: "FK -> RouteStop.id" }
      - { name: machine_id, type: string, source: input, description: "FK -> Machine.id" }
      - { name: assigned_start_date, type: string, source: input, description: "ISO 8601 date the machine is committed to this stop (inclusive)" }
      - { name: assigned_end_date, type: string, source: input, description: "ISO 8601 date the machine is released from this stop (exclusive); half-open interval" }
      - { name: status, type: enum, source: system, description: "RESERVED | DEPLOYED | RELEASED | CANCELLED" }

  - name: DeliveryTicket
    parent: RouteStop
    common_fields: true
    fields:
      - { name: route_stop_id, type: string, source: system, description: "FK -> RouteStop.id" }
      - { name: contract_id, type: string, source: system, description: "FK -> CustomerContract.id (denormalized)" }
      - { name: delivered_at, type: string, source: input, description: "ISO 8601 timestamp of truck dump at the elevator" }
      - { name: gross_bushels, type: number, source: input, description: "Bushels on the scale ticket (pre-moisture adjustment)" }
      - { name: moisture_pct, type: number, source: input, description: "Measured grain moisture percent, one decimal place (e.g., 14.5)" }
      - { name: net_bushels, type: number, source: computed, description: "Read-only = gross_bushels * moisture_shrink_factor(moisture_pct)" }
      - { name: hauling_add_on_cents, type: integer, source: computed, description: "Read-only = ceil(gross_bushels) * HAULING_RATE_CENTS_PER_BUSHEL if stop used our trucks; else 0" }
      - { name: used_our_trucks, type: boolean, source: input, description: "Whether the harvester's trucks hauled this load (vs grower-hauled)" }

  - name: Settlement
    parent: CustomerContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> CustomerContract.id" }
      - { name: season_id, type: string, source: system, description: "FK -> HarvestSeason.id" }
      - { name: base_amount_cents, type: integer, source: computed, description: "Read-only = rate_basis-specific pricing over harvested acres or net bushels" }
      - { name: fuel_surcharge_cents, type: integer, source: computed, description: "Read-only = fuel surcharge on base_amount" }
      - { name: hauling_add_on_total_cents, type: integer, source: computed, description: "Read-only = sum of DeliveryTicket.hauling_add_on_cents for this contract" }
      - { name: moisture_discount_cents, type: integer, source: computed, description: "Read-only = moisture-based price reduction across tickets" }
      - { name: total_amount_cents, type: integer, source: computed, description: "Read-only = base + fuel_surcharge + hauling - moisture_discount, floor 0" }
      - { name: issued_at, type: string, source: system, description: "ISO 8601 timestamp when settlement was issued" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | DISPUTED | RESOLVED" }

  - name: LodgingReservation
    parent: RouteStop
    common_fields: true
    fields:
      - { name: route_stop_id, type: string, source: system, description: "FK -> RouteStop.id" }
      - { name: crew_member_id, type: string, source: input, description: "FK -> CrewMember.id" }
      - { name: stay_start_date, type: string, source: input, description: "ISO 8601 check-in date (inclusive)" }
      - { name: stay_end_date, type: string, source: input, description: "ISO 8601 check-out date (exclusive); half-open interval" }
      - { name: bed_count, type: integer, source: input, description: "Beds this reservation consumes; default 1" }
      - { name: status, type: enum, source: system, description: "BOOKED | CHECKED_IN | CHECKED_OUT | CANCELLED" }

  - name: LodgingSite
    parent: HarvestSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "FK -> HarvestSeason.id" }
      - { name: site_name, type: string, source: input, description: "Motel / bunkhouse / RV park identifier" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code where the site is located" }
      - { name: total_beds, type: integer, source: input, description: "Bed capacity; must be > 0" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: HarvestSeason
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /harvest/seasons/{seasonId}/activate"
        actor: HarvestOperator
        preconditions:
          - "Season must be in DRAFT (ERR_SEASON_NOT_DRAFT)"
          - "Season must reference at least one COMBINE machine in AVAILABLE status (ERR_NO_COMBINE_AVAILABLE)"
          - "diesel_baseline_per_gallon_cents and current_diesel_per_gallon_cents must both be > 0"
        side_effects: []

      - from: ACTIVE
        to: SETTLING
        trigger: "POST /harvest/seasons/{seasonId}/open-settlement"
        actor: HarvestOperator
        preconditions:
          - "Season must be in ACTIVE (ERR_SEASON_NOT_ACTIVE)"
          - "No RouteStop in this season may be in EN_ROUTE, CUTTING, or PAUSED_WEATHER (ERR_STOPS_STILL_RUNNING)"
        side_effects:
          - "All RouteStops still in SCHEDULED status at this moment transition to SKIPPED (side effect on each: their RESERVED MachineAssignments transition to CANCELLED, and each cancelled assignment releases its Machine back to AVAILABLE if the Machine was ASSIGNED and not allocated to any other RESERVED or DEPLOYED assignment)"

      - from: SETTLING
        to: CLOSED
        trigger: "POST /harvest/seasons/{seasonId}/close"
        actor: HarvestOperator
        preconditions:
          - "Season must be in SETTLING (ERR_SEASON_NOT_SETTLING)"
          - "Every Settlement whose contract belongs to this season must be in PAID or RESOLVED status (ERR_UNRESOLVED_SETTLEMENTS_EXIST)"
        side_effects:
          - "All Machines in this season transition to RETIRED"
          - "All CrewMembers in ACTIVE status transition to RELEASED"

  - entity: CustomerContract
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: COMMITTED
        trigger: "POST /harvest/contracts/{contractId}/commit"
        actor: GrowerLiaison
        preconditions:
          - "Contract must be in DRAFT (ERR_CONTRACT_NOT_DRAFT)"
          - "Parent HarvestSeason must be in DRAFT or ACTIVE (ERR_SEASON_NOT_OPEN_FOR_COMMIT)"
          - "committed_acres must be > 0"
        side_effects:
          - "HarvestSeason.committed_acres_total recomputed to include this contract"

      - from: COMMITTED
        to: IN_PROGRESS
        trigger: "system (automatic when any of its RouteStops transitions to CUTTING)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: HARVESTED
        trigger: "system (automatic when every RouteStop of this contract reaches COMPLETED or SKIPPED)"
        actor: system
        preconditions: []
        side_effects:
          - "Contract.harvested_acres recomputed as sum of actual_acres over COMPLETED stops"

      - from: HARVESTED
        to: SETTLED
        trigger: "system (automatic when this contract's Settlement transitions to PAID, or when its DISPUTED settlement transitions to RESOLVED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /harvest/contracts/{contractId}/cancel"
        actor: GrowerLiaison
        preconditions:
          - "Contract must be in DRAFT or COMMITTED (ERR_CONTRACT_NOT_CANCELLABLE)"
        side_effects:
          - "All RouteStops of this contract still in SCHEDULED status transition to SKIPPED; their RESERVED MachineAssignments transition to CANCELLED, releasing each Machine to AVAILABLE if it is not allocated elsewhere"
          - "HarvestSeason.committed_acres_total recomputed to exclude this contract"

      - from: COMMITTED
        to: CANCELLED
        trigger: "POST /harvest/contracts/{contractId}/cancel"
        actor: GrowerLiaison
        preconditions:
          - "Contract must be in DRAFT or COMMITTED"
        side_effects:
          - "Same cascade as DRAFT → CANCELLED"

  - entity: RouteStop
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, SKIPPED]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /harvest/route-stops/{stopId}/depart"
        actor: CrewBoss
        preconditions:
          - "Stop must be in SCHEDULED (ERR_STOP_NOT_SCHEDULED)"
          - "Parent HarvestSeason must be in ACTIVE (ERR_SEASON_NOT_ACTIVE)"
          - "Stop must have at least one MachineAssignment in RESERVED or DEPLOYED whose Machine.machine_kind = COMBINE (ERR_NO_COMBINE_ASSIGNED)"
          - "No other RouteStop in the same season with a strictly smaller sequence_index may still be in SCHEDULED, EN_ROUTE, CUTTING, or PAUSED_WEATHER (ERR_OUT_OF_SEQUENCE)"
        side_effects:
          - "All RESERVED MachineAssignments on this stop transition to DEPLOYED; their Machines transition from ASSIGNED to IN_FIELD"

      - from: EN_ROUTE
        to: CUTTING
        trigger: "POST /harvest/route-stops/{stopId}/start-cutting"
        actor: CrewBoss
        preconditions:
          - "Stop must be in EN_ROUTE (ERR_STOP_NOT_EN_ROUTE)"
          - "At least one DEPLOYED MachineAssignment on this stop whose Machine.status = IN_FIELD and Machine.machine_kind = COMBINE"
        side_effects:
          - "Parent CustomerContract transitions COMMITTED → IN_PROGRESS (system cascade)"

      - from: CUTTING
        to: PAUSED_WEATHER
        trigger: "POST /harvest/route-stops/{stopId}/pause-weather"
        actor: CrewBoss
        preconditions:
          - "Stop must be in CUTTING (ERR_STOP_NOT_CUTTING)"
        side_effects: []

      - from: PAUSED_WEATHER
        to: CUTTING
        trigger: "POST /harvest/route-stops/{stopId}/resume"
        actor: CrewBoss
        preconditions:
          - "Stop must be in PAUSED_WEATHER (ERR_STOP_NOT_PAUSED)"
        side_effects: []

      - from: CUTTING
        to: COMPLETED
        trigger: "POST /harvest/route-stops/{stopId}/complete"
        actor: CrewBoss
        preconditions:
          - "Stop must be in CUTTING (ERR_STOP_NOT_CUTTING)"
          - "actual_acres must be > 0"
          - "actual_acres must be <= planned_acres * 1.10 (ERR_ACRES_OVERRUN)"
        side_effects:
          - "All DEPLOYED MachineAssignments on this stop transition to RELEASED; their Machines transition IN_FIELD → AVAILABLE if the Machine is not allocated to any other DEPLOYED assignment, else stay IN_FIELD"
          - "All BOOKED or CHECKED_IN LodgingReservations on this stop transition to CHECKED_OUT"
          - "Parent CustomerContract.harvested_acres recomputed"
          - "If every RouteStop of the parent contract is in COMPLETED or SKIPPED, parent contract auto-transitions IN_PROGRESS → HARVESTED"
          - "HarvestSeason.harvested_acres_total recomputed"

      - from: SCHEDULED
        to: SKIPPED
        trigger: "POST /harvest/route-stops/{stopId}/skip"
        actor: HarvestOperator
        preconditions:
          - "Stop must be in SCHEDULED (ERR_STOP_NOT_SKIPPABLE)"
        side_effects:
          - "All RESERVED MachineAssignments transition to CANCELLED; Machines released to AVAILABLE if not allocated elsewhere"
          - "All BOOKED LodgingReservations transition to CANCELLED"

  - entity: Machine
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: ASSIGNED
        trigger: "system (when first RESERVED MachineAssignment is created against it)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ASSIGNED
        to: IN_FIELD
        trigger: "system (when any of its RESERVED assignments is deployed by RouteStop.depart)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_FIELD
        to: AVAILABLE
        trigger: "system (when its last DEPLOYED assignment is released)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_FIELD
        to: DOWN
        trigger: "POST /harvest/machines/{machineId}/report-breakdown"
        actor: CrewBoss
        preconditions:
          - "Machine must be in IN_FIELD (ERR_MACHINE_NOT_IN_FIELD)"
        side_effects:
          - "Every RouteStop that currently has a DEPLOYED assignment for this Machine AND is itself in CUTTING or PAUSED_WEATHER transitions to PAUSED_WEATHER"

      - from: DOWN
        to: REPAIRING
        trigger: "POST /harvest/machines/{machineId}/dispatch-repair"
        actor: HarvestOperator
        preconditions:
          - "Machine must be in DOWN (ERR_MACHINE_NOT_DOWN)"
        side_effects: []

      - from: REPAIRING
        to: AVAILABLE
        trigger: "POST /harvest/machines/{machineId}/return-to-service"
        actor: HarvestOperator
        preconditions:
          - "Machine must be in REPAIRING (ERR_MACHINE_NOT_REPAIRING)"
        side_effects:
          - "If any RouteStop was pushed into PAUSED_WEATHER by the report-breakdown side effect AND still has at least one other DEPLOYED COMBINE machine available, that stop is eligible to resume (operator must call resume explicitly)"

      - from: ASSIGNED
        to: AVAILABLE
        trigger: "system (when its last RESERVED assignment is cancelled)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AVAILABLE
        to: RETIRED
        trigger: "system (on season close)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CrewMember
    initial_state: ONBOARDED
    terminal_states: [RELEASED]
    transitions:
      - from: ONBOARDED
        to: ACTIVE
        trigger: "POST /harvest/crew-members/{crewId}/activate"
        actor: HarvestOperator
        preconditions:
          - "Crew member must be in ONBOARDED (ERR_CREW_NOT_ONBOARDED)"
          - "Parent HarvestSeason must be in DRAFT or ACTIVE"
          - "If visa_type is H2A or TN, visa_expiry_date must be strictly greater than the season's current logical date (ERR_VISA_EXPIRED)"
        side_effects: []

      - from: ACTIVE
        to: RELEASED
        trigger: "POST /harvest/crew-members/{crewId}/release"
        actor: HarvestOperator
        preconditions:
          - "Crew member must be in ACTIVE (ERR_CREW_NOT_ACTIVE)"
          - "Crew member must not have any LodgingReservation in BOOKED or CHECKED_IN status overlapping any future date (ERR_ACTIVE_LODGING_EXISTS)"
        side_effects:
          - "All future BOOKED LodgingReservations for this crew member transition to CANCELLED"

  - entity: MachineAssignment
    initial_state: RESERVED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: RESERVED
        to: DEPLOYED
        trigger: "system (on RouteStop.depart)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DEPLOYED
        to: RELEASED
        trigger: "system (on RouteStop.complete)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RESERVED
        to: CANCELLED
        trigger: "POST /harvest/machine-assignments/{assignmentId}/cancel OR system cascade from RouteStop.skip / contract cancel / season open-settlement"
        actor: CrewBoss
        preconditions:
          - "Assignment must be in RESERVED (ERR_ASSIGNMENT_NOT_RESERVED)"
        side_effects:
          - "If this was the last non-CANCELLED assignment for its Machine and the Machine was in ASSIGNED, the Machine transitions to AVAILABLE"

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [PAID, RESOLVED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /harvest/settlements/{settlementId}/issue"
        actor: BillingClerk
        preconditions:
          - "Settlement must be in DRAFT (ERR_SETTLEMENT_NOT_DRAFT)"
          - "Parent CustomerContract must be in HARVESTED (ERR_CONTRACT_NOT_HARVESTED)"
          - "Parent HarvestSeason must be in SETTLING (ERR_SEASON_NOT_SETTLING)"
        side_effects:
          - "Settlement.base_amount_cents, fuel_surcharge_cents, hauling_add_on_total_cents, moisture_discount_cents, total_amount_cents computed and frozen"
          - "Settlement.issued_at set to current logical clock"
          - "CustomerContract.moisture_discount_total_cents incremented by this settlement's moisture_discount_cents"

      - from: ISSUED
        to: PAID
        trigger: "POST /harvest/settlements/{settlementId}/mark-paid"
        actor: BillingClerk
        preconditions:
          - "Settlement must be in ISSUED (ERR_SETTLEMENT_NOT_ISSUED)"
        side_effects:
          - "Parent CustomerContract auto-transitions HARVESTED → SETTLED"

      - from: ISSUED
        to: DISPUTED
        trigger: "POST /harvest/settlements/{settlementId}/dispute"
        actor: GrowerLiaison
        preconditions:
          - "Settlement must be in ISSUED"
        side_effects: []

      - from: DISPUTED
        to: RESOLVED
        trigger: "POST /harvest/settlements/{settlementId}/resolve"
        actor: BillingClerk
        preconditions:
          - "Settlement must be in DISPUTED (ERR_SETTLEMENT_NOT_DISPUTED)"
          - "Payload must carry resolution_note (non-empty string)"
        side_effects:
          - "Parent CustomerContract auto-transitions HARVESTED → SETTLED"

  - entity: LodgingReservation
    initial_state: BOOKED
    terminal_states: [CHECKED_OUT, CANCELLED]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /harvest/lodging-reservations/{resId}/check-in"
        actor: CrewBoss
        preconditions:
          - "Reservation must be in BOOKED (ERR_RESERVATION_NOT_BOOKED)"
        side_effects: []

      - from: BOOKED
        to: CHECKED_OUT
        trigger: "system (cascade from RouteStop.complete)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "system (cascade from RouteStop.complete) OR POST /harvest/lodging-reservations/{resId}/check-out"
        actor: CrewBoss
        preconditions: []
        side_effects: []

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /harvest/lodging-reservations/{resId}/cancel OR system cascade"
        actor: CrewBoss
        preconditions:
          - "Reservation must be in BOOKED (ERR_RESERVATION_NOT_CANCELLABLE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: season-close-stale-version
    parent_entity: HarvestSeason
    write_endpoint: "POST /harvest/seasons/{seasonId}/close"
    occ_field: "expected_season_version"
    description: |
      Closing a HarvestSeason whose version has advanced since the client
      last observed it is rejected. This captures the case where another
      writer has just transitioned a Settlement to PAID or RESOLVED (which
      legitimately bumps the season's version via the contract-side cascade
      tracking) and the current writer's view of the season is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: settlement-issue-stale-contract
    parent_entity: CustomerContract
    write_endpoint: "POST /harvest/settlements/{settlementId}/issue"
    occ_field: "expected_contract_version"
    description: |
      Issuing a Settlement against a CustomerContract whose version has
      advanced since the client last observed it is rejected. This captures
      the case where a late DeliveryTicket was just posted against the
      contract (which bumps contract.version) and the issuer's computed
      totals would be based on stale ticket data.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: settlement_base_amount
    trigger: "Settlement.issue (transitions DRAFT → ISSUED)"
    algorithm: tiered_pricing
    formula: |
      Input set: all DeliveryTickets for this contract (no status filter —
      tickets are append-only).
      Let A = contract.harvested_acres (sum of actual_acres over COMPLETED
      RouteStops at issue time).
      Let NB = sum of ticket.net_bushels over all tickets for this contract.

      If contract.rate_basis == PER_ACRE:
        base_amount_cents = round_half_up(A * contract.rate_cents_per_acre)
      Else (rate_basis == PER_BUSHEL):
        # Tiered by NB:
        #   Tier 1: NB <= TIER1_BUSHELS            → rate = rate_cents_per_bushel
        #   Tier 2: TIER1_BUSHELS < NB             → first TIER1_BUSHELS at
        #                                          rate_cents_per_bushel,
        #                                          remainder at
        #                                          rate_cents_per_bushel *
        #                                          VOLUME_DISCOUNT_FACTOR
        if NB <= TIER1_BUSHELS:
          base_amount_cents = round_half_up(NB * contract.rate_cents_per_bushel)
        else:
          tier1_cents = TIER1_BUSHELS * contract.rate_cents_per_bushel
          tier2_cents = (NB - TIER1_BUSHELS) * contract.rate_cents_per_bushel * VOLUME_DISCOUNT_FACTOR
          base_amount_cents = round_half_up(tier1_cents + tier2_cents)
    input_set: "CustomerContract fields + DeliveryTicket rows for this contract"
    constants:
      TIER1_BUSHELS: 10000
      VOLUME_DISCOUNT_FACTOR: 0.9
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: per_acre
        when: "contract.rate_basis == PER_ACRE"
        difference: "Multiplies harvested_acres by rate_cents_per_acre; ignores bushels"
      - name: per_bushel
        when: "contract.rate_basis == PER_BUSHEL"
        difference: "Applies tiered bushel pricing; ignores harvested_acres"

  - name: fuel_surcharge
    trigger: "Settlement.issue (after settlement_base_amount)"
    algorithm: threshold
    formula: |
      Let baseline = season.diesel_baseline_per_gallon_cents
      Let current = season.current_diesel_per_gallon_cents AT THE MOMENT the
      contract transitioned COMMITTED → IN_PROGRESS (captured on the contract
      as part of side effects; for this scaffold we instead read the season's
      current value at issue time — see note below).
      delta_pct = (current - baseline) / baseline
      If delta_pct < SURCHARGE_THRESHOLD (i.e., strictly less than 0.10):
        fuel_surcharge_cents = 0
      Else:
        fuel_surcharge_cents = round_half_up(base_amount_cents * delta_pct * SURCHARGE_PASS_THROUGH)
    input_set: "HarvestSeason diesel prices + base_amount_cents from settlement_base_amount"
    constants:
      SURCHARGE_THRESHOLD: 0.10
      SURCHARGE_PASS_THROUGH: 0.5
    precision: "0 decimal places (integer cents), round_half_up"
    note: "The boundary is delta_pct >= 0.10 (strictly greater than or equal). A delta_pct of exactly 0.10 triggers the surcharge."

  - name: moisture_shrink_factor
    trigger: "DeliveryTicket creation"
    algorithm: threshold
    formula: |
      # Per-bushel shrink factor applied at ticket write time to derive net_bushels.
      # Uses a >= threshold with one-decimal moisture_pct.
      If moisture_pct <= MOISTURE_BASE_PCT:    # 15.0
        shrink_factor = 1.0
      Else:
        # Each 0.1 pct point above base shrinks by SHRINK_PER_TENTH
        # Cap moisture discount at MAX_SHRINK
        excess_tenths = round_half_up((moisture_pct - MOISTURE_BASE_PCT) * 10)
        shrink_factor = max(1.0 - excess_tenths * SHRINK_PER_TENTH, 1.0 - MAX_SHRINK)
      net_bushels = round(gross_bushels * shrink_factor, 1)  # one decimal, round_half_up
    input_set: "DeliveryTicket.moisture_pct and gross_bushels"
    constants:
      MOISTURE_BASE_PCT: 15.0
      SHRINK_PER_TENTH: 0.001
      MAX_SHRINK: 0.20
    precision: "net_bushels at 1 decimal place, round_half_up"

  - name: moisture_discount_cents
    trigger: "Settlement.issue (after settlement_base_amount, before total)"
    algorithm: aggregation
    formula: |
      # Moisture discount only applies when rate_basis == PER_ACRE (when
      # PER_BUSHEL, the shrink is already reflected in NB so a second
      # discount would double-count).
      If contract.rate_basis == PER_ACRE:
        discount = 0
        for each DeliveryTicket on this contract where moisture_pct > MOISTURE_BASE_PCT:
          excess_tenths = round_half_up((ticket.moisture_pct - MOISTURE_BASE_PCT) * 10)
          # discount per affected acre equivalent; we approximate per-ticket
          # by allocating the per-acre rate across the ticket's gross bushels
          # relative to contract-expected yield — pinned here as a flat
          # per-ticket penalty to keep the formula deterministic:
          discount += MOISTURE_DISCOUNT_PER_TENTH_CENTS * excess_tenths
        moisture_discount_cents = discount
      Else:
        moisture_discount_cents = 0
    input_set: "DeliveryTickets for this contract with moisture_pct > 15.0"
    constants:
      MOISTURE_BASE_PCT: 15.0
      MOISTURE_DISCOUNT_PER_TENTH_CENTS: 200
    precision: "0 decimal places (integer cents)"

  - name: settlement_total
    trigger: "Settlement.issue (last)"
    algorithm: aggregation
    formula: |
      # Order of evaluation is pinned: base → fuel → hauling → moisture.
      # Hauling is added BEFORE moisture discount is subtracted so the
      # discount does not erode the hauling recovery.
      total_amount_cents = max(
        base_amount_cents + fuel_surcharge_cents + hauling_add_on_total_cents - moisture_discount_cents,
        0
      )
    input_set: "the four settlement component fields"
    precision: "0 decimal places (integer cents)"

  - name: machine_overlap_check
    trigger: "MachineAssignment creation"
    algorithm: interval_merge
    formula: |
      # Half-open interval [assigned_start_date, assigned_end_date).
      # Reject if any existing non-CANCELLED, non-RELEASED MachineAssignment
      # for the same Machine has:
      #   existing.assigned_start_date < new.assigned_end_date
      #   AND new.assigned_start_date < existing.assigned_end_date
      # Adjacent (new.start == existing.end OR new.end == existing.start)
      # is ALLOWED (no overlap under half-open semantics).
    input_set: "MachineAssignment rows for the same machine in {RESERVED, DEPLOYED}"
    precision: "date-granular (day)"

  - name: lodging_bed_capacity_check
    trigger: "LodgingReservation creation"
    algorithm: aggregation
    formula: |
      # Aggregate-capacity semantics (different from machine_overlap_check):
      # beds are fungible — multiple reservations can share a night as long
      # as the sum of bed_count across overlapping BOOKED or CHECKED_IN
      # reservations for the same site does not exceed total_beds on any
      # calendar date in the requested stay range.
      # Nights are half-open [stay_start_date, stay_end_date).
      For each calendar date d in [new.stay_start_date, new.stay_end_date):
        occupied = sum(r.bed_count for r in reservations
                       where r.status in {BOOKED, CHECKED_IN}
                       and r.lodging_site_id == new.lodging_site_id
                       and r.stay_start_date <= d < r.stay_end_date)
        if occupied + new.bed_count > site.total_beds:
          reject with ERR_LODGING_CAPACITY_EXCEEDED
    input_set: "LodgingReservation rows for the site in BOOKED or CHECKED_IN"
    precision: "date-granular (night)"

  - name: hauling_add_on_per_ticket
    trigger: "DeliveryTicket creation"
    algorithm: aggregation
    formula: |
      If used_our_trucks:
        hauling_add_on_cents = round_half_up(gross_bushels * HAULING_RATE_CENTS_PER_BUSHEL)
      Else:
        hauling_add_on_cents = 0
    input_set: "DeliveryTicket.gross_bushels, used_our_trucks"
    constants:
      HAULING_RATE_CENTS_PER_BUSHEL: 12
    precision: "0 decimal places (integer cents), round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be permitted to perform this operation per RBAC"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Resource ids in path must exist, validated left-to-right (season → contract → stop → child)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all nested endpoints"

  - priority: 4
    category: state
    check: "Target resource must be in a state that permits this transition (per §1.2 from-state)"
    error_id: "ERR_{RESOURCE}_NOT_{REQUIRED_STATE} (varies by transition)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_safety
    check: "H2A/TN CrewMember visa_expiry_date must be strictly greater than current logical date at activation"
    error_id: ERR_VISA_EXPIRED
    http_status: 422
    applies_to: "POST /harvest/crew-members/{crewId}/activate"

  - priority: 6
    category: business_temporal
    check: "RouteStop departures must respect sequence_index ordering — no earlier-indexed stop still in SCHEDULED/EN_ROUTE/CUTTING/PAUSED_WEATHER"
    error_id: ERR_OUT_OF_SEQUENCE
    http_status: 409
    applies_to: "POST /harvest/route-stops/{stopId}/depart"

  - priority: 7
    category: business_temporal
    check: "MachineAssignment half-open [start,end) must not overlap another RESERVED/DEPLOYED assignment on the same Machine"
    error_id: ERR_MACHINE_OVERLAP
    http_status: 409
    applies_to: "POST /harvest/machine-assignments"

  - priority: 8
    category: business_temporal
    check: "LodgingReservation must not push any single-night occupancy above site.total_beds"
    error_id: ERR_LODGING_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /harvest/lodging-reservations"

  - priority: 9
    category: business_constraint
    check: "RouteStop actual_acres must be > 0 and <= planned_acres * 1.10 on complete"
    error_id: ERR_ACRES_OVERRUN
    http_status: 422
    applies_to: "POST /harvest/route-stops/{stopId}/complete"

  - priority: 10
    category: business_constraint
    check: "RouteStop must have at least one RESERVED or DEPLOYED COMBINE assignment before depart"
    error_id: ERR_NO_COMBINE_ASSIGNED
    http_status: 409
    applies_to: "POST /harvest/route-stops/{stopId}/depart"

  - priority: 11
    category: business_referential
    check: "Settlement.issue requires every RouteStop of the parent contract to be in COMPLETED or SKIPPED (i.e., contract HARVESTED)"
    error_id: ERR_CONTRACT_NOT_HARVESTED
    http_status: 409
    applies_to: "POST /harvest/settlements/{settlementId}/issue"

  - priority: 12
    category: business_fiscal
    check: "OCC: expected_season_version on close must match current HarvestSeason.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /harvest/seasons/{seasonId}/close"

  - priority: 13
    category: business_fiscal
    check: "OCC: expected_contract_version on issue must match current CustomerContract.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /harvest/settlements/{settlementId}/issue"

  - priority: 14
    category: business_fiscal
    check: "fuel_surcharge boundary: delta_pct >= 0.10 triggers surcharge; delta_pct < 0.10 yields 0"
    error_id: "(no error — boundary assertion, not a rejection)"
    http_status: 200
    applies_to: "POST /harvest/settlements/{settlementId}/issue"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving, mandatory when logical clock exists) ---
  - method: POST
    path: "/harvest/_clock/set_current_utc"
    description: "Advance the logical clock used by visa expiry, issued_at, and all date-based rules. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [HarvestOperator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- HarvestSeason ---
  - method: POST
    path: "/harvest/seasons"
    description: "Create a new HarvestSeason"
    roles: [HarvestOperator]
    code: 201
    input: [season_year, diesel_baseline_per_gallon_cents, current_diesel_per_gallon_cents]
    output: HarvestSeason
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/harvest/seasons"
    description: "List HarvestSeasons"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "HarvestSeason[]"
    side_effects: []

  - method: GET
    path: "/harvest/seasons/{seasonId}"
    description: "Get one HarvestSeason"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: []
    output: HarvestSeason
    side_effects: []

  - method: PATCH
    path: "/harvest/seasons/{seasonId}"
    description: "Update season diesel prices (only while DRAFT or ACTIVE)"
    roles: [HarvestOperator]
    code: 200
    input: ["current_diesel_per_gallon_cents?", "diesel_baseline_per_gallon_cents?"]
    output: HarvestSeason
    side_effects: ["increments HarvestSeason.version by 1"]

  - method: POST
    path: "/harvest/seasons/{seasonId}/activate"
    description: "Activate the season (DRAFT → ACTIVE)"
    roles: [HarvestOperator]
    code: 200
    input: []
    output: HarvestSeason
    side_effects: ["status → ACTIVE", "increments HarvestSeason.version by 1"]

  - method: POST
    path: "/harvest/seasons/{seasonId}/open-settlement"
    description: "Open settlement window (ACTIVE → SETTLING); skips still-SCHEDULED stops"
    roles: [HarvestOperator]
    code: 200
    input: []
    output: HarvestSeason
    side_effects: ["status → SETTLING", "cascade: SCHEDULED RouteStops → SKIPPED; their RESERVED assignments → CANCELLED; affected Machines → AVAILABLE if not allocated elsewhere", "increments HarvestSeason.version by 1"]

  - method: POST
    path: "/harvest/seasons/{seasonId}/close"
    description: "Close the season (SETTLING → CLOSED); OCC-guarded"
    roles: [HarvestOperator]
    code: 200
    input: [expected_season_version]
    output: HarvestSeason
    side_effects: ["status → CLOSED", "Machines → RETIRED", "CrewMembers ACTIVE → RELEASED", "increments HarvestSeason.version by 1"]

  # --- CustomerContract ---
  - method: POST
    path: "/harvest/seasons/{seasonId}/contracts"
    description: "Create a CustomerContract under a season"
    roles: [GrowerLiaison]
    code: 201
    input: [grower_name, state_code, crop, rate_basis, rate_cents_per_acre, rate_cents_per_bushel, committed_acres]
    output: CustomerContract
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/harvest/contracts"
    description: "List contracts (filterable by season_id and status)"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: ["season_id?", "status?", "limit?", "offset?"]
    output: "CustomerContract[]"
    side_effects: []

  - method: GET
    path: "/harvest/seasons/{seasonId}/contracts"
    description: "List contracts under a season"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "CustomerContract[]"
    side_effects: []

  - method: GET
    path: "/harvest/contracts/{contractId}"
    description: "Get one contract"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: []
    output: CustomerContract
    side_effects: []

  - method: POST
    path: "/harvest/contracts/{contractId}/commit"
    description: "Commit the contract (DRAFT → COMMITTED)"
    roles: [GrowerLiaison]
    code: 200
    input: []
    output: CustomerContract
    side_effects: ["status → COMMITTED", "recompute season.committed_acres_total", "increments CustomerContract.version by 1"]

  - method: POST
    path: "/harvest/contracts/{contractId}/cancel"
    description: "Cancel contract from DRAFT or COMMITTED"
    roles: [GrowerLiaison]
    code: 200
    input: []
    output: CustomerContract
    side_effects: ["status → CANCELLED", "SCHEDULED RouteStops → SKIPPED; their RESERVED assignments → CANCELLED; Machines released if unallocated", "increments CustomerContract.version by 1"]

  # --- RouteStop ---
  - method: POST
    path: "/harvest/contracts/{contractId}/route-stops"
    description: "Create a RouteStop under a contract"
    roles: [GrowerLiaison]
    code: 201
    input: [planned_start_date, planned_end_date, planned_acres, sequence_index]
    output: RouteStop
    side_effects: ["status = SCHEDULED"]

  - method: GET
    path: "/harvest/contracts/{contractId}/route-stops"
    description: "List stops for a contract"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "RouteStop[]"
    side_effects: []

  - method: GET
    path: "/harvest/route-stops"
    description: "List route stops; filterable by contract_id or season_id"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: ["contract_id?", "season_id?", "limit?", "offset?"]
    output: "RouteStop[]"
    side_effects: []

  - method: GET
    path: "/harvest/machines"
    description: "List machines; filterable by season_id"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: ["season_id?", "limit?", "offset?"]
    output: "Machine[]"
    side_effects: []

  - method: GET
    path: "/harvest/crew-members"
    description: "List crew members; filterable by season_id"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: ["season_id?", "limit?", "offset?"]
    output: "CrewMember[]"
    side_effects: []

  - method: GET
    path: "/harvest/delivery-tickets"
    description: "List delivery tickets; filterable by route_stop_id or contract_id"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: ["route_stop_id?", "contract_id?", "limit?", "offset?"]
    output: "DeliveryTicket[]"
    side_effects: []

  - method: GET
    path: "/harvest/settlements"
    description: "List settlements; filterable by contract_id or season_id"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: ["contract_id?", "season_id?", "limit?", "offset?"]
    output: "Settlement[]"
    side_effects: []

  - method: GET
    path: "/harvest/lodging-reservations"
    description: "List lodging reservations; filterable by route_stop_id or crew_member_id"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: ["route_stop_id?", "crew_member_id?", "limit?", "offset?"]
    output: "LodgingReservation[]"
    side_effects: []

  - method: GET
    path: "/harvest/lodging-sites"
    description: "List lodging sites; filterable by season_id"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: ["season_id?", "limit?", "offset?"]
    output: "LodgingSite[]"
    side_effects: []

  - method: GET
    path: "/harvest/route-stops/{stopId}"
    description: "Get one stop"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: []
    output: RouteStop
    side_effects: []

  - method: PATCH
    path: "/harvest/route-stops/{stopId}"
    description: "Update actual_acres (only while CUTTING or PAUSED_WEATHER)"
    roles: [CrewBoss]
    code: 200
    input: [actual_acres]
    output: RouteStop
    side_effects: ["increments RouteStop.version by 1"]

  - method: POST
    path: "/harvest/route-stops/{stopId}/depart"
    description: "Depart for stop (SCHEDULED → EN_ROUTE)"
    roles: [CrewBoss]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["RESERVED MachineAssignments → DEPLOYED; Machines ASSIGNED → IN_FIELD", "increments RouteStop.version by 1"]

  - method: POST
    path: "/harvest/route-stops/{stopId}/start-cutting"
    description: "Begin cutting (EN_ROUTE → CUTTING)"
    roles: [CrewBoss]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["contract COMMITTED → IN_PROGRESS cascade", "increments RouteStop.version by 1"]

  - method: POST
    path: "/harvest/route-stops/{stopId}/pause-weather"
    description: "Pause for weather (CUTTING → PAUSED_WEATHER)"
    roles: [CrewBoss]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["increments RouteStop.version by 1"]

  - method: POST
    path: "/harvest/route-stops/{stopId}/resume"
    description: "Resume from weather pause (PAUSED_WEATHER → CUTTING)"
    roles: [CrewBoss]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["increments RouteStop.version by 1"]

  - method: POST
    path: "/harvest/route-stops/{stopId}/complete"
    description: "Mark stop complete (CUTTING → COMPLETED)"
    roles: [CrewBoss]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["assignments DEPLOYED → RELEASED; machines released if not allocated", "lodging BOOKED/CHECKED_IN → CHECKED_OUT", "contract harvested_acres recomputed; if all stops terminal, contract IN_PROGRESS → HARVESTED", "increments RouteStop.version by 1"]

  - method: POST
    path: "/harvest/route-stops/{stopId}/skip"
    description: "Skip a SCHEDULED stop (→ SKIPPED)"
    roles: [HarvestOperator]
    code: 200
    input: []
    output: RouteStop
    side_effects: ["RESERVED assignments → CANCELLED; BOOKED lodging → CANCELLED", "increments RouteStop.version by 1"]

  # --- Machine ---
  - method: POST
    path: "/harvest/seasons/{seasonId}/machines"
    description: "Register a Machine"
    roles: [HarvestOperator]
    code: 201
    input: [machine_kind, label, daily_capacity_acres]
    output: Machine
    side_effects: ["status = AVAILABLE"]

  - method: GET
    path: "/harvest/seasons/{seasonId}/machines"
    description: "List machines for a season"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Machine[]"
    side_effects: []

  - method: GET
    path: "/harvest/machines/{machineId}"
    description: "Get one machine"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: []
    output: Machine
    side_effects: []

  - method: POST
    path: "/harvest/machines/{machineId}/report-breakdown"
    description: "Mark machine DOWN; pauses any CUTTING stop currently using it"
    roles: [CrewBoss]
    code: 200
    input: []
    output: Machine
    side_effects: ["status IN_FIELD → DOWN", "any RouteStop with a DEPLOYED assignment for this machine and status CUTTING or PAUSED_WEATHER transitions to PAUSED_WEATHER"]

  - method: POST
    path: "/harvest/machines/{machineId}/dispatch-repair"
    description: "DOWN → REPAIRING"
    roles: [HarvestOperator]
    code: 200
    input: []
    output: Machine
    side_effects: []

  - method: POST
    path: "/harvest/machines/{machineId}/return-to-service"
    description: "REPAIRING → AVAILABLE"
    roles: [HarvestOperator]
    code: 200
    input: []
    output: Machine
    side_effects: []

  # --- CrewMember ---
  - method: POST
    path: "/harvest/seasons/{seasonId}/crew-members"
    description: "Onboard a CrewMember"
    roles: [HarvestOperator]
    code: 201
    input: [full_name, visa_type, visa_expiry_date, hourly_rate_cents, "requires_housing?"]
    output: CrewMember
    side_effects: ["status = ONBOARDED"]

  - method: GET
    path: "/harvest/seasons/{seasonId}/crew-members"
    description: "List crew for a season"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "CrewMember[]"
    side_effects: []

  - method: GET
    path: "/harvest/crew-members/{crewId}"
    description: "Get one crew member"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: []
    output: CrewMember
    side_effects: []

  - method: POST
    path: "/harvest/crew-members/{crewId}/activate"
    description: "Activate crew (visa check)"
    roles: [HarvestOperator]
    code: 200
    input: []
    output: CrewMember
    side_effects: ["status ONBOARDED → ACTIVE"]

  - method: POST
    path: "/harvest/crew-members/{crewId}/release"
    description: "Release crew member"
    roles: [HarvestOperator]
    code: 200
    input: []
    output: CrewMember
    side_effects: ["status ACTIVE → RELEASED", "future BOOKED lodging → CANCELLED"]

  # --- MachineAssignment ---
  - method: POST
    path: "/harvest/machine-assignments"
    description: "Reserve a machine against a route stop"
    roles: [CrewBoss]
    code: 201
    input: [route_stop_id, machine_id, assigned_start_date, assigned_end_date]
    output: MachineAssignment
    side_effects: ["status = RESERVED", "machine AVAILABLE → ASSIGNED (if first active reservation)", "validates half-open overlap on the same machine"]

  - method: GET
    path: "/harvest/machine-assignments"
    description: "List assignments; filterable by route_stop_id or machine_id"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: ["route_stop_id?", "machine_id?", "limit?", "offset?"]
    output: "MachineAssignment[]"
    side_effects: []

  - method: GET
    path: "/harvest/machine-assignments/{assignmentId}"
    description: "Get one assignment"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: []
    output: MachineAssignment
    side_effects: []

  - method: POST
    path: "/harvest/machine-assignments/{assignmentId}/cancel"
    description: "Cancel a RESERVED assignment"
    roles: [CrewBoss]
    code: 200
    input: []
    output: MachineAssignment
    side_effects: ["status → CANCELLED", "machine ASSIGNED → AVAILABLE if no other active assignments"]

  # --- DeliveryTicket ---
  - method: POST
    path: "/harvest/route-stops/{stopId}/delivery-tickets"
    description: "Record a grain delivery"
    roles: [CrewBoss]
    code: 201
    input: [delivered_at, gross_bushels, moisture_pct, used_our_trucks]
    output: DeliveryTicket
    side_effects: ["computes net_bushels and hauling_add_on_cents at write time", "increments parent CustomerContract.version by 1 (so OCC on settlement issue observes late tickets)"]

  - method: GET
    path: "/harvest/route-stops/{stopId}/delivery-tickets"
    description: "List tickets for a stop"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "DeliveryTicket[]"
    side_effects: []

  - method: GET
    path: "/harvest/delivery-tickets/{ticketId}"
    description: "Get one ticket"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: []
    output: DeliveryTicket
    side_effects: []

  # --- Settlement ---
  - method: POST
    path: "/harvest/contracts/{contractId}/settlements"
    description: "Create a DRAFT settlement for a contract"
    roles: [BillingClerk]
    code: 201
    input: []
    output: Settlement
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/harvest/contracts/{contractId}/settlements"
    description: "List settlements for a contract"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Settlement[]"
    side_effects: []

  - method: GET
    path: "/harvest/settlements/{settlementId}"
    description: "Get one settlement"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: POST
    path: "/harvest/settlements/{settlementId}/issue"
    description: "Issue the settlement (computes & freezes all amount fields); OCC on contract version"
    roles: [BillingClerk]
    code: 200
    input: [expected_contract_version]
    output: Settlement
    side_effects: ["computes base/fuel/hauling/moisture/total", "status DRAFT → ISSUED", "increments Settlement.version by 1", "increments CustomerContract.moisture_discount_total_cents", "increments CustomerContract.version by 1"]

  - method: POST
    path: "/harvest/settlements/{settlementId}/mark-paid"
    description: "Mark ISSUED settlement PAID"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status ISSUED → PAID", "parent contract HARVESTED → SETTLED"]

  - method: POST
    path: "/harvest/settlements/{settlementId}/dispute"
    description: "Grower disputes an ISSUED settlement"
    roles: [GrowerLiaison]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status ISSUED → DISPUTED"]

  - method: POST
    path: "/harvest/settlements/{settlementId}/resolve"
    description: "Resolve a disputed settlement"
    roles: [BillingClerk]
    code: 200
    input: [resolution_note]
    output: Settlement
    side_effects: ["status DISPUTED → RESOLVED", "parent contract HARVESTED → SETTLED"]

  # --- LodgingSite ---
  - method: POST
    path: "/harvest/seasons/{seasonId}/lodging-sites"
    description: "Register a lodging site"
    roles: [HarvestOperator]
    code: 201
    input: [site_name, state_code, total_beds]
    output: LodgingSite
    side_effects: []

  - method: GET
    path: "/harvest/seasons/{seasonId}/lodging-sites"
    description: "List lodging sites for a season"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "LodgingSite[]"
    side_effects: []

  - method: GET
    path: "/harvest/lodging-sites/{siteId}"
    description: "Get one lodging site"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: []
    output: LodgingSite
    side_effects: []

  # --- LodgingReservation ---
  - method: POST
    path: "/harvest/route-stops/{stopId}/lodging-reservations"
    description: "Book beds for a crew member during a stop"
    roles: [CrewBoss]
    code: 201
    input: [crew_member_id, lodging_site_id, stay_start_date, stay_end_date, "bed_count?"]
    output: LodgingReservation
    side_effects: ["status = BOOKED", "validates per-night bed capacity"]

  - method: GET
    path: "/harvest/route-stops/{stopId}/lodging-reservations"
    description: "List lodging reservations for a stop"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "LodgingReservation[]"
    side_effects: []

  - method: GET
    path: "/harvest/lodging-reservations/{resId}"
    description: "Get one lodging reservation"
    roles: [HarvestOperator, CrewBoss, GrowerLiaison, BillingClerk]
    code: 200
    input: []
    output: LodgingReservation
    side_effects: []

  - method: POST
    path: "/harvest/lodging-reservations/{resId}/check-in"
    description: "BOOKED → CHECKED_IN"
    roles: [CrewBoss]
    code: 200
    input: []
    output: LodgingReservation
    side_effects: []

  - method: POST
    path: "/harvest/lodging-reservations/{resId}/check-out"
    description: "CHECKED_IN → CHECKED_OUT"
    roles: [CrewBoss]
    code: 200
    input: []
    output: LodgingReservation
    side_effects: []

  - method: POST
    path: "/harvest/lodging-reservations/{resId}/cancel"
    description: "BOOKED → CANCELLED"
    roles: [CrewBoss]
    code: 200
    input: []
    output: LodgingReservation
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted to perform this operation" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Generic request shape error (missing required field, bad type)" }

  # --- Not found ---
  - { id: ERR_SEASON_NOT_FOUND, http: 404, condition: "HarvestSeason id not found" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "CustomerContract id not found" }
  - { id: ERR_STOP_NOT_FOUND, http: 404, condition: "RouteStop id not found" }
  - { id: ERR_MACHINE_NOT_FOUND, http: 404, condition: "Machine id not found" }
  - { id: ERR_CREW_NOT_FOUND, http: 404, condition: "CrewMember id not found" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "MachineAssignment id not found" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "DeliveryTicket id not found" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "Settlement id not found" }
  - { id: ERR_LODGING_SITE_NOT_FOUND, http: 404, condition: "LodgingSite id not found" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "LodgingReservation id not found" }

  # --- State ---
  - { id: ERR_SEASON_NOT_DRAFT, http: 409, condition: "Season activation requires DRAFT" }
  - { id: ERR_SEASON_NOT_ACTIVE, http: 409, condition: "Operation requires season ACTIVE" }
  - { id: ERR_SEASON_NOT_SETTLING, http: 409, condition: "Operation requires season SETTLING" }
  - { id: ERR_NO_COMBINE_AVAILABLE, http: 409, condition: "Season activation requires at least one AVAILABLE COMBINE machine" }
  - { id: ERR_STOPS_STILL_RUNNING, http: 409, condition: "open-settlement requires no stops in EN_ROUTE/CUTTING/PAUSED_WEATHER" }
  - { id: ERR_UNRESOLVED_SETTLEMENTS_EXIST, http: 409, condition: "close requires every settlement PAID or RESOLVED" }
  - { id: ERR_CONTRACT_NOT_DRAFT, http: 409, condition: "commit requires contract DRAFT" }
  - { id: ERR_CONTRACT_NOT_CANCELLABLE, http: 409, condition: "cancel requires contract DRAFT or COMMITTED" }
  - { id: ERR_CONTRACT_NOT_HARVESTED, http: 409, condition: "settlement.issue requires contract HARVESTED" }
  - { id: ERR_SEASON_NOT_OPEN_FOR_COMMIT, http: 409, condition: "commit requires season DRAFT or ACTIVE" }
  - { id: ERR_STOP_NOT_SCHEDULED, http: 409, condition: "depart requires stop SCHEDULED" }
  - { id: ERR_STOP_NOT_EN_ROUTE, http: 409, condition: "start-cutting requires stop EN_ROUTE" }
  - { id: ERR_STOP_NOT_CUTTING, http: 409, condition: "complete or pause-weather requires stop CUTTING" }
  - { id: ERR_STOP_NOT_PAUSED, http: 409, condition: "resume requires stop PAUSED_WEATHER" }
  - { id: ERR_STOP_NOT_SKIPPABLE, http: 409, condition: "skip requires stop SCHEDULED" }
  - { id: ERR_MACHINE_NOT_IN_FIELD, http: 409, condition: "report-breakdown requires machine IN_FIELD" }
  - { id: ERR_MACHINE_NOT_DOWN, http: 409, condition: "dispatch-repair requires machine DOWN" }
  - { id: ERR_MACHINE_NOT_REPAIRING, http: 409, condition: "return-to-service requires machine REPAIRING" }
  - { id: ERR_CREW_NOT_ONBOARDED, http: 409, condition: "activate requires crew ONBOARDED" }
  - { id: ERR_CREW_NOT_ACTIVE, http: 409, condition: "release requires crew ACTIVE" }
  - { id: ERR_ACTIVE_LODGING_EXISTS, http: 409, condition: "release blocked by future BOOKED/CHECKED_IN reservation" }
  - { id: ERR_ASSIGNMENT_NOT_RESERVED, http: 409, condition: "cancel requires assignment RESERVED" }
  - { id: ERR_SETTLEMENT_NOT_DRAFT, http: 409, condition: "issue requires settlement DRAFT" }
  - { id: ERR_SETTLEMENT_NOT_ISSUED, http: 409, condition: "mark-paid or dispute requires settlement ISSUED" }
  - { id: ERR_SETTLEMENT_NOT_DISPUTED, http: 409, condition: "resolve requires settlement DISPUTED" }
  - { id: ERR_RESERVATION_NOT_BOOKED, http: 409, condition: "check-in requires reservation BOOKED" }
  - { id: ERR_RESERVATION_NOT_CANCELLABLE, http: 409, condition: "cancel requires reservation BOOKED" }

  # --- Business ---
  - { id: ERR_OUT_OF_SEQUENCE, http: 409, condition: "Earlier sequence_index stop is still active in this season" }
  - { id: ERR_MACHINE_OVERLAP, http: 409, condition: "Half-open interval overlap with another RESERVED/DEPLOYED assignment on the same machine" }
  - { id: ERR_LODGING_CAPACITY_EXCEEDED, http: 409, condition: "Sum of bed_count across overlapping reservations would exceed site.total_beds on some night" }
  - { id: ERR_ACRES_OVERRUN, http: 422, condition: "actual_acres must be > 0 and <= planned_acres * 1.10 on complete" }
  - { id: ERR_NO_COMBINE_ASSIGNED, http: 409, condition: "Stop lacks a RESERVED or DEPLOYED COMBINE assignment" }
  - { id: ERR_VISA_EXPIRED, http: 422, condition: "H2A/TN visa_expiry_date is not strictly greater than the current logical date" }

  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HarvestOperator
    description: "Owns the custom-harvesting business; full lifecycle control over the season, machines, crew, lodging"
    identity: "opaque"
    exclusive_operations:
      - "POST /harvest/_clock/set_current_utc"
      - "POST /harvest/seasons"
      - "PATCH /harvest/seasons/{id}"
      - "POST /harvest/seasons/{id}/activate"
      - "POST /harvest/seasons/{id}/open-settlement"
      - "POST /harvest/seasons/{id}/close"
      - "POST /harvest/seasons/{id}/machines"
      - "POST /harvest/seasons/{id}/crew-members"
      - "POST /harvest/crew-members/{id}/activate"
      - "POST /harvest/crew-members/{id}/release"
      - "POST /harvest/seasons/{id}/lodging-sites"
      - "POST /harvest/machines/{id}/dispatch-repair"
      - "POST /harvest/machines/{id}/return-to-service"
      - "POST /harvest/route-stops/{id}/skip"
    shared_operations:
      - "GET endpoints across all resources"

  - name: GrowerLiaison
    description: "Negotiates acreage commitments with growers; owns contract creation and lifecycle up to harvest"
    identity: "opaque"
    exclusive_operations:
      - "POST /harvest/seasons/{id}/contracts"
      - "POST /harvest/contracts/{id}/commit"
      - "POST /harvest/contracts/{id}/cancel"
      - "POST /harvest/contracts/{id}/route-stops"
      - "POST /harvest/settlements/{id}/dispute"
    shared_operations:
      - "GET endpoints across all resources"

  - name: CrewBoss
    description: "Field supervisor; drives stop execution, machine assignments, delivery tickets, lodging bookings"
    identity: "opaque"
    exclusive_operations:
      - "POST /harvest/route-stops/{id}/depart"
      - "POST /harvest/route-stops/{id}/start-cutting"
      - "POST /harvest/route-stops/{id}/pause-weather"
      - "POST /harvest/route-stops/{id}/resume"
      - "POST /harvest/route-stops/{id}/complete"
      - "PATCH /harvest/route-stops/{id}"
      - "POST /harvest/machine-assignments"
      - "POST /harvest/machine-assignments/{id}/cancel"
      - "POST /harvest/machines/{id}/report-breakdown"
      - "POST /harvest/route-stops/{id}/delivery-tickets"
      - "POST /harvest/route-stops/{id}/lodging-reservations"
      - "POST /harvest/lodging-reservations/{id}/check-in"
      - "POST /harvest/lodging-reservations/{id}/check-out"
      - "POST /harvest/lodging-reservations/{id}/cancel"
    shared_operations:
      - "GET endpoints across all resources"

  - name: BillingClerk
    description: "Back-office settlement processor; owns settlement draft/issue/paid/resolve"
    identity: "opaque"
    exclusive_operations:
      - "POST /harvest/contracts/{id}/settlements"
      - "POST /harvest/settlements/{id}/issue"
      - "POST /harvest/settlements/{id}/mark-paid"
      - "POST /harvest/settlements/{id}/resolve"
    shared_operations:
      - "GET endpoints across all resources"
