      - name: report_finalize_before_period_close_rejected
        claim_type: Temporal Validation
        grounds:
          - validations[priority=13]
          - errors.ERR_REPORT_PERIOD_OPEN
        distinguishing_aspect: "A report whose period_end lies in the future of the logical clock cannot be finalized: 409 ERR_REPORT_PERIOD_OPEN; after the clock passes period_end the same call succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15 (mid-period). Affiliate; DRAFT report over [2026-09-01, 2026-10-01)."
          setup_api_calls:
            - *c_clock
            - *c_aff
            - call: "POST /family-planning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: GrantAdministrator
            - call: "POST /family-planning/affiliates/${c_aff_id}/grant-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", valuation_variant: "FIFO", expected_affiliate_version: "${c_aff_v}" }
              as: GrantAdministrator
              captures: { c_repp_id: $.data.id }
          trigger:
            - call: "POST /family-planning/grant-reports/${c_repp_id}/finalize"
              payload: {}
              as: GrantAdministrator
              captures: { err_id: $.data.error_id }
            - call: "POST /family-planning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: GrantAdministrator
            - call: "POST /family-planning/grant-reports/${c_repp_id}/finalize"
              payload: {}
              as: GrantAdministrator
          assert:
            - "first finalize: status 409 and error_id == ERR_REPORT_PERIOD_OPEN, report still DRAFT"
            - "after clock reaches period_end exactly (2026-10-01T00:00:00Z): finalize succeeds, status FINALIZED"

