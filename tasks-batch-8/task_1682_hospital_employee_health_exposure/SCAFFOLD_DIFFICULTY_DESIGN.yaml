# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Hospital Employee Health & Exposure Management
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: titer_quantitative_vs_qualitative_divergence
        grounds:
          - calculations.immunity_interpretation
          - entities.TiterResult.fields.immunity_status
        distinguishing_aspect: |
          On the TiterResult entity domain, the same numeric data (HEP_B value 8.0 mIU/mL)
          yields NON_IMMUNE under the quantitative_threshold variant but IMMUNE under the
          qualitative_label variant (REACTIVE), because the qualitative variant ignores
          numeric_value entirely.
        test_recipe:
          setup:
            - "One employee E1 exists (PREPLACEMENT); logical clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-DV1", full_name: "Dana Vari", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 8.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
              captures: { t_quant: $.data.immunity_status }
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUALITATIVE", numeric_value: 8.0, qualitative_result: "REACTIVE", resulted_at: "2026-07-22T10:00:00Z" }
              as: EmployeeHealthNurse
              captures: { t_qual: $.data.immunity_status }
          assert:
            - "TiterResult.${t_quant} immunity_status == NON_IMMUNE (8.0 < 10.0 threshold)"
            - "TiterResult.${t_qual} immunity_status == IMMUNE (REACTIVE label; numeric_value 8.0 ignored)"
            - "${t_quant} != ${t_qual}"

      - name: cycle_calendar_vs_anniversary_due_date
        grounds:
          - calculations.cycle_due_date
          - entities.AnnualRequirementCycle.fields.tb_due_date
        distinguishing_aspect: |
          On the AnnualRequirementCycle entity domain (distinct from TiterResult), two
          employees with identical hire_date 2025-03-10 and no prior SATISFIED cycle get
          tb_due_date 2026-12-31T23:59:59Z under CALENDAR_YEAR but 2026-03-10T00:00:00Z
          under ROLLING_ANNIVERSARY.
        test_recipe:
          setup:
            - "Employees EA and EB both ACTIVE, both hire_date 2025-03-10T00:00:00Z, no prior cycles"
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-DV2A", full_name: "Cal Anders", job_category: "TECH", department: "LAB", hire_date: "2025-03-10T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_a: $.data.id, emp_a_v: $.data.version }
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-DV2B", full_name: "Ann Rolle", job_category: "TECH", department: "LAB", hire_date: "2025-03-10T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_b: $.data.id, emp_b_v: $.data.version }
            - call: "POST /employee-health/employees/${emp_a}/pre-placement-screenings"
              payload: { expected_employee_version: "${emp_a_v}" }
              as: EmployeeHealthNurse
              captures: { scr_a: $.data.id }
            - call: "POST /employee-health/pre-placement-screenings/${scr_a}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-20T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_a}/components/complete"
              payload: { component: "TB_BASELINE", completed_at: "2026-07-21T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_a}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2026-07-22T09:00:00Z", screening_id: "${scr_a}" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_a}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 2.5, resulted_at: "2026-07-22T09:30:00Z", screening_id: "${scr_a}" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_a}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
            - call: "POST /employee-health/employees/${emp_b}/pre-placement-screenings"
              payload: { expected_employee_version: "${emp_b_v}" }
              as: EmployeeHealthNurse
              captures: { scr_b: $.data.id }
            - call: "POST /employee-health/pre-placement-screenings/${scr_b}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-20T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_b}/components/complete"
              payload: { component: "TB_BASELINE", completed_at: "2026-07-21T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_b}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2026-07-22T09:00:00Z", screening_id: "${scr_b}" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_b}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 2.5, resulted_at: "2026-07-22T09:30:00Z", screening_id: "${scr_b}" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_b}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
          trigger:
            - call: "POST /employee-health/employees/${emp_a}/annual-requirement-cycles"
              payload: { cycle_year: 2026, cycle_mode: "CALENDAR_YEAR" }
              as: ComplianceOfficer
              captures: { due_a: $.data.tb_due_date }
            - call: "POST /employee-health/employees/${emp_b}/annual-requirement-cycles"
              payload: { cycle_year: 2026, cycle_mode: "ROLLING_ANNIVERSARY" }
              as: ComplianceOfficer
              captures: { due_b: $.data.tb_due_date }
          assert:
            - "Cycle(A).tb_due_date == 2026-12-31T23:59:59Z (calendar_year variant)"
            - "Cycle(B).tb_due_date == 2026-03-10T00:00:00Z (hire_date 2025-03-10 + 12 months)"
            - "Cycle(A).fit_test_due_date is null for both (requires_respirator false)"
            - "${due_a} != ${due_b}"

  - rule_id: combinatorial_formula
    instances:
      - name: risk_classification_branch_interaction
        grounds:
          - calculations.exposure_risk_classification
          - entities.ExposureCase.fields.risk_classification
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear nested branches on entity state: identical
          exposure_type/body_fluid (PERCUTANEOUS, BLOOD) classifies HIGH when source_known
          is true but MEDIUM when false; SKIN_CONTACT with NON_INFECTIOUS collapses to LOW
          and suppresses PEP auto-creation entirely.
        test_recipe:
          setup:
            - "One employee E1 exists; clock at default 2026-08-01T00:00:00Z (exposures at 2026-07-30T10:00:00Z are in the past)"
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-CF1", full_name: "Ria Branch", job_category: "NURSE", department: "ED", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id }
            - call: "POST /employee-health/employees/${emp_id}/exposure-cases"
              payload: { exposure_type: "PERCUTANEOUS", exposure_datetime: "2026-07-30T10:00:00Z", source_known: true, source_patient_ref: "SP-100", body_fluid: "BLOOD" }
              as: EmployeeHealthNurse
              captures: { case_high: $.data.id }
            - call: "POST /employee-health/employees/${emp_id}/exposure-cases"
              payload: { exposure_type: "PERCUTANEOUS", exposure_datetime: "2026-07-30T10:00:00Z", source_known: false, body_fluid: "BLOOD" }
              as: EmployeeHealthNurse
              captures: { case_med: $.data.id }
            - call: "POST /employee-health/employees/${emp_id}/exposure-cases"
              payload: { exposure_type: "SKIN_CONTACT", exposure_datetime: "2026-07-30T10:00:00Z", source_known: false, body_fluid: "NON_INFECTIOUS" }
              as: EmployeeHealthNurse
              captures: { case_low: $.data.id }
          trigger:
            - call: "GET /employee-health/pep-regimens"
              payload: { exposure_case_id: "${case_low}" }
              as: EmployeeHealthPhysician
              captures: { pep_low_count: $.data }
            - call: "GET /employee-health/exposure-cases"
              payload: { employee_id: "${emp_id}" }
              as: EmployeeHealthPhysician
          assert:
            - "ExposureCase.${case_high}.risk_classification == HIGH and pep_required == true and source_test_status == CONSENT_PENDING"
            - "ExposureCase.${case_med}.risk_classification == MEDIUM and pep_required == true and source_test_status == NOT_REQUIRED"
            - "ExposureCase.${case_low}.risk_classification == LOW and pep_required == false"
            - "GET /employee-health/pep-regimens?exposure_case_id=${case_high} returns exactly 1 row (status RECOMMENDED)"
            - "GET /employee-health/pep-regimens?exposure_case_id=${case_low} returns 0 rows"
            - "Each case has exactly 1 SerologyFollowUp with milestone BASELINE"

      - name: coverage_per_department_rounding_order
        grounds:
          - calculations.campaign_coverage_rate
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: per-department rate rounded to 2dp
          half-up FIRST, then the mean rounded to 2dp half-up yields 75.00 for the fixture
          below, whereas the forbidden aggregate-then-round order would yield 66.67.
        test_recipe:
          setup:
            - "Employees I1, I2 (department ICU) and D1 (department ED) all ACTIVE; campaign INFLUENZA window [2026-09-01T00:00:00Z, 2026-09-30T23:59:59Z] scope [ICU, ED] is OPEN with 3 PENDING participations; I1 and D1 ADMINISTERED at 2026-09-10T00:00:00Z, I2 left PENDING"
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-CF2I1", full_name: "Icu One", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { i1: $.data.id, i1_v: $.data.version }
            - call: "POST /employee-health/employees/${i1}/pre-placement-screenings"
              payload: { expected_employee_version: "${i1_v}" }
              as: EmployeeHealthNurse
              captures: { s_i1: $.data.id }
            - call: "POST /employee-health/pre-placement-screenings/${s_i1}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-20T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${s_i1}/components/complete"
              payload: { component: "TB_BASELINE", completed_at: "2026-07-21T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${i1}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${i1}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 2.5, resulted_at: "2026-07-22T09:30:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${s_i1}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-CF2I2", full_name: "Icu Two", job_category: "NURSE", department: "ICU", hire_date: "2025-01-06T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { i2: $.data.id, i2_v: $.data.version }
            - call: "POST /employee-health/employees/${i2}/pre-placement-screenings"
              payload: { expected_employee_version: "${i2_v}" }
              as: EmployeeHealthNurse
              captures: { s_i2: $.data.id }
            - call: "POST /employee-health/pre-placement-screenings/${s_i2}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-20T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${s_i2}/components/complete"
              payload: { component: "TB_BASELINE", completed_at: "2026-07-21T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${i2}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${i2}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 2.5, resulted_at: "2026-07-22T09:30:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${s_i2}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-CF2D1", full_name: "Ed One", job_category: "TECH", department: "ED", hire_date: "2025-01-07T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { d1: $.data.id, d1_v: $.data.version }
            - call: "POST /employee-health/employees/${d1}/pre-placement-screenings"
              payload: { expected_employee_version: "${d1_v}" }
              as: EmployeeHealthNurse
              captures: { s_d1: $.data.id }
            - call: "POST /employee-health/pre-placement-screenings/${s_d1}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-20T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${s_d1}/components/complete"
              payload: { component: "TB_BASELINE", completed_at: "2026-07-21T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${d1}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${d1}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 2.5, resulted_at: "2026-07-22T09:30:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${s_d1}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
            - call: "POST /employee-health/vaccination-campaigns"
              payload: { vaccine_type: "INFLUENZA", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-30T23:59:59Z", department_scope: ["ICU", "ED"] }
              as: ComplianceOfficer
              captures: { camp_id: $.data.id }
            - call: "POST /employee-health/vaccination-campaigns/${camp_id}/transition"
              payload: { to_state: "OPEN" }
              as: ComplianceOfficer
            - call: "GET /employee-health/campaign-participations"
              payload: { campaign_id: "${camp_id}", employee_id: "${i1}" }
              as: ComplianceOfficer
              captures: { part_i1: "$.data[0].id" }
            - call: "GET /employee-health/campaign-participations"
              payload: { campaign_id: "${camp_id}", employee_id: "${d1}" }
              as: ComplianceOfficer
              captures: { part_d1: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /employee-health/campaign-participations/${part_i1}/transition"
              payload: { to_state: "ADMINISTERED", administered_at: "2026-09-10T00:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/campaign-participations/${part_d1}/transition"
              payload: { to_state: "ADMINISTERED", administered_at: "2026-09-10T00:00:00Z" }
              as: EmployeeHealthNurse
          trigger:
            - call: "GET /employee-health/vaccination-campaigns/${camp_id}/coverage"
              as: ComplianceOfficer
              captures: { cov: $.data.coverage_rate }
          assert:
            - "coverage.administered_count == 2 and pending_count == 1"
            - "coverage.coverage_rate == 75.00 (ICU round_half_up(100*1/2,2)=50.00; ED round_half_up(100*1/1,2)=100.00; mean 75.00)"
            - "coverage_rate != 66.67 (the forbidden aggregate-then-round result 200/3)"

  - rule_id: non_linear_state_machine
    instances:
      - name: exposure_case_parallel_dimensions
        grounds:
          - state_machines.ExposureCase
          - entities.ExposureCase.fields.case_status
          - entities.ExposureCase.fields.source_test_status
        distinguishing_aspect: |
          ExposureCase carries two parallel state dimensions: advancing case_status
          REPORTED->EVALUATION leaves source_test_status at CONSENT_PENDING, and recording
          source consent moves source_test_status to CONSENT_GRANTED while case_status
          stays EVALUATION — the dimensions evolve independently.
        test_recipe:
          setup:
            - "Employee E1 ACTIVE; HIGH-risk exposure case created by nurse-1 with source_known=true"
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-NL1", full_name: "Pam Dims", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employee-health/employees/${emp_id}/pre-placement-screenings"
              payload: { expected_employee_version: "${emp_v}" }
              as: EmployeeHealthNurse
              captures: { scr_id: $.data.id }
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-20T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "TB_BASELINE", completed_at: "2026-07-21T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 2.5, resulted_at: "2026-07-22T09:30:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
            - call: "POST /employee-health/employees/${emp_id}/exposure-cases"
              payload: { exposure_type: "PERCUTANEOUS", exposure_datetime: "2026-07-30T10:00:00Z", source_known: true, source_patient_ref: "SP-200", body_fluid: "BLOOD" }
              as: EmployeeHealthNurse
              as_user_id: "nurse-1"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /employee-health/exposure-cases/${case_id}/transition"
              payload: { to_state: "EVALUATION" }
              as: EmployeeHealthPhysician
              captures: { st1_case: $.data.case_status, st1_src: $.data.source_test_status }
            - call: "POST /employee-health/exposure-cases/${case_id}/source-testing"
              payload: { action: "RECORD_CONSENT", outcome: "CONSENT_GRANTED" }
              as: EmployeeHealthNurse
              as_user_id: "nurse-2"
              captures: { st2_case: $.data.case_status, st2_src: $.data.source_test_status }
          assert:
            - "After transition: case_status == EVALUATION and source_test_status == CONSENT_PENDING (consent dimension untouched)"
            - "After consent: source_test_status == CONSENT_GRANTED and case_status == EVALUATION (case dimension untouched)"
            - "ExposureCase.${case_id}.consent_recorded_by_user_id == nurse-2 and recorded_by_user_id == nurse-1"

      - name: injury_report_wc_appeal_cycle
        grounds:
          - state_machines.InjuryReport.WC_DENIED_to_APPEALED
          - state_machines.InjuryReport.APPEALED_to_WC_DENIED
        distinguishing_aspect: |
          InjuryReport is cyclic: WC_DENIED -> APPEALED -> WC_DENIED -> APPEALED ->
          WC_ACCEPTED re-enters the denial state after an appeal, proving the loop is
          not one-shot; wc_claim_number stays fixed across the cycle.
        test_recipe:
          setup:
            - "Employee E1 exists; InjuryReport FILED for a FALL (no exposure linkage)"
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-NL2", full_name: "Cy Cle", job_category: "HOUSEKEEPING", department: "EVS", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id }
            - call: "POST /employee-health/employees/${emp_id}/injury-reports"
              payload: { injury_type: "FALL", injury_datetime: "2026-07-15T14:00:00Z" }
              as: SafetyOfficer
              captures: { inj_id: $.data.id }
            - call: "POST /employee-health/injury-reports/${inj_id}/transition"
              payload: { to_state: "WC_SUBMITTED" }
              as: SafetyOfficer
              captures: { claim_no: $.data.wc_claim_number }
          trigger:
            - call: "POST /employee-health/injury-reports/${inj_id}/transition"
              payload: { to_state: "WC_DENIED" }
              as: SafetyOfficer
            - call: "POST /employee-health/injury-reports/${inj_id}/transition"
              payload: { to_state: "APPEALED" }
              as: SafetyOfficer
            - call: "POST /employee-health/injury-reports/${inj_id}/transition"
              payload: { to_state: "WC_DENIED" }
              as: SafetyOfficer
              captures: { loop_status: $.data.status }
            - call: "POST /employee-health/injury-reports/${inj_id}/transition"
              payload: { to_state: "APPEALED" }
              as: SafetyOfficer
            - call: "POST /employee-health/injury-reports/${inj_id}/transition"
              payload: { to_state: "WC_ACCEPTED" }
              as: SafetyOfficer
              captures: { final_status: $.data.status }
          assert:
            - "wc_claim_number == WC-000001 (first submission in empty DB)"
            - "After second WC_DENIED the report is again WC_DENIED (loop re-entered)"
            - "Final status == WC_ACCEPTED (terminal) and osha_recordable == false (FALL, no linked case)"
  - rule_id: transitive_cascade
    instances:
      - name: campaign_close_delinquency_hold_suspension
        grounds:
          - state_machines.VaccinationCampaign.OPEN_to_CLOSED
          - state_machines.CampaignParticipation.PENDING_to_DELINQUENT
          - state_machines.ComplianceHold
          - state_machines.Employee.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Depth-3 chain triggered by POST .../vaccination-campaigns/{id}/transition CLOSED:
          campaign close forces PENDING participation -> DELINQUENT (link 1); the DELINQUENT
          transition itself creates a CAMPAIGN_DELINQUENT ComplianceHold ACTIVE (link 2);
          the hold's activation drives Employee ACTIVE -> SUSPENDED with posture ON_HOLD
          (link 3). Distinct trigger from the seroconversion cascade.
        test_recipe:
          setup:
            - "Employee E1 ACTIVE; INFLUENZA campaign window [2026-09-01T00:00:00Z, 2026-09-30T23:59:59Z] scope [ALL] OPEN with E1 PENDING; clock moved past window end"
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-TC1", full_name: "Cas Cade", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employee-health/employees/${emp_id}/pre-placement-screenings"
