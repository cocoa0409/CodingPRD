        claim_type: standard_crud
        grounds: ["response_envelope"]
        distinguishing_aspect: "Every success response uses the fixed envelope: meta.api_request_id, meta.api_request_timestamp, response_type, data."
        test_recipe:
          setup: ["empty system"]
          setup_api_calls: []
          trigger:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
          assert:
            - "http 201; body.meta.api_request_id present; body.meta.api_request_timestamp present; body.response_type == object; body.data.id == ${m_id}"

      - name: error_envelope_contains_error_id_and_message
