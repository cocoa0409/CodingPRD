              as: StarsAnalyst
            - call: "PUT /api/cutpoint-sets/${set_id}"
              payload: { rows: [ { measure_id: "${m_id}", band_2_floor: 0.62, band_3_floor: 0.72, band_4_floor: 0.82, band_5_floor: 0.92 } ], expected_cutpoint_set_version: "${set_v}" }
