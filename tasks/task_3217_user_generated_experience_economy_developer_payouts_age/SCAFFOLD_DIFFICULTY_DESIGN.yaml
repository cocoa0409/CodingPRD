            - "Second trigger (ask=49) returns 422 with error_id == ERR_RESALE_FLOOR_VIOLATION"
            - "Floor derivation: floor(101 * 0.5) = floor(50.5) = 50"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: purchase_order_confirm_gated_on_marketplace_item_on_sale
        grounds:
          - state_machines.PurchaseOrder
          - state_machines.MarketplaceItem
          - errors.ERR_ITEM_NOT_ON_SALE
        distinguishing_aspect: |
          PurchaseOrder.confirm is gated on the state of a different entity,
          MarketplaceItem. If the seller takes the item OFF_SALE between the
          buyer's create and the buyer's confirm, the confirm fails with
          ERR_ITEM_NOT_ON_SALE even though the PurchaseOrder itself is in a
          valid state. Entity pair: PurchaseOrder -> MarketplaceItem.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Seller with ON_SALE item at price 100."
            - "Buyer with robux_balance 500."
            - "PurchaseOrder created (PENDING) against the item."
          setup_api_calls:
            - *clock
            - call: "POST /ugc/users"
              payload: { username: "s_i", email: "s_i@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { s_i_id: $.data.id }
            - call: "POST /ugc/users"
              payload: { username: "b_i", email: "b_i@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { b_i_id: $.data.id }
            - call: "POST /ugc/marketplace-items"
              payload: { title: "Cap", item_kind: "HAT", price_robux: 100 }
              as: Creator
              as_user_id: "${s_i_id}"
              captures: { item_i_id: $.data.id }
            - call: "POST /ugc/marketplace-items/${item_i_id}/submit"
              payload: {}
              as: Creator
              as_user_id: "${s_i_id}"
            - call: "GET /ugc/moderation-submissions"
              payload: { subject_type: "ASSET" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { sub_i: "$.data[0].id" }
            - call: "POST /ugc/_moderation/inject_score"
              payload: { submission_id: "${sub_i}", score: 0.05 }
              as: PlatformAdmin
            - call: "POST /ugc/currency-purchase-orders"
              payload: { fiat_amount_cents: 700, payment_method_token: "tok", idempotency_key: "b-i-cur" }
              as: Creator
              as_user_id: "${b_i_id}"
              captures: { b_i_cur: $.data.id }
            - call: "POST /ugc/currency-purchase-orders/${b_i_cur}/confirm-payment"
              payload: {}
              as: Creator
              as_user_id: "${b_i_id}"
            - call: "POST /ugc/purchase-orders"
              payload: { item_type: "MARKETPLACE_ITEM", item_id: "${item_i_id}", price_robux: 100, idempotency_key: "po-i" }
              as: Creator
              as_user_id: "${b_i_id}"
              captures: { po_i: $.data.id }
            - call: "POST /ugc/marketplace-items/${item_i_id}/take-off-sale"
              payload: {}
              as: Creator
              as_user_id: "${s_i_id}"
          trigger:
            - call: "POST /ugc/purchase-orders/${po_i}/confirm"
              payload: {}
              as: Creator
              as_user_id: "${b_i_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "Response status == 409 and error_id == ERR_ITEM_NOT_ON_SALE"
            - "PurchaseOrder.${po_i}.status == PENDING"
            - "Buyer robux_balance unchanged at 630 (tiered for 700c: 999*0.8=799.2 -> wait, 700c falls in tier1: 700*0.80=560 robux)"
            - "MarketplaceItem.${item_i_id}.status == OFF_SALE"

      - name: experience_publish_blocked_when_creator_age_insufficient_for_rating
        grounds:
          - state_machines.Experience
          - state_machines.User
          - errors.ERR_CREATOR_AGE_INSUFFICIENT_FOR_RATING
        distinguishing_aspect: |
          Experience.PENDING_REVIEW -> PUBLISHED is gated on the state of a
          different entity, the creator User: when the moderation pipeline
          assigns SEVENTEEN_PLUS to an experience owned by a CHILD creator, the
          transition is BLOCKED and the experience stays PENDING_REVIEW. Entity
          pair: Experience -> User (creator). Distinct from the other instance
          (PurchaseOrder -> MarketplaceItem).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "CHILD creator (DOB 2020-01-01) with one experience submitted for review."
            - "A moderator will decide APPROVE on the human-review submission, and the moderation pipeline attaches descriptors that force SEVENTEEN_PLUS."
          setup_api_calls:
            - *clock
            - call: "POST /ugc/users"
              payload: { username: "kid_j", email: "kid_j@x.com", date_of_birth: "2020-01-01" }
              as: Anonymous
              captures: { kid_j_id: $.data.id }
            - call: "POST /ugc/experiences"
              payload: { title: "Dark Game", description: "horror" }
              as: Creator
              as_user_id: "${kid_j_id}"
              captures: { exp_j_id: $.data.id }
            - call: "POST /ugc/experiences/${exp_j_id}/submit-for-review"
              payload: {}
              as: Creator
              as_user_id: "${kid_j_id}"
            - call: "GET /ugc/moderation-submissions"
              payload: { subject_type: "EXPERIENCE" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { sub_j: "$.data[0].id" }
            - call: "POST /ugc/_moderation/inject_score"
              payload: { submission_id: "${sub_j}", score: 0.50 }
              as: PlatformAdmin
          trigger:
            - call: "POST /ugc/moderation-submissions/${sub_j}/decide"
              payload: { decision: "APPROVE" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "The moderation pipeline assigns SEVENTEEN_PLUS based on the descriptor set implied by the submission"
            - "Response status == 403 and error_id == ERR_CREATOR_AGE_INSUFFICIENT_FOR_RATING"
            - "Experience.${exp_j_id}.status == PENDING_REVIEW (NOT published)"
            - "No ExperienceAgeRating row is written for ${exp_j_id} (the cascade is aborted)"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: parental_monthly_window_calendar_boundary
        grounds:
          - calculations.parental_monthly_spend_check
        distinguishing_aspect: |
          Calendar-month interval semantics: the monthly spend window is
          [first instant of UTC calendar month, first instant of next month),
          half-open on month boundaries. A purchase completed at 23:59:59.999
          on Aug 31 counts toward August; the SAME Robux amount at 00:00:00.000
          on Sep 1 counts toward September and is therefore allowed against a
          fresh budget. Resource = child's monthly spend pool.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-31T23:59:59Z."
            - "Parent + CHILD linked; ParentalControls monthly_spend_limit_robux = 100."
            - "Child has spent 60 in August so far; balance sufficient."
            - "An ON_SALE item at price 50."
          setup_api_calls:
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ugc/users"
              payload: { username: "par_k", email: "par_k@x.com", date_of_birth: "1985-01-01" }
              as: Anonymous
              captures: { par_k_id: $.data.id, par_k_v: $.data.version }
            - call: "POST /ugc/users"
              payload: { username: "kid_k", email: "kid_k@x.com", date_of_birth: "2020-01-01", parent_user_id: "${par_k_id}" }
              as: Anonymous
              captures: { kid_k_id: $.data.id }
            - call: "POST /ugc/users/${par_k_id}/parental-controls"
              payload: { child_user_id: "${kid_k_id}", monthly_spend_limit_robux: 100, chat_mode: "FILTERED", pin_hash: "h", expected_user_version: "${par_k_v}" }
              as: Creator
              as_user_id: "${par_k_id}"
            - call: "POST /ugc/users"
              payload: { username: "s_k", email: "s_k@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { s_k_id: $.data.id }
            - call: "POST /ugc/marketplace-items"
              payload: { title: "Cap K", item_kind: "HAT", price_robux: 50 }
              as: Creator
              as_user_id: "${s_k_id}"
              captures: { item_k_id: $.data.id }
            - call: "POST /ugc/marketplace-items/${item_k_id}/submit"
              payload: {}
              as: Creator
              as_user_id: "${s_k_id}"
            - call: "GET /ugc/moderation-submissions"
              payload: { subject_type: "ASSET" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { sub_k: "$.data[0].id" }
            - call: "POST /ugc/_moderation/inject_score"
              payload: { submission_id: "${sub_k}", score: 0.05 }
              as: PlatformAdmin
            - call: "POST /ugc/currency-purchase-orders"
              payload: { fiat_amount_cents: 500, payment_method_token: "tok", idempotency_key: "kid-k-cur" }
              as: Creator
              as_user_id: "${kid_k_id}"
              captures: { kid_k_cur: $.data.id }
            - call: "POST /ugc/currency-purchase-orders/${kid_k_cur}/confirm-payment"
              payload: {}
              as: Creator
              as_user_id: "${kid_k_id}"
            - call: "POST /ugc/purchase-orders"
              payload: { item_type: "MARKETPLACE_ITEM", item_id: "${item_k_id}", price_robux: 60, idempotency_key: "po-k1" }
              as: Creator
              as_user_id: "${kid_k_id}"
              captures: { po_k1: $.data.id }
            - call: "POST /ugc/purchase-orders/${po_k1}/confirm"
              payload: {}
              as: Creator
              as_user_id: "${kid_k_id}"
          trigger:
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T23:59:59Z" }
              as: PlatformAdmin
            - call: "POST /ugc/purchase-orders"
              payload: { item_type: "MARKETPLACE_ITEM", item_id: "${item_k_id}", price_robux: 50, idempotency_key: "po-k2" }
              as: Creator
              as_user_id: "${kid_k_id}"
              captures: { po_k2: $.data.id }
            - call: "POST /ugc/purchase-orders/${po_k2}/confirm"
              payload: {}
              as: Creator
              as_user_id: "${kid_k_id}"
              captures: { err_k_aug: $.data.error_id }
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ugc/purchase-orders"
              payload: { item_type: "MARKETPLACE_ITEM", item_id: "${item_k_id}", price_robux: 50, idempotency_key: "po-k3" }
              as: Creator
              as_user_id: "${kid_k_id}"
              captures: { po_k3: $.data.id }
            - call: "POST /ugc/purchase-orders/${po_k3}/confirm"
              payload: {}
              as: Creator
              as_user_id: "${kid_k_id}"
          assert:
            - "August 31 23:59:59 attempt: 60+50=110 >= 100 -> rejected with ERR_PARENTAL_SPEND_LIMIT"
            - "September 1 00:00:00 attempt: monthly spend resets to 0; 0+50=50 < 100 -> ACCEPTED, status COMPLETED"
            - "The two attempts use the SAME item at the SAME price; the only difference is which calendar month the logical clock is in"

      - name: resale_account_age_window_rolling_interval
        grounds:
          - state_machines.ResaleListing
          - entities.User.fields.account_age_days
        distinguishing_aspect: |
          Rolling 7-day interval semantics, distinct from the calendar-month
          semantics of the other instance: ResaleListing.ACTIVE -> SOLD requires
          seller.account_age_days >= 7 computed as floor((now - created_at)/86400).
          A seller whose account was created exactly 6 days 23:59:59 ago (account_age_days
          = 6) is REJECTED; the same seller at exactly 7 days 00:00:00
          (account_age_days = 7) is ACCEPTED. Resource = the seller's resale
          eligibility window.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-25T00:00:00Z. Seller account created at this instant."
            - "Seller owns a LIMITED_HAT (created before sale attempts), already ON_SALE."
            - "A buyer with sufficient Robux."
          setup_api_calls:
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ugc/users"
              payload: { username: "s_l", email: "s_l@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { s_l_id: $.data.id }
            - call: "POST /ugc/marketplace-items"
              payload: { title: "Hat L", item_kind: "LIMITED_HAT", price_robux: 200, total_supply: 5, royalty_pct: 10 }
              as: Creator
              as_user_id: "${s_l_id}"
              captures: { item_l_id: $.data.id }
            - call: "POST /ugc/marketplace-items/${item_l_id}/submit"
              payload: {}
              as: Creator
              as_user_id: "${s_l_id}"
            - call: "GET /ugc/moderation-submissions"
              payload: { subject_type: "ASSET" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { sub_l: "$.data[0].id" }
            - call: "POST /ugc/_moderation/inject_score"
              payload: { submission_id: "${sub_l}", score: 0.05 }
              as: PlatformAdmin
            - call: "GET /ugc/marketplace-items/${item_l_id}"
              payload: {}
              as: Creator
              as_user_id: "${s_l_id}"
              captures: { item_l_v: $.data.version }
          trigger:
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T23:59:59Z" }
              as: PlatformAdmin
            - call: "POST /ugc/resale-listings"
              payload: { item_id: "${item_l_id}", ask_price_robux: 150, expected_item_version: "${item_l_v}" }
              as: Creator
              as_user_id: "${s_l_id}"
              captures: { err_l_6d: $.data.error_id }
            - call: "POST /ugc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ugc/resale-listings"
              payload: { item_id: "${item_l_id}", ask_price_robux: 150, expected_item_version: "${item_l_v}" }
              as: Creator
              as_user_id: "${s_l_id}"
              captures: { rl_l_id: $.data.id }
          assert:
            - "At 2026-08-31T23:59:59Z the seller's account_age_days == 6 -> ResaleListing creation rejected (state machine precondition account_age_days >= 7 fails) with ERR_INVALID_STATE"
            - "At 2026-09-01T00:00:00Z the seller's account_age_days == 7 -> ResaleListing creation succeeds, status ACTIVE"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: currency_purchase_and_refund_leave_balance_unchanged
        grounds:
          - state_machines.CurrencyPurchaseOrder
          - entities.User.fields.robux_balance
        distinguishing_aspect: |
          Conserved quantity: the buyer's robux_balance. Forward action =
          CurrencyPurchaseOrder.confirm-payment (credits C robux). Compensating
          action = CurrencyPurchaseOrder.refund (debits exactly C robux). After
          the pair, robux_balance MUST equal the pre-purchase value, with the
          invariant expressed as: balance_post_refund == balance_pre_purchase.
          The conserved quantity is a Robux balance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ADULT buyer with robux_balance 0."
          setup_api_calls:
            - *clock
            - call: "POST /ugc/users"
              payload: { username: "b_m", email: "b_m@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { b_m_id: $.data.id }
            - call: "POST /ugc/currency-purchase-orders"
              payload: { fiat_amount_cents: 1000, payment_method_token: "tok", idempotency_key: "cur-m" }
              as: Creator
              as_user_id: "${b_m_id}"
              captures: { cur_m: $.data.id }
          trigger:
            - call: "POST /ugc/currency-purchase-orders/${cur_m}/confirm-payment"
              payload: {}
              as: Creator
              as_user_id: "${b_m_id}"
              captures: { credited: $.data.credited_robux }
            - call: "GET /ugc/users/${b_m_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bal_after_buy: $.data.robux_balance }
            - call: "POST /ugc/currency-purchase-orders/${cur_m}/refund"
              payload: {}
              as: PlatformAdmin
            - call: "GET /ugc/users/${b_m_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bal_after_refund: $.data.robux_balance }
          assert:
            - "Tiered for 1000c: tier1 999*0.80=799.20, tier2 1*0.90=0.90, raw=800.10, round_half_up=800. credited_robux == 800"
            - "bal_after_buy == 800"
            - "bal_after_refund == 0 (invariant: equals the pre-purchase value of 0)"
            - "CurrencyPurchaseOrder.${cur_m}.status == REFUNDED"

      - name: purchase_and_refund_leave_seller_lifetime_earned_unchanged
        grounds:
          - state_machines.PurchaseOrder
          - entities.User.fields.earned_robux_lifetime
        distinguishing_aspect: |
          Conserved quantity: the seller's earned_robux_lifetime. Forward action =
          PurchaseOrder.confirm (credits creator_credit_robux). Compensating
          action = PurchaseOrder.refund (debits creator_credit_robux). After
          the pair, earned_robux_lifetime MUST equal the pre-purchase value.
          The conserved quantity is a lifetime-earned counter, distinct from
          the buyer's Robux balance of the other instance (different field,
          different entity role).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Seller with an ON_SALE item at price 100; seller's earned_robux_lifetime == 0."
            - "Buyer with sufficient Robux (600 from a 750-cent currency purchase: 750*0.80=600)."
          setup_api_calls:
            - *clock
            - call: "POST /ugc/users"
              payload: { username: "s_n", email: "s_n@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { s_n_id: $.data.id }
            - call: "POST /ugc/users"
              payload: { username: "b_n", email: "b_n@x.com", date_of_birth: "1990-01-01" }
              as: Anonymous
              captures: { b_n_id: $.data.id }
            - call: "POST /ugc/marketplace-items"
              payload: { title: "Cap N", item_kind: "HAT", price_robux: 100 }
              as: Creator
              as_user_id: "${s_n_id}"
              captures: { item_n_id: $.data.id }
            - call: "POST /ugc/marketplace-items/${item_n_id}/submit"
              payload: {}
              as: Creator
              as_user_id: "${s_n_id}"
            - call: "GET /ugc/moderation-submissions"
              payload: { subject_type: "ASSET" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { sub_n: "$.data[0].id" }
            - call: "POST /ugc/_moderation/inject_score"
              payload: { submission_id: "${sub_n}", score: 0.05 }
              as: PlatformAdmin
            - call: "POST /ugc/currency-purchase-orders"
              payload: { fiat_amount_cents: 750, payment_method_token: "tok", idempotency_key: "cur-n" }
              as: Creator
              as_user_id: "${b_n_id}"
              captures: { cur_n: $.data.id }
            - call: "POST /ugc/currency-purchase-orders/${cur_n}/confirm-payment"
              payload: {}
              as: Creator
              as_user_id: "${b_n_id}"
            - call: "POST /ugc/purchase-orders"
              payload: { item_type: "MARKETPLACE_ITEM", item_id: "${item_n_id}", price_robux: 100, idempotency_key: "po-n" }
              as: Creator
              as_user_id: "${b_n_id}"
              captures: { po_n: $.data.id }
          trigger:
            - call: "POST /ugc/purchase-orders/${po_n}/confirm"
              payload: {}
              as: Creator
              as_user_id: "${b_n_id}"
            - call: "GET /ugc/users/${s_n_id}"
              payload: {}
              as: PlatformAdmin
              captures: { earned_after_buy: $.data.earned_robux_lifetime }
            - call: "POST /ugc/purchase-orders/${po_n}/refund"
              payload: {}
              as: PlatformAdmin
            - call: "GET /ugc/users/${s_n_id}"
              payload: {}
              as: PlatformAdmin
              captures: { earned_after_refund: $.data.earned_robux_lifetime }
          assert:
            - "marketplace split on price 100: platform_fee = round_half_up(100*0.30)=30, creator_credit = 70"
            - "earned_after_buy == 70"
            - "earned_after_refund == 0 (invariant: equals the pre-purchase value of 0)"
            - "PurchaseOrder.${po_n}.status == REFUNDED"
