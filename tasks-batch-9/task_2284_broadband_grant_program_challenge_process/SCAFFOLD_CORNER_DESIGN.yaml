# =============================================================================
# 1.9 Scaffold Corner Design — breadth probe over SCAFFOLD.yaml §1.1–§1.7
# Sections and claim_type values are taken from
# references/claim-extraction-guide.md; no categories are invented here.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# excluded_because: stub and no test_recipe.
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:
      - name: program_create_applies_all_optional_defaults
        claim_type: defaults
        grounds:
          - entities.GrantProgram.fields.min_match_pct
          - entities.GrantProgram.fields.holdback_pct
          - entities.GrantProgram.fields.unserved_down_mbps_threshold
          - entities.GrantProgram.fields.ehcl_threshold_cents
          - entities.GrantProgram.fields.ehcl_waiver_enabled
          - entities.GrantProgram.fields.scoring_posture
        distinguishing_aspect: |
          Nine of the program's sixteen input fields are optional; omitting every one of them must
          stamp the declared defaults rather than null, and the three balance fields must initialise
          so that uncommitted_balance_cents equals total_appropriation_cents while obligated and
          disbursed are 0.
        test_recipe:
          setup:
            - "Empty database; logical clock at the mandatory default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Defaults Program", fiscal_year: 2026, total_appropriation_cents: 50000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pd_id: $.data.id }
          assert:
            - "the trigger returns 201"
            - "GrantProgram.${pd_id}.min_match_pct == 25.0"
            - "GrantProgram.${pd_id}.holdback_pct == 10.0"
            - "GrantProgram.${pd_id}.unserved_down_mbps_threshold == 25"
            - "GrantProgram.${pd_id}.unserved_up_mbps_threshold == 3"
            - "GrantProgram.${pd_id}.served_down_mbps_threshold == 100"
            - "GrantProgram.${pd_id}.served_up_mbps_threshold == 20"
            - "GrantProgram.${pd_id}.max_latency_ms == 100"
            - "GrantProgram.${pd_id}.ehcl_threshold_cents == 2500000"
            - "GrantProgram.${pd_id}.ehcl_waiver_enabled == true"
            - "GrantProgram.${pd_id}.program_state == DRAFT"
            - "GrantProgram.${pd_id}.scoring_posture == FROZEN"
            - "GrantProgram.${pd_id}.stale_score_sheet_count == 0"
            - "GrantProgram.${pd_id}.location_count_total == 0"
            - "GrantProgram.${pd_id}.uncommitted_balance_cents == 50000000"
            - "GrantProgram.${pd_id}.obligated_balance_cents == 0"
            - "GrantProgram.${pd_id}.disbursed_balance_cents == 0"
            - "GrantProgram.${pd_id}.version == 1"

      - name: location_create_missing_required_reported_speeds_rejected
        claim_type: required_fields
        grounds:
          - entities.EligibleLocation.fields.reported_down_mbps
          - entities.EligibleLocation.fields.reported_up_mbps
          - validations.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          All seven EligibleLocation input fields are required with no defaults, so omitting
          reported_down_mbps and reported_up_mbps must be refused at priority 14 before the
          classification calculation runs; no row is created and location_count_total stays 0.
        test_recipe:
          setup:
            - "Program in DRAFT with no locations."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-9001", reported_latency_ms: 50, reported_technology: "DSL", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
          assert:
            - "the trigger returns ERR_INVALID_REQUEST (422)"
            - "GrantProgram.${p_id}.location_count_total == 0"
            - "GET /broadband/locations?program_id=${p_id} returns total_count == 0"

      - name: location_create_computed_classification_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.EligibleLocation.fields.classification_status
          - entities.EligibleLocation.fields.classification_source
          - entities.EligibleLocation.fields.eligibility_state
          - calculations.location_classification
        distinguishing_aspect: |
          classification_status, classification_source, eligibility_state and service_state are
          computed or system fields; supplying them in the create payload must be ignored, so a
          200/25 FIBER location is stamped SERVED / NATIONAL_MAP / MAPPED / NOT_BUILT even though
          the caller asked for UNSERVED / CHALLENGE_DETERMINATION / AWARD_BOUND.
        test_recipe:
          setup:
            - "Program in DRAFT with default thresholds."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-9002", reported_down_mbps: 200, reported_up_mbps: 25, reported_latency_ms: 30, reported_technology: "FIBER", reporting_provider_user_id: "prov-2", classification_status: "UNSERVED", classification_source: "CHALLENGE_DETERMINATION", eligibility_state: "AWARD_BOUND", service_state: "CERTIFIED", challenge_count: 7 }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { x1_id: $.data.id }
          assert:
            - "the trigger returns 201"
            - "EligibleLocation.${x1_id}.classification_status == SERVED"
            - "EligibleLocation.${x1_id}.classification_source == NATIONAL_MAP"
            - "EligibleLocation.${x1_id}.eligibility_state == MAPPED"
            - "EligibleLocation.${x1_id}.service_state == NOT_BUILT"
            - "EligibleLocation.${x1_id}.challenge_count == 0"
            - "EligibleLocation.${x1_id}.awarded_award_id == null"
            - "EligibleLocation.${x1_id}.certified_at == null"
            - "GrantProgram.${p_id}.location_count_total == 1"

      - name: challenge_evidence_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.ChallengeEvidence
          - entities.LedgerEntry
          - endpoints.GET_broadband_challenges_id_evidence
        distinguishing_aspect: |
          ChallengeEvidence and LedgerEntry are declared common_fields false, so §1.5 exposes no
          PATCH/PUT/DELETE for either and neither carries a version field; the only mutation channel
          is the append endpoint, and a re-append creates a second row rather than editing the first,
          which is observable in the challenge's recomputed evidence_sufficiency_score.
        test_recipe:
          setup:
            - "Program in CHALLENGE_OPEN at clock 2026-08-10T00:00:00Z with location L1 mapped SERVED."
            - "COMMUNITY challenge filed by comm-1 with one SPEED_TEST item collected 2026-07-01."
          setup_api_calls:
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${p_id}/open-challenge-window"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-0001", reported_down_mbps: 200, reported_up_mbps: 25, reported_latency_ms: 30, reported_technology: "FIBER", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { l1_id: $.data.id }
            - call: "POST /broadband/challenges"
              payload: { program_id: "${p_id}", location_id: "${l1_id}", challenger_type: "COMMUNITY", asserted_classification: "UNDERSERVED", rationale: "Township survey shows no service above 40/8." }
              as: Challenger
              as_user_id: "comm-1"
              captures: { ch_id: $.data.id, ch_v1: $.data.version }
            - call: "POST /broadband/challenges/${ch_id}/evidence"
              payload: { evidence_type: "SPEED_TEST", collected_at: "2026-07-01T00:00:00Z", description: "First speed test series.", expected_challenge_version: "${ch_v1}" }
              as: Challenger
              as_user_id: "comm-1"
              captures: { ev1_id: $.data.id }
            - call: "GET /broadband/challenges/${ch_id}"
              payload: {}
              as: Challenger
              as_user_id: "comm-1"
              captures: { ch_v2: $.data.version }
          trigger:
            - call: "POST /broadband/challenges/${ch_id}/evidence"
              payload: { evidence_type: "SPEED_TEST", collected_at: "2026-07-15T00:00:00Z", description: "Second speed test series.", expected_challenge_version: "${ch_v2}" }
              as: Challenger
              as_user_id: "comm-1"
              captures: { ev2_id: $.data.id }
          assert:
            - "the trigger returns 201 and ${ev2_id} != ${ev1_id}"
            - "ChallengeEvidence.${ev1_id}.description == First speed test series."
            - "ChallengeEvidence.${ev1_id}.collected_at == 2026-07-01T00:00:00Z"
            - "ChallengeEvidence.${ev1_id} exposes no version field and §1.5 declares no update or delete endpoint for ChallengeEvidence"
            - "GET /broadband/challenges/${ch_id}/evidence returns total_count == 2"
            - "Challenge.${ch_id}.evidence_sufficiency_score == 30.00"
            - "Challenge.${ch_id}.distinct_evidence_type_count == 1"

      - name: award_fetch_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations.ERR_AWARD_NOT_FOUND
          - endpoints.GET_broadband_awards_id
        distinguishing_aspect: |
          Existence checks sit at priorities 20-28, above every state and business rule, so a GET on
          a syntactically valid but unknown award id must return ERR_AWARD_NOT_FOUND rather than an
          authorization or state error, and the same id used as a sub-resource parent must behave
          identically.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /broadband/awards/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /broadband/awards/00000000-0000-4000-8000-000000000000/milestones"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "both trigger calls return ERR_AWARD_NOT_FOUND (404)"
            - "the error body carries response_type == error and data.error_id == ERR_AWARD_NOT_FOUND"

      - name: location_claim_cross_program_location_rejected
        claim_type: parent_relationships
        grounds:
          - validations.ERR_PROGRAM_SCOPE_MISMATCH
          - entities.LocationClaim.fields.location_id
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          Flat topology means the FK is validated by scope, not by URL nesting: a location that
          exists (so priority 21 passes) but belongs to a different program than the claiming
          application must be refused at priority 61 with ERR_PROGRAM_SCOPE_MISMATCH, and the
          application's claim_count must stay 0.
        test_recipe:
          setup:
            - "Two programs PA and PB, each in CHALLENGE_OPEN at clock 2026-08-10T00:00:00Z."
            - "Location LB is UNSERVED but belongs to PB; subgrantee SA and DRAFT application AA belong to PA."
          setup_api_calls:
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Program A", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pa_id: $.data.id }
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Program B", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pb_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${pa_id}/open-challenge-window"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${pb_id}/open-challenge-window"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/locations"
              payload: { program_id: "${pb_id}", address_id: "ADDR-9101", reported_down_mbps: 10, reported_up_mbps: 1, reported_latency_ms: 50, reported_technology: "DSL", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { lb_id: $.data.id }
            - call: "POST /broadband/subgrantees"
              payload: { program_id: "${pa_id}", legal_name: "Northline Fiber Coop", ein: "81-1234567", net_assets_cents: 900000, requested_amount_cents: 3000000, key_personnel_count: 4, has_prior_federal_award: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { sa_id: $.data.id }
            - call: "POST /broadband/applications"
              payload: { program_id: "${pa_id}", subgrantee_id: "${sa_id}", match_offer_pct: 25.0, committed_down_mbps: 1000, committed_up_mbps: 1000, committed_latency_ms: 50, low_cost_plan_price_cents: 3000, participates_in_state_affordability_program: true, has_dbe_plan: true, has_union_agreement: false, local_hire_pct: 40, proposed_construction_start: "2026-10-01T00:00:00Z", proposed_construction_end: "2027-10-01T00:00:00Z" }
              as: Subgrantee
              as_user_id: "${sa_id}"
              captures: { aa_id: $.data.id }
          trigger:
            - call: "POST /broadband/location-claims"
              payload: { application_id: "${aa_id}", location_id: "${lb_id}", claimed_cost_cents: 900002 }
              as: Subgrantee
              as_user_id: "${sa_id}"
          assert:
            - "the trigger returns ERR_PROGRAM_SCOPE_MISMATCH (409), not ERR_LOCATION_NOT_FOUND"
            - "Application.${aa_id}.claim_count == 0"
            - "GET /broadband/applications/${aa_id}/location-claims returns total_count == 0"
            - "GET /broadband/locations/${lb_id}/location-claims returns total_count == 0"

      - name: locations_list_filter_paginates_with_total_count
        claim_type: listing
        grounds:
          - endpoints.GET_broadband_locations
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          The list endpoint must combine a domain filter with pagination: with five locations of
          mixed classification, filtering classification_status == UNSERVED and paging limit 2 /
          offset 2 must report total_count 3 and has_more false while returning one row, so
          total_count reflects the filtered set rather than the whole table.
        test_recipe:
          setup:
            - "Program in CHALLENGE_OPEN with five locations: three UNSERVED (10/1), one UNDERSERVED (50/10) and one SERVED (200/25)."
          setup_api_calls:
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${p_id}/open-challenge-window"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-9201", reported_down_mbps: 10, reported_up_mbps: 1, reported_latency_ms: 50, reported_technology: "DSL", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-9202", reported_down_mbps: 10, reported_up_mbps: 1, reported_latency_ms: 50, reported_technology: "DSL", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-9203", reported_down_mbps: 10, reported_up_mbps: 1, reported_latency_ms: 50, reported_technology: "DSL", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-9204", reported_down_mbps: 50, reported_up_mbps: 10, reported_latency_ms: 40, reported_technology: "CABLE", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-9205", reported_down_mbps: 200, reported_up_mbps: 25, reported_latency_ms: 30, reported_technology: "FIBER", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "GET /broadband/locations"
              payload: { program_id: "${p_id}", classification_status: "UNSERVED", limit: 2, offset: 2 }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
          assert:
            - "the trigger returns 200 with response_type == array"
            - "the response reports total_count == 3, limit == 2, offset == 2 and has_more == false"
            - "the response data array length is 1"
            - "GrantProgram.${p_id}.location_count_total == 5"
            - "GET /broadband/locations?program_id=${p_id} with no filter reports total_count == 5"

      - name: locations_list_limit_out_of_range_rejected
        claim_type: type_constraints
        grounds:
          - validations.ERR_INVALID_PAGINATION
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Pagination bounds are checked at priority 16, before any existence check, so limit 0,
          limit 101 and a negative offset must all return ERR_INVALID_PAGINATION even when the
          program_id filter names a program that does not exist.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /broadband/locations"
              payload: { limit: 0 }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "GET /broadband/locations"
              payload: { limit: 101 }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "GET /broadband/locations"
              payload: { offset: -1 }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
          assert:
            - "all three trigger calls return ERR_INVALID_PAGINATION (422)"
            - "ERR_INVALID_PAGINATION is returned in preference to ERR_PROGRAM_NOT_FOUND when both an out-of-range limit and an unknown program_id filter are supplied"

  - section: state_machines
    instances:
      - name: challenge_triage_from_under_review_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Challenge
          - validations.ERR_CHALLENGE_STATE_INVALID
        distinguishing_aspect: |
          triage is declared only from SUBMITTED. Once the challenge has been triaged and its
          rebuttal round closed it sits in UNDER_REVIEW, and a second triage must be refused with
          ERR_CHALLENGE_STATE_INVALID without re-stamping triaged_by_user_id, without touching
          rebuttal_round and without re-incrementing the location's challenge_count.
        test_recipe:
          setup:
            - "Program in CHALLENGE_OPEN at clock 2026-08-10T00:00:00Z with location L1 mapped SERVED."
            - "COMMUNITY challenge with 45.00 of evidence triaged by analyst-1, clock advanced to 2026-09-09 and the rebuttal round closed, leaving UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${p_id}/open-challenge-window"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-0001", reported_down_mbps: 200, reported_up_mbps: 25, reported_latency_ms: 30, reported_technology: "FIBER", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { l1_id: $.data.id }
            - call: "POST /broadband/challenges"
              payload: { program_id: "${p_id}", location_id: "${l1_id}", challenger_type: "COMMUNITY", asserted_classification: "UNDERSERVED", rationale: "Township survey shows no service above 40/8." }
