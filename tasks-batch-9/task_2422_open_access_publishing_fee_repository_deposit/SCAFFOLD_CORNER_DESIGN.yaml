            - "PublisherInvoice.${x5_inv_id}.status == PAID"
            - "Article.${x5_a1_id}.publication_date == 2026-08-12"
            - "exactly 1 PublisherInvoice exists for publisher ${x5_p_id}"

      - name: corner_fund_flow_errors_cover_eligibility_amount_state_and_freeze
        claim_type: conflict_error
        grounds:
          - errors[ERR_ELIGIBILITY_NOT_DETERMINED]
          - errors[ERR_REQUEST_EXCEEDS_ELIGIBLE]
          - errors[ERR_REQUEST_NOT_RESUBMITTABLE]
          - errors[ERR_FUND_FROZEN]
          - errors[ERR_ARTICLE_NOT_FUNDED]
        distinguishing_aspect: |
          Five fund-flow refusals are separated on one dataset: a request against an article with
          no determination is ERR_ELIGIBILITY_NOT_DETERMINED 409; 300001 against
          eligible_request_cents 300000 is ERR_REQUEST_EXCEEDS_ELIGIBLE 422 (one cent over the
          ceiling); resubmitting a request that is SUBMITTED rather than INFO_REQUESTED is
          ERR_REQUEST_NOT_RESUBMITTABLE 409; a second manual freeze of an already FROZEN fund is
          ERR_FUND_FROZEN 409; and approving payment while the article is only
          FUNDING_REQUESTED is ERR_ARTICLE_NOT_FUNDED 409 even though the invoice is VALIDATED.
        test_recipe:
          setup:
            - "logical clock at 2026-08-12T00:00:00Z"
            - "GOLD_OA funder, ACTIVE grant, FULLY_OA journal at 300000, author cap 500000"
            - "article A1 with no eligibility determination"
            - "article A2 determined FUND_APC (eligible_request_cents 300000) with a SUBMITTED request for 300000 and a VALIDATED invoice"
            - "fund OA-CENTRAL-2027 already FROZEN by a manual AUDIT_HOLD"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: AgreementAdmin
            - call: "POST /publishers"
              payload: { name: "Halden Open Science", publisher_code: "HALDEN", country_code: "NO" }
              as: AgreementAdmin
              captures: { x6_p_id: $.data.id }
            - call: "POST /journals"
              payload: { publisher_id: "${x6_p_id}", issn: "2515-0847", title: "Halden Journal of Open Metabolism", oa_model: "FULLY_OA", list_apc_cents: 300000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { x6_j_id: $.data.id }
            - call: "POST /authors"
              payload: { full_name: "Tomas Berg", email: "tomas.berg@uni.example", orcid: "0000-0001-5109-3700", department_code: "MET", affiliation_status: "ELIGIBLE_FACULTY", appointment_from: "2024-01-01", appointment_until: "2028-12-31", annual_cap_cents: 500000 }
              as: AgreementAdmin
              captures: { x6_au_id: $.data.id }
            - call: "POST /funders"
              payload: { name: "National Research Council", funder_code: "NRC", mandate_type: "GOLD_OA", max_embargo_months: 6, deposit_deadline_days: 90, license_required: "CC_BY", apc_allowable: true }
              as: AgreementAdmin
              captures: { x6_f_id: $.data.id }
            - call: "POST /grants"
              payload: { funder_id: "${x6_f_id}", pi_author_id: "${x6_au_id}", grant_number: "NRC-2026-0451", award_from: "2026-01-01", award_until: "2027-12-31", apc_budget_cents: 1000000 }
              as: AgreementAdmin
              captures: { x6_g_id: $.data.id }
            - call: "POST /apc-funds"
              payload: { fund_code: "OA-CENTRAL-2027", fiscal_year: 2027, period_from: "2026-07-01", period_to: "2027-06-30", total_budget_cents: 500000, priority_rank: 1, eligible_affiliation_statuses: ["ELIGIBLE_FACULTY"], per_article_cap_cents: 400000 }
              as: FundManager
              captures: { x6_fd_id: $.data.id }
            - call: "POST /apc-funds/${x6_fd_id}/freeze"
              payload: { reason: "AUDIT_HOLD" }
              as: FundManager
              captures: { x6_frozen: $.data.status, x6_freeze_reason: $.data.freeze_reason }
            - call: "POST /articles"
              payload: { journal_id: "${x6_j_id}", corresponding_author_id: "${x6_au_id}", grant_id: "${x6_g_id}", manuscript_title: "No determination yet", accepted_on: "2026-08-05" }
              as: ScholCommLibrarian
              captures: { x6_a1_id: $.data.id, x6_a1_det: $.data.determination_count }
            - call: "POST /articles"
              payload: { journal_id: "${x6_j_id}", corresponding_author_id: "${x6_au_id}", grant_id: "${x6_g_id}", manuscript_title: "Determined and requested", accepted_on: "2026-08-05" }
              as: ScholCommLibrarian
              captures: { x6_a2_id: $.data.id }
            - call: "POST /articles/${x6_a2_id}/eligibility-checks"
              payload: { basis: "PROVISIONAL" }
              as: ScholCommLibrarian
              captures: { x6_eligible: $.data.eligible_request_cents }
            - call: "POST /fund-requests"
              payload: { article_id: "${x6_a2_id}", requested_cents: 300000, justification: "Central fund support requested." }
              as: CorrespondingAuthor
              as_user_id: "${x6_au_id}"
              captures: { x6_fr_id: $.data.id, x6_fr_status: $.data.status }
            - call: "POST /publisher-invoices"
              payload: { publisher_id: "${x6_p_id}", article_id: "${x6_a2_id}", invoice_number: "HALDEN-6001", invoice_amount_cents: 300000, currency: "USD", claimed_discount_pct: 0.0, vat_pct: 0.0, invoice_date: "2026-08-12" }
              as: ScholCommLibrarian
              captures: { x6_inv_id: $.data.id }
            - call: "POST /publisher-invoices/${x6_inv_id}/validation"
              payload: {}
              as: ScholCommLibrarian
              captures: { x6_inv_status: $.data.status }
          trigger:
            - call: "POST /fund-requests"
              payload: { article_id: "${x6_a1_id}", requested_cents: 100000, justification: "No determination has been run." }
              as: CorrespondingAuthor
              as_user_id: "${x6_au_id}"
              captures: { x6_err_elig: $.data.error_id }
            - call: "POST /fund-requests"
              payload: { article_id: "${x6_a2_id}", requested_cents: 300001, justification: "One cent above the ceiling." }
              as: CorrespondingAuthor
              as_user_id: "${x6_au_id}"
              captures: { x6_err_exceeds: $.data.error_id }
            - call: "POST /fund-requests/${x6_fr_id}/resubmissions"
              payload: { requested_cents: 200000, response_note: "Resubmitting without an information request." }
              as: CorrespondingAuthor
              as_user_id: "${x6_au_id}"
              captures: { x6_err_resub: $.data.error_id }
            - call: "POST /apc-funds/${x6_fd_id}/freeze"
              payload: { reason: "AUDIT_HOLD" }
              as: FundManager
              captures: { x6_err_frozen: $.data.error_id }
            - call: "POST /publisher-invoices/${x6_inv_id}/payment-approval"
              payload: {}
              as: FundManager
              as_user_id: "fm-approver-01"
              captures: { x6_err_not_funded: $.data.error_id }
          assert:
            - "${x6_a1_det} == 0"
            - "${x6_eligible} == 300000"
            - "${x6_fr_status} == SUBMITTED"
            - "${x6_frozen} == FROZEN"
            - "${x6_freeze_reason} == AUDIT_HOLD"
            - "${x6_inv_status} == VALIDATED"
            - "${x6_err_elig} == ERR_ELIGIBILITY_NOT_DETERMINED"
            - "${x6_err_exceeds} == ERR_REQUEST_EXCEEDS_ELIGIBLE"
            - "${x6_err_resub} == ERR_REQUEST_NOT_RESUBMITTABLE"
            - "${x6_err_frozen} == ERR_FUND_FROZEN"
            - "${x6_err_not_funded} == ERR_ARTICLE_NOT_FUNDED"
            - "FundRequest.${x6_fr_id}.status == SUBMITTED"
            - "FundRequest.${x6_fr_id}.requested_cents == 300000"
            - "FundRequest.${x6_fr_id}.revision_round == 0"
            - "PublisherInvoice.${x6_inv_id}.status == VALIDATED"
            - "Article.${x6_a2_id}.funding_status == FUNDING_REQUESTED"
            - "exactly 1 FundRequest exists for article ${x6_a2_id}"

