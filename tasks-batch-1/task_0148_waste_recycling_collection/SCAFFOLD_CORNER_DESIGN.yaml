scaffold_corner_design:
  # =========================================================================
  # From Table 1 — Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.ServiceAccount
          - endpoints
        distinguishing_aspect: "POST /accounts with service_address + rate_class returns 201 with status defaulted to PENDING_SETUP, version 1, account_balance_cents 0, server-minted id."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { service_address: "100 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
          assert:
            - "response status == 201"
            - "ServiceAccount.${acct_id}.status == PENDING_SETUP"
            - "ServiceAccount.${acct_id}.version == 1"
            - "ServiceAccount.${acct_id}.account_balance_cents == 0"
      - name: get_account_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - entities.ServiceAccount
        distinguishing_aspect: "GET /accounts/{id} returns the stored account with matching id and rate_class."
        test_recipe:
          setup:
            - "One account exists."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "101 Main St", rate_class: "COMMERCIAL_SMALL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Dispatcher
              captures: { rc: $.data.rate_class }
          assert:
            - "response status == 200"
            - "ServiceAccount.${acct_id}.rate_class == COMMERCIAL_SMALL"
      - name: list_carts_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.Cart
        distinguishing_aspect: "GET /carts returns an array with pagination meta (total_count, has_more) and respects limit."
        test_recipe:
          setup:
            - "Account with two carts."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "102 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "RECYCLE", size_gallons: 96 }
              as: Dispatcher
          trigger:
            - call: "GET /carts"
              payload: { account_id: "${acct_id}", limit: 1, offset: 0 }
              as: Dispatcher
          assert:
            - "response_type == array"
            - "data length == 1 and meta total_count == 2 and has_more == true"
      - name: get_account_not_found
        claim_type: Not Found
        grounds:
          - entities.ServiceAccount
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /accounts/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"
      - name: create_cart_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.Cart.fields.stream
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /carts without the required stream field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "One account exists."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "103 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", size_gallons: 65 }
              as: Dispatcher
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"
      - name: cart_default_tare_zero_and_status_assigned
        claim_type: Defaults
        grounds:
          - entities.Cart.fields.tare_weight_lbs
          - entities.Cart.fields.status
        distinguishing_aspect: "Omitting tare_weight_lbs on POST /carts defaults it to 0 and status defaults to ASSIGNED."
        test_recipe:
          setup:
            - "One account exists."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "104 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 65 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
          assert:
            - "Cart.${cart_id}.tare_weight_lbs == 0"
            - "Cart.${cart_id}.status == ASSIGNED"
      - name: weight_ticket_net_weight_computed
        claim_type: Computed Fields
        grounds:
          - entities.WeightTicket.fields.net_weight_lbs
          - calculations.weight_ticket_net_weight
        distinguishing_aspect: "WeightTicket.net_weight_lbs is computed as max(0, gross - cart.tare): gross 250 on a tare-50 cart yields 200; any client-supplied net is ignored."
        test_recipe:
          setup:
            - "Route IN_PROGRESS with a COMPLETED pickup on a tare-50 cart."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "105 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 96, tare_weight_lbs: 50 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
              captures: { cart_v: $.data.version }
            - call: "POST /routes"
              payload: { service_date: "2026-05-25T00:00:00Z", stream: "TRASH", assigned_driver_id: "drv-20" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 1 }
              as: Dispatcher
              captures: { stop_id: $.data.id }
            - call: "POST /stops/${stop_id}/pickups"
              payload: { cart_id: "${cart_id}" }
              as: Dispatcher
              captures: { pk_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${route_id}/start"
              payload: {}
              as: Driver
            - call: "POST /pickups/${pk_id}/complete"
              payload: { expected_cart_version: "${cart_v}" }
              as: Driver
          trigger:
            - call: "POST /pickups/${pk_id}/weight-ticket"
              payload: { gross_weight_lbs: 250, diverted: false }
              as: Driver
              captures: { net: $.data.net_weight_lbs }
          assert:
            - "data.net_weight_lbs == 200"
      - name: account_system_fields_ignored_on_input
        claim_type: System Fields
        grounds:
          - entities.ServiceAccount.fields.id
          - entities.ServiceAccount.fields.status
        distinguishing_aspect: "id/status/version are system-sourced: a client-supplied status is ignored and the account starts PENDING_SETUP with a server-minted id."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { service_address: "106 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
          assert:
            - "ServiceAccount.${acct_id}.status == PENDING_SETUP"
            - "ServiceAccount.${acct_id}.id is a UUID without a type prefix"
      - name: create_cart_invalid_enum_stream
        claim_type: Type Constraints
        grounds:
          - entities.Cart.fields.stream
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /carts with stream='GLASS' (outside {TRASH,RECYCLE,ORGANICS}) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "One account exists."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "107 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "GLASS", size_gallons: 65 }
              as: Dispatcher
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"
      - name: create_cart_invalid_size_gallons
        claim_type: Type Constraints
        grounds:
          - entities.Cart.fields.size_gallons
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /carts with size_gallons=50 (not in {35,65,96}) returns ERR_VALIDATION (422) — a semantic constraint distinct from a missing/wrong-type field."
        test_recipe:
          setup:
            - "One account exists."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "108 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 50 }
              as: Dispatcher
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_VALIDATION"
      - name: weight_ticket_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.WeightTicket
        distinguishing_aspect: "WeightTicket has common_fields:false — it exposes only id and created_at (no version), and has no update endpoint; the GET reverse-reachability endpoint returns the ticket without a version field."
        test_recipe:
          setup:
            - "A COMPLETED pickup with one weight ticket."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "109 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 96, tare_weight_lbs: 10 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
              captures: { cart_v: $.data.version }
            - call: "POST /routes"
              payload: { service_date: "2026-05-26T00:00:00Z", stream: "TRASH", assigned_driver_id: "drv-21" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 1 }
              as: Dispatcher
              captures: { stop_id: $.data.id }
            - call: "POST /stops/${stop_id}/pickups"
              payload: { cart_id: "${cart_id}" }
              as: Dispatcher
              captures: { pk_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${route_id}/start"
              payload: {}
              as: Driver
            - call: "POST /pickups/${pk_id}/complete"
              payload: { expected_cart_version: "${cart_v}" }
              as: Driver
            - call: "POST /pickups/${pk_id}/weight-ticket"
              payload: { gross_weight_lbs: 110, diverted: false }
              as: Driver
          trigger:
            - call: "GET /pickups/${pk_id}/weight-ticket"
              payload: {}
              as: Billing
          assert:
            - "data is an array of length 1"
            - "data[0] has id and created_at but no version field"
      - name: create_cart_reference_not_found_account
        claim_type: Parent Relationships
        grounds:
          - entities.Cart.fields.account_id
          - errors[ERR_REFERENCE_NOT_FOUND]
        distinguishing_aspect: "POST /carts with a non-existent account_id returns ERR_REFERENCE_NOT_FOUND (404) — FK reference integrity on a flat-topology peer."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /carts"
              payload: { account_id: "00000000-0000-0000-0000-000000000000", stream: "TRASH", size_gallons: 65 }
              as: Dispatcher
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_REFERENCE_NOT_FOUND"

  # =========================================================================
  # From Table 2 — State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: account_initial_state_pending_setup
        claim_type: Initial State
        grounds:
          - state_machines.ServiceAccount
        distinguishing_aspect: "A newly created ServiceAccount starts in initial_state PENDING_SETUP."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { service_address: "110 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
          assert:
            - "ServiceAccount.${acct_id}.status == PENDING_SETUP"
      - name: activate_account_without_cart_or_plan_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ServiceAccount.PENDING_SETUP_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Activating a PENDING_SETUP account that has no ACTIVE/ASSIGNED cart and no ACTIVE plan violates the activation precondition and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A bare PENDING_SETUP account with no carts and no plans."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "111 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Dispatcher
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"
      - name: cart_activate_from_retired_invalid_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Cart
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A RETIRED cart (terminal) cannot be re-activated: POST /carts/{id}/activate returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A cart that has been RETIRED."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "112 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 65 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/retire"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"
      - name: route_complete_from_completed_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Route
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A COMPLETED route is terminal: a second POST /routes/{id}/complete returns ERR_INVALID_STATE (409); no transitions leave a terminal state."
        test_recipe:
          setup: ["A route driven to COMPLETED (single stop SERVICED)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "113 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 65 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
              captures: { cart_v: $.data.version }
            - call: "POST /routes"
              payload: { service_date: "2026-05-27T00:00:00Z", stream: "TRASH", assigned_driver_id: "drv-22" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 1 }
              as: Dispatcher
              captures: { stop_id: $.data.id }
            - call: "POST /stops/${stop_id}/pickups"
              payload: { cart_id: "${cart_id}" }
              as: Dispatcher
              captures: { pk_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${route_id}/start"
              payload: {}
              as: Driver
            - call: "POST /pickups/${pk_id}/complete"
              payload: { expected_cart_version: "${cart_v}" }
              as: Driver
            - call: "POST /routes/${route_id}/complete"
              payload: {}
              as: Driver
          trigger:
            - call: "POST /routes/${route_id}/complete"
              payload: {}
              as: Driver
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"
      - name: pickup_complete_bubbles_stop_to_serviced
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Pickup.SCHEDULED_to_COMPLETED
          - state_machines.Stop.PENDING_to_SERVICED
        distinguishing_aspect: "Bubble-up side effect: completing a pickup transitions its PENDING stop to SERVICED."
        test_recipe:
          setup: ["A route IN_PROGRESS with a SCHEDULED pickup on a PENDING stop."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "114 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 65 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
              captures: { cart_v: $.data.version }
            - call: "POST /routes"
              payload: { service_date: "2026-05-28T00:00:00Z", stream: "TRASH", assigned_driver_id: "drv-23" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 1 }
              as: Dispatcher
              captures: { stop_id: $.data.id }
            - call: "POST /stops/${stop_id}/pickups"
              payload: { cart_id: "${cart_id}" }
              as: Dispatcher
              captures: { pk_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${route_id}/start"
              payload: {}
              as: Driver
          trigger:
            - call: "POST /pickups/${pk_id}/complete"
              payload: { expected_cart_version: "${cart_v}" }
              as: Driver
          assert:
            - "Pickup.${pk_id}.outcome == COMPLETED"
            - "Stop.${stop_id}.status == SERVICED"
      - name: pickup_miss_customer_fault_no_credit
        claim_type: Conditional cascade
        grounds:
          - state_machines.Pickup.SCHEDULED_to_MISSED
          - calculations.missed_pickup_credit_amount
        distinguishing_aspect: "Conditional cascade boundary: a MISSED pickup with customer-fault reason NOT_OUT creates NO MissedPickupCredit (only MISSED_BY_CREW/TRUCK_FULL do); the stop still bubbles to SKIPPED."
        test_recipe:
          setup: ["A route IN_PROGRESS with a SCHEDULED pickup."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "115 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 65 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /routes"
              payload: { service_date: "2026-05-29T00:00:00Z", stream: "TRASH", assigned_driver_id: "drv-24" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 1 }
              as: Dispatcher
              captures: { stop_id: $.data.id }
            - call: "POST /stops/${stop_id}/pickups"
              payload: { cart_id: "${cart_id}" }
              as: Dispatcher
              captures: { pk_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${route_id}/start"
              payload: {}
              as: Driver
          trigger:
            - call: "POST /pickups/${pk_id}/miss"
              payload: { miss_reason: "NOT_OUT" }
              as: Driver
          assert:
            - "Pickup.${pk_id}.outcome == MISSED"
            - "Stop.${stop_id}.status == SKIPPED"
            - "no MissedPickupCredit exists with source_pickup_id == ${pk_id}"
      - name: contamination_clear_reconciles_pickup_flag
        claim_type: Cross-entity
        grounds:
          - state_machines.ContaminationTag.OPEN_to_CLEARED
          - entities.Pickup.fields.contaminated
        distinguishing_aspect: "Cross-entity reconciliation: clearing the only OPEN ContaminationTag on a pickup sets Pickup.contaminated back to false."
        test_recipe:
          setup: ["A COMPLETED pickup with one OPEN contamination tag (contaminated == true)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "116 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 65 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
              captures: { cart_v: $.data.version }
            - call: "POST /routes"
              payload: { service_date: "2026-05-30T00:00:00Z", stream: "TRASH", assigned_driver_id: "drv-25" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 1 }
              as: Dispatcher
              captures: { stop_id: $.data.id }
            - call: "POST /stops/${stop_id}/pickups"
              payload: { cart_id: "${cart_id}" }
              as: Dispatcher
              captures: { pk_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${route_id}/start"
              payload: {}
              as: Driver
            - call: "POST /pickups/${pk_id}/complete"
              payload: { expected_cart_version: "${cart_v}" }
              as: Driver
            - call: "POST /pickups/${pk_id}/contamination-tags"
              payload: { severity: "MINOR" }
              as: Driver
              captures: { tag_id: $.data.id }
          trigger:
            - call: "POST /contamination-tags/${tag_id}/clear"
              payload: {}
              as: Dispatcher
          assert:
            - "ContaminationTag.${tag_id}.status == CLEARED"
            - "Pickup.${pk_id}.contaminated == false"
      - name: invoice_pay_then_pay_again_idempotency_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Invoice.ISSUED_to_PAID
          - errors[ERR_INVALID_STATE]
