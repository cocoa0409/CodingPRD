  - rule_id: transitive_cascade
    instances:
      - name: hospitalization_incident_cascades_four_hops_to_nurse_minutes
        grounds:
          - state_machines.IncidentReport.transitions.OPEN_to_OPEN
          - state_machines.Case.transitions.ACTIVE_to_ON_HOLD
          - state_machines.Shift.transitions.OPEN_to_CANCELLED
          - state_machines.ShiftAssignment.transitions.ACTIVE_to_CANCELLED
          - calculations.case_fill_metrics
          - calculations.committed_minutes_invariant
        distinguishing_aspect: >-
          A single HOSPITALIZATION incident filing walks four hops - Patient to HOSPITALIZED, Case to
