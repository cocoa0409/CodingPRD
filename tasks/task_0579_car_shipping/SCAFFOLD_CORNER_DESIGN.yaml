              payload: { phase: "PICKUP", odometer: 10005 }
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_INSPECTION"

  # ===========================================================================
  - section: calculations
    instances:
      - name: deposit_floor_boundary_total_38000
        claim_type: Constants Applied
        grounds: [calculations.deposit_split, entities.ShipmentOrder.fields.deposit_cents]
        distinguishing_aspect: "For quoted_total 38000, raw deposit round(7600)=7600 is below the 10000 floor, so deposit_cents=10000 and cod_balance_cents=28000."
        test_recipe:
          setup: ["Order 400mi OPEN STANDARD 1 vehicle quoted total 38000, quote accepted."]
          setup_api_calls:
            - call: "POST /shippers"
              payload: { email: "c10@x.com", full_name: "C Ten" }
              as: Admin
              captures: { shipper_id: $.data.id }
            - call: "POST /shipment-orders"
              payload: { origin_zip: "90001", dest_zip: "90210", route_miles: 400, transport_type: "OPEN", pickup_window_start: "2026-06-01T08:00:00Z", pickup_window_end: "2026-06-05T18:00:00Z" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_id: $.data.id }
            - call: "POST /shipment-orders/${order_id}/vehicles"
              payload: { make: "Honda", model: "Civic", year: 2020, declared_value_cents: 500000 }
              as: Shipper
              as_user_id: "${shipper_id}"
            - call: "GET /shipment-orders/${order_id}"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { order_vq: $.data.version }
            - call: "POST /shipment-orders/${order_id}/quotes"
              payload: { expected_order_version: "${order_vq}" }
              as: Shipper
              as_user_id: "${shipper_id}"
              captures: { quote_id: $.data.id }
          trigger:
            - call: "POST /shipment-orders/${order_id}/quotes/${quote_id}/accept"
              payload: {}
              as: Shipper
              as_user_id: "${shipper_id}"
          assert:
            - "ShipmentOrder.${order_id}.quoted_total_cents == 38000"
            - "ShipmentOrder.${order_id}.deposit_cents == 10000"
            - "ShipmentOrder.${order_id}.cod_balance_cents == 28000"

