# =============================================================================
# SCAFFOLD.yaml — Household Employer Payroll & Nanny Tax Service
# §1.0–§1.7 seed tables (difficulty design and corner design live in their
# own sibling files, never here).
# =============================================================================

scenario: |
  Household Employer Payroll & Nanny Tax Service (HomePay style provider):
  employee vs contractor determination for domestic workers, state registration
  & new-hire reporting, hourly/overtime rules for live-in vs live-out, pay
  schedule, direct deposit & pay stub requirements, tax withholding, deposit &
  quarterly filing, workers' compensation requirement by state, year-end W-2 &
  schedule H preparation, guaranteed hours & paid-leave law compliance

domain_name: household-employer-payroll
api_prefix: /household-payroll

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency      # OCC on HouseholdEmployer.version (registration create) and DomesticWorker.version (agreement create-with-supersede)
    - cascading_side_effects      # timesheet approval -> worker YTD -> payrun STALE -> paycheck basis_stale; late deposit -> penalty -> account balance -> employer posture
    - dual_variant_calculation    # provisional vs final paycheck gross; projected (forward) vs accrued (chronological) Schedule H liability
    - rate_threshold_triggers     # FICA $2,800 retroactive coverage, FUTA $1,000 quarterly trigger, 40h weekly / 8h daily OT, leave accrual caps
  entity_topology: hybrid         # employer-rooted tree with cross-cutting Timesheet.pay_run_id -> PayRun link across the tree
  state_machine_shape: cyclic     # Timesheet reject->DRAFT loop, QuarterlyFiling reject->PREPARED loop, HouseholdEmployer ACTIVE<->SUSPENDED; Paycheck carries parallel deposit/stub dimensions
  relationship_patterns:
    - one_to_many                 # employer -> workers/registrations/pay-runs/filings/policies/deposits/tax-accounts/year-end; worker -> agreements/timesheets/leave-requests/paychecks
    - cross_aggregate             # Timesheet.pay_run_id links the worker subtree into the payrun subtree; Paycheck.worker_id crosses from payrun to worker
  role_model: segregation_of_duties  # filing preparer (PayrollAdmin) must differ from submitter (ComplianceOfficer) by X-User-ID; household client approves what the worker submits
  consistency_model: immediate    # every side effect is atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: HouseholdEmployer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Household employer legal name" }
      - { name: primary_state_code, type: string, source: input, description: "Two-letter state code of the household's primary work location; a StateRulePack for this state must exist" }
      - { name: fein, type: string, source: input, description: "Federal employer identification number, exactly 9 digits" }
      - { name: pay_frequency, type: enum, source: input, description: "WEEKLY | BIWEEKLY | SEMIMONTHLY | MONTHLY — must pay at least as often as the StateRulePack.min_pay_frequency" }
      - { name: prior_year_schedule_h_cents, type: integer, source: input, default: 0, description: "Prior-year total household employment tax liability; input to the safe-harbor deposit calculation" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED" }
      - { name: compliance_posture, type: enum, source: computed, description: "CLEAR | ATTENTION | RESTRICTED — derived fresh on every employer read and after every mutation in the employer's subgraph: RESTRICTED when any ACTIVE worker's work-state pack has workers_comp_required == true and no policy in BOUND|ACTIVE whose [coverage_start, coverage_end] covers the logical-clock current date; else ATTENTION when any TaxDeposit has late_days > 0 or any QuarterlyFiling is REJECTED; else CLEAR. RESTRICTED blocks pay-run finalize" }

  - name: StateRulePack
    parent: null
    common_fields: false
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter state code; unique across all packs" }
      - { name: min_pay_frequency, type: enum, source: input, description: "WEEKLY | BIWEEKLY | SEMIMONTHLY | MONTHLY — least frequent pay schedule the state allows for domestic workers" }
      - { name: weekly_ot_threshold_minutes, type: integer, source: input, description: "Weekly overtime threshold in minutes (typically 2400 = 40h); overtime accrues on worked minutes strictly greater than this" }
      - { name: daily_ot_threshold_minutes, type: integer, source: input, description: "Daily overtime threshold in minutes (e.g. 480 = 8h); 0 disables daily overtime" }
      - { name: daily_dt_threshold_minutes, type: integer, source: input, description: "Daily double-time threshold in minutes (e.g. 720 = 12h); 0 disables double time" }
      - { name: live_in_weekly_ot_eligible, type: boolean, source: input, description: "Whether LIVE_IN workers earn weekly overtime in this state" }
      - { name: live_in_daily_ot_eligible, type: boolean, source: input, description: "Whether LIVE_IN workers earn daily overtime/double time in this state" }
      - { name: min_wage_cents, type: integer, source: input, description: "State minimum hourly wage in cents" }
      - { name: sit_rate, type: number, source: input, description: "State income tax withholding rate as a decimal (e.g. 0.05); 0 for no-income-tax states" }
      - { name: suta_rate, type: number, source: input, description: "State unemployment tax rate (employer-paid) as a decimal" }
      - { name: suta_wage_base_cents, type: integer, source: input, description: "Per-worker annual SUTA wage base cap in cents" }
      - { name: workers_comp_required, type: boolean, source: input, description: "Whether the state mandates workers' compensation coverage for household employers" }
      - { name: new_hire_report_days, type: integer, source: input, description: "Days from hire_date within which the new-hire report must be filed" }
      - { name: pay_stub_required, type: boolean, source: input, description: "Whether an itemized pay stub must be delivered each payday" }

  - name: StateRegistration
    parent: HouseholdEmployer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> HouseholdEmployer.id" }
      - { name: state_code, type: string, source: input, description: "State being registered with" }
      - { name: agency, type: enum, source: input, description: "SIT_WITHHOLDING | SUTA | NEW_HIRE_DIRECTORY" }
      - { name: agency_account_number, type: string, source: system, description: "Agency account number; assigned at activation, null until ACTIVE" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACTIVE" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submission; null until SUBMITTED" }

  - name: DomesticWorker
    parent: HouseholdEmployer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> HouseholdEmployer.id" }
      - { name: full_name, type: string, source: input, description: "Worker legal name" }
      - { name: ssn, type: string, source: input, description: "9-digit SSN; optional at create, required before year-end finalize for any worker with wages" }
      - { name: work_state_code, type: string, source: input, description: "State where work is performed; a StateRulePack must exist for it" }
      - { name: hire_date, type: string, source: input, description: "ISO date of first day of work" }
      - { name: work_arrangement, type: enum, source: input, description: "LIVE_IN | LIVE_OUT" }
      - { name: classification, type: enum, source: computed, description: "UNDETERMINED | EMPLOYEE | CONTRACTOR — set by the classify questionnaire" }
      - { name: classification_answers, type: array, source: input, description: "Raw questionnaire answers [{question_key, answer}] retained for audit" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | CLASSIFIED | ACTIVE | TERMINATED" }
      - { name: new_hire_report_date, type: string, source: input, description: "ISO date the new-hire report was filed; supplied at activation" }
      - { name: termination_date, type: string, source: system, description: "ISO date of termination; null until TERMINATED" }
      - { name: cash_wages_ytd_cents, type: integer, source: computed, description: "Sum of gross_cents over this worker's ISSUED paychecks whose pay_date falls in the calendar year of the logical clock" }
      - { name: fica_covered, type: boolean, source: computed, description: "cash_wages_ytd_cents >= FICA_COVERAGE_THRESHOLD_CENTS; once true, ALL year-to-date cash wages become FICA-taxable retroactively" }
      - { name: ss_wages_paid_ytd_cents, type: integer, source: computed, description: "FICA wages on which Social Security has actually been withheld so far this year (drives retroactive catch-up)" }
      - { name: futa_wages_ytd_cents, type: integer, source: computed, description: "Wages counted toward the FUTA wage base this year" }
      - { name: ytd_approved_minutes, type: integer, source: computed, description: "Sum of total_worked_minutes over APPROVED or LOCKED timesheets in the clock's calendar year" }
      - { name: accrued_leave_minutes, type: integer, source: computed, description: "min(floor(ytd_approved_minutes / LEAVE_ACCRUAL_DIVISOR), LEAVE_ANNUAL_CAP_MINUTES)" }
      - { name: used_leave_minutes, type: integer, source: computed, description: "Sum of requested_minutes over APPROVED leave requests (released back on cancel)" }
      - { name: available_leave_minutes, type: integer, source: computed, description: "accrued_leave_minutes - used_leave_minutes" }

  - name: EmploymentAgreement
    parent: DomesticWorker
    common_fields: true
    fields:
      - { name: worker_id, type: string, source: system, description: "FK -> DomesticWorker.id" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Straight-time hourly rate; must be >= the work state minimum wage" }
      - { name: pay_method, type: enum, source: input, description: "HOURLY | GUARANTEED_SALARY_FWW (fluctuating workweek: guarantee covers all straight-time minutes, OT paid as a 0.5x premium on the derived effective rate)" }
      - { name: guaranteed_minutes_per_week, type: integer, source: input, default: 0, description: "Guaranteed paid minutes per week; shortfall vs worked minutes is paid at straight time" }
      - { name: fit_withholding_cents_per_period, type: integer, source: input, default: 0, description: "Flat federal income tax withholding per pay period (household-employee FIT is voluntary, by mutual agreement)" }
      - { name: effective_from, type: string, source: input, description: "First ISO date (inclusive) the agreement governs" }
      - { name: effective_to, type: string, source: computed, description: "Last ISO date (inclusive); null = open-ended; auto-set to new agreement's effective_from minus 1 day when superseded" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | TERMINATED" }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> EmploymentAgreement.id; set on the superseded agreement" }

  - name: Timesheet
    parent: DomesticWorker
    common_fields: true
    fields:
      - { name: worker_id, type: string, source: system, description: "FK -> DomesticWorker.id" }
      - { name: pay_run_id, type: string, source: system, description: "FK -> PayRun.id; assigned when a pay run calculates over this timesheet's period; null until then" }
      - { name: period_start, type: string, source: input, description: "ISO date, inclusive" }
      - { name: period_end, type: string, source: input, description: "ISO date, EXCLUSIVE — half-open interval [period_start, period_end); must be after period_start" }
      - { name: entries, type: array, source: input, description: "Per-day work entries [{work_date, worked_minutes}]; each work_date must lie in [period_start, period_end) and be unique within the timesheet" }
      - { name: total_worked_minutes, type: integer, source: computed, description: "Sum of entries[].worked_minutes" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | LOCKED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of most recent submission; refreshed on every DRAFT->SUBMITTED" }

  - name: PayRun
    parent: HouseholdEmployer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> HouseholdEmployer.id" }
      - { name: period_start, type: string, source: input, description: "ISO date, inclusive — half-open interval [period_start, period_end)" }
      - { name: period_end, type: string, source: input, description: "ISO date, EXCLUSIVE; span must match the employer's pay_frequency (WEEKLY=7d, BIWEEKLY=14d, SEMIMONTHLY=[1,16) or [16,1st of next month), MONTHLY=calendar month)" }
      - { name: pay_date, type: string, source: input, description: "ISO date wages are paid; drives deposit due dates and W-2 wage-year attribution" }
      - { name: status, type: enum, source: system, description: "OPEN | CALCULATED | FINALIZED" }
      - { name: recalc_status, type: enum, source: system, description: "CURRENT | STALE — flips to STALE when a timesheet covering this period is approved after calculation" }
      - { name: total_gross_cents, type: integer, source: computed, description: "Sum of gross_cents over member paychecks with status != VOIDED" }
      - { name: total_net_cents, type: integer, source: computed, description: "Sum of net_pay_cents over member paychecks with status != VOIDED" }
      - { name: total_employer_tax_cents, type: integer, source: computed, description: "Sum of employer_tax_lines amounts over member paychecks with status != VOIDED" }

  - name: Paycheck
    parent: PayRun
    common_fields: true
    fields:
      - { name: pay_run_id, type: string, source: system, description: "FK -> PayRun.id" }
      - { name: worker_id, type: string, source: system, description: "FK -> DomesticWorker.id" }
      - { name: basis, type: enum, source: computed, description: "GUARANTEE_FALLBACK | TIMESHEET — TIMESHEET when an APPROVED-or-LOCKED timesheet exactly covers the pay-run period for this worker" }
      - { name: basis_stale, type: boolean, source: system, description: "true when a covering timesheet was approved after this paycheck was calculated; cleared by re-running calculate" }
      - { name: pay_method, type: enum, source: system, description: "Copied from the governing EmploymentAgreement: HOURLY | GUARANTEED_SALARY_FWW" }
      - { name: regular_minutes, type: integer, source: computed, description: "Straight-time minutes after daily/weekly OT extraction" }
      - { name: overtime_minutes, type: integer, source: computed, description: "Minutes paid at 1.5x" }
      - { name: double_minutes, type: integer, source: computed, description: "Minutes paid at 2.0x" }
      - { name: guarantee_top_up_minutes, type: integer, source: computed, description: "max(0, guaranteed minutes for the period - total worked minutes); paid at straight time, excluded from OT bases" }
      - { name: fww_effective_rate_cents_per_minute, type: number, source: computed, description: "Fluctuating-workweek effective straight-time rate, 4 decimal places; only for pay_method=GUARANTEED_SALARY_FWW" }
      - { name: provisional_gross_cents, type: integer, source: computed, description: "Guarantee-basis projection: guaranteed minutes for the period x straight rate (no OT, no timesheet data)" }
      - { name: gross_cents, type: integer, source: computed, description: "Final gross: timesheet-based with OT/DT and top-up when basis=TIMESHEET, else provisional_gross_cents" }
      - { name: withholding_lines, type: array, source: computed, description: "[{tax_type, amount_cents}] for SS_EE, MEDICARE_EE, ADDL_MEDICARE_EE, SIT_EE, FIT_EE — each line rounded to cents half-up, then net = gross - sum(lines)" }
      - { name: employer_tax_lines, type: array, source: computed, description: "[{tax_type, amount_cents}] for SS_ER, MEDICARE_ER, FUTA_ER, SUTA_ER" }
      - { name: net_pay_cents, type: integer, source: computed, description: "gross_cents - sum(withholding_lines.amount_cents)" }
      - { name: status, type: enum, source: system, description: "CALCULATED | ISSUED | VOIDED" }
      - { name: deposit_status, type: enum, source: system, description: "PENDING | SENT | REVERSAL_PENDING — direct-deposit dimension, independent of stub_status" }
      - { name: stub_status, type: enum, source: system, description: "PENDING | DELIVERED | NOT_REQUIRED — pay-stub delivery dimension, independent of deposit_status" }

  - name: LeaveRequest
    parent: DomesticWorker
    common_fields: true
    fields:
      - { name: worker_id, type: string, source: system, description: "FK -> DomesticWorker.id" }
      - { name: start_date, type: string, source: input, description: "First ISO day of leave, INCLUSIVE — closed interval [start_date, end_date]" }
      - { name: end_date, type: string, source: input, description: "Last ISO day of leave, INCLUSIVE; must be >= start_date" }
      - { name: requested_minutes, type: integer, source: input, description: "Paid leave minutes requested; > 0" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | CANCELLED" }

  - name: TaxLiabilityAccount
    parent: HouseholdEmployer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> HouseholdEmployer.id" }
      - { name: tax_year, type: integer, source: system, description: "Calendar year of the liabilities (from paycheck pay_date)" }
      - { name: tax_type, type: enum, source: system, description: "FICA_EE | FICA_ER | FUTA_ER | SIT_EE | SUTA_ER; unique per (employer_id, tax_year, tax_type)" }
      - { name: accrued_cents, type: integer, source: computed, description: "Chronological sum of finalized paycheck line amounts for this tax type and year (voided paychecks subtract)" }
      - { name: projected_annual_cents, type: integer, source: computed, description: "Forward-looking variant: accrued_cents + per-period average x remaining pay periods in the tax year (per employer pay_frequency); 0 before the first finalized paycheck" }
      - { name: deposited_cents, type: integer, source: computed, description: "Share of TaxDeposit amounts allocated to this account by the waterfall (order FICA_EE, FICA_ER, FUTA_ER, SIT_EE, SUTA_ER; each filled up to its balance)" }
      - { name: penalty_cents, type: integer, source: computed, description: "Late-deposit penalties land here: the full penalty of every late TaxDeposit for this year is added to the FICA_ER account; other accounts always show 0" }
      - { name: balance_cents, type: integer, source: computed, description: "accrued_cents + penalty_cents - deposited_cents" }

  - name: TaxDeposit
    parent: HouseholdEmployer
    common_fields: false
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> HouseholdEmployer.id" }
      - { name: tax_year, type: integer, source: input, description: "Liability year the deposit pays toward" }
      - { name: quarter, type: integer, source: input, description: "1 | 2 | 3 | 4 — determines the due date (Apr 15 / Jun 15 / Sep 15 / Jan 15 of following year)" }
      - { name: amount_cents, type: integer, source: input, description: "Remitted amount; must be >= required_amount_cents at creation" }
      - { name: remitted_on, type: string, source: input, description: "ISO date the payment was remitted; must not be after the logical-clock current date" }
      - { name: required_amount_cents, type: integer, source: computed, description: "Safe-harbor requirement captured at creation (see safe_harbor_deposit_requirement)" }
      - { name: due_date, type: string, source: computed, description: "ISO due date for the quarter" }
      - { name: late_days, type: integer, source: computed, description: "max(0, remitted_on - due_date) in whole days" }
      - { name: penalty_cents, type: integer, source: computed, description: "Tiered late penalty over required_amount_cents (see late_deposit_penalty)" }
      - { name: unapplied_cents, type: integer, source: computed, description: "Portion of amount_cents left after the allocation waterfall fills every tax-year account balance to zero" }

  - name: QuarterlyFiling
    parent: HouseholdEmployer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> HouseholdEmployer.id" }
      - { name: tax_year, type: integer, source: input, description: "Filing year" }
      - { name: quarter, type: integer, source: input, description: "1 | 2 | 3 | 4; unique per (employer_id, tax_year)" }
      - { name: status, type: enum, source: system, description: "OPEN | PREPARED | SUBMITTED | REJECTED | ACCEPTED" }
      - { name: total_cash_wages_cents, type: integer, source: computed, description: "Household cash wages with pay_date inside the quarter, over ISSUED paychecks" }
      - { name: futa_applies, type: boolean, source: computed, description: "total_cash_wages_cents >= FUTA_QUARTER_TRIGGER_CENTS (>= is exact)" }
      - { name: futa_due_cents, type: integer, source: computed, description: "Quarterly FUTA accrued over per-worker remaining wage base" }
      - { name: suta_due_cents, type: integer, source: computed, description: "Quarterly SUTA over per-worker remaining state wage base" }
      - { name: estimated_federal_payment_cents, type: integer, source: computed, description: "safe-harbor quarterly federal estimated payment" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of the PayrollAdmin who ran prepare; the same user id may not submit (segregation of duties)" }
      - { name: prepared_at, type: datetime, source: system, description: "Logical-clock timestamp of latest prepare" }

  - name: WorkersCompPolicy
    parent: HouseholdEmployer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> HouseholdEmployer.id" }
      - { name: state_code, type: string, source: input, description: "State whose workers' comp mandate this policy satisfies" }
      - { name: policy_number, type: string, source: input, description: "Carrier policy number" }
      - { name: coverage_start, type: string, source: input, description: "First covered ISO date, inclusive (closed interval)" }
      - { name: coverage_end, type: string, source: input, description: "Last covered ISO date, inclusive; must be >= coverage_start" }
      - { name: status, type: enum, source: system, description: "QUOTED | BOUND | ACTIVE | LAPSED | EXPIRED" }

  - name: YearEndPackage
    parent: HouseholdEmployer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> HouseholdEmployer.id" }
      - { name: tax_year, type: integer, source: input, description: "Reporting year; unique per employer" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED" }
      - { name: schedule_h_total_cents, type: integer, source: computed, description: "FICA_EE + FICA_ER + FUTA_ER accrued for the year plus total FIT withheld" }
      - { name: w2_lines, type: array, source: computed, description: "Per-worker W-2 wage lines [{worker_id, wages_cents, ss_wages_cents, ss_tax_cents, medicare_tax_cents, sit_cents, fit_cents}] for workers with ISSUED paychecks in the year" }
      - { name: underpayment_penalty_applies, type: boolean, source: computed, description: "true when year deposits < min(90% of actual annual liability, 110% of prior_year_schedule_h_cents)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: HouseholdEmployer
    initial_state: ONBOARDING
    terminal_states: []
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "system (automatic when the employer's first StateRegistration becomes ACTIVE)"
        actor: system
        preconditions:
          - "employer.status == ONBOARDING"
        side_effects:
          - "employer.version increments by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /household-payroll/employers/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "employer.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "pay run creation and finalization blocked while SUSPENDED (state precondition on those endpoints)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /household-payroll/employers/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "employer.status == SUSPENDED (else ERR_INVALID_STATE)"
          - "no StateRegistration for the primary state left non-ACTIVE (else ERR_REGISTRATION_INACTIVE)"
        side_effects:
          - "employer.compliance_posture recomputed"

  - entity: StateRegistration
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /household-payroll/registrations/{id}/submit"
        actor: PayrollAdmin
        preconditions:
          - "registration.status == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "submitted_at = logical clock now"
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /household-payroll/registrations/{id}/activate"
        actor: PayrollAdmin
        preconditions:
          - "registration.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "agency_account_number assigned from request input"
          - "if this is the employer's first ACTIVE registration: employer.status ONBOARDING -> ACTIVE"
          - "employer.compliance_posture recomputed"

  - entity: DomesticWorker
    initial_state: ONBOARDING
    terminal_states: [TERMINATED]
    transitions:
      - from: ONBOARDING
        to: CLASSIFIED
        trigger: "POST /household-payroll/workers/{id}/classify"
        actor: HouseholdClient
        preconditions:
          - "worker.status in {ONBOARDING, CLASSIFIED} (else ERR_INVALID_STATE)"
          - "questionnaire determines EMPLOYEE or CONTRACTOR deterministically (see worker_classification_determination)"
        side_effects:
          - "worker.classification set to the determination result"
      - from: CLASSIFIED
        to: CLASSIFIED
        trigger: "POST /household-payroll/workers/{id}/classify (re-determination with new answers)"
        actor: HouseholdClient
        preconditions:
          - "worker.status in {ONBOARDING, CLASSIFIED}"
        side_effects:
          - "worker.classification overwritten; classification_answers replaced"
      - from: CLASSIFIED
        to: ACTIVE
        trigger: "POST /household-payroll/workers/{id}/activate"
        actor: HouseholdClient
        preconditions:
          - "worker.status == CLASSIFIED (else ERR_INVALID_STATE)"
          - "worker.classification == EMPLOYEE (else ERR_CONTRACTOR_NOT_PAYABLE)"
          - "an EmploymentAgreement with status == ACTIVE exists covering hire_date (else ERR_NO_ACTIVE_AGREEMENT)"
          - "a StateRegistration with agency == NEW_HIRE_DIRECTORY for work_state_code is ACTIVE (else ERR_REGISTRATION_INACTIVE)"
          - "hire_date <= new_hire_report_date <= hire_date + StateRulePack.new_hire_report_days AND new_hire_report_date <= logical-clock current date (else ERR_NEW_HIRE_REPORT_LATE)"
        side_effects:
          - "worker.status = ACTIVE"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /household-payroll/workers/{id}/terminate"
        actor: HouseholdClient
        preconditions:
          - "worker.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "termination_date = logical-clock current date"
          - "every EmploymentAgreement with status == ACTIVE for this worker -> TERMINATED"
          - "every Timesheet in DRAFT stays editable; SUBMITTED timesheets remain approvable"

  - entity: EmploymentAgreement
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when a new agreement is created for the same worker via POST /household-payroll/workers/{id}/agreements)"
        actor: system
        preconditions:
          - "a newer agreement exists for the same worker"
        side_effects:
          - "effective_to = new agreement.effective_from minus 1 day"
          - "superseded_by_id = new agreement id"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (worker termination cascades)"
        actor: system
        preconditions:
          - "worker transitioned ACTIVE -> TERMINATED"
        side_effects:
          - "agreement.status = TERMINATED"

  - entity: Timesheet
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /household-payroll/timesheets/{id}/submit"
        actor: Worker
        preconditions:
          - "timesheet.status == DRAFT (else ERR_INVALID_STATE)"
          - "total_worked_minutes > 0 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "submitted_at = logical clock now"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /household-payroll/timesheets/{id}/approve"
        actor: HouseholdClient
        preconditions:
          - "timesheet.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "worker.status == ACTIVE (else ERR_INVALID_STATE)"
          - "no FINALIZED PayRun covers [period_start, period_end) for this worker (else ERR_INVALID_STATE)"
        side_effects:
          - "worker.ytd_approved_minutes += total_worked_minutes; worker.accrued_leave_minutes recomputed (paid_leave_accrual)"
          - "every PayRun with status == CALCULATED whose [period_start, period_end) covers this timesheet's period: recalc_status -> STALE"
          - "each such STALE PayRun's member Paychecks with status == CALCULATED: basis_stale -> true"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /household-payroll/timesheets/{id}/reject"
        actor: HouseholdClient
        preconditions:
          - "timesheet.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: APPROVED
        to: LOCKED
        trigger: "system (POST /household-payroll/pay-runs/{id}/calculate locks covering approved timesheets)"
        actor: system
        preconditions:
          - "timesheet.status == APPROVED"
          - "pay run [period_start, period_end) exactly covers the timesheet period"
        side_effects:
          - "timesheet.pay_run_id = the calculating pay run's id"

  - entity: PayRun
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: CALCULATED
        trigger: "POST /household-payroll/pay-runs/{id}/calculate"
        actor: PayrollAdmin
        preconditions:
          - "pay_run.status == OPEN, OR (pay_run.status == CALCULATED AND recalc_status == STALE) (else ERR_INVALID_STATE)"
        side_effects:
          - "one Paycheck (status CALCULATED) created per worker with status == ACTIVE on period_start and an ACTIVE agreement covering the period; paychecks are created in worker created_at ASC order (never by id)"
          - "APPROVED timesheets exactly covering the period are LOCKED and linked via pay_run_id"
          - "provisional and final gross, withholding and employer tax lines computed per gross_pay_hourly_overtime / fluctuating_workweek_premium / paycheck_withholding_net"
          - "recalc_status = CURRENT; total_gross_cents / total_net_cents / total_employer_tax_cents recomputed"
      - from: CALCULATED
        to: CALCULATED
        trigger: "POST /household-payroll/pay-runs/{id}/calculate (re-calculation after STALE)"
        actor: PayrollAdmin
        preconditions:
          - "recalc_status == STALE (else ERR_INVALID_STATE)"
        side_effects:
          - "member paychecks recomputed from current approved timesheets; basis_stale cleared; recalc_status = CURRENT"
      - from: CALCULATED
        to: FINALIZED
        trigger: "POST /household-payroll/pay-runs/{id}/finalize"
        actor: PayrollAdmin
        preconditions:
          - "pay_run.status == CALCULATED (else ERR_INVALID_STATE)"
          - "recalc_status == CURRENT (else ERR_PAYRUN_STALE)"
          - "employer.status == ACTIVE (else ERR_INVALID_STATE)"
          - "employer.compliance_posture != RESTRICTED (else ERR_EMPLOYER_RESTRICTED)"
          - "for every member worker whose state pack has workers_comp_required == true: a policy in BOUND|ACTIVE covers pay_date (else ERR_WORKERS_COMP_REQUIRED)"
          - "StateRegistrations (SIT_WITHHOLDING, SUTA) for each member worker's work_state are ACTIVE (else ERR_REGISTRATION_INACTIVE)"
        side_effects:
          - "member Paychecks: status -> ISSUED, deposit_status -> SENT, stub_status -> DELIVERED (or NOT_REQUIRED when the work state's pack has pay_stub_required == false)"
          - "worker.cash_wages_ytd_cents / fica_covered / ss_wages_paid_ytd_cents / futa_wages_ytd_cents updated per fica_retroactive_coverage and futa_quarterly_with_wage_base"
          - "TaxLiabilityAccount rows for pay_date's year lazily created in the FIXED order FICA_EE, FICA_ER, FUTA_ER, SIT_EE, SUTA_ER (all five, even when a line amount is 0) and accrued_cents incremented by paycheck line amounts"
          - "employer.compliance_posture recomputed"

  - entity: Paycheck
    initial_state: CALCULATED
    terminal_states: [VOIDED]
    transitions:
      - from: CALCULATED
        to: ISSUED
        trigger: "system (pay run finalize)"
        actor: system
        preconditions:
          - "parent PayRun finalize preconditions all pass"
        side_effects:
          - "deposit_status PENDING -> SENT (parallel dimension)"
          - "stub_status PENDING -> DELIVERED, or PENDING -> NOT_REQUIRED when work-state pack pay_stub_required == false (parallel dimension)"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /household-payroll/paychecks/{id}/void"
        actor: PayrollAdmin
        preconditions:
          - "paycheck.status == ISSUED (else ERR_INVALID_STATE)"
          - "parent PayRun.status == FINALIZED (void of a CALCULATED paycheck is not supported; recalculate instead)"
        side_effects:
          - "deposit_status -> REVERSAL_PENDING when it was SENT"
          - "parent PayRun totals recomputed over non-VOIDED paychecks (compensating invariant: total_net_cents == sum of non-VOIDED net_pay_cents)"
          - "worker.cash_wages_ytd_cents / ss_wages_paid_ytd_cents / futa_wages_ytd_cents decremented by this paycheck's contribution; fica_covered re-evaluated"
          - "TaxLiabilityAccount.accrued_cents decremented per line; balance_cents recomputed; employer.compliance_posture recomputed"

  - entity: LeaveRequest
    initial_state: REQUESTED
    terminal_states: [DENIED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /household-payroll/leave-requests/{id}/approve"
        actor: HouseholdClient
        preconditions:
          - "leave_request.status == REQUESTED (else ERR_INVALID_STATE)"
          - "worker.available_leave_minutes >= requested_minutes (else ERR_INSUFFICIENT_LEAVE_BALANCE)"
        side_effects:
          - "worker.used_leave_minutes += requested_minutes; available_leave_minutes recomputed"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /household-payroll/leave-requests/{id}/deny"
        actor: HouseholdClient
        preconditions:
          - "leave_request.status == REQUESTED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /household-payroll/leave-requests/{id}/cancel"
        actor: Worker
        preconditions:
          - "leave_request.status in {REQUESTED, APPROVED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /household-payroll/leave-requests/{id}/cancel"
        actor: Worker
        preconditions:
          - "leave_request.status in {REQUESTED, APPROVED}"
        side_effects:
          - "worker.used_leave_minutes -= requested_minutes (compensating invariant: accrued_leave_minutes untouched; available returns to its pre-approve value)"

  - entity: QuarterlyFiling
    initial_state: OPEN
    terminal_states: [ACCEPTED]
    transitions:
      - from: OPEN
        to: PREPARED
        trigger: "POST /household-payroll/quarterly-filings/{id}/prepare"
        actor: PayrollAdmin
        preconditions:
          - "filing.status in {OPEN, REJECTED} (else ERR_INVALID_STATE)"
          - "logical-clock current date > last day of the filing quarter (else ERR_QUARTER_NOT_CLOSED)"
        side_effects:
          - "total_cash_wages_cents / futa_applies / futa_due_cents / suta_due_cents / estimated_federal_payment_cents recomputed (futa_quarterly_with_wage_base, suta accrual, safe_harbor_deposit_requirement)"
          - "prepared_by_user_id = calling X-User-ID; prepared_at = logical clock now"
      - from: REJECTED
        to: PREPARED
        trigger: "POST /household-payroll/quarterly-filings/{id}/prepare"
        actor: PayrollAdmin
        preconditions:
          - "filing.status in {OPEN, REJECTED}"
          - "logical-clock current date > last day of the filing quarter"
        side_effects:
          - "amounts fully recomputed from current ledger; prepared_by_user_id overwritten"
      - from: PREPARED
        to: SUBMITTED
        trigger: "POST /household-payroll/quarterly-filings/{id}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "filing.status == PREPARED (else ERR_INVALID_STATE)"
          - "calling X-User-ID != prepared_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /household-payroll/quarterly-filings/{id}/accept"
        actor: ComplianceOfficer
        preconditions:
          - "filing.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "employer.compliance_posture recomputed"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /household-payroll/quarterly-filings/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "filing.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "employer.compliance_posture recomputed (any REJECTED filing forces at least ATTENTION)"

  - entity: WorkersCompPolicy
    initial_state: QUOTED
    terminal_states: [LAPSED, EXPIRED]
    transitions:
      - from: QUOTED
        to: BOUND
        trigger: "POST /household-payroll/workers-comp-policies/{id}/bind"
        actor: PayrollAdmin
        preconditions:
          - "policy.status == QUOTED (else ERR_INVALID_STATE)"
        side_effects:
          - "employer.compliance_posture recomputed"
      - from: BOUND
        to: ACTIVE
        trigger: "system (logical clock reaches coverage_start; evaluated on every /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "policy.status == BOUND AND current date >= coverage_start"
        side_effects:
          - "employer.compliance_posture recomputed"
      - from: BOUND
        to: LAPSED
        trigger: "POST /household-payroll/workers-comp-policies/{id}/lapse"
        actor: PayrollAdmin
        preconditions:
          - "policy.status in {BOUND, ACTIVE} (else ERR_INVALID_STATE)"
        side_effects:
          - "employer.compliance_posture recomputed -> RESTRICTED when the state mandates coverage and no other BOUND|ACTIVE policy covers today"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /household-payroll/workers-comp-policies/{id}/lapse"
        actor: PayrollAdmin
        preconditions:
          - "policy.status in {BOUND, ACTIVE}"
        side_effects:
          - "employer.compliance_posture recomputed -> RESTRICTED as above"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock passes coverage_end; evaluated on every /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "policy.status == ACTIVE AND current date > coverage_end"
        side_effects:
          - "employer.compliance_posture recomputed"

  - entity: YearEndPackage
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /household-payroll/year-end-packages/{id}/finalize"
        actor: ComplianceOfficer
        preconditions:
          - "package.status == DRAFT (else ERR_INVALID_STATE)"
          - "all four QuarterlyFilings for (employer, tax_year) exist and are ACCEPTED (else ERR_FILINGS_INCOMPLETE)"
          - "every worker with an ISSUED paycheck in tax_year has a non-null ssn (else ERR_MISSING_SSN)"
        side_effects:
          - "schedule_h_total_cents, w2_lines, underpayment_penalty_applies computed (year_end_schedule_h)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: registration-create-stale-employer
    parent_entity: HouseholdEmployer
    write_endpoint: "POST /household-payroll/employers/{id}/registrations"
    occ_field: "expected_employer_version"
    description: |
      Creating a StateRegistration against a HouseholdEmployer whose version
      has advanced since the client last observed it is rejected: the client
      built the registration on a stale view of the employer (e.g. another
      registration was activated in between, flipping employer status and
      posture). The server compares expected_employer_version to the current
      employer.version and rejects the mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: agreement-create-stale-worker
    parent_entity: DomesticWorker
    write_endpoint: "POST /household-payroll/workers/{id}/agreements"
    occ_field: "expected_worker_version"
    description: |
      Creating an EmploymentAgreement supersedes the worker's current ACTIVE
      agreement; doing so against a DomesticWorker whose version has advanced
      since the client last observed it is rejected, because the supersede
      target may itself have changed. The server compares
      expected_worker_version to the current worker.version and rejects the
      mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: worker_classification_determination
    trigger: "POST /household-payroll/workers/{id}/classify"
    algorithm: threshold
    formula: |
      answers = classification_answers as map question_key -> answer
      score = 0
      if answers["controls_schedule"] == "WORKER":        score += 1
      if answers["supplies_own_tools"] == "WORKER":       score += 1
      if answers["hires_own_substitutes"] == "ALLOWED":   score += 1
      if answers["paid_by"] == "PROJECT_NOT_HOURS":       score += 1
      classification = CONTRACTOR if score >= 3 else EMPLOYEE
      (all four question_keys are required; missing keys -> ERR_INVALID_REQUEST)
    input_set: "the classify request body only; no other entity state"
    constants:
      CONTRACTOR_SCORE_MIN: 3
    precision: "integer score; no rounding"
    variants: []

  - name: gross_pay_hourly_overtime
    trigger: "POST /household-payroll/pay-runs/{id}/calculate (per member paycheck with pay_method=HOURLY)"
    algorithm: threshold
    formula: |
      # Inputs: covering timesheet entries (if basis=TIMESHEET), agreement
      # (hourly_rate_cents, guaranteed_minutes_per_week), worker.work_arrangement,
      # StateRulePack (weekly/daily thresholds, live-in eligibility), pay-run
      # period. rate_per_minute = hourly_rate_cents / 60 (must divide evenly;
      # validated at agreement create: hourly_rate_cents % 60 == 0).
      #
      # Evaluation order (pinned):
      # 1. daily extraction (skip for LIVE_IN unless pack.live_in_daily_ot_eligible):
      #    per entry: dt = max(0, worked - daily_dt_threshold) when threshold > 0
      #               ot = min(worked, daily_dt_threshold or +inf) - min(worked, daily_ot_threshold or +inf) when daily_ot_threshold > 0
      #               regular += worked - ot - dt
      # 2. weekly extraction (skip for LIVE_IN unless pack.live_in_weekly_ot_eligible):
      #    weekly_ot = max(0, regular_after_daily - weekly_ot_threshold_minutes)
      #    regular -= weekly_ot; ot += weekly_ot
      # 3. guarantee top-up: guaranteed_period_minutes =
      #    guaranteed_minutes_per_week * WEEKS_PER_PERIOD (WEEKLY=1, BIWEEKLY=2,
      #    SEMIMONTHLY=2, MONTHLY=4); top_up = max(0, guaranteed_period_minutes - total_worked)
      # 4. pay: gross = rate_per_minute * (regular + top_up)
      #             + round_half_up(rate_per_minute * 1.5) * ot
      #             + rate_per_minute * 2 * dt
      #    (rate_per_minute is integer; 1.5x rate rounded half-up to cents-per-minute BEFORE multiplying by ot minutes)
      # basis=GUARANTEE_FALLBACK (no covering approved timesheet):
      #    regular = guaranteed_period_minutes; ot = dt = 0; gross = rate_per_minute * regular
      #    provisional_gross_cents is ALWAYS this guarantee-basis figure, regardless of basis.
    input_set: "timesheets of this worker in status APPROVED or LOCKED exactly covering the pay-run period (at most one can exist due to overlap rules); the ACTIVE agreement covering period_start; the work-state StateRulePack"
    constants:
      OT_MULTIPLIER_NUM: 3
      OT_MULTIPLIER_DEN: 2
      DT_MULTIPLIER: 2
      WEEKS_PER_PERIOD: { WEEKLY: 1, BIWEEKLY: 2, SEMIMONTHLY: 2, MONTHLY: 4 }
    precision: "integer cents; rate_per_minute integer; half-up rounding only at the 1.5x rate step"
    variants:
      - name: live_in_state_dependent
        when: "worker.work_arrangement == LIVE_IN"
        difference: "daily and weekly OT extraction are skipped entirely unless the corresponding StateRulePack live-in eligibility flag is true; the same timesheet therefore yields different gross for LIVE_IN vs LIVE_OUT"

  - name: fluctuating_workweek_premium
    trigger: "POST /household-payroll/pay-runs/{id}/calculate (per member paycheck with pay_method=GUARANTEED_SALARY_FWW)"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking dependency, evaluation order PINNED (do not iterate):
      # 1. total_worked = sum of covering timesheet minutes (basis=TIMESHEET) or
      #    guaranteed_period_minutes (basis=GUARANTEE_FALLBACK)
      # 2. ot_minutes = max(0, total_worked - weekly_ot_threshold_minutes) when OT
      #    eligible for this arrangement, else 0 (daily thresholds do NOT apply to FWW)
      # 3. fww_effective_rate_cents_per_minute =
      #      round_half_up(weekly_guarantee_pay_cents * weeks_in_period / total_worked, 4)
      #    where weekly_guarantee_pay_cents = guaranteed_minutes_per_week * rate_per_minute
      #    (note: rate appears to depend on total hours while premium depends on rate)
      # 4. premium_cents = round_half_up(0.5 * fww_effective_rate_cents_per_minute * ot_minutes)
      # 5. gross = weekly_guarantee_pay_cents * weeks_in_period + premium_cents
      #    provisional_gross_cents = weekly_guarantee_pay_cents * weeks_in_period (no premium)
    input_set: "same as gross_pay_hourly_overtime; only agreements with pay_method=GUARANTEED_SALARY_FWW"
    constants:
      FWW_OT_PREMIUM_FACTOR: 0.5
      RATE_DECIMALS: 4
    precision: "effective rate at exactly 4 decimal places round_half_up; premium half-up to cents"
    variants: []

  - name: paycheck_withholding_net
    trigger: "POST /household-payroll/pay-runs/{id}/calculate (per member paycheck, after gross)"
    algorithm: aggregation
    formula: |
      # Per-line rounding order is PINNED: each line is rounded to cents
      # half-up FIRST, then net = gross - sum(rounded lines). Summing exact
      # values and rounding once is FORBIDDEN (produces different cents).
      # Lines whose computed amount is 0 are OMITTED from the lines arrays.
      # FICA coverage at calculate time uses the projected YTD: covered when
      #   cash_wages_ytd_cents + (sum of gross of this run's checks already
      #   calculated for this worker) + gross_cents >= FICA_COVERAGE_THRESHOLD_CENTS
      # When covered, the FICA base of this check includes the retroactive
      # catch-up: gross_cents + sum(gross of earlier ISSUED checks this year
      # whose FICA base was 0).
      # fica_wages_this_check (only when covered):
      #   room = max(0, SS_WAGE_BASE_CENTS - ss_wages_paid_ytd_cents)
      #   ss_base = min(gross_cents, room)
      #   catch_up = max(0, gross_cents already paid this year that became
      #              retroactively taxable on this check) — see
      #              fica_retroactive_coverage; ss_base includes the catch-up
      #              portion of prior checks' wages.
      #   SS_EE = round_half_up(ss_base * 0.062)
      #   MEDICARE_EE = round_half_up(min(gross, no cap) * 0.0145) on all FICA wages incl. catch-up
      #   ADDL_MEDICARE_EE = round_half_up(max(0, fica_wages_ytd_after - 20000000) applied portion * 0.009)
      # SIT_EE = round_half_up(gross_cents * pack.sit_rate)
      # FIT_EE = agreement.fit_withholding_cents_per_period (flat)
      # net_pay_cents = gross_cents - (SS_EE + MEDICARE_EE + ADDL_MEDICARE_EE + SIT_EE + FIT_EE)
      # Employer lines (not deducted from net):
      #   SS_ER = round_half_up(ss_base * 0.062); MEDICARE_ER = round_half_up(fica_base * 0.0145)
      #   FUTA_ER = round_half_up(futa_base * 0.006) when futa_applies_ytd
      #   SUTA_ER = round_half_up(suta_base * pack.suta_rate)
    input_set: "the paycheck's gross_cents; worker YTD fields BEFORE this check (ss_wages_paid_ytd_cents, futa_wages_ytd_cents, cash_wages_ytd_cents); the work-state pack"
    constants:
      SS_RATE: 0.062
      MEDICARE_RATE: 0.0145
      ADDL_MEDICARE_RATE: 0.009
      ADDL_MEDICARE_THRESHOLD_CENTS: 20000000
      SS_WAGE_BASE_CENTS: 17610000
      FUTA_RATE: 0.006
    precision: "each line rounded half-up to integer cents BEFORE summation; net derived from rounded lines"
    variants:
      - name: provisional
        when: "paycheck created at calculate time"
        difference: "computed over provisional_gross_cents (guarantee basis, no OT/top-up) — stored for comparison, not issued"
      - name: final
        when: "paycheck issued at finalize time"
        difference: "computed over gross_cents (timesheet basis with OT/top-up when a covering approved timesheet exists); identical inputs to provisional therefore produce different net_pay_cents whenever worked minutes diverge from the guarantee"

  - name: fica_retroactive_coverage
    trigger: "pay run finalize (per member worker) and paycheck void"
    algorithm: chronological
    formula: |
      # Coverage test is on CUMULATIVE year-to-date cash wages, evaluated in
      # pay_date order; boundary is exact: >= triggers.
      # At CALCULATE, coverage for a check is projected: cash_wages_ytd_cents
      # plus this check's gross_cents (plus same-run earlier checks for the
      # worker) >= FICA_COVERAGE_THRESHOLD_CENTS.
      # At FINALIZE the computed lines are applied: cash_wages_ytd_cents
      #   += gross; when the check is the crossing check, ALL wages paid this
      #   year become FICA wages, including earlier checks with zero FICA base
      #   (their gross is withheld on this check as the catch-up base, still
      #   capped by remaining SS wage-base room); ss_wages_paid_ytd_cents and
      #   futa_wages_ytd_cents advance by the applied bases.
      # Void of an ISSUED check: cash_wages_ytd_cents decremented;
      # fica_covered re-evaluated; if coverage is LOST, accrued FICA lines for
      # the year's checks are reversed through TaxLiabilityAccount.
    input_set: "worker's ISSUED (non-VOIDED) paychecks with pay_date in the clock calendar year, ordered by pay_date ASC then created_at ASC"
    constants:
      FICA_COVERAGE_THRESHOLD_CENTS: 280000
    precision: "integer cents; no rounding"
    variants: []

  - name: futa_quarterly_with_wage_base
    trigger: "pay run finalize (per paycheck employer lines) and quarterly-filing prepare"
    algorithm: chronological
    formula: |
      # futa_applies for a quarter: household total cash wages with pay_date in
      # the quarter >= FUTA_QUARTER_TRIGGER_CENTS (boundary exact: >=).
      # Once any quarter of the year applies, FUTA accrues for the whole year.
      # Per worker per year: futa_base_on_check =
      #   min(gross_cents, max(0, FUTA_WAGE_BASE_CENTS - futa_wages_ytd_cents))
      # futa_wages_ytd_cents += futa_base_on_check (chronological, pay_date order)
      # FUTA_ER line = round_half_up(futa_base_on_check * FUTA_RATE)
    input_set: "ISSUED paychecks of the employer ordered by pay_date ASC then created_at ASC; per-worker futa_wages_ytd_cents accumulator"
    constants:
      FUTA_QUARTER_TRIGGER_CENTS: 100000
      FUTA_WAGE_BASE_CENTS: 700000
      FUTA_RATE: 0.006
    precision: "line rounded half-up to cents"
    variants: []

  - name: suta_accrual
    trigger: "pay run finalize (per paycheck employer lines) and quarterly-filing prepare"
    algorithm: chronological
    formula: |
      # per worker per year: suta_base_on_check =
      #   min(gross_cents, max(0, pack.suta_wage_base_cents - suta_wages_paid_ytd))
      # SUTA_ER line = round_half_up(suta_base_on_check * pack.suta_rate)
      # (suta_wages_paid_ytd tracked per worker inside TaxLiabilityAccount accrual)
    input_set: "ISSUED paychecks ordered by pay_date ASC then created_at ASC; work-state pack of each worker"
    constants: {}
    precision: "line rounded half-up to cents"
    variants: []

  - name: safe_harbor_deposit_requirement
    trigger: "POST /household-payroll/employers/{id}/deposits (captures required_amount_cents) and quarterly-filing prepare (estimated_federal_payment_cents)"
    algorithm: forward_looking
    formula: |
      # Evaluation order PINNED (circular-looking: the requirement depends on
      # the projection, the projection depends on what has been deposited):
      # 1. per_period_avg = accrued-to-date (FICA_EE + FICA_ER + FUTA_ER) /
      #    max(1, periods_elapsed), where periods_elapsed = count of the
      #    employer's FINALIZED pay runs with pay_date in the tax year
      #    [total periods per employer.pay_frequency: WEEKLY=52, BIWEEKLY=26, SEMIMONTHLY=24, MONTHLY=12]
      # 2. projected_annual = accrued + per_period_avg * (total_periods - periods_elapsed)
      # 3. safe_harbor_cap = min(projected_annual, round_half_up(1.10 * prior_year_schedule_h_cents)) when prior_year_schedule_h_cents > 0, else projected_annual
      # 4. annual_required = safe_harbor_cap when safe_harbor_cap >= ESTIMATED_PAYMENT_THRESHOLD_CENTS else 0
      # 5. quarterly installment = round_half_up(annual_required / 4)
      # 6. required_amount_cents (for quarter q) = max(0, installment * q - deposited_ytd_for_year)
      # projected_annual_cents on TaxLiabilityAccount uses steps 1-2 for the
      # account's own tax_type; accrued_cents is the chronological variant of
      # the same underlying data — the two are intentionally different numbers.
    input_set: "TaxLiabilityAccount rows for (employer, current year); TaxDeposit rows for the year; employer.prior_year_schedule_h_cents and pay_frequency; logical clock for periods_elapsed"
    constants:
      SAFE_HARBOR_PCT: 1.10
      ESTIMATED_PAYMENT_THRESHOLD_CENTS: 100000
      PERIODS_PER_YEAR: { WEEKLY: 52, BIWEEKLY: 26, SEMIMONTHLY: 24, MONTHLY: 12 }
    precision: "integer cents; per_period_avg kept at 4 decimals until step 5 rounding"
    variants:
      - name: projected
        when: "steps 1-2: forward-looking estimate including remaining periods"
        difference: "assumes future periods repeat the observed per-period average; equals accrued only after the final period of the year"
      - name: actual
        when: "accrued_cents: chronological sum of finalized lines to date"
        difference: "ignores future periods entirely; same ledger data, deliberately different result from projected until year-end"

  - name: paid_leave_accrual
    trigger: "timesheet approve (per worker)"
    algorithm: aggregation
    formula: |
      # Incremental, floor-based; cap per calendar year:
      # accrued_leave_minutes = min(floor(ytd_approved_minutes / LEAVE_ACCRUAL_DIVISOR), LEAVE_ANNUAL_CAP_MINUTES)
      # available_leave_minutes = accrued_leave_minutes - used_leave_minutes
      # floor means the 29th worked minute of a 30-minute unit earns nothing.
    input_set: "worker.ytd_approved_minutes (APPROVED or LOCKED timesheets, clock calendar year); worker.used_leave_minutes"
    constants:
      LEAVE_ACCRUAL_DIVISOR: 30
      LEAVE_ANNUAL_CAP_MINUTES: 2400
    precision: "integer minutes; floor division"
    variants: []

  - name: late_deposit_penalty
    trigger: "POST /household-payroll/employers/{id}/deposits (at creation)"
    algorithm: threshold
    formula: |
      # late_days = max(0, remitted_on - due_date) in whole days
      # tier by late_days over REQUIRED (not remitted) amount:
      #   0            -> 0
      #   1..5         -> round_half_up(0.02 * required_amount_cents)
      #   6..15        -> round_half_up(0.05 * required_amount_cents)
      #   16+          -> round_half_up(0.10 * required_amount_cents)
      # boundaries are exact: late_days == 5 is the 2% tier, late_days == 6 is 5%
    input_set: "the TaxDeposit being created (quarter -> due_date; remitted_on; required_amount_cents from safe_harbor_deposit_requirement)"
    constants:
      TIER1_MAX_DAYS: 5
      TIER1_RATE: 0.02
      TIER2_MAX_DAYS: 15
      TIER2_RATE: 0.05
      TIER3_RATE: 0.10
    precision: "integer cents half-up"
    variants: []

  - name: year_end_schedule_h
    trigger: "POST /household-payroll/year-end-packages/{id}/finalize"
    algorithm: aggregation
    formula: |
      # schedule_h_total_cents = FICA_EE.accrued + FICA_ER.accrued + FUTA_ER.accrued
      #   + sum(FIT_EE lines over the year's ISSUED paychecks)
      # w2_lines: per worker with ISSUED paychecks in tax_year:
      #   wages_cents = sum(gross); ss_wages_cents = sum(ss bases);
      #   ss_tax_cents = sum(SS_EE lines); medicare_tax_cents = sum(MEDICARE_EE + ADDL_MEDICARE_EE);
      #   sit_cents = sum(SIT_EE); fit_cents = sum(FIT_EE)
      # underpayment_penalty_applies =
      #   total year deposits < min(round_half_up(0.90 * schedule_h_total_cents),
      #                             round_half_up(1.10 * prior_year_schedule_h_cents))
      #   (when prior_year_schedule_h_cents == 0, only the 90% leg applies)
    input_set: "TaxLiabilityAccount rows for (employer, tax_year); ISSUED paychecks with pay_date in tax_year; TaxDeposit rows for tax_year"
    constants:
      UNDERPAYMENT_ACTUAL_PCT: 0.90
      SAFE_HARBOR_PCT: 1.10
    precision: "integer cents; sums of already-rounded lines"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present, role is one of the declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role is permitted on the endpoint; for entity_backed roles the X-User-ID must match the owning entity (HouseholdClient: path/body employer id; Worker: path/body worker id)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path identifiers resolve left-to-right (employer, worker, timesheet, pay run, paycheck, leave request, registration, filing, policy, deposit, package)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "request body shape: required fields present, types correct, enum members valid, dates ISO and ordered (start < end where half-open; start <= end where closed); hourly_rate_cents % 60 == 0", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: existence, check: "OCC: expected_employer_version == employer.version (registration create); expected_worker_version == worker.version (agreement create)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /household-payroll/employers/{id}/registrations", "POST /household-payroll/workers/{id}/agreements"] }
  - { priority: 6, category: state, check: "state-machine precondition of the target transition (from-state, parent status). Non-transition state gates pinned here: pay-run create and finalize require employer.status == ACTIVE; registration create requires employer.status in {ONBOARDING, ACTIVE}; timesheet create requires worker.status in {CLASSIFIED, ACTIVE}; leave create requires worker.status == ACTIVE; worker activate from ONBOARDING (classification still UNDETERMINED) fails here", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "pay run finalize while recalc_status == STALE", error_id: ERR_PAYRUN_STALE, http_status: 409, applies_to: ["POST /household-payroll/pay-runs/{id}/finalize"] }
  - { priority: 7, category: business_safety, check: "pay run finalize: employer.compliance_posture != RESTRICTED", error_id: ERR_EMPLOYER_RESTRICTED, http_status: 409, applies_to: ["POST /household-payroll/pay-runs/{id}/finalize"] }
  - { priority: 7, category: business_safety, check: "pay run finalize: every member worker in a workers_comp_required state has a BOUND|ACTIVE policy covering pay_date", error_id: ERR_WORKERS_COMP_REQUIRED, http_status: 422, applies_to: ["POST /household-payroll/pay-runs/{id}/finalize"] }
  - { priority: 8, category: business_temporal, check: "timesheet create: half-open [period_start, period_end) must not overlap any other non-LOCKED-replaced timesheet of the same worker; adjacency (end == other.start) is allowed", error_id: ERR_TIMESHEET_OVERLAP, http_status: 409, applies_to: ["POST /household-payroll/workers/{id}/timesheets"] }
  - { priority: 8, category: business_temporal, check: "leave create: closed [start_date, end_date] must not overlap any REQUESTED|APPROVED leave of the same worker; back-to-back (other.end + 1 day == start) is allowed", error_id: ERR_LEAVE_OVERLAP, http_status: 409, applies_to: ["POST /household-payroll/workers/{id}/leave-requests"] }
  - { priority: 8, category: business_temporal, check: "pay run create: half-open period must not overlap any other non-terminal pay run of the employer", error_id: ERR_PAYRUN_OVERLAP, http_status: 409, applies_to: ["POST /household-payroll/employers/{id}/pay-runs"] }
  - { priority: 8, category: business_temporal, check: "worker activate: hire_date <= new_hire_report_date <= min(hire_date + pack.new_hire_report_days, logical-clock current date)", error_id: ERR_NEW_HIRE_REPORT_LATE, http_status: 422, applies_to: ["POST /household-payroll/workers/{id}/activate"] }
  - { priority: 8, category: business_temporal, check: "filing prepare: logical-clock current date must be strictly after the quarter's last day", error_id: ERR_QUARTER_NOT_CLOSED, http_status: 422, applies_to: ["POST /household-payroll/quarterly-filings/{id}/prepare"] }
  - { priority: 8, category: business_temporal, check: "deposit create: remitted_on must not be after the logical-clock current date", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: ["POST /household-payroll/employers/{id}/deposits"] }
  - { priority: 9, category: business_referential, check: "employer create (primary_state_code) / worker create (work_state_code) / policy create (state_code): a StateRulePack exists for the referenced state", error_id: ERR_STATE_RULES_MISSING, http_status: 422, applies_to: ["POST /household-payroll/employers", "POST /household-payroll/employers/{id}/workers", "POST /household-payroll/employers/{id}/workers-comp-policies"] }
  - { priority: 9, category: business_referential, check: "timesheet create: an EmploymentAgreement with status == ACTIVE covers [period_start, period_end)", error_id: ERR_NO_ACTIVE_AGREEMENT, http_status: 422, applies_to: ["POST /household-payroll/workers/{id}/timesheets"] }
  - { priority: 9, category: business_referential, check: "worker activate: NEW_HIRE_DIRECTORY registration for work_state is ACTIVE", error_id: ERR_REGISTRATION_INACTIVE, http_status: 422, applies_to: ["POST /household-payroll/workers/{id}/activate"] }
  - { priority: 9, category: business_referential, check: "pay run finalize: SIT_WITHHOLDING and SUTA registrations ACTIVE for every member worker's work state", error_id: ERR_REGISTRATION_INACTIVE, http_status: 422, applies_to: ["POST /household-payroll/pay-runs/{id}/finalize"] }
  - { priority: 9, category: business_referential, check: "year-end finalize: all four QuarterlyFilings for (employer, tax_year) exist and are ACCEPTED", error_id: ERR_FILINGS_INCOMPLETE, http_status: 422, applies_to: ["POST /household-payroll/year-end-packages/{id}/finalize"] }
  - { priority: 10, category: business_constraint, check: "employer create: pay_frequency must be at least as frequent as the primary state's pack min_pay_frequency (WEEKLY > BIWEEKLY > SEMIMONTHLY > MONTHLY)", error_id: ERR_PAY_FREQUENCY_NONCOMPLIANT, http_status: 422, applies_to: ["POST /household-payroll/employers"] }
  - { priority: 10, category: business_constraint, check: "pay run create: period span must match the employer's pay_frequency exactly", error_id: ERR_PERIOD_LENGTH_MISMATCH, http_status: 422, applies_to: ["POST /household-payroll/employers/{id}/pay-runs"] }
  - { priority: 10, category: business_constraint, check: "worker activate: classification CONTRACTOR may not be put on payroll", error_id: ERR_CONTRACTOR_NOT_PAYABLE, http_status: 422, applies_to: ["POST /household-payroll/workers/{id}/activate"] }
  - { priority: 10, category: business_constraint, check: "agreement create: hourly_rate_cents >= work-state pack min_wage_cents", error_id: ERR_BELOW_MIN_WAGE, http_status: 422, applies_to: ["POST /household-payroll/workers/{id}/agreements"] }
  - { priority: 10, category: business_constraint, check: "uniqueness: StateRulePack.state_code; StateRegistration (employer, state, agency) among non-terminal; QuarterlyFiling (employer, year, quarter); YearEndPackage (employer, year)", error_id: ERR_DUPLICATE_RULE_PACK, http_status: 409, applies_to: ["POST /household-payroll/state-rule-packs"] }
  - { priority: 10, category: business_constraint, check: "duplicate active registration for (employer, state_code, agency)", error_id: ERR_DUPLICATE_REGISTRATION, http_status: 409, applies_to: ["POST /household-payroll/employers/{id}/registrations"] }
  - { priority: 10, category: business_constraint, check: "duplicate filing for (employer, tax_year, quarter)", error_id: ERR_DUPLICATE_FILING, http_status: 409, applies_to: ["POST /household-payroll/employers/{id}/quarterly-filings"] }
  - { priority: 10, category: business_constraint, check: "duplicate year-end package for (employer, tax_year)", error_id: ERR_DUPLICATE_YEAR_END_PACKAGE, http_status: 409, applies_to: ["POST /household-payroll/employers/{id}/year-end-packages"] }
  - { priority: 10, category: business_constraint, check: "filing submit: calling X-User-ID must differ from prepared_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /household-payroll/quarterly-filings/{id}/submit"] }
  - { priority: 11, category: business_fiscal, check: "leave create: requested_minutes <= worker.available_leave_minutes", error_id: ERR_INSUFFICIENT_LEAVE_BALANCE, http_status: 422, applies_to: ["POST /household-payroll/workers/{id}/leave-requests", "POST /household-payroll/leave-requests/{id}/approve"] }
  - { priority: 11, category: business_fiscal, check: "deposit create: amount_cents >= required_amount_cents (safe-harbor requirement)", error_id: ERR_DEPOSIT_BELOW_REQUIRED, http_status: 422, applies_to: ["POST /household-payroll/employers/{id}/deposits"] }
  - { priority: 11, category: business_fiscal, check: "year-end finalize: every worker with ISSUED paychecks in tax_year has ssn set", error_id: ERR_MISSING_SSN, http_status: 422, applies_to: ["POST /household-payroll/year-end-packages/{id}/finalize"] }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - { method: POST, path: "/household-payroll/_clock/set_current_utc", description: "Set the server logical clock. Default before any call is exactly 2026-08-01T00:00:00Z (never falls back to wall clock). Advancing the clock evaluates BOUND->ACTIVE and ACTIVE->EXPIRED policy sweeps.", roles: [PayrollAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["policy status sweeps", "compliance_posture recompute for affected employers"] }

  # --- employers ---
  - { method: POST, path: "/household-payroll/employers", description: "Onboard a household employer", roles: [PayrollAdmin], code: 201, input: [legal_name, primary_state_code, fein, pay_frequency, "prior_year_schedule_h_cents?"], output: HouseholdEmployer, side_effects: ["status = ONBOARDING", "compliance_posture initialized CLEAR"] }
  - { method: GET, path: "/household-payroll/employers/{id}", description: "Read one employer", roles: [PayrollAdmin, ComplianceOfficer, HouseholdClient], code: 200, input: [], output: HouseholdEmployer, side_effects: [] }
  - { method: POST, path: "/household-payroll/employers/{id}/suspend", description: "Suspend an employer (blocks pay run create/finalize)", roles: [ComplianceOfficer], code: 200, input: [], output: HouseholdEmployer, side_effects: ["status -> SUSPENDED"] }
  - { method: POST, path: "/household-payroll/employers/{id}/reinstate", description: "Reinstate a suspended employer", roles: [ComplianceOfficer], code: 200, input: [], output: HouseholdEmployer, side_effects: ["status -> ACTIVE", "posture recompute"] }

  # --- state rule packs (configuration) ---
  - { method: POST, path: "/household-payroll/state-rule-packs", description: "Create a state's labor/tax rule pack (one per state_code)", roles: [PayrollAdmin], code: 201, input: [state_code, min_pay_frequency, weekly_ot_threshold_minutes, daily_ot_threshold_minutes, daily_dt_threshold_minutes, live_in_weekly_ot_eligible, live_in_daily_ot_eligible, min_wage_cents, sit_rate, suta_rate, suta_wage_base_cents, workers_comp_required, new_hire_report_days, pay_stub_required], output: StateRulePack, side_effects: [] }
  - { method: GET, path: "/household-payroll/state-rule-packs", description: "List rule packs, optionally filtered by state_code", roles: [PayrollAdmin, ComplianceOfficer, HouseholdClient, Worker], code: 200, input: ["state_code?", "limit?", "offset?"], output: "StateRulePack[]", side_effects: [] }

  # --- registrations ---
  - { method: POST, path: "/household-payroll/employers/{id}/registrations", description: "Open a state agency registration for an employer (OCC on employer version)", roles: [PayrollAdmin], code: 201, input: [state_code, agency, expected_employer_version], output: StateRegistration, side_effects: ["increments HouseholdEmployer.version by 1", "status = DRAFT"] }
  - { method: POST, path: "/household-payroll/registrations/{id}/submit", description: "Submit a DRAFT registration to the agency", roles: [PayrollAdmin], code: 200, input: [], output: StateRegistration, side_effects: ["status -> SUBMITTED", "submitted_at stamped"] }
  - { method: POST, path: "/household-payroll/registrations/{id}/activate", description: "Activate a SUBMITTED registration with the issued account number", roles: [PayrollAdmin], code: 200, input: [agency_account_number], output: StateRegistration, side_effects: ["status -> ACTIVE", "first ACTIVE registration flips employer ONBOARDING -> ACTIVE", "posture recompute"] }
  - { method: GET, path: "/household-payroll/employers/{id}/registrations", description: "List an employer's registrations", roles: [PayrollAdmin, ComplianceOfficer, HouseholdClient], code: 200, input: ["state_code?", "status?", "limit?", "offset?"], output: "StateRegistration[]", side_effects: [] }

  # --- workers ---
  - { method: POST, path: "/household-payroll/employers/{id}/workers", description: "Add a domestic worker (status ONBOARDING, classification UNDETERMINED)", roles: [HouseholdClient], code: 201, input: [full_name, "ssn?", work_state_code, hire_date, work_arrangement], output: DomesticWorker, side_effects: [] }
  - { method: GET, path: "/household-payroll/workers/{id}", description: "Read one worker", roles: [PayrollAdmin, ComplianceOfficer, HouseholdClient, Worker], code: 200, input: [], output: DomesticWorker, side_effects: [] }
  - { method: GET, path: "/household-payroll/employers/{id}/workers", description: "List an employer's workers", roles: [PayrollAdmin, ComplianceOfficer, HouseholdClient], code: 200, input: ["status?", "limit?", "offset?"], output: "DomesticWorker[]", side_effects: [] }
  - { method: POST, path: "/household-payroll/workers/{id}/classify", description: "Run the employee-vs-contractor questionnaire; sets classification", roles: [HouseholdClient], code: 200, input: [classification_answers], output: DomesticWorker, side_effects: ["classification computed", "status ONBOARDING -> CLASSIFIED (self-loop on re-classify)"] }
  - { method: POST, path: "/household-payroll/workers/{id}/activate", description: "Activate a CLASSIFIED EMPLOYEE for payroll", roles: [HouseholdClient], code: 200, input: [new_hire_report_date], output: DomesticWorker, side_effects: ["status -> ACTIVE"] }
  - { method: POST, path: "/household-payroll/workers/{id}/terminate", description: "Terminate an ACTIVE worker", roles: [HouseholdClient], code: 200, input: [], output: DomesticWorker, side_effects: ["status -> TERMINATED", "termination_date stamped", "ACTIVE agreements -> TERMINATED"] }

  # --- agreements ---
  - { method: POST, path: "/household-payroll/workers/{id}/agreements", description: "Create an agreement; supersedes the worker's current ACTIVE agreement (OCC on worker version)", roles: [HouseholdClient], code: 201, input: [hourly_rate_cents, pay_method, "guaranteed_minutes_per_week?", "fit_withholding_cents_per_period?", effective_from, expected_worker_version], output: EmploymentAgreement, side_effects: ["increments DomesticWorker.version by 1", "prior ACTIVE agreement -> SUPERSEDED with effective_to = effective_from - 1 day"] }
  - { method: GET, path: "/household-payroll/workers/{id}/agreements", description: "List a worker's agreements", roles: [PayrollAdmin, ComplianceOfficer, HouseholdClient, Worker], code: 200, input: ["status?", "limit?", "offset?"], output: "EmploymentAgreement[]", side_effects: [] }
  - { method: GET, path: "/household-payroll/agreements/{id}", description: "Read one agreement", roles: [PayrollAdmin, ComplianceOfficer, HouseholdClient, Worker], code: 200, input: [], output: EmploymentAgreement, side_effects: [] }
  - { method: GET, path: "/household-payroll/agreements/{id}/superseded", description: "List the agreement this one superseded (array of 0 or 1)", roles: [PayrollAdmin, ComplianceOfficer, HouseholdClient, Worker], code: 200, input: ["limit?", "offset?"], output: "EmploymentAgreement[]", side_effects: [] }

  # --- timesheets ---
  - { method: POST, path: "/household-payroll/workers/{id}/timesheets", description: "Create a DRAFT timesheet for a half-open period", roles: [Worker], code: 201, input: [period_start, period_end, entries], output: Timesheet, side_effects: ["total_worked_minutes computed"] }
  - { method: POST, path: "/household-payroll/timesheets/{id}/submit", description: "Submit a DRAFT timesheet", roles: [Worker], code: 200, input: [], output: Timesheet, side_effects: ["status -> SUBMITTED", "submitted_at stamped"] }
  - { method: POST, path: "/household-payroll/timesheets/{id}/approve", description: "Approve a SUBMITTED timesheet (cascades to worker YTD, pay-run STALE, paycheck basis_stale)", roles: [HouseholdClient], code: 200, input: [], output: Timesheet, side_effects: ["status -> APPROVED", "worker.ytd_approved_minutes += total; leave accrual recomputed", "covering CALCULATED pay runs -> STALE", "their CALCULATED paychecks -> basis_stale"] }
  - { method: POST, path: "/household-payroll/timesheets/{id}/reject", description: "Reject a SUBMITTED timesheet back to DRAFT", roles: [HouseholdClient], code: 200, input: [], output: Timesheet, side_effects: ["status -> DRAFT"] }
  - { method: GET, path: "/household-payroll/timesheets/{id}", description: "Read one timesheet", roles: [PayrollAdmin, HouseholdClient, Worker], code: 200, input: [], output: Timesheet, side_effects: [] }
  - { method: GET, path: "/household-payroll/workers/{id}/timesheets", description: "List a worker's timesheets", roles: [PayrollAdmin, HouseholdClient, Worker], code: 200, input: ["status?", "limit?", "offset?"], output: "Timesheet[]", side_effects: [] }

  # --- pay runs ---
  - { method: POST, path: "/household-payroll/employers/{id}/pay-runs", description: "Create an OPEN pay run for a half-open period", roles: [PayrollAdmin], code: 201, input: [period_start, period_end, pay_date], output: PayRun, side_effects: ["status = OPEN", "recalc_status = CURRENT"] }
  - { method: GET, path: "/household-payroll/pay-runs/{id}", description: "Read one pay run", roles: [PayrollAdmin, ComplianceOfficer, HouseholdClient], code: 200, input: [], output: PayRun, side_effects: [] }
  - { method: GET, path: "/household-payroll/employers/{id}/pay-runs", description: "List an employer's pay runs", roles: [PayrollAdmin, ComplianceOfficer, HouseholdClient], code: 200, input: ["status?", "limit?", "offset?"], output: "PayRun[]", side_effects: [] }
  - { method: POST, path: "/household-payroll/pay-runs/{id}/calculate", description: "(Re)calculate member paychecks; locks covering APPROVED timesheets; clears STALE", roles: [PayrollAdmin], code: 200, input: [], output: PayRun, side_effects: ["paychecks created/recomputed", "timesheets LOCKED + pay_run_id assigned", "status OPEN -> CALCULATED", "recalc_status = CURRENT", "totals recomputed"] }
  - { method: POST, path: "/household-payroll/pay-runs/{id}/finalize", description: "Issue paychecks (direct deposit + stub), accrue tax liabilities", roles: [PayrollAdmin], code: 200, input: [], output: PayRun, side_effects: ["paychecks ISSUED, deposit SENT, stub DELIVERED/NOT_REQUIRED", "worker YTD wage fields updated", "TaxLiabilityAccount accruals", "status -> FINALIZED", "posture recompute"] }
  - { method: GET, path: "/household-payroll/pay-runs/{id}/paychecks", description: "List a pay run's paychecks", roles: [PayrollAdmin, ComplianceOfficer, HouseholdClient], code: 200, input: ["limit?", "offset?"], output: "Paycheck[]", side_effects: [] }
  - { method: GET, path: "/household-payroll/pay-runs/{id}/timesheets", description: "List timesheets locked into a pay run", roles: [PayrollAdmin, ComplianceOfficer, HouseholdClient], code: 200, input: ["limit?", "offset?"], output: "Timesheet[]", side_effects: [] }

  # --- paychecks ---
  - { method: GET, path: "/household-payroll/paychecks/{id}", description: "Read one paycheck", roles: [PayrollAdmin, HouseholdClient, Worker], code: 200, input: [], output: Paycheck, side_effects: [] }
  - { method: POST, path: "/household-payroll/paychecks/{id}/void", description: "Void an ISSUED paycheck (compensating reversal)", roles: [PayrollAdmin], code: 200, input: [], output: Paycheck, side_effects: ["status -> VOIDED", "deposit_status -> REVERSAL_PENDING if SENT", "pay-run totals recomputed", "worker YTD decremented", "tax accruals reversed", "posture recompute"] }
  - { method: GET, path: "/household-payroll/workers/{id}/paychecks", description: "List a worker's paychecks", roles: [PayrollAdmin, HouseholdClient, Worker], code: 200, input: ["limit?", "offset?"], output: "Paycheck[]", side_effects: [] }

  # --- leave ---
  - { method: POST, path: "/household-payroll/workers/{id}/leave-requests", description: "Request paid leave (closed date interval)", roles: [Worker], code: 201, input: [start_date, end_date, requested_minutes], output: LeaveRequest, side_effects: ["status = REQUESTED"] }
  - { method: POST, path: "/household-payroll/leave-requests/{id}/approve", description: "Approve a leave request; consumes accrued balance", roles: [HouseholdClient], code: 200, input: [], output: LeaveRequest, side_effects: ["status -> APPROVED", "worker.used_leave_minutes += requested"] }
  - { method: POST, path: "/household-payroll/leave-requests/{id}/deny", description: "Deny a leave request", roles: [HouseholdClient], code: 200, input: [], output: LeaveRequest, side_effects: ["status -> DENIED"] }
  - { method: POST, path: "/household-payroll/leave-requests/{id}/cancel", description: "Cancel a REQUESTED or APPROVED leave; restores balance", roles: [Worker], code: 200, input: [], output: LeaveRequest, side_effects: ["status -> CANCELLED", "worker.used_leave_minutes -= requested if it was APPROVED"] }
  - { method: GET, path: "/household-payroll/workers/{id}/leave-requests", description: "List a worker's leave requests", roles: [PayrollAdmin, HouseholdClient, Worker], code: 200, input: ["status?", "limit?", "offset?"], output: "LeaveRequest[]", side_effects: [] }

  # --- tax ledger ---
  - { method: GET, path: "/household-payroll/employers/{id}/tax-accounts", description: "List an employer's per-type per-year tax liability accounts", roles: [PayrollAdmin, ComplianceOfficer, HouseholdClient], code: 200, input: ["tax_year?", "limit?", "offset?"], output: "TaxLiabilityAccount[]", side_effects: [] }
  - { method: POST, path: "/household-payroll/employers/{id}/deposits", description: "Record a tax deposit; captures required amount and computes lateness penalty", roles: [PayrollAdmin], code: 201, input: [tax_year, quarter, amount_cents, remitted_on], output: TaxDeposit, side_effects: ["required_amount_cents / due_date / late_days / penalty_cents computed", "TaxLiabilityAccount.deposited_cents and penalty_cents updated", "employer posture recompute"] }
  - { method: GET, path: "/household-payroll/employers/{id}/deposits", description: "List an employer's deposits", roles: [PayrollAdmin, ComplianceOfficer, HouseholdClient], code: 200, input: ["tax_year?", "limit?", "offset?"], output: "TaxDeposit[]", side_effects: [] }

  # --- quarterly filings ---
  - { method: POST, path: "/household-payroll/employers/{id}/quarterly-filings", description: "Open a quarterly filing", roles: [PayrollAdmin], code: 201, input: [tax_year, quarter], output: QuarterlyFiling, side_effects: ["status = OPEN"] }
  - { method: POST, path: "/household-payroll/quarterly-filings/{id}/prepare", description: "Compute filing amounts (OPEN or REJECTED -> PREPARED)", roles: [PayrollAdmin], code: 200, input: [], output: QuarterlyFiling, side_effects: ["amounts recomputed", "prepared_by_user_id stamped"] }
  - { method: POST, path: "/household-payroll/quarterly-filings/{id}/submit", description: "Submit a PREPARED filing (must not be the preparer)", roles: [ComplianceOfficer], code: 200, input: [], output: QuarterlyFiling, side_effects: ["status -> SUBMITTED"] }
  - { method: POST, path: "/household-payroll/quarterly-filings/{id}/accept", description: "Agency accepts a SUBMITTED filing", roles: [ComplianceOfficer], code: 200, input: [], output: QuarterlyFiling, side_effects: ["status -> ACCEPTED", "posture recompute"] }
  - { method: POST, path: "/household-payroll/quarterly-filings/{id}/reject", description: "Agency rejects a SUBMITTED filing", roles: [ComplianceOfficer], code: 200, input: [], output: QuarterlyFiling, side_effects: ["status -> REJECTED", "posture recompute"] }
  - { method: GET, path: "/household-payroll/employers/{id}/quarterly-filings", description: "List an employer's quarterly filings", roles: [PayrollAdmin, ComplianceOfficer, HouseholdClient], code: 200, input: ["tax_year?", "status?", "limit?", "offset?"], output: "QuarterlyFiling[]", side_effects: [] }

  # --- workers' compensation ---
  - { method: POST, path: "/household-payroll/employers/{id}/workers-comp-policies", description: "Quote a workers' comp policy", roles: [PayrollAdmin], code: 201, input: [state_code, policy_number, coverage_start, coverage_end], output: WorkersCompPolicy, side_effects: ["status = QUOTED"] }
  - { method: POST, path: "/household-payroll/workers-comp-policies/{id}/bind", description: "Bind a QUOTED policy", roles: [PayrollAdmin], code: 200, input: [], output: WorkersCompPolicy, side_effects: ["status -> BOUND", "posture recompute"] }
  - { method: POST, path: "/household-payroll/workers-comp-policies/{id}/lapse", description: "Lapse a BOUND or ACTIVE policy", roles: [PayrollAdmin], code: 200, input: [], output: WorkersCompPolicy, side_effects: ["status -> LAPSED", "posture recompute (may force RESTRICTED)"] }
  - { method: GET, path: "/household-payroll/employers/{id}/workers-comp-policies", description: "List an employer's workers' comp policies", roles: [PayrollAdmin, ComplianceOfficer, HouseholdClient], code: 200, input: ["status?", "limit?", "offset?"], output: "WorkersCompPolicy[]", side_effects: [] }

  # --- year-end ---
  - { method: POST, path: "/household-payroll/employers/{id}/year-end-packages", description: "Open a year-end W-2 / Schedule H package", roles: [PayrollAdmin], code: 201, input: [tax_year], output: YearEndPackage, side_effects: ["status = DRAFT"] }
  - { method: POST, path: "/household-payroll/year-end-packages/{id}/finalize", description: "Finalize the package: computes Schedule H total and W-2 lines", roles: [ComplianceOfficer], code: 200, input: [], output: YearEndPackage, side_effects: ["schedule_h_total_cents / w2_lines / underpayment_penalty_applies computed", "status -> FINALIZED"] }
  - { method: GET, path: "/household-payroll/employers/{id}/year-end-packages", description: "List an employer's year-end packages", roles: [PayrollAdmin, ComplianceOfficer, HouseholdClient], code: 200, input: ["limit?", "offset?"], output: "YearEndPackage[]", side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or entity_backed X-User-ID does not match the owning employer/worker" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path identifier does not resolve (left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, unknown enum member, unordered dates, hourly rate not divisible by 60, future remitted_on" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_employer_version / expected_worker_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State-machine from-state or parent-state precondition violated" }
  - { id: ERR_PAYRUN_STALE, http: 409, condition: "Finalize attempted while pay run recalc_status == STALE" }
  - { id: ERR_EMPLOYER_RESTRICTED, http: 409, condition: "Finalize attempted while employer compliance_posture == RESTRICTED" }
  - { id: ERR_WORKERS_COMP_REQUIRED, http: 422, condition: "A member worker's state mandates workers' comp and no BOUND|ACTIVE policy covers pay_date" }
  - { id: ERR_TIMESHEET_OVERLAP, http: 409, condition: "Half-open timesheet period collides with an existing timesheet of the same worker" }
  - { id: ERR_LEAVE_OVERLAP, http: 409, condition: "Closed leave interval collides with an existing REQUESTED|APPROVED leave of the same worker" }
  - { id: ERR_PAYRUN_OVERLAP, http: 409, condition: "Pay-run period collides with another pay run of the same employer" }
  - { id: ERR_NEW_HIRE_REPORT_LATE, http: 422, condition: "new_hire_report_date outside [hire_date, hire_date + pack.new_hire_report_days] or in the future" }
  - { id: ERR_QUARTER_NOT_CLOSED, http: 422, condition: "Filing prepare attempted on or before the quarter's last day" }
  - { id: ERR_STATE_RULES_MISSING, http: 422, condition: "No StateRulePack exists for the referenced state_code" }
  - { id: ERR_NO_ACTIVE_AGREEMENT, http: 422, condition: "No ACTIVE EmploymentAgreement covers the timesheet period (or hire_date at activation)" }
  - { id: ERR_REGISTRATION_INACTIVE, http: 422, condition: "Required agency registration is not ACTIVE" }
  - { id: ERR_FILINGS_INCOMPLETE, http: 422, condition: "Year-end finalize requires four ACCEPTED quarterly filings" }
  - { id: ERR_CONTRACTOR_NOT_PAYABLE, http: 422, condition: "Activate attempted for a CONTRACTOR-classified worker" }
  - { id: ERR_PERIOD_LENGTH_MISMATCH, http: 422, condition: "Pay-run period span does not match the employer's pay_frequency" }
  - { id: ERR_PAY_FREQUENCY_NONCOMPLIANT, http: 422, condition: "Employer pay_frequency is less frequent than the state pack's min_pay_frequency" }
  - { id: ERR_BELOW_MIN_WAGE, http: 422, condition: "hourly_rate_cents below the work state's min_wage_cents" }
  - { id: ERR_DUPLICATE_RULE_PACK, http: 409, condition: "StateRulePack with this state_code already exists" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "Non-terminal registration for (employer, state_code, agency) already exists" }
  - { id: ERR_DUPLICATE_FILING, http: 409, condition: "Filing for (employer, tax_year, quarter) already exists" }
  - { id: ERR_DUPLICATE_YEAR_END_PACKAGE, http: 409, condition: "Year-end package for (employer, tax_year) already exists" }
  - { id: ERR_INSUFFICIENT_LEAVE_BALANCE, http: 422, condition: "requested_minutes exceeds worker.available_leave_minutes" }
  - { id: ERR_DEPOSIT_BELOW_REQUIRED, http: 422, condition: "amount_cents below the safe-harbor required_amount_cents" }
  - { id: ERR_MISSING_SSN, http: 422, condition: "Year-end finalize: a worker with ISSUED paychecks in the year has no ssn" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Filing submitter X-User-ID equals prepared_by_user_id" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PayrollAdmin
    description: "Payroll service operator: onboards employers, maintains rule packs and registrations, runs payroll, records deposits, prepares filings, manages policies and year-end packages"
    identity: opaque
    exclusive_operations:
      - "POST /household-payroll/employers"
      - "POST /household-payroll/state-rule-packs"
      - "POST /household-payroll/employers/{id}/registrations (+ submit/activate)"
      - "POST /household-payroll/employers/{id}/pay-runs (+ calculate/finalize)"
      - "POST /household-payroll/paychecks/{id}/void"
      - "POST /household-payroll/employers/{id}/deposits"
      - "POST /household-payroll/employers/{id}/quarterly-filings (+ prepare)"
      - "POST /household-payroll/employers/{id}/workers-comp-policies (+ bind/lapse)"
      - "POST /household-payroll/employers/{id}/year-end-packages"
      - "POST /household-payroll/_clock/set_current_utc"
    shared_operations:
      - "All GET list/read endpoints"
  - name: ComplianceOfficer
    description: "Independent compliance reviewer: suspends/reinstates employers, submits/accepts/rejects filings, finalizes year-end packages; must not be the same user id as the filing preparer"
    identity: opaque
    exclusive_operations:
      - "POST /household-payroll/employers/{id}/suspend and /reinstate"
      - "POST /household-payroll/quarterly-filings/{id}/submit, /accept, /reject"
      - "POST /household-payroll/year-end-packages/{id}/finalize"
    shared_operations:
      - "All GET list/read endpoints"
  - name: HouseholdClient
    description: "The household employer user: manages own workers, agreements, timesheet approval, leave approval"
    identity: "entity_backed:HouseholdEmployer"
    exclusive_operations:
      - "POST /household-payroll/employers/{id}/workers (+ classify/activate/terminate)"
      - "POST /household-payroll/workers/{id}/agreements"
      - "POST /household-payroll/timesheets/{id}/approve and /reject"
      - "POST /household-payroll/leave-requests/{id}/approve and /deny"
    shared_operations:
      - "GET endpoints scoped to own employer id and its workers"
  - name: Worker
    description: "The domestic worker user: submits own timesheets, requests/cancels own leave, reads own paychecks"
    identity: "entity_backed:DomesticWorker"
    exclusive_operations:
      - "POST /household-payroll/workers/{id}/timesheets (own id only)"
      - "POST /household-payroll/timesheets/{id}/submit (own timesheets only)"
      - "POST /household-payroll/workers/{id}/leave-requests (own id only)"
      - "POST /household-payroll/leave-requests/{id}/cancel (own requests only)"
    shared_operations:
      - "GET /household-payroll/workers/{id}, /timesheets, /agreements, /paychecks, /leave-requests scoped to own id"
