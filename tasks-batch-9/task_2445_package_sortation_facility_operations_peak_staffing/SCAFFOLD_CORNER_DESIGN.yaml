            - "Center SC-POOL (automation 70, flex_pool_total 1) with one chute and a SUBMITTED plan: 2026-08-03 06:00-14:00, forecast_volume 40000, core 0, seasonal 0, budget 1000000 -> required_headcount 6, flex_needed 6"
