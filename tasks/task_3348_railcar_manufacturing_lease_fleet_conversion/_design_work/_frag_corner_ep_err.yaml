            - "A RETAINED order of 1 car completes on 2026-09-14 into HELD car K, which is placed by assignment AS-R [2026-09-15, 2026-10-15) with mileage_allowance 0 while the lessee balance is still 0."
            - "A SOLD order of 1 car then completes with lessee_id naming that lessee, debiting the balance by unit_price_cents 71000 * quantity 1 == 71000, so the balance sits exactly at the ceiling; the return books mileage_since_last 5000, whose projected charge is max(0, 5000 - ceil(30/30)*0) * 12 == 60000."
