              as: IdentityAnalyst
              captures: { rec_ca3_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_ca1_id}", record_b_id: "${rec_ca2_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
