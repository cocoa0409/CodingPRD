              captures: { la900_id: "$.data.id" }
            - call: "POST /reels"
              payload: { product_id: "${p1_id}", branch_id: "${br_id}", lot_code: "LA", nominal_length_ft: 1000 }
              as: PlatformAdmin
              captures: { la1000_id: "$.data.id" }
