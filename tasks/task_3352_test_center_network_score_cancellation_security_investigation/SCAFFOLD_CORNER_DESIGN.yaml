scaffold_corner_design:
  - section: entities
    instances:
      - name: center_creation_applied_defaults
        claim_type: defaults
        grounds: ["entities.TestCenter.fields.authorization_status", "entities.TestCenter.fields.last_audit_outcome", "entities.TestCenter"]
        distinguishing_aspect: "A freshly created center starts APPLIED with last_audit_outcome NONE, version 1, and server-stamped id/created_at."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /ets/test-centers"
              payload: { name: "Center Zero", facility_seat_capacity: 15, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_id: $.data.id, c_status: $.data.authorization_status, c_outcome: $.data.last_audit_outcome, c_v: $.data.version }
          assert:
            - "response 201 with TestCenter.${c_id}.authorization_status == APPLIED"
            - "TestCenter.${c_id}.last_audit_outcome == NONE"
            - "TestCenter.${c_id}.version == 1 and id/created_at are server-stamped"
      - name: examinee_create_missing_required_field
        claim_type: required_fields
        grounds: ["entities.Examinee.fields.id_document_type", "validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required id_document_type is a request-shape error ERR_INVALID_REQUEST (400), not a state error."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /ets/examinees"
              payload: { full_name: "No Doc", date_of_birth: "2000-01-01", id_document_number: "PX", id_document_expiry: "2027-01-01" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_REQUEST with http 400"
      - name: check_in_record_immutable_no_version
        claim_type: immutability
        grounds: ["entities.CheckInRecord"]
        distinguishing_aspect: "CheckInRecord is an append-only event (common_fields false): its response carries id and created_at but no version/updated_at, and the scaffold declares no update endpoint for it."
        test_recipe:
          setup:
            - "AUTHORIZED center, PUBLISHED session 2026-10-10, one CONFIRMED registration, session LOCKED on test day"
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center IM", facility_seat_capacity: 20, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/audits"
              payload: { scheduled_date: "2026-09-05", audit_type: "ANNOUNCED" }
              as: ProgramAdmin
              captures: { a_id: $.data.id }
            - call: "POST /ets/audits/${a_id}/complete"
              payload: { facility_findings: 1, staffing_findings: 1, equipment_findings: 2, high_severity_findings: 0 }
              as: Auditor
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Mgr IM", staff_role: "CENTER_MANAGER", certification_level: "ADVANCED" }
              as: ProgramAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Proc IM", staff_role: "PROCTOR", certification_level: "BASIC" }
              as: ProgramAdmin
              captures: { pro_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/sessions"
              payload: { test_date: "2026-10-10", start_time: "08:00", end_time: "12:00", room_label: "R1", total_seats: 5, reserved_accommodation_seats: 0 }
              as: ProgramAdmin
              captures: { s_id: $.data.id }
            - call: "POST /ets/sessions/${s_id}/publish"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex IM", date_of_birth: "2001-07-07", id_document_type: "PASSPORT", id_document_number: "PIM1", id_document_expiry: "2027-06-01" }
              as: ProgramAdmin
              captures: { ex_a: $.data.id }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v: $.data.version }
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_a}", expected_session_version: "${s_v}" }
              as: Examinee
              as_user_id: "${ex_a}"
              captures: { r_a: $.data.id }
            - call: "POST /ets/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T07:45:00Z" }
              as: ProgramAdmin
            - call: "POST /ets/sessions/${s_id}/lock"
              as: CenterManager
              as_user_id: "${mgr_id}"
          trigger:
            - call: "POST /ets/registrations/${r_a}/check-in"
              payload: { id_document_number: "PIM1", id_document_expiry: "2027-06-01", biometric_sample: "bio-im" }
              as: Proctor
              as_user_id: "${pro_id}"
              captures: { ci_id: $.data.id }
          assert:
            - "CheckInRecord.${ci_id} response contains id and created_at but no version and no updated_at keys"
            - "GET /ets/registrations/${r_a}/check-ins returns an array of length 1 containing ${ci_id}"
      - name: registration_computed_pool_for_accommodation_examinee
        claim_type: computed_fields
        grounds: ["entities.Registration.fields.requires_accommodation_seat", "entities.Registration.fields.pool", "entities.AccommodationRequest.fields.requires_alternate_format", "calculations.seat_pool_capacity"]
        distinguishing_aspect: "An examinee holding an APPROVED SCREEN_READER request is computed into the ACCOMMODATION pool drawing on the reserved seat (not the general pool), and requires_alternate_format is true for SCREEN_READER."
        test_recipe:
          setup:
            - "AUTHORIZED center, PUBLISHED session total_seats 3 reserved 1; examinee with an APPROVED SCREEN_READER accommodation request"
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center AC", facility_seat_capacity: 20, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/audits"
              payload: { scheduled_date: "2026-09-05", audit_type: "ANNOUNCED" }
              as: ProgramAdmin
              captures: { a_id: $.data.id }
            - call: "POST /ets/audits/${a_id}/complete"
              payload: { facility_findings: 1, staffing_findings: 1, equipment_findings: 2, high_severity_findings: 0 }
              as: Auditor
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Mgr AC", staff_role: "CENTER_MANAGER", certification_level: "ADVANCED" }
              as: ProgramAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/sessions"
              payload: { test_date: "2026-10-10", start_time: "08:00", end_time: "12:00", room_label: "R1", total_seats: 3, reserved_accommodation_seats: 1 }
              as: ProgramAdmin
              captures: { s_id: $.data.id, s_cap: $.data.effective_general_cap }
            - call: "POST /ets/sessions/${s_id}/publish"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex AC", date_of_birth: "2001-07-07", id_document_type: "PASSPORT", id_document_number: "PAC1", id_document_expiry: "2027-06-01" }
              as: ProgramAdmin
              captures: { ex_a: $.data.id }
            - call: "POST /ets/examinees/${ex_a}/accommodation-requests"
              payload: { accommodation_type: "SCREEN_READER" }
              as: Examinee
              as_user_id: "${ex_a}"
              captures: { ar_id: $.data.id, ar_alt: $.data.requires_alternate_format }
            - call: "POST /ets/accommodation-requests/${ar_id}/decide"
              payload: { decision: "APPROVED" }
              as: ProgramAdmin
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v: $.data.version }
          trigger:
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_a}", expected_session_version: "${s_v}" }
              as: Examinee
              as_user_id: "${ex_a}"
              captures: { r_a: $.data.id, r_pool: $.data.pool, r_acc: $.data.requires_accommodation_seat }
          assert:
            - "AccommodationRequest.${ar_id}.requires_alternate_format == true (SCREEN_READER)"
            - "TestSession effective_general_cap == 2 (3 - 1)"
            - "Registration.${r_a}.requires_accommodation_seat == true and pool == ACCOMMODATION"
            - "Registration.${r_a}.booking_status == CONFIRMED (accommodation pool occupancy 0 < 1)"
      - name: session_get_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=5]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a session id that does not exist yields ERR_NOT_FOUND (404) from the existence check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /ets/sessions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_NOT_FOUND with http 404"

  - section: state_machines
    instances:
      - name: audit_double_complete_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.CenterAudit.SCHEDULED_to_COMPLETED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETED is terminal for CenterAudit: a second complete call is rejected with ERR_INVALID_STATE and recomputes nothing."
        test_recipe:
          setup: ["center with one SCHEDULED audit"]
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center DC", facility_seat_capacity: 15, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/audits"
              payload: { scheduled_date: "2026-09-05", audit_type: "ANNOUNCED" }
              as: ProgramAdmin
              captures: { a_id: $.data.id }
            - call: "POST /ets/audits/${a_id}/complete"
              payload: { facility_findings: 1, staffing_findings: 1, equipment_findings: 2, high_severity_findings: 0 }
              as: Auditor
          trigger:
            - call: "POST /ets/audits/${a_id}/complete"
              payload: { facility_findings: 0, staffing_findings: 0, equipment_findings: 0, high_severity_findings: 0 }
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE (http 409)"
            - "CenterAudit.${a_id}.compliance_score remains 82 from the first completion"
      - name: cancelled_session_lockdown_publish_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.TestSession.PUBLISHED_to_CANCELLED", "state_machines.TestSession.DRAFT_to_PUBLISHED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal for TestSession: publishing a cascade-cancelled session fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["AUTHORIZED center with a PUBLISHED session, then a FAILED audit cascade-cancels the session"]
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center TL", facility_seat_capacity: 20, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/audits"
              payload: { scheduled_date: "2026-09-05", audit_type: "ANNOUNCED" }
              as: ProgramAdmin
              captures: { a1: $.data.id }
            - call: "POST /ets/audits/${a1}/complete"
              payload: { facility_findings: 1, staffing_findings: 1, equipment_findings: 2, high_severity_findings: 0 }
              as: Auditor
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Mgr TL", staff_role: "CENTER_MANAGER", certification_level: "ADVANCED" }
              as: ProgramAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/sessions"
              payload: { test_date: "2026-10-10", start_time: "08:00", end_time: "12:00", room_label: "R1", total_seats: 5, reserved_accommodation_seats: 0 }
              as: ProgramAdmin
              captures: { s_id: $.data.id }
            - call: "POST /ets/sessions/${s_id}/publish"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/test-centers/${c_id}/audits"
              payload: { scheduled_date: "2026-10-20", audit_type: "UNANNOUNCED" }
              as: ProgramAdmin
              captures: { a2: $.data.id }
            - call: "POST /ets/audits/${a2}/complete"
              payload: { facility_findings: 2, staffing_findings: 1, equipment_findings: 3, high_severity_findings: 0 }
              as: Auditor
          trigger:
            - call: "POST /ets/sessions/${s_id}/publish"
              as: CenterManager
              as_user_id: "${mgr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "TestSession.${s_id}.status == CANCELLED before the trigger (cascade)"
            - "trigger response error_id == ERR_INVALID_STATE"
      - name: registration_initial_dimensions
        claim_type: initial_state
        grounds: ["state_machines.Registration", "entities.Registration.fields.attendance_status"]
        distinguishing_aspect: "A newly created registration with a free pool seat starts booking CONFIRMED, attendance PENDING, waitlist_position null."
        test_recipe:
          setup: ["AUTHORIZED center, PUBLISHED session with free seats"]
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center IN", facility_seat_capacity: 20, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/audits"
              payload: { scheduled_date: "2026-09-05", audit_type: "ANNOUNCED" }
              as: ProgramAdmin
              captures: { a_id: $.data.id }
            - call: "POST /ets/audits/${a_id}/complete"
              payload: { facility_findings: 1, staffing_findings: 1, equipment_findings: 2, high_severity_findings: 0 }
              as: Auditor
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Mgr IN", staff_role: "CENTER_MANAGER", certification_level: "ADVANCED" }
              as: ProgramAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/sessions"
              payload: { test_date: "2026-10-10", start_time: "08:00", end_time: "12:00", room_label: "R1", total_seats: 5, reserved_accommodation_seats: 0 }
              as: ProgramAdmin
              captures: { s_id: $.data.id }
            - call: "POST /ets/sessions/${s_id}/publish"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex IN", date_of_birth: "2001-07-07", id_document_type: "PASSPORT", id_document_number: "PIN1", id_document_expiry: "2027-06-01" }
              as: ProgramAdmin
              captures: { ex_a: $.data.id }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v: $.data.version }
          trigger:
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_a}", expected_session_version: "${s_v}" }
              as: Examinee
              as_user_id: "${ex_a}"
              captures: { r_a: $.data.id, r_booking: $.data.booking_status, r_att: $.data.attendance_status }
          assert:
            - "Registration.${r_a}.booking_status == CONFIRMED"
            - "Registration.${r_a}.attendance_status == PENDING"
            - "Registration.${r_a}.waitlist_position == null and pool == GENERAL"
      - name: administer_no_show_sweep
        claim_type: side_effect_execution
        grounds: ["state_machines.TestSession.LOCKED_to_ADMINISTERED", "state_machines.Registration"]
        distinguishing_aspect: "Administering the session sweeps exactly the CONFIRMED-and-never-admitted registrations to NO_SHOW; an ADMITTED registration is untouched."
        test_recipe:
          setup: ["AUTHORIZED center, LOCKED session with two CONFIRMED registrations; E1 checked in ADMITTED, E2 never checked in"]
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center NS", facility_seat_capacity: 20, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/audits"
              payload: { scheduled_date: "2026-09-05", audit_type: "ANNOUNCED" }
              as: ProgramAdmin
              captures: { a_id: $.data.id }
            - call: "POST /ets/audits/${a_id}/complete"
              payload: { facility_findings: 1, staffing_findings: 1, equipment_findings: 2, high_severity_findings: 0 }
              as: Auditor
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Mgr NS", staff_role: "CENTER_MANAGER", certification_level: "ADVANCED" }
              as: ProgramAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Proc NS", staff_role: "PROCTOR", certification_level: "BASIC" }
              as: ProgramAdmin
              captures: { pro_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/sessions"
              payload: { test_date: "2026-10-10", start_time: "08:00", end_time: "12:00", room_label: "R1", total_seats: 5, reserved_accommodation_seats: 0 }
              as: ProgramAdmin
              captures: { s_id: $.data.id }
            - call: "POST /ets/sessions/${s_id}/publish"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex N1", date_of_birth: "2000-01-15", id_document_type: "PASSPORT", id_document_number: "PN01", id_document_expiry: "2027-06-01" }
              as: ProgramAdmin
              captures: { ex_1: $.data.id }
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex N2", date_of_birth: "2000-02-15", id_document_type: "PASSPORT", id_document_number: "PN02", id_document_expiry: "2027-06-01" }
              as: ProgramAdmin
              captures: { ex_2: $.data.id }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v1: $.data.version }
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_1}", expected_session_version: "${s_v1}" }
              as: Examinee
              as_user_id: "${ex_1}"
              captures: { r_1: $.data.id }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v2: $.data.version }
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_2}", expected_session_version: "${s_v2}" }
              as: Examinee
              as_user_id: "${ex_2}"
              captures: { r_2: $.data.id }
            - call: "POST /ets/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T07:45:00Z" }
              as: ProgramAdmin
            - call: "POST /ets/sessions/${s_id}/lock"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/registrations/${r_1}/check-in"
              payload: { id_document_number: "PN01", id_document_expiry: "2027-06-01", biometric_sample: "bio-n1" }
              as: Proctor
              as_user_id: "${pro_id}"
            - call: "POST /ets/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T12:30:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /ets/sessions/${s_id}/administer"
              as: CenterManager
              as_user_id: "${mgr_id}"
          assert:
            - "TestSession.${s_id}.status == ADMINISTERED"
            - "Registration.${r_1}.attendance_status == ADMITTED (sweep skips admitted)"
            - "Registration.${r_2}.attendance_status == NO_SHOW (CONFIRMED + PENDING at administer)"
      - name: notify_sets_response_deadline_exactly
        claim_type: side_effect_execution
        grounds: ["state_machines.ScoreReviewCase.OPENED_to_NOTIFIED", "entities.ScoreReviewCase.fields.response_deadline"]
        distinguishing_aspect: "Notify stamps response_deadline at exactly the current clock plus 30 days: notified at 2026-10-10T12:30:00Z pins 2026-11-09T12:30:00Z."
        test_recipe:
          setup: ["administered session with one gain-flagged score (raws [33,21,40], prior 50 -> equated 97, gain 47) so a case is OPENED by the analysis run"]
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center ND", facility_seat_capacity: 20, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/audits"
              payload: { scheduled_date: "2026-09-05", audit_type: "ANNOUNCED" }
              as: ProgramAdmin
              captures: { a_id: $.data.id }
            - call: "POST /ets/audits/${a_id}/complete"
              payload: { facility_findings: 1, staffing_findings: 1, equipment_findings: 2, high_severity_findings: 0 }
              as: Auditor
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Mgr ND", staff_role: "CENTER_MANAGER", certification_level: "ADVANCED" }
              as: ProgramAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Proc ND", staff_role: "PROCTOR", certification_level: "BASIC" }
              as: ProgramAdmin
              captures: { pro_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/sessions"
              payload: { test_date: "2026-10-10", start_time: "08:00", end_time: "12:00", room_label: "R1", total_seats: 5, reserved_accommodation_seats: 0 }
              as: ProgramAdmin
              captures: { s_id: $.data.id }
            - call: "POST /ets/sessions/${s_id}/publish"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex ND", date_of_birth: "2001-07-07", id_document_type: "PASSPORT", id_document_number: "PND1", id_document_expiry: "2027-06-01" }
              as: ProgramAdmin
              captures: { ex_a: $.data.id }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v: $.data.version }
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_a}", expected_session_version: "${s_v}" }
              as: Examinee
              as_user_id: "${ex_a}"
              captures: { r_a: $.data.id }
            - call: "POST /ets/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T07:45:00Z" }
              as: ProgramAdmin
            - call: "POST /ets/sessions/${s_id}/lock"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/registrations/${r_a}/check-in"
              payload: { id_document_number: "PND1", id_document_expiry: "2027-06-01", biometric_sample: "bio-nd" }
              as: Proctor
              as_user_id: "${pro_id}"
