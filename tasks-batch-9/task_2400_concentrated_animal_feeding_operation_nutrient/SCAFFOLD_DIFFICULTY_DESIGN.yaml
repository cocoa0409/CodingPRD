              as_user_id: "reviewer-1"
          assert:
            - "after the first trigger call NutrientManagementPlan.${pl_id}.plan_status == REVISION_REQUIRED and revision_count == 1"
            - "after the second trigger call NutrientManagementPlan.${pl_id}.plan_status == DRAFT, certifying_planner_user_id == null and certified_at == null"
            - "after the third trigger call NutrientManagementPlan.${pl_id}.plan_status == CERTIFIED and certifying_planner_user_id == planner-2"
            - "after the fifth trigger call NutrientManagementPlan.${pl_id}.plan_status == APPROVED and revision_count is STILL 1"
            - "NutrientManagementPlan.${pl_id}.allowed_application_methods == [INJECTION]"
            - "FieldNutrientBudget.${bd_id}.budget_status == ACTIVE and allowable_total_gallons == 414396"
            - "Operation.${op_id}.compliance_posture == OPEN throughout the cycle"

  # =====================================================================
  # Rule 4 — transitive_cascade
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: freeboard_alert_cascades_to_plan_revision_and_budget_lock
        grounds:
          - state_machines.ManureStorage.IN_SERVICE_to_FREEBOARD_ALERT
          - state_machines.NutrientManagementPlan.APPROVED_to_REVISION_REQUIRED
          - calculations.storage_capacity_and_freeboard
          - calculations.operation_compliance_posture
          - entities.FieldNutrientBudget.fields.budget_status
        distinguishing_aspect: |
          A single POST /cafo/storage-inspections propagates four hops — StorageInspection deficit ->
          ManureStorage FREEBOARD_ALERT -> Operation.compliance_posture RESTRICTED -> plan
          REVISION_REQUIRED -> every budget LOCKED — and the trigger is a measurement write, not a
          state-transition endpoint.
