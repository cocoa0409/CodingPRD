  # ---------------------------------------------------------------------------
  # Rule 8 — resource temporal-overlap conflicts with different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: campaign_windows_half_open_adjacency_allowed
        grounds:
          - validations[priority=12]
          - errors[ERR_CAMPAIGN_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource = Property, HALF-OPEN semantics [open_at, close_at): a sibling campaign opening
          exactly at another's close_at (2026-06-30 == 2026-06-30) is NOT an overlap and is
          accepted, while a window starting one day earlier is rejected.
        test_recipe:
          setup:
            - "Property with existing campaign C1 window [2026-06-01, 2026-06-30) in DRAFT"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
              as: HousingDeveloper
              captures: { p: $.data.id }
            - call: "POST /campaigns"
              payload: { property_id: "${p}", name: "June 2026", application_open_at: "2026-06-01T00:00:00Z", application_close_at: "2026-06-30T00:00:00Z", marketing_channels: ["LOCAL_NEWSPAPER", "HOUSING_AUTHORITY_WEBSITE"], marketing_plan_summary: "plan one", target_ami_tier: "AMI_50" }
              as: HousingDeveloper
              captures: { c1: $.data.id }
          trigger:
