  - rule_id: cross_entity_state_dependency
    instances:
      - name: notice_validation_depends_on_designated_agent_registration_state
        grounds:
          - validations.priority_7_ERR_DESIGNATED_AGENT_NOT_REGISTERED
          - state_machines.DesignatedAgent.SUBMITTED_to_REGISTERED
          - state_machines.TakedownNotice.RECEIVED_to_VALIDATED
          - entities.ServiceProviderProfile.fields.designated_agent_registered
        distinguishing_aspect: |
          The TakedownNotice transition is gated by the state of a completely
          different entity: while the DesignatedAgent sits in SUBMITTED the same
          validate call returns 409 ERR_DESIGNATED_AGENT_NOT_REGISTERED, and after
          the agent reaches REGISTERED the identical call succeeds with score 100 —
          nothing about the notice itself changed between the two calls.
        test_recipe:
          setup:
            - "Provider with public contact published (so registration is permitted) and one DesignatedAgent left in SUBMITTED."
            - "One STANDARD RightsHolder and one notice in RECEIVED carrying every statutory element."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/providers"
              payload: { legal_name: "Northstar Hosting LLC", service_domain: "northstar.example" }
              as: ComplianceOfficer
              captures: { prov_id: "$.data.id" }
            - call: "POST /dmca/providers/${prov_id}/publish-contact"
              payload: { public_contact_url: "https://northstar.example/legal/dmca-agent" }
              as: ComplianceOfficer
              captures: { prov_v1: "$.data.version" }
            - call: "POST /dmca/designated-agents"
              payload: { provider_id: "${prov_id}", agent_name: "Dana Reyes", agent_email: "dmca@northstar.example", agent_phone: "+1-555-0100", mailing_address: "1 Harbor Way, Springfield, IL 62701" }
              as: ComplianceOfficer
              captures: { agent_id: "$.data.id" }
            - call: "POST /dmca/designated-agents/${agent_id}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /dmca/rights-holders"
              payload: { legal_name: "Orbit Records LLC", contact_email: "legal@orbit.example" }
              as: ComplianceOfficer
              captures: { rh_id: "$.data.id" }
            - call: "POST /dmca/notices"
              payload: { rights_holder_id: "${rh_id}", submission_channel: "WEB_FORM", claimed_urls: ["https://northstar.example/v/1"], signature_present: true, work_identification: "Sound recording: Orbit Vol. 1, track 3", material_identification: "Track 3 posted at /v/1", contact_email: "legal@orbit.example", good_faith_statement: true, accuracy_statement: true, authority_statement: true, sworn_under_penalty: true }
              as: TakedownAgent
              captures: { n1_id: "$.data.id" }
          trigger:
            - call: "POST /dmca/notices/${n1_id}/validate"
              payload: {}
              as: TakedownAgent
            - call: "POST /dmca/designated-agents/${agent_id}/register"
              payload: { expected_provider_version: "${prov_v1}", copyright_office_receipt: "CO-2026-0001" }
              as: ComplianceOfficer
            - call: "POST /dmca/notices/${n1_id}/validate"
              payload: {}
              as: TakedownAgent
          assert:
            - "the first validate returns 409 with error_id == ERR_DESIGNATED_AGENT_NOT_REGISTERED"
            - "after the first validate TakedownNotice.${n1_id}.status == RECEIVED, completeness_score == 0 and validated_at == null"
            - "DesignatedAgent.${agent_id}.registration_status == REGISTERED after the register call"
            - "ServiceProviderProfile.${prov_id}.designated_agent_registered == true"
            - "the second validate returns 200"
            - "TakedownNotice.${n1_id}.completeness_score == 100"
            - "TakedownNotice.${n1_id}.compliance_variant == SUBSTANTIAL_COMPLIANCE"
            - "TakedownNotice.${n1_id}.status == VALIDATED"
            - "RightsHolder.${rh_id}.rejected_count == 0 and RightsHolder.${rh_id}.abuse_score == 0.00"

      - name: reference_file_activation_depends_on_rights_holder_enrollment_state
        grounds:
          - validations.priority_14_ERR_RIGHTS_HOLDER_NOT_ENROLLED
          - state_machines.ReferenceFile.PENDING_to_ACTIVE
          - state_machines.RightsHolder.PROSPECT_to_ENROLLED
          - entities.ReferenceFile.fields.activated_at
        distinguishing_aspect: |
          Activation of a ReferenceFile is decided by its parent RightsHolder's
          enrollment_status, not by the file: PROSPECT yields 409
          ERR_RIGHTS_HOLDER_NOT_ENROLLED with activated_at still null, and after
          enroll the very same activate call sets status ACTIVE and activated_at to
          the logical clock.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One RightsHolder in PROSPECT (never enrolled)."
            - "One ReferenceFile of that holder in PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /dmca/rights-holders"
              payload: { legal_name: "Orbit Records LLC", contact_email: "legal@orbit.example" }
              as: ComplianceOfficer
              captures: { rh_id: "$.data.id" }
            - call: "POST /dmca/reference-files"
              payload: { rights_holder_id: "${rh_id}", work_title: "Orbit Vol. 1, track 3", fingerprint_hash: "0123456789abcdef0123456789abcdef", registration_number: "SR0000991122" }
              as: ComplianceOfficer
              captures: { ref_id: "$.data.id" }
          trigger:
            - call: "POST /dmca/reference-files/${ref_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /dmca/rights-holders/${rh_id}/enroll"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /dmca/reference-files/${ref_id}/activate"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "the first activate returns 409 with error_id == ERR_RIGHTS_HOLDER_NOT_ENROLLED"
            - "after the first activate ReferenceFile.${ref_id}.status == PENDING and ReferenceFile.${ref_id}.activated_at == null"
            - "RightsHolder.${rh_id}.enrollment_status == ENROLLED after enroll"
            - "the second activate returns 200"
            - "ReferenceFile.${ref_id}.status == ACTIVE"
            - "ReferenceFile.${ref_id}.activated_at == \"2026-08-01T00:00:00.000Z\""
            - "GET /dmca/rights-holders/${rh_id}/reference-files?status=ACTIVE returns total_count == 1"

  - rule_id: resource_temporal_overlap
    instances:
      - name: duplicate_claim_rejected_inside_half_open_dispute_interval_and_allowed_at_its_upper_bound
        grounds:
          - calculations.claim_dispute_interval_overlap
          - validations.priority_16_ERR_DUPLICATE_CLAIM_WINDOW
          - entities.NoticeClaim.fields.dispute_window_days
          - state_machines.NoticeClaim.RESTORATION_SCHEDULED_to_RESTORED
        distinguishing_aspect: |
          The same (content_item, rights_holder) pair is re-noticed twice: at
          2026-08-30 the clock is inside [2026-08-01, 2026-08-31) and the process
          call is refused with 409 ERR_DUPLICATE_CLAIM_WINDOW, while at exactly
          2026-08-31 the excluded upper bound makes the identical call succeed —
          and the interval keeps being occupied by an already RESTORED claim.
        test_recipe:
          setup:
            - "Provider fully documented with a PUBLISHED policy (dispute_window_days 30, counter_notice_window_days 30); clock at 2026-08-01T00:00:00Z."
            - "Account with one ContentItem; the first notice is PROCESSED at 2026-08-01, so claim 1 has disabled_at 2026-08-01T00:00:00Z."
            - "A counter-notice on claim 1 is validated and forwarded on 2026-08-01, giving restoration_earliest_at 2026-08-14T00:00:00Z."
            - "At 2026-08-14 the claim is RESTORED (its strike is voided) yet it keeps occupying the dispute interval as a cooldown."
            - "A second notice from the same rights holder for the same URL is VALIDATED at 2026-08-30."
