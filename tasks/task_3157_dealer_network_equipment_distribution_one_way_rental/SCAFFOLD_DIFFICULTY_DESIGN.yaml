  # =====================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: unit_interval_occupation_blocks_second_confirm
        grounds:
          - validations[priority=15]
          - state_machines.EquipmentUnit.AVAILABLE_to_HELD
        distinguishing_aspect: |
          Interval semantics: exclusive single-occupancy (no capacity) — a
          unit HELD for reservation R1's window is invisible to R2's confirm
          even though the two pickup/dropoff windows merely touch; the
          half-open semantics are degenerate because HOLD covers the whole
          interval. Second confirm on the same single-unit dealer fails
          ERR_NO_UNIT_AVAILABLE; confirming R2 after R1 cancels succeeds.
        test_recipe:
          setup:
            - "Locations A/B OPEN; dealer DA at A with exactly ONE AVAILABLE TRUCK_10FT unit U1"
