        claim_type: immediate
        grounds: ["state_machines.SalesOrder.DELIVERED_to_SETTLED"]
        distinguishing_aspect: "immediate consistency: the settle response body itself carries status SETTLED, final_unit_price_cents, final_total_cents, and customer_refund_cents — no re-read needed to observe the mutation."
        test_recipe:
          setup: ["BROKER_OWNED order qty 1 delivered same-day (age 0, FRESH, no snapshots): asking 5000 STANDARD -> final equals provisional 5000, refund 0"]
          setup_api_calls:
            - call: "POST /sellers"
