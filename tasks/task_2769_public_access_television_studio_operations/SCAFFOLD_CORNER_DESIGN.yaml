              payload: {document_reference: "UTIL-2026-0001"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /training-courses"
              payload: {course_code: "TV-101", title: "Studio Basics", tier: "BASIC", grants_competency_codes: ["STUDIO_FLOOR", "EDIT_SUITE"], seat_capacity: 12, session_start_at: "2026-08-05T17:00:00Z", session_end_at: "2026-08-05T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c_basic_id: $.data.id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p_id}", course_id: "${c_basic_id}"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {eb_id: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-06T00:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /course-enrollments/${eb_id}/attendance"
              payload: {attended: true}
              as: TrainingCoordinator
              as_user_id: "trn-1"
            - call: "POST /course-enrollments/${eb_id}/grade"
              payload: {practical_score: 88}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {basic_level: $.data.status}
            - call: "POST /training-courses"
              payload: {course_code: "TV-201", title: "Master Control", tier: "ADVANCED", grants_competency_codes: ["MASTER_CONTROL"], seat_capacity: 8, session_start_at: "2026-08-12T17:00:00Z", session_end_at: "2026-08-12T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c_adv_id: $.data.id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p_id}", course_id: "${c_adv_id}"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {ea_id: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-13T00:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "POST /course-enrollments/${ea_id}/attendance"
              payload: {attended: true}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {adv_attended: $.data.status}
            - call: "GET /producers/${p_id}"
              payload: {}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {mid_level: $.data.certification_level, mid_codes: $.data.competency_codes}
            - call: "POST /course-enrollments/${ea_id}/grade"
              payload: {practical_score: 79}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {adv_final: $.data.status}
            - call: "GET /producers/${p_id}"
              payload: {}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {end_level: $.data.certification_level, end_codes: $.data.competency_codes}
          assert:
            - "${basic_level} == PASSED and ${adv_attended} == ATTENDED"
            - "${mid_level} == BASIC and ${mid_codes} == [STUDIO_FLOOR, EDIT_SUITE] — an ATTENDED enrollment contributes nothing"
            - "${adv_final} == FAILED at 79 and ${end_level} is still BASIC"
            - "${end_codes} == [STUDIO_FLOOR, EDIT_SUITE] — MASTER_CONTROL is absent because the ADVANCED enrollment never reached PASSED"
            - "TrainingCourse.${c_adv_id}.enrolled_count == 1 and passed_count == 0"

      - name: corner_deposit_hold_clamped_to_resource_replacement_value
        claim_type: correct_result
        grounds:
          - calculations.reservation_deposit_hold
          - entities.StudioResource.fields.replacement_value_cents
          - entities.Producer.fields.deposit_held_cents
        distinguishing_aspect: "The final step of the hold is min(raw_hold, replacement_value_cents): the raw 12962 for a two-hour booking is clamped to the resource's 12500 replacement value, and the producer's ledger records the clamped figure, not the raw one."
        test_recipe:
