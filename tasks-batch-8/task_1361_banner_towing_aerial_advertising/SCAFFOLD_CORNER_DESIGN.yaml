      - name: hobbs_in_le_hobbs_out_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=14, errors[ERR_INVALID_HOBBS]]
        distinguishing_aspect: "hobbs_in <= hobbs_out → 422 ERR_INVALID_HOBBS."
