# =============================================================================
# SCAFFOLD.yaml — LIHEAP Energy Assistance (Expert)
# §1.0–§1.7. Neither scaffold_difficulty_design nor scaffold_corner_design lives here.
# =============================================================================

scenario: "LIHEAP Energy Assistance: household application & income eligibility, benefit-tier (heating/cooling/crisis) calculation, vendor/utility enrollment & pledge, crisis 48-hour benefit, direct-vendor payment & bill credit, reconnection/arrearage, weatherization referral, seasonal funding depletion"

domain_name: liheap-energy-assistance
api_prefix: /liheap

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers: [rate_threshold_triggers, cascading_side_effects, dual_variant_calculation, optimistic_concurrency]

  entity_topology: flat
  # Peer entities linked by explicit foreign keys (household_id, vendor_id,
  # funding_pool_id, utility_account_id, pledge_id, payment_id). No nesting in
  # URL paths — every collection sits directly under /liheap/<collection>.

  state_machine_shape: branching
  # Application branches SUBMITTED->{APPROVED,DENIED} with an INFO_REQUESTED
  # revision cycle; CrisisBenefit branches OPEN->{RESOLVED,BREACHED} with a
  # deadline-driven auto-transition.

  relationship_patterns:
    - one_to_many        # Household -> Applications, FundingPool -> Pledges
    - flat_with_references  # Pledge references Application, Vendor, Pool, UtilityAccount by FK
    - cross_aggregate    # Payment.remit reaches across Pledge -> Pool and BillCredit -> UtilityAccount

  role_model: peer_roles
  # Applicant (household), Caseworker (eligibility/pledges), VendorAgent
  # (enrollment/remittance), ProgramAdmin (pools/season). Non-overlapping
  # resource ownership with an operational ProgramAdmin.

  consistency_model: immediate
  # All cascades (pledge->pool, payment->bill-credit->account) settle inside the
  # triggering request; every derived balance is readable in the same response.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FundingPool
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: season_year, type: integer, source: input, description: "Program season year (e.g. 2026)" }
      - { name: program_component, type: enum, source: input, description: "HEATING | COOLING | CRISIS — the benefit component this pool funds" }
      - { name: total_allocation_cents, type: integer, source: input, description: "Total funds allocated to this pool for the season", constraints: "> 0" }
      - { name: reserved_cents, type: integer, source: computed, default: 0, description: "Sum of pledged_amount_cents over PLEDGED pledges drawing on this pool" }
      - { name: disbursed_cents, type: integer, source: computed, default: 0, description: "Sum of pledged_amount_cents over PAID pledges drawing on this pool" }
      - { name: available_cents, type: integer, source: computed, description: "total_allocation_cents - reserved_cents - disbursed_cents" }
      - { name: depletion_threshold_cents, type: integer, source: input, description: "available_cents at or below this (but > 0) sets status LOW", constraints: ">= 0" }
      - { name: status, type: enum, source: computed, description: "OPEN | LOW | DEPLETED | CLOSED — derived from available_cents and close action" }

  - name: Household
    parent: null
    common_fields: true
    fields:
      - { name: primary_applicant_name, type: string, source: input, description: "Name of the primary applicant" }
      - { name: household_size, type: integer, source: input, description: "Number of persons in the household", constraints: ">= 1" }
      - { name: annual_income_cents, type: integer, source: input, description: "Self-reported gross annual household income, in cents", constraints: ">= 0" }
      - { name: state_code, type: string, source: input, description: "Two-letter USPS state code" }
      - { name: county, type: string, source: input, description: "County of residence" }
      - { name: has_elderly_or_disabled, type: boolean, source: input, default: false, description: "True if any member is elderly or disabled (vulnerability flag)" }
      - { name: has_child_under_6, type: boolean, source: input, default: false, description: "True if any member is a child under age 6 (vulnerability flag)" }
      - { name: heating_source, type: enum, source: input, description: "ELECTRICITY | NATURAL_GAS | FUEL_OIL | PROPANE" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; the applying household" }
      - { name: season_year, type: integer, source: input, description: "Program season year the application targets" }
      - { name: program_component, type: enum, source: input, description: "HEATING | COOLING — the assistance component requested" }
      - { name: fpl_pct, type: number, source: computed, description: "annual_income / FPL(household_size) * 100; uses self-reported income at submit, verified income at approve", constraints: "2 decimals, round_half_up" }
      - { name: income_eligible, type: boolean, source: computed, description: "fpl_pct <= 150.00" }
      - { name: benefit_tier, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3 | INELIGIBLE — derived from fpl_pct band" }
      - { name: benefit_amount_cents, type: integer, source: computed, default: 0, description: "Awarded benefit; PROVISIONAL value at SUBMITTED, FINAL value at APPROVED" }
      - { name: benefit_variant, type: enum, source: computed, description: "PROVISIONAL | FINAL — which variant produced benefit_amount_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | INFO_REQUESTED | APPROVED | DENIED" }
      - { name: submitted_at, type: datetime, source: computed, required: false, description: "Logical-clock time at first submit" }
      - { name: denial_reason, type: string, source: input, required: false, description: "Caseworker note supplied on deny" }

  - name: IncomeDocument
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the application this document supports" }
      - { name: doc_type, type: enum, source: input, description: "PAYSTUB | TAX_RETURN | BENEFIT_LETTER | SELF_ATTESTATION" }
      - { name: reported_income_cents, type: integer, source: input, description: "Income figure claimed on the document, in cents", constraints: ">= 0" }
      - { name: verified_income_cents, type: integer, source: computed, required: false, description: "Income figure the caseworker confirms at verification, in cents" }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Utility / fuel vendor name" }
      - { name: vendor_type, type: enum, source: input, description: "ELECTRIC | GAS | OIL | PROPANE | WATER" }
      - { name: remittance_account, type: string, source: input, description: "Vendor remittance account identifier" }
      - { name: status, type: enum, source: system, description: "PENDING | ENROLLED" }

  - name: UtilityAccount
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; account holder" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; servicing vendor" }
      - { name: account_number, type: string, source: input, description: "Vendor-side account number" }
      - { name: service_type, type: enum, source: input, description: "HEATING | COOLING | ELECTRIC | GAS" }
      - { name: current_balance_cents, type: integer, source: input, default: 0, description: "Current-period balance owed, in cents", constraints: ">= 0" }
      - { name: arrearage_cents, type: integer, source: input, default: 0, description: "Past-due (arrears) amount, in cents", constraints: ">= 0" }
      - { name: lifetime_credited_cents, type: integer, source: computed, default: 0, description: "Cumulative LIHEAP credits applied to this account" }
      - { name: is_disconnected, type: boolean, source: input, default: false, description: "True if service is currently disconnected" }
      - { name: reconnection_eligible, type: boolean, source: computed, default: false, description: "Set true once arrearage reaches 0 while disconnected" }
      - { name: original_obligation_cents, type: integer, source: computed, description: "current_balance_cents + arrearage_cents captured at creation; ledger anchor for the conservation invariant" }

  - name: Pledge
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, required: false, description: "FK -> Application.id; null for crisis pledges created via crisis resolution" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; vendor to be paid" }
      - { name: funding_pool_id, type: string, source: input, description: "FK -> FundingPool.id; pool the funds draw from" }
      - { name: utility_account_id, type: string, source: input, description: "FK -> UtilityAccount.id; account to be credited" }
      - { name: pledge_type, type: enum, source: input, description: "HEATING | COOLING | CRISIS | RECONNECTION | ARREARAGE" }
      - { name: pledged_amount_cents, type: integer, source: input, description: "Amount pledged, in cents", constraints: "> 0" }
      - { name: benefit_period_start, type: datetime, source: input, description: "Coverage window start (inclusive)" }
      - { name: benefit_period_end, type: datetime, source: input, description: "Coverage window end (inclusive)" }
      - { name: expected_pool_version, type: integer, source: input, description: "OCC guard: client's last-observed FundingPool.version" }
      - { name: status, type: enum, source: system, description: "PLEDGED | PAID | CANCELLED | EXPIRED" }

  - name: CrisisBenefit
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; household in energy crisis" }
      - { name: utility_account_id, type: string, source: input, description: "FK -> UtilityAccount.id; the account in crisis" }
      - { name: funding_pool_id, type: string, source: input, description: "FK -> FundingPool.id; must be a CRISIS-component pool" }
      - { name: crisis_type, type: enum, source: input, description: "NO_HEAT | DISCONNECTION_NOTICE | OUT_OF_FUEL" }
      - { name: reported_at, type: datetime, source: computed, description: "Logical-clock time at creation" }
      - { name: resolve_by, type: datetime, source: computed, description: "reported_at + 48 hours; the crisis deadline" }
      - { name: estimated_benefit_cents, type: integer, source: computed, description: "Flat crisis rate for crisis_type, fixed at report time" }
      - { name: resolved_benefit_cents, type: integer, source: computed, required: false, description: "min(estimate, crisis-pool available, account balance) computed at resolve" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED | BREACHED" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: pledge_id, type: string, source: input, description: "FK -> Pledge.id; the pledge being paid" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount, in cents", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "INITIATED | REMITTED | RETURNED" }
      - { name: remitted_at, type: datetime, source: computed, required: false, description: "Logical-clock time the payment was remitted to the vendor" }

  - name: BillCredit
    parent: null
    common_fields: true
    fields:
      - { name: payment_id, type: string, source: system, description: "FK -> Payment.id; the remittance that produced this credit" }
      - { name: utility_account_id, type: string, source: system, description: "FK -> UtilityAccount.id; account credited" }
      - { name: credit_amount_cents, type: integer, source: computed, description: "Total credit amount applied (equals the remitted payment amount)" }
      - { name: applied_to_arrearage_cents, type: integer, source: computed, description: "Portion applied to arrearage (arrearage-first waterfall)" }
      - { name: applied_to_current_cents, type: integer, source: computed, description: "Portion applied to current balance after arrearage is cleared" }
      - { name: status, type: enum, source: system, description: "APPLIED | REVERSED" }

  - name: WeatherizationReferral
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; referred household" }
      - { name: application_id, type: string, source: input, required: false, description: "FK -> Application.id; source application when auto-referred" }
      - { name: referral_reason, type: enum, source: input, description: "HIGH_ENERGY_BURDEN | TIER_1_AUTO | VENDOR_REPORTED" }
      - { name: priority, type: enum, source: computed, description: "HIGH | MEDIUM | LOW — derived from reason and household vulnerability" }
      - { name: status, type: enum, source: system, description: "REFERRED | SCHEDULED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- FundingPool: status derivation + explicit close ----------------------
  - entity: FundingPool
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    derivation: |
      Recomputed after every reserve/disburse/release on the pool:
        available_cents = total_allocation_cents - reserved_cents - disbursed_cents
        1) CLOSED is sticky once set by the close action (terminal).
        2) DEPLETED when available_cents == 0.
        3) LOW when 0 < available_cents <= depletion_threshold_cents.
        4) OPEN otherwise.
      A release (pledge CANCELLED/EXPIRED or payment RETURNED) can move a
      non-CLOSED pool DEPLETED->LOW->OPEN as available_cents rises.
    transitions:
      - from: OPEN
        to: LOW
        trigger: "system (pool balance recompute after a reserve/disburse)"
        actor: system
        preconditions: ["0 < available_cents <= depletion_threshold_cents"]
        side_effects: ["status becomes LOW"]
      - from: LOW
        to: DEPLETED
        trigger: "system (pool balance recompute after a reserve/disburse)"
        actor: system
        preconditions: ["available_cents == 0"]
        side_effects: ["status becomes DEPLETED"]
      - from: OPEN
        to: DEPLETED
        trigger: "system (pool balance recompute after a reserve that lands exactly on 0)"
        actor: system
        preconditions: ["available_cents == 0"]
        side_effects: ["status becomes DEPLETED"]
      - from: DEPLETED
        to: LOW
        trigger: "system (pool balance recompute after a release)"
        actor: system
        preconditions: ["0 < available_cents <= depletion_threshold_cents"]
        side_effects: ["status becomes LOW"]
      - from: LOW
        to: OPEN
        trigger: "system (pool balance recompute after a release)"
        actor: system
        preconditions: ["available_cents > depletion_threshold_cents"]
        side_effects: ["status becomes OPEN"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /liheap/funding-pools/{id}/close"
        actor: ProgramAdmin
        preconditions: ["pool is not already CLOSED"]
        side_effects:
          - "status becomes CLOSED (terminal)"
          - "every PLEDGED pledge drawing on this pool transitions PLEDGED->EXPIRED"
          - "each expired pledge releases its pledged_amount_cents: reserved_cents -= amount (bubble to pool balance)"
          - "increments FundingPool.version by 1"
      - from: LOW
        to: CLOSED
        trigger: "POST /liheap/funding-pools/{id}/close"
        actor: ProgramAdmin
        preconditions: ["pool is not already CLOSED"]
        side_effects:
          - "status becomes CLOSED (terminal)"
          - "every PLEDGED pledge drawing on this pool transitions PLEDGED->EXPIRED and releases reserved_cents"
          - "increments FundingPool.version by 1"
      - from: DEPLETED
        to: CLOSED
        trigger: "POST /liheap/funding-pools/{id}/close"
        actor: ProgramAdmin
        preconditions: ["pool is not already CLOSED"]
        side_effects:
          - "status becomes CLOSED (terminal)"
          - "every PLEDGED pledge drawing on this pool transitions PLEDGED->EXPIRED and releases reserved_cents"
          - "increments FundingPool.version by 1"

  # ---- Application: branching + INFO_REQUESTED revision cycle ----------------
  - entity: Application
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /liheap/applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "matching FundingPool for (season_year, program_component) exists and status != CLOSED (else ERR_SEASON_CLOSED)"
          - "no other SUBMITTED/INFO_REQUESTED/APPROVED Application exists for same (household_id, season_year, program_component) (else ERR_DUPLICATE_APPLICATION)"
          - "provisional fpl_pct (self-reported income) <= 150.00 (else ERR_INCOME_INELIGIBLE)"
        side_effects:
          - "fpl_pct computed from Household.annual_income_cents via calculations.income_eligibility"
          - "benefit_tier + benefit_amount_cents computed via calculations.benefit_tier_award (PROVISIONAL variant, self-reported income)"
          - "benefit_variant = PROVISIONAL; income_eligible = true"
          - "submitted_at = current logical-clock time"
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /liheap/applications/{id}/request-info"
        actor: Caseworker
        preconditions: ["application.status == SUBMITTED"]
        side_effects: ["status becomes INFO_REQUESTED; awaiting applicant resubmission"]
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /liheap/applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "matching FundingPool for (season_year, program_component) status != CLOSED (else ERR_SEASON_CLOSED)"
          - "provisional fpl_pct (self-reported income) <= 150.00 (else ERR_INCOME_INELIGIBLE)"
        side_effects:
          - "fpl_pct, benefit_tier, benefit_amount_cents recomputed (PROVISIONAL variant)"
          - "submitted_at refreshed to current logical-clock time"
        note: "revision cycle — INFO_REQUESTED returns to SUBMITTED (non-linear)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /liheap/applications/{id}/approve"
        actor: Caseworker
        preconditions:
          - "application.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "at least one IncomeDocument for this application in VERIFIED status (else ERR_INCOME_NOT_VERIFIED)"
          - "final fpl_pct (verified income) <= 150.00 (else ERR_INCOME_INELIGIBLE)"
        side_effects:
          - "fpl_pct + benefit_tier + benefit_amount_cents recomputed via calculations.benefit_tier_award (FINAL variant, verified income of latest VERIFIED IncomeDocument by created_at)"
          - "benefit_variant = FINAL"
          - "if final benefit_tier == TIER_1: create WeatherizationReferral (household_id, application_id, referral_reason=TIER_1_AUTO, status=REFERRED)"
        note: "branch A of SUBMITTED fork — divergent side-effects vs DENIED"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /liheap/applications/{id}/deny"
        actor: Caseworker
        preconditions: ["application.status == SUBMITTED (else ERR_INVALID_STATE)"]
        side_effects: ["status becomes DENIED; denial_reason stored; benefit_amount_cents left at last provisional value; no pledge/referral created"]
        note: "branch B of SUBMITTED fork — no benefit finalization"

  # ---- IncomeDocument: linear verify/reject ---------------------------------
  - entity: IncomeDocument
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /liheap/income-documents/{id}/verify (outcome=VERIFIED)"
        actor: Caseworker
        preconditions: ["document.status == PENDING"]
        side_effects: ["verified_income_cents set from request; this VERIFIED figure feeds the FINAL benefit variant at approve"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /liheap/income-documents/{id}/verify (outcome=REJECTED)"
        actor: Caseworker
        preconditions: ["document.status == PENDING"]
        side_effects: ["status becomes REJECTED; document does not count toward approval"]

  # ---- Vendor: enrollment ----------------------------------------------------
  - entity: Vendor
    initial_state: PENDING
    terminal_states: [ENROLLED]
    transitions:
      - from: PENDING
        to: ENROLLED
        trigger: "POST /liheap/vendors/{id}/enroll"
        actor: VendorAgent
        preconditions: ["vendor.status == PENDING"]
        side_effects: ["status becomes ENROLLED; vendor may now receive pledges and remittances"]

  # ---- Pledge: branching lifecycle ------------------------------------------
  - entity: Pledge
    initial_state: PLEDGED
    terminal_states: [PAID, CANCELLED, EXPIRED]
    transitions:
      - from: (none)
        to: PLEDGED
        trigger: "POST /liheap/pledges"
        actor: Caseworker
        preconditions:
          - "if application_id present: Application.status == APPROVED (else ERR_APPLICATION_NOT_APPROVED)  [cross-entity: Pledge->Application]"
          - "referenced vendor, funding_pool, utility_account exist (else ERR_INVALID_REFERENCE)"
          - "Vendor.status == ENROLLED (else ERR_VENDOR_NOT_ENROLLED)  [cross-entity: Pledge->Vendor]"
          - "pledge_type maps to funding_pool.program_component (HEATING->HEATING, COOLING->COOLING, CRISIS/RECONNECTION->CRISIS, ARREARAGE->HEATING) (else ERR_POOL_COMPONENT_MISMATCH)"
          - "benefit_period does not overlap any PLEDGED/PAID pledge on same utility_account (closed-interval, shares any day) (else ERR_BENEFIT_PERIOD_OVERLAP)"
          - "if pledge_type == RECONNECTION: utility_account.is_disconnected == true (else ERR_ACCOUNT_NOT_DISCONNECTED)"
          - "funding_pool.status != CLOSED and != DEPLETED (else ERR_POOL_DEPLETED)"
          - "pledged_amount_cents <= funding_pool.available_cents (else ERR_BENEFIT_EXCEEDS_AVAILABLE)"
          - "expected_pool_version == funding_pool.version (else ERR_STALE_POOL_VERSION)"
        side_effects:
          - "status = PLEDGED"
          - "funding_pool.reserved_cents += pledged_amount_cents  (transitive link 1)"
          - "funding_pool.available_cents recomputed; funding_pool.status re-derived to LOW/DEPLETED as thresholds cross  (transitive link 2)"
          - "increments FundingPool.version by 1"
      - from: PLEDGED
        to: PAID
        trigger: "POST /liheap/payments/{id}/remit (on the pledge's payment)"
        actor: VendorAgent
        preconditions: ["pledge.status == PLEDGED"]
        side_effects:
          - "funding_pool.reserved_cents -= pledged_amount_cents; funding_pool.disbursed_cents += pledged_amount_cents"
          - "funding_pool.status re-derived; increments FundingPool.version by 1"
      - from: PLEDGED
        to: CANCELLED
        trigger: "POST /liheap/pledges/{id}/cancel"
        actor: Caseworker
        preconditions: ["pledge.status == PLEDGED"]
        side_effects:
          - "funding_pool.reserved_cents -= pledged_amount_cents (compensating release; pool conservation invariant holds)"
          - "funding_pool.status re-derived; increments FundingPool.version by 1"
      - from: PLEDGED
        to: EXPIRED
        trigger: "system (owning FundingPool close)"
        actor: system
        preconditions: ["owning funding_pool transitions to CLOSED while pledge is PLEDGED"]
        side_effects:
          - "funding_pool.reserved_cents -= pledged_amount_cents (release)"

  # ---- Payment: remit + compensating return ---------------------------------
  - entity: Payment
    initial_state: INITIATED
    terminal_states: [RETURNED]
    transitions:
      - from: INITIATED
        to: REMITTED
        trigger: "POST /liheap/payments/{id}/remit"
        actor: VendorAgent
        preconditions:
          - "payment.status == INITIATED (else ERR_INVALID_STATE)"
          - "pledge.status == PLEDGED"
          - "the pledge's Vendor.status == ENROLLED (else ERR_VENDOR_NOT_ENROLLED)  [cross-entity: Payment->Vendor]"
        side_effects:
          - "status = REMITTED; remitted_at = current logical-clock time"
          - "pledge PLEDGED->PAID; pool reserved->disbursed (see Pledge machine)"
          - "create BillCredit(payment_id, utility_account_id, credit_amount_cents = amount_cents, status=APPLIED)  (cascade link 1)"
          - "apply BillCredit via calculations.bill_credit_allocation: utility_account.arrearage_cents -= applied_to_arrearage_cents, current_balance_cents -= applied_to_current_cents, lifetime_credited_cents += credit_amount_cents  (cascade link 2)"
          - "if utility_account.arrearage_cents == 0 and utility_account.is_disconnected: reconnection_eligible = true  (cascade link 3)"
      - from: REMITTED
        to: RETURNED
        trigger: "POST /liheap/payments/{id}/return"
        actor: VendorAgent
        preconditions: ["payment.status == REMITTED (else ERR_PAYMENT_NOT_REMITTED)"]
        side_effects:
          - "status = RETURNED"
          - "the BillCredit for this payment: status APPLIED->REVERSED"
          - "reverse ledger: utility_account.arrearage_cents += applied_to_arrearage_cents, current_balance_cents += applied_to_current_cents, lifetime_credited_cents -= credit_amount_cents (compensating; account conservation invariant holds)"
          - "if utility_account.arrearage_cents > 0: reconnection_eligible = false"

  # ---- CrisisBenefit: branching with 48h deadline auto-transition -----------
  - entity: CrisisBenefit
    initial_state: OPEN
    terminal_states: [RESOLVED, BREACHED]
    transitions:
      - from: (none)
        to: OPEN
        trigger: "POST /liheap/crisis-benefits"
        actor: Caseworker
        preconditions:
          - "referenced household, utility_account, funding_pool exist (else ERR_INVALID_REFERENCE)"
          - "funding_pool.program_component == CRISIS (else ERR_POOL_COMPONENT_MISMATCH)"
          - "no existing OPEN CrisisBenefit for this household whose [reported_at, resolve_by) half-open window overlaps this one (adjacency at resolve_by allowed) (else ERR_CRISIS_WINDOW_OVERLAP)"
        side_effects:
          - "reported_at = current logical-clock time; resolve_by = reported_at + 48h"
          - "estimated_benefit_cents = crisis flat rate for crisis_type (calculations.crisis_benefit_amount, ESTIMATE variant)"
          - "status = OPEN"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /liheap/crisis-benefits/{id}/resolve"
        actor: Caseworker
        preconditions:
          - "crisis.status == OPEN (else ERR_INVALID_STATE)"
          - "current logical-clock time < resolve_by (else ERR_CRISIS_DEADLINE_PASSED)"
          - "funding_pool.status != DEPLETED and != CLOSED (else ERR_POOL_DEPLETED)  [cross-entity: CrisisBenefit->FundingPool]"
        side_effects:
          - "resolved_benefit_cents = min(estimated_benefit_cents, crisis pool available_cents, utility_account.current_balance_cents + arrearage_cents) (RESOLVED variant)"
          - "create Pledge(application_id=null, vendor_id=utility_account.vendor_id, funding_pool_id, utility_account_id, pledge_type=CRISIS, pledged_amount_cents=resolved_benefit_cents, status=PLEDGED) reserving the crisis pool"
          - "status = RESOLVED"
        note: "branch A — expedited pledge created"
      - from: OPEN
        to: BREACHED
        trigger: "POST /liheap/crisis-benefits/{id}/breach"
        actor: Caseworker
        preconditions:
          - "crisis.status == OPEN (else ERR_INVALID_STATE)"
          - "current logical-clock time >= resolve_by (else ERR_CRISIS_NOT_DUE)"
        side_effects:
          - "status = BREACHED"
          - "no pledge created; crisis escalated (deadline missed)"
        note: "branch B — deadline-driven transition (only fireable once the clock has passed resolve_by), divergent side-effects vs RESOLVED"

  # ---- WeatherizationReferral: linear -----------------------------------------
  - entity: WeatherizationReferral
    initial_state: REFERRED
    terminal_states: [SCHEDULED]
    transitions:
      - from: (none)
        to: REFERRED
        trigger: "POST /liheap/weatherization-referrals  (or cascade from Application approve when TIER_1)"
        actor: Caseworker
        preconditions: ["referenced household exists (else ERR_INVALID_REFERENCE)"]
        side_effects: ["status = REFERRED; priority computed from referral_reason + household vulnerability (calculations.referral_priority)"]
      - from: REFERRED
        to: SCHEDULED
        trigger: "POST /liheap/weatherization-referrals/{id}/schedule"
        actor: Caseworker
        preconditions: ["referral.status == REFERRED"]
        side_effects: ["status = SCHEDULED"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: pledge-create-stale-pool
    parent_entity: FundingPool
    write_endpoint: "POST /liheap/pledges"
    occ_field: "expected_pool_version"
    description: |
      Creating a Pledge against a FundingPool whose version has advanced since
      the client last observed it is rejected. A prior pledge (or a payment
      remit / cancel) against the same pool legitimately reserved or released
      funds and bumped the pool version, so this client's view of
      available_cents is stale; the pledge is refused rather than silently
      drawing on an outdated balance.
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: income_eligibility
    trigger: "Application submit (self-reported income) and approve (verified income)"
    algorithm: threshold
    formula: |
      fpl_annual_cents(size):
        base = FPL_ANNUAL_CENTS[min(size, 8)]
        if size > 8: base += FPL_ADDL_PER_PERSON_CENTS * (size - 8)
        return base
      fpl_pct = round_half_up( income_cents / fpl_annual_cents(size) * 100 , 2 )
      income_eligible = (fpl_pct <= ELIGIBILITY_FPL_PCT)      # 150.00 inclusive
      # income_cents = Household.annual_income_cents at submit;
      #              = verified_income_cents of the VERIFIED IncomeDocument with
      #                greatest created_at at approve.
    input_set: "single Household (submit) or single Application + its VERIFIED IncomeDocuments (approve)"
    constants:
      FPL_ANNUAL_CENTS: { 1: 1506000, 2: 2044000, 3: 2582000, 4: 3120000, 5: 3658000, 6: 4196000, 7: 4734000, 8: 5272000 }
      FPL_ADDL_PER_PERSON_CENTS: 538000
      ELIGIBILITY_FPL_PCT: 150.00
    precision: "fpl_pct 2 decimals, round_half_up; comparison is <= 150.00 (inclusive boundary)"

  - name: benefit_tier_award
    trigger: "Application submit (PROVISIONAL) and approve (FINAL)"
    algorithm: tiered_pricing
    formula: |
      # Mode (a): >=3 inputs (fpl_pct band, household_size, heating_source,
      # vulnerability) with tiered-rate selection and a nested min/max clamp.
      tier = TIER_1 if fpl_pct <= 75 else
             TIER_2 if fpl_pct <= 110 else
             TIER_3 if fpl_pct <= 150 else INELIGIBLE
      base = TIER_BASE_CENTS[tier]
      size_mult = 1.0 + 0.10 * max(0, household_size - 2)
      hf = HEATING_FACTOR[heating_source]
      size_component_cents    = base * size_mult
      heating_component_cents = base * (hf - 1.0)
      vulnerability_component_cents = VULNERABILITY_SUPPLEMENT_CENTS
        if (has_elderly_or_disabled or has_child_under_6) else 0
      raw_sum = calculations.benefit_component_rounding( size_component_cents,
                heating_component_cents, vulnerability_component_cents )
      benefit_amount_cents = min(MAX_BENEFIT_CENTS, max(MIN_BENEFIT_CENTS, raw_sum))
    input_set: "single Application + its Household demographics"
    constants:
      TIER_BASE_CENTS: { TIER_1: 81500, TIER_2: 61000, TIER_3: 40500 }
      HEATING_FACTOR: { ELECTRICITY: 1.0, NATURAL_GAS: 1.1, FUEL_OIL: 1.3, PROPANE: 1.25 }
      VULNERABILITY_SUPPLEMENT_CENTS: 15000
      MAX_BENEFIT_CENTS: 150000
      MIN_BENEFIT_CENTS: 10000
    precision: "components rounded per calculations.benefit_component_rounding; final clamped to [MIN,MAX]"
    variants:
      - name: PROVISIONAL
        when: "at submit"
        difference: "income_cents = Household.annual_income_cents (self-reported); benefit_variant=PROVISIONAL"
      - name: FINAL
        when: "at approve"
        difference: "income_cents = verified_income_cents of latest VERIFIED IncomeDocument; benefit_variant=FINAL; may fall in a different tier and yield a different benefit_amount_cents than PROVISIONAL"

  - name: benefit_component_rounding
    trigger: "invoked by benefit_tier_award to combine the three benefit components"
    algorithm: aggregation
    formula: |
      # Mode (b): nested rounding where ORDER matters. Pinned order below is
      # ROUND-EACH-COMPONENT-TO-WHOLE-DOLLARS THEN SUM (NOT sum-then-round).
      round_dollar(c) = round_half_up(c / 100.0) * 100    # to nearest 100 cents
      result = round_dollar(size_component_cents)
             + round_dollar(heating_component_cents)
             + vulnerability_component_cents
      # vulnerability_component_cents is already whole dollars (multiple of 100),
      # so only size and heating components are rounded.
    input_set: "the three component cent-values from benefit_tier_award for one Application"
    constants: {}
    precision: "each rounded component to whole dollars (100 cents), round_half_up; PINNED round-then-sum (sum-then-round is the wrong interpretation)"

  - name: crisis_benefit_amount
    trigger: "CrisisBenefit create (ESTIMATE) and resolve (RESOLVED)"
    algorithm: threshold
    formula: |
      ESTIMATE (at create):  estimated_benefit_cents = CRISIS_RATE_CENTS[crisis_type]
      RESOLVED (at resolve): resolved_benefit_cents  = min(
            estimated_benefit_cents,
            crisis_pool.available_cents,
            utility_account.current_balance_cents + utility_account.arrearage_cents )
    input_set: "single CrisisBenefit + its CRISIS FundingPool + its UtilityAccount"
    constants:
      CRISIS_RATE_CENTS: { NO_HEAT: 50000, DISCONNECTION_NOTICE: 40000, OUT_OF_FUEL: 60000 }
      CRISIS_DEADLINE_HOURS: 48
    precision: "whole cents"
    variants:
      - name: ESTIMATE
        when: "at crisis report"
        difference: "flat rate for crisis_type only; ignores pool balance and account balance"
      - name: RESOLVED
        when: "at crisis resolve"
        difference: "min of estimate, live crisis-pool availability, and the account's total owed; can be strictly less than ESTIMATE"

  - name: pool_accounting
    trigger: "any pledge reserve (create), disburse (payment remit), or release (cancel / expire / payment return)"
    algorithm: aggregation
    formula: |
      reserved_cents  = SUM(pledged_amount_cents WHERE pledge.status == PLEDGED and funding_pool_id == pool.id)
      disbursed_cents = SUM(pledged_amount_cents WHERE pledge.status == PAID    and funding_pool_id == pool.id)
      available_cents = total_allocation_cents - reserved_cents - disbursed_cents
      INVARIANT: total_allocation_cents == available_cents + reserved_cents + disbursed_cents  (always)
    input_set: "all pledges drawing on the pool, filtered by status"
    constants: {}
    precision: "whole cents; tie-break/order irrelevant (commutative sums)"

  - name: bill_credit_allocation
    trigger: "payment remit (BillCredit application) and payment return (reversal)"
    algorithm: waterfall_allocation
    formula: |
      # Arrearage-first waterfall.
      applied_to_arrearage_cents = min(credit_amount_cents, utility_account.arrearage_cents)
      remaining = credit_amount_cents - applied_to_arrearage_cents
      applied_to_current_cents   = min(remaining, utility_account.current_balance_cents)
      # any excess beyond arrearage+current is unallocated (over-credit); it does
      # not create a negative balance.
      # Apply: arrearage_cents -= applied_to_arrearage_cents
      #        current_balance_cents -= applied_to_current_cents
      #        lifetime_credited_cents += (applied_to_arrearage_cents + applied_to_current_cents)
      INVARIANT: arrearage_cents + current_balance_cents + lifetime_credited_cents == original_obligation_cents
    input_set: "one UtilityAccount + the remitting Payment amount"
    constants: {}
    precision: "whole cents; arrearage bucket filled before current bucket (pinned order)"

  - name: referral_priority
    trigger: "WeatherizationReferral create"
    algorithm: threshold
    formula: |
      priority = HIGH   if (referral_reason == TIER_1_AUTO) or household.has_elderly_or_disabled
               = MEDIUM if household.has_child_under_6
               = LOW    otherwise
    input_set: "one WeatherizationReferral + its Household"
    constants: {}
    precision: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC; entity_backed roles must own the target (Applicant.X-User-ID == Household.id, VendorAgent.X-User-ID == Vendor.id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every id in the URL path resolves to an existing resource (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 4
    category: state
    check: "Target resource is in a state that permits this transition (generic)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: state
    check: "Pledge create: referenced Application (when present) is APPROVED"
    error_id: ERR_APPLICATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /liheap/pledges"
  - priority: 6
    category: business_referential
    check: "Body foreign keys (household_id, vendor_id, funding_pool_id, utility_account_id, application_id, pledge_id, payment_id) resolve to existing resources"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: "all POST create endpoints carrying FK fields"
  - priority: 7
    category: business_referential
    check: "Pledge/CrisisBenefit pledge_type-or-crisis maps to funding_pool.program_component"
    error_id: ERR_POOL_COMPONENT_MISMATCH
    http_status: 422
    applies_to: "POST /liheap/pledges, POST /liheap/crisis-benefits"
  - priority: 8
    category: business_temporal
    check: "Application submit: matching FundingPool for (season_year, program_component) is not CLOSED"
    error_id: ERR_SEASON_CLOSED
    http_status: 409
    applies_to: "POST /liheap/applications/{id}/submit"
  - priority: 9
    category: business_temporal
    check: "CrisisBenefit resolve: current logical-clock time is before resolve_by"
    error_id: ERR_CRISIS_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /liheap/crisis-benefits/{id}/resolve"
  - priority: 9.5
    category: business_temporal
    check: "CrisisBenefit breach: current logical-clock time is at or after resolve_by"
    error_id: ERR_CRISIS_NOT_DUE
    http_status: 409
    applies_to: "POST /liheap/crisis-benefits/{id}/breach"
  - priority: 10
    category: business_constraint
    check: "Application submit: no other SUBMITTED/INFO_REQUESTED/APPROVED Application for same (household_id, season_year, program_component)"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "POST /liheap/applications/{id}/submit"
  - priority: 11
    category: business_constraint
    check: "Application submit/approve: fpl_pct <= 150.00 (self-reported at submit, verified at approve)"
    error_id: ERR_INCOME_INELIGIBLE
    http_status: 422
    applies_to: "POST /liheap/applications/{id}/submit, POST /liheap/applications/{id}/approve"
  - priority: 12
    category: business_constraint
    check: "Application approve: at least one VERIFIED IncomeDocument exists for the application"
    error_id: ERR_INCOME_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /liheap/applications/{id}/approve"
  - priority: 13
    category: business_constraint
    check: "CrisisBenefit create: [reported_at, resolve_by) window does not overlap an existing OPEN crisis for the household (half-open; adjacency allowed)"
    error_id: ERR_CRISIS_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /liheap/crisis-benefits"
  - priority: 14
    category: business_constraint
    check: "Pledge create: benefit_period [start,end] (closed) does not overlap any PLEDGED/PAID pledge on the same utility_account"
    error_id: ERR_BENEFIT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /liheap/pledges"
  - priority: 15
    category: business_constraint
    check: "Pledge create: RECONNECTION pledges require utility_account.is_disconnected == true"
    error_id: ERR_ACCOUNT_NOT_DISCONNECTED
    http_status: 422
    applies_to: "POST /liheap/pledges"
  - priority: 16
    category: business_safety
    check: "Pledge create / payment remit: the vendor is ENROLLED"
    error_id: ERR_VENDOR_NOT_ENROLLED
    http_status: 409
    applies_to: "POST /liheap/pledges, POST /liheap/payments/{id}/remit"
  - priority: 17
    category: business_fiscal
    check: "Pledge create / crisis resolve: funding_pool.status is not CLOSED or DEPLETED"
    error_id: ERR_POOL_DEPLETED
    http_status: 409
    applies_to: "POST /liheap/pledges, POST /liheap/crisis-benefits/{id}/resolve"
  - priority: 18
    category: business_fiscal
    check: "Pledge create: pledged_amount_cents <= funding_pool.available_cents"
    error_id: ERR_BENEFIT_EXCEEDS_AVAILABLE
    http_status: 409
    applies_to: "POST /liheap/pledges"
  - priority: 19
    category: business_constraint
    check: "Payment return: payment.status == REMITTED"
    error_id: ERR_PAYMENT_NOT_REMITTED
    http_status: 409
    applies_to: "POST /liheap/payments/{id}/return"
  - priority: 20
    category: concurrency
    check: "Pledge create: expected_pool_version == funding_pool.version (OCC)"
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412
    applies_to: "POST /liheap/pledges"
  - priority: 21
    category: existence
    check: "Request body present and required fields non-null with correct types / enum members"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- FundingPool ----------------------------------------------------------
  - method: POST
    path: "/liheap/funding-pools"
    description: "Create a seasonal funding pool"
    roles: [ProgramAdmin]
    code: 201
    input: [season_year, program_component, total_allocation_cents, depletion_threshold_cents]
    output: FundingPool
    side_effects: ["status=OPEN; reserved_cents=0, disbursed_cents=0, available_cents=total_allocation_cents; version=1"]
  - method: GET
    path: "/liheap/funding-pools/{id}"
    description: "Fetch one funding pool (exposes version for OCC and derived balances)"
    roles: [ProgramAdmin, Caseworker]
    code: 200
    input: []
    output: FundingPool
    side_effects: []
  - method: POST
    path: "/liheap/funding-pools/{id}/close"
    description: "Close a pool at season end; expires outstanding pledges"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: FundingPool
    side_effects: ["status=CLOSED; PLEDGED pledges on this pool -> EXPIRED and release reserved_cents; increments FundingPool.version by 1"]

  # ---- Household ------------------------------------------------------------
  - method: POST
    path: "/liheap/households"
    description: "Register a household (intake)"
    roles: [Caseworker, ProgramAdmin]
    code: 201
    input: [primary_applicant_name, household_size, annual_income_cents, state_code, county, "has_elderly_or_disabled?", "has_child_under_6?", heating_source]
    output: Household
    side_effects: []
  - method: GET
    path: "/liheap/households/{id}"
    description: "Fetch one household"
    roles: [Applicant, Caseworker, ProgramAdmin]
    code: 200
    input: []
    output: Household
    side_effects: []

  # ---- Application ----------------------------------------------------------
  - method: POST
    path: "/liheap/applications"
    description: "Create a benefit application (DRAFT)"
    roles: [Applicant, Caseworker]
    code: 201
    input: [household_id, season_year, program_component]
    output: Application
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/liheap/applications/{id}"
    description: "Fetch one application"
    roles: [Applicant, Caseworker, ProgramAdmin]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/liheap/applications"
    description: "List applications (filterable)"
    roles: [Caseworker, ProgramAdmin]
    code: 200
    input: ["household_id?", "season_year?", "program_component?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/liheap/applications/{id}/submit"
    description: "Submit (or resubmit from INFO_REQUESTED) an application"
    roles: [Applicant]
    code: 200
    input: []
    output: Application
    side_effects: ["status=SUBMITTED; fpl_pct/benefit computed (PROVISIONAL); submitted_at set"]
  - method: POST
    path: "/liheap/applications/{id}/request-info"
    description: "Caseworker requests more info (SUBMITTED->INFO_REQUESTED)"
    roles: [Caseworker]
    code: 200
    input: []
    output: Application
    side_effects: ["status=INFO_REQUESTED"]
  - method: POST
    path: "/liheap/applications/{id}/approve"
    description: "Approve an application (finalizes benefit; may auto-refer weatherization)"
    roles: [Caseworker]
    code: 200
    input: []
    output: Application
    side_effects: ["status=APPROVED; benefit recomputed FINAL (verified income); TIER_1 -> WeatherizationReferral created"]
  - method: POST
    path: "/liheap/applications/{id}/deny"
    description: "Deny an application"
    roles: [Caseworker]
    code: 200
    input: ["denial_reason?"]
    output: Application
    side_effects: ["status=DENIED; denial_reason stored"]

  # ---- IncomeDocument -------------------------------------------------------
  - method: POST
    path: "/liheap/income-documents"
    description: "Upload an income document for an application (PENDING)"
    roles: [Applicant, Caseworker]
    code: 201
    input: [application_id, doc_type, reported_income_cents]
    output: IncomeDocument
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/liheap/income-documents/{id}"
    description: "Fetch one income document"
    roles: [Applicant, Caseworker]
    code: 200
    input: []
    output: IncomeDocument
    side_effects: []
  - method: GET
    path: "/liheap/income-documents"
    description: "List income documents (filter by application)"
    roles: [Caseworker, ProgramAdmin]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: IncomeDocument[]
    side_effects: []
  - method: POST
    path: "/liheap/income-documents/{id}/verify"
    description: "Verify or reject an income document"
    roles: [Caseworker]
    code: 200
    input: [outcome, "verified_income_cents?"]
    output: IncomeDocument
    side_effects: ["status=VERIFIED (verified_income_cents set) or REJECTED"]

  # ---- Vendor ---------------------------------------------------------------
  - method: POST
    path: "/liheap/vendors"
    description: "Register a utility / fuel vendor (PENDING)"
    roles: [ProgramAdmin]
    code: 201
    input: [name, vendor_type, remittance_account]
    output: Vendor
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/liheap/vendors/{id}"
    description: "Fetch one vendor"
    roles: [VendorAgent, Caseworker, ProgramAdmin]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: POST
    path: "/liheap/vendors/{id}/enroll"
    description: "Enroll a vendor (PENDING->ENROLLED)"
    roles: [VendorAgent, ProgramAdmin]
    code: 200
    input: []
    output: Vendor
    side_effects: ["status=ENROLLED"]

  # ---- UtilityAccount -------------------------------------------------------
  - method: POST
    path: "/liheap/utility-accounts"
    description: "Create a household's utility account"
    roles: [Caseworker, VendorAgent]
    code: 201
    input: [household_id, vendor_id, account_number, service_type, "current_balance_cents?", "arrearage_cents?", "is_disconnected?"]
    output: UtilityAccount
    side_effects: ["lifetime_credited_cents=0; original_obligation_cents=current_balance_cents+arrearage_cents; reconnection_eligible=false"]
  - method: GET
    path: "/liheap/utility-accounts/{id}"
    description: "Fetch one utility account"
    roles: [Applicant, Caseworker, VendorAgent, ProgramAdmin]
    code: 200
    input: []
    output: UtilityAccount
    side_effects: []
  - method: GET
    path: "/liheap/utility-accounts"
    description: "List utility accounts (filter by household or vendor)"
    roles: [Caseworker, VendorAgent, ProgramAdmin]
    code: 200
    input: ["household_id?", "vendor_id?", "limit?", "offset?"]
    output: UtilityAccount[]
    side_effects: []
  - method: POST
    path: "/liheap/utility-accounts/{id}/report-status"
    description: "Vendor reports current balance / arrearage / disconnection"
    roles: [VendorAgent]
    code: 200
    input: ["current_balance_cents?", "arrearage_cents?", "is_disconnected?"]
    output: UtilityAccount
    side_effects: ["balances/disconnection updated; original_obligation_cents recomputed as current+arrearage+lifetime_credited to preserve the ledger anchor"]

  # ---- Pledge ---------------------------------------------------------------
  - method: POST
    path: "/liheap/pledges"
    description: "Create a benefit pledge drawing on a funding pool (OCC-guarded)"
    roles: [Caseworker]
    code: 201
    input: ["application_id?", vendor_id, funding_pool_id, utility_account_id, pledge_type, pledged_amount_cents, benefit_period_start, benefit_period_end, expected_pool_version]
    output: Pledge
    side_effects: ["status=PLEDGED; funding_pool.reserved_cents += amount; pool.available/status re-derived; increments FundingPool.version by 1"]
  - method: GET
    path: "/liheap/pledges/{id}"
    description: "Fetch one pledge"
    roles: [Caseworker, VendorAgent, ProgramAdmin]
    code: 200
    input: []
    output: Pledge
    side_effects: []
  - method: GET
    path: "/liheap/pledges"
    description: "List pledges (filterable by any FK or status)"
    roles: [Caseworker, VendorAgent, ProgramAdmin]
    code: 200
    input: ["application_id?", "vendor_id?", "funding_pool_id?", "utility_account_id?", "status?", "limit?", "offset?"]
    output: Pledge[]
    side_effects: []
  - method: POST
    path: "/liheap/pledges/{id}/cancel"
    description: "Cancel a PLEDGED pledge (releases reserved funds)"
    roles: [Caseworker]
    code: 200
    input: []
    output: Pledge
    side_effects: ["status=CANCELLED; funding_pool.reserved_cents -= amount; pool.available/status re-derived; increments FundingPool.version by 1"]

  # ---- Payment --------------------------------------------------------------
  - method: POST
    path: "/liheap/payments"
    description: "Initiate a direct-vendor payment against a pledge"
    roles: [Caseworker]
    code: 201
    input: [pledge_id, amount_cents]
    output: Payment
    side_effects: ["status=INITIATED"]
  - method: GET
    path: "/liheap/payments/{id}"
    description: "Fetch one payment"
    roles: [Caseworker, VendorAgent, ProgramAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/liheap/payments"
    description: "List payments (filter by pledge)"
    roles: [Caseworker, VendorAgent, ProgramAdmin]
    code: 200
    input: ["pledge_id?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: POST
    path: "/liheap/payments/{id}/remit"
    description: "Remit payment to vendor; creates and applies the bill credit"
    roles: [VendorAgent]
    code: 200
    input: []
    output: Payment
    side_effects: ["status=REMITTED; pledge->PAID; pool reserved->disbursed; BillCredit created+applied (arrearage-first); reconnection_eligible may flip; increments FundingPool.version by 1"]
  - method: POST
    path: "/liheap/payments/{id}/return"
    description: "Return a remitted payment; reverses the bill credit (compensating)"
    roles: [VendorAgent]
    code: 200
    input: []
    output: Payment
    side_effects: ["status=RETURNED; BillCredit->REVERSED; account ledger restored; reconnection_eligible may clear"]

  # ---- BillCredit (created only via payment remit cascade) ------------------
  - method: GET
    path: "/liheap/bill-credits/{id}"
    description: "Fetch one bill credit"
    roles: [Caseworker, VendorAgent, ProgramAdmin]
    code: 200
    input: []
    output: BillCredit
    side_effects: []
  - method: GET
    path: "/liheap/bill-credits"
    description: "List bill credits (filter by payment or utility account) — sole discovery channel for cascade-created credits"
    roles: [Caseworker, VendorAgent, ProgramAdmin]
    code: 200
    input: ["payment_id?", "utility_account_id?", "status?", "limit?", "offset?"]
    output: BillCredit[]
    side_effects: []

  # ---- CrisisBenefit --------------------------------------------------------
  - method: POST
    path: "/liheap/crisis-benefits"
    description: "Open a 48-hour energy crisis benefit"
    roles: [Caseworker]
    code: 201
    input: [household_id, utility_account_id, funding_pool_id, crisis_type]
    output: CrisisBenefit
    side_effects: ["status=OPEN; reported_at=clock; resolve_by=clock+48h; estimated_benefit_cents set (ESTIMATE)"]
  - method: GET
    path: "/liheap/crisis-benefits/{id}"
    description: "Fetch one crisis benefit"
    roles: [Caseworker, ProgramAdmin]
    code: 200
    input: []
    output: CrisisBenefit
    side_effects: []
  - method: GET
    path: "/liheap/crisis-benefits"
    description: "List crisis benefits (filter by household / account / pool / status)"
    roles: [Caseworker, ProgramAdmin]
    code: 200
    input: ["household_id?", "utility_account_id?", "funding_pool_id?", "status?", "limit?", "offset?"]
    output: CrisisBenefit[]
    side_effects: []
  - method: POST
    path: "/liheap/crisis-benefits/{id}/resolve"
    description: "Resolve an OPEN crisis before its deadline; creates an expedited crisis pledge"
    roles: [Caseworker]
    code: 200
    input: []
    output: CrisisBenefit
    side_effects: ["status=RESOLVED; resolved_benefit_cents computed (RESOLVED); crisis Pledge created + pool reserved"]
  - method: POST
    path: "/liheap/crisis-benefits/{id}/breach"
    description: "Mark an OPEN crisis BREACHED after its 48-hour deadline has passed (clock >= resolve_by)"
    roles: [Caseworker, ProgramAdmin]
    code: 200
    input: []
    output: CrisisBenefit
    side_effects: ["status=BREACHED (only when current clock >= resolve_by); no pledge created"]

  # ---- WeatherizationReferral -----------------------------------------------
  - method: POST
    path: "/liheap/weatherization-referrals"
    description: "Create a weatherization referral"
    roles: [Caseworker]
    code: 201
    input: [household_id, "application_id?", referral_reason]
    output: WeatherizationReferral
    side_effects: ["status=REFERRED; priority computed"]
  - method: GET
    path: "/liheap/weatherization-referrals/{id}"
    description: "Fetch one referral"
    roles: [Caseworker, ProgramAdmin]
    code: 200
    input: []
    output: WeatherizationReferral
    side_effects: []
  - method: GET
    path: "/liheap/weatherization-referrals"
    description: "List referrals (filter by household or application)"
    roles: [Caseworker, ProgramAdmin]
    code: 200
    input: ["household_id?", "application_id?", "status?", "limit?", "offset?"]
    output: WeatherizationReferral[]
    side_effects: []
  - method: POST
    path: "/liheap/weatherization-referrals/{id}/schedule"
    description: "Schedule a referred weatherization visit (REFERRED->SCHEDULED)"
    roles: [Caseworker]
    code: 200
    input: []
    output: WeatherizationReferral
    side_effects: ["status=SCHEDULED"]

  # ---- Logical clock (test-driving) -----------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock. Advancing the clock does NOT itself change any crisis; a crisis becomes BREACHED only via POST /liheap/crisis-benefits/{id}/breach once the clock has passed resolve_by."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601 (no cascades)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a known role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or entity_backed role acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id does not resolve to an existing resource" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/null required field, wrong type, or invalid enum member" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state that permits this transition" }
  - { id: ERR_APPLICATION_NOT_APPROVED, http: 409, condition: "Pledge references an Application that is not APPROVED" }
  - { id: ERR_INVALID_REFERENCE, http: 422, condition: "A body foreign key does not resolve to an existing resource" }
  - { id: ERR_POOL_COMPONENT_MISMATCH, http: 422, condition: "pledge_type / crisis maps to a program_component different from the referenced pool's" }
  - { id: ERR_SEASON_CLOSED, http: 409, condition: "Application submit against a (season, component) whose FundingPool is CLOSED" }
  - { id: ERR_CRISIS_DEADLINE_PASSED, http: 409, condition: "Crisis resolve attempted at or after resolve_by" }
  - { id: ERR_CRISIS_NOT_DUE, http: 409, condition: "Crisis breach attempted before resolve_by (clock has not yet passed the deadline)" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "Another active Application exists for the same household+season+component" }
  - { id: ERR_INCOME_INELIGIBLE, http: 422, condition: "fpl_pct exceeds 150.00 (self-reported at submit, verified at approve)" }
  - { id: ERR_INCOME_NOT_VERIFIED, http: 409, condition: "Approve attempted with no VERIFIED IncomeDocument for the application" }
  - { id: ERR_CRISIS_WINDOW_OVERLAP, http: 409, condition: "New crisis window overlaps an existing OPEN crisis window for the household" }
  - { id: ERR_BENEFIT_PERIOD_OVERLAP, http: 409, condition: "Pledge coverage period overlaps an existing PLEDGED/PAID pledge on the same utility account" }
  - { id: ERR_ACCOUNT_NOT_DISCONNECTED, http: 422, condition: "RECONNECTION pledge on an account that is not disconnected" }
  - { id: ERR_VENDOR_NOT_ENROLLED, http: 409, condition: "Pledge create or payment remit for a vendor that is not ENROLLED" }
  - { id: ERR_POOL_DEPLETED, http: 409, condition: "Pledge create or crisis resolve against a CLOSED or DEPLETED pool" }
  - { id: ERR_BENEFIT_EXCEEDS_AVAILABLE, http: 409, condition: "pledged_amount_cents exceeds funding_pool.available_cents" }
  - { id: ERR_PAYMENT_NOT_REMITTED, http: 409, condition: "Payment return attempted on a payment that is not REMITTED" }
  - { id: ERR_STALE_POOL_VERSION, http: 412, condition: "expected_pool_version does not match funding_pool.version (OCC conflict)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "A household applying for energy assistance; acts as its own Household record"
    identity: "entity_backed:Household"
    exclusive_operations:
      - "POST /liheap/applications/{id}/submit — submit/resubmit own application"
    shared_operations:
      - "POST /liheap/applications — create own application (shared with Caseworker)"
      - "POST /liheap/income-documents — upload income document (shared with Caseworker)"
      - "GET /liheap/households/{id}, GET /liheap/applications/{id}, GET /liheap/income-documents/{id}, GET /liheap/utility-accounts/{id}"
  - name: Caseworker
    description: "Determines eligibility, manages applications, pledges, crises, and referrals"
    identity: "opaque"
    exclusive_operations:
      - "POST /liheap/applications/{id}/request-info, .../approve, .../deny"
      - "POST /liheap/income-documents/{id}/verify"
      - "POST /liheap/pledges, POST /liheap/pledges/{id}/cancel"
      - "POST /liheap/payments"
      - "POST /liheap/crisis-benefits, POST /liheap/crisis-benefits/{id}/resolve"
      - "POST /liheap/weatherization-referrals, POST /liheap/weatherization-referrals/{id}/schedule"
    shared_operations:
      - "POST /liheap/households (shared with ProgramAdmin)"
      - "POST /liheap/applications, POST /liheap/income-documents (shared with Applicant)"
      - "POST /liheap/utility-accounts (shared with VendorAgent)"
      - "GET list/detail endpoints across applications, pledges, payments, crises, referrals, pools"
  - name: VendorAgent
    description: "Acts on behalf of an enrolled vendor; enrolls, reports account status, remits/returns payments"
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /liheap/vendors/{id}/enroll (own vendor)"
      - "POST /liheap/utility-accounts/{id}/report-status"
      - "POST /liheap/payments/{id}/remit, POST /liheap/payments/{id}/return"
    shared_operations:
      - "POST /liheap/utility-accounts (shared with Caseworker)"
      - "GET /liheap/vendors/{id}, GET /liheap/utility-accounts, GET /liheap/pledges, GET /liheap/payments, GET /liheap/bill-credits"
  - name: ProgramAdmin
    description: "Operational admin: funding pools, vendor registry, season close, logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /liheap/funding-pools, POST /liheap/funding-pools/{id}/close"
      - "POST /liheap/vendors"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /liheap/households (shared with Caseworker)"
      - "POST /liheap/vendors/{id}/enroll (shared with VendorAgent)"
      - "GET detail/list endpoints across all resources"


