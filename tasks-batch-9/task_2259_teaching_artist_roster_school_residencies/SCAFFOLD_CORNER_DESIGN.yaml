        grounds:
          - calculations.portfolio_composite
          - errors[ERR_PORTFOLIO_THRESHOLD_NOT_MET]
        excluded_because:
          difficulty_instance: boundary_precision_check / portfolio_mean_at_advance_threshold_versus_one_cent_below
          rationale: "3.50 passing while 3.49 fails, on the rounded mean, is exactly that instance's pair."

      - name: session_fee_tier_and_cap_boundary
        claim_type: tiered_pricing_boundary
        grounds:
          - calculations.session_fee
        excluded_because:
          difficulty_instance: combinatorial_formula / session_fee_cap_before_proration_mode_a_nonlinear
          rationale: "The MAX_SESSION_FEE_CENTS ceiling and the cap-then-prorate ordering are probed there at the exact boundary (19000 uncapped, 9500 after proration)."

      - name: clearance_window_merges_screening_intervals
        claim_type: interval_merge_boundary
        grounds:
          - calculations.artist_clearance_window
        excluded_because:
          difficulty_instance: boundary_precision_check / clearance_expiry_date_itself_is_schedulable_but_next_day_is_not
          rationale: "The min-of-expiries window and its inclusive right edge are asserted there on the session-date comparison."

      - name: residency_ledger_running_totals
        claim_type: aggregation_running_total
        grounds:
          - calculations.residency_session_ledger
          - calculations.residency_budget_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / makeup_credit_round_trip_preserves_session_obligation_invariant
          rationale: "The session-obligation running total is asserted there after every mutation, in both directions of the make-up round trip."

      - name: reliability_orders_sessions_chronologically
        claim_type: chronological_ordering
        grounds:
          - calculations.artist_reliability_score
        excluded_because:
          difficulty_instance: dual_variant_calc / artist_reliability_rolling_window_versus_program_year
          rationale: "The session_date DESC ordering and the RELIABILITY_WINDOW truncation are the substance of that dual-variant instance."

      - name: cost_outlook_projects_pending_sessions
        claim_type: forward_looking_pending
        grounds:
          - calculations.residency_cost_outlook
        excluded_because:
          difficulty_instance: dual_variant_calc / residency_cost_outlook_earned_versus_projected_completion
          rationale: "earned_to_date versus projected_completion — the backward and forward views of the same residency — is that instance's whole subject."

