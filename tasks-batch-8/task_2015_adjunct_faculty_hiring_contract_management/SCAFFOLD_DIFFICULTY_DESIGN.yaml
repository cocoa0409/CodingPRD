          Mode (b): nested rounding where order matters — earned and floor
          components are each rounded round_half_up to integer cents BEFORE the
          max(); rounding only after the max would give a different cent value.
          Chosen inputs make the floor win at 2,250,000 while a
          max-then-round-on-raw-fraction pipeline would surface 1,800,000 or a
          differently-rounded earned value; the pinned order is falsifiable at
