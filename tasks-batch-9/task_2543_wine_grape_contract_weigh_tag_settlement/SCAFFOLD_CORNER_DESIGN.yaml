      - name: acreage_basis_cap_sums_allocated_acres_times_contracted_yield
        claim_type: Correct Result
        grounds:
          - calculations.tonnage_cap_derivation
          - validations.priority_9
          - entities.ContractBlockAllocation.fields.allocated_acres
        distinguishing_aspect: |
          On the ACREAGE basis the cap comes from the ALLOCATIONS, not from the blocks:
          10.500 + 4.250 = 14.750 allocated acres times a contracted yield of 2.500 gives
          36.875 tons, whose 10 pct tolerance is 40.5625 and must round HALF UP to 40.563.
          The two blocks' own acreages (20.000 and 10.000) and their own
          expected_yield_tons_per_acre are deliberately different from the allocated
          figures, so an implementation that reads the block instead of the allocation
          produces 75.000 rather than 36.875. cap_scope stays PER_CONTRACT even though the
          inputs are per-allocation.
        test_recipe:
          setup:
            - "One grower, two blocks (20.000 acres at 2.000 t/acre and 10.000 acres at 1.500 t/acre), one ACREAGE contract with contracted_yield_tons_per_acre 2.500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerRelationsManager
            - call: "POST /grower-relations/growers"
              payload: { name: "Ridgeline Vineyards", license_number: "PL-44821", region_code: "NAPA-NORTH" }
              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_id}", block_code: "B-12", varietal: "CABERNET_SAUVIGNON", acres: 20.000, expected_yield_tons_per_acre: 2.000, ava_code: "NAPA-VALLEY" }
              as: GrowerRelationsManager
              captures: { block_a: $.data.id }
            - call: "POST /grower-relations/vineyard-blocks"
              payload: { grower_id: "${grower_id}", block_code: "B-13", varietal: "MERLOT", acres: 10.000, expected_yield_tons_per_acre: 1.500, ava_code: "NAPA-VALLEY" }
              as: GrowerRelationsManager
              captures: { block_b: $.data.id }
            - call: "POST /grower-relations/quality-specs"
              payload: { spec_code: "CAB-STD-2026", min_brix_accept: 20.0, brix_bonus_start: 24.0, brix_penalty_start: 22.0, rot_rejection_pct: 8.0, min_brix_pick_call: 21.0 }
              as: GrowerRelationsManager
              captures: { spec_id: $.data.id }
            - call: "POST /grower-relations/grape-contracts"
              payload: { grower_id: "${grower_id}", quality_spec_id: "${spec_id}", contract_code: "GC-ACREAGE", contract_basis: "ACREAGE", base_price_per_ton_cents: 450000, over_delivery_policy: "ACCEPT_AT_CONTRACT", term_start_vintage: 2026, term_end_vintage: 2026, contracted_yield_tons_per_acre: 2.500, installment_plan: [{ installment_no: 1, pct_of_settlement: 100.0, due_offset_days: 30, lien_protected: true }] }
              as: GrowerRelationsManager
              captures: { contract_id: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_id}", block_id: "${block_a}", allocated_acres: 10.500 }
              as: GrowerRelationsManager
              captures: { alloc_a: $.data.id }
            - call: "POST /grower-relations/contract-block-allocations"
              payload: { contract_id: "${contract_id}", block_id: "${block_b}", allocated_acres: 4.250 }
              as: GrowerRelationsManager
              captures: { alloc_b: $.data.id }
            - call: "POST /grower-relations/grape-contracts/${contract_id}/offer"
              payload: {}
              as: GrowerRelationsManager
          trigger:
            - call: "POST /grower-relations/grape-contracts/${contract_id}/accept"
              payload: {}
              as: Grower
              as_user_id: "${grower_id}"
            - call: "GET /grower-relations/grape-contracts/${contract_id}/settlement-summary"
              payload: {}
              as: GrowerRelationsManager
            - call: "GET /grower-relations/contract-block-allocations/${alloc_a}"
              payload: {}
              as: GrowerRelationsManager
          assert:
            - "The accept returns 200 with contract_cap_tons == 36.875 (14.750 * 2.500), NOT 75.000 from the blocks' own acreage and yield"
            - "hard_cap_tons == 40.563: 36.875 * 1.10 is 40.5625 and rounds HALF UP at the third decimal"
            - "cap_scope == \"PER_CONTRACT\""
            - "The settlement-summary read reports the same contract_cap_tons 36.875, hard_cap_tons 40.563 and cap_scope \"PER_CONTRACT\", with delivered_contract_tons 0.000"
            - "Allocation A still carries allocated_acres == 10.500, and on the ACREAGE basis its block_cap_tons is null (or 0.000) because the cap is contract-wide, not per block"
            - "committed_tons on the contract is null: the ACREAGE basis forbids it, so the cap can only have come from the allocation sum"

      - name: block_basis_cap_is_derived_per_block_and_summed
        claim_type: Correct Result
        grounds:
          - calculations.tonnage_cap_derivation
          - entities.ContractBlockAllocation.fields.block_cap_tons
          - entities.ContractBlockAllocation.fields.block_hard_cap_tons
        distinguishing_aspect: |
          The BLOCK basis is the only one where each allocation carries its OWN cap and its
          own tolerance band: 20.000 x 2.000 = 40.000 with a hard cap of 44.000, and
          10.000 x 1.500 = 15.000 with a hard cap of 16.500. The contract-level figures are
          the sum of the per-block caps (55.000) and the tolerance applied to that sum
          (60.500) — and 44.000 + 16.500 also equals 60.500 only because both use the same
          tolerance, so the assertion pins each level separately. cap_scope PER_BLOCK is
          what later makes the waterfall consume the block cap instead of the contract cap.
        test_recipe:
          setup:
            - "One grower, two blocks (20.000 acres at 2.000 t/acre; 10.000 acres at 1.500 t/acre) and one BLOCK-basis contract with the default 10.0 pct tolerance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
