      - name: kit_must_be_ready_before_a_run_is_created
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 80]
          - errors[ERR_KIT_NOT_READY]
        excluded_because:
          difficulty_instance: run_creation_blocked_by_the_kit_already_deployed_elsewhere
          rationale: |
            The §1.8 instance already drives this gate from the interesting direction: a kit that is
            DEPLOYED on a live run in another city, so the refusal proves the gate reads the kit's
            live status rather than its existence. A §1.9 restatement would use the same endpoint,
            the same error id and a weaker premise.

      - name: guest_must_be_active_before_an_order_is_created
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 80]
          - errors[ERR_GUEST_RESTRICTED]
        excluded_because:
          difficulty_instance: order_creation_blocked_by_the_guests_no_show_restriction
          rationale: |
            That §1.8 instance reaches RESTRICTED the only way the model allows - by accumulating
            no-show strikes to the cap - and then shows both the refusal and the reinstatement that
            lifts it. Restating the gate here would add no premise the difficulty instance lacks.

      - name: staff_member_must_be_cleared_before_a_shift_is_scheduled
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 80]
          - errors[ERR_STAFF_NOT_CLEARED]
        excluded_because:
          difficulty_instance: shift_scheduling_blocked_by_the_members_clearance_state
          rationale: |
            The §1.8 instance walks the member through CANDIDATE, TRAINING, CLEARED and SUSPENDED and
            re-attempts the same shift at each stop, which subsumes any single-shot §1.9 probe of the
            same error id.

      - name: shift_geometry_rules_reject_overlaps_and_over_long_shifts
        claim_type: aggregate_validation
        grounds:
          - validations[priority 110]
          - errors[ERR_SHIFT_OVERLAP]
          - errors[ERR_SHIFT_TOO_LONG]
        excluded_because:
          difficulty_instance: staff_member_closed_interval_occupation_across_overlap_shapes
          rationale: |
            Overlap geometry is that instance's entire subject - identical windows, containment,
            partial overlap, exact abutment and a gap inside the rest buffer - and the companion
            §1.8 instance shift_rest_buffer_and_length_edges_at_thirty_and_six_hundred_minutes pins
            the 30-minute buffer and the 600-minute ceiling at their exact edges. A §1.9 instance
            could only re-run a subset of those shapes.

      - name: overlapping_released_windows_may_not_exceed_run_capacity
        claim_type: aggregate_validation
        grounds:
          - validations[priority 110]
          - errors[ERR_SLOT_OVERLAP_CAPACITY]
        excluded_because:
          difficulty_instance: slot_half_open_aggregate_admission_load_on_one_run
          rationale: |
            The §1.8 instance already tests the half-open overlap convention (a window starting
            exactly when another ends does NOT overlap), the inclusion of DRAFT and SUSPENDED peers
            in the sum, and the boundary where the aggregate exactly equals effective_capacity. The
            aggregate_validation instance above deliberately covers the orthogonal aggregate - seats
            within ONE window - so the two do not overlap in evidence.

