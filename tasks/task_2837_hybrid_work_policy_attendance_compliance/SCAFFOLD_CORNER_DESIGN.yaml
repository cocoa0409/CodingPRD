# §1.9 Scaffold Corner Design — Hybrid Work Policy & Attendance Compliance (task 2837)
#
# Breadth probe. The nine `section:` values below are the nine sections of
# references/claim-extraction-guide.md, walked row by row against this scaffold's
# §1.1-§1.7. Corners already asserted by a named §1.8 instance appear as
# `excluded_because:` stubs with no test_recipe.
#
# Shared conventions for every test_recipe in this file
# ----------------------------------------------------
# * The logical clock is pinned with POST /_clock/set_current_utc before anything
#   else. Unless an instance says otherwise it sits at 2026-09-01T09:00:00Z, which
#   is inside ISO week 2026-W36.
# * ISO Mondays used here: W36 = 2026-08-31, W37 = 2026-09-07, W38 = 2026-09-14,
#   W39 = 2026-09-21, W40 = 2026-09-28, W41 = 2026-10-05, W42 = 2026-10-12,
#   W43 = 2026-10-19.
# * Acting users: wpo-1 (WorkplaceProgramOffice), hrbp-1 (HRBusinessPartner),
#   mgr-1 / mgr-2 (PeopleManager), acc-1 (AccommodationSpecialist),
#   aud-1 (ComplianceAuditor), sys-1 (SystemIntegration). An Employee-role caller
#   always sends its own Employee id as X-User-ID.
# * THE STANDARD BREACH FIXTURE, reused verbatim by many instances below:
#     cycle days_in_office_floor 2, badge_weight 0.60, network_weight 0.40,
#     collaboration_target_score 70.00, equity_variance_threshold_pct 20.00;
#     team T-A expected_days 3, headcount_planned 12, corroboration false
#       -> expected_daily_attendance ceil(12*3/5) = 8, base_entitlement 8,
#          tier 0.20 (base <= 10), buffer_seats_entitled ceil(1.6) = 2,
#          entitled_seats 10;
#     employee E-1001 with NO classification, so current_eligibility_class is the
#       ONSITE_REQUIRED policy default and required_days is 5;
#     AttendanceWeek 2026-W37 with three 480-minute BADGE signals on 2026-09-08,
#       2026-09-09 and 2026-09-10, finalized
#       -> credited_days 3, relief 0, shortfall_days 2,
#          non_compliance_pressure round_half_up(2 * 1.5 + 1 * 1.0, 2) = 4.00,
#          compliance_state BREACH, one EscalationCase at WRITTEN_WARNING,
#          Team.escalated_headcount 1, Team.formal_action_count 1,
#          PolicyCycle.formal_action_total 1, aggregate_compliance_rate 0.00.
# * Every money figure is integer cents; every percentage and pressure literal is
#   Decimal with ROUND_HALF_UP at 2 decimal places, pre-computed here.
# * Unknown-id probes use RFC-4122-shaped v4 UUIDs in the 00000000-0000-4000-8000-*
#   family; none of them is ever created by any chain in this file.

scaffold_corner_design:

  - section: entities
    instances:

      - name: policy_cycle_creation_returns_declared_fields_and_system_defaults
        claim_type: creation
        grounds:
          - entities.PolicyCycle
          - endpoints[POST /policy-cycles]
        distinguishing_aspect: "A cycle created with only the eight declared input fields comes back with posture OPEN and every computed counter at its zero value; nothing is left null and nothing is echoed from a field the client never sent."
        test_recipe:
          setup:
            - "Empty database. The logical clock is pinned first."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
          trigger:
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CRN1", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
              captures: { cyc_id: $.data.id }
          assert:
            - "HTTP 201; the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == 'object'"
            - "data.cycle_label == 'FY27-CRN1', effective_from == '2026-09-01', effective_to == '2026-12-31', days_in_office_floor == 2, badge_weight == 0.60, network_weight == 0.40, collaboration_target_score == 70.00, equity_variance_threshold_pct == 20.00"
            - "data.posture == 'OPEN' (the system default), enrolled_team_count == 0, aggregate_compliance_rate == 0.00, formal_action_total == 0"
            - "data.id is a UUID, data.version == 1, and created_at == updated_at == '2026-09-01T09:00:00Z' (the logical clock, not wall time)"

      - name: team_and_employee_retrieval_returns_the_stored_row_with_derived_entitlement
        claim_type: retrieval
        grounds:
          - endpoints[GET /teams/{team_id}]
          - endpoints[GET /employees/{employee_id}]
          - calculations.team_seat_entitlement
        distinguishing_aspect: "A single GET is enough to observe that the four entitlement fields were derived at create time, and that an employee with no classification already reads back as ONSITE_REQUIRED / COMPLIANT rather than as null."
        test_recipe:
          setup:
            - "The standard breach fixture up to and including the employee, with no AttendanceWeek yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CRN2", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T-A", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t_a: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t_a}", employee_number: "E-1001", work_email: "e1001@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_A", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e1_id: $.data.id }
          trigger:
            - call: "GET /teams/${t_a}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
            - call: "GET /employees/${e1_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
            - call: "GET /policy-cycles/${cyc_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
          assert:
            - "Team read: expected_days_in_office_per_week == 3, core_collaboration_days == ['TUE','WED','THU'], headcount_planned == 12, signal_corroboration_required == false"
            - "Team read: expected_daily_attendance == 8 (ceil(12 * 3 / 5)), base_entitlement == 8, buffer_seats_entitled == 2 (ceil(8 * 0.20)), entitled_seats == 10"
            - "Team read: escalated_headcount == 0 and formal_action_count == 0"
            - "Employee read: status == 'ACTIVE', current_eligibility_class == 'ONSITE_REQUIRED', cumulative_shortfall_days == 0, consecutive_breach_weeks == 0, approved_relief_days_total == 0, non_compliance_pressure == 0.00, compliance_state == 'COMPLIANT', escalation_stage == 'NONE'"
            - "PolicyCycle read: enrolled_team_count == 1 (the team create bumped it) while formal_action_total == 0"

      - name: attendance_week_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /attendance-weeks]
          - response_envelope.pagination_fields
        distinguishing_aspect: "limit/offset are honoured together with the employee_id filter, has_more flips exactly once, and total_count reports the filtered population rather than the page size."
        test_recipe:
          setup:
            - "The standard breach fixture up to the employee, plus three OPEN AttendanceWeeks 2026-W37, 2026-W38 and 2026-W39, and a second employee E-1002 with one week 2026-W37 that must never appear in the filtered page."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CRN3", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T-A", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t_a: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t_a}", employee_number: "E-1001", work_email: "e1001@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_A", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e1_id: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t_a}", employee_number: "E-1002", work_email: "e1002@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-05-06", demographic_band: "BAND_B", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e2_id: $.data.id }
            - call: "POST /attendance-weeks"
              payload: { employee_id: "${e1_id}", iso_week: "2026-W37", week_start_date: "2026-09-07" }
              as: SystemIntegration
              as_user_id: "sys-1"
            - call: "POST /attendance-weeks"
              payload: { employee_id: "${e1_id}", iso_week: "2026-W38", week_start_date: "2026-09-14" }
              as: SystemIntegration
              as_user_id: "sys-1"
            - call: "POST /attendance-weeks"
              payload: { employee_id: "${e1_id}", iso_week: "2026-W39", week_start_date: "2026-09-21" }
              as: SystemIntegration
              as_user_id: "sys-1"
            - call: "POST /attendance-weeks"
              payload: { employee_id: "${e2_id}", iso_week: "2026-W37", week_start_date: "2026-09-07" }
              as: SystemIntegration
              as_user_id: "sys-1"
          trigger:
            - call: "GET /attendance-weeks?employee_id=${e1_id}&limit=2&offset=0"
              payload: { employee_id: "${e1_id}", limit: 2, offset: 0 }
              as: ComplianceAuditor
              as_user_id: "aud-1"
            - call: "GET /attendance-weeks?employee_id=${e1_id}&limit=2&offset=2"
              payload: { employee_id: "${e1_id}", limit: 2, offset: 2 }
              as: ComplianceAuditor
              as_user_id: "aud-1"
            - call: "GET /attendance-weeks?employee_id=${e1_id}&iso_week=2026-W38"
              payload: { employee_id: "${e1_id}", iso_week: "2026-W38" }
              as: ComplianceAuditor
              as_user_id: "aud-1"
            - call: "GET /attendance-weeks?employee_id=${e1_id}&limit=0"
              payload: { employee_id: "${e1_id}", limit: 0 }
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "Page 1: response_type == 'array', 2 rows, meta pagination reports limit 2, offset 0, total_count 3, has_more true"
            - "Page 2: 1 row, limit 2, offset 2, total_count 3, has_more false"
            - "No page contains the E-1002 week: the employee_id filter is applied before pagination, so total_count is 3 and not 4"
            - "The iso_week filter returns exactly 1 row whose iso_week == '2026-W38' and total_count == 1"
            - "limit=0 returns HTTP 422 with error id ERR_INVALID_REQUEST because the declared pagination minimum is 1"

      - name: every_entity_lookup_with_an_unknown_uuid_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_POLICY_CYCLE_NOT_FOUND]
          - errors[ERR_TEAM_NOT_FOUND]
          - errors[ERR_EMPLOYEE_NOT_FOUND]
          - errors[ERR_CLASSIFICATION_NOT_FOUND]
          - errors[ERR_ATTENDANCE_WEEK_NOT_FOUND]
          - errors[ERR_COMPLIANCE_SIGNAL_NOT_FOUND]
          - errors[ERR_EXCEPTION_REQUEST_NOT_FOUND]
          - errors[ERR_RELOCATION_REQUEST_NOT_FOUND]
          - errors[ERR_NEIGHBORHOOD_NOT_FOUND]
          - errors[ERR_SEAT_ALLOCATION_NOT_FOUND]
          - errors[ERR_DESK_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_ESCALATION_CASE_NOT_FOUND]
          - errors[ERR_RECALIBRATION_REVIEW_NOT_FOUND]
        distinguishing_aspect: "Each of the thirteen addressable entities reports its OWN 404 error id; a generic ERR_NOT_FOUND or a 404 for the wrong entity fails the claim. The database is deliberately empty so nothing can accidentally resolve."
        test_recipe:
          setup:
            - "Empty database except for the pinned clock. None of the probed UUIDs is ever created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
          trigger:
            - call: "GET /policy-cycles/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { e_cycle: "$.data.error_id" }
            - call: "GET /teams/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { e_team: "$.data.error_id" }
            - call: "GET /employees/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { e_emp: "$.data.error_id" }
            - call: "GET /eligibility-classifications/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { e_cls: "$.data.error_id" }
            - call: "GET /attendance-weeks/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { e_week: "$.data.error_id" }
            - call: "GET /compliance-signals/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { e_sig: "$.data.error_id" }
            - call: "GET /exception-requests/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { e_exc: "$.data.error_id" }
            - call: "GET /remote-location-requests/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { e_rel: "$.data.error_id" }
            - call: "GET /neighborhoods/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { e_nbh: "$.data.error_id" }
            - call: "GET /seat-allocations/00000000-0000-4000-8000-00000000000a"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { e_alloc: "$.data.error_id" }
            - call: "GET /desk-assignments/00000000-0000-4000-8000-00000000000b"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { e_desk: "$.data.error_id" }
            - call: "GET /escalation-cases/00000000-0000-4000-8000-00000000000c"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { e_case: "$.data.error_id" }
            - call: "GET /recalibration-reviews/00000000-0000-4000-8000-00000000000d"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { e_rev: "$.data.error_id" }
          assert:
            - "All thirteen calls return HTTP 404 with response_type == 'error'"
            - "The error ids are, in call order: ERR_POLICY_CYCLE_NOT_FOUND, ERR_TEAM_NOT_FOUND, ERR_EMPLOYEE_NOT_FOUND, ERR_CLASSIFICATION_NOT_FOUND, ERR_ATTENDANCE_WEEK_NOT_FOUND, ERR_COMPLIANCE_SIGNAL_NOT_FOUND, ERR_EXCEPTION_REQUEST_NOT_FOUND, ERR_RELOCATION_REQUEST_NOT_FOUND, ERR_NEIGHBORHOOD_NOT_FOUND, ERR_SEAT_ALLOCATION_NOT_FOUND, ERR_DESK_ASSIGNMENT_NOT_FOUND, ERR_ESCALATION_CASE_NOT_FOUND, ERR_RECALIBRATION_REVIEW_NOT_FOUND"
            - "Every response body carries data.error_id and data.message and nothing else under data"

      - name: create_calls_missing_required_fields_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=30, ERR_INVALID_REQUEST]
        distinguishing_aspect: "Every field declared `source: input` with no `default` is genuinely required on its create endpoint: omitting exactly one of them is a 422, and the row is not persisted, so the follow-up list is empty."
        test_recipe:
          setup:
            - "A cycle and a team exist so the omissions below are the ONLY defect in each payload."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CRN4", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T-A", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t_a: $.data.id }
          trigger:
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CRN5", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00 }
              as: WorkplaceProgramOffice
              captures: { e1: "$.data.error_id" }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T-B", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE"], signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { e2: "$.data.error_id" }
            - call: "POST /employees"
              payload: { team_id: "${t_a}", employee_number: "E-9001", work_email: "e9001@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e3: "$.data.error_id" }
            - call: "GET /teams?policy_cycle_id=${cyc_id}"
              payload: { policy_cycle_id: "${cyc_id}" }
              as: WorkplaceProgramOffice
            - call: "GET /employees?team_id=${t_a}"
              payload: { team_id: "${t_a}" }
              as: WorkplaceProgramOffice
          assert:
            - "Call 1 returns HTTP 422 ERR_INVALID_REQUEST: equity_variance_threshold_pct is a required input with no default"
            - "Call 2 returns HTTP 422 ERR_INVALID_REQUEST: headcount_planned is required, while signal_corroboration_required (which HAS a default) was supplied and is irrelevant"
            - "Call 3 returns HTTP 422 ERR_INVALID_REQUEST: demographic_band is required, whereas the omitted disability_accommodation_on_file would have defaulted to false"
            - "GET /teams?policy_cycle_id returns total_count 1 (only T-A) and GET /employees?team_id returns total_count 0 - no rejected payload was partially persisted"

      - name: employee_optional_input_omitted_falls_back_to_declared_default
        claim_type: defaults
        grounds:
          - entities.Employee.fields.disability_accommodation_on_file
          - entities.Team.fields.signal_corroboration_required
        distinguishing_aspect: "The two boolean inputs that carry `default: false` may be omitted entirely, and the stored row reads false rather than null; supplying true on the employee flips the downstream interactive-process computation, proving the field was really read."
        test_recipe:
          setup:
            - "A cycle exists. One team is created WITHOUT signal_corroboration_required and one employee WITHOUT disability_accommodation_on_file; a second employee sets the flag to true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CRN6", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T-A", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12 }
              as: WorkplaceProgramOffice
              captures: { t_a: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t_a}", employee_number: "E-1001", work_email: "e1001@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_A", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e1_id: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t_a}", employee_number: "E-1002", work_email: "e1002@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-05-06", demographic_band: "BAND_B", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: true }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e2_id: $.data.id }
            - call: "POST /exception-requests"
              payload: { employee_id: "${e1_id}", category: "CAREGIVING", requested_relief_days: 1, start_date: "2026-09-07", end_date: "2026-09-11", rationale: "school pickup on Wednesdays" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { req1: $.data.id }
            - call: "POST /exception-requests"
              payload: { employee_id: "${e2_id}", category: "CAREGIVING", requested_relief_days: 1, start_date: "2026-09-07", end_date: "2026-09-11", rationale: "school pickup on Wednesdays" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { req2: $.data.id }
          assert:
            - "Team.${t_a}.signal_corroboration_required == false and, because of it, any week finalized for this team reports variant_applied == 'SIGNAL_UNION'"
            - "Employee.${e1_id}.disability_accommodation_on_file == false, and ExceptionRequest.${req1}.interactive_process_required == false because CAREGIVING is not an inherently interactive category"
