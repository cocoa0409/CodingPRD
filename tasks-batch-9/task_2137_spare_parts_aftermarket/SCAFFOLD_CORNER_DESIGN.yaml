  # ==========================================================================
  - section: cross_cutting_layers
    instances:

      - name: occ_stale_part_version_rejects_second_campaign_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[ltb-campaign-create-stale-part]
          - errors[ERR_STALE_PART_VERSION]
        distinguishing_aspect: "The first campaign create advances Part.version, so a second create still carrying the originally observed version answers HTTP 412 ERR_STALE_PART_VERSION and the first campaign is NOT cancelled."
        test_recipe:
          setup:
            - "part OCC-1 in PHASE_OUT with a CURRENT 12-month INSTALLED_BASE_RATE forecast of 0 units"
            - "the Part.version observed once before any campaign exists"
          setup_api_calls:
            - call: "POST /aftermarket/parts"
              payload: { part_number: "OCC-1", description: "OCC part probe", unit_cost_cents: 100, lead_time_days: 5, weight_kg: 0.1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_id: $.data.id }
            - call: "POST /aftermarket/parts/${p_id}/forecasts"
              payload: { horizon_months: 12, method: "INSTALLED_BASE_RATE" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/parts/${p_id}/phase-out"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "GET /aftermarket/parts/${p_id}"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_v: $.data.version }
            - call: "POST /aftermarket/last-time-buy-campaigns"
              payload: { part_id: "${p_id}", method: "FLAT_RATE", coverage_years: 3, ltb_window_start: "2026-09-01T00:00:00Z", ltb_window_end: "2026-10-01T00:00:00Z", expected_part_version: "${p_v}" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /aftermarket/last-time-buy-campaigns"
              payload: { part_id: "${p_id}", method: "DEMAND_DECAY", coverage_years: 4, ltb_window_start: "2026-09-01T00:00:00Z", ltb_window_end: "2026-10-01T00:00:00Z", expected_part_version: "${p_v}" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 412 and data.error_id == ERR_STALE_PART_VERSION"
            - "LastTimeBuyCampaign.${c1_id}.status == DRAFT (the stale create did not supersede it)"
            - "GET /aftermarket/last-time-buy-campaigns?part_id=${p_id} returns total_count == 1"

      - name: occ_stale_campaign_version_rejects_second_allocation_request
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[allocation-request-create-stale-campaign]
          - errors[ERR_STALE_CAMPAIGN_VERSION]
        distinguishing_aspect: "The first allocation request advances LastTimeBuyCampaign.version, so the same dealer's second create carrying the originally observed version answers HTTP 412 ERR_STALE_CAMPAIGN_VERSION and the first request stays PENDING instead of being superseded."
        test_recipe:
          setup:
            - "part OCC-2 in PHASE_OUT with a CURRENT 12-month INSTALLED_BASE_RATE forecast of 0 units"
            - "a GOLD dealer with credit_hold false"
            - "a campaign APPROVED with approved_qty 50, whose version was observed once before any request existed"
          setup_api_calls:
            - call: "POST /aftermarket/dealers"
              payload: { dealer_code: "D-OCC2", tier: "GOLD", region: "NA", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { d_id: $.data.id }
            - call: "POST /aftermarket/parts"
              payload: { part_number: "OCC-2", description: "OCC campaign probe", unit_cost_cents: 100, lead_time_days: 5, weight_kg: 0.1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_id: $.data.id }
            - call: "POST /aftermarket/parts/${p_id}/forecasts"
              payload: { horizon_months: 12, method: "INSTALLED_BASE_RATE" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/parts/${p_id}/phase-out"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "GET /aftermarket/parts/${p_id}"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_v: $.data.version }
            - call: "POST /aftermarket/last-time-buy-campaigns"
              payload: { part_id: "${p_id}", method: "FLAT_RATE", coverage_years: 3, ltb_window_start: "2026-09-01T00:00:00Z", ltb_window_end: "2026-10-01T00:00:00Z", expected_part_version: "${p_v}" }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { c_id: $.data.id }
            - call: "POST /aftermarket/last-time-buy-campaigns/${c_id}/submit"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/last-time-buy-campaigns/${c_id}/approve"
              payload: { approved_qty: 50 }
              as: InventoryController
              as_user_id: "ctrl-1"
            - call: "GET /aftermarket/last-time-buy-campaigns/${c_id}"
              payload: {}
              as: InventoryController
              as_user_id: "ctrl-1"
              captures: { c_v: $.data.version }
            - call: "POST /aftermarket/allocation-requests"
              payload: { campaign_id: "${c_id}", dealer_id: "${d_id}", requested_units: 20, expected_campaign_version: "${c_v}" }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { ar1_id: $.data.id }
          trigger:
            - call: "POST /aftermarket/allocation-requests"
              payload: { campaign_id: "${c_id}", dealer_id: "${d_id}", requested_units: 30, expected_campaign_version: "${c_v}" }
              as: DealerUser
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 412 and data.error_id == ERR_STALE_CAMPAIGN_VERSION"
            - "AllocationRequest.${ar1_id}.status == PENDING and requested_units == 20"
            - "GET /aftermarket/allocation-requests?campaign_id=${c_id} returns total_count == 1"

      - name: campaign_create_supersedes_the_prior_draft_on_the_same_part
        claim_type: optimistic_concurrency
        grounds:
          - state_machines.LastTimeBuyCampaign.DRAFT_to_CANCELLED
        excluded_because:
          difficulty_instance: dual_variant_calc / ltb_decay_vs_flat_quantity_divergence_on_campaign
          rationale: "That instance creates a second campaign with a freshly read Part.version and asserts the first campaign becomes CANCELLED — the OCC happy path."

      - name: version_increments_by_one_on_every_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Part.fields.on_hand_units
          - entities.Part.fields.available_units
        distinguishing_aspect: "Part.version reads 1 after create, 2 after phase-out and 3 after reinstate, incrementing by exactly one per mutation, and available_units stays the derived on_hand_units minus allocated_units at every step."
        test_recipe:
          setup:
            - "one part in lifecycle_state ACTIVE"
          setup_api_calls:
            - call: "POST /aftermarket/parts"
              payload: { part_number: "VER-1", description: "Version probe", unit_cost_cents: 100, lead_time_days: 5, weight_kg: 0.1 }
              as: AftermarketPlanner
              as_user_id: "planner-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /aftermarket/parts/${p_id}/phase-out"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
            - call: "POST /aftermarket/parts/${p_id}/reinstate"
              payload: {}
              as: AftermarketPlanner
              as_user_id: "planner-1"
          assert:
            - "Part.${p_id}.version == 1 immediately after create"
            - "Part.${p_id}.version == 2 after phase-out and lifecycle_state == PHASE_OUT"
            - "Part.${p_id}.version == 3 after reinstate and lifecycle_state == ACTIVE"
            - "Part.${p_id}.available_units == 0 == on_hand_units - allocated_units at every step"
            - "Part.${p_id}.updated_at is refreshed on each mutation while created_at is unchanged"

  # ==========================================================================
  - section: consistency_model
    instances:

      - name: full_cascade_is_visible_in_the_triggering_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        excluded_because:
          difficulty_instance: transitive_cascade / ltb_approve_cascades_lifecycle_then_price_then_open_line_requote
          rationale: "That instance asserts all four cascade hops as of the approve response, with no re-read delay anywhere in the chain."

      - name: auto_replenishment_order_exists_immediately_after_consume
        claim_type: immediate
