  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cesd_reconcile_requires_route_dispatched
        grounds:
          - state_machines.RestockVisit.DRAFT_to_RECONCILED
          - validations[priority=6]
          - errors[ERR_ROUTE_NOT_DISPATCHED]
        distinguishing_aspect: |
          Entity pair RestockVisit -> RestockRoute: a visit's DRAFT->RECONCILED transition is gated on
          the parent route's status being DISPATCHED. A DRAFT visit opened against a stop whose route
          is still DRAFT (never dispatched) is rejected at reconcile with ERR_ROUTE_NOT_DISPATCHED.
        test_recipe:
          setup:
            - "A DRAFT route (never dispatched) with one stop on a machine that has one slot."
            - "A DRAFT visit opened for that stop; reconcile is then attempted while the route is still DRAFT."
          setup_api_calls:
            - call: "POST /operations/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-07T00:00:00Z" }
              as: FieldOps
            - call: "POST /operations/host-sites"
              payload: { name: "Dep Host", contact_email: "dep@x.com" }
              as: FieldOps
              captures: { host_id: $.data.id }
            - call: "POST /operations/products"
              payload: { sku: "DEP", name: "Dep Item", category: "SNACK", unit_cost_cents: 30, shelf_life_days: 0 }
              as: FieldOps
              captures: { prod_id: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${host_id}", asset_tag: "M-12", machine_type: "SNACK_VENDOR" }
              as: FieldOps
              captures: { mach_id: $.data.id, mach_v0: $.data.version }
            - call: "POST /operations/machines/${mach_id}/slots"
              payload: { product_id: "${prod_id}", slot_code: "K1", capacity: 10, par_level: 10, price_cents: 100 }
              as: FieldOps
              captures: { slot_id: $.data.id }
            - call: "POST /operations/drivers"
              payload: { full_name: "Dep Drv", employee_code: "EMP12" }
              as: FieldOps
              captures: { drv_id: $.data.id }
            - call: "POST /operations/routes"
              payload: { driver_id: "${drv_id}", service_date: "2026-06-07T00:00:00Z" }
              as: FieldOps
              captures: { route_id: $.data.id }
            - call: "POST /operations/routes/${route_id}/stops"
              payload: { machine_id: "${mach_id}", window_start_min: 480, window_end_min: 540 }
              as: FieldOps
              captures: { stop_id: $.data.id }
          trigger:
            - call: "POST /operations/restock-visits"
              payload: { route_stop_id: "${stop_id}", counted_lines: [ { slot_id: "${slot_id}", physical_count: 0, refill_units: 10 } ], expected_machine_version: "${mach_v0}" }
              as: RouteDriver
              as_user_id: "${drv_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /operations/restock-visits/${visit_id}/reconcile"
              payload: { expected_machine_version: "${mach_v0}" }
              as: RouteDriver
              as_user_id: "${drv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the reconcile call returns response status == 409"
            - "data.error_id == ERR_ROUTE_NOT_DISPATCHED (route never dispatched -> stop not KITTED -> visit reconcile blocked on parent route state)"

      - name: cesd_sale_requires_machine_not_frozen
        grounds:
          - state_machines.Sale.SETTLED_to_VOID
          - validations[priority=7]
          - entities.Machine.fields.service_status
          - errors[ERR_MACHINE_FROZEN]
        distinguishing_aspect: |
          Different entity pair Sale -> Machine: a Sale creation is gated on Machine.service_status
          being IN_SERVICE; a blocking ServiceTicket flips the machine to FROZEN and the sale is
          rejected with ERR_MACHINE_FROZEN even though the slot is well stocked.
        test_recipe:
          setup:
            - "Machine stocked (slot on_hand 10) but FROZEN by a blocking COIN_MECH ticket."
          setup_api_calls:
