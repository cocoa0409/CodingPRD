scaffold_corner_design:
- section: entities
  instances:
  - name: worker_create_defaults_and_computed_fields
    claim_type: creation
    grounds:
    - entities.Worker
    - endpoints[POST /ssa/workers]
    distinguishing_aspect: 'A minimal create (no pension fields) yields defaults: status LIVING, pension 0, withdrawal_used false, plus server-computed
      fra_months 804, eligibility_year 2026, version 1, and a prefix-free UUID id.'
    test_recipe:
      setup:
      - No precondition state; empty database
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Defaults Worker
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wd1: $.data.id
          wd1_ver: $.data.version
      trigger:
      - call: GET /ssa/workers/${wd1}
        payload: {}
        as: ClaimsSpecialist
      assert:
      - 'Worker.${wd1}: status == LIVING, noncovered_pension_monthly_cents == 0, withdrawal_used == false'
      - fra_months == 804 and eligibility_year == 2026 (birth_year 1964 + 62)
      - version == 1; id is a bare UUID with no type prefix; created_at has three fractional digits
  - name: worker_create_missing_required_field_returns_400
    claim_type: required_fields
    grounds:
    - entities.Worker.fields.birth_year
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: birth_year is a required input with no default; omitting it fails request-shape validation (priority 4) with ERR_INVALID_REQUEST
      before anything else.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: POST /ssa/workers
        payload:
          full_name: No Birthyear
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          err: $.data.error_id
      assert:
      - Response is 400 with error_id == ERR_INVALID_REQUEST; no Worker is persisted
  - name: worker_get_nonexistent_returns_404
    claim_type: not_found
    grounds:
    - entities.Worker
    - errors[ERR_WORKER_NOT_FOUND]
    distinguishing_aspect: Reading a well-formed but unknown worker id returns 404 ERR_WORKER_NOT_FOUND.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: GET /ssa/workers/11111111-2222-4333-8444-555555555555
        payload: {}
        as: ClaimsSpecialist
        captures:
          err: $.data.error_id
      assert:
      - Response is 404 with error_id == ERR_WORKER_NOT_FOUND
  - name: wage_report_taxable_max_chronological_cap
    claim_type: computed_fields
    grounds:
    - entities.WageReport.fields.posted_amount_cents
    - entities.EarningsYear.fields.posted_earnings_cents
    - calculations.earnings_indexation
    distinguishing_aspect: The taxable maximum for 2023 is 23100000 cents; two reports (20000000 then 5000000) credit in created_at order, so
      the second posts only the 3100000 headroom and the year caps at exactly 23100000.
    test_recipe:
      setup:
      - Worker wr1 exists; no prior 2023 reports
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Capped Worker
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wr1: $.data.id
          wr1_ver: $.data.version
      trigger:
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wr1}
          employer_name: Acme Corp
          tax_year: 2023
          amount_cents: 20000000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wr1}
          employer_name: Acme Corp
          tax_year: 2023
          amount_cents: 5000000
        as: Employer
      - call: GET /ssa/workers/${wr1}/earnings-years
        payload: {}
        as: ClaimsSpecialist
      assert:
      - First WageReport.posted_amount_cents == 20000000
      - Second WageReport.posted_amount_cents == 3100000 (headroom under the cap, created_at order)
      - EarningsYear(${wr1}, 2023).posted_earnings_cents == 23100000 == TAXABLE_MAX_CENTS(2023)
  - name: wage_report_immutable_common_fields_absent
    claim_type: immutability
    grounds:
    - entities.WageReport
    distinguishing_aspect: 'WageReport is an append-only event (common_fields false): its response carries id and created_at but no version and
      no updated_at, and no update endpoint exists.'
    test_recipe:
      setup:
      - Worker wr2 exists with one posted report
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Immutable Worker
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wr2: $.data.id
          wr2_ver: $.data.version
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wr2}
          employer_name: Acme Corp
          tax_year: 2023
          amount_cents: 1000000
        as: Employer
      trigger:
      - call: GET /ssa/workers/${wr2}/wage-reports
        payload: {}
        as: ClaimsSpecialist
      assert:
      - The single WageReport row exposes id, created_at, posted_amount_cents, status POSTED
      - The row has no version and no updated_at field
  - name: claim_create_auxiliary_requires_relationship
    claim_type: required_fields
    grounds:
    - entities.BenefitClaim.fields.relationship_id
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: 'relationship_id is conditionally required: a SPOUSAL claim without it fails with ERR_INVALID_REQUEST, and a RETIREMENT
      claim carrying one fails the same way (forbidden-when-RETIREMENT).'
    test_recipe:
      setup:
      - Worker wr3 exists
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Conditional Worker
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wr3: $.data.id
          wr3_ver: $.data.version
      trigger:
      - call: POST /ssa/claims
        payload:
          worker_id: ${wr3}
          claim_type: SPOUSAL
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${wr3}
        captures:
          err1: $.data.error_id
      - call: POST /ssa/workers
        payload:
          full_name: Rel Dummy
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wr4: $.data.id
      - call: POST /ssa/relationships
        payload:
          worker_id: ${wr3}
          spouse_worker_id: ${wr4}
          relationship_type: CURRENT_SPOUSE
          marriage_date: '2000-01-01'
        as: ClaimsSpecialist
        captures:
          relx: $.data.id
      - call: POST /ssa/claims
        payload:
          worker_id: ${wr3}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
          relationship_id: ${relx}
        as: Claimant
        as_user_id: ${wr3}
        captures:
          err2: $.data.error_id
      - call: GET /ssa/claims
        payload:
          worker_id: ${wr3}
        as: ClaimsSpecialist
      assert:
      - Both creates return 400 ERR_INVALID_REQUEST
      - A subsequent GET /ssa/claims filtered by worker_id ${wr3} returns an empty list
  - name: claims_list_pagination_defaults
    claim_type: listing
    grounds:
    - endpoints[GET /ssa/claims]
    - response_envelope
    distinguishing_aspect: List responses carry limit/offset/total_count/has_more with defaults limit=10, offset=0; an explicit limit=1 paginates
      and sets has_more.
    test_recipe:
      setup:
      - Two workers, one FILED claim each
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Page One
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wp1: $.data.id
          wp1_ver: $.data.version
      - call: POST /ssa/workers
        payload:
          full_name: Page Two
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wp2: $.data.id
          wp2_ver: $.data.version
      - call: POST /ssa/claims
        payload:
          worker_id: ${wp1}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${wp1}
        captures:
          cp1: $.data.id
      - call: POST /ssa/claims
        payload:
          worker_id: ${wp2}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${wp2}
        captures:
          cp2: $.data.id
      trigger:
      - call: GET /ssa/claims
        payload: {}
        as: ClaimsSpecialist
      - call: GET /ssa/claims
        payload:
          limit: 1
        as: ClaimsSpecialist
      assert:
      - 'Default list: total_count == 2, has_more == false, both claims present'
      - 'With limit=1: exactly 1 row, total_count == 2, has_more == true'
  - name: claims_list_filter_by_status
    claim_type: listing
    grounds:
    - endpoints[GET /ssa/claims]
    distinguishing_aspect: The status filter returns only matching claims across workers.
    test_recipe:
      setup:
      - Two workers; claim A stays FILED; claim B is DENIED
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Filter One
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wf1: $.data.id
          wf1_ver: $.data.version
      - call: POST /ssa/claims
        payload:
          worker_id: ${wf1}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${wf1}
        captures:
          cf1: $.data.id
      - call: POST /ssa/workers
        payload:
          full_name: Filter Two
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wf2: $.data.id
          wf2_ver: $.data.version
      - call: POST /ssa/claims
        payload:
          worker_id: ${wf2}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${wf2}
        captures:
          cf2: $.data.id
      - call: POST /ssa/claims/${cf2}/deny
        payload:
          denial_reason: not insured
        as: ClaimsSpecialist
        as_user_id: spec-1
      trigger:
      - call: GET /ssa/claims
        payload:
          status: DENIED
        as: ClaimsSpecialist
      assert:
      - Exactly one row returned and it is BenefitClaim.${cf2}
      - Filter status=FILED would return only ${cf1}
- section: state_machines
  instances:
  - name: initial_states_on_create
    claim_type: initial_state
    grounds:
    - state_machines.BenefitClaim
    - state_machines.CorrectionRequest
    - state_machines.Relationship
    - state_machines.OverpaymentCase
    - state_machines.PayeeCase
    distinguishing_aspect: 'Every stateful entity lands in its declared initial state at creation: claim FILED, correction PENDING_REVIEW, relationship
      ASSERTED, overpayment case NOTIFIED, payee case INVESTIGATING.'
    test_recipe:
      setup:
      - Worker wi with 3 earnings years and an ENTITLED claim ci1 (payee-case precondition); a second worker wi2
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Initial Worker
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wi: $.data.id
          wi_ver: $.data.version
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wi}
          employer_name: Acme Corp
          tax_year: 2021
          amount_cents: 1875000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wi}
          employer_name: Acme Corp
          tax_year: 2022
          amount_cents: 1900000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wi}
          employer_name: Acme Corp
          tax_year: 2023
          amount_cents: 1925000
        as: Employer
      - call: POST /ssa/claims
        payload:
          worker_id: ${wi}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${wi}
        captures:
          ci1: $.data.id
      - call: POST /ssa/claims/${ci1}/approve
        payload: {}
        as: ClaimsSpecialist
      - call: POST /ssa/workers
        payload:
          full_name: Initial Worker Two
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wi2: $.data.id
          wi2_ver: $.data.version
      trigger:
      - call: POST /ssa/claims
        payload:
          worker_id: ${wi2}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${wi2}
        captures:
          ci2: $.data.id
      - call: POST /ssa/correction-requests
        payload:
          worker_id: ${wi}
          tax_year: 2023
          claimed_earnings_cents: 1900000
          evidence_type: OTHER
        as: Claimant
        as_user_id: ${wi}
      - call: POST /ssa/workers
        payload:
          full_name: Init Spouse
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wis: $.data.id
      - call: POST /ssa/relationships
        payload:
          worker_id: ${wi}
          spouse_worker_id: ${wis}
          relationship_type: CURRENT_SPOUSE
          marriage_date: '2000-01-01'
        as: ClaimsSpecialist
      - call: POST /ssa/overpayment-cases
        payload:
          claim_id: ${ci1}
          amount_cents: 1000
          period_start_month: 2026-06
          period_end_month: 2026-06
          reason: SYSTEM_ERROR
        as: ClaimsSpecialist
      - call: POST /ssa/payee-cases
        payload:
          claim_id: ${ci1}
          payee_name: Init Payee
          determination_basis: physician letter
        as: ClaimsSpecialist
        as_user_id: spec-2
      assert:
      - New claim ${ci2}.status == FILED (on the second worker, so the one-active-claim constraint is untouched)
      - New correction status == PENDING_REVIEW; relationship status == ASSERTED
      - New overpayment case status == NOTIFIED; new payee case status == INVESTIGATING
  - name: claim_approve_twice_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.BenefitClaim
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: ENTITLED is not a from-state for approve; a second approve is rejected and nothing changes.
    test_recipe:
      setup:
      - Worker with an ENTITLED RETIREMENT claim
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Double Approve
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          w2a: $.data.id
          w2a_ver: $.data.version
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w2a}
          employer_name: Acme Corp
          tax_year: 2021
          amount_cents: 1875000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w2a}
          employer_name: Acme Corp
          tax_year: 2022
          amount_cents: 1900000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w2a}
          employer_name: Acme Corp
          tax_year: 2023
          amount_cents: 1925000
        as: Employer
      - call: POST /ssa/claims
        payload:
          worker_id: ${w2a}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${w2a}
        captures:
          c2a: $.data.id
      - call: POST /ssa/claims/${c2a}/approve
        payload: {}
        as: ClaimsSpecialist
      trigger:
      - call: POST /ssa/claims/${c2a}/approve
        payload: {}
        as: ClaimsSpecialist
        captures:
          err: $.data.error_id
      assert:
      - Response is 409 ERR_INVALID_STATE; BenefitClaim.${c2a}.status remains ENTITLED, monthly_benefit_cents still 8750
  - name: claim_resume_when_entitled_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.BenefitClaim.SUSPENDED_to_ENTITLED
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: resume is defined only from SUSPENDED; calling it on an ENTITLED claim is an invalid transition.
    test_recipe:
      setup:
      - Worker with an ENTITLED RETIREMENT claim (never suspended)
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Bad Resume
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          w2b: $.data.id
          w2b_ver: $.data.version
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w2b}
          employer_name: Acme Corp
          tax_year: 2021
          amount_cents: 1875000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w2b}
          employer_name: Acme Corp
          tax_year: 2022
          amount_cents: 1900000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w2b}
          employer_name: Acme Corp
          tax_year: 2023
          amount_cents: 1925000
        as: Employer
      - call: POST /ssa/claims
        payload:
          worker_id: ${w2b}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${w2b}
        captures:
          c2b: $.data.id
      - call: POST /ssa/claims/${c2b}/approve
        payload: {}
        as: ClaimsSpecialist
      trigger:
      - call: POST /ssa/claims/${c2b}/resume
        payload: {}
        as: Claimant
        as_user_id: ${w2b}
        captures:
          err: $.data.error_id
      assert:
      - Response is 409 ERR_INVALID_STATE; status remains ENTITLED; drc_months stays 0
  - name: claim_terminal_lockdown_after_withdraw_returns_409
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.BenefitClaim
    - errors[ERR_CLAIM_ALREADY_TERMINAL]
    distinguishing_aspect: 'WITHDRAWN is terminal: a later suspend attempt hits ERR_CLAIM_ALREADY_TERMINAL (state tier precedes the OCC check,
      so even a stale version does not change the error).'
    test_recipe:
      setup:
      - Worker with a claim approved at 2026-06 entitlement and immediately withdrawn (no payments; repaid 0)
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Terminal Worker
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          w2c: $.data.id
          w2c_ver: $.data.version
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w2c}
          employer_name: Acme Corp
          tax_year: 2021
          amount_cents: 1875000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w2c}
          employer_name: Acme Corp
          tax_year: 2022
          amount_cents: 1900000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w2c}
          employer_name: Acme Corp
          tax_year: 2023
          amount_cents: 1925000
        as: Employer
      - call: POST /ssa/claims
        payload:
          worker_id: ${w2c}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${w2c}
        captures:
          c2c: $.data.id
      - call: POST /ssa/claims/${c2c}/approve
        payload: {}
        as: ClaimsSpecialist
        captures:
          c2c_ver: $.data.version
      - call: POST /ssa/claims/${c2c}/withdraw
        payload:
          repaid_amount_cents: 0
        as: Claimant
        as_user_id: ${w2c}
      trigger:
      - call: POST /ssa/claims/${c2c}/suspend
        payload:
          expected_claim_version: ${c2c_ver}
        as: Claimant
        as_user_id: ${w2c}
        captures:
          err: $.data.error_id
      assert:
      - Response is 409 ERR_CLAIM_ALREADY_TERMINAL
      - BenefitClaim.${c2c}.status remains WITHDRAWN
  - name: correction_approve_twice_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.CorrectionRequest
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: APPROVED is terminal for corrections; a second approve is rejected.
    test_recipe:
      setup:
      - Worker with one 2023 report (posted 1000000) and an APPROVED correction to 1500000
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Correction Twice
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          w2d: $.data.id
          w2d_ver: $.data.version
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w2d}
          employer_name: Acme Corp
          tax_year: 2023
          amount_cents: 1000000
        as: Employer
      - call: POST /ssa/correction-requests
        payload:
          worker_id: ${w2d}
          tax_year: 2023
          claimed_earnings_cents: 1500000
          evidence_type: WAGE_STATEMENT
        as: Claimant
        as_user_id: ${w2d}
        captures:
          cor2: $.data.id
      - call: POST /ssa/correction-requests/${cor2}/approve
        payload: {}
        as: ClaimsSpecialist
      trigger:
      - call: POST /ssa/correction-requests/${cor2}/approve
        payload: {}
        as: ClaimsSpecialist
        captures:
          err: $.data.error_id
      assert:
      - Response is 409 ERR_INVALID_STATE
      - EarningsYear(${w2d}, 2023).posted_earnings_cents remains 1500000 (no double application)
  - name: claim_denial_reopen_cycle_restores_filed
    claim_type: valid_transition
    grounds:
    - state_machines.BenefitClaim.DENIED_to_FILED
    - validations[priority=8]
    distinguishing_aspect: The DENIED -> FILED reopen cycle works within 60 days with a different adjudicator, and the reopened claim can then
      be approved normally.
    test_recipe:
      setup:
      - Worker w2e (3 earnings years); claim denied by 'spec-1'; reopened by 'sen-2' at the same clock instant
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Reopen Worker
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          w2e: $.data.id
          w2e_ver: $.data.version
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w2e}
          employer_name: Acme Corp
          tax_year: 2021
          amount_cents: 1875000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w2e}
          employer_name: Acme Corp
          tax_year: 2022
          amount_cents: 1900000
        as: Employer
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${w2e}
          employer_name: Acme Corp
          tax_year: 2023
          amount_cents: 1925000
        as: Employer
      - call: POST /ssa/claims
        payload:
          worker_id: ${w2e}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${w2e}
        captures:
          c2e: $.data.id
      - call: POST /ssa/claims/${c2e}/deny
        payload:
          denial_reason: insufficient proof of age
        as: ClaimsSpecialist
        as_user_id: spec-1
      trigger:
      - call: POST /ssa/claims/${c2e}/reopen
        payload:
          reopen_reason: birth certificate produced
        as: SeniorAdjudicator
        as_user_id: sen-2
      - call: POST /ssa/claims/${c2e}/approve
        payload: {}
        as: ClaimsSpecialist
      assert:
      - 'After reopen: status == FILED, denial_reason cleared, decided_by cleared'
      - 'Subsequent approve succeeds: status == ENTITLED, monthly_benefit_cents == 8750'
  - name: relationship_verify_after_reject_returns_invalid_state
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Relationship
    - errors[ERR_INVALID_STATE]
