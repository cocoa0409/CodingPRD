  # --- Permit reverse-reachability for coi_id / lottery_round_id ---
  - method: GET
    path: "/permits"
    description: "List permits, filterable by coi/lottery_round/facility/patron/league (reverse-reachability for Permit FKs)"
    roles: [RecCoordinator, Patron, FinanceClerk]
    code: 200
    input: ["coi_id?", "lottery_round_id?", "facility_id?", "patron_id?", "league_id?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []

  # --- Refund reverse-reachability for payment_id ---
  - method: GET
    path: "/refunds"
    description: "List refunds, filterable by payment/permit (reverse-reachability for Refund.payment_id)"
    roles: [FinanceClerk, RecCoordinator, Patron]
    code: 200
    input: ["payment_id?", "permit_id?", "limit?", "offset?"]
    output: Refund[]
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC clock (test-driving; gates temporal preconditions, expiry, lottery close)"
    roles: [RecCoordinator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["Sets the logical clock used by all temporal checks"]

  - method: POST
    path: "/_ops/sweep"
    description: "Run the ops sweep at the current clock (expire COIs, recompute patron standing)"
    roles: [RecCoordinator]
    code: 200
    input: []
    output: { expired_coi_count: integer, recomputed_patron_count: integer }
    side_effects: ["ACTIVE COIs with expiry_date <= clock -> EXPIRED; patron standing recomputed from no_show_strikes"]

  - method: POST
    path: "/_inject/no_show_strikes"
    description: "Test-driving: set a patron's no_show_strikes directly and recompute standing (seeds a no-show history without running full grant/no-show cycles)"
    roles: [RecCoordinator]
    code: 200
    input: [patron_id, strikes]
    output: Patron
    side_effects: ["Patron.no_show_strikes = strikes; recompute Patron.standing via patron_standing"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Patron acting on a permit/COI/entry they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not resolve" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body, missing required field, or invalid enum/range value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_facility_version does not match Facility.version (OCC mismatch)" }
  - { id: ERR_PATRON_BARRED, http: 403, condition: "Patron.standing == BARRED on apply or grant" }
  - { id: ERR_PROBATION_PRIME_BLOCKED, http: 403, condition: "PROBATION patron grant on a prime-window permit" }
  - { id: ERR_COI_REQUIRED, http: 422, condition: "Facility requires COI but none ACTIVE on file at grant" }
  - { id: ERR_COI_INSUFFICIENT, http: 422, condition: "Presented COI coverage below minimum or expiry_date <= start_at" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "start_at >= end_at, or window not in the future at apply" }
  - { id: ERR_DOUBLE_BOOKING, http: 409, condition: "Grant/draw collides with an existing GRANTED permit's buffer-expanded window" }
  - { id: ERR_PAYMENT_REQUIRED, http: 422, condition: "No CAPTURED Payment covering final_fee_cents + deposit at grant" }
  - { id: ERR_LOTTERY_NOT_CLOSED, http: 409, condition: "Draw before closes_at, or with zero entries" }
  - { id: ERR_LOTTERY_NO_ENTRIES, http: 409, condition: "Draw on a round with entry_count == 0" }
  - { id: ERR_DUPLICATE_ENTRY, http: 409, condition: "Patron already has an ENTERED entry in this round" }
  - { id: ERR_PAGINATION_INVALID, http: 422, condition: "limit/offset out of allowed bounds" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RecCoordinator
    description: "Parks & Rec operations staff: runs grants/denials/completions, opens and draws lotteries, runs ops sweeps and the clock. Operational identity not tied to a persisted patron."
    identity: opaque
    exclusive_operations:
      - "POST /facilities — create facility"
      - "PATCH /facilities/{id} — close/reconfigure facility"
      - "POST /patrons/{id}/verify-residency — accept residency proof"
      - "POST /insurance-certificates/{id}/revoke — revoke COI"
      - "POST .../permits/{id}/grant — grant permit"
      - "POST .../permits/{id}/deny — deny permit"
      - "POST .../permits/{id}/complete — complete permit"
      - "POST .../permits/{id}/no-show — mark no-show"
      - "POST /lottery-rounds — open round"
      - "POST /lottery-rounds/{id}/draw — draw winner"
      - "POST /lottery-rounds/{id}/cancel — cancel round"
      - "POST /_clock/set_current_utc — set clock"
      - "POST /_ops/sweep — run ops sweep"
    shared_operations:
      - "POST /patrons — register patron (with Patron)"
      - "POST /facilities/{id}/permits — apply (with Patron)"
      - "POST .../permits/{id}/cancel — cancel permit (with Patron)"
      - "POST /leagues — create league (with Patron)"
      - "POST /leagues/{id}/cancel — cancel league (with Patron)"
      - "POST /insurance-certificates — upload COI (with Patron)"
      - "POST /lottery-rounds/{id}/entries — enter lottery (with Patron)"
      - "POST /lottery-entries/{id}/withdraw — withdraw entry (with Patron)"
      - "POST /permits/{id}/payments — capture payment (with FinanceClerk)"
      - "GET endpoints"

  - name: Patron
    description: "A registered patron acting on their own permits, COIs, league series, and lottery entries. X-User-ID equals a Patron.id."
    identity: "entity_backed:Patron"
    exclusive_operations: []
    shared_operations:
      - "POST /patrons — self-register (with RecCoordinator)"
      - "POST /facilities/{id}/permits — apply (with RecCoordinator)"
      - "POST .../permits/{id}/cancel — cancel own permit (with RecCoordinator)"
      - "POST /leagues — create league (with RecCoordinator)"
      - "POST /leagues/{id}/cancel — cancel own league (with RecCoordinator)"
      - "POST /insurance-certificates — upload own COI (with RecCoordinator)"
      - "POST /lottery-rounds/{id}/entries — enter lottery (with RecCoordinator)"
      - "POST /lottery-entries/{id}/withdraw — withdraw own entry (with RecCoordinator)"
      - "GET endpoints scoped to own resources"

  - name: FinanceClerk
    description: "Finance staff who capture payments and read the refund ledger. Operational identity not tied to a patron."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /permits/{id}/payments — capture payment (with RecCoordinator)"
      - "GET /permits/{id}/payments, GET /permits/{id}/refunds, GET /refunds — read ledger"
      - "GET facility/permit/patron reads"
