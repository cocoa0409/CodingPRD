# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Notary Commission & E-Notary Journal — Expert
# Breadth probe across claim-extraction-guide sections. Every error_id in §1.6
# is triggered here or in §1.8. excluded_because stubs cite §1.8 instances.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_jurisdiction_returns_201_with_fields
        claim_type: Creation
        grounds:
          - entities.Jurisdiction
          - endpoints
        distinguishing_aspect: "POST /jurisdictions with all required fields returns 201 and echoes state_code, bond_minimum_cents, commission_term_months; id/created_at system-minted."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { state_code: "CA", ron_allowed: true, bond_minimum_cents: 1500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 2000, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx: $.data.id }
          assert:
            - "response status code == 201"
            - "Jurisdiction.${jx}.state_code == CA"
            - "Jurisdiction.${jx}.commission_term_months == 48"
            - "Jurisdiction.${jx}.version == 1"

      - name: get_notary_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Notary
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /notaries/{id} with a non-existent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /notaries/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CommissionAuthority
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 404"
            - "trigger response error_id == ERR_NOT_FOUND"

      - name: create_notary_missing_required_email_returns_400
        claim_type: Required Fields
        grounds:
          - entities.Notary.fields.email
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /notaries omitting required email field returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Jurisdiction exists"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "NY", ron_allowed: true, bond_minimum_cents: 1500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 2000, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx: $.data.id }
          trigger:
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx}", full_name: "No Email" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 400"
            - "trigger response error_id == ERR_INVALID_REQUEST"

      - name: notary_enotary_requested_defaults_false
        claim_type: Defaults
        grounds:
          - entities.Notary.fields.enotary_requested
        distinguishing_aspect: "POST /notaries omitting enotary_requested applies default false; enotary_authorized stays false."
        test_recipe:
          setup: ["Jurisdiction exists"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "WA", ron_allowed: true, bond_minimum_cents: 1500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 2000, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx: $.data.id }
          trigger:
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx}", full_name: "Def Notary", email: "def@x.com" }
              as: Anonymous
              captures: { nota: $.data.id }
          assert:
            - "Notary.${nota}.enotary_requested == false"
            - "Notary.${nota}.enotary_authorized == false"
            - "Notary.${nota}.status == APPLIED"

      - name: notary_status_system_field_ignores_input
        claim_type: System Fields
        grounds:
          - entities.Notary.fields.status
          - entities.Notary.fields.risk_score
        distinguishing_aspect: "Client-supplied status/risk_score in POST /notaries are ignored; server forces status=APPLIED, risk_score=0."
        test_recipe:
          setup: ["Jurisdiction exists"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "OR", ron_allowed: true, bond_minimum_cents: 1500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 2000, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx: $.data.id }
          trigger:
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx}", full_name: "Sys Notary", email: "sys@x.com" }
              as: Anonymous
              captures: { nota: $.data.id }
          assert:
            - "Notary.${nota}.status == APPLIED"
            - "Notary.${nota}.risk_score == 0"
            - "Notary.${nota}.lifetime_fees_collected_cents == 0"

      - name: create_document_invalid_act_type_enum_returns_400
        claim_type: Type Constraints
        grounds:
          - entities.Document.fields.act_type
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /sessions/{id}/documents with act_type not in the enum set returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["ACTIVE enotary notary with a SCHEDULED session and one signer"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx: $.data.id }
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx}", full_name: "Enum N", email: "enum@x.com", enotary_requested: true }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond: $.data.id }
            - call: "POST /bonds/${bond}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /sessions"
              payload: { notary_id: "${nota}", scheduled_start_at: "2026-07-01T09:00:00Z", scheduled_end_at: "2026-07-01T10:00:00Z" }
              as: Notary
              as_user_id: "${nota}"
              captures: { sess: $.data.id }
            - call: "POST /sessions/${sess}/signers"
              payload: { full_name: "S Enum", kba_passed: true, credential_analysis_passed: true }
              as: Notary
              as_user_id: "${nota}"
              captures: { sgn: $.data.id }
          trigger:
            - call: "POST /sessions/${sess}/documents"
              payload: { signer_id: "${sgn}", act_type: "MARRIAGE", requested_fee_cents: 100 }
              as: Notary
              as_user_id: "${nota}"
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 400"
            - "trigger response error_id == ERR_INVALID_REQUEST"

      - name: create_session_end_before_start_returns_validation_422
        claim_type: Type Constraints
        grounds:
          - entities.Session.fields.scheduled_end_at
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /sessions with scheduled_end_at <= scheduled_start_at is a semantically invalid interval and returns ERR_VALIDATION 422 (distinct from a missing/mistyped field which is 400)."
        test_recipe:
          setup: ["ACTIVE enotary notary"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx: $.data.id }
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx}", full_name: "Bad Win N", email: "badwin@x.com", enotary_requested: true }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond: $.data.id }
            - call: "POST /bonds/${bond}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/activate"
              payload: {}
              as: CommissionAuthority
          trigger:
            - call: "POST /sessions"
              payload: { notary_id: "${nota}", scheduled_start_at: "2026-07-08T10:00:00Z", scheduled_end_at: "2026-07-08T09:00:00Z" }
              as: Notary
              as_user_id: "${nota}"
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 422"
            - "trigger response error_id == ERR_VALIDATION"

      - name: audit_event_is_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.AuditEvent
        distinguishing_aspect: "AuditEvent has common_fields:false — it carries id+created_at, no version, and there is no update/transition endpoint for it; records are append-only."
        test_recipe:
          setup: ["ACTIVE notary that has at least one AuditEvent (from commissioning)"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx: $.data.id }
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx}", full_name: "Audit N", email: "audit@x.com" }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond: $.data.id }
            - call: "POST /bonds/${bond}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
          trigger:
            - call: "GET /notaries/${nota}/audit-events"
              payload: {}
              as: CommissionAuthority
          assert:
            - "response status code == 200"
            - "GET /notaries/${nota}/audit-events returns at least one AuditEvent with action == NOTARY_COMMISSIONED"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: commission_already_commissioned_notary_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Notary.APPLIED_to_COMMISSIONED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Commissioning a notary already in COMMISSIONED state (not APPLIED) returns ERR_INVALID_STATE; no second commission stamp."
        test_recipe:
          setup: ["COMMISSIONED notary (commissioned once, not yet activated)"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx: $.data.id }
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx}", full_name: "Twice N", email: "twice@x.com" }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond: $.data.id }
            - call: "POST /bonds/${bond}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
          trigger:
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 409"
            - "trigger response error_id == ERR_INVALID_STATE"

      - name: revoked_notary_is_terminal_no_reinstate
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Notary
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "REVOKED is terminal: reinstating a REVOKED notary returns ERR_INVALID_STATE (no transition out of REVOKED)."
        test_recipe:
          setup: ["REVOKED notary"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx: $.data.id }
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx}", full_name: "Term N", email: "term@x.com" }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond: $.data.id }
            - call: "POST /bonds/${bond}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/revoke"
              payload: {}
              as: CommissionAuthority
          trigger:
            - call: "POST /notaries/${nota}/reinstate"
              payload: {}
              as: CommissionAuthority
              captures: { err: $.data.error_id }
          assert:
            - "Notary.${nota}.status == REVOKED"
            - "trigger response error_id == ERR_INVALID_STATE"

      - name: new_notary_initial_state_is_applied
        claim_type: initial_state
        grounds:
          - state_machines.Notary
          - entities.Notary.fields.status
        distinguishing_aspect: "A freshly registered notary starts in initial_state APPLIED with version 1."
        test_recipe:
          setup: ["Jurisdiction exists"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx: $.data.id }
          trigger:
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx}", full_name: "Init N", email: "init@x.com" }
              as: Anonymous
              captures: { nota: $.data.id }
          assert:
            - "Notary.${nota}.status == APPLIED"
            - "Notary.${nota}.version == 1"

      - name: amend_already_amended_entry_returns_entry_not_posted
        claim_type: idempotency
        grounds:
          - state_machines.JournalEntry.POSTED_to_AMENDED
          - "errors[ERR_ENTRY_NOT_POSTED]"
        distinguishing_aspect: "Amending an entry already in AMENDED status (the second amend on the same original) returns ERR_ENTRY_NOT_POSTED."
        test_recipe:
          setup: ["ACTIVE notary; one POSTED in-person entry already AMENDED once"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx: $.data.id }
            - call: "POST /jurisdictions/${jx}/fee-schedules"
              payload: { act_type: "OATH", max_act_fee_cents: 1000 }
              as: CommissionAuthority
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx}", full_name: "Amd N", email: "amd@x.com" }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond: $.data.id }
            - call: "POST /bonds/${bond}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /journal-entries"
              payload: { notary_id: "${nota}", act_type: "OATH", signer_name: "Orig", id_method: "PERSONAL_KNOWLEDGE", fee_charged_cents: 500 }
              as: Notary
              as_user_id: "${nota}"
              captures: { entry: $.data.id }
            - call: "POST /journal-entries/${entry}/amend"
              payload: { signer_name: "Corrected", fee_charged_cents: 500 }
              as: Notary
              as_user_id: "${nota}"
          trigger:
            - call: "POST /journal-entries/${entry}/amend"
              payload: { signer_name: "Again", fee_charged_cents: 500 }
              as: Notary
              as_user_id: "${nota}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_ENTRY_NOT_POSTED"

      - name: begin_identity_without_signer_returns_no_signer
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Session.SCHEDULED_to_IDENTITY_PENDING
          - "errors[ERR_NO_SIGNER]"
        distinguishing_aspect: "begin-identity on a SCHEDULED session with zero signers attached returns ERR_NO_SIGNER."
        test_recipe:
          setup: ["ACTIVE enotary notary; SCHEDULED session with NO signers"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx: $.data.id }
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx}", full_name: "NoSig N", email: "nosig@x.com", enotary_requested: true }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond: $.data.id }
            - call: "POST /bonds/${bond}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /sessions"
              payload: { notary_id: "${nota}", scheduled_start_at: "2026-07-02T09:00:00Z", scheduled_end_at: "2026-07-02T10:00:00Z" }
              as: Notary
              as_user_id: "${nota}"
              captures: { sess: $.data.id }
          trigger:
            - call: "POST /sessions/${sess}/begin-identity"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_NO_SIGNER"
            - "Session.${sess}.status == SCHEDULED"

      - name: start_session_without_document_returns_no_document
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Session.ID_VERIFIED_to_ACTIVE
          - "errors[ERR_NO_DOCUMENT]"
        distinguishing_aspect: "start on an ID_VERIFIED session with zero documents returns ERR_NO_DOCUMENT."
        test_recipe:
          setup: ["ID_VERIFIED session (signer verified) with NO documents attached"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx: $.data.id }
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx}", full_name: "NoDoc N", email: "nodoc@x.com", enotary_requested: true }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond: $.data.id }
            - call: "POST /bonds/${bond}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /sessions"
              payload: { notary_id: "${nota}", scheduled_start_at: "2026-07-03T09:00:00Z", scheduled_end_at: "2026-07-03T10:00:00Z" }
              as: Notary
              as_user_id: "${nota}"
              captures: { sess: $.data.id }
            - call: "POST /sessions/${sess}/signers"
              payload: { full_name: "S NoDoc", kba_passed: true, credential_analysis_passed: true }
              as: Notary
              as_user_id: "${nota}"
              captures: { sgn: $.data.id }
            - call: "POST /sessions/${sess}/begin-identity"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
            - call: "POST /sessions/${sess}/resolve-identity"
              payload: { outcome: "VERIFIED" }
              as: Notary
              as_user_id: "${nota}"
          trigger:
            - call: "POST /sessions/${sess}/start"
              payload: {}
              as: Notary
              as_user_id: "${nota}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_NO_DOCUMENT"
            - "Session.${sess}.status == ID_VERIFIED"

      - name: resolve_identity_verified_with_unverified_signer_returns_credential_not_verified
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Session.IDENTITY_PENDING_to_ID_VERIFIED
          - "errors[ERR_CREDENTIAL_NOT_VERIFIED]"
        distinguishing_aspect: "resolve-identity outcome=VERIFIED while a signer lacks credential_analysis_passed returns ERR_CREDENTIAL_NOT_VERIFIED."
        test_recipe:
          setup: ["IDENTITY_PENDING session whose only signer has kba_passed=true but credential_analysis_passed=false"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx: $.data.id }
