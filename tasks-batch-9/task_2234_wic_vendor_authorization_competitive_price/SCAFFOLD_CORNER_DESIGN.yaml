  # From Table 4 (Validations) — §1.4
  # ===========================================================================
  - section: validations
    instances:

      - name: duplicate_price_submission_for_same_vendor_item_cycle_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 33]
          - errors.ERR_DUPLICATE_PRICE_SUBMISSION
          - endpoints[POST /price-submissions]
        distinguishing_aspect: |
          The uniqueness key is (vendor_id, food_item_id, price_cycle_id) over statuses
          {SUBMITTED, ACCEPTED, REJECTED}: a rejected submission still blocks a fresh
          one (revise is the only way forward), while the same vendor and item in a
          different cycle, or a different vendor in the same cycle, is accepted.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; MILK category and ITEM_MILK upc 00011122233"
            - "Two OPEN price cycles with non-overlapping windows: 2026Q3 [2026-08-01, 2026-09-01) and 2026Q4 [2026-09-01, 2026-10-01)"
            - "Two vendors v1 and v2; v1 has one SUBMITTED milk submission of 320 in 2026Q3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /food-categories"
              payload: { code: "MILK", name: "Milk gallon", is_formula: false, formula_restriction_level: "NONE", min_stock_units: 4, min_variety_count: 2, max_units_per_transaction: 6, stock_required: true }
              as: VendorUnitSupervisor
              captures: { cat_milk: $.data.id }
            - call: "POST /authorized-food-items"
              payload: { food_category_id: "${cat_milk}", upc: "00011122233", brand: "Statewide Dairy", container_size_oz: 128, contract_brand: false, required_for_authorization: true }
              as: VendorUnitSupervisor
              captures: { item_milk: $.data.id }
            - call: "POST /price-cycles"
