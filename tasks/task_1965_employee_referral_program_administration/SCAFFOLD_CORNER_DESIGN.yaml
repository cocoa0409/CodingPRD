  - section: state_machines
    instances:
      - name: retention_failed_forfeits_retention_but_keeps_hire
        claim_type: side_effect_execution
        grounds: [state_machines.Referral.HIRED_to_RETENTION_FAILED, state_machines.BonusMilestone.PENDING_to_FORFEITED, state_machines.Candidate.HIRED_to_DEPARTED]
        distinguishing_aspect: "Departure before retention_due_at flips the referral to RETENTION_FAILED and forfeits ONLY the RETENTION milestone; the EARNED hire milestone is never clawed back by policy."
        test_recipe:
          setup: ["Default policy ACTIVE; IC referral hired 2026-08-01 (retention due 2027-01-28); candidate departure recorded effective 2026-09-01"]
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E900", full_name: "Rec Ru", email: "rec@corp.com", department: "TALENT", job_level: "IC", is_recruiter: true, hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E901", full_name: "Hm Ha", email: "hm@corp.com", department: "PRODUCT", job_level: "MANAGER", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { hm_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-IC-1", title: "Engineer", department: "ENGINEERING", level: "IC" }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "c1@x.com", candidate_full_name: "C One" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_1: $.data.id, cand_1: $.data.candidate_id }
            - call: "POST /erp/referrals/${ref_1}/review"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_1}/qualify"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_1}/advance"
              payload: { to_state: "SCREENING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_1}/advance"
              payload: { to_state: "INTERVIEWING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_1}/advance"
              payload: { to_state: "OFFER_EXTENDED" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "POST /erp/referrals/${ref_1}/hire"
              payload: { hire_date: "2026-08-01T00:00:00Z" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "POST /erp/candidates/${cand_1}/record-departure"
              payload: { terminated_at: "2026-09-01T00:00:00Z" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /erp/_ops/evaluate"
              as: TalentAdmin
              captures: { sweep: $.data }
            - call: "GET /erp/referrals/${ref_1}/milestones"
              as: PayrollProcessor
          assert:
            - "sweep retention_failed == 1 and retention_earned == 0"
            - "Referral.${ref_1}.status == RETENTION_FAILED"
            - "RETENTION milestone status == FORFEITED"
            - "HIRE milestone status remains EARNED (hire bonus is earned at hire — never clawed back)"
            - "Candidate global_status == DEPARTED"

      - name: clawback_of_paid_retention_after_late_departure
        claim_type: side_effect_execution
        grounds: [state_machines.BonusMilestone.PAID_to_CLAWED_BACK, calculations.annual_cap_accumulators]
        distinguishing_aspect: "Compensation: a PAID retention milestone is clawed back when the hire departs inside clawback_until (2027-04-28); the referral stays COMPLETED, recovery_status PENDING, and the employee's current-year accumulators net to 0 (RET earned 2027, clawed back 2027)."
        test_recipe:
          setup: ["Default policy ACTIVE; SENIOR referral hired 2026-08-01; retention earned by sweep at 2027-01-28, approved (FLAT wh 46200), batched, exported, confirmed PAID; departure recorded 2027-02-15"]
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E900", full_name: "Rec Ru", email: "rec@corp.com", department: "TALENT", job_level: "IC", is_recruiter: true, hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E901", full_name: "Hm Ha", email: "hm@corp.com", department: "PRODUCT", job_level: "MANAGER", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { hm_id: $.data.id }
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-SR-1", title: "Sr Engineer", department: "ENGINEERING", level: "SENIOR" }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "PUT /erp/employees/${emp_a}/tax-profile"
              payload: { filing_status: "SINGLE", withholding_method: "FLAT" }
              as: Employee
              as_user_id: "${emp_a}"
            - call: "POST /erp/employees/${emp_a}/tax-profile/verify"
              as: PayrollProcessor
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "c1@x.com", candidate_full_name: "C One" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_1: $.data.id, cand_1: $.data.candidate_id }
            - call: "POST /erp/referrals/${ref_1}/review"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_1}/qualify"
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_1}/advance"
              payload: { to_state: "SCREENING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_1}/advance"
              payload: { to_state: "INTERVIEWING" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/referrals/${ref_1}/advance"
              payload: { to_state: "OFFER_EXTENDED" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "POST /erp/referrals/${ref_1}/hire"
              payload: { hire_date: "2026-08-01T00:00:00Z" }
              as: HiringManager
              as_user_id: "${hm_id}"
            - call: "POST /erp/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /erp/_ops/evaluate"
              as: TalentAdmin
            - call: "GET /erp/milestones"
              payload: { referral_id: "${ref_1}", kind: "RETENTION" }
              as: PayrollProcessor
              captures: { ms_ret: "$.data[0].id" }
            - call: "POST /erp/milestones/${ms_ret}/approve"
              as: PayrollProcessor
            - call: "POST /erp/payroll-batches"
              payload: { period_label: "2027-01B" }
              as: PayrollProcessor
              captures: { batch_id: $.data.id, bv: $.data.version }
            - call: "POST /erp/payroll-batches/${batch_id}/milestones"
              payload: { milestone_id: "${ms_ret}", expected_payroll_batch_version: "${bv}" }
              as: PayrollProcessor
            - call: "POST /erp/payroll-batches/${batch_id}/seal"
              as: PayrollProcessor
            - call: "POST /erp/payroll-batches/${batch_id}/export"
              as: PayrollProcessor
            - call: "POST /erp/payroll-batches/${batch_id}/confirm-paid"
              as: TalentAdmin
            - call: "POST /erp/candidates/${cand_1}/record-departure"
              payload: { terminated_at: "2027-02-15T00:00:00Z" }
              as: Recruiter
              as_user_id: "${rec_id}"
            - call: "POST /erp/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /erp/_ops/evaluate"
              as: TalentAdmin
              captures: { sweep: $.data }
            - call: "GET /erp/milestones/${ms_ret}"
              as: PayrollProcessor
              captures: { ms_st: $.data.status, rec: $.data.recovery_status }
            - call: "GET /erp/employees/${emp_a}"
              as: PayrollProcessor
              captures: { prov: $.data.annual_provisional_cents, comm: $.data.annual_committed_cents }
          assert:
            - "sweep clawed_back == 1 (departed_at 2027-02-15 < clawback_until 2027-04-28)"
            - "Milestone status == CLAWED_BACK with recovery_status == PENDING"
            - "Referral.${ref_1}.status remains COMPLETED (clawback does not rewrite the referral outcome)"
            - "Employee annual_provisional_cents == 0 and annual_committed_cents == 0 for 2027 (RET 210000 earned 2027, subtracted on clawback; HIRE 90000 earned 2026 is out of the 2027 accumulator window)"

      - name: campaign_auto_end_by_sweep_releases_reservation
        claim_type: side_effect_execution
        grounds: [state_machines.Campaign.ACTIVE_to_ENDED, calculations.campaign_settlement]
        distinguishing_aspect: "Time-driven transition: when the clock passes window_end the sweep ends the campaign and releases the outstanding reservation, restoring remaining_cents to the full budget without touching the referral."
        test_recipe:
          setup: ["Default policy ACTIVE; SENIOR requisition with ACTIVE campaign window [2026-07-01, 2026-08-15], budget 500000; one referral attached reserving 200000"]
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-SR-1", title: "Sr Engineer", department: "ENGINEERING", level: "SENIOR", hard_to_fill: true }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/campaigns"
              payload: { name: "short", job_requisition_id: "${req_id}", multiplier_bps: 15000, flat_addon_cents: 50000, window_start: "2026-07-01T00:00:00Z", window_end: "2026-08-15T00:00:00Z", budget_cents: 500000 }
              as: TalentAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /erp/campaigns/${camp_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "c1@x.com", candidate_full_name: "C One" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_1: $.data.id }
            - call: "POST /erp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /erp/_ops/evaluate"
              as: TalentAdmin
              captures: { sweep: $.data }
            - call: "GET /erp/campaigns/${camp_id}"
              as: TalentAdmin
              captures: { cst: $.data.status, r: $.data.reserved_cents, s: $.data.spent_cents, m: $.data.remaining_cents }
          assert:
            - "sweep campaigns_ended == 1"
            - "Campaign status == ENDED, reserved_cents == 0, spent_cents == 0, remaining_cents == 500000 (invariant reserved + spent + remaining == budget preserved)"
            - "Referral.${ref_1}.status remains SUBMITTED with campaign_id still set (campaign end does not terminate the referral)"

      - name: referral_expiry_by_sweep
        claim_type: valid_transition
        grounds: [state_machines.Referral.SUBMITTED_to_EXPIRED]
        distinguishing_aspect: "A referral untouched for referral_expiry_days (45) is auto-expired by the sweep: at submitted_at + 45 days it still lives (strict > comparison), one day later it is EXPIRED."
        test_recipe:
          setup: ["Default policy ACTIVE; one SUBMITTED referral from 2026-08-01; clock at 2026-09-16 (46 days later)"]
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-IC-1", title: "Engineer", department: "ENGINEERING", level: "IC" }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "${req_id}", candidate_email: "c1@x.com", candidate_full_name: "C One" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { ref_1: $.data.id }
            - call: "POST /erp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /erp/_ops/evaluate"
              as: TalentAdmin
              captures: { sweep: $.data }
          assert:
            - "sweep expired == 1 (now 2026-09-16 > submitted_at 2026-08-01 + 45 days = 2026-09-15)"
            - "Referral.${ref_1}.status == EXPIRED"

      - name: executive_referrer_gets_no_campaign_uplift
        claim_type: conditional_validation
        grounds: [calculations.bonus_quote, entities.Campaign.fields.payouts_count]
        distinguishing_aspect: "Conditional calculation branch: an EXECUTIVE-level referrer (different department, so not excluded) attaches the campaign but earns zero uplift — bonus_total_cents equals the bare tier base while payouts_count still increments."
        test_recipe:
          setup: ["Default policy ACTIVE; SENIOR requisition in ENGINEERING with ACTIVE campaign (15000 bps, 50000 flat, budget 1000000); EXECUTIVE referrer in SALES"]
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E105", full_name: "Exec E", email: "exec@corp.com", department: "SALES", job_level: "EXECUTIVE", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_x: $.data.id }
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-SR-1", title: "Sr Engineer", department: "ENGINEERING", level: "SENIOR", hard_to_fill: true }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/campaigns"
              payload: { name: "push", job_requisition_id: "${req_id}", multiplier_bps: 15000, flat_addon_cents: 50000, window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", budget_cents: 1000000 }
              as: TalentAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /erp/campaigns/${camp_id}/activate"
              as: TalentAdmin
          trigger:
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_x}", job_requisition_id: "${req_id}", candidate_email: "cx@x.com", candidate_full_name: "C X" }
              as: Employee
              as_user_id: "${emp_x}"
              captures: { ref_x: $.data.id, base: $.data.bonus_base_cents, up: $.data.campaign_uplift_cents, tot: $.data.bonus_total_cents, camp: $.data.campaign_id }
          assert:
            - "campaign_id == ${camp_id} (attaches despite zero uplift)"
            - "campaign_uplift_cents == 0 (EXECUTIVE branch)"
            - "bonus_total_cents == 300000 (bare SENIOR tier)"
            - "Campaign.${camp_id}.payouts_count == 1 and reserved_cents == 0"

  # =================================================================
  # Section: validations
  # =================================================================
  - section: validations
    instances:
      - name: unknown_role_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "An unrecognized X-User-Role value fails priority 1 with 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /erp/employees"
              as: Wizard
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and http status 401"

      - name: existence_beats_referential_on_submit
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=13]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A submission naming a nonexistent requisition AND a cooling-down candidate returns 404 ERR_NOT_FOUND (existence, priority 6) rather than ERR_CANDIDATE_IN_COOLDOWN (priority 13)."
        test_recipe:
          setup: ["Default policy ACTIVE; eligible referrer; candidate in cooldown until 2026-09-01"]
          setup_api_calls:
            - call: "POST /erp/policy-versions"
              payload: { effective_from: "2026-01-01T00:00:00Z" }
              as: TalentAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /erp/policy-versions/${pol_id}/activate"
              as: TalentAdmin
            - call: "POST /erp/employees"
              payload: { employee_number: "E101", full_name: "Ann A", email: "anna@corp.com", department: "ENGINEERING", job_level: "IC", hire_date: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { emp_a: $.data.id }
            - call: "POST /erp/candidates"
              payload: { full_name: "Cool Cand", email: "cool@x.com", prior_application_at: "2026-03-01T00:00:00Z" }
              as: TalentAdmin
              captures: { cand_id: $.data.id }
          trigger:
            - call: "POST /erp/referrals"
              payload: { referrer_id: "${emp_a}", job_requisition_id: "11111111-1111-1111-1111-111111111111", candidate_id: "${cand_id}" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (404), proving existence (6) precedes referential cooldown (13)"

