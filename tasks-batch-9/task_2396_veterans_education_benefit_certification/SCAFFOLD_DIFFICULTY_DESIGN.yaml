            - call: "POST /catalog-versions"
              payload: { program_id: "${progC}", catalog_year: "2026-2027", effective_start: "2026-07-01", effective_end: "2027-07-01", has_published_tuition_schedule: true, has_refund_policy: true, has_program_length_disclosure: true }
