    side_effects: []

  # ---- writes ------------------------------------------------------------
  - method: POST
    path: "/safesport/clubs"
    description: "Charter a member organization; initial_escrow_cents seeds both escrow_balance_cents and total_funded_cents"
    roles: [NgbAdmin]
    code: 201
    input: [name, state_code, roster_size_attested, "minor_athlete_program?", "initial_escrow_cents?"]
    output: Club
    side_effects: ["sets escrow_balance_cents = total_funded_cents = initial_escrow_cents (default 0)", "sets compliance_posture = OPEN and sanction_status = NONE"]
  - method: POST
    path: "/safesport/clubs/{club_id}/escrow-funding"
    description: "Add screening escrow to a club; the only action that raises total_funded_cents"
    roles: [NgbAdmin, ClubAdministrator]
    code: 200
    input: [amount_cents]
    output: Club
    side_effects: ["increments escrow_balance_cents and total_funded_cents by amount_cents", "increments Club.version by 1"]
  - method: POST
    path: "/safesport/members"
    description: "Register a coach or volunteer; runs calculations.screening_tier_assignment immediately so required_tier and risk_points are set at creation"
    roles: [NgbAdmin, ClubAdministrator]
    code: 201
    input: [club_id, full_name, email, role_type, has_minor_athlete_contact, date_of_birth, jurisdiction_codes]
    output: Member
    side_effects: ["runs calculations.screening_tier_assignment and stamps risk_points and required_tier", "sets screening_status = UNSCREENED, membership_status = PENDING, training_status = NEVER, contact_eligibility = RESTRICTED", "recomputes Club.compliance_posture"]
  - method: POST
    path: "/safesport/members/{member_id}/screening-orders"
    description: "Order a tiered background screen for this member; prices it with calculations.screening_order_charge and debits the club escrow"
    roles: [ClubAdministrator]
    code: 201
    input: ["expedited?", expected_club_version]
    output: ScreeningOrder
    side_effects: ["creates ScreeningOrder in status ORDERED with tier and jurisdiction_count snapshotted from the member", "stamps gross_subtotal_cents, discount_cents, expedite_cents, charged_cents", "debits Club.escrow_balance_cents by charged_cents", "increments Club.version by 1", "moves the Member screening dimension to SCREENING_ORDERED and increments Member.version by 1", "recomputes Club.compliance_posture"]
  - method: POST
    path: "/safesport/screening-orders/{screening_order_id}/result"
    description: "Vendor posts the raw screening return; RECORD_FOUND moves the member to FLAGGED, NO_RECORD leaves it SCREENING_ORDERED"
    roles: [ScreeningVendor]
    code: 200
    input: [vendor_disposition]
    output: ScreeningOrder
    side_effects: ["sets status = RESULT_RETURNED and returned_at = clock", "may move the Member screening dimension SCREENING_ORDERED -> FLAGGED", "increments Member.version by 1"]
  - method: POST
    path: "/safesport/screening-orders/{screening_order_id}/adjudicate"
    description: "Officer adjudicates the returned screen against the disqualifying criteria; drives the member to CLEARED or DISQUALIFIED"
    roles: [SafeSportOfficer]
    code: 200
    input: [disposition, rationale]
    output: ScreeningOrder
    side_effects: ["sets status = ADJUDICATED, adjudicated_at = clock and expires_at", "moves the Member screening dimension to CLEARED or DISQUALIFIED", "re-runs calculations.screening_tier_assignment on NON_DISQUALIFYING_RECORD", "runs calculations.member_eligibility_projection variant AUDIT_SNAPSHOT and stamps Member.eligible_through and records_retained_through", "may bubble the membership dimension PENDING -> ACTIVE", "on DISQUALIFYING_RECORD terminates every CoachAssignment of the member and recomputes each affected Club", "increments Member.version by 1"]
  - method: POST
    path: "/safesport/screening-orders/{screening_order_id}/void"
    description: "Void a screening order and refund its charge to the club escrow; the compensating action that preserves calculations.escrow_conservation_invariant"
    roles: [NgbAdmin]
    code: 200
    input: [reason]
    output: ScreeningOrder
    side_effects: ["sets status = VOIDED and void_reason", "credits Club.escrow_balance_cents by charged_cents and increments Club.version by 1", "reverts the Member screening dimension to UNSCREENED and increments Member.version by 1"]
  - method: POST
    path: "/safesport/training-courses"
    description: "Publish an abuse-prevention course with its validity period and the tiers that require it"
    roles: [NgbAdmin]
    code: 201
    input: [code, title, validity_days, delivery_mode, required_for_tiers, "pass_score?"]
    output: TrainingCourse
    side_effects: ["widening required_for_tiers changes which members calculations.member_eligibility_projection considers covered on the next evaluation"]
  - method: POST
    path: "/safesport/training-assignments"
    description: "Assign a published course to a member with a completion deadline"
    roles: [NgbAdmin, ClubAdministrator]
    code: 201
    input: [member_id, course_code, due_at]
    output: TrainingAssignment
    side_effects: ["creates the assignment in status ASSIGNED with assigned_at = clock"]
  - method: POST
    path: "/safesport/training-assignments/{training_assignment_id}/start"
    description: "Member starts the course; only a started assignment is in flight for the RENEWAL_FORWARD projection variant"
    roles: [Member, ClubAdministrator]
    code: 200
    input: []
    output: TrainingAssignment
    side_effects: ["sets status = IN_PROGRESS and started_at = clock"]
  - method: POST
    path: "/safesport/training-assignments/{training_assignment_id}/complete"
    description: "Member completes the course with a passing score, refreshing training currency"
    roles: [Member, ClubAdministrator]
    code: 200
    input: [score]
    output: TrainingAssignment
    side_effects: ["sets status = COMPLETED, completed_at = clock, expires_at = completed_at + course validity_days", "recomputes Member.training_status and contact_eligibility", "runs calculations.member_eligibility_projection variant AUDIT_SNAPSHOT and stamps Member.eligible_through and records_retained_through", "may bubble the membership dimension PENDING -> ACTIVE", "increments Member.version by 1", "recomputes Club.restricted_member_count and Club.compliance_posture for every affected club"]
  - method: POST
    path: "/safesport/coach-assignments"
    description: "Place a member on a club team for a season; the season interval is half-open [season_start, season_end)"
    roles: [ClubAdministrator]
    code: 201
    input: [member_id, club_id, team_name, season_start, season_end]
    output: CoachAssignment
    side_effects: ["creates the assignment in status PENDING", "recomputes Club.restricted_member_count and Club.compliance_posture for club_id"]
  - method: POST
    path: "/safesport/coach-assignments/{coach_assignment_id}/activate"
    description: "Activate a pending placement once screening and training are current; pins Member.version onto the assignment"
    roles: [ClubAdministrator]
    code: 200
    input: [expected_member_version]
    output: CoachAssignment
    side_effects: ["sets status = ACTIVE, activated_at = clock and eligibility_snapshot_version = Member.version", "increments Club.active_assignment_count and Member.active_assignment_count", "increments Member.version by 1", "recomputes Club.compliance_posture"]
  - method: POST
    path: "/safesport/coach-assignments/{coach_assignment_id}/electronic-communication-authorization"
    description: "Authorize an electronic communication channel for this placement under the minor-athlete electronic-communication policy"
    roles: [ClubAdministrator]
    code: 200
    input: [channel_kind, parent_copy_required]
    output: CoachAssignment
    side_effects: ["sets electronic_comm_authorized = true, electronic_comm_channel_kind and parent_copy_required"]
  - method: POST
    path: "/safesport/investigating-bodies"
    description: "Register an independent investigating body with its allegation scope, intake status and caseload ceiling"
    roles: [NgbAdmin]
    code: 201
    input: [name, scope_categories, max_open_cases, "intake_status?"]
    output: InvestigatingBody
    side_effects: ["sets open_case_count = 0 and intake_status = ACCEPTING unless overridden"]
  - method: POST
    path: "/safesport/cases"
    description: "File an incident report under the required-reporting obligation; classifies report_timeliness against the 24-hour mandatory window"
    roles: [SafeSportOfficer, ClubAdministrator, Member]
    code: 201
    input: [club_id, reported_member_id, allegation_category, reporter_kind, narrative, occurred_at]
    output: Case
    side_effects: ["creates the case in status INTAKE_REVIEW with intake_received_at = clock and reporter_user_id = X-User-ID", "stamps report_timeliness = TIMELY when intake_received_at - occurred_at <= 24 hours, else LATE"]
  - method: POST
    path: "/safesport/cases/{case_id}/route"
    description: "Route an intake case to the investigating body with jurisdiction over the allegation category"
    roles: [SafeSportOfficer]
    code: 200
    input: [investigating_body_id]
    output: Case
    side_effects: ["sets status = ROUTED, investigating_body_id and routed_at = clock", "increments InvestigatingBody.open_case_count and InvestigatingBody.version by 1"]
  - method: POST
    path: "/safesport/cases/{case_id}/close"
    description: "Close a case; from INTAKE_REVIEW this is an administrative closure, from ROUTED the outcome drives two disjoint cascade branches"
    roles: [SafeSportOfficer]
    code: 200
    input: [closure_reason, "outcome?"]
    output: Case
    side_effects: ["INTAKE_REVIEW -> CLOSED_ADMINISTRATIVE leaves measures and the investigating body untouched", "ROUTED + SUBSTANTIATED converts every ACTIVE measure to PERMANENT, revokes the member, terminates every non-terminal CoachAssignment and recomputes each affected Club", "ROUTED + UNSUBSTANTIATED lifts every ACTIVE measure, restores the member and reactivates the suspended assignments", "decrements InvestigatingBody.open_case_count on both ROUTED branches"]
  - method: POST
    path: "/safesport/cases/{case_id}/interim-measures"
    description: "Impose a temporary measure on the individual under investigation; the first hop of the four-hop restriction cascade"
    roles: [SafeSportOfficer]
    code: 201
    input: [member_id, measure_kind, effective_from, "effective_to?", expected_member_version]
    output: InterimMeasure
    side_effects: ["creates the measure in status ACTIVE with permanence TEMPORARY and imposed_by_user_id = X-User-ID", "hop 2: Member.contact_eligibility becomes RESTRICTED and the membership dimension moves ACTIVE -> SUSPENDED for TEMPORARY_SUSPENSION", "hop 3: every ACTIVE CoachAssignment of the member becomes SUSPENDED", "hop 4: each affected Club has active_assignment_count decremented, restricted_member_count incremented and compliance_posture recomputed", "increments Member.version by 1"]
  - method: POST
    path: "/safesport/interim-measures/{interim_measure_id}/lift"
    description: "Lift a temporary measure and restore the individual's standing"
    roles: [SafeSportOfficer]
    code: 200
    input: [reason]
    output: InterimMeasure
    side_effects: ["sets status = LIFTED, lifted_at = clock and lift_reason", "restores Member.contact_eligibility, the membership dimension and every SUSPENDED CoachAssignment with suspended_reason INTERIM_MEASURE", "recomputes each affected Club", "increments Member.version by 1"]
  - method: POST
    path: "/safesport/interim-measures/{interim_measure_id}/convert-permanent"
    description: "Convert a temporary measure into a permanent one; requires a different officer than the one who imposed it"
    roles: [SafeSportOfficer]
    code: 200
    input: [rationale]
    output: InterimMeasure
    side_effects: ["sets status = PERMANENT, permanence = PERMANENT and converted_by_user_id = X-User-ID", "sets Member.contact_eligibility = PROHIBITED and the membership dimension to REVOKED", "terminates every non-terminal CoachAssignment of the member", "recomputes each affected Club", "increments Member.version by 1"]
  - method: POST
    path: "/safesport/club-audits"
    description: "Open a compliance audit over a period with an explicit member sample and a scoring variant; sampled_member_ids may be empty"
    roles: [ComplianceAuditor]
    code: 201
    input: [club_id, audit_period_start, audit_period_end, score_variant, sampled_member_ids]
    output: ClubAudit
    side_effects: ["creates the audit in status SAMPLED with sampled_member_count = len(sampled_member_ids) and all four finding counters at 0"]
  - method: POST
    path: "/safesport/club-audits/{club_audit_id}/findings"
    description: "Write a finding against the audited club or one of its sampled members"
    roles: [ComplianceAuditor]
    code: 201
    input: [finding_code, severity, "member_id?", "is_repeat?"]
    output: AuditFinding
    side_effects: ["creates the finding in status OPEN", "increments ClubAudit.finding_total_count and open_finding_count, preserving calculations.finding_partition_invariant", "recomputes Club.open_finding_count, Club.critical_open_finding_count and Club.compliance_posture"]
  - method: POST
    path: "/safesport/club-audits/{club_audit_id}/finalize"
    description: "Finalize the audit: run calculations.club_compliance_score under the audit's variant and issue the findings"
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: ClubAudit
    side_effects: ["stamps compliant_member_count, denominator_count and compliance_score", "copies compliance_score onto Club.compliance_score", "sets status = FINDINGS_ISSUED and finalized_at = clock", "recomputes Club.compliance_posture"]
  - method: POST
    path: "/safesport/audit-findings/{audit_finding_id}/decision"
    description: "Record a decision on a finding; ClubAdministrator may only submit remediation, ComplianceAuditor may only reject or waive"
    roles: [ClubAdministrator, ComplianceAuditor]
    code: 200
    input: [decision, note]
    output: AuditFinding
    side_effects: ["moves the finding OPEN->REMEDIATED, REMEDIATED->OPEN or OPEN->WAIVED", "adjusts the audit's three finding counters so calculations.finding_partition_invariant holds", "recomputes Club.open_finding_count, Club.critical_open_finding_count and Club.compliance_posture"]
  - method: POST
    path: "/safesport/club-audits/{club_audit_id}/close"
    description: "Close a finalized audit either clean or with a sanction; the sanction branch prices the fine with calculations.audit_sanction_fine and freezes the club"
    roles: [ComplianceAuditor]
    code: 200
    input: [resolution]
    output: ClubAudit
    side_effects: ["CLOSE_COMPLIANT sets sanction_fine_cents = 0, Club.sanction_status = NONE and recomputes posture", "SANCTION stamps AuditFinding.fine_cents per OPEN finding, sums them into ClubAudit.sanction_fine_cents, sets Club.sanction_status = SUSPENDED, forces Club.compliance_posture = FROZEN and terminates every PENDING or ACTIVE CoachAssignment at the club"]
  - method: POST
    path: "/safesport/clubs/{club_id}/room-stays"
    description: "Book a bed in a travel room slot for an adult member or a minor athlete under the travel and lodging policy"
    roles: [ClubAdministrator]
    code: 201
    input: [occupant_kind, trip_label, room_number, check_in, check_out, "member_id?", "minor_athlete_age?"]
    output: RoomStay
    side_effects: ["runs calculations.room_slot_overlap_check against the BOOKED stays already in the slot", "creates the stay in status BOOKED"]
  - method: POST
    path: "/safesport/room-stays/{room_stay_id}/cancel"
    description: "Cancel a booked stay and release its interval from the slot"
    roles: [ClubAdministrator]
    code: 200
    input: [reason]
    output: RoomStay
    side_effects: ["sets status = CANCELLED and cancel_reason", "the interval stops participating in calculations.room_slot_overlap_check"]
  - method: POST
    path: "/safesport/members/{member_id}/renew"
    description: "Renew membership for another cycle; gated on screening currency, training currency, the renewal window and the club posture"
    roles: [ClubAdministrator]
    code: 200
    input: [attestation_signed]
    output: Member
    side_effects: ["sets membership_status = ACTIVE and last_renewed_at = clock", "re-runs calculations.screening_tier_assignment and calculations.member_eligibility_projection variant AUDIT_SNAPSHOT", "re-stamps eligible_through and records_retained_through", "increments Member.version by 1"]
  - method: POST
    path: "/safesport/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock to any instant. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every rule that reads the clock sees that instant, never real wall-clock time. Setting the clock may trigger the lazily evaluated auto-transitions on the next read or mutation."
    roles: [NgbAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["repositions the logical clock used by every expiry, lapse, window and buffer rule"]

# ============================================================================
# 1.6  Error Catalog
# ============================================================================
errors:
  # ---- auth / authorization ----
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    trigger_condition: "X-User-ID or X-User-Role header absent or empty on any endpoint under /safesport"
    message_template: "authentication headers are required"
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    trigger_condition: "X-User-Role is not listed in the endpoint's roles, or a Member caller targets a member_id other than their own identity"
    message_template: "role {role} may not perform {operation}"
  - error_id: ERR_CLUB_SCOPE_VIOLATION
    http_status: 403
    trigger_condition: "A ClubAdministrator addresses a path resource, or names a body reference, that belongs to a club other than the one their X-User-ID is bound to"
    message_template: "club administrator for club {actor_club_id} may not act on club {target_club_id}"
  - error_id: ERR_DECISION_ROLE_MISMATCH
    http_status: 403
    trigger_condition: "POST /safesport/audit-findings/{audit_finding_id}/decision is called with decision = REMEDIATION_SUBMITTED by a ComplianceAuditor, or with decision = REMEDIATION_REJECTED or WAIVED by a ClubAdministrator"
    message_template: "role {role} may not record decision {decision}"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    trigger_condition: "The X-User-ID converting an interim measure to permanent equals InterimMeasure.imposed_by_user_id, or the X-User-ID closing a case equals Case.reporter_user_id"
    message_template: "user {user_id} may not perform this step after performing the prior step"

  # ---- shape ----
  - error_id: ERR_VALIDATION
    http_status: 422
    trigger_condition: "A required input field is missing, has the wrong JSON type, carries a value outside a declared enum, violates a numeric range (roster_size_attested < 1, amount_cents < 1, score outside 0..100, max_open_cases < 1, validity_days < 1, minor_athlete_age outside 0..17), is a malformed ISO-8601 instant or date, or names an interval whose end is not strictly after its start"
    message_template: "field {field}: {reason}"

  # ---- not found ----
  - error_id: ERR_CLUB_NOT_FOUND
    http_status: 404
    trigger_condition: "club_id in the path or in the request body matches no Club"
    message_template: "club {club_id} not found"
  - error_id: ERR_MEMBER_NOT_FOUND
    http_status: 404
    trigger_condition: "member_id in the path or in the request body (including any element of sampled_member_ids) matches no Member"
    message_template: "member {member_id} not found"
  - error_id: ERR_SCREENING_ORDER_NOT_FOUND
    http_status: 404
    trigger_condition: "screening_order_id in the path matches no ScreeningOrder"
    message_template: "screening order {screening_order_id} not found"
  - error_id: ERR_TRAINING_COURSE_NOT_FOUND
    http_status: 404
    trigger_condition: "course_code in the request body matches no TrainingCourse.code"
    message_template: "training course {course_code} not found"
  - error_id: ERR_TRAINING_ASSIGNMENT_NOT_FOUND
    http_status: 404
    trigger_condition: "training_assignment_id in the path matches no TrainingAssignment"
    message_template: "training assignment {training_assignment_id} not found"
  - error_id: ERR_COACH_ASSIGNMENT_NOT_FOUND
    http_status: 404
    trigger_condition: "coach_assignment_id in the path matches no CoachAssignment"
    message_template: "coach assignment {coach_assignment_id} not found"
  - error_id: ERR_INVESTIGATING_BODY_NOT_FOUND
    http_status: 404
    trigger_condition: "investigating_body_id in the path or in the request body matches no InvestigatingBody"
    message_template: "investigating body {investigating_body_id} not found"
  - error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    trigger_condition: "case_id in the path matches no Case"
    message_template: "case {case_id} not found"
  - error_id: ERR_INTERIM_MEASURE_NOT_FOUND
    http_status: 404
    trigger_condition: "interim_measure_id in the path matches no InterimMeasure"
    message_template: "interim measure {interim_measure_id} not found"
  - error_id: ERR_CLUB_AUDIT_NOT_FOUND
    http_status: 404
    trigger_condition: "club_audit_id in the path matches no ClubAudit"
    message_template: "club audit {club_audit_id} not found"
  - error_id: ERR_AUDIT_FINDING_NOT_FOUND
    http_status: 404
    trigger_condition: "audit_finding_id in the path matches no AuditFinding"
    message_template: "audit finding {audit_finding_id} not found"
  - error_id: ERR_ROOM_STAY_NOT_FOUND
    http_status: 404
    trigger_condition: "room_stay_id in the path matches no RoomStay"
    message_template: "room stay {room_stay_id} not found"

  # ---- uniqueness ----
  - error_id: ERR_DUPLICATE_MEMBER_EMAIL
    http_status: 409
    trigger_condition: "POST /safesport/members supplies an email that already exists on another Member, compared case-insensitively, anywhere in the governing body"
    message_template: "email {email} is already registered to member {member_id}"
  - error_id: ERR_DUPLICATE_COURSE_CODE
    http_status: 409
    trigger_condition: "POST /safesport/training-courses supplies a code that already exists on another TrainingCourse"
    message_template: "training course code {code} already exists"

  # ---- optimistic concurrency ----
  - error_id: ERR_STALE_CLUB_VERSION
    http_status: 412
    trigger_condition: "expected_club_version does not equal the current Club.version on POST /safesport/members/{member_id}/screening-orders"
    message_template: "expected club version {expected}, current is {actual}"
  - error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
    trigger_condition: "expected_member_version does not equal the current Member.version on POST /safesport/coach-assignments/{coach_assignment_id}/activate or POST /safesport/cases/{case_id}/interim-measures"
    message_template: "expected member version {expected}, current is {actual}"

  # ---- state ----
  - error_id: ERR_MEMBER_INVALID_STATE
    http_status: 409
    trigger_condition: "The Member's membership_status does not admit the requested transition: renew from PENDING, SUSPENDED or REVOKED"
    message_template: "member {member_id} in membership_status {status} does not admit {trigger}"
  - error_id: ERR_SCREENING_ORDER_INVALID_STATE
    http_status: 409
    trigger_condition: "result on a ScreeningOrder that is not ORDERED, adjudicate on one that is not RESULT_RETURNED, or void on one that is already ADJUDICATED or VOIDED"
    message_template: "screening order {screening_order_id} in status {status} does not admit {trigger}"
  - error_id: ERR_TRAINING_ASSIGNMENT_INVALID_STATE
    http_status: 409
    trigger_condition: "start on a TrainingAssignment that is not ASSIGNED, or complete on one that is COMPLETED or EXPIRED"
    message_template: "training assignment {training_assignment_id} in status {status} does not admit {trigger}"
  - error_id: ERR_COACH_ASSIGNMENT_INVALID_STATE
    http_status: 409
    trigger_condition: "activate or authorize electronic communication on a CoachAssignment that is not PENDING or ACTIVE respectively, or any trigger on a TERMINATED assignment"
    message_template: "coach assignment {coach_assignment_id} in status {status} does not admit {trigger}"
  - error_id: ERR_CASE_INVALID_STATE
    http_status: 409
    trigger_condition: "route on a Case that is not INTAKE_REVIEW, an interim measure created on a Case in any CLOSED_* status, or close on a Case already in a CLOSED_* status"
    message_template: "case {case_id} in status {status} does not admit {trigger}"
  - error_id: ERR_INTERIM_MEASURE_INVALID_STATE
    http_status: 409
    trigger_condition: "lift or convert-permanent on an InterimMeasure that is not ACTIVE"
    message_template: "interim measure {interim_measure_id} in status {status} does not admit {trigger}"
  - error_id: ERR_AUDIT_INVALID_STATE
    http_status: 409
    trigger_condition: "a finding written against a ClubAudit that is not SAMPLED, finalize on one that is not SAMPLED, or close on one that is not FINDINGS_ISSUED"
    message_template: "club audit {club_audit_id} in status {status} does not admit {trigger}"
  - error_id: ERR_FINDING_INVALID_STATE
    http_status: 409
    trigger_condition: "decision REMEDIATION_SUBMITTED or WAIVED on an AuditFinding that is not OPEN, decision REMEDIATION_REJECTED on one that is not REMEDIATED, or any decision on a WAIVED finding"
    message_template: "audit finding {audit_finding_id} in status {status} does not admit decision {decision}"
  - error_id: ERR_ROOM_STAY_INVALID_STATE
    http_status: 409
    trigger_condition: "cancel on a RoomStay that is already CANCELLED"
    message_template: "room stay {room_stay_id} in status {status} does not admit {trigger}"

  # ---- domain gates ----
  - error_id: ERR_CLUB_POSTURE_FROZEN
    http_status: 409
    trigger_condition: "Any of member registration, screening order creation, coach assignment creation or activation, room stay booking or membership renewal is attempted at a Club whose compliance_posture is FROZEN"
    message_template: "club {club_id} is frozen and may not accept {operation}"
  - error_id: ERR_MEMBER_DISQUALIFIED
    http_status: 409
    trigger_condition: "Any coach assignment creation or activation, training assignment, room stay booking or membership renewal names a Member whose screening_status is DISQUALIFIED"
    message_template: "member {member_id} is disqualified"
  - error_id: ERR_CONTACT_NOT_PERMITTED
    http_status: 409
    trigger_condition: "A coach assignment is activated, an electronic communication channel is authorized, or a room stay is booked for a Member whose contact_eligibility is RESTRICTED or PROHIBITED"
    message_template: "member {member_id} has contact_eligibility {contact_eligibility} and may not be placed in contact with athletes"
  - error_id: ERR_MINOR_ADULT_LODGING_PROHIBITED
    http_status: 409
    trigger_condition: "POST /safesport/clubs/{club_id}/room-stays would place an ADULT_MEMBER and a MINOR_ATHLETE in the same (club_id, trip_label, room_number) slot on overlapping half-open intervals"
    message_template: "an adult and a minor athlete may not share room {room_number} on trip {trip_label}"
  - error_id: ERR_ELECTRONIC_COMM_NOT_PERMITTED
    http_status: 409
    trigger_condition: "channel_kind is PRIVATE_DIRECT_MESSAGE, or parent_copy_required is false, on a CoachAssignment at a club whose minor_athlete_program is true"
    message_template: "channel {channel_kind} with parent_copy_required={parent_copy_required} is prohibited for programs serving minor athletes"
  - error_id: ERR_SCREENING_NOT_CURRENT
    http_status: 409
    trigger_condition: "A coach assignment activation or a membership renewal names a Member whose screening_status is not CLEARED, or whose CLEARED screening's expires_at is not strictly after the logical clock"
    message_template: "member {member_id} has no current screening"
  - error_id: ERR_TRAINING_NOT_CURRENT
    http_status: 409
    trigger_condition: "A coach assignment activation or a membership renewal names a Member for whom some course required by their required_tier lacks a COMPLETED TrainingAssignment whose expires_at is strictly after the logical clock"
    message_template: "member {member_id} is missing current training for course {course_code}"
  - error_id: ERR_MEASURE_WINDOW_CONFLICT
    http_status: 409
    trigger_condition: "A new InterimMeasure of the same measure_kind for the same member has a closed window that overlaps an existing ACTIVE measure's window extended by the 14-day trailing cooling buffer; LIFTED and PERMANENT rows do not participate"
    message_template: "measure window conflicts with measure {interim_measure_id} including its 14-day cooling buffer"
  - error_id: ERR_RENEWAL_WINDOW_NOT_OPEN
    http_status: 409
    trigger_condition: "POST /safesport/members/{member_id}/renew is called when the logical clock is strictly before Member.eligible_through minus 90 days, or attestation_signed is false"
    message_template: "renewal window for member {member_id} opens at {window_open_at}"
  - error_id: ERR_BODY_SCOPE_MISMATCH
    http_status: 409
    trigger_condition: "The named InvestigatingBody's scope_categories does not contain the Case's allegation_category"
    message_template: "investigating body {investigating_body_id} does not cover allegation category {allegation_category}"
  - error_id: ERR_BODY_INTAKE_PAUSED
    http_status: 409
    trigger_condition: "The named InvestigatingBody has intake_status PAUSED"
    message_template: "investigating body {investigating_body_id} has paused intake"
  - error_id: ERR_BODY_CASELOAD_EXCEEDED
    http_status: 409
    trigger_condition: "The named InvestigatingBody already has open_case_count equal to or greater than max_open_cases"
    message_template: "investigating body {investigating_body_id} is at its caseload ceiling of {max_open_cases}"
  - error_id: ERR_ROOM_OCCUPANCY_CONFLICT
    http_status: 409
    trigger_condition: "The requested half-open interval overlaps ROOM_SLOT_CAPACITY (2) or more BOOKED stays already in the same (club_id, trip_label, room_number) slot, and the adult/minor prohibition did not already apply"
    message_template: "room {room_number} on trip {trip_label} is at its capacity of 2 for the requested interval"
  - error_id: ERR_ESCROW_INSUFFICIENT
    http_status: 409
    trigger_condition: "The charged_cents computed for a screening order exceeds the club's escrow_balance_cents"
    message_template: "club {club_id} escrow balance {escrow_balance_cents} cannot cover charge {charged_cents}"

# ============================================================================
# 1.7  RBAC Matrix
# ============================================================================
# Every request carries X-User-ID and X-User-Role. role_model is
# segregation_of_duties: the identity in X-User-ID is recorded on the case and
# on the interim measure, and a later step compares against it.
roles:
  - role: NgbAdmin
    identity: opaque
    description: "National governing body staff. Charters clubs, publishes courses, registers investigating bodies, voids screening orders and repositions the logical clock. Has no club scope restriction."
    exclusive_operations:
      - "POST /safesport/clubs"
      - "POST /safesport/training-courses"
      - "POST /safesport/investigating-bodies"
      - "POST /safesport/screening-orders/{screening_order_id}/void"
      - "POST /safesport/_clock/set_current_utc"
    shared_operations:
      - "POST /safesport/clubs/{club_id}/escrow-funding (with ClubAdministrator)"
      - "POST /safesport/members (with ClubAdministrator)"
      - "POST /safesport/training-assignments (with ClubAdministrator)"
      - "all GET endpoints"
    forbidden_operations:
      - "POST /safesport/screening-orders/{screening_order_id}/result (ScreeningVendor only)"
      - "POST /safesport/screening-orders/{screening_order_id}/adjudicate (SafeSportOfficer only)"
      - "POST /safesport/members/{member_id}/screening-orders (ClubAdministrator only)"
      - "POST /safesport/cases/{case_id}/route (SafeSportOfficer only)"
      - "POST /safesport/club-audits (ComplianceAuditor only)"
  - role: ClubAdministrator
    identity: entity_backed:Club
    description: "Administrator of exactly one chartered club; X-User-ID is the id of the Club they administer (identity entity_backed:Club). Every path resource and every body reference they name must belong to their own club, otherwise ERR_CLUB_SCOPE_VIOLATION."
    exclusive_operations:
      - "POST /safesport/members/{member_id}/screening-orders"
      - "POST /safesport/coach-assignments"
      - "POST /safesport/coach-assignments/{coach_assignment_id}/activate"
      - "POST /safesport/coach-assignments/{coach_assignment_id}/electronic-communication-authorization"
      - "POST /safesport/clubs/{club_id}/room-stays"
      - "POST /safesport/room-stays/{room_stay_id}/cancel"
      - "POST /safesport/members/{member_id}/renew"
    shared_operations:
      - "POST /safesport/clubs/{club_id}/escrow-funding (with NgbAdmin)"
      - "POST /safesport/members (with NgbAdmin)"
      - "POST /safesport/training-assignments (with NgbAdmin)"
      - "POST /safesport/training-assignments/{training_assignment_id}/start and /complete (with Member)"
      - "POST /safesport/cases (with SafeSportOfficer and Member)"
      - "POST /safesport/audit-findings/{audit_finding_id}/decision (with ComplianceAuditor, but only decision = REMEDIATION_SUBMITTED)"
      - "GET endpoints scoped to their own club"
    forbidden_operations:
      - "POST /safesport/clubs"
      - "POST /safesport/screening-orders/{screening_order_id}/adjudicate"
      - "POST /safesport/cases/{case_id}/route and /close"
      - "POST /safesport/cases/{case_id}/interim-measures"
      - "POST /safesport/club-audits and its findings, finalize, close"
      - "POST /safesport/audit-findings/{audit_finding_id}/decision with decision = REMEDIATION_REJECTED or WAIVED (ERR_DECISION_ROLE_MISMATCH)"
  - role: ScreeningVendor
    identity: opaque
    description: "External background screening provider. Its only capability is returning the raw disposition of a screen it was asked to run; it never adjudicates and never sees the disqualifying-criteria decision."
    exclusive_operations:
      - "POST /safesport/screening-orders/{screening_order_id}/result"
    shared_operations:
      - "GET /safesport/members/{member_id}/screening-orders"
    forbidden_operations:
      - "POST /safesport/screening-orders/{screening_order_id}/adjudicate"
      - "POST /safesport/members/{member_id}/screening-orders"
      - "every case, measure, audit and renewal operation"
  - role: SafeSportOfficer
    identity: opaque
    description: "Governing body safety officer. Adjudicates screens against the disqualifying criteria, takes incident intake, routes to the investigating body, imposes and lifts temporary measures and converts them to permanent. Segregation of duties applies twice: the officer who imposed a measure may not convert it, and the officer who reported a case may not close it."
    exclusive_operations:
      - "POST /safesport/screening-orders/{screening_order_id}/adjudicate"
      - "POST /safesport/cases/{case_id}/route"
      - "POST /safesport/cases/{case_id}/close"
      - "POST /safesport/cases/{case_id}/interim-measures"
      - "POST /safesport/interim-measures/{interim_measure_id}/lift"
      - "POST /safesport/interim-measures/{interim_measure_id}/convert-permanent"
    shared_operations:
      - "POST /safesport/cases (with ClubAdministrator and Member)"
      - "all GET endpoints"
    forbidden_operations:
      - "POST /safesport/screening-orders/{screening_order_id}/result"
      - "POST /safesport/screening-orders/{screening_order_id}/void"
      - "POST /safesport/members/{member_id}/screening-orders"
      - "POST /safesport/club-audits and its findings, finalize, close"
      - "POST /safesport/interim-measures/{interim_measure_id}/convert-permanent when X-User-ID equals InterimMeasure.imposed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
      - "POST /safesport/cases/{case_id}/close when X-User-ID equals Case.reporter_user_id (ERR_SEGREGATION_OF_DUTIES)"
  - role: ComplianceAuditor
    identity: opaque
    description: "Independent auditor of member organizations. Opens audits, writes findings, finalizes the compliance score under the audit's variant, rejects or waives remediation and sanctions noncompliant clubs. Never touches screening, cases or measures."
    exclusive_operations:
      - "POST /safesport/club-audits"
      - "POST /safesport/club-audits/{club_audit_id}/findings"
      - "POST /safesport/club-audits/{club_audit_id}/finalize"
      - "POST /safesport/club-audits/{club_audit_id}/close"
    shared_operations:
      - "POST /safesport/audit-findings/{audit_finding_id}/decision (with ClubAdministrator, but only decision = REMEDIATION_REJECTED or WAIVED)"
      - "all GET endpoints"
    forbidden_operations:
      - "POST /safesport/members and /safesport/members/{member_id}/renew"
      - "POST /safesport/members/{member_id}/screening-orders"
      - "POST /safesport/cases/{case_id}/interim-measures"
      - "POST /safesport/coach-assignments and its activate"
      - "POST /safesport/audit-findings/{audit_finding_id}/decision with decision = REMEDIATION_SUBMITTED (ERR_DECISION_ROLE_MISMATCH)"
  - role: Member
    identity: entity_backed:Member
    description: "A registered coach or volunteer; X-User-ID is the id of that Member row (identity entity_backed:Member). May only act on their own training assignments and may only read their own record; addressing another member's resource yields ERR_UNAUTHORIZED."
    exclusive_operations: []
    shared_operations:
      - "POST /safesport/training-assignments/{training_assignment_id}/start (with ClubAdministrator)"
      - "POST /safesport/training-assignments/{training_assignment_id}/complete (with ClubAdministrator)"
      - "POST /safesport/cases (with SafeSportOfficer and ClubAdministrator)"
      - "GET /safesport/members/{member_id} and its sub-resources for their own member_id only"
    forbidden_operations:
      - "every club, screening-order, coach-assignment, interim-measure and audit write"
      - "POST /safesport/training-assignments/{training_assignment_id}/start or /complete on an assignment belonging to another member (ERR_UNAUTHORIZED)"
      - "GET /safesport/members/{member_id} for a member_id other than their own (ERR_UNAUTHORIZED)"
