scenario: |
  Fair Grandstand & Entertainment Booking (state fair entertainment department): talent buying with
  agent negotiation on guarantees, backend splits and radius clauses, show date sequencing across the
  fair run with genre diversity and audience targeting, ticket pricing strategy with fair admission
  bundling and reserved versus general admission mixes, production advance including staging, sound,
  lighting and hospitality riders, sponsorship integration with stage naming and activation rights,
  settlement with artists on gross ticket sales, expenses and merchandise splits, weather contingency
  planning with cancellation, postponement and refund policies, attendance and revenue analysis
  feeding the next year's buying strategy.
domain_name: fair-grandstand-entertainment-booking
api_prefix: "/grandstand"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # Peer aggregates linked by explicit foreign keys plus two junction-shaped entities
  # (SponsorshipActivation joins Sponsor x ShowBooking; OfferRound joins the negotiation
  # log to Offer) and one self-referential edge (ShowBooking.postponed_from_booking_id).
  # Only three URL paths nest; everything else is flat with FK filters.

  state_machine_shape: cyclic
  # Offer: DRAFT -> SENT -> COUNTERED -> SENT -> ... (negotiation rounds, capped at
  # MAX_NEGOTIATION_ROUNDS). Settlement: DRAFT -> PENDING_APPROVAL -> DRAFT (reject loop).
  # ShowBooking additionally carries two independent state dimensions
  # (booking_status x ticketing_status) that join on an auto-transition to ON_SALE.
  # ProductionAdvance branches ADVANCE_IN_REVIEW -> {ADVANCE_COMPLETE, ADVANCE_BLOCKED}
  # with a revert edge back to ADVANCE_IN_REVIEW.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The operator id that submits a Settlement can never be the operator id that approves it,
  # and the TalentBuyer side of a negotiation can never perform the TalentAgent side's
  # counter/accept/decline actions.

  consistency_model: immediate

  difficulty_level: expert

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: FairEdition
    parent: null
    common_fields: true
    fields:
      - name: year
        type: integer
        source: input
        description: Calendar year of this fair run; unique across FairEdition rows.
        constraints: "1900 <= year <= 2200; unique"
      - name: name
        type: string
        source: input
        description: Display name of the fair edition.
      - name: run_start_date
        type: string
        source: input
        description: First calendar date of the fair run, format YYYY-MM-DD.
        constraints: "must parse as a date; run_start_date <= run_end_date"
      - name: run_end_date
        type: string
        source: input
        description: Last calendar date of the fair run, inclusive, format YYYY-MM-DD.
        constraints: "must parse as a date; run_end_date >= run_start_date"
      - name: gate_admission_price_cents
        type: integer
        source: input
        description: Price of a general fair gate admission, in integer cents.
        constraints: ">= 0"
      - name: talent_budget_cap_cents
        type: integer
        source: input
        description: Hard ceiling on committed_guarantee_total_cents for this edition, integer cents.
        constraints: ">= 0"
      - name: max_shows_per_day
        type: integer
        source: input
        description: Maximum number of held offers plus live bookings allowed on any single calendar date across every Stage of this edition.
        default: 2
        constraints: ">= 1"
      - name: curfew_utc_time
        type: string
        source: input
        description: Municipal curfew as a UTC time-of-day, format HH:MM; a slot's load_out_end_utc may not exceed show_date at this UTC time.
        default: "23:30"
        constraints: "format HH:MM, 00:00-23:59"
      - name: strategy_basis
        type: enum
        source: input
        description: Selects which variant of the artist_draw_score calculation is applied when a Settlement for this edition is approved.
        default: ATTENDANCE_WEIGHTED
        constraints: "one of {ATTENDANCE_WEIGHTED, REVENUE_WEIGHTED}"
      - name: refund_reserve_cents
        type: integer
        source: input
        description: Pool of cash reserved for weather refunds across the edition, integer cents.
        constraints: ">= 0"
      - name: committed_guarantee_total_cents
        type: integer
        source: computed
        description: Derived encumbrance ledger over this edition's Offers; recomputed by calculations.edition_committed_guarantee_total.
        default: 0
      - name: refund_liability_committed_cents
        type: integer
        source: computed
        description: Sum of refund_liability_cents over every ContingencyAction whose booking belongs to this edition.
        default: 0
      - name: open_stage_count
        type: integer
        source: computed
        description: Count of this edition's Stage rows whose booking_posture == OPEN; recomputed whenever any Stage posture flips.
        default: 0

  - name: Stage
    parent: FairEdition
    common_fields: true
    fields:
      - name: fair_edition_id
        type: string
        source: input
        description: "FK -> FairEdition.id; the edition this stage belongs to."
      - name: name
        type: string
        source: input
        description: Stage name, e.g. Grandstand or Free Stage.
        constraints: "unique per fair_edition_id"
      - name: reserved_seat_capacity
        type: integer
        source: input
        description: Physical count of reserved seats available for RESERVED ticket scales.
        constraints: ">= 0"
      - name: ga_capacity
        type: integer
        source: input
        description: Physical count of general-admission positions available for GENERAL_ADMISSION ticket scales.
        constraints: ">= 0"
      - name: changeover_buffer_minutes
        type: integer
        source: input
        description: Minutes of load-out/load-in changeover that must separate two occupations of this stage.
        default: 120
        constraints: ">= 0"
      - name: slot_soft_cap
        type: integer
        source: input
        description: Number of concurrent held slots at which this stage's booking_posture flips from OPEN to SATURATED.
        default: 3
        constraints: ">= 1"
      - name: held_show_count
        type: integer
        source: computed
        description: Derived slot ledger for this stage; recomputed by calculations.stage_hold_ledger.
        default: 0
      - name: booking_posture
        type: enum
        source: computed
        description: OPEN while held_show_count < slot_soft_cap, SATURATED once held_show_count >= slot_soft_cap.
        default: OPEN
        constraints: "one of {OPEN, SATURATED}"

  - name: TalentAgent
    parent: null
    common_fields: true
    fields:
      - name: user_id
        type: string
        source: input
        description: The X-User-ID this agent authenticates as; the TalentAgent role is entity-backed through this field, so a request whose X-User-ID matches no TalentAgent.user_id is refused with ERR_UNKNOWN_ACTOR_IDENTITY.
        constraints: "unique across TalentAgent rows"
      - name: agency_name
        type: string
        source: input
        description: Booking agency this agent works for.
      - name: contact_email
        type: string
        source: input
        description: Contact email for offer correspondence.
      - name: roster_artist_count
        type: integer
        source: computed
        description: Count of Artist rows whose agent_id equals this agent's id.
        default: 0

  - name: Artist
    parent: null
    common_fields: true
    fields:
      - name: agent_id
        type: string
        source: input
        description: "FK -> TalentAgent.id; the only agent authorized to counter, accept or decline offers for this artist."
      - name: name
        type: string
        source: input
        description: Artist or act name.
      - name: genre
        type: enum
        source: input
        description: Programming genre used by the genre-adjacency and diversity rules.
        constraints: "one of {COUNTRY, ROCK, HIP_HOP, LATIN, CHRISTIAN, COMEDY, TRIBUTE}"
      - name: audience_segment
        type: enum
        source: input
        description: Target audience segment used by the diversity index.
        constraints: "one of {FAMILY, YOUNG_ADULT, ADULT_45_PLUS, TEEN}"
      - name: base_draw_score
        type: number
        source: input
        description: Draw score carried into this buying cycle, 2 decimal places.
        default: 50.00
        constraints: "0.00 <= base_draw_score <= 100.00"
      - name: prior_year_paid_attendance
        type: integer
        source: input
        description: Paid attendance this act drew at the previous edition; reference data only.
        default: 0
        constraints: ">= 0"
      - name: prior_year_net_revenue_cents
        type: integer
        source: input
        description: Net pool this act produced at the previous edition, integer cents; reference data only.
        default: 0
      - name: draw_score_next_year
        type: number
        source: computed
        description: Rescored draw value written when a Settlement covering one of this artist's bookings reaches APPROVED; null until then.
        default: null
        constraints: "0.00 <= draw_score_next_year <= 100.00 when set"

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - name: fair_edition_id
        type: string
        source: input
        description: "FK -> FairEdition.id; the edition whose budget this offer encumbers."
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the act being bought."
      - name: target_stage_id
        type: string
        source: input
        description: "FK -> Stage.id; the stage whose slot this offer holds while status IN {SENT, COUNTERED}."
      - name: deal_type
        type: enum
        source: input
        description: Selects which artist_payout_cents variant the resulting settlement uses.
        constraints: "one of {VERSUS, GUARANTEE_PLUS_BACKEND}"
      - name: offered_guarantee_cents
        type: integer
        source: input
        description: The buyer's current standing guarantee, integer cents; rewritten by POST /offers/{id}/revise.
        constraints: ">= 0"
      - name: backend_split_pct
        type: number
        source: input
        description: Artist share of the backend pool, 4 decimal places.
        constraints: "0.0000 <= backend_split_pct <= 1.0000"
      - name: backend_breakeven_cents
        type: integer
        source: input
        description: Net-pool figure above which the GUARANTEE_PLUS_BACKEND variant pays a split; ignored by the VERSUS variant.
        default: 0
        constraints: ">= 0"
      - name: radius_miles
        type: integer
        source: input
        description: Radius-clause exclusion distance in miles; every other engagement inside this fair sits at distance 0 miles.
        default: 150
        constraints: ">= 0"
      - name: radius_days_before
        type: integer
        source: input
        description: Days before the show date covered by the radius clause, inclusive.
        default: 30
        constraints: ">= 0"
      - name: radius_days_after
        type: integer
        source: input
        description: Days after the show date covered by the radius clause, inclusive.
        default: 30
        constraints: ">= 0"
      - name: target_show_date
        type: string
        source: input
        description: Requested performance date, format YYYY-MM-DD.
      - name: load_in_start_utc
        type: datetime
        source: input
        description: Start of this offer's stage occupation, ISO 8601 UTC with three fractional digits.
      - name: load_out_end_utc
        type: datetime
        source: input
        description: End of this offer's stage occupation, ISO 8601 UTC with three fractional digits.
      - name: response_window_hours
        type: integer
        source: input
        description: Hours the agent has to respond after the offer is sent.
        default: 48
        constraints: ">= 1"
      - name: radius_waiver_granted
        type: boolean
        source: computed
        description: Set true when the agent passes grant_radius_waiver on POST /offers/{id}/counter; a waived radius clause never blocks a later offer for the same artist.
        default: false
      - name: status
        type: enum
        source: computed
        description: Negotiation state; see state_machines[entity=Offer].
        default: DRAFT
        constraints: "one of {DRAFT, SENT, COUNTERED, ACCEPTED, DECLINED, WITHDRAWN, EXPIRED}"
      - name: round_count
        type: integer
        source: computed
        description: Count of OfferRound rows whose offer_id equals this offer's id.
        default: 0
      - name: countered_guarantee_cents
        type: integer
        source: computed
        description: Guarantee the agent asked for on the most recent AGENT round; null until the first counter, cleared back to null by a revise.
        default: null
      - name: agreed_guarantee_cents
        type: integer
        source: computed
        description: Snapshot of offered_guarantee_cents taken when status becomes ACCEPTED; null in every other status.
        default: null
      - name: sent_at_utc
        type: datetime
        source: system
        description: Logical-clock instant at which the offer was last sent or revised; null while DRAFT.
        default: null
      - name: expires_at_utc
        type: datetime
        source: computed
        description: sent_at_utc plus response_window_hours; the offer is expired once the logical clock reaches this instant.
        default: null
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the TalentBuyer that created the offer.

  - name: OfferRound
    parent: Offer
    common_fields: false
    fields:
      - name: offer_id
        type: string
        source: system
        description: "FK -> Offer.id; the negotiation this round belongs to."
      - name: round_number
        type: integer
        source: computed
        description: 1-based position of this round within its offer, assigned as offer.round_count + 1 at write time.
      - name: proposed_by
        type: enum
        source: system
        description: BUYER for send and revise rounds, AGENT for counter rounds.
        constraints: "one of {BUYER, AGENT}"
      - name: proposed_guarantee_cents
        type: integer
        source: input
        description: Guarantee proposed on this round, integer cents.
        constraints: ">= 0"
      - name: proposed_backend_split_pct
        type: number
        source: input
        description: Backend split proposed on this round, 4 decimal places.
        constraints: "0.0000 <= proposed_backend_split_pct <= 1.0000"
      - name: proposed_breakeven_cents
        type: integer
        source: input
        description: Backend breakeven proposed on this round, integer cents.
        default: 0
        constraints: ">= 0"
      - name: note
        type: string
        source: input
        description: Free-text negotiation note.
        default: null
      - name: recorded_at_utc
        type: datetime
        source: system
        description: Logical-clock instant at which this round was written; chronological replay orders rounds by recorded_at_utc ASC, tie-break created_at ASC.

  - name: ShowBooking
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: system
        description: "FK -> Offer.id; the accepted offer this booking materializes."
      - name: stage_id
        type: string
        source: system
        description: "FK -> Stage.id; the stage this booking occupies."
      - name: postponed_from_booking_id
        type: string
        source: system
        description: "FK -> ShowBooking.id; set on a replacement booking created by a POSTPONE contingency action, null on an original booking."
        default: null
      - name: show_date
        type: string
        source: system
        description: Performance date, format YYYY-MM-DD; copied from the offer at accept, rewritten by reschedule.
      - name: load_in_start_utc
        type: datetime
        source: system
        description: Start of the stage occupation; copied from the offer at accept, rewritten by reschedule.
      - name: load_out_end_utc
        type: datetime
        source: system
        description: End of the stage occupation; copied from the offer at accept, rewritten by reschedule.
      - name: doors_time_utc
        type: datetime
        source: system
        description: Instant the gates open for this show; null until POST /show-bookings/{id}/announce supplies it.
        default: null
      - name: booking_status
        type: enum
        source: computed
        description: Contractual dimension of the booking; evolves independently of ticketing_status.
        default: DATE_HELD
        constraints: "one of {DATE_HELD, ANNOUNCED, PERFORMED, CANCELLED, POSTPONED}"
      - name: ticketing_status
        type: enum
        source: computed
        description: Box-office dimension of the booking; evolves independently of booking_status and joins with it on the auto-transition to ON_SALE.
        default: SCALED_PENDING
        constraints: "one of {SCALED_PENDING, SCALED, ON_SALE, SALES_CLOSED, REFUNDING, REFUNDED}"
      - name: agreed_guarantee_cents
        type: integer
        source: system
        description: Guarantee pinned from the offer at accept; immutable for the life of the booking.
      - name: agreed_deal_type
        type: enum
        source: system
        description: deal_type pinned from the offer at accept; immutable.
        constraints: "one of {VERSUS, GUARANTEE_PLUS_BACKEND}"
      - name: agreed_backend_split_pct
        type: number
        source: system
        description: backend_split_pct pinned from the offer at accept, 4 decimal places; immutable.
      - name: agreed_breakeven_cents
        type: integer
        source: system
        description: backend_breakeven_cents pinned from the offer at accept; immutable.
      - name: gross_potential_cents
        type: integer
        source: computed
        description: Sum of scale_gross_potential_cents over this booking's TicketScale rows; recomputed by calculations.ticket_gross_potential.
        default: 0
      - name: sponsorship_revenue_cents
        type: integer
        source: computed
        description: Sum of net_fee_cents over this booking's SponsorshipActivation rows whose status IN {CONFIRMED, FULFILLED}.
        default: 0
      - name: recoupable_production_cost_cents
        type: integer
        source: computed
        description: Mirror of the booking's ProductionAdvance.recoupable_rider_cost_cents; 0 when no advance exists or the advance is ADVANCE_CANCELLED.
        default: 0
      - name: paid_attendance
        type: integer
        source: computed
        description: Sum of sold_seats over this booking's TicketScale rows, counting only sale batches whose counts_toward_paid_attendance is true.
        default: 0
      - name: refund_liability_cents
        type: integer
        source: computed
        description: refund_liability_cents of the most recent ContingencyAction on this booking ordered by decided_at_utc ASC then created_at ASC; 0 when none exists.
        default: 0
      - name: announced_at_utc
        type: datetime
        source: system
        description: Logical-clock instant of the announce transition; null before it.
        default: null

  - name: TicketScale
    parent: ShowBooking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: system
        description: "FK -> ShowBooking.id; the show this price tier belongs to."
      - name: seating_type
        type: enum
        source: input
        description: Which physical capacity pool this tier draws from.
        constraints: "one of {RESERVED, GENERAL_ADMISSION}"
      - name: tier_name
        type: string
        source: input
        description: Tier label, e.g. GOLD or LAWN.
        constraints: "unique per booking_id"
      - name: face_price_cents
        type: integer
        source: input
        description: Face value of one ticket in this tier, integer cents; the artist gross is computed off this figure.
        constraints: ">= 0"
      - name: allotment_seats
        type: integer
        source: input
        description: Number of seats or positions allotted to this tier.
        constraints: ">= 1"
      - name: bundled_with_gate_admission
        type: boolean
        source: input
        description: When true the ticket includes fair gate admission and a gate credit is carved out of the face price before the artist gross.
        default: false
      - name: facility_fee_cents
        type: integer
        source: input
        description: Per-ticket facility fee the patron pays on top of face value; promoter income, excluded from the artist gross, included in refunds.
        default: 0
        constraints: ">= 0"
      - name: sold_seats
        type: integer
        source: computed
        description: Net units held by patrons for this tier, computed as sum of SALE quantities minus sum of REFUND quantities over this tier's TicketSaleBatch rows.
        default: 0
      - name: available_seats
        type: integer
        source: computed
        description: allotment_seats minus sold_seats; the seat-conservation invariant keeps this identity exact.
        default: 0
      - name: scale_gross_potential_cents
        type: integer
        source: computed
        description: This line's contribution to booking.gross_potential_cents; see calculations.ticket_gross_potential.
        default: 0
      - name: status
        type: enum
        source: computed
        description: ON_SALE_ELIGIBLE at creation, REFUND_DUE after a CANCEL contingency action, CLOSED after the show is marked performed.
        default: ON_SALE_ELIGIBLE
        constraints: "one of {ON_SALE_ELIGIBLE, REFUND_DUE, CLOSED}"

  - name: TicketSaleBatch
    parent: TicketScale
    common_fields: false
    fields:
      - name: ticket_scale_id
        type: string
        source: system
        description: "FK -> TicketScale.id; the price tier this batch moves units in."
      - name: batch_kind
        type: enum
        source: input
        description: SALE adds units to the tier, REFUND removes them.
        constraints: "one of {SALE, REFUND}"
      - name: quantity
        type: integer
        source: input
        description: Units moved by this batch, always a positive count regardless of batch_kind.
        constraints: ">= 1"
      - name: channel
        type: enum
        source: input
        description: Sales channel; COMP units never count toward paid attendance or gross.
        constraints: "one of {ONLINE, BOX_OFFICE, PHONE, COMP}"
      - name: recorded_at_utc
        type: datetime
        source: system
        description: Logical-clock instant of this batch; the PROVISIONAL settlement basis includes only batches with recorded_at_utc strictly before booking.doors_time_utc.
      - name: counts_toward_paid_attendance
        type: boolean
        source: computed
        description: False when channel == COMP, true otherwise.
      - name: gross_cents
        type: integer
        source: computed
        description: Informational per-batch artist gross contribution, round_half_up((face_price_cents - bundle_credit_cents) * quantity * (1 - ADMISSION_TAX_RATE)); 0 when channel == COMP.
        default: 0

  - name: ProductionAdvance
    parent: ShowBooking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: system
        description: "FK -> ShowBooking.id; the show this advance prepares."
      - name: status
        type: enum
        source: computed
        description: Production advance state; see state_machines[entity=ProductionAdvance].
        default: ADVANCE_PENDING
        constraints: "one of {ADVANCE_PENDING, ADVANCE_IN_REVIEW, ADVANCE_COMPLETE, ADVANCE_BLOCKED, ADVANCE_CANCELLED}"
      - name: approved_rider_cost_cents
        type: integer
        source: computed
        description: Sum of approved_cost_cents over this advance's RiderItem rows whose status IN {APPROVED, SUBSTITUTED}.
        default: 0
      - name: recoupable_rider_cost_cents
        type: integer
        source: computed
        description: Sum of approved_cost_cents over this advance's RiderItem rows whose status IN {APPROVED, SUBSTITUTED} and artist_recoupable is true.
        default: 0
      - name: denied_item_count
        type: integer
        source: computed
        description: Count of this advance's RiderItem rows whose status == DENIED.
        default: 0
      - name: blocked_reason_code
        type: enum
        source: computed
        description: Reason the advance is ADVANCE_BLOCKED; null in every other status.
        default: null
        constraints: "one of {DENIED_CRITICAL_ITEM, MISSING_STAGE_PLOT} or null"

  - name: RiderItem
    parent: ProductionAdvance
    common_fields: true
    fields:
      - name: production_advance_id
        type: string
        source: system
        description: "FK -> ProductionAdvance.id; the advance this rider line belongs to."
      - name: category
        type: enum
        source: input
        description: Rider department.
        constraints: "one of {STAGING, SOUND, LIGHTING, HOSPITALITY}"
      - name: description
        type: string
        source: input
        description: What the artist asked for.
      - name: requested_cost_cents
        type: integer
        source: input
        description: Cost the artist's production manager quoted, integer cents.
        constraints: ">= 0"
      - name: is_critical
        type: boolean
        source: input
        description: When true a DENIED ruling on this line blocks the whole advance.
        default: false
      - name: artist_recoupable
        type: boolean
        source: input
        description: When true the approved cost is deducted from the artist's settlement.
        default: false
      - name: status
        type: enum
        source: computed
        description: Ruling state of this line; see state_machines[entity=ProductionAdvance] side effects.
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, DENIED, SUBSTITUTED, VOIDED}"
      - name: approved_cost_cents
        type: integer
        source: computed
        description: requested_cost_cents when status == APPROVED, the substituted figure when status == SUBSTITUTED, 0 when status IN {REQUESTED, DENIED, VOIDED}.
        default: 0

  - name: Sponsor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Sponsor company name.
      - name: category
        type: enum
        source: input
        description: Trade category used for on-show exclusivity conflicts.
        constraints: "one of {BEVERAGE, AUTOMOTIVE, TELECOM, AGRIBUSINESS, FINANCIAL, QSR}"
      - name: exclusivity_tier
        type: enum
        source: input
        description: PRESENTING sponsors pay an activation premium; SUPPORTING sponsors do not.
        constraints: "one of {PRESENTING, SUPPORTING}"

  - name: SponsorshipActivation
    parent: null
    common_fields: true
    fields:
      - name: sponsor_id
        type: string
        source: input
        description: "FK -> Sponsor.id; the sponsor buying these rights."
      - name: booking_id
        type: string
        source: input
        description: "FK -> ShowBooking.id; the show these rights attach to."
      - name: rights
        type: enum
        source: input
        description: Rights package purchased; STAGE_NAMING is unique per stage per edition.
        constraints: "one of {STAGE_NAMING, PRESENTING, SAMPLING, SIGNAGE}"
      - name: base_fee_cents
        type: integer
        source: input
        description: Pre-premium activation fee, integer cents.
        constraints: ">= 0"
      - name: exclusivity_category
        type: enum
        source: input
        description: Trade category locked out on this show while the activation is CONFIRMED or FULFILLED.
        constraints: "one of {BEVERAGE, AUTOMOTIVE, TELECOM, AGRIBUSINESS, FINANCIAL, QSR}"
      - name: status
        type: enum
        source: computed
        description: Activation state; see state_machines[entity=SponsorshipActivation].
        default: PROPOSED
        constraints: "one of {PROPOSED, CONFIRMED, FULFILLED, CANCELLED}"
      - name: net_fee_cents
        type: integer
        source: computed
        description: Premium-adjusted fee written at creation by calculations.activation_net_fee.
        default: 0
      - name: make_good_credit_cents
        type: integer
        source: computed
        description: Credit owed back to the sponsor when the activation is cancelled by a CANCEL contingency action; 0 otherwise.
        default: 0

  - name: Settlement
    parent: ShowBooking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: system
        description: "FK -> ShowBooking.id; the show being settled."
      - name: basis
        type: enum
        source: input
        description: PROVISIONAL restricts the sales input set to batches recorded strictly before doors, FINAL admits every non-COMP batch.
        default: FINAL
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: merch_gross_cents
        type: integer
        source: input
        description: Merchandise gross reported at the settlement table, integer cents.
        default: 0
        constraints: ">= 0"
      - name: merch_seller
        type: enum
        source: input
        description: Who sold merchandise, which selects the hall-fee rate.
        default: ARTIST
        constraints: "one of {ARTIST, VENUE}"
      - name: adjusted_gross_cents
        type: integer
        source: computed
        description: Artist gross ticket sales for the selected basis; see calculations.settlement_adjusted_gross.
        default: 0
      - name: sponsorship_offset_cents
        type: integer
        source: computed
        description: Share of booking.sponsorship_revenue_cents credited into the show's pool.
        default: 0
      - name: base_promoter_expense_cents
        type: integer
        source: computed
        description: Approved rider cost plus the flat promoter expense, before the production surcharge.
        default: 0
      - name: provisional_net_pool_cents
        type: integer
        source: computed
        description: Pool used to size the artist payout, floored at 0; the pinned evaluation order computes this before the surcharge exists.
        default: 0
      - name: artist_payout_cents
        type: integer
        source: computed
        description: Deal-variant payout on the provisional net pool; see calculations.artist_payout.
        default: 0
      - name: production_surcharge_cents
        type: integer
        source: computed
        description: Surcharge derived from artist_payout_cents; never fed back into artist_payout_cents.
        default: 0
      - name: promoter_expense_cents
        type: integer
        source: computed
        description: base_promoter_expense_cents plus production_surcharge_cents.
        default: 0
      - name: net_pool_cents
        type: integer
        source: computed
        description: provisional_net_pool_cents minus production_surcharge_cents; the figure the buying-strategy report consumes.
        default: 0
      - name: merch_hall_fee_cents
        type: integer
        source: computed
        description: Venue merchandise fee; see calculations.merch_split.
        default: 0
      - name: merch_artist_share_cents
        type: integer
        source: computed
        description: merch_gross_cents minus merch_hall_fee_cents.
        default: 0
      - name: total_artist_settlement_cents
        type: integer
        source: computed
        description: artist_payout_cents plus merch_artist_share_cents minus the booking's recoupable_production_cost_cents; may be negative before validation rejects it.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Settlement approval state; see state_machines[entity=Settlement].
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_APPROVAL, APPROVED}"
      - name: revision_count
        type: integer
        source: computed
        description: Number of times this settlement has been rejected back to DRAFT.
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID that performed the most recent submit; null while never submitted.
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID that approved the settlement; null until APPROVED.
        default: null
      - name: rejection_reason_code
        type: enum
        source: computed
        description: Reason code of the most recent rejection; null until first rejected.
        default: null
        constraints: "one of {GROSS_MISMATCH, EXPENSE_UNSUPPORTED, MERCH_MISSING} or null"

  - name: ContingencyAction
    parent: ShowBooking
    common_fields: false
    fields:
      - name: booking_id
        type: string
        source: system
        description: "FK -> ShowBooking.id; the show this weather or force-majeure decision applies to."
      - name: action_type
        type: enum
        source: input
        description: CANCEL kills the show, POSTPONE moves it to a replacement date.
        constraints: "one of {CANCEL, POSTPONE}"
      - name: reason_code
        type: enum
        source: input
        description: Why the decision was taken.
        constraints: "one of {SEVERE_WEATHER, LIGHTNING_HOLD, ARTIST_ILLNESS, PRODUCTION_FAILURE}"
      - name: refund_policy
        type: enum
        source: input
        description: Refund treatment applied to sold units.
        constraints: "one of {FULL_REFUND, RAIN_CHECK, NO_REFUND_AFTER_DOORS}"
      - name: replacement_show_date
        type: string
        source: input
        description: New performance date for a POSTPONE, format YYYY-MM-DD; must be null for a CANCEL.
        default: null
      - name: decided_at_utc
        type: datetime
        source: system
        description: Logical-clock instant of the decision; compared against booking.doors_time_utc to set pre_doors.
      - name: pre_doors
        type: boolean
        source: computed
        description: True when booking.doors_time_utc is null or decided_at_utc < booking.doors_time_utc; false once decided_at_utc >= doors_time_utc.
      - name: refund_liability_cents
        type: integer
        source: computed
        description: Cash refund owed to patrons for this decision; see calculations.refund_liability.
        default: 0

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Offer
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, WITHDRAWN, EXPIRED]
    note: |
      Cyclic negotiation machine. SENT -> COUNTERED -> SENT may repeat until
      round_count reaches MAX_NEGOTIATION_ROUNDS = 3, after which both counter and
      revise are refused with ERR_NEGOTIATION_ROUND_LIMIT. Every OfferRound row is
      append-only; round_count is the count of those rows.
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /grandstand/offers/{id}/send"
        actor: TalentBuyer
        preconditions:
          - "offer.status == DRAFT"
          - "run_start_date <= offer.target_show_date <= run_end_date on the offer's FairEdition (inclusive both ends)"
          - "offer.load_in_start_utc >= offer.target_show_date at 00:00:00.000Z AND offer.load_in_start_utc < offer.load_out_end_utc"
          - "offer.load_out_end_utc <= offer.target_show_date at FairEdition.curfew_utc_time (curfew gate)"
          - "no stage-slot collision on offer.target_stage_id per validations[priority=39]"
          - "no radius-clause collision for offer.artist_id per validations[priority=40]"
          - "no genre-adjacency collision per validations[priority=41]"
          - "day-slot capacity for offer.target_show_date not exceeded per validations[priority=42]"
          - "committed_guarantee_total_cents recomputed with this offer included is <= FairEdition.talent_budget_cap_cents"
        side_effects:
          - "OfferRound created with round_number = offer.round_count + 1, proposed_by = BUYER, proposed_guarantee_cents = offer.offered_guarantee_cents, proposed_backend_split_pct = offer.backend_split_pct, proposed_breakeven_cents = offer.backend_breakeven_cents, recorded_at_utc = logical clock"
          - "offer.sent_at_utc := logical clock; offer.expires_at_utc := sent_at_utc + response_window_hours; offer.round_count recomputed"
          - "recompute calculations.stage_hold_ledger for offer.target_stage_id: Stage.held_show_count increases by 1"
          - "CASCADE HOP caused by the held_show_count change: when Stage.held_show_count >= Stage.slot_soft_cap, Stage.booking_posture := SATURATED"
          - "CASCADE HOP caused by the Stage.booking_posture change: recompute FairEdition.open_stage_count as the count of the edition's stages whose booking_posture == OPEN"
          - "recompute calculations.edition_committed_guarantee_total on the offer's FairEdition"
          - "increments Offer.version by 1"
      - from: SENT
        to: COUNTERED
        trigger: "POST /grandstand/offers/{id}/counter"
        actor: TalentAgent
        preconditions:
          - "offer.status == SENT"
          - "logical clock < offer.expires_at_utc"
          - "the TalentAgent whose user_id == X-User-ID has id == Artist.agent_id of offer.artist_id"
          - "offer.round_count < 3"
        side_effects:
          - "OfferRound created with round_number = offer.round_count + 1, proposed_by = AGENT, proposed_* copied from the request body, recorded_at_utc = logical clock"
          - "offer.countered_guarantee_cents := proposed_guarantee_cents from the request"
          - "offer.radius_waiver_granted := grant_radius_waiver from the request"
          - "offer.round_count recomputed"
          - "increments Offer.version by 1"
        note: "The encumbrance ledger is untouched: committed_guarantee_total_cents tracks the buyer's standing offered_guarantee_cents, never the agent's ask."
      - from: COUNTERED
        to: SENT
        trigger: "POST /grandstand/offers/{id}/revise"
        actor: TalentBuyer
        preconditions:
          - "offer.status == COUNTERED"
          - "logical clock < offer.expires_at_utc"
          - "expected_offer_version == offer.version (concurrency_rules[offer-revise-stale-offer])"
          - "offer.round_count < 3"
          - "committed_guarantee_total_cents recomputed with offered_guarantee_cents replaced by the revised figure is <= FairEdition.talent_budget_cap_cents"
        side_effects:
          - "offer.offered_guarantee_cents, offer.backend_split_pct, offer.backend_breakeven_cents := the revised figures"
          - "offer.countered_guarantee_cents := null"
          - "offer.sent_at_utc := logical clock; offer.expires_at_utc := sent_at_utc + response_window_hours"
          - "OfferRound created with round_number = offer.round_count + 1, proposed_by = BUYER, recorded_at_utc = logical clock"
          - "recompute calculations.edition_committed_guarantee_total on the offer's FairEdition"
          - "increments Offer.version by 1"
        note: "Cycle edge. The stage hold is neither released nor re-taken, so Stage.held_show_count is unchanged by a revise."
      - from: SENT
        to: ACCEPTED
        trigger: "POST /grandstand/offers/{id}/accept"
        actor: TalentAgent
        preconditions:
          - "offer.status == SENT"
          - "logical clock < offer.expires_at_utc"
          - "the TalentAgent whose user_id == X-User-ID has id == Artist.agent_id of offer.artist_id"
        side_effects:
          - "offer.agreed_guarantee_cents := offer.offered_guarantee_cents"
          - "CASCADE HOP caused by offer.status becoming ACCEPTED: a ShowBooking is created with offer_id, stage_id = offer.target_stage_id, show_date = offer.target_show_date, load_in_start_utc / load_out_end_utc copied from the offer, booking_status = DATE_HELD, ticketing_status = SCALED_PENDING, agreed_guarantee_cents / agreed_deal_type / agreed_backend_split_pct / agreed_breakeven_cents pinned from the offer"
          - "CASCADE HOP caused by the ShowBooking row existing: a ProductionAdvance is created for that booking with status = ADVANCE_PENDING"
          - "CASCADE HOP caused by the ProductionAdvance row existing: a seed RiderItem is created on that advance with category = STAGING, description = 'Stage plot and rigging review', requested_cost_cents = 0, is_critical = true, artist_recoupable = false, status = REQUESTED"
          - "recompute calculations.edition_committed_guarantee_total (the ACCEPTED offer now contributes agreed_guarantee_cents instead of offered_guarantee_cents)"
          - "recompute calculations.stage_hold_ledger for the stage: the offer hold converts into a booking hold, so Stage.held_show_count is unchanged and Stage.booking_posture is unchanged"
          - "increments Offer.version by 1"
      - from: SENT
        to: DECLINED
        trigger: "POST /grandstand/offers/{id}/decline"
        actor: TalentAgent
        preconditions:
          - "offer.status == SENT"
          - "logical clock < offer.expires_at_utc"
          - "the TalentAgent whose user_id == X-User-ID has id == Artist.agent_id of offer.artist_id"
        side_effects:
          - "recompute calculations.stage_hold_ledger: Stage.held_show_count decreases by 1"
          - "CASCADE HOP caused by the held_show_count change: when Stage.held_show_count < Stage.slot_soft_cap, Stage.booking_posture := OPEN"
          - "CASCADE HOP caused by the Stage.booking_posture change: recompute FairEdition.open_stage_count"
          - "recompute calculations.edition_committed_guarantee_total"
          - "increments Offer.version by 1"
      - from: COUNTERED
        to: DECLINED
        trigger: "POST /grandstand/offers/{id}/decline"
        actor: TalentAgent
        preconditions:
          - "offer.status == COUNTERED"
          - "logical clock < offer.expires_at_utc"
          - "the TalentAgent whose user_id == X-User-ID has id == Artist.agent_id of offer.artist_id"
        side_effects:
          - "identical hold-release and encumbrance cascade as the SENT -> DECLINED transition"
          - "increments Offer.version by 1"
      - from: SENT
        to: WITHDRAWN
        trigger: "POST /grandstand/offers/{id}/withdraw"
        actor: TalentBuyer
        preconditions:
          - "offer.status == SENT"
        side_effects:
          - "recompute calculations.stage_hold_ledger: Stage.held_show_count decreases by 1"
          - "CASCADE HOP caused by the held_show_count change: when Stage.held_show_count < Stage.slot_soft_cap, Stage.booking_posture := OPEN"
          - "CASCADE HOP caused by the Stage.booking_posture change: recompute FairEdition.open_stage_count"
          - "recompute calculations.edition_committed_guarantee_total, restoring FairEdition.committed_guarantee_total_cents to its exact pre-send value"
          - "increments Offer.version by 1"
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /grandstand/offers/{id}/withdraw"
        actor: TalentBuyer
        preconditions:
          - "offer.status == COUNTERED"
        side_effects:
          - "identical hold-release and encumbrance cascade as the SENT -> WITHDRAWN transition"
          - "increments Offer.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /grandstand/offers/{id}/withdraw"
        actor: TalentBuyer
        preconditions:
          - "offer.status == DRAFT"
        side_effects:
          - "no hold release and no encumbrance change: a DRAFT offer never held a slot and never entered the ledger"
          - "increments Offer.version by 1"
      - from: SENT
        to: EXPIRED
        trigger: "system: evaluated before the state precondition of every POST against this offer, when the logical clock has reached offer.expires_at_utc"
        actor: system
        preconditions:
          - "offer.status == SENT"
          - "logical clock >= offer.expires_at_utc (the instant equal to expires_at_utc is already expired)"
        side_effects:
          - "recompute calculations.stage_hold_ledger: Stage.held_show_count decreases by 1"
          - "CASCADE HOP caused by the held_show_count change: when Stage.held_show_count < Stage.slot_soft_cap, Stage.booking_posture := OPEN"
          - "CASCADE HOP caused by the Stage.booking_posture change: recompute FairEdition.open_stage_count"
          - "recompute calculations.edition_committed_guarantee_total"
          - "increments Offer.version by 1"
          - "the POST that triggered the evaluation is then refused with ERR_OFFER_EXPIRED (409); the expiry itself is persisted"
      - from: COUNTERED
        to: EXPIRED
        trigger: "system: evaluated before the state precondition of every POST against this offer, when the logical clock has reached offer.expires_at_utc"
        actor: system
        preconditions:
          - "offer.status == COUNTERED"
          - "logical clock >= offer.expires_at_utc"
        side_effects:
          - "identical hold-release and encumbrance cascade as the SENT -> EXPIRED transition"
          - "increments Offer.version by 1"
          - "the POST that triggered the evaluation is then refused with ERR_OFFER_EXPIRED (409)"

  - entity: ShowBooking
    initial_state: DATE_HELD
    terminal_states: [PERFORMED, CANCELLED, POSTPONED, REFUNDED]
    note: |
      Two independent state dimensions live on one row. Dimension A (booking_status)
      runs DATE_HELD -> ANNOUNCED -> PERFORMED with CANCELLED / POSTPONED exits and a
      DATE_HELD -> DATE_HELD reschedule self-loop; its initial value is DATE_HELD.
      Dimension B (ticketing_status) runs SCALED_PENDING -> SCALED -> ON_SALE ->
      SALES_CLOSED with a REFUNDING -> REFUNDED exit; its initial value is
      SCALED_PENDING. The two dimensions join on one auto-transition: ON_SALE is
      reached only once booking_status == ANNOUNCED and ticketing_status == SCALED both
      hold, whichever of the two happens second firing the join.
    transitions:
      - from: DATE_HELD
        to: DATE_HELD
        trigger: "POST /grandstand/show-bookings/{id}/reschedule"
        actor: FairOperationsDirector
        preconditions:
          - "booking.booking_status == DATE_HELD (a booking that reached ANNOUNCED can no longer be rescheduled)"
          - "run_start_date <= new_show_date <= run_end_date on the booking's FairEdition"
          - "new_load_in_start_utc >= new_show_date at 00:00:00.000Z AND new_load_in_start_utc < new_load_out_end_utc"
          - "new_load_out_end_utc <= new_show_date at FairEdition.curfew_utc_time"
          - "no stage-slot collision, radius collision, genre-adjacency collision or day-capacity breach at the new coordinates, each evaluated with this booking excluded from the candidate set"
        side_effects:
          - "booking.show_date, booking.load_in_start_utc, booking.load_out_end_utc := the new coordinates"
          - "Stage.held_show_count unchanged: the slot moves within the same stage"
          - "increments ShowBooking.version by 1"
        note: "Self-loop edge on dimension A."
      - from: SCALED_PENDING
        to: SCALED
        trigger: "POST /grandstand/show-bookings/{id}/ticket-scales (the first TicketScale on this booking)"
        actor: BoxOfficeManager
        preconditions:
          - "booking.ticketing_status == SCALED_PENDING"
          - "booking.booking_status IN {DATE_HELD, ANNOUNCED}"
          - "expected_show_booking_version == booking.version (concurrency_rules[ticket-scale-create-stale-booking])"
        side_effects:
          - "recompute calculations.ticket_gross_potential: TicketScale.scale_gross_potential_cents is written and booking.gross_potential_cents is recomputed as the sum over the booking's scales"
          - "AUTO-TRANSITION on dimension B: when booking.booking_status == ANNOUNCED already holds, ticketing_status continues SCALED -> ON_SALE in the same request"
          - "increments ShowBooking.version by 1"
        note: "Dimension B advances on ticket-scale creation and is blind to dimension A except for the join."
      - from: DATE_HELD
        to: ANNOUNCED
        trigger: "POST /grandstand/show-bookings/{id}/announce"
        actor: FairOperationsDirector
        preconditions:
          - "booking.booking_status == DATE_HELD"
          - "the ProductionAdvance whose booking_id == this booking has status == ADVANCE_COMPLETE"
          - "the booking has at least one TicketScale row"
          - "booking.load_in_start_utc < doors_time_utc < booking.load_out_end_utc"
        side_effects:
          - "booking.doors_time_utc := doors_time_utc from the request; booking.announced_at_utc := logical clock"
          - "AUTO-TRANSITION on dimension B: when booking.ticketing_status == SCALED already holds, ticketing_status advances SCALED -> ON_SALE in the same request"
          - "increments ShowBooking.version by 1"
      - from: SCALED
        to: ON_SALE
        trigger: "system: join of the two dimensions, fired by whichever of announce / first-ticket-scale completes second"
        actor: system
        preconditions:
          - "booking.booking_status == ANNOUNCED"
          - "booking.ticketing_status == SCALED"
        side_effects:
          - "sale batches become writable: POST /grandstand/ticket-scales/{id}/sales-batches is refused with ERR_INVALID_TICKETING_STATE in every other ticketing_status"
      - from: ANNOUNCED
        to: PERFORMED
        trigger: "POST /grandstand/show-bookings/{id}/mark-performed"
        actor: FairOperationsDirector
        preconditions:
          - "booking.booking_status == ANNOUNCED"
          - "booking.ticketing_status == ON_SALE"
          - "logical clock >= booking.load_out_end_utc"
        side_effects:
          - "ticketing_status advances ON_SALE -> SALES_CLOSED in the same request"
          - "every TicketScale of the booking gets status := CLOSED"
          - "every SponsorshipActivation on the booking whose status == CONFIRMED advances to FULFILLED; booking.sponsorship_revenue_cents is unchanged because both statuses count"
          - "Stage.held_show_count unchanged: a PERFORMED booking still occupies its slot for the rest of the edition"
          - "increments ShowBooking.version by 1"
      - from: ON_SALE
        to: SALES_CLOSED
        trigger: "system: caused by the booking_status ANNOUNCED -> PERFORMED transition"
        actor: system
        preconditions:
          - "booking.ticketing_status == ON_SALE"
          - "booking.booking_status == PERFORMED"
        side_effects:
          - "no further TicketSaleBatch may be written against this booking's scales"
      - from: ANNOUNCED
        to: CANCELLED
        trigger: "POST /grandstand/show-bookings/{id}/contingency-actions with action_type = CANCEL"
        actor: FairOperationsDirector
        preconditions:
          - "booking.booking_status == ANNOUNCED"
          - "expected_show_booking_version == booking.version"
          - "the computed refund_liability_cents <= FairEdition.refund_reserve_cents - FairEdition.refund_liability_committed_cents"
        side_effects:
          - "ContingencyAction created with decided_at_utc = logical clock, pre_doors computed against booking.doors_time_utc, refund_liability_cents from calculations.refund_liability"
          - "ticketing_status := REFUNDING; booking.refund_liability_cents := the action's refund_liability_cents; FairEdition.refund_liability_committed_cents recomputed"
          - "every TicketScale of the booking gets status := REFUND_DUE"
          - "every SponsorshipActivation on the booking whose status IN {PROPOSED, CONFIRMED} becomes CANCELLED with make_good_credit_cents := net_fee_cents, and booking.sponsorship_revenue_cents is recomputed to 0"
          - "CASCADE HOP caused by booking_status becoming CANCELLED: the booking's ProductionAdvance moves to ADVANCE_CANCELLED"
          - "CASCADE HOP caused by the advance becoming ADVANCE_CANCELLED: every RiderItem of that advance whose status IN {REQUESTED, APPROVED, SUBSTITUTED, DENIED} becomes VOIDED with approved_cost_cents := 0"
          - "CASCADE HOP caused by the RiderItem rows becoming VOIDED: advance.approved_rider_cost_cents and advance.recoupable_rider_cost_cents both recompute to 0 and advance.denied_item_count recomputes to 0"
          - "CASCADE HOP caused by advance.recoupable_rider_cost_cents becoming 0: booking.recoupable_production_cost_cents recomputes to 0"
          - "recompute calculations.stage_hold_ledger: Stage.held_show_count decreases by 1, and the posture / open_stage_count cascade runs exactly as on offer withdrawal"
          - "increments ShowBooking.version by 1"
      - from: DATE_HELD
        to: CANCELLED
        trigger: "POST /grandstand/show-bookings/{id}/contingency-actions with action_type = CANCEL"
        actor: FairOperationsDirector
        preconditions:
          - "booking.booking_status == DATE_HELD"
          - "expected_show_booking_version == booking.version"
        side_effects:
          - "identical cascade to the ANNOUNCED -> CANCELLED transition; because doors_time_utc is null the action's pre_doors is true"
          - "increments ShowBooking.version by 1"
      - from: REFUNDING
        to: REFUNDED
        trigger: "system: caused by the refund_liability computation at the end of a CANCEL cascade"
        actor: system
        preconditions:
          - "booking.ticketing_status == REFUNDING"
          - "the action's refund_liability_cents == 0"
        side_effects:
          - "nothing is owed to patrons, so the box-office dimension closes immediately in the same request"
      - from: ANNOUNCED
        to: POSTPONED
        trigger: "POST /grandstand/show-bookings/{id}/contingency-actions with action_type = POSTPONE"
        actor: FairOperationsDirector
        preconditions:
          - "booking.booking_status == ANNOUNCED"
          - "expected_show_booking_version == booking.version"
          - "replacement_show_date is present and satisfies run_start_date <= replacement_show_date <= run_end_date"
          - "the replacement coordinates clear the stage-slot, genre-adjacency and day-capacity checks with this booking excluded"
        side_effects:
          - "ContingencyAction created with decided_at_utc = logical clock and refund_liability_cents from calculations.refund_liability"
          - "under refund_policy == RAIN_CHECK the original booking's ticketing_status := SALES_CLOSED and refund_liability_cents == 0; under refund_policy == FULL_REFUND the original's ticketing_status := REFUNDING with the full computed liability"
          - "CASCADE HOP caused by booking_status becoming POSTPONED: a replacement ShowBooking is created on the same stage with postponed_from_booking_id = this booking's id, show_date = replacement_show_date, load_in_start_utc / load_out_end_utc shifted onto the replacement date preserving the original time-of-day, booking_status = DATE_HELD, ticketing_status = SCALED_PENDING and every agreed_* term copied unchanged"
          - "CASCADE HOP caused by the replacement ShowBooking existing: a ProductionAdvance is created for the replacement with status = ADVANCE_PENDING"
          - "CASCADE HOP caused by the replacement advance existing: a seed RiderItem is created on it with category = STAGING, is_critical = true, requested_cost_cents = 0"
          - "the original booking's ProductionAdvance moves to ADVANCE_CANCELLED and its RiderItem rows are VOIDED, exactly as in the CANCEL cascade"
          - "recompute calculations.stage_hold_ledger: the original hold is released and the replacement takes one, leaving Stage.held_show_count unchanged"
          - "increments ShowBooking.version by 1"
      - from: DATE_HELD
        to: POSTPONED
        trigger: "POST /grandstand/show-bookings/{id}/contingency-actions with action_type = POSTPONE"
        actor: FairOperationsDirector
        preconditions:
          - "booking.booking_status == DATE_HELD"
          - "expected_show_booking_version == booking.version"
          - "replacement_show_date is present and inside the fair run"
        side_effects:
          - "identical cascade to the ANNOUNCED -> POSTPONED transition; with no sold units the computed refund_liability_cents is 0"
          - "increments ShowBooking.version by 1"

  - entity: ProductionAdvance
    initial_state: ADVANCE_PENDING
    terminal_states: [ADVANCE_COMPLETE, ADVANCE_CANCELLED]
    note: |
      Branching machine with a revert edge. ADVANCE_IN_REVIEW forks into
      ADVANCE_COMPLETE (all lines ruled, stage plot cleared) or ADVANCE_BLOCKED
      (a critical line was denied) with entirely different side-effect sets, and
      ADVANCE_BLOCKED reverts to ADVANCE_IN_REVIEW when the denied critical line is
      re-ruled as SUBSTITUTED.
    transitions:
      - from: ADVANCE_PENDING
        to: ADVANCE_IN_REVIEW
        trigger: "POST /grandstand/production-advances/{id}/rider-items"
        actor: ProductionManager
        preconditions:
          - "advance.status == ADVANCE_PENDING"
          - "the advance's booking has booking_status IN {DATE_HELD, ANNOUNCED}"
        side_effects:
          - "RiderItem created with status = REQUESTED and approved_cost_cents = 0"
          - "increments ProductionAdvance.version by 1"
      - from: ADVANCE_IN_REVIEW
        to: ADVANCE_BLOCKED
        trigger: "POST /grandstand/rider-items/{id}/rule with decision = DENIED on an item whose is_critical is true"
        actor: ProductionManager
        preconditions:
          - "advance.status == ADVANCE_IN_REVIEW"
          - "rider_item.status == REQUESTED"
          - "rider_item.is_critical == true"
        side_effects:
          - "rider_item.status := DENIED and rider_item.approved_cost_cents := 0"
          - "advance.denied_item_count recomputed; advance.blocked_reason_code := DENIED_CRITICAL_ITEM"
          - "branch-specific: the booking cannot be announced while the advance is ADVANCE_BLOCKED"
          - "increments ProductionAdvance.version by 1"
      - from: ADVANCE_BLOCKED
        to: ADVANCE_IN_REVIEW
        trigger: "POST /grandstand/rider-items/{id}/rule with decision = SUBSTITUTED on the denied critical item"
        actor: ProductionManager
        preconditions:
          - "advance.status == ADVANCE_BLOCKED"
          - "rider_item.status == DENIED"
          - "substituted_cost_cents is present and <= rider_item.requested_cost_cents"
        side_effects:
          - "rider_item.status := SUBSTITUTED and rider_item.approved_cost_cents := substituted_cost_cents"
          - "advance.blocked_reason_code := null; advance.denied_item_count recomputed"
          - "advance.approved_rider_cost_cents and advance.recoupable_rider_cost_cents recomputed"
          - "CASCADE HOP caused by advance.recoupable_rider_cost_cents changing: booking.recoupable_production_cost_cents is recomputed to match"
          - "increments ProductionAdvance.version by 1"
        note: "Revert edge closing the branch."
      - from: ADVANCE_IN_REVIEW
        to: ADVANCE_COMPLETE
        trigger: "POST /grandstand/production-advances/{id}/complete"
        actor: ProductionManager
        preconditions:
          - "advance.status == ADVANCE_IN_REVIEW"
          - "no RiderItem of this advance has status == REQUESTED"
          - "the seed STAGING RiderItem of this advance has status IN {APPROVED, SUBSTITUTED}"
        side_effects:
          - "advance.approved_rider_cost_cents and advance.recoupable_rider_cost_cents recomputed"
          - "CASCADE HOP caused by advance.recoupable_rider_cost_cents changing: booking.recoupable_production_cost_cents is recomputed to match"
          - "branch-specific: the booking's DATE_HELD -> ANNOUNCED transition becomes reachable"
          - "increments ProductionAdvance.version by 1"
      - from: ADVANCE_IN_REVIEW
        to: ADVANCE_CANCELLED
        trigger: "system: caused by the booking's transition to CANCELLED or POSTPONED"
        actor: system
        preconditions:
          - "advance.status IN {ADVANCE_PENDING, ADVANCE_IN_REVIEW, ADVANCE_BLOCKED, ADVANCE_COMPLETE}"
        note: "ADVANCE_IN_REVIEW is named as the representative source, but this system edge fires from every non-terminal advance state, including ADVANCE_COMPLETE - an ANNOUNCED show that is cancelled or postponed necessarily has a completed advance."
        side_effects:
          - "every RiderItem of the advance becomes VOIDED with approved_cost_cents := 0"
          - "advance.approved_rider_cost_cents, advance.recoupable_rider_cost_cents and advance.denied_item_count all recompute to 0; blocked_reason_code := null"
          - "increments ProductionAdvance.version by 1"
      - from: ADVANCE_IN_REVIEW
        to: ADVANCE_IN_REVIEW
        trigger: "POST /grandstand/rider-items/{id}/rule with decision IN {APPROVED, SUBSTITUTED} on any item, or decision = DENIED on an item whose is_critical is false"
        actor: ProductionManager
        preconditions:
          - "advance.status == ADVANCE_IN_REVIEW"
          - "rider_item.status == REQUESTED"
          - "decision == DENIED implies rider_item.is_critical == false"
          - "decision == SUBSTITUTED implies substituted_cost_cents is present and <= rider_item.requested_cost_cents"
        side_effects:
          - "rider_item.status := decision; approved_cost_cents := requested_cost_cents for APPROVED, substituted_cost_cents for SUBSTITUTED, 0 for DENIED"
          - "advance.approved_rider_cost_cents, advance.recoupable_rider_cost_cents and advance.denied_item_count recomputed"
          - "CASCADE HOP caused by advance.recoupable_rider_cost_cents changing: booking.recoupable_production_cost_cents is recomputed to match"
          - "increments ProductionAdvance.version by 1"
        note: "Self-loop on the review state; a DENIED ruling on a non-critical item does NOT block the advance."

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [APPROVED]
    note: "Cyclic approval machine: PENDING_APPROVAL -> DRAFT on rejection, so DRAFT -> PENDING_APPROVAL -> DRAFT may repeat, each loop incrementing revision_count."
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /grandstand/settlements/{id}/submit"
        actor: TalentBuyer
        preconditions:
          - "settlement.status == DRAFT"
          - "the settlement's booking has booking_status == PERFORMED"
          - "the settlement's booking has ticketing_status == SALES_CLOSED"
          - "the recomputed total_artist_settlement_cents >= 0"
        side_effects:
          - "recompute calculations.settlement_adjusted_gross, calculations.artist_payout and calculations.merch_split in that pinned order, writing adjusted_gross_cents, sponsorship_offset_cents, base_promoter_expense_cents, provisional_net_pool_cents, artist_payout_cents, production_surcharge_cents, promoter_expense_cents, net_pool_cents, merch_hall_fee_cents, merch_artist_share_cents and total_artist_settlement_cents"
          - "settlement.submitted_by_user_id := X-User-ID of the request"
          - "increments Settlement.version by 1"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /grandstand/settlements/{id}/approve"
        actor: SettlementController
        preconditions:
          - "settlement.status == PENDING_APPROVAL"
          - "X-User-ID != settlement.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "settlement.approved_by_user_id := X-User-ID"
          - "CASCADE HOP caused by settlement.status becoming APPROVED: calculations.artist_draw_score runs and writes Artist.draw_score_next_year on the artist of the settlement's booking, using the variant named by the edition's strategy_basis"
          - "increments Settlement.version by 1"
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /grandstand/settlements/{id}/reject"
        actor: SettlementController
        preconditions:
          - "settlement.status == PENDING_APPROVAL"
          - "rejection_reason_code is present"
        side_effects:
          - "settlement.revision_count increases by 1; settlement.rejection_reason_code := the supplied code"
          - "settlement.submitted_by_user_id := null so the next submit re-stamps the submitter"
          - "Artist.draw_score_next_year is left untouched"
          - "increments Settlement.version by 1"
        note: "Cycle edge."

  - entity: SponsorshipActivation
    initial_state: PROPOSED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /grandstand/sponsorship-activations/{id}/confirm"
        actor: SponsorshipDirector
        preconditions:
          - "activation.status == PROPOSED"
          - "the activation's booking has booking_status IN {DATE_HELD, ANNOUNCED}"
          - "no other SponsorshipActivation on the same booking with status IN {CONFIRMED, FULFILLED} and a different sponsor_id carries the same exclusivity_category"
          - "when rights == STAGE_NAMING, no other SponsorshipActivation with status IN {CONFIRMED, FULFILLED} and rights == STAGE_NAMING exists on any booking of the same Stage within the same FairEdition"
        side_effects:
          - "recompute booking.sponsorship_revenue_cents as the sum of net_fee_cents over the booking's activations whose status IN {CONFIRMED, FULFILLED}"
          - "increments SponsorshipActivation.version by 1 and increments ShowBooking.version by 1"
      - from: CONFIRMED
        to: FULFILLED
        trigger: "system: caused by the booking's ANNOUNCED -> PERFORMED transition"
        actor: system
        preconditions:
          - "activation.status == CONFIRMED"
          - "the activation's booking has booking_status == PERFORMED"
        side_effects:
          - "booking.sponsorship_revenue_cents unchanged, because CONFIRMED and FULFILLED both count toward it"
          - "increments SponsorshipActivation.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /grandstand/sponsorship-activations/{id}/cancel"
        actor: SponsorshipDirector
        preconditions:
          - "activation.status == CONFIRMED"
        side_effects:
          - "activation.make_good_credit_cents := activation.net_fee_cents"
          - "recompute booking.sponsorship_revenue_cents, restoring it to the exact value it held before this activation was confirmed"
          - "increments SponsorshipActivation.version by 1 and increments ShowBooking.version by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /grandstand/sponsorship-activations/{id}/cancel"
        actor: SponsorshipDirector
        preconditions:
          - "activation.status == PROPOSED"
        side_effects:
          - "activation.make_good_credit_cents := 0 because an unconfirmed activation never entered booking.sponsorship_revenue_cents"
          - "increments SponsorshipActivation.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's version only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: offer-revise-stale-offer
    parent_entity: Offer
    write_endpoint: "POST /grandstand/offers/{id}/revise"
    occ_field: "expected_offer_version"
    description: |
      A revise carrying an expected_offer_version below the offer's current version is
      refused. This captures the case where the agent has already recorded a further
      counter round on the same COUNTERED offer, so the buyer's view of the negotiation
      is stale even though the status precondition still reads COUNTERED and the revise
      would otherwise legitimately succeed.
    error_id: ERR_STALE_OFFER_VERSION
    http_status: 412
  - rule_id: ticket-scale-create-stale-booking
    parent_entity: ShowBooking
    write_endpoint: "POST /grandstand/show-bookings/{id}/ticket-scales"
    occ_field: "expected_show_booking_version"
    description: |
      Creating a TicketScale against a ShowBooking whose version has advanced since the
      client last read it is refused. Multiple scales legitimately coexist on one
      booking, so nothing in the state machine rejects a second create; the stale-version
      check is what stops a scaling decision taken against an outdated allotment picture
      from landing.
    error_id: ERR_STALE_SHOW_BOOKING_VERSION
    http_status: 412
  - rule_id: activation-create-stale-booking
    parent_entity: ShowBooking
    write_endpoint: "POST /grandstand/sponsorship-activations"
    occ_field: "expected_show_booking_version"
    description: |
      Creating a SponsorshipActivation against a ShowBooking whose version has advanced
      is refused. Several activations legitimately attach to one booking, and the fee
      premium is computed from booking.gross_potential_cents, so an activation priced
      against a stale booking picture is rejected on the version check rather than
      silently mispriced.
    error_id: ERR_STALE_SHOW_BOOKING_VERSION
    http_status: 412
  - rule_id: contingency-action-create-stale-booking
    parent_entity: ShowBooking
    write_endpoint: "POST /grandstand/show-bookings/{id}/contingency-actions"
    occ_field: "expected_show_booking_version"
    description: |
      A weather decision carrying an expected_show_booking_version below the booking's
      current version is refused. The refund liability the action commits is derived from
      the booking's ticket scales and sold units, so a cancellation decided against an
      outdated sales picture must not land; the operator has to re-read the booking and
      re-issue the decision against the current version.
    error_id: ERR_STALE_SHOW_BOOKING_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: edition_committed_guarantee_total
    trigger: "On the Offer transitions DRAFT->SENT, COUNTERED->SENT (revise), SENT->ACCEPTED, SENT->DECLINED, COUNTERED->DECLINED, SENT->WITHDRAWN, COUNTERED->WITHDRAWN, SENT->EXPIRED and COUNTERED->EXPIRED; writes FairEdition.committed_guarantee_total_cents"
    algorithm: aggregation
    formula: |
      committed_guarantee_total_cents =
          SUM(offer.offered_guarantee_cents
              FOR offer IN Offer WHERE offer.fair_edition_id == edition.id
                                   AND offer.status IN {SENT, COUNTERED})
        + SUM(offer.agreed_guarantee_cents
              FOR offer IN Offer WHERE offer.fair_edition_id == edition.id
                                   AND offer.status == ACCEPTED)
      # Offers in DRAFT, DECLINED, WITHDRAWN and EXPIRED contribute nothing.
      # A COUNTERED offer contributes the BUYER's standing offered_guarantee_cents,
      # never the agent's countered_guarantee_cents.
    input_set: "Offer rows of one FairEdition; the two summands are disjoint by status, so no offer is counted twice. The aggregation is a full recompute over the current rows, never an incremental delta, so it is order-independent and needs no tie-break."
    constants: {}
    precision: "integer cents, no rounding required (all summands are integers)"
    variants: []

  - name: stage_hold_ledger
    trigger: "On the same Offer transitions as edition_committed_guarantee_total, plus the ShowBooking transitions DATE_HELD->CANCELLED, ANNOUNCED->CANCELLED, DATE_HELD->POSTPONED and ANNOUNCED->POSTPONED; writes Stage.held_show_count, Stage.booking_posture and FairEdition.open_stage_count"
    algorithm: aggregation
    formula: |
      held_show_count(stage) =
          COUNT(offer FOR offer IN Offer
                WHERE offer.target_stage_id == stage.id
                  AND offer.status IN {SENT, COUNTERED})
        + COUNT(booking FOR booking IN ShowBooking
                WHERE booking.stage_id == stage.id
                  AND booking.booking_status IN {DATE_HELD, ANNOUNCED, PERFORMED})
      booking_posture(stage) = SATURATED IF held_show_count >= stage.slot_soft_cap ELSE OPEN
      open_stage_count(edition) =
          COUNT(stage FOR stage IN Stage
                WHERE stage.fair_edition_id == edition.id
                  AND stage.booking_posture == OPEN)
    input_set: "Offers and ShowBookings attached to one Stage, filtered to the status sets above. An ACCEPTED Offer is deliberately excluded from the first summand because its ShowBooking is counted by the second, which is what makes the accept conversion slot-neutral."
    constants: {}
    precision: "integer counts"
    variants: []

  - name: ticket_gross_potential
    trigger: "On TicketScale creation via POST /grandstand/show-bookings/{id}/ticket-scales (the SCALED_PENDING->SCALED transition and every later scale creation); writes TicketScale.scale_gross_potential_cents and ShowBooking.gross_potential_cents"
    algorithm: aggregation
    formula: |
      bundle_credit_cents =
          round_half_up(edition.gate_admission_price_cents * BUNDLE_CREDIT_RATIO)   # whole cents
      artist_face_cents(scale) =
          scale.face_price_cents - (bundle_credit_cents IF scale.bundled_with_gate_admission ELSE 0)
      scale_gross_potential_cents(scale) =
          round_half_up(artist_face_cents(scale) * scale.allotment_seats * (1 - ADMISSION_TAX_RATE))
      gross_potential_cents(booking) =
          SUM(scale_gross_potential_cents(scale) FOR scale IN booking's TicketScale rows)

      # PINNED ROUNDING ORDER: round each ticket-scale line to whole cents FIRST, then sum
      # the rounded lines. Summing the unrounded line products and rounding once at the end
      # is WRONG and differs by up to (line_count - 1) cents.
      # facility_fee_cents never enters the artist gross; it is promoter income.
    input_set: "Every TicketScale row of the booking regardless of status, because potential is a capacity figure and does not depend on sales. A booking with zero scales has gross_potential_cents == 0."
    constants:
      BUNDLE_CREDIT_RATIO: 0.60
      ADMISSION_TAX_RATE: 0.0575
    precision: "integer cents, round_half_up, applied once per ticket-scale line"
    variants: []

  - name: settlement_adjusted_gross
    trigger: "On the Settlement DRAFT->PENDING_APPROVAL transition and on every GET /grandstand/show-bookings/{id}/settlement-preview read; writes Settlement.adjusted_gross_cents"
    algorithm: chronological
    formula: |
      eligible(batch) =
          batch.channel != COMP
          AND (basis == FINAL
               OR (basis == PROVISIONAL
                   AND (booking.doors_time_utc IS NULL
                        OR batch.recorded_at_utc < booking.doors_time_utc)))
      # Replay the eligible batches of one scale in ascending recorded_at_utc, tie-break
      # ascending created_at (never id), maintaining a running unit count:
      net_units(scale) = FOLD over eligible batches of that scale, ordered as above:
          units := units + batch.quantity        IF batch.batch_kind == SALE
          units := units - batch.quantity        IF batch.batch_kind == REFUND
      line_gross_cents(scale) =
          round_half_up(artist_face_cents(scale) * net_units(scale) * (1 - ADMISSION_TAX_RATE))
      adjusted_gross_cents = SUM(line_gross_cents(scale) FOR scale IN booking's TicketScale rows)
      # Same pinned rounding order as ticket_gross_potential: per-line round, then sum.
    input_set: "TicketSaleBatch rows of the booking's scales, excluding channel == COMP outright and, under the PROVISIONAL basis, excluding every batch recorded at or after doors_time_utc. The ERR_REFUND_EXCEEDS_SOLD_UNITS validation guarantees net_units never goes negative, so the fold is monotone-safe."
    constants:
      ADMISSION_TAX_RATE: 0.0575
    precision: "integer cents, round_half_up, applied once per ticket-scale line"
    variants:
      - name: provisional_basis
        when: "Settlement.basis == PROVISIONAL, or the preview endpoint is called with basis=PROVISIONAL"
        difference: "Restricts the input set to batches with recorded_at_utc strictly before booking.doors_time_utc, so day-of walk-up sales are excluded and adjusted_gross_cents is lower than under FINAL for the identical batch set."
      - name: final_basis
        when: "Settlement.basis == FINAL, or the preview endpoint is called with basis=FINAL"
        difference: "Admits every non-COMP batch regardless of recorded_at_utc, including day-of walk-up sales recorded after doors."

  - name: artist_payout
    trigger: "On the Settlement DRAFT->PENDING_APPROVAL transition and on every GET /grandstand/show-bookings/{id}/settlement-preview read; writes Settlement.sponsorship_offset_cents, base_promoter_expense_cents, provisional_net_pool_cents, artist_payout_cents, production_surcharge_cents, promoter_expense_cents and net_pool_cents"
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER. The surcharge depends on the payout while the payout
      # depends on the expenses that the surcharge belongs to; this ordering resolves the
      # apparent circularity in a single pass. There is NO fixed-point iteration and the
      # payout is NEVER recomputed after the surcharge exists.
      step 1: adjusted_gross_cents           = calculations.settlement_adjusted_gross
      step 2: sponsorship_offset_cents        = round_half_up(booking.sponsorship_revenue_cents
                                                             * SPONSOR_OFFSET_SHARE)
      step 3: base_promoter_expense_cents     = advance.approved_rider_cost_cents
                                                + FLAT_PROMOTER_EXPENSE_CENTS
                # advance is the booking's ProductionAdvance; when it is ADVANCE_CANCELLED
                # or absent, approved_rider_cost_cents reads 0.
      step 4: provisional_net_pool_cents      = max(0, adjusted_gross_cents
                                                       + sponsorship_offset_cents
                                                       - base_promoter_expense_cents)
      step 5: artist_payout_cents             =
                  IF booking.agreed_deal_type == VERSUS:
                      max(booking.agreed_guarantee_cents,
                          round_half_up(provisional_net_pool_cents
                                        * booking.agreed_backend_split_pct))
                  IF booking.agreed_deal_type == GUARANTEE_PLUS_BACKEND:
                      booking.agreed_guarantee_cents
                      + round_half_up(max(0, provisional_net_pool_cents
                                             - booking.agreed_breakeven_cents)
                                      * booking.agreed_backend_split_pct)
      step 6: production_surcharge_cents      = round_half_up(artist_payout_cents
                                                             * PRODUCTION_SURCHARGE_PCT)
      step 7: promoter_expense_cents          = base_promoter_expense_cents
                                                + production_surcharge_cents
      step 8: net_pool_cents                  = provisional_net_pool_cents
                                                - production_surcharge_cents
    input_set: "One Settlement, its ShowBooking (for the pinned agreed_* deal terms and sponsorship_revenue_cents) and that booking's ProductionAdvance (for approved_rider_cost_cents). Sales enter only through step 1."
    constants:
      SPONSOR_OFFSET_SHARE: 0.25
      FLAT_PROMOTER_EXPENSE_CENTS: 2500000
      PRODUCTION_SURCHARGE_PCT: 0.035
    precision: "integer cents, round_half_up at steps 2, 5 and 6; every other step is integer arithmetic"
    variants:
      - name: versus_deal
        when: "booking.agreed_deal_type == VERSUS"
        difference: "Pays the greater of the guarantee and the backend percentage of the whole provisional net pool, so the backend never stacks on top of the guarantee."
      - name: guarantee_plus_backend_deal
        when: "booking.agreed_deal_type == GUARANTEE_PLUS_BACKEND"
        difference: "Pays the guarantee PLUS the split of the pool above agreed_breakeven_cents, so for the identical sales, expenses and sponsorship figures it produces a strictly larger payout than versus_deal whenever the pool clears breakeven."

  - name: merch_split
    trigger: "On the Settlement DRAFT->PENDING_APPROVAL transition and on every GET /grandstand/show-bookings/{id}/settlement-preview read; writes Settlement.merch_hall_fee_cents, merch_artist_share_cents and total_artist_settlement_cents"
    algorithm: threshold
    formula: |
      hall_rate = (MERCH_ARTIST_SELLS_RATE IF settlement.merch_seller == ARTIST
                   ELSE MERCH_VENUE_SELLS_RATE)
                + (MERCH_TIER_BUMP IF booking.paid_attendance >= MERCH_ATTENDANCE_TIER_SEATS
                   ELSE 0)
      merch_hall_fee_cents = min( max( round_half_up(settlement.merch_gross_cents * hall_rate),
                                       MERCH_FEE_FLOOR_CENTS ),
                                  MERCH_FEE_CAP_CENTS )
      # The floor is applied BEFORE the cap; with merch_gross_cents == 0 the floor still
      # applies, so a show that sold no merchandise still owes MERCH_FEE_FLOOR_CENTS.
      merch_artist_share_cents = settlement.merch_gross_cents - merch_hall_fee_cents
      total_artist_settlement_cents = settlement.artist_payout_cents
                                    + merch_artist_share_cents
                                    - booking.recoupable_production_cost_cents
    input_set: "One Settlement plus its ShowBooking's paid_attendance and recoupable_production_cost_cents. Three independent inputs (merch_seller, paid_attendance, merch_gross_cents) interact through a conditional rate and a nested min/max clamp."
    constants:
      MERCH_ARTIST_SELLS_RATE: 0.20
      MERCH_VENUE_SELLS_RATE: 0.30
      MERCH_TIER_BUMP: 0.05
      MERCH_ATTENDANCE_TIER_SEATS: 2500
      MERCH_FEE_FLOOR_CENTS: 25000
      MERCH_FEE_CAP_CENTS: 750000
    precision: "integer cents, round_half_up inside the clamp"
    variants: []

  - name: activation_net_fee
    trigger: "On SponsorshipActivation creation via POST /grandstand/sponsorship-activations; writes SponsorshipActivation.net_fee_cents"
    algorithm: tiered_pricing
    formula: |
      premium_pct = 0.00
      premium_pct += STAGE_NAMING_PREMIUM      IF activation.rights == STAGE_NAMING
      premium_pct += HIGH_DEMAND_PREMIUM       IF booking.gross_potential_cents
                                                  >= HIGH_DEMAND_GROSS_THRESHOLD_CENTS
      premium_pct += PRESENTING_TIER_PREMIUM   IF sponsor.exclusivity_tier == PRESENTING
      net_fee_cents = min( round_half_up(activation.base_fee_cents * (1 + premium_pct)),
                           round_half_up(activation.base_fee_cents * MAX_PREMIUM_MULTIPLIER) )
      # The threshold comparison is >=, so a booking whose gross_potential_cents equals
      # HIGH_DEMAND_GROSS_THRESHOLD_CENTS exactly does earn the high-demand premium.
    input_set: "One SponsorshipActivation, its Sponsor and its ShowBooking. The booking's gross_potential_cents is read at creation time and the resulting net_fee_cents is never re-derived afterwards, which is exactly what concurrency_rules[activation-create-stale-booking] guards."
    constants:
      STAGE_NAMING_PREMIUM: 0.25
      HIGH_DEMAND_PREMIUM: 0.10
      PRESENTING_TIER_PREMIUM: 0.05
      HIGH_DEMAND_GROSS_THRESHOLD_CENTS: 10000000
      MAX_PREMIUM_MULTIPLIER: 1.30
    precision: "integer cents, round_half_up on both arms of the min"
    variants: []

  - name: refund_liability
    trigger: "On the ShowBooking transitions DATE_HELD->CANCELLED, ANNOUNCED->CANCELLED, DATE_HELD->POSTPONED and ANNOUNCED->POSTPONED; writes ContingencyAction.pre_doors, ContingencyAction.refund_liability_cents, ShowBooking.refund_liability_cents and FairEdition.refund_liability_committed_cents"
    algorithm: threshold
    formula: |
      pre_doors = (booking.doors_time_utc IS NULL)
                  OR (action.decided_at_utc < booking.doors_time_utc)
      # Strictly less-than: a decision taken at the instant equal to doors_time_utc is
      # already post-doors.
      refund_rate(scale) =
          0.00                             IF action.action_type == POSTPONE
                                              AND action.refund_policy == RAIN_CHECK
          1.00                             IF action.refund_policy == FULL_REFUND
          1.00                             IF action.refund_policy == NO_REFUND_AFTER_DOORS
                                              AND pre_doors
          0.50                             IF action.refund_policy == NO_REFUND_AFTER_DOORS
                                              AND NOT pre_doors
                                              AND scale.seating_type == RESERVED
          0.00                             IF action.refund_policy == NO_REFUND_AFTER_DOORS
                                              AND NOT pre_doors
                                              AND scale.seating_type == GENERAL_ADMISSION
          0.00                             IF action.refund_policy == RAIN_CHECK
                                              AND action.action_type == CANCEL
      refundable_base_cents(scale) =
          scale.face_price_cents + scale.facility_fee_cents
          - (bundle_credit_cents IF scale.bundled_with_gate_admission ELSE 0)
      # The gate portion of a bundled ticket is never refunded: the patron used the fair
      # admission it paid for.
      refund_units(scale) = net_units(scale) evaluated with the FINAL basis of
          calculations.settlement_adjusted_gross but restricted to batches with
          recorded_at_utc <= action.decided_at_utc, ordered recorded_at_utc ASC then
          created_at ASC
      refund_liability_cents = SUM( round_half_up(refundable_base_cents(scale)
                                                  * refund_units(scale)
                                                  * refund_rate(scale))
                                    FOR scale IN booking's TicketScale rows )
      # Per-line round, then sum: the same pinned order used everywhere else.
    input_set: "Every TicketScale of the booking plus its non-COMP TicketSaleBatch rows recorded at or before the decision instant. A booking with no scales or no sold units yields refund_liability_cents == 0, which in turn drives the REFUNDING -> REFUNDED auto-transition."
    constants:
      BUNDLE_CREDIT_RATIO: 0.60
    precision: "integer cents, round_half_up per ticket-scale line"
    variants: []

  - name: artist_draw_score
    trigger: "On the Settlement PENDING_APPROVAL->APPROVED transition; writes Artist.draw_score_next_year on the artist of the settled booking"
    algorithm: weighted_scoring
    formula: |
      total_allotment_seats = SUM(scale.allotment_seats FOR scale IN booking's TicketScale rows)
      IF total_allotment_seats == 0: draw_score_next_year = artist.base_draw_score  (no rescore)
      sell_through_ratio    = round_half_up(booking.paid_attendance
                                            / total_allotment_seats, 4 decimals)
      net_pool_per_seat_cents = round_half_up(settlement.net_pool_cents
                                              / total_allotment_seats, 0 decimals)
      IF edition.strategy_basis == ATTENDANCE_WEIGHTED:
          raw = ATT_BASE_WEIGHT * artist.base_draw_score
                + ATT_SELL_THROUGH_WEIGHT * sell_through_ratio
      IF edition.strategy_basis == REVENUE_WEIGHTED:
          raw = REV_BASE_WEIGHT * artist.base_draw_score
                + min(REV_CONTRIBUTION_CAP, net_pool_per_seat_cents / REV_PER_SEAT_DIVISOR)
      draw_score_next_year = min(100.00, max(0.00, round_half_up(raw, 2 decimals)))
    input_set: "One approved Settlement, its ShowBooking (paid_attendance, TicketScale allotments) and the Artist behind the booking's Offer. Only the booking attached to this settlement contributes; other bookings of the same artist do not."
    constants:
      ATT_BASE_WEIGHT: 0.60
      ATT_SELL_THROUGH_WEIGHT: 40.0
      REV_BASE_WEIGHT: 0.40
      REV_PER_SEAT_DIVISOR: 500
      REV_CONTRIBUTION_CAP: 60.0
    precision: "sell_through_ratio to 4 decimals round_half_up; net_pool_per_seat_cents to whole cents round_half_up; draw_score_next_year to 2 decimals round_half_up"
    variants:
      - name: attendance_weighted
        when: "the booking's FairEdition.strategy_basis == ATTENDANCE_WEIGHTED"
        difference: "Weights the carried-in base score at 0.60 and adds up to 40 points of sell-through, so a near-sellout at a modest gross scores high."
      - name: revenue_weighted
        when: "the booking's FairEdition.strategy_basis == REVENUE_WEIGHTED"
        difference: "Weights the carried-in base score at only 0.40 and adds net pool per allotted seat divided by 500 (capped at 60), so the identical booking and settlement produce a materially different score from attendance_weighted."

  - name: buying_strategy_report
    trigger: "On every GET /grandstand/fair-editions/{id}/buying-strategy-report read; returns a computed document and persists nothing"
    algorithm: aggregation
    formula: |
      shows = ShowBooking rows whose Offer.fair_edition_id == edition.id
              AND booking_status IN {ANNOUNCED, PERFORMED}
      announced_show_count       = COUNT(shows)
      distinct_genre_count       = COUNT(DISTINCT artist.genre FOR show IN shows)
      distinct_segment_count     = COUNT(DISTINCT artist.audience_segment FOR show IN shows)
      genre_diversity_index      = round_half_up(
                                     0.5 * distinct_genre_count / GENRE_UNIVERSE_SIZE
                                   + 0.5 * distinct_segment_count / SEGMENT_UNIVERSE_SIZE,
                                     4 decimals)
      total_paid_attendance      = SUM(show.paid_attendance FOR show IN shows)
      settled = Settlement rows whose booking IN shows AND status == APPROVED
      total_net_pool_cents       = SUM(settlement.net_pool_cents FOR settlement IN settled)
      revenue_per_paid_attendee_cents =
          0 IF total_paid_attendance == 0
            ELSE round_half_up(total_net_pool_cents / total_paid_attendance, 0 decimals)
      recommended_guarantee_ceiling_cents =
          min( round_half_up(total_net_pool_cents * NEXT_YEAR_UPLIFT),
               round_half_up(edition.talent_budget_cap_cents * MAX_SINGLE_SHOW_SHARE) )
      # With no announced shows every figure is 0 and genre_diversity_index is 0.0000;
      # the empty edition never divides by zero.
    input_set: "ShowBookings of one edition filtered to booking_status IN {ANNOUNCED, PERFORMED} (DATE_HELD, CANCELLED and POSTPONED shows are excluded), their artists via Offer.artist_id, and only APPROVED Settlements. DRAFT and PENDING_APPROVAL settlements contribute nothing."
    constants:
      GENRE_UNIVERSE_SIZE: 7
      SEGMENT_UNIVERSE_SIZE: 4
      NEXT_YEAR_UPLIFT: 1.10
      MAX_SINGLE_SHOW_SHARE: 0.35
    precision: "genre_diversity_index to 4 decimals round_half_up; every cents figure to whole cents round_half_up"
    variants: []

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (Ordered by Priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "Both X-User-ID and X-User-Role headers are present and non-empty, and X-User-Role is one of the seven roles declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is listed in the target endpoint's roles: array."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body and query schema: every required input field is present; enum fields carry a declared member (genre, audience_segment, exclusivity_tier, exclusivity_category, deal_type, seating_type, batch_kind, channel, basis, category, decision, rights, action_type, reason_code, refund_policy, rejection_reason_code, strategy_basis, merch_seller); every *_cents field is an integer >= 0; every *_pct field is a decimal in [0, 1]; every *_utc field is an ISO-8601 instant with a trailing Z; allotment_seats and quantity are integers > 0; reserved_seat_capacity, ga_capacity, slot_soft_cap, max_shows_per_day and changeover_buffer_minutes are integers >= 0; radius_miles, radius_days_before, radius_days_after and response_window_hours are integers >= 0; curfew_utc_time matches HH:MM."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints and every list endpoint that accepts filters"

  - priority: 4
    category: auth
    check: "When X-User-Role is TalentAgent, X-User-ID must equal the user_id of some TalentAgent row; the identity is entity-backed and unresolvable identities are rejected before any resource lookup."
    error_id: ERR_UNKNOWN_ACTOR_IDENTITY
    http_status: 403
    applies_to: "every endpoint whose roles: include TalentAgent"

  - priority: 5
    category: existence
    check: "The fair_edition_id in the path or body identifies an existing FairEdition."
    error_id: ERR_FAIR_EDITION_NOT_FOUND
    http_status: 404
    applies_to: "GET/POST /grandstand/fair-editions/{id}/*, POST /grandstand/stages, POST /grandstand/offers, GET /grandstand/stages?fair_edition_id="

  - priority: 6
    category: existence
    check: "The stage_id or target_stage_id in the path or body identifies an existing Stage."
    error_id: ERR_STAGE_NOT_FOUND
    http_status: 404
    applies_to: "GET /grandstand/stages/{id}, POST /grandstand/offers, GET /grandstand/show-bookings?stage_id="

  - priority: 7
    category: existence
    check: "The agent_id in the path or body identifies an existing TalentAgent."
    error_id: ERR_TALENT_AGENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /grandstand/artists, GET /grandstand/artists?agent_id="

  - priority: 8
    category: existence
    check: "The artist_id in the path or body identifies an existing Artist."
    error_id: ERR_ARTIST_NOT_FOUND
    http_status: 404
    applies_to: "GET /grandstand/artists/{id}, POST /grandstand/offers, GET /grandstand/offers?artist_id="

  - priority: 9
    category: existence
    check: "The offer_id in the path or body identifies an existing Offer."
    error_id: ERR_OFFER_NOT_FOUND
    http_status: 404
    applies_to: "GET /grandstand/offers/{id}, GET /grandstand/offers/{id}/rounds, all POST /grandstand/offers/{id}/* actions, GET /grandstand/show-bookings?offer_id="

  - priority: 10
    category: existence
    check: "The booking_id or postponed_from_booking_id in the path or body identifies an existing ShowBooking."
    error_id: ERR_SHOW_BOOKING_NOT_FOUND
    http_status: 404
    applies_to: "GET /grandstand/show-bookings/{id}, its sub-resources and actions, POST /grandstand/sponsorship-activations, GET /grandstand/production-advances?booking_id=, GET /grandstand/settlements?booking_id="

  - priority: 11
    category: existence
    check: "The ticket_scale_id in the path identifies an existing TicketScale."
    error_id: ERR_TICKET_SCALE_NOT_FOUND
    http_status: 404
    applies_to: "GET /grandstand/ticket-scales/{id}, POST|GET /grandstand/ticket-scales/{id}/sales-batches"

  - priority: 12
    category: existence
    check: "The advance_id in the path identifies an existing ProductionAdvance."
    error_id: ERR_PRODUCTION_ADVANCE_NOT_FOUND
    http_status: 404
    applies_to: "GET /grandstand/production-advances/{id}, POST|GET /grandstand/production-advances/{id}/rider-items, POST /grandstand/production-advances/{id}/complete"

  - priority: 13
    category: existence
    check: "The rider_item_id in the path identifies an existing RiderItem."
    error_id: ERR_RIDER_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "POST /grandstand/rider-items/{id}/rule"

  - priority: 14
    category: existence
    check: "The sponsor_id in the body or query identifies an existing Sponsor."
    error_id: ERR_SPONSOR_NOT_FOUND
    http_status: 404
    applies_to: "POST /grandstand/sponsorship-activations, GET /grandstand/sponsorship-activations?sponsor_id="

  - priority: 15
    category: existence
    check: "The activation_id in the path identifies an existing SponsorshipActivation."
    error_id: ERR_ACTIVATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /grandstand/sponsorship-activations/{id}, POST /grandstand/sponsorship-activations/{id}/confirm, POST /grandstand/sponsorship-activations/{id}/cancel"

  - priority: 16
    category: existence
    check: "The settlement_id in the path identifies an existing Settlement."
    error_id: ERR_SETTLEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /grandstand/settlements/{id}, POST /grandstand/settlements/{id}/submit|approve|reject"

  - priority: 17
    category: state
    check: "The Offer is in a status from which the requested trigger is declared in §1.2: send requires DRAFT, counter requires SENT, revise requires COUNTERED, accept requires SENT, decline requires SENT or COUNTERED, withdraw requires DRAFT, SENT or COUNTERED. Terminal statuses (ACCEPTED, DECLINED, WITHDRAWN, EXPIRED) admit no trigger, which makes every repeated action idempotency-safe by rejection."
    error_id: ERR_INVALID_OFFER_STATE
    http_status: 409
    applies_to: "POST /grandstand/offers/{id}/send|counter|revise|accept|decline|withdraw"

  - priority: 18
    category: state
    check: "The Offer has not lapsed: if the Offer is in SENT or COUNTERED and the logical clock reads at or after expires_at_utc, the offer is first auto-transitioned to EXPIRED and the request is then refused. Evaluated after the plain state check so that an already-terminal offer reports ERR_INVALID_OFFER_STATE instead."
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /grandstand/offers/{id}/counter|revise|accept|decline"

  - priority: 19
    category: state
    check: "The ShowBooking's booking_status admits the trigger: reschedule and announce require DATE_HELD, mark-performed requires ANNOUNCED, a CANCEL contingency action requires DATE_HELD or ANNOUNCED, a POSTPONE contingency action requires DATE_HELD or ANNOUNCED, creating a Settlement requires PERFORMED, and creating or confirming a SponsorshipActivation requires its booking in DATE_HELD or ANNOUNCED. CANCELLED and POSTPONED admit no further booking trigger, and a PERFORMED booking admits settlement creation only."
    error_id: ERR_INVALID_BOOKING_STATE
    http_status: 409
    applies_to: "POST /grandstand/show-bookings/{id}/reschedule|announce|mark-performed|contingency-actions|ticket-scales|settlements, POST /grandstand/sponsorship-activations, POST /grandstand/sponsorship-activations/{id}/confirm"

  - priority: 20
    category: state
    check: "The ShowBooking's ticketing_status admits the trigger: creating a TicketScale requires SCALED_PENDING or SCALED (never ON_SALE or later); recording a TicketSaleBatch requires the owning booking to be ON_SALE; creating a Settlement requires SALES_CLOSED, REFUNDING or REFUNDED."
    error_id: ERR_INVALID_TICKETING_STATE
    http_status: 409
    applies_to: "POST /grandstand/show-bookings/{id}/ticket-scales, POST /grandstand/ticket-scales/{id}/sales-batches, POST /grandstand/show-bookings/{id}/settlements"

  - priority: 21
    category: state
    check: "The ProductionAdvance admits the trigger: adding a RiderItem requires ADVANCE_PENDING, ADVANCE_IN_REVIEW or ADVANCE_BLOCKED; ruling a RiderItem requires ADVANCE_IN_REVIEW or ADVANCE_BLOCKED; complete requires ADVANCE_IN_REVIEW. ADVANCE_COMPLETE and ADVANCE_CANCELLED admit no further trigger."
    error_id: ERR_INVALID_ADVANCE_STATE
    http_status: 409
    applies_to: "POST /grandstand/production-advances/{id}/rider-items, POST /grandstand/production-advances/{id}/complete, POST /grandstand/rider-items/{id}/rule"

  - priority: 22
    category: state
    check: "The SponsorshipActivation admits the trigger: confirm requires PROPOSED; cancel requires PROPOSED or CONFIRMED. FULFILLED and CANCELLED admit no trigger."
    error_id: ERR_INVALID_ACTIVATION_STATE
    http_status: 409
    applies_to: "POST /grandstand/sponsorship-activations/{id}/confirm|cancel"

  - priority: 23
    category: state
    check: "The Settlement admits the trigger: submit requires DRAFT, approve requires PENDING_APPROVAL, reject requires PENDING_APPROVAL. APPROVED is terminal."
    error_id: ERR_INVALID_SETTLEMENT_STATE
    http_status: 409
    applies_to: "POST /grandstand/settlements/{id}/submit|approve|reject"

  - priority: 24
    category: state
    check: "expected_offer_version in the request body equals the Offer's current version field, per concurrency_rules[offer-revise-stale-offer]. Checked after the offer's own state and expiry checks so a stale version on an already-terminal offer still reports the state error."
    error_id: ERR_STALE_OFFER_VERSION
    http_status: 412
    applies_to: "POST /grandstand/offers/{id}/revise"

  - priority: 25
    category: state
    check: "expected_show_booking_version in the request body equals the ShowBooking's current version field, per concurrency_rules[ticket-scale-create-stale-booking], concurrency_rules[activation-create-stale-booking] and concurrency_rules[contingency-action-create-stale-booking]. The caller must have read the booking after the last change to its gross_potential_cents, which is the figure both writes depend on."
    error_id: ERR_STALE_SHOW_BOOKING_VERSION
    http_status: 412
    applies_to: "POST /grandstand/show-bookings/{id}/ticket-scales, POST /grandstand/sponsorship-activations, POST /grandstand/show-bookings/{id}/contingency-actions"

  - priority: 26
    category: business_temporal
    check: "The proposed performance date lies within the FairEdition's inclusive [run_start_date, run_end_date] window: Offer.target_show_date at creation and send; new_show_date on reschedule; replacement_show_date on a POSTPONE contingency action. Both endpoints of the window are inclusive."
    error_id: ERR_SHOW_DATE_OUTSIDE_FAIR_RUN
    http_status: 422
    applies_to: "POST /grandstand/offers, POST /grandstand/offers/{id}/send, POST /grandstand/show-bookings/{id}/reschedule"

  - priority: 27
    category: business_temporal
    check: "The proposed occupation window is well formed: load_out_end_utc is strictly after load_in_start_utc, and load_in_start_utc is at or after the performance date at 00:00:00.000Z. On announce the same rule governs doors_time_utc, which must satisfy load_in_start_utc < doors_time_utc < load_out_end_utc."
    error_id: ERR_INVALID_SLOT_WINDOW
    http_status: 422
    applies_to: "POST /grandstand/offers, POST /grandstand/show-bookings/{id}/reschedule, POST /grandstand/show-bookings/{id}/announce"

  - priority: 28
    category: business_temporal
    check: "A POSTPONE contingency action's replacement_show_date is present, is strictly after the booking's current show_date and lies inside the fair run. A CANCEL action must not carry a replacement date at all."
    error_id: ERR_REPLACEMENT_DATE_INVALID
    http_status: 422
    applies_to: "POST /grandstand/show-bookings/{id}/contingency-actions"

  - priority: 29
    category: business_temporal
    check: "A show may only be closed out once it has concluded, measured against the logical clock rather than wall time: mark-performed is refused while the clock is still before the booking's load_out_end_utc, and a Settlement may only be created once the booking is in booking_status PERFORMED and the clock reads at or after load_out_end_utc. An operation exactly at load_out_end_utc is admitted."
    error_id: ERR_SHOW_NOT_YET_CONCLUDED
    http_status: 422
    applies_to: "POST /grandstand/show-bookings/{id}/mark-performed, POST /grandstand/show-bookings/{id}/settlements"

  - priority: 30
    category: business_safety
    check: "Curfew compliance: the proposed load_out_end_utc is at or before the performance date at FairEdition.curfew_utc_time. An occupation ending exactly at the curfew instant is compliant; one cent of a minute past it is not. Public-safety compliance is checked before any scheduling-conflict or budget check."
    error_id: ERR_CURFEW_VIOLATION
    http_status: 422
    applies_to: "POST /grandstand/offers/{id}/send, POST /grandstand/show-bookings/{id}/reschedule"

  - priority: 31
    category: business_safety
    check: "A show may not be announced to the public until its ProductionAdvance is in ADVANCE_COMPLETE: staging, sound, lighting and hospitality rulings must all be settled first."
    error_id: ERR_ADVANCE_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /grandstand/show-bookings/{id}/announce"

  - priority: 32
    category: business_safety
    check: "A ProductionAdvance may not be completed while any of its RiderItem rows is still in status REQUESTED; every technical and hospitality line must have been ruled APPROVED, DENIED or SUBSTITUTED, and the seed STAGING line must be APPROVED or SUBSTITUTED."
    error_id: ERR_ADVANCE_HAS_OPEN_ITEMS
    http_status: 409
    applies_to: "POST /grandstand/production-advances/{id}/complete"

  - priority: 33
    category: business_referential
    check: "When the actor is a TalentAgent, the resolved TalentAgent row must be the agent_id of the Artist named on the Offer; agents may only counter or accept on behalf of their own roster."
    error_id: ERR_AGENT_NOT_AUTHORIZED_FOR_ARTIST
    http_status: 403
    applies_to: "POST /grandstand/offers/{id}/counter|accept|decline"

  - priority: 34
    category: business_referential
    check: "Segregation of duties: the X-User-ID approving a Settlement must differ from the Settlement's submitted_by_user_id. The same person may not both submit and approve an artist settlement."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /grandstand/settlements/{id}/approve"

  - priority: 35
    category: business_referential
    check: "At most one Settlement may exist per ShowBooking whose status is DRAFT, PENDING_APPROVAL or APPROVED. A booking whose only settlements were rejected back to DRAFT still counts as occupied."
    error_id: ERR_SETTLEMENT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /grandstand/show-bookings/{id}/settlements"

  - priority: 36
    category: business_referential
    check: "Sponsor category exclusivity: no two SponsorshipActivation rows on the same ShowBooking with status IN {CONFIRMED, FULFILLED} and different sponsor_id values may carry the same exclusivity_category. Checked both when an activation is created and when it is confirmed."
    error_id: ERR_SPONSOR_CATEGORY_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /grandstand/sponsorship-activations"

  - priority: 37
    category: business_referential
    check: "STAGE_NAMING rights are singular per Stage per FairEdition: no second activation with rights == STAGE_NAMING may be created for bookings on the same Stage in the same edition while an existing one is PROPOSED, CONFIRMED or FULFILLED."
    error_id: ERR_STAGE_NAMING_ALREADY_GRANTED
    http_status: 409
    applies_to: "POST /grandstand/sponsorship-activations"

  - priority: 38
    category: business_constraint
    check: "Negotiation round cap: an Offer may not be countered or revised once round_count has reached MAX_NEGOTIATION_ROUNDS (3). The cap counts agent counters and buyer revisions together."
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /grandstand/offers/{id}/counter|revise"

  - priority: 39
    category: business_constraint
    check: "Buffered stage-slot exclusivity on the target Stage: reject when, for any existing hold (Offer in SENT or COUNTERED, or ShowBooking in DATE_HELD, ANNOUNCED or PERFORMED) on that stage other than the candidate itself, BOTH candidate.load_in_start_utc < existing.load_out_end_utc + Stage.changeover_buffer_minutes AND existing.load_in_start_utc < candidate.load_out_end_utc + Stage.changeover_buffer_minutes hold. A gap of exactly changeover_buffer_minutes is therefore permitted; minute granularity, half-open on each side."
    error_id: ERR_STAGE_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /grandstand/offers/{id}/send, POST /grandstand/show-bookings/{id}/reschedule"

  - priority: 40
    category: business_constraint
    check: "Radius clause on the Artist: reject when another Offer for the same artist_id in status SENT, COUNTERED or ACCEPTED, whose radius_waiver_granted is false, holds a performance date inside the closed, day-granular, asymmetric window [candidate date - that offer's radius_days_before, candidate date + that offer's radius_days_after]. Both endpoints are inclusive and the two half-widths differ, so the window is not symmetric about the candidate date. An offer whose radius_waiver_granted is true never blocks."
    error_id: ERR_RADIUS_CLAUSE_CONFLICT
    http_status: 409
    applies_to: "POST /grandstand/offers/{id}/send, POST /grandstand/show-bookings/{id}/reschedule"

  - priority: 41
    category: business_constraint
    check: "Genre adjacency: reject when another show of the same Artist.genre (resolved through its Offer) is held on the same Stage within GENRE_GAP_DAYS (1) calendar days of the candidate performance date, i.e. on the previous day, the same day or the next day. Counts Offers in SENT, COUNTERED or ACCEPTED and ShowBookings in DATE_HELD, ANNOUNCED or PERFORMED, always excluding the candidate itself."
    error_id: ERR_GENRE_ADJACENCY_CONFLICT
    http_status: 422
    applies_to: "POST /grandstand/offers/{id}/send, POST /grandstand/show-bookings/{id}/reschedule"

  - priority: 42
    category: business_constraint
    check: "Per-day aggregate slot capacity: the count of holds and bookings on the candidate performance date across every Stage of the edition must remain at or below FairEdition.max_shows_per_day. Each show is individually schedulable on its own stage; only the collective per-day count trips this rule."
    error_id: ERR_DAY_SLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /grandstand/offers/{id}/send, POST /grandstand/show-bookings/{id}/reschedule"

  - priority: 43
    category: business_constraint
    check: "Seat allotment: the sum of allotment_seats over the booking's existing TicketScale rows of the same seating_type plus the new row must not exceed the Stage's reserved_seat_capacity (RESERVED) or ga_capacity (GENERAL_ADMISSION)."
    error_id: ERR_ALLOTMENT_EXCEEDS_STAGE_CAPACITY
    http_status: 422
    applies_to: "POST /grandstand/show-bookings/{id}/ticket-scales"

  - priority: 44
    category: business_constraint
    check: "A show may not be announced with an empty price structure: the booking must own at least one TicketScale row."
    error_id: ERR_NO_TICKET_SCALES
    http_status: 422
    applies_to: "POST /grandstand/show-bookings/{id}/announce"

  - priority: 45
    category: business_constraint
    check: "A REFUND TicketSaleBatch may not exceed the scale's currently sold net units: net_units after applying the refund must remain >= 0. This is what keeps the chronological fold in settlement_adjusted_gross monotone-safe."
    error_id: ERR_REFUND_EXCEEDS_SOLD_UNITS
    http_status: 422
    applies_to: "POST /grandstand/ticket-scales/{id}/sales-batches"

  - priority: 46
    category: business_fiscal
    check: "Talent budget: FairEdition.committed_guarantee_total_cents recomputed with the candidate offer included must not exceed FairEdition.talent_budget_cap_cents. A total exactly equal to the cap is allowed; one cent over is rejected. Fiscal capacity is checked last, after every temporal, safety, referential and constraint rule."
    error_id: ERR_TALENT_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /grandstand/offers/{id}/send|revise, POST /grandstand/offers/{id}/accept"

  - priority: 47
    category: business_fiscal
    check: "Refund reserve: FairEdition.refund_liability_committed_cents plus the candidate action's refund_liability_cents must not exceed FairEdition.refund_reserve_cents."
    error_id: ERR_REFUND_RESERVE_EXCEEDED
    http_status: 422
    applies_to: "POST /grandstand/show-bookings/{id}/contingency-actions"

  - priority: 48
    category: business_fiscal
    check: "A Settlement may not be submitted when its computed total_artist_settlement_cents is negative: recoupable production costs may not turn the artist into a net debtor."
    error_id: ERR_SETTLEMENT_NEGATIVE_PAYOUT
    http_status: 422
    applies_to: "POST /grandstand/settlements/{id}/submit"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- logical clock (test-driving endpoint, /_ namespace) ------------------
  - method: POST
    path: "/grandstand/_clock/set_current_utc"
    description: "Sets the server's logical clock, which is the sole source of every created_at, updated_at, sent_at_utc, expires_at_utc, recorded_at_utc, announced_at_utc and decided_at_utc value. The clock's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time. Needed because offer expiry, the pre-doors refund boundary and the load-out completion gate are all clock-driven."
    roles: [TalentBuyer, TalentAgent, FairOperationsDirector, ProductionManager, BoxOfficeManager, SponsorshipDirector, SettlementController]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["the logical clock is set to current_utc; no business row changes"]

  # --- FairEdition ---------------------------------------------------------
  - method: POST
    path: "/grandstand/fair-editions"
    description: "Creates a fair edition: the run window, the gate admission price that drives the bundle credit, the talent budget cap, the refund reserve and the strategy_basis that selects the artist_draw_score variant."
    roles: [FairOperationsDirector]
    code: 201
    input: [year, name, run_start_date, run_end_date, gate_admission_price_cents, talent_budget_cap_cents, refund_reserve_cents, "max_shows_per_day?", "curfew_utc_time?", "strategy_basis?"]
    output: FairEdition
    side_effects: ["committed_guarantee_total_cents, refund_liability_committed_cents and open_stage_count all initialise to 0"]

  - method: GET
    path: "/grandstand/fair-editions/{id}"
    description: "Reads one fair edition, including the three derived ledgers (committed_guarantee_total_cents, refund_liability_committed_cents, open_stage_count) that the cascades reconcile."
    roles: [TalentBuyer, TalentAgent, FairOperationsDirector, ProductionManager, BoxOfficeManager, SponsorshipDirector, SettlementController]
    code: 200
    input: []
    output: FairEdition
    side_effects: []

  - method: GET
    path: "/grandstand/fair-editions"
    description: "Lists fair editions, newest first by created_at, with standard limit/offset pagination."
    roles: [TalentBuyer, FairOperationsDirector, BoxOfficeManager, SponsorshipDirector, SettlementController]
    code: 200
    input: ["year?", "limit?", "offset?"]
    output: FairEdition[]
    side_effects: []

  - method: GET
    path: "/grandstand/fair-editions/{id}/buying-strategy-report"
    description: "Computed read returning next year's buying inputs for one edition: announced_show_count, distinct_genre_count, distinct_segment_count, genre_diversity_index, total_paid_attendance, total_net_pool_cents, revenue_per_paid_attendee_cents and recommended_guarantee_ceiling_cents. Persists nothing."
    roles: [TalentBuyer, FairOperationsDirector]
    code: 200
    input: []
    output: "{ announced_show_count: integer, distinct_genre_count: integer, distinct_segment_count: integer, genre_diversity_index: number, total_paid_attendance: integer, total_net_pool_cents: integer, revenue_per_paid_attendee_cents: integer, recommended_guarantee_ceiling_cents: integer }"
    side_effects: ["runs calculations.buying_strategy_report; no rows are written"]

  # --- Stage ---------------------------------------------------------------
  - method: POST
    path: "/grandstand/stages"
    description: "Creates a stage inside a fair edition with its reserved and general-admission capacities, its changeover buffer and its slot soft cap."
    roles: [FairOperationsDirector]
    code: 201
    input: [fair_edition_id, name, reserved_seat_capacity, ga_capacity, "changeover_buffer_minutes?", "slot_soft_cap?"]
    output: Stage
    side_effects: ["held_show_count initialises to 0 and booking_posture to OPEN", "recompute FairEdition.open_stage_count, which now counts this stage"]

  - method: GET
    path: "/grandstand/stages/{id}"
    description: "Reads one stage, including the derived held_show_count and booking_posture used by the slot-ledger cascade."
    roles: [TalentBuyer, TalentAgent, FairOperationsDirector, ProductionManager, BoxOfficeManager, SponsorshipDirector, SettlementController]
    code: 200
    input: []
    output: Stage
    side_effects: []

  - method: GET
    path: "/grandstand/stages"
    description: "Lists stages, optionally filtered by fair_edition_id (the FK reverse lookup from FairEdition) and by booking_posture."
    roles: [TalentBuyer, FairOperationsDirector, BoxOfficeManager, SponsorshipDirector]
    code: 200
    input: ["fair_edition_id?", "booking_posture?", "limit?", "offset?"]
    output: Stage[]
    side_effects: []

  # --- TalentAgent ---------------------------------------------------------
  - method: POST
    path: "/grandstand/talent-agents"
    description: "Registers a booking agent and the X-User-ID that agent authenticates as; the TalentAgent role is entity-backed through user_id."
    roles: [TalentBuyer]
    code: 201
    input: [user_id, agency_name, contact_email]
    output: TalentAgent
    side_effects: ["roster_artist_count initialises to 0"]

  - method: GET
    path: "/grandstand/talent-agents/{id}"
    description: "Reads one talent agent, including the derived roster_artist_count."
    roles: [TalentBuyer, TalentAgent, FairOperationsDirector, SettlementController]
    code: 200
    input: []
    output: TalentAgent
    side_effects: []

  # --- Artist --------------------------------------------------------------
  - method: POST
    path: "/grandstand/artists"
    description: "Adds an act to an agent's roster with its genre, audience segment and carried-in base draw score."
    roles: [TalentBuyer]
    code: 201
    input: [agent_id, name, genre, audience_segment, "base_draw_score?", "prior_year_paid_attendance?", "prior_year_net_revenue_cents?"]
    output: Artist
    side_effects: ["recompute TalentAgent.roster_artist_count on the named agent", "draw_score_next_year initialises to null"]

  - method: GET
    path: "/grandstand/artists/{id}"
    description: "Reads one artist, including draw_score_next_year once a settlement covering one of its bookings has been approved."
    roles: [TalentBuyer, TalentAgent, FairOperationsDirector, BoxOfficeManager, SettlementController]
    code: 200
    input: []
    output: Artist
    side_effects: []

  - method: GET
    path: "/grandstand/artists"
    description: "Lists artists, optionally filtered by agent_id (the FK reverse lookup from TalentAgent), genre or audience_segment."
    roles: [TalentBuyer, TalentAgent, FairOperationsDirector]
    code: 200
    input: ["agent_id?", "genre?", "audience_segment?", "limit?", "offset?"]
    output: Artist[]
    side_effects: []

  # --- Offer ---------------------------------------------------------------
  - method: POST
    path: "/grandstand/offers"
    description: "Drafts an offer for one act on one stage of one edition: deal type, guarantee, backend split and breakeven, radius clause geometry, requested show date and stage occupation window. A DRAFT offer holds no slot and encumbers no budget."
    roles: [TalentBuyer]
    code: 201
    input: [fair_edition_id, artist_id, target_stage_id, deal_type, offered_guarantee_cents, backend_split_pct, "backend_breakeven_cents?", "radius_miles?", "radius_days_before?", "radius_days_after?", target_show_date, load_in_start_utc, load_out_end_utc, "response_window_hours?"]
    output: Offer
    side_effects: ["status initialises to DRAFT, round_count to 0, radius_waiver_granted to false; sent_at_utc, expires_at_utc, countered_guarantee_cents and agreed_guarantee_cents are null", "created_by_user_id is stamped from X-User-ID", "no slot hold and no budget encumbrance are taken"]

  - method: GET
    path: "/grandstand/offers/{id}"
    description: "Reads one offer, including the negotiation ledger fields round_count, countered_guarantee_cents, agreed_guarantee_cents, expires_at_utc and version (the value a revise must echo as expected_offer_version)."
    roles: [TalentBuyer, TalentAgent, FairOperationsDirector, SettlementController]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: GET
    path: "/grandstand/offers"
    description: "Lists offers, optionally filtered by fair_edition_id, artist_id, target_stage_id (the three FK reverse lookups) or status."
    roles: [TalentBuyer, TalentAgent, FairOperationsDirector, SettlementController]
    code: 200
    input: ["fair_edition_id?", "artist_id?", "target_stage_id?", "status?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []

  - method: GET
    path: "/grandstand/offers/{id}/rounds"
    description: "Lists the append-only negotiation rounds of one offer in ascending recorded_at_utc, tie-break ascending created_at. The only channel through which cascade-created OfferRound rows are discoverable."
    roles: [TalentBuyer, TalentAgent, FairOperationsDirector, SettlementController]
    code: 200
    input: ["proposed_by?", "limit?", "offset?"]
    output: OfferRound[]
    side_effects: []

  - method: POST
    path: "/grandstand/offers/{id}/send"
    description: "Sends the drafted offer to the agent: the scheduling, radius, genre-adjacency, day-capacity and budget gates all fire here, and success takes the stage hold and the budget encumbrance."
    roles: [TalentBuyer]
    code: 200
    input: []
    output: Offer
    side_effects: ["Offer DRAFT -> SENT", "OfferRound created with proposed_by = BUYER and round_number = round_count + 1", "sent_at_utc := logical clock and expires_at_utc := sent_at_utc + response_window_hours", "recompute calculations.stage_hold_ledger: Stage.held_show_count, Stage.booking_posture and FairEdition.open_stage_count", "recompute calculations.edition_committed_guarantee_total", "increments Offer.version"]

  - method: POST
    path: "/grandstand/offers/{id}/counter"
    description: "The agent counters the standing offer, optionally granting a radius waiver. Counts against MAX_NEGOTIATION_ROUNDS and does not move the encumbrance ledger."
    roles: [TalentAgent]
    code: 200
    input: [proposed_guarantee_cents, proposed_backend_split_pct, "proposed_breakeven_cents?", "grant_radius_waiver?", "note?"]
    output: Offer
    side_effects: ["Offer SENT -> COUNTERED", "OfferRound created with proposed_by = AGENT", "countered_guarantee_cents := proposed_guarantee_cents and radius_waiver_granted := grant_radius_waiver", "recompute Offer.round_count", "increments Offer.version"]

  - method: POST
    path: "/grandstand/offers/{id}/revise"
    description: "The buyer answers a counter with revised terms. Carries expected_offer_version per concurrency_rules[offer-revise-stale-offer]; the stage hold is neither released nor re-taken."
    roles: [TalentBuyer]
    code: 200
    input: [expected_offer_version, offered_guarantee_cents, backend_split_pct, "backend_breakeven_cents?", "note?"]
    output: Offer
    side_effects: ["Offer COUNTERED -> SENT", "offered_guarantee_cents, backend_split_pct and backend_breakeven_cents := the revised figures; countered_guarantee_cents := null", "sent_at_utc and expires_at_utc are restamped from the logical clock", "OfferRound created with proposed_by = BUYER", "recompute calculations.edition_committed_guarantee_total", "increments Offer.version"]

  - method: POST
    path: "/grandstand/offers/{id}/accept"
    description: "The agent accepts: the offer terms are pinned and the whole booking spine (ShowBooking, ProductionAdvance, seed STAGING RiderItem) is cascade-created."
    roles: [TalentAgent]
    code: 200
    input: []
    output: Offer
    side_effects: ["Offer SENT -> ACCEPTED and agreed_guarantee_cents := offered_guarantee_cents", "CASCADE: ShowBooking created in booking_status DATE_HELD / ticketing_status SCALED_PENDING with every agreed_* term pinned", "CASCADE: ProductionAdvance created for that booking in ADVANCE_PENDING", "CASCADE: seed STAGING RiderItem created on that advance in REQUESTED with is_critical = true", "recompute calculations.edition_committed_guarantee_total (now off agreed_guarantee_cents)", "recompute calculations.stage_hold_ledger: held_show_count is unchanged because the offer hold converts into a booking hold", "increments Offer.version"]

  - method: POST
    path: "/grandstand/offers/{id}/decline"
    description: "The agent declines the standing offer, releasing the stage hold and the budget encumbrance."
    roles: [TalentAgent]
    code: 200
    input: []
    output: Offer
    side_effects: ["Offer SENT|COUNTERED -> DECLINED", "recompute calculations.stage_hold_ledger and the posture / open_stage_count cascade", "recompute calculations.edition_committed_guarantee_total", "increments Offer.version"]

  - method: POST
    path: "/grandstand/offers/{id}/withdraw"
    description: "The buyer withdraws the offer. From DRAFT nothing is released; from SENT or COUNTERED the hold and the encumbrance are both restored to their exact pre-send values."
    roles: [TalentBuyer]
    code: 200
    input: []
    output: Offer
    side_effects: ["Offer DRAFT|SENT|COUNTERED -> WITHDRAWN", "from SENT or COUNTERED: recompute calculations.stage_hold_ledger and calculations.edition_committed_guarantee_total, restoring FairEdition.committed_guarantee_total_cents exactly", "from DRAFT: no ledger movement at all", "increments Offer.version"]

  # --- ShowBooking ---------------------------------------------------------
  - method: GET
    path: "/grandstand/show-bookings/{id}"
    description: "Reads one show booking, including both state dimensions (booking_status, ticketing_status), the pinned agreed_* deal terms and the derived gross_potential_cents, sponsorship_revenue_cents, recoupable_production_cost_cents, paid_attendance, refund_liability_cents and version (the value the three booking-scoped OCC writes must echo)."
    roles: [TalentBuyer, TalentAgent, FairOperationsDirector, ProductionManager, BoxOfficeManager, SponsorshipDirector, SettlementController]
    code: 200
    input: []
    output: ShowBooking
    side_effects: []

  - method: GET
    path: "/grandstand/show-bookings"
    description: "Lists show bookings, optionally filtered by stage_id, offer_id or postponed_from_booking_id (the three FK reverse lookups, the last of which is the self-referential edge that finds a postponement's replacement) and by either state dimension. The only channel through which cascade-created bookings are discoverable."
    roles: [TalentBuyer, TalentAgent, FairOperationsDirector, ProductionManager, BoxOfficeManager, SponsorshipDirector, SettlementController]
    code: 200
    input: ["stage_id?", "offer_id?", "postponed_from_booking_id?", "booking_status?", "ticketing_status?", "limit?", "offset?"]
    output: ShowBooking[]
    side_effects: []

  - method: POST
    path: "/grandstand/show-bookings/{id}/reschedule"
    description: "Moves a still-unannounced booking to new coordinates on the same stage. Every scheduling gate is re-evaluated at the new coordinates with this booking excluded from the candidate set."
    roles: [FairOperationsDirector]
    code: 200
    input: [new_show_date, new_load_in_start_utc, new_load_out_end_utc]
    output: ShowBooking
    side_effects: ["ShowBooking DATE_HELD -> DATE_HELD (self-loop on the contractual dimension)", "show_date, load_in_start_utc and load_out_end_utc := the new coordinates", "Stage.held_show_count unchanged: the slot moves within the same stage", "increments ShowBooking.version"]

  - method: POST
    path: "/grandstand/show-bookings/{id}/announce"
    description: "Announces the show to the public and fixes the doors time. Requires a completed production advance and at least one ticket scale; fires the join to ON_SALE when the box-office dimension already reads SCALED."
    roles: [FairOperationsDirector]
    code: 200
    input: [doors_time_utc]
    output: ShowBooking
    side_effects: ["ShowBooking DATE_HELD -> ANNOUNCED", "doors_time_utc := the supplied instant and announced_at_utc := logical clock", "AUTO-TRANSITION: ticketing_status SCALED -> ON_SALE when the box-office dimension already reads SCALED", "increments ShowBooking.version"]

  - method: POST
    path: "/grandstand/show-bookings/{id}/mark-performed"
    description: "Marks the show performed once the logical clock has passed load_out_end_utc: closes the box office, closes every ticket scale and fulfils every confirmed sponsorship activation."
    roles: [FairOperationsDirector]
    code: 200
    input: []
    output: ShowBooking
    side_effects: ["ShowBooking ANNOUNCED -> PERFORMED", "AUTO-TRANSITION: ticketing_status ON_SALE -> SALES_CLOSED in the same request", "every TicketScale of the booking gets status := CLOSED", "every CONFIRMED SponsorshipActivation on the booking advances to FULFILLED with booking.sponsorship_revenue_cents unchanged", "increments ShowBooking.version"]

  - method: POST
    path: "/grandstand/show-bookings/{id}/ticket-scales"
    description: "Creates a price tier on the booking, which is how the ticket pricing strategy (reserved versus general admission, bundled versus unbundled) is expressed. Carries expected_show_booking_version per concurrency_rules[ticket-scale-create-stale-booking]."
    roles: [BoxOfficeManager]
    code: 201
    input: [expected_show_booking_version, seating_type, tier_name, face_price_cents, allotment_seats, "bundled_with_gate_admission?", "facility_fee_cents?"]
    output: TicketScale
    side_effects: ["TicketScale created in status ON_SALE_ELIGIBLE with sold_seats = 0 and available_seats = allotment_seats", "run calculations.ticket_gross_potential: TicketScale.scale_gross_potential_cents is written and ShowBooking.gross_potential_cents is recomputed as the sum over the booking's scales", "on the first scale: ticketing_status SCALED_PENDING -> SCALED", "AUTO-TRANSITION: ticketing_status SCALED -> ON_SALE when booking_status already reads ANNOUNCED", "increments ShowBooking.version"]

  - method: GET
    path: "/grandstand/show-bookings/{id}/ticket-scales"
    description: "Lists the price tiers of one booking (the FK reverse lookup from ShowBooking), ascending created_at."
    roles: [TalentBuyer, FairOperationsDirector, BoxOfficeManager, SettlementController]
    code: 200
    input: ["seating_type?", "status?", "limit?", "offset?"]
    output: TicketScale[]
    side_effects: []

  - method: POST
    path: "/grandstand/show-bookings/{id}/contingency-actions"
    description: "Records a weather or force-majeure decision against the booking: CANCEL kills the show, POSTPONE moves it to a replacement date and cascade-creates the replacement booking. Carries expected_show_booking_version per concurrency_rules[contingency-action-create-stale-booking]."
    roles: [FairOperationsDirector]
    code: 201
    input: [expected_show_booking_version, action_type, reason_code, refund_policy, "replacement_show_date?"]
    output: ContingencyAction
    side_effects: ["ContingencyAction created with decided_at_utc = logical clock and pre_doors computed against booking.doors_time_utc", "run calculations.refund_liability, writing the action's refund_liability_cents, booking.refund_liability_cents and FairEdition.refund_liability_committed_cents", "CANCEL: booking_status -> CANCELLED, ticketing_status -> REFUNDING, every TicketScale -> REFUND_DUE, every PROPOSED or CONFIRMED SponsorshipActivation -> CANCELLED with make_good_credit_cents := net_fee_cents and booking.sponsorship_revenue_cents recomputed to 0", "POSTPONE: booking_status -> POSTPONED and a replacement ShowBooking is cascade-created with postponed_from_booking_id set, plus its own ProductionAdvance and seed STAGING RiderItem", "CASCADE: the original booking's ProductionAdvance -> ADVANCE_CANCELLED, its RiderItem rows -> VOIDED with approved_cost_cents 0, advance.approved_rider_cost_cents / recoupable_rider_cost_cents / denied_item_count -> 0, booking.recoupable_production_cost_cents -> 0", "AUTO-TRANSITION: ticketing_status REFUNDING -> REFUNDED when the computed refund_liability_cents is 0", "recompute calculations.stage_hold_ledger and the posture / open_stage_count cascade", "increments ShowBooking.version"]

  - method: GET
    path: "/grandstand/show-bookings/{id}/contingency-actions"
    description: "Lists the weather decisions recorded against one booking (the FK reverse lookup from ShowBooking), ascending decided_at_utc then ascending created_at."
    roles: [TalentBuyer, FairOperationsDirector, BoxOfficeManager, SettlementController]
    code: 200
    input: ["action_type?", "limit?", "offset?"]
    output: ContingencyAction[]
    side_effects: []

  - method: POST
    path: "/grandstand/show-bookings/{id}/settlements"
    description: "Opens the artist settlement for a performed show on the chosen basis. Creation computes nothing beyond the inputs; the money is computed on submit."
    roles: [TalentBuyer]
    code: 201
    input: ["basis?", "merch_gross_cents?", "merch_seller?"]
    output: Settlement
    side_effects: ["Settlement created in status DRAFT with revision_count 0, submitted_by_user_id null and every money field 0"]

  - method: GET
    path: "/grandstand/show-bookings/{id}/settlement-preview"
    description: "Computed read that runs the whole settlement waterfall for one booking on the requested basis without persisting anything: returns adjusted_gross_cents, sponsorship_offset_cents, base_promoter_expense_cents, provisional_net_pool_cents, artist_payout_cents, production_surcharge_cents, promoter_expense_cents, net_pool_cents, merch_hall_fee_cents, merch_artist_share_cents and total_artist_settlement_cents. This is how the two basis variants and the two deal variants are compared on identical sales data."
    roles: [TalentBuyer, SettlementController]
    code: 200
    input: ["basis?", "merch_gross_cents?", "merch_seller?"]
    output: "{ basis: string, adjusted_gross_cents: integer, sponsorship_offset_cents: integer, base_promoter_expense_cents: integer, provisional_net_pool_cents: integer, artist_payout_cents: integer, production_surcharge_cents: integer, promoter_expense_cents: integer, net_pool_cents: integer, merch_hall_fee_cents: integer, merch_artist_share_cents: integer, total_artist_settlement_cents: integer }"
    side_effects: ["runs calculations.settlement_adjusted_gross, calculations.artist_payout and calculations.merch_split in that pinned order; no rows are written"]

  # --- TicketScale / TicketSaleBatch ---------------------------------------
  - method: GET
    path: "/grandstand/ticket-scales/{id}"
    description: "Reads one price tier, including the derived sold_seats, available_seats and scale_gross_potential_cents."
    roles: [TalentBuyer, FairOperationsDirector, BoxOfficeManager, SettlementController]
    code: 200
    input: []
    output: TicketScale
    side_effects: []

  - method: POST
    path: "/grandstand/ticket-scales/{id}/sales-batches"
    description: "Records a batch of sales or refunds against one price tier. Only writable while the owning booking is ON_SALE; COMP batches never count toward paid attendance or artist gross."
    roles: [BoxOfficeManager]
    code: 201
    input: [batch_kind, quantity, channel]
    output: TicketSaleBatch
    side_effects: ["TicketSaleBatch created with recorded_at_utc = logical clock and counts_toward_paid_attendance = (channel != COMP)", "recompute TicketScale.sold_seats and TicketScale.available_seats, preserving the identity available_seats == allotment_seats - sold_seats", "recompute ShowBooking.paid_attendance over the booking's scales", "increments TicketScale.version and ShowBooking.version"]

  - method: GET
    path: "/grandstand/ticket-scales/{id}/sales-batches"
    description: "Lists the sale and refund batches of one price tier (the FK reverse lookup from TicketScale) in ascending recorded_at_utc, tie-break ascending created_at: the chronological order the settlement fold replays."
    roles: [TalentBuyer, FairOperationsDirector, BoxOfficeManager, SettlementController]
    code: 200
    input: ["batch_kind?", "channel?", "limit?", "offset?"]
    output: TicketSaleBatch[]
    side_effects: []

  # --- ProductionAdvance / RiderItem ---------------------------------------
  - method: GET
    path: "/grandstand/production-advances/{id}"
    description: "Reads one production advance, including status, blocked_reason_code and the derived approved_rider_cost_cents, recoupable_rider_cost_cents and denied_item_count."
    roles: [TalentBuyer, FairOperationsDirector, ProductionManager, SettlementController]
    code: 200
    input: []
    output: ProductionAdvance
    side_effects: []

  - method: GET
    path: "/grandstand/production-advances"
    description: "Lists production advances, optionally filtered by booking_id (the FK reverse lookup from ShowBooking) or status. The only channel through which the cascade-created advance is discoverable."
    roles: [TalentBuyer, FairOperationsDirector, ProductionManager, SettlementController]
    code: 200
    input: ["booking_id?", "status?", "limit?", "offset?"]
    output: ProductionAdvance[]
    side_effects: []

  - method: POST
    path: "/grandstand/production-advances/{id}/rider-items"
    description: "Adds a staging, sound, lighting or hospitality rider line to the advance. The first line moves the advance out of ADVANCE_PENDING into ADVANCE_IN_REVIEW."
    roles: [ProductionManager]
    code: 201
    input: [category, description, requested_cost_cents, "is_critical?", "artist_recoupable?"]
    output: RiderItem
    side_effects: ["RiderItem created in status REQUESTED with approved_cost_cents = 0", "ProductionAdvance ADVANCE_PENDING -> ADVANCE_IN_REVIEW on the first line", "increments ProductionAdvance.version"]

  - method: GET
    path: "/grandstand/production-advances/{id}/rider-items"
    description: "Lists the rider lines of one advance (the FK reverse lookup from ProductionAdvance), ascending created_at. The only channel through which the cascade-created seed STAGING line is discoverable."
    roles: [TalentBuyer, FairOperationsDirector, ProductionManager, SettlementController]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: RiderItem[]
    side_effects: []

  - method: POST
    path: "/grandstand/production-advances/{id}/complete"
    description: "Closes the advance once every rider line has been ruled and the seed staging line is approved or substituted, which is what unlocks the public announcement."
    roles: [ProductionManager]
    code: 200
    input: []
    output: ProductionAdvance
    side_effects: ["ProductionAdvance ADVANCE_IN_REVIEW -> ADVANCE_COMPLETE", "recompute approved_rider_cost_cents and recoupable_rider_cost_cents", "CASCADE: ShowBooking.recoupable_production_cost_cents is recomputed to match", "increments ProductionAdvance.version"]

  - method: GET
    path: "/grandstand/rider-items/{id}"
    description: "Reads one rider line, including its ruling status and approved_cost_cents."
    roles: [TalentBuyer, FairOperationsDirector, ProductionManager, SettlementController]
    code: 200
    input: []
    output: RiderItem
    side_effects: []

  - method: POST
    path: "/grandstand/rider-items/{id}/rule"
    description: "Rules one rider line APPROVED, DENIED or SUBSTITUTED. Denying a critical line blocks the whole advance; re-ruling that same line SUBSTITUTED reverts the advance to review."
    roles: [ProductionManager]
    code: 200
    input: [decision, "substituted_cost_cents?"]
    output: RiderItem
    side_effects: ["rider_item.status := decision and approved_cost_cents := requested_cost_cents (APPROVED) | substituted_cost_cents (SUBSTITUTED) | 0 (DENIED)", "DENIED on a critical line: ProductionAdvance ADVANCE_IN_REVIEW -> ADVANCE_BLOCKED with blocked_reason_code := DENIED_CRITICAL_ITEM", "SUBSTITUTED on a denied critical line: ProductionAdvance ADVANCE_BLOCKED -> ADVANCE_IN_REVIEW with blocked_reason_code := null", "any other ruling: ProductionAdvance ADVANCE_IN_REVIEW -> ADVANCE_IN_REVIEW (self-loop)", "recompute approved_rider_cost_cents, recoupable_rider_cost_cents and denied_item_count", "CASCADE: ShowBooking.recoupable_production_cost_cents is recomputed to match", "increments ProductionAdvance.version"]

  # --- Sponsor / SponsorshipActivation -------------------------------------
  - method: POST
    path: "/grandstand/sponsors"
    description: "Registers a sponsor with its trade category and exclusivity tier; PRESENTING sponsors pay an activation premium."
    roles: [SponsorshipDirector]
    code: 201
    input: [name, category, exclusivity_tier]
    output: Sponsor
    side_effects: []

  - method: GET
    path: "/grandstand/sponsors/{id}"
    description: "Reads one sponsor."
    roles: [FairOperationsDirector, SponsorshipDirector, SettlementController]
    code: 200
    input: []
    output: Sponsor
    side_effects: []

  - method: POST
    path: "/grandstand/sponsorship-activations"
    description: "Buys a rights package on one show for one sponsor. The fee premium is computed at creation off the booking's gross_potential_cents, so the write carries expected_show_booking_version per concurrency_rules[activation-create-stale-booking]."
    roles: [SponsorshipDirector]
    code: 201
    input: [expected_show_booking_version, sponsor_id, booking_id, rights, base_fee_cents, exclusivity_category]
    output: SponsorshipActivation
    side_effects: ["SponsorshipActivation created in status PROPOSED with make_good_credit_cents = 0", "run calculations.activation_net_fee, writing net_fee_cents from base_fee_cents, the rights package, the sponsor tier and the booking's gross_potential_cents", "booking.sponsorship_revenue_cents is NOT moved: a PROPOSED activation contributes nothing", "increments ShowBooking.version"]

  - method: GET
    path: "/grandstand/sponsorship-activations/{id}"
    description: "Reads one activation, including the computed net_fee_cents and any make_good_credit_cents."
    roles: [TalentBuyer, FairOperationsDirector, SponsorshipDirector, SettlementController]
    code: 200
    input: []
    output: SponsorshipActivation
    side_effects: []

  - method: GET
    path: "/grandstand/sponsorship-activations"
    description: "Lists activations, optionally filtered by sponsor_id or booking_id (the two FK reverse lookups) or by status."
    roles: [TalentBuyer, FairOperationsDirector, SponsorshipDirector, SettlementController]
    code: 200
    input: ["sponsor_id?", "booking_id?", "rights?", "status?", "limit?", "offset?"]
    output: SponsorshipActivation[]
    side_effects: []

  - method: POST
    path: "/grandstand/sponsorship-activations/{id}/confirm"
    description: "Confirms the activation, which is when the fee enters the show's sponsorship revenue and when category exclusivity and stage-naming uniqueness are enforced."
    roles: [SponsorshipDirector]
    code: 200
    input: []
    output: SponsorshipActivation
    side_effects: ["SponsorshipActivation PROPOSED -> CONFIRMED", "recompute ShowBooking.sponsorship_revenue_cents as the sum of net_fee_cents over the booking's CONFIRMED and FULFILLED activations", "increments SponsorshipActivation.version and ShowBooking.version"]

  - method: POST
    path: "/grandstand/sponsorship-activations/{id}/cancel"
    description: "Cancels the activation. From CONFIRMED the make-good credit is booked and the show's sponsorship revenue is restored to its exact pre-confirmation value; from PROPOSED nothing is restored because nothing was ever counted."
    roles: [SponsorshipDirector]
    code: 200
    input: []
    output: SponsorshipActivation
    side_effects: ["SponsorshipActivation PROPOSED|CONFIRMED -> CANCELLED", "from CONFIRMED: make_good_credit_cents := net_fee_cents and ShowBooking.sponsorship_revenue_cents is recomputed back to its pre-confirmation value", "from PROPOSED: make_good_credit_cents := 0 and sponsorship_revenue_cents is unchanged", "increments SponsorshipActivation.version"]

  # --- Settlement ----------------------------------------------------------
  - method: GET
    path: "/grandstand/settlements/{id}"
    description: "Reads one settlement, including every waterfall figure, revision_count, submitted_by_user_id, approved_by_user_id and rejection_reason_code."
    roles: [TalentBuyer, TalentAgent, FairOperationsDirector, SettlementController]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: GET
    path: "/grandstand/settlements"
    description: "Lists settlements, optionally filtered by booking_id (the FK reverse lookup from ShowBooking) or status."
    roles: [TalentBuyer, TalentAgent, FairOperationsDirector, SettlementController]
    code: 200
    input: ["booking_id?", "status?", "basis?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  - method: POST
    path: "/grandstand/settlements/{id}/submit"
    description: "Computes the whole settlement waterfall and puts it up for approval. Stamps the submitter, which is the identity the segregation-of-duties check later compares against."
    roles: [TalentBuyer]
    code: 200
    input: []
    output: Settlement
    side_effects: ["Settlement DRAFT -> PENDING_APPROVAL", "run calculations.settlement_adjusted_gross, calculations.artist_payout and calculations.merch_split in that pinned order, writing all eleven money fields", "submitted_by_user_id := X-User-ID of this request", "increments Settlement.version"]

  - method: POST
    path: "/grandstand/settlements/{id}/approve"
    description: "Approves the settlement. Refused when X-User-ID equals submitted_by_user_id; approval is what rescores the artist for next year's buying strategy."
    roles: [SettlementController]
    code: 200
    input: []
    output: Settlement
    side_effects: ["Settlement PENDING_APPROVAL -> APPROVED", "approved_by_user_id := X-User-ID", "CASCADE: run calculations.artist_draw_score and write Artist.draw_score_next_year on the artist behind the settled booking, using the variant named by the edition's strategy_basis", "increments Settlement.version"]

  - method: POST
    path: "/grandstand/settlements/{id}/reject"
    description: "Rejects the settlement back to DRAFT with a reason code, increments the revision counter and clears the submitter stamp so the next submit re-stamps it."
    roles: [SettlementController]
    code: 200
    input: [rejection_reason_code]
    output: Settlement
    side_effects: ["Settlement PENDING_APPROVAL -> DRAFT (cycle edge)", "revision_count increases by 1 and rejection_reason_code := the supplied code", "submitted_by_user_id := null", "Artist.draw_score_next_year is left untouched", "increments Settlement.version"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Missing or invalid authentication headers."
    triggered_by: "X-User-ID or X-User-Role absent, empty, or X-User-Role not one of the seven declared roles."
  - error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    message: "This role may not perform this operation."
    triggered_by: "X-User-Role is not listed in the target endpoint's roles."
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message: "Request payload failed schema validation."
    triggered_by: "Missing required field, unknown enum member, negative money amount, out-of-range percentage, malformed timestamp or malformed date."
  - error_id: ERR_UNKNOWN_ACTOR_IDENTITY
    http_status: 403
    message: "The acting identity is not a registered talent agent."
    triggered_by: "X-User-Role is TalentAgent but X-User-ID matches no TalentAgent.user_id."
  - error_id: ERR_FAIR_EDITION_NOT_FOUND
    http_status: 404
    message: "Fair edition not found."
    triggered_by: "fair_edition_id does not identify a FairEdition."
  - error_id: ERR_STAGE_NOT_FOUND
    http_status: 404
    message: "Stage not found."
    triggered_by: "stage_id or target_stage_id does not identify a Stage."
  - error_id: ERR_TALENT_AGENT_NOT_FOUND
    http_status: 404
    message: "Talent agent not found."
    triggered_by: "agent_id does not identify a TalentAgent."
  - error_id: ERR_ARTIST_NOT_FOUND
    http_status: 404
    message: "Artist not found."
    triggered_by: "artist_id does not identify an Artist."
  - error_id: ERR_OFFER_NOT_FOUND
    http_status: 404
    message: "Offer not found."
    triggered_by: "offer_id does not identify an Offer."
  - error_id: ERR_SHOW_BOOKING_NOT_FOUND
    http_status: 404
    message: "Show booking not found."
    triggered_by: "booking_id or postponed_from_booking_id does not identify a ShowBooking."
  - error_id: ERR_TICKET_SCALE_NOT_FOUND
    http_status: 404
    message: "Ticket scale not found."
    triggered_by: "ticket_scale_id does not identify a TicketScale."
  - error_id: ERR_PRODUCTION_ADVANCE_NOT_FOUND
    http_status: 404
    message: "Production advance not found."
    triggered_by: "advance_id does not identify a ProductionAdvance."
  - error_id: ERR_RIDER_ITEM_NOT_FOUND
    http_status: 404
    message: "Rider item not found."
    triggered_by: "rider_item_id does not identify a RiderItem."
  - error_id: ERR_SPONSOR_NOT_FOUND
    http_status: 404
    message: "Sponsor not found."
    triggered_by: "sponsor_id does not identify a Sponsor."
  - error_id: ERR_ACTIVATION_NOT_FOUND
    http_status: 404
    message: "Sponsorship activation not found."
    triggered_by: "activation_id does not identify a SponsorshipActivation."
  - error_id: ERR_SETTLEMENT_NOT_FOUND
    http_status: 404
    message: "Settlement not found."
    triggered_by: "settlement_id does not identify a Settlement."
  - error_id: ERR_INVALID_OFFER_STATE
    http_status: 409
    message: "The offer is not in a state that allows this action."
    triggered_by: "Offer.status admits no such trigger, e.g. send on a SENT offer or accept on a WITHDRAWN offer."
  - error_id: ERR_OFFER_EXPIRED
    http_status: 409
    message: "The offer response window has closed."
    triggered_by: "The logical clock has reached offer.expires_at_utc; the offer is auto-transitioned to EXPIRED and the request is refused."
  - error_id: ERR_INVALID_BOOKING_STATE
    http_status: 409
    message: "The booking's contractual state does not allow this action."
    triggered_by: "booking_status admits no such trigger, e.g. reschedule on an ANNOUNCED booking or mark-performed on a CANCELLED one."
  - error_id: ERR_INVALID_TICKETING_STATE
    http_status: 409
    message: "The booking's box-office state does not allow this action."
    triggered_by: "ticketing_status admits no such trigger, e.g. a sales batch while SCALED, or a ticket scale while ON_SALE."
  - error_id: ERR_INVALID_ADVANCE_STATE
    http_status: 409
    message: "The production advance is not in a state that allows this action."
    triggered_by: "ProductionAdvance.status admits no such trigger, e.g. complete on an ADVANCE_BLOCKED or ADVANCE_CANCELLED advance."
  - error_id: ERR_INVALID_ACTIVATION_STATE
    http_status: 409
    message: "The activation is not in a state that allows this action."
    triggered_by: "SponsorshipActivation.status admits no such trigger, e.g. confirm on a CANCELLED activation."
  - error_id: ERR_INVALID_SETTLEMENT_STATE
    http_status: 409
    message: "The settlement is not in a state that allows this action."
    triggered_by: "Settlement.status admits no such trigger, e.g. approve on a DRAFT settlement or submit on an APPROVED one."
  - error_id: ERR_STALE_OFFER_VERSION
    http_status: 412
    message: "The offer has changed since it was read."
    triggered_by: "expected_offer_version does not equal Offer.version on POST /grandstand/offers/{id}/revise."
  - error_id: ERR_STALE_SHOW_BOOKING_VERSION
    http_status: 412
    message: "The show booking has changed since it was read."
    triggered_by: "expected_show_booking_version does not equal ShowBooking.version on a ticket-scale create, an activation create or a contingency-action create."
  - error_id: ERR_SHOW_DATE_OUTSIDE_FAIR_RUN
    http_status: 422
    message: "The performance date falls outside the fair run."
    triggered_by: "The proposed date is before run_start_date or after run_end_date."
  - error_id: ERR_INVALID_SLOT_WINDOW
    http_status: 422
    message: "The occupation window is malformed."
    triggered_by: "load_out_end_utc is not after load_in_start_utc, load_in_start_utc precedes the performance date, or doors_time_utc lies outside the occupation window."
  - error_id: ERR_REPLACEMENT_DATE_INVALID
    http_status: 422
    message: "The replacement performance date is invalid."
    triggered_by: "A POSTPONE omits replacement_show_date, proposes a date at or before the current show_date, proposes one outside the fair run, or a CANCEL supplies one."
  - error_id: ERR_SHOW_NOT_YET_CONCLUDED
    http_status: 422
    message: "The show has not concluded."
    triggered_by: "mark-performed fires while the logical clock is still before load_out_end_utc, or a settlement is opened while booking_status is not PERFORMED or while the clock is still before load_out_end_utc."
  - error_id: ERR_CURFEW_VIOLATION
    http_status: 422
    message: "The occupation window breaches the municipal curfew."
    triggered_by: "load_out_end_utc falls after the performance date at FairEdition.curfew_utc_time."
  - error_id: ERR_ADVANCE_NOT_COMPLETE
    http_status: 409
    message: "The production advance is not complete."
    triggered_by: "announce is called while the booking's ProductionAdvance is in any status other than ADVANCE_COMPLETE."
  - error_id: ERR_ADVANCE_HAS_OPEN_ITEMS
    http_status: 409
    message: "The production advance still has unruled rider items."
    triggered_by: "complete is called while some RiderItem of the advance is still REQUESTED, or while the seed STAGING line is not APPROVED or SUBSTITUTED."
  - error_id: ERR_AGENT_NOT_AUTHORIZED_FOR_ARTIST
    http_status: 403
    message: "This agent does not represent the artist on the offer."
    triggered_by: "The TalentAgent resolved from X-User-ID is not the Artist.agent_id of the offer's artist."
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    message: "The submitter of a settlement may not approve it."
    triggered_by: "X-User-ID equals Settlement.submitted_by_user_id on approve."
  - error_id: ERR_SETTLEMENT_ALREADY_EXISTS
    http_status: 409
    message: "A settlement already exists for this booking."
    triggered_by: "A second settlement is opened while one in DRAFT, PENDING_APPROVAL or APPROVED already exists for the booking."
  - error_id: ERR_SPONSOR_CATEGORY_EXCLUSIVITY_CONFLICT
    http_status: 409
    message: "Another sponsor already holds this trade category on the show."
    triggered_by: "Two activations on the same booking with different sponsor_id values carry the same exclusivity_category while in CONFIRMED or FULFILLED."
  - error_id: ERR_STAGE_NAMING_ALREADY_GRANTED
    http_status: 409
    message: "Stage naming rights are already granted for this stage."
    triggered_by: "A second STAGE_NAMING activation is created or confirmed for bookings on the same Stage in the same FairEdition."
  - error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 409
    message: "The negotiation round limit has been reached."
    triggered_by: "counter or revise is called once Offer.round_count has reached MAX_NEGOTIATION_ROUNDS (3)."
  - error_id: ERR_STAGE_SLOT_CONFLICT
    http_status: 409
    message: "The stage is already occupied in this window."
    triggered_by: "The candidate occupation window overlaps an existing hold on the same stage once the changeover buffer is applied to both sides."
  - error_id: ERR_RADIUS_CLAUSE_CONFLICT
    http_status: 409
    message: "The artist's radius clause blocks this date."
    triggered_by: "Another non-waived offer for the same artist holds a date inside the asymmetric radius window around the candidate date."
  - error_id: ERR_GENRE_ADJACENCY_CONFLICT
    http_status: 422
    message: "Another show of the same genre is already booked adjacent to this date."
    triggered_by: "A same-genre show on the same stage sits within GENRE_GAP_DAYS (1) of the candidate date."
  - error_id: ERR_DAY_SLOT_CAPACITY_EXCEEDED
    http_status: 409
    message: "The fair's per-day show capacity is exhausted."
    triggered_by: "The count of holds and bookings on the candidate date across every stage would exceed FairEdition.max_shows_per_day."
  - error_id: ERR_ALLOTMENT_EXCEEDS_STAGE_CAPACITY
    http_status: 422
    message: "The seat allotment exceeds the stage's capacity for this seating type."
    triggered_by: "Existing plus new allotment_seats for the seating type exceed reserved_seat_capacity or ga_capacity."
  - error_id: ERR_NO_TICKET_SCALES
    http_status: 422
    message: "The show has no ticket scales."
    triggered_by: "announce is called on a booking that owns no TicketScale row."
  - error_id: ERR_REFUND_EXCEEDS_SOLD_UNITS
    http_status: 422
    message: "The refund exceeds the units currently sold."
    triggered_by: "A REFUND batch would drive the tier's net units below zero."
  - error_id: ERR_TALENT_BUDGET_EXCEEDED
    http_status: 422
    message: "The talent budget cap would be exceeded."
    triggered_by: "committed_guarantee_total_cents recomputed with the candidate offer included exceeds talent_budget_cap_cents by one cent or more."
  - error_id: ERR_REFUND_RESERVE_EXCEEDED
    http_status: 422
    message: "The edition's refund reserve is insufficient."
    triggered_by: "refund_liability_committed_cents plus the candidate action's refund_liability_cents exceeds refund_reserve_cents."
  - error_id: ERR_SETTLEMENT_NEGATIVE_PAYOUT
    http_status: 422
    message: "The settlement would owe the artist a negative amount."
    triggered_by: "submit is called while the recomputed total_artist_settlement_cents is below zero."

# ---------------------------------------------------------------------------
# 1.7 Role / Permission Table
# ---------------------------------------------------------------------------
roles:
  - name: TalentBuyer
    identity: opaque
    description: "The entertainment department's buyer. Owns the offer surface, opens and submits settlements, and reads the buying-strategy report."
    exclusive_operations:
      - "POST /grandstand/talent-agents"
      - "POST /grandstand/artists"
      - "POST /grandstand/offers"
      - "POST /grandstand/offers/{id}/send"
      - "POST /grandstand/offers/{id}/revise"
      - "POST /grandstand/offers/{id}/withdraw"
      - "POST /grandstand/show-bookings/{id}/settlements"
      - "POST /grandstand/settlements/{id}/submit"
    shared_operations:
      - "every GET in the catalog except GET /grandstand/sponsors/{id}"
      - "POST /grandstand/_clock/set_current_utc"
  - name: TalentAgent
    identity: "entity_backed:TalentAgent"
    description: "The artist's booking agent, resolved from X-User-ID through TalentAgent.user_id. Owns the agent side of the negotiation and may only act for artists on its own roster."
    exclusive_operations:
      - "POST /grandstand/offers/{id}/counter"
      - "POST /grandstand/offers/{id}/accept"
      - "POST /grandstand/offers/{id}/decline"
    shared_operations:
      - "GET /grandstand/offers, GET /grandstand/offers/{id}, GET /grandstand/offers/{id}/rounds"
      - "GET /grandstand/artists, GET /grandstand/artists/{id}, GET /grandstand/talent-agents/{id}"
      - "GET /grandstand/show-bookings, GET /grandstand/show-bookings/{id}"
      - "GET /grandstand/settlements, GET /grandstand/settlements/{id}"
      - "POST /grandstand/_clock/set_current_utc"
  - name: FairOperationsDirector
    identity: opaque
    description: "Runs the fair. Owns editions, stages, the show calendar (announce, reschedule, mark-performed) and every weather contingency decision."
    exclusive_operations:
      - "POST /grandstand/fair-editions"
      - "POST /grandstand/stages"
      - "POST /grandstand/show-bookings/{id}/reschedule"
      - "POST /grandstand/show-bookings/{id}/announce"
      - "POST /grandstand/show-bookings/{id}/mark-performed"
      - "POST /grandstand/show-bookings/{id}/contingency-actions"
    shared_operations:
      - "every GET in the catalog except GET /grandstand/show-bookings/{id}/settlement-preview"
      - "POST /grandstand/_clock/set_current_utc"
  - name: ProductionManager
    identity: opaque
    description: "Runs the production advance: adds rider lines, rules them and closes the advance."
    exclusive_operations:
      - "POST /grandstand/production-advances/{id}/rider-items"
      - "POST /grandstand/production-advances/{id}/complete"
      - "POST /grandstand/rider-items/{id}/rule"
    shared_operations:
      - "GET /grandstand/production-advances and its sub-resources, GET /grandstand/rider-items/{id}"
      - "GET /grandstand/show-bookings, GET /grandstand/show-bookings/{id}, GET /grandstand/fair-editions/{id}, GET /grandstand/stages/{id}"
      - "POST /grandstand/_clock/set_current_utc"
  - name: BoxOfficeManager
    identity: opaque
    description: "Runs the box office: builds the price structure and records sale and refund batches."
    exclusive_operations:
      - "POST /grandstand/show-bookings/{id}/ticket-scales"
      - "POST /grandstand/ticket-scales/{id}/sales-batches"
    shared_operations:
      - "GET /grandstand/ticket-scales/{id} and its sales-batches list"
      - "GET /grandstand/show-bookings, GET /grandstand/show-bookings/{id} and its ticket-scales and contingency-actions lists"
      - "GET /grandstand/fair-editions, GET /grandstand/fair-editions/{id}, GET /grandstand/stages, GET /grandstand/stages/{id}, GET /grandstand/artists/{id}"
      - "POST /grandstand/_clock/set_current_utc"
  - name: SponsorshipDirector
    identity: opaque
    description: "Sells and services sponsorship: registers sponsors, creates activations and confirms or cancels them."
    exclusive_operations:
      - "POST /grandstand/sponsors"
      - "POST /grandstand/sponsorship-activations"
      - "POST /grandstand/sponsorship-activations/{id}/confirm"
      - "POST /grandstand/sponsorship-activations/{id}/cancel"
    shared_operations:
      - "GET /grandstand/sponsors/{id}, GET /grandstand/sponsorship-activations and GET /grandstand/sponsorship-activations/{id}"
      - "GET /grandstand/show-bookings, GET /grandstand/show-bookings/{id}, GET /grandstand/fair-editions, GET /grandstand/fair-editions/{id}, GET /grandstand/stages, GET /grandstand/stages/{id}"
      - "POST /grandstand/_clock/set_current_utc"
  - name: SettlementController
    identity: opaque
    description: "The controller side of the settlement approval chain. Approves or rejects submitted settlements and may never be the submitter of the settlement it approves."
    exclusive_operations:
      - "POST /grandstand/settlements/{id}/approve"
      - "POST /grandstand/settlements/{id}/reject"
    shared_operations:
      - "every GET in the catalog except GET /grandstand/fair-editions/{id}/buying-strategy-report and GET /grandstand/artists"
      - "POST /grandstand/_clock/set_current_utc"
