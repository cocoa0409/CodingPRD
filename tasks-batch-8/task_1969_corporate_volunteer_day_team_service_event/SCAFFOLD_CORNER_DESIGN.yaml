            - { call: "GET /registrations/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_reg: $.data.error_id } }
            - { call: "GET /procurement-orders/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_ord: $.data.error_id } }
            - { call: "POST /transport-manifests", payload: { event_id: "${ev1}", vehicle_id: "00000000-0000-0000-0000-000000000000", depart_at: "2026-08-20T08:00:00Z", return_at: "2026-08-20T10:00:00Z", cost_cents: 1000 }, as: LogisticsCoordinator, captures: { e_veh: $.data.error_id } }
            - { call: "GET /transport-manifests/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_man: $.data.error_id } }
            - { call: "GET /meal-plans/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_mp: $.data.error_id } }
            - { call: "GET /supervision-assignments/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_sup: $.data.error_id } }
            - { call: "GET /sponsorships/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_sp: $.data.error_id } }
            - { call: "GET /impact-records/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_ir: $.data.error_id } }
            - { call: "GET /feedback-surveys/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { e_fs: $.data.error_id } }
