            - "${a_panel_cl_weight} == 3.0"
            - "PipelineEntry.${pe_id}.preliminary_fit_score == 8.00"
            - "PipelineEntry.${pe_id}.panel_final_fit_score == 8.33"
            - "PipelineEntry.${pe_id}.preliminary_fit_score != PipelineEntry.${pe_id}.panel_final_fit_score"
            - "Interview.${iv2_id}.status == COMPLETED"

  - rule_id: combinatorial_formula
    instances:
      - name: completion_tranche_is_residual_not_percentage_product
        grounds:
          - calculations.invoice_tranche_allocation
          - calculations.engagement_fee_base
          - entities.FeeSchedule.fields.completion_pct
          - entities.Invoice.fields.gross_amount_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the ORDER is decisive. The RETAINER and PROGRESS tranches
          are each rounded off the PROVISIONAL fee (round(24,000,000 x 0.30) = 7,200,000 -> 2,520,000
          each), and COMPLETION is the RESIDUAL against the FINAL fee (round(26,000,000 x 0.35) =
          9,100,000 - 2,520,000 - 2,520,000 = 4,060,000). The forbidden order — round(final x
          completion_pct 0.30) = 2,730,000 — is a different number, so the pinned order is falsifiable
          on a single field.
        test_recipe:
          setup:
            - "Reuse the RETAINED half of retained_vs_contingent_fee_basis_diverge_on_identical_placement: ACTIVE RETAINED engagement, assignment with target_first_year_comp_cents 24,000,000, one Placement with actual_first_year_comp_cents 26,000,000, sourcing_status FILLED, billing_status UNBILLED."
          setup_api_calls:
            - call: "POST /consultants"
              payload: { full_name: "Pat Partner", seniority: "PARTNER" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Cara Consultant", seniority: "PRINCIPAL" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /companies"
              payload: { legal_name: "Acme Corp", industry: "Industrials" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /companies"
              payload: { legal_name: "Zenith Ltd", industry: "Industrials" }
              as: PlatformAdmin
              captures: { target_id: $.data.id }
            - call: "POST /fee-schedules"
              payload: { name: "Retained Std", engagement_type: "RETAINED", base_fee_pct: 0.30, premium_fee_pct: 0.35, tier_threshold_cents: 25000000, contingent_fee_pct: 0.25, retainer_pct: 0.35, progress_pct: 0.35, admin_fee_pct: 0.02, guarantee_days: 180, off_limits_days: 365, client_protection_days: 730 }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_company_id: "${client_id}", fee_schedule_id: "${fs_id}", fee_cap_cents: 20000000, min_offer_fit_score: 7.0 }
              as: Partner
              as_user_id: "${p_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Partner
              as_user_id: "${p_id}"
            - call: "POST /search-assignments"
              payload: { engagement_id: "${eng_id}", role_title: "CFO", positions_total: 1, target_first_year_comp_cents: 24000000 }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /target-companies"
