            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id, club_a_v1: $.data.version }
            - call: "POST /safesport/training-courses"
              payload: { code: "SS101", title: "Abuse Prevention Core", validity_days: 365, delivery_mode: "ONLINE", required_for_tiers: ["TIER_1", "TIER_2", "TIER_3"], pass_score: 80 }
              as: NgbAdmin
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Rae Wynn", email: "rae.wynn@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1990-01-19", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_rw_id: $.data.id }
            - call: "POST /safesport/members/${m_rw_id}/screening-orders"
              payload: { expedited: false, expected_club_version: "${club_a_v1}" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { so_rw_id: $.data.id }
            - call: "POST /safesport/screening-orders/${so_rw_id}/result"
              payload: { vendor_disposition: "NO_RECORD" }
              as: ScreeningVendor
            - call: "POST /safesport/screening-orders/${so_rw_id}/adjudicate"
              payload: { disposition: "CLEAR", rationale: "registry return carried no records" }
              as: SafeSportOfficer
            - call: "POST /safesport/training-assignments"
              payload: { member_id: "${m_rw_id}", course_code: "SS101", due_at: "2026-09-01T00:00:00Z" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { ta_rw_id: $.data.id }
            - call: "POST /safesport/training-assignments/${ta_rw_id}/start"
              payload: {}
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
            - call: "POST /safesport/training-assignments/${ta_rw_id}/complete"
              payload: { score: 95 }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
            - call: "GET /safesport/members/${m_rw_id}"
              payload: {}
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { rw_eligible_through: $.data.eligible_through, rw_membership: $.data.membership_status }
          trigger:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-02T23:59:59Z" }
              as: NgbAdmin
            - call: "POST /safesport/members/${m_rw_id}/renew"
              payload: { attestation_signed: true }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { rw_early_error: $.data.error_id }
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-03T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/members/${m_rw_id}/renew"
              payload: { attestation_signed: true }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { rw_membership_after: $.data.membership_status, rw_last_renewed: $.data.last_renewed_at, rw_eligible_after: $.data.eligible_through }
          assert:
            - "${rw_eligible_through} == 2027-08-01T00:00:00.000Z"
            - "${rw_membership} == ACTIVE"
            - "${rw_early_error} == ERR_RENEWAL_WINDOW_NOT_OPEN"
            - "HTTP status is 422 on the 2027-05-02T23:59:59Z renewal"
            - "Member.${m_rw_id}.last_renewed_at == null after the refused attempt"
            - "${rw_membership_after} == ACTIVE"
            - "${rw_last_renewed} == 2027-05-03T00:00:00.000Z"
            - "${rw_eligible_after} == 2027-08-01T00:00:00.000Z"
      - name: member_email_uniqueness_is_case_insensitive_and_crosses_clubs
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_DUPLICATE_MEMBER_EMAIL]
          - errors[ERR_DUPLICATE_COURSE_CODE]
        distinguishing_aspect: |
