# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Roll-Off Dumpster Rental — 9 rules x >= 2 instances = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Reusable fixture conventions (literals pinned, not placeholders):
#   ContainerType YD30: base_rate_cents=50000, included_days=7,
#     overage_day_cents=1500, included_tonnage_lbs=4000, overage_rate_cents_per_lb=9
#   ContractorAccount: credit_limit_cents=500000
#   Clock: deliver 2026-06-01, pickup 2026-06-10 -> rental_days = 10
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_estimate_vs_final_billing_diverge
        grounds:
          - calculations.estimated_charge
          - calculations.final_charge
          - calculations.tonnage_overage_charge
          - state_machines.RentalOrder.UNBILLED_to_ESTIMATED
          - state_machines.RentalOrder.ESTIMATED_to_FINALIZED
          - entities.RentalOrder.fields.estimated_total_cents
          - entities.RentalOrder.fields.final_total_cents
        distinguishing_aspect: |
          On the RentalOrder billing domain, the provisional bill uses the PICKUP
          stop's estimated_weight_lbs (5000) while the final bill uses the
          WeighTicket.net_weight_lbs (6200); for identical days the two totals
          differ by exactly the tonnage delta, so estimated_total_cents=63500 and
          final_total_cents=74300.
        test_recipe:
          setup:
            - "YD30 ContainerType (base 50000, included_days 7, overage_day 1500, included_tonnage 4000, overage_rate 9)"
            - "ACTIVE account with credit_limit 500000; one IN_YARD container of YD30"
            - "Order delivered 2026-06-01, picked up 2026-06-10 (rental_days=10, 3 overage days)"
            - "PICKUP stop estimated_weight_lbs=5000; its WeighTicket net=6200, not contaminated"
          setup_api_calls:
            - call: "POST /_clock/set-current-date"
              payload: { current_date: "2026-06-01" }
              as: YardAdmin
            - call: "POST /container-types"
              payload: { size_code: "YD30", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
              captures: { ct: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Acme", credit_limit_cents: 500000 }
              as: YardAdmin
              captures: { acct: $.data.id }
            - call: "POST /containers"
              payload: { container_type_id: "${ct}", asset_tag: "T-001", yard_code: "Y1" }
              as: YardAdmin
              captures: { cont: $.data.id, cont_v: $.data.version }
            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", site_address: "1 Main", requested_delivery_date: "2026-06-01" }
              as: Contractor
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "GET /service-stops?order_id=${ord}&stop_type=DELIVERY"
              payload: {}
              as: Dispatcher
              captures: { del_stop: "$.data[0].id" }
            - call: "POST /routes"
              payload: { service_date: "2026-06-01", truck_code: "TRK1", capacity_stops: 5 }
              as: Dispatcher
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /rental-orders/${ord}/dispatch-delivery"
              payload: { container_id: "${cont}", expected_container_version: "${cont_v}" }
              as: Dispatcher
            - call: "POST /routes/${r1}/stops"
              payload: { service_stop_id: "${del_stop}", expected_route_version: "${r1_v}" }
              as: Dispatcher
            - call: "POST /routes/${r1}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /service-stops/${del_stop}/complete"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${r1}/close"
              payload: {}
              as: Dispatcher
            - call: "POST /_clock/set-current-date"
              payload: { current_date: "2026-06-10" }
              as: YardAdmin
            - call: "POST /rental-orders/${ord}/pickup-stop"
              payload: { estimated_weight_lbs: 5000 }
              as: Dispatcher
              captures: { pu_stop: $.data.id }
            - call: "POST /routes"
              payload: { service_date: "2026-06-10", truck_code: "TRK2", capacity_stops: 5 }
              as: Dispatcher
              captures: { r2: $.data.id, r2_v: $.data.version }
            - call: "POST /routes/${r2}/stops"
              payload: { service_stop_id: "${pu_stop}", expected_route_version: "${r2_v}" }
              as: Dispatcher
            - call: "POST /routes/${r2}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /weigh-tickets"
              payload: { order_id: "${ord}", service_stop_id: "${pu_stop}", gross_weight_lbs: 16200, tare_weight_lbs: 10000 }
              as: ScaleOperator
          trigger:
            - call: "POST /service-stops/${pu_stop}/complete"
              payload: {}
              as: Dispatcher
              captures: { stop_status: $.data.status }
          assert:
            - "RentalOrder.${ord}.estimated_total_cents == 63500"
            - "RentalOrder.${ord}.final_total_cents == 74300"
            - "RentalOrder.${ord}.estimated_total_cents != RentalOrder.${ord}.final_total_cents"
            - "RentalOrder.${ord}.billing_status == FINALIZED"
            - "RentalOrder.${ord}.logistics_status == COMPLETED"

      - name: account_credit_current_vs_projected
        grounds:
          - calculations.credit_availability
          - entities.ContractorAccount.fields.available_credit_cents
          - validations[priority=13]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          On the ContractorAccount domain (distinct from RentalOrder billing), the
          current available_credit_cents read is 40000 while the projected reading
          for a new YD30 booking subtracts base_rate_cents 50000 giving -10000<0, so
          GET reports 40000 but POST /rental-orders is rejected with
          ERR_CREDIT_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "YD30 ContainerType base_rate_cents=50000"
            - "Account credit_limit_cents=40000 (intentionally below one base haul), status ACTIVE, no invoices yet so outstanding=0, available=40000"
          setup_api_calls:
            - call: "POST /container-types"
              payload: { size_code: "YD30", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
              captures: { ct: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Tight", credit_limit_cents: 40000 }
              as: YardAdmin
              captures: { acct: $.data.id }
            - call: "GET /contractor-accounts/${acct}"
              payload: {}
              as: YardAdmin
              captures: { avail: $.data.available_credit_cents }
          trigger:
            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", site_address: "9 Elm", requested_delivery_date: "2026-07-01" }
              as: Contractor
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "ContractorAccount.${acct}.available_credit_cents == 40000"
            - "trigger response status == 402"
            - "trigger response data.error_id == ERR_CREDIT_LIMIT_EXCEEDED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: final_charge_nonlinear_five_components
        grounds:
          - calculations.final_charge
          - calculations.overage_day_charge
          - calculations.tonnage_overage_charge
          - calculations.contamination_fee
          - entities.Invoice.fields.total_cents
          - state_machines.RentalOrder.ESTIMATED_to_FINALIZED
        distinguishing_aspect: |
          Mode (a): final_charge composes >= 5 inputs with non-linear interaction —
          base + threshold(overage_day on rental_days) + threshold(tonnage on net
          weight) + APPROVED-permit flat + tiered HAZMAT contamination whose
          surcharge is keyed to overage pounds; for rental_days=8, net=7000,
          permit=20000, HAZMAT, total_cents=193500.
        test_recipe:
          setup:
            - "YD30 ContainerType (base 50000, included_days 7, overage_day 1500, included_tonnage 4000, overage_rate 9)"
            - "Order requires_street_permit=true, an APPROVED permit fee 20000 covering 2026-06-01..2026-06-30"
            - "Delivered 2026-06-01, picked up 2026-06-08 (rental_days=8 -> 1 overage day)"
            - "PICKUP WeighTicket net=7000, contaminated HAZMAT"
          setup_api_calls:
            - call: "POST /_clock/set-current-date"
              payload: { current_date: "2026-06-01" }
              as: YardAdmin
            - call: "POST /container-types"
              payload: { size_code: "YD30", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
              captures: { ct: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Haz Co", credit_limit_cents: 1000000 }
              as: YardAdmin
              captures: { acct: $.data.id }
            - call: "POST /containers"
              payload: { container_type_id: "${ct}", asset_tag: "T-HZ", yard_code: "Y1" }
              as: YardAdmin
              captures: { cont: $.data.id, cont_v: $.data.version }
            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", site_address: "5 Dock", requested_delivery_date: "2026-06-01", requires_street_permit: true }
              as: Contractor
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /street-permits"
              payload: { order_id: "${ord}", municipality: "Springfield", permit_fee_cents: 20000, valid_from: "2026-06-01", valid_until: "2026-06-30" }
              as: PermitOfficer
              captures: { perm: $.data.id }
            - call: "POST /street-permits/${perm}/approve"
              payload: {}
              as: PermitOfficer
            - call: "GET /service-stops?order_id=${ord}&stop_type=DELIVERY"
              payload: {}
              as: Dispatcher
              captures: { del_stop: "$.data[0].id" }
            - call: "POST /routes"
              payload: { service_date: "2026-06-01", truck_code: "TRKA", capacity_stops: 5 }
              as: Dispatcher
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /rental-orders/${ord}/dispatch-delivery"
              payload: { container_id: "${cont}", expected_container_version: "${cont_v}" }
              as: Dispatcher
            - call: "POST /routes/${r1}/stops"
              payload: { service_stop_id: "${del_stop}", expected_route_version: "${r1_v}" }
              as: Dispatcher
            - call: "POST /routes/${r1}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /service-stops/${del_stop}/complete"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${r1}/close"
              payload: {}
              as: Dispatcher
            - call: "POST /_clock/set-current-date"
              payload: { current_date: "2026-06-08" }
              as: YardAdmin
            - call: "POST /rental-orders/${ord}/pickup-stop"
              payload: { estimated_weight_lbs: 7000 }
              as: Dispatcher
              captures: { pu_stop: $.data.id }
            - call: "POST /routes"
              payload: { service_date: "2026-06-08", truck_code: "TRKB", capacity_stops: 5 }
              as: Dispatcher
              captures: { r2: $.data.id, r2_v: $.data.version }
            - call: "POST /routes/${r2}/stops"
              payload: { service_stop_id: "${pu_stop}", expected_route_version: "${r2_v}" }
              as: Dispatcher
            - call: "POST /routes/${r2}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /weigh-tickets"
              payload: { order_id: "${ord}", service_stop_id: "${pu_stop}", gross_weight_lbs: 17000, tare_weight_lbs: 10000, contaminated: true, contamination_kind: "HAZMAT" }
              as: ScaleOperator
          trigger:
            - call: "POST /service-stops/${pu_stop}/complete"
              payload: {}
              as: Dispatcher
          assert:
            - "RentalOrder.${ord}.final_total_cents == 193500"
            - "Invoice for order ${ord}: base_cents == 50000"
            - "Invoice for order ${ord}: overage_day_cents == 1500"
            - "Invoice for order ${ord}: tonnage_cents == 27000"
            - "Invoice for order ${ord}: permit_cents == 20000"
            - "Invoice for order ${ord}: contamination_cents == 95000"
            - "Invoice for order ${ord}: total_cents == 193500"

      - name: contamination_after_tonnage_pinned_eval_order
        grounds:
          - calculations.contamination_fee
          - calculations.tonnage_overage_charge
          - calculations.final_charge
          - entities.Invoice.fields.contamination_cents
          - entities.Invoice.fields.tonnage_cents
        distinguishing_aspect: |
          Mode (c): the HAZMAT contamination surcharge reads the SAME overage pounds
          (net 7000 - included 4000 = 3000) that tonnage_overage_charge consumes, so
          the scaffold pins step 3 (tonnage) before step 5 (contamination); the
          surcharge component is 3000*15=45000 and is well-defined only because
          overage pounds are computed once, before contamination.
        test_recipe:
          setup:
            - "Same fixture skeleton as final_charge_nonlinear_five_components but isolate that tonnage_cents (27000) and the HAZMAT surcharge slice (45000 of the 95000) both derive from the identical 3000 overage pounds"
            - "Independent fresh fixture: YD30, account, order (no permit), delivered 2026-06-01 picked 2026-06-02 (rental_days=2, 0 overage days), net=7000 HAZMAT"
          setup_api_calls:
            - call: "POST /_clock/set-current-date"
              payload: { current_date: "2026-06-01" }
              as: YardAdmin
            - call: "POST /container-types"
              payload: { size_code: "YD30", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
              captures: { ct: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Haz2", credit_limit_cents: 1000000 }
              as: YardAdmin
              captures: { acct: $.data.id }
            - call: "POST /containers"
              payload: { container_type_id: "${ct}", asset_tag: "T-HZ2", yard_code: "Y1" }
              as: YardAdmin
              captures: { cont: $.data.id, cont_v: $.data.version }
            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", site_address: "6 Dock", requested_delivery_date: "2026-06-01" }
              as: Contractor
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "GET /service-stops?order_id=${ord}&stop_type=DELIVERY"
              payload: {}
              as: Dispatcher
              captures: { del_stop: "$.data[0].id" }
            - call: "POST /routes"
              payload: { service_date: "2026-06-01", truck_code: "TRKC", capacity_stops: 5 }
              as: Dispatcher
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /rental-orders/${ord}/dispatch-delivery"
              payload: { container_id: "${cont}", expected_container_version: "${cont_v}" }
              as: Dispatcher
            - call: "POST /routes/${r1}/stops"
              payload: { service_stop_id: "${del_stop}", expected_route_version: "${r1_v}" }
              as: Dispatcher
            - call: "POST /routes/${r1}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /service-stops/${del_stop}/complete"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${r1}/close"
              payload: {}
              as: Dispatcher
            - call: "POST /_clock/set-current-date"
              payload: { current_date: "2026-06-02" }
              as: YardAdmin
            - call: "POST /rental-orders/${ord}/pickup-stop"
              payload: { estimated_weight_lbs: 7000 }
              as: Dispatcher
              captures: { pu_stop: $.data.id }
            - call: "POST /routes"
              payload: { service_date: "2026-06-02", truck_code: "TRKD", capacity_stops: 5 }
              as: Dispatcher
              captures: { r2: $.data.id, r2_v: $.data.version }
            - call: "POST /routes/${r2}/stops"
              payload: { service_stop_id: "${pu_stop}", expected_route_version: "${r2_v}" }
              as: Dispatcher
            - call: "POST /routes/${r2}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /weigh-tickets"
              payload: { order_id: "${ord}", service_stop_id: "${pu_stop}", gross_weight_lbs: 17000, tare_weight_lbs: 10000, contaminated: true, contamination_kind: "HAZMAT" }
              as: ScaleOperator
          trigger:
            - call: "POST /service-stops/${pu_stop}/complete"
              payload: {}
              as: Dispatcher
          assert:
            - "Invoice for order ${ord}: tonnage_cents == 27000"
            - "Invoice for order ${ord}: contamination_cents == 95000"
            - "Invoice for order ${ord}: overage_day_cents == 0"
            - "Invoice for order ${ord}: total_cents == 172000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rental_order_parallel_logistics_and_billing_axes
        grounds:
          - state_machines.RentalOrder.BOOKED_to_SCHEDULED
          - state_machines.RentalOrder.UNBILLED_to_ESTIMATED
          - state_machines.RentalOrder.ESTIMATED_to_FINALIZED
          - entities.RentalOrder.fields.logistics_status
          - entities.RentalOrder.fields.billing_status
        distinguishing_aspect: |
          RentalOrder carries two independent state axes on one row: logistics_status
          advances BOOKED->SCHEDULED->ON_SITE while billing_status stays UNBILLED, and
          only flips ESTIMATED->FINALIZED on the PICKUP-complete; an ON_SITE order is
          observably (logistics_status=ON_SITE, billing_status=UNBILLED).
        test_recipe:
          setup:
            - "Order delivered and ON_SITE but not yet picked up"
          setup_api_calls:
            - call: "POST /_clock/set-current-date"
              payload: { current_date: "2026-06-01" }
              as: YardAdmin
            - call: "POST /container-types"
              payload: { size_code: "YD20", base_rate_cents: 40000, included_days: 7, overage_day_cents: 1200, included_tonnage_lbs: 3000, overage_rate_cents_per_lb: 8 }
              as: YardAdmin
              captures: { ct: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Par", credit_limit_cents: 500000 }
              as: YardAdmin
              captures: { acct: $.data.id }
            - call: "POST /containers"
              payload: { container_type_id: "${ct}", asset_tag: "T-P1", yard_code: "Y1" }
              as: YardAdmin
              captures: { cont: $.data.id, cont_v: $.data.version }
            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", site_address: "2 Oak", requested_delivery_date: "2026-06-01" }
              as: Contractor
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "GET /service-stops?order_id=${ord}&stop_type=DELIVERY"
              payload: {}
              as: Dispatcher
              captures: { del_stop: "$.data[0].id" }
            - call: "POST /routes"
              payload: { service_date: "2026-06-01", truck_code: "TRKE", capacity_stops: 5 }
              as: Dispatcher
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /rental-orders/${ord}/dispatch-delivery"
              payload: { container_id: "${cont}", expected_container_version: "${cont_v}" }
              as: Dispatcher
            - call: "POST /routes/${r1}/stops"
              payload: { service_stop_id: "${del_stop}", expected_route_version: "${r1_v}" }
              as: Dispatcher
            - call: "POST /routes/${r1}/dispatch"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /service-stops/${del_stop}/complete"
              payload: {}
              as: Dispatcher
              captures: { st: $.data.status }
          assert:
            - "RentalOrder.${ord}.logistics_status == ON_SITE"
            - "RentalOrder.${ord}.billing_status == UNBILLED"
            - "RentalOrder.${ord}.delivered_on == 2026-06-01"

      - name: container_cyclic_yard_to_yard
        grounds:
          - state_machines.Container.IN_YARD_to_ASSIGNED
          - state_machines.Container.ASSIGNED_to_ON_SITE
          - state_machines.Container.ON_SITE_to_AWAITING_DUMP
          - state_machines.Container.AWAITING_DUMP_to_IN_YARD
          - entities.Container.fields.status
        distinguishing_aspect: |
          On the Container entity (different from RentalOrder), the lifecycle is a
          true cycle IN_YARD->ASSIGNED->ON_SITE->AWAITING_DUMP->IN_YARD; after a full
          rental + return-to-yard the same container returns to IN_YARD with
          current_order_id=null and version advanced by 4 hop transitions.
        test_recipe:
          setup:
            - "A container that completes one full rental: dispatched, on-site, picked up (AWAITING_DUMP), then returned to yard"
          setup_api_calls:
            - call: "POST /_clock/set-current-date"
              payload: { current_date: "2026-06-01" }
              as: YardAdmin
            - call: "POST /container-types"
              payload: { size_code: "YD10", base_rate_cents: 30000, included_days: 7, overage_day_cents: 1000, included_tonnage_lbs: 2000, overage_rate_cents_per_lb: 7 }
              as: YardAdmin
              captures: { ct: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Cyc", credit_limit_cents: 500000 }
              as: YardAdmin
              captures: { acct: $.data.id }
            - call: "POST /containers"
              payload: { container_type_id: "${ct}", asset_tag: "T-CY", yard_code: "Y1" }
              as: YardAdmin
              captures: { cont: $.data.id, cont_v: $.data.version }
            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", site_address: "3 Pine", requested_delivery_date: "2026-06-01" }
              as: Contractor
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "GET /service-stops?order_id=${ord}&stop_type=DELIVERY"
              payload: {}
              as: Dispatcher
              captures: { del_stop: "$.data[0].id" }
            - call: "POST /routes"
              payload: { service_date: "2026-06-01", truck_code: "TRKF", capacity_stops: 5 }
              as: Dispatcher
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /rental-orders/${ord}/dispatch-delivery"
              payload: { container_id: "${cont}", expected_container_version: "${cont_v}" }
              as: Dispatcher
            - call: "POST /routes/${r1}/stops"
              payload: { service_stop_id: "${del_stop}", expected_route_version: "${r1_v}" }
              as: Dispatcher
            - call: "POST /routes/${r1}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /service-stops/${del_stop}/complete"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${r1}/close"
              payload: {}
              as: Dispatcher
            - call: "POST /_clock/set-current-date"
              payload: { current_date: "2026-06-05" }
              as: YardAdmin
            - call: "POST /rental-orders/${ord}/pickup-stop"
              payload: { estimated_weight_lbs: 1000 }
              as: Dispatcher
              captures: { pu_stop: $.data.id }
            - call: "POST /routes"
              payload: { service_date: "2026-06-05", truck_code: "TRKG", capacity_stops: 5 }
              as: Dispatcher
              captures: { r2: $.data.id, r2_v: $.data.version }
            - call: "POST /routes/${r2}/stops"
              payload: { service_stop_id: "${pu_stop}", expected_route_version: "${r2_v}" }
              as: Dispatcher
            - call: "POST /routes/${r2}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /weigh-tickets"
