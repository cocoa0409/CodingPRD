  # ------------------------------------------------------------ write surface -
  - method: POST
    path: "/athletics/terms"
    description: "Register an academic term. start_date is inclusive and end_date is exclusive."
    roles: [Registrar]
    code: 201
    input: ["code", "term_index", "term_type", "catalog_year", "start_date", "end_date", "full_time_credit_minimum?", "is_apr_reporting_term?"]
    output: Term
    side_effects:
      - "creates the term with apr_status = OPEN, apr_points_possible = 0, apr_points_earned = 0 and squad_apr = null"

  - method: POST
    path: "/athletics/terms/{term_id}/apr-close"
    description: "Close the term for academic-progress-rate reporting. Runs apr_points_award over the term cohort and expires lapsed tutor training."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Term
    side_effects:
      - "transitions Term.apr_status OPEN -> CLOSED"
      - "runs apr_points_award and writes Term.apr_points_possible, Term.apr_points_earned and Term.squad_apr"
      - "writes each cohort StudentAthlete's apr_points_possible, apr_points_earned and apr_points_forfeited and re-derives support_status"
      - "transitions every TRAINED Tutor whose training_valid_through_term_index <= Term.term_index to EXPIRED and completes their in-term assignments with terminated_reason = TERM_CLOSED"
      - "runs tutor_compliance_penalty for every affected tutor"

  - method: POST
    path: "/athletics/degree-programs"
    description: "Register a degree program with its progress-toward-degree constants."
    roles: [Registrar]
    code: 201
    input: ["code", "name", "catalog_year", "total_required_credits", "min_progress_gpa?", "major_declaration_deadline_term_count?", "max_elective_credits_countable?"]
    output: DegreeProgram
    side_effects: []

  - method: POST
    path: "/athletics/courses"
    description: "Register a course with its weekly meeting pattern. meeting_days holds ISO weekday numbers (1 = Monday ... 7 = Sunday); each meeting occupies [meeting_start_minute_utc, meeting_start_minute_utc + meeting_duration_minutes)."
    roles: [Registrar]
    code: 201
    input: ["subject_code", "course_number", "title", "credit_hours", "instructor_user_id", "is_remedial?", "meeting_days?", "meeting_start_minute_utc?", "meeting_duration_minutes?"]
    output: Course
    side_effects: []

  - method: POST
    path: "/athletics/degree-applicability-rules"
    description: "Declare how one course counts toward one degree program for one catalog year."
    roles: [Registrar]
    code: 201
    input: ["degree_program_id", "course_id", "effective_catalog_year", "applicability", "max_countable_credits?"]
    output: DegreeApplicabilityRule
    side_effects:
      - "re-runs degree_applicable_credit_audit for every StudentAthlete whose declared_program_id equals degree_program_id, then progress_benchmark_evaluation, academic_risk_score and support_requirement_hours"

  - method: POST
    path: "/athletics/student-athletes"
    description: "Register a student-athlete. The row starts with no declared major, eligibility_state = NOT_CERTIFIED, support_status = SUPPORT_NORMAL and risk_tier = TIER_1."
    roles: [Registrar]
    code: 201
    input: ["full_name", "sport_code", "entry_term_index", "entry_catalog_year", "transfer_status?", "missed_class_units_allowance?"]
    output: StudentAthlete
    side_effects:
      - "sets missed_class_units_charged = 0 and missed_class_units_remaining = missed_class_units_allowance"

  - method: POST
    path: "/athletics/student-athletes/{student_athlete_id}/major-declaration"
    description: "Record or change the student's declared degree program in a given term. Rejected once the major declaration deadline has passed."
    roles: [Registrar, AcademicAdvisor]
    code: 200
    input: ["declared_program_id", "term_id"]
    output: StudentAthlete
    side_effects:
      - "writes declared_program_id and major_declared_term_index = Term(term_id).term_index"
      - "re-runs degree_applicable_credit_audit, transfer_credit_acceptance, progress_benchmark_evaluation, academic_risk_score and support_requirement_hours"
      - "increments StudentAthlete.version by 1"

  - method: POST
    path: "/athletics/enrollments"
    description: "Enroll a student in a course for a term. credit_hours defaults to the Course's credit_hours when omitted."
    roles: [Registrar]
    code: 201
    input: ["student_athlete_id", "course_id", "term_id", "credit_hours?", "credit_source?"]
    output: Enrollment
    side_effects:
      - "creates the enrollment with status = ENROLLED, earned_credit_hours = 0 and is_full_time_countable = false"

  - method: POST
    path: "/athletics/enrollments/{enrollment_id}/outcome"
    description: "Record the academic outcome of an enrollment. action is one of RECORD_GRADE, DROP, WITHDRAW, MARK_INCOMPLETE; grade is required for RECORD_GRADE and forbidden otherwise."
    roles: [Registrar]
    code: 200
    input: ["action", "grade?"]
    output: Enrollment
    side_effects:
      - "for RECORD_GRADE: status -> COMPLETED, grade_points from the grade scale (A 4.00, B 3.00, C 2.00, D 1.00, F 0.00), earned_credit_hours = credit_hours when grade_points > 0.00 else 0, outcome_recorded_at = logical clock"
      - "for DROP or WITHDRAW: status -> DROPPED or WITHDRAWN and every PROPOSED or ACTIVE TutorAssignment on this enrollment is TERMINATED with terminated_reason = ENROLLMENT_DROPPED, releasing Tutor.assigned_weekly_hours"
      - "re-runs degree_applicable_credit_audit, transfer_credit_acceptance, progress_benchmark_evaluation, academic_risk_score and support_requirement_hours for the student and re-derives support_status"
      - "increments StudentAthlete.version by 1"

  - method: POST
    path: "/athletics/certifications"
    description: "Create an eligibility certification in DRAFT and freeze the degree-applicability audit onto it. Any existing DRAFT certification for the same (student_athlete_id, term_id) is superseded. expected_student_athlete_version must equal the student's current version."
    roles: [CertificationOfficer]
    code: 201
    input: ["student_athlete_id", "term_id", "certification_type", "expected_student_athlete_version", "audit_variant?"]
    output: EligibilityCertification
    side_effects:
      - "runs degree_applicable_credit_audit and progress_benchmark_evaluation and freezes degree_applicable_credits_counted, required_progress_pct, progress_pct, gpa_at_certification, completed_full_time_terms_counted, benchmark_result and failure_reasons onto the certification"
      - "sets requested_by_user_id = X-User-ID and audit_variant to the resolved variant"
      - "transitions any existing DRAFT certification for the same (student_athlete_id, term_id) to SUPERSEDED"
      - "increments StudentAthlete.version by 1"

  - method: POST
    path: "/athletics/certifications/{certification_id}/status"
    description: "Advance an eligibility certification. action is one of SUBMIT, CERTIFY, DENY, REVOKE. SUBMIT is the AcademicAdvisor's step; CERTIFY, DENY and REVOKE belong to the CertificationOfficer. RESTORED is never requested directly: it is produced only by the appeal-GRANT cascade."
    roles: [CertificationOfficer, AcademicAdvisor]
    code: 200
    input: ["action"]
    output: EligibilityCertification
    side_effects:
      - "for CERTIFY or DENY: writes decided_by_user_id = X-User-ID and decided_at = logical clock; decided_by_user_id must differ from requested_by_user_id"
      - "re-derives StudentAthlete.eligibility_state from the certification's new status"
      - "for REVOKE: eligibility_state -> INELIGIBLE while the student's apr_points_possible is unchanged, so apr_points_possible == apr_points_earned + apr_points_forfeited still holds"
      - "increments StudentAthlete.version by 1"

  - method: POST
    path: "/athletics/tutors"
    description: "Register a tutor. The tutor starts UNTRAINED with penalty_points = 0 and assigned_weekly_hours = 0."
    roles: [LearningSpecialist]
    code: 201
    input: ["full_name", "subject_codes", "max_weekly_hours?"]
    output: Tutor
    side_effects: []

  - method: POST
    path: "/athletics/tutors/{tutor_id}/status"
    description: "Change a tutor's compliance standing. action is one of COMPLETE_TRAINING, SUSPEND, REINSTATE, TERMINATE; term_id is required for COMPLETE_TRAINING and names the term in which training was completed."
    roles: [LearningSpecialist, ComplianceOfficer]
    code: 200
    input: ["action", "term_id?"]
    output: Tutor
    side_effects:
      - "for COMPLETE_TRAINING: status -> TRAINED, training_completed_term_index = Term(term_id).term_index and training_valid_through_term_index = that index + TRAINING_VALIDITY_TERMS - 1"
      - "for SUSPEND or TERMINATE: every PROPOSED or ACTIVE TutorAssignment of the tutor is TERMINATED with terminated_reason = TUTOR_SUSPENDED in created_at ASC order, assigned_weekly_hours is released, and support_requirement_hours re-runs for each affected StudentAthlete"
      - "runs tutor_compliance_penalty"

  - method: POST
    path: "/athletics/tutor-assignments"
    description: "Propose a tutor for one enrollment. The assignment starts PROPOSED and reserves no hours until it is activated."
    roles: [LearningSpecialist]
    code: 201
    input: ["tutor_id", "enrollment_id", "weekly_hours"]
    output: TutorAssignment
    side_effects:
      - "creates the assignment with status = PROPOSED, suspension_count = 0 and logged_hours = 0"

  - method: POST
    path: "/athletics/tutor-assignments/{assignment_id}/status"
    description: "Move a tutor assignment through its lifecycle. action is one of ACTIVATE, SUSPEND, REINSTATE, COMPLETE, TERMINATE; terminated_reason is required for TERMINATE."
    roles: [LearningSpecialist]
    code: 200
    input: ["action", "terminated_reason?"]
    output: TutorAssignment
    side_effects:
      - "for ACTIVATE or REINSTATE: Tutor.assigned_weekly_hours increases by weekly_hours"
      - "for SUSPEND: increments suspension_count and Tutor.assigned_weekly_hours decreases by weekly_hours"
      - "for COMPLETE or TERMINATE: Tutor.assigned_weekly_hours decreases by weekly_hours when the assignment was ACTIVE, so assigned_weekly_hours always equals the sum of weekly_hours over the tutor's ACTIVE assignments"
      - "re-runs support_requirement_hours for the assignment's StudentAthlete and re-derives support_status"
      - "increments StudentAthlete.version by 1"

  - method: POST
    path: "/athletics/support-sessions"
    description: "Log an immutable study-hall or tutoring session. tutor_assignment_id is required for session_type = TUTOR_SESSION and must be omitted for STUDY_HALL. start_at is inclusive and end_at is exclusive."
    roles: [LearningSpecialist, Tutor]
    code: 201
    input: ["student_athlete_id", "session_type", "start_at", "end_at", "tutor_assignment_id?"]
    output: SupportSession
    side_effects:
      - "computes hours_credited from (end_at - start_at) in minutes divided by 60, rounded to 2 decimals ROUND_HALF_UP, and term_index_of_record from the Term containing start_at"
      - "sets logged_by_user_id = X-User-ID"
      - "increments TutorAssignment.logged_hours by hours_credited when tutor_assignment_id is present"

  - method: POST
    path: "/athletics/competition-events"
    description: "Schedule a competition event. missed_class_unit_multiplier is derived from event_type: REGULAR_SEASON 1.0, CONFERENCE_CHAMPIONSHIP 0.5, POSTSEASON 0.0, EXHIBITION 1.0. departure_at is inclusive and return_at is exclusive."
    roles: [AthleticsOperations]
    code: 201
    input: ["sport_code", "term_id", "event_type", "departure_at", "return_at"]
    output: CompetitionEvent
    side_effects:
      - "creates the event with status = SCHEDULED, charged_units_total = 0 and the derived missed_class_unit_multiplier"

  - method: POST
    path: "/athletics/competition-events/{event_id}/status"
    description: "Advance a competition event. action is one of APPROVE_TRAVEL, DEPART, COMPLETE, CANCEL."
    roles: [AthleticsOperations]
    code: 200
    input: ["action"]
    output: CompetitionEvent
    side_effects:
      - "for CANCEL: every non-terminal MissedClassRequest of the event transitions to VOIDED in created_at ASC order, charged_units_total drops to 0, and each affected StudentAthlete's missed_class_units_charged decreases and missed_class_units_remaining increases by that request's missed_units"
      - "for CANCEL: academic_risk_score and support_requirement_hours re-run for each affected StudentAthlete, support_status is re-derived, and StudentAthlete.version increments by 1"

  - method: POST
    path: "/athletics/missed-class-requests"
    description: "Open a missed-class request for one enrollment against one TRAVEL_APPROVED competition event. Computes the missed meeting count and unit charge from the course meeting pattern and the travel window."
    roles: [AcademicAdvisor]
    code: 201
    input: ["competition_event_id", "enrollment_id"]
    output: MissedClassRequest
    side_effects:
      - "runs missed_class_units and writes missed_meeting_count, missed_units_gross and missed_units"
      - "increases StudentAthlete.missed_class_units_charged by missed_units, decreases missed_class_units_remaining by the same amount, and increases CompetitionEvent.charged_units_total by missed_units"
      - "re-runs academic_risk_score and support_requirement_hours and re-derives support_status"
      - "increments StudentAthlete.version by 1"

  - method: POST
    path: "/athletics/missed-class-requests/{request_id}/status"
    description: "Drive instructor notification and response. action is one of NOTIFY_INSTRUCTOR, ACKNOWLEDGE, DISPUTE, CANCEL; instructor_response_note is accepted for ACKNOWLEDGE and DISPUTE."
    roles: [AcademicAdvisor, Instructor]
    code: 200
    input: ["action", "instructor_response_note?"]
    output: MissedClassRequest
    side_effects:
      - "for NOTIFY_INSTRUCTOR: writes instructor_user_id from the enrolled Course, notified_at = logical clock and acknowledgement_deadline_at = notified_at + ACKNOWLEDGEMENT_WINDOW_HOURS"
      - "for DISPUTE: increments dispute_count by 1"
      - "for CANCEL: releases missed_units back to the student (missed_class_units_charged decreases, missed_class_units_remaining increases), decreases CompetitionEvent.charged_units_total, re-runs academic_risk_score and support_requirement_hours, and increments StudentAthlete.version by 1"

  - method: POST
    path: "/athletics/appeals"
    description: "File an eligibility appeal against a DENIED or REVOKED certification. Supplying predecessor_appeal_id continues an existing chain and sets round_number = predecessor.round_number + 1."
    roles: [AcademicAdvisor, CertificationOfficer]
    code: 201
    input: ["certification_id", "appeal_type", "rationale", "requested_credit_relief?", "predecessor_appeal_id?"]
    output: EligibilityAppeal
    side_effects:
      - "creates the appeal in DRAFT with round_number = 1 when predecessor_appeal_id is omitted, and granted_credit_relief = 0"
      - "sets submitted_by_user_id = X-User-ID"

  - method: POST
    path: "/athletics/appeals/{appeal_id}/status"
    description: "Advance an eligibility appeal. action is one of SUBMIT, OPEN_REVIEW, GRANT, DENY, REQUEST_REVISION, WITHDRAW; granted_credit_relief is required for GRANT and must be at most requested_credit_relief."
    roles: [AppealsCommittee, AcademicAdvisor]
    code: 200
    input: ["action", "granted_credit_relief?"]
    output: EligibilityAppeal
    side_effects:
      - "for GRANT or DENY: writes decided_by_user_id = X-User-ID and decided_at = logical clock; decided_by_user_id must differ from submitted_by_user_id"
      - "for GRANT: writes granted_credit_relief, re-runs progress_benchmark_evaluation with the relief added to degree_applicable_credits, transitions the linked certification DENIED|REVOKED -> RESTORED and re-derives StudentAthlete.eligibility_state to RESTORED_BY_WAIVER"
      - "increments StudentAthlete.version by 1"

  - method: POST
    path: "/athletics/compliance-incidents"
    description: "Report a suspected impermissible-academic-assistance incident. The incident starts REPORTED with penalty_points_assessed = 0 and no severity."
    roles: [ComplianceOfficer, LearningSpecialist, AcademicAdvisor]
    code: 201
    input: ["student_athlete_id", "incident_type", "narrative", "tutor_id?", "discovered_session_id?"]
    output: ComplianceIncident
    side_effects:
      - "sets reported_by_user_id = X-User-ID"

  - method: POST
    path: "/athletics/compliance-incidents/{incident_id}/status"
    description: "Advance a compliance incident. action is one of OPEN_INVESTIGATION, SUBSTANTIATE, UNSUBSTANTIATE, REMEDIATE; severity is required for SUBSTANTIATE."
    roles: [ComplianceOfficer]
    code: 200
    input: ["action", "severity?"]
    output: ComplianceIncident
    side_effects:
      - "for SUBSTANTIATE: writes severity and penalty_points_assessed = INCIDENT_POINTS[severity], adds the same points to StudentAthlete.substantiated_penalty_points and, when tutor_id is present, to Tutor.penalty_points"
      - "for SUBSTANTIATE: runs tutor_compliance_penalty, which SUSPENDs the tutor at penalty_points >= 3, TERMINATEs that tutor's PROPOSED and ACTIVE assignments with terminated_reason = TUTOR_SUSPENDED, releases assigned_weekly_hours and re-runs support_requirement_hours for every affected StudentAthlete"
      - "for SUBSTANTIATE with severity = LEVEL_III: the reported student's support_status becomes SUPPORT_WITHHELD and its CERTIFIED or RESTORED certification transitions to REVOKED, re-deriving eligibility_state to INELIGIBLE"
      - "re-runs academic_risk_score and increments StudentAthlete.version by 1"

  - method: POST
    path: "/athletics/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time; every deadline, window and expiry rule in this scaffold is evaluated against this logical clock."
    roles: [Registrar, AcademicAdvisor, CertificationOfficer, LearningSpecialist, ComplianceOfficer, AppealsCommittee, AthleticsOperations, Instructor, Tutor, StudentAthlete]
    code: 200
    input: ["current_utc"]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock; no entity is modified and no calculation is re-run"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- authentication / authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role is missing or is an empty string."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "X-User-Role is not a declared role name, or the role is not listed in the called endpoint's roles."
  - id: ERR_NOT_COURSE_INSTRUCTOR
    http: 403
    condition: "An Instructor acknowledges or disputes a MissedClassRequest whose instructor_user_id differs from X-User-ID."
  - id: ERR_NOT_ASSIGNED_TUTOR
    http: 403
    condition: "A Tutor logs a SupportSession against a TutorAssignment whose tutor_id differs from X-User-ID."
  - id: ERR_NOT_OWN_RECORD
    http: 403
    condition: "A StudentAthlete reads a student-athlete row or eligibility summary whose id differs from X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The user deciding a certification equals its requested_by_user_id, or the user deciding an appeal equals its submitted_by_user_id."

  # ---- existence ----
  - id: ERR_TERM_NOT_FOUND
    http: 404
    condition: "No Term exists with the supplied term_id."
  - id: ERR_DEGREE_PROGRAM_NOT_FOUND
    http: 404
    condition: "No DegreeProgram exists with the supplied degree_program_id."
  - id: ERR_COURSE_NOT_FOUND
    http: 404
    condition: "No Course exists with the supplied course_id."
  - id: ERR_APPLICABILITY_RULE_NOT_FOUND
    http: 404
    condition: "No DegreeApplicabilityRule exists with the supplied rule_id."
  - id: ERR_STUDENT_ATHLETE_NOT_FOUND
    http: 404
    condition: "No StudentAthlete exists with the supplied student_athlete_id."
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "No Enrollment exists with the supplied enrollment_id."
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "No EligibilityCertification exists with the supplied certification_id."
  - id: ERR_TUTOR_NOT_FOUND
    http: 404
    condition: "No Tutor exists with the supplied tutor_id."
  - id: ERR_TUTOR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "No TutorAssignment exists with the supplied assignment_id."
  - id: ERR_SUPPORT_SESSION_NOT_FOUND
    http: 404
    condition: "No SupportSession exists with the supplied session_id or discovered_session_id."
  - id: ERR_COMPETITION_EVENT_NOT_FOUND
    http: 404
    condition: "No CompetitionEvent exists with the supplied event_id or competition_event_id."
  - id: ERR_MISSED_CLASS_REQUEST_NOT_FOUND
    http: 404
    condition: "No MissedClassRequest exists with the supplied request_id."
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "No EligibilityAppeal exists with the supplied appeal_id or predecessor_appeal_id."
  - id: ERR_COMPLIANCE_INCIDENT_NOT_FOUND
    http: 404
    condition: "No ComplianceIncident exists with the supplied incident_id."

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "The body is not a JSON object, a required input field is missing, an enum field carries an undeclared value, a numeric field is outside its declared range, action is not one of the endpoint's declared actions, or a conditionally required companion field (grade for RECORD_GRADE, severity for SUBSTANTIATE, granted_credit_relief for GRANT, term_id for COMPLETE_TRAINING, terminated_reason for TERMINATE) is absent."
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "A supplied instant pair does not satisfy start < end strictly: start_date >= end_date, departure_at >= return_at, or start_at >= end_at."

  # ---- concurrency ----
  - id: ERR_STALE_STUDENT_VERSION
    http: 412
    condition: "expected_student_athlete_version on POST /athletics/certifications differs from the StudentAthlete's current version."

  # ---- state ----
  - id: ERR_APR_TERM_CLOSED
    http: 409
    condition: "A certification, appeal, enrollment-outcome or missed-class write targets a Term whose apr_status == CLOSED."
  - id: ERR_APR_TERM_NOT_ENDED
    http: 409
    condition: "APR close is requested while the logical clock is before Term.end_date."
  - id: ERR_APR_PRIOR_TERM_OPEN
    http: 409
    condition: "APR close is requested while a reporting Term with a lower term_index still has apr_status == OPEN."
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The requested action is not a declared transition out of the target entity's current state, including every attempt from a terminal state and every repeat of an already-applied action."
  - id: ERR_EVENT_NOT_TRAVEL_APPROVED
    http: 409
    condition: "A MissedClassRequest is created against a CompetitionEvent whose status is not TRAVEL_APPROVED."
  - id: ERR_APPEAL_NOT_ELIGIBLE
    http: 422
    condition: "An appeal is filed or decided against an EligibilityCertification whose status is not DENIED and not REVOKED."

  # ---- compliance / safety ----
  - id: ERR_TUTOR_NOT_TRAINED
    http: 422
    condition: "A TutorAssignment is created or activated for a Tutor whose status == UNTRAINED."
  - id: ERR_TUTOR_TRAINING_EXPIRED
    http: 422
    condition: "A TutorAssignment is created or activated for a Tutor whose status is EXPIRED, SUSPENDED or TERMINATED."
  - id: ERR_IMPERMISSIBLE_ASSISTANCE_BLOCK
    http: 422
    condition: "A TUTOR_SESSION support session is logged for a student whose support_status == SUPPORT_WITHHELD, or against a tutor holding a SUBSTANTIATED LEVEL_III incident involving that same student."

  # ---- referential ----
  - id: ERR_TUTOR_SUBJECT_MISMATCH
    http: 422
    condition: "The Tutor's subject_codes list does not contain the subject_code of the Course behind the assignment's Enrollment."
  - id: ERR_MAJOR_NOT_DECLARED
    http: 422
    condition: "A CONTINUING or TRANSFER certification is created for a StudentAthlete whose declared_program_id is null. INITIAL certifications are exempt."
  - id: ERR_ENROLLMENT_NOT_NOTIFIABLE
    http: 422
    condition: "The Enrollment behind a MissedClassRequest belongs to a different StudentAthlete than the event's existing roster, or its Course.instructor_user_id is an empty string."
  - id: ERR_TRANSFER_CREDIT_SOURCE_INVALID
    http: 422
    condition: "A TRANSFER certification is created for a student with no COMPLETED enrollment whose credit_source == TRANSFER."
  - id: ERR_CERTIFICATION_TYPE_TERM_MISMATCH
    http: 422
    condition: "certification_type does not match the term: INITIAL with Term.term_index != entry_term_index, CONTINUING with Term.term_index <= entry_term_index, or TRANSFER for a student whose transfer_status == NATIVE."

  # ---- temporal ----
  - id: ERR_MAJOR_DECLARATION_DEADLINE_PASSED
    http: 422
    condition: "A major declaration is recorded in a Term whose term_index exceeds entry_term_index + major_declaration_deadline_term_count - 1."
  - id: ERR_NOTIFICATION_LEAD_TIME_VIOLATION
    http: 422
    condition: "Instructor notification is attempted fewer than NOTIFICATION_LEAD_DAYS (7) days before CompetitionEvent.departure_at; exactly 7 days ahead is accepted."
  - id: ERR_ACKNOWLEDGEMENT_WINDOW_CLOSED
    http: 422
    condition: "An acknowledgement or dispute arrives after acknowledgement_deadline_at (notified_at + ACKNOWLEDGEMENT_WINDOW_HOURS (72)); the deadline instant itself is accepted."
  - id: ERR_SESSION_OUTSIDE_TERM
    http: 422
    condition: "A SupportSession's start_at is before Term.start_date or its end_at is after Term.end_date."
  - id: ERR_TRANSFER_RESIDENCY_NOT_MET
    http: 422
    condition: "A TRANSFER certification is created for an INCOMING_TRANSFER student with fewer than TRANSFER_RESIDENCY_TERMS (1) terms holding a COMPLETED resident enrollment."

  # ---- constraint ----
  - id: ERR_STUDENT_SESSION_OVERLAP
    http: 409
    condition: "A new SupportSession's half-open window [start_at, end_at) overlaps an existing session of the same StudentAthlete by a strictly positive duration; touching endpoints are accepted."
  - id: ERR_TUTOR_BUFFER_VIOLATION
    http: 409
    condition: "Two sessions of the same Tutor are separated by fewer than TUTOR_TRAVEL_BUFFER_MINUTES (20) minutes of clear time; exactly 20 minutes is accepted."
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "A non-terminal Enrollment already exists for the same (student_athlete_id, course_id, term_id)."
  - id: ERR_DUPLICATE_APPLICABILITY_RULE
    http: 409
    condition: "A DegreeApplicabilityRule already exists for the same (degree_program_id, course_id, effective_catalog_year)."
  - id: ERR_APPEAL_ROUNDS_EXHAUSTED
    http: 409
    condition: "A new appeal would take the chain past MAX_APPEAL_ROUNDS (3); a REQUEST_REVISION or SUBMIT is attempted on an appeal already at round_number == MAX_APPEAL_ROUNDS; or a re-notification would take dispute_count past MAX_DISPUTE_ROUNDS (2)."

  # ---- fiscal / capacity ----
  - id: ERR_MISSED_CLASS_ALLOWANCE_EXCEEDED
    http: 422
    condition: "The computed missed_units of a new MissedClassRequest exceeds StudentAthlete.missed_class_units_remaining."
  - id: ERR_TUTOR_WEEKLY_HOURS_EXCEEDED
    http: 422
    condition: "Tutor.assigned_weekly_hours plus the assignment's weekly_hours exceeds Tutor.max_weekly_hours."
  - id: ERR_TIER_HOURS_CAP_EXCEEDED
    http: 422
    condition: "The student's ACTIVE assignment hours plus the new assignment's weekly_hours exceeds TIER_WEEKLY_HOUR_CAP for the student's risk_tier."
  - id: ERR_RELIEF_EXCEEDS_REQUEST
    http: 422
    condition: "granted_credit_relief on an appeal GRANT exceeds the appeal's requested_credit_relief."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Registrar
    description: "University registrar staff: owns the academic catalogue (terms, degree programs, courses, applicability rules), student registration, enrollments and graded outcomes."
    identity: "opaque"
    exclusive_operations:
      - "POST /athletics/terms"
      - "POST /athletics/degree-programs"
      - "POST /athletics/courses"
      - "POST /athletics/degree-applicability-rules"
      - "POST /athletics/student-athletes"
      - "POST /athletics/enrollments"
      - "POST /athletics/enrollments/{enrollment_id}/outcome"
    shared_operations:
      - "POST /athletics/student-athletes/{student_athlete_id}/major-declaration (shared with AcademicAdvisor)"
      - "every GET on the academic catalogue, students, enrollments and certifications"
      - "POST /athletics/_clock/set_current_utc"

  - name: AcademicAdvisor
    description: "Athletics academic advisor: records major declarations, opens missed-class requests, notifies instructors and files appeals on a student's behalf."
    identity: "opaque"
    exclusive_operations:
      - "POST /athletics/missed-class-requests"
    shared_operations:
      - "POST /athletics/student-athletes/{student_athlete_id}/major-declaration (shared with Registrar)"
      - "POST /athletics/missed-class-requests/{request_id}/status with action IN {NOTIFY_INSTRUCTOR, CANCEL} (shared with Instructor for ACKNOWLEDGE and DISPUTE)"
      - "POST /athletics/appeals (shared with CertificationOfficer)"
      - "POST /athletics/certifications/{certification_id}/status with action = SUBMIT (shared with CertificationOfficer)"
      - "POST /athletics/appeals/{appeal_id}/status with action IN {SUBMIT, REQUEST_REVISION, WITHDRAW} (shared with AppealsCommittee)"
      - "POST /athletics/compliance-incidents (shared with ComplianceOfficer and LearningSpecialist)"
      - "reads on students, enrollments, tutors, assignments, sessions, events, requests, certifications and appeals"

  - name: CertificationOfficer
    description: "Compliance certification officer: creates and decides eligibility certifications. Cannot decide a certification it requested (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /athletics/certifications"
    shared_operations:
      - "POST /athletics/certifications/{certification_id}/status with action IN {CERTIFY, DENY, REVOKE}; SUBMIT is shared with AcademicAdvisor"
      - "POST /athletics/appeals (shared with AcademicAdvisor)"
      - "reads on the academic catalogue, students, enrollments, certifications, appeals, tutors, events and incidents"

  - name: LearningSpecialist
    description: "Academic support learning specialist: owns tutor onboarding, tutor assignments and support-session logging."
    identity: "opaque"
    exclusive_operations:
      - "POST /athletics/tutors"
      - "POST /athletics/tutor-assignments"
      - "POST /athletics/tutor-assignments/{assignment_id}/status"
    shared_operations:
      - "POST /athletics/tutors/{tutor_id}/status (shared with ComplianceOfficer)"
      - "POST /athletics/support-sessions (shared with Tutor)"
      - "POST /athletics/compliance-incidents (shared with ComplianceOfficer and AcademicAdvisor)"
      - "reads on students, enrollments, tutors, assignments, sessions and incidents"

  - name: Instructor
    description: "Course instructor: acknowledges or disputes missed-class notifications for the courses it teaches. X-User-ID is an opaque instructor identifier compared to Course.instructor_user_id and to MissedClassRequest.instructor_user_id."
    identity: "opaque"
    exclusive_operations:
      - "POST /athletics/missed-class-requests/{request_id}/status with action IN {ACKNOWLEDGE, DISPUTE}"
    shared_operations:
      - "reads on courses, enrollments, competition events and missed-class requests"
      - "POST /athletics/_clock/set_current_utc"

  - name: AppealsCommittee
    description: "Faculty athletics appeals committee: reviews and decides eligibility appeals. A GRANT cascades a certification back to RESTORED; the committee never posts a certification status action itself. Cannot decide an appeal it submitted."
    identity: "opaque"
    exclusive_operations:
      - "POST /athletics/appeals/{appeal_id}/status with action IN {OPEN_REVIEW, GRANT, DENY}"
    shared_operations:
      - "reads on terms, degree programs, applicability rules, students, certifications, appeals and incidents"

  - name: ComplianceOfficer
    description: "Athletics compliance officer: closes terms for APR reporting, investigates impermissible-assistance incidents and disciplines tutors."
    identity: "opaque"
    exclusive_operations:
      - "POST /athletics/terms/{term_id}/apr-close"
      - "POST /athletics/compliance-incidents/{incident_id}/status"
    shared_operations:
      - "POST /athletics/tutors/{tutor_id}/status (shared with LearningSpecialist)"
      - "POST /athletics/compliance-incidents (shared with LearningSpecialist and AcademicAdvisor)"
      - "reads across the whole surface except the tutor list filtered by subject"

  - name: AthleticsOperations
    description: "Athletics operations / travel desk: schedules competition events and drives the travel lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /athletics/competition-events"
      - "POST /athletics/competition-events/{event_id}/status"
    shared_operations:
      - "reads on terms, courses, students, competition events and missed-class requests"

  - name: Tutor
    description: "An individual tutor acting on its own behalf. X-User-ID equals the id of a Tutor row, so a tutor may only log sessions against its own assignments."
    identity: "entity_backed:Tutor"
    exclusive_operations: []
    shared_operations:
      - "POST /athletics/support-sessions (shared with LearningSpecialist, restricted to the tutor's own assignments)"
      - "reads on its own tutor row, assignments, sessions and the enrollments behind them"

  - name: StudentAthlete
    description: "A student-athlete acting on its own behalf. X-User-ID equals the id of a StudentAthlete row, so a student may only read its own record, summary, certifications, appeals and sessions."
    identity: "entity_backed:StudentAthlete"
    exclusive_operations: []
    shared_operations:
      - "GET /athletics/student-athletes/{student_athlete_id} and GET /athletics/student-athletes/{student_athlete_id}/eligibility-summary, restricted to its own id"
      - "reads on its own certifications, appeals and support sessions"
