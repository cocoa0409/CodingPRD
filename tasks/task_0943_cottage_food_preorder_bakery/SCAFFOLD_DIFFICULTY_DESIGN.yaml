              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /bakery/ingredient-lots"
              payload: { baker_id: "${baker_id}", lot_code: "FLR-2026-11", received_at: "2026-04-20T00:00:00Z", expires_at: "2026-12-01T00:00:00Z", allergens: ["wheat", "milk"] }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { lot_flour: $.data.id }
            - call: "POST /bakery/ingredient-lots/${lot_flour}/release"
