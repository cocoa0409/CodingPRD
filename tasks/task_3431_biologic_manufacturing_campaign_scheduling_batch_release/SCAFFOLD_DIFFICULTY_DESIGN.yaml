# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_3431_biologic_manufacturing_campaign_scheduling_batch_release
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: batch_yield_provisional_then_final_diverge
        grounds:
          - calculations.batch_yield
          - entities.BatchLot.fields.quantity_units
          - entities.BatchLot.fields.provisional_yield_units
          - entities.BatchLot.fields.final_yield_units
        distinguishing_aspect: "On the BatchLot yield domain, the provisional variant (design capacity 2000 L x 2.0 g/L x 125 x 0.8 = 400000) and the final variant (mean VERIFIED DOWNSTREAM TITER 2.5 x 2000 x 125 = 625000) produce different quantity_units for the same batch; the variant switches exactly at PROCESS_COMPLETE."
        test_recipe:
          setup:
            - "Commercial campaign fully seeded and in production on a 2000 L train; batch created (provisional yield 400000); one VERIFIED UPSTREAM test; two VERIFIED DOWNSTREAM TITER tests (2.4 and 2.6)."
          setup_api_calls:
            - &d_clock0
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - &d_site
              call: "POST /sites"
              payload: { name: "Providence Biologics", region: "US-RI", monthly_capacity_hours: 5000, cold_storage_capacity_units: 10000000, licensed_authorities: ["FDA", "EMA"] }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - &d_product
              call: "POST /products"
              payload: { product_code: "MAB-001", molecule_type: "MONOCLONAL_ANTIBODY", market_scope: "BOTH", requires_cold_chain: true, min_storage_temp_c: 2.0, max_storage_temp_c: 8.0, shelf_life_hours: 2160, changeover_hours: 14, same_product_turnaround_hours: 6, required_materials: [] }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - &d_train
              call: "POST /sites/${site_id}/trains"
              payload: { train_code: "TR-1", capacity_liters: 2000, supported_molecule_types: ["MONOCLONAL_ANTIBODY"] }
              as: PlatformAdmin
              captures: { train_id: $.data.id }
            - &d_campaign
              call: "POST /trains/${train_id}/campaigns"
              payload: { product_id: "${prod_id}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-01T00:00:00Z", planned_end_utc: "2026-10-20T00:00:00Z", upstream_hours: 20, downstream_hours: 30 }
              as: ProcessEngineer
              captures: { camp_id: $.data.id }
            - &d_alloc
              call: "POST /campaigns/${camp_id}/advance"
              payload: { to_status: "ALLOCATED" }
              as: ProcessEngineer
            - &d_seed1
              call: "POST /campaigns/${camp_id}/seed-stages"
              payload: { stage_index: 1, planned_duration_hours: 10 }
              as: ProcessEngineer
              captures: { ss1: $.data.id }
            - &d_seed1_run
              call: "POST /seed-stages/${ss1}/advance"
              payload: { to_status: "RUNNING" }
              as: ProcessEngineer
            - &d_clock10
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T10:00:00Z" }
              as: PlatformAdmin
            - &d_seed1_done
              call: "POST /seed-stages/${ss1}/advance"
              payload: { to_status: "COMPLETED" }
              as: ProcessEngineer
            - &d_seed2
              call: "POST /campaigns/${camp_id}/seed-stages"
              payload: { stage_index: 2, planned_duration_hours: 8 }
              as: ProcessEngineer
              captures: { ss2: $.data.id }
            - &d_seed2_run
              call: "POST /seed-stages/${ss2}/advance"
              payload: { to_status: "RUNNING" }
              as: ProcessEngineer
            - &d_clock18
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T18:00:00Z" }
              as: PlatformAdmin
            - &d_seed2_done
              call: "POST /seed-stages/${ss2}/advance"
              payload: { to_status: "COMPLETED" }
              as: ProcessEngineer
            - &d_prod
              call: "POST /campaigns/${camp_id}/advance"
              payload: { to_status: "PRODUCTION_IN_PROGRESS" }
              as: ProcessEngineer
            - &d_batch
              call: "POST /campaigns/${camp_id}/batches"
              payload: { lot_number: "LOT-0001" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { batch_id: $.data.id, bat_v: $.data.version }
            - &d_test_up
              call: "POST /batches/${batch_id}/tests"
              payload: { test_type: "CELL_VIABILITY", phase: "UPSTREAM", measured_value: 85.0, unit: "PCT", spec_min: 80.0, spec_max: 100.0, expected_batch_version: "${bat_v}" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { t_up: $.data.id }
            - &d_verify_up
              call: "POST /tests/${t_up}/verify"
              payload: {}
              as: QualityControlAnalyst
              as_user_id: "qc-1"
            - &d_adv_down
              call: "POST /batches/${batch_id}/advance"
              payload: { to_status: "DOWNSTREAM" }
              as: ManufacturingOperator
              as_user_id: "op-1"
            - &d_getb2
              call: "GET /batches/${batch_id}"
              payload: {}
              as: Any
              captures: { bat_v2: $.data.version, q_down: $.data.quantity_units }
            - &d_test_t1
              call: "POST /batches/${batch_id}/tests"
              payload: { test_type: "TITER", phase: "DOWNSTREAM", measured_value: 2.4, unit: "G/L", spec_min: 2.0, spec_max: 4.0, expected_batch_version: "${bat_v2}" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { t_t1: $.data.id }
            - &d_verify_t1
              call: "POST /tests/${t_t1}/verify"
              payload: {}
              as: QualityControlAnalyst
              as_user_id: "qc-1"
            - &d_getb3
              call: "GET /batches/${batch_id}"
              payload: {}
              as: Any
              captures: { bat_v3: $.data.version }
            - &d_test_t2
              call: "POST /batches/${batch_id}/tests"
              payload: { test_type: "TITER", phase: "DOWNSTREAM", measured_value: 2.6, unit: "G/L", spec_min: 2.0, spec_max: 4.0, expected_batch_version: "${bat_v3}" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { t_t2: $.data.id }
            - &d_verify_t2
              call: "POST /tests/${t_t2}/verify"
              payload: {}
              as: QualityControlAnalyst
              as_user_id: "qc-1"
          trigger:
            - &d_adv_pc
              call: "POST /batches/${batch_id}/advance"
              payload: { to_status: "PROCESS_COMPLETE" }
              as: ManufacturingOperator
              as_user_id: "op-1"
          assert:
            - "while DOWNSTREAM the batch carried the provisional figure: ${q_down} == 400000"
            - "BatchLot.${batch_id}.provisional_yield_units == 400000"
            - "BatchLot.${batch_id}.final_yield_units == 625000"
            - "BatchLot.${batch_id}.quantity_units == 625000 (final variant replaces the provisional 400000 at PROCESS_COMPLETE)"
            - "BatchLot.${batch_id}.process_status == PROCESS_COMPLETE and quality_status == READY_FOR_REVIEW"
            - "GET /campaigns/${camp_id} shows status == COMPLETED (system cascade)"

      - name: excursion_screening_vs_mkt_verdicts_diverge
        grounds:
          - calculations.excursion_evaluation
          - state_machines.Shipment.EXCURSION_HOLD_to_IN_TRANSIT
          - state_machines.Shipment.EXCURSION_HOLD_to_QUARANTINED
        distinguishing_aspect: "On the Shipment thermal-exposure domain (a different entity domain than BatchLot yield), the identical reading series [9, 9, 9, 5, 5] degrees C is UNACCEPTABLE under the CLINICAL screening variant (3 readings above 8.0 exceeds the count of 2) but ACCEPTABLE under the COMMERCIAL MKT variant (MKT 7.621 <= 8.0 + 1.0, spike 9.0 <= 13.0, freeze 5.0 >= 1.5)."
        test_recipe:
          setup:
            - "One RELEASED COMMERCIAL batch and one RELEASED CLINICAL batch of the same product (market_scope BOTH); each has an IN_TRANSIT shipment that has logged readings 9.0, 9.0, 9.0, 5.0, 5.0 and is therefore in EXCURSION_HOLD (count above max of 8.0 exceeds 2)."
          setup_api_calls:
            - *d_clock0
            - *d_site
            - *d_product
            - *d_train
            - *d_campaign
            - *d_alloc
            - *d_seed1
            - *d_seed1_run
            - *d_clock10
            - *d_seed1_done
            - *d_seed2
            - *d_seed2_run
            - *d_clock18
            - *d_seed2_done
            - *d_prod
            - *d_batch
            - *d_test_up
            - *d_verify_up
            - *d_adv_down
            - *d_getb2
            - *d_test_t1
            - *d_verify_t1
            - *d_getb3
            - *d_test_t2
            - *d_verify_t2
            - *d_adv_pc
            - &d_submit
              call: "POST /batches/${batch_id}/submit-for-review"
              payload: {}
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
            - &d_release
              call: "POST /batches/${batch_id}/disposition"
              payload: { decision: "RELEASED", rationale: "All specifications met" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
            - &d_clock21
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-21T00:00:00Z" }
              as: PlatformAdmin
            - &d_campaign_cl
              call: "POST /trains/${train_id}/campaigns"
              payload: { product_id: "${prod_id}", demand_type: "CLINICAL", planned_start_utc: "2026-10-21T00:00:00Z", planned_end_utc: "2026-11-05T00:00:00Z", upstream_hours: 20, downstream_hours: 30 }
              as: ProcessEngineer
              captures: { camp_cl: $.data.id }
            - &d_alloc_cl
              call: "POST /campaigns/${camp_cl}/advance"
              payload: { to_status: "ALLOCATED" }
              as: ProcessEngineer
            - &d_seed1_cl
              call: "POST /campaigns/${camp_cl}/seed-stages"
              payload: { stage_index: 1, planned_duration_hours: 10 }
              as: ProcessEngineer
              captures: { ss1c: $.data.id }
            - &d_seed1_run_cl
              call: "POST /seed-stages/${ss1c}/advance"
              payload: { to_status: "RUNNING" }
              as: ProcessEngineer
            - &d_clock21b
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-21T10:00:00Z" }
              as: PlatformAdmin
            - &d_seed1_done_cl
              call: "POST /seed-stages/${ss1c}/advance"
              payload: { to_status: "COMPLETED" }
              as: ProcessEngineer
            - &d_seed2_cl
              call: "POST /campaigns/${camp_cl}/seed-stages"
              payload: { stage_index: 2, planned_duration_hours: 8 }
              as: ProcessEngineer
              captures: { ss2c: $.data.id }
            - &d_seed2_run_cl
              call: "POST /seed-stages/${ss2c}/advance"
              payload: { to_status: "RUNNING" }
              as: ProcessEngineer
            - &d_clock21c
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-21T18:00:00Z" }
              as: PlatformAdmin
            - &d_seed2_done_cl
              call: "POST /seed-stages/${ss2c}/advance"
              payload: { to_status: "COMPLETED" }
              as: ProcessEngineer
            - &d_prod_cl
              call: "POST /campaigns/${camp_cl}/advance"
              payload: { to_status: "PRODUCTION_IN_PROGRESS" }
              as: ProcessEngineer
            - &d_batch_cl
              call: "POST /campaigns/${camp_cl}/batches"
              payload: { lot_number: "LOT-CL1" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { batch_cl: $.data.id, bat_vcl: $.data.version }
            - &d_test_up_cl
              call: "POST /batches/${batch_cl}/tests"
              payload: { test_type: "CELL_VIABILITY", phase: "UPSTREAM", measured_value: 90.0, unit: "PCT", spec_min: 80.0, spec_max: 100.0, expected_batch_version: "${bat_vcl}" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { t_upc: $.data.id }
            - &d_verify_up_cl
              call: "POST /tests/${t_upc}/verify"
              payload: {}
              as: QualityControlAnalyst
              as_user_id: "qc-1"
            - &d_adv_down_cl
              call: "POST /batches/${batch_cl}/advance"
              payload: { to_status: "DOWNSTREAM" }
              as: ManufacturingOperator
              as_user_id: "op-1"
            - &d_getb2_cl
              call: "GET /batches/${batch_cl}"
              payload: {}
              as: Any
              captures: { bat_v2c: $.data.version }
            - &d_test_t1_cl
              call: "POST /batches/${batch_cl}/tests"
              payload: { test_type: "TITER", phase: "DOWNSTREAM", measured_value: 2.5, unit: "G/L", spec_min: 2.0, spec_max: 4.0, expected_batch_version: "${bat_v2c}" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { t_t1c: $.data.id }
            - &d_verify_t1_cl
              call: "POST /tests/${t_t1c}/verify"
              payload: {}
              as: QualityControlAnalyst
              as_user_id: "qc-1"
            - &d_adv_pc_cl
              call: "POST /batches/${batch_cl}/advance"
              payload: { to_status: "PROCESS_COMPLETE" }
              as: ManufacturingOperator
              as_user_id: "op-1"
            - &d_submit_cl
              call: "POST /batches/${batch_cl}/submit-for-review"
              payload: {}
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
            - &d_release_cl
              call: "POST /batches/${batch_cl}/disposition"
              payload: { decision: "RELEASED", rationale: "Clinical batch within specification" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
            - &d_ship_co
              call: "POST /batches/${batch_id}/shipments"
              payload: { destination_region: "IE-DUB", market_type: "COMMERCIAL", quantity_units: 1000 }
              as: SupplyPlanner
              as_user_id: "sp-1"
              captures: { ship_co: $.data.id }
            - &d_ship_cl
              call: "POST /batches/${batch_cl}/shipments"
              payload: { destination_region: "US-BOS", market_type: "CLINICAL", quantity_units: 500 }
              as: SupplyPlanner
              as_user_id: "sp-1"
              captures: { ship_cl: $.data.id }
            - &d_ship_co_go
              call: "POST /shipments/${ship_co}/action"
              payload: { action: "SHIP" }
              as: SupplyPlanner
              as_user_id: "sp-1"
            - &d_ship_cl_go
              call: "POST /shipments/${ship_cl}/action"
              payload: { action: "SHIP" }
              as: SupplyPlanner
              as_user_id: "sp-1"
            - call: "POST /shipments/${ship_co}/readings"
              payload: { recorded_at: "2026-10-22T01:00:00Z", temperature_c: 9.0 }
              as: SupplyPlanner
              as_user_id: "sp-1"
            - call: "POST /shipments/${ship_co}/readings"
              payload: { recorded_at: "2026-10-22T02:00:00Z", temperature_c: 9.0 }
              as: SupplyPlanner
              as_user_id: "sp-1"
            - call: "POST /shipments/${ship_co}/readings"
              payload: { recorded_at: "2026-10-22T03:00:00Z", temperature_c: 9.0 }
              as: SupplyPlanner
              as_user_id: "sp-1"
            - call: "POST /shipments/${ship_co}/readings"
              payload: { recorded_at: "2026-10-22T04:00:00Z", temperature_c: 5.0 }
              as: SupplyPlanner
              as_user_id: "sp-1"
            - call: "POST /shipments/${ship_co}/readings"
              payload: { recorded_at: "2026-10-22T05:00:00Z", temperature_c: 5.0 }
              as: SupplyPlanner
              as_user_id: "sp-1"
            - call: "POST /shipments/${ship_cl}/readings"
              payload: { recorded_at: "2026-10-22T01:00:00Z", temperature_c: 9.0 }
              as: SupplyPlanner
              as_user_id: "sp-1"
            - call: "POST /shipments/${ship_cl}/readings"
              payload: { recorded_at: "2026-10-22T02:00:00Z", temperature_c: 9.0 }
              as: SupplyPlanner
              as_user_id: "sp-1"
            - call: "POST /shipments/${ship_cl}/readings"
              payload: { recorded_at: "2026-10-22T03:00:00Z", temperature_c: 9.0 }
              as: SupplyPlanner
              as_user_id: "sp-1"
            - call: "POST /shipments/${ship_cl}/readings"
              payload: { recorded_at: "2026-10-22T04:00:00Z", temperature_c: 5.0 }
              as: SupplyPlanner
              as_user_id: "sp-1"
            - call: "POST /shipments/${ship_cl}/readings"
              payload: { recorded_at: "2026-10-22T05:00:00Z", temperature_c: 5.0 }
              as: SupplyPlanner
              as_user_id: "sp-1"
          trigger:
            - call: "POST /shipments/${ship_cl}/evaluate-excursion"
              payload: {}
              as: QualityAssuranceReviewer
              as_user_id: "qa-2"
            - call: "POST /shipments/${ship_co}/evaluate-excursion"
              payload: {}
              as: QualityAssuranceReviewer
              as_user_id: "qa-2"
          assert:
            - "both shipments were in EXCURSION_HOLD with excursion_evaluation == PENDING before evaluation"
            - "Shipment.${ship_cl}.excursion_evaluation == UNACCEPTABLE and evaluation_variant == SCREENING and status == QUARANTINED"
            - "Shipment.${ship_co}.excursion_evaluation == ACCEPTABLE and evaluation_variant == MKT and status == IN_TRANSIT"
            - "the MKT variant computed 7.621 degrees C (3 decimals, round_half_up) against the 9.0 limit while screening counted 3 readings above 8.0 against the limit of 2"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: allocated_hours_per_component_rounding_order
        grounds:
          - calculations.allocated_hours
          - entities.Campaign.fields.allocated_hours
        distinguishing_aspect: "Mode (b) nested rounding: the conformant value rounds each component up to its own block first (ceil(20/8)*8 + ceil(30/24)*24 + ceil(14/4)*4 = 24 + 48 + 16 = 88); rounding the raw sum once would give ceil(64/4)*4 = 64, which is NON-CONFORMANT."
        test_recipe:
          setup:
            - "Site with one train supporting MONOCLONAL_ANTIBODY and FUSION_PROTEIN; product P1 (MAB-001, changeover 14) has campaign A on the train 2026-10-01T00:00 to 2026-10-10T00:00; product P2 (FSN-002, FUSION_PROTEIN, changeover 10) exists."
          setup_api_calls:
            - *d_clock0
            - *d_site
            - *d_product
            - &d_p2
              call: "POST /products"
              payload: { product_code: "FSN-002", molecule_type: "FUSION_PROTEIN", market_scope: "BOTH", requires_cold_chain: true, min_storage_temp_c: 2.0, max_storage_temp_c: 8.0, shelf_life_hours: 1440, changeover_hours: 10, same_product_turnaround_hours: 4, required_materials: [] }
              as: PlatformAdmin
              captures: { prod2_id: $.data.id }
            - &d_train_dual
              call: "POST /sites/${site_id}/trains"
              payload: { train_code: "TR-9", capacity_liters: 1500, supported_molecule_types: ["MONOCLONAL_ANTIBODY", "FUSION_PROTEIN"] }
              as: PlatformAdmin
              captures: { train2_id: $.data.id }
            - &d_campaign_a
              call: "POST /trains/${train2_id}/campaigns"
              payload: { product_id: "${prod_id}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-01T00:00:00Z", planned_end_utc: "2026-10-10T00:00:00Z", upstream_hours: 20, downstream_hours: 30 }
              as: ProcessEngineer
              captures: { camp_a: $.data.id, camp_a_hours: $.data.allocated_hours }
          trigger:
            - call: "POST /trains/${train2_id}/campaigns"
              payload: { product_id: "${prod2_id}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-10T14:00:00Z", planned_end_utc: "2026-10-25T00:00:00Z", upstream_hours: 20, downstream_hours: 30 }
              as: ProcessEngineer
              captures: { camp_b: $.data.id, camp_b_hours: $.data.allocated_hours }
          assert:
            - "Campaign.${camp_a}.allocated_hours == 72 (24 + 48 + 0; no predecessor, so no changeover component)"
            - "Campaign.${camp_b}.allocated_hours == 88 (24 + 48 + 16; changeover component is ceil(max(14, 10)/4)*4 == 16, rounded before summation)"
            - "the response value ${camp_b_hours} equals 88 and not 64"

      - name: mkt_three_guard_boundary_at_allowance
        grounds:
          - calculations.excursion_evaluation
          - entities.Shipment.fields.excursion_evaluation
        distinguishing_aspect: "Mode (a) non-linear multi-input formula: three identical 9.0 degree C readings make MKT exactly 9.000, which equals max_storage_temp_c 8.0 + MKT_ALLOWANCE_C 1.0; the <= comparison means the verdict is ACCEPTABLE at the exact boundary (while the shipment still entered EXCURSION_HOLD because 3 readings above 8.0 exceeds the detection count of 2)."
        test_recipe:
          setup:
            - "RELEASED COMMERCIAL batch; IN_TRANSIT COMMERCIAL shipment that has logged exactly three readings, all 9.0 degrees C, and is in EXCURSION_HOLD."
          setup_api_calls:
            - *d_clock0
            - *d_site
            - *d_product
            - *d_train
            - *d_campaign
            - *d_alloc
            - *d_seed1
            - *d_seed1_run
            - *d_clock10
            - *d_seed1_done
            - *d_seed2
            - *d_seed2_run
            - *d_clock18
            - *d_seed2_done
            - *d_prod
            - *d_batch
            - *d_test_up
            - *d_verify_up
            - *d_adv_down
            - *d_getb2
            - *d_test_t1
            - *d_verify_t1
            - *d_getb3
            - *d_test_t2
            - *d_verify_t2
            - *d_adv_pc
            - *d_submit
            - *d_release
            - *d_ship_co
            - *d_ship_co_go
            - call: "POST /shipments/${ship_co}/readings"
              payload: { recorded_at: "2026-10-02T01:00:00Z", temperature_c: 9.0 }
              as: SupplyPlanner
              as_user_id: "sp-1"
            - call: "POST /shipments/${ship_co}/readings"
              payload: { recorded_at: "2026-10-02T02:00:00Z", temperature_c: 9.0 }
              as: SupplyPlanner
              as_user_id: "sp-1"
            - call: "POST /shipments/${ship_co}/readings"
              payload: { recorded_at: "2026-10-02T03:00:00Z", temperature_c: 9.0 }
              as: SupplyPlanner
              as_user_id: "sp-1"
          trigger:
            - call: "POST /shipments/${ship_co}/evaluate-excursion"
              payload: {}
              as: QualityAssuranceReviewer
              as_user_id: "qa-2"
          assert:
            - "before evaluation the shipment was EXCURSION_HOLD with excursion_evaluation == PENDING"
            - "Shipment.${ship_co}.excursion_evaluation == ACCEPTABLE (MKT exactly 9.000 <= 8.0 + 1.0)"
            - "Shipment.${ship_co}.evaluation_variant == MKT"
            - "Shipment.${ship_co}.status == IN_TRANSIT"

      - name: comparability_single_pass_outlier_exclusion
        grounds:
          - calculations.comparability_equivalence
          - entities.ComparabilityStudy.fields.baseline_mean
          - entities.ComparabilityStudy.fields.equivalence_margin
        distinguishing_aspect: "Mode (c) circular-looking dependency with pinned evaluation order: the exclusion bound uses mu0 95.42 and sd0 (population) of the FULL baseline including the 85.0 outlier, excluding once at 1.5 sd0 (bound 87.6025), then mu1 is recomputed exactly once to 98.025 and frozen; margin is max(1.5, 0.03 * 98.025) == 2.9408, not the 2.8626 that using mu0 would give."
        test_recipe:
          setup:
            - "Candidate batch of MAB-001 at PROCESS_COMPLETE with a VERIFIED DOWNSTREAM PURITY test of 99.5 (plus the standard TITER pair); study created with baseline values [98.0, 98.2, 97.8, 98.1, 85.0] and protocol approved."
          setup_api_calls:
            - *d_clock0
            - *d_site
            - *d_product
            - *d_train
            - *d_campaign
            - *d_alloc
            - *d_seed1
            - *d_seed1_run
            - *d_clock10
            - *d_seed1_done
            - *d_seed2
            - *d_seed2_run
            - *d_clock18
            - *d_seed2_done
            - *d_prod
            - *d_batch
            - *d_test_up
            - *d_verify_up
            - *d_adv_down
            - *d_getb2
            - *d_test_t1
            - *d_verify_t1
            - *d_getb3
            - *d_test_t2
            - *d_verify_t2
            - call: "GET /batches/${batch_id}"
              payload: {}
              as: Any
              captures: { bat_v4: $.data.version }
            - &d_test_pur
              call: "POST /batches/${batch_id}/tests"
              payload: { test_type: "PURITY", phase: "DOWNSTREAM", measured_value: 99.5, unit: "PCT", spec_min: 95.0, spec_max: 100.0, expected_batch_version: "${bat_v4}" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { t_pur: $.data.id }
            - &d_verify_pur
              call: "POST /tests/${t_pur}/verify"
              payload: {}
              as: QualityControlAnalyst
              as_user_id: "qc-1"
            - *d_adv_pc
            - &d_study
              call: "POST /products/${prod_id}/comparability-studies"
              payload: { change_type: "PROCESS_CHANGE", baseline_attribute_values: [98.0, 98.2, 97.8, 98.1, 85.0], candidate_batch_ids: ["${batch_id}"] }
              as: RegulatoryAffairsSpecialist
              captures: { study_id: $.data.id }
            - &d_study_appr
              call: "POST /comparability-studies/${study_id}/action"
              payload: { action: "APPROVE_PROTOCOL" }
              as: RegulatoryAffairsSpecialist
          trigger:
            - &d_study_assess
              call: "POST /comparability-studies/${study_id}/action"
              payload: { action: "RECORD_ASSESSMENT" }
              as: RegulatoryAffairsSpecialist
          assert:
            - "ComparabilityStudy.${study_id}.status == COMPARABLE"
            - "ComparabilityStudy.${study_id}.baseline_mean == 98.025"
            - "ComparabilityStudy.${study_id}.equivalence_margin == 2.9408"
            - "the candidate value 99.5 lies inside [95.0842, 100.9658]; the 85.0 baseline value was excluded by the single pass (87.6025 lower bound) and never re-included"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: campaign_allocate_deallocate_reallocate_cycle
        grounds:
          - state_machines.Campaign.PROPOSED_to_ALLOCATED
          - state_machines.Campaign.ALLOCATED_to_PROPOSED
        distinguishing_aspect: "The Campaign machine is cyclic (PROPOSED -> ALLOCATED -> PROPOSED -> ALLOCATED), not a linear pipeline; each pass re-runs the capacity waterfall and increments version by exactly 1 per hop."
        test_recipe:
          setup:
            - "Site with monthly_capacity_hours 5000; one campaign (72 allocated hours) in PROPOSED."
          setup_api_calls:
            - *d_clock0
            - *d_site
            - *d_product
            - *d_train
            - *d_campaign
          trigger:
            - call: "POST /campaigns/${camp_id}/advance"
              payload: { to_status: "ALLOCATED" }
              as: ProcessEngineer
              captures: { v_alloc: $.data.version }
            - call: "POST /campaigns/${camp_id}/advance"
              payload: { to_status: "PROPOSED" }
              as: ProcessEngineer
              captures: { v_dealloc: $.data.version }
            - call: "POST /campaigns/${camp_id}/advance"
              payload: { to_status: "ALLOCATED" }
              as: ProcessEngineer
              captures: { v_realloc: $.data.version }
          assert:
            - "first allocate: status ALLOCATED, ${v_alloc} == 2"
            - "deallocate: status PROPOSED, ${v_dealloc} == 3"
            - "re-allocate: status ALLOCATED, ${v_realloc} == 4"
            - "Campaign.${camp_id}.allocated_hours == 72 throughout (de-allocation does not rewrite the stored charge)"

      - name: batch_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.BatchLot
          - entities.BatchLot.fields.process_status
          - entities.BatchLot.fields.quality_status
        distinguishing_aspect: "BatchLot carries two parallel state dimensions on one row: process_status can move UPSTREAM -> DOWNSTREAM while quality_status stays IN_TESTING, and once process_status reaches PROCESS_COMPLETE it freezes while quality_status continues READY_FOR_REVIEW -> PENDING_DISPOSITION -> RELEASED."
        test_recipe:
          setup:
            - "Standard commercial batch chain executed through verification of both DOWNSTREAM TITER tests."
          setup_api_calls:
            - *d_clock0
            - *d_site
            - *d_product
            - *d_train
            - *d_campaign
            - *d_alloc
            - *d_seed1
            - *d_seed1_run
            - *d_clock10
            - *d_seed1_done
            - *d_seed2
            - *d_seed2_run
            - *d_clock18
            - *d_seed2_done
            - *d_prod
            - *d_batch
            - *d_test_up
            - *d_verify_up
            - *d_adv_down
            - &d_getb2par
              call: "GET /batches/${batch_id}"
              payload: {}
              as: Any
              captures: { bat_v2: $.data.version, par_proc: $.data.process_status, par_qual: $.data.quality_status }
            - *d_test_t1
            - *d_verify_t1
            - *d_getb3
            - *d_test_t2
            - *d_verify_t2
          trigger:
            - *d_adv_pc
            - *d_submit
            - *d_release
          assert:
            - "after the DOWNSTREAM advance: ${par_proc} == DOWNSTREAM while ${par_qual} == IN_TESTING (dimensions move independently)"
            - "after PROCESS_COMPLETE: process_status == PROCESS_COMPLETE and quality_status == READY_FOR_REVIEW"
            - "after submit-for-review: quality_status == PENDING_DISPOSITION while process_status stays PROCESS_COMPLETE"
            - "after disposition: quality_status == RELEASED while process_status stays PROCESS_COMPLETE"

      - name: deviation_close_reopen_close_cycle
        grounds:
          - state_machines.Deviation.OPEN_to_CLOSED
          - state_machines.Deviation.CLOSED_to_REOPENED
          - state_machines.Deviation.REOPENED_to_CLOSED
        distinguishing_aspect: "The Deviation machine is cyclic with a full loop CLOSED -> REOPENED -> CLOSED; REOPEN nulls conclusion and closed_by_user_id, and a MINOR deviation drives no posture change at any point in the loop."
        test_recipe:
          setup:
            - "Batch in DOWNSTREAM processing; one MINOR PROCESS deviation opened on it."
          setup_api_calls:
            - *d_clock0
            - *d_site
            - *d_product
            - *d_train
            - *d_campaign
            - *d_alloc
            - *d_seed1
            - *d_seed1_run
            - *d_clock10
            - *d_seed1_done
            - *d_seed2
            - *d_seed2_run
            - *d_clock18
            - *d_seed2_done
            - *d_prod
            - *d_batch
            - *d_test_up
            - *d_verify_up
            - *d_adv_down
            - &d_dev_minor
              call: "POST /batches/${batch_id}/deviations"
              payload: { kind: "PROCESS", severity: "MINOR", description: "Brief foam-over observed in bioreactor" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { dev_m: $.data.id }
          trigger:
            - call: "POST /deviations/${dev_m}/action"
              payload: { action: "CLOSE", conclusion: "NO_ACTION_REQUIRED" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
            - call: "POST /deviations/${dev_m}/action"
              payload: { action: "REOPEN", justification: "New operator statement contradicts the first report" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
              captures: { dev_reopened: $.data.status, dev_conclusion_after_reopen: $.data.conclusion }
            - call: "POST /deviations/${dev_m}/action"
              payload: { action: "CLOSE", conclusion: "CAPA_COMPLETED", capa_summary: "optional here since MINOR" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
          assert:
            - "after first CLOSE: Deviation.${dev_m}.status == CLOSED"
            - "after REOPEN: ${dev_reopened} == REOPENED and ${dev_conclusion_after_reopen} is null (conclusion cleared by the loop)"
            - "after second CLOSE: status == CLOSED again"
            - "GET /sites/${site_id} shows release_posture == CLEAR and open_critical_deviation_count == 0 throughout (MINOR never moves posture)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: oos_verify_cascades_to_posture_freeze_and_campaign_preemption
        grounds:
          - state_machines.InProcessTest.RECORDED_to_OOS_SUSPECT
          - calculations.site_release_posture
          - state_machines.Campaign.PROPOSED_to_PREEMPTED
        distinguishing_aspect: "Depth-3 cascade triggered by test verification: verify out-of-spec DOWNSTREAM test -> test OOS_SUSPECT plus system Deviation (kind OOS, CRITICAL) -> site open_critical_deviation_count reaches the freeze threshold 2 and release_posture flips to FROZEN -> the unrelated PROPOSED COMMERCIAL campaign on train TR-2 is preempted. Each hop is caused by the previous link, not by the verify call directly."
        test_recipe:
          setup:
            - "Site with trains TR-1 and TR-2. A PROPOSED COMMERCIAL victim campaign on TR-2. The main campaign on TR-1 has a batch in DOWNSTREAM with its UPSTREAM test verified and ONE manually opened CRITICAL PROCESS deviation (so the count stands at 1 and posture is CONDITIONAL)."
          setup_api_calls:
            - *d_clock0
            - *d_site
            - *d_product
            - *d_train
            - &d_train_v
              call: "POST /sites/${site_id}/trains"
              payload: { train_code: "TR-2", capacity_liters: 2000, supported_molecule_types: ["MONOCLONAL_ANTIBODY"] }
              as: PlatformAdmin
              captures: { train_v: $.data.id }
            - &d_campaign_v
              call: "POST /trains/${train_v}/campaigns"
              payload: { product_id: "${prod_id}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-01T00:00:00Z", planned_end_utc: "2026-10-20T00:00:00Z", upstream_hours: 20, downstream_hours: 30 }
              as: ProcessEngineer
              captures: { camp_v: $.data.id }
            - *d_campaign
            - *d_alloc
            - *d_seed1
            - *d_seed1_run
            - *d_clock10
            - *d_seed1_done
            - *d_seed2
            - *d_seed2_run
            - *d_clock18
            - *d_seed2_done
            - *d_prod
            - *d_batch
            - *d_test_up
            - *d_verify_up
            - *d_adv_down
            - *d_getb2
            - call: "POST /batches/${batch_id}/deviations"
              payload: { kind: "PROCESS", severity: "CRITICAL", description: "Agitation spike outside validated range" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { dev1: $.data.id }
          trigger:
            - call: "POST /batches/${batch_id}/tests"
              payload: { test_type: "ENDOTOXIN", phase: "DOWNSTREAM", measured_value: 10.0, unit: "EU/ML", spec_min: 0.0, spec_max: 5.0, expected_batch_version: "${bat_v2}" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { t_oos: $.data.id }
            - call: "POST /tests/${t_oos}/verify"
              payload: {}
              as: QualityControlAnalyst
              as_user_id: "qc-1"
          assert:
            - "InProcessTest.${t_oos}.status == OOS_SUSPECT (hop 1: verify out-of-spec flips the test)"
            - "GET /batches/${batch_id}/deviations returns 2 deviations: the manual PROCESS one and a system-created kind == OOS, severity == CRITICAL deviation whose linked_test_id == ${t_oos} (hop 2: deviation auto-created)"
            - "GET /sites/${site_id} shows open_critical_deviation_count == 2 and release_posture == FROZEN (hop 3 begins: posture recalculated by the deviation open)"
            - "GET /campaigns/${camp_v} shows status == PREEMPTED (hop 3 completes: FROZEN posture preempted the unrelated PROPOSED COMMERCIAL campaign)"
            - "BatchLot.${batch_id}.quality_status remains IN_TESTING (holds only apply from READY_FOR_REVIEW or PENDING_DISPOSITION)"

      - name: complaint_confirm_cascades_batch_and_shipment_quarantine
        grounds:
          - state_machines.Deviation.OPEN_to_CLOSED
          - state_machines.BatchLot
          - state_machines.Shipment.PLANNED_to_QUARANTINED
          - state_machines.Shipment.IN_TRANSIT_to_QUARANTINED
        distinguishing_aspect: "Depth-2 cascade from a different trigger (deviation CLOSE, not test verify): confirming a CRITICAL COMPLAINT on a RELEASED batch quarantines the batch, which itself quarantines its PLANNED and IN_TRANSIT shipments; sellable units are restored (available_to_ship_units returns from 475000 to the full 625000 because QUARANTINED shipments no longer count)."
        test_recipe:
          setup:
            - "RELEASED COMMERCIAL batch (final yield 625000) with shipment s1 PLANNED 100000 units and shipment s2 IN_TRANSIT 50000 units."
          setup_api_calls:
            - *d_clock0
            - *d_site
            - *d_product
            - *d_train
            - *d_campaign
            - *d_alloc
            - *d_seed1
            - *d_seed1_run
            - *d_clock10
            - *d_seed1_done
            - *d_seed2
            - *d_seed2_run
            - *d_clock18
            - *d_seed2_done
            - *d_prod
            - *d_batch
            - *d_test_up
            - *d_verify_up
            - *d_adv_down
            - *d_getb2
            - *d_test_t1
            - *d_verify_t1
            - *d_getb3
            - *d_test_t2
            - *d_verify_t2
            - *d_adv_pc
            - *d_submit
            - *d_release
            - call: "POST /batches/${batch_id}/shipments"
              payload: { destination_region: "US-CHI", market_type: "COMMERCIAL", quantity_units: 100000 }
              as: SupplyPlanner
              as_user_id: "sp-1"
              captures: { s1: $.data.id }
            - call: "POST /batches/${batch_id}/shipments"
              payload: { destination_region: "IE-DUB", market_type: "COMMERCIAL", quantity_units: 50000 }
              as: SupplyPlanner
              as_user_id: "sp-1"
              captures: { s2: $.data.id }
            - call: "POST /shipments/${s2}/action"
              payload: { action: "SHIP" }
              as: SupplyPlanner
              as_user_id: "sp-1"
            - call: "GET /batches/${batch_id}"
              payload: {}
              as: Any
              captures: { avail_mid: $.data.available_to_ship_units }
          trigger:
            - call: "POST /batches/${batch_id}/deviations"
              payload: { kind: "COMPLAINT", severity: "CRITICAL", description: "Pharmacy reports discolored vials from this lot" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
              captures: { dev_c: $.data.id }
            - call: "POST /deviations/${dev_c}/action"
              payload: { action: "CLOSE", conclusion: "CONFIRMED", capa_summary: "Recall initiated; supplier CAPA opened" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
          assert:
            - "before the complaint: ${avail_mid} == 475000"
            - "BatchLot.${batch_id}.quality_status == QUARANTINED (hop 1: confirmed critical complaint)"
            - "Shipment.${s1}.status == QUARANTINED (was PLANNED) and Shipment.${s2}.status == QUARANTINED (was IN_TRANSIT) (hop 2: batch quarantine cascades)"
            - "BatchLot.${batch_id}.available_to_ship_units == 625000 (QUARANTINED shipments no longer consume sellable units)"
            - "GET /sites/${site_id} shows release_posture == CLEAR after the close (the complaint deviation no longer counts as open)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: disposition_state_error_precedes_posture_freeze
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors.ERR_INVALID_BATCH_STATE
          - errors.ERR_SITE_RELEASE_FROZEN
        distinguishing_aspect: "Category pair state vs business_safety: the batch is not PENDING_DISPOSITION (state, priority 4) AND the site is FROZEN for a COMMERCIAL release (business_safety, priority 7); the single returned error must be ERR_INVALID_BATCH_STATE, never ERR_SITE_RELEASE_FROZEN."
        test_recipe:
          setup:
            - "Batch in DOWNSTREAM processing (quality_status IN_TESTING, not PENDING_DISPOSITION); two OPEN CRITICAL PROCESS deviations on the batch have pushed the site to FROZEN."
          setup_api_calls:
            - *d_clock0
            - *d_site
            - *d_product
            - *d_train
            - *d_campaign
            - *d_alloc
            - *d_seed1
            - *d_seed1_run
            - *d_clock10
            - *d_seed1_done
            - *d_seed2
            - *d_seed2_run
            - *d_clock18
            - *d_seed2_done
            - *d_prod
            - *d_batch
            - *d_test_up
            - *d_verify_up
            - *d_adv_down
            - call: "POST /batches/${batch_id}/deviations"
              payload: { kind: "PROCESS", severity: "CRITICAL", description: "Agitation anomaly under investigation" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { dev_a: $.data.id }
            - call: "POST /batches/${batch_id}/deviations"
              payload: { kind: "PROCESS", severity: "CRITICAL", description: "Temperature probe drift under investigation" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { dev_b: $.data.id }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: Any
              captures: { posture_pre: $.data.release_posture }
          trigger:
            - call: "POST /batches/${batch_id}/disposition"
              payload: { decision: "RELEASED", rationale: "Attempted release while frozen and mid-process" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-3"
              captures: { err: $.data.error_id }
          assert:
            - "${posture_pre} == FROZEN (the posture gate WOULD also fail)"
            - "the response status is 409 and ${err} == ERR_INVALID_BATCH_STATE"
            - "${err} != ERR_SITE_RELEASE_FROZEN (priority 4 state beats priority 7 business_safety)"
            - "BatchLot.${batch_id}.quality_status still IN_TESTING (no partial mutation)"

      - name: shipment_create_referential_error_precedes_storage_fiscal
        grounds:
          - validations[priority=10]
          - validations[priority=28]
          - errors.ERR_BATCH_NOT_RELEASED
          - errors.ERR_COLD_STORAGE_CAPACITY_EXCEEDED
        distinguishing_aspect: "Category pair business_referential vs business_fiscal: the batch is only READY_FOR_REVIEW (referential gate, priority 10) AND the 600-unit shipment would exceed the 500-unit cold storage capacity (fiscal gate, priority 28); the returned error must be ERR_BATCH_NOT_RELEASED."
        test_recipe:
          setup:
            - "Site with cold_storage_capacity_units 500; small train (2 L); batch at PROCESS_COMPLETE with final yield 625 (READY_FOR_REVIEW, never submitted)."
          setup_api_calls:
            - *d_clock0
            - &d_site_ss
              call: "POST /sites"
              payload: { name: "Cork Fill-Finish", region: "IE-COR", monthly_capacity_hours: 5000, cold_storage_capacity_units: 500, licensed_authorities: ["EMA"] }
              as: PlatformAdmin
              captures: { site_s: $.data.id }
            - *d_product
            - &d_train_s
              call: "POST /sites/${site_s}/trains"
              payload: { train_code: "TR-S", capacity_liters: 2, supported_molecule_types: ["MONOCLONAL_ANTIBODY"] }
              as: PlatformAdmin
              captures: { train_s: $.data.id }
            - &d_campaign_s
              call: "POST /trains/${train_s}/campaigns"
              payload: { product_id: "${prod_id}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-01T00:00:00Z", planned_end_utc: "2026-10-20T00:00:00Z", upstream_hours: 20, downstream_hours: 30 }
              as: ProcessEngineer
              captures: { camp_s: $.data.id }
            - &d_alloc_s
              call: "POST /campaigns/${camp_s}/advance"
              payload: { to_status: "ALLOCATED" }
              as: ProcessEngineer
            - &d_seed_s
              call: "POST /campaigns/${camp_s}/seed-stages"
              payload: { stage_index: 1, planned_duration_hours: 10 }
              as: ProcessEngineer
              captures: { ss1s: $.data.id }
            - call: "POST /seed-stages/${ss1s}/advance"
              payload: { to_status: "RUNNING" }
              as: ProcessEngineer
            - *d_clock10
            - call: "POST /seed-stages/${ss1s}/advance"
              payload: { to_status: "COMPLETED" }
              as: ProcessEngineer
            - call: "POST /campaigns/${camp_s}/advance"
              payload: { to_status: "PRODUCTION_IN_PROGRESS" }
              as: ProcessEngineer
            - &d_batch_s
              call: "POST /campaigns/${camp_s}/batches"
              payload: { lot_number: "LOT-S1" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { batch_s: $.data.id, bat_vs: $.data.version }
            - call: "POST /batches/${batch_s}/tests"
              payload: { test_type: "CELL_VIABILITY", phase: "UPSTREAM", measured_value: 88.0, unit: "PCT", spec_min: 80.0, spec_max: 100.0, expected_batch_version: "${bat_vs}" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { t_ups: $.data.id }
            - call: "POST /tests/${t_ups}/verify"
              payload: {}
              as: QualityControlAnalyst
              as_user_id: "qc-1"
            - call: "POST /batches/${batch_s}/advance"
              payload: { to_status: "DOWNSTREAM" }
              as: ManufacturingOperator
              as_user_id: "op-1"
            - call: "GET /batches/${batch_s}"
              payload: {}
              as: Any
              captures: { bat_vs2: $.data.version }
            - call: "POST /batches/${batch_s}/tests"
              payload: { test_type: "TITER", phase: "DOWNSTREAM", measured_value: 2.5, unit: "G/L", spec_min: 2.0, spec_max: 4.0, expected_batch_version: "${bat_vs2}" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { t_ts: $.data.id }
            - call: "POST /tests/${t_ts}/verify"
              payload: {}
              as: QualityControlAnalyst
              as_user_id: "qc-1"
            - call: "POST /batches/${batch_s}/advance"
              payload: { to_status: "PROCESS_COMPLETE" }
              as: ManufacturingOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /batches/${batch_s}/shipments"
              payload: { destination_region: "IE-DUB", market_type: "COMMERCIAL", quantity_units: 600 }
              as: SupplyPlanner
              as_user_id: "sp-1"
              captures: { err: $.data.error_id }
          assert:
            - "BatchLot.${batch_s}.quantity_units == 625 (so 600 units passes the available-units check)"
            - "the response status is 409 and ${err} == ERR_BATCH_NOT_RELEASED"
            - "${err} != ERR_COLD_STORAGE_CAPACITY_EXCEEDED even though 600 > 500 would violate it (priority 10 business_referential beats priority 28 business_fiscal)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: train_changeover_gap_exact_boundary
        grounds:
          - calculations.train_window_conflict
          - errors.ERR_TRAIN_WINDOW_CONFLICT
          - endpoints.POST_/trains/{trainId}/campaigns
        distinguishing_aspect: "Metric: changeover gap hours on the campaign-create endpoint. A different-product successor starting exactly max(14, 10) == 14 hours after the predecessor's end is ALLOWED (>= semantics); one second earlier is a conflict."
        test_recipe:
          setup:
            - "Dual-molecule train TR-9; campaign A (MAB-001, changeover 14) occupies 2026-10-01T00:00Z to 2026-10-10T00:00Z; product FSN-002 has changeover 10."
          setup_api_calls:
            - *d_clock0
            - *d_site
            - *d_product
            - *d_p2
            - *d_train_dual
            - *d_campaign_a
          trigger:
            - call: "POST /trains/${train2_id}/campaigns"
              payload: { product_id: "${prod2_id}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-10T14:00:00Z", planned_end_utc: "2026-10-12T00:00:00Z", upstream_hours: 8, downstream_hours: 24 }
              as: ProcessEngineer
              captures: { camp_exact: $.data.id }
            - call: "POST /trains/${train2_id}/campaigns"
              payload: { product_id: "${prod2_id}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-10T13:59:59Z", planned_end_utc: "2026-10-11T00:00:00Z", upstream_hours: 8, downstream_hours: 24 }
              as: ProcessEngineer
              captures: { err: $.data.error_id }
          assert:
            - "Campaign.${camp_exact} created with status 201 and status field PROPOSED (gap exactly 14 hours allowed)"
            - "the 13:59:59 attempt is rejected 409 with ${err} == ERR_TRAIN_WINDOW_CONFLICT (one second of gap shortfall)"

      - name: critical_deviation_count_threshold_boundary
        grounds:
