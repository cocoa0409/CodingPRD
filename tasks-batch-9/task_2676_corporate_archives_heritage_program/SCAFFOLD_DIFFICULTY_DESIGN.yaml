      - name: migration_job_cannot_start_while_zone_environment_marginal
        grounds:
          - validations[priority=45]
          - errors.ERR_ZONE_NOT_COMPLIANT
          - calculations.zone_environmental_status
          - state_machines.MigrationJob.APPROVED_to_IN_PROGRESS
        distinguishing_aspect: |
          Entity pair MigrationJob -> StorageZone, and the blocking state is a COMPUTED
          enum rather than a lifecycle state: a single environment reading of 20.5 C and
          52.0 % RH moves the zone from COMPLIANT to MARGINAL, and MARGINAL is not
          COMPLIANT, so the approved job cannot start even though its money is already
          committed and nothing about the job changed. The other two instances depend on
          lifecycle states of a series and of a loan respectively.
        test_recipe:
          setup:
            - "A StorageZone created at 16.0 C / 40.0 % RH, i.e. COMPLIANT, with reading_count 1."
            - "One ACCESSIONED ArchivalItem in that zone (MAGNETIC_TAPE, unit_count 10, GOOD)."
