            - "Student SL: hs_gpa 3.50 VERIFIED -> only R1 matches (R2's max_hs_gpa is EXCLUSIVE) -> placed MATH-100."
            - "Student SM: hs_gpa 2.50 VERIFIED -> only R2 matches -> placed MATH-050."
            - "Section sec050 of MATH-050, seat_capacity 5, OPEN, UNPAIRED — plenty of seats, so validations priority 30 never participates."
            - "Neither student has any COMPLETED READ-050 registration, so calculations.prerequisite_satisfaction_closure returns UNMET without an override."
