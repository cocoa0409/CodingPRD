              captures: { c50_cycle: $.data.review_cycle_index, c50_due: $.data.review_due_date }
          assert:
            - "The stale attempt returns HTTP 412 with data.error_id == ERR_STALE_VERSION and AccommodationRequest.${c50_req}.review_cycle_index stays 0"
            - "AccommodationRequest.${c50_req}.stage == RENEWAL_DUE at the moment of the rejection"
            - "The correct-version call returns HTTP 200 with review_cycle_index == 1 and stage == GRANTED_PERMANENT"
            - "AccommodationRequest.${c50_req}.review_due_date == 2028-08-02 (2027-08-03 plus review_cadence_days 365)"

      - name: corner_version_increments_on_every_case_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.AccommodationRequest.fields.employee_id
          - endpoints[PATCH /accommodation-requests/{id}]
          - endpoints[POST /accommodation-requests/{id}/medical-doc-requests]
        distinguishing_aspect: "The case's version is 1 at creation, advances on a PATCH, and advances again on a documentation round, so every mutation including the OCC-guarded one moves the counter by exactly one."
        test_recipe:
          setup:
            - "A freshly created case in stage INTAKE with disability_obvious false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /job-profiles"
              payload: { job_code: "C-JP-51", title: "Corner Profile 51", department_code: "CP9", department_annual_budget_cents: 1500000, employer_annual_budget_cents: 800000000 }
              as: AccommodationCoordinator
              captures: { c51_jp: $.data.id }
            - call: "POST /job-profiles/${c51_jp}/essential-functions"
              payload: { function_code: "C-EF-51", description: "Corner duty", criticality_weight: 5, frequency_per_week: 20, is_essential: true, marginal_reassignable: false }
              as: AccommodationCoordinator
            - call: "POST /job-profiles/${c51_jp}/publish"
              payload: { profile_version_label: "2026.1" }
              as: AccommodationCoordinator
            - call: "POST /employees"
              payload: { employee_number: "C-E-51", full_name: "Corner Fiftyone", department_code: "CP9", job_title: "Operator", hire_date: "2024-04-20", job_profile_id: "${c51_jp}", is_people_manager: false, annual_salary_cents: 4000000 }
              as: AccommodationCoordinator
              captures: { c51_emp: $.data.id }
          trigger:
            - call: "POST /accommodation-requests"
              payload: { employee_id: "${c51_emp}", request_channel: "WRITTEN", requested_accommodation_text: "First wording", disability_obvious: false }
              as: Employee
              as_user_id: "${c51_emp}"
              captures: { c51_req: $.data.id, c51_v1: $.data.version }
            - call: "PATCH /accommodation-requests/${c51_req}"
              payload: { requested_accommodation_text: "Second wording" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { c51_v2: $.data.version }
            - call: "POST /accommodation-requests/${c51_req}/medical-doc-requests"
              payload: { scope_fields_requested: ["functional_limitations"], due_date: "2026-08-17T00:00:00Z", is_second_opinion: false, expected_request_version: "${c51_v2}" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "GET /accommodation-requests/${c51_req}"
              payload: {}
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { c51_v3: $.data.version }
          assert:
            - "${c51_v1} == 1"
            - "${c51_v2} == 2 and AccommodationRequest.${c51_req}.requested_accommodation_text == Second wording"
            - "${c51_v3} == 3 and AccommodationRequest.${c51_req}.stage == DOC_PENDING"
            - "AccommodationRequest.${c51_req}.updated_at is strictly later than created_at after the PATCH"

      - name: corner_daily_sweep_is_a_noop_when_nothing_is_due
        claim_type: scheduled_actions
        grounds:
          - endpoints[POST /_ops/daily-sweep]
          - calculations.daily_sweep_order
        distinguishing_aspect: "Run against a database whose only rows are a profile and an employee, the sweep returns 200 with every counter at 0 and mutates nothing."
        test_recipe:
          setup:
            - "One PUBLISHED profile and one employee; no cases, trials, absences or denials."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /job-profiles"
              payload: { job_code: "C-JP-52", title: "Corner Profile 52", department_code: "CQ1", department_annual_budget_cents: 1500000, employer_annual_budget_cents: 800000000 }
              as: AccommodationCoordinator
              captures: { c52_jp: $.data.id }
            - call: "POST /employees"
              payload: { employee_number: "C-E-52", full_name: "Corner Fiftytwo", department_code: "CQ1", job_title: "Operator", hire_date: "2024-04-21", job_profile_id: "${c52_jp}", is_people_manager: false, annual_salary_cents: 4000000 }
              as: AccommodationCoordinator
              captures: { c52_emp: $.data.id }
          trigger:
            - call: "POST /_ops/daily-sweep"
              payload: {}
              as: ComplianceAuditor
              captures: { c52_swept: $.data.swept_at }
          assert:
            - "HTTP status is 200 and data.swept_at == 2026-08-03T09:00:00.000Z"
            - "doc_requests_expired, absence_records_activated, absence_records_exhausted, trials_activated, trials_moved_to_review, requests_moved_to_renewal_due and denials_finalized are all 0"
            - "Employee.${c52_emp}.employment_status == ACTIVE and version == 1 (untouched)"

  # =========================================================================
  - section: consistency_model
    instances:

      - name: corner_grant_response_reflects_every_cascade_immediately
        claim_type: immediate
        grounds:
          - state_machines.AccommodationRequest.DECISION_PENDING_to_GRANTED_PERMANENT
          - calculations.committed_cost_ledger
          - calculations.renewal_cadence
        distinguishing_aspect: "The GRANT_PERMANENT response body already carries stage GRANTED_PERMANENT, selected_option_id, review_cadence_days 365 and review_due_date 2027-08-03, and a same-instant read of the JobProfile already shows committed_accommodation_cost_cents 29600 with no settling delay."
        test_recipe:
          setup:
            - "A case in DECISION_PENDING with exactly one CLEARED option of net cost 29600 covering the single essential function."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /job-profiles"
              payload: { job_code: "C-JP-53", title: "Corner Profile 53", department_code: "CQ2", department_annual_budget_cents: 1500000, employer_annual_budget_cents: 800000000 }
              as: AccommodationCoordinator
              captures: { c53_jp: $.data.id }
            - call: "POST /job-profiles/${c53_jp}/essential-functions"
              payload: { function_code: "C-EF-53", description: "Corner duty", criticality_weight: 5, frequency_per_week: 20, is_essential: true, marginal_reassignable: false }
              as: AccommodationCoordinator
              captures: { c53_ef: $.data.id }
            - call: "POST /job-profiles/${c53_jp}/publish"
              payload: { profile_version_label: "2026.1" }
              as: AccommodationCoordinator
            - call: "POST /employees"
              payload: { employee_number: "C-E-53", full_name: "Corner Fiftythree", department_code: "CQ2", job_title: "Operator", hire_date: "2024-04-22", job_profile_id: "${c53_jp}", is_people_manager: false, annual_salary_cents: 4000000 }
              as: AccommodationCoordinator
              captures: { c53_emp: $.data.id }
            - call: "POST /employees"
              payload: { employee_number: "C-M-53", full_name: "Corner Fiftythree Mgr", department_code: "CQ2", job_title: "Manager", hire_date: "2019-04-22", job_profile_id: "${c53_jp}", is_people_manager: true, annual_salary_cents: 9000000 }
              as: AccommodationCoordinator
              captures: { c53_mgr: $.data.id }
            - call: "POST /accommodation-requests"
              payload: { employee_id: "${c53_emp}", request_channel: "WRITTEN", requested_accommodation_text: "Corner accommodation fiftythree", disability_obvious: true }
              as: Employee
              as_user_id: "${c53_emp}"
              captures: { c53_req: $.data.id }
            - call: "POST /accommodation-requests/${c53_req}/advance"
              payload: { target_stage: "FUNCTION_ANALYSIS" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /accommodation-requests/${c53_req}/function-analyses"
              payload: { essential_function_id: "${c53_ef}", can_perform_unaided: false, limitation_severity: 3, proposed_treatment: "PERFORM_WITH_AID" }
              as: Manager
              as_user_id: "${c53_mgr}"
            - call: "POST /accommodation-requests/${c53_req}/advance"
              payload: { target_stage: "OPTION_EXPLORATION" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "POST /accommodation-requests/${c53_req}/options"
              payload: { option_code: "C-OPT-53", category: "EQUIPMENT", one_time_cost_cents: 40000, recurring_monthly_cost_cents: 0, implementation_days: 10, coverage_function_ids: ["${c53_ef}"] }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { c53_opt: $.data.id }
            - call: "POST /accommodation-requests/${c53_req}/advance"
              payload: { target_stage: "HARDSHIP_REVIEW" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "GET /accommodation-options/${c53_opt}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "FIN-1"
              captures: { c53_optv: $.data.version }
            - call: "POST /accommodation-options/${c53_opt}/hardship-assessments"
              payload: { assessment_basis: "SITE_LOCAL", expected_option_version: "${c53_optv}" }
              as: FinanceOfficer
              as_user_id: "FIN-1"
            - call: "POST /accommodation-requests/${c53_req}/advance"
              payload: { target_stage: "DECISION_PENDING" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
          trigger:
            - call: "POST /accommodation-requests/${c53_req}/decide"
              payload: { decision: "GRANT_PERMANENT", selected_option_id: "${c53_opt}" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { c53_stage: $.data.stage, c53_sel: $.data.selected_option_id, c53_cad: $.data.review_cadence_days, c53_due: $.data.review_due_date }
            - call: "GET /job-profiles/${c53_jp}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "FIN-1"
              captures: { c53_ledger: $.data.committed_accommodation_cost_cents }
          assert:
            - "The decide response body already shows stage == GRANTED_PERMANENT, decision == GRANT_PERMANENT and selected_option_id == ${c53_opt}"
            - "The same response body already shows review_cadence_days == 365 and review_due_date == 2027-08-03"
            - "The immediately following JobProfile read shows committed_accommodation_cost_cents == 29600"
            - "AccommodationOption.${c53_opt}.status == IMPLEMENTED and committed_cost_cents == 29600 on the same instant"
