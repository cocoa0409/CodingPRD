        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[agreement-activate-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Activating with expected_agreement_version one behind the current version returns 412 ERR_STALE_VERSION; the same call with the current version succeeds and bumps version by 1."
        test_recipe:
          setup:
            - "Owner OCC; Property PCC; Agreement AGCC in DRAFT at version 1"
          setup_api_calls:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "OCC Owner LP", distribution_day_of_month: 10 }
              as: PortfolioManager
              captures: { occ_id: $.data.id }
            - call: "POST /mgmt/owners/${occ_id}/properties"
              payload: { name: "OCC Property", unit_count: 10 }
              as: PortfolioManager
              captures: { pcc_id: $.data.id }
