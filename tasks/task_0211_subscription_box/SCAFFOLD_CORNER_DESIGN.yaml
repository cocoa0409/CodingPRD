        distinguishing_aspect: "POST /gift-grants charges amount_paid_cents == period_price * term_periods == 6000*3 == 18000 (NO prepaid discount applied to gifts, unlike prepay)."
        test_recipe:
          setup: ["Plan 6000/period with discount 0.10 offered. Gifter buys a 3-period gift."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
