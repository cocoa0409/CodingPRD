            - call: "POST /vessel-jobs"
              payload: { certificate_id: "${cert_id}", job_number: "J-2885-C58", customer_name: "Northline Energy", vessel_type: "PRESSURE_VESSEL", design_code: "DIV1", mawp_psi: 350, design_temp_f: 650, mdmt_f: -20, inside_radius_in: 30 }
              as: DesignEngineer
