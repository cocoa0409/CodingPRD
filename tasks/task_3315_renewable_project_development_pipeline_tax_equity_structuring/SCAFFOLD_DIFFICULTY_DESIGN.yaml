        grounds:
          - state_machines.OfftakeAgreement.NEGOTIATING_to_COUNTERED
          - state_machines.OfftakeAgreement.COUNTERED_to_NEGOTIATING
          - entities.OfftakeAgreement.fields.counter_count
        distinguishing_aspect: |
          Cyclic machine on OfftakeAgreement: NEGOTIATING -> COUNTERED ->
          NEGOTIATING -> COUNTERED -> EXECUTED loops twice before execution, with
          counter_count accumulating and a mid-cycle price revision preserved.
        test_recipe:
          setup:
            - "Project P (version captured fresh for OCC); one offtake created at 38.00"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Cycle Farm", technology: "WIND", target_capacity_mw: 100, resource_class: "B" }
              as: DeveloperAdmin
              captures: { p: $.data.id, pv: $.data.version }
            - call: "POST /api/projects/${p}/offtake-agreements"
              payload: { buyer_type: "CORPORATE", base_price_usd_mwh: 38.00, escalator_pct: 2.0, term_years: 12, delivery_start_date: "2028-06-01T00:00:00Z", expected_project_version: "${pv}" }
              as: OriginationManager
              captures: { oa: $.data.id }
          trigger:
            - call: "POST /api/offtake-agreements/${oa}/transitions"
              payload: { to: "COUNTERED", base_price_usd_mwh: 41.50 }
              as: OriginationManager
            - call: "POST /api/offtake-agreements/${oa}/transitions"
              payload: { to: "NEGOTIATING" }
              as: OriginationManager
            - call: "POST /api/offtake-agreements/${oa}/transitions"
              payload: { to: "COUNTERED" }
              as: OriginationManager
            - call: "POST /api/offtake-agreements/${oa}/transitions"
              payload: { to: "EXECUTED" }
              as: OriginationManager
          assert:
            - "OfftakeAgreement.${oa}.status == EXECUTED after two full negotiation cycles"
            - "OfftakeAgreement.${oa}.counter_count == 3"
            - "OfftakeAgreement.${oa}.base_price_usd_mwh == 41.50 (mid-cycle revision retained)"

      - name: study_deficiency_rework_cycle
        grounds:
          - state_machines.InterconnectionStudy.DELIVERED_to_DEFICIENT
          - state_machines.InterconnectionStudy.DEFICIENT_to_IN_PROGRESS
          - entities.InterconnectionStudy.fields.rework_count
        distinguishing_aspect: |
          Cyclic machine on a different entity (InterconnectionStudy): a DELIVERED
          study is found DEFICIENT, loops back to IN_PROGRESS, and is delivered and
          accepted on the second pass with rework_count == 1 — the loop, not a
          linear pipeline, is what unblocks the queue gate.
        test_recipe:
          setup:
            - "Project P; interconnection request IR in FEASIBILITY_STUDY; one FEASIBILITY study scoped"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Rework Farm", technology: "SOLAR", target_capacity_mw: 60, resource_class: "C" }
              as: DeveloperAdmin
              captures: { p: $.data.id }
            - call: "POST /api/projects/${p}/interconnection-requests"
              payload: { cluster_id: "CL-RW", requested_capacity_mw: 60 }
              as: OriginationManager
              captures: { ir: $.data.id }
            - call: "POST /api/interconnection-requests/${ir}/transitions"
              payload: { to: "FEASIBILITY_STUDY" }
              as: OriginationManager
            - call: "POST /api/interconnection-requests/${ir}/studies"
              payload: { phase: "FEASIBILITY", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-31T00:00:00Z" }
              as: OriginationManager
              captures: { st: $.data.id }
            - call: "POST /api/interconnection-studies/${st}/transitions"
              payload: { to: "IN_PROGRESS" }
              as: OriginationManager
            - call: "POST /api/interconnection-studies/${st}/transitions"
              payload: { to: "DELIVERED" }
              as: OriginationManager
          trigger:
            - call: "POST /api/interconnection-studies/${st}/transitions"
              payload: { to: "DEFICIENT" }
              as: OriginationManager
            - call: "POST /api/interconnection-studies/${st}/transitions"
              payload: { to: "IN_PROGRESS" }
              as: OriginationManager
            - call: "POST /api/interconnection-studies/${st}/transitions"
              payload: { to: "DELIVERED" }
              as: OriginationManager
            - call: "POST /api/interconnection-studies/${st}/transitions"
              payload: { to: "ACCEPTED" }
              as: OriginationManager
            - call: "POST /api/interconnection-requests/${ir}/transitions"
              payload: { to: "SYSTEM_IMPACT_STUDY" }
              as: OriginationManager
          assert:
            - "InterconnectionStudy.${st}.rework_count == 1 and .status == ACCEPTED"
            - "InterconnectionRequest.${ir}.status == SYSTEM_IMPACT_STUDY (phase gate unblocked only after the reworked ACCEPTED)"

  - rule_id: transitive_cascade
    instances:
      - name: withdrawal_reseat_reallocation_chain
        grounds:
          - state_machines.InterconnectionRequest.*_to_WITHDRAWN
          - calculations.queue_reseat
          - calculations.upgrade_cost_allocation
        distinguishing_aspect: |
          Depth-3 chain triggered by withdrawal: (1) request -> WITHDRAWN, which
          (2) causes sibling reseat (2->1, 3->2), which itself (3) causes upgrade
          shares to be recomputed over the remaining pool — the 900,000.00 total
          redistributes 360,000.00 / 540,000.00 to the survivors while the
          withdrawn request keeps its historical 174,193.55 share.
        test_recipe:
          setup:
            - "Three projects in cluster CL-Q with requests R1 (60 MW, pos 1), R2 (100 MW, pos 2), R3 (150 MW, pos 3); upgrade allocation 900,000.00 run (shares 174,193.55 / 290,322.58 / 435,483.87)"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Q1", technology: "WIND", target_capacity_mw: 60, resource_class: "A" }
              as: DeveloperAdmin
              captures: { p1: $.data.id }
            - call: "POST /api/projects"
              payload: { name: "Q2", technology: "WIND", target_capacity_mw: 100, resource_class: "A" }
              as: DeveloperAdmin
              captures: { p2: $.data.id }
            - call: "POST /api/projects"
              payload: { name: "Q3", technology: "SOLAR", target_capacity_mw: 150, resource_class: "B" }
              as: DeveloperAdmin
              captures: { p3: $.data.id }
            - call: "POST /api/projects/${p1}/interconnection-requests"
              payload: { cluster_id: "CL-Q", requested_capacity_mw: 60 }
              as: OriginationManager
              captures: { r1: $.data.id, r1_pos: $.data.queue_position }
            - call: "POST /api/projects/${p2}/interconnection-requests"
              payload: { cluster_id: "CL-Q", requested_capacity_mw: 100 }
              as: OriginationManager
              captures: { r2: $.data.id }
            - call: "POST /api/projects/${p3}/interconnection-requests"
              payload: { cluster_id: "CL-Q", requested_capacity_mw: 150 }
              as: OriginationManager
              captures: { r3: $.data.id }
            - call: "POST /api/interconnection-requests/${r1}/allocate-upgrade-costs"
              payload: { total_upgrade_cost_usd: 900000 }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/interconnection-requests/${r1}/transitions"
              payload: { to: "WITHDRAWN" }
              as: OriginationManager
          assert:
            - "${r1_pos} == 1 at creation (positions assigned by creation order)"
            - "Pre-withdrawal shares: 174193.55 / 290322.58 / 435483.87 (verified on GET after allocation)"
            - "After withdrawal: InterconnectionRequest.${r2}.queue_position == 1 and .${r3}.queue_position == 2"
            - "After withdrawal: InterconnectionRequest.${r2}.upgrade_cost_share_usd == 360000.00"
            - "After withdrawal: InterconnectionRequest.${r3}.upgrade_cost_share_usd == 540000.00"
            - "InterconnectionRequest.${r1}.upgrade_cost_share_usd remains 174193.55 (historical) and .status == WITHDRAWN"

      - name: safe_harbor_cancellation_clawback_chain
        grounds:
          - state_machines.ProcurementOrder.SAFE_HARBOR_QUALIFIED_to_CANCELLED
          - state_machines.TaxCreditQualification.SAFE_HARBOR_ESTABLISHED_to_NOT_ELIGIBLE
          - entities.Project.fields.tax_credit_anchored
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (order cancellation): (1) PO
          SAFE_HARBOR_QUALIFIED -> CANCELLED flips safe_harbor_qualified to false,
          which (2) causes the TaxCreditQualification to revert to NOT_ELIGIBLE
          (no other qualified order remains), which (3) recomputes
          Project.tax_credit_anchored to false.
        test_recipe:
          setup:
            - "Project P; EXECUTED supply agreement; PO-A SAFE_HARBOR_QUALIFIED (sole anchor); PO-B still DEPOSIT_PAID; TCQ SAFE_HARBOR_ESTABLISHED (FOUR_YEAR_SAFE_HARBOR)"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Clawback Farm", technology: "WIND", target_capacity_mw: 90, resource_class: "B" }
              as: DeveloperAdmin
              captures: { p: $.data.id }
            - call: "POST /api/projects/${p}/supply-agreements"
              payload: { equipment_type: "TURBINE", supplier_name: "GE Vernova", total_contract_usd: 4000000 }
              as: ProcurementLead
              captures: { sa: $.data.id }
            - call: "POST /api/supply-agreements/${sa}/transitions"
              payload: { to: "EXECUTED" }
              as: ProcurementLead
            - call: "POST /api/supply-agreements/${sa}/procurement-orders"
              payload: { order_amount_usd: 2000000, safe_harbor_method: "FIVE_PERCENT_COST", eligible_cost_basis_usd: 2000000 }
              as: ProcurementLead
              captures: { poa: $.data.id }
            - call: "POST /api/procurement-orders/${poa}/transitions"
              payload: { to: "DEPOSIT_PAID", deposit_amount_usd: 100000.00 }
              as: ProcurementLead
            - call: "POST /api/procurement-orders/${poa}/transitions"
              payload: { to: "SAFE_HARBOR_QUALIFIED" }
              as: ProcurementLead
            - call: "POST /api/supply-agreements/${sa}/procurement-orders"
              payload: { order_amount_usd: 500000, safe_harbor_method: "FIVE_PERCENT_COST", eligible_cost_basis_usd: 2000000 }
              as: ProcurementLead
              captures: { pob: $.data.id }
            - call: "POST /api/procurement-orders/${pob}/transitions"
              payload: { to: "DEPOSIT_PAID", deposit_amount_usd: 10000.00 }
              as: ProcurementLead
            - call: "GET /api/projects/${p}/tax-credit-qualifications"
              as: TaxCounsel
              captures: { tcq: "$.data[0].id" }
            - call: "POST /api/tax-credit-qualifications/${tcq}/transitions"
              payload: { to: "SAFE_HARBOR_ESTABLISHED", continuity_variant: "FOUR_YEAR_SAFE_HARBOR" }
              as: TaxCounsel
          trigger:
            - call: "POST /api/procurement-orders/${poa}/transitions"
              payload: { to: "CANCELLED" }
              as: ProcurementLead
          assert:
            - "ProcurementOrder.${poa}.status == CANCELLED and .safe_harbor_qualified == false (link 1)"
            - "TaxCreditQualification.${tcq}.status == NOT_ELIGIBLE (link 2, caused by link 1: no qualified order remains — PO-B is only DEPOSIT_PAID)"
            - "Project.${p}.tax_credit_anchored == false (link 3, caused by link 2)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_terminated_offtake
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PRICE_FLOOR_BREACH]
        distinguishing_aspect: |
          Error-category pair state (p6) vs business_fiscal (p11): the request
          violates both (terminated agreement, below-floor price) and the
          higher-priority state error must win — ERR_INVALID_STATE, not
          ERR_PRICE_FLOOR_BREACH.
        test_recipe:
          setup:
            - "Project P; offtake OA terminated from NEGOTIATING"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Prio Farm A", technology: "SOLAR", target_capacity_mw: 50, resource_class: "B" }
              as: DeveloperAdmin
              captures: { p: $.data.id, pv: $.data.version }
            - call: "POST /api/projects/${p}/offtake-agreements"
              payload: { buyer_type: "UTILITY", base_price_usd_mwh: 30.00, escalator_pct: 1.5, term_years: 10, delivery_start_date: "2028-01-01T00:00:00Z", expected_project_version: "${pv}" }
              as: OriginationManager
              captures: { oa: $.data.id }
            - call: "POST /api/offtake-agreements/${oa}/transitions"
              payload: { to: "TERMINATED" }
              as: OriginationManager
          trigger:
            - call: "POST /api/offtake-agreements/${oa}/transitions"
              payload: { to: "EXECUTED", base_price_usd_mwh: 15.00 }
              as: OriginationManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE (TERMINATED is terminal; the 15.00 price would also breach the 20.00 floor but fiscal p11 never runs)"
            - "OfftakeAgreement.${oa}.status remains TERMINATED and base_price_usd_mwh remains 30.00"

      - name: temporal_beats_referential_on_safe_harbor_confirm
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_SAFE_HARBOR_WINDOW_LAPSED]
          - errors[ERR_SUPPLY_AGREEMENT_NOT_EXECUTED]
        distinguishing_aspect: |
          Error-category pair business_temporal (p8) vs business_referential
          (p10): the confirm violates both (clock 183+ days past placement AND
          supply agreement still DRAFT) and the temporal error must win —
          ERR_SAFE_HARBOR_WINDOW_LAPSED, not ERR_SUPPLY_AGREEMENT_NOT_EXECUTED.
        test_recipe:
          setup:
            - "Project P; supply agreement SA left in DRAFT; PO placed 2026-09-01 with 120,000.00 deposit; clock advanced to 2027-03-10 (190 days later)"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Prio Farm B", technology: "WIND", target_capacity_mw: 70, resource_class: "A" }
              as: DeveloperAdmin
              captures: { p: $.data.id }
            - call: "POST /api/projects/${p}/supply-agreements"
              payload: { equipment_type: "TURBINE", supplier_name: "Siemens", total_contract_usd: 6000000 }
              as: ProcurementLead
              captures: { sa: $.data.id }
            - call: "POST /api/supply-agreements/${sa}/procurement-orders"
              payload: { order_amount_usd: 2400000, safe_harbor_method: "FIVE_PERCENT_COST", eligible_cost_basis_usd: 2400000 }
              as: ProcurementLead
              captures: { po: $.data.id }
            - call: "POST /api/procurement-orders/${po}/transitions"
              payload: { to: "DEPOSIT_PAID", deposit_amount_usd: 120000.00 }
              as: ProcurementLead
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/procurement-orders/${po}/transitions"
              payload: { to: "SAFE_HARBOR_QUALIFIED" }
              as: ProcurementLead
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SAFE_HARBOR_WINDOW_LAPSED (190 days > 183; the DRAFT supply agreement would also fail p10 but never runs)"
            - "ProcurementOrder.${po}.status remains DEPOSIT_PAID and safe_harbor_qualified == false"

  - rule_id: boundary_precision_check
    instances:
      - name: safe_harbor_exactly_five_percent_qualifies
        grounds:
          - calculations.safe_harbor_cost_test
          - errors[ERR_SAFE_HARBOR_TEST_FAILED]
        distinguishing_aspect: |
          Metric: deposit vs 5% threshold on the procurement endpoint. The test is
          inclusive (>=): deposit exactly round_half_up(0.05 * 2,000,000.00) =
          100,000.00 qualifies, while 99,999.99 (one cent under) fails with
          ERR_SAFE_HARBOR_TEST_FAILED.
        test_recipe:
          setup:
            - "Project P; EXECUTED supply agreement SA; PO-X with deposit exactly 100,000.00 on 2,000,000.00 basis; PO-Y with 99,999.99 on the same basis"
          setup_api_calls:
            - call: "POST /api/projects"
              payload: { name: "Boundary Farm", technology: "SOLAR", target_capacity_mw: 40, resource_class: "A" }
              as: DeveloperAdmin
              captures: { p: $.data.id }
            - call: "POST /api/projects/${p}/supply-agreements"
              payload: { equipment_type: "MODULE", supplier_name: "LONGi", total_contract_usd: 2500000 }
              as: ProcurementLead
              captures: { sa: $.data.id }
            - call: "POST /api/supply-agreements/${sa}/transitions"
              payload: { to: "EXECUTED" }
              as: ProcurementLead
            - call: "POST /api/supply-agreements/${sa}/procurement-orders"
              payload: { order_amount_usd: 1900000, safe_harbor_method: "FIVE_PERCENT_COST", eligible_cost_basis_usd: 2000000 }
              as: ProcurementLead
              captures: { pox: $.data.id }
            - call: "POST /api/procurement-orders/${pox}/transitions"
              payload: { to: "DEPOSIT_PAID", deposit_amount_usd: 100000.00 }
              as: ProcurementLead
            - call: "POST /api/supply-agreements/${sa}/procurement-orders"
              payload: { order_amount_usd: 1900000, safe_harbor_method: "FIVE_PERCENT_COST", eligible_cost_basis_usd: 2000000 }
              as: ProcurementLead
              captures: { poy: $.data.id }
            - call: "POST /api/procurement-orders/${poy}/transitions"
              payload: { to: "DEPOSIT_PAID", deposit_amount_usd: 99999.99 }
              as: ProcurementLead
          trigger:
            - call: "POST /api/procurement-orders/${pox}/transitions"
              payload: { to: "SAFE_HARBOR_QUALIFIED" }
              as: ProcurementLead
            - call: "POST /api/procurement-orders/${poy}/transitions"
              payload: { to: "SAFE_HARBOR_QUALIFIED" }
              as: ProcurementLead
              captures: { err_y: $.data.error_id }
          assert:
            - "ProcurementOrder.${pox}.status == SAFE_HARBOR_QUALIFIED (100000.00 >= 100000.00, inclusive boundary)"
            - "${err_y} == ERR_SAFE_HARBOR_TEST_FAILED (99999.99 < 100000.00 by one cent)"
            - "ProcurementOrder.${poy}.status remains DEPOSIT_PAID"

      - name: availability_exactly_at_guarantee_zero_ld
