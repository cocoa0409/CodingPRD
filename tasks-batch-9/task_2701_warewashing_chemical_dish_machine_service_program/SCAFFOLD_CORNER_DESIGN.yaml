          setup:
            - "One ACTIVE agreement with a 1-month minimum term (start 2026-08-01, term_end 2026-09-01) and renewal_notice_days 5."
            - "Placement AT-C01 is INSTALLED with one DET-100 dispenser; placement AT-C02 is left PENDING_INSTALL."
