            - "License.${l_id}.remaining_value_cents == 90000"
            - "License.${l_id}.status == \"EXHAUSTED\" (auto-transition at remaining 0)"

      - name: audit_purge_retain_until_equality_retained
        grounds:
          - calculations.audit_retention
          - entities.AuditRecord.fields.retain_until
        distinguishing_aspect: |
          Metric: retain_until timestamp; endpoint POST /audit-records/purge. Boundary is
          strict (<): a record whose retain_until exactly equals the current clock is
          RETAINED; advancing the clock by one second purges it.
        test_recipe:
          setup:
            - "One AuditRecord(CLASSIFICATION_ACTIVATED) created at the default clock 2026-08-01T00:00:00Z -> retain_until = 2031-07-31T00:00:00Z (1825 days)"
          setup_api_calls:
