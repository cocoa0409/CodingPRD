          assert:
            - "${err_sup} == ERR_STERILIZATION_SUPERSEDE_INVALID with HTTP 409"
            - "${err_future} == ERR_CYCLE_TIMESTAMP_FUTURE with HTTP 422"
            - "GET /body-art/sterilization-records with establishment_id == ${est_b_id} returns total_count == 0"
            - "GET /body-art/sterilization-records with establishment_id == ${est_a_id} returns total_count == 1"

      - name: logical_clock_must_move_strictly_forward
        claim_type: Temporal validation
        grounds:
          - validations[priority=43]
          - errors[ERR_CLOCK_NOT_MONOTONIC]
          - endpoints["POST /body-art/_clock/set_current_utc"]
        distinguishing_aspect: "The default clock reads 2026-05-01T00:00:00Z; setting it backwards to 2026-04-01 and setting it to the identical current instant both return ERR_CLOCK_NOT_MONOTONIC (409), while a strictly later instant succeeds."
        test_recipe:
          setup:
            - "Empty database with the logical clock at its startup default 2026-05-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /body-art/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { err_back: $.data.error_id }
            - call: "POST /body-art/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { err_same: $.data.error_id }
            - call: "POST /body-art/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { now: $.data.current_utc }
          assert:
            - "${err_back} == ERR_CLOCK_NOT_MONOTONIC with HTTP 409"
            - "${err_same} == ERR_CLOCK_NOT_MONOTONIC with HTTP 409"
            - "${now} == 2026-05-02T00:00:00.000Z"

