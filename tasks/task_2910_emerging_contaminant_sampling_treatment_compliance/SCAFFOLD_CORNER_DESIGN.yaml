            - call: "POST /entry-points/${ep4_id}/monitoring-reduction-decisions"
              payload: { approve: true, decision_note: "Deciding a request that was never opened" }
              as: StateRegulator
              as_user_id: "regulator-1"
              captures: { e_decision_state: "$.data.error_id" }
            - call: "POST /entry-points/${ep_id}/monitoring-reduction-requests"
              payload: { target_status: "ANNUAL", justification: "Posture has returned to compliant" }
