              as: PoolManager
              captures: { p_a_id: $.data.id, p_a_load: $.data.projected_bather_load, p_a_status: $.data.status }
            - call: "POST /swim-club/party-reservations"
              payload: { membership_id: "${m_b_id}", zone: "PAVILION", start_iso: "2027-07-15T16:00:00Z", end_iso: "2027-07-15T20:00:00Z", guest_count: 12, host_party_size: 8 }
