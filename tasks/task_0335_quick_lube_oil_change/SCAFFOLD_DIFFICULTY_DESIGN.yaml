              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_id}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 6000 }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/claim"
