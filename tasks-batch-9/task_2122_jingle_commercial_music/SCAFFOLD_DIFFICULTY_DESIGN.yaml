  - rule_id: non_linear_state_machine
    instances:

      - name: demo_revision_cycle_survives_two_full_rounds
        grounds:
          - state_machines.Demo.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.Demo.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.Demo.SHORTLISTED_to_REVISION_REQUESTED
          - calculations.demo_reservation
          - entities.Demo.fields.revision_count
        distinguishing_aspect: |
          Non-linear shape on the Demo entity: the machine returns to SUBMITTED
          twice through REVISION_REQUESTED, so the same state is entered three
          separate times, and each loop iteration books a further flat surcharge of
          22500 cents on the Project ledger.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; Project budget_cents 4000000 in IN_DEMO"
            - "One Demo 'Sunrise Pop', demo_fee_cents 150000, currently SHORTLISTED, revision_count 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MusicHouseProducer
            - call: "POST /clients"
              payload: { name: "Northwind Beverages", agency_code: "NWB-005", billing_email: "ap@northwind.example" }
              as: MusicHouseProducer
              captures: { cl: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${cl}", title: "Autumn Refresh 2026", budget_cents: 4000000, delivery_deadline_utc: "2026-10-15T00:00:00Z" }
              as: MusicHouseProducer
