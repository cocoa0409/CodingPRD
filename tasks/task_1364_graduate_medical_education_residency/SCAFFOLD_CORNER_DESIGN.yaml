  # ===========================================================================
  # Section: cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_complement_update_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[complement-update-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "PUT with the version captured at creation succeeds; replaying the same captured version after the first PUT bumped it fails 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Program, year, DRAFT complement (version 1 captured at creation)"]
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1055" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id", v1: "$.data.version" } }
          trigger:
            - { call: "PUT /residency-programs/complement-approvals/${comp}", payload: { approved_positions: 5, expected_complement_approval_version: "${v1}" }, as: ProgramDirector, captures: { v2: "$.data.version", ap: "$.data.approved_positions" } }
            - { call: "PUT /residency-programs/complement-approvals/${comp}", payload: { approved_positions: 7, expected_complement_approval_version: "${v1}" }, as: ProgramDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "First PUT (expected 1): 200, approved_positions == 5, version == 2"
            - "Second PUT with the same captured version (stale): 412 ERR_STALE_VERSION; approved_positions stays 5"

      - name: occ_rotation_update_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rotation-update-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Same OCC pattern on the rotation catalog: capacity edit with a pre-edit version is rejected 412 after another edit advanced the version."
        test_recipe:
          setup: ["Program with one ACTIVE rotation (version 1 captured)"]
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1056" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/rotations", payload: { program_id: "${prog}", name: "ICU", min_pgy_level: 1, max_residents_per_block: 2 }, as: ProgramCoordinator, captures: { rot: "$.data.id", v1: "$.data.version" } }
          trigger:
            - { call: "PUT /residency-programs/rotations/${rot}", payload: { max_residents_per_block: 3, expected_rotation_version: "${v1}" }, as: ProgramCoordinator, captures: { v2: "$.data.version" } }
            - { call: "PUT /residency-programs/rotations/${rot}", payload: { max_residents_per_block: 4, expected_rotation_version: "${v1}" }, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "First PUT: 200, max_residents_per_block == 3, version == 2"
            - "Second PUT with stale version: 412 ERR_STALE_VERSION; capacity stays 3"

      - name: occ_regenerate_blocks_stale_and_supersede
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[block-diagram-regenerate-stale-year]
          - state_machines.ScheduleBlock
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Regenerate with the creation version supersedes all 13 original blocks and creates 13 fresh CURRENT ones (year version 1 -> 2); replaying the same version then fails 412, and the superseded blocks remain queryable with status SUPERSEDED."
        test_recipe:
          setup: ["Program with a PLANNING year (version 1 captured; 13 CURRENT blocks)"]
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1057" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id", yv1: "$.data.version" } }
            - { call: "GET /residency-programs/schedule-blocks", payload: { academic_year_id: "${yr}", status: "CURRENT" }, as: ProgramCoordinator, captures: { oldb1: "$.data[0].id" } }
          trigger:
            - { call: "POST /residency-programs/academic-years/${yr}/regenerate-blocks", payload: { expected_academic_year_version: "${yv1}" }, as: ProgramCoordinator, captures: { yv2: "$.data.version" } }
            - { call: "POST /residency-programs/academic-years/${yr}/regenerate-blocks", payload: { expected_academic_year_version: "${yv1}" }, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
            - { call: "GET /residency-programs/schedule-blocks", payload: { academic_year_id: "${yr}", status: "SUPERSEDED" }, as: ProgramCoordinator }
            - { call: "GET /residency-programs/schedule-blocks", payload: { academic_year_id: "${yr}", status: "CURRENT" }, as: ProgramCoordinator, captures: { newb1: "$.data[0].id" } }
          assert:
            - "First regenerate: 200, year version == 2; the original block ${oldb1} now has status SUPERSEDED"
            - "Second regenerate with the stale version: 412 ERR_STALE_VERSION"
            - "13 SUPERSEDED + 13 CURRENT blocks exist; the new block 1 id differs from ${oldb1}"
            - "Regenerate is only legal in PLANNING — after year activation it would fail ERR_ACADEMIC_YEAR_NOT_PLANNING instead"

      - name: derived_program_status_reconciles_on_citation_resolve
        claim_type: derived_field_reconciliation
        grounds: [calculations.program_accreditation_status]
        distinguishing_aspect: "Derived field reconciliation in both directions: SERIOUS citation creation flips the program to CONTINUED_WITH_WARNING; resolving it (via draft -> submit -> resolve) returns the program to CONTINUED without any direct write to accreditation_status."
        test_recipe:
          setup: ["Program exists; one OPEN SERIOUS citation"]
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1058" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id", st0: "$.data.accreditation_status" } }
            - { call: "POST /residency-programs/accreditation-citations", payload: { program_id: "${prog}", citation_code: "IV.A.2", severity: "SERIOUS", area_code: "SUPERVISION", due_date: "2026-12-01" }, as: DesignatedInstitutionalOfficial, captures: { cit: "$.data.id" } }
          trigger:
            - { call: "GET /residency-programs/${prog}", payload: {}, as: DesignatedInstitutionalOfficial, captures: { st1: "$.data.accreditation_status" } }
            - { call: "POST /residency-programs/accreditation-citations/${cit}/draft-response", payload: { response_text: "Supervision plan revised." }, as: ProgramDirector }
            - { call: "POST /residency-programs/accreditation-citations/${cit}/submit-response", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/accreditation-citations/${cit}/resolve", payload: { resolution_note: "Accepted" }, as: DesignatedInstitutionalOfficial }
            - { call: "GET /residency-programs/${prog}", payload: {}, as: DesignatedInstitutionalOfficial, captures: { st2: "$.data.accreditation_status" } }
          assert:
            - "Created CONTINUED; after SERIOUS citation OPEN: CONTINUED_WITH_WARNING; after resolve: CONTINUED again"
            - "accreditation_status was never settable via any write endpoint (computed only)"

      - name: program_status_warning_vs_probationary_threshold
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.program_accreditation_status
        distinguishing_aspect: "Threshold precision on the derived status: exactly 1 unresolved SERIOUS citation yields CONTINUED_WITH_WARNING; the 2nd unresolved SERIOUS flips to PROBATIONARY (>= 2 rule)."
        test_recipe:
          setup: ["Program with one OPEN SERIOUS citation"]
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1059" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/accreditation-citations", payload: { program_id: "${prog}", citation_code: "IV.A.1", severity: "SERIOUS", area_code: "SUPERVISION", due_date: "2026-12-01" }, as: DesignatedInstitutionalOfficial, captures: { c1: "$.data.id" } }
          trigger:
            - { call: "GET /residency-programs/${prog}", payload: {}, as: DesignatedInstitutionalOfficial, captures: { st1: "$.data.accreditation_status" } }
            - { call: "POST /residency-programs/accreditation-citations", payload: { program_id: "${prog}", citation_code: "III.B.3", severity: "SERIOUS", area_code: "DUTY_HOURS", due_date: "2026-12-01" }, as: DesignatedInstitutionalOfficial }
            - { call: "GET /residency-programs/${prog}", payload: {}, as: DesignatedInstitutionalOfficial, captures: { st2: "$.data.accreditation_status" } }
          assert:
            - "1 unresolved SERIOUS: accreditation_status == CONTINUED_WITH_WARNING"
            - "2 unresolved SERIOUS: accreditation_status == PROBATIONARY (threshold is >= 2)"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
