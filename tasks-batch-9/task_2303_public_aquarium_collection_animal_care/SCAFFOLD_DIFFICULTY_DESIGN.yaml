      - call: POST /aquarium/permits/${pm2_id}/submission
        payload: {}
        as: PermitOfficer
      - call: POST /aquarium/permits/${pm2_id}/decisions
        payload: {decision: ISSUE, valid_from: '2026-08-01T00:00:00Z', valid_until: '2027-06-01T00:00:00Z'}
