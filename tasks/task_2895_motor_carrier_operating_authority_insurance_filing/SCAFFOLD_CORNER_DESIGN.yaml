              captures: { count84_after_revoke: $.data.designated_state_count, complete84_after_revoke: $.data.designation_coverage_complete }
          assert:
            - "${count84_after_two} == 2 and ${complete84_after_two} == false"
            - "${count84_full} == 3 and ${complete84_full} == true"
            - "${desig84_tx_status} == 'REVOKED' and ${desig84_tx_revoked_at} == '2026-08-05T00:00:00.000Z'"
            - "${count84_after_revoke} == 2 and ${complete84_after_revoke} == false"
            - "GET /process-agent-designations?authority_id=${auth84_id} returns total_count == 3 while the same query with status=ACTIVE returns total_count == 2 — the revoked row is retained, not deleted"
            - "OperatingAuthority.${auth84_id}.authority_status is still 'PENDING' and suspension_reason == 'NONE' — a PENDING authority is not suspended by a designation gap"

      - name: a_four_hop_cascade_runs_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.OperatingAuthority
          - state_machines.CustomerContract
        excluded_because:
          difficulty_instance: transitive_cascade / filing_cancel_cascades_four_hops_and_mints_a_proceeding
          rationale: "That instance walks filing -> insurance_status -> authority -> contracts -> shipments and asserts every hop plus the minted proceeding."
      - name: both_variants_of_the_risk_score_are_produced
        claim_type: dual_variant_calculation
        grounds:
          - calculations.carrier_compliance_risk_score
        excluded_because:
          difficulty_instance: dual_variant_calc / carrier_risk_score_self_reported_versus_audited_variant
          rationale: "Both variants and the delta on the switch are asserted on one carrier there."
      - name: the_scheduled_new_entrant_audit_executes_when_its_result_is_recorded
        claim_type: scheduled_actions
        grounds:
          - state_machines.SafetyAudit
          - endpoints[POST /operating-authorities/{id}/activate]
        excluded_because:
          difficulty_instance: boundary_precision_check / audit_score_exactly_at_the_failure_threshold_fails_the_audit
          rationale: "The audit deferred by activation is executed there through record-result, with its window, score and downstream authority effects asserted."

  - section: consistency_model
    instances:
      - name: activation_side_effects_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /operating-authorities/{id}/activate]
        distinguishing_aspect: "No denormalised field lags: the activate response itself already carries authority_status ACTIVE, activated_at and new_entrant_audit_status PENDING, and independent reads taken immediately afterwards agree with it field for field — including the carrier's SELF_REPORTED score of 20.65 and the newly scheduled audit."
        test_recipe:
          setup:
            - "one PENDING authority fully eligible at 2026-08-26 whose carrier self-reports 25 vehicles, 30 drivers and an 8.0 percent out-of-service rate"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Guadalupe Mountains Freight LLC", domicile_state: "TX", self_reported_vehicle_count: 25, self_reported_driver_count: 30, self_reported_oos_rate_pct: 8.0 }
              as: RegistryAdmin
              captures: { c90_id: $.data.id }
            - call: "POST /process-agents"
              payload: { company_name: "Gulf Coast Process Agents", coverage_states: ["TX", "OK", "NM"], blanket_agent: false }
              as: RegistryAdmin
              captures: { agent90_id: $.data.id }
            - call: "POST /insurers"
              payload: { company_name: "Permian Mutual Casualty", naic_code: "12345", authorized_states: ["TX", "OK", "NM"] }
              as: RegistryAdmin
              captures: { ins90_id: $.data.id }
            - call: "POST /authority-applications"
              payload: { carrier_id: "${c90_id}", application_kind: "NEW", transportation_type: "FOR_HIRE_PROPERTY", requested_operating_states: ["TX", "OK", "NM"], hazmat_endorsement_requested: false, hazmat_bulk_capable: false }
              as: CarrierRep
              as_user_id: "${c90_id}"
              captures: { app90_id: $.data.id }
            - call: "POST /authority-applications/${app90_id}/submit"
              payload: {}
              as: CarrierRep
              as_user_id: "${c90_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /authority-applications/${app90_id}/vetting-review"
              payload: { disposition: "PUBLISH", findings: "no adverse vetting findings" }
              as: VettingAnalyst
              as_user_id: "staff-va-001"
            - call: "GET /operating-authorities"
              payload: { application_id: "${app90_id}" }
              as: ComplianceOfficer
              as_user_id: "staff-co-002"
              captures: { auth90_id: "$.data[0].id" }
            - call: "POST /operating-authorities/${auth90_id}/process-agent-designations"
              payload: { process_agent_id: "${agent90_id}", state_codes: ["TX", "OK", "NM"], effective_from: "2026-08-05T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${c90_id}"
            - call: "GET /operating-authorities/${auth90_id}"
              payload: {}
              as: InsuranceFiler
              as_user_id: "${ins90_id}"
              captures: { auth90_v1: $.data.version }
            - call: "POST /insurance-filings"
              payload: { authority_id: "${auth90_id}", insurer_id: "${ins90_id}", filing_type: "BIPD", coverage_limit_cents: 75000000, policy_number: "BIPD-90", effective_at: "2026-08-05T00:00:00Z", expected_authority_version: "${auth90_v1}" }
              as: InsuranceFiler
              as_user_id: "${ins90_id}"
            - call: "POST /carriers/${c90_id}/fee-payments"
              payload: { amount_cents: 64791, memo: "docket filing fee" }
              as: CarrierRep
              as_user_id: "${c90_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-26T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /operating-authorities/${auth90_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "staff-co-002"
              captures: { auth90_status: $.data.authority_status, auth90_activated_at: $.data.activated_at, auth90_audit_status: $.data.new_entrant_audit_status, auth90_audit_deadline: $.data.new_entrant_audit_deadline_at }
            - call: "GET /carriers/${c90_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "staff-co-002"
              captures: { c90_reg_status: $.data.unified_registration_status, c90_score: $.data.compliance_risk_score, c90_variant: $.data.compliance_risk_variant, c90_active_count: $.data.active_authority_count }
            - call: "GET /carriers/${c90_id}/safety-audits"
              payload: { status: "SCHEDULED" }
              as: ComplianceOfficer
              as_user_id: "staff-co-002"
              captures: { audit90_id: "$.data[0].id", audit90_opens_at: "$.data[0].audit_window_opens_at" }
            - call: "GET /authority-applications/${app90_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "staff-co-002"
              captures: { app90_status: $.data.status }
          assert:
            - "${auth90_status} == 'ACTIVE', ${auth90_activated_at} == '2026-08-26T00:00:00.000Z', ${auth90_audit_status} == 'PENDING' and ${auth90_audit_deadline} == '2028-02-26T00:00:00.000Z' — all four already in the activate response"
            - "${c90_reg_status} == 'REGISTERED', ${c90_active_count} == 1, ${c90_variant} == 'SELF_REPORTED' and ${c90_score} == 20.65"
            - "${audit90_opens_at} == '2026-08-26T00:00:00.000Z' and SafetyAudit.${audit90_id}.status == 'SCHEDULED' — the audit exists on the very next read"
            - "${app90_status} == 'GRANTED' — the originating application moved in the same request"
            - "no read taken after the activate response disagrees with it: every field above is stable across repeated GETs at the same logical instant"
