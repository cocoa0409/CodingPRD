  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_referential_on_review_submit
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - validations[priority=10]
        distinguishing_aspect: |
          Category pair (state vs business_referential/business_safety): a review
          submitted to a CLOSED page by an author who is ALSO the page's claimed
          owner fails with the page-state error class first — ERR_PAGE_NOT_ACTIVE
          (priority 8, business_referential on page state) still outranks
          ERR_SOLICITATION_SUSPECT (priority 10, business_safety) — but a plain
          state-machine violation on a different endpoint (priority 7) outranks
          both; asserted via two ordered dual-failure probes.
        test_recipe:
          setup:
            - "Clock 2026-09-01; owner UO claims page P1 then P1 is CLOSED by SupportAdmin"
            - "UO (claimed owner) attempts to review own closed page: violates priority 8 (page not ACTIVE) AND priority 10 (owner-authored review)"
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "prio-o@x.com", display_name: "Prio Owner", home_region: "US-CA" }
