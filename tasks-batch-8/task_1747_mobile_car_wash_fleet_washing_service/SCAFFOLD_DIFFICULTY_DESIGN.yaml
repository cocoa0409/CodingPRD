            - "After reschedule: o_status4 == SCHEDULED (cycle leg 2 closes the loop)"
            - "After stop REMOVE: o_back == SCHEDULED (ASSIGNED -> SCHEDULED revert)"
            - "After invoice MARK_PAID: final_status == COMPLETED while final_billing == PAID (billing dimension advanced independently of the lifecycle)"
            - "WashOrder.${order_id}.final_cents == 3000 (contract SEDAN rate, single vehicle, no tier)"

      - name: subscription_pause_cycle_counters
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - calculations.pause_accounting
        distinguishing_aspect: |
          Subscription runs a true cycle ACTIVE -> PAUSED -> ACTIVE -> PAUSED twice, with
          loop counters (pause_count_365d, paused_days_365d) evolving each iteration —
          a cyclic machine on a different entity than WashOrder.
        test_recipe:
          setup:
            - "RETAIL customer, site, vehicle; subscription next_service_date 2026-08-20, clock at 2026-08-01"
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "Retail S", email: "rs@x.com", customer_type: "RETAIL" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "HOME", lot_size_sqft: 5000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "S01", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { veh_id: $.data.id } }
            - { call: "POST /fleet-wash/subscriptions", payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", cadence: "MONTHLY", next_service_date: "2026-08-20" }, as: PlatformAdmin, captures: { sub_id: $.data.id } }
          trigger:
            - { call: "POST /fleet-wash/subscriptions/${sub_id}/events", payload: { event_type: "PAUSE", pause_days: 21 }, as: Customer, as_user_id: "${cust_id}", captures: { st1: $.data.status, pc1: $.data.pause_count_365d } }
            - { call: "POST /fleet-wash/_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/subscriptions/${sub_id}/events", payload: { event_type: "RESUME" }, as: Customer, as_user_id: "${cust_id}", captures: { st2: $.data.status, nsd2: $.data.next_service_date, pd2: $.data.paused_days_365d } }
            - { call: "POST /fleet-wash/subscriptions/${sub_id}/events", payload: { event_type: "PAUSE", pause_days: 30 }, as: Customer, as_user_id: "${cust_id}", captures: { st3: $.data.status, pc3: $.data.pause_count_365d, pd3: $.data.paused_days_365d } }
          assert:
            - "st1 == PAUSED and pc1 == 1 (first loop iteration)"
            - "st2 == ACTIVE and nsd2 == 2026-09-10 (2026-08-20 + 21 closed pause days) and pd2 == 21"
            - "st3 == PAUSED and pc3 == 2 and pd3 == 21 (open pause contributes 0 at pause time: clock 2026-08-22 equals started_at)"
            - "Second PAUSE admitted because pause_count_365d was 1 < 2 and 21 + 30 <= 90"

      - name: damage_claim_branching_fork
        grounds:
