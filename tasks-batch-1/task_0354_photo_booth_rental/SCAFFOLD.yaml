    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID on a protected endpoint"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "authenticated role not permitted for this operation per §1.7"
  - id: ERR_NOT_BOOKING_OWNER
    http: 403
    condition: "Customer acts on a booking whose customer_id != X-User-ID"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "malformed body: missing required field, bad enum, out-of-range number, or event_end <= event_start"
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "Booth.asset_tag or Customer.email already in use"
  - id: ERR_QTY_OUT_OF_RANGE
    http: 422
    condition: "BookingAddOn.qty outside 1..AddOn.max_qty"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target entity not in a state permitting the requested transition"
  - id: ERR_BOOKING_LOCKED
    http: 409
    condition: "add-on line added to a non-DRAFT booking"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_booth_version / expected_eventlog_version does not match the live parent version"
  - id: ERR_BOOTH_INTERVAL_CONFLICT
    http: 409
    condition: "selected Booth's interval claim overlaps an existing claim (with turnaround buffer, half-open)"
  - id: ERR_NO_BOOTH_AVAILABLE
    http: 409
    condition: "no AVAILABLE booth of the package's model survives the overlap filter at confirm"
  - id: ERR_ATTENDANT_INTERVAL_CONFLICT
    http: 409
    condition: "candidate attendant's interval overlaps an ACTIVE assignment (closed, no buffer)"
  - id: ERR_NO_ATTENDANT_AVAILABLE
    http: 409
    condition: "an attendant is required but none is free for the window at confirm"
  - id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http: 422
    condition: "DEPOSIT payment amount != Booking.deposit_due"
  - id: ERR_BALANCE_AMOUNT_MISMATCH
    http: 422
    condition: "BALANCE payment amount != Booking.balance_due"
  - id: ERR_REFUND_AMOUNT_MISMATCH
    http: 422
    condition: "REFUND payment amount != cancellation_refund.refundable_amount"
  - id: ERR_GALLERY_EMPTY
    http: 409
    condition: "gallery publish attempted with photo_count == 0"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Seeds the catalog (booth models, packages, add-ons) and drives the test clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /booth-models"
      - "POST /packages"
      - "POST /add-ons"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across catalog, booths, bookings, payments, event-logs, galleries"

  - name: OperationsManager
    description: "Owns booth/attendant inventory and runs the event lifecycle (confirm, start-service, complete, finalize, gallery)"
    identity: "opaque"
    exclusive_operations:
      - "POST /booths"
      - "PATCH /booths/{id}"
      - "POST /attendants"
      - "POST /bookings/{id}/confirm"
      - "POST /bookings/{id}/start-service"
      - "POST /bookings/{id}/complete"
      - "PATCH /event-logs/{id}"
      - "POST /event-logs/{id}/finalize"
      - "POST /galleries/{id}/photos"
      - "POST /galleries/{id}/publish"
      - "POST /galleries/{id}/unpublish"
    shared_operations:
      - "GET reads across bookings, booths, attendants, event-logs, galleries"

  - name: FinanceClerk
    description: "Owns money movements: deposit, balance, refund, forfeit"
    identity: "opaque"
    exclusive_operations:
      - "POST /bookings/{id}/payments"
      - "POST /bookings/{id}/forfeit"
    shared_operations:
      - "GET reads across bookings, payments, event-logs"

  - name: Customer
    description: "Owns its own bookings: create, add add-ons, cancel, read own data"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /bookings"
      - "POST /bookings/{id}/add-ons"
      - "POST /bookings/{id}/cancel"
    shared_operations:
      - "GET own booking, own add-ons, own galleries, catalog reads"

  - name: Anonymous
    description: "Unauthenticated surface: self-registration and clock read"
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
    shared_operations:
      - "GET /_clock"
