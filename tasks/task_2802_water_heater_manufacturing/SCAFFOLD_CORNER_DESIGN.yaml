      - name: every_declared_role_can_perform_its_shared_reads
        claim_type: shared_operations
        grounds:
          - roles.PlantAdmin.shared_operations
          - roles.PlantOperator.shared_operations
          - roles.QualityInspector.shared_operations
          - roles.ComplianceEngineer.shared_operations
          - roles.CertificationApprover.shared_operations
          - roles.SupplierQualityManager.shared_operations
          - roles.WarrantyAnalyst.shared_operations
          - roles.SupplierRep.shared_operations
        distinguishing_aspect: >
          The mirror image of the exclusivity sweep: an implementation that guards writes correctly often
          over-restricts the read surface, so every one of the eight declared roles must be shown succeeding on a
          read it is declared for - including the entity_backed SupplierRep on its own row and the two approval roles
          on the certification they never wrote. All eight are 200s; none of them may return 403.
        test_recipe:
          setup:
            - "The full chain exists, so one row of every readable entity is available."
            - "Each call below uses a role that IS declared on the route it calls."
            - "The SupplierRep call authenticates as supplier Meridian Controls."
          setup_api_calls:
            - call: "POST /mfg/suppliers"
              payload: { name: "Meridian Controls", component_category: "GAS_VALVE", audit_score: 96, defect_ppm: 1000, open_capa_count: 0 }
              as: SupplierQualityManager
