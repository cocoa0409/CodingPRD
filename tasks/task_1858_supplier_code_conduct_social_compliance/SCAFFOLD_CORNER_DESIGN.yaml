      - name: code_version_retired_transition_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CodeVersion, "errors[ERR_CODE_VERSION_INVALID_STATE]"]
        distinguishing_aspect: "RETIRED is terminal: any further transition returns ERR_CODE_VERSION_INVALID_STATE."
        test_recipe:
          setup: ["Code version DRAFT -> PUBLISHED -> RETIRED"]
          setup_api_calls:
            - { call: "POST /code-versions", payload: { version_label: "CoC v9", effective_from: "2026-01-01T00:00:00Z", zero_tolerance_categories: ["FORCED_LABOR"] }, as: SourcingProgramAdmin, captures: { cv_id: $.data.id } }
