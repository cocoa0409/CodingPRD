            - "Clock advances to 2026-08-08T00:00:00Z. RepairAttempt A1 at 2026-08-05T09:00:00Z then VerificationTest V1 FAIL at 2026-08-06T09:00:00Z (count 1) then RepairAttempt A2 at 2026-08-07T09:00:00Z put E1 back in VERIFICATION_PENDING."
