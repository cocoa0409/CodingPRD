          assert:
            - "fee29 == 0 and due29 == 400000 (29 days overdue < 30-day grace)"
            - "fee30 == 6000 and due30 == 406000 (exactly 30 days => 1 period; round_half_up(400000 * 0.015 * 1))"
            - "pay1 == PAID with paid_amount_cents exactly equal to the fee-inclusive amount_due"
            - "fee60 == 48000 and due60 == 1648000 (60 days => floor(60/30) = 2 periods on principal 1600000)"
            - "pay2 == PAID"
            - "p1_status == SETTLED (payment cascades BILLED -> SETTLED once its only invoice is PAID)"
