  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role, existence, or business check."
        test_recipe:
          setup: ["one customer exists so the GET target itself would resolve"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Auth Probe Co", contact_email: "ap@example.com" }, as: TerminalManager, captures: { c_id: $.data.id } }
          trigger:
            - { call: "GET /customers/${c_id}", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED"
            - "response status == 401"

      - name: nonexistent_allocation_activate_returns_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=6]", "errors[ERR_ALLOCATION_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 5) precedes state (priority 6): activating a nonexistent allocation id returns 404 ERR_ALLOCATION_NOT_FOUND, never a state error."
        test_recipe:
          setup: ["one customer exists (non-empty database)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "404 Probe Co", contact_email: "404@example.com" }, as: TerminalManager }
          trigger:
            - { call: "POST /tank-allocations/11111111-2222-3333-4444-555555555555/activate", payload: {}, as: TerminalOperator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ALLOCATION_NOT_FOUND"
            - "response status == 404"

      - name: window_end_not_after_start_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_WINDOW_INVALID]"]
        distinguishing_aspect: "window_end == window_start (empty interval) violates the strict window_end > window_start rule with 422 ERR_WINDOW_INVALID."
        test_recipe:
          setup: ["ACTIVE lease/allocation/tank"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Window Co", contact_email: "w@example.com" }, as: TerminalManager, captures: { c_id: $.data.id } }
