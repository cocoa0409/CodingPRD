        distinguishing_aspect: |
          Category pair BUSINESS_SAFETY (skill, priority 7) vs BUSINESS_TEMPORAL (overlap, priority 9):
          confirming an assignment for a technician who is BOTH under-skilled for the job's flat-rate work
          AND already double-booked must return ERR_SKILL_INSUFFICIENT (safety wins over temporal).
        test_recipe:
          setup:
            - "Technician skill 1 already has a CONFIRMED assignment 11:00-13:00 on job A. A second job B intends skill-3 work and requests an overlapping window 12:00-14:00 for the same technician."
            - "Note: the job's intended skill is conveyed by a DRAFT estimate line on job B added before confirm; confirm reads the max skill_required across the job's estimate lines."
