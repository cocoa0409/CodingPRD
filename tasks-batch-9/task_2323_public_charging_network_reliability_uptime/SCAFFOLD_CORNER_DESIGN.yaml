        excluded_because:
          difficulty_instance: claim_review_blocked_until_uptime_report_reaches_accepted
          rationale: "That §1.8 instance tests both sides of this cross-entity gate: rejected while the report is SUBMITTED, accepted once the report reaches ACCEPTED."

      - name: overlapping_dispatch_windows_on_one_port_are_refused
        claim_type: temporal_validation
        grounds:
          - validations[priority=15]
          - errors[ERR_DISPATCH_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: dispatch_windows_are_half_open_per_port_so_touching_endpoints_are_allowed
          rationale: "That §1.8 instance pins the half-open semantics of this rule, admitting the touching window and refusing the straddling one."

      - name: overlapping_reporting_periods_on_one_station_are_refused
        claim_type: temporal_validation
        grounds:
          - validations[priority=16]
          - errors[ERR_REPORTING_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: uptime_report_periods_are_closed_per_station_so_adjacent_periods_collide
          rationale: "That §1.8 instance pins the closed-interval semantics of this rule, where an adjacent period collides and a one-minute gap does not."

      - name: outage_detection_timestamp_is_bounded_by_the_clock_and_the_ports_creation
        claim_type: temporal_validation
        grounds:
          - validations[priority=14]
          - errors[ERR_DETECTED_AT_IN_FUTURE]
          - errors[ERR_DETECTED_AT_BEFORE_PORT]
        distinguishing_aspect: "Both temporal bounds are inclusive at the same instant: detected_at equal to the logical clock AND equal to the port's created_at is the only accepted value here, while one second later fails as future-dated and one second earlier fails as pre-dating the port. A half-open reading of either bound rejects the legitimate call."
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default; empty database."
            - "HostSite / Station ST-1 in DRAFT / one ChargingPort DS-1 whose created_at is therefore exactly 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /host-sites"
              payload: { site_code: "HS-1", host_org_name: "Alder Court Retail", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-1", power_class: "DCFC_150", declared_port_count: 1 }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-1", terminal_model: "PT-4" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "OCPP-MIN-01", fault_class: "MINOR", detected_at: "2026-08-01T00:00:01Z" }
              as: NetworkOperator
              captures: { err1: $.data.error_id }
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "OCPP-MIN-01", fault_class: "MINOR", detected_at: "2026-07-31T23:59:59Z" }
              as: NetworkOperator
              captures: { err2: $.data.error_id }
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "OCPP-MIN-01", fault_class: "MINOR", detected_at: "2026-08-01T00:00:00Z" }
              as: NetworkOperator
              captures: { o_id: $.data.id }
          assert:
            - "call 1: HTTP status == 422 and data.error_id == \"ERR_DETECTED_AT_IN_FUTURE\""
            - "call 2: HTTP status == 422 and data.error_id == \"ERR_DETECTED_AT_BEFORE_PORT\""
            - "call 3: HTTP status == 201, OutageEvent.${o_id}.state == DETECTED, detected_at == \"2026-08-01T00:00:00Z\""
            - "GET /charging-ports/${p_id}/outage-events returns exactly 1 row with total_count 1 — neither rejection created a row"

