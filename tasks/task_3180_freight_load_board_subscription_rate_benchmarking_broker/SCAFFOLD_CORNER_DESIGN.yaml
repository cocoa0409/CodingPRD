        distinguishing_aspect: "POST /load-posts is exclusive to BrokerAdmin; a CarrierAdmin caller is rejected 403 ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. Carrier C exists."]
          setup_api_calls:
