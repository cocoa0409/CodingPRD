            - "GET /seasons/${season_id}/episodes returns total_count 1"

      - name: corner_val_insufficient_balance_blocks_sink
        claim_type: Violation → Error
        grounds:
          - validations[priority=34]
          - errors[ERR_INSUFFICIENT_BALANCE]
          - entities.CurrencyAccount.fields.balance_minor
        distinguishing_aspect: |
          A SINK of 1500 against a balance of 1000 is refused with ERR_INSUFFICIENT_BALANCE (422)
          and writes no ledger row, while a SINK of exactly 1000 drains the account to 0 —
          balances may reach zero but never go negative.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE."
            - "Player pb (NA, adult) holds a SOFT_COIN account credited with exactly 1000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /players"
              payload: { handle: "tide_pb", region_code: "NA", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { pb_id: $.data.id }
            - call: "POST /players/${pb_id}/currency-accounts"
              payload: { currency_code: "SOFT_COIN" }
              as: LiveOpsCommander
              captures: { pb_soft_id: $.data.id }
            - call: "POST /currency-accounts/${pb_soft_id}/adjustments"
              payload: { direction: "FAUCET", amount_minor: 1000, source_kind: "COMPENSATION" }
              as: LiveOpsCommander
          trigger:
            - call: "POST /currency-accounts/${pb_soft_id}/adjustments"
              payload: { direction: "SINK", amount_minor: 1500, source_kind: "CRAFTING" }
              as: LiveOpsCommander
              captures: { err: $.data.error_id }
            - call: "POST /currency-accounts/${pb_soft_id}/adjustments"
              payload: { direction: "SINK", amount_minor: 1000, source_kind: "CRAFTING" }
              as: LiveOpsCommander
          assert:
            - "over-sink response status == 422"
            - "over-sink response data.error_id == ERR_INSUFFICIENT_BALANCE"
            - "exact-sink response status == 201"
            - "CurrencyAccount.${pb_soft_id}.balance_minor == 0"
            - "GET /ledger-entries?currency_account_id=${pb_soft_id} returns total_count 2"
            - "Season.${season_id}.gross_sink_minor == 1000"
            - "Season.${season_id}.gross_faucet_minor == 1000"
            - "Season.${season_id}.lifetime_ratio_bp == 10000"

      - name: corner_val_temporal_conflict_detected_at_publish
        claim_type: Temporal validation
        grounds:
          - validations[priority=25]
          - calculations.offer_sku_window_conflict
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / offer_sku_closed_interval_cooldown_conflict"
          rationale: |
            That instance publishes a valid offer and then proves the future-window collision is
            detected at the exact 24-hour cooldown edge and released one second later, which is
            precisely the "valid now but creates a future conflict" claim.

      - name: corner_val_aggregate_limit_exceeded_collectively
        claim_type: Aggregate validation
        grounds:
          - validations[priority=30]
          - calculations.cluster_ccu_overlap_load
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / cluster_ccu_aggregate_overlap_with_end_buffer"
          rationale: |
            Each event there fits the cluster alone while the overlapping trio exceeds capacity,
            and the instance asserts both the rejection and the admissible remainder, covering the
            aggregate-validation pattern end to end.

      - name: corner_val_priority_pair_business_gates
        claim_type: Priority conflict
        grounds:
          - validations[priority=9]
          - validations[priority=33]
          - validations[priority=13]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / purchase_window_closed_beats_minor_spend_cap"
          rationale: |
            Both priority_pair_validation_conflict instances already pin the surviving error for a
            doubly-violating request (window versus minor spend cap, and missing disclosure versus
            SKU window conflict) and assert the losing code is absent.

  # ===========================================================================
  - section: endpoints
    instances:
      - name: corner_ep_standard_crud_offer_create_read_list
        claim_type: Standard CRUD
        grounds:
          - endpoints["POST /offers"]
          - endpoints["GET /offers/{offer_id}"]
          - endpoints["GET /offers"]
        distinguishing_aspect: |
          The create/read/list trio round-trips one offer: POST returns 201 with the computed
          fairness index, GET by id returns the identical stored row, and the filtered list
          GET /offers?season_id=&approval_status=DRAFT returns exactly that offer.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE."
            - "One DRAFT offer READ_PACK (BUNDLE, T1, list 1000, declared 1400) and one unrelated DRAFT offer OTHER_PACK exist in the same season."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
          trigger:
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "BUNDLE", sku: "READ_PACK", price_tier: "T1", list_price_minor: 1000, line_items: [{ sku: "READ_COINS", base_price_minor: 1000, declared_value_minor: 1400, granted_currency_code: "SOFT_COIN", granted_amount_minor: 1400 }], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { read_id: $.data.id, read_fairness: $.data.fairness_index_bp }
            - call: "GET /offers/${read_id}"
              payload: {}
              as: EconomyDesigner
              as_user_id: "u_designer_1"
            - call: "GET /offers"
              payload: { season_id: "${season_id}", offer_type: "BUNDLE", limit: 10, offset: 0 }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { listed_id: "$.data[0].id" }
          assert:
            - "create response status == 201"
            - "create response data.fairness_index_bp == 14000"
            - "create response data.approval_status == DRAFT"
            - "create response data.availability_status == OFFLINE"
            - "create response data.version == 1"
            - "GET by id response status == 200 and data.sku == READ_PACK"
            - "GET by id response data.fairness_index_bp == 14000"
            - "list response total_count == 1 and has_more == false"
            - "list response data[0].id == ${read_id}"

      - name: corner_ep_action_endpoint_cluster_drain_gate
        claim_type: Action endpoint
        grounds:
          - endpoints["POST /capacity-clusters/{cluster_id}/status"]
          - endpoints["POST /live-events/{event_id}/approve"]
          - errors[ERR_CLUSTER_NOT_ACTIVE]
          - state_machines.CapacityCluster.ACTIVE_to_DRAINING
        distinguishing_aspect: |
          Draining a cluster bumps its version and immediately blocks new approvals with
          ERR_CLUSTER_NOT_ACTIVE (409); returning it to ACTIVE lets the very same approval
          succeed and reserve 6000 CCU, so the gate tracks the cluster's live status only.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE."
            - "Cluster NA-1 ACTIVE, ccu_capacity 10000, buffer 30 minutes."
            - "LiveEvent EVT_DRAIN is PLANNED on that cluster for 2026-08-05T00:00:00Z -> 2026-08-05T02:00:00Z with forecast 6000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /capacity-clusters"
              payload: { name: "NA-1", region_code: "NA", ccu_capacity: 10000, maintenance_buffer_minutes: 30 }
              as: LiveOpsCommander
              captures: { cluster_id: $.data.id, cluster_v1: $.data.version }
            - call: "POST /live-events"
              payload: { season_id: "${season_id}", capacity_cluster_id: "${cluster_id}", code: "EVT_DRAIN", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-05T02:00:00Z", forecast_ccu: 6000 }
              as: ContentProducer
              captures: { evt_id: $.data.id }
          trigger:
            - call: "POST /capacity-clusters/${cluster_id}/status"
              payload: { to_status: "DRAINING" }
              as: LiveOpsCommander
            - call: "POST /live-events/${evt_id}/approve"
              payload: {}
              as: LiveOpsCommander
              captures: { err: $.data.error_id }
            - call: "POST /capacity-clusters/${cluster_id}/status"
              payload: { to_status: "ACTIVE" }
              as: LiveOpsCommander
            - call: "POST /live-events/${evt_id}/approve"
              payload: {}
              as: LiveOpsCommander
          assert:
            - "drain response status == 200 and data.status == DRAINING"
            - "blocked approval response status == 409"
            - "blocked approval response data.error_id == ERR_CLUSTER_NOT_ACTIVE"
            - "LiveEvent.${evt_id}.status == PLANNED immediately after the blocked approval"
            - "CapacityCluster.${cluster_id}.reserved_ccu == 0 immediately after the blocked approval"
            - "resume response data.status == ACTIVE"
            - "second approval response status == 200"
            - "LiveEvent.${evt_id}.status == APPROVED"
            - "LiveEvent.${evt_id}.reserved_ccu_at_approval == 0"
            - "CapacityCluster.${cluster_id}.reserved_ccu == 6000"
            - "CapacityCluster.${cluster_id}.version == 3"

      - name: corner_ep_bulk_action_release_skips_frozen_accounts
