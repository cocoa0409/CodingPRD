        claim_type: immediate
        grounds: [entities.Booking.fields.status, endpoints]
        distinguishing_aspect: "immediate model: a booking create response already carries final status BOOKED, the session's booked_count is updated, and the member credit is debited (8 -> 7) in the same request."
