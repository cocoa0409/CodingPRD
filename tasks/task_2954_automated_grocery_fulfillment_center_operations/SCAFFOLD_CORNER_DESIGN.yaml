            - call: "POST /pick-tasks/${task_id}/assign-tote"
              payload: { tote_id: "${tote_id}" }
              as: PickOperator
              as_user_id: "picker-1"
            - call: "POST /pick-tasks/${task_id}/start-retrieval"
              as: PickOperator
              as_user_id: "picker-1"
            - call: "POST /pick-tasks/${task_id}/complete"
              payload: { picked_units: 1 }
              as: PickOperator
              as_user_id: "picker-1"
            - call: "GET /substitution-proposals"
              payload: { order_line_id: "${line_id}", limit: 10, offset: 0 }
              as: PickOperator
              as_user_id: "picker-1"
              captures: { proposal_id: "$.data[0].id" }
          trigger:
            - call: "POST /order-lines/${line_id}/accept-shortage"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /order-lines/${line_id}/accept-shortage"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the first accept-shortage returns HTTP status == 200"
            - "OrderLine.${line_id}.line_status == CANCELLED"
            - "OrderLine.${line_id}.substitution_resolution == SHORTAGE_ACCEPTED"
            - "SubstitutionProposal.${proposal_id}.status == EXPIRED"
            - "CustomerOrder.${order_id}.open_substitution_count == 0"
            - "CustomerOrder.${order_id}.dispatch_blocked == false"
            - "CustomerOrder.${order_id}.merchandise_subtotal_cents == 0"
            - "CustomerOrder.${order_id}.delivery_fee_cents == 599"
            - "CustomerOrder.${order_id}.order_total_cents == 599"
            - "CustomerOrder.${order_id}.billing_status == ADJUSTED"
            - "CustomerOrder.${order_id}.authorized_amount_cents == 1999"
            - "DeliveryWave.${wave_id}.posture == OPEN"
            - "the second accept-shortage returns HTTP status == 409 and ${err} == ERR_LINE_NOT_SHORT"
            - "OrderLine.${line_id}.substitution_resolution is still SHORTAGE_ACCEPTED and CustomerOrder.${order_id}.order_total_cents is still 599"

      # ---- side-effect-pattern rows already owned by the depth probe (§1.8) ----
      # The guide's "Bubble up" row has no subject in this scaffold: no parent entity
      # auto-transitions when its children all reach a terminal state. DeliveryWave
      # PICKING -> CONSOLIDATED is operator-triggered and merely *guards* on all
      # PickTasks being terminal, which is the "guarded transitions" row instead.
      - name: cyclic_shape_tote_seal_unseal_loop_excluded
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Tote[OPEN -> SEALED]
          - state_machines.Tote[SEALED -> OPEN]
        excluded_because:
          difficulty_instance: non_linear_state_machine / tote_reseal_after_unseal_repeats_the_cycle
          rationale: "The OPEN -> SEALED -> OPEN -> SEALED loop and its station-slot accounting on each lap are the whole subject of the named §1.8 instance."
      - name: cascade_down_short_pick_to_wave_posture_excluded
        claim_type: cascade_down
        grounds:
          - state_machines.OrderLine[PENDING -> SHORT]
          - calculations.wave_posture
        excluded_because:
          difficulty_instance: transitive_cascade / short_pick_cascade_to_wave_posture
          rationale: "The four-hop task -> line -> order -> wave cascade is asserted hop by hop in the named §1.8 instance."
      - name: cross_entity_dispatch_block_reaches_the_wave_excluded
        claim_type: cross_entity
        grounds:
          - state_machines.DeliveryWave[CONSOLIDATED -> LOADING]
          - errors.ERR_ORDER_DISPATCH_BLOCKED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / wave_loading_blocked_by_dispatch_blocked_member_order
          rationale: "The named §1.8 instance is exactly the A-changes-B check: a member order's dispatch_blocked flag decides the wave's transition."
      - name: ledger_sync_slot_capacity_excluded
        claim_type: ledger_sync
        grounds:
          - calculations.slot_capacity_ledger
          - state_machines.SlotBooking[HELD -> CONFIRMED]
        excluded_because:
          difficulty_instance: compensating_invariant / slot_capacity_conserved_across_book_and_cancel
          rationale: "held/confirmed/available reconciliation before and after every booking mutation is the named §1.8 instance's assertion set."
      - name: compensation_sku_allocation_release_excluded
        claim_type: compensation
        grounds:
          - calculations.sku_unit_ledger
          - state_machines.PickTask[QUEUED -> CANCELLED]
        excluded_because:
          difficulty_instance: compensating_invariant / sku_on_hand_conserved_across_allocation_and_cancel
          rationale: "The undo path — cancelling an allocation restores allocated_units and on_hand_units with zero drift — is the named §1.8 instance."
      - name: guarded_transition_retrieval_requires_operational_zone_excluded
        claim_type: guarded_transitions
        grounds:
          - state_machines.PickTask[QUEUED -> RETRIEVING]
          - errors.ERR_ZONE_NOT_OPERATIONAL
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / pick_task_retrieval_blocked_by_zone_maintenance
          rationale: "'A -> B only if entity C is in state X' is instantiated by the named §1.8 instance, which gates start-retrieval on GridZone.status."

  - section: calculations
    # Rows discharged elsewhere in this same file, so no stub is emitted for them:
    #   * chronological (slot_waitlist_promotion) -> release_capacity_promotes_at_most_one_waitlisted_booking
    #   * constraint_propagation (wave_posture)   -> zone_maintenance_freezes_the_wave_then_completion_reopens_it
    #   * weighted_scoring (substitute_sku_selector) -> propose_then_approve_returns_the_short_line_to_pending_and_reprices_it
    # Rows with no subject: forward_looking, projection, decay_function -- no calculation declares those algorithms.
    instances:
      - name: surge_utilization_tiers_are_inclusive_at_060_and_085
        claim_type: tiered_pricing
        grounds:
          - calculations.slot_surge_multiplier
          - global_constants.SURGE_FLOOR
          - entities.SlotBooking.surge_multiplier_at_booking
          - entities.SlotBooking.quoted_fee_cents
        distinguishing_aspect: "Both utilization tiers are >= comparisons, so 11/20 = 0.55 stays at 1.00, exactly 12/20 = 0.60 lifts the slot to 1.15 and exactly 17/20 = 0.85 lifts it to 1.35. Because the freeze happens BEFORE the ledger recompute, the booking that pushes utilization onto a boundary is quoted at the OLD multiplier: b2 still pays 599 while b3, booked afterwards, pays round_half_up(599 * 1.15) = 689."
        test_recipe:
          setup:
            - "Clock at the boot default 2026-08-01T00:00:00.000Z. Route R1 with base_delivery_fee_cents 599, AMBIENT zone A1, AMBIENT SKU AMB-1 at 700 cents with 100 units, and a slot on R1 for 2026-08-05T10:00:00.000Z-12:00:00.000Z with total_capacity_units 20 and withheld_units 0 (lead_hours 106 so lead_add is 0, and no wave exists on the route so congestion_add is 0)."
            - "One BASIC customer owns three orders, each holding a single 2-unit AMB-1 line (provisional 1400, above the 1000-cent minimum)."
          setup_api_calls:
            - call: "POST /delivery-routes"
              payload: { route_code: "R1", service_area_name: "North", van_capacity_totes: 40, base_delivery_fee_cents: 599, per_km_cost_cents: 150 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { route_id: $.data.id }
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_amb: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-1", name: "Pasta", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 100 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { sku_id: $.data.id }
            - call: "POST /delivery-slots"
              payload: { route_id: "${route_id}", window_start: "2026-08-05T10:00:00.000Z", window_end: "2026-08-05T12:00:00.000Z", total_capacity_units: 20, withheld_units: 0 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { slot_id: $.data.id }
            - call: "POST /customer-accounts"
              payload: { email: "a@example.com", full_name: "Ada Lane", loyalty_tier: "BASIC", home_route_id: "${route_id}" }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { stop_distance_km: 5 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_1: $.data.id }
            - call: "POST /customer-orders/${order_1}/lines"
              payload: { sku_id: "${sku_id}", ordered_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /customer-orders"
              payload: { stop_distance_km: 6 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_2: $.data.id }
            - call: "POST /customer-orders/${order_2}/lines"
              payload: { sku_id: "${sku_id}", ordered_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /customer-orders"
              payload: { stop_distance_km: 7 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_3: $.data.id }
            - call: "POST /customer-orders/${order_3}/lines"
              payload: { sku_id: "${sku_id}", ordered_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /customer-orders/${order_1}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { v1: $.data.version }
            - call: "GET /customer-orders/${order_2}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { v2: $.data.version }
            - call: "GET /customer-orders/${order_3}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { v3: $.data.version }
          trigger:
            - call: "POST /slot-bookings"
              payload: { delivery_slot_id: "${slot_id}", customer_order_id: "${order_1}", units: 11, expected_order_version: "${v1}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_1: $.data.id }
            - call: "POST /slot-bookings"
              payload: { delivery_slot_id: "${slot_id}", customer_order_id: "${order_2}", units: 1, expected_order_version: "${v2}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_2: $.data.id }
            - call: "POST /slot-bookings"
              payload: { delivery_slot_id: "${slot_id}", customer_order_id: "${order_3}", units: 5, expected_order_version: "${v3}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_3: $.data.id }
          assert:
            - "after booking_1: DeliverySlot.${slot_id}.held_units == 11 and available_units == 9 and surge_multiplier == 1.00 (utilization 0.55)"
            - "SlotBooking.${booking_1}.surge_multiplier_at_booking == 1.00 and quoted_fee_cents == 599"
            - "after booking_2: DeliverySlot.${slot_id}.held_units == 12 and available_units == 8 and surge_multiplier == 1.15 (utilization exactly 0.60)"
            - "SlotBooking.${booking_2}.surge_multiplier_at_booking == 1.00 and quoted_fee_cents == 599"
            - "after booking_3: DeliverySlot.${slot_id}.held_units == 17 and available_units == 3 and surge_multiplier == 1.35 (utilization exactly 0.85)"
            - "SlotBooking.${booking_3}.surge_multiplier_at_booking == 1.15 and quoted_fee_cents == 689"
            - "DeliverySlot.${slot_id}.confirmed_units == 0 and withheld_units == 0"
            - "CustomerOrder.${order_1}.delivery_fee_cents == 599 and order_total_cents == 1999"
            - "CustomerOrder.${order_2}.delivery_fee_cents == 599 and order_total_cents == 1999"
            - "CustomerOrder.${order_3}.delivery_fee_cents == 689 and order_total_cents == 2089"
            - "SlotBooking.${booking_1}.status == HELD and SlotBooking.${booking_2}.status == HELD and SlotBooking.${booking_3}.status == HELD"

      - name: surge_congestion_add_caps_at_three_active_waves
        claim_type: constants_applied
        grounds:
          - calculations.slot_surge_multiplier
          - global_constants.SURGE_CEILING
          - global_constants.SURGE_FLOOR
        distinguishing_aspect: "congestion_add is 0.05 * min(3, route_active_wave_count), so the fourth FORMING wave on the route adds nothing: with utilization 0.90 (+0.35) and lead_hours 6 (+0.20) the multiplier is 1.00 + 0.35 + 0.20 + 0.15 = 1.70 at both three and four active waves. The booking that produced that utilization nevertheless froze the stale stored 1.20 (lead only), because POST /delivery-waves is not one of slot_surge_multiplier's declared triggers -- creating a wave never rewrites a slot's surge_multiplier."
        test_recipe:
          setup:
            - "Clock at the boot default 2026-08-01T00:00:00.000Z. Route R1 (base fee 599), AMBIENT zone A1, AMBIENT SKU AMB-1 at 700 cents with 100 units, and a slot on R1 for 2026-08-01T06:00:00.000Z-08:00:00.000Z (lead_hours 6, so lead_add 0.20) with total_capacity_units 10 and withheld_units 0."
            - "Three further slots on R1 each carry one FORMING wave (W1, W2, W3), because at most one DeliveryWave may exist per delivery_slot_id; route_active_wave_count is therefore 3 and congestion_add is 0.15. A fourth spare slot is prepared for the trigger's W4."
            - "A BASIC customer owns one order with a single 2-unit AMB-1 line."
