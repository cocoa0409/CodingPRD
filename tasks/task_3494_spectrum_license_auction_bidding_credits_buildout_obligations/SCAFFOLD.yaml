# =============================================================================
# SCAFFOLD.yaml — Spectrum License Auction Bidding, Credits & Buildout
# Obligations (FCC-style). §1.0–§1.7.
# Sibling files: SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8),
# SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  Spectrum License Auction Bidding, Credits & Buildout Obligations (Federal Communications Commission): band planning with license area definition, block sizes and technical rules established before an auction, applicant qualification with ownership disclosure, upfront payments determining bidding eligibility and anti-collusion rules during the quiet period, clock auction design with bidding rounds, activity requirements and price increments across categories, bidding credits for small businesses and rural providers with attribution rules and unjust enrichment repayment on early transfer, assignment phase determining specific frequency blocks after clock rounds, license grant with buildout milestones, penalties for failure and license termination provisions, secondary market transfers, leasing and license renewal review, incumbent relocation and clearing coordination

domain_name: spectrum-license-auction
api_prefix: /spectrum-auctions

complexity_profile:
  primary_archetype: quota_allocation        # finite per-area block supply competed for, won, returned on termination
  secondary_archetype: compliance_audit      # quiet period anti-collusion, unjust enrichment, buildout milestones
  complexity_layers:
    - optimistic_concurrency                 # OCC on Applicant.version (disclosure) and BuildoutMilestone.version (filings)
    - cascading_side_effects                 # milestone miss -> license termination -> transfer denial + supply restore
    - dual_variant_calculation               # provisional vs final settlement; proportional vs equal relocation shares
    - rate_threshold_triggers                # tiered price increments; stage-based activity requirement
  entity_topology: flat                      # all resources top-level, FK-linked; URLs flat under api_prefix
  state_machine_shape: cyclic                # pause/resume, correction, refile, info-request, dispute and renewal loops
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties          # AuctionAdmin runs the auction; TransferReviewer alone adjudicates transfers/renewals
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# All entities are FLAT (parent: null) and interlinked by FK fields.
# common_fields: true => id (server-minted UUID, identity only), created_at,
# updated_at (ISO 8601 UTC, 3 fractional digits), version (int, starts 1,
# +1 on every mutation including cascaded side effects).
# All domain datetimes render exactly as the logical clock reads
# (ISO 8601 UTC as set by /_clock/set_current_utc).
# =============================================================================
entities:
  - name: BandPlan
    parent: null
    common_fields: true
    fields:
      - { name: band_name, type: string, source: input, description: "Human-readable band name (e.g. '3.55 GHz CBRS-like band')" }
      - { name: frequency_start_mhz, type: number, source: input, description: "Lower edge of the band in MHz; must be < frequency_end_mhz" }
      - { name: frequency_end_mhz, type: number, source: input, description: "Upper edge of the band in MHz" }
      - { name: technical_rules, type: string, source: input, description: "Free-text technical rules summary (power limits, out-of-band emission masks)" , default: "" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED (terminal). Areas/blocks only addable while DRAFT; auctions require PUBLISHED." }
  - name: LicenseArea
    parent: null
    common_fields: true
    fields:
      - { name: band_plan_id, type: string, source: input, description: "FK -> BandPlan.id; plan must be DRAFT at creation time" }
      - { name: area_code, type: string, source: input, description: "Short area code (e.g. 'PEA001'); unique within band_plan_id (ERR_DUPLICATE_AREA_CODE)" }
      - { name: name, type: string, source: input, description: "Area display name" }
      - { name: population, type: integer, source: input, description: "Area population; must be >= 1; drives bidding units and coverage math" }
  - name: LicenseBlock
    parent: null
    common_fields: true
    fields:
      - { name: band_plan_id, type: string, source: input, description: "FK -> BandPlan.id; plan must be DRAFT at creation time" }
      - { name: category, type: enum, source: input, description: "CATEGORY_A | CATEGORY_B | CATEGORY_C | CATEGORY_D; unique within band_plan_id (ERR_DUPLICATE_BLOCK_CATEGORY)" }
      - { name: mhz_size, type: integer, source: input, description: "Block bandwidth in MHz (integer, >= 1)" }
      - { name: supply_per_area, type: integer, source: input, description: "How many licenses of this category exist in EACH license area (>= 1)" }
      - { name: price_per_mhz_pop_cents, type: integer, source: input, description: "Opening-price coefficient in cents per MHz-pop (>= 0)" }
  - name: Auction
    parent: null
    common_fields: true
    fields:
      - { name: band_plan_id, type: string, source: input, description: "FK -> BandPlan.id; plan must be PUBLISHED" }
      - { name: name, type: string, source: input, description: "Auction display name" }
      - { name: application_deadline, type: datetime, source: input, description: "ISO 8601 UTC; quiet period cannot begin before this instant" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPLICATION_OPEN | QUIET_PERIOD | CLOCK_ACTIVE | CLOCK_PAUSED | ASSIGNMENT_PHASE | CLOSED (terminal)" }
      - { name: current_round_number, type: integer, source: system, default: 0, description: "Round number of the most recently created ClockRound; 0 before clock start" }
      - { name: total_proceeds_cents, type: integer, source: system, default: 0, description: "Sum of per-license net_price_cents, rounded per license FIRST then summed (pinned rounding order); set at COMPLETE_ASSIGNMENT" }
      - { name: forfeited_deposits_cents, type: integer, source: system, default: 0, description: "Cumulative upfront deposits forfeited via disqualification or payment-deadline cancellation" }
      - { name: available_supply, type: array, source: system, description: "Array of {area_code, category, available} initialized at START_CLOCK from LicenseBlock.supply_per_area; decremented at license creation, incremented on license CANCELLED/TERMINATED" }
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: auction_id, type: string, source: input, description: "FK -> Auction.id; auction must be APPLICATION_OPEN at creation" }
      - { name: legal_name, type: string, source: input, description: "Applicant legal name" }
      - { name: claims_small_business, type: boolean, source: input, description: "Claims tiered small-business bidding credit" }
      - { name: claims_rural_credit, type: boolean, source: input, description: "Claims rural-provider bidding credit; mutually exclusive with claims_small_business (ERR_CREDIT_CLAIM_CONFLICT at QUALIFY)" }
      - { name: own_annual_revenue_cents, type: integer, source: input, description: "Applicant's own average annual gross revenue in cents (>= 0)" }
      - { name: service_population, type: integer, source: input, description: "Population of the applicant's intended rural service area; rural credit requires <= RURAL_SERVICE_POPULATION_CAP" }
      - { name: ownership_interests, type: array, source: input, description: "Array of {holder_name, stake_pct (number), holder_annual_revenue_cents (integer)}; stake_pct values must sum to exactly 100 whenever the array is supplied (ERR_OWNERSHIP_TOTAL_INVALID)" }
      - { name: attributable_revenue_cents, type: integer, source: computed, description: "Computed at QUALIFY: own_annual_revenue_cents + sum of holder_annual_revenue_cents over interests with stake_pct STRICTLY > ATTRIBUTABLE_STAKE_PCT (25)" }
      - { name: credit_pct, type: integer, source: computed, default: 0, description: "Computed at QUALIFY: tiered small-business pct by attributable_revenue_cents, or RURAL_CREDIT_PCT; 0 when no credit qualifies. Client-supplied values are ignored everywhere." }
      - { name: upfront_paid_cents, type: integer, source: system, default: 0, description: "Cumulative upfront payments received" }
      - { name: upfront_held_cents, type: integer, source: system, default: 0, description: "Portion of upfront still held (not refunded, not forfeited)" }
      - { name: upfront_refunded_cents, type: integer, source: system, default: 0, description: "Portion refunded on withdrawal" }
      - { name: upfront_forfeited_cents, type: integer, source: system, default: 0, description: "Portion forfeited via disqualification or payment-deadline default" }
      - { name: eligibility_units, type: integer, source: computed, default: 0, description: "Live bidding eligibility in MHz-pop units; floor(upfront_held_cents / UPFRONT_CENTS_PER_ELIGIBILITY_UNIT), then mutated downward by the activity rule at round close" }
      - { name: initial_eligibility_units, type: integer, source: system, default: 0, description: "Snapshot of eligibility_units at START_CLOCK" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | NEEDS_CORRECTION | QUALIFIED | REJECTED | DISQUALIFIED | WITHDRAWN" }
  - name: ClockRound
    parent: null
    common_fields: true
    fields:
      - { name: auction_id, type: string, source: system, description: "FK -> Auction.id" }
      - { name: round_number, type: integer, source: system, description: "1-based; round 1 created by START_CLOCK" }
      - { name: stage, type: integer, source: computed, description: "1 when round_number < STAGE2_START_ROUND else 2; selects activity requirement" }
      - { name: prices, type: array, source: system, description: "Array of {area_code, category, price_cents} for products still open for bidding; round 1 uses opening prices; later rounds apply the tiered increment rule; products whose demand < supply are EXCLUDED (closed)" }
      - { name: aggregate_demand, type: array, source: system, description: "Array of {area_code, category, demand_quantity}; maintained LIVE on bid create/void while OPEN, finalized at close" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED" }
  - name: Bid
    parent: null
    common_fields: true
    fields:
      - { name: round_id, type: string, source: system, description: "FK -> ClockRound.id (from path)" }
      - { name: bidder_applicant_id, type: string, source: system, description: "FK -> Applicant.id; always equals the caller's X-User-ID" }
      - { name: area_code, type: string, source: input, description: "LicenseArea.area_code within the auction's band plan (product axis 1)" }
      - { name: category, type: string, source: input, description: "LicenseBlock.category within the auction's band plan (product axis 2)" }
      - { name: quantity, type: integer, source: input, description: "Number of licenses demanded, 1 <= quantity <= supply_per_area" }
      - { name: units_snapshot, type: integer, source: computed, description: "quantity * mhz_size * area.population captured at bid time; feeds activity math" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | PROCESSED (round closed) | VOIDED (bidder disqualified while round OPEN)" }
  - name: AssignmentBid
    parent: null
    common_fields: true
    fields:
      - { name: auction_id, type: string, source: system, description: "FK -> Auction.id (from path)" }
      - { name: bidder_applicant_id, type: string, source: system, description: "FK -> Applicant.id; must be a recorded winner of the referenced product (ERR_NOT_A_WINNER)" }
      - { name: area_code, type: string, source: input, description: "Product area_code the caller won in the final clock round" }
      - { name: category, type: string, source: input, description: "Product category the caller won" }
      - { name: amount_cents, type: integer, source: input, description: "Sealed assignment bid, >= 0; applies PER LICENSE won" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPLIED (at COMPLETE_ASSIGNMENT)" }
  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: auction_id, type: string, source: system, description: "FK -> Auction.id" }
      - { name: area_id, type: string, source: system, description: "FK -> LicenseArea.id" }
      - { name: area_code, type: string, source: system, description: "Denormalized LicenseArea.area_code (display/joining convenience; not an FK)" }
      - { name: category, type: string, source: system, description: "LicenseBlock.category" }
      - { name: frequency_block_index, type: integer, source: system, description: "0-based specific frequency block within (area, category); assigned at COMPLETE_ASSIGNMENT by assignment ranking" }
      - { name: holder_applicant_id, type: string, source: system, description: "FK -> Applicant.id; rewritten on approved FULL_ASSIGNMENT transfer" }
      - { name: credit_pct, type: integer, source: system, description: "Credit percentage copied from the winning Applicant at license creation; unchanged thereafter" }
      - { name: gross_clock_price_cents, type: integer, source: system, description: "Final clock-round posted price for this product" }
      - { name: assignment_bid_cents, type: integer, source: system, description: "Winning assignment bid amount applied to this license (0 if none)" }
      - { name: gross_final_price_cents, type: integer, source: computed, description: "gross_clock_price_cents + assignment_bid_cents" }
      - { name: provisional_net_price_cents, type: integer, source: computed, description: "PROVISIONAL variant: round_half_up(gross_clock_price_cents * (100 - credit_pct) / 100); assignment-invariant" }
      - { name: net_price_cents, type: integer, source: computed, description: "FINAL variant: round_half_up(gross_final_price_cents * (100 - credit_pct) / 100); the settlement amount due" }
      - { name: credit_amount_cents, type: integer, source: computed, description: "gross_final_price_cents - net_price_cents; the dollar value of the bidding credit, basis for unjust enrichment" }
      - { name: paid_cents, type: integer, source: system, default: 0, description: "Cumulative settlement payments" }
      - { name: grant_date, type: datetime, source: system, description: "Logical-clock instant the license became ACTIVE; null while PENDING_PAYMENT" }
      - { name: term_end, type: datetime, source: computed, description: "grant_date + LICENSE_TERM_DAYS days; extended by RENEWAL_EXTENSION_DAYS on renewal grant; null until grant" }
      - { name: payment_deadline, type: datetime, source: system, description: "created_at + PAYMENT_DEADLINE_DAYS days; lapse auto-cancels the license" }
      - { name: active_lease_start, type: datetime, source: system, description: "Start of the currently approved lease window; null when no active lease" }
      - { name: active_lease_end, type: datetime, source: system, description: "End of the currently approved lease window; cleared by clock sweep when < now" }
      - { name: leased_to_applicant_id, type: string, source: system, description: "Applicant.id of current lessee; null when no active lease" }
      - { name: relocation_share_owed_cents, type: integer, source: system, default: 0, description: "Binding proportional relocation-cost share posted when an incumbent in this license's area confirms CLEARED" }
      - { name: status, type: enum, source: system, description: "PENDING_PAYMENT | ACTIVE | RENEWAL_REVIEW | TERMINATED (terminal) | CANCELLED (terminal)" }
  - name: BuildoutMilestone
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> License.id" }
      - { name: milestone_type, type: enum, source: system, description: "INTERIM (due grant + INTERIM_MILESTONE_DAYS, requires INTERIM_COVERAGE_PCT) | FINAL (due grant + FINAL_MILESTONE_DAYS, requires FINAL_COVERAGE_PCT)" }
      - { name: due_date, type: datetime, source: system, description: "grant_date + milestone days; FINAL due_date is accelerated by INTERIM_MISS_ACCELERATION_DAYS when the INTERIM milestone goes MISSED" }
      - { name: required_coverage_pct, type: integer, source: system, description: "40 for INTERIM, 70 for FINAL (copied from constants at creation)" }
      - { name: covered_population, type: integer, source: input, description: "Population the licensee certifies as covered; null until first filing" }
      - { name: status, type: enum, source: system, description: "PENDING | FILED | ACCEPTED | REJECTED | MISSED (terminal)" }
  - name: TransferApplication
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> License.id (from path)" }
      - { name: transferor_applicant_id, type: string, source: system, description: "FK -> Applicant.id; the license holder at filing time" }
      - { name: transferee_applicant_id, type: string, source: input, description: "FK -> Applicant.id; any existing Applicant (any auction)" }
      - { name: transfer_type, type: enum, source: input, description: "FULL_ASSIGNMENT | LEASE" }
      - { name: lease_start, type: datetime, source: input, description: "Required iff transfer_type == LEASE; half-open window [lease_start, lease_end)" }
      - { name: lease_end, type: datetime, source: input, description: "Required iff transfer_type == LEASE; must be > lease_start (ERR_LEASE_DATES_INVALID)" }
      - { name: unjust_enrichment_cents, type: integer, source: computed, description: "Repayment due if the license carried a bidding credit and the transfer is early or the transferee is less credit-eligible; computed at filing from the logical clock" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | INFO_REQUESTED | APPROVED | DENIED | WITHDRAWN" }
  - name: Incumbent
    parent: null
    common_fields: true
    fields:
      - { name: band_plan_id, type: string, source: input, description: "FK -> BandPlan.id" }
      - { name: area_id, type: string, source: input, description: "FK -> LicenseArea.id; the area this incumbent occupies" }
      - { name: callsign, type: string, source: input, description: "Incumbent station callsign" }
      - { name: relocation_cost_cents, type: integer, source: input, description: "Estimated relocation cost in cents (>= 0)" }
      - { name: transition_window_start, type: datetime, source: system, description: "Set at BEGIN_RELOCATION; closed interval semantics with INCUMBENT_TRANSITION_BUFFER_DAYS gap rule" }
      - { name: transition_window_end, type: datetime, source: system, description: "Set at BEGIN_RELOCATION; must be > start" }
      - { name: shares_proportional, type: array, source: computed, description: "BINDING variant computed at CONFIRM_CLEARED: [{license_id, amount_cents}] over ACTIVE licenses in the area by bidding-units share with floor + largest-remainder (remainder cents to descending units, tie-break created_at ASC)" }
      - { name: shares_equal, type: array, source: computed, description: "DISPUTE-REFERENCE variant computed at CONFIRM_CLEARED: equal split per ACTIVE license, same remainder rule" }
      - { name: status, type: enum, source: system, description: "NOTIFIED | PLAN_SUBMITTED | DISPUTED | RELOCATING | CLEARED (terminal)" }
  - name: RenewalApplication
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> License.id (from path)" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | GRANTED | DENIED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BandPlan
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /spectrum-auctions/band-plans/{id}/publish"
        actor: AuctionAdmin
        preconditions:
          - "Plan is DRAFT (ERR_BAND_PLAN_NOT_DRAFT)"
          - "Plan has >= 1 LicenseArea and >= 1 LicenseBlock (ERR_BAND_PLAN_INCOMPLETE)"
        side_effects:
          - "Plan becomes immutable: further LicenseArea/LicenseBlock creation against it is rejected (ERR_BAND_PLAN_NOT_DRAFT)"

  - entity: Auction
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: APPLICATION_OPEN
        trigger: "POST /spectrum-auctions/auctions/{id}/phase action=OPEN_APPLICATIONS"
        actor: AuctionAdmin
        preconditions:
          - "Auction is DRAFT (ERR_AUCTION_INVALID_STATE)"
        side_effects: []
      - from: APPLICATION_OPEN
        to: QUIET_PERIOD
        trigger: "POST /spectrum-auctions/auctions/{id}/phase action=BEGIN_QUIET_PERIOD"
        actor: AuctionAdmin
        preconditions:
          - "Auction is APPLICATION_OPEN (ERR_AUCTION_INVALID_STATE)"
          - "Logical clock now >= application_deadline (ERR_APPLICATION_DEADLINE_NOT_PASSED)"
        side_effects:
          - "Anti-collusion freeze begins: PATCH /applicants/{id}/disclosure rejected with ERR_QUIET_PERIOD_VIOLATION until the auction reaches CLOSED"
      - from: QUIET_PERIOD
        to: APPLICATION_OPEN
        trigger: "POST /spectrum-auctions/auctions/{id}/phase action=POSTPONE"
        actor: AuctionAdmin
        preconditions:
          - "Auction is QUIET_PERIOD (ERR_AUCTION_INVALID_STATE)"
        side_effects:
          - "Anti-collusion freeze lifted (revert edge; auction may re-enter QUIET_PERIOD later)"
      - from: QUIET_PERIOD
        to: CLOCK_ACTIVE
        trigger: "POST /spectrum-auctions/auctions/{id}/phase action=START_CLOCK"
        actor: AuctionAdmin
        preconditions:
          - "Auction is QUIET_PERIOD (ERR_AUCTION_INVALID_STATE)"
          - ">= 1 Applicant of this auction is QUALIFIED (ERR_NO_QUALIFIED_BIDDERS)"
        side_effects:
          - "Create ClockRound 1 (status OPEN) with opening prices: for every (area, block) product, price_cents = mhz_size * population * price_per_mhz_pop_cents"
          - "Initialize Auction.available_supply: for every product, available = LicenseBlock.supply_per_area"
          - "Snapshot each QUALIFIED applicant's initial_eligibility_units = eligibility_units"
          - "Auction.current_round_number := 1"
      - from: CLOCK_ACTIVE
        to: CLOCK_PAUSED
        trigger: "POST /spectrum-auctions/auctions/{id}/phase action=PAUSE_CLOCK"
        actor: AuctionAdmin
        preconditions:
          - "Auction is CLOCK_ACTIVE (ERR_AUCTION_INVALID_STATE)"
        side_effects:
          - "Bid creation rejected while paused (auction-state gate ERR_AUCTION_INVALID_STATE)"
      - from: CLOCK_PAUSED
        to: CLOCK_ACTIVE
        trigger: "POST /spectrum-auctions/auctions/{id}/phase action=RESUME_CLOCK"
        actor: AuctionAdmin
        preconditions:
          - "Auction is CLOCK_PAUSED (ERR_AUCTION_INVALID_STATE)"
        side_effects: []
      - from: CLOCK_ACTIVE
        to: ASSIGNMENT_PHASE
        trigger: "system: POST /spectrum-auctions/rounds/{id}/close when EVERY product's demand <= supply"
        actor: system
        preconditions:
          - "Closing round's aggregate_demand has demand_quantity <= supply_per_area for every product still open"
        side_effects:
          - "Winners fixed: the (applicant, area_code, category, quantity) tuples of this final round's PROCESSED bids with quantity > 0; each unit becomes one License at COMPLETE_ASSIGNMENT"
      - from: ASSIGNMENT_PHASE
        to: CLOSED
        trigger: "POST /spectrum-auctions/auctions/{id}/phase action=COMPLETE_ASSIGNMENT"
        actor: AuctionAdmin
        preconditions:
          - "Auction is ASSIGNMENT_PHASE (ERR_AUCTION_INVALID_STATE)"
          - "Every winner tuple has a SUBMITTED AssignmentBid from its applicant (ERR_ASSIGNMENT_BIDS_INCOMPLETE)"
        side_effects:
          - "Assignment ranking per product: AssignmentBids ranked amount_cents DESC, tie-break AssignmentBid.created_at ASC (never id); each winner's won units take the next consecutive frequency_block_index values starting at 0 in ranking order"
          - "Create one License (status PENDING_PAYMENT) per won unit: holder = winning applicant, credit_pct copied from applicant, gross_clock_price_cents = final round's posted price for the product, assignment_bid_cents = that winner's AssignmentBid.amount_cents; compute gross_final_price_cents, provisional_net_price_cents, net_price_cents, credit_amount_cents; payment_deadline = logical now + PAYMENT_DEADLINE_DAYS days"
          - "Mark all winner AssignmentBids SUBMITTED -> APPLIED"
          - "Auction.total_proceeds_cents := SUM of per-license net_price_cents (per-license rounding first, then sum)"
          - "Auction.available_supply decremented per product by the number of licenses created"

  - entity: Applicant
    initial_state: SUBMITTED
    terminal_states: [REJECTED, DISQUALIFIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /spectrum-auctions/applicants/{id}/review action=START_REVIEW"
        actor: AuctionAdmin
        preconditions:
          - "Applicant is SUBMITTED (ERR_APPLICANT_INVALID_STATE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: QUALIFIED
        trigger: "POST /spectrum-auctions/applicants/{id}/review action=QUALIFY"
        actor: AuctionAdmin
        preconditions:
          - "Applicant is UNDER_REVIEW (ERR_APPLICANT_INVALID_STATE)"
          - "ownership_interests stake_pct values sum to exactly 100 (ERR_OWNERSHIP_TOTAL_INVALID)"
          - "NOT (claims_small_business AND claims_rural_credit) (ERR_CREDIT_CLAIM_CONFLICT)"
          - "eligibility_units >= 1 (ERR_INSUFFICIENT_UPFRONT)"
        side_effects:
          - "Compute attributable_revenue_cents and credit_pct (see calculations.credit_tier_assignment)"
      - from: UNDER_REVIEW
        to: NEEDS_CORRECTION
        trigger: "POST /spectrum-auctions/applicants/{id}/review action=REQUEST_CORRECTION"
        actor: AuctionAdmin
        preconditions:
          - "Applicant is UNDER_REVIEW (ERR_APPLICANT_INVALID_STATE)"
        side_effects: []
      - from: NEEDS_CORRECTION
        to: UNDER_REVIEW
        trigger: "POST /spectrum-auctions/applicants/{id}/resubmit"
        actor: Bidder
        preconditions:
          - "Applicant is NEEDS_CORRECTION (ERR_APPLICANT_INVALID_STATE)"
          - "X-User-ID == Applicant.id (ERR_FORBIDDEN_OWNERSHIP)"
          - "OCC: expected_applicant_version == Applicant.version (ERR_STALE_VERSION)"
          - "Auction is APPLICATION_OPEN (ERR_QUIET_PERIOD_VIOLATION if QUIET_PERIOD or later)"
        side_effects:
          - "Applicant.version incremented"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /spectrum-auctions/applicants/{id}/review action=REJECT"
        actor: AuctionAdmin
        preconditions:
          - "Applicant is UNDER_REVIEW (ERR_APPLICANT_INVALID_STATE)"
        side_effects:
          - "Refund: upfront_refunded_cents += upfront_held_cents; upfront_held_cents := 0 (conservation invariant maintained)"
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "POST /spectrum-auctions/applicants/{id}/review action=DISQUALIFY"
        actor: AuctionAdmin
        preconditions:
          - "Applicant is QUALIFIED (ERR_APPLICANT_INVALID_STATE)"
          - "Auction is QUIET_PERIOD, CLOCK_ACTIVE, or CLOCK_PAUSED (anti-collusion enforcement window; ERR_APPLICANT_INVALID_STATE otherwise)"
        side_effects:
          - "CASCADE hop 1 (A->B): every SUBMITTED Bid by this applicant in the currently OPEN ClockRound becomes VOIDED"
          - "CASCADE hop 2 (B->C): each voiding itself triggers live recomputation of that ClockRound.aggregate_demand (voided quantities removed)"
          - "Forfeit: upfront_forfeited_cents += upfront_held_cents; upfront_held_cents := 0; Auction.forfeited_deposits_cents += the forfeited amount"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /spectrum-auctions/applicants/{id}/withdraw"
        actor: Bidder
        preconditions:
          - "Applicant is SUBMITTED, UNDER_REVIEW, NEEDS_CORRECTION, or QUALIFIED (ERR_APPLICANT_INVALID_STATE)"
          - "X-User-ID == Applicant.id (ERR_FORBIDDEN_OWNERSHIP)"
          - "Auction is APPLICATION_OPEN (ERR_WITHDRAWAL_WINDOW_CLOSED once QUIET_PERIOD or later)"
        side_effects:
          - "Refund: upfront_refunded_cents += upfront_held_cents; upfront_held_cents := 0"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /spectrum-auctions/applicants/{id}/withdraw"
        actor: Bidder
        preconditions:
          - "Same as SUBMITTED -> WITHDRAWN"
        side_effects:
          - "Refund: upfront_refunded_cents += upfront_held_cents; upfront_held_cents := 0"
      - from: NEEDS_CORRECTION
        to: WITHDRAWN
        trigger: "POST /spectrum-auctions/applicants/{id}/withdraw"
        actor: Bidder
        preconditions:
          - "Same as SUBMITTED -> WITHDRAWN"
        side_effects:
          - "Refund: upfront_refunded_cents += upfront_held_cents; upfront_held_cents := 0"
      - from: QUALIFIED
        to: WITHDRAWN
        trigger: "POST /spectrum-auctions/applicants/{id}/withdraw"
        actor: Bidder
        preconditions:
          - "Same as SUBMITTED -> WITHDRAWN"
        side_effects:
          - "Refund: upfront_refunded_cents += upfront_held_cents; upfront_held_cents := 0"

  - entity: ClockRound
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /spectrum-auctions/rounds/{id}/close"
        actor: AuctionAdmin
        preconditions:
          - "Round is OPEN (ERR_ROUND_NOT_OPEN)"
          - "Auction is CLOCK_ACTIVE (ERR_AUCTION_INVALID_STATE)"
        side_effects:
          - "Finalize aggregate_demand from SUBMITTED bids; those bids become PROCESSED"
          - "Apply activity rule per QUALIFIED, non-DISQUALIFIED applicant (see calculations.activity_requirement): applicants below the stage requirement have eligibility_units reduced"
          - "If every open product has demand <= supply: Auction CLOCK_ACTIVE -> ASSIGNMENT_PHASE (winners fixed from this round)"

  - entity: Bid
    initial_state: SUBMITTED
    terminal_states: [PROCESSED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: PROCESSED
        trigger: "system: parent ClockRound close"
        actor: system
        preconditions: []
        side_effects:
          - "Bid quantity counted into the round's finalized aggregate_demand"
      - from: SUBMITTED
        to: VOIDED
        trigger: "system: bidder DISQUALIFY cascade while round OPEN"
        actor: system
        preconditions: []
        side_effects:
          - "Round aggregate_demand live-recomputed without this bid"

  - entity: AssignmentBid
    initial_state: SUBMITTED
    terminal_states: [APPLIED]
    transitions:
      - from: SUBMITTED
        to: APPLIED
        trigger: "system: COMPLETE_ASSIGNMENT"
        actor: system
        preconditions: []
        side_effects:
          - "amount_cents folded into each created License.assignment_bid_cents"

  - entity: License
    initial_state: PENDING_PAYMENT
    terminal_states: [TERMINATED, CANCELLED]
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /spectrum-auctions/licenses/{id}/settlement-payments when paid_cents reaches net_price_cents"
        actor: Bidder
        preconditions:
          - "License is PENDING_PAYMENT (ERR_LICENSE_INVALID_STATE)"
          - "X-User-ID == License.holder_applicant_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "Payment does not exceed remaining balance net_price_cents - paid_cents (ERR_OVERPAYMENT)"
          - "Every Incumbent with area_id == License.area_id is RELOCATING or CLEARED; any incumbent in NOTIFIED, PLAN_SUBMITTED, or DISPUTED blocks settlement (ERR_INCUMBENTS_NOT_CLEARED)"
        side_effects:
          - "grant_date := logical now; term_end := grant_date + LICENSE_TERM_DAYS days"
          - "Create two BuildoutMilestones: INTERIM (due grant_date + INTERIM_MILESTONE_DAYS days, required_coverage_pct = INTERIM_COVERAGE_PCT) and FINAL (due grant_date + FINAL_MILESTONE_DAYS days, required_coverage_pct = FINAL_COVERAGE_PCT), both PENDING"
      - from: PENDING_PAYMENT
        to: CANCELLED
        trigger: "system: POST /_clock/set_current_utc advances the clock past payment_deadline"
        actor: system
        preconditions:
          - "License is PENDING_PAYMENT and logical now > payment_deadline"
        side_effects:
          - "CASCADE hop 1 (A->B): holder Applicant.upfront_forfeited_cents += upfront_held_cents; holder.upfront_held_cents := 0"
          - "CASCADE hop 2 (B->C): the forfeiture itself increments Auction.forfeited_deposits_cents by the forfeited amount"
          - "Auction.available_supply for (area_code, category) incremented by 1 (supply returned)"
      - from: ACTIVE
        to: RENEWAL_REVIEW
        trigger: "POST /spectrum-auctions/licenses/{id}/renewal-applications"
        actor: Bidder
        preconditions:
          - "License is ACTIVE (ERR_LICENSE_INVALID_STATE)"
          - "X-User-ID == License.holder_applicant_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "Logical now within [term_end - RENEWAL_WINDOW_DAYS days, term_end] (ERR_RENEWAL_WINDOW_CLOSED)"
          - "No other RenewalApplication of this license is FILED or UNDER_REVIEW (ERR_RENEWAL_INVALID_STATE)"
        side_effects:
          - "Create RenewalApplication (status FILED)"
      - from: RENEWAL_REVIEW
        to: ACTIVE
        trigger: "POST /spectrum-auctions/renewal-applications/{id}/decide decision=GRANT"
        actor: TransferReviewer
        preconditions:
          - "RenewalApplication is UNDER_REVIEW (ERR_RENEWAL_INVALID_STATE)"
        side_effects:
          - "License.term_end += RENEWAL_EXTENSION_DAYS days (renewal cycle: license may later enter RENEWAL_REVIEW again)"
      - from: RENEWAL_REVIEW
        to: TERMINATED
        trigger: "POST /spectrum-auctions/renewal-applications/{id}/decide decision=DENY"
        actor: TransferReviewer
        preconditions:
          - "RenewalApplication is UNDER_REVIEW (ERR_RENEWAL_INVALID_STATE)"
        side_effects:
          - "CASCADE: every TransferApplication of this license in FILED/UNDER_REVIEW/INFO_REQUESTED becomes DENIED"
          - "Auction.available_supply for (area_code, category) incremented by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system: FINAL BuildoutMilestone goes MISSED"
        actor: system
        preconditions:
          - "License is ACTIVE"
        side_effects:
          - "CASCADE hop 1 (A->B): triggered by the milestone MISSED transition"
          - "CASCADE hop 2 (B->C): every TransferApplication of this license in FILED/UNDER_REVIEW/INFO_REQUESTED becomes DENIED; AND Auction.available_supply for (area_code, category) incremented by 1"

  - entity: BuildoutMilestone
    initial_state: PENDING
    terminal_states: [ACCEPTED, MISSED]
    transitions:
      - from: PENDING
        to: FILED
        trigger: "POST /spectrum-auctions/buildout-milestones/{id}/file-notice"
        actor: Bidder
        preconditions:
          - "Milestone is PENDING or REJECTED (ERR_MILESTONE_INVALID_STATE)"
          - "X-User-ID == milestone License.holder_applicant_id (ERR_FORBIDDEN_OWNERSHIP)"
          - "OCC: expected_milestone_version == BuildoutMilestone.version (ERR_STALE_VERSION)"
          - "License is ACTIVE or RENEWAL_REVIEW (ERR_LICENSE_INVALID_STATE)"
        side_effects:
          - "covered_population recorded; BuildoutMilestone.version incremented"
      - from: REJECTED
        to: FILED
        trigger: "POST /spectrum-auctions/buildout-milestones/{id}/file-notice"
        actor: Bidder
        preconditions:
          - "Same as PENDING -> FILED (re-filing loop)"
        side_effects:
          - "covered_population overwritten; BuildoutMilestone.version incremented"
      - from: FILED
        to: ACCEPTED
        trigger: "POST /spectrum-auctions/buildout-milestones/{id}/review decision=ACCEPT"
        actor: AuctionAdmin
        preconditions:
          - "Milestone is FILED (ERR_MILESTONE_INVALID_STATE)"
          - "covered_population * 100 >= required_coverage_pct * area.population (integer cross-multiplication; ERR_COVERAGE_BELOW_REQUIREMENT)"
        side_effects: []
      - from: FILED
        to: REJECTED
        trigger: "POST /spectrum-auctions/buildout-milestones/{id}/review decision=REJECT"
        actor: AuctionAdmin
        preconditions:
          - "Milestone is FILED (ERR_MILESTONE_INVALID_STATE)"
        side_effects: []
      - from: PENDING
        to: MISSED
        trigger: "system: POST /_clock/set_current_utc advances the clock past due_date"
        actor: system
        preconditions:
          - "Milestone is PENDING, FILED, or REJECTED and logical now > due_date"
        side_effects:
          - "If INTERIM: sibling FINAL milestone's due_date -= INTERIM_MISS_ACCELERATION_DAYS days (deadline acceleration; FINAL version incremented)"
          - "If FINAL: parent License ACTIVE -> TERMINATED (cascade per License machine)"
      - from: FILED
        to: MISSED
        trigger: "system: POST /_clock/set_current_utc advances the clock past due_date"
        actor: system
        preconditions:
          - "Milestone is PENDING, FILED, or REJECTED and logical now > due_date"
        side_effects:
          - "Same as PENDING -> MISSED (an unreviewed filing does not satisfy the milestone)"
      - from: REJECTED
        to: MISSED
        trigger: "system: POST /_clock/set_current_utc advances the clock past due_date"
        actor: system
        preconditions:
          - "Milestone is PENDING, FILED, or REJECTED and logical now > due_date"
        side_effects:
          - "Same as PENDING -> MISSED"

  - entity: TransferApplication
    initial_state: FILED
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /spectrum-auctions/transfer-applications/{id}/review action=BEGIN_REVIEW"
        actor: TransferReviewer
        preconditions:
          - "Application is FILED (ERR_TRANSFER_INVALID_STATE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /spectrum-auctions/transfer-applications/{id}/review action=REQUEST_INFO"
        actor: TransferReviewer
        preconditions:
          - "Application is UNDER_REVIEW (ERR_TRANSFER_INVALID_STATE)"
        side_effects: []
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /spectrum-auctions/transfer-applications/{id}/review action=PROVIDE_INFO"
        actor: Bidder
        preconditions:
          - "Application is INFO_REQUESTED (ERR_TRANSFER_INVALID_STATE)"
          - "X-User-ID == transferor_applicant_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /spectrum-auctions/transfer-applications/{id}/review action=APPROVE"
        actor: TransferReviewer
        preconditions:
          - "Application is UNDER_REVIEW (ERR_TRANSFER_INVALID_STATE)"
          - "License is ACTIVE or RENEWAL_REVIEW (ERR_LICENSE_INVALID_STATE)"
          - "If unjust_enrichment_cents > 0, request must carry confirm_unjust_enrichment_repayment: true (ERR_UNJUST_ENRICHMENT_CONFIRMATION_REQUIRED)"
        side_effects:
          - "FULL_ASSIGNMENT: License.holder_applicant_id := transferee_applicant_id"
          - "LEASE: if the approved window contains the current logical instant, set License.active_lease_start/active_lease_end/leased_to_applicant_id immediately; otherwise the clock sweep activates them when now enters the window. Overlap validation (at filing) scans ALL APPROVED LEASE windows of the license, not just the currently-active one."
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /spectrum-auctions/transfer-applications/{id}/review action=DENY"
        actor: TransferReviewer
        preconditions:
          - "Application is UNDER_REVIEW (ERR_TRANSFER_INVALID_STATE)"
        side_effects: []
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /spectrum-auctions/transfer-applications/{id}/withdraw"
        actor: Bidder
        preconditions:
          - "Application is FILED or INFO_REQUESTED (ERR_TRANSFER_INVALID_STATE)"
          - "X-User-ID == transferor_applicant_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /spectrum-auctions/transfer-applications/{id}/withdraw"
        actor: Bidder
        preconditions:
          - "Same as FILED -> WITHDRAWN"
        side_effects: []

  - entity: Incumbent
    initial_state: NOTIFIED
    terminal_states: [CLEARED]
    transitions:
      - from: NOTIFIED
        to: PLAN_SUBMITTED
        trigger: "POST /spectrum-auctions/incumbents/{id}/transition action=SUBMIT_PLAN"
        actor: IncumbentOperator
        preconditions:
          - "Incumbent is NOTIFIED (ERR_INCUMBENT_INVALID_STATE)"
          - "X-User-ID == Incumbent.id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []
      - from: PLAN_SUBMITTED
        to: DISPUTED
        trigger: "POST /spectrum-auctions/incumbents/{id}/transition action=DISPUTE"
        actor: IncumbentOperator
        preconditions:
          - "Incumbent is PLAN_SUBMITTED (ERR_INCUMBENT_INVALID_STATE)"
          - "X-User-ID == Incumbent.id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []
      - from: DISPUTED
        to: PLAN_SUBMITTED
        trigger: "POST /spectrum-auctions/incumbents/{id}/transition action=RESUBMIT_PLAN"
        actor: IncumbentOperator
        preconditions:
          - "Incumbent is DISPUTED (ERR_INCUMBENT_INVALID_STATE)"
          - "X-User-ID == Incumbent.id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects: []
      - from: PLAN_SUBMITTED
        to: RELOCATING
        trigger: "POST /spectrum-auctions/incumbents/{id}/transition action=BEGIN_RELOCATION"
        actor: AuctionAdmin
        preconditions:
          - "Incumbent is PLAN_SUBMITTED (ERR_INCUMBENT_INVALID_STATE)"
          - "transition_window_end > transition_window_start (ERR_INVALID_REQUEST)"
          - "Buffer rule vs every OTHER RELOCATING incumbent in the same area_id: new_start >= existing_end + INCUMBENT_TRANSITION_BUFFER_DAYS days OR new_end <= existing_start - INCUMBENT_TRANSITION_BUFFER_DAYS days (closed intervals, symmetric gap; ERR_TRANSITION_WINDOW_CONFLICT)"
        side_effects:
          - "transition_window_start/end recorded"
      - from: RELOCATING
        to: CLEARED
        trigger: "POST /spectrum-auctions/incumbents/{id}/transition action=CONFIRM_CLEARED"
        actor: IncumbentOperator
        preconditions:
          - "Incumbent is RELOCATING (ERR_INCUMBENT_INVALID_STATE)"
          - "X-User-ID == Incumbent.id (ERR_FORBIDDEN_OWNERSHIP)"
          - "Logical now >= transition_window_end (ERR_INCUMBENT_INVALID_STATE)"
        side_effects:
          - "Compute shares_proportional and shares_equal over ACTIVE licenses in this area (see calculations.relocation_cost_shares)"
          - "Post each proportional share onto License.relocation_share_owed_cents (ledger sync)"

  - entity: RenewalApplication
    initial_state: FILED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "system: automatic when the license enters RENEWAL_REVIEW (filing and review-open are one request)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /spectrum-auctions/renewal-applications/{id}/decide decision=GRANT"
        actor: TransferReviewer
        preconditions:
          - "Application is UNDER_REVIEW (ERR_RENEWAL_INVALID_STATE)"
        side_effects:
          - "License RENEWAL_REVIEW -> ACTIVE; term_end += RENEWAL_EXTENSION_DAYS days"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /spectrum-auctions/renewal-applications/{id}/decide decision=DENY"
        actor: TransferReviewer
        preconditions:
          - "Application is UNDER_REVIEW (ERR_RENEWAL_INVALID_STATE)"
        side_effects:
          - "License RENEWAL_REVIEW -> TERMINATED with cascades (pending transfers DENIED; available_supply +1)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: disclosure-update-stale-applicant
    parent_entity: Applicant
    write_endpoint: "PATCH /spectrum-auctions/applicants/{id}/disclosure"
    occ_field: expected_applicant_version
    description: |
      A disclosure update carrying an expected_applicant_version that no longer
      matches the Applicant's current version is rejected: the applicant record
      has been mutated (e.g. a prior disclosure update or a resubmit advanced
      the version) since the client last observed it, so the client's edit base
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: milestone-filing-stale-milestone
    parent_entity: BuildoutMilestone
    write_endpoint: "POST /spectrum-auctions/buildout-milestones/{id}/file-notice"
    occ_field: expected_milestone_version
    description: |
      A coverage filing carrying an expected_milestone_version that no longer
      matches the BuildoutMilestone's current version is rejected: each filing
      supersedes the previous filing content, and any intervening mutation
      (an earlier filing, a review decision, or a due-date acceleration)
      invalidates the stale base.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All monetary values are integer cents; all eligibility/activity values are
# integer MHz-pop units. Comparisons use integer cross-multiplication to avoid
# float drift. round_half_up is the ONLY rounding mode.
# =============================================================================
calculations:
  - name: bidding_eligibility
    trigger: "On every POST /applicants/{id}/upfront-payments; re-snapshotted at START_CLOCK"
    algorithm: threshold
    formula: |
      eligibility_units = floor(upfront_held_cents / UPFRONT_CENTS_PER_ELIGIBILITY_UNIT)
      (uses the HELD balance; refunds/forfeitures therefore reduce eligibility)
    input_set: "The single Applicant being paid into"
    constants:
      UPFRONT_CENTS_PER_ELIGIBILITY_UNIT: 2500
    precision: "integer floor division; no rounding ambiguity"

  - name: credit_tier_assignment
    trigger: "On POST /applicants/{id}/review action=QUALIFY"
    algorithm: threshold
    formula: |
      attributable_revenue_cents = own_annual_revenue_cents
          + SUM(holder_annual_revenue_cents for oi in ownership_interests
                if oi.stake_pct > ATTRIBUTABLE_STAKE_PCT)     # STRICTLY greater: stake == 25 is NOT attributable
      if claims_small_business:
          if attributable_revenue_cents <= SMALL_BIZ_TIER1_MAX_REVENUE_CENTS: credit_pct = SMALL_BIZ_TIER1_CREDIT_PCT
          elif attributable_revenue_cents <= SMALL_BIZ_TIER2_MAX_REVENUE_CENTS: credit_pct = SMALL_BIZ_TIER2_CREDIT_PCT
          elif attributable_revenue_cents <= SMALL_BIZ_TIER3_MAX_REVENUE_CENTS: credit_pct = SMALL_BIZ_TIER3_CREDIT_PCT
          else: credit_pct = 0
      elif claims_rural_credit:
          credit_pct = RURAL_CREDIT_PCT if service_population <= RURAL_SERVICE_POPULATION_CAP else 0
      else: credit_pct = 0
    input_set: "The Applicant being qualified"
    constants:
      ATTRIBUTABLE_STAKE_PCT: 25
      SMALL_BIZ_TIER1_MAX_REVENUE_CENTS: 400000000
      SMALL_BIZ_TIER1_CREDIT_PCT: 35
      SMALL_BIZ_TIER2_MAX_REVENUE_CENTS: 2000000000
      SMALL_BIZ_TIER2_CREDIT_PCT: 25
      SMALL_BIZ_TIER3_MAX_REVENUE_CENTS: 5500000000
      SMALL_BIZ_TIER3_CREDIT_PCT: 15
      RURAL_SERVICE_POPULATION_CAP: 250000
      RURAL_CREDIT_PCT: 15
    precision: "integer cents; tier boundaries are inclusive (less-than-or-equal, at-boundary qualifies)"

  - name: product_units_and_opening_price
    trigger: "At START_CLOCK (round 1 prices) and whenever a Bid's units_snapshot is computed"
    algorithm: aggregation
    formula: |
      For product p = (area a, block b):
        bidding_units(p)  = b.mhz_size * a.population
        opening_price(p)  = b.mhz_size * a.population * b.price_per_mhz_pop_cents
      All inputs are integers, so results are exact integers; no rounding step exists here.
    input_set: "Every (LicenseArea x LicenseBlock) pair of the auction's BandPlan"
    constants: {}
    precision: "exact integer arithmetic"

  - name: clock_price_increment
    trigger: "On POST /auctions/{id}/rounds (creating the next round from the last CLOSED round)"
    algorithm: threshold
    formula: |
      For each product p in the last CLOSED round's prices:
        d = aggregate_demand[p].demand_quantity ; s = LicenseBlock.supply_per_area
        # integer cross-multiplication; boundaries inclusive on the lower side
        if   d * CLOCK_INCREMENT_TIER1_RATIO_DEN >= CLOCK_INCREMENT_TIER1_RATIO_NUM * s: pct = CLOCK_INCREMENT_TIER1_PCT   # d/s >= 1.5
        elif d * CLOCK_INCREMENT_TIER2_RATIO_DEN >= CLOCK_INCREMENT_TIER2_RATIO_NUM * s: pct = CLOCK_INCREMENT_TIER2_PCT   # d/s >= 1.2
        elif d * CLOCK_INCREMENT_TIER3_RATIO_DEN >= CLOCK_INCREMENT_TIER3_RATIO_NUM * s: pct = CLOCK_INCREMENT_TIER3_PCT   # d/s >= 1.0
        else: product CLOSED — excluded from the new round's prices array (not biddable)
        next_price_cents(p) = round_half_up(last_price_cents(p) * (100 + pct) / 100)
      A product that was already closed stays closed forever (never re-enters prices).
    input_set: "Products present in the last CLOSED round's prices array"
    constants:
      CLOCK_INCREMENT_TIER1_RATIO_NUM: 3
      CLOCK_INCREMENT_TIER1_RATIO_DEN: 2
      CLOCK_INCREMENT_TIER1_PCT: 15
      CLOCK_INCREMENT_TIER2_RATIO_NUM: 6
      CLOCK_INCREMENT_TIER2_RATIO_DEN: 5
      CLOCK_INCREMENT_TIER2_PCT: 10
      CLOCK_INCREMENT_TIER3_RATIO_NUM: 1
      CLOCK_INCREMENT_TIER3_RATIO_DEN: 1
      CLOCK_INCREMENT_TIER3_PCT: 5
    precision: "round_half_up to integer cents, applied once per product per round"
    variants:
      - name: per_product_independence
        when: "always"
        difference: "the increment/close decision is computed independently per product; one product may jump 15% while another closes in the same round"

  - name: activity_requirement
    trigger: "On POST /rounds/{id}/close"
    algorithm: threshold
    formula: |
      # PINNED EVALUATION ORDER (breaks the circular-looking dependency):
      #   (1) bids were validated against the eligibility_units in force DURING the round;
      #   (2) at close, activity is measured for that same round;
      #   (3) reductions apply to eligibility_units for SUBSEQUENT rounds only.
      required_milli = STAGE1_ACTIVITY_MILLI if round.stage == 1 else STAGE2_ACTIVITY_MILLI
      for each Applicant with status QUALIFIED at close time:
        activity = SUM(b.units_snapshot for b in this round's PROCESSED bids where b.bidder_applicant_id == applicant.id)
        if activity * 1000 >= required_milli * applicant.eligibility_units:
            eligibility_units unchanged                      # boundary is INCLUSIVE (>=)
        else:
            eligibility_units := floor(activity * 1000 / required_milli)
      DISQUALIFIED/REJECTED/WITHDRAWN applicants are excluded from both sides.
    input_set: "QUALIFIED applicants of the auction; this round's PROCESSED bids"
    constants:
      STAGE1_ACTIVITY_MILLI: 800
      STAGE2_ACTIVITY_MILLI: 950
      STAGE2_START_ROUND: 4
    precision: "integer arithmetic; floor for the reduction division"

  - name: settlement_pricing
    trigger: "At COMPLETE_ASSIGNMENT (final) — provisional_net_price_cents is computed from the same inputs but excludes assignment_bid_cents"
    algorithm: weighted_scoring
    formula: |
      Per created License:
        gross_final_price_cents     = gross_clock_price_cents + assignment_bid_cents
        provisional_net_price_cents = round_half_up(gross_clock_price_cents * (100 - credit_pct) / 100)
        net_price_cents             = round_half_up(gross_final_price_cents * (100 - credit_pct) / 100)
        credit_amount_cents         = gross_final_price_cents - net_price_cents
      Auction.total_proceeds_cents  = SUM(net_price_cents over all created licenses)
      # PINNED ROUNDING ORDER (mode-b): round each license to cents FIRST, then sum.
      # Sum-then-round of the unrounded values is a DIFFERENT, non-conformant answer.
    input_set: "The licenses being created for one auction"
    constants: {}
    precision: "round_half_up per license, then integer sum"
    variants:
      - name: provisional
        when: "provisional_net_price_cents field — clock-price basis, assignment-invariant"
        difference: "excludes assignment_bid_cents from the gross basis; identical clock data yields a different number than the final variant whenever any assignment bid > 0"
      - name: final
        when: "net_price_cents field — settlement basis"
        difference: "includes assignment_bid_cents in the gross basis"

  - name: license_lifecycle_windows
    trigger: "At license grant (term computation), license creation (payment deadline), renewal filing/decision, and incumbent BEGIN_RELOCATION"
    algorithm: threshold
    formula: |
      payment_deadline = License.created_at + PAYMENT_DEADLINE_DAYS days
      term_end         = grant_date + LICENSE_TERM_DAYS days
      renewal_window   = [term_end - RENEWAL_WINDOW_DAYS days, term_end]   (inclusive both ends)
      on renewal GRANT: term_end += RENEWAL_EXTENSION_DAYS days
      incumbent relocation windows in one area must keep a >= INCUMBENT_TRANSITION_BUFFER_DAYS
      day gap from every other RELOCATING window (closed-interval comparison)
      All day arithmetic is on the logical clock; "days" are 24-hour multiples, calendar-naive.
    input_set: "License and Incumbent instances"
    constants:
      PAYMENT_DEADLINE_DAYS: 30
      LICENSE_TERM_DAYS: 3650
      RENEWAL_WINDOW_DAYS: 365
      RENEWAL_EXTENSION_DAYS: 3650
      INCUMBENT_TRANSITION_BUFFER_DAYS: 30
    precision: "integer day arithmetic; window boundaries inclusive"

  - name: unjust_enrichment_repayment
    trigger: "On POST /licenses/{id}/transfer-applications (computed at filing, stored on the TransferApplication)"
    algorithm: threshold
    formula: |
      if License.credit_amount_cents == 0: unjust_enrichment_cents = 0
      else:
        years_elapsed = floor((now - License.grant_date) in whole days / UNJUST_ENRICHMENT_DAYS_PER_YEAR)
        if transferee.credit_pct < License.credit_pct:
            schedule_pct = 100                              # less credit-eligible buyer: full repayment regardless of holding period
        else:
            schedule_pct = UNJUST_ENRICHMENT_SCHEDULE[min(years_elapsed, 5)]   # 0..4 -> 100/80/60/40/20; >= 5 -> 0
        unjust_enrichment_cents = round_half_up(License.credit_amount_cents * schedule_pct / 100)
      # Boundary: exactly 5*365 = 1825 days after grant => schedule_pct 0; day 1824 => 20%.
    input_set: "The License being transferred and the transferee Applicant"
    constants:
      UNJUST_ENRICHMENT_DAYS_PER_YEAR: 365
      UNJUST_ENRICHMENT_PERIOD_YEARS: 5
      UNJUST_ENRICHMENT_SCHEDULE: { "0": 100, "1": 80, "2": 60, "3": 40, "4": 20, "5": 0 }
    precision: "integer day arithmetic on the logical clock; round_half_up to cents"

  - name: buildout_coverage_check
    trigger: "On POST /buildout-milestones/{id}/review decision=ACCEPT"
    algorithm: threshold
    formula: |
      Let pop = LicenseArea.population of the milestone's license area.
      ACCEPT is valid iff covered_population * 100 >= required_coverage_pct * pop
      (integer cross-multiplication; the boundary is INCLUSIVE — exactly 40.000% passes INTERIM).
      A FILED milestone whose clock passes due_date without an ACCEPT goes MISSED
      regardless of the filed coverage figure.
    input_set: "The milestone under review and its license's LicenseArea"
    constants:
      INTERIM_COVERAGE_PCT: 40
      FINAL_COVERAGE_PCT: 70
      INTERIM_MILESTONE_DAYS: 1095
      FINAL_MILESTONE_DAYS: 2190
      INTERIM_MISS_ACCELERATION_DAYS: 365
    precision: "exact integer comparison"

  - name: relocation_cost_shares
    trigger: "On POST /incumbents/{id}/transition action=CONFIRM_CLEARED"
    algorithm: waterfall_allocation
    formula: |
      Let L = ACTIVE licenses with area_id == incumbent.area_id, C = relocation_cost_cents.
      units(l) = mhz_size(category of l) * population(area of l)   # from the BandPlan
      shares_proportional (BINDING):
        base(l) = floor(C * units(l) / SUM(units over L))
        remainder = C - SUM(base); distribute remainder one cent at a time to licenses
        ordered by units DESC, tie-break License.created_at ASC (never id), until exhausted.
      shares_equal (DISPUTE REFERENCE):
        base(l) = floor(C / |L|); same remainder distribution rule.
      Post shares_proportional amounts onto License.relocation_share_owed_cents.
      If L is empty: both arrays are empty and nothing is posted.
    input_set: "ACTIVE licenses in the incumbent's LicenseArea at CONFIRM_CLEARED time"
    constants: {}
    precision: "integer floor + deterministic largest-remainder"
    variants:
      - name: mhz_pop_proportional
        when: "shares_proportional / License.relocation_share_owed_cents — the binding invoice basis"
        difference: "weights by bidding units; a license with 2x units pays 2x the share"
      - name: equal_split
        when: "shares_equal — stored as the dispute-reference figure"
        difference: "weights every license equally; identical inputs produce different amounts whenever units differ"

  - name: assignment_ranking
    trigger: "At COMPLETE_ASSIGNMENT"
    algorithm: waterfall_allocation
    formula: |
      Per product p: rank its winners' AssignmentBids by amount_cents DESC,
      tie-break AssignmentBid.created_at ASC (never id).
      Walk the ranking; each winner's won quantity takes the next that-many
      consecutive frequency_block_index values (0-based) within p.
      Every winner MUST have a SUBMITTED AssignmentBid (ERR_ASSIGNMENT_BIDS_INCOMPLETE);
      there is no zero-default fallback.
    input_set: "Winner tuples fixed at the final clock round and their AssignmentBids"
    constants: {}
    precision: "deterministic total order per product"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list; for action-enum endpoints the caller role must additionally be permitted for the specific action (Bidder may only PROVIDE_INFO on transfer review; IncumbentOperator may not BEGIN_RELOCATION; AuctionAdmin may not SUBMIT_PLAN/DISPUTE/RESUBMIT_PLAN/CONFIRM_CLEARED)"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path parameters resolve left-to-right (auction/round/license/milestone/transfer/incumbent/applicant ids); for bid and assignment-bid bodies the (area_code, category) product must exist in the auction's band plan"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
    note: "A nonexistent product inside an existing auction yields ERR_PRODUCT_NOT_FOUND, still 404, after all path ids resolve"
  - priority: 4
    category: auth
    check: "Entity-backed ownership: Bidder calls must carry X-User-ID equal to the target Applicant.id (or the license's holder_applicant_id / milestone's license holder / transfer's transferor); IncumbentOperator calls must carry X-User-ID equal to the Incumbent.id"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "state-changing Bidder and IncumbentOperator endpoints"
  - priority: 5
    category: state
    check: "Target entity is in a from-state of the requested transition per its §1.2 machine (auction phase, applicant review state, round OPEN, license ACTIVE/PENDING_PAYMENT, milestone FILED/PENDING, transfer FILED/UNDER_REVIEW/INFO_REQUESTED, incumbent states, renewal UNDER_REVIEW)"
    error_id: ERR_AUCTION_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"
    note: "Surfaced as the machine-specific error id: ERR_AUCTION_INVALID_STATE, ERR_APPLICANT_INVALID_STATE, ERR_ROUND_NOT_OPEN, ERR_LICENSE_INVALID_STATE, ERR_MILESTONE_INVALID_STATE, ERR_TRANSFER_INVALID_STATE, ERR_INCUMBENT_INVALID_STATE, ERR_RENEWAL_INVALID_STATE, ERR_BAND_PLAN_NOT_DRAFT, ERR_PRODUCT_CLOSED"
  - priority: 6
    category: business_safety
    check: "Anti-collusion quiet-period freeze: disclosure PATCH and resubmit are rejected while the auction is QUIET_PERIOD or later (until CLOSED); qualification compliance gates at QUALIFY: ownership stakes sum to exactly 100 and small-business/rural claims are mutually exclusive"
    error_id: ERR_QUIET_PERIOD_VIOLATION
    http_status: 409
    applies_to: "PATCH /spectrum-auctions/applicants/{id}/disclosure; POST /spectrum-auctions/applicants/{id}/resubmit; POST /spectrum-auctions/applicants/{id}/review (QUALIFY gate uses ERR_OWNERSHIP_TOTAL_INVALID / ERR_CREDIT_CLAIM_CONFLICT at this same priority tier)"
  - priority: 7
    category: business_constraint
    check: "Structural constraints: area_code unique per band plan (ERR_DUPLICATE_AREA_CODE); category unique per band plan (ERR_DUPLICATE_BLOCK_CATEGORY); bid quantity <= supply_per_area (ERR_SUPPLY_EXCEEDED); at most one bid per (round, bidder, product) (ERR_DUPLICATE_BID); at most one assignment bid per (bidder, product) (ERR_DUPLICATE_ASSIGNMENT_BID); LEASE requires lease_start/lease_end with end > start (ERR_LEASE_DATES_INVALID); lease window may not overlap an approved lease on the same license under half-open [start, end) semantics — adjacency is allowed (ERR_LEASE_WINDOW_OVERLAP); incumbent transition windows in one area are closed intervals requiring a >= INCUMBENT_TRANSITION_BUFFER_DAYS gap from every other RELOCATING window (ERR_TRANSITION_WINDOW_CONFLICT); COMPLETE_ASSIGNMENT needs every winner's assignment bid (ERR_ASSIGNMENT_BIDS_INCOMPLETE); publish needs >= 1 area and >= 1 block (ERR_BAND_PLAN_INCOMPLETE)"
    error_id: ERR_DUPLICATE_BID
    http_status: 409
    applies_to: "create/action endpoints as named"
  - priority: 8
    category: business_temporal
    check: "Window rules: BEGIN_QUIET_PERIOD requires now >= application_deadline (ERR_APPLICATION_DEADLINE_NOT_PASSED); upfront payments only while APPLICATION_OPEN or QUIET_PERIOD (ERR_UPFRONT_WINDOW_CLOSED); withdraw only while APPLICATION_OPEN (ERR_WITHDRAWAL_WINDOW_CLOSED); renewal filing only inside [term_end - RENEWAL_WINDOW_DAYS days, term_end] (ERR_RENEWAL_WINDOW_CLOSED); incumbent CONFIRM_CLEARED only at/after transition_window_end"
    error_id: ERR_APPLICATION_DEADLINE_NOT_PASSED
    http_status: 409
    applies_to: "windowed endpoints as named"
  - priority: 9
    category: business_referential
    check: "Membership/derivation checks: assignment-bid caller must be a recorded winner of the product from the final clock round (ERR_NOT_A_WINNER); transferee_applicant_id must resolve to an existing Applicant (ERR_NOT_FOUND at priority 3)"
    error_id: ERR_NOT_A_WINNER
    http_status: 403
    applies_to: "POST /spectrum-auctions/auctions/{id}/assignment-bids"
  - priority: 10
    category: business_fiscal
    check: "Money/quota gates, always last: bid's cumulative round activity may not exceed eligibility_units (ERR_BID_EXCEEDS_ELIGIBILITY); settlement payment may not exceed remaining balance (ERR_OVERPAYMENT); QUALIFY requires eligibility_units >= 1 (ERR_INSUFFICIENT_UPFRONT); transfer APPROVE with unjust_enrichment_cents > 0 requires confirm_unjust_enrichment_repayment: true (ERR_UNJUST_ENRICHMENT_CONFIRMATION_REQUIRED); milestone ACCEPT requires the coverage cross-multiplication to hold (ERR_COVERAGE_BELOW_REQUIREMENT)"
    error_id: ERR_BID_EXCEEDS_ELIGIBILITY
    http_status: 422
    applies_to: "as named"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role / X-User-ID headers, or an unknown role value" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles list, or role not permitted for the requested action enum value" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed caller X-User-ID does not match the owning Applicant.id or Incumbent.id of the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id (or transferee_applicant_id in the body) does not resolve to an existing resource" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "The (area_code, category) product is not part of the auction's band plan" }
  - { id: ERR_PRODUCT_CLOSED, http: 409, condition: "Bid targets a product whose category closed (demand < supply) in an earlier round; it is absent from this round's prices" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, out-of-range number, or unknown enum member in the request body" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_applicant_version / expected_milestone_version does not match the resource's current version (OCC)" }
  - { id: ERR_BAND_PLAN_NOT_DRAFT, http: 409, condition: "LicenseArea/LicenseBlock creation or publish attempted against a plan not in DRAFT" }
  - { id: ERR_BAND_PLAN_INCOMPLETE, http: 422, condition: "Publish attempted with zero LicenseAreas or zero LicenseBlocks" }
  - { id: ERR_DUPLICATE_AREA_CODE, http: 409, condition: "LicenseArea area_code already exists within the same band plan" }
  - { id: ERR_DUPLICATE_BLOCK_CATEGORY, http: 409, condition: "LicenseBlock category already exists within the same band plan" }
  - { id: ERR_AUCTION_INVALID_STATE, http: 409, condition: "Auction phase transition or phase-gated operation attempted from a state that has no such transition (includes bids while CLOCK_PAUSED)" }
  - { id: ERR_APPLICATION_DEADLINE_NOT_PASSED, http: 409, condition: "BEGIN_QUIET_PERIOD attempted before the logical clock reaches application_deadline" }
  - { id: ERR_NO_QUALIFIED_BIDDERS, http: 422, condition: "START_CLOCK attempted with zero QUALIFIED applicants" }
  - { id: ERR_APPLICANT_INVALID_STATE, http: 409, condition: "Applicant review/disqualify/withdraw/bid attempted from a state without that transition; bids by non-QUALIFIED applicants land here" }
  - { id: ERR_OWNERSHIP_TOTAL_INVALID, http: 422, condition: "ownership_interests stake_pct values do not sum to exactly 100 (checked at applicant creation, on disclosure PATCH when the array is supplied, and at QUALIFY)" }
  - { id: ERR_CREDIT_CLAIM_CONFLICT, http: 422, condition: "QUALIFY attempted with both claims_small_business and claims_rural_credit true" }
  - { id: ERR_QUIET_PERIOD_VIOLATION, http: 409, condition: "Disclosure update or resubmission attempted while the auction is in QUIET_PERIOD or later (anti-collusion freeze)" }
  - { id: ERR_UPFRONT_WINDOW_CLOSED, http: 409, condition: "Upfront payment attempted after the auction has left APPLICATION_OPEN/QUIET_PERIOD" }
  - { id: ERR_WITHDRAWAL_WINDOW_CLOSED, http: 409, condition: "Withdrawal attempted after the auction has left APPLICATION_OPEN" }
  - { id: ERR_ROUND_NOT_OPEN, http: 409, condition: "Bid placement against a round that is not OPEN, or close attempted on a non-OPEN round" }
  - { id: ERR_BID_EXCEEDS_ELIGIBILITY, http: 422, condition: "The bidder's cumulative activity this round including the new bid exceeds eligibility_units" }
  - { id: ERR_DUPLICATE_BID, http: 409, condition: "A SUBMITTED bid already exists for (round, bidder, area_code, category)" }
  - { id: ERR_SUPPLY_EXCEEDED, http: 422, condition: "Bid quantity exceeds LicenseBlock.supply_per_area for the product" }
  - { id: ERR_NOT_A_WINNER, http: 403, condition: "Assignment bid by an applicant with no winning tuple for that product in the final clock round" }
  - { id: ERR_DUPLICATE_ASSIGNMENT_BID, http: 409, condition: "An assignment bid already exists for (bidder, area_code, category) in this auction" }
  - { id: ERR_ASSIGNMENT_BIDS_INCOMPLETE, http: 409, condition: "COMPLETE_ASSIGNMENT attempted while some winner lacks a SUBMITTED AssignmentBid" }
  - { id: ERR_LICENSE_INVALID_STATE, http: 409, condition: "License-gated operation (settlement, transfer filing, milestone filing, renewal filing, transfer approval) attempted against a license in the wrong state" }
  - { id: ERR_INCUMBENTS_NOT_CLEARED, http: 409, condition: "Settlement completing a license in an area where any Incumbent is still NOTIFIED, PLAN_SUBMITTED, or DISPUTED (RELOCATING or CLEARED incumbents do not block)" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Settlement payment exceeds net_price_cents - paid_cents, or amount_cents <= 0 on any payment" }
  - { id: ERR_COVERAGE_BELOW_REQUIREMENT, http: 422, condition: "Milestone ACCEPT where covered_population * 100 < required_coverage_pct * area.population" }
  - { id: ERR_MILESTONE_INVALID_STATE, http: 409, condition: "Milestone filing or review attempted from a state without that transition (e.g. review of PENDING, filing of ACCEPTED/MISSED)" }
  - { id: ERR_LEASE_DATES_INVALID, http: 422, condition: "LEASE transfer missing lease_start/lease_end, or lease_end <= lease_start" }
  - { id: ERR_LEASE_WINDOW_OVERLAP, http: 409, condition: "LEASE window [start, end) intersects an already-approved lease window on the same license; touching endpoints are allowed" }
  - { id: ERR_UNJUST_ENRICHMENT_CONFIRMATION_REQUIRED, http: 422, condition: "Transfer APPROVE with unjust_enrichment_cents > 0 without confirm_unjust_enrichment_repayment: true" }
  - { id: ERR_TRANSFER_INVALID_STATE, http: 409, condition: "Transfer review/withdraw attempted from a state without that transition" }
  - { id: ERR_TRANSITION_WINDOW_CONFLICT, http: 409, condition: "Incumbent relocation window violates the INCUMBENT_TRANSITION_BUFFER_DAYS gap rule against another RELOCATING window in the same area" }
  - { id: ERR_INCUMBENT_INVALID_STATE, http: 409, condition: "Incumbent transition attempted from a state without that edge (includes CONFIRM_CLEARED before transition_window_end)" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 409, condition: "Renewal filing outside [term_end - RENEWAL_WINDOW_DAYS days, term_end]" }
  - { id: ERR_RENEWAL_INVALID_STATE, http: 409, condition: "Renewal decide attempted on a non-UNDER_REVIEW application, or a second renewal filed while one is FILED/UNDER_REVIEW" }
  - { id: ERR_INSUFFICIENT_UPFRONT, http: 422, condition: "QUALIFY attempted with eligibility_units == 0 (no effective upfront payment)" }

# =============================================================================
# §1.5 API Endpoint Table
# Business endpoints live under /spectrum-auctions; the test-driving clock
# endpoint is intentionally unprefixed (/_clock/...).
# ALL_ROLES below means [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer].
# =============================================================================
endpoints:
  - method: POST
    path: /_clock/set_current_utc
    description: "TEST-DRIVING endpoint. Sets the server's logical clock to the given ISO 8601 UTC instant. STARTUP DEFAULT: before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time. Advancing the clock runs system sweeps: (1) PENDING_PAYMENT licenses whose payment_deadline < now become CANCELLED with the forfeiture cascade; (2) PENDING/FILED/REJECTED buildout milestones whose due_date < now become MISSED (INTERIM miss accelerates the sibling FINAL due_date by INTERIM_MISS_ACCELERATION_DAYS days; FINAL miss terminates the license with its cascades); (3) license lease fields are reconciled against APPROVED lease windows: the window containing now becomes active (fields set), and an expired active window (active_lease_end <= now) is cleared. Sweeps run in created_at ASC order within each class (never id-ordered)."
    roles: [AuctionAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["payment-deadline sweep", "milestone MISSED sweep", "lease-expiry sweep", "all cascades documented in §1.2"]

  - method: POST
    path: /spectrum-auctions/band-plans
    description: "Create a BandPlan in DRAFT"
    roles: [AuctionAdmin]
    code: 201
    input: [band_name, frequency_start_mhz, frequency_end_mhz, "technical_rules?"]
    output: BandPlan
    side_effects: []
  - method: GET
    path: /spectrum-auctions/band-plans/{id}
    description: "Read one BandPlan"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: []
    output: BandPlan
    side_effects: []
  - method: POST
    path: /spectrum-auctions/band-plans/{id}/publish
    description: "Publish a DRAFT plan (requires >= 1 area and >= 1 block); freezes plan structure"
    roles: [AuctionAdmin]
    code: 200
    input: []
    output: BandPlan
    side_effects: ["BandPlan DRAFT -> PUBLISHED"]
  - method: POST
    path: /spectrum-auctions/license-areas
    description: "Add a LicenseArea to a DRAFT plan"
    roles: [AuctionAdmin]
    code: 201
    input: [band_plan_id, area_code, name, population]
    output: LicenseArea
    side_effects: []
  - method: GET
    path: /spectrum-auctions/band-plans/{id}/license-areas
    description: "List areas of a plan (reverse-reach for LicenseArea.band_plan_id)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: LicenseArea[]
    side_effects: []
  - method: POST
    path: /spectrum-auctions/license-blocks
    description: "Add a LicenseBlock (category definition) to a DRAFT plan"
    roles: [AuctionAdmin]
    code: 201
    input: [band_plan_id, category, mhz_size, supply_per_area, price_per_mhz_pop_cents]
    output: LicenseBlock
    side_effects: []
  - method: GET
    path: /spectrum-auctions/band-plans/{id}/license-blocks
    description: "List blocks of a plan (reverse-reach for LicenseBlock.band_plan_id)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: LicenseBlock[]
    side_effects: []

  - method: POST
    path: /spectrum-auctions/auctions
    description: "Create an Auction (DRAFT) against a PUBLISHED plan"
    roles: [AuctionAdmin]
    code: 201
    input: [band_plan_id, name, application_deadline]
    output: Auction
    side_effects: []
  - method: GET
    path: /spectrum-auctions/auctions/{id}
    description: "Read one Auction (status, current_round_number, totals, available_supply)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: []
    output: Auction
    side_effects: []
  - method: GET
    path: /spectrum-auctions/band-plans/{id}/auctions
    description: "List auctions of a plan (reverse-reach for Auction.band_plan_id)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: Auction[]
    side_effects: []
  - method: POST
    path: /spectrum-auctions/auctions/{id}/phase
    description: "Auction phase machine driver. action in {OPEN_APPLICATIONS, BEGIN_QUIET_PERIOD, POSTPONE, START_CLOCK, PAUSE_CLOCK, RESUME_CLOCK, COMPLETE_ASSIGNMENT}; preconditions and side effects per §1.2 Auction"
    roles: [AuctionAdmin]
    code: 200
    input: [action]
    output: Auction
    side_effects: ["phase transition", "START_CLOCK creates ClockRound 1 + initializes available_supply + snapshots initial_eligibility_units", "COMPLETE_ASSIGNMENT ranks assignment bids, creates Licenses, marks AssignmentBids APPLIED, sets total_proceeds_cents, decrements available_supply"]

  - method: POST
    path: /spectrum-auctions/applicants
    description: "Self-register an Applicant (status SUBMITTED). Caller uses role Bidder; the returned id becomes the caller's X-User-ID for all subsequent Bidder calls. Auction must be APPLICATION_OPEN."
    roles: [Bidder]
    code: 201
    input: [auction_id, legal_name, claims_small_business, claims_rural_credit, own_annual_revenue_cents, service_population, ownership_interests]
    output: Applicant
    side_effects: []
  - method: GET
    path: /spectrum-auctions/applicants/{id}
    description: "Read one Applicant (credit_pct, eligibility_units, upfront ledger, status)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: []
    output: Applicant
    side_effects: []
  - method: GET
    path: /spectrum-auctions/auctions/{id}/applicants
    description: "List applicants of an auction (reverse-reach for Applicant.auction_id)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Applicant[]
    side_effects: []
  - method: PATCH
    path: /spectrum-auctions/applicants/{id}/disclosure
    description: "Update disclosure fields (OCC-guarded). Allowed while applicant is SUBMITTED or NEEDS_CORRECTION AND auction is APPLICATION_OPEN; forbidden from QUIET_PERIOD onward (anti-collusion). ownership_interests, when supplied, REPLACES the array and must sum to 100."
    roles: [Bidder]
    code: 200
    input: [expected_applicant_version, "legal_name?", "claims_small_business?", "claims_rural_credit?", "own_annual_revenue_cents?", "service_population?", "ownership_interests?"]
    output: Applicant
    side_effects: ["increments Applicant.version by 1"]
  - method: POST
    path: /spectrum-auctions/applicants/{id}/upfront-payments
    description: "Add to the upfront deposit; recomputes eligibility_units = floor(upfront_held_cents / 2500). Only while the auction is APPLICATION_OPEN or QUIET_PERIOD."
    roles: [Bidder]
    code: 200
    input: [amount_cents]
    output: Applicant
    side_effects: ["upfront_paid_cents += amount; upfront_held_cents += amount; eligibility_units recomputed"]
  - method: POST
    path: /spectrum-auctions/applicants/{id}/review
    description: "Admin review driver. action in {START_REVIEW, QUALIFY, REJECT, REQUEST_CORRECTION, DISQUALIFY}; transitions per §1.2 Applicant"
    roles: [AuctionAdmin]
    code: 200
    input: [action]
    output: Applicant
    side_effects: ["QUALIFY computes attributable_revenue_cents and credit_pct", "DISQUALIFY voids open-round bids, live-recomputes round demand, forfeits held upfront into Auction.forfeited_deposits_cents", "REJECT refunds held upfront"]
  - method: POST
    path: /spectrum-auctions/applicants/{id}/resubmit
    description: "Resubmit from NEEDS_CORRECTION back to UNDER_REVIEW (OCC-guarded)"
    roles: [Bidder]
    code: 200
    input: [expected_applicant_version]
    output: Applicant
    side_effects: ["Applicant NEEDS_CORRECTION -> UNDER_REVIEW", "increments Applicant.version by 1"]
  - method: POST
    path: /spectrum-auctions/applicants/{id}/withdraw
    description: "Withdraw while the auction is APPLICATION_OPEN; held upfront refunded in full"
    roles: [Bidder]
    code: 200
    input: []
    output: Applicant
    side_effects: ["Applicant -> WITHDRAWN", "upfront_held_cents moved to upfront_refunded_cents"]

  - method: POST
    path: /spectrum-auctions/auctions/{id}/rounds
    description: "Open the next ClockRound. Requires auction CLOCK_ACTIVE and the previous round CLOSED. Prices computed from the last closed round via clock_price_increment; closed products are excluded."
    roles: [AuctionAdmin]
    code: 201
    input: []
    output: ClockRound
    side_effects: ["ClockRound created OPEN with computed prices", "Auction.current_round_number += 1"]
  - method: GET
    path: /spectrum-auctions/auctions/{id}/rounds
    description: "List rounds of an auction (reverse-reach for ClockRound.auction_id)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: ClockRound[]
    side_effects: []
  - method: GET
    path: /spectrum-auctions/rounds/{id}
    description: "Read one ClockRound (prices, aggregate_demand, stage, status)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: []
    output: ClockRound
    side_effects: []
  - method: POST
    path: /spectrum-auctions/rounds/{id}/close
    description: "Close an OPEN round: finalize demand, mark bids PROCESSED, apply the activity rule (eligibility reductions); auto-advances the auction to ASSIGNMENT_PHASE when all open products have demand <= supply"
    roles: [AuctionAdmin]
    code: 200
    input: []
    output: ClockRound
    side_effects: ["bids SUBMITTED -> PROCESSED", "activity_requirement applied", "possibly Auction CLOCK_ACTIVE -> ASSIGNMENT_PHASE"]
  - method: POST
    path: /spectrum-auctions/rounds/{id}/bids
    description: "Place a clock bid. Bidder X-User-ID must be a QUALIFIED applicant of the round's auction; round OPEN; auction CLOCK_ACTIVE; product present in round prices; quantity 1..supply_per_area; cumulative round activity <= eligibility_units; one bid per (round, bidder, product)."
    roles: [Bidder]
    code: 201
    input: [area_code, category, quantity]
    output: Bid
    side_effects: ["Bid created SUBMITTED with units_snapshot", "ClockRound.aggregate_demand live-updated"]
  - method: GET
    path: /spectrum-auctions/rounds/{id}/bids
    description: "List bids of a round (reverse-reach for Bid.round_id)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: ["bidder_applicant_id?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []
  - method: GET
    path: /spectrum-auctions/applicants/{id}/bids
    description: "List bids by an applicant (reverse-reach for Bid.bidder_applicant_id)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: ["round_id?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []

  - method: POST
    path: /spectrum-auctions/auctions/{id}/assignment-bids
    description: "Sealed assignment-phase bid for a product the caller won in the final clock round. One per (bidder, product)."
    roles: [Bidder]
    code: 201
    input: [area_code, category, amount_cents]
    output: AssignmentBid
    side_effects: []
  - method: GET
    path: /spectrum-auctions/auctions/{id}/assignment-bids
    description: "List assignment bids of an auction (reverse-reach for AssignmentBid.auction_id)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: AssignmentBid[]
    side_effects: []
  - method: GET
    path: /spectrum-auctions/applicants/{id}/assignment-bids
    description: "List assignment bids by an applicant (reverse-reach for AssignmentBid.bidder_applicant_id)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: AssignmentBid[]
    side_effects: []

  - method: GET
    path: /spectrum-auctions/licenses
    description: "List/search licenses (reverse-reach for License.auction_id, License.area_id, License.holder_applicant_id)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: ["auction_id?", "area_id?", "holder_applicant_id?", "status?", "limit?", "offset?"]
    output: License[]
    side_effects: []
  - method: GET
    path: /spectrum-auctions/licenses/{id}
    description: "Read one License (prices, credit_pct, paid_cents, grant_date, term_end, lease window, status)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: []
    output: License
    side_effects: []
  - method: POST
    path: /spectrum-auctions/licenses/{id}/settlement-payments
    description: "Pay toward net_price_cents. When paid_cents reaches net_price_cents the license goes ACTIVE (granted): grant_date stamped, term_end computed, the two buildout milestones created. Blocked while any incumbent in the area is not CLEARED."
    roles: [Bidder]
    code: 200
    input: [amount_cents]
    output: License
    side_effects: ["paid_cents += amount", "on full payment: License PENDING_PAYMENT -> ACTIVE, grant_date/term_end set, BuildoutMilestones INTERIM+FINAL created PENDING"]
  - method: GET
    path: /spectrum-auctions/licenses/{id}/buildout-milestones
    description: "List buildout milestones of a license (reverse-reach for BuildoutMilestone.license_id). Ordering: created_at ASC; the two milestones created in one grant request are ordered INTERIM before FINAL."
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: BuildoutMilestone[]
    side_effects: []
  - method: POST
    path: /spectrum-auctions/buildout-milestones/{id}/file-notice
    description: "File a construction/coverage notice (OCC-guarded). Valid from PENDING or REJECTED while the license is ACTIVE or RENEWAL_REVIEW."
    roles: [Bidder]
    code: 200
    input: [covered_population, expected_milestone_version]
    output: BuildoutMilestone
    side_effects: ["Milestone -> FILED, covered_population recorded", "increments BuildoutMilestone.version by 1"]
  - method: POST
    path: /spectrum-auctions/buildout-milestones/{id}/review
    description: "Admin review of a FILED milestone. decision in {ACCEPT, REJECT}; ACCEPT requires the coverage cross-multiplication to hold."
    roles: [AuctionAdmin]
    code: 200
    input: [decision]
    output: BuildoutMilestone
    side_effects: ["Milestone FILED -> ACCEPTED or REJECTED"]
  - method: POST
    path: /spectrum-auctions/licenses/{id}/transfer-applications
    description: "File a secondary-market transfer or lease. License must be ACTIVE; caller must be the holder. Computes unjust_enrichment_cents at filing from the logical clock. LEASE requires lease_start/lease_end and must not overlap an approved lease window (half-open semantics)."
    roles: [Bidder]
    code: 201
    input: [transfer_type, transferee_applicant_id, "lease_start?", "lease_end?"]
    output: TransferApplication
    side_effects: ["TransferApplication created FILED with unjust_enrichment_cents computed"]
  - method: GET
    path: /spectrum-auctions/licenses/{id}/transfer-applications
    description: "List transfer applications of a license (reverse-reach for TransferApplication.license_id)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: TransferApplication[]
    side_effects: []
  - method: GET
    path: /spectrum-auctions/applicants/{id}/transfer-applications
    description: "List transfer applications where the applicant is transferor or transferee (reverse-reach for TransferApplication.transferor_applicant_id and TransferApplication.transferee_applicant_id)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: TransferApplication[]
    side_effects: []
  - method: GET
    path: /spectrum-auctions/transfer-applications/{id}
    description: "Read one TransferApplication (status, unjust_enrichment_cents)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: []
    output: TransferApplication
    side_effects: []
  - method: POST
    path: /spectrum-auctions/transfer-applications/{id}/review
    description: "Transfer adjudication driver. action in {BEGIN_REVIEW, REQUEST_INFO, APPROVE, DENY} restricted to TransferReviewer; action PROVIDE_INFO restricted to the Bidder who is the transferor. APPROVE with unjust_enrichment_cents > 0 requires confirm_unjust_enrichment_repayment: true."
    roles: [TransferReviewer, Bidder]
    code: 200
    input: [action, "confirm_unjust_enrichment_repayment?"]
    output: TransferApplication
    side_effects: ["FULL_ASSIGNMENT approval rewrites License.holder_applicant_id", "LEASE approval sets the license lease window fields"]
  - method: POST
    path: /spectrum-auctions/transfer-applications/{id}/withdraw
    description: "Transferor withdraws a FILED or INFO_REQUESTED application"
    roles: [Bidder]
    code: 200
    input: []
    output: TransferApplication
    side_effects: ["TransferApplication -> WITHDRAWN"]

  - method: POST
    path: /spectrum-auctions/incumbents
    description: "Register an Incumbent occupying a license area of a band plan"
    roles: [AuctionAdmin]
    code: 201
    input: [band_plan_id, area_id, callsign, relocation_cost_cents]
    output: Incumbent
    side_effects: []
  - method: GET
    path: /spectrum-auctions/incumbents
    description: "List/search incumbents (reverse-reach for Incumbent.band_plan_id and Incumbent.area_id)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: ["band_plan_id?", "area_id?", "status?", "limit?", "offset?"]
    output: Incumbent[]
    side_effects: []
  - method: GET
    path: /spectrum-auctions/incumbents/{id}
    description: "Read one Incumbent (windows, shares_proportional, shares_equal, status)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: []
    output: Incumbent
    side_effects: []
  - method: POST
    path: /spectrum-auctions/incumbents/{id}/transition
    description: "Incumbent machine driver. action in {SUBMIT_PLAN, DISPUTE, RESUBMIT_PLAN, CONFIRM_CLEARED} restricted to the IncumbentOperator who owns the record; action BEGIN_RELOCATION restricted to AuctionAdmin and requires transition_window_start/transition_window_end honoring the buffer rule."
    roles: [IncumbentOperator, AuctionAdmin]
    code: 200
    input: [action, "transition_window_start?", "transition_window_end?"]
    output: Incumbent
    side_effects: ["BEGIN_RELOCATION records the window", "CONFIRM_CLEARED computes shares_proportional/shares_equal and posts License.relocation_share_owed_cents"]

  - method: POST
    path: /spectrum-auctions/licenses/{id}/renewal-applications
    description: "File for renewal inside the renewal window; moves the license ACTIVE -> RENEWAL_REVIEW and creates the RenewalApplication (FILED, then immediately UNDER_REVIEW per §1.2)"
    roles: [Bidder]
    code: 201
    input: []
    output: RenewalApplication
    side_effects: ["RenewalApplication created", "License ACTIVE -> RENEWAL_REVIEW"]
  - method: GET
    path: /spectrum-auctions/licenses/{id}/renewal-applications
    description: "List renewal applications of a license (reverse-reach for RenewalApplication.license_id)"
    roles: [AuctionAdmin, Bidder, IncumbentOperator, TransferReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: RenewalApplication[]
    side_effects: []
  - method: POST
    path: /spectrum-auctions/renewal-applications/{id}/decide
    description: "Renewal adjudication. decision in {GRANT, DENY}; GRANT returns the license to ACTIVE with term_end += RENEWAL_EXTENSION_DAYS days; DENY terminates the license with cascades."
    roles: [TransferReviewer]
    code: 200
    input: [decision]
    output: RenewalApplication
    side_effects: ["GRANT: License RENEWAL_REVIEW -> ACTIVE, term_end extended", "DENY: License -> TERMINATED, pending transfers DENIED, available_supply +1"]

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AuctionAdmin
    description: "Commission auction staff: band planning, auction lifecycle, rounds, qualification review, milestone review, incumbent registration and relocation scheduling. Segregated from transfer/renewal adjudication."
    identity: opaque
    exclusive_operations:
      - "POST /spectrum-auctions/band-plans* and /license-areas, /license-blocks (band planning)"
      - "POST /spectrum-auctions/auctions and /phase (auction lifecycle)"
      - "POST /spectrum-auctions/auctions/{id}/rounds and POST /spectrum-auctions/rounds/{id}/close (clock management)"
      - "POST /spectrum-auctions/applicants/{id}/review (qualification, disqualification)"
      - "POST /spectrum-auctions/buildout-milestones/{id}/review"
      - "POST /spectrum-auctions/incumbents and transition action=BEGIN_RELOCATION"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: Bidder
    description: "Auction applicant / license holder. X-User-ID equals the Applicant.id returned by self-registration; ownership is enforced on every state-changing call."
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /spectrum-auctions/applicants (self-registration), PATCH disclosure, upfront-payments, resubmit, withdraw"
      - "POST /spectrum-auctions/rounds/{id}/bids and /auctions/{id}/assignment-bids"
      - "POST /spectrum-auctions/licenses/{id}/settlement-payments and /renewal-applications"
      - "POST /spectrum-auctions/buildout-milestones/{id}/file-notice"
      - "POST /spectrum-auctions/licenses/{id}/transfer-applications, transfer review action=PROVIDE_INFO, transfer withdraw"
    shared_operations: ["all GET endpoints"]
  - name: IncumbentOperator
    description: "Incumbent licensee being relocated. X-User-ID equals the Incumbent.id registered by the AuctionAdmin."
    identity: "entity_backed:Incumbent"
    exclusive_operations:
      - "POST /spectrum-auctions/incumbents/{id}/transition actions SUBMIT_PLAN, DISPUTE, RESUBMIT_PLAN, CONFIRM_CLEARED"
    shared_operations: ["all GET endpoints"]
  - name: TransferReviewer
    description: "Adjudicator for secondary-market transfers and renewals. Disjoint from AuctionAdmin (segregation of duties): no request may both administer an auction and adjudicate a transfer."
    identity: opaque
    exclusive_operations:
      - "POST /spectrum-auctions/transfer-applications/{id}/review actions BEGIN_REVIEW, REQUEST_INFO, APPROVE, DENY"
      - "POST /spectrum-auctions/renewal-applications/{id}/decide"
    shared_operations: ["all GET endpoints"]
