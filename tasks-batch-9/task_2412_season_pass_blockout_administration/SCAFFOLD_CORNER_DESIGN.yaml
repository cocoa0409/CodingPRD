# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage index
# Season Pass & Blockout Administration.
# `section:` values and `claim_type:` values come only from
# references/claim-extraction-guide.md; corners already asserted by §1.8 appear
# as `excluded_because:` stubs naming the covering difficulty instance.
# Default logical clock (when /_clock/set_current_utc is never called): 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: pass_program_creation_returns_envelope_and_system_fields
        claim_type: creation
        grounds:
          - entities.PassProgram
          - endpoints[POST /pass-programs]
          - response_envelope
        distinguishing_aspect: "A program created with only its three required inputs comes back 201 with status DESIGN, version 1, an unprefixed UUID id and the fixed success envelope; every revenue rollup starts at 0."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /pass-programs"
              payload: { season_year: 2027, park_name: "Harbor Bay", early_bird_deadline: "2027-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
          assert:
            - "HTTP 201; response has meta.api_request_id, meta.api_request_timestamp and response_type == 'object'"
            - "data.season_year == 2027, data.park_name == 'Harbor Bay', data.early_bird_deadline == '2027-11-15'"
            - "data.status == 'DESIGN' (the declared initial_state)"
            - "data.id is a bare UUID with no type prefix; data.version == 1; data.created_at and data.updated_at are ISO 8601 UTC with three fractional digits"
            - "data.base_revenue_cents == 0, data.recognized_revenue_cents == 0, data.deferred_revenue_cents == 0, data.forfeited_revenue_cents == 0, data.active_pass_count == 0"

      - name: pass_program_threshold_defaults_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.PassProgram.fields.capacity_peak_threshold_pct
          - entities.PassProgram.fields.delinquency_suspension_threshold
          - entities.PassProgram.fields.sharing_case_auto_open_score
          - endpoints[POST /pass-programs]
        distinguishing_aspect: "Omitting the six optional threshold inputs yields exactly the declared defaults (0.85 / 0.97 / 2 / 2 / 3 / 65); supplying them overrides each one, so the defaults are defaults and not hardcoded constants."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog_default: "$.data.id" }
          trigger:
            - call: "POST /pass-programs"
              payload: { season_year: 2027, park_name: "Harbor Bay", early_bird_deadline: "2027-10-01", capacity_peak_threshold_pct: 0.80, capacity_lock_threshold_pct: 0.95, capacity_lock_blockout_max_rank: 1, delinquency_suspension_threshold: 3, default_threshold: 4, sharing_case_auto_open_score: 50 }
              as: ProgramAdmin
              captures: { prog_custom: "$.data.id" }
          assert:
            - "GET /pass-programs/${prog_default} → data.capacity_peak_threshold_pct == 0.85, data.capacity_lock_threshold_pct == 0.97, data.capacity_lock_blockout_max_rank == 2"
            - "GET /pass-programs/${prog_default} → data.delinquency_suspension_threshold == 2, data.default_threshold == 3, data.sharing_case_auto_open_score == 65"
            - "trigger response data.capacity_peak_threshold_pct == 0.80, data.capacity_lock_threshold_pct == 0.95, data.capacity_lock_blockout_max_rank == 1"
            - "trigger response data.delinquency_suspension_threshold == 3, data.default_threshold == 4, data.sharing_case_auto_open_score == 50"

      - name: pass_tier_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.PassTier
          - endpoints[GET /pass-tiers/{tier_id}]
        distinguishing_aspect: "A single-tier read returns every stored input field byte-identically plus status DRAFT, proving the write was persisted rather than echoed."
        test_recipe:
          setup:
            - "A program in DESIGN with one tier created and left unpublished."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "SILVER", tier_rank: 2, base_price_cents: 18000, parking_benefit: "DISCOUNT", in_park_discount_pct: 0.10, reservation_required_on_peak: true, peak_reservation_quota: 3 }
              as: ProgramAdmin
              captures: { silver: "$.data.id" }
          trigger:
            - call: "GET /pass-tiers/${silver}"
              as: PassOfficeClerk
          assert:
            - "data.program_id == '${prog}', data.name == 'SILVER', data.tier_rank == 2, data.base_price_cents == 18000"
            - "data.parking_benefit == 'DISCOUNT', data.in_park_discount_pct == 0.10, data.reservation_required_on_peak == true, data.peak_reservation_quota == 3"
            - "data.status == 'DRAFT' and data.version == 1"

      - name: park_day_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /park-days]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three park days with limit=2 return total_count 3 and has_more true on the first page and has_more false on the second; the program_id filter narrows the set without changing the envelope shape."
        test_recipe:
          setup:
            - "One program with three park days (2026-08-10, 2026-08-11, 2026-08-12), all STANDARD."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-08-10", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-08-11", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-08-12", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
          trigger:
            - call: "GET /park-days?program_id=${prog}&limit=2&offset=0"
              as: ProgramAdmin
          assert:
            - "response_type == 'array'; data.limit == 2, data.offset == 0, data.total_count == 3, data.has_more == true"
            - "the page carries exactly 2 rows: data[0].calendar_date == '2026-08-10' and data[1].calendar_date == '2026-08-11'"
            - "GET /park-days?program_id=${prog}&limit=2&offset=2 → data.total_count == 3, data.has_more == false, one row with calendar_date '2026-08-12'"
            - "GET /park-days (no filter, defaults applied) → data.limit == 10 and data.offset == 0"

      - name: season_pass_read_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=14]
          - errors[ERR_PASS_NOT_FOUND]
          - endpoints[GET /season-passes/{pass_id}]
        distinguishing_aspect: "A syntactically valid UUID that no SeasonPass carries produces ERR_PASS_NOT_FOUND (404), not an empty 200 body and not a 400."
        test_recipe:
          setup:
            - "Empty database (no season passes exist)."
          setup_api_calls: []
          trigger:
            - call: "GET /season-passes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PassOfficeClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == 'ERR_PASS_NOT_FOUND' and data.message == 'Season pass not found'"
            - "response_type == 'error' and the envelope still carries meta.api_request_id"

      - name: passholder_creation_without_email_is_rejected
        claim_type: required_fields
        grounds:
          - entities.Passholder.fields.email
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /passholders]
        distinguishing_aspect: "email carries source: input with no default, so omitting it fails schema validation at priority 4 with ERR_INVALID_REQUEST (400) before any business rule runs."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /passholders → data.total_count == 0 (nothing was persisted)"
            - "the same call with email 'ada@example.com' added returns 201 with data.status == 'ACTIVE', data.sharing_risk_score == 0, data.photo_mismatch_count == 0"

      - name: park_day_capacity_fields_are_computed_from_the_forecast
        claim_type: computed_fields
        grounds:
          - entities.ParkDay.fields.forecast_utilization_pct
          - entities.ParkDay.fields.reservation_slot_capacity
          - calculations.park_day_capacity_posture
          - endpoints[POST /park-days]
        distinguishing_aspect: "Only capacity_total and forecast_attendance are supplied; utilisation (0.2500), day_class, reservation_slot_capacity (min(80, 600) == 80), window_slot_capacity (40) and remaining_slot_count are all derived server-side at creation."
        test_recipe:
          setup:
            - "A program in DESIGN."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
          trigger:
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-08-14", capacity_total: 800, forecast_attendance: 200 }
              as: ProgramAdmin
              captures: { day: "$.data.id" }
          assert:
            - "data.forecast_utilization_pct == 0.2500 (200 / 800, four decimals)"
            - "data.day_class == 'STANDARD' (0.2500 < 0.85)"
            - "data.reservation_slot_capacity == 80 (min(floor(800 * 0.10) == 80, 800 - 200 == 600))"
            - "data.window_slot_capacity == 40 (max(1, floor(80 / 2)))"
            - "data.remaining_slot_count == 80, data.reserved_count == 0, data.released_count == 0, data.redeemed_count == 0, data.no_show_count == 0, data.grant_count == 0"

      - name: season_pass_media_number_minted_in_creation_order
        claim_type: system_fields
        grounds:
          - entities.SeasonPass.fields.media_number
          - entities.SeasonPass.fields.pass_status
          - endpoints[POST /season-passes]
        distinguishing_aspect: "media_number is system-minted as SP-000001, SP-000002 in created_at ASC order and is never taken from the request; the second pass proves the sequence advances rather than restarting."
        test_recipe:
          setup:
            - "Program in SALES_OPEN with a PUBLISHED BRONZE tier; two registered passholders."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
            - call: "POST /passholders"
              payload: { full_name: "Ben Holder", email: "ben@example.com", date_of_birth: "1988-06-11" }
              as: PassOfficeClerk
              captures: { holder_b: "$.data.id" }
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { pass_a: "$.data.id", media_a: "$.data.media_number" }
          trigger:
            - call: "POST /season-passes"
              payload: { program_id: "${prog}", tier_id: "${bronze}", passholder_id: "${holder_b}", payment_mode: "PAYMENT_PLAN" }
              as: PassOfficeClerk
              captures: { pass_b: "$.data.id" }
          assert:
            - "GET /season-passes/${pass_a} → data.media_number == 'SP-000001'"
            - "trigger response data.media_number == 'SP-000002'"
            - "trigger response data.pass_status == 'PENDING_PROCESSING', data.billing_status == 'UNBILLED', data.photo_captured == false, data.identity_bound == false, data.photo_hash == null"
            - "trigger response data.contract_value_cents == 12000, data.billed_total_cents == 12000, data.paid_to_date_cents == 0, data.credited_amount_cents == 0, data.outstanding_balance_cents == 12000"
            - "GET /season-passes/${pass_a} → data.billing_status == 'PAID_IN_FULL' and data.paid_to_date_cents == 12000 (PAY_IN_FULL settles on sale)"

      - name: pass_tier_rank_above_the_declared_maximum_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.PassTier.fields.tier_rank
          - entities.PassTier.fields.in_park_discount_pct
          - validations[priority=4]
          - endpoints[POST /pass-tiers]
        distinguishing_aspect: "tier_rank is constrained to 1..9 and in_park_discount_pct to 0..0.30; a rank of 10 and a discount of 0.45 each fail at priority 4 with ERR_INVALID_REQUEST, and an out-of-enum parking_benefit does the same."
        test_recipe:
          setup:
            - "A program in DESIGN."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
          trigger:
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "TITANIUM", tier_rank: 10, base_price_cents: 90000, parking_benefit: "INCLUDED", in_park_discount_pct: 0.20, reservation_required_on_peak: false, peak_reservation_quota: 9 }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 with data.error_id == 'ERR_INVALID_REQUEST' (tier_rank 10 > 9)"
            - "the same call with in_park_discount_pct 0.45 and tier_rank 4 also returns ERR_INVALID_REQUEST (0.45 > 0.30)"
            - "the same call with parking_benefit 'VALET' returns ERR_INVALID_REQUEST (value outside the declared enum)"
            - "GET /pass-tiers?program_id=${prog} → data.total_count == 0"

      - name: season_pass_creation_with_unknown_program_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.SeasonPass.fields.program_id
          - validations[priority=10]
          - errors[ERR_PROGRAM_NOT_FOUND]
          - endpoints[POST /season-passes]
        distinguishing_aspect: "A body program_id that no PassProgram carries is an existence failure at priority 10 (404 ERR_PROGRAM_NOT_FOUND), and it outranks the tier/passholder existence checks that would also fail on the same call."
        test_recipe:
          setup:
            - "One real program with a PUBLISHED BRONZE tier and one registered passholder, so tier_id and passholder_id are valid."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
            - call: "POST /passholders"
              payload: { full_name: "Ada Holder", email: "ada@example.com", date_of_birth: "1990-04-02" }
              as: PassOfficeClerk
              captures: { holder_a: "$.data.id" }
          trigger:
            - call: "POST /season-passes"
              payload: { program_id: "11111111-2222-3333-4444-555555555555", tier_id: "${bronze}", passholder_id: "${holder_a}", payment_mode: "PAY_IN_FULL" }
              as: PassOfficeClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == 'ERR_PROGRAM_NOT_FOUND'"
            - "GET /season-passes → data.total_count == 0"
            - "the same call with a bogus passholder_id but the real program_id returns ERR_PASSHOLDER_NOT_FOUND (priority 13), confirming the checks are per-reference"

      - name: blockout_assignment_is_a_tier_by_park_day_junction_row
        claim_type: creation
        grounds:
          - entities.BlockoutAssignment
          - complexity_profile.entity_topology
          - endpoints[POST /blockout-assignments]
          - endpoints[GET /blockout-assignments]
        distinguishing_aspect: "The graph topology's junction entity: one ParkDay can carry blockouts for several tiers and one tier can be blocked on several days, and both directions are listable through the tier_id and park_day_id filters."
        test_recipe:
          setup:
            - "Program in DESIGN with BRONZE (rank 1) and GOLD (rank 3) tiers; two park days 2026-08-20 and 2026-08-21, both STANDARD (blockout assignment needs no particular program or tier status)."
            - "BRONZE is blocked on 2026-08-20 and GOLD is blocked on 2026-08-20 as well, each using the day's version at the time of the write."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "GOLD", tier_rank: 3, base_price_cents: 30000, parking_benefit: "INCLUDED", in_park_discount_pct: 0.15, reservation_required_on_peak: false, peak_reservation_quota: 5 }
              as: ProgramAdmin
              captures: { gold: "$.data.id" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-08-20", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_20: "$.data.id", day_20_v: "$.data.version" }
            - call: "POST /park-days"
              payload: { program_id: "${prog}", calendar_date: "2026-08-21", capacity_total: 1000, forecast_attendance: 100 }
              as: ProgramAdmin
              captures: { day_21: "$.data.id", day_21_v: "$.data.version" }
            - call: "POST /blockout-assignments"
              payload: { tier_id: "${bronze}", park_day_id: "${day_20}", expected_park_day_version: "${day_20_v}" }
              as: ProgramAdmin
              captures: { blk_1: "$.data.id" }
            - call: "GET /park-days/${day_20}"
              as: ProgramAdmin
              captures: { day_20_v2: "$.data.version" }
            - call: "POST /blockout-assignments"
              payload: { tier_id: "${gold}", park_day_id: "${day_20}", expected_park_day_version: "${day_20_v2}" }
              as: ProgramAdmin
              captures: { blk_2: "$.data.id" }
          trigger:
            - call: "POST /blockout-assignments"
              payload: { tier_id: "${bronze}", park_day_id: "${day_21}", expected_park_day_version: "${day_21_v}" }
              as: ProgramAdmin
              captures: { blk_3: "$.data.id" }
          assert:
            - "trigger response data.tier_id == '${bronze}', data.park_day_id == '${day_21}', data.source == 'MANUAL', data.status == 'ACTIVE', data.lift_reason == null"
            - "GET /blockout-assignments?park_day_id=${day_20} → data.total_count == 2 (one day, two tiers)"
            - "GET /blockout-assignments?tier_id=${bronze} → data.total_count == 2 (one tier, two days)"
            - "GET /blockout-assignments?tier_id=${gold} → data.total_count == 1"

      - name: upgrade_order_settlement_fields_are_computed
        claim_type: computed_fields
        grounds:
          - entities.UpgradeOrder.fields.total_due_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / upgrade_settlement_order_credit_cap_then_fee_tier
          rationale: "That instance asserts every computed settlement field (gross, raw credit, credit, net, admin fee, total, quote expiry) as literals on a single quote."

      - name: payment_plan_amortization_fields_are_computed
        claim_type: computed_fields
        grounds:
          - entities.PaymentPlan.fields.monthly_amount_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / plan_amortization_residual_on_final_installment
          rationale: "financed_amount_cents, monthly_amount_cents, final_installment_cents and the whole Installment schedule are asserted there as literals."

  # ===========================================================================
  # State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: program_advance_status_design_to_sales_open
        claim_type: valid_transition
        grounds:
          - state_machines.PassProgram.DESIGN_to_SALES_OPEN
          - endpoints[POST /pass-programs/{program_id}/advance-status]
        distinguishing_aspect: "The first lifecycle step: a DESIGN program moves to SALES_OPEN, its version increments, and passes may then be sold."
        test_recipe:
          setup:
            - "A program in DESIGN with a PUBLISHED BRONZE tier."
          setup_api_calls:
            - call: "POST /pass-programs"
              payload: { season_year: 2026, park_name: "Summit Ridge", early_bird_deadline: "2026-11-15" }
              as: ProgramAdmin
              captures: { prog: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /pass-tiers"
              payload: { program_id: "${prog}", name: "BRONZE", tier_rank: 1, base_price_cents: 12000, parking_benefit: "NONE", in_park_discount_pct: 0.05, reservation_required_on_peak: true, peak_reservation_quota: 2 }
              as: ProgramAdmin
              captures: { bronze: "$.data.id" }
            - call: "POST /pass-tiers/${bronze}/status"
              payload: { target_status: "PUBLISHED" }
              as: ProgramAdmin
          trigger:
            - call: "POST /pass-programs/${prog}/advance-status"
              payload: { target_status: "SALES_OPEN" }
              as: ProgramAdmin
          assert:
            - "data.status == 'SALES_OPEN' and data.version == 2 (was 1 at creation)"
            - "GET /pass-programs?status=SALES_OPEN → data.total_count == 1"
            - "a subsequent POST /season-passes for this program now succeeds with 201"

      - name: pass_tier_creation_after_season_active_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PassTier.transitions
          - validations[priority=41]
          - errors[ERR_PROGRAM_STATUS_INVALID]
          - endpoints[POST /pass-tiers]
        distinguishing_aspect: "Tier design closes once the season starts: creating a tier is only permitted while the program is DESIGN or SALES_OPEN, so the same call that succeeded before the advance fails with ERR_PROGRAM_STATUS_INVALID (409) after it."
        test_recipe:
          setup:
