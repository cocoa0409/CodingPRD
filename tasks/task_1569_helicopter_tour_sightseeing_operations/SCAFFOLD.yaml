# =============================================================================
# SCAFFOLD.yaml — task_1569_helicopter_tour_sightseeing_operations
# Helicopter Tour & Sightseeing Operations (Grand Canyon tour operator)
# =============================================================================

scenario: |
  Helicopter Tour & Sightseeing Operations (Grand Canyon tour operator): route/altitude compliance & noise-abatement rules, passenger weight & balance manifest, seat pricing by route length & season, weather cancellation & rebooking credit, load rotation & turn time, pilot duty limits across a high-cycle day, safety briefing & waiver, community complaint tracking

domain_name: helicopter-tour-ops
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing        # flight blocks + turn buffers, season windows, quiet-hours windows, complaint rolling window
  secondary_archetype: posture_driven           # Base weather posture gates dispatch; Route suspension gates scheduling
  complexity_layers:
    - optimistic_concurrency                    # OCC on Flight, Booking, Base
    - cascading_side_effects                    # complaint-quota cascade, weather cascade, ground cascade
    - dual_variant_calculation                  # manifest estimate vs final W&B; duty scheduled-projection vs actual ledger
    - rate_threshold_triggers                   # load-factor price tiers, duty/flight-time limits, complaint quota, refund tiers
  entity_topology: flat                         # peer resources joined by FK references; no nested write paths
  state_machine_shape: cyclic                   # Booking CONFIRMED<->CHECKED_IN, Flight SCHEDULED<->DELAYED, Complaint reopen loop, Aircraft maintenance loop
  relationship_patterns:
    - one_to_many                               # Booking->Passenger, Flight->Booking, Pilot->DutyDay
    - cross_aggregate                           # Flight references Route/Aircraft/Pilot/Base across aggregate roots
  role_model: segregation_of_duties             # flight creator may not dispatch the same flight; pilot ack is entity-backed
  consistency_model: immediate                  # every mutation + cascade visible in the same response

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (12 entities)
# =============================================================================
entities:
  - name: Base
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Operating base (heliport) display name" }
      - { name: quiet_hours_start_min_utc, type: integer, source: input, description: "Noise-quiet window start, minutes since 00:00 UTC, inclusive" }
      - { name: quiet_hours_end_min_utc, type: integer, source: input, description: "Noise-quiet window end, minutes since 00:00 UTC, exclusive" }
      - { name: weather_ceiling_min_ft, type: integer, source: input, default: 1000, description: "Minimum ceiling in feet; observation below this is adverse" }
      - { name: weather_visibility_min_sm, type: integer, source: input, default: 3, description: "Minimum visibility in statute miles; below is adverse" }
      - { name: weather_wind_max_kt, type: integer, source: input, default: 25, description: "Maximum wind in knots; above is adverse" }
      - { name: weather_validity_min, type: integer, source: input, default: 60, description: "Minutes an observation stays valid" }
      - { name: current_waiver_version, type: string, source: input, description: "Waiver text version new bookings must pin" }
      - { name: complaint_quota_threshold, type: integer, source: input, default: 3, description: "Substantiated complaints in window that auto-suspend a route (>=)" }
      - { name: complaint_window_days, type: integer, source: input, default: 30, description: "Rolling window in days for the complaint quota (inclusive lower bound)" }
      - { name: hold_expire_minutes, type: integer, source: input, default: 30, description: "Minutes a HELD booking lives before expiry" }
      - { name: posture, type: enum, source: computed, description: "NORMAL | WEATHER_HOLD — derived from latest valid WeatherObservation on read" }
      - { name: ops_run_index, type: integer, source: system, description: "Batch tick counter, starts at 0, +1 per run-ops" }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: route_code, type: string, source: input, description: "Unique route code", constraints: "unique across all routes" }
      - { name: tier, type: enum, source: input, description: "SHORT | STANDARD | GRAND — drives turn_minutes" }
      - { name: duration_minutes, type: integer, source: input, description: "Scheduled block time in minutes" }
      - { name: base_seat_price_cents, type: integer, source: input, description: "Per-seat base price in cents before multipliers" }
      - { name: fuel_required_lb, type: integer, source: input, description: "Planned fuel load in pounds for this route" }
      - { name: min_altitude_ft, type: integer, source: input, description: "Minimum cruise altitude AGL (informational compliance floor)" }
      - { name: noise_sensitive, type: boolean, source: input, description: "If true, quiet-hours window applies to non-QUIET aircraft" }
      - { name: noise_zones, type: array, source: input, description: "Community zones overflown: subset of VILLAGE | RIM | AIRPORT" }
      - { name: min_aircraft_noise_class, type: enum, source: input, description: "QUIET_ONLY | ANY — fleet noise-class requirement for this route" }
      - { name: turn_minutes, type: integer, source: computed, description: "Turnaround buffer derived from tier: SHORT 15, STANDARD 25, GRAND 40" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }
      - { name: substantiated_complaints_30d, type: integer, source: computed, description: "Count of SUBSTANTIATED complaints matched to this route with observed_at in [now - complaint_window_days, now]" }

  - name: Season
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Season label" }
      - { name: start_date, type: string, source: input, description: "First covered date, YYYY-MM-DD, inclusive" }
      - { name: end_date, type: string, source: input, description: "First uncovered date, YYYY-MM-DD, exclusive; must be > start_date" }
      - { name: multiplier_bps, type: integer, source: input, description: "Price multiplier in basis points (10000 = 1.00x)", constraints: "1..30000" }
      - { name: status, type: enum, source: system, description: "PUBLISHED | RETIRED" }

  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - { name: tail_number, type: string, source: input, description: "Unique tail number", constraints: "unique across all aircraft" }
      - { name: seat_capacity, type: integer, source: input, description: "Passenger seat count" }
      - { name: empty_weight_lb, type: integer, source: input, description: "Operating empty weight in pounds" }
      - { name: empty_moment_lb_in, type: integer, source: input, description: "Empty-weight moment in lb*in about the datum" }
      - { name: max_takeoff_weight_lb, type: integer, source: input, description: "Maximum takeoff weight (MTOW) in pounds" }
      - { name: fuel_arm_inches, type: number, source: input, description: "Fuel station arm in inches" }
      - { name: seat_arms_inches, type: array, source: input, description: "Arm in inches per seat index 0..seat_capacity-1; length must equal seat_capacity" }
      - { name: cg_forward_limit_in, type: number, source: input, description: "Forward CG limit in inches, inclusive" }
      - { name: cg_aft_limit_in, type: number, source: input, description: "Aft CG limit in inches, inclusive" }
      - { name: noise_class, type: enum, source: input, description: "QUIET | STANDARD" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | IN_MAINTENANCE | GROUNDED" }

  - name: Pilot
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Pilot name" }
      - { name: certificate_no, type: string, source: input, description: "Unique certificate number", constraints: "unique across all pilots" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | FATIGUE_LOCKED" }

  - name: DutyDay
    parent: null
    common_fields: true
    fields:
      - { name: pilot_id, type: string, source: system, description: "FK -> Pilot.id" }
      - { name: duty_date, type: string, source: system, description: "UTC date YYYY-MM-DD this ledger row covers" }
      - { name: flight_minutes_scheduled, type: integer, source: computed, description: "Sum of route.duration_minutes over the pilot's non-cancelled, non-COMPLETED-with-actual flights this date (forward-looking projection basis)" }
      - { name: flight_minutes_actual, type: integer, source: computed, description: "Sum of actual airborne minutes (actual_departure->actual_arrival) over COMPLETED flights this date" }
      - { name: duty_minutes_projected, type: integer, source: computed, description: "(latest scheduled_arrival + 15) - (earliest scheduled_departure - 45) across the pilot's active flights this date; 0 when no flights" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED" }

  - name: Flight
    parent: null
    common_fields: true
    fields:
      - { name: base_id, type: string, source: input, description: "FK -> Base.id" }
      - { name: route_id, type: string, source: input, description: "FK -> Route.id" }
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id" }
      - { name: pilot_id, type: string, source: input, description: "FK -> Pilot.id" }
      - { name: scheduled_departure_utc, type: datetime, source: input, description: "Scheduled departure instant (ISO8601 UTC)" }
      - { name: scheduled_arrival_utc, type: datetime, source: computed, description: "scheduled_departure_utc + route.duration_minutes" }
      - { name: rotation_seq, type: integer, source: computed, description: "Per (aircraft_id, UTC date) sequence ordered by scheduled_departure_utc ASC, starting at 1" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DELAYED | BOARDING | MANIFEST_CLOSED | DISPATCHED | COMPLETED | CANCELLED_WEATHER | CANCELLED_OPS" }
      - { name: pilot_acknowledged, type: boolean, source: system, description: "True after the assigned pilot's PILOT_ACK", default: false }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the Dispatcher who created the flight" }
      - { name: dispatched_by_user_id, type: string, source: system, description: "X-User-ID of the Dispatcher who dispatched; null until DISPATCH" }
      - { name: actual_departure_utc, type: datetime, source: system, description: "Logical clock at DISPATCH; null until then" }
      - { name: actual_arrival_utc, type: datetime, source: system, description: "Logical clock at COMPLETE; null until then" }
      - { name: cancel_reason, type: enum, source: system, description: "null | WEATHER | ROUTE_SUSPENDED | AIRCRAFT_GROUNDED | OPS_MANUAL" }
      - { name: seats_booked, type: integer, source: computed, description: "Sum of seat_count over bookings in HELD | CONFIRMED | CHECKED_IN | MANIFESTED" }
      - { name: seats_available, type: integer, source: computed, description: "aircraft.seat_capacity - seats_booked" }
      - { name: estimated_gross_weight_lb, type: integer, source: computed, description: "empty_weight + SUM(declared_weight_lb + 5) over active bookings' passengers + route.fuel_required_lb" }
      - { name: manifested_passenger_count, type: integer, source: computed, description: "Passengers with checked_in=true on MANIFESTED bookings; frozen at close-manifest" }
      - { name: manifested_fuel_lb, type: integer, source: computed, description: "Fuel actually boarded after trim; null until close-manifest" }
      - { name: actual_gross_weight_lb, type: integer, source: computed, description: "Final gross weight at close-manifest; null until then" }
      - { name: actual_cg_in, type: number, source: computed, description: "Final center of gravity in inches (0.01, round_half_up); null until close-manifest" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: flight_id, type: string, source: input, description: "FK -> Flight.id" }
      - { name: contact_name, type: string, source: input, description: "Booking contact name" }
      - { name: contact_email, type: string, source: input, description: "Booking contact email" }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | CHECKED_IN | MANIFESTED | FLOWN | CANCELLED | EXPIRED | NO_SHOW | CREDITED" }
      - { name: seat_count, type: integer, source: computed, description: "Number of passengers on the booking" }
      - { name: quoted_per_seat_cents, type: integer, source: computed, description: "Locked per-seat price from seat_price_quote at creation (recomputed and relocked on move)" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "quoted_per_seat_cents * seat_count, locked at creation" }
      - { name: season_id, type: string, source: computed, description: "FK -> Season.id; the PUBLISHED season covering the departure date, null when none (10000 bps fallback)" }
      - { name: credits_applied_cents, type: integer, source: computed, description: "Total cents consumed from applied RebookingCredits" }
      - { name: paid_cents, type: integer, source: system, description: "Card cents collected at confirm; starts 0" }
      - { name: refunded_card_cents, type: integer, source: system, description: "Card cents refunded by cancel/move; starts 0" }
      - { name: credited_cents, type: integer, source: system, description: "Cents converted to rebooking credit on cancel; starts 0" }
      - { name: retained_fee_cents, type: integer, source: system, description: "Cancellation fee retained; starts 0" }
      - { name: waiver_version_pinned, type: string, source: system, description: "Base.current_waiver_version captured at booking creation" }
      - { name: expires_at, type: datetime, source: computed, description: "created_at + base.hold_expire_minutes while HELD; null once CONFIRMED" }

  - name: Passenger
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id" }
      - { name: pax_index, type: integer, source: system, description: "0-based index within the booking, assigned in input order at creation" }
      - { name: full_name, type: string, source: input, description: "Passenger full name; unique within a booking" }
      - { name: declared_weight_lb, type: integer, source: input, description: "Self-declared weight in pounds at booking time" }
      - { name: waiver_signed, type: boolean, source: system, description: "True after SIGN_WAIVER with the pinned version", default: false }
      - { name: waiver_version_signed, type: string, source: system, description: "Version presented at SIGN_WAIVER; null until signed" }
      - { name: briefing_completed, type: boolean, source: system, description: "True after COMPLETE_BRIEFING", default: false }
      - { name: checked_in, type: boolean, source: system, description: "True after CHECK_IN", default: false }
      - { name: actual_weight_lb, type: integer, source: input, description: "Scale-measured weight at CHECK_IN; null until then" }
      - { name: seat_number, type: integer, source: input, description: "Seat index 0..seat_capacity-1 assigned at CHECK_IN; unique per flight" }

  - name: RebookingCredit
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; the booking whose cancellation or move minted this credit" }
      - { name: amount_cents, type: integer, source: system, description: "Issued face value in cents" }
      - { name: redeemed_cents, type: integer, source: system, description: "Cents consumed so far; starts 0" }
      - { name: remaining_cents, type: integer, source: computed, description: "amount_cents - redeemed_cents" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock at issuance" }
      - { name: expires_at, type: datetime, source: system, description: "issued_at + 365 days; expiry check is expires_at <= now" }
      - { name: status, type: enum, source: system, description: "ISSUED | PARTIALLY_REDEEMED | REDEEMED | EXPIRED" }

  - name: WeatherObservation
    parent: null
    common_fields: false
    fields:
      - { name: base_id, type: string, source: input, description: "FK -> Base.id" }
      - { name: observed_at, type: datetime, source: input, description: "Observation instant (ISO8601 UTC)" }
      - { name: ceiling_ft, type: integer, source: input, description: "Cloud ceiling in feet" }
      - { name: visibility_sm, type: integer, source: input, description: "Visibility in statute miles" }
      - { name: wind_kt, type: integer, source: input, description: "Sustained wind in knots" }
      - { name: adverse, type: boolean, source: computed, description: "ceiling < base.weather_ceiling_min_ft OR visibility < min OR wind > max" }
      - { name: validity_until, type: datetime, source: computed, description: "observed_at + base.weather_validity_min" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: base_id, type: string, source: input, description: "FK -> Base.id" }
      - { name: zone, type: enum, source: input, description: "VILLAGE | RIM | AIRPORT" }
      - { name: observed_at, type: datetime, source: input, description: "When the noise event was observed" }
      - { name: description, type: string, source: input, description: "Free-text complaint" }
      - { name: reporter_ref, type: string, source: input, description: "Reporter reference (opaque)" }
      - { name: status, type: enum, source: system, description: "LOGGED | UNDER_REVIEW | SUBSTANTIATED | DISMISSED | CLOSED" }
      - { name: match_status, type: enum, source: system, description: "MATCHED | UNMATCHED" }
      - { name: matched_flight_id, type: string, source: system, description: "FK -> Flight.id; set by auto-match or LINK_FLIGHT; null while UNMATCHED" }
      - { name: matched_route_id, type: string, source: computed, description: "FK -> Route.id; route of the matched flight; null while UNMATCHED" }
      - { name: resolution_note, type: string, source: input, description: "Note captured at CLOSE; null until closed" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Base
    field: posture
    initial_state: NORMAL
    terminal_states: []
    note: "Posture is computed on read from the latest WeatherObservation with observed_at <= now; not directly settable."
    transitions:
      - from: NORMAL
        to: WEATHER_HOLD
        trigger: "system (POST /weather-observations producing adverse=true becomes the latest valid observation)"
        actor: system
        preconditions: ["latest observation with observed_at <= now is adverse and now < its validity_until"]
        side_effects:
          - "Flights of this base with status in {SCHEDULED, DELAYED, BOARDING, MANIFEST_CLOSED} and scheduled_departure_utc in [observed_at, validity_until) -> CANCELLED_WEATHER with cancel_reason=WEATHER"
          - "Each such flight's bookings: HELD -> EXPIRED (no refund); CONFIRMED/CHECKED_IN -> CREDITED, minting a RebookingCredit of paid_cents + credits_applied_cents"
      - from: WEATHER_HOLD
        to: NORMAL
        trigger: "system (a newer non-adverse observation becomes latest, or the adverse observation's validity_until passes)"
        actor: system
        preconditions: []
        side_effects: ["No automatic restoration of cancelled flights"]

  - entity: Route
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (a Complaint SUBSTANTIATE pushes route.substantiated_complaints_30d >= base.complaint_quota_threshold) OR POST /routes/{id}/events (SUSPEND)"
        actor: "system | OpsAdmin"
        preconditions: []
        side_effects:
          - "Flights on this route with status in {SCHEDULED, DELAYED, BOARDING} and scheduled_departure_utc >= now -> CANCELLED_OPS with cancel_reason=ROUTE_SUSPENDED"
          - "Each such flight's bookings: HELD -> EXPIRED; CONFIRMED/CHECKED_IN -> CREDITED, minting a RebookingCredit of paid_cents + credits_applied_cents"
          - "MANIFEST_CLOSED and later flights are NOT cancelled by this cascade"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /routes/{id}/events (RESUME)"
        actor: OpsAdmin
        preconditions: ["route.substantiated_complaints_30d < base.complaint_quota_threshold at resume time (else ERR_ROUTE_QUOTA_STILL_EXCEEDED)"]
        side_effects: []

  - entity: Season
    field: status
    initial_state: PUBLISHED
    terminal_states: [RETIRED]
    transitions:
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /seasons/{id}/events (RETIRE)"
        actor: OpsAdmin
        preconditions: []
        side_effects: ["Retired seasons are excluded from pricing selection and from the overlap check"]

  - entity: Aircraft
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: IN_MAINTENANCE
        trigger: "POST /aircraft/{id}/events (START_MAINTENANCE)"
        actor: OpsAdmin
        preconditions: ["no flight of this aircraft in {SCHEDULED, DELAYED, BOARDING, MANIFEST_CLOSED} with scheduled_departure_utc >= now"]
        side_effects: []
      - from: IN_MAINTENANCE
        to: AVAILABLE
        trigger: "POST /aircraft/{id}/events (END_MAINTENANCE)"
        actor: OpsAdmin
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: GROUNDED
        trigger: "POST /aircraft/{id}/events (GROUND)"
        actor: OpsAdmin
        preconditions: []
        side_effects:
          - "Flights of this aircraft with status in {SCHEDULED, DELAYED, BOARDING, MANIFEST_CLOSED} and scheduled_departure_utc >= now -> CANCELLED_OPS with cancel_reason=AIRCRAFT_GROUNDED"
          - "Each such flight's bookings: HELD -> EXPIRED; CONFIRMED/CHECKED_IN -> CREDITED, minting a RebookingCredit of paid_cents + credits_applied_cents"
      - from: IN_MAINTENANCE
        to: GROUNDED
        trigger: "POST /aircraft/{id}/events (GROUND)"
        actor: OpsAdmin
        preconditions: []
        side_effects: []
      - from: GROUNDED
        to: AVAILABLE
        trigger: "POST /aircraft/{id}/events (RECERTIFY)"
        actor: OpsAdmin
        preconditions: []
        side_effects: []

  - entity: Pilot
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: FATIGUE_LOCKED
        trigger: "system (a COMPLETE transition makes the pilot's DutyDay.flight_minutes_actual >= 480)"
        actor: system
        preconditions: []
        side_effects: ["Pilot cannot be assigned to new flights while FATIGUE_LOCKED"]
      - from: FATIGUE_LOCKED
        to: AVAILABLE
        trigger: "system (run-ops closes every OPEN DutyDay whose duty_date < current UTC date; a pilot with no OPEN DutyDay resets)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DutyDay
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system (run-ops when duty_date < current UTC date)"
        actor: system
        preconditions: []
        side_effects: ["Pilot FATIGUE_LOCKED -> AVAILABLE when the pilot has no remaining OPEN DutyDay"]

  - entity: Flight
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED_WEATHER, CANCELLED_OPS]
    transitions:
      - from: SCHEDULED
        to: DELAYED
        trigger: "POST /flights/{id}/events (DELAY)"
        actor: Dispatcher
        preconditions: ["new_departure_utc > now", "turn/quiet-hours/noise-class/duty checks re-pass at new_departure_utc"]
        side_effects: ["scheduled_departure_utc replaced; scheduled_arrival_utc and rotation_seq recomputed; DutyDay of former and new date adjusted"]
      - from: DELAYED
        to: SCHEDULED
        trigger: "POST /flights/{id}/events (ACCEPT_DELAY)"
        actor: Dispatcher
        preconditions: []
        side_effects: ["Confirms the delayed slot; no field changes"]
      - from: SCHEDULED
        to: BOARDING
        trigger: "POST /flights/{id}/events (OPEN_BOARDING)"
        actor: Dispatcher
        preconditions: ["base posture NORMAL"]
        side_effects: []
      - from: DELAYED
        to: BOARDING
        trigger: "POST /flights/{id}/events (OPEN_BOARDING)"
        actor: Dispatcher
        preconditions: ["base posture NORMAL"]
        side_effects: []
      - from: BOARDING
        to: MANIFEST_CLOSED
        trigger: "POST /flights/{id}/close-manifest"
        actor: Dispatcher
        preconditions:
          - "expected_flight_version matches flight.version (else ERR_STALE_VERSION)"
          - "final W&B passes: fuel trim >= min fuel, gross <= MTOW, CG inside [cg_forward_limit_in, cg_aft_limit_in]"
        side_effects:
          - "manifested_fuel_lb, actual_gross_weight_lb, actual_cg_in, manifested_passenger_count frozen"
          - "Bookings of this flight in CHECKED_IN -> MANIFESTED"
          - "increments flight.version by 1"
      - from: MANIFEST_CLOSED
        to: DISPATCHED
        trigger: "POST /flights/{id}/events (DISPATCH)"
        actor: Dispatcher
        preconditions:
          - "base posture NORMAL (else ERR_WEATHER_HOLD_ACTIVE)"
          - "flight.pilot_acknowledged == true (else ERR_PILOT_ACK_REQUIRED)"
          - "dispatched_by_user_id != created_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTY)"
        side_effects:
          - "actual_departure_utc = now; dispatched_by_user_id set"
          - "Bookings of this flight still in CONFIRMED -> NO_SHOW (no refund, no credit); HELD -> EXPIRED"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /flights/{id}/events (COMPLETE)"
        actor: Dispatcher
        preconditions: ["now > actual_departure_utc"]
        side_effects:
          - "actual_arrival_utc = now"
          - "DutyDay.flight_minutes_actual += (actual_arrival_utc - actual_departure_utc) in whole minutes (floor)"
          - "if DutyDay.flight_minutes_actual >= 480 after update: pilot -> FATIGUE_LOCKED"
          - "Bookings of this flight in MANIFESTED -> FLOWN"
      - from: SCHEDULED
        to: CANCELLED_WEATHER
        trigger: "system (weather cascade) or POST /flights/{id}/events (CANCEL_WEATHER)"
        actor: "system | Dispatcher"
        preconditions: []
        side_effects: ["booking cascade identical to route suspension: HELD->EXPIRED; CONFIRMED/CHECKED_IN->CREDITED with credit minted"]
      - from: DELAYED
        to: CANCELLED_WEATHER
        trigger: "system (weather cascade) or POST /flights/{id}/events (CANCEL_WEATHER)"
        actor: "system | Dispatcher"
        preconditions: []
        side_effects: ["same booking cascade as SCHEDULED->CANCELLED_WEATHER"]
      - from: BOARDING
        to: CANCELLED_WEATHER
        trigger: "system (weather cascade) or POST /flights/{id}/events (CANCEL_WEATHER)"
        actor: "system | Dispatcher"
        preconditions: []
        side_effects: ["same booking cascade as SCHEDULED->CANCELLED_WEATHER"]
      - from: MANIFEST_CLOSED
        to: CANCELLED_WEATHER
        trigger: "system (weather cascade) or POST /flights/{id}/events (CANCEL_WEATHER)"
        actor: "system | Dispatcher"
        preconditions: []
        side_effects: ["MANIFESTED bookings -> CREDITED with credit minted; other bookings cascade as in SCHEDULED->CANCELLED_WEATHER"]
      - from: SCHEDULED
        to: CANCELLED_OPS
        trigger: "system (route suspension or aircraft grounding cascade) or POST /flights/{id}/events (CANCEL_OPS)"
        actor: "system | Dispatcher"
        preconditions: []
        side_effects: ["booking cascade identical to CANCELLED_WEATHER; cancel_reason = ROUTE_SUSPENDED | AIRCRAFT_GROUNDED | OPS_MANUAL"]
      - from: DELAYED
        to: CANCELLED_OPS
        trigger: "system or POST /flights/{id}/events (CANCEL_OPS)"
        actor: "system | Dispatcher"
        preconditions: []
        side_effects: ["same booking cascade"]
      - from: BOARDING
        to: CANCELLED_OPS
        trigger: "system or POST /flights/{id}/events (CANCEL_OPS)"
        actor: "system | Dispatcher"
        preconditions: []
        side_effects: ["same booking cascade"]
      - from: MANIFEST_CLOSED
        to: CANCELLED_OPS
        trigger: "system (aircraft grounding cascade only) or POST /flights/{id}/events (CANCEL_OPS)"
        actor: "system | Dispatcher"
        preconditions: []
        side_effects: ["MANIFESTED bookings -> CREDITED with credit minted; other bookings cascade as usual"]
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /flights/{id}/events (PILOT_ACK)"
        actor: Pilot
        preconditions: ["X-User-ID == flight.pilot_id (else ERR_PILOT_MISMATCH)"]
        side_effects: ["pilot_acknowledged = true"]
        note: "Self-transition carrying the ack flag; also accepted from DELAYED"
      - from: DELAYED
        to: DELAYED
        trigger: "POST /flights/{id}/events (PILOT_ACK)"
        actor: Pilot
        preconditions: ["X-User-ID == flight.pilot_id"]
        side_effects: ["pilot_acknowledged = true"]

  - entity: Booking
    field: status
    initial_state: HELD
    terminal_states: [FLOWN, CANCELLED, EXPIRED, NO_SHOW, CREDITED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: BookingAgent
        preconditions:
          - "now < booking.expires_at (else ERR_BOOKING_HOLD_EXPIRED)"
          - "flight.status in {SCHEDULED, DELAYED}"
          - "card_amount_cents == quoted_total_cents - credits_applied_cents (else ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects: ["paid_cents = card_amount_cents; expires_at cleared"]
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "system (every passenger of the booking has checked_in == true)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CHECKED_IN
        to: CONFIRMED
        trigger: "system (a passenger UNCHECK makes at least one passenger not checked in)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CHECKED_IN
        to: MANIFESTED
        trigger: "system (flight close-manifest succeeds)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MANIFESTED
        to: FLOWN
        trigger: "system (flight COMPLETE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: HELD
        to: CANCELLED
        trigger: "POST /bookings/{id}/events (CANCEL)"
        actor: BookingAgent
        preconditions: []
        side_effects: ["applied credits released back to their RebookingCredits (redeemed_cents reduced, status recomputed)"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /bookings/{id}/events (CANCEL)"
        actor: BookingAgent
        preconditions: []
        side_effects: ["cancellation_settlement runs on paid_cents; credits_applied_cents re-minted as a new RebookingCredit"]
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /bookings/{id}/events (CANCEL)"
        actor: BookingAgent
        preconditions: []
        side_effects: ["same settlement as CONFIRMED->CANCELLED"]
      - from: HELD
        to: EXPIRED
        trigger: "system (run-ops with expires_at <= now) or flight cancellation cascade"
        actor: system
        preconditions: []
        side_effects: ["seats released; applied credits released back"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (flight DISPATCH while booking not MANIFESTED)"
        actor: system
        preconditions: []
        side_effects: ["no refund and no credit; retained_fee_cents = paid_cents"]
      - from: CONFIRMED
        to: CREDITED
        trigger: "system (flight cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: ["credited_cents = paid_cents; mint RebookingCredit of paid_cents + credits_applied_cents"]
      - from: CHECKED_IN
        to: CREDITED
        trigger: "system (flight cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: ["same as CONFIRMED->CREDITED"]
      - from: MANIFESTED
        to: CREDITED
        trigger: "system (flight cancellation cascade from MANIFEST_CLOSED)"
        actor: system
        preconditions: []
        side_effects: ["same as CONFIRMED->CREDITED"]
      - from: CONFIRMED
        to: CONFIRMED
        trigger: "POST /bookings/{id}/move"
        actor: BookingAgent
        preconditions:
          - "expected_booking_version matches (else ERR_STALE_VERSION)"
          - "no passenger of the booking has checked_in == true"
          - "new flight exists, is in {SCHEDULED, DELAYED}, has seats_available >= seat_count, and passes the estimate W&B gate"
          - "when new_total > quoted_total_cents: additional_card_cents == new_total - quoted_total_cents"
        side_effects: ["move_settlement runs; flight_id, quoted_* and season_id relocked; increments booking.version by 1"]
        note: "Self-transition carrying the flight swap and settlement"

  - entity: Passenger
    field: checked_in
    initial_state: "false"
    terminal_states: []
    transitions:
      - from: "false"
        to: "true"
        trigger: "POST /passengers/{id}/events (CHECK_IN)"
        actor: BookingAgent
        preconditions:
          - "booking.status in {CONFIRMED, CHECKED_IN}"
          - "waiver_signed == true (else ERR_WAIVER_NOT_SIGNED)"
          - "briefing_completed == true (else ERR_BRIEFING_INCOMPLETE)"
          - "seat_number within [0, aircraft.seat_capacity) and not taken by another checked-in passenger on the same flight (else ERR_SEAT_NUMBER_TAKEN)"
        side_effects: ["actual_weight_lb and seat_number set", "booking auto-transitions to CHECKED_IN when this was its last unchecked passenger"]
      - from: "true"
        to: "false"
        trigger: "POST /passengers/{id}/events (UNCHECK)"
        actor: BookingAgent
        preconditions: ["booking.status in {CHECKED_IN, CONFIRMED}"]
        side_effects: ["actual_weight_lb and seat_number cleared", "booking in CHECKED_IN reverts to CONFIRMED"]

  - entity: RebookingCredit
    field: status
    initial_state: ISSUED
    terminal_states: [REDEEMED, EXPIRED]
    transitions:
      - from: ISSUED
        to: PARTIALLY_REDEEMED
        trigger: "system (POST /bookings/{id}/apply-credit consumes less than remaining_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: REDEEMED
        trigger: "system (apply-credit consumes exactly all remaining_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_REDEEMED
        to: REDEEMED
        trigger: "system (apply-credit consumes the rest)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "system (run-ops with expires_at <= now)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_REDEEMED
        to: EXPIRED
        trigger: "system (run-ops with expires_at <= now)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Complaint
    field: status
    initial_state: LOGGED
    terminal_states: [CLOSED]
    transitions:
      - from: LOGGED
        to: UNDER_REVIEW
        trigger: "POST /complaints/{id}/events (REVIEW)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: LOGGED
        to: DISMISSED
        trigger: "POST /complaints/{id}/events (DISMISS)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /complaints/{id}/events (SUBSTANTIATE)"
        actor: ComplianceOfficer
        preconditions:
          - "complaint.matched_flight_id is not null"
          - "matched flight status in {DISPATCHED, COMPLETED}"
        side_effects:
          - "matched route's substantiated_complaints_30d recomputed"
          - "if the count now >= base.complaint_quota_threshold: route -> SUSPENDED and its cancellation cascade fires"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /complaints/{id}/events (DISMISS)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: SUBSTANTIATED
        to: CLOSED
        trigger: "POST /complaints/{id}/events (CLOSE)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["resolution_note recorded"]
      - from: DISMISSED
        to: CLOSED
        trigger: "POST /complaints/{id}/events (CLOSE)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["resolution_note recorded"]
      - from: CLOSED
        to: UNDER_REVIEW
        trigger: "POST /complaints/{id}/events (REOPEN)"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["prior SUBSTANTIATED outcome is retained in history but the complaint no longer counts toward the quota until re-substantiated"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: flight-assignment-stale-version
    parent_entity: Flight
    write_endpoint: "PATCH /flights/{id}/assignment"
    occ_field: expected_flight_version
    description: |
      Reassigning a flight's pilot/aircraft against a stale observed Flight.version
      is rejected. Reassignment is legitimate whenever the flight is SCHEDULED or
      DELAYED, so a second writer carrying a version captured before another
      assignment landed must be told its view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: manifest-close-stale-version
    parent_entity: Flight
    write_endpoint: "POST /flights/{id}/close-manifest"
    occ_field: expected_flight_version
    description: |
      Closing a manifest against a stale observed Flight.version is rejected,
      because interim flight mutations (assignment changes, delays) invalidate
      the weight-and-balance picture the closer computed from.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: booking-move-stale-version
    parent_entity: Booking
    write_endpoint: "POST /bookings/{id}/move"
    occ_field: expected_booking_version
    description: |
      Moving a booking to a different flight against a stale observed
      Booking.version is rejected; interim mutations (credit applications,
      confirm) change the settlement base the mover priced from.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: base-config-stale-version
    parent_entity: Base
    write_endpoint: "PATCH /bases/{id}"
    occ_field: expected_base_version
    description: |
      Updating base configuration (quiet hours, waiver version, thresholds)
      against a stale observed Base.version is rejected so two operators cannot
      unknowingly overwrite each other's regulatory settings.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: seat_price_quote
    trigger: "booking creation (locks the quote) and booking move (recomputes and relocks)"
    algorithm: tiered_pricing
    formula: |
      inputs: route.base_seat_price_cents, season_bps, load_bps, weekend_bps, seat_count
      season_bps  = multiplier_bps of the PUBLISHED Season with start_date <= departure_date < end_date;
                    10000 when no such season exists (RETIRED seasons are invisible)
      load_pct    = floor(flight.seats_booked * 100 / aircraft.seat_capacity)
                    evaluated BEFORE this booking's seats are added (exclusive)
      load_bps    = 10000 if load_pct < 50
                    11000 if 50 <= load_pct < 80
                    12500 if load_pct >= 80
      weekend_bps = 11000 if the UTC day-of-week of scheduled_departure_utc is Saturday or Sunday
                    else 10000
      PINNED ROUNDING ORDER (nested, round_half_up to integer cents after EVERY step):
        step1 = round_half_up(base_seat_price_cents * season_bps / 10000)
        step2 = round_half_up(step1 * load_bps / 10000)
        step3 = round_half_up(step2 * weekend_bps / 10000)
        quoted_per_seat_cents = step3
        quoted_total_cents    = quoted_per_seat_cents * seat_count   (multiply AFTER per-seat rounding)
    input_set: "the booking's own flight, route, aircraft; seasons by departure date; other bookings on the flight in {HELD, CONFIRMED, CHECKED_IN, MANIFESTED}"
    constants: { LOAD_TIER2_PCT: 50, LOAD_TIER2_BPS: 11000, LOAD_TIER3_PCT: 80, LOAD_TIER3_BPS: 12500, WEEKEND_BPS: 11000, DEFAULT_BPS: 10000 }
    precision: "integer cents; round_half_up after each multiplier step"

  - name: manifest_estimate
    trigger: "booking creation and booking move (gate); refreshed on read as estimated_gross_weight_lb"
    algorithm: forward_looking
    formula: |
      estimated_gross_weight_lb = aircraft.empty_weight_lb
        + SUM over passengers of bookings in {HELD, CONFIRMED, CHECKED_IN} on this flight of (declared_weight_lb + PAX_ALLOWANCE_LB)
        + route.fuel_required_lb            (full planned fuel, never trimmed in the estimate)
      gate: estimated_gross_weight_lb <= aircraft.max_takeoff_weight_lb (== allowed)
    input_set: "passengers of this flight's bookings in {HELD, CONFIRMED, CHECKED_IN}; MANIFESTED bookings excluded (flight already closed)"
    constants: { PAX_ALLOWANCE_LB: 5 }
    precision: "integer pounds, no rounding"
    variants:
      - name: provisional_estimate
        when: "booking creation / move gate and the flight's estimated_gross_weight_lb field"
        difference: "uses declared_weight_lb + 5 per passenger and FULL route.fuel_required_lb"
      - name: final_manifest
        when: "close-manifest"
        difference: "uses actual_weight_lb (no allowance) and TRIMMED fuel per manifest_final_wb; produces different pounds for the same passenger set"

  - name: manifest_final_wb
    trigger: "POST /flights/{id}/close-manifest"
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (the fuel/weight coupling is circular-looking; this order defines it):
        (1) pax_weight = SUM(actual_weight_lb) over checked-in passengers of CHECKED_IN bookings on this flight
        (2) fuel_budget = aircraft.max_takeoff_weight_lb - aircraft.empty_weight_lb - pax_weight
        (3) manifested_fuel_lb = min(route.fuel_required_lb, fuel_budget)
        (4) min_fuel_lb = round_half_up(route.fuel_required_lb * MIN_FUEL_RATIO_BPS / 10000)
            require manifested_fuel_lb >= min_fuel_lb           else ERR_FUEL_BELOW_MINIMUM
        (5) actual_gross_weight_lb = empty_weight_lb + pax_weight + manifested_fuel_lb
            require actual_gross_weight_lb <= max_takeoff_weight_lb  else ERR_GROSS_WEIGHT_EXCEEDED
        (6) total_moment = aircraft.empty_moment_lb_in
              + SUM(passenger.actual_weight_lb * aircraft.seat_arms_inches[passenger.seat_number])
              + manifested_fuel_lb * aircraft.fuel_arm_inches
        (7) actual_cg_in = round_half_up(total_moment / actual_gross_weight_lb, 2 decimals)
            require cg_forward_limit_in <= actual_cg_in <= cg_aft_limit_in  (both inclusive)
            else ERR_CG_OUT_OF_ENVELOPE
    input_set: "checked-in passengers (checked_in == true) of this flight's bookings in CHECKED_IN"
    constants: { MIN_FUEL_RATIO_BPS: 6000 }
    precision: "weights integer lb; CG 2 decimals round_half_up before the inclusive envelope compare"

  - name: pilot_duty_minutes
    trigger: "flight creation / assignment patch / delay (gate); flight completion and run-ops (ledger)"
    algorithm: forward_looking
    formula: |
      Both variants share the DutyDay row keyed by (pilot_id, UTC date of scheduled_departure_utc).
      VARIANT scheduled_projection (the ASSIGNMENT GATE, forward-looking):
        flight_minutes_scheduled = SUM(route.duration_minutes) over the pilot's flights this UTC date
          with status in {SCHEDULED, DELAYED, BOARDING, MANIFEST_CLOSED, DISPATCHED, COMPLETED}
        candidate_sum = flight_minutes_scheduled + candidate_route.duration_minutes
        require candidate_sum <= FLIGHT_LIMIT_MIN        (== allowed; > rejected ERR_PILOT_FLIGHT_TIME_EXCEEDED)
        duty_minutes_projected = (max scheduled_arrival over active+candidate) + DEBRIEF_OFFSET_MIN
                                 - (min scheduled_departure over active+candidate) - REPORT_OFFSET_MIN
        require duty_minutes_projected <= DUTY_LIMIT_MIN (== allowed; > rejected ERR_PILOT_DUTY_LIMIT_EXCEEDED)
      VARIANT actual_ledger (chronological; drives FATIGUE_LOCK):
        on COMPLETE: flight_minutes_actual += floor(actual_arrival_utc - actual_departure_utc in minutes)
        if flight_minutes_actual >= FLIGHT_LIMIT_MIN: pilot -> FATIGUE_LOCKED
      The two variants diverge for the same day whenever a flight completes earlier or later than scheduled.
    input_set: "flights of one pilot on one UTC date; cancelled flights excluded from both variants"
    constants: { FLIGHT_LIMIT_MIN: 480, DUTY_LIMIT_MIN: 840, REPORT_OFFSET_MIN: 45, DEBRIEF_OFFSET_MIN: 15 }
    precision: "integer minutes"
    variants:
      - name: scheduled_projection
        when: "assignment-time gate on POST /flights, PATCH /flights/{id}/assignment, DELAY"
        difference: "counts full scheduled block times including future flights"
      - name: actual_ledger
        when: "completion rollup and fatigue lock"
        difference: "counts only completed flights' actual airborne minutes"

  - name: cancellation_settlement
    trigger: "POST /bookings/{id}/events (CANCEL) from CONFIRMED or CHECKED_IN"
    algorithm: threshold
    formula: |
      minutes_until = floor((flight.scheduled_departure_utc - now) in whole minutes)
      if minutes_until >= REFUND_FULL_MIN:   refunded = paid_cents; retained_fee_cents = 0; credited = 0
      elif minutes_until >= REFUND_PARTIAL_MIN:
        retained_fee_cents = round_half_up(paid_cents * PARTIAL_FEE_BPS / 10000)
        refunded = paid_cents - retained_fee_cents; credited = 0
      else:
        credited = round_half_up(paid_cents * CREDIT_ONLY_BPS / 10000)
        retained_fee_cents = paid_cents - credited; refunded = 0
        (mint a RebookingCredit of `credited` cents)
      refunded_card_cents += refunded
      INVARIANT: paid_cents == refunded_card_cents + credited_cents + retained_fee_cents
      Separately: credits_applied_cents is re-minted in full as a new RebookingCredit (365-day expiry).
      NO_SHOW forfeit: retained_fee_cents = paid_cents, refunded = 0, credited = 0.
    input_set: "the cancelled booking; its flight's scheduled_departure_utc; the logical clock"
    constants: { REFUND_FULL_MIN: 1440, REFUND_PARTIAL_MIN: 120, PARTIAL_FEE_BPS: 1000, CREDIT_ONLY_BPS: 7500, CREDIT_VALIDITY_DAYS: 365 }
    precision: "integer cents, round_half_up on the percentage leg; complement assigned to the other leg"

  - name: move_settlement
    trigger: "POST /bookings/{id}/move"
    algorithm: waterfall_allocation
    formula: |
      PINNED ORDER:
        (1) new_quote = seat_price_quote evaluated against the NEW flight (season, load, weekend of the new departure)
        (2) delta = new_quote.quoted_total_cents - booking.quoted_total_cents
        (3) if delta > 0: require additional_card_cents == delta; paid_cents += delta
            if delta < 0: card_refund = min(-delta, paid_cents)
                          refunded_card_cents += card_refund
                          excess = -delta - card_refund
                          if excess > 0: mint a RebookingCredit of `excess` cents
        (4) relock: flight_id = new flight; quoted_per_seat_cents / quoted_total_cents = new_quote; season_id recomputed
            credits_applied_cents := quoted_total_cents - paid_cents  (recomposed after settlement)
    input_set: "the booking (CONFIRMED, no checked-in passengers) and the target flight"
    constants: { CREDIT_VALIDITY_DAYS: 365 }
    precision: "integer cents"

  - name: credit_redemption
    trigger: "POST /bookings/{id}/apply-credit (booking must be HELD)"
    algorithm: waterfall_allocation
    formula: |
      balance_due = quoted_total_cents - credits_applied_cents - 0   (paid_cents is always 0 while HELD)
      consume = min(credit.remaining_cents, balance_due)
      credit.redeemed_cents += consume
      booking.credits_applied_cents += consume
      credit.status: REDEEMED if remaining_cents == 0 else PARTIALLY_REDEEMED
      INVARIANT per credit: amount_cents == redeemed_cents + remaining_cents at all times
    input_set: "one booking in HELD and one credit in {ISSUED, PARTIALLY_REDEEMED}"
    constants: {}
    precision: "integer cents"

  - name: complaint_auto_match
    trigger: "POST /complaints (on create)"
    algorithm: selector_policy
    formula: |
      eligibility: flights f of the complaint's base with
        f.status in {DISPATCHED, COMPLETED}
        AND complaint.zone IN f.route.noise_zones
        AND complaint.observed_at in [f.scheduled_departure_utc, f.scheduled_arrival_utc + OVERFLIGHT_PAD_MIN)  (half-open)
      ranking: |observed_at - f.scheduled_departure_utc| ASC
      tie-break: earlier scheduled_departure_utc first; then earlier created_at first
      fallback: empty candidate set -> match_status = UNMATCHED, matched_flight_id = null (no error)
      LINK_FLIGHT (manual): requires flight.route.noise_zones contains complaint.zone else ERR_COMPLAINT_FLIGHT_MISMATCH
    input_set: "flights of the same base as the complaint"
    constants: { OVERFLIGHT_PAD_MIN: 30 }
    precision: "whole-minute absolute distance"

  - name: complaint_quota_rollup
    trigger: "complaint SUBSTANTIATE; route read; route RESUME precondition"
    algorithm: threshold
    formula: |
      substantiated_complaints_30d = COUNT of complaints with
        status == SUBSTANTIATED
        AND matched_route_id == this route
        AND observed_at in [now - base.complaint_window_days days, now]   (BOTH bounds inclusive)
      suspension fires when a SUBSTANTIATE transition makes the count >= base.complaint_quota_threshold
      RESUME requires count < threshold at resume time
    input_set: "complaints matched to flights of this route"
    constants: {}
    precision: "integer count; >= comparison"

  - name: rotation_sequence
    trigger: "flight creation, DELAY, cancellation (per aircraft per UTC date)"
    algorithm: chronological
    formula: |
      rotation_seq over flights sharing (aircraft_id, UTC date of scheduled_departure_utc)
      with status NOT in {CANCELLED_WEATHER, CANCELLED_OPS}:
      order by scheduled_departure_utc ASC, assign 1..N.
      Ties cannot occur on one aircraft (the turn-window rule forbids equal departures).
    input_set: "non-cancelled flights of one aircraft on one UTC date"
    constants: {}
    precision: "integer sequence starting at 1"

  - name: weather_posture
    trigger: "Base read (posture is computed on read); POST /weather-observations"
    algorithm: projection
    formula: |
      latest = the WeatherObservation of this base with the greatest observed_at <= now
               (tie: greatest created_at)
      posture = WEATHER_HOLD iff latest exists AND latest.adverse AND now < latest.validity_until
                else NORMAL
      adverse := ceiling_ft < base.weather_ceiling_min_ft
                 OR visibility_sm < base.weather_visibility_min_sm
                 OR wind_kt > base.weather_wind_max_kt
    input_set: "WeatherObservations of one base with observed_at <= now"
    constants: {}
    precision: "second-precision timestamps; strict < on validity_until"

  - name: turn_window
    trigger: "flight creation, assignment patch, DELAY (conflict gate)"
    algorithm: interval_merge
    formula: |
      AIRCRAFT occupied interval for flight f: [f.dep, f.arr + f.route.turn_minutes)  (buffer-extended, half-open)
        candidate conflicts iff candidate.dep < existing.arr + turn AND existing.dep < candidate.arr + candidate_turn
        i.e. departure exactly at existing.arr + turn is ALLOWED (half-open end)
      PILOT occupied interval for flight f: [f.dep, f.arr)  (plain half-open, NO buffer)
        departure exactly at the previous flight's arrival is ALLOWED for a pilot
      Both checks consider only flights with status in {SCHEDULED, DELAYED, BOARDING, MANIFEST_CLOSED, DISPATCHED}
      on the same UTC date; cancelled and completed flights do not block.
    input_set: "flights sharing the aircraft (resp. pilot) on the candidate's UTC date"
    constants: { TURN_SHORT_MIN: 15, TURN_STANDARD_MIN: 25, TURN_GRAND_MIN: 40 }
    precision: "minute precision; half-open comparisons"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: business_constraint, check: "Request body parses, required fields present, enum values valid, unknown fields ignored", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 3, category: auth, check: "Role permitted on endpoint; entity-backed ownership (Pilot acks own flight only; Pilot reads only own duty-days)", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path ids exist, then body FK ids exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "expected_*_version matches the parent's current version on OCC-guarded writes", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /flights/{id}/assignment, POST /flights/{id}/close-manifest, POST /bookings/{id}/move, PATCH /bases/{id}" }
  - { priority: 6, category: state, check: "Target resource is in a state that permits the requested transition (terminal states reject all transitions)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all event/transition endpoints" }
  - { priority: 7, category: business_safety, check: "Base posture must be NORMAL for DISPATCH and OPEN_BOARDING", error_id: ERR_WEATHER_HOLD_ACTIVE, http_status: 409, applies_to: "POST /flights/{id}/events (DISPATCH, OPEN_BOARDING)" }
  - { priority: 8, category: business_safety, check: "Pilot status must be AVAILABLE to be assigned", error_id: ERR_PILOT_NOT_AVAILABLE, http_status: 409, applies_to: "POST /flights, PATCH /flights/{id}/assignment" }
  - { priority: 9, category: business_safety, check: "pilot_duty_minutes scheduled_projection: candidate flight minutes <= 480 (== allowed)", error_id: ERR_PILOT_FLIGHT_TIME_EXCEEDED, http_status: 409, applies_to: "POST /flights, PATCH /flights/{id}/assignment, POST /flights/{id}/events (DELAY)" }
  - { priority: 10, category: business_safety, check: "pilot_duty_minutes scheduled_projection: projected duty span <= 840 (== allowed)", error_id: ERR_PILOT_DUTY_LIMIT_EXCEEDED, http_status: 409, applies_to: "POST /flights, PATCH /flights/{id}/assignment, POST /flights/{id}/events (DELAY)" }
  - { priority: 11, category: business_safety, check: "Aircraft status must be AVAILABLE to be scheduled", error_id: ERR_AIRCRAFT_NOT_AVAILABLE, http_status: 409, applies_to: "POST /flights, PATCH /flights/{id}/assignment" }
  - { priority: 12, category: business_safety, check: "route.min_aircraft_noise_class == QUIET_ONLY requires aircraft.noise_class == QUIET", error_id: ERR_AIRCRAFT_NOISE_CLASS_INSUFFICIENT, http_status: 409, applies_to: "POST /flights, PATCH /flights/{id}/assignment" }
  - { priority: 13, category: business_safety, check: "noise-sensitive route with non-QUIET aircraft may not depart with minute-of-day in [quiet_hours_start_min_utc, quiet_hours_end_min_utc)", error_id: ERR_QUIET_HOURS_VIOLATION, http_status: 409, applies_to: "POST /flights, POST /flights/{id}/events (DELAY)" }
  - { priority: 14, category: business_safety, check: "manifest_final_wb: trimmed fuel >= min fuel; gross <= MTOW", error_id: ERR_GROSS_WEIGHT_EXCEEDED, http_status: 422, applies_to: "POST /bookings (estimate variant), POST /bookings/{id}/move, POST /flights/{id}/close-manifest" }
  - { priority: 15, category: business_safety, check: "manifest_final_wb: manifested_fuel_lb >= round_half_up(fuel_required_lb * 0.6)", error_id: ERR_FUEL_BELOW_MINIMUM, http_status: 422, applies_to: "POST /flights/{id}/close-manifest" }
  - { priority: 16, category: business_safety, check: "manifest_final_wb: rounded CG inside [cg_forward_limit_in, cg_aft_limit_in] inclusive", error_id: ERR_CG_OUT_OF_ENVELOPE, http_status: 422, applies_to: "POST /flights/{id}/close-manifest" }
  - { priority: 17, category: business_safety, check: "dispatched_by_user_id != created_by_user_id (segregation of duties)", error_id: ERR_SEGREGATION_OF_DUTY, http_status: 403, applies_to: "POST /flights/{id}/events (DISPATCH)" }
  - { priority: 18, category: business_temporal, check: "scheduled_departure_utc (or new_departure_utc) must be > now", error_id: ERR_DEPARTURE_IN_PAST, http_status: 409, applies_to: "POST /flights, POST /flights/{id}/events (DELAY)" }
  - { priority: 19, category: business_temporal, check: "Season windows [start_date, end_date) must not overlap another PUBLISHED season; adjacency (end == start) allowed; end_date > start_date", error_id: ERR_SEASON_OVERLAP, http_status: 409, applies_to: "POST /seasons" }
  - { priority: 20, category: business_temporal, check: "turn_window aircraft rule: buffer-extended half-open intervals of one aircraft must not intersect", error_id: ERR_AIRCRAFT_TURN_CONFLICT, http_status: 409, applies_to: "POST /flights, PATCH /flights/{id}/assignment, POST /flights/{id}/events (DELAY)" }
  - { priority: 21, category: business_temporal, check: "turn_window pilot rule: plain half-open block intervals of one pilot must not intersect", error_id: ERR_PILOT_SCHEDULE_OVERLAP, http_status: 409, applies_to: "POST /flights, PATCH /flights/{id}/assignment, POST /flights/{id}/events (DELAY)" }
  - { priority: 22, category: business_temporal, check: "HELD booking confirm/apply-credit requires now < expires_at", error_id: ERR_BOOKING_HOLD_EXPIRED, http_status: 409, applies_to: "POST /bookings/{id}/confirm, POST /bookings/{id}/apply-credit" }
  - { priority: 23, category: business_referential, check: "SIGN_WAIVER waiver_version must equal booking.waiver_version_pinned", error_id: ERR_WAIVER_VERSION_STALE, http_status: 409, applies_to: "POST /passengers/{id}/events (SIGN_WAIVER)" }
  - { priority: 24, category: business_referential, check: "CHECK_IN requires waiver_signed == true", error_id: ERR_WAIVER_NOT_SIGNED, http_status: 409, applies_to: "POST /passengers/{id}/events (CHECK_IN)" }
  - { priority: 25, category: business_referential, check: "CHECK_IN requires briefing_completed == true", error_id: ERR_BRIEFING_INCOMPLETE, http_status: 409, applies_to: "POST /passengers/{id}/events (CHECK_IN)" }
  - { priority: 26, category: business_referential, check: "PILOT_ACK X-User-ID must equal flight.pilot_id", error_id: ERR_PILOT_MISMATCH, http_status: 403, applies_to: "POST /flights/{id}/events (PILOT_ACK)" }
  - { priority: 27, category: business_referential, check: "DISPATCH requires pilot_acknowledged == true", error_id: ERR_PILOT_ACK_REQUIRED, http_status: 409, applies_to: "POST /flights/{id}/events (DISPATCH)" }
  - { priority: 28, category: business_referential, check: "SUBSTANTIATE requires matched flight in {DISPATCHED, COMPLETED}; LINK_FLIGHT requires zone on the flight's route", error_id: ERR_COMPLAINT_FLIGHT_MISMATCH, http_status: 409, applies_to: "POST /complaints/{id}/events (LINK_FLIGHT, SUBSTANTIATE)" }
  - { priority: 29, category: business_constraint, check: "Route must be ACTIVE to schedule new flights", error_id: ERR_ROUTE_SUSPENDED, http_status: 409, applies_to: "POST /flights" }
  - { priority: 30, category: business_constraint, check: "Route RESUME requires substantiated_complaints_30d < complaint_quota_threshold", error_id: ERR_ROUTE_QUOTA_STILL_EXCEEDED, http_status: 409, applies_to: "POST /routes/{id}/events (RESUME)" }
  - { priority: 31, category: business_constraint, check: "booking seat_count <= flight.seats_available (== fills the flight exactly, allowed)", error_id: ERR_SEAT_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /bookings, POST /bookings/{id}/move" }
  - { priority: 32, category: business_constraint, check: "seat_number unique among checked-in passengers of the same flight", error_id: ERR_SEAT_NUMBER_TAKEN, http_status: 409, applies_to: "POST /passengers/{id}/events (CHECK_IN)" }
  - { priority: 33, category: business_constraint, check: "full_name unique within one booking's passengers", error_id: ERR_DUPLICATE_PASSENGER, http_status: 409, applies_to: "POST /bookings" }
  - { priority: 34, category: business_constraint, check: "route_code / tail_number / certificate_no uniqueness", error_id: ERR_UNIQUENESS_CONFLICT, http_status: 409, applies_to: "POST /routes, POST /aircraft, POST /pilots" }
  - { priority: 35, category: business_fiscal, check: "confirm card_amount_cents must equal quoted_total_cents - credits_applied_cents; move additional_card_cents must equal positive delta", error_id: ERR_PAYMENT_AMOUNT_MISMATCH, http_status: 402, applies_to: "POST /bookings/{id}/confirm, POST /bookings/{id}/move" }
  - { priority: 36, category: business_fiscal, check: "apply-credit requires credit status in {ISSUED, PARTIALLY_REDEEMED} with remaining_cents > 0", error_id: ERR_CREDIT_NOT_REDEEMABLE, http_status: 409, applies_to: "POST /bookings/{id}/apply-credit" }

# =============================================================================
# 1.5 API Endpoint Table (47 endpoints)
# =============================================================================
endpoints:
  # --- Base ---
  - { method: POST, path: "/bases", description: "Create an operating base with regulatory config", roles: [OpsAdmin], code: 201, input: [name, quiet_hours_start_min_utc, quiet_hours_end_min_utc, current_waiver_version, "weather_ceiling_min_ft?", "weather_visibility_min_sm?", "weather_wind_max_kt?", "weather_validity_min?", "complaint_quota_threshold?", "complaint_window_days?", "hold_expire_minutes?"], output: Base, side_effects: ["posture NORMAL, ops_run_index 0"] }
  - { method: GET, path: "/bases/{id}", description: "Get a base (posture computed on read)", roles: [OpsAdmin, Dispatcher, BookingAgent, ComplianceOfficer, CommunityReporter, Pilot], code: 200, input: [], output: Base, side_effects: [] }
  - { method: PATCH, path: "/bases/{id}", description: "Update base config (OCC-guarded)", roles: [OpsAdmin], code: 200, input: [expected_base_version, "name?", "quiet_hours_start_min_utc?", "quiet_hours_end_min_utc?", "current_waiver_version?", "weather_ceiling_min_ft?", "weather_visibility_min_sm?", "weather_wind_max_kt?", "weather_validity_min?", "complaint_quota_threshold?", "complaint_window_days?", "hold_expire_minutes?"], output: Base, side_effects: ["increments Base.version by 1"] }
  - { method: POST, path: "/bases/{id}/run-ops", description: "Batch tick: expire HELD bookings with expires_at <= now, expire credits with expires_at <= now, close DutyDays with duty_date < today and reset fatigue locks", roles: [OpsAdmin], code: 200, input: [], output: Base, side_effects: ["ops_run_index += 1", "booking/credit expiry sweeps", "DutyDay close + pilot AVAILABLE reset"] }
  # --- Route ---
  - { method: POST, path: "/routes", description: "Create a route", roles: [OpsAdmin], code: 201, input: [route_code, tier, duration_minutes, base_seat_price_cents, fuel_required_lb, min_altitude_ft, noise_sensitive, noise_zones, min_aircraft_noise_class], output: Route, side_effects: ["status ACTIVE, turn_minutes derived from tier"] }
  - { method: GET, path: "/routes", description: "List routes", roles: [OpsAdmin, Dispatcher, BookingAgent, ComplianceOfficer, CommunityReporter, Pilot], code: 200, input: ["status?", "limit?", "offset?"], output: "Route[]", side_effects: [] }
  - { method: GET, path: "/routes/{id}", description: "Get a route (substantiated_complaints_30d recomputed on read)", roles: [OpsAdmin, Dispatcher, BookingAgent, ComplianceOfficer, CommunityReporter, Pilot], code: 200, input: [], output: Route, side_effects: [] }
  - { method: POST, path: "/routes/{id}/events", description: "SUSPEND | RESUME a route", roles: [OpsAdmin], code: 200, input: [event_type], output: Route, side_effects: ["SUSPEND/RESUME transitions per Route machine incl. flight cancellation cascade on SUSPEND"] }
  # --- Season ---
  - { method: POST, path: "/seasons", description: "Create a PUBLISHED pricing season (half-open overlap check)", roles: [OpsAdmin], code: 201, input: [label, start_date, end_date, multiplier_bps], output: Season, side_effects: ["status PUBLISHED"] }
  - { method: GET, path: "/seasons", description: "List seasons", roles: [OpsAdmin, Dispatcher, BookingAgent, ComplianceOfficer, CommunityReporter, Pilot], code: 200, input: ["status?", "limit?", "offset?"], output: "Season[]", side_effects: [] }
  - { method: GET, path: "/seasons/{id}", description: "Get a season", roles: [OpsAdmin, Dispatcher, BookingAgent, ComplianceOfficer, CommunityReporter, Pilot], code: 200, input: [], output: Season, side_effects: [] }
  - { method: POST, path: "/seasons/{id}/events", description: "RETIRE a season", roles: [OpsAdmin], code: 200, input: [event_type], output: Season, side_effects: ["status RETIRED"] }
  # --- Aircraft ---
  - { method: POST, path: "/aircraft", description: "Register a helicopter", roles: [OpsAdmin], code: 201, input: [tail_number, seat_capacity, empty_weight_lb, empty_moment_lb_in, max_takeoff_weight_lb, fuel_arm_inches, seat_arms_inches, cg_forward_limit_in, cg_aft_limit_in, noise_class], output: Aircraft, side_effects: ["status AVAILABLE"] }
  - { method: GET, path: "/aircraft", description: "List aircraft", roles: [OpsAdmin, Dispatcher, BookingAgent, ComplianceOfficer, CommunityReporter, Pilot], code: 200, input: ["status?", "noise_class?", "limit?", "offset?"], output: "Aircraft[]", side_effects: [] }
  - { method: GET, path: "/aircraft/{id}", description: "Get an aircraft", roles: [OpsAdmin, Dispatcher, BookingAgent, ComplianceOfficer, CommunityReporter, Pilot], code: 200, input: [], output: Aircraft, side_effects: [] }
  - { method: POST, path: "/aircraft/{id}/events", description: "START_MAINTENANCE | END_MAINTENANCE | GROUND | RECERTIFY", roles: [OpsAdmin], code: 200, input: [event_type], output: Aircraft, side_effects: ["GROUND cascades: future flights CANCELLED_OPS(AIRCRAFT_GROUNDED) -> bookings CREDITED/EXPIRED with credits minted"] }
  # --- Pilot ---
  - { method: POST, path: "/pilots", description: "Register a pilot", roles: [OpsAdmin], code: 201, input: [display_name, certificate_no], output: Pilot, side_effects: ["status AVAILABLE"] }
  - { method: GET, path: "/pilots", description: "List pilots", roles: [OpsAdmin, Dispatcher, BookingAgent, ComplianceOfficer, CommunityReporter, Pilot], code: 200, input: ["status?", "limit?", "offset?"], output: "Pilot[]", side_effects: [] }
  - { method: GET, path: "/pilots/{id}", description: "Get a pilot", roles: [OpsAdmin, Dispatcher, BookingAgent, ComplianceOfficer, CommunityReporter, Pilot], code: 200, input: [], output: Pilot, side_effects: [] }
  # --- DutyDay ---
  - { method: GET, path: "/duty-days", description: "List duty-day ledgers (Pilot role may only query own pilot_id)", roles: [OpsAdmin, Dispatcher, Pilot], code: 200, input: ["pilot_id?", "duty_date?", "status?", "limit?", "offset?"], output: "DutyDay[]", side_effects: [] }
  - { method: GET, path: "/duty-days/{id}", description: "Get a duty-day ledger", roles: [OpsAdmin, Dispatcher, Pilot], code: 200, input: [], output: DutyDay, side_effects: [] }
  # --- Flight ---
  - { method: POST, path: "/flights", description: "Schedule a flight (runs route-status, pilot duty/availability, aircraft availability/noise, quiet-hours, turn-window, departure-in-past gates; creates/updates DutyDay)", roles: [Dispatcher], code: 201, input: [base_id, route_id, aircraft_id, pilot_id, scheduled_departure_utc], output: Flight, side_effects: ["status SCHEDULED, rotation_seq assigned, DutyDay upserted and flight_minutes_scheduled += route.duration_minutes"] }
  - { method: GET, path: "/flights", description: "List flights with filters", roles: [OpsAdmin, Dispatcher, BookingAgent, ComplianceOfficer, CommunityReporter, Pilot], code: 200, input: ["base_id?", "route_id?", "aircraft_id?", "pilot_id?", "status?", "limit?", "offset?"], output: "Flight[]", side_effects: [] }
  - { method: GET, path: "/flights/{id}", description: "Get a flight", roles: [OpsAdmin, Dispatcher, BookingAgent, ComplianceOfficer, CommunityReporter, Pilot], code: 200, input: [], output: Flight, side_effects: [] }
  - { method: PATCH, path: "/flights/{id}/assignment", description: "Reassign pilot and/or aircraft while SCHEDULED or DELAYED (OCC)", roles: [Dispatcher], code: 200, input: [expected_flight_version, "pilot_id?", "aircraft_id?"], output: Flight, side_effects: ["re-runs duty/turn/noise/availability gates for the new crew", "increments Flight.version by 1"] }
  - { method: POST, path: "/flights/{id}/events", description: "DELAY | ACCEPT_DELAY | OPEN_BOARDING | DISPATCH | COMPLETE | CANCEL_WEATHER | CANCEL_OPS (Dispatcher); PILOT_ACK (Pilot, own flights only)", roles: [Dispatcher, Pilot], code: 200, input: [event_type, "new_departure_utc?", "reason?"], output: Flight, side_effects: ["per Flight state machine incl. booking cascades, DutyDay rollups, fatigue lock, SoD check on DISPATCH"] }
  - { method: POST, path: "/flights/{id}/close-manifest", description: "Close the weight-and-balance manifest from BOARDING (OCC); freezes final W&B and manifests CHECKED_IN bookings", roles: [Dispatcher], code: 200, input: [expected_flight_version], output: Flight, side_effects: ["manifest_final_wb runs", "CHECKED_IN bookings -> MANIFESTED", "increments Flight.version by 1"] }
  # --- Booking ---
  - { method: POST, path: "/bookings", description: "Create a HELD booking with passengers; locks the seat-price quote; runs seat-capacity and estimate W&B gates", roles: [BookingAgent], code: 201, input: [flight_id, contact_name, contact_email, passengers], output: Booking, side_effects: ["status HELD, expires_at = now + base.hold_expire_minutes, waiver_version_pinned = base.current_waiver_version, Passenger rows created with pax_index in input order"] }
  - { method: GET, path: "/bookings", description: "List bookings", roles: [OpsAdmin, Dispatcher, BookingAgent, ComplianceOfficer], code: 200, input: ["flight_id?", "status?", "contact_email?", "limit?", "offset?"], output: "Booking[]", side_effects: [] }
  - { method: GET, path: "/bookings/{id}", description: "Get a booking", roles: [OpsAdmin, Dispatcher, BookingAgent, ComplianceOfficer], code: 200, input: [], output: Booking, side_effects: [] }
  - { method: POST, path: "/bookings/{id}/apply-credit", description: "Apply a rebooking credit to a HELD booking (waterfall min(remaining, balance))", roles: [BookingAgent], code: 200, input: [credit_id], output: Booking, side_effects: ["credit_redemption runs; credit status transitions"] }
  - { method: POST, path: "/bookings/{id}/confirm", description: "Confirm a HELD booking by paying the exact balance due", roles: [BookingAgent], code: 200, input: [card_amount_cents], output: Booking, side_effects: ["HELD -> CONFIRMED; paid_cents set; expires_at cleared"] }
  - { method: POST, path: "/bookings/{id}/events", description: "CANCEL a booking (voluntary settlement tiers)", roles: [BookingAgent], code: 200, input: [event_type], output: Booking, side_effects: ["cancellation_settlement; credits re-minted; seats released"] }
  - { method: POST, path: "/bookings/{id}/move", description: "Move a CONFIRMED booking to another flight with re-quote and settlement (OCC)", roles: [BookingAgent], code: 200, input: [new_flight_id, expected_booking_version, "additional_card_cents?"], output: Booking, side_effects: ["move_settlement runs; quote relocked; increments Booking.version by 1"] }
  # --- Passenger ---
  - { method: GET, path: "/passengers", description: "List passengers (pax_index ASC within a booking)", roles: [OpsAdmin, Dispatcher, BookingAgent, ComplianceOfficer], code: 200, input: ["booking_id?", "limit?", "offset?"], output: "Passenger[]", side_effects: [] }
  - { method: GET, path: "/passengers/{id}", description: "Get a passenger", roles: [OpsAdmin, Dispatcher, BookingAgent, ComplianceOfficer], code: 200, input: [], output: Passenger, side_effects: [] }
  - { method: POST, path: "/passengers/{id}/events", description: "SIGN_WAIVER | COMPLETE_BRIEFING | CHECK_IN | UNCHECK", roles: [BookingAgent], code: 200, input: [event_type, "waiver_version?", "actual_weight_lb?", "seat_number?"], output: Passenger, side_effects: ["per Passenger machine incl. booking CHECKED_IN auto-flip and revert"] }
  # --- RebookingCredit ---
  - { method: GET, path: "/credits", description: "List rebooking credits", roles: [OpsAdmin, Dispatcher, BookingAgent, ComplianceOfficer], code: 200, input: ["booking_id?", "status?", "limit?", "offset?"], output: "RebookingCredit[]", side_effects: [] }
  - { method: GET, path: "/credits/{id}", description: "Get a rebooking credit", roles: [OpsAdmin, Dispatcher, BookingAgent, ComplianceOfficer], code: 200, input: [], output: RebookingCredit, side_effects: [] }
  # --- WeatherObservation ---
  - { method: POST, path: "/weather-observations", description: "Post a weather observation; adverse observations trigger the cancellation cascade and drive posture", roles: [Dispatcher], code: 201, input: [base_id, observed_at, ceiling_ft, visibility_sm, wind_kt], output: WeatherObservation, side_effects: ["weather_posture recompute", "in-window flights -> CANCELLED_WEATHER with booking cascade"] }
  - { method: GET, path: "/weather-observations", description: "List weather observations", roles: [OpsAdmin, Dispatcher, BookingAgent, ComplianceOfficer, CommunityReporter, Pilot], code: 200, input: ["base_id?", "limit?", "offset?"], output: "WeatherObservation[]", side_effects: [] }
  - { method: GET, path: "/weather-observations/{id}", description: "Get a weather observation", roles: [OpsAdmin, Dispatcher, BookingAgent, ComplianceOfficer, CommunityReporter, Pilot], code: 200, input: [], output: WeatherObservation, side_effects: [] }
  # --- Complaint ---
  - { method: POST, path: "/complaints", description: "File a community noise complaint; auto-match runs at creation", roles: [CommunityReporter], code: 201, input: [base_id, zone, observed_at, description, reporter_ref], output: Complaint, side_effects: ["complaint_auto_match sets match_status / matched_flight_id / matched_route_id"] }
  - { method: GET, path: "/complaints", description: "List complaints", roles: [OpsAdmin, Dispatcher, ComplianceOfficer, CommunityReporter], code: 200, input: ["base_id?", "status?", "matched_route_id?", "limit?", "offset?"], output: "Complaint[]", side_effects: [] }
  - { method: GET, path: "/complaints/{id}", description: "Get a complaint", roles: [OpsAdmin, Dispatcher, ComplianceOfficer, CommunityReporter], code: 200, input: [], output: Complaint, side_effects: [] }
  - { method: POST, path: "/complaints/{id}/events", description: "REVIEW | LINK_FLIGHT | SUBSTANTIATE | DISMISS | CLOSE | REOPEN", roles: [ComplianceOfficer], code: 200, input: [event_type, "flight_id?", "resolution_note?"], output: Complaint, side_effects: ["SUBSTANTIATE recomputes route quota and may fire the suspension cascade"] }
  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time", roles: [OpsAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["all time-gated rules (holds, credits, duty days, posture, quotas, refunds) read this clock"] }

# =============================================================================
# 1.6 Error Code Catalog (36 codes)
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum value" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted on this endpoint, or entity-backed ownership violated (Pilot reading another pilot's duty-days)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body foreign-key id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource state does not permit the requested transition (incl. terminal-state writes)" }
  - { id: ERR_WEATHER_HOLD_ACTIVE, http: 409, condition: "Base posture is WEATHER_HOLD; DISPATCH / OPEN_BOARDING blocked" }
  - { id: ERR_PILOT_NOT_AVAILABLE, http: 409, condition: "Pilot is FATIGUE_LOCKED and cannot be assigned" }
  - { id: ERR_PILOT_FLIGHT_TIME_EXCEEDED, http: 409, condition: "Scheduled-projection flight minutes would exceed 480 for the UTC day" }
  - { id: ERR_PILOT_DUTY_LIMIT_EXCEEDED, http: 409, condition: "Projected duty span would exceed 840 minutes for the UTC day" }
  - { id: ERR_AIRCRAFT_NOT_AVAILABLE, http: 409, condition: "Aircraft is IN_MAINTENANCE or GROUNDED" }
  - { id: ERR_AIRCRAFT_NOISE_CLASS_INSUFFICIENT, http: 409, condition: "Route requires QUIET_ONLY aircraft" }
  - { id: ERR_QUIET_HOURS_VIOLATION, http: 409, condition: "Noise-sensitive route with non-QUIET aircraft departing inside the quiet-hours window" }
  - { id: ERR_GROSS_WEIGHT_EXCEEDED, http: 422, condition: "Estimated or final gross weight exceeds max_takeoff_weight_lb" }
  - { id: ERR_FUEL_BELOW_MINIMUM, http: 422, condition: "Trimmed fuel would fall below 60% of route fuel_required_lb" }
  - { id: ERR_CG_OUT_OF_ENVELOPE, http: 422, condition: "Final CG outside the inclusive [forward, aft] envelope" }
  - { id: ERR_SEGREGATION_OF_DUTY, http: 403, condition: "Dispatcher who created the flight may not dispatch it" }
  - { id: ERR_DEPARTURE_IN_PAST, http: 409, condition: "scheduled/new departure is not strictly in the future" }
  - { id: ERR_SEASON_OVERLAP, http: 409, condition: "Season window overlaps a PUBLISHED season or has end_date <= start_date" }
  - { id: ERR_AIRCRAFT_TURN_CONFLICT, http: 409, condition: "Buffer-extended block interval collides with another flight of the same aircraft" }
  - { id: ERR_PILOT_SCHEDULE_OVERLAP, http: 409, condition: "Half-open block interval collides with another flight of the same pilot" }
  - { id: ERR_BOOKING_HOLD_EXPIRED, http: 409, condition: "Confirm/apply-credit attempted at or after expires_at while still HELD" }
  - { id: ERR_WAIVER_VERSION_STALE, http: 409, condition: "waiver_version presented does not equal the booking's pinned waiver version" }
  - { id: ERR_WAIVER_NOT_SIGNED, http: 409, condition: "CHECK_IN attempted before SIGN_WAIVER" }
  - { id: ERR_BRIEFING_INCOMPLETE, http: 409, condition: "CHECK_IN attempted before COMPLETE_BRIEFING" }
  - { id: ERR_PILOT_MISMATCH, http: 403, condition: "PILOT_ACK by a pilot other than the assigned pilot" }
  - { id: ERR_PILOT_ACK_REQUIRED, http: 409, condition: "DISPATCH attempted before PILOT_ACK" }
  - { id: ERR_COMPLAINT_FLIGHT_MISMATCH, http: 409, condition: "LINK_FLIGHT target's route does not cover the complaint zone; or SUBSTANTIATE against a flight not yet DISPATCHED/COMPLETED" }
  - { id: ERR_ROUTE_SUSPENDED, http: 409, condition: "Scheduling on a SUSPENDED route" }
  - { id: ERR_ROUTE_QUOTA_STILL_EXCEEDED, http: 409, condition: "RESUME attempted while substantiated_complaints_30d >= threshold" }
  - { id: ERR_SEAT_CAPACITY_EXCEEDED, http: 409, condition: "Booking seat_count exceeds flight seats_available" }
  - { id: ERR_SEAT_NUMBER_TAKEN, http: 409, condition: "seat_number already held by a checked-in passenger on the same flight" }
  - { id: ERR_DUPLICATE_PASSENGER, http: 409, condition: "Two passengers with the same full_name in one booking" }
  - { id: ERR_UNIQUENESS_CONFLICT, http: 409, condition: "route_code / tail_number / certificate_no already exists" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 402, condition: "Card amount does not equal the exact balance due" }
  - { id: ERR_CREDIT_NOT_REDEEMABLE, http: 409, condition: "Credit is REDEEMED or EXPIRED, or has zero remaining cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OpsAdmin
    description: "Operator administrator owning configuration: bases, routes, seasons, aircraft, pilots, batch ops, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /bases, PATCH /bases/{id}, POST /bases/{id}/run-ops"
      - "POST /routes, POST /routes/{id}/events"
      - "POST /seasons, POST /seasons/{id}/events"
      - "POST /aircraft, POST /aircraft/{id}/events"
      - "POST /pilots"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: Dispatcher
    description: "Flight operations: scheduling, assignment, manifest, dispatch, weather observations"
    identity: opaque
    exclusive_operations:
      - "POST /flights, PATCH /flights/{id}/assignment, POST /flights/{id}/close-manifest"
      - "POST /flights/{id}/events (DELAY, ACCEPT_DELAY, OPEN_BOARDING, DISPATCH, COMPLETE, CANCEL_WEATHER, CANCEL_OPS)"
      - "POST /weather-observations"
    shared_operations: ["all GET endpoints"]
  - name: BookingAgent
    description: "Reservations desk: bookings, credits, passenger check-in"
    identity: opaque
    exclusive_operations:
      - "POST /bookings, POST /bookings/{id}/apply-credit, POST /bookings/{id}/confirm, POST /bookings/{id}/events, POST /bookings/{id}/move"
      - "POST /passengers/{id}/events"
    shared_operations: ["GET endpoints except /duty-days and /complaints"]
  - name: ComplianceOfficer
    description: "Community-relations officer reviewing noise complaints"
    identity: opaque
    exclusive_operations: ["POST /complaints/{id}/events"]
    shared_operations: ["GET endpoints except /duty-days"]
  - name: CommunityReporter
    description: "Member of the public filing noise complaints"
    identity: opaque
    exclusive_operations: ["POST /complaints"]
    shared_operations: ["GET /complaints, GET /complaints/{id}, GET /bases/{id}, GET /routes, GET /routes/{id}, GET /flights, GET /flights/{id}, GET /aircraft, GET /aircraft/{id}, GET /seasons, GET /seasons/{id}, GET /pilots, GET /pilots/{id}, GET /weather-observations, GET /weather-observations/{id}"]
  - name: Pilot
    description: "Entity-backed pilot; acknowledges own flight assignments; reads own duty ledger"
    identity: "entity_backed:Pilot"
    exclusive_operations: ["POST /flights/{id}/events (PILOT_ACK — only when X-User-ID equals flight.pilot_id)"]
    shared_operations: ["GET /flights, GET /flights/{id}, GET /duty-days, GET /duty-days/{id} (own pilot_id only), plus general GET endpoints"]
