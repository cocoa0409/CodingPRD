              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /trade-marketing/deductions"
              payload: { customer_id: "${cust_id}", claim_reference: "MM-CLAIM-0043", claimed_amount: 400.00, deduction_date: "2026-08-03" }
