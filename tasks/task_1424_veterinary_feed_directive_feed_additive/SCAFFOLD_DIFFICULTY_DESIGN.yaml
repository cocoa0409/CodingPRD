  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: vfd_expiration_exact_boundary
        grounds:
          - calculations.vfd_remaining_quota
          - validations[priority=10]
          - errors.ERR_VFD_EXPIRED
          - entities.VfdAuthorization.fields.expiration_date
        distinguishing_aspect: |
          Numeric time threshold: VFD expiration_date=2026-10-01T00:00:00Z.
          At clock == expiration_date - 1 second, validate succeeds.
          At clock == expiration_date exactly, validate FAILS (>= semantics
          for the expiration rule, formulated as 'logical clock <
          vfd.expiration_date' so == fails).
        test_recipe:
          setup:
            - "Full chain to SUBMITTED Order O11 against VFD A11 with expiration 2026-10-01T00:00:00Z"
            - "Clock set to 2026-09-30T23:59:59Z"
