# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Hotel Revenue Management (RMS) — Expert band
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: group_displacement_lrv_vs_forecast_rev_diverge
        grounds:
          - calculations.group_displacement
          - entities.GroupBlock.fields.displacement_cost
          - entities.GroupBlock.fields.recommendation
        distinguishing_aspect: |
          Same GroupBlock evaluated under method=LRV vs method=FORECAST_REV yields different
          displacement_cost AND opposite recommendation (REJECT vs ACCEPT) — dual variant on the
          GroupBlock entity domain (group sales), distinct from the rate-decision pricing domain.
        test_recipe:
          setup:
            - "Property with total_rooms=30, overbooking_limit_pct=0.0"
            - "RoomType KING with physical_rooms=30"
            - "Master BAR rate plan with a PUBLISHED decision so published_rate=230.00"
            - "InventoryDay for 2026-06-06: physical_capacity=30, transient_sold_rooms=20, transient_revenue=4000 (transient ADR=200)"
            - "GroupBlock for 2026-06-06, nights=1, rooms_per_night=10, offered_rate=210 (group_value=2100); spill=10 rooms"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "Grand", total_rooms: 30, overbooking_limit_pct: 0.0, currency: "USD" }
              as: RevenueManager
              captures: { prop_id: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${prop_id}", code: "KING", name: "King Room", physical_rooms: 30 }
              as: RevenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt_id}", rate_class: "BAR", is_master_bar: true, min_los: 1, max_los: 0, base_rate: 230, floor_rate: 100, ceiling_rate: 400 }
              as: RevenueManager
              captures: { rp_id: $.data.id, rp_v: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-06T00:00:00Z", physical_capacity: 30, transient_sold_rooms: 20, transient_revenue: 4000 }
              as: RevenueManager
              captures: { inv_id: $.data.id }
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp_id}", stay_date: "2026-06-06T00:00:00Z", requested_rate: 230 }
              as: RevenueManager
              captures: { dec_id: $.data.id }
            - call: "POST /rate-decisions/${dec_id}/publish"
              payload: { expected_rate_plan_version: "${rp_v}" }
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { room_type_id: "${rt_id}", group_name: "Acme", arrival_date: "2026-06-06T00:00:00Z", nights: 1, rooms_per_night: 10, offered_rate: 210 }
              as: GroupSalesManager
              captures: { gb_id: $.data.id }
          trigger:
            - call: "POST /group-blocks/${gb_id}/evaluate"
              payload: { method: "LRV" }
              as: RevenueManager
              captures: { disp_lrv: $.data.displacement_cost, rec_lrv: $.data.recommendation }
            - call: "POST /group-blocks/${gb_id}/evaluate"
              payload: { method: "FORECAST_REV" }
              as: RevenueManager
              captures: { disp_fr: $.data.displacement_cost, rec_fr: $.data.recommendation }
          assert:
            - "First evaluate: GroupBlock.${gb_id}.displacement_cost == 2300.00 and recommendation == REJECT"
            - "Second evaluate: GroupBlock.${gb_id}.displacement_cost == 2000.00 and recommendation == ACCEPT"

      - name: rate_yield_with_lrv_premium_vs_without
        grounds:
          - calculations.rate_yield
          - entities.RateDecision.fields.yielded_rate
          - entities.RateDecision.fields.last_room_premium_applied
        distinguishing_aspect: |
          The rate_yield calc applied to two RateDecisions differing only in the night's
          rooms_available scarcity produces different yielded_rate because the last-room premium
          (+20%) fires in one and not the other — dual variant on the RateDecision/pricing domain,
          structurally distinct from the GroupBlock displacement variant above.
        test_recipe:
          setup:
            - "Property total_rooms=30, overbooking_limit_pct=0.0; RoomType physical_rooms=30"
            - "BAR plan floor=100 ceiling=400; no yield rules"
            - "InventoryDay A (2026-06-02): physical_capacity=100, transient_sold_rooms=50 -> rooms_available=50 (no premium)"
            - "InventoryDay B (2026-06-03): physical_capacity=10, transient_sold_rooms=6 -> rooms_available=4 (premium fires)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "Premier", total_rooms: 110 }
              as: RevenueManager
              captures: { prop_id: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${prop_id}", code: "STD", name: "Standard", physical_rooms: 110 }
              as: RevenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt_id}", rate_class: "BAR", is_master_bar: true, base_rate: 200, floor_rate: 100, ceiling_rate: 400 }
              as: RevenueManager
              captures: { rp_id: $.data.id, rp_v1: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-02T00:00:00Z", physical_capacity: 100, transient_sold_rooms: 50 }
              as: RevenueManager
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-03T00:00:00Z", physical_capacity: 10, transient_sold_rooms: 6 }
              as: RevenueManager
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp_id}", stay_date: "2026-06-02T00:00:00Z", requested_rate: 200 }
              as: RevenueManager
              captures: { dec_a: $.data.id }
            - call: "POST /rate-decisions/${dec_a}/publish"
              payload: { expected_rate_plan_version: "${rp_v1}" }
              as: RevenueManager
              captures: { yr_a: $.data.yielded_rate, prem_a: $.data.last_room_premium_applied, rp_v2: $.data.version }
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp_id}", stay_date: "2026-06-03T00:00:00Z", requested_rate: 150 }
              as: RevenueManager
              captures: { dec_b: $.data.id }
          trigger:
            - call: "POST /rate-decisions/${dec_b}/publish"
              payload: { expected_rate_plan_version: "${rp_v2}" }
              as: RevenueManager
              captures: { yr_b: $.data.yielded_rate, prem_b: $.data.last_room_premium_applied }
          assert:
            - "Decision A: RateDecision.${dec_a}.yielded_rate == 200.00 and last_room_premium_applied == false"
            - "Decision B: RateDecision.${dec_b}.yielded_rate == 180.00 and last_room_premium_applied == true"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: rate_yield_nonlinear_rule_then_premium_then_clamp
        grounds:
          - calculations.rate_yield
          - entities.YieldRule.fields.adjustment_pct
          - entities.RatePlan.fields.ceiling_rate
        distinguishing_aspect: |
          Mode (a): rate_yield combines >=3 inputs (requested_rate, eligible YieldRule.adjustment_pct,
          rooms_available scarcity, floor/ceiling) with non-linear nested interaction — rule factor,
          then conditional premium, then min/max clamp — so the final value depends on the pinned
          order, not a single linear term.
        test_recipe:
          setup:
            - "Property total_rooms=20, overbooking_limit_pct=0.0; RoomType physical_rooms=20"
            - "BAR plan floor=100 ceiling=400"
            - "YieldRule threshold 0.90, adjustment +0.50, priority 1, enabled"
            - "InventoryDay 2026-06-04: physical_capacity=20, transient_sold_rooms=18 -> forecast occ 1.0 (rule eligible), rooms_available=2 (premium fires)"
            - "RateDecision requested_rate=300 -> 300*1.5=450, *1.20=540, clamp ceiling 400"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "Apex", total_rooms: 20 }
              as: RevenueManager
              captures: { prop_id: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${prop_id}", code: "STE", name: "Suite", physical_rooms: 20 }
              as: RevenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /yield-rules"
              payload: { property_id: "${prop_id}", name: "PeakSurge", occupancy_threshold_pct: 0.90, adjustment_pct: 0.50, priority: 1, enabled: true }
              as: RevenueManager
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt_id}", rate_class: "BAR", is_master_bar: true, base_rate: 300, floor_rate: 100, ceiling_rate: 400 }
              as: RevenueManager
              captures: { rp_id: $.data.id, rp_v: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-04T00:00:00Z", physical_capacity: 20, transient_sold_rooms: 18 }
              as: RevenueManager
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp_id}", stay_date: "2026-06-04T00:00:00Z", requested_rate: 300 }
              as: RevenueManager
              captures: { dec_id: $.data.id }
          trigger:
            - call: "POST /rate-decisions/${dec_id}/publish"
              payload: { expected_rate_plan_version: "${rp_v}" }
              as: RevenueManager
              captures: { yr: $.data.yielded_rate }
          assert:
            - "RateDecision.${dec_id}.yielded_rate == 400.00 (ceiling clamp engaged after rule+premium)"
            - "RateDecision.${dec_id}.last_room_premium_applied == true"

      - name: channel_rate_round_per_channel_then_parity_compare
        grounds:
          - calculations.channel_sync
          - entities.ChannelMapping.fields.channel_rate
          - entities.ChannelMapping.fields.parity_status
        distinguishing_aspect: |
          Mode (b): channel_sync pins rounding order — each channel's channel_rate is rounded to cents
          per-channel BEFORE the net-rate parity comparison; rounding then comparing differs from
          comparing then rounding. A different mode from the nested min/max instance above.
        test_recipe:
          setup:
            - "Property total_rooms=50; RoomType physical_rooms=50"
            - "Master BAR plan published_rate=233.33 (publish requested 233.33, no yield rule, rooms_available large)"
            - "DIRECT mapping markup 0.0; OTA_A mapping markup 0.18"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "Vista", total_rooms: 50 }
              as: RevenueManager
              captures: { prop_id: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${prop_id}", code: "DLX", name: "Deluxe", physical_rooms: 50 }
              as: RevenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt_id}", rate_class: "BAR", is_master_bar: true, base_rate: 233.33, floor_rate: 100, ceiling_rate: 500 }
              as: RevenueManager
              captures: { rp_id: $.data.id, rp_v: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-05T00:00:00Z", physical_capacity: 50, transient_sold_rooms: 10 }
              as: RevenueManager
            - call: "POST /channel-mappings"
              payload: { rate_plan_id: "${rp_id}", channel: "DIRECT", markup_pct: 0.0 }
              as: ChannelManager
            - call: "POST /channel-mappings"
              payload: { rate_plan_id: "${rp_id}", channel: "OTA_A", markup_pct: 0.18 }
              as: ChannelManager
              captures: { ota_a_id: $.data.id }
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp_id}", stay_date: "2026-06-05T00:00:00Z", requested_rate: 233.33 }
              as: RevenueManager
              captures: { dec_id: $.data.id }
          trigger:
            - call: "POST /rate-decisions/${dec_id}/publish"
              payload: { expected_rate_plan_version: "${rp_v}" }
              as: RevenueManager
            - call: "GET /channel-mappings/${ota_a_id}"
              payload: {}
              as: ChannelManager
              captures: { cr: $.data.channel_rate, ps: $.data.parity_status }
          assert:
            - "OTA_A ChannelMapping.${ota_a_id}.channel_rate == 275.33 (round(233.33*1.18,2))"
            - "OTA_A ChannelMapping.${ota_a_id}.parity_status == IN_PARITY (net 233.33 == direct net 233.33)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: rate_decision_branching_publish_vs_reject
        grounds:
          - state_machines.RateDecision.DRAFT_to_PUBLISHED
          - state_machines.RateDecision.DRAFT_to_REJECTED
          - state_machines.RateDecision.PUBLISHED_to_SUPERSEDED
        distinguishing_aspect: |
          RateDecision branches from DRAFT to two terminal/divergent targets (PUBLISHED with full
          yield+sync+KPI side-effects, vs REJECTED with none) — branching fork on the RateDecision
          entity, not a linear pipeline.
        test_recipe:
          setup:
            - "Property/RoomType/master BAR plan; InventoryDay for 2026-06-07"
            - "Two DRAFT rate decisions on the same plan for the same stay_date"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "Branch", total_rooms: 40 }
              as: RevenueManager
              captures: { prop_id: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${prop_id}", code: "KING", name: "King", physical_rooms: 40 }
              as: RevenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt_id}", rate_class: "BAR", is_master_bar: true, base_rate: 200, floor_rate: 100, ceiling_rate: 400 }
              as: RevenueManager
              captures: { rp_id: $.data.id, rp_v: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-07T00:00:00Z", physical_capacity: 40, transient_sold_rooms: 10 }
              as: RevenueManager
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp_id}", stay_date: "2026-06-07T00:00:00Z", requested_rate: 200 }
              as: RevenueManager
              captures: { dec_pub: $.data.id }
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp_id}", stay_date: "2026-06-07T00:00:00Z", requested_rate: 250 }
              as: RevenueManager
              captures: { dec_rej: $.data.id }
          trigger:
            - call: "POST /rate-decisions/${dec_pub}/publish"
              payload: { expected_rate_plan_version: "${rp_v}" }
              as: RevenueManager
            - call: "POST /rate-decisions/${dec_rej}/reject"
              payload: { reject_reason: "off strategy" }
              as: RevenueManager
          assert:
            - "RateDecision.${dec_pub}.status == PUBLISHED and yielded_rate == 200.00"
            - "RateDecision.${dec_rej}.status == REJECTED and yielded_rate == null"
            - "RatePlan.${rp_id}.published_rate == 200.00 (driven by the published decision, not the rejected one)"

      - name: group_block_cyclic_negotiating_revision_loop
        grounds:
          - state_machines.GroupBlock.NEGOTIATING_to_REVISION_REQUESTED
          - state_machines.GroupBlock.REVISION_REQUESTED_to_NEGOTIATING
          - state_machines.GroupBlock.NEGOTIATING_to_COMMITTED
        distinguishing_aspect: |
          GroupBlock cycles NEGOTIATING -> REVISION_REQUESTED -> NEGOTIATING before COMMITTED — a true
          revision loop on the GroupBlock entity (different entity from RateDecision's branching).
        test_recipe:
          setup:
            - "Property/RoomType physical_rooms=30; master BAR plan published_rate=230.00; InventoryDay 2026-06-06 with capacity 30, sold 20"
            - "GroupBlock 2026-06-06 nights=1 rooms_per_night=10 offered_rate=210 -> evaluate REJECT (spill displacement > group_value)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "Loop", total_rooms: 30 }
              as: RevenueManager
              captures: { prop_id: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${prop_id}", code: "KING", name: "King", physical_rooms: 30 }
              as: RevenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt_id}", rate_class: "BAR", is_master_bar: true, base_rate: 230, floor_rate: 100, ceiling_rate: 400 }
              as: RevenueManager
              captures: { rp_id: $.data.id, rp_v: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-06T00:00:00Z", physical_capacity: 30, transient_sold_rooms: 20, transient_revenue: 4000 }
              as: RevenueManager
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp_id}", stay_date: "2026-06-06T00:00:00Z", requested_rate: 230 }
              as: RevenueManager
              captures: { dec_id: $.data.id }
            - call: "POST /rate-decisions/${dec_id}/publish"
              payload: { expected_rate_plan_version: "${rp_v}" }
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { room_type_id: "${rt_id}", group_name: "Acme", arrival_date: "2026-06-06T00:00:00Z", nights: 1, rooms_per_night: 10, offered_rate: 210 }
              as: GroupSalesManager
              captures: { gb_id: $.data.id }
            - call: "POST /group-blocks/${gb_id}/evaluate"
              payload: { method: "LRV" }
              as: RevenueManager
          trigger:
            - call: "POST /group-blocks/${gb_id}/request-revision"
              payload: {}
              as: RevenueManager
              captures: { s1: $.data.status }
            - call: "PATCH /group-blocks/${gb_id}"
              payload: { offered_rate: 300 }
              as: GroupSalesManager
              captures: { s2: $.data.status, disp_after: $.data.displacement_cost }
          trigger_note: "After PATCH the block is back in NEGOTIATING and displacement_cost is reset to null."
          assert:
            - "After request-revision: GroupBlock.${gb_id}.status == REVISION_REQUESTED"
            - "After PATCH revise: GroupBlock.${gb_id}.status == NEGOTIATING and displacement_cost == null and recommendation == null"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: commit_holds_rooms_recompute_availability_then_kpi_depth3
        grounds:
          - state_machines.GroupBlock.NEGOTIATING_to_COMMITTED
          - calculations.availability
          - calculations.property_kpi
        distinguishing_aspect: |
          Depth-3 transitive chain triggered by group commit: (1) commit increments
          InventoryDay.group_held_rooms; (2) that field change forces availability recompute on the
          same InventoryDay (rooms_sold/rooms_available); (3) the changed rooms_sold forces
          property_kpi recompute (occupancy/adr/revpar) — each hop caused by the previous derived field.
        test_recipe:
          setup:
            - "Clock = 2026-06-06 (KPI date == stay_date)"
            - "Property total_rooms=30, overbooking_limit_pct=0.0; RoomType physical_rooms=30"
            - "InventoryDay 2026-06-06: capacity 30, transient_sold_rooms=8, transient_revenue=2400"
            - "GroupBlock 1 night, rooms_per_night=5, offered_rate=300 -> evaluate ACCEPT (spill 0)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "Cascade3", total_rooms: 30 }
              as: RevenueManager
              captures: { prop_id: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${prop_id}", code: "KING", name: "King", physical_rooms: 30 }
              as: RevenueManager
              captures: { rt_id: $.data.id, rt_v: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-06T00:00:00Z", physical_capacity: 30, transient_sold_rooms: 8, transient_revenue: 2400 }
              as: RevenueManager
              captures: { inv_id: $.data.id }
            - call: "POST /group-blocks"
              payload: { room_type_id: "${rt_id}", group_name: "Bravo", arrival_date: "2026-06-06T00:00:00Z", nights: 1, rooms_per_night: 5, offered_rate: 300 }
              as: GroupSalesManager
              captures: { gb_id: $.data.id }
            - call: "POST /group-blocks/${gb_id}/evaluate"
              payload: { method: "LRV" }
              as: RevenueManager
          trigger:
            - call: "POST /group-blocks/${gb_id}/commit"
              payload: { expected_room_type_version: "${rt_v}" }
              as: GroupSalesManager
            - call: "GET /inventory-days/${inv_id}"
              payload: {}
              as: RevenueManager
              captures: { gh: $.data.group_held_rooms, rs: $.data.rooms_sold, ra: $.data.rooms_available }
            - call: "GET /properties/${prop_id}/kpis"
              payload: {}
              as: RevenueManager
              captures: { occ: $.data.occupancy_pct, adr: $.data.adr, revpar: $.data.revpar }
          assert:
            - "InventoryDay.${inv_id}.group_held_rooms == 5 (hop1)"
            - "InventoryDay.${inv_id}.rooms_sold == 13 and rooms_available == 17 (hop2)"
            - "Property.${prop_id}.occupancy_pct == 0.4333 and adr == 300.00 and revpar == 130.00 (hop3)"

      - name: publish_sets_rate_then_resyncs_channel_depth2
        grounds:
          - state_machines.RateDecision.DRAFT_to_PUBLISHED
          - entities.RatePlan.fields.published_rate
          - calculations.channel_sync
        distinguishing_aspect: |
          Depth-2 transitive chain triggered by publishing a master BAR decision: (1) publish sets
          RatePlan.published_rate; (2) because published_rate changed, every ChannelMapping under the
          plan re-syncs channel_rate — second hop caused strictly by the first. Different trigger
          (publish) and propagation pattern from the commit cascade above.
        test_recipe:
          setup:
            - "Property/RoomType; master BAR plan; OTA_A mapping markup 0.18 (channel_rate null until publish)"
            - "InventoryDay 2026-06-08 capacity 50 sold 10"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /properties"
              payload: { name: "Cascade2", total_rooms: 50 }
              as: RevenueManager
              captures: { prop_id: $.data.id }
            - call: "POST /room-types"
              payload: { property_id: "${prop_id}", code: "STD", name: "Standard", physical_rooms: 50 }
              as: RevenueManager
              captures: { rt_id: $.data.id }
            - call: "POST /rate-plans"
              payload: { room_type_id: "${rt_id}", rate_class: "BAR", is_master_bar: true, base_rate: 200, floor_rate: 100, ceiling_rate: 400 }
              as: RevenueManager
              captures: { rp_id: $.data.id, rp_v: $.data.version }
            - call: "POST /inventory-days"
              payload: { room_type_id: "${rt_id}", stay_date: "2026-06-08T00:00:00Z", physical_capacity: 50, transient_sold_rooms: 10 }
              as: RevenueManager
            - call: "POST /channel-mappings"
              payload: { rate_plan_id: "${rp_id}", channel: "DIRECT", markup_pct: 0.0 }
              as: ChannelManager
            - call: "POST /channel-mappings"
              payload: { rate_plan_id: "${rp_id}", channel: "OTA_A", markup_pct: 0.18 }
              as: ChannelManager
              captures: { ota_id: $.data.id }
            - call: "POST /rate-decisions"
              payload: { rate_plan_id: "${rp_id}", stay_date: "2026-06-08T00:00:00Z", requested_rate: 200 }
              as: RevenueManager
              captures: { dec_id: $.data.id }
          trigger:
            - call: "POST /rate-decisions/${dec_id}/publish"
