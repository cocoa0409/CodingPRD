    input_types: { unit_id: "string, required", staff_id: "string, required", role_slot: "enum CHARGE|BEDSIDE|ONE_TO_ONE_FLOAT|OR_STANDBY|TRIAGE, required", shift_start_utc: "datetime, required", shift_end_utc: "datetime, required, > shift_start_utc" }
