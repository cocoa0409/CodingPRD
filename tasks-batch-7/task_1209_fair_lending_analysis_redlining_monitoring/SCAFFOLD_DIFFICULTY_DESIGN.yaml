            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: PROTECTED_1, outcome: DENIED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 720, dti_pct: 40.0, application_date: "2026-02-01", decision_date: "2026-02-10" }, as: LendingDataOps, captures: { p1: $.data.id } }
            - { call: "POST /fair-lending/applications/${c1}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/applications/${p1}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/analysis-runs", payload: { market_id: "${m1}", product_type: CONVENTIONAL, prohibited_basis: RACE, period_start: "2026-01-01", period_end: "2026-04-01" }, as: FairLendingAnalyst, captures: { r1: $.data.id } }
            - { call: "POST /fair-lending/analysis-runs/${r1}/lock", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/analysis-runs/${r1}/compute", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/findings", payload: { analysis_run_id: "${r1}", kind: DENIAL_DISPARITY, notes: "manual" }, as: FairLendingAnalyst, as_user_id: "analyst-creator", captures: { f1: $.data.id } }
            - { call: "POST /fair-lending/findings/${f1}/begin-review", payload: {}, as: FairLendingAnalyst, captures: { f_v: $.data.version } }
            - { call: "POST /fair-lending/matched-pair-reviews", payload: { finding_id: "${f1}", target_application_id: "${p1}", control_application_id: "${c1}", expected_finding_version: "${f_v}" }, as: FairLendingAnalyst, captures: { mp1: $.data.id } }
            - { call: "POST /fair-lending/matched-pair-reviews/${mp1}/submit-initial", payload: { outcome: DIFFERENTIAL_TREATMENT, notes: "comparable file, worse outcome" }, as: FairLendingAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "POST /fair-lending/findings/${f1}/substantiate", payload: { harmed_application_ids: ["${p1}"] }, as: FairLendingOfficer, as_user_id: "officer-sub", captures: { err: $.data.error_id } }
            - { call: "POST /fair-lending/matched-pair-reviews/${mp1}/confirm", payload: {}, as: FairLendingOfficer, as_user_id: "officer-1" }
            - { call: "POST /fair-lending/findings/${f1}/substantiate", payload: { harmed_application_ids: ["${p1}"] }, as: FairLendingOfficer, as_user_id: "officer-sub", captures: { f_status: $.data.status, f_harmed: $.data.harmed_application_ids } }
          assert:
            - "first substantiate -> 409 ERR_NO_CONFIRMED_MATCHED_PAIR (review only INITIAL_REVIEWED)"
            - "after confirm: substantiate -> SUBSTANTIATED and harmed_application_ids == [${p1}]"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap: AnalysisRun scope uses half-open
  # intervals (adjacency allowed); SelfTest windows use CLOSED intervals
  # (touching boundaries collide). Different resources, different semantics.
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: run_scope_half_open_adjacency
        grounds:
          - errors[ERR_SCOPE_OVERLAP]
          - validations[priority=7]
          - entities.AnalysisRun.fields.period_start
        distinguishing_aspect: |
          Resource AnalysisRun; semantics half-open [period_start, period_end):
          a run starting exactly at the existing run's period_end (2026-04-01)
          is ACCEPTED (adjacency is not overlap), while one starting
          2026-03-31 is rejected ERR_SCOPE_OVERLAP. Overlap is keyed on
          (market_id, product_type, prohibited_basis) among non-ARCHIVED runs.
        test_recipe:
          setup:
            - "Run R1 on (M1, CONVENTIONAL, RACE, [2026-01-01, 2026-04-01)) exists (DRAFT)"
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /fair-lending/analysis-runs", payload: { market_id: "${m1}", product_type: CONVENTIONAL, prohibited_basis: RACE, period_start: "2026-01-01", period_end: "2026-04-01" }, as: FairLendingAnalyst, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /fair-lending/analysis-runs", payload: { market_id: "${m1}", product_type: CONVENTIONAL, prohibited_basis: RACE, period_start: "2026-04-01", period_end: "2026-07-01" }, as: FairLendingAnalyst, captures: { r2: $.data.id } }
            - { call: "POST /fair-lending/analysis-runs", payload: { market_id: "${m1}", product_type: CONVENTIONAL, prohibited_basis: RACE, period_start: "2026-03-31", period_end: "2026-07-01" }, as: FairLendingAnalyst, captures: { err: $.data.error_id } }
            - { call: "POST /fair-lending/analysis-runs", payload: { market_id: "${m1}", product_type: FHA, prohibited_basis: RACE, period_start: "2026-02-01", period_end: "2026-05-01" }, as: FairLendingAnalyst, captures: { r3: $.data.id } }
          assert:
            - "adjacent run (period_start == R1.period_end) -> 201 created (half-open adjacency allowed)"
            - "overlapping run (period_start 2026-03-31 < R1.period_end) -> 409 ERR_SCOPE_OVERLAP"
            - "same window but different product_type (FHA) -> 201 created (overlap key includes product)"

      - name: self_test_closed_interval_touching_overlap
        grounds:
          - errors[ERR_SELF_TEST_WINDOW_OVERLAP]
          - validations[priority=7]
          - entities.SelfTest.fields.window_end
        distinguishing_aspect: |
          Resource SelfTest; semantics CLOSED [window_start, window_end]: a
          self-test whose window_start (2026-03-31) merely TOUCHES the active
          test's window_end (2026-03-31) is rejected
          ERR_SELF_TEST_WINDOW_OVERLAP — the opposite adjacency outcome from
          the half-open run rule; window_start 2026-04-01 is accepted.
        test_recipe:
          setup:
            - "SelfTest S1 on M1 with window [2026-01-01, 2026-03-31] ACTIVE"
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /fair-lending/self-tests", payload: { market_id: "${m1}", window_start: "2026-01-01", window_end: "2026-03-31" }, as: FairLendingAnalyst, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /fair-lending/self-tests", payload: { market_id: "${m1}", window_start: "2026-03-31", window_end: "2026-06-30" }, as: FairLendingAnalyst, captures: { err: $.data.error_id } }
            - { call: "POST /fair-lending/self-tests", payload: { market_id: "${m1}", window_start: "2026-04-01", window_end: "2026-06-30" }, as: FairLendingAnalyst, captures: { s3: $.data.id } }
          assert:
            - "touching window (start == existing window_end) -> 409 ERR_SELF_TEST_WINDOW_OVERLAP (closed-interval semantics)"
            - "window starting the day after (2026-04-01) -> 201 created"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant: CAP pool cents conserved under
  # void/return; officer ledger counts conserved under rescind/reverse.
  # Different conserved quantity types (money vs counts).
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: cap_pool_cents_conserved_under_void_and_return
        grounds:
          - calculations.cap_funds_rollup
          - state_machines.RemediationPayment.PENDING_to_VOIDED
          - state_machines.RemediationPayment.DISBURSED_to_RETURNED
          - entities.CorrectiveActionPlan.fields.remaining_cents
        distinguishing_aspect: |
          Conserved quantity: money — for the CAP, pool_cents ==
          remaining_cents + sum(amount_cents over PENDING and DISBURSED
          payments) after EVERY hop. Forward+compensating pairs (create manual
          payment then void; disburse then mark-returned) leave remaining and
          disbursed exactly as before the pair executed.
        test_recipe:
          setup:
            - "Run R COMPUTED; finding F SUBSTANTIATED harmed [p1, p2, p3]; CAP C pool 10000 approved -> payments [3334 (p1), 3333 (p2), 3333 (p3)], remaining_cents == 0"
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /fair-lending/branches", payload: { market_id: "${m1}", name: "Main", tract_minority_pct: 55.0, opened_on: "2020-01-15" }, as: BankAdmin, captures: { b1: $.data.id } }
            - { call: "POST /fair-lending/loan-officers", payload: { branch_id: "${b1}", full_name: "Officer One" }, as: BankAdmin, captures: { o1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 720, dti_pct: 36.0, application_date: "2026-01-05", decision_date: "2026-01-20" }, as: LendingDataOps, captures: { c1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: PROTECTED_1, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 715, dti_pct: 36.0, application_date: "2026-02-01", decision_date: "2026-02-10" }, as: LendingDataOps, captures: { p1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: PROTECTED_1, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 716, dti_pct: 36.0, application_date: "2026-02-02", decision_date: "2026-02-11" }, as: LendingDataOps, captures: { p2: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: PROTECTED_1, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 717, dti_pct: 36.0, application_date: "2026-02-03", decision_date: "2026-02-12" }, as: LendingDataOps, captures: { p3: $.data.id } }
            - { call: "POST /fair-lending/applications/${c1}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/applications/${p1}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/applications/${p2}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/applications/${p3}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/analysis-runs", payload: { market_id: "${m1}", product_type: CONVENTIONAL, prohibited_basis: RACE, period_start: "2026-01-01", period_end: "2026-04-01" }, as: FairLendingAnalyst, captures: { r1: $.data.id } }
            - { call: "POST /fair-lending/analysis-runs/${r1}/lock", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/analysis-runs/${r1}/compute", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/findings", payload: { analysis_run_id: "${r1}", kind: PRICING_DISPARITY, notes: "manual" }, as: FairLendingAnalyst, as_user_id: "analyst-creator", captures: { f1: $.data.id } }
            - { call: "POST /fair-lending/findings/${f1}/begin-review", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/findings/${f1}/substantiate", payload: { harmed_application_ids: ["${p1}", "${p2}", "${p3}"] }, as: FairLendingOfficer, as_user_id: "officer-sub", captures: { f_v: $.data.version } }
            - { call: "POST /fair-lending/corrective-action-plans", payload: { finding_id: "${f1}", title: "remediation", pool_cents: 10000, due_date: "2026-06-30", expected_finding_version: "${f_v}" }, as: FairLendingAnalyst, captures: { cap1: $.data.id } }
            - { call: "POST /fair-lending/corrective-action-plans/${cap1}/submit", payload: {}, as: FairLendingAnalyst }
            - { call: "POST /fair-lending/corrective-action-plans/${cap1}/approve", payload: {}, as: FairLendingOfficer, as_user_id: "officer-1", captures: { cap_rem0: $.data.remaining_cents } }
            - { call: "GET /fair-lending/remediation-payments", payload: { corrective_action_plan_id: "${cap1}", application_id: "${p1}" }, as: RemediationSpecialist, captures: { pay1: "$.data[0].id" } }
            - { call: "GET /fair-lending/remediation-payments", payload: { corrective_action_plan_id: "${cap1}", application_id: "${p2}" }, as: RemediationSpecialist, captures: { pay2: "$.data[0].id" } }
          trigger:
            - { call: "POST /fair-lending/remediation-payments/${pay1}/void", payload: { reason: "misallocated" }, as: RemediationSpecialist, as_user_id: "specialist-1" }
            - { call: "GET /fair-lending/corrective-action-plans/${cap1}", payload: {}, as: RemediationSpecialist, captures: { rem1: $.data.remaining_cents, disb1: $.data.disbursed_cents } }
            - { call: "POST /fair-lending/remediation-payments/${pay2}/disburse", payload: {}, as: RemediationSpecialist, as_user_id: "specialist-1" }
            - { call: "GET /fair-lending/corrective-action-plans/${cap1}", payload: {}, as: RemediationSpecialist, captures: { rem2: $.data.remaining_cents, disb2: $.data.disbursed_cents } }
            - { call: "POST /fair-lending/remediation-payments/${pay2}/mark-returned", payload: { reason: "check returned undeliverable" }, as: RemediationSpecialist, as_user_id: "specialist-1" }
            - { call: "GET /fair-lending/corrective-action-plans/${cap1}", payload: {}, as: RemediationSpecialist, captures: { rem3: $.data.remaining_cents, disb3: $.data.disbursed_cents } }
          assert:
            - "post-approval invariant: remaining_cents == 0 and 0 + (3334 + 3333 + 3333) == pool_cents 10000"
            - "after void (forward PENDING->VOIDED is compensating for allocation): remaining_cents == 3334, disbursed_cents == 0; 3334 + (3333 + 3333) == 10000"
            - "after disburse: remaining_cents == 3334, disbursed_cents == 3333; 3334 + (3333 PENDING + 3333 DISBURSED) == 10000"
            - "after mark-returned (compensates the disburse): remaining_cents == 6667, disbursed_cents == 0; 6667 + 3333 == 10000 — no drift in the conserved money quantity"

      - name: officer_ledger_counts_conserved_under_rescind_and_reverse
        grounds:
          - state_machines.PricingException.APPROVED_to_RESCINDED
          - state_machines.UnderwritingOverride.CONFIRMED_to_REVERSED
          - entities.LoanOfficer.fields.approved_exception_count
          - entities.LoanOfficer.fields.confirmed_override_count
        distinguishing_aspect: |
          Conserved quantity: ledger counts — LoanOfficer.approved_exception_count
          == |officer's PricingExceptions in APPROVED| and
          confirmed_override_count == |officer's UnderwritingOverrides in
          CONFIRMED| after every hop; approve+rescind and confirm+reverse
          pairs return both counts and the derived risk_score to their exact
          prior values (money plays no role — different quantity type than
          the CAP pool invariant).
        test_recipe:
          setup:
            - "Officer O1 with exactly 1 VALIDATED application (ORIGINATED @700bps); scorecard baseline risk_score 0.00 GREEN, both counts 0"
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
            - { call: "POST /fair-lending/branches", payload: { market_id: "${m1}", name: "Main", tract_minority_pct: 55.0, opened_on: "2020-01-15" }, as: BankAdmin, captures: { b1: $.data.id } }
            - { call: "POST /fair-lending/loan-officers", payload: { branch_id: "${b1}", full_name: "Officer One" }, as: BankAdmin, captures: { o1: $.data.id } }
            - { call: "POST /fair-lending/applications", payload: { market_id: "${m1}", branch_id: "${b1}", loan_officer_id: "${o1}", product_type: CONVENTIONAL, applicant_group: CONTROL, outcome: ORIGINATED, note_rate_bps: 700, loan_amount_cents: 30000000, credit_score: 720, dti_pct: 36.0, application_date: "2026-01-05", decision_date: "2026-01-20" }, as: LendingDataOps, captures: { a1: $.data.id } }
            - { call: "POST /fair-lending/applications/${a1}/validate", payload: {}, as: LendingDataOps }
            - { call: "POST /fair-lending/pricing-exceptions", payload: { application_id: "${a1}", kind: FEE_WAIVER, requested_rate_bps: 700, justification: "fee concession" }, as: LoanOfficer, as_user_id: "${o1}", captures: { e1: $.data.id } }
            - { call: "POST /fair-lending/underwriting-overrides", payload: { application_id: "${a1}", original_decision: DENY, overridden_decision: APPROVE, justification: "compensating factors" }, as: LoanOfficer, as_user_id: "${o1}", captures: { ov1: $.data.id } }
          trigger:
            - { call: "POST /fair-lending/pricing-exceptions/${e1}/approve", payload: {}, as: FairLendingOfficer }
            - { call: "GET /fair-lending/loan-officers/${o1}/risk-scorecard", payload: {}, as: FairLendingAnalyst, captures: { exc_mid: $.data.approved_exception_count, score_mid1: $.data.risk_score } }
            - { call: "POST /fair-lending/pricing-exceptions/${e1}/rescind", payload: {}, as: FairLendingOfficer }
            - { call: "GET /fair-lending/loan-officers/${o1}/risk-scorecard", payload: {}, as: FairLendingAnalyst, captures: { exc_end: $.data.approved_exception_count, score_end1: $.data.risk_score, tier_end1: $.data.monitoring_tier } }
            - { call: "POST /fair-lending/underwriting-overrides/${ov1}/confirm", payload: {}, as: FairLendingOfficer }
            - { call: "GET /fair-lending/loan-officers/${o1}/risk-scorecard", payload: {}, as: FairLendingAnalyst, captures: { ovr_mid: $.data.confirmed_override_count, score_mid2: $.data.risk_score } }
            - { call: "POST /fair-lending/underwriting-overrides/${ov1}/reverse", payload: { reason: "documented error" }, as: FairLendingOfficer }
            - { call: "GET /fair-lending/loan-officers/${o1}/risk-scorecard", payload: {}, as: FairLendingAnalyst, captures: { ovr_end: $.data.confirmed_override_count, score_end2: $.data.risk_score, tier_end2: $.data.monitoring_tier } }
          assert:
            - "approve: approved_exception_count == 1, risk_score == 35.00 (rate 1/1 -> 35 x 1.0)"
            - "rescind (compensates approve): approved_exception_count == 0, risk_score == 0.00, monitoring_tier == GREEN — ledger restored exactly"
            - "confirm: confirmed_override_count == 1, risk_score == 40.00 (WATCH boundary, >= semantics)"
            - "reverse (compensates confirm): confirmed_override_count == 0, risk_score == 0.00, monitoring_tier == GREEN — no drift in the conserved count quantities"
