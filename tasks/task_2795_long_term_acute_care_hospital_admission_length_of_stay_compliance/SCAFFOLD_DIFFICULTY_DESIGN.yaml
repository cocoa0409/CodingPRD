      - name: recombination_unwinds_ledger_review_and_referral_share_together
        grounds:
          - state_machines.Stay.ADMITTED_to_RECOMBINED
          - state_machines.PaymentDetermination.FINAL_to_VOIDED
          - state_machines.DenialRiskReview.CLEARED_to_VOIDED
          - calculations.period_payment_rollup
          - calculations.referral_source_share
        distinguishing_aspect: |
          The same chain run BACKWARDS, and it fans out sideways as well: ONE recombine call voids a
          FINAL determination, voids the CLEARED review behind it - a state the machine only leaves
          for VOIDED - subtracts 1,512,000c from the period ledger, and
          decrements the referring hospital's admission count so share_pct and monitoring_state are
          recomputed. Unlike the forward cascade, this propagation must reverse an already-committed
          aggregate rather than accumulate into a fresh one, and it touches two different aggregate
          roots (period money and hospital mix) from a single write.
        test_recipe:
          setup:
            - "OPEN period FY2027, ACTIVE criteria set CS-2026A, DRG 207 loaded, single referring hospital Metro General."
            - "Parent stay: patient Hal Return admitted backdated 2026-07-01, discharged at clock 2026-07-15 with cost 1,000,000c -> covered LOS 14, DRAFT determination 1,512,000c, review scored 67 (MODERATE, no auto query) and resolved CLEARED as validation priority 22 requires, determination FINALIZED by a second user so the ledger reads 1,512,000c / count 1."
            - "Child stay: the same patient re-referred and admitted at clock 2026-07-17, two days after the parent discharge - inside RECOMBINATION_WINDOW_DAYS (3). The period now shows total_admissions 2 and Metro General shows admissions_in_period 2 with share_pct 100.00."
          setup_api_calls:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "FY2027", start_date: "2026-07-01", end_date: "2027-06-30" }
