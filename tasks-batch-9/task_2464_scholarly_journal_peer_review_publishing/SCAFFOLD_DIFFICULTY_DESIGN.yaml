              as: Author
              as_user_id: "${au_id}"
              captures: { m_id: $.data.id }
            - call: "POST /manuscripts/${m_id}/integrity-screenings"
              payload: { scan_type: "PLAGIARISM", similarity_pct: 5.0 }
