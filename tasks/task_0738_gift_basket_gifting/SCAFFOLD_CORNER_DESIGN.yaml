      - name: inventory_reservations_reverse_reachability_by_sku_id
        claim_type: "fk_integrity"
        grounds: ["endpoints[GET /inventory-reservations]"]
        distinguishing_aspect: "InventoryReservation.sku_id's reverse-reachability is satisfied by the filtered-list form: GET /inventory-reservations?sku_id= returns every reservation against that SKU, collapsed with the recipient_id filter in the same endpoint."
        test_recipe:
          setup: ["One ComponentSKU with one active reservation created via recipient import."]
