            - { call: "POST /depot/_clock/set_current_utc", as: DepotManager, payload: { to_iso8601: "2026-09-01T00:00:00Z" } }
            - { call: "POST /depot/ops/run_daily_close", as: DepotManager, payload: {} , captures: { c2: $.data.auto_cancelled_rma_ids } }
