        grounds:
          - validations[priority=10]
          - validations[priority=14]
          - errors[ERR_CARD_FROZEN]
          - errors[ERR_INSUFFICIENT_FUNDS]
        distinguishing_aspect: |
          Error-category pair state x business_fiscal: a purchase on a LOST_FROZEN card whose
          derived account also lacks funds returns ERR_CARD_FROZEN (state, priority 10), never
          ERR_INSUFFICIENT_FUNDS (fiscal, priority 14).
        test_recipe:
          setup:
