  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: actual_placement_blocked_by_facility_access_mode_not_by_cycle_state
        grounds:
          - validations.priority_52_facility_not_open
          - entities.Facility.fields.access_mode
          - state_machines.PlacementCycle.CONSTRUCTIVELY_PLACED_to_ACTUALLY_PLACED
          - errors.ERR_FACILITY_NOT_OPEN
        distinguishing_aspect: |
          The PlacementCycle is in a perfectly legal source state
          (CONSTRUCTIVELY_PLACED) and the payload is valid, yet the transition is
          refused because a DIFFERENT entity — the Facility — sits in
          GATE_CONTROLLED. The dependency is asymmetric on the same pair:
          GATE_CONTROLLED blocks actual placement but NOT release, so the very
          same facility state that refuses the car in will let the car out. No
          field on PlacementCycle can predict the outcome.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T10:00:00Z"
            - "one CONSTRUCTIVELY_PLACED cycle at an INDUSTRY_TRACK facility: CP 2026-08-03T08:00:00Z, EDI notice 09:00:00Z"
            - "the Facility.access_mode has been set to GATE_CONTROLLED, which is neither OPEN nor EMBARGOED"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "R7I1-CUST", name: "Gate Controlled Grain", serving_station_code: "STN17", notification_method: "EDI" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "R7I1-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "R7I1-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "R7I1-CEFX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-R7I1-001", expected_rail_car_version: "${car_v}" }
              as: RailroadAgent
              captures: { cyc_id: $.data.id }
            - call: "POST /demurrage/placement-cycles/${cyc_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T08:00:00Z", reason_code: "GATE_CLOSED" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/notify"
              payload: { channel: "EDI", sent_at: "2026-08-03T09:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/facilities/${fac_id}/access-mode"
              payload: { access_mode: "GATE_CONTROLLED", reason: "Night curfew on the industrial lead." }
              as: RailroadAgent
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /demurrage/placement-cycles/${cyc_id}/actual-placement"
              payload: { actual_placement_at: "2026-08-05T10:00:00Z" }
              as: RailroadAgent
              captures: { err_gate: $.data.error_id }
            - call: "POST /demurrage/facilities/${fac_id}/access-mode"
              payload: { access_mode: "OPEN", reason: "Curfew lifted." }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/actual-placement"
              payload: { actual_placement_at: "2026-08-05T10:00:00Z" }
              as: RailroadAgent
          assert:
            - "the first attempt returns 409 with error_id ERR_FACILITY_NOT_OPEN"
            - "the refused attempt left PlacementCycle.${cyc_id} at CONSTRUCTIVELY_PLACED with actual_placement_at null, clock_basis CONSTRUCTIVE and its version unchanged"
            - "the refused attempt left Facility.${fac_id}.occupied_spot_count at 0"
            - "after only Facility.access_mode changed to OPEN, the identical actual-placement request returns 200"
            - "after the successful placement: movement_status ACTUALLY_PLACED, clock_basis ACTUAL, free_time_expires_at 2026-08-07T23:59:59.999Z, Facility.${fac_id}.occupied_spot_count == 1"
            - "the asymmetry holds: had the facility instead been GATE_CONTROLLED at release time, release would have SUCCEEDED, since only EMBARGOED blocks release"
            - "no field on PlacementCycle changed between the failing and succeeding attempts"

      - name: regulatory_complaint_requires_a_twice_decided_dispute
        grounds:
          - validations.priority_40_dispute_state_for_complaint
          - validations.priority_78_appeal_not_exhausted
          - entities.DemurrageDispute.fields.round_number
          - state_machines.RegulatoryComplaint.status
          - errors.ERR_DISPUTE_INVALID_STATE
          - errors.ERR_APPEAL_NOT_EXHAUSTED
        distinguishing_aspect: |
          Creating a RegulatoryComplaint depends on two separate facts held by
          another entity, and they fail with different codes at different
          priorities: the dispute's status must be DECIDED (priority 40, 409
          ERR_DISPUTE_INVALID_STATE) and its round_number must have reached 2
          (priority 78, 422 ERR_APPEAL_NOT_EXHAUSTED). The instance walks the
          dispute through both failing configurations and then through the
          passing one, so the two gates are shown to be independent rather than
          one condition reported two ways.
        test_recipe:
          setup:
            - "logical clock at 2026-08-15T10:00:00Z rising to 2026-09-05T00:00:00Z"
            - "one ISSUED single-charge Invoice at 47550 with a WHOLE_INVOICE dispute whose claimed_credit_cents is 47550"
            - "two distinct adjudicator ids exist: adj-r7i2-a for round 1 and adj-r7i2-b for the appeal"
