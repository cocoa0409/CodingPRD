  # =================================================================
  # Rule 7 — cross_entity_state_dependency
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: work_order_requires_graded_non_reject_core
        grounds:
          - validations[priority=9]
          - state_machines.CoreReturn.RECEIVED_to_GRADED
        distinguishing_aspect: |
          Entity pair RemanWorkOrder x CoreReturn: work-order creation is gated on
          the SOURCE CORE RETURN's state — RECEIVED and REJECT-graded returns are
          refused with ERR_CORE_RETURN_NOT_GRADED; only a GRADED non-REJECT core
          unlocks creation.
        test_recipe:
          setup:
            - "Distributor D-GATE; ACTIVE spec; return R1 still RECEIVED; return R2 will be graded REJECT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-GATE", name: "Gate Cores", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { d1: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "C1500-1999", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r2: $.data.id }
            - call: "POST /core-returns/${r2}/grade"
              payload: { grade: "REJECT", missing_components: ["ENGINE_BLOCK"] }
              as: CoreInspector
              captures: { r2_final: $.data.final_credit_cents }
          trigger:
            - call: "POST /work-orders"
              payload: { core_return_id: "${r1}" }
              as: PlantAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /work-orders"
              payload: { core_return_id: "${r2}" }
              as: PlantAdmin
              captures: { err2: $.data.error_id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_B", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${r1}" }
              as: PlantAdmin
              captures: { w1: $.data.id, w1_status: $.data.status, w1_spec: $.data.build_spec_id }
          assert:
            - "captured err1 == ERR_CORE_RETURN_NOT_GRADED (R1 still RECEIVED)"
            - "captured r2_final == 0 (REJECT multiplier 0.00)"
            - "captured err2 == ERR_CORE_RETURN_NOT_GRADED (REJECT grade is not rebuildable)"
            - "captured w1_status == QUEUED and captured w1_spec == ${s1} (spec copied from the return)"

      - name: seal_requires_latest_dyno_pass
        grounds:
          - validations[priority=13]
          - state_machines.RemanEngine.DYNO_PASSED_to_SEALED
          - entities.RemanEngine.fields.latest_dyno_result
        distinguishing_aspect: |
          Entity pair RemanEngine x DynoTest (different pair than the sibling
          instance): sealing is gated on the engine's LATEST DynoTest record —
          with no test, and after a FAIL, sealing is refused; only a latest PASS
          unlocks DYNO_PASSED -> SEALED and closes the work order.
        test_recipe:
          setup:
            - "Engine E is BUILT; work order W in DYNO_TEST; no dyno test recorded yet"
          setup_api_calls:
