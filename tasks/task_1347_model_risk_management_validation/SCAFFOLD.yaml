# =============================================================================
# SCAFFOLD.yaml — Model Risk Management & Validation (bank model risk group)
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Model Risk Management & Validation (bank model risk group): model inventory
  & risk tiering, development documentation standards & change control,
  independent validation scope & testing (conceptual soundness/outcomes
  analysis), finding severity & remediation deadlines, ongoing monitoring
  metrics & breach escalation, model retirement & replacement, vendor model
  transparency requirements, board & regulatory reporting

domain_name: model-risk-management
api_prefix: /mrm

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # regulatory gates, SoD, clock-driven sweeps
  secondary_archetype: workflow_orchestration # validation pipeline with retest loops
  complexity_layers:
    - cascading_side_effects      # clock sweep: finding ESCALATED → model SUSPENDED → metrics PAUSED
    - rate_threshold_triggers     # monitoring thresholds (strict >/<), tier score boundaries (>=)
    - derived_field_reconciliation # open_findings_count, monitoring_posture, risk_score, risk_tier
    - scheduled_deferred_actions  # remediation deadlines + escalation via logical clock
    - optimistic_concurrency      # OCC on Model.version for change-request creation
  entity_topology: hierarchical             # Model is the aggregate root; reports are top-level
  state_machine_shape: cyclic               # Model suspend/resume cycle + ValidationEngagement test/reopen cycle
  relationship_patterns:
    - one_to_many                 # Model → docs, change requests, engagements, findings, metrics, assessments
    - self_referential            # Model.replaced_by_model_id → Model.id (retirement replacement)
    - cross_aggregate             # MetricReading/BreachEvent keyed to MonitoringMetric; reports aggregate the whole inventory
  role_model: segregation_of_duties # validator must be independent of model owner; doc approver != doc submitter
  consistency_model: immediate    # all side effects applied atomically within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Model
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Model name" }
      - { name: business_unit, type: string, source: input, description: "Owning business unit" }
      - { name: owner_user_id, type: string, source: system, description: "Set from X-User-ID of the creating ModelOwner; used for ownership and segregation-of-duties checks" }
      - { name: is_vendor_model, type: boolean, source: input, default: false, description: "True when the model is supplied by an external vendor" }
      - { name: declared_complexity, type: enum, source: input, constraints: "LOW | MEDIUM | HIGH", description: "Developer-declared model complexity used by the DEV_DECLARED risk-score variant" }
      - { name: assessed_complexity, type: enum, source: system, constraints: "LOW | MEDIUM | HIGH | null", default: null, description: "Validator-assessed complexity, set when a ValidationEngagement completes; used by the VALIDATOR_ASSESSED risk-score variant" }
      - { name: usage_scope, type: enum, source: input, constraints: "SINGLE_DESK | MULTI_DESK | ENTERPRISE", description: "Breadth of model usage" }
      - { name: exposure_amount, type: integer, source: input, constraints: ">= 0", description: "Dollar exposure the model drives (integer dollars)" }
      - { name: risk_score, type: integer, source: computed, constraints: "0..100", description: "Composite risk score per calculation model_risk_score; DEV_DECLARED variant at registration, VALIDATOR_ASSESSED variant after each validation completion" }
      - { name: risk_tier, type: enum, source: computed, constraints: "TIER_1 | TIER_2 | TIER_3", description: "TIER_1 iff risk_score >= 70; TIER_2 iff 40 <= risk_score < 70; TIER_3 iff risk_score < 40" }
      - { name: status, type: enum, source: system, constraints: "REGISTERED | APPROVED_FOR_USE | SUSPENDED | RETIRED", description: "Lifecycle state per Model state machine" }
      - { name: monitoring_posture, type: enum, source: computed, constraints: "NORMAL | BREACHED", description: "BREACHED iff at least one BreachEvent with status OPEN exists on any MonitoringMetric of this model; else NORMAL" }
      - { name: open_findings_count, type: integer, source: computed, description: "Count of Finding rows with model_id = this model and status IN {OPEN, OVERDUE, ESCALATED}" }
      - { name: last_validated_at, type: datetime, source: system, default: null, description: "completion timestamp of the most recently completed ValidationEngagement; null until first completion" }
      - { name: validation_due_at, type: datetime, source: computed, description: "= (last_validated_at OR created_at if never validated) + REVALIDATION_MONTHS[risk_tier]; recomputed whenever risk_tier changes or a validation completes; a MAJOR change-request approval compresses it to now + MAJOR_CHANGE_REVALIDATION_MONTHS when earlier" }
      - { name: replaced_by_model_id, type: string, source: input, default: null, description: "FK -> Model.id; set at retirement to the replacement model (self-referential)" }

  - name: ModelDocumentation
    parent: Model
    common_fields: true
    fields:
      - { name: model_id, type: string, source: system, description: "FK -> Model.id; owning model (from path)" }
      - { name: version_label, type: string, source: input, description: "Free-form documentation version label, e.g. '1.0'" }
      - { name: has_development_evidence, type: boolean, source: input, description: "Development evidence section present" }
      - { name: has_testing_evidence, type: boolean, source: input, description: "Testing evidence section present" }
      - { name: has_data_lineage, type: boolean, source: input, description: "Data lineage section present" }
      - { name: submitted_by_user_id, type: string, source: system, description: "Set from X-User-ID of creator; used by segregation-of-duties check on decide" }
      - { name: status, type: enum, source: system, constraints: "SUBMITTED | APPROVED | REJECTED | SUPERSEDED", description: "Created in SUBMITTED; decided by ModelRiskOfficer; APPROVED doc is superseded when another doc for the same model is approved" }

  - name: ChangeRequest
    parent: Model
    common_fields: true
    fields:
      - { name: model_id, type: string, source: system, description: "FK -> Model.id; owning model (from path)" }
      - { name: change_type, type: enum, source: input, constraints: "MINOR | MAJOR", description: "Materiality of the change" }
      - { name: description, type: string, source: input, description: "Change description" }
      - { name: submitted_by_user_id, type: string, source: system, description: "Set from X-User-ID of creator" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "Set from X-User-ID of the deciding ModelRiskOfficer" }
      - { name: status, type: enum, source: system, constraints: "SUBMITTED | APPROVED | REJECTED", description: "Change-control decision state" }

  - name: ValidationEngagement
    parent: Model
    common_fields: true
    fields:
      - { name: model_id, type: string, source: system, description: "FK -> Model.id; model under validation (from path)" }
      - { name: validator_user_id, type: string, source: system, description: "Set from X-User-ID of the creating ModelValidator; MUST differ from Model.owner_user_id (segregation of duties)" }
      - { name: scope_conceptual_soundness, type: boolean, source: input, description: "Scope flag: conceptual soundness review" }
      - { name: scope_outcomes_analysis, type: boolean, source: input, description: "Scope flag: outcomes analysis / back-testing" }
      - { name: period_start, type: datetime, source: input, description: "Start of the review window; half-open interval [period_start, period_end)" }
      - { name: period_end, type: datetime, source: input, description: "End of the review window (exclusive); must be strictly after period_start" }
      - { name: status, type: enum, source: system, constraints: "TESTING | COMPLETED", description: "Created in TESTING; complete → COMPLETED; reopen returns COMPLETED → TESTING (retest cycle)" }
      - { name: outcome, type: enum, source: input, constraints: "EFFECTIVE | EFFECTIVE_WITH_FINDINGS | INEFFECTIVE", default: null, description: "Validation outcome recorded at completion" }
      - { name: assessed_complexity, type: enum, source: input, constraints: "LOW | MEDIUM | HIGH", description: "Validator-assessed complexity recorded at completion; drives VALIDATOR_ASSESSED risk-score variant" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of completion" }

  - name: Finding
    parent: Model
    common_fields: true
    fields:
      - { name: model_id, type: string, source: system, description: "FK -> Model.id; subject model (from path at creation; rewritten on retirement transfer)" }
      - { name: source, type: enum, source: system, constraints: "VALIDATION | MONITORING", description: "VALIDATION when raised via POST findings; MONITORING when auto-raised by the consecutive-breach cascade" }
      - { name: severity, type: enum, source: input, constraints: "LOW | MEDIUM | HIGH | CRITICAL", description: "Finding severity; auto-raised MONITORING findings are always HIGH" }
      - { name: title, type: string, source: input, description: "Short finding title; auto-raised findings get 'AUTO: 3 consecutive breaches on <metric_name>'" }
      - { name: raised_by_user_id, type: string, source: system, description: "X-User-ID of raiser, or the literal string 'system' for auto-raised findings" }
      - { name: status, type: enum, source: system, constraints: "OPEN | OVERDUE | ESCALATED | CLOSED", description: "Remediation workflow state per Finding state machine" }
      - { name: remediation_due_at, type: datetime, source: computed, description: "= created_at + finding_deadline_days(severity, model.risk_tier at creation, source) days; the tier is pinned at finding creation and NOT re-read later" }
      - { name: escalated_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of escalation, null until escalated" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of closure, null until closed; cleared back to null on reopen" }

  - name: MonitoringMetric
    parent: Model
    common_fields: true
    fields:
      - { name: model_id, type: string, source: system, description: "FK -> Model.id; monitored model (from path)" }
      - { name: metric_name, type: string, source: input, description: "Metric identifier, e.g. 'psi', 'auc'" }
      - { name: direction, type: enum, source: input, constraints: "ABOVE_IS_BREACH | BELOW_IS_BREACH", description: "Which side of the threshold constitutes a breach" }
      - { name: threshold_value, type: number, source: input, description: "Breach threshold; breach iff value > threshold (ABOVE) or value < threshold (BELOW); equality is NEVER a breach" }
      - { name: status, type: enum, source: system, constraints: "ACTIVE | PAUSED | DECOMMISSIONED", description: "ACTIVE on creation; PAUSED when the model is suspended; re-ACTIVATED on model resume; DECOMMISSIONED when the model is retired" }
      - { name: consecutive_breach_count, type: integer, source: computed, default: 0, description: "Number of consecutive breaching MetricReadings; +1 on breach, reset to 0 on a non-breach reading; reaching exactly 3 auto-raises a HIGH MONITORING Finding" }

  - name: MetricReading
    parent: MonitoringMetric
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: metric_id, type: string, source: system, description: "FK -> MonitoringMetric.id; metric observed (from path)" }
      - { name: value, type: number, source: input, description: "Observed metric value" }
      - { name: observed_at, type: datetime, source: input, description: "Observation timestamp; MUST be >= the observed_at of the metric's most recent reading (chronological order)" }
      - { name: is_breach, type: boolean, source: computed, description: "Computed at recording per direction/threshold (strict comparison; equality is not a breach)" }

  - name: BreachEvent
    parent: MonitoringMetric
    common_fields: true
    fields:
      - { name: metric_id, type: string, source: system, description: "FK -> MonitoringMetric.id; metric that breached" }
      - { name: metric_name, type: string, source: system, description: "Snapshot of MonitoringMetric.metric_name at breach time" }
      - { name: reading_id, type: string, source: system, description: "id of the MetricReading that caused this breach (traceability only; readings are append-only)" }
      - { name: breach_value, type: number, source: system, description: "Value of the breaching reading" }
      - { name: status, type: enum, source: system, constraints: "OPEN | RESOLVED", description: "OPEN on creation; resolved manually by the model owner" }

  - name: VendorTransparencyAssessment
    parent: Model
    common_fields: true
    fields:
      - { name: model_id, type: string, source: system, description: "FK -> Model.id; vendor model assessed (from path); model must have is_vendor_model = true" }
      - { name: completeness_score, type: integer, source: input, constraints: "0..100", description: "Vendor documentation completeness; approval gate requires >= VENDOR_MIN_COMPLETENESS (70)" }
      - { name: valid_months, type: integer, source: input, constraints: ">= 1", description: "Validity period in whole months from assessed_at" }
      - { name: assessed_at, type: datetime, source: system, description: "Logical-clock timestamp at creation" }
      - { name: valid_until, type: datetime, source: computed, description: "= assessed_at + valid_months months" }
      - { name: status, type: enum, source: system, constraints: "CURRENT | EXPIRED", description: "CURRENT on creation; clock sweep flips to EXPIRED when now > valid_until (equality remains CURRENT)" }

  - name: RegulatoryReport
    parent: null
    common_fields: true
    fields:
      - { name: report_type, type: enum, source: input, constraints: "BOARD_QUARTERLY | REGULATOR_ANNUAL", description: "Report family; overlap rule applies per report_type" }
      - { name: period_start, type: datetime, source: input, description: "Reporting period start; CLOSED interval [period_start, period_end] (both bounds inclusive for overlap)" }
      - { name: period_end, type: datetime, source: input, description: "Reporting period end (inclusive); must be strictly after period_start" }
      - { name: aggregation_method, type: enum, source: input, constraints: "EQUAL_WEIGHTED | EXPOSURE_WEIGHTED", description: "Selects the inventory_risk_index variant" }
      - { name: status, type: enum, source: system, constraints: "DRAFT | SUBMITTED", description: "Created DRAFT; submit moves to SUBMITTED (terminal)" }
      - { name: total_models, type: integer, source: computed, description: "Count of models in the report input set (created_at <= period_end AND status IN {REGISTERED, APPROVED_FOR_USE, SUSPENDED})" }
      - { name: tier_1_count, type: integer, source: computed, description: "Models in the input set with risk_tier = TIER_1" }
      - { name: open_findings_total, type: integer, source: computed, description: "Findings on input-set models with status IN {OPEN, OVERDUE, ESCALATED}" }
      - { name: open_critical_count, type: integer, source: computed, description: "Findings on input-set models with status IN {OPEN, OVERDUE, ESCALATED} AND severity = CRITICAL" }
      - { name: breach_event_count, type: integer, source: computed, description: "BreachEvents with status OPEN on metrics of input-set models" }
      - { name: overdue_validation_count, type: integer, source: computed, description: "Input-set models whose validation_due_at < report creation time" }
      - { name: inventory_risk_index, type: number, source: computed, description: "Aggregate risk index per calculation inventory_risk_index, variant selected by aggregation_method; 2 decimal places, round_half_up, single final rounding" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of submission" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Model
    initial_state: REGISTERED
    terminal_states: [RETIRED]
    transitions:
      - from: REGISTERED
        to: APPROVED_FOR_USE
        trigger: POST /mrm/models/{id}/approve
        actor: ModelRiskOfficer
        preconditions:
          - "Model status == REGISTERED (ERR_MODEL_NOT_APPROVABLE)"
          - "At least one ModelDocumentation for the model in APPROVED status (ERR_NO_APPROVED_DOCUMENTATION)"
          - "At least one ValidationEngagement for the model in COMPLETED status with outcome != INEFFECTIVE (ERR_NO_COMPLETED_VALIDATION)"
          - "No Finding on the model with status IN {OPEN, OVERDUE, ESCALATED} AND severity == CRITICAL (ERR_OPEN_CRITICAL_FINDINGS) [business_safety]"
          - "If is_vendor_model: a VendorTransparencyAssessment with status == CURRENT AND completeness_score >= 70 exists (ERR_VENDOR_ASSESSMENT_NOT_CURRENT) [business_safety, checked before temporal]"
          - "Logical-clock now <= validation_due_at (ERR_VALIDATION_OVERDUE) [business_temporal]"
        side_effects:
          - "status → APPROVED_FOR_USE"

      - from: APPROVED_FOR_USE
        to: SUSPENDED
        trigger: "system (clock sweep: a Finding on this model transitions to ESCALATED while severity IN {HIGH, CRITICAL} AND model.risk_tier == TIER_1)"
        actor: system
        preconditions:
          - "Model status == APPROVED_FOR_USE"
          - "The escalating finding has severity HIGH or CRITICAL and model.risk_tier == TIER_1"
        side_effects:
          - "status → SUSPENDED"
          - "Every MonitoringMetric of this model in ACTIVE status → PAUSED (each PAUSED metric is itself unavailable for new readings)"

      - from: SUSPENDED
        to: APPROVED_FOR_USE
        trigger: "system (evaluated immediately after any Finding on this model transitions to CLOSED)"
        actor: system
        preconditions:
          - "Model status == SUSPENDED"
          - "No Finding on the model with status IN {OPEN, OVERDUE, ESCALATED} AND severity IN {HIGH, CRITICAL}"
        side_effects:
          - "status → APPROVED_FOR_USE"
          - "Every MonitoringMetric of this model in PAUSED status → ACTIVE"

      - from: APPROVED_FOR_USE
        to: RETIRED
        trigger: POST /mrm/models/{id}/retire
        actor: ModelRiskOfficer
        preconditions:
          - "Model status IN {APPROVED_FOR_USE, SUSPENDED} (ERR_MODEL_NOT_RETIRABLE)"
          - "replacement_model_id present, != model.id (ERR_SELF_REPLACEMENT), referencing an existing Model (ERR_NOT_FOUND)"
          - "Replacement model status == APPROVED_FOR_USE (ERR_REPLACEMENT_MODEL_NOT_APPROVED)"
        side_effects:
          - "status → RETIRED; replaced_by_model_id = replacement_model_id"
          - "Every MonitoringMetric of this model IN {ACTIVE, PAUSED} → DECOMMISSIONED"
          - "Every Finding of this model IN {OPEN, OVERDUE, ESCALATED} is transferred: model_id := replacement_model_id AND remediation_due_at recomputed as created_at + finding_deadline_days(severity, replacement.risk_tier, source) days; replacement.open_findings_count recomputed"
          - "open_findings_count of this model → 0; replacement model risk_score/risk_tier recomputed (findings penalty changes)"

      - from: SUSPENDED
        to: RETIRED
        trigger: POST /mrm/models/{id}/retire
        actor: ModelRiskOfficer
        preconditions:
          - "Model status IN {APPROVED_FOR_USE, SUSPENDED} (ERR_MODEL_NOT_RETIRABLE)"
          - "replacement_model_id present, != model.id (ERR_SELF_REPLACEMENT), referencing an existing Model (ERR_NOT_FOUND)"
          - "Replacement model status == APPROVED_FOR_USE (ERR_REPLACEMENT_MODEL_NOT_APPROVED)"
        side_effects:
          - "status → RETIRED; replaced_by_model_id = replacement_model_id"
          - "Every MonitoringMetric of this model IN {ACTIVE, PAUSED} → DECOMMISSIONED"
          - "Every Finding of this model IN {OPEN, OVERDUE, ESCALATED} is transferred: model_id := replacement_model_id AND remediation_due_at recomputed as created_at + finding_deadline_days(severity, replacement.risk_tier, source) days; replacement.open_findings_count recomputed"
          - "open_findings_count of this model → 0; replacement model risk_score/risk_tier recomputed (findings penalty changes)"

  - entity: ModelDocumentation
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /mrm/models/{id}/documentations/{docId}/decide {decision: APPROVE}"
        actor: ModelRiskOfficer
        preconditions:
          - "Documentation status == SUBMITTED (ERR_DOCUMENTATION_NOT_SUBMITTED)"
          - "decider X-User-ID != submitted_by_user_id (ERR_SOD_DOCUMENTATION_APPROVAL) [business_safety]"
        side_effects:
          - "Every OTHER ModelDocumentation of the same model in APPROVED status → SUPERSEDED"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /mrm/models/{id}/documentations/{docId}/decide {decision: REJECT}"
        actor: ModelRiskOfficer
        preconditions:
          - "Documentation status == SUBMITTED (ERR_DOCUMENTATION_NOT_SUBMITTED)"
          - "decider X-User-ID != submitted_by_user_id (ERR_SOD_DOCUMENTATION_APPROVAL) [business_safety]"
        side_effects: []

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (another ModelDocumentation of the same model is approved)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ChangeRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /mrm/models/{id}/change-requests/{crId}/decide {decision: APPROVE}"
        actor: ModelRiskOfficer
        preconditions:
          - "ChangeRequest status == SUBMITTED (ERR_CHANGE_REQUEST_ALREADY_DECIDED)"
        side_effects:
          - "If change_type == MAJOR: model.validation_due_at := min(current validation_due_at, now + MAJOR_CHANGE_REVALIDATION_MONTHS months)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /mrm/models/{id}/change-requests/{crId}/decide {decision: REJECT}"
        actor: ModelRiskOfficer
        preconditions:
          - "ChangeRequest status == SUBMITTED (ERR_CHANGE_REQUEST_ALREADY_DECIDED)"
        side_effects: []

  - entity: ValidationEngagement
    initial_state: TESTING
    terminal_states: []   # COMPLETED is stable but not terminal: reopen loops back to TESTING
    transitions:
      - from: TESTING
        to: COMPLETED
        trigger: POST /mrm/validation-engagements/{id}/complete
        actor: ModelValidator
        preconditions:
          - "Engagement status == TESTING (ERR_ENGAGEMENT_NOT_IN_TESTING)"
        side_effects:
          - "completed_at := logical-clock now; outcome and assessed_complexity recorded from payload"
          - "model.assessed_complexity := assessed_complexity; model.last_validated_at := completed_at"
          - "model.risk_score recomputed with the VALIDATOR_ASSESSED variant; model.risk_tier recomputed; model.validation_due_at := completed_at + REVALIDATION_MONTHS[new risk_tier]"

      - from: COMPLETED
        to: TESTING
        trigger: POST /mrm/validation-engagements/{id}/reopen
        actor: ModelValidator
        preconditions:
          - "Engagement status == COMPLETED (ERR_ENGAGEMENT_NOT_COMPLETED)"
        side_effects:
          - "completed_at := null; outcome := null"
          - "model fields are NOT reverted (last_validated_at, assessed_complexity, risk_score remain from the last completion)"

  - entity: Finding
    initial_state: OPEN
    terminal_states: []   # CLOSED can be reopened
    transitions:
      - from: OPEN
        to: OVERDUE
        trigger: "system (clock sweep on POST /_clock/set_current_utc: now > remediation_due_at)"
        actor: system
        preconditions:
          - "Finding status == OPEN AND now > remediation_due_at (at exactly due_at the finding is NOT overdue)"
        side_effects: []

      - from: OVERDUE
        to: ESCALATED
        trigger: "system (clock sweep on POST /_clock/set_current_utc: now > remediation_due_at + ESCALATION_GRACE_DAYS)"
        actor: system
        preconditions:
          - "Finding status == OVERDUE AND now > remediation_due_at + ESCALATION_GRACE_DAYS (7 days; at exactly due_at + 7d the finding is NOT yet escalated)"
        side_effects:
          - "escalated_at := now"
          - "If severity IN {HIGH, CRITICAL} AND model.risk_tier == TIER_1 AND model.status == APPROVED_FOR_USE: model → SUSPENDED per Model state machine (which in turn PAUSEs the model's ACTIVE MonitoringMetrics)"

      - from: OPEN
        to: CLOSED
        trigger: POST /mrm/models/{id}/findings/{fid}/close
        actor: ModelRiskOfficer
        preconditions:
          - "Finding status IN {OPEN, OVERDUE, ESCALATED} (ERR_FINDING_NOT_CLOSABLE)"
          - "If severity IN {HIGH, CRITICAL}: a ValidationEngagement on the SAME model with status == COMPLETED AND completed_at > finding.created_at exists (ERR_RETEST_REQUIRED) [business_referential]"
        side_effects:
          - "closed_at := now; model.open_findings_count decremented by 1"
          - "model.risk_score and risk_tier recomputed (findings penalty reduced); validation_due_at recomputed if tier changed"
          - "Auto-resume check: if model.status == SUSPENDED and no remaining OPEN/OVERDUE/ESCALATED HIGH|CRITICAL findings → model → APPROVED_FOR_USE and its PAUSED MonitoringMetrics → ACTIVE"

      - from: OVERDUE
        to: CLOSED
        trigger: POST /mrm/models/{id}/findings/{fid}/close
        actor: ModelRiskOfficer
        preconditions:
          - "Finding status IN {OPEN, OVERDUE, ESCALATED} (ERR_FINDING_NOT_CLOSABLE)"
          - "If severity IN {HIGH, CRITICAL}: a ValidationEngagement on the SAME model with status == COMPLETED AND completed_at > finding.created_at exists (ERR_RETEST_REQUIRED) [business_referential]"
        side_effects:
          - "closed_at := now; model.open_findings_count decremented by 1"
          - "model.risk_score and risk_tier recomputed (findings penalty reduced); validation_due_at recomputed if tier changed"
          - "Auto-resume check: if model.status == SUSPENDED and no remaining OPEN/OVERDUE/ESCALATED HIGH|CRITICAL findings → model → APPROVED_FOR_USE and its PAUSED MonitoringMetrics → ACTIVE"

      - from: ESCALATED
        to: CLOSED
        trigger: POST /mrm/models/{id}/findings/{fid}/close
        actor: ModelRiskOfficer
        preconditions:
          - "Finding status IN {OPEN, OVERDUE, ESCALATED} (ERR_FINDING_NOT_CLOSABLE)"
          - "If severity IN {HIGH, CRITICAL}: a ValidationEngagement on the SAME model with status == COMPLETED AND completed_at > finding.created_at exists (ERR_RETEST_REQUIRED) [business_referential]"
        side_effects:
          - "closed_at := now; model.open_findings_count decremented by 1"
          - "model.risk_score and risk_tier recomputed (findings penalty reduced); validation_due_at recomputed if tier changed"
          - "Auto-resume check: if model.status == SUSPENDED and no remaining OPEN/OVERDUE/ESCALATED HIGH|CRITICAL findings → model → APPROVED_FOR_USE and its PAUSED MonitoringMetrics → ACTIVE"

      - from: CLOSED
        to: OPEN
        trigger: POST /mrm/models/{id}/findings/{fid}/reopen
        actor: ModelRiskOfficer
        preconditions:
          - "Finding status == CLOSED (ERR_FINDING_NOT_OPEN)"
        side_effects:
          - "closed_at := null; remediation_due_at UNCHANGED (original deadline is preserved)"
          - "model.open_findings_count incremented by 1"
          - "model.risk_score and risk_tier recomputed (findings penalty restored); validation_due_at recomputed if tier changed"
          - "If the preserved remediation_due_at is already in the past, the NEXT clock sweep moves the finding OPEN → OVERDUE again"

  - entity: MonitoringMetric
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "system (owning model transitions APPROVED_FOR_USE → SUSPENDED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PAUSED
        to: ACTIVE
        trigger: "system (owning model transitions SUSPENDED → APPROVED_FOR_USE)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "system (owning model is retired)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PAUSED
        to: DECOMMISSIONED
        trigger: "system (owning model is retired)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BreachEvent
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: POST /mrm/breach-events/{id}/resolve
        actor: ModelOwner
        preconditions:
          - "BreachEvent status == OPEN (ERR_BREACH_EVENT_ALREADY_RESOLVED)"
          - "Acting ModelOwner owns the model that owns the metric (ERR_NOT_MODEL_OWNER)"
        side_effects:
          - "Model.monitoring_posture recomputed: NORMAL iff no OPEN BreachEvent remains on any metric of the model"

  - entity: VendorTransparencyAssessment
    initial_state: CURRENT
    terminal_states: [EXPIRED]
    transitions:
      - from: CURRENT
        to: EXPIRED
        trigger: "system (clock sweep on POST /_clock/set_current_utc: now > valid_until)"
        actor: system
        preconditions:
          - "Assessment status == CURRENT AND now > valid_until (at exactly valid_until the assessment is still CURRENT)"
        side_effects: []

  - entity: RegulatoryReport
    initial_state: DRAFT
    terminal_states: [SUBMITTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /mrm/regulatory-reports/{id}/submit
        actor: RegulatoryReporter
        preconditions:
          - "Report status == DRAFT (ERR_REPORT_ALREADY_SUBMITTED)"
          - "No other RegulatoryReport with the SAME report_type, status == SUBMITTED, and CLOSED-interval overlap: existing.period_start <= new.period_end AND new.period_start <= existing.period_end (ERR_REPORT_PERIOD_OVERLAP) [business_constraint]"
        side_effects:
          - "submitted_at := now"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: change-request-stale-model
    parent_entity: Model
    write_endpoint: "POST /mrm/models/{id}/change-requests"
    occ_field: "expected_model_version"
    description: |
      Creating a ChangeRequest against a Model whose version has advanced
      since the client last observed it is rejected with ERR_STALE_VERSION.
      Change requests are allowed to coexist (a second sequential create with
      a fresh version would legitimately succeed), so the stale-version check
      is the only guard against a writer acting on an outdated view of the
      model (e.g., missing that another writer just submitted a change
      request, which itself incremented Model.version).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: model_risk_score
    trigger: "model registration (DEV_DECLARED variant); validation completion (VALIDATOR_ASSESSED variant); any change in the model's open-findings set (finding created/closed/reopened/transferred) recomputes the ACTIVE variant (VALIDATOR_ASSESSED once assessed_complexity is set, else DEV_DECLARED)"
    algorithm: weighted_scoring
    formula: |
      complexity_points: LOW = 1, MEDIUM = 2, HIGH = 3
      scope_points: SINGLE_DESK = 0, MULTI_DESK = 1, ENTERPRISE = 2
      exposure_points: exposure_amount < 1,000,000 → 1;
                       1,000,000 <= exposure_amount < 10,000,000 → 2;
                       10,000,000 <= exposure_amount < 100,000,000 → 3;
                       exposure_amount >= 100,000,000 → 4
      findings_penalty = 10 * count(findings OPEN|OVERDUE|ESCALATED with severity CRITICAL)
                       +  5 * count(... HIGH)
                       +  2 * count(... MEDIUM)
                       +  1 * count(... LOW)
      DEV_DECLARED:        risk_score = min(100, 20 * complexity_points(declared_complexity)
                                          + 10 * scope_points + 10 * exposure_points
                                          + findings_penalty)
      VALIDATOR_ASSESSED:  risk_score = min(100, 25 * complexity_points(assessed_complexity)
                                          + 10 * scope_points + 10 * exposure_points
                                          + findings_penalty)
      risk_tier: TIER_1 iff risk_score >= 70; TIER_2 iff 40 <= risk_score < 70;
                 TIER_3 iff risk_score < 40.
    input_set: "The model's own attributes plus its findings with status IN {OPEN, OVERDUE, ESCALATED} (CLOSED findings excluded)"
    constants:
      TIER_1_MIN: 70
      TIER_2_MIN: 40
      SCORE_CAP: 100
    precision: "integer arithmetic; no rounding"
    variants:
      - name: DEV_DECLARED
        when: "From registration until the first validation completion sets assessed_complexity"
        difference: "Uses declared_complexity with weight 20"
      - name: VALIDATOR_ASSESSED
        when: "After any validation completion (assessed_complexity set)"
        difference: "Uses assessed_complexity with weight 25 — same model inputs can yield a different score and tier (e.g. declared HIGH vs assessed LOW: 80/TIER_1 vs 45/TIER_2)"

  - name: finding_deadline_days
    trigger: "finding creation (manual POST or auto-raise from the breach cascade); finding transfer on model retirement (recomputed against the replacement model's tier)"
    algorithm: threshold
    formula: |
      base = BASE_DAYS[severity]                       # LOW 90, MEDIUM 60, HIGH 30, CRITICAL 14
      scaled = round(base * TIER_MULTIPLIER[tier])     # TIER_1 1.0, TIER_2 1.5, TIER_3 2.0; round_half_up to integer
      if source == MONITORING: scaled = scaled - MONITORING_URGENCY_DEDUCTION   # 5
      due_days = min(MAX_DAYS, max(MIN_DAYS, scaled))  # clamp into [7, 365]
      remediation_due_at = finding.created_at + due_days days
      The tier input is the model's risk_tier AT THE MOMENT of finding creation
      (or transfer), evaluated BEFORE the new finding itself is counted in the
      model's findings_penalty — the finding under creation never moves the tier
      used for its own deadline (pinned evaluation order).
      Later tier changes do NOT move existing deadlines.
    input_set: "Single finding; tier read from the owning model at creation/transfer time"
    constants:
      BASE_DAYS: { LOW: 90, MEDIUM: 60, HIGH: 30, CRITICAL: 14 }
      TIER_MULTIPLIER: { TIER_1: 1.0, TIER_2: 1.5, TIER_3: 2.0 }
      MONITORING_URGENCY_DEDUCTION: 5
      MIN_DAYS: 7
      MAX_DAYS: 365
      ESCALATION_GRACE_DAYS: 7
    precision: "integer days, round_half_up on the tier multiplication only"

  - name: inventory_risk_index
    trigger: "RegulatoryReport creation (snapshot computed once at creation; not recomputed afterwards)"
    algorithm: aggregation
    formula: |
      input_set S = models with created_at <= period_end
                    AND status IN {REGISTERED, APPROVED_FOR_USE, SUSPENDED}
                    (RETIRED models are excluded)
      EQUAL_WEIGHTED:    index = round_half_up( sum(risk_score over S) / |S|, 2 )
      EXPOSURE_WEIGHTED: index = round_half_up( sum(risk_score_i * exposure_amount_i over S)
                                                / sum(exposure_amount_i over S), 2 )
      Rounding order (pinned): NO intermediate rounding — each product
      risk_score_i * exposure_amount_i is kept at full precision, the division
      is performed once, and a single round_half_up to 2 decimal places is
      applied at the end. (Rounding each contribution first and then summing
      is a different, forbidden order; e.g. scores 10/20/30 with exposures
      1/2/3 give 23.33 under the pinned order vs 23.34 under contribution
      rounding.)
      If S is empty or (EXPOSURE_WEIGHTED and sum(exposure_amount) == 0):
      inventory_risk_index = 0.00.
    input_set: "Models with created_at <= period_end AND status IN {REGISTERED, APPROVED_FOR_USE, SUSPENDED}"
    constants: {}
    precision: "2 decimal places, round_half_up, single final rounding"
    variants:
      - name: EQUAL_WEIGHTED
        when: "RegulatoryReport.aggregation_method == EQUAL_WEIGHTED"
        difference: "Plain mean of risk_score over S"
      - name: EXPOSURE_WEIGHTED
        when: "RegulatoryReport.aggregation_method == EXPOSURE_WEIGHTED"
        difference: "Exposure-weighted mean; same input set, different result (e.g. scores 80/40 with exposures 1M/9M: 60.00 vs 44.00)"

  - name: validation_due_at_schedule
    trigger: "model registration (baseline from created_at); validation completion (from completed_at); risk_tier change (recomputed from last_validated_at or created_at); MAJOR change-request approval (compression)"
    algorithm: forward_looking
    formula: |
      anchor = last_validated_at if set else created_at
      validation_due_at = anchor + REVALIDATION_MONTHS[risk_tier] months
      On MAJOR change-request approval:
        validation_due_at = min(validation_due_at, now + MAJOR_CHANGE_REVALIDATION_MONTHS months)
      A model's validation is OVERDUE when logical-clock now > validation_due_at
      (at exactly validation_due_at it is NOT overdue).
    input_set: "Single model"
    constants:
      REVALIDATION_MONTHS: { TIER_1: 6, TIER_2: 12, TIER_3: 24 }
      MAJOR_CHANGE_REVALIDATION_MONTHS: 3
    precision: "month arithmetic on the logical clock"

  - name: consecutive_breach_escalation
    trigger: "every MetricReading recorded on an ACTIVE metric"
    algorithm: threshold
    formula: |
      is_breach = (direction == ABOVE_IS_BREACH AND value > threshold_value)
                  OR (direction == BELOW_IS_BREACH AND value < threshold_value)
      # strict comparison: value == threshold_value is NEVER a breach
      if is_breach:  consecutive_breach_count += 1; create BreachEvent(OPEN)
      else:          consecutive_breach_count = 0
      if consecutive_breach_count reaches exactly 3 (the 3rd consecutive breach):
        auto-create Finding(severity HIGH, source MONITORING, model = metric's model,
                            title "AUTO: 3 consecutive breaches on <metric_name>")
        → model.open_findings_count += 1 and model.risk_score/risk_tier recomputed
      A 4th or further consecutive breach creates another BreachEvent but does NOT
      auto-create another Finding (fires only on the transition to exactly 3).
    input_set: "Readings of a single metric in observed_at order"
    constants:
      CONSECUTIVE_BREACH_LIMIT: 3
    precision: "exact numeric comparison, no rounding"

  - name: open_findings_count
    trigger: "finding created (+1), closed (-1), reopened (+1), transferred on retirement (recompute on both models)"
    algorithm: aggregation
    formula: |
      model.open_findings_count = count of Finding with model_id == model.id
                                  AND status IN {OPEN, OVERDUE, ESCALATED}
    input_set: "Findings of one model; CLOSED excluded"
    constants: {}
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and X-User-Role must name a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 1.5
    category: existence
    check: "Request body must satisfy the endpoint's input schema: required fields present, enum values in range, types correct"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 2
    category: auth
    check: "X-User-Role must be in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path identifiers must resolve, validated left-to-right: model id, then nested child id; body-referenced ids (replacement_model_id, metric_id) checked at their own existence step"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_constraint
    check: "OCC: expected_model_version must equal Model.version (checked BEFORE state and other business rules, AFTER existence)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /mrm/models/{id}/change-requests"

  - priority: 5
    category: business_referential
    check: "Ownership: ModelOwner endpoints require X-User-ID == model.owner_user_id"
    error_id: ERR_NOT_MODEL_OWNER
    http_status: 403
    applies_to: "POST /mrm/models/{id}/documentations, POST /mrm/models/{id}/change-requests, POST /mrm/models/{id}/monitoring-metrics, POST /mrm/monitoring-metrics/{id}/readings (owner of the metric's model), POST /mrm/breach-events/{id}/resolve"

  - priority: 6
    category: state
    check: "Target resource must be in a valid state for the operation (model not RETIRED for child creation and engagement creation; model REGISTERED for approve; model APPROVED_FOR_USE for metric creation; model APPROVED_FOR_USE|SUSPENDED for retire; engagement TESTING for complete / COMPLETED for reopen; finding closable / CLOSED for reopen; documentation SUBMITTED for decide; change request SUBMITTED for decide; report DRAFT for submit; breach event OPEN for resolve; metric ACTIVE for readings)"
    error_id: "ERR_MODEL_ALREADY_RETIRED / ERR_MODEL_NOT_APPROVABLE / ERR_MODEL_NOT_APPROVED_FOR_USE / ERR_MODEL_NOT_RETIRABLE / ERR_ENGAGEMENT_NOT_IN_TESTING / ERR_ENGAGEMENT_NOT_COMPLETED / ERR_FINDING_NOT_CLOSABLE / ERR_FINDING_NOT_OPEN / ERR_DOCUMENTATION_NOT_SUBMITTED / ERR_CHANGE_REQUEST_ALREADY_DECIDED / ERR_REPORT_ALREADY_SUBMITTED / ERR_BREACH_EVENT_ALREADY_RESOLVED / ERR_METRIC_NOT_ACTIVE"
    http_status: 409
    applies_to: "stateful action endpoints"

  - priority: 7
    category: business_safety
    check: "Compliance gates: validator independence (validator X-User-ID != model.owner_user_id → ERR_SOD_VALIDATION_INDEPENDENCE); documentation approver != submitter (ERR_SOD_DOCUMENTATION_APPROVAL); no OPEN/OVERDUE/ESCALATED CRITICAL findings at approval (ERR_OPEN_CRITICAL_FINDINGS); vendor model approval requires a CURRENT assessment with completeness_score >= 70 (ERR_VENDOR_ASSESSMENT_NOT_CURRENT)"
    error_id: "ERR_SOD_VALIDATION_INDEPENDENCE / ERR_SOD_DOCUMENTATION_APPROVAL / ERR_OPEN_CRITICAL_FINDINGS / ERR_VENDOR_ASSESSMENT_NOT_CURRENT"
    http_status: 403
    applies_to: "POST /mrm/models/{id}/validation-engagements, POST /mrm/models/{id}/documentations/{docId}/decide, POST /mrm/models/{id}/approve"

  - priority: 8
    category: business_temporal
    check: "Temporal gates: model validation must not be overdue at approval (now <= validation_due_at, ERR_VALIDATION_OVERDUE); readings must be chronological per metric (observed_at >= latest reading's observed_at, ERR_READING_OUT_OF_ORDER)"
    error_id: "ERR_VALIDATION_OVERDUE / ERR_READING_OUT_OF_ORDER"
    http_status: 409
    applies_to: "POST /mrm/models/{id}/approve, POST /mrm/monitoring-metrics/{id}/readings"

  - priority: 9
    category: business_referential
    check: "Cross-entity references: approval requires >= 1 APPROVED documentation (ERR_NO_APPROVED_DOCUMENTATION) and >= 1 COMPLETED engagement with outcome != INEFFECTIVE (ERR_NO_COMPLETED_VALIDATION); closing a HIGH|CRITICAL finding requires a COMPLETED engagement on the same model with completed_at > finding.created_at (ERR_RETEST_REQUIRED); retirement replacement must exist and be APPROVED_FOR_USE (ERR_REPLACEMENT_MODEL_NOT_APPROVED)"
    error_id: "ERR_NO_APPROVED_DOCUMENTATION / ERR_NO_COMPLETED_VALIDATION / ERR_RETEST_REQUIRED / ERR_REPLACEMENT_MODEL_NOT_APPROVED"
    http_status: 409
    applies_to: "POST /mrm/models/{id}/approve, POST /mrm/models/{id}/validation-engagements (documentation gate), POST /mrm/models/{id}/findings/{fid}/close, POST /mrm/models/{id}/retire"

  - priority: 10
    category: business_constraint
    check: "Constraint gates: engagement review windows per model must not overlap under half-open semantics [start, end) — adjacency allowed (ERR_VALIDATION_WINDOW_OVERLAP); report periods per report_type must not overlap under CLOSED semantics [start, end] — adjacency IS a conflict (ERR_REPORT_PERIOD_OVERLAP); retirement replacement != self (ERR_SELF_REPLACEMENT); vendor assessments only for is_vendor_model models (ERR_NOT_A_VENDOR_MODEL); engagement scope must select at least one of conceptual soundness / outcomes analysis and period_end > period_start (ERR_INVALID_REQUEST); documentation must carry all three evidence flags at creation (ERR_DOCUMENTATION_INCOMPLETE)"
    error_id: "ERR_VALIDATION_WINDOW_OVERLAP / ERR_REPORT_PERIOD_OVERLAP / ERR_SELF_REPLACEMENT / ERR_NOT_A_VENDOR_MODEL / ERR_INVALID_REQUEST / ERR_DOCUMENTATION_INCOMPLETE"
    http_status: 409
    applies_to: "POST /mrm/models/{id}/validation-engagements, POST /mrm/regulatory-reports/{id}/submit, POST /mrm/models/{id}/retire, POST /mrm/models/{id}/vendor-assessments, POST /mrm/models/{id}/documentations"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Models ---
  - method: POST
    path: "/mrm/models"
    description: "Register a model in the inventory; computes DEV_DECLARED risk_score and risk_tier; status REGISTERED; validation_due_at = created_at + REVALIDATION_MONTHS[tier]"
    roles: [ModelOwner]
    code: 201
    input: [name, business_unit, declared_complexity, usage_scope, exposure_amount, "is_vendor_model?"]
    output: Model
    side_effects: ["owner_user_id := X-User-ID", "risk_score/risk_tier via model_risk_score (DEV_DECLARED)", "validation_due_at initialized"]

  - method: GET
    path: "/mrm/models"
    description: "List models with optional filters; paginated per response_envelope"
    roles: [ModelOwner, ModelValidator, ModelRiskOfficer, RegulatoryReporter]
    code: 200
    input: ["status?", "risk_tier?", "owner_user_id?", "replaced_by_model_id?", "limit?", "offset?"]
    output: "Model[]"
    side_effects: []

  - method: GET
    path: "/mrm/models/{id}"
    description: "Get a single model including computed fields"
    roles: [ModelOwner, ModelValidator, ModelRiskOfficer, RegulatoryReporter]
    code: 200
    input: []
    output: Model
    side_effects: []

  - method: POST
    path: "/mrm/models/{id}/approve"
    description: "Approve a REGISTERED model for production use; enforces documentation, validation, findings, vendor-transparency and validation-currency gates in validation-priority order"
    roles: [ModelRiskOfficer]
    code: 200
    input: []
    output: Model
    side_effects: ["status REGISTERED → APPROVED_FOR_USE"]

  - method: POST
    path: "/mrm/models/{id}/retire"
    description: "Retire an APPROVED_FOR_USE or SUSPENDED model with an approved replacement; open findings transfer to the replacement with deadlines recomputed per replacement tier; metrics decommissioned"
    roles: [ModelRiskOfficer]
    code: 200
    input: [replacement_model_id]
    output: Model
    side_effects: ["status → RETIRED", "replaced_by_model_id set", "MonitoringMetrics → DECOMMISSIONED", "open Findings transferred with remediation_due_at recomputed"]

  # --- Documentation (development standards & change control) ---
  - method: POST
    path: "/mrm/models/{id}/documentations"
    description: "Submit a documentation package for a non-RETIRED model; all three evidence flags required; created in SUBMITTED"
    roles: [ModelOwner]
    code: 201
    input: [version_label, has_development_evidence, has_testing_evidence, has_data_lineage]
    output: ModelDocumentation
    side_effects: ["submitted_by_user_id := X-User-ID"]

  - method: GET
    path: "/mrm/models/{id}/documentations"
    description: "List documentation packages of a model (FK reverse reachability)"
    roles: [ModelOwner, ModelValidator, ModelRiskOfficer, RegulatoryReporter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ModelDocumentation[]"
    side_effects: []

  - method: POST
    path: "/mrm/models/{id}/documentations/{docId}/decide"
    description: "Approve or reject a SUBMITTED documentation package; approver must differ from submitter (SoD); approval supersedes any previously APPROVED package of the same model"
    roles: [ModelRiskOfficer]
    code: 200
    input: [decision]
    output: ModelDocumentation
    side_effects: ["decision APPROVE → status APPROVED and prior APPROVED docs of the model → SUPERSEDED", "decision REJECT → status REJECTED", "decided_by_user_id := X-User-ID"]

  # --- Change requests (change control, OCC-guarded) ---
  - method: POST
    path: "/mrm/models/{id}/change-requests"
    description: "Submit a change request for a non-RETIRED model; OCC-guarded by expected_model_version (mismatch → ERR_STALE_VERSION 412)"
    roles: [ModelOwner]
    code: 201
    input: [change_type, description, expected_model_version]
    output: ChangeRequest
    side_effects: ["status SUBMITTED", "submitted_by_user_id := X-User-ID", "increments Model.version by 1"]

  - method: GET
    path: "/mrm/models/{id}/change-requests"
    description: "List change requests of a model (FK reverse reachability)"
    roles: [ModelOwner, ModelValidator, ModelRiskOfficer, RegulatoryReporter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ChangeRequest[]"
    side_effects: []

  - method: POST
    path: "/mrm/models/{id}/change-requests/{crId}/decide"
    description: "Approve or reject a SUBMITTED change request; approving a MAJOR change compresses model.validation_due_at to min(current, now + 3 months)"
    roles: [ModelRiskOfficer]
    code: 200
    input: [decision]
    output: ChangeRequest
    side_effects: ["decision APPROVE → APPROVED (+ validation_due_at compression when MAJOR)", "decision REJECT → REJECTED", "decided_by_user_id := X-User-ID", "increments Model.version by 1"]

  # --- Validation engagements ---
  - method: POST
    path: "/mrm/models/{id}/validation-engagements"
    description: "Open an independent validation engagement (created directly in TESTING); requires validator independence (SoD), at least one APPROVED documentation, no overlapping review window (half-open)"
    roles: [ModelValidator]
    code: 201
    input: [scope_conceptual_soundness, scope_outcomes_analysis, period_start, period_end]
    output: ValidationEngagement
    side_effects: ["validator_user_id := X-User-ID", "status TESTING"]

  - method: GET
    path: "/mrm/models/{id}/validation-engagements"
    description: "List validation engagements of a model (FK reverse reachability)"
    roles: [ModelOwner, ModelValidator, ModelRiskOfficer, RegulatoryReporter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ValidationEngagement[]"
    side_effects: []

  - method: POST
    path: "/mrm/validation-engagements/{id}/complete"
    description: "Complete a TESTING engagement with outcome and assessed complexity; recomputes model risk via the VALIDATOR_ASSESSED variant and refreshes validation_due_at"
    roles: [ModelValidator]
    code: 200
    input: [outcome, assessed_complexity]
    output: ValidationEngagement
    side_effects: ["status → COMPLETED", "completed_at := now", "model.assessed_complexity / last_validated_at set", "model risk_score (VALIDATOR_ASSESSED), risk_tier, validation_due_at recomputed"]

  - method: POST
    path: "/mrm/validation-engagements/{id}/reopen"
    description: "Reopen a COMPLETED engagement for retesting (cyclic TESTING → COMPLETED → TESTING); model fields from the last completion are NOT reverted"
    roles: [ModelValidator]
    code: 200
    input: []
    output: ValidationEngagement
    side_effects: ["status → TESTING", "completed_at := null", "outcome := null"]

  # --- Findings ---
  - method: POST
    path: "/mrm/models/{id}/findings"
    description: "Raise a finding on a non-RETIRED model; remediation_due_at computed from severity × model tier pinned at creation; bumps open_findings_count and recomputes risk"
    roles: [ModelValidator, ModelRiskOfficer]
    code: 201
    input: [severity, title]
    output: Finding
    side_effects: ["source := VALIDATION", "raised_by_user_id := X-User-ID", "remediation_due_at per finding_deadline_days", "model.open_findings_count += 1", "model risk_score/risk_tier recomputed (findings penalty)"]

  - method: GET
    path: "/mrm/models/{id}/findings"
    description: "List findings of a model with optional filters (FK reverse reachability)"
    roles: [ModelOwner, ModelValidator, ModelRiskOfficer, RegulatoryReporter]
    code: 200
    input: ["status?", "severity?", "limit?", "offset?"]
    output: "Finding[]"
    side_effects: []

  - method: POST
    path: "/mrm/models/{id}/findings/{fid}/close"
    description: "Close an OPEN/OVERDUE/ESCALATED finding; HIGH|CRITICAL requires a later-completed validation engagement (retest evidence); may auto-resume a SUSPENDED model"
    roles: [ModelRiskOfficer]
    code: 200
    input: []
    output: Finding
    side_effects: ["status → CLOSED", "closed_at := now", "model.open_findings_count -= 1", "model risk recomputed", "auto-resume check on the model"]

  - method: POST
    path: "/mrm/models/{id}/findings/{fid}/reopen"
    description: "Reopen a CLOSED finding; original remediation_due_at is preserved; bumps open_findings_count and recomputes risk"
    roles: [ModelRiskOfficer]
    code: 200
    input: []
    output: Finding
    side_effects: ["status CLOSED → OPEN", "closed_at := null", "model.open_findings_count += 1", "model risk recomputed"]

  # --- Monitoring ---
  - method: POST
    path: "/mrm/models/{id}/monitoring-metrics"
    description: "Register an ongoing monitoring metric; model must be APPROVED_FOR_USE; created ACTIVE"
    roles: [ModelOwner]
    code: 201
    input: [metric_name, direction, threshold_value]
    output: MonitoringMetric
    side_effects: ["status ACTIVE", "consecutive_breach_count := 0"]

  - method: GET
    path: "/mrm/models/{id}/monitoring-metrics"
    description: "List monitoring metrics of a model (FK reverse reachability)"
    roles: [ModelOwner, ModelValidator, ModelRiskOfficer, RegulatoryReporter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "MonitoringMetric[]"
    side_effects: []

  - method: GET
    path: "/mrm/monitoring-metrics/{id}"
    description: "Get a single monitoring metric including consecutive_breach_count"
    roles: [ModelOwner, ModelValidator, ModelRiskOfficer, RegulatoryReporter]
    code: 200
    input: []
    output: MonitoringMetric
    side_effects: []

  - method: POST
    path: "/mrm/monitoring-metrics/{id}/readings"
    description: "Record a metric reading (append-only); metric must be ACTIVE; observed_at must not precede the latest reading; strict threshold comparison decides is_breach; 3rd consecutive breach auto-raises a HIGH MONITORING finding"
    roles: [ModelOwner]
    code: 201
    input: [value, observed_at]
    output: MetricReading
    side_effects: ["is_breach computed", "on breach: BreachEvent(OPEN) created and consecutive_breach_count += 1", "on non-breach: consecutive_breach_count := 0", "at exactly 3 consecutive breaches: auto-Finding(HIGH, MONITORING) created and model risk recomputed", "model.monitoring_posture recomputed"]

  - method: GET
    path: "/mrm/monitoring-metrics/{id}/readings"
    description: "List readings of a metric in chronological order (FK reverse reachability)"
    roles: [ModelOwner, ModelValidator, ModelRiskOfficer, RegulatoryReporter]
    code: 200
    input: ["limit?", "offset?"]
    output: "MetricReading[]"
    side_effects: []

  - method: GET
    path: "/mrm/monitoring-metrics/{id}/breach-events"
    description: "List breach events of a metric (FK reverse reachability)"
    roles: [ModelOwner, ModelValidator, ModelRiskOfficer, RegulatoryReporter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "BreachEvent[]"
    side_effects: []

  - method: POST
    path: "/mrm/breach-events/{id}/resolve"
    description: "Resolve an OPEN breach event; only the owning model's owner may resolve; recomputes model monitoring_posture"
    roles: [ModelOwner]
    code: 200
    input: []
    output: BreachEvent
    side_effects: ["status → RESOLVED", "model.monitoring_posture recomputed"]

  # --- Vendor transparency ---
  - method: POST
    path: "/mrm/models/{id}/vendor-assessments"
    description: "Record a vendor transparency assessment; only for is_vendor_model models; status CURRENT with valid_until = now + valid_months"
    roles: [ModelRiskOfficer]
    code: 201
    input: [completeness_score, valid_months]
    output: VendorTransparencyAssessment
    side_effects: ["assessed_at := now", "valid_until computed", "status CURRENT"]

  - method: GET
    path: "/mrm/models/{id}/vendor-assessments"
    description: "List vendor transparency assessments of a model (FK reverse reachability)"
    roles: [ModelOwner, ModelValidator, ModelRiskOfficer, RegulatoryReporter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "VendorTransparencyAssessment[]"
    side_effects: []

  # --- Board & regulatory reporting ---
  - method: POST
    path: "/mrm/regulatory-reports"
    description: "Create a DRAFT board/regulatory report; snapshot fields (tier counts, open findings, breaches, overdue validations, inventory_risk_index per aggregation_method) computed once at creation"
    roles: [RegulatoryReporter]
    code: 201
    input: [report_type, period_start, period_end, aggregation_method]
    output: RegulatoryReport
    side_effects: ["snapshot fields computed at creation"]

  - method: GET
    path: "/mrm/regulatory-reports"
    description: "List regulatory reports with optional filters; paginated"
    roles: [ModelOwner, ModelValidator, ModelRiskOfficer, RegulatoryReporter]
    code: 200
    input: ["report_type?", "status?", "limit?", "offset?"]
    output: "RegulatoryReport[]"
    side_effects: []

  - method: GET
    path: "/mrm/regulatory-reports/{id}"
    description: "Get a single regulatory report including its snapshot fields"
    roles: [ModelOwner, ModelValidator, ModelRiskOfficer, RegulatoryReporter]
    code: 200
    input: []
    output: RegulatoryReport
    side_effects: []

  - method: POST
    path: "/mrm/regulatory-reports/{id}/submit"
    description: "Submit a DRAFT report; rejects CLOSED-interval period overlap with any already-SUBMITTED report of the same report_type (adjacency IS a conflict)"
    roles: [RegulatoryReporter]
    code: 200
    input: []
    output: RegulatoryReport
    side_effects: ["status → SUBMITTED", "submitted_at := now"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Startup default before any call is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. Setting the clock triggers the sweep: OPEN findings past due → OVERDUE; OVERDUE findings past due + 7d grace → ESCALATED (which suspends TIER_1 models with HIGH/CRITICAL escalations and pauses their metrics); CURRENT vendor assessments past valid_until → EXPIRED."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["finding overdue/escalation sweep", "vendor assessment expiry sweep", "cascaded model suspensions and metric pauses"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not one of the declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, enum out of range, engagement with both scopes false, or period_end <= period_start" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_model_version does not equal the model's current version (OCC on change-request creation)" }
  # --- Ownership / SoD ---
  - { id: ERR_NOT_MODEL_OWNER, http: 403, condition: "ModelOwner endpoint called by a user whose X-User-ID != model.owner_user_id" }
  - { id: ERR_SOD_VALIDATION_INDEPENDENCE, http: 403, condition: "Validator's X-User-ID equals model.owner_user_id — validation must be independent of development" }
  - { id: ERR_SOD_DOCUMENTATION_APPROVAL, http: 403, condition: "Documentation decider's X-User-ID equals the package's submitted_by_user_id" }
  # --- State ---
  - { id: ERR_MODEL_ALREADY_RETIRED, http: 409, condition: "Child creation or engagement creation on a RETIRED model" }
  - { id: ERR_MODEL_NOT_APPROVABLE, http: 409, condition: "Approve called on a model not in REGISTERED status" }
  - { id: ERR_MODEL_NOT_APPROVED_FOR_USE, http: 409, condition: "Monitoring metric creation on a model not in APPROVED_FOR_USE status" }
  - { id: ERR_MODEL_NOT_RETIRABLE, http: 409, condition: "Retire called on a model not in APPROVED_FOR_USE or SUSPENDED status" }
  - { id: ERR_DOCUMENTATION_NOT_SUBMITTED, http: 409, condition: "Decide called on a documentation package not in SUBMITTED status" }
  - { id: ERR_CHANGE_REQUEST_ALREADY_DECIDED, http: 409, condition: "Decide called on a change request already APPROVED or REJECTED" }
  - { id: ERR_ENGAGEMENT_NOT_IN_TESTING, http: 409, condition: "Complete called on an engagement not in TESTING status" }
  - { id: ERR_ENGAGEMENT_NOT_COMPLETED, http: 409, condition: "Reopen called on an engagement not in COMPLETED status" }
  - { id: ERR_FINDING_NOT_CLOSABLE, http: 409, condition: "Close called on a finding already CLOSED" }
  - { id: ERR_FINDING_NOT_OPEN, http: 409, condition: "Reopen called on a finding not in CLOSED status" }
  - { id: ERR_BREACH_EVENT_ALREADY_RESOLVED, http: 409, condition: "Resolve called on a breach event already RESOLVED" }
  - { id: ERR_REPORT_ALREADY_SUBMITTED, http: 409, condition: "Submit called on a report already SUBMITTED" }
  - { id: ERR_METRIC_NOT_ACTIVE, http: 409, condition: "Reading recorded on a metric not in ACTIVE status (PAUSED or DECOMMISSIONED)" }
  # --- Business ---
  - { id: ERR_OPEN_CRITICAL_FINDINGS, http: 409, condition: "Approval blocked: model has findings with status OPEN/OVERDUE/ESCALATED and severity CRITICAL" }
  - { id: ERR_VENDOR_ASSESSMENT_NOT_CURRENT, http: 403, condition: "Approval blocked: vendor model lacks a CURRENT transparency assessment with completeness_score >= 70" }
  - { id: ERR_VALIDATION_OVERDUE, http: 409, condition: "Approval blocked: logical-clock now > validation_due_at" }
  - { id: ERR_NO_APPROVED_DOCUMENTATION, http: 409, condition: "Approval or engagement creation blocked: no APPROVED documentation package for the model" }
  - { id: ERR_NO_COMPLETED_VALIDATION, http: 409, condition: "Approval blocked: no COMPLETED engagement with outcome != INEFFECTIVE for the model" }
  - { id: ERR_RETEST_REQUIRED, http: 409, condition: "Closing a HIGH/CRITICAL finding blocked: no COMPLETED engagement on the same model with completed_at > finding.created_at" }
  - { id: ERR_REPLACEMENT_MODEL_NOT_APPROVED, http: 409, condition: "Retirement blocked: replacement model is not APPROVED_FOR_USE" }
  - { id: ERR_SELF_REPLACEMENT, http: 409, condition: "Retirement blocked: replacement_model_id equals the retired model's own id" }
  - { id: ERR_VALIDATION_WINDOW_OVERLAP, http: 409, condition: "Engagement review window overlaps an existing engagement of the same model under half-open semantics [start, end); adjacency is allowed" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "Report period overlaps a SUBMITTED report of the same report_type under CLOSED semantics [start, end]; adjacency is a conflict" }
  - { id: ERR_READING_OUT_OF_ORDER, http: 409, condition: "Reading observed_at precedes the metric's latest reading observed_at" }
  - { id: ERR_NOT_A_VENDOR_MODEL, http: 409, condition: "Vendor transparency assessment recorded for a model with is_vendor_model = false" }
  - { id: ERR_DOCUMENTATION_INCOMPLETE, http: 409, condition: "Documentation package missing one or more of the three required evidence flags" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ModelOwner
    description: "Business-unit model developer/owner; registers models, submits documentation and change requests, runs ongoing monitoring"
    identity: opaque   # X-User-ID is stored on Model.owner_user_id; no persisted user entity
    exclusive_operations:
      - "POST /mrm/models — register a model (becomes its owner)"
      - "POST /mrm/models/{id}/documentations — submit documentation (own models only)"
      - "POST /mrm/models/{id}/change-requests — submit change request (own models only, OCC-guarded)"
      - "POST /mrm/models/{id}/monitoring-metrics — register monitoring metric (own models only)"
      - "POST /mrm/monitoring-metrics/{id}/readings — record readings (own models' metrics only)"
      - "POST /mrm/breach-events/{id}/resolve — resolve breach events (own models only)"
    shared_operations:
      - "GET endpoints (all list/get reads)"

  - name: ModelValidator
    description: "Independent validation unit; must be independent of the model's owner (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /mrm/models/{id}/validation-engagements — open an engagement (never on own models)"
      - "POST /mrm/validation-engagements/{id}/complete — complete with outcome + assessed complexity"
      - "POST /mrm/validation-engagements/{id}/reopen — reopen for retesting"
    shared_operations:
      - "POST /mrm/models/{id}/findings — raise findings (shared with ModelRiskOfficer)"
      - "GET endpoints (all list/get reads)"

  - name: ModelRiskOfficer
    description: "Head of model risk; approves models, decides documentation and change requests, closes/reopens findings, records vendor assessments, retires models"
    identity: opaque
    exclusive_operations:
      - "POST /mrm/models/{id}/approve — approve model for use"
      - "POST /mrm/models/{id}/retire — retire with replacement"
      - "POST /mrm/models/{id}/documentations/{docId}/decide — approve/reject documentation (never own submissions)"
      - "POST /mrm/models/{id}/change-requests/{crId}/decide — approve/reject change requests"
      - "POST /mrm/models/{id}/findings/{fid}/close — close findings (retest-gated)"
      - "POST /mrm/models/{id}/findings/{fid}/reopen — reopen findings"
      - "POST /mrm/models/{id}/vendor-assessments — record vendor transparency assessments"
    shared_operations:
      - "POST /mrm/models/{id}/findings — raise findings (shared with ModelValidator)"
      - "GET endpoints (all list/get reads)"

  - name: RegulatoryReporter
    description: "Regulatory reporting liaison; drafts and submits board and regulator reports"
    identity: opaque
    exclusive_operations:
      - "POST /mrm/regulatory-reports — create DRAFT report with snapshot"
      - "POST /mrm/regulatory-reports/{id}/submit — submit report"
    shared_operations:
      - "GET endpoints (all list/get reads)"

  - name: PlatformAdmin
    description: "Test-harness operator; drives the logical clock only"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc — set logical clock and trigger overdue/escalation/expiry sweeps"
    shared_operations: []
