# =============================================================================
# Campus Card & Meal Plan Management — scaffold seed tables
# =============================================================================
scenario: |
  Campus Card & Meal Plan Management (campus card office): card issuance/replacement & photo verification, meal plan assignment by housing status & swipe/dining-dollar balances, door access privileges by role & schedule, declining-balance account funding & refund at term end, lost card deactivation & fraud, merchant off-campus program & settlement, plan change window & proration, transaction dispute

domain_name: campus-card-meal-plan
api_prefix: /api

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers: [optimistic_concurrency, cascading_side_effects, scheduled_actions, derived_field_reconciliation]
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns: [one_to_many, many_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (17 entities)
# =============================================================================
entities:
  - name: CardHolder
    parent: null
    common_fields: true
    fields:
      - { name: university_id, type: string, source: input, description: "Unique university-issued identifier; duplicates rejected with ERR_DUPLICATE_NATURAL_KEY" }
      - { name: full_name, type: string, source: input, description: "Holder legal name" }
      - { name: email, type: string, source: input, description: "Holder email" }
      - { name: holder_type, type: enum, source: input, description: "STUDENT_RESIDENT | STUDENT_COMMUTER | FACULTY | STAFF | AFFILIATE" }
      - { name: housing_status, type: enum, source: input, description: "ON_CAMPUS | COMMUTER | OFF_CAMPUS; gates meal plans with requires_on_campus_housing" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | WITHDRAWN | GRADUATED" }
      - { name: fraud_strike_count, type: integer, source: system, default: 0, description: "Strikes from stolen reports and lost UNAUTHORIZED_USE disputes; >= 3 auto-suspends holder" }
      - { name: fraud_flag, type: boolean, source: system, default: false, description: "Set when strike threshold reached; cleared only by POST /api/card-holders/{id}/fraud-review" }

  - name: CampusCard
    parent: null
    common_fields: true
    fields:
      - { name: holder_id, type: string, source: system, description: "FK -> CardHolder.id; taken from creation path" }
      - { name: card_number, type: string, source: system, description: "Server-minted unique 16-digit card number" }
      - { name: lifecycle_status, type: enum, source: system, default: PENDING_PHOTO, description: "PENDING_PHOTO | ACTIVE | LOST_FROZEN | STOLEN_FROZEN | REPLACED | EXPIRED | DEACTIVATED; parallel dimension independent of photo_status" }
      - { name: photo_status, type: enum, source: system, default: NOT_SUBMITTED, description: "NOT_SUBMITTED | PENDING_REVIEW | APPROVED | REJECTED; parallel dimension independent of lifecycle_status" }
      - { name: is_provisional, type: boolean, source: system, default: true, description: "True when activated without approved photo; clears when photo APPROVED; provisional cards face daily spend cap and door denial" }
      - { name: replaced_by_card_id, type: string, source: system, description: "FK -> CampusCard.id; self-reference set on the old card when a replacement is issued; null otherwise" }
      - { name: replacement_fee_cents, type: integer, source: computed, default: 0, description: "Fee charged to holder CAMPUS_CASH when this card was issued as a replacement (0 for first issuance)" }
      - { name: stolen_police_report_number, type: string, source: system, description: "Police report number captured at report-stolen or replacement; null otherwise" }
      - { name: expires_at, type: datetime, source: input, description: "Card expiry; must be in the future at issuance/activation" }
      - { name: lost_or_stolen_report_count, type: integer, source: system, default: 0, description: "Number of lost/stolen reports filed against this card" }

  - name: PhotoSubmission
    parent: null
    common_fields: true
    fields:
      - { name: card_id, type: string, source: system, description: "FK -> CampusCard.id; taken from creation path" }
      - { name: image_ref, type: string, source: input, description: "Opaque reference to uploaded photo image" }
      - { name: review_status, type: enum, source: system, default: PENDING_REVIEW, description: "PENDING_REVIEW | APPROVED | REJECTED" }
      - { name: rejection_reason, type: string, source: system, description: "Required on REJECTED review; null otherwise" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of reviewing CardOfficeAdmin; null while pending" }
      - { name: submission_sequence, type: integer, source: computed, description: "1-based ordinal of this submission among the card's submissions, in created_at order" }

  - name: Term
    parent: null
    common_fields: true
    fields:
      - { name: term_code, type: string, source: input, description: "Unique natural key; duplicates rejected with ERR_DUPLICATE_NATURAL_KEY" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: start_date, type: datetime, source: input, description: "Term start (UTC); must be before end_date" }
      - { name: end_date, type: datetime, source: input, description: "Term end (UTC); must be after start_date" }
      - { name: add_drop_deadline, type: datetime, source: input, description: "Plan change window close; must satisfy start_date <= add_drop_deadline <= end_date" }
      - { name: total_weeks, type: integer, source: input, description: "Number of weekly swipe periods; >= 1" }
      - { name: proration_mode, type: enum, source: input, description: "WEEKLY | DAILY; selects the proration variant for all enrollments in this term" }
      - { name: current_week_index, type: integer, source: system, default: 0, description: "0 while SCHEDULED; 1 at open; incremented by advance-week" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | OPEN | CLOSED | SETTLED" }

  - name: MealPlan
    parent: null
    common_fields: true
    fields:
      - { name: plan_code, type: string, source: input, description: "Unique natural key; duplicates rejected with ERR_DUPLICATE_NATURAL_KEY" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: weekly_swipe_allowance, type: integer, source: input, description: "Swipes granted per week; >= 0; ignored when is_unlimited_swipes" }
      - { name: is_unlimited_swipes, type: boolean, source: input, default: false, description: "When true, swipe count check is bypassed" }
      - { name: dining_dollar_allocation_cents, type: integer, source: input, description: "Dining dollars granted at activation; >= 0" }
      - { name: price_cents, type: integer, source: input, description: "Full-term price; > 0" }
      - { name: requires_on_campus_housing, type: boolean, source: input, default: false, description: "When true, only holders with housing_status ON_CAMPUS may enroll" }
      - { name: eligible_holder_types, type: array, source: input, description: "Non-empty subset of holder_type enum" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | RETIRED" }

  - name: MealPlanEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: holder_id, type: string, source: system, description: "FK -> CardHolder.id; taken from creation path" }
      - { name: plan_id, type: string, source: input, description: "FK -> MealPlan.id" }
      - { name: term_id, type: string, source: input, description: "FK -> Term.id" }
      - { name: supersedes_enrollment_id, type: string, source: system, description: "FK -> MealPlanEnrollment.id; set on the successor created by plan change execution; null otherwise" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | ACTIVE | SUPERSEDED | CANCELLED | CLOSED; initial ASSIGNED when term SCHEDULED, ACTIVE when term OPEN" }
      - { name: charge_cents, type: integer, source: computed, description: "Prorated charge computed at activation per enrollment_activation_pricing; null until ACTIVE" }
      - { name: credit_cents, type: integer, source: computed, default: 0, description: "Credit granted when this enrollment was superseded or cancelled after activation" }
      - { name: weekly_swipe_allowance, type: integer, source: computed, description: "Snapshot of plan.weekly_swipe_allowance at activation" }
      - { name: is_unlimited_swipes, type: boolean, source: computed, description: "Snapshot of plan.is_unlimited_swipes at activation" }
      - { name: swipes_used_this_week, type: integer, source: system, default: 0, description: "Consumed swipes in the current week; reset by advance-week; increments version on change" }
      - { name: enrolled_week_index, type: integer, source: computed, description: "term.current_week_index at activation" }
      - { name: activated_at, type: datetime, source: system, description: "Clock timestamp of activation; null until ACTIVE" }

  - name: PlanChangeRequest
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> MealPlanEnrollment.id; taken from creation path" }
      - { name: new_plan_id, type: string, source: input, description: "FK -> MealPlan.id; target plan" }
      - { name: requested_by, type: string, source: system, description: "X-User-ID of requesting CardHolder" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | APPROVED | EXECUTED | DENIED | WITHDRAWN | VOID | EXPIRED" }
      - { name: effective_week_index, type: integer, source: computed, description: "term.current_week_index + 1 at approval; execution is deferred to advance-week" }
      - { name: charge_delta_cents, type: integer, source: computed, description: "Signed delta from plan_change_proration computed at approval, posted at execution; null until APPROVED" }
      - { name: funding_delta_cents, type: integer, source: computed, description: "Dining-dollar grant for remaining period on the new plan; null until APPROVED" }
      - { name: void_reason, type: enum, source: system, description: "INSUFFICIENT_FUNDS | ENROLLMENT_CANCELLED; set only on VOID" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of deciding DiningServicesManager; null while SUBMITTED" }
      - { name: denial_reason, type: string, source: system, description: "Required on deny; null otherwise" }

  - name: DecliningBalanceAccount
    parent: null
    common_fields: true
    fields:
      - { name: holder_id, type: string, source: system, description: "FK -> CardHolder.id; taken from creation path or auto-created holder" }
      - { name: account_type, type: enum, source: input, description: "DINING_DOLLARS | CAMPUS_CASH" }
      - { name: term_id, type: string, source: input, description: "FK -> Term.id; required for DINING_DOLLARS, must be null for CAMPUS_CASH" }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "Derived: signed sum of the account's LedgerEntry rows per ledger_balance_recompute; never settable directly" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | FROZEN | CLOSE_PENDING | REFUNDED | FORFEITED" }
      - { name: frozen_reason, type: enum, source: system, description: "CARD_STOLEN | HOLDER_SUSPENDED; null unless FROZEN" }
      - { name: last_adjusted_by, type: string, source: system, description: "X-User-ID of the BursarOffice user who posted the most recent manual adjustment; null if none" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> DecliningBalanceAccount.id" }
      - { name: entry_type, type: enum, source: system, description: "FUND | ALLOCATION_GRANT | PURCHASE | PURCHASE_REVERSAL | FEE | PRORATION_CREDIT | PRORATION_DEBIT | PROVISIONAL_CREDIT | PROVISIONAL_CLAWBACK | ADJUSTMENT_CREDIT | ADJUSTMENT_DEBIT | REFUND_PAYOUT | FORFEIT" }
      - { name: amount_cents, type: integer, source: system, description: "Unsigned magnitude > 0; direction derived from entry_type per ledger_balance_recompute" }
      - { name: description, type: string, source: system, description: "Human-readable note" }
      - { name: reference_transaction_id, type: string, source: system, description: "FK -> CardTransaction.id; set on PURCHASE / PURCHASE_REVERSAL / PROVISIONAL_CREDIT / PROVISIONAL_CLAWBACK; null otherwise" }
      - { name: reference_dispute_id, type: string, source: system, description: "FK -> Dispute.id; set on PROVISIONAL_CREDIT / PROVISIONAL_CLAWBACK; null otherwise" }
      - { name: entry_sequence, type: integer, source: system, description: "Per-account monotonically increasing sequence starting at 1; ties in created_at broken by entry_sequence ASC" }
      - { name: running_balance_cents, type: integer, source: computed, description: "Account balance immediately after this entry, replayed in (created_at ASC, entry_sequence ASC) order" }

  - name: CardTransaction
    parent: null
    common_fields: true
    fields:
      - { name: card_id, type: string, source: input, description: "FK -> CampusCard.id" }
      - { name: account_id, type: string, source: system, description: "FK -> DecliningBalanceAccount.id; derived from tender_type for DINING_DOLLARS / CAMPUS_CASH; null for MEAL_SWIPE" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> MealPlanEnrollment.id; derived for MEAL_SWIPE; null otherwise" }
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; set when posted by MerchantUser (must equal caller's merchant id); null for on-campus PointOfSale postings" }
      - { name: tender_type, type: enum, source: input, description: "MEAL_SWIPE | DINING_DOLLARS | CAMPUS_CASH" }
      - { name: amount_cents, type: integer, source: input, description: "Purchase amount; must be exactly 0 for MEAL_SWIPE, > 0 otherwise" }
      - { name: idempotency_key, type: string, source: input, description: "Client key; replay with identical payload returns original response, divergent payload -> ERR_IDEMPOTENCY_CONFLICT" }
      - { name: location_description, type: string, source: input, description: "Optional free-text location" }
      - { name: status, type: enum, source: system, description: "POSTED | UNDER_DISPUTE | SETTLED | REVERSED; on-campus postings settle immediately, merchant postings settle on settlement approval" }
      - { name: pre_dispute_status, type: enum, source: system, description: "Status captured when a dispute opens (POSTED or SETTLED); restored on merchant win / withdraw; null when never disputed" }
      - { name: settled_in_settlement_id, type: string, source: system, description: "FK -> MerchantSettlement.id; linked at settlement submit sweep; null when unlinked or on-campus" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: transaction_id, type: string, source: system, description: "FK -> CardTransaction.id; taken from creation path" }
      - { name: filed_by_holder_id, type: string, source: system, description: "FK -> CardHolder.id; equals X-User-ID of the filing CardHolder" }
      - { name: reason_code, type: enum, source: input, description: "UNAUTHORIZED_USE | DUPLICATE_CHARGE | AMOUNT_MISMATCH | SERVICE_NOT_RECEIVED" }
      - { name: status, type: enum, source: system, default: OPENED, description: "OPENED | PROVISIONAL_CREDIT_GRANTED | RESOLVED_FOR_CARDHOLDER | RESOLVED_FOR_MERCHANT | WITHDRAWN" }
      - { name: provisional_credit_cents, type: integer, source: computed, default: 0, description: "Credit posted on grant; equals disputed transaction amount" }
      - { name: granter_analyst_id, type: string, source: system, description: "X-User-ID of FraudAnalyst granting provisional credit; null until granted" }
      - { name: resolver_analyst_id, type: string, source: system, description: "X-User-ID of resolving FraudAnalyst; null until resolved" }
      - { name: resolution_note, type: string, source: system, description: "Note recorded at resolution; null until resolved" }

  - name: RefundRequest
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> DecliningBalanceAccount.id; taken from creation path" }
      - { name: requested_by_holder_id, type: string, source: system, description: "FK -> CardHolder.id; equals X-User-ID of requesting CardHolder" }
      - { name: refund_variant, type: enum, source: computed, description: "AUTO_EXCLUDING_PROVISIONAL | FULL_BALANCE; selected per term_end_refund_amount at request time" }
      - { name: amount_cents, type: integer, source: computed, description: "Refund amount per term_end_refund_amount; must be >= MIN_REFUND_CENTS" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | APPROVED | DENIED | PAID" }
      - { name: denial_reason, type: string, source: system, description: "Required on deny; null otherwise" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID of approving BursarOffice user; null until approved" }
      - { name: paid_by, type: string, source: system, description: "X-User-ID of paying BursarOffice user; must differ from approved_by; null until paid" }

  - name: DoorZone
    parent: null
    common_fields: true
    fields:
      - { name: zone_code, type: string, source: input, description: "Unique natural key; duplicates rejected with ERR_DUPLICATE_NATURAL_KEY" }
      - { name: building, type: string, source: input, description: "Building name" }
      - { name: security_level, type: enum, source: input, description: "STANDARD | ELEVATED | RESTRICTED; ordinal 1|2|3 for clearance comparison" }
      - { name: access_windows, type: array, source: input, description: "Non-empty list of { day_of_week: MON..SUN, start_minute: 0..1439, end_minute: 1..1440 } with end_minute > start_minute; matching is half-open [start_minute, end_minute)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DECOMMISSIONED" }

  - name: AccessGrant
    parent: null
    common_fields: true
    fields:
      - { name: card_id, type: string, source: system, description: "FK -> CampusCard.id; taken from creation path" }
      - { name: zone_id, type: string, source: input, description: "FK -> DoorZone.id" }
      - { name: clearance, type: enum, source: input, description: "STANDARD | ELEVATED | RESTRICTED; compared against zone security_level at access time" }
      - { name: valid_from, type: datetime, source: input, description: "Validity start (inclusive)" }
      - { name: valid_until, type: datetime, source: input, description: "Validity end (exclusive); must be > valid_from; half-open interval [valid_from, valid_until)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | REVOKED | EXPIRED" }
      - { name: suspended_reason, type: enum, source: system, description: "CARD_FROZEN | MANUAL; null unless SUSPENDED" }
      - { name: granted_by, type: string, source: system, description: "X-User-ID of creating SecurityOfficer" }

  - name: AccessEvent
    parent: null
    common_fields: false
    fields:
      - { name: card_id, type: string, source: input, description: "FK -> CampusCard.id" }
      - { name: zone_id, type: string, source: input, description: "FK -> DoorZone.id" }
      - { name: grant_id, type: string, source: system, description: "FK -> AccessGrant.id; the grant selected by access_decision_selector; null when no candidate grant exists" }
      - { name: decision, type: enum, source: system, description: "GRANTED | DENIED" }
      - { name: deny_reason, type: enum, source: system, description: "ZONE_DECOMMISSIONED | CARD_NOT_ACTIVE | CARD_PROVISIONAL | NO_ACTIVE_GRANT | INSUFFICIENT_CLEARANCE | OUTSIDE_SCHEDULE; null when GRANTED" }
      - { name: attempted_at, type: datetime, source: system, description: "Logical clock timestamp of the attempt" }

  - name: Merchant
    parent: null
    common_fields: true
    fields:
      - { name: merchant_code, type: string, source: input, description: "Unique natural key; duplicates rejected with ERR_DUPLICATE_NATURAL_KEY" }
      - { name: legal_name, type: string, source: input, description: "Registered legal name" }
      - { name: category, type: enum, source: input, description: "RESTAURANT | GROCERY | COFFEE | BOOKSTORE | OTHER" }
      - { name: commission_bps, type: integer, source: input, description: "Commission rate in basis points; 0..2000" }
      - { name: commission_mode, type: enum, source: input, default: PER_TRANSACTION, description: "PER_TRANSACTION | AGGREGATE; selects settlement rounding variant" }
      - { name: contact_email, type: string, source: input, description: "Merchant contact" }
      - { name: status, type: enum, source: system, default: PENDING_CONTRACT, description: "PENDING_CONTRACT | ACTIVE | SUSPENDED | TERMINATED" }

  - name: MerchantSettlement
    parent: null
    common_fields: true
    fields:
      - { name: merchant_id, type: string, source: system, description: "FK -> Merchant.id; taken from creation path" }
      - { name: term_id, type: string, source: input, description: "FK -> Term.id; period must lie within the term's [start_date, end_date]" }
      - { name: period_start, type: datetime, source: input, description: "Settlement period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Settlement period end (inclusive); closed-closed interval; must be >= period_start" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | REJECTED | APPROVED | PAID" }
      - { name: gross_cents, type: integer, source: computed, description: "Sum of swept transaction amounts at submit; null until first SUBMITTED" }
      - { name: commission_cents, type: integer, source: computed, description: "Commission per merchant_settlement_sweep; null until first SUBMITTED" }
      - { name: net_cents, type: integer, source: computed, description: "gross_cents - commission_cents; null until first SUBMITTED" }
      - { name: transaction_count, type: integer, source: computed, description: "Number of swept transactions; null until first SUBMITTED" }
      - { name: carried_from_settlement_id, type: string, source: system, description: "FK -> MerchantSettlement.id; identifies the prior settlement whose disputed transactions later resolved into this sweep; null when none" }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID of most recent submitter (MerchantUser or BursarOffice); null until first SUBMITTED" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID of approving BursarOffice user; must differ from submitted_by; null until approved" }
      - { name: paid_by, type: string, source: system, description: "X-User-ID of paying BursarOffice user; must differ from approved_by; null until paid" }
      - { name: rejection_reason, type: string, source: system, description: "Required on reject; null otherwise" }

# =============================================================================
# §1.2 State Machine Table (15 machines)
# =============================================================================
state_machines:
  - entity: CardHolder
    initial_state: ACTIVE
    terminal_states: [GRADUATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/card-holders/{id}/suspend, or system via fraud_strike_escalation when fraud_strike_count reaches 3"
        actor: CardOfficeAdmin | FraudAnalyst | system
        preconditions: []
        side_effects:
          - "fraud_flag set to true when transition was triggered by strike threshold"
          - "All holder's DecliningBalanceAccount in OPEN -> FROZEN with frozen_reason=HOLDER_SUSPENDED"
          - "All holder's CampusCard in ACTIVE | LOST_FROZEN | STOLEN_FROZEN -> DEACTIVATED; each deactivation revokes that card's non-terminal AccessGrants"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /api/card-holders/{id}/withdraw"
        actor: CardOfficeAdmin
        preconditions: []
        side_effects:
          - "All holder's MealPlanEnrollment in ASSIGNED -> CANCELLED; in ACTIVE -> CANCELLED with cancel credit per enrollment_cancellation_credit (posts PRORATION_CREDIT LedgerEntry to the term DINING_DOLLARS account, recomputing its balance_cents)"
          - "All holder's DecliningBalanceAccount in OPEN | FROZEN -> CLOSE_PENDING"
          - "All holder's PlanChangeRequest in SUBMITTED | APPROVED on those enrollments -> VOID with void_reason=ENROLLMENT_CANCELLED"
      - from: ACTIVE
        to: GRADUATED
        trigger: "POST /api/card-holders/{id}/graduate"
        actor: CardOfficeAdmin
        preconditions: []
        side_effects:
          - "Same enrollment-cancellation, account-close, and change-request-void cascades as withdraw"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/card-holders/{id}/reinstate"
        actor: CardOfficeAdmin
        preconditions:
          - "fraud_flag must be false (ERR_FRAUD_HOLD otherwise); fraud-review must run first when suspension was strike-driven"
        side_effects:
          - "Accounts FROZEN with frozen_reason=HOLDER_SUSPENDED -> OPEN"
      - from: WITHDRAWN
        to: ACTIVE
        trigger: "POST /api/card-holders/{id}/reinstate"
        actor: CardOfficeAdmin
        preconditions: []
        side_effects: []

  - entity: CampusCard
    field: lifecycle_status
    initial_state: PENDING_PHOTO
    terminal_states: [REPLACED, EXPIRED, DEACTIVATED]
    transitions:
      - from: PENDING_PHOTO
        to: ACTIVE
        trigger: "POST /api/cards/{id}/activate"
        actor: CardOfficeAdmin
        preconditions:
          - "holder.status == ACTIVE (ERR_HOLDER_NOT_ACTIVE)"
          - "photo_status == APPROVED, or payload allow_provisional == true (ERR_PHOTO_NOT_APPROVED otherwise)"
          - "clock < expires_at (ERR_INVALID_STATE_TRANSITION otherwise)"
        side_effects:
          - "is_provisional = false when photo_status == APPROVED; true when activated via allow_provisional"
      - from: ACTIVE
        to: LOST_FROZEN
        trigger: "POST /api/cards/{id}/report-lost"
        actor: CardHolder
        preconditions:
          - "caller owns the card (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "lost_or_stolen_report_count += 1"
          - "All card's AccessGrant in ACTIVE -> SUSPENDED with suspended_reason=CARD_FROZEN"
      - from: LOST_FROZEN
        to: ACTIVE
        trigger: "POST /api/cards/{id}/unfreeze"
        actor: CardHolder
        preconditions:
          - "holder.status == ACTIVE (ERR_HOLDER_NOT_ACTIVE)"
        side_effects:
          - "All card's AccessGrant in SUSPENDED with suspended_reason=CARD_FROZEN -> ACTIVE"
      - from: ACTIVE
        to: STOLEN_FROZEN
        trigger: "POST /api/cards/{id}/report-stolen"
        actor: CardHolder
        preconditions: []
        side_effects:
          - "lost_or_stolen_report_count += 1; stolen_police_report_number recorded when supplied"
          - "Cascade link 1 -> 2: holder.fraud_strike_count += 1 (fraud_strike_escalation)"
          - "Cascade link 2 -> 3: when fraud_strike_count >= 3, holder.status -> SUSPENDED and fraud_flag = true"
          - "Cascade link 3 -> 4: holder suspension freezes every OPEN DecliningBalanceAccount of the holder (frozen_reason=HOLDER_SUSPENDED) and deactivates the holder's remaining non-terminal cards, revoking their grants"
          - "All card's AccessGrant in ACTIVE -> SUSPENDED with suspended_reason=CARD_FROZEN"
          - "Holder's OPEN DecliningBalanceAccount -> FROZEN with frozen_reason=CARD_STOLEN (unless already FROZEN)"
      - from: LOST_FROZEN
        to: STOLEN_FROZEN
        trigger: "POST /api/cards/{id}/report-stolen"
        actor: CardHolder
        preconditions: []
        side_effects:
          - "Same strike, account-freeze, and grant-suspension side effects as ACTIVE -> STOLEN_FROZEN"
      - from: ACTIVE
        to: REPLACED
        trigger: "POST /api/cards/{id}/replacement"
        actor: CardOfficeAdmin
        preconditions:
          - "expected_card_version matches card.version (ERR_STALE_VERSION)"
        side_effects:
          - "New CampusCard created for the same holder: lifecycle_status = ACTIVE with is_provisional=false when this card's photo_status == APPROVED, else PENDING_PHOTO with photo_status NOT_SUBMITTED; expires_at inherited; replacement_fee_cents per replacement_fee_schedule"
          - "replaced_by_card_id set to the new card id"
          - "Fee posted as FEE LedgerEntry to holder's CAMPUS_CASH account (auto-created OPEN when none exists); FEE entries may drive balance_cents negative"
          - "All card's AccessGrant in ACTIVE | SUSPENDED -> REVOKED"
      - from: LOST_FROZEN
        to: REPLACED
        trigger: "POST /api/cards/{id}/replacement"
        actor: CardOfficeAdmin
        preconditions:
          - "expected_card_version matches card.version (ERR_STALE_VERSION)"
        side_effects:
          - "Same new-card creation, fee posting, and grant revocation as ACTIVE -> REPLACED"
      - from: STOLEN_FROZEN
        to: REPLACED
        trigger: "POST /api/cards/{id}/replacement"
        actor: CardOfficeAdmin
        preconditions:
          - "expected_card_version matches card.version (ERR_STALE_VERSION)"
        side_effects:
          - "Same new-card creation, fee posting, and grant revocation as ACTIVE -> REPLACED"
      - from: PENDING_PHOTO
        to: REPLACED
        trigger: "POST /api/cards/{id}/replacement"
        actor: CardOfficeAdmin
        preconditions:
          - "expected_card_version matches card.version (ERR_STALE_VERSION)"
        side_effects:
          - "Same new-card creation and fee posting as ACTIVE -> REPLACED (no grants can exist yet)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: first transaction or access attempt with clock >= expires_at"
        actor: system
        preconditions:
          - "clock >= expires_at"
        side_effects:
          - "The triggering transaction fails with ERR_CARD_NOT_ACTIVE; the triggering access event is recorded DENIED with deny_reason=CARD_NOT_ACTIVE"
      - from: PENDING_PHOTO
        to: DEACTIVATED
        trigger: "POST /api/cards/{id}/deactivate"
        actor: CardOfficeAdmin | FraudAnalyst
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /api/cards/{id}/deactivate"
        actor: CardOfficeAdmin | FraudAnalyst
        preconditions: []
        side_effects:
          - "All card's AccessGrant in ACTIVE | SUSPENDED -> REVOKED"
      - from: LOST_FROZEN
        to: DEACTIVATED
        trigger: "POST /api/cards/{id}/deactivate"
        actor: CardOfficeAdmin | FraudAnalyst
        preconditions: []
        side_effects:
          - "All card's AccessGrant in SUSPENDED -> REVOKED"
      - from: STOLEN_FROZEN
        to: DEACTIVATED
        trigger: "POST /api/cards/{id}/deactivate"
        actor: CardOfficeAdmin | FraudAnalyst
        preconditions: []
        side_effects:
          - "All card's AccessGrant in SUSPENDED -> REVOKED"

  - entity: CampusCard
    field: photo_status
    initial_state: NOT_SUBMITTED
    terminal_states: []
    transitions:
      - from: NOT_SUBMITTED
        to: PENDING_REVIEW
        trigger: "POST /api/cards/{id}/photos"
        actor: CardHolder
        preconditions:
          - "card.lifecycle_status in PENDING_PHOTO | ACTIVE | LOST_FROZEN (ERR_INVALID_STATE_TRANSITION otherwise)"
        side_effects:
          - "PhotoSubmission created with review_status=PENDING_REVIEW"
      - from: REJECTED
        to: PENDING_REVIEW
        trigger: "POST /api/cards/{id}/photos"
        actor: CardHolder
        preconditions:
          - "card.lifecycle_status in PENDING_PHOTO | ACTIVE | LOST_FROZEN"
        side_effects:
          - "New PhotoSubmission created; cycle REJECTED -> PENDING_REVIEW is allowed without bound"
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /api/photos/{id}/review with decision=APPROVED"
        actor: CardOfficeAdmin
        preconditions:
          - "The reviewed PhotoSubmission is the card's latest submission (highest submission_sequence)"
        side_effects:
          - "When card.is_provisional == true, is_provisional -> false"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /api/photos/{id}/review with decision=REJECTED"
        actor: CardOfficeAdmin
        preconditions:
          - "rejection_reason must be present (ERR_VALIDATION otherwise)"
        side_effects: []

  - entity: PhotoSubmission
    field: review_status
    initial_state: PENDING_REVIEW
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /api/photos/{id}/review"
        actor: CardOfficeAdmin
        preconditions: []
        side_effects:
          - "Mirrors onto CampusCard.photo_status (see CampusCard photo machine)"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /api/photos/{id}/review"
        actor: CardOfficeAdmin
        preconditions:
          - "rejection_reason present"
        side_effects:
          - "Mirrors onto CampusCard.photo_status"

  - entity: Term
    initial_state: SCHEDULED
    terminal_states: [SETTLED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /api/terms/{id}/open"
        actor: DiningServicesManager
        preconditions:
          - "clock >= start_date (ERR_TERM_NOT_YET_STARTED)"
        side_effects:
          - "current_week_index = 1"
          - "Every MealPlanEnrollment in ASSIGNED for this term -> ACTIVE: charge_cents and ALLOCATION_GRANT computed per enrollment_activation_pricing, dining account auto-created when absent"
      - from: OPEN
        to: OPEN
        trigger: "POST /api/terms/{id}/advance-week"
        actor: DiningServicesManager
        preconditions:
          - "current_week_index < total_weeks (ERR_TERM_WEEKS_EXHAUSTED)"
        side_effects:
          - "Step 1: current_week_index += 1"
          - "Step 2: every ACTIVE MealPlanEnrollment of this term: swipes_used_this_week -> 0 (weekly_swipe_reset)"
          - "Step 3: execute each PlanChangeRequest in APPROVED with effective_week_index == new current_week_index, in created_at ASC order: successor enrollment created (ACTIVE, supersedes_enrollment_index set), old enrollment -> SUPERSEDED, charge/funding deltas posted per plan_change_proration; request -> VOID with void_reason when enrollment not ACTIVE or CAMPUS_CASH balance cannot cover a positive charge_delta"
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/terms/{id}/close"
        actor: DiningServicesManager
        preconditions:
          - "clock >= end_date (ERR_TERM_NOT_ENDED)"
        side_effects:
          - "Cascade link 1 -> 2: every MealPlanEnrollment in ACTIVE for this term -> CLOSED; every ASSIGNED -> CANCELLED"
          - "Cascade link 2 -> 3: each enrollment closure sweeps the holder's DINING_DOLLARS account for this term (the enrollment-linked account): status OPEN | FROZEN -> CLOSE_PENDING"
          - "Cascade link 3 -> 4: entering CLOSE_PENDING evaluates the forfeiture threshold: when balance_cents < MIN_REFUND_CENTS the account posts a FORFEIT LedgerEntry for the full balance and -> FORFEITED"
          - "All PlanChangeRequest in SUBMITTED | APPROVED for enrollments of this term -> EXPIRED"
      - from: CLOSED
        to: SETTLED
        trigger: "POST /api/terms/{id}/settle"
        actor: DiningServicesManager
        preconditions:
          - "No RefundRequest in REQUESTED | APPROVED on accounts bound to this term (ERR_REFUNDS_OUTSTANDING)"
          - "No MerchantSettlement for this term in DRAFT | SUBMITTED | APPROVED (ERR_SETTLEMENTS_OUTSTANDING)"
        side_effects:
          - "Every remaining CLOSE_PENDING DINING_DOLLARS account of this term posts FORFEIT for its full balance_cents and -> FORFEITED"

  - entity: MealPlan
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/meal-plans/{id}/publish"
        actor: DiningServicesManager
        preconditions: []
        side_effects: []
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /api/meal-plans/{id}/retire"
        actor: DiningServicesManager
        preconditions:
          - "No MealPlanEnrollment in ASSIGNED | ACTIVE references this plan (ERR_PLAN_IN_USE)"
        side_effects: []

  - entity: MealPlanEnrollment
    initial_state: ASSIGNED
    terminal_states: [SUPERSEDED, CANCELLED, CLOSED]
    transitions:
      - from: ASSIGNED
        to: ACTIVE
        trigger: "system at POST /api/terms/{id}/open (bulk), or immediately on POST /api/card-holders/{id}/enrollments when the term is already OPEN"
        actor: system | DiningServicesManager
        preconditions: []
        side_effects:
          - "charge_cents computed per enrollment_activation_pricing; activated_at set; enrolled_week_index = term.current_week_index"
          - "ALLOCATION_GRANT LedgerEntry posted to the holder's DINING_DOLLARS account for this term (account auto-created OPEN when absent); account balance_cents recomputed"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system during POST /api/terms/{id}/advance-week when executing an APPROVED PlanChangeRequest"
        actor: system
        preconditions: []
        side_effects:
          - "credit_cents = charge_cents - old_plan_earned per plan_change_proration"
          - "Successor enrollment created ACTIVE with supersedes_enrollment_id = this id, plan = request.new_plan_id, enrolled_week_index = effective_week_index, swipes_used_this_week = 0 (post-reset), charge_cents = new_due"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /api/enrollments/{id}/cancel, or cascade from holder withdraw/graduate, or term close"
        actor: DiningServicesManager | system
        preconditions: []
        side_effects:
          - "No credit (nothing was charged)"
          - "Any PlanChangeRequest in SUBMITTED | APPROVED on this enrollment -> VOID with void_reason=ENROLLMENT_CANCELLED (cannot occur from ASSIGNED in practice; pinned for completeness)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/enrollments/{id}/cancel, or cascade from holder withdraw/graduate"
        actor: DiningServicesManager | system
        preconditions: []
        side_effects:
          - "credit_cents computed per enrollment_cancellation_credit and posted as PRORATION_CREDIT to the term DINING_DOLLARS account (recomputing balance_cents)"
          - "Any PlanChangeRequest in SUBMITTED | APPROVED on this enrollment -> VOID with void_reason=ENROLLMENT_CANCELLED"
      - from: ACTIVE
        to: CLOSED
        trigger: "system at POST /api/terms/{id}/close"
        actor: system
        preconditions: []
        side_effects:
          - "Unused swipes lapse (no compensation)"
          - "The enrollment-linked DINING_DOLLARS account is swept into CLOSE_PENDING (then possibly FORFEITED) per the term-close cascade"

  - entity: PlanChangeRequest
    initial_state: SUBMITTED
    terminal_states: [EXECUTED, DENIED, WITHDRAWN, VOID, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/change-requests/{id}/approve"
        actor: DiningServicesManager
        preconditions:
          - "clock <= term.add_drop_deadline (ERR_PLAN_CHANGE_WINDOW_CLOSED)"
          - "term.status == OPEN (ERR_TERM_NOT_OPEN)"
          - "term.current_week_index + 1 <= term.total_weeks (ERR_PLAN_CHANGE_EFFECTIVE_WEEK_INVALID)"
        side_effects:
          - "effective_week_index = term.current_week_index + 1"
          - "charge_delta_cents and funding_delta_cents computed per plan_change_proration and stored; posting is deferred to execution"
          - "decided_by set"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/change-requests/{id}/deny"
        actor: DiningServicesManager
        preconditions:
          - "denial_reason present (ERR_VALIDATION otherwise)"
        side_effects:
          - "decided_by set"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/change-requests/{id}/withdraw"
        actor: CardHolder
        preconditions:
          - "caller owns the parent enrollment (ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: APPROVED
        to: EXECUTED
        trigger: "system during POST /api/terms/{id}/advance-week when new current_week_index == effective_week_index"
        actor: system
        preconditions:
          - "parent enrollment still ACTIVE"
          - "when charge_delta_cents > 0, holder's CAMPUS_CASH balance_cents >= charge_delta_cents"
        side_effects:
          - "Old enrollment -> SUPERSEDED; successor created; PRORATION_DEBIT (positive delta) or PRORATION_CREDIT (negative delta) posted to CAMPUS_CASH; ALLOCATION_GRANT of funding_delta_cents posted to DINING_DOLLARS"
      - from: APPROVED
        to: VOID
        trigger: "system during advance-week when a precondition fails, or cascade when the parent enrollment is cancelled / holder withdrawn"
        actor: system
        preconditions: []
        side_effects:
          - "void_reason = INSUFFICIENT_FUNDS | ENROLLMENT_CANCELLED; old enrollment remains in its prior state; no ledger entries posted"
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system at POST /api/terms/{id}/close"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: "system at POST /api/terms/{id}/close"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DecliningBalanceAccount
    initial_state: OPEN
    terminal_states: [REFUNDED, FORFEITED]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "cascade: report-stolen (frozen_reason=CARD_STOLEN) or holder suspension (frozen_reason=HOLDER_SUSPENDED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FROZEN
        to: OPEN
        trigger: "cascade: card unfreeze clears CARD_STOLEN freezes when holder ACTIVE; reinstate / fraud-review clears HOLDER_SUSPENDED freezes"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSE_PENDING
        trigger: "system at term close (DINING_DOLLARS accounts of the closing term), or cascade from holder withdraw/graduate (all accounts)"
        actor: system
        preconditions: []
        side_effects:
          - "When entered via term close and balance_cents < MIN_REFUND_CENTS, immediately posts FORFEIT and continues to FORFEITED"
      - from: FROZEN
        to: CLOSE_PENDING
        trigger: "system at term close or holder withdraw/graduate"
        actor: system
        preconditions: []
        side_effects:
          - "frozen_reason cleared; same forfeiture threshold evaluation as from OPEN"
      - from: CLOSE_PENDING
        to: REFUNDED
        trigger: "POST /api/refund-requests/{id}/pay when posted REFUND_PAYOUT zeroes balance_cents"
        actor: BursarOffice
        preconditions: []
        side_effects: []
      - from: CLOSE_PENDING
        to: FORFEITED
        trigger: "system at term settle, or immediately at term close when balance_cents < MIN_REFUND_CENTS"
        actor: system
        preconditions: []
        side_effects:
          - "FORFEIT LedgerEntry posted for the full remaining balance_cents, zeroing the account"

  - entity: CardTransaction
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: SETTLED
        trigger: "creation when merchant_id is null (on-campus), or settlement approval sweep for merchant transactions"
        actor: system
        preconditions: []
        side_effects: []
      - from: POSTED
        to: UNDER_DISPUTE
        trigger: "POST /api/transactions/{id}/disputes"
        actor: CardHolder
        preconditions:
          - "dispute eligibility rules pass (see validations)"
        side_effects:
          - "pre_dispute_status = POSTED"
      - from: SETTLED
        to: UNDER_DISPUTE
        trigger: "POST /api/transactions/{id}/disputes"
        actor: CardHolder
        preconditions:
          - "transaction must not be linked to a MerchantSettlement in APPROVED | PAID (ERR_TX_NOT_DISPUTABLE)"
        side_effects:
          - "pre_dispute_status = SETTLED"
      - from: UNDER_DISPUTE
        to: REVERSED
        trigger: "POST /api/disputes/{id}/resolve with outcome=FOR_CARDHOLDER"
        actor: FraudAnalyst
        preconditions: []
        side_effects:
          - "PURCHASE_REVERSAL LedgerEntry posted only when the dispute never received provisional credit (otherwise the already-posted PROVISIONAL_CREDIT becomes permanent); account balance_cents recomputed"
      - from: UNDER_DISPUTE
        to: POSTED
        trigger: "POST /api/disputes/{id}/resolve with outcome=FOR_MERCHANT, or POST /api/disputes/{id}/withdraw, when pre_dispute_status == POSTED"
        actor: FraudAnalyst | CardHolder
        preconditions: []
        side_effects:
          - "PROVISIONAL_CLAWBACK posted when provisional credit had been granted; on resolve FOR_MERCHANT with reason_code=UNAUTHORIZED_USE, holder.fraud_strike_count += 1 (may trigger suspension cascade)"
      - from: UNDER_DISPUTE
        to: SETTLED
        trigger: "POST /api/disputes/{id}/resolve with outcome=FOR_MERCHANT, or POST /api/disputes/{id}/withdraw, when pre_dispute_status == SETTLED"
        actor: FraudAnalyst | CardHolder
        preconditions: []
        side_effects:
          - "Same clawback and strike side effects as the POSTED restoration"

  - entity: Dispute
    initial_state: OPENED
    terminal_states: [RESOLVED_FOR_CARDHOLDER, RESOLVED_FOR_MERCHANT, WITHDRAWN]
    transitions:
      - from: OPENED
        to: PROVISIONAL_CREDIT_GRANTED
        trigger: "POST /api/disputes/{id}/grant-provisional-credit"
        actor: FraudAnalyst
        preconditions:
          - "transaction.tender_type != MEAL_SWIPE (ERR_CREDIT_NOT_APPLICABLE)"
        side_effects:
          - "PROVISIONAL_CREDIT LedgerEntry of the full transaction amount posted to the transaction's account; provisional_credit_cents set; granter_analyst_id set"
      - from: OPENED
        to: RESOLVED_FOR_CARDHOLDER
        trigger: "POST /api/disputes/{id}/resolve outcome=FOR_CARDHOLDER"
        actor: FraudAnalyst
        preconditions: []
        side_effects:
          - "resolver_analyst_id set; transaction -> REVERSED with PURCHASE_REVERSAL posted"
      - from: PROVISIONAL_CREDIT_GRANTED
        to: RESOLVED_FOR_CARDHOLDER
        trigger: "POST /api/disputes/{id}/resolve outcome=FOR_CARDHOLDER"
        actor: FraudAnalyst
        preconditions:
          - "resolver X-User-ID != granter_analyst_id (ERR_SOD_RESOLVER_IS_GRANTER)"
        side_effects:
          - "Transaction -> REVERSED; provisional credit becomes permanent (no reversal entry posted)"
      - from: OPENED
        to: RESOLVED_FOR_MERCHANT
        trigger: "POST /api/disputes/{id}/resolve outcome=FOR_MERCHANT"
        actor: FraudAnalyst
        preconditions: []
        side_effects:
          - "Transaction restored to pre_dispute_status; UNAUTHORIZED_USE adds a fraud strike"
      - from: PROVISIONAL_CREDIT_GRANTED
        to: RESOLVED_FOR_MERCHANT
        trigger: "POST /api/disputes/{id}/resolve outcome=FOR_MERCHANT"
        actor: FraudAnalyst
        preconditions:
          - "resolver X-User-ID != granter_analyst_id (ERR_SOD_RESOLVER_IS_GRANTER)"
        side_effects:
          - "PROVISIONAL_CLAWBACK posted; transaction restored to pre_dispute_status; UNAUTHORIZED_USE adds a fraud strike"
      - from: OPENED
        to: WITHDRAWN
        trigger: "POST /api/disputes/{id}/withdraw"
        actor: CardHolder
        preconditions:
          - "caller is the filing holder (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Transaction restored to pre_dispute_status"
      - from: PROVISIONAL_CREDIT_GRANTED
        to: WITHDRAWN
        trigger: "POST /api/disputes/{id}/withdraw"
        actor: CardHolder
        preconditions:
          - "caller is the filing holder"
        side_effects:
          - "PROVISIONAL_CLAWBACK posted; transaction restored to pre_dispute_status"

  - entity: RefundRequest
    initial_state: REQUESTED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /api/refund-requests/{id}/approve"
        actor: BursarOffice
        preconditions:
          - "approver X-User-ID != account.last_adjusted_by (ERR_SOD_ADJUSTER_CANNOT_APPROVE)"
        side_effects:
          - "approved_by set"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /api/refund-requests/{id}/deny"
        actor: BursarOffice
        preconditions:
          - "denial_reason present (ERR_VALIDATION otherwise)"
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /api/refund-requests/{id}/pay"
        actor: BursarOffice
        preconditions:
          - "payer X-User-ID != approved_by (ERR_SOD_PAYER_IS_APPROVER)"
        side_effects:
          - "REFUND_PAYOUT LedgerEntry of amount_cents posted to the account; account -> REFUNDED when balance_cents reaches 0, otherwise remains CLOSE_PENDING (residual from excluded provisional credits)"

  - entity: AccessGrant
    initial_state: ACTIVE
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/access-grants/{id}/suspend, or cascade from card report-lost / report-stolen"
        actor: SecurityOfficer | system
        preconditions: []
        side_effects:
          - "suspended_reason = MANUAL | CARD_FROZEN by origin"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/access-grants/{id}/reinstate, or cascade from card unfreeze"
        actor: SecurityOfficer | system
        preconditions:
          - "card.lifecycle_status == ACTIVE (ERR_CARD_NOT_ACTIVE)"
          - "clock < valid_until (grant EXPIRED otherwise)"
        side_effects:
          - "suspended_reason cleared"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /api/access-grants/{id}/revoke, or cascade from card deactivate/replacement or zone decommission"
        actor: SecurityOfficer | system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /api/access-grants/{id}/revoke, or cascade"
        actor: SecurityOfficer | system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: evaluated when an access attempt or grant action touches this grant with clock >= valid_until"
        actor: system
        preconditions:
          - "clock >= valid_until"
        side_effects: []
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system: same lazy evaluation as from ACTIVE"
        actor: system
        preconditions:
          - "clock >= valid_until"
        side_effects: []

  - entity: Merchant
    initial_state: PENDING_CONTRACT
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_CONTRACT
        to: ACTIVE
        trigger: "POST /api/merchants/{id}/activate"
        actor: BursarOffice
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/merchants/{id}/suspend"
        actor: BursarOffice
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/merchants/{id}/activate"
        actor: BursarOffice
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/merchants/{id}/terminate"
        actor: BursarOffice
        preconditions:
          - "No MerchantSettlement in DRAFT | SUBMITTED | APPROVED for this merchant (ERR_SETTLEMENTS_OUTSTANDING)"
        side_effects: []
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /api/merchants/{id}/terminate"
        actor: BursarOffice
        preconditions:
          - "No MerchantSettlement in DRAFT | SUBMITTED | APPROVED for this merchant"
        side_effects: []

  - entity: MerchantSettlement
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/settlements/{id}/submit"
        actor: MerchantUser | BursarOffice
        preconditions: []
        side_effects:
          - "merchant_settlement_sweep runs: eligible transactions linked (settled_in_settlement_id set), gross/commission/net/transaction_count computed; carried_from_settlement_id set when the sweep picks up transactions previously excluded from an earlier settlement by an open dispute"
          - "submitted_by set"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /api/settlements/{id}/submit (resubmission cycle)"
        actor: MerchantUser | BursarOffice
        preconditions: []
        side_effects:
          - "Fresh sweep replaces prior computed values; rejection_reason cleared; submitted_by updated"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/settlements/{id}/approve"
        actor: BursarOffice
        preconditions:
          - "approver X-User-ID != submitted_by (ERR_SOD_APPROVER_IS_SUBMITTER)"
        side_effects:
          - "approved_by set"
          - "Every linked CardTransaction -> SETTLED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/settlements/{id}/reject"
        actor: BursarOffice
        preconditions:
          - "rejection_reason present (ERR_VALIDATION otherwise)"
        side_effects:
          - "Linked transactions unlinked (settled_in_settlement_id -> null); they become sweep-eligible again"
      - from: APPROVED
        to: PAID
        trigger: "POST /api/settlements/{id}/pay"
        actor: BursarOffice
        preconditions:
          - "payer X-User-ID != approved_by (ERR_SOD_PAYER_IS_APPROVER)"
        side_effects:
          - "paid_by set"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: change-request-stale-enrollment
    parent_entity: MealPlanEnrollment
    write_endpoint: "POST /api/enrollments/{id}/change-requests"
    occ_field: "expected_enrollment_version"
    description: |
      Creating a PlanChangeRequest against a MealPlanEnrollment whose version has
      advanced since the client last observed it is rejected. This captures the
      case where a swipe purchase (or any other mutation) advanced the enrollment
      after the client computed their intent, so the proration basis the client
      saw is stale and the request must be re-based on a fresh read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: account-adjustment-stale-version
    parent_entity: DecliningBalanceAccount
    write_endpoint: "POST /api/accounts/{id}/adjustments"
    occ_field: "expected_account_version"
    description: |
      Posting a manual adjustment against a DecliningBalanceAccount whose version
      has advanced since the client last observed it is rejected, because the
      adjustment decision was made against a stale balance_cents.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: card-replacement-stale-version
    parent_entity: CampusCard
    write_endpoint: "POST /api/cards/{id}/replacement"
    occ_field: "expected_card_version"
    description: |
      Issuing a replacement for a CampusCard whose version has advanced since the
      client last observed it is rejected, because an intervening photo review or
      report changed the fraud-relevant state the fee schedule depends on.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (11 rules)
# =============================================================================
calculations:
  - name: enrollment_activation_pricing
    trigger: "MealPlanEnrollment activation: at POST /api/card-holders/{id}/enrollments when term OPEN, or at POST /api/terms/{id}/open for ASSIGNED enrollments"
    algorithm: forward_looking
    formula: |
      Let T = term.total_weeks.
      WEEKLY variant (term.proration_mode == WEEKLY):
        remaining_weeks = T - term.current_week_index + 1   (current week included)
        charge_cents = round_half_up(plan.price_cents * remaining_weeks / T)
        grant_cents  = round_half_up(plan.dining_dollar_allocation_cents * remaining_weeks / T)
      DAILY variant (term.proration_mode == DAILY):
        total_days     = (term.end_date.date - term.start_date.date).days + 1
        days_consumed  = max(0, (clock.date - term.start_date.date).days)
        remaining_days = total_days - days_consumed
        charge_cents = round_half_up(plan.price_cents * remaining_days / total_days)
        grant_cents  = round_half_up(plan.dining_dollar_allocation_cents * remaining_days / total_days)
      Evaluation order is pinned: charge_cents first, then grant_cents. Each component
      is rounded exactly once, independently, to whole cents. A zero grant_cents posts
      no ALLOCATION_GRANT entry (ledger entries always carry amount_cents > 0).
    input_set: "The enrolling MealPlan (any PUBLISHED plan), the Term, and the logical clock"
    precision: "integer cents, round_half_up, per-component rounding"
    variants:
      - name: WEEKLY
        when: "term.proration_mode == WEEKLY"
        difference: "Prorates by whole week indexes; the current week always counts as fully remaining"
      - name: DAILY
        when: "term.proration_mode == DAILY"
        difference: "Prorates by calendar days elapsed since term start; mid-week activations charge less than WEEKLY"

  - name: plan_change_proration
    trigger: "POST /api/change-requests/{id}/approve (computation), POST /api/terms/{id}/advance-week (posting at execution)"
    algorithm: constraint_propagation
    formula: |
      Let T = term.total_weeks, W = effective_week_index (= term.current_week_index + 1 at approval),
      P_old = old plan price_cents, P_new = new plan price_cents, A_new = new plan
      dining_dollar_allocation_cents, C_old = old enrollment.charge_cents.
      Evaluation order is MANDATORY and breaks the apparent circle between
      "credit from old plan" and "charge owed on new plan":
        (1) old_earned: WEEKLY -> round_half_up(P_old * (W-1) / T)
                         DAILY  -> round_half_up(P_old * days_consumed / total_days)
                                   where days_consumed = (clock.date - term.start_date.date).days,
                                   total_days = (term.end_date.date - term.start_date.date).days + 1
        (2) credit_from_old = C_old - old_earned            (may be zero, never negative here)
        (3) new_due:    WEEKLY -> round_half_up(P_new * (T - W + 1) / T)
                         DAILY  -> round_half_up(P_new * (total_days - days_consumed) / total_days)
        (4) charge_delta_cents = new_due - credit_from_old
        (5) funding_delta_cents: WEEKLY -> round_half_up(A_new * (T - W + 1) / T)
                                  DAILY  -> round_half_up(A_new * (total_days - days_consumed) / total_days)
      The old plan's already-granted dining allocation is NOT clawed back.
      Posting at execution: charge_delta > 0 -> PRORATION_DEBIT on holder CAMPUS_CASH
      (auto-created OPEN when absent); < 0 -> PRORATION_CREDIT of |delta|; == 0 -> no entry.
      funding_delta > 0 -> ALLOCATION_GRANT on the term DINING_DOLLARS account.
    input_set: "Old enrollment + its plan, the new plan, the Term, the logical clock"
    precision: "integer cents, round_half_up, per-component rounding in the pinned order"
    variants:
      - name: WEEKLY
        when: "term.proration_mode == WEEKLY"
        difference: "Whole-week proration keyed on effective_week_index"
      - name: DAILY
        when: "term.proration_mode == DAILY"
        difference: "Calendar-day proration keyed on the approval date; produces different deltas than WEEKLY for identical plans and timing"

  - name: replacement_fee_schedule
    trigger: "POST /api/cards/{id}/replacement (computed on the NEW card as replacement_fee_cents)"
    algorithm: tiered_pricing
    formula: |
      Let ordinal = 1 + count of the holder's other CampusCards already in REPLACED,
      reason in {LOST, STOLEN, DAMAGED},
      police = police_report_number present on the stolen report OR on the replacement payload,
      surrendered = surrendered payload flag == true.
      Tier schedule TIER_FEE(ordinal): 1 -> 2500, 2 -> 3500, >= 3 -> 5000.
      Rules applied IN ORDER:
        (1) FACULTY / STAFF with ordinal == 1: fee = 0 (free first replacement; the ordinal is still consumed)
        (2) STOLEN with police == true: fee = 0
        (3) STOLEN with police == false: fee = TIER_FEE(ordinal) * STOLEN_SURCHARGE_MULTIPLIER
        (4) DAMAGED with surrendered == true: fee = max(0, TIER_FEE(ordinal) - DAMAGED_SURRENDER_DISCOUNT)
        (5) otherwise (LOST, or DAMAGED without surrender): fee = TIER_FEE(ordinal)
      Fee posts as a FEE LedgerEntry to the holder's CAMPUS_CASH account; FEE entries
      may drive balance_cents negative (purchases may not).
    input_set: "Holder (holder_type, existing REPLACED cards), replacement payload, old card's stolen_police_report_number"
    constants:
      TIER_FEE_1: 2500
      TIER_FEE_2: 3500
      TIER_FEE_3_PLUS: 5000
      STOLEN_SURCHARGE_MULTIPLIER: 2
      DAMAGED_SURRENDER_DISCOUNT: 1500
    precision: "integer cents; no rounding needed"

  - name: merchant_settlement_sweep
    trigger: "POST /api/settlements/{id}/submit"
    algorithm: aggregation
    formula: |
      Sweep set S = merchant's CardTransactions with created_at in [period_start, period_end]
      (closed-closed, compared at timestamp precision), status == POSTED,
      settled_in_settlement_id IS NULL. Transactions in UNDER_DISPUTE are excluded
      and become eligible for a later sweep only after resolution restores them
      (see dispute_carryover_sweep).
      gross_cents = sum(amount_cents over S)
      PER_TRANSACTION variant (merchant.commission_mode == PER_TRANSACTION):
        commission_cents = sum over S of round_half_up(amount_i * commission_bps / 10000)
        (round each transaction's commission to whole cents FIRST, then sum — order pinned)
      AGGREGATE variant (merchant.commission_mode == AGGREGATE):
        commission_cents = round_half_up(gross_cents * commission_bps / 10000)
        (sum first, then round once)
      net_cents = gross_cents - commission_cents
      transaction_count = |S|
      carried_from_settlement_id = the id of the most recent prior non-REJECTED settlement
      of the same merchant whose excluded disputed transactions entered S; null when none did.
    input_set: "Merchant's transactions in the period window, merchant.commission_bps, merchant.commission_mode"
    precision: "integer cents, round_half_up; rounding order is variant-defining"
    variants:
      - name: PER_TRANSACTION
        when: "merchant.commission_mode == PER_TRANSACTION"
        difference: "Per-transaction rounding accumulates rounding-down on small amounts"
      - name: AGGREGATE
        when: "merchant.commission_mode == AGGREGATE"
        difference: "Single rounding on the gross; differs from PER_TRANSACTION whenever per-transaction fractions sum across a half-cent boundary"

  - name: term_end_refund_amount
    trigger: "POST /api/accounts/{id}/refund-requests"
    algorithm: waterfall_allocation
    formula: |
      unresolved_provisional = sum of provisional_credit_cents over the holder's Disputes
        in {OPENED, PROVISIONAL_CREDIT_GRANTED} whose transaction debited THIS account.
      Variant selection (deterministic):
        FULL_BALANCE is selectable only when unresolved_provisional == 0;
        otherwise the request is computed under AUTO_EXCLUDING_PROVISIONAL.
      AUTO_EXCLUDING_PROVISIONAL: amount_cents = max(0, balance_cents - unresolved_provisional)
      FULL_BALANCE:                 amount_cents = balance_cents
      If amount_cents < MIN_REFUND_CENTS the request is rejected ERR_REFUND_BELOW_MINIMUM.
      At pay time a REFUND_PAYOUT of amount_cents is posted; when a residual remains
      (excluded provisional credits), the account stays CLOSE_PENDING and a later
      refund request may capture the residue once disputes resolve.
    input_set: "Account balance_cents, holder disputes linked to this account"
    constants:
      MIN_REFUND_CENTS: 1000
    precision: "integer cents"
    variants:
      - name: AUTO_EXCLUDING_PROVISIONAL
        when: "unresolved provisional credits exist on the account"
        difference: "Subtracts unresolved provisional credits; the only selectable variant in that state"
      - name: FULL_BALANCE
        when: "no unresolved provisional credits"
        difference: "Refunds the full balance; identical to AUTO only because the subtraction term is zero"

  - name: enrollment_cancellation_credit
    trigger: "MealPlanEnrollment ACTIVE -> CANCELLED (admin cancel, or withdraw/graduate cascade)"
    algorithm: forward_looking
    formula: |
      Let T = term.total_weeks, P = plan.price_cents, C = enrollment.charge_cents.
      consumed: WEEKLY -> max(0, term.current_week_index - enrollment.enrolled_week_index)
                DAILY  -> (clock.date - enrollment.activated_at.date).days
      earned: WEEKLY -> round_half_up(P * consumed / T)
              DAILY  -> round_half_up(P * min(consumed, total_days) / total_days)
                         where total_days = (term.end_date.date - term.start_date.date).days + 1
      credit_cents = C - earned   (>= 0 in practice; pin: floor at 0)
      Posted as a PRORATION_CREDIT LedgerEntry of credit_cents to the enrollment-linked
      DINING_DOLLARS account when credit_cents > 0; the account balance_cents is recomputed.
      Cancelling an ASSIGNED enrollment posts nothing (nothing was charged).
    input_set: "The cancelled enrollment, its plan, its term, the logical clock"
    precision: "integer cents, round_half_up"
    variants:
      - name: WEEKLY
        when: "term.proration_mode == WEEKLY"
        difference: "Whole weeks elapsed since activation count as consumed; the current week is not charged"
      - name: DAILY
        when: "term.proration_mode == DAILY"
        difference: "Calendar days since activated_at count as consumed"

  - name: weekly_swipe_reset
    trigger: "POST /api/terms/{id}/advance-week (step 2)"
    algorithm: threshold
    formula: |
      For every MealPlanEnrollment of the term with status == ACTIVE:
        swipes_used_this_week = 0
      Swipe admission rule on POST /api/transactions (tender MEAL_SWIPE):
        allowed when is_unlimited_swipes == true
                 OR swipes_used_this_week < weekly_swipe_allowance   (strict <; equality rejects)
      A plan with weekly_swipe_allowance == 0 and is_unlimited_swipes == false rejects every swipe.
    input_set: "ACTIVE enrollments of the term"
    precision: "integer counts; boundary is strict less-than"

  - name: provisional_daily_cap
    trigger: "POST /api/transactions when the card is_provisional == true and tender_type in {DINING_DOLLARS, CAMPUS_CASH}"
    algorithm: threshold
    formula: |
      day_total = sum of amount_cents over the card's PURCHASE LedgerEntries (both account
      types) whose created_at falls on the same UTC calendar date as the clock.
      The purchase is admitted only when day_total + amount_cents <= PROVISIONAL_DAILY_CAP_CENTS
      (equality admitted); otherwise ERR_PROVISIONAL_DAILY_CAP.
    input_set: "Card's same-day PURCHASE ledger entries"
    constants:
      PROVISIONAL_DAILY_CAP_CENTS: 2500
    precision: "integer cents; boundary is inclusive at the cap"

  - name: fraud_strike_escalation
    trigger: "report-stolen (+1 always); dispute resolved FOR_MERCHANT with reason_code=UNAUTHORIZED_USE (+1)"
    algorithm: threshold
    formula: |
      On each strike event: holder.fraud_strike_count += 1.
      When fraud_strike_count >= FRAUD_SUSPENSION_THRESHOLD (boundary inclusive: exactly 3 suspends):
        holder.status -> SUSPENDED and holder.fraud_flag = true, firing the suspension cascade.
      fraud-review resets fraud_strike_count to 0 and clears fraud_flag.
    input_set: "Holder strike events"
    constants:
      FRAUD_SUSPENSION_THRESHOLD: 3
    precision: "integer count; threshold comparison is >="

  - name: ledger_balance_recompute
    trigger: "after every LedgerEntry insertion"
    algorithm: projection
    formula: |
      Direction map (pinned): credits = {FUND, ALLOCATION_GRANT, PRORATION_CREDIT,
      PROVISIONAL_CREDIT, ADJUSTMENT_CREDIT, PURCHASE_REVERSAL};
      debits = {PURCHASE, FEE, PRORATION_DEBIT, ADJUSTMENT_DEBIT, PROVISIONAL_CLAWBACK,
      REFUND_PAYOUT, FORFEIT}.
      balance_cents = sum(+amount for credits) - sum(+amount for debits), replayed in
      (created_at ASC, entry_sequence ASC) order; entry.running_balance_cents stores the
      balance immediately after that entry.
      INVARIANT (compensating-action): for every account and at all times,
        balance_cents == signed ledger sum;
      a PURCHASE of X paired with its PURCHASE_REVERSAL of X (direct or via permanent
      provisional credit) leaves balance_cents identical to before the purchase.
      Only FEE, PRORATION_DEBIT, and ADJUSTMENT_DEBIT entries may drive balance_cents negative.
    input_set: "All LedgerEntry rows of the account"
    precision: "integer cents"

  - name: dispute_carryover_sweep
    trigger: "merchant_settlement_sweep at submit; dispute resolution"
    algorithm: chronological
    formula: |
      A transaction UNDER_DISPUTE at submit time is excluded from that settlement's sweep.
      When its dispute resolves FOR_MERCHANT or is WITHDRAWN, the transaction returns to
      pre_dispute_status and becomes a CARRIED transaction: it is included in the merchant's
      NEXT submit sweep regardless of that settlement's period (the carryover overrides the
      period filter for carried transactions only); entering such a sweep sets
      carried_from_settlement_id on the new settlement to the settlement that excluded it.
      A transaction resolved FOR_CARDHOLDER becomes REVERSED and never settles.
      INVARIANT (compensating-action): for every merchant,
        sum(gross_cents over all non-REJECTED settlements)
          + sum(amount_cents over transactions POSTED and never swept)
        == sum(amount_cents over all merchant transactions not in REVERSED);
      a dispute exclusion followed by a later carryover sweep leaves the combined gross unchanged.
    input_set: "Merchant transactions, disputes, settlements"
    precision: "integer cents"

  - name: access_decision_selector
    trigger: "POST /api/access-events"
    algorithm: constraint_propagation
    formula: |
      Evaluation order (each DENIED outcome is recorded on the AccessEvent, not an API error):
        (1) zone.status == ACTIVE else DENIED ZONE_DECOMMISSIONED
        (2) card.lifecycle_status == ACTIVE else DENIED CARD_NOT_ACTIVE
            (a card with clock >= expires_at transitions to EXPIRED first)
        (3) card.is_provisional == false else DENIED CARD_PROVISIONAL
        (4) grant candidate set = AccessGrants with card_id, zone_id, status == ACTIVE,
            valid_from <= attempted_at < valid_until (half-open);
            ranking: valid_from DESC, tie-break created_at ASC;
            empty set -> DENIED NO_ACTIVE_GRANT (grant_id null)
        (5) clearance ordinal(grant.clearance) >= ordinal(zone.security_level)
            else DENIED INSUFFICIENT_CLEARANCE (grant_id recorded)
        (6) attempted_at matches some access window: day_of_week equal AND
            start_minute <= minute_of_day < end_minute (half-open)
            else DENIED OUTSIDE_SCHEDULE (grant_id recorded)
        (7) otherwise GRANTED, grant_id recorded.
    input_set: "Card, zone, grants for (card, zone), logical clock"
    precision: "minute precision on schedule windows; datetime precision on validity"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role must be a declared role"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Entity-backed callers (CardHolder, MerchantUser) act only on resources they own: CardHolder.id == holder linkage of the target; MerchantUser.id == merchant_id of the target; list filters naming another holder/merchant id are equally rejected"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "owner-scoped endpoints (report-lost/stolen/unfreeze, photos, change-requests create/withdraw, funding, refund create, disputes create/withdraw, merchant settlement create/submit, owner reads)"
  - priority: 4
    category: existence
    check: "Request body well-formed: required fields present, types correct, enum values in range, amount_cents > 0 (== 0 exactly for MEAL_SWIPE), end after start, dates parseable; rejection_reason / denial_reason present when required by the action"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 5
    category: existence
    check: "Path identifiers resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 6
    category: existence
    check: "Body-referenced ids exist (plan_id, term_id, zone_id, card_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with body references"
  - priority: 7
    category: existence
    check: "Idempotency: an idempotency_key seen before with an identical payload replays the original 201 response; seen before with a divergent payload is rejected"
    error_id: ERR_IDEMPOTENCY_CONFLICT
    http_status: 409
    applies_to: "POST /api/transactions, POST /api/accounts/{id}/funding"
  - priority: 8
    category: state
    check: "Target resource state permits the requested transition (per state machines; includes OCC expected_*_version match, terminal-state lockout, invalid-from rejection)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 9
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/enrollments/{id}/change-requests, POST /api/accounts/{id}/adjustments, POST /api/cards/{id}/replacement"
  - priority: 10
    category: state
    check: "Cross-entity referenced state: term OPEN for enrollment activation / change approval (ERR_TERM_NOT_OPEN), term CLOSED-era rules, card ACTIVE for grant reinstate and transactions (ERR_CARD_NOT_ACTIVE, ERR_CARD_FROZEN for LOST_FROZEN/STOLEN_FROZEN), photo approved for non-provisional activation (ERR_PHOTO_NOT_APPROVED), plan PUBLISHED (ERR_PLAN_NOT_PUBLISHED), merchant ACTIVE for transactions and settlement creation (ERR_MERCHANT_NOT_ACTIVE), enrollment ACTIVE for swipes and changes (ERR_ENROLLMENT_NOT_ACTIVE), account OPEN for funding/purchases (ERR_ACCOUNT_FROZEN), account CLOSE_PENDING for refund requests (ERR_ACCOUNT_NOT_CLOSABLE), holder ACTIVE for activation/unfreeze/enrollment (ERR_HOLDER_NOT_ACTIVE)"
    error_id: "ERR_TERM_NOT_OPEN | ERR_CARD_NOT_ACTIVE | ERR_CARD_FROZEN | ERR_PHOTO_NOT_APPROVED | ERR_PLAN_NOT_PUBLISHED | ERR_MERCHANT_NOT_ACTIVE | ERR_ENROLLMENT_NOT_ACTIVE | ERR_ACCOUNT_FROZEN | ERR_ACCOUNT_NOT_CLOSABLE | ERR_HOLDER_NOT_ACTIVE"
    http_status: 409
    applies_to: "action endpoints with cross-entity preconditions"
  - priority: 11
    category: business_safety
    check: "Fraud and segregation-of-duties: suspended / fraud-flagged holders blocked from value-extending actions (ERR_FRAUD_HOLD); refund approver != account.last_adjusted_by (ERR_SOD_ADJUSTER_CANNOT_APPROVE); refund payer != approved_by (ERR_SOD_PAYER_IS_APPROVER); settlement approver != submitted_by (ERR_SOD_APPROVER_IS_SUBMITTER); settlement payer != approved_by (ERR_SOD_PAYER_IS_APPROVER); dispute resolver != granter_analyst_id (ERR_SOD_RESOLVER_IS_GRANTER); provisional credit only for non-swipe tenders (ERR_CREDIT_NOT_APPLICABLE)"
    error_id: "ERR_FRAUD_HOLD | ERR_SOD_ADJUSTER_CANNOT_APPROVE | ERR_SOD_PAYER_IS_APPROVER | ERR_SOD_APPROVER_IS_SUBMITTER | ERR_SOD_RESOLVER_IS_GRANTER | ERR_CREDIT_NOT_APPLICABLE"
    http_status: 403
    applies_to: "refund approve/pay, settlement approve/pay, dispute grant/resolve, holder value actions"
  - priority: 12
    category: business_temporal
    check: "Windows: plan change request/approval only while clock <= add_drop_deadline (ERR_PLAN_CHANGE_WINDOW_CLOSED); dispute filing within DISPUTE_WINDOW_DAYS of transaction created_at (ERR_DISPUTE_WINDOW_CLOSED); term open only at/after start_date (ERR_TERM_NOT_YET_STARTED); close only at/after end_date (ERR_TERM_NOT_ENDED); advance-week bounded by total_weeks (ERR_TERM_WEEKS_EXHAUSTED); change effective week within term (ERR_PLAN_CHANGE_EFFECTIVE_WEEK_INVALID)"
    error_id: "ERR_PLAN_CHANGE_WINDOW_CLOSED | ERR_DISPUTE_WINDOW_CLOSED | ERR_TERM_NOT_YET_STARTED | ERR_TERM_NOT_ENDED | ERR_TERM_WEEKS_EXHAUSTED | ERR_PLAN_CHANGE_EFFECTIVE_WEEK_INVALID"
    http_status: 422
    applies_to: "time-gated endpoints"
  - priority: 13
    category: business_constraint
    check: "Uniqueness and eligibility: natural keys unique (ERR_DUPLICATE_NATURAL_KEY); at most one non-terminal card per holder (ERR_ACTIVE_CARD_EXISTS); at most one ASSIGNED|ACTIVE enrollment per (holder, term) (ERR_ENROLLMENT_OVERLAP); housing/holder-type plan eligibility (ERR_HOUSING_INELIGIBLE_FOR_PLAN, ERR_HOLDER_TYPE_INELIGIBLE_FOR_PLAN); new plan differs from current (ERR_VALIDATION); no pending change request (ERR_PENDING_CHANGE_EXISTS); no pending refund request (ERR_PENDING_REFUND_EXISTS); no open dispute per transaction (ERR_DISPUTE_ALREADY_OPEN); account uniqueness per (holder, type, term) (ERR_ACCOUNT_UNIQUENESS); grant half-open overlap per (card, zone) (ERR_GRANT_OVERLAP); settlement closed-closed period overlap per merchant (ERR_SETTLEMENT_PERIOD_OVERLAP); settlement period within term bounds (ERR_PERIOD_OUTSIDE_TERM); transaction not locked in an APPROVED|PAID settlement (ERR_TX_NOT_DISPUTABLE); swipe tender disputes ineligible for provisional credit covered at 11"
    error_id: "ERR_DUPLICATE_NATURAL_KEY | ERR_ACTIVE_CARD_EXISTS | ERR_ENROLLMENT_OVERLAP | ERR_HOUSING_INELIGIBLE_FOR_PLAN | ERR_HOLDER_TYPE_INELIGIBLE_FOR_PLAN | ERR_PENDING_CHANGE_EXISTS | ERR_PENDING_REFUND_EXISTS | ERR_DISPUTE_ALREADY_OPEN | ERR_ACCOUNT_UNIQUENESS | ERR_GRANT_OVERLAP | ERR_SETTLEMENT_PERIOD_OVERLAP | ERR_PERIOD_OUTSIDE_TERM | ERR_TX_NOT_DISPUTABLE"
    http_status: 409
    applies_to: "creation and linking endpoints"
  - priority: 14
    category: business_fiscal
    check: "Funds and thresholds: purchase amount <= account balance (ERR_INSUFFICIENT_FUNDS; equality admitted); swipe availability (ERR_SWIPES_EXHAUSTED); provisional daily cap (ERR_PROVISIONAL_DAILY_CAP); refund amount >= MIN_REFUND_CENTS (ERR_REFUND_BELOW_MINIMUM)"
    error_id: "ERR_INSUFFICIENT_FUNDS | ERR_SWIPES_EXHAUSTED | ERR_PROVISIONAL_DAILY_CAP | ERR_REFUND_BELOW_MINIMUM"
    http_status: 402
    applies_to: "value-moving endpoints"
    note: "http per specific error: ERR_INSUFFICIENT_FUNDS 402; ERR_SWIPES_EXHAUSTED / ERR_PROVISIONAL_DAILY_CAP / ERR_REFUND_BELOW_MINIMUM 422"

# =============================================================================
# §1.5 API Endpoint Table (91 endpoints)
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the logical clock. Server startup default (before any set call) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Lazy EXPIRED evaluation for cards/grants occurs on their next touch"]

  # --- CardHolder ---
  - method: POST
    path: "/api/card-holders"
    description: "Register a card holder"
    roles: [CardOfficeAdmin]
    code: 201
    input: [university_id, full_name, email, holder_type, housing_status]
    output: CardHolder
    side_effects: []
  - method: GET
    path: "/api/card-holders"
    description: "List card holders"
    roles: [PlatformAdmin, CardOfficeAdmin, DiningServicesManager, BursarOffice, FraudAnalyst, SecurityOfficer]
    code: 200
    input: ["holder_type?", "status?", "housing_status?", "university_id?", "limit?", "offset?"]
    output: CardHolder[]
    side_effects: []
  - method: GET
    path: "/api/card-holders/{id}"
    description: "Get one card holder; CardHolder caller may read only own record"
    roles: [PlatformAdmin, CardOfficeAdmin, DiningServicesManager, BursarOffice, FraudAnalyst, SecurityOfficer, CardHolder]
    code: 200
    input: []
    output: CardHolder
    side_effects: []
  - method: POST
    path: "/api/card-holders/{id}/suspend"
    description: "Manually suspend a holder"
    roles: [CardOfficeAdmin, FraudAnalyst]
    code: 200
    input: []
    output: CardHolder
    side_effects: ["increments CardHolder.version by 1", "suspension cascade: accounts FROZEN (HOLDER_SUSPENDED), non-terminal cards DEACTIVATED, their grants REVOKED"]
  - method: POST
    path: "/api/card-holders/{id}/reinstate"
    description: "Reinstate a SUSPENDED or WITHDRAWN holder to ACTIVE"
    roles: [CardOfficeAdmin]
    code: 200
    input: []
    output: CardHolder
    side_effects: ["increments CardHolder.version by 1", "accounts FROZEN with HOLDER_SUSPENDED -> OPEN"]
  - method: POST
    path: "/api/card-holders/{id}/withdraw"
    description: "Withdraw a holder (mid-term departure)"
    roles: [CardOfficeAdmin]
    code: 200
    input: []
    output: CardHolder
    side_effects: ["increments CardHolder.version by 1", "enrollments CANCELLED with proration credit cascade", "accounts OPEN|FROZEN -> CLOSE_PENDING", "pending change requests VOID (ENROLLMENT_CANCELLED)"]
  - method: POST
    path: "/api/card-holders/{id}/graduate"
    description: "Graduate a holder (terminal)"
    roles: [CardOfficeAdmin]
    code: 200
    input: []
    output: CardHolder
    side_effects: ["increments CardHolder.version by 1", "same cascades as withdraw"]
  - method: POST
    path: "/api/card-holders/{id}/fraud-review"
    description: "Clear fraud_flag and reset fraud_strike_count to 0"
    roles: [FraudAnalyst]
    code: 200
    input: ["notes?"]
    output: CardHolder
    side_effects: ["increments CardHolder.version by 1", "accounts FROZEN with HOLDER_SUSPENDED -> OPEN"]

  # --- CampusCard ---
  - method: POST
    path: "/api/card-holders/{id}/cards"
    description: "Issue a card; rejected when the holder already has a non-terminal card (ERR_ACTIVE_CARD_EXISTS)"
    roles: [CardOfficeAdmin]
    code: 201
    input: [expires_at]
    output: CampusCard
    side_effects: []
  - method: GET
    path: "/api/cards"
    description: "List cards with filters"
    roles: [CardOfficeAdmin, FraudAnalyst, SecurityOfficer]
    code: 200
    input: ["holder_id?", "lifecycle_status?", "replaced_by_card_id?", "limit?", "offset?"]
    output: CampusCard[]
    side_effects: []
  - method: GET
    path: "/api/cards/{id}"
    description: "Get one card"
    roles: [CardOfficeAdmin, FraudAnalyst, SecurityOfficer, CardHolder]
    code: 200
    input: []
    output: CampusCard
    side_effects: []
  - method: POST
    path: "/api/cards/{id}/activate"
    description: "Activate a PENDING_PHOTO card; allow_provisional=true permits activation without approved photo"
    roles: [CardOfficeAdmin]
    code: 200
    input: ["allow_provisional?"]
    output: CampusCard
    side_effects: ["increments CampusCard.version by 1", "is_provisional set per photo_status"]
  - method: POST
    path: "/api/cards/{id}/report-lost"
    description: "Owner reports card lost; freezes card and its door grants"
    roles: [CardHolder]
    code: 200
    input: []
    output: CampusCard
    side_effects: ["increments CampusCard.version by 1", "grants ACTIVE -> SUSPENDED (CARD_FROZEN)"]
  - method: POST
    path: "/api/cards/{id}/report-stolen"
    description: "Owner reports card stolen; adds fraud strike and freezes accounts"
    roles: [CardHolder]
    code: 200
    input: ["police_report_number?"]
    output: CampusCard
    side_effects: ["increments CampusCard.version by 1", "fraud_strike_escalation", "holder accounts OPEN -> FROZEN (CARD_STOLEN)", "grants ACTIVE -> SUSPENDED (CARD_FROZEN)", "possible holder suspension cascade"]
  - method: POST
    path: "/api/cards/{id}/unfreeze"
    description: "Owner recovers a LOST_FROZEN card"
    roles: [CardHolder]
    code: 200
    input: []
    output: CampusCard
    side_effects: ["increments CampusCard.version by 1", "grants SUSPENDED (CARD_FROZEN) -> ACTIVE", "accounts FROZEN (CARD_STOLEN) untouched (stolen cards never unfreeze)"]
  - method: POST
    path: "/api/cards/{id}/replacement"
    description: "Replace a card; OCC-guarded; computes replacement fee and mints successor card"
    roles: [CardOfficeAdmin]
    code: 201
    input: [reason, expected_card_version, "police_report_number?", "surrendered?"]
    output: CampusCard
    side_effects: ["old card -> REPLACED with replaced_by_card_id set", "increments old CampusCard.version by 1", "FEE LedgerEntry posted per replacement_fee_schedule", "old card grants ACTIVE|SUSPENDED -> REVOKED"]
  - method: POST
    path: "/api/cards/{id}/deactivate"
    description: "Permanently deactivate a non-terminal card"
    roles: [CardOfficeAdmin, FraudAnalyst]
    code: 200
    input: []
    output: CampusCard
    side_effects: ["increments CampusCard.version by 1", "grants ACTIVE|SUSPENDED -> REVOKED"]

  # --- PhotoSubmission ---
  - method: POST
    path: "/api/cards/{id}/photos"
    description: "Submit a photo for a card (owner)"
    roles: [CardHolder]
    code: 201
    input: [image_ref]
    output: PhotoSubmission
    side_effects: ["card.photo_status -> PENDING_REVIEW", "increments CampusCard.version by 1"]
  - method: GET
    path: "/api/cards/{id}/photos"
    description: "List a card's photo submissions"
    roles: [CardOfficeAdmin, CardHolder]
    code: 200
    input: ["limit?", "offset?"]
    output: PhotoSubmission[]
    side_effects: []
  - method: POST
    path: "/api/photos/{id}/review"
    description: "Approve or reject the card's latest pending photo submission"
    roles: [CardOfficeAdmin]
    code: 200
    input: [decision, "rejection_reason?"]
    output: PhotoSubmission
    side_effects: ["mirrors decision onto card.photo_status", "clears is_provisional on APPROVED", "increments CampusCard.version by 1"]

  # --- Term ---
  - method: POST
