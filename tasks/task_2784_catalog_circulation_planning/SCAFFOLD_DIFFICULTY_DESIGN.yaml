              as: ListBroker
              captures: { mp1_id: "$.data.id", mp1_status: "$.data.status", mp1_net: "$.data.net_mailable_names" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "RENTAL", prospect_list_rental_id: "${rental_id}", requested_quantity: 25000 }
              as: CirculationPlanner
              captures: { l1_id: "$.data.id", l1_status0: "$.data.status" }
          trigger:
            - call: "POST /catalog-circulation/drops/${d1_id}/allocate"
              payload: {}
              as: CirculationPlanner
              captures: { err_not_netted: "$.data.error_id" }
            - call: "GET /catalog-circulation/circulation-plans/${plan_id}"
              payload: {}
              as: CirculationPlanner
              captures: { plan_v2: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v2}", input_rental_ids: ["${rental_id}"] }
              as: ListBroker
              captures: { mp2_gross: "$.data.gross_input_names", mp2_dupes: "$.data.duplicates_removed", mp2_net: "$.data.net_mailable_names" }
            - call: "POST /catalog-circulation/drops/${d1_id}/allocate"
              payload: {}
              as: CirculationPlanner
              captures: { d1_prov: "$.data.provisional_cost_per_book_cents", d1_planned: "$.data.planned_quantity" }
          assert:
            - "${rental_status_delivered} == DELIVERED and ${rental_net_before} == 0 and ${rental_unit} == 9"
            - "${mp1_status} == COMPLETED and ${mp1_net} == 30000  # a housefile-only universe still yields a completed run"
            - "${l1_status0} == PROPOSED"
            - "BLOCKED by the rental: ${err_not_netted} == ERR_RENTAL_NOT_NETTED with HTTP 409, even though a COMPLETED MergePurgeRun exists for the plan"
            - "BLOCKED by the rental: CirculationLine.${l1_id}.status == PROPOSED with allocated_quantity == 0 and committed_cost_cents == 0"
            - "BLOCKED by the rental: CirculationPlan.${plan_id}.committed_cost_cents == 0 and uncommitted_budget_cents == 20000000  # the whole allocate call was refused, not partially applied"
            - "BLOCKED by the rental: Drop.${d1_id}.planned_quantity == 0 and provisional_cost_per_book_cents == 0"
            - "UNBLOCKED: ${mp2_gross} == 55000 and ${mp2_dupes} == 5000 and ${mp2_net} == 50000  # 2000 bps of R1's 25000 gross names overlap the housefile"
            - "UNBLOCKED: ProspectListRental.${rental_id}.status == NETTED and net_names_delivered == 20000"
            - "UNBLOCKED: MergePurgeRun.${mp1_id}.status == SUPERSEDED  # the first run is displaced by the second"
            - "UNBLOCKED: ${d1_prov} == 236 and ${d1_planned} == 20000  # requested 25000 is capped by the rental's 20000 net names, not by the budget"
            - "UNBLOCKED: CirculationLine.${l1_id}.status == ALLOCATED with unit_cost_cents == 245 (236 + the 9-cent name cost), allocated_quantity == 20000 and committed_cost_cents == 4900000"
            - "UNBLOCKED: CirculationPlan.${plan_id}.committed_cost_cents == 4900000 and uncommitted_budget_cents == 15100000"
            - "both allocate calls are byte-identical, so the difference is attributable only to the rental's status"

      - name: opening_a_matchback_run_requires_its_drop_to_be_mailed
        grounds:
          - state_machines.Drop.measurement_status.PENDING_to_MATCHBACK_OPEN
          - state_machines.Drop.production_status.PRESORTED_to_MAILED
          - errors[ERR_INVALID_DROP_STATE]
          - concurrency_rules[matchback-create-stale-drop]
          - endpoints[POST /catalog-circulation/drops/{id}/matchback-runs]
          - entities.Drop.fields.measurement_status
        distinguishing_aspect: |
          Entity pair = (MatchbackRun, Drop) across the drop's TWO parallel
          dimensions: the child run's creation is guarded by the parent's
          production_status even though the run only writes the parent's
          measurement_status. That is the single point where the otherwise
          independent dimensions couple, and it is a different pair and a different
          coupling direction from the two instances above. The fixture separates the
          state guard from the OCC guard by supplying a freshly re-read, correct
          expected_drop_version on the rejected call, so a 409 ERR_INVALID_DROP_STATE
          - not a 412 - is the only acceptable answer.
        test_recipe:
          setup:
            - "Logical clock stepped 2026-08-01 -> 2026-09-20T00:00:00Z."
            - "Season FW26 on the default rate card; segment S_A (30000 names, 620 bps, AOV 18500)."
            - "Plan P1 budget 20000000 with a COMPLETED housefile-only merge-purge run; drop 1 (page_count 64, in_home 2026-09-15) with an S_A line for 20000, allocated at the provisional 236, then costed, submitted, approved, batched 20000 FIVE_DIGIT and PRESORTED - production_status PRESORTED, measurement_status PENDING."
            - "No online orders are ingested, so the run's own attribution figures are all zero and the assertions isolate the state guard."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_a_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id", d1_meas0: "$.data.measurement_status" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_a_id}", requested_quantity: 20000 }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${d1_id}/allocate"
              payload: {}
              as: CirculationPlanner
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cost"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/submit-review"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/approve"
              payload: {}
              as: CirculationDirector
              as_user_id: "u-director-9"
            - call: "POST /catalog-circulation/drops/${d1_id}/presort-batches"
              payload: { declared_tier: "FIVE_DIGIT", piece_count: 20000 }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${d1_id}/presort"
              payload: {}
              as: CirculationPlanner
              captures: { d1_prod_presorted: "$.data.production_status", d1_version_presorted: "$.data.version" }
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /catalog-circulation/drops/${d1_id}/matchback-runs"
              payload: { expected_drop_version: "${d1_version_presorted}", attribution_variant: "LAST_TOUCH_MAIL", attribution_window_days: 30 }
              as: MarketingAnalyst
              captures: { err_drop_state: "$.data.error_id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/mail"
              payload: {}
              as: CirculationPlanner
              captures: { d1_prod_mailed: "$.data.production_status", d1_version_mailed: "$.data.version" }
            - call: "POST /catalog-circulation/drops/${d1_id}/matchback-runs"
              payload: { expected_drop_version: "${d1_version_mailed}", attribution_variant: "LAST_TOUCH_MAIL", attribution_window_days: 30 }
              as: MarketingAnalyst
              captures: { run_id: "$.data.id", run_status: "$.data.status", run_matched: "$.data.matched_order_count", run_attributed: "$.data.attributed_order_count", run_unmatched: "$.data.unmatched_order_count", run_demand: "$.data.attributed_demand_cents" }
          assert:
            - "${d1_meas0} == PENDING and ${d1_prod_presorted} == PRESORTED"
            - "BLOCKED by the drop: ${err_drop_state} == ERR_INVALID_DROP_STATE with HTTP 409  # PRESORTED is not in {MAILED, DELIVERED}"
            - "BLOCKED by the drop: ${err_drop_state} != ERR_STALE_DROP_VERSION  # expected_drop_version was correct, so the 412 rule is NOT what fired"
            - "BLOCKED by the drop: Drop.${d1_id}.measurement_status == PENDING and Drop.${d1_id}.version == ${d1_version_presorted}  # the refused write neither advanced the measurement dimension nor bumped the version"
            - "BLOCKED by the drop: GET /catalog-circulation/drops/${d1_id}/matchback-runs returns total_count == 0"
            - "UNBLOCKED: ${d1_prod_mailed} == MAILED and ${d1_version_mailed} == ${d1_version_presorted} + 1"
            - "UNBLOCKED: ${run_status} == OPEN and Drop.${d1_id}.measurement_status == MATCHBACK_OPEN"
            - "UNBLOCKED: ${run_matched} == 0 and ${run_attributed} == 0 and ${run_unmatched} == 0 and ${run_demand} == 0  # no orders were ingested; the point is that the run exists at all"
            - "UNBLOCKED: MatchbackRun.${run_id}.attribution_window_days == 30 and observed_drop_version == ${d1_version_mailed}"
            - "UNBLOCKED: Drop.${d1_id}.production_status == MAILED  # opening a run does not move the production dimension"
            - "the two matchback-run calls differ only in the version placeholder they carry, so the differing outcomes are attributable to the drop's production_status"

  # ===========================================================================
  # RULE 8 — resource_temporal_overlap (2 instances: different interval
  #          semantics, different resource entities)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: inhome_spacing_is_a_symmetric_day_buffer_around_a_segment
        grounds:
          - validations[priority=74]
          - errors[ERR_INHOME_SPACING_VIOLATION]
          - entities.CatalogSeason.fields.min_inhome_gap_days
          - entities.Drop.fields.in_home_date
          - endpoints[POST /catalog-circulation/drops/{id}/circulation-lines]
        distinguishing_aspect: |
          Resource = a HousefileSegment's mailbox, and the interval semantics are a
          SYMMETRIC point-buffer measured in whole days: each existing line plants a
          +/- min_inhome_gap_days exclusion zone around its drop's in_home_date, and
          the boundary is inclusive-permissive (a gap of exactly 21 days is allowed,
          20 is not). The fixture proves symmetry by adding the fourth drop EARLIER
          than the first, which a naive "later drop must be at least N days after the
          latest existing drop" implementation would wrongly accept, and proves the
          buffer is released rather than permanent by voiding the anchoring line and
          re-issuing the previously rejected call.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; season FW26 on the default rate card (min_inhome_gap_days 21)."
            - "Segment S_A (30000 names, 620 bps, AOV 18500) and an unrelated segment S_B used to show the buffer is per-segment."
            - "Plan P1 budget 20000000 with a COMPLETED housefile-only merge-purge run, left in DRAFT throughout so ERR_PLAN_NOT_EDITABLE never masks the temporal rule."
            - "Four drops, all at page_count 64 and all in the future relative to the clock so ERR_INHOME_DATE_IN_PAST cannot fire: drop 1 2026-09-15, drop 2 2026-10-06 (exactly 21 days after drop 1), drop 3 2026-09-30 (15 days after drop 1), drop 4 2026-08-30 (16 days BEFORE drop 1)."
            - "Drop 1 already carries a PROPOSED S_A line for 10000 books, so S_A's buffer is anchored at 2026-09-15."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id", gap_days: "$.data.min_inhome_gap_days" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_a_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_B", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_b_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 2, in_home_date: "2026-10-06", page_count: 64 }
              as: CirculationPlanner
              captures: { d2_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 3, in_home_date: "2026-09-30", page_count: 64 }
              as: CirculationPlanner
              captures: { d3_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 4, in_home_date: "2026-08-30", page_count: 64 }
              as: CirculationPlanner
              captures: { d4_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_a_id}", requested_quantity: 10000 }
              as: CirculationPlanner
              captures: { l1_id: "$.data.id" }
          trigger:
            - call: "POST /catalog-circulation/drops/${d2_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_a_id}", requested_quantity: 5000 }
              as: CirculationPlanner
              captures: { l2_id: "$.data.id", l2_status: "$.data.status" }
            - call: "POST /catalog-circulation/drops/${d3_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_a_id}", requested_quantity: 5000 }
              as: CirculationPlanner
              captures: { err_forward: "$.data.error_id" }
            - call: "POST /catalog-circulation/drops/${d4_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_a_id}", requested_quantity: 5000 }
              as: CirculationPlanner
              captures: { err_backward: "$.data.error_id" }
            - call: "POST /catalog-circulation/drops/${d3_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_b_id}", requested_quantity: 5000 }
              as: CirculationPlanner
              captures: { l3b_status: "$.data.status" }
            - call: "POST /catalog-circulation/circulation-lines/${l1_id}/void"
              payload: { reason: "release the buffer" }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${d3_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_a_id}", requested_quantity: 5000 }
              as: CirculationPlanner
              captures: { l3a_status: "$.data.status" }
          assert:
            - "${gap_days} == 21"
            - "EXACTLY AT the buffer edge: ${l2_status} == PROPOSED and ${l2_id} is created  # 2026-10-06 is exactly 21 whole days after 2026-09-15, and exactly the gap is permitted"
            - "INSIDE the buffer, later: ${err_forward} == ERR_INHOME_SPACING_VIOLATION with HTTP 409  # 2026-09-30 is 15 days after 2026-09-15"
            - "INSIDE the buffer, EARLIER: ${err_backward} == ERR_INHOME_SPACING_VIOLATION with HTTP 409  # 2026-08-30 is 16 days BEFORE 2026-09-15, so the buffer is symmetric and not a forward-only 'must follow the latest drop' rule"
            - "the buffer is per-segment: ${l3b_status} == PROPOSED  # S_B on drop 3 is accepted at the same in_home_date that S_A was refused"
            - "the buffer is RELEASED, not permanent: ${l3a_status} == PROPOSED after voiding the anchoring line  # a VOIDED line no longer occupies 2026-09-15"
            - "CirculationLine.${l1_id}.status == VOIDED and Drop.${d1_id}.requested_quantity_total == 0"
            - "GET /catalog-circulation/circulation-lines?drop_id=${d4_id} returns total_count == 0  # the symmetric rejection created nothing"
            - "GET /catalog-circulation/circulation-lines?drop_id=${d3_id} returns total_count == 2  # only the S_B line and the post-void S_A line"

      - name: page_space_is_a_half_open_interval_that_permits_adjacency
        grounds:
          - validations[priority=82]
          - validations[priority=84]
          - errors[ERR_PAGE_SPACE_OVERLAP]
          - errors[ERR_PAGE_CAPACITY_EXCEEDED]
          - calculations.page_placement_space_productivity
          - calculations.drop_piece_weight
          - endpoints[POST /catalog-circulation/drops/{id}/page-placements]
        distinguishing_aspect: |
          Resource = a single page of a Drop (a DIFFERENT resource entity from a
          segment's mailbox) and the interval semantics are HALF-OPEN square-inch
          spans [sq_in_offset, sq_in_offset + square_inches) rather than a symmetric
          day buffer: touching spans are legal (offset 44 immediately after a 0..44
          span) while a one-square-inch back-step is not. The exclusion is scoped to
          the page_number, so the same offsets are free on page 2, and the
          fourth placement is deliberately put on page 2 to show the per-page
          capacity rule at priority 84 firing without the overlap rule at 82
          pre-empting it.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; season FW26 on the default rate card (usable_sq_in_per_page 88)."
            - "Segment S_A (30000 names, 620 bps, AOV 18500); plan P1 budget 20000000 with a COMPLETED housefile-only merge-purge run, kept in DRAFT."
            - "Drop 1 at page_count 64, in_home 2026-09-15, so square_inch_capacity is 64 * 88 == 5632 and page numbers 1..64 are valid; a single S_A line for 20000 books exists so the drop is a realistic book."
            - "No placements exist yet: allocated_square_inches 0, unallocated_square_inches 5632."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id", usable_sq_in: "$.data.usable_sq_in_per_page" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_a_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id", d1_capacity: "$.data.square_inch_capacity", d1_unalloc0: "$.data.unallocated_square_inches" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_a_id}", requested_quantity: 20000 }
              as: CirculationPlanner
          trigger:
            - call: "POST /catalog-circulation/drops/${d1_id}/page-placements"
              payload: { product_sku: "SKU-1", product_name: "Wool throw", unit_price_cents: 12900, unit_cogs_cents: 5400, demand_per_sq_inch_cents: 4200, page_number: 1, sq_in_offset: 0, square_inches: 44, placement_position: "FRONT_COVER" }
              as: CirculationPlanner
              captures: { p1_id: "$.data.id", p1_mult: "$.data.position_multiplier_bps", p1_forecast: "$.data.forecast_space_demand_cents", p1_prod: "$.data.space_productivity_cents_per_sq_in" }
            - call: "POST /catalog-circulation/drops/${d1_id}/page-placements"
              payload: { product_sku: "SKU-2", product_name: "Cast iron pan", unit_price_cents: 8900, unit_cogs_cents: 3900, demand_per_sq_inch_cents: 3100, page_number: 1, sq_in_offset: 44, square_inches: 44, placement_position: "INSIDE" }
              as: CirculationPlanner
              captures: { p2_id: "$.data.id", p2_forecast: "$.data.forecast_space_demand_cents", p2_prod: "$.data.space_productivity_cents_per_sq_in" }
            - call: "POST /catalog-circulation/drops/${d1_id}/page-placements"
              payload: { product_sku: "SKU-3", product_name: "Enamel kettle", unit_price_cents: 6900, unit_cogs_cents: 2900, demand_per_sq_inch_cents: 2800, page_number: 1, sq_in_offset: 43, square_inches: 10, placement_position: "HOT_SPOT" }
              as: CirculationPlanner
              captures: { err_overlap: "$.data.error_id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/page-placements"
              payload: { product_sku: "SKU-4", product_name: "Linen apron", unit_price_cents: 4900, unit_cogs_cents: 1900, demand_per_sq_inch_cents: 2600, page_number: 2, sq_in_offset: 80, square_inches: 10, placement_position: "INSIDE" }
              as: CirculationPlanner
              captures: { err_capacity: "$.data.error_id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/page-placements"
              payload: { product_sku: "SKU-5", product_name: "Stoneware mug", unit_price_cents: 2400, unit_cogs_cents: 900, demand_per_sq_inch_cents: 2600, page_number: 2, sq_in_offset: 0, square_inches: 44, placement_position: "INSIDE" }
              as: CirculationPlanner
              captures: { p5_id: "$.data.id" }
          assert:
            - "${usable_sq_in} == 88 and ${d1_capacity} == 5632 and ${d1_unalloc0} == 5632  # 64 pages * 88 usable square inches"
            - "${p1_mult} == 18000 and ${p1_forecast} == 332640 and ${p1_prod} == 7560  # 44 * 4200 * 1.8, then the ALREADY-ROUNDED forecast re-divided by 44"
            - "ADJACENT spans are legal: ${p2_id} is created with ${p2_forecast} == 136400 and ${p2_prod} == 3100  # [44, 88) starts exactly where [0, 44) ends, gap 0"
            - "after two placements: Drop.${d1_id}.allocated_square_inches == 88 and unallocated_square_inches == 5544"
            - "ONE SQUARE INCH INTO the neighbour: ${err_overlap} == ERR_PAGE_SPACE_OVERLAP with HTTP 409  # [43, 53) intrudes one square inch into [0, 44)"
            - "${err_overlap} != ERR_PAGE_CAPACITY_EXCEEDED  # 43 + 10 == 53 fits inside the page, so 84 is not what fired"
            - "PAST THE END of a page: ${err_capacity} == ERR_PAGE_CAPACITY_EXCEEDED with HTTP 422  # 80 + 10 == 90 > 88; it is on page 2 precisely so that the priority-82 overlap rule cannot pre-empt priority 84"
            - "SAME OFFSETS on a DIFFERENT page: ${p5_id} is created at page_number 2, sq_in_offset 0, square_inches 44  # the exclusion is scoped to (drop, page_number)"
            - "after the three accepted placements: Drop.${d1_id}.allocated_square_inches == 132 and unallocated_square_inches == 5500"
            - "5632 == Drop.${d1_id}.allocated_square_inches + Drop.${d1_id}.unallocated_square_inches at every observation point above"
            - "GET /catalog-circulation/drops/${d1_id}/page-placements returns total_count == 3  # neither rejected placement was persisted"

  # ===========================================================================
  # RULE 9 — compensating_invariant (3 instances, three conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: voiding_a_line_restores_the_plan_budget_cents_exactly
        grounds:
          - state_machines.CirculationLine.ALLOCATED_to_VOIDED
          - state_machines.CirculationPlan.COSTED_to_DRAFT
          - endpoints[POST /catalog-circulation/circulation-lines/{id}/void]
          - entities.CirculationPlan.fields.committed_cost_cents
          - entities.CirculationPlan.fields.uncommitted_budget_cents
          - calculations.plan_profitability_rollup
          - calculations.line_profitability
        distinguishing_aspect: |
          Conserved quantity = CENTS of plan budget: budget_cents must equal
          committed_cost_cents + uncommitted_budget_cents both before and after the
          undo, and the credit must be exactly the line's frozen committed figure
          (1888000) rather than a recomputation at the current cost per book. The
          instance also pins that no drift leaks into the sibling line, whose
          committed 2360000 and contribution 2457400 are untouched, and that the undo
          reverses the plan's derived status as well as its money (COSTED -> DRAFT).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; season FW26 on the default rate card (cogs_rate_bps 5800)."
            - "Segments S_A and S_B, each 30000 names / 620 bps / AOV 18500."
            - "Plan P1 budget 20000000 with a COMPLETED housefile-only merge-purge run."
            - "Drop 1 (page_count 64, in_home 2026-09-15) carries an S_A line for 10000 and an S_B line for 8000, so requested_quantity_total is 18000 - below the 40000 rebate band, hence a provisional and a final cost per book that are both 236."
            - "The drop is allocated and the plan costed, so the plan sits in COSTED with both lines ALLOCATED."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_a_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_B", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_b_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version", plan_budget: "$.data.budget_cents" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_a_id}", requested_quantity: 10000 }
              as: CirculationPlanner
              captures: { l1_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_b_id}", requested_quantity: 8000 }
              as: CirculationPlanner
              captures: { l2_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/allocate"
              payload: {}
              as: CirculationPlanner
              captures: { d1_prov: "$.data.provisional_cost_per_book_cents", d1_cpb: "$.data.cost_per_book_cents" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cost"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
              captures: { plan_committed_before: "$.data.committed_cost_cents", plan_unc_before: "$.data.uncommitted_budget_cents", plan_contrib_before: "$.data.planned_contribution_cents", plan_status_before: "$.data.status" }
          trigger:
            - call: "POST /catalog-circulation/circulation-lines/${l2_id}/void"
              payload: { reason: "segment pulled from the book" }
              as: CirculationPlanner
              captures: { l2_status: "$.data.status", l2_committed: "$.data.committed_cost_cents", l2_contrib: "$.data.contribution_cents" }
          assert:
            - "${plan_budget} == 20000000 and ${d1_prov} == 236 and ${d1_cpb} == 236  # 18000 books is below the 40000 rebate band on both sides"
            - "BEFORE: CirculationLine.${l1_id}.committed_cost_cents == 2360000 and CirculationLine.${l2_id}.committed_cost_cents == 1888000"
            - "BEFORE: ${plan_committed_before} == 4248000 and ${plan_unc_before} == 15752000 and ${plan_status_before} == COSTED"
            - "BEFORE: 20000000 == ${plan_committed_before} + ${plan_unc_before}  # the invariant holds pre-undo"
            - "BEFORE: CirculationLine.${l1_id}.contribution_cents == 2457400 and CirculationLine.${l2_id}.contribution_cents == 1965920 and ${plan_contrib_before} == 4423320"
            - "AFTER: ${l2_status} == VOIDED with ${l2_committed} == 0 and ${l2_contrib} == 0 and allocated_quantity == 0 and mailable_quantity == 0 and forecast_demand_cents == 0 and gross_margin_cents == 0 and circulation_cost_cents == 0"
            - "AFTER: CirculationPlan.${plan_id}.committed_cost_cents == 2360000  # exactly 1888000 credited back, the frozen figure, not a recomputation"
            - "AFTER: CirculationPlan.${plan_id}.uncommitted_budget_cents == 17640000"
            - "AFTER: 20000000 == CirculationPlan.${plan_id}.committed_cost_cents + CirculationPlan.${plan_id}.uncommitted_budget_cents  # the invariant still holds, no drift"
            - "AFTER: CirculationPlan.${plan_id}.uncommitted_budget_cents - ${plan_unc_before} == 1888000  # the delta equals the voided line's committed cost exactly"
            - "NO DRIFT on the sibling: CirculationLine.${l1_id}.committed_cost_cents == 2360000, unit_cost_cents == 236, allocated_quantity == 10000 and contribution_cents == 2457400 - all unchanged"
            - "AFTER: Drop.${d1_id}.requested_quantity_total == 10000, planned_quantity == 10000 and cost_per_book_cents == 236  # still below the rebate band, so the unit cost does not move"
            - "AFTER: CirculationPlan.${plan_id}.planned_cost_cents == 2360000, planned_demand_cents == 11470000 and planned_contribution_cents == 2457400"
            - "AFTER: CirculationPlan.${plan_id}.status == DRAFT  # the undo reverses the derived status as well as the money"

      - name: merge_purge_conserves_names_across_a_stale_recompute
        grounds:
          - calculations.merge_purge_net_mailable_names
          - calculations.merge_purge_net_mailable_names.invariant
          - state_machines.MergePurgeRun.COMPLETED_to_STALE
          - state_machines.ProspectListRental.DELIVERED_to_NETTED
          - entities.MergePurgeRun.fields.processing_order
          - entities.HousefileSegment.fields.contact_strategy
        distinguishing_aspect: |
          Conserved quantity = NAMES rather than cents, and the conservation law is a
          four-way partition (gross == net + suppressed + duplicates) that has to
          survive a recompute triggered from outside the run. It also pins the
          order-sensitivity that makes the partition non-trivial: the coop-score
          ordering puts R2 first, so R2 pays no inter-list penalty and the
          duplicate count is 11000; the R1-first counterfactual would produce 6900
          duplicates and 58100 net names from the same rows. A DORMANT segment
          contributes to gross and to suppressed but never to net, which is what
          distinguishes suppression from deduplication in the same equation.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; season FW26 on the default rate card."
            - "Leaf segment S_ACTIVE (30000 names, recency 45 / orders 7 / ltv 62000 -> rfm 1000, BEST, PREMIUM_FULL) and leaf segment S_DORMANT (8000 names, recency 900 / orders 0 / ltv 1000 -> rfm 0, DORMANT, default contact_strategy SUPPRESS_ONLY)."
            - "Rental R1: 25000 gross names, housefile_overlap_bps 2000, inter_list_overlap_bps 2500, coop_model_score 640, delivered with 25000 gross names."
            - "Rental R2: 10000 gross names, housefile_overlap_bps 1000, inter_list_overlap_bps 1000, coop_model_score 720, delivered with 10000 gross names."
            - "Plan P1 budget 20000000, still DRAFT, with one merge-purge run over both rentals."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_ACTIVE", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_active_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_DORMANT", recency_days: 900, orders_12mo: 0, ltv_cents: 1000, housefile_count: 8000, avg_order_value_cents: 9000, historical_response_rate_bps: 40 }
              as: CirculationPlanner
              captures: { seg_dormant_id: "$.data.id", dormant_tier: "$.data.segment_tier", dormant_strategy: "$.data.contact_strategy" }
            - call: "POST /catalog-circulation/prospect-list-rentals"
              payload: { season_id: "${season_id}", list_source_name: "COOP-R1", requested_gross_names: 25000, cost_per_thousand_cents: 8500, housefile_overlap_bps: 2000, inter_list_overlap_bps: 2500 }
              as: ListBroker
              captures: { r1_id: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${r1_id}/model"
              payload: { coop_model_score: 640 }
              as: ListBroker
            - call: "POST /catalog-circulation/prospect-list-rentals/${r1_id}/order"
              payload: {}
              as: ListBroker
            - call: "POST /catalog-circulation/prospect-list-rentals/${r1_id}/deliver"
              payload: { delivered_gross_names: 25000 }
              as: ListBroker
            - call: "POST /catalog-circulation/prospect-list-rentals"
              payload: { season_id: "${season_id}", list_source_name: "COOP-R2", requested_gross_names: 10000, cost_per_thousand_cents: 9200, housefile_overlap_bps: 1000, inter_list_overlap_bps: 1000 }
              as: ListBroker
              captures: { r2_id: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${r2_id}/model"
              payload: { coop_model_score: 720 }
              as: ListBroker
            - call: "POST /catalog-circulation/prospect-list-rentals/${r2_id}/order"
              payload: {}
              as: ListBroker
            - call: "POST /catalog-circulation/prospect-list-rentals/${r2_id}/deliver"
              payload: { delivered_gross_names: 10000 }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: ["${r1_id}", "${r2_id}"] }
              as: ListBroker
              captures: { mp_id: "$.data.id", mp_gross: "$.data.gross_input_names", mp_supp: "$.data.suppressed_names", mp_dupes: "$.data.duplicates_removed", mp_net: "$.data.net_mailable_names", mp_order: "$.data.processing_order", mp_leaves: "$.data.housefile_leaf_segment_count" }
          trigger:
            - call: "POST /catalog-circulation/prospect-list-rentals/${r1_id}/cancel"
              payload: { reason: "broker withdrew the list" }
              as: ListBroker
          assert:
            - "${dormant_tier} == DORMANT and ${dormant_strategy} == SUPPRESS_ONLY  # rfm 0 defaults straight to suppression"
            - "BEFORE: ${mp_leaves} == 2 and ${mp_order} == [${r2_id}, ${r1_id}]  # coop_model_score DESC puts 720 before 640"
            - "BEFORE: ${mp_gross} == 73000  # 30000 + 8000 housefile leaves plus 25000 + 10000 rental gross"
            - "BEFORE: ${mp_supp} == 8000 and ${mp_dupes} == 11000 and ${mp_net} == 54000"
            - "BEFORE: ${mp_gross} == ${mp_net} + ${mp_supp} + ${mp_dupes}  # 73000 == 54000 + 8000 + 11000"
            - "BEFORE: ProspectListRental.${r2_id}.net_names_delivered == 9000  # first in order: floor(10000 * 1000 / 10000) housefile dupes only, no inter-list penalty"
            - "BEFORE: ProspectListRental.${r1_id}.net_names_delivered == 15000  # second in order: 5000 housefile dupes then floor(20000 * 2500 / 10000) == 5000 inter-list dupes"
            - "ORDER SENSITIVITY: had R1 been processed first the same rows would give duplicates_removed 6900 and net_mailable_names 58100, so the partition is order-dependent and the coop ordering is load-bearing"
            - "AFTER: MergePurgeRun.${mp_id}.status == STALE"
            - "AFTER: MergePurgeRun.${mp_id}.gross_input_names == 48000  # 38000 housefile plus R2's surviving 10000"
            - "AFTER: MergePurgeRun.${mp_id}.suppressed_names == 8000 and duplicates_removed == 1000 and net_mailable_names == 39000"
            - "AFTER: MergePurgeRun.${mp_id}.gross_input_names == net_mailable_names + suppressed_names + duplicates_removed  # 48000 == 39000 + 8000 + 1000, the invariant survives the recompute"
            - "AFTER: MergePurgeRun.${mp_id}.processing_order == [${r2_id}] and ProspectListRental.${r2_id}.net_names_delivered == 9000  # R2 was already first, so its own netting does not move"
            - "AFTER: ProspectListRental.${r1_id}.status == CANCELLED with gross_names == 0 and net_names_delivered == 0"
            - "AFTER: the suppressed component is unchanged at 8000  # cancelling a rental cannot leak names between the suppressed and duplicate buckets"
            - "AFTER: HousefileSegment.${seg_dormant_id}.housefile_count == 8000 and HousefileSegment.${seg_active_id}.housefile_count == 30000  # the housefile side of the partition is untouched"

      - name: deleting_a_placement_restores_the_drop_square_inches
        grounds:
          - endpoints[DELETE /catalog-circulation/page-placements/{id}]
          - calculations.drop_piece_weight
          - calculations.page_placement_space_productivity
          - entities.Drop.fields.allocated_square_inches
          - entities.Drop.fields.unallocated_square_inches
          - entities.Drop.fields.square_inch_capacity
        distinguishing_aspect: |
          Conserved quantity = SQUARE INCHES of page space - neither cents nor names -
          and the conservation is a two-way split against a capacity derived from
          page_count rather than a four-way partition or a budget. The undo path is a
          hard DELETE rather than a status transition, so there is no terminal row
          left to reconcile against, and the restored space must be immediately
          reusable: the freed [0, 44) span is re-let to a different SKU at the same
          offset, and the capacity identity is re-checked after the re-let.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; season FW26 on the default rate card (usable_sq_in_per_page 88)."
            - "Segment S_A (30000 names, 620 bps, AOV 18500); plan P1 budget 20000000 with a COMPLETED housefile-only merge-purge run, kept in DRAFT."
            - "Drop 1 at page_count 64, in_home 2026-09-15, so square_inch_capacity is 5632; a single S_A line for 20000 books exists."
            - "Two adjacent placements on page 1: SKU-1 at [0, 44) FRONT_COVER at 4200 cents per square inch and SKU-2 at [44, 88) INSIDE at 3100 cents per square inch, so allocated_square_inches is 88."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_a_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id", d1_capacity: "$.data.square_inch_capacity" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_a_id}", requested_quantity: 20000 }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${d1_id}/page-placements"
              payload: { product_sku: "SKU-1", product_name: "Wool throw", unit_price_cents: 12900, unit_cogs_cents: 5400, demand_per_sq_inch_cents: 4200, page_number: 1, sq_in_offset: 0, square_inches: 44, placement_position: "FRONT_COVER" }
              as: CirculationPlanner
              captures: { p1_id: "$.data.id", p1_forecast: "$.data.forecast_space_demand_cents", p1_prod: "$.data.space_productivity_cents_per_sq_in" }
            - call: "POST /catalog-circulation/drops/${d1_id}/page-placements"
              payload: { product_sku: "SKU-2", product_name: "Cast iron pan", unit_price_cents: 8900, unit_cogs_cents: 3900, demand_per_sq_inch_cents: 3100, page_number: 1, sq_in_offset: 44, square_inches: 44, placement_position: "INSIDE" }
              as: CirculationPlanner
              captures: { p2_id: "$.data.id", p2_forecast: "$.data.forecast_space_demand_cents", p2_prod: "$.data.space_productivity_cents_per_sq_in" }
            - call: "GET /catalog-circulation/drops/${d1_id}"
              payload: {}
              as: CirculationPlanner
              captures: { alloc_before: "$.data.allocated_square_inches", unalloc_before: "$.data.unallocated_square_inches", d1_version_before: "$.data.version" }
          trigger:
            - call: "DELETE /catalog-circulation/page-placements/${p1_id}"
              payload: {}
              as: CirculationPlanner
              captures: { alloc_after: "$.data.allocated_square_inches", unalloc_after: "$.data.unallocated_square_inches", d1_version_after: "$.data.version" }
            - call: "POST /catalog-circulation/drops/${d1_id}/page-placements"
              payload: { product_sku: "SKU-9", product_name: "Merino scarf", unit_price_cents: 7900, unit_cogs_cents: 3100, demand_per_sq_inch_cents: 4200, page_number: 1, sq_in_offset: 0, square_inches: 44, placement_position: "FRONT_COVER" }
              as: CirculationPlanner
              captures: { p9_id: "$.data.id", p9_forecast: "$.data.forecast_space_demand_cents" }
          assert:
            - "${d1_capacity} == 5632  # 64 pages * 88 usable square inches"
            - "BEFORE: ${p1_forecast} == 332640 and ${p1_prod} == 7560; ${p2_forecast} == 136400 and ${p2_prod} == 3100"
            - "BEFORE: ${alloc_before} == 88 and ${unalloc_before} == 5544"
            - "BEFORE: 5632 == ${alloc_before} + ${unalloc_before}  # the capacity identity holds pre-undo"
            - "AFTER: ${alloc_after} == 44 and ${unalloc_after} == 5588  # exactly the deleted placement's 44 square inches moved back"
            - "AFTER: 5632 == ${alloc_after} + ${unalloc_after}  # no drift; the identity is not restored by recomputing from scratch alone but must hold either way"
            - "AFTER: ${alloc_before} - ${alloc_after} == 44 and ${unalloc_after} - ${unalloc_before} == 44  # the two halves move by the same amount in opposite directions"
            - "AFTER: ${d1_version_after} == ${d1_version_before} + 1  # the delete is a write on the parent drop"
            - "AFTER: GET /catalog-circulation/drops/${d1_id}/page-placements returns total_count == 1 and does not contain ${p1_id}  # the row is gone, not soft-deleted"
            - "NO DRIFT on the survivor: PagePlacement.${p2_id}.sq_in_offset == 44, square_inches == 44, forecast_space_demand_cents == 136400 and space_productivity_cents_per_sq_in == 3100"
            - "RE-LET: ${p9_id} is created at page_number 1, sq_in_offset 0, square_inches 44 with ${p9_forecast} == 332640  # the freed half-open span is immediately reusable, so the space was truly released and not merely accounted for"
            - "RE-LET: Drop.${d1_id}.allocated_square_inches == 88, unallocated_square_inches == 5544 and 5632 == 88 + 5544  # back to the starting split with a different SKU occupying the space"
