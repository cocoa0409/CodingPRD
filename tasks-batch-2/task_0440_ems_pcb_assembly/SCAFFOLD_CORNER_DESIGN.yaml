scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_part_returns_201_with_all_fields
        claim_type: Creation
        grounds: ["entities.Part", "endpoints"]
        distinguishing_aspect: "POST /parts with all required fields returns 201 and a Part whose computed total_on_hand_qty and available_qty both initialize to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /parts"
              payload: { internal_pn: "C-PART", description: "10k res", package_type: "0402", standard_cost_cents: 50 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { part_id: $.data.id }
          assert:
            - "response status == 201"
            - "Part.${part_id}.total_on_hand_qty == 0"
            - "Part.${part_id}.available_qty == 0"
            - "Part.${part_id}.version == 1"

      - name: get_part_not_found
        claim_type: Not Found
        grounds: ["entities.Part", "validations[priority=3]"]
        distinguishing_aspect: "GET /parts/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /parts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_part_missing_required_field_rejected
        claim_type: Required Fields
        grounds: ["entities.Part", "validations[priority=16]"]
        distinguishing_aspect: "POST /parts omitting standard_cost_cents (input field, no default) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /parts"
              payload: { internal_pn: "C-NOSTD", description: "x", package_type: "0402" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_part_default_rohs_required_true
        claim_type: Defaults
        grounds: ["entities.Part.fields.is_rohs_required"]
        distinguishing_aspect: "Omitting is_rohs_required applies the declared default true."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /parts"
              payload: { internal_pn: "C-DEF", description: "x", package_type: "0402", standard_cost_cents: 10 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { part_id: $.data.id }
          assert:
            - "Part.${part_id}.is_rohs_required == true"
            - "Part.${part_id}.contains_conflict_minerals == false"

      - name: invalid_package_type_enum_rejected
        claim_type: Type Constraints
        grounds: ["entities.Part.fields.package_type", "validations[priority=16]"]
        distinguishing_aspect: "POST /parts with package_type not in the declared enum set returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /parts"
              payload: { internal_pn: "C-BADENUM", description: "x", package_type: "DIP99", standard_cost_cents: 10 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: serial_number_system_minted_immutable
        claim_type: System Fields
        grounds: ["entities.Unit.fields.serial_number"]
        excluded_because:
          difficulty_instance: dual_variant_calc / rma_warranty_credit_vs_rework_surcharge_cost
          rationale: "Units are minted (with system serial_number) by POST /work-orders/{id}/units inside that §1.8 instance's chain; serial uniqueness/immutability is observed there."

      - name: list_parts_pagination_envelope
        claim_type: Listing
        grounds: ["entities.Part", "response_envelope"]
        distinguishing_aspect: "GET /parts returns an array response_type with pagination fields total_count and has_more in meta."
        test_recipe:
          setup: ["Two parts created."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { internal_pn: "C-L1", description: "a", package_type: "0402", standard_cost_cents: 10 }
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /parts"
              payload: { internal_pn: "C-L2", description: "b", package_type: "0603", standard_cost_cents: 20 }
              as: ProcessEngineer
              as_user_id: "pe-1"
          trigger:
            - call: "GET /parts"
              payload: { limit: 1, offset: 0 }
              as: ProcessEngineer
              as_user_id: "pe-1"
          assert:
            - "response.response_type == array"
            - "response.meta total_count == 2"
            - "response.meta has_more == true"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: kit_already_kitted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.WorkOrder.PLANNED_to_KITTED", "validations[priority=5]"]
        distinguishing_aspect: "Kitting a WorkOrder already KITTED returns ERR_INVALID_STATE (409); no requirements re-created."
        test_recipe:
          setup: ["A KITTED WorkOrder (part with sufficient stock)."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { internal_pn: "C-K1", description: "res", package_type: "0402", standard_cost_cents: 20, is_rohs_required: false }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { part_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "CV1", cage_code: "AAA11" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /avl-entries"
              payload: { part_id: "${part_id}", vendor_id: "${vendor_id}", vendor_pn: "P1", approval_rank: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { avl_id: $.data.id, avl_v: $.data.version }
            - call: "POST /avl-entries/${avl_id}/receive-lot"
              payload: { lot_code: "CL1", received_qty: 10, unit_cost_cents: 20, received_at: "2026-01-02T00:00:00.000Z", expected_avl_entry_version: "${avl_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /boms"
              payload: { product_code: "CB1", revision: "A" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_id: $.data.id }
            - call: "POST /boms/${bom_id}/lines"
              payload: { part_id: "${part_id}", ref_designators: ["R1"], qty_per_assembly: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /boms/${bom_id}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /work-orders"
              payload: { bom_id: "${bom_id}", planned_qty: 1 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/kit"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
          trigger:
            - call: "POST /work-orders/${wo_id}/kit"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "WorkOrder.${wo_id}.status == KITTED"

      - name: new_workorder_initial_state_planned
        claim_type: Initial State
        grounds: ["state_machines.WorkOrder", "entities.WorkOrder.fields.status"]
        distinguishing_aspect: "A newly created WorkOrder starts in PLANNED with built_qty 0 and material_cost_cents 0."
        test_recipe:
          setup: ["A RELEASED BOM."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { internal_pn: "C-INIT", description: "res", package_type: "0402", standard_cost_cents: 20, is_rohs_required: false }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { part_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "CV2", cage_code: "BBB22" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /avl-entries"
              payload: { part_id: "${part_id}", vendor_id: "${vendor_id}", vendor_pn: "P2", approval_rank: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { avl_id: $.data.id }
            - call: "POST /boms"
              payload: { product_code: "CB2", revision: "A" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_id: $.data.id }
            - call: "POST /boms/${bom_id}/lines"
              payload: { part_id: "${part_id}", ref_designators: ["R1"], qty_per_assembly: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /boms/${bom_id}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
          trigger:
            - call: "POST /work-orders"
              payload: { bom_id: "${bom_id}", planned_qty: 3 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { wo_id: $.data.id }
          assert:
            - "WorkOrder.${wo_id}.status == PLANNED"
            - "WorkOrder.${wo_id}.built_qty == 0"
            - "WorkOrder.${wo_id}.material_cost_cents == 0"

      - name: terminal_obsolete_bom_cannot_anchor_workorder
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Bom", "state_machines.WorkOrder.PLANNED_to_KITTED", "validations[priority=5]"]
        distinguishing_aspect: "Creating a WorkOrder against an OBSOLETE BOM is rejected because the BOM is no longer RELEASED; returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["BOM rev A RELEASED then OBSOLETE after rev B (superseding) is released."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { internal_pn: "C-OBS", description: "res", package_type: "0402", standard_cost_cents: 20, is_rohs_required: false }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { part_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "CV3", cage_code: "CCC33" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /avl-entries"
              payload: { part_id: "${part_id}", vendor_id: "${vendor_id}", vendor_pn: "P3", approval_rank: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { avl_id: $.data.id }
            - call: "POST /boms"
              payload: { product_code: "CB3", revision: "A" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_a_id: $.data.id }
            - call: "POST /boms/${bom_a_id}/lines"
              payload: { part_id: "${part_id}", ref_designators: ["R1"], qty_per_assembly: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /boms/${bom_a_id}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /boms"
              payload: { product_code: "CB3", revision: "B", supersedes_bom_id: "${bom_a_id}" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_b_id: $.data.id }
            - call: "POST /boms/${bom_b_id}/lines"
              payload: { part_id: "${part_id}", ref_designators: ["R1"], qty_per_assembly: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /boms/${bom_b_id}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
          trigger:
            - call: "POST /work-orders"
              payload: { bom_id: "${bom_a_id}", planned_qty: 1 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Bom.${bom_a_id}.status == OBSOLETE"

      - name: eco_approve_without_submit_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Eco.SUBMITTED_to_APPROVED", "validations[priority=5]"]
        distinguishing_aspect: "Approving a DRAFT ECO (never submitted) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT ECO."]
          setup_api_calls:
            - call: "POST /boms"
              payload: { product_code: "CB4", revision: "A" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_id: $.data.id }
            - call: "POST /ecos"
              payload: { title: "draft", bom_id: "${bom_id}", change_summary: "x" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { eco_id: $.data.id }
          trigger:
            - call: "POST /ecos/${eco_id}/approve"
              payload: { acting_user_id: "qe-1" }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Eco.${eco_id}.status == DRAFT"

      - name: bubble_up_finalize_test_passed_branch
        claim_type: Bubble up
        grounds: ["state_machines.WorkOrder.AT_TEST_to_PASSED", "calculations.first_pass_yield"]
        excluded_because:
          difficulty_instance: boundary_precision_check / fpy_exactly_at_min_yield_threshold_passes
          rationale: "The AT_TEST->PASSED bubble-up via finalize-test (FPY recompute drives the branch) is exercised at the threshold boundary by that §1.8 instance."

      - name: workorder_close_blocked_by_open_rework
        claim_type: guarded transitions
        grounds: ["state_machines.WorkOrder.PASSED_to_CLOSED", "errors[ERR_OPEN_REWORK_BLOCKS_CLOSE]"]
        distinguishing_aspect: "Closing a PASSED WorkOrder while an OPEN ReworkOrder remains returns ERR_OPEN_REWORK_BLOCKS_CLOSE (409); the WO stays PASSED."
        test_recipe:
          setup:
            - "A 4-unit WorkOrder driven to PASSED: 3 units PASS on first test (rework_count 0) and 1 unit FAIL then reworked-CLOSED to REWORKED. FPY = 3/4 = 75.00 >= 70 so finalize-test -> PASSED."
            - "After PASSED, a NEW (re-)ReworkOrder is opened against the REWORKED unit (quality_status REWORKED is an allowed rework source), so an OPEN ReworkOrder exists at PASSED."
          setup_api_calls:
            - call: "POST /parts"
              payload: { internal_pn: "C-CLOSE", description: "ic", package_type: "QFN", standard_cost_cents: 100, is_rohs_required: false }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { part_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "CV5", cage_code: "DDD44" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /avl-entries"
              payload: { part_id: "${part_id}", vendor_id: "${vendor_id}", vendor_pn: "P5", approval_rank: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { avl_id: $.data.id, avl_v: $.data.version }
            - call: "POST /avl-entries/${avl_id}/receive-lot"
              payload: { lot_code: "CL5", received_qty: 50, unit_cost_cents: 100, received_at: "2026-01-02T00:00:00.000Z", expected_avl_entry_version: "${avl_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /boms"
              payload: { product_code: "CB5", revision: "A" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_id: $.data.id }
            - call: "POST /boms/${bom_id}/lines"
              payload: { part_id: "${part_id}", ref_designators: ["U1"], qty_per_assembly: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /boms/${bom_id}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /line-programs"
              payload: { bom_id: "${bom_id}", line_code: "LINE-A", feeder_slot_count: 4, program_checksum: "CK5" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { prog_id: $.data.id }
            - call: "POST /line-programs/${prog_id}/verify"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /work-orders"
              payload: { bom_id: "${bom_id}", planned_qty: 4 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/kit"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/setup"
              payload: { line_program_id: "${prog_id}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/units"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { unit1_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/units"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { unit2_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/units"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { unit3_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/units"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { unit4_id: $.data.id }
            - call: "POST /units/${unit1_id}/test-result"
              payload: { result: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /units/${unit2_id}/test-result"
              payload: { result: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /units/${unit3_id}/test-result"
              payload: { result: "PASS" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /units/${unit4_id}/test-result"
              payload: { result: "FAIL", defect_code: "OPEN" }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /rework-orders"
              payload: { unit_id: "${unit4_id}", defect_code: "OPEN" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { rwo1_id: $.data.id }
            - call: "POST /rework-orders/${rwo1_id}/close"
              payload: { replacement_part_id: "${part_id}", replacement_qty: 1, acting_user_id: "pp-1" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/finalize-test"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /rework-orders"
              payload: { unit_id: "${unit4_id}", defect_code: "RECHECK" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { rwo2_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/close"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_OPEN_REWORK_BLOCKS_CLOSE"
            - "WorkOrder.${wo_id}.status == PASSED"

      - name: rma_repair_no_fault_found_blocked
        claim_type: guarded transitions
        grounds: ["state_machines.Rma.TRIAGED_to_REPAIRED", "entities.Rma.fields.failure_class"]
        distinguishing_aspect: "Routing a TRIAGED RMA with failure_class NO_FAULT_FOUND to repair returns ERR_INVALID_STATE (precondition failure_class != NO_FAULT_FOUND)."
        test_recipe:
          setup: ["A SHIPPED unit; an RMA triaged NO_FAULT_FOUND."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { internal_pn: "C-NFF", description: "res", package_type: "0402", standard_cost_cents: 20, is_rohs_required: false }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { part_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "CV6", cage_code: "EEE55" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { vendor_id: $.data.id }
            - call: "POST /avl-entries"
              payload: { part_id: "${part_id}", vendor_id: "${vendor_id}", vendor_pn: "P6", approval_rank: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { avl_id: $.data.id, avl_v: $.data.version }
            - call: "POST /avl-entries/${avl_id}/receive-lot"
              payload: { lot_code: "CL6", received_qty: 10, unit_cost_cents: 20, received_at: "2026-01-02T00:00:00.000Z", expected_avl_entry_version: "${avl_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /boms"
              payload: { product_code: "CB6", revision: "A" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { bom_id: $.data.id }
            - call: "POST /boms/${bom_id}/lines"
              payload: { part_id: "${part_id}", ref_designators: ["R1"], qty_per_assembly: 1 }
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /boms/${bom_id}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /line-programs"
              payload: { bom_id: "${bom_id}", line_code: "LINE-A", feeder_slot_count: 2, program_checksum: "CK6" }
              as: ProcessEngineer
              as_user_id: "pe-1"
              captures: { prog_id: $.data.id }
            - call: "POST /line-programs/${prog_id}/verify"
              payload: {}
              as: ProcessEngineer
              as_user_id: "pe-1"
            - call: "POST /work-orders"
              payload: { bom_id: "${bom_id}", planned_qty: 1 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/kit"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/setup"
              payload: { line_program_id: "${prog_id}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "POST /work-orders/${wo_id}/units"
              payload: {}
              as: ProductionPlanner
