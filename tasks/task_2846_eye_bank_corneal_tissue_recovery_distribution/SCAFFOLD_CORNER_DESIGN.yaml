      - name: only_the_first_screening_record_moves_the_donor_referred_to_screening
        claim_type: valid_transition
        grounds:
          - state_machines.Donor.REFERRED_to_SCREENING
          - calculations.donor_screening_risk_score
          - "endpoints[POST /eye-bank/donors/{id}/screening-records]"
        distinguishing_aspect: |
          The FIRST screening record moves REFERRED -> SCREENING (donor version 1 -> 2); the
          second record leaves status at SCREENING but still recomputes the risk score to 35 and
          bumps the donor to version 3 — the transition fires once, the recompute fires every time.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one donor in REFERRED with screening_risk_score 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-S02", referral_source: "HOSPITAL", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
              captures: { donor_id: $.data.id }
          trigger:
            - call: "POST /eye-bank/donors/${donor_id}/screening-records"
              payload: { question_code: "TATTOO_12M", response: "NO", historian_relationship: "SPOUSE" }
              as: EyeBankCoordinator
            - call: "GET /eye-bank/donors/${donor_id}"
              payload: {}
              as: EyeBankCoordinator
              captures: { st1: $.data.status, v1: $.data.version, risk1: $.data.screening_risk_score }
            - call: "POST /eye-bank/donors/${donor_id}/screening-records"
              payload: { question_code: "HIV_RISK", response: "YES", historian_relationship: "SIBLING" }
              as: EyeBankCoordinator
            - call: "GET /eye-bank/donors/${donor_id}"
              payload: {}
              as: EyeBankCoordinator
              captures: { st2: $.data.status, v2: $.data.version, risk2: $.data.screening_risk_score }
          assert:
            - "${st1} == \"SCREENING\" and ${v1} == 2 and ${risk1} == 0"
            - "${st2} == \"SCREENING\" and ${v2} == 3 and ${risk2} == 35"

      - name: consent_before_any_screening_record_yields_err_donor_state_invalid
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Donor.SCREENING_to_CONSENT_OBTAINED
          - validations.priority_11
          - "errors[ERR_DONOR_STATE_INVALID]"
        distinguishing_aspect: |
          The consent transition's from-state is SCREENING only: consent on a REFERRED donor is
          refused 409 ERR_DONOR_STATE_INVALID and leaves consent_scope NONE and version 1.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one donor in REFERRED with no screening records"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
