              captures: { car_v2: $.data.version }
          trigger:
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "SUSPENDED" }
              as: ComplianceOfficer
              captures: { s1: $.data.status }
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { s2: $.data.status }
            - call: "POST /api/carriers/${car_id}/transition"
              payload: { to_status: "SUSPENDED" }
