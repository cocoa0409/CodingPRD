  - section: cross_cutting_layers
    instances:
      - name: stale_version_on_case_assign_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[case-assign-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Assign with expected_adjustment_case_version one behind the current version (an earlier assign already advanced it) fails with ERR_STALE_VERSION (412); the fresh version succeeds."
        test_recipe:
          setup: ["RETURN_ITEM case at version 1 from the return flow"]
          setup_api_calls:
            - call: "POST /bank/clearing-banks"
              payload: { name: "CB OCC", routing_number: "222000042" }
              as: OperationsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /bank/accounts"
              payload: { customer_name: "Cy", account_number: "A-2037", opening_balance_cents: 100000 }
              as: OperationsAdmin
