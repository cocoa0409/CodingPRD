scaffold_corner_design:
  - section: entities
    instances:
      - name: equipment_model_creation_returns_computed_scopes_and_unlisted_posture
        claim_type: Creation
        grounds:
          - entities.EquipmentModel
          - endpoints["POST /equipment-models"]
          - calculations.certification_posture
        distinguishing_aspect: "A brand-new ELECTRIC model must come back with required_scopes ['SANITATION','ELECTRICAL'] in the fixed scope order, empty covered_scopes and certification_posture UNLISTED -- posture is never defaulted to LISTED."
        test_recipe:
          setup:
            - "Empty database with the logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL", "TOUCH_PRO"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id, posture: $.data.certification_posture, required: $.data.required_scopes, covered: $.data.covered_scopes }
          assert:
            - "HTTP status == 201"
            - "${required} == ['SANITATION', 'ELECTRICAL']"
            - "${covered} == []"
            - "${posture} == UNLISTED"
            - "EquipmentModel.${model_id}.base_price_cents == 1850020"
            - "EquipmentModel.${model_id}.version == 1"

      - name: certification_listing_retrieval_returns_stored_row_with_null_decision_fields
        claim_type: Retrieval
        grounds:
          - entities.CertificationListing
          - endpoints["GET /certification-listings/{id}"]
        distinguishing_aspect: "A DRAFT listing read back by id must echo agency_code and scopes exactly as submitted while listed_on, expires_on, conditions_note and decided_by_user_id are all still null and revision is 0."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one ELECTRIC EquipmentModel; one DRAFT CertificationListing on AGENCY_GAMMA for [SANITATION, ELECTRICAL]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /certification-listings"
              payload: { equipment_model_id: "${model_id}", agency_code: "AGENCY_GAMMA", scopes: ["SANITATION", "ELECTRICAL"] }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { listing_id: $.data.id }
          trigger:
            - call: "GET /certification-listings/${listing_id}"
              payload: {}
              as: ListingReviewer
              as_user_id: "lr-1"
              captures: { st: $.data.status, rev: $.data.revision, listed: $.data.listed_on, exp: $.data.expires_on, decider: $.data.decided_by_user_id }
          assert:
            - "HTTP status == 200"
            - "${st} == DRAFT"
            - "${rev} == 0"
            - "${listed} is null"
            - "${exp} is null"
            - "${decider} is null"
            - "CertificationListing.${listing_id}.scopes == ['SANITATION', 'ELECTRICAL']"

      - name: chain_configuration_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints["GET /chain-configurations"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With exactly three configurations on one chain account, limit=2/offset=0 must return 2 rows with total_count 3 and has_more true, and offset=2 must return the remaining 1 row with has_more false -- total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one EquipmentModel; one ChainAccount carrying three ChainConfigurations CFG-1..CFG-3, each created with the then-current chain account version."
            - "Because all three share the same (chain_account_id, equipment_model_id) pair, CFG-1 and CFG-2 are SUPERSEDED by the later creations and only CFG-3 is DRAFT; the list endpoint still counts all three rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL", "TOUCH_PRO"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /chain-accounts"
              payload: { account_code: "CHN-1", name: "Skillet Chain", contracted_unit_volume: 250 }
              as: ChannelManager
              captures: { chain_id: $.data.id, v1: $.data.version }
            - call: "POST /chain-configurations"
              payload: { chain_account_id: "${chain_id}", equipment_model_id: "${model_id}", config_code: "CFG-1", option_codes: [], controls_package: "STANDARD_DIAL", branding_kit: "NONE", expected_chain_account_version: "${v1}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "GET /chain-accounts/${chain_id}"
              payload: {}
              as: ChannelManager
              captures: { v2: $.data.version }
            - call: "POST /chain-configurations"
              payload: { chain_account_id: "${chain_id}", equipment_model_id: "${model_id}", config_code: "CFG-2", option_codes: ["LEFT_HINGE"], controls_package: "STANDARD_DIAL", branding_kit: "NONE", expected_chain_account_version: "${v2}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "GET /chain-accounts/${chain_id}"
              payload: {}
              as: ChannelManager
              captures: { v3: $.data.version }
            - call: "POST /chain-configurations"
              payload: { chain_account_id: "${chain_id}", equipment_model_id: "${model_id}", config_code: "CFG-3", option_codes: ["ENERGY_SAVER"], controls_package: "TOUCH_PRO", branding_kit: "LOGO_BADGE", expected_chain_account_version: "${v3}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "GET /chain-configurations"
              payload: { chain_account_id: "${chain_id}", limit: 2, offset: 0 }
              as: ChannelManager
            - call: "GET /chain-configurations"
              payload: { chain_account_id: "${chain_id}", limit: 2, offset: 2 }
              as: ChannelManager
          assert:
            - "first response response_type == 'array'"
            - "first response meta contains api_request_id and api_request_timestamp"
            - "first response total_count == 3"
            - "first response has_more == true"
            - "first response limit == 2 and offset == 0"
            - "first response len(data) == 2"
            - "second response total_count == 3"
            - "second response has_more == false"
            - "second response len(data) == 1"
            - "the union of both pages contains exactly the config_code values ['CFG-1', 'CFG-2', 'CFG-3']"

      - name: connected_unit_get_with_unknown_id_returns_connected_resource_not_found
        claim_type: Not Found
        grounds:
          - endpoints["GET /connected-units/{id}"]
          - validations[priority=10]
          - errors[ERR_CONNECTED_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "A well-formed but unknown UUID on the connected-unit read must produce ERR_CONNECTED_RESOURCE_NOT_FOUND with HTTP 404 and the error envelope shape, not an empty 200 body."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no ConnectedUnit rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /connected-units/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ConnectedOpsEngineer
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_CONNECTED_RESOURCE_NOT_FOUND"
            - "response_type == 'error'"
            - "${msg} is a non-empty string"

      - name: site_order_creation_missing_committed_delivery_date_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints["POST /site-orders"].input
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "committed_delivery_date is a required input with no default, so omitting it must fail at priority 5 with ERR_INVALID_REQUEST (400) before any referential or state check runs -- even though the configuration referenced is still DRAFT and would otherwise trip priority 24."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one EquipmentModel, one ChainAccount, one DRAFT ChainConfiguration, one ConstructionProgram."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /chain-accounts"
              payload: { account_code: "CHN-1", name: "Skillet Chain", contracted_unit_volume: 250 }
              as: ChannelManager
              captures: { chain_id: $.data.id, chain_v: $.data.version }
            - call: "POST /chain-configurations"
              payload: { chain_account_id: "${chain_id}", equipment_model_id: "${model_id}", config_code: "CFG-1", option_codes: [], controls_package: "STANDARD_DIAL", branding_kit: "NONE", expected_chain_account_version: "${chain_v}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { cfg_id: $.data.id }
            - call: "POST /construction-programs"
              payload: { chain_account_id: "${chain_id}", program_code: "PRG-1", program_type: "NEW_BUILD", site_count_planned: 3 }
              as: ChainAdmin
              as_user_id: "${chain_id}"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /site-orders"
              payload: { construction_program_id: "${prog_id}", chain_configuration_id: "${cfg_id}", site_code: "SITE-1", unit_count: 10 }
              as: ChainAdmin
              as_user_id: "${chain_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "${err} != ERR_CONFIGURATION_NOT_RELEASED"
            - "no SiteOrder row exists for construction_program_id ${prog_id}"

      - name: connected_unit_creation_applies_firmware_recipe_and_telemetry_defaults
        claim_type: Defaults
        grounds:
          - entities.ConnectedUnit.fields.firmware_version
          - entities.ConnectedUnit.fields.recipe_book_version
          - entities.ConnectedUnit.fields.fault_count_30d
          - entities.ConnectedUnit.fields.health_score
          - endpoints["POST /connected-units"].side_effects
        distinguishing_aspect: "Registering a unit without the optional site_order_id must stamp firmware_version '1.0.0', recipe_book_version 1, fault_count_30d 0, missed_heartbeat_count 0 and health_score 100 (no COMPLETED campaign exists, so the firmware bonus is NOT applied and the score is exactly 100, not 105)."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one ELECTRIC EquipmentModel; no FirmwareCampaign rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["CONNECT_PLUS"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
          trigger:
            - call: "POST /connected-units"
              payload: { equipment_model_id: "${model_id}", serial_number: "SN-1", service_tier: "BASE" }
              as: ConnectedOpsEngineer
              captures: { unit_id: $.data.id, fw: $.data.firmware_version, rb: $.data.recipe_book_version, hs: $.data.health_score, so: $.data.site_order_id, st: $.data.service_program_status }
          assert:
            - "HTTP status == 201"
            - "${fw} == '1.0.0'"
            - "${rb} == 1"
            - "${hs} == 100"
            - "${so} is null"
            - "${st} == PENDING_INSTALL"
            - "ConnectedUnit.${unit_id}.fault_count_30d == 0"
            - "ConnectedUnit.${unit_id}.missed_heartbeat_count == 0"
            - "ConnectedUnit.${unit_id}.reserve_initial_cents == 0"
            - "ConnectedUnit.${unit_id}.reserve_balance_cents == 0"

      - name: chain_account_optional_dealer_and_consultant_fields_stay_null_when_omitted
        claim_type: Defaults
        grounds:
          - entities.ChainAccount.fields.dealer_of_record
          - entities.ChainAccount.fields.consultant_firm
          - endpoints["POST /chain-accounts"].input
        distinguishing_aspect: "dealer_of_record and consultant_firm are optional channel-attribution inputs: omitted they must remain null, and a later PATCH must set them without disturbing contracted_unit_volume."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chain-accounts"
              payload: { account_code: "CHN-1", name: "Skillet Chain", contracted_unit_volume: 250 }
              as: ChannelManager
              captures: { chain_id: $.data.id, dealer0: $.data.dealer_of_record, consultant0: $.data.consultant_firm }
          trigger:
            - call: "PATCH /chain-accounts/${chain_id}"
              payload: { dealer_of_record: "Northeast Restaurant Supply", consultant_firm: "Hearth Design Group" }
              as: ChannelManager
              captures: { dealer1: $.data.dealer_of_record, consultant1: $.data.consultant_firm, vol: $.data.contracted_unit_volume, ver: $.data.version }
          assert:
            - "${dealer0} is null"
            - "${consultant0} is null"
            - "${dealer1} == 'Northeast Restaurant Supply'"
            - "${consultant1} == 'Hearth Design Group'"
            - "${vol} == 250"
            - "${ver} == 2"

      - name: equipment_model_posture_is_computed_and_rederived_when_a_listing_is_granted
        claim_type: Computed Fields
        grounds:
          - entities.EquipmentModel.fields.certification_posture
          - entities.EquipmentModel.fields.covered_scopes
          - calculations.certification_posture
        distinguishing_aspect: "certification_posture and covered_scopes are computed, never client-supplied: the model create body cannot carry them, and the same model row flips UNLISTED -> LISTED purely as a consequence of a sibling CertificationListing reaching LISTED."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one ELECTRIC EquipmentModel with posture UNLISTED; one AGENCY_GAMMA listing for [SANITATION, ELECTRICAL] already UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id, posture0: $.data.certification_posture }
            - call: "POST /certification-listings"
              payload: { equipment_model_id: "${model_id}", agency_code: "AGENCY_GAMMA", scopes: ["SANITATION", "ELECTRICAL"] }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { listing_id: $.data.id }
            - call: "POST /certification-listings/${listing_id}/submissions"
              payload: {}
              as: ComplianceEngineer
              as_user_id: "ce-1"
            - call: "POST /certification-listings/${listing_id}/agency-decisions"
              payload: { decision: "ACKNOWLEDGE_REVIEW" }
              as: ListingReviewer
              as_user_id: "lr-1"
          trigger:
            - call: "POST /certification-listings/${listing_id}/agency-decisions"
              payload: { decision: "GRANT" }
              as: ListingReviewer
              as_user_id: "lr-1"
            - call: "GET /equipment-models/${model_id}"
              payload: {}
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { posture1: $.data.certification_posture, covered1: $.data.covered_scopes }
          assert:
            - "${posture0} == UNLISTED"
            - "${posture1} == LISTED"
            - "${covered1} == ['SANITATION', 'ELECTRICAL']"
            - "EquipmentModel.${model_id}.required_scopes == ['SANITATION', 'ELECTRICAL']"

      - name: chain_account_system_fields_minted_by_server_with_version_one
        claim_type: System Fields
        grounds:
          - entities.ChainAccount
          - endpoints["POST /chain-accounts"]
        distinguishing_aspect: "id must be a bare server-minted UUID with no type prefix, created_at and updated_at must be equal ISO-8601 UTC stamps at creation, and version must start at exactly 1 -- none of these are accepted from the client body."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /chain-accounts"
              payload: { account_code: "CHN-1", name: "Skillet Chain", contracted_unit_volume: 250 }
              as: ChannelManager
              captures: { chain_id: $.data.id, created: $.data.created_at, updated: $.data.updated_at, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "${chain_id} matches the bare UUID form with no prefix"
            - "${ver} == 1"
            - "${created} == ${updated}"
            - "${created} == '2026-08-01T00:00:00.000Z'"

      - name: equipment_model_invalid_category_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.EquipmentModel.fields.category
          - validations[priority=5]
        distinguishing_aspect: "category is a closed enum of five appliance families; a plausible-but-absent member ('SALAMANDER') must be rejected with ERR_INVALID_REQUEST (400) rather than stored."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /equipment-models"
              payload: { model_code: "SAL-100", name: "Salamander 100", category: "SALAMANDER", energy_type: "GAS", base_price_cents: 500000, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 40 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "no EquipmentModel row exists with model_code 'SAL-100'"

      - name: production_slot_window_end_not_after_window_start_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=5]
          - entities.ProductionSlot.fields.window_start
          - entities.ProductionSlot.fields.window_end
        distinguishing_aspect: "Priority 5 requires window_end > window_start, so a zero-length window is rejected with ERR_INVALID_REQUEST (400) before the overlap (34) or capacity (49) rules are consulted, on a build line that has no other slots at all."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; neither a RELEASED ChainConfiguration nor an existing SiteOrder is needed, because priority 5 precedes both the FK check at priority 9 and the release gate at priority 24."
            - "One EquipmentModel, ChainAccount, DRAFT ChainConfiguration, ConstructionProgram and one BuildLine with no slots at all; the slot request deliberately names a site_order_id that does not exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /chain-accounts"
              payload: { account_code: "CHN-1", name: "Skillet Chain", contracted_unit_volume: 250 }
              as: ChannelManager
              captures: { chain_id: $.data.id, chain_v: $.data.version }
            - call: "POST /chain-configurations"
              payload: { chain_account_id: "${chain_id}", equipment_model_id: "${model_id}", config_code: "CFG-1", option_codes: [], controls_package: "STANDARD_DIAL", branding_kit: "NONE", expected_chain_account_version: "${chain_v}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { cfg_id: $.data.id }
            - call: "POST /construction-programs"
              payload: { chain_account_id: "${chain_id}", program_code: "PRG-1", program_type: "NEW_BUILD", site_count_planned: 3 }
              as: ChainAdmin
              as_user_id: "${chain_id}"
              captures: { prog_id: $.data.id }
            - call: "POST /build-lines"
              payload: { line_code: "LN-1", plant_code: "P1", daily_capacity_units: 20, supported_energy_types: ["ELECTRIC"] }
              as: ProductionPlanner
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /production-slots"
              payload: { build_line_id: "${line_id}", site_order_id: "00000000-0000-4000-8000-000000000000", window_start: "2026-09-07T00:00:00Z", window_end: "2026-09-07T00:00:00Z", units: 5 }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "${err} != ERR_PRODUCTION_RESOURCE_NOT_FOUND"
            - "BuildLine.${line_id}.committed_units == 0"

      - name: chain_configuration_with_unknown_chain_account_returns_chain_resource_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=8]
          - errors[ERR_CHAIN_RESOURCE_NOT_FOUND]
          - entities.ChainConfiguration.fields.chain_account_id
        distinguishing_aspect: "The FK parent must exist before the OCC token is even considered: an unknown chain_account_id yields ERR_CHAIN_RESOURCE_NOT_FOUND (404) at priority 8, not the priority 13 stale-version 412, even though the supplied expected_chain_account_version cannot possibly match."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one EquipmentModel; exactly one ChainAccount CHN-1 whose current version is read so the token below is genuinely fresh for THAT account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /chain-accounts"
