      - name: report_period_outside_the_agreement_term_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=30]
          - errors.ERR_PERIOD_OUTSIDE_TERM
          - endpoints[POST /royalty-reports]
        distinguishing_aspect: "The period must be fully contained in the agreement term at both ends, and the containment check is INCLUSIVE: period_start exactly equal to term_start is accepted while one second earlier is not. Priority 29's well-orderedness passes first, so the surviving error is ERR_PERIOD_OUTSIDE_TERM and not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One Propagator with an ACTIVE agreement whose term is 2026-08-01T00:00:00Z .. 2027-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /propagators"
              payload: { legal_name: "Fernwood Nursery", home_territory_code: "US-WA" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { p_id: $.data.id }
            - call: "POST /propagator-agreements"
              payload: { propagator_id: "${p_id}", quality_tier: "TIER_B", territory_codes: ["US-WA"], term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: LicensingOfficer
              as_user_id: "officer-1"
              captures: { a_id: $.data.id }
            - call: "POST /propagator-agreements/${a_id}/countersign"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /royalty-reports"
              payload: { agreement_id: "${a_id}", period_code: "2026Q2", period_start: "2026-07-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", due_at: "2026-10-15T00:00:00Z" }
              as: Propagator
              as_user_id: "${p_id}"
          assert:
            - "HTTP status is 422 and data.error_id == ERR_PERIOD_OUTSIDE_TERM"
            - "GET /royalty-reports returns total_count == 0"
            - "period_start 2026-08-01T00:00:00Z with period_end 2026-11-01T00:00:00Z and due_at 2026-11-15T00:00:00Z is accepted - the lower bound is inclusive"
            - "period_end 2027-09-01T00:00:00Z (past term_end) with due_at 2027-09-15T00:00:00Z also returns ERR_PERIOD_OUTSIDE_TERM - the check binds at both ends"
            - "period_end 2026-11-01T00:00:00Z with due_at 2026-10-01T00:00:00Z returns ERR_INVALID_INTERVAL instead, because priority 29 outranks priority 30"

      - name: two_non_exclusive_grants_may_overlap_in_one_territory
