              captures: { res_h: $.data.id }
            - call: "POST /service-floor/reservations/${res_h}/events"
              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "GET /service-floor/tables/${table2_id}"
              payload: {}
              as: Host
              captures: { v_table2_id_hold13: $.data.version }
            - call: "POST /service-floor/reservations/${res_h}/holds"
              payload: { expected_table_version: "${v_table2_id_hold13}", table_id: "${table2_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_h}/seat"
              payload: {}
              as: Host
            - call: "GET /service-floor/parties/${party_silver_id}"
              payload: {}
              as: Host
              captures: { silver_credit_before: $.data.loyalty_credit_cents }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T02:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-floor/reservations/${res_h}/events"
              payload: { event_type: "MARK_NO_SHOW" }
