              as: Manager
              captures: { fvt: "$.data.id" }
            - call: "POST /v1/sessions"
              payload: { table_id: "${fvt}" }
              as: FrontDesk
              captures: { fvs: "$.data.id" }
            - call: "POST /v1/fnb-orders"
              payload: { session_id: "${fvs}", line_items: [ { name: "Chips", unit_price_cents: 300, qty: 1 } ] }
              as: FrontDesk
              captures: { fvo: "$.data.id" }
          trigger:
            - call: "POST /v1/fnb-orders/${fvo}/void"
              payload: {}
              as: FrontDesk
          assert:
            - "FnbOrder.${fvo}.status == VOIDED"

      - name: product_sell_decrements_stock
        claim_type: Action endpoint
        grounds: [endpoints, entities.ProShopProduct.fields.stock_qty]
        distinguishing_aspect: "POST /v1/products/{id}/sell qty 2 on stock 5 leaves stock_qty 3."
        test_recipe:
          setup: ["A CUE product with stock 5."]
          setup_api_calls:
            - call: "POST /v1/products"
              payload: { sku: "REVO-1", name: "Revo Cue", category: "CUE", unit_price_cents: 45000, stock_qty: 5 }
              as: ProShopStaff
              captures: { psp: "$.data.id" }
          trigger:
            - call: "POST /v1/products/${psp}/sell"
              payload: { qty: 2 }
              as: ProShopStaff
          assert:
            - "ProShopProduct.${psp}.stock_qty == 3"

      - name: product_sell_exceeds_stock_precondition
        claim_type: Conditional action
        grounds: ["validations[priority=12]", "errors[ERR_PRECONDITION_NOT_MET]"]
        distinguishing_aspect: "Selling qty 5 of a product with stock 1 returns ERR_PRECONDITION_NOT_MET (409) and does not change stock."
        test_recipe:
          setup: ["A CASE product with stock 1."]
          setup_api_calls:
            - call: "POST /v1/products"
              payload: { sku: "CASE-1", name: "2x4 Case", category: "CASE", unit_price_cents: 12000, stock_qty: 1 }
              as: ProShopStaff
              captures: { pxp: "$.data.id" }
          trigger:
            - call: "POST /v1/products/${pxp}/sell"
              payload: { qty: 5 }
              as: ProShopStaff
              captures: { epx: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_PRECONDITION_NOT_MET"
            - "ProShopProduct.${pxp}.stock_qty == 1"

      - name: product_restock_nonpositive_qty_returns_stock_negative
        claim_type: Conditional action
        grounds: [endpoints, "errors[ERR_STOCK_NEGATIVE]"]
        distinguishing_aspect: "POST /v1/products/{id}/restock with qty 0 returns ERR_STOCK_NEGATIVE (422)."
        test_recipe:
          setup: ["An ACCESSORY product with stock 3."]
          setup_api_calls:
            - call: "POST /v1/products"
              payload: { sku: "CHALK-1", name: "Chalk", category: "ACCESSORY", unit_price_cents: 500, stock_qty: 3 }
              as: ProShopStaff
              captures: { prp: "$.data.id" }
          trigger:
            - call: "POST /v1/products/${prp}/restock"
              payload: { qty: 0 }
              as: ProShopStaff
              captures: { epr: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_STOCK_NEGATIVE"

      - name: repair_flow_pickup_debits_member_wallet
        claim_type: Action endpoint
        grounds: [state_machines.RepairOrder.READY_to_PICKED_UP, entities.RepairOrder.fields.quote_cents]
        distinguishing_aspect: "A CUE_RETIP repair RECEIVED->IN_PROGRESS->READY->PICKED_UP debits the member wallet by quote_cents 3000."
        test_recipe:
          setup: ["Funded member; a CUE_RETIP repair quoted 3000, driven to READY."]
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
              captures: { rpp: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "rp1@x.com", full_name: "RP One", plan_id: "${rpp}" }
              as: Manager
              captures: { rpm: "$.data.id" }
            - call: "POST /v1/members/${rpm}/wallet/adjustments"
              payload: { amount_cents: 10000 }
              as: Manager
            - call: "POST /v1/repair-orders"
              payload: { member_id: "${rpm}", service_type: "CUE_RETIP", quote_cents: 3000 }
              as: Member
              as_user_id: "${rpm}"
              captures: { rpo: "$.data.id" }
            - call: "POST /v1/repair-orders/${rpo}/start"
              payload: {}
              as: ProShopStaff
            - call: "POST /v1/repair-orders/${rpo}/ready"
              payload: {}
              as: ProShopStaff
          trigger:
            - call: "POST /v1/repair-orders/${rpo}/pickup"
              payload: {}
              as: FrontDesk
          assert:
            - "RepairOrder.${rpo}.status == PICKED_UP"
            - "Member.${rpm}.wallet_credit_cents == 7000"

      - name: reservation_nonexistent_table_returns_not_found
        claim_type: Cross-reference link
        grounds: [entities.Reservation.fields.table_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /v1/reservations with a table_id that resolves to nothing returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["A member exists; no table with the referenced id."]
          setup_api_calls:
            - call: "POST /v1/plans"
              payload: { tier: "BRONZE", monthly_fee_cents: 3000, table_discount_pct: 0.0 }
              as: Manager
              captures: { rnfp: "$.data.id" }
            - call: "POST /v1/members"
              payload: { email: "rnf@x.com", full_name: "RNF", plan_id: "${rnfp}" }
              as: Manager
              captures: { rnfm: "$.data.id" }
          trigger:
            - call: "POST /v1/reservations"
              payload: { member_id: "${rnfm}", table_id: "00000000-0000-4000-8000-000000000000", start_at: "2026-07-09T10:00:00Z", end_at: "2026-07-09T11:00:00Z", party_size: 2 }
              as: FrontDesk
              captures: { ernf: "$.data.error_id" }
          assert:
            - "trigger response data.error_id == ERR_NOT_FOUND"

