scenario: "Commercial Waste Contract Terms, Surcharges & Service Changes (Waste Management): commercial service agreements with multi-year terms, automatic renewal provisions and cancellation notice windows, rate adjustment mechanisms including fuel, environmental and administrative surcharges applied as percentages of base charges, container size and service frequency changes requested by customers with pricing recalculation, contamination and overweight charges assessed at collection with photo evidence and dispute handling, competitive right-of-first-refusal clauses allowing the incumbent to match a competing offer, liquidated damages on early termination and their calculation, service failure credits and missed pickup remediation, roll-off and temporary service pricing separate from ongoing contracts"
domain_name: commercial-waste-contracts
api_prefix: /api

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: multi_party_negotiation
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, ops_run_checkpoint]
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Customer legal business name; required.
      - name: billing_email
        type: string
        source: input
        description: Billing contact email; required.
      - name: credit_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Ledger balance maintained by cascade: == sum of ServiceCredit.credit_cents with status ACTIVE for lines on this customer's contracts, minus sum of CancellationRequest.ld_total_cents with ld_status ASSESSED on this customer's contracts. May go negative. Input value ignored."

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; owning customer."
      - name: start_date
        type: datetime
        source: input
        description: Contract start (ISO8601 UTC); required.
      - name: term_months
        type: integer
        source: input
        description: Initial term length in whole months; required; >= 1.
      - name: end_date
        type: datetime
        source: computed
        description: "end_date = start_date + term_months months (same day-of-month); extended by renewal_term_months on each auto-renewal. Input value ignored."
      - name: renewal_term_months
        type: integer
        source: input
        default: 12
        description: Months added to end_date on each automatic renewal.
      - name: cancellation_notice_days
        type: integer
        source: input
        default: 60
        description: Days before end_date by which a cancellation's requested_end_date must fall to avoid liquidated damages.
      - name: rofr_enabled
        type: boolean
        source: input
        default: false
        description: Whether the right-of-first-refusal clause applies to this contract.
      - name: rofr_window_days
        type: integer
        source: input
        default: 15
        description: Days the incumbent has to exercise ROFR after a competing offer is submitted.
      - name: status
        type: enum
        source: system
        constraints: "one of DRAFT, ACTIVE, TERMINATION_PENDING, TERMINATED"
        description: Lifecycle status; see Contract state machine.
      - name: current_term_index
        type: integer
        source: system
        default: 1
        description: 1 during initial term; incremented by 1 on each auto-renewal.
      - name: base_monthly_total_cents
        type: integer
        source: computed
        default: 0
        description: "== sum of base_rate_cents over all ContractServiceLine rows of this contract; recomputed on every line create, rate-notice application, service-change application, and ROFR match."

  - name: ContractServiceLine
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id."
      - name: container_size
        type: enum
        source: input
        constraints: "one of CY_2, CY_4, CY_6, CY_8"
        description: Container size in cubic yards.
      - name: frequency_per_week
        type: integer
        source: input
        constraints: "1..6"
        description: Scheduled pickups per week.
      - name: base_rate_cents
        type: integer
        source: input
        description: Monthly base charge in cents; required; >= 0. Mutated by rate notices, service changes, and ROFR matches.

  - name: PickupEvent
    parent: null
    common_fields: true
    fields:
      - name: service_line_id
        type: string
        source: input
        description: "FK -> ContractServiceLine.id."
      - name: occurred_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) of the collection attempt; required.
      - name: outcome
        type: enum
        source: input
        constraints: "one of COMPLETED, MISSED, CONTAMINATED, OVERWEIGHT, CONTAMINATED_OVERWEIGHT"
        description: Collection outcome.
      - name: photo_evidence_url
        type: string
        source: input
        description: Required when outcome is CONTAMINATED, OVERWEIGHT, or CONTAMINATED_OVERWEIGHT; otherwise optional.
      - name: contamination_fee_cents
        type: integer
        source: computed
        default: 0
        description: "== active SurchargeConfig.contamination_fee_cents at occurred_date when outcome includes contamination, else 0."
      - name: overweight_fee_cents
        type: integer
        source: computed
        default: 0
        description: "== active SurchargeConfig.overweight_fee_cents at occurred_date when outcome includes overweight, else 0."
      - name: dispute_status
        type: enum
        source: system
        constraints: "one of NONE, DISPUTED, RESOLVED_UPHELD, RESOLVED_CREDITED"
        default: NONE
        description: Dispute dimension; see PickupEvent state machine.
      - name: appeal_count
        type: integer
        source: system
        default: 0
        description: Number of times a RESOLVED_UPHELD event has been re-disputed; max 1.

  - name: SurchargeConfig
    parent: null
    common_fields: true
    fields:
      - name: fuel_mode
        type: enum
        source: input
        constraints: "one of FIXED, INDEXED"
        description: Fuel surcharge mode.
      - name: fuel_fixed_pct
        type: number
        source: input
        description: Fuel surcharge fraction of base when fuel_mode=FIXED (e.g. 0.12); required for FIXED.
      - name: fuel_index_base
        type: number
        source: input
        description: Baseline fuel index price; required for INDEXED.
      - name: fuel_index_current
        type: number
        source: input
        description: Current fuel index price; required for INDEXED.
      - name: environmental_pct
        type: number
        source: input
        description: Environmental surcharge fraction of base (e.g. 0.10); required.
      - name: admin_pct
        type: number
        source: input
        description: Administrative surcharge fraction of base (e.g. 0.05); required.
      - name: contamination_fee_cents
        type: integer
        source: input
        description: Flat contamination fee per event; required.
      - name: overweight_fee_cents
        type: integer
        source: input
        description: Flat overweight fee per event; required.
      - name: effective_from
        type: datetime
        source: input
        description: Start of this config's active window; the active config at time T is the one with max effective_from <= T. No two configs may share an effective_from.
  - name: RateAdjustmentNotice
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id."
      - name: reason
        type: enum
        source: input
        constraints: "one of CPI, FUEL_INDEX, COST_RECOVERY"
        description: Reason for the rate adjustment.
      - name: pct_increase
        type: number
        source: input
        description: Fractional increase (e.g. 0.05 = 5%); required; > 0.
      - name: effective_date
        type: datetime
        source: input
        description: Date from which the new base rate applies; must be strictly after logical-clock now at filing.
      - name: status
        type: enum
        source: system
        constraints: "one of SCHEDULED, APPLIED, CANCELLED"
        default: SCHEDULED
        description: See RateAdjustmentNotice state machine.

  - name: ServiceChangeRequest
    parent: null
    common_fields: true
    fields:
      - name: service_line_id
        type: string
        source: input
        description: "FK -> ContractServiceLine.id."
      - name: new_container_size
        type: enum
        source: input
        constraints: "one of CY_2, CY_4, CY_6, CY_8"
        description: Requested container size (may equal current when only frequency changes).
      - name: new_frequency_per_week
        type: integer
        source: input
        constraints: "1..6"
        description: Requested pickups per week (may equal current when only size changes).
      - name: effective_date
        type: datetime
        source: input
        description: Requested start date for the change; must be strictly after logical-clock now.
      - name: old_rate_cents
        type: integer
        source: system
        description: Line base_rate_cents captured at request creation.
      - name: quoted_new_rate_cents
        type: integer
        source: computed
        description: "= calc_service_change_quote(old_rate_cents, frequency_per_week, new_frequency_per_week) at creation."
      - name: final_applied_rate_cents
        type: integer
        source: computed
        description: "= quote recomputed from the line's base_rate_cents current at apply time (rate notices may have changed it). Null until APPLIED."
      - name: status
        type: enum
        source: system
        constraints: "one of PENDING, APPROVED, APPLIED, REJECTED, CANCELLED"
        default: PENDING
        description: See ServiceChangeRequest state machine.

  - name: CompetingOffer
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; must have rofr_enabled=true."
      - name: competitor_monthly_cents
        type: integer
        source: input
        description: Competing total monthly offer in cents; required; > 0.
      - name: evidence_doc_url
        type: string
        source: input
        description: Competing offer document reference; required.
      - name: status
        type: enum
        source: system
        constraints: "one of SUBMITTED, MATCHED, NOT_MATCHED, VOID"
        default: SUBMITTED
        description: See CompetingOffer state machine.

  - name: CancellationRequest
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id."
      - name: requested_end_date
        type: datetime
        source: input
        description: Date the customer wants service to end; must be strictly after logical-clock now.
      - name: timely
        type: boolean
        source: computed
        description: "== (requested_end_date <= contract.end_date - cancellation_notice_days days)."
      - name: months_remaining
        type: integer
        source: computed
        description: "Calendar months from requested_end_date to contract.end_date with any partial month rounded UP to a full month (ceil); 0 when timely."
      - name: ld_base_cents
        type: integer
        source: computed
        description: "contract.base_monthly_total_cents at approval."
      - name: ld_total_cents
        type: integer
        source: computed
        description: "When untimely: ld_base_cents * months_remaining * 0.5, rounded half-up to cents. 0 when timely."
      - name: ld_status
        type: enum
        source: system
        constraints: "one of NONE, ASSESSED, WAIVED"
        default: NONE
        description: "ASSESSED on approval of an untimely cancellation; may transition to WAIVED; drives Customer.credit_balance_cents."
      - name: status
        type: enum
        source: system
        constraints: "one of PENDING, APPROVED, DENIED, WITHDRAWN"
        default: PENDING
        description: See CancellationRequest state machine.

  - name: ServiceCredit
    parent: null
    common_fields: true
    fields:
      - name: service_line_id
        type: string
        source: input
        description: "FK -> ContractServiceLine.id."
      - name: pickup_event_id
        type: string
        source: input
        description: "FK -> PickupEvent.id; must reference a PickupEvent with outcome MISSED on the same service line. One credit per missed event."
      - name: credit_cents
        type: integer
        source: computed
        description: "= floor(base_rate_cents * active SurchargeConfig.credit_pct_of_base) at filing; server-computed, input ignored."
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock timestamp of filing; eligibility requires filed_at <= pickup.occurred_date + credit_filing_window_days.
      - name: status
        type: enum
        source: system
        constraints: "one of ACTIVE, CANCELLED"
        default: ACTIVE
        description: CANCELLED when the source event's dispute resolves RESOLVED_CREDITED (fees already refunded).

  - name: RolloffOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; roll-off/temporary service, priced independently of any contract."
      - name: container_size
        type: enum
        source: input
        constraints: "one of YD_10, YD_20, YD_30, YD_40"
        description: Roll-off container size.
      - name: delivery_date
        type: datetime
        source: input
        description: Requested delivery date.
      - name: rental_days
        type: integer
        source: input
        constraints: "1..30"
        description: Rental length in days.
      - name: included_tons
        type: number
        source: input
        default: 2.0
        description: Tonnage included in the flat rental rate.
      - name: actual_tons
        type: number
        source: input
        description: Recorded at completion; required to complete.
      - name: delivery_fee_cents
        type: integer
        source: input
        description: Flat delivery fee; required.
      - name: daily_rental_cents
        type: integer
        source: input
        description: Per-day rental rate; required.
      - name: overage_ton_cents
        type: integer
        source: input
        description: Charge per ton (or part) above included_tons; required.
      - name: total_cents
        type: integer
        source: computed
        description: "= calc_rolloff_total at completion; 0 until COMPLETED."
      - name: status
        type: enum
        source: system
        constraints: "one of RESERVED, DELIVERED, COMPLETED, CANCELLED"
        default: RESERVED
        description: See RolloffOrder state machine.

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: contract_id
        type: string
        source: system
        description: "FK -> Contract.id."
      - name: effective_date
        type: datetime
        source: system
        description: Date the rate change takes effect.
      - name: old_base_monthly_cents
        type: integer
        source: system
        description: Contract base_monthly_total_cents before the change.
      - name: new_base_monthly_cents
        type: integer
        source: system
        description: Contract base_monthly_total_cents after the change.
      - name: source
        type: enum
        source: system
        constraints: "one of RATE_NOTICE, SERVICE_CHANGE, ROFR_MATCH"
        description: What caused the rate change.

state_machines:
  - entity: Contract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/contracts/{id}/activate"
        actor: OpsManager
        preconditions:
          - "contract has at least one ContractServiceLine"
          - "contract.start_date <= logical-clock now"
        side_effects:
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "system event: logical-clock now >= end_date (auto-renewal on every clock advance)"
        actor: system
        preconditions: []
        side_effects:
          - "end_date := end_date + renewal_term_months months; current_term_index += 1; increments Contract.version by 1"
      - from: ACTIVE
        to: TERMINATION_PENDING
        trigger: "POST /api/cancellation-requests/{id}/approve (untimely path)"
        actor: OpsManager
        preconditions: ["cancellation request status == PENDING"]
        side_effects:
          - "cancellation.ld_total_cents := calc_ld_amount; ld_status := ASSESSED"
          - "customer.credit_balance_cents -= ld_total_cents (customer cascade caused by the LD assessment)"
          - "cancels every SCHEDULED RateAdjustmentNotice on this contract"
          - "cancels every PENDING or APPROVED ServiceChangeRequest on this contract's lines (each moves to CANCELLED)"
          - "voids every SUBMITTED CompetingOffer on this contract (each moves to VOID)"
      - from: TERMINATION_PENDING
        to: TERMINATED
        trigger: "system event: logical-clock now >= cancellation.requested_end_date"
        actor: system
        preconditions: []
        side_effects: ["increments Contract.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/cancellation-requests/{id}/approve (timely path: ld_total_cents == 0)"
        actor: OpsManager
        preconditions: ["cancellation request status == PENDING", "cancellation.timely == true"]
        side_effects:
          - "cancels every SCHEDULED RateAdjustmentNotice, every PENDING/APPROVED ServiceChangeRequest, voids every SUBMITTED CompetingOffer on this contract"
      - from: TERMINATED
        to: ACTIVE
        trigger: "POST /api/contracts/{id}/reinstate"
        actor: OpsManager
        preconditions: ["logical-clock now < contract.end_date"]
        side_effects: ["increments Contract.version by 1"]

  - entity: RateAdjustmentNotice
    initial_state: SCHEDULED
    terminal_states: [APPLIED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: APPLIED
        trigger: "system event: logical-clock now >= effective_date"
        actor: system
        preconditions: []
        side_effects:
          - "for each line on the contract: line.base_rate_cents := round_half_up(base_rate_cents * (1 + pct_increase))"
          - "recomputes contract.base_monthly_total_cents (sum of line rates); writes LedgerEntry(source=RATE_NOTICE); increments Contract.version by 1"
          - "if contract has exactly one PENDING ServiceChangeRequest with status PENDING and its quoted rate differs from a recompute at the new base, that request's quoted_new_rate_cents is NOT re-quoted (quote stays); application later reprices from the new base"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/rate-notices/{id}/cancel or cascade from contract termination-approve"
        actor: OpsManager
        preconditions: ["logical-clock now < effective_date"]
        side_effects: []

  - entity: ServiceChangeRequest
    initial_state: PENDING
    terminal_states: [APPLIED, REJECTED, CANCELLED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /api/service-changes/{id}/approve"
        actor: OpsManager
        preconditions:
          - "owning contract status == ACTIVE"
          - "no other APPROVED ServiceChangeRequest exists on the same service line"
        side_effects: []
      - from: PENDING
        to: REJECTED
        trigger: "POST /api/service-changes/{id}/reject"
        actor: OpsManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: APPLIED
        trigger: "POST /api/service-changes/{id}/apply"
        actor: OpsManager
        preconditions: ["logical-clock now >= effective_date"]
        side_effects:
          - "final_applied_rate_cents := calc_service_change_quote(line.base_rate_cents at apply time, line.frequency_per_week, new_frequency_per_week); line.base_rate_cents := final_applied_rate_cents; line.container_size := new_container_size; line.frequency_per_week := new_frequency_per_week"
          - "recomputes contract.base_monthly_total_cents; writes LedgerEntry(source=SERVICE_CHANGE); increments Contract.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /api/service-changes/{id}/withdraw"
        actor: Customer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "cascade from contract termination-approve"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PickupEvent
    initial_state: NONE
    terminal_states: [RESOLVED_CREDITED]
    transitions:
      - from: NONE
        to: DISPUTED
        trigger: "POST /api/pickup-events/{id}/dispute"
        actor: Customer
        preconditions:
          - "event outcome in {CONTAMINATED, OVERWEIGHT, CONTAMINATED_OVERWEIGHT}"
          - "logical-clock now <= occurred_date + 30 days"
        side_effects: []
      - from: DISPUTED
        to: RESOLVED_UPHELD
        trigger: "POST /api/pickup-events/{id}/resolve-dispute with resolution=UPHELD"
        actor: OpsManager
        preconditions: []
        side_effects: []
      - from: RESOLVED_UPHELD
        to: DISPUTED
        trigger: "POST /api/pickup-events/{id}/dispute (re-dispute cycle)"
        actor: Customer
        preconditions: ["appeal_count == 0"]
        side_effects: ["appeal_count := 1"]
      - from: DISPUTED
        to: RESOLVED_CREDITED
        trigger: "POST /api/pickup-events/{id}/resolve-dispute with resolution=CREDITED"
        actor: OpsManager
        preconditions: []
        side_effects:
          - "cancels any ACTIVE ServiceCredit whose pickup_event_id == this event (credit status := CANCELLED), which recomputes customer.credit_balance_cents upward by that credit's credit_cents"

  - entity: CompetingOffer
    initial_state: SUBMITTED
    terminal_states: [MATCHED, NOT_MATCHED, VOID]
    transitions:
      - from: SUBMITTED
        to: MATCHED
        trigger: "POST /api/competing-offers/{id}/match"
        actor: OpsManager
        preconditions:
          - "logical-clock now <= offer.created_at + contract.rofr_window_days days"
          - "no other SUBMITTED CompetingOffer exists on the same contract"
          - "contract status == ACTIVE"
        side_effects:
          - "matched_rate := max(0, competitor_monthly_cents - 500); each line's base_rate_cents := round_half_up(line.base_rate_cents * matched_rate / contract.base_monthly_total_cents); contract.base_monthly_total_cents := matched_rate"
          - "writes LedgerEntry(source=ROFR_MATCH); increments Contract.version by 1"
      - from: SUBMITTED
        to: NOT_MATCHED
        trigger: "POST /api/competing-offers/{id}/decline-match"
        actor: OpsManager
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: VOID
        trigger: "cascade from contract termination-approve"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CancellationRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /api/cancellation-requests/{id}/approve"
        actor: OpsManager
        preconditions: ["contract status == ACTIVE"]
        side_effects: ["see Contract ACTIVE->TERMINATION_PENDING (untimely) or ACTIVE->TERMINATED (timely)"]
      - from: PENDING
        to: DENIED
        trigger: "POST /api/cancellation-requests/{id}/deny"
        actor: OpsManager
        preconditions: []
        side_effects: []
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /api/cancellation-requests/{id}/withdraw"
        actor: Customer
        preconditions: ["logical-clock now <= requested_end_date"]
        side_effects: []

  - entity: RolloffOrder
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: RESERVED
        to: DELIVERED
        trigger: "POST /api/rolloff-orders/{id}/deliver"
        actor: OpsManager
        preconditions: ["logical-clock now >= delivery_date"]
        side_effects: []
      - from: DELIVERED
        to: COMPLETED
        trigger: "POST /api/rolloff-orders/{id}/complete"
        actor: OpsManager
        preconditions: ["actual_tons provided"]
        side_effects: ["total_cents := calc_rolloff_total(delivery_fee_cents, daily_rental_cents, rental_days, included_tons, actual_tons, overage_ton_cents)"]
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /api/rolloff-orders/{id}/cancel"
        actor: Customer
        preconditions: ["logical-clock now < delivery_date"]
        side_effects: []

concurrency_rules:
  - rule_id: offer-match-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /api/competing-offers/{id}/match"
    occ_field: "expected_contract_version"
    description: |
      Matching a competing offer against a Contract whose version has advanced
      since the client last observed it is rejected: a prior match, rate-notice
      application, or service-change application has legitimately re-priced the
      contract under the ROFR rules, so the current writer's view of
      base_monthly_total_cents is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: service-change-apply-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /api/service-changes/{id}/apply"
    occ_field: "expected_contract_version"
    description: |
      Applying an approved service change against a Contract whose version has
      advanced since the client last observed it is rejected: a rate-notice
      application or ROFR match in between changes the base rate the final
      price is computed from, so repricing must be re-observed before apply.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: calc_monthly_invoice
    trigger: "GET /api/contracts/{id}/monthly-invoice"
    algorithm: aggregation
    formula: |
      B = contract.base_monthly_total_cents  (sum of line base_rate_cents)
      cfg = active SurchargeConfig at logical-clock now
      fuel_pct = cfg.fuel_fixed_pct if cfg.fuel_mode == FIXED
               else max(0, cfg.fuel_index_current - cfg.fuel_index_base) / cfg.fuel_index_base
      fuel_cents = round_half_up(B * fuel_pct)
      env_cents  = round_half_up(B * cfg.environmental_pct)
      admin_cents= round_half_up(B * cfg.admin_pct)
      fees_cents = sum over pickup events on this contract's lines in the window
                   [now - 30 days, now] of (contamination_fee_cents + overweight_fee_cents)
      credits_cents = sum of credit_cents over ServiceCredit rows (status ACTIVE)
                      on this contract's lines
      total_cents = B + fuel_cents + env_cents + admin_cents + fees_cents - credits_cents
      Rounding order is pinned: each surcharge line is rounded individually BEFORE summation;
      summing unrounded values then rounding is forbidden.
    input_set: "Contract with its lines; pickup events with occurred_date in [now-30d, now]; ACTIVE service credits on the contract's lines; active SurchargeConfig."
    precision: "integer cents; per-component round_half_up before summation"
    variants:
      - name: fixed_fuel
        when: "active SurchargeConfig.fuel_mode == FIXED"
        difference: "fuel_pct = fuel_fixed_pct regardless of index values"
      - name: indexed_fuel
        when: "active SurchargeConfig.fuel_mode == INDEXED"
        difference: "fuel_pct = max(0, current - base)/base; a current index below base yields 0 fuel surcharge, never negative"

  - name: calc_ld_amount
    trigger: "POST /api/cancellation-requests/{id}/approve when cancellation.timely == false"
    algorithm: constraint_propagation
    formula: |
      timely = (requested_end_date <= contract.end_date - contract.cancellation_notice_days days)
      months_remaining = 0 if timely else calendar months from requested_end_date
        to contract.end_date with any partial month rounded UP (ceil; both dates are
        day-aligned). Example: 2027-07-04 to 2027-09-01 = 1 whole month + 28 days -> 2.
      ld_base_cents = contract.base_monthly_total_cents at approval time
      ld_total_cents = timely ? 0 : round_half_up(ld_base_cents * months_remaining * 0.5)
      Evaluation order is pinned: timely -> months_remaining -> ld_total_cents
      (months_remaining must NOT be computed from a prorated daily fraction).
    input_set: "CancellationRequest + its Contract"
    constants: { LD_FRACTION: 0.5 }
    precision: "integer cents, round_half_up"
    variants:
      - name: timely_cancel
        when: "requested_end_date <= end_date - cancellation_notice_days"
        difference: "months_remaining forced to 0; ld_total_cents = 0; contract goes straight to TERMINATED"
      - name: untimely_cancel
        when: "requested_end_date > end_date - cancellation_notice_days"
        difference: "months_remaining computed from end_date; LD assessed and debited from customer credit balance"

  - name: calc_service_change_quote
    trigger: "POST /api/service-change-requests (quote, variant A) and POST /api/service-changes/{id}/apply (final, variant B)"
    algorithm: tiered_pricing
    formula: |
      freq = line.frequency_per_week (current)
      new_freq = new_frequency_per_week
      weekly_cents = base_rate_cents / freq          # per-pickup unit, float
      if new_freq > freq:                            # upgrade: premium multiplier
        quoted = round_half_up(weekly_cents * new_freq * 1.10)
      else:                                          # downgrade: discount multiplier
        quoted = round_half_up(weekly_cents * new_freq * 0.95)
      Container size does not change the price by itself; only the frequency
      ratio and direction matter. Circular-looking dependency (base appears on
      both sides) is resolved by pinned order: weekly unit first, then scale.
    input_set: "ContractServiceLine current values + requested new_frequency_per_week"
    constants: { UPGRADE_MULT: 1.10, DOWNGRADE_MULT: 0.95 }
    precision: "integer cents, round_half_up"
    variants:
      - name: quote_at_request
        when: "at ServiceChangeRequest creation"
        difference: "base_rate_cents is the line's rate at creation time; stored in quoted_new_rate_cents"
      - name: final_at_apply
        when: "at POST /api/service-changes/{id}/apply"
        difference: "base_rate_cents re-read from the line at apply time; an intervening rate notice changes the result; stored in final_applied_rate_cents"

  - name: calc_rofr_match
    trigger: "POST /api/competing-offers/{id}/match"
    algorithm: waterfall_allocation
    formula: |
      matched_rate_cents = max(0, offer.competitor_monthly_cents - 500)
      Allocation across lines is proportional: for each line i,
        new_rate_i = round_half_up(line_i.base_rate_cents * matched_rate_cents / contract.base_monthly_total_cents)
      Lines are processed in order of (base_rate_cents DESC, created_at ASC);
      any rounding remainder (matched_rate_cents - sum(new_rate_i)) is added to
      the first line in that order so the new total equals matched_rate_cents exactly.
    input_set: "CompetingOffer + Contract with all its lines"
    constants: { ROFR_UNDERCUT_CENTS: 500 }
    precision: "integer cents, round_half_up; remainder allocated to largest line"

  - name: calc_customer_credit_balance
    trigger: "on ServiceCredit create, ServiceCredit cancel (cascade from dispute RESOLVED_CREDITED), and CancellationRequest approve with ld_status=ASSESSED or waive"
    algorithm: aggregation
    formula: |
      customer.credit_balance_cents =
          sum(credit_cents over ServiceCredit with status == ACTIVE whose line belongs to a contract of this customer)
        - sum(ld_total_cents over CancellationRequest with ld_status == ASSESSED on contracts of this customer)
      Derived field; recomputed on every source mutation (immediate consistency).
    input_set: "Customer's contracts' ServiceCredit (ACTIVE only) and CancellationRequest (ld_status ASSESSED) rows"
    precision: "integer cents; may be negative"

  - name: calc_rolloff_total
    trigger: "POST /api/rolloff-orders/{id}/complete"
    algorithm: threshold
    formula: |
      rental_cents = daily_rental_cents * rental_days
      billable_overage_tons = max(0, ceil(actual_tons - included_tons))
      overage_cents = billable_overage_tons * overage_ton_cents
      total_cents = delivery_fee_cents + rental_cents + overage_cents
      Boundary: overage is charged strictly above included_tons; actual_tons exactly
      equal to included_tons yields zero overage; any fractional excess rounds UP
      to a whole ton (ceil, not round_half_up).
    input_set: "RolloffOrder fields at completion"
    precision: "integer cents"
    variants:
      - name: within_allowance
        when: "actual_tons <= included_tons"
        difference: "overage_cents = 0; total is delivery + rental only"
      - name: over_allowance
        when: "actual_tons > included_tons"
        difference: "fractional tons round up via ceil before multiplying by overage_ton_cents"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /api/_clock/set_current_utc (which still requires role PlatformAdmin)"
  - priority: 2
    category: auth
    check: "role permitted for this operation per §1.5 roles and §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "referenced resources exist (path ids and body FKs), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: existence
    check: "all required request fields present and well-typed; enums in declared sets; numeric ranges respected (e.g. frequency_per_week in 1..6)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 5
    category: state
    check: "target resource in a state that permits the operation (e.g. cancel only from SCHEDULED, approve only from PENDING)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints
  - priority: 6
    category: state
    check: "OCC: expected_contract_version matches the contract's current version on POST /api/competing-offers/{id}/match and POST /api/service-changes/{id}/apply"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/competing-offers/{id}/match, POST /api/service-changes/{id}/apply"
  - priority: 7
    category: business_temporal
    check: "rate-notice effective_date strictly after now at filing; cancel only before effective_date; service-change effective_date strictly after now; credit filed within credit_filing_window_days of occurred_date; dispute filed within 30 days of occurred_date"
    error_id: ERR_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /api/rate-notices, POST /api/rate-notices/{id}/cancel, POST /api/service-change-requests, POST /api/service-credits, POST /api/pickup-events/{id}/dispute"
  - priority: 8
    category: business_constraint
    check: "no two SurchargeConfig rows share an effective_from; at most one SUBMITTED CompetingOffer per contract; at most one APPROVED ServiceChangeRequest per service line; at most one ServiceCredit per PickupEvent"
    error_id: ERR_DUPLICATE_PENDING
    http_status: 409
    applies_to: "POST /api/surcharge-configs, POST /api/competing-offers, POST /api/service-changes/{id}/approve, POST /api/service-credits"
  - priority: 9
    category: business_referential
    check: "competing offers only against contracts with rofr_enabled=true; service-credit pickup_event must be a MISSED event on the same service line; disputed event must have outcome CONTAMINATED/OVERWEIGHT/CONTAMINATED_OVERWEIGHT; activation requires >= 1 service line"
    error_id: ERR_ROFR_NOT_ENABLED
    http_status: 422
    applies_to: "POST /api/competing-offers (ROFR check); others use ERR_INVALID_STATE as specified per endpoint"
  - priority: 10
    category: business_fiscal
    check: "amounts sane: pct_increase > 0; competitor_monthly_cents > 0; computed totals non-negative where the domain forbids negative charges"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /api/rate-notices, POST /api/competing-offers"

endpoints:
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time. Advancing the clock triggers auto-renewal of ACTIVE contracts whose end_date <= now, application of SCHEDULED rate notices whose effective_date <= now, and TERMINATION_PENDING->TERMINATED for contracts whose cancellation requested_end_date <= now."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["runs auto-renewal, rate-notice application, and termination-finalization sweeps in that order"]

  - method: POST
    path: "/api/customers"
    description: Create a customer.
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, billing_email]
    output: Customer
    side_effects: []

  - method: GET
    path: "/api/customers"
    description: List customers with pagination.
    roles: [PlatformAdmin, OpsManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: GET
    path: "/api/customers/{id}"
    description: Get one customer including computed credit_balance_cents.
    roles: [PlatformAdmin, OpsManager]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/api/contracts"
    description: Create a contract in DRAFT status.
    roles: [OpsManager]
    code: 201
    input: [customer_id, start_date, term_months, "renewal_term_months?", "cancellation_notice_days?", "rofr_enabled?", "rofr_window_days?"]
    output: Contract
    side_effects: []

  - method: GET
    path: "/api/contracts"
    description: List contracts, optionally filtered by customer_id or status.
    roles: [PlatformAdmin, OpsManager, Customer]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []

  - method: GET
    path: "/api/contracts/{id}"
    description: Get one contract.
    roles: [PlatformAdmin, OpsManager, Customer]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: POST
    path: "/api/contracts/{id}/activate"
    description: Activate a DRAFT contract (requires >= 1 service line and start_date <= now).
    roles: [OpsManager]
    code: 200
    input: []
    output: Contract
    side_effects: ["increments Contract.version by 1"]

  - method: POST
    path: "/api/contracts/{id}/reinstate"
    description: Reinstate a TERMINATED contract when now < end_date.
    roles: [OpsManager]
    code: 200
    input: []
    output: Contract
    side_effects: ["increments Contract.version by 1"]

  - method: POST
    path: "/api/contracts/{id}/service-lines"
    description: Add a service line to a contract (DRAFT or ACTIVE).
    roles: [OpsManager]
    code: 201
    input: [container_size, frequency_per_week, base_rate_cents]
    output: ContractServiceLine
    side_effects: ["recomputes Contract.base_monthly_total_cents", "increments Contract.version by 1"]

  - method: GET
    path: "/api/contracts/{id}/service-lines"
    description: List service lines of a contract.
    roles: [PlatformAdmin, OpsManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: ContractServiceLine[]
    side_effects: []

  - method: GET
    path: "/api/service-lines/{id}"
    description: Get one service line.
    roles: [PlatformAdmin, OpsManager, Customer]
    code: 200
    input: []
    output: ContractServiceLine
    side_effects: []

  - method: GET
    path: "/api/contracts/{id}/monthly-invoice"
    description: "Computed read: calc_monthly_invoice breakdown (base, fuel_cents, env_cents, admin_cents, fees_cents, credits_cents, total_cents)."
    roles: [PlatformAdmin, OpsManager, Customer]
    code: 200
    input: []
    output: { base_cents: integer, fuel_cents: integer, env_cents: integer, admin_cents: integer, fees_cents: integer, credits_cents: integer, total_cents: integer }
    side_effects: []

  - method: GET
    path: "/api/contracts/{id}/ledger-entries"
    description: List ledger entries of a contract, ordered by created_at ASC.
    roles: [PlatformAdmin, OpsManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: POST
    path: "/api/pickup-events"
    description: Record a collection event; computes contamination/overweight fees from the SurchargeConfig active at occurred_date.
    roles: [HaulerAgent]
    code: 201
    input: [service_line_id, occurred_date, outcome, "photo_evidence_url?"]
    output: PickupEvent
    side_effects: []

  - method: GET
    path: "/api/pickup-events"
    description: List pickup events, optionally filtered by service_line_id or outcome.
    roles: [PlatformAdmin, OpsManager, Customer, HaulerAgent]
    code: 200
    input: ["service_line_id?", "outcome?", "limit?", "offset?"]
    output: PickupEvent[]
    side_effects: []

  - method: GET
    path: "/api/pickup-events/{id}"
    description: Get one pickup event.
    roles: [PlatformAdmin, OpsManager, Customer, HaulerAgent]
    code: 200
    input: []
    output: PickupEvent
    side_effects: []

  - method: POST
    path: "/api/pickup-events/{id}/dispute"
    description: Customer disputes a contaminated/overweight event within 30 days of occurred_date; allowed once again from RESOLVED_UPHELD (appeal_count max 1).
    roles: [Customer]
    code: 200
    input: []
    output: PickupEvent
    side_effects: ["from RESOLVED_UPHELD: appeal_count := 1"]

  - method: POST
    path: "/api/pickup-events/{id}/resolve-dispute"
    description: "OpsManager resolves a dispute: UPHELD keeps fees; CREDITED cancels any ACTIVE ServiceCredit on the event (cascade recomputes customer balance)."
    roles: [OpsManager]
    code: 200
    input: [resolution]
    output: PickupEvent
    side_effects: ["on resolution=CREDITED: cancels ACTIVE ServiceCredit for this event; recomputes customer.credit_balance_cents"]

  - method: POST
    path: "/api/surcharge-configs"
    description: Create a surcharge configuration; effective_from must be unique.
    roles: [PlatformAdmin]
    code: 201
    input: [fuel_mode, "fuel_fixed_pct?", "fuel_index_base?", "fuel_index_current?", environmental_pct, admin_pct, contamination_fee_cents, overweight_fee_cents, effective_from]
    output: SurchargeConfig
    side_effects: []

  - method: GET
    path: "/api/surcharge-configs"
    description: List surcharge configurations ordered by effective_from ASC.
    roles: [PlatformAdmin, OpsManager]
    code: 200
    input: ["limit?", "offset?"]
    output: SurchargeConfig[]
    side_effects: []

  - method: POST
    path: "/api/rate-notices"
    description: File a rate adjustment notice; effective_date must be strictly after now.
    roles: [OpsManager]
    code: 201
    input: [contract_id, reason, pct_increase, effective_date]
    output: RateAdjustmentNotice
    side_effects: []

  - method: GET
    path: "/api/rate-notices"
    description: List rate notices, optionally filtered by contract_id or status.
    roles: [PlatformAdmin, OpsManager, Customer]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: RateAdjustmentNotice[]
    side_effects: []

  - method: POST
    path: "/api/rate-notices/{id}/cancel"
    description: Cancel a SCHEDULED notice before its effective_date.
    roles: [OpsManager]
    code: 200
    input: []
    output: RateAdjustmentNotice
    side_effects: []

  - method: POST
    path: "/api/service-change-requests"
    description: Customer requests a container/frequency change; server computes quoted_new_rate_cents via calc_service_change_quote on current rates.
    roles: [Customer]
    code: 201
    input: [service_line_id, new_container_size, new_frequency_per_week, effective_date]
    output: ServiceChangeRequest
    side_effects: []

  - method: GET
    path: "/api/service-change-requests"
    description: List service change requests, optionally filtered by service_line_id or status.
    roles: [PlatformAdmin, OpsManager, Customer]
    code: 200
    input: ["service_line_id?", "status?", "limit?", "offset?"]
    output: ServiceChangeRequest[]
    side_effects: []

  - method: POST
    path: "/api/service-changes/{id}/approve"
    description: Approve a PENDING request; at most one APPROVED per service line; contract must be ACTIVE.
    roles: [OpsManager]
    code: 200
    input: []
    output: ServiceChangeRequest
    side_effects: []

  - method: POST
    path: "/api/service-changes/{id}/reject"
    description: Reject a PENDING request.
    roles: [OpsManager]
    code: 200
    input: []
    output: ServiceChangeRequest
    side_effects: []

  - method: POST
    path: "/api/service-changes/{id}/apply"
    description: "Apply an APPROVED request at/after effective_date; reprices from the line's current base_rate_cents (OCC-guarded on contract version); recomputes contract base and writes LedgerEntry(SERVICE_CHANGE)."
    roles: [OpsManager]
    code: 200
    input: [expected_contract_version]
    output: ServiceChangeRequest
    side_effects: ["mutates line rates/size/frequency", "recomputes Contract.base_monthly_total_cents", "increments Contract.version by 1", "writes LedgerEntry(source=SERVICE_CHANGE)"]

  - method: POST
    path: "/api/service-changes/{id}/withdraw"
    description: Customer withdraws a PENDING request.
    roles: [Customer]
    code: 200
    input: []
    output: ServiceChangeRequest
    side_effects: []

  - method: POST
    path: "/api/competing-offers"
    description: Submit a competing offer against a rofr_enabled contract; at most one SUBMITTED per contract.
    roles: [Customer]
    code: 201
    input: [contract_id, competitor_monthly_cents, evidence_doc_url]
    output: CompetingOffer
    side_effects: []

  - method: GET
    path: "/api/competing-offers"
    description: List competing offers, optionally filtered by contract_id or status.
    roles: [PlatformAdmin, OpsManager, Customer]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: CompetingOffer[]
    side_effects: []

  - method: POST
    path: "/api/competing-offers/{id}/match"
    description: "Incumbent matches within rofr_window_days of offer creation; reprices all lines per calc_rofr_match (OCC-guarded on contract version)."
    roles: [OpsManager]
    code: 200
    input: [expected_contract_version]
    output: CompetingOffer
    side_effects: ["re-prices every line of the contract", "sets Contract.base_monthly_total_cents := matched rate", "increments Contract.version by 1", "writes LedgerEntry(source=ROFR_MATCH)"]

  - method: POST
    path: "/api/competing-offers/{id}/decline-match"
    description: Decline to match a SUBMITTED offer.
    roles: [OpsManager]
    code: 200
    input: []
    output: CompetingOffer
    side_effects: []

  - method: POST
    path: "/api/cancellation-requests"
    description: Customer files a cancellation request; server computes timely/months_remaining from contract dates.
    roles: [Customer]
    code: 201
    input: [contract_id, requested_end_date]
    output: CancellationRequest
    side_effects: []

  - method: GET
    path: "/api/cancellation-requests"
    description: List cancellation requests, optionally filtered by contract_id or status.
    roles: [PlatformAdmin, OpsManager, Customer]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: CancellationRequest[]
    side_effects: []

  - method: POST
    path: "/api/cancellation-requests/{id}/approve"
    description: "Approve a PENDING cancellation; untimely path assesses LD (calc_ld_amount), debits customer balance, and cascades cancellation of notices/changes/offers; timely path terminates immediately."
    roles: [OpsManager]
    code: 200
    input: []
    output: CancellationRequest
    side_effects: ["see Contract termination transitions; on untimely: customer.credit_balance_cents -= ld_total_cents"]
  - method: POST
    path: "/api/cancellation-requests/{id}/deny"
    description: Deny a PENDING cancellation request.
    roles: [OpsManager]
    code: 200
    input: []
    output: CancellationRequest
    side_effects: []

  - method: POST
    path: "/api/cancellation-requests/{id}/withdraw"
    description: Customer withdraws a PENDING cancellation at/before requested_end_date.
    roles: [Customer]
    code: 200
    input: []
    output: CancellationRequest
    side_effects: []

  - method: POST
    path: "/api/cancellation-requests/{id}/waive-ld"
    description: Waive assessed liquidated damages on an approved cancellation (ld_status ASSESSED -> WAIVED); customer balance credited back.
    roles: [OpsManager]
    code: 200
    input: []
    output: CancellationRequest
    side_effects: ["customer.credit_balance_cents += ld_total_cents"]

  - method: POST
    path: "/api/service-credits"
    description: File a missed-pickup service credit; pickup event must be MISSED on the same line, filed within credit_filing_window_days (14) of occurred_date; one credit per event.
    roles: [Customer]
    code: 201
    input: [service_line_id, pickup_event_id]
    output: ServiceCredit
    side_effects: ["customer.credit_balance_cents += credit_cents"]

  - method: GET
    path: "/api/service-credits"
    description: List service credits, optionally filtered by service_line_id, pickup_event_id, or status.
    roles: [PlatformAdmin, OpsManager, Customer]
    code: 200
    input: ["service_line_id?", "pickup_event_id?", "status?", "limit?", "offset?"]
    output: ServiceCredit[]
    side_effects: []

  - method: POST
    path: "/api/rolloff-orders"
    description: Create a roll-off/temporary order (priced independently of any contract).
    roles: [Customer]
    code: 201
    input: [customer_id, container_size, delivery_date, rental_days, "included_tons?", delivery_fee_cents, daily_rental_cents, overage_ton_cents]
    output: RolloffOrder
    side_effects: []

  - method: GET
    path: "/api/rolloff-orders"
    description: List roll-off orders, optionally filtered by customer_id or status.
    roles: [PlatformAdmin, OpsManager, Customer]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: RolloffOrder[]
    side_effects: []

  - method: POST
    path: "/api/rolloff-orders/{id}/deliver"
    description: Mark delivery at/after delivery_date.
    roles: [OpsManager]
    code: 200
    input: []
    output: RolloffOrder
    side_effects: []

  - method: POST
    path: "/api/rolloff-orders/{id}/complete"
    description: Complete the rental with actual_tons; computes total_cents per calc_rolloff_total.
    roles: [OpsManager]
    code: 200
    input: [actual_tons]
    output: RolloffOrder
    side_effects: ["total_cents := calc_rolloff_total"]

  - method: POST
    path: "/api/rolloff-orders/{id}/cancel"
    description: Customer cancels a RESERVED order before delivery_date.
    roles: [Customer]
    code: 200
    input: []
    output: RolloffOrder
    side_effects: []

  - method: GET
    path: "/api/rate-notices/{id}"
    description: Get one rate adjustment notice.
    roles: [PlatformAdmin, OpsManager, Customer]
    code: 200
    input: []
    output: RateAdjustmentNotice
    side_effects: []

  - method: GET
    path: "/api/service-change-requests/{id}"
    description: Get one service change request.
    roles: [PlatformAdmin, OpsManager, Customer]
    code: 200
    input: []
    output: ServiceChangeRequest
    side_effects: []

  - method: GET
    path: "/api/competing-offers/{id}"
    description: Get one competing offer.
    roles: [PlatformAdmin, OpsManager, Customer]
    code: 200
    input: []
    output: CompetingOffer
    side_effects: []

  - method: GET
    path: "/api/cancellation-requests/{id}"
    description: Get one cancellation request.
    roles: [PlatformAdmin, OpsManager, Customer]
    code: 200
    input: []
    output: CancellationRequest
    side_effects: []

  - method: GET
    path: "/api/service-credits/{id}"
    description: Get one service credit.
    roles: [PlatformAdmin, OpsManager, Customer]
    code: 200
    input: []
    output: ServiceCredit
    side_effects: []

  - method: GET
    path: "/api/rolloff-orders/{id}"
    description: Get one roll-off order.
    roles: [PlatformAdmin, OpsManager, Customer]
    code: 200
    input: []
    output: RolloffOrder
    side_effects: []

  - method: GET
    path: "/api/ledger-entries"
    description: List ledger entries, optionally filtered by contract_id.
    roles: [PlatformAdmin, OpsManager, Customer]
    code: 200
    input: ["contract_id?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing X-User-Role / X-User-ID headers or undeclared role value."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role is not permitted to call this endpoint per §1.5/§1.7."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource (path id or body FK) does not exist."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, malformed type, enum outside declared set, or numeric range violated (e.g. frequency_per_week outside 1..6)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state that permits the operation (e.g. approving an already-decided request, disputing a COMPLETED event, activating a contract without lines)."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_contract_version does not match the contract's current version on OCC-guarded writes."
  - id: ERR_WINDOW_EXPIRED
    http: 422
    condition: "Time-window rule violated: effective date not in the future, credit filed after the 14-day window, dispute filed after 30 days, cancel after effective_date."
  - id: ERR_DUPLICATE_PENDING
    http: 409
    condition: "Uniqueness conflict: duplicate SurchargeConfig effective_from, second SUBMITTED offer on a contract, second APPROVED change on a line, or second credit for one pickup event."
  - id: ERR_ROFR_NOT_ENABLED
    http: 422
    condition: "Competing offer submitted against a contract with rofr_enabled = false."
  - id: ERR_INVALID_AMOUNT
    http: 422
    condition: "Non-positive pct_increase or competitor_monthly_cents."

roles:
  - name: PlatformAdmin
    description: "Platform operator: manages customers, surcharge configs, and the logical clock; read access to everything."
    identity: opaque
    exclusive_operations: ["POST /api/customers", "POST /api/surcharge-configs", "POST /api/_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: OpsManager
    description: "Waste-management operations: manages contracts, rate notices, service changes, dispute resolution, ROFR match decisions, cancellations, roll-off delivery/completion."
    identity: opaque
    exclusive_operations: ["POST /api/contracts", "POST /api/contracts/{id}/activate", "POST /api/contracts/{id}/reinstate", "POST /api/contracts/{id}/service-lines", "POST /api/rate-notices", "POST /api/rate-notices/{id}/cancel", "POST /api/service-changes/{id}/approve", "POST /api/service-changes/{id}/reject", "POST /api/service-changes/{id}/apply", "POST /api/competing-offers/{id}/match", "POST /api/competing-offers/{id}/decline-match", "POST /api/cancellation-requests/{id}/approve", "POST /api/cancellation-requests/{id}/deny", "POST /api/cancellation-requests/{id}/waive-ld", "POST /api/pickup-events/{id}/resolve-dispute", "POST /api/rolloff-orders/{id}/deliver", "POST /api/rolloff-orders/{id}/complete"]
    shared_operations: ["all GET endpoints"]
  - name: Customer
    description: "Commercial customer contact; X-User-ID equals the Customer entity id; files service changes, competing offers, cancellations, service credits, disputes, and roll-off orders."
    identity: "entity_backed:Customer"
    exclusive_operations: ["POST /api/service-change-requests", "POST /api/service-changes/{id}/withdraw", "POST /api/competing-offers", "POST /api/cancellation-requests", "POST /api/cancellation-requests/{id}/withdraw", "POST /api/service-credits", "POST /api/pickup-events/{id}/dispute", "POST /api/rolloff-orders", "POST /api/rolloff-orders/{id}/cancel"]
    shared_operations: ["all GET endpoints"]
  - name: HaulerAgent
    description: "Field agent recording collection events with photo evidence."
    identity: opaque
    exclusive_operations: ["POST /api/pickup-events"]
    shared_operations: ["GET /api/pickup-events", "GET /api/pickup-events/{id}"]
