    side_effects: ["heel_volume_l = 0.0, heel_additive_family = NONE, heel_product_code = null", "last_flush_at stamped from the logical clock", "BlendTank QUARANTINED -> AVAILABLE when applicable", "increments BlendTank.version by 1"]

  # ---- BlendBatch ------------------------------------------------------------------
  - method: POST
    path: "/blend-batches"
    description: "Creates a batch in production_status PLANNED and qc_status PENDING."
    roles: [BlendOperator]
    code: 201
    input: [blend_recipe_id, batch_code, planned_volume_l]
    output: BlendBatch
    side_effects: ["predicted_kv100_cst snapshotted from the recipe", "claim_eligible initialised to false"]

  - method: GET
    path: "/blend-batches/{id}"
    description: "Reads one batch with both state dimensions and every computed cost/viscosity field."
    roles: [PlatformAdmin, ProductManager, BlendOperator, QCTechnician, QualityManager, ComplianceOfficer, SalesRep]
    code: 200
    input: []
    output: BlendBatch
    side_effects: []

  - method: GET
    path: "/blend-batches"
    description: "Lists batches with filtering and pagination (reverse reachability for BlendBatch.blend_recipe_id and BlendBatch.blend_tank_id)."
    roles: [PlatformAdmin, ProductManager, BlendOperator, QCTechnician, QualityManager, ComplianceOfficer, SalesRep]
    code: 200
    input: ["blend_recipe_id?", "blend_tank_id?", "production_status?", "qc_status?", "limit?", "offset?"]
    output: BlendBatch[]
    side_effects: []

  - method: POST
    path: "/blend-batches/{id}/charge"
    description: "Charges a planned batch into a tank over a declared occupancy window; runs the heel, window, lot-availability and capacity gates and reserves the component draws."
    roles: [BlendOperator]
    code: 200
    input: [blend_tank_id, charge_volume_l, window_start, window_end]
    output: BlendBatch
    side_effects: ["BlendBatch PLANNED -> CHARGING", "BlendTank AVAILABLE -> CHARGED", "ComponentDraw rows created with status RESERVED", "each drawn ComponentLot.available_kg decremented; a lot hitting 0 goes DEPLETED", "heel_ratio_actual, charge_mass_kg, claim_eligible and estimated_component_cost_cents computed", "increments BlendBatch.version by 1"]

  - method: POST
    path: "/blend-batches/{id}/cancel-charge"
    description: "Compensating action for a charge: returns every reserved draw and frees the tank without touching its heel."
    roles: [BlendOperator]
    code: 200
    input: [reason]
    output: BlendBatch
    side_effects: ["BlendBatch CHARGING -> PLANNED", "every RESERVED ComponentDraw -> RETURNED", "each ComponentLot.available_kg restored; DEPLETED lots return to AVAILABLE", "BlendTank CHARGED -> AVAILABLE with heel fields untouched", "increments BlendBatch.version by 1"]

  - method: POST
    path: "/blend-batches/{id}/complete-blend"
    description: "Marks blending finished, consumes the reserved draws and freezes the final consumption-layer cost."
    roles: [BlendOperator]
    code: 200
    input: []
    output: BlendBatch
    side_effects: ["BlendBatch CHARGING -> BLENDED or REWORKED -> BLENDED", "every RESERVED ComponentDraw -> CONSUMED", "component_cost_cents computed via variant consumption_layer_cost", "increments BlendBatch.version by 1"]

  - method: POST
    path: "/blend-batches/{id}/release"
    description: "Releases a blended, QC-cleared batch; hands the tank back and rewrites its heel from this batch."
    roles: [QualityManager]
    code: 200
    input: []
    output: BlendBatch
    side_effects: ["BlendBatch BLENDED -> RELEASED", "BlendTank CHARGED -> AVAILABLE with heel_volume_l, heel_additive_family and heel_product_code rewritten", "increments BlendBatch.version by 1"]

  - method: POST
    path: "/blend-batches/{id}/quarantine"
    description: "Quarantines a blended batch, or recalls an already released one; cancels its scheduled packaging runs and, when the tank is still charged by this batch, quarantines the tank too."
    roles: [QualityManager]
    code: 200
    input: [reason]
    output: BlendBatch
    side_effects: ["BlendBatch BLENDED -> QUARANTINED or RELEASED -> QUARANTINED", "every SCHEDULED or RUNNING PackagingRun on the batch -> CANCELLED with cancel_reason BATCH_QUARANTINED", "each affected PackagingLine.scheduled_run_count recomputed", "BlendTank CHARGED -> QUARANTINED only when the tank is still charged by this batch", "increments BlendBatch.version by 1"]

  - method: POST
    path: "/blend-batches/{id}/rework"
    description: "Sends a quarantined, QC-failed batch back for rework and resets its quality dimension."
    roles: [BlendOperator]
    code: 200
    input: [reason]
    output: BlendBatch
    side_effects: ["BlendBatch QUARANTINED -> REWORKED", "qc_status FAILED -> PENDING and measured_kv100_cst reset to null", "increments BlendBatch.version by 1"]

  - method: POST
    path: "/blend-batches/{id}/dispose"
    description: "Scraps a quarantined batch; consumed mass is not returned to any lot."
    roles: [QualityManager]
    code: 200
    input: [reason]
    output: BlendBatch
    side_effects: ["BlendBatch QUARANTINED -> DISPOSED", "increments BlendBatch.version by 1"]

  - method: POST
    path: "/blend-batches/{id}/waive-qc"
    description: "Waives the quality gate on a non-claim-bearing batch. Blocked by segregation of duties and by claim eligibility."
    roles: [QualityManager]
    code: 200
    input: [justification]
    output: BlendBatch
    side_effects: ["BlendBatch qc_status SAMPLED -> WAIVED or FAILED -> WAIVED", "increments BlendBatch.version by 1"]

  - method: GET
    path: "/blend-batches/{id}/component-draws"
    description: "Lists the draws a batch took (reverse reachability for ComponentDraw.blend_batch_id)."
    roles: [PlatformAdmin, ProductManager, BlendOperator, QCTechnician, QualityManager, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ComponentDraw[]
    side_effects: []

  - method: POST
    path: "/blend-batches/{id}/qc-results"
    description: "Records one laboratory result. The KV100 verdict is computed against the spec band; a FAIL drives the quality dimension to FAILED and cascades."
    roles: [QCTechnician]
    code: 201
    input: [test_type, measured_value]
    output: QCResult
    side_effects: ["result computed per calculations.qc_viscosity_conformance", "technician_user_id stamped from X-User-ID", "BlendBatch qc_status advanced", "on FAIL and production_status == BLENDED the batch cascades to QUARANTINED", "increments BlendBatch.version by 1"]

  - method: GET
    path: "/blend-batches/{id}/qc-results"
    description: "Lists the QC results of a batch (reverse reachability for QCResult.blend_batch_id)."
    roles: [PlatformAdmin, ProductManager, BlendOperator, QCTechnician, QualityManager, ComplianceOfficer]
    code: 200
    input: ["test_type?", "limit?", "offset?"]
    output: QCResult[]
    side_effects: []

  - method: POST
    path: "/blend-batches/{id}/retain-samples"
    description: "Books a retain jar against a batch and freezes its retention window."
    roles: [QCTechnician]
    code: 201
    input: [retain_code, volume_ml]
    output: RetainSample
    side_effects: ["retained_at and retention_until computed per calculations.retain_retention_window", "BlendBatch.retain_count recomputed", "increments BlendBatch.version by 1"]

  - method: GET
    path: "/blend-batches/{id}/retain-samples"
    description: "Lists the retains of a batch (reverse reachability for RetainSample.blend_batch_id)."
    roles: [PlatformAdmin, ProductManager, BlendOperator, QCTechnician, QualityManager, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RetainSample[]
    side_effects: []

  - method: POST
    path: "/retain-samples/{id}/dispose"
    description: "Disposes a retain jar once its retention window has elapsed."
    roles: [QualityManager]
    code: 200
    input: [reason]
    output: RetainSample
    side_effects: ["RetainSample HELD -> DISPOSED", "BlendBatch.retain_count recomputed", "increments RetainSample.version by 1"]

