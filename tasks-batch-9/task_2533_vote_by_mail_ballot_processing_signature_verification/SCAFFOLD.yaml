# =============================================================================
# task_2533 — Vote-by-Mail Ballot Processing & Signature Verification
# Seed tables §1.0–§1.7  (difficulty band: beyond Expert)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2533. Vote-by-Mail Ballot Processing & Signature Verification (county elections office): ballot request and permanent absentee list management with address verification and forwarding rules, mailing schedule with military and overseas voter deadlines, returned ballot receipt logging by postmark and receipt date with deadline rules, signature comparison against registration records with reviewer training and multi-reviewer escalation, cure notification for missing or mismatched signatures with deadlines and evidence submission, envelope separation preserving ballot secrecy before tabulation, duplicate and damaged ballot remaking with bipartisan teams and audit records, challenged ballot adjudication and provisional interaction, observer access rules and transparency logging

domain_name: vote-by-mail-processing
api_prefix: /vote-by-mail

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency          # OCC on Voter.version and ReturnEnvelope.version
    - cascading_side_effects          # depth-3 chains from address failure and cure expiry
    - dual_variant_calculation        # preliminary vs final timeliness; estimated vs actual postage
    - selector_policy                 # server-picked signature reviewer with SoD exclusion

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; no nested ownership URLs beyond
  # action sub-paths. Election is a peer scoping entity, not a URL ancestor.

  state_machine_shape: parallel
  # ReturnEnvelope carries three independent dimensions that evolve on the same row:
  #   signature_status × custody_status × challenge_status
  # signature_status additionally cycles (PENDING_REVIEW → ESCALATED → PENDING_REVIEW),
  # CureNotice cycles (ISSUED → UNDER_EVIDENCE_REVIEW → ISSUED), and
  # PermanentAbsenteeEnrollment cycles (ACTIVE → SUSPENDED → ACTIVE).

  relationship_patterns:
    - one_to_many          # Election → MailingBatch → BallotPacket → ReturnEnvelope
    - self_referential     # ReturnEnvelope.remade_from_envelope_id -> ReturnEnvelope.id
    - cross_aggregate      # SignatureReview spans ReturnEnvelope and Reviewer
    - polymorphic          # TransparencyLogEntry.subject_entity / subject_id

  role_model: segregation_of_duties
  # A reviewer who decided round N cannot be selected for round N+1; a reviewer who
  # touched an envelope's signature review cannot sit on that envelope's remake team;
  # CanvassSupervisor adjudicates but may never submit a signature decision.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Election
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Election name, e.g. 'General Election 2026'" }
      - { name: election_date, type: string, source: input, description: "Election day, ISO date (YYYY-MM-DD)" }
      - { name: uocava_send_deadline_date, type: string, source: input, description: "Last lawful send date for UOCAVA (military/overseas) batches, ISO date" }
      - { name: domestic_send_deadline_date, type: string, source: input, description: "Last lawful send date for DOMESTIC_INITIAL batches, ISO date" }
      - { name: return_deadline_at, type: datetime, source: input, description: "Instant polls close; envelopes received at or before this instant are TIMELY" }
      - { name: postmark_grace_days, type: integer, source: input, default: 7, description: "Whole days after return_deadline_at during which a ballot postmarked on or before election_date may still count" }
      - { name: cure_window_days, type: integer, source: input, default: 21, description: "Whole days after return_deadline_at forming the statutory cure base deadline" }
      - { name: postage_budget_cents, type: integer, source: input, description: "Total postage authority in whole cents for this election" }
      - { name: posture, type: enum, source: system, default: PRE_MAIL, description: "PRE_MAIL | MAILING | RECEIVING | CANVASS_LOCKED | CERTIFIED — gates child operations" }
      - { name: packets_mailed_count, type: integer, source: computed, default: 0, description: "Count of BallotPacket with status IN {MAILED, RETURNED, UNDELIVERABLE}" }
      - { name: envelopes_received_count, type: integer, source: computed, default: 0, description: "Count of ReturnEnvelope rows whose packet belongs to this election, including remade envelopes" }
      - { name: outstanding_packet_count, type: integer, source: computed, default: 0, description: "Count of BallotPacket with status == MAILED (mailed, not yet returned or undeliverable)" }
      - { name: undeliverable_packet_count, type: integer, source: computed, default: 0, description: "Count of BallotPacket with status == UNDELIVERABLE" }
      - { name: countable_envelope_count, type: integer, source: computed, default: 0, description: "Count of ReturnEnvelope with signature_status == ACCEPTED AND custody_status IN {SEPARATED, COUNTED} AND challenge_status != SUSTAINED" }
      - { name: attributable_ballot_count, type: integer, source: computed, default: 0, description: "Count of ReturnEnvelope with custody_status IN {SEALED, SEPARATED, COUNTED} AND signature_status != REJECTED — the conserved ballot quantity of calculations.ballot_countability_conservation" }
      - { name: rejected_envelope_count, type: integer, source: computed, default: 0, description: "Count of ReturnEnvelope with signature_status == REJECTED" }
      - { name: provisional_referral_count, type: integer, source: computed, default: 0, description: "Count of Voter rows referred to provisional voting by a rejected envelope in this election" }
      - { name: open_cure_count, type: integer, source: computed, default: 0, description: "Count of CureNotice with status IN {ISSUED, UNDER_EVIDENCE_REVIEW} for envelopes of this election" }
      - { name: canvass_days, type: integer, source: computed, default: 17, description: "Whole days after return_deadline_at at which canvass locks; 17 normally, 21 once open_cure_count_at_issue >= EXTENDED_CANVASS_OPEN_CURE_THRESHOLD (see calculations.cure_deadline_derivation)" }
      - { name: canvass_lock_at, type: datetime, source: computed, description: "= return_deadline_at + canvass_days days" }
      - { name: postage_committed_cents, type: integer, source: computed, default: 0, description: "Sum of estimated_postage_cents over MailingBatch rows with status IN {SEALED, DISPATCHED}" }
      - { name: postage_actual_cents, type: integer, source: computed, default: 0, description: "Sum of actual_postage_cents over MailingBatch rows with status == DISPATCHED" }
      - { name: reconciliation_status, type: enum, source: computed, default: IN_BALANCE, description: "IN_BALANCE | OUT_OF_BALANCE — see calculations.ballot_accountability_reconciliation" }
      - { name: separation_run_sequence, type: integer, source: system, default: 0, description: "Monotone counter incremented by each accepted separation run" }
      - { name: canvass_sweep_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by each canvass sweep checkpoint" }

  - name: Voter
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Registered voter name as printed on the registration record" }
      - { name: party_affiliation, type: enum, source: input, description: "DEM | REP | NPP | OTHER" }
      - { name: registration_status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | INACTIVE | CANCELLED" }
      - { name: residence_address, type: string, source: input, description: "Registered residence address (never overwritten by forwarding data)" }
      - { name: mailing_address, type: string, source: input, default: null, description: "Optional mailing address; when null, residence_address is used for packet addressing" }
      - { name: uocava_status, type: enum, source: input, default: NONE, description: "NONE | MILITARY | OVERSEAS" }
      - { name: signature_on_file_count, type: integer, source: input, default: 1, description: "Number of signature exemplars on the registration record; constraints: >= 1" }
      - { name: last_signature_update_at, type: datetime, source: input, description: "Instant the newest exemplar was captured; feeds staleness penalty in signature scoring" }
      - { name: permanent_absentee_active, type: boolean, source: computed, default: false, description: "true iff this voter has a PermanentAbsenteeEnrollment with status == ACTIVE" }
      - { name: provisional_ballot_eligible, type: boolean, source: computed, default: false, description: "true once any of this voter's return envelopes reaches signature_status == REJECTED" }

  - name: Reviewer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Signature reviewer name" }
      - { name: party_affiliation, type: enum, source: input, description: "DEM | REP | NPP | OTHER — drives bipartisan remake-team composition" }
      - { name: training_status, type: enum, source: input, default: UNTRAINED, description: "UNTRAINED | TRAINED | CERTIFIED_LEAD" }
      - { name: training_completed_at, type: datetime, source: input, default: null, description: "Instant the reviewer completed the signature-comparison curriculum" }
      - { name: training_expires_at, type: datetime, source: computed, default: null, description: "= training_completed_at + TRAINING_VALID_DAYS days; null when training_completed_at is null" }
      - { name: curriculum_version, type: string, source: input, default: null, description: "Curriculum edition recorded with the most recent training completion" }
      - { name: active_review_count, type: integer, source: computed, default: 0, description: "Count of SignatureReview rows for this reviewer with status == ASSIGNED" }
      - { name: completed_review_count, type: integer, source: computed, default: 0, description: "Count of SignatureReview rows for this reviewer with status == SUBMITTED" }

  - name: BallotRequest
    parent: null
    common_fields: true
    fields:
      - { name: voter_id, type: string, source: input, description: "FK -> Voter.id; the requesting voter" }
      - { name: election_id, type: string, source: input, description: "FK -> Election.id; the election the request is scoped to" }
      - { name: request_channel, type: enum, source: input, description: "ONLINE | PAPER | PHONE" }
      - { name: delivery_method, type: enum, source: input, description: "MAIL | EMAIL_UOCAVA — EMAIL_UOCAVA requires voter.uocava_status != NONE" }
      - { name: permanent_flag, type: boolean, source: input, default: false, description: "true when the request also enrolls the voter on the permanent absentee list" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | ADDRESS_HOLD | ADDRESS_CLEARED | APPROVED | MAILED | REJECTED | SUPERSEDED" }
      - { name: mailing_address_snapshot, type: string, source: computed, description: "Address frozen at request creation: voter.mailing_address when non-null, else voter.residence_address" }
      - { name: forwarding_class, type: enum, source: computed, default: UNKNOWN, description: "UNKNOWN | SAME_ADDRESS | FORWARDABLE | NON_FORWARDABLE — written by the address-verification result" }
      - { name: rejection_reason_code, type: string, source: input, default: null, description: "Operator-supplied reason recorded on rejection" }

  - name: AddressVerification
    parent: null
    common_fields: true
    fields:
      - { name: ballot_request_id, type: string, source: system, description: "FK -> BallotRequest.id; auto-created in PENDING when the request is created" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | CLEARED | FAILED" }
      - { name: ncoa_result, type: enum, source: input, default: null, description: "MATCH_SAME | MATCH_FORWARDABLE | MATCH_NON_FORWARDABLE | NO_MATCH" }
      - { name: verified_mailing_address, type: string, source: input, default: null, description: "Address returned by the change-of-address service" }
      - { name: forwardable, type: boolean, source: input, default: null, description: "Whether the carrier will forward election mail to the verified address" }
      - { name: evaluated_at, type: datetime, source: computed, default: null, description: "Logical-clock instant the result was recorded" }

  - name: PermanentAbsenteeEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: voter_id, type: string, source: input, description: "FK -> Voter.id; enrolled voter" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | REMOVED" }
      - { name: consecutive_undeliverable_count, type: integer, source: computed, default: 0, description: "Consecutive undeliverable/non-forwardable events since the last confirmation; reset to 0 on reinstatement" }
      - { name: last_confirmation_at, type: datetime, source: computed, description: "Logical-clock instant of enrollment or of the most recent reinstatement" }
      - { name: suspension_reason_code, type: enum, source: computed, default: null, description: "ADDRESS_NON_FORWARDABLE | PACKET_UNDELIVERABLE" }
      - { name: reinstated_count, type: integer, source: computed, default: 0, description: "Number of times this enrollment has returned from SUSPENDED to ACTIVE" }

  - name: MailingBatch
    parent: null
    common_fields: true
    fields:
      - { name: election_id, type: string, source: input, description: "FK -> Election.id; election this batch mails for" }
      - { name: batch_type, type: enum, source: input, description: "UOCAVA | DOMESTIC_INITIAL | SUPPLEMENTAL" }
      - { name: scheduled_send_date, type: string, source: input, description: "Planned dispatch date, ISO date" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SEALED | DISPATCHED | CANCELLED" }
      - { name: required_send_by_date, type: string, source: computed, description: "Statutory last send date for this batch_type: election.uocava_send_deadline_date when batch_type == UOCAVA, else election.domestic_send_deadline_date" }
      - { name: packet_count, type: integer, source: computed, default: 0, description: "Count of BallotPacket rows with status IN {QUEUED, MAILED, RETURNED, UNDELIVERABLE} in this batch" }
      - { name: estimated_postage_cents, type: integer, source: computed, default: 0, description: "ESTIMATED variant of calculations.postage_assessment, frozen at seal" }
      - { name: actual_postage_cents, type: integer, source: computed, default: null, description: "ACTUAL variant of calculations.postage_assessment, written at dispatch" }
      - { name: sealed_at, type: datetime, source: computed, default: null, description: "Logical-clock instant of seal" }
      - { name: dispatched_at, type: datetime, source: computed, default: null, description: "Logical-clock instant of dispatch" }
      - { name: cancellation_reason_code, type: string, source: input, default: null, description: "Operator reason recorded on cancellation" }

  - name: BallotPacket
    parent: null
    common_fields: true
    fields:
      - { name: mailing_batch_id, type: string, source: system, description: "FK -> MailingBatch.id; batch that carries this packet" }
      - { name: ballot_request_id, type: string, source: input, description: "FK -> BallotRequest.id; request this packet fulfils" }
      - { name: packet_weight_grams, type: integer, source: input, description: "Declared outbound weight; constraints: >= 1" }
      - { name: packet_postage_cents, type: integer, source: computed, default: 0, description: "Per-packet postage rounded to whole cents — see calculations.postage_assessment" }
      - { name: packet_serial, type: string, source: system, description: "Serial stamped at packet creation as '<batch scheduled_send_date>-<zero-padded batch sequence>'" }
      - { name: batch_sequence, type: integer, source: system, description: "1-based creation order of this packet inside its batch" }
      - { name: status, type: enum, source: system, default: QUEUED, description: "QUEUED | MAILED | SPOILED | RETURNED | UNDELIVERABLE" }
      - { name: mailed_at, type: datetime, source: computed, default: null, description: "Logical-clock instant the carrying batch dispatched" }
      - { name: undeliverable_reason_code, type: enum, source: input, default: null, description: "NO_SUCH_ADDRESS | MOVED_NO_FORWARD | REFUSED | VACANT" }

  - name: ReturnEnvelope
    parent: null
    common_fields: true
    fields:
      - { name: ballot_packet_id, type: string, source: input, description: "FK -> BallotPacket.id; packet whose envelope came back" }
      - { name: remade_from_envelope_id, type: string, source: system, default: null, description: "FK -> ReturnEnvelope.id; set only on envelopes minted by remake completion (self-referential)" }
      - { name: intake_channel, type: enum, source: input, description: "USPS | DROPBOX | IN_PERSON — DROPBOX and IN_PERSON carry no postmark and get no grace window" }
      - { name: postmark_date, type: string, source: input, default: null, description: "Carrier postmark date, ISO date; null for DROPBOX/IN_PERSON" }
      - { name: postmark_legible, type: boolean, source: input, default: true, description: "false when the postmark is missing, smudged, or unreadable" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock instant of intake logging" }
      - { name: preliminary_timeliness, type: enum, source: computed, description: "TIMELY | PROVISIONAL_TIMELY_POSTMARK | UNTIMELY — PRELIMINARY variant of calculations.envelope_timeliness, written at intake" }
      - { name: final_timeliness, type: enum, source: computed, default: null, description: "TIMELY | TIMELY_BY_POSTMARK | UNTIMELY — FINAL variant, written by the canvass sweep" }
      - { name: signature_status, type: enum, source: system, default: UNVERIFIED, description: "UNVERIFIED | PENDING_REVIEW | ESCALATED | ACCEPTED | CURE_REQUIRED | REJECTED (dimension 1 of 3)" }
      - { name: custody_status, type: enum, source: system, default: SEALED, description: "SEALED | SEPARATED | COUNTED | SEQUESTERED | SUPERSEDED_BY_REMAKE (dimension 2 of 3)" }
      - { name: challenge_status, type: enum, source: system, default: NONE, description: "NONE | CHALLENGED | SUSTAINED | OVERRULED (dimension 3 of 3)" }
      - { name: review_round_count, type: integer, source: computed, default: 0, description: "Count of SignatureReview rows for this envelope with status == SUBMITTED" }
      - { name: resolved_signature_confidence, type: number, source: computed, default: null, description: "confidence_score of the dispositive SignatureReview (highest review_round with status == SUBMITTED; tie-break created_at ASC), 4 decimal places" }
      - { name: separation_run_sequence, type: integer, source: computed, default: null, description: "Election.separation_run_sequence value of the run that separated this envelope" }
      - { name: challenge_reason_code, type: enum, source: input, default: null, description: "SIGNATURE_DISPUTE | IDENTITY_DISPUTE | DUPLICATE_VOTE | ENVELOPE_TAMPERING" }
      - { name: challenge_findings, type: string, source: input, default: null, description: "Adjudication findings recorded when the challenge is resolved" }

  - name: SignatureReview
    parent: null
    common_fields: true
    fields:
      - { name: return_envelope_id, type: string, source: system, description: "FK -> ReturnEnvelope.id; envelope under review" }
      - { name: reviewer_id, type: string, source: system, description: "FK -> Reviewer.id; server-selected per calculations.reviewer_assignment_selection" }
      - { name: review_round, type: integer, source: system, description: "1-based escalation round; constraints: 1..3" }
      - { name: status, type: enum, source: system, default: ASSIGNED, description: "ASSIGNED | SUBMITTED | VOIDED" }
      - { name: decision, type: enum, source: input, default: null, description: "MATCH | NO_MATCH | MISSING_SIGNATURE | ABSTAIN" }
      - { name: similarity_score, type: integer, source: input, default: null, description: "Reviewer-entered visual similarity 0..100; constraints: 0 <= similarity_score <= 100" }
      - { name: confidence_score, type: number, source: computed, default: null, description: "Output of calculations.signature_confidence_score, 4 decimal places" }
      - { name: notes, type: string, source: input, default: null, description: "Free-text reviewer note preserved for the audit trail" }
      - { name: submitted_at, type: datetime, source: computed, default: null, description: "Logical-clock instant the decision was recorded" }

  - name: CureNotice
    parent: null
    common_fields: true
    fields:
      - { name: return_envelope_id, type: string, source: system, description: "FK -> ReturnEnvelope.id; envelope whose signature is deficient" }
      - { name: reason_code, type: enum, source: system, description: "MISSING_SIGNATURE | SIGNATURE_MISMATCH — copied from the dispositive review outcome" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | UNDER_EVIDENCE_REVIEW | CURED | EXPIRED | WITHDRAWN" }
      - { name: issued_at, type: datetime, source: computed, description: "Logical-clock instant of issuance" }
      - { name: cure_deadline_at, type: datetime, source: computed, description: "Frozen at issuance by calculations.cure_deadline_derivation" }
      - { name: open_cure_count_at_issue, type: integer, source: computed, description: "Open cure notices for the election counted at issuance, inclusive of this notice" }
      - { name: canvass_days_at_issue, type: integer, source: computed, description: "canvass_days value used to derive cure_deadline_at" }
      - { name: evidence_submission_count, type: integer, source: computed, default: 0, description: "Count of CureEvidence rows attached to this notice" }
      - { name: deficiency_count, type: integer, source: computed, default: 0, description: "Number of times submitted evidence was adjudicated DEFICIENT, returning the notice to ISSUED" }
      - { name: resolved_at, type: datetime, source: computed, default: null, description: "Logical-clock instant the notice reached CURED, EXPIRED, or WITHDRAWN" }

  - name: CureEvidence
    parent: null
    common_fields: false
    fields:
      - { name: cure_notice_id, type: string, source: system, description: "FK -> CureNotice.id; notice this evidence answers" }
      - { name: evidence_type, type: enum, source: input, description: "SIGNED_AFFIDAVIT | ID_COPY | WITNESS_ATTESTATION" }
      - { name: submission_channel, type: enum, source: input, description: "MAIL | EMAIL | IN_PERSON | PORTAL" }
      - { name: affirmation_signed, type: boolean, source: input, description: "Whether the statutory affirmation block was signed by the voter" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock instant the submission was logged" }
      - { name: accepted, type: boolean, source: computed, default: null, description: "Set when the notice is adjudicated: true on CURED, false on DEFICIENT" }
      - { name: deficiency_reason_code, type: enum, source: computed, default: null, description: "AFFIRMATION_UNSIGNED | WRONG_EVIDENCE_TYPE | ILLEGIBLE" }

  - name: RemakeRecord
    parent: null
    common_fields: true
    fields:
      - { name: original_envelope_id, type: string, source: system, description: "FK -> ReturnEnvelope.id; damaged or duplicate envelope being remade" }
      - { name: team_member_a_reviewer_id, type: string, source: input, description: "FK -> Reviewer.id; first bipartisan team member" }
      - { name: team_member_b_reviewer_id, type: string, source: input, description: "FK -> Reviewer.id; second bipartisan team member, party_affiliation must differ from member A" }
      - { name: reason_code, type: enum, source: input, description: "DAMAGED | UNREADABLE_MARKS | DUPLICATE_BALLOT | TORN_ENVELOPE" }
      - { name: session_start_at, type: datetime, source: input, description: "Start of the two-person remake session (closed interval with buffer)" }
      - { name: session_end_at, type: datetime, source: input, description: "End of the remake session; constraints: session_end_at > session_start_at" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | COMPLETED | VOIDED" }
      - { name: remade_serial, type: string, source: input, default: null, description: "Serial written on the replacement ballot at completion" }
      - { name: remade_envelope_id, type: string, source: computed, default: null, description: "FK -> ReturnEnvelope.id; replacement envelope minted at completion" }
      - { name: completed_at, type: datetime, source: computed, default: null, description: "Logical-clock instant of completion" }
      - { name: voided_reason_code, type: string, source: input, default: null, description: "Reason recorded when a completed or open remake is voided" }

  - name: ObserverAccessSession
    parent: null
    common_fields: true
    fields:
      - { name: election_id, type: string, source: input, description: "FK -> Election.id; election floor being observed" }
      - { name: observer_user_id, type: string, source: input, description: "Opaque observer credential id (matches X-User-ID of the Observer role)" }
      - { name: observer_name, type: string, source: input, description: "Observer's name for the transparency log" }
      - { name: organization, type: string, source: input, description: "Party committee, campaign, or media organization" }
      - { name: party_affiliation, type: enum, source: input, description: "DEM | REP | NPP | OTHER — drives per-party concurrency slots" }
      - { name: station_area, type: enum, source: input, description: "INTAKE | SIGNATURE_REVIEW | SEPARATION | REMAKE" }
      - { name: window_start_at, type: datetime, source: input, description: "Half-open access window start (inclusive)" }
      - { name: window_end_at, type: datetime, source: input, description: "Half-open access window end (exclusive); constraints: window_end_at > window_start_at" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | CHECKED_IN | CLOSED | REVOKED" }
      - { name: revocation_reason_code, type: string, source: input, default: null, description: "Reason recorded when access is revoked" }

  - name: TransparencyLogEntry
    parent: null
    common_fields: false
    fields:
      - { name: election_id, type: string, source: system, description: "FK -> Election.id; election the logged event belongs to" }
      - { name: sequence, type: integer, source: system, description: "1-based monotone counter per election, assigned in append order" }
      - { name: event_type, type: enum, source: system, description: "REQUEST_LOGGED | ENVELOPE_INTAKE | SIGNATURE_DECISION | SIGNATURE_ESCALATION | CURE_ISSUED | CURE_ADJUDICATED | CURE_EXPIRED | SEPARATION_RUN | REMAKE_COMPLETED | REMAKE_VOIDED | CHALLENGE_FILED | CHALLENGE_ADJUDICATED | OBSERVER_SESSION_OPENED | OBSERVER_SESSION_REVOKED | POSTURE_CHANGED | BATCH_DISPATCHED | BATCH_CANCELLED | PACKET_UNDELIVERABLE | ENROLLMENT_SUSPENDED | ENROLLMENT_REINSTATED | PROVISIONAL_REFERRAL" }
      - { name: actor_role, type: enum, source: system, description: "ElectionsAdmin | ElectionsClerk | SignatureReviewer | CanvassSupervisor | Observer | system" }
      - { name: actor_user_id, type: string, source: system, default: null, description: "X-User-ID of the acting principal; null for system-generated events" }
      - { name: subject_entity, type: string, source: system, description: "Entity name of the logged subject (polymorphic): ReturnEnvelope | CureNotice | RemakeRecord | MailingBatch | BallotPacket | PermanentAbsenteeEnrollment | ObserverAccessSession | Election | Voter" }
      - { name: subject_id, type: string, source: system, description: "Id of the logged subject row" }
      - { name: ballot_content_disclosed, type: boolean, source: system, default: false, description: "Always false — the log records custody events only and never ballot selections (secrecy invariant)" }
      - { name: summary, type: string, source: system, description: "Short human-readable description of the event" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock instant the entry was appended" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Election
  - entity: Election
    initial_state: PRE_MAIL
    terminal_states: [CERTIFIED]
    transitions:
      - from: PRE_MAIL
        to: MAILING
        trigger: "system event: first MailingBatch of this election reaches DISPATCHED (auto-transition), or POST /vote-by-mail/elections/{id}/posture-advance with target_posture=MAILING"
        actor: system
        preconditions:
          - "posture == PRE_MAIL"
        side_effects:
          - "appends TransparencyLogEntry (event_type=POSTURE_CHANGED, subject_entity=Election, actor_role=system when auto-triggered)"
          - "recomputes packets_mailed_count and outstanding_packet_count"
        note: "Auto-transition fires as the third link of the batch-dispatch cascade; explicit advance is available before any dispatch."
      - from: MAILING
        to: RECEIVING
        trigger: "system event: first ReturnEnvelope intake for this election (auto-transition), or POST /vote-by-mail/elections/{id}/posture-advance with target_posture=RECEIVING"
        actor: system
        preconditions:
          - "posture == MAILING"
        side_effects:
          - "appends TransparencyLogEntry (event_type=POSTURE_CHANGED)"
      - from: RECEIVING
        to: CANVASS_LOCKED
        trigger: "POST /vote-by-mail/elections/{id}/posture-advance with target_posture=CANVASS_LOCKED"
        actor: ElectionsAdmin
        preconditions:
          - "posture == RECEIVING"
        side_effects:
          - "blocks further ReturnEnvelope intake (ERR_ELECTION_POSTURE_FORBIDS) and further CureNotice issuance"
          - "appends TransparencyLogEntry (event_type=POSTURE_CHANGED)"
      - from: CANVASS_LOCKED
        to: CERTIFIED
        trigger: "POST /vote-by-mail/elections/{id}/posture-advance with target_posture=CERTIFIED"
        actor: ElectionsAdmin
        preconditions:
          - "posture == CANVASS_LOCKED"
          - "reconciliation_status == IN_BALANCE"
          - "open_cure_count == 0"
          - "count of ReturnEnvelope with challenge_status == CHALLENGED for this election == 0"
        side_effects:
          - "freezes all mutating child operations for this election"
          - "appends TransparencyLogEntry (event_type=POSTURE_CHANGED)"

  # ------------------------------------------------------------ BallotRequest
  - entity: BallotRequest
    initial_state: RECEIVED
    terminal_states: [MAILED, REJECTED, SUPERSEDED]
    transitions:
      - from: RECEIVED
        to: ADDRESS_CLEARED
        trigger: "POST /vote-by-mail/address-verifications/{id}/results with ncoa_result IN {MATCH_SAME, MATCH_FORWARDABLE}"
        actor: ElectionsClerk
        preconditions:
          - "linked AddressVerification (AddressVerification.ballot_request_id == BallotRequest.id) has status == PENDING"
          - "election.posture IN {PRE_MAIL, MAILING}"
        side_effects:
          - "sets forwarding_class = SAME_ADDRESS when ncoa_result == MATCH_SAME, else FORWARDABLE"
          - "sets mailing_address_snapshot = AddressVerification.verified_mailing_address when ncoa_result == MATCH_FORWARDABLE"
          - "cascade link 1: linked AddressVerification PENDING -> CLEARED"
      - from: RECEIVED
        to: ADDRESS_HOLD
        trigger: "POST /vote-by-mail/address-verifications/{id}/results with ncoa_result IN {MATCH_NON_FORWARDABLE, NO_MATCH}"
        actor: ElectionsClerk
        preconditions:
          - "linked AddressVerification has status == PENDING"
        side_effects:
          - "sets forwarding_class = NON_FORWARDABLE when ncoa_result == MATCH_NON_FORWARDABLE, else UNKNOWN"
          - "cascade link 1: linked AddressVerification PENDING -> FAILED"
          - "cascade link 2 (caused by this request entering ADDRESS_HOLD with forwarding_class == NON_FORWARDABLE): the voter's PermanentAbsenteeEnrollment with status == ACTIVE increments consecutive_undeliverable_count by 1; when the new value >= PAE_SUSPENSION_THRESHOLD (2) the enrollment transitions ACTIVE -> SUSPENDED with suspension_reason_code = ADDRESS_NON_FORWARDABLE"
          - "cascade link 3 (caused by that suspension): Voter.permanent_absentee_active := false and a TransparencyLogEntry (event_type=ENROLLMENT_SUSPENDED, subject_entity=PermanentAbsenteeEnrollment) is appended"
      - from: ADDRESS_HOLD
        to: ADDRESS_CLEARED
        trigger: "POST /vote-by-mail/address-verifications/{id}/results on a re-opened verification with ncoa_result IN {MATCH_SAME, MATCH_FORWARDABLE}"
        actor: ElectionsClerk
        preconditions:
          - "a linked AddressVerification with status == PENDING exists (created by POST /vote-by-mail/ballot-requests/{id}/address-recheck)"
        side_effects:
          - "sets forwarding_class per the new result"
          - "linked AddressVerification PENDING -> CLEARED"
      - from: ADDRESS_CLEARED
        to: APPROVED
        trigger: "POST /vote-by-mail/ballot-requests/{id}/approve"
        actor: ElectionsClerk
        preconditions:
          - "status == ADDRESS_CLEARED"
          - "voter.registration_status == ACTIVE"
          - "election.posture IN {PRE_MAIL, MAILING}"
        side_effects:
          - "when permanent_flag == true and the voter has no PermanentAbsenteeEnrollment with status IN {ACTIVE, SUSPENDED}, creates PermanentAbsenteeEnrollment in ACTIVE and sets Voter.permanent_absentee_active := true"
      - from: APPROVED
        to: MAILED
        trigger: "system event: carrying BallotPacket transitions QUEUED -> MAILED during batch dispatch"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "a BallotPacket with this ballot_request_id exists in the dispatching batch"
        side_effects:
          - "cascade link 3 of batch dispatch (caused by the packet mailing): Election.packets_mailed_count and Election.outstanding_packet_count recomputed; Election auto-advances PRE_MAIL -> MAILING when still PRE_MAIL"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /vote-by-mail/ballot-requests/{id}/reject"
        actor: ElectionsClerk
        preconditions:
          - "status IN {RECEIVED, ADDRESS_HOLD, ADDRESS_CLEARED}"
        side_effects:
          - "records rejection_reason_code"
          - "sets linked AddressVerification rows with status == PENDING to FAILED"
      - from: ADDRESS_HOLD
        to: REJECTED
        trigger: "POST /vote-by-mail/ballot-requests/{id}/reject"
        actor: ElectionsClerk
        preconditions:
          - "status IN {RECEIVED, ADDRESS_HOLD, ADDRESS_CLEARED}"
        side_effects:
          - "records rejection_reason_code"
      - from: ADDRESS_CLEARED
        to: REJECTED
        trigger: "POST /vote-by-mail/ballot-requests/{id}/reject"
        actor: ElectionsClerk
        preconditions:
          - "status IN {RECEIVED, ADDRESS_HOLD, ADDRESS_CLEARED}"
        side_effects:
          - "records rejection_reason_code"
      - from: RECEIVED
        to: SUPERSEDED
        trigger: "POST /vote-by-mail/ballot-requests (a later request by the same voter for the same election legitimately supersedes the earlier one)"
        actor: ElectionsClerk
        preconditions:
          - "status IN {RECEIVED, ADDRESS_HOLD, ADDRESS_CLEARED, APPROVED}"
          - "the new request passes the OCC check on Voter.version (see concurrency_rules.ballot-request-create-stale-voter)"
        side_effects:
          - "sets linked AddressVerification rows with status == PENDING to FAILED"
          - "when a BallotPacket with status == QUEUED exists for this request, that packet transitions QUEUED -> SPOILED, removing it from the ACTUAL postage input set of its batch"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /vote-by-mail/ballot-requests (a later request by the same voter for the same election supersedes this one)"
        actor: ElectionsClerk
        preconditions:
          - "status IN {RECEIVED, ADDRESS_HOLD, ADDRESS_CLEARED, APPROVED}"
        side_effects:
          - "when a BallotPacket with status == QUEUED exists for this request, that packet transitions QUEUED -> SPOILED"

  # ------------------------------------------------------ AddressVerification
  - entity: AddressVerification
    initial_state: PENDING
    terminal_states: [CLEARED, FAILED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /vote-by-mail/address-verifications/{id}/results with ncoa_result IN {MATCH_SAME, MATCH_FORWARDABLE}"
        actor: ElectionsClerk
        preconditions:
          - "status == PENDING"
          - "linked BallotRequest.status IN {RECEIVED, ADDRESS_HOLD}"
        side_effects:
          - "sets evaluated_at = logical clock now"
          - "drives the linked BallotRequest to ADDRESS_CLEARED"
      - from: PENDING
        to: FAILED
        trigger: "POST /vote-by-mail/address-verifications/{id}/results with ncoa_result IN {MATCH_NON_FORWARDABLE, NO_MATCH}"
        actor: ElectionsClerk
        preconditions:
          - "status == PENDING"
          - "linked BallotRequest.status IN {RECEIVED, ADDRESS_HOLD}"
        side_effects:
          - "sets evaluated_at = logical clock now"
          - "drives the linked BallotRequest to ADDRESS_HOLD, which in turn drives the enrollment-suspension cascade"

  # ------------------------------------------ PermanentAbsenteeEnrollment (cyclic)
  - entity: PermanentAbsenteeEnrollment
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: consecutive_undeliverable_count reaches PAE_SUSPENSION_THRESHOLD (2) via a NON_FORWARDABLE address result or an undeliverable packet"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "consecutive_undeliverable_count + 1 >= PAE_SUSPENSION_THRESHOLD (2)"
        side_effects:
          - "sets suspension_reason_code (ADDRESS_NON_FORWARDABLE or PACKET_UNDELIVERABLE)"
          - "sets Voter.permanent_absentee_active := false"
          - "appends TransparencyLogEntry (event_type=ENROLLMENT_SUSPENDED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /vote-by-mail/permanent-absentee-enrollments/{id}/reinstate"
        actor: ElectionsClerk
        preconditions:
          - "status == SUSPENDED"
          - "confirmation_evidence_type IN {SIGNED_CONFIRMATION_CARD, IN_PERSON_UPDATE, ONLINE_PORTAL_UPDATE}"
        side_effects:
          - "resets consecutive_undeliverable_count := 0 and suspension_reason_code := null"
          - "sets last_confirmation_at = logical clock now and increments reinstated_count by 1"
          - "sets Voter.permanent_absentee_active := true"
          - "appends TransparencyLogEntry (event_type=ENROLLMENT_REINSTATED)"
        note: "Cycle: ACTIVE -> SUSPENDED -> ACTIVE may repeat any number of times; reinstated_count records the loop count."
      - from: SUSPENDED
        to: REMOVED
        trigger: "DELETE /vote-by-mail/permanent-absentee-enrollments/{id}"
        actor: ElectionsClerk
        preconditions:
          - "status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "sets Voter.permanent_absentee_active := false"
      - from: ACTIVE
        to: REMOVED
        trigger: "DELETE /vote-by-mail/permanent-absentee-enrollments/{id}"
        actor: ElectionsClerk
        preconditions:
          - "status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "sets Voter.permanent_absentee_active := false"

  # ------------------------------------------------------------- MailingBatch
  - entity: MailingBatch
    initial_state: DRAFT
    terminal_states: [DISPATCHED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: "POST /vote-by-mail/mailing-batches/{id}/seal"
        actor: ElectionsClerk
        preconditions:
          - "status == DRAFT"
          - "packet_count >= 1"
          - "election.posture IN {PRE_MAIL, MAILING}"
          - "Election.postage_committed_cents + this batch's ESTIMATED postage <= election.postage_budget_cents"
        side_effects:
          - "computes estimated_postage_cents via calculations.postage_assessment variant ESTIMATED over BallotPacket rows with status == QUEUED in this batch, and freezes it"
          - "increments Election.postage_committed_cents by estimated_postage_cents"
          - "sets sealed_at = logical clock now"
      - from: SEALED
        to: DISPATCHED
        trigger: "POST /vote-by-mail/mailing-batches/{id}/dispatch"
        actor: ElectionsClerk
        preconditions:
          - "status == SEALED"
          - "logical clock date <= required_send_by_date (else ERR_UOCAVA_SEND_DEADLINE_PASSED for batch_type == UOCAVA, ERR_DOMESTIC_SEND_DEADLINE_PASSED otherwise)"
          - "Election.postage_actual_cents + this batch's ACTUAL postage <= election.postage_budget_cents"
        side_effects:
          - "computes actual_postage_cents via calculations.postage_assessment variant ACTUAL over BallotPacket rows with status == QUEUED at dispatch time (packets SPOILED after sealing are excluded, so ACTUAL may differ from the frozen ESTIMATED)"
          - "cascade link 1: every BallotPacket in this batch with status == QUEUED transitions QUEUED -> MAILED with mailed_at = logical clock now"
          - "cascade link 2 (caused by each packet mailing): the packet's BallotRequest transitions APPROVED -> MAILED"
          - "cascade link 3 (caused by the request reaching MAILED): Election.packets_mailed_count and Election.outstanding_packet_count are recomputed and the Election auto-advances PRE_MAIL -> MAILING"
          - "appends TransparencyLogEntry (event_type=BATCH_DISPATCHED)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /vote-by-mail/mailing-batches/{id}/cancel"
        actor: ElectionsClerk
        preconditions:
          - "status IN {DRAFT, SEALED}"
        side_effects:
          - "every BallotPacket in this batch with status == QUEUED transitions QUEUED -> SPOILED"
          - "appends TransparencyLogEntry (event_type=BATCH_CANCELLED)"
      - from: SEALED
        to: CANCELLED
        trigger: "POST /vote-by-mail/mailing-batches/{id}/cancel"
        actor: ElectionsClerk
        preconditions:
          - "status IN {DRAFT, SEALED}"
        side_effects:
          - "compensating action: decrements Election.postage_committed_cents by this batch's frozen estimated_postage_cents, restoring the pre-seal value exactly (see calculations.postage_commitment_conservation)"
          - "every BallotPacket in this batch with status == QUEUED transitions QUEUED -> SPOILED"
          - "appends TransparencyLogEntry (event_type=BATCH_CANCELLED)"

  # -------------------------------------------------------------- BallotPacket
  - entity: BallotPacket
    initial_state: QUEUED
    terminal_states: [SPOILED, RETURNED, UNDELIVERABLE]
    transitions:
      - from: QUEUED
        to: MAILED
        trigger: "system event: carrying MailingBatch transitions SEALED -> DISPATCHED"
        actor: system
        preconditions:
          - "status == QUEUED"
          - "carrying MailingBatch.status == SEALED at the moment of dispatch"
        side_effects:
          - "sets mailed_at and drives the linked BallotRequest APPROVED -> MAILED"
      - from: QUEUED
        to: SPOILED
        trigger: "system event: the linked BallotRequest is SUPERSEDED, or the carrying MailingBatch is CANCELLED"
        actor: system
        preconditions:
          - "status == QUEUED"
        side_effects:
          - "removes the packet from the ACTUAL postage input set of its batch"
      - from: MAILED
        to: RETURNED
        trigger: "POST /vote-by-mail/return-envelopes (intake of this packet's envelope)"
        actor: ElectionsClerk
        preconditions:
          - "status == MAILED"
          - "no ReturnEnvelope with this ballot_packet_id and remade_from_envelope_id == null already exists (else ERR_DUPLICATE_ENVELOPE_FOR_PACKET)"
        side_effects:
          - "recomputes Election.envelopes_received_count and Election.outstanding_packet_count"
      - from: MAILED
        to: UNDELIVERABLE
        trigger: "POST /vote-by-mail/ballot-packets/{id}/undeliverable"
        actor: ElectionsClerk
        preconditions:
          - "status == MAILED"
        side_effects:
          - "recomputes Election.undeliverable_packet_count and Election.outstanding_packet_count"
          - "cascade link 1 (caused by the packet becoming UNDELIVERABLE): the voter's PermanentAbsenteeEnrollment with status == ACTIVE increments consecutive_undeliverable_count by 1, transitioning ACTIVE -> SUSPENDED with suspension_reason_code = PACKET_UNDELIVERABLE once the new value >= PAE_SUSPENSION_THRESHOLD (2)"
          - "cascade link 2 (caused by that suspension): Voter.permanent_absentee_active := false and TransparencyLogEntry (event_type=ENROLLMENT_SUSPENDED) appended"
          - "appends TransparencyLogEntry (event_type=PACKET_UNDELIVERABLE)"

  # --------------------- ReturnEnvelope — dimension 1 of 3: signature_status (cyclic)
  - entity: ReturnEnvelope
    initial_state: UNVERIFIED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: UNVERIFIED
        to: PENDING_REVIEW
        trigger: "POST /vote-by-mail/return-envelopes/{id}/signature-reviews"
        actor: ElectionsClerk
        preconditions:
          - "signature_status == UNVERIFIED"
          - "custody_status == SEALED"
          - "election.posture IN {RECEIVING, CANVASS_LOCKED}"
          - "a reviewer satisfying calculations.reviewer_assignment_selection eligibility exists (else ERR_NO_ELIGIBLE_REVIEWER)"
        side_effects:
          - "creates SignatureReview with review_round = 1, status = ASSIGNED, reviewer chosen by calculations.reviewer_assignment_selection"
          - "increments the selected Reviewer.active_review_count by 1"
      - from: PENDING_REVIEW
        to: ACCEPTED
        trigger: "POST /vote-by-mail/signature-reviews/{id}/decision with decision=MATCH and confidence_score >= SIGNATURE_AUTO_ACCEPT_THRESHOLD"
        actor: SignatureReviewer
        preconditions:
          - "signature_status == PENDING_REVIEW"
          - "the acting SignatureReviewer's X-User-ID == SignatureReview.reviewer_id"
          - "Reviewer.training_status IN {TRAINED, CERTIFIED_LEAD} AND Reviewer.training_expires_at > logical clock now"
        side_effects:
          - "sets resolved_signature_confidence = the submitted review's confidence_score"
          - "recomputes Election.countable_envelope_count only after separation (custody dimension governs countability)"
          - "appends TransparencyLogEntry (event_type=SIGNATURE_DECISION)"
      - from: PENDING_REVIEW
        to: ESCALATED
        trigger: "POST /vote-by-mail/signature-reviews/{id}/decision where the round-1 outcome is inconclusive (decision == NO_MATCH, or decision == MATCH with confidence_score < SIGNATURE_AUTO_ACCEPT_THRESHOLD)"
        actor: SignatureReviewer
        preconditions:
          - "signature_status == PENDING_REVIEW"
          - "review_round_count < SIGNATURE_MAX_ROUNDS"
        side_effects:
          - "appends TransparencyLogEntry (event_type=SIGNATURE_ESCALATION)"
          - "leaves the envelope awaiting a new assignment; no new SignatureReview row is created until POST /vote-by-mail/return-envelopes/{id}/signature-reviews is called again"
      - from: ESCALATED
        to: PENDING_REVIEW
        trigger: "POST /vote-by-mail/return-envelopes/{id}/signature-reviews (next escalation round)"
        actor: ElectionsClerk
        preconditions:
          - "signature_status == ESCALATED"
          - "review_round_count < SIGNATURE_MAX_ROUNDS"
          - "a reviewer satisfying the round-specific eligibility filter exists — reviewers who decided any earlier round on this envelope are excluded (segregation of duties), and round 3 additionally requires training_status == CERTIFIED_LEAD"
        side_effects:
          - "creates SignatureReview with review_round = review_round_count + 1, status = ASSIGNED"
          - "increments the selected Reviewer.active_review_count by 1"
        note: "Cycle: PENDING_REVIEW -> ESCALATED -> PENDING_REVIEW repeats until a dispositive outcome or review_round_count == SIGNATURE_MAX_ROUNDS."
      - from: PENDING_REVIEW
        to: CURE_REQUIRED
        trigger: "POST /vote-by-mail/signature-reviews/{id}/decision with decision=MISSING_SIGNATURE (dispositive at any round), or a round >= 2 quorum resolution of MISMATCH per calculations.escalation_quorum_resolution"
        actor: SignatureReviewer
        preconditions:
          - "signature_status == PENDING_REVIEW"
        side_effects:
          - "sets resolved_signature_confidence = the dispositive review's confidence_score"
          - "increments Election.open_cure_count only when a CureNotice is subsequently issued"
          - "appends TransparencyLogEntry (event_type=SIGNATURE_DECISION)"
      - from: CURE_REQUIRED
        to: ACCEPTED
        trigger: "system event: linked CureNotice reaches CURED"
        actor: system
        preconditions:
          - "signature_status == CURE_REQUIRED"
          - "linked CureNotice.status transitions UNDER_EVIDENCE_REVIEW -> CURED"
        side_effects:
          - "sets resolved_signature_confidence unchanged (cure resolves identity, not similarity)"
          - "decrements Election.open_cure_count"
      - from: CURE_REQUIRED
        to: REJECTED
        trigger: "system event: linked CureNotice reaches EXPIRED during POST /vote-by-mail/elections/{id}/canvass-sweep"
        actor: system
        preconditions:
          - "signature_status == CURE_REQUIRED"
          - "linked CureNotice.cure_deadline_at < logical clock now"
        side_effects:
          - "cascade link 2 (caused by the notice expiring): custody_status SEALED -> SEQUESTERED and Election.rejected_envelope_count recomputed"
          - "cascade link 3 (caused by this envelope's rejection): Voter.provisional_ballot_eligible := true, Election.provisional_referral_count incremented, and TransparencyLogEntry (event_type=PROVISIONAL_REFERRAL, subject_entity=Voter) appended"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /vote-by-mail/signature-reviews/{id}/decision where calculations.escalation_quorum_resolution yields REJECT_NO_CURE (envelope is a remake replacement whose original was already cured, i.e. remade_from_envelope_id != null and quorum outcome is MISMATCH)"
        actor: SignatureReviewer
        preconditions:
          - "signature_status == PENDING_REVIEW"
          - "review_round_count + 1 >= 2"
          - "remade_from_envelope_id != null"
        side_effects:
          - "custody_status SEALED -> SEQUESTERED"
          - "Voter.provisional_ballot_eligible := true and Election.provisional_referral_count incremented"

  # ------------------------ ReturnEnvelope — dimension 2 of 3: custody_status
  - entity: ReturnEnvelope
    initial_state: SEALED
    terminal_states: [COUNTED, SUPERSEDED_BY_REMAKE]
    transitions:
      - from: SEALED
        to: SEPARATED
        trigger: "POST /vote-by-mail/elections/{id}/separation-runs listing this envelope"
        actor: ElectionsClerk
        preconditions:
          - "custody_status == SEALED"
          - "signature_status == ACCEPTED"
          - "challenge_status == NONE"
          - "election.posture == RECEIVING"
          - "the run's envelope set size >= BALLOT_SECRECY_MIN_POOL (3) (ballot secrecy)"
        side_effects:
          - "increments Election.separation_run_sequence by 1 and stamps separation_run_sequence on every envelope in the run"
          - "recomputes Election.countable_envelope_count"
          - "appends one TransparencyLogEntry (event_type=SEPARATION_RUN, subject_entity=Election) with ballot_content_disclosed = false"
      - from: SEPARATED
        to: COUNTED
        trigger: "POST /vote-by-mail/return-envelopes/{id}/count"
        actor: CanvassSupervisor
        preconditions:
          - "custody_status == SEPARATED"
          - "challenge_status IN {NONE, OVERRULED}"
          - "final_timeliness IN {TIMELY, TIMELY_BY_POSTMARK} (written by the canvass sweep)"
        side_effects:
          - "recomputes Election.countable_envelope_count"
      - from: SEALED
        to: SEQUESTERED
        trigger: "system event: signature_status reaches REJECTED, or challenge_status reaches CHALLENGED, or final_timeliness == UNTIMELY at canvass sweep"
        actor: system
        preconditions:
          - "custody_status == SEALED"
        side_effects:
          - "excludes the envelope from every separation run while sequestered"
      - from: SEQUESTERED
        to: SEALED
        trigger: "system event: challenge_status transitions CHALLENGED -> OVERRULED and signature_status == ACCEPTED and final_timeliness != UNTIMELY"
        actor: system
        preconditions:
          - "custody_status == SEQUESTERED"
        side_effects:
          - "returns the envelope to the separable pool"
        note: "Cycle on the custody dimension: SEALED -> SEQUESTERED -> SEALED when a challenge is overruled."
      - from: SEALED
        to: SUPERSEDED_BY_REMAKE
        trigger: "system event: a RemakeRecord for this envelope reaches COMPLETED"
        actor: system
        preconditions:
          - "custody_status IN {SEALED, SEQUESTERED}"
        side_effects:
          - "cascade link 1: a replacement ReturnEnvelope is minted with remade_from_envelope_id = this envelope's id, copying ballot_packet_id, intake_channel, postmark_date, postmark_legible, received_at, preliminary_timeliness and signature_status"
          - "cascade link 2 (caused by the supersession): Election.countable_envelope_count is recomputed — the original leaves the countable set and the replacement enters it only after separation"
          - "cascade link 3 (caused by the count change): Election.reconciliation_status is recomputed per calculations.ballot_accountability_reconciliation"
      - from: SEQUESTERED
        to: SUPERSEDED_BY_REMAKE
        trigger: "system event: a RemakeRecord for this envelope reaches COMPLETED"
        actor: system
        preconditions:
          - "custody_status IN {SEALED, SEQUESTERED}"
        side_effects:
          - "mints the replacement envelope as above"
      - from: SUPERSEDED_BY_REMAKE
        to: SEALED
        trigger: "system event: the RemakeRecord that superseded this envelope is VOIDED"
        actor: system
        preconditions:
          - "custody_status == SUPERSEDED_BY_REMAKE"
          - "the voiding RemakeRecord.status == COMPLETED before the void"
        side_effects:
          - "compensating action: the replacement envelope is deleted from the countable set by setting its custody_status := SEQUESTERED and signature_status := REJECTED, and this original returns to SEALED so that Election.countable_envelope_count equals its pre-remake value (see calculations.ballot_countability_conservation)"

  # --------------------- ReturnEnvelope — dimension 3 of 3: challenge_status
  - entity: ReturnEnvelope
    initial_state: NONE
    terminal_states: [SUSTAINED, OVERRULED]
    transitions:
      - from: NONE
        to: CHALLENGED
        trigger: "POST /vote-by-mail/return-envelopes/{id}/challenges"
        actor: Observer
        preconditions:
          - "challenge_status == NONE"
          - "custody_status IN {SEALED, SEQUESTERED} (a separated envelope can no longer be tied to a voter, so it cannot be challenged)"
          - "the acting Observer has an ObserverAccessSession for this election with status == CHECKED_IN whose half-open window contains the logical clock now"
        side_effects:
          - "custody_status SEALED -> SEQUESTERED when currently SEALED"
          - "appends TransparencyLogEntry (event_type=CHALLENGE_FILED, actor_role=Observer)"
      - from: CHALLENGED
        to: SUSTAINED
        trigger: "POST /vote-by-mail/return-envelopes/{id}/challenge-adjudication with outcome=SUSTAIN"
        actor: CanvassSupervisor
        preconditions:
          - "challenge_status == CHALLENGED"
        side_effects:
          - "signature_status := REJECTED, custody_status remains SEQUESTERED"
          - "Voter.provisional_ballot_eligible := true and Election.provisional_referral_count incremented"
          - "appends TransparencyLogEntry (event_type=CHALLENGE_ADJUDICATED)"
      - from: CHALLENGED
        to: OVERRULED
        trigger: "POST /vote-by-mail/return-envelopes/{id}/challenge-adjudication with outcome=OVERRULE"
        actor: CanvassSupervisor
        preconditions:
          - "challenge_status == CHALLENGED"
        side_effects:
          - "custody_status SEQUESTERED -> SEALED when signature_status == ACCEPTED and final_timeliness != UNTIMELY"
          - "appends TransparencyLogEntry (event_type=CHALLENGE_ADJUDICATED)"

  # ----------------------------------------------------------- SignatureReview
  - entity: SignatureReview
    initial_state: ASSIGNED
    terminal_states: [SUBMITTED, VOIDED]
    transitions:
      - from: ASSIGNED
        to: SUBMITTED
        trigger: "POST /vote-by-mail/signature-reviews/{id}/decision"
        actor: SignatureReviewer
        preconditions:
          - "status == ASSIGNED"
          - "X-User-ID == reviewer_id (only the assigned reviewer may submit)"
          - "Reviewer.training_status IN {TRAINED, CERTIFIED_LEAD}"
          - "Reviewer.training_expires_at > logical clock now"
          - "decision == MATCH requires similarity_score present; decision IN {NO_MATCH, MISSING_SIGNATURE, ABSTAIN} requires similarity_score present for NO_MATCH and forbids it for MISSING_SIGNATURE"
          - "linked ReturnEnvelope.signature_status == PENDING_REVIEW"
        side_effects:
          - "computes confidence_score via calculations.signature_confidence_score and sets submitted_at"
          - "decrements Reviewer.active_review_count by 1 and increments Reviewer.completed_review_count by 1"
          - "increments ReturnEnvelope.review_round_count by 1 and drives the envelope's signature dimension per calculations.escalation_quorum_resolution"
          - "appends TransparencyLogEntry (event_type=SIGNATURE_DECISION, subject_entity=ReturnEnvelope)"
      - from: ASSIGNED
        to: VOIDED
        trigger: "system event: the linked ReturnEnvelope reaches custody_status == SUPERSEDED_BY_REMAKE while this review is still ASSIGNED"
        actor: system
        preconditions:
          - "status == ASSIGNED"
        side_effects:
          - "decrements Reviewer.active_review_count by 1"

  # ------------------------------------------------------- CureNotice (cyclic)
  - entity: CureNotice
    initial_state: ISSUED
    terminal_states: [CURED, EXPIRED, WITHDRAWN]
    transitions:
      - from: ISSUED
        to: UNDER_EVIDENCE_REVIEW
        trigger: "POST /vote-by-mail/cure-notices/{id}/evidence"
        actor: ElectionsClerk
        preconditions:
          - "status == ISSUED"
          - "logical clock now <= cure_deadline_at (else ERR_CURE_DEADLINE_PASSED)"
          - "election.posture != CERTIFIED"
        side_effects:
          - "creates a CureEvidence row and increments evidence_submission_count by 1"
          - "appends TransparencyLogEntry (event_type=CURE_ADJUDICATED is NOT appended here; only CURE_ISSUED and CURE_ADJUDICATED events exist, so no entry is written on submission)"
      - from: UNDER_EVIDENCE_REVIEW
        to: CURED
        trigger: "POST /vote-by-mail/cure-notices/{id}/adjudicate with outcome=CURE"
        actor: CanvassSupervisor
        preconditions:
          - "status == UNDER_EVIDENCE_REVIEW"
          - "the newest CureEvidence (highest received_at; tie-break created_at ASC) has affirmation_signed == true"
          - "logical clock now <= cure_deadline_at"
        side_effects:
          - "sets the newest CureEvidence.accepted := true and resolved_at = logical clock now"
          - "drives linked ReturnEnvelope CURE_REQUIRED -> ACCEPTED and decrements Election.open_cure_count"
          - "appends TransparencyLogEntry (event_type=CURE_ADJUDICATED)"
      - from: UNDER_EVIDENCE_REVIEW
        to: ISSUED
        trigger: "POST /vote-by-mail/cure-notices/{id}/adjudicate with outcome=DEFICIENT"
        actor: CanvassSupervisor
        preconditions:
          - "status == UNDER_EVIDENCE_REVIEW"
        side_effects:
          - "sets the newest CureEvidence.accepted := false with deficiency_reason_code and increments deficiency_count by 1"
          - "returns the notice to ISSUED so the voter may submit again before cure_deadline_at"
          - "appends TransparencyLogEntry (event_type=CURE_ADJUDICATED)"
        note: "Cycle: ISSUED -> UNDER_EVIDENCE_REVIEW -> ISSUED repeats; deficiency_count records the loop count. cure_deadline_at is never extended by a loop."
      - from: ISSUED
        to: EXPIRED
        trigger: "system event: POST /vote-by-mail/elections/{id}/canvass-sweep observes cure_deadline_at < logical clock now"
        actor: system
        preconditions:
          - "status IN {ISSUED, UNDER_EVIDENCE_REVIEW}"
          - "cure_deadline_at < logical clock now"
        side_effects:
          - "cascade link 1 root: sets resolved_at and decrements Election.open_cure_count"
          - "cascade link 2 (caused by expiry): linked ReturnEnvelope CURE_REQUIRED -> REJECTED with custody_status SEALED -> SEQUESTERED"
          - "cascade link 3 (caused by that rejection): Voter.provisional_ballot_eligible := true, Election.provisional_referral_count incremented, TransparencyLogEntry (event_type=PROVISIONAL_REFERRAL) appended"
          - "appends TransparencyLogEntry (event_type=CURE_EXPIRED)"
      - from: UNDER_EVIDENCE_REVIEW
        to: EXPIRED
        trigger: "system event: POST /vote-by-mail/elections/{id}/canvass-sweep observes cure_deadline_at < logical clock now"
        actor: system
        preconditions:
          - "status IN {ISSUED, UNDER_EVIDENCE_REVIEW}"
          - "cure_deadline_at < logical clock now"
        side_effects:
          - "same three-link cascade as the ISSUED -> EXPIRED transition; any pending CureEvidence has accepted := false with deficiency_reason_code = ILLEGIBLE left unchanged when already set"
      - from: ISSUED
        to: WITHDRAWN
        trigger: "system event: a RemakeRecord for the notice's envelope reaches COMPLETED (the cure follows the replacement envelope, not the superseded one)"
        actor: system
        preconditions:
          - "status IN {ISSUED, UNDER_EVIDENCE_REVIEW}"
        side_effects:
          - "sets resolved_at and decrements Election.open_cure_count"

  # ----------------------------------------------------------- RemakeRecord
  - entity: RemakeRecord
    initial_state: OPEN
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /vote-by-mail/remake-records/{id}/complete"
        actor: CanvassSupervisor
        preconditions:
          - "status == OPEN"
          - "original ReturnEnvelope.custody_status IN {SEALED, SEQUESTERED}"
          - "original ReturnEnvelope.challenge_status != CHALLENGED"
          - "election.posture IN {RECEIVING, CANVASS_LOCKED}"
          - "remade_serial is present and unique within the election"
        side_effects:
          - "sets completed_at and remade_envelope_id"
          - "drives the original envelope's custody dimension to SUPERSEDED_BY_REMAKE, minting the replacement envelope (three-link cascade documented on that transition)"
          - "any CureNotice on the original envelope with status IN {ISSUED, UNDER_EVIDENCE_REVIEW} transitions to WITHDRAWN"
          - "any SignatureReview on the original envelope with status == ASSIGNED transitions to VOIDED"
          - "appends TransparencyLogEntry (event_type=REMAKE_COMPLETED, subject_entity=RemakeRecord)"
      - from: OPEN
        to: VOIDED
        trigger: "POST /vote-by-mail/remake-records/{id}/void"
        actor: CanvassSupervisor
        preconditions:
          - "status IN {OPEN, COMPLETED}"
        side_effects:
          - "records voided_reason_code; frees both team members' session interval"
          - "appends TransparencyLogEntry (event_type=REMAKE_VOIDED)"
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /vote-by-mail/remake-records/{id}/void"
        actor: CanvassSupervisor
        preconditions:
          - "status IN {OPEN, COMPLETED}"
          - "the replacement envelope has custody_status != COUNTED"
        side_effects:
          - "compensating action: replacement envelope custody_status := SEQUESTERED and signature_status := REJECTED; the original envelope returns SUPERSEDED_BY_REMAKE -> SEALED; Election.countable_envelope_count returns to its exact pre-completion value per calculations.ballot_countability_conservation"
          - "appends TransparencyLogEntry (event_type=REMAKE_VOIDED)"

  # -------------------------------------------------- ObserverAccessSession
  - entity: ObserverAccessSession
    initial_state: SCHEDULED
    terminal_states: [CLOSED, REVOKED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /vote-by-mail/observer-sessions/{id}/check-in"
        actor: Observer
        preconditions:
          - "status == SCHEDULED"
          - "X-User-ID == observer_user_id"
          - "window_start_at <= logical clock now < window_end_at (half-open)"
        side_effects:
          - "appends TransparencyLogEntry (event_type=OBSERVER_SESSION_OPENED, actor_role=Observer)"
      - from: CHECKED_IN
        to: CLOSED
        trigger: "system event: POST /vote-by-mail/elections/{id}/canvass-sweep observes window_end_at <= logical clock now"
        actor: system
        preconditions:
          - "status == CHECKED_IN"
          - "window_end_at <= logical clock now"
        side_effects:
          - "no further challenges may be filed under this session"
      - from: SCHEDULED
        to: REVOKED
        trigger: "POST /vote-by-mail/observer-sessions/{id}/revoke"
        actor: CanvassSupervisor
        preconditions:
          - "status IN {SCHEDULED, CHECKED_IN}"
        side_effects:
          - "records revocation_reason_code and frees the party slot for the session's window"
          - "appends TransparencyLogEntry (event_type=OBSERVER_SESSION_REVOKED)"
      - from: CHECKED_IN
        to: REVOKED
        trigger: "POST /vote-by-mail/observer-sessions/{id}/revoke"
        actor: CanvassSupervisor
        preconditions:
          - "status IN {SCHEDULED, CHECKED_IN}"
        side_effects:
          - "records revocation_reason_code and frees the party slot for the session's window"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: ballot-request-create-stale-voter
    parent_entity: Voter
    write_endpoint: "POST /vote-by-mail/ballot-requests"
    occ_field: "expected_voter_version"
    description: |
      Creating a BallotRequest against a Voter whose version has advanced since
      the client last observed it is rejected. A later request by the same voter
      for the same election legitimately supersedes the earlier one, so the write
      is only accepted when the client's view of the voter — including any
      enrollment, address, or supersession side effect already applied to that
      voter — is current.
    error_id: ERR_STALE_VOTER_VERSION
    http_status: 412

  - rule_id: remake-create-stale-envelope
    parent_entity: ReturnEnvelope
    write_endpoint: "POST /vote-by-mail/return-envelopes/{id}/remakes"
    occ_field: "expected_envelope_version"
    description: |
      Opening a RemakeRecord against a ReturnEnvelope whose version has advanced
      since the client last observed it is rejected. A remake legitimately
      supersedes an earlier remake of the same envelope, so a stale view of the
      envelope (its signature, custody, or challenge dimension having moved)
      cannot authorise a new remake session.
    error_id: ERR_STALE_ENVELOPE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: envelope_timeliness
    trigger: "PRELIMINARY on POST /vote-by-mail/return-envelopes (writes ReturnEnvelope.preliminary_timeliness); FINAL on POST /vote-by-mail/elections/{id}/canvass-sweep (writes ReturnEnvelope.final_timeliness)"
    algorithm: threshold
    formula: |
      grace_limit_at = election.return_deadline_at + election.postmark_grace_days DAYS

      # --- shared no-postmark channels (drop box and counter returns) ---
      if intake_channel IN {DROPBOX, IN_PERSON}:
          result = TIMELY if received_at <= election.return_deadline_at else UNTIMELY
          # identical in both variants — no grace window without a carrier postmark
          return result

      # --- USPS channel ---
      if received_at <= election.return_deadline_at:      # boundary: `<=`, equality is TIMELY
          return TIMELY
      if received_at > grace_limit_at:                    # boundary: `>`, equality is still inside
          return UNTIMELY

      # inside the grace window (return_deadline_at < received_at <= grace_limit_at)
      VARIANT PRELIMINARY:
          if postmark_legible == false OR postmark_date == null:
              return PROVISIONAL_TIMELY_POSTMARK          # intake presumes a timely postmark
          if postmark_date <= election.election_date:
              return PROVISIONAL_TIMELY_POSTMARK
          return UNTIMELY

      VARIANT FINAL:
          if postmark_legible == false OR postmark_date == null:
              return UNTIMELY                            # no presumption survives the canvass
          if postmark_date <= election.election_date:
              return TIMELY_BY_POSTMARK
          return UNTIMELY
    input_set: "One ReturnEnvelope row plus its election. PRELIMINARY runs on every intake; FINAL runs on every ReturnEnvelope of the election whose custody_status != SUPERSEDED_BY_REMAKE at sweep time."
    constants:
      POSTMARK_GRACE_DAYS_DEFAULT: 7
    precision: "Instant comparisons at whole-second resolution in UTC; day arithmetic adds exact 24h multiples."
    variants:
      - name: PRELIMINARY
        when: "Written at intake into preliminary_timeliness; an illegible or missing postmark inside the grace window is given the benefit of the doubt."
        difference: "Returns PROVISIONAL_TIMELY_POSTMARK where FINAL returns UNTIMELY for the same row."
      - name: FINAL
        when: "Written by the canvass sweep into final_timeliness; the statutory record must show a legible postmark on or before election_date."
        difference: "Illegible/missing postmark inside the grace window becomes UNTIMELY, and a legible qualifying postmark is recorded as TIMELY_BY_POSTMARK rather than PROVISIONAL_TIMELY_POSTMARK."

  - name: signature_confidence_score
    trigger: "POST /vote-by-mail/signature-reviews/{id}/decision — writes SignatureReview.confidence_score (and ReturnEnvelope.resolved_signature_confidence when the decision is dispositive)"
    algorithm: weighted_scoring
    formula: |
      # non-linear: capped additive multiplier, conditional branches on two entities' state
      signature_age_days = floor((envelope.received_at - voter.last_signature_update_at) / 86400 seconds)
      on_file_factor     = min(SIGNATURE_ON_FILE_CAP,
                               SIGNATURE_ON_FILE_STEP * (voter.signature_on_file_count - 1))
      staleness_penalty  = SIGNATURE_STALENESS_PENALTY if signature_age_days > SIGNATURE_STALENESS_DAYS else 0.00
      lead_bonus         = SIGNATURE_LEAD_BONUS if reviewer.training_status == CERTIFIED_LEAD else 0.00
      raw                = (similarity_score / 100) * (1 + on_file_factor + lead_bonus) - staleness_penalty
      confidence_score   = round_half_up(max(0.0, min(1.0, raw)), 4)

      # decisions MISSING_SIGNATURE and ABSTAIN carry no similarity_score -> confidence_score = null
    input_set: "The submitting SignatureReview, its Reviewer, the envelope under review, and the Voter reached through envelope -> BallotPacket -> BallotRequest -> Voter. Reviews with status == VOIDED never contribute."
    constants:
      SIGNATURE_ON_FILE_STEP: 0.025
      SIGNATURE_ON_FILE_CAP: 0.10
      SIGNATURE_STALENESS_DAYS: 1460
      SIGNATURE_STALENESS_PENALTY: 0.05
      SIGNATURE_LEAD_BONUS: 0.03
      SIGNATURE_AUTO_ACCEPT_THRESHOLD: 0.72
      SIGNATURE_REJECT_FLOOR: 0.55
    precision: "4 decimal places, round_half_up; clamped to [0.0, 1.0] before rounding."

  - name: escalation_quorum_resolution
    trigger: "POST /vote-by-mail/signature-reviews/{id}/decision — resolves ReturnEnvelope.signature_status after every submission"
    algorithm: chronological
    formula: |
      submitted = SignatureReview rows for this envelope with status == SUBMITTED,
                  ordered by review_round ASC, tie-break created_at ASC   # never by id
      r1, r2, r3 = decisions of rounds 1, 2, 3 (absent rounds are null)

      if any submitted decision == MISSING_SIGNATURE:
          return CURE_REQUIRED with reason_code = MISSING_SIGNATURE        # dispositive at any round

      ROUND 1 only:
          MATCH and confidence_score >= SIGNATURE_AUTO_ACCEPT_THRESHOLD -> ACCEPT
          MATCH and SIGNATURE_REJECT_FLOOR <= confidence_score < SIGNATURE_AUTO_ACCEPT_THRESHOLD -> ESCALATE
          MATCH and confidence_score < SIGNATURE_REJECT_FLOOR -> ESCALATE_LEAD
          NO_MATCH -> ESCALATE
          ABSTAIN  -> ESCALATE

      ROUND 2 (r1 and r2 present):
          r1 == MATCH    and r2 == MATCH    -> ACCEPT                      # confidence no longer gates
          r1 == NO_MATCH and r2 == NO_MATCH -> CURE_REQUIRED with reason_code = SIGNATURE_MISMATCH
          exactly one ABSTAIN, other MATCH    -> ACCEPT
          exactly one ABSTAIN, other NO_MATCH -> ESCALATE_LEAD
          one MATCH and one NO_MATCH (split)  -> ESCALATE_LEAD

      ROUND 3 (dispositive; reviewer.training_status == CERTIFIED_LEAD):
          MATCH    -> ACCEPT
          NO_MATCH -> CURE_REQUIRED with reason_code = SIGNATURE_MISMATCH
          ABSTAIN  -> CURE_REQUIRED with reason_code = SIGNATURE_MISMATCH   # empty-outcome fallback

      # single exception to "mismatch always earns a cure": when the envelope is a remake
      # replacement (remade_from_envelope_id != null), a MISMATCH outcome yields REJECT_NO_CURE
      # because the voter already exhausted the cure opportunity on the superseded envelope.
      ESCALATE      -> envelope signature_status := ESCALATED, next round open to TRAINED or CERTIFIED_LEAD
      ESCALATE_LEAD -> envelope signature_status := ESCALATED, next round restricted to CERTIFIED_LEAD
    input_set: "All SUBMITTED SignatureReview rows of the envelope; VOIDED rows are excluded and do not advance review_round_count."
    constants:
      SIGNATURE_MAX_ROUNDS: 3
    precision: "Deterministic enumeration; no arithmetic beyond the confidence comparisons of signature_confidence_score."

  - name: cure_deadline_derivation
    trigger: "POST /vote-by-mail/return-envelopes/{id}/cure-notices — writes CureNotice.cure_deadline_at, CureNotice.canvass_days_at_issue, CureNotice.open_cure_count_at_issue, Election.canvass_days, Election.canvass_lock_at"
    algorithm: constraint_propagation
    formula: |
      # The dependency looks circular — the cure deadline is bounded by the canvass lock,
      # while the canvass length depends on how many cures are open. The evaluation order
      # below is PINNED and MUST NOT be reordered.
      step 1: insert the new CureNotice with status = ISSUED, then
              n_open = count(CureNotice c JOIN ReturnEnvelope e JOIN BallotPacket p JOIN MailingBatch b
                             WHERE b.election_id == this election
                               AND c.status IN {ISSUED, UNDER_EVIDENCE_REVIEW})
              # inclusive of the notice being issued
      step 2: canvass_days = CANVASS_DAYS_EXTENDED
                             if n_open >= EXTENDED_CANVASS_OPEN_CURE_THRESHOLD    # boundary: `>=`
                             else CANVASS_DAYS_STANDARD
      step 3: canvass_lock_at = election.return_deadline_at + canvass_days DAYS
      step 4: cure_base_deadline_at = election.return_deadline_at + election.cure_window_days DAYS
      step 5: cure_deadline_at = min(cure_base_deadline_at, canvass_lock_at - 1 DAY)

      # Freezing rule: cure_deadline_at, canvass_days_at_issue and open_cure_count_at_issue are
      # frozen on the notice at issuance and are never recomputed — a later notice that raises
      # n_open does NOT extend an earlier notice. Election.canvass_days and Election.canvass_lock_at
      # are monotone: once CANVASS_DAYS_EXTENDED is reached they never return to the standard value,
      # even if cures close.
    input_set: "CureNotice rows of the election with status IN {ISSUED, UNDER_EVIDENCE_REVIEW}, counted at the instant of issuance, inclusive of the new notice."
    constants:
      CANVASS_DAYS_STANDARD: 17
      CANVASS_DAYS_EXTENDED: 21
      EXTENDED_CANVASS_OPEN_CURE_THRESHOLD: 3
    precision: "Whole-day arithmetic on exact 24h multiples of return_deadline_at; result stored as an ISO 8601 UTC instant at whole-second resolution (e.g. 2026-11-19T20:00:00Z)."

  - name: postage_assessment
    trigger: "ESTIMATED on POST /vote-by-mail/mailing-batches/{id}/seal (writes MailingBatch.estimated_postage_cents and Election.postage_committed_cents); ACTUAL on POST /vote-by-mail/mailing-batches/{id}/dispatch (writes MailingBatch.actual_postage_cents and Election.postage_actual_cents); per-packet value written to BallotPacket.packet_postage_cents at packet creation"
    algorithm: tiered_pricing
    formula: |
      # ---- per packet (integer cents throughout) ----
      w = packet.packet_weight_grams
      if   w <= POSTAGE_TIER_1_MAX_GRAMS: outbound = POSTAGE_TIER_1_CENTS
      elif w <= POSTAGE_TIER_2_MAX_GRAMS: outbound = POSTAGE_TIER_2_CENTS
      elif w <= POSTAGE_TIER_3_MAX_GRAMS: outbound = POSTAGE_TIER_3_CENTS
      else: outbound = POSTAGE_TIER_3_CENTS
                       + POSTAGE_OVERWEIGHT_STEP_CENTS
                         * ceil((w - POSTAGE_TIER_3_MAX_GRAMS) / POSTAGE_OVERWEIGHT_STEP_GRAMS)

      surcharge   = round_half_up(outbound * UOCAVA_SURCHARGE_RATE, 0)
                    if voter.uocava_status != NONE else 0
      endorsement = FORWARDING_ENDORSEMENT_CENTS
                    if request.forwarding_class == FORWARDABLE else 0
                    # FORWARDABLE means the packet carries the forwarding endorsement imprint;
                    # SAME_ADDRESS packets never pay it
      packet_postage_cents = outbound + surcharge + endorsement + RETURN_POSTAGE_PREPAID_CENTS

      # ---- batch total: ROUNDING ORDER IS PINNED ----
      # Round the UOCAVA surcharge to whole cents PER PACKET, then sum packets.
      # The batch total is NEVER computed as round_half_up(sum(outbound) * UOCAVA_SURCHARGE_RATE, 0)
      # + sum(other components); the two orders differ by up to one cent per packet.
      batch_total_cents = SUM over the variant's input set of packet_postage_cents
    input_set: "BallotPacket rows of the batch, filtered by the variant below. SPOILED packets are always excluded; QUEUED packets are always included."
    constants:
      POSTAGE_TIER_1_MAX_GRAMS: 28
      POSTAGE_TIER_1_CENTS: 73
      POSTAGE_TIER_2_MAX_GRAMS: 57
      POSTAGE_TIER_2_CENTS: 129
      POSTAGE_TIER_3_MAX_GRAMS: 85
      POSTAGE_TIER_3_CENTS: 185
      POSTAGE_OVERWEIGHT_STEP_GRAMS: 28
      POSTAGE_OVERWEIGHT_STEP_CENTS: 56
      UOCAVA_SURCHARGE_RATE: 0.15
      FORWARDING_ENDORSEMENT_CENTS: 8
      RETURN_POSTAGE_PREPAID_CENTS: 68
    precision: "Whole cents, round_half_up, applied per packet before summation."
    variants:
      - name: ESTIMATED
        when: "Computed at seal over BallotPacket rows with status == QUEUED at that instant, then frozen on the batch."
        difference: "Includes packets that are later SPOILED by a superseding ballot request; the frozen figure is what Election.postage_committed_cents carries."
      - name: ACTUAL
        when: "Computed at dispatch over BallotPacket rows with status == QUEUED at that instant."
        difference: "Excludes packets SPOILED between seal and dispatch, so for identical packet data ACTUAL < ESTIMATED whenever a request was superseded after sealing."

  - name: reviewer_assignment_selection
    trigger: "POST /vote-by-mail/return-envelopes/{id}/signature-reviews — picks SignatureReview.reviewer_id"
    algorithm: weighted_scoring
    formula: |
      target_round = envelope.review_round_count + 1
      lead_required = (target_round == 3) OR (the previous round's outcome was ESCALATE_LEAD)

      candidates = Reviewer rows where
            training_status IN {TRAINED, CERTIFIED_LEAD}
        AND training_expires_at > logical_clock_now
        AND active_review_count < REVIEWER_MAX_OPEN_REVIEWS
        AND id NOT IN {reviewer_id of every SignatureReview of this envelope}   # segregation of duties
        AND (training_status == CERTIFIED_LEAD if lead_required else true)

      ranking (all keys over entity fields, never over id):
        1. active_review_count ASC
        2. completed_review_count ASC
        3. created_at ASC                                  # deterministic final tie-break
      selected = first candidate under the ranking
      empty candidate set -> ERR_NO_ELIGIBLE_REVIEWER (409); no SignatureReview row is created
                             and the envelope's signature_status is left unchanged
    input_set: "All Reviewer rows; no election scoping (the county's reviewer pool is shared across elections)."
    constants:
      REVIEWER_MAX_OPEN_REVIEWS: 12
      TRAINING_VALID_DAYS: 365
    precision: "Integer comparisons on counters; created_at compared at millisecond resolution."

  - name: ballot_accountability_reconciliation
    trigger: "Recomputed on every BallotPacket status change, every ReturnEnvelope custody change, POST /vote-by-mail/elections/{id}/canvass-sweep, and read by GET /vote-by-mail/elections/{id}/accountability"
    algorithm: aggregation
    formula: |
      packets_of_election       = BallotPacket rows whose mailing_batch_id belongs to this election
      packets_mailed_count      = count(packets_of_election with status IN {MAILED, RETURNED, UNDELIVERABLE})
      returned_packet_count     = count(packets_of_election with status == RETURNED)
      outstanding_packet_count  = count(packets_of_election with status == MAILED)
      undeliverable_packet_count= count(packets_of_election with status == UNDELIVERABLE)
      envelopes_received_count  = count(ReturnEnvelope whose ballot_packet_id IN packets_of_election)
                                  # includes remake replacements and superseded originals

      accountability_delta = packets_mailed_count
                             - (returned_packet_count + outstanding_packet_count + undeliverable_packet_count)
      reconciliation_status = IN_BALANCE if accountability_delta == 0 else OUT_OF_BALANCE

      countable_envelope_count = count(ReturnEnvelope of this election where
                                       signature_status == ACCEPTED
                                   AND custody_status IN {SEPARATED, COUNTED}
                                   AND challenge_status != SUSTAINED)
      attributable_ballot_count = count(ReturnEnvelope of this election where
                                        custody_status IN {SEALED, SEPARATED, COUNTED}
                                    AND signature_status != REJECTED)
    input_set: "Every BallotPacket and ReturnEnvelope reachable from the election through MailingBatch; SPOILED and QUEUED packets are excluded from packets_mailed_count."
    constants: {}
    precision: "Exact integer counts; no rounding."

  - name: ballot_countability_conservation
    trigger: "Asserted across POST /vote-by-mail/remake-records/{id}/complete followed by POST /vote-by-mail/remake-records/{id}/void"
    algorithm: aggregation
    formula: |
      conserved quantity (ballots still capable of being counted):
        attributable_ballot_count = count(ReturnEnvelope of the election where
                                          custody_status IN {SEALED, SEPARATED, COUNTED}
                                      AND signature_status != REJECTED)

      Let A0 = attributable_ballot_count immediately before POST .../remakes/{id}/complete.
      After complete: original -> SUPERSEDED_BY_REMAKE (leaves the set),
                      replacement minted SEALED with the original's signature_status (enters the set)
                      => attributable_ballot_count == A0
      After void:     replacement -> SEQUESTERED + REJECTED (leaves the set),
                      original -> SEALED with its pre-remake signature_status (re-enters the set)
                      => attributable_ballot_count == A0
      Drift of any size in attributable_ballot_count is a defect; envelopes_received_count, by contrast,
      is NOT conserved and increases by exactly 1 per completed remake (the replacement row is retained
      forever as an audit artifact).
    input_set: "The election's ReturnEnvelope rows, including SUPERSEDED_BY_REMAKE and SEQUESTERED rows."
    constants: {}
    precision: "Exact integer equality."

  - name: postage_commitment_conservation
    trigger: "Asserted across POST /vote-by-mail/mailing-batches/{id}/seal followed by POST /vote-by-mail/mailing-batches/{id}/cancel"
    algorithm: aggregation
    formula: |
      conserved quantity (money in whole cents):
        Election.postage_committed_cents
          = SUM of estimated_postage_cents over MailingBatch rows with status IN {SEALED, DISPATCHED}

      Let P0 = Election.postage_committed_cents immediately before POST .../seal.
      After seal:   postage_committed_cents == P0 + batch.estimated_postage_cents
      After cancel: postage_committed_cents == P0 exactly (the frozen estimate is released in full,
                    never a recomputed estimate over the now-SPOILED packets)
      Election.postage_actual_cents is untouched by both seal and cancel and remains at its pre-seal value.
    input_set: "MailingBatch rows of the election with status IN {SEALED, DISPATCHED}."
    constants: {}
    precision: "Exact integer cents; no proportional refunds or re-estimation."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:

  # --- 1..2 authentication / authorization -----------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present; X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's §1.5 roles list"
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: all

  # --- 3 request schema ------------------------------------------------------
  - priority: 3
    category: business_constraint
    check: "required body fields present; enum values within declared sets; 0 <= similarity_score <= 100; packet_weight_grams >= 1; signature_on_file_count >= 1; limit within 1..100 and offset >= 0; session_end_at > session_start_at; window_end_at > window_start_at; return_envelope_ids is an array of strings"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  # --- 4 existence (path ids validated left-to-right) ------------------------
  - priority: 4
    category: existence
    check: "election id in path or body resolves to an Election"
    error_id: ERR_ELECTION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying an election id"
  - priority: 4
    category: existence
    check: "voter_id resolves to a Voter"
    error_id: ERR_VOTER_NOT_FOUND
    http_status: 404
    applies_to: "POST /vote-by-mail/ballot-requests, POST /vote-by-mail/voters/{id}/permanent-absentee-enrollments, GET /vote-by-mail/voters/{id}"
  - priority: 4
    category: existence
    check: "reviewer ids resolve to Reviewer rows"
    error_id: ERR_REVIEWER_NOT_FOUND
    http_status: 404
    applies_to: "GET /vote-by-mail/reviewers/{id}, POST /vote-by-mail/reviewers/{id}/training-completions, POST /vote-by-mail/return-envelopes/{id}/remakes"
  - priority: 4
    category: existence
    check: "return envelope id resolves to a ReturnEnvelope (each element of return_envelope_ids is resolved in array order)"
    error_id: ERR_ENVELOPE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying an envelope id, including POST /vote-by-mail/elections/{id}/separation-runs"
  - priority: 4
    category: existence
    check: "ballot request, mailing batch, ballot packet, address verification, signature review, cure notice, remake record, enrollment, observer session, or transparency entry id resolves to a row of the addressed type"
    error_id: ERR_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints addressing those record types"

  # --- 5 optimistic concurrency ---------------------------------------------
  - priority: 5
    category: state
    check: "expected_voter_version equals the current Voter.version"
    error_id: ERR_STALE_VOTER_VERSION
    http_status: 412
    applies_to: "POST /vote-by-mail/ballot-requests"
  - priority: 5
    category: state
    check: "expected_envelope_version equals the current ReturnEnvelope.version"
    error_id: ERR_STALE_ENVELOPE_VERSION
    http_status: 412
    applies_to: "POST /vote-by-mail/return-envelopes/{id}/remakes"

  # --- 6 state preconditions ------------------------------------------------
  - priority: 6
    category: state
    check: "election.posture permits the operation: request intake/approval and batch seal require posture IN {PRE_MAIL, MAILING}; envelope intake requires posture IN {MAILING, RECEIVING}; signature review assignment, decision, cure issuance and remake completion require posture IN {RECEIVING, CANVASS_LOCKED}; separation runs require posture == RECEIVING; nothing mutating is permitted when posture == CERTIFIED; posture-advance targets only the immediate successor posture and only when that transition's preconditions hold"
    error_id: ERR_ELECTION_POSTURE_FORBIDS
    http_status: 409
    applies_to: "all mutating endpoints scoped to an election"
  - priority: 6
    category: state
    check: "BallotRequest.status permits the operation: approve requires ADDRESS_CLEARED; reject requires status IN {RECEIVED, ADDRESS_HOLD, ADDRESS_CLEARED}; address-recheck requires status == ADDRESS_HOLD; packet creation requires status == APPROVED"
    error_id: ERR_REQUEST_STATE_INVALID
    http_status: 409
    applies_to: "POST /vote-by-mail/ballot-requests/{id}/approve, POST /vote-by-mail/ballot-requests/{id}/reject, POST /vote-by-mail/ballot-requests/{id}/address-recheck, POST /vote-by-mail/mailing-batches/{id}/packets"
  - priority: 6
    category: state
    check: "AddressVerification.status == PENDING when a result is recorded"
    error_id: ERR_VERIFICATION_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /vote-by-mail/address-verifications/{id}/results"
  - priority: 6
    category: state
    check: "MailingBatch.status permits the operation: packet creation and seal require DRAFT; dispatch requires SEALED; cancel requires status IN {DRAFT, SEALED}"
    error_id: ERR_BATCH_STATE_INVALID
    http_status: 409
    applies_to: "POST /vote-by-mail/mailing-batches/{id}/packets, POST /vote-by-mail/mailing-batches/{id}/seal, POST /vote-by-mail/mailing-batches/{id}/dispatch, POST /vote-by-mail/mailing-batches/{id}/cancel"
  - priority: 6
    category: state
    check: "BallotPacket.status == MAILED for undeliverable logging; BallotPacket.status IN {MAILED, RETURNED} for envelope intake, so a second scan of an already-returned packet falls through to the priority-9 ERR_DUPLICATE_ENVELOPE_FOR_PACKET rule rather than being reported as a packet-state error"
    error_id: ERR_PACKET_STATE_INVALID
    http_status: 409
    applies_to: "POST /vote-by-mail/return-envelopes, POST /vote-by-mail/ballot-packets/{id}/undeliverable"
  - priority: 6
    category: state
    check: "ReturnEnvelope.signature_status permits the operation: review assignment requires signature_status IN {UNVERIFIED, ESCALATED}; decision submission requires PENDING_REVIEW; cure-notice issuance requires CURE_REQUIRED; separation requires ACCEPTED"
    error_id: ERR_ENVELOPE_SIGNATURE_STATE_INVALID
    http_status: 409
    applies_to: "POST /vote-by-mail/return-envelopes/{id}/signature-reviews, POST /vote-by-mail/signature-reviews/{id}/decision, POST /vote-by-mail/return-envelopes/{id}/cure-notices, POST /vote-by-mail/elections/{id}/separation-runs"
  - priority: 6
    category: state
    check: "SignatureReview.status == ASSIGNED when a decision is submitted (a second submission on the same review is rejected)"
    error_id: ERR_REVIEW_ALREADY_SUBMITTED
    http_status: 409
    applies_to: "POST /vote-by-mail/signature-reviews/{id}/decision"
  - priority: 6
    category: state
    check: "ReturnEnvelope.custody_status permits the operation: separation requires SEALED for every envelope in the run; counting requires SEPARATED; remake creation and completion require custody_status IN {SEALED, SEQUESTERED}"
    error_id: ERR_ENVELOPE_CUSTODY_STATE_INVALID
    http_status: 409
    applies_to: "POST /vote-by-mail/elections/{id}/separation-runs, POST /vote-by-mail/return-envelopes/{id}/count, POST /vote-by-mail/return-envelopes/{id}/remakes, POST /vote-by-mail/remake-records/{id}/complete"
  - priority: 6
    category: state
    check: "CureNotice.status permits the operation: evidence submission requires ISSUED; adjudication requires UNDER_EVIDENCE_REVIEW; issuing a new notice requires that no notice with status IN {ISSUED, UNDER_EVIDENCE_REVIEW} already exists for the envelope"
    error_id: ERR_CURE_STATE_INVALID
    http_status: 409
    applies_to: "POST /vote-by-mail/cure-notices/{id}/evidence, POST /vote-by-mail/cure-notices/{id}/adjudicate, POST /vote-by-mail/return-envelopes/{id}/cure-notices"
  - priority: 6
    category: state
    check: "RemakeRecord.status permits the operation: complete requires OPEN; void requires status IN {OPEN, COMPLETED} and, when COMPLETED, the replacement envelope's custody_status != COUNTED"
    error_id: ERR_REMAKE_STATE_INVALID
    http_status: 409
    applies_to: "POST /vote-by-mail/remake-records/{id}/complete, POST /vote-by-mail/remake-records/{id}/void"
  - priority: 6
    category: state
    check: "PermanentAbsenteeEnrollment.status == SUSPENDED when reinstating; status IN {ACTIVE, SUSPENDED} when removing"
    error_id: ERR_ENROLLMENT_NOT_SUSPENDED
    http_status: 409
    applies_to: "POST /vote-by-mail/permanent-absentee-enrollments/{id}/reinstate, DELETE /vote-by-mail/permanent-absentee-enrollments/{id}"
  - priority: 6
    category: state
    check: "ReturnEnvelope.challenge_status permits the operation: filing requires NONE; adjudication requires CHALLENGED; separation and counting require challenge_status != CHALLENGED"
    error_id: ERR_CHALLENGE_STATE_INVALID
    http_status: 409
    applies_to: "POST /vote-by-mail/return-envelopes/{id}/challenges, POST /vote-by-mail/return-envelopes/{id}/challenge-adjudication, POST /vote-by-mail/elections/{id}/separation-runs, POST /vote-by-mail/return-envelopes/{id}/count"
  - priority: 6
    category: state
    check: "ObserverAccessSession.status == SCHEDULED for check-in and status IN {SCHEDULED, CHECKED_IN} for revocation"
    error_id: ERR_SESSION_STATE_INVALID
    http_status: 409
    applies_to: "POST /vote-by-mail/observer-sessions/{id}/check-in, POST /vote-by-mail/observer-sessions/{id}/revoke"

  # --- 7 election-integrity / safety compliance ------------------------------
  - priority: 7
    category: business_safety
    check: "the acting SignatureReviewer's X-User-ID equals SignatureReview.reviewer_id"
    error_id: ERR_NOT_ASSIGNED_REVIEWER
    http_status: 403
    applies_to: "POST /vote-by-mail/signature-reviews/{id}/decision"
  - priority: 7
    category: business_safety
    check: "the submitting Reviewer has training_status IN {TRAINED, CERTIFIED_LEAD} and training_expires_at > logical clock now"
    error_id: ERR_REVIEWER_TRAINING_INVALID
    http_status: 422
    applies_to: "POST /vote-by-mail/signature-reviews/{id}/decision"
  - priority: 7
    category: business_safety
    check: "a remake team is bipartisan: team_member_a_reviewer_id != team_member_b_reviewer_id AND the two reviewers' party_affiliation values differ"
    error_id: ERR_REMAKE_TEAM_NOT_BIPARTISAN
    http_status: 422
    applies_to: "POST /vote-by-mail/return-envelopes/{id}/remakes"
  - priority: 7
    category: business_safety
    check: "segregation of duties: neither remake team member has a SignatureReview row on the original envelope; and no reviewer may be assigned a second escalation round on an envelope they already decided"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /vote-by-mail/return-envelopes/{id}/remakes, POST /vote-by-mail/return-envelopes/{id}/signature-reviews"
  - priority: 7
    category: business_safety
    check: "return_envelope_ids is non-empty (an empty separation run would produce a transparency entry with no custody effect)"
    error_id: ERR_SEPARATION_SET_EMPTY
    http_status: 400
    applies_to: "POST /vote-by-mail/elections/{id}/separation-runs"
  - priority: 8
    category: business_safety
    check: "ballot secrecy: the count of distinct envelopes in a separation run is >= BALLOT_SECRECY_MIN_POOL (3), so a separated ballot cannot be re-associated with its voter"
    error_id: ERR_BALLOT_SECRECY_POOL_TOO_SMALL
    http_status: 422
    applies_to: "POST /vote-by-mail/elections/{id}/separation-runs"
  - priority: 8
    category: business_safety
    check: "an Observer filing a challenge holds an ObserverAccessSession for this election with status == CHECKED_IN whose half-open window [window_start_at, window_end_at) contains the logical clock now, and whose station_area IN {INTAKE, SIGNATURE_REVIEW}"
    error_id: ERR_OBSERVER_SESSION_REQUIRED
    http_status: 403
    applies_to: "POST /vote-by-mail/return-envelopes/{id}/challenges"

  # --- 9 referential / eligibility ------------------------------------------
  - priority: 9
    category: business_referential
    check: "voter.registration_status == ACTIVE at request creation and at approval"
    error_id: ERR_VOTER_REGISTRATION_INACTIVE
    http_status: 422
    applies_to: "POST /vote-by-mail/ballot-requests, POST /vote-by-mail/ballot-requests/{id}/approve"
  - priority: 9
    category: business_referential
    check: "delivery_method == EMAIL_UOCAVA requires voter.uocava_status IN {MILITARY, OVERSEAS}"
    error_id: ERR_DELIVERY_METHOD_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /vote-by-mail/ballot-requests"
  - priority: 9
    category: business_referential
    check: "batch_type == UOCAVA requires the packet's voter.uocava_status IN {MILITARY, OVERSEAS}; batch_type == DOMESTIC_INITIAL requires voter.uocava_status == NONE; SUPPLEMENTAL accepts either"
    error_id: ERR_UOCAVA_BATCH_MISMATCH
    http_status: 422
    applies_to: "POST /vote-by-mail/mailing-batches/{id}/packets"
  - priority: 9
    category: business_referential
    check: "the packet's BallotRequest.election_id equals the batch's election_id"
    error_id: ERR_REQUEST_ELECTION_MISMATCH
    http_status: 422
    applies_to: "POST /vote-by-mail/mailing-batches/{id}/packets"
  - priority: 9
    category: business_referential
    check: "no ReturnEnvelope with this ballot_packet_id and remade_from_envelope_id == null already exists"
    error_id: ERR_DUPLICATE_ENVELOPE_FOR_PACKET
    http_status: 409
    applies_to: "POST /vote-by-mail/return-envelopes"
  - priority: 9
    category: business_referential
    check: "remade_serial is unique among RemakeRecord rows of the same election with status == COMPLETED"
    error_id: ERR_DUPLICATE_REMAKE_SERIAL
    http_status: 409
    applies_to: "POST /vote-by-mail/remake-records/{id}/complete"

  # --- 10 capacity / interval constraints ----------------------------------
  - priority: 10
    category: business_constraint
    check: "observer party slot: half-open interval semantics — a new session collides with an existing session of the SAME party_affiliation for the same election when new.window_start_at < existing.window_end_at AND existing.window_start_at < new.window_end_at (touching endpoints do NOT collide); at most OBSERVER_MAX_CONCURRENT_PER_PARTY (1) session per party may overlap; sessions with status == REVOKED are excluded from the occupancy set"
    error_id: ERR_OBSERVER_PARTY_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /vote-by-mail/elections/{id}/observer-sessions"
  - priority: 10
    category: business_constraint
    check: "observer floor capacity: aggregate occupancy over the same half-open geometry across all parties must stay <= OBSERVER_MAX_CONCURRENT_TOTAL (3) at every instant of the new window; sessions with status == REVOKED are excluded"
    error_id: ERR_OBSERVER_FLOOR_CAPACITY
    http_status: 409
    applies_to: "POST /vote-by-mail/elections/{id}/observer-sessions"
  - priority: 10
    category: business_constraint
    check: "remake session double-booking: CLOSED interval semantics with a changeover buffer — for either team member, the new session collides with any RemakeRecord with status IN {OPEN, COMPLETED} on which that reviewer sits when new.session_start_at - REMAKE_CHANGEOVER_BUFFER_MINUTES (15) <= existing.session_end_at AND existing.session_start_at <= new.session_end_at + REMAKE_CHANGEOVER_BUFFER_MINUTES (touching endpoints DO collide)"
    error_id: ERR_REMAKE_TEAM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /vote-by-mail/return-envelopes/{id}/remakes"
  - priority: 10
    category: business_constraint
    check: "the reviewer candidate set of calculations.reviewer_assignment_selection is non-empty"
    error_id: ERR_NO_ELIGIBLE_REVIEWER
    http_status: 409
    applies_to: "POST /vote-by-mail/return-envelopes/{id}/signature-reviews"

  # --- 11 statutory deadlines (temporal) ------------------------------------
  - priority: 11
    category: business_temporal
    check: "a UOCAVA batch dispatches on or before required_send_by_date (= election.uocava_send_deadline_date)"
    error_id: ERR_UOCAVA_SEND_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /vote-by-mail/mailing-batches/{id}/dispatch"
  - priority: 11
    category: business_temporal
    check: "a DOMESTIC_INITIAL or SUPPLEMENTAL batch dispatches on or before required_send_by_date"
    error_id: ERR_DOMESTIC_SEND_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /vote-by-mail/mailing-batches/{id}/dispatch"
  - priority: 11
    category: business_temporal
    check: "logical clock now <= CureNotice.cure_deadline_at for evidence submission and for CURE adjudication"
    error_id: ERR_CURE_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /vote-by-mail/cure-notices/{id}/evidence, POST /vote-by-mail/cure-notices/{id}/adjudicate"
  - priority: 11
    category: business_temporal
    check: "check-in occurs inside the half-open window: window_start_at <= logical clock now < window_end_at"
    error_id: ERR_OBSERVER_WINDOW_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /vote-by-mail/observer-sessions/{id}/check-in"
  - priority: 11
    category: business_temporal
    check: "the logical clock never moves backwards: to_iso8601 > current logical clock value"
    error_id: ERR_CLOCK_REWIND_FORBIDDEN
    http_status: 422
    applies_to: "POST /vote-by-mail/_clock/set_current_utc"

  # --- 12 fiscal (last) -----------------------------------------------------
  - priority: 12
    category: business_fiscal
    check: "postage authority: at seal, Election.postage_committed_cents + batch ESTIMATED total <= election.postage_budget_cents; at dispatch, Election.postage_actual_cents + batch ACTUAL total <= election.postage_budget_cents"
    error_id: ERR_POSTAGE_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /vote-by-mail/mailing-batches/{id}/seal, POST /vote-by-mail/mailing-batches/{id}/dispatch"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ------------------------------------------------------------- Election
  - method: POST
    path: "/vote-by-mail/elections"
    description: "Register an election with its statutory mailing, return, and cure parameters"
    roles: [ElectionsAdmin]
    code: 201
    input: [name, election_date, uocava_send_deadline_date, domestic_send_deadline_date, return_deadline_at, postage_budget_cents, "postmark_grace_days?", "cure_window_days?"]
    output: Election
    side_effects:
      - "creates the Election in posture = PRE_MAIL with canvass_days = CANVASS_DAYS_STANDARD and canvass_lock_at = return_deadline_at + 17 days"
      - "all counters initialise to 0 and reconciliation_status = IN_BALANCE"
  - method: GET
    path: "/vote-by-mail/elections/{id}"
    description: "Read one election including derived counters and posture"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor, SignatureReviewer, Observer]
    code: 200
    input: []
    output: Election
    side_effects: []
  - method: GET
    path: "/vote-by-mail/elections"
    description: "List elections"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor, Observer]
    code: 200
    input: ["posture?", "limit?", "offset?"]
    output: Election[]
    side_effects: []
  - method: POST
    path: "/vote-by-mail/elections/{id}/posture-advance"
    description: "Advance the election posture to the immediate successor (PRE_MAIL -> MAILING -> RECEIVING -> CANVASS_LOCKED -> CERTIFIED)"
    roles: [ElectionsAdmin]
    code: 200
    input: [target_posture]
    output: Election
    side_effects:
      - "applies the §1.2 Election transition and appends a TransparencyLogEntry (event_type=POSTURE_CHANGED)"
      - "CANVASS_LOCKED blocks further envelope intake and cure issuance; CERTIFIED freezes every mutating child operation"
  - method: GET
    path: "/vote-by-mail/elections/{id}/accountability"
    description: "Computed read of the ballot-accountability reconciliation for this election"
    roles: [ElectionsAdmin, ElectionsClerk, CanvassSupervisor, Observer]
    code: 200
    input: []
    output: "{ election_id: string, packets_mailed_count: integer, returned_packet_count: integer, outstanding_packet_count: integer, undeliverable_packet_count: integer, envelopes_received_count: integer, countable_envelope_count: integer, attributable_ballot_count: integer, rejected_envelope_count: integer, provisional_referral_count: integer, open_cure_count: integer, accountability_delta: integer, reconciliation_status: string, postage_committed_cents: integer, postage_actual_cents: integer }"
    side_effects: []
  - method: POST
    path: "/vote-by-mail/elections/{id}/canvass-sweep"
    description: "Canvass checkpoint: expires overdue cure notices, writes the FINAL timeliness variant on every non-superseded envelope, sequesters UNTIMELY envelopes, closes observer sessions whose window has ended, and recomputes accountability"
    roles: [ElectionsAdmin]
    code: 200
    input: []
    output: "{ canvass_sweep_index: integer, expired_cure_count: integer, finalized_envelope_count: integer, sequestered_envelope_count: integer, rejected_envelope_count: integer, closed_observer_session_count: integer, reconciliation_status: string }"
    side_effects:
      - "increments Election.canvass_sweep_index by 1"
      - "each CureNotice with cure_deadline_at < now and status IN {ISSUED, UNDER_EVIDENCE_REVIEW} transitions to EXPIRED, driving the three-link rejection cascade"
      - "writes ReturnEnvelope.final_timeliness via calculations.envelope_timeliness variant FINAL"
      - "envelopes whose final_timeliness == UNTIMELY move custody_status SEALED -> SEQUESTERED"
      - "ObserverAccessSession rows with status == CHECKED_IN and window_end_at <= now transition to CLOSED"
      - "response counters describe only what THIS sweep changed: finalized_envelope_count = envelopes whose final_timeliness was written, sequestered_envelope_count = every envelope this sweep moved to SEQUESTERED (whether by UNTIMELY finalization or by the cure-expiry rejection cascade), rejected_envelope_count = envelopes this sweep moved signature_status to REJECTED, closed_observer_session_count = sessions this sweep closed"

