            - { call: "POST /api/ingredients/${i9}/approve", as: CertificationReviewer }
            - { call: "POST /api/products", payload: { client_id: "${c9}", brand: "B", name: "P9", ingredient_ids: ["${i9}"] }, as: ClientContact, as_user_id: "${c9}", captures: { p9: $.data.id } }
            - { call: "POST /api/products/${p9}/submit-review", as: ClientContact, as_user_id: "${c9}" }
            - { call: "POST /api/products/${p9}/certify-eligible", as: CertificationReviewer }
