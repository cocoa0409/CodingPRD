            - call: "POST /naturalization/applicants/${app_id}/packets"
              payload: { workshop_seat_id: "${seat_id}", prepared_by_volunteer_id: "${vp_id}", fee_waiver_request_id: "${fwr_id}" }
              as: IntakeCoordinator
              captures: { pkt_id: $.data.id }
          trigger:
            - call: "POST /naturalization/packets/${pkt_id}/certify"
              payload: {}
              as: Volunteer
              as_user_id: "${vs_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority 6 state check beats priority 16 ERR_FEE_WAIVER_PENDING)"
            - "http status == 409"
            - "packet remains DRAFT; no side effects fired"

      - name: workshop_complete_lapsed_supervisor_safety_beats_temporal
        grounds:
          - validations[priority=8]
          - validations[priority=10]
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal: completing a workshop
          whose supervising volunteer has LAPSED (via 24-month clock sweep) while the
          workshop's scheduled_start is still in the future fails both priority-8
          safety and priority-10 temporal checks; ERR_ACCREDITATION_LAPSED must win.
        test_recipe:
