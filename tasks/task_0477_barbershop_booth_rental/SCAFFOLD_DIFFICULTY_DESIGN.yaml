              payload: {}
              as: ShopOwner
            - call: "GET /shops/${shop_id}"
              payload: {}
              as: ShopOwner
              captures: { shop_v1: $.data.version }
            - call: "POST /shifts"
              payload: { shop_id: "${shop_id}", barber_id: "${b_id}", chair_id: "${chair_id}", start_utc: "2026-06-10T09:00:00Z", end_utc: "2026-06-10T12:00:00Z", expected_shop_version: "${shop_v1}" }
              as: ShopOwner
            - call: "GET /shops/${shop_id}"
              payload: {}
              as: ShopOwner
              captures: { shop_v2: $.data.version }
          trigger:
            - call: "POST /shifts"
              payload: { shop_id: "${shop_id}", barber_id: "${b_id}", chair_id: "${chair_id}", start_utc: "2026-06-10T12:00:00Z", end_utc: "2026-06-10T15:00:00Z", expected_shop_version: "${shop_v2}" }
              as: ShopOwner
              captures: { err: $.data.error_id }
          assert:
            - "Back-to-back shift starting at 12:00 (== prior end, gap 0 < grace 10m) rejected ERR_SHIFT_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # --- Instance 1: void compensates product stock (conserved: ProductSku.stock_qty) ---
      - name: void_ticket_conserves_product_stock
        grounds:
          - state_machines.Ticket.OPEN_to_VOIDED
          - state_machines.Ticket.OPEN_to_PAID
          - entities.ProductSku.fields.stock_qty
        distinguishing_aspect: "Conserved quantity = ProductSku.stock_qty. A void on an OPEN ticket (before checkout decrements stock) leaves stock_qty unchanged from its pre-ticket value: invariant stock_qty_after_void == stock_qty_initial, because the decrement only happens at PAID. Stock is the conserved quantity."
        test_recipe:
          setup:
            - "Clock 2026-06-10T08:00:00Z; Shop OPEN; Barber ACTIVE; Customer; walk-in served => OPEN ticket; Product Pomade stock 5; line Pomade x2 added (not yet decremented)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: ShopOwner
            - call: "POST /shops"
              payload: { name: "Conserve Shop", tax_rate_pct: 0, default_booth_rent_cents: 0, default_commission_pct: 0 }
              as: ShopOwner
              captures: { shop_id: $.data.id }
            - call: "POST /products"
              payload: { shop_id: "${shop_id}", name: "Pomade", price_cents: 1200, stock_qty: 5 }
              as: ShopOwner
              captures: { prod_id: $.data.id }
            - call: "POST /barbers"
              payload: { shop_id: "${shop_id}", full_name: "Bo", license_number: "L1", license_expires_on: "2027-01-01", comp_model: "COMMISSION" }
              as: ShopOwner
              captures: { b_id: $.data.id }
            - call: "POST /barbers/${b_id}/license/activate"
              payload: {}
              as: ShopOwner
            - call: "POST /customers"
              payload: { shop_id: "${shop_id}", full_name: "Cara", email: "cara@x.com" }
              as: ShopOwner
              captures: { cust_id: $.data.id }
            - call: "POST /queue"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", requested_barber_id: "${b_id}" }
              as: Receptionist
              captures: { q_id: $.data.id }
            - call: "POST /queue/${q_id}/serve"
              payload: {}
              as: Receptionist
              captures: { tk_id: $.data.ticket_id }
            - call: "PUT /tickets/${tk_id}/lines"
              payload: { product_lines: [{ product_sku_id: "${prod_id}", qty: 2 }] }
              as: Receptionist
          trigger:
            - call: "POST /tickets/${tk_id}/void"
              payload: {}
              as: ShopOwner
              captures: { st: $.data.status }
            - call: "GET /products/${prod_id}"
              payload: {}
              as: ShopOwner
              captures: { stock_after: $.data.stock_qty }
          assert:
            - "Ticket.status == VOIDED"
            - "ProductSku.stock_qty == 5 (unchanged: invariant stock_after == stock_initial, decrement never applied on OPEN->VOIDED)"
            - "QueueTicket reverts to WAITING after the void"

