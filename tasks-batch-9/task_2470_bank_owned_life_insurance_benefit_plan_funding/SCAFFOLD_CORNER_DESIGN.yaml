  - section: consistency_model
    instances:
      - name: liability_create_is_immediately_visible_in_the_plan_totals
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /nqdc-liabilities]
        distinguishing_aspect: "The consistency model is immediate: the plan totals recomputed as a side effect of POST /nqdc-liabilities are already correct in the very next read, with no settling period — the create response, the plan read and the funding summary all agree on 940231.40 without any intervening revalue call."
        test_recipe:
          setup:
            - "One ACTIVE NqdcPlan with discount_rate_bps 500 and no participants."
          setup_api_calls:
            - call: "POST /nqdc-plans"
              payload: { plan_name: "Immediate SERP", plan_type: "SERP", discount_rate_bps: 500 }
              as: TreasuryController
              captures: { plan_im_id: $.data.id }
            - call: "POST /employees"
              payload: { full_name: "Sara Nowak", employee_number: "E-9701", annual_salary_usd: 900000.00 }
              as: BenefitsAnalyst
              captures: { emp_nowak_id: $.data.id }
            - call: "GET /nqdc-plans/${plan_im_id}"
              payload: {}
              as: TreasuryController
              captures: { plan_im_v_before: $.data.version }
          trigger:
            - call: "POST /nqdc-liabilities"
              payload: { nqdc_plan_id: "${plan_im_id}", employee_id: "${emp_nowak_id}", accrued_to_date_usd: 1000000.00, projected_benefit_usd: 1200000.00, years_to_payout: 5 }
              as: TreasuryController
              captures: { liab_nowak_id: $.data.id }
            - call: "GET /nqdc-plans/${plan_im_id}"
              payload: {}
              as: TreasuryController
            - call: "GET /nqdc-plans/${plan_im_id}/funding-summary"
              payload: { basis: "PBO" }
              as: TreasuryController
          assert:
            - "before the trigger: NqdcPlan.${plan_im_id}.accrual_liability_usd == 0.00, pbo_liability_usd == 0.00, funded_ratio_bps == 10000 and funding_posture == FUNDED"
            - "trigger call 1 returns HTTP 201 with NqdcParticipantLiability.${liab_nowak_id}.discounted_benefit_usd == 940231.40 and status == ACTIVE"
            - "trigger call 2 returns NqdcPlan.${plan_im_id}.accrual_liability_usd == 1000000.00, pbo_liability_usd == 940231.40, matched_cash_value_usd == 0.00, funded_ratio_bps == 0 and funding_posture == CRITICAL"
            - "trigger call 2 returns NqdcPlan.${plan_im_id}.version == ${plan_im_v_before} + 1"
            - "trigger call 3 returns basis == PBO with basis_liability_usd == 940231.40, funded_ratio_bps == 0, funding_posture == CRITICAL and participant_count == 1"
            - "NqdcPlan.${plan_im_id}.status == ACTIVE, since only revalue and the distribution cascade may freeze a plan"
