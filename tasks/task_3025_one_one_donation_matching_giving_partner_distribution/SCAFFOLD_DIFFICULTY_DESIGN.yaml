            - "error_id != ERR_CAPACITY_EXCEEDED, even though 5 units against a 1-unit ceiling also violates the capacity rule"
            - "PartnerCapacityProfile.${cap_id}.committed_units is still 1, so the losing check never mutated anything"

# ===========================================================================
  # Rule 6 — boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: need_score_zero_access_boundary_sits_at_exactly_one_thousand_recipients
        grounds:
          - calculations.need_score
          - entities.GivingPartner.fields.need_score
          - validations[priority=5]
        distinguishing_aspect: "The access component reads unduplicated_recipients_per_facility // 1000, so 999 recipients add nothing while 1000 add exactly one point, and the approval gate is tested with >= on a metric that sits one point from the boundary — 40 versus 39."
        test_recipe:
          setup:
            - "The running season is OPEN at 2026-09-01T00:00:00Z; two clinic partners are created one second apart so their created_at values order deterministically."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /impact-program/impact-seasons"
              payload: { season_code: "2026-Q3", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-12-31T00:00:00Z", freezes_at: "2026-12-01T00:00:00Z" }
              as: ImpactAuditor
              captures: { s_id: $.data.id }
            - call: "POST /impact-program/giving-partners"
              payload: { legal_name: "Iota Health Access West", partner_type: "COMMUNITY_HEALTH_CLINIC", operating_region: "WEST", operating_state_code: "WA", service_radius_miles: 20, registry_id: "WA-CHR-900009", ein: "999000111", founded_year: 1988, unduplicated_recipients_per_facility: 19999, need_tier: "COMMUNITY_HEALTH_CLINIC" }
              as: GivingPartnerCoordinator
              captures: { p_below_id: $.data.id, vt_below_id: $.data.latest_vetting_round_id }
            - call: "PUT /impact-program/vetting-rounds/${vt_below_id}"
              payload: { outcome: "EVALUATING", registry_check_passed: true, tax_check_passed: true, on_site_check_passed: true, capacity_check_passed: true, need_verification_points: 1, valid_until: "2027-01-01T00:00:00Z" }
              as: GivingPartnerCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ImpactAuditor
            - call: "POST /impact-program/giving-partners"
              payload: { legal_name: "Kappa Health Access West", partner_type: "COMMUNITY_HEALTH_CLINIC", operating_region: "WEST", operating_state_code: "WA", service_radius_miles: 20, registry_id: "WA-CHR-910010", ein: "999000222", founded_year: 1988, unduplicated_recipients_per_facility: 20000, need_tier: "COMMUNITY_HEALTH_CLINIC" }
              as: GivingPartnerCoordinator
              captures: { p_at_id: $.data.id, vt_at_id: $.data.latest_vetting_round_id }
            - call: "PUT /impact-program/vetting-rounds/${vt_at_id}"
              payload: { outcome: "EVALUATING", registry_check_passed: true, tax_check_passed: true, on_site_check_passed: true, capacity_check_passed: true, need_verification_points: 1, valid_until: "2027-01-01T00:00:00Z" }
              as: GivingPartnerCoordinator
          trigger:
            - call: "POST /impact-program/vetting-rounds/${vt_at_id}/approve"
              payload: {}
              as: GivingPartnerCoordinator
            - call: "POST /impact-program/vetting-rounds/${vt_below_id}/approve"
              payload: {}
              as: GivingPartnerCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "GivingPartner.${p_below_id}.need_score == 39 at 19999 recipients, because 19999 // 1000 == 19"
            - "GivingPartner.${p_at_id}.need_score == 40 at 20000 recipients, because 20000 // 1000 == 20"
            - "the approve against ${p_at_id} returns 200 and its status becomes APPROVED"
            - "the approve against ${p_below_id} returns 409 ERR_NEED_SCORE_BELOW_MINIMUM"
            - "GivingPartner.${p_below_id}.status is still VETTING, so the one-point boundary is exactly the gate"

      - name: allocation_ceiling_at_fifty_reuses_the_same_largest_remainder_sweep
        grounds:
          - calculations.weighted_allocation
