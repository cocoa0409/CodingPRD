scaffold_difficulty_design:
  # ===================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: medicare_provisional_vs_final_reimbursement
        grounds:
          - calculations.medicare_provisional_reimbursement
          - calculations.medicare_final_reimbursement
          - state_machines.MedicareClaim.DRAFT_to_SUBMITTED
          - state_machines.MedicareClaim.SUBMITTED_to_PAID
          - entities.MedicareClaim.fields.provisional_reimbursement_cents
          - entities.MedicareClaim.fields.medicare_paid_cents
        distinguishing_aspect: |
          On one MedicareClaim the optimistic provisional (assumes deductible met)
          yields 24000 at submit while the final adjudication that subtracts the
          real 25700 remaining deductible yields medicare_paid 3440 — divergent
          numbers on the MedicareClaim domain.
        test_recipe:
          setup:
            - "Clock at 2026-07-01. Diabetic A5500 product allowable 30000, price 32000; stock; adult Medicare customer; COMPLETE certification; a fulfilled sale for one unit; a DRAFT claim billed 32000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Dia Depth Shoe", brand: "Apex", category: "DIABETIC", base_price_cents: 32000, medicare_allowable_cents: 30000, hcpcs_code: "A5500" }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", size: 9.0, width: "D", lot_number: "L1", quantity_on_hand: 5 }
              as: StoreManager
              captures: { inv_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Beneficiary", date_of_birth: "1950-01-01", medicare_beneficiary_id: "1EG4TE5MK73" }
              as: StoreManager
              captures: { cust_id: $.data.id, cust_v: $.data.version }
            - call: "POST /fitters"
              payload: { full_name: "Pat Ped", credential: "C.Ped" }
              as: StoreManager
              captures: { fitter_id: $.data.id }
            - call: "POST /customers/${cust_id}/certifications"
              payload: { certifying_physician_npi: "1234567890", prescribing_practitioner_npi: "0987654321", statement_date: "2026-06-01", in_person_visit_date: "2026-05-01", expected_customer_version: "${cust_v}" }
              as: BillingSpecialist
              captures: { cert_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}", fitter_id: "${fitter_id}" }
              as: Fitter
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { inventory_item_id: "${inv_id}", quantity: 1 }
              as: Fitter
              captures: { line_id: $.data.id }
            - call: "POST /sales/${sale_id}/fulfill"
              payload: {}
              as: Fitter
            - call: "POST /medicare-claims"
              payload: { customer_id: "${cust_id}", sale_id: "${sale_id}", certification_id: "${cert_id}", hcpcs_code: "A5500", billed_amount_cents: 32000 }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /medicare-claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
              captures: { prov: $.data.provisional_reimbursement_cents }
            - call: "POST /medicare-claims/${claim_id}/adjudicate"
              payload: { payer_decision: "PAID" }
              as: BillingSpecialist
          assert:
            - "MedicareClaim.${claim_id}.allowed_amount_cents == 30000"
            - "MedicareClaim.${claim_id}.provisional_reimbursement_cents == 24000"
            - "MedicareClaim.${claim_id}.medicare_paid_cents == 3440"
            - "MedicareClaim.${claim_id}.patient_responsibility_cents == 26560"

      - name: loyalty_provisional_vs_net_after_return
        grounds:
          - calculations.loyalty_points_accrual
          - state_machines.Sale.fulfillment_PENDING_to_FULFILLED
          - state_machines.ReturnRequest.APPROVED_to_REFUNDED
          - entities.Sale.fields.loyalty_points_earned
          - entities.Customer.fields.loyalty_points_balance
        distinguishing_aspect: |
          Provisional loyalty minted at fulfill is 176 over both lines; after the
          45.50 line is returned the REVERSAL takes the balance to 130 — a
          divergent value on the Customer/loyalty domain, distinct from the
          MedicareClaim dual-variant.
        test_recipe:
          setup:
            - "BRONZE customer; two-line sale (12950 + 4550) fulfilled -> 176 provisional points; a RETURN request on the 4550 line, approved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Walker", brand: "Drew", category: "THERAPEUTIC", base_price_cents: 12950 }
              as: StoreManager
              captures: { prodA_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Insert Pair", brand: "Drew", category: "INSERT", base_price_cents: 4550 }
              as: StoreManager
              captures: { prodB_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prodA_id}", size: 10.0, width: "D", lot_number: "LA", quantity_on_hand: 5 }
              as: StoreManager
              captures: { invA_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prodB_id}", size: 10.0, width: "D", lot_number: "LB", quantity_on_hand: 5 }
              as: StoreManager
              captures: { invB_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ben Bronze", date_of_birth: "1960-03-03" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /fitters"
              payload: { full_name: "Fi Fit" }
              as: StoreManager
              captures: { fitter_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}", fitter_id: "${fitter_id}" }
              as: Fitter
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { inventory_item_id: "${invA_id}", quantity: 1 }
              as: Fitter
              captures: { lineA_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { inventory_item_id: "${invB_id}", quantity: 1 }
              as: Fitter
              captures: { lineB_id: $.data.id }
            - call: "POST /sales/${sale_id}/fulfill"
              payload: {}
              as: Fitter
              captures: { earned: $.data.loyalty_points_earned }
            - call: "POST /returns"
              payload: { sale_id: "${sale_id}", sale_line_id: "${lineB_id}", return_type: "RETURN" }
              as: StoreManager
              captures: { ret_id: $.data.id }
            - call: "POST /returns/${ret_id}/approve"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /returns/${ret_id}/refund"
              payload: {}
              as: StoreManager
          assert:
            - "Sale.${sale_id}.loyalty_points_earned == 176"
            - "Customer.${cust_id}.loyalty_points_balance == 130"

  # ===================================================================
  # Rule 2 — combinatorial formulas across different modes
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: medicare_final_nested_min_deductible_absorption
        grounds:
          - calculations.medicare_final_reimbursement
          - entities.MedicareClaim.fields.allowed_amount_cents
          - entities.MedicareClaim.fields.medicare_paid_cents
          - entities.Customer.fields.medicare_deductible_remaining_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — allowed = min(billed 20000,
          allowable 30000) = 20000 (billed wins), then deductible_applied =
          min(20000, 25700) = 20000 absorbs it all, so medicare_paid = 0 and
          patient_responsibility = 20000. Two nested mins with a branch.
        test_recipe:
          setup:
            - "Clock 2026-07-01. A5500 product allowable 30000; adult Medicare customer with full 25700 deductible remaining; fulfilled sale; DRAFT claim billed 20000 (below allowable)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Dia Shoe 2", brand: "Apex", category: "DIABETIC", base_price_cents: 24000, medicare_allowable_cents: 30000, hcpcs_code: "A5500" }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", size: 8.5, width: "E", lot_number: "L2", quantity_on_hand: 3 }
              as: StoreManager
              captures: { inv_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cy Copay", date_of_birth: "1948-02-02", medicare_beneficiary_id: "2FG5UF6NL84" }
              as: StoreManager
              captures: { cust_id: $.data.id, cust_v: $.data.version }
            - call: "POST /fitters"
              payload: { full_name: "Fo Fit" }
              as: StoreManager
              captures: { fitter_id: $.data.id }
            - call: "POST /customers/${cust_id}/certifications"
              payload: { certifying_physician_npi: "1112223334", prescribing_practitioner_npi: "5556667778", statement_date: "2026-06-15", in_person_visit_date: "2026-06-01", expected_customer_version: "${cust_v}" }
              as: BillingSpecialist
              captures: { cert_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}", fitter_id: "${fitter_id}" }
              as: Fitter
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { inventory_item_id: "${inv_id}", quantity: 1 }
              as: Fitter
            - call: "POST /sales/${sale_id}/fulfill"
              payload: {}
              as: Fitter
            - call: "POST /medicare-claims"
              payload: { customer_id: "${cust_id}", sale_id: "${sale_id}", certification_id: "${cert_id}", hcpcs_code: "A5500", billed_amount_cents: 20000 }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
            - call: "POST /medicare-claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /medicare-claims/${claim_id}/adjudicate"
              payload: { payer_decision: "PAID" }
              as: BillingSpecialist
          assert:
            - "MedicareClaim.${claim_id}.allowed_amount_cents == 20000"
            - "MedicareClaim.${claim_id}.deductible_applied_cents == 20000"
            - "MedicareClaim.${claim_id}.medicare_paid_cents == 0"
            - "MedicareClaim.${claim_id}.patient_responsibility_cents == 20000"

      - name: loyalty_round_per_line_then_sum
        grounds:
          - calculations.loyalty_points_accrual
          - entities.Sale.fields.loyalty_points_earned
          - state_machines.Sale.fulfillment_PENDING_to_FULFILLED
        distinguishing_aspect: |
          Mode (b): nested rounding order — round-per-line (130 + 46) = 176, the
          pinned order, whereas sum-then-round (129.50 + 45.50 = 175.00) = 175.
          The scaffold pins round-per-line-then-sum, so the observable is 176.
        test_recipe:
          setup:
            - "BRONZE customer; two-line sale 12950 + 4550; fulfill."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Shoe R1", brand: "New Balance", category: "REGULAR", base_price_cents: 12950 }
              as: StoreManager
              captures: { prodA_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Shoe R2", brand: "New Balance", category: "INSERT", base_price_cents: 4550 }
              as: StoreManager
              captures: { prodB_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prodA_id}", size: 11.0, width: "2E", lot_number: "RA", quantity_on_hand: 4 }
              as: StoreManager
              captures: { invA_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prodB_id}", size: 11.0, width: "2E", lot_number: "RB", quantity_on_hand: 4 }
              as: StoreManager
              captures: { invB_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dee Delta", date_of_birth: "1955-05-05" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /fitters"
              payload: { full_name: "Fu Fit" }
              as: StoreManager
              captures: { fitter_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}", fitter_id: "${fitter_id}" }
              as: Fitter
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { inventory_item_id: "${invA_id}", quantity: 1 }
              as: Fitter
            - call: "POST /sales/${sale_id}/lines"
              payload: { inventory_item_id: "${invB_id}", quantity: 1 }
              as: Fitter
          trigger:
            - call: "POST /sales/${sale_id}/fulfill"
              payload: {}
              as: Fitter
              captures: { earned: $.data.loyalty_points_earned }
          assert:
            - "Sale.${sale_id}.loyalty_points_earned == 176"
            - "Sale.${sale_id}.loyalty_tier_at_fulfill == BRONZE"

  # ===================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_denied_resubmit_cycle
        grounds:
          - state_machines.MedicareClaim.SUBMITTED_to_DENIED
          - state_machines.MedicareClaim.DENIED_to_SUBMITTED
          - entities.MedicareClaim.fields.status
        distinguishing_aspect: |
          MedicareClaim returns to SUBMITTED after DENIED (A->B->A cycle) via
          resubmit and can be DENIED again — a cyclic shape impossible in a
          linear pipeline.
        test_recipe:
          setup:
            - "Clock 2026-07-01. Fulfilled sale, COMPLETE cert; a claim submitted then adjudicated DENIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Dia Shoe 3", brand: "Apex", category: "DIABETIC", base_price_cents: 30000, medicare_allowable_cents: 30000, hcpcs_code: "A5500" }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", size: 9.5, width: "D", lot_number: "L3", quantity_on_hand: 2 }
              as: StoreManager
              captures: { inv_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ed Cycle", date_of_birth: "1947-07-07", medicare_beneficiary_id: "3GH6VG7OM95" }
              as: StoreManager
              captures: { cust_id: $.data.id, cust_v: $.data.version }
            - call: "POST /fitters"
              payload: { full_name: "Fy Fit" }
              as: StoreManager
              captures: { fitter_id: $.data.id }
            - call: "POST /customers/${cust_id}/certifications"
              payload: { certifying_physician_npi: "2223334445", prescribing_practitioner_npi: "6667778889", statement_date: "2026-06-10", in_person_visit_date: "2026-06-05", expected_customer_version: "${cust_v}" }
              as: BillingSpecialist
              captures: { cert_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}", fitter_id: "${fitter_id}" }
              as: Fitter
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { inventory_item_id: "${inv_id}", quantity: 1 }
              as: Fitter
            - call: "POST /sales/${sale_id}/fulfill"
              payload: {}
              as: Fitter
            - call: "POST /medicare-claims"
              payload: { customer_id: "${cust_id}", sale_id: "${sale_id}", certification_id: "${cert_id}", hcpcs_code: "A5500", billed_amount_cents: 30000 }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
            - call: "POST /medicare-claims/${claim_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /medicare-claims/${claim_id}/adjudicate"
              payload: { payer_decision: "DENIED" }
              as: BillingSpecialist
          trigger:
            - call: "POST /medicare-claims/${claim_id}/resubmit"
              payload: {}
              as: BillingSpecialist
              captures: { st_after_resubmit: $.data.status }
            - call: "POST /medicare-claims/${claim_id}/adjudicate"
              payload: { payer_decision: "DENIED" }
              as: BillingSpecialist
              captures: { st_after_2nd: $.data.status }
          assert:
            - "MedicareClaim.${claim_id}.status transitioned DENIED -> SUBMITTED on resubmit (st_after_resubmit == SUBMITTED)"
            - "MedicareClaim.${claim_id}.status == DENIED after the second adjudicate"

      - name: sale_parallel_payment_and_fulfillment_axes
        grounds:
          - state_machines.Sale.payment_UNPAID_to_PAID
          - state_machines.Sale.fulfillment_PENDING_to_FULFILLED
          - entities.Sale.fields.payment_status
          - entities.Sale.fields.fulfillment_status
        distinguishing_aspect: |
          Sale.payment_status flips UNPAID->PAID while fulfillment_status is still
          PENDING, then fulfillment_status flips PENDING->FULFILLED with
          payment_status unchanged — two independent axes on the same row.
        test_recipe:
          setup:
            - "One-line unfulfilled, unpaid sale (subtotal 8000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Shoe P", brand: "Hoka", category: "REGULAR", base_price_cents: 8000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", size: 12.0, width: "D", lot_number: "PP", quantity_on_hand: 3 }
              as: StoreManager
              captures: { inv_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Gina Grid", date_of_birth: "1970-01-01" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /fitters"
              payload: { full_name: "Ge Fit" }
              as: StoreManager
              captures: { fitter_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}", fitter_id: "${fitter_id}" }
              as: Fitter
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { inventory_item_id: "${inv_id}", quantity: 1 }
              as: Fitter
          trigger:
            - call: "POST /sales/${sale_id}/pay"
              payload: { amount_tendered_cents: 8000 }
              as: Fitter
              captures: { pay_status: $.data.payment_status, ful_status_mid: $.data.fulfillment_status }
            - call: "POST /sales/${sale_id}/fulfill"
              payload: {}
              as: Fitter
              captures: { ful_status_final: $.data.fulfillment_status, pay_status_final: $.data.payment_status }
          assert:
            - "After pay: Sale.${sale_id}.payment_status == PAID AND Sale.${sale_id}.fulfillment_status == PENDING"
            - "After fulfill: Sale.${sale_id}.fulfillment_status == FULFILLED AND Sale.${sale_id}.payment_status == PAID"

  # ===================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: recall_issue_quarantine_cancel_deposit_chain
        grounds:
          - state_machines.Recall.DRAFT_to_ISSUED
          - state_machines.InventoryItem
          - state_machines.SpecialOrder.ORDERED_to_CANCELLED
          - entities.InventoryItem.fields.status
          - entities.SpecialOrder.fields.status
          - entities.Customer.fields.loyalty_points_balance
        distinguishing_aspect: |
          Depth-4 chain from Recall.issue: InventoryItem -> QUARANTINED (link1)
          causes matching SpecialOrder -> CANCELLED (link2) which mints an ADJUST
          deposit-refund LoyaltyLedgerEntry of +50 (link3) which moves
          Customer.loyalty_points_balance to 50 (link4).
        test_recipe:
          setup:
            - "Product P with AVAILABLE stock (lot L1) and an ORDERED special order (deposit 5000); a DRAFT recall on product P."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Recalled Shoe", brand: "Aetrex", category: "THERAPEUTIC", base_price_cents: 8000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", size: 9.0, width: "D", lot_number: "L1", quantity_on_hand: 3 }
              as: StoreManager
              captures: { inv_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Hal Hold", date_of_birth: "1962-06-06" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", requested_size: 9.0, requested_width: "D", deposit_cents: 5000 }
              as: StoreManager
              captures: { so_id: $.data.id }
            - call: "POST /special-orders/${so_id}/place"
              payload: {}
              as: StoreManager
            - call: "POST /recalls"
              payload: { product_id: "${prod_id}", reason: "adhesive delamination" }
              as: StoreManager
              captures: { recall_id: $.data.id }
          trigger:
            - call: "POST /recalls/${recall_id}/issue"
              payload: {}
              as: StoreManager
          assert:
            - "InventoryItem.${inv_id}.status == QUARANTINED"
            - "SpecialOrder.${so_id}.status == CANCELLED"
            - "Customer.${cust_id}.loyalty_points_balance == 50"

      - name: return_refund_restock_bubble_reversal_chain
        grounds:
          - state_machines.ReturnRequest.APPROVED_to_REFUNDED
          - state_machines.Sale.fulfillment_FULFILLED_to_PARTIALLY_RETURNED
          - entities.SaleLine.fields.status
          - entities.InventoryItem.fields.quantity_on_hand
          - entities.Customer.fields.loyalty_points_balance
        distinguishing_aspect: |
          Depth-3 chain from ReturnRequest.refund (different trigger than recall):
          SaleLine -> RETURNED with InventoryItem.quantity_on_hand restocked 4->5
          (link1) bubbles Sale.fulfillment_status -> PARTIALLY_RETURNED (link2) and
          mints a -100 REVERSAL leaving balance 40 (link3).
        test_recipe:
          setup:
            - "BRONZE customer; two-line sale (10000 line A + 4000 line B) fulfilled (earned 140); RETURN on line A approved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Shoe A", brand: "Brooks", category: "REGULAR", base_price_cents: 10000 }
              as: StoreManager
              captures: { prodA_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Shoe B", brand: "Brooks", category: "INSERT", base_price_cents: 4000 }
              as: StoreManager
              captures: { prodB_id: $.data.id }
