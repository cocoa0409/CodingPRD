              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/documents/${rf_d4}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/transactions/${rf_txn}/verify-documents"
              payload: {}
              as: IntakeClerk
              captures: { rf_v1: $.data.version }
            - call: "POST /dmv/transactions/${rf_txn}/quote"
              payload: { expected_transaction_version: "${rf_v1}" }
              as: FeeAnalyst
