  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: balance_inconsistent_submit_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_BALANCE_INCONSISTENT]"]
        distinguishing_aspect: "Submit of a balance whose billed + unbilled + apparent losses exceed system input (real_loss_raw < 0) fails with ERR_BALANCE_INCONSISTENT."
        test_recipe:
          setup: ["DMA with DRAFT balance where billed 900000 + unbilled 50000 + unauth 40000 + inacc 30000 > SIV 1000000"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-VAL1", name: "Val One", connection_count: 5000, mains_length_km: 120.0, target_nrw_pct: 20.0 }
              as: ProgramDirector
              captures: { dma_v1: $.data.id, dma_v1_v: $.data.version }
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_v1}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", system_input_volume_m3: 1000000, billed_authorized_m3: 900000, unbilled_authorized_m3: 50000, unauthorized_consumption_m3: 40000, metering_inaccuracy_m3: 30000, expected_dma_version: "${dma_v1_v}" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { wbp_v1: $.data.id }
          trigger:
            - call: "POST /nrw/water-balance-periods/${wbp_v1}/submit"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { err_v1: $.data.error_id }
          assert:
            - "captured error_id == ERR_BALANCE_INCONSISTENT"
            - "WaterBalancePeriod.${wbp_v1}.status remains DRAFT"

      - name: pressure_target_must_be_below_baseline
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", entities.PressureProject.fields.target_pressure_m]
        distinguishing_aspect: "Creating a pressure project with target_pressure_m >= baseline_pressure_m fails with ERR_VALIDATION."
        test_recipe:
          setup: ["DMA exists"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-VAL2", name: "Val Two", connection_count: 1000, mains_length_km: 30.0, target_nrw_pct: 15.0 }
              as: ProgramDirector
              captures: { dma_v2: $.data.id }
          trigger:
            - call: "POST /nrw/pressure-projects"
              payload: { dma_id: "${dma_v2}", name: "PRV VAL2", planned_start: "2026-08-01T00:00:00Z", planned_end: "2026-09-01T00:00:00Z", baseline_pressure_m: 60.0, target_pressure_m: 60.0 }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { err_v2: $.data.error_id }
          assert:
            - "captured error_id == ERR_VALIDATION"

      - name: night_flow_window_duration_bounds
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", entities.NightFlowAssessment.fields.window_end]
        distinguishing_aspect: "A 1-hour window (< 2h minimum) is rejected with ERR_WINDOW_CONFLICT; a 3-hour window passes."
        test_recipe:
          setup: ["DMA exists"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-VAL3", name: "Val Three", connection_count: 1000, mains_length_km: 30.0, target_nrw_pct: 15.0 }
              as: ProgramDirector
              captures: { dma_v3: $.data.id }
          trigger:
            - call: "POST /nrw/night-flow-assessments"
              payload: { dma_id: "${dma_v3}", window_start: "2026-08-02T01:00:00Z", window_end: "2026-08-02T02:00:00Z", measured_mnf_lps: 6.0, expected_legitimate_night_use_lps: 2.0 }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { err_v3: $.data.error_id }
            - call: "POST /nrw/night-flow-assessments"
              payload: { dma_id: "${dma_v3}", window_start: "2026-08-02T01:00:00Z", window_end: "2026-08-02T04:00:00Z", measured_mnf_lps: 6.0, expected_legitimate_night_use_lps: 2.0 }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { nf_v3: $.data.id }
          assert:
            - "1-hour window rejected with ERR_WINDOW_CONFLICT"
            - "3-hour window accepted: assessment ${nf_v3} created"

      - name: complete_repair_requires_actual_cost
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_MISSING_PREREQUISITE]"]
        distinguishing_aspect: "complete-repair without actual_repair_cost fails with ERR_MISSING_PREREQUISITE."
        test_recipe:
          setup: ["leak in REPAIR_SCHEDULED"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-VAL4", name: "Val Four", connection_count: 1000, mains_length_km: 30.0, target_nrw_pct: 15.0 }
              as: ProgramDirector
              captures: { dma_v4: $.data.id }
            - call: "POST /nrw/leak-surveys"
              payload: { dma_id: "${dma_v4}", planned_start: "2026-08-02T00:00:00Z", planned_end: "2026-08-10T00:00:00Z", method: "ACOUSTIC", crew_lead_user_id: "fs-1" }
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { sv_v4: $.data.id }
            - call: "POST /nrw/leak-surveys/${sv_v4}/start"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
            - call: "POST /nrw/leaks"
              payload: { survey_id: "${sv_v4}", location_description: "Main & 8th", estimated_loss_lps: 1.0, detected_at: "2026-08-02T04:00:00Z", repair_cost_estimate: 4000 }
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { leak_v4: $.data.id }
            - call: "POST /nrw/leaks/${leak_v4}/verify"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
            - call: "POST /nrw/leaks/${leak_v4}/schedule-repair"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
          trigger:
            - call: "POST /nrw/leaks/${leak_v4}/complete-repair"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { err_v4: $.data.error_id }
          assert:
            - "captured error_id == ERR_MISSING_PREREQUISITE"
            - "Leak.${leak_v4}.status remains REPAIR_SCHEDULED"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_shape_on_success_and_error
        claim_type: endpoint_contract
        grounds: [response_envelope]
        distinguishing_aspect: "Success responses carry meta.api_request_id, meta.api_request_timestamp, response_type 'object'|'array', and data; error responses carry response_type 'error' and data.error_id/message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-ENV", name: "Envelope", connection_count: 100, mains_length_km: 5.0, target_nrw_pct: 10.0 }
              as: ProgramDirector
              captures: { dma_env: $.data.id }
            - call: "GET /nrw/dmas/11111111-2222-4333-8444-555555555555"
              as: ProgramDirector
              captures: { err_env: $.data.error_id }
          assert:
            - "success envelope: meta.api_request_id present, response_type == object, data.id == ${dma_env}"
            - "error envelope: response_type == error, data.error_id == ERR_NOT_FOUND, data.message present"

      - name: audit_events_recorded_for_mutations
        claim_type: side_effect_execution
        grounds: [entities.AuditEvent, "endpoints[GET /nrw/audit-events]"]
        distinguishing_aspect: "Every mutation appends an AuditEvent queryable by entity_type/entity_id with actor_user_id and actor_role recorded."
        test_recipe:
          setup: ["a DMA created by ProgramDirector"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-AUD", name: "Audit", connection_count: 100, mains_length_km: 5.0, target_nrw_pct: 10.0 }
              as: ProgramDirector
              captures: { dma_aud: $.data.id }
          trigger:
            - call: "GET /nrw/audit-events?entity_type=DistrictMeteredArea&entity_id=${dma_aud}"
              as: ProgramDirector
          assert:
            - "at least one AuditEvent with entity_id == ${dma_aud} exists"
            - "the event's actor_role == ProgramDirector and action references creation"

