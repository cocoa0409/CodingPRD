            - { call: "GET /abatement/projects/${p_id}", payload: {}, as: ContractorAdmin, captures: { fin: "$.data.final_disposal_cost_cents" } }
          assert:
            - "WasteManifest.${m1_id}.fee_cents == 15008"
            - "WasteManifest.${m2_id}.fee_cents == 15008"
            - "Project.${p_id}.final_disposal_cost_cents == 30016 (sum of rounded), NOT 30015 (round of sum)"

      - name: project_cost_rollup_surcharge_on_pre_surcharge_subtotal
        grounds:
          - calculations.project_cost_rollup
          - entities.Project.fields.insurance_surcharge_cents
          - entities.Project.fields.total_project_cost_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order:
          surcharge = 8% of (base + final_disposal) only, then total = subtotal +
          surcharge; with base 5000000 and final 30016, surcharge =
          round_half_up(5030016 * 0.08) = 402401 and total = 5432417 — an
