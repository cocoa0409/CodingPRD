          assert:
            - "GET /remittance-statements filtered by channel and state OPEN returns total_count 1, so the statement is still open after both rejections"
            - "Settling an OPEN statement returns 409 ERR_INVALID_STATEMENT_STATE (the state check at priority 39 precedes the emptiness rule at 42)"
            - "Disputing an OPEN statement also returns 409 ERR_INVALID_STATEMENT_STATE"
            - "RemittanceStatement.${stmt_id}.state is still OPEN with settled_at null and reconciled_by_user_id null"
            - "GET /remittance-statements/${stmt_id}/preview still reports gross_sales_cents 0 and net_payable_cents 0"

