            - call: "POST /turf/leases"
              payload: { course_id: "${c1}", cycle_months: 36, start_date: "2029-09-01", lines: [{ model_id: "${m1}", qty: 1 }] }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
            - call: "POST /turf/leases"
              payload: { course_id: "${c1}", cycle_months: 36, start_date: "2029-09-02", lines: [{ model_id: "${m1}", qty: 1 }] }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { l_next: $.data.id }
          assert:
            - "err == ERR_LEASE_CYCLE_OVERLAP for start == existing end_date (closed interval)"
            - "FleetLease.${l_next} created for start 2029-09-02 (first non-overlapping date)"
      - name: irrigation_halfopen_adjacency_allowed_overlap_rejected
