    roles: [ShopClerk]
    code: 201
    input: [items, "member_id?"]
    output: Sale
    side_effects: ["sale_total computed", "stock decremented per line"]
  - method: GET
    path: "/sales"
    description: "List sales with filters"
    roles: [ShopClerk, Admin]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: Sale[]
    side_effects: []
  - method: GET
    path: "/sales/{id}"
    description: "Read a sale"
    roles: [ShopClerk, Admin]
    code: 200
    input: []
    output: Sale
    side_effects: []
  - method: POST
    path: "/repair-orders"
    description: "Intake a repair order"
    roles: [ShopClerk]
    code: 201
    input: [member_id, item_description]
    output: RepairOrder
    side_effects: ["status INTAKE"]
  - method: GET
    path: "/repair-orders"
    description: "List repair orders with filters"
    roles: [ShopClerk, Member, Admin]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: RepairOrder[]
    side_effects: []
  - method: GET
    path: "/repair-orders/{id}"
    description: "Read a repair order"
    roles: [ShopClerk, Member, Admin]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []
  - method: POST
    path: "/repair-orders/{id}/quote"
    description: "Quote a repair (from INTAKE, or re-quote from QUOTED superseding the prior quote); OCC-guarded; reserves parts stock; increments RepairOrder.version"
    roles: [ShopClerk]
    code: 200
    input: [parts, labor_minutes, promised_hours, expected_repair_order_version]
    output: RepairOrder
    side_effects: ["-> QUOTED", "repair_quote_total computed", "stock reserved", "increments RepairOrder.version by 1"]
  - method: POST
    path: "/repair-orders/{id}/approve"
    description: "Owner approves a QUOTED repair"
    roles: [Member]
    code: 200
    input: []
