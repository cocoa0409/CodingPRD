              as_user_id: "${emp_id}"
            - call: "POST /plan-admin/participants"
              payload: { employer_id: "${emp_id}", full_name: "Ada Reyes", date_of_birth: "1975-05-05", hire_date: "2014-08-01", scheduled_hours_per_week: 40, prior_year_hours_worked: 2000, includible_compensation_cents: 9000000, years_of_service: 12 }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /plan-admin/plans/${p1_id}/universal-availability-notices"
              payload: { plan_year: 2026, issued_date: "2026-01-05", delivery_method: "INTRANET_POSTING", recipient_count: 250, describes_effective_opportunity: true }
              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { n1_id: $.data.id }
            - call: "POST /plan-admin/plans/${p2_id}/universal-availability-notices"
              payload: { plan_year: 2026, issued_date: "2026-01-05", delivery_method: "EMAIL", recipient_count: 249, describes_effective_opportunity: true }
