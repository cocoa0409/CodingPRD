            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s_id}", quantity_ordered: 40, declared_cube_m3: 10 }, as: PurchasingAgent, captures: { l_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "ACKNOWLEDGED" }, as: Vendor }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "READY_TO_SHIP" }, as: Vendor }
            - { call: "POST /api/shipments", payload: { project_id: "${p_id}", carrier_name: "CARR-1" }, as: PurchasingAgent, captures: { sh1_id: $.data.id } }
            - { call: "POST /api/shipments/${sh1_id}/transitions", payload: { to_status: "CONSOLIDATING" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh1_id}/purchase-orders", payload: { purchase_order_id: "${po_id}" }, as: PurchasingAgent }
            - { call: "POST /api/shipments", payload: { project_id: "${p_id}", carrier_name: "CARR-2" }, as: PurchasingAgent, captures: { sh2_id: $.data.id } }
          trigger:
            - { call: "POST /api/shipments/${sh2_id}/transitions", payload: { to_status: "SEALED" }, as: PurchasingAgent, captures: { err: $.data.error_id } }
            - { call: "POST /api/shipments/${sh1_id}/transitions", payload: { to_status: "CANCELLED" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh1_id}/transitions", payload: { to_status: "IN_TRANSIT" }, as: PurchasingAgent, captures: { err2: $.data.error_id } }
