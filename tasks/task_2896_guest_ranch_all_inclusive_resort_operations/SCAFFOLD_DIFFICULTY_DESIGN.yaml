          setup:
            - "OPEN season, cabin, party of three with a confirmed 7-night booking"
            - "guest Ann waivered with equine_statute_ack true and BEGINNER-assessed"
            - "one ACTIVE guide holding EQUINE_HANDLER plus WILDERNESS_FIRST_AID certifications"
