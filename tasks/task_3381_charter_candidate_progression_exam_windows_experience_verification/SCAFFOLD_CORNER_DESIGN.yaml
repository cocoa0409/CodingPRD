          trigger:
            - call: "POST /charter/appointments/${appt_a}/check-in"
              payload: { identity_document_number: "GOV-A-1001", actual_calculator_model: "TI_BA_II_PLUS" }
              as: Proctor
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_CHECKIN_NOT_ON_EXAM_DATE"
            - "ExamAppointment.${appt_a}.booking_status still == SCHEDULED and no attempt was created"

      - name: c_identity_checked_before_calculator
        claim_type: Violation → Error
        grounds:
          - validations.priority_10_business_safety
          - errors.ERR_IDENTITY_VERIFICATION_FAILED
          - errors.ERR_CALCULATOR_POLICY_VIOLATION
        distinguishing_aspect: "Within the safety group the identity check runs first: a check-in failing both identity and calculator returns ERR_IDENTITY_VERIFICATION_FAILED; fixing the identity then surfaces ERR_CALCULATOR_POLICY_VIOLATION; only the fully conforming pair checks in."
        test_recipe:
          setup:
            - "A ENROLLED, booked W1 for 2027-03-03 declaring TI_BA_II_PLUS. Clock at exam day 2027-03-03T08:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - *c_enroll_a
            - *c_pay_enr_a
            - *c_level1
            - *c_win1
            - *c_ctr2
            - *c_book_a
            - *c_clock_mar03
          trigger:
            - call: "POST /charter/appointments/${appt_a}/check-in"
              payload: { identity_document_number: "GOV-WRONG", actual_calculator_model: "HP_12C" }
              as: Proctor
              captures: { err1: $.data.error_id }
            - call: "POST /charter/appointments/${appt_a}/check-in"
              payload: { identity_document_number: "GOV-A-1001", actual_calculator_model: "HP_12C" }
              as: Proctor
              captures: { err2: $.data.error_id }
            - call: "POST /charter/appointments/${appt_a}/check-in"
              payload: { identity_document_number: "GOV-A-1001", actual_calculator_model: "TI_BA_II_PLUS" }
              as: Proctor
              captures: { ok_st: $.data.booking_status }
          assert:
            - "first attempt: 422 err1 == ERR_IDENTITY_VERIFICATION_FAILED (identity before calculator)"
            - "second attempt: 422 err2 == ERR_CALCULATOR_POLICY_VIOLATION (declared TI_BA_II_PLUS, presented HP_12C)"
            - "third attempt succeeds: ok_st == CHECKED_IN — failed check-ins leave the appointment SCHEDULED and retryable"

      - name: c_reference_respond_after_expiry
        claim_type: Violation → Error
        grounds:
          - errors.ERR_REFERENCE_NOT_PENDING
          - state_machines.ReferenceContact.PENDING_to_EXPIRED
        distinguishing_aspect: "References expire lazily at created_at + 30 days: a respond at 2027-02-05 against a reference created 2027-01-05 flips it to EXPIRED and fails 409 ERR_REFERENCE_NOT_PENDING."
        test_recipe:
          setup:
            - "Clock 2027-01-05. Candidate A with a DRAFT submission and one reference (expires 2027-02-04T00:00:00Z). Clock then 2027-02-05."
          setup_api_calls:
            - *c_clock
            - *c_cand_a
            - call: "POST /charter/candidates/${cand_a}/experience-submissions"
              payload: { segments: [ { employer_name: "Alpha Asset Management", role_title: "Analyst", start_date: "2022-01-10", end_date: "2023-01-10", qualifying_activity_pct: 80, hours: 2000 } ] }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { sub_x: $.data.id }
            - call: "POST /charter/experience-submissions/${sub_x}/references"
              payload: { referee_name: "Ref One", referee_email: "ref1@example.com" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { ref_x: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-05T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /charter/references/${ref_x}/respond"
              payload: { decision: "VERIFIED" }
              as: ReferenceProvider
              as_user_id: "${ref_x}"
              captures: { err: $.data.error_id }
            - call: "GET /charter/references"
              payload: { experience_submission_id: "${sub_x}" }
              as: ProgramAdmin
              captures: { ref_x_st: "$.data[0].status" }
          assert:
            - "the response status is 409 and error_id == ERR_REFERENCE_NOT_PENDING"
            - "ref_x_st == EXPIRED (the lazy expiry transition fired on the rejected call)"

