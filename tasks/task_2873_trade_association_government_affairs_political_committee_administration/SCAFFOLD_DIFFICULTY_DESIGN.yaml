  - rule_id: boundary_precision_check
    instances:
      - name: consensus_pct_rounds_up_onto_the_threshold_exactly
        grounds:
          - calculations.position_ballot_tally.precision
          - calculations.position_ballot_tally.formula
          - entities.PolicyCommittee.fields.consensus_threshold_pct
        distinguishing_aspect: |
          The consensus base is 4 of 6, i.e. 66.6666...%, which round_half_up turns into exactly 66.67 - the
          threshold value itself. Two committees with identical rosters and identical ballots but thresholds 66.67
          and 66.68 must diverge (CONSENSUS_REACHED vs RECONSIDERATION), which pins the rounding direction, the
          2-decimal width and the inclusive >= comparison all at once. Truncation would fail both committees.
        test_recipe:
          setup:
            - "Three members of weight 3, 2 and 1 seated on committee A (quorum 60.00, consensus 66.67) and, in the same order, on committee B (quorum 60.00, consensus 66.68)."
            - "One position per committee, each opened for ballot with the identical 4-support / 2-oppose split (PREMIER 3 + ASSOCIATE 1 support, FULL 2 oppose)."
