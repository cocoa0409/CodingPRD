  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: controlled_drug_conservation_dispense_waste
        grounds:
          - calculations.reconcile_controlled_balance
          - entities.RollingClinic.fields.controlled_stock_ml
          - entities.ControlledMedLog.fields.amount_ml
        distinguishing_aspect: |
          Conserved quantity = controlled drug mL: starting_stock ==
          controlled_stock_ml + sum(DISPENSE.amount_ml + WASTE.amount_ml). A 6.0
          DISPENSE and a 2.0 WASTE on a 50.0 start leave 50.0 == 42.0 + 6.0 + 2.0;
          reconcile confirms controlled_reconciled_ml == controlled_stock_ml.
        test_recipe:
          setup:
            - "Reuse the euthanasia DISPENSE+WASTE flow on a 50.0 vehicle, route reconciled"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-17T08:00:00Z" }
              as: Dispatcher
            - call: "POST /service-areas"
              payload: { zip_code: "11201", name: "BK North", travel_surcharge_cents: 0, euthanasia_allowed: true }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr Vet E", clinician_role: "VET", dea_number: "EV3334445", dea_expires_on: "2027-01-01T00:00:00Z" }
              as: Dispatcher
              captures: { vetA: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr Vet F", clinician_role: "VET", dea_number: "FV4445556", dea_expires_on: "2027-01-01T00:00:00Z" }
              as: Dispatcher
              captures: { vetB: $.data.id }
            - call: "POST /rolling-clinics"
              payload: { plate: "VAN-16", controlled_stock_ml: 50, vaccine_stock_count: 0 }
              as: Dispatcher
              captures: { van_id: $.data.id }
            - call: "POST /patients"
              payload: { owner_name: "Owner N", species: "DOG", weight_kg: 30, home_zip: "11201" }
              as: Dispatcher
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", visit_type: "EUTHANASIA", requested_start: "2026-02-17T09:00:00Z", requested_end: "2026-02-17T10:00:00Z" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /route-days"
              payload: { clinician_id: "${vetA}", rolling_clinic_id: "${van_id}", service_date: "2026-02-17T00:00:00Z" }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /route-days/${rd_id}/stops"
              payload: { appointment_id: "${appt_id}", window_start: "2026-02-17T09:00:00Z", window_end: "2026-02-17T10:00:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
            - call: "POST /route-days/${rd_id}/lock"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/arrive"
              payload: {}
              as: Clinician
              as_user_id: "${vetA}"
            - call: "POST /appointments/${appt_id}/euthanasia-log"
              payload: { rolling_clinic_id: "${van_id}", administering_vet_id: "${vetA}", entry_type: "DISPENSE", amount_ml: 6.0 }
              as: Clinician
              as_user_id: "${vetA}"
            - call: "POST /appointments/${appt_id}/euthanasia-log"
              payload: { rolling_clinic_id: "${van_id}", administering_vet_id: "${vetA}", entry_type: "WASTE", amount_ml: 2.0, witness_vet_id: "${vetB}" }
              as: Clinician
              as_user_id: "${vetA}"
            - call: "POST /estimates"
              payload: { appointment_id: "${appt_id}", line_items: [ { code: "EUTH_FEE", label: "Euth", unit_cents: 30000, qty: 1 } ] }
              as: Clinician
              as_user_id: "${vetA}"
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/approve"
              payload: {}
              as: Clinician
              as_user_id: "${vetA}"
            - call: "POST /appointments/${appt_id}/complete-visit"
              payload: {}
              as: Clinician
              as_user_id: "${vetA}"
            - call: "POST /payments"
              payload: { estimate_id: "${est_id}", amount_cents: 30000, method: "CARD" }
              as: Clinician
              as_user_id: "${vetA}"
          trigger:
            - call: "POST /route-days/${rd_id}/reconcile"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /rolling-clinics/${van_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { run: $.data.controlled_stock_ml, recon: $.data.controlled_reconciled_ml }
          assert:
            - "RollingClinic.${van_id}.controlled_stock_ml == 42.0"
            - "RollingClinic.${van_id}.controlled_reconciled_ml == 42.0"

      - name: route_slot_conservation_book_then_cancel
        grounds:
          - calculations.route_stop_count
          - state_machines.Appointment.REQUESTED_to_SCHEDULED
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = RouteDay.stop_count (route slot count, a different
          conserved quantity than drug mL): booking a stop (+1) then cancelling it
          (the stop -> SKIPPED, excluded from the count) restores stop_count to its
          pre-booking value of 0 — no slot drift.
        test_recipe:
          setup:
            - "An OPEN route with stop_count==0; one appointment booked then cancelled"
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { zip_code: "11201", name: "BK North", travel_surcharge_cents: 0, euthanasia_allowed: true }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /clinicians"
