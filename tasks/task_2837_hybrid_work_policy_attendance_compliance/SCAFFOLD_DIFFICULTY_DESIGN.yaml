      - name: seat_release_restores_peak_utilization_and_chargeback
        grounds:
          - state_machines.SeatAllocation.COMMITTED_to_RELEASED
          - calculations.space_chargeback_cents
          - calculations.neighborhood_peak_load
          - state_machines.DeskAssignment.ASSIGNED_to_VACATED[system]
        conserved_quantity: "RecalibrationReview.total_space_chargeback_cents == sum(line_chargeback_cents of COMMITTED allocations on the cycle's neighborhoods), and Neighborhood.peak_committed_seats == max over cycle weeks of the COMMITTED load"
        distinguishing_aspect: |
          Releasing a committed allocation must withdraw exactly its own
          contribution and nothing else: the line charge returns to 0, the
          neighborhood's peak falls back to the surviving allocation's load, the
          current-week figure drops to 0 while the surviving allocation's weeks are
          untouched, and its desk assignments are vacated as a side effect. The
          chargeback total is re-derived by a second review submit, which also pins
          the round-per-line order - 36831 + 44197 == 81028, not the 81027 that
          summing 36830.5 + 44196.6 and rounding once would give.
        test_recipe:
          setup:
            - "The logical clock is moved to 2026-09-14T09:00:00Z, which is inside 2026-W38, so committed_seats reports a week that allocation A covers and allocation B does not."
            - "One OPEN cycle 2026-09-01..2026-12-31 and team T3-BIG (headcount 250, 1 expected day, bps 8500, entitled_seats 53), Neighborhood N-E1 (30 seats, 4 buffer, desks 1..30), one ACTIVE employee E-5001."
            - "Two COMMITTED SeatAllocations: A 5 seats over [2026-W37, 2026-W39) and B 3 seats over [2026-W39, 2026-W43); one ASSIGNED DeskAssignment on A for desk 3 over 2026-09-07..2026-09-11."
            - "The cycle is moved to RECALIBRATING and review R-BEFORE is submitted so its total_space_chargeback_cents captures both lines."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CI2", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 1, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T3-BIG", expected_days_in_office_per_week: 1, core_collaboration_days: ["WED"], headcount_planned: 250, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t3_id: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t3_id}", employee_number: "E-5001", work_email: "e5001@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_A", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e1_id: $.data.id }
            - call: "POST /neighborhoods"
              payload: { policy_cycle_id: "${cyc_id}", anchor_team_id: "${t3_id}", neighborhood_code: "N-E1", site_code: "NYC-01", seat_count: 30, buffer_seats: 4, desk_index_from: 1, desk_index_to: 30 }
              as: WorkplaceProgramOffice
              captures: { n1_id: $.data.id, nv1: $.data.version }
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1_id}", team_id: "${t3_id}", allocated_seats: 5, window_start_week: "2026-W37", window_end_week: "2026-W39", expected_neighborhood_version: "${nv1}" }
              as: WorkplaceProgramOffice
              captures: { alloc_a: $.data.id }
            - call: "GET /neighborhoods/${n1_id}"
              payload: {}
              as: WorkplaceProgramOffice
              captures: { nv2: $.data.version }
            - call: "POST /seat-allocations"
              payload: { neighborhood_id: "${n1_id}", team_id: "${t3_id}", allocated_seats: 3, window_start_week: "2026-W39", window_end_week: "2026-W43", expected_neighborhood_version: "${nv2}" }
              as: WorkplaceProgramOffice
              captures: { alloc_b: $.data.id }
            - call: "POST /seat-allocations/${alloc_a}/commit"
              payload: {}
              as: WorkplaceProgramOffice
            - call: "POST /seat-allocations/${alloc_b}/commit"
              payload: {}
              as: WorkplaceProgramOffice
            - call: "POST /desk-assignments"
              payload: { seat_allocation_id: "${alloc_a}", employee_id: "${e1_id}", desk_index: 3, start_date: "2026-09-07", end_date: "2026-09-11" }
              as: WorkplaceProgramOffice
              captures: { da_id: $.data.id }
            - call: "POST /policy-cycles/${cyc_id}/posture"
              payload: { target_posture: "RECALIBRATING", note: "measurement window for FY27-H1" }
              as: WorkplaceProgramOffice
            - call: "POST /recalibration-reviews"
              payload: { policy_cycle_id: "${cyc_id}", review_label: "R-BEFORE", proposed_days_in_office_delta: 0 }
              as: WorkplaceProgramOffice
              captures: { rev_before: $.data.id }
            - call: "POST /recalibration-reviews/${rev_before}/submit"
              payload: {}
              as: WorkplaceProgramOffice
          trigger:
            - call: "POST /seat-allocations/${alloc_a}/release"
              payload: { release_reason: "team consolidated into a different zone" }
              as: WorkplaceProgramOffice
            - call: "POST /recalibration-reviews"
              payload: { policy_cycle_id: "${cyc_id}", review_label: "R-AFTER", proposed_days_in_office_delta: 0 }
              as: WorkplaceProgramOffice
              captures: { rev_after: $.data.id }
            - call: "POST /recalibration-reviews/${rev_after}/submit"
              payload: {}
              as: WorkplaceProgramOffice
            - call: "POST /seat-allocations/${alloc_a}/release"
              payload: { release_reason: "duplicate release attempt" }
              as: WorkplaceProgramOffice
          assert:
            - "Before the trigger: SeatAllocation.${alloc_a}.line_chargeback_cents == 36831 (round_half_up(4333 * 5 * 2 * 8500 / 10000) from a raw 36830.5) and SeatAllocation.${alloc_b}.line_chargeback_cents == 44197 (raw 44196.6)"
            - "Before the trigger: RecalibrationReview.${rev_before}.total_space_chargeback_cents == 81028, i.e. the sum of the ALREADY-ROUNDED lines, not 81027"
            - "Before the trigger: Neighborhood.${n1_id}.peak_committed_seats == 5 (2026-W37 and 2026-W38 carry A's 5 seats, W39..W42 carry B's 3), utilization_pct == 19.23 and committed_seats == 5 because the clock sits in 2026-W38"
            - "After the release: SeatAllocation.${alloc_a}.status == RELEASED, release_reason recorded and line_chargeback_cents == 0"
            - "After the release: DeskAssignment.${da_id}.status == VACATED with vacated_at == 2026-09-14T09:00:00Z"
            - "After the release: Neighborhood.${n1_id}.peak_committed_seats == 3, utilization_pct == 11.54 (round_half_up(100 * 3 / 26, 2)) and committed_seats == 0, because 2026-W38 is outside B's window"
            - "SeatAllocation.${alloc_b} is untouched: status COMMITTED, allocated_seats 3, weeks_in_window 4 and line_chargeback_cents 44197"
            - "RecalibrationReview.${rev_after}.total_space_chargeback_cents == 44197 - exactly B's surviving line, so the released line was withdrawn once and only once"
            - "RecalibrationReview.${rev_after}.collaboration_index == 0.00 (no FINALIZED or LOCKED week exists), qualifying_band_count == 0, equity_variance_pct == 0.00 and equity_flag == false"
            - "The second release returns HTTP 409 with error id ERR_ALLOCATION_TERMINAL and leaves peak_committed_seats at 3"

      - name: manual_escalate_then_deescalate_conserves_formal_action_total
        grounds:
          - state_machines.EscalationCase.COACHING_to_WRITTEN_WARNING
          - state_machines.EscalationCase.WRITTEN_WARNING_to_COACHING
          - entities.EscalationCase.fields.discretionary_hold
          - entities.Team.fields.formal_action_count
          - entities.PolicyCycle.fields.formal_action_total
        conserved_quantity: "PolicyCycle.formal_action_total == sum(Team.formal_action_count), and Team.formal_action_count == count of the team's cases whose stage is in the formal-action band"
        distinguishing_aspect: |
          The ladder is walked manually UP and back DOWN and both counters return to
          their starting values, but the manual path also latches
          discretionary_hold, which makes the very next automatic cascade skip the
          stage recomputation entirely: the week is amended down to zero shortfall
          and the employee becomes COMPLIANT at pressure 0.00 while the case stays
          at WRITTEN_WARNING and formal_action_total stays 1. Pressure and stage are
          deliberately allowed to diverge, and the counter invariant still holds.
        test_recipe:
          setup:
            - "One OPEN cycle, team T2-HYB (3 expected days), ACTIVE employee E-6001 with an APPROVED HYBRID classification, manager_user_id 'mgr-1'."
            - "AttendanceWeek 2026-W37 FINALIZED with one BADGE 480 signal on 2026-09-08, so credited_days 1, shortfall_days 2, pressure 3.00 and one EscalationCase at COACHING with discretionary_hold false; Team.escalated_headcount 1, Team.formal_action_count 0, PolicyCycle.formal_action_total 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CI3", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T2-HYB", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t2_id: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t2_id}", employee_number: "E-6001", work_email: "e6001@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_A", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e1_id: $.data.id, e1_v: $.data.version }
            - call: "POST /eligibility-classifications"
              payload: { employee_id: "${e1_id}", requested_class: "HYBRID", justification_code: "ROLE_DESIGN", effective_from: "2026-09-01", expected_employee_version: "${e1_v}" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { cls_id: $.data.id }
            - call: "POST /eligibility-classifications/${cls_id}/submit"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /eligibility-classifications/${cls_id}/decision"
              payload: { decision: "APPROVE" }
              as: PeopleManager
              as_user_id: "mgr-1"
            - call: "POST /attendance-weeks"
              payload: { employee_id: "${e1_id}", iso_week: "2026-W37", week_start_date: "2026-09-07" }
              as: SystemIntegration
              captures: { w1_id: $.data.id }
            - call: "POST /attendance-weeks/${w1_id}/signals"
              payload: { signal_source: "BADGE", site_code: "NYC-01", observed_date: "2026-09-08", minutes_present: 480, dedupe_key: "B-0908" }
              as: SystemIntegration
            - call: "POST /attendance-weeks/${w1_id}/finalize"
              payload: {}
              as: SystemIntegration
            - call: "GET /escalation-cases?employee_id=${e1_id}"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { case_id: "$.data[0].id" }
          trigger:
            - call: "POST /escalation-cases/${case_id}/escalate"
              payload: { action_note: "second missed week discussed in the 1:1" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /escalation-cases/${case_id}/de-escalate"
              payload: { action_note: "attendance plan agreed, stepping the case back down" }
              as: PeopleManager
              as_user_id: "mgr-1"
            - call: "POST /escalation-cases/${case_id}/de-escalate"
              payload: { action_note: "attempt to step below the bottom rung" }
              as: PeopleManager
              as_user_id: "mgr-1"
            - call: "POST /escalation-cases/${case_id}/escalate"
              payload: { action_note: "plan not honoured, escalating again" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /attendance-weeks/${w1_id}/amend"
              payload: { amendment_reason: "badge export for the whole week arrived late" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
          assert:
            - "Before the trigger: EscalationCase.${case_id}.stage == COACHING, discretionary_hold == false, opened_pressure == 3.00; Team.${t2_id}.formal_action_count == 0 and PolicyCycle.${cyc_id}.formal_action_total == 0"
            - "After call 1: stage == WRITTEN_WARNING, discretionary_hold == true, last_action_by_user_id == 'hrbp-1'; Employee.${e1_id}.escalation_stage == WRITTEN_WARNING; Team.${t2_id}.formal_action_count == 1; PolicyCycle.${cyc_id}.formal_action_total == 1"
            - "After call 2: stage == COACHING, discretionary_hold == false, last_action_by_user_id == 'mgr-1'; both counters are back to 0 with no drift"
            - "Call 3 returns HTTP 409 with error id ERR_ESCALATION_AT_FLOOR and leaves stage == COACHING and both counters at 0"
            - "After call 4: stage == WRITTEN_WARNING again, discretionary_hold == true and both counters are 1 - the second lap reproduces the first exactly"
            - "After call 5: AttendanceWeek.${w1_id}.status == AMENDED with credited_days 0, shortfall_days 0; Employee.${e1_id}.cumulative_shortfall_days == 0, non_compliance_pressure == 0.00 and compliance_state == COMPLIANT"
            - "After call 5 the case is STILL WRITTEN_WARNING and Employee.${e1_id}.escalation_stage == WRITTEN_WARNING, because discretionary_hold == true makes the amend cascade skip pressure_derived_stage entirely"
            - "After call 5 Team.${t2_id}.formal_action_count == 1 and PolicyCycle.${cyc_id}.formal_action_total == 1, so the conserved identity holds even while pressure and stage disagree"
            - "Team.${t2_id}.escalated_headcount == 1 throughout: no transition in this instance reaches CURED or CLOSED_SEPARATION"
