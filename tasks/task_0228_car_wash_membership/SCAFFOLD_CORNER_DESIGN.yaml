              payload: { license_plate: "DUP001", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { veh1: "$.data.id" }
          trigger:
            - call: "POST /accounts/${acct}/vehicles"
              payload: { license_plate: "DUP001", state_code: "CA" }
              as: AccountHolder
              as_user_id: "${acct}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409; error_id == ERR_PLATE_TAKEN"

