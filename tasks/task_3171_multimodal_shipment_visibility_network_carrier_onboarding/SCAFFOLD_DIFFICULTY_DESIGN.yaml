              as: PlatformAdmin
              captures: { tc_shp_id: $.data.id }
            - call: "POST /shippers/${tc_shp_id}/shipments"
              payload: { carrier_id: "${tc_car_id}", connection_id: "${tc_conn_id}", mode: "TRUCKLOAD", tracking_reference: "TRK-S", mode_reference: "PRO-S", destination_code: "MEM", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${tc_shp_id}"
              captures: { tc_ship_id: $.data.id }
            - call: "POST /shipments/${tc_ship_id}/events"
              payload: { event_time: "2026-09-01T12:00:00Z", event_type: "DEPARTED" }
              as: CarrierRep
              as_user_id: "${tc_car_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T18:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipments/${tc_ship_id}/events"
              payload: { event_time: "2026-09-01T18:00:00Z", event_type: "DELAY_REPORTED", delay_minutes: 180 }
              as: CarrierRep
              as_user_id: "${tc_car_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T04:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_ops/run-checkpoint"
              payload: {}
              as: PlatformAdmin
              captures: { tc_alerts_created: $.data.alerts_created, tc_conn_degraded: $.data.connections_degraded }
            - call: "GET /connections/${tc_conn_id}"
              payload: {}
              as: NetworkOps
            - call: "GET /shipments/${tc_ship_id}"
              payload: {}
