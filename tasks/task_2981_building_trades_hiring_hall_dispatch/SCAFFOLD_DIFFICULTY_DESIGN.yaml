            - call: "PATCH /hiring-hall/contractors/${mid_id}/signatory-status"
              payload: { signatory_status: "SIGNATORY" }
              as: BusinessManager
              as_user_id: "bm-01"
              captures: { mid_status1: $.data.signatory_status }
            - call: "POST /hiring-hall/job-requests"
              payload: { contractor_id: "${mid_id}", job_site: "Mill Street Riser", journeyworkers_requested: 2, apprentices_requested: 0, expected_duration_days: 30, report_at: "2026-09-28T07:00:00.000Z", hourly_rate_cents: 5100 }
              as: ContractorRep
              as_user_id: "${mid_id}"
              captures: { jr_id: $.data.id, jr_status: $.data.status, jr_open: $.data.open_journeyworker_slots }
            - call: "PATCH /hiring-hall/contractors/${mid_id}/signatory-status"
              payload: { signatory_status: "TERMINATED" }
              as: BusinessManager
              as_user_id: "bm-01"
