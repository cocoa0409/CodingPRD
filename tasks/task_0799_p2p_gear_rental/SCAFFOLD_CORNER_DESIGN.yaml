        distinguishing_aspect: "PATCH /listings/{id} with a matching expected_listing_version succeeds and advances Listing.version from 1 to 2."
        test_recipe:
          setup: ["An owner has a DRAFT listing at version 1."]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "owner_ver@x.com", full_name: "Owner", phone: "111" }
              as: Anonymous
              captures: { owner_id: $.data.id }
