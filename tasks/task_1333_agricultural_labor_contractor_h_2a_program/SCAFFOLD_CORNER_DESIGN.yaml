# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task 1333 — Agricultural Labor Contractor & H-2A Program
# Breadth probe: every testable claim of §1.1–§1.7 not already covered by a
# §1.8 difficulty instance. Same replay rules: every setup_api_calls / trigger
# chain drives empty-DB -> precondition using only §1.5 endpoints.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: job_order_creation_derives_terms
        claim_type: creation
        grounds: ["entities.JobOrder", "calculations.job_order_derived_terms", "calculations.workday_calendar_count"]
        distinguishing_aspect: "Create returns 201 with system defaults (status DRAFT, version 1) and all derived terms computed from the LIVE determination: floor 1850, effective piece 450, 50 calendar days, 43 workdays (Sundays excluded), cutoff 2026-09-25."
        test_recipe:
          setup: ["Empty DB; default clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/wage-determinations", payload: { state_code: "CA", crop: "LETTUCE", activity: "HARVEST", effective_year: 2026, aewr_hourly_cents: 1850, prevailing_hourly_cents: 1775, prevailing_piece_rate_cents_per_unit: 450, piece_unit_name: "BOX" }, as: ProgramReviewer, captures: { wd1: $.data.id } }
          trigger:
            - { call: "POST /h2a/job-orders", payload: { grower_id: "${g1}", wage_determination_id: "${wd1}", title: "Fall lettuce", crop: "LETTUCE", activity: "HARVEST", worksite_state: "CA", work_start_date: "2026-09-01", work_end_date: "2026-10-20", daily_standard_hours: 8, workers_requested: 4, offered_hourly_cents: 1800, offered_piece_rate_cents_per_unit: 400, inbound_transport_cents: 60000, outbound_transport_cents: 75000 }, as: ContractorAdmin, captures: { jo1: $.data.id } }
            - { call: "GET /h2a/job-orders/${jo1}", as: WageAuditor }
          assert:
            - "201; response status == DRAFT (initial state), version == 1, id is a server-minted UUID"
            - "required_hourly_floor_cents == 1850 (max of aewr 1850, prevailing 1775, offered 1800, federal 725)"
            - "effective_piece_rate_cents_per_unit == 450 (max of offered 400, prevailing 450)"
            - "total_calendar_days == 50; total_workdays == 43 (7 Sundays excluded: 09-06, 09-13, 09-20, 09-27, 10-04, 10-11, 10-18)"
            - "recruitment_cutoff_date == 2026-09-25 and transport_threshold_date == 2026-09-25 (start + floor(50/2) - 1 days)"
            - "domestic_hired_count == 0 and visa_worker_ceiling == 4"
            - "GET re-read returns identical values (immediate consistency); locked_* fields are null while DRAFT"

      - name: worker_create_missing_required_passport_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Worker.fields.passport_number", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting a source:input field with no default (passport_number) yields 400 ERR_INVALID_REQUEST and persists nothing."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /h2a/workers", payload: { full_name: "No Passport", date_of_birth: "1990-01-01", country_code: "MX" }, as: ContractorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "400 with error_id == ERR_INVALID_REQUEST"
            - "GET /h2a/workers returns total_count == 0"

      - name: job_order_piece_rate_default_null_hourly_only
        claim_type: defaults
        grounds: ["entities.JobOrder.fields.offered_piece_rate_cents_per_unit", "entities.JobOrder.fields.effective_piece_rate_cents_per_unit"]
        distinguishing_aspect: "Omitting the optional piece rate when the determination also lacks one yields effective_piece_rate == null (hourly-only order), not 0."
        test_recipe:
          setup: ["Grower G1; WD-HOURLY without piece rate (prevailing_piece_rate_cents_per_unit null)"]
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/wage-determinations", payload: { state_code: "CA", crop: "CHILE", activity: "HARVEST", effective_year: 2026, aewr_hourly_cents: 700, prevailing_hourly_cents: 710 }, as: ProgramReviewer, captures: { wd2: $.data.id } }
          trigger:
            - { call: "POST /h2a/job-orders", payload: { grower_id: "${g1}", wage_determination_id: "${wd2}", title: "Chile harvest", crop: "CHILE", activity: "HARVEST", worksite_state: "CA", work_start_date: "2026-09-01", work_end_date: "2026-09-20", daily_standard_hours: 8, workers_requested: 1, offered_hourly_cents: 725, inbound_transport_cents: 0, outbound_transport_cents: 0 }, as: ContractorAdmin, captures: { jo4: $.data.id } }
          assert:
            - "offered_piece_rate_cents_per_unit == null (default applied)"
            - "effective_piece_rate_cents_per_unit == null (both sources null)"
            - "required_hourly_floor_cents == 725 (max of 700, 710, 725 offered, 725 federal minimum)"

      - name: worker_create_client_supplied_id_input_ignored
        claim_type: system_fields
        grounds: ["entities.Worker"]
        distinguishing_aspect: "A client-supplied id in the create body is ignored; the server mints its own UUID."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /h2a/workers", payload: { id: "00000000-0000-0000-0000-000000000000", full_name: "Worker A", passport_number: "P0001", date_of_birth: "1990-01-01", country_code: "MX" }, as: ContractorAdmin, captures: { wa: $.data.id } }
          assert:
            - "201; response id != 00000000-0000-0000-0000-000000000000 (server-minted)"
            - "created_at and version == 1 are system-stamped"

      - name: resource_not_found_errors_return_404
        claim_type: not_found
        grounds: ["errors[ERR_GROWER_NOT_FOUND]", "errors[ERR_WAGE_DETERMINATION_NOT_FOUND]", "errors[ERR_JOB_ORDER_NOT_FOUND]", "errors[ERR_DOMESTIC_APPLICATION_NOT_FOUND]", "errors[ERR_WORKER_NOT_FOUND]", "errors[ERR_VISA_PETITION_NOT_FOUND]", "errors[ERR_CONSULAR_APPOINTMENT_NOT_FOUND]", "errors[ERR_HOUSING_UNIT_NOT_FOUND]", "errors[ERR_HOUSING_ASSIGNMENT_NOT_FOUND]", "errors[ERR_WORKER_ASSIGNMENT_NOT_FOUND]", "errors[ERR_TRANSFER_REQUEST_NOT_FOUND]", "errors[ERR_AUDIT_CASE_NOT_FOUND]"]
        distinguishing_aspect: "Every per-resource 404 in the catalog is triggerable; unknown UUIDs are rejected with the resource-specific error id, validated at existence priority 4."
        test_recipe:
          setup: ["Empty DB (no resources exist)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /h2a/growers/11111111-1111-1111-1111-111111111111/refresh-status", payload: {}, as: WageAuditor, captures: { e_grower: $.data.error_id } }
            - { call: "POST /h2a/job-orders", payload: { grower_id: "11111111-1111-1111-1111-111111111111", wage_determination_id: "22222222-2222-2222-2222-222222222222", title: "X", crop: "LETTUCE", activity: "HARVEST", worksite_state: "CA", work_start_date: "2026-09-01", work_end_date: "2026-10-20", daily_standard_hours: 8, workers_requested: 1, offered_hourly_cents: 1800, inbound_transport_cents: 0, outbound_transport_cents: 0 }, as: ContractorAdmin, captures: { e_grower_body: $.data.error_id } }
            - { call: "GET /h2a/job-orders/11111111-1111-1111-1111-111111111111", as: ContractorAdmin, captures: { e_jo: $.data.error_id } }
            - { call: "POST /h2a/domestic-applications/11111111-1111-1111-1111-111111111111/decide", payload: { decision: "HIRE", qualification: "QUALIFIED" }, as: ContractorAdmin, captures: { e_app: $.data.error_id } }
            - { call: "GET /h2a/workers/11111111-1111-1111-1111-111111111111", as: ContractorAdmin, captures: { e_w: $.data.error_id } }
            - { call: "GET /h2a/visa-petitions/11111111-1111-1111-1111-111111111111", as: ContractorAdmin, captures: { e_pet: $.data.error_id } }
            - { call: "GET /h2a/consular-appointments/11111111-1111-1111-1111-111111111111", as: ContractorAdmin, captures: { e_appt: $.data.error_id } }
            - { call: "GET /h2a/housing-units/11111111-1111-1111-1111-111111111111", as: ContractorAdmin, captures: { e_unit: $.data.error_id } }
            - { call: "GET /h2a/housing-assignments/11111111-1111-1111-1111-111111111111", as: ContractorAdmin, captures: { e_ha: $.data.error_id } }
            - { call: "GET /h2a/worker-assignments/11111111-1111-1111-1111-111111111111", as: ContractorAdmin, captures: { e_asg: $.data.error_id } }
            - { call: "GET /h2a/transfer-requests/11111111-1111-1111-1111-111111111111", as: ContractorAdmin, captures: { e_tr: $.data.error_id } }
            - { call: "GET /h2a/audit-cases/11111111-1111-1111-1111-111111111111", as: ContractorAdmin, captures: { e_ac: $.data.error_id } }
          assert:
            - "e_grower == ERR_GROWER_NOT_FOUND (404)"
            - "e_grower_body == ERR_GROWER_NOT_FOUND (body FK validated; grower checked before wage_determination — left-to-right field order pins grower_id first)"
            - "e_jo == ERR_JOB_ORDER_NOT_FOUND; e_app == ERR_DOMESTIC_APPLICATION_NOT_FOUND; e_w == ERR_WORKER_NOT_FOUND; e_pet == ERR_VISA_PETITION_NOT_FOUND"
            - "e_appt == ERR_CONSULAR_APPOINTMENT_NOT_FOUND; e_unit == ERR_HOUSING_UNIT_NOT_FOUND; e_ha == ERR_HOUSING_ASSIGNMENT_NOT_FOUND; e_asg == ERR_WORKER_ASSIGNMENT_NOT_FOUND; e_tr == ERR_TRANSFER_REQUEST_NOT_FOUND; e_ac == ERR_AUDIT_CASE_NOT_FOUND (all 404)"
          # ERR_WAGE_DETERMINATION_NOT_FOUND fires when grower exists but determination id does not:
          # covered implicitly by field-order note; deterministic trigger is POST /h2a/job-orders with a real grower and bogus wage_determination_id.

      - name: work_log_immutable_unique_per_assignment_day
        claim_type: immutability
        grounds: ["entities.WorkLog", "errors[ERR_DUPLICATE_WORK_LOG]"]
        distinguishing_aspect: "WorkLog is an immutable event entity (common_fields false: no version/updated_at); a second row for the same (assignment, work_date) is rejected ERR_DUPLICATE_WORK_LOG 409 — no update endpoint exists."
        test_recipe:
          setup:
            - "J1 ACTIVE with W_A WORKING (started 2026-09-01); clock 2026-09-02"
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/wage-determinations", payload: { state_code: "CA", crop: "LETTUCE", activity: "HARVEST", effective_year: 2026, aewr_hourly_cents: 1850, prevailing_hourly_cents: 1775, prevailing_piece_rate_cents_per_unit: 450, piece_unit_name: "BOX" }, as: ProgramReviewer, captures: { wd1: $.data.id } }
            - { call: "POST /h2a/job-orders", payload: { grower_id: "${g1}", wage_determination_id: "${wd1}", title: "Fall lettuce", crop: "LETTUCE", activity: "HARVEST", worksite_state: "CA", work_start_date: "2026-09-01", work_end_date: "2026-10-20", daily_standard_hours: 8, workers_requested: 4, offered_hourly_cents: 1800, offered_piece_rate_cents_per_unit: 400, inbound_transport_cents: 60000, outbound_transport_cents: 75000 }, as: ContractorAdmin, captures: { jo1: $.data.id } }
            - { call: "POST /h2a/job-orders/${jo1}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/certify", payload: {}, as: ProgramReviewer }
            - { call: "POST /h2a/job-orders/${jo1}/begin-recruitment", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/close-recruitment", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/visa-petitions", payload: { receipt_code: "RCPT-1", requested_worker_count: 1 }, as: ContractorAdmin, captures: { pet1: $.data.id } }
            - { call: "POST /h2a/workers", payload: { full_name: "Worker A", passport_number: "P0001", date_of_birth: "1990-01-01", country_code: "MX" }, as: ContractorAdmin, captures: { wa: $.data.id } }
            - { call: "POST /h2a/visa-petitions/${pet1}/link-worker", payload: { worker_id: "${wa}" }, as: ContractorAdmin }
            - { call: "POST /h2a/visa-petitions/${pet1}/file", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/visa-petitions/${pet1}/adjudicate", payload: { decision: "APPROVE", approved_worker_count: 1 }, as: ProgramReviewer }
            - { call: "POST /h2a/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /h2a/consular-appointments", payload: { worker_id: "${wa}", petition_id: "${pet1}", consulate_code: "MEX-MTY", appointment_date: "2026-09-01" }, as: ContractorAdmin, captures: { appt_a: $.data.id } }
            - { call: "POST /h2a/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/activate", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/consular-appointments/${appt_a}/complete", payload: { outcome: "ISSUED" }, as: VisaOfficer }
            - { call: "POST /h2a/worker-assignments", payload: { worker_id: "${wa}", job_order_id: "${jo1}" }, as: ContractorAdmin, captures: { asg_a: $.data.id } }
            - { call: "POST /h2a/worker-assignments/${asg_a}/start", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-01", hours_worked: 8, units_picked: 25 }, as: ContractorAdmin }
          trigger:
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-01", hours_worked: 4, units_picked: 10 }, as: ContractorAdmin, captures: { dup_err: $.data.error_id } }
          assert:
            - "409 with error_id == ERR_DUPLICATE_WORK_LOG"
            - "GET /h2a/worker-assignments/${asg_a}/work-logs returns exactly 1 row with hours_worked == 8 (first write retained; immutable)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: certify_from_draft_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.JobOrder.SUBMITTED_to_CERTIFIED", "errors[ERR_JOB_ORDER_INVALID_STATE]"]
        distinguishing_aspect: "certify is only declared from SUBMITTED; from DRAFT it returns 409 ERR_JOB_ORDER_INVALID_STATE with no state change."
        test_recipe:
          setup: ["J1 in DRAFT"]
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/wage-determinations", payload: { state_code: "CA", crop: "LETTUCE", activity: "HARVEST", effective_year: 2026, aewr_hourly_cents: 1850, prevailing_hourly_cents: 1775, prevailing_piece_rate_cents_per_unit: 450, piece_unit_name: "BOX" }, as: ProgramReviewer, captures: { wd1: $.data.id } }
            - { call: "POST /h2a/job-orders", payload: { grower_id: "${g1}", wage_determination_id: "${wd1}", title: "Fall lettuce", crop: "LETTUCE", activity: "HARVEST", worksite_state: "CA", work_start_date: "2026-09-01", work_end_date: "2026-10-20", daily_standard_hours: 8, workers_requested: 4, offered_hourly_cents: 1800, offered_piece_rate_cents_per_unit: 400, inbound_transport_cents: 60000, outbound_transport_cents: 75000 }, as: ContractorAdmin, captures: { jo1: $.data.id } }
          trigger:
            - { call: "POST /h2a/job-orders/${jo1}/certify", payload: {}, as: ProgramReviewer, captures: { err: $.data.error_id } }
          assert:
            - "409 with error_id == ERR_JOB_ORDER_INVALID_STATE; JobOrder.${jo1}.status remains DRAFT"

      - name: appointment_complete_twice_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ConsularAppointment.SCHEDULED_to_COMPLETED", "errors[ERR_APPOINTMENT_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETED is terminal: a second complete returns 409 ERR_APPOINTMENT_INVALID_STATE and does not re-fire worker side effects."
        test_recipe:
          setup: ["J1 ACTIVE; W_A appointment completed ISSUED at clock 2026-09-01"]
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/wage-determinations", payload: { state_code: "CA", crop: "LETTUCE", activity: "HARVEST", effective_year: 2026, aewr_hourly_cents: 1850, prevailing_hourly_cents: 1775, prevailing_piece_rate_cents_per_unit: 450, piece_unit_name: "BOX" }, as: ProgramReviewer, captures: { wd1: $.data.id } }
            - { call: "POST /h2a/job-orders", payload: { grower_id: "${g1}", wage_determination_id: "${wd1}", title: "Fall lettuce", crop: "LETTUCE", activity: "HARVEST", worksite_state: "CA", work_start_date: "2026-09-01", work_end_date: "2026-10-20", daily_standard_hours: 8, workers_requested: 4, offered_hourly_cents: 1800, offered_piece_rate_cents_per_unit: 400, inbound_transport_cents: 60000, outbound_transport_cents: 75000 }, as: ContractorAdmin, captures: { jo1: $.data.id } }
            - { call: "POST /h2a/job-orders/${jo1}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/certify", payload: {}, as: ProgramReviewer }
            - { call: "POST /h2a/job-orders/${jo1}/begin-recruitment", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/close-recruitment", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/visa-petitions", payload: { receipt_code: "RCPT-1", requested_worker_count: 1 }, as: ContractorAdmin, captures: { pet1: $.data.id } }
            - { call: "POST /h2a/workers", payload: { full_name: "Worker A", passport_number: "P0001", date_of_birth: "1990-01-01", country_code: "MX" }, as: ContractorAdmin, captures: { wa: $.data.id } }
            - { call: "POST /h2a/visa-petitions/${pet1}/link-worker", payload: { worker_id: "${wa}" }, as: ContractorAdmin }
            - { call: "POST /h2a/visa-petitions/${pet1}/file", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/visa-petitions/${pet1}/adjudicate", payload: { decision: "APPROVE", approved_worker_count: 1 }, as: ProgramReviewer }
            - { call: "POST /h2a/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /h2a/consular-appointments", payload: { worker_id: "${wa}", petition_id: "${pet1}", consulate_code: "MEX-MTY", appointment_date: "2026-09-01" }, as: ContractorAdmin, captures: { appt_a: $.data.id } }
            - { call: "POST /h2a/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/activate", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/consular-appointments/${appt_a}/complete", payload: { outcome: "ISSUED" }, as: VisaOfficer }
          trigger:
            - { call: "POST /h2a/consular-appointments/${appt_a}/complete", payload: { outcome: "REFUSED" }, as: VisaOfficer, captures: { err: $.data.error_id } }
          assert:
            - "409 with error_id == ERR_APPOINTMENT_INVALID_STATE; appointment outcome remains ISSUED"
            - "Worker.${wa}.status remains VISA_ISSUED (side effects do not re-fire)"

      - name: link_worker_side_effects_visible
        claim_type: side_effect_execution
        grounds: ["state_machines.Worker.REGISTERED_to_PETITIONED"]
        distinguishing_aspect: "link-worker mutates the WORKER (status PETITIONED, petition_id set) as a cross-entity side effect, immediately visible via GET /h2a/workers/{id}."
        test_recipe:
          setup: ["J1 CERTIFIED (petition create allowed); petition RCPT-1 DRAFT; worker W_A REGISTERED"]
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/wage-determinations", payload: { state_code: "CA", crop: "LETTUCE", activity: "HARVEST", effective_year: 2026, aewr_hourly_cents: 1850, prevailing_hourly_cents: 1775, prevailing_piece_rate_cents_per_unit: 450, piece_unit_name: "BOX" }, as: ProgramReviewer, captures: { wd1: $.data.id } }
            - { call: "POST /h2a/job-orders", payload: { grower_id: "${g1}", wage_determination_id: "${wd1}", title: "Fall lettuce", crop: "LETTUCE", activity: "HARVEST", worksite_state: "CA", work_start_date: "2026-09-01", work_end_date: "2026-10-20", daily_standard_hours: 8, workers_requested: 4, offered_hourly_cents: 1800, offered_piece_rate_cents_per_unit: 400, inbound_transport_cents: 60000, outbound_transport_cents: 75000 }, as: ContractorAdmin, captures: { jo1: $.data.id } }
            - { call: "POST /h2a/job-orders/${jo1}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/certify", payload: {}, as: ProgramReviewer }
            - { call: "POST /h2a/job-orders/${jo1}/visa-petitions", payload: { receipt_code: "RCPT-1", requested_worker_count: 1 }, as: ContractorAdmin, captures: { pet1: $.data.id } }
            - { call: "POST /h2a/workers", payload: { full_name: "Worker A", passport_number: "P0001", date_of_birth: "1990-01-01", country_code: "MX" }, as: ContractorAdmin, captures: { wa: $.data.id } }
          trigger:
            - { call: "POST /h2a/visa-petitions/${pet1}/link-worker", payload: { worker_id: "${wa}" }, as: ContractorAdmin }
            - { call: "GET /h2a/workers/${wa}", as: ContractorAdmin, captures: { w_status: $.data.status, w_pet: $.data.petition_id } }
          assert:
            - "Worker.${wa}.status == PETITIONED and petition_id == ${pet1}"

      - name: activate_without_approved_petition_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.JobOrder.PETITIONING_to_ACTIVE", "errors[ERR_NO_APPROVED_PETITION]"]
        distinguishing_aspect: "Guarded transition: activate while the only petition is FILED (not APPROVED) fails ERR_NO_APPROVED_PETITION even though the state and clock preconditions pass."
        test_recipe:
          setup: ["J1 PETITIONING; petition RCPT-1 FILED (not adjudicated); clock 2026-09-01 (>= start)"]
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/wage-determinations", payload: { state_code: "CA", crop: "LETTUCE", activity: "HARVEST", effective_year: 2026, aewr_hourly_cents: 1850, prevailing_hourly_cents: 1775, prevailing_piece_rate_cents_per_unit: 450, piece_unit_name: "BOX" }, as: ProgramReviewer, captures: { wd1: $.data.id } }
