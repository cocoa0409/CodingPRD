        distinguishing_aspect: "At six qualifying outages the tier becomes TIER_CRITICAL and raw_months falls to 4*12*0.75*0.60 = 21.6 which rounds to 22; the DISTRIBUTION_12KV floor of 24 then clamps cycle_months to 24, proving the clamp is applied after rounding."
        test_recipe:
          setup:
            - "Circuit CKT-A with five tree-caused outages already inside the rolling 36-month window, so the tier is TIER_ELEVATED and cycle_months is 29."
          setup_api_calls:
            - call: "POST /vm/prescriptions"
              payload: { voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", base_cycle_years: 4, clearance_radius_ft: 10, effective_from: "2026-01-01" }
              as: UtilityForester
              captures: { presc_id: $.data.id }
            - call: "POST /vm/prescriptions/${presc_id}/activate"
              payload: {}
              as: UtilityForester
            - call: "POST /vm/circuits"
              payload: { circuit_code: "CKT-A", voltage_class: "DISTRIBUTION_12KV", growth_zone: "RAPID", customer_count: 1200, last_trim_completed_on: "2024-03-15" }
              as: UtilityForester
              captures: { ckt_id: $.data.id }
            - call: "POST /vm/outage-records"
              payload: { circuit_id: "${ckt_id}", outage_at: "2024-09-10T00:00:00Z", cause_code: "TREE_GROWN_IN", customers_affected: 300, customer_minutes: 1500 }
              as: UtilityForester
            - call: "POST /vm/outage-records"
              payload: { circuit_id: "${ckt_id}", outage_at: "2025-05-20T00:00:00Z", cause_code: "TREE_GROWN_IN", customers_affected: 300, customer_minutes: 1500 }
              as: UtilityForester
            - call: "POST /vm/outage-records"
              payload: { circuit_id: "${ckt_id}", outage_at: "2026-02-11T00:00:00Z", cause_code: "TREE_GROWN_IN", customers_affected: 300, customer_minutes: 1500 }
              as: UtilityForester
            - call: "POST /vm/outage-records"
              payload: { circuit_id: "${ckt_id}", outage_at: "2026-03-11T00:00:00Z", cause_code: "TREE_GROWN_IN", customers_affected: 300, customer_minutes: 1500 }
              as: UtilityForester
