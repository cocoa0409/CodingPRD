            - "FollowUpEpisode.${ep1_id}.status == RESOLVED_PASS, closure_reason == RESCREEN_PASSED, timeliness_status == ON_TIME (effective age 4 <= 30), closed_at == 2026-08-05T10:00:00Z; Infant.${l1_id}.screening_status == PASSED"
            - "ClinicSlot.${slot_id}.booked_count == 2, remaining_capacity == 0, status == FULL — an ATTENDED appointment still occupies capacity"

      - name: timeliness_read_returns_corrected_age_for_a_nicu_infant
        claim_type: computed_read
        grounds:
          - endpoints.GET_infants_id_timeliness
          - calculations.infant_age_basis
          - calculations.surveillance_due_date
        distinguishing_aspect: "The computed read derives everything on the fly: a 36-week infant with a 5-day NICU stay qualifies for the CORRECTED basis through the NICU clause rather than the gestational-age clause, so at 100 chronological days it reports a 28-day prematurity offset and a 72-day effective age, and the auto-registered NICU risk entry sits on the 270-day surveillance track."
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) with screener S1; infant born 2026-08-01T00:00:00Z at 36 weeks with nicu_stay_days 5 (auto NICU_5_PLUS_DAYS risk entry), discharged unscreened on 2026-08-02 so an INITIAL_SCREEN episode is open; clock advanced to 2026-11-09T00:00:00Z (day 100) and a FAMILY_HISTORY entry is added at that instant so the stored score is recomputed at the current clock."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-01T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 36, nicu_stay_days: 5, guardian_name: "G-CR", guardian_contact_phone: "5555401" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { icr_id: "$.data.id" }
            - call: "POST /infants/${icr_id}/discharge"
              payload: { discharge_datetime: "2026-08-02T00:00:00Z" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-09T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /risk-factor-entries"
              payload: { infant_id: "${icr_id}", risk_factor_code: "FAMILY_HISTORY", identified_at: "2026-11-09T00:00:00Z" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { rf_fam_id: "$.data.id" }
          trigger:
            - call: "GET /infants/${icr_id}/timeliness"
              payload: {}
              as: ProgramAuditor
          assert:
            - "HTTP 200 with chronological_age_days == 100, prematurity_offset_days == 28, corrected_age_days == 72, effective_age_days == 72, benchmark_age_basis == CORRECTED (nicu_stay_days 5 >= 5 even though 36 >= 35 weeks)"
            - "screening_timeliness_status == OVERDUE (the INITIAL_SCREEN episode is incomplete and 72 > 30); diagnostic_timeliness_status == PENDING and ei_timeliness_status == PENDING (no such milestone exists)"
            - "ltf_risk_score == 28 (risk entries 2 * 4 = 8, age_pressure 20 because 72 > 30, INPATIENT setting 0) and priority_band == ELEVATED"
            - "GET /infants/${icr_id}/risk-factor-entries returns total_count == 2; the REGISTRY_AUTO NICU_5_PLUS_DAYS entry has surveillance_due_date 2027-04-28T00:00:00Z (270-day track) and RiskFactorEntry.${rf_fam_id} likewise"

      - name: auto_assign_is_allowed_only_when_the_navigator_pool_is_non_empty
        claim_type: conditional_action
        grounds:
          - endpoints.POST_navigation_tasks
          - validations.priority_41_selector_pool
          - errors.ERR_NO_ELIGIBLE_NAVIGATOR
        distinguishing_aspect: "auto_assign is a conditional action: with no navigator in the birth facility's region the operator call is refused 409 ERR_NO_ELIGIBLE_NAVIGATOR and nothing is created or debited, and the identical call succeeds the moment one eligible navigator exists."
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) with screener S1 and NO navigator anywhere; one INPATIENT infant; clock 2026-08-01T06:00:00Z. The eligible navigator is registered between the two attempts."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-01T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-CA", guardian_contact_phone: "5555501" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { ica_id: "$.data.id" }
          trigger:
            - call: "POST /navigation-tasks"
              payload: { infant_id: "${ica_id}", task_type: "OUTREACH_CALL", auto_assign: true }
              as: ProgramAdmin
              captures: { err_pool: "$.data.error_id" }
            - call: "POST /facilities"
              payload: { name: "AC1", facility_type: "AUDIOLOGY_CLINIC", region_code: "R1" }
              as: ProgramAdmin
              captures: { ac_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "NAVIGATOR", full_name: "N1", region_code: "R1" }
              as: ProgramAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /navigation-tasks"
              payload: { infant_id: "${ica_id}", task_type: "OUTREACH_CALL", auto_assign: true }
              as: ProgramAdmin
              captures: { task_id: "$.data.id" }
          assert:
            - "Empty pool: HTTP 409 with data.error_id == ERR_NO_ELIGIBLE_NAVIGATOR; Facility.${bh_id}.navigation_budget_units_remaining == 40 and GET /navigation-tasks?infant_id=${ica_id} returns total_count == 0"
            - "After N1 exists: HTTP 201 with NavigationTask.${task_id}.status == OPEN, assigned_provider_id == ${n1_id}, units_reserved == 2"
            - "Facility.${bh_id}.navigation_budget_units_remaining == 38 and Provider.${n1_id}.open_task_count == 1"

  - section: errors
    instances:
      - name: every_unknown_id_returns_its_own_entity_specific_not_found
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PROVIDER_NOT_FOUND]"
          - "errors[ERR_ENCOUNTER_NOT_FOUND]"
          - "errors[ERR_SLOT_NOT_FOUND]"
          - "errors[ERR_APPOINTMENT_NOT_FOUND]"
          - "errors[ERR_EVALUATION_NOT_FOUND]"
          - "errors[ERR_REFERRAL_NOT_FOUND]"
          - "errors[ERR_TASK_NOT_FOUND]"
          - "errors[ERR_PERIOD_NOT_FOUND]"
          - "errors[ERR_REPORT_NOT_FOUND]"
        distinguishing_aspect: "Nine single-resource reads against the same unknown id return nine different error_ids — the 404 is keyed to the addressed collection, never a generic ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database; no clock change needed. The literal id 00000000-0000-0000-0000-0000000000aa is never minted by any endpoint."
          setup_api_calls: []
          trigger:
            - call: "GET /providers/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: ProgramAdmin
              captures: { e_prov: "$.data.error_id" }
            - call: "GET /screening-encounters/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: ProgramAdmin
              captures: { e_enc: "$.data.error_id" }
            - call: "GET /clinic-slots/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: ProgramAdmin
              captures: { e_slot: "$.data.error_id" }
            - call: "GET /rescreen-appointments/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: ProgramAdmin
              captures: { e_appt: "$.data.error_id" }
            - call: "GET /diagnostic-evaluations/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: ProgramAdmin
              captures: { e_eval: "$.data.error_id" }
            - call: "GET /ei-referrals/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: ProgramAdmin
              captures: { e_ref: "$.data.error_id" }
            - call: "GET /navigation-tasks/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: ProgramAdmin
              captures: { e_task: "$.data.error_id" }
            - call: "GET /reporting-periods/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: ProgramAdmin
              captures: { e_per: "$.data.error_id" }
            - call: "GET /facility-reports/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: ProgramAdmin
              captures: { e_rep: "$.data.error_id" }
          assert:
            - "All nine calls return HTTP 404 with the response_envelope error body: data.error_id and data.message present, meta.api_request_id and meta.api_request_timestamp present"
            - "error_ids in order: ERR_PROVIDER_NOT_FOUND, ERR_ENCOUNTER_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_APPOINTMENT_NOT_FOUND, ERR_EVALUATION_NOT_FOUND, ERR_REFERRAL_NOT_FOUND, ERR_TASK_NOT_FOUND, ERR_PERIOD_NOT_FOUND, ERR_REPORT_NOT_FOUND"

      - name: absent_or_unknown_role_header_returns_unauthenticated_before_shape_checks
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_UNAUTHENTICATED]"
          - validations.priority_1_authentication
        distinguishing_aspect: "Priority 1 fires before the body is even parsed: a request with no X-User-Role and an empty body returns 401 ERR_UNAUTHENTICATED, not the 400 ERR_INVALID_REQUEST that its missing name/facility_type/region_code would otherwise earn, and an out-of-catalogue role string is 401 rather than 403."
        test_recipe:
          setup:
            - "Empty database. The seven declared roles are ProgramAdmin, ProgramAuditor, FacilityAdmin, FacilityScreener, Audiologist, Navigator, EICoordinator; 'RegionalDirector' is not among them."
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: {}
              as: "(no X-User-Role header sent)"
              captures: { e_noauth: "$.data.error_id" }
            - call: "GET /facilities/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: "RegionalDirector"
              captures: { e_badrole: "$.data.error_id" }
          assert:
            - "Headerless POST /facilities: HTTP 401 with data.error_id == ERR_UNAUTHENTICATED (NOT 400 ERR_INVALID_REQUEST despite the empty body)"
            - "Undeclared role string: HTTP 401 with data.error_id == ERR_UNAUTHENTICATED (NOT 403 ERR_FORBIDDEN_ROLE and NOT 404 ERR_FACILITY_NOT_FOUND)"
            - "No Facility row is created (GET /facilities list-free check: the subsequent authenticated read of the same id still returns ERR_FACILITY_NOT_FOUND)"

      - name: facility_admin_cannot_file_a_report_for_another_facility
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_IDENTITY_MISMATCH]"
          - validations.priority_7_identity_binding
          - rbac.FacilityAdmin
        distinguishing_aspect: "FacilityAdmin is entity_backed on Facility, so X-User-ID must equal the body's facility_id: BH2's admin filing BH1's report is 403 ERR_IDENTITY_MISMATCH even though the role is on the endpoint and the OCC version supplied is correct, and the same call from BH1's admin succeeds."
        test_recipe:
          setup:
            - "Two BIRTH_HOSPITAL facilities BH1 and BH2 in R1; one OPEN August reporting period; clock 2026-08-15T00:00:00Z (inside the window, so nothing is closed yet)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh1_id: "$.data.id", bh1_v: "$.data.version" }
            - call: "POST /facilities"
              payload: { name: "BH2", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh2_id: "$.data.id" }
            - call: "POST /reporting-periods"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_due_datetime: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              captures: { per_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /facility-reports"
              payload: { facility_id: "${bh1_id}", reporting_period_id: "${per_id}", attested_screened_count: 0, attested_refer_count: 0, expected_facility_version: "${bh1_v}" }
              as: FacilityAdmin
              as_user_id: "${bh2_id}"
              captures: { e_ident: "$.data.error_id" }
            - call: "POST /facility-reports"
              payload: { facility_id: "${bh1_id}", reporting_period_id: "${per_id}", attested_screened_count: 0, attested_refer_count: 0, expected_facility_version: "${bh1_v}" }
              as: FacilityAdmin
              as_user_id: "${bh1_id}"
              captures: { rep_id: "$.data.id" }
          assert:
            - "Wrong admin: HTTP 403 with data.error_id == ERR_IDENTITY_MISMATCH (not ERR_FORBIDDEN_ROLE, not ERR_STALE_FACILITY_VERSION); GET /facility-reports?facility_id=${bh1_id} returns total_count == 0"
            - "Own admin: HTTP 201 with FacilityReport.${rep_id}.status == SUBMITTED, facility_id == ${bh1_id}, auto_generated == false, submitted_at == 2026-08-15T00:00:00Z, submitted_late == false"

      - name: period_creation_and_close_enforce_window_and_ordering_rules
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PERIOD_OVERLAP]"
          - "errors[ERR_PERIOD_NOT_ENDED]"
          - "errors[ERR_EARLIER_PERIOD_OPEN]"
        distinguishing_aspect: "Three distinct period errors on the same two rows: a window intersecting August is 409 ERR_PERIOD_OVERLAP, closing August before the clock reaches 2026-09-01 is 422 ERR_PERIOD_NOT_ENDED, and closing September first is 409 ERR_EARLIER_PERIOD_OPEN — after which August then September both close."
        test_recipe:
          setup:
            - "No facilities and no infants (so closes assess nothing). August period P1 (2026-08-01..2026-09-01, due 2026-09-05) exists; clock starts at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /reporting-periods"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_due_datetime: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              captures: { p1_id: "$.data.id" }
          trigger:
            - call: "POST /reporting-periods"
              payload: { period_start: "2026-08-15T00:00:00Z", period_end: "2026-09-15T00:00:00Z", submission_due_datetime: "2026-09-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { e_overlap: "$.data.error_id" }
            - call: "POST /reporting-periods"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", submission_due_datetime: "2026-10-05T00:00:00Z" }
              as: ProgramAdmin
              captures: { p2_id: "$.data.id" }
            - call: "POST /reporting-periods/${p1_id}/close"
              payload: {}
              as: ProgramAdmin
              captures: { e_notended: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /reporting-periods/${p2_id}/close"
              payload: {}
              as: ProgramAdmin
              captures: { e_earlier: "$.data.error_id" }
            - call: "POST /reporting-periods/${p1_id}/close"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Overlapping window: HTTP 409 with data.error_id == ERR_PERIOD_OVERLAP; the touching window 2026-09-01..2026-10-01 is accepted (half-open semantics) with HTTP 201"
            - "Closing P1 at clock 2026-08-01: HTTP 422 with data.error_id == ERR_PERIOD_NOT_ENDED and ReportingPeriod.${p1_id}.status still OPEN"
            - "Closing P2 at clock 2026-10-01 while P1 is OPEN: HTTP 409 with data.error_id == ERR_EARLIER_PERIOD_OPEN and ReportingPeriod.${p2_id}.status still OPEN"
            - "Closing P1 then succeeds: HTTP 200, ReportingPeriod.${p1_id}.status == CLOSED, closed_at == 2026-10-01T00:00:00Z, facilities_assessed_count == 0"

      - name: second_report_for_the_same_facility_period_pair_is_rejected_as_duplicate
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUPLICATE_REPORT]"
          - "errors[ERR_REPORT_INVALID_STATE]"
        distinguishing_aspect: "Uniqueness is on the (facility, period) pair among non-SUPERSEDED rows: a second plain submission is 409 ERR_DUPLICATE_REPORT, waiving a penalty on a SUBMITTED report is 409 ERR_REPORT_INVALID_STATE, and a second review of the already-ACCEPTED report is the same error from a different transition."
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) with one OPEN August period; BH1's admin has filed one SUBMITTED report; clock 2026-08-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id", bh_v: "$.data.version" }
            - call: "POST /reporting-periods"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_due_datetime: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              captures: { per_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /facility-reports"
              payload: { facility_id: "${bh_id}", reporting_period_id: "${per_id}", attested_screened_count: 0, attested_refer_count: 0, expected_facility_version: "${bh_v}" }
              as: FacilityAdmin
              as_user_id: "${bh_id}"
              captures: { rep_id: "$.data.id" }
          trigger:
            - call: "POST /facility-reports"
              payload: { facility_id: "${bh_id}", reporting_period_id: "${per_id}", attested_screened_count: 1, attested_refer_count: 0, expected_facility_version: "${bh_v}" }
              as: FacilityAdmin
              as_user_id: "${bh_id}"
              captures: { e_dup: "$.data.error_id" }
            - call: "POST /facility-reports/${rep_id}/waive-penalty"
              payload: { waiver_reason: "premature waiver attempt" }
              as: ProgramAdmin
              captures: { e_state1: "$.data.error_id" }
            - call: "POST /facility-reports/${rep_id}/review"
              payload: { decision: "ACCEPT" }
              as: ProgramAuditor
            - call: "POST /facility-reports/${rep_id}/review"
              payload: { decision: "ACCEPT" }
              as: ProgramAuditor
              captures: { e_state2: "$.data.error_id" }
          assert:
            - "Second submission without supersedes_report_id: HTTP 409 with data.error_id == ERR_DUPLICATE_REPORT; GET /facility-reports?reporting_period_id=${per_id} still returns total_count == 1"
            - "waive-penalty on a SUBMITTED report: HTTP 409 with data.error_id == ERR_REPORT_INVALID_STATE (the report is neither ACCEPTED nor carrying assessed_penalty_points > 0)"
            - "First review: HTTP 200 with FacilityReport.${rep_id}.status == ACCEPTED and accepted_by_user_id == the auditor's X-User-ID"
            - "Second review: HTTP 409 with data.error_id == ERR_REPORT_INVALID_STATE and status still ACCEPTED"

      - name: penalty_adjustment_cannot_drive_the_balance_below_zero
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_NEGATIVE_PENALTY_BALANCE]"
          - endpoints.POST_facilities_id_penalty_adjustments
        distinguishing_aspect: "The guard is on the resulting balance, not on the sign of points_delta: -1 against a zero balance is 422, +6 then -7 is 422 while +6 then -6 lands exactly on 0 and re-derives the posture COMPLIANT."
        test_recipe:
          setup:
            - "One BIRTH_HOSPITAL facility BH1 at its initial penalty_points_balance 0 and reporting_compliance_status COMPLIANT; no periods, no infants."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
          trigger:
            - call: "POST /facilities/${bh_id}/penalty-adjustments"
              payload: { points_delta: -1, reason: "remit below zero" }
              as: ProgramAdmin
              captures: { e_neg1: "$.data.error_id" }
            - call: "POST /facilities/${bh_id}/penalty-adjustments"
              payload: { points_delta: 6, reason: "late submission sanction" }
              as: ProgramAdmin
            - call: "POST /facilities/${bh_id}/penalty-adjustments"
              payload: { points_delta: -7, reason: "over-remit" }
              as: ProgramAdmin
              captures: { e_neg2: "$.data.error_id" }
            - call: "POST /facilities/${bh_id}/penalty-adjustments"
              payload: { points_delta: -6, reason: "full remission" }
              as: ProgramAdmin
          assert:
            - "-1 on a zero balance: HTTP 422 with data.error_id == ERR_NEGATIVE_PENALTY_BALANCE; Facility.${bh_id}.penalty_points_balance == 0, manual_adjustment_points_total == 0, version unchanged"
            - "+6: HTTP 200 with penalty_points_balance == 6, manual_adjustment_points_total == 6, reporting_compliance_status == WATCH"
            - "-7: HTTP 422 with data.error_id == ERR_NEGATIVE_PENALTY_BALANCE; balance still 6 and status still WATCH"
            - "-6: HTTP 200 with penalty_points_balance == 0, manual_adjustment_points_total == 0, reporting_compliance_status == COMPLIANT"

      - name: outcome_must_agree_with_thresholds_and_the_attester_must_be_a_second_audiologist
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_OUTCOME_THRESHOLD_MISMATCH]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - state_machines.DiagnosticEvaluation.DRAFT_to_PENDING_ATTESTATION
        distinguishing_aspect: "The 25 dB rule is checked against the declared outcome (30/10 dB is UNILATERAL_LOSS, so BILATERAL_LOSS is 422 ERR_OUTCOME_THRESHOLD_MISMATCH), and the performing audiologist attesting his own submission is 409 ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup:
