              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${oil_id}", pack_cost_micros: 12000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "SUB-SAUCE", name: "Peanut Sauce", recipe_type: "SUB_RECIPE", base_uom: "MILLILITER", batch_yield_base_units: 2000, portions_per_batch: 20 }
              as: RecipeDeveloper
              captures: { sauce_id: $.data.id, sauce_v0: $.data.version }
            - call: "POST /culinary/recipes/${sauce_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${oil_id}", ep_quantity_base_units: 100, sequence_no: 1, expected_recipe_version: "${sauce_v0}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${sauce_id}/cost-rollup"
