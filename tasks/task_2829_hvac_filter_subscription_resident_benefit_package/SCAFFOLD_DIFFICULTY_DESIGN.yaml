            - "Unit A-101 has two readings over 2026-08-07 -> 2026-08-09 with runtime_minutes 144 each and static_pressure_delta_pa 100 -> 120, giving evidence_score exactly 60."
            - "Unit A-102 has the identical windows and pressures but runtime_minutes 132 each, giving evidence_score 59."
