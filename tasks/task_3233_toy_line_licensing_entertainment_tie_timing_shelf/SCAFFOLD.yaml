# =============================================================================
# Task: task_3233_toy_line_licensing_entertainment_tie_timing_shelf
# Toy Line Licensing, Entertainment Tie-In Timing & Shelf Reset (Hasbro)
# §1.0–§1.7 scaffold (Difficulty & Corner designs live in sibling files)
# =============================================================================

scenario: |
  Toy Line Licensing, Entertainment Tie-In Timing & Shelf Reset (Hasbro):
  entertainment property licensing with royalty rates, approval rights and
  confidentiality before a film or series reveal, product development
  timelines that must anticipate entertainment release dates that may shift,
  retail line review scheduling where assortments are committed months ahead
  of consumer demand signals, street date embargoes with retailer compliance
  and penalties for early sales, tooling investment and factory allocation
  with minimum order quantities, evergreen brand management alongside licensed
  lines with shelf space competition, safety testing and age grading with
  packaging claims, closeout and markdown handling when an entertainment
  property underperforms.

domain_name: toy-licensing
api_prefix: /toy-licensing

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (11 entities)
# =============================================================================
entities:
  - name: Studio
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Studio / licensor legal name" }
      - { name: confidentiality_tier, type: enum, source: input, description: "STANDARD | STRICT — STRICT bars any downstream licensed-line artifact creation before reveal_date", default: "STANDARD" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED", default: "ACTIVE" }

  - name: Property
    parent: Studio
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id; owning licensor" }
      - { name: title, type: string, source: input, description: "Film or series title" }
      - { name: category, type: enum, source: input, description: "FILM | SERIES" }
      - { name: reveal_date, type: datetime, source: input, description: "First instant the property may be publicly referenced; drives confidentiality gate" }
      - { name: release_date, type: datetime, source: input, description: "Street date anchor for all licensed lines; mutable via shift_release" }
      - { name: shift_count, type: integer, source: computed, description: "Number of accepted shift_release calls; starts at 0" }
      - { name: lifecycle, type: enum, source: computed, description: "CONFIDENTIAL if clock < reveal_date; REVEALED if reveal_date <= clock < release_date; RELEASED if clock >= release_date" }

  - name: LicenseAgreement
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; licensed property" }
      - { name: territory, type: string, source: input, description: "ISO region scope, e.g. NA, EMEA, GLOBAL" }
      - { name: royalty_rate_pct, type: number, source: input, description: "Royalty rate on gross sales, e.g. 0.12" }
      - { name: advance_guarantee_cents, type: integer, source: input, description: "Upfront advance recoupable against earned royalties" }
      - { name: annual_minimum_guarantee_cents, type: integer, source: input, description: "Minimum royalty owed per 4 quarters, prorated at quarter close" }
      - { name: start_date, type: datetime, source: input, description: "Agreement effective start" }
      - { name: end_date, type: datetime, source: input, description: "Agreement expiry; must be after start_date" }
      - { name: approval_rights_required, type: boolean, source: input, description: "If true, StudioRep must approve activation and every amendment" }
      - { name: status, type: enum, source: system, description: "NEGOTIATION | ACTIVE | AMENDMENT_PENDING", default: "NEGOTIATION" }
      - { name: pending_royalty_rate_pct, type: number, source: system, description: "Proposed rate held while AMENDMENT_PENDING; null otherwise" }
      - { name: pending_advance_guarantee_cents, type: integer, source: system, description: "Proposed advance held while AMENDMENT_PENDING; null otherwise" }
      - { name: pending_end_date, type: datetime, source: system, description: "Proposed end date held while AMENDMENT_PENDING; null otherwise" }
      - { name: royalties_earned_cents, type: integer, source: computed, description: "Cumulative earned royalties across closed quarters (final variant)" }
      - { name: recouped_cents, type: integer, source: computed, description: "Cumulative earned royalties applied against advance_guarantee_cents" }
      - { name: guarantee_topups_cents, type: integer, source: computed, description: "Cumulative minimum-guarantee top-ups paid at quarter close" }
      - { name: quarters_closed, type: integer, source: computed, description: "Count of close_quarter calls; starts at 0" }

  - name: ToyLine
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Consumer-facing line name" }
      - { name: brand_kind, type: enum, source: input, description: "LICENSED | EVERGREEN" }
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; required iff brand_kind == LICENSED, null for EVERGREEN" }
      - { name: license_agreement_id, type: string, source: input, description: "FK -> LicenseAgreement.id; required iff brand_kind == LICENSED, null for EVERGREEN" }
      - { name: target_street_date, type: datetime, source: computed, description: "For LICENSED lines mirrors property.release_date (updated by shift cascade); for EVERGREEN set at creation from input target_street_date_input" }
      - { name: target_street_date_input, type: datetime, source: input, description: "EVERGREEN-only street date; ignored for LICENSED (derived from property)" }
      - { name: status, type: enum, source: system, description: "CONCEPT | IN_DEVELOPMENT | TOOLED | COMMITTED | ON_SHELF | CLOSEOUT | RETIRED", default: "CONCEPT" }
      - { name: closeout_markdown_pct, type: number, source: system, description: "Markdown applied at enter_closeout; null until CLOSEOUT first entered" }
      - { name: closeout_recovery_cents, type: integer, source: computed, description: "Recovery computed by markdown_recovery on each enter_closeout; null before" }

  - name: Sku
    parent: ToyLine
    common_fields: true
    fields:
      - { name: toy_line_id, type: string, source: input, description: "FK -> ToyLine.id; owning line" }
      - { name: name, type: string, source: input, description: "SKU display name" }
      - { name: age_grade_months, type: integer, source: input, description: "Claimed minimum age in months printed on packaging; 36..168" }
      - { name: tested_age_grade_months, type: integer, source: computed, description: "Lab-determined minimum age from latest PASSED test; null until first pass" }
      - { name: packaging_claims, type: array, source: input, description: "Subset of [CHOKING_HAZARD_FREE, FLAME_RESISTANT, BPA_FREE]" }
      - { name: claims_validated, type: boolean, source: computed, description: "True only if latest PASSED test validated every claimed packaging claim" }
      - { name: moq_units, type: integer, source: input, description: "Factory minimum order quantity for this SKU; >= 1" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Landed unit cost" }
      - { name: tooling_cost_cents, type: integer, source: input, description: "One-time mold/tooling cost" }
      - { name: safety_status, type: enum, source: system, description: "NOT_TESTED | TESTING | PASSED | FAILED", default: "NOT_TESTED" }

  - name: Factory
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Factory name" }
      - { name: capacity_units_per_month, type: integer, source: input, description: "Maximum allocated units per production month across all tooling orders" }
      - { name: tooling_lead_weeks, type: integer, source: input, description: "Weeks of tooling lead time; used by shift cascade to flag AT_RISK orders" }

  - name: ToolingOrder
    parent: ToyLine
    common_fields: true
    fields:
      - { name: toy_line_id, type: string, source: input, description: "FK -> ToyLine.id; line being tooled" }
      - { name: sku_id, type: string, source: input, description: "FK -> Sku.id; SKU produced; must belong to toy_line_id" }
      - { name: factory_id, type: string, source: input, description: "FK -> Factory.id; allocated factory" }
      - { name: production_month, type: string, source: input, description: "YYYY-MM capacity bucket" }
      - { name: units, type: integer, source: input, description: "Requested units before MOQ rounding" }
      - { name: allocated_units, type: integer, source: computed, description: "MOQ-rounded allocation per factory_capacity_allocation; occupies factory month bucket" }
      - { name: tooling_charge_cents, type: integer, source: computed, description: "Tooling charge incl. overtime tier per factory_capacity_allocation" }
      - { name: status, type: enum, source: system, description: "APPROVED | SCRAPPED | COMPLETE", default: "APPROVED" }

  - name: Retailer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Retail chain name" }
      - { name: region, type: string, source: input, description: "Operating region" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Compliance ledger; debited on embargo penalty, credited on waiver; starts 0 and may go negative" }
      - { name: violation_count, type: integer, source: computed, description: "Count of embargo penalties ever assessed (OPEN or WAIVED); drives REPEAT_OFFENDER penalty variant" }

  - name: LineReview
    parent: Retailer
    common_fields: true
    fields:
      - { name: retailer_id, type: string, source: input, description: "FK -> Retailer.id; hosting retailer" }
      - { name: window_start, type: datetime, source: input, description: "Half-open window start; assortment meetings may begin" }
      - { name: window_end, type: datetime, source: input, description: "Half-open window end; adjacency with another review's window_start is allowed" }
      - { name: commitment_deadline, type: datetime, source: input, description: "After this instant the review is LOCKED; must satisfy window_start <= commitment_deadline <= window_end" }
      - { name: shelf_slots_total, type: integer, source: input, description: "Total shelf slots contested by licensed and evergreen commitments" }
      - { name: shelf_slots_used, type: integer, source: computed, description: "Sum of shelf_slots over COMMITTED and AT_RISK commitments; recomputed on commit/cancel cascade" }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL | CONFIRMED — CONFIRMED requires BrandManager co-approval after RetailerOps schedules (segregation of duties)", default: "PENDING_APPROVAL" }
      - { name: lifecycle, type: enum, source: computed, description: "SCHEDULED if clock < window_start; OPEN if status == CONFIRMED and window_start <= clock < commitment_deadline; LOCKED if clock >= commitment_deadline; PENDING_APPROVAL reviews never reach OPEN" }

  - name: AssortmentCommitment
    parent: LineReview
    common_fields: true
    fields:
      - { name: line_review_id, type: string, source: input, description: "FK -> LineReview.id; host review" }
      - { name: sku_id, type: string, source: input, description: "FK -> Sku.id; committed SKU" }
      - { name: committed_units, type: integer, source: input, description: "Units the retailer commits to take; >= 1" }
      - { name: unit_price_cents, type: integer, source: input, description: "Wholesale unit price" }
      - { name: shelf_slots, type: integer, source: input, description: "Shelf slots allocated to this commitment; >= 1" }
      - { name: status, type: enum, source: system, description: "COMMITTED | AT_RISK | CANCELLED", default: "COMMITTED" }

  - name: Shipment
    parent: AssortmentCommitment
    common_fields: true
    fields:
      - { name: commitment_id, type: string, source: input, description: "FK -> AssortmentCommitment.id; fulfilled commitment" }
      - { name: planned_ship_date, type: datetime, source: input, description: "Planned ship date" }
      - { name: units, type: integer, source: input, description: "Units in this shipment; >= 1" }
      - { name: street_date, type: datetime, source: computed, description: "Embargo date copied from the SKU line's target_street_date at creation; updated by release-shift cascade" }
      - { name: sold_units, type: integer, source: computed, description: "Cumulative units reported sold; starts 0" }
      - { name: sold_at, type: datetime, source: computed, description: "Logical-clock timestamp of the most recent record_sale; null until first sale; royalty_accrual buckets SOLD shipments by sold_at" }
      - { name: status, type: enum, source: system, description: "PLANNED | SOLD", default: "PLANNED" }
      - { name: penalty_cents, type: integer, source: computed, description: "Embargo penalty assessed by embargo_penalty when a sale predates street_date; 0 otherwise" }
      - { name: penalty_status, type: enum, source: system, description: "NONE | OPEN | WAIVED", default: "NONE" }

  - name: SafetyTest
    parent: Sku
    common_fields: true
    fields:
      - { name: sku_id, type: string, source: input, description: "FK -> Sku.id; tested SKU" }
      - { name: test_type, type: enum, source: input, description: "MECHANICAL | FLAMMABILITY | CHEMICAL" }
      - { name: lab_name, type: string, source: input, description: "Accredited lab identifier" }
      - { name: claimed_age_grade_months, type: integer, source: input, description: "Snapshot of sku.age_grade_months at submit; stored immutably" }
      - { name: result_age_grade_months, type: integer, source: input, description: "Lab-determined minimum age, supplied at record_result; 36..168" }
      - { name: validated_claims, type: array, source: input, description: "Packaging claims the lab validated at record_result" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | PASSED | FAILED | INVALIDATED", default: "SUBMITTED" }

# =============================================================================
# Table 2: State Machine Table (6 machines)
# =============================================================================
state_machines:
  - entity: LicenseAgreement
    initial_state: NEGOTIATION
    terminal_states: []
    transitions:
      - from: NEGOTIATION
        to: ACTIVE
        trigger: "POST /toy-licensing/license-agreements/{id}/activate"
        actor: StudioRep
        preconditions:
          - "Actor is StudioRep when approval_rights_required == true; BrandManager may activate only when approval_rights_required == false"
          - "start_date <= end_date"
        side_effects:
          - "LicenseAgreement.version increments by 1"
      - from: ACTIVE
        to: AMENDMENT_PENDING
        trigger: "POST /toy-licensing/license-agreements/{id}/amend"
        actor: BrandManager
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "pending_royalty_rate_pct, pending_advance_guarantee_cents, pending_end_date populated from request"
          - "LicenseAgreement.version increments by 1"
      - from: AMENDMENT_PENDING
        to: ACTIVE
        trigger: "POST /toy-licensing/license-agreements/{id}/amendments/approve"
        actor: StudioRep
        preconditions:
          - "status == AMENDMENT_PENDING"
        side_effects:
          - "royalty_rate_pct, advance_guarantee_cents, end_date overwritten by pending values; pending fields cleared to null"
          - "LicenseAgreement.version increments by 1"
      - from: AMENDMENT_PENDING
        to: ACTIVE
        trigger: "POST /toy-licensing/license-agreements/{id}/amendments/reject"
        actor: StudioRep
        preconditions:
          - "status == AMENDMENT_PENDING"
        side_effects:
          - "pending fields cleared to null; effective terms unchanged"
          - "LicenseAgreement.version increments by 1"

  - entity: ToyLine
    initial_state: CONCEPT
    terminal_states: [RETIRED]
    transitions:
      - from: CONCEPT
        to: IN_DEVELOPMENT
        trigger: "POST /toy-licensing/toy-lines/{id}/advance"
        actor: BrandManager
        preconditions:
          - "status == CONCEPT"
          - "LICENSED line: license agreement status == ACTIVE and property.lifecycle != CONFIDENTIAL"
          - "EVERGREEN line: no additional gates"
        side_effects:
          - "ToyLine.version increments by 1"
      - from: IN_DEVELOPMENT
        to: CONCEPT
        trigger: "POST /toy-licensing/toy-lines/{id}/revert"
        actor: BrandManager
        preconditions:
          - "status == IN_DEVELOPMENT"
          - "No ToolingOrder with status in {APPROVED} exists for this line"
        side_effects:
          - "ToyLine.version increments by 1"
      - from: IN_DEVELOPMENT
        to: TOOLED
        trigger: "POST /toy-licensing/toy-lines/{id}/advance"
        actor: BrandManager
        preconditions:
          - "status == IN_DEVELOPMENT"
          - "Every Sku of this line has safety_status == PASSED"
          - "At least one ToolingOrder with status == APPROVED exists for this line"
        side_effects:
          - "ToyLine.version increments by 1"
      - from: TOOLED
        to: IN_DEVELOPMENT
        trigger: "POST /toy-licensing/toy-lines/{id}/revert"
        actor: BrandManager
        preconditions:
          - "status == TOOLED"
          - "Every ToolingOrder of this line is SCRAPPED (operator scraps them first)"
        side_effects:
          - "ToyLine.version increments by 1"
      - from: TOOLED
        to: COMMITTED
        trigger: "POST /toy-licensing/toy-lines/{id}/advance"
        actor: BrandManager
        preconditions:
          - "status == TOOLED"
          - "At least one AssortmentCommitment with status == COMMITTED references a Sku of this line"
        side_effects:
          - "ToyLine.version increments by 1"
      - from: COMMITTED
        to: ON_SHELF
        trigger: "system (clock reaches target_street_date)"
        actor: system
        preconditions:
          - "status == COMMITTED"
          - "clock >= target_street_date"
        side_effects:
          - "ToyLine.version increments by 1"
      - from: COMMITTED
        to: CLOSEOUT
        trigger: "POST /toy-licensing/toy-lines/{id}/enter_closeout"
        actor: BrandManager
        preconditions:
          - "status == COMMITTED"
          - "LICENSED line: property.lifecycle == RELEASED"
        side_effects:
          - "closeout_markdown_pct set from request; markdown_recovery computes closeout_recovery_cents"
          - "Every AssortmentCommitment referencing a Sku of this line transitions COMMITTED or AT_RISK -> CANCELLED"
          - "Each cancelled commitment recomputes its LineReview.shelf_slots_used (commitment contribution removed)"
          - "ToyLine.version increments by 1"
      - from: ON_SHELF
        to: CLOSEOUT
        trigger: "POST /toy-licensing/toy-lines/{id}/enter_closeout"
        actor: BrandManager
        preconditions:
          - "status == ON_SHELF"
        side_effects:
          - "closeout_markdown_pct set from request; markdown_recovery computes closeout_recovery_cents"
          - "COMMITTED or AT_RISK commitments referencing this line's SKUs -> CANCELLED; shelf_slots_used recomputed per affected LineReview"
          - "ToyLine.version increments by 1"
      - from: CLOSEOUT
        to: COMMITTED
        trigger: "POST /toy-licensing/toy-lines/{id}/exit_closeout"
        actor: BrandManager
        preconditions:
          - "status == CLOSEOUT"
        side_effects:
          - "Re-opens the line for new commitments; previously cancelled commitments stay CANCELLED"
          - "ToyLine.version increments by 1"
      - from: CLOSEOUT
        to: RETIRED
        trigger: "POST /toy-licensing/toy-lines/{id}/retire"
        actor: BrandManager
        preconditions:
          - "status == CLOSEOUT"
          - "No Shipment referencing this line's SKUs has status == PLANNED"
          - "No ToolingOrder of this line has status == APPROVED"
        side_effects:
          - "ToyLine.version increments by 1"

  - entity: Sku
    initial_state: NOT_TESTED
    terminal_states: []
    transitions:
      - from: NOT_TESTED
        to: TESTING
        trigger: "POST /toy-licensing/safety-tests (create SafetyTest for this SKU)"
        actor: SafetyEngineer
        preconditions:
          - "sku.safety_status == NOT_TESTED"
          - "Owning ToyLine.status in {CONCEPT, IN_DEVELOPMENT}"
        side_effects:
          - "Sku.safety_status -> TESTING; SafetyTest.version increments by 1"
      - from: FAILED
        to: TESTING
        trigger: "POST /toy-licensing/safety-tests (retest after failed cycle)"
        actor: SafetyEngineer
        preconditions:
          - "sku.safety_status == FAILED"
          - "Owning ToyLine.status in {CONCEPT, IN_DEVELOPMENT}"
        side_effects:
          - "Sku.safety_status -> TESTING"
      - from: TESTING
        to: PASSED
        trigger: "POST /toy-licensing/safety-tests/{id}/record_result with outcome PASS"
        actor: SafetyEngineer
        preconditions:
          - "SafetyTest.status == SUBMITTED"
          - "result_age_grade_months <= sku.age_grade_months (lab minimum age must not exceed the printed claim)"
          - "validated_claims == sku.packaging_claims (every printed claim lab-validated)"
        side_effects:
          - "Sku.safety_status -> PASSED; sku.tested_age_grade_months = result_age_grade_months; sku.claims_validated = true"
      - from: TESTING
        to: FAILED
        trigger: "POST /toy-licensing/safety-tests/{id}/record_result with outcome FAIL, or PASS with result_age_grade_months > sku.age_grade_months, or PASS with validated_claims != sku.packaging_claims"
        actor: SafetyEngineer
        preconditions:
          - "SafetyTest.status == SUBMITTED"
        side_effects:
          - "Sku.safety_status -> FAILED; sku.claims_validated = false"

  - entity: SafetyTest
    initial_state: SUBMITTED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SUBMITTED
        to: PASSED
        trigger: "POST /toy-licensing/safety-tests/{id}/record_result"
        actor: SafetyEngineer
        preconditions:
          - "status == SUBMITTED"
          - "outcome == PASS and result_age_grade_months <= sku.age_grade_months and validated_claims == sku.packaging_claims"
        side_effects:
          - "Sku.safety_status -> PASSED (see Sku machine)"
      - from: SUBMITTED
        to: FAILED
        trigger: "POST /toy-licensing/safety-tests/{id}/record_result"
        actor: SafetyEngineer
        preconditions:
          - "status == SUBMITTED"
          - "outcome == FAIL, or outcome == PASS with age/claims mismatch"
        side_effects:
          - "Sku.safety_status -> FAILED (see Sku machine)"
      - from: PASSED
        to: INVALIDATED
        trigger: "system (PATCH sku.age_grade_months while sku.safety_status == PASSED)"
        actor: system
        preconditions:
          - "Latest PASSED test exists and sku.age_grade_months is edited"
        side_effects:
          - "Latest PASSED SafetyTest.status -> INVALIDATED (non-terminal log marker)"
          - "Sku.safety_status -> FAILED; sku.claims_validated -> false; sku.tested_age_grade_months stays at last value"
          - "Owning ToyLine, if TOOLED, reverts to IN_DEVELOPMENT (safety regression cascade)"

  - entity: AssortmentCommitment
    initial_state: COMMITTED
    terminal_states: [CANCELLED]
    transitions:
      - from: COMMITTED
        to: AT_RISK
        trigger: "system (POST /toy-licensing/properties/{id}/shift_release cascade)"
        actor: system
        preconditions:
          - "Commitment references a Sku of a LICENSED ToyLine anchored to the shifted property"
          - "New release_date falls after line_review.window_start (assortment committed before demand signal)"
        side_effects:
          - "Commitment.status -> AT_RISK"
      - from: COMMITTED
        to: CANCELLED
        trigger: "POST /toy-licensing/assortment-commitments/{id}/cancel"
        actor: BrandManager
        preconditions:
          - "status in {COMMITTED, AT_RISK}"
          - "line_review.lifecycle == OPEN (LOCKED reviews are frozen)"
        side_effects:
          - "LineReview.shelf_slots_used decremented by this commitment's shelf_slots"
      - from: AT_RISK
        to: CANCELLED
        trigger: "POST /toy-licensing/assortment-commitments/{id}/cancel"
        actor: BrandManager
        preconditions:
          - "line_review.lifecycle == OPEN"
        side_effects:
          - "LineReview.shelf_slots_used decremented by this commitment's shelf_slots"
      - from: AT_RISK
        to: COMMITTED
        trigger: "POST /toy-licensing/assortment-commitments/{id}/reinstate"
        actor: BrandManager
        preconditions:
          - "status == AT_RISK"
          - "line_review.lifecycle == OPEN"
          - "The commitment's line review has enough free shelf slots (no-op for slots since AT_RISK still occupies)"
        side_effects: []
      - from: COMMITTED
        to: CANCELLED
        trigger: "system (ToyLine enter_closeout cascade)"
        actor: system
        preconditions:
          - "Commitment references a Sku of the line entering closeout"
        side_effects:
          - "LineReview.shelf_slots_used decremented by this commitment's shelf_slots"
      - from: AT_RISK
        to: CANCELLED
        trigger: "system (ToyLine enter_closeout cascade)"
        actor: system
        preconditions:
          - "Commitment references a Sku of the line entering closeout"
        side_effects:
          - "LineReview.shelf_slots_used decremented by this commitment's shelf_slots"

  - entity: Shipment
    initial_state: PLANNED
    terminal_states: [SOLD]
    transitions:
      - from: PLANNED
        to: SOLD
        trigger: "POST /toy-licensing/shipments/{id}/record_sale"
        actor: RetailerOps
        preconditions:
          - "status == PLANNED"
          - "units_sold >= 1"
        side_effects:
          - "sold_units = units_sold; embargo_penalty runs: if clock < street_date assess penalty and set penalty_status OPEN"
          - "Shipment.version increments by 1"
      - from: SOLD
        to: SOLD
        trigger: "POST /toy-licensing/shipments/{id}/record_sale (additional sell-through)"
        actor: RetailerOps
        preconditions:
          - "status == SOLD"
          - "units_sold >= 1 and sold_units + units_sold <= units"
        side_effects:
          - "sold_units += units_sold; if clock < street_date, embargo penalty is (re)assessed on cumulative sold_units"
          - "Shipment.version increments by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: license-activate-stale-version
    parent_entity: LicenseAgreement
    write_endpoint: "POST /toy-licensing/license-agreements/{id}/activate"
    occ_field: "expected_license_agreement_version"
    description: |
      Activating a LicenseAgreement with an expected_license_agreement_version
      older than the agreement's current version is rejected. The client's view
      is stale because another writer advanced the agreement (e.g. an amend
      moved it to AMENDMENT_PENDING and back), and re-activating from a stale
      snapshot would mask intervening state changes.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: toyline-advance-stale-version
    parent_entity: ToyLine
    write_endpoint: "POST /toy-licensing/toy-lines/{id}/advance"
    occ_field: "expected_toy_line_version"
    description: |
      Advancing a ToyLine whose version has advanced since the client last
      observed it is rejected. Between the client's read and its advance call,
      a release-shift cascade or a safety-invalidation cascade may have bumped
      the line's version, so the gate the client thought it satisfied no longer
      reflects current state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (6 rules)
# =============================================================================
calculations:
  - name: royalty_accrual
    trigger: "POST /toy-licensing/license-agreements/{id}/close_quarter"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is pinned: (1) gross, (2) earned, (3) recoup, (4) minimum-guarantee top-up.
      quarter_gross_cents = sum over shipments s where s.commitment.sku.toy_line.license_agreement_id == this.id
                            and s.status == SOLD and s.sold_at falls within quarter_index's bounds
                            of s.sold_units * s.commitment.unit_price_cents
      earned_cents = round_half_up(quarter_gross_cents * royalty_rate_pct)   # 2dp intermediate kept as integer cents after rounding
      recoup_applied_cents = min(earned_cents, max(0, advance_guarantee_cents - recouped_cents))
      payable_after_recoup_cents = earned_cents - recoup_applied_cents
      topup_cents = 0
      if quarters_closed + 1 is a multiple of 4:  # annual minimum reconciliation every 4th closed quarter
        year_min_cents = annual_minimum_guarantee_cents
        earned_this_year = earned_cents + sum of earned_cents from the previous 3 closed quarters
        if earned_this_year < year_min_cents:
          topup_cents = year_min_cents - earned_this_year
      royalties_earned_cents += earned_cents + topup_cents
      recouped_cents += recoup_applied_cents
      guarantee_topups_cents += topup_cents
      quarters_closed += 1
    input_set: "Shipments with status SOLD whose sold_at falls within the closing quarter, joined through commitment -> sku -> toy_line -> this license agreement"
    constants:
      QUARTERS_PER_YEAR: 4
    precision: "integer cents; royalty multiplication uses round_half_up to whole cents"
    variants:
      - name: provisional
        when: "GET /toy-licensing/license-agreements/{id}/royalty_projection — read-only preview for the current open quarter"
        difference: "Identical formula, but includes shipments with status PLANNED valued at units * unit_price_cents, uses the PENDING royalty rate if status == AMENDMENT_PENDING, and does not mutate royalties_earned_cents / recouped_cents / guarantee_topups_cents / quarters_closed"
      - name: final
        when: "close_quarter — mutates the ledger fields above"
        difference: "Counts only status == SOLD shipments, uses the effective (non-pending) royalty rate, and persists the four ledger mutations"
  - name: embargo_penalty
    trigger: "POST /toy-licensing/shipments/{id}/record_sale"
    algorithm: threshold
    formula: |
      if clock >= street_date: penalty_cents = 0; penalty_status stays NONE
      else:
        base_cents = sold_units * commitment.unit_price_cents   # cumulative sold_units, not per-call units_sold
        if retailer.violation_count >= REPEAT_THRESHOLD:
          penalty_cents = round_half_up(base_cents * 0.25)
        else:
          penalty_cents = round_half_up(base_cents * 0.10)
        penalty_status = OPEN
        retailer.credit_balance_cents -= penalty_cents
        retailer.violation_count += 1
    input_set: "The shipment being recorded, its commitment, and the retailer owning the host line review"
    constants:
      REPEAT_THRESHOLD: 2
      FIRST_PENALTY_RATE: 0.10
      REPEAT_PENALTY_RATE: 0.25
    precision: "integer cents; round_half_up"
    variants:
      - name: first_offender
        when: "retailer.violation_count < 2 at assessment time"
        difference: "10% of cumulative gross sale value"
      - name: repeat_offender
        when: "retailer.violation_count >= 2 at assessment time"
        difference: "25% of cumulative gross sale value — the tier is selected by the retailer's history, not the shipment"
  - name: factory_capacity_allocation
    trigger: "POST /toy-licensing/tooling-orders (create)"
    algorithm: tiered_pricing
    formula: |
      allocated_units = ceil(units / sku.moq_units) * sku.moq_units
      month_load = sum of allocated_units over ToolingOrders with factory_id == this factory,
                   production_month == this month, status == APPROVED  (excludes SCRAPPED)
      if month_load + allocated_units > factory.capacity_units_per_month: reject with ERR_FACTORY_CAPACITY_EXCEEDED
      utilization_after = (month_load + allocated_units) / factory.capacity_units_per_month
      tier = 0 if utilization_after <= 0.80, 1 if 0.80 < utilization_after <= 1.00   # boundary: exactly 0.80 is tier 0
      overtime_pct = tier * 0.15
      tooling_charge_cents = sku.tooling_cost_cents + round_half_up(sku.unit_cost_cents * allocated_units * (1 + overtime_pct))
    input_set: "APPROVED tooling orders of the same factory in the same production_month bucket"
    constants:
      TIER0_UTILIZATION_MAX: 0.80
      OVERTIME_PCT_PER_TIER: 0.15
    precision: "integer cents; round_half_up on the production-cost component only; tooling_cost_cents is added whole"
  - name: markdown_recovery
    trigger: "POST /toy-licensing/toy-lines/{id}/enter_closeout"
    algorithm: tiered_pricing
    formula: |
      committed_units = sum over COMMITTED or AT_RISK commitments referencing this line's SKUs of committed_units
      if markdown_pct < 0.50: effective_pct = markdown_pct
      else: effective_pct = 0.50 + (markdown_pct - 0.50) / 2      # deep-discount damping above 50%
      revenue_cents = round_half_up(committed_units * avg_unit_price_cents * effective_pct)
      # avg_unit_price_cents = round_half_up( sum(committed_units * unit_price_cents) / committed_units ) over the same commitment set
      closeout_recovery_cents = revenue_cents
      closeout_markdown_pct = markdown_pct as supplied (not damped) — stored for audit
    input_set: "COMMITTED and AT_RISK commitments referencing this line's SKUs; empty set yields closeout_recovery_cents == 0"
    constants:
      DEEP_DISCOUNT_KNEE: 0.50
      DAMPING_DIVISOR: 2
    precision: "integer cents; round_half_up per stage (avg price first, then revenue — rounding order pinned)"
  - name: shelf_slots_used_recompute
    trigger: "commitment create/cancel/cascade-cancel"
    algorithm: aggregation
    formula: |
      line_review.shelf_slots_used = sum over commitments c of c.shelf_slots
      where c.line_review_id == this review and c.status in {COMMITTED, AT_RISK}
      # AT_RISK still occupies slots (retailer is holding the space pending the shifted release)
    input_set: "Commitments of this line review in COMMITTED or AT_RISK status"
    constants: {}
    precision: "integer slots"
  - name: property_lifecycle
    trigger: "read of Property.lifecycle and any gate that consults it"
    algorithm: threshold
    formula: |
      if clock < reveal_date: CONFIDENTIAL
      elif clock < release_date: REVEALED
      else: RELEASED
      # Boundaries: clock == reveal_date is REVEALED; clock == release_date is RELEASED.
    input_set: "The property's reveal_date, release_date, and the logical clock"
    constants: {}
    precision: "instant comparison on ISO8601 UTC"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and in the declared role set; X-User-ID present for entity_backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.5 roles; entity_backed ownership checks (RetailerOps acts only on shipments whose host review belongs to X-User-ID retailer)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path params"
  - priority: 4
    category: state
    check: "Resource in valid state for the requested lifecycle action (agreement activation gates, line advance gates, commitment cancel gates, shipment record_sale gates)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"
  - priority: 5
    category: business_safety
    check: "Safety and packaging compliance: age_grade_months within 36..168; packaging_claims subset of declared enum; record_result PASS requires result_age_grade_months <= sku.age_grade_months and validated_claims == sku.packaging_claims; line advance to TOOLED requires every SKU PASSED"
    error_id: ERR_SAFETY_GATE
    http_status: 422
    applies_to: "POST /toy-licensing/skus, PATCH /toy-licensing/skus/{id}, POST /toy-licensing/safety-tests, POST /toy-licensing/safety-tests/{id}/record_result, POST /toy-licensing/toy-lines/{id}/advance"
  - priority: 6
    category: business_temporal
    check: "Confidentiality: LICENSED ToyLine create, licensed Sku create, and licensed ToolingOrder create require property.lifecycle != CONFIDENTIAL; STRICT studios additionally bar LICENSED ToyLine create while clock < reveal_date even if STANDARD would allow reveal-day creation"
    error_id: ERR_CONFIDENTIALITY_BREACH
    http_status: 422
    applies_to: "POST /toy-licensing/toy-lines, POST /toy-licensing/skus, POST /toy-licensing/tooling-orders"
  - priority: 7
    category: business_constraint
    check: "Referential and structural integrity: sku belongs to toy_line on tooling order; commitment's line_review.lifecycle == OPEN on create; window_start <= commitment_deadline <= window_end on review create"
    error_id: ERR_CONSTRAINT_VIOLATION
    http_status: 422
    applies_to: "POST /toy-licensing/tooling-orders, POST /toy-licensing/assortment-commitments, POST /toy-licensing/line-reviews"
  - priority: 8
    category: business_temporal
    check: "Window occupancy: LineReview windows for the same retailer must not overlap; half-open semantics mean window_end == another window_start is allowed"
    error_id: ERR_REVIEW_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /toy-licensing/line-reviews"
  - priority: 9
    category: business_fiscal
    check: "Factory month capacity: month_load + allocated_units <= capacity_units_per_month on tooling order create"
    error_id: ERR_FACTORY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /toy-licensing/tooling-orders"
  - priority: 10
    category: business_fiscal
    check: "Shelf capacity: shelf_slots_used + new shelf_slots <= shelf_slots_total on commitment create; embargo: sale recording is allowed but triggers embargo_penalty (not a rejection); shipment sold_units + units_sold <= units on repeat record_sale"
    error_id: ERR_SHELF_OVERFLOW | ERR_SHIPMENT_OVERSOLD
    http_status: 422
    applies_to: "POST /toy-licensing/assortment-commitments, POST /toy-licensing/shipments/{id}/record_sale"
  - priority: 11
    category: business_constraint
    check: "Optimistic concurrency: expected_*_version fields must match current parent version on OCC-guarded endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /toy-licensing/license-agreements/{id}/activate, POST /toy-licensing/toy-lines/{id}/advance"
  - priority: 12
    category: business_constraint
    check: "General request shape: required fields present, types correct, enum values valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Studio ---
  - method: POST
    path: "/toy-licensing/studios"
    description: "Create a studio/licensor"
    roles: [PlatformAdmin]
    code: 201
    input: [name, "confidentiality_tier?"]
    output: Studio
    side_effects: ["status ACTIVE"]
  - method: GET
    path: "/toy-licensing/studios/{id}"
    description: "Get a studio"
    roles: [PlatformAdmin, BrandManager, StudioRep]
    code: 200
    input: []
    output: Studio
    side_effects: []

  # --- Property ---
  - method: POST
    path: "/toy-licensing/properties"
    description: "Register an entertainment property"
    roles: [StudioRep]
    code: 201
    input: [studio_id, title, category, reveal_date, release_date]
    output: Property
    side_effects: ["shift_count 0; lifecycle derived from clock"]
  - method: GET
    path: "/toy-licensing/properties/{id}"
    description: "Get a property"
    roles: [PlatformAdmin, BrandManager, StudioRep]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/toy-licensing/properties"
    description: "List properties, optionally filtered by studio"
    roles: [PlatformAdmin, BrandManager, StudioRep]
    code: 200
    input: ["studio_id?", "limit?", "offset?"]
    output: "Property[]"
    side_effects: []
  - method: POST
    path: "/toy-licensing/properties/{id}/shift_release"
    description: "Shift the release date; cascades street dates and risk flags"
    roles: [StudioRep]
    code: 200
    input: [new_release_date]
    output: Property
    side_effects:
      - "release_date = new_release_date; shift_count += 1; version increments"
      - "Every LICENSED ToyLine anchored to this property: target_street_date = new_release_date; line.version increments"
      - "Every Shipment of such lines with status == PLANNED: street_date = new_release_date; shipment.version increments"
      - "Every AssortmentCommitment referencing such lines' SKUs with status == COMMITTED whose host review has window_start < new_release_date: status -> AT_RISK"

  # --- LicenseAgreement ---
  - method: POST
    path: "/toy-licensing/license-agreements"
    description: "Draft a license agreement (starts NEGOTIATION)"
    roles: [BrandManager]
    code: 201
    input: [property_id, territory, royalty_rate_pct, advance_guarantee_cents, annual_minimum_guarantee_cents, start_date, end_date, approval_rights_required]
    output: LicenseAgreement
    side_effects: ["status NEGOTIATION; ledger fields 0; quarters_closed 0"]
  - method: GET
    path: "/toy-licensing/license-agreements/{id}"
    description: "Get a license agreement"
    roles: [PlatformAdmin, BrandManager, StudioRep]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: []
  - method: GET
    path: "/toy-licensing/license-agreements"
    description: "List agreements, optionally filtered by property"
    roles: [PlatformAdmin, BrandManager, StudioRep]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: "LicenseAgreement[]"
    side_effects: []
  - method: POST
    path: "/toy-licensing/license-agreements/{id}/activate"
    description: "Activate a negotiated agreement (OCC-guarded)"
    roles: [StudioRep, BrandManager]
    code: 200
    input: [expected_license_agreement_version]
    output: LicenseAgreement
    side_effects: ["NEGOTIATION -> ACTIVE; version increments; StudioRep required when approval_rights_required"]
  - method: POST
    path: "/toy-licensing/license-agreements/{id}/amend"
    description: "Propose new terms (ACTIVE -> AMENDMENT_PENDING)"
    roles: [BrandManager]
    code: 200
    input: [royalty_rate_pct, advance_guarantee_cents, end_date]
    output: LicenseAgreement
    side_effects: ["pending fields populated; version increments"]
  - method: POST
    path: "/toy-licensing/license-agreements/{id}/amendments/approve"
    description: "Studio approves pending amendment"
    roles: [StudioRep]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: ["pending terms applied; status ACTIVE; version increments"]
  - method: POST
    path: "/toy-licensing/license-agreements/{id}/amendments/reject"
    description: "Studio rejects pending amendment"
    roles: [StudioRep]
    code: 200
    input: []
    output: LicenseAgreement
    side_effects: ["pending fields cleared; status ACTIVE; version increments"]
  - method: POST
    path: "/toy-licensing/license-agreements/{id}/close_quarter"
    description: "Close a royalty quarter (final variant of royalty_accrual)"
    roles: [BrandManager]
    code: 200
    input: [quarter_index]
    output: LicenseAgreement
    side_effects: ["royalty_accrual final variant mutates royalties_earned_cents, recouped_cents, guarantee_topups_cents, quarters_closed"]
  - method: GET
    path: "/toy-licensing/license-agreements/{id}/royalty_projection"
    description: "Read-only provisional royalty projection for the open quarter"
    roles: [BrandManager, StudioRep]
    code: 200
    input: []
    output: "{ projected_earned_cents: integer, projected_recoup_cents: integer, projected_payable_cents: integer }"
    side_effects: []

  # --- ToyLine ---
  - method: POST
    path: "/toy-licensing/toy-lines"
    description: "Create a toy line (LICENSED requires revealed property + existing agreement)"
    roles: [BrandManager]
    code: 201
    input: [name, brand_kind, "property_id?", "license_agreement_id?", "target_street_date_input?"]
    output: ToyLine
    side_effects: ["status CONCEPT; target_street_date derived"]
  - method: GET
    path: "/toy-licensing/toy-lines/{id}"
    description: "Get a toy line"
    roles: [PlatformAdmin, BrandManager, StudioRep, RetailerOps, SafetyEngineer]
    code: 200
    input: []
    output: ToyLine
    side_effects: []
  - method: GET
    path: "/toy-licensing/toy-lines"
    description: "List toy lines"
    roles: [PlatformAdmin, BrandManager, StudioRep, RetailerOps, SafetyEngineer]
    code: 200
    input: ["property_id?", "license_agreement_id?", "brand_kind?", "limit?", "offset?"]
    output: "ToyLine[]"
    side_effects: []
  - method: POST
    path: "/toy-licensing/toy-lines/{id}/advance"
    description: "Advance the line one stage (OCC-guarded)"
    roles: [BrandManager]
    code: 200
    input: [expected_toy_line_version]
    output: ToyLine
    side_effects: ["CONCEPT->IN_DEVELOPMENT->TOOLED->COMMITTED per gates; version increments"]
  - method: POST
    path: "/toy-licensing/toy-lines/{id}/revert"
    description: "Revert the line one stage"
    roles: [BrandManager]
    code: 200
    input: []
    output: ToyLine
    side_effects: ["IN_DEVELOPMENT->CONCEPT or TOOLED->IN_DEVELOPMENT per gates; version increments"]
  - method: POST
    path: "/toy-licensing/toy-lines/{id}/enter_closeout"
    description: "Enter closeout with a markdown; cascades cancellations"
    roles: [BrandManager]
    code: 200
    input: [markdown_pct]
    output: ToyLine
    side_effects: ["markdown_recovery computes closeout_recovery_cents; commitments COMMITTED/AT_RISK -> CANCELLED; shelf_slots_used recomputed"]
  - method: POST
    path: "/toy-licensing/toy-lines/{id}/exit_closeout"
    description: "Re-open a closeout line for new commitments"
    roles: [BrandManager]
    code: 200
    input: []
    output: ToyLine
    side_effects: ["CLOSEOUT -> COMMITTED; version increments"]
  - method: POST
    path: "/toy-licensing/toy-lines/{id}/retire"
    description: "Retire a closeout line"
    roles: [BrandManager]
    code: 200
    input: []
    output: ToyLine
    side_effects: ["CLOSEOUT -> RETIRED; version increments"]

  # --- Sku ---
  - method: POST
    path: "/toy-licensing/skus"
    description: "Create a SKU under a line"
    roles: [BrandManager]
    code: 201
    input: [toy_line_id, name, age_grade_months, packaging_claims, moq_units, unit_cost_cents, tooling_cost_cents]
    output: Sku
    side_effects: ["safety_status NOT_TESTED; claims_validated false; confidentiality gate for licensed lines"]
  - method: GET
    path: "/toy-licensing/skus/{id}"
    description: "Get a SKU"
    roles: [PlatformAdmin, BrandManager, StudioRep, RetailerOps, SafetyEngineer]
    code: 200
    input: []
    output: Sku
    side_effects: []
  - method: GET
    path: "/toy-licensing/skus"
    description: "List SKUs, optionally filtered by line"
    roles: [PlatformAdmin, BrandManager, StudioRep, RetailerOps, SafetyEngineer]
    code: 200
    input: ["toy_line_id?", "limit?", "offset?"]
    output: "Sku[]"
    side_effects: []
  - method: PATCH
    path: "/toy-licensing/skus/{id}"
    description: "Edit age grade or claims; invalidates latest PASSED test"
    roles: [BrandManager]
    code: 200
    input: ["age_grade_months?", "packaging_claims?"]
    output: Sku
    side_effects: ["If safety_status == PASSED: latest PASSED SafetyTest -> INVALIDATED; sku.safety_status -> FAILED; claims_validated false; owning TOOLED line reverts to IN_DEVELOPMENT"]

  # --- Factory ---
  - method: POST
    path: "/toy-licensing/factories"
    description: "Register a factory"
    roles: [PlatformAdmin]
    code: 201
    input: [name, capacity_units_per_month, tooling_lead_weeks]
    output: Factory
    side_effects: []
  - method: GET
    path: "/toy-licensing/factories/{id}"
    description: "Get a factory"
    roles: [PlatformAdmin, BrandManager]
    code: 200
    input: []
    output: Factory
    side_effects: []

  # --- ToolingOrder ---
  - method: POST
    path: "/toy-licensing/tooling-orders"
    description: "Allocate tooling + production month at a factory"
    roles: [BrandManager]
    code: 201
    input: [toy_line_id, sku_id, factory_id, production_month, units]
    output: ToolingOrder
    side_effects: ["factory_capacity_allocation computes allocated_units + tooling_charge_cents; status APPROVED"]
  - method: GET
    path: "/toy-licensing/tooling-orders/{id}"
    description: "Get a tooling order"
    roles: [PlatformAdmin, BrandManager]
    code: 200
    input: []
    output: ToolingOrder
    side_effects: []
  - method: GET
    path: "/toy-licensing/tooling-orders"
    description: "List tooling orders"
    roles: [PlatformAdmin, BrandManager]
    code: 200
    input: ["toy_line_id?", "sku_id?", "factory_id?", "production_month?", "limit?", "offset?"]
    output: "ToolingOrder[]"
    side_effects: []
  - method: POST
    path: "/toy-licensing/tooling-orders/{id}/scrap"
    description: "Scrap an approved tooling order (frees capacity)"
    roles: [BrandManager]
    code: 200
    input: []
    output: ToolingOrder
    side_effects: ["APPROVED -> SCRAPPED; frees factory month capacity; version increments"]
  - method: POST
    path: "/toy-licensing/tooling-orders/{id}/complete"
    description: "Mark tooling order complete"
    roles: [BrandManager]
    code: 200
