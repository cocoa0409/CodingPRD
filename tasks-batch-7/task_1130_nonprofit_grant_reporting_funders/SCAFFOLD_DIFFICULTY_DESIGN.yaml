scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: variance_period_only_vs_cumulative_gate
        grounds:
          - calculations.budget_variance_report
          - entities.BudgetLine.fields.period_budgets_cents
          - errors[ERR_VARIANCE_EXPLANATION_REQUIRED]
        distinguishing_aspect: |
          Same allocation ledger, two variants on the BudgetLine/Expense domain:
          period_only variance for L1 in P2 is +12.00% (>= 10.0 threshold, gates
          submission) while cumulative variance over the same data is +4.00%
          (below threshold) — the variants produce different numbers and only
          period_only gates.
        test_recipe:
          setup:
            - "Grant g1 (QUARTERLY 2026-06-01..2027-05-31, threshold 10.0) ACTIVE with line l1 PERSONNEL 50000000 (period budget 12500000) and UNRESTRICTED fund fu1"
            - "R1 (P1) ACCEPTED after posting+allocating 12000000 to l1 on 2026-06-20"
            - "Clock at 2026-09-15; R2 (P2) DRAFT with 14000000 posted+allocated to l1 on 2026-09-10; narrative+outcome present"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-1", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 50000000 }, as: GrantsOfficer, captures: { l1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "TRAVEL", budgeted_cents: 20000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "SUPPLIES", budgeted_cents: 30000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager, captures: { fu1: $.data.id } }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "GET /grants/${g1}/reports", payload: {}, as: GrantsOfficer, captures: { r1: "$.data[0].id", r2: "$.data[1].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /reports/${r1}/start", payload: {}, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-06-20", vendor: "V1", description: "D1", amount_cents: 12000000 }, as: GrantsOfficer, as_user_id: "officer-1", captures: { e1: $.data.id } }
            - { call: "POST /expenses/${e1}/post", payload: {}, as: FinanceManager, as_user_id: "fin-1" }
            - { call: "POST /expenses/${e1}/allocations", payload: { budget_line_id: "${l1}", fund_id: "${fu1}", amount_cents: 12000000 }, as: GrantsOfficer }
            - { call: "PUT /reports/${r1}", payload: { narrative_draft: "N1", outcome_entries: [{ metric_name: "people", target_value: 100, actual_value: 90, unit: "persons" }] }, as: GrantsOfficer }
            - { call: "POST /reports/${r1}/submit", payload: {}, as: GrantsOfficer }
            - { call: "POST /reports/${r1}/start-review", payload: {}, as: Funder, as_user_id: "${f1}" }
            - { call: "POST /reports/${r1}/accept", payload: {}, as: Funder, as_user_id: "${f1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /reports/${r2}/start", payload: {}, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-09-10", vendor: "V2", description: "D2", amount_cents: 14000000 }, as: GrantsOfficer, as_user_id: "officer-1", captures: { e2: $.data.id } }
            - { call: "POST /expenses/${e2}/post", payload: {}, as: FinanceManager, as_user_id: "fin-1" }
            - { call: "POST /expenses/${e2}/allocations", payload: { budget_line_id: "${l1}", fund_id: "${fu1}", amount_cents: 14000000 }, as: GrantsOfficer }
            - { call: "PUT /reports/${r2}", payload: { narrative_draft: "N2", outcome_entries: [{ metric_name: "people", target_value: 100, actual_value: 95, unit: "persons" }] }, as: GrantsOfficer }
          trigger:
            - { call: "POST /reports/${r2}/submit", payload: {}, as: GrantsOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /grants/${g1}/summary", payload: {}, as: GrantsOfficer }
          assert:
            - "trigger[0] is rejected: err == ERR_VARIANCE_EXPLANATION_REQUIRED (http 422)"
            - "summary.bva row for ${l1}: period_variance_pct == 12.00 (= (14000000-12500000)/12500000 x 100)"
            - "summary.bva row for ${l1}: cumulative_variance_pct == 4.00 (= (26000000-25000000)/25000000 x 100)"
            - "identical ledger data yields 12.00 (period_only, gates) vs 4.00 (cumulative, display-only)"

      - name: match_progress_verified_vs_pledged
        grounds:
          - calculations.match_commitment_progress
          - entities.MatchContribution.fields.recognized_value_cents
        distinguishing_aspect: |
          Same three MatchContribution rows on the MatchContribution domain:
          verified_only totals 5000000 (20.00% of the 25000000 requirement) while
          pledged_inclusive totals 15630000 (62.52%) — different inclusion sets on
          the same data produce different results; entity domain differs from
          variance_period_only_vs_cumulative_gate (BudgetLine/Expense).
        test_recipe:
          setup:
            - "Grant ACTIVE with required_match_cents 25000000; clock 2026-06-15"
            - "m1 CASH 10000000 PLEDGED; m2 VOLUNTEER_TIME 200h DOCUMENTED (recognized 630000 = 200 x 3150); m3 IN_KIND_GOODS 5000000 VERIFIED"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org", requires_match: true }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-2", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY", required_match_cents: 25000000 }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /grants/${g1}/match-contributions", payload: { contribution_type: "CASH", source_name: "D1", valuation_basis: "ACTUAL_COST", documented_value_cents: 10000000 }, as: GrantsOfficer, captures: { m1: $.data.id } }
            - { call: "POST /grants/${g1}/match-contributions", payload: { contribution_type: "VOLUNTEER_TIME", source_name: "Vol", valuation_basis: "STANDARD_RATE", volunteer_hours: 200 }, as: GrantsOfficer, captures: { m2: $.data.id } }
            - { call: "POST /match-contributions/${m2}/document", payload: { documentation_ref: "doc-1" }, as: GrantsOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/${g1}/match-contributions", payload: { contribution_type: "IN_KIND_GOODS", source_name: "G1", valuation_basis: "FAIR_MARKET", documented_value_cents: 5000000 }, as: GrantsOfficer, captures: { m3: $.data.id } }
            - { call: "POST /match-contributions/${m3}/document", payload: { documentation_ref: "doc-2" }, as: GrantsOfficer, as_user_id: "officer-1" }
            - { call: "POST /match-contributions/${m3}/verify", payload: {}, as: FinanceManager, as_user_id: "fin-1" }
          trigger:
            - { call: "GET /grants/${g1}/summary", payload: {}, as: GrantsOfficer, captures: { mv: $.data.match_verified_only_cents, mp: $.data.match_pledged_inclusive_cents, mvp: $.data.match_verified_only_pct, mpp: $.data.match_pledged_inclusive_pct } }
          assert:
            - "match_verified_only_cents == 5000000 (only m3 counts)"
            - "match_pledged_inclusive_cents == 15630000 (10000000 + 630000 + 5000000)"
            - "match_verified_only_pct == 20.00 and match_pledged_inclusive_pct == 62.52"
            - "m1 remains PLEDGED and contributes only to the inclusive variant"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: indirect_pool_cap_branch
        grounds:
          - calculations.indirect_cost_pool
          - entities.Grant.fields.indirect_cap_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: pool = min(rate branch result, cap) over 3+
          inputs — direct_base 26000000 x rate 10 = 2600000 exceeds
          indirect_cap_cents 2000000, so the nested min binds the cap branch and
          the pool is exactly 2000000.
        test_recipe:
          setup:
            - "Grant ACTIVE (FOUNDATION funder, indirect_rate_pct 10, indirect_cap_cents 2000000); one POSTED expense fully allocated 26000000 to PERSONNEL line (category != INDIRECT)"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-3", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY", indirect_rate_pct: 10, indirect_cap_cents: 2000000 }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer, captures: { l1: $.data.id } }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager, captures: { fu1: $.data.id } }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-06-20", vendor: "V", description: "D", amount_cents: 26000000 }, as: GrantsOfficer, as_user_id: "officer-1", captures: { e1: $.data.id } }
            - { call: "POST /expenses/${e1}/post", payload: {}, as: FinanceManager, as_user_id: "fin-1" }
            - { call: "POST /expenses/${e1}/allocations", payload: { budget_line_id: "${l1}", fund_id: "${fu1}", amount_cents: 26000000 }, as: GrantsOfficer }
          trigger:
            - { call: "GET /grants/${g1}/summary", payload: {}, as: GrantsOfficer, captures: { pool: $.data.indirect_pool_cents } }
          assert:
            - "indirect_pool_cents == 2000000"
            - "uncapped branch floor(26000000 x 10 / 100) == 2600000 exceeds the 2000000 cap, proving the min() cap branch binds"

      - name: period_proration_remainder_to_final
        grounds:
          - calculations.period_budget_proration
          - entities.BudgetLine.fields.period_budgets_cents
        distinguishing_aspect: |
          Mode (b) combinatorial: pinned rounding order — floor each of the 4
          quarterly periods of 10000003 then assign the 3-cent residual to the
          FINAL period, yielding [2500000, 2500000, 2500000, 2500003];
          round-each-period-to-nearest would yield 2500001 x 4 = 10000004,
          a different vector and a broken conservation total.
        test_recipe:
          setup:
            - "Grant ACTIVE (QUARTERLY 2026-06-01..2027-05-31, 4 periods) with one SUPPLIES line budgeted 10000003 and one fund"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-4", title: "T", award_amount_cents: 10000003, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "SUPPLIES", budgeted_cents: 10000003 }, as: GrantsOfficer, captures: { l1: $.data.id } }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 10000003 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
          trigger:
            - { call: "GET /grants/${g1}/budget-lines", payload: {}, as: GrantsOfficer, captures: { pb: "$.data[0].period_budgets_cents" } }
          assert:
            - "period_budgets_cents == [2500000, 2500000, 2500000, 2500003]"
            - "sum(period_budgets_cents) == 10000003 (conservation)"
            - "the +3 residual sits on the FINAL period only"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: report_revision_cycle
        grounds:
          - state_machines.Report.UNDER_REVIEW_to_RETURNED
          - state_machines.Report.RETURNED_to_DRAFT
          - entities.Report.fields.revision_count
        distinguishing_aspect: |
          Report is cyclic: DRAFT -> SUBMITTED -> UNDER_REVIEW -> RETURNED ->
          DRAFT -> SUBMITTED again, with revision_count incrementing only on the
          RETURNED -> DRAFT arc (0 before, 1 after).
        test_recipe:
          setup:
            - "Grant ACTIVE (QUARTERLY from 2026-06-01); R1 DRAFT with narrative+outcome; clock 2026-06-15"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-5", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "GET /grants/${g1}/reports", payload: {}, as: GrantsOfficer, captures: { r1: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /reports/${r1}/start", payload: {}, as: GrantsOfficer }
            - { call: "PUT /reports/${r1}", payload: { narrative_draft: "N", outcome_entries: [{ metric_name: "m", target_value: 1, actual_value: 1, unit: "u" }] }, as: GrantsOfficer }
            - { call: "POST /reports/${r1}/submit", payload: {}, as: GrantsOfficer }
            - { call: "POST /reports/${r1}/start-review", payload: {}, as: Funder, as_user_id: "${f1}" }
            - { call: "POST /reports/${r1}/return", payload: { returned_reason: "needs detail" }, as: Funder, as_user_id: "${f1}" }
          trigger:
            - { call: "POST /reports/${r1}/revise", payload: {}, as: GrantsOfficer, captures: { st: $.data.status, rc: $.data.revision_count } }
            - { call: "POST /reports/${r1}/submit", payload: {}, as: GrantsOfficer, captures: { st2: $.data.status } }
          assert:
            - "after revise: status == DRAFT and revision_count == 1"
            - "resubmission from DRAFT succeeds: status == SUBMITTED (cycle RETURNED -> DRAFT -> SUBMITTED closed)"
            - "returned_reason persists on the report row"

      - name: grant_suspension_cycle
        grounds:
          - state_machines.Grant.ACTIVE_to_SUSPENDED
          - state_machines.Grant.SUSPENDED_to_ACTIVE
          - state_machines.AuditFinding.RESPONSE_SUBMITTED_to_RESOLVED
        distinguishing_aspect: |
          Grant is cyclic: ACTIVE -> SUSPENDED (on MATERIAL_WEAKNESS creation)
          -> ACTIVE (on resolving the last open MATERIAL_WEAKNESS); a different
          entity than Report's revision loop.
        test_recipe:
          setup:
            - "Grant ACTIVE with one line+fund; engagement advanced to CONDUCTED; clock 2026-06-15"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-6", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /grants/${g1}/audit-engagements", payload: { engagement_type: "SITE_VISIT", auditor_org: "AudCo", scheduled_start: "2026-07-01T00:00:00Z", scheduled_end: "2026-07-10T00:00:00Z" }, as: ProgramDirector, captures: { eng: $.data.id } }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
          trigger:
            - { call: "POST /audit-engagements/${eng}/findings", payload: { severity: "MATERIAL_WEAKNESS", description: "mw" }, as: Auditor, captures: { fnd: $.data.id } }
            - { call: "GET /grants/${g1}", payload: {}, as: GrantsOfficer, captures: { gsus: $.data.status } }
            - { call: "POST /audit-findings/${fnd}/respond", payload: { response_text: "fixed" }, as: GrantsOfficer }
            - { call: "POST /audit-findings/${fnd}/resolve", payload: {}, as: Auditor }
            - { call: "GET /grants/${g1}", payload: {}, as: GrantsOfficer, captures: { gact: $.data.status } }
          assert:
            - "after MW finding creation: gsus == SUSPENDED"
            - "after respond+resolve of the only MW finding: gact == ACTIVE"
            - "full cycle ACTIVE -> SUSPENDED -> ACTIVE completed on Grant"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers, depths >= 3 and >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: material_weakness_freeze_chain
        grounds:
          - state_machines.Grant.ACTIVE_to_SUSPENDED
          - state_machines.AuditFinding
          - entities.Report.fields.frozen
          - entities.VarianceExplanation.fields.status
        distinguishing_aspect: |
          Depth-3 chain from POST findings: AuditFinding(MATERIAL_WEAKNESS)
          creation mutates Grant (ACTIVE -> SUSPENDED); that suspension itself
          freezes DRAFT/RETURNED Reports (frozen = true); the report freeze
          itself locks DRAFTED VarianceExplanations (DRAFTED -> LOCKED).
        test_recipe:
          setup:
            - "Grant ACTIVE (threshold 3.0); R1 DRAFT with 13000000 allocated to l1 in P1 (period budget 12500000, variance +4.00% >= 3 -> breach); DRAFTED explanation ve1 exists on R1"
            - "Engagement in CONDUCTED"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-7", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY", variance_threshold_pct: 3.0 }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 50000000 }, as: GrantsOfficer, captures: { l1: $.data.id } }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager, captures: { fu1: $.data.id } }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "GET /grants/${g1}/reports", payload: {}, as: GrantsOfficer, captures: { r1: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /reports/${r1}/start", payload: {}, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-06-20", vendor: "V", description: "D", amount_cents: 13000000 }, as: GrantsOfficer, as_user_id: "officer-1", captures: { e1: $.data.id } }
            - { call: "POST /expenses/${e1}/post", payload: {}, as: FinanceManager, as_user_id: "fin-1" }
            - { call: "POST /expenses/${e1}/allocations", payload: { budget_line_id: "${l1}", fund_id: "${fu1}", amount_cents: 13000000 }, as: GrantsOfficer }
            - { call: "POST /reports/${r1}/variance-explanations", payload: { budget_line_id: "${l1}", explanation_text: "hiring surge" }, as: GrantsOfficer, captures: { ve1: $.data.id } }
            - { call: "POST /grants/${g1}/audit-engagements", payload: { engagement_type: "FINANCIAL_AUDIT", auditor_org: "AudCo", scheduled_start: "2026-07-01T00:00:00Z", scheduled_end: "2026-07-10T00:00:00Z" }, as: ProgramDirector, captures: { eng: $.data.id } }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
          trigger:
            - { call: "POST /audit-engagements/${eng}/findings", payload: { severity: "MATERIAL_WEAKNESS", description: "mw" }, as: Auditor, captures: { fnd: $.data.id } }
            - { call: "GET /grants/${g1}", payload: {}, as: GrantsOfficer, captures: { gst: $.data.status } }
            - { call: "GET /reports/${r1}", payload: {}, as: GrantsOfficer, captures: { frz: $.data.frozen } }
            - { call: "GET /reports/${r1}/variance-explanations", payload: {}, as: GrantsOfficer, captures: { vest: "$.data[0].status" } }
          assert:
            - "link 1: gst == SUSPENDED"
            - "link 2 (caused by suspension): frz == true on the DRAFT report"
            - "link 3 (caused by the freeze): vest == LOCKED on the DRAFTED explanation"

      - name: nce_approval_calendar_extension
        grounds:
          - state_machines.ModificationRequest.SUBMITTED_to_APPROVED
          - concurrency_rules[modification-approve-stale-grant]
          - entities.Grant.fields.end_date
          - entities.Report.fields.period_type
        distinguishing_aspect: |
          Depth-2 chain from POST modification-requests/{id}/approve: approval
          mutates Grant (end_date 2027-05-31 -> 2027-08-31, version +1); that
          end_date mutation itself regenerates the Report calendar — the
          SCHEDULED FINAL report becomes INTERIM and a new FINAL report row
          (2027-06-01..2027-08-31, due 2027-11-29) is appended.
        test_recipe:
          setup:
            - "Grant ACTIVE (QUARTERLY 2026-06-01..2027-05-31, 4 reports; report[3] is FINAL due 2027-08-29); SUBMITTED NO_COST_EXTENSION to 2027-08-31; gv = grant.version observed after activation"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-8", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "GET /grants/${g1}", payload: {}, as: GrantsOfficer, captures: { gv: $.data.version } }
            - { call: "POST /grants/${g1}/modification-requests", payload: { request_type: "NO_COST_EXTENSION", justification: "delay", requested_end_date: "2027-08-31" }, as: GrantsOfficer, captures: { mr: $.data.id } }
            - { call: "POST /modification-requests/${mr}/submit", payload: {}, as: ProgramDirector }
          trigger:
            - { call: "POST /modification-requests/${mr}/approve", payload: { expected_grant_version: "${gv}" }, as: Funder, as_user_id: "${f1}", captures: { mst: $.data.status } }
            - { call: "GET /grants/${g1}", payload: {}, as: GrantsOfficer, captures: { gend: $.data.end_date, gv2: $.data.version } }
            - { call: "GET /grants/${g1}/reports", payload: {}, as: GrantsOfficer, captures: { cnt: "$.data[4].id", r4type: "$.data[3].period_type", r5type: "$.data[4].period_type", r5due: "$.data[4].due_date" } }
          assert:
            - "mst == APPROVED"
            - "link 1: gend date portion == 2027-08-31 and Grant.version == ${gv} + 1"
            - "link 2 (caused by end_date change): reports list now has a 5th row; r4type == INTERIM (was FINAL)"
            - "new row: r5type == FINAL with period 2027-06-01..2027-08-31 and r5due date portion == 2027-11-29 (period_end + 90 days)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspend_state_beats_missing_explanation
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_GRANT_SUSPENDED]
          - errors[ERR_VARIANCE_EXPLANATION_REQUIRED]
        distinguishing_aspect: |
          Category pair (state, business_referential): the same submit violates
          both the grant-suspension state gate (p5) and the missing-variance-
          explanation referential gate (p9); the state error
          ERR_GRANT_SUSPENDED must win.
        test_recipe:
          setup:
            - "Grant ACTIVE (threshold 3.0); R1 DRAFT with breaching allocation (13000000 vs 12500000 budget, +4.00%) and NO explanation row"
            - "Grant then SUSPENDED via a MATERIAL_WEAKNESS finding"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-9", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY", variance_threshold_pct: 3.0 }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 50000000 }, as: GrantsOfficer, captures: { l1: $.data.id } }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager, captures: { fu1: $.data.id } }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "GET /grants/${g1}/reports", payload: {}, as: GrantsOfficer, captures: { r1: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /reports/${r1}/start", payload: {}, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-06-20", vendor: "V", description: "D", amount_cents: 13000000 }, as: GrantsOfficer, as_user_id: "officer-1", captures: { e1: $.data.id } }
            - { call: "POST /expenses/${e1}/post", payload: {}, as: FinanceManager, as_user_id: "fin-1" }
            - { call: "POST /expenses/${e1}/allocations", payload: { budget_line_id: "${l1}", fund_id: "${fu1}", amount_cents: 13000000 }, as: GrantsOfficer }
            - { call: "PUT /reports/${r1}", payload: { narrative_draft: "N", outcome_entries: [{ metric_name: "m", target_value: 1, actual_value: 1, unit: "u" }] }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/audit-engagements", payload: { engagement_type: "SITE_VISIT", auditor_org: "AudCo", scheduled_start: "2026-07-01T00:00:00Z", scheduled_end: "2026-07-10T00:00:00Z" }, as: ProgramDirector, captures: { eng: $.data.id } }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/findings", payload: { severity: "MATERIAL_WEAKNESS", description: "mw" }, as: Auditor }
          trigger:
            - { call: "POST /reports/${r1}/submit", payload: {}, as: GrantsOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_GRANT_SUSPENDED (http 409), not ERR_VARIANCE_EXPLANATION_REQUIRED"
            - "the p5 state gate outranks the p9 referential gate when both are violated"

      - name: restriction_beats_fund_overflow
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_RESTRICTION_VIOLATION]
          - errors[ERR_FUND_EXCEEDED]
        distinguishing_aspect: |
          Category pair (business_safety, business_fiscal) — different from
          (state, business_referential): one allocation violates both the
          restricted-fund category rule (TRAVEL not in allowed_categories) and
          the fund-balance rule (5000 > 1000 remaining); the safety error
          ERR_RESTRICTION_VIOLATION must win over ERR_FUND_EXCEEDED.
        test_recipe:
          setup:
            - "Grant ACTIVE; line l2 TRAVEL 20000000; RESTRICTED fund fu2 allocated 1000 with allowed_categories [PERSONNEL, SUPPLIES]; POSTED expense of 5000"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-10", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "TRAVEL", budgeted_cents: 20000000 }, as: GrantsOfficer, captures: { l2: $.data.id } }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "RESTRICTED", allocated_cents: 1000, purpose_restriction: "program only", allowed_categories: ["PERSONNEL", "SUPPLIES"] }, as: FinanceManager, captures: { fu2: $.data.id } }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-06-20", vendor: "V", description: "D", amount_cents: 5000 }, as: GrantsOfficer, as_user_id: "officer-1", captures: { e1: $.data.id } }
            - { call: "POST /expenses/${e1}/post", payload: {}, as: FinanceManager, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /expenses/${e1}/allocations", payload: { budget_line_id: "${l2}", fund_id: "${fu2}", amount_cents: 5000 }, as: GrantsOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_RESTRICTION_VIOLATION (http 422), not ERR_FUND_EXCEEDED"
            - "the p6 safety gate outranks the p10 fiscal gate when both are violated"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: renewal_window_opens_at_exact_instant
        grounds:
          - state_machines.RenewalApplication.NOT_OPEN_to_ELIGIBLE
          - entities.RenewalApplication.fields.window_open
          - errors[ERR_RENEWAL_WINDOW_NOT_OPEN]
        distinguishing_aspect: |
          Time metric on POST /renewal-applications/{id}/submit: window_open is
          inclusive — submit at exactly 2027-04-01T00:00:00Z succeeds, while one
          second earlier (2027-03-31T23:59:59Z) is rejected
          ERR_RENEWAL_WINDOW_NOT_OPEN.
        test_recipe:
          setup:
            - "Grant ACTIVE with end_date 2027-05-31, renewal_window_days 60 -> window_open 2027-04-01T00:00:00Z; RenewalApplication exists (NOT_OPEN)"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-11", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /grants/${g1}/renewal-applications", payload: {}, as: GrantsOfficer, captures: { ra: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-31T23:59:59Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /renewal-applications/${ra}/submit", payload: {}, as: ProgramDirector, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /renewal-applications/${ra}/submit", payload: {}, as: ProgramDirector, captures: { st: $.data.status } }
          assert:
            - "at 2027-03-31T23:59:59Z: err == ERR_RENEWAL_WINDOW_NOT_OPEN"
            - "at exactly 2027-04-01T00:00:00Z: clock advance fires NOT_OPEN -> ELIGIBLE and submit succeeds, st == SUBMITTED"
            - "boundary comparator is >= (inclusive) on window_open"

      - name: variance_threshold_exactly_at_10pct
        grounds:
          - calculations.budget_variance_report
          - entities.Grant.fields.variance_threshold_pct
          - errors[ERR_VARIANCE_EXPLANATION_REQUIRED]
        distinguishing_aspect: |
          Percentage metric on POST /reports/{id}/submit (different metric and
          endpoint from the renewal window): period variance of exactly +10.00%
          meets the inclusive >= 10.0 threshold and forces an explanation, while
          +9.99% does not.
        test_recipe:
          setup:
            - "Grant ACTIVE (threshold 10.0, QUARTERLY); l1 PERSONNEL 50000000 (period budget 12500000)"
            - "P1: 13749000 allocated (variance 9.99%) and R1 submitted without explanation"
            - "P2 (clock 2026-09-15): R2 DRAFT with 13750000 allocated on 2026-09-10 (variance exactly 10.00%)"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-12", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 50000000 }, as: GrantsOfficer, captures: { l1: $.data.id } }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager, captures: { fu1: $.data.id } }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "GET /grants/${g1}/reports", payload: {}, as: GrantsOfficer, captures: { r1: "$.data[0].id", r2: "$.data[1].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /reports/${r1}/start", payload: {}, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-06-20", vendor: "V1", description: "D1", amount_cents: 13749000 }, as: GrantsOfficer, as_user_id: "officer-1", captures: { e1: $.data.id } }
            - { call: "POST /expenses/${e1}/post", payload: {}, as: FinanceManager, as_user_id: "fin-1" }
            - { call: "POST /expenses/${e1}/allocations", payload: { budget_line_id: "${l1}", fund_id: "${fu1}", amount_cents: 13749000 }, as: GrantsOfficer }
            - { call: "PUT /reports/${r1}", payload: { narrative_draft: "N1", outcome_entries: [{ metric_name: "m", target_value: 1, actual_value: 1, unit: "u" }] }, as: GrantsOfficer }
            - { call: "POST /reports/${r1}/submit", payload: {}, as: GrantsOfficer, captures: { ok1: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /reports/${r2}/start", payload: {}, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-09-10", vendor: "V2", description: "D2", amount_cents: 13750000 }, as: GrantsOfficer, as_user_id: "officer-1", captures: { e2: $.data.id } }
            - { call: "POST /expenses/${e2}/post", payload: {}, as: FinanceManager, as_user_id: "fin-1" }
            - { call: "POST /expenses/${e2}/allocations", payload: { budget_line_id: "${l1}", fund_id: "${fu1}", amount_cents: 13750000 }, as: GrantsOfficer }
            - { call: "PUT /reports/${r2}", payload: { narrative_draft: "N2", outcome_entries: [{ metric_name: "m", target_value: 1, actual_value: 1, unit: "u" }] }, as: GrantsOfficer }
          trigger:
            - { call: "POST /reports/${r2}/submit", payload: {}, as: GrantsOfficer, captures: { err: $.data.error_id } }
          assert:
            - "P1 at variance 9.99% (1249000/12500000): ok1 == SUBMITTED with no explanation"
            - "P2 at exactly 10.00% (1250000/12500000): err == ERR_VARIANCE_EXPLANATION_REQUIRED"
            - "threshold comparator is >= (inclusive): 10.00 breaches, 9.99 does not"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: report_submit_gated_on_grant_suspension
        grounds:
          - state_machines.Report.DRAFT_to_SUBMITTED
          - state_machines.Grant.ACTIVE_to_SUSPENDED
          - errors[ERR_GRANT_SUSPENDED]
        distinguishing_aspect: |
          Pair (Report, Grant): a fully submission-ready DRAFT report cannot
          transition while its parent Grant is SUSPENDED; after the grant
          returns to ACTIVE the identical submit succeeds.
        test_recipe:
          setup:
            - "Grant ACTIVE; R1 DRAFT with narrative+outcome and no breaching allocations; grant then SUSPENDED via MW finding; clock 2026-06-15"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-13", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "GET /grants/${g1}/reports", payload: {}, as: GrantsOfficer, captures: { r1: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /reports/${r1}/start", payload: {}, as: GrantsOfficer }
            - { call: "PUT /reports/${r1}", payload: { narrative_draft: "N", outcome_entries: [{ metric_name: "m", target_value: 1, actual_value: 1, unit: "u" }] }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/audit-engagements", payload: { engagement_type: "DESK_REVIEW", auditor_org: "AudCo", scheduled_start: "2026-07-01T00:00:00Z", scheduled_end: "2026-07-10T00:00:00Z" }, as: ProgramDirector, captures: { eng: $.data.id } }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/advance", payload: {}, as: Auditor }
            - { call: "POST /audit-engagements/${eng}/findings", payload: { severity: "MATERIAL_WEAKNESS", description: "mw" }, as: Auditor, captures: { fnd: $.data.id } }
          trigger:
            - { call: "POST /reports/${r1}/submit", payload: {}, as: GrantsOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /audit-findings/${fnd}/respond", payload: { response_text: "fixed" }, as: GrantsOfficer }
            - { call: "POST /audit-findings/${fnd}/resolve", payload: {}, as: Auditor }
            - { call: "POST /reports/${r1}/submit", payload: {}, as: GrantsOfficer, captures: { st: $.data.status } }
          assert:
            - "while Grant SUSPENDED: err == ERR_GRANT_SUSPENDED"
            - "after Grant returns to ACTIVE (respond+resolve): st == SUBMITTED"
            - "the Report machine's DRAFT -> SUBMITTED arc is gated on the Grant machine's state"

      - name: allocation_gated_on_expense_posted
        grounds:
          - state_machines.Expense.DRAFT_to_POSTED
          - entities.ExpenseAllocation.fields.expense_id
          - errors[ERR_EXPENSE_NOT_POSTED]
        distinguishing_aspect: |
          Pair (ExpenseAllocation, Expense) — different from (Report, Grant):
          creating an allocation is rejected while the parent Expense is DRAFT
          and succeeds after the expense reaches POSTED.
        test_recipe:
          setup:
            - "Grant ACTIVE; line l1; fund fu1; expense e1 (100000) in DRAFT; clock 2026-06-15"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-14", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer, captures: { l1: $.data.id } }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager, captures: { fu1: $.data.id } }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-06-20", vendor: "V", description: "D", amount_cents: 100000 }, as: GrantsOfficer, as_user_id: "officer-1", captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /expenses/${e1}/allocations", payload: { budget_line_id: "${l1}", fund_id: "${fu1}", amount_cents: 40000 }, as: GrantsOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /expenses/${e1}/post", payload: {}, as: FinanceManager, as_user_id: "fin-1" }
            - { call: "POST /expenses/${e1}/allocations", payload: { budget_line_id: "${l1}", fund_id: "${fu1}", amount_cents: 40000 }, as: GrantsOfficer, captures: { ast: $.data.status } }
            - { call: "GET /expenses/${e1}", payload: {}, as: GrantsOfficer, captures: { unal: $.data.unallocated_cents } }
          assert:
            - "on DRAFT expense: err == ERR_EXPENSE_NOT_POSTED"
            - "after POSTED: ast == ACTIVE"
            - "Expense.unallocated_cents == 60000 (100000 - 40000)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: grant_engagement_strict_overlap
        grounds:
          - validations[priority=7]
          - errors[ERR_ENGAGEMENT_OVERLAP]
          - entities.AuditEngagement.fields.scheduled_start
        distinguishing_aspect: |
          Strict-exclusion half-open semantics on the Grant resource: any
          positive-length intersection is rejected, but pure adjacency
          (E1.scheduled_end == E3.scheduled_start) is allowed.
        test_recipe:
          setup:
            - "Grant ACTIVE; no engagements yet"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-15", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
          trigger:
            - { call: "POST /grants/${g1}/audit-engagements", payload: { engagement_type: "SITE_VISIT", auditor_org: "AudCo", scheduled_start: "2026-07-01T00:00:00Z", scheduled_end: "2026-07-10T00:00:00Z" }, as: ProgramDirector, captures: { e1: $.data.id } }
            - { call: "POST /grants/${g1}/audit-engagements", payload: { engagement_type: "DESK_REVIEW", auditor_org: "OtherCo", scheduled_start: "2026-07-05T00:00:00Z", scheduled_end: "2026-07-15T00:00:00Z" }, as: ProgramDirector, captures: { err: $.data.error_id } }
            - { call: "POST /grants/${g1}/audit-engagements", payload: { engagement_type: "FINANCIAL_AUDIT", auditor_org: "AudCo", scheduled_start: "2026-07-10T00:00:00Z", scheduled_end: "2026-07-20T00:00:00Z" }, as: ProgramDirector, captures: { e3: $.data.id } }
          assert:
            - "E1 created (201)"
            - "E2 [2026-07-05, 2026-07-15) intersects E1 [2026-07-01, 2026-07-10): err == ERR_ENGAGEMENT_OVERLAP"
            - "E3 starting exactly at E1.scheduled_end is created (201) — half-open adjacency is not an overlap"

      - name: auditor_org_capacity_two_overlap
        grounds:
          - validations[priority=7]
          - errors[ERR_AUDITOR_CAPACITY]
          - constants.AUDITOR_MAX_CONCURRENT_ENGAGEMENTS
        distinguishing_aspect: |
          Aggregate-capacity semantics on the auditor_org resource (different
          resource and different geometry from strict grant exclusion): up to 2
          mutually overlapping active engagements are tolerated; the 3rd
          overlapping window is rejected ERR_AUDITOR_CAPACITY even though each
          grant has no engagement of its own.
        test_recipe:
          setup:
            - "Three ACTIVE grants gA, gB, gC (same funder); no engagements yet"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-A", title: "A", award_amount_cents: 1000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { ga: $.data.id } }
            - { call: "POST /grants/${ga}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 1000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${ga}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 1000000 }, as: FinanceManager }
            - { call: "POST /grants/${ga}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-B", title: "B", award_amount_cents: 1000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { gb: $.data.id } }
            - { call: "POST /grants/${gb}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 1000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${gb}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 1000000 }, as: FinanceManager }
            - { call: "POST /grants/${gb}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-C", title: "C", award_amount_cents: 1000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { gc: $.data.id } }
            - { call: "POST /grants/${gc}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 1000000 }, as: GrantsOfficer }
            - { call: "POST /grants/${gc}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 1000000 }, as: FinanceManager }
            - { call: "POST /grants/${gc}/activate", payload: {}, as: ProgramDirector }
          trigger:
            - { call: "POST /grants/${ga}/audit-engagements", payload: { engagement_type: "SITE_VISIT", auditor_org: "AudCo", scheduled_start: "2026-07-01T00:00:00Z", scheduled_end: "2026-07-31T00:00:00Z" }, as: ProgramDirector, captures: { en1: $.data.id } }
            - { call: "POST /grants/${gb}/audit-engagements", payload: { engagement_type: "DESK_REVIEW", auditor_org: "AudCo", scheduled_start: "2026-07-10T00:00:00Z", scheduled_end: "2026-08-10T00:00:00Z" }, as: ProgramDirector, captures: { en2: $.data.id } }
            - { call: "POST /grants/${gc}/audit-engagements", payload: { engagement_type: "FINANCIAL_AUDIT", auditor_org: "AudCo", scheduled_start: "2026-07-15T00:00:00Z", scheduled_end: "2026-07-20T00:00:00Z" }, as: ProgramDirector, captures: { err: $.data.error_id } }
          assert:
            - "first two overlapping AudCo engagements are created (capacity 2 tolerated)"
            - "third engagement [2026-07-15, 2026-07-20) overlaps both existing windows: err == ERR_AUDITOR_CAPACITY"
            - "rejection occurs even though gC itself has zero engagements (capacity is per auditor_org, not per grant)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reallocation_conserves_total_budget_authority
        grounds:
          - state_machines.ModificationRequest.SUBMITTED_to_APPROVED
          - entities.BudgetLine.fields.adjusted_cents
          - errors[ERR_REALLOCATION_NOT_BALANCED]
        distinguishing_aspect: |
          Conserved quantity: total budget authority — sum of
          BudgetLine.adjusted_cents over the grant equals 100000000 before and
          after an approved BUDGET_REALLOCATION; the forward action (approve)
          paired with its own zero-sum constraint leaves the global sum
          unchanged, pinned as SUM(adjusted_cents) == SUM(budgeted_cents).
        test_recipe:
          setup:
            - "Grant ACTIVE with lines l1 50000000, l2 20000000, l3 30000000 (sum 100000000); SUBMITTED reallocation +5000000 to l2, -5000000 from l3; gv = grant.version"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-16", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 50000000 }, as: GrantsOfficer, captures: { l1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "TRAVEL", budgeted_cents: 20000000 }, as: GrantsOfficer, captures: { l2: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "SUPPLIES", budgeted_cents: 30000000 }, as: GrantsOfficer, captures: { l3: $.data.id } }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "GET /grants/${g1}", payload: {}, as: GrantsOfficer, captures: { gv: $.data.version } }
            - { call: "POST /grants/${g1}/modification-requests", payload: { request_type: "BUDGET_REALLOCATION", justification: "shift", line_deltas: [{ budget_line_id: "${l2}", delta_cents: 5000000 }, { budget_line_id: "${l3}", delta_cents: -5000000 }] }, as: GrantsOfficer, captures: { mr: $.data.id } }
            - { call: "POST /modification-requests/${mr}/submit", payload: {}, as: ProgramDirector }
          trigger:
            - { call: "POST /modification-requests/${mr}/approve", payload: { expected_grant_version: "${gv}" }, as: Funder, as_user_id: "${f1}", captures: { mst: $.data.status } }
            - { call: "GET /grants/${g1}/budget-lines", payload: {}, as: GrantsOfficer, captures: { a1: "$.data[0].adjusted_cents", a2: "$.data[1].adjusted_cents", a3: "$.data[2].adjusted_cents", p3: "$.data[2].period_budgets_cents" } }
          assert:
            - "mst == APPROVED"
            - "l1.adjusted_cents == 50000000, l2.adjusted_cents == 25000000, l3.adjusted_cents == 25000000"
            - "invariant: 50000000 + 25000000 + 25000000 == 100000000 == pre-approval total"
            - "l3.period_budgets_cents recomputed to [6250000, 6250000, 6250000, 6250000]"

      - name: expense_post_void_conserves_fund_ledger
        grounds:
          - state_machines.Expense.POSTED_to_VOIDED
          - state_machines.ExpenseAllocation.ACTIVE_to_VOIDED
          - entities.Fund.fields.expended_cents
          - entities.Expense.fields.unallocated_cents
        distinguishing_aspect: |
          Conserved quantity: the fund expenditure ledger — Fund.expended_cents
          must equal the sum of its ACTIVE allocations at all times, so the
          post+allocate action (2000000 in) paired with its compensating void
          (20000000 out... exactly -2000000) returns the ledger to 0; a
          different conserved quantity than budget authority.
        test_recipe:
          setup:
            - "Grant ACTIVE; line l1; fund fu1; clock 2026-06-15; expense e1 2000000 POSTED and fully allocated to l1/fu1 (fu1.expended_cents == 2000000)"
          setup_api_calls:
            - { call: "POST /funders", payload: { name: "F1", funder_type: "FOUNDATION", contact_email: "f1@x.org" }, as: SystemAdmin, captures: { f1: $.data.id } }
            - { call: "POST /grants", payload: { funder_id: "${f1}", award_number: "AW-17", title: "T", award_amount_cents: 100000000, start_date: "2026-06-01", end_date: "2027-05-31", reporting_frequency: "QUARTERLY" }, as: GrantsOfficer, captures: { g1: $.data.id } }
            - { call: "POST /grants/${g1}/budget-lines", payload: { category: "PERSONNEL", budgeted_cents: 100000000 }, as: GrantsOfficer, captures: { l1: $.data.id } }
            - { call: "POST /grants/${g1}/funds", payload: { fund_type: "UNRESTRICTED", allocated_cents: 100000000 }, as: FinanceManager, captures: { fu1: $.data.id } }
            - { call: "POST /grants/${g1}/activate", payload: {}, as: ProgramDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /grants/${g1}/expenses", payload: { expense_date: "2026-06-20", vendor: "V", description: "D", amount_cents: 2000000 }, as: GrantsOfficer, as_user_id: "officer-1", captures: { e1: $.data.id } }
            - { call: "POST /expenses/${e1}/post", payload: {}, as: FinanceManager, as_user_id: "fin-1" }
            - { call: "POST /expenses/${e1}/allocations", payload: { budget_line_id: "${l1}", fund_id: "${fu1}", amount_cents: 2000000 }, as: GrantsOfficer, captures: { al1: $.data.id } }
          trigger:
            - { call: "GET /grants/${g1}/funds", payload: {}, as: GrantsOfficer, captures: { fx_before: "$.data[0].expended_cents" } }
            - { call: "POST /expenses/${e1}/void", payload: {}, as: FinanceManager }
            - { call: "GET /grants/${g1}/funds", payload: {}, as: GrantsOfficer, captures: { fx_after: "$.data[0].expended_cents" } }
            - { call: "GET /allocations", payload: {}, as: GrantsOfficer, captures: { alst: "$.data[0].status" } }
          assert:
            - "before void: fx_before == 2000000"
            - "after the compensating void: fx_after == 0 — the fund ledger is unchanged by the post+void pair"
            - "alst == VOIDED (cascade), and Fund.expended_cents == sum of ACTIVE allocations (empty sum == 0)"
