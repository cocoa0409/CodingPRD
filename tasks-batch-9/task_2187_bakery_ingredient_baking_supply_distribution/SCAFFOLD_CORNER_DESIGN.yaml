              as_user_id: "wo_1"
            - call: "POST /bakery-distribution/routes"
              payload: { route_code: "R-QCASC", service_on: "2026-09-10T00:00:00Z", vehicle_capacity_lb: 48000, service_buffer_minutes: 30 }
