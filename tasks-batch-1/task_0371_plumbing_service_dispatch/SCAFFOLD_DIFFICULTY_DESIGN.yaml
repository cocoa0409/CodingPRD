  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: estimate_per_line_rounding_order_pinned_mode_b
        grounds:
          - calculations.estimate_provisional_total
          - entities.EstimateLine.fields.line_total_cents
          - entities.Estimate.fields.labor_subtotal_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: three FLAT_RATE lines whose after-hours unit prices end in half-cents
          (151.005, 76.005, 46.005 dollars) round per line to 15101+7601+4601 = 27303 cents; summing the
          raw values then rounding once gives 27302 — the scaffold pins round-per-line, asserting 27303.
        test_recipe:
          setup:
            - "Plan NONE; three flat-rate items base 10067, 5067, 3067 (each *1.5 after-hours ends in .005 dollars)."
            - "Customer no plan; technician skill 3; job dispatched after-hours, confirmed, on site; estimate presented with the three FLAT_RATE lines qty 1 each."
          setup_api_calls:
            - call: "POST /plumbing/_clock/set"
              payload: { to_iso8601: "2026-06-15T19:00:00.000Z" }
              as: OfficeManager
            - call: "POST /plumbing/flat-rate-items"
              payload: { code: "RB-A", category: "DRAIN", base_price_cents: 10067, skill_required: 2 }
              as: OfficeManager
              captures: { fr_a_id: $.data.id }
            - call: "POST /plumbing/flat-rate-items"
              payload: { code: "RB-B", category: "DRAIN", base_price_cents: 5067, skill_required: 2 }
              as: OfficeManager
              captures: { fr_b_id: $.data.id }
            - call: "POST /plumbing/flat-rate-items"
              payload: { code: "RB-C", category: "DRAIN", base_price_cents: 3067, skill_required: 1 }
              as: OfficeManager
              captures: { fr_c_id: $.data.id }
            - call: "POST /plumbing/customers"
              payload: { name: "Cust RB", service_address: "2 Elm St", credit_limit_cents: 100000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech RB", skill_level: 3 }
              as: OfficeManager
              captures: { tech_id: $.data.id }
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "DRAIN", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-06-15T19:00:00.000Z", window_end: "2026-06-15T21:00:00.000Z", eta: "2026-06-15T19:10:00.000Z", expected_job_version: "${job_v0}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /plumbing/service-jobs/${job_id}"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { job_v_onsite: $.data.version }
            - call: "POST /plumbing/service-jobs/${job_id}/estimates"
              payload: { expected_job_version: "${job_v_onsite}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
            - call: "POST /plumbing/estimates/${est_id}/lines"
              payload: { line_type: "FLAT_RATE", flat_rate_item_id: "${fr_a_id}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/lines"
              payload: { line_type: "FLAT_RATE", flat_rate_item_id: "${fr_b_id}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/lines"
              payload: { line_type: "FLAT_RATE", flat_rate_item_id: "${fr_c_id}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /plumbing/estimates/${est_id}/present"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { labor: $.data.labor_subtotal_cents }
          assert:
            - "Estimate.${est_id}.labor_subtotal_cents == 27303"
            - "Estimate.${est_id}.labor_subtotal_cents != 27302"

      - name: trip_fee_waiver_keyed_on_post_discount_labor_mode_c
        grounds:
          - calculations.estimate_provisional_total
          - entities.Estimate.fields.trip_fee_cents
          - entities.Estimate.fields.discount_cents
          - entities.Estimate.fields.estimate_total_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned order: the trip-fee waiver is keyed on
          labor_after_discount, NOT raw labor. SILVER (0.10, waives_trip_fee=false) on raw labor 52000:
          raw labor 52000 already exceeds the 50000 waive threshold, but the pinned order applies the
          discount FIRST (5200), so labor_after=46800 (<50000) and the trip fee is CHARGED (8900). Had the
          waiver been keyed on raw labor (wrong order) the trip would be waived (0) — so the two evaluation
          orders yield 55700 vs 46800. The scaffold pins discount-before-waiver, asserting trip 8900 / total 55700.
        test_recipe:
          setup:
            - "Plan SILVER labor_discount_pct 0.10 waives_trip_fee FALSE; customer on SILVER."
            - "Single FLAT_RATE item base 52000; job normal-hours (no after-hours), on site; estimate presented with one line qty 1."
            - "Raw labor 52000; discount round(52000*0.10)=5200; labor_after=46800 (<50000) so the >=50000 waive branch does NOT fire and the trip fee 8900 is charged — proving the waiver is keyed on labor_after, not raw labor."
          setup_api_calls:
            - call: "POST /plumbing/_clock/set"
              payload: { to_iso8601: "2026-06-16T10:00:00.000Z" }
              as: OfficeManager
            - call: "POST /plumbing/membership-plans"
              payload: { tier_code: "SILVER", name: "Silver", labor_discount_pct: 0.10, waives_trip_fee: false, annual_fee_cents: 12000 }
              as: OfficeManager
              captures: { plan_silver_id: $.data.id }
            - call: "POST /plumbing/flat-rate-items"
              payload: { code: "WH-1", category: "WATER_HEATER", base_price_cents: 52000, skill_required: 2 }
              as: OfficeManager
              captures: { fr_id: $.data.id }
            - call: "POST /plumbing/customers"
              payload: { name: "Cust SV", service_address: "3 Pine St", membership_plan_id: "${plan_silver_id}", credit_limit_cents: 100000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech SV", skill_level: 3 }
              as: OfficeManager
              captures: { tech_id: $.data.id }
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "WATER_HEATER", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-06-16T10:00:00.000Z", window_end: "2026-06-16T12:00:00.000Z", eta: "2026-06-16T10:15:00.000Z", expected_job_version: "${job_v0}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /plumbing/service-jobs/${job_id}"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { job_v_onsite: $.data.version }
            - call: "POST /plumbing/service-jobs/${job_id}/estimates"
              payload: { expected_job_version: "${job_v_onsite}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
            - call: "POST /plumbing/estimates/${est_id}/lines"
              payload: { line_type: "FLAT_RATE", flat_rate_item_id: "${fr_id}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /plumbing/estimates/${est_id}/present"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          assert:
            - "Estimate.${est_id}.discount_cents == 5200"
            - "Estimate.${est_id}.trip_fee_cents == 8900"
            - "Estimate.${est_id}.estimate_total_cents == 55700"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: service_job_reopen_cycle_completed_to_reopened_to_completed
        grounds:
          - state_machines.ServiceJob.COMPLETED_to_REOPENED
          - state_machines.ServiceJob.REOPENED_to_IN_PROGRESS
          - state_machines.ServiceJob.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Cyclic shape on ServiceJob: a COMPLETED job returns to REOPENED via accepted callback, then
          IN_PROGRESS, then COMPLETED again — the same entity row revisits COMPLETED, which a linear
          pipeline cannot do.
        test_recipe:
          setup:
            - "A job completed normally; a within-warranty callback was filed and accepted, moving the job COMPLETED -> REOPENED."
          setup_api_calls:
            - call: "POST /plumbing/_clock/set"
              payload: { to_iso8601: "2026-03-01T09:00:00.000Z" }
              as: OfficeManager
            - call: "POST /plumbing/customers"
              payload: { name: "Cust RO", service_address: "4 Birch St", credit_limit_cents: 100000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech RO", skill_level: 3 }
              as: OfficeManager
              captures: { tech_id: $.data.id }
            - call: "POST /plumbing/flat-rate-items"
              payload: { code: "RO-1", category: "DRAIN", base_price_cents: 20000, skill_required: 1 }
              as: OfficeManager
              captures: { fr_id: $.data.id }
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "DRAIN", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-03-01T10:00:00.000Z", window_end: "2026-03-01T12:00:00.000Z", eta: "2026-03-01T10:15:00.000Z", expected_job_version: "${job_v0}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /plumbing/service-jobs/${job_id}"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { job_v_onsite: $.data.version }
            - call: "POST /plumbing/service-jobs/${job_id}/estimates"
              payload: { expected_job_version: "${job_v_onsite}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
            - call: "POST /plumbing/estimates/${est_id}/lines"
              payload: { line_type: "FLAT_RATE", flat_rate_item_id: "${fr_id}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/present"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /plumbing/service-jobs/${job_id}/start-work"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/service-jobs/${job_id}/complete"
              payload: { consumed_parts: [] }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/callbacks"
              payload: { original_job_id: "${job_id}", reason: "Drain clogged again" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { cb_id: $.data.id }
            - call: "POST /plumbing/callbacks/${cb_id}/accept"
              payload: {}
              as: OfficeManager
          trigger:
            - call: "POST /plumbing/service-jobs/${job_id}/start-work"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/service-jobs/${job_id}/complete"
              payload: { consumed_parts: [] }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { final_status: $.data.status }
          assert:
            - "After accept, GET ServiceJob.${job_id}.status == REOPENED"
            - "After re-start-work, ServiceJob.${job_id}.status == IN_PROGRESS"
            - "After re-complete, ServiceJob.${job_id}.status == COMPLETED"

      - name: estimate_revision_cycle_presented_to_revised_to_presented
        grounds:
          - state_machines.Estimate.PRESENTED_to_REVISED
          - state_machines.Estimate.REVISED_to_PRESENTED
          - state_machines.Estimate.DRAFT_to_PRESENTED
        distinguishing_aspect: |
          Cyclic shape on a DIFFERENT entity (Estimate): PRESENTED -> REVISED -> PRESENTED loops the same
          estimate row through PRESENTED twice with a recompute between, which a linear estimate workflow
          cannot express.
        test_recipe:
          setup:
            - "An estimate has been DRAFT->PRESENTED with one line; the technician then revised it (PRESENTED->REVISED), added another line, and is ready to re-present."
          setup_api_calls:
