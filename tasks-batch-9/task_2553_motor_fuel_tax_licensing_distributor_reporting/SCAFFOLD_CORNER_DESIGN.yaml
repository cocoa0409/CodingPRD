          assert:
            - "HTTP 422; data.error_id == ERR_ABATEMENT_AMOUNT_INVALID"
            - "GET /mft/audit-cases/${case1} still reports assessment_status == ISSUED with assessed_total_cents == 275250"
            - "GET /mft/licensees/${d1_id}/ledger-entries returns total_count == 2 (ASSESSMENT +275250 and PAYMENT -100000) and balance_cents == 175250 - no ABATEMENT row was written"
            - "the identical abate on ${case2}, whose licensee paid nothing, returns HTTP 200 with assessment_status == ABATED, an ABATEMENT row of -275250 and balance_cents back to 0"

      - name: revoking_an_already_revoked_certificate_returns_certificate_not_active
        claim_type: triggerability
        grounds:
          - errors[ERR_CERTIFICATE_NOT_ACTIVE]
          - validations[priority=73]
          - endpoints[POST /mft/exemption-certificates/{id}/revoke]
        distinguishing_aspect: "The revoke verb is not idempotent: the second call on the same certificate is a 409 on the certificate's own status, distinct from the 103 date/status check that transaction endpoints raise when the revoked certificate is later presented."
        test_recipe:
          setup:
            - "One FARM-channel RETAILER holding an ACTIVE AGRICULTURE certificate for 2026-08-01..2026-08-31; clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Revoke Twice Farm Depot LLC", fein: "41-8300001", license_type: "RETAILER", mailing_state: "MN", retail_channel: "FARM" }
              as: LicensingOfficer
              captures: { farm_id: $.data.id }
            - call: "POST /mft/exemption-certificates"
              payload: { purchaser_licensee_id: "${farm_id}", exemption_type: "AGRICULTURE", document_number: "AG-8300-001", valid_from: "2026-08-01", valid_to: "2026-08-31" }
              as: LicensingOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /mft/exemption-certificates/${cert_id}/revoke"
              payload: { reason: "Purchaser sold the farming operation" }
              as: LicensingOfficer
          trigger:
            - call: "POST /mft/exemption-certificates/${cert_id}/revoke"
              payload: { reason: "Duplicate revocation request from the field office" }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_CERTIFICATE_NOT_ACTIVE"
            - "GET /mft/exemption-certificates/${cert_id} reports status == REVOKED and its version is unchanged by the refused second call"
            - "GET /mft/exemption-certificates with payload { purchaser_licensee_id: ${farm_id}, status: ACTIVE } returns total_count == 0"
            - "a new AGRICULTURE certificate for the same purchaser over the same 2026-08-01..2026-08-31 window is now accepted with HTTP 201, since only ACTIVE certificates occupy a window"

      - name: state_gated_amendment_and_assessment_actions_return_their_own_state_errors
        claim_type: triggerability
        grounds:
          - errors[ERR_RETURN_NOT_FILED]
          - errors[ERR_AUDIT_CASE_STATE_INVALID]
          - errors[ERR_ASSESSMENT_ALREADY_ISSUED]
          - validations[priority=75]
          - validations[priority=79]
          - validations[priority=80]
        distinguishing_aspect: "Three different 409s guard three different notions of readiness on one fixture: a return that is not yet FILED cannot be amended, a case that is still OPEN cannot be assessed, and a case that has already been assessed cannot be assessed again - and the two case rules are ordered so that the already-issued check speaks before the case-status check."
        test_recipe:
          setup:
            - "One DISTRIBUTOR holding a DRAFT 2026-08 return with one SCH_2_RECEIVED_TAX_UNPAID GASOLINE schedule of 500.00 gallons and one matching line from a SUPPLIER counterparty."
            - "AuditManager aud-01 has an OPEN MANUAL_REFERRAL case over 2026-08..2026-08 on the same distributor."
            - "Clock at 2026-09-25T00:00:00Z, 4 whole days past the period's 2026-09-20T23:59:59Z due instant."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "State Gate Fuel Supply LLC", fein: "41-9400001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "State Gate Distribution Inc", fein: "41-9400002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-25T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { ret_id: $.data.id, ret_v0: $.data.version }
            - call: "POST /mft/returns/${ret_id}/schedules"
              payload: { schedule_code: "SCH_2_RECEIVED_TAX_UNPAID", product_code: "GASOLINE", total_gallons: 500.00 }
              as: ReturnsExaminer
              captures: { sch_id: $.data.id }
            - call: "POST /mft/schedules/${sch_id}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 500.00, document_date: "2026-08-13", bill_of_lading_number: "BOL-SG-9400" }
              as: ReturnsExaminer
            - call: "POST /mft/audit-cases"
              payload: { subject_licensee_id: "${dist_id}", selection_method: "MANUAL_REFERRAL", period_start_month: "2026-08", period_end_month: "2026-08" }
              as: AuditManager
              as_user_id: "aud-01"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /mft/returns/${ret_id}/amendments"
              payload: { expected_return_version: "${ret_v0}", reason: "The August gasoline receipts were misposted" }
              as: ReturnsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_RETURN_NOT_FILED, and the version carried was the return's current one so this is not a 412"
            - "GET /mft/returns with payload { licensee_id: ${dist_id} } still returns total_count == 1 and that row's amendment_count == 0"
            - "POST /mft/audit-cases/${case_id}/assessments with additional_tax_cents 100000 and evasion_indicator false as TaxSupervisor sup-01 returns HTTP 409 ERR_AUDIT_CASE_STATE_INVALID while case_status == OPEN, and GET /mft/licensees/${dist_id}/ledger-entries still returns total_count == 0"
            - "after two advances (FIELDWORK then PRELIM_FINDINGS) the same assessment returns HTTP 200 with assessment_status == ISSUED and assessed_total_cents == 110100 (100000 tax + 10000 negligence penalty + 100 interest for 4 days)"
            - "a second assessment of any amount on ${case_id} as TaxSupervisor sup-02 returns HTTP 409 ERR_ASSESSMENT_ALREADY_ISSUED - the first assessment is not replaced, assessed_total_cents stays 110100 and the ledger still holds exactly one ASSESSMENT row"
            - "advancing ${case_id} to TAXPAYER_RESPONSE and repeating the assessment still returns ERR_ASSESSMENT_ALREADY_ISSUED rather than ERR_AUDIT_CASE_STATE_INVALID, pinning the order of priorities 79 and 80"

      - name: position_holder_schedule_product_and_date_window_shapes_are_refused
        claim_type: triggerability
        grounds:
