# =============================================================================
# Package Locker & Mailbox Rental — benchmark seed tables (Expert tier)
# §1.0–§1.7 live here. §1.8 / §1.9 live in their sibling design files.
# Flat topology: every entity is a top-level collection linked by FK fields in
# the body; facility_id scopes resources. api_prefix is the root ("").
# =============================================================================

scenario: "Package Locker & Mailbox Rental: box/locker inventory & size, rental term & autopay, package receipt & notification, hold/pickup code, mail forwarding/scan, overstay/oversize fee, recipient authorization (Form 1583), abandonment"

domain_name: package-locker-mailbox-rental
api_prefix: ""

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.4) — Expert band
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - derived_field_reconciliation

  entity_topology: flat
  # LockerUnit, MailboxUnit, Customer, RentalAgreement, Form1583,
  # AuthorizedRecipient, Package, MailItem, ForwardingRequest, Invoice,
  # LedgerEntry, Payment are peers under a thin Facility scope, linked by FK.

  state_machine_shape: parallel
  # RentalAgreement is cyclic (ACTIVE<->SUSPENDED + renewal loop); Package is
  # branching fork-join (NOTIFIED -> {PICKED_UP, FORWARDED, RETURNED, ABANDONED});
  # Form1583 is branching-with-revert (SUBMITTED -> {VERIFIED, REJECTED} -> resubmit);
  # ForwardingRequest is linear-with-hold.

  relationship_patterns:
    - one_to_many        # Facility -> units; RentalAgreement -> Package/MailItem
    - cross_aggregate    # Package -> RentalAgreement -> Form1583; LedgerEntry -> Invoice
    - many_to_many       # AuthorizedRecipient bridges Form1583 and named recipients

  role_model: peer_roles
  # FacilityOperator owns inventory + receiving + sweeps; Customer owns own
  # rentals/forwarding; ComplianceOfficer owns Form 1583 verification.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Facility/store display name" }
      - { name: time_zone, type: string, source: input, description: "IANA tz used for calendar-day overstay/proration math", default: "UTC" }
      - { name: current_utc, type: datetime, source: system, description: "Facility logical clock; advanced only via POST /facilities/{id}/clock/advance", default: "1970-01-01T00:00:00.000Z" }
      - { name: total_locker_count, type: integer, source: computed, description: "Count of LockerUnit rows under this facility" }
      - { name: available_locker_count, type: integer, source: computed, description: "Count of LockerUnit with status==AVAILABLE under this facility" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: LockerUnit
    parent: Facility
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: label, type: string, source: input, description: "Physical locker label, unique within facility" }
      - { name: size_tier, type: enum, source: input, description: "SMALL | MEDIUM | LARGE | XL", constraints: "enum: SMALL, MEDIUM, LARGE, XL" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OCCUPIED | OUT_OF_SERVICE", constraints: "enum: AVAILABLE, OCCUPIED, OUT_OF_SERVICE", default: "AVAILABLE" }
      - { name: current_package_id, type: string, source: computed, description: "Convenience back-reference: id of the single Package currently occupying this locker (null when AVAILABLE/OUT_OF_SERVICE); the owning FK is Package.locker_unit_id, discoverable via GET /packages?locker_unit_id={id}" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: MailboxUnit
    parent: Facility
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: box_number, type: string, source: input, description: "PO-box number label, unique within facility" }
      - { name: size_tier, type: enum, source: input, description: "SMALL | MEDIUM | LARGE", constraints: "enum: SMALL, MEDIUM, LARGE" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "List rental price per 30-day month for this box size", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "VACANT | RENTED | OUT_OF_SERVICE", constraints: "enum: VACANT, RENTED, OUT_OF_SERVICE", default: "VACANT" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Customer
    parent: Facility
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only; equals X-User-ID when acting as Customer" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: full_name, type: string, source: input, description: "Legal name of the renter" }
      - { name: email, type: string, source: input, description: "Notification email; unique within facility" }
      - { name: phone, type: string, source: input, description: "Notification phone (SMS)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "enum: ACTIVE, SUSPENDED", default: "ACTIVE" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Form1583
    parent: Facility
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the applicant" }
      - { name: primary_id_type, type: enum, source: input, description: "Photo ID class shown at submission: PASSPORT | DRIVERS_LICENSE | STATE_ID", constraints: "enum: PASSPORT, DRIVERS_LICENSE, STATE_ID" }
      - { name: address_proof_type, type: enum, source: input, description: "Secondary address proof: LEASE | UTILITY_BILL | VEHICLE_REG", constraints: "enum: LEASE, UTILITY_BILL, VEHICLE_REG" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | VERIFIED | REJECTED", constraints: "enum: DRAFT, SUBMITTED, VERIFIED, REJECTED", default: "DRAFT" }
      - { name: submission_count, type: integer, source: system, description: "Number of times this form has entered SUBMITTED", default: 0 }
      - { name: verified_at, type: datetime, source: system, description: "Facility-clock time the form reached VERIFIED, null otherwise" }
      - { name: rejection_reason, type: string, source: input, description: "Free-text reason recorded on REJECT, null otherwise" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: AuthorizedRecipient
    parent: Facility
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: form_1583_id, type: string, source: input, description: "FK -> Form1583.id; the authorization this recipient is listed on" }
      - { name: recipient_name, type: string, source: input, description: "Name of an individual authorized to receive mail/packages" }
      - { name: relationship, type: enum, source: input, description: "SELF | FAMILY | BUSINESS | MINOR", constraints: "enum: SELF, FAMILY, BUSINESS, MINOR" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; immutable record" }

  - name: RentalAgreement
    parent: Facility
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the renter" }
      - { name: mailbox_unit_id, type: string, source: input, description: "FK -> MailboxUnit.id; the box being rented" }
      - { name: form_1583_id, type: string, source: input, description: "FK -> Form1583.id; the authorization gating activation" }
      - { name: term_months, type: integer, source: input, description: "Rental term length in 30-day months", constraints: ">= 1" }
      - { name: monthly_fee_cents, type: integer, source: system, description: "Snapshot of MailboxUnit.monthly_fee_cents at creation" }
      - { name: term_start, type: datetime, source: system, description: "Facility-clock time the agreement reached ACTIVE, null until activated" }
      - { name: term_end, type: datetime, source: system, description: "term_start + term_months*30 days, extended on renew, null until activated" }
      - { name: autopay_enabled, type: boolean, source: input, description: "When true, accrued Invoice balance is auto-charged on each charge event", default: false }
      - { name: status, type: enum, source: system, description: "PENDING_AUTH | ACTIVE | SUSPENDED | CLOSED | ABANDONED", constraints: "enum: PENDING_AUTH, ACTIVE, SUSPENDED, CLOSED, ABANDONED", default: "PENDING_AUTH" }
      - { name: renewal_count, type: integer, source: system, description: "Number of successful renewals", default: 0 }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Package
    parent: Facility
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: rental_agreement_id, type: string, source: input, description: "FK -> RentalAgreement.id; the rental this package is received for" }
      - { name: locker_unit_id, type: string, source: system, description: "FK -> LockerUnit.id; locker assigned at receipt, null after release" }
      - { name: carrier, type: enum, source: input, description: "USPS | UPS | FEDEX | AMAZON | OTHER", constraints: "enum: USPS, UPS, FEDEX, AMAZON, OTHER" }
      - { name: size_tier, type: enum, source: input, description: "Requested locker size for receipt: SMALL | MEDIUM | LARGE | XL", constraints: "enum: SMALL, MEDIUM, LARGE, XL" }
      - { name: longest_dim_cm, type: integer, source: input, description: "Longest dimension in cm, drives oversize fee", constraints: ">= 1" }
      - { name: weight_g, type: integer, source: input, description: "Weight in grams, drives oversize fee", constraints: ">= 1" }
      - { name: pickup_code, type: string, source: system, description: "6-digit hold/pickup code issued at receipt, required to pick up" }
      - { name: notified_at, type: datetime, source: system, description: "Facility-clock time the recipient was notified, null until NOTIFIED" }
      - { name: resolved_at, type: datetime, source: system, description: "Facility-clock time the package left storage (pickup/forward/return/abandon), null until terminal" }
      - { name: oversize_fee_cents, type: integer, source: computed, description: "Surcharge for exceeding assigned locker size, pinned at receipt", default: 0 }
      - { name: overstay_fee_cents, type: integer, source: computed, description: "Accrued overstay fee, provisional until terminal then final", default: 0 }
      - { name: status, type: enum, source: system, description: "RECEIVED | NOTIFIED | PICKED_UP | FORWARDED | RETURNED | ABANDONED", constraints: "enum: RECEIVED, NOTIFIED, PICKED_UP, FORWARDED, RETURNED, ABANDONED", default: "RECEIVED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: MailItem
    parent: Facility
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: rental_agreement_id, type: string, source: input, description: "FK -> RentalAgreement.id; rental whose mailbox received this letter mail" }
      - { name: mail_class, type: enum, source: input, description: "FIRST_CLASS | MARKETING | CERTIFIED | PARCEL", constraints: "enum: FIRST_CLASS, MARKETING, CERTIFIED, PARCEL" }
      - { name: status, type: enum, source: system, description: "STORED | SCANNED | FORWARDED | SHREDDED", constraints: "enum: STORED, SCANNED, FORWARDED, SHREDDED", default: "STORED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: ForwardingRequest
    parent: Facility
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: mail_item_id, type: string, source: input, description: "FK -> MailItem.id; the letter to forward or scan" }
      - { name: kind, type: enum, source: input, description: "FORWARD | SCAN", constraints: "enum: FORWARD, SCAN" }
      - { name: destination_address, type: string, source: input, description: "Forwarding address; required when kind==FORWARD, ignored for SCAN" }
      - { name: fee_cents, type: integer, source: computed, description: "Service fee pinned at creation: FORWARD or SCAN flat rate", default: 0 }
      - { name: status, type: enum, source: system, description: "REQUESTED | ON_HOLD | COMPLETED | CANCELLED", constraints: "enum: REQUESTED, ON_HOLD, COMPLETED, CANCELLED", default: "REQUESTED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Invoice
    parent: Facility
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: rental_agreement_id, type: string, source: system, description: "FK -> RentalAgreement.id; the single open invoice for the rental" }
      - { name: charges_total_cents, type: integer, source: computed, description: "Sum of LedgerEntry.amount_cents where kind==CHARGE on this invoice" }
      - { name: credits_total_cents, type: integer, source: computed, description: "Sum of LedgerEntry.amount_cents where kind==CREDIT on this invoice" }
      - { name: payments_total_cents, type: integer, source: computed, description: "Sum of Payment.amount_cents where status==CAPTURED on this invoice" }
      - { name: balance_cents, type: integer, source: computed, description: "charges_total_cents - credits_total_cents - payments_total_cents; may be negative (overpayment credit)" }
      - { name: status, type: enum, source: system, description: "OPEN | SETTLED | WRITTEN_OFF", constraints: "enum: OPEN, SETTLED, WRITTEN_OFF", default: "OPEN" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation including cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: LedgerEntry
    parent: Facility
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id; the invoice this entry posts to" }
      - { name: kind, type: enum, source: system, description: "CHARGE | CREDIT", constraints: "enum: CHARGE, CREDIT" }
      - { name: reason, type: enum, source: system, description: "RENTAL | OVERSIZE | OVERSTAY | FORWARDING | PRORATED_REFUND | WRITE_OFF", constraints: "enum: RENTAL, OVERSIZE, OVERSTAY, FORWARDING, PRORATED_REFUND, WRITE_OFF" }
      - { name: amount_cents, type: integer, source: system, description: "Always positive magnitude; sign carried by kind", constraints: ">= 0" }
      - { name: source_ref, type: string, source: system, description: "Id of the originating Package/ForwardingRequest/RentalAgreement, identity reference only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; append-only, never mutated" }

  - name: Payment
    parent: Facility
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id; the invoice being paid" }
      - { name: amount_cents, type: integer, source: input, description: "Amount to capture in cents", constraints: ">= 1" }
      - { name: method, type: enum, source: input, description: "CARD_AUTOPAY | CARD_MANUAL | CASH", constraints: "enum: CARD_AUTOPAY, CARD_MANUAL, CASH" }
      - { name: status, type: enum, source: system, description: "CAPTURED (payments are final in v1)", constraints: "enum: CAPTURED", default: "CAPTURED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Form1583
    field: status
    initial_state: DRAFT
    terminal_states: [VERIFIED]
    note: "Branching-with-revert: SUBMITTED forks to VERIFIED or REJECTED; REJECTED loops back to SUBMITTED via resubmit (cycle)."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /forms-1583/{id}/submit"
        actor: Customer
        preconditions:
          - "Form1583.status == DRAFT"
          - "At least one AuthorizedRecipient exists with form_1583_id == this form (else ERR_NO_RECIPIENTS)"
        side_effects:
          - "submission_count += 1"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /forms-1583/{id}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "Form1583.status == SUBMITTED"
        side_effects:
          - "Sets verified_at = Facility.current_utc"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /forms-1583/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "Form1583.status == SUBMITTED"
        side_effects:
          - "Sets rejection_reason from request body"
          - "RentalAgreement rows with this form_1583_id in PENDING_AUTH remain blocked from activation"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /forms-1583/{id}/submit"
        actor: Customer
        preconditions:
          - "Form1583.status == REJECTED"
          - "At least one AuthorizedRecipient exists with form_1583_id == this form"
        side_effects:
          - "submission_count += 1"
          - "Clears rejection_reason to null"

  - entity: RentalAgreement
    field: status
    initial_state: PENDING_AUTH
    terminal_states: [CLOSED, ABANDONED]
    note: "Cyclic: ACTIVE<->SUSPENDED on suspend/reactivate; renewal self-loop on ACTIVE extends term_end."
    transitions:
      - from: PENDING_AUTH
        to: ACTIVE
        trigger: "POST /rental-agreements/{id}/activate"
        actor: FacilityOperator
        preconditions:
          - "RentalAgreement.status == PENDING_AUTH"
          - "Cross-entity: Form1583(form_1583_id).status == VERIFIED (else ERR_AUTH_NOT_VERIFIED)"
          - "Cross-entity: Customer(customer_id).status == ACTIVE (else ERR_AUTH_NOT_VERIFIED)"
          - "Cross-entity: MailboxUnit(mailbox_unit_id).status == VACANT (else ERR_MAILBOX_OCCUPIED)"
        side_effects:
          - "MailboxUnit(mailbox_unit_id).status -> RENTED"
          - "Sets term_start = Facility.current_utc, term_end = term_start + term_months*30 days"
          - "Creates the single OPEN Invoice for this agreement and posts a RENTAL CHARGE LedgerEntry of amount monthly_fee_cents*term_months"
          - "If autopay_enabled: cascade auto-charge (calc autopay_capture) -> Payment captured, Invoice.balance_cents -> 0"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rental-agreements/{id}/suspend, or system sweep when Invoice.balance_cents > SUSPEND_BALANCE_THRESHOLD_CENTS via clock/advance"
        actor: "FacilityOperator or system"
        preconditions:
          - "RentalAgreement.status == ACTIVE"
        side_effects:
          - "Cascade (depth-2): every ForwardingRequest in status REQUESTED whose MailItem belongs to this agreement -> ON_HOLD"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rental-agreements/{id}/reactivate"
        actor: FacilityOperator
        preconditions:
          - "RentalAgreement.status == SUSPENDED"
          - "Invoice.balance_cents <= SUSPEND_BALANCE_THRESHOLD_CENTS (else ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "Cascade: every ForwardingRequest in status ON_HOLD whose MailItem belongs to this agreement -> REQUESTED"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /rental-agreements/{id}/renew"
        actor: Customer
        preconditions:
          - "RentalAgreement.status == ACTIVE"
          - "OCC: expected_rental_agreement_version equals current version (else ERR_STALE_VERSION)"
        side_effects:
          - "increments RentalAgreement.version by 1"
          - "renewal_count += 1"
          - "term_end += term_months*30 days"
          - "Posts a RENTAL CHARGE LedgerEntry of monthly_fee_cents*term_months to the OPEN Invoice"
          - "If autopay_enabled: cascade auto-charge (calc autopay_capture)"
      - from: [ACTIVE, SUSPENDED]
        to: CLOSED
        trigger: "POST /rental-agreements/{id}/close"
        actor: "Customer or FacilityOperator"
        preconditions:
          - "RentalAgreement.status IN {ACTIVE, SUSPENDED}"
          - "No Package on this agreement in status RECEIVED or NOTIFIED (else ERR_UNRESOLVED_PACKAGES)"
        side_effects:
          - "MailboxUnit(mailbox_unit_id).status -> VACANT"
          - "Posts a PRORATED_REFUND CREDIT LedgerEntry per calc prorated_refund (chronological variant) to the OPEN Invoice"
          - "Cascade: every MailItem in status STORED on this agreement -> SHREDDED; every ForwardingRequest in status REQUESTED/ON_HOLD on those items -> CANCELLED"
          - "Invoice.status -> SETTLED if balance_cents <= 0 else stays OPEN"
      - from: [PENDING_AUTH, ACTIVE, SUSPENDED]
        to: ABANDONED
        trigger: "system clock sweep via POST /facilities/{id}/clock/advance: current_utc >= term_end + ABANDONMENT_GRACE_DAYS days AND Invoice.balance_cents > 0"
        actor: system
        preconditions:
          - "RentalAgreement.status IN {PENDING_AUTH, ACTIVE, SUSPENDED}"
          - "term_end non-null and Facility.current_utc >= term_end + ABANDONMENT_GRACE_DAYS days"
          - "Invoice.balance_cents > 0"
        side_effects:
          - "MailboxUnit(mailbox_unit_id).status -> VACANT"
          - "Cascade: every Package on this agreement in RECEIVED/NOTIFIED -> ABANDONED (releasing its LockerUnit, see Package machine)"
          - "Cascade: every MailItem in STORED -> SHREDDED"
          - "Posts a WRITE_OFF CREDIT LedgerEntry equal to remaining Invoice.balance_cents; Invoice.status -> WRITTEN_OFF"

  - entity: Package
    field: status
    initial_state: RECEIVED
    terminal_states: [PICKED_UP, FORWARDED, RETURNED, ABANDONED]
    note: "Branching fork-join: NOTIFIED forks to PICKED_UP / FORWARDED / RETURNED / ABANDONED with divergent side-effect sets; every branch releases the locker."
    transitions:
      - from: RECEIVED
        to: NOTIFIED
        trigger: "POST /packages/{id}/notify"
        actor: FacilityOperator
        preconditions:
          - "Package.status == RECEIVED"
        side_effects:
          - "Sets notified_at = Facility.current_utc"
          - "increments Package.version by 1"
          - "Recomputes provisional overstay_fee_cents (0 at notify since stored_days==0)"
      - from: NOTIFIED
        to: PICKED_UP
        trigger: "POST /packages/{id}/pickup"
        actor: FacilityOperator
        preconditions:
          - "Package.status == NOTIFIED"
          - "OCC: expected_package_version equals current version (else ERR_STALE_VERSION)"
          - "Request pickup_code == Package.pickup_code (else ERR_PICKUP_CODE_MISMATCH)"
          - "Cross-entity: RentalAgreement(rental_agreement_id).status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "increments Package.version by 1"
          - "Finalizes overstay_fee_cents per calc overstay_fee (final variant) using resolved_at"
          - "Sets resolved_at = Facility.current_utc"
          - "Depth-3 cascade: posts OVERSTAY CHARGE (if overstay_fee_cents>0) and OVERSIZE CHARGE (if oversize_fee_cents>0) to the agreement Invoice -> balance rises -> autopay capture if enabled"
          - "Releases locker: LockerUnit(locker_unit_id).status -> AVAILABLE, current_package_id -> null; clears Package.locker_unit_id"
      - from: NOTIFIED
        to: FORWARDED
        trigger: "POST /packages/{id}/forward"
        actor: "Customer or FacilityOperator"
        preconditions:
          - "Package.status == NOTIFIED"
          - "Cross-entity: RentalAgreement(rental_agreement_id).status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "Finalizes overstay_fee_cents per calc overstay_fee (final variant)"
          - "Sets resolved_at = Facility.current_utc"
          - "Posts OVERSTAY/OVERSIZE CHARGE LedgerEntries plus a FORWARDING CHARGE of PACKAGE_FORWARD_FEE_CENTS; autopay capture if enabled"
          - "Releases locker (status -> AVAILABLE, current_package_id -> null)"
      - from: [RECEIVED, NOTIFIED]
        to: RETURNED
        trigger: "POST /packages/{id}/return-to-sender"
        actor: FacilityOperator
        preconditions:
          - "Package.status IN {RECEIVED, NOTIFIED}"
        side_effects:
          - "Sets resolved_at = Facility.current_utc"
          - "No overstay/oversize charges posted (carrier reclaims); releases locker (status -> AVAILABLE)"
      - from: [RECEIVED, NOTIFIED]
        to: ABANDONED
        trigger: "system clock sweep via POST /facilities/{id}/clock/advance (current_utc >= notified_at + PACKAGE_ABANDON_DAYS days), or cascade from RentalAgreement ABANDONED"
        actor: system
        preconditions:
          - "Package.status IN {RECEIVED, NOTIFIED}"
        side_effects:
          - "Finalizes overstay_fee_cents (final variant) and posts OVERSTAY/OVERSIZE CHARGE LedgerEntries"
          - "Sets resolved_at = Facility.current_utc"
          - "Releases locker (status -> AVAILABLE, current_package_id -> null)"

  - entity: ForwardingRequest
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Linear-with-hold: REQUESTED<->ON_HOLD driven by parent rental suspend/reactivate; COMPLETED/CANCELLED terminal."
    transitions:
      - from: REQUESTED
        to: COMPLETED
        trigger: "POST /forwarding-requests/{id}/complete"
        actor: FacilityOperator
        preconditions:
          - "ForwardingRequest.status == REQUESTED"
          - "Cross-entity: RentalAgreement of the request's MailItem is ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "MailItem.status -> FORWARDED (if kind==FORWARD) or SCANNED (if kind==SCAN)"
          - "Posts a FORWARDING CHARGE LedgerEntry of fee_cents to the agreement Invoice; autopay capture if enabled"
      - from: REQUESTED
        to: ON_HOLD
        trigger: "system cascade from RentalAgreement ACTIVE->SUSPENDED"
        actor: system
        preconditions:
          - "ForwardingRequest.status == REQUESTED"
        side_effects: []
      - from: ON_HOLD
        to: REQUESTED
        trigger: "system cascade from RentalAgreement SUSPENDED->ACTIVE"
        actor: system
        preconditions:
          - "ForwardingRequest.status == ON_HOLD"
        side_effects: []
      - from: [REQUESTED, ON_HOLD]
        to: CANCELLED
        trigger: "POST /forwarding-requests/{id}/cancel, or cascade from RentalAgreement CLOSED"
        actor: "Customer or system"
        preconditions:
          - "ForwardingRequest.status IN {REQUESTED, ON_HOLD}"
        side_effects: []

  - entity: MailboxUnit
    field: status
    initial_state: VACANT
    terminal_states: []
    note: "Driven by RentalAgreement activation/close/abandon; OUT_OF_SERVICE set/cleared by operator."
    transitions:
      - from: VACANT
        to: RENTED
        trigger: "system (RentalAgreement PENDING_AUTH->ACTIVE)"
        actor: system
        preconditions:
          - "MailboxUnit.status == VACANT"
        side_effects: []
      - from: RENTED
        to: VACANT
        trigger: "system (RentalAgreement -> CLOSED or ABANDONED)"
        actor: system
        preconditions:
          - "MailboxUnit.status == RENTED"
        side_effects: []
      - from: VACANT
        to: OUT_OF_SERVICE
        trigger: "POST /mailbox-units/{id}/out-of-service"
        actor: FacilityOperator
        preconditions:
          - "MailboxUnit.status == VACANT (else ERR_MAILBOX_NOT_VACANT)"
        side_effects: []
      - from: OUT_OF_SERVICE
        to: VACANT
        trigger: "POST /mailbox-units/{id}/restore"
        actor: FacilityOperator
        preconditions:
          - "MailboxUnit.status == OUT_OF_SERVICE (else ERR_MAILBOX_NOT_VACANT)"
        side_effects: []

  - entity: LockerUnit
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    note: "Occupied by exactly one Package at a time; released by every terminal Package transition."
    transitions:
      - from: AVAILABLE
        to: OCCUPIED
        trigger: "system (Package received and assigned to this locker via POST /packages)"
        actor: system
        preconditions:
          - "LockerUnit.status == AVAILABLE"
        side_effects:
          - "Sets current_package_id to the new package; Facility.available_locker_count -= 1"
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "system (assigned Package reaches PICKED_UP/FORWARDED/RETURNED/ABANDONED)"
        actor: system
        preconditions:
          - "LockerUnit.status == OCCUPIED"
        side_effects:
          - "Clears current_package_id; Facility.available_locker_count += 1"
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /locker-units/{id}/out-of-service"
        actor: FacilityOperator
        preconditions:
          - "LockerUnit.status == AVAILABLE (else ERR_INVALID_STATE)"
        side_effects:
          - "Facility.available_locker_count -= 1"
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /locker-units/{id}/restore"
        actor: FacilityOperator
        preconditions:
          - "LockerUnit.status == OUT_OF_SERVICE (else ERR_INVALID_STATE)"
        side_effects:
          - "Facility.available_locker_count += 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version — true CREATE-with-supersede)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: renew-stale-agreement
    parent_entity: RentalAgreement
    write_endpoint: "POST /rental-agreements/{id}/renew"
    occ_field: "expected_rental_agreement_version"
    description: |
      Renewing a RentalAgreement whose version has advanced since the client last
      observed it is rejected with a stale-version error. A prior renewal (which
      legitimately extends term_end again and posts another RENTAL charge) advances
      the agreement version; a renewal still carrying the pre-advance version is
      stale because it would double-extend the term off a superseded view.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: pickup-stale-package
    parent_entity: Package
    write_endpoint: "POST /packages/{id}/pickup"
    occ_field: "expected_package_version"
    description: |
      Picking up a Package whose version has advanced since the client last
      observed it is rejected with a stale-version error. A notify
      (RECEIVED->NOTIFIED) or a clock-driven provisional overstay recompute
      advances the package version; a pickup carrying the pre-advance version is
      operating on a superseded view of the package's fee/state and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: oversize_fee
    trigger: "Package receipt (POST /packages); pinned once into Package.oversize_fee_cents"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (a): >=3 inputs (longest_dim_cm, weight_g, assigned
      # LockerUnit.size_tier), nested max/ceil, tier-keyed thresholds, and a cap.
      tier_max_dim_cm  = TIER_MAX_DIM[locker.size_tier]
      tier_max_wt_g    = TIER_MAX_WEIGHT[locker.size_tier]
      dim_over_units   = max(0, ceil((longest_dim_cm - tier_max_dim_cm) / DIM_BUCKET_CM))
      wt_over_units    = max(0, ceil((weight_g       - tier_max_wt_g)   / WT_BUCKET_G))
      raw_fee          = dim_over_units * OVERSIZE_DIM_RATE_CENTS
                       + wt_over_units  * OVERSIZE_WT_RATE_CENTS
      oversize_fee_cents = min(raw_fee, OVERSIZE_FEE_CAP_CENTS)
    input_set: "Single Package and its assigned LockerUnit.size_tier at receipt"
    constants:
      TIER_MAX_DIM: { SMALL: 30, MEDIUM: 50, LARGE: 80, XL: 120 }            # cm
      TIER_MAX_WEIGHT: { SMALL: 2000, MEDIUM: 5000, LARGE: 15000, XL: 40000 } # grams
      DIM_BUCKET_CM: 10
      WT_BUCKET_G: 1000
      OVERSIZE_DIM_RATE_CENTS: 150
      OVERSIZE_WT_RATE_CENTS: 80
      OVERSIZE_FEE_CAP_CENTS: 2000
    precision: "integer cents; ceil on bucket counts; min-cap applied last"

  - name: overstay_fee
    trigger: "Provisional on POST /packages/{id}/notify and each clock/advance; FINAL on PICKED_UP/FORWARDED/ABANDONED"
    algorithm: threshold
    formula: |
      # Calendar-day overstay measured in the Facility time_zone.
      anchor_date   = date_of(notified_at, facility.time_zone)
      as_of_date    = date_of(reference_clock, facility.time_zone)
      stored_days   = (as_of_date - anchor_date)              # whole calendar days, >= 0
      overstay_days = max(0, stored_days - GRACE_DAYS)         # boundary: charge only when stored_days >= GRACE_DAYS+1
      daily_rate    = OVERSTAY_DAILY_RATE_CENTS[locker.size_tier]
      overstay_fee_cents = overstay_days * daily_rate
    input_set: "Single NOTIFIED Package; reference_clock = Facility.current_utc (provisional) or resolved_at (final)"
    constants:
      GRACE_DAYS: 2
      OVERSTAY_DAILY_RATE_CENTS: { SMALL: 200, MEDIUM: 300, LARGE: 500, XL: 800 }
    precision: "integer cents; calendar-day difference floored to whole days"
    variants:
      - name: provisional
        when: "Computed at NOTIFIED and on each clock/advance using Facility.current_utc; written to overstay_fee_cents but not posted to the ledger"
        difference: "Uses live Facility.current_utc as as_of_date; recomputed and may grow as the clock advances"
      - name: final
        when: "Computed at the terminal transition (PICKED_UP/FORWARDED/ABANDONED) using resolved_at"
        difference: "Frozen at resolved_at; this is the amount posted as the OVERSTAY CHARGE LedgerEntry"

  - name: prorated_refund
    trigger: "RentalAgreement close (POST /rental-agreements/{id}/close); chronological variant pinned as PRORATED_REFUND CREDIT LedgerEntry. forward_looking variant quoted by GET /rental-agreements/{id}/refund-quote"
    algorithm: forward_looking
    formula: |
      term_days   = term_months * DAYS_PER_MONTH
      paid_cents  = monthly_fee_cents * term_months                # RENTAL charge for the current (latest) term only
      used_days   = clamp(whole_calendar_days(close_utc - term_start, facility.time_zone), 0, term_days)
      # Two valid readings of "refund the unused portion" — divergent results:
      chronological_refund   = round_half_up(paid_cents * (term_days - used_days) / term_days)
      forward_looking_refund = monthly_fee_cents * max(0, term_months - ceil(used_days / DAYS_PER_MONTH))
      # PINNED: the CLOSE side-effect posts the CHRONOLOGICAL variant.
      refund_cents = chronological_refund
    input_set: "The single RentalAgreement being closed; only the latest term's RENTAL charge is refundable"
    constants:
      DAYS_PER_MONTH: 30
    precision: "compute division before rounding; round_half_up to integer cents"
    variants:
      - name: chronological
        when: "PINNED variant posted by the CLOSE transition"
        difference: "Linear daily proration paid*(term_days-used_days)/term_days, single round at the end"
      - name: forward_looking
        when: "Quoted by GET /rental-agreements/{id}/refund-quote for what-if; NOT posted"
        difference: "Refunds only whole unused months (ceil used_days to months); partial months non-refundable; diverges from chronological"

  - name: invoice_balance
    trigger: "Any LedgerEntry post or Payment capture on the invoice"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (b): nested rounding ORDER pinned to round-per-line-then-sum.
      # Each LedgerEntry.amount_cents is ALREADY an integer-cent line item (rounded at
      # creation per its own calc). Balance sums the integer line items directly; we
      # never re-round a running dollar subtotal.
      charges_total_cents  = sum(e.amount_cents for e in LedgerEntry where invoice_id==I.id and kind==CHARGE)
      credits_total_cents  = sum(e.amount_cents for e in LedgerEntry where invoice_id==I.id and kind==CREDIT)
      payments_total_cents = sum(p.amount_cents for p in Payment    where invoice_id==I.id and status==CAPTURED)
      balance_cents = charges_total_cents - credits_total_cents - payments_total_cents
    input_set: "All LedgerEntry rows on the invoice plus all CAPTURED Payment rows"
    precision: "integer cents; line items pre-rounded, summed without re-rounding (round-per-line-then-sum)"

  - name: autopay_capture
    trigger: "After any CHARGE LedgerEntry posts when the agreement's autopay_enabled is true (activation, renewal, pickup, forward, forwarding-complete charges)"
    algorithm: aggregation
    formula: |
      # Depth-3 cascade tail: charge posts -> invoice balance recomputed -> if autopay
      # and balance_cents > 0, capture a Payment for exactly the positive balance.
      if rental_agreement.autopay_enabled and invoice.balance_cents > 0:
          create Payment { invoice_id, amount_cents = invoice.balance_cents,
                           method = CARD_AUTOPAY, status = CAPTURED }
          # invoice_balance recomputes to 0 after capture
    input_set: "The agreement's single OPEN Invoice immediately after a charge"
    constants:
      SUSPEND_BALANCE_THRESHOLD_CENTS: 5000   # ACTIVE->SUSPENDED sweep / reactivate gate
      ABANDONMENT_GRACE_DAYS: 30               # agreement abandonment after term_end
      PACKAGE_ABANDON_DAYS: 14                 # package abandonment after notified_at
    precision: "integer cents; captures exactly the outstanding positive balance"

  - name: forwarding_fee
    trigger: "ForwardingRequest creation (POST /forwarding-requests); pinned into ForwardingRequest.fee_cents"
    algorithm: threshold
    formula: |
      fee_cents = FORWARD_FEE_CENTS if kind == FORWARD else SCAN_FEE_CENTS
    input_set: "Single ForwardingRequest at creation"
    constants:
      FORWARD_FEE_CENTS: 600
      SCAN_FEE_CENTS: 150
      PACKAGE_FORWARD_FEE_CENTS: 1200   # package forward fee posted by Package FORWARDED
    precision: "integer cents flat fee"

  - name: facility_locker_counts
    trigger: "LockerUnit create, status change (occupy/release/out-of-service/restore)"
    algorithm: aggregation
    formula: |
      total_locker_count     = count(LockerUnit where facility_id==F.id)
      available_locker_count = count(LockerUnit where facility_id==F.id and status==AVAILABLE)
    input_set: "All LockerUnit rows under the facility"
    precision: "integer counts; available never below 0"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7; entity_backed Customer must own the targeted resource (X-User-ID resolves to the resource's customer_id chain)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path id resolves and every FK in the body references an existing row"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers >= declared minima, FORWARD kind supplies destination_address"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST/PUT/PATCH"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version on guarded writes (renew, pickup)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rental-agreements/{id}/renew, POST /packages/{id}/pickup"

  - priority: 7
    category: business_referential
    check: "Cross-entity activation gate: Form1583 VERIFIED and Customer ACTIVE required to activate; package receipt requires its RentalAgreement ACTIVE"
    error_id: ERR_AUTH_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /rental-agreements/{id}/activate, POST /packages"

  - priority: 8
    category: business_referential
    check: "Package pickup requires the supplied pickup_code to equal Package.pickup_code"
    error_id: ERR_PICKUP_CODE_MISMATCH
    http_status: 409
    applies_to: "POST /packages/{id}/pickup"

  - priority: 9
    category: business_temporal
    check: "MailboxUnit term-overlap: a MailboxUnit may back exactly one non-terminal RentalAgreement; activating over a mailbox that is RENTED/OUT_OF_SERVICE (its [term_start, term_end) closed-open interval still occupied) is rejected"
    error_id: ERR_MAILBOX_OCCUPIED
    http_status: 409
    applies_to: "POST /rental-agreements/{id}/activate"

  - priority: 10
    category: business_constraint
    check: "LockerUnit exclusive occupancy: package receipt needs a free LockerUnit of the requested size_tier; an OCCUPIED/OUT_OF_SERVICE locker cannot take a second package (point occupancy, zero-overlap)"
    error_id: ERR_NO_LOCKER_AVAILABLE
    http_status: 409
    applies_to: "POST /packages"

  - priority: 11
    category: business_constraint
    check: "Close blocked while any Package on the agreement is RECEIVED or NOTIFIED (unresolved)"
    error_id: ERR_UNRESOLVED_PACKAGES
    http_status: 409
    applies_to: "POST /rental-agreements/{id}/close"

  - priority: 12
    category: business_constraint
    check: "Active-required gating: forwarding completion / package forward require the agreement ACTIVE; reactivate requires balance at/below threshold"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /forwarding-requests/{id}/complete, POST /packages/{id}/forward, POST /rental-agreements/{id}/reactivate"

  - priority: 13
    category: business_constraint
    check: "Uniqueness within facility: LockerUnit.label, MailboxUnit.box_number, Customer.email"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /locker-units, POST /mailbox-units, POST /customers"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Facility ---
  - method: POST
    path: "/facilities"
    description: "Create a facility"
    roles: [FacilityOperator]
    code: 201
    input: [name, "time_zone?"]
    output: Facility
    side_effects: ["current_utc=1970-01-01T00:00:00.000Z, counters=0, version=1"]

  - method: GET
    path: "/facilities/{id}"
    description: "Get facility with computed locker counts"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: POST
    path: "/facilities/{id}/clock/advance"
    description: "Advance the facility logical clock; runs overstay/abandonment/suspension sweeps"
    roles: [FacilityOperator]
    code: 200
    input: [to_iso8601]
    output: Facility
    side_effects:
      - "Sets current_utc=to_iso8601 (must be >= prior, else ERR_INVALID_CLOCK)"
      - "Sweep: RECEIVED/NOTIFIED Packages past notified_at+PACKAGE_ABANDON_DAYS -> ABANDONED (locker released, fees finalized)"
      - "Sweep: ACTIVE agreements with Invoice.balance_cents>SUSPEND_BALANCE_THRESHOLD_CENTS -> SUSPENDED (forwarding ON_HOLD cascade)"
      - "Sweep: agreements past term_end+ABANDONMENT_GRACE_DAYS with balance>0 -> ABANDONED (cascade)"
      - "Recomputes provisional overstay_fee_cents on all NOTIFIED packages"

  # --- LockerUnit ---
  - method: POST
    path: "/locker-units"
    description: "Create a locker"
    roles: [FacilityOperator]
    code: 201
    input: [facility_id, label, size_tier]
    output: LockerUnit
    side_effects: ["status=AVAILABLE", "Facility locker counts recomputed"]

  - method: GET
    path: "/locker-units/{id}"
    description: "Get a locker"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: LockerUnit
    side_effects: []

  - method: GET
    path: "/locker-units"
    description: "List/filter lockers"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: ["facility_id?", "status?", "size_tier?", "current_package_id?", "limit?", "offset?"]
    output: LockerUnit[]
    side_effects: []

  - method: POST
    path: "/locker-units/{id}/out-of-service"
    description: "Take an AVAILABLE locker out of service"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: LockerUnit
    side_effects: ["status->OUT_OF_SERVICE", "available_locker_count -= 1"]

  - method: POST
    path: "/locker-units/{id}/restore"
    description: "Restore an out-of-service locker to AVAILABLE"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: LockerUnit
    side_effects: ["status->AVAILABLE", "available_locker_count += 1"]

  # --- MailboxUnit ---
  - method: POST
    path: "/mailbox-units"
    description: "Create a mailbox/PO box"
    roles: [FacilityOperator]
    code: 201
    input: [facility_id, box_number, size_tier, monthly_fee_cents]
    output: MailboxUnit
    side_effects: ["status=VACANT"]

  - method: GET
    path: "/mailbox-units/{id}"
    description: "Get a mailbox"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: MailboxUnit
    side_effects: []

  - method: GET
    path: "/mailbox-units"
    description: "List/filter mailboxes"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: ["facility_id?", "status?", "size_tier?", "limit?", "offset?"]
    output: MailboxUnit[]
    side_effects: []

  - method: POST
    path: "/mailbox-units/{id}/out-of-service"
    description: "Take a VACANT mailbox out of service"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: MailboxUnit
    side_effects: ["status->OUT_OF_SERVICE"]

  - method: POST
    path: "/mailbox-units/{id}/restore"
    description: "Restore an out-of-service mailbox to VACANT"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: MailboxUnit
    side_effects: ["status->VACANT"]

  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [FacilityOperator, Customer]
    code: 201
    input: [facility_id, full_name, email, phone]
    output: Customer
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/customers/{id}"
    description: "Get a customer"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers"
    description: "List/filter customers"
    roles: [FacilityOperator, ComplianceOfficer]
    code: 200
    input: ["facility_id?", "status?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: POST
    path: "/customers/{id}/suspend"
    description: "Suspend a customer (compliance/fraud hold)"
    roles: [FacilityOperator, ComplianceOfficer]
    code: 200
    input: []
    output: Customer
    side_effects: ["status->SUSPENDED"]

  # --- Form1583 + AuthorizedRecipient ---
  - method: POST
    path: "/forms-1583"
    description: "Create a draft Form 1583 for a customer"
    roles: [FacilityOperator, Customer]
    code: 201
    input: [facility_id, customer_id, primary_id_type, address_proof_type]
    output: Form1583
    side_effects: ["status=DRAFT, submission_count=0"]

  - method: GET
    path: "/forms-1583/{id}"
    description: "Get a Form 1583"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: Form1583
    side_effects: []

  - method: GET
    path: "/forms-1583"
    description: "List/filter Form 1583 by customer or status"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: ["facility_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: Form1583[]
    side_effects: []

  - method: POST
    path: "/forms-1583/{id}/recipients"
    description: "Add an authorized recipient to a Form 1583"
    roles: [FacilityOperator, Customer]
    code: 201
    input: [recipient_name, relationship]
    output: AuthorizedRecipient
    side_effects: []

  - method: GET
    path: "/forms-1583/{id}/recipients"
    description: "List authorized recipients on a Form 1583"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: AuthorizedRecipient[]
    side_effects: []

  - method: POST
    path: "/forms-1583/{id}/submit"
    description: "Submit (or resubmit) a Form 1583 for verification"
    roles: [Customer, FacilityOperator]
    code: 200
    input: []
    output: Form1583
    side_effects: ["status DRAFT/REJECTED -> SUBMITTED, submission_count += 1, clears rejection_reason"]

  - method: POST
    path: "/forms-1583/{id}/verify"
    description: "Verify a submitted Form 1583"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Form1583
    side_effects: ["status->VERIFIED, verified_at set"]

  - method: POST
    path: "/forms-1583/{id}/reject"
    description: "Reject a submitted Form 1583"
    roles: [ComplianceOfficer]
    code: 200
    input: [rejection_reason]
    output: Form1583
    side_effects: ["status->REJECTED, rejection_reason set"]

  # --- RentalAgreement ---
  - method: POST
    path: "/rental-agreements"
    description: "Create a PENDING_AUTH rental agreement"
    roles: [FacilityOperator, Customer]
    code: 201
    input: [facility_id, customer_id, mailbox_unit_id, form_1583_id, term_months, "autopay_enabled?"]
    output: RentalAgreement
    side_effects: ["status=PENDING_AUTH", "monthly_fee_cents snapshotted from mailbox"]

  - method: GET
    path: "/rental-agreements/{id}"
    description: "Get a rental agreement"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: []

  - method: GET
    path: "/rental-agreements"
    description: "List/filter rental agreements by customer, mailbox, form, or status"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: ["facility_id?", "customer_id?", "mailbox_unit_id?", "form_1583_id?", "status?", "limit?", "offset?"]
    output: RentalAgreement[]
    side_effects: []

  - method: GET
    path: "/rental-agreements/{id}/refund-quote"
    description: "What-if prorated-refund quote, both variants (no state change)"
    roles: [FacilityOperator, Customer]
    code: 200
    input: ["basis?"]
    output: "{ chronological_refund_cents: integer, forward_looking_refund_cents: integer }"
    side_effects: []

  - method: POST
    path: "/rental-agreements/{id}/activate"
    description: "Activate agreement (requires VERIFIED form, ACTIVE customer, VACANT mailbox)"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: RentalAgreement
    side_effects:
      - "status->ACTIVE, mailbox->RENTED, term_start/term_end set"
      - "Creates OPEN Invoice + RENTAL CHARGE; autopay capture if enabled"

  - method: POST
    path: "/rental-agreements/{id}/renew"
    description: "Renew an ACTIVE agreement (OCC-guarded)"
    roles: [Customer, FacilityOperator]
    code: 200
    input: [expected_rental_agreement_version]
    output: RentalAgreement
    side_effects:
      - "increments RentalAgreement.version by 1"
      - "renewal_count += 1, term_end extended"
      - "RENTAL CHARGE posted; autopay capture if enabled"

  - method: POST
    path: "/rental-agreements/{id}/suspend"
    description: "Suspend an ACTIVE agreement"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["status->SUSPENDED", "REQUESTED forwarding -> ON_HOLD"]

  - method: POST
    path: "/rental-agreements/{id}/reactivate"
    description: "Reactivate a SUSPENDED agreement (balance must be at/below threshold)"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: ["status->ACTIVE", "ON_HOLD forwarding -> REQUESTED"]

  - method: POST
    path: "/rental-agreements/{id}/close"
    description: "Close an agreement (prorated refund, cascade)"
    roles: [Customer, FacilityOperator]
    code: 200
    input: []
    output: RentalAgreement
    side_effects:
      - "status->CLOSED, mailbox->VACANT"
      - "PRORATED_REFUND CREDIT posted (chronological); STORED mail -> SHREDDED; forwarding -> CANCELLED"

  # --- Package ---
  - method: POST
    path: "/packages"
    description: "Receive a package against an ACTIVE rental; auto-assigns a free locker of size_tier and pins oversize fee"
    roles: [FacilityOperator]
    code: 201
    input: [facility_id, rental_agreement_id, carrier, size_tier, longest_dim_cm, weight_g]
    output: Package
    side_effects:
      - "status=RECEIVED, pickup_code minted, free locker of size_tier assigned (locker->OCCUPIED), oversize_fee_cents pinned"

  - method: GET
    path: "/packages/{id}"
    description: "Get a package"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: Package
    side_effects: []

  - method: GET
    path: "/packages"
    description: "List/filter packages by rental, locker, or status"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: ["facility_id?", "rental_agreement_id?", "locker_unit_id?", "status?", "limit?", "offset?"]
    output: Package[]
    side_effects: []

  - method: POST
    path: "/packages/{id}/notify"
    description: "Notify recipient a package is ready"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: Package
    side_effects: ["status->NOTIFIED, notified_at set, version += 1"]

  - method: POST
    path: "/packages/{id}/pickup"
    description: "Pick up a package with hold/pickup code (OCC-guarded)"
    roles: [FacilityOperator]
    code: 200
    input: [pickup_code, expected_package_version]
    output: Package
    side_effects:
      - "increments Package.version by 1"
      - "status->PICKED_UP, overstay finalized, OVERSTAY/OVERSIZE charges posted, autopay capture if enabled, locker released"

  - method: POST
    path: "/packages/{id}/forward"
    description: "Forward a package to a forwarding address"
    roles: [Customer, FacilityOperator]
    code: 200
    input: [destination_address]
    output: Package
    side_effects:
      - "status->FORWARDED, overstay finalized, OVERSTAY/OVERSIZE + FORWARDING(PACKAGE_FORWARD_FEE_CENTS) charges posted, autopay capture if enabled, locker released"

  - method: POST
    path: "/packages/{id}/return-to-sender"
    description: "Return a package to the carrier"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: Package
    side_effects: ["status->RETURNED, no fees, locker released"]

  # --- MailItem ---
  - method: POST
    path: "/mail-items"
    description: "Record letter mail received in a rental's mailbox"
    roles: [FacilityOperator]
    code: 201
    input: [facility_id, rental_agreement_id, mail_class]
    output: MailItem
    side_effects: ["status=STORED"]

  - method: GET
    path: "/mail-items/{id}"
    description: "Get a mail item"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: MailItem
    side_effects: []

  - method: GET
    path: "/mail-items"
    description: "List/filter mail items by rental or status"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: ["facility_id?", "rental_agreement_id?", "status?", "limit?", "offset?"]
    output: MailItem[]
    side_effects: []

  # --- ForwardingRequest ---
  - method: POST
    path: "/forwarding-requests"
    description: "Request forwarding or scanning of a stored mail item"
    roles: [Customer, FacilityOperator]
    code: 201
    input: [mail_item_id, kind, "destination_address?"]
    output: ForwardingRequest
    side_effects: ["status=REQUESTED, fee_cents pinned per forwarding_fee"]

  - method: GET
    path: "/forwarding-requests/{id}"
    description: "Get a forwarding request"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: ForwardingRequest
    side_effects: []

  - method: GET
    path: "/forwarding-requests"
    description: "List/filter forwarding requests by mail item or status"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: ["facility_id?", "mail_item_id?", "status?", "limit?", "offset?"]
    output: ForwardingRequest[]
    side_effects: []

  - method: POST
    path: "/forwarding-requests/{id}/complete"
    description: "Complete a forwarding/scan request (agreement must be ACTIVE)"
    roles: [FacilityOperator]
    code: 200
    input: []
    output: ForwardingRequest
    side_effects: ["status->COMPLETED, mail item -> FORWARDED/SCANNED, FORWARDING CHARGE posted"]

  - method: POST
    path: "/forwarding-requests/{id}/cancel"
    description: "Cancel a forwarding/scan request"
    roles: [Customer, FacilityOperator]
    code: 200
    input: []
    output: ForwardingRequest
    side_effects: ["status->CANCELLED"]

  # --- Invoice / LedgerEntry / Payment ---
  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice with computed totals/balance"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/invoices"
    description: "List/filter invoices by rental agreement or status"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: ["facility_id?", "rental_agreement_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/invoices/{id}/ledger-entries"
    description: "List ledger entries on an invoice"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: LedgerEntry[]
    side_effects: []

  - method: POST
    path: "/payments"
    description: "Capture a manual payment against an invoice"
    roles: [FacilityOperator, Customer]
    code: 201
    input: [invoice_id, amount_cents, method]
    output: Payment
    side_effects: ["status=CAPTURED, invoice balance recomputed, Invoice.status->SETTLED if balance<=0"]

  - method: GET
    path: "/payments/{id}"
    description: "Get a payment"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/payments"
    description: "List/filter payments by invoice"
    roles: [FacilityOperator, ComplianceOfficer, Customer]
    code: 200
    input: ["invoice_id?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers, or unknown role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for the operation, or Customer acting on a resource it does not own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id or referenced FK does not resolve to an existing row"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Malformed body: missing required field, bad enum, integer below minimum, or FORWARD kind without destination_address"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a state from which the requested transition is defined"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_<parent>_version does not match the parent's current version"
  - id: ERR_AUTH_NOT_VERIFIED
    http: 409
    condition: "Activation blocked: Form 1583 not VERIFIED or Customer not ACTIVE; or package receipt against a non-ACTIVE agreement"
  - id: ERR_PICKUP_CODE_MISMATCH
    http: 409
    condition: "Supplied pickup_code does not equal the package's pickup_code"
  - id: ERR_MAILBOX_OCCUPIED
    http: 409
    condition: "Mailbox already backs a non-terminal rental over an overlapping term interval, or is OUT_OF_SERVICE"
  - id: ERR_NO_LOCKER_AVAILABLE
    http: 409
    condition: "No AVAILABLE locker of the requested size_tier exists for package receipt"
  - id: ERR_UNRESOLVED_PACKAGES
    http: 409
    condition: "Close blocked while a Package on the agreement is RECEIVED or NOTIFIED"
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "Operation requires the rental agreement ACTIVE (forwarding complete / package forward / reactivate balance gate)"
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness violation: locker label, mailbox box_number, or customer email already exists in facility"
  - id: ERR_NO_RECIPIENTS
    http: 409
    condition: "Form 1583 submit blocked: no AuthorizedRecipient listed on the form"
  - id: ERR_INVALID_CLOCK
    http: 422
    condition: "clock/advance to_iso8601 is earlier than the facility's current_utc (clock only moves forward)"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 409
    condition: "Manual payment amount_cents exceeds the invoice's positive outstanding balance_cents"
  - id: ERR_MAILBOX_NOT_VACANT
    http: 409
    condition: "Mailbox out-of-service requested while RENTED, or restore requested while not OUT_OF_SERVICE"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FacilityOperator
    description: "Front-desk/back-office staff: owns facility, inventory, package receiving/sweeps, billing capture"
    identity: "opaque"
    exclusive_operations:
      - "POST /facilities — create facility"
      - "POST /facilities/{id}/clock/advance — advance clock / run sweeps"
      - "POST /locker-units — create locker"
      - "POST /locker-units/{id}/out-of-service — take locker OOS"
      - "POST /locker-units/{id}/restore — restore locker"
      - "POST /mailbox-units — create mailbox"
      - "POST /mailbox-units/{id}/out-of-service — take mailbox OOS"
      - "POST /mailbox-units/{id}/restore — restore mailbox"
      - "POST /rental-agreements/{id}/activate — activate agreement"
      - "POST /rental-agreements/{id}/suspend — suspend agreement"
      - "POST /rental-agreements/{id}/reactivate — reactivate agreement"
      - "POST /packages — receive package"
      - "POST /packages/{id}/notify — notify recipient"
      - "POST /packages/{id}/pickup — pick up package"
      - "POST /packages/{id}/return-to-sender — return package"
      - "POST /mail-items — record mail"
      - "POST /forwarding-requests/{id}/complete — complete forwarding"
    shared_operations:
      - "POST /customers — register customer (shared with Customer)"
      - "POST /forms-1583 (+/recipients, +/submit) — shared with Customer"
      - "POST /rental-agreements — create agreement (shared with Customer)"
      - "POST /rental-agreements/{id}/renew — renew (shared with Customer)"
      - "POST /rental-agreements/{id}/close — close (shared with Customer)"
      - "POST /packages/{id}/forward — forward package (shared with Customer)"
      - "POST /forwarding-requests (+/cancel) — shared with Customer"
      - "POST /payments — capture payment (shared with Customer)"
      - "POST /customers/{id}/suspend — suspend customer (shared with ComplianceOfficer)"
      - "All GET reads"

  - name: Customer
    description: "The renter; acts on own rentals, forms, packages, mail, forwarding, payments"
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /customers — self-register"
      - "POST /forms-1583 (+/recipients, +/submit) — own forms"
      - "POST /rental-agreements — create own agreement"
      - "POST /rental-agreements/{id}/renew — renew own (OCC)"
      - "POST /rental-agreements/{id}/close — close own"
      - "POST /packages/{id}/forward — forward own package"
      - "POST /forwarding-requests (+/cancel) — own mail"
      - "POST /payments — pay own invoice"
      - "GET reads scoped to own resources"

  - name: ComplianceOfficer
    description: "Reviews Form 1583 authorizations; can verify/reject and suspend customers"
    identity: "opaque"
    exclusive_operations:
      - "POST /forms-1583/{id}/verify — verify Form 1583"
      - "POST /forms-1583/{id}/reject — reject Form 1583"
    shared_operations:
      - "POST /customers/{id}/suspend — suspend customer (shared with FacilityOperator)"
      - "All GET reads"
