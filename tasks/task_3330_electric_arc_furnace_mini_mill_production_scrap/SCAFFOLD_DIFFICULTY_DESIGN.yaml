            - call: "POST /mills/${mill_id}/energy-events"
              payload: { grid_operator: "PJM", called_at: "2026-09-09T12:00:00Z", released_at: "2026-09-09T14:00:00Z" }
              as: EnergyDispatcher
              captures: { ev_1: $.data.id }
            - call: "POST /mills/${mill_id}/energy-events/${ev_1}/activate"
              payload: {}
              as: EnergyDispatcher
            - call: "POST /mills/${mill_id}/energy-events/${ev_1}/release"
              payload: {}
              as: EnergyDispatcher
            - call: "POST /mills/${mill_id}/energy-events"
              payload: { grid_operator: "PJM", called_at: "2026-09-09T14:10:00Z", released_at: "2026-09-09T15:00:00Z" }
              as: EnergyDispatcher
              captures: { ev_2: $.data.id }
            - call: "POST /mills/${mill_id}/energy-events"
              payload: { grid_operator: "PJM", called_at: "2026-09-09T14:15:00Z", released_at: "2026-09-09T15:30:00Z" }
              as: EnergyDispatcher
              captures: { ev_3: $.data.id }
          trigger:
            - call: "POST /mills/${mill_id}/energy-events/${ev_2}/activate"
              payload: {}
              as: EnergyDispatcher
              captures: { ev2_err: $.data.error_id }
            - call: "POST /mills/${mill_id}/energy-events/${ev_3}/activate"
              payload: {}
              as: EnergyDispatcher
              captures: { ev3_status: $.data.status }
          assert:
            - "EV2 (gap 10 min < 15) rejects: ev2_err == ERR_EVENT_OVERLAP and EV2 remains DECLARED"
            - "EV3 (gap exactly 15 min) activates: ev3_status == ACTIVE (the gap floor is inclusive)"
            - "Mill posture is INTERRUPTED after EV3 activates"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: heat_abort_restores_lot_tonnage
        grounds:
          - state_machines.Heat.CHARGED_to_ABORTED
          - state_machines.ScrapLot
          - endpoints.POST_/mills/{millId}/heats/{heatId}/abort
        distinguishing_aspect: |
          Conserved quantity: scrap inventory tons. sum(ScrapLot.remaining_tons)
          over the mill's lots + sum(tons on live HeatChargeLines) is invariant
          under charge (forward) and abort (compensation): an abort MUST
          restore exactly the drawn tonnage, leaving the mill's available
          inventory as if the charge never happened.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. Mill, FIXED contract, lot L1 20t dry."
            - "Heat H1 charged 8t from L1 (remaining 12, PARTIALLY_CONSUMED); heat CHARGED."
