      - name: abort_cascades_children_insurer_counters_and_closes_the_cycle
        grounds:
          - state_machines.Examination
          - state_machines.DataCall
          - state_machines.ExamScopeArea
          - state_machines.MultistateCollaboration
          - state_machines.MarketAnalysisCycle
          - endpoints[POST /market-conduct/examinations/{id}/abort]
        distinguishing_aspect: |
          A fan-out cascade in the opposite direction from the two bubble-up instances: one abort
          rewrites four different child/related entity types at hop 2, two grandparent counters at hop 3,
          and then closes the MarketAnalysisCycle at hop 4 - and the hop-4 close is conditional on the
          released slot leaving slots_committed at 0, so the cycle is driven terminal by an event on a
          descendant it never directly references.
        test_recipe:
          setup:
            - "Insurer BOREAL: 50000 policies, 300 complaints (ratio 6.00 -> HIGH), financial_stress_score 80, consumer_trend_score 90, annual_premium_written_cents 6000000000 -> composite 90.20; it is the only insurer in the department register."
            - "Analysis cycle with target_slot_capacity 1 and default fieldwork window 2026-09-01 .. 2026-11-30, SCORED then targets selected -> exactly one Examination created with cycle_id set, so slots_committed 1 / slots_available 0."
            - "The generated examination gets one CLAIMS scope area (population 4000, sample 10), scope locked, a multistate collaboration (NV / AZ / UT) and one data call that the carrier has RESPONDED to but which has not been disposed."
            - "Logical clock at the 2026-08-01T00:00:00Z default."
