              payload: { dispatch_id: "${d1}", sample_index: 3, sampled_at: "2026-08-10T14:30:00Z", measured_mw: 10.0, measured_mvar: 4.0, soc_mwh_reading: 73.0, max_cell_temp_c: 40.0 }
