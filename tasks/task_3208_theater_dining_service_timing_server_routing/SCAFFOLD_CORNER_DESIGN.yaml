              payload: { auditorium_id: "${aud_id}", title: "Dune", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 100, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id }
          trigger:
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x1_id}", server_id: "${s2_id}", section_label: "LEFT" }
              as: Server
              as_user_id: "${s1_id}"
              captures: { err_assign: $.data.error_id }
            - call: "POST /disturbance-events/00000000-0000-4000-8000-000000000000/approve-ejection"
