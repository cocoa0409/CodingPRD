              as: EligibilitySpecialist
              captures: { r_id: "$.data.id" }
          trigger:
            - call: "POST /trip-reservations"
              payload: { rider_id: "${r_id}", pickup_zone_id: "${za_id}", dropoff_zone_id: "${za_id}", pickup_lat: 41.0, pickup_lng: -74.0, dropoff_lat: 40.0, dropoff_lng: -74.0, requested_pickup_at: "2026-06-05T09:00:00Z" }
              as: Rider
              as_user_id: "${r_id}"
          assert:
            - "response.error_id == ERR_RIDER_NOT_ELIGIBLE"
            - "response.http_status == 409"

