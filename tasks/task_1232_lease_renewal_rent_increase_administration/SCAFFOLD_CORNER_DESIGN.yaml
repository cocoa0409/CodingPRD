        claim_type: scheduled_actions
        grounds: ["endpoints: POST /_clock/set_current_utc", "entities.RenewalOffer.fields.issued_on_date", "entities.RenewalOffer.fields.response_deadline_date"]
        distinguishing_aspect: "With no set_current_utc call ever made, the logical clock reads exactly 2026-05-01T00:00:00Z (not wall-clock): an issued offer stamps issued_on_date 2026-05-01 and response_deadline_date 2026-05-15 (min of +14d and term_end 2027-06-01)."
