            - "ImpactAssessment.${ia_id}.remediated_at == 2026-08-31T00:00:01Z"
            - "AppRecord.${app_id}.compliance_posture == OPEN"
            - "AppRecord.${app_id}.posture_reason_codes == []"
      - name: filing_an_appeal_on_a_contested_reason_drives_the_build_to_appeal_pending
        claim_type: Valid Transition
        grounds:
          - state_machines.Submission.transitions.REJECTED_to_APPEAL_PENDING
          - state_machines.AppealRequest.initial_state
          - endpoints.POST_/appeal-requests
        distinguishing_aspect: "Filing the appeal is what moves the Submission: the AppealRequest is born SUBMITTED with filed_at 2026-08-01T00:00:00Z and overturn_ratio still null, while the build leaves REJECTED for APPEAL_PENDING in the same call."
        test_recipe:
          setup:
            - "Build 100 is REJECTED at 2026-08-01T00:00:00Z with one CRITICAL PRIVACY_LABEL_MISMATCH reason whose disposition is CONTESTED."
          setup_api_calls: *CH_CONTESTED
          trigger:
            - call: "POST /appeal-requests"
              payload: { submission_id: "${sub_id}", appeal_type: "GUIDELINE_INTERPRETATION", argument: "The identifier is device-local and the disclosure already covers it.", cited_rejection_reason_ids: ["${rr_id}"] }
              as: ComplianceOfficer
              as_user_id: "${acct_id}"
          assert:
            - "the response status is 201 and data.state == SUBMITTED"
            - "data.filed_at == 2026-08-01T00:00:00Z"
            - "data.filed_by_user_id == ${acct_id}"
            - "data.overturn_ratio is null"
            - "Submission.${sub_id}.state == APPEAL_PENDING"
            - "Submission.${sub_id}.rejected_at == 2026-08-01T00:00:00Z"

      - name: appealing_a_reason_still_in_pending_disposition_returns_rejection_not_contested
        claim_type: Cross-entity validation
