    side_effects: ["total_lot_count=0, rejected_lot_count=0, revoked_qualification_count=0, quality_index=100.00, status=ACTIVE"]

  - method: GET
    path: "/valve-mfg/foundries"
    description: "List foundries"
    roles: [Any]
    code: 200
    input: ["status?", "country_code?", "limit?", "offset?"]
    output: Foundry[]
    side_effects: []

  - method: GET
    path: "/valve-mfg/foundries/{id}"
    description: "Get one foundry with a freshly computed quality_index and status band"
    roles: [Any]
    code: 200
    input: []
    output: Foundry
    side_effects: []

  # --- FoundryQualification ---
  - method: POST
    path: "/valve-mfg/foundry-qualifications"
    description: "Open a process/material qualification for a foundry"
    roles: [ProcurementSpecialist]
    code: 201
    input: [foundry_id, process, material_grade, max_pressure_class, valid_from, valid_until]
    output: FoundryQualification
    side_effects: ["status=PENDING, requalification_count=0, qualified_by_user_id=null"]

  - method: GET
    path: "/valve-mfg/foundry-qualifications"
    description: "List qualifications"
    roles: [Any]
    code: 200
    input: ["foundry_id?", "status?", "process?", "material_grade?", "limit?", "offset?"]
    output: FoundryQualification[]
    side_effects: []

  - method: GET
    path: "/valve-mfg/foundry-qualifications/{id}"
    description: "Get one qualification; QUALIFIED rows past valid_until are reported as EXPIRED"
    roles: [Any]
    code: 200
    input: []
