        grounds:
          - calculations.eligibility_bmi_assessment
          - state_machines.EligibilityScreening.DRAFT_to_INELIGIBLE
          - entities.EligibilityScreening.fields.decision_reason
        distinguishing_aspect: "A screening with egfr 25.0 and a qualifying BMI of 32.9 reports decision_reason RENAL_EXCLUSION, not BMI_QUALIFIED, pinning clause 2 ahead of clause 3 in the decision ladder."
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; CA patient at 170 cm and 95.0 kg with fresh labs showing egfr 25.0."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/patients"
              payload: { email: "cal1@example.com", full_name: "Cal One", state_code: "CA", height_cm: 170, weight_kg: 95.0, payment_mode: "CASH", comorbidity_codes: ["TYPE_2_DIABETES"] }
              as: PlatformAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /glp1/providers"
              payload: { full_name: "Dr Nia Cole", provider_type: "CLINICIAN", licensed_state_codes: ["CA"], npi: "1710012001" }
              as: PlatformAdmin
