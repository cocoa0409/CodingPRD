# =============================================================================
# Electrical Contractor Service & Dispatch — Seed Tables (Expert tier)
# =============================================================================

scenario: |
  Electrical Contractor Service & Dispatch: service/install scope (panel/outlet/EV charger),
  estimate & flat-rate, permit & inspection, technician dispatch & ETA, materials & truck stock,
  emergency call, membership plan, warranty/callback

domain_name: electrical-contractor-dispatch
api_prefix: /v1

# Complexity DNA -------------------------------------------------------------
complexity_profile:
  primary_archetype: "Quota / allocation"          # truck-stock + dispatch-slot allocation
  secondary_archetype: "Pricing engine"            # flat-rate vs time-and-materials estimate
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers
    - resource_temporal_overlap

  entity_topology: flat                              # peer entities joined by FK references
  state_machine_shape: cyclic                        # ServiceJob WARRANTY/callback loop + Estimate revise loop
  relationship_patterns:
    - one_to_many                                     # ServiceJob -> Estimate, ServiceJob -> Dispatch
    - cross_aggregate                                 # Dispatch references Technician across aggregates
  role_model: peer_roles                              # Customer / Technician / Dispatcher / Inspector own distinct surfaces
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across customers" }
      - { name: service_zip, type: string, source: input, description: "Service-address ZIP; routes to a service zone" }
      - { name: phone, type: string, source: input, description: "Contact phone" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: license_class, type: enum, source: input, description: "JOURNEYMAN | MASTER — MASTER required for PANEL and EV_CHARGER scope" }
      - { name: service_zone, type: string, source: input, description: "ZIP-prefix zone this technician covers; must match job zone to be dispatchable" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Labor rate for time-and-materials estimates, in cents" }
      - { name: on_call, type: boolean, source: input, default: false, description: "Eligible for EMERGENCY job dispatch when true" }

  - name: MembershipPlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plan name" }
      - { name: tier, type: enum, source: input, description: "BASIC | PREMIER" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring fee in cents" }
      - { name: labor_discount_pct, type: number, source: input, description: "Fraction (0..1) discount applied to labor subtotal on member jobs" }
      - { name: waives_dispatch_fee, type: boolean, source: input, default: false, description: "If true, the trip/dispatch fee is waived on member jobs" }
      - { name: priority_dispatch, type: boolean, source: input, default: false, description: "If true, member jobs rank ahead of non-member jobs in dispatch ordering" }

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the enrolled customer" }
      - { name: plan_id, type: string, source: input, description: "FK -> MembershipPlan.id; the plan enrolled in" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCELLED — initial ACTIVE on enroll" }
      - { name: started_at, type: datetime, source: system, description: "Enrollment timestamp (server clock)" }

  - name: MaterialSku
    parent: null
    common_fields: true
    fields:
      - { name: sku_code, type: string, source: input, description: "Catalog code; unique across SKUs" }
      - { name: description, type: string, source: input, description: "Human-readable part description" }
      - { name: unit_price_cents, type: integer, source: input, description: "Sell price per unit in cents (price book)" }
      - { name: taxable, type: boolean, source: input, default: true, description: "Whether material lines for this SKU are taxed" }

  - name: TruckStockItem
    parent: null
    common_fields: true
    fields:
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; the truck this stock sits on" }
      - { name: sku_id, type: string, source: input, description: "FK -> MaterialSku.id; the stocked part" }
      - { name: quantity_on_hand, type: integer, source: computed, default: 0, description: "Units currently on the truck; debited on material usage, credited on restock/void" }
      - { name: reorder_threshold, type: integer, source: input, default: 0, description: "Restock advisory floor; low_stock computed against this" }
      - { name: low_stock, type: boolean, source: computed, description: "= quantity_on_hand <= reorder_threshold" }

  - name: ServiceJob
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the requesting customer" }
      - { name: scope, type: enum, source: input, description: "OUTLET | PANEL | EV_CHARGER — drives flat-rate book and license requirement" }
      - { name: job_class, type: enum, source: input, description: "SERVICE | INSTALL" }
      - { name: priority, type: enum, source: input, default: "STANDARD", description: "STANDARD | EMERGENCY — EMERGENCY requires on_call technician and adds surcharge" }
      - { name: requires_permit, type: boolean, source: computed, description: "True for PANEL and EV_CHARGER scopes; gates COMPLETED transition until permit PASSED" }
      - { name: membership_id, type: string, source: computed, description: "FK -> Membership.id; the customer's ACTIVE membership snapshotted at job creation, else null" }
      - { name: pricing_mode, type: enum, source: computed, description: "FLAT_RATE | TIME_MATERIALS — copied from the ACCEPTED estimate" }
      - { name: status, type: enum, source: system, description: "DRAFT -> QUOTED -> SCHEDULED -> IN_PROGRESS -> COMPLETED -> INVOICED -> CLOSED; plus WARRANTY (reopened) and CANCELLED" }
      - { name: total_due_cents, type: integer, source: computed, default: 0, description: "Final invoiced amount in cents (set at INVOICED); 0 until invoiced" }
      - { name: warranty_until, type: datetime, source: computed, description: "End of warranty window = invoice time + WARRANTY_DAYS; null until INVOICED" }

  - name: Estimate
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> ServiceJob.id; the job being estimated" }
      - { name: pricing_mode, type: enum, source: input, description: "FLAT_RATE | TIME_MATERIALS" }
      - { name: flat_rate_cents, type: integer, source: input, default: 0, description: "Quoted flat price in cents; required when pricing_mode=FLAT_RATE, ignored otherwise" }
      - { name: estimated_labor_hours, type: number, source: input, default: 0, description: "Quoted labor hours; required when pricing_mode=TIME_MATERIALS" }
      - { name: estimated_material_cents, type: integer, source: input, default: 0, description: "Quoted material cost in cents for TIME_MATERIALS mode" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Computed quoted total (see estimate_quoted_total calculation)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SENT -> ACCEPTED / REJECTED / SUPERSEDED" }

  - name: Dispatch
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> ServiceJob.id; the dispatched job" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; the assigned technician" }
      - { name: window_start, type: datetime, source: input, description: "Arrival-window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Arrival-window end (exclusive)" }
      - { name: eta, type: datetime, source: computed, description: "Promised ETA; defaults to window_start, advances on reschedule" }
      - { name: status, type: enum, source: system, description: "ASSIGNED -> EN_ROUTE -> ON_SITE -> CLEARED; plus CANCELLED" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> ServiceJob.id; the job requiring the permit" }
      - { name: jurisdiction, type: string, source: input, description: "Issuing authority name" }
      - { name: permit_number, type: string, source: input, description: "External permit identifier" }
      - { name: status, type: enum, source: system, description: "APPLIED -> ISSUED -> INSPECTION_SCHEDULED -> PASSED / FAILED" }
      - { name: inspection_at, type: datetime, source: input, description: "Scheduled inspection time (set on schedule_inspection)" }

  - name: MaterialUsage
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> ServiceJob.id; the job that consumed the material" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; whose truck stock is debited" }
      - { name: sku_id, type: string, source: input, description: "FK -> MaterialSku.id; the consumed part" }
      - { name: quantity, type: integer, source: input, description: "Units consumed (> 0)" }
      - { name: line_total_cents, type: integer, source: computed, description: "= quantity * MaterialSku.unit_price_cents at usage time" }
      - { name: voided, type: boolean, source: system, default: false, description: "True once the usage is voided; line excluded from invoice and stock restored" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> ServiceJob.id; the billed job (1:1)" }
      - { name: labor_subtotal_cents, type: integer, source: computed, description: "Labor portion before discount (see invoice_total calculation)" }
      - { name: material_subtotal_cents, type: integer, source: computed, description: "Sum of non-voided MaterialUsage.line_total_cents" }
      - { name: dispatch_fee_cents, type: integer, source: computed, description: "Trip fee; waived for members whose plan waives_dispatch_fee" }
      - { name: emergency_surcharge_cents, type: integer, source: computed, description: "Surcharge applied when job.priority=EMERGENCY" }
      - { name: discount_cents, type: integer, source: computed, description: "Membership labor discount in cents" }
      - { name: tax_cents, type: integer, source: computed, description: "Tax on taxable material lines" }
      - { name: total_cents, type: integer, source: computed, description: "Grand total billed in cents" }

  - name: Callback
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> ServiceJob.id; the original closed/invoiced job being recalled" }
      - { name: reason, type: string, source: input, description: "Customer-reported defect reason" }
      - { name: covered_by_warranty, type: boolean, source: computed, description: "= callback created at-or-before ServiceJob.warranty_until" }
      - { name: status, type: enum, source: system, description: "OPEN -> RESOLVED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceJob
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /v1/estimates/{estimateId}/accept (system bubbles job to QUOTED)"
        actor: Customer
        preconditions:
          - "An Estimate for this job is in SENT status"
          - "The accepting customer owns the job (Customer.id == ServiceJob.customer_id)"
        side_effects:
          - "Estimate.status -> ACCEPTED"
          - "All other SENT/DRAFT estimates for this job -> SUPERSEDED"
          - "ServiceJob.pricing_mode := accepted Estimate.pricing_mode"
          - "ServiceJob.status -> QUOTED"

      - from: QUOTED
        to: SCHEDULED
        trigger: "POST /v1/dispatches (system bubbles job to SCHEDULED on first ASSIGNED dispatch)"
        actor: Dispatcher
        preconditions:
          - "Job is QUOTED (an estimate has been accepted)"
          - "Assigned Technician.service_zone matches the job zone (Customer.service_zip prefix)"
          - "If scope in {PANEL, EV_CHARGER}: Technician.license_class == MASTER"
          - "If job.priority == EMERGENCY: Technician.on_call == true"
          - "Dispatch window does not overlap an existing non-CANCELLED dispatch on the same technician"
        side_effects:
          - "Dispatch.status := ASSIGNED, Dispatch.eta := window_start"
          - "ServiceJob.status -> SCHEDULED"

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /v1/dispatches/{dispatchId}/arrive (system bubbles job to IN_PROGRESS when dispatch reaches ON_SITE)"
        actor: Technician
        preconditions:
          - "The arriving dispatch belongs to this job and is EN_ROUTE"
        side_effects:
          - "Dispatch.status -> ON_SITE"
          - "ServiceJob.status -> IN_PROGRESS"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /v1/service-jobs/{jobId}/complete"
        actor: Technician
        preconditions:
          - "Job is IN_PROGRESS"
          - "If ServiceJob.requires_permit: a Permit for this job is in PASSED status (else ERR_PERMIT_NOT_PASSED)"
        side_effects:
          - "Active Dispatch.status -> CLEARED"
          - "ServiceJob.status -> COMPLETED"

      - from: COMPLETED
        to: INVOICED
        trigger: "POST /v1/service-jobs/{jobId}/invoice"
        actor: Dispatcher
        preconditions:
          - "Job is COMPLETED"
          - "No Invoice already exists for this job"
        side_effects:
          - "Create Invoice; run invoice_total calculation over non-voided usages and accepted estimate"
          - "ServiceJob.total_due_cents := Invoice.total_cents"
          - "ServiceJob.warranty_until := current_utc + WARRANTY_DAYS days"
          - "ServiceJob.status -> INVOICED"

      - from: INVOICED
        to: CLOSED
        trigger: "POST /v1/service-jobs/{jobId}/close"
        actor: Dispatcher
        preconditions:
          - "Job is INVOICED"
          - "No Callback for this job is in OPEN status"
        side_effects:
          - "ServiceJob.status -> CLOSED"

      - from: INVOICED
        to: WARRANTY
        trigger: "POST /v1/callbacks (system reopens job when a warranty-covered callback is filed)"
        actor: Customer
        preconditions:
          - "Job is INVOICED"
          - "Callback created at-or-before ServiceJob.warranty_until (covered_by_warranty == true)"
        side_effects:
          - "Callback.status := OPEN, Callback.covered_by_warranty := true"
          - "ServiceJob.status -> WARRANTY"

      - from: CLOSED
        to: WARRANTY
        trigger: "POST /v1/callbacks (system reopens a CLOSED job when a warranty-covered callback is filed)"
        actor: Customer
        preconditions:
          - "Job is CLOSED"
          - "Callback created at-or-before ServiceJob.warranty_until (covered_by_warranty == true)"
        side_effects:
          - "Callback.status := OPEN, Callback.covered_by_warranty := true"
          - "ServiceJob.status -> WARRANTY"

      - from: WARRANTY
        to: IN_PROGRESS
        trigger: "POST /v1/dispatches/{dispatchId}/arrive (re-dispatch of a warranty job; loops back into the work cycle)"
        actor: Technician
        preconditions:
          - "Job is WARRANTY"
          - "The arriving dispatch belongs to this job and is EN_ROUTE"
        side_effects:
          - "Dispatch.status -> ON_SITE"
          - "ServiceJob.status -> IN_PROGRESS"
        note: "Cyclic edge: warranty work re-enters IN_PROGRESS -> COMPLETED -> (re)INVOICED loop"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /v1/service-jobs/{jobId}/cancel"
        actor: Customer
        preconditions: ["Job is DRAFT or QUOTED"]
        side_effects:
          - "Open SENT/DRAFT estimates -> SUPERSEDED"

      - from: QUOTED
        to: CANCELLED
        trigger: "POST /v1/service-jobs/{jobId}/cancel"
        actor: Customer
        preconditions: ["Job is DRAFT or QUOTED"]
        side_effects:
          - "Open SENT/DRAFT estimates -> SUPERSEDED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/service-jobs/{jobId}/cancel"
        actor: Customer
        preconditions: ["Job is SCHEDULED"]
        side_effects:
          - "Active Dispatch.status -> CANCELLED (frees the technician's time window)"
          - "Open SENT/DRAFT estimates -> SUPERSEDED"

  - entity: Estimate
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /v1/estimates/{estimateId}/send"
        actor: Dispatcher
        preconditions:
          - "Estimate is DRAFT"
          - "Parent ServiceJob is DRAFT or QUOTED"
        side_effects:
          - "Estimate.status -> SENT"

      - from: SENT
        to: ACCEPTED
        trigger: "POST /v1/estimates/{estimateId}/accept"
        actor: Customer
        preconditions:
          - "Estimate is SENT"
          - "Accepting customer owns the parent job"
        side_effects:
          - "All sibling SENT/DRAFT estimates on the same job -> SUPERSEDED"
          - "Parent ServiceJob: pricing_mode := this estimate's pricing_mode; status DRAFT/QUOTED -> QUOTED"

      - from: SENT
        to: REJECTED
        trigger: "POST /v1/estimates/{estimateId}/reject"
        actor: Customer
        preconditions:
          - "Estimate is SENT"
          - "Rejecting customer owns the parent job"
        side_effects: ["Estimate.status -> REJECTED"]

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (when a sibling estimate on the same job is ACCEPTED, or job is CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SENT
        to: SUPERSEDED
        trigger: "system (when a sibling estimate on the same job is ACCEPTED, or job is CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Dispatch
    initial_state: ASSIGNED
    terminal_states: [CLEARED, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: EN_ROUTE
        trigger: "POST /v1/dispatches/{dispatchId}/depart"
        actor: Technician
        preconditions:
          - "Dispatch is ASSIGNED"
          - "Acting technician is the assigned technician"
        side_effects: ["Dispatch.status -> EN_ROUTE"]

      - from: EN_ROUTE
        to: ON_SITE
        trigger: "POST /v1/dispatches/{dispatchId}/arrive"
        actor: Technician
        preconditions:
          - "Dispatch is EN_ROUTE"
          - "Acting technician is the assigned technician"
        side_effects:
          - "Dispatch.status -> ON_SITE"
          - "Parent ServiceJob: SCHEDULED or WARRANTY -> IN_PROGRESS"

      - from: ON_SITE
        to: CLEARED
        trigger: "system (when parent ServiceJob completes)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /v1/dispatches/{dispatchId}/cancel"
        actor: Dispatcher
        preconditions: ["Dispatch is ASSIGNED or EN_ROUTE"]
        side_effects:
          - "Frees the technician's occupied time window for overlap checks"

      - from: EN_ROUTE
        to: CANCELLED
        trigger: "POST /v1/dispatches/{dispatchId}/cancel"
        actor: Dispatcher
        preconditions: ["Dispatch is ASSIGNED or EN_ROUTE"]
        side_effects:
          - "Frees the technician's occupied time window for overlap checks"

  - entity: Permit
    initial_state: APPLIED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: APPLIED
        to: ISSUED
        trigger: "POST /v1/permits/{permitId}/issue"
        actor: Inspector
        preconditions: ["Permit is APPLIED"]
        side_effects: ["Permit.status -> ISSUED"]

      - from: ISSUED
        to: INSPECTION_SCHEDULED
        trigger: "POST /v1/permits/{permitId}/schedule-inspection"
        actor: Dispatcher
        preconditions: ["Permit is ISSUED"]
        side_effects: ["Permit.inspection_at := provided time; status -> INSPECTION_SCHEDULED"]

      - from: INSPECTION_SCHEDULED
        to: PASSED
        trigger: "POST /v1/permits/{permitId}/record-inspection (result=PASS)"
        actor: Inspector
        preconditions: ["Permit is INSPECTION_SCHEDULED"]
        side_effects: ["Permit.status -> PASSED (unblocks job completion)"]

      - from: INSPECTION_SCHEDULED
        to: FAILED
        trigger: "POST /v1/permits/{permitId}/record-inspection (result=FAIL)"
        actor: Inspector
        preconditions: ["Permit is INSPECTION_SCHEDULED"]
        side_effects: ["Permit.status -> FAILED"]

      - from: FAILED
        to: INSPECTION_SCHEDULED
        trigger: "POST /v1/permits/{permitId}/schedule-inspection (re-inspection after remediation)"
        actor: Dispatcher
        preconditions: ["Permit is FAILED"]
        side_effects: ["Permit.inspection_at := provided time; status -> INSPECTION_SCHEDULED"]
        note: "Cyclic edge: a failed inspection can be re-scheduled and re-recorded"

  - entity: Callback
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /v1/callbacks/{callbackId}/resolve"
        actor: Dispatcher
        preconditions:
          - "Callback is OPEN"
          - "Parent ServiceJob is back in COMPLETED or INVOICED (warranty work finished)"
        side_effects:
          - "Callback.status -> RESOLVED"

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on parent version — see SKILL §1.2.1)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: estimate-create-stale-job
    parent_entity: ServiceJob
    write_endpoint: "POST /v1/estimates"
    occ_field: "expected_job_version"
    description: |
      Creating an Estimate against a ServiceJob whose version has advanced since
      the client last observed it is rejected. This captures the case where another
      writer has just accepted a competing estimate (which bubbles the job to QUOTED
      and bumps its version) so the current writer's view of the job is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dispatch-create-stale-job
    parent_entity: ServiceJob
    write_endpoint: "POST /v1/dispatches"
    occ_field: "expected_job_version"
    description: |
      Creating a Dispatch against a ServiceJob whose version has advanced since the
      client last read it is rejected. Another writer may have already scheduled a
      dispatch (bubbling the job to SCHEDULED and bumping its version), so a second
      create carrying the older version is operating on a stale view of the job.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: estimate_quoted_total
    trigger: "Estimate creation (POST /v1/estimates)"
    algorithm: forward_looking
    formula: |
      # Quoted total is a FORWARD-LOOKING projection from the estimate's own inputs.
      if pricing_mode == FLAT_RATE:
          quoted_total_cents = flat_rate_cents
      else:  # TIME_MATERIALS
          labor_cents = round_half_up(estimated_labor_hours * technician_hourly_rate_cents)
          quoted_total_cents = labor_cents + estimated_material_cents
      # Note: TIME_MATERIALS quote uses estimated hours/materials, NOT actuals.
    input_set: "Only the estimate's own input fields plus the dispatched technician's hourly_rate_cents if known at quote time; if no technician is dispatched yet, use the job's zone default rate constant DEFAULT_HOURLY_RATE_CENTS."
    constants:
      DEFAULT_HOURLY_RATE_CENTS: 12000
    precision: "integer cents, round_half_up when multiplying hours by rate"
    variants:
      - name: flat_rate
        when: "pricing_mode == FLAT_RATE"
        difference: "Total equals flat_rate_cents verbatim; estimated_labor_hours/material ignored."
      - name: time_materials
        when: "pricing_mode == TIME_MATERIALS"
        difference: "Total = round_half_up(hours*rate) + estimated_material_cents; flat_rate_cents ignored."

  - name: invoice_total
    trigger: "ServiceJob INVOICED transition (POST /v1/service-jobs/{jobId}/invoice)"
    algorithm: chronological
    formula: |
      # CHRONOLOGICAL / actual billing — built from realized usages, NOT the quote.
      # Evaluation order is PINNED (circular-looking: discount depends on labor, total depends on discount):
      #  Step 1 labor_subtotal_cents:
      #     if accepted Estimate.pricing_mode == FLAT_RATE:
      #         labor_subtotal_cents = accepted Estimate.flat_rate_cents
      #     else:  # TIME_MATERIALS
      #         labor_subtotal_cents = round_half_up(actual_labor_hours * technician_hourly_rate_cents)
      #         # actual_labor_hours is supplied on the /complete call
      #  Step 2 material_subtotal_cents = sum(line_total_cents for MaterialUsage WHERE voided == false)
      #         # ordered by created_at ASC for deterministic running sum; ties impossible (server-minted)
      #  Step 3 dispatch_fee_cents:
      #         base = DISPATCH_FEE_CENTS
      #         if job.membership_id != null AND that plan.waives_dispatch_fee == true: dispatch_fee_cents = 0
      #         else: dispatch_fee_cents = base
      #  Step 4 emergency_surcharge_cents = EMERGENCY_SURCHARGE_CENTS if job.priority == EMERGENCY else 0
      #  Step 5 discount_cents:
      #         if job.membership_id != null:
      #             discount_cents = round_half_up(labor_subtotal_cents * plan.labor_discount_pct)
      #         else: discount_cents = 0
      #  Step 6 tax_cents = round_half_up(taxable_material_base * TAX_RATE)
      #         # taxable_material_base = sum(line_total_cents for non-voided usages whose SKU.taxable == true)
      #  Step 7 total_cents = (labor_subtotal_cents - discount_cents)
      #                       + material_subtotal_cents + dispatch_fee_cents
      #                       + emergency_surcharge_cents + tax_cents
      input_set: "Non-voided MaterialUsage rows for the job; the ACCEPTED estimate; the job's snapshotted membership_id -> plan; job.priority."
      constants:
        DISPATCH_FEE_CENTS: 8900
        EMERGENCY_SURCHARGE_CENTS: 15000
        TAX_RATE: 0.0825
      precision: "integer cents; round_half_up applied independently at each round_half_up step (round-then-sum, NOT sum-then-round)"
      variants:
        - name: member_billing
          when: "job.membership_id != null"
          difference: "Subtract labor discount; possibly waive dispatch fee per plan flags."
        - name: nonmember_billing
          when: "job.membership_id == null"
          difference: "No discount; full dispatch fee applies."

  - name: dispatch_overlap_check
    trigger: "Dispatch creation and SCHEDULED transition (POST /v1/dispatches)"
    algorithm: interval_merge
    formula: |
      # Half-open interval semantics: [window_start, window_end).
      # Two windows on the SAME technician conflict iff:
      #     new.window_start < existing.window_end AND existing.window_start < new.window_end
      # Adjacency (new.window_start == existing.window_end) does NOT conflict (half-open).
      # Only existing dispatches in {ASSIGNED, EN_ROUTE, ON_SITE} are considered; CANCELLED/CLEARED ignored.
      # On conflict: reject with ERR_TECH_DOUBLE_BOOKED.
    input_set: "Existing Dispatch rows for the same technician_id whose status IN {ASSIGNED, EN_ROUTE, ON_SITE}."
    precision: "datetime comparison, microsecond resolution"

  - name: truck_stock_balance
    trigger: "MaterialUsage creation and void (POST /v1/material-usages, POST /v1/material-usages/{id}/void)"
    algorithm: aggregation
    formula: |
      # Per (technician_id, sku_id) TruckStockItem:
      #   on usage create:  quantity_on_hand -= usage.quantity  (must stay >= 0, else ERR_INSUFFICIENT_STOCK)
      #   on usage void:     quantity_on_hand += usage.quantity  (restore)
      # low_stock recomputed each change: low_stock = (quantity_on_hand <= reorder_threshold)
      # Boundary: a usage of EXACTLY quantity_on_hand succeeds (result 0); quantity_on_hand + 1 is rejected.
    input_set: "The TruckStockItem for (usage.technician_id, usage.sku_id)."
    precision: "integer units"

  - name: dispatch_ranking
    trigger: "GET /v1/dispatch-queue (recommended next job ordering for a technician's zone)"
    algorithm: weighted_scoring
    formula: |
      # Candidate set: ServiceJob rows with status == QUOTED whose zone (customer.service_zip prefix)
      #   matches the requested zone AND (scope not in {PANEL, EV_CHARGER} OR a MASTER tech is requested).
      # Rank candidates by, in strict order:
      #   1. EMERGENCY before STANDARD (priority field)
      #   2. priority_dispatch members before non-priority (job.membership_id -> plan.priority_dispatch == true first)
      #   3. created_at ASC  (older job first)
      # No id is ever used as a tie-break; created_at ASC is the final deterministic key.
    input_set: "ServiceJob rows in QUOTED status matching the zone filter."
    precision: "stable ordering; created_at ASC final tie-break (never id)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Entity-backed actor owns the resource (Customer.id == ServiceJob.customer_id on customer actions; Technician.id == Dispatch.technician_id on technician actions)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "customer-owned and technician-owned mutations"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, quantities > 0, window_start < window_end"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches current parent.version on create-with-supersede endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /v1/estimates, POST /v1/dispatches"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 8
    category: business_safety
    check: "License gating: PANEL/EV_CHARGER dispatch requires a MASTER technician"
    error_id: ERR_LICENSE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /v1/dispatches"

  - priority: 9
    category: business_safety
    check: "Emergency gating: EMERGENCY job dispatch requires an on_call technician"
    error_id: ERR_TECH_NOT_ON_CALL
    http_status: 409
    applies_to: "POST /v1/dispatches"

  - priority: 10
    category: business_constraint
    check: "Zone match: assigned technician.service_zone matches the job's zone"
    error_id: ERR_ZONE_MISMATCH
    http_status: 409
    applies_to: "POST /v1/dispatches"

  - priority: 11
    category: business_temporal
    check: "Dispatch window does not overlap an active dispatch on the same technician (half-open intervals)"
    error_id: ERR_TECH_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /v1/dispatches"

  - priority: 12
    category: business_safety
    check: "Permit gating: a job requiring a permit cannot complete until its permit is PASSED"
    error_id: ERR_PERMIT_NOT_PASSED
    http_status: 409
    applies_to: "POST /v1/service-jobs/{jobId}/complete"

  - priority: 13
    category: business_constraint
    check: "Stock sufficiency: material usage quantity must not exceed truck quantity_on_hand"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /v1/material-usages"

  - priority: 14
    category: business_referential
    check: "Single-invoice: a job may have at most one Invoice"
    error_id: ERR_ALREADY_INVOICED
    http_status: 409
    applies_to: "POST /v1/service-jobs/{jobId}/invoice"

  - priority: 15
    category: business_constraint
    check: "Uniqueness: Customer.email and MaterialSku.sku_code are unique"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /v1/customers, POST /v1/material-skus"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Customer ----
  - { method: POST, path: "/v1/customers", description: "Create a customer", roles: [Dispatcher], code: 201,
      input: [full_name, email, service_zip, phone], output: Customer, side_effects: [] }
  - { method: GET, path: "/v1/customers/{customerId}", description: "Get a customer", roles: [Dispatcher, Customer], code: 200,
      input: [], output: Customer, side_effects: [] }
  - { method: GET, path: "/v1/customers", description: "List customers (filterable)", roles: [Dispatcher], code: 200,
      input: ["email?", "limit?", "offset?"], output: "Customer[]", side_effects: [] }

  # ---- Technician ----
  - { method: POST, path: "/v1/technicians", description: "Create a technician", roles: [Dispatcher], code: 201,
      input: [full_name, license_class, service_zone, hourly_rate_cents, "on_call?"], output: Technician, side_effects: [] }
  - { method: GET, path: "/v1/technicians/{technicianId}", description: "Get a technician", roles: [Dispatcher, Technician], code: 200,
      input: [], output: Technician, side_effects: [] }
  - { method: GET, path: "/v1/technicians", description: "List technicians (filter by zone)", roles: [Dispatcher], code: 200,
      input: ["service_zone?", "limit?", "offset?"], output: "Technician[]", side_effects: [] }

  # ---- MembershipPlan ----
  - { method: POST, path: "/v1/membership-plans", description: "Create a membership plan", roles: [Dispatcher], code: 201,
      input: [name, tier, monthly_fee_cents, labor_discount_pct, "waives_dispatch_fee?", "priority_dispatch?"], output: MembershipPlan, side_effects: [] }
  - { method: GET, path: "/v1/membership-plans/{planId}", description: "Get a membership plan", roles: [Dispatcher, Customer], code: 200,
      input: [], output: MembershipPlan, side_effects: [] }
  - { method: GET, path: "/v1/membership-plans", description: "List membership plans", roles: [Dispatcher, Customer], code: 200,
      input: ["limit?", "offset?"], output: "MembershipPlan[]", side_effects: [] }

  # ---- Membership ----
  - { method: POST, path: "/v1/memberships", description: "Enroll a customer in a plan", roles: [Dispatcher, Customer], code: 201,
      input: [customer_id, plan_id], output: Membership,
      side_effects: ["status := ACTIVE", "started_at := current_utc"] }
  - { method: GET, path: "/v1/memberships/{membershipId}", description: "Get a membership", roles: [Dispatcher, Customer], code: 200,
      input: [], output: Membership, side_effects: [] }
  - { method: GET, path: "/v1/memberships", description: "List memberships (filter by customer or plan)", roles: [Dispatcher, Customer], code: 200,
      input: ["customer_id?", "plan_id?", "limit?", "offset?"], output: "Membership[]", side_effects: [] }
  - { method: POST, path: "/v1/memberships/{membershipId}/cancel", description: "Cancel a membership", roles: [Dispatcher, Customer], code: 200,
      input: [], output: Membership, side_effects: ["status -> CANCELLED"] }

  # ---- MaterialSku ----
  - { method: POST, path: "/v1/material-skus", description: "Create a price-book SKU", roles: [Dispatcher], code: 201,
      input: [sku_code, description, unit_price_cents, "taxable?"], output: MaterialSku, side_effects: [] }
  - { method: GET, path: "/v1/material-skus/{skuId}", description: "Get a SKU", roles: [Dispatcher, Technician], code: 200,
      input: [], output: MaterialSku, side_effects: [] }
  - { method: GET, path: "/v1/material-skus", description: "List SKUs", roles: [Dispatcher, Technician], code: 200,
      input: ["sku_code?", "limit?", "offset?"], output: "MaterialSku[]", side_effects: [] }

  # ---- TruckStockItem ----
  - { method: POST, path: "/v1/truck-stock-items", description: "Stock a SKU on a technician's truck", roles: [Dispatcher], code: 201,
      input: [technician_id, sku_id, quantity_on_hand, "reorder_threshold?"], output: TruckStockItem,
      side_effects: ["low_stock := (quantity_on_hand <= reorder_threshold)"] }
  - { method: GET, path: "/v1/truck-stock-items/{stockItemId}", description: "Get a truck-stock item", roles: [Dispatcher, Technician], code: 200,
      input: [], output: TruckStockItem, side_effects: [] }
  - { method: GET, path: "/v1/truck-stock-items", description: "List truck-stock items (filter by technician or sku)", roles: [Dispatcher, Technician], code: 200,
      input: ["technician_id?", "sku_id?", "limit?", "offset?"], output: "TruckStockItem[]", side_effects: [] }
  - { method: POST, path: "/v1/truck-stock-items/{stockItemId}/restock", description: "Add units to a truck-stock item", roles: [Dispatcher], code: 200,
      input: [add_quantity], output: TruckStockItem,
      side_effects: ["quantity_on_hand += add_quantity", "low_stock recomputed"] }

  # ---- ServiceJob ----
  - { method: POST, path: "/v1/service-jobs", description: "Create a service job (DRAFT)", roles: [Dispatcher, Customer], code: 201,
      input: [customer_id, scope, job_class, "priority?"], output: ServiceJob,
      side_effects: ["status := DRAFT", "requires_permit := scope in {PANEL, EV_CHARGER}",
                     "membership_id := customer's ACTIVE membership id or null", "total_due_cents := 0"] }
  - { method: GET, path: "/v1/service-jobs/{jobId}", description: "Get a service job", roles: [Dispatcher, Customer, Technician], code: 200,
      input: [], output: ServiceJob, side_effects: [] }
  - { method: GET, path: "/v1/service-jobs", description: "List service jobs (filter by customer, membership, or status)", roles: [Dispatcher, Customer, Technician], code: 200,
      input: ["customer_id?", "membership_id?", "status?", "limit?", "offset?"], output: "ServiceJob[]", side_effects: [] }
  - { method: POST, path: "/v1/service-jobs/{jobId}/complete", description: "Mark job work complete", roles: [Technician], code: 200,
      input: ["actual_labor_hours?"], output: ServiceJob,
      side_effects: ["requires PASSED permit if requires_permit", "active Dispatch -> CLEARED", "status -> COMPLETED"] }
  - { method: POST, path: "/v1/service-jobs/{jobId}/invoice", description: "Generate the invoice and bill the job", roles: [Dispatcher], code: 200,
      input: [], output: ServiceJob,
      side_effects: ["create Invoice via invoice_total", "total_due_cents := Invoice.total_cents",
                     "warranty_until := current_utc + WARRANTY_DAYS", "status -> INVOICED"] }
  - { method: POST, path: "/v1/service-jobs/{jobId}/close", description: "Close an invoiced job", roles: [Dispatcher], code: 200,
      input: [], output: ServiceJob, side_effects: ["status -> CLOSED (rejected if an OPEN callback exists)"] }
  - { method: POST, path: "/v1/service-jobs/{jobId}/cancel", description: "Cancel a job", roles: [Dispatcher, Customer], code: 200,
      input: [], output: ServiceJob,
      side_effects: ["status -> CANCELLED", "open estimates -> SUPERSEDED", "active SCHEDULED dispatch -> CANCELLED"] }

  # ---- Estimate ----
  - { method: POST, path: "/v1/estimates", description: "Create an estimate for a job (OCC on job.version)", roles: [Dispatcher], code: 201,
      input: [job_id, pricing_mode, expected_job_version, "flat_rate_cents?", "estimated_labor_hours?", "estimated_material_cents?"], output: Estimate,
      side_effects: ["status := DRAFT", "quoted_total_cents := estimate_quoted_total", "increments ServiceJob.version by 1"] }
  - { method: GET, path: "/v1/estimates/{estimateId}", description: "Get an estimate", roles: [Dispatcher, Customer], code: 200,
      input: [], output: Estimate, side_effects: [] }
  - { method: GET, path: "/v1/estimates", description: "List estimates (filter by job)", roles: [Dispatcher, Customer], code: 200,
      input: ["job_id?", "status?", "limit?", "offset?"], output: "Estimate[]", side_effects: [] }
  - { method: POST, path: "/v1/estimates/{estimateId}/send", description: "Send a draft estimate to the customer", roles: [Dispatcher], code: 200,
      input: [], output: Estimate, side_effects: ["status -> SENT"] }
  - { method: POST, path: "/v1/estimates/{estimateId}/accept", description: "Customer accepts an estimate", roles: [Customer], code: 200,
      input: [], output: Estimate,
      side_effects: ["status -> ACCEPTED", "sibling SENT/DRAFT estimates -> SUPERSEDED",
                     "job.pricing_mode := this mode", "job DRAFT/QUOTED -> QUOTED"] }
  - { method: POST, path: "/v1/estimates/{estimateId}/reject", description: "Customer rejects an estimate", roles: [Customer], code: 200,
      input: [], output: Estimate, side_effects: ["status -> REJECTED"] }

  # ---- Dispatch ----
  - { method: POST, path: "/v1/dispatches", description: "Dispatch a technician to a job (OCC on job.version)", roles: [Dispatcher], code: 201,
      input: [job_id, technician_id, window_start, window_end, expected_job_version], output: Dispatch,
      side_effects: ["status := ASSIGNED", "eta := window_start", "job QUOTED -> SCHEDULED",
                     "increments ServiceJob.version by 1"] }
  - { method: GET, path: "/v1/dispatches/{dispatchId}", description: "Get a dispatch", roles: [Dispatcher, Technician, Customer], code: 200,
      input: [], output: Dispatch, side_effects: [] }
  - { method: GET, path: "/v1/dispatches", description: "List dispatches (filter by job or technician)", roles: [Dispatcher, Technician], code: 200,
      input: ["job_id?", "technician_id?", "status?", "limit?", "offset?"], output: "Dispatch[]", side_effects: [] }
  - { method: POST, path: "/v1/dispatches/{dispatchId}/depart", description: "Technician departs for the job", roles: [Technician], code: 200,
      input: [], output: Dispatch, side_effects: ["status -> EN_ROUTE"] }
  - { method: POST, path: "/v1/dispatches/{dispatchId}/arrive", description: "Technician arrives on site", roles: [Technician], code: 200,
      input: [], output: Dispatch, side_effects: ["status -> ON_SITE", "job SCHEDULED/WARRANTY -> IN_PROGRESS"] }
  - { method: POST, path: "/v1/dispatches/{dispatchId}/reschedule", description: "Reschedule a dispatch window", roles: [Dispatcher], code: 200,
      input: [window_start, window_end], output: Dispatch,
      side_effects: ["window_start/window_end updated", "eta := new window_start", "re-runs overlap check"] }
  - { method: POST, path: "/v1/dispatches/{dispatchId}/cancel", description: "Cancel a dispatch", roles: [Dispatcher], code: 200,
      input: [], output: Dispatch, side_effects: ["status -> CANCELLED", "frees technician window"] }

  # ---- Permit ----
  - { method: POST, path: "/v1/permits", description: "File a permit for a job", roles: [Dispatcher], code: 201,
      input: [job_id, jurisdiction, permit_number], output: Permit, side_effects: ["status := APPLIED"] }
  - { method: GET, path: "/v1/permits/{permitId}", description: "Get a permit", roles: [Dispatcher, Inspector], code: 200,
      input: [], output: Permit, side_effects: [] }
  - { method: GET, path: "/v1/permits", description: "List permits (filter by job)", roles: [Dispatcher, Inspector], code: 200,
      input: ["job_id?", "status?", "limit?", "offset?"], output: "Permit[]", side_effects: [] }
  - { method: POST, path: "/v1/permits/{permitId}/issue", description: "Authority issues the permit", roles: [Inspector], code: 200,
      input: [], output: Permit, side_effects: ["status -> ISSUED"] }
  - { method: POST, path: "/v1/permits/{permitId}/schedule-inspection", description: "Schedule (or re-schedule) the inspection", roles: [Dispatcher], code: 200,
      input: [inspection_at], output: Permit, side_effects: ["inspection_at set", "status -> INSPECTION_SCHEDULED"] }
  - { method: POST, path: "/v1/permits/{permitId}/record-inspection", description: "Inspector records the inspection result", roles: [Inspector], code: 200,
      input: [result], output: Permit, side_effects: ["status -> PASSED if result=PASS else FAILED"] }

  # ---- MaterialUsage ----
  - { method: POST, path: "/v1/material-usages", description: "Record material consumed on a job (debits truck stock)", roles: [Technician], code: 201,
      input: [job_id, technician_id, sku_id, quantity], output: MaterialUsage,
      side_effects: ["line_total_cents := quantity * SKU.unit_price_cents", "TruckStockItem.quantity_on_hand -= quantity", "low_stock recomputed"] }
  - { method: GET, path: "/v1/material-usages/{usageId}", description: "Get a material usage", roles: [Dispatcher, Technician], code: 200,
      input: [], output: MaterialUsage, side_effects: [] }
  - { method: GET, path: "/v1/material-usages", description: "List material usages (filter by job, technician, or sku)", roles: [Dispatcher, Technician], code: 200,
      input: ["job_id?", "technician_id?", "sku_id?", "limit?", "offset?"], output: "MaterialUsage[]", side_effects: [] }
  - { method: POST, path: "/v1/material-usages/{usageId}/void", description: "Void a material usage (restores truck stock)", roles: [Dispatcher, Technician], code: 200,
      input: [], output: MaterialUsage, side_effects: ["voided := true", "TruckStockItem.quantity_on_hand += quantity", "low_stock recomputed"] }

  # ---- Invoice ----
  - { method: GET, path: "/v1/invoices/{invoiceId}", description: "Get an invoice", roles: [Dispatcher, Customer], code: 200,
      input: [], output: Invoice, side_effects: [] }
  - { method: GET, path: "/v1/invoices", description: "List invoices (filter by job)", roles: [Dispatcher, Customer], code: 200,
      input: ["job_id?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }

  # ---- Callback ----
  - { method: POST, path: "/v1/callbacks", description: "File a warranty callback against an invoiced/closed job", roles: [Customer, Dispatcher], code: 201,
      input: [job_id, reason], output: Callback,
      side_effects: ["covered_by_warranty := (current_utc <= job.warranty_until)", "status := OPEN",
                     "if covered: job INVOICED/CLOSED -> WARRANTY"] }
  - { method: GET, path: "/v1/callbacks/{callbackId}", description: "Get a callback", roles: [Dispatcher, Customer], code: 200,
      input: [], output: Callback, side_effects: [] }
  - { method: GET, path: "/v1/callbacks", description: "List callbacks (filter by job)", roles: [Dispatcher, Customer], code: 200,
      input: ["job_id?", "status?", "limit?", "offset?"], output: "Callback[]", side_effects: [] }
  - { method: POST, path: "/v1/callbacks/{callbackId}/resolve", description: "Resolve a callback", roles: [Dispatcher], code: 200,
      input: [], output: Callback, side_effects: ["status -> RESOLVED"] }

  # ---- Dispatch queue (computed read) ----
  - { method: GET, path: "/v1/dispatch-queue", description: "Ranked next-job recommendations for a zone (dispatch_ranking)", roles: [Dispatcher], code: 200,
      input: ["zone", "limit?", "offset?"], output: "ServiceJob[]", side_effects: [] }

  # ---- Test-driving: system clock ----
  - { method: POST, path: "/v1/_clock/set", description: "Set the server's current UTC clock (test-driving)", roles: [Dispatcher], code: 200,
      input: [to_iso8601], output: null, side_effects: ["server current_utc := to_iso8601"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers or unknown role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed actor does not own the targeted resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, non-positive quantity, window_start >= window_end" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which this transition is defined" }
  - { id: ERR_LICENSE_INSUFFICIENT, http: 409, condition: "PANEL/EV_CHARGER dispatch needs a MASTER technician" }
  - { id: ERR_TECH_NOT_ON_CALL, http: 409, condition: "EMERGENCY dispatch needs an on_call technician" }
  - { id: ERR_ZONE_MISMATCH, http: 409, condition: "Technician.service_zone does not match the job's zone" }
  - { id: ERR_TECH_DOUBLE_BOOKED, http: 409, condition: "Dispatch window overlaps an active dispatch on the same technician" }
  - { id: ERR_PERMIT_NOT_PASSED, http: 409, condition: "Job requiring a permit cannot complete until permit is PASSED" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Material usage quantity exceeds truck quantity_on_hand" }
  - { id: ERR_ALREADY_INVOICED, http: 409, condition: "Job already has an Invoice" }
  - { id: ERR_OPEN_CALLBACK, http: 409, condition: "Cannot close a job with an OPEN callback" }
  - { id: ERR_NOT_WARRANTY_COVERED, http: 409, condition: "Callback filed after warranty_until cannot reopen the job" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Unique constraint violation (Customer.email or MaterialSku.sku_code)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Dispatcher
    description: "Back-office operator: provisions catalog/customers/technicians, builds estimates, dispatches, files permits, invoices and closes jobs."
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/customers — create customer"
      - "POST /v1/technicians — create technician"
      - "POST /v1/membership-plans — create plan"
      - "POST /v1/material-skus — create SKU"
      - "POST /v1/truck-stock-items — stock truck"
      - "POST /v1/truck-stock-items/{id}/restock — restock"
      - "POST /v1/estimates — create estimate"
      - "POST /v1/estimates/{id}/send — send estimate"
      - "POST /v1/dispatches — dispatch technician"
      - "POST /v1/dispatches/{id}/reschedule — reschedule"
      - "POST /v1/dispatches/{id}/cancel — cancel dispatch"
      - "POST /v1/permits — file permit"
      - "POST /v1/permits/{id}/schedule-inspection — schedule inspection"
      - "POST /v1/service-jobs/{id}/invoice — invoice job"
      - "POST /v1/service-jobs/{id}/close — close job"
      - "POST /v1/callbacks/{id}/resolve — resolve callback"
      - "GET /v1/dispatch-queue — ranked queue"
      - "POST /v1/_clock/set — set clock (test-driving)"
    shared_operations:
      - "POST /v1/memberships — enroll (shared with Customer)"
      - "POST /v1/memberships/{id}/cancel — cancel membership (shared with Customer)"
      - "POST /v1/service-jobs — create job (shared with Customer)"
      - "POST /v1/service-jobs/{id}/cancel — cancel job (shared with Customer)"
      - "POST /v1/material-usages/{id}/void — void usage (shared with Technician)"
      - "POST /v1/callbacks — file callback (shared with Customer)"
      - "GET endpoints — broad read access"

  - name: Customer
    description: "End customer; acts on own jobs, accepts/rejects estimates, enrolls in plans, files warranty callbacks."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /v1/estimates/{id}/accept — accept estimate (own job)"
      - "POST /v1/estimates/{id}/reject — reject estimate (own job)"
    shared_operations:
      - "POST /v1/memberships — enroll (own customer)"
      - "POST /v1/memberships/{id}/cancel — cancel own membership"
      - "POST /v1/service-jobs — create own job"
      - "POST /v1/service-jobs/{id}/cancel — cancel own job"
      - "POST /v1/callbacks — file callback on own job"
      - "GET endpoints — read own resources"

  - name: Technician
    description: "Field worker; departs/arrives on dispatches, completes jobs, records and voids material usage."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /v1/dispatches/{id}/depart — depart (assigned tech)"
      - "POST /v1/dispatches/{id}/arrive — arrive (assigned tech)"
      - "POST /v1/service-jobs/{id}/complete — complete job"
      - "POST /v1/material-usages — record material (own truck)"
    shared_operations:
      - "POST /v1/material-usages/{id}/void — void usage (shared with Dispatcher)"
      - "GET endpoints — read assigned work"

  - name: Inspector
    description: "Jurisdiction inspector; issues permits and records inspection outcomes."
    identity: "opaque"
    exclusive_operations:
      - "POST /v1/permits/{id}/issue — issue permit"
      - "POST /v1/permits/{id}/record-inspection — record inspection result"
    shared_operations:
      - "GET /v1/permits, GET /v1/permits/{id} — read permits"
