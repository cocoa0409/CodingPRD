            - { call: "POST /closet/clients/${c_id}/visits", payload: {}, as: Volunteer, as_user_id: "${v1_id}", captures: { err: $.data.error_id } }
            - { call: "POST /closet/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /closet/clients/${c_id}/visits", payload: {}, as: Volunteer, as_user_id: "${v1_id}", captures: { vs2_st: $.data.status } }
          assert:
            - "err == ERR_VISIT_COOLDOWN_ACTIVE  (one second short of 14 days)"
