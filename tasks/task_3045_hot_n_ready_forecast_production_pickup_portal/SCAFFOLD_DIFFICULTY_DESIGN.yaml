              as: StoreManager
              captures: { dp_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "PEP", name: "Pepperoni", list_price_cents: 600 }
              as: StoreManager
              captures: { p_pep: $.data.id }
          trigger:
            - call: "POST /orders"
              payload:
                store_day_id: "${sd_id}"
                daypart_id: "${dp_id}"
                customer_id: "cust-5"
                kind: "PORTAL_STANDARD"
                lines:
                  - { product_id: "${p_pep}", quantity: 1, customized: true }
              as: Customer
              as_user_id: "cust-5"
              captures: { create_err: $.data.error_id }
          assert:
            - "order create returns ERR_CUSTOMIZATION_NOT_ALLOWED (priority 13 wins over priority 14)"
            - "order create does NOT return ERR_DAYPART_NOT_ACTIVE"

