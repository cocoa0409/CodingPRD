scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: success_fee_split_negotiation_vs_refund_basis
        grounds:
          - calculations.success_fee_split
          - state_machines.NegotiationCase.PROPOSED_to_WON
          - state_machines.RefundClaim.UNDER_REVIEW_to_REFUNDED
          - entities.NegotiationCase.fields.gross_annual_savings_cents
          - entities.RefundClaim.fields.approved_refund_cents
        distinguishing_aspect: |
          The same success_fee_split fee table is applied on two different entity domains:
          NegotiationCase gross is a DELTA (baseline_annual - agreed_annual = 12000), while
          RefundClaim gross is an ABSOLUTE approved amount (3000); the two grosses sit in
          different tiers (MID 0.35 vs LOW 0.40), producing fees 4200 vs 1200.
        test_recipe:
          setup:
            - "An ACTIVE member with a LINKED account, one CONFIRMED MONTHLY charge of 5000 (annualized 60000) and one CONFIRMED MONTHLY charge of 2000."
            - "A concierge agent; one NegotiationCase OPEN on the 60000-baseline charge; one RefundClaim PRICE_DROP filed on the 2000 charge."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "dv@x.com", full_name: "DV Member" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Acme Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "StreamCo", amount_cents: 5000, cadence: "MONTHLY", category: "STREAMING", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rc1_id: "$.data.id" }
            - call: "POST /recurring-charges/${rc1_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "NewsCo", amount_cents: 2000, cadence: "MONTHLY", category: "OTHER", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rc2_id: "$.data.id" }
            - call: "POST /recurring-charges/${rc2_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /concierge-agents"
              payload: { display_name: "Agent A", max_open_cases: 5 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /negotiation-cases"
              payload: { member_id: "${m_id}", recurring_charge_id: "${rc1_id}", assigned_agent_id: "${ag_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { nc_id: "$.data.id" }
            - call: "POST /negotiation-cases/${nc_id}/propose"
              payload: { offered_annual_cost_cents: 48000 }
              as: ConciergeAgent
              as_user_id: "${ag_id}"
            - call: "POST /refund-claims"
              payload: { member_id: "${m_id}", recurring_charge_id: "${rc2_id}", claim_type: "PRICE_DROP", observed_old_amount_cents: 2000, observed_new_amount_cents: 1500 }
              as: Member
              as_user_id: "${m_id}"
              captures: { rcl_id: "$.data.id" }
            - call: "POST /refund-claims/${rcl_id}/start-review"
              payload: {}
              as: ConciergeAgent
              as_user_id: "${ag_id}"
          trigger:
            - call: "POST /negotiation-cases/${nc_id}/accept"
              payload: {}
              as: ConciergeAgent
              as_user_id: "${ag_id}"
            - call: "POST /refund-claims/${rcl_id}/approve"
              payload: { approved_refund_cents: 3000 }
              as: ConciergeAgent
              as_user_id: "${ag_id}"
          assert:
            - "NegotiationCase.${nc_id}.gross_annual_savings_cents == 12000"
            - "NegotiationCase.${nc_id}.success_fee_cents == 4200"
            - "NegotiationCase.${nc_id}.member_net_savings_cents == 7800"
            - "RefundClaim.${rcl_id}.claimed_refund_cents == 3000"
            - "RefundClaim.${rcl_id}.success_fee_cents == 1200"
            - "RefundClaim.${rcl_id}.member_net_savings_cents == 1800"

      - name: lifetime_rollup_vs_savings_report_basis
        grounds:
          - calculations.member_lifetime_savings_rollup
          - calculations.savings_report_summary
          - entities.Member.fields.lifetime_member_savings_cents
          - entities.SavingsLedgerEntry.fields.transfer_status
        distinguishing_aspect: |
          Two valid aggregations on different subjects diverge: the Member rollup counts only
          TERMINAL realized rows (WON cases + REFUNDED claims), whereas the savings-report adds
          a pending_transfer_cents bucket over PENDING ledger entries; for one WON case
          (net 7800) not yet transferred, rollup lifetime_member_savings_cents==7800 while the
          report's transferred_cents==0 and pending_transfer_cents==7800.
        test_recipe:
          setup:
            - "An ACTIVE member with one WON NegotiationCase (gross 12000, net 7800) and its PENDING SavingsLedgerEntry; no transfer performed yet."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "dv2@x.com", full_name: "DV2 Member" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Acme Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "StreamCo", amount_cents: 5000, cadence: "MONTHLY", category: "STREAMING", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rc_id: "$.data.id" }
            - call: "POST /recurring-charges/${rc_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /concierge-agents"
              payload: { display_name: "Agent A", max_open_cases: 5 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /negotiation-cases"
              payload: { member_id: "${m_id}", recurring_charge_id: "${rc_id}", assigned_agent_id: "${ag_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { nc_id: "$.data.id" }
            - call: "POST /negotiation-cases/${nc_id}/propose"
              payload: { offered_annual_cost_cents: 48000 }
              as: ConciergeAgent
              as_user_id: "${ag_id}"
            - call: "POST /negotiation-cases/${nc_id}/accept"
              payload: {}
              as: ConciergeAgent
              as_user_id: "${ag_id}"
          trigger:
            - call: "GET /members/${m_id}/savings-report"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Member.${m_id}.lifetime_gross_savings_cents == 12000"
            - "Member.${m_id}.lifetime_member_savings_cents == 7800"
            - "savings-report.realized_net_cents == 7800"
            - "savings-report.transferred_cents == 0"
            - "savings-report.pending_transfer_cents == 7800"
            - "savings-report.total_fees_cents == 4200"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: success_fee_split_tier_then_round_then_cap_order
        grounds:
          - calculations.success_fee_split
          - state_machines.NegotiationCase.PROPOSED_to_WON
          - entities.NegotiationCase.fields.success_fee_cents
        distinguishing_aspect: |
          Mode (c) circular-looking/pinned-evaluation-order: the fee depends on a tier
          selected from gross, then round_half_up, then a cap, then a floor — the scaffold
          pins this order; with gross 700000 the HIGH-tier raw fee (210000) is capped to
          FEE_CAP_CENTS 20000, so success_fee_cents==20000 and member_net==680000.
        test_recipe:
          setup:
            - "An ACTIVE member with a CONFIRMED ANNUAL charge of 800000 (baseline_annual 800000); a WON-bound case proposed at agreed 100000 gives gross 700000."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "cf1@x.com", full_name: "CF1 Member" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Acme Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "BigInsure", amount_cents: 800000, cadence: "ANNUAL", category: "INSURANCE", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rc_id: "$.data.id" }
            - call: "POST /recurring-charges/${rc_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /concierge-agents"
              payload: { display_name: "Agent A", max_open_cases: 5 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /negotiation-cases"
              payload: { member_id: "${m_id}", recurring_charge_id: "${rc_id}", assigned_agent_id: "${ag_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { nc_id: "$.data.id" }
            - call: "POST /negotiation-cases/${nc_id}/propose"
              payload: { offered_annual_cost_cents: 100000 }
              as: ConciergeAgent
              as_user_id: "${ag_id}"
          trigger:
            - call: "POST /negotiation-cases/${nc_id}/accept"
              payload: {}
              as: ConciergeAgent
              as_user_id: "${ag_id}"
          assert:
            - "NegotiationCase.${nc_id}.gross_annual_savings_cents == 700000"
            - "NegotiationCase.${nc_id}.success_fee_cents == 20000"
            - "NegotiationCase.${nc_id}.member_net_savings_cents == 680000"

      - name: refund_pursuit_pricedrop_multiinput_nonlinear
        grounds:
          - calculations.refund_pursuit_amount
          - entities.RefundClaim.fields.claimed_refund_cents
          - entities.RefundClaim.fields.claim_type
        distinguishing_aspect: |
          Mode (a) >=3 inputs with branch-on-state non-linearity: claimed_refund_cents
          branches on claim_type and combines observed_old, observed_new, and LOOKBACK_CYCLES;
          PRICE_DROP yields max(0, old-new)*LOOKBACK = (2000-1500)*6 = 3000, distinct from the
          DOUBLE_BILL/SERVICE_OUTAGE branches.
        test_recipe:
          setup:
            - "An ACTIVE member with a CONFIRMED charge; a PRICE_DROP claim filed with old 2000 new 1500."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "cf2@x.com", full_name: "CF2 Member" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Acme Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "NewsCo", amount_cents: 2000, cadence: "MONTHLY", category: "OTHER", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rc_id: "$.data.id" }
            - call: "POST /recurring-charges/${rc_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /refund-claims"
              payload: { member_id: "${m_id}", recurring_charge_id: "${rc_id}", claim_type: "PRICE_DROP", observed_old_amount_cents: 2000, observed_new_amount_cents: 1500 }
              as: Member
              as_user_id: "${m_id}"
              captures: { rcl_id: "$.data.id" }
          assert:
            - "RefundClaim.${rcl_id}.claimed_refund_cents == 3000"
            - "RefundClaim.${rcl_id}.status == FILED"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: negotiation_case_proposed_countered_cycle
        grounds:
          - state_machines.NegotiationCase.PROPOSED_to_COUNTERED
          - state_machines.NegotiationCase.COUNTERED_to_PROPOSED
          - entities.NegotiationCase.fields.round_count
        distinguishing_aspect: |
          NegotiationCase exhibits a cycle PROPOSED->COUNTERED->PROPOSED on the same entity;
          each propose increments round_count, so after propose, counter, propose the
          round_count==2 and status==PROPOSED (a state already visited).
        test_recipe:
          setup:
            - "An ACTIVE member with a CONFIRMED charge and an OPEN NegotiationCase assigned to an agent."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "nl1@x.com", full_name: "NL1 Member" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Acme Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "StreamCo", amount_cents: 5000, cadence: "MONTHLY", category: "STREAMING", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rc_id: "$.data.id" }
            - call: "POST /recurring-charges/${rc_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /concierge-agents"
              payload: { display_name: "Agent A", max_open_cases: 5 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /negotiation-cases"
              payload: { member_id: "${m_id}", recurring_charge_id: "${rc_id}", assigned_agent_id: "${ag_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { nc_id: "$.data.id" }
          trigger:
            - call: "POST /negotiation-cases/${nc_id}/propose"
              payload: { offered_annual_cost_cents: 55000 }
              as: ConciergeAgent
              as_user_id: "${ag_id}"
            - call: "POST /negotiation-cases/${nc_id}/counter"
              payload: { counter_annual_cost_cents: 52000 }
              as: ConciergeAgent
              as_user_id: "${ag_id}"
            - call: "POST /negotiation-cases/${nc_id}/propose"
              payload: { offered_annual_cost_cents: 50000 }
              as: ConciergeAgent
              as_user_id: "${ag_id}"
          assert:
            - "NegotiationCase.${nc_id}.status == PROPOSED"
            - "NegotiationCase.${nc_id}.round_count == 2"
            - "NegotiationCase.${nc_id}.current_offer_annual_cost_cents == 50000"

      - name: refund_claim_denied_disputed_review_loop
        grounds:
          - state_machines.RefundClaim.DENIED_to_DISPUTED
          - state_machines.RefundClaim.DISPUTED_to_UNDER_REVIEW
          - entities.RefundClaim.fields.dispute_round
        distinguishing_aspect: |
          RefundClaim (a different entity than NegotiationCase) cycles
          UNDER_REVIEW->DENIED->DISPUTED->UNDER_REVIEW; after one full loop dispute_round==1
          and status==UNDER_REVIEW (a previously visited state).
        test_recipe:
          setup:
            - "An ACTIVE member with a CONFIRMED charge and a DENIED RefundClaim (started review then denied)."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "nl2@x.com", full_name: "NL2 Member" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Acme Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "NewsCo", amount_cents: 2000, cadence: "MONTHLY", category: "OTHER", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rc_id: "$.data.id" }
            - call: "POST /recurring-charges/${rc_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /concierge-agents"
              payload: { display_name: "Agent A", max_open_cases: 5 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /refund-claims"
              payload: { member_id: "${m_id}", recurring_charge_id: "${rc_id}", claim_type: "DOUBLE_BILL", observed_old_amount_cents: 2000, observed_new_amount_cents: 0 }
              as: Member
              as_user_id: "${m_id}"
              captures: { rcl_id: "$.data.id" }
            - call: "POST /refund-claims/${rcl_id}/start-review"
              payload: {}
              as: ConciergeAgent
              as_user_id: "${ag_id}"
            - call: "POST /refund-claims/${rcl_id}/deny"
              payload: {}
              as: ConciergeAgent
              as_user_id: "${ag_id}"
              captures: { v_denied: "$.data.version" }
          trigger:
            - call: "POST /refund-claims/${rcl_id}/dispute"
              payload: { expected_refund_claim_version: "${v_denied}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /refund-claims/${rcl_id}/start-review"
              payload: {}
              as: ConciergeAgent
              as_user_id: "${ag_id}"
          assert:
            - "RefundClaim.${rcl_id}.status == UNDER_REVIEW"
            - "RefundClaim.${rcl_id}.dispute_round == 1"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: negotiation_won_cascade_ledger_member_depth3
        grounds:
          - state_machines.NegotiationCase.PROPOSED_to_WON
          - calculations.success_fee_split
          - calculations.member_lifetime_savings_rollup
          - entities.SavingsLedgerEntry.fields.member_net_cents
          - entities.Member.fields.lifetime_member_savings_cents
        distinguishing_aspect: |
          Depth-3 chain from the WON transition: (1) accept mutates NegotiationCase
          (sets agreed/gross/fee/net); (2) that mutation creates a SavingsLedgerEntry booking
          net 7800; (3) the ledger booking triggers the Member rollup recompute setting
          lifetime_member_savings_cents 7800 — each link caused by the prior link.
        test_recipe:
          setup:
            - "An ACTIVE member with CONFIRMED MONTHLY charge 5000 (baseline_annual 60000) and an OPEN case proposed at 48000."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "tc1@x.com", full_name: "TC1 Member" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Acme Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "StreamCo", amount_cents: 5000, cadence: "MONTHLY", category: "STREAMING", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rc_id: "$.data.id" }
            - call: "POST /recurring-charges/${rc_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /concierge-agents"
              payload: { display_name: "Agent A", max_open_cases: 5 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /negotiation-cases"
              payload: { member_id: "${m_id}", recurring_charge_id: "${rc_id}", assigned_agent_id: "${ag_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { nc_id: "$.data.id" }
            - call: "POST /negotiation-cases/${nc_id}/propose"
              payload: { offered_annual_cost_cents: 48000 }
              as: ConciergeAgent
              as_user_id: "${ag_id}"
          trigger:
            - call: "POST /negotiation-cases/${nc_id}/accept"
              payload: {}
              as: ConciergeAgent
              as_user_id: "${ag_id}"
          assert:
            - "NegotiationCase.${nc_id}.member_net_savings_cents == 7800"
            - "SavingsLedgerEntry(member_id=${m_id}, negotiation_case_id=${nc_id}).member_net_cents == 7800"
            - "SavingsLedgerEntry(member_id=${m_id}, negotiation_case_id=${nc_id}).transfer_status == PENDING"
            - "Member.${m_id}.lifetime_member_savings_cents == 7800"

      - name: ledger_transfer_cascade_savings_balance_depth2
        grounds:
          - state_machines.SavingsLedgerEntry.PENDING_to_TRANSFERRED
          - entities.SavingsLedgerEntry.fields.transfer_status
          - entities.SavingsAccount.fields.balance_cents
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (the transfer transition, not accept):
          (1) transfer mutates the SavingsLedgerEntry to TRANSFERRED; (2) that mutation
          increments SavingsAccount.balance_cents by member_net_cents 7800 — the balance bump
          is caused by the entry's status change, not by the original accept.
        test_recipe:
          setup:
            - "An ACTIVE member with an OPEN SavingsAccount linked as savings_account_id, and one PENDING SavingsLedgerEntry of member_net 7800 from a WON case."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "tc2@x.com", full_name: "TC2 Member" }
              as: Anonymous
              captures: { m_id: "$.data.id" }
            - call: "POST /savings-accounts"
              payload: { member_id: "${m_id}", nickname: "Rainy Day" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sa_id: "$.data.id" }
            - call: "PATCH /members/${m_id}"
              payload: { savings_account_id: "${sa_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /linked-accounts"
              payload: { member_id: "${m_id}", institution_name: "Acme Bank", account_type: "CHECKING" }
              as: Member
              as_user_id: "${m_id}"
              captures: { la_id: "$.data.id" }
            - call: "POST /recurring-charges"
              payload: { linked_account_id: "${la_id}", merchant_name: "StreamCo", amount_cents: 5000, cadence: "MONTHLY", category: "STREAMING", first_seen_utc: "2026-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { rc_id: "$.data.id" }
            - call: "POST /recurring-charges/${rc_id}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /concierge-agents"
              payload: { display_name: "Agent A", max_open_cases: 5 }
              as: PlatformAdmin
              captures: { ag_id: "$.data.id" }
            - call: "POST /negotiation-cases"
              payload: { member_id: "${m_id}", recurring_charge_id: "${rc_id}", assigned_agent_id: "${ag_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { nc_id: "$.data.id" }
            - call: "POST /negotiation-cases/${nc_id}/propose"
              payload: { offered_annual_cost_cents: 48000 }
              as: ConciergeAgent
              as_user_id: "${ag_id}"
