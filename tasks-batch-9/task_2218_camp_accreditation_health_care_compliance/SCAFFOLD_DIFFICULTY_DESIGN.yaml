          - validations.priority_ordering
          - endpoints.PATCH_/accreditation/standard-evaluations/{evaluationId}/self-assessment
        distinguishing_aspect: |
          A state-category rule at priority 23 against a business-referential rule at
          priority 49 - the widest gap of the two pairs and across two different
          categories. Both are violated by one request, and the control call proves
          the low-priority rule is genuinely armed: the same mismatched-plan payload
