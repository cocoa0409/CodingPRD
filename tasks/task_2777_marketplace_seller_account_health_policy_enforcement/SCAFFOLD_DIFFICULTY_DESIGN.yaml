      - name: hold_coverage_gap_exactly_buffer_hours_is_rejected
        grounds:
          - "validations.priority_110 (ERR_HOLD_COVERAGE_OVERLAP)"
          - "state_machines.DisbursementHold (coverage precondition)"
          - "calculations.reserve_requirement_cents (ROLLING variant)"
        distinguishing_aspect: |
          A third metric on a third endpoint: the HOLD_BUFFER_HOURS separation on
          POST /disbursement-holds. Two ACTIVE coverage intervals must be separated by MORE than
          24 hours, so a gap of exactly 24h00m00s is REJECTED and 24h00m01s is accepted. The
          accepted row also proves the ROLLING reserve re-reads the ALREADY REDUCED available
          balance: 10 percent of 270000, not of the original 300000.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-BUF-1 (LISTING_ACCURACY, 1.00, ACCOUNT, requires_poa false); one violation is left UNDER_INVESTIGATION so disbursement_state is RESERVE_HELD and enforcement_state stays ACTIVE."
            - "Seller credited 300000 cents; metric_tier null and balance 0.00, so risk_tier is TIER_1 and RESERVE_ROLLING_PCT is 0.10."
            - "Hold h1 covers the closed interval [2026-08-01T00:00:00.000Z, 2026-08-10T00:00:00.000Z] and holds 30000 -> available 270000, held 30000."
            - "expected_seller_version is re-read before every attempt so the OCC rule never masks the interval error."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
