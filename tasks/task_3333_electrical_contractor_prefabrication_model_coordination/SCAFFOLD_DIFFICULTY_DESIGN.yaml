  - rule_id: boundary_precision_check
    instances:
      - name: rack_capacity_margin_inclusive_at_ninety_five_percent
        grounds:
          - calculations.rack_value_capacity_check
          - validations[priority=21]
          - errors[ERR_RACK_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Numeric margin boundary on its own metric and endpoint: with value_capacity_cf 400.0 the margin is exactly
          380.0, so a rack totalling exactly 380.0 is accepted while one totalling 380.02 is rejected - equality
          belongs to the passing side because the comparison is <=.
        test_recipe:
          setup:
            - "project P-B1 with one coordinated model version and two racks of value_capacity_cf 400.0: R-B-EDGE and R-B-OVER"
            - "one work package O-B1 holding three components: two of quantity 190.0 on R-B-EDGE and one of quantity 190.01 on R-B-OVER"
