  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: critic_accreditation_revoked_reapply_cycle
        grounds:
          - state_machines.Critic.REVOKED_to_APPLIED
          - state_machines.Critic.APPLIED_to_ACCREDITED
        distinguishing_aspect: |
          Cycle on the Critic entity: ACCREDITED -> UNDER_REVIEW -> REVOKED ->
          APPLIED -> ACCREDITED completes a full loop, and after the loop the
          critic can publish reviews again — a linear pipeline could not express
          re-application.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; critic CA ACCREDITED; release R1 OPEN with embargo lifted."
          setup_api_calls:
            - *k_clock
            - *k_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *k_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - *k_ar
            - call: "POST /accreditation-reviews/${ar}/transition"
              payload: { action: "BEGIN_REVIEW" }
              as: AccreditationBoard
            - call: "POST /accreditation-reviews/${ar}/transition"
              payload: { action: "RULE_REVOKE" }
              as: AccreditationBoard
          trigger:
            - call: "POST /critics/${ca}/transition"
              payload: { action: "REAPPLY" }
              as: Critic
              as_user_id: "${ca}"
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - call: "POST /releases/${r1}/reviews"
              payload: { critic_id: "${ca}", body_text: "Back and better.", self_designation: "FRESH" }
              as: Critic
              as_user_id: "${ca}"
              captures: { rwx: $.data.id }
            - call: "POST /reviews/${rwx}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${ca}"
          assert:
            - "after REAPPLY, Critic.${ca}.accreditation_status == APPLIED"
            - "after board ACCREDIT, Critic.${ca}.accreditation_status == ACCREDITED"
            - "the new review reaches PUBLISHED (the cycle restored full capability)"
      - name: dispute_filed_triaged_returned_refiling_loop
        grounds:
          - state_machines.Dispute.TRIAGED_to_FILED
          - state_machines.Dispute.TRIAGED_to_UPHELD
        distinguishing_aspect: |
          Branching-with-revert on the Dispute entity (different entity than the
          Critic cycle): FILED -> TRIAGED -> FILED -> TRIAGED -> UPHELD traverses
          the RETURN revert branch, and the final ruling still fires the
          reclassification cascade — proving the loop did not consume the ruling.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; CA and CC ACCREDITED; R1 OPEN, embargo lifted; CA publishes a FRESH review RA on R1; CC files a CLASSIFICATION dispute D1 requesting ROTTEN; D1 TRIAGED."
          setup_api_calls:
            - *k_clock
            - *k_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_ca
            - call: "POST /critics/${ca}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_cc
            - call: "POST /critics/${cc}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *k_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - *k_ra
            - call: "POST /reviews/${ra}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${ca}"
            - *k_d1
            - call: "POST /disputes/${d1}/transition"
              payload: { action: "TRIAGE" }
              as: AccreditationBoard
          trigger:
            - call: "POST /disputes/${d1}/transition"
              payload: { action: "RETURN" }
              as: AccreditationBoard
            - call: "POST /disputes/${d1}/transition"
              payload: { action: "TRIAGE" }
              as: AccreditationBoard
            - call: "GET /disputes/${d1}"
              as: AccreditationBoard
              captures: { d1_v: $.data.version }
            - call: "POST /disputes/${d1}/transition"
              payload: { action: "RULE_UPHOLD", expected_dispute_version: "${d1_v}" }
              as: AccreditationBoard
            - call: "GET /reviews/${ra}"
              as: AccreditationBoard
          assert:
            - "after RETURN, Dispute.${d1}.status == FILED"
            - "after second TRIAGE + RULE_UPHOLD, Dispute.${d1}.status == UPHELD"
            - "CriticReview.${ra}.classification == ROTTEN and status == PUBLISHED (cascade survived the loop)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: upheld_classification_dispute_cascades_to_certification_loss
        grounds:
          - state_machines.Dispute.TRIAGED_to_UPHELD
          - state_machines.CriticReview.FLAGGED_to_PUBLISHED
          - calculations.tomatometer_score
          - calculations.certification_status
        distinguishing_aspect: |
          Depth-3 cascade triggered by a dispute ruling: RULE_UPHOLD mutates
          CriticReview.classification (hop 1); that mutation triggers a
          tomatometer recompute (hop 2: the CERTIFIED snapshot flips from
          5/5 fresh = 100 pct to 4/5 fresh = 80 pct and the old snapshot is
          superseded); the recompute re-runs the certification gate chain on the
          new snapshot (hop 3), keeping CERTIFIED_FRESH only because all three
          gates still pass.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; six accredited critics: C1,C2 top critics plus C3..C6 regular; R1 OPEN, embargo lifted."
            - "C1..C5 publish FRESH; C6 publishes FRESH as well — wait: certification needs N>=5, T>=2, P>=75. Use C1..C5 all FRESH (N=5,T=2,P=100 -> CERTIFIED_FRESH). CC (C6) files CLASSIFICATION dispute against C5's review requesting ROTTEN; dispute TRIAGED."
          setup_api_calls:
            - *k_clock
            - *k_pub
            - call: "POST /publications/${pub1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_c1
            - call: "POST /critics/${c1}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - &k_c2t
              call: "POST /critics"
              payload: { full_name: "Top Critic Two", publication_id: "${pub1}", is_top_critic: true }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /critics/${c2}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_c3
            - call: "POST /critics/${c3}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_c4
            - call: "POST /critics/${c4}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_c5
            - call: "POST /critics/${c5}/transition"
              payload: { action: "ACCREDIT" }
              as: AccreditationBoard
            - *k_title
            - call: "PATCH /titles/${t1}"
              payload: { posture: "OPEN" }
              as: PlatformAdmin
            - *k_rel
            - call: "POST /releases/${r1}/transition"
              payload: { action: "OPEN" }
              as: PlatformAdmin
            - call: "POST /releases/${r1}/reviews"
              payload: { critic_id: "${c1}", body_text: "Great.", self_designation: "FRESH" }
              as: Critic
              as_user_id: "${c1}"
              captures: { rv1: $.data.id }
            - call: "POST /reviews/${rv1}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${c1}"
            - *k_rv2
            - call: "POST /reviews/${rv2}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${c2}"
            - *k_rv3
            - call: "POST /reviews/${rv3}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${c3}"
            - *k_rv4
            - call: "POST /reviews/${rv4}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${c4}"
            - *k_rv5
            - call: "POST /reviews/${rv5}/transition"
              payload: { action: "PUBLISH" }
              as: Critic
              as_user_id: "${c5}"
            - &k_d5
              call: "POST /disputes"
              payload: { dispute_kind: "CLASSIFICATION", subject_review_id: "${rv5}", filed_by_critic_id: "${c1}", requested_classification: "ROTTEN" }
              as: Critic
              as_user_id: "${c1}"
              captures: { d5: $.data.id }
            - call: "POST /disputes/${d5}/transition"
              payload: { action: "TRIAGE" }
              as: AccreditationBoard
          trigger:
            - call: "GET /disputes/${d5}"
              as: AccreditationBoard
              captures: { d5_v: $.data.version }
            - call: "POST /disputes/${d5}/transition"
              payload: { action: "RULE_UPHOLD", expected_dispute_version: "${d5_v}" }
              as: AccreditationBoard
            - call: "GET /releases/${r1}"
              as: AccreditationBoard
            - call: "GET /releases/${r1}/score-snapshots"
              as: AccreditationBoard
          assert:
            - "CriticReview.${rv5}.classification == ROTTEN and status == PUBLISHED (hop 1)"
            - "the non-superseded CERTIFIED snapshot has positive_count == 4, total_count == 5, pct == 80 (hop 2)"
            - "Release.${r1}.certification re-evaluated on the new snapshot: still CERTIFIED_FRESH at 80 with T==2; assert tomatometer_pct == 80 and the previous CERTIFIED snapshot (pct == 100) has superseded == true (hop 3)"
      - name: publication_revocation_cascades_through_critics_to_scores
        grounds:
          - state_machines.Publication.ACCREDITED_to_REVOKED
          - state_machines.Critic.ACCREDITED_to_REVOKED
          - calculations.tomatometer_score
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (publication-level
          accreditation review ruling, not a dispute): publication review
          RULE_REVOKE -> Publication REVOKED -> each linked ACCREDITED Critic
          REVOKED -> every release with their PUBLISHED reviews recomputes its
          CERTIFIED tomatometer and supersedes snapshots.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; P1 ACCREDITED; CA and CB ACCREDITED under P1; R1 OPEN, embargo lifted."
            - "CA publishes FRESH on R1; CB publishes ROTTEN on R1."
            - "Publication-level AccreditationReview ARP over P1 is FILED and BEGIN_REVIEW."
          setup_api_calls:
            - *k_clock
