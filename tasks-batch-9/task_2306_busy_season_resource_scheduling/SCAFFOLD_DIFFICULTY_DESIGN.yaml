              payload: { full_name: "Pat Rowe", level: "PARTNER", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 45.00, hourly_bill_rate: 400.00 }
              as: FirmAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Sam Oyelaran", level: "SENIOR", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 40.00, hourly_bill_rate: 180.00 }
              as: FirmAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /scheduling/engagements"
              payload: { client_id: "${c_id}", engagement_partner_staff_id: "${p1_id}", service_line: "AUDIT", busy_season_year: 2026, deadline_date: "2026-10-15", budget_fee_amount: 6000.00 }
              as: SchedulingManager
              captures: { e1_id: $.data.id }
            - call: "POST /scheduling/engagement-phases"
              payload: { engagement_id: "${e1_id}", phase_type: "FIELDWORK", expected_hours: 60.00, window_start_date: "2026-08-03", window_end_date: "2026-08-31", required_level: "SENIOR" }
              as: SchedulingManager
              captures: { ph1_id: $.data.id }
            - call: "POST /scheduling/assignments"
              payload: { engagement_phase_id: "${ph1_id}", staff_member_id: "${s1_id}", start_date: "2026-08-05", end_date: "2026-08-06", allocated_hours: 10.00 }
              as: SchedulingManager
              captures: { a_eq_id: $.data.id }
          trigger:
            - call: "POST /scheduling/assignments"
              payload: { engagement_phase_id: "${ph1_id}", staff_member_id: "${s1_id}", start_date: "2026-08-05", end_date: "2026-08-06", allocated_hours: 0.01 }
              as: SchedulingManager
              captures: { err: $.data.error_id }
          assert:
            - "the setup booking succeeded: Assignment.${a_eq_id}.daily_hours == 10.00 and Assignment.${a_eq_id}.calendar_day_count == 1"
            - "StaffMember.${s1_id}.daily_capacity_hours == 10.00"
            - "HTTP status == 409"
            - "response.data.error_id == ERR_DAILY_CAPACITY_EXCEEDED"
            - "response.data.error_id != ERR_WORKLOAD_CAP_EXCEEDED (10.01 committed is far below the 50.00 weekly cap)"
            - "EngagementPhase.${ph1_id}.staffed_hours == 10.00"
            - "EngagementPhase.${ph1_id}.unstaffed_hours == 50.00"
            - "EngagementPhase.${ph1_id}.staffing_status == PARTIALLY_STAFFED"
            - "StaffMember.${s1_id}.committed_hours_current_week == 10.00"

