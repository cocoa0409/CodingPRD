        grounds:
          - state_machines.BuildOrder.QA_HOLD_to_REWORK
          - state_machines.BuildOrder.REWORK_to_SCRAPPED
          - calculations.model_first_pass_yield
          - state_machines.CertificationDossier.CERTIFIED_to_RESURVEY_REQUIRED
          - state_machines.MachineModel.RELEASED_to_SUSPENDED
          - state_machines.BuildOrder.ANY_OF_to_QUALITY_HOLD
          - calculations.rebate_qualification
        distinguishing_aspect: |
          Cascade depth 6 from one QA rejection: BuildOrder -> BuildOrder(SCRAPPED) -> MachineModel yield ->
          CertificationDossier(RESURVEY_REQUIRED) -> MachineModel(SUSPENDED) -> sibling BuildOrder(QUALITY_HOLD),
          and the rebate entitlement on both the dossier and the model collapses from 70000 to 0 along the way.
