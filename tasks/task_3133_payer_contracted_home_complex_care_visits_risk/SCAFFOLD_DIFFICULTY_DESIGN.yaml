              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /pcp-providers"
              payload: { care_program_id: "${prog_id}", npi: "1234567890", full_name: "Dr. Patel", practice_name: "DFM", notification_opt_in: true }
              as: PlatformAdmin
              captures: { pcp_id: $.data.id }
            - call: "POST /clinicians"
              payload: { care_program_id: "${prog_id}", full_name: "Nancy NP", discipline: "NP", home_zip: "75201", max_daily_visits: 5, urgent_response_qualified: true }
              as: PlatformAdmin
              captures: { np1_id: $.data.id }
            - call: "POST /members"
              payload: { care_program_id: "${prog_id}", payer_contract_id: "${contract_id}", member_external_id: "M-001", full_name: "Member X", date_of_birth: "1950-01-01T00:00:00Z", address_zip: "75201", pcp_provider_id: "${pcp_id}", chronic_condition_codes: ["CHF"], prior_ed_visits_12mo: 1, prior_inpatient_admits_12mo: 1 }
              as: PlatformAdmin
              captures: { member_id: $.data.id, member_v: $.data.version }
            - call: "POST /members/${member_id}/enrollments"
              payload: { outreach_channel: "PHONE", expected_member_version: "${member_v}" }
              as: EngagementSpecialist
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/begin-outreach"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /enrollments/${enr_id}/record-consent"
              payload: { consent_document_id: "DOC-1" }
              as: EngagementSpecialist
            - call: "PUT /enrollments/${enr_id}/care-team"
              payload: { primary_np_id: "${np1_id}" }
              as: CareCoordinator
            - call: "POST /enrollments/${enr_id}/care-team/activate"
              payload: {}
              as: CareCoordinator
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: EngagementSpecialist
            - call: "POST /urgent-episodes"
              payload: { enrollment_id: "${enr_id}", trigger_source: "MEMBER_CALL" }
              as: CareCoordinator
              captures: { ep_id: $.data.id }
            # Advance clock past sla_deadline; this also auto-lapses the TRIGGERED episode
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/advance_hours"
              payload: { by_hours: 1 }
              as: PlatformAdmin
            # Companion OCC setup: capture the member's CURRENT version, then create a fresh enrollment to bump it
            - call: "GET /members/${member_id}"
              payload: {}
              as: EngagementSpecialist
              captures: { member_v_now: $.data.version }
            - call: "POST /members/${member_id}/enrollments"
              payload: { outreach_channel: "MAIL", expected_member_version: "${member_v_now}" }
              as: EngagementSpecialist
              captures: { enr_new: $.data.id }
          trigger:
            # Temporal trigger — episode already auto-LAPSED
            - call: "POST /urgent-episodes/${ep_id}/dispatch"
              payload: {}
              as: CareCoordinator
              captures: { error_id_temporal: $.data.error_id }
            # OCC trigger — ${member_v_now} is now stale because enr_new bumped it
            - call: "POST /members/${member_id}/enrollments"
              payload: { outreach_channel: "IN_PERSON", expected_member_version: "${member_v_now}" }
              as: EngagementSpecialist
              captures: { error_id_occ: $.data.error_id }
          assert:
            - "the temporal trigger returns 409 and error_id_temporal == ERR_SLA_ALREADY_LAPSED"
            - "the OCC trigger returns 412 and error_id_occ == ERR_STALE_VERSION"
            - "the two errors belong to different categories (business_temporal vs business_referential)"

