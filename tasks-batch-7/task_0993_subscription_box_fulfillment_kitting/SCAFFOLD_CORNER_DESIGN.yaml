# =============================================================================
# Task 0993 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 claims not covered by §1.8.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: client_create_applies_zero_wallet_default
        claim_type: defaults
        grounds: [entities.Client.fields.credit_balance_cents]
        distinguishing_aspect: "A client created without any wallet input starts with credit_balance_cents == 0; system fields id/created_at/version are server-minted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /clients"
              payload: { name: "Corner Client", billing_email: "corner@acme.test" }
              as: PlatformAdmin
              captures: { cc_id: $.data.id, cc_bal: $.data.credit_balance_cents, cc_v: $.data.version }
          assert:
            - "Client.${cc_id}.credit_balance_cents == 0"
            - "version == 1 and id/created_at are server-minted (non-null)"

      - name: component_create_missing_required_sku_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Component.fields.sku, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input field sku on component creation fails with ERR_INVALID_REQUEST (400) before any persistence."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /components"
              payload: { name: "No SKU widget", unit_cost_cents: 100 }
              as: WarehouseOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"

      - name: component_create_with_computed_field_input_rejected
        claim_type: computed_fields
        grounds: [entities.Component.fields.available_units, entities.Component.fields.stock_status]
        distinguishing_aspect: "Client-supplied values for computed fields (available_units, stock_status) are rejected with ERR_INVALID_REQUEST, never silently stored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /components"
              payload: { sku: "CMP-CX", name: "CX widget", unit_cost_cents: 100, available_units: 999 }
              as: WarehouseOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400 (computed field in input)"

      - name: subscriber_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", entities.Subscriber]
        distinguishing_aspect: "Reading a subscriber by a well-formed but non-existent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "GET /subscribers/11111111-2222-4333-8444-555555555555"
              as: WarehouseOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with HTTP 404"

      - name: kit_bom_line_set_replacement_is_wholesale
        claim_type: immutability
        grounds: [entities.KitBOMLine, "endpoints.PUT_/kit-revisions/{id}/bom-lines"]
        distinguishing_aspect: "PUT bom-lines replaces the full line set: after a second PUT naming only component B, component A's line is gone (lines are not individually updatable)."
        test_recipe:
          setup:
            - "client + plan PL-KB (DRAFT) with revision RV-KB; components CMP-KBA and CMP-KBB exist"
            - "revision currently has one BOM line for CMP-KBA"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "KB Client", billing_email: "kb@acme.test" }
              as: PlatformAdmin
              captures: { kb_cl: $.data.id }
            - call: "POST /components"
              payload: { sku: "CMP-KBA", name: "KB A", unit_cost_cents: 10 }
              as: WarehouseOps
              captures: { kb_cpa: $.data.id }
            - call: "POST /components"
              payload: { sku: "CMP-KBB", name: "KB B", unit_cost_cents: 10 }
              as: WarehouseOps
              captures: { kb_cpb: $.data.id }
            - call: "POST /box-plans"
              payload: { client_id: "${kb_cl}", name: "KB Box", sku: "PL-KB", price_per_box_cents: 1000, shipping_weight_grams: 500 }
              as: ClientOps
              as_user_id: "${kb_cl}"
              captures: { kb_pl: $.data.id, kb_pl_v: $.data.version }
            - call: "POST /box-plans/${kb_pl}/kit-revisions"
              payload: { expected_box_plan_version: "${kb_pl_v}" }
              as: ClientOps
              as_user_id: "${kb_cl}"
              captures: { kb_rv: $.data.id }
            - call: "PUT /kit-revisions/${kb_rv}/bom-lines"
              payload: { lines: [{ component_id: "${kb_cpa}", qty_per_box: 1 }] }
              as: ClientOps
              as_user_id: "${kb_cl}"
          trigger:
            - call: "PUT /kit-revisions/${kb_rv}/bom-lines"
              payload: { lines: [{ component_id: "${kb_cpb}", qty_per_box: 3 }] }
              as: ClientOps
              as_user_id: "${kb_cl}"
            - call: "GET /kit-revisions/${kb_rv}/bom-lines"
              as: ClientOps
              as_user_id: "${kb_cl}"
              captures: { kb_line0_comp: "$.data[0].component_id", kb_line0_qty: "$.data[0].qty_per_box" }
          assert:
            - "exactly one BOM line remains: component_id == ${kb_cpb} and qty_per_box == 3"
            - "no line references ${kb_cpa} anymore (wholesale replace, not merge)"

      - name: inventory_event_is_append_only_log
        claim_type: immutability
        grounds: [entities.InventoryEvent]
        distinguishing_aspect: "InventoryEvents carry only id + created_at (common_fields: false): a receipt produces a RECEIPT event with quantity_delta +7 and null run_id, and the entity exposes no update/delete surface."
        test_recipe:
          setup: ["component CMP-EV exists with 0 stock"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /components"
              payload: { sku: "CMP-EV", name: "EV widget", unit_cost_cents: 10 }
              as: WarehouseOps
              captures: { ev_cp: $.data.id, ev_cp_v: $.data.version }
          trigger:
            - { call: "POST /components/${ev_cp}/receipts", payload: { quantity: 7, expected_component_version: "${ev_cp_v}", note: "initial load" }, as: WarehouseOps }
            - call: "GET /components/${ev_cp}/inventory-events"
              as: WarehouseOps
              captures: { ev_type: "$.data[0].event_type", ev_delta: "$.data[0].quantity_delta", ev_run: "$.data[0].run_id" }
          assert:
            - "exactly one event exists: event_type == RECEIPT, quantity_delta == 7, run_id is null"
            - "event has id and created_at but no updated_at/version (append-only)"

      - name: import_batch_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints.GET_/box-plans/{id}/import-batches"]
        distinguishing_aspect: "List responses carry the fixed pagination fields with defaults limit 10 / offset 0; two batches report total_count == 2 and has_more == false."
        test_recipe:
          setup: ["client + plan PL-PG (DRAFT); two import batches uploaded"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "PG Client", billing_email: "pg@acme.test" }
              as: PlatformAdmin
              captures: { pg_cl: $.data.id }
            - call: "POST /box-plans"
              payload: { client_id: "${pg_cl}", name: "PG Box", sku: "PL-PG", price_per_box_cents: 1000, shipping_weight_grams: 500 }
              as: ClientOps
              as_user_id: "${pg_cl}"
              captures: { pg_pl: $.data.id }
            - call: "POST /box-plans/${pg_pl}/import-batches"
              payload: { rows: [{ email: "pg1@x.test", zone: 1 }] }
              as: ClientOps
              as_user_id: "${pg_cl}"
            - call: "POST /box-plans/${pg_pl}/import-batches"
              payload: { rows: [{ email: "pg2@x.test", zone: 1 }] }
              as: ClientOps
              as_user_id: "${pg_cl}"
          trigger:
            - call: "GET /box-plans/${pg_pl}/import-batches"
              as: ClientOps
              as_user_id: "${pg_cl}"
          assert:
            - "response data carries limit == 10, offset == 0, total_count == 2, has_more == false"
            - "both batches have status UPLOADED and total_rows == 1"

      - name: box_plan_get_returns_stored_fields
        claim_type: retrieval
        grounds: [entities.BoxPlan]
        distinguishing_aspect: "GET returns exactly the stored plan fields including the system-defaulted status DRAFT and null active_revision_id."
        test_recipe:
          setup: ["client exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "RT Client", billing_email: "rt@acme.test" }
              as: PlatformAdmin
              captures: { rt_cl: $.data.id }
          trigger:
            - call: "POST /box-plans"
              payload: { client_id: "${rt_cl}", name: "RT Box", sku: "PL-RT", price_per_box_cents: 2500, shipping_weight_grams: 750 }
              as: ClientOps
              as_user_id: "${rt_cl}"
              captures: { rt_pl: $.data.id }
            - call: "GET /box-plans/${rt_pl}"
              as: WarehouseOps
              captures: { rt_name: $.data.name, rt_status: $.data.status, rt_rev: $.data.active_revision_id }
          assert:
            - "GET echoes name == RT Box, price_per_box_cents == 2500, shipping_weight_grams == 750"
            - "status == DRAFT and active_revision_id is null"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: subscriber_pause_resume_cycle_restores_active
        claim_type: valid_transition
        grounds:
          - state_machines.Subscriber.ACTIVE_to_PAUSED
          - state_machines.Subscriber.PAUSED_to_ACTIVE
        distinguishing_aspect: "The ACTIVE -> PAUSED -> ACTIVE loop is legal and each hop bumps version by exactly 1."
        test_recipe:
          setup: ["client + plan PL-SM1 (DRAFT, no revision needed); one ACTIVE subscriber sm1@x.test"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "SM1 Client", billing_email: "sm1@acme.test" }
              as: PlatformAdmin
              captures: { sm1_cl: $.data.id }
            - call: "POST /box-plans"
              payload: { client_id: "${sm1_cl}", name: "SM1 Box", sku: "PL-SM1", price_per_box_cents: 1000, shipping_weight_grams: 500 }
              as: ClientOps
              as_user_id: "${sm1_cl}"
              captures: { sm1_pl: $.data.id }
            - call: "POST /box-plans/${sm1_pl}/import-batches"
              payload: { rows: [{ email: "sm1@x.test", zone: 4 }] }
              as: ClientOps
              as_user_id: "${sm1_cl}"
              captures: { sm1_ib: $.data.id }
            - { call: "POST /import-batches/${sm1_ib}/commit", as: ClientOps, as_user_id: "${sm1_cl}" }
            - call: "GET /subscribers"
              payload: { import_batch_id: "${sm1_ib}" }
              as: ClientOps
              as_user_id: "${sm1_cl}"
              captures: { sm1_sb: "$.data[0].id", sm1_v0: "$.data[0].version" }
          trigger:
            - call: "POST /subscribers/${sm1_sb}/pause"
              as: ClientOps
              as_user_id: "${sm1_cl}"
              captures: { sm1_st1: $.data.status, sm1_v1: $.data.version }
            - call: "POST /subscribers/${sm1_sb}/resume"
              as: ClientOps
              as_user_id: "${sm1_cl}"
              captures: { sm1_st2: $.data.status, sm1_v2: $.data.version }
          assert:
            - "pause -> status PAUSED, version == initial + 1"
            - "resume -> status ACTIVE, version == initial + 2"

      - name: churned_subscriber_cannot_pause_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Subscriber.ACTIVE_to_CHURNED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CHURNED is terminal: pause/resume/churn on a CHURNED subscriber all fail with ERR_INVALID_STATE and nothing mutates."
        test_recipe:
          setup: ["client + plan PL-SM2; subscriber sm2@x.test already CHURNED (reason PRICE)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "SM2 Client", billing_email: "sm2@acme.test" }
              as: PlatformAdmin
              captures: { sm2_cl: $.data.id }
            - call: "POST /box-plans"
              payload: { client_id: "${sm2_cl}", name: "SM2 Box", sku: "PL-SM2", price_per_box_cents: 1000, shipping_weight_grams: 500 }
              as: ClientOps
              as_user_id: "${sm2_cl}"
              captures: { sm2_pl: $.data.id }
            - call: "POST /box-plans/${sm2_pl}/import-batches"
              payload: { rows: [{ email: "sm2@x.test", zone: 4 }] }
              as: ClientOps
              as_user_id: "${sm2_cl}"
              captures: { sm2_ib: $.data.id }
            - { call: "POST /import-batches/${sm2_ib}/commit", as: ClientOps, as_user_id: "${sm2_cl}" }
            - call: "GET /subscribers"
              payload: { import_batch_id: "${sm2_ib}" }
              as: ClientOps
              as_user_id: "${sm2_cl}"
              captures: { sm2_sb: "$.data[0].id" }
            - { call: "POST /subscribers/${sm2_sb}/churn", payload: { reason: "PRICE" }, as: ClientOps, as_user_id: "${sm2_cl}" }
          trigger:
            - call: "POST /subscribers/${sm2_sb}/pause"
              as: ClientOps
              as_user_id: "${sm2_cl}"
              captures: { sm2_err: $.data.error_id }
            - call: "GET /subscribers/${sm2_sb}"
              as: ClientOps
              as_user_id: "${sm2_cl}"
              captures: { sm2_st: $.data.status, sm2_reason: $.data.churn_reason }
          assert:
            - "pause on CHURNED -> error_id == ERR_INVALID_STATE (${sm2_err})"
            - "subscriber remains CHURNED with churn_reason == PRICE"

      - name: box_plan_activate_without_approved_revision_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.BoxPlan.DRAFT_to_ACTIVE
          - errors[ERR_PLAN_HAS_NO_APPROVED_REVISION]
        distinguishing_aspect: "Activate requires active_revision_id set; a plan whose revisions were never created (or never approved) is rejected."
        test_recipe:
          setup: ["client + plan PL-SM3 with no revisions at all"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "SM3 Client", billing_email: "sm3@acme.test" }
              as: PlatformAdmin
              captures: { sm3_cl: $.data.id }
            - call: "POST /box-plans"
              payload: { client_id: "${sm3_cl}", name: "SM3 Box", sku: "PL-SM3", price_per_box_cents: 1000, shipping_weight_grams: 500 }
              as: ClientOps
              as_user_id: "${sm3_cl}"
              captures: { sm3_pl: $.data.id }
          trigger:
            - call: "POST /box-plans/${sm3_pl}/activate"
              as: ClientOps
              as_user_id: "${sm3_cl}"
              captures: { sm3_err: $.data.error_id }
          assert:
            - "error_id == ERR_PLAN_HAS_NO_APPROVED_REVISION (${sm3_err})"
            - "plan remains DRAFT"

      - name: tendered_wave_cannot_be_cancelled
        claim_type: invalid_transition
        grounds:
          - state_machines.ShippingWave
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From terminal TENDERED neither cancel nor manifest is valid; the attempt fails with ERR_INVALID_STATE and the wave is unchanged."
        test_recipe:
          setup:
            - "full pipeline: client wallet 100000; component 10 units qty 1; plan ACTIVE price 1000 weight 800; 1 subscriber zone 2; run KITTED actual 1; shipment manifested and wave TENDERED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "SM4 Client", billing_email: "sm4@acme.test" }
              as: PlatformAdmin
              captures: { sm4_cl: $.data.id }
            - { call: "POST /clients/${sm4_cl}/credit-adjustments", payload: { amount_cents: 100000, reason: "seed" }, as: BillingAdmin }
            - call: "POST /components"
              payload: { sku: "CMP-SM4", name: "SM4 widget", unit_cost_cents: 10 }
              as: WarehouseOps
              captures: { sm4_cp: $.data.id, sm4_cp_v: $.data.version }
            - { call: "POST /components/${sm4_cp}/receipts", payload: { quantity: 10, expected_component_version: "${sm4_cp_v}" }, as: WarehouseOps }
            - call: "POST /box-plans"
              payload: { client_id: "${sm4_cl}", name: "SM4 Box", sku: "PL-SM4", price_per_box_cents: 1000, shipping_weight_grams: 800 }
              as: ClientOps
              as_user_id: "${sm4_cl}"
              captures: { sm4_pl: $.data.id, sm4_pl_v: $.data.version }
            - call: "POST /box-plans/${sm4_pl}/kit-revisions"
              payload: { expected_box_plan_version: "${sm4_pl_v}" }
              as: ClientOps
              as_user_id: "${sm4_cl}"
              captures: { sm4_rv: $.data.id }
            - call: "PUT /kit-revisions/${sm4_rv}/bom-lines"
              payload: { lines: [{ component_id: "${sm4_cp}", qty_per_box: 1 }] }
              as: ClientOps
              as_user_id: "${sm4_cl}"
            - { call: "POST /kit-revisions/${sm4_rv}/approve", as: ClientOps, as_user_id: "${sm4_cl}" }
            - { call: "POST /box-plans/${sm4_pl}/activate", as: ClientOps, as_user_id: "${sm4_cl}" }
            - call: "POST /box-plans/${sm4_pl}/import-batches"
              payload: { rows: [{ email: "sm4@x.test", zone: 2 }] }
              as: ClientOps
              as_user_id: "${sm4_cl}"
              captures: { sm4_ib: $.data.id }
            - { call: "POST /import-batches/${sm4_ib}/commit", as: ClientOps, as_user_id: "${sm4_cl}" }
            - call: "POST /assembly-runs"
              payload: { plan_id: "${sm4_pl}", period: "2026-05" }
              as: WarehouseOps
              captures: { sm4_rn: $.data.id }
            - { call: "POST /assembly-runs/${sm4_rn}/lock", as: WarehouseOps }
            - { call: "POST /assembly-runs/${sm4_rn}/start-kitting", as: WarehouseOps }
            - { call: "POST /assembly-runs/${sm4_rn}/complete-kitting", payload: { actual_kitted_count: 1 }, as: WarehouseOps }
            - call: "GET /assembly-runs/${sm4_rn}/shipments"
              as: WarehouseOps
              captures: { sm4_sh: "$.data[0].id" }
            - call: "POST /shipping-waves"
              payload: { carrier: "UPS", service_level: "GROUND", pickup_start: "2026-05-10T10:00:00Z", pickup_end: "2026-05-10T11:00:00Z" }
              as: WarehouseOps
              captures: { sm4_wv: $.data.id }
            - { call: "POST /shipping-waves/${sm4_wv}/assign-shipments", payload: { shipment_ids: ["${sm4_sh}"] }, as: WarehouseOps }
            - { call: "POST /shipping-waves/${sm4_wv}/manifest", as: WarehouseOps }
            - { call: "POST /shipping-waves/${sm4_wv}/tender", as: WarehouseOps }
          trigger:
            - call: "POST /shipping-waves/${sm4_wv}/cancel"
              as: WarehouseOps
              captures: { sm4_err: $.data.error_id }
            - call: "GET /shipping-waves/${sm4_wv}"
              as: WarehouseOps
              captures: { sm4_wv_status: $.data.status }
          assert:
            - "cancel on TENDERED -> error_id == ERR_INVALID_STATE (${sm4_err})"
            - "ShippingWave.${sm4_wv}.status remains TENDERED"

      - name: import_batch_double_commit_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ImportBatch.UPLOADED_to_COMMITTED
          - errors[ERR_IMPORT_ALREADY_COMMITTED]
        distinguishing_aspect: "Committing an already-COMMITTED batch fails with ERR_IMPORT_ALREADY_COMMITTED; accepted/rejected counts stay frozen at their first-commit values."
        test_recipe:
          setup: ["client + plan PL-SM5; batch with 2 valid rows + 1 invalid row (zone 9) already committed once"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /clients"
              payload: { name: "SM5 Client", billing_email: "sm5@acme.test" }
              as: PlatformAdmin
              captures: { sm5_cl: $.data.id }
            - call: "POST /box-plans"
              payload: { client_id: "${sm5_cl}", name: "SM5 Box", sku: "PL-SM5", price_per_box_cents: 1000, shipping_weight_grams: 500 }
              as: ClientOps
              as_user_id: "${sm5_cl}"
              captures: { sm5_pl: $.data.id }
            - call: "POST /box-plans/${sm5_pl}/import-batches"
              payload: { rows: [{ email: "sm5a@x.test", zone: 2 }, { email: "sm5b@x.test", zone: 2 }, { email: "sm5bad@x.test", zone: 9 }] }
              as: ClientOps
              as_user_id: "${sm5_cl}"
              captures: { sm5_ib: $.data.id }
            - call: "POST /import-batches/${sm5_ib}/commit"
              as: ClientOps
              as_user_id: "${sm5_cl}"
              captures: { sm5_acc: $.data.accepted_count, sm5_rej: $.data.rejected_count }
          trigger:
            - call: "POST /import-batches/${sm5_ib}/commit"
              as: ClientOps
              as_user_id: "${sm5_cl}"
              captures: { sm5_err: $.data.error_id }
          assert:
            - "first commit: accepted_count == 2, rejected_count == 1 (zone 9 row skipped)"
            - "second commit -> error_id == ERR_IMPORT_ALREADY_COMMITTED (${sm5_err})"
            - "no duplicate subscribers created (GET /subscribers?plan_id shows exactly 2)"

      - name: revision_approve_retires_prior_approved
        claim_type: side_effect_execution
        grounds:
          - state_machines.KitRevision.DRAFT_to_APPROVED
          - state_machines.KitRevision.APPROVED_to_RETIRED
        distinguishing_aspect: "Approving revision 2 automatically retires the previously APPROVED revision 1 and repoints BoxPlan.active_revision_id."
        test_recipe:
          setup: ["client + plan PL-SM6 (DRAFT) + component; revision 1 with BOM approved; revision 2 created with BOM, still DRAFT"]
          setup_api_calls:
