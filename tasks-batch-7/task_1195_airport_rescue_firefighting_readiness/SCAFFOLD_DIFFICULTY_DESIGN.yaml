            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff3}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff4}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
          trigger:
            - { call: "POST /arff/vehicles/${veh1}/out-of-service-events", payload: { reason: "Foam pump failure" }, as: ArffChief, captures: { oos1: $.data.id } }
            - { call: "GET /arff/airport-profile", as: ArffChief, captures: { p_eff_mid: $.data.effective_index } }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/out-of-service-events/${oos1}/restore", as: ArffChief }
            - { call: "GET /arff/airport-profile", as: ArffChief, captures: { p_eff_end: $.data.effective_index, p_comp_end: $.data.index_compliance_status } }
            - { call: "GET /arff/vehicles", as: ArffChief, captures: { v1_cap: "$.data[0].water_capacity_gal", v2_cap: "$.data[1].water_capacity_gal" } }
            - { call: "GET /arff/index-downgrade-notifications", as: ArffChief, captures: { n_status: "$.data[0].status" } }
          assert:
            - "${p_eff_mid} == \"A\"  # forward action dropped the index"
            - "${p_eff_end} == \"C\" and ${p_comp_end} == \"COMPLIANT\"  # compensating action restored it exactly"
            - "sum of vehicle water_capacity_gal == 2000 + 2000 == 4000 and vehicle count == 2  # conserved quantity unchanged"
            - "IndexDowngradeNotification status == \"RESOLVED\"  # no residual drift"

      - name: ci_suspend_reactivate_conserves_roster_headcount
        grounds:
          - state_machines.Firefighter.ACTIVE_to_SUSPENDED
          - state_machines.Firefighter.SUSPENDED_to_ACTIVE
          - calculations.staffing_supported_index
        distinguishing_aspect: |
          Conserved quantity: personnel headcount (different quantity type from the fleet
          capacity instance). Suspend paired with reactivate leaves roster_active_count
          and deployment_ready_count at their initial value 4 and effective_index
          unmoved at C; no notification is ever created because staffing never drops
          below the certificated requirement.
        test_recipe:
          setup:
            - "Compliant index-C airport: 4 ACTIVE firefighters all training-current (staffing supports D; effective C)"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-1", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh1: $.data.id } }
            - { call: "POST /arff/vehicles", payload: { call_sign: "RED-2", water_capacity_gal: 2000, dry_chem_capacity_lb: 500 }, as: ArffChief, captures: { veh2: $.data.id } }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh1}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/readiness-checks", payload: { vehicle_id: "${veh2}", water_available_gal: 2000, dry_chem_available_lb: 500, discharge_system_ok: true }, as: ArffChief }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-101", full_name: "Ann Lee" }, as: ArffChief, captures: { ff1: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-102", full_name: "Ben Kim" }, as: ArffChief, captures: { ff2: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-103", full_name: "Cal Ray" }, as: ArffChief, captures: { ff3: $.data.id } }
            - { call: "POST /arff/firefighters", payload: { employee_no: "FF-104", full_name: "Dee Fox" }, as: ArffChief, captures: { ff4: $.data.id } }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff1}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff2}", completed_on: "2026-04-15", drill_type: "AIRCRAFT", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff3}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "POST /arff/live-fire-training-records", payload: { firefighter_id: "${ff4}", completed_on: "2026-04-15", drill_type: "STRUCTURAL", result: "PASS" }, as: ArffChief }
            - { call: "GET /arff/airport-profile/readiness", as: ArffChief, captures: { r0_active: $.data.roster_active_count, r0_ready: $.data.deployment_ready_count } }
          trigger:
            - { call: "POST /arff/firefighters/${ff3}/suspend", as: ArffChief }
            - { call: "GET /arff/airport-profile/readiness", as: ArffChief, captures: { r1_active: $.data.roster_active_count, r1_ready: $.data.deployment_ready_count, r1_eff: $.data.effective_index } }
            - { call: "POST /arff/firefighters/${ff3}/reactivate", as: ArffChief }
            - { call: "GET /arff/airport-profile/readiness", as: ArffChief, captures: { r2_active: $.data.roster_active_count, r2_ready: $.data.deployment_ready_count, r2_eff: $.data.effective_index, r2_notif: $.data.open_notification_id } }
          assert:
            - "${r1_active} == 3 and ${r1_ready} == 3  # forward action"
            - "${r2_active} == 4 and ${r2_ready} == 4  # conserved quantity restored to initial"
            - "${r1_eff} == \"C\" and ${r2_eff} == \"C\"  # staffing C (3 ready) then D (4 ready); effective never left C"
            - "${r2_notif} == null  # no downgrade notification was ever created by the pair"
