# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-reference of SCAFFOLD.yaml sections 1.1-1.7 against the nine Difficulty
# Rules of section 0.5. Every instance grounds in already-declared scaffold
# elements; deleting this file leaves declared behaviour unchanged.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: reserve_scheduled_yield_vs_earned_to_date_on_contract
        grounds:
          - calculations.dealer_reserve_amount
          - calculations.reserve_chargeback_amount
          - entities.RetailContract.fields.reserve_accrued_cents
          - entities.ChargebackEvent.fields.earned_to_date_reserve_cents
          - entities.ChargebackEvent.fields.participation_chargeback_cents
          - state_machines.RetailContract.DOCS_VERIFIED_to_FUNDED
        distinguishing_aspect: |
          This instance is dual-variant cost accounting on a single RetailContract: the
          scheduled_yield variant prorates participation over term_months (60) and posts
          154055 to the ledger, while the earned_to_date variant prorates the same inputs
          over months_seasoned (6) and yields 15406, which is a different number from
          reserve_accrued_cents minus participation_chargeback_cents (154055 - 77028 =
          77027) because the chargeback prorates over window_months (12) instead.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Dealer 'Ridgeline Motors' is ACTIVE with funding_line_cents 50000000 and program_code PS-STANDARD."
            - "One ACTIVE DealerAgreement, RATE_PARTICIPATION, max_participation_bps 200, chargeback_window_days 360, window 2026-02-01 through 2027-02-01."
            - "One PUBLISHED RateSheet for PS-STANDARD covering [2026-01-01, 2027-01-01) with tiers T1/T2/T3."
            - "One contract booked at tier T1 (buy 549 bps) with amount_financed_cents 2801000, term_months 60, contract_apr_bps 749, funded on 2026-08-01, reserve_status ACCRUED, reserve_accrued_cents 154055 and incentive_accrued_cents 7003."
          setup_api_calls:
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /lending/dealers"
              payload: { legal_name: "Ridgeline Motors", state_code: "TX", program_code: "PS-STANDARD", funding_line_cents: 50000000 }
              as: PortfolioAdmin
              captures: { d1: $.data.id, d1_v0: $.data.version }
            - call: "POST /lending/dealer-agreements"
              payload: { dealer_id: "${d1}", participation_method: "RATE_PARTICIPATION", max_participation_bps: 200, chargeback_window_days: 360, effective_from: "2026-02-01T00:00:00Z", effective_to: "2027-02-01T00:00:00Z", expected_dealer_version: "${d1_v0}" }
              as: PortfolioAdmin
              captures: { ag1: $.data.id }
            - call: "POST /lending/dealer-agreements/${ag1}/countersign"
              payload: { signer_name: "R. Ridge" }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /lending/rate-sheets"
              payload: { program_code: "PS-STANDARD", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PortfolioAdmin
              captures: { rs1: $.data.id }
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T1", min_credit_score: 720, max_credit_score: 900, max_ltv_pct: 120, max_term_months: 72, buy_rate_apr_bps: 549, advance_rate_pct: 120, acquisition_fee_cents: 15000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T2", min_credit_score: 660, max_credit_score: 719, max_ltv_pct: 115, max_term_months: 72, buy_rate_apr_bps: 749, advance_rate_pct: 115, acquisition_fee_cents: 20000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T3", min_credit_score: 600, max_credit_score: 659, max_ltv_pct: 110, max_term_months: 60, buy_rate_apr_bps: 1099, advance_rate_pct: 110, acquisition_fee_cents: 30000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/publish"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /lending/applications"
              payload: { dealer_id: "${d1}", applicant_reference: "APP-K1", monitoring_cohort: "CONTROL", credit_score: 725, monthly_income_cents: 600000, monthly_debt_cents: 210000, amount_financed_cents: 2801000, collateral_value_cents: 2500000, term_months: 60, vehicle_model_year: 2024, requested_apr_bps: 749 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { ap1: $.data.id }
            - call: "POST /lending/applications/${ap1}/decision"
              payload: { outcome: "APPROVE" }
              as: CreditAnalyst
              as_user_id: "ca-001"
            - call: "POST /lending/contracts"
              payload: { application_id: "${ap1}", contract_apr_bps: 749, contract_date: "2026-08-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { k1: $.data.id }
            - call: "POST /lending/contracts/${k1}/documents"
              payload: { doc_type: "RETAIL_INSTALLMENT_CONTRACT", document_reference: "IMG-K1-RIC" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { k1_doc1: $.data.id }
            - call: "POST /lending/contracts/${k1}/documents"
              payload: { doc_type: "TITLE_APPLICATION", document_reference: "IMG-K1-TTL" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { k1_doc2: $.data.id }
            - call: "POST /lending/documents/${k1_doc1}/verify"
              payload: { outcome: "VERIFY" }
              as: FundingSpecialist
              as_user_id: "fs-001"
            - call: "POST /lending/documents/${k1_doc2}/verify"
              payload: { outcome: "VERIFY" }
              as: FundingSpecialist
              as_user_id: "fs-001"
            - call: "POST /lending/contracts/${k1}/fund"
              payload: { funding_date: "2026-08-01T00:00:00Z" }
              as: FundingSpecialist
              as_user_id: "fs-001"
          trigger:
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /lending/contracts/${k1}/chargeback-events"
              payload: { event_type: "EARLY_PAYOFF", event_date: "2027-02-01T00:00:00Z" }
              as: PortfolioAdmin
              captures: { cb1_earned: $.data.earned_to_date_reserve_cents }
          assert:
            - "RetailContract.${k1}.reserve_accrued_cents == 154055"
            - "RetailContract.${k1}.incentive_accrued_cents == 7003"
            - "ChargebackEvent.months_seasoned == 6"
            - "ChargebackEvent.window_months == 12"
            - "ChargebackEvent.participation_chargeback_cents == 77028"
            - "ChargebackEvent.earned_to_date_reserve_cents == 15406"
            - "ChargebackEvent.earned_to_date_reserve_cents != RetailContract.${k1}.reserve_accrued_cents - ChargebackEvent.participation_chargeback_cents"

      - name: scorecard_trailing_window_vs_inception_to_date_on_dealer
        grounds:
          - calculations.dealer_scorecard_composite
          - entities.DealerScorecard.fields.composite_score
          - entities.DealerScorecard.fields.grade
          - entities.DealerScorecard.fields.population_count
          - state_machines.RetailContract.FUNDED_to_DEFAULTED
        distinguishing_aspect: |
          This instance is dual-variant risk scoring on the Dealer entity domain, not on a
          contract: with one contract funded 2026-06-15 (later DEFAULTED) and one funded
          2026-08-10, TRAILING_WINDOW over [2026-08-01, 2026-12-01) scores 995 / grade A
          while INCEPTION_TO_DATE over the identical dealer and clock scores 695 / grade C.
        test_recipe:
          setup:
            - "Dealer ACTIVE with an ACTIVE RATE_PARTICIPATION agreement and a PUBLISHED PS-STANDARD rate sheet covering [2026-01-01, 2027-01-01)."
            - "Contract Y: amount_financed_cents 1000000, term 60, contract_apr_bps 749 (markup 200), funded 2026-06-15, later DEFAULTED on 2026-08-15."
            - "Contract X: amount_financed_cents 1000000, term 60, contract_apr_bps 749 (markup 200), funded 2026-08-10, still FUNDED."
            - "Logical clock parked at 2026-12-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /lending/dealers"
              payload: { legal_name: "Ridgeline Motors", state_code: "TX", program_code: "PS-STANDARD", funding_line_cents: 50000000 }
              as: PortfolioAdmin
              captures: { d1: $.data.id, d1_v0: $.data.version }
            - call: "POST /lending/dealer-agreements"
              payload: { dealer_id: "${d1}", participation_method: "RATE_PARTICIPATION", max_participation_bps: 200, chargeback_window_days: 360, effective_from: "2026-02-01T00:00:00Z", effective_to: "2027-02-01T00:00:00Z", expected_dealer_version: "${d1_v0}" }
              as: PortfolioAdmin
              captures: { ag1: $.data.id }
            - call: "POST /lending/dealer-agreements/${ag1}/countersign"
              payload: { signer_name: "R. Ridge" }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /lending/rate-sheets"
              payload: { program_code: "PS-STANDARD", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PortfolioAdmin
              captures: { rs1: $.data.id }
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T1", min_credit_score: 720, max_credit_score: 900, max_ltv_pct: 120, max_term_months: 72, buy_rate_apr_bps: 549, advance_rate_pct: 120, acquisition_fee_cents: 15000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T2", min_credit_score: 660, max_credit_score: 719, max_ltv_pct: 115, max_term_months: 72, buy_rate_apr_bps: 749, advance_rate_pct: 115, acquisition_fee_cents: 20000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T3", min_credit_score: 600, max_credit_score: 659, max_ltv_pct: 110, max_term_months: 60, buy_rate_apr_bps: 1099, advance_rate_pct: 110, acquisition_fee_cents: 30000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/publish"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /lending/applications"
              payload: { dealer_id: "${d1}", applicant_reference: "APP-Y", monitoring_cohort: "CONTROL", credit_score: 725, monthly_income_cents: 600000, monthly_debt_cents: 180000, amount_financed_cents: 1000000, collateral_value_cents: 1000000, term_months: 60, vehicle_model_year: 2023, requested_apr_bps: 749 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { ap_y: $.data.id }
            - call: "POST /lending/applications/${ap_y}/decision"
              payload: { outcome: "APPROVE" }
              as: CreditAnalyst
              as_user_id: "ca-001"
            - call: "POST /lending/contracts"
              payload: { application_id: "${ap_y}", contract_apr_bps: 749, contract_date: "2026-06-15T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { ky: $.data.id }
            - call: "POST /lending/contracts/${ky}/documents"
              payload: { doc_type: "RETAIL_INSTALLMENT_CONTRACT", document_reference: "IMG-Y-RIC" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { ky_doc1: $.data.id }
            - call: "POST /lending/contracts/${ky}/documents"
              payload: { doc_type: "TITLE_APPLICATION", document_reference: "IMG-Y-TTL" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { ky_doc2: $.data.id }
            - call: "POST /lending/documents/${ky_doc1}/verify"
              payload: { outcome: "VERIFY" }
              as: FundingSpecialist
              as_user_id: "fs-001"
            - call: "POST /lending/documents/${ky_doc2}/verify"
              payload: { outcome: "VERIFY" }
              as: FundingSpecialist
              as_user_id: "fs-001"
            - call: "POST /lending/contracts/${ky}/fund"
              payload: { funding_date: "2026-06-15T00:00:00Z" }
              as: FundingSpecialist
              as_user_id: "fs-001"
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /lending/applications"
              payload: { dealer_id: "${d1}", applicant_reference: "APP-X", monitoring_cohort: "CONTROL", credit_score: 725, monthly_income_cents: 600000, monthly_debt_cents: 180000, amount_financed_cents: 1000000, collateral_value_cents: 1000000, term_months: 60, vehicle_model_year: 2023, requested_apr_bps: 749 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { ap_x: $.data.id }
            - call: "POST /lending/applications/${ap_x}/decision"
              payload: { outcome: "APPROVE" }
              as: CreditAnalyst
              as_user_id: "ca-001"
            - call: "POST /lending/contracts"
              payload: { application_id: "${ap_x}", contract_apr_bps: 749, contract_date: "2026-08-10T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { kx: $.data.id }
            - call: "POST /lending/contracts/${kx}/documents"
              payload: { doc_type: "RETAIL_INSTALLMENT_CONTRACT", document_reference: "IMG-X-RIC" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { kx_doc1: $.data.id }
            - call: "POST /lending/contracts/${kx}/documents"
              payload: { doc_type: "TITLE_APPLICATION", document_reference: "IMG-X-TTL" }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { kx_doc2: $.data.id }
            - call: "POST /lending/documents/${kx_doc1}/verify"
              payload: { outcome: "VERIFY" }
              as: FundingSpecialist
              as_user_id: "fs-001"
            - call: "POST /lending/documents/${kx_doc2}/verify"
              payload: { outcome: "VERIFY" }
              as: FundingSpecialist
              as_user_id: "fs-001"
            - call: "POST /lending/contracts/${kx}/fund"
              payload: { funding_date: "2026-08-10T00:00:00Z" }
              as: FundingSpecialist
              as_user_id: "fs-001"
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /lending/contracts/${ky}/chargeback-events"
              payload: { event_type: "DEFAULT", event_date: "2026-08-15T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PortfolioAdmin
          trigger:
            - call: "POST /lending/dealers/${d1}/scorecards"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", basis: "TRAILING_WINDOW" }
              as: PortfolioAdmin
              captures: { sc_trailing: $.data.id, sc_trailing_score: $.data.composite_score }
            - call: "POST /lending/dealers/${d1}/scorecards"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", basis: "INCEPTION_TO_DATE" }
              as: PortfolioAdmin
              captures: { sc_inception: $.data.id, sc_inception_score: $.data.composite_score }
          assert:
            - "DealerScorecard.${sc_trailing}.population_count == 1"
            - "DealerScorecard.${sc_trailing}.default_rate_bps == 0"
            - "DealerScorecard.${sc_trailing}.avg_markup_bps == 200"
            - "DealerScorecard.${sc_trailing}.composite_score == 995"
            - "DealerScorecard.${sc_trailing}.grade == 'A'"
            - "DealerScorecard.${sc_inception}.population_count == 2"
            - "DealerScorecard.${sc_inception}.default_rate_bps == 5000"
            - "DealerScorecard.${sc_inception}.composite_score == 695"
            - "DealerScorecard.${sc_inception}.grade == 'C'"

  - rule_id: combinatorial_formula
    instances:

      - name: tier_demotion_two_steps_without_recheck
        grounds:
          - calculations.tier_assignment_and_buy_rate
          - entities.CreditApplication.fields.demotion_count
          - entities.CreditApplication.fields.assigned_tier_code
          - entities.CreditApplication.fields.max_contract_apr_bps
          - entities.RateSheetTier.fields.max_ltv_pct
          - state_machines.CreditApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Mode (a) - a four-input non-linear formula (credit_score, ltv_pct, term_months,
          dti_pct) whose conditional branches stack: base band T1 is demoted twice (ltv
          127.27 > 120 and term 84 > 72), landing on T3 with buy rate 1099 bps, and the
          demoted tier's own caps (max_ltv_pct 110, max_term_months 60) are deliberately
          NOT re-evaluated, so a re-checking implementation returns ERR_NO_ELIGIBLE_TIER
          instead of an approval.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Dealer ACTIVE with an ACTIVE RATE_PARTICIPATION agreement (max_participation_bps 200) and a PUBLISHED PS-STANDARD rate sheet with tiers T1/T2/T3."
            - "No contracts exist yet."
          setup_api_calls:
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /lending/dealers"
              payload: { legal_name: "Ridgeline Motors", state_code: "TX", program_code: "PS-STANDARD", funding_line_cents: 50000000 }
              as: PortfolioAdmin
              captures: { d1: $.data.id, d1_v0: $.data.version }
            - call: "POST /lending/dealer-agreements"
              payload: { dealer_id: "${d1}", participation_method: "RATE_PARTICIPATION", max_participation_bps: 200, chargeback_window_days: 360, effective_from: "2026-02-01T00:00:00Z", effective_to: "2027-02-01T00:00:00Z", expected_dealer_version: "${d1_v0}" }
              as: PortfolioAdmin
              captures: { ag1: $.data.id }
            - call: "POST /lending/dealer-agreements/${ag1}/countersign"
              payload: { signer_name: "R. Ridge" }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /lending/rate-sheets"
              payload: { program_code: "PS-STANDARD", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PortfolioAdmin
              captures: { rs1: $.data.id }
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T1", min_credit_score: 720, max_credit_score: 900, max_ltv_pct: 120, max_term_months: 72, buy_rate_apr_bps: 549, advance_rate_pct: 120, acquisition_fee_cents: 15000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T2", min_credit_score: 660, max_credit_score: 719, max_ltv_pct: 115, max_term_months: 72, buy_rate_apr_bps: 749, advance_rate_pct: 115, acquisition_fee_cents: 20000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/tiers"
              payload: { tier_code: "T3", min_credit_score: 600, max_credit_score: 659, max_ltv_pct: 110, max_term_months: 60, buy_rate_apr_bps: 1099, advance_rate_pct: 110, acquisition_fee_cents: 30000 }
              as: PortfolioAdmin
            - call: "POST /lending/rate-sheets/${rs1}/publish"
              payload: {}
              as: PortfolioAdmin
            - call: "POST /lending/applications"
              payload: { dealer_id: "${d1}", applicant_reference: "APP-DEMOTE", monitoring_cohort: "CONTROL", credit_score: 725, monthly_income_cents: 700000, monthly_debt_cents: 210000, amount_financed_cents: 2800000, collateral_value_cents: 2200000, term_months: 84, vehicle_model_year: 2022, requested_apr_bps: 1299 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { ap_dem: $.data.id }
          trigger:
            - call: "POST /lending/applications/${ap_dem}/decision"
              payload: { outcome: "APPROVE" }
              as: CreditAnalyst
              as_user_id: "ca-001"
              captures: { dem_tier: $.data.assigned_tier_code, dem_buy: $.data.buy_rate_apr_bps }
          assert:
            - "CreditApplication.${ap_dem}.ltv_pct == 127.27"
            - "CreditApplication.${ap_dem}.dti_pct == 30.00"
            - "CreditApplication.${ap_dem}.base_tier_code == 'T1'"
            - "CreditApplication.${ap_dem}.demotion_count == 2"
            - "CreditApplication.${ap_dem}.assigned_tier_code == 'T3'"
            - "CreditApplication.${ap_dem}.buy_rate_apr_bps == 1099"
            - "CreditApplication.${ap_dem}.max_contract_apr_bps == 1299"
            - "CreditApplication.${ap_dem}.status == 'APPROVED'"

      - name: chargeback_per_entry_rounding_before_sum
        grounds:
          - calculations.reserve_chargeback_amount
          - entities.ChargebackEvent.fields.participation_chargeback_cents
          - entities.ChargebackEvent.fields.incentive_chargeback_cents
          - entities.ChargebackEvent.fields.chargeback_total_cents
          - entities.ReserveEntry.fields.entry_type
          - entities.Dealer.fields.reserve_balance_cents
        distinguishing_aspect: |
          Mode (b) - nested rounding whose order changes the answer by one cent: at
          unearned fraction exactly 1/2 the two accrual entries 154055 and 7003 round
          per-entry to 77028 + 3502 = 80530, whereas summing first (161058 * 0.5 =
          80529.0) gives 80529; the scaffold pins round-per-entry-then-sum, so the
          dealer's reserve balance must land on 80528 and not 80529.
        test_recipe:
          setup:
            - "Same base fixture as reserve_scheduled_yield_vs_earned_to_date_on_contract: contract funded 2026-08-01 with PARTICIPATION_ACCRUAL 154055 and INCENTIVE_ACCRUAL 7003, dealer reserve_balance_cents 161058."
            - "chargeback_window_days 360, so window_months is 12."
          setup_api_calls:
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /lending/dealers"
              payload: { legal_name: "Ridgeline Motors", state_code: "TX", program_code: "PS-STANDARD", funding_line_cents: 50000000 }
              as: PortfolioAdmin
              captures: { d1: $.data.id, d1_v0: $.data.version }
            - call: "POST /lending/dealer-agreements"
              payload: { dealer_id: "${d1}", participation_method: "RATE_PARTICIPATION", max_participation_bps: 200, chargeback_window_days: 360, effective_from: "2026-02-01T00:00:00Z", effective_to: "2027-02-01T00:00:00Z", expected_dealer_version: "${d1_v0}" }
              as: PortfolioAdmin
              captures: { ag1: $.data.id }
            - call: "POST /lending/dealer-agreements/${ag1}/countersign"
              payload: { signer_name: "R. Ridge" }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "POST /lending/rate-sheets"
