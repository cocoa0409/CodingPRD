            - "Clock 2026-08-03T09:00:00Z at hire; assignment A due 2026-08-13T09:00:00Z, born ON_TRACK (10d > 7d window)"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
