scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: frozen_screening_bmi_versus_live_patient_bmi
        grounds:
          - calculations.eligibility_bmi_assessment
          - entities.EligibilityScreening.fields.assessed_bmi
          - entities.Patient.fields.current_bmi
          - validations[priority=9]
          - errors[ERR_SCREENING_NOT_ELIGIBLE]
        distinguishing_aspect: |
          The dual variant lives on the eligibility domain (EligibilityScreening plus Patient):
          SCREENING_SNAPSHOT freezes 30.0 into EligibilityScreening.assessed_bmi while
          CURRENT_RECHECK recomputes Patient.current_bmi to 26.6 from the same person's later
          weight, and the prescription gate reads only the frozen value, so a patient whose live
          BMI has fallen below every qualifying band still passes.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Patient Ava, height 170 cm, weight 86.7 kg, CA, CASH, no comorbidities."
            - "Screening submitted with fresh labs and adjudicated ELIGIBLE with band OBESITY and assessed_bmi 30.0."
            - "Consult with a CA-licensed clinician completed with outcome PRESCRIBE."
            - "Patient's weight then dropped to 77.0 kg, taking Patient.current_bmi to 26.6."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/patients"
              payload: { email: "ava@example.com", full_name: "Ava Reed", state_code: "CA", height_cm: 170, weight_kg: 86.7, payment_mode: "CASH", comorbidity_codes: [] }
              as: PlatformAdmin
              captures: { pat_id: "$.data.id" }
            - call: "POST /glp1/providers"
              payload: { full_name: "Dr Nia Cole", provider_type: "CLINICIAN", licensed_state_codes: ["CA"], npi: "1710001001" }
              as: PlatformAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /glp1/screenings"
              payload: { patient_id: "${pat_id}", recorded_weight_kg: 86.7, egfr: 92.0, lab_collected_at: "2026-05-20T00:00:00Z" }
              as: Provider
              as_user_id: "${doc_id}"
              captures: { scr_id: "$.data.id" }
            - call: "POST /glp1/screenings/${scr_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${doc_id}"
            - call: "POST /glp1/consults"
              payload: { patient_id: "${pat_id}", provider_id: "${doc_id}", scheduled_start_at: "2026-06-02T15:00:00Z", scheduled_end_at: "2026-06-02T15:30:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { con_id: "$.data.id" }
            - call: "POST /glp1/consults/${con_id}/complete"
              payload: { outcome: "PRESCRIBE" }
              as: Provider
              as_user_id: "${doc_id}"
            - call: "PATCH /glp1/patients/${pat_id}/vitals"
              payload: { weight_kg: 77.0 }
              as: Provider
              as_user_id: "${doc_id}"
          trigger:
            - call: "GET /glp1/patients/${pat_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pat_v: "$.data.version", live_bmi: "$.data.current_bmi" }
            - call: "POST /glp1/prescriptions"
              payload: { patient_id: "${pat_id}", consult_id: "${con_id}", prescriber_provider_id: "${doc_id}", screening_id: "${scr_id}", drug_family: "SEMAGLUTIDE", units_per_cycle: 2, expected_patient_version: "${pat_v}" }
              as: Provider
              as_user_id: "${doc_id}"
              captures: { rx_id: "$.data.id" }
          assert:
            - "EligibilityScreening.${scr_id}.assessed_bmi == 30.0"
            - "EligibilityScreening.${scr_id}.eligibility_band == OBESITY"
            - "EligibilityScreening.${scr_id}.decision_reason == BMI_QUALIFIED"
            - "Patient.${pat_id}.current_bmi == 26.6"
            - "Patient.${pat_id}.eligibility_status == ELIGIBLE"
            - "POST /glp1/prescriptions returns HTTP 201 and Prescription.${rx_id}.screening_id == ${scr_id}"
            - "Prescription.${rx_id}.dose_level == 1 and Prescription.${rx_id}.dose_mg == 0.25"

      - name: cash_pay_versus_insurance_adjudicated_cycle_total
        grounds:
          - calculations.cycle_medication_charge
          - calculations.cycle_invoice_total
          - entities.BillingCycle.fields.charge_basis
          - state_machines.PriorAuthorization.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          The dual variant lives on the billing domain (BillingCycle): the identical prescription
          priced as CASH_PAY yields total_due_cents 36500 in cycle 1 and, after the payer approves
          the authorisation and flips active_route_mode to INSURANCE, the very same dose and unit
          count yields 11500 in cycle 2 under INSURANCE_ADJUDICATED.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; CASH patient Ava with an ELIGIBLE screening and a completed PRESCRIBE consult."
            - "SEMAGLUTIDE prescription at dose_level 1, units_per_cycle 2, active_route_mode CASH."
            - "Subscription anchored at 2026-06-01 with the coaching add-on off, so BillingCycle 1 spans [2026-06-01, 2026-07-01)."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/patients"
              payload: { email: "ava2@example.com", full_name: "Ava Reed", state_code: "CA", height_cm: 170, weight_kg: 86.7, payment_mode: "CASH", comorbidity_codes: [] }
              as: PlatformAdmin
              captures: { pat_id: "$.data.id" }
            - call: "POST /glp1/providers"
              payload: { full_name: "Dr Nia Cole", provider_type: "CLINICIAN", licensed_state_codes: ["CA"], npi: "1710001002" }
              as: PlatformAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /glp1/screenings"
              payload: { patient_id: "${pat_id}", recorded_weight_kg: 86.7, egfr: 92.0, lab_collected_at: "2026-05-20T00:00:00Z" }
              as: Provider
              as_user_id: "${doc_id}"
              captures: { scr_id: "$.data.id" }
            - call: "POST /glp1/screenings/${scr_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${doc_id}"
            - call: "POST /glp1/consults"
              payload: { patient_id: "${pat_id}", provider_id: "${doc_id}", scheduled_start_at: "2026-06-02T15:00:00Z", scheduled_end_at: "2026-06-02T15:30:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { con_id: "$.data.id" }
            - call: "POST /glp1/consults/${con_id}/complete"
              payload: { outcome: "PRESCRIBE" }
              as: Provider
              as_user_id: "${doc_id}"
            - call: "GET /glp1/patients/${pat_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pat_v: "$.data.version" }
            - call: "POST /glp1/prescriptions"
              payload: { patient_id: "${pat_id}", consult_id: "${con_id}", prescriber_provider_id: "${doc_id}", screening_id: "${scr_id}", drug_family: "SEMAGLUTIDE", units_per_cycle: 2, expected_patient_version: "${pat_v}" }
              as: Provider
              as_user_id: "${doc_id}"
              captures: { rx_id: "$.data.id" }
            - call: "POST /glp1/subscriptions"
              payload: { patient_id: "${pat_id}", prescription_id: "${rx_id}", anchor_at: "2026-06-01T00:00:00Z", coaching_addon_enabled: false }
              as: BillingAdmin
              captures: { sub_id: "$.data.id" }
            - call: "GET /glp1/billing-cycles"
              payload: { subscription_id: "${sub_id}", status: "OPEN" }
              as: BillingAdmin
              captures: { bc1_id: "$.data[0].id" }
          trigger:
            - call: "POST /glp1/billing-cycles/${bc1_id}/invoice"
              payload: {}
              as: BillingAdmin
              captures: { cash_total: "$.data.total_due_cents" }
            - call: "POST /glp1/billing-cycles/${bc1_id}/settle"
              payload: { payment_reference: "PAY-0001" }
              as: BillingAdmin
            - call: "POST /glp1/prior-authorizations"
              payload: { prescription_id: "${rx_id}", payer_reference: "PA-77001" }
              as: Provider
              as_user_id: "${doc_id}"
              captures: { pa_id: "$.data.id" }
            - call: "POST /glp1/prior-authorizations/${pa_id}/decide"
              payload: { decision: "APPROVED" }
              as: BillingAdmin
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /glp1/billing-cycles"
              payload: { subscription_id: "${sub_id}", status: "OPEN" }
              as: BillingAdmin
              captures: { bc2_id: "$.data[0].id" }
            - call: "POST /glp1/billing-cycles/${bc2_id}/invoice"
              payload: {}
              as: BillingAdmin
              captures: { insured_total: "$.data.total_due_cents" }
          assert:
            - "BillingCycle.${bc1_id}.charge_basis == CASH_PAY"
            - "BillingCycle.${bc1_id}.medication_charge_cents == 34000"
            - "BillingCycle.${bc1_id}.dispensing_fee_cents == 2500"
            - "BillingCycle.${bc1_id}.total_due_cents == 36500"
            - "BillingCycle.${bc2_id}.charge_basis == INSURANCE_ADJUDICATED"
            - "BillingCycle.${bc2_id}.medication_charge_cents == 9000"
            - "BillingCycle.${bc2_id}.dispensing_fee_cents == 2500"
            - "BillingCycle.${bc2_id}.total_due_cents == 11500"
            - "BillingCycle.${bc2_id}.period_start_at == 2026-07-01T00:00:00.000Z, exactly BillingCycle.${bc1_id}.period_end_at"

      - name: titration_planning_date_versus_tolerability_gate
        grounds:
          - calculations.titration_readiness_interval
          - entities.TitrationStep.fields.earliest_escalation_at
          - entities.Prescription.fields.severity_index_since_dose_change
          - errors[ERR_TITRATION_INTERVAL_NOT_MET]
        distinguishing_aspect: |
          The dual variant lives on the titration domain (Prescription plus TitrationStep):
          INTERVAL_ONLY stamps earliest_escalation_at at 2026-06-29T00:00:00Z while
          TOLERABILITY_ADJUSTED demands 42 days once severity_index_since_dose_change reaches 4,
          so the escalate on 2026-06-29 is rejected on a date the planning field already permits
          and only succeeds on 2026-07-13.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; CASH patient with an ELIGIBLE screening, a completed PRESCRIBE consult and a dose_level 1 prescription."
            - "TitrationStep 1 exists in status DUE with earliest_escalation_at 28 days after creation."
            - "A check-in on 2026-06-05 scoring 4 (nausea 2, vomiting 1) has been triaged CLEARED, lifting severity_index_since_dose_change to 4."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/patients"
              payload: { email: "bo@example.com", full_name: "Bo Lane", state_code: "CA", height_cm: 170, weight_kg: 95.0, payment_mode: "CASH", comorbidity_codes: [] }
              as: PlatformAdmin
              captures: { pat_id: "$.data.id" }
            - call: "POST /glp1/providers"
              payload: { full_name: "Dr Nia Cole", provider_type: "CLINICIAN", licensed_state_codes: ["CA"], npi: "1710001003" }
              as: PlatformAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /glp1/screenings"
              payload: { patient_id: "${pat_id}", recorded_weight_kg: 95.0, egfr: 88.0, lab_collected_at: "2026-05-20T00:00:00Z" }
              as: Provider
              as_user_id: "${doc_id}"
              captures: { scr_id: "$.data.id" }
            - call: "POST /glp1/screenings/${scr_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${doc_id}"
            - call: "POST /glp1/consults"
              payload: { patient_id: "${pat_id}", provider_id: "${doc_id}", scheduled_start_at: "2026-06-02T15:00:00Z", scheduled_end_at: "2026-06-02T15:30:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { con_id: "$.data.id" }
            - call: "POST /glp1/consults/${con_id}/complete"
              payload: { outcome: "PRESCRIBE" }
              as: Provider
              as_user_id: "${doc_id}"
            - call: "GET /glp1/patients/${pat_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pat_v: "$.data.version" }
            - call: "POST /glp1/prescriptions"
              payload: { patient_id: "${pat_id}", consult_id: "${con_id}", prescriber_provider_id: "${doc_id}", screening_id: "${scr_id}", drug_family: "SEMAGLUTIDE", units_per_cycle: 2, expected_patient_version: "${pat_v}" }
              as: Provider
              as_user_id: "${doc_id}"
              captures: { rx_id: "$.data.id" }
            - call: "GET /glp1/titration-steps"
              payload: { prescription_id: "${rx_id}", status: "DUE" }
              as: Provider
              as_user_id: "${doc_id}"
              captures: { ts1_id: "$.data[0].id", ts1_planned: "$.data[0].earliest_escalation_at" }
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/check-ins"
              payload: { patient_id: "${pat_id}", prescription_id: "${rx_id}", nausea_score: 2, vomiting_score: 1, dehydration_flag: false }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { ci_id: "$.data.id" }
            - call: "POST /glp1/check-ins/${ci_id}/triage"
              payload: {}
              as: Provider
              as_user_id: "${doc_id}"
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-29T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /glp1/titration-steps/${ts1_id}/escalate"
              payload: {}
              as: Provider
              as_user_id: "${doc_id}"
              captures: { blocked_error: "$.data.error_id" }
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-13T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/titration-steps/${ts1_id}/escalate"
              payload: {}
              as: Provider
              as_user_id: "${doc_id}"
          assert:
            - "TitrationStep.${ts1_id}.earliest_escalation_at == 2026-06-29T00:00:00.000Z"
            - "CheckIn.${ci_id}.severity_score == 4 and CheckIn.${ci_id}.status == CLEARED"
            - "Prescription.${rx_id}.severity_index_since_dose_change == 4 immediately after triage"
            - "the escalate at 2026-06-29 returns HTTP 409 with error_id ERR_TITRATION_INTERVAL_NOT_MET"
            - "the escalate at 2026-07-13 returns HTTP 200, TitrationStep.${ts1_id}.status == ADMINISTERED"
            - "Prescription.${rx_id}.dose_level == 2 and Prescription.${rx_id}.dose_mg == 0.5"

      - name: coaching_credit_booking_gate_versus_settle_refund
        grounds:
          - calculations.coaching_entitlement_balance
          - entities.Subscription.fields.coaching_credits_available
          - entities.BillingCycle.fields.coaching_unused_credit_cents
          - state_machines.CoachingSession.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          The dual variant lives on the entitlement domain (Subscription plus CoachingSession):
          RESERVED_INCLUSIVE reports coaching_credits_available 2 because one session is still
          scheduled, while COMPLETED_ONLY refunds three unused credits at settle for 3000 cents,
          a number that is unreachable under the booking-gate reading.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; CASH patient with a dose_level 1, units_per_cycle 2 prescription."
            - "Subscription anchored at 2026-06-01 with coaching_addon_enabled true, so cycle 1 spans [2026-06-01, 2026-07-01) and 4 coaching credits are granted."
            - "Two sessions booked with an ACTIVE COACH; the first has been completed, the second is still SCHEDULED."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/patients"
              payload: { email: "cam@example.com", full_name: "Cam Diaz", state_code: "CA", height_cm: 170, weight_kg: 86.7, payment_mode: "CASH", comorbidity_codes: [] }
              as: PlatformAdmin
              captures: { pat_id: "$.data.id" }
            - call: "POST /glp1/providers"
              payload: { full_name: "Dr Nia Cole", provider_type: "CLINICIAN", licensed_state_codes: ["CA"], npi: "1710001004" }
              as: PlatformAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /glp1/providers"
              payload: { full_name: "Coach Kim", provider_type: "COACH", licensed_state_codes: ["CA"] }
              as: PlatformAdmin
              captures: { coach_id: "$.data.id" }
            - call: "POST /glp1/screenings"
              payload: { patient_id: "${pat_id}", recorded_weight_kg: 86.7, egfr: 92.0, lab_collected_at: "2026-05-20T00:00:00Z" }
              as: Provider
              as_user_id: "${doc_id}"
              captures: { scr_id: "$.data.id" }
            - call: "POST /glp1/screenings/${scr_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${doc_id}"
            - call: "POST /glp1/consults"
              payload: { patient_id: "${pat_id}", provider_id: "${doc_id}", scheduled_start_at: "2026-06-02T15:00:00Z", scheduled_end_at: "2026-06-02T15:30:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { con_id: "$.data.id" }
            - call: "POST /glp1/consults/${con_id}/complete"
              payload: { outcome: "PRESCRIBE" }
              as: Provider
              as_user_id: "${doc_id}"
            - call: "GET /glp1/patients/${pat_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pat_v: "$.data.version" }
            - call: "POST /glp1/prescriptions"
              payload: { patient_id: "${pat_id}", consult_id: "${con_id}", prescriber_provider_id: "${doc_id}", screening_id: "${scr_id}", drug_family: "SEMAGLUTIDE", units_per_cycle: 2, expected_patient_version: "${pat_v}" }
              as: Provider
              as_user_id: "${doc_id}"
              captures: { rx_id: "$.data.id" }
            - call: "POST /glp1/subscriptions"
              payload: { patient_id: "${pat_id}", prescription_id: "${rx_id}", anchor_at: "2026-06-01T00:00:00Z", coaching_addon_enabled: true }
              as: BillingAdmin
              captures: { sub_id: "$.data.id" }
            - call: "POST /glp1/coaching-sessions"
              payload: { subscription_id: "${sub_id}", coach_provider_id: "${coach_id}", scheduled_start_at: "2026-06-10T16:00:00Z", scheduled_end_at: "2026-06-10T17:00:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { cs1_id: "$.data.id" }
            - call: "POST /glp1/coaching-sessions"
              payload: { subscription_id: "${sub_id}", coach_provider_id: "${coach_id}", scheduled_start_at: "2026-06-12T16:00:00Z", scheduled_end_at: "2026-06-12T17:00:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { cs2_id: "$.data.id" }
            - call: "POST /glp1/coaching-sessions/${cs1_id}/complete"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
          trigger:
            - call: "GET /glp1/subscriptions/${sub_id}"
              payload: {}
              as: BillingAdmin
              captures: { avail_before_settle: "$.data.coaching_credits_available" }
            - call: "GET /glp1/billing-cycles"
              payload: { subscription_id: "${sub_id}", status: "OPEN" }
              as: BillingAdmin
              captures: { bc1_id: "$.data[0].id" }
            - call: "POST /glp1/billing-cycles/${bc1_id}/invoice"
              payload: {}
              as: BillingAdmin
            - call: "POST /glp1/billing-cycles/${bc1_id}/settle"
              payload: { payment_reference: "PAY-0002" }
              as: BillingAdmin
          assert:
            - "the GET before settle returns Subscription.${sub_id}.coaching_credits_available == 2"
            - "Subscription.${sub_id}.coaching_credits_granted == 4 and coaching_credits_reserved == 1 and coaching_credits_consumed == 1 at that same point"
            - "BillingCycle.${bc1_id}.medication_charge_cents == 34000"
            - "BillingCycle.${bc1_id}.coaching_addon_fee_cents == 4900"
            - "BillingCycle.${bc1_id}.dispensing_fee_cents == 0"
            - "BillingCycle.${bc1_id}.total_due_cents == 38900"
            - "BillingCycle.${bc1_id}.coaching_unused_credit_cents == 3000, not the 2000 the RESERVED_INCLUSIVE reading would produce"
            - "BillingCycle.${bc1_id}.settled_amount_cents == 35900"
            - "Patient.${pat_id}.lifetime_charged_cents == 35900"

      - name: rolling_window_versus_since_dose_change_severity_index
        grounds:
          - calculations.side_effect_severity_index
          - entities.Prescription.fields.severity_index_rolling
          - entities.Prescription.fields.severity_index_since_dose_change
          - state_machines.CheckIn.SUBMITTED_to_ESCALATED
          - state_machines.TitrationStep.DUE_to_ADMINISTERED
        distinguishing_aspect: |
          The dual variant lives on the symptom domain (CheckIn feeding Prescription): after the
          2026-07-13 escalation the very same triaged check-in of score 9 leaves
          severity_index_rolling at 9 because 2026-07-08 is inside the 30-day window, while
          severity_index_since_dose_change falls to 0 because the dose-change baseline moved past it.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; CASH patient with a dose_level 1 prescription created that day."
            - "On 2026-07-08 a check-in scoring 9 (nausea 3, vomiting 3) is triaged, escalating it and holding the prescription."
            - "On 2026-07-09 the escalation is resolved, returning the prescription to ACTIVE and its step to DUE."
            - "Clock advanced to 2026-07-13, exactly 42 days after the last dose change."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/patients"
              payload: { email: "dee@example.com", full_name: "Dee Fox", state_code: "CA", height_cm: 170, weight_kg: 95.0, payment_mode: "CASH", comorbidity_codes: [] }
              as: PlatformAdmin
              captures: { pat_id: "$.data.id" }
            - call: "POST /glp1/providers"
              payload: { full_name: "Dr Nia Cole", provider_type: "CLINICIAN", licensed_state_codes: ["CA"], npi: "1710001005" }
              as: PlatformAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /glp1/screenings"
              payload: { patient_id: "${pat_id}", recorded_weight_kg: 95.0, egfr: 88.0, lab_collected_at: "2026-05-20T00:00:00Z" }
              as: Provider
              as_user_id: "${doc_id}"
              captures: { scr_id: "$.data.id" }
            - call: "POST /glp1/screenings/${scr_id}/submit"
              payload: {}
