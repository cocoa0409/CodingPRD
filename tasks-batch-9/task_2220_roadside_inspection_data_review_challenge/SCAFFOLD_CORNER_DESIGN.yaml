              captures: { ca1_id: $.data.id, ca1_due: $.data.due_at }
            - call: "POST /data-challenges"
              payload: { report_id: "${r1_id}", challenge_type: "VIOLATION_NOT_SUPPORTED", narrative: "No radar reading was recorded.", target_violation_id: "${v1_id}" }
              as: CarrierAnalyst
