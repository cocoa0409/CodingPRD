            - call: "POST /facilities/${facs_id}/investors"
              payload: { investor_name: "Atlas Whole Loan Trust", counterparty_rating: "AA", concentration_limit_pct: 0.60 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { invs_id: "$.data.id" }
            - call: "POST /investors/${invs_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /facilities/${facs_id}/commitments"
              payload: { investor_id: "${invs_id}", product_code: "CONFORMING", committed_amount_cents: 5000000000, price_pct: 1.0125, effective_on: "2026-08-01", expires_on: "2026-12-31" }
