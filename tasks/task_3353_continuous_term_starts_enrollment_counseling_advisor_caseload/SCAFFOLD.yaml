# =============================================================================
# Scaffold: Continuous Term Starts, Enrollment Counseling & Advisor Caseload
# (Southern New Hampshire University style rolling-admission online university)
# =============================================================================

scenario: |
  Continuous Term Starts, Enrollment Counseling & Advisor Caseload (Southern New
  Hampshire University): frequent term start dates with rolling admission and
  application-to-start conversion tracking, enrollment counselor caseloads with
  contact cadence rules and regulatory limits on incentive compensation, transfer
  credit evaluation completed before enrollment to show a personalized degree
  path, financial aid packaging timed to term starts with disbursement and refund
  schedules, academic advising caseloads with early alert triggers on assignment
  submission and grade thresholds, course section capacity planning with adjunct
  faculty hiring against enrollment forecasts, retention interventions between
  terms with re-enrollment outreach, state authorization and licensure disclosure
  obligations by student location

domain_name: continuous-term-enrollment
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Term
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Term label, e.g. '2026 Fall A'" }
      - { name: start_date, type: string, source: input, description: "ISO date term instruction begins" }
      - { name: add_drop_end_date, type: string, source: input, description: "ISO date; last day roster adds are allowed" }
      - { name: census_date, type: string, source: input, description: "ISO date; enrollment snapshot for aid" }
      - { name: end_date, type: string, source: input, description: "ISO date term ends" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ENROLLMENT_OPEN | IN_SESSION | CLOSED" }

  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique program code, e.g. BS-CS" }
      - { name: title, type: string, source: input, description: "Program title" }
      - { name: total_credits_required, type: integer, source: input, description: "Credits needed to complete degree" }
      - { name: licensure_flag, type: boolean, source: input, description: "True when program leads to licensure; triggers disclosure obligation at enrollment" }

  - name: StateAuthorization
    parent: Program
    common_fields: false
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; authorized program" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code of student location" }
      - { name: authorization_status, type: enum, source: input, description: "AUTHORIZED | RESTRICTED | PROHIBITED | PENDING" }
      - { name: effective_from, type: string, source: input, description: "ISO date this authorization row takes effect (inclusive)" }
      - { name: effective_to, type: string, source: input, description: "ISO date this row stops applying (exclusive); null = open-ended", default: null }
      - { name: disclosure_text, type: string, source: input, description: "Disclosure text; required when authorization_status == RESTRICTED", default: null }

  - name: Staff
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff member name" }
      - { name: email, type: string, source: input, description: "Staff email" }
      - { name: staff_type, type: enum, source: input, description: "COUNSELOR | ADVISOR" }
      - { name: compensation_plan, type: enum, source: input, description: "NON_INCENTIVE | INCENTIVE; INCENTIVE counselors are barred from conversion attribution (regulatory)", default: NON_INCENTIVE }
      - { name: caseload_cap, type: integer, source: input, description: "Maximum active caseload (advisees for ADVISOR, prospects for COUNSELOR)" }
      - { name: active_caseload_count, type: integer, source: computed, description: "COUNSELOR: Applicants assigned_counselor_id==id with status IN {PROSPECT,APPLIED,ADMITTED}; ADVISOR: Enrollments advisor_id==id with status IN {REGISTERED,ACTIVE,DEFERRED}" }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Prospect full name" }
      - { name: email, type: string, source: input, description: "Prospect email" }
      - { name: state_code, type: string, source: input, description: "Two-letter state of residence; drives authorization checks" }
      - { name: status, type: enum, source: system, description: "PROSPECT | APPLIED | ADMITTED | ENROLLED" }
      - { name: assigned_counselor_id, type: string, source: system, description: "FK -> Staff.id; COUNSELOR chosen by counselor_assignment selector at creation; null when pool empty", default: null }
      - { name: contact_log, type: array, source: system, description: "Append-only entries {channel, outcome, attempted_at}; written by POST /api/applicants/{id}/contact-attempts" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id" }
      - { name: term_id, type: string, source: input, description: "FK -> Term.id; targeted start term" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: disclosure_acknowledged, type: boolean, source: input, description: "Required true at decision time when state authorization is RESTRICTED", default: false }
      - { name: licensure_disclosure_acknowledged, type: boolean, source: input, description: "Required true at enrollment when Program.licensure_flag is true", default: false }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ADMITTED | DENIED | WITHDRAWN | CONVERTED" }
      - { name: decision_reason, type: string, source: input, description: "Optional reason recorded at decision", default: null }

  - name: TransferCreditEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | COMPLETED | VOID" }
      - { name: accepted_credits, type: integer, source: input, description: "Raw transfer credits accepted by evaluator before cap" }
      - { name: in_progress_credits, type: integer, source: input, description: "Credits in progress elsewhere counted toward remaining path" }
      - { name: capped_credits, type: integer, source: computed, description: "= min(accepted_credits, floor(0.75 * Program.total_credits_required))" }
      - { name: remaining_credits, type: integer, source: computed, description: "= total_credits_required - capped_credits - in_progress_credits (degree_path_remaining)" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; must be ADMITTED" }
      - { name: term_id, type: string, source: system, description: "FK -> Term.id; copied from Application.term_id" }
      - { name: advisor_id, type: string, source: input, description: "FK -> Staff.id; staff_type must be ADVISOR" }
      - { name: enrollment_intensity, type: enum, source: input, description: "FULL_TIME | HALF_TIME | LESS_THAN_HALF_TIME" }
      - { name: tuition_cents, type: integer, source: input, description: "Tuition charged for the term; basis of institutional refund" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ACTIVE | COMPLETED | WITHDRAWN | DEFERRED" }
      - { name: financial_hold, type: boolean, source: computed, description: "true iff latest FinancialAidPackage status == PACKAGED and current logical date > Term.census_date" }
      - { name: withdrawal_date, type: string, source: system, description: "ISO date of withdrawal; null until WITHDRAWN", default: null }
      - { name: institutional_refund_cents, type: integer, source: computed, description: "Institutional-variant refund computed at withdrawal (r2t4_return INSTITUTIONAL)", default: 0 }

  - name: CourseSection
    parent: Term
    common_fields: true
    fields:
      - { name: term_id, type: string, source: system, description: "FK -> Term.id" }
      - { name: course_code, type: string, source: input, description: "Course code, e.g. CS-101" }
      - { name: capacity, type: integer, source: input, description: "Seat capacity staffed by core faculty" }
      - { name: forecast_enrollment, type: integer, source: input, description: "Forecast demand used for adjunct planning" }
      - { name: adjuncts_required, type: integer, source: computed, description: "= ceil(max(0, forecast_enrollment - capacity) / 30) per adjunct_forecast" }
      - { name: adjunct_hires, type: integer, source: system, description: "Adjuncts hired via section advance to STAFFED", default: 0 }
      - { name: enrolled_count, type: integer, source: computed, description: "Stored counter; incremented on roster add, decremented on withdrawal cascade" }
      - { name: seats_available, type: integer, source: computed, description: "Stored counter; invariant enrolled_count + seats_available == capacity" }
      - { name: status, type: enum, source: system, description: "PLANNED | STAFFING | STAFFED | OPEN | LOCKED" }

  - name: FinancialAidPackage
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: efc_cents, type: integer, source: input, description: "Expected family contribution used by award_packaging" }
      - { name: status, type: enum, source: system, description: "PACKAGED | CERTIFIED | DISBURSING | SETTLED | RETURNED" }
      - { name: estimated_award_cents, type: integer, source: computed, description: "ESTIMATED variant of award_packaging (assumes FULL_TIME)" }
      - { name: certified_award_cents, type: integer, source: computed, description: "CERTIFIED variant of award_packaging (actual intensity); 0 until certified" }
      - { name: disbursement_schedule, type: array, source: computed, description: "Entries {sequence, release_date, amount_cents, entry_status: SCHEDULED|DISBURSED|CANCELLED|RETURNED}; built at certify per disbursement_schedule rule" }
      - { name: disbursed_cents, type: integer, source: computed, description: "Gross sum of entries in DISBURSED or RETURNED", default: 0 }
      - { name: returned_cents, type: integer, source: computed, description: "Title-IV return applied at withdrawal (r2t4_return TITLE_IV)", default: 0 }
      - { name: retained_cents, type: integer, source: computed, description: "= disbursed_cents - returned_cents", default: 0 }
      - { name: cancelled_cents, type: integer, source: computed, description: "Sum of entries in CANCELLED", default: 0 }
      - { name: created_by_officer_id, type: string, source: system, description: "X-User-ID of creating FinancialAidOfficer; segregation-of-duties anchor" }

  - name: EarlyAlert
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: trigger_type, type: enum, source: input, description: "GRADE_THRESHOLD | LATE_SUBMISSION" }
      - { name: observed_grade_percent, type: number, source: input, description: "Grade observed; required for GRADE_THRESHOLD, must be < 70.00", default: null }
      - { name: days_late, type: integer, source: input, description: "Days past due; required for LATE_SUBMISSION, must be >= 3", default: null }
      - { name: severity, type: enum, source: computed, description: "HIGH when grade < 60.00 or days_late >= 7, else LOW" }
      - { name: status, type: enum, source: system, description: "OPEN | ACKNOWLEDGED | INTERVENTION | RESOLVED | ESCALATED" }

  - name: RetentionOutreach
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id" }
      - { name: applicant_id, type: string, source: system, description: "Denormalized applicant id (copied from Application) for cadence checks" }
      - { name: target_term_id, type: string, source: input, description: "Term id the outreach aims to re-enroll into (not FK-validated)" }
      - { name: status, type: enum, source: system, description: "QUEUED | SENT | RESPONDED | REENROLLED | EXPIRED" }
      - { name: sent_at, type: datetime, source: system, description: "Logical timestamp when SENT; null until then", default: null }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Term
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: ENROLLMENT_OPEN
        trigger: "POST /api/terms/{id}/advance with to_state=ENROLLMENT_OPEN"
        actor: RegistrarAdmin
        preconditions:
          - "current logical date >= start_date - 30 days (else ERR_TERM_CLOCK_NOT_REACHED)"
        side_effects:
          - "increments Term.version by 1"
      - from: ENROLLMENT_OPEN
        to: IN_SESSION
        trigger: "POST /api/terms/{id}/advance with to_state=IN_SESSION"
        actor: RegistrarAdmin
        preconditions:
          - "current logical date >= start_date (else ERR_TERM_CLOCK_NOT_REACHED)"
        side_effects:
          - "every Enrollment with term_id == Term.id and status == REGISTERED transitions to ACTIVE"
          - "for each Enrollment that became ACTIVE: its FinancialAidPackage in CERTIFIED transitions to DISBURSING and every schedule entry with release_date <= current logical date transitions SCHEDULED -> DISBURSED (disbursed_cents += amount)"
          - "increments Term.version by 1"
      - from: IN_SESSION
        to: CLOSED
        trigger: "POST /api/terms/{id}/advance with to_state=CLOSED"
        actor: RegistrarAdmin
        preconditions:
          - "current logical date >= end_date (else ERR_TERM_CLOCK_NOT_REACHED)"
        side_effects:
          - "every Enrollment with term_id == Term.id and status == ACTIVE transitions to COMPLETED"
          - "for each affected FinancialAidPackage: schedule entries with release_date <= end_date and status SCHEDULED transition to DISBURSED; entries with release_date > end_date transition to CANCELLED (cancelled_cents += amount); packages whose entries are all terminal transition to SETTLED"
          - "increments Term.version by 1"

  - entity: Applicant
    initial_state: PROSPECT
    terminal_states: []
    transitions:
      - from: PROSPECT
        to: APPLIED
        trigger: "POST /api/applications for this applicant"
        actor: system
        preconditions: []
        side_effects: ["increments Applicant.version by 1"]
      - from: APPLIED
        to: ADMITTED
        trigger: "POST /api/applications/{id}/decision with decision=ADMIT"
        actor: system
        preconditions: []
        side_effects: ["increments Applicant.version by 1"]
      - from: ADMITTED
        to: ENROLLED
        trigger: "POST /api/enrollments converts the admitted application"
        actor: system
        preconditions: []
        side_effects: ["increments Applicant.version by 1"]
      - from: ENROLLED
        to: ADMITTED
        trigger: "POST /api/enrollments/{id}/withdraw (student may re-enroll later)"
        actor: system
        preconditions: []
        side_effects: ["increments Applicant.version by 1"]

  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [DENIED, WITHDRAWN, CONVERTED]
    transitions:
      - from: SUBMITTED
        to: ADMITTED
        trigger: "POST /api/applications/{id}/decision with decision=ADMIT"
        actor: RegistrarAdmin
        preconditions:
          - "current StateAuthorization for (program_id, applicant.state_code) is AUTHORIZED, or RESTRICTED with disclosure_acknowledged == true; missing/PENDING/PROHIBITED -> ERR_STATE_NOT_AUTHORIZED; RESTRICTED without ack -> ERR_DISCLOSURE_REQUIRED"
        side_effects:
          - "Applicant.status APPLIED -> ADMITTED"
          - "increments Application.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/applications/{id}/decision with decision=DENY"
        actor: RegistrarAdmin
        preconditions: []
        side_effects: ["increments Application.version by 1"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/applications/{id}/withdraw"
        actor: Applicant | Counselor
        preconditions:
          - "Applicant caller: X-User-ID == application.applicant_id; Counselor caller: applicant.assigned_counselor_id == X-User-ID"
        side_effects: ["increments Application.version by 1"]
      - from: ADMITTED
        to: WITHDRAWN
        trigger: "POST /api/applications/{id}/withdraw"
        actor: Applicant | Counselor
        preconditions:
          - "same ownership rules as SUBMITTED -> WITHDRAWN"
        side_effects:
          - "Applicant.status ADMITTED -> APPLIED"
          - "increments Application.version by 1"
      - from: ADMITTED
        to: CONVERTED
        trigger: "POST /api/enrollments (application-to-start conversion)"
        actor: system
        preconditions: []
        side_effects:
          - "Applicant.status ADMITTED -> ENROLLED"
          - "increments Application.version by 1"

  - entity: TransferCreditEvaluation
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /api/transfer-credit-evaluations/{id}/advance with to_state=IN_REVIEW"
        actor: RegistrarAdmin
        preconditions: []
        side_effects: ["increments TransferCreditEvaluation.version by 1"]
      - from: IN_REVIEW
        to: COMPLETED
        trigger: "POST /api/transfer-credit-evaluations/{id}/advance with to_state=COMPLETED"
        actor: RegistrarAdmin
        preconditions: []
        side_effects:
          - "recomputes capped_credits and remaining_credits per degree_path_remaining"
          - "increments TransferCreditEvaluation.version by 1"
      - from: COMPLETED
        to: IN_REVIEW
        trigger: "POST /api/transfer-credit-evaluations/{id}/advance with to_state=IN_REVIEW (re-evaluation cycle)"
        actor: RegistrarAdmin
        preconditions:
          - "no Enrollment exists with application_id == TCE.application_id in status IN {REGISTERED, ACTIVE, DEFERRED} (else ERR_INVALID_STATE: degree path locked once enrolled)"
        side_effects: ["increments TransferCreditEvaluation.version by 1"]
      - from: DRAFT
        to: VOID
        trigger: "POST /api/transfer-credit-evaluations/{id}/advance with to_state=VOID"
        actor: RegistrarAdmin
        preconditions: []
        side_effects: ["increments TransferCreditEvaluation.version by 1"]
      - from: IN_REVIEW
        to: VOID
        trigger: "POST /api/transfer-credit-evaluations/{id}/advance with to_state=VOID"
        actor: RegistrarAdmin
        preconditions: []
        side_effects: ["increments TransferCreditEvaluation.version by 1"]

  - entity: Enrollment
    initial_state: REGISTERED
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "POST /api/terms/{id}/advance to IN_SESSION (system cascade)"
        actor: system
        preconditions: []
        side_effects: ["increments Enrollment.version by 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/terms/{id}/advance to CLOSED (system cascade)"
        actor: system
        preconditions: []
        side_effects: ["increments Enrollment.version by 1"]
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /api/enrollments/{id}/withdraw"
        actor: RegistrarAdmin
        preconditions:
          - "effective withdrawal date <= term.end_date (else ERR_WITHDRAWAL_WINDOW_CLOSED)"
        side_effects:
          - "withdrawal_date := payload withdrawal_date or current logical date"
          - "institutional_refund_cents := r2t4_return INSTITUTIONAL variant"
          - "Applicant.status ENROLLED -> ADMITTED"
          - "for each CourseSection of this term containing the enrollment: enrolled_count -= 1, seats_available += 1; if section status == LOCKED it transitions to OPEN"
          - "FinancialAidPackage in CERTIFIED or DISBURSING transitions to RETURNED; returned_cents := r2t4_return TITLE_IV variant; retained_cents recomputed; every SCHEDULED schedule entry transitions to CANCELLED (cancelled_cents += amount); every DISBURSED entry transitions to RETURNED"
          - "increments Enrollment.version by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /api/enrollments/{id}/withdraw"
        actor: RegistrarAdmin
        preconditions:
          - "effective withdrawal date <= term.end_date"
        side_effects:
          - "same cascade as REGISTERED -> WITHDRAWN"
      - from: REGISTERED
        to: DEFERRED
        trigger: "POST /api/enrollments/{id}/defer with to_state=DEFERRED"
        actor: RegistrarAdmin
        preconditions: []
        side_effects: ["increments Enrollment.version by 1"]
      - from: ACTIVE
        to: DEFERRED
        trigger: "POST /api/enrollments/{id}/defer with to_state=DEFERRED"
        actor: RegistrarAdmin
        preconditions: []
        side_effects: ["increments Enrollment.version by 1"]
      - from: DEFERRED
        to: REGISTERED
        trigger: "POST /api/enrollments/{id}/defer with to_state=REGISTERED (re-registration cycle)"
        actor: RegistrarAdmin
        preconditions:
          - "Term.status == ENROLLMENT_OPEN (else ERR_TERM_NOT_OPEN)"
          - "Enrollment.financial_hold == false (else ERR_FINANCIAL_HOLD)"
        side_effects: ["increments Enrollment.version by 1"]

  - entity: CourseSection
    initial_state: PLANNED
    terminal_states: []
    transitions:
      - from: PLANNED
        to: STAFFING
        trigger: "POST /api/sections/{id}/advance with to_state=STAFFING"
        actor: RegistrarAdmin
        preconditions:
          - "adjuncts_required > 0 (else ERR_INVALID_STATE: no staffing gap to fill)"
        side_effects: ["increments CourseSection.version by 1"]
      - from: PLANNED
        to: STAFFED
        trigger: "POST /api/sections/{id}/advance with to_state=STAFFED"
        actor: RegistrarAdmin
        preconditions:
          - "adjuncts_required == 0 (else ERR_INVALID_STATE: adjunct gap unfilled)"
        side_effects: ["increments CourseSection.version by 1"]
      - from: STAFFING
        to: STAFFED
        trigger: "POST /api/sections/{id}/advance with to_state=STAFFED and adjunct_hires payload"
        actor: RegistrarAdmin
        preconditions:
          - "adjunct_hires payload >= adjuncts_required (else ERR_INVALID_STATE: insufficient hires)"
        side_effects:
          - "adjunct_hires := payload value"
          - "increments CourseSection.version by 1"
      - from: STAFFED
        to: OPEN
        trigger: "POST /api/sections/{id}/advance with to_state=OPEN"
        actor: RegistrarAdmin
        preconditions:
          - "Term.status == ENROLLMENT_OPEN (else ERR_TERM_NOT_OPEN)"
        side_effects: ["increments CourseSection.version by 1"]
      - from: OPEN
        to: LOCKED
        trigger: "system: POST /api/sections/{id}/roster when seats_available becomes 0"
        actor: system
        preconditions: []
        side_effects: ["increments CourseSection.version by 1"]
      - from: LOCKED
        to: OPEN
        trigger: "system: enrollment withdrawal cascade frees a seat"
        actor: system
        preconditions: []
        side_effects: ["increments CourseSection.version by 1"]

  - entity: FinancialAidPackage
    initial_state: PACKAGED
    terminal_states: [SETTLED, RETURNED]
    transitions:
      - from: PACKAGED
        to: CERTIFIED
        trigger: "POST /api/financial-aid-packages/{id}/certify"
        actor: FinancialAidOfficer
        preconditions:
          - "certifying X-User-ID != created_by_officer_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "expected_enrollment_version matches Enrollment.version (else ERR_STALE_VERSION)"
        side_effects:
          - "certified_award_cents := award_packaging CERTIFIED variant"
          - "disbursement_schedule built per disbursement_schedule rule"
          - "increments Enrollment.version by 1"
          - "increments FinancialAidPackage.version by 1"
      - from: CERTIFIED
        to: DISBURSING
        trigger: "POST /api/terms/{id}/advance to IN_SESSION (system cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "schedule entries with release_date <= current logical date transition SCHEDULED -> DISBURSED (disbursed_cents += amount)"
          - "increments FinancialAidPackage.version by 1"
      - from: CERTIFIED
        to: RETURNED
        trigger: "POST /api/enrollments/{id}/withdraw (system cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "returned_cents := r2t4_return TITLE_IV over disbursed_cents; retained_cents recomputed; SCHEDULED entries -> CANCELLED; DISBURSED entries -> RETURNED"
          - "increments FinancialAidPackage.version by 1"
      - from: DISBURSING
        to: RETURNED
        trigger: "POST /api/enrollments/{id}/withdraw (system cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "same as CERTIFIED -> RETURNED"
      - from: DISBURSING
        to: SETTLED
        trigger: "POST /api/terms/{id}/advance to CLOSED (system cascade)"
        actor: system
        preconditions:
          - "all schedule entries in terminal entry_status {DISBURSED, CANCELLED, RETURNED}"
        side_effects: ["increments FinancialAidPackage.version by 1"]

  - entity: EarlyAlert
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /api/early-alerts/{id}/advance with to_state=ACKNOWLEDGED"
        actor: Advisor
        preconditions:
          - "caller X-User-ID == enrollment.advisor_id (else ERR_FORBIDDEN)"
        side_effects: ["increments EarlyAlert.version by 1"]
      - from: ACKNOWLEDGED
        to: INTERVENTION
        trigger: "POST /api/early-alerts/{id}/advance with to_state=INTERVENTION"
        actor: Advisor
        preconditions:
          - "caller owns the enrollment"
        side_effects: ["increments EarlyAlert.version by 1"]
      - from: INTERVENTION
        to: RESOLVED
        trigger: "POST /api/early-alerts/{id}/advance with to_state=RESOLVED"
        actor: Advisor
        preconditions:
          - "caller owns the enrollment"
        side_effects: ["increments EarlyAlert.version by 1"]
      - from: INTERVENTION
        to: ESCALATED
        trigger: "POST /api/early-alerts/{id}/advance with to_state=ESCALATED"
        actor: Advisor
        preconditions:
          - "caller owns the enrollment"
        side_effects: ["increments EarlyAlert.version by 1"]
      - from: ESCALATED
        to: INTERVENTION
        trigger: "POST /api/early-alerts/{id}/advance with to_state=INTERVENTION (escalation loop)"
        actor: Advisor
        preconditions:
          - "caller owns the enrollment"
        side_effects: ["increments EarlyAlert.version by 1"]

  - entity: RetentionOutreach
    initial_state: QUEUED
    terminal_states: [REENROLLED, EXPIRED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /api/retention-outreaches/{id}/advance with to_state=SENT"
        actor: Advisor
        preconditions:
          - "caller X-User-ID == enrollment.advisor_id"
        side_effects:
          - "sent_at := current logical timestamp"
          - "increments RetentionOutreach.version by 1"
      - from: SENT
        to: RESPONDED
        trigger: "POST /api/retention-outreaches/{id}/advance with to_state=RESPONDED"
        actor: Advisor
        preconditions:
          - "caller owns the enrollment"
        side_effects: ["increments RetentionOutreach.version by 1"]
      - from: RESPONDED
        to: REENROLLED
        trigger: "POST /api/retention-outreaches/{id}/advance with to_state=REENROLLED"
        actor: Advisor
        preconditions:
          - "caller owns the enrollment"
          - "a new Enrollment for the same applicant with term_id == target_term_id exists in status IN {REGISTERED, ACTIVE, DEFERRED} (else ERR_INVALID_STATE)"
        side_effects: ["increments RetentionOutreach.version by 1"]
      - from: QUEUED
        to: EXPIRED
        trigger: "system: lazy evaluation — current logical date > target term start_date, evaluated on any advance attempt or read of this outreach"
        actor: system
        preconditions: []
        side_effects: ["increments RetentionOutreach.version by 1"]
      - from: SENT
        to: EXPIRED
        trigger: "system: lazy evaluation as above"
        actor: system
        preconditions: []
        side_effects: ["increments RetentionOutreach.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: enroll-create-stale-application
    parent_entity: Application
    write_endpoint: "POST /api/enrollments"
    occ_field: expected_application_version
    description: |
      Creating an Enrollment against an Application whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just converted the admitted application (which
      flips it ADMITTED -> CONVERTED and bumps Application.version) and the
      current writer's view of the application is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: package-certify-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /api/financial-aid-packages/{id}/certify"
    occ_field: expected_enrollment_version
    description: |
      Certifying a FinancialAidPackage against an Enrollment whose version has
      advanced since the certifying officer last observed it is rejected,
      because certify itself mutates the Enrollment (bumps its version) and a
      stale view means another certification-relevant mutation has landed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: award_packaging
    trigger: "POST /api/enrollments/{id}/financial-aid-packages (ESTIMATED variant, at creation); POST /api/financial-aid-packages/{id}/certify (CERTIFIED variant)"
    algorithm: threshold
    formula: |
      coa = COA_BY_INTENSITY[intensity]
      award_cents = min(PELL_MAX_CENTS, max(0, coa - efc_cents))
      Variants differ ONLY in which intensity feeds COA_BY_INTENSITY.
    input_set: "the FinancialAidPackage's enrollment (intensity), package efc_cents"
    constants:
      PELL_MAX_CENTS: 739500
      COA_FULL_TIME_CENTS: 800000
      COA_HALF_TIME_CENTS: 500000
      COA_LESS_THAN_HALF_TIME_CENTS: 200000
    precision: "integer cents; no rounding"
    variants:
      - name: ESTIMATED
        when: "package creation (status PACKAGED)"
        difference: "always uses COA_FULL_TIME_CENTS regardless of actual enrollment_intensity (estimated_award_cents)"
      - name: CERTIFIED
        when: "certify (status CERTIFIED)"
        difference: "uses COA_BY_INTENSITY[Enrollment.enrollment_intensity] (certified_award_cents); identical inputs therefore produce a different number whenever intensity != FULL_TIME"

  - name: r2t4_return
    trigger: "POST /api/enrollments/{id}/withdraw — BOTH variants computed from the same withdrawal_date"
    algorithm: threshold
    formula: |
      total_days   = (term.end_date - term.start_date).days + 1          # inclusive day count
      days_done    = (withdrawal_date - term.start_date).days + 1        # inclusive of withdrawal day
      earned       = days_done / total_days                              # exact rational
      TITLE_IV variant:
        if earned > R2T4_EARNED_CLIFF: return_cents = 0                  # strict >; earned == 0.60 still returns
        else: return_cents = round_half_up(disbursed_cents * (1 - earned))
      INSTITUTIONAL variant (on tuition_cents, independent of disbursed):
        if withdrawal_date <= term.census_date:            refund = tuition_cents
        elif withdrawal_date <= term.census_date + 14 days: refund = round_half_up(tuition_cents * 0.5)
        else:                                               refund = 0
    input_set: "withdrawn Enrollment (term dates, tuition_cents) and its FinancialAidPackage.disbursed_cents at withdrawal time"
    constants:
      R2T4_EARNED_CLIFF: 0.60
      INST_HALF_REFUND_WINDOW_DAYS: 14
    precision: "integer cents, round_half_up"
    variants:
      - name: TITLE_IV
        when: "governs federal funds return; writes FinancialAidPackage.returned_cents"
        difference: "pro-rata on disbursed aid with a strict > 0.60 earned cliff"
      - name: INSTITUTIONAL
        when: "governs tuition refund; writes Enrollment.institutional_refund_cents"
        difference: "step function on tuition_cents keyed to census_date; same withdrawal inputs yield a different amount than TITLE_IV"

  - name: counselor_assignment
    trigger: "POST /api/applicants"
    algorithm: aggregation
    formula: |
      candidates = Staff where staff_type == COUNSELOR
                   and active_caseload_count < caseload_cap
      rank by (active_caseload_count ASC, caseload_cap DESC, created_at ASC)
      winner = first candidate; if candidates empty -> assigned_counselor_id = null (no error)
    input_set: "all Staff rows with staff_type == COUNSELOR"
    constants: {}
    precision: "integer counts; created_at tie-break, never id"

  - name: contact_cadence
    trigger: "POST /api/applicants/{id}/contact-attempts"
    algorithm: threshold
    formula: |
      window = applicant.contact_log entries with attempted_at in (now - 168h, now]  # half-open: exactly 168h old EXCLUDED
      if len(window) >= MAX_CONTACTS_PER_7D: reject ERR_CONTACT_CADENCE_EXCEEDED
      else: append {channel, outcome, attempted_at = now}
    input_set: "Applicant.contact_log entries only (all channels and outcomes count)"
    constants:
      MAX_CONTACTS_PER_7D: 3
      CADENCE_WINDOW_HOURS: 168
    precision: "exact timestamp comparison against the logical clock"

  - name: adjunct_forecast
    trigger: "CourseSection creation; read on section advance to STAFFING/STAFFED"
    algorithm: tiered_pricing
    formula: |
      PER SECTION: adjuncts_required = ceil(max(0, forecast_enrollment - capacity) / ADJUNCT_SECTION_SIZE)
      TERM TOTAL (hiring plan): sum of per-section adjuncts_required.
      Pinned rounding order: round PER SECTION FIRST (ceil per section), then sum.
      The alternative order (sum shortfalls, then ceil) is WRONG and produces a
      smaller number, e.g. shortfalls 35 and 1: per-section ceil -> 2 + 1 = 3;
      sum-then-ceil -> ceil(36/30) = 2.
    input_set: "CourseSection rows of the term (any status)"
    constants:
      ADJUNCT_SECTION_SIZE: 30
    precision: "integer; ceil per section"

  - name: degree_path_remaining
    trigger: "TransferCreditEvaluation advance to COMPLETED"
    algorithm: constraint_propagation
    formula: |
      Pinned evaluation order (circular-looking dependency resolved):
        1. total := Program.total_credits_required          (from Application.program_id)
        2. cap   := floor(total * TRANSFER_CAP_NUM / TRANSFER_CAP_DEN)
        3. capped_credits   := min(accepted_credits, cap)
        4. remaining_credits := max(0, total - capped_credits - in_progress_credits)
    input_set: "the TCE row plus its Application's Program"
    constants:
      TRANSFER_CAP_NUM: 3
      TRANSFER_CAP_DEN: 4
    precision: "integer credits; floor on the cap"

  - name: disbursement_schedule
    trigger: "POST /api/financial-aid-packages/{id}/certify"
    algorithm: waterfall_allocation
    formula: |
      total_days = (term.end_date - term.start_date).days + 1
      midpoint   = term.start_date + floor(total_days / 2) days
      entry1 = { sequence: 1, release_date: term.census_date, amount_cents: floor(certified_award_cents / 2) }
      entry2 = { sequence: 2, release_date: midpoint,         amount_cents: certified_award_cents - entry1.amount_cents }
      Remainder cent goes to the SECOND entry (pinned).
      Lazy release: on any request that reads or mutates the package, entries
      with entry_status == SCHEDULED and release_date <= current logical date
      and Term.status == IN_SESSION transition to DISBURSED (disbursed_cents += amount).
      Invariant: certified_award_cents == disbursed_cents + cancelled_cents
                 whenever every entry is terminal.
    input_set: "the package's certified award and its enrollment's term"
    constants: {}
    precision: "integer cents; floor on first entry"

  - name: retention_cadence
    trigger: "POST /api/enrollments/{id}/retention-outreaches"
    algorithm: threshold
    formula: |
      last = most recent RetentionOutreach for the same applicant_id
             (via this enrollment's application) with status IN {SENT, RESPONDED};
             ties broken by created_at DESC, never id
      if last exists and (now - last.sent_at) < MIN_DAYS_BETWEEN_OUTREACH days:
          reject ERR_OUTREACH_CADENCE
      Equality at exactly 14 days is ALLOWED (strict < rejects).
    input_set: "RetentionOutreach rows sharing the applicant_id"
    constants:
      MIN_DAYS_BETWEEN_OUTREACH: 14
    precision: "exact timestamp comparison against the logical clock"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all /api/* endpoints"
  - priority: 2
    category: auth
    check: "role permitted for this endpoint; entity_backed ownership rules (Counselor/Advisor staff_type matches role; Advisor owns enrollment; Applicant acts on self)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all /api/* endpoints"
  - priority: 3
    category: existence
    check: "request body shape: required fields present, enums valid, types correct; Term date ordering start_date < add_drop_end_date <= census_date < end_date (uses ERR_TERM_DATE_INVALID)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 4
    category: existence
    check: "path and body-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with ids"
  - priority: 5
    category: state
    check: "target resource in a state that allows this transition (decision on SUBMITTED application only; withdraw on REGISTERED/ACTIVE enrollment only; alert advance follows declared edges only)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "state authorization for (program, applicant.state_code) at decision and at enrollment: missing/PENDING/PROHIBITED rejected"
    error_id: ERR_STATE_NOT_AUTHORIZED
    http_status: 422
    applies_to: ["POST /api/applications/{id}/decision", "POST /api/enrollments"]
  - priority: 7
    category: business_safety
    check: "RESTRICTED authorization requires Application.disclosure_acknowledged == true"
    error_id: ERR_DISCLOSURE_REQUIRED
    http_status: 422
    applies_to: ["POST /api/applications/{id}/decision", "POST /api/enrollments"]
  - priority: 8
    category: business_safety
    check: "licensure program requires Application.licensure_disclosure_acknowledged == true"
    error_id: ERR_LICENSURE_DISCLOSURE_REQUIRED
    http_status: 422
    applies_to: ["POST /api/enrollments"]
  - priority: 9
    category: business_safety
    check: "regulatory: applicant's assigned counselor has compensation_plan == INCENTIVE -> conversion attribution barred"
    error_id: ERR_INCENTIVE_COMP_VIOLATION
    http_status: 422
    applies_to: ["POST /api/enrollments"]
  - priority: 10
    category: business_constraint
    check: "latest non-VOID TransferCreditEvaluation for the application is COMPLETED"
    error_id: ERR_EVALUATION_INCOMPLETE
    http_status: 422
    applies_to: ["POST /api/enrollments"]
  - priority: 11
    category: business_constraint
    check: "no existing Application for same applicant_id + term_id in status IN {SUBMITTED, ADMITTED}"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: ["POST /api/applications"]
  - priority: 12
    category: business_constraint
    check: "advisor active_caseload_count < caseload_cap; advisor staff_type must be ADVISOR (wrong type fails at priority 3 as ERR_INVALID_REQUEST)"
    error_id: ERR_CASELOAD_CAP_EXCEEDED
    http_status: 422
    applies_to: ["POST /api/enrollments"]
  - priority: 13
    category: business_constraint
    check: "section status == OPEN for roster adds (PLANNED/STAFFING/STAFFED -> ERR_SECTION_NOT_OPEN; LOCKED -> ERR_SECTION_FULL)"
    error_id: ERR_SECTION_NOT_OPEN
    http_status: 422
    applies_to: ["POST /api/sections/{id}/roster"]
  - priority: 14
    category: business_constraint
    check: "no overlap of [effective_from, effective_to) half-open windows for same (program_id, state_code); adjacency (new.from == existing.to) allowed"
    error_id: ERR_AUTHORIZATION_WINDOW_OVERLAP
    http_status: 422
    applies_to: ["POST /api/programs/{id}/state-authorizations"]
  - priority: 15
    category: business_constraint
    check: "contact cadence window (now-168h, now] holds < 3 attempts"
    error_id: ERR_CONTACT_CADENCE_EXCEEDED
    http_status: 422
    applies_to: ["POST /api/applicants/{id}/contact-attempts"]
  - priority: 16
    category: business_constraint
    check: "retention cadence: >= 14 days since last SENT/RESPONDED outreach for applicant"
    error_id: ERR_OUTREACH_CADENCE
    http_status: 422
    applies_to: ["POST /api/enrollments/{id}/retention-outreaches"]
  - priority: 17
    category: business_constraint
    check: "certifying officer differs from created_by_officer_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: ["POST /api/financial-aid-packages/{id}/certify"]
  - priority: 18
    category: business_constraint
    check: "alert thresholds: GRADE_THRESHOLD requires observed_grade_percent < 70.00; LATE_SUBMISSION requires days_late >= 3"
    error_id: ERR_ALERT_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: ["POST /api/enrollments/{id}/early-alerts"]
  - priority: 19
    category: business_temporal
    check: "term status == ENROLLMENT_OPEN for application creation, section opening, and defer-to-REGISTERED"
    error_id: ERR_TERM_NOT_OPEN
    http_status: 422
    applies_to: ["POST /api/applications", "POST /api/sections/{id}/advance", "POST /api/enrollments/{id}/defer"]
  - priority: 20
    category: business_temporal
    check: "current logical date <= term.add_drop_end_date for roster adds"
    error_id: ERR_ADD_DROP_CLOSED
    http_status: 422
    applies_to: ["POST /api/sections/{id}/roster"]
  - priority: 21
    category: business_temporal
    check: "effective withdrawal date <= term.end_date"
    error_id: ERR_WITHDRAWAL_WINDOW_CLOSED
    http_status: 422
    applies_to: ["POST /api/enrollments/{id}/withdraw"]
  - priority: 22
    category: business_temporal
    check: "term advance clock gates: ENROLLMENT_OPEN needs now >= start-30d; IN_SESSION needs now >= start_date; CLOSED needs now >= end_date"
    error_id: ERR_TERM_CLOCK_NOT_REACHED
    http_status: 422
    applies_to: ["POST /api/terms/{id}/advance"]
  - priority: 23
    category: business_temporal
    check: "Enrollment.financial_hold == false for defer -> REGISTERED"
    error_id: ERR_FINANCIAL_HOLD
    http_status: 422
    applies_to: ["POST /api/enrollments/{id}/defer"]
  - priority: 24
    category: business_fiscal
    check: "no existing FinancialAidPackage for the enrollment in status IN {PACKAGED, CERTIFIED, DISBURSING}"
    error_id: ERR_PACKAGE_ALREADY_EXISTS
    http_status: 409
    applies_to: ["POST /api/enrollments/{id}/financial-aid-packages"]

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time before the first call."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all lazy evaluations (disbursement releases, outreach expiry, financial_hold) use this clock"]

  - method: POST
    path: "/api/terms"
    description: "Create a term (status SCHEDULED). Validates date ordering."
    roles: [RegistrarAdmin]
    code: 201
    input: [name, start_date, add_drop_end_date, census_date, end_date]
    output: Term
    side_effects: []

  - method: GET
    path: "/api/terms/{id}"
    description: "Read one term"
    roles: [SystemAdmin, RegistrarAdmin, ComplianceOfficer, FinancialAidOfficer, Counselor, Advisor, Applicant]
    code: 200
    input: []
    output: Term
    side_effects: []

  - method: POST
    path: "/api/terms/{id}/advance"
    description: "Advance term status; clock-gated; cascades to enrollments and aid packages"
    roles: [RegistrarAdmin]
    code: 200
    input: [to_state]
    output: Term
    side_effects: ["Term state machine transitions and their cascades"]

  - method: GET
    path: "/api/terms/{id}/sections"
    description: "List sections of a term"
    roles: [SystemAdmin, RegistrarAdmin, ComplianceOfficer, FinancialAidOfficer, Counselor, Advisor, Applicant]
    code: 200
    input: []
    output: CourseSection[]
    side_effects: []

  - method: POST
    path: "/api/terms/{id}/sections"
    description: "Create a course section in PLANNED; seats_available := capacity; adjuncts_required computed"
    roles: [RegistrarAdmin]
    code: 201
    input: [course_code, capacity, forecast_enrollment]
    output: CourseSection
    side_effects: ["computes adjuncts_required per adjunct_forecast"]

  - method: POST
    path: "/api/programs"
    description: "Create a degree program"
    roles: [RegistrarAdmin]
    code: 201
    input: [code, title, total_credits_required, licensure_flag]
    output: Program
    side_effects: []

  - method: GET
    path: "/api/programs/{id}"
    description: "Read one program"
    roles: [SystemAdmin, RegistrarAdmin, ComplianceOfficer, FinancialAidOfficer, Counselor, Advisor, Applicant]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: GET
    path: "/api/programs/{id}/state-authorizations"
    description: "List state authorization rows for a program"
    roles: [SystemAdmin, RegistrarAdmin, ComplianceOfficer, FinancialAidOfficer, Counselor, Advisor, Applicant]
    code: 200
    input: []
    output: StateAuthorization[]
    side_effects: []

  - method: POST
    path: "/api/programs/{id}/state-authorizations"
    description: "Append a state authorization row; half-open window overlap rejected; disclosure_text required when RESTRICTED"
    roles: [ComplianceOfficer]
    code: 201
    input: [state_code, authorization_status, effective_from, "effective_to?", "disclosure_text?"]
    output: StateAuthorization
    side_effects: []

  - method: POST
    path: "/api/staff"
    description: "Create a counselor or advisor"
    roles: [SystemAdmin]
    code: 201
    input: [full_name, email, staff_type, caseload_cap, "compensation_plan?"]
    output: Staff
    side_effects: []

  - method: GET
    path: "/api/staff/{id}"
    description: "Read one staff member (includes active_caseload_count)"
    roles: [SystemAdmin, RegistrarAdmin, ComplianceOfficer, FinancialAidOfficer, Counselor, Advisor, Applicant]
    code: 200
    input: []
    output: Staff
    side_effects: []

  - method: GET
    path: "/api/staff/{id}/applicants"
    description: "List applicants assigned to a counselor"
    roles: [SystemAdmin, RegistrarAdmin, Counselor]
    code: 200
    input: []
    output: Applicant[]
    side_effects: []

  - method: POST
    path: "/api/applicants"
    description: "Create a prospect; counselor auto-assigned per counselor_assignment selector"
    roles: [RegistrarAdmin, Counselor]
    code: 201
    input: [full_name, email, state_code]
    output: Applicant
    side_effects: ["runs counselor_assignment; status PROSPECT"]

  - method: GET
    path: "/api/applicants/{id}"
    description: "Read one applicant (includes contact_log)"
    roles: [SystemAdmin, RegistrarAdmin, Counselor, Advisor, Applicant]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: POST
    path: "/api/applicants/{id}/contact-attempts"
    description: "Log a contact attempt; enforces rolling 7-day cadence; caller must be the assigned counselor"
    roles: [Counselor]
    code: 201
    input: [channel, outcome]
    output: Applicant
    side_effects: ["appends {channel, outcome, attempted_at=now} to Applicant.contact_log; increments Applicant.version by 1"]

  - method: POST
    path: "/api/applications"
    description: "Create application in SUBMITTED; term must be ENROLLMENT_OPEN; duplicate active application per applicant+term rejected"
    roles: [Applicant, Counselor]
    code: 201
    input: [applicant_id, term_id, program_id, "disclosure_acknowledged?", "licensure_disclosure_acknowledged?"]
    output: Application
    side_effects: ["Applicant.status PROSPECT -> APPLIED"]

  - method: GET
    path: "/api/applications"
    description: "List applications with filters and pagination"
    roles: [SystemAdmin, RegistrarAdmin, Counselor, Advisor]
    code: 200
    input: ["applicant_id?", "term_id?", "program_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: GET
    path: "/api/applications/{id}"
    description: "Read one application"
    roles: [SystemAdmin, RegistrarAdmin, Counselor, Advisor, Applicant]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/api/applications/{id}/decision"
    description: "Admit or deny; state authorization and disclosure gates apply"
    roles: [RegistrarAdmin]
    code: 200
    input: [decision, "reason?"]
    output: Application
    side_effects: ["ADMIT: Applicant.status APPLIED -> ADMITTED; increments Application.version by 1"]

  - method: POST
    path: "/api/applications/{id}/withdraw"
    description: "Withdraw a SUBMITTED or ADMITTED application (owner applicant or assigned counselor)"
    roles: [Applicant, Counselor]
    code: 200
    input: []
    output: Application
    side_effects: ["ADMITTED withdraw: Applicant.status ADMITTED -> APPLIED; increments Application.version by 1"]

  - method: GET
    path: "/api/applications/{id}/transfer-credit-evaluations"
    description: "List TCEs for an application"
    roles: [SystemAdmin, RegistrarAdmin, Counselor, Advisor, Applicant]
    code: 200
    input: []
    output: TransferCreditEvaluation[]
    side_effects: []

  - method: POST
    path: "/api/applications/{id}/transfer-credit-evaluations"
    description: "Create a TCE in DRAFT"
    roles: [RegistrarAdmin]
    code: 201
    input: [accepted_credits, in_progress_credits]
    output: TransferCreditEvaluation
    side_effects: []

  - method: POST
    path: "/api/transfer-credit-evaluations/{id}/advance"
    description: "Advance TCE status; COMPLETED computes degree path; COMPLETED->IN_REVIEW re-evaluation cycle blocked once enrolled"
    roles: [RegistrarAdmin]
    code: 200
    input: [to_state]
    output: TransferCreditEvaluation
    side_effects: ["COMPLETED: recomputes capped_credits and remaining_credits per degree_path_remaining"]

  - method: POST
    path: "/api/enrollments"
    description: "Convert an ADMITTED application into an enrollment (OCC on Application.version); requires completed TCE, authorization, disclosures, non-incentive counselor, advisor capacity"
    roles: [RegistrarAdmin]
    code: 201
    input: [application_id, advisor_id, enrollment_intensity, tuition_cents, expected_application_version]
    output: Enrollment
    side_effects:
      - "Application.status ADMITTED -> CONVERTED; increments Application.version by 1"
      - "Applicant.status ADMITTED -> ENROLLED"
      - "Enrollment.term_id := Application.term_id; status REGISTERED"

  - method: GET
    path: "/api/enrollments"
    description: "List enrollments with filters and pagination"
    roles: [SystemAdmin, RegistrarAdmin, FinancialAidOfficer, Advisor]
    code: 200
    input: ["advisor_id?", "term_id?", "application_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: GET
    path: "/api/enrollments/{id}"
    description: "Read one enrollment"
    roles: [SystemAdmin, RegistrarAdmin, FinancialAidOfficer, Advisor]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: POST
    path: "/api/enrollments/{id}/withdraw"
    description: "Withdraw an enrollment; computes both refund variants; cascades to sections, applicant, aid package"
    roles: [RegistrarAdmin]
    code: 200
    input: ["withdrawal_date?"]
    output: Enrollment
    side_effects: ["full withdrawal cascade per Enrollment state machine"]

  - method: POST
    path: "/api/enrollments/{id}/defer"
    description: "Defer (to_state=DEFERRED) or re-register (to_state=REGISTERED, gated by term ENROLLMENT_OPEN and financial_hold)"
    roles: [RegistrarAdmin]
    code: 200
    input: [to_state]
    output: Enrollment
    side_effects: ["increments Enrollment.version by 1"]

  - method: POST
    path: "/api/sections/{id}/advance"
    description: "Advance section status; STAFFED from STAFFING requires adjunct_hires >= adjuncts_required"
    roles: [RegistrarAdmin]
    code: 200
    input: [to_state, "adjunct_hires?"]
    output: CourseSection
    side_effects: ["increments CourseSection.version by 1"]

  - method: POST
    path: "/api/sections/{id}/roster"
    description: "Add an enrollment to a section roster; seat invariant maintained; auto-LOCKED at 0 seats"
    roles: [RegistrarAdmin]
    code: 200
    input: [enrollment_id]
    output: CourseSection
    side_effects:
      - "enrolled_count += 1; seats_available -= 1"
      - "if seats_available == 0: status OPEN -> LOCKED"
      - "increments CourseSection.version by 1"

  - method: POST
    path: "/api/enrollments/{id}/financial-aid-packages"
    description: "Create aid package in PACKAGED with ESTIMATED award; one active package per enrollment"
    roles: [FinancialAidOfficer]
    code: 201
    input: [efc_cents]
    output: FinancialAidPackage
    side_effects:
      - "estimated_award_cents := award_packaging ESTIMATED variant"
      - "created_by_officer_id := X-User-ID"

  - method: POST
    path: "/api/financial-aid-packages/{id}/certify"
    description: "Certify package (OCC on Enrollment.version; segregation of duties); builds disbursement schedule"
    roles: [FinancialAidOfficer]
    code: 200
    input: [expected_enrollment_version]
    output: FinancialAidPackage
    side_effects:
      - "certified_award_cents := award_packaging CERTIFIED variant"
      - "disbursement_schedule built per disbursement_schedule rule"
      - "increments Enrollment.version by 1"
      - "increments FinancialAidPackage.version by 1"

  - method: GET
    path: "/api/enrollments/{id}/financial-aid-packages"
    description: "List aid packages for an enrollment"
    roles: [SystemAdmin, RegistrarAdmin, FinancialAidOfficer]
    code: 200
    input: []
    output: FinancialAidPackage[]
    side_effects: []

  - method: GET
    path: "/api/enrollments/{id}/early-alerts"
    description: "List early alerts for an enrollment"
    roles: [SystemAdmin, RegistrarAdmin, Advisor]
    code: 200
    input: []
    output: EarlyAlert[]
    side_effects: []

  - method: POST
    path: "/api/enrollments/{id}/early-alerts"
    description: "System-injected early alert; threshold validation per trigger_type"
    roles: [SystemAdmin]
    code: 201
    input: [trigger_type, "observed_grade_percent?", "days_late?"]
    output: EarlyAlert
    side_effects: ["severity computed; status OPEN"]

  - method: POST
    path: "/api/early-alerts/{id}/advance"
    description: "Advance alert status (owning advisor only)"
    roles: [Advisor]
    code: 200
    input: [to_state]
    output: EarlyAlert
    side_effects: ["increments EarlyAlert.version by 1"]

  - method: POST
    path: "/api/enrollments/{id}/retention-outreaches"
    description: "Queue a re-enrollment outreach for a COMPLETED or WITHDRAWN enrollment; 14-day cadence per applicant"
    roles: [Advisor]
    code: 201
    input: [target_term_id]
    output: RetentionOutreach
    side_effects: ["status QUEUED; applicant_id denormalized from application"]

  - method: GET
    path: "/api/enrollments/{id}/retention-outreaches"
    description: "List retention outreaches for an enrollment"
    roles: [SystemAdmin, RegistrarAdmin, Advisor]
    code: 200
    input: []
    output: RetentionOutreach[]
    side_effects: []

  - method: POST
    path: "/api/retention-outreaches/{id}/advance"
    description: "Advance outreach status; REENROLLED requires a live enrollment into target term"
    roles: [Advisor]
    code: 200
    input: [to_state]
    output: RetentionOutreach
    side_effects: ["SENT: sent_at := now; increments RetentionOutreach.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not permitted, staff_type mismatch for entity_backed role, or ownership violation" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, invalid enum/type, wrong staff_type reference" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "referenced resource does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "transition not allowed from current state; includes TCE re-review while enrolled, REENROLLED without live target enrollment, section advance precondition failures" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version OCC mismatch on POST /api/enrollments or package certify" }
  - { id: ERR_TERM_DATE_INVALID, http: 422, condition: "term dates violate start < add_drop_end <= census < end" }
  - { id: ERR_TERM_NOT_OPEN, http: 422, condition: "operation requires term status ENROLLMENT_OPEN" }
  - { id: ERR_TERM_CLOCK_NOT_REACHED, http: 422, condition: "term advance attempted before its clock gate" }
  - { id: ERR_STATE_NOT_AUTHORIZED, http: 422, condition: "no current AUTHORIZED/RESTRICTED row for (program, applicant state), or status PENDING/PROHIBITED" }
  - { id: ERR_DISCLOSURE_REQUIRED, http: 422, condition: "RESTRICTED state requires disclosure_acknowledged == true" }
  - { id: ERR_LICENSURE_DISCLOSURE_REQUIRED, http: 422, condition: "licensure program requires licensure_disclosure_acknowledged == true" }
  - { id: ERR_INCENTIVE_COMP_VIOLATION, http: 422, condition: "conversion would be attributed to an INCENTIVE-plan counselor" }
  - { id: ERR_EVALUATION_INCOMPLETE, http: 422, condition: "no COMPLETED transfer credit evaluation for the application" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "active application already exists for applicant + term" }
  - { id: ERR_CASELOAD_CAP_EXCEEDED, http: 422, condition: "advisor active caseload at cap" }
  - { id: ERR_SECTION_NOT_OPEN, http: 422, condition: "roster add on section not in OPEN" }
  - { id: ERR_SECTION_FULL, http: 422, condition: "roster add on LOCKED section (0 seats)" }
  - { id: ERR_AUTHORIZATION_WINDOW_OVERLAP, http: 422, condition: "overlapping [effective_from, effective_to) window for same program+state" }
  - { id: ERR_CONTACT_CADENCE_EXCEEDED, http: 422, condition: "3 contact attempts already logged in rolling 168h window" }
  - { id: ERR_OUTREACH_CADENCE, http: 422, condition: "less than 14 days since last SENT/RESPONDED outreach for applicant" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "certifying officer equals package creator" }
  - { id: ERR_ALERT_THRESHOLD_NOT_MET, http: 422, condition: "alert trigger thresholds not satisfied" }
  - { id: ERR_ADD_DROP_CLOSED, http: 422, condition: "roster add after add_drop_end_date" }
  - { id: ERR_WITHDRAWAL_WINDOW_CLOSED, http: 422, condition: "withdrawal date after term end_date" }
  - { id: ERR_FINANCIAL_HOLD, http: 422, condition: "re-registration blocked by financial hold" }
  - { id: ERR_PACKAGE_ALREADY_EXISTS, http: 409, condition: "active aid package already exists for enrollment" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator; manages staff, logical clock, and system-injected early alerts"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc", "POST /api/staff", "POST /api/enrollments/{id}/early-alerts"]
    shared_operations: ["read endpoints"]
  - name: RegistrarAdmin
    description: "Registrar operator; owns terms, programs, sections, applications decisions, TCEs, enrollments"
    identity: opaque
    exclusive_operations: ["POST /api/terms", "POST /api/terms/{id}/advance", "POST /api/terms/{id}/sections", "POST /api/programs", "POST /api/applications/{id}/decision", "POST /api/applications/{id}/transfer-credit-evaluations", "POST /api/transfer-credit-evaluations/{id}/advance", "POST /api/enrollments", "POST /api/enrollments/{id}/withdraw", "POST /api/enrollments/{id}/defer", "POST /api/sections/{id}/advance", "POST /api/sections/{id}/roster"]
    shared_operations: ["POST /api/applicants", "read endpoints"]
  - name: ComplianceOfficer
    description: "State authorization and disclosure compliance"
    identity: opaque
    exclusive_operations: ["POST /api/programs/{id}/state-authorizations"]
    shared_operations: ["read endpoints"]
  - name: FinancialAidOfficer
    description: "Aid packaging and certification; certification segregated from creation (different X-User-ID)"
    identity: opaque
    exclusive_operations: ["POST /api/enrollments/{id}/financial-aid-packages", "POST /api/financial-aid-packages/{id}/certify"]
    shared_operations: ["read endpoints"]
  - name: Counselor
    description: "Enrollment counselor; X-User-ID is a Staff id with staff_type COUNSELOR; acts on own caseload"
    identity: "entity_backed:Staff"
    exclusive_operations: ["POST /api/applicants/{id}/contact-attempts"]
    shared_operations: ["POST /api/applicants", "POST /api/applications", "POST /api/applications/{id}/withdraw", "read endpoints"]
  - name: Advisor
    description: "Academic advisor; X-User-ID is a Staff id with staff_type ADVISOR; acts on own advisees"
    identity: "entity_backed:Staff"
    exclusive_operations: ["POST /api/early-alerts/{id}/advance", "POST /api/enrollments/{id}/retention-outreaches", "POST /api/retention-outreaches/{id}/advance"]
    shared_operations: ["read endpoints"]
  - name: Applicant
    description: "Prospective student; X-User-ID is an Applicant id; acts only on own records"
    identity: "entity_backed:Applicant"
    exclusive_operations: []
    shared_operations: ["POST /api/applications", "POST /api/applications/{id}/withdraw", "read endpoints"]
