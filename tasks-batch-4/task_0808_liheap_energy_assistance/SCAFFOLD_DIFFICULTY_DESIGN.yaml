  - rule_id: compensating_invariant
    instances:
      - name: pool_conservation_pledge_cancel
        grounds:
          - calculations.pool_accounting
          - state_machines.Pledge.PLEDGED_to_CANCELLED
          - entities.FundingPool.fields.available_cents
          - entities.FundingPool.fields.reserved_cents
        distinguishing_aspect: "Conserved quantity = pool cents: total_allocation_cents == available_cents + reserved_cents + disbursed_cents holds after the forward pledge (reserve 20000) and after the compensating cancel (release 20000); no drift."
        test_recipe:
          setup:
            - "HEATING pool total 100000 threshold 10000; ENROLLED vendor; approved application; utility account; one PLEDGED pledge of 20000 (reserved 20000, available 80000)."
          setup_api_calls:
            - call: "POST /liheap/funding-pools"
              payload: { season_year: 2026, program_component: "HEATING", total_allocation_cents: 100000, depletion_threshold_cents: 10000 }
              as: ProgramAdmin
              captures: { pool_id: "$.data.id", pool_v: "$.data.version" }
            - call: "POST /liheap/vendors"
              payload: { name: "ConserveGas", vendor_type: "GAS", remittance_account: "rcg-1" }
              as: ProgramAdmin
              captures: { vendor_id: "$.data.id" }
            - call: "POST /liheap/vendors/${vendor_id}/enroll"
              payload: {}
              as: ProgramAdmin
            - call: "POST /liheap/households"
