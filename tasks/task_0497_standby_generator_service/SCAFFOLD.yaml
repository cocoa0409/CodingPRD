# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation per RBAC" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed actor is not the owner of the targeted resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "FK body reference (customer_id/model_id/tech_id) does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum, out-of-range number, empty/invalid appliances array" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not allowed from the resource's current state" }
  - { id: ERR_UNIT_NON_COMPLIANT, http: 409, condition: "Operation blocked because the Unit is NON_COMPLIANT (overdue MANDATORY recall)" }
  - { id: ERR_WARRANTY_LAPSED, http: 409, condition: "Warranty review/adjudication on a unit whose warranty_status is LAPSED or VOID" }
  - { id: ERR_TECH_NOT_QUALIFIED, http: 409, condition: "Install tech is SUSPENDED or not gas_certified" }
  - { id: ERR_MODEL_UNDERSIZED, http: 409, condition: "Chosen model rated_kw < required_kw, or model fuel_types excludes project fuel_type" }
  - { id: ERR_FUEL_INADEQUATE, http: 409, condition: "Fuel BTU supply does not cover the sized unit at permit step" }
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "serial_no already used by another Unit at activation" }
  - { id: ERR_SEGREGATION_VIOLATION, http: 409, condition: "Closing principal equals the technician who resolved the dispatch" }
  - { id: ERR_TECH_OVERLOADED, http: 409, condition: "Technician already has open_dispatch_count >= 5 at assign" }
  - { id: ERR_NO_ASSESSMENT, http: 409, condition: "Sizing attempted with no LoadAssessment / referenced assessment not on project" }
  - { id: ERR_PERMIT_NOT_APPROVED, http: 409, condition: "Activation attempted while permit_status != APPROVED or fuel not verified" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Customer email already registered" }
  - { id: ERR_DUPLICATE_LICENSE, http: 409, condition: "Technician license_no already registered" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "Model sku already exists" }
  - { id: ERR_DUPLICATE_RECALL_CODE, http: 409, condition: "Recall campaign code already exists" }
  - { id: ERR_MODEL_INACTIVE, http: 409, condition: "Chosen model has active=false at sizing time" }
  - { id: ERR_REMEDIATION_OVERDUE, http: 409, condition: "Scheduling a remediation that is already OVERDUE" }
  - { id: ERR_CAMPAIGN_HAS_OPEN_REMEDIATIONS, http: 409, condition: "Closing a campaign with PENDING/SCHEDULED remediations" }
  - { id: ERR_DISPATCH_IN_PROGRESS, http: 409, condition: "Decommission/cancel blocked by a DISPATCHED/IN_PROGRESS dispatch" }
  - { id: ERR_NOT_ASSIGNED_TECH, http: 403, condition: "Acting technician is not the assigned/install tech for this resource" }
  - { id: ERR_TECH_DOUBLE_BOOKED, http: 409, condition: "Assigned technician already has a SCHEDULED visit within VISIT_BUFFER_HOURS (buffered half-open interval)" }
  - { id: ERR_UNIT_VISIT_COLLISION, http: 409, condition: "Unit already has a SCHEDULED visit on the same UTC calendar day (closed day-bucket interval)" }
  - { id: ERR_VALIDATION, http: 422, condition: "Semantically invalid value that parses but violates a field rule (e.g. starting_watts < running_watts)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register a Customer or Technician."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /customers"
      - "POST /technicians"

  - name: Customer
    description: "Homeowner/site owner. Owns projects, units, plans, claims; X-User-ID is a Customer.id."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /warranty-claims/{id}/withdraw (own units)"
      - "POST /maintenance-plans/{id}/suspend / resume (own units)"
    shared_operations:
      - "POST /projects (own customer_id)"
      - "POST /projects/{id}/load-assessments"
      - "POST /units/{id}/exercise-logs (own units)"
      - "PATCH /units/{id} (own units; monitoring/register)"
      - "POST /units/{id}/maintenance-plans / warranty-claims / repair-dispatches (own units)"
      - "POST /maintenance-plans/{id}/visits / cancel"
      - "POST /maintenance-visits/{id}/cancel"
      - "GET on own resources"

  - name: Technician
    description: "Field technician. Performs installs, visit completions, repair work; X-User-ID is a Technician.id."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /maintenance-visits/{id}/complete (assigned tech only)"
      - "POST /repair-dispatches/{id}/start / pause / resolve (assigned tech only)"
    shared_operations:
      - "POST /projects/{id}/install (as install_tech)"
      - "GET on units, dispatches, visits, models"

  - name: ServiceManager
    description: "Operational role: runs sizing/permit/activation gating, dispatch assignment, decommission, catalog. Opaque operator id."
    identity: opaque
    exclusive_operations:
      - "POST /projects/{id}/size / permit / activate / cancel"
      - "POST /units/{id}/decommission"
      - "POST /repair-dispatches/{id}/assign / close / cancel"
      - "POST /recall-remediations/{id}/schedule"
      - "POST /models, PATCH /technicians/{id}"
    shared_operations:
      - "Most Customer business endpoints (operator acting on behalf)"
      - "GET on all resources"

  - name: ComplianceOfficer
    description: "Adjudicates warranty claims and manages recall campaigns. Opaque operator id; segregated from field work."
    identity: opaque
    exclusive_operations:
      - "POST /warranty-claims/{id}/review / return-for-info / adjudicate"
      - "POST /recall-campaigns, /recall-campaigns/{id}/open / close"
    shared_operations:
      - "GET on units, claims, campaigns, remediations, models"
