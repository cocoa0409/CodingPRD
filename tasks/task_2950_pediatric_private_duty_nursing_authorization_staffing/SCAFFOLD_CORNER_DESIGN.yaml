              payload: { name: "Sunrise MCO", plan_type: "MEDICAID_MCO", weekly_hour_cap: 84 }
              as: AgencyAdmin
              as_user_id: "admin-001"
              captures: { payer_id: $.data.id }
            - call: "POST /pdn/patients"
              payload: { payer_id: "${payer_id}", full_name: "Mia Reyes", date_of_birth: "2019-04-12", primary_diagnosis: "Chronic respiratory failure", requires_trach: true, requires_vent: true }
              as: CaseManager
