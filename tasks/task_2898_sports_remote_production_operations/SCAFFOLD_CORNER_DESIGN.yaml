      - name: primary_booking_requires_a_primary_eligible_path
        claim_type: violation_to_error
        grounds:
          - validations[priority=47]
          - errors[ERR_PATH_REDUNDANCY_INVALID]
        distinguishing_aspect: |
          A BACKUP_ONLY path refuses a PRIMARY booking but accepts a BACKUP one on the very same
          window, so the rule is about the (booking_role, redundancy_class) pair rather than about the
          path being busy. The refusal must leave committed_mbps_total at 0.
        test_recipe:
          setup:
            - "One TIER_3 production and one BACKUP_ONLY fiber path of 300 Mbps."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id, pv1: $.data.version }
            - call: "POST /broadcast-ops/transmission-paths"
              payload: { path_code: "FIB-BK", path_type: "FIBER", carrier_code: "ZAYO", capacity_mbps: 300, redundancy_class: "BACKUP_ONLY" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { path_id: $.data.id }
          trigger:
            - call: "POST /broadcast-ops/path-bookings"
              payload: { production_id: "${prod_id}", path_id: "${path_id}", booking_role: "PRIMARY", window_start_utc: "2026-08-15T12:00:00Z", window_end_utc: "2026-08-16T02:00:00Z", requested_mbps: 100, expected_production_version: "${pv1}" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err: $.data.error_id }
            - call: "POST /broadcast-ops/path-bookings"
              payload: { production_id: "${prod_id}", path_id: "${path_id}", booking_role: "BACKUP", window_start_utc: "2026-08-15T12:00:00Z", window_end_utc: "2026-08-16T02:00:00Z", requested_mbps: 100, expected_production_version: "${pv1}" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { backup_id: $.data.id }
          assert:
            - "PRIMARY on a BACKUP_ONLY path: HTTP 422 with error_id == ERR_PATH_REDUNDANCY_INVALID"
            - "TransmissionPath.${path_id}.committed_mbps_total == 0 and active_booking_count == 0 after the refusal"
            - "BACKUP on the same path and window: HTTP 201 with PathBooking.${backup_id}.status == RESERVED"
            - "TransmissionPath.${path_id}.committed_mbps_total == 100 and active_booking_count == 1"
            - "Production.${prod_id}.readiness_score_preflight == 0.00 - only PRIMARY bookings feed the transmission component"

      - name: duplicate_prep_kind_rejected_regardless_of_prep_status
        claim_type: violation_to_error
        grounds:
          - validations[priority=29]
          - errors[ERR_DUPLICATE_PREP_KIND]
        distinguishing_aspect: |
          The uniqueness set is {PENDING, VALIDATED, FAILED} - i.e. every live prep - so a GRAPHICS
          prep that has already FAILED validation still blocks a second GRAPHICS prep, while a STATS
          prep on the same production is accepted. An implementation that only excludes PENDING (or
          that scopes uniqueness per feed rather than per production) accepts the second GRAPHICS prep.
        test_recipe:
          setup:
            - "One TIER_3 production and one 300 ms OFFICIAL_SCORING feed; a GRAPHICS prep on it has already been validated and therefore FAILED."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/data-feeds"
              payload: { provider_code: "GFXNET", feed_kind: "OFFICIAL_SCORING", latency_ms: 300, contract_expiry_utc: "2026-09-01T00:00:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { feed_id: $.data.id }
            - call: "POST /broadcast-ops/system-preps"
              payload: { production_id: "${prod_id}", data_feed_id: "${feed_id}", system_kind: "GRAPHICS" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { prep1_id: $.data.id }
            - call: "POST /broadcast-ops/system-preps/${prep1_id}/validate-feed"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { p1status: $.data.status }
          trigger:
            - call: "POST /broadcast-ops/system-preps"
              payload: { production_id: "${prod_id}", data_feed_id: "${feed_id}", system_kind: "GRAPHICS" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err: $.data.error_id }
            - call: "POST /broadcast-ops/system-preps"
              payload: { production_id: "${prod_id}", data_feed_id: "${feed_id}", system_kind: "STATS" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { prep2_id: $.data.id }
          assert:
            - "SystemPrep.${prep1_id}.status == FAILED before the trigger"
            - "Second GRAPHICS prep: HTTP 422 with error_id == ERR_DUPLICATE_PREP_KIND"
            - "STATS prep on the same production and feed: HTTP 201 with status PENDING"
            - "GET /broadcast-ops/system-preps?production_id=${prod_id} returns total_count == 2"

      - name: duplicate_crew_call_rejected_until_the_first_is_declined
        claim_type: violation_to_error
        grounds:
          - validations[priority=30]
          - errors[ERR_DUPLICATE_CREW_CALL]
        distinguishing_aspect: |
          The (production, member) uniqueness set is {OFFERED, ACCEPTED, RELEASED}: a second call while
          the first is OFFERED is refused, but once the member declines, the very same payload is
          accepted - DECLINED and CANCELLED rows do not block a re-offer. The re-offer is also NOT
          blocked by the turnaround rule, because a DECLINED call is not in the turnaround candidate
          set either.
        test_recipe:
          setup:
            - "One TIER_3 production and one STAFF member certified TIER_3 holding an OFFERED call."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id, pv1: $.data.version }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Dana Reyes", position: "TD", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 9000, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm1_id: $.data.id }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm1_id}", call_time_utc: "2026-08-15T14:00:00Z", scheduled_release_utc: "2026-08-16T00:00:00Z", expected_production_version: "${pv1}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call1_id: $.data.id }
          trigger:
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv2: $.data.version }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm1_id}", call_time_utc: "2026-08-15T14:00:00Z", scheduled_release_utc: "2026-08-16T00:00:00Z", expected_production_version: "${pv2}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { err: $.data.error_id }
            - call: "POST /broadcast-ops/crew-calls/${call1_id}/respond"
              payload: { decision: "DECLINE" }
              as: CrewMember
              as_user_id: "${cm1_id}"
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv3: $.data.version }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm1_id}", call_time_utc: "2026-08-15T14:00:00Z", scheduled_release_utc: "2026-08-16T00:00:00Z", expected_production_version: "${pv3}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call2_id: $.data.id, c2status: $.data.status }
          assert:
            - "Second call while the first is OFFERED: HTTP 422 with error_id == ERR_DUPLICATE_CREW_CALL"
            - "Production.${prod_id}.labor_committed_cents is still 104000 after the refusal (no reserve was taken)"
            - "After the DECLINE: CrewCall.${call1_id}.status == DECLINED and labor_committed_cents == 0"
            - "Re-offer: HTTP 201 with CrewCall.${call2_id}.status == OFFERED, provisional_total_cents == 104000, turnaround_minutes_before_call == null"
            - "GET /broadcast-ops/crew-calls?crew_member_id=${cm1_id} returns total_count == 2"

      - name: second_open_survey_rejected_while_one_is_still_in_review
        claim_type: violation_to_error
        grounds:
          - validations[priority=28]
          - errors[ERR_SURVEY_ALREADY_OPEN]
        distinguishing_aspect: |
          The "open" set is {DRAFT, SUBMITTED, CHANGES_REQUESTED}: a second survey is refused while the
          first is DRAFT and still refused after it has been SUBMITTED, and only becomes legal once the
          first reaches APPROVED (where creating one supersedes it instead). This is the mirror image
          of the supersede path and must not be conflated with it.
        test_recipe:
          setup:
            - "One TIER_3 production with a DRAFT survey holding one 150 ft position."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_id}", surveyor_name: "R. Ito", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { s1_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys/${s1_id}/camera-positions"
              payload: { label: "HIGH_HOME", position_type: "HARD", cable_run_feet: 150, power_draw_amps: 20 }
              as: TechnicalDirector
              as_user_id: "td-001"
          trigger:
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_id}", surveyor_name: "K. Ozawa", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err1: $.data.error_id }
            - call: "POST /broadcast-ops/venue-surveys/${s1_id}/submit"
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_id}", surveyor_name: "K. Ozawa", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err2: $.data.error_id }
          assert:
            - "Both attempts return HTTP 422 with error_id == ERR_SURVEY_ALREADY_OPEN"
            - "GET /broadcast-ops/productions/${prod_id}/venue-surveys returns total_count == 1 whose id == ${s1_id}"
            - "VenueSurvey.${s1_id}.status == SUBMITTED after the middle call and revision == 1"

      - name: crew_member_must_be_certified_for_the_event_tier
        claim_type: violation_to_error
        grounds:
          - validations[priority=36]
          - errors[ERR_CREW_TIER_NOT_CERTIFIED]
        distinguishing_aspect: |
          Certification is a set membership test on the production's event_tier, not an ordering: a
          member certified only for TIER_3 cannot be called to a TIER_1 event even though TIER_3 is
          the "harder" number, while a member certified for both tiers can. The refusal precedes the
          turnaround and budget rungs, so the TIER_1 production's ample budget is irrelevant.
        test_recipe:
          setup:
            - "One TIER_1 production; one member certified [TIER_3] and one certified [TIER_1, TIER_3]."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_1", league_code: "NBL", venue_name: "Grand Coliseum", venue_power_capacity_amps: 1200, venue_roof_type: "RETRACTABLE", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 9000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id, pv1: $.data.version }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Dana Reyes", position: "TD", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 9000, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm_low: $.data.id }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Ines Vela", position: "EIC", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_1", "TIER_3"], hourly_rate_cents: 9000, home_base_code: "ATL" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm_high: $.data.id }
          trigger:
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm_low}", call_time_utc: "2026-08-15T14:00:00Z", scheduled_release_utc: "2026-08-16T00:00:00Z", expected_production_version: "${pv1}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { err: $.data.error_id }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm_high}", call_time_utc: "2026-08-15T14:00:00Z", scheduled_release_utc: "2026-08-16T00:00:00Z", expected_production_version: "${pv1}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call_id: $.data.id, prov: $.data.provisional_total_cents }
          assert:
            - "Uncertified member: HTTP 422 with error_id == ERR_CREW_TIER_NOT_CERTIFIED and no CrewCall row created for ${cm_low}"
            - "Certified member: HTTP 201 with CrewCall.${call_id}.status == OFFERED"
            - "CrewCall.${call_id}.provisional_total_cents == 111000 (90000 straight + 4 meal units x 3500 x the TIER_1 multiplier 1.5 = 21000)"
            - "Production.${prod_id}.labor_committed_cents == 111000, labor_available_cents == 8889000, required_crew_positions == 12, required_validated_preps == 3"
            - "Production.${prod_id}.readiness_score_preflight == 1.25 (15 * 1/12 rounded half-up to 2dp)"

      - name: feed_contract_expiry_blocks_validation_at_the_instant_it_expires
        claim_type: temporal_validation
        grounds:
          - validations[priority=34]
          - errors[ERR_FEED_CONTRACT_EXPIRED]
        distinguishing_aspect: |
          The gate is "clock at or after contract_expiry_utc", so one minute before expiry validates
          and the exact expiry instant does not - on the same feed, with only the logical clock moving
          between the two calls. The second prep is a different system_kind, so neither the duplicate
          rule (29) nor the consumer cap (35, count 1 < 2) can be the cause of the refusal.
        test_recipe:
          setup:
            - "One TIER_3 production and one 120 ms LIVE_STATS feed whose contract expires 2026-08-10T00:00:00Z, with a GRAPHICS prep and a STATS prep both PENDING against it."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/data-feeds"
              payload: { provider_code: "STATSCO", feed_kind: "LIVE_STATS", latency_ms: 120, contract_expiry_utc: "2026-08-10T00:00:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { feed_id: $.data.id }
            - call: "POST /broadcast-ops/system-preps"
              payload: { production_id: "${prod_id}", data_feed_id: "${feed_id}", system_kind: "GRAPHICS" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { prep_a: $.data.id }
            - call: "POST /broadcast-ops/system-preps"
              payload: { production_id: "${prod_id}", data_feed_id: "${feed_id}", system_kind: "STATS" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { prep_b: $.data.id }
          trigger:
            - call: "POST /broadcast-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T23:59:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/system-preps/${prep_a}/validate-feed"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { a_status: $.data.status, a_at: $.data.feed_validated_at }
            - call: "POST /broadcast-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/system-preps/${prep_b}/validate-feed"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err: $.data.error_id }
          assert:
            - "One minute before expiry: HTTP 200, SystemPrep.${prep_a}.status == VALIDATED, feed_validated_at == 2026-08-09T23:59:00.000Z"
            - "DataFeed.${feed_id}.active_consumer_count == 1 and status is still ACTIVE"
            - "At the expiry instant: HTTP 422 with error_id == ERR_FEED_CONTRACT_EXPIRED"
            - "SystemPrep.${prep_b}.status is still PENDING (not FAILED - a rejected request performs no transition) and feed_validated_at == null"
            - "DataFeed.${feed_id}.active_consumer_count is still 1"

      - name: test_window_must_lie_inside_the_booking_window
        claim_type: temporal_validation
        grounds:
          - validations[priority=31]
          - errors[ERR_TEST_WINDOW_INVALID]
        distinguishing_aspect: |
          Priority 31 carries two clauses on the same payload: containment inside
          [booking.window_start_utc, booking.window_end_utc) and internal ordering
          test_window_end_utc > test_window_start_utc. Both must surface as ERR_TEST_WINDOW_INVALID -
          the reversed window does NOT fall through to the generic ERR_INVALID_TIME_WINDOW at priority
          18, whose clause list covers bookings and crew calls but not test windows.
        test_recipe:
          setup:
            - "One TIER_3 production and a RESERVED PRIMARY fiber booking over 2026-08-15T12:00Z .. 2026-08-16T02:00Z."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
