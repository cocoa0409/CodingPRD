            - "Establishment.${est_id}.demerit_balance == 115.00"
            - "Establishment.${est_id}.license_status == PROBATION"
            - "Establishment.${est_id}.compliance_posture == FROZEN"
            - "Establishment.${est_id}.last_finalized_inspection_at == 2026-08-01T00:00:00.000Z"

      - name: infection_resolution_to_sanction_ledger_to_suspension_to_void_rental_to_stale_posting
        grounds:
          - state_machines.InfectionIncident.NOTIFIED_to_RESOLVED_SUBSTANTIATED
          - calculations.practitioner_sanction_points
          - calculations.workstation_posting_status
          - entities.Practitioner.fields.sanction_points
          - entities.Practitioner.fields.suspension_cause_points
          - entities.BoothRental.fields.status
          - entities.Workstation.fields.posting_status
        distinguishing_aspect: |
          A different originating transition from the finalize cascade: resolving an infection
          investigation as SUBSTANTIATED posts a SANCTION_POINTS row, that row lifts sanction_points
          to 20.00, crossing 15.00 is what suspends the licence, the suspension is what terminates
          the ACTIVE booth rental, and that termination is what degrades the workstation posting to
