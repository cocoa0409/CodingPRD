scenario: |
  429. 1031 Exchange Qualified Intermediary: relinquished-property sale & exchange
  agreement, like-kind/replacement rules, 45-day identification & 180-day deadline
  tracking, qualified-trust holding, boot & partial-exchange calculation,
  reverse/improvement exchange, identification (3-property/200%) rules, settlement
  disbursement

domain_name: exchange-1031-qi
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation        # forward vs final boot/gain; debt-relief offset variants
    - cascading_side_effects          # acquire replacement -> boot recompute -> trust debit -> exchange posture
    - rate_threshold_triggers         # 45/180-day deadlines, 3-property/200% identification breakpoints
    - optimistic_concurrency          # OCC on QualifiedTrust.version for supersedable disbursement creation

  entity_topology: hybrid
  # Exchange is the aggregate root (hierarchical children: RelinquishedProperty,
  # Identification, QualifiedTrust). ReplacementProperty + Disbursement carry
  # cross-aggregate FK references (flat), and IdentifiedProperty is a junction
  # between Identification and a candidate replacement description.

  state_machine_shape: posture_driven
  # Exchange.compliance_posture (OPEN / IDENTIFIED / AT_RISK / COMPLETED / FAILED)
  # is a derived gate computed from deadline position + child state; it gates all
  # disbursement and replacement-acquisition operations. Two child machines
  # (Disbursement, Identification) carry non-linear shapes (revert / branch).

  relationship_patterns:
    - one_to_many          # Exchange -> RelinquishedProperty / Identification / Disbursement
    - cross_aggregate      # Disbursement.replacement_property_id, ReplacementProperty.exchange_id
    - polymorphic          # Disbursement.purpose selects which FK/credit field is meaningful

  role_model: segregation_of_duties
  # The QI Coordinator who SETS UP an exchange and identifies properties cannot be
  # the Settlement Officer who APPROVES the disbursement of the same exchange's
  # trust funds (4-eyes financial control). Exchanger is the taxpayer principal.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Exchanger
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Taxpayer principal's legal name
        constraints: non-empty
      - name: taxpayer_id
        type: string
        source: input
        description: Masked taxpayer identifier (uniqueness key)
        constraints: unique across Exchanger
      - name: email
        type: string
        source: input
        description: Contact email
    # identity anchor for role Exchanger (entity_backed)

  - name: Exchange
    parent: null
    common_fields: true
    fields:
      - name: exchanger_id
        type: string
        source: input
        description: "FK -> Exchanger.id; the taxpayer principal of this exchange"
      - name: exchange_type
        type: enum
        source: input
        description: Structure of the exchange
        constraints: one of [FORWARD, REVERSE, IMPROVEMENT]
      - name: coordinator_user_id
        type: string
        source: system
        description: Opaque QI Coordinator operator id (X-User-ID at creation); used for segregation-of-duties enforcement against settlement_officer_user_id
      - name: compliance_posture
        type: enum
        source: computed
        description: "Derived gate recomputed on every relevant mutation and on clock advance. OPEN before identification; IDENTIFIED once a finalized Identification exists; AT_RISK once the 45-day deadline passes with no finalized Identification OR the 180-day deadline passes before completion; COMPLETED when all identified replacement value is acquired and boot is finalized; FAILED when a deadline lapses irrecoverably. one of [OPEN, IDENTIFIED, AT_RISK, COMPLETED, FAILED]"
      - name: status
        type: enum
        source: computed
        description: Lifecycle status mirroring the latest accepted transition (DRAFT, ACTIVE, COMPLETED, FAILED, TERMINATED). one of [DRAFT, ACTIVE, COMPLETED, FAILED, TERMINATED]
        default: DRAFT
      - name: relinquished_closing_at
        type: datetime
        source: system
        description: UTC timestamp the relinquished property's sale closed; stamped by the close action. Day 0 anchor for both deadlines. Null until close.
      - name: id_deadline_at
        type: datetime
        source: computed
        description: relinquished_closing_at + 45 calendar days (same time-of-day). Null until close.
      - name: exchange_deadline_at
        type: datetime
        source: computed
        description: relinquished_closing_at + 180 calendar days (same time-of-day). Null until close.
      - name: realized_gain
        type: number
        source: computed
        description: amount_realized - relinquished.adjusted_basis; pinned on close. See calculations.realized_gain. Null until close.
      - name: recognized_gain
        type: number
        source: computed
        description: min(realized_gain, total_boot); recomputed when a replacement is recorded. See calculations.boot_and_recognized_gain. Null until first replacement recorded.
      - name: deferred_gain
        type: number
        source: computed
        description: realized_gain - recognized_gain; conserved invariant partner of recognized_gain. Null until first replacement recorded.

  - name: RelinquishedProperty
    parent: Exchange
    common_fields: true
    fields:
      - name: exchange_id
        type: string
        source: input
        description: "FK -> Exchange.id; the exchange this relinquished property belongs to"
      - name: address
        type: string
        source: input
        description: Property address
      - name: fair_market_value
        type: number
        source: input
        description: Sale price / FMV of the relinquished property in dollars
        constraints: "> 0"
      - name: selling_expenses
        type: number
        source: input
        description: Commissions and closing costs reducing amount realized
        constraints: ">= 0"
      - name: mortgage_payoff
        type: number
        source: input
        description: Debt (mortgage) relieved at close; the relinquished debt figure for mortgage-boot
        constraints: ">= 0"
      - name: adjusted_basis
        type: number
        source: input
        description: Exchanger's adjusted tax basis used for realized-gain
        constraints: ">= 0"
      - name: net_proceeds
        type: number
        source: computed
        description: fair_market_value - selling_expenses - mortgage_payoff; the cash deposited into the QualifiedTrust at close. See calculations.net_proceeds.

  - name: QualifiedTrust
    parent: Exchange
    common_fields: true
    fields:
      - name: exchange_id
        type: string
        source: input
        description: "FK -> Exchange.id; the exchange whose proceeds this trust holds (1:1)"
      - name: deposited_amount
        type: number
        source: computed
        description: Cash deposited at relinquished close = RelinquishedProperty.net_proceeds. 0 until close.
      - name: available_balance
        type: number
        source: computed
        description: deposited_amount - sum(Disbursement.amount where settlement_status==SETTLED). Conserved trust quantity. See calculations.trust_available_balance.
      - name: is_locked
        type: boolean
        source: computed
        description: True once the Exchange posture is COMPLETED or FAILED; locked trust rejects new disbursements
        default: false

  - name: Identification
    parent: Exchange
    common_fields: true
    fields:
      - name: exchange_id
        type: string
        source: input
        description: "FK -> Exchange.id; the exchange this identification document belongs to"
      - name: method
        type: enum
        source: input
        description: Identification rule the exchanger relies on. THREE_PROPERTY allows up to 3 candidates regardless of value; TWO_HUNDRED_PCT allows >3 candidates if aggregate FMV <= 200% of relinquished FMV. one of [THREE_PROPERTY, TWO_HUNDRED_PCT]
      - name: status
        type: enum
        source: computed
        description: DRAFT while candidates are being added; FINALIZED once submitted within the 45-day window; REVOKED if withdrawn before finalize. one of [DRAFT, FINALIZED, REVOKED]
        default: DRAFT
      - name: aggregate_identified_fmv
        type: number
        source: computed
        description: Sum of IdentifiedProperty.estimated_fmv for candidates under this identification with status==CANDIDATE. See calculations.aggregate_identified_fmv.
      - name: finalized_at
        type: datetime
        source: system
        description: UTC timestamp of finalize; compared against Exchange.id_deadline_at. Null until finalized.

  - name: IdentifiedProperty
    parent: Identification
    common_fields: false
    fields:
      - name: identification_id
        type: string
        source: input
        description: "FK -> Identification.id; the identification document listing this candidate"
      - name: description
        type: string
        source: input
        description: Free-text legal description of the candidate replacement property
      - name: estimated_fmv
        type: number
        source: input
        description: Estimated fair market value of this candidate in dollars
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: CANDIDATE while listed; ACQUIRED once a ReplacementProperty links to it; WITHDRAWN if removed before finalize. one of [CANDIDATE, ACQUIRED, WITHDRAWN]
        default: CANDIDATE

  - name: ReplacementProperty
    parent: null
    common_fields: true
    fields:
      - name: exchange_id
        type: string
        source: input
        description: "FK -> Exchange.id; the exchange acquiring this replacement property"
      - name: identified_property_id
        type: string
        source: input
        description: "FK -> IdentifiedProperty.id; the finalized candidate this acquisition satisfies"
      - name: purchase_price
        type: number
        source: input
        description: Acquisition price of the replacement property in dollars
        constraints: "> 0"
      - name: replacement_debt
        type: number
        source: input
        description: New debt taken on the replacement; reduces mortgage-boot via debt-relief offset
        constraints: ">= 0"
      - name: improvement_value
        type: number
        source: input
        description: Value of completed improvements counted toward replacement value (IMPROVEMENT exchanges only; 0 otherwise)
        default: 0
        constraints: ">= 0"
      - name: cash_applied
        type: number
        source: computed
        description: purchase_price - replacement_debt (+ improvement_value for IMPROVEMENT); cash drawn from trust for this acquisition. See calculations.boot_and_recognized_gain.
      - name: acquired_at
        type: datetime
        source: system
        description: UTC timestamp the acquisition closed; compared against Exchange.exchange_deadline_at

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - name: exchange_id
        type: string
        source: input
        description: "FK -> Exchange.id; the exchange whose trust funds this disbursement draws"
      - name: replacement_property_id
        type: string
        source: input
        description: "FK -> ReplacementProperty.id; the replacement funded (only when purpose==ACQUISITION or IMPROVEMENT_DRAW); null otherwise"
      - name: purpose
        type: enum
        source: input
        description: What the funds pay for; selects the priority bucket. one of [QI_FEE, ACQUISITION, IMPROVEMENT_DRAW, BOOT_RETURN]
      - name: priority
        type: integer
        source: computed
        description: Waterfall bucket derived from purpose (QI_FEE=1, ACQUISITION=2, IMPROVEMENT_DRAW=3, BOOT_RETURN=4)
      - name: amount
        type: number
        source: input
        description: Dollar amount to disburse from the trust
        constraints: "> 0"
      - name: settlement_status
        type: enum
        source: computed
        description: REQUESTED on create; SETTLED once approved and trust debited; VOIDED if reversed (credit restored). one of [REQUESTED, SETTLED, VOIDED]
        default: REQUESTED
      - name: settlement_officer_user_id
        type: string
        source: system
        description: Opaque Settlement Officer operator id (X-User-ID at approval); must differ from Exchange.coordinator_user_id

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Exchange
    initial_state: DRAFT
    terminal_states: [COMPLETED, FAILED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /exchanges/{id}/close-relinquished"
        actor: QICoordinator
        preconditions:
          - "exactly one RelinquishedProperty exists for this exchange"
          - "a QualifiedTrust exists for this exchange"
          - "exchange.status == DRAFT"
        side_effects:
          - "stamps relinquished_closing_at = current logical clock"
          - "computes id_deadline_at = relinquished_closing_at + 45 days; exchange_deadline_at = relinquished_closing_at + 180 days"
          - "computes RelinquishedProperty.net_proceeds (calculations.net_proceeds)"
          - "computes realized_gain (calculations.realized_gain)"
          - "credits QualifiedTrust.deposited_amount and available_balance with net_proceeds (cascade: RelinquishedProperty close -> QualifiedTrust deposit)"
          - "recomputes compliance_posture -> OPEN"
          - "sets status = ACTIVE"
          - "increments Exchange.version by 1"
        note: "Day-0 anchor; this is the close of the relinquished leg."
      - from: ACTIVE
        to: ACTIVE
        trigger: "system: clock advance past id_deadline_at with no FINALIZED Identification"
        actor: system
        preconditions:
          - "no Identification for this exchange has status == FINALIZED"
          - "current clock > id_deadline_at"
        side_effects:
          - "recomputes compliance_posture -> AT_RISK"
        note: "Recomputed lazily whenever posture is read or any exchange mutation occurs."
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /exchanges/{id}/complete"
        actor: QICoordinator
        preconditions:
          - "compliance_posture IN {IDENTIFIED}"
          - "every IdentifiedProperty under the FINALIZED Identification has status == ACQUIRED"
          - "current clock <= exchange_deadline_at"
          - "recognized_gain and deferred_gain are non-null (at least one ReplacementProperty recorded)"
        side_effects:
          - "recomputes compliance_posture -> COMPLETED"
          - "sets QualifiedTrust.is_locked = true (cascade: Exchange complete -> QualifiedTrust lock)"
          - "sets status = COMPLETED"
          - "increments Exchange.version by 1"
      - from: ACTIVE
        to: FAILED
        trigger: "POST /exchanges/{id}/fail OR system: clock advance past exchange_deadline_at before complete"
        actor: QICoordinator | system
        preconditions:
          - "exchange.status == ACTIVE"
          - "current clock > exchange_deadline_at OR no FINALIZED Identification exists and current clock > id_deadline_at"
        side_effects:
          - "recomputes compliance_posture -> FAILED"
          - "sets QualifiedTrust.is_locked = true (cascade: Exchange fail -> QualifiedTrust lock)"
          - "sets status = FAILED"
          - "increments Exchange.version by 1"
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /exchanges/{id}/terminate"
        actor: QICoordinator
        preconditions:
          - "exchange.status == DRAFT"
          - "no QualifiedTrust with available_balance > 0"
        side_effects:
          - "sets status = TERMINATED"
          - "increments Exchange.version by 1"

  - entity: Identification
    initial_state: DRAFT
    terminal_states: [FINALIZED, REVOKED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /identifications/{id}/finalize"
        actor: QICoordinator
        preconditions:
          - "parent Exchange.status == ACTIVE"
          - "at least one IdentifiedProperty with status == CANDIDATE exists"
          - "current clock <= Exchange.id_deadline_at"
          - "no other FINALIZED Identification exists for this exchange"
          - "method==THREE_PROPERTY requires CANDIDATE count <= 3"
          - "method==TWO_HUNDRED_PCT requires aggregate_identified_fmv <= 2 * RelinquishedProperty.fair_market_value"
        side_effects:
          - "stamps finalized_at = current clock"
          - "sets status = FINALIZED"
          - "recomputes parent Exchange.compliance_posture -> IDENTIFIED (cascade: Identification finalize -> Exchange posture)"
          - "increments Identification.version by 1"
      - from: DRAFT
        to: REVOKED
        trigger: "POST /identifications/{id}/revoke"
        actor: QICoordinator
        preconditions:
          - "identification.status == DRAFT"
        side_effects:
          - "sets status = REVOKED"
          - "sets every child IdentifiedProperty.status == CANDIDATE -> WITHDRAWN (cascade down)"
          - "increments Identification.version by 1"

  - entity: Disbursement
    initial_state: REQUESTED
    terminal_states: [VOIDED]
    transitions:
      - from: REQUESTED
        to: SETTLED
        trigger: "POST /disbursements/{id}/approve"
        actor: SettlementOfficer
        preconditions:
          - "parent Exchange.compliance_posture IN {OPEN, IDENTIFIED}"
          - "QualifiedTrust.is_locked == false"
          - "amount <= QualifiedTrust.available_balance"
          - "X-User-ID (settlement officer) != Exchange.coordinator_user_id (segregation of duties)"
          - "for purpose==BOOT_RETURN: a ReplacementProperty must already exist for this exchange"
        side_effects:
          - "stamps settlement_officer_user_id = X-User-ID"
          - "sets settlement_status = SETTLED"
          - "debits QualifiedTrust.available_balance by amount (cascade: Disbursement settle -> QualifiedTrust debit)"
          - "increments Disbursement.version and QualifiedTrust.version each by 1"
      - from: SETTLED
        to: VOIDED
        trigger: "POST /disbursements/{id}/void"
        actor: SettlementOfficer
        preconditions:
          - "disbursement.settlement_status == SETTLED"
          - "QualifiedTrust.is_locked == false"
        side_effects:
          - "sets settlement_status = VOIDED"
          - "credits QualifiedTrust.available_balance back by amount (compensation: restores conserved trust quantity)"
          - "increments Disbursement.version and QualifiedTrust.version each by 1"
      - from: REQUESTED
        to: VOIDED
        trigger: "POST /disbursements/{id}/void"
        actor: SettlementOfficer
        preconditions:
          - "disbursement.settlement_status == REQUESTED"
        side_effects:
          - "sets settlement_status = VOIDED (no trust effect; was never debited)"
          - "increments Disbursement.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: disbursement-create-stale-trust
    parent_entity: QualifiedTrust
    write_endpoint: "POST /disbursements"
    occ_field: "expected_qualified_trust_version"
    description: |
      Creating a Disbursement against a QualifiedTrust whose version has advanced
      since the client last observed it is rejected. A disbursement create reserves
      against the same available_balance another writer may have just drawn down via
      its own settled disbursement; if the current writer's view of the trust is
      stale, the reservation may legitimately exceed funds that no longer exist,
      so the create is refused on the version mismatch rather than after the fact.
    error_id: ERR_STALE_TRUST_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: net_proceeds
    trigger: "Exchange close-relinquished (DRAFT -> ACTIVE)"
    algorithm: aggregation
    formula: |
      net_proceeds = fair_market_value - selling_expenses - mortgage_payoff
      deposited into QualifiedTrust as both deposited_amount and available_balance.
    input_set: "the single RelinquishedProperty of the exchange"
    constants: {}
    precision: "2 decimal places, round_half_up; computed once from integer-cent inputs so no intermediate rounding"

  - name: realized_gain
    trigger: "Exchange close-relinquished (DRAFT -> ACTIVE)"
    algorithm: aggregation
    formula: |
      amount_realized = fair_market_value - selling_expenses
      realized_gain   = amount_realized - adjusted_basis
      (realized_gain may be 0 but is never negative for benchmark inputs)
    input_set: "the single RelinquishedProperty of the exchange"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: boot_and_recognized_gain
    trigger: "POST /exchanges/{id}/replacement-properties (record a ReplacementProperty)"
    algorithm: threshold
    formula: |
      # Evaluation order is pinned: compute cash_applied, then each boot leg,
      # then total_boot, then recognized, then deferred (no circular dependency).
      if exchange_type == IMPROVEMENT:
        replacement_value = purchase_price + improvement_value
      else:
        replacement_value = purchase_price
      cash_applied  = replacement_value - replacement_debt
      cash_boot     = max(0, QualifiedTrust.deposited_amount - cash_applied)
      mortgage_boot = max(0, RelinquishedProperty.mortgage_payoff - replacement_debt)
      total_boot    = cash_boot + mortgage_boot
      recognized_gain = min(Exchange.realized_gain, total_boot)
      deferred_gain   = Exchange.realized_gain - recognized_gain
    input_set: "the recorded ReplacementProperty, the exchange's RelinquishedProperty, and the exchange's QualifiedTrust deposited_amount"
    constants: {}
    precision: "2 decimal places, round_half_up; max/min applied on 2-dp operands"
    variants:
      - name: final_boot
        when: "exchange_type IN {FORWARD, REVERSE}; improvement_value ignored"
        difference: "replacement_value = purchase_price; improvements never count"
      - name: improvement_boot
        when: "exchange_type == IMPROVEMENT and the improvement completed on/before exchange_deadline_at"
        difference: "replacement_value = purchase_price + improvement_value, raising cash_applied and shrinking cash_boot vs the final_boot variant on identical purchase_price"

  - name: trust_available_balance
    trigger: "Disbursement approve (debit) and void (credit); read on GET trust"
    algorithm: waterfall_allocation
    formula: |
      available_balance = deposited_amount
                          - sum(d.amount for d in Disbursement
                                where d.exchange_id == this.exchange_id
                                  and d.settlement_status == SETTLED)
      # Disbursements approve in author-chosen order but each approval is rejected
      # if amount > available_balance at approval time; buckets are drawn by
      # priority (QI_FEE=1, ACQUISITION=2, IMPROVEMENT_DRAW=3, BOOT_RETURN=4) so a
      # BOOT_RETURN cannot overdraw funds already committed to higher buckets.
    input_set: "all SETTLED Disbursements of the exchange"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: aggregate_identified_fmv
    trigger: "IdentifiedProperty add/remove; Identification finalize precondition; read on GET identification"
    algorithm: aggregation
    formula: |
      aggregate_identified_fmv = sum(ip.estimated_fmv
                                     for ip in IdentifiedProperty
                                     where ip.identification_id == this.id
                                       and ip.status == CANDIDATE)
      candidate_count          = count(those same CANDIDATE rows)
      # 200% cap test at finalize: aggregate_identified_fmv <= 2 * RelinquishedProperty.fair_market_value
    input_set: "IdentifiedProperty rows of this Identification with status == CANDIDATE"
    constants:
      TWO_HUNDRED_PCT_MULTIPLIER: 2
      THREE_PROPERTY_MAX_COUNT: 3
    precision: "2 decimal places, round_half_up; count is an exact integer"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every path/body resource id resolves to an existing entity, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "request body required fields present and typed; enums in declared set; numeric fields satisfy declared bounds (> 0 / >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 5
    category: state
    check: "target entity is in a state from which the requested transition is defined (e.g., Disbursement approve requires REQUESTED; Exchange complete requires ACTIVE)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_safety
    check: "segregation of duties: the Settlement Officer approving a disbursement (X-User-ID) must not equal the exchange's coordinator_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /disbursements/{id}/approve"

  - priority: 7
    category: business_temporal
    check: "Identification finalize must occur on/before id_deadline_at (clock <= 45-day deadline)"
    error_id: ERR_ID_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /identifications/{id}/finalize"

  - priority: 8
    category: business_temporal
    check: "ReplacementProperty acquisition and Exchange complete must occur on/before exchange_deadline_at (clock <= 180-day deadline)"
    error_id: ERR_EXCHANGE_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /exchanges/{id}/replacement-properties, POST /exchanges/{id}/complete"

  - priority: 9
    category: business_constraint
    check: "identification 3-property rule: method==THREE_PROPERTY may finalize with at most 3 CANDIDATE properties"
    error_id: ERR_THREE_PROPERTY_RULE_VIOLATED
    http_status: 409
    applies_to: "POST /identifications/{id}/finalize"

  - priority: 10
    category: business_constraint
    check: "identification 200% rule: method==TWO_HUNDRED_PCT may finalize only if aggregate_identified_fmv <= 2 * relinquished fair_market_value"
    error_id: ERR_TWO_HUNDRED_PCT_RULE_VIOLATED
    http_status: 409
    applies_to: "POST /identifications/{id}/finalize"

  - priority: 11
    category: business_referential
    check: "a ReplacementProperty's identified_property_id must reference an IdentifiedProperty under THIS exchange's FINALIZED Identification with status==CANDIDATE; like-kind linkage required"
    error_id: ERR_NOT_IDENTIFIED
    http_status: 409
    applies_to: "POST /exchanges/{id}/replacement-properties"

  - priority: 12
    category: state
    check: "trust must not be locked (is_locked==false) for any new disbursement create or approval"
    error_id: ERR_TRUST_LOCKED
    http_status: 409
    applies_to: "POST /disbursements, POST /disbursements/{id}/approve"

  - priority: 13
    category: business_fiscal
    check: "disbursement approval amount must not exceed QualifiedTrust.available_balance"
    error_id: ERR_INSUFFICIENT_TRUST_FUNDS
    http_status: 409
    applies_to: "POST /disbursements/{id}/approve"

  - priority: 14
    category: business_referential
    check: "OCC: expected_qualified_trust_version on disbursement create must equal current QualifiedTrust.version"
    error_id: ERR_STALE_TRUST_VERSION
    http_status: 412
    applies_to: "POST /disbursements"

  - priority: 15
    category: business_constraint
    check: "exchanger registration taxpayer_id must be unique across all Exchangers"
    error_id: ERR_DUPLICATE_TAXPAYER_ID
    http_status: 409
    applies_to: "POST /exchangers"

  - priority: 16
    category: business_constraint
    check: "an exchange may have at most one QualifiedTrust"
    error_id: ERR_TRUST_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /exchanges/{id}/trust"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # ---- Exchanger ----
  - method: POST
    path: "/exchangers"
    description: "Register a taxpayer principal"
    roles: [QICoordinator]
    code: 201
    input: [legal_name, taxpayer_id, email]
    output: Exchanger
    side_effects: []

  - method: GET
    path: "/exchangers/{id}"
    description: "Fetch an exchanger"
    roles: [QICoordinator, SettlementOfficer, Exchanger]
    code: 200
    input: []
    output: Exchanger
    side_effects: []

  # ---- Exchange ----
  - method: POST
    path: "/exchanges"
    description: "Create an exchange in DRAFT; X-User-ID is recorded as coordinator_user_id"
    roles: [QICoordinator]
    code: 201
    input: [exchanger_id, exchange_type]
    output: Exchange
    side_effects: ["records coordinator_user_id = X-User-ID", "compliance_posture = OPEN once active; status = DRAFT"]

  - method: GET
    path: "/exchanges/{id}"
    description: "Fetch an exchange with computed posture, deadlines, and gain fields (recomputes posture against the clock first)"
    roles: [QICoordinator, SettlementOfficer, Exchanger]
    code: 200
    input: []
    output: Exchange
    side_effects: ["lazily recomputes compliance_posture against current clock before returning"]

  - method: GET
    path: "/exchanges"
    description: "List exchanges (paginated); filterable by exchanger_id"
    roles: [QICoordinator, SettlementOfficer]
    code: 200
    input: ["exchanger_id?", "limit?", "offset?"]
    output: Exchange[]
    side_effects: []

  - method: POST
    path: "/exchanges/{id}/relinquished-properties"
    description: "Attach the relinquished property to a DRAFT exchange"
    roles: [QICoordinator]
    code: 201
    input: [address, fair_market_value, selling_expenses, mortgage_payoff, adjusted_basis]
    output: RelinquishedProperty
    side_effects: ["RelinquishedProperty.net_proceeds remains 0 until close"]

  - method: GET
    path: "/exchanges/{id}/relinquished-properties"
    description: "List the relinquished property/properties for an exchange (array of 0–1)"
    roles: [QICoordinator, SettlementOfficer, Exchanger]
    code: 200
    input: []
    output: RelinquishedProperty[]
    side_effects: []

  - method: POST
    path: "/exchanges/{id}/trust"
    description: "Open the qualified trust for a DRAFT exchange (1:1)"
    roles: [QICoordinator]
    code: 201
    input: []
    output: QualifiedTrust
    side_effects: ["deposited_amount = 0, available_balance = 0, is_locked = false"]

  - method: GET
    path: "/exchanges/{id}/trust"
    description: "List the qualified trust for an exchange (array of 0–1) with computed available_balance"
    roles: [QICoordinator, SettlementOfficer, Exchanger]
    code: 200
    input: []
    output: QualifiedTrust[]
    side_effects: []

  - method: POST
    path: "/exchanges/{id}/close-relinquished"
    description: "Close the relinquished leg: stamp Day-0, compute deadlines/gain/net_proceeds, deposit into trust, posture -> OPEN, status -> ACTIVE"
    roles: [QICoordinator]
    code: 200
    input: []
    output: Exchange
    side_effects:
      - "stamps relinquished_closing_at, id_deadline_at, exchange_deadline_at"
      - "computes net_proceeds, realized_gain"
      - "deposits net_proceeds into QualifiedTrust (cascade)"
      - "status -> ACTIVE; compliance_posture -> OPEN; increments Exchange.version"

  - method: POST
    path: "/exchanges/{id}/replacement-properties"
    description: "Record acquisition of a replacement property; recomputes boot, recognized_gain, deferred_gain"
    roles: [QICoordinator]
    code: 201
    input: [identified_property_id, purchase_price, replacement_debt, "improvement_value?"]
    output: ReplacementProperty
    side_effects:
      - "stamps acquired_at = current clock"
      - "computes cash_applied (calculations.boot_and_recognized_gain)"
      - "recomputes Exchange.recognized_gain and deferred_gain"
      - "sets linked IdentifiedProperty.status -> ACQUIRED (cascade)"
      - "increments Exchange.version"

  - method: GET
    path: "/exchanges/{id}/replacement-properties"
    description: "List replacement properties for an exchange"
    roles: [QICoordinator, SettlementOfficer, Exchanger]
    code: 200
    input: []
    output: ReplacementProperty[]
    side_effects: []

  - method: GET
    path: "/replacement-properties/{id}"
    description: "Fetch a single replacement property with its computed cash_applied"
    roles: [QICoordinator, SettlementOfficer, Exchanger]
    code: 200
    input: []
    output: ReplacementProperty
    side_effects: []

  - method: GET
    path: "/replacement-properties"
    description: "List replacement properties (paginated); filterable by exchange_id and by identified_property_id"
    roles: [QICoordinator, SettlementOfficer]
    code: 200
    input: ["exchange_id?", "identified_property_id?", "limit?", "offset?"]
    output: ReplacementProperty[]
    side_effects: []

  - method: POST
    path: "/exchanges/{id}/complete"
    description: "Mark the exchange COMPLETED when all identified replacements are acquired within the 180-day window"
    roles: [QICoordinator]
    code: 200
    input: []
    output: Exchange
    side_effects: ["posture -> COMPLETED; locks trust (cascade); status -> COMPLETED; increments Exchange.version"]

  - method: POST
    path: "/exchanges/{id}/fail"
    description: "Mark the exchange FAILED after an irrecoverable deadline lapse"
    roles: [QICoordinator]
    code: 200
    input: []
    output: Exchange
    side_effects: ["posture -> FAILED; locks trust (cascade); status -> FAILED; increments Exchange.version"]

  - method: POST
    path: "/exchanges/{id}/terminate"
    description: "Terminate a DRAFT exchange with no funded trust"
    roles: [QICoordinator]
    code: 200
    input: []
    output: Exchange
    side_effects: ["status -> TERMINATED; increments Exchange.version"]

  # ---- Identification ----
  - method: POST
    path: "/exchanges/{id}/identifications"
    description: "Create a DRAFT identification document on an ACTIVE exchange"
    roles: [QICoordinator]
    code: 201
    input: [method]
    output: Identification
    side_effects: ["status = DRAFT; aggregate_identified_fmv = 0"]

  - method: GET
    path: "/exchanges/{id}/identifications"
    description: "List identifications for an exchange"
    roles: [QICoordinator, SettlementOfficer, Exchanger]
    code: 200
    input: []
    output: Identification[]
    side_effects: []

  - method: GET
    path: "/identifications/{id}"
    description: "Fetch an identification with computed aggregate_identified_fmv"
    roles: [QICoordinator, SettlementOfficer, Exchanger]
    code: 200
    input: []
    output: Identification
    side_effects: []

  - method: POST
    path: "/identifications/{id}/candidates"
    description: "Add a candidate replacement property to a DRAFT identification"
    roles: [QICoordinator]
    code: 201
    input: [description, estimated_fmv]
    output: IdentifiedProperty
    side_effects: ["recomputes parent Identification.aggregate_identified_fmv"]

  - method: GET
    path: "/identifications/{id}/candidates"
    description: "List candidate properties under an identification"
    roles: [QICoordinator, SettlementOfficer, Exchanger]
    code: 200
    input: []
    output: IdentifiedProperty[]
    side_effects: []

  - method: POST
    path: "/identifications/{id}/finalize"
    description: "Finalize the identification within the 45-day window, enforcing the 3-property / 200% rule"
    roles: [QICoordinator]
    code: 200
    input: []
    output: Identification
    side_effects: ["stamps finalized_at; status -> FINALIZED; recomputes Exchange.compliance_posture -> IDENTIFIED (cascade); increments Identification.version"]

  - method: POST
    path: "/identifications/{id}/revoke"
    description: "Revoke a DRAFT identification; withdraws its candidates"
    roles: [QICoordinator]
    code: 200
    input: []
    output: Identification
    side_effects: ["status -> REVOKED; child candidates CANDIDATE -> WITHDRAWN (cascade down); increments Identification.version"]

  # ---- Disbursement ----
  - method: POST
    path: "/disbursements"
    description: "Create a REQUESTED disbursement against the exchange's trust (OCC-guarded on trust version)"
    roles: [QICoordinator]
    code: 201
    input: [exchange_id, purpose, amount, "replacement_property_id?", expected_qualified_trust_version]
    output: Disbursement
    side_effects: ["derives priority from purpose; settlement_status = REQUESTED; OCC check against QualifiedTrust.version"]

  - method: GET
    path: "/disbursements/{id}"
    description: "Fetch a disbursement"
    roles: [QICoordinator, SettlementOfficer, Exchanger]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  - method: GET
    path: "/disbursements"
    description: "List disbursements (paginated); filterable by exchange_id and by replacement_property_id"
    roles: [QICoordinator, SettlementOfficer]
    code: 200
    input: ["exchange_id?", "replacement_property_id?", "limit?", "offset?"]
    output: Disbursement[]
    side_effects: []

  - method: POST
    path: "/disbursements/{id}/approve"
    description: "Settlement Officer approves a REQUESTED disbursement; debits the trust (segregation of duties enforced)"
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["stamps settlement_officer_user_id; settlement_status -> SETTLED; debits trust available_balance (cascade); increments Disbursement.version and QualifiedTrust.version"]

  - method: POST
    path: "/disbursements/{id}/void"
    description: "Settlement Officer voids a disbursement; credits the trust back if it was SETTLED"
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["settlement_status -> VOIDED; if previously SETTLED, credits trust available_balance back (compensation); increments Disbursement.version (and QualifiedTrust.version when a credit occurs)"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an absolute UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. Used to drive 45/180-day deadline tests deterministically."
    roles: [QICoordinator, SettlementOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advances the logical clock; subsequent posture reads recompute against it"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for this operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a referenced exchange, property, identification, trust, candidate, or disbursement does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing/invalid required field, bad enum, or numeric bound violated (e.g., amount <= 0, fair_market_value <= 0)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target entity not in a state from which the requested transition is defined"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Settlement Officer approving a disbursement is the same operator as the exchange coordinator"
  - id: ERR_ID_DEADLINE_PASSED
    http: 409
    condition: "identification finalize attempted after the 45-day id_deadline_at"
  - id: ERR_EXCHANGE_DEADLINE_PASSED
    http: 409
    condition: "replacement acquisition or completion attempted after the 180-day exchange_deadline_at"
  - id: ERR_THREE_PROPERTY_RULE_VIOLATED
    http: 409
    condition: "THREE_PROPERTY identification finalize with more than 3 candidate properties"
  - id: ERR_TWO_HUNDRED_PCT_RULE_VIOLATED
    http: 409
    condition: "TWO_HUNDRED_PCT identification finalize whose aggregate candidate FMV exceeds 200% of relinquished FMV"
  - id: ERR_NOT_IDENTIFIED
    http: 409
    condition: "replacement references a candidate not under this exchange's FINALIZED identification or already withdrawn"
  - id: ERR_TRUST_LOCKED
    http: 409
    condition: "disbursement create/approve attempted on a locked trust (exchange COMPLETED or FAILED)"
  - id: ERR_INSUFFICIENT_TRUST_FUNDS
    http: 409
    condition: "disbursement approval amount exceeds the trust's available_balance"
  - id: ERR_STALE_TRUST_VERSION
    http: 412
    condition: "expected_qualified_trust_version on disbursement create does not match the trust's current version"
  - id: ERR_DUPLICATE_TAXPAYER_ID
    http: 409
    condition: "exchanger registration with a taxpayer_id already in use"
  - id: ERR_TRUST_ALREADY_EXISTS
    http: 409
    condition: "opening a second trust on an exchange that already has one"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: QICoordinator
    description: "Qualified-intermediary operator who sets up exchanges, attaches properties, manages identifications, records replacements, and requests disbursements. Cannot approve disbursements on exchanges they coordinate (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /exchangers"
      - "POST /exchanges"
      - "POST /exchanges/{id}/relinquished-properties"
      - "POST /exchanges/{id}/trust"
      - "POST /exchanges/{id}/close-relinquished"
      - "POST /exchanges/{id}/replacement-properties"
      - "POST /exchanges/{id}/complete"
      - "POST /exchanges/{id}/fail"
      - "POST /exchanges/{id}/terminate"
      - "POST /exchanges/{id}/identifications"
      - "POST /identifications/{id}/candidates"
      - "POST /identifications/{id}/finalize"
      - "POST /identifications/{id}/revoke"
      - "POST /disbursements"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /_clock/set_current_utc"

  - name: SettlementOfficer
    description: "Independent financial controller who approves and voids disbursements of trust funds. Must differ from the exchange's coordinator on approval (4-eyes control)."
    identity: "opaque"
    exclusive_operations:
      - "POST /disbursements/{id}/approve"
      - "POST /disbursements/{id}/void"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /_clock/set_current_utc"

  - name: Exchanger
    description: "Taxpayer principal; read-only visibility into their own exchanges, trust balance, identifications, and disbursements."
    identity: "entity_backed:Exchanger"
    exclusive_operations: []
    shared_operations:
      - "GET /exchangers/{id}"
      - "GET /exchanges/{id}"
      - "GET /exchanges/{id}/relinquished-properties"
      - "GET /exchanges/{id}/trust"
      - "GET /exchanges/{id}/replacement-properties"
      - "GET /exchanges/{id}/identifications"
      - "GET /identifications/{id}"
      - "GET /identifications/{id}/candidates"
      - "GET /disbursements/{id}"
