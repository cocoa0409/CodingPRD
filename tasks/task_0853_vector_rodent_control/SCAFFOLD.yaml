scenario: "853. Vector & Rodent Control Program: complaint intake & inspection, harborage/attractant assessment, baiting & abatement order, property-owner notice & re-inspection, cost recovery, hotspot & surveillance, education, reporting"
domain_name: "vector-rodent-control"
api_prefix: "/vector-control"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; every child is discoverable
  # through a filtered list or a sub-resource list, never through deep nesting.

  state_machine_shape: cyclic
  # AbatementOrder cycles SERVED -> REINSPECTION_SCHEDULED -> ESCALATED -> SERVED;
  # Complaint cycles INSPECTION_SCHEDULED -> TRIAGED on a NO_ACCESS inspection;
  # CostRecoveryInvoice carries two independent axes (billing_status x lien_status).

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
    # Inspection.kind = INITIAL | REINSPECTION selects which FK (complaint_id vs
    # abatement_order_id) is populated, so one child table serves two parents.

  role_model: segregation_of_duties
  # The Supervisor who issues an abatement order may not be the Officer who ran
  # the inspection; a re-inspection may not be run by the initial inspector; the
  # user who prepares a cost-recovery invoice may not approve it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Zone
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable surveillance zone name"
        constraints: "1-120 characters"
      - name: code
        type: string
        source: input
        description: "Short zone code used on reports"
        constraints: "Unique across all zones; 2-16 characters; uppercase"
      - name: population_density_per_sqkm
        type: integer
        source: input
        description: "Residential density used in program reporting"
        constraints: ">= 0"
      - name: posture
        type: enum
        source: computed
        description: "Surveillance posture derived from rodent_index by calculation zone_rodent_index"
        default: "NORMAL"
        constraints: "NORMAL | ELEVATED | HOTSPOT"
      - name: rodent_index
        type: number
        source: computed
        description: "Composite 0.00-100.00 surveillance index recomputed by calculation zone_rodent_index"
        default: 0
        constraints: "2 decimal places"
      - name: open_complaint_count
        type: integer
        source: computed
        description: "Count of Complaint rows in this zone whose status is not one of CLOSED_NO_VIOLATION, CLOSED_RESOLVED, CLOSED_WITHDRAWN, CLOSED_DUPLICATE"
        default: 0
      - name: chronic_property_count
        type: integer
        source: computed
        description: "Count of Property rows in this zone whose chronic_flag is true"
        default: 0
      - name: active_station_count
        type: integer
        source: computed
        description: "Count of BaitStation rows in this zone whose status is ACTIVE or DAMAGED"
        default: 0
      - name: last_index_recomputed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which rodent_index was last recomputed; null until the first recompute"
        default: null

  - name: PropertyOwner
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name of the record owner"
        constraints: "1-120 characters"
      - name: email
        type: string
        source: input
        description: "Contact e-mail for electronic notices"
      - name: mailing_address
        type: string
        source: input
        description: "Address of record used when a notice is mailed"
      - name: notice_preference
        type: enum
        source: input
        description: "Preferred service channel recorded on file"
        default: "CERTIFIED_MAIL"
        constraints: "FIRST_CLASS_MAIL | CERTIFIED_MAIL | PERSONAL_SERVICE"
      - name: hardship_certified
        type: boolean
        source: input
        description: "True when the owner holds a certified financial-hardship exemption; gates the hardship discount in calculation cost_recovery_invoice_total"
        default: false
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Sum of balance_due_cents over this owner's CostRecoveryInvoice rows whose billing_status is APPROVED or PARTIALLY_PAID"
        default: 0
      - name: lifetime_paid_cents
        type: integer
        source: computed
        description: "Sum of amount_paid_cents over all of this owner's CostRecoveryInvoice rows whose billing_status is APPROVED, PARTIALLY_PAID or PAID"
        default: 0

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> Zone.id; the surveillance zone that contains this parcel"
      - name: owner_id
        type: string
        source: input
        description: "FK -> PropertyOwner.id; the record owner billed for cost recovery"
      - name: address_line
        type: string
        source: input
        description: "Street address of the parcel"
      - name: parcel_number
        type: string
        source: input
        description: "Assessor parcel number"
        constraints: "Unique across all properties"
      - name: property_type
        type: enum
        source: input
        description: "Land-use class driving inspection expectations"
        constraints: "RESIDENTIAL_SINGLE | RESIDENTIAL_MULTI | COMMERCIAL_FOOD | COMMERCIAL_OTHER | VACANT_LOT"
      - name: unit_count
        type: integer
        source: input
        description: "Dwelling or tenant units on the parcel"
        default: 1
        constraints: ">= 1"
      - name: provisional_chronic_score
        type: number
        source: computed
        description: "PROVISIONAL variant of calculation property_chronic_score; written when an Assessment is created and never gates anything"
        default: 0
        constraints: "0.00-100.00, 2 decimal places"
      - name: chronic_score
        type: number
        source: computed
        description: "REVIEWED variant of calculation property_chronic_score; written when an Inspection completes with result VIOLATION_FOUND"
        default: 0
        constraints: "0.00-100.00, 2 decimal places"
      - name: chronic_flag
        type: boolean
        source: computed
        description: "True when chronic_score >= CHRONIC_THRESHOLD (60.00); only the REVIEWED variant may flip it"
        default: false
      - name: open_order_count
        type: integer
        source: computed
        description: "Count of AbatementOrder rows on this property whose status is not COMPLIED and not CLOSED"
        default: 0
      - name: lien_encumbered
        type: boolean
        source: computed
        description: "True while at least one CostRecoveryInvoice on this property has lien_status FILED"
        default: false
      - name: last_inspection_at
        type: datetime
        source: computed
        description: "completed_at of the most recent Inspection on this parcel with status COMPLETED; null when none"
        default: null

  - name: Officer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Officer name printed on notices"
      - name: badge_number
        type: string
        source: input
        description: "Program badge number"
        constraints: "Unique across all officers"
      - name: rank
        type: enum
        source: input
        description: "Descriptive rank recorded on the officer record. It labels the officer's duties but is NOT enforced against the X-User-Role header: any Officer id may be presented as Inspector or as Supervisor, and every access decision is made by the endpoint roles list, the ownership rule and the segregation-of-duties rule instead."
        constraints: "FIELD_INSPECTOR | SUPERVISOR"
      - name: certification_expires_at
        type: datetime
        source: input
        description: "Instant after which the officer's pesticide-applicator certification is void; an inspection may only be started while certification_expires_at is strictly greater than the current logical clock"
      - name: active_assignment_count
        type: integer
        source: computed
        description: "Count of Inspection rows assigned to this officer whose status is SCHEDULED or IN_PROGRESS"
        default: 0

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the parcel the complaint is about"
      - name: zone_id
        type: string
        source: system
        description: "FK -> Zone.id; copied from Property.zone_id at intake and never re-derived afterwards"
      - name: complaint_type
        type: enum
        source: input
        description: "Nuisance category reported"
        constraints: "RODENT_SIGHTING | HARBORAGE | GARBAGE_ACCUMULATION | DEAD_ANIMAL | MOSQUITO_BREEDING"
      - name: reporter_type
        type: enum
        source: input
        description: "Who filed the complaint"
        constraints: "RESIDENT | OWNER | AGENCY | ANONYMOUS"
      - name: reporter_name
        type: string
        source: input
        description: "Reporter name; omitted for ANONYMOUS intake"
        default: null
      - name: reporter_phone
        type: string
        source: input
        description: "Reporter callback number"
        default: null
      - name: description
        type: string
        source: input
        description: "Free-text narrative captured at intake"
        constraints: "1-1000 characters"
      - name: reported_severity
        type: enum
        source: input
        description: "Severity claimed by the reporter at intake"
        default: "ROUTINE"
        constraints: "ROUTINE | HIGH | CRITICAL"
      - name: severity
        type: enum
        source: computed
        description: "Operative severity: equals reported_severity at intake, may be overridden at triage, and is auto-escalated from ROUTINE to HIGH when the zone posture is HOTSPOT at triage time"
        constraints: "ROUTINE | HIGH | CRITICAL"
      - name: status
        type: enum
        source: computed
        description: "Complaint lifecycle state, see state_machines.Complaint"
        default: "RECEIVED"
        constraints: "RECEIVED | TRIAGED | INSPECTION_SCHEDULED | INSPECTED | ABATEMENT_ORDERED | CLOSED_NO_VIOLATION | CLOSED_RESOLVED | CLOSED_WITHDRAWN | CLOSED_DUPLICATE"
      - name: priority_score
        type: number
        source: computed
        description: "Dispatch priority from calculation complaint_priority_score"
        default: 0
        constraints: "0.00-100.00, 2 decimal places"
      - name: response_due_at
        type: datetime
        source: computed
        description: "Service-level deadline from calculation complaint_response_deadline, always measured from created_at"
      - name: closure_reason
        type: enum
        source: computed
        description: "Why the complaint closed; null while open"
        default: null
        constraints: "NO_VIOLATION | RESOLVED | WITHDRAWN | DUPLICATE"
      - name: triaged_at
        type: datetime
        source: system
        description: "Logical-clock instant of the triage call; null before triage"
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the complaint reached a CLOSED_* state"
        default: null

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: complaint_id
        type: string
        source: input
        description: "FK -> Complaint.id; populated when kind is INITIAL, null when kind is REINSPECTION"
        default: null
      - name: abatement_order_id
        type: string
        source: input
        description: "FK -> AbatementOrder.id; populated when kind is REINSPECTION, null when kind is INITIAL"
        default: null
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; copied from the parent Complaint or AbatementOrder at scheduling time"
      - name: officer_id
        type: string
        source: input
        description: "FK -> Officer.id; the field officer assigned to the visit"
      - name: kind
        type: enum
        source: input
        description: "INITIAL responds to a complaint; REINSPECTION verifies an abatement order"
        constraints: "INITIAL | REINSPECTION"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Start of the booked visit window"
      - name: scheduled_end
        type: datetime
        source: input
        description: "End of the booked visit window"
        constraints: "Strictly after scheduled_start; duration between INSPECTION_MIN_DURATION_MINUTES (30) and INSPECTION_MAX_DURATION_MINUTES (240) inclusive"
      - name: status
        type: enum
        source: computed
        description: "Visit lifecycle state, see state_machines.Inspection"
        default: "SCHEDULED"
        constraints: "SCHEDULED | IN_PROGRESS | COMPLETED"
      - name: result
        type: enum
        source: input
        description: "Outcome recorded at completion; null until then"
        default: null
        constraints: "VIOLATION_FOUND | NO_VIOLATION | COMPLIANT | NON_COMPLIANT | NO_ACCESS"
      - name: notes
        type: string
        source: input
        description: "Field notes recorded at completion"
        default: null
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock instant the officer started the visit"
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant the visit was completed"
        default: null

  - name: Assessment
    parent: Inspection
    common_fields: false
    fields:
      - name: inspection_id
        type: string
        source: system
        description: "FK -> Inspection.id; the visit during which the assessment was taken"
      - name: harborage_score
        type: integer
        source: input
        description: "Harborage observation score"
        constraints: "0-10 inclusive"
      - name: attractant_score
        type: integer
        source: input
        description: "Food/water attractant observation score"
        constraints: "0-10 inclusive"
      - name: sanitation_score
        type: integer
        source: input
        description: "Sanitation deficiency score"
        constraints: "0-10 inclusive"
      - name: burrow_count
        type: integer
        source: input
        description: "Active burrows counted on the parcel"
        constraints: ">= 0"
      - name: evidence_photo_count
        type: integer
        source: input
        description: "Number of evidence photographs attached"
        default: 0
        constraints: ">= 0"
      - name: recommended_actions
        type: array
        source: input
        description: "Abatement actions the inspector recommends"
        default: []
      - name: infestation_index
        type: number
        source: computed
        description: "Composite 0.00-100.00 index from calculation assessment_infestation_index"
        constraints: "2 decimal places"
      - name: infestation_tier
        type: enum
        source: computed
        description: "Tier derived from infestation_index thresholds in calculation assessment_infestation_index"
        constraints: "LOW | MODERATE | SEVERE"

  - name: AbatementOrder
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; copied from the originating Inspection"
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the completed INITIAL inspection that documented the violation"
      - name: issued_by_officer_id
        type: string
        source: system
        description: "FK -> Officer.id; the X-User-ID of the Supervisor who issued the order"
      - name: status
        type: enum
        source: computed
        description: "Order lifecycle state, see state_machines.AbatementOrder"
        default: "ISSUED"
        constraints: "ISSUED | SERVED | REINSPECTION_SCHEDULED | ESCALATED | CITY_ABATED | COMPLIED | CLOSED"
      - name: required_actions
        type: array
        source: input
        description: "Corrective actions the owner must complete"
        constraints: "At least one element"
      - name: infestation_tier_at_issue
        type: enum
        source: system
        description: "Copied from the originating Inspection's Assessment.infestation_tier at issuance"
        constraints: "LOW | MODERATE | SEVERE"
      - name: escalation_level
        type: integer
        source: computed
        description: "Number of failed re-inspections; capped at ESCALATION_MAX_LEVEL (2)"
        default: 0
      - name: compliance_deadline
        type: datetime
        source: computed
        description: "Deadline from calculation abatement_compliance_deadline; null until the order is served"
        default: null
      - name: served_at
        type: datetime
        source: system
        description: "served_at of the OwnerNotice whose service moved the order into SERVED most recently"
        default: null
      - name: extension_count
        type: integer
        source: computed
        description: "Number of granted extensions; capped at MAX_EXTENSIONS_PER_ORDER (1)"
        default: 0
      - name: extension_days_total
        type: integer
        source: computed
        description: "Total days added to compliance_deadline by extensions"
        default: 0
      - name: education_advisory_served
        type: boolean
        source: computed
        description: "True once an OwnerNotice with notice_type EDUCATIONAL_ADVISORY on this order reaches status SERVED; gates the education credit in calculation cost_recovery_invoice_total"
        default: false
      - name: actual_labor_hours
        type: number
        source: input
        description: "Crew hours recorded when the city abates the nuisance itself; null until then"
        default: null
        constraints: "> 0, at most 2 decimal places"
      - name: actual_materials_cents
        type: integer
        source: input
        description: "Material cost in cents recorded at city abatement; null until then"
        default: null
        constraints: ">= 0"
      - name: abated_at
        type: datetime
        source: system
        description: "Logical-clock instant of the city abatement"
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant the order reached COMPLIED or CLOSED"
        default: null

  - name: OwnerNotice
    parent: AbatementOrder
    common_fields: true
    fields:
      - name: abatement_order_id
        type: string
        source: system
        description: "FK -> AbatementOrder.id; the order this notice announces"
      - name: notice_type
        type: enum
        source: input
        description: "Legal character of the notice"
        constraints: "ABATEMENT_ORDER | EDUCATIONAL_ADVISORY | FINAL_WARNING | LIEN_INTENT"
      - name: delivery_method
        type: enum
        source: input
        description: "Channel used to serve the notice"
        constraints: "FIRST_CLASS_MAIL | CERTIFIED_MAIL | PERSONAL_SERVICE | POSTING"
      - name: recipient_address
        type: string
        source: system
        description: "Copied from PropertyOwner.mailing_address at the moment the notice is created"
      - name: status
        type: enum
        source: computed
        description: "Service state, see state_machines.OwnerNotice"
        default: "PENDING_SERVICE"
        constraints: "PENDING_SERVICE | SERVED | UNDELIVERABLE"
      - name: service_outcome
        type: enum
        source: input
        description: "Outcome reported by the process server; null until reported"
        default: null
        constraints: "DELIVERED | REFUSED | UNDELIVERABLE"
      - name: sent_at
        type: datetime
        source: system
        description: "Logical-clock instant the notice was generated"
      - name: served_at
        type: datetime
        source: system
        description: "Logical-clock instant the service result was recorded, when the outcome is DELIVERED or REFUSED"
        default: null

  - name: BaitStation
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; parcel the station is installed on"
      - name: zone_id
        type: string
        source: system
        description: "FK -> Zone.id; copied from Property.zone_id at installation"
      - name: station_code
        type: string
        source: input
        description: "Station label"
        constraints: "Unique within a property"
      - name: bait_type
        type: enum
        source: input
        description: "Control device installed"
        constraints: "ANTICOAGULANT | SNAP_TRAP | GLUE_BOARD | BAIT_BLOCK"
      - name: status
        type: enum
        source: computed
        description: "Station condition state, see state_machines.BaitStation"
        default: "ACTIVE"
        constraints: "ACTIVE | DAMAGED | REMOVED"
      - name: installed_at
        type: datetime
        source: system
        description: "Logical-clock instant of installation"
      - name: last_reading_at
        type: datetime
        source: computed
        description: "reading_at of the most recent SurveillanceReading on this station; null when none"
        default: null
      - name: reading_count
        type: integer
        source: computed
        description: "Number of SurveillanceReading rows recorded on this station"
        default: 0
      - name: cumulative_take_pct
        type: integer
        source: computed
        description: "Sum of take_pct across all SurveillanceReading rows on this station"
        default: 0

  - name: SurveillanceReading
    parent: BaitStation
    common_fields: false
    fields:
      - name: bait_station_id
        type: string
        source: system
        description: "FK -> BaitStation.id; the serviced station"
      - name: reading_at
        type: datetime
        source: system
        description: "Logical-clock instant the servicing visit was recorded"
      - name: take_pct
        type: integer
        source: input
        description: "Percentage of bait consumed since the previous servicing"
        constraints: "0-100 inclusive"
      - name: activity_sign_count
        type: integer
        source: input
        description: "Count of droppings, runways, gnaw marks and other activity signs observed"
        constraints: ">= 0"
      - name: station_condition
        type: enum
        source: input
        description: "Physical condition of the station at servicing; drives state_machines.BaitStation"
        constraints: "INTACT | DAMAGED | MISSING"
      - name: rebaited
        type: boolean
        source: input
        description: "True when the technician replenished bait during the visit"
        default: true

  - name: CostRecoveryInvoice
    parent: null
    common_fields: true
    fields:
      - name: abatement_order_id
        type: string
        source: input
        description: "FK -> AbatementOrder.id; the city-abated order being recovered"
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; copied from the order"
      - name: owner_id
        type: string
        source: system
        description: "FK -> PropertyOwner.id; copied from the property at invoice creation"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the FinanceOfficer who created the invoice"
      - name: approved_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the ProgramAdmin who approved the invoice; null while DRAFT"
        default: null
      - name: billing_status
        type: enum
        source: computed
        description: "Billing axis of state_machines.CostRecoveryInvoice"
        default: "DRAFT"
        constraints: "DRAFT | APPROVED | PARTIALLY_PAID | PAID | VOID"
      - name: lien_status
        type: enum
        source: computed
        description: "Lien axis of state_machines.CostRecoveryInvoice, independent of billing_status"
        default: "NONE"
        constraints: "NONE | FILED | RELEASED"
      - name: estimated_total_cents
        type: integer
        source: computed
        description: "ESTIMATE variant of calculation cost_recovery_invoice_total, written at invoice creation"
      - name: final_total_cents
        type: integer
        source: computed
        description: "FINAL variant of calculation cost_recovery_invoice_total, written at approval; null while DRAFT"
        default: null
      - name: labor_line_cents
        type: integer
        source: computed
        description: "FINAL-variant labor line, written at approval"
        default: null
      - name: materials_line_cents
        type: integer
        source: computed
        description: "FINAL-variant materials line, written at approval"
        default: null
      - name: penalty_line_cents
        type: integer
        source: computed
        description: "FINAL-variant escalation penalty line, written at approval"
        default: null
      - name: education_credit_cents
        type: integer
        source: computed
        description: "FINAL-variant education credit line, written at approval"
        default: null
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "FINAL-variant administrative fee line, written at approval"
        default: null
      - name: hardship_discount_cents
        type: integer
        source: computed
        description: "FINAL-variant hardship discount line, written at approval"
        default: null
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Sum of accepted payments on this invoice"
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "final_total_cents minus amount_paid_cents while billing_status is APPROVED or PARTIALLY_PAID; 0 in DRAFT, PAID and VOID"
        default: 0
      - name: due_at
        type: datetime
        source: computed
        description: "Approval instant plus INVOICE_DUE_DAYS (30); null while DRAFT"
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: "Logical-clock instant balance_due_cents first reached 0 through payment"
        default: null
      - name: lien_filed_at
        type: datetime
        source: system
        description: "Logical-clock instant the lien was filed"
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: "Logical-clock instant the invoice was voided"
        default: null
      - name: void_reason
        type: string
        source: input
        description: "Reason captured when the invoice is voided"
        default: null

state_machines:
  - entity: Complaint
    initial_state: RECEIVED
    terminal_states: [CLOSED_NO_VIOLATION, CLOSED_RESOLVED, CLOSED_WITHDRAWN, CLOSED_DUPLICATE]
    transitions:
      - from: RECEIVED
        to: TRIAGED
        trigger: "POST /vector-control/complaints/{id}/triage"
        actor: Supervisor
        preconditions:
          - "complaint.status == RECEIVED"
        side_effects:
          - "severity := submitted severity, then auto-escalated from ROUTINE to HIGH when Zone.posture == HOTSPOT at triage time"
          - "recompute complaint.priority_score via calculation complaint_priority_score"
          - "recompute complaint.response_due_at via calculation complaint_response_deadline, always measured from complaint.created_at"
          - "triaged_at := current logical clock"

      - from: RECEIVED
        to: CLOSED_DUPLICATE
        trigger: "POST /vector-control/complaints/{id}/close with closure_reason DUPLICATE"
        actor: Supervisor
        preconditions:
          - "complaint.status == RECEIVED"
          - "no AbatementOrder on this complaint's property is in a non-terminal status"
        side_effects:
          - "closure_reason := DUPLICATE; closed_at := current logical clock"
          - "Zone.open_complaint_count -= 1 for complaint.zone_id"
          - "recompute Zone.rodent_index and Zone.posture via calculation zone_rodent_index"

      - from: RECEIVED
        to: CLOSED_WITHDRAWN
        trigger: "POST /vector-control/complaints/{id}/close with closure_reason WITHDRAWN"
        actor: Supervisor
        preconditions:
          - "complaint.status == RECEIVED"
          - "no AbatementOrder on this complaint's property is in a non-terminal status"
        side_effects:
          - "closure_reason := WITHDRAWN; closed_at := current logical clock"
          - "Zone.open_complaint_count -= 1 for complaint.zone_id"
          - "recompute Zone.rodent_index and Zone.posture via calculation zone_rodent_index"

      - from: TRIAGED
        to: CLOSED_WITHDRAWN
        trigger: "POST /vector-control/complaints/{id}/close with closure_reason WITHDRAWN"
        actor: Supervisor
        preconditions:
          - "complaint.status == TRIAGED"
          - "no AbatementOrder on this complaint's property is in a non-terminal status (ISSUED, SERVED, REINSPECTION_SCHEDULED, ESCALATED, CITY_ABATED)"
        side_effects:
          - "closure_reason := WITHDRAWN; closed_at := current logical clock"
          - "Zone.open_complaint_count -= 1 for complaint.zone_id"
          - "recompute Zone.rodent_index and Zone.posture via calculation zone_rodent_index"

      - from: TRIAGED
        to: INSPECTION_SCHEDULED
        trigger: "POST /vector-control/inspections with kind INITIAL and this complaint_id"
        actor: Supervisor
        preconditions:
          - "complaint.status == TRIAGED"
        side_effects:
          - "Inspection created in SCHEDULED"
          - "Officer.active_assignment_count += 1 for the assigned officer"

      - from: INSPECTION_SCHEDULED
        to: INSPECTED
        trigger: "POST /vector-control/inspections/{id}/complete with result VIOLATION_FOUND"
        actor: Inspector
        preconditions:
          - "the INITIAL inspection linked to this complaint reached status COMPLETED with result VIOLATION_FOUND"
        side_effects:
          - "CASCADE hop 2 of transitive_cascade inspection_completion_chain: the complaint records the confirmed violation"
          - "CASCADE hop 3 (caused by this transition): recompute Property.chronic_score with the REVIEWED variant of calculation property_chronic_score, set Property.chronic_flag := chronic_score >= 60.00 and bump Property.version by 1"
          - "CASCADE hop 4 (caused only when chronic_flag flipped false -> true): Zone.chronic_property_count += 1, recompute Zone.rodent_index and Zone.posture, bump Zone.version by 1"

      - from: INSPECTION_SCHEDULED
        to: CLOSED_NO_VIOLATION
        trigger: "POST /vector-control/inspections/{id}/complete with result NO_VIOLATION"
        actor: Inspector
        preconditions:
          - "the INITIAL inspection linked to this complaint reached status COMPLETED with result NO_VIOLATION"
        side_effects:
          - "closure_reason := NO_VIOLATION; closed_at := current logical clock"
          - "Zone.open_complaint_count -= 1 for complaint.zone_id"
          - "recompute Zone.rodent_index and Zone.posture via calculation zone_rodent_index"
          - "Property.chronic_score is NOT recomputed (no violation was confirmed)"

      - from: INSPECTION_SCHEDULED
        to: TRIAGED
        trigger: "POST /vector-control/inspections/{id}/complete with result NO_ACCESS"
        actor: Inspector
        note: "Revert leg that makes the Complaint machine cyclic: an unreachable parcel returns the case to the scheduling queue"
        preconditions:
          - "the INITIAL inspection linked to this complaint reached status COMPLETED with result NO_ACCESS"
        side_effects:
          - "complaint returns to TRIAGED so a further inspection can be scheduled"
          - "Officer.active_assignment_count -= 1 for the visiting officer"
          - "Zone.open_complaint_count unchanged (the case is still open)"

      - from: INSPECTED
        to: ABATEMENT_ORDERED
        trigger: "POST /vector-control/abatement-orders"
        actor: Supervisor
        preconditions:
          - "complaint.status == INSPECTED"
        side_effects:
          - "AbatementOrder created in ISSUED"
          - "Property.open_order_count += 1 and Property.version bumped by 1"

      - from: ABATEMENT_ORDERED
        to: CLOSED_RESOLVED
        trigger: "system: the AbatementOrder linked to this complaint reaches COMPLIED or CLOSED"
        actor: system
        preconditions:
          - "the order created from this complaint's inspection reached COMPLIED or CLOSED"
        side_effects:
          - "closure_reason := RESOLVED; closed_at := current logical clock"
          - "Zone.open_complaint_count -= 1 for complaint.zone_id"
          - "recompute Zone.rodent_index and Zone.posture via calculation zone_rodent_index"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /vector-control/inspections/{id}/start"
        actor: Inspector
        preconditions:
          - "inspection.status == SCHEDULED"
          - "X-User-ID == inspection.officer_id"
          - "Officer.certification_expires_at > current logical clock (strict)"
        side_effects:
          - "started_at := current logical clock"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /vector-control/inspections/{id}/complete"
        actor: Inspector
        preconditions:
          - "inspection.status == IN_PROGRESS"
          - "X-User-ID == inspection.officer_id"
          - "when kind == INITIAL, result IN {VIOLATION_FOUND, NO_VIOLATION, NO_ACCESS}; when kind == REINSPECTION, result IN {COMPLIANT, NON_COMPLIANT, NO_ACCESS}"
          - "when result == VIOLATION_FOUND, exactly one Assessment already exists for this inspection"
        side_effects:
          - "completed_at := current logical clock; result stored"
          - "Officer.active_assignment_count -= 1"
          - "Property.last_inspection_at := completed_at"
          - "CASCADE hop 1 of transitive_cascade inspection_completion_chain when kind == INITIAL and result == VIOLATION_FOUND: the linked Complaint transitions INSPECTION_SCHEDULED -> INSPECTED"
          - "when kind == INITIAL and result == NO_VIOLATION: linked Complaint transitions to CLOSED_NO_VIOLATION"
          - "when kind == INITIAL and result == NO_ACCESS: linked Complaint transitions back to TRIAGED"
          - "when kind == REINSPECTION and result == COMPLIANT: linked AbatementOrder transitions REINSPECTION_SCHEDULED -> COMPLIED"
          - "when kind == REINSPECTION and result == NON_COMPLIANT: linked AbatementOrder transitions REINSPECTION_SCHEDULED -> ESCALATED"
          - "when kind == REINSPECTION and result == NO_ACCESS: linked AbatementOrder transitions REINSPECTION_SCHEDULED -> SERVED with compliance_deadline unchanged"

  - entity: AbatementOrder
    initial_state: ISSUED
    terminal_states: [COMPLIED, CLOSED]
    transitions:
      - from: ISSUED
        to: SERVED
        trigger: "POST /vector-control/notices/{id}/service-result with service_outcome DELIVERED or REFUSED on an ABATEMENT_ORDER notice"
        actor: IntakeClerk
        preconditions:
          - "order.status == ISSUED"
          - "notice.notice_type == ABATEMENT_ORDER and notice.status == PENDING_SERVICE"
        side_effects:
          - "served_at := current logical clock"
          - "compliance_deadline := calculation abatement_compliance_deadline evaluated at service time"
          - "order.version bumped by 1"

      - from: SERVED
        to: REINSPECTION_SCHEDULED
        trigger: "POST /vector-control/inspections with kind REINSPECTION and this abatement_order_id"
        actor: Supervisor
        preconditions:
          - "order.status == SERVED"
          - "scheduled_start >= order.compliance_deadline"
          - "officer_id != the officer_id of order.inspection_id"
        side_effects:
          - "Inspection created in SCHEDULED with kind REINSPECTION"
          - "Officer.active_assignment_count += 1 for the assigned officer"

      - from: REINSPECTION_SCHEDULED
        to: COMPLIED
        trigger: "POST /vector-control/inspections/{id}/complete with result COMPLIANT on the REINSPECTION"
        actor: Inspector
        preconditions:
          - "order.status == REINSPECTION_SCHEDULED"
        side_effects:
          - "closed_at := current logical clock"
          - "Property.open_order_count -= 1 and Property.version bumped by 1"
          - "the originating Complaint transitions ABATEMENT_ORDERED -> CLOSED_RESOLVED"
          - "no CostRecoveryInvoice may be created for a COMPLIED order"

      - from: REINSPECTION_SCHEDULED
        to: ESCALATED
        trigger: "POST /vector-control/inspections/{id}/complete with result NON_COMPLIANT on the REINSPECTION"
        actor: Inspector
        preconditions:
          - "order.status == REINSPECTION_SCHEDULED"
        side_effects:
          - "escalation_level := min(ESCALATION_MAX_LEVEL (2), escalation_level + 1)"
          - "order.version bumped by 1"

      - from: REINSPECTION_SCHEDULED
        to: SERVED
        trigger: "POST /vector-control/inspections/{id}/complete with result NO_ACCESS on the REINSPECTION"
        actor: Inspector
        preconditions:
          - "order.status == REINSPECTION_SCHEDULED"
        side_effects:
          - "compliance_deadline unchanged; a further re-inspection may be scheduled"

      - from: ESCALATED
        to: SERVED
        trigger: "POST /vector-control/notices/{id}/service-result with service_outcome DELIVERED or REFUSED on a FINAL_WARNING notice"
        actor: IntakeClerk
        note: "Cycle leg: SERVED -> REINSPECTION_SCHEDULED -> ESCALATED -> SERVED is the abatement negotiation loop"
        preconditions:
          - "order.status == ESCALATED"
          - "notice.notice_type == FINAL_WARNING and notice.status == PENDING_SERVICE"
        side_effects:
          - "served_at := current logical clock"
          - "compliance_deadline recomputed by calculation abatement_compliance_deadline, which shortens the window because escalation_level >= 1"
          - "extension_count and extension_days_total are NOT reset"
          - "order.version bumped by 1"

      - from: ESCALATED
        to: CITY_ABATED
        trigger: "POST /vector-control/abatement-orders/{id}/city-abate"
        actor: Supervisor
        preconditions:
          - "order.status == ESCALATED"
        side_effects:
          - "actual_labor_hours and actual_materials_cents stored; abated_at := current logical clock"
          - "order.version bumped by 1"

      - from: SERVED
        to: CITY_ABATED
        trigger: "POST /vector-control/abatement-orders/{id}/city-abate"
        actor: Supervisor
        note: "Fork leg out of SERVED: the branch that skips re-inspection entirely once the deadline has lapsed, so the order reaches cost recovery with escalation_level still 0 and a penalty multiplier of 1.00"
        preconditions:
          - "order.status == SERVED"
          - "current logical clock >= order.compliance_deadline (a strictly earlier clock is rejected with ERR_DEADLINE_NOT_PASSED)"
        side_effects:
          - "actual_labor_hours and actual_materials_cents stored; abated_at := current logical clock"
          - "escalation_level stays 0, so calculation cost_recovery_invoice_total applies PENALTY_MULTIPLIER_LEVEL_0 (1.00) and bills no penalty line"
          - "order.version bumped by 1"

      - from: CITY_ABATED
        to: CLOSED
        trigger: "system: the CostRecoveryInvoice for this order reaches billing_status PAID"
        actor: system
        preconditions:
          - "order.status == CITY_ABATED"
          - "the invoice whose abatement_order_id is this order reached billing_status PAID"
        side_effects:
          - "CASCADE hop 2 of transitive_cascade payment_settlement_chain: closed_at := current logical clock"
          - "Property.open_order_count -= 1 and Property.version bumped by 1"
          - "CASCADE hop 3 (caused by this transition): the originating Complaint transitions ABATEMENT_ORDERED -> CLOSED_RESOLVED with closure_reason RESOLVED"
          - "CASCADE hop 4 (caused by hop 3): Zone.open_complaint_count -= 1 and Zone.rodent_index / Zone.posture recomputed"

  - entity: OwnerNotice
    initial_state: PENDING_SERVICE
    terminal_states: [SERVED, UNDELIVERABLE]
    transitions:
      - from: PENDING_SERVICE
        to: SERVED
        trigger: "POST /vector-control/notices/{id}/service-result with service_outcome DELIVERED or REFUSED"
        actor: IntakeClerk
        note: "Refusal is deemed good service under the program ordinance"
        preconditions:
          - "notice.status == PENDING_SERVICE"
        side_effects:
          - "served_at := current logical clock"
          - "when notice_type == ABATEMENT_ORDER and order.status == ISSUED: order transitions to SERVED"
          - "when notice_type == FINAL_WARNING and order.status == ESCALATED: order transitions to SERVED"
          - "when notice_type == EDUCATIONAL_ADVISORY: order.education_advisory_served := true and order.version bumped by 1"
          - "when notice_type == LIEN_INTENT: no order state change"

      - from: PENDING_SERVICE
        to: UNDELIVERABLE
        trigger: "POST /vector-control/notices/{id}/service-result with service_outcome UNDELIVERABLE"
        actor: IntakeClerk
        preconditions:
          - "notice.status == PENDING_SERVICE"
        side_effects:
          - "served_at stays null and the order status is unchanged; a further notice must be created to advance the order"

  - entity: BaitStation
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: DAMAGED
        trigger: "POST /vector-control/bait-stations/{id}/readings with station_condition DAMAGED"
        actor: Inspector
        preconditions:
          - "station.status == ACTIVE"
        side_effects:
          - "station remains eligible for the zone surveillance window (statuses ACTIVE and DAMAGED are both eligible)"

      - from: DAMAGED
        to: ACTIVE
        trigger: "POST /vector-control/bait-stations/{id}/readings with station_condition INTACT"
        actor: Inspector
        note: "Repair loop makes the BaitStation machine cyclic"
        preconditions:
          - "station.status == DAMAGED"
        side_effects:
          - "Zone.active_station_count unchanged (both statuses count as eligible)"

      - from: ACTIVE
        to: REMOVED
        trigger: "POST /vector-control/bait-stations/{id}/readings with station_condition MISSING"
        actor: Inspector
        preconditions:
          - "station.status == ACTIVE"
        side_effects:
          - "Zone.active_station_count -= 1"
          - "all readings of this station leave the eligible set of calculation zone_rodent_index; Zone.rodent_index and Zone.posture are recomputed"

      - from: DAMAGED
        to: REMOVED
        trigger: "POST /vector-control/bait-stations/{id}/readings with station_condition MISSING"
        actor: Inspector
        preconditions:
          - "station.status == DAMAGED"
        side_effects:
          - "Zone.active_station_count -= 1"
          - "Zone.rodent_index and Zone.posture recomputed with this station's readings excluded"

  - entity: CostRecoveryInvoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    note: "Two independent axes evolve on the same row: billing_status (DRAFT -> APPROVED -> PARTIALLY_PAID -> PAID, VOID) and lien_status (NONE -> FILED -> RELEASED). A lien may be filed while billing_status is APPROVED or PARTIALLY_PAID and is released by the payment that clears the balance."
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /vector-control/cost-recovery-invoices/{id}/approve"
        actor: ProgramAdmin
        preconditions:
          - "billing_status == DRAFT"
          - "X-User-ID != invoice.prepared_by_user_id"
          - "final_total_cents <= APPROVAL_LIMIT_CENTS (500000) or escalated_approval == true"
        side_effects:
          - "final_total_cents and the six line fields written by the FINAL variant of calculation cost_recovery_invoice_total"
          - "balance_due_cents := final_total_cents; due_at := current logical clock + INVOICE_DUE_DAYS (30 days)"
          - "PropertyOwner.outstanding_balance_cents += final_total_cents"
          - "approved_by_user_id := X-User-ID"

      - from: APPROVED
        to: PARTIALLY_PAID
        trigger: "POST /vector-control/cost-recovery-invoices/{id}/payments with amount_cents < balance_due_cents"
        actor: FinanceOfficer
        preconditions:
          - "billing_status == APPROVED"
          - "0 < amount_cents < balance_due_cents"
        side_effects:
          - "amount_paid_cents += amount_cents; balance_due_cents -= amount_cents"
          - "PropertyOwner.outstanding_balance_cents -= amount_cents; PropertyOwner.lifetime_paid_cents += amount_cents"

      - from: APPROVED
        to: PAID
        trigger: "POST /vector-control/cost-recovery-invoices/{id}/payments with amount_cents == balance_due_cents"
        actor: FinanceOfficer
        preconditions:
          - "billing_status == APPROVED"
          - "amount_cents == balance_due_cents"
        side_effects:
          - "CASCADE hop 1 of transitive_cascade payment_settlement_chain: balance_due_cents := 0, paid_at := current logical clock"
          - "PropertyOwner.outstanding_balance_cents -= the cleared amount; PropertyOwner.lifetime_paid_cents += amount_cents"
          - "when lien_status == FILED it transitions to RELEASED and Property.lien_encumbered is recomputed"
          - "CASCADE hop 2 (caused by reaching PAID): the linked AbatementOrder transitions CITY_ABATED -> CLOSED"

      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /vector-control/cost-recovery-invoices/{id}/payments with amount_cents == balance_due_cents"
        actor: FinanceOfficer
        preconditions:
          - "billing_status == PARTIALLY_PAID"
          - "amount_cents == balance_due_cents"
        side_effects:
          - "balance_due_cents := 0; paid_at := current logical clock"
          - "PropertyOwner.outstanding_balance_cents -= the cleared amount; PropertyOwner.lifetime_paid_cents += amount_cents"
          - "when lien_status == FILED it transitions to RELEASED and Property.lien_encumbered is recomputed"
          - "the linked AbatementOrder transitions CITY_ABATED -> CLOSED"

      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /vector-control/cost-recovery-invoices/{id}/payments with amount_cents < balance_due_cents"
        actor: FinanceOfficer
        preconditions:
          - "billing_status == PARTIALLY_PAID"
          - "0 < amount_cents < balance_due_cents"
        side_effects:
          - "amount_paid_cents += amount_cents; balance_due_cents -= amount_cents"
          - "PropertyOwner.outstanding_balance_cents -= amount_cents; PropertyOwner.lifetime_paid_cents += amount_cents"

      - from: DRAFT
        to: VOID
        trigger: "POST /vector-control/cost-recovery-invoices/{id}/void"
        actor: FinanceOfficer
        preconditions:
          - "billing_status == DRAFT"
        side_effects:
          - "voided_at := current logical clock; balance_due_cents := 0"
          - "PropertyOwner.outstanding_balance_cents unchanged (a DRAFT invoice never entered the balance)"

      - from: APPROVED
        to: VOID
        trigger: "POST /vector-control/cost-recovery-invoices/{id}/void"
        actor: FinanceOfficer
        note: "Compensating action for the approve transition; see compensating_invariant owner_balance_conserved_on_void"
        preconditions:
          - "billing_status == APPROVED"
        side_effects:
          - "PropertyOwner.outstanding_balance_cents -= balance_due_cents (restoring the pre-approval balance exactly)"
          - "balance_due_cents := 0; voided_at := current logical clock"
          - "when lien_status == FILED it transitions to RELEASED and Property.lien_encumbered is recomputed"
          - "the linked AbatementOrder stays CITY_ABATED so a replacement invoice can be prepared"

      - from: PARTIALLY_PAID
        to: VOID
        trigger: "POST /vector-control/cost-recovery-invoices/{id}/void"
        actor: FinanceOfficer
        preconditions:
          - "billing_status == PARTIALLY_PAID"
        side_effects:
          - "PropertyOwner.outstanding_balance_cents -= balance_due_cents; amount_paid_cents is retained"
          - "balance_due_cents := 0; voided_at := current logical clock"

      - from: NONE
        to: FILED
        trigger: "POST /vector-control/cost-recovery-invoices/{id}/lien (lien axis)"
        actor: FinanceOfficer
        preconditions:
          - "lien_status == NONE"
          - "billing_status IN {APPROVED, PARTIALLY_PAID}"
          - "balance_due_cents >= LIEN_MIN_BALANCE_CENTS (25000)"
          - "current logical clock >= due_at + LIEN_MIN_DAYS_PAST_DUE (60 days)"
        side_effects:
          - "lien_filed_at := current logical clock"
          - "Property.lien_encumbered := true and Property.version bumped by 1"

      - from: FILED
        to: RELEASED
        trigger: "system: the payment that drives balance_due_cents to 0, or a void of the invoice (lien axis)"
        actor: system
        preconditions:
          - "lien_status == FILED"
          - "billing_status becomes PAID or VOID"
        side_effects:
          - "Property.lien_encumbered := false when no other invoice on that property has lien_status FILED"

  - entity: Zone
    initial_state: NORMAL
    terminal_states: []
    note: "Posture is a derived aggregate that gates downstream behaviour: HOTSPOT auto-escalates ROUTINE complaints at triage and shortens the abatement compliance window."
    transitions:
      - from: NORMAL
        to: ELEVATED
        trigger: "system: recompute of calculation zone_rodent_index after a reading, a complaint intake or a complaint closure"
        actor: system
        preconditions:
          - "40.00 <= rodent_index < 70.00"
        side_effects:
          - "posture := ELEVATED; last_index_recomputed_at := current logical clock; Zone.version bumped by 1"
      - from: ELEVATED
        to: HOTSPOT
        trigger: "system: recompute of calculation zone_rodent_index"
        actor: system
        preconditions:
          - "rodent_index >= 70.00"
        side_effects:
          - "posture := HOTSPOT; complaint triage now auto-escalates ROUTINE to HIGH; abatement windows shorten to ABATEMENT_HOTSPOT_COMPLIANCE_DAYS (5)"
      - from: NORMAL
        to: HOTSPOT
        trigger: "system: recompute of calculation zone_rodent_index"
        actor: system
        preconditions:
          - "rodent_index >= 70.00"
        side_effects:
          - "posture := HOTSPOT"
      - from: HOTSPOT
        to: ELEVATED
        trigger: "system: recompute of calculation zone_rodent_index"
        actor: system
        preconditions:
          - "40.00 <= rodent_index < 70.00"
        side_effects:
          - "posture := ELEVATED"
      - from: ELEVATED
        to: NORMAL
        trigger: "system: recompute of calculation zone_rodent_index"
        actor: system
        preconditions:
          - "rodent_index < 40.00"
        side_effects:
          - "posture := NORMAL"
      - from: HOTSPOT
        to: NORMAL
        trigger: "system: recompute of calculation zone_rodent_index"
        actor: system
        preconditions:
          - "rodent_index < 40.00"
        side_effects:
          - "posture := NORMAL"

concurrency_rules:
  - rule_id: order-create-stale-property
    parent_entity: Property
    write_endpoint: "POST /vector-control/abatement-orders"
    occ_field: "expected_property_version"
    description: |
      Issuing an abatement order against a Property whose version has advanced
      since the Supervisor last read it is rejected with a stale-version error.
      A property's version advances whenever its chronic score is re-reviewed,
      its open_order_count changes or a lien is recorded, and each of those
      changes can legitimately alter which corrective actions the order must
      demand, so the issuing officer must be working from a current read.
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412

  - rule_id: invoice-create-stale-order
    parent_entity: AbatementOrder
    write_endpoint: "POST /vector-control/cost-recovery-invoices"
    occ_field: "expected_abatement_order_version"
    description: |
      Preparing a cost-recovery invoice against an AbatementOrder whose version
      has advanced since the FinanceOfficer last read it is rejected with a
      stale-version error. The order's version advances when a replacement
      invoice supersedes a voided one, when an education advisory is served and
      when the abatement crew revises its recorded hours - all of which change
      the amount that may legitimately be billed.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

calculations:
  - name: complaint_priority_score
    trigger: "On POST /vector-control/complaints (intake) and again on POST /vector-control/complaints/{id}/triage"
    algorithm: weighted_scoring
    formula: |
      severity_base   = SEVERITY_BASE[complaint.severity]
      type_weight     = TYPE_WEIGHT[complaint.complaint_type]
      chronic_bonus   = CHRONIC_PROPERTY_BONUS if property.chronic_flag == true else 0
      posture_bonus   = POSTURE_BONUS[zone.posture]        # zone.posture read at the moment of the call
      priority_score  = round_half_up(min(PRIORITY_SCORE_MAX,
                                          severity_base + type_weight + chronic_bonus + posture_bonus), 2)
    input_set: "Exactly one Complaint row plus the current values of Property.chronic_flag and Zone.posture at call time; no other complaints participate"
    constants:
      SEVERITY_BASE_ROUTINE: 20
      SEVERITY_BASE_HIGH: 40
      SEVERITY_BASE_CRITICAL: 60
      TYPE_WEIGHT_RODENT_SIGHTING: 10
      TYPE_WEIGHT_HARBORAGE: 15
      TYPE_WEIGHT_GARBAGE_ACCUMULATION: 12
      TYPE_WEIGHT_DEAD_ANIMAL: 8
      TYPE_WEIGHT_MOSQUITO_BREEDING: 18
      CHRONIC_PROPERTY_BONUS: 15
      POSTURE_BONUS_NORMAL: 0
      POSTURE_BONUS_ELEVATED: 5
      POSTURE_BONUS_HOTSPOT: 12
      PRIORITY_SCORE_MAX: 100
    precision: "2 decimal places, round_half_up"

  - name: complaint_response_deadline
    trigger: "On POST /vector-control/complaints (intake) and again on POST /vector-control/complaints/{id}/triage"
    algorithm: threshold
    formula: |
      sla_hours       = SLA_HOURS[complaint.severity]
      response_due_at = complaint.created_at + sla_hours hours
      # The offset is ALWAYS measured from created_at, never from triaged_at, so a
      # severity change at triage moves the deadline relative to the original intake.
    input_set: "One Complaint row; only its created_at and its operative severity participate"
    constants:
      SLA_HOURS_ROUTINE: 168
      SLA_HOURS_HIGH: 72
      SLA_HOURS_CRITICAL: 24
    precision: "ISO 8601 UTC with three fractional digits"

  - name: assessment_infestation_index
    trigger: "On POST /vector-control/inspections/{id}/assessments"
    algorithm: weighted_scoring
    formula: |
      base              = (HARBORAGE_WEIGHT * harborage_score
                           + ATTRACTANT_WEIGHT * attractant_score
                           + SANITATION_WEIGHT * sanitation_score) * 10
      burrow_surcharge  = min(BURROW_SURCHARGE_CAP, BURROW_SURCHARGE_PER_BURROW * burrow_count)
      infestation_index = round_half_up(min(100.0, base + burrow_surcharge), 2)
      infestation_tier  = SEVERE   if infestation_index >= TIER_SEVERE_MIN
                          else MODERATE if infestation_index >= TIER_MODERATE_MIN
                          else LOW
    input_set: "Exactly one Assessment row's four input scores; no other assessment participates"
    constants:
      HARBORAGE_WEIGHT: 0.40
      ATTRACTANT_WEIGHT: 0.35
      SANITATION_WEIGHT: 0.25
      BURROW_SURCHARGE_PER_BURROW: 3.0
      BURROW_SURCHARGE_CAP: 15.0
      TIER_MODERATE_MIN: 35.00
      TIER_SEVERE_MIN: 65.00
    precision: "2 decimal places, round_half_up"

  - name: property_chronic_score
    trigger: "PROVISIONAL runs on POST /vector-control/inspections/{id}/assessments; REVIEWED runs on POST /vector-control/inspections/{id}/complete when kind == INITIAL and result == VIOLATION_FOUND"
    algorithm: decay_function
    formula: |
      # ---- PROVISIONAL ----------------------------------------------------
      provisional_chronic_score = this_assessment.infestation_index
      # ---- REVIEWED -------------------------------------------------------
      qualifying = every Assessment A such that
                     A.inspection_id.property_id == property.id
                     AND A.inspection_id.status == COMPLETED
                     AND A.inspection_id.result == VIOLATION_FOUND
                     AND 0 <= (now - A.inspection_id.completed_at) <= CHRONIC_LOOKBACK_DAYS days
                   ordered by A.inspection_id.completed_at ASC, then by A.created_at ASC
      n          = count(qualifying)
      age_days_i = floor((now - A_i.inspection_id.completed_at) / 1 day)
      weight_i   = max(0.0, 1.0 - CHRONIC_DECAY_PER_30_DAYS * floor(age_days_i / 30))
      weighted   = sum(A_i.infestation_index * weight_i) / sum(weight_i)      # sum(weight_i) > 0 always: the
                                                                             # just-completed assessment has weight 1.0
      chronic_score = round_half_up(min(100.0, weighted + REPEAT_OFFENSE_SURCHARGE * (n - 1)), 2)
      chronic_flag  = chronic_score >= CHRONIC_THRESHOLD
    input_set: "PROVISIONAL sees exactly one Assessment. REVIEWED sees every Assessment on the property whose parent Inspection is COMPLETED with result VIOLATION_FOUND and whose completed_at is within CHRONIC_LOOKBACK_DAYS of the current logical clock, inclusive at both ends; assessments on NO_VIOLATION, NO_ACCESS or re-inspection visits are excluded."
    constants:
      CHRONIC_LOOKBACK_DAYS: 365
      CHRONIC_DECAY_PER_30_DAYS: 0.10
      REPEAT_OFFENSE_SURCHARGE: 8.0
      CHRONIC_THRESHOLD: 60.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "Written to Property.provisional_chronic_score the moment an Assessment is created, before the inspection is completed"
        difference: "Single-observation view: it copies the new assessment's infestation_index verbatim, applies no time decay, adds no repeat-offence surcharge and NEVER sets chronic_flag"
      - name: REVIEWED
        when: "Written to Property.chronic_score when the INITIAL inspection completes with result VIOLATION_FOUND"
        difference: "Decayed weighted mean across the 365-day history plus 8.00 per prior qualifying assessment; it is the only variant permitted to set Property.chronic_flag, so the same underlying assessment can leave provisional_chronic_score and chronic_score at different values"

  - name: zone_rodent_index
    trigger: "On POST /vector-control/bait-stations/{id}/readings, on every Complaint status change that enters or leaves an open state, on BaitStation status changes, and on every read of GET /vector-control/zones/{id}/surveillance-summary"
    algorithm: weighted_scoring
    formula: |
      window_start = now - SURVEILLANCE_WINDOW_DAYS days      # inclusive
      window_end   = now                                      # inclusive
      eligible_stations = BaitStation rows with zone_id == zone.id AND status IN {ACTIVE, DAMAGED}
      window_readings   = SurveillanceReading rows whose bait_station_id is in eligible_stations
                          AND window_start <= reading_at <= window_end
      if count(window_readings) == 0:
          bait_component = 0.00
          sign_component = 0.00
      else:
          bait_component = round_half_up(sum(r.take_pct) / count(window_readings), 2)
          sign_component = round_half_up(min(100.0,
                              SIGN_SCALE * (sum(r.activity_sign_count) / count(window_readings))), 2)
      open_complaints    = Complaint rows with zone_id == zone.id
                           AND status IN {RECEIVED, TRIAGED, INSPECTION_SCHEDULED, INSPECTED, ABATEMENT_ORDERED}
                           AND window_start <= created_at <= window_end
      complaint_component = round_half_up(min(100.0, COMPLAINT_SCALE * count(open_complaints)), 2)
      rodent_index = round_half_up(BAIT_WEIGHT * bait_component
                                   + SIGN_WEIGHT * sign_component
                                   + COMPLAINT_WEIGHT * complaint_component, 2)
      posture = HOTSPOT  if rodent_index >= POSTURE_HOTSPOT_THRESHOLD
                else ELEVATED if rodent_index >= POSTURE_ELEVATED_THRESHOLD
                else NORMAL
    input_set: "Readings of stations currently in status ACTIVE or DAMAGED (a station that reaches REMOVED drops all of its historical readings out of the input set) whose reading_at falls in the closed 30-day window, plus open complaints in the zone created inside the same closed window"
    constants:
      SURVEILLANCE_WINDOW_DAYS: 30
      SIGN_SCALE: 12.5
      COMPLAINT_SCALE: 20.0
      BAIT_WEIGHT: 0.50
      SIGN_WEIGHT: 0.30
      COMPLAINT_WEIGHT: 0.20
      POSTURE_ELEVATED_THRESHOLD: 40.00
      POSTURE_HOTSPOT_THRESHOLD: 70.00
    precision: "2 decimal places, round_half_up; each component is rounded before the weighted sum is taken, and the weighted sum is rounded again"

  - name: abatement_compliance_deadline
    trigger: "On POST /vector-control/notices/{id}/service-result whenever the service moves the order into SERVED, and on POST /vector-control/abatement-orders/{id}/extend"
    algorithm: interval_merge
    formula: |
      base_days = ABATEMENT_BASE_COMPLIANCE_DAYS
      if order.infestation_tier_at_issue == SEVERE:
          base_days = min(base_days, ABATEMENT_SEVERE_COMPLIANCE_DAYS)
      if zone.posture == HOTSPOT at the moment of service:
          base_days = min(base_days, ABATEMENT_HOTSPOT_COMPLIANCE_DAYS)
      if order.escalation_level >= 1:
          base_days = min(base_days, ABATEMENT_ESCALATED_COMPLIANCE_DAYS)
      compliance_deadline = notice.served_at + base_days days
      # extension leg
      compliance_deadline = compliance_deadline + extension_days days   # granted at most MAX_EXTENSIONS_PER_ORDER times
    input_set: "One AbatementOrder, the OwnerNotice whose service triggered the transition, and the containing Zone's posture read at service time"
    constants:
      ABATEMENT_BASE_COMPLIANCE_DAYS: 14
      ABATEMENT_SEVERE_COMPLIANCE_DAYS: 7
      ABATEMENT_HOTSPOT_COMPLIANCE_DAYS: 5
      ABATEMENT_ESCALATED_COMPLIANCE_DAYS: 7
      EXTENSION_MAX_DAYS: 14
      MAX_EXTENSIONS_PER_ORDER: 1
      ESCALATION_MAX_LEVEL: 2
    precision: "ISO 8601 UTC with three fractional digits; the time-of-day of served_at is preserved exactly"

  - name: cost_recovery_invoice_total
    trigger: "ESTIMATE runs on POST /vector-control/cost-recovery-invoices; FINAL runs on POST /vector-control/cost-recovery-invoices/{id}/approve"
    algorithm: tiered_pricing
    formula: |
      # ---- variant-specific inputs ---------------------------------------
      # ESTIMATE: labor_hours = ESTIMATED_LABOR_HOURS[order.infestation_tier_at_issue]
      #           materials   = MATERIALS_ESTIMATE_CENTS[order.infestation_tier_at_issue]
      # FINAL   : labor_hours = order.actual_labor_hours
      #           materials   = order.actual_materials_cents
      #
      # ---- pinned evaluation order (steps 1..11, no step may be reordered) -
      1  labor_line_cents        = round_half_up(labor_hours * LABOR_RATE_CENTS_PER_HOUR)
      2  materials_line_cents    = materials
      3  subtotal_cents          = labor_line_cents + materials_line_cents
      4  penalty_line_cents      = round_half_up(subtotal_cents * (PENALTY_MULTIPLIER[order.escalation_level] - 1.0))
      5  education_credit_cents  = round_half_up(subtotal_cents * EDUCATION_CREDIT_RATE)
                                     if order.education_advisory_served == true else 0
      6  fee_base_cents          = subtotal_cents + penalty_line_cents - education_credit_cents
      7  admin_fee_cents         = round_half_up(fee_base_cents * ADMIN_FEE_RATE)
      8  pre_discount_total_cents = fee_base_cents + admin_fee_cents
      9  hardship_rate           = HARDSHIP_RATE_HIGH if (owner.hardship_certified
                                        and pre_discount_total_cents >= HARDSHIP_TIER_HIGH_MIN_CENTS)
                                   else HARDSHIP_RATE_LOW if (owner.hardship_certified
                                        and pre_discount_total_cents >= HARDSHIP_TIER_LOW_MIN_CENTS)
                                   else 0.00
      10 hardship_discount_cents = round_half_up(subtotal_cents * hardship_rate)
      11 total_cents             = pre_discount_total_cents - hardship_discount_cents
      #
      # ROUNDING ORDER IS PINNED: every line in steps 1, 4, 5, 7 and 10 is rounded to whole
      # cents with round_half_up BEFORE it enters any later step. Summing the unrounded
      # products first and rounding the total once is explicitly WRONG and yields a
      # different number of cents.
      #
      # THE DISCOUNT TIER IS KEYED ON pre_discount_total_cents (step 8), which already
      # contains the administrative fee, while the discount itself is applied to
      # subtotal_cents (step 3) and the administrative fee is NEVER recomputed after the
      # discount. Keying the tier on subtotal_cents instead changes the result.
    input_set: "One AbatementOrder in status CITY_ABATED, the PropertyOwner of its property, and the tier recorded on the order at issuance; no other order or invoice participates"
    constants:
      LABOR_RATE_CENTS_PER_HOUR: 8525
      ESTIMATED_LABOR_HOURS_LOW: 2
      ESTIMATED_LABOR_HOURS_MODERATE: 4
      ESTIMATED_LABOR_HOURS_SEVERE: 8
      MATERIALS_ESTIMATE_CENTS_LOW: 5000
      MATERIALS_ESTIMATE_CENTS_MODERATE: 12000
      MATERIALS_ESTIMATE_CENTS_SEVERE: 25000
      PENALTY_MULTIPLIER_LEVEL_0: 1.00
      PENALTY_MULTIPLIER_LEVEL_1: 1.25
      PENALTY_MULTIPLIER_LEVEL_2: 1.50
      EDUCATION_CREDIT_RATE: 0.10
      ADMIN_FEE_RATE: 0.15
      HARDSHIP_TIER_HIGH_MIN_CENTS: 100000
      HARDSHIP_RATE_HIGH: 0.10
      HARDSHIP_TIER_LOW_MIN_CENTS: 50000
      HARDSHIP_RATE_LOW: 0.05
      APPROVAL_LIMIT_CENTS: 500000
      INVOICE_DUE_DAYS: 30
      LIEN_MIN_BALANCE_CENTS: 25000
      LIEN_MIN_DAYS_PAST_DUE: 60
    precision: "Whole cents; every intermediate line rounded with round_half_up in the order given above"
    variants:
      - name: ESTIMATE
        when: "Computed at invoice creation and stored in estimated_total_cents; it is what the owner sees on the pre-bill"
        difference: "Uses the tier-standard labor hours and tier-standard material allowance instead of the crew's recorded actuals, so the same order yields a different number of cents than the FINAL run"
      - name: FINAL
        when: "Computed at approval and stored in final_total_cents together with the six line fields; it is the amount that enters balance_due_cents"
        difference: "Uses order.actual_labor_hours and order.actual_materials_cents recorded at city abatement; the estimated_total_cents value is left untouched so both numbers stay observable on the same row"

  - name: owner_outstanding_balance
    trigger: "On invoice approval, on every payment, and on every void"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = sum(i.balance_due_cents
                                      for i in CostRecoveryInvoice
                                      where i.owner_id == owner.id
                                        and i.billing_status IN {APPROVED, PARTIALLY_PAID})
      lifetime_paid_cents       = sum(i.amount_paid_cents
                                      for i in CostRecoveryInvoice
                                      where i.owner_id == owner.id
                                        and i.billing_status IN {APPROVED, PARTIALLY_PAID, PAID})
    input_set: "Every CostRecoveryInvoice of the owner whose billing_status is APPROVED or PARTIALLY_PAID; DRAFT, PAID and VOID invoices contribute 0 to outstanding_balance_cents"
    constants: {}
    precision: "Whole cents; the aggregate is recomputed from scratch after each mutation, never patched incrementally"

  - name: zone_open_case_count
    trigger: "On complaint intake, on every complaint status change, on property chronic_flag flips and on bait-station status changes"
    algorithm: aggregation
    formula: |
      open_complaint_count   = count(c for c in Complaint
                                     where c.zone_id == zone.id
                                       and c.status NOT IN {CLOSED_NO_VIOLATION, CLOSED_RESOLVED,
                                                            CLOSED_WITHDRAWN, CLOSED_DUPLICATE})
      chronic_property_count = count(p for p in Property where p.zone_id == zone.id and p.chronic_flag == true)
      active_station_count   = count(s for s in BaitStation
                                     where s.zone_id == zone.id and s.status IN {ACTIVE, DAMAGED})
    input_set: "All complaints, properties and bait stations whose zone_id equals this zone, with the status filters given above; no time window applies to these three counters"
    constants: {}
    precision: "Integer counts, recomputed from scratch after each mutation"

program_constants:
  CLOCK_DEFAULT_UTC: "2026-05-01T00:00:00Z"
  DUPLICATE_COMPLAINT_WINDOW_HOURS: 48
  OFFICER_TRAVEL_BUFFER_MINUTES: 30
  INSPECTION_MIN_DURATION_MINUTES: 30
  INSPECTION_MAX_DURATION_MINUTES: 240
  READING_MIN_INTERVAL_HOURS: 24
  MAX_ASSESSMENTS_PER_INSPECTION: 1
  MAX_NON_VOID_INVOICES_PER_ORDER: 1
  MAX_EXTENSIONS_PER_ORDER: 1
  EXTENSION_MAX_DAYS: 14
  EXTENSION_MIN_DAYS: 1
  ESCALATION_MAX_LEVEL: 2
  CHRONIC_THRESHOLD: 60.00
  POSTURE_ELEVATED_THRESHOLD: 40.00
  POSTURE_HOTSPOT_THRESHOLD: 70.00
  APPROVAL_LIMIT_CENTS: 500000
  INVOICE_DUE_DAYS: 30
  LIEN_MIN_BALANCE_CENTS: 25000
  LIEN_MIN_DAYS_PAST_DUE: 60

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every resource referenced by the path and then every resource referenced in the body exists, validated left-to-right (path first, then body fields in the order they are listed in the endpoint input)"
    error_id: ERR_ZONE_NOT_FOUND | ERR_OWNER_NOT_FOUND | ERR_PROPERTY_NOT_FOUND | ERR_OFFICER_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_NOTICE_NOT_FOUND | ERR_STATION_NOT_FOUND | ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints that take a path id or a foreign key in the body"

  - priority: 4
    category: auth
    check: "An entity-backed role may only act on its own resources: a PropertyOwner's X-User-ID must equal the owner_id of the property or invoice being touched; an Inspector's X-User-ID must equal Inspection.officer_id on start, complete and assessment writes"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /complaints, POST /inspections/{id}/start, POST /inspections/{id}/complete, POST /inspections/{id}/assessments, POST /cost-recovery-invoices/{id}/payments, GET /property-owners/{id}, GET /properties/{id}, GET /cost-recovery-invoices/{id}"

  - priority: 5
    category: business_constraint
    check: "Request body conforms to the endpoint schema: required fields present, enum members valid, integers within the declared ranges (score fields 0-10, take_pct 0-100, unit_count >= 1, amount_cents > 0, extension_days integer), scheduled_end strictly after scheduled_start with a duration between 30 and 240 minutes inclusive, and required_actions non-empty"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 6
    category: state
    check: "The OCC field carries the parent's current version: expected_property_version == Property.version on order creation, expected_abatement_order_version == AbatementOrder.version on invoice creation"
    error_id: ERR_STALE_PROPERTY_VERSION | ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /abatement-orders, POST /cost-recovery-invoices"

  - priority: 7
    category: state
    check: "The target resource itself is in a status that permits the operation (see state_machines); a REMOVED bait station rejects readings, an already-served notice rejects a second service result, an unapproved invoice rejects payments and liens"
    error_id: ERR_INVALID_STATE | ERR_STATION_DECOMMISSIONED | ERR_NOTICE_ALREADY_SERVED | ERR_INVOICE_NOT_APPROVED
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: state
    check: "The related entity referenced by the request is in the state this operation requires: an INITIAL inspection needs Complaint.status == TRIAGED; an abatement order needs an Inspection that is COMPLETED and whose result is VIOLATION_FOUND; a REINSPECTION needs AbatementOrder.status == SERVED; a cost-recovery invoice needs AbatementOrder.status == CITY_ABATED"
    error_id: ERR_COMPLAINT_NOT_TRIAGED | ERR_INSPECTION_NOT_COMPLETED | ERR_NO_VIOLATION_FOUND | ERR_ORDER_NOT_SERVED | ERR_ORDER_NOT_ABATED
    http_status: 409
    applies_to: "POST /inspections, POST /abatement-orders, POST /cost-recovery-invoices"

  - priority: 9
    category: business_safety
    check: "Segregation of duties and certification currency: the issuing Supervisor's X-User-ID must differ from the inspecting officer; a re-inspection officer must differ from the officer of the order's originating inspection; an invoice approver's X-User-ID must differ from prepared_by_user_id; an officer starting an inspection must hold certification whose certification_expires_at is strictly after the current logical clock"
    error_id: ERR_SEGREGATION_OF_DUTIES | ERR_REINSPECTION_SAME_OFFICER | ERR_SELF_APPROVAL_FORBIDDEN | ERR_CERTIFICATION_EXPIRED
    http_status: 422
    applies_to: "POST /abatement-orders, POST /inspections, POST /cost-recovery-invoices/{id}/approve, POST /inspections/{id}/start"

  - priority: 10
    category: business_constraint
    check: "Uniqueness, sequencing and required-artifact rules: no second open complaint of the same complaint_type on the same property within DUPLICATE_COMPLAINT_WINDOW_HOURS (48); at most one Assessment per inspection; a VIOLATION_FOUND completion requires an Assessment; the result enum must match the inspection kind; the first notice on an order must be ABATEMENT_ORDER and FINAL_WARNING is only allowed while the order is ESCALATED; at most one non-VOID invoice per order; escalation_level saturates at ESCALATION_MAX_LEVEL (2); at most MAX_EXTENSIONS_PER_ORDER (1) extension per order; zone code, officer badge_number, property parcel_number and per-property station_code are unique"
    error_id: ERR_DUPLICATE_COMPLAINT | ERR_ASSESSMENT_ALREADY_EXISTS | ERR_ASSESSMENT_REQUIRED | ERR_RESULT_KIND_MISMATCH | ERR_NOTICE_SEQUENCE_INVALID | ERR_INVOICE_ALREADY_EXISTS | ERR_EXTENSION_LIMIT_REACHED | ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /complaints, POST /inspections/{id}/assessments, POST /inspections/{id}/complete, POST /abatement-orders/{id}/notices, POST /abatement-orders/{id}/extend, POST /cost-recovery-invoices, POST /zones, POST /officers, POST /properties, POST /bait-stations"

  - priority: 11
    category: business_temporal
    check: "Officer availability: the requested window must not collide with any other SCHEDULED or IN_PROGRESS inspection of the same officer, where a collision means new.scheduled_start <= other.scheduled_end + OFFICER_TRAVEL_BUFFER_MINUTES AND other.scheduled_start <= new.scheduled_end + OFFICER_TRAVEL_BUFFER_MINUTES (closed comparison on both ends, 30-minute travel buffer, so exactly back-to-back windows collide)"
    error_id: ERR_OFFICER_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /inspections"

  - priority: 12
    category: business_temporal
    check: "Site and window rules: the requested window must not overlap another SCHEDULED or IN_PROGRESS inspection on the same property, where an overlap means new.scheduled_start < other.scheduled_end AND other.scheduled_start < new.scheduled_end (half-open, no buffer, so touching windows are allowed); a REINSPECTION may not start before order.compliance_deadline; a station reading may not be recorded within READING_MIN_INTERVAL_HOURS (24) of that station's last_reading_at; an extension must be between 1 and EXTENSION_MAX_DAYS (14) days; a city abatement of a SERVED order may not be recorded before its compliance_deadline"
    error_id: ERR_PROPERTY_INSPECTION_OVERLAP | ERR_REINSPECTION_TOO_EARLY | ERR_READING_TOO_SOON | ERR_EXTENSION_WINDOW_EXCEEDED | ERR_DEADLINE_NOT_PASSED
    http_status: 409
    applies_to: "POST /inspections, POST /bait-stations/{id}/readings, POST /abatement-orders/{id}/extend, POST /abatement-orders/{id}/city-abate"

  - priority: 13
    category: business_referential
    check: "A complaint may not be closed while any AbatementOrder on the same property is still in a non-terminal status (ISSUED, SERVED, REINSPECTION_SCHEDULED, ESCALATED, CITY_ABATED); the parcel must be clear of live enforcement before any of its complaints can be closed administratively"
    error_id: ERR_OPEN_ORDER_EXISTS
    http_status: 409
    applies_to: "POST /complaints/{id}/close"

  - priority: 14
    category: business_fiscal
    check: "Money limits: a payment may not exceed balance_due_cents; an invoice whose final_total_cents exceeds APPROVAL_LIMIT_CENTS (500000) needs escalated_approval == true; a lien needs balance_due_cents >= LIEN_MIN_BALANCE_CENTS (25000) and the clock at or past due_at + LIEN_MIN_DAYS_PAST_DUE (60 days)"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE | ERR_APPROVAL_LIMIT_EXCEEDED | ERR_LIEN_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /cost-recovery-invoices/{id}/payments, POST /cost-recovery-invoices/{id}/approve, POST /cost-recovery-invoices/{id}/lien"

endpoints:
  - method: POST
    path: "/vector-control/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-05-01T00:00:00Z and never falls back to real wall-clock time. Every created_at, updated_at, served_at, reading_at, deadline and window comparison in this API reads this clock."
    roles: [ProgramAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: datetime, previous_utc: datetime }
    side_effects: ["logical clock moves to to_iso8601; no entity is mutated and no recompute is triggered"]

  - method: POST
    path: "/vector-control/zones"
    description: "Create a surveillance zone"
    roles: [ProgramAdmin]
    code: 201
    input: ["name", "code", "population_density_per_sqkm"]
    output: Zone
    side_effects: ["zone created with posture NORMAL, rodent_index 0.00 and all counters 0"]

  - method: GET
    path: "/vector-control/zones/{id}"
    description: "Read one zone including its derived posture and counters"
    roles: [ProgramAdmin, Supervisor, Inspector, IntakeClerk, FinanceOfficer]
    code: 200
    input: []
    output: Zone
    side_effects: []

  - method: GET
    path: "/vector-control/zones/{id}/surveillance-summary"
    description: "Computed read: recomputes calculation zone_rodent_index for the zone against the current logical clock and returns every component of the composite index"
    roles: [ProgramAdmin, Supervisor, Inspector]
    code: 200
    input: []
    output: { zone_id: string, rodent_index: number, posture: string, bait_component: number, sign_component: number, complaint_component: number, in_window_reading_count: integer, eligible_station_count: integer, open_complaint_count: integer, window_start: datetime, window_end: datetime }
    side_effects: ["Zone.rodent_index, Zone.posture and Zone.last_index_recomputed_at are refreshed from the recompute"]

  - method: POST
    path: "/vector-control/property-owners"
    description: "Register a property owner of record"
    roles: [ProgramAdmin]
    code: 201
    input: ["full_name", "email", "mailing_address", "notice_preference?", "hardship_certified?"]
    output: PropertyOwner
    side_effects: ["owner created with outstanding_balance_cents 0 and lifetime_paid_cents 0"]

  - method: GET
    path: "/vector-control/property-owners/{id}"
    description: "Read one owner including the aggregated outstanding balance"
    roles: [ProgramAdmin, Supervisor, FinanceOfficer, PropertyOwner]
    code: 200
    input: []
    output: PropertyOwner
    side_effects: []

  - method: POST
    path: "/vector-control/properties"
    description: "Register a parcel inside a zone"
    roles: [ProgramAdmin]
    code: 201
    input: ["zone_id", "owner_id", "address_line", "parcel_number", "property_type", "unit_count?"]
    output: Property
    side_effects: ["property created with version 1, chronic_score 0.00, provisional_chronic_score 0.00 and chronic_flag false"]

  - method: GET
    path: "/vector-control/properties/{id}"
    description: "Read one parcel including its chronic scores, open_order_count, lien_encumbered flag and current version"
    roles: [ProgramAdmin, Supervisor, Inspector, IntakeClerk, FinanceOfficer, PropertyOwner]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/vector-control/properties"
    description: "List parcels, filterable by zone and by owner"
    roles: [ProgramAdmin, Supervisor, Inspector, IntakeClerk, FinanceOfficer]
    code: 200
    input: ["zone_id?", "owner_id?", "chronic_flag?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  - method: POST
    path: "/vector-control/officers"
    description: "Register a program officer; the returned id is the X-User-ID an Inspector or Supervisor presents"
    roles: [ProgramAdmin]
    code: 201
    input: ["full_name", "badge_number", "rank", "certification_expires_at"]
    output: Officer
    side_effects: ["officer created with active_assignment_count 0"]

  - method: POST
    path: "/vector-control/complaints"
    description: "Intake a vector or rodent complaint against a parcel"
    roles: [IntakeClerk, PropertyOwner]
    code: 201
    input: ["property_id", "complaint_type", "reporter_type", "description", "reporter_name?", "reporter_phone?", "reported_severity?"]
    output: Complaint
    side_effects:
      - "complaint created in RECEIVED with zone_id copied from the property"
      - "severity := reported_severity; priority_score computed by calculation complaint_priority_score; response_due_at computed by calculation complaint_response_deadline"
      - "Zone.open_complaint_count += 1 and Zone.rodent_index / Zone.posture recomputed by calculation zone_rodent_index"

  - method: GET
    path: "/vector-control/complaints/{id}"
    description: "Read one complaint"
    roles: [ProgramAdmin, Supervisor, Inspector, IntakeClerk, PropertyOwner]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: GET
    path: "/vector-control/complaints"
    description: "List complaints, filterable by property, zone and status"
    roles: [ProgramAdmin, Supervisor, Inspector, IntakeClerk]
    code: 200
    input: ["property_id?", "zone_id?", "status?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []

  - method: POST
    path: "/vector-control/complaints/{id}/triage"
    description: "Supervisor triage: confirm or override severity (one of ROUTINE, HIGH, CRITICAL) and re-derive dispatch priority and the response deadline"
    roles: [Supervisor]
    code: 200
    input: ["severity", "triage_notes?"]
    output: Complaint
    side_effects:
      - "status RECEIVED -> TRIAGED; triaged_at stamped"
      - "severity auto-escalated ROUTINE -> HIGH when Zone.posture == HOTSPOT"
      - "priority_score and response_due_at recomputed, the deadline still measured from created_at"

  - method: POST
    path: "/vector-control/complaints/{id}/close"
    description: "Close a complaint administratively. closure_reason accepts only WITHDRAWN or DUPLICATE here; NO_VIOLATION and RESOLVED are written by system transitions and are rejected as input with ERR_VALIDATION."
    roles: [Supervisor]
    code: 200
    input: ["closure_reason", "note?"]
    output: Complaint
    side_effects:
      - "status -> CLOSED_WITHDRAWN or CLOSED_DUPLICATE; closure_reason and closed_at stamped"
      - "Zone.open_complaint_count -= 1 and Zone.rodent_index / Zone.posture recomputed"

  - method: POST
    path: "/vector-control/inspections"
    description: "Schedule an inspection visit: an INITIAL visit against a triaged complaint, or a REINSPECTION against a served abatement order"
    roles: [Supervisor]
    code: 201
    input: ["kind", "officer_id", "scheduled_start", "scheduled_end", "complaint_id?", "abatement_order_id?"]
    output: Inspection
    side_effects:
      - "inspection created in SCHEDULED with property_id copied from the parent complaint or order"
      - "Officer.active_assignment_count += 1"
      - "when kind == INITIAL: Complaint TRIAGED -> INSPECTION_SCHEDULED"
      - "when kind == REINSPECTION: AbatementOrder SERVED -> REINSPECTION_SCHEDULED"

  - method: GET
    path: "/vector-control/inspections/{id}"
    description: "Read one inspection"
    roles: [ProgramAdmin, Supervisor, Inspector, IntakeClerk]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: GET
    path: "/vector-control/inspections"
    description: "List inspections, filterable by complaint, abatement order, property, officer and status"
    roles: [ProgramAdmin, Supervisor, Inspector, IntakeClerk]
    code: 200
    input: ["complaint_id?", "abatement_order_id?", "property_id?", "officer_id?", "status?", "kind?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: POST
    path: "/vector-control/inspections/{id}/start"
    description: "Assigned officer starts the visit; rejected when the officer's certification has expired"
    roles: [Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status SCHEDULED -> IN_PROGRESS; started_at stamped"]

  - method: POST
    path: "/vector-control/inspections/{id}/assessments"
    description: "Record the harborage / attractant / sanitation assessment for an in-progress visit"
    roles: [Inspector]
    code: 201
    input: ["harborage_score", "attractant_score", "sanitation_score", "burrow_count", "evidence_photo_count?", "recommended_actions?"]
    output: Assessment
    side_effects:
      - "assessment created with infestation_index and infestation_tier from calculation assessment_infestation_index"
      - "Property.provisional_chronic_score := this assessment's infestation_index (PROVISIONAL variant of calculation property_chronic_score); Property.chronic_flag is NOT touched"

  - method: GET
    path: "/vector-control/inspections/{id}/assessments"
    description: "List the assessments recorded during a visit (zero or one)"
    roles: [ProgramAdmin, Supervisor, Inspector]
    code: 200
    input: ["limit?", "offset?"]
    output: Assessment[]
    side_effects: []

  - method: POST
    path: "/vector-control/inspections/{id}/complete"
    description: "Close out the visit with its result; this is the entry point of the inspection completion cascade"
    roles: [Inspector]
    code: 200
    input: ["result", "notes?"]
    output: Inspection
    side_effects:
      - "status IN_PROGRESS -> COMPLETED; completed_at stamped; Officer.active_assignment_count -= 1; Property.last_inspection_at updated"
      - "INITIAL + VIOLATION_FOUND: Complaint -> INSPECTED, then Property.chronic_score recomputed with the REVIEWED variant and Property.version bumped, then (only on a false -> true chronic_flag flip) Zone.chronic_property_count += 1 with Zone.rodent_index / Zone.posture recomputed"
      - "INITIAL + NO_VIOLATION: Complaint -> CLOSED_NO_VIOLATION and Zone.open_complaint_count -= 1"
      - "INITIAL + NO_ACCESS: Complaint -> TRIAGED"
      - "REINSPECTION + COMPLIANT: AbatementOrder -> COMPLIED, Property.open_order_count -= 1, Complaint -> CLOSED_RESOLVED, Zone.open_complaint_count -= 1"
      - "REINSPECTION + NON_COMPLIANT: AbatementOrder -> ESCALATED with escalation_level += 1 and AbatementOrder.version bumped by 1"
      - "REINSPECTION + NO_ACCESS: AbatementOrder -> SERVED with compliance_deadline unchanged"

  - method: POST
    path: "/vector-control/abatement-orders"
    description: "Issue an abatement order from a completed inspection that found a violation; the issuing Supervisor may not be the inspecting officer"
    roles: [Supervisor]
    code: 201
    input: ["inspection_id", "required_actions", "expected_property_version"]
    output: AbatementOrder
    side_effects:
      - "order created in ISSUED with escalation_level 0, infestation_tier_at_issue copied from the inspection's assessment and issued_by_officer_id set from X-User-ID"
      - "Complaint INSPECTED -> ABATEMENT_ORDERED"
      - "Property.open_order_count += 1 and increments Property.version by 1"

  - method: GET
    path: "/vector-control/abatement-orders/{id}"
    description: "Read one abatement order including its current version, deadline and escalation level"
    roles: [ProgramAdmin, Supervisor, Inspector, IntakeClerk, FinanceOfficer, PropertyOwner]
    code: 200
    input: []
    output: AbatementOrder
    side_effects: []

  - method: GET
    path: "/vector-control/abatement-orders"
    description: "List abatement orders, filterable by property, originating inspection, issuing officer and status"
    roles: [ProgramAdmin, Supervisor, Inspector, IntakeClerk, FinanceOfficer]
    code: 200
    input: ["property_id?", "inspection_id?", "issued_by_officer_id?", "status?", "limit?", "offset?"]
    output: AbatementOrder[]
    side_effects: []

  - method: POST
    path: "/vector-control/abatement-orders/{id}/notices"
    description: "Generate an owner notice for an order: the statutory ABATEMENT_ORDER notice, an EDUCATIONAL_ADVISORY packet, a FINAL_WARNING or a LIEN_INTENT notice"
    roles: [IntakeClerk, Supervisor]
    code: 201
    input: ["notice_type", "delivery_method"]
    output: OwnerNotice
    side_effects: ["notice created in PENDING_SERVICE with recipient_address copied from the owner and sent_at stamped"]

  - method: GET
    path: "/vector-control/abatement-orders/{id}/notices"
    description: "List the notices generated for an order"
    roles: [ProgramAdmin, Supervisor, IntakeClerk, FinanceOfficer, PropertyOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: OwnerNotice[]
    side_effects: []

  - method: POST
    path: "/vector-control/notices/{id}/service-result"
    description: "Record the process server's outcome; DELIVERED and REFUSED both count as good service"
    roles: [IntakeClerk]
    code: 200
    input: ["service_outcome"]
    output: OwnerNotice
    side_effects:
      - "notice PENDING_SERVICE -> SERVED (DELIVERED, REFUSED) or -> UNDELIVERABLE"
      - "ABATEMENT_ORDER served: order ISSUED -> SERVED with compliance_deadline from calculation abatement_compliance_deadline and AbatementOrder.version bumped by 1"
      - "FINAL_WARNING served: order ESCALATED -> SERVED with a recomputed, shorter deadline and AbatementOrder.version bumped by 1"
      - "EDUCATIONAL_ADVISORY served: order.education_advisory_served := true and AbatementOrder.version bumped by 1"

  - method: POST
    path: "/vector-control/abatement-orders/{id}/extend"
    description: "Grant the owner one deadline extension of 1 to 14 days"
    roles: [Supervisor]
    code: 200
    input: ["extension_days", "reason"]
    output: AbatementOrder
    side_effects:
      - "compliance_deadline += extension_days days; extension_count += 1; extension_days_total += extension_days"
      - "increments AbatementOrder.version by 1"

  - method: POST
    path: "/vector-control/abatement-orders/{id}/city-abate"
    description: "Record that the city crew abated the nuisance itself, capturing the actual labor hours and materials that cost recovery will bill. Allowed from ESCALATED at any time, and from SERVED once the compliance_deadline has passed."
    roles: [Supervisor]
    code: 200
    input: ["actual_labor_hours", "actual_materials_cents", "crew_notes?"]
    output: AbatementOrder
    side_effects:
      - "order ESCALATED -> CITY_ABATED or SERVED -> CITY_ABATED; abated_at stamped; actuals stored"
      - "increments AbatementOrder.version by 1"

  - method: POST
    path: "/vector-control/bait-stations"
    description: "Install a bait station on a parcel"
    roles: [Inspector]
    code: 201
    input: ["property_id", "station_code", "bait_type"]
    output: BaitStation
    side_effects:
      - "station created in ACTIVE with zone_id copied from the property and installed_at stamped"
      - "Zone.active_station_count += 1"

  - method: GET
    path: "/vector-control/bait-stations/{id}"
    description: "Read one bait station"
    roles: [ProgramAdmin, Supervisor, Inspector]
    code: 200
    input: []
    output: BaitStation
    side_effects: []

  - method: GET
    path: "/vector-control/bait-stations"
    description: "List bait stations, filterable by property, zone and status"
    roles: [ProgramAdmin, Supervisor, Inspector]
    code: 200
    input: ["property_id?", "zone_id?", "status?", "limit?", "offset?"]
    output: BaitStation[]
    side_effects: []

  - method: POST
    path: "/vector-control/bait-stations/{id}/readings"
    description: "Record a servicing visit on a station: bait take, activity signs and the station's physical condition"
    roles: [Inspector]
    code: 201
    input: ["take_pct", "activity_sign_count", "station_condition", "rebaited?"]
    output: SurveillanceReading
    side_effects:
      - "reading appended with reading_at from the logical clock; station.last_reading_at, reading_count and cumulative_take_pct updated"
      - "station status follows station_condition: DAMAGED -> DAMAGED, INTACT -> ACTIVE, MISSING -> REMOVED"
      - "Zone.rodent_index and Zone.posture recomputed by calculation zone_rodent_index"

  - method: GET
    path: "/vector-control/bait-stations/{id}/readings"
    description: "List the surveillance readings recorded on a station"
    roles: [ProgramAdmin, Supervisor, Inspector]
    code: 200
    input: ["limit?", "offset?"]
    output: SurveillanceReading[]
    side_effects: []

  - method: POST
    path: "/vector-control/cost-recovery-invoices"
    description: "Prepare a cost-recovery invoice for a city-abated order; the ESTIMATE variant of the total is computed here"
    roles: [FinanceOfficer]
    code: 201
    input: ["abatement_order_id", "expected_abatement_order_version"]
    output: CostRecoveryInvoice
    side_effects:
      - "invoice created in billing_status DRAFT and lien_status NONE with prepared_by_user_id from X-User-ID"
      - "estimated_total_cents written by the ESTIMATE variant of calculation cost_recovery_invoice_total"
      - "increments AbatementOrder.version by 1"

  - method: GET
    path: "/vector-control/cost-recovery-invoices/{id}"
    description: "Read one invoice including every computed line"
    roles: [ProgramAdmin, Supervisor, FinanceOfficer, PropertyOwner]
    code: 200
    input: []
    output: CostRecoveryInvoice
    side_effects: []

  - method: GET
    path: "/vector-control/cost-recovery-invoices"
    description: "List invoices, filterable by order, property, owner and status axes"
    roles: [ProgramAdmin, Supervisor, FinanceOfficer]
    code: 200
    input: ["abatement_order_id?", "property_id?", "owner_id?", "billing_status?", "lien_status?", "limit?", "offset?"]
    output: CostRecoveryInvoice[]
    side_effects: []

  - method: POST
    path: "/vector-control/cost-recovery-invoices/{id}/approve"
    description: "Approve and issue the invoice; the FINAL variant of the total is computed here and the approver may not be the preparer"
    roles: [ProgramAdmin]
    code: 200
    input: ["escalated_approval?"]
    output: CostRecoveryInvoice
    side_effects:
      - "billing_status DRAFT -> APPROVED; approved_by_user_id set from X-User-ID"
      - "final_total_cents and the six line fields written by the FINAL variant of calculation cost_recovery_invoice_total"
      - "balance_due_cents := final_total_cents; due_at := clock + 30 days; PropertyOwner.outstanding_balance_cents recomputed"

  - method: POST
    path: "/vector-control/cost-recovery-invoices/{id}/payments"
    description: "Post a payment against an approved invoice; a payment that clears the balance starts the settlement cascade. amount_cents must be a positive integer and method is one of CHECK, ACH, CARD, CASH."
    roles: [FinanceOfficer, PropertyOwner]
    code: 200
    input: ["amount_cents", "method"]
    output: CostRecoveryInvoice
    side_effects:
      - "amount_paid_cents += amount_cents; balance_due_cents -= amount_cents; billing_status -> PARTIALLY_PAID or PAID"
      - "PropertyOwner.outstanding_balance_cents and lifetime_paid_cents recomputed"
      - "on PAID: lien_status FILED -> RELEASED, then AbatementOrder CITY_ABATED -> CLOSED, then Complaint ABATEMENT_ORDERED -> CLOSED_RESOLVED, then Zone.open_complaint_count -= 1 with the zone index recomputed"

  - method: POST
    path: "/vector-control/cost-recovery-invoices/{id}/lien"
    description: "File a lien on the parcel for an unpaid, past-due invoice"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: CostRecoveryInvoice
    side_effects:
      - "lien_status NONE -> FILED; lien_filed_at stamped"
      - "Property.lien_encumbered := true and Property.version bumped by 1"

  - method: POST
    path: "/vector-control/cost-recovery-invoices/{id}/void"
    description: "Void an invoice; this is the compensating action for approval and must leave the owner's outstanding balance exactly as it was before approval"
    roles: [FinanceOfficer]
    code: 200
    input: ["void_reason"]
    output: CostRecoveryInvoice
    side_effects:
      - "billing_status -> VOID; voided_at stamped; balance_due_cents := 0"
      - "PropertyOwner.outstanding_balance_cents recomputed (the voided remainder leaves the balance)"
      - "lien_status FILED -> RELEASED and Property.lien_encumbered recomputed"

  - method: GET
    path: "/vector-control/reports/program-summary"
    description: "Program reporting roll-up across complaints, orders and cost recovery, optionally narrowed to one zone"
    roles: [ProgramAdmin, Supervisor]
    code: 200
    input: ["zone_id?"]
    output: { complaint_total: integer, complaint_open: integer, complaint_closed_resolved: integer, orders_issued: integer, orders_complied: integer, orders_city_abated: integer, chronic_property_count: integer, hotspot_zone_count: integer, invoiced_cents: integer, collected_cents: integer, outstanding_cents: integer, liens_filed: integer }
    side_effects: []

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed on the endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed role acts on a resource it does not own: a PropertyOwner on another owner's parcel or invoice, an Inspector on an inspection assigned to a different officer"
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, unknown enum member, value out of the declared range, empty required_actions, or an inspection window whose end is not strictly after its start or whose duration is outside 30-240 minutes"
  - id: ERR_ZONE_NOT_FOUND
    http: 404
    condition: "zone_id in the path or body matches no zone"
  - id: ERR_OWNER_NOT_FOUND
    http: 404
    condition: "owner_id in the path or body matches no property owner"
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "property_id in the path or body matches no parcel"
  - id: ERR_OFFICER_NOT_FOUND
    http: 404
    condition: "officer_id in the body matches no officer"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "complaint_id in the path or body matches no complaint"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "inspection_id in the path or body matches no inspection"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "abatement order id in the path or body matches no order"
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "notice id in the path matches no owner notice"
  - id: ERR_STATION_NOT_FOUND
    http: 404
    condition: "bait station id in the path matches no station"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "invoice id in the path matches no cost-recovery invoice"
  - id: ERR_STALE_PROPERTY_VERSION
    http: 412
    condition: "expected_property_version on POST /abatement-orders does not equal the parcel's current version"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_abatement_order_version on POST /cost-recovery-invoices does not equal the order's current version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource's own status does not permit the requested transition (triage of a non-RECEIVED complaint, start of a non-SCHEDULED inspection, completion of a non-IN_PROGRESS inspection, extension of an order that is not SERVED or ESCALATED, city abatement of an order that is not ESCALATED, void of an already VOID or PAID invoice, a second lien on the same invoice)"
  - id: ERR_STATION_DECOMMISSIONED
    http: 409
    condition: "A reading is recorded against a bait station whose status is REMOVED"
  - id: ERR_NOTICE_ALREADY_SERVED
    http: 409
    condition: "A service result is recorded on a notice whose status is already SERVED or UNDELIVERABLE"
  - id: ERR_COMPLAINT_NOT_TRIAGED
    http: 409
    condition: "An INITIAL inspection is scheduled against a complaint whose status is not TRIAGED"
  - id: ERR_INSPECTION_NOT_COMPLETED
    http: 409
    condition: "An abatement order is issued from an inspection whose status is not COMPLETED"
  - id: ERR_NO_VIOLATION_FOUND
    http: 422
    condition: "An abatement order is issued from a COMPLETED inspection whose result is not VIOLATION_FOUND"
  - id: ERR_ORDER_NOT_SERVED
    http: 409
    condition: "A REINSPECTION is scheduled against an abatement order whose status is not SERVED"
  - id: ERR_ORDER_NOT_ABATED
    http: 409
    condition: "A cost-recovery invoice is prepared for an order whose status is not CITY_ABATED"
  - id: ERR_INVOICE_NOT_APPROVED
    http: 409
    condition: "A payment or a lien is attempted on an invoice whose billing_status is DRAFT, PAID or VOID"
  - id: ERR_CERTIFICATION_EXPIRED
    http: 422
    condition: "An officer starts an inspection at or after their certification_expires_at instant"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "The Supervisor issuing an abatement order has the same X-User-ID as the officer who performed the originating inspection"
  - id: ERR_REINSPECTION_SAME_OFFICER
    http: 422
    condition: "A re-inspection is assigned to the same officer who performed the order's originating inspection"
  - id: ERR_SELF_APPROVAL_FORBIDDEN
    http: 422
    condition: "The approver's X-User-ID equals the invoice's prepared_by_user_id"
  - id: ERR_DUPLICATE_COMPLAINT
    http: 409
    condition: "An open complaint of the same complaint_type already exists on the same parcel and was created within the last 48 hours"
  - id: ERR_ASSESSMENT_ALREADY_EXISTS
    http: 409
    condition: "A second assessment is recorded for the same inspection"
  - id: ERR_ASSESSMENT_REQUIRED
    http: 422
    condition: "An inspection is completed with result VIOLATION_FOUND while no assessment exists for it"
  - id: ERR_RESULT_KIND_MISMATCH
    http: 422
    condition: "result is not compatible with the inspection kind: VIOLATION_FOUND or NO_VIOLATION on a REINSPECTION, or COMPLIANT or NON_COMPLIANT on an INITIAL visit"
  - id: ERR_NOTICE_SEQUENCE_INVALID
    http: 422
    condition: "The first notice on an order is not an ABATEMENT_ORDER notice, or a FINAL_WARNING is generated while the order is not ESCALATED"
  - id: ERR_INVOICE_ALREADY_EXISTS
    http: 409
    condition: "A second non-VOID cost-recovery invoice is prepared for the same abatement order"
  - id: ERR_EXTENSION_LIMIT_REACHED
    http: 422
    condition: "A second extension is requested on an order whose extension_count is already 1"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "Zone code, officer badge_number, property parcel_number, or a station_code within the same parcel, is already taken"
  - id: ERR_OFFICER_SCHEDULE_CONFLICT
    http: 409
    condition: "The requested window collides with another SCHEDULED or IN_PROGRESS inspection of the same officer under closed-interval comparison with a 30-minute travel buffer on both ends"
  - id: ERR_PROPERTY_INSPECTION_OVERLAP
    http: 409
    condition: "The requested window overlaps another SCHEDULED or IN_PROGRESS inspection on the same parcel under half-open comparison with no buffer"
  - id: ERR_REINSPECTION_TOO_EARLY
    http: 409
    condition: "A REINSPECTION's scheduled_start is strictly before the order's compliance_deadline"
  - id: ERR_READING_TOO_SOON
    http: 409
    condition: "A reading is recorded less than 24 hours after the station's last_reading_at"
  - id: ERR_EXTENSION_WINDOW_EXCEEDED
    http: 409
    condition: "extension_days is below 1 or above EXTENSION_MAX_DAYS (14)"
  - id: ERR_DEADLINE_NOT_PASSED
    http: 409
    condition: "City abatement of a SERVED order is recorded while the current logical clock is strictly before its compliance_deadline"
  - id: ERR_OPEN_ORDER_EXISTS
    http: 409
    condition: "A complaint close is attempted while any abatement order on the same property is still non-terminal"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "amount_cents is greater than the invoice's balance_due_cents"
  - id: ERR_APPROVAL_LIMIT_EXCEEDED
    http: 422
    condition: "final_total_cents exceeds APPROVAL_LIMIT_CENTS (500000) and escalated_approval was not sent as true"
  - id: ERR_LIEN_THRESHOLD_NOT_MET
    http: 422
    condition: "A lien is requested while balance_due_cents is below 25000 cents or before due_at plus 60 days"

roles:
  - name: ProgramAdmin
    description: "Program administrator: maintains zones, parcels, owners and officers, approves cost-recovery invoices, and drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /vector-control/zones"
      - "POST /vector-control/property-owners"
      - "POST /vector-control/properties"
      - "POST /vector-control/officers"
      - "POST /vector-control/cost-recovery-invoices/{id}/approve"
      - "POST /vector-control/_clock/set_current_utc"
    shared_operations:
      - "GET /vector-control/zones/{id}"
      - "GET /vector-control/zones/{id}/surveillance-summary"
      - "GET /vector-control/properties"
      - "GET /vector-control/complaints"
      - "GET /vector-control/inspections"
      - "GET /vector-control/abatement-orders"
      - "GET /vector-control/cost-recovery-invoices"
      - "GET /vector-control/reports/program-summary"

  - name: Supervisor
    description: "Supervising officer: triages complaints, schedules inspections, issues and escalates abatement orders, grants extensions and authorises city abatement. Backed by an Officer row whose rank is SUPERVISOR."
    identity: "entity_backed:Officer"
    exclusive_operations:
      - "POST /vector-control/complaints/{id}/triage"
      - "POST /vector-control/complaints/{id}/close"
      - "POST /vector-control/inspections"
      - "POST /vector-control/abatement-orders"
      - "POST /vector-control/abatement-orders/{id}/extend"
      - "POST /vector-control/abatement-orders/{id}/city-abate"
    shared_operations:
      - "POST /vector-control/abatement-orders/{id}/notices"
      - "GET /vector-control/complaints/{id}"
      - "GET /vector-control/inspections/{id}"
      - "GET /vector-control/abatement-orders/{id}"
      - "GET /vector-control/reports/program-summary"

  - name: Inspector
    description: "Field inspector: runs inspection visits, records harborage and attractant assessments, installs bait stations and records surveillance readings. Backed by an Officer row whose rank is FIELD_INSPECTOR."
    identity: "entity_backed:Officer"
    exclusive_operations:
      - "POST /vector-control/inspections/{id}/start"
      - "POST /vector-control/inspections/{id}/complete"
      - "POST /vector-control/inspections/{id}/assessments"
      - "POST /vector-control/bait-stations"
      - "POST /vector-control/bait-stations/{id}/readings"
    shared_operations:
      - "GET /vector-control/inspections"
      - "GET /vector-control/bait-stations"
      - "GET /vector-control/bait-stations/{id}/readings"
      - "GET /vector-control/zones/{id}/surveillance-summary"

  - name: IntakeClerk
    description: "Intake and records clerk: takes complaints over the counter and by phone, generates owner notices and records service results"
    identity: "opaque"
    exclusive_operations:
      - "POST /vector-control/notices/{id}/service-result"
    shared_operations:
      - "POST /vector-control/complaints"
      - "POST /vector-control/abatement-orders/{id}/notices"
      - "GET /vector-control/complaints"
      - "GET /vector-control/abatement-orders/{id}/notices"

  - name: FinanceOfficer
    description: "Cost-recovery officer: prepares invoices, posts payments, files liens and voids invoices. Never approves an invoice they prepared."
    identity: "opaque"
    exclusive_operations:
      - "POST /vector-control/cost-recovery-invoices"
      - "POST /vector-control/cost-recovery-invoices/{id}/lien"
      - "POST /vector-control/cost-recovery-invoices/{id}/void"
    shared_operations:
      - "POST /vector-control/cost-recovery-invoices/{id}/payments"
      - "GET /vector-control/cost-recovery-invoices"
      - "GET /vector-control/property-owners/{id}"

  - name: PropertyOwner
    description: "Property owner of record: may file complaints on their own parcel, read their own parcels, orders and invoices, and pay their own invoices"
    identity: "entity_backed:PropertyOwner"
    exclusive_operations: []
    shared_operations:
      - "POST /vector-control/complaints"
      - "POST /vector-control/cost-recovery-invoices/{id}/payments"
      - "GET /vector-control/properties/{id}"
      - "GET /vector-control/property-owners/{id}"
      - "GET /vector-control/abatement-orders/{id}"
      - "GET /vector-control/cost-recovery-invoices/{id}"
