          trigger:
            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_a}", test_type: "FINAL", alpha_pct: 12.0 }, as: LabTechnician }
            - { call: "GET /api/harvest-lots/${lot_a}", payload: {}, as: FarmManager, captures: { lot_final: $.data.alpha_pct_final } }
