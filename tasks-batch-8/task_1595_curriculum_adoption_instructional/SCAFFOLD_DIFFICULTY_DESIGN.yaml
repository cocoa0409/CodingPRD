              as: CurriculumDirector
              captures: { cya: $.data.id }
            - call: "POST /adoption-cycles/${cya}/materials"
              payload: { title: "Math Text", publisher_name: "PubA" }
              as: CurriculumDirector
              captures: { ma: $.data.id }
            - call: "POST /materials/${ma}/transitions"
              payload: { to_state: VETTED }
              as: InstructionalSpecialist
            - call: "POST /materials/${ma}/alignments"
              payload: { standard_code: "S1", coverage_rating: FULL }
              as: InstructionalSpecialist
            - call: "POST /materials/${ma}/alignments"
              payload: { standard_code: "S2", coverage_rating: FULL }
              as: InstructionalSpecialist
            - call: "POST /materials/${ma}/alignments"
              payload: { standard_code: "S3", coverage_rating: FULL }
              as: InstructionalSpecialist
            - call: "POST /materials/${ma}/alignments"
              payload: { standard_code: "S4", coverage_rating: FULL }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cya}/transitions"
              payload: { to_state: ALIGNMENT_REVIEW }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cya}/transitions"
              payload: { to_state: PILOT_OPEN }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cya}/pilots"
              payload: { material_id: "${ma}", school_code: "SCH-A", starts_on: "2026-08-01", ends_on: "2026-08-15", teacher_count: 3 }
              as: CurriculumDirector
              captures: { pa: $.data.id }
            - call: "POST /pilots/${pa}/transitions"
              payload: { to_state: ACTIVE }
              as: CurriculumDirector
            - call: "POST /pilots/${pa}/reviews"
              payload: { pedagogy_score: 4, alignment_score: 4, usability_score: 4, equity_score: 4 }
              as: Teacher
              as_user_id: "t1"
            - call: "POST /pilots/${pa}/reviews"
              payload: { pedagogy_score: 3, alignment_score: 4, usability_score: 3, equity_score: 3 }
              as: Teacher
              as_user_id: "t2"
            - call: "POST /pilots/${pa}/reviews"
              payload: { pedagogy_score: 4, alignment_score: 3, usability_score: 4, equity_score: 4 }
              as: Teacher
              as_user_id: "t3"
            - call: "POST /pilots/${pa}/transitions"
              payload: { to_state: CLOSED }
              as: CurriculumDirector
            - call: "POST /adoption-cycles/${cya}/transitions"
              payload: { to_state: SCORING }
              as: CurriculumDirector
            - call: "POST /adoption-cycles/${cya}/transitions"
              payload: { to_state: PUBLIC_REVIEW }
              as: BoardSecretary
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /adoption-cycles/${cya}/transitions"
              payload: { to_state: BOARD_PENDING }
              as: BoardSecretary
            - call: "POST /adoption-cycles/${cya}/board-decision"
              payload: { material_id: "${ma}", decision: ADOPT }
              as: BoardSecretary
            - call: "POST /adoption-cycles/${cya}/quotes"
              payload: { material_id: "${ma}", publisher_name: "PubCheap", print_unit_price: 80.00, print_quantity: 500, digital_seat_rate: 25.00, digital_seat_count: 480, bundle_discount_pct: 0.10, training_sessions: 1, license_years: 1 }
              as: ProcurementOfficer
              captures: { qa: $.data.id }
            - call: "POST /adoption-cycles/${cya}/quotes"
              payload: { material_id: "${ma}", publisher_name: "PubRich", print_unit_price: 95.00, print_quantity: 500, digital_seat_rate: 10.00, digital_seat_count: 480, bundle_discount_pct: 0, training_sessions: 6, license_years: 5 }
              as: ProcurementOfficer
              captures: { qb: $.data.id }
            - call: "POST /adoption-cycles/${cya}/quotes"
              payload: { material_id: "${ma}", publisher_name: "PubMid", print_unit_price: 88.50, print_quantity: 500, digital_seat_rate: 18.75, digital_seat_count: 480, bundle_discount_pct: 0.05, training_sessions: 4, license_years: 4 }
              as: ProcurementOfficer
              captures: { qc: $.data.id }
            - call: "POST /quotes/${qa}/transitions"
              payload: { to_state: UNDER_EVALUATION }
              as: ProcurementOfficer
            - call: "POST /quotes/${qb}/transitions"
              payload: { to_state: UNDER_EVALUATION }
              as: ProcurementOfficer
            - call: "POST /quotes/${qc}/transitions"
              payload: { to_state: UNDER_EVALUATION }
              as: ProcurementOfficer
            - call: "POST /adoption-cycles"
              payload: { subject_area: SCIENCE, grade_band: K_5, school_year_start: 2027, framework_id: "${fw_s}", district_enrollment: 100, award_method: BEST_VALUE }
              as: CurriculumDirector
              captures: { cyb: $.data.id }
            - call: "POST /adoption-cycles/${cyb}/materials"
              payload: { title: "Science Text", publisher_name: "PubB" }
              as: CurriculumDirector
              captures: { mb: $.data.id }
            - call: "POST /materials/${mb}/transitions"
              payload: { to_state: VETTED }
              as: InstructionalSpecialist
            - call: "POST /materials/${mb}/alignments"
              payload: { standard_code: "S1", coverage_rating: FULL }
              as: InstructionalSpecialist
            - call: "POST /materials/${mb}/alignments"
              payload: { standard_code: "S2", coverage_rating: FULL }
              as: InstructionalSpecialist
            - call: "POST /materials/${mb}/alignments"
              payload: { standard_code: "S3", coverage_rating: FULL }
              as: InstructionalSpecialist
            - call: "POST /materials/${mb}/alignments"
              payload: { standard_code: "S4", coverage_rating: FULL }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cyb}/transitions"
              payload: { to_state: ALIGNMENT_REVIEW }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cyb}/transitions"
              payload: { to_state: PILOT_OPEN }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cyb}/pilots"
              payload: { material_id: "${mb}", school_code: "SCH-B", starts_on: "2026-08-01", ends_on: "2026-08-15", teacher_count: 3 }
              as: CurriculumDirector
              captures: { pb: $.data.id }
            - call: "POST /pilots/${pb}/transitions"
              payload: { to_state: ACTIVE }
              as: CurriculumDirector
            - call: "POST /pilots/${pb}/reviews"
              payload: { pedagogy_score: 4, alignment_score: 4, usability_score: 4, equity_score: 4 }
              as: Teacher
              as_user_id: "t1"
            - call: "POST /pilots/${pb}/reviews"
              payload: { pedagogy_score: 3, alignment_score: 4, usability_score: 3, equity_score: 3 }
              as: Teacher
              as_user_id: "t2"
            - call: "POST /pilots/${pb}/reviews"
              payload: { pedagogy_score: 4, alignment_score: 3, usability_score: 4, equity_score: 4 }
              as: Teacher
              as_user_id: "t3"
            - call: "POST /pilots/${pb}/transitions"
              payload: { to_state: CLOSED }
              as: CurriculumDirector
            - call: "POST /adoption-cycles/${cyb}/transitions"
              payload: { to_state: SCORING }
              as: CurriculumDirector
            - call: "POST /adoption-cycles/${cyb}/transitions"
              payload: { to_state: PUBLIC_REVIEW }
              as: BoardSecretary
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /adoption-cycles/${cyb}/transitions"
              payload: { to_state: BOARD_PENDING }
              as: BoardSecretary
            - call: "POST /adoption-cycles/${cyb}/board-decision"
              payload: { material_id: "${mb}", decision: ADOPT }
              as: BoardSecretary
            - call: "POST /adoption-cycles/${cyb}/quotes"
              payload: { material_id: "${mb}", publisher_name: "PubCheap", print_unit_price: 80.00, print_quantity: 500, digital_seat_rate: 25.00, digital_seat_count: 480, bundle_discount_pct: 0.10, training_sessions: 1, license_years: 1 }
              as: ProcurementOfficer
              captures: { qba: $.data.id }
            - call: "POST /adoption-cycles/${cyb}/quotes"
              payload: { material_id: "${mb}", publisher_name: "PubRich", print_unit_price: 95.00, print_quantity: 500, digital_seat_rate: 10.00, digital_seat_count: 480, bundle_discount_pct: 0, training_sessions: 6, license_years: 5 }
              as: ProcurementOfficer
              captures: { qbb: $.data.id }
            - call: "POST /adoption-cycles/${cyb}/quotes"
              payload: { material_id: "${mb}", publisher_name: "PubMid", print_unit_price: 88.50, print_quantity: 500, digital_seat_rate: 18.75, digital_seat_count: 480, bundle_discount_pct: 0.05, training_sessions: 4, license_years: 4 }
              as: ProcurementOfficer
              captures: { qbc: $.data.id }
            - call: "POST /quotes/${qba}/transitions"
              payload: { to_state: UNDER_EVALUATION }
              as: ProcurementOfficer
            - call: "POST /quotes/${qbb}/transitions"
              payload: { to_state: UNDER_EVALUATION }
              as: ProcurementOfficer
            - call: "POST /quotes/${qbc}/transitions"
              payload: { to_state: UNDER_EVALUATION }
              as: ProcurementOfficer
          trigger:
            - call: "GET /adoption-cycles/${cya}"
              as: ProcurementOfficer
              captures: { cya_v: $.data.version }
            - call: "POST /adoption-cycles/${cya}/award"
              payload: { quote_id: "${qb}", expected_cycle_version: "${cya_v}" }
              as: ProcurementOfficer
              captures: { err_lr: $.data.error_id }
            - call: "GET /adoption-cycles/${cyb}"
              as: ProcurementOfficer
              captures: { cyb_v: $.data.version }
            - call: "POST /adoption-cycles/${cyb}/award"
              payload: { quote_id: "${qbb}", expected_cycle_version: "${cyb_v}" }
              as: ProcurementOfficer
          assert:
            - "cycle A (LOWEST_RESPONSIVE) rejects the 52300.00 quote: error_id == ERR_QUOTE_NOT_AWARD_WINNER (winner is the 50800.00 quote)"
            - "cycle B (BEST_VALUE) accepts the identical 52300.00 quote: response status 200, cycle B status == PROCURING"
            - "Quote.${qbb}.best_value_score == 88.52, Quote.${qba}.best_value_score == 57.50, Quote.${qbc}.best_value_score == 78.03"
            - "Quote.${qbb}.status == SELECTED; Quote.${qba}.status == REJECTED; Quote.${qbc}.status == REJECTED"
            - "AdoptionCycle.${cyb}.pinned_quote_id == ${qbb} and quote_version_pin == Quote.${qbb}.version"

      - name: forecast_rolling_vs_straight_line
        grounds:
          - calculations.budget_forecast
        distinguishing_aspect: |
          Same queried cycle yields forecast_total 12600.00 under the forward-looking ROLLING
          variant (enrollment-driven) and 1217.23 under the chronological STRAIGHT_LINE variant
          (one prior ACTIVE cycle with expended_total 1000.00, inflated) — a dual variant on the
          budget domain, distinct from pilot scoring and procurement award.
        test_recipe:
          setup:
            - "Cycle H (MATHEMATICS 2026) fully driven to ACTIVE with expended_total == 1000.00"
            - "Cycle C (SCIENCE 2028, district_enrollment 100) freshly created"
          setup_api_calls:
            - call: "POST /frameworks"
              payload: { code: "FW-MATH-K5", subject_area: MATHEMATICS, grade_band: K_5, standards_required_count: 1, effective_year: 2026 }
              as: DistrictAdmin
              captures: { fw_m: $.data.id }
            - call: "POST /frameworks"
              payload: { code: "FW-SCI-K5", subject_area: SCIENCE, grade_band: K_5, standards_required_count: 1, effective_year: 2026 }
              as: DistrictAdmin
              captures: { fw_s: $.data.id }
            - call: "POST /adoption-cycles"
              payload: { subject_area: MATHEMATICS, grade_band: K_5, school_year_start: 2026, framework_id: "${fw_m}", district_enrollment: 50 }
              as: CurriculumDirector
              captures: { cyh: $.data.id }
            - call: "POST /adoption-cycles/${cyh}/materials"
              payload: { title: "Math Text", publisher_name: "PubA" }
              as: CurriculumDirector
              captures: { mh: $.data.id }
            - call: "POST /materials/${mh}/transitions"
              payload: { to_state: VETTED }
              as: InstructionalSpecialist
            - call: "POST /materials/${mh}/alignments"
              payload: { standard_code: "S1", coverage_rating: FULL }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cyh}/transitions"
              payload: { to_state: ALIGNMENT_REVIEW }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cyh}/transitions"
              payload: { to_state: PILOT_OPEN }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cyh}/pilots"
              payload: { material_id: "${mh}", school_code: "SCH-A", starts_on: "2026-08-01", ends_on: "2026-08-15", teacher_count: 1 }
              as: CurriculumDirector
              captures: { ph: $.data.id }
            - call: "POST /pilots/${ph}/transitions"
              payload: { to_state: ACTIVE }
              as: CurriculumDirector
            - call: "POST /pilots/${ph}/reviews"
              payload: { pedagogy_score: 4, alignment_score: 4, usability_score: 4, equity_score: 4 }
              as: Teacher
              as_user_id: "t1"
            - call: "POST /pilots/${ph}/transitions"
              payload: { to_state: CLOSED }
              as: CurriculumDirector
            - call: "POST /adoption-cycles/${cyh}/transitions"
              payload: { to_state: SCORING }
              as: CurriculumDirector
            - call: "POST /adoption-cycles/${cyh}/transitions"
              payload: { to_state: PUBLIC_REVIEW }
              as: BoardSecretary
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /adoption-cycles/${cyh}/transitions"
              payload: { to_state: BOARD_PENDING }
              as: BoardSecretary
            - call: "POST /adoption-cycles/${cyh}/board-decision"
              payload: { material_id: "${mh}", decision: ADOPT }
              as: BoardSecretary
            - call: "POST /adoption-cycles/${cyh}/quotes"
              payload: { material_id: "${mh}", publisher_name: "PubA", print_unit_price: 10.00, print_quantity: 100, digital_seat_rate: 0, digital_seat_count: 0, training_sessions: 0, license_years: 0 }
              as: ProcurementOfficer
              captures: { qh1: $.data.id }
            - call: "POST /adoption-cycles/${cyh}/quotes"
              payload: { material_id: "${mh}", publisher_name: "PubB", print_unit_price: 10.00, print_quantity: 100, digital_seat_rate: 0, digital_seat_count: 0, training_sessions: 0, license_years: 0 }
              as: ProcurementOfficer
              captures: { qh2: $.data.id }
            - call: "POST /quotes/${qh1}/transitions"
              payload: { to_state: UNDER_EVALUATION }
              as: ProcurementOfficer
            - call: "POST /quotes/${qh2}/transitions"
              payload: { to_state: UNDER_EVALUATION }
              as: ProcurementOfficer
            - call: "GET /adoption-cycles/${cyh}"
              as: ProcurementOfficer
              captures: { cyh_v: $.data.version }
            - call: "POST /adoption-cycles/${cyh}/award"
              payload: { quote_id: "${qh1}", expected_cycle_version: "${cyh_v}" }
              as: ProcurementOfficer
            - call: "POST /adoption-cycles/${cyh}/budget-appropriation"
              payload: { amount: 2000 }
              as: DistrictAdmin
            - call: "GET /adoption-cycles/${cyh}"
              as: ProcurementOfficer
              captures: { cyh_v2: $.data.version }
            - call: "POST /adoption-cycles/${cyh}/purchase-orders"
              payload: { quote_id: "${qh1}", print_quantity: 100, digital_seat_count: 0, expected_cycle_version: "${cyh_v2}" }
              as: ProcurementOfficer
              captures: { poh: $.data.id }
            - call: "POST /purchase-orders/${poh}/issue"
              as: ProcurementOfficer
            - call: "POST /purchase-orders/${poh}/receive"
              payload: { qty_received: 100 }
              as: WarehouseManager
            - call: "POST /purchase-orders/${poh}/pay"
              payload: { amount: 1000 }
              as: ProcurementOfficer
            - call: "POST /purchase-orders/${poh}/transitions"
              payload: { to_state: CLOSED }
              as: ProcurementOfficer
            - call: "POST /adoption-cycles/${cyh}/transitions"
              payload: { to_state: ACTIVE }
              as: CurriculumDirector
            - call: "POST /adoption-cycles"
              payload: { subject_area: SCIENCE, grade_band: K_5, school_year_start: 2028, framework_id: "${fw_s}", district_enrollment: 100 }
              as: CurriculumDirector
              captures: { cyc: $.data.id }
          trigger:
            - call: "GET /adoption-cycles/${cyc}/budget-forecast"
              payload: { variant: ROLLING }
              as: CurriculumDirector
              captures: { roll_base: $.data.base_amount, roll_rate: $.data.contingency_rate, roll_total: $.data.forecast_total }
            - call: "GET /adoption-cycles/${cyc}/budget-forecast"
              payload: { variant: STRAIGHT_LINE }
              as: CurriculumDirector
              captures: { sl_base: $.data.base_amount, sl_rate: $.data.contingency_rate, sl_total: $.data.forecast_total }
