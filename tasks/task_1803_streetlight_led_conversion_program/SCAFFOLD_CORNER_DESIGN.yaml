      assert:
      - '${e1} == ERR_TICKET_NOT_OPEN AND ${e2} == ERR_TICKET_NOT_DISPATCHED AND ${e3} == ERR_TICKET_NOT_RESOLVED   # VERIFIED lockdown'
      - '${e4} == ERR_TICKET_NOT_RESOLVED   # reopen requires RESOLVED; OPEN ticket cannot reopen'
