            - { call: "POST /api/members", payload: { committee_id: "${comm_b}", full_name: "M B3", email: "mb3@u.edu", service_start: "2026-01-01", service_end: "2026-12-31" }, as: ProvostOfficer, captures: { mb3: $.data.id } }
            - { call: "POST /api/members", payload: { committee_id: "${comm_b}", full_name: "M B4", email: "mb4@u.edu", service_start: "2026-01-01", service_end: "2026-12-31" }, as: ProvostOfficer, captures: { mb4: $.data.id } }
