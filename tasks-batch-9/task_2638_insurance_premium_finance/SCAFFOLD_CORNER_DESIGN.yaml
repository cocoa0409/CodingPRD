              payload: { justification: "wrong role, ghost id" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { rb_e_role_before_404: "$.data.error_id" }
            - call: "POST /late-fees/00000000-0000-0000-0000-0000000000b1/waive"
              payload: { justification: "right role, ghost id" }
              as: ComplianceOfficer
              as_user_id: "compliance-officer-1"
              captures: { rb_e_404: "$.data.error_id" }
            - call: "GET /agreements/${rb_agr}"
              payload: {}
              as: UNAUTHENTICATED
              captures: { rb_e_noauth: "$.data.error_id" }
            - call: "POST /servicing-runs"
              payload: {}
              as: UNAUTHENTICATED
              captures: { rb_e_noauth2: "$.data.error_id" }
            - call: "GET /agreements"
              payload: { limit: 50 }
              as: ComplianceOfficer
              as_user_id: "compliance-officer-1"
            - call: "GET /agreements/${rb_agr}/payments"
              payload: { limit: 50 }
              as: ComplianceOfficer
              as_user_id: "compliance-officer-1"
          assert:
            - "POSITIVE COVERAGE: the rate rule, licence, agency and carrier were written only by ComplianceOfficer; the insured, agreement, policy, submit and activate only by FinanceAnalyst (${rb_status} == 'ACTIVE'); the two attestations by Insurer and ProducerAgent (${rb_v_ins} and ${rb_v_agt} are both non-null); and the payment, schedule read and payoff quote by Insured (${rb_pay} non-null, ${rb_i1_status} == 'PAID', ${rb_q_net} == 412059 == 502000 - 83666 + 37650 - 6275 - 37650 + 0)"
            - "THE ANALYST CANNOT DO COMPLIANCE WORK: ${rb_e_rule} == ${rb_e_sweep} == ${rb_e_suspend} == 'ERR_UNAUTHORIZED_ROLE' at HTTP 403"
            - "COMPLIANCE CANNOT ORIGINATE OR ACTIVATE: ${rb_e_originate} == ${rb_e_activate} == 'ERR_UNAUTHORIZED_ROLE' at HTTP 403 — the role that sets the rates never writes the paper"
            - "the third-party roles are confined to their own verbs: ${rb_e_execute} == 'ERR_UNAUTHORIZED_ROLE' (a carrier cannot exercise the power of attorney), ${rb_e_verify} == 'ERR_UNAUTHORIZED_ROLE' (the borrower cannot attest a premium) and ${rb_e_pay} == 'ERR_UNAUTHORIZED_ROLE' (the agency cannot pay the note)"
            - "AUTHORIZATION BEFORE EXISTENCE: the same ghost late-fee id returns ${rb_e_role_before_404} == 'ERR_UNAUTHORIZED_ROLE' at HTTP 403 to the analyst but ${rb_e_404} == 'ERR_LATE_FEE_NOT_FOUND' at HTTP 404 to compliance — priority 2 runs before priority 3, so the wrong role learns nothing about the row"
            - "AUTHENTICATION BEFORE AUTHORIZATION: with X-User-ID and X-User-Role both omitted, ${rb_e_noauth} == 'ERR_UNAUTHENTICATED' at HTTP 401 on a read the analyst may perform and ${rb_e_noauth2} == 'ERR_UNAUTHENTICATED' at HTTP 401 on an operation no analyst may perform — priority 1 pre-empts priority 2 either way"
            - "shared operations really are shared: GET /agreements returns total_count == 1 and GET /agreements/${rb_agr}/payments returns total_count == 1 for ComplianceOfficer, the same rows the analyst and the insured can read"
            - "CODES CLOSED HERE: ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED_ROLE"

      - name: cross_role_denial_entity_backed_roles_are_confined_to_their_own_rows
        claim_type: entity_backed_ownership
        grounds:
          - validations.priority_5_ERR_NOT_RESOURCE_OWNER
          - validations.priority_6_ERR_VERIFIER_NOT_AUTHORIZED
          - roles.Insured.identity
        distinguishing_aspect: |
          Three roles are entity_backed, so holding the right ROLE is not enough — X-User-ID must match
          the row. Two borrowers, two agencies and two carriers are set up so that every ownership edge
          can be crossed with an otherwise perfectly legal request. The pair of codes is the subtle
          part: crossing the borrower edge is ERR_NOT_RESOURCE_OWNER at priority 5, while crossing the
          attestation edge is ERR_VERIFIER_NOT_AUTHORIZED at priority 6, and the second must
          win on a verification because attestation standing is a business-referential fact about the
          policy rather than plain resource ownership.
