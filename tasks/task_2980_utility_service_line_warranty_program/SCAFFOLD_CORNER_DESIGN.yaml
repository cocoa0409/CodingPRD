          assert:
            - "${one_coverage_before} == PENDING_WAITING_PERIOD, ${one_effective} == 2026-09-04T00:00:00.000Z, ${one_v_before} == 1 and ${two_v_before} == 1"
            - "${early_activated} == [] and ${pending_total_before} == 2  # at 2026-09-03 the effective instant has not arrived, so the batch reports nothing and changes nothing"
