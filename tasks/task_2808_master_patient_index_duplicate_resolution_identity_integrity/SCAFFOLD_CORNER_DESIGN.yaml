      - name: version_increments_exactly_once_per_write_and_immutable_rows_have_none
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers.optimistic_concurrency
          - response_envelope
          - entities.RegistrationSearchAttempt
        distinguishing_aspect: "Every mutating call bumps the touched row's version by exactly one - including writes that only change a computed counter on a parent - while the three common_fields: false entities never expose a version field at all."
