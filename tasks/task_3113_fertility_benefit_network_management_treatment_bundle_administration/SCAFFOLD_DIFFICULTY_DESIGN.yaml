              as: CareAdvocate
              as_user_id: "${adv17}"
              captures: { err_adjacent: $.data.error_id }
            - call: "POST /members/${m23}/surrender-routes"
              payload: { pathway_type: "PRESERVATION", carrier_kind: "CUSTODIAN", route_from: "2026-10-31T00:00:00Z", route_to: "2026-11-30T00:00:00Z", expected_member_version: "${m23v2}" }
              as: CareAdvocate
              as_user_id: "${adv17}"
              captures: { sr2: $.data.id }
          assert:
            - "SurrenderRoute.${sr1}.route_status == ROUTED"
            - "the first attempt returns 409 and err_adjacent == ERR_SURRENDER_ROUTE_CONFLICT — a route starting exactly at SR1.route_to still collides because the retention tail extends SR1's occupation to 2026-10-31T00:00:00Z"
            - "GET /surrender-routes?member_id=${m23} returns exactly 1 row after the refusal"
            - "the second attempt succeeds and creates SurrenderRoute.${sr2} with route_status SUBMITTED"
            - "GET /surrender-routes?member_id=${m23} now returns 2 rows"
            - "the interval semantics differ from the cycle-spacing instance: there the touching instant was ADMITTED under a half-open buffer, here the touching instant is REFUSED under a closed-end retention extension"
            - "Member.${m23}.version > ${m23v2}"
# ===========================================================================
  # Rule 9 — compensating_invariant (≥ 2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: claim_reversal_restores_cycle_and_pharmacy_conserved_cent_sum
        grounds:
          - state_machines.Claim.PAID_to_REVERSED
          - state_machines.Preauthorization."APPROVED / PARTIALLY_CONSUMED"_to_"APPROVED / UNCONSUMED"
          - calculations.bundle_cycle_allowance
          - calculations.pharmacy_pool_allocation
          - errors[ERR_REVERSAL_WINDOW_CLOSED]
        distinguishing_aspect: "A conserved CURRENCY quantity: after paying a 420000-cent MEDICATION claim and then reversing it, the named invariant pharmacy_consumed_cents + pharmacy_remaining_cents + sum of plan_paid_cents over the member's PAID-or-REVERSED medication claims must equal the pool's 500000 cents exactly — reversing subtracts from all three sides at once, so drift in any one of them breaks the sum even though the visible pool balance returns to its pre-claim value."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. SEQUENTIAL_BUNDLE employer E18, bundle B18 with pharmacy_pool_cents 500000 and 3 cycles, advocate A18, member M24 CARE_ACTIVE, clinic C18 CONTRACTED at 1450000."
            - "Plan P20 with an APPROVED medication authorization AX20 at member_cost_share_pct 10; specialty order MO18 of 420000 acquisition cents already DISPENSING with plan_paid_cents 420000 and member_cost_cents 0."
            - "A MEDICATION Claim CL18 of 420000 billed cents in claim_status RECEIVED, service_date_iso 2026-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /employer-accounts"
              payload: { employer_name: "E18", plan_year: 2026, funding_type: "SELF_FUNDED", allocation_method: "SEQUENTIAL_BUNDLE", enrollment_limit: 50 }
              as: PlanAdministrator
              captures: { e18: $.data.id }
            - call: "POST /bundle-entitlements"
              payload: { employer_account_id: "${e18}", bundle_type: "IVF_RETRIEVAL_TRANSFER", lifetime_max_cycles: 3, max_cycles_per_year: 3, max_transfers_per_cycle: 2, pharmacy_pool_cents: 500000, copay_max: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z" }
              as: PlanAdministrator
              captures: { b18: $.data.id }
            - call: "POST /bundle-entitlements/${b18}/activate"
              payload: {}
              as: PlanAdministrator
            - call: "POST /care-advocates"
              payload: { full_name: "A18", states_licensed: ["TX"], specializations: ["STANDARD_IVF"], caseload_limit: 5, credentials_expire_on: "2027-12-31T00:00:00Z" }
              as: PlanAdministrator
              captures: { adv18: $.data.id }
            - call: "POST /members"
              payload: { employer_account_id: "${e18}", external_ref: "M24", full_name: "M24", state_code: "TX", required_track: "STANDARD_IVF" }
              as: CareAdvocate
              captures: { m24: $.data.id }
            - call: "POST /members/${m24}/assign-advocate"
              payload: { allocation_strategy: "ROUND_ROBIN" }
              as: NetworkManager
            - call: "POST /members/${m24}/complete-intake"
              payload: {}
              as: CareAdvocate
              as_user_id: "${adv18}"
            - call: "POST /clinics"
              payload: { legal_name: "C18", npi: "1000000018", state_code: "TX", network_tier: "PREFERRED", min_live_birth_rate_bps: 0, max_multiple_birth_rate_bps: 10000, required_quality_report_count: 0, maturity_report_threshold: 2, bundles_offered: ["IVF_RETRIEVAL_TRANSFER"] }
              as: NetworkManager
              captures: { c18: $.data.id }
            - call: "POST /clinics/${c18}/contracts"
              payload: { effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", bundle_rates: { IVF_RETRIEVAL_TRANSFER: 1450000 } }
              as: NetworkManager
              captures: { ct18: $.data.id }
            - call: "GET /clinics/${c18}"
              payload: {}
              as: NetworkManager
              captures: { c18v: $.data.version }
            - call: "POST /clinic-contracts/${ct18}/activate"
              payload: { expected_clinic_version: "${c18v}" }
              as: NetworkManager
            - call: "POST /treatment-plans"
              payload: { member_id: "${m24}", bundle_entitlement_id: "${b18}", pathway_type: "STANDARD_IVF", planned_cycles: 2 }
              as: CareAdvocate
              as_user_id: "${adv18}"
              captures: { p20: $.data.id }
            - call: "GET /members/${m24}"
              payload: {}
              as: CareAdvocate
              as_user_id: "${adv18}"
              captures: { m24v: $.data.version }
            - call: "POST /treatment-plans/${p20}/select-clinic"
              payload: { clinic_id: "${c18}", expected_member_version: "${m24v}" }
              as: CareAdvocate
              as_user_id: "${adv18}"
              captures: { p20v: $.data.version }
            - call: "POST /treatment-plans/${p20}/preauthorizations"
              payload: { cycle_sequence_index: 1, criteria_inputs: { age_years: 33, amh_ng_ml: 2.0, prior_cycles: 0, prior_live_birth: false, fsh_iu_l: 6 }, member_cost_share_pct: 10 }
              as: CareAdvocate
              as_user_id: "${adv18}"
              captures: { ax20: $.data.id }
            - call: "POST /preauthorizations/${ax20}/decide"
              payload: { decision: "APPROVE", expected_treatment_plan_version: "${p20v}" }
              as: ClinicalReviewer
              as_user_id: "rev-18"
              captures: { ph20: $.data.id }
            - call: "POST /medication-orders"
              payload: { member_id: "${m24}", preauthorization_id: "${ph20}", medication_code: "GONAL-F-900", specialty_drug: true, quantity: 9, days_supply: 12, acquisition_cost_cents: 420000, dispensing_pharmacy: "SP-18" }
              as: SpecialtyPharmacist
              captures: { mo18: $.data.id }
            - call: "GET /bundle-entitlements/${b18}"
              payload: {}
              as: SpecialtyPharmacist
              captures: { b18v: $.data.version }
            - call: "POST /medication-orders/${mo18}/dispense"
              payload: { expected_bundle_entitlement_version: "${b18v}" }
              as: SpecialtyPharmacist
            - call: "POST /claims"
              payload: { member_id: "${m24}", preauthorization_id: "${ph20}", service_category: "MEDICATION", billed_cents: 420000, service_date_iso: "2026-09-01T00:00:00Z" }
              as: SpecialtyPharmacist
              captures: { cl18: $.data.id }
            - call: "POST /claims/${cl18}/adjudicate"
              payload: {}
              as: ClaimsProcessor
              captures: { cl18_v: $.data.version }
            - call: "GET /preauthorizations/${ph20}"
              payload: {}
              as: ClaimsProcessor
              captures: { ph20_v: $.data.version }
            - call: "POST /claims/${cl18}/pay"
              payload: { expected_preauthorization_version: "${ph20_v}" }
              as: ClaimsProcessor
              captures: { cl18_paid: $.data.version }
            - call: "GET /bundle-entitlements/${b18}"
              payload: {}
              as: ClaimsProcessor
              captures: { b18_paid: $.data.version }
          trigger:
            - call: "POST /claims/${cl18}/reverse"
              payload: {}
              as: ClaimsProcessor
              captures: { cl18_rev: $.data.version }
          assert:
            - "before the reversal BundleEntitlement.${b18}.pharmacy_consumed_cents == 420000 and pharmacy_remaining_cents == 80000 and those two sides sum to 500000"
            - "Claim.${cl18}.claim_status == REVERSED after the trigger"
            - "BundleEntitlement.${b18}.pharmacy_consumed_cents == 0 and BundleEntitlement.${b18}.pharmacy_remaining_cents == 500000 after the reversal"
            - "Claim.${cl18}.plan_paid_cents == 0 and Claim.${cl18}.member_cost_share_cents == 0 after the reversal"
            - "the invariant pharmacy_consumed_cents + pharmacy_remaining_cents == 500000 holds before the pay, after the pay and after the reversal — the pool is conserved across the whole forward-and-compensating pair"
            - "Claim.${cl18}.member_accumulator_after_cents == Claim.${cl18}.member_accumulator_before_cents after the reversal, so no out-of-pocket drift survives"
            - "BundleEntitlement.${b18}.version == ${b18_paid} is false — the reversal advanced it beyond the paid reading"
            - "BundleEntitlement.${b18}.cycles_remaining == 3 and cycles_consumed == 0 — the compensation released only the pharmacy side and left the cycle side untouched"

      - name: outcome_void_restores_conserved_record_count_and_rate_denominator
        grounds:
          - state_machines.OutcomeRecord.RECORDED_to_VOIDED
          - calculations.network_quality_score
          - entities.Clinic.fields.cycles_reported
          - errors[ERR_DUPLICATE_OPERATION]
          - state_machines.Clinic.CONTRACTED_to_PROBATION
        distinguishing_aspect: "A different conserved quantity from the currency invariant — a RECORD COUNT: after recording an outcome and then voiding it, the invariant cardinality({o : o.clinic_id == C and o.outcome_status IN {RECORDED, AMENDED}}) + cardinality({o : o.outcome_status == VOIDED}) must equal the number of OutcomeRecord rows ever written for the clinic, so a void that drops the row from both terms breaks the count even though cycles_reported returns to its pre-report value."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. CONCURRENT_BUNDLE employer E19 with bundle B19 of 6 cycles, advocate A19, member M25 CARE_ACTIVE, clinic C19 CONTRACTED with min_live_birth_rate_bps 6000 and maturity_report_threshold 1."
            - "Plan P21 on C19 with an APPROVED authorization AX21 and cycle CY21 already OUTCOME_RECORDED; the outcome has been reported to C19 so cycles_reported is 1, live_birth_rate_bps is 10000 and clinic_status is CONTRACTED."
            - "No Claim referencing CY21 is in claim_status PAID, so the void gate is open."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /employer-accounts"
              payload: { employer_name: "E19", plan_year: 2026, funding_type: "SELF_FUNDED", allocation_method: "CONCURRENT_BUNDLE", enrollment_limit: 50 }
