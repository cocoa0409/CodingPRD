  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: visit_intervals_half_open_back_to_back_allowed_overlap_rejected
        grounds:
          - validations[priority=9]
          - entities.CallVisit.fields.scheduled_start
        distinguishing_aspect: |
          Resource = Representative calendar; semantics = half-open [start,end)
          with NO buffer: a visit ending 10:00 and another starting 10:00 for
          the same rep is legal, while start 09:59:59 overlaps and is rejected.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Rep S with published plan and two tier-B entries E1, E2 (two prescribers)."
            - "Existing visit 09:00-10:00 on E1."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "GA-01", name: "Georgia" }
