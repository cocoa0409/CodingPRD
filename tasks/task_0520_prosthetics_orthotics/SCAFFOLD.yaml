scenario: "Prosthetics & Orthotics (O&P) Practice: physician Rx & evaluation, device fabrication & fitting milestones, L-code billing & modifier, prior-auth & medical-necessity, delivery & follow-up adjustment, repair/replacement & warranty, Medicare DMEPOS compliance, supplier accreditation"
domain_name: prosthetics-orthotics-practice
api_prefix: /op

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Ledger reconciliation"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: graph
  # DeviceOrder is a hub referencing Prescription, Patient, Supplier; ClaimLine/PriorAuth/
  # FabricationMilestone/Adjustment/RepairRequest all FK back to DeviceOrder or each other —
  # peer entities with cross-aggregate FKs rather than a strict URL tree.

  state_machine_shape: cyclic
  # PriorAuth has a revision cycle (PENDED->RESUBMITTED->PENDED); DeviceOrder fitting carries
  # branching fork-join over fabrication milestones; ClaimLine has parallel adjudication +
  # appeal dimensions.

  relationship_patterns:
    - one_to_many        # DeviceOrder -> ClaimLine, FabricationMilestone, Adjustment
    - many_to_many       # Prescription <-> diagnosis codes via DeviceOrder; Supplier accreditation
    - cross_aggregate    # ClaimLine references PriorAuth across aggregate boundary
    - self_referential   # RepairRequest.replaces_order_id references a prior DeviceOrder

  role_model: segregation_of_duties
  # The prescribing Physician cannot also be the fitting Practitioner of record on the same
  # DeviceOrder delivery attestation (anti-self-referral / DMEPOS supplier-standard control).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits."
      - name: updated_at
        type: datetime
        source: system
        description: "Refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation."
        default: 1
      - name: full_name
        type: string
        source: input
        description: "Patient legal name."
      - name: date_of_birth
        type: string
        source: input
        description: "YYYY-MM-DD."
      - name: payer_type
        type: enum
        source: input
        description: "Primary payer."
        constraints: "one of {MEDICARE, MEDICAID, COMMERCIAL, SELF_PAY}"
      - name: medicare_beneficiary_id
        type: string
        source: input
        description: "MBI; required when payer_type=MEDICARE, else null."
        default: null
      - name: functional_k_level
        type: integer
        source: input
        description: "Medicare functional level K0-K4 for lower-limb prosthetics; null for orthotics."
        default: null
        constraints: "0..4 or null"

  - name: Physician
