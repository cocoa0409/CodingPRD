      - name: guarantee_waterfall_denies_on_liability_shift_before_later_tests
        claim_type: waterfall_allocation
        grounds:
          - calculations.guarantee_liability_evaluation
          - entities.ChargebackRecord.fields.guarantee_denial_reason
          - state_machines.ChargebackRecord.transitions[RECEIVED->LOST]
        distinguishing_aspect: "T1 short-circuits the waterfall: a liability-shifted chargeback whose reason_code is NOT covered denies with LIABILITY_SHIFTED (not REASON_NOT_COVERED) and zeroes all three money fields, while the fraud ledger cascade still runs because the reason code is FRAUD_ATO."
        test_recipe:
          setup:
            - "BOOT-W plus assessment A1 (amount_cents 20000, p 0.4021 -> 39.95) scored to DECIDED_APPROVE, so Customer.lifetime_net_approved_cents == 20000 and approved_count == 1."
            - "Clock advanced to 2026-08-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
              captures: { asmt_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${asmt_id}/score"
              payload: {}
              as: CheckoutService
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fraud/chargebacks"
              payload: { assessment_id: "${asmt_id}", reason_code: "FRAUD_ATO", amount_cents: 20000, liability_shift: true, received_at: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { cb_id: $.data.id }
          trigger:
            - call: "POST /fraud/chargebacks/${cb_id}/transition"
              payload: { action: "LOSE" }
              as: PlatformAdmin
          assert:
            - "HTTP status == 200"
            - "ChargebackRecord.${cb_id}.state == LOST and resolved_at == 2026-08-02T00:00:00Z"
            - "ChargebackRecord.${cb_id}.guarantee_state == DENIED"
            - "ChargebackRecord.${cb_id}.guarantee_denial_reason == LIABILITY_SHIFTED"
            - "ChargebackRecord.${cb_id}.guarantee_eligible_cents == 0"
            - "ChargebackRecord.${cb_id}.guarantee_fee_cents == 0"
            - "ChargebackRecord.${cb_id}.guarantee_reimbursed_cents == 0"
            - "CheckoutAssessment.${asmt_id}.outcome_label == FRAUD (link 2 still runs for FRAUD_ATO)"
            - "Customer.${cust_id}.lifetime_net_approved_cents == 0 (20000 reversed by the assessment amount)"
            - "Customer.${cust_id}.confirmed_fraud_count == 1"
            - "Customer.${cust_id}.good_customer_flag == false"
            - "DeviceProfile.${dev_id}.fraud_confirmed_count == 1 and reputation == SUSPECT"

      - name: blended_score_rounding_is_a_single_step_over_the_weighted_sum
        claim_type: precision
        grounds:
          - calculations.blended_risk_score
        excluded_because:
          difficulty_instance: rule_dominant_nested_rounding_order_pinned
          rationale: "The pinned rounding structure — one rounding step in WEIGHTED versus the 1-decimal inner damp then 2-decimal uplift in RULE_DOMINANT, giving 48.25 rather than the naive 48.30 — is asserted there against both variants."

      - name: insult_rate_diverges_between_the_two_cohorts
        claim_type: variant_divergence
        grounds:
          - calculations.rule_pack_performance_metrics.variants
        excluded_because:
          difficulty_instance: insult_rate_decision_cohort_vs_good_customer_cohort
          rationale: "Cohort divergence on the same assessment population (0.3333 for DECISION_COHORT versus 1.0000 for GOOD_CUSTOMER_COHORT, driven by the frozen good_customer_at_decision snapshot) is exactly that dual_variant_calc instance."

      - name: ledger_invariant_reaches_a_fixed_point_after_reversal
        claim_type: constraint_propagation
        grounds:
          - calculations.ledger_invariants
        excluded_because:
          difficulty_instance: net_approved_ledger_survives_second_lost_chargeback
          rationale: "The conserved-ledger claim (SUM of approved non-fraud amounts, unchanged by a repeated LOST chargeback on the same assessment) is asserted there as the compensating invariant."

  # ===========================================================================
  - section: validations
    instances:

      - name: exception_scope_requires_matching_address_field
        claim_type: conditional_validation
        grounds:
          - validations[priority=66]
          - validations[priority=67]
          - errors[ERR_EXCEPTION_SCOPE_ADDRESS_REQUIRED]
          - errors[ERR_EXCEPTION_ADDRESS_NOT_ALLOWED]
        distinguishing_aspect: "whitelisted_address_id is required by one scope and forbidden by the other, so the same field flips from mandatory to illegal depending on scope: ADDRESS_WHITELIST without it is 422 ERR_EXCEPTION_SCOPE_ADDRESS_REQUIRED, AUTO_APPROVE_UNDER_AMOUNT with it is 422 ERR_EXCEPTION_ADDRESS_NOT_ALLOWED, and the correctly paired request succeeds."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Customer CU1 exists with tier HIGH_VALUE (TIER_EXCEPTION_CAP_CENTS 500000, and HIGH_VALUE is eligible for AUTO_APPROVE_UNDER_AMOUNT, so neither priority 86 nor 87 can pre-empt the scope checks)."
            - "Analyst AN1 exists so the RiskAnalyst X-User-ID resolves."
            - "Address AD1 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fraud/customers"
              payload: { email: "vip@example.com", home_country: "US", tier: "HIGH_VALUE" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /fraud/analysts"
              payload: { display_name: "AN1", seniority: "SENIOR", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 2 }
              as: PlatformAdmin
              captures: { an1_id: $.data.id }
            - call: "POST /fraud/addresses"
              payload: { line1: "30 Whitelist Way", postal_code: "94105", country_code: "US" }
              as: PlatformAdmin
              captures: { addr_id: $.data.id }
          trigger:
            - call: "POST /fraud/policy-exceptions"
              payload: { customer_id: "${cust_id}", scope: "ADDRESS_WHITELIST", max_amount_cents: 100000, effective_from: "2026-08-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", justification: "known reshipping agent for this buyer" }
              as: RiskAnalyst
              as_user_id: "${an1_id}"
            - call: "POST /fraud/policy-exceptions"
              payload: { customer_id: "${cust_id}", scope: "AUTO_APPROVE_UNDER_AMOUNT", max_amount_cents: 100000, effective_from: "2026-08-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", justification: "auto approve small orders", whitelisted_address_id: "${addr_id}" }
              as: RiskAnalyst
              as_user_id: "${an1_id}"
            - call: "POST /fraud/policy-exceptions"
              payload: { customer_id: "${cust_id}", scope: "ADDRESS_WHITELIST", max_amount_cents: 100000, effective_from: "2026-08-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", justification: "known reshipping agent for this buyer", whitelisted_address_id: "${addr_id}" }
              as: RiskAnalyst
              as_user_id: "${an1_id}"
              captures: { exc_id: $.data.id }
          assert:
            - "First trigger call: HTTP status == 422 and data.error_id == ERR_EXCEPTION_SCOPE_ADDRESS_REQUIRED"
            - "Second trigger call: HTTP status == 422 and data.error_id == ERR_EXCEPTION_ADDRESS_NOT_ALLOWED"
            - "Third trigger call: HTTP status == 201"
            - "PolicyException.${exc_id}.state == REQUESTED"
            - "PolicyException.${exc_id}.requested_by_analyst_id == ${an1_id}"
            - "PolicyException.${exc_id}.approved_by_analyst_id == null"
            - "PolicyException.${exc_id}.consumed_count == 0"
            - "GET /fraud/policy-exceptions?customer_id=${cust_id} returns total_count == 1 (the two rejected requests persisted nothing)"

      - name: chargeback_against_declined_assessment_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=69]
          - validations[priority=88]
          - errors[ERR_CHARGEBACK_ASSESSMENT_NOT_APPROVED]
        distinguishing_aspect: "Chargeback admissibility depends on another entity's state, not on the request body: a DECIDED_DECLINE assessment yields 422 ERR_CHARGEBACK_ASSESSMENT_NOT_APPROVED, and it still yields that error — not ERR_CHARGEBACK_AMOUNT_EXCEEDS_ORDER — when the amount is also over the order total, because priority 69 precedes priority 88."
        test_recipe:
          setup:
            - "BOOT-W (captures cust_id, dev_id, addr_id, pack_id, model_id)."
            - "Assessment AD (amount_cents 20000, model_raw_probability 0.6806 -> model_points 86.67 -> blended 60.00) is scored to DECIDED_DECLINE at the inclusive decline floor."
            - "Clock advanced to 2026-08-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.6806 }
              as: CheckoutService
              captures: { asmt_dec_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${asmt_dec_id}/score"
              payload: {}
              as: CheckoutService
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fraud/chargebacks"
              payload: { assessment_id: "${asmt_dec_id}", reason_code: "FRAUD_CNP", amount_cents: 20000, liability_shift: false, received_at: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fraud/chargebacks"
              payload: { assessment_id: "${asmt_dec_id}", reason_code: "FRAUD_CNP", amount_cents: 99000, liability_shift: false, received_at: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "CheckoutAssessment.${asmt_dec_id}.state == DECIDED_DECLINE and blended_score == 60.00"
            - "First trigger call: HTTP status == 422 and data.error_id == ERR_CHARGEBACK_ASSESSMENT_NOT_APPROVED"
            - "Second trigger call: HTTP status == 422 and data.error_id == ERR_CHARGEBACK_ASSESSMENT_NOT_APPROVED (NOT ERR_CHARGEBACK_AMOUNT_EXCEEDS_ORDER)"
            - "GET /fraud/chargebacks?assessment_id=${asmt_dec_id} returns total_count == 0"

      - name: chargeback_received_before_decision_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=72]
          - validations[priority=88]
          - errors[ERR_CHARGEBACK_BEFORE_DECISION]
          - errors[ERR_CHARGEBACK_AMOUNT_EXCEEDS_ORDER]
        distinguishing_aspect: "received_at < decided_at is strict: one second before the decision instant is 422 ERR_CHARGEBACK_BEFORE_DECISION, while received_at exactly equal to decided_at is accepted; an over-order amount on the same approved assessment then isolates ERR_CHARGEBACK_AMOUNT_EXCEEDS_ORDER."
        test_recipe:
          setup:
            - "BOOT-W plus assessment AA (amount_cents 20000, p 0.4021 -> 39.95) scored to DECIDED_APPROVE at decided_at 2026-08-01T00:00:00Z."
            - "Clock advanced to 2026-08-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
              captures: { asmt_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${asmt_id}/score"
              payload: {}
              as: CheckoutService
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fraud/chargebacks"
              payload: { assessment_id: "${asmt_id}", reason_code: "FRAUD_CNP", amount_cents: 20000, liability_shift: false, received_at: "2026-07-31T23:59:59Z" }
              as: PlatformAdmin
            - call: "POST /fraud/chargebacks"
              payload: { assessment_id: "${asmt_id}", reason_code: "FRAUD_CNP", amount_cents: 20001, liability_shift: false, received_at: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fraud/chargebacks"
              payload: { assessment_id: "${asmt_id}", reason_code: "FRAUD_CNP", amount_cents: 20000, liability_shift: false, received_at: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cb_id: $.data.id }
          assert:
            - "CheckoutAssessment.${asmt_id}.decided_at == 2026-08-01T00:00:00Z"
            - "First trigger call: HTTP status == 422 and data.error_id == ERR_CHARGEBACK_BEFORE_DECISION"
            - "Second trigger call: HTTP status == 422 and data.error_id == ERR_CHARGEBACK_AMOUNT_EXCEEDS_ORDER"
            - "Third trigger call: HTTP status == 201 with received_at exactly equal to decided_at accepted"
            - "ChargebackRecord.${cb_id}.state == RECEIVED"
            - "GET /fraud/chargebacks?assessment_id=${asmt_id} returns total_count == 1"

      - name: rule_signal_family_must_match_the_code_prefix
        claim_type: violation_to_error
        grounds:
          - validations[priority=71]
          - errors[ERR_RULE_FAMILY_MISMATCH]
          - endpoints[POST /fraud/rule-packs/{id}/rules]
        distinguishing_aspect: "signal_family is not free text: the code's own prefix pins it (BEH_* -> BEHAVIORAL), so declaring BEH_FAST_CHECKOUT as DEVICE is 422 ERR_RULE_FAMILY_MISMATCH and leaves rule_count at 0, while the correctly-paired rule is accepted and lifts rule_count to 1."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one DRAFT pack P-fam with a valid window and normalized weights."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P-fam", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { pack_id: $.data.id }
          trigger:
            - call: "POST /fraud/rule-packs/${pack_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "DEVICE", points: 20, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs/${pack_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 20, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
          assert:
            - "First trigger call: HTTP status == 422 and data.error_id == ERR_RULE_FAMILY_MISMATCH"
            - "RulePack.${pack_id}.rule_count == 0 after the first call"
            - "Second trigger call: HTTP status == 201 with signal_family BEHAVIORAL"
            - "RulePack.${pack_id}.rule_count == 1"
            - "GET /fraud/rule-packs/${pack_id}/rules returns total_count == 1"

      - name: analyst_capacity_exceeded_on_second_assignment_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=76]
          - errors[ERR_ANALYST_CAPACITY_EXCEEDED]
          - entities.Analyst.fields.shift_capacity_cases
        distinguishing_aspect: "Each assignment is individually legal but the pair exceeds the shift budget: with shift_capacity_cases 1, the second assign is 409 ERR_ANALYST_CAPACITY_EXCEEDED even though the expected_analyst_version supplied is the CURRENT one, which isolates the aggregate check from the OCC check."
        test_recipe:
          setup:
            - "BOOT-W plus two REVIEW assessments (each amount_cents 20000, p 0.5417 -> blended 50.00), creating cases C1 and C2, both QUEUED with primary_signal_family BEHAVIORAL."
            - "Analyst AN1: SENIOR, [BEHAVIORAL], shift_capacity_cases 1, version 1."
            - "C1 has already been assigned to AN1, so AN1.open_case_count == 1 and AN1.version == 2."
          setup_api_calls:
            - call: "POST /fraud/analysts"
              payload: { display_name: "AN1", seniority: "SENIOR", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 1 }
              as: PlatformAdmin
              captures: { an1_id: $.data.id, an1_v: $.data.version }
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.5417 }
              as: CheckoutService
              captures: { a1_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${a1_id}/score"
              payload: {}
              as: CheckoutService
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.5417 }
              as: CheckoutService
              captures: { a2_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${a2_id}/score"
              payload: {}
              as: CheckoutService
            - call: "GET /fraud/review-cases"
              payload: { assessment_id: "${a1_id}" }
              as: ReviewLead
              as_user_id: "${an1_id}"
              captures: { case1_id: "$.data[0].id" }
            - call: "GET /fraud/review-cases"
              payload: { assessment_id: "${a2_id}" }
              as: ReviewLead
              as_user_id: "${an1_id}"
              captures: { case2_id: "$.data[0].id" }
            - call: "POST /fraud/review-cases/${case1_id}/assign"
              payload: { analyst_id: "${an1_id}", expected_analyst_version: "${an1_v}" }
              as: ReviewLead
              as_user_id: "${an1_id}"
            - call: "GET /fraud/analysts/${an1_id}"
              payload: {}
              as: ReviewLead
              as_user_id: "${an1_id}"
              captures: { an1_v2: $.data.version }
          trigger:
            - call: "POST /fraud/review-cases/${case2_id}/assign"
              payload: { analyst_id: "${an1_id}", expected_analyst_version: "${an1_v2}" }
              as: ReviewLead
              as_user_id: "${an1_id}"
          assert:
            - "${an1_v2} == 2"
            - "HTTP status == 409"
            - "data.error_id == ERR_ANALYST_CAPACITY_EXCEEDED (not ERR_STALE_ANALYST_VERSION)"
            - "ReviewCase.${case2_id}.state == QUEUED and assigned_analyst_id == null"
            - "ReviewCase.${case1_id}.state == ASSIGNED and assigned_analyst_id == ${an1_id}"
            - "Analyst.${an1_id}.open_case_count == 1 and version == 2"

      - name: state_gate_outranks_amount_gate_on_exception_request
        claim_type: priority_ordering
        grounds:
          - validations[priority=41]
          - validations[priority=86]
        excluded_because:
          difficulty_instance: locked_account_state_check_outranks_exception_tier_cap
          rationale: "That instance already violates both rules in one request and pins the winner: priority 41's ERR_CUSTOMER_ACCOUNT_LOCKED is returned even though the tier cap at priority 86 is also breached."

      - name: escalated_lead_gate_outranks_capacity_gate
        claim_type: priority_conflict
        grounds:
          - validations[priority=59]
          - validations[priority=76]
        excluded_because:
          difficulty_instance: escalated_lead_requirement_outranks_analyst_capacity
          rationale: "The 59-over-76 conflict (a non-LEAD, over-capacity analyst offered an ESCALATED case returns ERR_ESCALATED_REQUIRES_LEAD) is asserted there together with the reverse-order control case."

      - name: overlapping_exception_windows_for_one_customer_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=79]
          - errors[ERR_EXCEPTION_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: exception_window_adjacency_allowed_overlap_rejected
          rationale: "The half-open window semantics are asserted there: an exactly adjacent window (new effective_from == existing expires_at) is accepted while a window starting one second earlier is 409 ERR_EXCEPTION_WINDOW_OVERLAP."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: clock_endpoint_rejects_non_monotonic_time_but_allows_equal
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - validations[priority=74]
          - errors[ERR_CLOCK_NOT_MONOTONIC]
        distinguishing_aspect: "The logical clock is monotonic non-decreasing: moving it backwards is 422 ERR_CLOCK_NOT_MONOTONIC and leaves the clock where it was, while re-setting it to its current value is accepted — the guard is 'current_utc < present', not '<='."
        test_recipe:
          setup:
            - "Fresh instance; the clock is set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-31T23:59:59Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fraud/customers"
              payload: { email: "clock@example.com", home_country: "US" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          assert:
            - "First trigger call: HTTP status == 422 and data.error_id == ERR_CLOCK_NOT_MONOTONIC"
            - "Second trigger call: HTTP status == 200 with current_utc == 2026-08-01T00:00:00Z"
            - "Customer.${cust_id}.created_at == 2026-08-01T00:00:00Z, proving the failed rewind never took effect"

      - name: uniqueness_on_device_hash_and_rule_code_rejected
        claim_type: standard_crud
        grounds:
          - validations[priority=80]
          - validations[priority=81]
          - errors[ERR_DUPLICATE_DEVICE_HASH]
          - errors[ERR_DUPLICATE_RULE_CODE]
        distinguishing_aspect: "Two different uniqueness scopes: device_hash is globally unique (409 ERR_DUPLICATE_DEVICE_HASH), while a rule code is unique only WITHIN its pack — re-using BEH_FAST_CHECKOUT in the same pack is 409 ERR_DUPLICATE_RULE_CODE but the identical code in a second pack is accepted."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; device D1 with device_hash 'dev-uniq-001'; DRAFT packs PA and PB, each with a valid window and PB's window disjoint from PA's."
            - "Pack PA already holds rule BEH_FAST_CHECKOUT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fraud/devices"
              payload: { device_hash: "dev-uniq-001", tz_offset_minutes: -480 }
              as: CheckoutService
              captures: { dev_id: $.data.id }
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "PA", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { pack_a_id: $.data.id }
            - call: "POST /fraud/rule-packs/${pack_a_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 20, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "PB", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2027-02-01T00:00:00Z", effective_until: "2027-06-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { pack_b_id: $.data.id }
          trigger:
            - call: "POST /fraud/devices"
              payload: { device_hash: "dev-uniq-001", tz_offset_minutes: 60 }
              as: CheckoutService
            - call: "POST /fraud/rule-packs/${pack_a_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 30, evaluation_order: 20, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs/${pack_b_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 30, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
          assert:
            - "First trigger call: HTTP status == 409 and data.error_id == ERR_DUPLICATE_DEVICE_HASH"
            - "GET /fraud/devices returns total_count == 1 and DeviceProfile.${dev_id}.tz_offset_minutes == -480"
            - "Second trigger call: HTTP status == 409 and data.error_id == ERR_DUPLICATE_RULE_CODE"
            - "RulePack.${pack_a_id}.rule_count == 1"
            - "Third trigger call: HTTP status == 201"
            - "RulePack.${pack_b_id}.rule_count == 1"

      - name: assessment_list_filters_compose_across_state_and_decision
        claim_type: standard_crud
        grounds:
          - endpoints[GET /fraud/checkout-assessments]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Independent filters intersect rather than union: with one APPROVE, one DECLINE and one PENDING_SIGNALS row for the same customer, state=DECIDED_APPROVE returns 1, decision=DECLINE returns 1, and customer_id + state=PENDING_SIGNALS returns 1, while an unfiltered read returns all 3."
        test_recipe:
          setup:
            - "BOOT-W. Assessment X1 (p 0.4021) scored to DECIDED_APPROVE; X2 (p 0.6806) scored to DECIDED_DECLINE; X3 created and left PENDING_SIGNALS. All three belong to cust_id."
          setup_api_calls:
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
              captures: { x1_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${x1_id}/score"
              payload: {}
              as: CheckoutService
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.6806 }
              as: CheckoutService
              captures: { x2_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${x2_id}/score"
              payload: {}
              as: CheckoutService
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
              captures: { x3_id: $.data.id }
          trigger:
            - call: "GET /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}" }
              as: RiskAnalyst
              as_user_id: "${an1_id}"
            - call: "GET /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", state: "DECIDED_APPROVE" }
              as: RiskAnalyst
              as_user_id: "${an1_id}"
            - call: "GET /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", decision: "DECLINE" }
              as: RiskAnalyst
              as_user_id: "${an1_id}"
            - call: "GET /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", state: "PENDING_SIGNALS", limit: 1, offset: 0 }
              as: RiskAnalyst
              as_user_id: "${an1_id}"
          assert:
            - "An Analyst row exists whose id is used as ${an1_id} for the RiskAnalyst identity on these reads"
            - "First trigger call: total_count == 3 and has_more == false"
            - "Second trigger call: total_count == 1 with data[0].id == ${x1_id}"
            - "Third trigger call: total_count == 1 with data[0].id == ${x2_id}"
            - "Fourth trigger call: total_count == 1, limit == 1, has_more == false, data[0].id == ${x3_id} and data[0].blended_score == null"

      - name: case_assign_links_case_to_analyst_and_needs_both_rows
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /fraud/review-cases/{id}/assign]
          - validations[priority=11]
          - errors[ERR_ANALYST_NOT_FOUND]
        distinguishing_aspect: "The assign endpoint is a two-sided link: an unknown analyst_id in the body is 404 ERR_ANALYST_NOT_FOUND (body FK resolution at priority 11) before any OCC or capacity work, and the successful call writes both sides — case.assigned_analyst_id and the analyst's open_case_count."
        test_recipe:
          setup:
            - "BOOT-W plus one REVIEW assessment (p 0.5417 -> blended 50.00) producing case C1 in QUEUED with primary_signal_family BEHAVIORAL."
            - "Analyst AN1: SENIOR, [BEHAVIORAL], capacity 2, version 1."
          setup_api_calls:
            - call: "POST /fraud/analysts"
              payload: { display_name: "AN1", seniority: "SENIOR", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 2 }
              as: PlatformAdmin
              captures: { an1_id: $.data.id, an1_v: $.data.version }
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.5417 }
              as: CheckoutService
              captures: { asmt_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${asmt_id}/score"
              payload: {}
              as: CheckoutService
            - call: "GET /fraud/review-cases"
              payload: { assessment_id: "${asmt_id}" }
              as: ReviewLead
              as_user_id: "${an1_id}"
              captures: { case_id: "$.data[0].id" }
          trigger:
            - call: "POST /fraud/review-cases/${case_id}/assign"
              payload: { analyst_id: "00000000-0000-0000-0000-000000000000", expected_analyst_version: "${an1_v}" }
              as: ReviewLead
              as_user_id: "${an1_id}"
            - call: "POST /fraud/review-cases/${case_id}/assign"
              payload: { analyst_id: "${an1_id}", expected_analyst_version: "${an1_v}" }
              as: ReviewLead
              as_user_id: "${an1_id}"
          assert:
            - "First trigger call: HTTP status == 404 and data.error_id == ERR_ANALYST_NOT_FOUND"
            - "ReviewCase.${case_id}.state == QUEUED after the failed link"
            - "Second trigger call: HTTP status == 200"
            - "ReviewCase.${case_id}.state == ASSIGNED, assigned_analyst_id == ${an1_id}, assigned_at == 2026-08-01T00:00:00Z, version == 2"
            - "Analyst.${an1_id}.open_case_count == 1 and version == 2"
            - "GET /fraud/review-cases?assigned_analyst_id=${an1_id} returns total_count == 1"

      - name: rule_added_after_pack_activation_rejected
        claim_type: conditional_action
        grounds:
          - validations[priority=46]
          - errors[ERR_RULE_PACK_NOT_DRAFT]
          - endpoints[POST /fraud/rule-packs/{id}/rules]
        distinguishing_aspect: "Rule authoring is conditional on pack status: the same POST that succeeded while the pack was DRAFT becomes 409 ERR_RULE_PACK_NOT_DRAFT once the pack is ACTIVE, and a second activate attempt hits the same gate — an ACTIVE pack is frozen for both content and lifecycle."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; pack P-frozen created by eng-author-1 with one rule, then activated by eng-approver-2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P-frozen", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { pack_id: $.data.id }
            - call: "POST /fraud/rule-packs/${pack_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 20, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs/${pack_id}/activate"
              payload: {}
              as: PolicyEngineer
              as_user_id: "eng-approver-2"
          trigger:
            - call: "POST /fraud/rule-packs/${pack_id}/rules"
              payload: { code: "DEV_EMULATOR", signal_family: "DEVICE", points: 45, evaluation_order: 5, hard_decline: true }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs/${pack_id}/activate"
              payload: {}
              as: PolicyEngineer
              as_user_id: "eng-approver-3"
          assert:
            - "Both trigger calls: HTTP status == 409 and data.error_id == ERR_RULE_PACK_NOT_DRAFT"
            - "RulePack.${pack_id}.status == ACTIVE and rule_count == 1"
            - "RulePack.${pack_id}.activated_by_user_id == \"eng-approver-2\""
            - "GET /fraud/rule-packs/${pack_id}/rules returns total_count == 1 with data[0].code == BEH_FAST_CHECKOUT"

      - name: rule_pack_performance_is_a_computed_read
        claim_type: computed_read
        grounds:
          - endpoints[GET /fraud/rule-packs/{id}/performance]
        excluded_because:
          difficulty_instance: insult_rate_decision_cohort_vs_good_customer_cohort
          rationale: "That instance reads the same computed endpoint under both cohorts and asserts every reported field against hand-computed values, which is the computed_read claim in full."

  # ===========================================================================
  # Every error_id in §1.6 must be triggerable. The instances below cover the
  # error families that no other section reaches; the remaining error ids are
  # each triggered by a named instance elsewhere in this file or in §1.8.
  - section: errors
    instances:

      - name: challenge_expire_before_ttl_rejected_but_allowed_at_the_boundary
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CHALLENGE_NOT_EXPIRED]
          - validations[priority=50]
          - state_machines.AuthEvent.transitions[ISSUED->EXPIRED]
        distinguishing_aspect: "EXPIRE is guarded by 'current_utc >= challenge_expires_at': one instant early it is 409 ERR_CHALLENGE_NOT_EXPIRED, and at exactly challenge_expires_at (issue instant + CHALLENGE_TTL_SECONDS = 900) it succeeds, leaving ato_posture at WATCH rather than clearing it."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; customer CU1 (home_country US) and device D1."
            - "AuthEvent AE1 is created with event_type PASSWORD_CHANGE and ip_country GB: ato_score = 25.00 base + 25.00 geo + 20.00 first-seen device + 0.00 failed = 70.00, which lands in the STEP_UP band, so outcome STEP_UP_REQUIRED, challenge_state ISSUED, challenge_expires_at 2026-08-01T00:15:00Z, and CU1.ato_posture moves CLEAR -> WATCH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fraud/customers"
              payload: { email: "ato@example.com", home_country: "US" }
              as: CheckoutService
              captures: { cust_id: $.data.id }
            - call: "POST /fraud/devices"
              payload: { device_hash: "dev-ato-001", tz_offset_minutes: 0 }
              as: CheckoutService
              captures: { dev_id: $.data.id }
            - call: "POST /fraud/auth-events"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", event_type: "PASSWORD_CHANGE", ip_country: "GB" }
              as: CheckoutService
              captures: { ae_id: $.data.id }
          trigger:
            - call: "POST /fraud/auth-events/${ae_id}/challenge"
              payload: { action: "EXPIRE" }
              as: CheckoutService
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:15:00Z" }
              as: PlatformAdmin
            - call: "POST /fraud/auth-events/${ae_id}/challenge"
              payload: { action: "EXPIRE" }
              as: CheckoutService
          assert:
            - "AuthEvent.${ae_id}.ato_score == 70.00, outcome == STEP_UP_REQUIRED, challenge_state == ISSUED, challenge_method == OTP_SMS, challenge_expires_at == 2026-08-01T00:15:00Z"
            - "Customer.${cust_id}.ato_posture == WATCH"
            - "First trigger call: HTTP status == 409 and data.error_id == ERR_CHALLENGE_NOT_EXPIRED"
            - "Third trigger call: HTTP status == 200 and AuthEvent.${ae_id}.challenge_state == EXPIRED"
            - "Customer.${cust_id}.ato_posture == WATCH (expiry does not clear the posture)"
            - "Customer.${cust_id}.failed_login_count == 0"

      - name: challenge_pass_from_failed_state_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CHALLENGE_STATE_INVALID]
          - validations[priority=48]
        distinguishing_aspect: "PASS requires challenge_state ISSUED: after a single FAIL the challenge sits in FAILED, so a PASS inside the still-valid TTL is 409 ERR_CHALLENGE_STATE_INVALID (the state gate at priority 48, not the expiry gate at 49), and the failed_login_count earned by the FAIL is not rolled back."
        test_recipe:
          setup:
            - "As above through AE1 in challenge_state ISSUED with expiry 2026-08-01T00:15:00Z; the clock stays at 2026-08-01T00:00:00Z."
            - "One FAIL has been recorded, so challenge_attempts == 1, challenge_state == FAILED and Customer.failed_login_count == 1 (below MAX_CHALLENGE_ATTEMPTS 3, so no containment)."
          setup_api_calls:
            - call: "POST /fraud/auth-events/${ae_id}/challenge"
              payload: { action: "FAIL" }
              as: CheckoutService
          trigger:
            - call: "POST /fraud/auth-events/${ae_id}/challenge"
              payload: { action: "PASS" }
              as: CheckoutService
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_CHALLENGE_STATE_INVALID"
            - "AuthEvent.${ae_id}.challenge_state == FAILED and challenge_attempts == 1"
            - "Customer.${cust_id}.failed_login_count == 1"
            - "Customer.${cust_id}.ato_posture == WATCH and account_status == ACTIVE"

      - name: challenge_pass_after_ttl_expiry_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CHALLENGE_EXPIRED]
          - validations[priority=49]
          - global_constants.CHALLENGE_TTL_SECONDS
        distinguishing_aspect: "The expiry gate is inclusive at the deadline: with challenge_state still ISSUED and the clock advanced to exactly challenge_expires_at, PASS is 409 ERR_CHALLENGE_EXPIRED and the WATCH posture is not cleared — an expired step-up can never be retro-satisfied."
        test_recipe:
          setup:
            - "As above through AE1 in challenge_state ISSUED with challenge_expires_at 2026-08-01T00:15:00Z and no FAIL recorded."
            - "The clock is advanced to exactly 2026-08-01T00:15:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:15:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fraud/auth-events/${ae_id}/challenge"
              payload: { action: "PASS" }
              as: CheckoutService
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_CHALLENGE_EXPIRED"
            - "AuthEvent.${ae_id}.challenge_state == ISSUED (the failed PASS does not advance the challenge)"
            - "Customer.${cust_id}.ato_posture == WATCH"
            - "Customer.${cust_id}.failed_login_count == 0"

      - name: rule_pack_weights_and_bands_rejected_in_priority_order
        claim_type: error_triggerable
        grounds:
          - errors[ERR_WEIGHTS_NOT_NORMALIZED]
          - errors[ERR_INVALID_SCORE_BANDS]
          - validations[priority=84]
          - validations[priority=85]
        distinguishing_aspect: "Both pack-shape invariants are enforced at creation and their relative order is pinned: weights summing to 0.90 give 422 ERR_WEIGHTS_NOT_NORMALIZED, equal floors give 422 ERR_INVALID_SCORE_BANDS, and a request breaking both returns the weights error because priority 84 precedes 85."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no rule packs exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P-bad-weights", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.50, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P-bad-bands", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 60.00, decline_floor_score: 60.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P-bad-both", blend_mode: "RULE_DOMINANT", rule_weight: 0.30, model_weight: 0.30, review_floor_score: 70.00, decline_floor_score: 50.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
          assert:
            - "First trigger call: HTTP status == 422 and data.error_id == ERR_WEIGHTS_NOT_NORMALIZED"
            - "Second trigger call: HTTP status == 422 and data.error_id == ERR_INVALID_SCORE_BANDS"
            - "Third trigger call: HTTP status == 422 and data.error_id == ERR_WEIGHTS_NOT_NORMALIZED (84 before 85)"
            - "GET /fraud/rule-packs returns total_count == 0"

      - name: exception_decided_by_its_own_requester_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DECISION_SEGREGATION_VIOLATION]
          - validations[priority=57]
          - endpoints[POST /fraud/policy-exceptions/{id}/decision]
        distinguishing_aspect: "The requester identity is compared against the decider identity even when the acting role is legitimately ReviewLead: the analyst who filed the exception cannot approve it (409 ERR_DECISION_SEGREGATION_VIOLATION) while a second lead can, and only the successful decision moves Customer.version."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; customer CU1 tier HIGH_VALUE (version 1)."
            - "Two analysts exist with seniority LEAD: LEAD1 and LEAD2."
            - "Exception E1 (scope AUTO_APPROVE_UNDER_AMOUNT, max_amount_cents 100000) was requested with X-User-ID LEAD1, so requested_by_analyst_id == LEAD1 and CU1.version is still 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fraud/customers"
              payload: { email: "sod@example.com", home_country: "US", tier: "HIGH_VALUE" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id, cust_v: $.data.version }
            - call: "POST /fraud/analysts"
              payload: { display_name: "LEAD1", seniority: "LEAD", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 3 }
              as: PlatformAdmin
              captures: { lead1_id: $.data.id }
            - call: "POST /fraud/analysts"
              payload: { display_name: "LEAD2", seniority: "LEAD", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 3 }
              as: PlatformAdmin
              captures: { lead2_id: $.data.id }
            - call: "POST /fraud/policy-exceptions"
              payload: { customer_id: "${cust_id}", scope: "AUTO_APPROVE_UNDER_AMOUNT", max_amount_cents: 100000, effective_from: "2026-08-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", justification: "long-standing high value buyer" }
              as: RiskAnalyst
              as_user_id: "${lead1_id}"
              captures: { exc_id: $.data.id }
          trigger:
            - call: "POST /fraud/policy-exceptions/${exc_id}/decision"
              payload: { action: "APPROVE", expected_customer_version: "${cust_v}", decision_note: "self approval attempt" }
              as: ReviewLead
              as_user_id: "${lead1_id}"
            - call: "POST /fraud/policy-exceptions/${exc_id}/decision"
              payload: { action: "APPROVE", expected_customer_version: "${cust_v}", decision_note: "peer approved" }
              as: ReviewLead
              as_user_id: "${lead2_id}"
          assert:
            - "First trigger call: HTTP status == 409 and data.error_id == ERR_DECISION_SEGREGATION_VIOLATION"
            - "PolicyException.${exc_id}.state == REQUESTED and Customer.${cust_id}.version == 1 after the refusal"
            - "Second trigger call: HTTP status == 200"
            - "PolicyException.${exc_id}.state == APPROVED, approved_by_analyst_id == ${lead2_id}, decided_at == 2026-08-01T00:00:00Z"
            - "Customer.${cust_id}.version == 2"

      - name: assessment_creation_without_active_pack_then_model_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NO_ACTIVE_RULE_PACK]
          - errors[ERR_NO_ACTIVE_RISK_MODEL]
          - validations[priority=64]
        distinguishing_aspect: "Assessment creation pins both a pack and a model, and the two missing-prerequisite errors are ordered: with neither present the answer is ERR_NO_ACTIVE_RULE_PACK, and only after a pack is ACTIVE does the same request surface ERR_NO_ACTIVE_RISK_MODEL."
        test_recipe:
          setup:
            - "MINI-3 only: clock at 2026-08-01T00:00:00Z with one customer, one device and one address. No RulePack and no RiskModel exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fraud/customers"
              payload: { email: "noboot@example.com", home_country: "US" }
              as: CheckoutService
              captures: { cust_id: $.data.id }
            - call: "POST /fraud/devices"
              payload: { device_hash: "dev-noboot", tz_offset_minutes: 0 }
              as: CheckoutService
              captures: { dev_id: $.data.id }
            - call: "POST /fraud/addresses"
              payload: { line1: "40 Bootstrap Blvd", postal_code: "94105", country_code: "US" }
              as: CheckoutService
              captures: { addr_id: $.data.id }
          trigger:
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P1", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { pack_id: $.data.id }
            - call: "POST /fraud/rule-packs/${pack_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 20, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs/${pack_id}/activate"
              payload: {}
              as: PolicyEngineer
              as_user_id: "eng-approver-2"
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
          assert:
            - "First trigger call: HTTP status == 422 and data.error_id == ERR_NO_ACTIVE_RULE_PACK"
            - "Last trigger call: HTTP status == 422 and data.error_id == ERR_NO_ACTIVE_RISK_MODEL"
            - "GET /fraud/checkout-assessments?customer_id=${cust_id} returns total_count == 0"
            - "RulePack.${pack_id}.status == ACTIVE"

      - name: case_resolution_by_a_non_owning_analyst_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NOT_CASE_OWNER]
          - validations[priority=65]
          - roles.RiskAnalyst.shared_operations
        distinguishing_aspect: "For the RiskAnalyst role the resolve endpoint is owner-scoped: a second analyst holding no claim on the case gets 403 ERR_NOT_CASE_OWNER, while the assigned analyst's identical request succeeds and moves both the case and its assessment to their approve terminals."
        test_recipe:
          setup:
            - "BOOT-W plus a REVIEW assessment (amount_cents 20000, p 0.5417 -> blended 50.00) whose case C1 is ASSIGNED to AN1."
            - "AN2 exists with the same skill family but holds no case."
          setup_api_calls:
            - call: "POST /fraud/analysts"
              payload: { display_name: "AN1", seniority: "SENIOR", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 2 }
              as: PlatformAdmin
              captures: { an1_id: $.data.id, an1_v: $.data.version }
            - call: "POST /fraud/analysts"
              payload: { display_name: "AN2", seniority: "SENIOR", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 2 }
              as: PlatformAdmin
              captures: { an2_id: $.data.id }
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.5417 }
              as: CheckoutService
              captures: { asmt_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${asmt_id}/score"
              payload: {}
              as: CheckoutService
            - call: "GET /fraud/review-cases"
              payload: { assessment_id: "${asmt_id}" }
              as: ReviewLead
              as_user_id: "${an1_id}"
              captures: { case_id: "$.data[0].id" }
            - call: "POST /fraud/review-cases/${case_id}/assign"
              payload: { analyst_id: "${an1_id}", expected_analyst_version: "${an1_v}" }
              as: ReviewLead
              as_user_id: "${an1_id}"
          trigger:
            - call: "POST /fraud/review-cases/${case_id}/resolve"
              payload: { action: "APPROVE", resolution_note: "looks fine to me" }
              as: RiskAnalyst
              as_user_id: "${an2_id}"
            - call: "POST /fraud/review-cases/${case_id}/resolve"
              payload: { action: "APPROVE", resolution_note: "verified by owner" }
              as: RiskAnalyst
              as_user_id: "${an1_id}"
          assert:
            - "First trigger call: HTTP status == 403 and data.error_id == ERR_NOT_CASE_OWNER"
            - "ReviewCase.${case_id}.state == ASSIGNED after the refusal and Analyst.${an1_id}.open_case_count == 1"
            - "Second trigger call: HTTP status == 200"
            - "ReviewCase.${case_id}.state == RESOLVED_APPROVE, resolved_at == 2026-08-01T00:00:00Z, resolved_late == false"
            - "Analyst.${an1_id}.open_case_count == 0 and resolved_case_count == 1"
            - "Analyst.${an2_id}.open_case_count == 0 and resolved_case_count == 0"
            - "CheckoutAssessment.${asmt_id}.state == DECIDED_APPROVE, decision == REVIEW, decision_reason == MANUAL_REVIEW, final_disposition == APPROVED"
            - "Customer.${cust_id}.approved_count == 1 and lifetime_net_approved_cents == 20000"

      - name: risk_model_training_cutoff_in_the_future_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TRAINING_CUTOFF_IN_FUTURE]
          - validations[priority=73]
          - endpoints[POST /fraud/risk-models]
        distinguishing_aspect: "The cutoff must not be strictly after the logical clock: a cutoff one month ahead is 422 ERR_TRAINING_CUTOFF_IN_FUTURE, while a cutoff exactly equal to the current clock is accepted and leaves the model in DRAFT with training_segment_counts still null."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no risk models exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fraud/risk-models"
              payload: { model_version_label: "M-future", calibration_intercept: 0.05, calibration_slope: 1.20, trained_on_chargeback_cutoff_at: "2026-09-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/risk-models"
              payload: { model_version_label: "M-now", calibration_intercept: 0.05, calibration_slope: 1.20, trained_on_chargeback_cutoff_at: "2026-08-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { model_id: $.data.id }
          assert:
            - "First trigger call: HTTP status == 422 and data.error_id == ERR_TRAINING_CUTOFF_IN_FUTURE"
            - "Second trigger call: HTTP status == 201"
            - "RiskModel.${model_id}.status == DRAFT"
            - "RiskModel.${model_id}.trained_on_chargeback_cutoff_at == 2026-08-01T00:00:00Z"
            - "RiskModel.${model_id}.training_segment_counts == null"
            - "RiskModel.${model_id}.scored_assessment_count == 0"
            - "GET /fraud/risk-models returns total_count == 1"

  # ===========================================================================
  - section: rbac
    instances:

      - name: checkout_service_cannot_author_rule_packs
        claim_type: unauthorized_denial
        grounds:
          - roles.CheckoutService.forbidden
          - roles.PolicyEngineer.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=3]
        distinguishing_aspect: "The role gate at priority 3 precedes every body check: CheckoutService posting a perfectly well-formed rule pack gets 403 ERR_UNAUTHORIZED, not a 422, and nothing is persisted."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; no rule packs exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P-forbidden", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: CheckoutService
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P-forbidden-2", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.50, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: CheckoutService
          assert:
            - "Both trigger calls: HTTP status == 403 and data.error_id == ERR_UNAUTHORIZED"
            - "The second call returns ERR_UNAUTHORIZED rather than ERR_WEIGHTS_NOT_NORMALIZED, proving priority 3 runs before priority 84"
            - "GET /fraud/rule-packs returns total_count == 0"

      - name: risk_analyst_cannot_staff_the_queue_or_decide_exceptions
        claim_type: exclusive_operations
        grounds:
          - roles.ReviewLead.exclusive_operations
          - roles.RiskAnalyst.forbidden
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Queue staffing and exception decisions are ReviewLead-exclusive: the same Analyst row acting as RiskAnalyst is refused on assign, auto-assign and decision with 403 ERR_UNAUTHORIZED, even though that analyst is the one who would work the case."
        test_recipe:
          setup:
            - "BOOT-W plus a REVIEW assessment whose case C1 is QUEUED (primary_signal_family BEHAVIORAL)."
