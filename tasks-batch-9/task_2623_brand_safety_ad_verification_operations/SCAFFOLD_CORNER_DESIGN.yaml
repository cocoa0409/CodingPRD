              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_view_id: $.data.id }
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Banner run", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY", target_coverage_rate: 0.75 }
              as: Advertiser
