      - name: encoder_pool_is_multiplex_wide_with_releases_before_claims
        claim_type: Aggregate
        grounds: "§1.3 live_encoder_concurrency_peak (half-open occupancy [join_utc, breakaway_utc), releases sorted before claims at the same instant, 'peak == total is accepted; peak == total + 1 is refused', 'windows on sibling channels of the same multiplex ARE included'); §1.4 priorities 37, 39, 48"
        distinguishing_aspect: "The encoder pool is a multiplex-level sweep, so a window on a sibling channel can exhaust it, and the rule ordering shows through: an over-capacity request on a channel with no ON_AIR playlist returns ERR_ENCODER_CAPACITY_EXCEEDED (39) rather than ERR_ANCHOR_ITEM_NOT_FOUND (48), while a back-to-back request that fits returns the anchor error instead — proving the release-before-claim tie-break was applied."
        test_recipe:
          setup: "Reference air graph on ch1 (multiplex MUX-A, live_encoder_units_total 2). ch2 shares the multiplex and has no ARMED or ON_AIR playlist."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "POST /network-feed-windows"
              payload:
                channel_id: "${ch1_id}"
                feed_source: NETWORK_PRIMARY
                anchor_sequence_number: 4
                join_utc: "2026-08-01T12:20:00Z"
                breakaway_utc: "2026-08-01T12:22:00Z"
                backtiming_mode: TOLERANT
                guard_seconds: 2
                live_encoder_units: 2
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { fw_cap_id: "$.data.id" }
            - call: "POST /network-feed-windows"
              payload:
                channel_id: "${ch2_id}"
                feed_source: NETWORK_ALTERNATE
                anchor_sequence_number: 4
                join_utc: "2026-08-01T12:21:00Z"
                breakaway_utc: "2026-08-01T12:23:00Z"
                backtiming_mode: TOLERANT
                guard_seconds: 2
                live_encoder_units: 1
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { e_encoder: "$.data.error_id" }
            - call: "POST /network-feed-windows"
              payload:
                channel_id: "${ch2_id}"
                feed_source: NETWORK_ALTERNATE
                anchor_sequence_number: 4
                join_utc: "2026-08-01T12:22:00Z"
                breakaway_utc: "2026-08-01T12:24:00Z"
                backtiming_mode: TOLERANT
                guard_seconds: 2
                live_encoder_units: 2
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { e_anchor_missing: "$.data.error_id" }
            - call: "POST /network-feed-windows"
              payload:
                channel_id: "${ch1_id}"
                feed_source: NETWORK_PRIMARY
                anchor_sequence_number: 4
                join_utc: "2026-08-01T12:22:02Z"
                breakaway_utc: "2026-08-01T12:24:00Z"
                backtiming_mode: TOLERANT
                guard_seconds: 2
                live_encoder_units: 2
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { e_window_overlap: "$.data.error_id" }
          assert:
            - "${fw_cap_id} is accepted at exactly the pool size: Multiplex.${mux1_id}.live_encoder_units_peak == 2 == live_encoder_units_total (equality is accepted)"
            - "${e_encoder} == ERR_ENCODER_CAPACITY_EXCEEDED with status 409 — the sibling-channel window overlaps [12:20:00, 12:22:00) and would drive the peak to 3, and this rule (priority 39) fires even though ch2 also has no anchor item (priority 48)"
            - "${e_anchor_missing} == ERR_ANCHOR_ITEM_NOT_FOUND with status 404 — the back-to-back window claiming 2 units at exactly 12:22:00 passes the encoder sweep because the release at 12:22:00 is applied before the claim, so the failure moves to the later anchor rule"
            - "${e_window_overlap} == ERR_FEED_WINDOW_OVERLAP with status 409 — on the SAME channel the guarded closed interval [12:22:00, 12:26:02] touches ${fw_cap_id}'s guarded breakaway instant 12:22:02, and one second later would be accepted"
            - "Multiplex.${mux1_id}.live_encoder_units_peak is still 2 after all three rejections, and GET /channels/${ch1_id}/feed-windows returns total_count 1"
            - "a window in state BROKEN_AWAY or ABANDONED leaves the sweep entirely, which is how a completed join frees its units for a later overlapping window"

      - name: qc_score_thresholds_are_inclusive_and_critical_defects_override_the_score
