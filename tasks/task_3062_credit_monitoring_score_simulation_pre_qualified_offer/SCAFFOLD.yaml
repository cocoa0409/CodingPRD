# =============================================================================
# PRD Benchmark Scaffold — Credit Monitoring, Score Simulation &
# Pre-Qualified Offer Matching (Credit Karma)
# Task: task_3062_credit_monitoring_score_simulation_pre_qualified_offer
# =============================================================================

scenario: |
  Credit Monitoring, Score Simulation & Pre-Qualified Offer Matching (Credit Karma): soft-pull bureau data refresh with score change alerts and factor explanations, offer marketplace matching consumers to card, loan and insurance offers with modeled approval odds, lender-provided targeting criteria applied without transmitting consumer data until consent, approval-odds calibration measured against realized outcomes, dispute referral and credit report inaccuracy education, revenue recognition on funded referrals with clawback for reversed originations, simulator that projects score effects of hypothetical actions, adverse selection controls preventing over-presentation of offers a consumer cannot obtain

domain_name: credit-monitoring-offer-matching
api_prefix: /credit

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - scheduled_deferred_actions
    - ops_run_checkpoint
    - derived_field_reconciliation
    - dual_variant_calculation
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: eventual

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: Consumer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Consumer legal name" }
      - { name: email, type: string, source: input, description: "Account email; unique across Consumers" }
      - { name: state_code, type: string, source: input, description: "Two-letter residence state; drives eligible LenderPrograms (states_served)" }
      - { name: dti_pct, type: number, source: input, description: "Consumer-stated debt-to-income percentage; the operand of every DTI_PCT TargetingCriterion and the D input of compute_modeled_approval_odds" }
      - { name: bureau_pin, type: string, source: input, description: "Soft-pull bureau enrollment PIN" }
      - { name: monitoring_consent_at, type: datetime, source: system, description: "Set to the logical clock when POST /consumers/{id}/monitoring-consent succeeds; null until then" }
      - { name: score_version, type: integer, source: system, default: 0, description: "Monotonic pull counter = count of this consumer's BureauSnapshots whose status is not CANCELLED; the next pull pins snapshot_ordinal = score_version + 1" }
      - { name: current_score, type: integer, source: computed, description: "Score of the BureauSnapshot holding the highest snapshot_ordinal for this consumer, regardless of that snapshot's status; null when score_version == 0" }
      - { name: previous_score, type: integer, source: computed, description: "Score of the BureauSnapshot holding the second-highest snapshot_ordinal for this consumer; null when score_version <= 1" }
      - { name: utilization_pct, type: computed, description: "overall_credit_utilization_pct of the BureauSnapshot holding the highest snapshot_ordinal; null when score_version == 0" }
      - { name: open_dispute_count, type: integer, source: computed, default: 0, description: "Count of DisputeReferrals in status SUBMITTED_OFFLINE or ACKNOWLEDGED_BY_BUREAU" }

  - name: BureauSnapshot
    parent: Consumer
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id; the monitored consumer" }
      - { name: snapshot_ordinal, type: integer, source: computed, description: "1-based monotonic pull counter within the Consumer; pinned as consumer.score_version + 1 at pull time" }
      - { name: pulled_at, type: datetime, source: system, description: "Logical clock instant of the pull; equal to the clock at POST /consumers/{id}/bureau-snapshots" }
      - { name: score, type: integer, source: input, description: "Bureau risk score for this pull" }
      - { name: added_account_count, type: integer, source: input, description: "New tradelines reported since the previous pull" }
      - { name: total_revolving_balance_cents, type: integer, source: input, description: "Total revolving balance reported" }
      - { name: credit_limit_total_cents, type: integer, source: input, description: "Total revolving credit limit reported" }
      - { name: overall_credit_utilization_pct, type: number, source: computed, description: "round_half_up(total_revolving_balance_cents * 100 / credit_limit_total_cents, 2); 0.0 when credit_limit_total_cents == 0" }
      - { name: factor_codes, type: array, source: input, description: "Ordered list of score-factor codes, lowercase snake_case, deduplicated on ingest preserving first-occurrence order; drives ScoreFactorExplanation rows" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED" }

  - name: ScoreFactorExplanation
    parent: BureauSnapshot
    common_fields: false
    fields:
      - { name: snapshot_id, type: string, source: system, description: "FK -> BureauSnapshot.id; the snapshot that produced this factor" }
      - { name: factor_code, type: string, source: input, description: "Bureau factor code, lowercase snake_case" }
      - { name: direction, type: enum, source: computed, description: "UP | DOWN | NEUTRAL — derived from factor_code via scoring_factor_explanations" }
      - { name: impact_points, type: integer, source: computed, description: "Signed score impact from scoring_factor_explanations.impact_points" }
      - { name: rank_index, type: integer, source: computed, description: "0-based position = index of factor_code in the parent snapshot's normalized factor_codes array" }

  - name: ScoreAlert
    parent: Consumer
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id" }
      - { name: alert_kind, type: enum, source: computed, description: "SCORE_UP | SCORE_DOWN | SCORE_FLAT" }
      - { name: threshold_used, type: integer, source: computed, description: "effective alert threshold at evaluation time: max(consumer threshold_override_points, SCORE_ALERT_DEFAULT_THRESHOLD)" }
      - { name: from_score, type: integer, source: system, description: "consumer.previous_score at evaluation time" }
      - { name: to_score, type: integer, source: system, description: "consumer.current_score at evaluation time" }
      - { name: channel, type: enum, source: input, description: "EMAIL | PUSH | SMS — channel requested when the alert was generated" }
      - { name: status, type: enum, source: system, description: "PENDING → DELIVERED | SUPPRESSED" }
      - { name: evaluated_at, type: datetime, source: system, description: "Logical clock instant of evaluation" }

  - name: ScoreSimulation
    parent: Consumer
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id" }
      - { name: baseline_ordinal, type: integer, source: system, description: "consumer.score_version at simulation time; pinned so the projection is reproducible" }
      - { name: baseline_score, type: integer, source: system, description: "consumer.current_score at simulation time" }
      - { name: base_utilization_pct, type: number, source: system, description: "consumer.utilization_pct at simulation time; the utilization input of the recursive projection" }
      - { name: actions, type: array, source: input, description: "Ordered list of { action_code, amount_cents? } objects, length 1..5, order-significant" }
      - { name: projected_score, type: integer, source: computed, description: "Projected score from simulate_score_delta with variant PROJECTED applied" }
      - { name: delta_points, type: integer, source: computed, description: "projected_score - baseline_score" }
      - { name: tier_code, type: enum, source: computed, description: "Tier containing projected_score per the SCORE_TIER_* breakpoints" }
      - { name: status, type: enum, source: system, description: "DRAFT → FINALIZED (auto, synchronously on creation) | FAILED" }

  - name: ProductCatalogItem
    parent: null
    common_fields: true
    fields:
      - { name: product_kind, type: enum, source: input, description: "CARD | LOAN | INSURANCE" }
      - { name: product_name, type: string, source: input, description: "Display name" }
      - { name: min_score, type: integer, source: input, description: "Inclusive minimum modeled score band accepted by this product" }
      - { name: max_score, type: integer, source: input, description: "Inclusive maximum modeled score band accepted by this product" }
      - { name: max_dti_pct, type: number, source: input, description: "Inclusive maximum debt-to-income percentage accepted by this product" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE → RETIRED" }

  - name: Lender
    parent: null
    common_fields: true
    fields:
      - { name: lender_name, type: string, source: input, description: "Display name of the lender" }
      - { name: compliance_status, type: enum, source: system, description: "APPROVED → SUSPENDED → BANNED" }
      - { name: states_served, type: array, source: input, description: "Two-letter state codes this lender may serve; drives offer eligibility" }
      - { name: status, type: enum, source: system, description: "ONBOARDING → ACTIVE → OFFBOARDED" }

  - name: LenderProgram
    parent: Lender
    common_fields: true
    fields:
      - { name: lender_id, type: string, source: system, description: "FK -> Lender.id; the sponsor of this program" }
      - { name: product_catalog_item_id, type: string, source: input, description: "FK -> ProductCatalogItem.id; the product this program markets" }
      - { name: program_name, type: string, source: input, description: "Display name" }
      - { name: program_code, type: string, source: input, description: "Short code; unique across LenderPrograms" }
      - { name: min_modeled_score, type: integer, source: input, description: "Inclusive minimum modeled score the lender will consider" }
      - { name: max_dti_pct, type: number, source: input, description: "Inclusive maximum DTI the lender will consider" }
      - { name: max_eligible_utilization_pct, type: number, source: input, description: "Inclusive maximum overall credit utilization the lender will consider" }
      - { name: annual_fee_cents, type: integer, source: input, description: "Annual fee; feed for fee_breakeven_months" }
      - { name: intro_apr_bps, type: integer, source: input, description: "Introductory APR; feed for fee_breakeven_months" }
      - { name: go_live_at, type: datetime, source: input, description: "ISO 8601 instant the program becomes deliverable; drives program_deliverability_gate" }
      - { name: expiry_at, type: datetime, source: input, description: "ISO 8601 instant the program stops being deliverable; drives program_deliverability_gate" }
      - { name: revenue_share_bps, type: integer, source: input, description: "Basis points of the funded referral amount recognized as platform revenue" }
      - { name: clawback_rate_bps, type: integer, source: input, description: "Basis points of the funded referral amount the lender claws back on a reversal; round-trips through GET and feeds compute_revenue_recognition_amount" }
      - { name: clawback_days, type: integer, source: input, description: "Days after a funded referral within which a reversal triggers a clawback" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE → PAUSED → EXPIRED" }

  - name: TargetingCriterion
    parent: LenderProgram
    common_fields: true
    fields:
      - { name: lender_program_id, type: string, source: system, description: "FK -> LenderProgram.id; the program this criterion belongs to" }
      - { name: criterion_field, type: enum, source: input, description: "SCORE | DTI_PCT | UTILIZATION_PCT | STATE_CODE" }
      - { name: operator, type: enum, source: input, description: "GTE | LTE | EQ | IN" }
      - { name: criterion_value, type: string, source: input, description: "Comparison operand; numeric string for SCORE / DTI_PCT / UTILIZATION_PCT, two-letter code for STATE_CODE" }
      - { name: is_hard_requirement, type: boolean, source: input, description: "true = a failed match rejects the program outright; false = a failed match merely reduces the modeled approval odds" }

  - name: PreQualificationDecision
    parent: Consumer
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id" }
      - { name: lender_program_id, type: string, source: system, description: "FK -> LenderProgram.id" }
      - { name: snapshot_id, type: string, source: system, description: "FK -> BureauSnapshot.id; pinned by version-pinning at decision time, never re-pointed" }
      - { name: snapshot_ordinal_used, type: integer, source: system, description: "snapshot.snapshot_ordinal that produced this decision" }
      - { name: modeled_odds_pct, type: number, source: computed, description: "round_half_up(compute_modeled_approval_odds, 2), or null when a hard-requirement criterion failed and the decision is INELIGIBLE" }
      - { name: modeled_odds_settled, type: boolean, source: computed, default: false, description: "False while decision_status is ELIGIBLE or PREQUALIFIED (the modeled odds are provisional); true once any terminal referral outcome exists for this decision (the realized outcome has been folded back)" }
      - { name: decision_status, type: enum, source: system, description: "NEEDS_SNAPSHOT → ELIGIBLE → INELIGIBLE | PREQUALIFIED → CONSENTED | CONSUMED | EXPIRED" }
      - { name: disqualifying_criteria, type: array, source: system, description: "Ordered list of { criterion_field, operator, criterion_value } for every HARD TargetingCriterion that failed; sorted by criterion_field ASC" }
      - { name: reason, type: enum, source: system, description: "HARD_CRITERIA_FAILED | NOT_PREQUALIFIED | NO_ACTIVE_SNAPSHOT | CONSUMER_STATE_EXCLUDED | LENDER_SERVES_STATE_REQUIRED" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock instant of the decision" }
      - { name: fresh_until, type: datetime, source: system, description: "decided_at + PREQUAL_CACHE_DAYS; recomputed by the daily ops run when the clock advances" }

  - name: ConsentRecord
    parent: Consumer
    common_fields: false
    fields:
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id; the consenting consumer" }
      - { name: decision_id, type: string, source: system, description: "FK -> PreQualificationDecision.id; the one-time, single-use consent grant" }
      - { name: consent_method, type: enum, source: input, description: "ELECTRONIC | WRITTEN" }
      - { name: consent_scope, type: enum, source: input, description: "SHARE_PII_WITH_LENDER — the only scope that unlocks the stored routing netloc" }
      - { name: consumer_pii_ciphertext, type: string, source: system, description: "Server-minted sealed PII blob; non-null only after the ops run promotes the consent" }
      - { name: lender_routing_netloc, type: string, source: system, description: "netloc of the lender endpoint the sealed blob is released to; null until the ops run promotes the consent" }
      - { name: status, type: enum, source: system, description: "PENDING → SEALED | NOT_SEALED" }
      - { name: consented_at, type: datetime, source: system, description: "Logical clock instant the consent was captured" }
      - { name: sealed_at, type: datetime, source: system, description: "Logical clock instant the daily operations run promoted PENDING to SEALED; null while PENDING" }
      - { name: archive_status, type: enum, source: system, description: "LIVE | ARCHIVED; ARCHIVED records remain queryable through the archived filter" }

  - name: Referral
    parent: Consumer
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id" }
      - { name: decision_id, type: string, source: system, description: "FK -> PreQualificationDecision.id; the consent-carrying decision routed to the lender" }
      - { name: external_referral_ref, type: string, source: input, description: "Caller-supplied lender-side reference; unique across Referrals" }
      - { name: channel, type: enum, source: input, description: "WEB | MOBILE_APP | MARKETPLACE" }
      - { name: revenue_share_bps, type: integer, source: system, description: "Copied from the program at referral time" }
      - { name: clawback_days, type: integer, source: system, description: "Copied from the program at referral time" }
      - { name: status, type: enum, source: system, description: "SENT → FUNDED → REVERSED | DECLINED | UNFUNDED" }
      - { name: funded_amount_cents, type: integer, source: input, description: "Funded principal reported at the FUNDED transition; null before funding" }
      - { name: funded_at, type: datetime, source: system, description: "Logical clock instant of the FUNDED transition; null before funding" }
      - { name: reversed_at, type: datetime, source: system, description: "Logical clock instant of the REVERSED transition; null unless REVERSED" }

  - name: DisputeReferral
    parent: Consumer
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id" }
      - { name: snapshot_id, type: string, source: system, description: "FK -> BureauSnapshot.id; the snapshot the inaccuracy was observed on" }
      - { name: referral_id, type: string, source: system, description: "FK -> Referral.id; the referral whose consent unlocked the bureau submission route" }
      - { name: referral_count, type: integer, source: computed, default: 0, description: "Number of times this dispute has been submitted; increments on DRAFT → SUBMITTED_OFFLINE and caps at 1, so a submit is accepted at referral_count == 0 and rejected at referral_count == 1" }
      - { name: inaccuracy_type, type: enum, source: input, description: "PERSONAL_INFO | ACCOUNT_INFO | INQUIRY | BALANCE" }
      - { name: narrative, type: string, source: input, description: "Consumer free-text description; 20..1000 characters" }
      - { name: bureau_case_ref, type: string, source: input, description: "Written by POST /dispute-referrals/{id}/acknowledge; the bureau's case handle" }
      - { name: education_code, type: string, source: computed, description: "Lowercase snake_case token equal to inaccuracy_type; the consumed education topic" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED_OFFLINE → ACKNOWLEDGED_BY_BUREAU | WITHDRAWN" }

  - name: RevenueRecognitionEntry
    parent: Consumer
    common_fields: false
    fields:
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id; the consumer the recognized revenue belongs to" }
      - { name: referral_id, type: string, source: system, description: "FK -> Referral.id; the referral this entry recognizes" }
      - { name: entry_kind, type: enum, source: system, description: "REVENUE | CLAWBACK" }
      - { name: realized_amount_cents, type: integer, source: computed, description: "For REVENUE: floor(funded_amount_cents * revenue_share_bps / 10000). For CLAWBACK: -1 * floor(funded_amount_cents * revenue_share_bps / 10000) for the same referral" }
      - { name: recognized_at, type: datetime, source: system, description: "Logical clock instant of recognition" }

  - name: ScoreTierThreshold
    parent: null
    common_fields: true
    fields:
      - { name: tier_code, type: enum, source: input, description: "EXCEPTIONAL | VERY_GOOD | GOOD | FAIR | POOR; unique across ScoreTierThresholds" }
      - { name: min_score, type: integer, source: input, description: "Inclusive lower bound of the tier" }
      - { name: max_score, type: integer, source: input, description: "Inclusive upper bound of the tier" }
      - { name: factor_catalog, type: array, source: input, description: "Ordered list of scoring-model factor codes the platform understands; every element of a BureauSnapshot.factor_codes array MUST appear here" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE → RETIRED" }

  - name: PreQualifiedOffer
    parent: PreQualificationDecision
    common_fields: true
    fields:
      - { name: decision_id, type: string, source: system, description: "FK -> PreQualificationDecision.id; the decision that produced this offer" }
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id; the offer's owner" }
      - { name: lender_program_id, type: string, source: system, description: "FK -> LenderProgram.id; the sponsoring program" }
      - { name: product_kind, type: enum, source: computed, description: "CARD | LOAN | INSURANCE, copied from the program's catalog item at creation" }
      - { name: channel, type: enum, source: input, description: "WEB | MOBILE_APP | MARKETPLACE — the channel the offer was generated for" }
      - { name: intent_recorded_at, type: datetime, source: system, description: "Logical clock instant the offer was generated; anchors compute_offer_freshness" }
      - { name: render_intent_recorded_at, type: datetime, source: system, description: "Logical clock instant the offer was rendered; null until RENDERED, and never used to restart the freshness clock" }
      - { name: status, type: enum, source: system, description: "PRESENTED → RENDERED → CONSUMED | WITHDRAWN | STALE" }

  - name: ScoreAlertThreshold
    parent: Consumer
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id; the consumer this alert override belongs to" }
      - { name: threshold_override_points, type: integer, source: input, description: "Alert threshold override; the effective threshold is max(threshold_override_points, SCORE_ALERT_DEFAULT_THRESHOLD) so an override can only narrow alerting" }

  - name: RenderPolicy
    parent: Consumer
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id; the consumer this render policy governs" }
      - { name: blanket_presentation_override, type: boolean, source: input, default: false, description: "Narrows rendering only: true lets a PRESENTED offer render for optimization before every constituent facet is COMPLETE" }
      - { name: content_quality_override, type: boolean, source: input, default: false, description: "Narrows content quality only: true waives CONTENT_QUALITY_MIN, never the completeness facet" }
      - { name: render_posture, type: enum, source: computed, description: "RENDER_OPEN | RENDER_FACETS_INCOMPLETE | RENDER_RESTRICTED" }

  - name: ContentQualityFacet
    parent: Consumer
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id" }
      - { name: topic, type: enum, source: input, description: "factor_explanations | accuracy_education — the two scorable content topics" }
      - { name: score_bps, type: integer, source: input, description: "Authored content completeness 0..10000" }
      - { name: status, type: enum, source: system, description: "COMPLETE | INCOMPLETE; COMPLETE when score_bps >= CONTENT_QUALITY_MIN" }

  - name: OfferPresentationCap
    parent: Consumer
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id" }
      - { name: product_kind, type: enum, source: input, description: "CARD | LOAN | INSURANCE; unique with consumer_id across OfferPresentationCaps" }
      - { name: presented_count, type: integer, source: computed, default: 0, description: "Offers in this product_kind rendered for this consumer in the current rolling window" }
      - { name: presentation_cap_bps, type: integer, source: system, default: 5000, description: "Basis points of the window denominator allowed for this product_kind; exceeds_cap when presented_count > floor(presentation_cap_bps * total_offer_count / 10000)" }

  - name: OpsRun
    parent: null
    common_fields: true
    fields:
      - { name: run_key, type: string, source: input, description: "Caller-supplied run identifier; unique across OpsRuns" }
      - { name: status, type: enum, source: system, description: "RUNNING → COMPLETED | PARTIAL" }
      - { name: stages_passed, type: array, source: system, description: "Constituent stage names that reached CONSTITUENT_COMPLETE, in execution order" }
      - { name: requested_at, type: datetime, source: system, description: "Logical clock instant the run was requested" }

# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Consumer
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: POST /consumers/{consumer_id}/monitoring-consent
        actor: Consumer
        preconditions:
          - "No Prior-Bureau-Snapshot Rule: consumer.score_version == 0 (ERR_PRIOR_BUREAU_SNAPSHOT_EXISTS)"
          - "consumer.monitoring_consent_at is null (ERR_MONITORING_CONSENT_ALREADY_GRANTED)"
        side_effects:
          - "monitoring_consent_at = logical clock"
          - "refresh monitoring posture to MONITORING"
        note: "Self-transition — the consumer stays ACTIVE; only the monitoring posture changes."

      - from: ACTIVE
        to: ACTIVE
        trigger: POST /consumers/{consumer_id}/bureau-snapshots
        actor: BureauConnector
        preconditions:
          - "consumer.monitoring_consent_at is non-null (ERR_MONITORING_NOT_CONSENTED)"
          - "no BureauSnapshot with pulled_at > (logical clock - PULL_COOLDOWN_HOURS) exists (ERR_PULL_COOLDOWN_ACTIVE)"
        side_effects:
          - "supersede the ACTIVE BureauSnapshot for this consumer (status = SUPERSEDED)"
          - "create BureauSnapshot(snapshot_ordinal = consumer.score_version + 1, status = ACTIVE)"
          - "create one ScoreFactorExplanation per normalized factor_code, rank_index 0..n-1"
          - "recompute consumer.score_version, current_score, previous_score, utilization_pct"
          - "evaluate score_alert_threshold → possibly create ScoreAlert (PENDING) or transition a prior PENDING ScoreAlert to SUPPRESSED"

      - from: ACTIVE
        to: ACTIVE
        trigger: POST /consumers/{consumer_id}/consents/{decision_id}/complete
        actor: Referee
        preconditions:
          - "consent record exists for (consumer_id, decision_id) in status PENDING (ERR_CONSENT_NOT_PENDING)"
          - "consumer's PreQualificationDecision.decision_status == PREQUALIFIED (ERR_CONSENT_DECISION_NOT_PREQUALIFIED)"
        side_effects:
          - "create ConsentRecord(consent_method, consent_scope = SHARE_PII_WITH_LENDER, status = PENDING, archive_status = LIVE)"
          - "transition PreQualificationDecision PREQUALIFIED → CONSENTED"
          - "advance consumer.version"

      - from: ACTIVE
        to: ACTIVE
        trigger: POST /_ops/runs
        actor: PlatformAdmin
        note: "The daily operations run is a per-entity orchestration of constituent stage machines; this entry pins the constituent stage effects that touch Consumer and OpsRun."
        preconditions:
          - "no prior OpsRun with run_key == the supplied run_key (ERR_OPS_RUN_KEY_DUPLICATE)"
        side_effects:
          - "create OpsRun(run_key, stages_passed = [], status = RUNNING)"
          - "promote every ConstituentPosture to CONSTITUENT_PENDING"
          - "daily mobility run: deactivate every BureauSnapshot whose pulled_at <= (logical clock - SNAPSHOT_STALENESS_DAYS) (status → SUPERSEDED)"
          - "daily mobility run: transition every Referral in status SENT to UNFUNDED"
          - "daily mobility run: transition PreQualificationDecision ELIGIBLE or PREQUALIFIED whose fresh_until <= logical clock to EXPIRED"
          - "daily mobility run: transition LenderProgram ACTIVE whose expiry_at <= logical clock to EXPIRED"
          - "settlement run: recognize revenue for every FUNDED Referral lacking a REVENUE RevenueRecognitionEntry"
          - "settlement run: post a CLAWBACK RevenueRecognitionEntry for every REVERSED Referral whose reversal lies within its copied clawback_days window"
          - "adverse-selection run: mark every ELIGIBLE decision NEEDS_SNAPSHOT whose snapshot is no longer ACTIVE"
          - "consent-sealing run: seal at most CONSENT_SEAL_MAX_PER_RUN PENDING ConsentRecords in created_at ASC, id ASC order"
          - "retention run: transition every ConsentRecord in status SEALED or NOT_SEALED with sealed_at <= (logical clock - RETENTION_DAYS) to archive_status ARCHIVED"
          - "cap-window run: reset every OfferPresentationCap.presented_count to 0 and recompute exceeds_cap"
          - "stale-offer run: transition every PreQualifiedOffer in status RENDERED to STALE"
          - "calibration run: recompute every ProductCatalogItem's approval_odds_calibration_index"
          - "posture rollup → recompute monitoring_posture; when every ConstituentPosture is CONSTITUENT_COMPLETE the OpsRun transitions RUNNING → COMPLETED, else RUNNING → PARTIAL"
          - "recompute Consumer.monitoring_posture (COMPLETE when every constituent is CONSTITUENT_COMPLETE; IMMATURE otherwise)"
          - "recompute every Consumer's RenderPolicy.render_posture"

      - from: ACTIVE
        to: CLOSED
        trigger: POST /consumers/{consumer_id}/close
        actor: DataProtectionOfficer
        preconditions:
          - "every Referral for this consumer is in a terminal status (FUNDED, REVERSED, DECLINED or UNFUNDED) (ERR_CONSUMER_HAS_OPEN_REFERRAL)"
          - "every PreQualificationDecision for this consumer is CONSENTED, CONSUMED or EXPIRED (ERR_CONSUMER_HAS_OPEN_DECISION)"
        side_effects:
          - "archive_status = ARCHIVED on the consumer"
          - "transition every non-terminal ConsentRecord for this consumer to NOT_SEALED"
          - "supersede every non-CANCELLED BureauSnapshot for this consumer (status -> SUPERSEDED)"
          - "revert every PreQualificationDecision in status PREQUALIFIED or CONSENTED to ELIGIBLE"
          - "recompute Consumer.monitoring_posture"

  - entity: BureauSnapshot
    initial_state: PULL_REQUESTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PULL_REQUESTED
        to: ACTIVE
        trigger: internal (pull-result census on the POST /consumers/{consumer_id}/bureau-snapshots transition)
        actor: system
        preconditions:
          - "the pull-result census for this consumer carries at least one entry (ERR_PULL_RESULT_EMPTY)"
        side_effects:
          - "bind score, added_account_count, total_revolving_balance_cents, credit_limit_total_cents and factor_codes from the census entry"
          - "status = ACTIVE"
          - "recompute overall_credit_utilization_pct"

      - from: PULL_REQUESTED
        to: CANCELLED
        trigger: internal (pull-result census empty)
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: SUPERSEDED
        trigger: POST /consumers/{consumer_id}/bureau-snapshots (next pull) OR POST /_ops/runs staleness sweep
        actor: BureauConnector | system
        preconditions: []
        side_effects:
          - "status = SUPERSEDED"

      - from: CANCELLED
        to: ACTIVE
        trigger: POST /bureau-snapshots/{id}/replay
        actor: BureauConnector
        preconditions:
          - "snapshot.status == CANCELLED (ERR_INVALID_STATE_TRANSITION otherwise)"
          - "no BureauSnapshot for this consumer with pulled_at > (cancelled_at - PULL_COOLDOWN_HOURS) (ERR_PULL_COOLDOWN_ACTIVE)"
        side_effects:
          - "status = ACTIVE"
          - "supersede the ACTIVE BureauSnapshot for this consumer"
          - "recompute consumer.score_version, current_score, previous_score, utilization_pct"
          - "evaluate score_alert_threshold → possibly create ScoreAlert (PENDING)"

  - entity: Referral
    initial_state: SENT
    terminal_states: [FUNDED, REVERSED, DECLINED, UNFUNDED]
    transitions:
      - from: SENT
        to: FUNDED
        trigger: POST /referrals/{id}/fund
        actor: LenderOps
        preconditions:
          - "Referral.status == SENT (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "funded_amount_cents = payload amount; funded_at = logical clock"
          - "consume the consent: the linked PreQualificationDecision transitions CONSENTED → CONSUMED and its ConsentRecord transitions PENDING → SEALED (lender_routing_netloc = the program's lender netloc)"
          - "create RevenueRecognitionEntry(entry_kind = REVENUE, realized_amount_cents = floor(funded_amount_cents * revenue_share_bps / 10000))"
          - "recompute the ProductCatalogItem's approval_odds_calibration_index with the funded outcome"
          - "advance consumer.version"

      - from: SENT
        to: UNFUNDED
        trigger: daily ops run (logical clock advanced past the referral's 30-day funding window)
        actor: system
        preconditions: []
        side_effects:
          - "release the consent: the linked ConsentRecord transitions PENDING → NOT_SEALED"
          - "the linked PreQualificationDecision stays CONSENTED"

      - from: FUNDED
        to: REVERSED
        trigger: POST /referrals/{id}/reverse
        actor: ComplianceOfficer
        preconditions:
          - "Referral.status == FUNDED (ERR_INVALID_STATE_TRANSITION)"
          - "logical clock <= funded_at + clawback_days days (ERR_CLAWBACK_WINDOW_CLOSED)"
        side_effects:
          - "reversed_at = logical clock"
          - "create RevenueRecognitionEntry(entry_kind = CLAWBACK, realized_amount_cents = -1 * floor(funded_amount_cents * revenue_share_bps / 10000))"
          - "recompute the ProductCatalogItem's approval_odds_calibration_index with the reversed outcome"
          - "advance consumer.version"

      - from: SENT
        to: DECLINED
        trigger: POST /referrals/{id}/decline
        actor: LenderOps
        preconditions:
          - "Referral.status == SENT (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "release the consent: the linked ConsentRecord transitions PENDING → NOT_SEALED"
          - "recompute the ProductCatalogItem's approval_odds_calibration_index with the declined outcome"

  - entity: PreQualificationDecision
    initial_state: NEEDS_SNAPSHOT
    terminal_states: [CONSUMED, EXPIRED]
    transitions:
      - from: NEEDS_SNAPSHOT
        to: ELIGIBLE
        trigger: POST /consumers/{consumer_id}/pre-qualifications OR POST /_ops/runs reclassification
        actor: Consumer | system
        preconditions:
          - "every HARD TargetingCriterion of the program matches the pinned snapshot's attributes"
        side_effects:
          - "pin snapshot_id and snapshot_ordinal_used to the consumer's ACTIVE BureauSnapshot"
          - "modeled_odds_pct = round_half_up(compute_modeled_approval_odds, 2); reason = NOT_PREQUALIFIED"
          - "fresh_until = decided_at + PREQUAL_CACHE_DAYS"

      - from: NEEDS_SNAPSHOT
        to: INELIGIBLE
        trigger: POST /consumers/{consumer_id}/pre-qualifications OR POST /_ops/runs reclassification
        actor: Consumer | system
        preconditions:
          - "at least one HARD TargetingCriterion of the program fails, OR the consumer's state_code is outside the sponsor's states_served"
        side_effects:
          - "modeled_odds_pct = null"
          - "disqualifying_criteria populated with the failed HARD criteria, sorted by criterion_field ASC"
          - "reason = HARD_CRITERIA_FAILED, or CONSUMER_STATE_EXCLUDED when the failure is a state exclusion"

      - from: NEEDS_SNAPSHOT
        to: NEEDS_SNAPSHOT
        trigger: POST /consumers/{consumer_id}/pre-qualifications
        actor: Consumer
        preconditions:
          - "whether or not a snapshot exists, the decision on entry is already NEEDS_SNAPSHOT (ERR_INVALID_STATE_TRANSITION otherwise)"
        side_effects:
          - "when no snapshot exists: reason = NO_ACTIVE_SNAPSHOT, modeled_odds_pct = null, decision_status stays NEEDS_SNAPSHOT"
          - "when the pinned snapshot is not ACTIVE: the decision is re-pinned to the consumer's ACTIVE BureauSnapshot and then re-enters this transition from the top"
          - "repeated calls on the same (consumer, program) pair are idempotent — no second PreQualificationDecision is created"

      - from: NEEDS_SNAPSHOT
        to: PREQUALIFIED
        trigger: POST /pre-qualification-decisions/{id}/qualify
        actor: Referee
        preconditions:
          - "decision.decision_status == ELIGIBLE (ERR_INVALID_STATE_TRANSITION)"
          - "not is_over_presentation for this (consumer, product) pair (ERR_QUALIFY_OVER_REPRESENTED)"
        side_effects:
          - "decision_status = PREQUALIFIED"

      - from: ELIGIBLE
        to: ELIGIBLE
        trigger: POST /consumers/{consumer_id}/pre-qualifications (re-evaluation)
        actor: Consumer
        preconditions:
          - "decision.decision_status == ELIGIBLE (ERR_INVALID_STATE_TRANSITION otherwise)"
        side_effects:
          - "decided_at = logical clock; fresh_until = decided_at + PREQUAL_CACHE_DAYS; modeled_odds_pct recomputed; modeled_odds_settled remains false"

      - from: ELIGIBLE
        to: NEEDS_SNAPSHOT
        trigger: daily ops run (SUPERSEDED_BUREAU_SNAPSHOT)
        actor: system
        preconditions:
          - "the pinned BureauSnapshot is no longer ACTIVE"
        side_effects:
          - "reason = NO_ACTIVE_SNAPSHOT; modeled_odds_pct = null"

      - from: PREQUALIFIED
        to: PREQUALIFIED
        trigger: POST /credit/pre-qualification-decisions/{decision_id}/present
        actor: Consumer
        preconditions:
          - "decision.decision_status == PREQUALIFIED (ERR_INVALID_STATE_TRANSITION otherwise)"
          - "presentation_policy_eligible(pinned snapshot, program) is true (ERR_PRESENTATION_INELIGIBLE)"
          - "the decision's fresh_until has not passed (ERR_OFFER_EXPIRED)"
        side_effects:
          - "create PreQualifiedOffer(status = PRESENTED)"

      - from: PREQUALIFIED
        to: INELIGIBLE
        trigger: POST /credit/pre-qualification-decisions/{decision_id}/present (adverse-selection failure)
        actor: Consumer
        preconditions:
          - "presentation_policy_eligible(pinned snapshot, program) is false (ERR_PRESENTATION_INELIGIBLE)"
        side_effects:
          - "unwind: decision_status = INELIGIBLE; disqualifying_criteria recomputed from the current program criteria; modeled_odds_pct = null"
          - "the PreQualifiedOffer created by this call transitions PRESENTED → WITHDRAWN"
          - "the change is attributed retroactively to decided_at, not to the present instant"

      - from: PREQUALIFIED
        to: ELIGIBLE
        trigger: daily ops run (decision TRAP)
        actor: system
        preconditions:
          - "the decision has been in PREQUALIFIED since decided_at and no ConsentRecord has been created (ERR_INVALID_STATE_TRANSITION otherwise)"
        side_effects:
          - "decision_status = ELIGIBLE; reason = NO_ACTIVE_SNAPSHOT when the pinned snapshot is stale"

      - from: PREQUALIFIED
        to: ELIGIBLE
        trigger: POST /consumers/{consumer_id}/bureau-snapshots
        actor: BureauConnector
        preconditions:
          - "the consumer's ACTIVE BureauSnapshot advances to a new ordinal"
        side_effects:
          - "re-pin snapshot_id and snapshot_ordinal_used to the new ACTIVE snapshot"
          - "modeled_odds_pct recomputed against the new snapshot"

      - from: PREQUALIFIED
        to: CONSENTED
        trigger: POST /consumers/{consumer_id}/consents/{decision_id}/complete
        actor: Referee
        preconditions:
          - "consent record exists in status PENDING (ERR_CONSENT_NOT_PENDING)"
        side_effects:
          - "decision_status = CONSENTED"

      - from: PREQUALIFIED
        to: EXPIRED
        trigger: daily ops run (EXPIRY_ELIGIBLE)
        actor: system
        preconditions:
          - "decision.fresh_until <= logical clock"
        side_effects:
          - "decision_status = EXPIRED; offer_unpresentable = true; no ConsentRecord may thereafter be created"

      - from: CONSENTED
        to: CONSUMED
        trigger: POST /referrals/{id}/fund
        actor: LenderOps
        preconditions:
          - "the decision's ConsentRecord is PENDING (ERR_CONSENT_ALREADY_CONSUMED)"
        side_effects:
          - "decision_status = CONSUMED; the ConsentRecord transitions PENDING → SEALED"

      - from: CONSENTED
        to: CONSUMED
        trigger: POST /referral-attempts
        actor: LenderOps
        preconditions:
          - "the decision's ConsentRecord is PENDING (ERR_CONSENT_ALREADY_CONSUMED)"
        side_effects:
          - "decision_status = CONSUMED; the ConsentRecord transitions PENDING → SEALED and is released to the stored lender_routing_netloc"

  - entity: ConsentRecord
    initial_state: PENDING
    terminal_states: [SEALED, NOT_SEALED]
    transitions:
      - from: PENDING
        to: SEALED
        trigger: daily ops run consent-sealing stage OR POST /referrals/{id}/fund OR POST /referral-attempts
        actor: system | LenderOps
        preconditions: []
        side_effects:
          - "consumer_pii_ciphertext = server-minted sealed blob (withheld from every pre-consent read)"
          - "lender_routing_netloc = the sponsoring program's lender netloc"
          - "sealed_at = logical clock"

      - from: PENDING
        to: NOT_SEALED
        trigger: daily ops run (referral UNFUNDED/DECLINED) OR POST /consumers/{consumer_id}/close
        actor: system | DataProtectionOfficer
        preconditions: []
        side_effects:
          - "consumer_pii_ciphertext stays null; the sealed blob is never minted"

      - from: SEALED
        to: SEALED
        trigger: daily ops run retention stage
        actor: system
        preconditions:
          - "sealed_at <= (logical clock - RETENTION_DAYS)"
        side_effects:
          - "archive_status = ARCHIVED (queried only through the archived filter)"

  - entity: DisputeReferral
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, ACKNOWLEDGED_BY_BUREAU]
    transitions:
      - from: DRAFT
        to: SUBMITTED_OFFLINE
        trigger: POST /dispute-referrals/{id}/submit
        actor: Referee
        preconditions:
          - "dispute.referral_count == 0, so referral_count == 1 is rejected (ERR_INVALID_STATE_TRANSITION)"
          - "the payload referral_id resolves to a Referral in status SENT (ERR_PRESENTATION_INELIGIBLE otherwise)"
          - "PENDING_DISPUTE_CAP = 3: the consumer must hold fewer than 3 DisputeReferrals in status SUBMITTED_OFFLINE at any one time (ERR_DISPUTE_CAP_EXCEEDED)"
        side_effects:
          - "referral_id = payload value; referral_count = 1"
          - "consumer.open_dispute_count += 1"
          - "status = SUBMITTED_OFFLINE"

      - from: SUBMITTED_OFFLINE
        to: ACKNOWLEDGED_BY_BUREAU
        trigger: POST /dispute-referrals/{id}/acknowledge
        actor: Referee
        preconditions:
          - "referral.status == SUBMITTED_OFFLINE (ERR_INVALID_STATE_TRANSITION otherwise)"
        side_effects:
          - "bureau_case_ref = payload value"
          - "status = ACKNOWLEDGED_BY_BUREAU"

      - from: SUBMITTED_OFFLINE
        to: WITHDRAWN
        trigger: POST /dispute-referrals/{id}/withdraw
        actor: Referee
        preconditions:
          - "referral.status == SUBMITTED_OFFLINE (ERR_INVALID_STATE_TRANSITION otherwise)"
        side_effects:
          - "consumer.open_dispute_count -= 1"
          - "status = WITHDRAWN"

  - entity: OpsRun
    initial_state: RUNNING
    terminal_states: [COMPLETED, PARTIAL]
    transitions:
      - from: RUNNING
        to: RUNNING
        trigger: POST /_ops/runs
        actor: PlatformAdmin
        preconditions:
          - "OpsRun.status == RUNNING"
        side_effects:
          - "every active constituent is evaluated; the run advances when the constituent postures settle"
        note: "Declares the multiplicity of the daily operations run so a test can drive several runs from one empty database."

      - from: RUNNING
        to: COMPLETED
        trigger: internal (daily operations run finishes with every constituent CONSTITUENT_COMPLETE)
        actor: system
        preconditions: []
        side_effects:
          - "stages_passed = every constituent stage in execution order"
          - "monitoring_posture = COMPLETE"

      - from: RUNNING
        to: PARTIAL
        trigger: internal (daily operations run finishes with at least one constituent not CONSTITUENT_COMPLETE)
        actor: system
        preconditions: []
        side_effects:
          - "stages_passed = the constituents that completed, in execution order"
          - "monitoring_posture = IMMATURE"

  - entity: ScoreSimulation
    initial_state: DRAFT
    terminal_states: [FINALIZED, FAILED]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: POST /consumers/{consumer_id}/simulations (a newer simulation supersedes this one)
        actor: Consumer
        preconditions:
          - "consumer.score_version >= 1 (ERR_SIMULATION_NEEDS_SNAPSHOT)"
        side_effects:
          - "the prior DRAFT simulation is superseded by this one; projected_score and delta_points of the prior row are left frozen at their computed values"
        note: "A DRAFT simulation is superseded by any newer simulation for the same consumer."

      - from: DRAFT
        to: FINALIZED
        trigger: internal (synchronous within the same POST /consumers/{consumer_id}/simulations request)
        actor: system
        preconditions: []
        side_effects:
          - "projected_score, delta_points and tier_code computed via simulate_score_delta with variant PROJECTED"

      - from: DRAFT
        to: FAILED
        trigger: internal (the same request, when no snapshot exists)
        actor: system
        preconditions:
          - "consumer.score_version == 0"
        side_effects:
          - "projected_score = null; delta_points = null; tier_code = null"

  - entity: ScoreAlert
    initial_state: PENDING
    terminal_states: [DELIVERED, SUPPRESSED]
    transitions:
      - from: PENDING
        to: DELIVERED
        trigger: POST /score-alerts/{alert_id}/acknowledge
        actor: Consumer
        preconditions:
          - "alert.status == PENDING (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "status = DELIVERED"

      - from: PENDING
        to: SUPPRESSED
        trigger: POST /score-alerts/{alert_id}/suppress
        actor: Referee
        preconditions:
          - "alert.status == PENDING (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "status = SUPPRESSED"

      - from: PENDING
        to: SUPPRESSED
        trigger: daily ops run (posture not COMPLETE)
        actor: system
        preconditions:
          - "consumer.monitoring_posture != COMPLETE"
        side_effects:
          - "status = SUPPRESSED; the row is retained as SUPPRESSED rather than deleted"

  - entity: PreQualifiedOffer
    initial_state: PRESENTED
    terminal_states: [CONSUMED, WITHDRAWN, STALE]
    transitions:
      - from: PRESENTED
        to: RENDERED
        trigger: POST /offers/{offer_id}/render
        actor: Consumer
        preconditions:
          - "whole_render_completeness(pinned snapshot, program) is true (ERR_RENDER_COMPLETENESS_INCOMPLETE)"
          - "the consumer's presented_count for this offer's product_kind has not reached floor(presentation_cap_bps * total_offer_count / 10000) (ERR_OFFER_PRESENTATION_CAP_EXCEEDED)"
          - "adverse-selection presentation_policy_eligible(pinned snapshot, program) is true (ERR_OFFER_PRESENTATION_BLOCKED)"
        side_effects:
          - "status = RENDERED"
          - "the consumer's presented_count for this product_kind += 1"
          - "recompute OfferPresentationCap.presented_count and exceeds_cap for the offer's product_kind"

      - from: PRESENTED
        to: RENDERED
        trigger: daily ops run with RenderPolicy.blanket_presentation_override == true
        actor: system
        preconditions:
          - "RenderPolicy.blanket_presentation_override == true for the owning consumer"
        side_effects:
          - "status = RENDERED although the completeness facet is INCOMPLETE; the content_quality facet is NOT waived by this transition"

      - from: RENDERED
        to: CONSUMED
        trigger: POST /referral-attempts
        actor: LenderOps
        preconditions:
          - "offer.status == RENDERED (ERR_INVALID_STATE_TRANSITION)"
          - "the decision's ConsentRecord is PENDING (ERR_CONSENT_ALREADY_CONSUMED)"
        side_effects:
          - "status = CONSUMED"
          - "the decision transitions CONSENTED → CONSUMED"
          - "the ConsentRecord transitions PENDING → SEALED; consumer_pii_ciphertext minted; lender_routing_netloc stamped"

      - from: PRESENTED
        to: WITHDRAWN
        trigger: POST /offers/{offer_id}/withdraw
        actor: ComplianceOfficer
        preconditions:
          - "offer.status in {PRESENTED, RENDERED} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "status = WITHDRAWN; any decision linked by present transitions ELIGIBLE → INELIGIBLE"

      - from: RENDERED
        to: WITHDRAWN
        trigger: POST /offers/{offer_id}/withdraw
        actor: ComplianceOfficer
        preconditions:
          - "offer.status in {PRESENTED, RENDERED} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "status = WITHDRAWN"

      - from: RENDERED
        to: STALE
        trigger: daily ops run (STALE_OFFER)
        actor: system
        preconditions: []
        side_effects:
          - "status = STALE"

  - entity: ProductCatalogItem
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /catalog/items/{id}/activate
        actor: PlatformAdmin
        preconditions:
          - "at least one ScoreTierThreshold in status ACTIVE intersects [min_score, max_score] (ERR_ITEM_NO_SCORE_TIER)"
        side_effects:
          - "status = ACTIVE"

      - from: ACTIVE
        to: RETIRED
        trigger: POST /catalog/items/{id}/retire
        actor: PlatformAdmin
        preconditions:
          - "no LenderProgram in status ACTIVE references this item (ERR_ITEM_HAS_ACTIVE_PROGRAM)"
        side_effects:
          - "status = RETIRED"

  - entity: Lender
    initial_state: ONBOARDING
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: POST /lenders/{id}/activate
        actor: PlatformAdmin
        preconditions:
          - "lender.compliance_status == APPROVED (ERR_LENDER_NOT_COMPLIANT)"
        side_effects:
          - "status = ACTIVE"

      - from: ACTIVE
        to: OFFBOARDED
        trigger: POST /lenders/{id}/offboard
        actor: PlatformAdmin
        preconditions:
          - "no LenderProgram in status ACTIVE for this lender (ERR_LENDER_HAS_ACTIVE_PROGRAM)"
        side_effects:
          - "status = OFFBOARDED"

      - from: ONBOARDING
        to: ONBOARDING
        trigger: POST /lenders/{id}/compliance-status
        actor: ComplianceOfficer
        preconditions:
          - "payload compliance_status in {APPROVED, SUSPENDED, BANNED}"
        side_effects:
          - "compliance_status = payload value"

      - from: ACTIVE
        to: ACTIVE
        trigger: POST /lenders/{id}/compliance-status
        actor: ComplianceOfficer
        preconditions:
          - "payload compliance_status in {APPROVED, SUSPENDED, BANNED}"
        side_effects:
          - "compliance_status = payload value"
          - "when the value is BANNED: every LenderProgram for this lender in status ACTIVE transitions to PAUSED, and each of those programs in turn cascades its ELIGIBLE and PREQUALIFIED decisions to INELIGIBLE"

  - entity: LenderProgram
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /lender-programs/{id}/activate
        actor: PlatformAdmin
        preconditions:
          - "the sponsoring lender.status == ACTIVE (ERR_LENDER_NOT_ACTIVE)"
          - "program_code unique across LenderPrograms (ERR_PROGRAM_CODE_DUPLICATE)"
        side_effects:
          - "status = ACTIVE"

      - from: ACTIVE
        to: PAUSED
        trigger: POST /credit/lender-programs/{program_id}/pause
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "status = PAUSED"
          - "cascade: every PreQualificationDecision pinned to this program whose decision_status is ELIGIBLE or PREQUALIFIED transitions to INELIGIBLE with reason = PROGRAM_PAUSED and modeled_odds_pct = null"

      - from: PAUSED
        to: ACTIVE
        trigger: POST /lender-programs/{id}/resume
        actor: ComplianceOfficer
        preconditions:
          - "the sponsoring lender.status == ACTIVE (ERR_LENDER_NOT_ACTIVE)"
        side_effects:
          - "status = ACTIVE"

      - from: ACTIVE
        to: EXPIRED
        trigger: daily ops run (EXPIRY sweep)
        actor: system
        preconditions:
          - "program.expiry_at <= logical clock"
        side_effects:
          - "status = EXPIRED"

      - from: PAUSED
        to: EXPIRED
        trigger: daily ops run (EXPIRY sweep)
        actor: system
        preconditions:
          - "program.expiry_at <= logical clock"
        side_effects:
          - "status = EXPIRED"

  - entity: ScoreTierThreshold
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /score-tiers/{id}/activate
        actor: PlatformAdmin
        preconditions:
          - "tier_code unique among ScoreTierThresholds in status ACTIVE (ERR_TIER_CODE_DUPLICATE)"
          - "the [min_score, max_score] band does not overlap any other ACTIVE tier (ERR_TIER_BAND_OVERLAP)"
        side_effects:
          - "status = ACTIVE"

      - from: ACTIVE
        to: RETIRED
        trigger: POST /score-tiers/{id}/retire
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "status = RETIRED"

  - entity: RenderPolicy
    initial_state: RENDER_FACETS_INCOMPLETE
    terminal_states: []
    transitions:
      - from: RENDER_FACETS_INCOMPLETE
        to: RENDER_FACETS_INCOMPLETE
        trigger: daily ops run
        actor: system
        preconditions:
          - "not every constituent facet for this consumer is COMPLETE"
        side_effects:
          - "render_posture = RENDER_FACETS_INCOMPLETE"

      - from: RENDER_FACETS_INCOMPLETE
        to: RENDER_OPEN
        trigger: daily ops run
        actor: system
        preconditions:
          - "whole_render_completeness is true"
        side_effects:
          - "render_posture = RENDER_OPEN"

      - from: RENDER_FACETS_INCOMPLETE
        to: RENDER_RESTRICTED
        trigger: daily ops run
        actor: system
        preconditions:
          - "consumer.monitoring_posture == IMMATURE"
        side_effects:
          - "render_posture = RENDER_RESTRICTED"
          - "every ContentQualityFacet for this consumer transitions COMPLETE → INCOMPLETE"

      - from: RENDER_RESTRICTED
        to: RENDER_OPEN
        trigger: daily ops run
        actor: system
        preconditions:
          - "consumer.monitoring_posture == COMPLETE"
        side_effects:
          - "render_posture = RENDER_OPEN"

      - from: RENDER_OPEN
        to: RENDER_RESTRICTED
        trigger: daily ops run
        actor: system
        preconditions:
          - "consumer.monitoring_posture == IMMATURE"
        side_effects:
          - "render_posture = RENDER_RESTRICTED"

  - entity: ContentQualityFacet
    initial_state: INCOMPLETE
    terminal_states: []
    transitions:
      - from: INCOMPLETE
        to: COMPLETE
        trigger: POST /content-quality-facets/{facet_id}/score
        actor: Referee
        preconditions:
          - "facet.score_bps >= CONTENT_QUALITY_MIN (ERR_FACET_SCORE_BELOW_MINIMUM)"
        side_effects:
          - "status = COMPLETE"

      - from: COMPLETE
        to: COMPLETE
        trigger: POST /content-quality-facets/{facet_id}/score
        actor: Referee
        preconditions:
          - "facet.status == COMPLETE (ERR_INVALID_STATE_TRANSITION otherwise)"
        side_effects:
          - "score_bps updated in place; status recomputed"

      - from: COMPLETE
        to: INCOMPLETE
        trigger: daily ops run (RENDER_RESTRICTED)
        actor: system
        preconditions:
          - "consumer.monitoring_posture == IMMATURE"
        side_effects:
          - "status = INCOMPLETE; render_posture = RENDER_RESTRICTED"

# =============================================================================
# Concurrency Rules (§1.2.1) — true races only, resolved by OCC on the parent version
# =============================================================================
concurrency_rules:
  - rule_id: snapshot-create-stale-consumer
    parent_entity: Consumer
    write_endpoint: "POST /credit/consumers/{id}/bureau-snapshots"
    occ_field: "expected_consumer_version"
    description: |
      Requesting a bureau snapshot while carrying a consumer version that has
      advanced since the client last observed it is rejected — a later enrollment
      or consent grant has already moved consumer.monitoring_posture, so the
      client's view of the consumer is stale and the pull must be re-issued
      against the version the server currently holds.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: consent-complete-stale-consumer
    parent_entity: Consumer
    write_endpoint: "POST /credit/consumers/{id}/consents/{id}/complete"
    occ_field: "expected_consumer_version"
    description: |
      Recording consent for a pre-qualification decision while carrying a
      consumer version that has advanced since the client last observed it is
      rejected — the consent grant must be re-issued against the version the
      server currently holds.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: simulation-create-stale-consumer
    parent_entity: Consumer
    write_endpoint: "POST /credit/consumers/{id}/simulations"
    occ_field: "expected_consumer_version"
    description: |
      Creating a score simulation while carrying a consumer version that has
      advanced since the client last observed it is rejected, because a newer
      snapshot may have changed the score the projection should be based on.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: score_alert_threshold
    trigger: "POST /consumers/{consumer_id}/bureau-snapshots, POST /bureau-snapshots/{id}/replay"
    algorithm: threshold
    input_set: "the consumer's current_score and previous_score after the pull (previous_score null on the first pull); the consumer's ScoreAlertThreshold row when one exists"
    formula: |
      effective_threshold = max(score_alert_threshold.threshold_override_points, SCORE_ALERT_DEFAULT_THRESHOLD)
      delta = current_score - previous_score
      if previous_score is null:
        alert_kind = SCORE_FLAT        # an initial pull never alerts
      elif delta >= effective_threshold:
        alert_kind = SCORE_UP
      elif -1 * delta >= effective_threshold:
        alert_kind = SCORE_DOWN
      else:
        alert_kind = SCORE_FLAT
      threshold_used = effective_threshold
      A row is written for every pull: SCORE_UP and SCORE_DOWN rows start PENDING at the
      requested channel; SCORE_FLAT rows are written already SUPPRESSED and the channel
      echoed in the request is stored unchanged.
    constants:
      SCORE_ALERT_DEFAULT_THRESHOLD: 20
    precision: "delta and effective_threshold are integers; no rounding"
    variants:
      - name: initial_pull
        when: "consumer.score_version == 0 at the instant of the request"
        difference: "previous_score is null, so the comparison is skipped and the row is SCORE_FLAT / SUPPRESSED regardless of magnitude"
      - name: override_narrowing
        when: "a ScoreAlertThreshold row exists with threshold_override_points > SCORE_ALERT_DEFAULT_THRESHOLD"
        difference: "effective_threshold uses the override, so a delta that would have alerted under the default does not"

  - name: compute_modeled_approval_odds
    trigger: "POST /consumers/{consumer_id}/pre-qualifications"
    algorithm: weighted_scoring
    input_set: "the consumer's ACTIVE BureauSnapshot at the instant the decision is created, plus the sponsoring LenderProgram and its TargetingCriterion rows"
    formula: |
      # Every criterion is evaluated in this pinned order, independent of insertion order:
      #   sort by (criterion_field ASC, operator ASC, criterion_value ASC)
      hard_pass   = count of HARD criteria that match
      hard_fail   = count of HARD criteria that fail
      soft_pass   = count of SOFT criteria that match
      soft_total  = count of SOFT criteria
      if hard_fail > 0: return null            # INELIGIBLE; modeled_odds_pct is null
      p = ODDS_BASE
      p = p - ODDS_HARD_MATCH_BONUS * hard_pass
      if soft_total > 0:
        p = p - ODDS_SOFT_MATCH_BONUS * (soft_pass / soft_total)
      if snapshot.overall_credit_utilization_pct > ODDS_UTILIZATION_FREE_PCT:
        p = p + ODDS_UTILIZATION_PENALTY_PER_10PCT * ((snapshot.overall_credit_utilization_pct - ODDS_UTILIZATION_FREE_PCT) / 10)
      p = min(p, ODDS_MAX)
      p = max(p, ODDS_MIN)
      return p
      # modeled_odds_pct = round_half_up(p, 2); modeled_odds_settled stays false while the
      # decision is ELIGIBLE or PREQUALIFIED.
    constants:
      ODDS_BASE: 0.90
      ODDS_HARD_MATCH_BONUS: 0.04
      ODDS_SOFT_MATCH_BONUS: 0.06
      ODDS_UTILIZATION_FREE_PCT: 30.0
      ODDS_UTILIZATION_PENALTY_PER_10PCT: 0.05
      ODDS_MIN: 0.01
      ODDS_MAX: 0.99
    precision: "2 decimal places, round_half_up, applied once at return"
    variants:
      - name: provisional
        when: "decision_status is ELIGIBLE or PREQUALIFIED and modeled_odds_settled is false"
        difference: "the value is reported as round_half_up(p, 2) and is a pre-outcome model of what the lender will do"
      - name: settled
        when: "a realized terminal referral outcome exists for the same decision and modeled_odds_settled is true"
        difference: "the identical expression is evaluated and then rounded to the integer 0 or 100, so an identical bureau snapshot reports 0.91 provisionally but 100 once the outcome is realized"

  - name: compute_revenue_recognition_amount
    trigger: "POST /referrals/{id}/fund (REVENUE entry), POST /referrals/{id}/reverse (CLAWBACK entry), POST /_ops/runs settlement/catch-up pass"
    algorithm: aggregation
    input_set: "every RevenueRecognitionEntry whose referral_id == the referral, plus the referral's own funded_amount_cents, revenue_share_bps and clawback_rate_bps"
    formula: |
      gross_share   = floor(referral.funded_amount_cents * referral.revenue_share_bps / 10000)
      claw_share    = floor(referral.funded_amount_cents * referral.clawback_rate_bps / 10000)
      net_recognized = sum(entry.realized_amount_cents for entries of this referral with entry_kind == REVENUE)
                     - sum(entry.realized_amount_cents for entries of this referral with entry_kind == CLAWBACK)
      A CLAWBACK entry is posted for every REVERSED referral whose reversed_at <= funded_at + clawback_days days.
      Invariant (compensating): net_recognized == gross_share - claw_share for every referral.
    precision: "whole cents, floor at each share computation, round_half_up never used"
    variants:
      - name: gross_then_net
        when: "the reversal lies inside the clawback window"
        difference: "gross_share - claw_share, subtracting the lender's clawback share"
      - name: gross_only
        when: "the referral is FUNDED and no reversal has been recorded"
        difference: "gross_share alone is recognized, the clawback leg being absent"

  - name: compute_calibration_index
    trigger: "POST /_ops/runs calibration pass; also recomputed after every FUNDED, REVERSED and DECLINED referral transition"
    algorithm: weighted_scoring
    input_set: "every PreQualificationDecision whose pinned LenderProgram's product_catalog_item_id == the item, excluding decisions in status EXPIRED; realized outcome = FUNDED (success), REVERSED or DECLINED (failure)"
    formula: |
      Include only decisions in status NEEDS_SNAPSHOT, ELIGIBLE, INELIGIBLE, PREQUALIFIED, CONSENTED or CONSUMED.
      Exclude every decision in status EXPIRED.
      if total_decisions == 0 or realized_successes == 0:
        index = null   # metric undefined, never 0 or 1
      else:
        mean_odds = round_half_up(sum(modeled_odds_pct) / total_decisions, 4)
        realized_rate = round_half_up(realized_successes / total_decisions, 4)
        index = round_half_up(mean_odds / realized_rate, 4)
    precision: "4 decimal places, round_half_up; null when the denominator or the numerator set is empty"
    variants:
      - name: including_provisional
        when: "computed without excluding decisions whose modeled_odds_settled is false"
        difference: "the provisional modeled odds of every unconsumed decision enter the mean"
      - name: settled_only
        when: "computed over decisions with modeled_odds_settled true only"
        difference: "the mean is taken over realized outcomes only, so the two variants can fall on opposite sides of 1.0 for identical decision rows"

  - name: score_tier_lookup
    trigger: "POST /consumers/{consumer_id}/simulations"
    algorithm: threshold
    input_set: "every ScoreTierThreshold in status ACTIVE"
    formula: |
      sorted_tiers = active tiers sorted by min_score ASC, then max_score ASC
      tier_code = the tier_code of the first tier whose min_score <= S <= max_score
      When a tier contains S, lookup stops at it even if a later tier also contains S.
    precision: "integer comparison; no rounding"

  - name: monitoring_window_checks
    trigger: "POST /_ops/runs staleness sweep"
    algorithm: threshold
    input_set: "every BureauSnapshot whose status is ACTIVE"
    formula: |
      For each ACTIVE snapshot:
        if snapshot.pulled_at <= (logical clock - SNAPSHOT_STALENESS_DAYS days):
          snapshot.status = SUPERSEDED
      For each consumer, a pull is refused when the most recent pull's pulled_at
      is strictly greater than (logical clock - PULL_COOLDOWN_HOURS hours).
    constants:
      SNAPSHOT_STALENESS_DAYS: 30
      PULL_COOLDOWN_HOURS: 24
    precision: "day-granularity comparison on ISO 8601 instants; V+30d deactivates, V+29d does not"

  - name: ops_run_classification_sort
    trigger: "POST /_ops/runs adverse-selection and posture-rollup stages"
    algorithm: chronological
    input_set: "every PreQualificationDecision and every LenderProgram evaluated in the current run"
    formula: |
      process_order = entities sorted by next_deadline_instant ASC
      tie_break     = entities with equal next_deadline_instant sorted by entity created_at ASC
      final_tie_break = entities with equal next_deadline_instant and equal created_at sorted by their numeric status_code ASC
      Created_at is the only common-field fallback; UUIDs never participate.
    precision: "second-granularity chronological ordering; no rounding"
    variants:
      - name: single_pass
        when: "the run's EXPIRY_ELIGIBLE stage is in flight"
        difference: "each entity is classified once per run, so entities sharing a deadline instant are resolved by the tie-break ladder rather than re-queued"
      - name: convergence_pass
        when: "the run's COUNTERPARTY stage is in flight"
        difference: "an entity whose state changes re-enters the queue and is re-sorted; the run iterates until no entity's status_code changes in a full pass"

  - name: simulate_score_delta
    trigger: "POST /consumers/{consumer_id}/simulations"
    algorithm: constraint_propagation
    input_set: "the consumer's ACTIVE BureauSnapshot at the instant of the request and the ordered actions array in the request body"
    formula: |
      # The projection is recursive: each action is applied to the running (S, U) pair
      # produced by the previous action. Order is significant.
      S = consumer.current_score
      U = consumer.utilization_pct
      for each action in submission order:
        if action.action_code == "PAY_DOWN_REVOLVING":
          U = max(0, U - (action.amount_cents * 100 / snapshot.credit_limit_total_cents))
          S = S + UTIL_OPEN_POINTS_PER_ACTION
        elif action.action_code == "CLOSE_OLDEST_TRADELINE":
          S = S - CLOSE_OLDEST_TRADELINE_PENALTY_POINTS
        elif action.action_code == "INCREASE_CREDIT_LIMIT":
          denominator = snapshot.credit_limit_total_cents + action.amount_cents
          U = snapshot.total_revolving_balance_cents * 100 / denominator
          S = S + LIMIT_INCREASE_BASE_BONUS + floor(U / 10) * LIMIT_INCREASE_STEP_BONUS
        elif action.action_code == "OPEN_NEW_TRADELINE":
          S = S - OPEN_NEW_TRADELINE_PENALTY_POINTS
      S = S + (floor(U / 10) - floor(consumer.utilization_pct / 10)) * UTIL_TERMINAL_STEP_POINTS
      projected_score = clamp(S, SCORE_MIN, SCORE_MAX)
      delta_points = projected_score - consumer.current_score
      tier_code = score_tier_lookup(projected_score)
    constants:
      UTIL_OPEN_POINTS_PER_ACTION: 5
      CLOSE_OLDEST_TRADELINE_PENALTY_POINTS: 12
      LIMIT_INCREASE_BASE_BONUS: 8
      LIMIT_INCREASE_STEP_BONUS: 2
      OPEN_NEW_TRADELINE_PENALTY_POINTS: 9
      UTIL_TERMINAL_STEP_POINTS: 3
      SCORE_MIN: 300
      SCORE_MAX: 850
    precision: "integer points throughout; floor applied to each U/10 term before summing"
    variants:
      - name: PROJECTED
        when: "the simulation request is accepted and the row is created"
        difference: "the recursive walk above is applied to the consumer's ACTIVE snapshot"
      - name: SETTLED
        when: "read through POST /consumers/{consumer_id}/simulations?status=SETTLED, which re-derives the row after the next bureau pull"
        difference: "the same action list is re-walked from consumer.current_score, so a consumer whose score moved between the two reads gets a different projected_score for an identical actions array"

  - name: face_value_vs_revenue
    trigger: "GET /catalog/items/{id} derived view (computed on read)"
    algorithm: aggregation
    input_set: "the funded_amount_cents of every Referral whose decision's pinned program belongs to this catalog item, plus the item's revenue_share_bps"
    formula: |
      face_value_cents  = sum(referral.funded_amount_cents)        # gross loan/card volume
      platform_revenue_cents = sum(floor(referral.funded_amount_cents * bps / 10000))
      The two are computed on different bases for identical rows: face_value is summed first and
      never rounded, while platform_revenue floors every referral independently before summing.
    precision: "face_value_cents is an integer sum with no rounding; platform_revenue_cents floors per referral"

  - name: fee_breakeven_months
    trigger: "GET /catalog/items/{id} derived view (computed on read)"
    algorithm: threshold
    input_set: "the LenderProgram's annual_fee_cents and intro_apr_bps, plus the consumer's current card balance when supplied"
    formula: |
      monthly_fee_cents = floor(annual_fee_cents / 12)
      monthly_interest_saved_cents = floor(card_balance_cents * intro_apr_bps / 10000 / 12)
      if annual_fee_cents == 0:
        breakeven_months = 0
      elif monthly_interest_saved_cents == 0:
        breakeven_months = null
      else:
        breakeven_months = ceil(annual_fee_cents / monthly_interest_saved_cents)
    precision: "integer months; single ceil at the end"
    variants:
      - name: with_balance
        when: "card_balance_cents is supplied on the read"
        difference: "breakeven is a finite month count"
      - name: balance_unknown
        when: "card_balance_cents is absent, so monthly_interest_saved_cents is 0"
        difference: "breakeven_months is null, not 0 and not infinity"

  - name: compute_offer_freshness
    trigger: "POST /_ops/runs stale-offer sweep; also recomputed on every read of an offer"
    algorithm: decay_function
    input_set: "every PreQualifiedOffer not in a terminal status"
    formula: |
      intent_expiry_instant     = offer.intent_recorded_at + floor(OFFER_INTENT_TTL_HOURS / 24) days
      settlement_expiry_instant = offer.intent_recorded_at + floor(OFFER_SETTLEMENT_TTL_HOURS / 24) days
      if logical clock > intent_expiry_instant:     offer.status = STALE
      elif logical clock > settlement_expiry_instant: offer.status = STALE
      Comparison is on whole days elapsed since intent_recorded_at; the floor is taken on the
      TTL in days, so a 30-day TTL expires exactly at the 30-day boundary, not before.
    constants:
      OFFER_INTENT_TTL_HOURS: 720
      OFFER_SETTLEMENT_TTL_HOURS: 720
    precision: "whole days; floor on the day conversion"
    variants:
      - name: rolling
        when: "TTL measured from offer.intent_recorded_at"
        difference: "every re-issue restarts the clock"
      - name: non_rolling
        when: "armed by a rendered offer, measured from the original decision's decided_at"
        difference: "the clock never restarts, so an offer re-issued late still expires on the original schedule"

  - name: compute_score_volatility
    trigger: "GET /credit/consumers/{consumer_id}/adverse-action-summary (derived view, computed on read)"
    algorithm: aggregation
    input_set: "every BureauSnapshot of the consumer whose status is ACTIVE or SUPERSEDED, in snapshot_ordinal ASC order"
    formula: |
      deltas = [snapshots[i].score - snapshots[i-1].score for i in 1..n-1], in snapshot_ordinal ASC order
      volatility_points = max(deltas) - min(deltas)      # 0 when fewer than 2 deltas exist
      drift_points      = snapshots[n-1].score - snapshots[0].score
    precision: "integer points; no rounding"

  - name: governance_thresholds
    trigger: "evaluated wherever the named threshold is consulted; no state changes of its own"
    algorithm: threshold
    input_set: "global configuration; not derived from any entity row"
    formula: |
      PREQUAL_CACHE_DAYS        = 30   # decision.fresh_until = decided_at + PREQUAL_CACHE_DAYS
      CONSENT_SEAL_MAX_PER_RUN  = 25   # at most this many PENDING consents seal per ops run
      RETENTION_DAYS            = 365  # sealed_at + RETENTION_DAYS before archive_status becomes ARCHIVED
      PENDING_DISPUTE_CAP       = 3    # SUBMITTED_OFFLINE disputes per consumer
      CONTENT_QUALITY_MIN       = 8000 # score_bps needed for a ContentQualityFacet to be COMPLETE
      OFFER_CAP_BPS             = 5000 # default OfferPresentationCap.presentation_cap_bps
    constants:
      PREQUAL_CACHE_DAYS: 30
      CONSENT_SEAL_MAX_PER_RUN: 25
      RETENTION_DAYS: 365
      PENDING_DISPUTE_CAP: 3
      CONTENT_QUALITY_MIN: 8000
      OFFER_CAP_BPS: 5000
    precision: "integers; no rounding"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well formed, and the role is a declared §1.7 role"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "The caller's role is among the endpoint's declared roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Every path-segment resource id resolves; segments are validated left to right, so a bad parent id shadows a bad child id"
    error_id: ERR_CONSUMER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a {consumer_id}, {decision_id}, {referral_id}, {offer_id}, {snapshot_id}, {dispute_id}, {simulation_id} or {alert_id} segment"

  - priority: 4
    category: state
    check: "The target resource is in a state from which the requested transition is declared"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints"
    description: "Ranks above every business check: a transition attempted from a terminal status is rejected as a state error even when a fiscal or referral check would also have fired."

  - priority: 5
    category: state
    check: "A decision whose fresh_until has passed may not be consented to or presented, and offers built on an EXPIRED decision are unpresentable"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /consumers/{consumer_id}/consents/{decision_id}/complete, POST /pre-qualification-decisions/{id}/present, POST /offers/{offer_id}/render"

  - priority: 6
    category: business_safety
    check: "Adverse-selection gate: presentation_policy_eligible and is_over_presentation are evaluated before any monetary or referral check"
    error_id: ERR_PRESENTATION_INELIGIBLE
    http_status: 409
    applies_to: "POST /pre-qualification-decisions/{id}/present, POST /pre-qualification-decisions/{id}/qualify, POST /offers/{offer_id}/render"

  - priority: 7
    category: business_safety
    check: "Rendering completeness gate: whole_render_completeness must hold unless the consumer's blanket_presentation_override narrows the facet evaluation"
    error_id: ERR_RENDER_COMPLETENESS_INCOMPLETE
    http_status: 409
    applies_to: "POST /offers/{offer_id}/render"

  - priority: 8
    category: business_constraint
    check: "Collateral re-validation at presentation time: the pinned TargetingCriterion set must still pass for the consumer's current data"
    error_id: ERR_COLLATERAL_ELIGIBILITY_CHANGED
    http_status: 409
    applies_to: "POST /pre-qualification-decisions/{id}/present, POST /offers/{offer_id}/render"

  - priority: 9
    category: business_referential
    check: "Consent gate: the decision's ConsentRecord must be in status PENDING and the decision must be PREQUALIFIED or CONSENTED"
    error_id: ERR_CONSENT_NOT_PENDING
    http_status: 409
    applies_to: "POST /referrals/{id}/fund, POST /referral-attempts"

  - priority: 10
    category: business_fiscal
    check: "Request shape and ledger arithmetic: malformed body, undeclared enum members, factor codes absent from every ACTIVE ScoreTierThreshold.factor_catalog, negative amounts, and non-unique business references"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /referrals/{id}/fund, POST /referrals, POST /referral-attempts"
    description: "Ranks below the consent and safety gates: a referral that is both non-consented and carries a malformed amount reports the consent error."

  - priority: 11
    category: business_fiscal
    check: "Clawback window: the reversal instant must fall within funded_at + clawback_days days"
    error_id: ERR_CLAWBACK_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /referrals/{id}/reverse"

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
#
# The whole credit surface is namespaced under the /credit prefix. Every entity
# has a flat collection (`/credit/<segment>`) plus a single-resource GET at
# `/credit/<segment>/{id}`; child collections also answer in sub-resource form
# (`/credit/<parent-segment>/{id}/<child-segment>`) wherever the relationship is
# naturally nested.
# =============================================================================
endpoints:
  # --- Consumers ---
  - method: POST
    path: "/credit/consumers"
    description: "Enroll a consumer in credit monitoring"
    roles: [Consumer]
    code: 201
    input: [full_name, email, state_code, bureau_pin, dti_pct]
    output: Consumer
    side_effects: ["force initial values: score_version == 0, current_score == null, previous_score == null, utilization_pct == null, open_dispute_count == 0, monitoring_consent_at == null, monitoring_posture == ENROLLED"]

  - method: GET
    path: "/credit/consumers"
    description: "List consumers"
    roles: [Consumer, Referee, ComplianceOfficer, PlatformAdmin, DataProtectionOfficer]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: Consumer[]
    side_effects: []

  - method: GET
