              payload: { lease_id: "${lease_id}", period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", reported_gross_sales_cents: 100000009, expected_lease_version: "${v3}" }
              as: GroundTenant
