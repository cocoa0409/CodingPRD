# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — §1.8 Test Targeting Index
# Peer Review Study Sections, Percentile Scoring & Award Cycles (NIH)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: percentile_raw_vs_normalized_diverge_across_panels
        grounds:
          - calculations.percentile_scoring
          - calculations.impact_score
          - entities.Application.fields.percentile_raw
          - entities.Application.fields.percentile_normalized
        distinguishing_aspect: |
          Two variants over the SAME critique data in the scoring domain: raw percentile ranks only
          within the application's own study section, while the normalized variant adjusts impact by
          (pool_mean - section_mean) before ranking across the activity-code pool. With section A
          (impacts 20, 40) and section B (impact 50) in one R01 pool, application a1 has
          percentile_raw 25.0 but percentile_normalized 16.7, and a2 has 75.0 vs 83.3 — the variants
          disagree because section means differ.
        test_recipe:
          setup:
            - "One R01 FOA, one institute (rate 0.5), one institution, two study sections A and B"
            - "Applications a1 (impact 20) and a2 (impact 40) referred to section A; b1 (impact 50) referred to section B"
            - "Each application has one PRIMARY and one SECONDARY critique submitted; both sections released (A first, then B)"
          setup_api_calls:
            - { call: "POST /grants/institutions", payload: { name: "State University" }, as: ProgramOfficer, captures: { inst_id: $.data.id } }
            - { call: "POST /grants/institutes", payload: { name: "National Test Institute", appropriation_cents: 100000000, reserve_cents: 0, indirect_cost_rate: 0.5, select_pay_cap_pct: 0.10, select_pay_extension_percentile: 5.0 }, as: ProgramOfficer, captures: { insti_id: $.data.id } }
            - { call: "POST /grants/funding-opportunities", payload: { pa_number: "PA-26-101", title: "R01 Test FOA", activity_code: "R01", research_strategy_page_limit: 12, min_direct_cents_per_year: 1000000, max_direct_cents_per_year: 25000000, max_years: 5, open_date: "2026-08-01T00:00:00Z", receipt_deadline: "2026-12-01T00:00:00Z" }, as: ProgramOfficer, captures: { foa_id: $.data.id } }
            - { call: "POST /grants/study-sections", payload: { name: "Section A", meeting_date: "2027-03-01T00:00:00Z", application_quota: 10 }, as: ScientificReviewOfficer, captures: { sec_a: $.data.id } }
            - { call: "POST /grants/study-sections", payload: { name: "Section B", meeting_date: "2027-04-15T00:00:00Z", application_quota: 10 }, as: ScientificReviewOfficer, captures: { sec_b: $.data.id } }
            - { call: "POST /grants/applicants", payload: { full_name: "PI One", email: "pi1@x.edu", career_stage: "ESTABLISHED_INVESTIGATOR" }, as: ProgramOfficer, captures: { pi1: $.data.id } }
            - { call: "POST /grants/applicants", payload: { full_name: "PI Two", email: "pi2@x.edu", career_stage: "ESTABLISHED_INVESTIGATOR" }, as: ProgramOfficer, captures: { pi2: $.data.id } }
            - { call: "POST /grants/applicants", payload: { full_name: "PI Three", email: "pi3@x.edu", career_stage: "ESTABLISHED_INVESTIGATOR" }, as: ProgramOfficer, captures: { pi3: $.data.id } }
            - { call: "POST /grants/applications", payload: { foa_id: "${foa_id}", institution_id: "${inst_id}", title: "A1", research_strategy_page_count: 5, direct_cents_per_year: [20000000], requested_years: 1 }, as: Applicant, as_user_id: "${pi1}", captures: { a1_id: $.data.id } }
            - { call: "POST /grants/applications/${a1_id}/submit", payload: {}, as: Applicant, as_user_id: "${pi1}", captures: { a1_v: $.data.version } }
            - { call: "POST /grants/applications/${a1_id}/referral", payload: { study_section_id: "${sec_a}", institute_id: "${insti_id}", expected_application_version: "${a1_v}" }, as: ReferralOfficer }
            - { call: "POST /grants/applications", payload: { foa_id: "${foa_id}", institution_id: "${inst_id}", title: "A2", research_strategy_page_count: 5, direct_cents_per_year: [20000000], requested_years: 1 }, as: Applicant, as_user_id: "${pi2}", captures: { a2_id: $.data.id } }
            - { call: "POST /grants/applications/${a2_id}/submit", payload: {}, as: Applicant, as_user_id: "${pi2}", captures: { a2_v: $.data.version } }
            - { call: "POST /grants/applications/${a2_id}/referral", payload: { study_section_id: "${sec_a}", institute_id: "${insti_id}", expected_application_version: "${a2_v}" }, as: ReferralOfficer }
            - { call: "POST /grants/applications", payload: { foa_id: "${foa_id}", institution_id: "${inst_id}", title: "B1", research_strategy_page_count: 5, direct_cents_per_year: [20000000], requested_years: 1 }, as: Applicant, as_user_id: "${pi3}", captures: { b1_id: $.data.id } }
            - { call: "POST /grants/applications/${b1_id}/submit", payload: {}, as: Applicant, as_user_id: "${pi3}", captures: { b1_v: $.data.version } }
            - { call: "POST /grants/applications/${b1_id}/referral", payload: { study_section_id: "${sec_b}", institute_id: "${insti_id}", expected_application_version: "${b1_v}" }, as: ReferralOfficer }
            - { call: "POST /grants/institutions", payload: { name: "Other College" }, as: ProgramOfficer, captures: { inst_id2: $.data.id } }
            - { call: "POST /grants/reviewers", payload: { full_name: "Rev A1", institution_id: "${inst_id2}", expertise_keywords: ["neuro"] }, as: ScientificReviewOfficer, captures: { r_a1: $.data.id } }
            - { call: "POST /grants/reviewers/${r_a1}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r_a1}" }
            - { call: "POST /grants/reviewers", payload: { full_name: "Rev A2", institution_id: "${inst_id2}", expertise_keywords: ["neuro"] }, as: ScientificReviewOfficer, captures: { r_a2: $.data.id } }
            - { call: "POST /grants/reviewers/${r_a2}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r_a2}" }
            - { call: "POST /grants/reviewers", payload: { full_name: "Rev A3", institution_id: "${inst_id2}", expertise_keywords: ["neuro"] }, as: ScientificReviewOfficer, captures: { r_a3: $.data.id } }
            - { call: "POST /grants/reviewers/${r_a3}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r_a3}" }
            - { call: "POST /grants/reviewers", payload: { full_name: "Rev A4", institution_id: "${inst_id2}", expertise_keywords: ["neuro"] }, as: ScientificReviewOfficer, captures: { r_a4: $.data.id } }
            - { call: "POST /grants/reviewers/${r_a4}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r_a4}" }
            - { call: "POST /grants/reviewers", payload: { full_name: "Rev B1", institution_id: "${inst_id2}", expertise_keywords: ["neuro"] }, as: ScientificReviewOfficer, captures: { r_b1: $.data.id } }
            - { call: "POST /grants/reviewers/${r_b1}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r_b1}" }
            - { call: "POST /grants/reviewers", payload: { full_name: "Rev B2", institution_id: "${inst_id2}", expertise_keywords: ["neuro"] }, as: ScientificReviewOfficer, captures: { r_b2: $.data.id } }
            - { call: "POST /grants/reviewers/${r_b2}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r_b2}" }
            - { call: "POST /grants/assignments", payload: { application_id: "${a1_id}", reviewer_id: "${r_a1}", role: "PRIMARY" }, as: ScientificReviewOfficer, captures: { asg_a1p: $.data.id } }
            - { call: "POST /grants/assignments", payload: { application_id: "${a1_id}", reviewer_id: "${r_a2}", role: "SECONDARY" }, as: ScientificReviewOfficer, captures: { asg_a1s: $.data.id } }
            - { call: "POST /grants/assignments", payload: { application_id: "${a2_id}", reviewer_id: "${r_a3}", role: "PRIMARY" }, as: ScientificReviewOfficer, captures: { asg_a2p: $.data.id } }
            - { call: "POST /grants/assignments", payload: { application_id: "${a2_id}", reviewer_id: "${r_a4}", role: "SECONDARY" }, as: ScientificReviewOfficer, captures: { asg_a2s: $.data.id } }
            - { call: "POST /grants/assignments", payload: { application_id: "${b1_id}", reviewer_id: "${r_b1}", role: "PRIMARY" }, as: ScientificReviewOfficer, captures: { asg_b1p: $.data.id } }
            - { call: "POST /grants/assignments", payload: { application_id: "${b1_id}", reviewer_id: "${r_b2}", role: "SECONDARY" }, as: ScientificReviewOfficer, captures: { asg_b1s: $.data.id } }
            - { call: "POST /grants/assignments/${asg_a1p}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r_a1}" }
            - { call: "POST /grants/assignments/${asg_a1s}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r_a2}" }
            - { call: "POST /grants/assignments/${asg_a2p}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r_a3}" }
            - { call: "POST /grants/assignments/${asg_a2s}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r_a4}" }
            - { call: "POST /grants/assignments/${asg_b1p}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r_b1}" }
            - { call: "POST /grants/assignments/${asg_b1s}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r_b2}" }
            - { call: "POST /grants/study-sections/${sec_a}/convene", payload: {}, as: ScientificReviewOfficer }
            - { call: "POST /grants/assignments/${asg_a1p}/submit-critique", payload: { significance_score: 2, innovation_score: 2, approach_score: 2, investigator_score: 2, environment_score: 2, overall_impact_score: 2 }, as: Reviewer, as_user_id: "${r_a1}" }
            - { call: "POST /grants/assignments/${asg_a1s}/submit-critique", payload: { significance_score: 2, innovation_score: 2, approach_score: 2, investigator_score: 2, environment_score: 2, overall_impact_score: 2 }, as: Reviewer, as_user_id: "${r_a2}" }
            - { call: "POST /grants/assignments/${asg_a2p}/submit-critique", payload: { significance_score: 4, innovation_score: 4, approach_score: 4, investigator_score: 4, environment_score: 4, overall_impact_score: 4 }, as: Reviewer, as_user_id: "${r_a3}" }
            - { call: "POST /grants/assignments/${asg_a2s}/submit-critique", payload: { significance_score: 4, innovation_score: 4, approach_score: 4, investigator_score: 4, environment_score: 4, overall_impact_score: 4 }, as: Reviewer, as_user_id: "${r_a4}" }
            - { call: "POST /grants/study-sections/${sec_a}/release-scores", payload: {}, as: ScientificReviewOfficer }
            - { call: "POST /grants/study-sections/${sec_b}/convene", payload: {}, as: ScientificReviewOfficer }
            - { call: "POST /grants/assignments/${asg_b1p}/submit-critique", payload: { significance_score: 5, innovation_score: 5, approach_score: 5, investigator_score: 5, environment_score: 5, overall_impact_score: 5 }, as: Reviewer, as_user_id: "${r_b1}" }
            - { call: "POST /grants/assignments/${asg_b1s}/submit-critique", payload: { significance_score: 5, innovation_score: 5, approach_score: 5, investigator_score: 5, environment_score: 5, overall_impact_score: 5 }, as: Reviewer, as_user_id: "${r_b2}" }
            - { call: "POST /grants/study-sections/${sec_b}/release-scores", payload: {}, as: ScientificReviewOfficer }
          trigger:
            - { call: "GET /grants/applications/${a1_id}", payload: {}, as: ProgramOfficer, captures: { a1_raw: $.data.percentile_raw, a1_norm: $.data.percentile_normalized } }
            - { call: "GET /grants/applications/${a2_id}", payload: {}, as: ProgramOfficer, captures: { a2_raw: $.data.percentile_raw, a2_norm: $.data.percentile_normalized } }
            - { call: "GET /grants/applications/${b1_id}", payload: {}, as: ProgramOfficer, captures: { b1_raw: $.data.percentile_raw, b1_norm: $.data.percentile_normalized } }
          assert:
            - "Application.${a1_id}.impact_score == 20"
            - "Application.${a1_id}.percentile_raw == 25.0"
            - "Application.${a1_id}.percentile_normalized == 16.7"
            - "Application.${a2_id}.percentile_raw == 75.0"
            - "Application.${a2_id}.percentile_normalized == 83.3"
            - "Application.${b1_id}.percentile_raw == 50.0"
            - "Application.${b1_id}.percentile_normalized == 50.0"

      - name: transfer_relinquishment_time_vs_ledger_variants
        grounds:
          - calculations.transfer_relinquishment
          - entities.TransferRequest.fields.proration_variant
          - entities.TransferRequest.fields.relinquished_amount_cents
        distinguishing_aspect: |
          Two variants over identical award totals and dates in the FISCAL domain: TIME_PRORATED
          (straight-line by days remaining, used when no progress report is accepted) relinquishes
          15123288 cents, while LEDGER_ACTUALS (undisbursed balance, used once a report is accepted)
          relinquishes 18000000 cents for an otherwise identical award with 12000000 disbursed.
        test_recipe:
          setup:
            - "Two identical funded awards A and B (total 30000000 cents, start 2027-01-01, 1 year, rate 0.5) issued to the same applicant at the same institution"
            - "Award A has one accepted progress report (actual 12000000); award B has none"
            - "Both have a PROPOSED transfer to a second institution effective 2027-07-01"
          setup_api_calls:
            - { call: "POST /grants/institutions", payload: { name: "State University" }, as: ProgramOfficer, captures: { inst_id: $.data.id } }
            - { call: "POST /grants/institutions", payload: { name: "Lake College" }, as: ProgramOfficer, captures: { inst2_id: $.data.id } }
            - { call: "POST /grants/institutes", payload: { name: "National Test Institute", appropriation_cents: 500000000, reserve_cents: 0, indirect_cost_rate: 0.5, select_pay_cap_pct: 0.10, select_pay_extension_percentile: 5.0 }, as: ProgramOfficer, captures: { insti_id: $.data.id, insti_v: $.data.version } }
            - { call: "POST /grants/funding-opportunities", payload: { pa_number: "PA-26-102", title: "R01 Transfer FOA", activity_code: "R01", research_strategy_page_limit: 12, min_direct_cents_per_year: 1000000, max_direct_cents_per_year: 25000000, max_years: 5, open_date: "2026-08-01T00:00:00Z", receipt_deadline: "2026-12-01T00:00:00Z" }, as: ProgramOfficer, captures: { foa_id: $.data.id } }
            - { call: "POST /grants/study-sections", payload: { name: "Section T", meeting_date: "2027-03-01T00:00:00Z", application_quota: 10 }, as: ScientificReviewOfficer, captures: { sec_id: $.data.id } }
            - { call: "POST /grants/applicants", payload: { full_name: "PI A", email: "pia@x.edu", career_stage: "ESTABLISHED_INVESTIGATOR" }, as: ProgramOfficer, captures: { pi_a: $.data.id } }
            - { call: "POST /grants/applicants", payload: { full_name: "PI B", email: "pib@x.edu", career_stage: "ESTABLISHED_INVESTIGATOR" }, as: ProgramOfficer, captures: { pi_b: $.data.id } }
            - { call: "POST /grants/reviewers", payload: { full_name: "Rev 1", institution_id: "${inst2_id}", expertise_keywords: ["neuro"] }, as: ScientificReviewOfficer, captures: { r1: $.data.id } }
            - { call: "POST /grants/reviewers/${r1}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r1}" }
            - { call: "POST /grants/reviewers", payload: { full_name: "Rev 2", institution_id: "${inst2_id}", expertise_keywords: ["neuro"] }, as: ScientificReviewOfficer, captures: { r2: $.data.id } }
            - { call: "POST /grants/reviewers/${r2}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r2}" }
            - { call: "POST /grants/applications", payload: { foa_id: "${foa_id}", institution_id: "${inst_id}", title: "Award A app", research_strategy_page_count: 5, direct_cents_per_year: [20000000], requested_years: 1 }, as: Applicant, as_user_id: "${pi_a}", captures: { app_a: $.data.id } }
            - { call: "POST /grants/applications/${app_a}/submit", payload: {}, as: Applicant, as_user_id: "${pi_a}", captures: { app_a_v: $.data.version } }
            - { call: "POST /grants/applications/${app_a}/referral", payload: { study_section_id: "${sec_id}", institute_id: "${insti_id}", expected_application_version: "${app_a_v}" }, as: ReferralOfficer }
            - { call: "POST /grants/assignments", payload: { application_id: "${app_a}", reviewer_id: "${r1}", role: "PRIMARY" }, as: ScientificReviewOfficer, captures: { asg_a1: $.data.id } }
            - { call: "POST /grants/assignments", payload: { application_id: "${app_a}", reviewer_id: "${r2}", role: "SECONDARY" }, as: ScientificReviewOfficer, captures: { asg_a2: $.data.id } }
            - { call: "POST /grants/assignments/${asg_a1}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r1}" }
            - { call: "POST /grants/assignments/${asg_a2}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r2}" }
            - { call: "POST /grants/applications", payload: { foa_id: "${foa_id}", institution_id: "${inst_id}", title: "Award B app", research_strategy_page_count: 5, direct_cents_per_year: [20000000], requested_years: 1 }, as: Applicant, as_user_id: "${pi_b}", captures: { app_b: $.data.id } }
            - { call: "POST /grants/applications/${app_b}/submit", payload: {}, as: Applicant, as_user_id: "${pi_b}", captures: { app_b_v: $.data.version } }
            - { call: "POST /grants/applications/${app_b}/referral", payload: { study_section_id: "${sec_id}", institute_id: "${insti_id}", expected_application_version: "${app_b_v}" }, as: ReferralOfficer }
            - { call: "POST /grants/reviewers", payload: { full_name: "Rev 3", institution_id: "${inst2_id}", expertise_keywords: ["neuro"] }, as: ScientificReviewOfficer, captures: { r3: $.data.id } }
            - { call: "POST /grants/reviewers/${r3}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r3}" }
            - { call: "POST /grants/reviewers", payload: { full_name: "Rev 4", institution_id: "${inst2_id}", expertise_keywords: ["neuro"] }, as: ScientificReviewOfficer, captures: { r4: $.data.id } }
            - { call: "POST /grants/reviewers/${r4}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r4}" }
            - { call: "POST /grants/assignments", payload: { application_id: "${app_b}", reviewer_id: "${r3}", role: "PRIMARY" }, as: ScientificReviewOfficer, captures: { asg_b1: $.data.id } }
            - { call: "POST /grants/assignments", payload: { application_id: "${app_b}", reviewer_id: "${r4}", role: "SECONDARY" }, as: ScientificReviewOfficer, captures: { asg_b2: $.data.id } }
            - { call: "POST /grants/assignments/${asg_b1}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r3}" }
            - { call: "POST /grants/assignments/${asg_b2}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r4}" }
            - { call: "POST /grants/study-sections/${sec_id}/convene", payload: {}, as: ScientificReviewOfficer }
            - { call: "POST /grants/assignments/${asg_a1}/submit-critique", payload: { significance_score: 3, innovation_score: 3, approach_score: 3, investigator_score: 3, environment_score: 3, overall_impact_score: 3 }, as: Reviewer, as_user_id: "${r1}" }
            - { call: "POST /grants/assignments/${asg_a2}/submit-critique", payload: { significance_score: 3, innovation_score: 3, approach_score: 3, investigator_score: 3, environment_score: 3, overall_impact_score: 3 }, as: Reviewer, as_user_id: "${r2}" }
            - { call: "POST /grants/assignments/${asg_b1}/submit-critique", payload: { significance_score: 3, innovation_score: 3, approach_score: 3, investigator_score: 3, environment_score: 3, overall_impact_score: 3 }, as: Reviewer, as_user_id: "${r3}" }
            - { call: "POST /grants/assignments/${asg_b2}/submit-critique", payload: { significance_score: 3, innovation_score: 3, approach_score: 3, investigator_score: 3, environment_score: 3, overall_impact_score: 3 }, as: Reviewer, as_user_id: "${r4}" }
            - { call: "POST /grants/study-sections/${sec_id}/release-scores", payload: {}, as: ScientificReviewOfficer }
            - { call: "POST /grants/council-reviews", payload: { application_id: "${app_a}", recommendation: "FUND", priority_alignment_score: 4 }, as: CouncilMember }
            - { call: "POST /grants/council-reviews", payload: { application_id: "${app_b}", recommendation: "FUND", priority_alignment_score: 4 }, as: CouncilMember }
            - { call: "POST /grants/institutes/${insti_id}/payline-decisions", payload: { base_payline_percentile: 100.0, expected_institute_version: "${insti_v}" }, as: ProgramOfficer }
            - { call: "GET /grants/applications/${app_a}/jit-requests", payload: {}, as: GrantsOfficer, captures: { jit_a: "$.data[0].id" } }
            - { call: "POST /grants/jit-requests/${jit_a}/submit-items", payload: { items_submitted: ["OTHER_SUPPORT", "BUDGET_JUSTIFICATION"] }, as: Applicant, as_user_id: "${pi_a}" }
            - { call: "POST /grants/jit-requests/${jit_a}/adjudicate", payload: { decision: "ACCEPT", budget_cut_pct: 0 }, as: GrantsOfficer }
            - { call: "POST /grants/applications/${app_a}/award", payload: { start_date: "2027-01-01T00:00:00Z" }, as: GrantsOfficer, captures: { award_a: $.data.id } }
            - { call: "GET /grants/applications/${app_b}/jit-requests", payload: {}, as: GrantsOfficer, captures: { jit_b: "$.data[0].id" } }
            - { call: "POST /grants/jit-requests/${jit_b}/submit-items", payload: { items_submitted: ["OTHER_SUPPORT", "BUDGET_JUSTIFICATION"] }, as: Applicant, as_user_id: "${pi_b}" }
            - { call: "POST /grants/jit-requests/${jit_b}/adjudicate", payload: { decision: "ACCEPT", budget_cut_pct: 0 }, as: GrantsOfficer }
            - { call: "POST /grants/applications/${app_b}/award", payload: { start_date: "2027-01-01T00:00:00Z" }, as: GrantsOfficer, captures: { award_b: $.data.id } }
            - { call: "POST /grants/awards/${award_a}/progress-reports", payload: { period_year: 1, actual_expenditure_cents: 12000000, publications_count: 2 }, as: Applicant, as_user_id: "${pi_a}", captures: { rep_a: $.data.id } }
            - { call: "POST /grants/progress-reports/${rep_a}/accept", payload: {}, as: GrantsOfficer }
            - { call: "POST /grants/awards/${award_a}/transfer-requests", payload: { to_institution_id: "${inst2_id}", effective_date: "2027-07-01T00:00:00Z" }, as: Applicant, as_user_id: "${pi_a}", captures: { tr_a: $.data.id } }
            - { call: "POST /grants/awards/${award_b}/transfer-requests", payload: { to_institution_id: "${inst2_id}", effective_date: "2027-07-01T00:00:00Z" }, as: Applicant, as_user_id: "${pi_b}", captures: { tr_b: $.data.id } }
          trigger:
            - { call: "POST /grants/transfer-requests/${tr_a}/relinquish", payload: {}, as: GrantsOfficer, captures: { tr_a_variant: $.data.proration_variant, tr_a_amt: $.data.relinquished_amount_cents } }
            - { call: "POST /grants/transfer-requests/${tr_b}/relinquish", payload: {}, as: GrantsOfficer, captures: { tr_b_variant: $.data.proration_variant, tr_b_amt: $.data.relinquished_amount_cents } }
          assert:
            - "TransferRequest.${tr_a}.proration_variant == LEDGER_ACTUALS"
            - "TransferRequest.${tr_a}.relinquished_amount_cents == 18000000"
            - "TransferRequest.${tr_b}.proration_variant == TIME_PRORATED"
            - "TransferRequest.${tr_b}.relinquished_amount_cents == 15123288"
            - "TransferRequest.${tr_a}.status == RELINQUISHED"
            - "TransferRequest.${tr_b}.status == RELINQUISHED"

