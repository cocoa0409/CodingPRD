  # ===========================================================================
  # SECTION 8 - CROSS-CUTTING COMPLEXITY LAYERS
  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:

      - name: stale_deal_version_is_rejected_on_official_statement_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[os-revision-create-stale-deal] with occ_field expected_deal_version
          - validations[occ-deal-version-current] (priority 10)
          - errors[ERR_STALE_DEAL_VERSION]
        distinguishing_aspect: |
          The first official-statement create itself increments Deal.version as a side effect, so a
          client that read the deal once and then issues two creates from the same token is exactly
          the drafting race the rule exists for. The second create must be 412 and must NOT
          supersede the first statement; re-reading the deal and retrying with the fresh token then
          succeeds AND the first statement flips to SUPERSEDED, proving the refusal was a genuine
          no-op rather than a partially applied write.
        test_recipe:
          setup:
            - "A DRAFT deal advised by MA0001 and nothing else."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
            - call: "GET /bond-offerings/deals/${deal_id}"
              payload: {}
              as: BondCounsel
              as_user_id: bc_drafter
              captures: { deal_v0: $.data.version }
          trigger:
            - call: "POST /bond-offerings/deals/${deal_id}/official-statements"
              payload: { version_label: "POS-1", is_preliminary: true, expected_deal_version: "${deal_v0}" }
              as: BondCounsel
              as_user_id: bc_drafter
              captures: { os1_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/official-statements"
              payload: { version_label: "POS-2", is_preliminary: true, expected_deal_version: "${deal_v0}" }
              as: BondCounsel
              as_user_id: bc_drafter
              captures: { occ_error: $.data.error_id }
            - call: "GET /bond-offerings/deals/${deal_id}"
              payload: {}
              as: BondCounsel
              as_user_id: bc_drafter
              captures: { deal_v1: $.data.version }
            - call: "POST /bond-offerings/deals/${deal_id}/official-statements"
              payload: { version_label: "POS-2", is_preliminary: true, expected_deal_version: "${deal_v1}" }
              as: BondCounsel
              as_user_id: bc_drafter
              captures: { os2_id: $.data.id }
          assert:
            - "first call: HTTP 201 with status DRAFTING and draft_round 1"
            - "second call: HTTP 412 with data.error_id == 'ERR_STALE_DEAL_VERSION'"
            - "immediately after the 412, GET /bond-offerings/deals/${deal_id}/official-statements returns exactly 1 row and OfficialStatement.${os1_id}.status is still DRAFTING - the refused create superseded nothing"
            - "${deal_v1} is strictly greater than ${deal_v0}, so the first create did increment Deal.version"
            - "fourth call: HTTP 201, OfficialStatement.${os2_id}.status == DRAFTING and OfficialStatement.${os1_id}.status == SUPERSEDED"

      - name: stale_order_period_version_is_rejected_on_order_entry
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-place-stale-order-period] with occ_field expected_order_period_version
          - validations[occ-order-period-version-current] (priority 10)
          - errors[ERR_STALE_ORDER_PERIOD_VERSION]
        distinguishing_aspect: |
          Unlike the deal guard, nothing in the order-period state machine would refuse a repeated
          order, so the version token is the ONLY defence: a second order carrying the first
          order's pre-write token is 412 even though every business field is valid, and
          orders_received_count must stay at 1 across the refusal. This is the second §1.2.1
          concurrency rule and it uses a different parent entity and a different error_id from the
          deal guard, so an implementation that wires one shared version check fails one of the two.
          The 412 also outranks the priority-15 order-type rule, which the third call proves by
          sending a stale token together with an order type the period forbids.
        test_recipe:
          setup:
            - "The pricing chain of validations.pricing_requires_a_posted_official_statement is replayed up to the point where the INSTITUTIONAL order period is OPEN at clock 2026-08-05T14:00:00.000Z, with one 5,000,000 tranche T1 and one SENIOR_MANAGER seat M1 held by AU0001."
          setup_api_calls:
            - call: "GET /bond-offerings/order-periods/${op_id}"
              payload: {}
              as: Underwriter
              as_user_id: "${uw_firm_id}"
              captures: { op_v0: $.data.version }
          trigger:
            - call: "POST /bond-offerings/order-periods/${op_id}/orders"
              payload: { maturity_tranche_id: "${t1_id}", syndicate_member_id: "${m1_id}", order_type: "GROUP_NET", par_requested_usd: 2000000, price_or_yield_pct: 4.250, expected_order_period_version: "${op_v0}" }
              as: Underwriter
              as_user_id: "${uw_firm_id}"
              captures: { order_1_id: $.data.id }
            - call: "POST /bond-offerings/order-periods/${op_id}/orders"
              payload: { maturity_tranche_id: "${t1_id}", syndicate_member_id: "${m1_id}", order_type: "GROUP_NET", par_requested_usd: 1000000, price_or_yield_pct: 4.250, expected_order_period_version: "${op_v0}" }
              as: Underwriter
              as_user_id: "${uw_firm_id}"
              captures: { occ_error: $.data.error_id }
            - call: "POST /bond-offerings/order-periods/${op_id}/orders"
              payload: { maturity_tranche_id: "${t1_id}", syndicate_member_id: "${m1_id}", order_type: "RETAIL", par_requested_usd: 1000000, price_or_yield_pct: 4.250, expected_order_period_version: "${op_v0}" }
              as: Underwriter
              as_user_id: "${uw_firm_id}"
              captures: { occ_error_2: $.data.error_id }
            - call: "GET /bond-offerings/order-periods/${op_id}"
              payload: {}
              as: Underwriter
              as_user_id: "${uw_firm_id}"
              captures: { op_v1: $.data.version }
            - call: "POST /bond-offerings/order-periods/${op_id}/orders"
              payload: { maturity_tranche_id: "${t1_id}", syndicate_member_id: "${m1_id}", order_type: "GROUP_NET", par_requested_usd: 1000000, price_or_yield_pct: 4.250, expected_order_period_version: "${op_v1}" }
              as: Underwriter
              as_user_id: "${uw_firm_id}"
              captures: { order_2_id: $.data.id }
          assert:
            - "first call: HTTP 201 with status PENDING, par_allotted_usd 0 and submitted_at == '2026-08-05T14:00:00.000Z'"
            - "second call: HTTP 412 with data.error_id == 'ERR_STALE_ORDER_PERIOD_VERSION'"
            - "third call: HTTP 412 with data.error_id == 'ERR_STALE_ORDER_PERIOD_VERSION' and NOT 'ERR_ORDER_TYPE_NOT_PERMITTED', because the concurrency check at priority 10 precedes the order-type check at priority 15"
            - "after the two 412s, GET /bond-offerings/order-periods/${op_id}/orders returns 1 row with total_count == 1 and OrderPeriod.${op_id}.orders_received_count == 1"
            - "${op_v1} is strictly greater than ${op_v0}"
            - "fifth call: HTTP 201, orders_received_count == 2 and version strictly greater than ${op_v1}"

      - name: revision_cascade_reaches_five_levels
        claim_type: cascading_side_effects
        grounds:
          - state_machines[OfficialStatement] IN_REVIEW -> REVISION_REQUESTED side effects
        distinguishing_aspect: |
          The full five-hop chain from a single request-revision call - statement, sections,
          deal clearance, order periods and rating engagement - is asserted end to end, including
          the conditional stop at already-terminal children.
        excluded_because:
          difficulty_instance: revision_request_five_hop_cascade
          rationale: |
            The difficulty rule already walks the whole five-level chain and additionally asserts
            the ordering sensitivity and the conditional skip of terminal children, so a §1.9
            instance would restate it verbatim without adding a distinguishable claim.

      - name: gross_spread_basis_selects_the_calculation_variant
        claim_type: dual_variant_calculation
        grounds:
          - calculations[gross_spread] variants
        distinguishing_aspect: |
          The same par amount yields two different gross spreads depending on
          Deal.gross_spread_basis, and the variant is selected by the sale method rather than by
          the caller.
        excluded_because:
          difficulty_instance: gross_spread_negotiated_versus_competitive_divergence
          rationale: |
            The difficulty rule prices the identical 5,000,000 structure on both branches, pins
            both money outputs and asserts that supplying the other branch's inputs is refused,
            which is strictly the superset of the variant-divergence and variant-selection claims.

      - name: disclosure_risk_gate_threshold_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations[issuer_disclosure_risk_score] constant DISCLOSURE_RISK_GATE
          - validations[high-risk-issuer-needs-disclosure-section]
        distinguishing_aspect: |
          The gate is inclusive, so a score of exactly 40 triggers the mandatory
          continuing-disclosure risk section while 39 does not.
        excluded_because:
          difficulty_instance: disclosure_risk_gate_inclusive_at_forty
          rationale: |
            The difficulty rule already tests 39 / 40 / 42 and the clamped 100 case against the
            posting gate, covering both the boundary and the reset-to-clean behaviour of the score.

      - name: sale_method_designation_toggles_the_document_requirement_flags
        claim_type: conditional_feature_flags
        grounds:
          - state_machines[Deal] STRUCTURING -> PRICING_COMPETITIVE and STRUCTURING -> PRICING_NEGOTIATED side effects
          - entities[Deal].requires_notice_of_sale, entities[Deal].requires_g17_letter (both default false)
        distinguishing_aspect: |
          This instance is about the FLAGS ALONE, observed at designation time on a deal that is
          never awarded: both default to false, the competitive branch sets exactly
          requires_notice_of_sale and leaves requires_g17_letter false, and the negotiated branch
          does the mirror image. Because sale_method may never be re-designated, the flags are
          effectively write-once, and the default-absent behaviour is visible on a third deal that
          is left in STRUCTURING with both flags still false. It is deliberately separate from the
          award-time document-set assertions.
        test_recipe:
          setup:
            - "Three STRUCTURING deals of the same issuer, each with a single 5,000,000 tranche. Deal 2 also carries a SENIOR_MANAGER seat for AU0001 so the negotiated branch is legal; deals 1 and 3 have empty syndicates."
