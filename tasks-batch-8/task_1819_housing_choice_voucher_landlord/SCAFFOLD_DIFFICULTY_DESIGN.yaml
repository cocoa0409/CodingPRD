              as: Landlord
              as_user_id: "${landlord9_id}"
              captures: { contract9_id: $.data.id }
            - call: "POST /hcv/contracts/${contract9_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${landlord9_id}"
          trigger:
            - call: "POST /hcv/contracts/${contract9_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${landlord9_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "Second submit is rejected with error_id == ERR_INVALID_STATE (state priority 4 wins over any fiscal check)"
      - name: business_safety_vs_business_referential_on_contract_create
        grounds:
          - validations[priority=7]
          - validations[priority=10]
        distinguishing_aspect: |
          Error-category pair business_safety (ERR_LANDLORD_SUSPENDED, priority 7) vs
          business_referential (ERR_VOUCHER_SIZE_MISMATCH, priority 10): creating a
          contract while the landlord is SUSPENDED AND the voucher bedroom size is too
          small violates both; safety (7) must win over referential (10). This pair is
          distinct from instance 1's state-vs-fiscal pair.
        test_recipe:
          setup:
            - "Landlord SUSPENDED; family voucher 0BR; unit 1BR (would be size mismatch)"
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "L Ten", tax_id: "T10" }
              as: HousingAuthorityAdmin
              captures: { landlord10_id: $.data.id }
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${landlord10_id}", address: "10 J St", zip_code: "90011" }
              as: HousingAuthorityAdmin
              captures: { property10_id: $.data.id }
            - call: "POST /hcv/properties/${property10_id}/units"
              payload: { unit_label: "U10", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { unit10_id: $.data.id, unit10_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "F10", voucher_bedroom_size: 0, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { family10_id: $.data.id }
            - call: "POST /hcv/landlords/${landlord10_id}/suspend"
              payload: {}
              as: HousingAuthorityAdmin
          trigger:
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${unit10_id}", family_id: "${family10_id}", contract_rent_cents: 150000, lease_start_date: "2026-08-01", expected_unit_version: "${unit10_v}" }
              as: Landlord
              as_user_id: "${landlord10_id}"
              captures: { err_id2: $.data.error_id }
          assert:
            - "error_id == ERR_LANDLORD_SUSPENDED (business_safety priority 7 wins over business_referential priority 10)"

