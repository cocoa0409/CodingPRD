  - rule_id: cross_entity_state_dependency
    instances:

      - name: go_live_depends_on_agreement_state_and_reserve_adequacy_in_that_order
        grounds:
          - state_machines.Partner.CONTRACTED_to_LIVE
          - validations[priority=39]
          - validations[priority=40]
          - calculations.required_reserve_computation
          - entities.CustodyAccount.fields.status
        distinguishing_aspect: |
          POST /oversight/partners/{id}/go-live is refused for two different
          cross-entity reasons in sequence on the SAME partner: first 409
          ERR_PARTNER_NOT_CONTRACTED because the related ProgramAgreement is only
          APPROVED (priority 39 fires before 40 and never looks at the custody
          side), then 409 ERR_PROGRAM_NOT_READY_FOR_LAUNCH because the related
          RESERVE CustodyAccount is underfunded, and it succeeds only once both
          the ProgramAgreement is EXECUTED and the CustodyAccount balance clears
          required_reserve_cents - a Partner/ProgramAgreement+CustodyAccount
          dependency triple.
        test_recipe:
          setup:
            - "One OPEN cycle. Partner 'Sextant Deposits' passes diligence (91/87/89/100 -> 91.1 TIER_1) and reaches DILIGENCE_PASSED."
            - "Agreement drafted with reserve_requirement_bps = 500 and submitted for approval; FBO_END_USER is seeded to 5000000 by VARIANCE_ADJUSTMENT, so once the agreement is EXECUTED required_reserve_cents = max(250000, 5000000 * 500 bps = 250000, 0) = 250000."
            - "RESERVE is left at 0 for the second attempt and funded with exactly 312500 before the third."
          setup_api_calls:
            - call: "POST /oversight/cycles"
              payload: { cycle_label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: po_1
            - call: "POST /oversight/partners"
              payload: { legal_name: "Sextant Deposits Inc", business_model: "DEPOSIT_WALLET", funding_stage: "SERIES_B_PLUS", months_runway: 30, disclosed_complaints_per_10k: 1.00, end_user_account_count: 900 }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { p_id: "$.data.id", p_v1: "$.data.version" }
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${p_id}", review_type: "INITIAL", business_model_score: 91, funding_score: 87, compliance_capability_score: 89, complaint_history_score: 100, expected_partner_version: "${p_v1}" }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { dr_id: "$.data.id" }
            - call: "POST /oversight/diligence-reviews/${dr_id}/submit"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
            - call: "POST /oversight/diligence-reviews/${dr_id}/decide"
              payload: { outcome: "PASSED" }
              as: ComplianceOfficer
              as_user_id: co_1
            - call: "GET /oversight/partners/${p_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
              captures: { p_v2: "$.data.version", st_dp: "$.data.status" }
            - call: "POST /oversight/agreements"
              payload: { partner_id: "${p_id}", kyc_owner: "BANK", dispute_owner: "BANK", marketing_owner: "PARTNER", oversight_rights_level: "ENHANCED", audit_access_notice_days: 10, termination_triggers: ["RESERVE_SHORTFALL", "VOLUNTARY"], monthly_growth_cap_pct: 40.00, concentration_cap_pct: 90.00, max_end_user_balance_cents: 500000000, reserve_requirement_bps: 500, effective_date: "2026-08-01T00:00:00Z", expected_partner_version: "${p_v2}" }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { ag_id: "$.data.id" }
            - call: "POST /oversight/agreements/${ag_id}/submit-for-approval"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
              captures: { ag_st1: "$.data.status" }
          trigger:
            - call: "POST /oversight/partners/${p_id}/go-live"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
            - call: "POST /oversight/agreements/${ag_id}/risk-decision"
              payload: { decision: "EXECUTE" }
              as: RiskCommittee
              as_user_id: rc_1
              captures: { ag_st2: "$.data.status" }
            - call: "GET /oversight/custody-accounts?partner_id=${p_id}&account_type=FBO_END_USER"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
              captures: { fbo_id: "$.data[0].id", fbo_v1: "$.data[0].version", fbo_st: "$.data[0].status" }
            - call: "POST /oversight/ledger-entries"
              payload: { partner_id: "${p_id}", custody_account_id: "${fbo_id}", entry_type: "VARIANCE_ADJUSTMENT", amount_cents: 5000000, effective_at: "2026-08-01T00:00:00Z", expected_custody_account_version: "${fbo_v1}" }
              as: ProgramOfficer
              as_user_id: po_1
            - call: "GET /oversight/partners/${p_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
              captures: { mid_req: "$.data.required_reserve_cents", mid_sf: "$.data.reserve_shortfall_cents", st_contracted: "$.data.status" }
            - call: "POST /oversight/partners/${p_id}/go-live"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
            - call: "GET /oversight/custody-accounts?partner_id=${p_id}&account_type=RESERVE"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
              captures: { res_id: "$.data[0].id", res_v1: "$.data[0].version" }
            - call: "POST /oversight/ledger-entries"
              payload: { partner_id: "${p_id}", custody_account_id: "${res_id}", entry_type: "RESERVE_FUND", amount_cents: 312500, effective_at: "2026-08-01T00:00:00Z", expected_custody_account_version: "${res_v1}" }
              as: ProgramOfficer
              as_user_id: po_1
            - call: "GET /oversight/partners/${p_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
              captures: { pre3_sf: "$.data.reserve_shortfall_cents" }
            - call: "POST /oversight/partners/${p_id}/go-live"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
              captures: { final_status: "$.data.status" }
          assert:
            - "${st_dp} == DILIGENCE_PASSED and ${ag_st1} == PENDING_APPROVAL"
            - "the first go-live responds 409 with error_id ERR_PARTNER_NOT_CONTRACTED   # priority 39 precedes 40 and ignores reserve adequacy"
            - "the first go-live response error_id is NOT ERR_PROGRAM_NOT_READY_FOR_LAUNCH"
            - "${ag_st2} == EXECUTED and ${st_contracted} == CONTRACTED"
            - "${fbo_st} == ACTIVE   # both custody accounts are opened by the EXECUTE side effect"
            - "${mid_req} == 250000   # RESERVE_ABSOLUTE_FLOOR_CENTS ties the 5% of 5000000 term"
            - "${mid_sf} == 250000   # RESERVE balance is still 0"
            - "the second go-live responds 409 with error_id ERR_PROGRAM_NOT_READY_FOR_LAUNCH   # agreement is now EXECUTED, so only the custody-side dependency remains"
            - "${pre3_sf} == 0   # RESERVE 312500 >= required 250000"
            - "${final_status} == LIVE"
            - "Partner.${p_id}.status == LIVE and Partner.${p_id}.oversight_posture == OPEN"
            - "CustodyAccount.${res_id}.balance_cents == 312500"
            - "ProgramAgreement.${ag_id}.status == EXECUTED"

      - name: wind_down_completion_depends_on_custody_residual_at_cycle_close
        grounds:
          - state_machines.WindDownPlan.IN_EXECUTION_to_COMPLETED
          - state_machines.OversightCycle.OPEN_to_CLOSED
          - state_machines.CustodyAccount.ACTIVE_to_CLOSED
          - state_machines.Partner.WIND_DOWN_to_TERMINATED
          - state_machines.ProgramAgreement.EXECUTED_to_TERMINATED
          - calculations.wind_down_residual_balance_cents
        distinguishing_aspect: |
          A WindDownPlan in IN_EXECUTION completes only when the residual across
          its partner's two CustodyAccounts is zero, and that check is performed
          exclusively by the OversightCycle close sweep: closing cycle 1 with
          residual 4333000 leaves the plan IN_EXECUTION and
          plans_completed_count 0, and only after the balances are drained does
          closing cycle 2 move the plan to COMPLETED, close both accounts and
          terminate the Partner - a WindDownPlan/CustodyAccount+OversightCycle
          dependency, disjoint from the Partner/ProgramAgreement pair above.
        test_recipe:
          setup:
            - "Partner 'Larkspur Money' LIVE at reserve_requirement_bps = 500 with FBO_END_USER 5000000 and RESERVE 312500."
            - "One settlement batch over [2026-07-01, 2026-07-15) with gross 1000000 is reconciled MATCHED and funded: gross 1000000 < TIER_2_GROSS_FLOOR_CENTS so bank_fee_bps_applied = 45, bank_fee = 25000 + 4500 = 29500, reserve_funding = 50000, net_to_partner = 920500. FBO falls to 4000000 and RESERVE rises to 312500 + 50000 - 29500 = 333000, giving residual_balance_cents = 4333000."
            - "Cycles: cycle 1 [2026-08-01, 2026-09-01) then cycle 2 [2026-09-01, 2026-10-01). Wind-down target date 2026-10-01."
            - "Termination runs through POST /oversight/agreements/{id}/terminate (RiskCommittee, termination_trigger VOLUNTARY, which is present in the agreement's termination_triggers); its side effect advances the Partner LIVE -> WIND_DOWN, which is the precondition for submitting the plan."
            - "The plan is created at logical clock 2026-08-01 with notice_days 30, so execute is legal only once the clock reaches 2026-08-31 or later; the batch is already MATCHED and FUNDED, satisfying execute's no-UNFUNDED and no-open-variance preconditions."
