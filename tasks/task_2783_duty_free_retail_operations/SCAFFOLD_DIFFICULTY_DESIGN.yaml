            - call: "POST /concession-agreements/${ag_aug}/activate"
              payload: {}
              as: TerminalAdmin
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0009", nationality_code: "CN", boarding_pass_barcode: "BP-0009", departure_terminal_id: "${t_sin}", departure_utc: "2026-08-25T10:00:00Z", destination_country: "AU", final_destination_country: "AU", has_connection: false }
              as: SalesAssociate
              captures: { it_9: $.data.id }
            - call: "POST /itineraries/${it_9}/scan-boarding-pass"
              payload: { boarding_pass_barcode: "BP-0009" }
              as: SalesAssociate
