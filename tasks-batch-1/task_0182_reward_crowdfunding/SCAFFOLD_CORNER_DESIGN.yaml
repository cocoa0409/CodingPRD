              as: Creator
              as_user_id: "${c_id}"
              captures: { k1_id: $.data.id }
            - call: "POST /campaigns/${k1_id}/tiers"
              payload: { title: "T1", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /campaigns/${k1_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { k1_v1: $.data.version }
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "K2", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-08-01T00:00:00.000Z" }
