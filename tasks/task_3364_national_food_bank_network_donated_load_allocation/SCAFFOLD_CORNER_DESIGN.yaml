        distinguishing_aspect: "The system is immediate-consistent: the award response itself carries the post-cascade load state (AWARDED, awarded_bid_id, awarded_member_id, freight_estimate_cents) without requiring a re-read."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Load L1 (40000 lbs, 620 miles) is BIDDING with M1's 400-share bid SUBMITTED; M1 is CERTIFIED with 100000 shares."
