# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 difficulty rules × >= 2 instances = 19 instances (rule combinatorial_formula
# carries 3, one per mode). Every recipe replays from empty-DB via §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: EnrollmentEntry vs ResearchDataset)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: enrollment_status_census_vs_report_date
        grounds:
          - calculations.enrollment_status_determination
          - entities.EnrollmentEntry.fields.status_code
          - entities.EnrollmentEntry.fields.census_status_code
        distinguishing_aspect: |
          One entity domain (EnrollmentEntry), two pinned variants of the same rule:
          a mid-census withdrawal (2026-10-15 > census 2026-09-15) yields
          census_status_code == FULL_TIME while the as-of-certification report
          variant yields status_code == WITHDRAWN for the identical row data.
        test_recipe:
          setup:
            - "Compliant institution with ACTIVE agreement and OPEN period Fall 2026 (term 2026-09-01..2026-12-15, census 2026-09-15)"
            - "One ACCEPTED entry: UNDERGRAD, 12.0 credits, withdrawal_date 2026-10-15 (after census), servicer_ref SVC-100"
            - "File certified at logical time 2026-11-15"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id", cert_uid: "$.data.users[1].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15", withdrawal_date: "2026-10-15", servicer_ref: "SVC-100" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
          trigger:
            - { call: "POST /enrollment-files/${file_id}/certify", payload: {}, as: RegistrarCertifier, as_user_id: "${cert_uid}" }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { e1_census: "$.data[0].census_status_code", e1_status: "$.data[0].status_code", e1_defer: "$.data[0].deferment_status", e1_id: "$.data[0].id" } }
            - { call: "GET /servicer-notifications", payload: { enrollment_entry_id: "${e1_id}" }, as: ClearinghouseOps, captures: { n1_type: "$.data[0].notification_type", n1_grace: "$.data[0].grace_end_date" } }
          assert:
            - "captured e1_census == FULL_TIME (withdrawal 2026-10-15 is after census 2026-09-15, so census variant keeps the credit band)"
            - "captured e1_status == WITHDRAWN (report variant as-of 2026-11-15 >= withdrawal_date)"
            - "captured e1_defer == WITHDRAWN_GRACE (2026-11-15 < withdrawal+180d)"
            - "captured n1_type == WITHDRAWN_GRACE"
            - "captured n1_grace == 2027-04-13T00:00:00Z (2026-10-15 + 180 days)"

      - name: research_cohort_census_vs_adjusted_denominator
        grounds:
          - calculations.research_cohort_metrics
          - entities.ResearchDataset.fields.completion_rate_census
          - entities.ResearchDataset.fields.completion_rate_adjusted
        distinguishing_aspect: |
          Second entity domain (ResearchDataset): identical cohort and completers
          produce completion_rate_census == 0.4000 (4/10) under the census
          denominator but completion_rate_adjusted == 0.4444 (4/9) because the
          adjusted denominator excludes the single census-WITHDRAWN member.
        test_recipe:
          setup:
            - "Compliant institution, Fall 2026 period, certified file with 12 students (S01..S12, all UNDERGRAD 12.0 credits); S01 has withdrawal_date 2026-09-10 (before census 2026-09-15 => census WITHDRAWN)"
            - "S03, S04, S05, S06 each hold a SEALED BACHELOR degree conferred 2027-05-15 (inside window + 730d lag)"
            - "S11 and S12 hold ACTIVE RESEARCH_OPT_OUT directives (effective_from 2026-01-01, indefinite)"
            - "Dataset window [2026-09-01, 2026-12-15]; generate at 2028-06-01"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id", cert_uid: "$.data.users[1].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S01", full_name: "Student One", date_of_birth: "2004-01-01", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15", withdrawal_date: "2026-09-10" }, { student_ref: "S02", full_name: "Student Two", date_of_birth: "2004-01-02", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S03", full_name: "Student Three", date_of_birth: "2004-01-03", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S04", full_name: "Student Four", date_of_birth: "2004-01-04", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S05", full_name: "Student Five", date_of_birth: "2004-01-05", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S06", full_name: "Student Six", date_of_birth: "2004-01-06", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S07", full_name: "Student Seven", date_of_birth: "2004-01-07", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S08", full_name: "Student Eight", date_of_birth: "2004-01-08", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S09", full_name: "Student Nine", date_of_birth: "2004-01-09", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S10", full_name: "Student Ten", date_of_birth: "2004-01-10", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S11", full_name: "Student Eleven", date_of_birth: "2004-01-11", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "S12", full_name: "Student Twelve", date_of_birth: "2004-01-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "POST /enrollment-files/${file_id}/certify", payload: {}, as: RegistrarCertifier, as_user_id: "${cert_uid}" }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { st03: "$.data[2].student_id", st04: "$.data[3].student_id", st05: "$.data[4].student_id", st06: "$.data[5].student_id", st11: "$.data[10].student_id", st12: "$.data[11].student_id" } }
            - { call: "POST /degree-records", payload: { institution_id: "${inst_id}", student_id: "${st03}", degree_level: "BACHELOR", degree_title: "BS Biology", conferred_on: "2027-05-15" }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { d3: "$.data.id" } }
            - { call: "POST /degree-records", payload: { institution_id: "${inst_id}", student_id: "${st04}", degree_level: "BACHELOR", degree_title: "BS Chemistry", conferred_on: "2027-05-15" }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { d4: "$.data.id" } }
            - { call: "POST /degree-records", payload: { institution_id: "${inst_id}", student_id: "${st05}", degree_level: "BACHELOR", degree_title: "BS Physics", conferred_on: "2027-05-15" }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { d5: "$.data.id" } }
            - { call: "POST /degree-records", payload: { institution_id: "${inst_id}", student_id: "${st06}", degree_level: "BACHELOR", degree_title: "BS Math", conferred_on: "2027-05-15" }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { d6: "$.data.id" } }
            - { call: "POST /degree-records/${d3}/seal", payload: {}, as: RegistrarCertifier, as_user_id: "${cert_uid}" }
            - { call: "POST /degree-records/${d4}/seal", payload: {}, as: RegistrarCertifier, as_user_id: "${cert_uid}" }
            - { call: "POST /degree-records/${d5}/seal", payload: {}, as: RegistrarCertifier, as_user_id: "${cert_uid}" }
            - { call: "POST /degree-records/${d6}/seal", payload: {}, as: RegistrarCertifier, as_user_id: "${cert_uid}" }
            - { call: "GET /students/${st11}", payload: {}, as: ClearinghouseOps, captures: { st11_v: "$.data.version" } }
            - { call: "POST /students/${st11}/privacy-directives", payload: { directive_type: "RESEARCH_OPT_OUT", effective_from: "2026-01-01", expected_student_version: "${st11_v}" }, as: ClearinghouseOps }
            - { call: "GET /students/${st12}", payload: {}, as: ClearinghouseOps, captures: { st12_v: "$.data.version" } }
            - { call: "POST /students/${st12}/privacy-directives", payload: { directive_type: "RESEARCH_OPT_OUT", effective_from: "2026-01-01", expected_student_version: "${st12_v}" }, as: ClearinghouseOps }
            - { call: "POST /research-datasets", payload: { scope_institution_id: "${inst_id}", cohort_term_start: "2026-09-01", cohort_term_end: "2026-12-15" }, as: ResearchAnalyst, captures: { ds_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-06-01T00:00:00Z" }, as: ClearinghouseOps }
          trigger:
            - { call: "POST /research-datasets/${ds_id}/generate", payload: {}, as: ClearinghouseOps, captures: { ds_size: "$.data.cohort_size", ds_comp: "$.data.completer_count", ds_adj: "$.data.adjusted_cohort_size", ds_rate_c: "$.data.completion_rate_census", ds_rate_a: "$.data.completion_rate_adjusted" } }
          assert:
            - "captured ds_size == 10 (12 enrolled minus 2 opted-out)"
            - "captured ds_comp == 4"
            - "captured ds_adj == 9 (S01 excluded: census_status_code WITHDRAWN since withdrawal 2026-09-10 <= census 2026-09-15)"
            - "captured ds_rate_c == 0.4000"
            - "captured ds_rate_a == 0.4444"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (modes a, b, c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: enrollment_status_grad_vs_undergrad_branch
        grounds:
          - calculations.enrollment_status_determination
        distinguishing_aspect: |
          Mode (a) multi-input conditional branch: identical 9.0 credit_hours
          yields FULL_TIME for career_level GRADUATE (>= 9.0) but HALF_TIME for
          UNDERGRAD (>= 6.0, < 12.0) — the threshold set is itself conditioned
          on a third input (career_level), beyond withdrawal branching.
        test_recipe:
          setup:
            - "Compliant institution, OPEN Fall 2026 period, file with two rows: G1 GRADUATE 9.0 credits, U1 UNDERGRAD 9.0 credits, no withdrawals"
            - "File certified at 2026-11-15"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id", cert_uid: "$.data.users[1].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "G1", full_name: "Grad One", date_of_birth: "2000-03-01", career_level: "GRADUATE", credit_hours: 9.0, term_start: "2026-09-01", term_end: "2026-12-15" }, { student_ref: "U1", full_name: "Undergrad One", date_of_birth: "2004-03-01", career_level: "UNDERGRAD", credit_hours: 9.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
          trigger:
            - { call: "POST /enrollment-files/${file_id}/certify", payload: {}, as: RegistrarCertifier, as_user_id: "${cert_uid}" }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { g_status: "$.data[0].status_code", u_status: "$.data[1].status_code" } }
          assert:
            - "captured g_status == FULL_TIME (GRADUATE threshold 9.0, >= comparison)"
            - "captured u_status == HALF_TIME (same 9.0 credits, UNDERGRAD band [6.0, 12.0))"

      - name: verification_fee_rounding_order_pinned
        grounds:
          - calculations.verification_fee_quote
          - entities.VerificationRequest.fields.fee_cents
        distinguishing_aspect: |
          Mode (b) nested rounding order: for a PREFERRED-tier rush DEGREE quote the
          pinned order (round discounted base 2599*0.8 -> 2079 first, then rush
          round(2079*0.3333) -> 693) yields fee_cents == 2772, while the forbidden
          sum-then-round order yields 2771 — a one-cent divergence only the pinned
          order gets right.
        test_recipe:
          setup:
            - "Compliant institution; student with SEALED degree; VETTED EMPLOYER requester with balance 50000 and THREE already-RELEASED DEGREE verifications in Q4 2026 (=> PREFERRED at the next quote)"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id", cert_uid: "$.data.users[1].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
            - { call: "POST /institutions/${inst_id}/reporting-periods", payload: { term_label: "Fall 2026", term_start: "2026-09-01", term_end: "2026-12-15", submission_opens_at: "2026-11-01", submission_due_at: "2026-12-20" }, as: ClearinghouseOps, captures: { period_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ClearinghouseOps }
            - { call: "GET /institutions/${inst_id}/reporting-periods", payload: {}, as: ClearinghouseOps, captures: { period_v: "$.data[0].version" } }
            - { call: "POST /enrollment-files", payload: { institution_id: "${inst_id}", reporting_period_id: "${period_id}", expected_reporting_period_version: "${period_v}", rows: [ { student_ref: "S1", full_name: "Ada Lovelace", date_of_birth: "2004-05-12", career_level: "UNDERGRAD", credit_hours: 12.0, term_start: "2026-09-01", term_end: "2026-12-15" } ] }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { file_id: "$.data.id" } }
            - { call: "GET /enrollment-entries", payload: { file_id: "${file_id}" }, as: ClearinghouseOps, captures: { st1: "$.data[0].student_id" } }
            - { call: "POST /degree-records", payload: { institution_id: "${inst_id}", student_id: "${st1}", degree_level: "BACHELOR", degree_title: "BS CS", conferred_on: "2026-05-15" }, as: RegistrarSubmitter, as_user_id: "${sub_uid}", captures: { deg1: "$.data.id" } }
            - { call: "POST /degree-records/${deg1}/seal", payload: {}, as: RegistrarCertifier, as_user_id: "${cert_uid}" }
            - { call: "POST /requesters", payload: { org_name: "Acme Hiring", requester_kind: "EMPLOYER", initial_credit_cents: 50000 }, as: ClearinghouseOps, captures: { rq_id: "$.data.id" } }
            - { call: "POST /requesters/${rq_id}/vet", payload: { outcome: "VET" }, as: ClearinghouseOps }
            - { call: "POST /verification-requests", payload: { requester_id: "${rq_id}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "DEGREE", purpose: "EMPLOYMENT" }, as: Requester, as_user_id: "${rq_id}", captures: { r1: "$.data.id" } }
            - { call: "POST /verification-requests/${r1}/pay", payload: {}, as: Requester, as_user_id: "${rq_id}" }
            - { call: "POST /verification-requests/${r1}/fulfill", payload: {}, as: ClearinghouseOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T01:00:00Z" }, as: ClearinghouseOps }
            - { call: "POST /verification-requests", payload: { requester_id: "${rq_id}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "DEGREE", purpose: "EMPLOYMENT" }, as: Requester, as_user_id: "${rq_id}", captures: { r2: "$.data.id" } }
            - { call: "POST /verification-requests/${r2}/pay", payload: {}, as: Requester, as_user_id: "${rq_id}" }
            - { call: "POST /verification-requests/${r2}/fulfill", payload: {}, as: ClearinghouseOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T02:00:00Z" }, as: ClearinghouseOps }
            - { call: "POST /verification-requests", payload: { requester_id: "${rq_id}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "DEGREE", purpose: "EMPLOYMENT" }, as: Requester, as_user_id: "${rq_id}", captures: { r3: "$.data.id" } }
            - { call: "POST /verification-requests/${r3}/pay", payload: {}, as: Requester, as_user_id: "${rq_id}" }
            - { call: "POST /verification-requests/${r3}/fulfill", payload: {}, as: ClearinghouseOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T03:00:00Z" }, as: ClearinghouseOps }
          trigger:
            - { call: "POST /verification-requests", payload: { requester_id: "${rq_id}", student_id: "${st1}", institution_id: "${inst_id}", product_type: "DEGREE", purpose: "EMPLOYMENT", rush: true }, as: Requester, as_user_id: "${rq_id}", captures: { r4: "$.data.id", r4_fee: "$.data.fee_cents", r4_tier: "$.data.volume_tier_at_quote" } }
            - { call: "POST /verification-requests/${r4}/pay", payload: {}, as: Requester, as_user_id: "${rq_id}" }
            - { call: "GET /requesters/${rq_id}", payload: {}, as: ClearinghouseOps, captures: { rq_bal: "$.data.credit_balance_cents" } }
          assert:
            - "captured r4_tier == PREFERRED (3 prior RELEASED in Q4 2026 >= threshold 3)"
            - "captured r4_fee == 2772 (round(2599*0.8)=2079 first; rush round(2079*0.3333)=693; 2079+693; sum-then-round's 2771 is the rejected alternative)"
            - "captured rq_bal == 39431 (50000 - 3*2599 - 2772)"

      - name: volume_tier_self_exclusion_at_quote
        grounds:
          - calculations.requester_volume_tier
          - calculations.verification_fee_quote
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: the
          request being priced will itself join the released-count that defines
          the tier; the rule counts only requests RELEASED strictly before the
          quote — so the 3rd request quotes STANDARD (count 2) at fee 2599 and
          only the 4th quotes PREFERRED (count 3) at fee 2079.
        test_recipe:
          setup:
            - "Compliant institution; student with SEALED degree; VETTED EMPLOYER requester with balance 50000 and exactly TWO prior RELEASED DEGREE verifications in Q4 2026"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" }, { email: "cert@su.edu", role: "CERTIFIER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id", cert_uid: "$.data.users[1].id" } }
            - { call: "POST /institutions/${inst_id}/agreements", payload: { effective_from: "2026-01-01", effective_to: "2027-06-30" }, as: ClearinghouseOps }
