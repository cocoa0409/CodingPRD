          proposed_reciprocal_rate_per_mou_usd: 0.061250
          proposed_term_months: 36
          transit_traffic_allowed: false
          effective_date: '2026-08-01T00:00:00.000Z'
          poi_facility_capacity_trunks: 192
        as: InterconnectionManager
        captures:
          agr_id: $.data.id
          agr_v0: $.data.version
      - call: POST /interconnection/agreements/${agr_id}/offers
        payload:
          expected_agreement_version: ${agr_v0}
          offer_type: PROPOSAL
          reciprocal_rate_per_mou_usd: 0.061250
          term_months: 36
          poi_financial_responsibility: SHARED
          transit_traffic_allowed: false
        as: InterconnectionManager
        captures:
          offer1_id: $.data.id
      - call: POST /interconnection/negotiation-offers/${offer1_id}/accept
        payload: {}
        as: CarrierRepresentative
        as_user_id: ${car_id}
      - call: POST /interconnection/trunk-groups
        payload:
          agreement_id: ${agr_id}
          trunk_group_serial: TG-DLLS-TWOWAY-001
          poi_clli_code: DLLSTXCTDS0
          lata_code: '552'
          poi_type: MEET_POINT
          direction: TWO_WAY
          traffic_type: LOCAL_INTERCONNECTION
          forecast_busy_hour_ccs: 1200.00
          forecast_horizon_quarters: 4
        as: NetworkPlanner
        captures:
          tg1_id: $.data.id
      - call: POST /interconnection/trunk-groups/${tg1_id}/provision
        payload:
          provisioned_trunks: 48
        as: NetworkPlanner
      trigger:
      - call: POST /interconnection/trunk-groups/${tg1_id}/activate
        payload: {}
        as: NetworkPlanner
        captures: *id004
      - call: POST /interconnection/agreements/${agr_id}/activate
        payload: {}
        as: InterconnectionManager
      - call: POST /interconnection/trunk-groups/${tg1_id}/activate
        payload: {}
        as: NetworkPlanner
      assert:
      - The first activate returns 409 with error_id ERR_AGREEMENT_NOT_EFFECTIVE
      - After the rejection TrunkGroup.${tg1_id}.service_status is still PROVISIONED and in_service_at is null
      - InterconnectionAgreement.${agr_id}.status == EXECUTED at the moment of the rejection and total_in_service_trunks == 0
      - After the parent activation InterconnectionAgreement.${agr_id}.status == EFFECTIVE
      - The second activate returns 200 and TrunkGroup.${tg1_id}.service_status == IN_SERVICE with provisioned_trunks 48
      - InterconnectionAgreement.${agr_id}.total_in_service_trunks == 48 and capacity_posture == NORMAL
  - name: batch_rating_requires_effective_tariff_for_every_carried_jurisdiction
