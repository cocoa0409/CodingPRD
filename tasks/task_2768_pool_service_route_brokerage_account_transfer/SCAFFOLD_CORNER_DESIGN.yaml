      - name: withdraw_listing_terminates_only_the_non_terminal_deals
        claim_type: conditional_cascade
        grounds:
          - "state_machines.RouteListing[LISTED -> WITHDRAWN]"
          - "endpoints[POST /route-listings/{id}/withdraw]"
          - "entities.Deal.fields.termination_reason_code"
          - "state_machines.Deal[OFFER_SUBMITTED -> TERMINATED]"
        distinguishing_aspect: "The withdraw cascade is conditional on each deal's own status: deal 1 is OFFER_SUBMITTED and is terminated with LISTING_WITHDRAWN, while deal 2 was already TERMINATED with BUYER_WITHDREW and keeps that reason code -- a cascade that overwrote every child would corrupt the audit trail of the already-dead deal."
