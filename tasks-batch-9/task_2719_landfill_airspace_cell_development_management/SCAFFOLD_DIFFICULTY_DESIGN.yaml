            - call: "POST /aerial-surveys"
              payload: { landfill_id: "${lf_id}", flown_on: "2026-08-01T00:00:00Z", coverage_period_start: "2026-05-01T00:00:00Z", coverage_period_end: "2026-07-31T00:00:00Z", measured_remaining_airspace_cy: 700000, tons_placed_in_period: 250000 }
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
              captures: { s1_id: $.data.id, s1_density: $.data.measured_density_tons_per_cy, s1_state0: $.data.status }
          trigger:
            - call: "POST /aerial-surveys"
              payload: { landfill_id: "${lf_id}", flown_on: "2026-11-15T00:00:00Z", coverage_period_start: "2026-07-31T00:00:00Z", coverage_period_end: "2026-10-31T00:00:00Z", measured_remaining_airspace_cy: 640000, tons_placed_in_period: 50000 }
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
            - call: "POST /aerial-surveys"
              payload: { landfill_id: "${lf_id}", flown_on: "2026-10-29T00:00:00Z", coverage_period_start: "2026-08-01T00:00:00Z", coverage_period_end: "2026-10-28T00:00:00Z", measured_remaining_airspace_cy: 640000, tons_placed_in_period: 50000 }
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
            - call: "POST /aerial-surveys"
              payload: { landfill_id: "${lf_id}", flown_on: "2026-10-29T00:00:00Z", coverage_period_start: "2026-07-31T00:00:00Z", coverage_period_end: "2026-10-28T00:00:00Z", measured_remaining_airspace_cy: 640000, tons_placed_in_period: 50000 }
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
            - call: "POST /aerial-surveys"
              payload: { landfill_id: "${lf_id}", flown_on: "2026-10-30T00:00:00Z", coverage_period_start: "2026-08-01T00:00:00Z", coverage_period_end: "2026-10-29T00:00:00Z", measured_remaining_airspace_cy: 640000, tons_placed_in_period: 50000 }
