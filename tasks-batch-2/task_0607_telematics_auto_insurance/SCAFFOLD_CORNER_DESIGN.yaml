              as: UnderwritingOps
              captures: { rp_id: $.data.id }
            - call: "POST /drivers"
              payload: { email: "c2@x.com", full_name: "C Two", state_code: "CA" }
              as: DriverUser
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
