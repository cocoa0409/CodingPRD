              captures: { scope_id: $.data.id }
            - call: "POST /club/observing-events"
              payload: { title: "Own E", event_kind: "MEMBER_NIGHT", window_start: "2026-08-10T01:00:00Z", window_end: "2026-08-10T05:00:00Z", moon_illumination_pct: 50, min_operators: 1 }
              as: EventCoordinator
              captures: { event_id: $.data.id }
            - call: "POST /club/event-operator-assignments"
              payload: { event_id: "${event_id}", member_id: "${a_id}", telescope_id: "${scope_id}" }
              as: EventCoordinator
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /club/event-operator-assignments/${asg_id}/accept"
              payload: {}
              as: Member
