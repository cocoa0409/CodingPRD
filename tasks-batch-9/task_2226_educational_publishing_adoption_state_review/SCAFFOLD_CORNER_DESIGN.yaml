              payload: { title_id: "${ttl_id}", state_id: "${st_in_id}", edit_type: "ADD_REQUIRED_TOPIC", topic_code: "INDIANA_WATERSHEDS", pages_delta: 6, rationale: "Adds the Indiana watersheds unit the state requires." }
              as: PublisherEditor
              as_user_id: "u-7"
              captures: { ce_id: $.data.id }
          trigger:
            - call: "POST /content-edits/${ce_id}/review"
              payload: { verdict: "APPROVE" }
              as: EditorialDirector
              as_user_id: "u-7"
              captures: { err: $.data.error_id }
            - call: "POST /content-edits/${ce_id}/review"
              payload: { verdict: "APPROVE" }
              as: EditorialDirector
              as_user_id: "u-9"
              captures: { approved_status: $.data.status }
          assert:
            - "the first call returns HTTP status 403 with error_id ERR_SEGREGATION_OF_DUTIES"
