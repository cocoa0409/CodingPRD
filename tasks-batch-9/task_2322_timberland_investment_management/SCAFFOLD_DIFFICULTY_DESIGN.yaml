      - name: underwriting_revision_loop_terminates_at_two_rounds
        grounds:
          - state_machines.UnderwritingCase.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.UnderwritingCase.REVISION_REQUESTED_to_SUBMITTED
          - state_machines.Property.UNDER_UNDERWRITING_to_UNDER_UNDERWRITING
          - entities.UnderwritingCase.fields.revision_count
          - validations[priority=55]
        distinguishing_aspect: |
          The case cycles SUBMITTED -> REVISION_REQUESTED -> SUBMITTED twice while the
          Property self-loops on UNDER_UNDERWRITING, and the third REQUEST_REVISION is
          refused with ERR_REVISION_LIMIT_REACHED (409) leaving revision_count frozen at
          2 and status still SUBMITTED — the loop is bounded by a counter, not by the
