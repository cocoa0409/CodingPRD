  # -------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: extension_grant_cascade_depth3_motion_to_schedule_to_brief_to_deadline
        grounds:
          - state_machines.ExtensionMotion.PENDING_to_GRANTED
          - calculations.extension_cascade_delta
          - state_machines.BriefingSchedule
        distinguishing_aspect: |
          Depth-3 chain triggered by ExtensionMotion grant:
          (1) motion GRANTED →
          (2) BriefingSchedule.opening_due_at shifts (and response/reply shift
              via cascade logic, not direct mutation by the original action) →
          (3) each Brief.due_at re-derives from the shifted schedule →
          (4) each Deadline of kind matching the target recomputes final_due_at.
          Each link is CAUSED by the previous link's mutation, not by the
          original grant call.
        test_recipe:
          setup:
            - "Case in BRIEFING with ACTIVE schedule"
            - "An OPENING brief B exists in DRAFT, due_at inherited from schedule"
            - "An ExtensionMotion on OPENING target in PENDING"
            - "A Deadline row kind=OPENING_BRIEF with final_due_at == provisional"
          setup_api_calls:
            - call: "POST /appellate/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: CourtAdmin
