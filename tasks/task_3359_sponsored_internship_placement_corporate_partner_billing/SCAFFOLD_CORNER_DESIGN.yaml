        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[agreement-activate-stale-partner]
          - validations[priority=27]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "activation carries expected_partner_version, so a request that still holds the version observed before the partner advanced is rejected with 412 instead of activating."
        test_recipe:
          setup:
            - "the Northwind partner exists at version 1 and a DRAFT agreement references it"
          setup_api_calls:
