              captures: { lot1_id: $.data.id, lot_v_create: $.data.version }
            - call: "POST /redemption-events"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", points_requested: 400, redemption_type: "CATALOG" }
              as: LoyaltyAccountant
              captures: { rev1_id: $.data.id, rev_v_create: $.data.version }
          trigger:
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Controller
              captures: { prog_v_before: $.data.version }
            - call: "POST /programs/${prog_id}/suspend"
              payload: {}
              as: ProgramAdmin
              captures: { prog_v_suspended: $.data.version }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { prog_v_reactivated: $.data.version }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: Controller
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: LoyaltyAccountant
              captures: { prog_v_after_reads: $.data.version }
            - call: "POST /redemption-events/${rev1_id}/allocate"
              payload: {}
              as: LoyaltyAccountant
              captures: { rev_v_allocated: $.data.version }
            - call: "GET /point-lots/${lot1_id}"
              payload: {}
              as: LoyaltyAccountant
              captures: { lot_v_allocated: $.data.version }
            - call: "POST /redemption-events/${rev1_id}/fulfill"
              payload: {}
              as: LoyaltyAccountant
              captures: { rev_v_fulfilled: $.data.version }
          assert:
            - "${prog_v_create} == 1, ${lot_v_create} == 1 and ${rev_v_create} == 1 - every entity starts its OCC counter at 1"
            - "${prog_v_suspended} == ${prog_v_before} + 1 and ${prog_v_reactivated} == ${prog_v_suspended} + 1 - each transition advances the counter by exactly one"
            - "${prog_v_after_reads} == ${prog_v_reactivated} - three intervening GETs, which each recompute total_deferred_revenue_cents and recognized_breakage_ytd_cents, advanced nothing"
            - "LoyaltyProgram.${prog_id}.current_breakage_rate_bp is STILL 2500 after the SUSPENDED -> ACTIVE transition - reactivation does not reseed the rate"
            - "${rev_v_allocated} == ${rev_v_create} + 1 and ${rev_v_fulfilled} == ${rev_v_allocated} + 1"
            - "${lot_v_allocated} == ${lot_v_create} + 1 - the allocation mutated points_remaining, so the LOT's own counter advanced too, independently of the event's"
            - "RedemptionEvent.${rev1_id}.provisional_revenue_recognized_cents == 360 (line_gross round_half_up(400 * 1200 / 1000) == 480 less reserve round_half_up(480 * 2500 / 10000) == 120)"
            - "RedemptionEvent.${rev1_id}.remeasurement_delta_cents == 0 at fulfilment - no estimate was approved in between, so the final rate 2500 equals every lot's frozen rate"

