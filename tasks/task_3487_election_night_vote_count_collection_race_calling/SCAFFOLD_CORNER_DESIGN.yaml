      - name: patch_contest_after_lock_forbidden
        claim_type: Violation to Error
        grounds:
          - validations[priority=5]
          - endpoints.PATCH_/contests/{id}
          - errors[ERR_POSTURE_FORBIDS]
        distinguishing_aspect: "Contest data preparation is frozen at candidate lock: PATCH office_name after CANDIDATES_LOCKED fails ERR_POSTURE_FORBIDS; before the lock it succeeds."
        test_recipe:
          setup: ["Standard universe through CANDIDATES_LOCKED; one PATCH succeeded back in SETUP."]
          setup_api_calls:
            - *k_clock
            - *k_ev
            - *k_cty_a
            - *k_cst
            - call: "PATCH /contests/${cst}"
              payload: { office_name: "United States Senator" }
              as: ElectionOpsAdmin
            - *k_lnk_a
            - *k_cw
            - *k_ct
            - *k_lock
          trigger:
            - call: "PATCH /contests/${cst}"
              payload: { office_name: "US Senate (renamed late)" }
              as: ElectionOpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_POSTURE_FORBIDS"
            - "Contest.${cst}.office_name == \"United States Senator\" (the SETUP-time patch stuck)"

