    code: 200
    input: []
    output: ReportDelivery
    side_effects: []
  - method: POST
    path: "/report-deliveries/{id}/compile"
    description: "Compile a SCHEDULED delivery: safety (opt-out, jurisdiction), temporal window, version currency, cell availability, entitlement — then debits entitlement and computes fee"
    roles: [PlatformAdmin]
    code: 200
    input: ["include_prescriber_ids?"]
    output: ReportDelivery
    side_effects: ["sets compiled_cell_ids and included_prescriber_ids", "computes fee_cents (calc_delivery_fee)", "client.entitlement_cells_balance -= len(compiled_cell_ids)", "increments ReportDelivery.version by 1"]
  - method: POST
    path: "/report-deliveries/{id}/release"
    description: "Release a COMPILED or REISSUED delivery to the client"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ReportDelivery
