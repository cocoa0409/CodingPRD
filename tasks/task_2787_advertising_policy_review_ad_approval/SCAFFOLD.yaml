    output: ReviewTask[]
    side_effects: []

  - method: POST
    path: "/ad-policy/review-tasks/{id}/claim"
    description: "Claim a QUEUED task; the acting reviewer must match the queue, cover every target country and be below their claim ceiling"
    roles: [PolicyReviewer]
    code: 200
    input: []
    output: ReviewTask
    side_effects: ["status QUEUED -> CLAIMED, assigned_reviewer_id = X-User-ID, claimed_at = logical clock", "increments Reviewer.claimed_task_count and Reviewer.version by 1", "increments ReviewTask.version by 1"]

  - method: POST
    path: "/ad-policy/review-tasks/{id}/release"
    description: "Release a claimed task back to its queue; the compensating action for claim"
    roles: [PolicyReviewer]
    code: 200
    input: []
    output: ReviewTask
    side_effects: ["status CLAIMED -> QUEUED, clears assigned_reviewer_id and claimed_at", "decrements Reviewer.claimed_task_count and increments Reviewer.version by 1", "priority_score and sla_deadline_at are unchanged", "increments ReviewTask.version by 1"]

  - method: POST
    path: "/ad-policy/review-tasks/{id}/decision"
    description: "Record the reviewer verdict: resolution in {APPROVE, APPROVE_WITH_LIMITS, DISAPPROVE, ESCALATE}; reason_codes required for DISAPPROVE, limited_country_codes required for APPROVE_WITH_LIMITS, note required for ESCALATE"
    roles: [PolicyReviewer]
    code: 200
    input: [resolution, "reason_codes?", "limited_country_codes?", "note?"]
    output: ReviewTask
    side_effects: ["APPROVE / APPROVE_WITH_LIMITS / DISAPPROVE: status -> RESOLVED and the matching AdCreative.review_status transition with its cascade", "ESCALATE: status -> ESCALATED, escalation_note written, AdCreative untouched", "decrements Reviewer.claimed_task_count and increments Reviewer.version by 1 on every branch", "APPROVE_WITH_LIMITS writes AdCreative.limited_country_codes and approved_under_certification_id", "an approval of a political creative writes one PoliticalArchiveEntry", "DISAPPROVE creates a DisapprovalNotice, a ViolationLedgerEntry and possibly an EnforcementAction", "increments ReviewTask.version by 1"]

