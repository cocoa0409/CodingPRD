      - name: permit_submit_lead_time_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=23]", "errors[ERR_PERMIT_LEAD_TIME]"]
        distinguishing_aspect: "Submitting a permit 134h before the event (clock advanced to 2026-06-01 for a 2026-06-06 event) violates the 336h lead time."
