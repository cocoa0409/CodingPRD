          assert:
            - "Subscription.${sub_id}.subscription_status == CANCELLED"
            - "Subscription.${sub_id}.cancel_reason == USER_REQUESTED"

      - name: signup_attribution_created_on_subscribe
        claim_type: cross_reference_link
        grounds:
          - "entities.SignupAttribution"
          - "endpoints.POST_/v1/subscriptions"
        distinguishing_aspect: "Creating a subscription auto-creates a SignupAttribution with cohort_month derived from created_at."
