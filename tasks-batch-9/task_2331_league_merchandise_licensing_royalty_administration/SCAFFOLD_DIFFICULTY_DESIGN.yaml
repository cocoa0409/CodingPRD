              payload: { legal_name: "Meridian Fan Goods", contact_email: "ops@meridian.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_m: $.data.id }
            - call: "POST /licensing/licensees/${lic_m}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
