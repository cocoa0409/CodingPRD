        distinguishing_aspect: "Underwriting is exclusive to CreditAnalyst, so a CustomerService calling review is refused with ERR_UNAUTHORIZED and the request stays SUBMITTED with a null determined class."
        test_recipe:
          setup: ["One FAMILY account with a submitted line addition request for 1 line"]
