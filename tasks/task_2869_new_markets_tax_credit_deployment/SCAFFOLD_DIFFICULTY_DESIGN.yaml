  - rule_id: cross_entity_state_dependency
    instances:
      - name: qlici_deployment_blocked_by_the_qalicb_state_a_sibling_qei_annual_test_swept
        grounds:
          - state_machines.QALICB.eligibility_status.CERTIFIED_to_RECERTIFICATION_DUE
          - validations[priority=23]
          - endpoints[POST /nmtc/qeis/{id}/annual-tests]
          - endpoints[POST /nmtc/qlicis]
        distinguishing_aspect: |
          Entity pair (QLICI, QALICB): whether a QLICI may be created depends entirely on a state
          that lives on a THIRD entity and was flipped by a call to a completely different
          endpoint. The annual test on the QEI sweeps its funded QALICB from CERTIFIED to
          RECERTIFICATION_DUE because certification is 379 days stale, and the very next QLICI
          request into a still-open deployment window is refused. The QALICB itself was never
          addressed by the sweeping request.
        test_recipe:
          setup:
            - "The QALICB is certified at 2026-08-01, so last_certified_at is 2026-08-01."
            - "The QEI is issued a month later at 2026-09-01, so deployment_deadline_at is 2027-09-01 and the deployment window is still open at the trigger."
            - "The QEI holds one QLICI of 85,000,000 cents, leaving uninvested_cash_cents 10,000,000."
            - "The clock is then moved to 2027-08-15 — 379 days after certification (stale) but 17 days before the deployment deadline (fresh)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Delta Community Capital CDE", certification_number: "CDE-2869-012", service_area_scope: "MULTI_STATE" }
