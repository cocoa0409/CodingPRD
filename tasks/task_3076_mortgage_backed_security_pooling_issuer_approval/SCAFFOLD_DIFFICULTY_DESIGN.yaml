          legal_name: Canyon Mortgage Co
          net_worth_cents: 900000000
          liquid_assets_cents: 5000000
          origination_experience_months: 48
          branch_count: 1
          annual_origination_volume_cents: 3000000000
        as: ApplicantOfficer
        as_user_id: officer-canyon
        captures:
          app_id: $.data.id
      - call: POST /issuer-applications/${app_id}/submit
        payload: {}
        as: ApplicantOfficer
        as_user_id: officer-canyon
      - call: POST /issuer-applications/${app_id}/review
        payload: {}
        as: AgencyReviewer
        as_user_id: reviewer-2
      - call: POST /issuer-applications/${app_id}/approve
        payload: {}
        as: AgencyReviewer
        as_user_id: reviewer-2
      - call: GET /issuer-applications/${app_id}
        payload: {}
        as: AgencyReviewer
        captures:
          iss_id: $.data.approved_issuer_id
      - call: GET /issuers/${iss_id}
        payload: {}
        as: PlatformAdmin
        captures:
          iss_v: $.data.version
      - call: POST /document-custodians
        payload:
          firm_name: TrustVault Custody
        as: PlatformAdmin
        captures:
          cust_id: $.data.id
      - call: POST /custodian-engagements
        payload:
          custodian_id: ${cust_id}
          issuer_id: ${iss_id}
          window_start: '2026-01-01'
          window_end: '2027-01-01'
        as: IssuerOfficer
        as_user_id: ${iss_id}
      - call: POST /pools
        payload:
          issuer_id: ${iss_id}
          custodian_id: ${cust_id}
          pool_type: SINGLE_FAMILY
          term_months: 360
          note_rate_bps: 680
          expected_issuer_version: ${iss_v}
        as: IssuerOfficer
        as_user_id: ${iss_id}
        captures:
          pool_id: $.data.id
      - call: POST /loans
        payload:
          pool_id: ${pool_id}
          principal_balance_cents: 1000000
          note_rate_bps: 780
          government_insurance: VA
          escrow_monthly_cents: 20000
        as: IssuerOfficer
        as_user_id: ${iss_id}
      - call: POST /loans
        payload:
          pool_id: ${pool_id}
          principal_balance_cents: 1000100
          note_rate_bps: 780
          government_insurance: VA
          escrow_monthly_cents: 20000
        as: IssuerOfficer
        as_user_id: ${iss_id}
      - call: POST /pools/${pool_id}/assemble
        payload: {}
        as: IssuerOfficer
        as_user_id: ${iss_id}
      - call: POST /pools/${pool_id}/certifications
        payload:
          decision: CERTIFIED
        as: DocumentCustodian
        as_user_id: ${cust_id}
      - call: POST /pools/${pool_id}/activate
        payload: {}
        as: IssuerOfficer
        as_user_id: ${iss_id}
        captures:
          pool_v: $.data.version
      trigger:
      - call: POST /investor-reports
        payload:
          pool_id: ${pool_id}
          period_month: 2026-10
          collection_rate_bps: 8000
          expected_pool_version: ${pool_v}
        as: IssuerOfficer
        as_user_id: ${iss_id}
        captures:
          rep_id: $.data.id
          sched: $.data.scheduled_payment_cents
          act: $.data.actual_collected_cents
      assert:
      - 'scheduled_payment_cents == 11333 proves per-loan rounding: floor(1000000*680/10000/12) + floor(1000100*680/10000/12) = 5666 + 5667'
      - 'actual_collected_cents == 9067 proves aggregate-then-floor: floor((2000100*680/10000/12) * 8000/10000) = floor(9067.12)'
      - 9067 != 9066 rules out the scale-the-rounded-scheduled-figure order
- rule_id: non_linear_state_machine
  instances:
  - name: application_revision_cycle_loop
    grounds:
    - state_machines.IssuerApplication
    distinguishing_aspect: 'Cyclic machine on IssuerApplication: UNDER_REVIEW ->

      REVISION_REQUESTED -> (PATCH) DRAFT -> SUBMITTED -> UNDER_REVIEW

      traverses the same states twice with version advancing at each hop; a

      linear pipeline could never revisit DRAFT.

      '
    test_recipe:
      setup:
      - Application drafted, submitted, under review; reviewer requested revision.
      setup_api_calls:
      - call: POST /issuer-applications
        payload:
          legal_name: Loop Cycle Funding
          net_worth_cents: 400000000
          liquid_assets_cents: 9000000
          origination_experience_months: 30
          branch_count: 1
          annual_origination_volume_cents: 2000000000
        as: ApplicantOfficer
        as_user_id: officer-loop
        captures:
          app_id: $.data.id
      - call: POST /issuer-applications/${app_id}/submit
        payload: {}
        as: ApplicantOfficer
        as_user_id: officer-loop
      - call: POST /issuer-applications/${app_id}/review
        payload: {}
        as: AgencyReviewer
        as_user_id: reviewer-1
      - call: POST /issuer-applications/${app_id}/request-revision
        payload: {}
        as: AgencyReviewer
        as_user_id: reviewer-1
        captures:
          app_v_rev: $.data.version
      trigger:
      - call: PATCH /issuer-applications/${app_id}
        payload:
          expected_application_version: ${app_v_rev}
          liquid_assets_cents: 8000000
        as: ApplicantOfficer
        as_user_id: officer-loop
      - call: POST /issuer-applications/${app_id}/submit
        payload: {}
        as: ApplicantOfficer
        as_user_id: officer-loop
      - call: POST /issuer-applications/${app_id}/review
        payload: {}
        as: AgencyReviewer
        as_user_id: reviewer-1
        captures:
          app_v_final: $.data.version
      assert:
      - PATCH moved the application REVISION_REQUESTED -> DRAFT with liquid_assets_cents == 8000000
      - 'second submit and review succeed: IssuerApplication.${app_id}.status == UNDER_REVIEW'
      - IssuerApplication.${app_id}.version == 7 at second UNDER_REVIEW (create=1, submit=2, review=3, request-revision=4, patch=5, submit=6,
        review=7)
  - name: issuer_watch_active_recovery_cycle
    grounds:
    - state_machines.Issuer
    - state_machines.DelinquencyBreach
    - state_machines.CorrectiveActionPlan
    distinguishing_aspect: "Cyclic machine on Issuer (different entity than IssuerApplication):\nACTIVE -> WATCH -> ACTIVE via breach cure completes\
      \ a full cycle gated\nby BOTH the breach set and manual agency close \u2014 curing the loan does\nNOT auto-close the breach, so issuer stays\
      \ WATCH until the agency\ncloses it.\n"
    test_recipe:
      setup:
      - Issuer ACTIVE with LIVE pool, loans 2000000 + 4000000 cents (aggregate 6000000; 5% threshold = 300000).
      - 'Loan B (4000000) moved CURRENT -> DELINQ_30 -> DELINQ_60: pool rate = round_half_up(4000000*10000/6000000) = 6667 bps >= 500 -> breach
        OPEN, issuer WATCH.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-03T00:00:00Z'
        as: PlatformAdmin
      - call: POST /issuer-applications
        payload:
          legal_name: Cycle Watch Lending
          net_worth_cents: 900000000
          liquid_assets_cents: 3000000
          origination_experience_months: 40
          branch_count: 1
          annual_origination_volume_cents: 3000000000
        as: ApplicantOfficer
        as_user_id: officer-cw
        captures:
          app_id: $.data.id
      - call: POST /issuer-applications/${app_id}/submit
        payload: {}
        as: ApplicantOfficer
