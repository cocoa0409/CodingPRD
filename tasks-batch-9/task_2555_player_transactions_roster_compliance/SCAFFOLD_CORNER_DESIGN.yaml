              as: LeagueOfficer
              captures: { rl_team_id: $.data.id, rl_team_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { rl_p_id: $.data.id }
            - call: "POST /transactions"
              payload: { team_id: "${rl_team_id}", player_id: "${rl_p_id}", transaction_type: "SIGNING", expected_team_version: "${rl_team_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
              as: TeamCapAnalyst
              as_user_id: "${rl_team_id}"
              captures: { rl_txn_id: $.data.id, rl_c_id: $.data.contract_id }
            - call: "POST /transactions/${rl_txn_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${rl_team_id}"
            - call: "POST /transactions/${rl_txn_id}/decide"
              payload: { decision: "REJECT", rejection_reason: "first pass" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
            - call: "POST /transactions/${rl_txn_id}/revise"
              payload: { base_salary_cents: 78000000 }
              as: TeamCapAnalyst
              as_user_id: "${rl_team_id}"
              captures: { rl_rc1: $.data.revision_count }
            - call: "POST /transactions/${rl_txn_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${rl_team_id}"
            - call: "POST /transactions/${rl_txn_id}/decide"
              payload: { decision: "REJECT", rejection_reason: "second pass" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
            - call: "POST /transactions/${rl_txn_id}/revise"
              payload: { base_salary_cents: 76000000 }
              as: TeamCapAnalyst
              as_user_id: "${rl_team_id}"
              captures: { rl_rc2: $.data.revision_count }
            - call: "POST /transactions/${rl_txn_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${rl_team_id}"
            - call: "POST /transactions/${rl_txn_id}/decide"
              payload: { decision: "REJECT", rejection_reason: "third pass" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
            - call: "POST /transactions/${rl_txn_id}/revise"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${rl_team_id}"
              captures: { rl_voided_status: $.data.status, rl_rc3: $.data.revision_count }
          trigger:
            - call: "POST /transactions/${rl_txn_id}/revise"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${rl_team_id}"
              captures: { rl_err: $.data.error_id }
          assert:
            - "the captured ${rl_rc1} == 1 and ${rl_rc2} == 2 — the two permitted revisions"
            - "the captured ${rl_voided_status} == VOIDED and ${rl_rc3} == 2 — the void is not itself counted as a revision"
            - "the captured ${rl_err} == ERR_REVISION_LIMIT_EXCEEDED with HTTP 409, NOT ERR_INVALID_TRANSACTION_STATE"
            - "Transaction.${rl_txn_id}.status == VOIDED with revision_count == 2 and rejection_reason == null"
            - "Contract.${rl_c_id}.status == VOIDED permanently"
            - "Team.${rl_team_id}.provisional_cap_committed_cents == 0 and cap_space_cents == 500000000"

