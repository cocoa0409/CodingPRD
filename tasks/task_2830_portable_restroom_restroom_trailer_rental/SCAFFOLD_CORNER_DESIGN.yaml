            - "${amt3} == 19200 (prior_strikes 2 -> 150%: 32000 * 40 * 150 / 10000)"
            - "${amt4} == 25600 (prior_strikes 3 -> 200%: 32000 * 40 * 200 / 10000)"
            - "${status1} == DEPLOYED with ${strikes1} == 1 and ${status2} == DEPLOYED with ${strikes2} == 2 — below UNIT_REPAIR_STRIKE_THRESHOLD 3"
            - "${status3} == IN_REPAIR with ${strikes3} == 3 — the hop fires exactly at the threshold and the charge severity was not TOTAL_LOSS"
            - "${status4} == IN_REPAIR with ${strikes4} == 4 and ${tips4} == 0 — no further hop is declared from IN_REPAIR on a new charge"
            - "${dep_state} == DEPLOYED — IN_REPAIR does not return the deployment (only TOTAL_LOSS and demobilize do)"
            - "${debits} == 70400 == 12800 + 12800 + 19200 + 25600"

      - name: trailer_tiering_is_selected_by_headcount_not_by_capacity
