      - name: cutting_test_approve_cascade_side_effects
        claim_type: cascade_down
        grounds:
          - state_machines.CuttingTest.SUBMITTED_to_APPROVED
        excluded_because:
          difficulty_instance: transitive_cascade / cutting_test_approve_cascade_reaches_stale_case_plan_lines
          rationale: "All four hops of CASCADE A (line allocations, purchase ledger, item cost basis and reprice, case-line price_stale) are asserted end-to-end by the named §1.8 instance."

      - name: temperature_cascade_holds_lines_and_staged_pre_orders
        claim_type: conditional_cascade
        grounds:
          - state_machines.CasePlanLine.FILLED_to_HELD
          - state_machines.PreOrder.STAGED_to_HELD
        excluded_because:
          difficulty_instance: transitive_cascade / critical_temperature_reading_cascade_reaches_staged_pre_order
          rationale: "The named §1.8 instance asserts CASCADE B hop by hop, including that only FILLED/MARKED_DOWN lines are held and only STAGED pre-orders on those lines follow."

      - name: grind_run_abort_reverses_every_input_commitment
        claim_type: compensation
        grounds:
          - state_machines.GrindRun.IN_PROGRESS_to_ABORTED
          - state_machines.TrimLot.PARTIALLY_COMMITTED_to_AVAILABLE
        excluded_because:
          difficulty_instance: compensating_invariant / grind_run_abort_restores_trim_pounds_with_zero_drift
          rationale: "The named §1.8 instance asserts the pounds invariant across the ABORT compensation and that no COMPLETE-branch effect leaks."

      - name: purchase_cost_ledger_syncs_to_the_approved_test
        claim_type: ledger_sync
        grounds:
          - state_machines.PrimalPurchase.RECEIVED_to_CUT_TESTED
          - state_machines.PrimalPurchase.CUT_TESTED_to_RECEIVED
        excluded_because:
          difficulty_instance: compensating_invariant / cutting_test_supersede_conserves_purchase_cost_ledger
          rationale: "Both directions of the purchase-side ledger cycle and the cents conservation are asserted by the named §1.8 instance."

      - name: cutting_test_reject_revise_cycle_is_bounded
        claim_type: cyclic
        grounds:
          - state_machines.CuttingTest.REJECTED_to_DRAFT
          - errors[ERR_REVISION_LIMIT_REACHED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / cutting_test_reject_revise_cycle_exhausts_revision_budget
          rationale: "The named §1.8 instance drives two REJECT/REVISE cycles and asserts the third REVISE is refused with ERR_REVISION_LIMIT_REACHED."

      - name: case_plan_status_and_fill_status_are_independent_dimensions
        claim_type: parallel
        grounds:
          - state_machines.CasePlan.UNFILLED_to_PARTIAL
          - state_machines.CasePlan.PARTIAL_to_FILLED
          - state_machines.CasePlan.PUBLISHED_to_SUSPENDED
        excluded_because:
          difficulty_instance: non_linear_state_machine / case_plan_publication_and_fill_dimensions_advance_independently
          rationale: "The named §1.8 instance asserts that a SUSPEND/RESUME round trip leaves fill_status FILLED while plan_status moves, and that lines carry held_from_status."

  # ===========================================================================
  - section: calculations
    instances:

      - name: landed_cost_per_lb_rounds_half_up_at_the_fourth_decimal
        claim_type: precision
        grounds:
          - calculations.landed_cost_derivation
          - entities.PrimalPurchase.fields.landed_cost_per_lb_cents
        distinguishing_aspect: "landed_cost_per_lb_cents keeps four decimals with round_half_up, not banker's rounding: 41001 cents over 32.00 lb is exactly 1281.28125, which must be stored as 1281.2813 (a half-even implementation would store 1281.2812)."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_CHUCK_ROLL", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 33.5, invoice_cost_cents: 40000, freight_cost_cents: 1500, vendor_allowance_cents: 499, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p2_id: $.data.id }
          assert:
            - "HTTP 201 and PrimalPurchase.${p2_id}.net_weight_lb == 32.00"
            - "PrimalPurchase.${p2_id}.landed_cost_total_cents == 41001 (40000 + 1500 - 499)"
            - "PrimalPurchase.${p2_id}.landed_cost_per_lb_cents == 1281.2813"
            - "PrimalPurchase.${p2_id}.unallocated_cost_cents == 41001 and allocated_cost_cents == 0"

      - name: sell_by_date_uses_the_shelf_life_of_each_product_class
        claim_type: constants_applied
        grounds:
          - calculations.sell_by_dating
          - entities.Department.fields.shelf_life_days_ground
          - entities.Department.fields.shelf_life_days_whole_muscle
