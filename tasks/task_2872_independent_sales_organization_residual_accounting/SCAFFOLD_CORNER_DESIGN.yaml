        distinguishing_aspect: "Two merchants both under-run their monthly minimum, but the one attrited before issue is dropped from the input set, so minimum_true_up_cents is 1000 and not 1750. MINIMUM_SHARE_PCT halves the agent's share of the surviving 4000-cent shortfall before split_pct is applied — a true-up computed as the raw shortfall (4000) or as shortfall x split_pct (2000) both fail."
