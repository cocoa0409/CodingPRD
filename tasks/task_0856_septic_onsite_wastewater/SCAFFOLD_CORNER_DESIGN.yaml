      - name: corner_clean_resample_clears_well_advisory_and_parcel_water_quality_flag
        claim_type: Valid Transition
        grounds:
          - state_machines.Well.ADVISORY_to_CLEAR
          - calculations.water_sample_result
          - calculations.parcel_risk_tier
        distinguishing_aspect: "The advisory loop closes: a 12.0 mg/L sample raises ADVISORY and sets Parcel.water_quality_flag true (risk_tier ELEVATED); a subsequent 1.0 mg/L sample returns the well to CLEAR, clears the parcel flag and drops risk_tier back to LOW."
        test_recipe:
          setup:
