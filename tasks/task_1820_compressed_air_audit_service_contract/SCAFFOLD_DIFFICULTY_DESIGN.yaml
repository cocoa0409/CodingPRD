# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index (task 1820)
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: deemed_vs_measured_savings_diverge
        grounds:
          - calculations.deemed_annual_savings
          - calculations.measured_annual_savings
          - entities.SavingsCase.fields.deemed_annual_savings_kwh
          - entities.SavingsCase.fields.measured_annual_savings_kwh
        distinguishing_aspect: |
          Same facility, same baseline: the deemed variant (engineering rollup over verified leaks
          plus sequencing estimate) yields 522800 kWh while the measured variant (pinned baseline
          annualization minus metered post profile annualization) yields 486667 kWh — two valid
          algorithms over the ENERGY domain produce different results; the rental-billing instance
          covers a different entity domain.
        test_recipe:
          setup:
            - "Facility ACTIVE, rate 12c/kWh, 6000 h/yr"
            - "Baseline profile 2026-03-01..2026-03-31 (31 days), 248000 kWh -> baseline_annual_kwh 2920000, LOCKED by eng-1"
            - "Leak survey VERIFIED with 3 tags 12.5/8.0/1.5 CFM, all repairs VERIFIED_CLOSED (15000/9600/1800 kWh)"
            - "Retrofit 125->100 psi over compressors C1+C2, cost 50000000c, ACCEPTED 2026-05-15"
            - "Savings case MODELED then MEASURED with post profile 2026-06-01..2026-06-30 (30 days), 200000 kWh -> 2433333 annualized"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-DV", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C2", rated_kw: 45, rated_cfm: 200 }, as: ServiceTech, captures: { c2: "$.data.id" } }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-01", window_end_date: "2026-03-31", measured_kwh: 248000, measured_avg_cfm: 350.0, measured_peak_cfm: 520.0 }, as: EnergyEngineer, captures: { prof0: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof0}/lock", payload: { expected_facility_version: "${fac_v}" }, as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /leak-surveys", payload: { facility_id: "${fac}", survey_date: "2026-03-15" }, as: EnergyEngineer, captures: { surv: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "header drop", cfm_loss: 12.5, repair_quote_cents: 400000 }, as: EnergyEngineer, captures: { tag1: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "hose reel", cfm_loss: 8.0, repair_quote_cents: 250000 }, as: EnergyEngineer, captures: { tag2: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "coupling", cfm_loss: 1.5, repair_quote_cents: 90000 }, as: EnergyEngineer, captures: { tag3: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/submit", as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /leak-surveys/${surv}/verify", as: EnergyEngineer, as_user_id: eng-2 }
            - { call: "POST /leak-tags/${tag1}/authorize-repair", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /leak-tags/${tag1}/mark-repaired", as: ServiceTech, as_user_id: tech-1 }
            - { call: "POST /leak-tags/${tag1}/verify-closure", as: EnergyEngineer }
            - { call: "POST /leak-tags/${tag2}/authorize-repair", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /leak-tags/${tag2}/mark-repaired", as: ServiceTech, as_user_id: tech-1 }
            - { call: "POST /leak-tags/${tag2}/verify-closure", as: EnergyEngineer }
            - { call: "POST /leak-tags/${tag3}/authorize-repair", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /leak-tags/${tag3}/mark-repaired", as: ServiceTech, as_user_id: tech-1 }
            - { call: "POST /leak-tags/${tag3}/verify-closure", as: EnergyEngineer }
            - { call: "POST /retrofit-projects", payload: { facility_id: "${fac}", baseline_pressure_psi: 125, target_pressure_psi: 100, sequence_compressor_ids: ["${c1}", "${c2}"], project_cost_cents: 50000000 }, as: EnergyEngineer, captures: { proj: "$.data.id" } }
            - { call: "POST /retrofit-projects/${proj}/approve", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /retrofit-projects/${proj}/mark-installed", as: ServiceTech }
            - { call: "POST /retrofit-projects/${proj}/commission", as: ServiceTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DealerAdmin }
            - { call: "POST /retrofit-projects/${proj}/accept", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /savings-cases", payload: { facility_id: "${fac}", baseline_profile_id: "${prof0}", retrofit_project_id: "${proj}" }, as: EnergyEngineer, captures: { case: "$.data.id" } }
            - { call: "POST /savings-cases/${case}/model", as: EnergyEngineer }
            - { call: "POST /savings-cases/${case}/open-measurement", as: EnergyEngineer }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-06-01", window_end_date: "2026-06-30", measured_kwh: 200000, measured_avg_cfm: 300.0, measured_peak_cfm: 480.0 }, as: EnergyEngineer, captures: { prof1: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v2: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof1}/lock", payload: { expected_facility_version: "${fac_v2}" }, as: EnergyEngineer, as_user_id: eng-1 }
          trigger:
            - { call: "POST /savings-cases/${case}/close-measurement", payload: { post_profile_id: "${prof1}" }, as: EnergyEngineer, as_user_id: eng-2 }
          assert:
            - "SavingsCase.${case}.deemed_annual_savings_kwh == 522800"
            - "SavingsCase.${case}.measured_annual_savings_kwh == 486667"
            - "SavingsCase.${case}.deemed_annual_savings_kwh != SavingsCase.${case}.measured_annual_savings_kwh"
            - "SavingsCase.${case}.savings_status == MEASURED"

      - name: rental_quote_vs_actual_bill_diverge
        grounds:
          - calculations.rental_billing
          - entities.RentalReservation.fields.quoted_cents
          - entities.RentalReservation.fields.actual_bill_cents
        distinguishing_aspect: |
          Same reservation: the quote variant (planned_days * daily_rate, no floor, no discount)
          yields 350000c for a 10-day plan while the actual variant (3-day minimum, 28+ day
          discount) yields 140000c when returned after 4 days — dual-variant logic on the RENTAL
          BILLING domain, structurally different from the energy-savings instance.
        test_recipe:
          setup:
            - "Facility ACTIVE with ACTIVE STANDARD contract (rental-eligible tier)"
            - "Compressor C1 (400 CFM) is DOWN; RentalAsset A1 500 CFM @ 35000c/day, deposit 100000c, AVAILABLE"
            - "Reservation planned 2026-09-01..2026-09-10 (10 days), returned 2026-09-04 (4 actual days)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-RB", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v}" }, as: ContractManager }
            - { call: "POST /compressors/${c1}/mark-down", as: ServiceTech }
            - { call: "POST /rental-assets", payload: { fleet_tag: "A1", rated_cfm: 500, daily_rate_cents: 35000, deposit_cents: 100000 }, as: DealerAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /rental-reservations", payload: { facility_id: "${fac}", down_compressor_id: "${c1}", start_date: "2026-09-01", end_date: "2026-09-10", rental_asset_id: "${a1}" }, as: FacilityManager, as_user_id: "${fac}", captures: { res: "$.data.id", quoted: "$.data.quoted_cents" } }
            - { call: "POST /rental-reservations/${res}/deliver", as: ServiceTech }
          trigger:
            - { call: "POST /rental-reservations/${res}/return", payload: { actual_return_date: "2026-09-04" }, as: ServiceTech, captures: { billed: "$.data.actual_bill_cents" } }
          assert:
            - "RentalReservation.${res}.quoted_cents == 350000"
            - "RentalReservation.${res}.actual_bill_cents == 140000"
            - "RentalReservation.${res}.quoted_cents != RentalReservation.${res}.actual_bill_cents"
            - "RentalReservation.${res}.status == RETURNED"

  # ---------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_rebate_with_nested_min_caps
        grounds:
          - calculations.utility_rebate
          - entities.SavingsCase.fields.provisional_rebate_cents
          - entities.SavingsCase.fields.final_rebate_cents
        distinguishing_aspect: |
          Mode (a): the rebate combines a two-tier marginal rate (7c up to 100000 kWh, 3c above),
          a 50%-of-project-cost cap, and a hard program cap under a pinned evaluation order
          (tiered first, then nested min) — 4 inputs with non-linear interaction; provisional
          1968400c over deemed 522800 kWh vs final 1860001c over measured 486667 kWh.
        test_recipe:
          setup:
            - "Full savings pipeline of deemed_vs_measured_savings_diverge through MEASURED (deemed 522800, measured 486667, project cost 50000000c)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-REB", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C2", rated_kw: 45, rated_cfm: 200 }, as: ServiceTech, captures: { c2: "$.data.id" } }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-01", window_end_date: "2026-03-31", measured_kwh: 248000, measured_avg_cfm: 350.0, measured_peak_cfm: 520.0 }, as: EnergyEngineer, captures: { prof0: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof0}/lock", payload: { expected_facility_version: "${fac_v}" }, as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /leak-surveys", payload: { facility_id: "${fac}", survey_date: "2026-03-15" }, as: EnergyEngineer, captures: { surv: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "L1", cfm_loss: 12.5, repair_quote_cents: 400000 }, as: EnergyEngineer, captures: { tag1: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "L2", cfm_loss: 8.0, repair_quote_cents: 250000 }, as: EnergyEngineer, captures: { tag2: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "L3", cfm_loss: 1.5, repair_quote_cents: 90000 }, as: EnergyEngineer, captures: { tag3: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/submit", as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /leak-surveys/${surv}/verify", as: EnergyEngineer, as_user_id: eng-2 }
            - { call: "POST /leak-tags/${tag1}/authorize-repair", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /leak-tags/${tag1}/mark-repaired", as: ServiceTech }
            - { call: "POST /leak-tags/${tag1}/verify-closure", as: EnergyEngineer }
            - { call: "POST /leak-tags/${tag2}/authorize-repair", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /leak-tags/${tag2}/mark-repaired", as: ServiceTech }
            - { call: "POST /leak-tags/${tag2}/verify-closure", as: EnergyEngineer }
            - { call: "POST /leak-tags/${tag3}/authorize-repair", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /leak-tags/${tag3}/mark-repaired", as: ServiceTech }
            - { call: "POST /leak-tags/${tag3}/verify-closure", as: EnergyEngineer }
            - { call: "POST /retrofit-projects", payload: { facility_id: "${fac}", baseline_pressure_psi: 125, target_pressure_psi: 100, sequence_compressor_ids: ["${c1}", "${c2}"], project_cost_cents: 50000000 }, as: EnergyEngineer, captures: { proj: "$.data.id" } }
            - { call: "POST /retrofit-projects/${proj}/approve", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /retrofit-projects/${proj}/mark-installed", as: ServiceTech }
            - { call: "POST /retrofit-projects/${proj}/commission", as: ServiceTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DealerAdmin }
            - { call: "POST /retrofit-projects/${proj}/accept", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /savings-cases", payload: { facility_id: "${fac}", baseline_profile_id: "${prof0}", retrofit_project_id: "${proj}" }, as: EnergyEngineer, captures: { case: "$.data.id" } }
            - { call: "POST /savings-cases/${case}/model", as: EnergyEngineer }
          trigger:
            - { call: "POST /savings-cases/${case}/file-rebate", as: EnergyEngineer, captures: { prov: "$.data.provisional_rebate_cents" } }
            - { call: "POST /savings-cases/${case}/open-measurement", as: EnergyEngineer }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-06-01", window_end_date: "2026-06-30", measured_kwh: 200000, measured_avg_cfm: 300.0, measured_peak_cfm: 480.0 }, as: EnergyEngineer, captures: { prof1: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v2: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof1}/lock", payload: { expected_facility_version: "${fac_v2}" }, as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /savings-cases/${case}/close-measurement", payload: { post_profile_id: "${prof1}" }, as: EnergyEngineer, as_user_id: eng-2 }
            - { call: "POST /savings-cases/${case}/record-rebate-decision", payload: { outcome: "APPROVED" }, as: ContractManager, captures: { fin: "$.data.final_rebate_cents" } }
          assert:
            - "SavingsCase.${case}.provisional_rebate_cents == 1968400"
            - "SavingsCase.${case}.final_rebate_cents == 1860001"
            - "SavingsCase.${case}.rebate_status == APPROVED"

      - name: per_leak_rounding_then_sum
        grounds:
          - calculations.leak_annual_savings_per_tag
          - calculations.deemed_annual_savings
          - entities.LeakTag.fields.annual_kwh_savings
        distinguishing_aspect: |
          Mode (b) nested rounding: each leak's kWh is rounded (round_half_up, whole kWh) BEFORE
          summation. At 5933 h/yr, leaks of 0.85 and 1.15 CFM round to 1009 and 1365 kWh and the
          deemed leak component is 2374 kWh; the rejected sum-then-round order would give 2373 kWh.
        test_recipe:
          setup:
            - "Facility ACTIVE with operating_hours_per_year = 5933 (chosen so per-leak rounding diverges from sum-then-round)"
            - "Baseline profile 2026-03-01..2026-03-31, 248000 kWh -> annual 2920000, LOCKED"
            - "Survey VERIFIED; tags 0.85 CFM (quote 50000c) and 1.15 CFM (quote 60000c), both VERIFIED_CLOSED"
            - "Retrofit 125->105 psi (drop exactly at the 20 psi cap) ACCEPTED; case MODELED"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-RND", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 5933, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-01", window_end_date: "2026-03-31", measured_kwh: 248000, measured_avg_cfm: 350.0, measured_peak_cfm: 520.0 }, as: EnergyEngineer, captures: { prof0: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof0}/lock", payload: { expected_facility_version: "${fac_v}" }, as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /leak-surveys", payload: { facility_id: "${fac}", survey_date: "2026-03-15" }, as: EnergyEngineer, captures: { surv: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "pinhole A", cfm_loss: 0.85, repair_quote_cents: 50000 }, as: EnergyEngineer, captures: { tag1: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "pinhole B", cfm_loss: 1.15, repair_quote_cents: 60000 }, as: EnergyEngineer, captures: { tag2: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/submit", as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /leak-surveys/${surv}/verify", as: EnergyEngineer, as_user_id: eng-2 }
            - { call: "POST /leak-tags/${tag1}/authorize-repair", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /leak-tags/${tag1}/mark-repaired", as: ServiceTech }
            - { call: "POST /leak-tags/${tag1}/verify-closure", as: EnergyEngineer, captures: { kwh1: "$.data.annual_kwh_savings" } }
            - { call: "POST /leak-tags/${tag2}/authorize-repair", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /leak-tags/${tag2}/mark-repaired", as: ServiceTech }
            - { call: "POST /leak-tags/${tag2}/verify-closure", as: EnergyEngineer, captures: { kwh2: "$.data.annual_kwh_savings" } }
            - { call: "POST /retrofit-projects", payload: { facility_id: "${fac}", baseline_pressure_psi: 125, target_pressure_psi: 105, sequence_compressor_ids: ["${c1}"], project_cost_cents: 50000000 }, as: EnergyEngineer, captures: { proj: "$.data.id" } }
            - { call: "POST /retrofit-projects/${proj}/approve", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /savings-cases", payload: { facility_id: "${fac}", baseline_profile_id: "${prof0}", retrofit_project_id: "${proj}" }, as: EnergyEngineer, captures: { case: "$.data.id" } }
          trigger:
            - { call: "POST /savings-cases/${case}/model", as: EnergyEngineer, captures: { deemed: "$.data.deemed_annual_savings_kwh" } }
          assert:
            - "LeakTag.${tag1}.annual_kwh_savings == 1009"
            - "LeakTag.${tag2}.annual_kwh_savings == 1365"
            - "SavingsCase.${case}.deemed_annual_savings_kwh == 498774"
            - "deemed leak component (498774 - 496400 sequencing) == 2374, which is 1009 + 1365, not the sum-then-round 2373"

      - name: sla_credit_gross_fee_snapshot
        grounds:
          - calculations.sla_credit_amount
          - entities.ServiceCredit.fields.amount_cents
          - entities.ServiceContract.fields.credits_applied_total_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency resolved by pinned evaluation order: each breach
          credit is 5% of the GROSS monthly fee snapshot, never the fee net of previously applied
          credits — two breaches after applying the first credit still yield 20000c each, not
          20000c then 19000c.
        test_recipe:
          setup:
            - "Facility ACTIVE with ACTIVE STANDARD contract, monthly_fee_cents 400000 (24h base)"
            - "Two URGENT tickets (x2 multiplier -> 48h deadline), each answered 1 second late -> two SLA_BREACH credits"
            - "First credit is APPLIED before the second breach is recorded"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-CR", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v}" }, as: ContractManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: DealerAdmin }
            - { call: "POST /service-tickets", payload: { facility_id: "${fac}", compressor_id: "${c1}", severity: "URGENT" }, as: FacilityManager, as_user_id: "${fac}", captures: { t1: "$.data.id" } }
            - { call: "POST /service-tickets/${t1}/dispatch", as: ServiceTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T09:00:01Z" }, as: DealerAdmin }
            - { call: "POST /service-tickets/${t1}/record-response", as: ServiceTech }
            - { call: "GET /service-credits?contract_id=${sc}", as: ContractManager, captures: { cr1: "$.data[0].id", cr1_amt: "$.data[0].amount_cents" } }
            - { call: "POST /service-credits/${cr1}/apply", as: ContractManager }
            - { call: "POST /service-tickets", payload: { facility_id: "${fac}", compressor_id: "${c1}", severity: "URGENT" }, as: FacilityManager, as_user_id: "${fac}", captures: { t2: "$.data.id" } }
            - { call: "POST /service-tickets/${t2}/dispatch", as: ServiceTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T09:00:02Z" }, as: DealerAdmin }
          trigger:
            - { call: "POST /service-tickets/${t2}/record-response", as: ServiceTech }
            - { call: "GET /service-credits?contract_id=${sc}&status=ACCRUED", as: ContractManager, captures: { cr2_amt: "$.data[0].amount_cents" } }
          assert:
            - "ServiceCredit.${cr1}.amount_cents == 20000"
            - "second breach credit amount_cents == 20000 (gross-fee base; NOT 19000 = 5% of 400000 - 20000)"
            - "ServiceContract.${sc}.credits_accrued_total_cents == 40000"
            - "ServiceContract.${sc}.credits_applied_total_cents == 20000"
            - "ServiceContract.${sc}.credits_outstanding_cents == 20000"

  # ---------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: compressor_down_return_cycle
        grounds:
          - state_machines.Compressor.DOWN_to_IN_SERVICE
          - state_machines.Compressor.IN_SERVICE_to_DOWN
          - entities.Compressor.fields.status
        distinguishing_aspect: |
          Cycle on Compressor: IN_SERVICE -> DOWN -> IN_SERVICE -> DOWN is legal any number of
          times (outage/repair loop), unlike the linear survey pipeline; each DOWN leg flips
          facility posture to OUTAGE_ACTIVE and each return restores it.
        test_recipe:
          setup:
            - "Facility ACTIVE; one compressor C1; no maintenance schedules (so posture isolates the outage dimension)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-CYC", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
          trigger:
            - { call: "POST /compressors/${c1}/mark-down", as: ServiceTech, captures: { s1: "$.data.status" } }
            - { call: "GET /facilities/${fac}", as: ServiceTech, captures: { p1: "$.data.posture" } }
            - { call: "POST /compressors/${c1}/return-to-service", as: ServiceTech, captures: { s2: "$.data.status" } }
            - { call: "GET /facilities/${fac}", as: ServiceTech, captures: { p2: "$.data.posture" } }
            - { call: "POST /compressors/${c1}/mark-down", as: ServiceTech, captures: { s3: "$.data.status" } }
            - { call: "GET /facilities/${fac}", as: ServiceTech, captures: { p3: "$.data.posture" } }
          assert:
            - "Compressor.${c1}.status after first mark-down == DOWN"
            - "Facility.${fac}.posture == OUTAGE_ACTIVE after first mark-down"
            - "Compressor.${c1}.status after return-to-service == IN_SERVICE"
            - "Facility.${fac}.posture == NORMAL after return-to-service"
            - "Compressor.${c1}.status after second mark-down == DOWN (cycle re-entered)"
            - "Facility.${fac}.posture == OUTAGE_ACTIVE again"

      - name: savings_case_independent_dimensions
        grounds:
          - state_machines.SavingsCase
          - entities.SavingsCase.fields.savings_status
          - entities.SavingsCase.fields.rebate_status
        distinguishing_aspect: |
          Two independent state dimensions on one entity: rebate_status advances NONE -> FILED
          while savings_status is MODELED, then savings_status advances MODELED -> MEASURED while
          rebate_status stays FILED — neither dimension blocks the other's legal moves (a linear
          machine cannot express this).
        test_recipe:
          setup:
            - "Savings pipeline through MODELED (deemed 522800); rebate filed while savings MODELED"
            - "Post profile 2026-06-01..2026-06-30 (200000 kWh) LOCKED after rebate filing"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-PD", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-01", window_end_date: "2026-03-31", measured_kwh: 248000, measured_avg_cfm: 350.0, measured_peak_cfm: 520.0 }, as: EnergyEngineer, captures: { prof0: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof0}/lock", payload: { expected_facility_version: "${fac_v}" }, as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /retrofit-projects", payload: { facility_id: "${fac}", baseline_pressure_psi: 125, target_pressure_psi: 100, sequence_compressor_ids: ["${c1}"], project_cost_cents: 50000000 }, as: EnergyEngineer, captures: { proj: "$.data.id" } }
            - { call: "POST /retrofit-projects/${proj}/approve", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /retrofit-projects/${proj}/mark-installed", as: ServiceTech }
            - { call: "POST /retrofit-projects/${proj}/commission", as: ServiceTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DealerAdmin }
            - { call: "POST /retrofit-projects/${proj}/accept", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /savings-cases", payload: { facility_id: "${fac}", baseline_profile_id: "${prof0}", retrofit_project_id: "${proj}" }, as: EnergyEngineer, captures: { case: "$.data.id" } }
            - { call: "POST /savings-cases/${case}/model", as: EnergyEngineer }
            - { call: "POST /savings-cases/${case}/file-rebate", as: EnergyEngineer, captures: { rs1: "$.data.rebate_status" } }
            - { call: "POST /savings-cases/${case}/open-measurement", as: EnergyEngineer }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-06-01", window_end_date: "2026-06-30", measured_kwh: 200000, measured_avg_cfm: 300.0, measured_peak_cfm: 480.0 }, as: EnergyEngineer, captures: { prof1: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v2: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof1}/lock", payload: { expected_facility_version: "${fac_v2}" }, as: EnergyEngineer, as_user_id: eng-1 }
          trigger:
            - { call: "POST /savings-cases/${case}/close-measurement", payload: { post_profile_id: "${prof1}" }, as: EnergyEngineer, as_user_id: eng-2, captures: { ss2: "$.data.savings_status", rs2: "$.data.rebate_status" } }
          assert:
            - "rebate_status == FILED immediately after file-rebate while savings_status == MODELED"
            - "after close-measurement: savings_status == MEASURED"
            - "after close-measurement: rebate_status == FILED (unchanged by the savings-dimension move)"
            - "SavingsCase.${case}.measured_annual_savings_kwh == 486667"

      - name: certificate_dispute_recompute_loop
        grounds:
          - state_machines.GuaranteeCertificate
          - calculations.guarantee_settlement
          - entities.GuaranteeCertificate.fields.payout_cents
        distinguishing_aspect: |
          GuaranteeCertificate carries independent settlement and dispute dimensions PLUS a
          recompute loop: SETTLED_NO_SHORTFALL (payout 0) -> dispute OPEN -> UPHELD with
          corrected measurement re-derives settlement to SETTLED_PAYOUT_DUE with payout 493320c —
          settlement figures are recomputed after settlement, which a purely linear machine
          forbids. Distinct entity from the Compressor cycle and the SavingsCase dimensions.
        test_recipe:
          setup:
            - "Full pipeline through MEASURED (deemed 522800, measured 486667); PREMIUM contract ACTIVE (monthly 900000c)"
            - "Certificate created with guaranteed_pct 0.90 -> guaranteed_kwh 470520, deadband_kwh 9410"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-GC", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-01", window_end_date: "2026-03-31", measured_kwh: 248000, measured_avg_cfm: 350.0, measured_peak_cfm: 520.0 }, as: EnergyEngineer, captures: { prof0: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof0}/lock", payload: { expected_facility_version: "${fac_v}" }, as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /retrofit-projects", payload: { facility_id: "${fac}", baseline_pressure_psi: 125, target_pressure_psi: 100, sequence_compressor_ids: ["${c1}"], project_cost_cents: 50000000 }, as: EnergyEngineer, captures: { proj: "$.data.id" } }
            - { call: "POST /retrofit-projects/${proj}/approve", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /retrofit-projects/${proj}/mark-installed", as: ServiceTech }
            - { call: "POST /retrofit-projects/${proj}/commission", as: ServiceTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DealerAdmin }
            - { call: "POST /retrofit-projects/${proj}/accept", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /savings-cases", payload: { facility_id: "${fac}", baseline_profile_id: "${prof0}", retrofit_project_id: "${proj}" }, as: EnergyEngineer, captures: { case: "$.data.id" } }
            - { call: "POST /savings-cases/${case}/model", as: EnergyEngineer }
            - { call: "POST /savings-cases/${case}/open-measurement", as: EnergyEngineer }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-06-01", window_end_date: "2026-06-30", measured_kwh: 200000, measured_avg_cfm: 300.0, measured_peak_cfm: 480.0 }, as: EnergyEngineer, captures: { prof1: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v2: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof1}/lock", payload: { expected_facility_version: "${fac_v2}" }, as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /savings-cases/${case}/close-measurement", payload: { post_profile_id: "${prof1}" }, as: EnergyEngineer, as_user_id: eng-2 }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "PREMIUM", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 900000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v3: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v3}" }, as: ContractManager }
            - { call: "POST /guarantee-certificates", payload: { facility_id: "${fac}", contract_id: "${sc}", savings_case_id: "${case}", guaranteed_pct: 0.90 }, as: ContractManager, captures: { cert: "$.data.id", g_kwh: "$.data.guaranteed_kwh", db: "$.data.deadband_kwh" } }
          trigger:
            - { call: "POST /guarantee-certificates/${cert}/settle", as: ContractManager, captures: { st1: "$.data.settlement_status", sf1: "$.data.shortfall_kwh" } }
            - { call: "POST /guarantee-certificates/${cert}/dispute", payload: { reason: "meter drift during measurement window" }, as: FacilityManager, as_user_id: "${fac}", captures: { ds1: "$.data.dispute_status" } }
            - { call: "POST /guarantee-certificates/${cert}/resolve-dispute", payload: { outcome: "UPHELD", corrected_measured_kwh: 420000 }, as: ContractManager, captures: { st2: "$.data.settlement_status", sf2: "$.data.shortfall_kwh", po2: "$.data.payout_cents" } }
            - { call: "POST /guarantee-certificates/${cert}/pay", as: ContractManager, captures: { st3: "$.data.settlement_status" } }
          assert:
            - "GuaranteeCertificate.${cert}.guaranteed_kwh == 470520"
            - "GuaranteeCertificate.${cert}.deadband_kwh == 9410"
            - "first settle: settlement_status == SETTLED_NO_SHORTFALL and shortfall_kwh == 0 (max(0, 470520 - 486667 - 9410))"
            - "dispute: dispute_status == OPEN"
            - "after UPHELD with corrected 420000: shortfall_kwh == 41110 (470520 - 420000 - 9410)"
            - "after UPHELD: payout_cents == 493320 (41110 * 12, under the 10800000c annual-fee cap)"
            - "after UPHELD: settlement_status == SETTLED_PAYOUT_DUE (re-derived by the recompute loop)"
            - "after pay: settlement_status == PAID"

  # ---------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: run_hours_cascade_to_certificate_gate
        grounds:
          - calculations.maintenance_delinquency
          - calculations.facility_posture
          - state_machines.MaintenanceSchedule.ACTIVE_to_ACTIVE
          - entities.GuaranteeCertificate.fields.settlement_blocked
        distinguishing_aspect: |
          Depth-3 chain from ONE trigger (log-run-hours): Compressor.run_hours_total mutation
          (link 1) flips MaintenanceSchedule.is_delinquent (link 2), which flips Facility.posture
          to MAINTENANCE_DELINQUENT (link 3), which recomputes
          GuaranteeCertificate.settlement_blocked = true (link 4) — each hop caused by the
          previous one; the settle endpoint then rejects with ERR_POSTURE_NOT_NORMAL.
        test_recipe:
          setup:
            - "Full pipeline through MEASURED; PREMIUM contract ACTIVE; certificate AWAITING_MEASUREMENT with settlement_blocked == false"
            - "DRYER schedule created when facility max run-hours is 4000 (anchor 4000, interval 2000, due 6000)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-C1", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C2", rated_kw: 45, rated_cfm: 200 }, as: ServiceTech, captures: { c2: "$.data.id" } }
            - { call: "POST /compressors/${c1}/log-run-hours", payload: { run_hours_total: 4000 }, as: ServiceTech }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-01", window_end_date: "2026-03-31", measured_kwh: 248000, measured_avg_cfm: 350.0, measured_peak_cfm: 520.0 }, as: EnergyEngineer, captures: { prof0: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof0}/lock", payload: { expected_facility_version: "${fac_v}" }, as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /retrofit-projects", payload: { facility_id: "${fac}", baseline_pressure_psi: 125, target_pressure_psi: 100, sequence_compressor_ids: ["${c1}", "${c2}"], project_cost_cents: 50000000 }, as: EnergyEngineer, captures: { proj: "$.data.id" } }
            - { call: "POST /retrofit-projects/${proj}/approve", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /retrofit-projects/${proj}/mark-installed", as: ServiceTech }
            - { call: "POST /retrofit-projects/${proj}/commission", as: ServiceTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DealerAdmin }
            - { call: "POST /retrofit-projects/${proj}/accept", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /savings-cases", payload: { facility_id: "${fac}", baseline_profile_id: "${prof0}", retrofit_project_id: "${proj}" }, as: EnergyEngineer, captures: { case: "$.data.id" } }
            - { call: "POST /savings-cases/${case}/model", as: EnergyEngineer }
            - { call: "POST /savings-cases/${case}/open-measurement", as: EnergyEngineer }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-06-01", window_end_date: "2026-06-30", measured_kwh: 200000, measured_avg_cfm: 300.0, measured_peak_cfm: 480.0 }, as: EnergyEngineer, captures: { prof1: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v2: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof1}/lock", payload: { expected_facility_version: "${fac_v2}" }, as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /savings-cases/${case}/close-measurement", payload: { post_profile_id: "${prof1}" }, as: EnergyEngineer, as_user_id: eng-2 }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "PREMIUM", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 900000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v3: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v3}" }, as: ContractManager }
            - { call: "POST /guarantee-certificates", payload: { facility_id: "${fac}", contract_id: "${sc}", savings_case_id: "${case}", guaranteed_pct: 0.90 }, as: ContractManager, captures: { cert: "$.data.id", blocked0: "$.data.settlement_blocked" } }
            - { call: "POST /maintenance-schedules", payload: { facility_id: "${fac}", component: "DRYER", interval_hours: 2000 }, as: ContractManager, captures: { sched: "$.data.id", anchor: "$.data.anchor_run_hours" } }
          trigger:
            - { call: "POST /compressors/${c1}/log-run-hours", payload: { run_hours_total: 6000 }, as: ServiceTech }
            - { call: "GET /maintenance-schedules/${sched}", as: ContractManager, captures: { delinq: "$.data.is_delinquent" } }
            - { call: "GET /facilities/${fac}", as: ContractManager, captures: { post: "$.data.posture" } }
            - { call: "GET /guarantee-certificates/${cert}", as: ContractManager, captures: { blocked1: "$.data.settlement_blocked" } }
            - { call: "POST /guarantee-certificates/${cert}/settle", as: ContractManager, captures: { err: "$.data.error_id" } }
          assert:
            - "MaintenanceSchedule.${sched}.anchor_run_hours == 4000 at creation (facility max at that moment)"
            - "before trigger: GuaranteeCertificate.${cert}.settlement_blocked == false"
            - "after log to 6000: MaintenanceSchedule.${sched}.is_delinquent == true (6000 >= 6000, inclusive)"
            - "Facility.${fac}.posture == MAINTENANCE_DELINQUENT"
            - "GuaranteeCertificate.${cert}.settlement_blocked == true (cascade link 4)"
            - "settle rejected with ERR_POSTURE_NOT_NORMAL"

      - name: sla_breach_cascade_to_contract_suspension
        grounds:
          - state_machines.ServiceTicket.DISPATCHED_to_ON_SITE
          - state_machines.ServiceContract.ACTIVE_to_SUSPENDED
          - calculations.sla_credit_amount
        distinguishing_aspect: |
          Different trigger from the run-hours chain: record-response with sla_met false creates
          a ServiceCredit (link 1), whose creation mutates the contract's credit counters and
          sla_breach_count (link 2), whose counter mutation at the threshold of 3 suspends the
          contract and sets termination_penalty_waived (link 3) — ticket -> credit -> contract
          counters -> contract state.
        test_recipe:
          setup:
            - "Facility ACTIVE with ACTIVE STANDARD contract (monthly 400000c, base 24h)"
            - "Two breaching URGENT tickets already resolved (breach_count == 2, credits 20000c each)"
            - "Third URGENT ticket DISPATCHED, response 1 second past deadline"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-SLA", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v}" }, as: ContractManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: DealerAdmin }
            - { call: "POST /service-tickets", payload: { facility_id: "${fac}", compressor_id: "${c1}", severity: "URGENT" }, as: FacilityManager, as_user_id: "${fac}", captures: { t1: "$.data.id" } }
            - { call: "POST /service-tickets/${t1}/dispatch", as: ServiceTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T09:00:01Z" }, as: DealerAdmin }
            - { call: "POST /service-tickets/${t1}/record-response", as: ServiceTech }
            - { call: "POST /service-tickets", payload: { facility_id: "${fac}", compressor_id: "${c1}", severity: "URGENT" }, as: FacilityManager, as_user_id: "${fac}", captures: { t2: "$.data.id" } }
            - { call: "POST /service-tickets/${t2}/dispatch", as: ServiceTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T09:00:02Z" }, as: DealerAdmin }
            - { call: "POST /service-tickets/${t2}/record-response", as: ServiceTech }
            - { call: "POST /service-tickets", payload: { facility_id: "${fac}", compressor_id: "${c1}", severity: "URGENT" }, as: FacilityManager, as_user_id: "${fac}", captures: { t3: "$.data.id", dl3: "$.data.sla_deadline" } }
            - { call: "POST /service-tickets/${t3}/dispatch", as: ServiceTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T09:00:03Z" }, as: DealerAdmin }
          trigger:
            - { call: "POST /service-tickets/${t3}/record-response", as: ServiceTech, captures: { met3: "$.data.sla_met" } }
            - { call: "GET /service-contracts/${sc}", as: ContractManager, captures: { scst: "$.data.status", bc: "$.data.sla_breach_count", waived: "$.data.termination_penalty_waived", acc: "$.data.credits_accrued_total_cents" } }
          assert:
            - "ServiceTicket.${t3}.sla_met == false"
            - "ServiceContract.${sc}.sla_breach_count == 3"
            - "ServiceContract.${sc}.status == SUSPENDED (auto-suspension at threshold 3)"
            - "ServiceContract.${sc}.termination_penalty_waived == true"
            - "ServiceContract.${sc}.credits_accrued_total_cents == 60000"

      - name: decommission_cascade_to_savings_stale
        grounds:
          - state_machines.Compressor.IN_SERVICE_to_DECOMMISSIONED
          - state_machines.RetrofitProject.APPROVED_to_CANCELLED
          - entities.SavingsCase.fields.retrofit_stale
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (decommission): Compressor -> DECOMMISSIONED
          cancels every RetrofitProject sequencing it (link 1), and each such cancellation flags
          the referencing SavingsCase retrofit_stale = true (link 2) — fan-out per link is
          single-cause: the case mutation is caused by the project cancellation, not the
          compressor action.
        test_recipe:
          setup:
            - "Facility ACTIVE; compressors C1, C2; baseline LOCKED; project APPROVED sequencing [C1, C2]; case MODELED"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-DC", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C2", rated_kw: 45, rated_cfm: 200 }, as: ServiceTech, captures: { c2: "$.data.id" } }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-01", window_end_date: "2026-03-31", measured_kwh: 248000, measured_avg_cfm: 350.0, measured_peak_cfm: 520.0 }, as: EnergyEngineer, captures: { prof0: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof0}/lock", payload: { expected_facility_version: "${fac_v}" }, as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /retrofit-projects", payload: { facility_id: "${fac}", baseline_pressure_psi: 125, target_pressure_psi: 100, sequence_compressor_ids: ["${c1}", "${c2}"], project_cost_cents: 50000000 }, as: EnergyEngineer, captures: { proj: "$.data.id" } }
            - { call: "POST /retrofit-projects/${proj}/approve", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /savings-cases", payload: { facility_id: "${fac}", baseline_profile_id: "${prof0}", retrofit_project_id: "${proj}" }, as: EnergyEngineer, captures: { case: "$.data.id" } }
            - { call: "POST /savings-cases/${case}/model", as: EnergyEngineer }
          trigger:
            - { call: "POST /compressors/${c1}/decommission", as: ContractManager }
            - { call: "GET /retrofit-projects/${proj}", as: ContractManager, captures: { pst: "$.data.status" } }
            - { call: "GET /savings-cases/${case}", as: ContractManager, captures: { rstale: "$.data.retrofit_stale", sst: "$.data.savings_status" } }
            - { call: "POST /savings-cases/${case}/open-measurement", as: EnergyEngineer, captures: { err: "$.data.error_id" } }
          assert:
            - "RetrofitProject.${proj}.status == CANCELLED (cascade link 1)"
            - "SavingsCase.${case}.retrofit_stale == true (cascade link 2, caused by the cancellation)"
            - "SavingsCase.${case}.savings_status == MODELED (flag set, dimension not moved)"
            - "open-measurement rejected with ERR_RETROFIT_NOT_ACCEPTED (project CANCELLED, observable consequence of the chain)"

  # ---------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_authorize_repair
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_REPAIR_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: authorizing a tag that is still TAGGED
          (survey never submitted — from-state violation, priority 6) on a facility whose repair
          budget is 0 (fiscal violation, priority 10) must report ERR_INVALID_STATE_TRANSITION,
          not ERR_REPAIR_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "Facility ACTIVE with repair_budget_cents = 0 (any authorization would exceed it)"
            - "Leak survey in DRAFT containing one tag (cfm 5.0, quote 100000c) -> tag is TAGGED"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-PP1", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 0 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /leak-surveys", payload: { facility_id: "${fac}", survey_date: "2026-03-15" }, as: EnergyEngineer, captures: { surv: "$.data.id" } }
            - { call: "POST /leak-surveys/${surv}/leak-tags", payload: { location_description: "valve", cfm_loss: 5.0, repair_quote_cents: 100000 }, as: EnergyEngineer, captures: { tag1: "$.data.id" } }
          trigger:
            - { call: "POST /leak-tags/${tag1}/authorize-repair", as: FacilityManager, as_user_id: "${fac}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE_TRANSITION (priority 6 state beats priority 10 fiscal)"
            - "response error_id != ERR_REPAIR_BUDGET_EXCEEDED"
            - "LeakTag.${tag1}.status == TAGGED (unchanged)"

      - name: referential_beats_temporal_on_reservation
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_FACILITY_MISMATCH]
          - errors[ERR_RENTAL_ASSET_UNAVAILABLE]
        distinguishing_aspect: |
          Error-category pair business_referential vs business_temporal: a reservation whose
          down_compressor belongs to a DIFFERENT facility (referential, priority 7) and whose
          dates also overlap an existing buffered reservation on the named asset (temporal,
          priority 8) must report ERR_FACILITY_MISMATCH, not ERR_RENTAL_ASSET_UNAVAILABLE —
          a different category pair than the state-vs-fiscal instance.
        test_recipe:
          setup:
            - "Facility F1 ACTIVE, STANDARD contract ACTIVE, compressor C1 (F1) DOWN; RentalAsset A1 with existing reservation 2026-09-01..09-10 (RESERVED)"
            - "Facility F2 ACTIVE, STANDARD contract ACTIVE, compressor C9 (F2) DOWN"
            - "Trigger reservation is for F2 but references F1's compressor C1 and asset A1 with dates 2026-09-05..2026-09-07 (inside R1's occupied span)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1-PP2", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac1: "$.data.id" } }
            - { call: "POST /facilities/${fac1}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac1}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac1}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc1: "$.data.id" } }
            - { call: "GET /facilities/${fac1}", as: DealerAdmin, captures: { fac1_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc1}/activate", payload: { expected_facility_version: "${fac1_v}" }, as: ContractManager }
            - { call: "POST /compressors/${c1}/mark-down", as: ServiceTech }
            - { call: "POST /rental-assets", payload: { fleet_tag: "A1", rated_cfm: 500, daily_rate_cents: 35000, deposit_cents: 100000 }, as: DealerAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /rental-reservations", payload: { facility_id: "${fac1}", down_compressor_id: "${c1}", start_date: "2026-09-01", end_date: "2026-09-10", rental_asset_id: "${a1}" }, as: FacilityManager, as_user_id: "${fac1}", captures: { res1: "$.data.id" } }
            - { call: "POST /facilities", payload: { name: "F2-PP2", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac2: "$.data.id" } }
            - { call: "POST /facilities/${fac2}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac2}", asset_tag: "C9", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c9: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac2}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc2: "$.data.id" } }
            - { call: "GET /facilities/${fac2}", as: DealerAdmin, captures: { fac2_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc2}/activate", payload: { expected_facility_version: "${fac2_v}" }, as: ContractManager }
            - { call: "POST /compressors/${c9}/mark-down", as: ServiceTech }
          trigger:
            - { call: "POST /rental-reservations", payload: { facility_id: "${fac2}", down_compressor_id: "${c1}", start_date: "2026-09-05", end_date: "2026-09-07", rental_asset_id: "${a1}" }, as: FacilityManager, as_user_id: "${fac2}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_FACILITY_MISMATCH (priority 7 referential beats priority 8 temporal)"
            - "response error_id != ERR_RENTAL_ASSET_UNAVAILABLE"
            - "no new RentalReservation exists for facility ${fac2} (GET /rental-reservations?facility_id=${fac2} returns empty array)"

  # ---------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: maintenance_delinquent_at_exact_due_hours
        grounds:
          - calculations.maintenance_delinquency
          - entities.MaintenanceSchedule.fields.is_delinquent
        distinguishing_aspect: |
          Metric run-hours via POST /compressors/{id}/log-run-hours: delinquency uses an
          INCLUSIVE >= boundary — facility max run-hours of exactly next_due_run_hours (6000)
          IS delinquent, while 5999 is not. Distinct metric and endpoint from the SLA instance.
        test_recipe:
          setup:
            - "Facility ACTIVE; compressor C1 at 4000 run-hours; DRYER schedule interval 2000 (anchor 4000, next_due 6000)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-B1", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /compressors/${c1}/log-run-hours", payload: { run_hours_total: 4000 }, as: ServiceTech }
            - { call: "POST /maintenance-schedules", payload: { facility_id: "${fac}", component: "DRYER", interval_hours: 2000 }, as: ContractManager, captures: { sched: "$.data.id" } }
            - { call: "POST /compressors/${c1}/log-run-hours", payload: { run_hours_total: 5999 }, as: ServiceTech }
            - { call: "GET /maintenance-schedules/${sched}", as: ServiceTech, captures: { d_below: "$.data.is_delinquent" } }
          trigger:
            - { call: "POST /compressors/${c1}/log-run-hours", payload: { run_hours_total: 6000 }, as: ServiceTech }
            - { call: "GET /maintenance-schedules/${sched}", as: ServiceTech, captures: { d_at: "$.data.is_delinquent" } }
            - { call: "GET /facilities/${fac}", as: ServiceTech, captures: { post: "$.data.posture" } }
          assert:
            - "at 5999 run-hours: MaintenanceSchedule.${sched}.is_delinquent == false"
            - "MaintenanceSchedule.${sched}.next_due_run_hours == 6000"
            - "at exactly 6000 run-hours: is_delinquent == true (>= inclusive boundary)"
            - "Facility.${fac}.posture == MAINTENANCE_DELINQUENT"

      - name: sla_met_at_exact_deadline
        grounds:
          - calculations.sla_deadline_and_met
          - entities.ServiceTicket.fields.sla_met
        distinguishing_aspect: |
          Metric timestamp via POST /service-tickets/{id}/record-response: sla_met uses an
          INCLUSIVE <= — a response stamped exactly at sla_deadline is MET, one second later is
          a breach that creates a 20000c credit. Different metric (time) and endpoint than the
          run-hours instance.
        test_recipe:
          setup:
            - "Facility ACTIVE; STANDARD contract ACTIVE (24h base); two URGENT tickets (x2 -> 48h deadlines)"
            - "T1 reported 2026-08-10T09:00:00Z -> deadline 2026-08-12T09:00:00Z, response stamped exactly at deadline"
            - "T2 reported 2026-08-12T09:00:00Z -> deadline 2026-08-14T09:00:00Z, response stamped 2026-08-14T09:00:01Z"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-B2", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v}" }, as: ContractManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: DealerAdmin }
            - { call: "POST /service-tickets", payload: { facility_id: "${fac}", compressor_id: "${c1}", severity: "URGENT" }, as: FacilityManager, as_user_id: "${fac}", captures: { t1: "$.data.id", dl1: "$.data.sla_deadline" } }
            - { call: "POST /service-tickets/${t1}/dispatch", as: ServiceTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T09:00:00Z" }, as: DealerAdmin }
          trigger:
            - { call: "POST /service-tickets/${t1}/record-response", as: ServiceTech, captures: { met1: "$.data.sla_met" } }
            - { call: "POST /service-tickets", payload: { facility_id: "${fac}", compressor_id: "${c1}", severity: "URGENT" }, as: FacilityManager, as_user_id: "${fac}", captures: { t2: "$.data.id" } }
            - { call: "POST /service-tickets/${t2}/dispatch", as: ServiceTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T09:00:01Z" }, as: DealerAdmin }
            - { call: "POST /service-tickets/${t2}/record-response", as: ServiceTech, captures: { met2: "$.data.sla_met" } }
          assert:
            - "ServiceTicket.${t1}.sla_deadline == 2026-08-12T09:00:00Z (48h after 2026-08-10T09:00:00Z)"
            - "ServiceTicket.${t1}.sla_met == true (response exactly at deadline; <= inclusive)"
            - "ServiceTicket.${t2}.sla_deadline == 2026-08-14T09:00:00Z and sla_met == false (response 1 second past)"
            - "exactly 1 ServiceCredit exists for contract (GET /service-credits?contract_id= total_count == 1), amount 20000c — only the breaching ticket accrued"

  # ---------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: rental_gated_by_compressor_state_and_contract_tier
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - state_machines.Compressor
          - entities.ServiceContract.fields.tier
        distinguishing_aspect: |
          Entity pairs Compressor->RentalReservation and ServiceContract->RentalReservation:
          reservation requires the referenced compressor DOWN (ERR_COMPRESSOR_NOT_DOWN when
          IN_SERVICE) AND the facility's ACTIVE contract tier in {STANDARD, PREMIUM}
          (ERR_CONTRACT_TIER_INELIGIBLE when BASIC) — two distinct cross-entity gates on one
          endpoint, exercised independently.
        test_recipe:
          setup:
            - "F1 ACTIVE with BASIC contract ACTIVE; compressor C1 IN_SERVICE"
            - "F2 ACTIVE with BASIC contract ACTIVE; compressor C9 DOWN"
            - "RentalAsset A1 AVAILABLE (500 CFM)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1-XG", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac1: "$.data.id" } }
            - { call: "POST /facilities/${fac1}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac1}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac1}", tier: "BASIC", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 200000 }, as: ContractManager, captures: { sc1: "$.data.id" } }
            - { call: "GET /facilities/${fac1}", as: DealerAdmin, captures: { fac1_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc1}/activate", payload: { expected_facility_version: "${fac1_v}" }, as: ContractManager }
            - { call: "POST /facilities", payload: { name: "F2-XG", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac2: "$.data.id" } }
            - { call: "POST /facilities/${fac2}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac2}", asset_tag: "C9", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c9: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac2}", tier: "BASIC", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 200000 }, as: ContractManager, captures: { sc2: "$.data.id" } }
            - { call: "GET /facilities/${fac2}", as: DealerAdmin, captures: { fac2_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc2}/activate", payload: { expected_facility_version: "${fac2_v}" }, as: ContractManager }
            - { call: "POST /compressors/${c9}/mark-down", as: ServiceTech }
            - { call: "POST /rental-assets", payload: { fleet_tag: "A1", rated_cfm: 500, daily_rate_cents: 35000, deposit_cents: 100000 }, as: DealerAdmin, captures: { a1: "$.data.id" } }
          trigger:
            - { call: "POST /rental-reservations", payload: { facility_id: "${fac1}", down_compressor_id: "${c1}", start_date: "2026-09-01", end_date: "2026-09-05", rental_asset_id: "${a1}" }, as: FacilityManager, as_user_id: "${fac1}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /rental-reservations", payload: { facility_id: "${fac2}", down_compressor_id: "${c9}", start_date: "2026-09-01", end_date: "2026-09-05", rental_asset_id: "${a1}" }, as: FacilityManager, as_user_id: "${fac2}", captures: { err2: "$.data.error_id" } }
          assert:
            - "F1 attempt (compressor IN_SERVICE, tier BASIC): error_id == ERR_COMPRESSOR_NOT_DOWN (compressor state gate fires)"
            - "F2 attempt (compressor DOWN, tier BASIC): error_id == ERR_CONTRACT_TIER_INELIGIBLE (tier gate fires once compressor gate passes)"
            - "no reservations created for either facility"

      - name: certificate_settle_gated_by_measured_case
        grounds:
          - state_machines.GuaranteeCertificate
          - state_machines.SavingsCase
          - errors[ERR_MEASUREMENT_INCOMPLETE]
        distinguishing_aspect: |
          Entity pair SavingsCase->GuaranteeCertificate (different pair than the rental gates):
          settle is rejected while the linked case is MODELED (ERR_MEASUREMENT_INCOMPLETE) and
          succeeds only after close-measurement moves the case to MEASURED.
        test_recipe:
          setup:
            - "Pipeline through MODELED (not yet measured); PREMIUM contract ACTIVE; certificate created (allowed from MODELED)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-XG2", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-01", window_end_date: "2026-03-31", measured_kwh: 248000, measured_avg_cfm: 350.0, measured_peak_cfm: 520.0 }, as: EnergyEngineer, captures: { prof0: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof0}/lock", payload: { expected_facility_version: "${fac_v}" }, as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /retrofit-projects", payload: { facility_id: "${fac}", baseline_pressure_psi: 125, target_pressure_psi: 100, sequence_compressor_ids: ["${c1}"], project_cost_cents: 50000000 }, as: EnergyEngineer, captures: { proj: "$.data.id" } }
            - { call: "POST /retrofit-projects/${proj}/approve", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /retrofit-projects/${proj}/mark-installed", as: ServiceTech }
            - { call: "POST /retrofit-projects/${proj}/commission", as: ServiceTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DealerAdmin }
            - { call: "POST /retrofit-projects/${proj}/accept", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "POST /savings-cases", payload: { facility_id: "${fac}", baseline_profile_id: "${prof0}", retrofit_project_id: "${proj}" }, as: EnergyEngineer, captures: { case: "$.data.id" } }
            - { call: "POST /savings-cases/${case}/model", as: EnergyEngineer }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "PREMIUM", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 900000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v2: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v2}" }, as: ContractManager }
            - { call: "POST /guarantee-certificates", payload: { facility_id: "${fac}", contract_id: "${sc}", savings_case_id: "${case}", guaranteed_pct: 0.90 }, as: ContractManager, captures: { cert: "$.data.id" } }
          trigger:
            - { call: "POST /guarantee-certificates/${cert}/settle", as: ContractManager, captures: { err1: "$.data.error_id" } }
            - { call: "POST /savings-cases/${case}/open-measurement", as: EnergyEngineer }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-06-01", window_end_date: "2026-06-30", measured_kwh: 200000, measured_avg_cfm: 300.0, measured_peak_cfm: 480.0 }, as: EnergyEngineer, captures: { prof1: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v3: "$.data.version" } }
            - { call: "POST /demand-profiles/${prof1}/lock", payload: { expected_facility_version: "${fac_v3}" }, as: EnergyEngineer, as_user_id: eng-1 }
            - { call: "POST /savings-cases/${case}/close-measurement", payload: { post_profile_id: "${prof1}" }, as: EnergyEngineer, as_user_id: eng-2 }
            - { call: "POST /guarantee-certificates/${cert}/settle", as: ContractManager, captures: { st: "$.data.settlement_status" } }
          assert:
            - "first settle rejected: error_id == ERR_MEASUREMENT_INCOMPLETE (case MODELED, not MEASURED)"
            - "GuaranteeCertificate.${cert}.settlement_status still AWAITING_MEASUREMENT after rejection"
            - "after close-measurement: settle succeeds; settlement_status == SETTLED_NO_SHORTFALL (shortfall 0 with measured 486667)"

  # ---------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: rental_asset_turnaround_buffer_overlap
        grounds:
          - validations[priority=8]
          - entities.RentalAsset.fields.next_available_date
          - calculations.rental_asset_selector
        distinguishing_aspect: |
          Buffered closed semantics on RentalAsset: after a return on 2026-09-10 the asset stays
          occupied through 2026-09-11 (turnaround day), so a new reservation starting 2026-09-11
          conflicts (ERR_RENTAL_ASSET_UNAVAILABLE) while 2026-09-12 is legal — adjacency requires
          a 1-day gap, unlike the demand-profile window rule which allows next-day adjacency.
        test_recipe:
          setup:
            - "Facility ACTIVE, STANDARD contract ACTIVE, C1 DOWN; asset A1 500 CFM"
            - "R1 on A1 2026-09-01..2026-09-10, delivered and returned 2026-09-10 -> occupied through 2026-09-11"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-OV1", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v}" }, as: ContractManager }
            - { call: "POST /compressors/${c1}/mark-down", as: ServiceTech }
            - { call: "POST /rental-assets", payload: { fleet_tag: "A1", rated_cfm: 500, daily_rate_cents: 35000, deposit_cents: 100000 }, as: DealerAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /rental-reservations", payload: { facility_id: "${fac}", down_compressor_id: "${c1}", start_date: "2026-09-01", end_date: "2026-09-10", rental_asset_id: "${a1}" }, as: FacilityManager, as_user_id: "${fac}", captures: { res1: "$.data.id" } }
            - { call: "POST /rental-reservations/${res1}/deliver", as: ServiceTech }
            - { call: "POST /rental-reservations/${res1}/return", payload: { actual_return_date: "2026-09-10" }, as: ServiceTech }
          trigger:
            - { call: "POST /rental-reservations", payload: { facility_id: "${fac}", down_compressor_id: "${c1}", start_date: "2026-09-11", end_date: "2026-09-12", rental_asset_id: "${a1}" }, as: FacilityManager, as_user_id: "${fac}", captures: { err: "$.data.error_id" } }
            - { call: "POST /rental-reservations", payload: { facility_id: "${fac}", down_compressor_id: "${c1}", start_date: "2026-09-12", end_date: "2026-09-13", rental_asset_id: "${a1}" }, as: FacilityManager, as_user_id: "${fac}", captures: { res2: "$.data.id" } }
          assert:
            - "RentalAsset.${a1}.next_available_date == 2026-09-11 after return (return date + 1 turnaround day)"
            - "start 2026-09-11 rejected: error_id == ERR_RENTAL_ASSET_UNAVAILABLE (turnaround day still occupied)"
            - "start 2026-09-12 accepted: reservation created (earliest legal adjacency = occupied end + 2)"
            - "RentalReservation.${res2}.status == RESERVED"

      - name: demand_profile_closed_window_overlap
        grounds:
          - validations[priority=8]
          - entities.DemandProfile.fields.window_start_date
          - calculations.baseline_annualization
        distinguishing_aspect: |
          Plain closed-closed semantics on a facility's DemandProfile windows with NO buffer:
          a new window sharing a single calendar day with an existing COLLECTING/LOCKED profile
          (2026-03-31 touching 2026-03-31) conflicts, while starting the next day is legal —
          different interval geometry and different resource entity than the rental turnaround rule.
        test_recipe:
          setup:
            - "Facility ACTIVE; existing profile P0 with window 2026-03-01..2026-03-31 (COLLECTING)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-OV2", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-01", window_end_date: "2026-03-31", measured_kwh: 248000, measured_avg_cfm: 350.0, measured_peak_cfm: 520.0 }, as: EnergyEngineer, captures: { prof0: "$.data.id" } }
          trigger:
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-03-31", window_end_date: "2026-04-29", measured_kwh: 230000, measured_avg_cfm: 340.0, measured_peak_cfm: 500.0 }, as: EnergyEngineer, captures: { err: "$.data.error_id" } }
            - { call: "POST /demand-profiles", payload: { facility_id: "${fac}", window_start_date: "2026-04-01", window_end_date: "2026-04-30", measured_kwh: 240000, measured_avg_cfm: 345.0, measured_peak_cfm: 510.0 }, as: EnergyEngineer, captures: { prof1: "$.data.id" } }
          assert:
            - "shared-day window (2026-03-31 start) rejected: error_id == ERR_MEASUREMENT_WINDOW_OVERLAP"
            - "next-day window (2026-04-01 start) accepted: profile created (zero buffer; only shared days collide)"
            - "DemandProfile.${prof1}.baseline_annual_kwh == 2920000 (240000 * 365 / 30 = 2920000)"

  # ---------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: rental_escrow_reserve_cancel_identity
        grounds:
          - entities.Facility.fields.rental_escrow_cents
          - state_machines.RentalReservation.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: facility rental escrow dollars. Forward action (reserve, +100000c)
          paired with its compensating action (cancel, -100000c) leaves
          Facility.rental_escrow_cents exactly at its pre-pair value — zero drift, distinct from
          the credit-partition invariant.
        test_recipe:
          setup:
            - "Facility ACTIVE, STANDARD contract ACTIVE, C1 DOWN, escrow 0; asset A1 deposit 100000c"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-INV1", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version", esc0: "$.data.rental_escrow_cents" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v}" }, as: ContractManager }
            - { call: "POST /compressors/${c1}/mark-down", as: ServiceTech }
            - { call: "POST /rental-assets", payload: { fleet_tag: "A1", rated_cfm: 500, daily_rate_cents: 35000, deposit_cents: 100000 }, as: DealerAdmin, captures: { a1: "$.data.id" } }
          trigger:
            - { call: "POST /rental-reservations", payload: { facility_id: "${fac}", down_compressor_id: "${c1}", start_date: "2026-09-01", end_date: "2026-09-05", rental_asset_id: "${a1}" }, as: FacilityManager, as_user_id: "${fac}", captures: { res: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: ContractManager, captures: { esc1: "$.data.rental_escrow_cents" } }
            - { call: "POST /rental-reservations/${res}/cancel", as: FacilityManager, as_user_id: "${fac}" }
            - { call: "GET /facilities/${fac}", as: ContractManager, captures: { esc2: "$.data.rental_escrow_cents" } }
          assert:
            - "Facility.${fac}.rental_escrow_cents == 0 before reserve"
            - "after reserve: rental_escrow_cents == 100000"
            - "after cancel (compensating action): rental_escrow_cents == 0 — invariant: escrow == sum(deposit_cents over reservations in {RESERVED, ON_RENT})"
            - "RentalReservation.${res}.status == CANCELLED"

      - name: sla_credit_partition_identity
        grounds:
          - entities.ServiceContract.fields.credits_accrued_total_cents
          - state_machines.ServiceCredit.ACCRUED_to_APPLIED
          - state_machines.ServiceCredit.ACCRUED_to_EXPIRED
        distinguishing_aspect: |
          Conserved quantity: the credit partition identity accrued_total == applied_total +
          expired_total + outstanding on ServiceContract. Two breaches (20000c each) followed by
          apply on the first and expire on the second keep the identity exact: 40000 ==
          20000 + 20000 + 0. Different conserved quantity than the rental escrow instance.
        test_recipe:
          setup:
            - "Facility ACTIVE, STANDARD contract ACTIVE (monthly 400000c); two breaching URGENT tickets -> credits CR1 (accrued 2026-08-12T09:00:01Z, expires 2026-11-10T09:00:01Z) and CR2 (accrued 2026-08-14T09:00:02Z, expires 2026-11-12T09:00:02Z)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F-INV2", utility_rate_cents_per_kwh: 12, operating_hours_per_year: 6000, repair_budget_cents: 5000000 }, as: DealerAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /facilities/${fac}/activate", as: DealerAdmin }
            - { call: "POST /compressors", payload: { facility_id: "${fac}", asset_tag: "C1", rated_kw: 75, rated_cfm: 400 }, as: ServiceTech, captures: { c1: "$.data.id" } }
            - { call: "POST /service-contracts", payload: { facility_id: "${fac}", tier: "STANDARD", start_date: "2026-08-01", term_months: 12, monthly_fee_cents: 400000 }, as: ContractManager, captures: { sc: "$.data.id" } }
            - { call: "GET /facilities/${fac}", as: DealerAdmin, captures: { fac_v: "$.data.version" } }
            - { call: "POST /service-contracts/${sc}/activate", payload: { expected_facility_version: "${fac_v}" }, as: ContractManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: DealerAdmin }
            - { call: "POST /service-tickets", payload: { facility_id: "${fac}", compressor_id: "${c1}", severity: "URGENT" }, as: FacilityManager, as_user_id: "${fac}", captures: { t1: "$.data.id" } }
            - { call: "POST /service-tickets/${t1}/dispatch", as: ServiceTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T09:00:01Z" }, as: DealerAdmin }
            - { call: "POST /service-tickets/${t1}/record-response", as: ServiceTech }
            - { call: "POST /service-tickets", payload: { facility_id: "${fac}", compressor_id: "${c1}", severity: "URGENT" }, as: FacilityManager, as_user_id: "${fac}", captures: { t2: "$.data.id" } }
            - { call: "POST /service-tickets/${t2}/dispatch", as: ServiceTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T09:00:02Z" }, as: DealerAdmin }
            - { call: "POST /service-tickets/${t2}/record-response", as: ServiceTech }
            - { call: "GET /service-credits?contract_id=${sc}", as: ContractManager, captures: { cr1: "$.data[0].id", cr2: "$.data[1].id" } }
          trigger:
            - { call: "POST /service-credits/${cr1}/apply", as: ContractManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-12T09:00:02Z" }, as: DealerAdmin }
            - { call: "POST /service-credits/${cr2}/expire", as: ContractManager }
            - { call: "GET /service-contracts/${sc}", as: ContractManager, captures: { acc: "$.data.credits_accrued_total_cents", app: "$.data.credits_applied_total_cents", exp: "$.data.credits_expired_total_cents", out: "$.data.credits_outstanding_cents" } }
          assert:
            - "ServiceContract.${sc}.credits_accrued_total_cents == 40000"
            - "ServiceContract.${sc}.credits_applied_total_cents == 20000"
            - "ServiceContract.${sc}.credits_expired_total_cents == 20000"
            - "ServiceContract.${sc}.credits_outstanding_cents == 0"
            - "identity holds: 40000 == 20000 + 20000 + 0 (accrued == applied + expired + outstanding)"
