              as_user_id: "adj-user-2"
            - call: "GET /warranty/claims/${cl_gw_id}"
              as: ClaimAdjudicator
              as_user_id: "adj-user-2"
            - call: "GET /warranty/claims/${cl_gw_id}/edits?limit=10&offset=0"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
          assert:
            - "first call: HTTP 200, GoodwillAuthorization.status == APPROVED"
            - "GoodwillAuthorization.approved_amount_cents == 40000 and decided_by_user_id == adj-user-2"
            - "GoodwillAuthorization.adjudicator_limit_cents == 40000 and manager_limit_cents == 48000"
