  - rule_id: transitive_cascade
    instances:

      - name: compromise_four_hop_signing_cascade
        grounds:
          - state_machines.SigningCredential.ACTIVE_to_COMPROMISED
          - state_machines.Submission.WAITING_FOR_REVIEW_to_BLOCKED_INVALID_SIGNING
          - state_machines.RolloutPlan.PHASE_ACTIVE_to_PAUSED
          - state_machines.AppRecord.PHASED_ROLLOUT_to_PAUSED
          - calculations.compliance_posture
          - calculations.review_capacity_allocation
          - entities.SigningCredential.fields.blocked_submission_count
        distinguishing_aspect: |
          ONE report-compromise call propagates four hops through four different entity types —
          DISTRIBUTION_CERT COMPROMISED -> linked PROVISIONING_PROFILE REVOKED/COMPROMISE_CASCADE ->
          the WAITING_FOR_REVIEW Submission BLOCKED_INVALID_SIGNING with its review slot released ->
          posture RESTRICTED -> the PHASE_ACTIVE RolloutPlan PAUSED/POSTURE_DEGRADED and
          distribution_state PAUSED with the share pair frozen at 1.00 / 99.00.
        test_recipe:
          setup:
            - "PublisherAccount ACTIVE with an ACTIVE IOS DISTRIBUTION_CERT and an ACTIVE PROVISIONING_PROFILE linked to it"
            - "AppRecord IOS with one PASSED PRIVACY mapping (index 100.00, posture OPEN)"
            - "Submission build 10 APPROVED and released by a PHASED RolloutPlan started at 2026-08-02T00:00:00Z (PHASE_ACTIVE, distribution PHASED_ROLLOUT, 1.00 / 99.00)"
