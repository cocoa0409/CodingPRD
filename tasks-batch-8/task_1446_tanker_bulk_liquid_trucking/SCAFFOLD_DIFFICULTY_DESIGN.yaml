            - { call: "POST /bulk-liquid/shipments/${s1}/plan", payload: { trailer_id: "${trl1}", driver_id: "${drv}", rack_id: "${rack}", rack_window_start: "2026-08-02T10:00:00Z", rack_window_end: "2026-08-02T12:00:00Z" }, as: Dispatcher }
            - { call: "POST /bulk-liquid/shipments", payload: { customer_id: "${cust}", product_id: "${prod}", ordered_gallons: 1000, route_miles: 100, rate_per_gal_cents: 100 }, as: Dispatcher, captures: { s2: $.data.id } }
            - { call: "POST /bulk-liquid/shipments", payload: { customer_id: "${cust}", product_id: "${prod}", ordered_gallons: 1000, route_miles: 100, rate_per_gal_cents: 100 }, as: Dispatcher, captures: { s3: $.data.id } }
          trigger:
