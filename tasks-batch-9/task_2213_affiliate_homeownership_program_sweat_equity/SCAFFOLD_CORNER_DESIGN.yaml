            - { call: "POST /homeownership/mortgage-applications/${app_id}/lien-actions", payload: { action: "CURE", effective_date: "2026-08-05T12:00:00.000Z" }, as: MortgageOfficer, as_user_id: "officer-1" }
            - { call: "POST /homeownership/mortgage-applications/${app_id}/lien-actions", payload: { action: "FORBEARANCE", effective_date: "2026-08-05T12:00:00.000Z", counseling_session_reference: "CNS-0002" }, as: MortgageOfficer, as_user_id: "officer-1" }
            - { call: "POST /homeownership/mortgage-applications/${app_id}/lien-actions", payload: { action: "CURE", effective_date: "2026-08-05T12:00:00.000Z" }, as: MortgageOfficer, as_user_id: "officer-1" }
            - { call: "POST /homeownership/mortgage-applications/${app_id}/lien-actions", payload: { action: "TRANSFER_NOTICE", effective_date: "2026-08-05T12:00:00.000Z", sale_price_cents: 16000000 }, as: MortgageOfficer, as_user_id: "officer-1" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-05T12:00:00.000Z" }, as: ProgramAdmin, as_user_id: "admin-1" }
