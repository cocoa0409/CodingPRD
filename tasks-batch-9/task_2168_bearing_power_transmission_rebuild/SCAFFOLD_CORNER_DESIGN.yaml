# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
#
# Breadth probe over the §1.1-§1.7 surface, walked against
# references/claim-extraction-guide.md. §1.8 owns the nine deep reasoning
# rules; everything else that the scaffold declares is enumerated here.
#
# The recurring MINIMAL FIXTURE used below is five calls:
#   POST /shop/customers -> POST /shop/customers/{id}/assets
#   -> POST /shop/clearance-standards -> POST /shop/core-units
#   -> POST /shop/rebuild-orders
# with the SKF-22324-CCK band set (BORE [40,90] ext 15 ded 0.10 w 0.40).
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: customer_create_returns_zero_balances_and_version_one
        claim_type: creation
        grounds:
          - entities.Customer.fields.total_credit_balance_cents
          - endpoints[POST /shop/customers]
        distinguishing_aspect: "A freshly created Customer answers 201 with all four balance fields at 0, version 1, and a server-minted UUID id carrying no type prefix."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Fresh Mill", account_code: "FRS-001", contact_email: "rel@fresh.example" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /shop/customers/${cust_id}"
              as: ShopAdmin
          assert:
            - "the create response is HTTP 201"
            - "Customer.${cust_id}.core_credit_balance_cents == 0"
            - "Customer.${cust_id}.warranty_credit_balance_cents == 0"
            - "Customer.${cust_id}.manual_credit_balance_cents == 0"
            - "Customer.${cust_id}.total_credit_balance_cents == 0"
            - "Customer.${cust_id}.version == 1"
            - "Customer.${cust_id}.id matches ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ with no prefix"
            - "Customer.${cust_id}.account_code == FRS-001 and contact_email == rel@fresh.example"

      - name: core_unit_filtered_list_resolves_children_from_each_declared_fk
        claim_type: retrieval
        grounds:
          - endpoints[GET /shop/core-units]
          - entities.CoreUnit.fields.customer_id
          - entities.CoreUnit.fields.clearance_standard_id
          - entities.CoreUnit.fields.replacement_core_unit_id
        distinguishing_aspect: "GET /shop/core-units filtered by customer_id, by clearance_standard_id and by the self-referential replacement_core_unit_id each returns exactly the matching rows as a CoreUnit[]."
        test_recipe:
          setup:
            - "Two cores under one customer and one standard; the first is scrapped naming the second as its replacement."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Filter Mill", account_code: "FLT-001" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/customers/${cust_id}/assets"
              payload: { asset_tag: "FLT-01-GBX", criticality: "STANDARD", duty_class: "CONTINUOUS" }
              as: ShopAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "SKF-22324-CCK", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-FLT-1", rebuild_count: 0, declared_condition_grade: "GRADE_D" }
              as: ShopAdmin
              captures: { core_1: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-FLT-2", rebuild_count: 0, declared_condition_grade: "GRADE_B" }
              as: ShopAdmin
              captures: { core_2: $.data.id }
            - call: "POST /shop/rebuild-orders"
              payload: { customer_id: "${cust_id}", core_unit_id: "${core_1}", customer_asset_id: "${asset_id}", labor_hours: 4.0 }
              as: Planner
              captures: { order_1: $.data.id }
            - call: "POST /shop/vibration-readings"
              payload: { customer_asset_id: "${asset_id}", reading_at: "2026-08-02T06:00:00Z", overall_velocity_mm_s: 2.10, bpfo_amplitude_g: 0.30, bpfi_amplitude_g: 0.25, baseline_amplitude_g: 0.20 }
              as: ReliabilityEngineer
              captures: { vr_id: $.data.id }
            - call: "POST /shop/inspections"
              payload: { rebuild_order_id: "${order_1}", linked_vibration_reading_id: "${vr_id}" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
            - call: "POST /shop/inspections/${insp_id}/measurements"
              payload: { feature_code: "BORE", measured_um: 200 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/advance"
              payload: { action: "SUBMIT" }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /shop/inspections/${insp_id}/advance"
              payload: { action: "ACCEPT" }
              as: Inspector
              as_user_id: "insp-2"
            - call: "POST /shop/core-units/${core_1}/advance"
              payload: { action: "SCRAP", replacement_core_unit_id: "${core_2}" }
              as: ShopAdmin
          trigger:
            - call: "GET /shop/core-units"
              payload: { customer_id: "${cust_id}" }
              as: ShopAdmin
            - call: "GET /shop/core-units"
              payload: { clearance_standard_id: "${std_id}" }
              as: ShopAdmin
            - call: "GET /shop/core-units"
              payload: { replacement_core_unit_id: "${core_2}" }
              as: ShopAdmin
          assert:
            - "GET /shop/core-units?customer_id=${cust_id} returns total_count == 2"
            - "GET /shop/core-units?clearance_standard_id=${std_id} returns total_count == 2"
            - "GET /shop/core-units?replacement_core_unit_id=${core_2} returns total_count == 1 and its id == ${core_1}"
            - "CoreUnit.${core_1}.status == SCRAPPED and replacement_core_unit_id == ${core_2}"

      - name: core_unit_listing_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - response_envelope.pagination_fields
          - endpoints[GET /shop/core-units]
        distinguishing_aspect: "With three cores in the database and limit 2, the list envelope reports total_count 3, has_more true, and offset 2 returns the single remaining row with has_more false."
        test_recipe:
          setup:
            - "One customer, one standard and three received cores."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Page Mill", account_code: "PAG-001" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "SKF-22324-CCK", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-PG-1", rebuild_count: 0, declared_condition_grade: "GRADE_B" }
              as: ShopAdmin
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-PG-2", rebuild_count: 0, declared_condition_grade: "GRADE_B" }
              as: ShopAdmin
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-PG-3", rebuild_count: 0, declared_condition_grade: "GRADE_B" }
              as: ShopAdmin
          trigger:
            - call: "GET /shop/core-units"
              payload: { customer_id: "${cust_id}", limit: 2, offset: 0 }
              as: ShopAdmin
            - call: "GET /shop/core-units"
              payload: { customer_id: "${cust_id}", limit: 2, offset: 2 }
              as: ShopAdmin
          assert:
            - "the first page returns 2 items with total_count == 3 and has_more == true"
            - "the second page returns 1 item with total_count == 3 and has_more == false"
            - "omitting limit yields the declared default of 10"

      - name: create_order_missing_required_fields_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /shop/rebuild-orders]
        distinguishing_aspect: "Omitting labor_hours from POST /shop/rebuild-orders returns HTTP 400 ERR_INVALID_REQUEST and creates no RebuildOrder row."
        test_recipe:
          setup:
            - "One customer, asset, standard and received core."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Req Mill", account_code: "REQ-001" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/customers/${cust_id}/assets"
              payload: { asset_tag: "REQ-01-GBX", criticality: "STANDARD", duty_class: "CONTINUOUS" }
              as: ShopAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "SKF-22324-CCK", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-REQ-1", rebuild_count: 0, declared_condition_grade: "GRADE_B" }
              as: ShopAdmin
              captures: { core_id: $.data.id }
          trigger:
            - call: "POST /shop/rebuild-orders"
              payload: { customer_id: "${cust_id}", core_unit_id: "${core_id}", customer_asset_id: "${asset_id}" }
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "the response is HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /shop/rebuild-orders?customer_id=${cust_id} returns total_count == 0"

      - name: optional_fields_apply_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.CoreUnit.fields.rebuild_count
          - entities.CustomerAsset.fields.site_code
          - entities.Bench.fields.cleanroom
          - entities.BenchReservation.fields.queue_if_full
        distinguishing_aspect: "Omitting rebuild_count, site_code, cleanroom and cleanroom_required yields 0, MAIN, false and false respectively rather than null."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Default Mill", account_code: "DEF-001" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /shop/customers/${cust_id}/assets"
              payload: { asset_tag: "DEF-01-GBX", criticality: "STANDARD", duty_class: "STANDBY" }
              as: ShopAdmin
              captures: { asset_id: $.data.id, sc: $.data.site_code }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "DEFAULT-SPEC-1", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/benches"
              payload: { bench_code: "B-DEF", parallel_slots: 1 }
              as: ShopAdmin
              captures: { bench_id: $.data.id, cr: $.data.cleanroom }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-DEF-1", declared_condition_grade: "GRADE_B" }
              as: ShopAdmin
              captures: { core_id: $.data.id, rc: $.data.rebuild_count }
          assert:
            - "CustomerAsset.${asset_id}.site_code == MAIN"
            - "ClearanceStandard.${std_id}.cleanroom_required == false"
            - "Bench.${bench_id}.cleanroom == false and committed_minutes == 0"
            - "CoreUnit.${core_id}.rebuild_count == 0"
            - "CoreUnit.${core_id}.provisional_core_credit_cents == 67500"

      - name: core_unit_computed_and_system_fields_are_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.CoreUnit.fields.model_code
          - entities.CoreUnit.fields.status
          - entities.CoreUnit.fields.provisional_core_credit_cents
          - validations[priority=5]
        distinguishing_aspect: "Client-supplied values for model_code, status and provisional_core_credit_cents are ignored, not rejected: the row still answers with the standard's model_code, status RECEIVED and the computed 10800-cent provisional credit."
        test_recipe:
          setup:
            - "One customer and the SKF-22324-CCK standard."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Ignore Mill", account_code: "IGN-001" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "SKF-22324-CCK", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
          trigger:
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-IGN-1", rebuild_count: 1, declared_condition_grade: "GRADE_D", model_code: "FORGED-BY-CLIENT", status: "SHIPPED", provisional_core_credit_cents: 999999, id: "00000000-0000-4000-8000-000000000000" }
              as: ShopAdmin
              captures: { core_id: $.data.id }
          assert:
            - "the response is HTTP 201"
            - "CoreUnit.${core_id}.model_code == SKF-22324-CCK"
            - "CoreUnit.${core_id}.status == RECEIVED"
            - "CoreUnit.${core_id}.provisional_core_credit_cents == 10800"
            - "CoreUnit.${core_id}.id != 00000000-0000-4000-8000-000000000000"
            - "CoreUnit.${core_id}.final_core_credit_cents == null"
            - "Customer.${cust_id}.core_credit_balance_cents == 10800"

      - name: measurement_is_append_only_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.Measurement.common_fields
          - entities.Measurement.fields.sequence_no
          - endpoints[GET /shop/inspections/{id}/measurements]
        distinguishing_aspect: "Measurement is declared common_fields: false, so its rows expose id and created_at but no updated_at and no version, and there is no endpoint that mutates or deletes one."
        test_recipe:
          setup:
            - "A DRAFT inspection with two BORE measurements."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Immutable Mill", account_code: "IMM-001" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/customers/${cust_id}/assets"
              payload: { asset_tag: "IMM-01-GBX", criticality: "STANDARD", duty_class: "CONTINUOUS" }
              as: ShopAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "SKF-22324-CCK", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-IMM-1", rebuild_count: 0, declared_condition_grade: "GRADE_B" }
              as: ShopAdmin
              captures: { core_id: $.data.id }
            - call: "POST /shop/rebuild-orders"
              payload: { customer_id: "${cust_id}", core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", labor_hours: 3.0 }
              as: Planner
              captures: { order_id: $.data.id }
            - call: "POST /shop/inspections"
              payload: { rebuild_order_id: "${order_id}" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /shop/inspections/${insp_id}/measurements"
              payload: { feature_code: "BORE", measured_um: 70 }
              as: Inspector
              as_user_id: "insp-1"
              captures: { m1: $.data.id, sq1: $.data.sequence_no }
            - call: "POST /shop/inspections/${insp_id}/measurements"
              payload: { feature_code: "BORE", measured_um: 72 }
              as: Inspector
              as_user_id: "insp-1"
              captures: { m2: $.data.id, sq2: $.data.sequence_no }
            - call: "GET /shop/inspections/${insp_id}/measurements"
              as: Inspector
              as_user_id: "insp-1"
          assert:
            - "each Measurement response carries id and created_at"
            - "no Measurement response carries an updated_at or a version field"
            - "the first measurement has sequence_no == 1 and the second sequence_no == 2"
            - "GET /shop/inspections/${insp_id}/measurements returns total_count == 2"
            - "both measurements have band_result == IN_SPEC and deviation_ratio == 0.000000"

      - name: invalid_enum_and_out_of_range_values_are_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - entities.CustomerAsset.fields.criticality
          - entities.BenchReservation.fields.window_end_at
        distinguishing_aspect: "Four independent shape violations - an unknown criticality enum, parallel_slots 0, a reservation whose window_end_at equals window_start_at, and a baseline_amplitude_g of 0 - each return HTTP 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One customer, asset, standard, bench and order to hang the bad requests on."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Range Mill", account_code: "RNG-001" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /shop/customers/${cust_id}/assets"
              payload: { asset_tag: "RNG-01-GBX", criticality: "STANDARD", duty_class: "CONTINUOUS" }
              as: ShopAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /shop/clearance-standards"
              payload: { model_code: "SKF-22324-CCK", base_core_value_cents: 90000, max_rebuild_count: 3, warranty_hours: 8000, warranty_months: 18, cleanroom_required: false, required_feature_codes: ["BORE"], feature_bands: [{feature_code: "BORE", min_um: 40, max_um: 90, rework_extension_um: 15, deduction_pct: 0.10, weight: 0.40}] }
              as: ShopAdmin
              captures: { std_id: $.data.id }
            - call: "POST /shop/benches"
              payload: { bench_code: "B-RNG", parallel_slots: 1, cleanroom: false }
              as: ShopAdmin
              captures: { bench_id: $.data.id }
            - call: "POST /shop/core-units"
              payload: { customer_id: "${cust_id}", clearance_standard_id: "${std_id}", serial_no: "SN-RNG-1", rebuild_count: 0, declared_condition_grade: "GRADE_B" }
              as: ShopAdmin
              captures: { core_id: $.data.id }
            - call: "POST /shop/rebuild-orders"
              payload: { customer_id: "${cust_id}", core_unit_id: "${core_id}", customer_asset_id: "${asset_id}", labor_hours: 3.0 }
              as: Planner
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /shop/customers/${cust_id}/assets"
              payload: { asset_tag: "RNG-02-GBX", criticality: "SUPER_CRITICAL", duty_class: "CONTINUOUS" }
              as: ShopAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /shop/benches"
              payload: { bench_code: "B-RNG-2", parallel_slots: 0, cleanroom: false }
              as: ShopAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /shop/bench-reservations"
              payload: { rebuild_order_id: "${order_id}", bench_id: "${bench_id}", window_start_at: "2026-09-07T08:00:00Z", window_end_at: "2026-09-07T08:00:00Z" }
              as: Planner
              captures: { e3: $.data.error_id }
            - call: "POST /shop/vibration-readings"
              payload: { customer_asset_id: "${asset_id}", reading_at: "2026-08-02T06:00:00Z", overall_velocity_mm_s: 2.10, bpfo_amplitude_g: 0.30, bpfi_amplitude_g: 0.25, baseline_amplitude_g: 0 }
              as: ReliabilityEngineer
              captures: { e4: $.data.error_id }
          assert:
            - "the SUPER_CRITICAL criticality request returns HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "the parallel_slots 0 request returns HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "the zero-width reservation window request returns HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "the zero baseline_amplitude_g request returns HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /shop/benches/${bench_id}/reservations returns total_count == 0"
            - "GET /shop/customers/${cust_id}/assets returns total_count == 1"

      - name: asset_creation_under_missing_customer_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - endpoints[POST /shop/customers/{id}/assets]
        distinguishing_aspect: "Creating a CustomerAsset under a non-existent customer id resolves the path id first and returns HTTP 404 ERR_CUSTOMER_NOT_FOUND before any body validation runs."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { name: "Anchor Mill", account_code: "ANC-001" }
              as: ShopAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /shop/customers/11111111-1111-4111-8111-111111111111/assets"
              payload: { asset_tag: "ORPHAN-01" }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response is HTTP 404 with error_id == ERR_CUSTOMER_NOT_FOUND"
            - "the response error_id != ERR_INVALID_REQUEST even though criticality and duty_class are both missing"
            - "GET /shop/customers/${cust_id}/assets returns total_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: inspection_return_then_reopen_clears_every_grading_field
        claim_type: cyclic
        grounds:
          - state_machines.Inspection.SUBMITTED_to_RETURNED
          - state_machines.Inspection.RETURNED_to_DRAFT
          - entities.Inspection.fields.revision_count
          - entities.Inspection.fields.remaining_life_score
        distinguishing_aspect: "The engineering return loop is not a no-op: RETURN leaves the computed fields in place, REOPEN clears remaining_life_score, remaining_life_grade, life_score_variant, failure_cause_code, cause_confidence and submitted_by_user_id and bumps revision_count to 1, while the CoreUnit stays INSPECTING and no credit note is written."
        test_recipe:
          setup:
            - "One inspection SUBMITTED by insp-1 with a single IN_SPEC BORE measurement and a zone-B reading."
          setup_api_calls:
