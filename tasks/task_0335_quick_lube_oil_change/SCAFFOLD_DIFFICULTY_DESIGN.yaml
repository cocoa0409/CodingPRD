            - "WorkOrder.${wo_id}.service_status == CANCELLED and payment_status == VOIDED"
            - "after cancel FleetAccount.${fleet_id}.reserved_credit_cents == 0 (released by the payment void)"
            - "Bay.${bay_id}.status == OPEN (freed)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_authorize
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Dual failure: a DRAFT order (wrong service_status for authorize, priority-5 state)
          that ALSO would exceed fleet credit (priority-10 business_fiscal). The state error
          ERR_INVALID_STATE (priority 5) must win over ERR_FLEET_CREDIT_EXCEEDED (priority 10).
        test_recipe:
          setup:
            - "Fleet account credit_limit 5000 (too small to cover total); order left in DRAFT (never started)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-13T09:00:00Z" }
              as: ShopManager
            - call: "POST /shops"
              payload: { name: "Main", tax_rate: 0.0825, target_throughput_seconds: 1800 }
