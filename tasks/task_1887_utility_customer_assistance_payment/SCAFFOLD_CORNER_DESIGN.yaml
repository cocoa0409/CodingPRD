            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/ops/daily-sweep"
              payload: {}
              as: ProgramAdmin
              captures: { expired_n: "$.data.certificates_expired" }
          trigger:
            - call: "POST /assistance/medical-certificates/${cert_id}/renew"
              payload: {}
              as: CustomerServiceRep
              captures: { err: "$.data.error_id" }
          assert:
            - "sweep: certificates_expired == 1; renew: error_id == ERR_CERTIFICATE_NOT_RENEWABLE, HTTP 409"

      - name: dpa_reinstate_from_active_rejected
        claim_type: invalid_transition
        grounds: ["validations[priority=11]", "errors[ERR_DPA_NOT_REINSTATABLE]"]
        distinguishing_aspect: "Reinstate on an ACTIVE (never defaulted) DPA fails with ERR_DPA_NOT_REINSTATABLE."
        test_recipe:
          setup: ["account arrearage 120000; DPA n=4 activated via 12000 down payment (2026-08-01)"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "48 Reinstate Rd" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/dpas"
              payload: { account_id: "${acct_id}", installment_count: 4, expected_account_version: "${acct_v} + 1" }
              as: CustomerServiceRep
              captures: { dpa_id: "$.data.id" }
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_id}", amount_cents: 12000, tender_type: "CASH" }
              as: CustomerServiceRep
          trigger:
            - call: "POST /assistance/dpas/${dpa_id}/reinstate"
              payload: {}
              as: CustomerServiceRep
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_DPA_NOT_REINSTATABLE, HTTP 409; DPA remains ACTIVE"

      - name: allocation_double_disburse_rejected
        claim_type: invalid_transition
        grounds: ["validations[priority=12]", "errors[ERR_ALLOCATION_NOT_PLEDGED]"]
        distinguishing_aspect: "Disbursing an already-DISBURSED allocation fails with ERR_ALLOCATION_NOT_PLEDGED (no double credit to the account)."
        test_recipe:
          setup: ["account with ACTIVE TIER_2 enrollment (no arrearage); fund FY2026 appropriated 100000; allocation 30000 PLEDGED then DISBURSED"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "49 Doubledisb Dr" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 2, gross_annual_income_cents: 3500000, current_month_income_cents: 300000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_id: "$.data.id" }
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "POST /assistance/applications/${app_id}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "GET /assistance/enrollments"
              payload: {}
              as: EligibilitySpecialist
              captures: { enr_id: "$.data[0].id" }
            - call: "POST /assistance/enrollments/${enr_id}/activate"
              payload: {}
              as: CustomerServiceRep
              as_user_id: csr_1
            - call: "POST /assistance/funding-sources"
              payload: { name: "State 2026", funder_type: "STATE_GRANT", fiscal_year: 2026, appropriated_cents: 100000, priority_rank: 1, eligible_tiers: ["TIER_2"] }
              as: ProgramAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /assistance/fund-allocations"
              payload: { account_id: "${acct_id}", amount_cents: 30000 }
              as: ProgramAdmin
              captures: { alloc_id: "$.data[0].id" }
            - call: "POST /assistance/fund-allocations/${alloc_id}/disburse"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /assistance/fund-allocations/${alloc_id}/disburse"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { cred: "$.data.credit_balance_cents" }
          assert:
            - "second disburse: error_id == ERR_ALLOCATION_NOT_PLEDGED, HTTP 409"
            - "account credit_balance_cents == 30000 (credited exactly once — 30000 disbursement with 0 arrearage routes wholly to credit)"

      - name: begin_review_twice_rejected
        claim_type: invalid_transition
        grounds: ["validations[priority=9]", "errors[ERR_APPLICATION_NOT_REVIEWABLE]"]
        distinguishing_aspect: "begin-review from UNDER_REVIEW is an invalid from-state: second attempt fails with ERR_APPLICATION_NOT_REVIEWABLE."
        test_recipe:
          setup: ["application UNDER_REVIEW (held by es_1)"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "50 Twice Ter" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 1, gross_annual_income_cents: 500000, current_month_income_cents: 40000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_id: "$.data.id" }
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
          trigger:
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_2
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_APPLICATION_NOT_REVIEWABLE, HTTP 409; reviewed_by_user_id remains es_1"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: accounts_list_pagination
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "Pagination fields follow the fixed envelope: limit=2 over 3 accounts yields has_more true then false with total_count 3."
        test_recipe:
          setup: ["three accounts exist"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "60 Page Rd 1" }
              as: ProgramAdmin
            - call: "POST /assistance/accounts"
              payload: { service_address: "61 Page Rd 2" }
              as: ProgramAdmin
            - call: "POST /assistance/accounts"
              payload: { service_address: "62 Page Rd 3" }
              as: ProgramAdmin
          trigger:
            - call: "GET /assistance/accounts"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
            - call: "GET /assistance/accounts"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdmin
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"

      - name: payments_filtered_by_dpa_id
        claim_type: cross_reference_link
        grounds: [entities.Payment.fields.dpa_id]
        distinguishing_aspect: "The filtered list returns exactly the payments routed through the given DPA (FK reverse-reachability form)."
        test_recipe:
          setup: ["account A with a DPA and its 12000 down payment; account B with a plain 5000 payment (no DPA)"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "63 Filter Rd A" }
              as: ProgramAdmin
              captures: { acct_a: "$.data.id", acct_a_v: "$.data.version" }
            - call: "POST /assistance/accounts/${acct_a}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/dpas"
              payload: { account_id: "${acct_a}", installment_count: 4, expected_account_version: "${acct_a_v} + 1" }
              as: CustomerServiceRep
              captures: { dpa_a: "$.data.id" }
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_a}", amount_cents: 12000, tender_type: "CASH" }
              as: CustomerServiceRep
              captures: { pay_a: "$.data.id" }
            - call: "POST /assistance/accounts"
              payload: { service_address: "64 Filter Rd B" }
              as: ProgramAdmin
              captures: { acct_b: "$.data.id" }
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_b}", amount_cents: 5000, tender_type: "CASH" }
              as: CustomerServiceRep
              captures: { pay_b: "$.data.id" }
          trigger:
            - call: "GET /assistance/payments"
              payload: { dpa_id: "${dpa_a}" }
              as: ProgramAdmin
              captures: { first_id: "$.data[0].id" }
          assert:
            - "filtered list contains exactly 1 payment and its id == ${pay_a} (Payment B excluded)"

      - name: applications_reverse_reachability_and_supersede
        claim_type: cross_reference_link
        grounds: [entities.AssistanceApplication.fields.account_id, state_machines.AssistanceApplication]
        distinguishing_aspect: "GET /assistance/applications?account_id lists both applications after a supersede; the superseded one is WITHDRAWN."
        test_recipe:
          setup: ["account; app1 SUBMITTED; app2 created against the fresh account version (supersedes app1)"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "65 Reverse Rd" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 1, gross_annual_income_cents: 500000, current_month_income_cents: 40000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app1: "$.data.id" }
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { acct_v2: "$.data.version" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 1, gross_annual_income_cents: 550000, current_month_income_cents: 45000, expected_account_version: "${acct_v2}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app2: "$.data.id" }
          trigger:
            - call: "GET /assistance/applications/${app1}"
              payload: {}
              as: CustomerServiceRep
              captures: { app1_status: "$.data.status" }
            - call: "GET /assistance/applications/${app2}"
              payload: {}
              as: CustomerServiceRep
              captures: { app2_status: "$.data.status" }
            - call: "GET /assistance/applications"
              payload: { account_id: "${acct_id}" }
              as: CustomerServiceRep
          assert:
            - "app1 status == WITHDRAWN (superseded); app2 status == SUBMITTED"
            - "filtered list for the account returns total_count == 2"

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_response_envelope_shape
        claim_type: error_triggerable
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "The error body follows the fixed envelope: meta with api_request_id, response_type == error, data.error_id/data.message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /assistance/accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response_type == \"error\"; data.error_id == ERR_NOT_FOUND; data.message present; meta.api_request_id present"

      - name: error_insufficient_funds_triggered
        claim_type: error_triggerable
        grounds: ["errors[ERR_INSUFFICIENT_ASSISTANCE_FUNDS]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / allocation_requires_completed_referral"
          rationale: "First trigger there asserts ERR_INSUFFICIENT_ASSISTANCE_FUNDS while the referral is INITIATED."

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: role_operations
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Requests without X-User-Role/X-User-ID headers fail with ERR_UNAUTHENTICATED before any role check (the test harness strips both headers for this call)."
        test_recipe:
          setup: ["account exists"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "70 Auth Ave" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
          trigger:
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, HTTP 401"

      - name: csr_cannot_verify_application
        claim_type: role_operations
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Verify is exclusive to EligibilitySpecialist; a CustomerServiceRep gets ERR_UNAUTHORIZED even on a reviewable application."
        test_recipe:
          setup: ["application UNDER_REVIEW held by es_1"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "71 Rbac Rd" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 1, gross_annual_income_cents: 500000, current_month_income_cents: 40000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_id: "$.data.id" }
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
          trigger:
            - call: "POST /assistance/applications/${app_id}/verify"
              payload: {}
              as: CustomerServiceRep
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_UNAUTHORIZED, HTTP 403"

      - name: customer_cannot_read_other_account
        claim_type: role_operations
        grounds: ["validations[priority=3]", "errors[ERR_ACCOUNT_OWNERSHIP_MISMATCH]"]
        distinguishing_aspect: "Customer is entity_backed: X-User-ID must equal the account id in the path, else ERR_ACCOUNT_OWNERSHIP_MISMATCH."
        test_recipe:
          setup: ["account exists (owned by a different id than the caller's)"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "72 Owner Only" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
          trigger:
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: Customer
              as_user_id: "22222222-2222-2222-2222-222222222222"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_ACCOUNT_OWNERSHIP_MISMATCH, HTTP 403"

      - name: fieldcrew_cannot_create_funding_source
        claim_type: role_operations
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Funding source creation is ProgramAdmin-exclusive; FieldCrew is denied."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /assistance/funding-sources"
