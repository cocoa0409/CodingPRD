      - name: certify_a_rejected_report_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors.ERR_REPORT_INVALID_STATE
          - state_machines.QcValidationReport.GENERATED_to_REJECTED
        distinguishing_aspect: "REJECTED is terminal: certifying it is 409 ERR_REPORT_INVALID_STATE, and the pre-rejection score set (quality 93.40 / advisory 96.25 / tier B) is frozen rather than recomputed."
        test_recipe:
          setup:
            - "One jurisdiction LARCO and one DRAFT centerline \"N. Maple St\" with NO address points."
            - "One ROAD-scoped report over it: ROAD_UNVALIDATED (BLOCKING), ROAD_NAME_NOT_NORMALIZED (WARNING), ROAD_QC_DIRTY (WARNING), ROAD_NO_ADDRESSES (INFO)."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
