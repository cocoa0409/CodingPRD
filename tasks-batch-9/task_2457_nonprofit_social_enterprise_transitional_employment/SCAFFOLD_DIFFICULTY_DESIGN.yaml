              as: IntakeSpecialist
              captures: { p1_id: $.data.id }
            - call: "POST /support-activities"
              payload: { participant_id: "${p1_id}", category: "JOB_COACHING", duration_minutes: 90, cost_cents: 6000 }
              as: JobCoach
              captures: { act1_id: $.data.id }
