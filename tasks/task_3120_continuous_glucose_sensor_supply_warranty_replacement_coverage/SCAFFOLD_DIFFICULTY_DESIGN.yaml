  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: one_active_binding_per_channel_half_open_interval
        grounds:
          - validations[priority=13]
          - errors[ERR_ACTIVE_BINDING_EXISTS]
        distinguishing_aspect: |
          Interval semantics = half-open [activated_at, expires_at) per
          (patient, channel). A new binding whose activated_at coincides with
          the existing binding's expires_at (touching, gap=0) is permitted;
          any positive overlap on the same channel is rejected. Distinct
          semantic from prescription-validity closed interval.
        test_recipe:
          setup:
            - "Patient has ACTIVE binding on READER channel; another IN_HAND unit on same channel; second binding attempted while first is still ACTIVE"
          setup_api_calls:
            - call: "POST /cgm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
