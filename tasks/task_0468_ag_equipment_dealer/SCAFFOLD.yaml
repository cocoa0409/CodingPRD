# =============================================================================
# Agricultural Equipment Dealer — scaffold seed tables (Expert tier)
# =============================================================================

scenario: "Agricultural Equipment Dealer (John Deere style): unit inventory (new/used) & floor plan, sales & financing/lease, trade-in appraisal, service work order & flat-rate, parts & precision-ag (telematics), warranty & PIP/recall claim, used-equipment auction, seasonal whole-goods order"

domain_name: ag-equipment-dealer
api_prefix: ""

# Structural DNA -------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation        # finite per-unit lifecycle competed for by sale/lease/auction/floor-plan
  secondary_archetype: ledger_reconciliation # floor-plan curtailment (chronological accrual) vs deal-cost (forward-looking)
  complexity_layers:
    - optimistic_concurrency        # OCC on Unit.version: sale-vs-auction-listing supersede race
    - dual_variant_calculation      # flat-rate labor (estimated vs actual hours) ; floor-plan interest (per-day vs straight)
    - cascading_side_effects        # deal funding -> floor-plan payoff -> unit status -> trade-in intake
    - rate_threshold_triggers       # floor-plan curtailment schedule breakpoints (90/180/270 days)

  entity_topology: flat            # peer entities linked by FK; no deep URL nesting (PRIORITIZE per §0.3)
  state_machine_shape: branching   # Deal forks SALE vs LEASE vs AUCTION_SALE with divergent side-effects; Unit cyclic via repossession
  relationship_patterns:
    - one_to_many
    - many_to_many                 # WorkOrder <-> PartLine, Deal <-> TradeIn
    - cross_aggregate              # Deal references Unit, TradeIn, FloorPlanNote across boundaries
    - self_referential             # TradeIn becomes a new Unit (acquired_from_tradein_id) — Unit references Unit
  role_model: peer_roles           # SalesRep / ServiceAdvisor / PartsClerk / FinanceManager / AuctionClerk own distinct surfaces; DealerAdmin override
  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  # --- Inventory unit (new/used whole goods) -------------------------------
  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: stock_number, type: string, source: input, description: "Dealer stock number, unique", constraints: "unique across all Units" }
      - { name: condition, type: enum, source: input, description: "NEW | USED" }
      - { name: model_code, type: string, source: input, description: "Manufacturer model code, e.g. 8R410" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial, unique", constraints: "unique across all Units" }
      - { name: dealer_cost_cents, type: integer, source: input, description: "Acquisition/invoice cost in cents", constraints: ">= 0" }
      - { name: list_price_cents, type: integer, source: input, description: "Asking price in cents", constraints: ">= 0" }
      - { name: engine_hours, type: integer, source: input, default: 0, description: "Meter hours (used units); 0 for NEW", constraints: ">= 0" }
      - { name: acquired_from_tradein_id, type: string, source: system, description: "FK -> TradeIn.id; set when this used Unit was minted from an accepted trade-in (self-referential lineage via TradeIn). null for purchased inventory" }
      - { name: floor_planned, type: boolean, source: computed, default: false, description: "true while an ACTIVE FloorPlanNote references this Unit" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RESERVED | SOLD | LEASED | AUCTION_LISTED | AUCTION_SOLD | REPOSSESSED | RETIRED", constraints: "AVAILABLE,RESERVED,SOLD,LEASED,AUCTION_LISTED,AUCTION_SOLD,REPOSSESSED,RETIRED" }

  # --- Floor-plan financing note on inventory -------------------------------
  - name: FloorPlanNote
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the inventory unit this note finances" }
      - { name: principal_cents, type: integer, source: input, description: "Amount advanced by the floor-plan lender in cents", constraints: "> 0" }
      - { name: annual_rate_bps, type: integer, source: input, description: "Annual interest rate in basis points (e.g. 875 = 8.75%)", constraints: "> 0" }
      - { name: curtailment_paid_cents, type: integer, source: computed, default: 0, description: "Cumulative principal curtailment payments applied" }
      - { name: interest_accrued_cents, type: integer, source: computed, default: 0, description: "Interest accrued to as_of clock per chosen accrual method" }
      - { name: days_outstanding, type: integer, source: computed, default: 0, description: "Whole days between activated_on and current clock (inclusive of start, exclusive of end)" }
      - { name: activated_on, type: datetime, source: system, description: "Clock time the note moved DRAFT->ACTIVE; accrual anchor" }
      - { name: curtailment_stage, type: integer, source: computed, default: 0, description: "0/1/2/3 — number of curtailment breakpoints (90/180/270 days) passed" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CURTAILMENT_DUE | PAID_OFF | DEFAULTED", constraints: "DRAFT,ACTIVE,CURTAILMENT_DUE,PAID_OFF,DEFAULTED" }

  # --- Customer ------------------------------------------------------------
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer or farm name" }
      - { name: customer_type, type: enum, source: input, description: "RETAIL | COMMERCIAL_AG | GOVERNMENT" }
      - { name: credit_tier, type: enum, source: input, default: "STANDARD", description: "PRIME | STANDARD | SUBPRIME — drives lease residual & rate band" }
      - { name: tax_exempt, type: boolean, source: input, default: false, description: "true for qualifying agricultural/government buyers" }

  # --- Trade-in appraisal --------------------------------------------------
  - name: TradeIn
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner offering the trade" }
      - { name: model_code, type: string, source: input, description: "Trade unit model code" }
      - { name: serial_number, type: string, source: input, description: "Trade unit serial" }
      - { name: engine_hours, type: integer, source: input, description: "Meter hours on trade unit", constraints: ">= 0" }
      - { name: appraised_value_cents, type: integer, source: computed, default: 0, description: "Appraised allowance after condition & hours adjustment (see calc trade_in_appraisal)" }
      - { name: condition_grade, type: enum, source: input, description: "EXCELLENT | GOOD | FAIR | POOR — appraisal grade input" }
      - { name: base_value_cents, type: integer, source: input, description: "Guide-book base value before adjustments in cents", constraints: "> 0" }
      - { name: minted_unit_id, type: string, source: system, description: "FK -> Unit.id; the used Unit created when this trade is ACCEPTED into inventory. null until accepted" }
      - { name: status, type: enum, source: system, description: "APPRAISED | OFFERED | ACCEPTED | DECLINED", constraints: "APPRAISED,OFFERED,ACCEPTED,DECLINED" }

  # --- Deal (sale / lease / auction sale) ----------------------------------
  - name: Deal
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the unit being sold or leased" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the buyer/lessee" }
      - { name: deal_type, type: enum, source: input, description: "SALE | LEASE | AUCTION_SALE" }
      - { name: sale_price_cents, type: integer, source: input, description: "Agreed price (SALE/AUCTION_SALE) or capitalized cost (LEASE) in cents", constraints: "> 0" }
      - { name: lease_term_months, type: integer, source: input, default: 0, description: "Lease term; 0 for SALE/AUCTION_SALE", constraints: ">= 0" }
      - { name: tradein_id, type: string, source: input, description: "FK -> TradeIn.id; optional trade applied to this deal. null when no trade" }
      - { name: trade_allowance_cents, type: integer, source: computed, default: 0, description: "Trade allowance netted into the deal (= linked TradeIn.appraised_value_cents at funding, else 0)" }
      - { name: tax_cents, type: integer, source: computed, default: 0, description: "Sales tax computed at funding (0 if customer tax_exempt)" }
      - { name: monthly_payment_cents, type: integer, source: computed, default: 0, description: "Lease monthly payment (LEASE only; 0 otherwise)" }
      - { name: amount_due_cents, type: integer, source: computed, default: 0, description: "Net cash due from customer at funding (SALE/AUCTION_SALE) per calc deal_amount_due" }
      - { name: status, type: enum, source: system, description: "QUOTED | APPROVED | FUNDED | DELIVERED | UNWOUND", constraints: "QUOTED,APPROVED,FUNDED,DELIVERED,UNWOUND" }

  # --- Auction listing for used equipment ----------------------------------
  - name: AuctionLot
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the used unit consigned to auction" }
      - { name: reserve_price_cents, type: integer, source: input, description: "Minimum acceptable hammer price in cents", constraints: "> 0" }
      - { name: opens_at, type: datetime, source: input, description: "Bidding window open (clock time)" }
      - { name: closes_at, type: datetime, source: input, description: "Bidding window close (clock time)", constraints: "must be strictly after opens_at" }
      - { name: high_bid_cents, type: integer, source: computed, default: 0, description: "Highest bid received so far in cents" }
      - { name: high_bidder_customer_id, type: string, source: computed, description: "FK -> Customer.id; current high bidder. null until first bid" }
      - { name: winning_deal_id, type: string, source: system, description: "FK -> Deal.id; AUCTION_SALE deal created at settlement. null until settled won" }
      - { name: status, type: enum, source: system, description: "DRAFT | LIVE | CLOSED_MET | CLOSED_NO_SALE | SETTLED", constraints: "DRAFT,LIVE,CLOSED_MET,CLOSED_NO_SALE,SETTLED" }

  # --- Bid (append-only on a lot) ------------------------------------------
  - name: Bid
    parent: null
    common_fields: false
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> AuctionLot.id; the lot bid upon" }
      - { name: bidder_customer_id, type: string, source: input, description: "FK -> Customer.id; the bidding customer" }
      - { name: amount_cents, type: integer, source: input, description: "Bid amount in cents", constraints: "> 0" }

  # --- Service work order ---------------------------------------------------
  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the unit being serviced" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; bill-to customer" }
      - { name: complaint, type: string, source: input, description: "Reported issue" }
      - { name: labor_rate_cents, type: integer, source: input, description: "Hourly door rate in cents", constraints: "> 0" }
      - { name: flat_rate_hours, type: number, source: input, description: "Published flat-rate (book) hours for the job", constraints: ">= 0" }
      - { name: actual_hours, type: number, source: input, default: 0, description: "Technician clocked hours (set when work performed)", constraints: ">= 0" }
      - { name: warranty_claim_id, type: string, source: input, description: "FK -> WarrantyClaim.id; set when labor/parts are billed to a warranty/PIP/recall claim rather than the customer. null for customer-pay" }
      - { name: labor_charge_cents, type: integer, source: computed, default: 0, description: "Labor charge per calc labor_charge (flat-rate estimate at QUOTED, actual at CLOSED)" }
      - { name: parts_charge_cents, type: integer, source: computed, default: 0, description: "Sum of PartLine.extended_cents on this work order" }
      - { name: total_charge_cents, type: integer, source: computed, default: 0, description: "labor_charge_cents + parts_charge_cents" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_PROGRESS | AWAITING_PARTS | CLOSED | VOID", constraints: "OPEN,IN_PROGRESS,AWAITING_PARTS,CLOSED,VOID" }

  # --- Part line on a work order (parts & precision-ag) --------------------
  - name: PartLine
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; owning work order" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; catalog part consumed" }
      - { name: quantity, type: integer, source: input, description: "Units of this part", constraints: "> 0" }
      - { name: unit_price_cents, type: integer, source: computed, default: 0, description: "Snapshot of Part.unit_price_cents at line creation" }
      - { name: extended_cents, type: integer, source: computed, default: 0, description: "= quantity * unit_price_cents" }

  # --- Parts catalog (incl. precision-ag/telematics SKUs) -----------------
  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock keeping unit, unique", constraints: "unique across all Parts" }
      - { name: description, type: string, source: input, description: "Part description" }
      - { name: category, type: enum, source: input, description: "MECHANICAL | FILTER | PRECISION_AG | TELEMATICS" }
      - { name: unit_price_cents, type: integer, source: input, description: "Current sell price per unit in cents", constraints: "> 0" }
      - { name: on_hand_qty, type: integer, source: input, default: 0, description: "Current stock count", constraints: ">= 0" }
      - { name: reserved_qty, type: integer, source: computed, default: 0, description: "Quantity committed to OPEN/IN_PROGRESS/AWAITING_PARTS work orders via PartLines" }

  # --- Warranty / PIP / recall claim ---------------------------------------
  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; the unit the claim covers" }
      - { name: claim_type, type: enum, source: input, description: "WARRANTY | PIP | RECALL — PIP=Product Improvement Program, RECALL=safety campaign" }
      - { name: campaign_code, type: string, source: input, description: "PIP/recall campaign code; null for plain WARRANTY", default: null }
      - { name: claimed_cents, type: integer, source: computed, default: 0, description: "Reimbursement claimed = sum of linked WorkOrder.total_charge_cents at submission" }
      - { name: approved_cents, type: integer, source: computed, default: 0, description: "Reimbursement approved per calc warranty_reimbursement" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | PARTIAL | DENIED | PAID", constraints: "DRAFT,SUBMITTED,APPROVED,PARTIAL,DENIED,PAID" }

  # --- Seasonal whole-goods pre-order --------------------------------------
  - name: WholeGoodsOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; ordering customer" }
      - { name: model_code, type: string, source: input, description: "Model ordered (not yet in inventory)" }
      - { name: season_program, type: enum, source: input, description: "EARLY_ORDER | IN_SEASON | LATE — drives discount band" }
      - { name: quantity, type: integer, source: input, description: "Units ordered", constraints: "> 0" }
      - { name: unit_msrp_cents, type: integer, source: input, description: "Per-unit MSRP in cents", constraints: "> 0" }
      - { name: deposit_cents, type: integer, source: computed, default: 0, description: "Required deposit per calc whole_goods_deposit" }
      - { name: net_price_cents, type: integer, source: computed, default: 0, description: "Discounted per-unit price after season program (see calc whole_goods_deposit)" }
      - { name: fulfilled_qty, type: integer, source: computed, default: 0, description: "Units fulfilled via allocated Units so far" }
      - { name: status, type: enum, source: system, description: "PLACED | CONFIRMED | PARTIAL_FULFILLED | FULFILLED | CANCELLED", constraints: "PLACED,CONFIRMED,PARTIAL_FULFILLED,FULFILLED,CANCELLED" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  # ---- Unit: branching + cyclic (repossession reopens a sold unit) --------
  - entity: Unit
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /deals (deal_type SALE or LEASE referencing this unit) OR POST /whole-goods-orders/{id}/allocate"
        actor: SalesRep
        preconditions:
          - "unit.status == AVAILABLE"
        side_effects:
          - "Unit reserved against the QUOTED deal so no other deal/auction can claim it"

      - from: RESERVED
        to: SOLD
        trigger: "POST /deals/{id}/fund (deal_type == SALE)"
        actor: FinanceManager
        preconditions:
          - "deal.status == APPROVED"
          - "deal.deal_type == SALE"
        side_effects:
          - "If unit is floor_planned, the ACTIVE FloorPlanNote is paid off (FloorPlanNote ACTIVE/CURTAILMENT_DUE -> PAID_OFF), which clears unit.floor_planned"
          - "If deal.tradein_id set, linked TradeIn OFFERED -> ACCEPTED, minting a new used Unit (status AVAILABLE)"
          - "increments Unit.version by 1"

      - from: RESERVED
        to: LEASED
        trigger: "POST /deals/{id}/fund (deal_type == LEASE)"
        actor: FinanceManager
        preconditions:
          - "deal.status == APPROVED"
          - "deal.deal_type == LEASE"
        side_effects:
          - "If unit is floor_planned, the ACTIVE FloorPlanNote is paid off (-> PAID_OFF), clearing unit.floor_planned"
          - "If deal.tradein_id set, linked TradeIn OFFERED -> ACCEPTED, minting a new used Unit"
          - "increments Unit.version by 1"

      - from: AVAILABLE
        to: AUCTION_LISTED
        trigger: "POST /auction-lots (referencing this unit)"
        actor: AuctionClerk
        preconditions:
          - "unit.status == AVAILABLE"
          - "unit.condition == USED"
        side_effects:
          - "Unit locked from sale/lease deals while listed"
          - "increments Unit.version by 1"

      - from: AUCTION_LISTED
        to: AVAILABLE
        trigger: "POST /auction-lots/{id}/settle (no sale: high_bid below reserve or no bids)"
        actor: AuctionClerk
        preconditions:
          - "lot.status == CLOSED_NO_SALE"
        side_effects:
          - "Unit released back to sellable inventory"
          - "increments Unit.version by 1"

      - from: AUCTION_LISTED
        to: AUCTION_SOLD
        trigger: "POST /auction-lots/{id}/settle (reserve met)"
        actor: AuctionClerk
        preconditions:
          - "lot.status == CLOSED_MET"
        side_effects:
          - "Creates an AUCTION_SALE Deal (status FUNDED) for the high bidder at high_bid_cents"
          - "If unit floor_planned, ACTIVE FloorPlanNote -> PAID_OFF, clearing unit.floor_planned"
          - "increments Unit.version by 1"

      - from: SOLD
        to: REPOSSESSED
        trigger: "POST /deals/{id}/unwind"
        actor: FinanceManager
        preconditions:
          - "deal.status == FUNDED"
          - "deal.deal_type == SALE"
        side_effects:
          - "Deal FUNDED -> UNWOUND; tax/trade reversed; if deal had a trade-in, the minted Unit is RETIRED and TradeIn ACCEPTED -> DECLINED"
          - "increments Unit.version by 1"

      - from: REPOSSESSED
        to: AVAILABLE
        trigger: "POST /units/{id}/recondition"
        actor: DealerAdmin
        preconditions:
          - "unit.status == REPOSSESSED"
        side_effects:
          - "Unit returns to sellable inventory (cyclic: AVAILABLE -> SOLD -> REPOSSESSED -> AVAILABLE)"
          - "increments Unit.version by 1"

      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /units/{id}/retire"
        actor: DealerAdmin
        preconditions:
          - "unit.status == AVAILABLE"
          - "unit.floor_planned == false"
        side_effects:
          - "Unit permanently removed from inventory"

  # ---- FloorPlanNote: linear with threshold-driven auto-transition --------
  - entity: FloorPlanNote
    initial_state: DRAFT
    terminal_states: [PAID_OFF, DEFAULTED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /floor-plan-notes/{id}/activate"
        actor: FinanceManager
        preconditions:
          - "referenced Unit.status == AVAILABLE"
          - "referenced Unit has no other ACTIVE/CURTAILMENT_DUE FloorPlanNote"
        side_effects:
          - "Sets activated_on = current clock; sets Unit.floor_planned = true"

      - from: ACTIVE
        to: CURTAILMENT_DUE
        trigger: "system (during POST /_clock/set_current_utc or POST /floor-plan-notes/{id}/recompute when days_outstanding crosses a 90/180/270 breakpoint and that stage's curtailment is unpaid)"
        actor: system
        preconditions:
          - "curtailment_stage increased since last recompute and the new stage's curtailment_paid shortfall > 0"
        side_effects:
          - "Recomputes interest_accrued_cents and curtailment_stage"

      - from: CURTAILMENT_DUE
        to: ACTIVE
        trigger: "POST /floor-plan-notes/{id}/curtail"
        actor: FinanceManager
        preconditions:
          - "payment_cents >= required curtailment for current stage (see calc curtailment_schedule)"
        side_effects:
          - "Adds payment to curtailment_paid_cents; if all due stages satisfied, returns to ACTIVE"

      - from: ACTIVE
        to: PAID_OFF
        trigger: "system (cascade from POST /deals/{id}/fund or POST /auction-lots/{id}/settle when the financed unit is sold)"
        actor: system
        preconditions:
          - "linked Unit transitions to SOLD/LEASED/AUCTION_SOLD"
        side_effects:
          - "Final interest_accrued_cents frozen; Unit.floor_planned = false"

      - from: CURTAILMENT_DUE
        to: PAID_OFF
        trigger: "system (cascade from POST /deals/{id}/fund or POST /auction-lots/{id}/settle)"
        actor: system
        preconditions:
          - "linked Unit transitions to SOLD/LEASED/AUCTION_SOLD"
        side_effects:
          - "Final interest_accrued_cents frozen; Unit.floor_planned = false"

      - from: CURTAILMENT_DUE
        to: DEFAULTED
        trigger: "POST /floor-plan-notes/{id}/default"
        actor: DealerAdmin
        preconditions:
          - "note.status == CURTAILMENT_DUE"
        side_effects:
          - "Note flagged DEFAULTED; Unit.floor_planned stays true (lender holds title)"

  # ---- TradeIn: branching appraisal lifecycle -----------------------------
  - entity: TradeIn
    initial_state: APPRAISED
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: APPRAISED
        to: OFFERED
        trigger: "POST /trade-ins/{id}/offer"
        actor: SalesRep
        preconditions:
          - "tradein.status == APPRAISED"
        side_effects:
          - "Trade allowance made available to attach to a Deal"

      - from: OFFERED
        to: ACCEPTED
        trigger: "system (cascade from POST /deals/{id}/fund when deal.tradein_id == this trade)"
        actor: system
        preconditions:
          - "owning Deal funded"
        side_effects:
          - "Mints a new used Unit (condition USED, status AVAILABLE, dealer_cost_cents = appraised_value_cents); sets minted_unit_id and Unit.acquired_from_tradein_id"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /trade-ins/{id}/decline"
        actor: SalesRep
        preconditions:
          - "tradein.status == OFFERED"
        side_effects:
          - "Trade no longer attachable; any Deal still referencing it must drop the trade before funding"

      - from: ACCEPTED
        to: DECLINED
        trigger: "system (cascade from POST /deals/{id}/unwind when the deal that accepted this trade is unwound)"
        actor: system
        preconditions:
          - "owning Deal unwound"
        side_effects:
          - "minted Unit RETIRED; trade reverted to DECLINED"

  # ---- Deal: branching (SALE | LEASE | AUCTION_SALE) ----------------------
  - entity: Deal
    initial_state: QUOTED
    terminal_states: [DELIVERED, UNWOUND]
    transitions:
      - from: QUOTED
        to: APPROVED
        trigger: "POST /deals/{id}/approve"
        actor: FinanceManager
        preconditions:
          - "deal.status == QUOTED"
          - "if deal.tradein_id set, linked TradeIn.status == OFFERED"
        side_effects:
          - "Credit decision recorded; deal eligible to fund"

      - from: APPROVED
        to: FUNDED
        trigger: "POST /deals/{id}/fund"
        actor: FinanceManager
        preconditions:
          - "deal.status == APPROVED"
          - "referenced Unit.status == RESERVED"
          - "if deal.tradein_id set, linked TradeIn.status == OFFERED"
        side_effects:
          - "Computes tax_cents, trade_allowance_cents, amount_due_cents (SALE/AUCTION_SALE) or monthly_payment_cents (LEASE)"
          - "Unit RESERVED -> SOLD (SALE) or LEASED (LEASE)"
          - "If unit floor_planned, ACTIVE/CURTAILMENT_DUE FloorPlanNote -> PAID_OFF (cascade)"
          - "If deal.tradein_id set, TradeIn OFFERED -> ACCEPTED, minting a used Unit (cascade)"
          - "increments Deal.version by 1"

      - from: FUNDED
        to: DELIVERED
        trigger: "POST /deals/{id}/deliver"
        actor: SalesRep
        preconditions:
          - "deal.status == FUNDED"
        side_effects:
          - "Deal closed; unit physically delivered"

      - from: FUNDED
        to: UNWOUND
        trigger: "POST /deals/{id}/unwind"
        actor: FinanceManager
        preconditions:
          - "deal.status == FUNDED"
          - "deal.deal_type == SALE"
        side_effects:
          - "Reverses tax_cents and trade_allowance_cents to 0; Unit SOLD -> REPOSSESSED (cascade)"
          - "If deal had a trade-in, minted Unit RETIRED and TradeIn ACCEPTED -> DECLINED (cascade)"
          - "increments Deal.version by 1"
        note: "Compensating action: net dealer cash position must return to pre-funding value"

  # ---- AuctionLot: branching settlement -----------------------------------
  - entity: AuctionLot
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: LIVE
        trigger: "POST /auction-lots/{id}/open"
        actor: AuctionClerk
        preconditions:
          - "lot.status == DRAFT"
          - "current clock >= opens_at"
        side_effects:
          - "Bidding accepted until closes_at"

      - from: LIVE
        to: CLOSED_MET
        trigger: "POST /auction-lots/{id}/close"
        actor: AuctionClerk
        preconditions:
          - "current clock >= closes_at"
          - "high_bid_cents >= reserve_price_cents"
        side_effects:
          - "Bidding frozen; reserve met, awaiting settlement"

      - from: LIVE
        to: CLOSED_NO_SALE
        trigger: "POST /auction-lots/{id}/close"
        actor: AuctionClerk
        preconditions:
          - "current clock >= closes_at"
          - "high_bid_cents < reserve_price_cents OR no bids"
        side_effects:
          - "Bidding frozen; reserve not met"

      - from: CLOSED_MET
        to: SETTLED
        trigger: "POST /auction-lots/{id}/settle"
        actor: AuctionClerk
        preconditions:
          - "lot.status == CLOSED_MET"
        side_effects:
          - "Creates AUCTION_SALE Deal (FUNDED) for high bidder at high_bid_cents; Unit AUCTION_LISTED -> AUCTION_SOLD; floor-plan cascade payoff if applicable; sets winning_deal_id"

      - from: CLOSED_NO_SALE
        to: SETTLED
        trigger: "POST /auction-lots/{id}/settle"
        actor: AuctionClerk
        preconditions:
          - "lot.status == CLOSED_NO_SALE"
        side_effects:
          - "No deal created; Unit AUCTION_LISTED -> AVAILABLE (cascade)"

  # ---- WorkOrder: branching with parts-hold loop --------------------------
  - entity: WorkOrder
    initial_state: OPEN
    terminal_states: [CLOSED, VOID]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/start"
        actor: ServiceAdvisor
        preconditions:
          - "wo.status == OPEN"
        side_effects:
          - "Technician assigned; labor_charge_cents reflects flat-rate estimate"

      - from: IN_PROGRESS
        to: AWAITING_PARTS
        trigger: "POST /work-orders/{id}/hold-for-parts"
        actor: ServiceAdvisor
        preconditions:
          - "wo.status == IN_PROGRESS"
          - "at least one PartLine references a Part with on_hand_qty - reserved_qty < line quantity"
        side_effects:
          - "Work paused pending part availability"

      - from: AWAITING_PARTS
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/resume"
        actor: ServiceAdvisor
        preconditions:
          - "wo.status == AWAITING_PARTS"
        side_effects:
          - "Parts received; work resumes (cyclic IN_PROGRESS <-> AWAITING_PARTS)"

      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /work-orders/{id}/close"
        actor: ServiceAdvisor
        preconditions:
          - "wo.status == IN_PROGRESS"
          - "actual_hours > 0"
        side_effects:
          - "labor_charge_cents recomputed from actual_hours; parts decremented from Part.on_hand_qty and reserved_qty released; total_charge_cents frozen"

      - from: OPEN
        to: VOID
        trigger: "POST /work-orders/{id}/void"
        actor: ServiceAdvisor
        preconditions:
          - "wo.status == OPEN"
        side_effects:
          - "Reserved parts released back to availability; no charges posted"

  # ---- WarrantyClaim: branching adjudication ------------------------------
  - entity: WarrantyClaim
    initial_state: DRAFT
    terminal_states: [PAID, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /warranty-claims/{id}/submit"
        actor: ServiceAdvisor
        preconditions:
          - "claim.status == DRAFT"
          - "at least one CLOSED WorkOrder references this claim"
        side_effects:
          - "Freezes claimed_cents = sum of linked CLOSED WorkOrder.total_charge_cents"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/adjudicate (decision FULL)"
        actor: DealerAdmin
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "approved_cents set per calc warranty_reimbursement (full)"

      - from: SUBMITTED
        to: PARTIAL
        trigger: "POST /warranty-claims/{id}/adjudicate (decision PARTIAL)"
        actor: DealerAdmin
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "approved_cents set per calc warranty_reimbursement (partial, capped)"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/adjudicate (decision DENY)"
        actor: DealerAdmin
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "approved_cents = 0"

      - from: APPROVED
        to: PAID
        trigger: "POST /warranty-claims/{id}/pay"
        actor: DealerAdmin
        preconditions:
          - "claim.status == APPROVED"
        side_effects:
          - "Reimbursement disbursed"

      - from: PARTIAL
        to: PAID
        trigger: "POST /warranty-claims/{id}/pay"
        actor: DealerAdmin
        preconditions:
          - "claim.status == PARTIAL"
        side_effects:
          - "Reimbursement disbursed"

  # ---- WholeGoodsOrder: linear with partial-fulfillment loop --------------
  - entity: WholeGoodsOrder
    initial_state: PLACED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PLACED
        to: CONFIRMED
        trigger: "POST /whole-goods-orders/{id}/confirm"
        actor: SalesRep
        preconditions:
          - "order.status == PLACED"
          - "deposit recorded (deposit_cents computed)"
        side_effects:
          - "Order locked into the season program; deposit committed"

      - from: CONFIRMED
        to: PARTIAL_FULFILLED
        trigger: "POST /whole-goods-orders/{id}/allocate (fulfilled_qty < quantity after allocation)"
        actor: SalesRep
        preconditions:
          - "order.status in {CONFIRMED, PARTIAL_FULFILLED}"
          - "an AVAILABLE Unit with matching model_code exists"
        side_effects:
          - "Increments fulfilled_qty by 1; referenced Unit AVAILABLE -> RESERVED"

      - from: PARTIAL_FULFILLED
        to: FULFILLED
        trigger: "POST /whole-goods-orders/{id}/allocate (fulfilled_qty reaches quantity)"
        actor: SalesRep
        preconditions:
          - "order.status == PARTIAL_FULFILLED"
          - "an AVAILABLE Unit with matching model_code exists"
        side_effects:
          - "Increments fulfilled_qty to quantity; order complete"

      - from: CONFIRMED
        to: FULFILLED
        trigger: "POST /whole-goods-orders/{id}/allocate (quantity == 1, fulfilled in one step)"
        actor: SalesRep
        preconditions:
          - "order.status == CONFIRMED"
          - "quantity == 1"
          - "an AVAILABLE Unit with matching model_code exists"
        side_effects:
          - "fulfilled_qty = 1; order complete"

      - from: PLACED
        to: CANCELLED
        trigger: "POST /whole-goods-orders/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "order.status in {PLACED, CONFIRMED}"
        side_effects:
          - "Order cancelled; any reserved Units released to AVAILABLE; deposit forfeited per program rules"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /whole-goods-orders/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "order.status in {PLACED, CONFIRMED}"
        side_effects:
          - "Order cancelled; reserved Units released; deposit forfeited"

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: deal-fund-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /deals/{id}/fund"
    occ_field: "expected_unit_version"
    description: |
      Funding a Deal against a Unit whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer
      has already moved the unit out of RESERVED (e.g. an auction listing or a
      competing deal funding legitimately superseded the client's view), so the
      funding request carries a stale unit version.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

  - rule_id: auction-settle-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /auction-lots/{id}/settle"
    occ_field: "expected_unit_version"
    description: |
      Settling an AuctionLot against a Unit whose version has advanced since the
      client last read it is rejected. Captures the case where the unit was
      reconditioned, retired, or claimed by another path between the clerk's read
      and settlement, making the settlement view stale.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  # 1) Flat-rate labor — dual-variant (estimated flat-rate vs actual hours) ---
  - name: labor_charge
    trigger: "WorkOrder.start (estimate) and WorkOrder.close (final)"
    algorithm: dual_variant
    formula: |
      base = labor_rate_cents
      estimate_charge = round_half_up(flat_rate_hours * base)        # at start / QUOTED
      final_charge    = round_half_up(actual_hours    * base)        # at close
      labor_charge_cents = estimate_charge while IN_PROGRESS,
                           final_charge once CLOSED
    input_set: "single WorkOrder; flat_rate_hours from book, actual_hours from technician"
    constants: {}
    precision: "integer cents, round_half_up on the product before truncation to cents"
    variants:
      - name: flat_rate_estimate
        when: "WorkOrder OPEN/IN_PROGRESS — quoting the job"
        difference: "uses published flat_rate_hours (book time), ignores actual_hours"
      - name: actual_final
        when: "WorkOrder CLOSED — billing the job"
        difference: "uses technician actual_hours; a slow job (actual > flat) bills more, an efficient job bills less"

  # 2) Floor-plan interest accrual — dual-variant (per-day vs straight) -------
  - name: floor_plan_interest
    trigger: "FloorPlanNote recompute (clock advance) and at payoff"
    algorithm: chronological
    formula: |
      daily_rate = annual_rate_bps / 10000 / 365
      # per-day accrual on declining principal after curtailments
      outstanding = principal_cents - curtailment_paid_cents
      interest_accrued_cents = round_half_up(outstanding * daily_rate * days_outstanding)
    input_set: "single FloorPlanNote; days_outstanding = whole days [activated_on, current_clock); curtailment_paid_cents reduces base"
    constants:
      DAYS_PER_YEAR: 365
      BPS_DENOMINATOR: 10000
    precision: "integer cents, round_half_up; days_outstanding floor of elapsed days"
    variants:
      - name: declining_balance
        when: "after one or more curtailment payments"
        difference: "interest accrues on (principal - curtailment_paid), recomputed from activated_on each call"
      - name: full_principal
        when: "no curtailments paid"
        difference: "interest accrues on full principal_cents"

  # 3) Trade-in appraisal — combinatorial (>=3 inputs, non-linear) ----------
  - name: trade_in_appraisal
    trigger: "TradeIn creation (POST /trade-ins)"
    algorithm: weighted_scoring
    formula: |
      grade_factor = { EXCELLENT: 1.00, GOOD: 0.85, FAIR: 0.65, POOR: 0.40 }[condition_grade]
      # hour penalty: 1% off base per full 100 engine_hours, capped at 40%
      hour_penalty_pct = min(0.40, floor(engine_hours / 100) * 0.01)
      adjusted = base_value_cents * grade_factor * (1 - hour_penalty_pct)
      appraised_value_cents = round_half_up(adjusted)
    input_set: "single TradeIn: base_value_cents, condition_grade, engine_hours"
    constants:
      GRADE_EXCELLENT: 1.00
      GRADE_GOOD: 0.85
      GRADE_FAIR: 0.65
      GRADE_POOR: 0.40
      HOUR_PENALTY_PER_100: 0.01
      HOUR_PENALTY_CAP: 0.40
    precision: "integer cents, round_half_up after applying both factors (multiply-then-round, single rounding)"

  # 4) Deal amount due — combinatorial: circular-looking (tax keyed on net) --
  - name: deal_amount_due
    trigger: "Deal.fund (SALE / AUCTION_SALE)"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED to break the apparent circularity:
      # step 1: trade_allowance_cents = linked TradeIn.appraised_value_cents (else 0)
      # step 2: taxable_base = max(0, sale_price_cents - trade_allowance_cents)   # trade reduces taxable base
      # step 3: tax_cents = 0 if customer.tax_exempt else round_half_up(taxable_base * TAX_RATE)
      # step 4: amount_due_cents = taxable_base + tax_cents
      trade_allowance_cents = TradeIn.appraised_value_cents if tradein_id else 0
      taxable_base = max(0, sale_price_cents - trade_allowance_cents)
      tax_cents = 0 if customer.tax_exempt else round_half_up(taxable_base * TAX_RATE)
      amount_due_cents = taxable_base + tax_cents
    input_set: "single Deal + linked Customer.tax_exempt + optional linked TradeIn.appraised_value_cents"
    constants:
      TAX_RATE: 0.0725
    precision: "integer cents, round_half_up; tax computed on taxable_base AFTER trade reduction"

  # 5) Lease monthly payment — combinatorial: nested rounding order pinned ---
  - name: lease_monthly_payment
    trigger: "Deal.fund (LEASE)"
    algorithm: tiered_pricing
    formula: |
      residual_pct = { PRIME: 0.55, STANDARD: 0.50, SUBPRIME: 0.45 }[customer.credit_tier]
      cap_cost = sale_price_cents - (TradeIn.appraised_value_cents if tradein_id else 0)
      residual_cents = round_half_up(sale_price_cents * residual_pct)   # ROUND #1 (on MSRP, not cap_cost)
      depreciation = cap_cost - residual_cents
      # money factor by tier
      money_factor = { PRIME: 0.0010, STANDARD: 0.0015, SUBPRIME: 0.0022 }[customer.credit_tier]
      base_monthly = depreciation / lease_term_months                  # integer division NOT used; keep cents float
      rent_charge  = (cap_cost + residual_cents) * money_factor
      monthly_payment_cents = round_half_up(base_monthly + rent_charge) # ROUND #2 (sum-then-round, pinned)
    input_set: "single Deal + linked Customer.credit_tier + optional linked TradeIn"
    constants:
      RESIDUAL_PRIME: 0.55
      RESIDUAL_STANDARD: 0.50
      RESIDUAL_SUBPRIME: 0.45
      MF_PRIME: 0.0010
      MF_STANDARD: 0.0015
      MF_SUBPRIME: 0.0022
    precision: "round residual first (ROUND #1), then sum depreciation-per-month + rent and round once (ROUND #2). Order pinned: residual rounded before depreciation; final payment rounded after summing the two components."

  # 6) Whole-goods seasonal deposit & net price — tiered + threshold --------
  - name: whole_goods_deposit
    trigger: "WholeGoodsOrder.confirm"
    algorithm: tiered_pricing
    formula: |
      discount_pct = { EARLY_ORDER: 0.12, IN_SEASON: 0.05, LATE: 0.00 }[season_program]
      net_price_cents = round_half_up(unit_msrp_cents * (1 - discount_pct))
      order_total = net_price_cents * quantity
      # deposit: 10% of order total, but a minimum floor of 50000 cents per unit
      pct_deposit = round_half_up(order_total * DEPOSIT_PCT)
      floor_deposit = DEPOSIT_FLOOR_PER_UNIT_CENTS * quantity
      deposit_cents = max(pct_deposit, floor_deposit)
    input_set: "single WholeGoodsOrder: unit_msrp_cents, season_program, quantity"
    constants:
      DISCOUNT_EARLY: 0.12
      DISCOUNT_IN_SEASON: 0.05
      DISCOUNT_LATE: 0.00
      DEPOSIT_PCT: 0.10
      DEPOSIT_FLOOR_PER_UNIT_CENTS: 50000
    precision: "round per-unit net price first, multiply by quantity, then take max(pct_deposit, floor) — pinned order"

  # 7) Warranty reimbursement — dual-variant (full vs partial cap) ----------
  - name: warranty_reimbursement
    trigger: "WarrantyClaim.adjudicate"
    algorithm: dual_variant
    formula: |
      # labor reimbursed at warranty rate (lower than door rate); parts at cost
      claimed = claimed_cents   # frozen at submission = sum of CLOSED WorkOrder.total_charge_cents
      # PIP/RECALL reimburse 100% of claimed; plain WARRANTY caps labor at WARRANTY_LABOR_CAP_PCT
      if claim_type in {PIP, RECALL}: full_approved = claimed
      else: full_approved = round_half_up(claimed * WARRANTY_LABOR_CAP_PCT)
      approved_cents = full_approved (decision FULL)
                     | round_half_up(full_approved * PARTIAL_FACTOR) (decision PARTIAL)
                     | 0 (decision DENY)
    input_set: "single WarrantyClaim + claim_type + decision"
    constants:
      WARRANTY_LABOR_CAP_PCT: 0.90
      PARTIAL_FACTOR: 0.50
    precision: "integer cents, round_half_up"
    variants:
      - name: campaign_full
        when: "claim_type PIP or RECALL"
        difference: "reimburses 100% of claimed_cents (manufacturer-funded campaign)"
      - name: warranty_capped
        when: "claim_type WARRANTY"
        difference: "reimburses 90% of claimed_cents (warranty labor cap), then partial factor if PARTIAL"

  # 8b) Floor-plan curtailment schedule — threshold breakpoints -------------
  - name: curtailment_schedule
    trigger: "FloorPlanNote recompute (clock advance) and curtail payment validation"
    algorithm: threshold
    formula: |
      # Curtailment breakpoints at 90/180/270 whole days outstanding.
      # Each crossed breakpoint requires a cumulative 10% of principal paid.
      stage = 0
      if days_outstanding >= 90:  stage = 1
      if days_outstanding >= 180: stage = 2
      if days_outstanding >= 270: stage = 3
      required_cumulative_cents = round_half_up(principal_cents * CURTAIL_PCT_PER_STAGE * stage)
      shortfall_cents = max(0, required_cumulative_cents - curtailment_paid_cents)
      # CURTAILMENT_DUE iff shortfall_cents > 0
    input_set: "single FloorPlanNote; days_outstanding inclusive of the breakpoint day (>= is the boundary)"
    constants:
      CURTAIL_DAY_STAGE1: 90
      CURTAIL_DAY_STAGE2: 180
      CURTAIL_DAY_STAGE3: 270
      CURTAIL_PCT_PER_STAGE: 0.10
    precision: "integer cents, round_half_up; boundary uses >= (exactly 90 days triggers stage 1)"

  # 8) Parts availability — aggregation with reservation ---------------------
  - name: parts_availability
    trigger: "PartLine creation / WorkOrder close / void"
    algorithm: aggregation
    formula: |
      reserved_qty = sum(PartLine.quantity
                         for PartLine.part_id == this.id
                         where owning WorkOrder.status in {OPEN, IN_PROGRESS, AWAITING_PARTS})
      available_qty = on_hand_qty - reserved_qty
    input_set: "all PartLines for a Part filtered by owning WorkOrder status in {OPEN, IN_PROGRESS, AWAITING_PARTS}"
    constants: {}
    precision: "integer quantities"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for the endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path/body-referenced resources (unit_id, deal_id, lot_id, work_order_id, customer_id, part_id, tradein_id, claim_id) exist; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "Required input fields present and well-typed; enums within declared sets; numeric constraints (e.g. quantity > 0, sale_price_cents > 0) honored"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all"

  - priority: 5
    category: business_constraint
    check: "Unit.stock_number and Unit.serial_number unique; Part.sku unique"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /units, POST /parts, POST /trade-ins/{id}/* (minting)"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "OCC: expected_unit_version matches current Unit.version on fund/settle"
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412
    applies_to: "POST /deals/{id}/fund, POST /auction-lots/{id}/settle"

  - priority: 8
    category: business_referential
    check: "Cross-entity precondition: Deal.fund requires referenced Unit.status == RESERVED; if tradein_id set, TradeIn.status == OFFERED"
    error_id: ERR_UNIT_NOT_RESERVABLE
    http_status: 409
    applies_to: "POST /deals/{id}/fund, POST /deals"

  - priority: 9
    category: business_referential
    check: "Trade attach: a Deal may reference a TradeIn only while that TradeIn.status in {OFFERED}; a DECLINED/ACCEPTED trade cannot be (re)attached"
    error_id: ERR_TRADEIN_NOT_OFFERED
    http_status: 409
    applies_to: "POST /deals, POST /deals/{id}/approve, POST /deals/{id}/fund"

  - priority: 10
    category: business_safety
    check: "RECALL claim adjudication: a RECALL WarrantyClaim cannot be DENIED (safety campaign must be honored); decision DENY on claim_type RECALL is rejected"
    error_id: ERR_RECALL_CANNOT_DENY
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/adjudicate"

  - priority: 11
    category: business_temporal
    check: "AuctionLot opens_at strictly before closes_at; open only when clock >= opens_at; close only when clock >= closes_at"
    error_id: ERR_AUCTION_WINDOW
    http_status: 409
    applies_to: "POST /auction-lots, POST /auction-lots/{id}/open, POST /auction-lots/{id}/close"

  - priority: 12
    category: business_constraint
    check: "Bid must be strictly greater than current high_bid_cents (and >= reserve is NOT required to bid); lot must be LIVE and clock within [opens_at, closes_at)"
    error_id: ERR_BID_TOO_LOW
    http_status: 409
    applies_to: "POST /auction-lots/{id}/bids"

  - priority: 13
    category: business_constraint
    check: "Floor-plan curtailment payment must cover the shortfall for the current curtailment stage (calc curtailment_schedule)"
    error_id: ERR_CURTAILMENT_SHORT
    http_status: 409
    applies_to: "POST /floor-plan-notes/{id}/curtail"

  - priority: 14
    category: business_fiscal
    check: "Parts availability: PartLine quantity must not exceed Part.on_hand_qty - reserved_qty at close; at hold-for-parts the shortfall gates the AWAITING_PARTS transition"
    error_id: ERR_PARTS_SHORTAGE
    http_status: 409
    applies_to: "POST /work-orders/{id}/close"

  - priority: 15
    category: business_constraint
    check: "WholeGoodsOrder allocate requires an AVAILABLE Unit with matching model_code; none available -> reject"
    error_id: ERR_NO_MATCHING_UNIT
    http_status: 409
    applies_to: "POST /whole-goods-orders/{id}/allocate"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Units ----
  - { method: POST, path: "/units", description: "Create an inventory unit", roles: [DealerAdmin, SalesRep], code: 201, input: [stock_number, condition, model_code, serial_number, dealer_cost_cents, list_price_cents, "engine_hours?"], output: Unit, side_effects: ["Unit AVAILABLE"] }
  - { method: GET, path: "/units", description: "List units (filterable by status, condition, model_code, acquired_from_tradein_id)", roles: [DealerAdmin, SalesRep, ServiceAdvisor, PartsClerk, FinanceManager, AuctionClerk], code: 200, input: ["status?", "condition?", "model_code?", "acquired_from_tradein_id?", "limit?", "offset?"], output: "Unit[]", side_effects: [] }
  - { method: GET, path: "/units/{id}", description: "Get a unit", roles: [DealerAdmin, SalesRep, ServiceAdvisor, PartsClerk, FinanceManager, AuctionClerk], code: 200, input: [], output: Unit, side_effects: [] }
  - { method: POST, path: "/units/{id}/recondition", description: "Return a repossessed unit to inventory", roles: [DealerAdmin], code: 200, input: [], output: Unit, side_effects: ["REPOSSESSED -> AVAILABLE; Unit.version += 1"] }
  - { method: POST, path: "/units/{id}/retire", description: "Retire an available, non-floor-planned unit", roles: [DealerAdmin], code: 200, input: [], output: Unit, side_effects: ["AVAILABLE -> RETIRED"] }

  # ---- Floor-plan notes ----
  - { method: POST, path: "/floor-plan-notes", description: "Draft a floor-plan note on a unit", roles: [FinanceManager, DealerAdmin], code: 201, input: [unit_id, principal_cents, annual_rate_bps], output: FloorPlanNote, side_effects: ["FloorPlanNote DRAFT"] }
  - { method: GET, path: "/floor-plan-notes", description: "List floor-plan notes (filter by unit_id, status)", roles: [FinanceManager, DealerAdmin], code: 200, input: ["unit_id?", "status?", "limit?", "offset?"], output: "FloorPlanNote[]", side_effects: [] }
  - { method: GET, path: "/floor-plan-notes/{id}", description: "Get a floor-plan note (with accrued interest)", roles: [FinanceManager, DealerAdmin], code: 200, input: [], output: FloorPlanNote, side_effects: ["recomputes interest_accrued_cents, days_outstanding to current clock"] }
  - { method: POST, path: "/floor-plan-notes/{id}/activate", description: "Activate a draft note", roles: [FinanceManager, DealerAdmin], code: 200, input: [], output: FloorPlanNote, side_effects: ["DRAFT -> ACTIVE; sets activated_on; Unit.floor_planned = true"] }
  - { method: POST, path: "/floor-plan-notes/{id}/recompute", description: "Recompute accrual & curtailment stage to current clock", roles: [FinanceManager, DealerAdmin], code: 200, input: [], output: FloorPlanNote, side_effects: ["recomputes interest/curtailment_stage; ACTIVE -> CURTAILMENT_DUE if breakpoint crossed unpaid"] }
  - { method: POST, path: "/floor-plan-notes/{id}/curtail", description: "Make a curtailment payment", roles: [FinanceManager, DealerAdmin], code: 200, input: [payment_cents], output: FloorPlanNote, side_effects: ["adds to curtailment_paid_cents; CURTAILMENT_DUE -> ACTIVE if shortfall cleared"] }
  - { method: POST, path: "/floor-plan-notes/{id}/default", description: "Flag a curtailment-due note as defaulted", roles: [DealerAdmin], code: 200, input: [], output: FloorPlanNote, side_effects: ["CURTAILMENT_DUE -> DEFAULTED"] }

  # ---- Customers ----
  - { method: POST, path: "/customers", description: "Create a customer", roles: [DealerAdmin, SalesRep, FinanceManager], code: 201, input: [name, customer_type, "credit_tier?", "tax_exempt?"], output: Customer, side_effects: [] }
  - { method: GET, path: "/customers/{id}", description: "Get a customer", roles: [DealerAdmin, SalesRep, FinanceManager, ServiceAdvisor, AuctionClerk], code: 200, input: [], output: Customer, side_effects: [] }

  # ---- Trade-ins ----
  - { method: POST, path: "/trade-ins", description: "Appraise a trade-in", roles: [SalesRep, DealerAdmin], code: 201, input: [customer_id, model_code, serial_number, engine_hours, condition_grade, base_value_cents], output: TradeIn, side_effects: ["computes appraised_value_cents; status APPRAISED"] }
  - { method: GET, path: "/trade-ins", description: "List trade-ins (filter by customer_id, minted_unit_id, status)", roles: [SalesRep, DealerAdmin, FinanceManager], code: 200, input: ["customer_id?", "minted_unit_id?", "status?", "limit?", "offset?"], output: "TradeIn[]", side_effects: [] }
  - { method: GET, path: "/trade-ins/{id}", description: "Get a trade-in", roles: [SalesRep, DealerAdmin, FinanceManager], code: 200, input: [], output: TradeIn, side_effects: [] }
  - { method: POST, path: "/trade-ins/{id}/offer", description: "Offer the appraised trade to the customer", roles: [SalesRep, DealerAdmin], code: 200, input: [], output: TradeIn, side_effects: ["APPRAISED -> OFFERED"] }
  - { method: POST, path: "/trade-ins/{id}/decline", description: "Decline an offered trade", roles: [SalesRep, DealerAdmin], code: 200, input: [], output: TradeIn, side_effects: ["OFFERED -> DECLINED"] }

  # ---- Deals ----
  - { method: POST, path: "/deals", description: "Quote a deal (reserves the unit)", roles: [SalesRep, FinanceManager], code: 201, input: [unit_id, customer_id, deal_type, sale_price_cents, "lease_term_months?", "tradein_id?"], output: Deal, side_effects: ["Deal QUOTED; Unit AVAILABLE -> RESERVED (SALE/LEASE)"] }
  - { method: GET, path: "/deals", description: "List deals (filter by unit_id, customer_id, tradein_id, status)", roles: [SalesRep, FinanceManager, DealerAdmin, AuctionClerk], code: 200, input: ["unit_id?", "customer_id?", "tradein_id?", "status?", "limit?", "offset?"], output: "Deal[]", side_effects: [] }
  - { method: GET, path: "/deals/{id}", description: "Get a deal", roles: [SalesRep, FinanceManager, DealerAdmin, AuctionClerk], code: 200, input: [], output: Deal, side_effects: [] }
  - { method: POST, path: "/deals/{id}/approve", description: "Approve a quoted deal (credit decision)", roles: [FinanceManager], code: 200, input: [], output: Deal, side_effects: ["QUOTED -> APPROVED"] }
  - { method: POST, path: "/deals/{id}/fund", description: "Fund an approved deal (sells/leases the unit, runs cascades)", roles: [FinanceManager], code: 200, input: [expected_unit_version], output: Deal, side_effects: ["APPROVED -> FUNDED; computes tax/trade/amount_due or monthly_payment; Unit SOLD/LEASED; floor-plan payoff cascade; trade-in accept cascade; increments Unit.version by 1"] }
  - { method: POST, path: "/deals/{id}/deliver", description: "Deliver a funded deal", roles: [SalesRep, FinanceManager], code: 200, input: [], output: Deal, side_effects: ["FUNDED -> DELIVERED"] }
  - { method: POST, path: "/deals/{id}/unwind", description: "Unwind a funded SALE (repossess)", roles: [FinanceManager], code: 200, input: [expected_unit_version], output: Deal, side_effects: ["FUNDED -> UNWOUND; reverses tax/trade; Unit SOLD -> REPOSSESSED; trade-in/minted-unit reversal cascade; increments Unit.version by 1"] }

  # ---- Auction ----
  - { method: POST, path: "/auction-lots", description: "Consign a used unit to auction", roles: [AuctionClerk, DealerAdmin], code: 201, input: [unit_id, reserve_price_cents, opens_at, closes_at], output: AuctionLot, side_effects: ["AuctionLot DRAFT; Unit AVAILABLE -> AUCTION_LISTED"] }
  - { method: GET, path: "/auction-lots", description: "List auction lots (filter by unit_id, high_bidder_customer_id, winning_deal_id, status)", roles: [AuctionClerk, DealerAdmin, SalesRep, FinanceManager], code: 200, input: ["unit_id?", "high_bidder_customer_id?", "winning_deal_id?", "status?", "limit?", "offset?"], output: "AuctionLot[]", side_effects: [] }
  - { method: GET, path: "/auction-lots/{id}", description: "Get an auction lot", roles: [AuctionClerk, DealerAdmin, SalesRep, FinanceManager], code: 200, input: [], output: AuctionLot, side_effects: [] }
  - { method: POST, path: "/auction-lots/{id}/open", description: "Open bidding on a lot", roles: [AuctionClerk], code: 200, input: [], output: AuctionLot, side_effects: ["DRAFT -> LIVE"] }
  - { method: POST, path: "/auction-lots/{id}/bids", description: "Place a bid", roles: [AuctionClerk, SalesRep], code: 201, input: [bidder_customer_id, amount_cents], output: Bid, side_effects: ["updates high_bid_cents/high_bidder_customer_id when amount_cents strictly exceeds current high"] }
  - { method: GET, path: "/auction-lots/{id}/bids", description: "List bids on a lot", roles: [AuctionClerk, DealerAdmin], code: 200, input: ["limit?", "offset?"], output: "Bid[]", side_effects: [] }
  - { method: GET, path: "/bids", description: "List bids (filter by lot_id, bidder_customer_id)", roles: [AuctionClerk, DealerAdmin], code: 200, input: ["lot_id?", "bidder_customer_id?", "limit?", "offset?"], output: "Bid[]", side_effects: [] }
  - { method: GET, path: "/bids/{id}", description: "Get a single bid", roles: [AuctionClerk, DealerAdmin], code: 200, input: [], output: Bid, side_effects: [] }
  - { method: POST, path: "/auction-lots/{id}/close", description: "Close bidding (decides CLOSED_MET vs CLOSED_NO_SALE)", roles: [AuctionClerk], code: 200, input: [], output: AuctionLot, side_effects: ["LIVE -> CLOSED_MET or CLOSED_NO_SALE"] }
  - { method: POST, path: "/auction-lots/{id}/settle", description: "Settle a closed lot (create AUCTION_SALE deal or release unit)", roles: [AuctionClerk], code: 200, input: [expected_unit_version], output: AuctionLot, side_effects: ["CLOSED_MET -> SETTLED (creates AUCTION_SALE Deal FUNDED, Unit -> AUCTION_SOLD, floor-plan payoff); CLOSED_NO_SALE -> SETTLED (Unit -> AVAILABLE); increments Unit.version by 1"] }

  # ---- Work orders & parts ----
  - { method: POST, path: "/parts", description: "Create a catalog part", roles: [PartsClerk, DealerAdmin], code: 201, input: [sku, description, category, unit_price_cents, "on_hand_qty?"], output: Part, side_effects: [] }
  - { method: GET, path: "/parts", description: "List parts (filter by category, sku)", roles: [PartsClerk, DealerAdmin, ServiceAdvisor], code: 200, input: ["category?", "sku?", "limit?", "offset?"], output: "Part[]", side_effects: [] }
  - { method: GET, path: "/parts/{id}", description: "Get a part (with reserved_qty)", roles: [PartsClerk, DealerAdmin, ServiceAdvisor], code: 200, input: [], output: Part, side_effects: ["recomputes reserved_qty"] }
  - { method: POST, path: "/work-orders", description: "Open a work order", roles: [ServiceAdvisor, DealerAdmin], code: 201, input: [unit_id, customer_id, complaint, labor_rate_cents, flat_rate_hours, "warranty_claim_id?"], output: WorkOrder, side_effects: ["WorkOrder OPEN"] }
  - { method: GET, path: "/work-orders", description: "List work orders (filter by unit_id, customer_id, warranty_claim_id, status)", roles: [ServiceAdvisor, DealerAdmin, FinanceManager], code: 200, input: ["unit_id?", "customer_id?", "warranty_claim_id?", "status?", "limit?", "offset?"], output: "WorkOrder[]", side_effects: [] }
  - { method: GET, path: "/work-orders/{id}", description: "Get a work order", roles: [ServiceAdvisor, DealerAdmin, FinanceManager], code: 200, input: [], output: WorkOrder, side_effects: [] }
  - { method: POST, path: "/work-orders/{id}/part-lines", description: "Add a part line to a work order", roles: [ServiceAdvisor, PartsClerk], code: 201, input: [part_id, quantity], output: PartLine, side_effects: ["snapshots unit_price_cents; recomputes WorkOrder.parts_charge_cents and Part.reserved_qty"] }
  - { method: GET, path: "/work-orders/{id}/part-lines", description: "List part lines on a work order", roles: [ServiceAdvisor, PartsClerk, DealerAdmin], code: 200, input: ["limit?", "offset?"], output: "PartLine[]", side_effects: [] }
  - { method: GET, path: "/part-lines", description: "List part lines (filter by work_order_id, part_id)", roles: [ServiceAdvisor, PartsClerk, DealerAdmin], code: 200, input: ["work_order_id?", "part_id?", "limit?", "offset?"], output: "PartLine[]", side_effects: [] }
  - { method: GET, path: "/part-lines/{id}", description: "Get a single part line", roles: [ServiceAdvisor, PartsClerk, DealerAdmin], code: 200, input: [], output: PartLine, side_effects: [] }
  - { method: POST, path: "/work-orders/{id}/start", description: "Start work (estimate labor)", roles: [ServiceAdvisor], code: 200, input: [], output: WorkOrder, side_effects: ["OPEN -> IN_PROGRESS; labor_charge_cents = flat-rate estimate"] }
  - { method: POST, path: "/work-orders/{id}/hold-for-parts", description: "Hold a work order awaiting parts", roles: [ServiceAdvisor], code: 200, input: [], output: WorkOrder, side_effects: ["IN_PROGRESS -> AWAITING_PARTS"] }
  - { method: POST, path: "/work-orders/{id}/resume", description: "Resume a held work order", roles: [ServiceAdvisor], code: 200, input: [], output: WorkOrder, side_effects: ["AWAITING_PARTS -> IN_PROGRESS"] }
  - { method: POST, path: "/work-orders/{id}/close", description: "Close a work order (bill actual hours; decrement parts)", roles: [ServiceAdvisor], code: 200, input: [actual_hours], output: WorkOrder, side_effects: ["IN_PROGRESS -> CLOSED; labor_charge from actual_hours; decrements Part.on_hand_qty; freezes total_charge_cents"] }
  - { method: POST, path: "/work-orders/{id}/void", description: "Void an open work order", roles: [ServiceAdvisor], code: 200, input: [], output: WorkOrder, side_effects: ["OPEN -> VOID; releases reserved parts"] }

  # ---- Warranty / PIP / recall ----
  - { method: POST, path: "/warranty-claims", description: "Draft a warranty/PIP/recall claim", roles: [ServiceAdvisor, DealerAdmin], code: 201, input: [unit_id, claim_type, "campaign_code?"], output: WarrantyClaim, side_effects: ["WarrantyClaim DRAFT"] }
  - { method: GET, path: "/warranty-claims", description: "List warranty claims (filter by unit_id, claim_type, status)", roles: [ServiceAdvisor, DealerAdmin, FinanceManager], code: 200, input: ["unit_id?", "claim_type?", "status?", "limit?", "offset?"], output: "WarrantyClaim[]", side_effects: [] }
  - { method: GET, path: "/warranty-claims/{id}", description: "Get a warranty claim", roles: [ServiceAdvisor, DealerAdmin, FinanceManager], code: 200, input: [], output: WarrantyClaim, side_effects: [] }
  - { method: POST, path: "/warranty-claims/{id}/submit", description: "Submit a claim (freezes claimed_cents)", roles: [ServiceAdvisor, DealerAdmin], code: 200, input: [], output: WarrantyClaim, side_effects: ["DRAFT -> SUBMITTED; claimed_cents = sum of CLOSED linked WorkOrder totals"] }
  - { method: POST, path: "/warranty-claims/{id}/adjudicate", description: "Adjudicate a submitted claim", roles: [DealerAdmin], code: 200, input: [decision], output: WarrantyClaim, side_effects: ["SUBMITTED -> APPROVED/PARTIAL/DENIED; sets approved_cents"] }
  - { method: POST, path: "/warranty-claims/{id}/pay", description: "Pay an approved/partial claim", roles: [DealerAdmin], code: 200, input: [], output: WarrantyClaim, side_effects: ["APPROVED/PARTIAL -> PAID"] }

  # ---- Whole-goods seasonal orders ----
  - { method: POST, path: "/whole-goods-orders", description: "Place a seasonal whole-goods order", roles: [SalesRep, DealerAdmin], code: 201, input: [customer_id, model_code, season_program, quantity, unit_msrp_cents], output: WholeGoodsOrder, side_effects: ["WholeGoodsOrder PLACED; computes net_price_cents"] }
  - { method: GET, path: "/whole-goods-orders", description: "List whole-goods orders (filter by customer_id, status)", roles: [SalesRep, DealerAdmin], code: 200, input: ["customer_id?", "status?", "limit?", "offset?"], output: "WholeGoodsOrder[]", side_effects: [] }
  - { method: GET, path: "/whole-goods-orders/{id}", description: "Get a whole-goods order", roles: [SalesRep, DealerAdmin], code: 200, input: [], output: WholeGoodsOrder, side_effects: [] }
  - { method: POST, path: "/whole-goods-orders/{id}/confirm", description: "Confirm an order (computes deposit)", roles: [SalesRep, DealerAdmin], code: 200, input: [], output: WholeGoodsOrder, side_effects: ["PLACED -> CONFIRMED; computes deposit_cents"] }
  - { method: POST, path: "/whole-goods-orders/{id}/allocate", description: "Allocate one matching available unit to the order", roles: [SalesRep, DealerAdmin], code: 200, input: [unit_id], output: WholeGoodsOrder, side_effects: ["CONFIRMED/PARTIAL_FULFILLED -> PARTIAL_FULFILLED/FULFILLED; Unit AVAILABLE -> RESERVED; fulfilled_qty += 1"] }
  - { method: POST, path: "/whole-goods-orders/{id}/cancel", description: "Cancel an order", roles: [SalesRep, DealerAdmin], code: 200, input: [], output: WholeGoodsOrder, side_effects: ["PLACED/CONFIRMED -> CANCELLED; releases reserved units"] }

  # ---- Test-driving clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default is 2026-01-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock. Advancing the clock triggers floor-plan accrual/curtailment recompute on ACTIVE notes.", roles: [DealerAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: datetime }", side_effects: ["sets logical clock; recomputes accrual/curtailment_stage on ACTIVE/CURTAILMENT_DUE FloorPlanNotes"] }

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers or unknown role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/ill-typed field, bad enum, or violated numeric constraint" }
  - { id: ERR_DUPLICATE_KEY, http: 409, condition: "Unit stock_number/serial_number or Part sku not unique" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_STALE_UNIT_VERSION, http: 412, condition: "expected_unit_version does not match current Unit.version on fund/settle" }
  - { id: ERR_UNIT_NOT_RESERVABLE, http: 409, condition: "Deal references a Unit not AVAILABLE (quote) or not RESERVED (fund)" }
  - { id: ERR_TRADEIN_NOT_OFFERED, http: 409, condition: "Deal references a TradeIn not in OFFERED state" }
  - { id: ERR_RECALL_CANNOT_DENY, http: 409, condition: "Adjudication DENY attempted on a RECALL claim" }
  - { id: ERR_AUCTION_WINDOW, http: 409, condition: "opens_at not before closes_at, or open/close attempted outside the clock window" }
  - { id: ERR_BID_TOO_LOW, http: 409, condition: "Bid not strictly greater than current high_bid_cents, or lot not LIVE / outside window" }
  - { id: ERR_CURTAILMENT_SHORT, http: 409, condition: "Curtailment payment below the required shortfall for the current stage" }
  - { id: ERR_PARTS_SHORTAGE, http: 409, condition: "PartLine quantity exceeds available (on_hand - reserved) at close, or hold preconditions unmet" }
  - { id: ERR_NO_MATCHING_UNIT, http: 409, condition: "No AVAILABLE Unit with matching model_code for whole-goods allocation" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: DealerAdmin
    description: "Dealer principal/administrator; superset operator with override (recondition, retire, default, adjudicate, pay)"
    identity: opaque
    exclusive_operations:
      - "POST /units/{id}/recondition"
      - "POST /units/{id}/retire"
      - "POST /floor-plan-notes/{id}/default"
      - "POST /warranty-claims/{id}/adjudicate"
      - "POST /warranty-claims/{id}/pay"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /units"
      - "POST /floor-plan-notes (+activate/recompute/curtail)"
      - "POST /trade-ins (+offer/decline)"
      - "POST /auction-lots (+lifecycle)"
      - "POST /parts, /work-orders, /warranty-claims, /whole-goods-orders reads & creates"

  - name: SalesRep
    description: "Sells units, manages trade-ins, deals (quote/deliver), whole-goods orders"
    identity: opaque
    exclusive_operations:
      - "POST /deals/{id}/deliver (with FinanceManager)"
    shared_operations:
      - "POST /units"
      - "POST /trade-ins (+offer/decline)"
      - "POST /deals (quote)"
      - "POST /whole-goods-orders (+confirm/allocate/cancel)"
      - "POST /auction-lots/{id}/bids"

  - name: FinanceManager
    description: "Owns credit/approve/fund/unwind on deals and floor-plan financing"
    identity: opaque
    exclusive_operations:
      - "POST /deals/{id}/approve"
      - "POST /deals/{id}/fund"
      - "POST /deals/{id}/unwind"
    shared_operations:
      - "POST /floor-plan-notes (+activate/recompute/curtail)"
      - "POST /customers"
      - "POST /deals (quote)"

  - name: ServiceAdvisor
    description: "Owns service work orders and warranty claim drafting/submission"
    identity: opaque
    exclusive_operations:
      - "POST /work-orders/{id}/start"
      - "POST /work-orders/{id}/hold-for-parts"
      - "POST /work-orders/{id}/resume"
      - "POST /work-orders/{id}/close"
      - "POST /work-orders/{id}/void"
    shared_operations:
      - "POST /work-orders (+part-lines)"
      - "POST /warranty-claims (+submit)"

  - name: PartsClerk
    description: "Owns parts catalog and parts inventory; adds part lines"
    identity: opaque
    exclusive_operations:
      - "POST /parts"
    shared_operations:
      - "POST /work-orders/{id}/part-lines"
      - "GET /parts, /part-lines"

  - name: AuctionClerk
    description: "Owns auction lot lifecycle (consign/open/close/settle) and bid recording"
    identity: opaque
    exclusive_operations:
      - "POST /auction-lots/{id}/open"
      - "POST /auction-lots/{id}/close"
      - "POST /auction-lots/{id}/settle"
    shared_operations:
      - "POST /auction-lots"
      - "POST /auction-lots/{id}/bids"
