  # complexity_layers: optimistic_concurrency, cascading_side_effects,
  # dual_variant_calculation, selector_policy. Every §1.2.1 concurrency rule gets
  # its own stale-version instance below; the selector_policy layer has no row in
  # the guide's table and is asserted in the calculations section instead
