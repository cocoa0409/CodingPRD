scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: baseline_ten_of_ten_vs_weather_regression
        grounds:
          - calculations.dispatch_baseline_kw
          - entities.Dispatch.fields.baseline_kw
          - entities.DispatchEvent.fields.baseline_method_snapshot
        distinguishing_aspect: "Identical 3 baseline readings (10,9,8) yield baseline_kw 9.0 under TEN_OF_TEN but 9.9 under WEATHER_REGRESSION; the divergence lives on the Dispatch/measurement domain."
        test_recipe:
          setup:
            - "Two ACTIVE programs differing only in baseline_method (TEN_OF_TEN vs WEATHER_REGRESSION); one aggregator, one customer, one device enrolled in each."
            - "Each device has three BASELINE_WINDOW readings kw_load 10,9,8 and one EVENT_WINDOW reading kw_load 4.0 for its event; both events COMPLETED with a 2-hour window."
          setup_api_calls:
            - call: "POST /dr/aggregators"
              payload: { name: "Agg", contact_email: "a@x.com" }
              as: ProgramOperator
              captures: { agg_id: $.data.id }
            - call: "POST /dr/customers"
              payload: { name: "Cust", email: "c@x.com", service_address: "1 St", utility_account_id: "UA1" }
              as: ProgramOperator
              captures: { cust_id: $.data.id }
            - call: "POST /dr/programs"
              payload: { name: "P-TEN", utility_name: "U", incentive_rate_cents_per_kwh: 50, penalty_rate_cents_per_kwh: 80, capacity_incentive_cents_per_kw: 1000, baseline_method: "TEN_OF_TEN", settlement_method: "PAY_FOR_PERFORMANCE", performance_floor_pct: 0.75, notification_lead_minutes: 60, max_events_per_season: 3, season_start_date: "2026-05-01T00:00:00Z", season_end_date: "2026-09-30T00:00:00Z" }
              as: ProgramOperator
              captures: { prog_ten_id: $.data.id }
            - call: "POST /dr/programs/${prog_ten_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /dr/programs"
              payload: { name: "P-WR", utility_name: "U", incentive_rate_cents_per_kwh: 50, penalty_rate_cents_per_kwh: 80, capacity_incentive_cents_per_kw: 1000, baseline_method: "WEATHER_REGRESSION", settlement_method: "PAY_FOR_PERFORMANCE", performance_floor_pct: 0.75, notification_lead_minutes: 60, max_events_per_season: 3, season_start_date: "2026-05-01T00:00:00Z", season_end_date: "2026-09-30T00:00:00Z" }
              as: ProgramOperator
              captures: { prog_wr_id: $.data.id }
            - call: "POST /dr/programs/${prog_wr_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /dr/devices"
              payload: { customer_id: "${cust_id}", device_type: "BATTERY", nameplate_kw: 10, capacity_kwh: 20 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { dev_ten_id: $.data.id }
            - call: "POST /dr/devices"
              payload: { customer_id: "${cust_id}", device_type: "BATTERY", nameplate_kw: 10, capacity_kwh: 20 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { dev_wr_id: $.data.id }
            - call: "POST /dr/devices/${dev_ten_id}/meter-readings"
              payload: { interval_start: "2026-05-20T14:00:00Z", interval_end: "2026-05-20T15:00:00Z", kw_load: 10, reading_type: "BASELINE_WINDOW" }
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/devices/${dev_ten_id}/meter-readings"
              payload: { interval_start: "2026-05-21T14:00:00Z", interval_end: "2026-05-21T15:00:00Z", kw_load: 9, reading_type: "BASELINE_WINDOW" }
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/devices/${dev_ten_id}/meter-readings"
              payload: { interval_start: "2026-05-22T14:00:00Z", interval_end: "2026-05-22T15:00:00Z", kw_load: 8, reading_type: "BASELINE_WINDOW" }
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/devices/${dev_wr_id}/meter-readings"
              payload: { interval_start: "2026-05-20T14:00:00Z", interval_end: "2026-05-20T15:00:00Z", kw_load: 10, reading_type: "BASELINE_WINDOW" }
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/devices/${dev_wr_id}/meter-readings"
              payload: { interval_start: "2026-05-21T14:00:00Z", interval_end: "2026-05-21T15:00:00Z", kw_load: 9, reading_type: "BASELINE_WINDOW" }
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/devices/${dev_wr_id}/meter-readings"
              payload: { interval_start: "2026-05-22T14:00:00Z", interval_end: "2026-05-22T15:00:00Z", kw_load: 8, reading_type: "BASELINE_WINDOW" }
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/enrollments"
              payload: { device_id: "${dev_ten_id}", program_id: "${prog_ten_id}", committed_kw: 5 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { enr_ten_id: $.data.id }
            - call: "POST /dr/enrollments/${enr_ten_id}/activate"
              payload: {}
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/enrollments"
              payload: { device_id: "${dev_wr_id}", program_id: "${prog_wr_id}", committed_kw: 5 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { enr_wr_id: $.data.id }
            - call: "POST /dr/enrollments/${enr_wr_id}/activate"
              payload: {}
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/dispatch-events"
              payload: { program_id: "${prog_ten_id}", window_start: "2026-06-01T14:00:00Z", window_end: "2026-06-01T16:00:00Z", target_reduction_kw: 5 }
              as: ProgramOperator
              captures: { evt_ten_id: $.data.id }
            - call: "POST /dr/dispatch-events"
              payload: { program_id: "${prog_wr_id}", window_start: "2026-06-01T14:00:00Z", window_end: "2026-06-01T16:00:00Z", target_reduction_kw: 5 }
              as: ProgramOperator
              captures: { evt_wr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramOperator
            - call: "POST /dr/dispatch-events/${evt_ten_id}/notify"
              payload: {}
              as: ProgramOperator
              as_user_id: "op1"
            - call: "POST /dr/dispatch-events/${evt_wr_id}/notify"
              payload: {}
              as: ProgramOperator
              as_user_id: "op1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T14:00:00Z" }
              as: ProgramOperator
            - call: "POST /dr/dispatch-events/${evt_ten_id}/start"
              payload: {}
              as: ProgramOperator
            - call: "POST /dr/dispatch-events/${evt_wr_id}/start"
              payload: {}
              as: ProgramOperator
            - call: "POST /dr/devices/${dev_ten_id}/meter-readings"
              payload: { interval_start: "2026-06-01T14:00:00Z", interval_end: "2026-06-01T16:00:00Z", kw_load: 4.0, reading_type: "EVENT_WINDOW", dispatch_event_id: "${evt_ten_id}" }
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/devices/${dev_wr_id}/meter-readings"
              payload: { interval_start: "2026-06-01T14:00:00Z", interval_end: "2026-06-01T16:00:00Z", kw_load: 4.0, reading_type: "EVENT_WINDOW", dispatch_event_id: "${evt_wr_id}" }
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T16:00:00Z" }
              as: ProgramOperator
          trigger:
            - call: "POST /dr/dispatch-events/${evt_ten_id}/complete"
              payload: {}
              as: ProgramOperator
            - call: "POST /dr/dispatch-events/${evt_wr_id}/complete"
              payload: {}
              as: ProgramOperator
            - call: "GET /dr/dispatch-events/${evt_ten_id}/dispatches"
              as: ProgramOperator
              captures: { disp_ten_baseline: "$.data[0].baseline_kw" }
            - call: "GET /dr/dispatch-events/${evt_wr_id}/dispatches"
              as: ProgramOperator
              captures: { disp_wr_baseline: "$.data[0].baseline_kw" }
          assert:
            - "Dispatch of evt_ten_id (TEN_OF_TEN) baseline_kw == 9.0"
            - "Dispatch of evt_wr_id (WEATHER_REGRESSION) baseline_kw == 9.9"
            - "The two baselines differ (9.0 != 9.9) though the readings are identical."

      - name: settlement_pay_for_performance_vs_capacity
        grounds:
          - calculations.settlement_net_payment
          - entities.Settlement.fields.net_payment_cents
          - entities.Program.fields.settlement_method
        distinguishing_aspect: "For one COMPLETED dispatch delivering 10 kWh at exactly committed capacity, PAY_FOR_PERFORMANCE settles net_payment_cents 500 while CAPACITY_PAYMENT settles 5000; divergence lives on the Settlement/payment domain."
        test_recipe:
          setup:
            - "Two ACTIVE programs identical except settlement_method (PAY_FOR_PERFORMANCE vs CAPACITY_PAYMENT); one device enrolled (committed_kw 5) in each; each event COMPLETED with baseline 9.0, event load 4.0 (delivered 10.0 kWh, ratio 1.0)."
