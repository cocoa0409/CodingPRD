scenario: "1867. Janitorial & Sanitation Supply Distribution (Jan/San): consumable usage forecasting by facility, dispenser placement & closed-loop chemical program, chemical dilution training & compliance documentation, standing order & auto-replenishment, price protection & contract bid (GPO/co-op), sample/trial conversion, delivery minimum & fuel surcharge, product substitution during shortage"
domain_name: janitorial-sanitation-supply-distribution
api_prefix: /jansan

complexity_profile:
  primary_archetype: Pricing engine
  secondary_archetype: Compliance / audit
  complexity_layers: [dual_variant_calculation, cascading_side_effects, optimistic_concurrency, ops_run_checkpoint]
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility display name" }
      - { name: facility_group_code, type: string, source: input, description: "GPO/co-op group code used to match awarded contract bids" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum allowed committed+outstanding exposure in cents" }
      - { name: service_zone, type: string, source: input, description: "Dispatcher zone label" }
      - { name: delivery_distance_miles, type: number, source: input, description: "One-way warehouse-to-facility miles; selects fuel surcharge distance band" }
      - { name: default_delivery_day, type: string, source: input, description: "Preferred weekly delivery weekday (informational)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | ARCHIVED", default: ACTIVE }
      - { name: committed_cents, type: integer, source: computed, description: "Sum of total_cents over this facility's Orders with status IN {PLACED, PARTIALLY_BLOCKED, DELIVERED} (all time)", default: 0 }
      - { name: outstanding_cents, type: integer, source: computed, description: "Sum of total_cents over this facility's Orders with status INVOICED (all time)", default: 0 }
      - { name: closed_loop_enrolled, type: boolean, source: computed, description: "true when the facility has >=1 Dispenser with status INSTALLED; false otherwise", default: false }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique stock-keeping unit code", constraints: "unique across all products" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: category, type: enum, source: input, description: "CHEMICAL | PAPER | EQUIPMENT | DISPENSER_SUPPLY | OTHER" }
      - { name: base_price_cents, type: integer, source: input, description: "List unit price in cents before any contract pricing" }
      - { name: unit_of_measure, type: string, source: input, description: "e.g. CASE, GAL, EACH" }
      - { name: dilution_required, type: boolean, source: input, description: "true when the chemical requires documented dilution training before order placement or dispenser install completion", default: false }
      - { name: chemical_family, type: enum, source: input, description: "ACID | ALKALINE | NEUTRAL | OXIDIZER | NONE; ACID and OXIDIZER are incompatible in the same zone", default: NONE }
      - { name: qty_on_hand, type: integer, source: input, description: "Warehouse unallocated stock; set at create, then system-adjusted by allocation/deallocation/fulfillment", constraints: ">= 0" }
      - { name: qty_allocated, type: integer, source: computed, description: "Stock reserved by OrderLines with status ALLOCATED", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SHORTAGE | DISCONTINUED", default: ACTIVE }

  - name: UsageRecord
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: period_start, type: datetime, source: input, description: "Usage window start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Usage window end (inclusive); must be >= period_start" }
      - { name: quantity_used, type: integer, source: input, description: "Units consumed in the window", constraints: ">= 1" }
      - { name: source, type: enum, source: input, description: "MANUAL | AUTO_DISPENSER" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | POSTED", default: SUBMITTED }
      - { name: posted_at, type: datetime, source: system, description: "Clock time when the record was posted; null until POSTED" }

  - name: ForecastProfile
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id", constraints: "unique together with facility_id among all ForecastProfiles" }
      - { name: horizon_days, type: integer, source: input, description: "Coverage horizon for recommended_qty", default: 30, constraints: ">= 1" }
      - { name: safety_stock, type: integer, source: input, description: "Extra units added to reorder_point", default: 0, constraints: ">= 0" }
      - { name: current_on_hand, type: integer, source: input, description: "Facility-reported on-hand units for this product", default: 0, constraints: ">= 0" }
      - { name: avg_daily_usage, type: number, source: computed, description: "From usage_forecast; 4 decimal places, round_half_up" }
      - { name: reorder_point, type: integer, source: computed, description: "ceil(avg_daily_usage * LEAD_TIME_DAYS) + safety_stock" }
      - { name: recommended_qty, type: integer, source: computed, description: "max(0, ceil(avg_daily_usage * horizon_days) - current_on_hand)" }
      - { name: replenishment_recommended, type: boolean, source: computed, description: "current_on_hand <= reorder_point (equality triggers)" }
      - { name: variant_used, type: enum, source: computed, description: "PROVISIONAL | FINAL; echoes the variant of the last recompute" }
      - { name: last_computed_at, type: datetime, source: system, description: "Clock time of last recompute; null before first recompute" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Field technician name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: ACTIVE }

  - name: Dispenser
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product must have category CHEMICAL" }
      - { name: zone, type: string, source: input, description: "Placement zone within the facility, e.g. kitchen, laundry" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; installer who owns the appointment" }
      - { name: install_start, type: datetime, source: input, description: "Install window start; half-open interval [install_start, install_end)" }
      - { name: install_end, type: datetime, source: input, description: "Install window end (exclusive); must be > install_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | INSTALLED | DECOMMISSIONED", default: SCHEDULED }
      - { name: installed_at, type: datetime, source: system, description: "Clock time of completion; null until INSTALLED" }

  - name: TrainingRecord
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; chemical the employee is trained to dilute" }
      - { name: employee_name, type: string, source: input, description: "Facility employee receiving training" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CERTIFIED | FAILED | EXPIRED", default: SCHEDULED }
      - { name: score_pct, type: integer, source: system, description: "Set at certify; CERTIFIED requires >= PASS_SCORE_PCT(80), else FAILED", constraints: "0..100" }
      - { name: certified_at, type: datetime, source: system, description: "Clock time of certification; null until CERTIFIED" }
      - { name: expires_at, type: datetime, source: system, description: "certified_at + TRAINING_VALIDITY_DAYS(365); EXPIRED only when now > expires_at" }

  - name: StandingOrder
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: items, type: array, source: input, description: "Array of {product_id, qty}; qty >= 1; at least one item" }
      - { name: frequency, type: enum, source: input, description: "WEEKLY(7d) | BIWEEKLY(14d) | MONTHLY(30d)" }
      - { name: next_run_date, type: datetime, source: input, description: "Next generation date; due when next_run_date <= now" }
      - { name: fuel_index, type: number, source: input, description: "Diesel index used to price generated orders", default: 3.00 }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | CANCELLED", default: DRAFT }
      - { name: pause_reason, type: enum, source: system, description: "NONE | MANUAL | SUSPENSION", default: NONE }
      - { name: price_protected, type: boolean, source: computed, description: "true when >=1 item product is covered by an AWARDED ContractBid matching the facility's group; recomputed on bid award/expire/terminate", default: false }
      - { name: next_delivery_total_cents, type: integer, source: computed, description: "Merchandise-only preview: sum over items of qty * effective unit price; recomputed on activate and on price-protection changes", default: 0 }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: standing_order_id, type: string, source: system, description: "FK -> StandingOrder.id; nullable; set when the order was generated by a standing order run", constraints: "null for manual orders" }
      - { name: source, type: enum, source: system, description: "MANUAL | STANDING_ORDER | TRIAL_CONVERSION", default: MANUAL }
      - { name: delivery_date, type: datetime, source: input, description: "Requested delivery date" }
      - { name: fuel_index, type: number, source: input, description: "Diesel index at order placement; basis of QUOTED fuel surcharge" }
      - { name: fuel_index_at_delivery, type: number, source: system, description: "Diesel index captured at confirm-delivery; basis of ACTUAL fuel surcharge; null until delivered" }
      - { name: merchandise_subtotal_cents, type: integer, source: computed, description: "Sum of per-line line_total_cents (per-line rounding pinned by order_line_pricing)" }
      - { name: delivery_fee_cents, type: integer, source: computed, description: "max(0, DELIVERY_MINIMUM_CENTS(5000) - merchandise_subtotal_cents)" }
      - { name: fuel_surcharge_cents, type: integer, source: computed, description: "From fuel_surcharge calc on base (merchandise_subtotal_cents + delivery_fee_cents)" }
      - { name: fuel_surcharge_variant, type: enum, source: computed, description: "QUOTED at place; ACTUAL after confirm-delivery" }
      - { name: trial_credit_cents, type: integer, source: computed, description: "Credit applied for trial conversions; 0 otherwise", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "max(0, merchandise_subtotal_cents + delivery_fee_cents + fuel_surcharge_cents - trial_credit_cents)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PLACED | PARTIALLY_BLOCKED | DELIVERED | INVOICED | CANCELLED", default: DRAFT }
      - { name: placed_at, type: datetime, source: system, description: "Clock time of placement; null until PLACED" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; set at order creation" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; swapped on substitution accept" }
      - { name: qty, type: integer, source: system, description: "Ordered units, from order create lines", constraints: ">= 1" }
      - { name: discount_pct, type: number, source: system, description: "Line discount fraction 0..1, from order create lines (default 0)" }
      - { name: unit_price_cents, type: integer, source: computed, description: "effective_unit_price(facility, product, placed clock time)" }
      - { name: line_total_cents, type: integer, source: computed, description: "round_half_up(qty * unit_price_cents * (1 - discount_pct)) to integer cents" }
      - { name: status, type: enum, source: system, description: "PENDING | ALLOCATED | SUBSTITUTION_PENDING | FULFILLED | CANCELLED", default: PENDING }

  - name: ContractBid
    parent: null
    common_fields: true
    fields:
      - { name: bid_reference, type: string, source: input, description: "External GPO/co-op bid reference", constraints: "unique across all bids" }
      - { name: facility_group_code, type: string, source: input, description: "GPO/co-op group this bid prices" }
      - { name: lines, type: array, source: input, description: "Array of {product_id, bid_price_cents}; at least one line" }
      - { name: protection_start, type: datetime, source: input, description: "Price-protection window start; CLOSED interval [protection_start, protection_end]" }
      - { name: protection_end, type: datetime, source: input, description: "Window end (inclusive); must be > protection_start" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | AWARDED | LOST | EXPIRED | TERMINATED", default: DRAFT }
      - { name: revision_number, type: integer, source: system, description: "0 at create; +1 on each return-for-revision", default: 0 }
      - { name: submitted_at, type: datetime, source: system, description: "Clock time of latest submit; null until first SUBMITTED" }

  - name: SubstitutionProposal
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; created by the shortage cascade" }
      - { name: original_product_id, type: string, source: system, description: "FK -> Product.id; product in SHORTAGE" }
      - { name: proposed_product_id, type: string, source: system, description: "FK -> Product.id; deterministic selector output" }
      - { name: price_delta_cents, type: integer, source: computed, description: "(effective price of proposed - effective price of original) * qty; negative means cheaper", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING | ACCEPTED | DECLINED | EXPIRED", default: PENDING }
      - { name: expires_at, type: datetime, source: system, description: "created_at + PROPOSAL_TTL_DAYS(7); EXPIRED only when now > expires_at" }

  - name: TrialProgram
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: trial_start, type: datetime, source: input, description: "Trial window start" }
      - { name: trial_end, type: datetime, source: input, description: "Trial window end; conversion allowed while now <= trial_end" }
      - { name: sample_value_cents, type: integer, source: input, description: "Value of free product placed for the trial; caps the conversion credit", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CONVERTED | EXPIRED", default: ACTIVE }
      - { name: conversion_order_id, type: string, source: system, description: "FK -> Order.id; nullable; set on convert" }
      - { name: conversion_credit_cents, type: integer, source: computed, description: "min(sample_value_cents, conversion order merchandise_subtotal_cents); set on convert", default: 0 }

state_machines:
  - entity: Facility
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /jansan/facilities/{facility_id}/suspend"
        actor: DistributorAdmin
        preconditions: ["facility.status == ACTIVE"]
        side_effects:
          - "Cascade down: every StandingOrder of this facility with status ACTIVE -> PAUSED with pause_reason=SUSPENSION (MANUAL-paused and DRAFT orders untouched)"
          - "increments Facility.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /jansan/facilities/{facility_id}/reinstate"
        actor: DistributorAdmin
        preconditions: ["facility.status == SUSPENDED"]
        side_effects:
          - "Conditional cascade: StandingOrders of this facility with status PAUSED AND pause_reason=SUSPENSION -> ACTIVE, pause_reason=NONE; MANUAL-paused stay PAUSED"
          - "increments Facility.version by 1"
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /jansan/facilities/{facility_id}/archive"
        actor: DistributorAdmin
        preconditions:
          - "facility.status == ACTIVE"
          - "no Order of this facility with status IN {DRAFT, PLACED, PARTIALLY_BLOCKED, DELIVERED} (else ERR_ARCHIVE_BLOCKED)"
          - "no StandingOrder of this facility with status IN {DRAFT, ACTIVE, PAUSED} (else ERR_ARCHIVE_BLOCKED)"
        side_effects: ["increments Facility.version by 1"]

  - entity: Product
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: SHORTAGE
        trigger: "POST /jansan/products/{product_id}/declare-shortage"
        actor: DistributorAdmin
        preconditions: ["product.status == ACTIVE"]
        side_effects:
          - "Cascade link 1 (Product->OrderLine): every OrderLine with product_id == this product and status IN {PENDING, ALLOCATED} is mutated: ALLOCATED lines first release their reservation (qty_allocated -= qty, qty_on_hand += qty), then status -> SUBSTITUTION_PENDING when a substitute exists, else -> CANCELLED"
          - "Substitute selector per affected line: eligibility = Product.status == ACTIVE AND category == original category AND id != original product; ranking = lowest base_price_cents; tie-break = earliest created_at ASC; empty candidate set => line goes CANCELLED (no proposal created)"
          - "For each line entering SUBSTITUTION_PENDING: create SubstitutionProposal (status PENDING, expires_at = now + 7d) with proposed_product_id from the selector"
          - "Cascade link 2 (OrderLine->Order): each parent Order of a mutated line recomputes merchandise_subtotal_cents/delivery_fee_cents/fuel_surcharge_cents/total_cents; if all its lines are CANCELLED -> Order CANCELLED; else if >=1 line SUBSTITUTION_PENDING -> PARTIALLY_BLOCKED"
          - "Cascade link 3 (Order->Facility): recompute Facility.committed_cents from Orders with status IN {PLACED, PARTIALLY_BLOCKED, DELIVERED} (drops by the cancelled order's total when the order auto-cancelled)"
          - "increments Product.version by 1"
      - from: SHORTAGE
        to: ACTIVE
        trigger: "POST /jansan/products/{product_id}/resolve-shortage"
        actor: DistributorAdmin
        preconditions: ["product.status == SHORTAGE"]
        side_effects: ["Pending SubstitutionProposals are NOT auto-resolved; increments Product.version by 1"]
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /jansan/products/{product_id}/discontinue"
        actor: DistributorAdmin
        preconditions:
          - "product.status IN {ACTIVE, SHORTAGE}"
          - "no OrderLine with product_id == this product and status IN {PENDING, ALLOCATED, SUBSTITUTION_PENDING} (else ERR_DISCONTINUE_BLOCKED)"
        side_effects: ["increments Product.version by 1"]
      - from: SHORTAGE
        to: DISCONTINUED
        trigger: "POST /jansan/products/{product_id}/discontinue"
        actor: DistributorAdmin
        preconditions: ["no OrderLine with product_id == this product and status IN {PENDING, ALLOCATED, SUBSTITUTION_PENDING} (else ERR_DISCONTINUE_BLOCKED)"]
        side_effects: ["increments Product.version by 1"]

  - entity: UsageRecord
    initial_state: SUBMITTED
    terminal_states: [POSTED]
    transitions:
      - from: SUBMITTED
        to: POSTED
        trigger: "POST /jansan/usage-records/{usage_record_id}/post"
        actor: DistributorAdmin
        preconditions: ["usage_record.status == SUBMITTED"]
        side_effects: ["posted_at = now; increments UsageRecord.version by 1"]

  - entity: Dispenser
    initial_state: SCHEDULED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: SCHEDULED
        to: INSTALLED
        trigger: "POST /jansan/dispensers/{dispenser_id}/complete"
        actor: FieldTechnician
        preconditions:
          - "dispenser.status == SCHEDULED"
          - "dispenser.technician_id == X-User-ID (else ERR_FORBIDDEN)"
          - "dispenser's facility.status == ACTIVE (else ERR_FACILITY_INACTIVE)"
          - "if product.dilution_required: exists TrainingRecord with facility_id == dispenser.facility_id AND product_id == dispenser.product_id AND status == CERTIFIED (else ERR_TRAINING_NOT_CERTIFIED)"
        side_effects:
          - "installed_at = now"
          - "Bubble up: recompute Facility.closed_loop_enrolled (true when facility has >=1 INSTALLED dispenser)"
          - "increments Dispenser.version by 1"
      - from: INSTALLED
        to: DECOMMISSIONED
        trigger: "POST /jansan/dispensers/{dispenser_id}/decommission"
        actor: DistributorAdmin
        preconditions: ["dispenser.status == INSTALLED"]
        side_effects:
          - "Bubble up: recompute Facility.closed_loop_enrolled (false when no INSTALLED dispenser remains)"
          - "increments Dispenser.version by 1"

  - entity: TrainingRecord
    initial_state: SCHEDULED
    terminal_states: [FAILED, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: CERTIFIED
        trigger: "POST /jansan/training-records/{training_record_id}/certify with score_pct >= 80"
        actor: DistributorAdmin
        preconditions: ["training_record.status == SCHEDULED"]
        side_effects: ["certified_at = now; expires_at = now + 365d; score_pct set; increments TrainingRecord.version by 1"]
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /jansan/training-records/{training_record_id}/certify with score_pct < 80"
        actor: DistributorAdmin
        preconditions: ["training_record.status == SCHEDULED"]
        side_effects: ["score_pct set; increments TrainingRecord.version by 1"]
      - from: CERTIFIED
        to: EXPIRED
        trigger: "POST /jansan/ops/run-daily (system sweep): CERTIFIED records with now > expires_at"
        actor: system
        preconditions: ["training_record.status == CERTIFIED", "now > expires_at (strictly greater; at exact expires_at still CERTIFIED)"]
        side_effects: ["increments TrainingRecord.version by 1"]

  - entity: StandingOrder
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /jansan/standing-orders/{standing_order_id}/activate"
        actor: FacilityManager
        preconditions:
          - "standing_order.status == DRAFT"
          - "facility.status == ACTIVE (else ERR_FACILITY_INACTIVE)"
          - "items non-empty"
        side_effects:
          - "Recompute next_delivery_total_cents = sum over items of qty * effective_unit_price(facility, product, now)"
          - "Recompute price_protected (true when >=1 item covered by an AWARDED bid matching facility.facility_group_code)"
          - "increments StandingOrder.version by 1"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /jansan/standing-orders/{standing_order_id}/pause"
        actor: FacilityManager
        preconditions: ["standing_order.status == ACTIVE"]
        side_effects: ["pause_reason = MANUAL; increments StandingOrder.version by 1"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /jansan/standing-orders/{standing_order_id}/resume"
        actor: FacilityManager
        preconditions:
          - "standing_order.status == PAUSED"
          - "facility.status == ACTIVE (else ERR_FACILITY_INACTIVE)"
        side_effects: ["pause_reason = NONE; recompute next_delivery_total_cents; increments StandingOrder.version by 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /jansan/standing-orders/{standing_order_id}/cancel"
        actor: FacilityManager
        preconditions: ["standing_order.status IN {DRAFT, ACTIVE, PAUSED}"]
        side_effects: ["increments StandingOrder.version by 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /jansan/standing-orders/{standing_order_id}/cancel"
        actor: FacilityManager
        preconditions: ["standing_order.status IN {DRAFT, ACTIVE, PAUSED}"]
        side_effects: ["increments StandingOrder.version by 1"]
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /jansan/standing-orders/{standing_order_id}/cancel"
        actor: FacilityManager
        preconditions: ["standing_order.status IN {DRAFT, ACTIVE, PAUSED}"]
        side_effects: ["increments StandingOrder.version by 1"]

  - entity: Order
    initial_state: DRAFT
    terminal_states: [INVOICED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PLACED
        trigger: "POST /jansan/orders/{order_id}/place"
        actor: FacilityManager
        preconditions:
          - "order.status == DRAFT"
          - "facility.status == ACTIVE (else ERR_FACILITY_INACTIVE)"
          - "every line's product.status == ACTIVE (else ERR_PRODUCT_UNAVAILABLE)"
          - "for every line, product.qty_on_hand >= line.qty (equality allocates; else ERR_INSUFFICIENT_STOCK)"
          - "for every line whose product.dilution_required: exists CERTIFIED TrainingRecord for (facility, product) (else ERR_TRAINING_NOT_CERTIFIED)"
          - "facility.committed_cents + order.total_cents <= facility.credit_limit_cents (equality passes; else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Each line PENDING -> ALLOCATED; product.qty_on_hand -= qty; product.qty_allocated += qty"
          - "line.unit_price_cents frozen to effective_unit_price(facility, product, now); line totals and order money fields computed per order_total_rollup with QUOTED fuel surcharge"
          - "placed_at = now; Ledger sync: Facility.committed_cents += order.total_cents"
          - "increments Order.version by 1"
      - from: PLACED
        to: PARTIALLY_BLOCKED
        trigger: "system auto-transition when >=1 line enters SUBSTITUTION_PENDING (shortage cascade)"
        actor: system
        preconditions: ["order.status == PLACED", ">=1 line in SUBSTITUTION_PENDING"]
        side_effects: ["increments Order.version by 1"]
      - from: PARTIALLY_BLOCKED
        to: PLACED
        trigger: "system auto-transition when zero lines remain in SUBSTITUTION_PENDING and >=1 line is non-CANCELLED"
        actor: system
        preconditions: ["order.status == PARTIALLY_BLOCKED", "no line in SUBSTITUTION_PENDING", ">=1 line in {ALLOCATED, FULFILLED}"]
        side_effects: ["order money fields recomputed; Ledger sync: Facility.committed_cents adjusted to new total; increments Order.version by 1"]
      - from: PLACED
        to: CANCELLED
        trigger: "system auto-transition when all lines are CANCELLED (e.g. shortage with no substitute or all proposals declined/expired)"
        actor: system
        preconditions: ["order.status IN {PLACED, PARTIALLY_BLOCKED}", "all lines CANCELLED"]
        side_effects: ["Ledger sync: Facility.committed_cents -= order.total_cents; increments Order.version by 1"]
      - from: PARTIALLY_BLOCKED
        to: CANCELLED
        trigger: "system auto-transition when all lines are CANCELLED"
        actor: system
        preconditions: ["order.status IN {PLACED, PARTIALLY_BLOCKED}", "all lines CANCELLED"]
        side_effects: ["Ledger sync: Facility.committed_cents -= order.total_cents; increments Order.version by 1"]
      - from: PLACED
        to: DELIVERED
        trigger: "POST /jansan/orders/{order_id}/confirm-delivery"
        actor: DistributorAdmin
        preconditions: ["order.status == PLACED"]
        side_effects:
          - "fuel_index_at_delivery set from request; fuel_surcharge_cents recomputed with ACTUAL variant; total_cents recomputed; fuel_surcharge_variant = ACTUAL"
          - "Each line ALLOCATED -> FULFILLED; product.qty_allocated -= qty (qty_on_hand stays reduced)"
          - "Ledger sync: Facility.committed_cents adjusted to the new total_cents"
          - "increments Order.version by 1"
      - from: DELIVERED
        to: INVOICED
        trigger: "POST /jansan/orders/{order_id}/invoice"
        actor: DistributorAdmin
        preconditions: ["order.status == DELIVERED"]
        side_effects:
          - "Ledger sync: Facility.committed_cents -= total_cents AND Facility.outstanding_cents += total_cents"
          - "increments Order.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /jansan/orders/{order_id}/cancel"
        actor: FacilityManager
        preconditions: ["order.status IN {DRAFT, PLACED, PARTIALLY_BLOCKED}"]
        side_effects:
          - "Compensation: every line IN {PENDING, ALLOCATED, SUBSTITUTION_PENDING} -> CANCELLED; ALLOCATED lines release reservation (qty_allocated -= qty, qty_on_hand += qty); PENDING SubstitutionProposals of cancelled lines -> DECLINED"
          - "if order was PLACED or PARTIALLY_BLOCKED: Facility.committed_cents -= order.total_cents"
          - "increments Order.version by 1"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /jansan/orders/{order_id}/cancel"
        actor: FacilityManager
        preconditions: ["order.status IN {DRAFT, PLACED, PARTIALLY_BLOCKED}"]
        side_effects: ["same compensation as DRAFT cancel; increments Order.version by 1"]
      - from: PARTIALLY_BLOCKED
        to: CANCELLED
        trigger: "POST /jansan/orders/{order_id}/cancel"
        actor: FacilityManager
        preconditions: ["order.status IN {DRAFT, PLACED, PARTIALLY_BLOCKED}"]
        side_effects: ["same compensation as DRAFT cancel; increments Order.version by 1"]

  - entity: OrderLine
    initial_state: PENDING
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PENDING
        to: ALLOCATED
        trigger: "POST /jansan/orders/{order_id}/place (allocation step)"
        actor: system
        preconditions: ["product.qty_on_hand >= qty (equality allocates)"]
        side_effects: ["product.qty_on_hand -= qty; product.qty_allocated += qty; unit_price_cents frozen; line_total_cents computed"]
      - from: PENDING
        to: SUBSTITUTION_PENDING
        trigger: "shortage cascade from Product declare-shortage (only when substitute candidate exists)"
        actor: system
        preconditions: ["product.status became SHORTAGE"]
        side_effects: ["SubstitutionProposal created (PENDING)"]
      - from: ALLOCATED
        to: SUBSTITUTION_PENDING
        trigger: "shortage cascade from Product declare-shortage (only when substitute candidate exists)"
        actor: system
        preconditions: ["product.status became SHORTAGE"]
        side_effects: ["release reservation first: qty_allocated -= qty, qty_on_hand += qty; then SubstitutionProposal created (PENDING)"]
      - from: PENDING
        to: CANCELLED
        trigger: "shortage cascade with empty substitute candidate set, or order cancel"
        actor: system
        preconditions: []
        side_effects: ["parent Order money fields recomputed"]
      - from: ALLOCATED
        to: CANCELLED
        trigger: "order cancel, or proposal decline/expire is not applicable here (proposal path applies to SUBSTITUTION_PENDING)"
        actor: system
        preconditions: []
        side_effects: ["release reservation: qty_allocated -= qty, qty_on_hand += qty; parent Order money fields recomputed"]
      - from: SUBSTITUTION_PENDING
        to: ALLOCATED
        trigger: "POST /jansan/substitution-proposals/{proposal_id}/accept"
        actor: FacilityManager
        preconditions: ["proposal.status == PENDING", "proposed product.qty_on_hand >= qty (else ERR_INSUFFICIENT_STOCK)"]
        side_effects: ["product_id swapped to proposed product; unit_price_cents = effective_unit_price(facility, proposed product, now); line_total_cents recomputed; allocate proposed product (on_hand -= qty, allocated += qty); proposal.price_delta_cents finalized"]
      - from: SUBSTITUTION_PENDING
        to: CANCELLED
        trigger: "POST /jansan/substitution-proposals/{proposal_id}/decline or proposal expiry sweep"
        actor: FacilityManager
        preconditions: ["proposal.status == PENDING"]
        side_effects: ["parent Order money fields recomputed"]
      - from: ALLOCATED
        to: FULFILLED
        trigger: "POST /jansan/orders/{order_id}/confirm-delivery"
        actor: system
        preconditions: ["order.status == PLACED"]
        side_effects: ["product.qty_allocated -= qty"]

  - entity: ContractBid
    initial_state: DRAFT
    terminal_states: [LOST, EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /jansan/contract-bids/{bid_id}/submit"
        actor: SalesRep
        preconditions: ["bid.status == DRAFT", "lines non-empty", "protection_end > protection_start"]
        side_effects: ["submitted_at = now; increments ContractBid.version by 1"]
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /jansan/contract-bids/{bid_id}/open-review"
        actor: SalesRep
        preconditions: ["bid.status == SUBMITTED"]
        side_effects: ["increments ContractBid.version by 1"]
      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /jansan/contract-bids/{bid_id}/return-for-revision"
        actor: SalesRep
        preconditions: ["bid.status == UNDER_REVIEW"]
        side_effects: ["revision_number += 1; increments ContractBid.version by 1"]
        note: "Revision loop: DRAFT -> SUBMITTED -> UNDER_REVIEW -> DRAFT"
      - from: UNDER_REVIEW
        to: AWARDED
        trigger: "POST /jansan/contract-bids/{bid_id}/award"
        actor: DistributorAdmin
        preconditions:
          - "bid.status == UNDER_REVIEW"
          - "no other AWARDED bid with same facility_group_code sharing any line product whose CLOSED window [protection_start, protection_end] intersects this bid's window (touching endpoints DO intersect; else ERR_PROTECTION_WINDOW_OVERLAP)"
        side_effects:
          - "Cascade link 1 (ContractBid->StandingOrder): every StandingOrder with status IN {ACTIVE, PAUSED} whose facility.facility_group_code == bid.facility_group_code: recompute price_protected and next_delivery_total_cents using bid prices for covered items"
          - "increments ContractBid.version by 1"
      - from: UNDER_REVIEW
        to: LOST
        trigger: "POST /jansan/contract-bids/{bid_id}/mark-lost"
        actor: SalesRep
        preconditions: ["bid.status == UNDER_REVIEW"]
        side_effects: ["increments ContractBid.version by 1"]
      - from: AWARDED
        to: EXPIRED
        trigger: "POST /jansan/ops/run-daily (system sweep): AWARDED bids with now > protection_end"
        actor: system
        preconditions: ["bid.status == AWARDED", "now > protection_end"]
        side_effects: ["Cascade: affected StandingOrders recompute price_protected and next_delivery_total_cents (bid price no longer applies)"]
      - from: AWARDED
        to: TERMINATED
        trigger: "POST /jansan/contract-bids/{bid_id}/terminate"
        actor: DistributorAdmin
        preconditions: ["bid.status == AWARDED"]
        side_effects: ["Cascade: affected StandingOrders recompute price_protected and next_delivery_total_cents; increments ContractBid.version by 1"]

  - entity: SubstitutionProposal
    initial_state: PENDING
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /jansan/substitution-proposals/{proposal_id}/accept"
        actor: FacilityManager
        preconditions:
          - "proposal.status == PENDING (else ERR_INVALID_STATE)"
          - "proposal's order line status == SUBSTITUTION_PENDING"
          - "proposed product.qty_on_hand >= line.qty (equality allocates; else ERR_INSUFFICIENT_STOCK)"
          - "proposal's order facility matches X-User-ID for FacilityManager (else ERR_FORBIDDEN)"
        side_effects:
          - "OrderLine SUBSTITUTION_PENDING -> ALLOCATED with product swap, reprice, and allocation of proposed product"
          - "Parent Order: money fields recomputed; if zero lines remain SUBSTITUTION_PENDING -> auto PLACED"
          - "Ledger sync: Facility.committed_cents adjusted to new order total"
          - "increments SubstitutionProposal.version by 1"
      - from: PENDING
        to: DECLINED
        trigger: "POST /jansan/substitution-proposals/{proposal_id}/decline"
        actor: FacilityManager
        preconditions: ["proposal.status == PENDING"]
        side_effects:
          - "OrderLine SUBSTITUTION_PENDING -> CANCELLED; parent Order recomputed; if all lines CANCELLED -> Order auto-CANCELLED, else if no SUBSTITUTION_PENDING lines remain -> auto PLACED"
          - "Ledger sync: Facility.committed_cents adjusted"
          - "increments SubstitutionProposal.version by 1"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /jansan/ops/run-daily (system sweep): PENDING proposals with now > expires_at"
        actor: system
        preconditions: ["proposal.status == PENDING", "now > expires_at"]
        side_effects: ["same line/order/facility effects as DECLINED"]

  - entity: TrialProgram
    initial_state: ACTIVE
    terminal_states: [CONVERTED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: CONVERTED
        trigger: "POST /jansan/trial-programs/{trial_program_id}/convert"
        actor: FacilityManager
        preconditions:
          - "trial.status == ACTIVE"
          - "now <= trial_end (conversion at exact trial_end is allowed)"
          - "trial facility matches X-User-ID for FacilityManager (else ERR_FORBIDDEN)"
          - "generated conversion order must pass normal place validations (facility ACTIVE, training for dilution chemicals, credit on post-credit total)"
        side_effects:
          - "Cascade link 1 (TrialProgram->Order): create Order (source TRIAL_CONVERSION, one line: trial product, request qty) and place it; conversion_credit_cents = min(sample_value_cents, order merchandise_subtotal_cents) applied as order.trial_credit_cents"
          - "Cascade link 2 (Order->Facility): Facility.committed_cents += conversion order total_cents"
          - "conversion_order_id set; increments TrialProgram.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /jansan/ops/run-daily (system sweep): ACTIVE trials with now > trial_end"
        actor: system
        preconditions: ["trial.status == ACTIVE", "now > trial_end (strictly greater)"]
        side_effects: ["increments TrialProgram.version by 1"]

concurrency_rules:
  - rule_id: forecast-profile-patch-stale-version
    parent_entity: ForecastProfile
    write_endpoint: "PATCH /jansan/forecast-profiles/{forecast_profile_id}"
    occ_field: expected_forecast_profile_version
    description: |
      Updating a ForecastProfile whose version has advanced since the client last
      observed it is rejected. Two planners may legitimately update safety_stock or
      current_on_hand; neither update changes any state field that would reject the
      other, so the conflict is resolved purely by OCC on ForecastProfile.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: usage_forecast
    trigger: "POST /jansan/forecast-profiles/{forecast_profile_id}/recompute"
    algorithm: forward_looking
    formula: |
      window = [now - FORECAST_WINDOW_DAYS days, now], both ends inclusive, matched on period_end
      FINAL:      included = UsageRecords of (facility_id, product_id) with status == POSTED and period_end in window
      PROVISIONAL: included = same but status IN {SUBMITTED, POSTED}
      avg_daily_usage = round_half_up(sum(included.quantity_used) / FORECAST_WINDOW_DAYS, 4)
      reorder_point = ceil(avg_daily_usage * LEAD_TIME_DAYS) + safety_stock
      recommended_qty = max(0, ceil(avg_daily_usage * horizon_days) - current_on_hand)
      replenishment_recommended = (current_on_hand <= reorder_point)   # equality triggers
    input_set: "UsageRecords of the profile's (facility_id, product_id); status filter depends on variant; divisor is always FORECAST_WINDOW_DAYS regardless of record coverage"
    constants:
      FORECAST_WINDOW_DAYS: 90
      LEAD_TIME_DAYS: 7
    precision: "avg_daily_usage: 4 decimal places, round_half_up; reorder_point/recommended_qty: integer via ceil"
    variants:
      - name: PROVISIONAL
        when: "recompute called with variant=PROVISIONAL"
        difference: "includes SUBMITTED + POSTED records (operator's forward-looking view)"
      - name: FINAL
        when: "recompute called with variant=FINAL"
        difference: "includes POSTED records only (audited view); identical raw data yields smaller averages when SUBMITTED records exist"

  - name: order_line_pricing
    trigger: "POST /jansan/orders/{order_id}/place; also on substitution accept (line reprice)"
    algorithm: tiered_pricing
    formula: |
      for each line: line_total_cents = round_half_up(qty * unit_price_cents * (1 - discount_pct)) to integer cents
      merchandise_subtotal_cents = sum(line_total_cents)
      PINNED ROUNDING ORDER: round each line to integer cents FIRST, then sum.
      (Sum-then-round of raw values is a different, non-conformant result.)
    input_set: "the order's own OrderLines (all statuses contribute until CANCELLED; CANCELLED lines contribute 0 and are excluded from the sum)"
    constants: {}
    precision: "integer cents per line, round_half_up, then integer sum"

  - name: order_total_rollup
    trigger: "POST /jansan/orders/{order_id}/place; recomputed on substitution accept/decline/expire and on confirm-delivery"
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (breaks the fee<->surcharge circularity):
      1. merchandise_subtotal_cents  (from order_line_pricing, per-line rounding then sum)
      2. delivery_fee_cents = max(0, DELIVERY_MINIMUM_CENTS - merchandise_subtotal_cents)
      3. fuel_surcharge_cents computed on base (merchandise_subtotal_cents + delivery_fee_cents)  [see fuel_surcharge]
      4. total_cents = max(0, merchandise_subtotal_cents + delivery_fee_cents + fuel_surcharge_cents - trial_credit_cents)
    input_set: "single order's current line set + facility.delivery_distance_miles + applicable fuel index"
    constants:
      DELIVERY_MINIMUM_CENTS: 5000
    precision: "integer cents, round_half_up at the surcharge step"

  - name: fuel_surcharge
    trigger: "POST /jansan/orders/{order_id}/place (QUOTED variant); POST /jansan/orders/{order_id}/confirm-delivery (ACTUAL variant)"
    algorithm: tiered_pricing
    formula: |
      base_cents = merchandise_subtotal_cents + delivery_fee_cents
      pct = 0.04 if fuel_index < 3.00; 0.06 if 3.00 <= fuel_index < 4.00; 0.09 if fuel_index >= 4.00
      dist_mult = 1.0 if miles < 25; 1.25 if 25 <= miles < 75; 1.5 if miles >= 75   (miles = facility.delivery_distance_miles)
      fuel_surcharge_cents = round_half_up(base_cents * pct * dist_mult) to integer cents
    input_set: "single order; index source depends on variant"
    constants:
      FUEL_INDEX_TIER_LOW: 3.00
      FUEL_INDEX_TIER_HIGH: 4.00
      DIST_BAND_MID: 25
      DIST_BAND_HIGH: 75
    precision: "integer cents, round_half_up"
    variants:
      - name: QUOTED
        when: "at order placement"
        difference: "uses order.fuel_index supplied at create/place time"
      - name: ACTUAL
        when: "at confirm-delivery"
        difference: "uses fuel_index_at_delivery; identical order data yields a different surcharge whenever the index moved between quote and delivery"

  - name: credit_exposure
    trigger: "recomputed on every Order status change for its facility (place, delivery reprice, invoice, cancel, shortage-cascade recompute)"
    algorithm: aggregation
    formula: |
      committed_cents = sum(total_cents) over Facility's Orders with status IN {PLACED, PARTIALLY_BLOCKED, DELIVERED} (all time)
      outstanding_cents = sum(total_cents) over Facility's Orders with status == INVOICED (all time)
      credit check at place: committed_cents + new_order.total_cents <= credit_limit_cents (equality passes)
    input_set: "all Orders of the facility; explicit status filters above; no time window"
    constants: {}
    precision: "integer cents (exact sums)"

  - name: effective_unit_price
    trigger: "order placement (per line), substitution accept reprice, standing-order next_delivery_total preview, standing-order generation"
    algorithm: weighted_scoring
    formula: |
      candidates = ContractBids with status == AWARDED
                   AND facility_group_code == facility.facility_group_code
                   AND product_id in bid.lines.product_id
                   AND protection_start <= now <= protection_end   (CLOSED interval)
      if candidates non-empty: unit_price = bid_price_cents of the covering bid
        (overlap validation guarantees <= 1 candidate; residual ties broken by lowest bid_price_cents, then earliest protection_start, then earliest created_at ASC)
      else: unit_price = product.base_price_cents
    input_set: "AWARDED ContractBids matching group+product+date; fallback to Product.base_price_cents"
    constants: {}
    precision: "integer cents (selection, no arithmetic)"

  - name: trial_conversion_credit
    trigger: "POST /jansan/trial-programs/{trial_program_id}/convert"
    algorithm: aggregation
    formula: |
      conversion_credit_cents = min(trial.sample_value_cents, conversion_order.merchandise_subtotal_cents)
      applied as order.trial_credit_cents; total floored at 0 by order_total_rollup
    input_set: "single trial + its generated conversion order"
    constants: {}
    precision: "integer cents (exact)"

validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Entity-backed ownership: FacilityManager may only act on resources whose facility_id == X-User-ID; FieldTechnician may only complete dispensers whose technician_id == X-User-ID", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "ownership-scoped endpoints" }
  - { priority: 4, category: existence, check: "Path and body-referenced ids exist, validated left-to-right in path", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: request, check: "Required fields present, types valid, enum members valid, qty >= 1, period_end >= period_start, install_end > install_start, protection_end > protection_start, score_pct 0..100", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 6, category: state, check: "OCC: expected_forecast_profile_version equals current ForecastProfile.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /jansan/forecast-profiles/{forecast_profile_id}" }
  - { priority: 7, category: state, check: "State-machine from-state matches the attempted transition (incl. terminal lockdown)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: state, check: "Facility gate: facility.status == ACTIVE for order place/cancel, standing-order activate/resume, dispenser complete, trial convert, usage-record create", error_id: ERR_FACILITY_INACTIVE, http_status: 409, applies_to: "facility-scoped mutating endpoints" }
  - { priority: 9, category: state, check: "Order place: every line product.status == ACTIVE", error_id: ERR_PRODUCT_UNAVAILABLE, http_status: 409, applies_to: "POST /jansan/orders/{order_id}/place" }
  - { priority: 10, category: business_constraint, check: "Order place: every line product.qty_on_hand >= qty (all-or-nothing allocation)", error_id: ERR_INSUFFICIENT_STOCK, http_status: 409, applies_to: "POST /jansan/orders/{order_id}/place; POST /jansan/substitution-proposals/{proposal_id}/accept" }
  - { priority: 11, category: business_safety, check: "Dilution compliance: order place / dispenser complete involving a dilution_required chemical requires an existing CERTIFIED TrainingRecord for (facility, product)", error_id: ERR_TRAINING_NOT_CERTIFIED, http_status: 409, applies_to: "POST /jansan/orders/{order_id}/place; POST /jansan/dispensers/{dispenser_id}/complete" }
  - { priority: 12, category: business_safety, check: "Zone incompatibility: no two dispensers with status IN {SCHEDULED, INSTALLED} in the same facility+zone may pair chemical_family ACID with OXIDIZER", error_id: ERR_INCOMPATIBLE_PLACEMENT, http_status: 409, applies_to: "POST /jansan/dispensers" }
  - { priority: 13, category: business_temporal, check: "Technician window conflict: new install window [install_start, install_end) must not overlap any other dispenser of the same technician with status IN {SCHEDULED, INSTALLED}; HALF-OPEN semantics — touching endpoints (end == start) do NOT conflict", error_id: ERR_TECHNICIAN_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /jansan/dispensers" }
  - { priority: 14, category: business_temporal, check: "Protection window overlap at award: no two AWARDED bids with same facility_group_code sharing a line product may have intersecting CLOSED windows — touching endpoints DO intersect", error_id: ERR_PROTECTION_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /jansan/contract-bids/{bid_id}/award" }
  - { priority: 15, category: business_temporal, check: "Logical clock is monotonic: set_current_utc rejects a timestamp earlier than the current logical time", error_id: ERR_CLOCK_REGRESSION, http_status: 400, applies_to: "POST /jansan/_clock/set_current_utc" }
  - { priority: 16, category: business_constraint, check: "No two StandingOrders of the same facility with status IN {DRAFT, ACTIVE, PAUSED} may share any item product_id", error_id: ERR_DUPLICATE_STANDING_ORDER, http_status: 409, applies_to: "POST /jansan/standing-orders" }
  - { priority: 17, category: business_constraint, check: "At most one TrialProgram with status == ACTIVE per (facility_id, product_id)", error_id: ERR_TRIAL_ALREADY_ACTIVE, http_status: 409, applies_to: "POST /jansan/trial-programs" }
  - { priority: 18, category: business_referential, check: "Product discontinue blocked while any of its OrderLines is IN {PENDING, ALLOCATED, SUBSTITUTION_PENDING}", error_id: ERR_DISCONTINUE_BLOCKED, http_status: 409, applies_to: "POST /jansan/products/{product_id}/discontinue" }
  - { priority: 19, category: business_referential, check: "Facility archive blocked while it has Orders IN {DRAFT, PLACED, PARTIALLY_BLOCKED, DELIVERED} or StandingOrders IN {DRAFT, ACTIVE, PAUSED}", error_id: ERR_ARCHIVE_BLOCKED, http_status: 409, applies_to: "POST /jansan/facilities/{facility_id}/archive" }
  - { priority: 20, category: business_fiscal, check: "Credit check: facility.committed_cents + order.total_cents <= facility.credit_limit_cents (equality passes)", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 409, applies_to: "POST /jansan/orders/{order_id}/place; POST /jansan/trial-programs/{trial_program_id}/convert" }

endpoints:
  # Facilities
  - { method: POST, path: "/jansan/facilities", description: "Create a facility", roles: [DistributorAdmin], code: 201, input: [name, facility_group_code, credit_limit_cents, service_zone, delivery_distance_miles, default_delivery_day], output: Facility, side_effects: ["status ACTIVE, committed/outstanding 0"] }
  - { method: GET, path: "/jansan/facilities/{facility_id}", description: "Fetch one facility", roles: [DistributorAdmin, FacilityManager, SalesRep, FieldTechnician], code: 200, input: [], output: Facility, side_effects: [] }
  - { method: POST, path: "/jansan/facilities/{facility_id}/suspend", description: "ACTIVE -> SUSPENDED; pauses ACTIVE standing orders (reason SUSPENSION)", roles: [DistributorAdmin], code: 200, input: [], output: Facility, side_effects: ["StandingOrder cascade pause"] }
  - { method: POST, path: "/jansan/facilities/{facility_id}/reinstate", description: "SUSPENDED -> ACTIVE; resumes SUSPENSION-paused standing orders only", roles: [DistributorAdmin], code: 200, input: [], output: Facility, side_effects: ["conditional StandingOrder resume"] }
  - { method: POST, path: "/jansan/facilities/{facility_id}/archive", description: "ACTIVE -> ARCHIVED; blocked by open orders/standing orders", roles: [DistributorAdmin], code: 200, input: [], output: Facility, side_effects: [] }

  # Products
  - { method: POST, path: "/jansan/products", description: "Create a product with initial stock", roles: [DistributorAdmin], code: 201, input: [sku, name, category, base_price_cents, unit_of_measure, "dilution_required?", "chemical_family?", qty_on_hand], output: Product, side_effects: ["status ACTIVE, qty_allocated 0"] }
  - { method: GET, path: "/jansan/products/{product_id}", description: "Fetch one product", roles: [DistributorAdmin, FacilityManager, SalesRep, FieldTechnician], code: 200, input: [], output: Product, side_effects: [] }
  - { method: POST, path: "/jansan/products/{product_id}/declare-shortage", description: "ACTIVE -> SHORTAGE; runs substitution cascade over open order lines", roles: [DistributorAdmin], code: 200, input: [], output: Product, side_effects: ["OrderLine SUBSTITUTION_PENDING/CANCELLED, SubstitutionProposal creation, Order recompute/auto-transition, Facility committed_cents recompute"] }
  - { method: POST, path: "/jansan/products/{product_id}/resolve-shortage", description: "SHORTAGE -> ACTIVE", roles: [DistributorAdmin], code: 200, input: [], output: Product, side_effects: [] }
  - { method: POST, path: "/jansan/products/{product_id}/discontinue", description: "ACTIVE/SHORTAGE -> DISCONTINUED when no open order lines", roles: [DistributorAdmin], code: 200, input: [], output: Product, side_effects: [] }

  # Usage records
  - { method: POST, path: "/jansan/usage-records", description: "Submit a usage record (status SUBMITTED)", roles: [FacilityManager, DistributorAdmin], code: 201, input: [facility_id, product_id, period_start, period_end, quantity_used, source], output: UsageRecord, side_effects: [] }
  - { method: GET, path: "/jansan/usage-records/{usage_record_id}", description: "Fetch one usage record", roles: [DistributorAdmin, FacilityManager, SalesRep], code: 200, input: [], output: UsageRecord, side_effects: [] }
  - { method: GET, path: "/jansan/usage-records", description: "List usage records with filters", roles: [DistributorAdmin, FacilityManager, SalesRep], code: 200, input: ["facility_id?", "product_id?", "status?", "limit?", "offset?"], output: "UsageRecord[]", side_effects: [] }
  - { method: POST, path: "/jansan/usage-records/{usage_record_id}/post", description: "SUBMITTED -> POSTED (sets posted_at)", roles: [DistributorAdmin], code: 200, input: [], output: UsageRecord, side_effects: [] }

  # Forecast profiles
  - { method: POST, path: "/jansan/forecast-profiles", description: "Create forecast profile for facility+product", roles: [DistributorAdmin], code: 201, input: [facility_id, product_id, "horizon_days?", "safety_stock?", "current_on_hand?"], output: ForecastProfile, side_effects: [] }
  - { method: GET, path: "/jansan/forecast-profiles/{forecast_profile_id}", description: "Fetch one forecast profile", roles: [DistributorAdmin, FacilityManager, SalesRep], code: 200, input: [], output: ForecastProfile, side_effects: [] }
  - { method: GET, path: "/jansan/forecast-profiles", description: "List forecast profiles with filters", roles: [DistributorAdmin, FacilityManager, SalesRep], code: 200, input: ["facility_id?", "product_id?", "limit?", "offset?"], output: "ForecastProfile[]", side_effects: [] }
  - { method: PATCH, path: "/jansan/forecast-profiles/{forecast_profile_id}", description: "OCC-guarded planner update of safety_stock/horizon_days/current_on_hand", roles: [DistributorAdmin], code: 200, input: ["safety_stock?", "horizon_days?", "current_on_hand?", expected_forecast_profile_version], output: ForecastProfile, side_effects: ["increments ForecastProfile.version by 1"] }
  - { method: POST, path: "/jansan/forecast-profiles/{forecast_profile_id}/recompute", description: "Run usage_forecast with the given variant; refreshes computed fields", roles: [DistributorAdmin, FacilityManager], code: 200, input: [variant], output: ForecastProfile, side_effects: ["usage_forecast", "last_computed_at = now", "increments ForecastProfile.version by 1"] }

  # Technicians
  - { method: POST, path: "/jansan/technicians", description: "Create a field technician", roles: [DistributorAdmin], code: 201, input: [name], output: Technician, side_effects: [] }

  # Dispensers
  - { method: POST, path: "/jansan/dispensers", description: "Schedule a dispenser install (zone-compat + technician window checks)", roles: [DistributorAdmin], code: 201, input: [facility_id, product_id, zone, technician_id, install_start, install_end], output: Dispenser, side_effects: ["status SCHEDULED"] }
  - { method: GET, path: "/jansan/dispensers/{dispenser_id}", description: "Fetch one dispenser", roles: [DistributorAdmin, FacilityManager, FieldTechnician], code: 200, input: [], output: Dispenser, side_effects: [] }
  - { method: GET, path: "/jansan/dispensers", description: "List dispensers with filters", roles: [DistributorAdmin, FacilityManager, FieldTechnician], code: 200, input: ["facility_id?", "product_id?", "technician_id?", "status?", "limit?", "offset?"], output: "Dispenser[]", side_effects: [] }
  - { method: POST, path: "/jansan/dispensers/{dispenser_id}/complete", description: "SCHEDULED -> INSTALLED (requires certified dilution training when applicable)", roles: [FieldTechnician], code: 200, input: [], output: Dispenser, side_effects: ["installed_at = now", "Facility.closed_loop_enrolled recompute"] }
  - { method: POST, path: "/jansan/dispensers/{dispenser_id}/decommission", description: "INSTALLED -> DECOMMISSIONED", roles: [DistributorAdmin], code: 200, input: [], output: Dispenser, side_effects: ["Facility.closed_loop_enrolled recompute"] }

  # Training records
  - { method: POST, path: "/jansan/training-records", description: "Schedule dilution training for a facility employee", roles: [DistributorAdmin], code: 201, input: [facility_id, product_id, employee_name], output: TrainingRecord, side_effects: ["status SCHEDULED"] }
  - { method: GET, path: "/jansan/training-records/{training_record_id}", description: "Fetch one training record", roles: [DistributorAdmin, FacilityManager, SalesRep], code: 200, input: [], output: TrainingRecord, side_effects: [] }
  - { method: GET, path: "/jansan/training-records", description: "List training records with filters", roles: [DistributorAdmin, FacilityManager, SalesRep], code: 200, input: ["facility_id?", "product_id?", "status?", "limit?", "offset?"], output: "TrainingRecord[]", side_effects: [] }
  - { method: POST, path: "/jansan/training-records/{training_record_id}/certify", description: "SCHEDULED -> CERTIFIED (score >= 80) or FAILED (score < 80)", roles: [DistributorAdmin], code: 200, input: [score_pct], output: TrainingRecord, side_effects: ["certified_at/expires_at set on CERTIFIED"] }

  # Standing orders
  - { method: POST, path: "/jansan/standing-orders", description: "Create a standing order (DRAFT)", roles: [FacilityManager, DistributorAdmin], code: 201, input: [facility_id, items, frequency, next_run_date, "fuel_index?"], output: StandingOrder, side_effects: [] }
  - { method: GET, path: "/jansan/standing-orders/{standing_order_id}", description: "Fetch one standing order", roles: [DistributorAdmin, FacilityManager, SalesRep], code: 200, input: [], output: StandingOrder, side_effects: [] }
  - { method: GET, path: "/jansan/standing-orders", description: "List standing orders with filters", roles: [DistributorAdmin, FacilityManager, SalesRep], code: 200, input: ["facility_id?", "status?", "limit?", "offset?"], output: "StandingOrder[]", side_effects: [] }
  - { method: POST, path: "/jansan/standing-orders/{standing_order_id}/activate", description: "DRAFT -> ACTIVE; previews next_delivery_total_cents", roles: [FacilityManager, DistributorAdmin], code: 200, input: [], output: StandingOrder, side_effects: ["next_delivery_total_cents + price_protected recompute"] }
  - { method: POST, path: "/jansan/standing-orders/{standing_order_id}/pause", description: "ACTIVE -> PAUSED (reason MANUAL)", roles: [FacilityManager, DistributorAdmin], code: 200, input: [], output: StandingOrder, side_effects: [] }
  - { method: POST, path: "/jansan/standing-orders/{standing_order_id}/resume", description: "PAUSED -> ACTIVE", roles: [FacilityManager, DistributorAdmin], code: 200, input: [], output: StandingOrder, side_effects: ["next_delivery_total_cents recompute"] }
  - { method: POST, path: "/jansan/standing-orders/{standing_order_id}/cancel", description: "DRAFT/ACTIVE/PAUSED -> CANCELLED", roles: [FacilityManager, DistributorAdmin], code: 200, input: [], output: StandingOrder, side_effects: [] }

  # Orders
  - { method: POST, path: "/jansan/orders", description: "Create a manual order in DRAFT with its lines", roles: [FacilityManager, DistributorAdmin], code: 201, input: [facility_id, lines, delivery_date, fuel_index], output: Order, side_effects: ["OrderLine rows created (PENDING)"] }
  - { method: GET, path: "/jansan/orders/{order_id}", description: "Fetch one order", roles: [DistributorAdmin, FacilityManager, SalesRep], code: 200, input: [], output: Order, side_effects: [] }
  - { method: GET, path: "/jansan/orders", description: "List orders with filters and pagination", roles: [DistributorAdmin, FacilityManager, SalesRep], code: 200, input: ["facility_id?", "standing_order_id?", "status?", "limit?", "offset?"], output: "Order[]", side_effects: [] }
  - { method: POST, path: "/jansan/orders/{order_id}/place", description: "DRAFT -> PLACED; freezes prices, allocates stock, runs full validation stack", roles: [FacilityManager, DistributorAdmin], code: 200, input: [], output: Order, side_effects: ["order_line_pricing", "order_total_rollup (QUOTED surcharge)", "stock allocation", "Facility.committed_cents += total"] }
  - { method: POST, path: "/jansan/orders/{order_id}/confirm-delivery", description: "PLACED -> DELIVERED; ACTUAL fuel surcharge from delivery-day index", roles: [DistributorAdmin], code: 200, input: [fuel_index_at_delivery], output: Order, side_effects: ["fuel_surcharge ACTUAL recompute", "lines FULFILLED", "Facility.committed_cents adjusted"] }
  - { method: POST, path: "/jansan/orders/{order_id}/invoice", description: "DELIVERED -> INVOICED; committed -> outstanding", roles: [DistributorAdmin], code: 200, input: [], output: Order, side_effects: ["Facility.committed_cents -= total", "Facility.outstanding_cents += total"] }
  - { method: POST, path: "/jansan/orders/{order_id}/cancel", description: "DRAFT/PLACED/PARTIALLY_BLOCKED -> CANCELLED with allocation/credit compensation", roles: [FacilityManager, DistributorAdmin], code: 200, input: [], output: Order, side_effects: ["line cancellation + deallocation", "Facility.committed_cents -= total when committed"] }

  # Order lines
  - { method: GET, path: "/jansan/order-lines/{order_line_id}", description: "Fetch one order line", roles: [DistributorAdmin, FacilityManager, SalesRep], code: 200, input: [], output: OrderLine, side_effects: [] }
  - { method: GET, path: "/jansan/order-lines", description: "List order lines with filters", roles: [DistributorAdmin, FacilityManager, SalesRep], code: 200, input: ["order_id?", "product_id?", "status?", "limit?", "offset?"], output: "OrderLine[]", side_effects: [] }

  # Substitution proposals
  - { method: GET, path: "/jansan/substitution-proposals/{proposal_id}", description: "Fetch one proposal", roles: [DistributorAdmin, FacilityManager], code: 200, input: [], output: SubstitutionProposal, side_effects: [] }
  - { method: GET, path: "/jansan/substitution-proposals", description: "List proposals with filters", roles: [DistributorAdmin, FacilityManager], code: 200, input: ["order_line_id?", "original_product_id?", "proposed_product_id?", "status?", "limit?", "offset?"], output: "SubstitutionProposal[]", side_effects: [] }
  - { method: POST, path: "/jansan/substitution-proposals/{proposal_id}/accept", description: "PENDING -> ACCEPTED; line swap+reprice+allocate, order recompute", roles: [FacilityManager], code: 200, input: [], output: SubstitutionProposal, side_effects: ["OrderLine ALLOCATED", "Order recompute + auto PLACED", "Facility.committed_cents adjusted"] }
  - { method: POST, path: "/jansan/substitution-proposals/{proposal_id}/decline", description: "PENDING -> DECLINED; line cancelled, order recompute", roles: [FacilityManager], code: 200, input: [], output: SubstitutionProposal, side_effects: ["OrderLine CANCELLED", "Order recompute/auto-transition", "Facility.committed_cents adjusted"] }

  # Contract bids
  - { method: POST, path: "/jansan/contract-bids", description: "Create a GPO/co-op bid (DRAFT)", roles: [SalesRep], code: 201, input: [bid_reference, facility_group_code, lines, protection_start, protection_end], output: ContractBid, side_effects: [] }
  - { method: GET, path: "/jansan/contract-bids/{bid_id}", description: "Fetch one bid", roles: [DistributorAdmin, SalesRep], code: 200, input: [], output: ContractBid, side_effects: [] }
  - { method: GET, path: "/jansan/contract-bids", description: "List bids with filters", roles: [DistributorAdmin, SalesRep], code: 200, input: ["facility_group_code?", "status?", "limit?", "offset?"], output: "ContractBid[]", side_effects: [] }
  - { method: POST, path: "/jansan/contract-bids/{bid_id}/submit", description: "DRAFT -> SUBMITTED", roles: [SalesRep], code: 200, input: [], output: ContractBid, side_effects: ["submitted_at = now"] }
  - { method: POST, path: "/jansan/contract-bids/{bid_id}/open-review", description: "SUBMITTED -> UNDER_REVIEW", roles: [SalesRep], code: 200, input: [], output: ContractBid, side_effects: [] }
  - { method: POST, path: "/jansan/contract-bids/{bid_id}/return-for-revision", description: "UNDER_REVIEW -> DRAFT; revision_number + 1", roles: [SalesRep], code: 200, input: [], output: ContractBid, side_effects: ["revision_number += 1"] }
  - { method: POST, path: "/jansan/contract-bids/{bid_id}/award", description: "UNDER_REVIEW -> AWARDED; closed-window overlap check; standing-order reprice cascade", roles: [DistributorAdmin], code: 200, input: [], output: ContractBid, side_effects: ["StandingOrder price_protected/next_delivery_total recompute"] }
  - { method: POST, path: "/jansan/contract-bids/{bid_id}/mark-lost", description: "UNDER_REVIEW -> LOST", roles: [SalesRep], code: 200, input: [], output: ContractBid, side_effects: [] }
  - { method: POST, path: "/jansan/contract-bids/{bid_id}/terminate", description: "AWARDED -> TERMINATED; standing-order reprice cascade", roles: [DistributorAdmin], code: 200, input: [], output: ContractBid, side_effects: ["StandingOrder reprice"] }

  # Trial programs
  - { method: POST, path: "/jansan/trial-programs", description: "Create a sample/trial program (ACTIVE)", roles: [SalesRep], code: 201, input: [facility_id, product_id, trial_start, trial_end, sample_value_cents], output: TrialProgram, side_effects: [] }
  - { method: GET, path: "/jansan/trial-programs/{trial_program_id}", description: "Fetch one trial", roles: [DistributorAdmin, SalesRep, FacilityManager], code: 200, input: [], output: TrialProgram, side_effects: [] }
  - { method: GET, path: "/jansan/trial-programs", description: "List trials with filters", roles: [DistributorAdmin, SalesRep, FacilityManager], code: 200, input: ["facility_id?", "product_id?", "conversion_order_id?", "status?", "limit?", "offset?"], output: "TrialProgram[]", side_effects: [] }
  - { method: POST, path: "/jansan/trial-programs/{trial_program_id}/convert", description: "ACTIVE -> CONVERTED; generates and places the conversion order with trial credit", roles: [FacilityManager], code: 200, input: [qty, delivery_date, fuel_index], output: TrialProgram, side_effects: ["Order created+PLACED", "trial_conversion_credit", "Facility.committed_cents += conversion total"] }

  # Ops-run checkpoint and logical clock
  - method: POST
    path: "/jansan/ops/run-daily"
    description: "Daily ops sweep in pinned order: (1) expire CERTIFIED training records past expires_at; (2) expire AWARDED bids past protection_end (+standing-order reprice); (3) expire ACTIVE trials past trial_end; (4) expire PENDING substitution proposals past expires_at (line cancel cascade); (5) generate orders from ACTIVE standing orders with next_run_date <= now (auto-place; on validation failure order stays DRAFT; next_run_date advances by frequency regardless: WEEKLY 7d, BIWEEKLY 14d, MONTHLY 30d)"
    roles: [DistributorAdmin]
    code: 200
    input: []
    output: { generated_count: integer, generated_order_ids: array, expired_training_record_ids: array, expired_bid_ids: array, expired_trial_ids: array, expired_proposal_ids: array }
    side_effects: ["expiry sweeps + cascades", "standing-order order generation", "Facility.committed_cents recompute per generated order"]
  - method: POST
    path: "/jansan/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. Monotonic: setting an earlier time is rejected with ERR_CLOCK_REGRESSION."
    roles: [DistributorAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced"]

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or entity-backed ownership mismatch (FacilityManager wrong facility; FieldTechnician wrong dispenser)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/invalid field, invalid enum member, qty < 1, inverted date window, score out of 0..100" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_forecast_profile_version != current ForecastProfile.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State-machine from-state does not allow the attempted transition (incl. terminal lockdown)" }
  - { id: ERR_FACILITY_INACTIVE, http: 409, condition: "Facility not ACTIVE for a facility-scoped mutating operation" }
  - { id: ERR_PRODUCT_UNAVAILABLE, http: 409, condition: "Order place includes a line whose product status != ACTIVE" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Allocation requires qty_on_hand >= qty and it is not (place or substitution accept)" }
  - { id: ERR_TRAINING_NOT_CERTIFIED, http: 409, condition: "dilution_required chemical lacks a CERTIFIED TrainingRecord for (facility, product)" }
  - { id: ERR_INCOMPATIBLE_PLACEMENT, http: 409, condition: "ACID/OXIDIZER chemical-family pairing in the same facility+zone among SCHEDULED/INSTALLED dispensers" }
  - { id: ERR_TECHNICIAN_WINDOW_CONFLICT, http: 409, condition: "Half-open install window overlap on the same technician" }
  - { id: ERR_PROTECTION_WINDOW_OVERLAP, http: 409, condition: "Closed-interval protection-window overlap between AWARDED bids for same group+product" }
  - { id: ERR_CLOCK_REGRESSION, http: 400, condition: "set_current_utc earlier than current logical time" }
  - { id: ERR_DUPLICATE_STANDING_ORDER, http: 409, condition: "Same facility has a non-CANCELLED standing order sharing an item product_id" }
  - { id: ERR_TRIAL_ALREADY_ACTIVE, http: 409, condition: "An ACTIVE trial already exists for (facility_id, product_id)" }
  - { id: ERR_DISCONTINUE_BLOCKED, http: 409, condition: "Product has order lines IN {PENDING, ALLOCATED, SUBSTITUTION_PENDING}" }
  - { id: ERR_ARCHIVE_BLOCKED, http: 409, condition: "Facility has open orders or non-CANCELLED standing orders" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 409, condition: "committed_cents + order.total_cents > credit_limit_cents" }

roles:
  - name: DistributorAdmin
    description: "Distributor operations administrator: catalog, facilities, technicians, training, awards, delivery/invoicing, ops runs, clock"
    identity: opaque
    exclusive_operations: [product management, facility suspend/reinstate/archive, technician creation, training certify, usage-record posting, forecast-profile create/patch, bid award/terminate, confirm-delivery, invoice, dispenser decommission, ops run-daily, clock set]
    shared_operations: [order create/place/cancel, standing-order management, usage-record create, forecast recompute, reads]
  - name: FacilityManager
    description: "Facility-side customer manager acting for exactly one facility"
    identity: entity_backed:Facility
    exclusive_operations: [substitution proposal accept/decline, trial convert]
    shared_operations: [order create/place/cancel, standing-order management, usage-record create, forecast recompute, reads]
  - name: SalesRep
    description: "Distributor sales representative owning bids and trials"
    identity: opaque
    exclusive_operations: [contract-bid create/submit/open-review/return-for-revision/mark-lost, trial-program create]
    shared_operations: [reads]
  - name: FieldTechnician
    description: "Installer who completes dispenser installs; may only complete installs assigned to them"
    identity: entity_backed:Technician
    exclusive_operations: [dispenser complete]
    shared_operations: [reads]
