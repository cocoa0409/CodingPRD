      - name: aid_cents_conservation_on_return
        grounds:
          - calculations.aid_cents_conservation
          - state_machines.AidDisbursement.SCHEDULED_to_DISBURSED
          - state_machines.AidDisbursement.DISBURSED_to_RETURNED
          - entities.AidDisbursement.fields.outstanding_amount_cents
          - entities.Student.fields.aid_returned_total_cents
        distinguishing_aspect: |
          A different conserved quantity: INTEGER AID CENTS, not units. The identity
          scheduled == outstanding + retained + returned + cancelled must hold
          exactly at every state of one 200000-cent award — SCHEDULED (200000 + 0 +
          0 + 0), DISBURSED (0 + 200000 + 0 + 0) and the compensating RETURNED
          (0 + 117126 + 82874 + 0) — and the student roll-ups must be recomputed
          from the rows rather than patched. student_return_share_cents 51186 is
          deliberately OUTSIDE the identity: adding it would break the balance,
          which is the trap this instance detects.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00.000Z"
            - "PUBLISHED program with units_per_credit_hour 3.0, aid_min_credit_equivalency 1 and the default aid_earned_pct_full_threshold 0.6000"
            - "competency IT-101 worth 4 units, mastered at 95.00 so the term has 1 credit-hour equivalency"
            - "ACTIVE student with an ACTIVE term over [2026-09-01, 2026-12-01) (91 days), tuition 375000"
            - "a 200000-cent award created and then disbursed"
            - "clock advanced to 2026-10-01 so the term closes LAPSED after 30 of 91 days"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology", units_per_credit_hour: 3.0, aid_min_credit_equivalency: 1 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-101", title: "Relational Data Modeling", unit_value: 4, level: "FOUNDATION" }
              as: Registrar
              captures: { c1_id: $.data.id, c1_v1: $.data.version }
            - call: "POST /assessment-blueprints"
              payload: { competency_id: "${c1_id}", expected_competency_version: "${c1_v1}", dimensions: [{ code: "D1", weight: 1.0000, max_score: 100, critical: false }], passing_rule: "WEIGHTED_ONLY", required_evaluator_count: 1, effective_from_utc: "2026-09-01T00:00:00.000Z" }
              as: Registrar
            - call: "POST /programs/${prog_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /students"
              payload: { program_id: "${prog_id}", full_name: "Ada Learner", email: "ada@example.edu" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /students/${stu_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /subscription-terms"
              payload: { student_id: "${stu_id}", term_start_utc: "2026-09-01T00:00:00.000Z", term_end_utc: "2026-12-01T00:00:00.000Z", tuition_cents: 375000 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /subscription-terms/${term_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /evaluators"
              payload: { full_name: "Reader One", email: "r1@example.edu", certification_level: "SENIOR" }
              as: Registrar
              captures: { ev1_id: $.data.id }
            - call: "POST /assessment-attempts"
              payload: { student_id: "${stu_id}", competency_id: "${c1_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { att_id: $.data.id }
            - call: "POST /assessment-attempts/${att_id}/submit"
              payload: { artifact_hash: "hash-it101-a", integrity_attestation_accepted: true, client_fingerprint: "fp-ada-1" }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /assessment-attempts/${att_id}/scores"
              payload: { evaluator_id: "${ev1_id}", dimension_scores: [{ code: "D1", score: 95 }] }
              as: Evaluator
              as_user_id: "${ev1_id}"
            - call: "GET /subscription-terms/${term_id}"
              payload: {}
              as: FinancialAidOfficer
              captures: { term_v2: $.data.version }
          trigger:
            - call: "POST /aid-disbursements"
              payload: { student_id: "${stu_id}", term_id: "${term_id}", scheduled_amount_cents: 200000, expected_term_version: "${term_v2}" }
              as: FinancialAidOfficer
              captures: { aid_id: $.data.id, sched_status: $.data.status, sched_out: $.data.outstanding_amount_cents, sched_ret: $.data.retained_amount_cents, sched_rtn: $.data.returned_amount_cents, sched_can: $.data.cancelled_amount_cents }
            - call: "POST /aid-disbursements/${aid_id}/disburse"
              payload: {}
              as: FinancialAidOfficer
              captures: { disb_status: $.data.status, disb_out: $.data.outstanding_amount_cents, disb_ret: $.data.retained_amount_cents, disb_rtn: $.data.returned_amount_cents, disb_can: $.data.cancelled_amount_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /subscription-terms/${term_id}/close"
              payload: { outcome: "LAPSED", effective_utc: "2026-10-01T00:00:00.000Z" }
              as: Registrar
              captures: { closed_status: $.data.status }
            - call: "GET /aid-disbursements/${aid_id}"
              payload: {}
              as: FinancialAidOfficer
              captures: { ret_status: $.data.status, ret_out: $.data.outstanding_amount_cents, ret_ret: $.data.retained_amount_cents, ret_rtn: $.data.returned_amount_cents, ret_can: $.data.cancelled_amount_cents, ret_student_share: $.data.student_return_share_cents }
            - call: "GET /students/${stu_id}/progress-summary"
              payload: {}
              as: FinancialAidOfficer
              captures: { sum_sched: $.data.aid_scheduled_total_cents, sum_ret: $.data.aid_retained_total_cents, sum_rtn: $.data.aid_returned_total_cents }
          assert:
            - "${sched_status} == SCHEDULED"
            - "${sched_out} == 200000"
            - "${sched_ret} == 0"
            - "${sched_rtn} == 0"
            - "${sched_can} == 0"
            - "${disb_status} == DISBURSED"
            - "${disb_out} == 0"
            - "${disb_ret} == 200000"
            - "${disb_rtn} == 0"
            - "${disb_can} == 0"
            - "${closed_status} == LAPSED"
            - "${ret_status} == RETURNED"
            - "${ret_out} == 0"
            - "${ret_ret} == 117126"
            - "${ret_rtn} == 82874"
            - "${ret_can} == 0"
            - "${ret_student_share} == 51186"
            - "${sum_sched} == 200000"
            - "${sum_ret} == 117126"
            - "${sum_rtn} == 82874"
            - "the identity 200000 == outstanding + retained + returned + cancelled held at all three states, and 51186 was never added into it"
