  - method: POST
    path: "/franchise/promotions/{id}/review"
    description: "Brand governance approves or rejects a promotional price (PENDING_REVIEW -> APPROVED or REJECTED). Approval is refused while the owning Franchisee.status == PROBATION. Records reviewed_by_user_id."
    roles: [BrandAdministrator]
    code: 200
    input: [decision, "note?"]
    output: Promotion
    side_effects: ["status -> APPROVED or REJECTED", "reviewed_by_user_id set to X-User-ID", "increments Promotion.version by 1"]

  - method: GET
    path: "/franchise/promotions/{id}"
    description: "Reads one promotion including discount_pct, its window and reviewed_by_user_id."
    roles: [BrandAdministrator, FranchiseOwner, ClubManager, ComplianceAuditor, BillingPartner, Member]
