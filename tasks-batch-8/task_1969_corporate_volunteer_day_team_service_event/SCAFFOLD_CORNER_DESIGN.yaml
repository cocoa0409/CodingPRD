        test_recipe:
          setup: ["project VETTED"]
          setup_api_calls:
            - { call: "POST /nonprofit-partners", payload: { name: "River Guild", contact_email: "ops@river.org" }, as: CommunityEngagementManager, captures: { np1: $.data.id } }
            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Trail Repair", min_volunteers: 1, max_volunteers: 10 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { proj1: $.data.id } }
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager }
          trigger:
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_PROJECT_TRANSITION (409)"]

      - name: error_envelope_shape_on_not_found
        claim_type: violation_to_error
        grounds: [response_envelope, "errors[ERR_PROJECT_NOT_FOUND]"]
        distinguishing_aspect: "Error responses use the fixed envelope: meta.api_request_id, meta.api_request_timestamp, response_type == error, data.error_id, data.message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /service-projects/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { err: $.data.error_id, msg: $.data.message } }
          assert:
            - "error_id == ERR_PROJECT_NOT_FOUND; message non-empty; http 404; response_type == error"

      - name: remaining_not_found_errors_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_NONPROFIT_NOT_FOUND]", "errors[ERR_VOLUNTEER_NOT_FOUND]", "errors[ERR_REGISTRATION_NOT_FOUND]", "errors[ERR_ORDER_NOT_FOUND]", "errors[ERR_VEHICLE_NOT_FOUND]", "errors[ERR_MANIFEST_NOT_FOUND]", "errors[ERR_MEAL_PLAN_NOT_FOUND]", "errors[ERR_SUPERVISION_NOT_FOUND]", "errors[ERR_SPONSORSHIP_NOT_FOUND]", "errors[ERR_IMPACT_RECORD_NOT_FOUND]", "errors[ERR_SURVEY_NOT_FOUND]"]
        distinguishing_aspect: "Every remaining typed 404 fires on a well-formed nonexistent id for its collection GET (or, for Vehicle which has no single GET, via manifest creation referencing a missing vehicle_id)."
        test_recipe:
          setup: ["empty DB; one event exists for the vehicle-via-manifest probe"]
