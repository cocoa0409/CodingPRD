          trigger:
            - call: "POST /removal-requests"
              payload: { exposure_id: "${exp_id}" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { err_occupied: $.data.error_id }
            - call: "POST /removal-requests/${rr1_id}/void"
              payload: {}
              as: PrivacyAgent
