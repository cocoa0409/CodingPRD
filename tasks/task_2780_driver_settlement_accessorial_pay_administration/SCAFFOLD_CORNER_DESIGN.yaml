  - section: state_machines
    instances:
      - name: driver_status_onboarding_to_active_sets_the_employment_axis
        claim_type: valid_transition
        grounds:
          - state_machines.Driver.ONBOARDING_to_ACTIVE
          - endpoints[POST /driver-pay/drivers/{id}/status]
          - entities.Driver.fields.employment_status
        distinguishing_aspect: |
          The employment axis starts at ONBOARDING and only POST /drivers/{id}/status with new_status ACTIVE
          moves it, and only once a package is assigned; the transition must bump Driver.version and leave the
          escrow axis untouched, because the two axes are independent.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "driver DRV_ACT created and assigned the ACTIVE package PKG_ACT, still ONBOARDING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Activation", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_act: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_act}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_act}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_act}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Ada Activate", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_act: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_act}/assign-pay-package"
              payload: { pay_package_id: "${pkg_act}" }
              as: PayrollAdmin
          trigger:
            - call: "POST /driver-pay/drivers/${drv_act}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
              captures: { drv_act_v: $.data.version }
          assert:
            - "the transition returns HTTP 200"
            - "Driver.${drv_act}.employment_status == ACTIVE"
            - "Driver.${drv_act}.pay_package_id == ${pkg_act}"
            - "Driver.${drv_act}.escrow_status == NOT_REQUIRED because PKG_ACT has escrow_required false"
            - "Driver.${drv_act}.terminated_at == null"
            - "Driver.${drv_act}.version == 3 after create, assign and activate"
      - name: driver_status_onboarding_to_suspended_is_not_a_declared_transition
        claim_type: invalid_transition
        grounds:
          - state_machines.Driver.ACTIVE_to_SUSPENDED
          - validations[priority=20]
          - errors[ERR_DRIVER_NOT_ACTIVE]
        distinguishing_aspect: |
          SUSPENDED is reachable only from ACTIVE, so suspending an ONBOARDING driver must fail with
          ERR_DRIVER_NOT_ACTIVE and HTTP 409 and leave employment_status ONBOARDING; activating first and then
          suspending must succeed, which shows the rejection was about the source state and not about the role.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "driver DRV_SUS assigned PKG_SUS and still ONBOARDING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Suspend Probe", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: false }
              as: PayrollAdmin
              captures: { pkg_sus: $.data.id }
            - call: "POST /driver-pay/pay-packages/${pkg_sus}/components"
              payload: { component_type: "PER_MILE", unit: "MILE", rate_value: 58, sequence: 1 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_sus}/components"
              payload: { component_type: "REVENUE_PERCENT", unit: "PERCENT_BPS", rate_value: 2500, sequence: 2 }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages/${pkg_sus}/activate"
              payload: {}
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers"
              payload: { legal_name: "Sal Suspend", driver_type: "LEASED_OPERATOR", home_state: "TX", per_diem_elected: false }
              as: PayrollAdmin
              captures: { drv_sus: $.data.id }
            - call: "POST /driver-pay/drivers/${drv_sus}/assign-pay-package"
              payload: { pay_package_id: "${pkg_sus}" }
              as: PayrollAdmin
          trigger:
            - call: "POST /driver-pay/drivers/${drv_sus}/status"
              payload: { new_status: "SUSPENDED" }
              as: PayrollAdmin
              captures: { err_sus: $.data.error_id }
            - call: "POST /driver-pay/drivers/${drv_sus}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
            - call: "POST /driver-pay/drivers/${drv_sus}/status"
              payload: { new_status: "SUSPENDED" }
              as: PayrollAdmin
          assert:
            - "the first attempt returns HTTP 409 with error_id ERR_DRIVER_NOT_ACTIVE"
            - "immediately after the first attempt Driver.${drv_sus}.employment_status == ONBOARDING"
            - "the ACTIVE transition returns HTTP 200"
            - "the second suspend returns HTTP 200 and Driver.${drv_sus}.employment_status == SUSPENDED"
      - name: terminated_driver_cannot_be_reactivated_or_suspended
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Driver.ACTIVE_to_TERMINATED
          - validations[priority=20]
          - entities.Driver.fields.terminated_at
        distinguishing_aspect: |
          TERMINATED is terminal on the employment axis: both ACTIVE and SUSPENDED are unreachable from it, so
          two follow-up status calls must each fail with ERR_DRIVER_NOT_ACTIVE while terminated_at keeps the
          instant of the single real transition, 2026-08-06T12:00:00.000Z.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z then moved to 2026-08-06T12:00Z"
            - "driver DRV_TRM ACTIVE on PKG_TRM, then terminated"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
