            - "${e_stale_rota} == ERR_STALE_ROTA_VERSION with HTTP 412, and no RotaEntry row for (rota, WESTA) exists at that point"
            - "${entry2_id} is created once the refreshed ${rota_v1} is supplied; GET /ill/rotas/${rota_id}/entries then returns two ACTIVE entries"
            - "${p_v0} == 1, ${p_v1} == 2 and ${p_v2} == 3 — Partner.version increments on the agreement create and again on the invoice draft"
            - "${e_stale_partner_agr} == ERR_STALE_PARTNER_VERSION with HTTP 412 — even though the second agreement's window 2026-10-01..2027-10-01 also intersects ${agr1_id}'s ACTIVE window, priority 48 answers before ERR_AGREEMENT_WINDOW_OVERLAP at priority 63"
