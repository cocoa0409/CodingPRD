# =============================================================================
# PRD Benchmark Seed Tables — task_2830_portable_restroom_restroom_trailer_rental
# §1.0–§1.7 live here. §1.8 -> SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 -> SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  2830. Portable Restroom & Restroom Trailer Rental (United Site Services): unit mix quoting by
  headcount, event duration and ADA requirement, service frequency scheduling and route density,
  placement permit, right-of-way approval and site access constraints, event surge staging with
  same-day setup/teardown windows, damage, tip-over and relocation charges, waste hauling manifests
  and disposal site limits, seasonal and construction-phase contract escalation, missed-service
  credit and route re-run

domain_name: "portable-restroom-rental"
api_prefix: ""            # flat top-level collections; every path below is absolute from root

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency

  entity_topology: flat
  # Thirteen peer entities joined by explicit foreign keys. No entity is addressed through a
  # nested URL path: every collection is top-level and every parent/child link is an FK field.

  state_machine_shape: cyclic
  # PlacementPermit loops REJECTED -> SUBMITTED (revision rounds, capped); UnitDeployment loops
  # DEPLOYED -> DEPLOYED on relocation; RentalContract carries two independent state dimensions
  # (fulfillment_state x billing_state) whose join produces the CLOSED terminal.

  relationship_patterns:
    - one_to_many          # RentalAccount -> ServiceSite -> PlacementPermit, RentalContract -> QuoteLine
    - self_referential     # ServiceVisit.rerun_of_visit_id -> ServiceVisit.id (route re-run chain)
    - cross_aggregate      # ServiceSchedule spans RentalContract and Route; WasteManifest spans Route and DisposalSite
    - polymorphic          # ChargeEvent optionally references AssetUnit or ServiceVisit depending on charge_kind

  role_model: segregation_of_duties
  # A ComplianceOfficer may both assess a ChargeEvent and resolve a disputed ChargeEvent, but never
  # the same one: the resolving X-User-ID must differ from ChargeEvent.assessed_by_user_id.
  # PermitCoordinator submits permits; only ComplianceOfficer decides them.

  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: RentalAccount
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Customer legal entity name.
        constraints: 1..120 chars, required
      - name: account_type
        type: enum
        source: input
        description: Commercial classification driving which escalation table applies.
        constraints: "one of CONSTRUCTION, EVENT, MUNICIPAL"
      - name: credit_terms_days
        type: integer
        source: input
        description: Net payment terms in days.
        default: 30
        constraints: "one of 0, 15, 30, 45"
      - name: status
        type: enum
        source: input
        description: Account standing. Set at creation; no transition endpoint.
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED"
      - name: open_credit_balance_cents
        type: integer
        source: computed
        description: Unapplied missed-service credit across all contracts of this account; see calculations.account_open_credit_balance.
        default: 0
      - name: billing_hold
        type: boolean
        source: computed
        description: True when open_credit_balance_cents >= ACCOUNT_CREDIT_HOLD_THRESHOLD_CENTS; recomputed on every credit-balance change.
        default: false

  - name: ServiceSite
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> RentalAccount.id; the account that owns this placement site."
      - name: site_label
        type: string
        source: input
        description: Human label for the placement location.
        constraints: 1..120 chars, required
      - name: jurisdiction_code
        type: string
        source: input
        description: Permitting authority code (e.g. "CA-SD-CITY").
        constraints: 2..24 chars, required
      - name: right_of_way_required
        type: boolean
        source: input
        description: True when units sit on public right-of-way, so a RIGHT_OF_WAY permit is required in addition to a PLACEMENT permit.
        default: false
      - name: access_class
        type: enum
        source: input
        description: Physical delivery access class; drives relocation multipliers and access feasibility.
        constraints: "one of OPEN_LOT, GATED, STAIR_ACCESS, CRANE_ONLY"
      - name: gate_open_minute
        type: integer
        source: input
        description: Earliest minute-of-day (0..1439, inclusive) at which a truck may enter the site.
        default: 0
        constraints: 0..1439, must be < gate_close_minute
      - name: gate_close_minute
        type: integer
        source: input
        description: Latest minute-of-day (0..1440, inclusive) by which a truck must be off the site.
        default: 1440
        constraints: 1..1440, must be > gate_open_minute
      - name: max_truck_length_ft
        type: integer
        source: input
        description: Longest tare length in feet the site can physically accept.
        default: 24
        constraints: 8..60
      - name: permit_status
        type: enum
        source: computed
        description: Worst-of roll-up over the permit kinds this site requires; see calculations.site_permit_posture.
        default: NONE
        constraints: "one of NONE, PENDING, APPROVED, REJECTED, EXPIRED"
      - name: site_posture
        type: enum
        source: computed
        description: Derived gate over every child operation at this site; see calculations.site_permit_posture.
        default: RESTRICTED
        constraints: "one of OPEN, RESTRICTED, BLOCKED"
      - name: deployed_unit_count
        type: integer
        source: computed
        description: Count of UnitDeployment rows with site_id == this site and state == DEPLOYED.
        default: 0

  - name: PlacementPermit
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> ServiceSite.id; the site this permit covers."
      - name: permit_kind
        type: enum
        source: input
        description: Which authorization this filing seeks.
        constraints: "one of PLACEMENT, RIGHT_OF_WAY"
      - name: authority_ref
        type: string
        source: input
        description: Filing reference issued by the permitting authority.
        constraints: 1..64 chars, required
      - name: effective_from
        type: string
        source: input
        description: First calendar date (YYYY-MM-DD) the permit is valid, inclusive.
      - name: effective_to
        type: string
        source: input
        description: Last calendar date (YYYY-MM-DD) the permit is valid, inclusive. Must be >= effective_from.
      - name: status
        type: enum
        source: system
        description: Permit lifecycle state; see state_machines.PlacementPermit.
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, APPROVED, REJECTED, EXPIRED"
      - name: revision_round
        type: integer
        source: system
        description: Number of times this permit has been submitted. Starts at 0, increments on every SUBMIT including resubmission after rejection.
        default: 0
      - name: rejection_reason
        type: string
        source: input
        description: Authority rejection text, supplied on the reject transition; null until first rejection.
        default: null
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the PermitCoordinator on the most recent SUBMIT.
        default: null

  - name: AssetUnit
    parent: null
    common_fields: true
    fields:
      - name: asset_tag
        type: string
        source: input
        description: Yard-unique asset tag.
        constraints: 1..32 chars, unique across AssetUnit
      - name: unit_class
        type: enum
        source: input
        description: Physical unit class; drives rates, per-visit service cost and damage base.
        constraints: "one of STANDARD_PORTABLE, ADA_PORTABLE, HANDWASH_STATION, TRAILER_2STALL, TRAILER_8STALL"
      - name: yard_code
        type: string
        source: input
        description: Home yard code.
        constraints: 2..16 chars, required
      - name: tare_length_ft
        type: integer
        source: input
        description: Transport length in feet, compared against ServiceSite.max_truck_length_ft.
        constraints: 4..60
      - name: status
        type: enum
        source: system
        description: Asset lifecycle state; see state_machines.AssetUnit.
        default: IN_YARD
        constraints: "one of IN_YARD, DEPLOYED, IN_REPAIR, RETIRED"
      - name: damage_strikes
        type: integer
        source: computed
        description: Count of DAMAGE ChargeEvents assessed against this unit in state ASSESSED or UPHELD.
        default: 0
      - name: tip_over_count
        type: integer
        source: computed
        description: Count of TIP_OVER ChargeEvents assessed against this unit in state ASSESSED or UPHELD.
        default: 0

  - name: RentalContract
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> RentalAccount.id; billing account."
      - name: site_id
        type: string
        source: input
        description: "FK -> ServiceSite.id; placement site for every unit on this contract."
      - name: contract_kind
        type: enum
        source: input
        description: Selects the demand model in calculations.unit_mix_quote.
        constraints: "one of EVENT, CONSTRUCTION"
      - name: term_start
        type: string
        source: input
        description: First rental date (YYYY-MM-DD), inclusive.
      - name: term_end
        type: string
        source: input
        description: Last rental date (YYYY-MM-DD), inclusive. Must be >= term_start.
      - name: headcount
        type: integer
        source: input
        description: Peak simultaneous population to serve; primary quoting driver and trailer-tier trigger.
        constraints: 1..20000
      - name: event_duration_hours
        type: integer
        source: input
        description: Hours the population is on site per day. Used only when contract_kind == EVENT.
        constraints: 1..24
      - name: ada_required
        type: boolean
        source: input
        description: True when the unit mix must include ADA_PORTABLE units.
        default: false
      - name: service_frequency_per_week
        type: integer
        source: input
        description: Pump-and-restock visits per week; drives the CONSTRUCTION demand model and the service interval.
        constraints: 1..7
      - name: season_code
        type: enum
        source: input
        description: Seasonal escalation bucket applied at invoicing.
        constraints: "one of PEAK, SHOULDER, OFF"
      - name: construction_phase
        type: enum
        source: input
        description: Construction-phase escalation bucket. EVENT contracts MUST pass EVENT_NA.
        constraints: "one of SITEWORK, VERTICAL, FINISHES, EVENT_NA"
      - name: fulfillment_state
        type: enum
        source: system
        description: Fulfillment dimension of the contract; see state_machines.RentalContract.
        default: DRAFT
        constraints: "one of DRAFT, QUOTED, ACTIVE, DEMOBILIZED, CLOSED"
      - name: billing_state
        type: enum
        source: system
        description: Billing dimension of the contract, evolving independently of fulfillment_state.
        default: UNBILLED
        constraints: "one of UNBILLED, INVOICED, REBILL_REQUIRED, SETTLED"
      - name: quoted_cents
        type: integer
        source: computed
        description: PROVISIONAL unit-mix total; see calculations.unit_mix_quote variant provisional_projection.
        default: 0
      - name: reconciled_cents
        type: integer
        source: computed
        description: RECONCILED unit-mix total from actual deployments; see calculations.unit_mix_quote variant reconciled_actual.
        default: 0
      - name: invoice_subtotal_cents
        type: integer
        source: computed
        description: Escalated line subtotal; see calculations.line_escalation_invoice.
        default: 0
      - name: charge_debits_cents
        type: integer
        source: computed
        description: Sum of non-credit ChargeEvent amounts in state ASSESSED or UPHELD on this contract.
        default: 0
      - name: credit_accrued_cents
        type: integer
        source: computed
        description: Sum of MISSED_SERVICE_CREDIT ChargeEvent amounts in state ASSESSED or UPHELD on this contract.
        default: 0
      - name: net_billable_cents
        type: integer
        source: computed
        description: invoice_subtotal_cents + charge_debits_cents - credit_accrued_cents; recomputed on every charge-state change.
        default: 0

  - name: QuoteLine
    parent: null
    common_fields: false
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> RentalContract.id; the contract this line belongs to."
      - name: unit_class
        type: enum
        source: computed
        description: Unit class this line prices.
        constraints: "one of STANDARD_PORTABLE, ADA_PORTABLE, HANDWASH_STATION, TRAILER_2STALL, TRAILER_8STALL"
      - name: quantity
        type: integer
        source: computed
        description: Units of this class produced by calculations.unit_mix_quote. Lines with quantity 0 are not persisted.
      - name: unit_rate_cents
        type: integer
        source: computed
        description: Per-unit term rate taken from calculations.unit_mix_quote constants RATE_<UNIT_CLASS>_CENTS.
      - name: extended_cents
        type: integer
        source: computed
        description: quantity * unit_rate_cents, exact integer cents, no rounding needed.
      - name: escalated_cents
        type: integer
        source: computed
        description: Per-line escalated amount written at invoicing; see calculations.line_escalation_invoice. 0 until the contract is invoiced.
        default: 0
      - name: quote_variant
        type: enum
        source: computed
        description: Which variant of calculations.unit_mix_quote produced this line.
        constraints: "one of PROVISIONAL, RECONCILED"
      - name: is_superseded
        type: boolean
        source: computed
        description: True once a later quote run replaced this line. Superseded lines are excluded from every calculation input set.
        default: false

  - name: Route
    parent: null
    common_fields: true
    fields:
      - name: route_code
        type: string
        source: input
        description: Route identifier code.
        constraints: 1..24 chars, unique across Route
      - name: service_day
        type: enum
        source: input
        description: Weekday this route runs.
        constraints: "one of MON, TUE, WED, THU, FRI, SAT, SUN"
      - name: truck_capacity_units
        type: integer
        source: input
        description: Maximum serviceable units the truck can cover on one run; denominator of both density variants.
        constraints: 1..400
      - name: waste_capacity_gallons
        type: integer
        source: input
        description: Truck tank capacity in gallons.
        constraints: 100..6000
      - name: status
        type: enum
        source: input
        description: Route availability. Set at creation; no transition endpoint.
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED"
      - name: committed_units
        type: integer
        source: computed
        description: Sum of ServiceSchedule.units_on_route over schedules on this route with state == ACTIVE.
        default: 0
      - name: density_planned_pct
        type: integer
        source: computed
        description: PLANNED density variant; see calculations.route_density_score.
        default: 0
      - name: density_realized_pct
        type: integer
        source: computed
        description: REALIZED density variant; see calculations.route_density_score.
        default: 0
      - name: last_run_date
        type: string
        source: system
        description: Latest scheduled_date (YYYY-MM-DD) among ServiceVisit rows on this route that have left PLANNED; null until the first dispatch.
        default: null

  - name: ServiceSchedule
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> RentalContract.id; the contract being serviced."
      - name: route_id
        type: string
        source: input
        description: "FK -> Route.id; the route carrying this schedule."
      - name: service_day
        type: enum
        source: input
        description: Weekday of service. MUST equal Route.service_day.
        constraints: "one of MON, TUE, WED, THU, FRI, SAT, SUN"
      - name: window_start_minute
        type: integer
        source: input
        description: Nominal service window open, minute-of-day, inclusive.
        constraints: 0..1439
      - name: window_end_minute
        type: integer
        source: input
        description: Nominal service window close, minute-of-day, exclusive. Must be > window_start_minute.
        constraints: 1..1440
      - name: units_on_route
        type: integer
        source: computed
        description: Sum of QuoteLine.quantity over the contract's non-superseded PROVISIONAL lines at schedule-creation time; frozen thereafter.
      - name: state
        type: enum
        source: system
        description: Schedule lifecycle; see state_machines.ServiceSchedule.
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED, TERMINATED"

  - name: ServiceVisit
    parent: null
    common_fields: true
    fields:
      - name: schedule_id
        type: string
        source: input
        description: "FK -> ServiceSchedule.id; the schedule this visit realizes."
      - name: route_id
        type: string
        source: computed
        description: "FK -> Route.id; denormalized from the schedule's route_id at creation and never changed."
      - name: rerun_of_visit_id
        type: string
        source: computed
        description: "FK -> ServiceVisit.id; set on a re-run visit to the MISSED visit it replaces; null on first-run visits."
        default: null
      - name: visit_kind
        type: enum
        source: input
        description: Which surge-staging or service leg this visit represents. RERUN is set by the system only.
        constraints: "one of SETUP, SERVICE, TEARDOWN, RERUN"
      - name: scheduled_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) of the visit.
      - name: window_start_minute
        type: integer
        source: input
        description: Arrival window open, minute-of-day, inclusive.
        constraints: 0..1439
      - name: window_end_minute
        type: integer
        source: input
        description: Departure window close, minute-of-day, exclusive. Must be > window_start_minute.
        constraints: 1..1440
      - name: state
        type: enum
        source: system
        description: Visit lifecycle; see state_machines.ServiceVisit.
        default: PLANNED
        constraints: "one of PLANNED, EN_ROUTE, SERVICED, MISSED, CANCELLED, RERUN_SCHEDULED"
      - name: gallons_pumped
        type: integer
        source: input
        description: Gallons pumped, supplied on the complete transition. 0 until then.
        default: 0
        constraints: 0..6000
      - name: units_serviced
        type: integer
        source: computed
        description: ServiceSchedule.units_on_route when the visit reaches SERVICED; 0 in every other state.
        default: 0
      - name: missed_reason
        type: string
        source: input
        description: Free text supplied on the mark-missed transition; null otherwise.
        default: null

  - name: DisposalSite
    parent: null
    common_fields: true
    fields:
      - name: site_code
        type: string
        source: input
        description: Disposal facility code.
        constraints: 1..24 chars, unique across DisposalSite
      - name: daily_gallon_cap
        type: integer
        source: input
        description: Maximum gallons this facility will take per calendar date.
        constraints: 100..500000
      - name: accepted_waste_classes
        type: array
        source: input
        description: Waste classes the facility accepts; each element one of GREYWATER, BLACKWATER, MIXED.
        constraints: non-empty array of distinct enum members
      - name: status
        type: enum
        source: input
        description: Facility intake status. Set at creation; no transition endpoint.
        default: ACCEPTING
        constraints: "one of ACCEPTING, CLOSED"
      - name: committed_gallons_today
        type: integer
        source: computed
        description: Gallons already committed at this facility for the current logical-clock date; see calculations.disposal_site_committed_gallons.
        default: 0

  - name: WasteManifest
    parent: null
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: "FK -> Route.id; the route whose pumped volume this manifest reports."
      - name: disposal_site_id
        type: string
        source: input
        description: "FK -> DisposalSite.id; the facility receiving the load."
      - name: manifest_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) of the haul; selects which ServiceVisit rows roll up.
      - name: waste_class
        type: enum
        source: input
        description: Waste classification of the load.
        constraints: "one of GREYWATER, BLACKWATER, MIXED"
      - name: gallons_total
        type: integer
        source: computed
        description: Rolled-up gallons; see calculations.manifest_gallons_total. Frozen at SEAL.
        default: 0
      - name: state
        type: enum
        source: system
        description: Manifest lifecycle; see state_machines.WasteManifest.
        default: OPEN
        constraints: "one of OPEN, SEALED, ACCEPTED"

  - name: ChargeEvent
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> RentalContract.id; the contract billed or credited."
      - name: asset_unit_id
        type: string
        source: input
        description: "FK -> AssetUnit.id; required for DAMAGE and TIP_OVER, null otherwise."
        default: null
      - name: source_visit_id
        type: string
        source: computed
        description: "FK -> ServiceVisit.id; set by the system on MISSED_SERVICE_CREDIT charges to the missed visit, null otherwise."
        default: null
      - name: charge_kind
        type: enum
        source: input
        description: Kind of financial event. MISSED_SERVICE_CREDIT is system-generated only.
        constraints: "one of DAMAGE, TIP_OVER, RELOCATION, MISSED_SERVICE_CREDIT"
      - name: severity
        type: enum
        source: input
        description: Damage severity; required when charge_kind == DAMAGE, null otherwise.
        default: null
        constraints: "one of MINOR, MODERATE, TOTAL_LOSS"
      - name: amount_cents
        type: integer
        source: computed
        description: Charge or credit magnitude in cents, always non-negative; see calculations.damage_tip_over_charge, calculations.relocation_charge, calculations.missed_service_credit.
      - name: state
        type: enum
        source: system
        description: Charge lifecycle; see state_machines.ChargeEvent.
        default: ASSESSED
        constraints: "one of ASSESSED, DISPUTED, UPHELD, WAIVED"
      - name: assessed_by_user_id
        type: string
        source: system
        description: X-User-ID that created the charge; "SYSTEM" for system-generated credits.
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID that upheld or waived the charge; null until resolution. MUST differ from assessed_by_user_id.
        default: null
      - name: assessed_at
        type: datetime
        source: system
        description: Logical-clock instant of assessment (ISO 8601 UTC, three fractional digits); anchors the dispute window.
      - name: dispute_reason
        type: string
        source: input
        description: Customer text supplied on the dispute transition; null otherwise.
        default: null
      - name: resolution_note
        type: string
        source: input
        description: Officer text supplied on uphold or waive; null otherwise.
        default: null

  - name: UnitDeployment
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> RentalContract.id; contract the unit is committed to."
      - name: asset_unit_id
        type: string
        source: input
        description: "FK -> AssetUnit.id; the physical unit committed."
      - name: site_id
        type: string
        source: computed
        description: "FK -> ServiceSite.id; current placement site. Seeded from the contract's site_id and rewritten by relocation."
      - name: deploy_from
        type: string
        source: input
        description: First date (YYYY-MM-DD) the unit is committed, inclusive.
      - name: deploy_to
        type: string
        source: input
        description: Last date (YYYY-MM-DD) the unit is committed, inclusive. Must be >= deploy_from.
      - name: state
        type: enum
        source: system
        description: Deployment lifecycle; see state_machines.UnitDeployment.
        default: RESERVED
        constraints: "one of RESERVED, DEPLOYED, RETURNED"
      - name: relocation_count
        type: integer
        source: system
        description: Monotonic counter incremented by exactly 1 by each successful relocate transition on this deployment; never decremented.
        default: 0

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PlacementPermit
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    shape: cyclic
    note: |
      REJECTED -> SUBMITTED is a true cycle: each pass increments revision_round and the third
      resubmission is refused (PERMIT_MAX_REVISION_ROUNDS = 3).
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /placement-permits/{id}/submit"
        actor: PermitCoordinator
        preconditions:
          - "permit.status == DRAFT"
          - "site.site_posture != BLOCKED is NOT required — a blocked site may still refile"
        side_effects:
          - "permit.revision_round += 1 (0 -> 1)"
          - "permit.submitted_by_user_id = X-User-ID"
          - "recompute ServiceSite.permit_status and ServiceSite.site_posture for permit.site_id (calculations.site_permit_posture); SUBMITTED maps to PENDING"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /placement-permits/{id}/submit"
        actor: PermitCoordinator
        preconditions:
          - "permit.status == REJECTED"
          - "permit.revision_round < PERMIT_MAX_REVISION_ROUNDS (3), else ERR_PERMIT_REVISION_LIMIT"
        side_effects:
          - "permit.revision_round += 1"
          - "permit.submitted_by_user_id = X-User-ID"
          - "recompute ServiceSite.permit_status and ServiceSite.site_posture for permit.site_id; the site leaves BLOCKED and becomes RESTRICTED while PENDING"
        note: "Revision loop. Rejection text from the prior round is retained in permit.rejection_reason."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /placement-permits/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "permit.status == SUBMITTED"
          - "current logical-clock date <= permit.effective_to"
        side_effects:
          - "recompute ServiceSite.permit_status and ServiceSite.site_posture for permit.site_id"
          - "if the recomputed site_posture becomes OPEN, every ServiceSchedule of that site's contracts in state SUSPENDED is left untouched (resumption is not automatic)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /placement-permits/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "permit.status == SUBMITTED"
        side_effects:
          - "permit.rejection_reason = request rejection_reason"
          - "LINK 1 -> ServiceSite: recompute ServiceSite.permit_status for permit.site_id; the worst-of roll-up now yields REJECTED, so ServiceSite.site_posture becomes BLOCKED"
          - "LINK 2 (caused by site_posture becoming BLOCKED, not by the reject itself) -> ServiceSchedule: every ServiceSchedule whose contract.site_id == permit.site_id and whose state == ACTIVE transitions ACTIVE -> SUSPENDED, ordered by ServiceSchedule.created_at ASC"
          - "LINK 3 (caused by each schedule leaving ACTIVE) -> Route: Route.committed_units is recomputed for each affected route, then Route.density_planned_pct is recomputed (calculations.route_density_score)"
          - "LINK 2b (caused by the same schedule suspension) -> ServiceVisit: every ServiceVisit on those schedules with state == PLANNED and scheduled_date >= current logical-clock date transitions PLANNED -> CANCELLED, ordered by ServiceVisit.created_at ASC"
      - from: APPROVED
        to: EXPIRED
        trigger: "system sweep inside POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "permit.status == APPROVED"
          - "new logical-clock calendar date > permit.effective_to"
        side_effects:
          - "recompute ServiceSite.permit_status and ServiceSite.site_posture for permit.site_id; EXPIRED yields site_posture BLOCKED"
          - "the same LINK 2 / LINK 3 / LINK 2b cascade as SUBMITTED_to_REJECTED runs for the affected site"
        note: "The only automatic transition in this scaffold; makes seasonal permit lapse observable."

  - entity: AssetUnit
    initial_state: IN_YARD
    terminal_states: [RETIRED]
    shape: branching
    transitions:
      - from: IN_YARD
        to: DEPLOYED
        trigger: "system side effect of POST /rental-contracts/{id}/activate"
        actor: system
        preconditions:
          - "a UnitDeployment referencing this unit is transitioning RESERVED -> DEPLOYED"
          - "unit.status == IN_YARD"
        side_effects:
          - "recompute ServiceSite.deployed_unit_count for the deployment's site_id"
      - from: DEPLOYED
        to: IN_YARD
        trigger: "system side effect of POST /rental-contracts/{id}/demobilize"
        actor: system
        preconditions:
          - "the unit's UnitDeployment is transitioning DEPLOYED -> RETURNED"
          - "unit.status == DEPLOYED"
        side_effects:
          - "recompute ServiceSite.deployed_unit_count for the deployment's site_id"
      - from: DEPLOYED
        to: IN_REPAIR
        trigger: "system side effect of POST /charge-events (charge_kind DAMAGE or TIP_OVER)"
        actor: system
        preconditions:
          - "after the charge is persisted, unit.damage_strikes + unit.tip_over_count >= UNIT_REPAIR_STRIKE_THRESHOLD (3)"
          - "the charge's severity != TOTAL_LOSS"
        side_effects:
          - "recompute ServiceSite.deployed_unit_count for the site of every DEPLOYED UnitDeployment of this unit"
      - from: DEPLOYED
        to: RETIRED
        trigger: "system side effect of POST /charge-events with charge_kind == DAMAGE and severity == TOTAL_LOSS"
        actor: system
        preconditions:
          - "unit.status == DEPLOYED"
        side_effects:
          - "every UnitDeployment of this unit in state RESERVED or DEPLOYED transitions to RETURNED"
          - "recompute ServiceSite.deployed_unit_count for each affected site"
      - from: IN_REPAIR
        to: IN_YARD
        trigger: "system side effect of POST /charge-events/{id}/waive on the DAMAGE or TIP_OVER charge that pushed the unit over the threshold"
        actor: system
        preconditions:
          - "unit.status == IN_REPAIR"
          - "after the waive, unit.damage_strikes + unit.tip_over_count < UNIT_REPAIR_STRIKE_THRESHOLD (3)"
        side_effects: ["none beyond the status write"]

  - entity: UnitDeployment
    initial_state: RESERVED
    terminal_states: [RETURNED]
    shape: cyclic
    note: "DEPLOYED -> DEPLOYED is a self-loop: relocation keeps the deployment alive but rewrites site_id."
    transitions:
      - from: RESERVED
        to: DEPLOYED
        trigger: "system side effect of POST /rental-contracts/{id}/activate"
        actor: system
        preconditions:
          - "deployment.state == RESERVED"
          - "deployment.contract.fulfillment_state is transitioning QUOTED -> ACTIVE"
        side_effects:
          - "AssetUnit IN_YARD -> DEPLOYED for deployment.asset_unit_id"
          - "recompute ServiceSite.deployed_unit_count for deployment.site_id"
      - from: DEPLOYED
        to: DEPLOYED
        trigger: "POST /unit-deployments/{id}/relocate"
        actor: DispatchPlanner
        preconditions:
          - "deployment.state == DEPLOYED"
          - "destination ServiceSite.site_posture != BLOCKED"
          - "destination ServiceSite.account_id == deployment.contract.account_id"
          - "AssetUnit.tare_length_ft <= destination ServiceSite.max_truck_length_ft, else ERR_SITE_ACCESS_INFEASIBLE"
        side_effects:
          - "deployment.site_id = request destination_site_id"
          - "deployment.relocation_count += 1"
          - "create ChargeEvent (charge_kind RELOCATION, state ASSESSED, contract_id = deployment.contract_id, asset_unit_id = deployment.asset_unit_id, amount_cents from calculations.relocation_charge)"
          - "recompute RentalContract.charge_debits_cents and RentalContract.net_billable_cents for deployment.contract_id"
          - "recompute ServiceSite.deployed_unit_count for BOTH the previous site_id and the destination site_id"
      - from: DEPLOYED
        to: RETURNED
        trigger: "system side effect of POST /rental-contracts/{id}/demobilize"
        actor: system
        preconditions:
          - "deployment.state == DEPLOYED"
          - "deployment.contract.fulfillment_state is transitioning ACTIVE -> DEMOBILIZED"
        side_effects:
          - "AssetUnit DEPLOYED -> IN_YARD for deployment.asset_unit_id"
          - "recompute ServiceSite.deployed_unit_count for deployment.site_id"
      - from: RESERVED
        to: RETURNED
        trigger: "system side effect of POST /charge-events with charge_kind == DAMAGE and severity == TOTAL_LOSS on this unit"
        actor: system
        preconditions:
          - "deployment.state == RESERVED"
        side_effects:
          - "recompute ServiceSite.deployed_unit_count for deployment.site_id"

  - entity: RentalContract
    initial_state: DRAFT
    terminal_states: [CLOSED]
    shape: parallel
    note: |
      Two independent state dimensions live on the same row. Dimension A is `fulfillment_state`
      (DRAFT -> QUOTED -> ACTIVE -> DEMOBILIZED), dimension B is `billing_state`
      (UNBILLED -> INVOICED -> SETTLED, with INVOICED -> REBILL_REQUIRED -> INVOICED driven by
      credit cascades). Neither dimension constrains the other's ordering; the join
      (fulfillment_state == DEMOBILIZED AND billing_state == SETTLED) auto-writes
      fulfillment_state = CLOSED. QUOTED -> QUOTED is a supersede self-loop guarded by OCC.
    transitions:
      - from: DRAFT
        to: QUOTED
        dimension: fulfillment_state
        trigger: "POST /rental-contracts/{id}/quote"
        actor: SalesRep
        preconditions:
          - "contract.fulfillment_state == DRAFT"
          - "request expected_contract_version == contract.version, else ERR_STALE_CONTRACT_VERSION"
          - "calculations.unit_mix_quote yields at least one line with quantity >= 1"
        side_effects:
          - "create one QuoteLine per unit_class with quantity >= 1 (quote_variant PROVISIONAL, is_superseded false), ordered STANDARD_PORTABLE, ADA_PORTABLE, HANDWASH_STATION, TRAILER_2STALL, TRAILER_8STALL"
          - "recompute RentalContract.quoted_cents (calculations.unit_mix_quote) and RentalContract.net_billable_cents"
          - "increments RentalContract.version by 1"
      - from: QUOTED
        to: QUOTED
        dimension: fulfillment_state
        trigger: "POST /rental-contracts/{id}/quote"
        actor: SalesRep
        preconditions:
          - "contract.fulfillment_state == QUOTED"
          - "request expected_contract_version == contract.version, else ERR_STALE_CONTRACT_VERSION"
        side_effects:
          - "every QuoteLine of this contract with quote_variant == PROVISIONAL and is_superseded == false is set is_superseded = true"
          - "create the fresh PROVISIONAL QuoteLine set exactly as in DRAFT_to_QUOTED"
          - "recompute RentalContract.quoted_cents and RentalContract.net_billable_cents"
          - "increments RentalContract.version by 1"
        note: "Supersede self-loop; the OCC rule quote-supersede-stale-contract guards it."
      - from: QUOTED
        to: ACTIVE
        dimension: fulfillment_state
        trigger: "POST /rental-contracts/{id}/activate"
        actor: SalesRep
        preconditions:
          - "contract.fulfillment_state == QUOTED"
          - "ServiceSite(contract.site_id).site_posture == OPEN; BLOCKED yields ERR_SITE_POSTURE_BLOCKED and RESTRICTED yields ERR_SITE_POSTURE_RESTRICTED"
          - "RentalAccount(contract.account_id).status == ACTIVE, else ERR_INVALID_STATE_TRANSITION"
          - "RentalAccount(contract.account_id).billing_hold == false, else ERR_ACCOUNT_BILLING_HOLD"
        side_effects:
          - "every UnitDeployment with contract_id == this contract and state == RESERVED transitions RESERVED -> DEPLOYED, ordered by UnitDeployment.created_at ASC"
          - "each of those transitions moves its AssetUnit IN_YARD -> DEPLOYED"
          - "recompute ServiceSite.deployed_unit_count for contract.site_id"
      - from: ACTIVE
        to: DEMOBILIZED
        dimension: fulfillment_state
        trigger: "POST /rental-contracts/{id}/demobilize"
        actor: DispatchPlanner
        preconditions:
          - "contract.fulfillment_state == ACTIVE"
          - "at least one UnitDeployment with contract_id == this contract has state DEPLOYED or RETURNED, else ERR_RECONCILIATION_NO_DEPLOYMENTS"
        side_effects:
          - "every QuoteLine of this contract with is_superseded == false is set is_superseded = true"
          - "create the RECONCILED QuoteLine set from actual deployments (calculations.unit_mix_quote variant reconciled_actual)"
          - "recompute RentalContract.reconciled_cents and RentalContract.net_billable_cents"
          - "every UnitDeployment of this contract in state DEPLOYED transitions DEPLOYED -> RETURNED (each moving its AssetUnit DEPLOYED -> IN_YARD), ordered by UnitDeployment.created_at ASC"
          - "every ServiceSchedule of this contract in state ACTIVE or SUSPENDED transitions to TERMINATED; each ACTIVE -> TERMINATED hop recomputes Route.committed_units and Route.density_planned_pct"
          - "if billing_state == SETTLED, fulfillment_state is written CLOSED instead of DEMOBILIZED in the same request"
      - from: UNBILLED
        to: INVOICED
        dimension: billing_state
        trigger: "POST /rental-contracts/{id}/invoice"
        actor: SalesRep
        preconditions:
          - "contract.billing_state == UNBILLED"
          - "contract.fulfillment_state IN {ACTIVE, DEMOBILIZED}, else ERR_INVALID_STATE_TRANSITION"
          - "at least one QuoteLine with is_superseded == false exists for this contract"
        side_effects:
          - "write QuoteLine.escalated_cents on every non-superseded line (calculations.line_escalation_invoice)"
          - "recompute RentalContract.invoice_subtotal_cents and RentalContract.net_billable_cents"
      - from: REBILL_REQUIRED
        to: INVOICED
        dimension: billing_state
        trigger: "POST /rental-contracts/{id}/invoice"
        actor: SalesRep
        preconditions:
          - "contract.billing_state == REBILL_REQUIRED"
          - "at least one QuoteLine with is_superseded == false exists for this contract"
        side_effects:
          - "rewrite QuoteLine.escalated_cents on every non-superseded line (calculations.line_escalation_invoice)"
          - "recompute RentalContract.invoice_subtotal_cents and RentalContract.net_billable_cents"
        note: "Second half of the billing cycle; a credit landing on an INVOICED contract forces this loop."
      - from: INVOICED
        to: REBILL_REQUIRED
        dimension: billing_state
        trigger: "system side effect of a ChargeEvent becoming ASSESSED, UPHELD or WAIVED on this contract"
        actor: system
        preconditions:
          - "contract.billing_state == INVOICED"
        side_effects:
          - "no further writes; the flag records that the issued invoice no longer matches net_billable_cents"
      - from: INVOICED
        to: SETTLED
        dimension: billing_state
        trigger: "POST /rental-contracts/{id}/settle-invoice"
        actor: PlatformAdmin
        preconditions:
          - "contract.billing_state == INVOICED"
        side_effects:
          - "if fulfillment_state == DEMOBILIZED, fulfillment_state is written CLOSED in the same request"

  - entity: ServiceSchedule
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    shape: branching
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /service-schedules/{id}/suspend"
        actor: DispatchPlanner
        preconditions:
          - "schedule.state == ACTIVE"
        side_effects:
          - "recompute Route.committed_units for schedule.route_id (the schedule's units_on_route leaves the sum)"
          - "recompute Route.density_planned_pct for schedule.route_id"
          - "every ServiceVisit of this schedule with state == PLANNED and scheduled_date >= current logical-clock date transitions PLANNED -> CANCELLED, ordered by ServiceVisit.created_at ASC"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade from ServiceSite.site_posture becoming BLOCKED"
        actor: system
        preconditions:
          - "schedule.state == ACTIVE"
          - "schedule.contract.site_id is the site whose posture just became BLOCKED"
        side_effects:
          - "identical to the DispatchPlanner-triggered suspension"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system side effect of POST /rental-contracts/{id}/demobilize"
        actor: system
        preconditions:
          - "schedule.state == ACTIVE"
        side_effects:
          - "recompute Route.committed_units and Route.density_planned_pct for schedule.route_id"
          - "every ServiceVisit of this schedule with state == PLANNED transitions PLANNED -> CANCELLED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "system side effect of POST /rental-contracts/{id}/demobilize"
        actor: system
        preconditions:
          - "schedule.state == SUSPENDED"
        side_effects:
          - "no Route.committed_units change (a SUSPENDED schedule already left the sum)"

  - entity: ServiceVisit
    initial_state: PLANNED
    terminal_states: [SERVICED, CANCELLED, RERUN_SCHEDULED]
    shape: branching
    transitions:
      - from: PLANNED
        to: EN_ROUTE
        trigger: "POST /service-visits/{id}/dispatch"
        actor: DriverOperator
        preconditions:
          - "visit.state == PLANNED"
          - "Route(visit.route_id).status == ACTIVE, else ERR_ROUTE_SUSPENDED"
          - "ServiceSchedule(visit.schedule_id).state == ACTIVE, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "Route.last_run_date = max(current Route.last_run_date, visit.scheduled_date) compared as YYYY-MM-DD strings; null is treated as lower than any date"
      - from: EN_ROUTE
        to: SERVICED
        trigger: "POST /service-visits/{id}/complete"
        actor: DriverOperator
        preconditions:
          - "visit.state == EN_ROUTE"
        side_effects:
          - "visit.gallons_pumped = request gallons_pumped"
          - "visit.units_serviced = ServiceSchedule(visit.schedule_id).units_on_route"
          - "recompute Route.density_realized_pct for visit.route_id (calculations.route_density_score variant realized_serviced)"
          - "recompute WasteManifest.gallons_total for every WasteManifest with route_id == visit.route_id, manifest_date == visit.scheduled_date and state == OPEN"
      - from: PLANNED
        to: MISSED
        trigger: "POST /service-visits/{id}/mark-missed"
        actor: DispatchPlanner
        preconditions:
          - "visit.state == PLANNED"
          - "ServiceSchedule(visit.schedule_id).state == ACTIVE, else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "visit.missed_reason = request missed_reason; visit.units_serviced stays 0"
          - "LINK 1 -> ChargeEvent: create a ChargeEvent (charge_kind MISSED_SERVICE_CREDIT, state ASSESSED, contract_id = schedule.contract_id, source_visit_id = visit.id, assessed_by_user_id = \"SYSTEM\", assessed_at = current logical-clock instant, amount_cents from calculations.missed_service_credit evaluated against the PRE-transition Route.density_planned_pct)"
          - "LINK 2 (caused by the new ChargeEvent row, not by the visit write) -> RentalContract: recompute RentalContract.credit_accrued_cents and RentalContract.net_billable_cents for schedule.contract_id; if that contract's billing_state == INVOICED it transitions INVOICED -> REBILL_REQUIRED"
          - "LINK 3 (caused by the contract's credit_accrued_cents change) -> RentalAccount: recompute RentalAccount.open_credit_balance_cents (calculations.account_open_credit_balance) for the contract's account_id"
          - "LINK 4 (caused by the account's new balance) -> RentalAccount.billing_hold: set billing_hold = (open_credit_balance_cents >= ACCOUNT_CREDIT_HOLD_THRESHOLD_CENTS)"
          - "AFTER the credit is persisted: recompute Route.density_realized_pct for visit.route_id"
      - from: EN_ROUTE
        to: MISSED
        trigger: "POST /service-visits/{id}/mark-missed"
        actor: DispatchPlanner
        preconditions:
          - "visit.state == EN_ROUTE"
        side_effects:
          - "identical LINK 1..LINK 4 cascade as PLANNED_to_MISSED"
      - from: PLANNED
        to: CANCELLED
        trigger: "system cascade from a ServiceSchedule leaving ACTIVE (suspend, site-posture block, or contract demobilize)"
        actor: system
        preconditions:
          - "visit.state == PLANNED"
          - "visit.scheduled_date >= current logical-clock date when the cascade came from a suspension; unconditional when it came from demobilization"
        side_effects:
          - "no credit is created — cancellation is not a missed service"
      - from: MISSED
        to: RERUN_SCHEDULED
        trigger: "POST /service-visits/{id}/schedule-rerun"
        actor: DispatchPlanner
        preconditions:
          - "visit.state == MISSED"
          - "ServiceSchedule(visit.schedule_id).state == ACTIVE, else ERR_INVALID_STATE_TRANSITION"
          - "the request rerun_date and window must clear calculations-independent route-window overlap on Route(visit.route_id), else ERR_ROUTE_WINDOW_CONFLICT"
        side_effects:
          - "create a new ServiceVisit (visit_kind RERUN, state PLANNED, schedule_id = visit.schedule_id, route_id = visit.route_id, rerun_of_visit_id = visit.id, scheduled_date = request rerun_date, windows from the request)"
          - "no new credit and no reversal of the original credit"

  - entity: WasteManifest
    initial_state: OPEN
    terminal_states: [ACCEPTED]
    shape: linear
    transitions:
      - from: OPEN
        to: SEALED
        trigger: "POST /waste-manifests/{id}/seal"
        actor: DriverOperator
        preconditions:
          - "manifest.state == OPEN"
          - "request expected_route_version == Route(manifest.route_id).version, else ERR_STALE_ROUTE_VERSION"
          - "DisposalSite(manifest.disposal_site_id).status == ACCEPTING, else ERR_DISPOSAL_SITE_CLOSED"
          - "manifest.waste_class is a member of DisposalSite.accepted_waste_classes, else ERR_DISPOSAL_CLASS_NOT_ACCEPTED"
          - "at least one ServiceVisit with route_id == manifest.route_id, scheduled_date == manifest.manifest_date and state == SERVICED exists, else ERR_MANIFEST_NO_SERVICED_VISITS"
          - "DisposalSite.committed_gallons_today + manifest.gallons_total <= DisposalSite.daily_gallon_cap, else ERR_DISPOSAL_CAP_EXCEEDED"
        side_effects:
          - "freeze manifest.gallons_total at the value from calculations.manifest_gallons_total"
          - "recompute DisposalSite.committed_gallons_today for manifest.disposal_site_id"
          - "increments Route.version by 1"
      - from: SEALED
        to: ACCEPTED
        trigger: "POST /waste-manifests/{id}/accept"
        actor: ComplianceOfficer
        preconditions:
          - "manifest.state == SEALED"
          - "DisposalSite(manifest.disposal_site_id).status == ACCEPTING, else ERR_DISPOSAL_SITE_CLOSED"
        side_effects:
          - "recompute DisposalSite.committed_gallons_today for manifest.disposal_site_id (the value is unchanged because both SEALED and ACCEPTED are in the input set)"

  - entity: ChargeEvent
    initial_state: ASSESSED
    terminal_states: [UPHELD, WAIVED]
    shape: branching
    note: "ASSESSED forks to DISPUTED, UPHELD or WAIVED; the WAIVED branch carries the full compensation side-effect set, the UPHELD branch carries none."
    transitions:
      - from: ASSESSED
        to: DISPUTED
        trigger: "POST /charge-events/{id}/dispute"
        actor: CustomerContact
        preconditions:
          - "charge.state == ASSESSED"
          - "X-User-ID == RentalContract(charge.contract_id).account_id, else ERR_ACCOUNT_SCOPE_VIOLATION"
          - "current logical-clock instant <= charge.assessed_at + CHARGE_DISPUTE_WINDOW_DAYS (14) days, else ERR_DISPUTE_WINDOW_CLOSED"
        side_effects:
          - "charge.dispute_reason = request dispute_reason"
          - "no financial recompute: DISPUTED charges remain outside the ASSESSED/UPHELD input set, so RentalContract.charge_debits_cents and RentalContract.credit_accrued_cents are recomputed and both drop by charge.amount_cents"
          - "recompute RentalAccount.open_credit_balance_cents and RentalAccount.billing_hold for the contract's account_id"
          - "if the contract's billing_state == INVOICED it transitions INVOICED -> REBILL_REQUIRED"
      - from: ASSESSED
        to: UPHELD
        trigger: "POST /charge-events/{id}/uphold"
        actor: ComplianceOfficer
        preconditions:
          - "charge.state == ASSESSED"
          - "X-User-ID != charge.assessed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "charge.resolved_by_user_id = X-User-ID; charge.resolution_note = request resolution_note"
          - "no amount change and no ledger movement: UPHELD is in the same input set as ASSESSED"
      - from: DISPUTED
        to: UPHELD
        trigger: "POST /charge-events/{id}/uphold"
        actor: ComplianceOfficer
        preconditions:
          - "charge.state == DISPUTED"
          - "X-User-ID != charge.assessed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "charge.resolved_by_user_id = X-User-ID; charge.resolution_note = request resolution_note"
          - "recompute RentalContract.charge_debits_cents, RentalContract.credit_accrued_cents and RentalContract.net_billable_cents (the amount re-enters the input set)"
          - "recompute RentalAccount.open_credit_balance_cents and RentalAccount.billing_hold"
          - "if the contract's billing_state == INVOICED it transitions INVOICED -> REBILL_REQUIRED"
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /charge-events/{id}/waive"
        actor: ComplianceOfficer
        preconditions:
          - "charge.state == ASSESSED"
          - "X-User-ID != charge.assessed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "charge.resolved_by_user_id = X-User-ID; charge.resolution_note = request resolution_note"
          - "COMPENSATION 1 -> RentalContract: recompute charge_debits_cents, credit_accrued_cents and net_billable_cents excluding this charge"
          - "COMPENSATION 2 (caused by the contract change) -> RentalAccount: recompute open_credit_balance_cents, then billing_hold"
          - "COMPENSATION 3 (only when charge_kind IN {DAMAGE, TIP_OVER}) -> AssetUnit: recompute damage_strikes and tip_over_count; if the sum drops below UNIT_REPAIR_STRIKE_THRESHOLD and status == IN_REPAIR then IN_REPAIR -> IN_YARD"
          - "if the contract's billing_state == INVOICED it transitions INVOICED -> REBILL_REQUIRED"
      - from: DISPUTED
        to: WAIVED
        trigger: "POST /charge-events/{id}/waive"
        actor: ComplianceOfficer
        preconditions:
          - "charge.state == DISPUTED"
          - "X-User-ID != charge.assessed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "charge.resolved_by_user_id = X-User-ID; charge.resolution_note = request resolution_note"
          - "COMPENSATION 1..3 identical to ASSESSED_to_WAIVED; the contract and account figures are already free of this amount, so only AssetUnit strike counts and the status write can change"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: quote-supersede-stale-contract
    parent_entity: RentalContract
    write_endpoint: "POST /rental-contracts/{id}/quote"
    occ_field: "expected_contract_version"
    description: |
      A re-quote carrying an expected_contract_version that no longer equals the contract's stored
      version is rejected. The QUOTED -> QUOTED self-loop legitimately supersedes the prior
      PROVISIONAL line set, so a writer whose view of the contract predates an earlier supersede
      would silently discard line data it never saw.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
  - rule_id: manifest-seal-stale-route
    parent_entity: Route
    write_endpoint: "POST /waste-manifests/{id}/seal"
    occ_field: "expected_route_version"
    description: |
      Sealing a manifest commits gallons against the route's disposal allowance. A seal whose
      expected_route_version is behind the route's stored version is rejected, because the client's
      view of the route (and therefore of how much of the daily disposal cap is still free) predates
      another seal that already consumed part of it.
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: site_permit_posture
    trigger: "any PlacementPermit transition (submit / approve / reject / system expiry) and any ChargeEvent transition whose charge_kind == TIP_OVER on a contract of this site"
    algorithm: constraint_propagation
    formula: |
      required_kinds = {PLACEMENT} UNION ({RIGHT_OF_WAY} if site.right_of_way_required else {})

      # (a) per-kind status: the LATEST filing of that kind wins.
      for each kind K in required_kinds:
          candidates = PlacementPermit where site_id == site.id AND permit_kind == K
          if candidates is empty: kind_status[K] = NONE
          else:
              # ranking expression: created_at DESC; tie-break: none possible because two rows of the
              # same kind on the same site cannot share created_at (server-minted, strictly increasing)
              latest = candidates ordered by created_at DESC, first row
              kind_status[K] = { DRAFT: PENDING, SUBMITTED: PENDING, APPROVED: APPROVED,
                                 REJECTED: REJECTED, EXPIRED: EXPIRED }[latest.status]

      # (b) worst-of roll-up over the declared precedence list (index 0 is worst)
      PERMIT_STATUS_PRECEDENCE = [REJECTED, EXPIRED, NONE, PENDING, APPROVED]
      site.permit_status = the member of PERMIT_STATUS_PRECEDENCE with the lowest index that appears
                           in kind_status.values()

      # (c) posture gate
      tip_over_open = EXISTS ChargeEvent C where C.charge_kind == TIP_OVER
                        AND C.state IN {ASSESSED, DISPUTED}
                        AND RentalContract(C.contract_id).site_id == site.id
      if site.permit_status IN {REJECTED, EXPIRED}:            site.site_posture = BLOCKED
      elif site.permit_status IN {NONE, PENDING}:               site.site_posture = RESTRICTED
      elif tip_over_open:                                       site.site_posture = RESTRICTED
      else:                                                     site.site_posture = OPEN
    input_set: "All PlacementPermit rows of the site regardless of status; ChargeEvent rows only in states ASSESSED and DISPUTED (UPHELD and WAIVED never restrict a site)."
    constants:
      PERMIT_STATUS_PRECEDENCE: [REJECTED, EXPIRED, NONE, PENDING, APPROVED]
    precision: "enum-valued; no numeric rounding"

  - name: unit_mix_quote
    trigger: "POST /rental-contracts/{id}/quote (variant provisional_projection); POST /rental-contracts/{id}/demobilize (variant reconciled_actual)"
    algorithm: tiered_pricing
    formula: |
      # ---- variant provisional_projection (evaluation order is pinned top to bottom) ----
      # step 1: demand, by contract_kind
      if contract.contract_kind == EVENT:
          demand_person_hours = floor(contract.headcount * contract.event_duration_hours
                                      * EVENT_PEAK_FACTOR_NUM / EVENT_PEAK_FACTOR_DEN)
      else:  # CONSTRUCTION — event_duration_hours is ignored entirely
          service_interval_days = ceil(7 / contract.service_frequency_per_week)
          demand_person_hours = contract.headcount * CONSTRUCTION_SHIFT_HOURS * service_interval_days

      # step 2: raw capacity in standard-unit equivalents
      base_capacity_units = ceil(demand_person_hours / STANDARD_SERVICE_PERSON_HOURS)

      # step 3: trailer tier selection — a hard threshold on headcount, NOT on capacity
      if contract.headcount >= TRAILER_HEADCOUNT_FLOOR:
          trailer_8stall_qty = floor(base_capacity_units / 8)
          remainder_units    = base_capacity_units - trailer_8stall_qty * 8
          trailer_2stall_qty = ceil(remainder_units / 2)     # 0 when remainder_units == 0
          standard_qty       = 0
      else:
          trailer_8stall_qty = 0
          trailer_2stall_qty = 0
          standard_qty       = base_capacity_units

      # step 4: restroom equivalents actually placed
      restroom_units = standard_qty + trailer_2stall_qty * 2 + trailer_8stall_qty * 8

      # step 5: ADA overlay (nested max/ceil on top of step 4)
      ada_qty = max(ADA_MIN_UNITS, ceil(restroom_units / ADA_RATIO_DIVISOR)) if contract.ada_required else 0

      # step 6: handwash overlay, keyed on step 4 PLUS step 5
      handwash_qty = ceil((restroom_units + ada_qty) / HANDWASH_RATIO_DIVISOR)

      # step 7: lines, emitted in this fixed class order, skipping any quantity == 0
      for unit_class in [STANDARD_PORTABLE, ADA_PORTABLE, HANDWASH_STATION, TRAILER_2STALL, TRAILER_8STALL]:
          quantity        = the qty computed above for that class
          unit_rate_cents = RATE_<unit_class>_CENTS
          extended_cents  = quantity * unit_rate_cents          # exact integer cents
      contract.quoted_cents = sum(extended_cents over the emitted PROVISIONAL lines)
      # NOTE: this variant can never produce an empty line set — headcount >= 1 forces
      # base_capacity_units >= 1 — so there is no empty-mix error path here. The empty-input-set
      # edge of this calculation lives entirely in the reconciled_actual variant below.

      # ---- variant reconciled_actual ----
      deployments = UnitDeployment where contract_id == contract.id AND state IN {DEPLOYED, RETURNED}
      if deployments is empty: reject with ERR_RECONCILIATION_NO_DEPLOYMENTS
      for unit_class in [STANDARD_PORTABLE, ADA_PORTABLE, HANDWASH_STATION, TRAILER_2STALL, TRAILER_8STALL]:
          quantity = count of deployments whose AssetUnit(asset_unit_id).unit_class == unit_class
          # NO ADA overlay and NO handwash overlay: actuals are counted, not modelled
          unit_rate_cents = RATE_<unit_class>_CENTS
          extended_cents  = quantity * unit_rate_cents
      contract.reconciled_cents = sum(extended_cents over the emitted RECONCILED lines)
    input_set: |
      provisional_projection reads only RentalContract input fields — no deployment, schedule or
      visit data enters it. reconciled_actual reads only UnitDeployment rows in state DEPLOYED or
      RETURNED (RESERVED rows are excluded because they never reached the site) joined to
      AssetUnit.unit_class. Superseded QuoteLines never enter either variant.
    constants:
      EVENT_PEAK_FACTOR_NUM: 12
      EVENT_PEAK_FACTOR_DEN: 10
      CONSTRUCTION_SHIFT_HOURS: 9
      STANDARD_SERVICE_PERSON_HOURS: 250
      TRAILER_HEADCOUNT_FLOOR: 400
      ADA_RATIO_DIVISOR: 20
      ADA_MIN_UNITS: 1
      HANDWASH_RATIO_DIVISOR: 4
      RATE_STANDARD_PORTABLE_CENTS: 14500
      RATE_ADA_PORTABLE_CENTS: 22500
      RATE_HANDWASH_STATION_CENTS: 9500
      RATE_TRAILER_2STALL_CENTS: 78000
      RATE_TRAILER_8STALL_CENTS: 265000
    precision: "integer cents throughout; every division is an explicit floor() or ceil() as written, so no rounding mode is needed"
    variants:
      - name: provisional_projection
        when: "POST /rental-contracts/{id}/quote — before any unit physically ships"
        difference: "Derives quantities from headcount / duration / frequency and applies the ADA and handwash overlays; writes RentalContract.quoted_cents and PROVISIONAL QuoteLines."
      - name: reconciled_actual
        when: "POST /rental-contracts/{id}/demobilize — after the units come back"
        difference: "Derives quantities by counting actual UnitDeployment rows per AssetUnit.unit_class with NO overlays; writes RentalContract.reconciled_cents and RECONCILED QuoteLines. For identical contract inputs the two variants disagree whenever the deployed fleet differs from the modelled mix."

  - name: line_escalation_invoice
    trigger: "POST /rental-contracts/{id}/invoice (both UNBILLED_to_INVOICED and REBILL_REQUIRED_to_INVOICED)"
    algorithm: tiered_pricing
    formula: |
      combined_pct = SEASONAL_ESCALATION_PCT[contract.season_code]
                   + PHASE_ESCALATION_PCT[contract.construction_phase]
                   + FUEL_SURCHARGE_PCT

      # ROUNDING ORDER IS PINNED: escalate and round EACH LINE to whole cents, THEN sum.
      # "sum the extended amounts, escalate once, round once" is FORBIDDEN and produces a
      # different total (it differs by up to one cent per line).
      lines = QuoteLine where contract_id == contract.id AND is_superseded == false,
              ordered by created_at ASC
      for each line in lines (in that order):
          line.escalated_cents = round_half_up(line.extended_cents * (100 + combined_pct) / 100)
      contract.invoice_subtotal_cents = sum(line.escalated_cents for line in lines)

      contract.net_billable_cents = contract.invoice_subtotal_cents
                                  + contract.charge_debits_cents
                                  - contract.credit_accrued_cents
    input_set: "QuoteLine rows of the contract with is_superseded == false only — one variant generation at a time. Both PROVISIONAL-only and RECONCILED-only sets are possible depending on whether the contract has been demobilized."
    constants:
      SEASONAL_ESCALATION_PCT: { PEAK: 8.5, SHOULDER: 3.25, OFF: 0.0 }
      PHASE_ESCALATION_PCT: { SITEWORK: 0.0, VERTICAL: 4.75, FINISHES: 2.5, EVENT_NA: 0.0 }
      FUEL_SURCHARGE_PCT: 1.75
    precision: "per-line round_half_up to whole cents, then integer summation"

  - name: route_density_score
    trigger: "any ServiceSchedule state change (planned variant) and any ServiceVisit transition into SERVICED or MISSED (realized variant)"
    algorithm: weighted_scoring
    formula: |
      # ---- variant planned_committed ----
      committed_units = sum(ServiceSchedule.units_on_route
                            for schedules where route_id == route.id AND state == ACTIVE)
      route.committed_units = committed_units
      route.density_planned_pct = 0 if route.truck_capacity_units == 0
                                  else floor(committed_units * 100 / route.truck_capacity_units)

      # ---- variant realized_serviced ----
      if route.last_run_date is null:
          route.density_realized_pct = 0
      else:
          serviced_units = sum(ServiceVisit.units_serviced
                               for visits where route_id == route.id
                                 AND scheduled_date == route.last_run_date
                                 AND state == SERVICED)
          route.density_realized_pct = floor(serviced_units * 100 / route.truck_capacity_units)
    input_set: |
      planned_committed counts ServiceSchedule rows in state ACTIVE only (SUSPENDED and TERMINATED
      are excluded). realized_serviced counts ServiceVisit rows in state SERVICED only, restricted to
      Route.last_run_date, so MISSED, CANCELLED, PLANNED and EN_ROUTE visits contribute nothing.
    constants:
      DENSITY_FLOOR_PCT: 0
    precision: "integer percent, floor()"
    variants:
      - name: planned_committed
        when: "recomputed whenever a schedule enters or leaves ACTIVE"
        difference: "Denominator is truck capacity, numerator is contracted units — it measures the route as sold."
      - name: realized_serviced
        when: "recomputed whenever a visit reaches SERVICED or MISSED"
        difference: "Numerator counts only units actually serviced on the last run date, so one MISSED visit makes realized diverge downward from planned on the same unchanged schedule set."

  - name: missed_service_credit
    trigger: "ServiceVisit PLANNED_to_MISSED and EN_ROUTE_to_MISSED (writes ChargeEvent.amount_cents on the generated MISSED_SERVICE_CREDIT charge)"
    algorithm: threshold
    formula: |
      # This calculation LOOKS circular: the credit is a percentage of the per-visit service charge,
      # the per-visit service charge carries a density surcharge, and the density in question is the
      # route density that the very act of missing this visit changes. The evaluation order below is
      # PINNED and resolves it: the surcharge tier is read from the PRE-transition
      # Route.density_planned_pct snapshot, the credit is computed and persisted, and only THEN is
      # Route.density_realized_pct recomputed. Reading the post-transition density is FORBIDDEN.

      # step 1: snapshot, taken BEFORE the visit's state is written
      d = Route(visit.route_id).density_planned_pct        # integer percent

      # step 2: tier lookup — first tier in DECLARED ORDER whose max_density_pct >= d wins
      surcharge_pct = the surcharge_pct of the first entry E in DENSITY_SURCHARGE_TIERS
                      (declared order, index 0 first) such that d <= E.max_density_pct
                      # d can never exceed 100 because a schedule may not be added past capacity,
                      # so the last tier always matches as a fallback

      # step 3: per-visit base cost of the contract's current non-superseded mix
      lines = QuoteLine where contract_id == schedule.contract_id AND is_superseded == false
      base_visit_cents = sum(line.quantity * BASE_PER_VISIT_SERVICE_CENTS_BY_CLASS[line.unit_class]
                             for line in lines)

      # step 4: density-adjusted per-visit charge
      per_visit_service_cents = round_half_up(base_visit_cents * (100 + surcharge_pct) / 100)

      # step 5: the credit itself
      credit_cents = round_half_up(per_visit_service_cents * MISSED_SERVICE_CREDIT_PCT / 100)
      ChargeEvent.amount_cents = credit_cents

      # step 6: only now recompute Route.density_realized_pct (calculations.route_density_score)
    input_set: "QuoteLine rows of the missed visit's contract with is_superseded == false; the Route row as it stood before the MISSED write. No other visit and no other charge enters this calculation."
    constants:
      MISSED_SERVICE_CREDIT_PCT: 115
      DENSITY_SURCHARGE_TIERS:
        - { max_density_pct: 40, surcharge_pct: 12.0 }
        - { max_density_pct: 75, surcharge_pct: 6.0 }
        - { max_density_pct: 100, surcharge_pct: 0.0 }
      BASE_PER_VISIT_SERVICE_CENTS_BY_CLASS:
        STANDARD_PORTABLE: 4200
        ADA_PORTABLE: 5600
        HANDWASH_STATION: 2600
        TRAILER_2STALL: 17500
        TRAILER_8STALL: 52000
    precision: "round_half_up to whole cents at step 4 and again at step 5; the two roundings are sequential and MUST NOT be collapsed into one"

  - name: manifest_gallons_total
    trigger: "POST /waste-manifests (initial value), ServiceVisit EN_ROUTE_to_SERVICED (refresh of every OPEN manifest on the same route and date), WasteManifest OPEN_to_SEALED (freeze)"
    algorithm: aggregation
    formula: |
      visits = ServiceVisit where route_id == manifest.route_id
                            AND scheduled_date == manifest.manifest_date
                            AND state == SERVICED
      manifest.gallons_total = sum(visit.gallons_pumped for visit in visits)
      # Once the manifest reaches SEALED the value is frozen: later SERVICED visits on the same
      # route and date do NOT change a SEALED or ACCEPTED manifest.
    input_set: "ServiceVisit rows in state SERVICED only, filtered to the manifest's exact route_id and manifest_date. PLANNED, EN_ROUTE, MISSED, CANCELLED and RERUN_SCHEDULED visits contribute 0. Order-insensitive (integer sum), so no tie-break is required."
    constants: {}
    precision: "whole gallons, integer arithmetic"

  - name: disposal_site_committed_gallons
    trigger: "WasteManifest OPEN_to_SEALED and SEALED_to_ACCEPTED; also evaluated as a precondition of OPEN_to_SEALED"
    algorithm: aggregation
    formula: |
      committed_for_date(site, date) =
          sum(WasteManifest.gallons_total
              for manifests where disposal_site_id == site.id
                              AND manifest_date == date
                              AND state IN {SEALED, ACCEPTED})

      # denormalized read field, always keyed on the logical clock's calendar date
      site.committed_gallons_today = committed_for_date(site, current logical-clock calendar date)

      # cap gate, keyed on the manifest being sealed (BOUNDARY: <= passes, > rejects)
      on OPEN_to_SEALED:
          if committed_for_date(site, manifest.manifest_date) + manifest.gallons_total
             > site.daily_gallon_cap:
              reject with ERR_DISPOSAL_CAP_EXCEEDED
    input_set: "WasteManifest rows in state SEALED or ACCEPTED only; OPEN manifests never consume cap. The manifest currently being sealed is excluded from committed_for_date (it is added explicitly in the comparison)."
    constants: {}
    precision: "whole gallons, integer arithmetic; the comparison is strictly `>` so a load landing exactly on daily_gallon_cap is accepted"

  - name: account_open_credit_balance
    trigger: "any ChargeEvent transition on a contract of this account, and ServiceVisit PLANNED_to_MISSED / EN_ROUTE_to_MISSED (via the generated credit)"
    algorithm: aggregation
    formula: |
      contracts = RentalContract where account_id == account.id
      account.open_credit_balance_cents =
          sum(ChargeEvent.amount_cents
              for charges where contract_id IN contracts
                            AND charge_kind == MISSED_SERVICE_CREDIT
                            AND state IN {ASSESSED, UPHELD})
      account.billing_hold = (account.open_credit_balance_cents >= ACCOUNT_CREDIT_HOLD_THRESHOLD_CENTS)
      # CONSERVATION INVARIANT: for any forward action F that creates a MISSED_SERVICE_CREDIT charge
      # and its compensating action W (waive of that same charge), the value of
      # open_credit_balance_cents after W equals its value before F, exactly.
    input_set: "MISSED_SERVICE_CREDIT charges in state ASSESSED or UPHELD across every contract of the account; DISPUTED and WAIVED credits are excluded, as are DAMAGE, TIP_OVER and RELOCATION charges."
    constants:
      ACCOUNT_CREDIT_HOLD_THRESHOLD_CENTS: 60000
    precision: "integer cents; the threshold comparison is `>=` so a balance exactly equal to the threshold places the account on hold"

  - name: damage_tip_over_charge
    trigger: "POST /charge-events with charge_kind DAMAGE or TIP_OVER"
    algorithm: threshold
    formula: |
      unit = AssetUnit(request asset_unit_id)
      prior_strikes = unit.damage_strikes + unit.tip_over_count      # BEFORE this charge is counted
      if prior_strikes <= 1:      strike_mult_pct = 100
      elif prior_strikes == 2:    strike_mult_pct = 150
      else:                       strike_mult_pct = 200

      if request charge_kind == DAMAGE:
          base_cents = DAMAGE_BASE_CENTS_BY_CLASS[unit.unit_class]
          severity_pct = SEVERITY_PCT[request severity]
      else:  # TIP_OVER — severity is not accepted and plays no part
          base_cents = TIP_OVER_BASE_CENTS
          severity_pct = 100

      # single rounding at the end; the two percentage factors are applied to the exact product
      amount_cents = round_half_up(base_cents * severity_pct * strike_mult_pct / 10000)
    input_set: "The single AssetUnit named in the request; prior_strikes counts only ChargeEvents in state ASSESSED or UPHELD (a DISPUTED or WAIVED history does not escalate the multiplier)."
    constants:
      DAMAGE_BASE_CENTS_BY_CLASS:
        STANDARD_PORTABLE: 32000
        ADA_PORTABLE: 48000
        HANDWASH_STATION: 19000
        TRAILER_2STALL: 145000
        TRAILER_8STALL: 390000
      TIP_OVER_BASE_CENTS: 27500
      SEVERITY_PCT: { MINOR: 40, MODERATE: 75, TOTAL_LOSS: 100 }
      UNIT_REPAIR_STRIKE_THRESHOLD: 3
    precision: "round_half_up to whole cents, applied once after both percentage factors"

  - name: relocation_charge
    trigger: "POST /unit-deployments/{id}/relocate (writes amount_cents on the generated RELOCATION ChargeEvent)"
    algorithm: threshold
    formula: |
      dest = ServiceSite(request destination_site_id)
      access_mult_pct = ACCESS_CLASS_MULTIPLIER_PCT[dest.access_class]
      same_day = (request effective_date == current logical-clock calendar date)
      uplift_pct = SAME_DAY_UPLIFT_PCT if same_day else 0

      # EVALUATION ORDER IS PINNED: apply the access multiplier first and round to whole cents,
      # then apply the same-day uplift to that rounded intermediate and round again.
      access_adjusted_cents = round_half_up(RELOCATION_BASE_CENTS * access_mult_pct / 100)
      amount_cents          = round_half_up(access_adjusted_cents * (100 + uplift_pct) / 100)
    input_set: "The destination ServiceSite only; the origin site's access_class is irrelevant. The logical clock supplies today's date for the same-day test."
    constants:
      RELOCATION_BASE_CENTS: 18500
      ACCESS_CLASS_MULTIPLIER_PCT: { OPEN_LOT: 100, GATED: 115, STAIR_ACCESS: 140, CRANE_ONLY: 225 }
      SAME_DAY_UPLIFT_PCT: 35
    precision: "round_half_up to whole cents twice, in the pinned order above"

  - name: schedule_units_on_route
    trigger: "POST /service-schedules (frozen at creation)"
    algorithm: aggregation
    formula: |
      lines = QuoteLine where contract_id == request contract_id AND is_superseded == false
      units_on_route = sum(line.quantity for line in lines)
      # Frozen: a later re-quote or demobilize that supersedes those lines does NOT retroactively
      # change an existing ServiceSchedule.units_on_route.
      # Capacity gate on creation (BOUNDARY: <= passes, > rejects):
      if Route.committed_units + units_on_route > Route.truck_capacity_units:
          reject with ERR_ROUTE_UNIT_CAPACITY_EXCEEDED
    input_set: "QuoteLine rows of the contract with is_superseded == false at the instant of schedule creation, all unit classes included."
    constants: {}
    precision: "integer unit counts"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number checked first)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role appears in the called endpoint's `roles:` list in §1.5."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: |
      Request shape: every required body field present; types match; enum values are declared members;
      integers inside their declared range; window_end_minute > window_start_minute;
      gate_close_minute > gate_open_minute; term_end >= term_start; effective_to >= effective_from;
      deploy_to >= deploy_from; dates are YYYY-MM-DD; contract_kind == EVENT requires
      construction_phase == EVENT_NA; charge_kind == DAMAGE requires a severity and
      charge_kind == TIP_OVER forbids one; charge_kind IN {DAMAGE, TIP_OVER} requires asset_unit_id;
      MISSED_SERVICE_CREDIT is never accepted from a client; visit_kind == RERUN is never accepted
      from a client; ServiceSchedule.service_day must equal Route.service_day.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 4
    category: existence
    check: "Every path id resolves, validated left to right: rental-accounts -> ERR_ACCOUNT_NOT_FOUND, service-sites -> ERR_SITE_NOT_FOUND, placement-permits -> ERR_PERMIT_NOT_FOUND, rental-contracts -> ERR_CONTRACT_NOT_FOUND, routes -> ERR_ROUTE_NOT_FOUND, service-schedules -> ERR_SCHEDULE_NOT_FOUND, service-visits -> ERR_VISIT_NOT_FOUND, waste-manifests -> ERR_MANIFEST_NOT_FOUND, charge-events -> ERR_CHARGE_NOT_FOUND, asset-units -> ERR_ASSET_UNIT_NOT_FOUND, unit-deployments -> ERR_DEPLOYMENT_NOT_FOUND, disposal-sites -> ERR_DISPOSAL_SITE_NOT_FOUND."
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 5
    category: existence
    check: "Every foreign key in the request body resolves to an existing row, validated in the field order declared by the endpoint's `input:` list, using the same error mapping as priority 4."
    error_id: ERR_SITE_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying FK fields"
  - priority: 6
    category: auth
    check: "When X-User-Role == CustomerContact, X-User-ID must equal the RentalAccount.id that owns the target resource (RentalContract.account_id, or RentalContract(charge.contract_id).account_id for a ChargeEvent)."
    error_id: ERR_ACCOUNT_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /rental-contracts, POST /charge-events/{id}/dispute"
  - priority: 7
    category: auth
    check: "Segregation of duties: on uphold and waive, X-User-ID MUST NOT equal ChargeEvent.assessed_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /charge-events/{id}/uphold, POST /charge-events/{id}/waive"
  - priority: 10
    category: state
    check: "OCC: request expected_contract_version == RentalContract.version (quote) / expected_route_version == Route.version (seal)."
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /rental-contracts/{id}/quote, POST /waste-manifests/{id}/seal"
  - priority: 20
    category: state
    check: "The target row is in a `from:` state that the requested transition declares in §1.2, and every same-entity or guard-entity state precondition of that transition holds (schedule ACTIVE for visit transitions, contract fulfillment_state IN {ACTIVE, DEMOBILIZED} for invoicing, account.status == ACTIVE for activation, and so on)."
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 22
    category: business_constraint
    check: "Permit resubmission: revision_round < PERMIT_MAX_REVISION_ROUNDS (3) when transitioning REJECTED -> SUBMITTED."
    error_id: ERR_PERMIT_REVISION_LIMIT
    http_status: 409
    applies_to: "POST /placement-permits/{id}/submit"
  - priority: 40
    category: state
    check: "The governing ServiceSite.site_posture is not BLOCKED. For contract activation and deployment creation the governing site is RentalContract.site_id; for relocation it is the destination site; for visit creation it is the schedule's contract's site."
    error_id: ERR_SITE_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /rental-contracts/{id}/activate, POST /unit-deployments, POST /unit-deployments/{id}/relocate, POST /service-visits"
  - priority: 41
    category: state
    check: "The governing ServiceSite.site_posture is not RESTRICTED. Relocation is deliberately exempt: a unit may be moved onto a RESTRICTED site."
    error_id: ERR_SITE_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /rental-contracts/{id}/activate, POST /unit-deployments, POST /service-visits"
  - priority: 42
    category: state
    check: "Route(visit.route_id).status == ACTIVE."
    error_id: ERR_ROUTE_SUSPENDED
    http_status: 409
    applies_to: "POST /service-visits/{id}/dispatch"
  - priority: 44
    category: state
    check: "DisposalSite(manifest.disposal_site_id).status == ACCEPTING."
    error_id: ERR_DISPOSAL_SITE_CLOSED
    http_status: 409
    applies_to: "POST /waste-manifests/{id}/seal, POST /waste-manifests/{id}/accept"
  - priority: 50
    category: business_safety
    check: "Physical access feasibility: AssetUnit.tare_length_ft <= ServiceSite.max_truck_length_ft for the site the unit is being placed on (contract site on create, destination site on relocate)."
    error_id: ERR_SITE_ACCESS_INFEASIBLE
    http_status: 422
    applies_to: "POST /unit-deployments, POST /unit-deployments/{id}/relocate"
  - priority: 54
    category: business_temporal
    check: "Site access window containment: ServiceSite.gate_open_minute <= visit.window_start_minute AND visit.window_end_minute <= ServiceSite.gate_close_minute, where the site is the visit's schedule's contract's site. Applies to every visit_kind, including the same-day SETUP and TEARDOWN surge legs."
    error_id: ERR_ACCESS_WINDOW_VIOLATION
    http_status: 422
    applies_to: "POST /service-visits, POST /service-visits/{id}/schedule-rerun"
  - priority: 56
    category: business_temporal
    check: |
      Route window occupation, BUFFERED HALF-OPEN semantics. Candidate set: ServiceVisit rows with
      route_id == the new visit's route_id, scheduled_date == the new visit's scheduled_date, and
      state IN {PLANNED, EN_ROUTE, SERVICED}. The new visit conflicts with candidate C when
        new.window_start_minute < C.window_end_minute + ROUTE_TURNAROUND_BUFFER_MINUTES
        AND C.window_start_minute < new.window_end_minute + ROUTE_TURNAROUND_BUFFER_MINUTES
      with ROUTE_TURNAROUND_BUFFER_MINUTES = 20. Exact adjacency (new start == C end) therefore
      CONFLICTS; a gap of exactly 20 minutes does NOT conflict.
    error_id: ERR_ROUTE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /service-visits, POST /service-visits/{id}/schedule-rerun"
  - priority: 58
    category: business_temporal
    check: |
      Asset occupation, CLOSED INCLUSIVE DATE semantics with no buffer. Candidate set: UnitDeployment
      rows with asset_unit_id == the new row's asset_unit_id and state IN {RESERVED, DEPLOYED}. The new
      deployment conflicts with candidate C when
        new.deploy_from <= C.deploy_to AND C.deploy_from <= new.deploy_to
      compared as YYYY-MM-DD strings. Back-to-back booking (new.deploy_from == C.deploy_to) therefore
      CONFLICTS; a one-day gap does NOT conflict. RETURNED deployments never conflict.
    error_id: ERR_UNIT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /unit-deployments"
  - priority: 60
    category: business_constraint
    check: "Route unit capacity: Route.committed_units + the new schedule's units_on_route <= Route.truck_capacity_units (strictly greater rejects)."
    error_id: ERR_ROUTE_UNIT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /service-schedules"
  - priority: 62
    category: business_referential
    check: "WasteManifest.waste_class is a member of DisposalSite.accepted_waste_classes."
    error_id: ERR_DISPOSAL_CLASS_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /waste-manifests/{id}/seal"
  - priority: 64
    category: business_referential
    check: "At least one ServiceVisit exists with route_id == manifest.route_id, scheduled_date == manifest.manifest_date and state == SERVICED."
    error_id: ERR_MANIFEST_NO_SERVICED_VISITS
    http_status: 422
    applies_to: "POST /waste-manifests/{id}/seal"
  - priority: 66
    category: business_constraint
    check: "Reconciliation input set is non-empty: at least one UnitDeployment with contract_id == the contract and state IN {DEPLOYED, RETURNED}."
    error_id: ERR_RECONCILIATION_NO_DEPLOYMENTS
    http_status: 422
    applies_to: "POST /rental-contracts/{id}/demobilize"
  - priority: 70
    category: business_fiscal
    check: "RentalAccount(contract.account_id).billing_hold == false."
    error_id: ERR_ACCOUNT_BILLING_HOLD
    http_status: 402
    applies_to: "POST /rental-contracts/{id}/activate, POST /rental-contracts/{id}/invoice"
  - priority: 72
    category: business_constraint
    check: "Disposal daily cap: committed_for_date(disposal_site, manifest.manifest_date) + manifest.gallons_total <= DisposalSite.daily_gallon_cap."
    error_id: ERR_DISPOSAL_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /waste-manifests/{id}/seal"
  - priority: 74
    category: business_temporal
    check: "Dispute window: current logical-clock instant <= ChargeEvent.assessed_at + CHARGE_DISPUTE_WINDOW_DAYS (14) days."
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /charge-events/{id}/dispute"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- RentalAccount -------------------------------------------------------
  - method: POST
    path: "/rental-accounts"
    description: "Open a customer account."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, account_type, "credit_terms_days?", "status?"]
    output: RentalAccount
    side_effects: ["open_credit_balance_cents initialised to 0", "billing_hold initialised to false"]
  - method: GET
    path: "/rental-accounts/{id}"
    description: "Read one account including its derived credit balance and hold flag."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: []
    output: RentalAccount
    side_effects: []
  - method: GET
    path: "/rental-accounts/{id}/service-sites"
    description: "Reverse lookup of ServiceSite.account_id — every site of this account."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: ["limit?", "offset?"]
    output: ServiceSite[]
    side_effects: []

  # ---- ServiceSite ---------------------------------------------------------
  - method: POST
    path: "/service-sites"
    description: "Register a placement site with its access class and gate window."
    roles: [SalesRep, PlatformAdmin]
    code: 201
    input: [account_id, site_label, jurisdiction_code, access_class, "right_of_way_required?", "gate_open_minute?", "gate_close_minute?", "max_truck_length_ft?"]
    output: ServiceSite
    side_effects: ["permit_status computed as NONE and site_posture computed as RESTRICTED (calculations.site_permit_posture)"]
  - method: GET
    path: "/service-sites/{id}"
    description: "Read one site including permit_status, site_posture and deployed_unit_count."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: []
    output: ServiceSite
    side_effects: []
  - method: GET
    path: "/service-sites/{id}/permits"
    description: "Reverse lookup of PlacementPermit.site_id — every permit filed for this site."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: ["permit_kind?", "status?", "limit?", "offset?"]
    output: PlacementPermit[]
    side_effects: []

  # ---- PlacementPermit -----------------------------------------------------
  - method: POST
    path: "/placement-permits"
    description: "Draft a placement or right-of-way permit filing."
    roles: [PermitCoordinator]
    code: 201
    input: [site_id, permit_kind, authority_ref, effective_from, effective_to]
    output: PlacementPermit
    side_effects: ["status DRAFT, revision_round 0", "recompute ServiceSite.permit_status and ServiceSite.site_posture"]
  - method: GET
    path: "/placement-permits/{id}"
    description: "Read one permit."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: []
    output: PlacementPermit
    side_effects: []
  - method: POST
    path: "/placement-permits/{id}/submit"
    description: "File the permit with the authority. Also the resubmission entry point after a rejection."
    roles: [PermitCoordinator]
    code: 200
    input: ["submission_note?"]
    output: PlacementPermit
    side_effects: ["revision_round += 1", "submitted_by_user_id = X-User-ID", "recompute ServiceSite.permit_status and ServiceSite.site_posture"]
  - method: POST
    path: "/placement-permits/{id}/approve"
    description: "Record authority approval."
    roles: [ComplianceOfficer]
    code: 200
    input: [authority_decision_ref]
    output: PlacementPermit
    side_effects: ["recompute ServiceSite.permit_status and ServiceSite.site_posture"]
  - method: POST
    path: "/placement-permits/{id}/reject"
    description: "Record authority rejection; triggers the site-blocking cascade."
    roles: [ComplianceOfficer]
    code: 200
    input: [authority_decision_ref, rejection_reason]
    output: PlacementPermit
    side_effects:
      - "recompute ServiceSite.permit_status and ServiceSite.site_posture (becomes BLOCKED)"
      - "cascade ServiceSchedule ACTIVE -> SUSPENDED for every schedule of the site's contracts"
      - "recompute Route.committed_units and Route.density_planned_pct for each affected route"
      - "cascade ServiceVisit PLANNED -> CANCELLED for future visits on those schedules"

  # ---- AssetUnit / DisposalSite / Route ------------------------------------
  - method: POST
    path: "/asset-units"
    description: "Add a physical unit to the yard."
    roles: [PlatformAdmin]
    code: 201
    input: [asset_tag, unit_class, yard_code, tare_length_ft]
    output: AssetUnit
    side_effects: ["status IN_YARD, damage_strikes 0, tip_over_count 0"]
  - method: GET
    path: "/asset-units/{id}"
    description: "Read one asset unit including strike counters."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: []
    output: AssetUnit
    side_effects: []
  - method: POST
    path: "/disposal-sites"
    description: "Register a disposal facility with its daily cap and accepted waste classes."
    roles: [PlatformAdmin]
    code: 201
    input: [site_code, daily_gallon_cap, accepted_waste_classes, "status?"]
    output: DisposalSite
    side_effects: ["committed_gallons_today computed as 0"]
  - method: GET
    path: "/disposal-sites/{id}"
    description: "Read one disposal facility including committed_gallons_today for the current logical-clock date."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: []
    output: DisposalSite
    side_effects: []
  - method: POST
    path: "/routes"
    description: "Create a service route for one weekday."
    roles: [DispatchPlanner]
    code: 201
    input: [route_code, service_day, truck_capacity_units, waste_capacity_gallons, "status?"]
    output: Route
    side_effects: ["committed_units 0, density_planned_pct 0, density_realized_pct 0, last_run_date null"]
  - method: GET
    path: "/routes/{id}"
    description: "Read one route including both density variants and its version."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: []
    output: Route
    side_effects: []

  # ---- RentalContract ------------------------------------------------------
  - method: POST
    path: "/rental-contracts"
    description: "Create a DRAFT contract. CustomerContact may only create for its own account."
    roles: [SalesRep, CustomerContact]
    code: 201
    input: [account_id, site_id, contract_kind, term_start, term_end, headcount, event_duration_hours, service_frequency_per_week, season_code, construction_phase, "ada_required?"]
    output: RentalContract
    side_effects: ["fulfillment_state DRAFT, billing_state UNBILLED, all money fields 0"]
  - method: GET
    path: "/rental-contracts/{id}"
    description: "Read one contract including both quote variants, the escalated subtotal, the ledger fields and its version."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: []
    output: RentalContract
    side_effects: []
  - method: GET
    path: "/rental-contracts"
    description: "Filtered list of contracts. Reverse lookup for RentalContract.account_id and RentalContract.site_id."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: ["account_id?", "site_id?", "fulfillment_state?", "billing_state?", "limit?", "offset?"]
    output: RentalContract[]
    side_effects: []
  - method: GET
    path: "/rental-contracts/{id}/quote-lines"
    description: "Reverse lookup of QuoteLine.contract_id — the contract's quote lines, superseded ones included unless filtered out."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: ["quote_variant?", "is_superseded?", "limit?", "offset?"]
    output: QuoteLine[]
    side_effects: []
  - method: POST
    path: "/rental-contracts/{id}/quote"
    description: "Run the PROVISIONAL unit-mix quote. OCC-guarded: a re-quote supersedes the prior line set."
    roles: [SalesRep]
    code: 200
    input: [expected_contract_version, "quote_note?"]
    output: RentalContract
    side_effects:
      - "supersede any existing non-superseded PROVISIONAL QuoteLines"
      - "create the PROVISIONAL QuoteLine set (calculations.unit_mix_quote variant provisional_projection)"
      - "recompute RentalContract.quoted_cents and RentalContract.net_billable_cents"
      - "fulfillment_state DRAFT -> QUOTED (or QUOTED -> QUOTED on supersede)"
      - "increments RentalContract.version by 1"
  - method: POST
    path: "/rental-contracts/{id}/activate"
    description: "Mobilise the contract. Gated on site posture, account standing and billing hold."
    roles: [SalesRep]
    code: 200
    input: []
    output: RentalContract
    side_effects:
      - "fulfillment_state QUOTED -> ACTIVE"
      - "every RESERVED UnitDeployment of this contract -> DEPLOYED, each moving its AssetUnit IN_YARD -> DEPLOYED"
      - "recompute ServiceSite.deployed_unit_count"
  - method: POST
    path: "/rental-contracts/{id}/demobilize"
    description: "Close out the field work and run the RECONCILED unit-mix variant against actual deployments."
    roles: [DispatchPlanner]
    code: 200
    input: ["demobilization_note?"]
    output: RentalContract
    side_effects:
      - "supersede every non-superseded QuoteLine, then create the RECONCILED QuoteLine set (calculations.unit_mix_quote variant reconciled_actual)"
      - "recompute RentalContract.reconciled_cents and RentalContract.net_billable_cents"
      - "every DEPLOYED UnitDeployment -> RETURNED, each moving its AssetUnit DEPLOYED -> IN_YARD"
      - "every ServiceSchedule of this contract -> TERMINATED, recomputing Route.committed_units and Route.density_planned_pct"
      - "fulfillment_state ACTIVE -> DEMOBILIZED, or straight to CLOSED when billing_state is already SETTLED"
  - method: POST
    path: "/rental-contracts/{id}/invoice"
    description: "Escalate the current line set and issue the invoice."
    roles: [SalesRep]
    code: 200
    input: []
    output: RentalContract
    side_effects:
      - "write QuoteLine.escalated_cents per non-superseded line (calculations.line_escalation_invoice)"
      - "recompute RentalContract.invoice_subtotal_cents and RentalContract.net_billable_cents"
      - "billing_state UNBILLED -> INVOICED or REBILL_REQUIRED -> INVOICED"
  - method: POST
    path: "/rental-contracts/{id}/settle-invoice"
    description: "Record payment of the issued invoice."
    roles: [PlatformAdmin]
    code: 200
    input: ["payment_reference?"]
    output: RentalContract
    side_effects:
      - "billing_state INVOICED -> SETTLED"
      - "fulfillment_state DEMOBILIZED -> CLOSED when the fulfillment dimension is already finished"

  # ---- UnitDeployment ------------------------------------------------------
  - method: POST
    path: "/unit-deployments"
    description: "Commit a physical unit to a contract for a closed date interval."
    roles: [DispatchPlanner]
    code: 201
    input: [contract_id, asset_unit_id, deploy_from, deploy_to]
    output: UnitDeployment
    side_effects: ["state RESERVED", "site_id seeded from RentalContract.site_id", "relocation_count 0"]
  - method: GET
    path: "/unit-deployments/{id}"
    description: "Read one deployment."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: []
    output: UnitDeployment
    side_effects: []
  - method: GET
    path: "/unit-deployments"
    description: "Filtered list. Reverse lookup for UnitDeployment.contract_id, .asset_unit_id and .site_id."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: ["contract_id?", "asset_unit_id?", "site_id?", "state?", "limit?", "offset?"]
    output: UnitDeployment[]
    side_effects: []
  - method: POST
    path: "/unit-deployments/{id}/relocate"
    description: "Move a deployed unit to another site of the same account and bill the relocation."
    roles: [DispatchPlanner]
    code: 200
    input: [destination_site_id, effective_date, "relocation_reason?"]
    output: UnitDeployment
    side_effects:
      - "site_id = destination_site_id; relocation_count += 1"
      - "create a RELOCATION ChargeEvent in state ASSESSED (calculations.relocation_charge)"
      - "recompute RentalContract.charge_debits_cents and RentalContract.net_billable_cents"
      - "recompute ServiceSite.deployed_unit_count for both the origin and the destination site"

  # ---- ServiceSchedule -----------------------------------------------------
  - method: POST
    path: "/service-schedules"
    description: "Attach a contract's unit count to a route for a weekday, consuming route capacity."
    roles: [DispatchPlanner]
    code: 201
    input: [contract_id, route_id, service_day, window_start_minute, window_end_minute]
    output: ServiceSchedule
    side_effects:
      - "freeze units_on_route (calculations.schedule_units_on_route)"
      - "recompute Route.committed_units and Route.density_planned_pct"
  - method: GET
    path: "/service-schedules/{id}"
    description: "Read one schedule including its frozen units_on_route."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: []
    output: ServiceSchedule
    side_effects: []
  - method: GET
    path: "/service-schedules"
    description: "Filtered list. Reverse lookup for ServiceSchedule.contract_id and .route_id."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: ["contract_id?", "route_id?", "state?", "limit?", "offset?"]
    output: ServiceSchedule[]
    side_effects: []
  - method: POST
    path: "/service-schedules/{id}/suspend"
    description: "Release the schedule's units from the route and cancel its future planned visits."
    roles: [DispatchPlanner]
    code: 200
    input: ["suspension_reason?"]
    output: ServiceSchedule
    side_effects:
      - "state ACTIVE -> SUSPENDED"
      - "recompute Route.committed_units and Route.density_planned_pct"
      - "cascade ServiceVisit PLANNED -> CANCELLED for future visits of this schedule"

  # ---- ServiceVisit --------------------------------------------------------
  - method: POST
    path: "/service-visits"
    description: "Plan a SETUP, SERVICE or TEARDOWN leg inside the site's gate window and clear of other route windows."
    roles: [DispatchPlanner]
    code: 201
    input: [schedule_id, visit_kind, scheduled_date, window_start_minute, window_end_minute]
    output: ServiceVisit
    side_effects: ["state PLANNED", "route_id denormalized from the schedule", "units_serviced 0, gallons_pumped 0"]
  - method: GET
    path: "/service-visits/{id}"
    description: "Read one visit."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: []
  - method: GET
    path: "/service-visits"
    description: "Filtered list. Reverse lookup for ServiceVisit.schedule_id, .route_id and the self-referential .rerun_of_visit_id."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: ["schedule_id?", "route_id?", "rerun_of_visit_id?", "state?", "scheduled_date?", "visit_kind?", "limit?", "offset?"]
    output: ServiceVisit[]
    side_effects: []
  - method: POST
    path: "/service-visits/{id}/dispatch"
    description: "Send the truck. Requires the route to be ACTIVE."
    roles: [DriverOperator]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["state PLANNED -> EN_ROUTE", "Route.last_run_date advanced to max(last_run_date, scheduled_date)"]
  - method: POST
    path: "/service-visits/{id}/complete"
    description: "Record the pump-out and close the visit."
    roles: [DriverOperator]
    code: 200
    input: [gallons_pumped]
    output: ServiceVisit
    side_effects:
      - "state EN_ROUTE -> SERVICED; units_serviced = schedule.units_on_route"
      - "recompute Route.density_realized_pct"
      - "recompute WasteManifest.gallons_total for every OPEN manifest on the same route and date"
  - method: POST
    path: "/service-visits/{id}/mark-missed"
    description: "Record a missed service; generates the missed-service credit and the four-hop credit cascade."
    roles: [DispatchPlanner]
    code: 200
    input: [missed_reason]
    output: ServiceVisit
    side_effects:
      - "state PLANNED|EN_ROUTE -> MISSED"
      - "create a MISSED_SERVICE_CREDIT ChargeEvent in state ASSESSED (calculations.missed_service_credit, evaluated on the PRE-transition Route.density_planned_pct)"
      - "recompute RentalContract.credit_accrued_cents and RentalContract.net_billable_cents; INVOICED -> REBILL_REQUIRED if applicable"
      - "recompute RentalAccount.open_credit_balance_cents, then RentalAccount.billing_hold"
      - "recompute Route.density_realized_pct last"
  - method: POST
    path: "/service-visits/{id}/schedule-rerun"
    description: "Book the route re-run for a missed visit; creates a linked RERUN visit."
    roles: [DispatchPlanner]
    code: 201
    input: [rerun_date, window_start_minute, window_end_minute]
    output: ServiceVisit
    side_effects:
      - "original visit MISSED -> RERUN_SCHEDULED"
      - "create a new ServiceVisit with visit_kind RERUN, state PLANNED and rerun_of_visit_id pointing at the original"
      - "no credit reversal"

  # ---- WasteManifest -------------------------------------------------------
  - method: POST
    path: "/waste-manifests"
    description: "Open a haul manifest for one route and date."
    roles: [DriverOperator]
    code: 201
    input: [route_id, disposal_site_id, manifest_date, waste_class]
    output: WasteManifest
    side_effects: ["state OPEN", "gallons_total computed from already-SERVICED visits on that route and date (calculations.manifest_gallons_total)"]
  - method: GET
    path: "/waste-manifests/{id}"
    description: "Read one manifest."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: []
    output: WasteManifest
    side_effects: []
  - method: GET
    path: "/waste-manifests"
    description: "Filtered list. Reverse lookup for WasteManifest.route_id and .disposal_site_id."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: ["route_id?", "disposal_site_id?", "state?", "manifest_date?", "limit?", "offset?"]
    output: WasteManifest[]
    side_effects: []
  - method: POST
    path: "/waste-manifests/{id}/seal"
    description: "Freeze the manifest volume and commit it against the disposal site's daily cap. OCC-guarded on the route."
    roles: [DriverOperator]
    code: 200
    input: [expected_route_version, "seal_note?"]
    output: WasteManifest
    side_effects:
      - "state OPEN -> SEALED; gallons_total frozen"
      - "recompute DisposalSite.committed_gallons_today"
      - "increments Route.version by 1"
  - method: POST
    path: "/waste-manifests/{id}/accept"
    description: "Record facility acceptance of the sealed load."
    roles: [ComplianceOfficer]
    code: 200
    input: ["acceptance_note?"]
    output: WasteManifest
    side_effects: ["state SEALED -> ACCEPTED", "recompute DisposalSite.committed_gallons_today"]

  # ---- ChargeEvent ---------------------------------------------------------
  - method: POST
    path: "/charge-events"
    description: "Assess a damage or tip-over charge against a unit."
    roles: [ComplianceOfficer]
    code: 201
    input: [contract_id, asset_unit_id, charge_kind, "severity?"]
    output: ChargeEvent
    side_effects:
      - "state ASSESSED; assessed_by_user_id = X-User-ID; assessed_at = logical-clock instant"
      - "amount_cents from calculations.damage_tip_over_charge"
      - "recompute AssetUnit.damage_strikes / AssetUnit.tip_over_count; DEPLOYED -> IN_REPAIR at the strike threshold, or DEPLOYED -> RETIRED on TOTAL_LOSS"
      - "recompute RentalContract.charge_debits_cents and RentalContract.net_billable_cents; INVOICED -> REBILL_REQUIRED if applicable"
      - "recompute ServiceSite.site_posture for the contract's site when charge_kind == TIP_OVER (an open tip-over makes the site RESTRICTED)"
  - method: GET
    path: "/charge-events/{id}"
    description: "Read one charge event."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: []
    output: ChargeEvent
    side_effects: []
  - method: GET
    path: "/charge-events"
    description: "Filtered list. Reverse lookup for ChargeEvent.contract_id, .asset_unit_id and .source_visit_id."
    roles: [PlatformAdmin, SalesRep, PermitCoordinator, DispatchPlanner, DriverOperator, ComplianceOfficer, CustomerContact]
    code: 200
    input: ["contract_id?", "asset_unit_id?", "source_visit_id?", "charge_kind?", "state?", "limit?", "offset?"]
    output: ChargeEvent[]
    side_effects: []
  - method: POST
    path: "/charge-events/{id}/dispute"
    description: "Customer contests the charge inside the dispute window."
    roles: [CustomerContact]
    code: 200
    input: [dispute_reason]
    output: ChargeEvent
    side_effects:
      - "state ASSESSED -> DISPUTED"
      - "recompute RentalContract.charge_debits_cents / credit_accrued_cents / net_billable_cents (the amount leaves the input set)"
      - "recompute RentalAccount.open_credit_balance_cents and RentalAccount.billing_hold"
      - "recompute ServiceSite.site_posture when charge_kind == TIP_OVER"
  - method: POST
    path: "/charge-events/{id}/uphold"
    description: "Officer confirms the charge. Segregation of duties applies."
    roles: [ComplianceOfficer]
    code: 200
    input: ["resolution_note?"]
    output: ChargeEvent
    side_effects:
      - "state ASSESSED|DISPUTED -> UPHELD; resolved_by_user_id = X-User-ID"
      - "recompute the contract ledger fields and the account credit balance (a DISPUTED amount re-enters the input set)"
      - "recompute ServiceSite.site_posture when charge_kind == TIP_OVER (an UPHELD tip-over no longer restricts the site)"
  - method: POST
    path: "/charge-events/{id}/waive"
    description: "Officer waives the charge, compensating every ledger and strike effect it caused."
    roles: [ComplianceOfficer]
    code: 200
    input: ["resolution_note?"]
    output: ChargeEvent
    side_effects:
      - "state ASSESSED|DISPUTED -> WAIVED; resolved_by_user_id = X-User-ID"
      - "recompute RentalContract.charge_debits_cents / credit_accrued_cents / net_billable_cents"
      - "recompute RentalAccount.open_credit_balance_cents, then RentalAccount.billing_hold"
      - "recompute AssetUnit.damage_strikes / tip_over_count; IN_REPAIR -> IN_YARD when the sum falls back under the threshold"
      - "recompute ServiceSite.site_posture when charge_kind == TIP_OVER"

  # ---- Test-driving surface (outside the public business API) ---------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z: before any
      call to this endpoint the logical clock reads that instant and NEVER falls back to real
      wall-clock time. Advancing the clock runs the PlacementPermit APPROVED -> EXPIRED sweep and the
      site-blocking cascade that follows from it.
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, expired_permit_count: integer, blocked_site_count: integer, suspended_schedule_count: integer }
    side_effects:
      - "logical clock repositioned"
      - "every APPROVED PlacementPermit whose effective_to is before the new calendar date -> EXPIRED, ordered by PlacementPermit.created_at ASC"
      - "for each affected site: recompute permit_status and site_posture, then cascade schedule suspension and future-visit cancellation"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- auth ----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles: list."
  - id: ERR_ACCOUNT_SCOPE_VIOLATION
    http: 403
    condition: "A CustomerContact acts on a resource that does not resolve to the RentalAccount whose id equals X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID resolving a ChargeEvent (uphold / waive) equals the ChargeEvent.assessed_by_user_id that created it."

  # ---- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Request shape violation as enumerated at validations priority 3: a required field absent, wrong type, out-of-range integer, non-member enum value, a broken same-payload ordering rule (window_end_minute <= window_start_minute, term_end < term_start, effective_to < effective_from, deploy_to < deploy_from), a broken conditional-field rule (EVENT contract without construction_phase EVENT_NA, DAMAGE without severity, TIP_OVER with severity, DAMAGE/TIP_OVER without asset_unit_id), a client-supplied system-only enum member (charge_kind MISSED_SERVICE_CREDIT, visit_kind RERUN), or ServiceSchedule.service_day not equal to Route.service_day."

  # ---- existence -----------------------------------------------------------
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "The referenced RentalAccount id does not exist."
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "The referenced ServiceSite id (site_id or destination_site_id) does not exist."
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "The referenced PlacementPermit id does not exist."
  - id: ERR_ASSET_UNIT_NOT_FOUND
    http: 404
    condition: "The referenced AssetUnit id does not exist."
  - id: ERR_DISPOSAL_SITE_NOT_FOUND
    http: 404
    condition: "The referenced DisposalSite id does not exist."
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "The referenced Route id does not exist."
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "The referenced RentalContract id does not exist."
  - id: ERR_DEPLOYMENT_NOT_FOUND
    http: 404
    condition: "The referenced UnitDeployment id does not exist."
  - id: ERR_SCHEDULE_NOT_FOUND
    http: 404
    condition: "The referenced ServiceSchedule id does not exist."
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "The referenced ServiceVisit id (path id or rerun_of_visit_id) does not exist."
  - id: ERR_MANIFEST_NOT_FOUND
    http: 404
    condition: "The referenced WasteManifest id does not exist."
  - id: ERR_CHARGE_NOT_FOUND
    http: 404
    condition: "The referenced ChargeEvent id does not exist."

  # ---- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not equal the stored RentalContract.version (see §1.2.1 quote-supersede-stale-contract)."
  - id: ERR_STALE_ROUTE_VERSION
    http: 412
    condition: "expected_route_version does not equal the stored Route.version (see §1.2.1 manifest-seal-stale-route)."

  # ---- state ---------------------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The requested action is not a declared transition out of the target entity's current state (including any attempt to leave a terminal state, and any second application of a once-only trigger)."
  - id: ERR_SITE_POSTURE_BLOCKED
    http: 409
    condition: "The operation needs a placeable site but ServiceSite.site_posture is BLOCKED (a required permit kind has no filing, or its latest filing is DRAFT, SUBMITTED, REJECTED or EXPIRED)."
  - id: ERR_SITE_POSTURE_RESTRICTED
    http: 409
    condition: "The operation needs an unrestricted site but ServiceSite.site_posture is RESTRICTED (all required permits are APPROVED, yet an ASSESSED or DISPUTED TIP_OVER ChargeEvent is open against a contract on that site)."
  - id: ERR_ROUTE_SUSPENDED
    http: 409
    condition: "Route.status is SUSPENDED rather than ACTIVE, so the visit cannot be dispatched onto it."
  - id: ERR_DISPOSAL_SITE_CLOSED
    http: 409
    condition: "DisposalSite.status is CLOSED rather than ACCEPTING when a manifest is sealed or accepted."

  # ---- business constraints -----------------------------------------------
  - id: ERR_PERMIT_REVISION_LIMIT
    http: 409
    condition: "A REJECTED -> SUBMITTED resubmission would make PlacementPermit.revision_round exceed PERMIT_MAX_REVISION_ROUNDS (3)."
  - id: ERR_SITE_ACCESS_INFEASIBLE
    http: 422
    condition: "AssetUnit.tare_length_ft exceeds ServiceSite.max_truck_length_ft for the governing site (the contract site on create, the destination site on relocate), so the unit physically cannot be placed."
  - id: ERR_ACCESS_WINDOW_VIOLATION
    http: 422
    condition: "The visit window is not contained by the site gate window: window_start_minute < ServiceSite.gate_open_minute or window_end_minute > ServiceSite.gate_close_minute."
  - id: ERR_ROUTE_WINDOW_CONFLICT
    http: 409
    condition: "The visit's buffered half-open window [start - 20, end + 20) overlaps the buffered window of another non-terminal ServiceVisit on the same route and date."
  - id: ERR_UNIT_DOUBLE_BOOKED
    http: 409
    condition: "The requested closed inclusive interval [deploy_from, deploy_to] touches an existing RESERVED or DEPLOYED UnitDeployment interval for the same AssetUnit; sharing a single endpoint date is a conflict."
  - id: ERR_ROUTE_UNIT_CAPACITY_EXCEEDED
    http: 422
    condition: "Route.committed_units + the new schedule's units_on_route would exceed Route.truck_capacity_units (equality passes; strictly greater is rejected)."
  - id: ERR_DISPOSAL_CLASS_NOT_ACCEPTED
    http: 422
    condition: "The manifest's waste_class is not a member of the DisposalSite.accepted_waste_classes list."
  - id: ERR_MANIFEST_NO_SERVICED_VISITS
    http: 422
    condition: "A manifest is opened for a (route, date) pair that has no SERVICED ServiceVisit, so its gallons_total input set is empty."
  - id: ERR_DISPOSAL_CAP_EXCEEDED
    http: 422
    condition: "Sealing would make the facility's committed gallons for manifest_date strictly exceed DisposalSite.daily_gallon_cap (landing exactly on the cap is allowed)."
  - id: ERR_RECONCILIATION_NO_DEPLOYMENTS
    http: 422
    condition: "Demobilizing a contract whose reconciled_actual input set is empty: no UnitDeployment ever reached DEPLOYED, so no actual unit mix can be reconciled."
  - id: ERR_ACCOUNT_BILLING_HOLD
    http: 402
    condition: "A revenue-advancing operation (contract activation, invoicing) is attempted while RentalAccount.billing_hold is true."
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 409
    condition: "A ChargeEvent dispute is filed more than CHARGE_DISPUTE_WINDOW_DAYS (14) after ChargeEvent.assessed_at, measured on the logical clock."

# =============================================================================
# §1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator of record. Owns the fleet, disposal reference data, the customer master and the logical clock; settles invoices. Deliberately excluded from quoting, permit decisions, dispatch and charge assessment."
    identity: opaque
    exclusive_operations:
      - "POST /rental-accounts"
      - "POST /asset-units"
      - "POST /disposal-sites"
      - "POST /rental-contracts/{id}/settle-invoice"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /service-sites (with SalesRep)"
      - "all GET reads"

  - name: SalesRep
    description: "Books demand: creates sites and contracts, runs the unit-mix quote, activates the contract and issues the invoice."
    identity: opaque
    exclusive_operations:
      - "POST /rental-contracts/{id}/quote"
      - "POST /rental-contracts/{id}/activate"
      - "POST /rental-contracts/{id}/invoice"
    shared_operations:
      - "POST /service-sites (with PlatformAdmin)"
      - "POST /rental-contracts (with CustomerContact)"
      - "all GET reads"

  - name: PermitCoordinator
    description: "Files placement and right-of-way permits and drives the resubmission cycle. Cannot decide its own filings — approval and rejection belong to ComplianceOfficer."
    identity: opaque
    exclusive_operations:
      - "POST /placement-permits"
      - "POST /placement-permits/{id}/submit"
    shared_operations:
      - "all GET reads"

  - name: DispatchPlanner
    description: "Owns route capacity and field plan: routes, deployments, relocations, schedules, visit planning, missed-service declaration, route re-runs and demobilization."
    identity: opaque
    exclusive_operations:
      - "POST /routes"
      - "POST /unit-deployments"
      - "POST /unit-deployments/{id}/relocate"
      - "POST /service-schedules"
      - "POST /service-schedules/{id}/suspend"
      - "POST /service-visits"
      - "POST /service-visits/{id}/mark-missed"
      - "POST /service-visits/{id}/schedule-rerun"
      - "POST /rental-contracts/{id}/demobilize"
    shared_operations:
      - "all GET reads"

  - name: DriverOperator
    description: "Executes the route in the field: dispatch, completion with pumped gallons, and opening and sealing haul manifests."
    identity: opaque
    exclusive_operations:
      - "POST /service-visits/{id}/dispatch"
      - "POST /service-visits/{id}/complete"
      - "POST /waste-manifests"
      - "POST /waste-manifests/{id}/seal"
    shared_operations:
      - "all GET reads"

  - name: ComplianceOfficer
    description: "Independent control function: decides permit filings, records facility acceptance of sealed loads, assesses damage and tip-over charges and resolves them. Subject to segregation of duties — the X-User-ID that assessed a charge may not uphold or waive it (validations priority 7)."
    identity: opaque
    exclusive_operations:
      - "POST /placement-permits/{id}/approve"
      - "POST /placement-permits/{id}/reject"
      - "POST /waste-manifests/{id}/accept"
      - "POST /charge-events"
      - "POST /charge-events/{id}/uphold"
      - "POST /charge-events/{id}/waive"
    shared_operations:
      - "all GET reads"

  - name: CustomerContact
    description: "The renting customer. X-User-ID is the RentalAccount.id, so every write is scoped to that account (validations priority 6). May raise its own contracts and dispute charges billed to it."
    identity: "entity_backed:RentalAccount"
    exclusive_operations:
      - "POST /charge-events/{id}/dispute"
    shared_operations:
      - "POST /rental-contracts (with SalesRep; account_id must equal X-User-ID)"
      - "all GET reads"
