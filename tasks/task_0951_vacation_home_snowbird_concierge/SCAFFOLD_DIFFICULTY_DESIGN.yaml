  - rule_id: priority_pair_validation_conflict
    instances:
      - name: visit_create_missing_field_and_unknown_property_returns_404
        grounds:
          - validations[priority=9]
          - validations[priority=59]
          - errors[ERR_PROPERTY_NOT_FOUND]
          - errors[ERR_MISSING_REQUIRED_FIELD]
          - gate_precedence.G3
          - gate_precedence.G10
        distinguishing_aspect: |
          Error-category pair `existence` (rung 9, G3) versus `business_constraint` (rung 59,
          G10). One request violates both: property_id names no row AND scheduled_end_at is
          absent. Because payload validation is deliberately the LAST gate, the response is
          ERR_PROPERTY_NOT_FOUND with 404, never ERR_MISSING_REQUIRED_FIELD with 400.
        test_recipe:
          setup:
            - "A ChecklistTemplate for ROUTINE_WATCH exists so checklist_template_id resolves."
            - "No Property row exists with the id used in the trigger."
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/checklist-templates"
              payload: { visit_type: "ROUTINE_WATCH", version_label: "2026.1", item_codes: ["EXT_WALK"], critical_item_codes: [] }
              as: PlatformAdmin
              captures: { tmpl_id: $.data.id }
          trigger:
            - call: "POST /property-care/visits"
              payload: { property_id: "00000000-0000-4000-8000-000000000000", checklist_template_id: "${tmpl_id}", visit_type: "ROUTINE_WATCH", trigger_source: "SCHEDULED", scheduled_start_at: "2026-06-02T13:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_PROPERTY_NOT_FOUND"
            - "no Visit row is created"

      - name: auditor_write_on_unknown_visit_returns_403_not_404
        grounds:
          - validations[priority=3]
          - validations[priority=7]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_RESOURCE_NOT_FOUND]
          - roles.Auditor
        distinguishing_aspect: |
          Error-category pair `auth` (rung 3, G2) versus `existence` (rung 7, G3) — a
          different pair from the existence-versus-payload instance. The read-only Auditor
          attempts a write against a visit id that does not exist; the role gate fires first,
          so the answer is 403 ERR_ROLE_NOT_PERMITTED and the absence of the row is never
          reported.
        test_recipe:
          setup:
            - "An empty database apart from the logical clock; no Visit rows exist."
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /property-care/visits/00000000-0000-4000-8000-000000000001/abort"
              payload: {}
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "response data.error_id == ERR_ROLE_NOT_PERMITTED"

      - name: mark_delinquent_on_paused_subscription_returns_409_invalid_state
        grounds:
          - validations[priority=18]
          - validations[priority=56]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_NOT_YET_DELINQUENT]
          - state_machines.Subscription.ACTIVE_to_DELINQUENT
        distinguishing_aspect: |
          Error-category pair `state` (rung 18, G5) versus `business_fiscal` (rung 56, G9) —
          a third distinct pair. A PAUSED subscription with no issued invoice at all violates
          both rungs; the target-state gate sits three gates earlier, so the answer is 409
          ERR_INVALID_STATE_TRANSITION and never ERR_NOT_YET_DELINQUENT.
        test_recipe:
          setup:
            - "A STANDARD subscription activated then paused, with no Invoice ever created."
          setup_api_calls:
