          trigger: []
          assert:
            - "statement.escrow_fee_cents == 2500000 (capped; uncapped tier_sum would be 3250000)"
      - name: c_proration_partial_month_boundary
        claim_type: correct_result
        grounds: [calculations.closing_proration]
        distinguishing_aspect: "MONTHLY half-month credit boundary: expected close on the 15th (<= 15) adds round_half_up(120000/24)=5000; on the 16th it adds 0. Same annual fee 120000: 65000 vs 60000."
        test_recipe:
          setup: ["two MONTHLY files, annual fee 120000, closes 2026-06-15 and 2026-06-16"]
          setup_api_calls:
            - { call: "POST /api/aircraft", payload: { n_number: "N132P1", serial_number: "S-21", make_model: "Piper Mirage", year: 2015 }, as: EscrowOfficer, captures: { a1: $.data.id } }
            - { call: "POST /api/aircraft", payload: { n_number: "N132P2", serial_number: "S-22", make_model: "Piper Mirage", year: 2016 }, as: EscrowOfficer, captures: { a2: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "BUYER", legal_name: "Buyer Co" }, as: EscrowOfficer, captures: { b: $.data.id } }
            - { call: "POST /api/parties", payload: { party_type: "SELLER", legal_name: "Seller Co" }, as: EscrowOfficer, captures: { s: $.data.id } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${a1}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 2000000, annual_registration_fee_cents: 120000, proration_method: "MONTHLY", expected_close_date: "2026-06-15" }, as: EscrowOfficer, captures: { f1: $.data.id, p1: $.data.proration_amount_cents } }
            - { call: "POST /api/escrow-files", payload: { aircraft_id: "${a2}", buyer_party_id: "${b}", seller_party_id: "${s}", purchase_price_cents: 2000000, annual_registration_fee_cents: 120000, proration_method: "MONTHLY", expected_close_date: "2026-06-16" }, as: EscrowOfficer, captures: { f2: $.data.id, p2: $.data.proration_amount_cents } }
          trigger: []
          assert:
            - "EscrowFile.${f1}.proration_amount_cents == 65000 (6 months x 10000 + half month 5000; day 15 counts)"
            - "EscrowFile.${f2}.proration_amount_cents == 60000 (day 16: no half month)"
      - name: c_payoff_record_on_good_through
        claim_type: correct_result
        grounds: [calculations.effective_lien_payoff]
        distinguishing_aspect: "PER_DIEM recorded exactly on good_through_date is allowed (inclusive end) with days capped: 2026-06-01 quote recorded 2026-06-30 gives 500000 + 5000 x 29 = 645000."
        test_recipe:
          setup: ["lien with PER_DIEM release quoted at 2026-06-01, good_through 2026-06-30; clock advanced to exactly 2026-06-30"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EscrowManager }
