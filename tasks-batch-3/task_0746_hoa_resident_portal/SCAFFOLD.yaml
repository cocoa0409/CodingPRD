scenario: |
  746. HOA / Community-Association Resident Portal: homeowner portal & account, assessment
  billing & autopay, architectural-request (ARC) submission & review, violation reporting &
  fine workflow, amenity reservation (pool/clubhouse) booking, board/meeting & voting,
  document/CC&R library, work-order

domain_name: hoa-resident-portal
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by FKs; nested paths only for sub-resource discovery (reviews,
  # ballots, reservations). Homeowner is the identity backbone; Property, Assessment,
  # ARCRequest, Violation, Motion, Amenity are peer resource roots.

  state_machine_shape: branching
  # ARCRequest is cyclic (REVISION_REQUESTED -> SUBMITTED); Violation is branching with
  # appeal reverts; WorkOrder carries parallel state dimensions (work_status x
  # payment_status). No single-shape pipeline dominates.

  relationship_patterns:
    - one_to_many         # Homeowner:Property, Property:Assessment, Motion:Ballot, etc.
    - cross_aggregate     # Payment reversal on Assessment cascades to Homeowner score
                          # and then Homeowner booking privilege (three aggregates).

  role_model: peer_roles
  # Homeowner and BoardMember are both entity_backed:Homeowner but with orthogonal
  # capabilities (dues/reservations vs review/vote). HOAManager and ComplianceOfficer
  # are opaque operational roles that own disjoint resource types (billing/work orders
  # vs violation confirmation/appeal adjudication).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Homeowner
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Unique login email"
        constraints: "unique across Homeowner rows; case-insensitive match"
      - name: full_name
        type: string
        source: input
        description: "Display name for portal + audit trails"
      - name: is_board_member
        type: boolean
        source: input
        description: "True iff this homeowner is currently seated on the board and may act as BoardMember role"
        default: false
      - name: standing
        type: enum
        source: computed
        description: "GOOD_STANDING when delinquency_score < 500; MARGINAL when 500..1499; DELINQUENT when >= 1500. Recomputed on any Assessment/Payment side-effect."
        default: GOOD_STANDING
        constraints: "one of {GOOD_STANDING, MARGINAL, DELINQUENT}"
      - name: delinquency_score
        type: integer
        source: computed
        description: "Score in units of dollars derived by calculations.homeowner_delinquency_score; refreshed by any Assessment/Payment side-effect on any property owned by this homeowner"
        default: 0
      - name: booking_privilege
        type: enum
        source: computed
        description: "ALLOWED when standing in {GOOD_STANDING, MARGINAL}; FROZEN when standing == DELINQUENT. Gates AmenityReservation creation cross-entity."
        default: ALLOWED
        constraints: "one of {ALLOWED, FROZEN}"

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: homeowner_id
        type: string
        source: input
        description: "FK -> Homeowner.id; the current owner-of-record"
      - name: address
        type: string
        source: input
        description: "Street address; unique per community"
        constraints: "unique across Property rows"
      - name: monthly_dues_cents
        type: integer
        source: input
        description: "Baseline monthly assessment amount in cents"
        constraints: ">= 0"
      - name: compliance_flag
        type: enum
        source: computed
        description: "OPEN under default state; APPROVED_MOD after any ARCRequest approval on this property; SUSPENDED once an unresolved Violation reaches FINED for >= 60 days without appeal. Gates ARCRequest.submit cross-entity."
        default: OPEN
        constraints: "one of {OPEN, APPROVED_MOD, SUSPENDED}"
      - name: total_outstanding_cents
        type: integer
        source: computed
        description: "Sum of amount_due_cents - amount_paid_cents across Assessment rows whose status IN {OPEN, PARTIALLY_PAID, OVERDUE, DELINQUENT}, plus sum of fine_balance_cents across Violation rows whose status IN {FINED, APPEALED, UPHELD}."
        default: 0
      - name: fine_balance_cents
        type: integer
        source: computed
        description: "Sum of Violation.fine_amount_cents for rows on this property with status IN {FINED, APPEALED, UPHELD}; drops to 0 on OVERTURNED"
        default: 0

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property being billed"
      - name: billing_period_start
        type: datetime
        source: input
        description: "Inclusive start of the billing month (ISO 8601 UTC; typically YYYY-MM-01T00:00:00Z)"
      - name: billing_period_end
        type: datetime
        source: input
        description: "Exclusive end of the billing month (first instant of the following month)"
      - name: prorate_from
        type: datetime
        source: input
        description: "If set (mid-cycle onboarding), amount_due_cents is prorated over [prorate_from, billing_period_end); otherwise full monthly_dues_cents is charged"
        default: null
      - name: amount_due_cents
        type: integer
        source: computed
        description: "Result of calculations.assessment_prorate at create time; immutable afterward"
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Sum of Payment.amount_cents for this assessment where Payment.status == POSTED"
        default: 0
      - name: late_fee_cents
        type: integer
        source: computed
        description: "Result of calculations.late_fee at the moment the assessment is marked OVERDUE"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "OPEN | PARTIALLY_PAID | PAID | OVERDUE | DELINQUENT | ON_LIEN; state machine governs transitions"
        default: OPEN
        constraints: "one of {OPEN, PARTIALLY_PAID, PAID, OVERDUE, DELINQUENT, ON_LIEN}"
      - name: due_date
        type: datetime
        source: input
        description: "Cut-off after which the assessment tips to OVERDUE (typically billing_period_end + 15 days)"

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: assessment_id
        type: string
        source: input
        description: "FK -> Assessment.id; the assessment this payment settles against"
      - name: amount_cents
        type: integer
        source: input
        description: "Amount posted in cents; must be > 0 and <= (Assessment.amount_due_cents + late_fee_cents - amount_paid_cents)"
        constraints: "> 0"
      - name: method
        type: enum
        source: input
        description: "MANUAL | AUTOPAY"
        constraints: "one of {MANUAL, AUTOPAY}"
      - name: posted_at
        type: datetime
        source: system
        description: "Server clock at post time"
      - name: status
        type: enum
        source: computed
        description: "POSTED on success; REVERSED after successful POST /payments/{id}/reverse"
        default: POSTED
        constraints: "one of {POSTED, REVERSED}"
      - name: reversal_reason
        type: string
        source: input
        description: "Reason string recorded on the reversal call; null while status == POSTED"
        default: null

  - name: AutopayMandate
    parent: null
    common_fields: true
    fields:
      - name: homeowner_id
        type: string
        source: input
        description: "FK -> Homeowner.id; the mandate authorizer"
      - name: max_charge_cents
        type: integer
        source: input
        description: "Upper bound per auto-charge in cents"
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE at create; SUPERSEDED when a newer mandate is created for the same homeowner; CANCELLED when explicitly revoked"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED, CANCELLED}"

  - name: ARCRequest
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property targeted by the modification"
      - name: submitter_homeowner_id
        type: string
        source: input
        description: "FK -> Homeowner.id; the acting homeowner (must equal Property.homeowner_id at create time)"
      - name: category
        type: enum
        source: input
        description: "SIMPLE | MEDIUM | COMPLEX; drives calculations.arc_finalization_fee base_cents"
        constraints: "one of {SIMPLE, MEDIUM, COMPLEX}"
      - name: description
        type: string
        source: input
        description: "Prose summary of the modification"
      - name: revision_count
        type: integer
        source: computed
        description: "Incremented each time the request transitions APPROVED_PENDING -> REVISION_REQUESTED"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "DRAFT | SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | APPROVED | REJECTED"
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED, REJECTED}"
      - name: fee_cents
        type: integer
        source: computed
        description: "Result of calculations.arc_finalization_fee stamped when status transitions to APPROVED or REJECTED"
        default: 0

  - name: ARCReview
    parent: null
    common_fields: true
    fields:
      - name: arc_request_id
        type: string
        source: input
        description: "FK -> ARCRequest.id; the request being reviewed"
      - name: reviewer_homeowner_id
        type: string
        source: input
        description: "FK -> Homeowner.id; must reference a Homeowner whose is_board_member == true"
      - name: weight
        type: integer
        source: input
        description: "Reviewer seniority weight (1..5); enters calculations.arc_finalization_fee as w_i"
        constraints: "1..5"
      - name: verdict
        type: enum
        source: input
        description: "APPROVE | REJECT | REVISE"
        constraints: "one of {APPROVE, REJECT, REVISE}"
      - name: comment
        type: string
        source: input
        description: "Free-text rationale"

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property in violation"
      - name: category
        type: enum
        source: input
        description: "NUISANCE | LANDSCAPE | STRUCTURAL | SAFETY; safety fines are non-appealable"
        constraints: "one of {NUISANCE, LANDSCAPE, STRUCTURAL, SAFETY}"
      - name: reported_at
        type: datetime
        source: system
        description: "Server clock at REPORTED-time"
      - name: fined_at
        type: datetime
        source: system
        description: "Server clock at FINED-time; null before"
        default: null
      - name: fine_amount_cents
        type: integer
        source: input
        description: "Fine assessed at fine-time; must be >= 2500 and <= 500000"
        default: 0
      - name: fine_balance_cents
        type: integer
        source: computed
        description: "Equals fine_amount_cents when status IN {FINED, APPEALED, UPHELD}; 0 otherwise"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "REPORTED | CONFIRMED | CURED | FINED | APPEALED | UPHELD | OVERTURNED"
        default: REPORTED
        constraints: "one of {REPORTED, CONFIRMED, CURED, FINED, APPEALED, UPHELD, OVERTURNED}"

  - name: Amenity
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name (e.g. 'Pool', 'Clubhouse')"
      - name: capacity
        type: integer
        source: input
        description: "Maximum simultaneous guests permitted across all overlapping reservations"
        constraints: "> 0"
      - name: reservation_window_start_hour
        type: integer
        source: input
        description: "First reservable hour (0..23, inclusive) in the amenity's local day"
        constraints: "0..23"
      - name: reservation_window_end_hour
        type: integer
        source: input
        description: "Last reservable hour (1..24, exclusive) in the amenity's local day"
        constraints: "1..24; must be > reservation_window_start_hour"
      - name: blackout_dates
        type: array
        source: input
        description: "Sorted list of ISO-8601 date strings (YYYY-MM-DD) on which no reservation may start or extend into"
        default: []

  - name: AmenityReservation
    parent: null
    common_fields: true
    fields:
      - name: amenity_id
        type: string
        source: input
        description: "FK -> Amenity.id; the resource being reserved"
      - name: homeowner_id
        type: string
        source: input
        description: "FK -> Homeowner.id; the reserving homeowner"
      - name: start_ts
        type: datetime
        source: input
        description: "Inclusive start of the reservation window (ISO 8601 UTC)"
      - name: end_ts
        type: datetime
        source: input
        description: "Exclusive end of the reservation window (ISO 8601 UTC); must be > start_ts"
      - name: guest_count
        type: integer
        source: input
        description: "Number of guests; enters capacity-overlap check"
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "BOOKED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW"
        default: BOOKED
        constraints: "one of {BOOKED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW}"

  - name: Motion
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Motion caption"
      - name: description
        type: string
        source: input
        description: "Prose describing what the motion approves"
      - name: category
        type: enum
        source: input
        description: "BUDGET | POLICY | ELECTION; categorises quorum and overlap semantics"
        constraints: "one of {BUDGET, POLICY, ELECTION}"
      - name: voting_window_start
        type: datetime
        source: input
        description: "Inclusive start of the voting window (ISO 8601 UTC)"
      - name: voting_window_end
        type: datetime
        source: input
        description: "Inclusive end of the voting window (ISO 8601 UTC); must be > voting_window_start"
      - name: eligible_voter_count
        type: integer
        source: input
        description: "Number of Homeowner rows eligible to cast a ballot on this motion (snapshot at motion creation)"
        constraints: ">= 1"
      - name: quorum_pct
        type: integer
        source: input
        description: "Quorum threshold in percent (1..100); ballots_cast >= ceil(eligible_voter_count * quorum_pct/100) required for motion to be decided"
        constraints: "1..100"
      - name: status
        type: enum
        source: computed
        description: "OPEN | CLOSED_PASSED | CLOSED_FAILED | QUORUM_FAILED"
        default: OPEN
        constraints: "one of {OPEN, CLOSED_PASSED, CLOSED_FAILED, QUORUM_FAILED}"
      - name: yes_count
        type: integer
        source: computed
        description: "Number of Ballot rows on this motion whose choice == YES"
        default: 0
      - name: no_count
        type: integer
        source: computed
        description: "Number of Ballot rows on this motion whose choice == NO"
        default: 0

  - name: Ballot
    parent: null
    common_fields: true
    fields:
      - name: motion_id
        type: string
        source: input
        description: "FK -> Motion.id; the motion being voted on"
      - name: homeowner_id
        type: string
        source: input
        description: "FK -> Homeowner.id; the casting voter"
      - name: choice
        type: enum
        source: input
        description: "YES | NO | ABSTAIN"
        constraints: "one of {YES, NO, ABSTAIN}"

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: related_property_id
        type: string
        source: input
        description: "FK -> Property.id; null for community-wide work orders"
        default: null
      - name: title
        type: string
        source: input
        description: "Short summary of the work to be performed"
      - name: cost_estimate_cents
        type: integer
        source: input
        description: "Manager-approved cost estimate in cents"
        constraints: ">= 0"
      - name: assigned_vendor_id
        type: string
        source: input
        description: "Opaque vendor identifier (external system id, not an internal entity)"
        default: null
      - name: work_status
        type: enum
        source: computed
        description: "First parallel dimension: NEW | ASSIGNED | IN_PROGRESS | COMPLETED | CANCELLED"
        default: NEW
        constraints: "one of {NEW, ASSIGNED, IN_PROGRESS, COMPLETED, CANCELLED}"
      - name: payment_status
        type: enum
        source: computed
        description: "Second parallel dimension: UNBILLED | INVOICED | PAID. Evolves independently of work_status."
        default: UNBILLED
        constraints: "one of {UNBILLED, INVOICED, PAID}"
      - name: source
        type: enum
        source: system
        description: "MANUAL when created via POST /work-orders; AUTO_ARC when auto-created by ARC approval cascade"
        default: MANUAL
        constraints: "one of {MANUAL, AUTO_ARC}"

  - name: Document
    parent: null
    common_fields: false
    fields:
      - name: title
        type: string
        source: input
        description: "Display title (e.g. 'CC&R 2025 Amendment')"
      - name: category
        type: enum
        source: input
        description: "CCR | POLICY | MINUTES | BUDGET"
        constraints: "one of {CCR, POLICY, MINUTES, BUDGET}"
      - name: content_url
        type: string
        source: input
        description: "URL to the stored document blob"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Assessment
    initial_state: OPEN
    terminal_states: [PAID, ON_LIEN]
    transitions:
      - from: OPEN
        to: PARTIALLY_PAID
        trigger: "POST /assessments/{id}/pay when 0 < amount_cents < (amount_due_cents + late_fee_cents - amount_paid_cents)"
        actor: Homeowner
        preconditions:
          - "Assessment.status == OPEN"
          - "Payment.amount_cents > 0"
          - "Payment.amount_cents + Assessment.amount_paid_cents < Assessment.amount_due_cents + Assessment.late_fee_cents"
        side_effects:
          - "Payment row created with status=POSTED"
          - "Assessment.amount_paid_cents incremented by Payment.amount_cents"
          - "Property.total_outstanding_cents recomputed (derived-field reconciliation)"
      - from: OPEN
        to: PAID
        trigger: "POST /assessments/{id}/pay when amount_cents equals the full outstanding"
        actor: Homeowner
        preconditions:
          - "Assessment.status == OPEN"
          - "Payment.amount_cents + Assessment.amount_paid_cents == Assessment.amount_due_cents + Assessment.late_fee_cents"
        side_effects:
          - "Payment row created with status=POSTED"
          - "Assessment.amount_paid_cents raised to full"
          - "Property.total_outstanding_cents recomputed"
          - "Homeowner.delinquency_score recomputed"
          - "Homeowner.standing and Homeowner.booking_privilege recomputed"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /assessments/{id}/pay when amount_cents closes the remainder"
        actor: Homeowner
        preconditions:
          - "Assessment.status == PARTIALLY_PAID"
          - "Payment.amount_cents + Assessment.amount_paid_cents == Assessment.amount_due_cents + Assessment.late_fee_cents"
        side_effects:
          - "Payment row created with status=POSTED"
          - "Property.total_outstanding_cents recomputed"
          - "Homeowner.delinquency_score recomputed"
      - from: OPEN
        to: OVERDUE
        trigger: "system: current_utc >= Assessment.due_date via POST /_clock/set_current_utc advancement"
        actor: system
        preconditions:
          - "Assessment.status == OPEN"
          - "current_utc >= Assessment.due_date"
        side_effects:
          - "late_fee_cents stamped from calculations.late_fee"
          - "Property.total_outstanding_cents recomputed (includes late fee)"
          - "Homeowner.delinquency_score recomputed"
      - from: PARTIALLY_PAID
        to: OVERDUE
        trigger: "system: current_utc >= Assessment.due_date"
        actor: system
        preconditions:
          - "Assessment.status == PARTIALLY_PAID"
          - "current_utc >= Assessment.due_date"
        side_effects:
          - "late_fee_cents stamped from calculations.late_fee"
          - "Property.total_outstanding_cents recomputed"
      - from: OVERDUE
        to: DELINQUENT
        trigger: "system: current_utc >= Assessment.due_date + 60 days"
        actor: system
        preconditions:
          - "Assessment.status == OVERDUE"
          - "current_utc >= Assessment.due_date + 60 days"
        side_effects:
          - "Homeowner.delinquency_score recomputed"
          - "Homeowner.standing may transition to DELINQUENT"
          - "If Homeowner.standing == DELINQUENT, Homeowner.booking_privilege set to FROZEN"
      - from: DELINQUENT
        to: ON_LIEN
        trigger: "POST /assessments/{id}/place-lien"
        actor: HOAManager
        preconditions:
          - "Assessment.status == DELINQUENT"
          - "current_utc >= Assessment.due_date + 90 days"
        side_effects:
          - "Assessment moves to terminal ON_LIEN"
      - from: PAID
        to: OVERDUE
        trigger: "POST /payments/{id}/reverse where the reversal drops amount_paid_cents below the full amount"
        actor: HOAManager
        preconditions:
          - "Assessment.status == PAID"
          - "Payment.status == POSTED"
          - "Payment.assessment_id == this Assessment.id"
          - "current_utc >= Assessment.due_date"
        side_effects:
          - "Payment.status set to REVERSED"
          - "Assessment.amount_paid_cents reduced by Payment.amount_cents"
          - "late_fee_cents restamped from calculations.late_fee"
          - "Property.total_outstanding_cents recomputed"
          - "Homeowner.delinquency_score recomputed (cascade link 2)"
          - "Homeowner.standing/booking_privilege recomputed (cascade link 3)"
      - from: PAID
        to: PARTIALLY_PAID
        trigger: "POST /payments/{id}/reverse where the reversal drops amount_paid_cents below full but current_utc < due_date"
        actor: HOAManager
        preconditions:
          - "Assessment.status == PAID"
          - "Payment.status == POSTED"
          - "current_utc < Assessment.due_date"
        side_effects:
          - "Payment.status set to REVERSED"
          - "Assessment.amount_paid_cents reduced"
          - "Property.total_outstanding_cents recomputed"

  - entity: ARCRequest
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /arc-requests/{id}/submit"
        actor: Homeowner
        preconditions:
          - "ARCRequest.status == DRAFT"
          - "Property.compliance_flag != SUSPENDED (cross-entity)"
          - "Homeowner.standing != DELINQUENT (cross-entity)"
        side_effects:
          - "ARCRequest.status set to SUBMITTED"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system: first ARCReview row created"
        actor: system
        preconditions:
          - "ARCRequest.status == SUBMITTED"
          - "count(ARCReview where arc_request_id == this.id) >= 1"
        side_effects:
          - "ARCRequest.status set to UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /arc-requests/{id}/finalize when any ARCReview.verdict == REVISE"
        actor: BoardMember
        preconditions:
          - "ARCRequest.status == UNDER_REVIEW"
          - "at least one ARCReview.verdict == REVISE on this request"
        side_effects:
          - "ARCRequest.revision_count incremented by 1"
          - "ARCRequest.status set to REVISION_REQUESTED"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /arc-requests/{id}/submit (cyclic — homeowner resubmits after revision)"
        actor: Homeowner
        preconditions:
          - "ARCRequest.status == REVISION_REQUESTED"
          - "ARCRequest.revision_count < 3"
          - "Property.compliance_flag != SUSPENDED"
        side_effects:
          - "ARCRequest.status set to SUBMITTED"
          - "Prior ARCReview rows on this request are archived (excluded from finalize sum)"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /arc-requests/{id}/finalize when all ARCReview.verdict IN {APPROVE} and no REVISE and no REJECT"
        actor: BoardMember
        preconditions:
          - "ARCRequest.status == UNDER_REVIEW"
          - "count(ARCReview.verdict != APPROVE) == 0 for current-revision reviews"
        side_effects:
          - "ARCRequest.fee_cents stamped from calculations.arc_finalization_fee"
          - "ARCRequest.status set to APPROVED"
          - "Property.compliance_flag set to APPROVED_MOD (cascade link 1)"
          - "WorkOrder auto-created with source=AUTO_ARC, related_property_id=Property.id, title=`Post-approval inspection`, cost_estimate_cents=0 (cascade link 2)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /arc-requests/{id}/finalize when any ARCReview.verdict == REJECT"
        actor: BoardMember
        preconditions:
          - "ARCRequest.status == UNDER_REVIEW"
          - "at least one ARCReview.verdict == REJECT"
        side_effects:
          - "ARCRequest.fee_cents stamped from calculations.arc_finalization_fee"
          - "ARCRequest.status set to REJECTED"

  - entity: Violation
    initial_state: REPORTED
    terminal_states: [CURED, UPHELD, OVERTURNED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /violations/{id}/confirm"
        actor: ComplianceOfficer
        preconditions:
          - "Violation.status == REPORTED"
        side_effects:
          - "Violation.status set to CONFIRMED"
      - from: CONFIRMED
        to: CURED
        trigger: "POST /violations/{id}/resolve with outcome=CURED"
        actor: ComplianceOfficer
        preconditions:
          - "Violation.status == CONFIRMED"
        side_effects:
          - "Violation.status set to CURED"
      - from: CONFIRMED
        to: FINED
        trigger: "POST /violations/{id}/fine"
        actor: ComplianceOfficer
        preconditions:
          - "Violation.status == CONFIRMED"
          - "Payload.fine_amount_cents in [2500, 500000]"
        side_effects:
          - "Violation.fine_amount_cents stamped"
          - "Violation.fine_balance_cents set to fine_amount_cents"
          - "Violation.fined_at stamped"
          - "Property.fine_balance_cents recomputed"
          - "Property.total_outstanding_cents recomputed"
      - from: FINED
        to: APPEALED
        trigger: "POST /violations/{id}/appeal"
        actor: Homeowner
        preconditions:
          - "Violation.status == FINED"
          - "Violation.category != SAFETY (safety fines non-appealable)"
          - "current_utc <= Violation.fined_at + 14 days"
        side_effects:
          - "Violation.status set to APPEALED"
      - from: APPEALED
        to: UPHELD
        trigger: "POST /violations/{id}/adjudicate with outcome=UPHOLD"
        actor: ComplianceOfficer
        preconditions:
          - "Violation.status == APPEALED"
        side_effects:
          - "Violation.status set to UPHELD"
      - from: APPEALED
        to: OVERTURNED
        trigger: "POST /violations/{id}/adjudicate with outcome=OVERTURN"
        actor: ComplianceOfficer
        preconditions:
          - "Violation.status == APPEALED"
        side_effects:
          - "Violation.status set to OVERTURNED"
          - "Violation.fine_balance_cents set to 0"
          - "Property.fine_balance_cents recomputed (invariant: original fine returned to zero)"
          - "Property.total_outstanding_cents recomputed"
      - from: FINED
        to: UPHELD
        trigger: "system: current_utc > Violation.fined_at + 14 days without an appeal"
        actor: system
        preconditions:
          - "Violation.status == FINED"
          - "current_utc > Violation.fined_at + 14 days"
        side_effects:
          - "Violation.status set to UPHELD (fine is now final)"

  - entity: AmenityReservation
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /amenity-reservations/{id}/check-in"
        actor: HOAManager
        preconditions:
          - "AmenityReservation.status == BOOKED"
          - "current_utc >= start_ts"
          - "current_utc < end_ts"
        side_effects:
          - "AmenityReservation.status set to CHECKED_IN"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system: current_utc >= AmenityReservation.end_ts"
        actor: system
        preconditions:
          - "AmenityReservation.status == CHECKED_IN"
          - "current_utc >= AmenityReservation.end_ts"
        side_effects:
          - "AmenityReservation.status set to COMPLETED"
      - from: BOOKED
        to: NO_SHOW
        trigger: "system: current_utc >= AmenityReservation.end_ts and no check-in occurred"
        actor: system
        preconditions:
          - "AmenityReservation.status == BOOKED"
          - "current_utc >= AmenityReservation.end_ts"
        side_effects:
          - "AmenityReservation.status set to NO_SHOW"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /amenity-reservations/{id}/cancel"
        actor: Homeowner
        preconditions:
          - "AmenityReservation.status == BOOKED"
          - "current_utc < AmenityReservation.start_ts"
        side_effects:
          - "AmenityReservation.status set to CANCELLED"
          - "capacity is restored for future overlap checks (compensating invariant)"

  - entity: Motion
    initial_state: OPEN
    terminal_states: [CLOSED_PASSED, CLOSED_FAILED, QUORUM_FAILED]
    transitions:
      - from: OPEN
        to: CLOSED_PASSED
        trigger: "POST /motions/{id}/close when quorum met and yes_count > no_count"
        actor: BoardMember
        preconditions:
          - "Motion.status == OPEN"
          - "current_utc >= Motion.voting_window_end"
          - "ballots_cast >= ceil(eligible_voter_count * quorum_pct / 100)"
          - "Motion.yes_count > Motion.no_count"
        side_effects:
          - "Motion.status set to CLOSED_PASSED"
      - from: OPEN
        to: CLOSED_FAILED
        trigger: "POST /motions/{id}/close when quorum met and yes_count <= no_count"
        actor: BoardMember
        preconditions:
          - "Motion.status == OPEN"
          - "current_utc >= Motion.voting_window_end"
          - "ballots_cast >= ceil(eligible_voter_count * quorum_pct / 100)"
          - "Motion.yes_count <= Motion.no_count"
        side_effects:
          - "Motion.status set to CLOSED_FAILED"
      - from: OPEN
        to: QUORUM_FAILED
        trigger: "POST /motions/{id}/close when quorum not met"
        actor: BoardMember
        preconditions:
          - "Motion.status == OPEN"
          - "current_utc >= Motion.voting_window_end"
          - "ballots_cast < ceil(eligible_voter_count * quorum_pct / 100)"
        side_effects:
          - "Motion.status set to QUORUM_FAILED"

  - entity: WorkOrder
    initial_state: NEW
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: NEW
        to: ASSIGNED
        trigger: "POST /work-orders/{id}/assign"
        actor: HOAManager
        preconditions:
          - "WorkOrder.work_status == NEW"
        side_effects:
          - "WorkOrder.work_status set to ASSIGNED"
          - "WorkOrder.assigned_vendor_id stamped"
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/start"
        actor: HOAManager
        preconditions:
          - "WorkOrder.work_status == ASSIGNED"
        side_effects:
          - "WorkOrder.work_status set to IN_PROGRESS"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: HOAManager
        preconditions:
          - "WorkOrder.work_status == IN_PROGRESS"
        side_effects:
          - "WorkOrder.work_status set to COMPLETED"
      - from: NEW
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: HOAManager
        preconditions:
          - "WorkOrder.work_status IN {NEW, ASSIGNED}"
          - "WorkOrder.payment_status == UNBILLED"
        side_effects:
          - "WorkOrder.work_status set to CANCELLED"
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /work-orders/{id}/invoice"
        actor: HOAManager
        preconditions:
          - "WorkOrder.payment_status == UNBILLED"
          - "WorkOrder.work_status IN {IN_PROGRESS, COMPLETED}"
        side_effects:
          - "WorkOrder.payment_status set to INVOICED"
        note: "Parallel dimension — work_status evolves independently after this point"
      - from: INVOICED
        to: PAID
        trigger: "POST /work-orders/{id}/mark-paid"
        actor: HOAManager
        preconditions:
          - "WorkOrder.payment_status == INVOICED"
        side_effects:
          - "WorkOrder.payment_status set to PAID"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: autopay-mandate-supersede-stale
    parent_entity: Homeowner
    write_endpoint: "POST /homeowners/{id}/autopay-mandate"
    occ_field: "expected_homeowner_version"
    description: |
      Creating a new AutopayMandate against a Homeowner whose version has advanced since
      the client last observed it is rejected. Under natural semantics a new mandate is
      allowed to supersede any active one — a second sequential create with a fresh view
      of the homeowner would succeed. The stale-version check catches the case where an
      earlier writer has already superseded the mandate the client thought it was replacing;
      the client's request is rejected as based on stale state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: assessment_prorate
    trigger: "POST /assessments (create) with prorate_from provided"
    algorithm: threshold
    formula: |
      # billing_period_start (inclusive), billing_period_end (exclusive), prorate_from (inclusive)
      # days_in_period = (billing_period_end - billing_period_start).days
      # If prorate_from is null OR prorate_from <= billing_period_start:
      #   amount_due_cents = monthly_dues_cents            # FULL_MONTH variant
      # Else:
      #   included_days = (billing_period_end - prorate_from).days
      #   raw = monthly_dues_cents * included_days / days_in_period
      #   amount_due_cents = round_half_up(raw)            # DAILY_PRORATE variant
    input_set: "Property.monthly_dues_cents; billing window dates; prorate_from"
    constants: {}
    precision: "cents; round_half_up"
    variants:
      - name: FULL_MONTH
        when: "prorate_from is null OR prorate_from <= billing_period_start"
        difference: "Charges the flat monthly_dues_cents; no daily proration"
      - name: DAILY_PRORATE
        when: "prorate_from > billing_period_start AND prorate_from < billing_period_end"
        difference: "Charges monthly_dues_cents * (billing_period_end - prorate_from).days / days_in_period, rounded half-up to nearest cent"

  - name: late_fee
    trigger: "Assessment transitions OPEN|PARTIALLY_PAID -> OVERDUE, and re-stamped on Payment reversal that returns Assessment to OVERDUE"
    algorithm: tiered_pricing
    formula: |
      # days_overdue = max(0, floor((current_utc - Assessment.due_date).total_seconds() / 86400))
      # outstanding = Assessment.amount_due_cents - Assessment.amount_paid_cents
      # standing_multiplier = 1.0 if Homeowner.standing == GOOD_STANDING
      #                       1.5 if Homeowner.standing == MARGINAL
      #                       2.0 if Homeowner.standing == DELINQUENT
      # Tier selection (>= boundaries):
      #   days_overdue in [1,14):    base = round_half_up(outstanding * 0.02); floor=1000; cap=2500
      #   days_overdue in [14,30):   base = round_half_up(outstanding * 0.05); floor=1000; cap=5000
      #   days_overdue in [30,60):   base = round_half_up(outstanding * 0.10); floor=2500; cap=10000
      #   days_overdue in [60, inf): base = round_half_up(outstanding * 0.15); floor=5000; cap=25000
      # scaled = round_half_up(base * standing_multiplier)
      # late_fee_cents = min(max(scaled, floor), cap)
    input_set: "Assessment fields (amount_due, amount_paid, due_date); Homeowner.standing at transition time; current_utc"
    constants:
      TIER_2_START_DAYS: 14
      TIER_3_START_DAYS: 30
      TIER_4_START_DAYS: 60
      RATE_TIER_1: 0.02
      RATE_TIER_2: 0.05
      RATE_TIER_3: 0.10
      RATE_TIER_4: 0.15
    precision: "cents; round_half_up at each named step"

  - name: homeowner_delinquency_score
    trigger: "Any Assessment.status transition on a property owned by this homeowner; any Payment post or reversal against such an assessment"
    algorithm: aggregation
    formula: |
      # STRICT variant (default; applies whenever community_config.grace_policy == STRICT):
      #   For every Assessment A on any Property owned by this Homeowner
      #   where A.status IN {OPEN, PARTIALLY_PAID, OVERDUE, DELINQUENT}:
      #     age_days = max(0, floor((current_utc - A.due_date).total_seconds() / 86400))
      #     w        = 1.0 + (age_days // 30) * 0.5
      #     contribution = (A.amount_due_cents - A.amount_paid_cents + A.late_fee_cents) * w
      #   sum_cents = sum(contributions)
      #   score     = round_half_up(sum_cents / 100)     # unit: dollars
      #
      # LENIENT variant (applies whenever community_config.grace_policy == LENIENT):
      #   Same as STRICT but contributions where age_days < 30 are EXCLUDED entirely.
      #
      # The two variants produce different scores for identical Assessment/Payment inputs
      # once the portfolio contains an assessment with age_days in [0, 29].
    input_set: "All Assessments on all Properties owned by this Homeowner with status IN {OPEN, PARTIALLY_PAID, OVERDUE, DELINQUENT}; the community_config.grace_policy scalar; current_utc"
    constants:
      GRACE_WINDOW_DAYS: 30
      STANDING_MARGINAL_THRESHOLD: 500
      STANDING_DELINQUENT_THRESHOLD: 1500
    precision: "dollars; round_half_up on the final divide-by-100"
    variants:
      - name: STRICT
        when: "community_config.grace_policy == STRICT"
        difference: "Every unpaid assessment contributes regardless of age; assessments aged < 30 days enter at weight 1.0"
      - name: LENIENT
        when: "community_config.grace_policy == LENIENT"
        difference: "Assessments aged < 30 days contribute zero; the [0,30) grace window is excluded from the aggregate"

  - name: arc_finalization_fee
    trigger: "ARCRequest transitions UNDER_REVIEW -> APPROVED or UNDER_REVIEW -> REJECTED"
    algorithm: aggregation
    formula: |
      # base_cents lookup by ARCRequest.category:
      #   SIMPLE  ->  2500
      #   MEDIUM  -> 10000
      #   COMPLEX -> 25000
      # For each current-revision ARCReview row R (i.e. revision_count matches the request's
      # current revision_count at finalize time), compute:
      #   per_review_cents_raw = R.weight * base_cents * REVIEW_RATE
      # PINNED EVALUATION ORDER — "sum then round" (this is the pinned mode for combinatorial
      # rule 2b): sum the raw per-review contributions BEFORE rounding.
      #   total_raw = base_cents + sum(per_review_cents_raw for R in current_revision_reviews)
      #   fee_cents = round_half_up(total_raw)
      # The alternative "round each per_review then sum" is explicitly forbidden — it
      # produces a different cents total on non-integer intermediates.
    input_set: "ARCRequest.category; the current-revision subset of ARCReview rows (revision_count == request.revision_count at finalize)"
    constants:
      BASE_SIMPLE_CENTS: 2500
      BASE_MEDIUM_CENTS: 10000
      BASE_COMPLEX_CENTS: 25000
      REVIEW_RATE: 0.10725
      EVALUATION_ORDER: SUM_THEN_ROUND
    precision: "cents; final round_half_up after summation"

  - name: amenity_capacity_check
    trigger: "POST /amenity-reservations (create)"
    algorithm: interval_merge
    formula: |
      # candidate reservation: (amenity_id, [start_ts, end_ts), guest_count)
      # Interval semantics: HALF_OPEN [start, end) — a reservation ending at 12:00 and one
      # starting at 12:00 do NOT overlap.
      # Overlap set = { R in AmenityReservation
      #                 where R.amenity_id == candidate.amenity_id
      #                 and R.status IN {BOOKED, CHECKED_IN}
      #                 and R.start_ts < candidate.end_ts
      #                 and R.end_ts   > candidate.start_ts }
      # concurrent_guests_at_peak =
      #   max over t in {candidate.start_ts} ∪ {R.start_ts for R in Overlap set}:
      #     candidate.guest_count + sum(R.guest_count for R in Overlap set where R.start_ts <= t < R.end_ts)
      # accept iff concurrent_guests_at_peak <= Amenity.capacity
      # BOUNDARY: equality (== capacity) is accepted; strictly greater (> capacity) is rejected.
    input_set: "All AmenityReservation rows on the same amenity_id with status IN {BOOKED, CHECKED_IN}"
    constants: {}
    precision: "integer guest count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and equals one of the roles listed in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role permitted for this endpoint per §1.7 endpoint.roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path-templated id resolves to an existing row (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: existence
    check: "Every body-referenced foreign key resolves to an existing row"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints with FK inputs"

  - priority: 5
    category: state
    check: "Target resource is in a state permitting the requested transition (see §1.2 preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Optimistic concurrency: expected_<parent>_version equals current parent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /homeowners/{id}/autopay-mandate"

  - priority: 7
    category: business_safety
    check: "Property.compliance_flag != SUSPENDED for ARCRequest.submit; Homeowner.booking_privilege != FROZEN for AmenityReservation create"
    error_id: ERR_PROPERTY_SUSPENDED
    http_status: 422
    applies_to: "POST /arc-requests/{id}/submit, POST /amenity-reservations"

  - priority: 8
    category: business_referential
    check: "ARCReview.reviewer_homeowner_id references a Homeowner with is_board_member == true"
    error_id: ERR_REVIEWER_NOT_BOARD
    http_status: 422
    applies_to: "POST /arc-requests/{id}/reviews"

  - priority: 9
    category: business_temporal
    check: "AmenityReservation start_ts/end_ts fall within Amenity.reservation_window and not on a blackout date; start_ts < end_ts; end_ts <= start_ts + 8 hours"
    error_id: ERR_AMENITY_WINDOW_VIOLATION
    http_status: 422
    applies_to: "POST /amenity-reservations"

  - priority: 10
    category: business_temporal
    check: "Motion.voting_window_start < voting_window_end; no other OPEN Motion of the same category has an overlapping [start-24h, end+24h] window"
    error_id: ERR_MOTION_WINDOW_CONFLICT
    http_status: 422
    applies_to: "POST /motions"

  - priority: 11
    category: business_constraint
    check: "amenity_capacity_check accepts (concurrent_guests_at_peak <= Amenity.capacity)"
    error_id: ERR_AMENITY_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /amenity-reservations"

  - priority: 12
    category: business_constraint
    check: "Ballot uniqueness: at most one Ballot per (motion_id, homeowner_id)"
    error_id: ERR_BALLOT_DUPLICATE
    http_status: 409
    applies_to: "POST /motions/{id}/ballots"

  - priority: 13
    category: business_constraint
    check: "Violation.category != SAFETY when appealing (safety fines are non-appealable)"
    error_id: ERR_APPEAL_NON_APPEALABLE
    http_status: 422
    applies_to: "POST /violations/{id}/appeal"

  - priority: 14
    category: business_fiscal
    check: "Payment.amount_cents does not exceed the current outstanding (amount_due + late_fee - amount_paid)"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /assessments/{id}/pay"

  - priority: 15
    category: business_fiscal
    check: "Homeowner submitting an ARCRequest must not be DELINQUENT"
    error_id: ERR_HOMEOWNER_DELINQUENT
    http_status: 422
    applies_to: "POST /arc-requests/{id}/submit"

  - priority: 16
    category: business_constraint
    check: "ARCRequest.revision_count < 3 when transitioning REVISION_REQUESTED -> SUBMITTED"
    error_id: ERR_REVISION_LIMIT
    http_status: 422
    applies_to: "POST /arc-requests/{id}/submit"

  - priority: 17
    category: business_temporal
    check: "Violation appeal window: current_utc <= Violation.fined_at + 14 days"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /violations/{id}/appeal"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Homeowner ---
  - method: POST
    path: /homeowners
    description: "Register a new homeowner"
    roles: [HOAManager]
    code: 201
    input: [email, full_name, "is_board_member?"]
    output: Homeowner
    side_effects:
      - "Homeowner row created with standing=GOOD_STANDING, delinquency_score=0, booking_privilege=ALLOWED, version=1"

  - method: GET
    path: /homeowners/{id}
    description: "Fetch a homeowner"
    roles: [Homeowner, BoardMember, HOAManager, ComplianceOfficer]
    code: 200
    input: []
    output: Homeowner
    side_effects: []

  - method: GET
    path: /homeowners/{id}/properties
    description: "List properties owned by this homeowner (reverse-reachability for Property.homeowner_id)"
    roles: [Homeowner, BoardMember, HOAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Property[]
    side_effects: []

  - method: POST
    path: /homeowners/{id}/autopay-mandate
    description: "Create or supersede a homeowner's autopay mandate. Requires expected_homeowner_version (OCC). Cancels any prior ACTIVE mandate for this homeowner (supersede semantics). Increments Homeowner.version by 1 on success."
    roles: [Homeowner, HOAManager]
    code: 201
    input: [expected_homeowner_version, max_charge_cents]
    output: AutopayMandate
    side_effects:
      - "Any existing AutopayMandate for this homeowner with status=ACTIVE flips to status=SUPERSEDED"
      - "New AutopayMandate created with status=ACTIVE"
      - "Homeowner.version incremented by 1"

  - method: DELETE
    path: /homeowners/{id}/autopay-mandate
    description: "Cancel the current active mandate for this homeowner"
    roles: [Homeowner, HOAManager]
    code: 204
    input: []
    output: null
    side_effects:
      - "The ACTIVE AutopayMandate for this homeowner flips to status=CANCELLED"

  - method: GET
    path: /homeowners/{id}/autopay-mandate
    description: "List autopay mandates for this homeowner (reverse-reachability for AutopayMandate.homeowner_id); array length 0 or 1 for the current row plus historical rows"
    roles: [Homeowner, HOAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: AutopayMandate[]
    side_effects: []

  - method: GET
    path: /homeowners/{id}/arc-requests
    description: "List ARC requests submitted by this homeowner (reverse-reachability for ARCRequest.submitter_homeowner_id)"
    roles: [Homeowner, BoardMember, HOAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: ARCRequest[]
    side_effects: []

  - method: GET
    path: /homeowners/{id}/arc-reviews
    description: "List ARC reviews cast by this homeowner (reverse-reachability for ARCReview.reviewer_homeowner_id)"
    roles: [BoardMember, HOAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: ARCReview[]
    side_effects: []

  # --- Property ---
  - method: POST
    path: /properties
    description: "Register a new property under an existing homeowner"
    roles: [HOAManager]
    code: 201
    input: [homeowner_id, address, monthly_dues_cents]
    output: Property
    side_effects:
      - "Property row created with compliance_flag=OPEN, total_outstanding_cents=0, fine_balance_cents=0"

  - method: GET
    path: /properties/{id}
    description: "Fetch a property with computed fields"
    roles: [Homeowner, BoardMember, HOAManager, ComplianceOfficer]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: /properties/{id}/assessments
    description: "List assessments for this property (reverse-reachability for Assessment.property_id)"
    roles: [Homeowner, BoardMember, HOAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Assessment[]
    side_effects: []

  - method: GET
    path: /properties/{id}/arc-requests
    description: "List ARC requests filed against this property (reverse-reachability for ARCRequest.property_id)"
    roles: [Homeowner, BoardMember, HOAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: ARCRequest[]
    side_effects: []

  - method: GET
    path: /properties/{id}/violations
    description: "List violations filed against this property (reverse-reachability for Violation.property_id)"
    roles: [Homeowner, BoardMember, HOAManager, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Violation[]
    side_effects: []

  - method: GET
    path: /properties/{id}/work-orders
    description: "List work orders scoped to this property (reverse-reachability for WorkOrder.related_property_id)"
    roles: [Homeowner, BoardMember, HOAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  # --- Assessment / Payment ---
  - method: POST
    path: /assessments
    description: "Create a new assessment for a property. Runs calculations.assessment_prorate to stamp amount_due_cents. Default status=OPEN."
    roles: [HOAManager]
    code: 201
    input: [property_id, billing_period_start, billing_period_end, due_date, "prorate_from?"]
    output: Assessment
    side_effects:
      - "Assessment.amount_due_cents stamped from calculations.assessment_prorate"
      - "Property.total_outstanding_cents recomputed"

  - method: GET
    path: /assessments/{id}
    description: "Fetch an assessment"
    roles: [Homeowner, BoardMember, HOAManager]
    code: 200
    input: []
    output: Assessment
    side_effects: []

  - method: POST
    path: /assessments/{id}/pay
    description: "Record a payment against an assessment. Triggers Assessment state transitions and cascading recomputes on Property/Homeowner."
    roles: [Homeowner, HOAManager]
    code: 201
    input: [amount_cents, method]
    output: Payment
    side_effects:
      - "Payment row created with status=POSTED, method as provided, posted_at stamped"
      - "Assessment.amount_paid_cents incremented"
      - "Assessment.status transitions per §1.2"
      - "Property.total_outstanding_cents recomputed"
      - "Homeowner.delinquency_score recomputed if the transition reaches PAID"

  - method: POST
    path: /assessments/{id}/place-lien
    description: "Move a DELINQUENT assessment to ON_LIEN (>= 90 days past due_date)"
    roles: [HOAManager]
    code: 200
    input: []
    output: Assessment
    side_effects:
      - "Assessment.status set to ON_LIEN"

  - method: GET
    path: /assessments/{id}/payments
    description: "List payments against this assessment (reverse-reachability for Payment.assessment_id)"
    roles: [Homeowner, BoardMember, HOAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: GET
    path: /payments/{id}
    description: "Fetch a payment"
    roles: [Homeowner, BoardMember, HOAManager]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: POST
    path: /payments/{id}/reverse
    description: "Reverse a POSTED payment. Cascades through Assessment (may revert to OVERDUE) and Homeowner (delinquency_score recompute, booking_privilege may FREEZE)."
    roles: [HOAManager]
    code: 200
    input: [reversal_reason]
    output: Payment
    side_effects:
      - "Payment.status set to REVERSED"
      - "Payment.reversal_reason stamped"
      - "Assessment.amount_paid_cents decremented (cascade link 1)"
      - "Homeowner.delinquency_score recomputed (cascade link 2)"
      - "Homeowner.standing and Homeowner.booking_privilege recomputed (cascade link 3)"

  # --- ARC ---
  - method: POST
    path: /arc-requests
    description: "Create a DRAFT ARC request"
    roles: [Homeowner]
    code: 201
    input: [property_id, submitter_homeowner_id, category, description]
    output: ARCRequest
    side_effects:
      - "ARCRequest row created with status=DRAFT, revision_count=0, fee_cents=0"

  - method: GET
    path: /arc-requests/{id}
    description: "Fetch an ARC request"
    roles: [Homeowner, BoardMember, HOAManager]
    code: 200
    input: []
    output: ARCRequest
    side_effects: []

  - method: POST
    path: /arc-requests/{id}/submit
    description: "Submit or resubmit an ARC request. Cyclic from REVISION_REQUESTED. Validates Property.compliance_flag != SUSPENDED and Homeowner.standing != DELINQUENT."
    roles: [Homeowner]
    code: 200
    input: []
    output: ARCRequest
    side_effects:
      - "ARCRequest.status set to SUBMITTED"

  - method: POST
    path: /arc-requests/{id}/reviews
    description: "Board member submits a review on an ARCRequest. First review moves request UNDER_REVIEW."
    roles: [BoardMember]
    code: 201
    input: [reviewer_homeowner_id, weight, verdict, "comment?"]
    output: ARCReview
    side_effects:
      - "ARCReview row created"
      - "If ARCRequest.status == SUBMITTED, transition to UNDER_REVIEW"

  - method: GET
    path: /arc-requests/{id}/reviews
    description: "List reviews on this ARC request (reverse-reachability for ARCReview.arc_request_id)"
    roles: [Homeowner, BoardMember, HOAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: ARCReview[]
    side_effects: []

  - method: POST
    path: /arc-requests/{id}/finalize
    description: "Finalize an UNDER_REVIEW request. Stamps fee_cents from calculations.arc_finalization_fee and transitions to APPROVED, REJECTED, or REVISION_REQUESTED per review verdicts. APPROVED triggers cascade: Property.compliance_flag -> APPROVED_MOD AND a WorkOrder is auto-created (source=AUTO_ARC)."
    roles: [BoardMember]
    code: 200
    input: []
    output: ARCRequest
    side_effects:
      - "ARCRequest.fee_cents stamped (unless outcome is REVISION_REQUESTED)"
      - "ARCRequest.status set to APPROVED, REJECTED, or REVISION_REQUESTED"
      - "If APPROVED: Property.compliance_flag set to APPROVED_MOD"
      - "If APPROVED: WorkOrder auto-created with source=AUTO_ARC, related_property_id=Property.id"

  # --- Violations ---
  - method: POST
    path: /violations
    description: "Report a new violation on a property"
    roles: [ComplianceOfficer, HOAManager, BoardMember]
    code: 201
    input: [property_id, category]
    output: Violation
    side_effects:
      - "Violation row created with status=REPORTED, reported_at stamped"

  - method: GET
    path: /violations/{id}
    description: "Fetch a violation"
    roles: [Homeowner, BoardMember, HOAManager, ComplianceOfficer]
    code: 200
    input: []
    output: Violation
    side_effects: []

  - method: POST
    path: /violations/{id}/confirm
    description: "Confirm a REPORTED violation"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Violation
    side_effects:
      - "Violation.status set to CONFIRMED"

  - method: POST
    path: /violations/{id}/fine
    description: "Assess a fine on a CONFIRMED violation"
    roles: [ComplianceOfficer]
    code: 200
    input: [fine_amount_cents]
    output: Violation
    side_effects:
      - "Violation.fine_amount_cents and fine_balance_cents stamped"
      - "Violation.fined_at stamped"
      - "Violation.status set to FINED"
      - "Property.fine_balance_cents recomputed"
      - "Property.total_outstanding_cents recomputed"

  - method: POST
    path: /violations/{id}/appeal
    description: "Homeowner appeals a FINED violation within 14 days (non-appealable if category == SAFETY)"
    roles: [Homeowner]
    code: 200
    input: []
    output: Violation
    side_effects:
      - "Violation.status set to APPEALED"

  - method: POST
    path: /violations/{id}/adjudicate
    description: "Compliance officer decides an APPEALED violation"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome]
    output: Violation
    side_effects:
      - "Violation.status set to UPHELD or OVERTURNED"
      - "If OVERTURNED: fine_balance_cents set to 0; Property.fine_balance_cents recomputed; Property.total_outstanding_cents recomputed (invariant: same as before FINED)"

  - method: POST
    path: /violations/{id}/resolve
    description: "Resolve a CONFIRMED violation via cure (no fine)"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome]
    output: Violation
    side_effects:
      - "Violation.status set to CURED"

  # --- Amenity ---
  - method: POST
    path: /amenities
    description: "Register a bookable amenity"
    roles: [HOAManager]
    code: 201
    input: [name, capacity, reservation_window_start_hour, reservation_window_end_hour, "blackout_dates?"]
    output: Amenity
    side_effects: []

  - method: GET
    path: /amenities/{id}
    description: "Fetch an amenity"
    roles: [Homeowner, BoardMember, HOAManager]
    code: 200
    input: []
    output: Amenity
    side_effects: []

  - method: POST
    path: /amenity-reservations
    description: "Reserve a slot on an amenity. Runs interval-overlap capacity check."
    roles: [Homeowner]
    code: 201
    input: [amenity_id, homeowner_id, start_ts, end_ts, guest_count]
    output: AmenityReservation
    side_effects:
      - "AmenityReservation row created with status=BOOKED"

  - method: GET
    path: /amenities/{id}/reservations
    description: "List reservations on this amenity (reverse-reachability for AmenityReservation.amenity_id)"
    roles: [Homeowner, BoardMember, HOAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: AmenityReservation[]
    side_effects: []

  - method: GET
    path: /amenity-reservations
    description: "List reservations, filterable by homeowner_id (reverse-reachability for AmenityReservation.homeowner_id)"
    roles: [Homeowner, BoardMember, HOAManager]
    code: 200
    input: ["homeowner_id?", "limit?", "offset?"]
    output: AmenityReservation[]
    side_effects: []

  - method: GET
    path: /amenity-reservations/{id}
    description: "Fetch an amenity reservation"
    roles: [Homeowner, BoardMember, HOAManager]
    code: 200
    input: []
    output: AmenityReservation
    side_effects: []

  - method: POST
    path: /amenity-reservations/{id}/cancel
    description: "Cancel a BOOKED reservation before start_ts"
    roles: [Homeowner, HOAManager]
    code: 200
    input: []
    output: AmenityReservation
    side_effects:
      - "AmenityReservation.status set to CANCELLED"
      - "Capacity restored for the [start_ts, end_ts) window (compensating invariant)"

  - method: POST
    path: /amenity-reservations/{id}/check-in
    description: "Check in a homeowner at the amenity"
    roles: [HOAManager]
    code: 200
    input: []
    output: AmenityReservation
    side_effects:
      - "AmenityReservation.status set to CHECKED_IN"

  # --- Motion / Ballot ---
  - method: POST
    path: /motions
    description: "Create a motion for voting. Validates window and category overlap."
    roles: [BoardMember]
    code: 201
    input: [title, description, category, voting_window_start, voting_window_end, eligible_voter_count, quorum_pct]
    output: Motion
    side_effects:
      - "Motion row created with status=OPEN, yes_count=0, no_count=0"

  - method: GET
    path: /motions/{id}
    description: "Fetch a motion"
    roles: [Homeowner, BoardMember, HOAManager]
    code: 200
    input: []
    output: Motion
    side_effects: []

  - method: POST
    path: /motions/{id}/ballots
    description: "Cast a ballot on an OPEN motion. Unique per (motion_id, homeowner_id)."
    roles: [Homeowner, BoardMember]
    code: 201
    input: [homeowner_id, choice]
    output: Ballot
    side_effects:
      - "Ballot row created"
      - "Motion.yes_count / no_count incremented depending on choice"

  - method: GET
    path: /motions/{id}/ballots
    description: "List ballots on this motion (reverse-reachability for Ballot.motion_id)"
    roles: [Homeowner, BoardMember, HOAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Ballot[]
    side_effects: []

  - method: GET
    path: /ballots
    description: "List ballots filterable by homeowner_id (reverse-reachability for Ballot.homeowner_id)"
    roles: [Homeowner, BoardMember, HOAManager]
    code: 200
    input: ["homeowner_id?", "motion_id?", "limit?", "offset?"]
    output: Ballot[]
    side_effects: []

  - method: GET
    path: /ballots/{id}
    description: "Fetch a ballot"
    roles: [Homeowner, BoardMember, HOAManager]
    code: 200
    input: []
    output: Ballot
    side_effects: []

  - method: POST
    path: /motions/{id}/close
    description: "Close a motion after voting_window_end. Chooses one of CLOSED_PASSED / CLOSED_FAILED / QUORUM_FAILED per §1.2."
    roles: [BoardMember]
    code: 200
    input: []
    output: Motion
    side_effects:
      - "Motion.status transitions to one of {CLOSED_PASSED, CLOSED_FAILED, QUORUM_FAILED}"

  # --- Work Orders ---
  - method: POST
    path: /work-orders
    description: "Create a new work order (community-wide if related_property_id null)"
    roles: [HOAManager]
    code: 201
    input: [title, cost_estimate_cents, "related_property_id?"]
    output: WorkOrder
    side_effects:
      - "WorkOrder row created with work_status=NEW, payment_status=UNBILLED, source=MANUAL"

  - method: GET
    path: /work-orders/{id}
    description: "Fetch a work order"
    roles: [Homeowner, BoardMember, HOAManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: /work-orders
    description: "List work orders, filterable by related_property_id"
    roles: [BoardMember, HOAManager]
    code: 200
    input: ["related_property_id?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: POST
    path: /work-orders/{id}/assign
    description: "Assign a vendor to a NEW work order"
    roles: [HOAManager]
    code: 200
    input: [assigned_vendor_id]
    output: WorkOrder
    side_effects:
      - "WorkOrder.assigned_vendor_id stamped"
      - "WorkOrder.work_status set to ASSIGNED"

  - method: POST
    path: /work-orders/{id}/start
    description: "Start work on an ASSIGNED work order"
    roles: [HOAManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "WorkOrder.work_status set to IN_PROGRESS"

  - method: POST
    path: /work-orders/{id}/complete
    description: "Mark IN_PROGRESS work order COMPLETED"
    roles: [HOAManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "WorkOrder.work_status set to COMPLETED"

  - method: POST
    path: /work-orders/{id}/cancel
    description: "Cancel a NEW/ASSIGNED work order (payment_status must be UNBILLED)"
    roles: [HOAManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "WorkOrder.work_status set to CANCELLED"

  - method: POST
    path: /work-orders/{id}/invoice
    description: "Move payment_status UNBILLED -> INVOICED (independent parallel dimension)"
    roles: [HOAManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "WorkOrder.payment_status set to INVOICED"

  - method: POST
    path: /work-orders/{id}/mark-paid
    description: "Move payment_status INVOICED -> PAID"
    roles: [HOAManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "WorkOrder.payment_status set to PAID"

  # --- Documents ---
  - method: POST
    path: /documents
    description: "Upload a document to the CC&R library"
    roles: [HOAManager, BoardMember]
    code: 201
    input: [title, category, content_url]
    output: Document
    side_effects: []

  - method: GET
    path: /documents
    description: "List documents, filterable by category"
    roles: [Homeowner, BoardMember, HOAManager, ComplianceOfficer]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: Document[]
    side_effects: []

  - method: GET
    path: /documents/{id}
    description: "Fetch a document"
    roles: [Homeowner, BoardMember, HOAManager, ComplianceOfficer]
    code: 200
    input: []
    output: Document
    side_effects: []

  # --- Test-driving surface ---
  - method: POST
    path: /_clock/set_current_utc
    description: "Advance the server's logical clock to the supplied ISO 8601 UTC timestamp; drives time-gated transitions (Assessment overdue/delinquency, Motion voting_window_end, Violation appeal window, WorkOrder side effects). The startup default value of current_utc is fixed at 2026-03-01T00:00:00Z and MUST NOT fall back to real wall-clock time before this endpoint is called."
    roles: [HOAManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects:
      - "Server current_utc set to to_iso8601"
      - "Any Assessment reaching due_date auto-transitions OPEN|PARTIALLY_PAID -> OVERDUE, then OVERDUE -> DELINQUENT at +60 days"
      - "Any Violation.status == FINED beyond 14 days transitions to UPHELD"
      - "Any AmenityReservation past its end_ts transitions BOOKED -> NO_SHOW or CHECKED_IN -> COMPLETED"

  - method: POST
    path: /_config/grace-policy
    description: "Set community-wide grace_policy for calculations.homeowner_delinquency_score. Test-driving endpoint that switches the calc variant deterministically."
    roles: [HOAManager]
    code: 200
    input: [grace_policy]
    output: { grace_policy: string }
    side_effects:
      - "community_config.grace_policy set to STRICT or LENIENT"
      - "All Homeowner.delinquency_score / standing / booking_privilege recomputed with the new variant"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or not a recognized role"

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this endpoint per §1.7"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-parameter id does not resolve to an existing row"

  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "Body-referenced foreign key does not resolve to an existing row"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state that permits the requested transition"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC mismatch: expected_homeowner_version does not equal current Homeowner.version"

  - id: ERR_PROPERTY_SUSPENDED
    http: 422
    condition: "Property.compliance_flag == SUSPENDED (ARCRequest submit) or Homeowner.booking_privilege == FROZEN (AmenityReservation create)"

  - id: ERR_REVIEWER_NOT_BOARD
    http: 422
    condition: "reviewer_homeowner_id references a Homeowner with is_board_member == false"

  - id: ERR_AMENITY_WINDOW_VIOLATION
    http: 422
    condition: "Reservation start/end lies outside Amenity.reservation_window, lands on a blackout date, exceeds 8 hours, or start_ts >= end_ts"

  - id: ERR_AMENITY_CAPACITY_EXCEEDED
    http: 422
    condition: "concurrent_guests_at_peak > Amenity.capacity for the requested window"

  - id: ERR_MOTION_WINDOW_CONFLICT
    http: 422
    condition: "Two OPEN motions of the same category have voting windows within 24 hours of each other"

  - id: ERR_BALLOT_DUPLICATE
    http: 409
    condition: "A Ballot already exists for this (motion_id, homeowner_id) pair"

  - id: ERR_APPEAL_NON_APPEALABLE
    http: 422
    condition: "Attempt to appeal a Violation with category == SAFETY"

  - id: ERR_APPEAL_WINDOW_EXPIRED
    http: 422
    condition: "current_utc > Violation.fined_at + 14 days at appeal time"

  - id: ERR_OVERPAYMENT
    http: 422
    condition: "Payment.amount_cents + Assessment.amount_paid_cents > Assessment.amount_due_cents + Assessment.late_fee_cents"

  - id: ERR_HOMEOWNER_DELINQUENT
    http: 422
    condition: "Submitter's Homeowner.standing == DELINQUENT at ARCRequest.submit time"

  - id: ERR_REVISION_LIMIT
    http: 422
    condition: "ARCRequest.revision_count >= 3 on resubmit attempt from REVISION_REQUESTED"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Payload malformed, required field missing, or field type/enum invalid"

  - id: ERR_UNIQUE_VIOLATION
    http: 409
    condition: "Uniqueness constraint violated (e.g., duplicate Homeowner.email, duplicate Property.address)"


# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Homeowner
    description: "Standard resident — pays dues, reserves amenities, files ARC requests, appeals violations, votes on motions"
    identity: "entity_backed:Homeowner"
    exclusive_operations:
      - "POST /arc-requests"
      - "POST /arc-requests/{id}/submit"
      - "POST /violations/{id}/appeal"
    shared_operations:
      - "GET /homeowners/{id}"
      - "GET /homeowners/{id}/properties"
      - "POST /homeowners/{id}/autopay-mandate (shared with HOAManager)"
      - "DELETE /homeowners/{id}/autopay-mandate (shared with HOAManager)"
      - "GET /homeowners/{id}/autopay-mandate (shared with HOAManager)"
      - "POST /assessments/{id}/pay (shared with HOAManager)"
      - "POST /amenity-reservations"
      - "POST /amenity-reservations/{id}/cancel (shared with HOAManager)"
      - "POST /motions/{id}/ballots (shared with BoardMember)"

  - name: BoardMember
    description: "Elected board member — reviews ARC requests, creates and closes motions. Identified by X-User-ID matching a Homeowner whose is_board_member == true."
    identity: "entity_backed:Homeowner"
    exclusive_operations:
      - "POST /arc-requests/{id}/reviews"
      - "POST /arc-requests/{id}/finalize"
      - "POST /motions"
      - "POST /motions/{id}/close"
    shared_operations:
      - "POST /violations (shared with ComplianceOfficer, HOAManager)"
      - "POST /motions/{id}/ballots (shared with Homeowner)"
      - "POST /documents (shared with HOAManager)"

  - name: ComplianceOfficer
    description: "Operations staff empowered to confirm, fine, resolve, and adjudicate violations"
    identity: "opaque"
    exclusive_operations:
      - "POST /violations/{id}/confirm"
      - "POST /violations/{id}/fine"
      - "POST /violations/{id}/adjudicate"
      - "POST /violations/{id}/resolve"
    shared_operations:
      - "POST /violations (shared with BoardMember, HOAManager)"

  - name: HOAManager
    description: "Community manager — creates homeowners, properties, assessments; reverses payments; manages amenities, motions (write-through), and work orders"
    identity: "opaque"
    exclusive_operations:
      - "POST /homeowners"
      - "POST /properties"
      - "POST /assessments"
      - "POST /assessments/{id}/place-lien"
      - "POST /payments/{id}/reverse"
      - "POST /amenities"
      - "POST /amenity-reservations/{id}/check-in"
      - "POST /work-orders"
      - "POST /work-orders/{id}/assign"
      - "POST /work-orders/{id}/start"
      - "POST /work-orders/{id}/complete"
      - "POST /work-orders/{id}/cancel"
      - "POST /work-orders/{id}/invoice"
      - "POST /work-orders/{id}/mark-paid"
      - "POST /_clock/set_current_utc"
      - "POST /_config/grace-policy"
    shared_operations:
      - "POST /homeowners/{id}/autopay-mandate (shared with Homeowner)"
      - "POST /amenity-reservations/{id}/cancel (shared with Homeowner)"
      - "POST /assessments/{id}/pay (shared with Homeowner)"
      - "POST /violations (shared with BoardMember, ComplianceOfficer)"
      - "POST /documents (shared with BoardMember)"

  - name: Anonymous
    description: "Unauthenticated caller — every business endpoint returns ERR_UNAUTHENTICATED. Reserved so validation priority 1 has an actor."
    identity: "opaque"
    exclusive_operations: []
    shared_operations: []
