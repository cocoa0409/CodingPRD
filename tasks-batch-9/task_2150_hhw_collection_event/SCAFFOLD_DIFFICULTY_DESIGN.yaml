              payload: { action: "VERIFY", verified_jurisdiction_code: "CO-ARV" }
              as: EligibilityClerk
              captures: { res_v: $.data.version, reserved_0: $.data.annual_quantity_reserved_kg }
            - call: "POST /hhw/appointments"
              payload: { event_id: "${ev_id}", resident_id: "${res_id}", slot_start_utc: "2026-09-12T09:00:00.000Z", waste_origin: "HOUSEHOLD", declared_total_kg: 18.5, declared_category_ids: ["${cat_latex}"], expected_resident_version: "${res_v}", vehicle_count: 1 }
              as: EligibilityClerk
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /hhw/appointments/${appt_id}/transitions"
              payload: { action: "CONFIRM" }
              as: EligibilityClerk
            - call: "GET /hhw/residents/${res_id}"
              as: EligibilityClerk
              captures: { reserved_1: $.data.annual_quantity_reserved_kg }
            - call: "POST /hhw/appointments/${appt_id}/transitions"
              payload: { action: "CANCEL", cancel_reason: "RESIDENT_REQUEST" }
              as: EligibilityClerk
            - call: "GET /hhw/residents/${res_id}"
              as: EligibilityClerk
              captures: { reserved_2: $.data.annual_quantity_reserved_kg }
          assert:
            - "${reserved_0} == 0.0"
            - "${reserved_1} == 18.5 — the forward action reserved exactly declared_total_kg"
            - "${reserved_2} == 0.0 — the compensating CANCEL restored the conserved mass with zero drift"
            - "Appointment.${appt_id}.status == CANCELLED and Appointment.${appt_id}.cancel_reason == RESIDENT_REQUEST"
            - "Appointment.${appt_id}.reserved_kg == 0.0"
            - "CollectionEvent.${ev_id}.reserved_slot_count == 0"
            - "Resident.${res_id}.annual_quantity_settled_kg == 0.0 — the settlement ledger was never touched"

      - name: lane_release_restores_staffer_hour_ledger
        grounds:
          - calculations.staff_hours_ledger
          - entities.Staffer.fields.assigned_hours
          - entities.LaneAssignment.fields.status
          - endpoints.POST_/hhw/lane-assignments/{id}/release
        distinguishing_aspect: |
          A different type of conserved quantity from the mass quota: LABOUR-HOURS. The invariant
          Staffer.assigned_hours == sum of duration_hours over that staffer's ACTIVE lane assignments must
          hold before the assignment, after it, and after the compensating release — returning to exactly
          0.0 while the event's derived certified_staff_hours, staffing_cost_cents, open_lane_count and
          slot_capacity all fall back to their pre-assignment values.
        test_recipe:
          setup:
            - "Program with staff_hourly_rate_cents 4200, APPROVED 4-lane site, event 2026-09-12T08:00Z..20:00Z in SITE_CONFIRMED with containment COMPLIANT"
            - "Staffer Dana Reyes ACTIVE with assigned_hours 0.0 and HAZWOPER valid to 2027-06-30"
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN", "CO-ARV"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Arvada Public Works Yard", address: "5100 Ralston Road", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 15.0, lane_count: 4 }
              as: EventCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /hhw/sites/${site_id}/transitions"
              payload: { action: "APPROVE", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-site-approver"
            - call: "POST /hhw/events"
              payload: { program_id: "${prog_id}", site_id: "${site_id}", window_start_utc: "2026-09-12T08:00:00.000Z", window_end_utc: "2026-09-12T20:00:00.000Z", min_viable_registrations: 20 }
              as: EventCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "CONFIRM_SITE" }
              as: EventCoordinator
            - call: "POST /hhw/events/${ev_id}/containment-inspections"
              payload: { result: "PASS", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-event-daily"
              captures: { cap_0: $.data.slot_capacity }
            - call: "POST /hhw/staffers"
              payload: { program_id: "${prog_id}", full_name: "Dana Reyes", role_code: "UNLOAD", hazwoper_expires_on: "2027-06-30" }
              as: EventCoordinator
              captures: { staffer_id: $.data.id, hours_0: $.data.assigned_hours }
          trigger:
            - call: "POST /hhw/lane-assignments"
              payload: { event_id: "${ev_id}", staffer_id: "${staffer_id}", lane_number: 1, start_utc: "2026-09-12T08:00:00.000Z", end_utc: "2026-09-12T12:00:00.000Z" }
              as: EventCoordinator
              captures: { la_id: $.data.id, la_hours: $.data.duration_hours }
            - call: "GET /hhw/staffers/${staffer_id}"
              as: EventCoordinator
              captures: { hours_1: $.data.assigned_hours }
            - call: "GET /hhw/events/${ev_id}"
              as: EventCoordinator
              captures: { ev_hours_1: $.data.certified_staff_hours, ev_cost_1: $.data.staffing_cost_cents, ev_lanes_1: $.data.open_lane_count, ev_cap_1: $.data.slot_capacity }
            - call: "POST /hhw/lane-assignments/${la_id}/release"
              payload: { released_reason: "ROSTER_CHANGE" }
              as: EventCoordinator
              captures: { la_status: $.data.status }
            - call: "GET /hhw/staffers/${staffer_id}"
              as: EventCoordinator
              captures: { hours_2: $.data.assigned_hours }
            - call: "GET /hhw/events/${ev_id}"
              as: EventCoordinator
              captures: { ev_hours_2: $.data.certified_staff_hours, ev_cost_2: $.data.staffing_cost_cents, ev_lanes_2: $.data.open_lane_count, ev_cap_2: $.data.slot_capacity }
          assert:
            - "${cap_0} == 0 and ${hours_0} == 0.0"
            - "${la_hours} == 4.0"
            - "${hours_1} == 4.0"
            - "${ev_hours_1} == 4.0 and ${ev_cost_1} == 16800 and ${ev_lanes_1} == 1 and ${ev_cap_1} == 16"
            - "${la_status} == RELEASED"
            - "${hours_2} == 0.0 — the compensating release restored the conserved labour-hour total exactly"
            - "${ev_hours_2} == 0.0 and ${ev_cost_2} == 0 and ${ev_lanes_2} == 0 and ${ev_cap_2} == 0"
            - "LaneAssignment.${la_id}.duration_hours == 4.0 — the released row keeps its history"
