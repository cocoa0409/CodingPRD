  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: provisional_run_annualizes_and_ignores_specials
        claim_type: variant_divergence
        grounds: [calculations.allocation_engine]
        distinguishing_aspect: "Variant selection: a PROVISIONAL run computed at clock 2025-07-02 (day 183) annualizes net ordinary 9500000 to 18948087 and IGNORES an APPROVED 5000bps special allocation for GP1, so GP1's ORDINARY line is the plain pro-rata 1894809 (a FINAL run would yield 9500000 total and apply the special)."
        test_recipe:
          setup:
            - "Canonical fund with GP1/LP1/LP2 (1000/6000/3000) and 2025-01-01 contributions; TaxYear 2025 OPEN (net ordinary 9500000)"
            - "APPROVED special allocation: GP1 ORDINARY 5000bps for [2025-01-01, 2026-01-01)"
            - "Logical clock at 2025-07-02T00:00:00Z (day_of_year 183)"
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund K1", ein: "22-3000001", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 100, fee_discount_threshold_cents: 5000000000, fee_discount_bps: 5000 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "GP1", partner_type: US_ENTITY, partner_class: GENERAL, residency_state: "DE", ownership_pct_bps: 1000, capital_commitment_cents: 10000000, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p_gp: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "LP1", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 6000, capital_commitment_cents: 60000000, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p_lp1: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "LP2", partner_type: FOREIGN_INDIVIDUAL, partner_class: LIMITED, residency_state: "XX", ownership_pct_bps: 3000, capital_commitment_cents: 30000000, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { p_lp2: "$.data.id" }
            - call: "POST /funds/tax-years"
              payload: { fund_id: "${f}", year: 2025, gross_ordinary_income_cents: 10000000, capital_gain_cents: 20000000, interest_income_cents: 5000000 }
              as: FundTaxAdmin
              captures: { ty: "$.data.id", ty_v0: "$.data.version" }
            - call: "POST /funds/capital-events"
              payload: { partner_id: "${p_gp}", tax_year_id: "${ty}", event_type: CONTRIBUTION, amount_cents: 10000000, effective_date: "2025-01-01" }
              as: TaxPreparer
            - call: "POST /funds/special-allocations"
              payload: { tax_year_id: "${ty}", partner_id: "${p_gp}", category: ORDINARY, target_pct_bps: 5000, effective_from: "2025-01-01", effective_to: "2026-01-01" }
              as: TaxPreparer
              as_user_id: prep_1
              captures: { sa: "$.data.id" }
            - call: "POST /funds/special-allocations/${sa}/approve"
              payload: {}
              as: TaxReviewer
              as_user_id: rev_1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-07-02T00:00:00Z" }
              as: FundTaxAdmin
          trigger:
            - call: "POST /funds/allocation-runs"
              payload: { tax_year_id: "${ty}", run_kind: PROVISIONAL, expected_tax_year_version: "${ty_v0}" }
              as: TaxPreparer
              captures: { run: "$.data.id" }
            - call: "GET /funds/allocation-runs/${run}/lines"
              payload: {}
              as: TaxPreparer
          assert:
            - "AllocationRun.${run}.ordinary_total_cents == 18948087 (round_half_up(9500000 x 365/183)), interest_total_cents == 9972678, capital_gain_total_cents == 39890710"
            - "AllocationLine(${run}, ${p_gp}, ORDINARY).amount_cents == 1894809 — plain 10% pro-rata, the APPROVED special allocation is ignored by the PROVISIONAL variant"
            - "18948087 != 9500000 — PROVISIONAL and FINAL diverge for identical stored totals"

