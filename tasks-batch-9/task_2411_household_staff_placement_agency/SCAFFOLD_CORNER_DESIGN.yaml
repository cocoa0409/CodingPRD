        as: VettingSpecialist
        as_user: u_vet_1
      - call: GET /background-verifications/00000000-0000-0000-0000-000000000000
        as: VettingSpecialist
        as_user: u_vet_1
      - call: GET /accommodation-terms/00000000-0000-0000-0000-000000000000
        as: PlacementConsultant
      - call: GET /fee-milestones/00000000-0000-0000-0000-000000000000
        as: BillingAdministrator
      asserts:
      - the first trigger call returns 404 with error_id == ERR_REFERENCE_CHECK_NOT_FOUND
      - the second returns 404 with error_id == ERR_BACKGROUND_VERIFICATION_NOT_FOUND
      - the third returns 404 with error_id == ERR_ACCOMMODATION_TERM_NOT_FOUND
      - the fourth returns 404 with error_id == ERR_FEE_MILESTONE_NOT_FOUND
  - name: unknown_claim_handoff_and_case_ids_return_their_own_not_found_ids
    claim_type: error_triggerable
    grounds: errors[ERR_REPLACEMENT_CLAIM_NOT_FOUND]; errors[ERR_PAYROLL_HANDOFF_NOT_FOUND]; errors[ERR_NON_SOLICITATION_CASE_NOT_FOUND];
      validations.path_entity_exists (priority 30)
    distinguishing_aspect: These are the three remedial-side entities, each with its own restricted reader
      set, so the probes also confirm that a permitted role gets the 404 rather than a 403.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      trigger:
      - call: GET /replacement-claims/00000000-0000-0000-0000-000000000000
        as: AgencyPrincipal
      - call: GET /payroll-handoffs/00000000-0000-0000-0000-000000000000
        as: ComplianceOfficer
        as_user: u_comp_1
      - call: GET /non-solicitation-cases/00000000-0000-0000-0000-000000000000
        as: ComplianceOfficer
        as_user: u_comp_1
      asserts:
      - the first trigger call returns 404 with error_id == ERR_REPLACEMENT_CLAIM_NOT_FOUND
      - the second returns 404 with error_id == ERR_PAYROLL_HANDOFF_NOT_FOUND
      - the third returns 404 with error_id == ERR_NON_SOLICITATION_CASE_NOT_FOUND
      - none of the three returns ERR_UNAUTHORIZED, because each caller is a permitted reader
  - name: the_error_envelope_for_a_missing_required_field_carries_the_declared_shape
    claim_type: error_triggerable
    grounds: response_envelope.error; errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: 'The failure body is asserted field by field: response_type, error_id, the
      catalogue message verbatim and the meta block that successful responses also carry.'
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
