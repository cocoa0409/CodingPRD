        claim_type: Triggerable
        grounds:
          - validations[priority=11]
          - errors[ERR_EVALUATION_ALREADY_EXISTS]
        distinguishing_aspect: "An application carries at most one CredentialEvaluation: a second create returns ERR_EVALUATION_ALREADY_EXISTS (409) and does not re-run the SUBMITTED -> UNDER_REVIEW transition or bump the application version."
        test_recipe:
          setup:
            - "Profession RN; non-military TX applicant with a verified ACTIVE credential."
