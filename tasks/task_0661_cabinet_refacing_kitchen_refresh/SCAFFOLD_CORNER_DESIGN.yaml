            - call: "POST /projects/${pv2b}/measures/${mv2b}/complete"
              payload: { linear_feet: 25, door_count: 18, door_style: "SHAKER", finish_code: "WOOD_VENEER" }
              as: SalesRep
          trigger:
            - call: "POST /projects/${pv2a}/quotes"
              payload: { measure_id: "${mv2b}", scope: "REFACE" }
              as: SalesRep
              captures: { errv2: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_MEASURE_PROJECT_MISMATCH"

