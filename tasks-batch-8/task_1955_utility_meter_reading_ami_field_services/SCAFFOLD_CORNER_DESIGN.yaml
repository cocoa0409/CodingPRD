            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-08-04T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-08-18T00:00:00Z" }, as: MeterOpsAdmin }
