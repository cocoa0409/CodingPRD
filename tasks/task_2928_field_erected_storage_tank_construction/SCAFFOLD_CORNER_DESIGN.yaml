          trigger:
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${s2}", method: "RT", window_start_utc: "2026-08-11T10:00:00Z", window_end_utc: "2026-08-11T11:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${s1}", method: "RT", window_start_utc: "2026-08-11T11:00:00Z", window_end_utc: "2026-08-11T11:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${s1}", method: "RT", window_start_utc: "2026-08-11T10:00:00Z", window_end_utc: "2026-08-11T11:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
