          compliance_deadline_date: '2026-12-31'
          required_shop_days_per_car: 10
          required_component_id: ${kit_id}
        as: RegulatoryRetrofitist
        captures:
          rp_id: $.data.id
          cost_before_start: $.data.program_cost_cents
          rp_status_before: $.data.status
      - call: POST /api/v1/retrofit-program-car-types
