              payload: {water_bank_account_id: "${acct_id}", water_right_id: "${right_id}", point_of_diversion_id: "${pod_id}", lessee_name: "Bench Ditch Co", lease_start_date: "2026-04-01T00:00:00Z", lease_end_date: "2026-08-01T00:00:00Z", requested_af: 40.00, diversion_rate_cfs: 1.500, rental_rate_usd_per_af: 45.00, valuation_method: PRO_RATA_DAILY}
              as: WaterRightsAnalyst
              captures: {lease_id: id}
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-04-05T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /lease-assignments/${lease_id}/activate
              payload: {}
              as: WaterRightsAnalyst
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-06-01T00:00:00Z"}
              as: WaterRightsAnalyst
          trigger: >-
            POST /approval-conditions/${condition_id}/violate as
            WaterRightsAnalyst with {violation_note: "device never installed;
            field inspection 2026-05-28"}.
          assert: |
            Pre-trigger baseline: WaterRight.status == PARTIALLY_TRANSFERRED,
            forfeiture_risk_score == 60.50, forfeiture_risk_band == ELEVATED,
            LeaseAssignment.status == ACTIVE, account
            (deposited 60.00 / committed 0.00 / leased_out 40.00 /
            available 20.00 / suspended_lease_count 0 / posture OPEN).
            After the single violate call (200):
              link 1 — ApprovalCondition.status == VIOLATED
                       (payment_status stays NOT_APPLICABLE)
              link 2 — WaterRight.status == SUSPENDED
              link 3 — LeaseAssignment.status == SUSPENDED, suspension_count == 1
              link 4 — WaterBankAccount: deposited_credit_af == 60.00,
                       committed_credit_af == 40.00, leased_out_af == 0.00,
                       available_credit_af == 20.00, suspended_lease_count == 1,
                       posture == FROZEN   (FROZEN dominates RESTRICTED; a
                       suspended_lease_count of 1 is already enough)
              link 5 — forfeiture_risk_score == 72.50 and
                       forfeiture_risk_band == HIGH (the 12-point SUSPENDED
                       penalty on top of 60.50)
            Volume conservation is untouched by the cascade: encumbered_af
            60.00 + transferred_away_af 30.00 + transferable_af 105.00 ==
            certified_hcu_af 195.00, and the bank identity 60.00 == 20.00 +
            40.00 + 0.00 still holds.
            The right is NOT reinstatable here — priority 31 fails on BOTH of
            its conjuncts (the condition is still VIOLATED, and
            consecutive_nonuse_years == 7 because 2016-2022 carry no records) —
            so POST /water-rights/${right_id}/reinstate returns 409
            ERR_VIOLATION_UNRESOLVED. The cascade is therefore not trivially
            reversible.

      - name: protest_clearance_finalization_cascade
        grounds: state_machines.TransferApplication.UNDER_PROTEST_to_READY_FOR_DECISION
        distinguishing_aspect: >-
          Resolving the LAST outstanding protest — an endpoint on Protest, not
          on TransferApplication — decrements unresolved_protest_count to 0,
          which then drives the parent application UNDER_PROTEST ->
          READY_FOR_DECISION, which in turn freezes the child InjuryAnalysis
          DRAFT -> FINALIZED at offset_af 12.50 / net_injury_af 34.30 and
          zeroes WaterRight.pending_review_count. Resolving the FIRST protest
          must NOT fire any of those links (the application stays UNDER_PROTEST
          with unresolved_protest_count 1 and the analysis stays DRAFT at
          net_injury_af 41.80), so the instance pins both the negative and the
          positive edge of the same three-link chain.
        test_recipe:
          setup: >-
            Pin the clock at 2026-03-01, build the BASE RIGHT for claimant A and
            two further claimants B and C. File one CHANGE_OF_USE application
            for 60.00 af with a SEASONAL_AVERAGE analysis
            (gross_depletion_af 46.80), submit and publish it, then at
            2026-03-05 have B and C each file a protest (the second protest
            re-enters UNDER_PROTEST from UNDER_PROTEST and raises
            unresolved_protest_count to 2). Route both protests to NEGOTIATION.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: {current_utc: "2026-03-01T00:00:00Z"}
              as: WaterRightsAnalyst
            - call: POST /claimants
