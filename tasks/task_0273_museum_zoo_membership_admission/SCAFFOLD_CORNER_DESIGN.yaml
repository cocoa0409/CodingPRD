# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of testable claims
# task_0273_museum_zoo_membership_admission
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_patron_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Patron
          - endpoints
        distinguishing_aspect: "POST /patrons with email+full_name returns 201, server-minted id, version==1, created_at present."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patrons"
              payload: { email: "c1@x.com", full_name: "C One" }
              as: BoxOffice
              captures: { p_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Patron.${p_id}.version == 1"
            - "Patron.${p_id}.email == c1@x.com"

      - name: create_patron_missing_full_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Patron.fields.full_name
          - "validations[priority=5]"
        distinguishing_aspect: "POST /patrons without full_name -> ERR_INVALID_REQUEST (422); full_name has source:input, no default."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patrons"
              payload: { email: "c2@x.com" }
              as: BoxOffice
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_patron_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Patron
          - "validations[priority=4]"
        distinguishing_aspect: "GET /patrons/{id} with an unknown UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /patrons/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BoxOffice
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_patron_duplicate_email_returns_email_taken
        claim_type: Type Constraints
        grounds:
          - entities.Patron.fields.email
          - "validations[priority=6]"
          - "errors[ERR_EMAIL_TAKEN]"
        distinguishing_aspect: "A second POST /patrons with an email already used -> ERR_EMAIL_TAKEN (409)."
        test_recipe:
          setup: ["One patron already exists with email dup@x.com."]
          setup_api_calls:
            - call: "POST /patrons"
              payload: { email: "dup@x.com", full_name: "First" }
              as: BoxOffice
          trigger:
            - call: "POST /patrons"
              payload: { email: "dup@x.com", full_name: "Second" }
              as: BoxOffice
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_EMAIL_TAKEN"

      - name: membership_id_and_version_are_system_assigned
        claim_type: System Fields
        grounds:
          - entities.Membership.fields.status
          - entities.Membership.fields.version
        distinguishing_aspect: "POST /memberships sets status=PENDING_PAYMENT and version=1 by the server; client cannot set them."
        test_recipe:
          setup: ["Plan and patron exist."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "INDIVIDUAL", annual_fee_cents: 12000, household_max: 0, guest_passes_granted: 2, member_admission_cents: 1500 }
              as: MembershipAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "sys@x.com", full_name: "Sys" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_patron_id: "${p_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { m_id: $.data.id }
          assert:
            - "Membership.${m_id}.status == PENDING_PAYMENT"
            - "Membership.${m_id}.version == 1"

      - name: list_memberships_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Membership
          - endpoints
        distinguishing_aspect: "GET /memberships returns response_type=array with pagination fields limit/offset/total_count/has_more."
        test_recipe:
          setup: ["At least one membership exists."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "INDIVIDUAL", annual_fee_cents: 12000, household_max: 0, guest_passes_granted: 2, member_admission_cents: 1500 }
              as: MembershipAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "lst@x.com", full_name: "Lst" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_patron_id: "${p_id}" }
              as: Patron
              as_user_id: "${p_id}"
          trigger:
            - call: "GET /memberships"
              payload: { limit: 10, offset: 0 }
              as: MembershipAdmin
          assert:
            - "response.response_type == array"
            - "response.data.total_count >= 1"
            - "response.data.has_more == false"

      - name: pagination_limit_out_of_range_rejected
        claim_type: Type Constraints
        grounds:
          - "errors[ERR_VALIDATION_PAGINATION]"
          - endpoints
        distinguishing_aspect: "GET /memberships with limit above max (101) -> ERR_VALIDATION_PAGINATION (422)."
        test_recipe:
          setup: ["Empty DB acceptable."]
          setup_api_calls: []
          trigger:
            - call: "GET /memberships"
              payload: { limit: 101 }
              as: MembershipAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION_PAGINATION"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_membership_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Membership.transitions
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancelling a Membership already in CANCELLED -> ERR_INVALID_STATE (409); CANCELLED is terminal."
        test_recipe:
          setup: ["Patron P, membership M cancelled."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "INDIVIDUAL", annual_fee_cents: 12000, household_max: 0, guest_passes_granted: 2, member_admission_cents: 1500 }
              as: MembershipAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "cc@x.com", full_name: "CC" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_patron_id: "${p_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { m_id: $.data.id }
            - call: "POST /memberships/${m_id}/cancel"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /memberships/${m_id}/cancel"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: confirm_already_confirmed_order_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.AdmissionOrder.DRAFT_to_CONFIRMED
          - "errors[ERR_INVALID_STATE]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / confirm_invalid_state_beats_slot_capacity
          rationale: "Re-confirming a CONFIRMED order's ERR_INVALID_STATE is asserted as the winning error in that §1.8 instance."

      - name: checkin_before_window_opens_returns_slot_window
        claim_type: precondition_violation
        grounds:
          - state_machines.AdmissionOrder.CONFIRMED_to_CHECKED_IN
          - "validations[priority=11]"
          - "errors[ERR_SLOT_WINDOW]"
        distinguishing_aspect: "Checking in a CONFIRMED order before slot.starts_at (clock < window) -> ERR_SLOT_WINDOW (409)."
        test_recipe:
          setup: ["Patron P; slot S 2026-06-10T10:00..12:00Z; CONFIRMED order O; clock at 2026-06-01 (before window)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /patrons"
              payload: { email: "cw@x.com", full_name: "CW" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /timed-entry-slots"
              payload: { starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T12:00:00Z", capacity_total: 10, non_member_admission_cents: 2500 }
              as: MembershipAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /admission-orders"
              payload: { patron_id: "${p_id}", slot_id: "${slot_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "NON_MEMBER", person_name: "A" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /admission-orders/${o_id}/check-in"
              payload: {}
              as: BoxOffice
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SLOT_WINDOW"

      - name: checkin_within_window_scans_tickets_and_redeems_passes
        claim_type: side_effect_execution
        grounds:
          - state_machines.AdmissionOrder.CONFIRMED_to_CHECKED_IN
          - state_machines.AdmissionTicket.ACTIVE_to_SCANNED
          - state_machines.GuestPass.RESERVED_to_REDEEMED
        distinguishing_aspect: "Check-in inside the window flips ACTIVE tickets to SCANNED and RESERVED guest passes to REDEEMED."
        test_recipe:
          setup: ["Patron P, ACTIVE membership M (passes=2); slot S 2026-06-10T10:00..12:00Z; CONFIRMED order O with 1 GUEST ticket; clock advanced to 2026-06-10T10:30 (inside window)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /membership-plans"
              payload: { tier: "HOUSEHOLD", annual_fee_cents: 12000, household_max: 3, guest_passes_granted: 2, member_admission_cents: 1500 }
              as: MembershipAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "ci@x.com", full_name: "CI" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_patron_id: "${p_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { m_id: $.data.id }
            - call: "POST /_payments/settle"
              payload: { target: "MEMBERSHIP", membership_id: "${m_id}", outcome: "SUCCEEDED" }
              as: MembershipAdmin
            - call: "POST /timed-entry-slots"
              payload: { starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T12:00:00Z", capacity_total: 10, non_member_admission_cents: 2500 }
              as: MembershipAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /admission-orders"
              payload: { patron_id: "${p_id}", slot_id: "${slot_id}", membership_id: "${m_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "GUEST", person_name: "V" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T10:30:00Z" }
              as: MembershipAdmin
          trigger:
            - call: "POST /admission-orders/${o_id}/check-in"
              payload: {}
              as: BoxOffice
          assert:
            - "AdmissionOrder.${o_id}.status == CHECKED_IN"
            - "count(GuestPass where membership_id==${m_id} and status==REDEEMED) == 1"

      - name: refund_checked_in_order_voids_and_expires_redeemed_pass
        claim_type: side_effect_execution
        grounds:
          - state_machines.AdmissionOrder.CHECKED_IN_to_REFUNDED
          - state_machines.GuestPass.REDEEMED_to_EXPIRED
        distinguishing_aspect: "Refunding a CHECKED_IN order voids tickets, releases slot capacity, and moves the REDEEMED guest pass to EXPIRED (consumed, not returned)."
        test_recipe:
          setup: ["Same as check-in scenario, order O now CHECKED_IN at 2026-06-10T10:30 with 1 GUEST ticket (pass REDEEMED), slot reserved_count==1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /membership-plans"
              payload: { tier: "HOUSEHOLD", annual_fee_cents: 12000, household_max: 3, guest_passes_granted: 2, member_admission_cents: 1500 }
              as: MembershipAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "rf@x.com", full_name: "RF" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_patron_id: "${p_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { m_id: $.data.id }
            - call: "POST /_payments/settle"
              payload: { target: "MEMBERSHIP", membership_id: "${m_id}", outcome: "SUCCEEDED" }
              as: MembershipAdmin
            - call: "POST /timed-entry-slots"
              payload: { starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T12:00:00Z", capacity_total: 10, non_member_admission_cents: 2500 }
              as: MembershipAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /admission-orders"
              payload: { patron_id: "${p_id}", slot_id: "${slot_id}", membership_id: "${m_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "GUEST", person_name: "V" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T10:30:00Z" }
              as: MembershipAdmin
            - call: "POST /admission-orders/${o_id}/check-in"
              payload: {}
              as: BoxOffice
          trigger:
            - call: "POST /admission-orders/${o_id}/refund"
              payload: {}
              as: BoxOffice
          assert:
            - "AdmissionOrder.${o_id}.status == REFUNDED"
            - "TimedEntrySlot.${slot_id}.reserved_count == 0"
            - "count(GuestPass where membership_id==${m_id} and status==EXPIRED) == 1"

      - name: expiry_job_active_to_grace_expires_unused_passes
        claim_type: side_effect_execution
        grounds:
          - state_machines.Membership.ACTIVE_to_GRACE
          - state_machines.GuestPass.transitions
        distinguishing_aspect: "run_expirations moves an ACTIVE non-auto-renew membership past expiry to GRACE and expires its UNUSED guest passes."
        test_recipe:
          setup: ["Patron P, ACTIVE membership M activated 2026-06-01 (passes=2, all UNUSED), auto_renew=false; clock advanced to 2027-06-15."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /membership-plans"
              payload: { tier: "HOUSEHOLD", annual_fee_cents: 12000, household_max: 3, guest_passes_granted: 2, member_admission_cents: 1500 }
              as: MembershipAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "ex@x.com", full_name: "EX" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_patron_id: "${p_id}", auto_renew: false }
              as: Patron
              as_user_id: "${p_id}"
              captures: { m_id: $.data.id }
            - call: "POST /_payments/settle"
              payload: { target: "MEMBERSHIP", membership_id: "${m_id}", outcome: "SUCCEEDED" }
              as: MembershipAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-15T00:00:00Z" }
              as: MembershipAdmin
          trigger:
            - call: "POST /_jobs/run_expirations"
              payload: {}
              as: MembershipAdmin
          assert:
            - "Membership.${m_id}.status == GRACE"
            - "count(GuestPass where membership_id==${m_id} and status==EXPIRED) == 2"

      - name: auto_renew_job_renews_active_membership
        claim_type: side_effect_execution
        grounds:
          - state_machines.Membership.ACTIVE_to_ACTIVE
          - endpoints
        distinguishing_aspect: "run_renewals renews an ACTIVE auto_renew membership past expiry (variant=early), extends expires_at, increments term_count, and the renewed_count is 1."
        test_recipe:
          setup: ["Patron P, ACTIVE membership M activated 2026-06-01, auto_renew=true; clock advanced to 2027-06-02 (past expiry)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /membership-plans"
              payload: { tier: "INDIVIDUAL", annual_fee_cents: 12000, household_max: 0, guest_passes_granted: 2, member_admission_cents: 1500 }
              as: MembershipAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "ar@x.com", full_name: "AR" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_patron_id: "${p_id}", auto_renew: true }
              as: Patron
              as_user_id: "${p_id}"
              captures: { m_id: $.data.id }
            - call: "POST /_payments/settle"
              payload: { target: "MEMBERSHIP", membership_id: "${m_id}", outcome: "SUCCEEDED" }
              as: MembershipAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-02T00:00:00Z" }
              as: MembershipAdmin
          trigger:
            - call: "POST /_jobs/run_renewals"
              payload: {}
              as: MembershipAdmin
          assert:
            - "Membership.${m_id}.status == ACTIVE"
            - "Membership.${m_id}.term_count == 2"
            - "Membership.${m_id}.last_paid_fee_cents == 12000"

      - name: guest_pass_empty_pool_rejects_second_guest_confirm
        claim_type: precondition_violation
        grounds:
          - "validations[priority=14]"
          - state_machines.GuestPass.UNUSED_to_RESERVED
          - entities.GuestPass.fields.status
        distinguishing_aspect: "With guest_passes_granted=1 and that pass already RESERVED on a prior CONFIRMED order, confirming a second GUEST ticket finds zero UNUSED passes -> ERR_NO_GUEST_PASS (409)."
        test_recipe:
          setup:
            - "Plan guest_passes_granted=1; Patron P, ACTIVE membership M (1 guest pass)."
            - "Slot1 future window used by O1 CONFIRMED with 1 GUEST ticket (the single pass now RESERVED)."
            - "Slot2 disjoint future window; DRAFT order O2 with 1 GUEST ticket."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /membership-plans"
              payload: { tier: "INDIVIDUAL", annual_fee_cents: 12000, household_max: 0, guest_passes_granted: 1, member_admission_cents: 1500 }
              as: MembershipAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "gpe@x.com", full_name: "GPE" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_patron_id: "${p_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { m_id: $.data.id }
            - call: "POST /_payments/settle"
              payload: { target: "MEMBERSHIP", membership_id: "${m_id}", outcome: "SUCCEEDED" }
              as: MembershipAdmin
            - call: "POST /timed-entry-slots"
              payload: { starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T11:00:00Z", capacity_total: 10, non_member_admission_cents: 2500 }
              as: MembershipAdmin
              captures: { slot1_id: $.data.id }
            - call: "POST /timed-entry-slots"
              payload: { starts_at: "2026-06-10T13:00:00Z", ends_at: "2026-06-10T14:00:00Z", capacity_total: 10, non_member_admission_cents: 2500 }
              as: MembershipAdmin
              captures: { slot2_id: $.data.id }
            - call: "POST /admission-orders"
              payload: { patron_id: "${p_id}", slot_id: "${slot1_id}", membership_id: "${m_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /admission-orders/${o1_id}/tickets"
              payload: { ticket_type: "GUEST", person_name: "Visitor 1" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o1_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders"
              payload: { patron_id: "${p_id}", slot_id: "${slot2_id}", membership_id: "${m_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /admission-orders/${o2_id}/tickets"
              payload: { ticket_type: "GUEST", person_name: "Visitor 2" }
              as: Patron
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /admission-orders/${o2_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_GUEST_PASS"

  # ===========================================================================
  - section: calculations
    instances:
      - name: reciprocal_free_ticket_priced_zero
        claim_type: correct_result
        grounds:
          - calculations.order_total
          - entities.ReciprocalPartner.fields.benefit_type
