            - "construction-completion succeeds: data.servicing_status == \"AMORTIZING\", data.undrawn_commitment_cents == 0, data.cancelled_commitment_cents == 225000000"
            - "Second attempt with the identical body: 409 with data.error_id == \"ERR_LOAN_NOT_IN_DRAW_PHASE\" — priority 20 outranks priority 49"
            - "No DrawRequest row exists for ${loan} after either attempt: GET /draw-requests?loan_id=${loan} returns data == [] with meta total_count 0"
