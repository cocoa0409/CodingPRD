        claim_type: invalid_transition
        grounds:
          - state_machines.GiftedCase
          - errors[ERR_INVALID_CASE_STATE]
        excluded_because:
          difficulty_instance: case_appeal_review_cycle
          rationale: "Asserted as the failure trigger of the §1.8 instance: the second appeal returns ERR_INVALID_CASE_STATE after appeal_used is set."

  # ============================================================ calculations
  - section: calculations
    instances:
      - name: low_portfolio_drags_composite_below_floor
        claim_type: input_set_filtering
        grounds: [calculations.composite_score, calculations.cut_score_determination]
        distinguishing_aspect: "With all four measures present (weights sum 1.0, no renormalization) a weak PORTFOLIO percentile pulls the composite to 88 (38.40+28.20+17.60+4.00), below a floor of 89 -> NOT_IDENTIFIED, demonstrating the optional fourth measure is included when present."
        test_recipe:
          setup:
            - "clock 2026-08-20; site; grade-3 student; cycle with profile weights 0.40/0.30/0.20/0.10, cut 95, floor 89, cut_2e 90, floor_2e 82, published, SCORING"
            - "case with ABILITY 96, ACHIEVEMENT 94, RATING_SCALE 88, PORTFOLIO 40"
          setup_api_calls:
            - { call: "POST /gifted/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: GiftedCoordinator }
            - { call: "POST /gifted/school-sites", payload: { name: "Site 1", code: "S1", pull_out_capacity: 5, cluster_capacity: 5, acceleration_capacity: 5 }, as: GiftedCoordinator, captures: { site_id: $.data.id } }
            - { call: "POST /gifted/students", payload: { student_number: "ST-1", legal_name: "Stu One", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-1" }, as: GiftedCoordinator, captures: { stu: $.data.id } }
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id, cyc_v: $.data.version } }
            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "PF89", ability_weight: 0.40, achievement_weight: 0.30, rating_weight: 0.20, portfolio_weight: 0.10, cut_score: 95, review_band_floor: 89, cut_score_2e: 90, review_band_floor_2e: 82 }, as: GiftedCoordinator, captures: { prof: $.data.id } }
            - { call: "POST /gifted/cut-score-profiles/${prof}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu}", cycle_id: "${cyc}", pathway: "UNIVERSAL_SCREEN" }, as: GiftedCoordinator, captures: { case_id: $.data.id } }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "ABILITY", percentile: 96, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "ACHIEVEMENT", percentile: 94, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "RATING_SCALE", percentile: 88, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "PORTFOLIO", percentile: 40, administered_on: "2026-08-20" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "SCORING" }, as: GiftedCoordinator }
          trigger:
            - { call: "POST /gifted/cases/${case_id}/finalize-scoring", payload: {}, as: GiftedCoordinator }
          assert:
            - "GiftedCase.${case_id}.composite_score == 88 (96*0.40 + 94*0.30 + 88*0.20 + 40*0.10 = 88.20 -> 88)"
            - "status == NOT_IDENTIFIED (88 < floor 89)"

      - name: measure_validity_boundary_day
        claim_type: constants_applied
        grounds:
          - calculations.composite_score
          - entities.CutScoreProfile.fields.measure_validity_days
          - errors[ERR_MEASURE_OUTSIDE_VALIDITY]
        distinguishing_aspect: "With measure_validity_days defaulting to 730 (field omitted at profile creation), a measure administered exactly today-730 (2024-09-01 when today is 2026-09-01) is accepted while one administered 2024-08-31 is rejected with ERR_MEASURE_OUTSIDE_VALIDITY."
        test_recipe:
          setup: ["clock 2026-08-20 for setup; site; student; cycle with P_BAND profile omitting measure_validity_days (default 730), OPEN; case; clock advanced to 2026-09-01"]
          setup_api_calls:
            - { call: "POST /gifted/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: GiftedCoordinator }
            - { call: "POST /gifted/school-sites", payload: { name: "Site 1", code: "S1", pull_out_capacity: 5, cluster_capacity: 5, acceleration_capacity: 5 }, as: GiftedCoordinator, captures: { site_id: $.data.id } }
            - { call: "POST /gifted/students", payload: { student_number: "ST-1", legal_name: "Stu One", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-1" }, as: GiftedCoordinator, captures: { stu: $.data.id } }
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id, cyc_v: $.data.version } }
            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "P_BAND", ability_weight: 0.40, achievement_weight: 0.30, rating_weight: 0.20, portfolio_weight: 0.10, cut_score: 95, review_band_floor: 88, cut_score_2e: 90, review_band_floor_2e: 82 }, as: GiftedCoordinator, captures: { prof: $.data.id } }
            - { call: "POST /gifted/cut-score-profiles/${prof}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu}", cycle_id: "${cyc}", pathway: "UNIVERSAL_SCREEN" }, as: GiftedCoordinator, captures: { case_id: $.data.id } }
            - { call: "POST /gifted/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: GiftedCoordinator }
          trigger:
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "ABILITY", percentile: 90, administered_on: "2024-09-01" }, as: GiftedCoordinator, captures: { mid: $.data.id } }
            - { call: "POST /gifted/cases/${case_id}/measure-scores", payload: { measure_type: "ACHIEVEMENT", percentile: 90, administered_on: "2024-08-31" }, as: GiftedCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "boundary day accepted: ABILITY measure created (201) with administered_on == 2024-09-01 (exactly today - 730)"
            - "one day older rejected: err == ERR_MEASURE_OUTSIDE_VALIDITY (http 422)"

      - name: exit_score_band_boundaries
        claim_type: correct_result
        grounds: [calculations.exit_score_and_outcome]
        distinguishing_aspect: "exit_score exactly 50.0 (54/2/2: 27+15+8) is PROBATION (>= 50.0), and exactly 70.0 (48/4/4: 24+30+16) is RETAINED (>= 70.0) — both band boundaries inclusive from above."
        test_recipe:
          setup: ["clock 2026-08-20; site capacity 2; honored students X and Y with ACTIVE placements; re-evaluations on both, activated by clock 2027-01-15"]
          setup_api_calls:
            - { call: "POST /gifted/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: GiftedCoordinator }
            - { call: "POST /gifted/school-sites", payload: { name: "Site 1", code: "S1", pull_out_capacity: 2, cluster_capacity: 2, acceleration_capacity: 2 }, as: GiftedCoordinator, captures: { site_id: $.data.id } }
            - { call: "POST /gifted/screening-cycles", payload: { name: "Fall ES", school_year: "2026-2027", grade_band: "ELEMENTARY", screening_open_on: "2026-08-15", screening_close_on: "2026-12-15", referral_close_on: "2026-09-30" }, as: GiftedCoordinator, captures: { cyc: $.data.id, cyc_v: $.data.version } }
            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "P_BAND", ability_weight: 0.40, achievement_weight: 0.30, rating_weight: 0.20, portfolio_weight: 0.10, cut_score: 95, review_band_floor: 88, cut_score_2e: 90, review_band_floor_2e: 82 }, as: GiftedCoordinator, captures: { prof: $.data.id } }
            - { call: "POST /gifted/cut-score-profiles/${prof}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "ST-X", legal_name: "Stu X", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-x" }, as: GiftedCoordinator, captures: { stu_x: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu_x}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator, captures: { case_x: $.data.id } }
