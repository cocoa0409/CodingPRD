# =============================================================================
# Youth Club Site Operations — benchmark seed tables (v1)
# =============================================================================

scenario: |
  Youth Club Site Operations (Boys & Girls Club style): member enrollment & fee/scholarship structure, daily attendance & sign-out authorization, program area rotation & staff-to-youth ratio, transportation from schools & route management, meal/snack program participation & reimbursement claim, behavior policy & suspension process, staff background check & training compliance, outcome measurement & funder reporting

domain_name: youth-club-ops
api_prefix: ""

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - optimistic_concurrency      # OCC on ScholarshipFund.version (award activation) and Member.version (fee payment)
    - cascading_side_effects      # credential lapse -> assignment cancellation -> posture flip; withdraw -> award revoke -> fund release
    - ops_run_checkpoint          # ClubDay open sweeps (compliance, suspensions); ClubDay close sweeps (missing sign-out, weekly fee accrual)
    - rate_threshold_triggers     # rolling 90-day behavior points -> discipline_watch -> mandatory suspension
  entity_topology: flat           # peer resources with FK references; creation via flat paths, FK reads via sub-resource GETs
  state_machine_shape: cyclic     # Member ACTIVE<->SUSPENDED; BehaviorIncident suspension ACTIVE->APPEALED->ACTIVE; parallel dims on BehaviorIncident
  relationship_patterns:
    - one_to_many                 # Site -> Members/ClubDays/Funds/Areas/Routes/Staff/Claims/Reports
    - cross_aggregate             # RotationAssignment -> Member + Staff + ProgramArea + ClubDay; RideAssignment -> Member + TransportRoute
    - polymorphic                 # RotationAssignment references member_id XOR staff_id depending on kind
  role_model: segregation_of_duties  # claim submit vs approve; report submit vs accept; incident adjudicate vs appeal-resolve
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site name" }
      - { name: youth_capacity, type: integer, source: input, description: "Max youth on site at once; posture OVER_CAPACITY when present_count >= youth_capacity" }
      - { name: standard_ratio, type: integer, source: input, description: "Max youth per staff member in STANDARD risk areas" }
      - { name: elevated_ratio, type: integer, source: input, description: "Max youth per staff member in ELEVATED risk areas" }
      - { name: base_weekly_fee_cents, type: integer, source: input, description: "Weekly membership fee before tier multiplier and scholarship" }
      - { name: registration_fee_cents, type: integer, source: input, description: "One-time fee accrued to fee_balance_cents at approval" }
      - { name: max_arrears_cents, type: integer, source: input, description: "Sign-in blocked when fee_balance_cents > max_arrears_cents (boundary: == is allowed)" }
      - { name: fee_accrual_weekday, type: integer, source: input, default: 5, description: "ISO weekday (1=Mon..7=Sun); closing a ClubDay whose date falls on this weekday triggers weekly fee accrual" }
      - { name: meal_rates_cents, type: object, source: input, description: "Reimbursement rates {BREAKFAST:{FREE,REDUCED,PAID}, SNACK:{...}, SUPPER:{...}} in integer cents per meal" }

  - name: Member
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: legal_name, type: string, source: input, description: "Member full legal name" }
      - { name: date_of_birth, type: string, source: input, description: "YYYY-MM-DD" }
      - { name: grade, type: integer, source: input, description: "School grade 0-12" }
      - { name: household_size, type: integer, source: input, description: "Household size for eligibility tier determination" }
      - { name: household_income_cents, type: integer, source: input, description: "Annual household income in cents" }
      - { name: walker_ok, type: boolean, source: input, default: false, description: "Whether member may sign out as WALKER" }
      - { name: status, type: enum, source: system, description: "APPLIED | ACTIVE | SUSPENDED | DENIED | WITHDRAWN" }
      - { name: eligibility_tier, type: enum, source: computed, description: "FREE | REDUCED | PAID; null until approval; derived from household income thresholds" }
      - { name: weekly_fee_cents, type: integer, source: computed, description: "round_half_up(base_weekly_fee_cents x tier multiplier); null until approval" }
      - { name: fee_balance_cents, type: integer, source: computed, default: 0, description: "Ledger: + registration fee at approval, + weekly accruals, - payments, - scholarship disbursements" }
      - { name: behavior_points, type: integer, source: computed, default: 0, description: "Sum of points from ADJUDICATED incidents dated within rolling 90-day window [today-90, today]" }
      - { name: discipline_watch, type: boolean, source: computed, default: false, description: "true when behavior_points >= 10" }
      - { name: approved_at, type: datetime, source: system, description: "Set at approval; null otherwise" }
      - { name: withdrawn_at, type: datetime, source: system, description: "Set at withdrawal; null otherwise" }

  - name: Guardian
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: full_name, type: string, source: input, description: "Guardian full name; sign-out matches pickup_name case-sensitively against ACTIVE guardians" }
      - { name: relation, type: string, source: input, description: "Relationship to member" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED" }

  - name: ScholarshipFund
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: name, type: string, source: input, description: "Fund name" }
      - { name: budget_cents, type: integer, source: input, description: "Total fund budget" }
      - { name: reserved_cents, type: integer, source: computed, default: 0, description: "Sum of remaining_cap_cents over ACTIVE awards" }
      - { name: disbursed_cents, type: integer, source: computed, default: 0, description: "Sum disbursed via weekly fee accrual" }
      - { name: available_cents, type: integer, source: computed, description: "= budget_cents - reserved_cents - disbursed_cents (invariant: budget == available + reserved + disbursed)" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED" }

  - name: ScholarshipAward
    parent: Member
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> ScholarshipFund.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: discount_pct, type: number, source: input, description: "Fraction of weekly fee covered, 0 < pct <= 1" }
      - { name: weekly_cap_cents, type: integer, source: input, description: "Max disbursement per weekly accrual" }
      - { name: annual_cap_cents, type: integer, source: input, description: "Lifetime cap; reserved from fund at activation" }
      - { name: disbursed_cents, type: integer, source: computed, default: 0, description: "Total disbursed so far" }
      - { name: remaining_cap_cents, type: integer, source: computed, description: "= annual_cap_cents - disbursed_cents" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | REVOKED | CANCELLED | EXHAUSTED" }

  - name: ClubDay
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: date, type: string, source: input, description: "YYYY-MM-DD; must equal logical clock date at creation; unique per site" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | RECONCILED" }
      - { name: present_count, type: integer, source: computed, default: 0, description: "Count of AttendanceRecords in ON_SITE for this day" }
      - { name: signed_out_count, type: integer, source: computed, default: 0, description: "Count in SIGNED_OUT" }
      - { name: missing_signout_count, type: integer, source: computed, default: 0, description: "Count in MISSING_SIGNOUT" }
      - { name: meal_counts, type: object, source: input, default: "{BREAKFAST:{FREE:0,REDUCED:0,PAID:0},SNACK:{...},SUPPER:{...}}", description: "Per meal type per eligibility tier counts; upserted via meal-counts endpoint" }
      - { name: posture, type: enum, source: computed, default: "NORMAL", description: "OVER_CAPACITY if present_count >= site.youth_capacity; else RATIO_STRAINED if checked-in staff count x site.standard_ratio < present_count; else NORMAL" }
      - { name: weekly_fees_accrued, type: boolean, source: system, default: false, description: "Set true when close() ran the weekly fee accrual for this day" }

  - name: AttendanceRecord
    parent: ClubDay
    common_fields: true
    fields:
      - { name: club_day_id, type: string, source: input, description: "FK -> ClubDay.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: sign_in_at, type: datetime, source: system, description: "Logical clock at sign-in" }
      - { name: sign_out_at, type: datetime, source: system, description: "Logical clock at sign-out; null while ON_SITE" }
      - { name: sign_out_type, type: enum, source: input, description: "AUTHORIZED_PICKUP | WALKER | BUS; null until sign-out" }
      - { name: pickup_name, type: string, source: input, description: "Required for AUTHORIZED_PICKUP; must case-sensitively match an ACTIVE guardian full_name" }
      - { name: status, type: enum, source: system, description: "ON_SITE | SIGNED_OUT | MISSING_SIGNOUT" }

  - name: ProgramArea
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: name, type: string, source: input, description: "Area name (e.g., Gym, Aquatics)" }
      - { name: capacity, type: integer, source: input, description: "Max checked-in youth per block" }
      - { name: risk_tier, type: enum, source: input, default: "STANDARD", description: "STANDARD | ELEVATED; selects site.standard_ratio vs site.elevated_ratio" }
      - { name: ratio_override, type: integer, source: input, description: "Optional per-area youth-per-staff ratio; when set it wins over risk-tier ratio" }

  - name: RotationAssignment
    parent: ClubDay
    common_fields: true
    fields:
      - { name: club_day_id, type: string, source: input, description: "FK -> ClubDay.id" }
      - { name: area_id, type: string, source: input, description: "FK -> ProgramArea.id" }
      - { name: block, type: enum, source: input, description: "BLOCK_A | BLOCK_B | BLOCK_C" }
      - { name: kind, type: enum, source: input, description: "YOUTH (member_id required, staff_id forbidden) | STAFF (staff_id required, member_id forbidden)" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; required when kind=YOUTH" }
      - { name: staff_id, type: string, source: input, description: "FK -> Staff.id; required when kind=STAFF" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CHECKED_IN | COMPLETED | CANCELLED | MOVED" }

  - name: TransportRoute
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: route_name, type: string, source: input, description: "Route name" }
      - { name: school_name, type: string, source: input, description: "School served by this route" }
      - { name: seat_capacity, type: integer, source: input, description: "Bus seats; aggregate occupancy cap per club-day date" }

  - name: RideAssignment
    parent: TransportRoute
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> TransportRoute.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: effective_start_date, type: string, source: input, description: "YYYY-MM-DD; half-open window start (inclusive)" }
      - { name: effective_end_date, type: string, source: input, description: "YYYY-MM-DD; half-open window end (exclusive); null = open-ended" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ENDED" }

  - name: MealClaim
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: claim_month, type: string, source: input, description: "YYYY-MM; unique per site" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED" }
      - { name: rate_snapshot, type: object, source: system, description: "Site meal_rates_cents + seasonal multiplier pinned at claim creation" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Computed at creation over CLOSED+RECONCILED days of the month, per-line rounding" }
      - { name: final_total_cents, type: integer, source: computed, description: "Computed at submit over RECONCILED days only, using rate_snapshot; null until submitted" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID captured at submit; approver must differ (segregation of duties)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID captured at approve" }

  - name: BehaviorIncident
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: incident_date, type: string, source: input, description: "YYYY-MM-DD; may be in the past (late reporting)" }
      - { name: category, type: enum, source: input, description: "LEVEL_1 | LEVEL_2 | LEVEL_3" }
      - { name: points, type: integer, source: computed, description: "LEVEL_1=1, LEVEL_2=3, LEVEL_3=8" }
      - { name: description, type: string, source: input, description: "Narrative" }
      - { name: adjudication_status, type: enum, source: system, description: "REPORTED | ADJUDICATED | DISMISSED (parallel dimension 1)" }
      - { name: suspension_status, type: enum, source: system, description: "NONE | IMPOSED | ACTIVE | APPEALED | SERVED | RESCINDED (parallel dimension 2)" }
      - { name: suspension_start_date, type: string, source: input, description: "YYYY-MM-DD; required when imposing suspension; window is [start, start+suspension_days) calendar days" }
      - { name: suspension_days, type: integer, source: input, description: "Length of suspension in calendar days; required when imposing" }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of adjudicator; appeal resolver must differ (segregation of duties)" }

  - name: Staff
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: full_name, type: string, source: input, description: "Staff full name" }
      - { name: position, type: enum, source: input, description: "DIRECTOR (may act as SiteDirector role) | FRONTLINE (may act as FrontlineStaff role)" }
      - { name: status, type: enum, source: system, description: "HIRED | ACTIVE; auto-promotes to ACTIVE when both credentials present and unexpired" }
      - { name: background_check_expires_at, type: datetime, source: input, description: "Set via credentials endpoint kind=BACKGROUND_CHECK; null until first posting" }
      - { name: training_expires_at, type: datetime, source: input, description: "Set via credentials endpoint kind=TRAINING; null until first posting" }
      - { name: compliance_status, type: enum, source: computed, description: "INCOMPLETE (any credential null) | LAPSED (any expiry < now) | EXPIRING (any expiry within 30 days) | COMPLIANT" }

  - name: FunderReport
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: report_month, type: string, source: input, description: "YYYY-MM; unique per site" }
      - { name: funder_type, type: enum, source: input, description: "UNITED_WAY (headline = enrollment basis) | STATE_GRANT (headline = capacity basis)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED" }
      - { name: operating_days, type: integer, source: computed, description: "Club days in month with status CLOSED or RECONCILED at report creation" }
      - { name: member_days_attended, type: integer, source: computed, description: "Attendance records (any status) on those days" }
      - { name: member_days_enrolled, type: integer, source: computed, description: "Sum over those days of members with approved_at <= day end-of-day and (withdrawn_at null or withdrawn_at > day start); suspension still counts as enrolled" }
      - { name: average_daily_attendance, type: number, source: computed, description: "member_days_attended / operating_days, 4dp round_half_up; 0 when operating_days == 0" }
      - { name: attendance_rate_enrollment_basis, type: number, source: computed, description: "member_days_attended / member_days_enrolled, 4dp round_half_up; 0 when enrolled == 0" }
      - { name: attendance_rate_capacity_basis, type: number, source: computed, description: "member_days_attended / (site.youth_capacity x operating_days), 4dp round_half_up; 0 when operating_days == 0" }
      - { name: headline_attendance_rate, type: number, source: computed, description: "= enrollment basis when funder_type=UNITED_WAY, capacity basis when STATE_GRANT" }
      - { name: meals_served_total, type: integer, source: computed, description: "Sum of all meal_counts cells over included days" }
      - { name: incidents_total, type: integer, source: computed, description: "Incidents with incident_date within report month (any adjudication status)" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID at submit; acceptor must differ (segregation of duties)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: APPLIED
    terminal_states: [DENIED, WITHDRAWN]
    transitions:
      - from: APPLIED
        to: ACTIVE
        trigger: "POST /members/{id}/decide with decision=APPROVE"
        actor: SiteDirector
        preconditions:
          - "status == APPLIED (ERR_MEMBER_NOT_APPLIED)"
        side_effects:
          - "eligibility_tier computed via eligibility_tier_determination"
          - "weekly_fee_cents computed via weekly_fee_assessment (gross)"
          - "fee_balance_cents += site.registration_fee_cents"
          - "approved_at = now; version++"
      - from: APPLIED
        to: DENIED
        trigger: "POST /members/{id}/decide with decision=DENY"
        actor: SiteDirector
        preconditions: ["status == APPLIED (ERR_MEMBER_NOT_APPLIED)"]
        side_effects: ["version++"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (incident suspension activation: adjudicate with start <= today, or club-day open sweep activating an IMPOSED suspension)"
        actor: system
        preconditions: ["a BehaviorIncident of this member transitions suspension_status to ACTIVE"]
        side_effects: ["version++"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (club-day open sweep serving an ended suspension, or appeal resolved UPHELD -> RESCINDED) when no other incident has suspension_status ACTIVE for this member"
        actor: system
        preconditions: ["no other BehaviorIncident of this member has suspension_status ACTIVE"]
        side_effects: ["version++"]
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /members/{id}/withdraw"
        actor: SiteDirector
        preconditions: ["status in {ACTIVE, SUSPENDED} (ERR_MEMBER_NOT_ACTIVE)"]
        side_effects:
          - "withdrawn_at = now; version++"
          - "cascade: each PENDING ScholarshipAward of member -> CANCELLED"
          - "cascade: each ACTIVE ScholarshipAward of member -> REVOKED (which itself releases fund reservation: fund.reserved_cents -= award.remaining_cap_cents, fund.available_cents recomputed, fund.version++)"
          - "cascade: each ACTIVE RideAssignment of member -> ENDED"
          - "cascade: each SCHEDULED RotationAssignment of member with club_day.date >= today -> CANCELLED"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /members/{id}/withdraw"
        actor: SiteDirector
        preconditions: ["status in {ACTIVE, SUSPENDED} (ERR_MEMBER_NOT_ACTIVE)"]
        side_effects: ["same cascade as ACTIVE -> WITHDRAWN"]

  - entity: Guardian
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /guardians/{id}/revoke"
        actor: SiteDirector | FrontlineStaff
        preconditions: ["status == ACTIVE (ERR_GUARDIAN_NOT_ACTIVE)"]
        side_effects: ["version++"]

  - entity: ScholarshipFund
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /scholarship-funds/{id}/close"
        actor: PlatformAdmin
        preconditions: ["status == OPEN (ERR_FUND_NOT_OPEN)"]
        side_effects:
          - "cascade: each PENDING ScholarshipAward on this fund -> CANCELLED"
          - "ACTIVE awards are unaffected (their reservations remain until revoked or exhausted)"
          - "version++"

  - entity: ScholarshipAward
    initial_state: PENDING
    terminal_states: [REVOKED, CANCELLED, EXHAUSTED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /scholarship-awards/{id}/activate"
        actor: SiteDirector
        preconditions:
          - "status == PENDING (ERR_AWARD_NOT_PENDING)"
          - "fund.status == OPEN (ERR_FUND_NOT_OPEN)"
          - "fund.available_cents >= annual_cap_cents (ERR_FUND_INSUFFICIENT)"
          - "expected_fund_version == fund.version (ERR_STALE_VERSION, OCC)"
        side_effects:
          - "fund.reserved_cents += annual_cap_cents; fund.available_cents recomputed; fund.version++"
          - "version++"
      - from: PENDING
        to: CANCELLED
        trigger: "system (fund closed, or member withdrawn)"
        actor: system
        preconditions: []
        side_effects: ["version++"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /scholarship-awards/{id}/revoke OR system (member withdrawn)"
        actor: SiteDirector | system
        preconditions: ["status == ACTIVE (ERR_AWARD_NOT_ACTIVE)"]
        side_effects:
          - "fund.reserved_cents -= remaining_cap_cents; fund.available_cents recomputed; fund.version++"
          - "version++"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (weekly accrual disburses the last of annual_cap: remaining_cap_cents reaches 0)"
        actor: system
        preconditions: []
        side_effects: ["version++"]

  - entity: ClubDay
    initial_state: OPEN
    terminal_states: [RECONCILED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /club-days/{id}/close"
        actor: SiteDirector
        preconditions: ["status == OPEN (ERR_CLUB_DAY_NOT_OPEN)"]
        side_effects:
          - "every AttendanceRecord still ON_SITE -> MISSING_SIGNOUT; counts recomputed (missing_signout_count += n, present_count -= n); each flipped record version++"
          - "every RotationAssignment still SCHEDULED -> CANCELLED; every CHECKED_IN -> COMPLETED; each version++"
          - "if ISO weekday of date == site.fee_accrual_weekday: run weekly_fee_assessment accrual for members with status in {ACTIVE, SUSPENDED} and approved_at <= day end, ordered by approved_at ASC then created_at ASC; set weekly_fees_accrued = true"
          - "version++"
      - from: CLOSED
        to: RECONCILED
        trigger: "POST /club-days/{id}/reconcile"
        actor: SiteDirector
        preconditions:
          - "status == CLOSED (ERR_CLUB_DAY_NOT_CLOSED)"
          - "for every meal_type and tier: meal_counts[meal_type][tier] <= count of the day's AttendanceRecords with status SIGNED_OUT whose member eligibility_tier == tier (ERR_MEAL_COUNTS_EXCEED_ATTENDANCE)"
        side_effects: ["version++"]

  - entity: AttendanceRecord
    initial_state: ON_SITE
    terminal_states: [SIGNED_OUT, MISSING_SIGNOUT]
    transitions:
      - from: ON_SITE
        to: SIGNED_OUT
        trigger: "POST /attendance-records/{id}/sign-out"
        actor: SiteDirector | FrontlineStaff
        preconditions:
          - "status == ON_SITE (ERR_ALREADY_SIGNED_OUT if SIGNED_OUT, ERR_ATTENDANCE_FINAL if MISSING_SIGNOUT)"
          - "sign_out_type == AUTHORIZED_PICKUP: pickup_name must case-sensitively equal full_name of an ACTIVE guardian of the member (ERR_PICKUP_NOT_AUTHORIZED)"
          - "sign_out_type == WALKER: member.walker_ok must be true (ERR_WALKER_NOT_PERMITTED)"
          - "sign_out_type == BUS: member must have an ACTIVE RideAssignment whose half-open window covers club_day.date (ERR_NO_RIDE_FOR_DATE)"
        side_effects:
          - "sign_out_at = now; club_day.present_count -= 1; club_day.signed_out_count += 1; club_day posture recomputed; both versions++"
      - from: ON_SITE
        to: MISSING_SIGNOUT
        trigger: "system (club-day close sweep)"
        actor: system
        preconditions: []
        side_effects: ["club_day.present_count -= 1; club_day.missing_signout_count += 1; version++"]

  - entity: RotationAssignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, MOVED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /rotation-assignments/{id}/check-in"
        actor: SiteDirector | FrontlineStaff
        preconditions:
          - "status == SCHEDULED (ERR_ASSIGNMENT_NOT_CHECKABLE)"
          - "club_day.status == OPEN (ERR_CLUB_DAY_NOT_OPEN)"
          - "kind == STAFF: staff.compliance_status in {COMPLIANT, EXPIRING} (ERR_STAFF_NOT_COMPLIANT)"
          - "kind == YOUTH: after this check-in, youth checked-in count in (area, block) <= area.capacity (ERR_AREA_CAPACITY_EXCEEDED)"
          - "kind == YOUTH: required_staff = ceil(youth_count_after / effective_ratio) <= staff checked-in count in (area, block) (ERR_RATIO_VIOLATION); capacity checked before ratio"
        side_effects:
          - "kind == STAFF: club_day posture recomputed (staffing up)"
          - "kind == YOUTH: club_day posture recomputed"
          - "version++"
      - from: CHECKED_IN
        to: MOVED
        trigger: "POST /rotation-assignments/{id}/move"
        actor: SiteDirector | FrontlineStaff
        preconditions:
          - "status == CHECKED_IN (ERR_ASSIGNMENT_NOT_MOVABLE)"
          - "club_day.status == OPEN (ERR_CLUB_DAY_NOT_OPEN)"
          - "destination area exists (ERR_NOT_FOUND)"
          - "kind == YOUTH: destination (area, same block) capacity and ratio validated as in check-in (ERR_AREA_CAPACITY_EXCEEDED / ERR_RATIO_VIOLATION)"
        side_effects:
          - "this record -> MOVED; a successor RotationAssignment is created with same club_day/block/kind/member-or-staff, area = new_area_id, status = CHECKED_IN; response returns successor"
          - "club_day posture recomputed; versions++"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (club-day close sweep; staff credential lapse cascade; member withdraw cascade)"
        actor: system
        preconditions: []
        side_effects: ["club_day posture recomputed; version++"]
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "system (staff credential lapse cascade cancels CHECKED_IN staff assignments with club_day.date >= today)"
        actor: system
        preconditions: []
        side_effects: ["club_day posture recomputed; version++"]
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system (club-day close sweep)"
        actor: system
        preconditions: []
        side_effects: ["version++"]

  - entity: RideAssignment
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "POST /ride-assignments/{id}/end OR system (member withdraw cascade)"
        actor: SiteDirector | system
        preconditions:
          - "status == ACTIVE (ERR_RIDE_NOT_ACTIVE)"
          - "explicit end: end_date > effective_start_date and (effective_end_date null or end_date <= effective_end_date) (ERR_INVALID_DATE_WINDOW)"
        side_effects: ["effective_end_date = end_date (explicit end only); version++"]

  - entity: MealClaim
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /meal-claims/{id}/submit"
        actor: SiteDirector
        preconditions:
          - "status == DRAFT (ERR_CLAIM_NOT_SUBMITTABLE)"
          - "at least one club day of the site in claim_month has status RECONCILED (ERR_CLAIM_NO_RECONCILED_DAYS)"
        side_effects:
          - "final_total_cents computed via meal_claim_reimbursement FINAL variant (RECONCILED days only, rate_snapshot)"
          - "submitted_by_user_id = X-User-ID; version++"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /meal-claims/{id}/approve"
        actor: StateAgencyReviewer
        preconditions:
          - "status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["approved_by_user_id = X-User-ID; version++"]

  - entity: BehaviorIncident
    initial_state: "adjudication_status=REPORTED, suspension_status=NONE"
    terminal_states: ["adjudication_status=DISMISSED", "adjudication_status=ADJUDICATED with suspension_status in {NONE, SERVED, RESCINDED}"]
    transitions:
      - from: "REPORTED / NONE"
        to: "ADJUDICATED / NONE"
        trigger: "POST /behavior-incidents/{id}/adjudicate with outcome=SUSTAINED and no suspension_days"
        actor: SiteDirector
        preconditions:
          - "adjudication_status == REPORTED (ERR_INCIDENT_NOT_REPORTED)"
          - "member.discipline_watch == false, otherwise suspension_days > 0 is mandatory (ERR_SUSPENSION_MANDATORY)"
        side_effects: ["member.behavior_points recomputed (points now count); member.discipline_watch recomputed; adjudicated_by_user_id = X-User-ID; both versions++"]
      - from: "REPORTED / NONE"
        to: "ADJUDICATED / IMPOSED or ACTIVE"
        trigger: "POST /behavior-incidents/{id}/adjudicate with outcome=SUSTAINED, suspension_days>0, suspension_start_date"
        actor: SiteDirector
        preconditions: ["adjudication_status == REPORTED (ERR_INCIDENT_NOT_REPORTED)"]
        side_effects:
          - "if suspension_start_date <= today: suspension_status = ACTIVE and member ACTIVE -> SUSPENDED; else suspension_status = IMPOSED"
          - "member.behavior_points recomputed; adjudicated_by_user_id = X-User-ID; both versions++"
      - from: "REPORTED / NONE"
        to: "DISMISSED / NONE"
        trigger: "POST /behavior-incidents/{id}/adjudicate with outcome=DISMISS"
        actor: SiteDirector
        preconditions: ["adjudication_status == REPORTED (ERR_INCIDENT_NOT_REPORTED)"]
        side_effects: ["points excluded from member.behavior_points; adjudicated_by_user_id = X-User-ID; version++"]
      - from: "ADJUDICATED / IMPOSED"
        to: "ADJUDICATED / ACTIVE"
        trigger: "system (club-day open sweep when day.date >= suspension_start_date)"
        actor: system
        preconditions: []
        side_effects: ["member ACTIVE -> SUSPENDED; both versions++"]
      - from: "ADJUDICATED / ACTIVE"
        to: "ADJUDICATED / SERVED"
        trigger: "system (club-day open sweep when day.date >= suspension_start_date + suspension_days)"
        actor: system
        preconditions: []
        side_effects: ["member SUSPENDED -> ACTIVE if no other ACTIVE suspension for member; both versions++"]
      - from: "ADJUDICATED / ACTIVE"
        to: "ADJUDICATED / APPEALED"
        trigger: "POST /behavior-incidents/{id}/appeal"
        actor: SiteDirector | FrontlineStaff
        preconditions: ["suspension_status == ACTIVE (ERR_INCIDENT_NOT_APPEALABLE)"]
        side_effects: ["member remains SUSPENDED during appeal; version++"]
      - from: "ADJUDICATED / APPEALED"
        to: "ADJUDICATED / ACTIVE"
        trigger: "POST /behavior-incidents/{id}/resolve-appeal with decision=DENIED"
        actor: SiteDirector
        preconditions:
          - "suspension_status == APPEALED (ERR_APPEAL_NOT_PENDING)"
          - "X-User-ID != adjudicated_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["member remains SUSPENDED; version++"]
      - from: "ADJUDICATED / APPEALED"
        to: "ADJUDICATED / RESCINDED"
        trigger: "POST /behavior-incidents/{id}/resolve-appeal with decision=UPHELD"
        actor: SiteDirector
        preconditions:
          - "suspension_status == APPEALED (ERR_APPEAL_NOT_PENDING)"
          - "X-User-ID != adjudicated_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "this incident's points stop counting toward member.behavior_points (watch recomputed)"
          - "member SUSPENDED -> ACTIVE if no other ACTIVE suspension for member; both versions++"

  - entity: Staff
    initial_state: HIRED
    terminal_states: []
    transitions:
      - from: HIRED
        to: ACTIVE
        trigger: "system (POST /staff/{id}/credentials when after the update both credentials are present and unexpired)"
        actor: system
        preconditions: ["background_check_expires_at and training_expires_at both non-null and >= now"]
        side_effects: ["compliance_status recomputed; version++"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /staff/{id}/credentials (renewal or lapse-inducing update; status unchanged, compliance_status recomputed)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "compliance_status recomputed against logical clock"
          - "if new compliance_status == LAPSED: cascade cancels this staff's SCHEDULED and CHECKED_IN RotationAssignments whose club_day.date >= today; each affected club_day posture recomputed (a cancellation that removes the last checked-in staff flips posture to RATIO_STRAINED)"
          - "version++"

  - entity: FunderReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /funder-reports/{id}/submit"
        actor: SiteDirector
        preconditions: ["status == DRAFT (ERR_REPORT_NOT_SUBMITTABLE)"]
        side_effects: ["submitted_by_user_id = X-User-ID; version++"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /funder-reports/{id}/accept"
        actor: FunderContact
        preconditions:
          - "status == SUBMITTED (ERR_REPORT_NOT_SUBMITTED)"
          - "X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["version++"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: award-activate-stale-fund
    parent_entity: ScholarshipFund
    write_endpoint: "POST /scholarship-awards/{id}/activate"
    occ_field: expected_fund_version
    description: |
      Activating a ScholarshipAward against a ScholarshipFund whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just activated or revoked an award (which
      legitimately changed reserved_cents/available_cents) and the current
      writer's budget view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: fee-payment-stale-member
    parent_entity: Member
    write_endpoint: "POST /members/{id}/fee-payments"
    occ_field: expected_member_version
    description: |
      Posting a fee payment against a Member whose version has advanced since
      the client last observed it is rejected. This captures the case where a
      weekly accrual or an earlier payment has legitimately changed
      fee_balance_cents and the current writer's balance view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: eligibility_tier_determination
    trigger: "POST /members/{id}/decide with decision=APPROVE"
    algorithm: threshold
    formula: |
      free_limit(size)    = FREE_BASE_CENTS + (size - 1) * FREE_STEP_CENTS
      reduced_limit(size) = REDUCED_BASE_CENTS + (size - 1) * REDUCED_STEP_CENTS
      if household_income_cents <= free_limit(household_size):    tier = FREE
      elif household_income_cents <= reduced_limit(household_size): tier = REDUCED
      else:                                                        tier = PAID
      Boundary is inclusive (<=): income exactly equal to a limit takes the lower tier.
    input_set: "The single Member being approved"
    constants:
      FREE_BASE_CENTS: 1500000
      FREE_STEP_CENTS: 500000
      REDUCED_BASE_CENTS: 2000000
      REDUCED_STEP_CENTS: 650000
    precision: "integer cents; exact comparison"

  - name: weekly_fee_assessment
    trigger: "POST /members/{id}/decide (gross fee at approval) and POST /club-days/{id}/close when ISO weekday of date == site.fee_accrual_weekday (accrual + scholarship disbursement)"
    algorithm: tiered_pricing
    formula: |
      weekly_fee_cents(member) = round_half_up(site.base_weekly_fee_cents * TIER_MULTIPLIER[member.eligibility_tier])
      Accrual, per member with status in {ACTIVE, SUSPENDED} and approved_at <= club day end,
      processed in order approved_at ASC, created_at ASC:
        award = the member's ScholarshipAward with status == ACTIVE (at most one may be ACTIVE per member;
                if several are ACTIVE, the one with earliest created_at is used)
        gross = member.weekly_fee_cents
        discount_amount = round_half_up(gross * award.discount_pct)          # per-member-per-week rounding, pinned BEFORE min
        disbursement = min(award.weekly_cap_cents, award.remaining_cap_cents, discount_amount)   # nested min over 3 inputs
        award.disbursed_cents += disbursement
        award.remaining_cap_cents -= disbursement
        fund.reserved_cents -= disbursement; fund.disbursed_cents += disbursement
        if award.remaining_cap_cents == 0: award.status = EXHAUSTED
        member.fee_balance_cents += (gross - disbursement)
        member.version++, award.version++ (if disbursed), fund.version++ once per close if any disbursement
      Conservation: fund.budget_cents == fund.available_cents + fund.reserved_cents + fund.disbursed_cents at all times.
    input_set: "Members of the site with status in {ACTIVE, SUSPENDED} and approved_at <= club day end-of-day; WITHDRAWN/DENIED/APPLIED excluded"
    constants:
      TIER_MULTIPLIER: { FREE: 0.0, REDUCED: 0.5, PAID: 1.0 }
    precision: "integer cents, round_half_up, per member per week (never on aggregates)"

  - name: meal_claim_reimbursement
    trigger: "POST /meal-claims (PROVISIONAL at creation) and POST /meal-claims/{id}/submit (FINAL)"
    algorithm: aggregation
    formula: |
      seasonal_multiplier(date) = SUMMER_MULTIPLIER if month(date) in {6,7,8} else 1.0
      For each included ClubDay d, each meal_type t, each tier r with count n = d.meal_counts[t][r]:
        line_cents(d, t, r) = round_half_up(n * rate_snapshot.rates[t][r] * rate_snapshot.multiplier[d.date])
        # Rounding order is pinned: round EACH (day, meal_type, tier) line to cents first, THEN sum lines.
        # (Sum-then-round yields different cents; it is NOT the rule.)
      total = sum of line_cents over all included lines
      rate_snapshot is pinned at claim creation from site.meal_rates_cents and the per-day seasonal multiplier.
    input_set: "PROVISIONAL: club days of the site with date in claim_month and status in {CLOSED, RECONCILED}. FINAL: only status == RECONCILED. OPEN days never included."
    constants:
      SUMMER_MULTIPLIER: 1.10
    precision: "integer cents, round_half_up per line, then integer sum"
    variants:
      - name: PROVISIONAL
        when: "claim creation (DRAFT)"
        difference: "includes CLOSED and RECONCILED days; stored in provisional_total_cents"
      - name: FINAL
        when: "claim submit"
        difference: "includes RECONCILED days only; stored in final_total_cents; diverges from provisional whenever a counted day is CLOSED-but-not-RECONCILED"

  - name: attendance_rate
    trigger: "POST /funder-reports (computed at creation over the report month)"
    algorithm: aggregation
    formula: |
      included_days = club days of the site with date in report_month and status in {CLOSED, RECONCILED}
      operating_days = |included_days|
      member_days_attended = count of AttendanceRecords on included_days (any status: ON_SITE/SIGNED_OUT/MISSING_SIGNOUT all count as attended)
      member_days_enrolled = sum over each included day d of count(Members of site with approved_at <= d end-of-day
                               and (withdrawn_at is null or withdrawn_at > d start-of-day))   # SUSPENDED still enrolled
      enrollment_basis = round_half_up_4dp(member_days_attended / member_days_enrolled)   (0 if enrolled == 0)
      capacity_basis   = round_half_up_4dp(member_days_attended / (site.youth_capacity * operating_days))   (0 if operating_days == 0)
      headline_attendance_rate = enrollment_basis if funder_type == UNITED_WAY else capacity_basis
      average_daily_attendance = round_half_up_4dp(member_days_attended / operating_days)   (0 if operating_days == 0)
    input_set: "As above; days still OPEN are excluded from both variants"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: enrollment_basis
        when: "funder_type == UNITED_WAY selects it as headline"
        difference: "denominator counts enrolled member-days"
      - name: capacity_basis
        when: "funder_type == STATE_GRANT selects it as headline"
        difference: "denominator is site.youth_capacity x operating_days; identical inputs, different rate"

  - name: ratio_staffing_requirement
    trigger: "POST /rotation-assignments/{id}/check-in and POST /rotation-assignments/{id}/move for kind=YOUTH"
    algorithm: threshold
    formula: |
      effective_ratio(area) = area.ratio_override if set
                              else (site.elevated_ratio if area.risk_tier == ELEVATED else site.standard_ratio)
      youth_after = current checked-in YOUTH count in (area, block) on this club day + 1
      staff_here  = current checked-in STAFF count in (area, block) on this club day
      required_staff = ceil(youth_after / effective_ratio)
      check-in allowed iff youth_after <= area.capacity (ERR_AREA_CAPACITY_EXCEEDED first)
                           and required_staff <= staff_here (ERR_RATIO_VIOLATION second)
      Boundary: youth_after == staff_here * effective_ratio is allowed; +1 more is rejected.
    input_set: "RotationAssignments on the same club day, same area, same block, kind filter applied, status == CHECKED_IN"
    constants: {}
    precision: "integer ceiling division"

  - name: club_day_posture
    trigger: "recomputed on every sign-in, sign-out, rotation check-in/cancel, and cascade touching the day"
    algorithm: threshold
    formula: |
      staff_day = count of STAFF-kind RotationAssignments on this club day with status == CHECKED_IN (any block, any area)
      if present_count >= site.youth_capacity: posture = OVER_CAPACITY
      elif staff_day * site.standard_ratio < present_count: posture = RATIO_STRAINED
      else: posture = NORMAL
      Evaluation order is pinned: OVER_CAPACITY first, then RATIO_STRAINED, else NORMAL.
      Sign-in precondition: posture != OVER_CAPACITY evaluated BEFORE the new record is created.
    input_set: "The ClubDay's own AttendanceRecords (ON_SITE) and CHECKED_IN staff RotationAssignments"
    constants: {}
    precision: "integer counts; >= boundary for OVER_CAPACITY (present == capacity already blocks new sign-ins)"

  - name: behavior_points_accumulation
    trigger: "recomputed on incident adjudicate (SUSTAIN/DISMISS), on appeal resolve UPHELD, and on any read of Member"
    algorithm: decay_function
    formula: |
      window = incidents of member with adjudication_status == ADJUDICATED, suspension_status != RESCINDED,
               and incident_date in [today - 90 days, today] (inclusive both ends, by logical clock date)
      behavior_points = sum(points of incidents in window); points: LEVEL_1=1, LEVEL_2=3, LEVEL_3=8
      discipline_watch = (behavior_points >= 10)
      While discipline_watch is true, adjudicating a new incident without suspension_days > 0
      is rejected with ERR_SUSPENSION_MANDATORY.
    input_set: "Member's BehaviorIncidents with adjudication_status == ADJUDICATED and suspension_status != RESCINDED; DISMISSED and RESCINDED excluded; reports older than 90 days excluded"
    constants:
      POINTS: { LEVEL_1: 1, LEVEL_2: 3, LEVEL_3: 8 }
      WINDOW_DAYS: 90
      WATCH_THRESHOLD: 10
    precision: "integer points; >= threshold (exactly 10 triggers watch)"

  - name: scholarship_fund_accounting
    trigger: "award activate, award revoke, fund close, weekly accrual disbursement"
    algorithm: waterfall_allocation
    formula: |
      activate: reserved_cents += award.annual_cap_cents
      weekly disbursement d (see weekly_fee_assessment): reserved_cents -= d; disbursed_cents += d
      revoke: reserved_cents -= award.remaining_cap_cents
      always: available_cents = budget_cents - reserved_cents - disbursed_cents
      invariant (checked after every mutation): budget_cents == available_cents + reserved_cents + disbursed_cents
      activate precondition: available_cents >= award.annual_cap_cents
    input_set: "All ScholarshipAwards on the fund with status == ACTIVE"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and a declared role; X-User-ID header present. Entity-backed roles (SiteDirector, FrontlineStaff) additionally require X-User-ID to equal the id of a Staff row whose position matches the role (DIRECTOR/FRONTLINE) and whose status is ACTIVE.", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "The role is listed in the endpoint's roles.", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path parameters resolve to existing rows, validated left-to-right; then body FK fields (site_id, member_id, fund_id, club_day_id, area_id, route_id, new_area_id) resolve.", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: business_constraint, check: "Request body well-formed: required fields present, enum values in range, unknown fields rejected, integers positive where required, kind/member_id/staff_id consistency on RotationAssignment (kind=YOUTH requires member_id and forbids staff_id; kind=STAFF the reverse).", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all POST endpoints" }
  - { priority: 5, category: state, check: "State-machine from-state of the TARGET resource permits the transition (member APPLIED for decide; guardian ACTIVE for revoke; fund OPEN for close; award PENDING/ACTIVE; club day OPEN/CLOSED; attendance ON_SITE; assignment SCHEDULED/CHECKED_IN; ride ACTIVE; claim DRAFT/SUBMITTED; incident REPORTED/APPEALED; report DRAFT/SUBMITTED).", error_id: "per-machine: ERR_MEMBER_NOT_APPLIED, ERR_GUARDIAN_NOT_ACTIVE, ERR_FUND_NOT_OPEN, ERR_AWARD_NOT_PENDING, ERR_AWARD_NOT_ACTIVE, ERR_CLUB_DAY_NOT_OPEN, ERR_CLUB_DAY_NOT_CLOSED, ERR_ALREADY_SIGNED_OUT, ERR_ATTENDANCE_FINAL, ERR_ASSIGNMENT_NOT_CHECKABLE, ERR_ASSIGNMENT_NOT_MOVABLE, ERR_RIDE_NOT_ACTIVE, ERR_CLAIM_NOT_SUBMITTABLE, ERR_CLAIM_NOT_SUBMITTED, ERR_INCIDENT_NOT_REPORTED, ERR_INCIDENT_NOT_APPEALABLE, ERR_APPEAL_NOT_PENDING, ERR_REPORT_NOT_SUBMITTABLE, ERR_REPORT_NOT_SUBMITTED, ERR_DAY_LOCKED", http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: business_safety, check: "Youth-safety gates: pickup_name matches an ACTIVE guardian (AUTHORIZED_PICKUP); walker_ok (WALKER); staff compliance for STAFF assignment create/check-in; mandatory suspension while discipline_watch.", error_id: "ERR_PICKUP_NOT_AUTHORIZED | ERR_WALKER_NOT_PERMITTED | ERR_STAFF_NOT_COMPLIANT | ERR_SUSPENSION_MANDATORY", http_status: 422, applies_to: "sign-out, rotation create/check-in, incident adjudicate" }
  - { priority: 7, category: business_temporal, check: "Clock/window rules: club-day creation date == logical today (ERR_DAY_NOT_TODAY); sign-in only on the day whose date == logical today (ERR_DAY_NOT_TODAY); ride window end > start and explicit end_date inside window (ERR_INVALID_DATE_WINDOW).", error_id: "ERR_DAY_NOT_TODAY | ERR_INVALID_DATE_WINDOW", http_status: 409, applies_to: "club-day create, sign-in, ride create/end", note: "ERR_DAY_NOT_TODAY is 409; ERR_INVALID_DATE_WINDOW is 422" }
  - { priority: 8, category: business_referential, check: "Referenced entity state: member must be ACTIVE for sign-in, award create, ride create, YOUTH rotation create (ERR_MEMBER_NOT_ACTIVE); club day OPEN for meal-counts/rotation create (ERR_CLUB_DAY_NOT_OPEN); fund OPEN for award create/activate (ERR_FUND_NOT_OPEN); BUS sign-out requires covering ACTIVE ride (ERR_NO_RIDE_FOR_DATE).", error_id: "ERR_MEMBER_NOT_ACTIVE | ERR_CLUB_DAY_NOT_OPEN | ERR_FUND_NOT_OPEN | ERR_NO_RIDE_FOR_DATE", http_status: 409, applies_to: "sign-in, award create/activate, ride create, rotation create, meal-counts, sign-out, guardian create", note: "ERR_NO_RIDE_FOR_DATE is 422; guardian create requires a non-terminal member (ERR_MEMBER_NOT_ACTIVE for DENIED/WITHDRAWN)" }
  - { priority: 9, category: business_constraint, check: "Uniqueness/overlap/capacity: one club day per site per date (ERR_DUPLICATE_CLUB_DAY); one attendance record per member per day (ERR_DUPLICATE_ATTENDANCE); one claim/report per site per month (ERR_DUPLICATE_CLAIM_MONTH / ERR_DUPLICATE_REPORT_MONTH); posture != OVER_CAPACITY before sign-in (ERR_OVER_CAPACITY); member ride windows half-open non-overlapping (ERR_RIDE_WINDOW_OVERLAP); route seat aggregate occupancy + 1 <= seat_capacity on each existing club day in window (ERR_SEAT_CAPACITY_EXCEEDED); one non-terminal rotation assignment per member per (day, block) (ERR_ASSIGNMENT_CONFLICT); area capacity then staff ratio on youth check-in (ERR_AREA_CAPACITY_EXCEEDED then ERR_RATIO_VIOLATION); meal counts <= eligible attendance per tier (ERR_MEAL_COUNTS_EXCEED_ATTENDANCE).", error_id: "ERR_DUPLICATE_CLUB_DAY | ERR_DUPLICATE_ATTENDANCE | ERR_DUPLICATE_CLAIM_MONTH | ERR_DUPLICATE_REPORT_MONTH | ERR_OVER_CAPACITY | ERR_RIDE_WINDOW_OVERLAP | ERR_SEAT_CAPACITY_EXCEEDED | ERR_ASSIGNMENT_CONFLICT | ERR_AREA_CAPACITY_EXCEEDED | ERR_RATIO_VIOLATION | ERR_MEAL_COUNTS_EXCEED_ATTENDANCE", http_status: 409, applies_to: "create/check-in/meal-count/reconcile endpoints", note: "ERR_VALIDATION-class capacity errors use 422; duplicates/overlap/OVER_CAPACITY use 409" }
  - { priority: 10, category: business_fiscal, check: "Money gates last: sign-in requires fee_balance_cents <= site.max_arrears_cents (ERR_FEE_ARREARS_EXCEEDED, == allowed); award activation requires fund.available_cents >= annual_cap_cents (ERR_FUND_INSUFFICIENT); payment amount_cents <= fee_balance_cents (ERR_OVERPAYMENT); OCC expected versions match (ERR_STALE_VERSION evaluated with the fiscal write).", error_id: "ERR_FEE_ARREARS_EXCEEDED | ERR_FUND_INSUFFICIENT | ERR_OVERPAYMENT | ERR_STALE_VERSION", http_status: 402, applies_to: "sign-in, award activate, fee-payments", note: "ERR_FEE_ARREARS_EXCEEDED is 402; ERR_FUND_INSUFFICIENT/ERR_OVERPAYMENT 422; ERR_STALE_VERSION 412" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Site ---
  - { method: POST, path: "/sites", description: "Create a site", roles: [PlatformAdmin], code: 201, input: [name, youth_capacity, standard_ratio, elevated_ratio, base_weekly_fee_cents, registration_fee_cents, max_arrears_cents, meal_rates_cents, "fee_accrual_weekday?"], output: Site, side_effects: [] }
  - { method: GET, path: "/sites/{id}", description: "Read a site", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: [], output: Site, side_effects: [] }

  # --- Staff ---
  - { method: POST, path: "/staff", description: "Hire staff (status HIRED)", roles: [PlatformAdmin], code: 201, input: [site_id, full_name, position], output: Staff, side_effects: ["status=HIRED, compliance_status=INCOMPLETE"] }
  - { method: GET, path: "/staff/{id}", description: "Read staff", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: [], output: Staff, side_effects: [] }
  - { method: GET, path: "/sites/{id}/staff", description: "List staff of a site", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["position?", "status?", "limit?", "offset?"], output: "Staff[]", side_effects: [] }
  - { method: POST, path: "/staff/{id}/credentials", description: "Post/renew a credential; recomputes compliance; fires lapse cascade; may auto-promote HIRED->ACTIVE", roles: [PlatformAdmin], code: 200, input: [kind, expires_at], output: Staff, side_effects: ["credential expiry field updated", "compliance_status recomputed", "HIRED->ACTIVE when both credentials valid", "if LAPSED: cancel SCHEDULED/CHECKED_IN staff RotationAssignments with club_day.date >= today and recompute those days' posture", "version++"] }
  - { method: GET, path: "/staff/{id}/rotation-assignments", description: "List rotation assignments for a staff member", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["club_day_id?", "status?", "limit?", "offset?"], output: "RotationAssignment[]", side_effects: [] }

  # --- Member ---
  - { method: POST, path: "/members", description: "Submit a membership application (status APPLIED)", roles: [SiteDirector, FrontlineStaff], code: 201, input: [site_id, legal_name, date_of_birth, grade, household_size, household_income_cents, "walker_ok?"], output: Member, side_effects: ["status=APPLIED, fee_balance_cents=0, behavior_points=0, discipline_watch=false"] }
  - { method: GET, path: "/members/{id}", description: "Read a member", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: [], output: Member, side_effects: [] }
  - { method: GET, path: "/sites/{id}/members", description: "List members of a site", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["status?", "eligibility_tier?", "limit?", "offset?"], output: "Member[]", side_effects: [] }
  - { method: POST, path: "/members/{id}/decide", description: "Approve or deny an application", roles: [SiteDirector], code: 200, input: [decision], output: Member, side_effects: ["APPROVE: eligibility_tier + weekly_fee_cents computed, fee_balance_cents += registration_fee_cents, approved_at set, status ACTIVE", "DENY: status DENIED", "version++"] }
  - { method: POST, path: "/members/{id}/withdraw", description: "Withdraw a member; cascades to awards (fund release), rides, rotation assignments", roles: [SiteDirector], code: 200, input: [], output: Member, side_effects: ["status WITHDRAWN, withdrawn_at set", "PENDING awards CANCELLED; ACTIVE awards REVOKED with fund reservation release (fund.version++)", "ACTIVE rides ENDED", "future SCHEDULED rotation assignments CANCELLED", "version++"] }
  - { method: POST, path: "/members/{id}/fee-payments", description: "Post a fee payment (OCC on member version)", roles: [SiteDirector], code: 200, input: [amount_cents, expected_member_version], output: Member, side_effects: ["fee_balance_cents -= amount_cents (must be <= balance)", "increments Member.version by 1"] }

  # --- Guardian ---
  - { method: POST, path: "/guardians", description: "Add an authorized pickup guardian", roles: [SiteDirector, FrontlineStaff], code: 201, input: [member_id, full_name, relation, "phone?"], output: Guardian, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/members/{id}/guardians", description: "List guardians of a member", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["status?", "limit?", "offset?"], output: "Guardian[]", side_effects: [] }
  - { method: POST, path: "/guardians/{id}/revoke", description: "Revoke a guardian's pickup authorization", roles: [SiteDirector, FrontlineStaff], code: 200, input: [], output: Guardian, side_effects: ["status REVOKED, version++"] }

  # --- Scholarship ---
  - { method: POST, path: "/scholarship-funds", description: "Create a scholarship fund", roles: [PlatformAdmin], code: 201, input: [site_id, name, budget_cents], output: ScholarshipFund, side_effects: ["reserved=0, disbursed=0, available=budget, status OPEN"] }
  - { method: GET, path: "/scholarship-funds/{id}", description: "Read a fund", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: [], output: ScholarshipFund, side_effects: [] }
  - { method: GET, path: "/sites/{id}/scholarship-funds", description: "List funds of a site", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["status?", "limit?", "offset?"], output: "ScholarshipFund[]", side_effects: [] }
  - { method: POST, path: "/scholarship-funds/{id}/close", description: "Close a fund; PENDING awards auto-cancel", roles: [PlatformAdmin], code: 200, input: [], output: ScholarshipFund, side_effects: ["status CLOSED", "PENDING awards -> CANCELLED", "version++"] }
  - { method: GET, path: "/scholarship-funds/{id}/awards", description: "List awards on a fund", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["status?", "limit?", "offset?"], output: "ScholarshipAward[]", side_effects: [] }
  - { method: POST, path: "/scholarship-awards", description: "Create a scholarship award (PENDING)", roles: [SiteDirector], code: 201, input: [fund_id, member_id, discount_pct, weekly_cap_cents, annual_cap_cents], output: ScholarshipAward, side_effects: ["status=PENDING, disbursed=0, remaining_cap=annual_cap"] }
  - { method: GET, path: "/members/{id}/scholarship-awards", description: "List awards of a member", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["status?", "limit?", "offset?"], output: "ScholarshipAward[]", side_effects: [] }
  - { method: POST, path: "/scholarship-awards/{id}/activate", description: "Activate an award; reserves annual cap from fund (OCC on fund version)", roles: [SiteDirector], code: 200, input: [expected_fund_version], output: ScholarshipAward, side_effects: ["fund.reserved_cents += annual_cap_cents", "increments ScholarshipFund.version by 1", "status ACTIVE, version++"] }
  - { method: POST, path: "/scholarship-awards/{id}/revoke", description: "Revoke an active award; releases remaining reservation", roles: [SiteDirector], code: 200, input: [], output: ScholarshipAward, side_effects: ["fund.reserved_cents -= remaining_cap_cents; fund.version++", "status REVOKED, version++"] }

  # --- ClubDay ---
  - { method: POST, path: "/club-days", description: "Open a club day; date must equal logical today; runs open sweeps (staff compliance lapse cascade, suspension IMPOSED->ACTIVE activation and ACTIVE->SERVED completion)", roles: [SiteDirector], code: 201, input: [site_id, date], output: ClubDay, side_effects: ["status OPEN, posture NORMAL, counts zero", "open sweeps: suspension activation/serving, staff lapse cascade"] }
  - { method: GET, path: "/club-days/{id}", description: "Read a club day (posture, counts, meal_counts)", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: [], output: ClubDay, side_effects: [] }
  - { method: GET, path: "/sites/{id}/club-days", description: "List club days of a site", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["status?", "month?", "limit?", "offset?"], output: "ClubDay[]", side_effects: [] }
  - { method: POST, path: "/club-days/{id}/close", description: "Close the day: flips ON_SITE records to MISSING_SIGNOUT, finishes rotation assignments, runs weekly fee accrual when weekday matches", roles: [SiteDirector], code: 200, input: [], output: ClubDay, side_effects: ["ON_SITE -> MISSING_SIGNOUT", "SCHEDULED assignments -> CANCELLED, CHECKED_IN -> COMPLETED", "weekly accrual if ISO weekday(date) == site.fee_accrual_weekday", "status CLOSED, version++"] }
  - { method: POST, path: "/club-days/{id}/reconcile", description: "Reconcile a closed day after validating meal counts against final SIGNED_OUT attendance per tier", roles: [SiteDirector], code: 200, input: [], output: ClubDay, side_effects: ["status RECONCILED, version++"] }
  - { method: POST, path: "/club-days/{id}/meal-counts", description: "Upsert meal counts for one meal type; validated against same-day attendance per tier; forbidden once RECONCILED", roles: [SiteDirector, FrontlineStaff], code: 200, input: [meal_type, free_count, reduced_count, paid_count], output: ClubDay, side_effects: ["meal_counts[meal_type] replaced", "version++"] }

  # --- Attendance ---
  - { method: POST, path: "/attendance-records", description: "Sign a member in to a club day", roles: [SiteDirector, FrontlineStaff], code: 201, input: [club_day_id, member_id], output: AttendanceRecord, side_effects: ["status ON_SITE, sign_in_at=now", "club_day.present_count += 1; posture recomputed; club_day.version++"] }
  - { method: POST, path: "/attendance-records/{id}/sign-out", description: "Sign out with authorization check per sign_out_type", roles: [SiteDirector, FrontlineStaff], code: 200, input: [sign_out_type, "pickup_name?"], output: AttendanceRecord, side_effects: ["status SIGNED_OUT, sign_out_at=now", "club_day.present_count -= 1, signed_out_count += 1; posture recomputed; both versions++"] }
  - { method: GET, path: "/club-days/{id}/attendance-records", description: "List attendance for a club day", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["status?", "limit?", "offset?"], output: "AttendanceRecord[]", side_effects: [] }
  - { method: GET, path: "/members/{id}/attendance-records", description: "List attendance for a member", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["status?", "limit?", "offset?"], output: "AttendanceRecord[]", side_effects: [] }

  # --- Program areas & rotation ---
  - { method: POST, path: "/program-areas", description: "Create a program area", roles: [PlatformAdmin], code: 201, input: [site_id, name, capacity, "risk_tier?", "ratio_override?"], output: ProgramArea, side_effects: [] }
  - { method: GET, path: "/program-areas/{id}", description: "Read an area", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: [], output: ProgramArea, side_effects: [] }
  - { method: GET, path: "/sites/{id}/program-areas", description: "List areas of a site", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["limit?", "offset?"], output: "ProgramArea[]", side_effects: [] }
  - { method: GET, path: "/program-areas/{id}/rotation-assignments", description: "List rotation assignments in an area", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["club_day_id?", "block?", "status?", "limit?", "offset?"], output: "RotationAssignment[]", side_effects: [] }
  - { method: POST, path: "/rotation-assignments", description: "Schedule a youth or staff rotation assignment for a block", roles: [SiteDirector, FrontlineStaff], code: 201, input: [club_day_id, area_id, block, kind, "member_id?", "staff_id?"], output: RotationAssignment, side_effects: ["status SCHEDULED"] }
  - { method: POST, path: "/rotation-assignments/{id}/check-in", description: "Check in an assignment; enforces area capacity then staff-to-youth ratio for YOUTH, compliance for STAFF", roles: [SiteDirector, FrontlineStaff], code: 200, input: [], output: RotationAssignment, side_effects: ["status CHECKED_IN", "club_day posture recomputed; both versions++"] }
  - { method: POST, path: "/rotation-assignments/{id}/move", description: "Move a checked-in assignment to another area (old -> MOVED, returns CHECKED_IN successor)", roles: [SiteDirector, FrontlineStaff], code: 200, input: [new_area_id], output: RotationAssignment, side_effects: ["old record MOVED; successor created CHECKED_IN in new_area_id, same block", "club_day posture recomputed; versions++"] }
  - { method: GET, path: "/club-days/{id}/rotation-assignments", description: "List rotation assignments for a club day", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["area_id?", "block?", "kind?", "status?", "limit?", "offset?"], output: "RotationAssignment[]", side_effects: [] }
  - { method: GET, path: "/members/{id}/rotation-assignments", description: "List rotation assignments for a member", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["status?", "limit?", "offset?"], output: "RotationAssignment[]", side_effects: [] }

  # --- Transport ---
  - { method: POST, path: "/transport-routes", description: "Create a transport route", roles: [PlatformAdmin], code: 201, input: [site_id, route_name, school_name, seat_capacity], output: TransportRoute, side_effects: [] }
  - { method: GET, path: "/transport-routes/{id}", description: "Read a route", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: [], output: TransportRoute, side_effects: [] }
  - { method: GET, path: "/sites/{id}/transport-routes", description: "List routes of a site", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["limit?", "offset?"], output: "TransportRoute[]", side_effects: [] }
  - { method: GET, path: "/transport-routes/{id}/ride-assignments", description: "List ride assignments on a route", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["status?", "limit?", "offset?"], output: "RideAssignment[]", side_effects: [] }
  - { method: POST, path: "/ride-assignments", description: "Assign a member to a route over a half-open date window; overlap + aggregate seat checks", roles: [SiteDirector], code: 201, input: [route_id, member_id, effective_start_date, "effective_end_date?"], output: RideAssignment, side_effects: ["status ACTIVE"] }
  - { method: POST, path: "/ride-assignments/{id}/end", description: "End a ride assignment early", roles: [SiteDirector], code: 200, input: [end_date], output: RideAssignment, side_effects: ["effective_end_date = end_date, status ENDED, version++"] }
  - { method: GET, path: "/members/{id}/ride-assignments", description: "List ride assignments of a member", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["status?", "limit?", "offset?"], output: "RideAssignment[]", side_effects: [] }

  # --- Meal claims ---
  - { method: POST, path: "/meal-claims", description: "Create a monthly reimbursement claim (DRAFT) with provisional total and pinned rate snapshot", roles: [SiteDirector], code: 201, input: [site_id, claim_month], output: MealClaim, side_effects: ["rate_snapshot pinned", "provisional_total_cents computed over CLOSED+RECONCILED days", "status DRAFT"] }
  - { method: GET, path: "/sites/{id}/meal-claims", description: "List claims of a site", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["status?", "limit?", "offset?"], output: "MealClaim[]", side_effects: [] }
  - { method: POST, path: "/meal-claims/{id}/submit", description: "Submit claim; computes final total over RECONCILED days only; records submitter", roles: [SiteDirector], code: 200, input: [], output: MealClaim, side_effects: ["final_total_cents computed (FINAL variant)", "submitted_by_user_id set", "status SUBMITTED, version++"] }
  - { method: POST, path: "/meal-claims/{id}/approve", description: "State agency approves claim; approver must differ from submitter", roles: [StateAgencyReviewer], code: 200, input: [], output: MealClaim, side_effects: ["approved_by_user_id set", "status APPROVED, version++"] }

  # --- Behavior ---
  - { method: POST, path: "/behavior-incidents", description: "Report a behavior incident", roles: [SiteDirector, FrontlineStaff], code: 201, input: [member_id, incident_date, category, "description?"], output: BehaviorIncident, side_effects: ["points computed from category", "adjudication_status REPORTED, suspension_status NONE"] }
  - { method: GET, path: "/members/{id}/behavior-incidents", description: "List incidents of a member", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["limit?", "offset?"], output: "BehaviorIncident[]", side_effects: [] }
  - { method: POST, path: "/behavior-incidents/{id}/adjudicate", description: "Adjudicate: SUSTAIN (optionally with suspension) or DISMISS; suspension may activate member suspension immediately", roles: [SiteDirector], code: 200, input: [outcome, "suspension_days?", "suspension_start_date?"], output: BehaviorIncident, side_effects: ["adjudication_status ADJUDICATED or DISMISSED", "suspension: NONE->IMPOSED (future start) or NONE->ACTIVE (start <= today; member -> SUSPENDED)", "member.behavior_points + discipline_watch recomputed", "adjudicated_by_user_id set; versions++"] }
  - { method: POST, path: "/behavior-incidents/{id}/appeal", description: "Appeal an active suspension (member stays suspended)", roles: [SiteDirector, FrontlineStaff], code: 200, input: [], output: BehaviorIncident, side_effects: ["suspension_status ACTIVE -> APPEALED, version++"] }
  - { method: POST, path: "/behavior-incidents/{id}/resolve-appeal", description: "Resolve appeal; resolver must differ from adjudicator; UPHELD rescinds suspension and un-counts points", roles: [SiteDirector], code: 200, input: [decision], output: BehaviorIncident, side_effects: ["DENIED: APPEALED -> ACTIVE", "UPHELD: APPEALED -> RESCINDED, points excluded, member reinstated if no other ACTIVE suspension", "versions++"] }

  # --- Funder reports ---
  - { method: POST, path: "/funder-reports", description: "Create a monthly funder report (DRAFT) with all outcome metrics computed", roles: [SiteDirector], code: 201, input: [site_id, report_month, funder_type], output: FunderReport, side_effects: ["metrics computed per attendance_rate (both bases) and meal/incident aggregates", "status DRAFT"] }
  - { method: GET, path: "/sites/{id}/funder-reports", description: "List funder reports of a site", roles: [PlatformAdmin, SiteDirector, FrontlineStaff, StateAgencyReviewer, FunderContact], code: 200, input: ["status?", "limit?", "offset?"], output: "FunderReport[]", side_effects: [] }
  - { method: POST, path: "/funder-reports/{id}/submit", description: "Submit report to funder; records submitter", roles: [SiteDirector], code: 200, input: [], output: FunderReport, side_effects: ["submitted_by_user_id set", "status SUBMITTED, version++"] }
  - { method: POST, path: "/funder-reports/{id}/accept", description: "Funder accepts report; acceptor must differ from submitter", roles: [FunderContact], code: 200, input: [], output: FunderReport, side_effects: ["status ACCEPTED, version++"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z (never wall-clock). All date-sensitive rules (club-day creation, sign-in, sweeps, credential expiry, rolling windows, seasonal multiplier) read this clock.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced (monotonic not required; tests may set any instant)"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown role or user-id headers, or entity-backed role id does not resolve to a matching ACTIVE Staff row" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Authenticated role not in the endpoint's roles list" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK does not resolve (left-to-right)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, unknown field, bad enum, non-positive integer, or kind/member_id/staff_id inconsistency" }
  - { id: ERR_MEMBER_NOT_APPLIED, http: 409, condition: "decide on a member not in APPLIED" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Operation requires member status ACTIVE (or non-terminal for guardians); member is SUSPENDED/WITHDRAWN/DENIED/APPLIED as applicable" }
  - { id: ERR_GUARDIAN_NOT_ACTIVE, http: 409, condition: "revoke on a guardian not ACTIVE" }
  - { id: ERR_FUND_NOT_OPEN, http: 409, condition: "Fund CLOSED: close again, or award create/activate against it" }
  - { id: ERR_AWARD_NOT_PENDING, http: 409, condition: "activate on an award not PENDING" }
  - { id: ERR_AWARD_NOT_ACTIVE, http: 409, condition: "revoke on an award not ACTIVE" }
  - { id: ERR_CLUB_DAY_NOT_OPEN, http: 409, condition: "Operation requires club day OPEN (close, sign-in, meal-counts, rotation create/check-in/move)" }
  - { id: ERR_CLUB_DAY_NOT_CLOSED, http: 409, condition: "reconcile on a day not CLOSED" }
  - { id: ERR_DAY_LOCKED, http: 409, condition: "meal-counts on a RECONCILED day" }
  - { id: ERR_DAY_NOT_TODAY, http: 409, condition: "club-day creation date != logical today, or sign-in on a day whose date != logical today" }
  - { id: ERR_DUPLICATE_CLUB_DAY, http: 409, condition: "A club day already exists for this site and date" }
  - { id: ERR_DUPLICATE_ATTENDANCE, http: 409, condition: "Member already has an attendance record for this club day" }
  - { id: ERR_ALREADY_SIGNED_OUT, http: 409, condition: "sign-out on a SIGNED_OUT record" }
  - { id: ERR_ATTENDANCE_FINAL, http: 409, condition: "sign-out on a MISSING_SIGNOUT record" }
  - { id: ERR_PICKUP_NOT_AUTHORIZED, http: 422, condition: "AUTHORIZED_PICKUP sign-out with pickup_name not matching an ACTIVE guardian full_name (case-sensitive)" }
  - { id: ERR_WALKER_NOT_PERMITTED, http: 422, condition: "WALKER sign-out while member.walker_ok is false" }
  - { id: ERR_NO_RIDE_FOR_DATE, http: 422, condition: "BUS sign-out without an ACTIVE ride assignment covering the club day date" }
  - { id: ERR_FEE_ARREARS_EXCEEDED, http: 402, condition: "sign-in while fee_balance_cents > site.max_arrears_cents (equality allowed)" }
  - { id: ERR_OVER_CAPACITY, http: 409, condition: "sign-in while club day posture is OVER_CAPACITY (present_count >= youth_capacity)" }
  - { id: ERR_AREA_CAPACITY_EXCEEDED, http: 422, condition: "youth check-in/move would exceed area.capacity for the block (checked before ratio)" }
  - { id: ERR_RATIO_VIOLATION, http: 422, condition: "youth check-in/move would make required_staff = ceil(youth/effective_ratio) exceed checked-in staff for the block" }
  - { id: ERR_STAFF_NOT_COMPLIANT, http: 422, condition: "STAFF assignment create/check-in while staff not ACTIVE or compliance_status in {INCOMPLETE, LAPSED}" }
  - { id: ERR_ASSIGNMENT_CONFLICT, http: 409, condition: "Member already has a SCHEDULED/CHECKED_IN assignment for the same club day and block" }
  - { id: ERR_ASSIGNMENT_NOT_CHECKABLE, http: 409, condition: "check-in on an assignment not SCHEDULED" }
  - { id: ERR_ASSIGNMENT_NOT_MOVABLE, http: 409, condition: "move on an assignment not CHECKED_IN" }
  - { id: ERR_SEAT_CAPACITY_EXCEEDED, http: 422, condition: "New ride window would push aggregate occupancy above seat_capacity on an existing club day in the window" }
  - { id: ERR_RIDE_WINDOW_OVERLAP, http: 409, condition: "New ride window overlaps another ACTIVE ride of the same member (half-open; adjacency allowed)" }
  - { id: ERR_INVALID_DATE_WINDOW, http: 422, condition: "effective_end_date <= effective_start_date, or end_date outside the ride window" }
  - { id: ERR_FUND_INSUFFICIENT, http: 422, condition: "award activation with annual_cap_cents > fund.available_cents" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "fee payment amount_cents > fee_balance_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent's current version" }
  - { id: ERR_MEAL_COUNTS_EXCEED_ATTENDANCE, http: 422, condition: "Meal count for a tier exceeds same-day eligible attendance of that tier (entry: ON_SITE+SIGNED_OUT; reconcile: SIGNED_OUT)" }
  - { id: ERR_CLAIM_NOT_SUBMITTABLE, http: 409, condition: "submit on a claim not in DRAFT" }
  - { id: ERR_CLAIM_NO_RECONCILED_DAYS, http: 409, condition: "submit with zero RECONCILED club days in claim_month" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "approve on a claim not in SUBMITTED" }
  - { id: ERR_DUPLICATE_CLAIM_MONTH, http: 409, condition: "A meal claim already exists for this site and month" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver/resolver/acceptor X-User-ID equals the submitter's/adjudicator's recorded user id" }
  - { id: ERR_INCIDENT_NOT_REPORTED, http: 409, condition: "adjudicate on an incident not in REPORTED" }
  - { id: ERR_INCIDENT_NOT_APPEALABLE, http: 409, condition: "appeal on an incident whose suspension_status is not ACTIVE" }
  - { id: ERR_APPEAL_NOT_PENDING, http: 409, condition: "resolve-appeal on an incident whose suspension_status is not APPEALED" }
  - { id: ERR_SUSPENSION_MANDATORY, http: 422, condition: "adjudicate without suspension while member.discipline_watch is true (points >= 10)" }
  - { id: ERR_REPORT_NOT_SUBMITTABLE, http: 409, condition: "submit on a report not in DRAFT" }
  - { id: ERR_REPORT_NOT_SUBMITTED, http: 409, condition: "accept on a report not in SUBMITTED" }
  - { id: ERR_DUPLICATE_REPORT_MONTH, http: 409, condition: "A funder report already exists for this site and month" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Org-level administrator: sites, funds, areas, routes, staff records and credentials, logical clock"
    identity: opaque
    exclusive_operations: ["POST /sites", "POST /staff", "POST /staff/{id}/credentials", "POST /scholarship-funds", "POST /scholarship-funds/{id}/close", "POST /program-areas", "POST /transport-routes", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: SiteDirector
    description: "Club site director: enrollment decisions, fees, awards, club-day lifecycle, claims, incidents, reports, rides"
    identity: "entity_backed:Staff"
    exclusive_operations: ["POST /members/{id}/decide", "POST /members/{id}/withdraw", "POST /members/{id}/fee-payments", "POST /scholarship-awards", "POST /scholarship-awards/{id}/activate", "POST /scholarship-awards/{id}/revoke", "POST /club-days", "POST /club-days/{id}/close", "POST /club-days/{id}/reconcile", "POST /ride-assignments", "POST /ride-assignments/{id}/end", "POST /meal-claims", "POST /meal-claims/{id}/submit", "POST /behavior-incidents/{id}/adjudicate", "POST /behavior-incidents/{id}/resolve-appeal", "POST /funder-reports", "POST /funder-reports/{id}/submit"]
    shared_operations: ["POST /members", "POST /guardians", "POST /guardians/{id}/revoke", "POST /club-days/{id}/meal-counts", "POST /attendance-records", "POST /attendance-records/{id}/sign-out", "POST /rotation-assignments", "POST /rotation-assignments/{id}/check-in", "POST /rotation-assignments/{id}/move", "POST /behavior-incidents", "POST /behavior-incidents/{id}/appeal", "all GET endpoints"]
  - name: FrontlineStaff
    description: "Front-line youth staff: applications intake, guardians, attendance, rotation, meal counts, incident reports and appeals"
    identity: "entity_backed:Staff"
    exclusive_operations: []
    shared_operations: ["POST /members", "POST /guardians", "POST /guardians/{id}/revoke", "POST /club-days/{id}/meal-counts", "POST /attendance-records", "POST /attendance-records/{id}/sign-out", "POST /rotation-assignments", "POST /rotation-assignments/{id}/check-in", "POST /rotation-assignments/{id}/move", "POST /behavior-incidents", "POST /behavior-incidents/{id}/appeal", "all GET endpoints"]
  - name: StateAgencyReviewer
    description: "External state meal-program reviewer; approves submitted meal claims (must differ from submitter)"
    identity: opaque
    exclusive_operations: ["POST /meal-claims/{id}/approve"]
    shared_operations: ["all GET endpoints"]
  - name: FunderContact
    description: "External funder representative; accepts submitted funder reports (must differ from submitter)"
    identity: opaque
    exclusive_operations: ["POST /funder-reports/{id}/accept"]
    shared_operations: ["all GET endpoints"]
