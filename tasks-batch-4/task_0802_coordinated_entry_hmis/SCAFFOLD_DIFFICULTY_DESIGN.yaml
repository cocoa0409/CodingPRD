# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Coordinated Entry & Homeless Services (HMIS) — 9 rules x 2 instances = 18
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dv_assessment_provisional_vs_verified_tier
        grounds:
          - calculations.vulnerability_score
          - calculations.acuity_tier
          - entities.Assessment.fields.provisional_score
          - entities.Assessment.fields.verified_score
          - entities.Client.fields.acuity_tier
          - state_machines.Assessment.DRAFT_to_COMPLETED
        distinguishing_aspect: "On the SAME assessment (self_report_points=7, verification_delta=+1), the provisional variant yields score 7 / MODERATE tier while the verified variant yields score 8 / HIGH tier — dual-variant logic on the Client/Assessment domain."
        test_recipe:
          setup:
            - "One INTAKE client; one DRAFT assessment self_report_points=7, verification_delta=1."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada Vuln", dob: "1990-01-01" }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
            - call: "POST /assessments"
              payload: { client_id: "${cli}", self_report_points: 7, verification_delta: 1 }
              as: IntakeSpecialist
              captures: { asm: $.data.id, prov: $.data.provisional_score }
          trigger:
            - call: "POST /assessments/${asm}/complete"
              payload: {}
              as: IntakeSpecialist
              captures: { ver: $.data.verified_score }
          assert:
            - "Assessment.${asm}.provisional_score == 7"
            - "Assessment.${asm}.verified_score == 8"
            - "Assessment.${asm}.recommended_track == PSH"
            - "Client.${cli}.vulnerability_score == 8"
            - "Client.${cli}.acuity_tier == HIGH"

      - name: dv_apr_bed_night_vs_duration_los
        grounds:
          - calculations.length_of_stay
          - entities.ExitRecord.fields.bed_nights
          - state_machines.BedReservation.CHECKED_IN_to_CHECKED_OUT
        distinguishing_aspect: "For a stay entry 2026-03-05 / actual exit 2026-03-10 the BED_NIGHT variant (exit excluded) records 5 while the ENROLLMENT_DURATION variant would record 6 — dual-variant on the ExitRecord domain, distinct from the assessment-domain instance."
        test_recipe:
          setup:
            - "Shelter with 1 bed; client with ACTIVE consent checked in on 2026-03-05, checked out on 2026-03-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: HMISAdmin
            - call: "POST /clients"
              payload: { full_name: "Lou Stay", dob: "1988-02-02" }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
            - call: "POST /consents"
              payload: { client_id: "${cli}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { con: $.data.id }
            - call: "POST /consents/${con}/activate"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /shelters"
              payload: { name: "Elm ES", project_type: "ES" }
              as: ShelterManager
              captures: { sh: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B1" }
              as: ShelterManager
              captures: { bed: $.data.id }
            - call: "GET /shelters/${sh}"
              payload: {}
              as: ShelterManager
              captures: { shv: $.data.version }
            - call: "POST /bed-reservations"
              payload: { client_id: "${cli}", shelter_id: "${sh}", entry_date: "2026-03-05", expected_exit_date: "2026-03-20", expected_shelter_version: "${shv}" }
              as: ShelterManager
              captures: { res: $.data.id }
            - call: "POST /bed-reservations/${res}/check-in"
              payload: {}
              as: ShelterManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: HMISAdmin
            - call: "POST /bed-reservations/${res}/check-out"
              payload: {}
              as: ShelterManager
          trigger:
            - call: "POST /exit-records"
              payload: { client_id: "${cli}", reservation_id: "${res}", destination: "PERMANENT_HOUSING" }
              as: ShelterManager
              captures: { ex: $.data.id }
          assert:
            - "ExitRecord.${ex}.bed_nights == 5"
            - "ExitRecord.${ex}.outcome == POSITIVE"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: comb_prioritization_rank_tiered
        grounds:
          - calculations.prioritization_rank
          - entities.PrioritizationEntry.fields.rank_score
          - entities.Client.fields.chronic_homeless
          - entities.Client.fields.months_homeless
        distinguishing_aspect: "Mode (a): rank_score = tier_weight(1000) + chronic_bonus(300) + time_pts(200 for months>=12) + household_factor(min(2,5)*20=40) = 1540 — a >=3-input non-linear formula with tiered branches and a capped min."
        test_recipe:
          setup:
            - "One client: chronic, months_homeless=12, household_size=2, verified VI-SPDAT 10 (HIGH), ACTIVE consent; placed in pool."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ravi Rank", dob: "1979-03-03", household_size: 2, months_homeless: 12, chronic_homeless: true }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
            - call: "POST /assessments"
              payload: { client_id: "${cli}", self_report_points: 10 }
              as: IntakeSpecialist
              captures: { asm: $.data.id }
            - call: "POST /assessments/${asm}/complete"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /consents"
              payload: { client_id: "${cli}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { con: $.data.id }
            - call: "POST /consents/${con}/activate"
              payload: {}
              as: IntakeSpecialist
          trigger:
            - call: "POST /prioritization-entries"
              payload: { client_id: "${cli}" }
              as: HMISAdmin
              captures: { pe: $.data.id }
          assert:
            - "PrioritizationEntry.${pe}.rank_score == 1540"
            - "Client.${cli}.acuity_tier == HIGH"

      - name: comb_bed_availability_promotion_order
        grounds:
          - calculations.bed_availability
          - calculations.waitlist_priority
          - state_machines.BedReservation.RESERVED_to_CANCELLED
          - state_machines.WaitlistEntry.WAITING_to_PROMOTED
          - entities.Shelter.fields.available_beds
        distinguishing_aspect: "Mode (c): cancelling the only reservation frees capacity that promotion immediately re-consumes; available_beds is recomputed BEFORE promotion (fresh 1) then re-decremented to 0 — the pinned evaluation order is observable because a stale-order read would skip promotion."
        test_recipe:
          setup:
            - "Shelter with 1 bed; clock 2026-03-07; client A holds reservation [03-05,03-20); client B waitlisted [03-06,03-19)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-07T00:00:00Z" }
              as: HMISAdmin
            - call: "POST /clients"
              payload: { full_name: "Amy A", dob: "1991-04-04" }
              as: IntakeSpecialist
              captures: { ca: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Ben B", dob: "1992-05-05" }
              as: IntakeSpecialist
              captures: { cb: $.data.id }
            - call: "POST /shelters"
              payload: { name: "Oak ES", project_type: "ES" }
              as: ShelterManager
              captures: { sh: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B1" }
              as: ShelterManager
              captures: { bed: $.data.id }
            - call: "GET /shelters/${sh}"
              payload: {}
              as: ShelterManager
              captures: { shv: $.data.version }
            - call: "POST /bed-reservations"
              payload: { client_id: "${ca}", shelter_id: "${sh}", entry_date: "2026-03-05", expected_exit_date: "2026-03-20", expected_shelter_version: "${shv}" }
              as: ShelterManager
              captures: { resa: $.data.id }
            - call: "POST /waitlist-entries"
              payload: { shelter_id: "${sh}", client_id: "${cb}", entry_date: "2026-03-06", expected_exit_date: "2026-03-19" }
              as: ShelterManager
              captures: { wlb: $.data.id }
          trigger:
            - call: "POST /bed-reservations/${resa}/cancel"
              payload: {}
              as: ShelterManager
          assert:
            - "WaitlistEntry.${wlb}.status == PROMOTED"
            - "WaitlistEntry.${wlb}.promoted_reservation_id != null"
            - "Shelter.${sh}.available_beds == 0"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_prioritization_requeue_cycle
        grounds:
          - state_machines.PrioritizationEntry.ACTIVE_to_MATCHED
          - state_machines.PrioritizationEntry.MATCHED_to_ACTIVE
          - state_machines.Referral.PENDING_to_DECLINED
          - entities.PrioritizationEntry.fields.matched_referral_id
        distinguishing_aspect: "PrioritizationEntry cycles MATCHED -> ACTIVE (on decline) -> MATCHED (on re-referral), a genuine A->B->A loop on the PrioritizationEntry entity."
        test_recipe:
          setup:
            - "Client active with completed assessment and ACTIVE consent; pool entry ACTIVE; navigator; referral #1 minted (pool MATCHED)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Cyc Lee", dob: "1985-06-06" }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
            - call: "POST /assessments"
              payload: { client_id: "${cli}", self_report_points: 9 }
              as: IntakeSpecialist
              captures: { asm: $.data.id }
            - call: "POST /assessments/${asm}/complete"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /consents"
              payload: { client_id: "${cli}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { con: $.data.id }
            - call: "POST /consents/${con}/activate"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /prioritization-entries"
              payload: { client_id: "${cli}" }
              as: HMISAdmin
              captures: { pe: $.data.id }
            - call: "POST /housing-navigators"
              payload: { name: "Nav One", max_caseload: 3 }
              as: HMISAdmin
              captures: { nav: $.data.id }
            - call: "POST /referrals"
              payload: { client_id: "${cli}", prioritization_entry_id: "${pe}", navigator_id: "${nav}", psh_project_name: "Maple PSH" }
              as: HousingNavigator
              as_user_id: "${nav}"
              captures: { ref1: $.data.id }
          trigger:
            - call: "POST /referrals/${ref1}/decline"
              payload: {}
              as: HousingNavigator
              as_user_id: "${nav}"
            - call: "POST /referrals"
              payload: { client_id: "${cli}", prioritization_entry_id: "${pe}", navigator_id: "${nav}", psh_project_name: "Maple PSH" }
              as: HousingNavigator
              as_user_id: "${nav}"
              captures: { ref2: $.data.id }
          assert:
            - "Referral.${ref1}.status == DECLINED"
            - "PrioritizationEntry.${pe}.status == MATCHED"
            - "PrioritizationEntry.${pe}.matched_referral_id == ${ref2}"

      - name: nlsm_referral_branching_accept_vs_decline
        grounds:
          - state_machines.Referral.PENDING_to_ACCEPTED
          - state_machines.Referral.PENDING_to_DECLINED
          - entities.HousingNavigator.fields.current_caseload
        distinguishing_aspect: "From the same PENDING source the Referral entity forks: ACCEPT increments navigator.current_caseload and leaves the pool MATCHED, whereas DECLINE re-queues the pool to ACTIVE and leaves caseload unchanged — divergent side-effect sets (branching)."
        test_recipe:
          setup:
            - "Two active-with-assessment clients each with ACTIVE consent and a pool entry; one navigator (max 2); referral X (client A) and referral Y (client B) both PENDING."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Xen A", dob: "1980-07-07" }
              as: IntakeSpecialist
              captures: { ca: $.data.id }
            - call: "POST /assessments"
              payload: { client_id: "${ca}", self_report_points: 9 }
              as: IntakeSpecialist
              captures: { aa: $.data.id }
            - call: "POST /assessments/${aa}/complete"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /consents"
              payload: { client_id: "${ca}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { cona: $.data.id }
            - call: "POST /consents/${cona}/activate"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /prioritization-entries"
              payload: { client_id: "${ca}" }
              as: HMISAdmin
              captures: { pea: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Yon B", dob: "1981-08-08" }
              as: IntakeSpecialist
              captures: { cb: $.data.id }
            - call: "POST /assessments"
              payload: { client_id: "${cb}", self_report_points: 9 }
              as: IntakeSpecialist
              captures: { ab: $.data.id }
            - call: "POST /assessments/${ab}/complete"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /consents"
              payload: { client_id: "${cb}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { conb: $.data.id }
            - call: "POST /consents/${conb}/activate"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /prioritization-entries"
              payload: { client_id: "${cb}" }
              as: HMISAdmin
              captures: { peb: $.data.id }
            - call: "POST /housing-navigators"
              payload: { name: "Nav Two", max_caseload: 2 }
              as: HMISAdmin
              captures: { nav: $.data.id }
            - call: "POST /referrals"
              payload: { client_id: "${ca}", prioritization_entry_id: "${pea}", navigator_id: "${nav}", psh_project_name: "Maple PSH" }
              as: HousingNavigator
              as_user_id: "${nav}"
              captures: { refx: $.data.id }
            - call: "POST /referrals"
              payload: { client_id: "${cb}", prioritization_entry_id: "${peb}", navigator_id: "${nav}", psh_project_name: "Maple PSH" }
              as: HousingNavigator
              as_user_id: "${nav}"
              captures: { refy: $.data.id }
          trigger:
            - call: "POST /referrals/${refx}/accept"
              payload: {}
              as: HousingNavigator
              as_user_id: "${nav}"
            - call: "POST /referrals/${refy}/decline"
              payload: {}
              as: HousingNavigator
              as_user_id: "${nav}"
          assert:
            - "Referral.${refx}.status == ACCEPTED"
            - "PrioritizationEntry.${pea}.status == MATCHED"
            - "Referral.${refy}.status == DECLINED"
            - "PrioritizationEntry.${peb}.status == ACTIVE"
            - "HousingNavigator.${nav}.current_caseload == 1"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: casc_merge_cancel_free_promote_depth3
        grounds:
          - state_machines.Client.ACTIVE_to_MERGED
          - state_machines.BedReservation.CHECKED_IN_to_CANCELLED
          - state_machines.WaitlistEntry.WAITING_to_PROMOTED
          - entities.Bed.fields.current_reservation_id
          - entities.WaitlistEntry.fields.promoted_reservation_id
        distinguishing_aspect: "Merge (A) -> duplicate's CHECKED_IN reservation CANCELLED (L1) -> Bed.current_reservation_id cleared / capacity freed (L2) -> top waitlist entry PROMOTED with a minted reservation (L3): a depth-3 transitive cascade triggered by the merge transition."
        test_recipe:
          setup:
            - "Clock 2026-03-07. Master client (INTAKE). Duplicate client ACTIVE (assessment) with ACTIVE consent, CHECKED_IN in the shelter's only bed [03-05,03-20). Client C waitlisted [03-06,03-19)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-07T00:00:00Z" }
              as: HMISAdmin
            - call: "POST /clients"
              payload: { full_name: "Master M", dob: "1970-01-01" }
              as: IntakeSpecialist
              captures: { master: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Dupe D", dob: "1970-01-01", ssn_last4: "1234" }
              as: IntakeSpecialist
              captures: { dup: $.data.id }
            - call: "POST /assessments"
              payload: { client_id: "${dup}", self_report_points: 6 }
              as: IntakeSpecialist
              captures: { asm: $.data.id }
            - call: "POST /assessments/${asm}/complete"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /consents"
              payload: { client_id: "${dup}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { con: $.data.id }
            - call: "POST /consents/${con}/activate"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /clients"
              payload: { full_name: "Cee C", dob: "1993-09-09" }
              as: IntakeSpecialist
              captures: { cc: $.data.id }
            - call: "POST /shelters"
              payload: { name: "Pine ES", project_type: "ES" }
              as: ShelterManager
              captures: { sh: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B1" }
              as: ShelterManager
              captures: { bed: $.data.id }
            - call: "GET /shelters/${sh}"
              payload: {}
              as: ShelterManager
              captures: { shv: $.data.version }
            - call: "POST /bed-reservations"
              payload: { client_id: "${dup}", shelter_id: "${sh}", entry_date: "2026-03-05", expected_exit_date: "2026-03-20", expected_shelter_version: "${shv}" }
              as: ShelterManager
              captures: { res: $.data.id }
            - call: "POST /bed-reservations/${res}/check-in"
              payload: {}
              as: ShelterManager
            - call: "POST /waitlist-entries"
              payload: { shelter_id: "${sh}", client_id: "${cc}", entry_date: "2026-03-06", expected_exit_date: "2026-03-19" }
              as: ShelterManager
              captures: { wlc: $.data.id }
          trigger:
            - call: "POST /clients/${master}/merge"
              payload: { duplicate_client_id: "${dup}" }
              as: HMISAdmin
          assert:
            - "Client.${dup}.status == MERGED"
            - "Client.${dup}.master_client_id == ${master}"
            - "BedReservation.${res}.status == CANCELLED"
            - "WaitlistEntry.${wlc}.status == PROMOTED"
            - "WaitlistEntry.${wlc}.promoted_reservation_id != null"

      - name: casc_enroll_house_client_depth2
        grounds:
          - state_machines.Referral.ACCEPTED_to_ENROLLED
          - state_machines.PrioritizationEntry.MATCHED_to_HOUSED
          - state_machines.Client.ACTIVE_to_HOUSED
          - entities.HousingNavigator.fields.current_caseload
        distinguishing_aspect: "Enroll (A) -> PrioritizationEntry MATCHED->HOUSED (L1) -> Client ACTIVE->HOUSED (L2): a depth-2 cascade originating from the enroll transition, a different trigger and propagation path than the merge cascade."
        test_recipe:
          setup:
            - "Client active with assessment + ACTIVE consent; pool entry; navigator (max 2); referral ACCEPTED."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Hank H", dob: "1975-10-10" }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
            - call: "POST /assessments"
              payload: { client_id: "${cli}", self_report_points: 12 }
              as: IntakeSpecialist
              captures: { asm: $.data.id }
            - call: "POST /assessments/${asm}/complete"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /consents"
              payload: { client_id: "${cli}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { con: $.data.id }
            - call: "POST /consents/${con}/activate"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /prioritization-entries"
              payload: { client_id: "${cli}" }
              as: HMISAdmin
              captures: { pe: $.data.id }
            - call: "POST /housing-navigators"
              payload: { name: "Nav Three", max_caseload: 2 }
              as: HMISAdmin
              captures: { nav: $.data.id }
            - call: "POST /referrals"
              payload: { client_id: "${cli}", prioritization_entry_id: "${pe}", navigator_id: "${nav}", psh_project_name: "Maple PSH" }
              as: HousingNavigator
              as_user_id: "${nav}"
              captures: { ref: $.data.id }
            - call: "POST /referrals/${ref}/accept"
              payload: {}
              as: HousingNavigator
              as_user_id: "${nav}"
          trigger:
            - call: "POST /referrals/${ref}/enroll"
              payload: {}
              as: HousingNavigator
              as_user_id: "${nav}"
          assert:
            - "Referral.${ref}.status == ENROLLED"
            - "PrioritizationEntry.${pe}.status == HOUSED"
            - "Client.${cli}.status == HOUSED"
            - "HousingNavigator.${nav}.current_caseload == 0"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pconf_client_doublebook_over_capacity
        grounds:
          - validations[priority=10]
          - validations[priority=14]
          - errors[ERR_CLIENT_DOUBLE_BOOKED]
          - errors[ERR_SHELTER_AT_CAPACITY]
        distinguishing_aspect: "A second booking for the same client on an overlapping window in a full 1-bed shelter violates both the temporal client-overlap check (pri 10) and the fiscal capacity check (pri 14); the temporal error wins — business_temporal vs business_fiscal."
        test_recipe:
          setup:
            - "Shelter with 1 bed; client A already holds reservation [03-05,03-20); a second overlapping booking for A is attempted."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dora Dbl", dob: "1990-11-11" }
              as: IntakeSpecialist
              captures: { ca: $.data.id }
            - call: "POST /shelters"
              payload: { name: "Fir ES", project_type: "ES" }
              as: ShelterManager
              captures: { sh: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B1" }
              as: ShelterManager
              captures: { bed: $.data.id }
            - call: "GET /shelters/${sh}"
              payload: {}
              as: ShelterManager
              captures: { shv1: $.data.version }
            - call: "POST /bed-reservations"
              payload: { client_id: "${ca}", shelter_id: "${sh}", entry_date: "2026-03-05", expected_exit_date: "2026-03-20", expected_shelter_version: "${shv1}" }
              as: ShelterManager
              captures: { resa: $.data.id }
            - call: "GET /shelters/${sh}"
              payload: {}
              as: ShelterManager
              captures: { shv2: $.data.version }
          trigger:
            - call: "POST /bed-reservations"
              payload: { client_id: "${ca}", shelter_id: "${sh}", entry_date: "2026-03-06", expected_exit_date: "2026-03-19", expected_shelter_version: "${shv2}" }
              as: ShelterManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CLIENT_DOUBLE_BOOKED"
            - "response.status == 409"

      - name: pconf_referral_invalidstate_over_assessment
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ASSESSMENT_REQUIRED]
          - state_machines.PrioritizationEntry.ACTIVE_to_DEFERRED
        distinguishing_aspect: "A referral against a DEFERRED pool entry for a client with no COMPLETED assessment violates both the state check (pri 5) and the referential assessment check (pri 7); the state error wins — state vs business_referential, a different category pair than the temporal/fiscal conflict."
        test_recipe:
          setup:
            - "Client with ACTIVE consent but NO completed assessment; pool entry deferred; navigator present."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Della Def", dob: "1994-12-12" }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
            - call: "POST /consents"
              payload: { client_id: "${cli}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { con: $.data.id }
            - call: "POST /consents/${con}/activate"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /prioritization-entries"
              payload: { client_id: "${cli}" }
              as: HMISAdmin
              captures: { pe: $.data.id }
            - call: "POST /housing-navigators"
              payload: { name: "Nav Four", max_caseload: 2 }
              as: HMISAdmin
              captures: { nav: $.data.id }
            - call: "POST /prioritization-entries/${pe}/defer"
              payload: { deferred_until: "2026-04-01" }
              as: HousingNavigator
              as_user_id: "${nav}"
          trigger:
            - call: "POST /referrals"
              payload: { client_id: "${cli}", prioritization_entry_id: "${pe}", navigator_id: "${nav}", psh_project_name: "Maple PSH" }
              as: HousingNavigator
              as_user_id: "${nav}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: bnd_acuity_tier_threshold_eight
        grounds:
          - calculations.acuity_tier
          - entities.Client.fields.acuity_tier
          - state_machines.Assessment.DRAFT_to_COMPLETED
        distinguishing_aspect: "verified_score exactly 8 yields HIGH while 7 yields MODERATE on POST /assessments/{id}/complete — the acuity threshold is inclusive (>=8), a numeric boundary crossing."
        test_recipe:
          setup:
            - "Two clients; one completes an assessment scoring exactly 8, the other exactly 7."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Hi Eight", dob: "1990-01-08" }
              as: IntakeSpecialist
              captures: { chi: $.data.id }
            - call: "POST /assessments"
              payload: { client_id: "${chi}", self_report_points: 8 }
              as: IntakeSpecialist
              captures: { ahi: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Lo Seven", dob: "1990-01-07" }
              as: IntakeSpecialist
              captures: { clo: $.data.id }
            - call: "POST /assessments"
              payload: { client_id: "${clo}", self_report_points: 7 }
              as: IntakeSpecialist
              captures: { alo: $.data.id }
          trigger:
            - call: "POST /assessments/${ahi}/complete"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /assessments/${alo}/complete"
              payload: {}
              as: IntakeSpecialist
          assert:
            - "Client.${chi}.acuity_tier == HIGH"
            - "Client.${clo}.acuity_tier == MODERATE"

      - name: bnd_waitlist_promotion_empty_pool
        grounds:
          - calculations.waitlist_priority
          - calculations.bed_availability
          - state_machines.BedReservation.RESERVED_to_CANCELLED
          - entities.Shelter.fields.available_beds
        distinguishing_aspect: "When a reservation is cancelled and the waitlist candidate set is EMPTY, no promotion occurs and available_beds settles at 1 — an empty-collection edge on the cancel endpoint, a different metric and endpoint than the numeric acuity boundary."
        test_recipe:
          setup:
            - "Shelter with 1 bed; clock 2026-03-07; client A holds reservation [03-05,03-20); NO waitlist entries exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-07T00:00:00Z" }
              as: HMISAdmin
            - call: "POST /clients"
              payload: { full_name: "Solo A", dob: "1990-02-02" }
              as: IntakeSpecialist
              captures: { ca: $.data.id }
            - call: "POST /shelters"
              payload: { name: "Ash ES", project_type: "ES" }
              as: ShelterManager
              captures: { sh: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B1" }
              as: ShelterManager
              captures: { bed: $.data.id }
            - call: "GET /shelters/${sh}"
              payload: {}
              as: ShelterManager
              captures: { shv: $.data.version }
            - call: "POST /bed-reservations"
              payload: { client_id: "${ca}", shelter_id: "${sh}", entry_date: "2026-03-05", expected_exit_date: "2026-03-20", expected_shelter_version: "${shv}" }
              as: ShelterManager
              captures: { resa: $.data.id }
          trigger:
            - call: "POST /bed-reservations/${resa}/cancel"
              payload: {}
              as: ShelterManager
          assert:
            - "BedReservation.${resa}.status == CANCELLED"
            - "Shelter.${sh}.available_beds == 1"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: xdep_checkin_requires_active_consent
        grounds:
          - state_machines.BedReservation.RESERVED_to_CHECKED_IN
          - validations[priority=8]
          - errors[ERR_CONSENT_REQUIRED]
          - entities.ROIConsent.fields.status
        distinguishing_aspect: "BedReservation RESERVED->CHECKED_IN is blocked when the reserving Client's ROIConsent is not ACTIVE (still PENDING) — a BedReservation<-ROIConsent cross-entity state dependency."
        test_recipe:
          setup:
            - "Shelter with 1 bed; client with a PENDING (not activated) consent holds a RESERVED reservation."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Nan NoConsent", dob: "1990-03-03" }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
            - call: "POST /consents"
              payload: { client_id: "${cli}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { con: $.data.id }
            - call: "POST /shelters"
              payload: { name: "Birch ES", project_type: "ES" }
              as: ShelterManager
              captures: { sh: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B1" }
              as: ShelterManager
              captures: { bed: $.data.id }
            - call: "GET /shelters/${sh}"
              payload: {}
              as: ShelterManager
              captures: { shv: $.data.version }
            - call: "POST /bed-reservations"
              payload: { client_id: "${cli}", shelter_id: "${sh}", entry_date: "2026-03-05", expected_exit_date: "2026-03-20", expected_shelter_version: "${shv}" }
              as: ShelterManager
              captures: { res: $.data.id }
          trigger:
            - call: "POST /bed-reservations/${res}/check-in"
              payload: {}
              as: ShelterManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CONSENT_REQUIRED"
            - "response.status == 409"
            - "BedReservation.${res}.status == RESERVED"

      - name: xdep_referral_requires_completed_assessment
        grounds:
          - state_machines.PrioritizationEntry.ACTIVE_to_MATCHED
          - validations[priority=7]
          - errors[ERR_ASSESSMENT_REQUIRED]
          - entities.Assessment.fields.status
        distinguishing_aspect: "Referral creation (PrioritizationEntry ACTIVE->MATCHED) is blocked when the Client has no COMPLETED Assessment — a Referral<-Assessment cross-entity dependency, a different entity pair than the check-in/consent dependency."
        test_recipe:
          setup:
            - "Client with ACTIVE consent and an ACTIVE pool entry but no COMPLETED assessment; navigator present."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Pat NoAssess", dob: "1990-04-04" }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
            - call: "POST /consents"
              payload: { client_id: "${cli}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { con: $.data.id }
            - call: "POST /consents/${con}/activate"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /prioritization-entries"
              payload: { client_id: "${cli}" }
              as: HMISAdmin
              captures: { pe: $.data.id }
            - call: "POST /housing-navigators"
              payload: { name: "Nav Five", max_caseload: 2 }
              as: HMISAdmin
              captures: { nav: $.data.id }
          trigger:
            - call: "POST /referrals"
              payload: { client_id: "${cli}", prioritization_entry_id: "${pe}", navigator_id: "${nav}", psh_project_name: "Maple PSH" }
              as: HousingNavigator
              as_user_id: "${nav}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ASSESSMENT_REQUIRED"
            - "response.status == 409"
            - "PrioritizationEntry.${pe}.status == ACTIVE"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_bed_halfopen_adjacency_ok
        grounds:
          - calculations.bed_assignment
          - validations[priority=14]
          - errors[ERR_SHELTER_AT_CAPACITY]
          - entities.BedReservation.fields.bed_id
        distinguishing_aspect: "On a single-bed shelter, a booking [03-10,03-15) adjacent to an existing [03-05,03-10) is accepted onto the SAME bed (half-open, adjacency is not overlap), while an overlapping [03-08,03-12) is rejected with ERR_SHELTER_AT_CAPACITY — Bed-resource half-open interval semantics."
        test_recipe:
          setup:
            - "Shelter with exactly 1 bed; client A holds reservation [03-05,03-10); clients B and C available."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Al A", dob: "1990-05-05" }
              as: IntakeSpecialist
              captures: { ca: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Bo B", dob: "1990-06-06" }
              as: IntakeSpecialist
              captures: { cb: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cy C", dob: "1990-07-07" }
              as: IntakeSpecialist
              captures: { cc: $.data.id }
            - call: "POST /shelters"
              payload: { name: "Cedar ES", project_type: "ES" }
              as: ShelterManager
              captures: { sh: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B1" }
              as: ShelterManager
              captures: { bed: $.data.id }
            - call: "GET /shelters/${sh}"
              payload: {}
              as: ShelterManager
              captures: { shv1: $.data.version }
            - call: "POST /bed-reservations"
              payload: { client_id: "${ca}", shelter_id: "${sh}", entry_date: "2026-03-05", expected_exit_date: "2026-03-10", expected_shelter_version: "${shv1}" }
              as: ShelterManager
              captures: { resa: $.data.id, beda: $.data.bed_id }
            - call: "GET /shelters/${sh}"
              payload: {}
              as: ShelterManager
              captures: { shv2: $.data.version }
          trigger:
            - call: "POST /bed-reservations"
              payload: { client_id: "${cb}", shelter_id: "${sh}", entry_date: "2026-03-10", expected_exit_date: "2026-03-15", expected_shelter_version: "${shv2}" }
              as: ShelterManager
              captures: { resb: $.data.id, bedb: $.data.bed_id }
            - call: "GET /shelters/${sh}"
              payload: {}
              as: ShelterManager
              captures: { shv3: $.data.version }
            - call: "POST /bed-reservations"
              payload: { client_id: "${cc}", shelter_id: "${sh}", entry_date: "2026-03-08", expected_exit_date: "2026-03-12", expected_shelter_version: "${shv3}" }
              as: ShelterManager
              captures: { err: $.data.error_id }
          assert:
            - "BedReservation.${resb}.status == RESERVED"
            - "BedReservation.${resb}.bed_id == ${beda}"
            - "response.data.error_id == ERR_SHELTER_AT_CAPACITY"

      - name: overlap_client_inclusive_turnover_conflict
        grounds:
          - validations[priority=10]
          - errors[ERR_CLIENT_DOUBLE_BOOKED]
          - entities.BedReservation.fields.client_id
        distinguishing_aspect: "The same client cannot hold reservations in two shelters whose windows touch on the turnover day ([03-05,03-10) then [03-10,03-15)) — Client-resource INCLUSIVE interval semantics, the opposite adjacency treatment to the half-open Bed rule."
        test_recipe:
          setup:
            - "Two shelters each with a bed; client A holds a reservation in shelter 1 for [03-05,03-10)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Tara Turn", dob: "1990-08-08" }
              as: IntakeSpecialist
              captures: { ca: $.data.id }
            - call: "POST /shelters"
              payload: { name: "Shelter One", project_type: "ES" }
              as: ShelterManager
              captures: { s1: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${s1}", label: "S1B1" }
              as: ShelterManager
              captures: { b1: $.data.id }
            - call: "POST /shelters"
              payload: { name: "Shelter Two", project_type: "ES" }
              as: ShelterManager
              captures: { s2: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${s2}", label: "S2B1" }
              as: ShelterManager
              captures: { b2: $.data.id }
            - call: "GET /shelters/${s1}"
              payload: {}
              as: ShelterManager
              captures: { s1v: $.data.version }
            - call: "POST /bed-reservations"
              payload: { client_id: "${ca}", shelter_id: "${s1}", entry_date: "2026-03-05", expected_exit_date: "2026-03-10", expected_shelter_version: "${s1v}" }
              as: ShelterManager
              captures: { res1: $.data.id }
            - call: "GET /shelters/${s2}"
              payload: {}
              as: ShelterManager
              captures: { s2v: $.data.version }
          trigger:
            - call: "POST /bed-reservations"
              payload: { client_id: "${ca}", shelter_id: "${s2}", entry_date: "2026-03-10", expected_exit_date: "2026-03-15", expected_shelter_version: "${s2v}" }
              as: ShelterManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CLIENT_DOUBLE_BOOKED"
            - "response.status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: comp_bed_capacity_conserved_reserve_cancel
        grounds:
          - calculations.bed_availability
          - state_machines.BedReservation.RESERVED_to_CANCELLED
          - entities.Shelter.fields.available_beds
          - entities.Shelter.fields.total_beds
        distinguishing_aspect: "Forward reserve then compensating cancel leaves the conserved quantity Shelter.available_beds (== total_beds == 1) exactly restored — bed-capacity count is conserved."
        test_recipe:
          setup:
            - "Shelter with 1 bed; clock 2026-03-07; available_beds observed = 1 before booking."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-07T00:00:00Z" }
              as: HMISAdmin
            - call: "POST /clients"
              payload: { full_name: "Cap Client", dob: "1990-09-09" }
              as: IntakeSpecialist
              captures: { ca: $.data.id }
            - call: "POST /shelters"
              payload: { name: "Holly ES", project_type: "ES" }
              as: ShelterManager
              captures: { sh: $.data.id }
            - call: "POST /beds"
              payload: { shelter_id: "${sh}", label: "B1" }
              as: ShelterManager
              captures: { bed: $.data.id }
            - call: "GET /shelters/${sh}"
              payload: {}
              as: ShelterManager
              captures: { shv: $.data.version, avail_before: $.data.available_beds }
            - call: "POST /bed-reservations"
              payload: { client_id: "${ca}", shelter_id: "${sh}", entry_date: "2026-03-05", expected_exit_date: "2026-03-20", expected_shelter_version: "${shv}" }
              as: ShelterManager
              captures: { res: $.data.id }
          trigger:
            - call: "POST /bed-reservations/${res}/cancel"
              payload: {}
              as: ShelterManager
          assert:
            - "Shelter.${sh}.available_beds == 1"
            - "Shelter.${sh}.total_beds == 1"

      - name: comp_navigator_caseload_conserved_accept_decline
        grounds:
          - calculations.navigator_caseload
          - state_machines.Referral.PENDING_to_ACCEPTED
          - state_machines.Referral.ACCEPTED_to_DECLINED
          - entities.HousingNavigator.fields.current_caseload
        distinguishing_aspect: "Forward accept (+1) then compensating decline-from-ACCEPTED (-1) leaves the conserved quantity navigator.current_caseload restored to 0 — count of ACCEPTED referrals is conserved, a different conserved quantity than bed capacity."
        test_recipe:
          setup:
            - "Client active with assessment + ACTIVE consent; pool entry; navigator max 2; referral ACCEPTED."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Cara Case", dob: "1990-10-10" }
              as: IntakeSpecialist
              captures: { cli: $.data.id }
            - call: "POST /assessments"
              payload: { client_id: "${cli}", self_report_points: 9 }
              as: IntakeSpecialist
              captures: { asm: $.data.id }
            - call: "POST /assessments/${asm}/complete"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /consents"
              payload: { client_id: "${cli}", scope: "SHARE_ALL", effective_date: "2026-03-01", expiry_date: "2027-03-01" }
              as: IntakeSpecialist
              captures: { con: $.data.id }
            - call: "POST /consents/${con}/activate"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /prioritization-entries"
              payload: { client_id: "${cli}" }
              as: HMISAdmin
              captures: { pe: $.data.id }
            - call: "POST /housing-navigators"
              payload: { name: "Nav Six", max_caseload: 2 }
              as: HMISAdmin
              captures: { nav: $.data.id }
            - call: "POST /referrals"
              payload: { client_id: "${cli}", prioritization_entry_id: "${pe}", navigator_id: "${nav}", psh_project_name: "Maple PSH" }
              as: HousingNavigator
              as_user_id: "${nav}"
              captures: { ref: $.data.id }
            - call: "POST /referrals/${ref}/accept"
              payload: {}
              as: HousingNavigator
              as_user_id: "${nav}"
          trigger:
            - call: "POST /referrals/${ref}/decline"
              payload: {}
              as: HousingNavigator
              as_user_id: "${nav}"
          assert:
            - "Referral.${ref}.status == DECLINED"
            - "PrioritizationEntry.${pe}.status == ACTIVE"
            - "HousingNavigator.${nav}.current_caseload == 0"
