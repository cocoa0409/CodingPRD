              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_b}/submit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /pla-claims/${claim_b}/submit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${c204_id}", source_type: "PORTFOLIO", credits_requested: 4, rush_requested: false }
              as: Student
