            - "RoadCenterline.${road_id}.status == \"RETIRED\""
            - "RoadCenterline.${road_id}.retire_reason == \"Vacated by ordinance 2026-14\"   # the second reason was not written"
            - "RoadCenterline.${road_id}.retired_at == \"2026-08-01T00:00:00.000Z\""
            - "RoadCenterline.${road_id}.version == 2"

      - name: patch_published_road_rejected
