    side_effects: ["enrollment_status=ENROLLED, suspension_reason=null"]
  - method: POST
    path: "/pace/contractors/{id}/reinstate"
    description: "Lift a probation or suspension once both workmanship gates are met again"
    roles: [ProgramAdmin]
    code: 200
    input: ["note?"]
    output: Contractor
    side_effects:
      - "enrollment_status=ENROLLED, suspension_reason=null"
      - "every HELD Disbursement of the contractor moves back to REQUESTED with hold_reason=null"
      - "every FUNDING_HELD Application of the contractor moves back to FUNDING_PENDING with funding_hold_reason=null"

  # --- Application ---
  - method: POST
    path: "/pace/applications"
    description: "Open a PACE financing application on a parcel with an enrolled contractor"
    roles: [PropertyOwner]
    code: 201
    input: ["property_id", "contractor_id", "requested_term_years", "supersedes_application_id?"]
    output: Application
    side_effects:
      - "status=DRAFT, requested_principal_cents=0, cure_round_count=0, consent_posture=NOT_STARTED, notified_lien_count=0"
      - "oral_confirmation_required = (Property.preferred_language == ES) OR (Property.occupancy_type != OWNER_OCCUPIED)"
      - "X-User-ID must equal property_id"
  - method: GET
    path: "/pace/applications/{id}"
    description: "Read an application with every computed eligibility figure"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/pace/applications"
    description: "List applications filterable by parcel, contractor, superseded predecessor and status"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
    input: ["property_id?", "contractor_id?", "supersedes_application_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: POST
    path: "/pace/applications/{id}/measures"
    description: "Add a project measure to a DRAFT or NEEDS_CURE application; optimistically concurrent on the parent application version"
    roles: [PropertyOwner]
    code: 201
    input: [product_id, installed_cost_cents, estimated_annual_savings_cents, expected_application_version]
    output: ProjectMeasure
    side_effects:
      - "status=PROPOSED, pv_savings_cents=0, sir_bps=0"
      - "increments Application.version by 1"
      - "412 ERR_APPLICATION_VERSION_CONFLICT when expected_application_version is stale"
  - method: POST
    path: "/pace/applications/{id}/submit"
    description: "Submit a DRAFT application for underwriting"
    roles: [PropertyOwner]
    code: 200
    input: []
    output: Application
    side_effects:
      - "status=UNDER_REVIEW"
      - "runs weighted_average_useful_life -> weighted_useful_life_years"
      - "runs savings_to_investment_ratio both variants -> ProjectMeasure.pv_savings_cents, ProjectMeasure.sir_bps, min_measure_sir_bps, portfolio_sir_bps"
      - "requested_principal_cents = sum(installed_cost_cents) over PROPOSED measures"
      - "runs combined_lien_to_value_ratio (assessed_basis) -> screening_cltv_bps (advisory)"
      - "increments Application.version by 1"
  - method: POST
    path: "/pace/applications/{id}/underwrite"
    description: "Underwrite an UNDER_REVIEW application: PROCEED runs every eligibility gate and notifies the mortgage holders, CURE returns it to the owner, DECLINE closes it"
    roles: [UnderwritingAnalyst]
    code: 200
    input: ["decision", "valuation_basis?", "cure_reason_codes?", "decline_reason_code?"]
    output: Application
    side_effects:
      - "runs combined_lien_to_value_ratio on the requested valuation_basis -> underwriting_cltv_bps, valuation_basis (rewritten to ASSESSED when the appraisal is stale)"
      - "PROCEED: measures split APPROVED/INELIGIBLE on the per-measure SIR gate, requested_principal_cents recomputed over APPROVED only, status=CONSENT_PENDING, every ACTIVE lien notified (consent_response PENDING, consent_deadline_at=now+30d), notified_lien_count and consent_deadline_at set, consent_posture=PENDING (or CLEARED when the parcel has no ACTIVE lien)"
      - "CURE: cure_round_count+1, cure_reason_codes stored, status=NEEDS_CURE; when cure_round_count is already 2 the application is DECLINED with decline_reason_code=CURE_ROUNDS_EXHAUSTED"
      - "DECLINE: status=DECLINED, decline_reason_code stored, PROPOSED measures -> INELIGIBLE"
      - "underwriter_user_id=X-User-ID on every decision; increments Application.version by 1"
  - method: POST
    path: "/pace/applications/{id}/cure"
    description: "Owner returns a NEEDS_CURE application to underwriting after amending the measure set"
    roles: [PropertyOwner]
    code: 200
    input: ["note?"]
    output: Application
    side_effects:
      - "status=UNDER_REVIEW, cure_reason_codes=[]"
      - "re-runs every submit-time calculation over the current PROPOSED measure set"
      - "increments Application.version by 1"
  - method: POST
    path: "/pace/applications/{id}/approve"
    description: "Compliance approval of a CONSENT_PENDING application, applying the deemed-consent sweep and the underwriter/approver segregation of duties"
    roles: [ComplianceOfficer]
    code: 200
    input: ["note?"]
    output: Application
    side_effects:
      - "runs lender_consent_posture including the deemed-consent sweep: ACTIVE liens still PENDING past consent_deadline_at move to DEEMED_CONSENTED in counties 06073 and 06037 only"
      - "status=APPROVED, consent_posture=CLEARED, approver_user_id=X-User-ID"
      - "422 ERR_SEGREGATION_OF_DUTIES when X-User-ID equals underwriter_user_id"
      - "increments Application.version by 1"
  - method: GET
    path: "/pace/applications/{id}/eligibility-report"
    description: "Computed read: recomputes every eligibility figure for the application under BOTH valuation bases without persisting anything, and names the gate that would block a PROCEED"
    roles: [PropertyOwner, UnderwritingAnalyst, ComplianceOfficer, ProgramAdmin]
    code: 200
    input: []
    output: "{ application_id: string, valuation_basis_applied: string, appraisal_stale: boolean, cltv_bps_assessed: integer, cltv_bps_market: integer, ptv_bps: integer, equity_bps: integer, portfolio_sir_bps: integer, min_measure_sir_bps: integer, weighted_useful_life_years: integer, approved_principal_cents: integer, proposed_principal_cents: integer, consent_posture: string, blocking_error_id: string, measure_sir_report: string }"
    side_effects:
      - "PREVIEW SEMANTICS (no writes): approved_principal_cents is the principal that WOULD survive the per_measure_gate right now (measures already stamped APPROVED, plus PROPOSED measures whose sir_bps >= 10000 and whose product is ACTIVE); proposed_principal_cents sums every PROPOSED measure regardless of gate"
      - "cltv_bps_assessed and cltv_bps_market, ptv_bps and portfolio_sir_bps are all computed on approved_principal_cents; both CLTV bases are returned even when the appraisal is stale, and appraisal_stale reports whether a MARKET underwrite would degrade to ASSESSED"
      - "blocking_error_id is the error_id of the FIRST §1.4 gate a decision == PROCEED would hit right now (ERR_NO_ELIGIBLE_MEASURES, ERR_SIR_FLOOR_NOT_MET, ERR_CLTV_LIMIT_EXCEEDED, ERR_PTV_LIMIT_EXCEEDED, ERR_EQUITY_FLOOR_NOT_MET), evaluated against valuation_basis_applied, or null when nothing blocks"
      - "measure_sir_report is a comma-separated `<measure_id>:<sir_bps>` string so the response stays a flat dict"
  - method: GET
    path: "/pace/applications/{id}/financing-agreements"
    description: "Every financing agreement ever issued for the application, newest first"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FinancingAgreement[]
    side_effects: []
  - method: GET
    path: "/pace/applications/{id}/completion-certificates"
    description: "Every completion certificate filed against the application"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CompletionCertificate[]
    side_effects: []

  # --- ProjectMeasure ---
  - method: GET
    path: "/pace/measures/{id}"
    description: "Read one project measure with its discounted savings and SIR"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
    input: []
    output: ProjectMeasure
    side_effects: []
  - method: GET
    path: "/pace/measures"
    description: "List project measures filterable by application, product and status"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
    input: ["application_id?", "product_id?", "status?", "limit?", "offset?"]
    output: ProjectMeasure[]
    side_effects: []

  # --- FinancingAgreement ---
  - method: POST
    path: "/pace/financing-agreements"
    description: "Issue the financing agreement for an APPROVED application; optimistically concurrent on the parent application version"
    roles: [UnderwritingAnalyst]
    code: 201
    input: [application_id, term_years, apr_bps, expected_application_version]
    output: FinancingAgreement
    side_effects:
      - "runs financed_amount_composition -> principal_cents, admin_fee_cents, county_recording_fee_cents, financed_amount_cents, contractor_payable_cents"
      - "runs level_payment_amortization_schedule -> annual_installment_cents"
      - "status=ISSUED, oral_confirmation_required snapshotted from the Application"
      - "any prior ISSUED agreement of the application moves to VOID"
      - "increments Application.version by 1"
      - "412 ERR_APPLICATION_VERSION_CONFLICT when expected_application_version is stale"
  - method: GET
    path: "/pace/financing-agreements/{id}"
    description: "Read a financing agreement with its fee decomposition and rescission deadline"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
    input: []
    output: FinancingAgreement
    side_effects: []
  - method: POST
    path: "/pace/financing-agreements/{id}/sign"
    description: "Homeowner signs the ISSUED agreement, starting the three-business-day rescission clock"
    roles: [PropertyOwner]
    code: 200
    input: [signature_name]
    output: FinancingAgreement
    side_effects:
      - "status=SIGNED, signed_at=now"
      - "runs rescission_window_expiry -> rescission_expires_at"
      - "the Application moves APPROVED -> FUNDING_PENDING"
      - "Property.committed_pace_principal_cents += financed_amount_cents"
  - method: POST
    path: "/pace/financing-agreements/{id}/oral-confirmation"
    description: "Record the completed oral confirmation call for a deal that requires one"
    roles: [ComplianceOfficer]
    code: 200
    input: [oral_confirmation_reference]
    output: FinancingAgreement
    side_effects:
      - "oral_confirmation_completed_at=now, oral_confirmation_reference stored"
      - "does not shorten the rescission window"
  - method: POST
    path: "/pace/financing-agreements/{id}/rescind"
    description: "Homeowner exercises the right of rescission before the window closes"
    roles: [PropertyOwner]
    code: 200
    input: ["reason?"]
    output: FinancingAgreement
    side_effects:
      - "status=RESCINDED, rescinded_at=now"
      - "the Application moves FUNDING_PENDING -> WITHDRAWN; APPROVED measures -> INELIGIBLE"
      - "Property.committed_pace_principal_cents -= financed_amount_cents (exact compensation of the sign side effect)"
      - "CONTRACTOR_ATTESTED and HOMEOWNER_SIGNED certificates -> REJECTED with rejection_reason=AGREEMENT_RESCINDED"

  # --- CompletionCertificate ---
  - method: POST
    path: "/pace/completion-certificates"
    description: "Contractor attests that the listed measures are installed and operational"
    roles: [Contractor]
    code: 201
    input: ["application_id", "measure_ids", "certified_cost_cents", "contractor_attestation_note?"]
    output: CompletionCertificate
    side_effects:
      - "status=CONTRACTOR_ATTESTED"
      - "X-User-ID must equal the Application's contractor_id"
      - "no funds are released and no measure changes state yet"
  - method: GET
    path: "/pace/completion-certificates/{id}"
    description: "Read a completion certificate with its verification trail"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
    input: []
    output: CompletionCertificate
    side_effects: []
  - method: POST
    path: "/pace/completion-certificates/{id}/sign"
    description: "Homeowner countersigns the completion certificate"
    roles: [PropertyOwner]
    code: 200
    input: [homeowner_signature_name]
    output: CompletionCertificate
    side_effects: ["status=HOMEOWNER_SIGNED, homeowner_signed_at=now"]
  - method: POST
    path: "/pace/completion-certificates/{id}/verify"
    description: "Funding officer verifies or rejects a countersigned certificate; verification is the gate that unlocks money"
    roles: [FundingOfficer]
    code: 200
    input: ["decision", "rejection_reason?"]
    output: CompletionCertificate
    side_effects:
      - "APPROVE: status=VERIFIED, verified_by_user_id=X-User-ID, verified_at=now, every measure in measure_ids moves APPROVED -> COMPLETED"
      - "REJECT: status=REJECTED, rejection_reason stored, measures stay APPROVED so a replacement certificate can be filed"
      - "verified_by_user_id is later compared against the releaser for segregation of duties"

  # --- Disbursement ---
  - method: POST
    path: "/pace/disbursements"
    description: "Request a disbursement against a VERIFIED completion certificate"
    roles: [FundingOfficer]
    code: 201
    input: [application_id, completion_certificate_id, contractor_id, amount_cents]
    output: Disbursement
    side_effects:
      - "status=REQUESTED, or HELD with hold_reason=CONTRACTOR_PROBATION when the contractor is already on probation"
      - "enforces the per-certificate ceiling and the cumulative contractor_payable_cents ceiling"
  - method: GET
    path: "/pace/disbursements/{id}"
    description: "Read a disbursement with its hold, release and reversal trail"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
    input: []
    output: Disbursement
    side_effects: []
  - method: GET
    path: "/pace/disbursements"
    description: "List disbursements filterable by application, contractor, certificate and status"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
    input: ["application_id?", "contractor_id?", "completion_certificate_id?", "status?", "limit?", "offset?"]
    output: Disbursement[]
    side_effects: []
  - method: POST
    path: "/pace/disbursements/{id}/release"
    description: "Release funds to the contractor: the rescission window must have closed, any required oral confirmation must be on file, and the releaser must not be the certificate verifier"
    roles: [FundingOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects:
      - "status=RELEASED, released_by_user_id=X-User-ID, released_at=now"
      - "Contractor.gross_disbursed_cents += amount_cents; net_disbursed_cents recomputed"
      - "the FinancingAgreement moves SIGNED -> EFFECTIVE on the first release of the application"
      - "the Application moves FUNDING_PENDING -> FUNDED once the released total equals contractor_payable_cents"
  - method: POST
    path: "/pace/disbursements/{id}/reverse"
    description: "Claw back a released disbursement under contractor recourse"
    roles: [ComplianceOfficer]
    code: 200
    input: [reversal_reason]
    output: Disbursement
    side_effects:
      - "status=REVERSED, reversed_at=now"
      - "Contractor.clawed_back_total_cents += amount_cents; gross_disbursed_cents is NOT rewound; net_disbursed_cents recomputed"
      - "requires a WorkmanshipComplaint of the same application in status ESCALATED_RECOURSE"

  # --- WorkmanshipComplaint ---
  - method: POST
    path: "/pace/complaints"
    description: "Homeowner files a workmanship complaint against the contractor on a funded project"
    roles: [PropertyOwner]
    code: 201
    input: [application_id, contractor_id, category, severity, description]
    output: WorkmanshipComplaint
    side_effects:
      - "status=OPEN; no workmanship score changes on filing"
      - "X-User-ID must equal the Application's property_id"
  - method: GET
    path: "/pace/complaints/{id}"
    description: "Read a complaint with its adjudication trail"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
    input: []
    output: WorkmanshipComplaint
    side_effects: []
  - method: GET
    path: "/pace/complaints"
    description: "List complaints filterable by application, contractor, status and severity"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
    input: ["application_id?", "contractor_id?", "status?", "severity?", "limit?", "offset?"]
    output: WorkmanshipComplaint[]
    side_effects: []
  - method: POST
    path: "/pace/complaints/{id}/adjudicate"
    description: "Adjudicate a complaint: uphold with a remedy order, deny, verify a delivered remedy, or escalate to contractor recourse"
    roles: [ComplianceOfficer]
    code: 200
    input: ["decision", "remedy_deadline_on?", "note?"]
    output: WorkmanshipComplaint
    side_effects:
      - "UPHOLD_REMEDY: status=REMEDY_ORDERED, Contractor.upheld_open_remedy_count+1, runs contractor_workmanship_score both variants, and cascades contractor PROBATION/SUSPENSION -> Disbursement HELD -> Application FUNDING_HELD"
      - "DENY: status=CLOSED_DENIED, no score change and no cascade"
      - "REMEDY_VERIFIED: status=CLOSED_REMEDIED, upheld_open_remedy_count-1, the score deduction is kept"
      - "RECOURSE: status=ESCALATED_RECOURSE, upheld_open_remedy_count-1, the score deduction is kept, released disbursements become reversible, a SUSPENDED contractor moves to TERMINATED"

  # --- Assessment ---
  - method: POST
    path: "/pace/assessments"
    description: "Record the assessment lien and amortize it onto the county property tax roll"
    roles: [CountyOfficer]
    code: 201
    input: [application_id, first_tax_year]
    output: Assessment
    side_effects:
      - "billing_status=PENDING_ROLL, lien_status=SENIOR_RECORDED, transfer_status=NONE, delinquent_installment_count=0"
      - "final_tax_year=first_tax_year+term_years-1, original_principal_cents=principal_balance_cents=FinancingAgreement.financed_amount_cents, interest_accrual_from=recorded_on"
      - "runs level_payment_amortization_schedule to generate term_years AmortizationInstallment rows in status SCHEDULED"
      - "the Application moves FUNDED -> ASSESSED; the FinancingAgreement moves EFFECTIVE -> RECORDED"
      - "Property.recorded_pace_principal_cents and committed_pace_principal_cents recomputed (the hand-off leaves committed unchanged)"
  - method: GET
    path: "/pace/assessments/{id}"
    description: "Read an assessment with both status dimensions and its live balance"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
    input: []
    output: Assessment
    side_effects: []
  - method: GET
    path: "/pace/assessments"
    description: "List assessments filterable by parcel, application and either status dimension"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
    input: ["property_id?", "application_id?", "billing_status?", "lien_status?", "limit?", "offset?"]
    output: Assessment[]
    side_effects: []
  - method: GET
    path: "/pace/assessments/{id}/installments"
    description: "The full amortization schedule of an assessment, ordered by tax_year"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
    input: ["status?", "tax_year?", "limit?", "offset?"]
    output: AmortizationInstallment[]
    side_effects: []
  - method: GET
    path: "/pace/assessments/{id}/installments/{installmentId}"
    description: "Read one installment with its live penalty accrual"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
    input: []
    output: AmortizationInstallment
    side_effects: []
  - method: POST
    path: "/pace/assessments/{id}/installments/{installmentId}/payments"
    description: "Post the county's collection of an installment, including any penalty due"
    roles: [CountyOfficer]
    code: 200
    input: ["amount_cents", "paid_on?"]
    output: AmortizationInstallment
    side_effects:
      - "status=PAID, paid_on and paid_amount_cents recorded"
      - "Assessment.principal_balance_cents -= principal_cents; Assessment.version incremented"
      - "curing the last DELINQUENT installment moves lien_status LIEN_SALE_REFERRED -> SENIOR_RECORDED and zeroes accrued_penalty_cents"
      - "retiring the final installment moves billing_status -> PAID_OFF and lien_status -> RELEASED"
  - method: POST
    path: "/pace/assessments/{id}/prepayments"
    description: "Retire an assessment in full ahead of schedule; optimistically concurrent on the assessment version"
    roles: [CountyOfficer]
    code: 200
    input: [amount_cents, expected_assessment_version]
    output: Assessment
    side_effects:
      - "runs payoff_quote_composition as of the current logical date and requires amount_cents to equal payoff_total_cents exactly"
      - "principal_balance_cents=0, billing_status=PAID_OFF, lien_status=RELEASED, all SCHEDULED installments -> CANCELLED"
      - "increments Assessment.version by 1"
      - "412 ERR_ASSESSMENT_VERSION_CONFLICT when expected_assessment_version is stale"
  - method: GET
    path: "/pace/assessments/{id}/transfers"
    description: "Every payoff quote / transfer ever raised against the assessment"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AssessmentTransfer[]
    side_effects: []

  # --- AssessmentTransfer ---
  - method: POST
    path: "/pace/assessment-transfers"
    description: "Raise a payoff quote for a pending sale, choosing assumption by the buyer or payoff at closing"
    roles: [CountyOfficer]
    code: 201
    input: [assessment_id, mode, closing_date, buyer_full_name, buyer_birth_date]
    output: AssessmentTransfer
    side_effects:
      - "status=QUOTED, quoted_at=now, good_through_date=date(now)+30d"
      - "runs payoff_quote_composition -> payoff_principal_cents, accrued_interest_cents, payoff_admin_fee_cents, base_payoff_cents, prepayment_premium_bps, prepayment_premium_cents, payoff_total_cents"
      - "Assessment.transfer_status=QUOTED"
  - method: GET
    path: "/pace/assessment-transfers/{id}"
    description: "Read a transfer quote with its full payoff decomposition"
    roles: [PropertyOwner, Contractor, UnderwritingAnalyst, ComplianceOfficer, FundingOfficer, CountyOfficer, ProgramAdmin]
    code: 200
    input: []
    output: AssessmentTransfer
    side_effects: []
  - method: POST
    path: "/pace/assessment-transfers/{id}/record"
    description: "Record the closing: either the buyer assumes the remaining assessment or the assessment is paid off at closing"
    roles: [CountyOfficer]
    code: 200
    input: ["recorded_on?"]
    output: AssessmentTransfer
    side_effects:
      - "ASSUME_WITH_PROPERTY: status=RECORDED_ASSUMED, Assessment.transfer_status=ASSUMED, remaining installments untouched"
      - "PAYOFF_AT_CLOSING: status=RECORDED_PAID_OFF, Assessment.transfer_status=PAID_OFF_AT_SALE, principal_balance_cents=0, billing_status=PAID_OFF, lien_status=RELEASED, SCHEDULED installments -> CANCELLED"
      - "Property.owner_full_name and owner_birth_date are replaced by the buyer's values in both modes"
      - "a quote whose good_through_date has passed is first moved to EXPIRED and then rejected with 409 ERR_QUOTE_EXPIRED"

  # --- County roll run ---
  - method: POST
    path: "/pace/counties/{countyCode}/roll-runs"
    description: "Run the county tax roll for a tax year: bill every scheduled installment of that year, sweep past-due installments into delinquency with penalties, refer twice-delinquent assessments for lien sale, and cascade the consequences"
    roles: [CountyOfficer]
    code: 200
    input: [tax_year, effective_date]
    output: "{ county_code: string, tax_year: integer, effective_date: string, billed_installment_count: integer, delinquent_installment_count: integer, total_penalty_cents: integer, referred_assessment_ids: string, voided_transfer_ids: string, cured_application_ids: string, incremented_property_ids: string }"
    side_effects:
      - "PINNED STEP ORDER: (1) bill, (2) sweep + price penalties, (3) refer, (4) cascade. Because pricing happens in step 2, every penalty in a referring run is computed while lien_status is still SENIOR_RECORDED, so it uses PENALTY_CAP_BPS (2400) and no LIEN_REFERRAL_FEE_CENTS; the referred cap and the flat fee only apply to runs AFTER the referral."
      - "SCHEDULED installments of that tax_year on parcels in the county move to BILLED; their assessments move PENDING_ROLL -> ON_ROLL"
      - "BILLED installments whose due_on is before effective_date move to DELINQUENT with penalty_cents and months_past_due from delinquency_penalty_accrual (this sweeps installments billed by earlier runs AND ones billed in step 1 of this run)"
      - "assessments reaching 2 delinquent installments move lien_status -> LIEN_SALE_REFERRED"
      - "each referral voids the assessment's QUOTED transfers (VOID_STALE), increments Property.tax_delinquency_count_36m, and moves the parcel's UNDER_REVIEW/CONSENT_PENDING applications to NEEDS_CURE with cure_reason_codes=[TAX_DELINQUENCY]"
      - "the id list fields are comma-separated strings so the response stays a flat dict"

# =============================================================================
# Table 6: Error Code Catalog (§1.6) — 76 codes, every one triggerable through
#   the §1.5 surface. The `priority` column cross-references §1.4.
# =============================================================================
errors:
  - id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    condition: "X-Role absent/empty, or X-User-ID absent on an endpoint whose roles include an entity_backed role"
    applies_to: ["all"]
  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "X-Role is not in the endpoint's declared roles"
    applies_to: ["all"]
  - id: ERR_VALIDATION
    http_status: 400
    condition: "Missing required body field, wrong type, unknown enum value, negative cents/bps, limit outside 1..100, negative offset, market_value_cents supplied without appraisal_effective_on"
    applies_to: ["all"]
  - id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    condition: "An entity_backed caller acts on a row it does not own (PropertyOwner X-User-ID != Application.property_id, Contractor X-User-ID != Application.contractor_id)"
    applies_to: ["POST /pace/applications", "POST /pace/applications/{id}/measures", "POST /pace/applications/{id}/submit", "POST /pace/applications/{id}/cure", "POST /pace/financing-agreements/{id}/sign", "POST /pace/financing-agreements/{id}/rescind", "POST /pace/completion-certificates", "POST /pace/completion-certificates/{id}/sign", "POST /pace/complaints"]
  - id: ERR_PROPERTY_NOT_FOUND
    http_status: 404
    condition: "property id in path or body does not exist"
    applies_to: ["GET /pace/properties/{id}", "PATCH /pace/properties/{id}/valuation", "POST /pace/mortgage-liens", "POST /pace/applications"]
  - id: ERR_MORTGAGE_LIEN_NOT_FOUND
    http_status: 404
    condition: "mortgage lien id in path does not exist"
    applies_to: ["GET /pace/mortgage-liens/{id}", "POST /pace/mortgage-liens/{id}/consent-response"]
  - id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    condition: "product id in path or body does not exist"
    applies_to: ["GET /pace/products/{id}", "PATCH /pace/products/{id}", "POST /pace/applications/{id}/measures"]
  - id: ERR_CONTRACTOR_NOT_FOUND
    http_status: 404
    condition: "contractor id in path or body does not exist"
    applies_to: ["GET /pace/contractors/{id}", "POST /pace/contractors/{id}/enroll", "POST /pace/contractors/{id}/reinstate", "POST /pace/applications", "POST /pace/disbursements", "POST /pace/complaints"]
  - id: ERR_APPLICATION_NOT_FOUND
    http_status: 404
    condition: "application id in path or body does not exist"
    applies_to: ["GET /pace/applications/{id}", "POST /pace/applications/{id}/measures", "POST /pace/applications/{id}/submit", "POST /pace/applications/{id}/underwrite", "POST /pace/applications/{id}/cure", "POST /pace/applications/{id}/approve", "GET /pace/applications/{id}/eligibility-report", "POST /pace/financing-agreements", "POST /pace/completion-certificates", "POST /pace/disbursements", "POST /pace/complaints", "POST /pace/assessments"]
  - id: ERR_MEASURE_NOT_FOUND
    http_status: 404
    condition: "measure id in path does not exist, or an id in measure_ids does not exist at all"
    applies_to: ["GET /pace/measures/{id}", "POST /pace/completion-certificates"]
  - id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    condition: "financing agreement id in path does not exist"
    applies_to: ["GET /pace/financing-agreements/{id}", "POST /pace/financing-agreements/{id}/sign", "POST /pace/financing-agreements/{id}/oral-confirmation", "POST /pace/financing-agreements/{id}/rescind"]
  - id: ERR_CERTIFICATE_NOT_FOUND
    http_status: 404
    condition: "completion certificate id in path or body does not exist"
    applies_to: ["GET /pace/completion-certificates/{id}", "POST /pace/completion-certificates/{id}/sign", "POST /pace/completion-certificates/{id}/verify", "POST /pace/disbursements"]
  - id: ERR_DISBURSEMENT_NOT_FOUND
    http_status: 404
    condition: "disbursement id in path does not exist"
    applies_to: ["GET /pace/disbursements/{id}", "POST /pace/disbursements/{id}/release", "POST /pace/disbursements/{id}/reverse"]
  - id: ERR_COMPLAINT_NOT_FOUND
    http_status: 404
    condition: "complaint id in path does not exist"
    applies_to: ["GET /pace/complaints/{id}", "POST /pace/complaints/{id}/adjudicate"]
  - id: ERR_ASSESSMENT_NOT_FOUND
    http_status: 404
    condition: "assessment id in path or body does not exist"
    applies_to: ["GET /pace/assessments/{id}", "GET /pace/assessments/{id}/installments", "POST /pace/assessments/{id}/prepayments", "GET /pace/assessments/{id}/transfers", "POST /pace/assessment-transfers"]
