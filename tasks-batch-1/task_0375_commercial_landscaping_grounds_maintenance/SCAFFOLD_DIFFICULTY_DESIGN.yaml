# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Commercial Landscaping & Grounds Maintenance (Expert)
# 9 rule_ids x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: visit_estimate_vs_final_diverge_on_actuals_and_equipment
        grounds:
          - calculations.visit_estimated_charge
          - calculations.visit_final_charge
          - state_machines.ServiceVisit.IN_PROGRESS_to_COMPLETED
          - entities.ServiceVisit.fields.estimated_charge_cents
          - entities.ServiceVisit.fields.final_charge_cents
        distinguishing_aspect: |
          On the SAME ServiceVisit, estimated_charge_cents (planned labor, no
          equipment) is 59000 while final_charge_cents (actual labor + consumed
          equipment) is 68000 — two algorithms over one entity domain yield
          different cents.
        test_recipe:
          setup:
            - "Account + site (turf_area_sqft=5000) + ACTIVE contract + plan (base_rate_cents=10000) + crew (hourly_rate_cents=6000) + LOCKED route."
            - "A visit placed with slot_duration_minute=90 -> estimated_charge_cents=50000(area)+9000(planned labor)=59000."
            - "A RESERVED equipment reservation window [480,600] (120 min) on a 3000/hr asset -> usage_cost_cents=6000."
            - "Visit started, then completed with actual_labor_minutes=120 -> final=50000+12000(actual labor)+6000(equipment)=68000."
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000, snow_zone: "STANDARD" }
              as: AccountManager
              captures: { site: $.data.id }
            - call: "POST /v1/contracts"
              payload: { service_account_id: "${acct}", site_id: "${site}", annual_budget_cents: 100000000, billing_cycle: "MONTHLY" }
              as: AccountManager
              captures: { contract: $.data.id }
            - call: "POST /v1/plans"
              payload: { service_contract_id: "${contract}", service_type: "MOWING", frequency: "WEEKLY", base_rate_cents: 10000 }
              as: AccountManager
              captures: { plan: $.data.id }
            - call: "POST /v1/contracts/${contract}/activate"
              payload: {}
              as: AccountManager
              captures: { cver: $.data.version }
            - call: "POST /v1/crews"
              payload: { service_account_id: "${acct}", name: "Crew A", hourly_rate_cents: 6000, certified_for_snow: false }
              as: AccountManager
              captures: { crew: $.data.id }
            - call: "POST /v1/routes"
              payload: { crew_id: "${crew}", route_date: "2026-06-01", shift_start_minute: 400, shift_end_minute: 800 }
              as: CrewLead
              captures: { route: $.data.id }
            - call: "POST /v1/visits"
              payload: { service_plan_id: "${plan}", route_schedule_id: "${route}", slot_start_minute: 480, slot_duration_minute: 90, expected_service_contract_version: "${cver}" }
              as: CrewLead
              captures: { visit: $.data.id, est: $.data.estimated_charge_cents }
            - call: "POST /v1/equipment"
              payload: { service_account_id: "${acct}", name: "Mower 3", hourly_usage_cost_cents: 3000, service_interval_hours: 100 }
              as: AccountManager
              captures: { asset: $.data.id }
            - call: "POST /v1/reservations"
              payload: { equipment_asset_id: "${asset}", service_visit_id: "${visit}", window_start_minute: 480, window_end_minute: 600 }
              as: CrewLead
            - call: "POST /v1/routes/${route}/lock"
              payload: {}
              as: CrewLead
            - call: "POST /v1/visits/${visit}/start"
              payload: {}
              as: CrewLead
          trigger:
            - call: "POST /v1/visits/${visit}/complete"
              payload: { actual_labor_minutes: 120 }
              as: CrewLead
              captures: { fin: $.data.final_charge_cents }
          assert:
            - "ServiceVisit.${visit}.estimated_charge_cents == 59000"
            - "ServiceVisit.${visit}.final_charge_cents == 68000"
            - "ServiceVisit.${visit}.final_charge_cents != ServiceVisit.${visit}.estimated_charge_cents"

      - name: storm_dispatch_charge_vs_crew_selection_distinct_domains
        grounds:
          - calculations.storm_dispatch_charge
          - calculations.storm_crew_selector
          - state_machines.SnowStormEvent.REPORTED_to_DISPATCHED
          - entities.SnowStormEvent.fields.dispatch_charge_cents
          - entities.SnowStormEvent.fields.assigned_crew_id
        distinguishing_aspect: |
          Storm dispatch runs two distinct-domain calcs on one transition: a
          money calc (dispatch_charge_cents=37500 for snowfall=5 on a PRIORITY
          site) and a crew-selection calc (assigned_crew_id = cheapest certified
          crew) — different subjects than the visit estimate/final money pair.
        test_recipe:
          setup:
            - "Account + PRIORITY-zone site + two certified crews: cheap (hourly_rate_cents=4000) and pricey (hourly_rate_cents=9000)."
            - "A REPORTED storm event at the site with snowfall_inches=5."
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "HQ", address: "9 Oak", turf_area_sqft: 4000, snow_zone: "PRIORITY" }
              as: AccountManager
              captures: { site: $.data.id }
            - call: "POST /v1/crews"
              payload: { service_account_id: "${acct}", name: "Cheap Crew", hourly_rate_cents: 4000, certified_for_snow: true }
              as: AccountManager
              captures: { cheap: $.data.id }
            - call: "POST /v1/crews"
              payload: { service_account_id: "${acct}", name: "Pricey Crew", hourly_rate_cents: 9000, certified_for_snow: true }
              as: AccountManager
              captures: { pricey: $.data.id }
            - call: "POST /v1/storm-events"
              payload: { site_id: "${site}", snowfall_inches: 5, response_deadline_minute: 600 }
              as: DispatchOperator
              captures: { event: $.data.id }
          trigger:
            - call: "POST /v1/storm-events/${event}/dispatch"
              payload: {}
              as: DispatchOperator
              captures: { charge: $.data.dispatch_charge_cents, assigned: $.data.assigned_crew_id }
          assert:
            - "SnowStormEvent.${event}.dispatch_charge_cents == 37500"
            - "SnowStormEvent.${event}.assigned_crew_id == ${cheap}"
            - "SnowStormEvent.${event}.status == DISPATCHED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: addon_charge_round_per_bucket_then_sum
        grounds:
          - calculations.addon_charge
          - state_machines.EnhancementAddOn.REQUESTED_to_APPROVED
          - entities.EnhancementAddOn.fields.addon_charge_cents
        distinguishing_aspect: |
          Mode (b) per-bucket rounding: quantity=15, unit_price_cents=333 gives
          bucket1=3330 (10 units full) + bucket2=round_half_up(5*333*0.90=1498.5)=1499
          = 4829; rounding the discounted bucket BEFORE summation is the pinned
          order (round-per-bucket-then-sum).
        test_recipe:
          setup:
            - "Account + site + ACTIVE contract + plan + crew + LOCKED-or-OPEN route + a SCHEDULED visit."
            - "A REQUESTED add-on on that visit with addon_type=MULCH_INSTALL, quantity=15, unit_price_cents=333."
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
              captures: { site: $.data.id }
            - call: "POST /v1/contracts"
              payload: { service_account_id: "${acct}", site_id: "${site}", annual_budget_cents: 100000000, billing_cycle: "MONTHLY" }
              as: AccountManager
              captures: { contract: $.data.id }
            - call: "POST /v1/plans"
              payload: { service_contract_id: "${contract}", service_type: "MULCH", frequency: "SEASONAL", base_rate_cents: 10000 }
              as: AccountManager
              captures: { plan: $.data.id }
            - call: "POST /v1/contracts/${contract}/activate"
              payload: {}
              as: AccountManager
              captures: { cver: $.data.version }
            - call: "POST /v1/crews"
              payload: { service_account_id: "${acct}", name: "Crew A", hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { crew: $.data.id }
            - call: "POST /v1/routes"
              payload: { crew_id: "${crew}", route_date: "2026-06-01", shift_start_minute: 400, shift_end_minute: 800 }
              as: CrewLead
              captures: { route: $.data.id }
            - call: "POST /v1/visits"
              payload: { service_plan_id: "${plan}", route_schedule_id: "${route}", slot_start_minute: 480, slot_duration_minute: 90, expected_service_contract_version: "${cver}" }
              as: CrewLead
              captures: { visit: $.data.id }
            - call: "POST /v1/addons"
              payload: { service_visit_id: "${visit}", addon_type: "MULCH_INSTALL", quantity: 15, unit_price_cents: 333 }
              as: CrewLead
              captures: { addon: $.data.id }
          trigger:
            - call: "POST /v1/addons/${addon}/approve"
              payload: {}
              as: AccountManager
              captures: { charge: $.data.addon_charge_cents }
          assert:
            - "EnhancementAddOn.${addon}.addon_charge_cents == 4829"
            - "EnhancementAddOn.${addon}.status == APPROVED"

      - name: storm_dispatch_charge_tier_branch_with_priority_multiplier
        grounds:
          - calculations.storm_dispatch_charge
          - state_machines.SnowStormEvent.REPORTED_to_DISPATCHED
          - entities.SnowStormEvent.fields.dispatch_charge_cents
          - entities.Site.fields.snow_zone
        distinguishing_aspect: |
          Mode (a) non-linear interaction with >=3 inputs: snowfall_inches=8
          selects the HEAVY base (60000) via strict-< tier branch, and the
          PRIORITY snow_zone multiplies by 1.25 -> round(60000*1.25)=75000;
          a conditional branch plus multiplicative interaction, distinct from
          the addon per-bucket rounding mode.
        test_recipe:
          setup:
            - "Account + PRIORITY-zone site + one certified crew."
            - "A REPORTED storm event with snowfall_inches=8 (exactly the heavy-tier boundary)."
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "HQ", address: "9 Oak", turf_area_sqft: 4000, snow_zone: "PRIORITY" }
              as: AccountManager
              captures: { site: $.data.id }
            - call: "POST /v1/crews"
              payload: { service_account_id: "${acct}", name: "Snow Crew", hourly_rate_cents: 5000, certified_for_snow: true }
              as: AccountManager
              captures: { crew: $.data.id }
            - call: "POST /v1/storm-events"
              payload: { site_id: "${site}", snowfall_inches: 8, response_deadline_minute: 600 }
              as: DispatchOperator
              captures: { event: $.data.id }
          trigger:
            - call: "POST /v1/storm-events/${event}/dispatch"
              payload: {}
              as: DispatchOperator
              captures: { charge: $.data.dispatch_charge_cents }
          assert:
            - "SnowStormEvent.${event}.dispatch_charge_cents == 75000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: visit_parallel_execution_and_billing_dimensions
        grounds:
          - state_machines.ServiceVisit.IN_PROGRESS_to_COMPLETED
          - state_machines.Invoice.DRAFT_to_ISSUED
          - entities.ServiceVisit.fields.execution_status
          - entities.ServiceVisit.fields.billing_status
        distinguishing_aspect: |
          ServiceVisit carries two independent dimensions: execution_status
          reaches COMPLETED via field-work transitions while billing_status
          stays UNBILLED until an Invoice issue flips it to INVOICED — two
          parallel axes evolving on different triggers on the same entity.
        test_recipe:
          setup:
            - "Account/site/ACTIVE contract (annual_budget_cents=100000000)/plan(base_rate=10000)/crew(hourly=6000)/route."
            - "Visit placed (slot 90), route locked, started, completed with actual_labor_minutes=90 -> final_charge_cents=59000, execution_status=COMPLETED, billing_status=UNBILLED."
            - "A DRAFT invoice swept that single COMPLETED+UNBILLED visit (line_item_count=1, subtotal=59000)."
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
              captures: { site: $.data.id }
            - call: "POST /v1/contracts"
              payload: { service_account_id: "${acct}", site_id: "${site}", annual_budget_cents: 100000000, billing_cycle: "MONTHLY" }
              as: AccountManager
              captures: { contract: $.data.id }
            - call: "POST /v1/plans"
              payload: { service_contract_id: "${contract}", service_type: "MOWING", frequency: "WEEKLY", base_rate_cents: 10000 }
              as: AccountManager
              captures: { plan: $.data.id }
            - call: "POST /v1/contracts/${contract}/activate"
              payload: {}
              as: AccountManager
              captures: { cver: $.data.version }
            - call: "POST /v1/crews"
              payload: { service_account_id: "${acct}", name: "Crew A", hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { crew: $.data.id }
            - call: "POST /v1/routes"
              payload: { crew_id: "${crew}", route_date: "2026-06-01", shift_start_minute: 400, shift_end_minute: 800 }
              as: CrewLead
              captures: { route: $.data.id }
            - call: "POST /v1/visits"
              payload: { service_plan_id: "${plan}", route_schedule_id: "${route}", slot_start_minute: 480, slot_duration_minute: 90, expected_service_contract_version: "${cver}" }
              as: CrewLead
              captures: { visit: $.data.id }
            - call: "POST /v1/routes/${route}/lock"
              payload: {}
              as: CrewLead
            - call: "POST /v1/visits/${visit}/start"
              payload: {}
              as: CrewLead
            - call: "POST /v1/visits/${visit}/complete"
              payload: { actual_labor_minutes: 90 }
              as: CrewLead
            - call: "POST /v1/invoices"
              payload: { service_contract_id: "${contract}", period_label: "2026-06" }
              as: AccountManager
              captures: { invoice: $.data.id }
            - call: "GET /v1/contracts/${contract}"
              payload: {}
              as: AccountManager
              captures: { cver2: $.data.version }
          trigger:
            - call: "POST /v1/invoices/${invoice}/issue"
              payload: { expected_service_contract_version: "${cver2}" }
              as: AccountManager
          trigger_note: "Before this trigger, execution_status==COMPLETED but billing_status==UNBILLED; the issue flips only billing_status."
          assert:
            - "ServiceVisit.${visit}.execution_status == COMPLETED"
            - "ServiceVisit.${visit}.billing_status == INVOICED"
            - "Invoice.${invoice}.status == ISSUED"

      - name: inspection_cyclic_rework_loop_increments_count
        grounds:
          - state_machines.QualityInspection.PENDING_to_REWORK_REQUIRED
          - state_machines.QualityInspection.REWORK_REQUIRED_to_PENDING
          - entities.QualityInspection.fields.rework_count
          - entities.QualityInspection.fields.status
        distinguishing_aspect: |
          QualityInspection cycles PENDING -> REWORK_REQUIRED -> PENDING,
          incrementing rework_count to 1 on the reopen — a true cycle on a
          different entity than the parallel-dimension ServiceVisit.
        test_recipe:
          setup:
            - "Account/site/ACTIVE contract/plan/crew/route; a visit placed, started, completed (actual_labor_minutes=90)."
            - "A PENDING inspection opened on the completed visit, graded score=70 -> REWORK_REQUIRED (REWORK_FLOOR=60 <= 70 < PASS_THRESHOLD=85, rework_count 0 < MAX_REWORK=2)."
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
              captures: { site: $.data.id }
            - call: "POST /v1/contracts"
              payload: { service_account_id: "${acct}", site_id: "${site}", annual_budget_cents: 100000000, billing_cycle: "MONTHLY" }
              as: AccountManager
              captures: { contract: $.data.id }
            - call: "POST /v1/plans"
              payload: { service_contract_id: "${contract}", service_type: "MOWING", frequency: "WEEKLY", base_rate_cents: 10000 }
              as: AccountManager
              captures: { plan: $.data.id }
            - call: "POST /v1/contracts/${contract}/activate"
              payload: {}
              as: AccountManager
              captures: { cver: $.data.version }
            - call: "POST /v1/crews"
              payload: { service_account_id: "${acct}", name: "Crew A", hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { crew: $.data.id }
            - call: "POST /v1/routes"
              payload: { crew_id: "${crew}", route_date: "2026-06-01", shift_start_minute: 400, shift_end_minute: 800 }
              as: CrewLead
              captures: { route: $.data.id }
            - call: "POST /v1/visits"
              payload: { service_plan_id: "${plan}", route_schedule_id: "${route}", slot_start_minute: 480, slot_duration_minute: 90, expected_service_contract_version: "${cver}" }
              as: CrewLead
              captures: { visit: $.data.id }
            - call: "POST /v1/routes/${route}/lock"
              payload: {}
              as: CrewLead
            - call: "POST /v1/visits/${visit}/start"
              payload: {}
              as: CrewLead
            - call: "POST /v1/visits/${visit}/complete"
              payload: { actual_labor_minutes: 90 }
              as: CrewLead
            - call: "POST /v1/inspections"
              payload: { service_visit_id: "${visit}" }
              as: QualityInspector
              captures: { insp: $.data.id }
            - call: "POST /v1/inspections/${insp}/grade"
              payload: { score: 70 }
              as: QualityInspector
          trigger:
            - call: "POST /v1/inspections/${insp}/reopen"
              payload: {}
              as: QualityInspector
              captures: { rc: $.data.rework_count }
          assert:
            - "QualityInspection.${insp}.status == PENDING"
            - "QualityInspection.${insp}.rework_count == 1"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: contract_suspend_cascade_visit_reservation_asset_depth3
        grounds:
          - state_machines.ServiceContract.ACTIVE_to_SUSPENDED
          - state_machines.ServiceVisit.SCHEDULED_to_CANCELLED
          - state_machines.EquipmentReservation.RESERVED_to_RELEASED
          - entities.EquipmentAsset.fields.accumulated_usage_minutes
          - entities.RouteSchedule.fields.booked_minutes
        distinguishing_aspect: |
          Depth-3 cascade from ONE trigger (contract suspend): suspend cancels
          the SCHEDULED visit (hop1), the cancel releases its RESERVED
          reservation (hop2), the release returns 120 reserved_minutes to the
          asset's accumulated_usage_minutes -> 0 (hop3). Each hop is caused by
          the prior hop, not directly by suspend.
        test_recipe:
          setup:
            - "Account/site/ACTIVE contract/plan/crew/OPEN route; a SCHEDULED visit (slot 90) with a RESERVED reservation window [480,600] (120 min) on an asset whose accumulated_usage_minutes==120."
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
              captures: { site: $.data.id }
            - call: "POST /v1/contracts"
              payload: { service_account_id: "${acct}", site_id: "${site}", annual_budget_cents: 100000000, billing_cycle: "MONTHLY" }
              as: AccountManager
              captures: { contract: $.data.id }
            - call: "POST /v1/plans"
              payload: { service_contract_id: "${contract}", service_type: "MOWING", frequency: "WEEKLY", base_rate_cents: 10000 }
              as: AccountManager
              captures: { plan: $.data.id }
            - call: "POST /v1/contracts/${contract}/activate"
              payload: {}
              as: AccountManager
              captures: { cver: $.data.version }
            - call: "POST /v1/crews"
              payload: { service_account_id: "${acct}", name: "Crew A", hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { crew: $.data.id }
            - call: "POST /v1/routes"
              payload: { crew_id: "${crew}", route_date: "2026-06-01", shift_start_minute: 400, shift_end_minute: 800 }
              as: CrewLead
              captures: { route: $.data.id }
            - call: "POST /v1/visits"
              payload: { service_plan_id: "${plan}", route_schedule_id: "${route}", slot_start_minute: 480, slot_duration_minute: 90, expected_service_contract_version: "${cver}" }
              as: CrewLead
              captures: { visit: $.data.id }
            - call: "POST /v1/equipment"
              payload: { service_account_id: "${acct}", name: "Mower 3", hourly_usage_cost_cents: 3000, service_interval_hours: 100 }
              as: AccountManager
              captures: { asset: $.data.id }
            - call: "POST /v1/reservations"
              payload: { equipment_asset_id: "${asset}", service_visit_id: "${visit}", window_start_minute: 480, window_end_minute: 600 }
              as: CrewLead
              captures: { resv: $.data.id }
          trigger:
            - call: "POST /v1/contracts/${contract}/suspend"
              payload: {}
              as: AccountManager
          assert:
            - "ServiceContract.${contract}.status == SUSPENDED"
            - "ServiceVisit.${visit}.execution_status == CANCELLED"
            - "EquipmentReservation.${resv}.status == RELEASED"
            - "EquipmentAsset.${asset}.accumulated_usage_minutes == 0"
            - "RouteSchedule.${route}.booked_minutes == 0"

      - name: addon_approve_cascade_visit_estimate_contract_committed_depth2
        grounds:
          - state_machines.EnhancementAddOn.REQUESTED_to_APPROVED
          - calculations.visit_estimated_charge
          - calculations.contract_committed_reconcile
          - entities.ServiceVisit.fields.estimated_charge_cents
          - entities.ServiceContract.fields.committed_cents
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (add-on approve): approve
          recomputes the parent visit estimated_charge_cents (hop1: 59000 ->
          78000 after a 19000 add-on), which recomputes the contract
          committed_cents (hop2: 78000). Each hop caused by the prior.
        test_recipe:
          setup:
            - "Account/site(turf=5000)/ACTIVE contract/plan(base_rate=10000)/crew(hourly=6000)/route; a SCHEDULED visit (slot 90) -> estimated_charge_cents=59000, contract committed_cents=59000."
            - "A REQUESTED add-on quantity=20 unit_price_cents=1000 -> approved charge 10*1000 + round(10*1000*0.9)=10000+9000=19000."
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { name: "Greens Co", region_code: "NE" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /v1/sites"
              payload: { service_account_id: "${acct}", name: "Plaza", address: "1 Main", turf_area_sqft: 5000 }
              as: AccountManager
              captures: { site: $.data.id }
            - call: "POST /v1/contracts"
              payload: { service_account_id: "${acct}", site_id: "${site}", annual_budget_cents: 100000000, billing_cycle: "MONTHLY" }
              as: AccountManager
              captures: { contract: $.data.id }
            - call: "POST /v1/plans"
              payload: { service_contract_id: "${contract}", service_type: "MOWING", frequency: "WEEKLY", base_rate_cents: 10000 }
              as: AccountManager
