      - name: fill_rate_aggregates_served_over_total_with_no_partial_fills
        claim_type: aggregation
        grounds:
          - calculations.parts_fill_rate_and_promise
          - entities.ServicePart.fields.fill_rate_pct
          - entities.ServicePart.fields.backordered_request_count
          - entities.PartsFulfillmentRequest.fields.promised_ship_date
        distinguishing_aspect: |
          Stock is consumed strictly per request with no partial fills, and the request that
          cannot be covered does NOT block the ones behind it: from 2 pieces on hand, a
          1-piece dealer request fills, a 2-piece request backorders (only 1 left), and a
          later 1-piece mass-retail request still fills from the remainder — giving
          fill_rate_pct == 66.67 (2 of 3, round_half_up) and three different promise dates
          drawn from three different lead constants.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; family 2027-EPA-208SS with platform 208SS."
