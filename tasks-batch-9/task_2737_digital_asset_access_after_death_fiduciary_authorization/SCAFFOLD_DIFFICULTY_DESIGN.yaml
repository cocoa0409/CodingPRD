          trigger:
            - call: "POST /disposition-elections/${el_id}/transitions"
              payload: { action: "EXECUTE", platform_confirmation_reference: "CV-XFER-1" }
              as: PlatformCompliance
              as_user_id: "${p_cloud_id}"
            - call: "POST /disposition-elections/${el_id}/transitions"
              payload: { action: "REVERSE", reason: "beneficiary declined the account" }
              as: PlatformCompliance
              as_user_id: "${p_cloud_id}"
          assert:
            - "before EXECUTE: Estate.${est_id}.gross_digital_estate_cents == 400033, undistributed_value_cents == 400033, BeneficiaryDesignation.${ben_id}.received_value_cents == 0"
            - "after EXECUTE: DispositionElection.${el_id}.distributed_value_cents == 400033"
            - "after EXECUTE: Estate.${est_id}.undistributed_value_cents == 0"
            - "after EXECUTE: BeneficiaryDesignation.${ben_id}.received_value_cents == 400033"
            - "after EXECUTE: Estate.${est_id}.gross_digital_estate_cents == 400033 (unchanged by the distribution)"
            - "after REVERSE: Estate.${est_id}.undistributed_value_cents == 400033"
            - "after REVERSE: BeneficiaryDesignation.${ben_id}.received_value_cents == 0"
            - "after REVERSE: DispositionElection.${el_id}.distributed_value_cents == 0 and status == REVERSED"
            - "after REVERSE: DigitalAsset.${a_id}.disposition_status == PENDING and appraised_value_cents == 400033 (the appraisal survives the reversal)"
            - "at all three points gross_digital_estate_cents == undistributed_value_cents + SUM(received_value_cents) == 400033"
            - "ValuationRun.${run_id}.gross_value_cents == 400033 (the run is not rewritten by the transfer or its reversal)"

      - name: charge_back_restores_refund_recovered_to_the_sum_of_credited_claims
        grounds:
          - state_machines.RefundClaim.transitions[PLATFORM_REVIEW->CREDITED]
          - state_machines.RefundClaim.transitions[CREDITED->CHARGED_BACK]
          - entities.Estate.fields.refund_recovered_cents
          - entities.RefundClaim.fields.credited_cents
          - validations[priority=62]
        distinguishing_aspect: |
          Estate.refund_recovered_cents must equal SUM(credited_cents WHERE status == CREDITED) after
          every write: 0 -> 9000 -> 10940 -> 1940 as two claims are credited and the larger one is
          charged back. The compensation must subtract exactly the stored credited_cents (9000, the
          partial credit) and not the claimed_cents (9566), which an implementation that recomputes
          from the claim amount would wrongly use.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; platform StreamOne with refund_policy PRORATA_DAILY"
            - "one estate with VERIFIED death certificate and letters"
            - "one SUBSCRIPTION asset with a SubscriptionTerm 2026-01-01..2026-12-31, ANNUAL, period_fee_cents 11999"
            - "its CancellationOrder driven to CONFIRMED"
            - "two disjoint RefundClaims: claim 1 covering 2026-03-16..2026-12-31 (291 days, 9566) and claim 2 covering 2026-01-01..2026-02-28 (59 days, 1940), both moved to PLATFORM_REVIEW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "StreamOne", platform_type: "SUBSCRIPTION", form_code: "SO-FORM-4", review_window_days: 14, refund_policy: "PRORATA_DAILY", supports_online_tool: false, supports_transfer: false, supports_memorialization: false, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: true, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_stream_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-X" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-X1" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "DEATH_CERTIFICATE", reference_number: "DC-X", issued_on: "2026-02-16", jurisdiction: "CA" }
              as: CourtRegistrar
              captures: { dc_id: $.data.id }
            - call: "POST /documents/${dc_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "LETTERS_OF_AUTHORITY", reference_number: "LOA-X", issued_on: "2026-03-01", jurisdiction: "CA", fiduciary_id: "${fid1_id}" }
              as: CourtRegistrar
              captures: { loa_id: $.data.id }
            - call: "POST /documents/${loa_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_stream_id}", category: "SUBSCRIPTION", account_handle: "stream-premium", quoted_value_cents: 0 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a_sub_id: $.data.id }
            - call: "POST /digital-assets/${a_sub_id}/subscription-terms"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", billing_interval: "ANNUAL", period_fee_cents: 11999, auto_renew: true }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { term_id: $.data.id }
            - call: "POST /estates/${est_id}/platform-requests"
              payload: { platform_id: "${p_stream_id}", request_type: "CATALOG_ACCESS", requested_scope: "CATALOG_ONLY", death_certificate_document_id: "${dc_id}", letters_document_id: "${loa_id}", platform_form_code: "SO-FORM-4" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { req_id: $.data.id }
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "START_REVIEW" }
              as: PlatformCompliance
              as_user_id: "${p_stream_id}"
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "DECIDE", decision: "APPROVED" }
              as: PlatformCompliance
              as_user_id: "${p_stream_id}"
            - call: "GET /cancellation-orders"
              payload: { asset_id: "${a_sub_id}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { co_id: "$.data[0].id" }
            - call: "POST /cancellation-orders/${co_id}/transitions"
              payload: { action: "REQUEST", effective_date: "2026-03-15" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
            - call: "POST /cancellation-orders/${co_id}/transitions"
              payload: { action: "CONFIRM", platform_reference: "SO-CANCEL-X1", auto_renew_stopped: true }
              as: PlatformCompliance
              as_user_id: "${p_stream_id}"
            - call: "POST /cancellation-orders/${co_id}/refund-claims"
              payload: { claimed_period_start: "2026-03-16", claimed_period_end: "2026-12-31", pursuit_cost_cents: 0 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { c1_id: $.data.id, c1_cents: $.data.claimed_cents }
            - call: "POST /refund-claims/${c1_id}/transitions"
              payload: { action: "START_REVIEW" }
              as: PlatformCompliance
              as_user_id: "${p_stream_id}"
            - call: "POST /cancellation-orders/${co_id}/refund-claims"
              payload: { claimed_period_start: "2026-01-01", claimed_period_end: "2026-02-28", pursuit_cost_cents: 0 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { c2_id: $.data.id, c2_cents: $.data.claimed_cents }
            - call: "POST /refund-claims/${c2_id}/transitions"
              payload: { action: "START_REVIEW" }
              as: PlatformCompliance
              as_user_id: "${p_stream_id}"
          trigger:
            - call: "POST /refund-claims/${c1_id}/transitions"
              payload: { action: "CREDIT", credited_cents: 9000 }
              as: PlatformCompliance
              as_user_id: "${p_stream_id}"
            - call: "POST /refund-claims/${c2_id}/transitions"
              payload: { action: "CREDIT", credited_cents: 1940 }
              as: PlatformCompliance
              as_user_id: "${p_stream_id}"
            - call: "POST /refund-claims/${c1_id}/transitions"
              payload: { action: "CHARGE_BACK", reason: "provider clawed the credit back" }
              as: PlatformCompliance
              as_user_id: "${p_stream_id}"
          assert:
            - "${c1_cents} == 9566"
            - "${c2_cents} == 1940"
            - "before any credit: Estate.${est_id}.refund_recovered_cents == 0"
            - "after crediting claim 1: Estate.${est_id}.refund_recovered_cents == 9000"
            - "after crediting claim 2: Estate.${est_id}.refund_recovered_cents == 10940"
            - "after the charge-back: Estate.${est_id}.refund_recovered_cents == 1940"
            - "RefundClaim.${c1_id}.status == CHARGED_BACK with credited_cents still 9000 for audit"
            - "RefundClaim.${c2_id}.status == CREDITED with credited_cents 1940"
            - "after the charge-back: SubscriptionTerm.${term_id}.claimed_days_total == 59 (the charged-back interval is released)"
            - "at every point Estate.refund_recovered_cents == SUM(RefundClaim.credited_cents WHERE status == CREDITED)"
            - "a CREDIT of 9567 on a claim whose claimed_cents is 9566 returns HTTP 400 with error_id ERR_CREDIT_EXCEEDS_CLAIM"

      - name: rejection_and_supersession_both_restore_the_inventory_counter_identity
        grounds:
          - state_machines.DispositionElection.transitions[SUBMITTED->REJECTED]
          - state_machines.DispositionElection.transitions[SUBMITTED->SUPERSEDED]
          - entities.Estate.fields.inventory_total_count
          - entities.Estate.fields.assets_pending_disposition_count
          - entities.Estate.fields.assets_disposed_count
          - concurrency_rules.disposition-election-create-stale-asset
        distinguishing_aspect: |
          Two different compensations must restore the same identity
          inventory_total_count == assets_pending_disposition_count + assets_disposed_count: a
          provider REJECT of a SUBMITTED election, and the implicit SUPERSESSION of a SUBMITTED
          election when a newer one is created on the same asset. Both return the asset to PENDING
          and leave the counters at 2 == 1 + 1 with one asset already EXECUTED, so an implementation
          that only decrements on REJECT drifts on the supersession path.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; platform CloudVault with supports_memorialization true"
            - "one estate with VERIFIED death certificate and letters and TWO CLOUD_STORAGE assets"
            - "both assets CATALOG_DISCLOSED by one APPROVED CATALOG_ACCESS request"
            - "asset 1 already memorialized (its election EXECUTED), so counters read inventory 2, pending 1, disposed 1"
            - "asset 2 has a SUBMITTED MEMORIALIZE election"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "CloudVault", platform_type: "CLOUD_STORAGE", form_code: "CV-FORM-1", review_window_days: 14, refund_policy: "NONE", supports_online_tool: true, supports_transfer: true, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: false, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_cloud_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-Y" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-Y1" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "DEATH_CERTIFICATE", reference_number: "DC-Y", issued_on: "2026-02-16", jurisdiction: "CA" }
              as: CourtRegistrar
              captures: { dc_id: $.data.id }
            - call: "POST /documents/${dc_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "LETTERS_OF_AUTHORITY", reference_number: "LOA-Y", issued_on: "2026-03-01", jurisdiction: "CA", fiduciary_id: "${fid1_id}" }
              as: CourtRegistrar
              captures: { loa_id: $.data.id }
            - call: "POST /documents/${loa_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_cloud_id}", category: "CLOUD_STORAGE", account_handle: "vault-one", quoted_value_cents: 50000 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_cloud_id}", category: "CLOUD_STORAGE", account_handle: "vault-two", quoted_value_cents: 60000 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a2_id: $.data.id }
            - call: "POST /estates/${est_id}/platform-requests"
              payload: { platform_id: "${p_cloud_id}", request_type: "CATALOG_ACCESS", requested_scope: "CATALOG_ONLY", death_certificate_document_id: "${dc_id}", letters_document_id: "${loa_id}", platform_form_code: "CV-FORM-1" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { req_id: $.data.id }
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "START_REVIEW" }
              as: PlatformCompliance
              as_user_id: "${p_cloud_id}"
            - call: "POST /platform-requests/${req_id}/transitions"
              payload: { action: "DECIDE", decision: "APPROVED" }
              as: PlatformCompliance
              as_user_id: "${p_cloud_id}"
            - call: "GET /digital-assets/${a1_id}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a1_v1: $.data.version }
            - call: "POST /digital-assets/${a1_id}/disposition-elections"
              payload: { election: "MEMORIALIZE", expected_asset_version: "${a1_v1}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { el1_id: $.data.id }
            - call: "POST /disposition-elections/${el1_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
            - call: "POST /disposition-elections/${el1_id}/transitions"
              payload: { action: "EXECUTE", platform_confirmation_reference: "CV-MEM-Y1" }
              as: PlatformCompliance
              as_user_id: "${p_cloud_id}"
            - call: "GET /digital-assets/${a2_id}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a2_v1: $.data.version }
            - call: "POST /digital-assets/${a2_id}/disposition-elections"
              payload: { election: "MEMORIALIZE", expected_asset_version: "${a2_v1}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { el2_id: $.data.id }
            - call: "POST /disposition-elections/${el2_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
          trigger:
            - call: "POST /disposition-elections/${el2_id}/transitions"
              payload: { action: "REJECT", reason: "account already closed by next of kin" }
              as: PlatformCompliance
              as_user_id: "${p_cloud_id}"
            - call: "GET /digital-assets/${a2_id}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a2_v2: $.data.version }
            - call: "POST /digital-assets/${a2_id}/disposition-elections"
              payload: { election: "MEMORIALIZE", expected_asset_version: "${a2_v2}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { el3_id: $.data.id }
            - call: "POST /disposition-elections/${el3_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
            - call: "GET /digital-assets/${a2_id}"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a2_v3: $.data.version }
            - call: "POST /digital-assets/${a2_id}/disposition-elections"
              payload: { election: "DELETE", expected_asset_version: "${a2_v3}" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { el4_id: $.data.id }
          assert:
            - "before the REJECT: Estate.${est_id}.inventory_total_count == 2, assets_pending_disposition_count == 1, assets_disposed_count == 1"
            - "after the REJECT: DispositionElection.${el2_id}.status == REJECTED and rejection_reason is not null"
            - "after the REJECT: DigitalAsset.${a2_id}.disposition_status == PENDING"
            - "after the REJECT: Estate.${est_id}.assets_pending_disposition_count == 1 and assets_disposed_count == 1"
            - "after the supersession: DispositionElection.${el3_id}.status == SUPERSEDED"
            - "after the supersession: DispositionElection.${el4_id}.status == PENDING_COUNTERSIGN (a DELETE election)"
            - "after the supersession: DigitalAsset.${a2_id}.disposition_status == PENDING"
            - "after the supersession: Estate.${est_id}.assets_pending_disposition_count == 1 and assets_disposed_count == 1"
            - "at every checkpoint inventory_total_count == assets_pending_disposition_count + assets_disposed_count == 2"
            - "DigitalAsset.${a1_id}.disposition_status == EXECUTED throughout (the compensations never touch the other asset)"
            - "re-sending the ${el4_id} creation with expected_asset_version ${a2_v2} returns HTTP 412 with error_id ERR_STALE_ASSET_VERSION"
