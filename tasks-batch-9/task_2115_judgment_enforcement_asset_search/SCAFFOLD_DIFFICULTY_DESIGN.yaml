          - entities.Judgment.fields.contingency_fee_cents
          - endpoints[POST /payments]
        distinguishing_aspect: |
          Metric 2 of 4 — cumulative gross collected against the 5000000-cent tier breakpoint, probed on
          POST /payments: 4999999 cents stays in the 3300 bps tier (fee 1650000) while exactly 5000000 cents
          crosses into the 2500 bps tier (fee 1250000), so the breakpoint is inclusive on the upper tier.
        test_recipe:
          setup:
            - "Two CA judgments under one creditor, each 6000000 cents principal at 0 bps with 0 filing costs."
            - "Judgment A receives a single payment of 4999999 cents; judgment B receives a single payment of 5000000 cents."
