              as: Member
              as_user_id: "${mem_forb}"
              captures: { forb_err: $.data.error_id }
          assert:
            - "the call returns error_id == ERR_FORBIDDEN"
            - "GET /stores/fusion-orders?store_id=${st216} returns zero orders"

      - name: the_same_restock_call_succeeds_for_the_authorized_role
        claim_type: Satisfaction → Pass
        grounds: ["validations[priority=2]", "roles.StoreAssociate.exclusive_operations"]
        distinguishing_aspect: "The restock operation that a member cannot perform succeeds for the store associate, proving the authorization rung denies by role rather than by payload."
