  - name: correction_evidence_and_reopen_cycles
    grounds:
    - state_machines.CorrectionRequest.PENDING_REVIEW_to_EVIDENCE_REQUESTED
    - state_machines.CorrectionRequest.EVIDENCE_REQUESTED_to_PENDING_REVIEW
    - state_machines.CorrectionRequest.DENIED_to_PENDING_REVIEW
    - validations[priority=8]
    distinguishing_aspect: CorrectionRequest exhibits two distinct cycles — the evidence-request loop and the denial-reopen loop — on a different
      entity than BenefitClaim's suspension cycle. The reopen hop additionally enforces segregation of duties (reopener != original denier).
