scaffold_corner_design:
  # ---------------------------------------------------------------- entities
  - section: entities
    instances:
      - name: product_create_returns_201_with_active_status
        claim_type: Creation
        grounds: [entities.Product.fields.status, entities.Product.fields.sku]
        distinguishing_aspect: "POST /products with all required fields returns 201 and status ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "C-1", name: "Rustic", category: "BREAD", base_price_cents: 500, shelf_life_hours: 24 }
              as: Manager
              captures: { pid: $.data.id }
          assert:
            - "Product.${pid}.status == ACTIVE"
            - "Product.${pid}.base_price_cents == 500"

      - name: get_product_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_PRODUCT_NOT_FOUND]"]
        distinguishing_aspect: "GET /products/{unknown-uuid} returns ERR_PRODUCT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /products/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PRODUCT_NOT_FOUND"

      - name: product_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.Product.fields.base_price_cents]
        distinguishing_aspect: "POST /products omitting base_price_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "C-2", name: "NoPrice", category: "BREAD", shelf_life_hours: 24 }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: product_default_status_and_empty_allergens
        claim_type: Defaults
        grounds: [entities.Product.fields.allergens, entities.Product.fields.status]
        distinguishing_aspect: "Omitting allergens/is_custom yields allergens [] and status ACTIVE (is_custom false)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "C-3", name: "Plain", category: "BREAD", base_price_cents: 300, shelf_life_hours: 12 }
              as: Manager
              captures: { pid: $.data.id }
          assert:
            - "Product.${pid}.allergens == []"
            - "Product.${pid}.is_custom == false"

      - name: product_invalid_category_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.Product.fields.category]
        distinguishing_aspect: "POST /products with category outside the enum returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "C-4", name: "Weird", category: "FLARP", base_price_cents: 300, shelf_life_hours: 12 }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: bake_lot_best_by_is_computed_from_shelf_life
        claim_type: Computed Fields
        grounds: [entities.BakeLot.fields.best_by, entities.Product.fields.shelf_life_hours]
        distinguishing_aspect: "best_by == produced_at + shelf_life_hours (06:00 + 12h => 18:00), input best_by ignored."
        test_recipe:
          setup: ["Product shelf_life 12; committed plan line; one oven."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "C-5", name: "Timed", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { pid: $.data.id }
            - call: "POST /ovens"
              payload: { name: "Oven E", capacity_trays: 20 }
              as: Manager
              captures: { oid: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-20T00:00:00Z" }
              as: Manager
              captures: { plid: $.data.id }
            - call: "POST /bake-plans/${plid}/lines"
              payload: { product_id: "${pid}", par_qty: 20 }
              as: Manager
              captures: { lid: $.data.id }
            - call: "POST /bake-plans/${plid}/commit"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /bake-lots"
              payload: { bake_plan_line_id: "${lid}", oven_id: "${oid}", baked_qty: 10, produced_at: "2026-06-20T06:00:00Z", slot_start: "2026-06-20T02:00:00Z", slot_end: "2026-06-20T03:00:00Z" }
              as: Manager
              captures: { lot: $.data.id }
          assert:
            - "BakeLot.${lot}.best_by == 2026-06-20T18:00:00.000Z"
            - "BakeLot.${lot}.status == FRESH"

      - name: products_list_returns_pagination_envelope
        claim_type: Listing
        grounds: [entities.Product.fields.sku]
        distinguishing_aspect: "GET /products returns an array envelope with total_count and has_more."
        test_recipe:
          setup: ["one product exists"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "C-6", name: "Listed", category: "BREAD", base_price_cents: 300, shelf_life_hours: 12 }
              as: Manager
          trigger:
            - call: "GET /products"
              payload: { limit: 1, offset: 0 }
              as: Manager
          assert:
            - "response envelope pagination fields total_count >= 1 and has_more present"

  # ---------------------------------------------------------- state_machines
  - section: state_machines
    instances:
      - name: commit_already_committed_plan_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.BakePlan.DRAFT_to_COMMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Committing a plan already COMMITTED returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["committed plan with one line"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "C-7", name: "P7", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { pid: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-21T00:00:00Z" }
              as: Manager
              captures: { plid: $.data.id }
            - call: "POST /bake-plans/${plid}/lines"
              payload: { product_id: "${pid}", par_qty: 10 }
              as: Manager
            - call: "POST /bake-plans/${plid}/commit"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /bake-plans/${plid}/commit"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: reconcile_draft_plan_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.BakePlan.BAKED_to_RECONCILED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Reconciling a DRAFT (not BAKED) plan returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["DRAFT plan with one line, never committed/baked"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "C-8", name: "P8", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { pid: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-22T00:00:00Z" }
              as: Manager
              captures: { plid: $.data.id }
            - call: "POST /bake-plans/${plid}/lines"
              payload: { product_id: "${pid}", par_qty: 10 }
              as: Manager
          trigger:
            - call: "POST /bake-plans/${plid}/reconcile"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: cancel_already_cancelled_standing_order_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.StandingOrder.ACTIVE_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a CANCELLED standing order (terminal) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["a cancelled standing order"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "C-9", name: "P9", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { pid: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "A9", credit_limit_cents: 1000000, contract_tier: "STANDARD" }
              as: Manager
              captures: { aid: $.data.id }
            - call: "POST /standing-orders"
              payload: { wholesale_account_id: "${aid}", product_id: "${pid}", qty_per_delivery: 5, weekday_mask: ["MON"], cutoff_hours: 24 }
              as: Manager
              captures: { sid: $.data.id }
            - call: "POST /standing-orders/${sid}/cancel"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /standing-orders/${sid}/cancel"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: suspend_already_suspended_account_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.WholesaleAccount.ACTIVE_to_SUSPENDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Suspending a SUSPENDED account again returns ERR_INVALID_STATE (no idempotent re-suspend)."
        test_recipe:
          setup: ["a suspended account"]
          setup_api_calls:
            - call: "POST /wholesale-accounts"
              payload: { name: "A10", credit_limit_cents: 1000000, contract_tier: "STANDARD" }
              as: Manager
              captures: { aid: $.data.id }
            - call: "POST /wholesale-accounts/${aid}/suspend"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /wholesale-accounts/${aid}/suspend"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: expire_fresh_lot_transitions_to_expired
        claim_type: Valid Transition
        grounds: [state_machines.BakeLot.FRESH_to_EXPIRED, entities.BakeLot.fields.status]
        distinguishing_aspect: "POST /bake-lots/{id}/expire moves a FRESH lot to EXPIRED."
        test_recipe:
          setup: ["committed plan line; one FRESH lot"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "C-11", name: "P11", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { pid: $.data.id }
            - call: "POST /ovens"
              payload: { name: "Oven F", capacity_trays: 20 }
              as: Manager
              captures: { oid: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-23T00:00:00Z" }
              as: Manager
              captures: { plid: $.data.id }
            - call: "POST /bake-plans/${plid}/lines"
              payload: { product_id: "${pid}", par_qty: 20 }
              as: Manager
              captures: { lid: $.data.id }
            - call: "POST /bake-plans/${plid}/commit"
              payload: {}
              as: Manager
            - call: "POST /bake-lots"
              payload: { bake_plan_line_id: "${lid}", oven_id: "${oid}", baked_qty: 5, produced_at: "2026-06-23T06:00:00Z", slot_start: "2026-06-23T02:00:00Z", slot_end: "2026-06-23T03:00:00Z" }
              as: Manager
              captures: { lot: $.data.id }
          trigger:
            - call: "POST /bake-lots/${lot}/expire"
              payload: {}
              as: Manager
          assert:
            - "BakeLot.${lot}.status == EXPIRED"

  # ------------------------------------------------------------ calculations
  - section: calculations
    instances:
      - name: bulk_volume_floor_discount_on_qty_24
        claim_type: Constants Applied
        grounds: [calculations.wholesale_line_price, entities.DeliveryOrder.fields.unit_price_cents]
        distinguishing_aspect: "STANDARD account ordering qty 24 (>= BULK_MIN_QTY) applies the BULK 0.20 volume floor: unit_price 320, line_total round(24*400*0.8)=7680, list 9600."
        test_recipe:
          setup: ["STANDARD account, committed line par 30"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "C-12", name: "P12", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { pid: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "A12", credit_limit_cents: 1000000, contract_tier: "STANDARD" }
              as: Manager
              captures: { aid: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-24T00:00:00Z" }
              as: Manager
              captures: { plid: $.data.id }
            - call: "POST /bake-plans/${plid}/lines"
              payload: { product_id: "${pid}", par_qty: 30 }
              as: Manager
              captures: { lid: $.data.id }
            - call: "POST /bake-plans/${plid}/commit"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /delivery-orders"
              payload: { wholesale_account_id: "${aid}", product_id: "${pid}", bake_plan_line_id: "${lid}", delivery_date: "2026-06-24T10:00:00Z", qty: 24 }
              as: Manager
              captures: { oid: $.data.id }
          assert:
            - "DeliveryOrder.${oid}.unit_price_cents == 320"
            - "DeliveryOrder.${oid}.line_total_cents == 7680"
            - "DeliveryOrder.${oid}.list_total_cents == 9600"

  # ------------------------------------------------------------- validations
  - section: validations
    instances:
      - name: allergen_conflict_on_create_order_returns_error
        claim_type: Violation to Error
        grounds: ["validations[priority=5]", "errors[ERR_ALLERGEN_CONFLICT]", entities.WholesaleAccount.fields.allergen_restrictions]
        distinguishing_aspect: "Ordering a product whose allergens include NUT for an account restricting NUT returns ERR_ALLERGEN_CONFLICT (safety, priority 5)."
        test_recipe:
          setup: ["NUT product; account restricting NUT; committed line"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "C-13", name: "Walnut", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12, allergens: ["NUT", "GLUTEN"] }
              as: Manager
              captures: { pid: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "A13", credit_limit_cents: 1000000, contract_tier: "STANDARD", allergen_restrictions: ["NUT"] }
              as: Manager
              captures: { aid: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-25T00:00:00Z" }
              as: Manager
              captures: { plid: $.data.id }
            - call: "POST /bake-plans/${plid}/lines"
              payload: { product_id: "${pid}", par_qty: 10 }
              as: Manager
              captures: { lid: $.data.id }
            - call: "POST /bake-plans/${plid}/commit"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /delivery-orders"
              payload: { wholesale_account_id: "${aid}", product_id: "${pid}", bake_plan_line_id: "${lid}", delivery_date: "2026-06-25T10:00:00Z", qty: 2 }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ALLERGEN_CONFLICT"

      - name: duplicate_stop_for_same_order_returns_error
        claim_type: Violation to Error
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_STOP]"]
        distinguishing_aspect: "Adding a second non-cancelled RouteStop for the same delivery order returns ERR_DUPLICATE_STOP."
        test_recipe:
          setup: ["committed line; one order; route with one stop for that order"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "C-14", name: "P14", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { pid: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "A14", credit_limit_cents: 1000000, contract_tier: "STANDARD" }
              as: Manager
              captures: { aid: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-26T00:00:00Z" }
              as: Manager
              captures: { plid: $.data.id }
            - call: "POST /bake-plans/${plid}/lines"
              payload: { product_id: "${pid}", par_qty: 20 }
              as: Manager
              captures: { lid: $.data.id }
            - call: "POST /bake-plans/${plid}/commit"
              payload: {}
              as: Manager
            - call: "POST /delivery-orders"
              payload: { wholesale_account_id: "${aid}", product_id: "${pid}", bake_plan_line_id: "${lid}", delivery_date: "2026-06-26T10:00:00Z", qty: 2 }
              as: Manager
              captures: { oid: $.data.id }
            - call: "POST /delivery-routes"
              payload: { route_date: "2026-06-26T00:00:00Z", driver_name: "Gil", window_start: "2026-06-26T06:00:00Z", window_end: "2026-06-26T14:00:00Z" }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /delivery-routes/${rid}/stops"
              payload: { delivery_order_id: "${oid}", sequence: 1, arrival_window_start: "2026-06-26T08:00:00Z", arrival_window_end: "2026-06-26T09:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /delivery-routes/${rid}/stops"
              payload: { delivery_order_id: "${oid}", sequence: 2, arrival_window_start: "2026-06-26T10:00:00Z", arrival_window_end: "2026-06-26T11:00:00Z" }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_STOP"

      - name: route_window_end_before_start_returns_invalid_window
        claim_type: Violation to Error
        grounds: ["validations[priority=8]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "POST /delivery-routes with window_end before window_start returns ERR_INVALID_WINDOW."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /delivery-routes"
              payload: { route_date: "2026-06-27T00:00:00Z", driver_name: "Hal", window_start: "2026-06-27T14:00:00Z", window_end: "2026-06-27T06:00:00Z" }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_WINDOW"

  # ----------------------------------------------------------------- errors
  - section: errors
    instances:
      - name: credit_limit_exceeded_on_create_order_returns_error
        claim_type: Violation to Error
        grounds: ["validations[priority=9]", "errors[ERR_CREDIT_LIMIT_EXCEEDED]"]
        distinguishing_aspect: "Creating an order whose line_total would push credit_balance above a small credit_limit returns ERR_CREDIT_LIMIT_EXCEEDED (402)."
        test_recipe:
          setup: ["account credit_limit 100; committed line par 10"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "C-15", name: "P15", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { pid: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "A15", credit_limit_cents: 100, contract_tier: "STANDARD" }
              as: Manager
              captures: { aid: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-28T00:00:00Z" }
              as: Manager
              captures: { plid: $.data.id }
            - call: "POST /bake-plans/${plid}/lines"
              payload: { product_id: "${pid}", par_qty: 10 }
              as: Manager
              captures: { lid: $.data.id }
            - call: "POST /bake-plans/${plid}/commit"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /delivery-orders"
              payload: { wholesale_account_id: "${aid}", product_id: "${pid}", bake_plan_line_id: "${lid}", delivery_date: "2026-06-28T10:00:00Z", qty: 2 }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CREDIT_LIMIT_EXCEEDED"

      - name: retail_sale_exceeds_remaining_returns_insufficient_inventory
        claim_type: Violation to Error
        grounds: ["validations[priority=7]", "errors[ERR_INSUFFICIENT_INVENTORY]"]
        distinguishing_aspect: "Selling more units than a lot's remaining_qty returns ERR_INSUFFICIENT_INVENTORY."
        test_recipe:
          setup: ["committed line; one lot baked 5"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "C-16", name: "P16", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { pid: $.data.id }
            - call: "POST /ovens"
              payload: { name: "Oven G", capacity_trays: 20 }
              as: Manager
              captures: { oid: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-29T00:00:00Z" }
              as: Manager
              captures: { plid: $.data.id }
            - call: "POST /bake-plans/${plid}/lines"
              payload: { product_id: "${pid}", par_qty: 20 }
              as: Manager
              captures: { lid: $.data.id }
            - call: "POST /bake-plans/${plid}/commit"
              payload: {}
              as: Manager
            - call: "POST /bake-lots"
              payload: { bake_plan_line_id: "${lid}", oven_id: "${oid}", baked_qty: 5, produced_at: "2026-06-29T06:00:00Z", slot_start: "2026-06-29T02:00:00Z", slot_end: "2026-06-29T03:00:00Z" }
              as: Manager
              captures: { lot: $.data.id }
          trigger:
            - call: "POST /retail-sales"
              payload: { bake_lot_id: "${lot}", qty: 6 }
              as: Cashier
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INSUFFICIENT_INVENTORY"

      - name: markdown_on_expired_lot_returns_lot_expired
        claim_type: Violation to Error
        grounds: ["validations[priority=4]", "errors[ERR_LOT_EXPIRED]"]
        distinguishing_aspect: "Markdown on an EXPIRED lot returns ERR_LOT_EXPIRED (state check precedes OCC)."
        test_recipe:
          setup: ["committed line; a lot that was expired"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "C-17", name: "P17", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { pid: $.data.id }
            - call: "POST /ovens"
              payload: { name: "Oven H", capacity_trays: 20 }
              as: Manager
              captures: { oid: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-30T00:00:00Z" }
              as: Manager
              captures: { plid: $.data.id }
            - call: "POST /bake-plans/${plid}/lines"
              payload: { product_id: "${pid}", par_qty: 20 }
              as: Manager
              captures: { lid: $.data.id }
            - call: "POST /bake-plans/${plid}/commit"
              payload: {}
              as: Manager
            - call: "POST /bake-lots"
              payload: { bake_plan_line_id: "${lid}", oven_id: "${oid}", baked_qty: 5, produced_at: "2026-06-30T06:00:00Z", slot_start: "2026-06-30T02:00:00Z", slot_end: "2026-06-30T03:00:00Z" }
              as: Manager
              captures: { lot: $.data.id }
            - call: "POST /bake-lots/${lot}/expire"
              payload: {}
              as: Manager
            - call: "GET /bake-lots/${lot}"
              payload: {}
              as: Manager
              captures: { lv: $.data.version }
          trigger:
            - call: "POST /bake-lots/${lot}/markdown"
              payload: { expected_bake_lot_version: "${lv}" }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LOT_EXPIRED"

  # ------------------------------------------------------------------- rbac
  - section: rbac
    instances:
      - name: cashier_cannot_create_product_returns_unauthorized
        claim_type: Role Denial
        grounds: [roles.Cashier, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Cashier (not in POST /products roles) is denied ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "C-18", name: "P18", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12 }
              as: Cashier
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED"

      - name: wholesale_client_cannot_read_other_account
        claim_type: Role Denial
        grounds: [roles.WholesaleClient, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "WholesaleClient reading an account that is not its own (X-User-ID != account.id) is denied ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["two accounts A and B"]
          setup_api_calls:
            - call: "POST /wholesale-accounts"
              payload: { name: "OwnA", credit_limit_cents: 1000000, contract_tier: "STANDARD" }
              as: Manager
              captures: { aA: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "OtherB", credit_limit_cents: 1000000, contract_tier: "STANDARD" }
              as: Manager
              captures: { aB: $.data.id }
          trigger:
            - call: "GET /wholesale-accounts/${aB}"
              payload: {}
              as: WholesaleClient
              as_user_id: "${aA}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED"

  # ------------------------------------------ cross_cutting_complexity_layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: markdown_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[markdown-supersede-stale-lot]", "errors[ERR_STALE_LOT_VERSION]", entities.BakeLot.fields.version]
        distinguishing_aspect: "A markdown carrying expected_bake_lot_version equal to the pre-sale version (stale after a retail sale bumped the lot) is rejected ERR_STALE_LOT_VERSION (412) while the lot is otherwise eligible."
        test_recipe:
          setup: ["committed line; eligible lot (h=6); one retail sale bumps lot.version from 1 to 2"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "C-19", name: "P19", category: "PASTRY", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { pid: $.data.id }
            - call: "POST /ovens"
              payload: { name: "Oven I", capacity_trays: 20 }
              as: Manager
              captures: { oid: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-06-04T00:00:00Z" }
              as: Manager
              captures: { plid: $.data.id }
            - call: "POST /bake-plans/${plid}/lines"
              payload: { product_id: "${pid}", par_qty: 20 }
              as: Manager
              captures: { lid: $.data.id }
            - call: "POST /bake-plans/${plid}/commit"
              payload: {}
              as: Manager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T12:00:00Z" }
              as: Manager
            - call: "POST /bake-lots"
              payload: { bake_plan_line_id: "${lid}", oven_id: "${oid}", baked_qty: 10, produced_at: "2026-06-04T06:00:00Z", slot_start: "2026-06-04T02:00:00Z", slot_end: "2026-06-04T03:00:00Z" }
              as: Manager
              captures: { lot: $.data.id, lv0: $.data.version }
            - call: "POST /retail-sales"
              payload: { bake_lot_id: "${lot}", qty: 2 }
              as: Manager
          trigger:
            - call: "POST /bake-lots/${lot}/markdown"
              payload: { expected_bake_lot_version: "${lv0}" }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_LOT_VERSION"

  # -------------------------------------------------------- consistency_model
  - section: consistency_model
    instances:
      - name: order_create_reserves_par_visible_immediately
        claim_type: immediate
        grounds: [entities.BakePlanLine.fields.reserved_qty, calculations.par_reservation]
        distinguishing_aspect: "Immediately after POST /delivery-orders qty 3 on a par-20 line, GET /bake-plan-lines/{id} shows reserved_qty 3 and available_qty 17 (same-request consistency)."
        test_recipe:
          setup: ["committed line par 20"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "C-20", name: "P20", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { pid: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "A20", credit_limit_cents: 1000000, contract_tier: "STANDARD" }
              as: Manager
              captures: { aid: $.data.id }
            - call: "POST /bake-plans"
              payload: { production_date: "2026-07-01T00:00:00Z" }
              as: Manager
              captures: { plid: $.data.id }
            - call: "POST /bake-plans/${plid}/lines"
              payload: { product_id: "${pid}", par_qty: 20 }
              as: Manager
              captures: { lid: $.data.id }
            - call: "POST /bake-plans/${plid}/commit"
              payload: {}
              as: Manager
            - call: "POST /delivery-orders"
              payload: { wholesale_account_id: "${aid}", product_id: "${pid}", bake_plan_line_id: "${lid}", delivery_date: "2026-07-01T10:00:00Z", qty: 3 }
              as: Manager
          trigger:
            - call: "GET /bake-plan-lines/${lid}"
              payload: {}
              as: Manager
          assert:
            - "BakePlanLine.${lid}.reserved_qty == 3"
            - "BakePlanLine.${lid}.available_qty == 17"

  # ---------------------------------------------------------- endpoints (FK)
  - section: endpoints
    instances:
      - name: create_order_nonexistent_line_returns_not_found
        claim_type: Cross-reference link
        grounds: ["errors[ERR_BAKE_PLAN_LINE_NOT_FOUND]", entities.DeliveryOrder.fields.bake_plan_line_id]
        distinguishing_aspect: "Creating an order with an unknown bake_plan_line_id returns ERR_BAKE_PLAN_LINE_NOT_FOUND (FK existence)."
        test_recipe:
          setup: ["a product and account exist; no such line"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "C-21", name: "P21", category: "BREAD", base_price_cents: 400, shelf_life_hours: 12 }
              as: Manager
              captures: { pid: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { name: "A21", credit_limit_cents: 1000000, contract_tier: "STANDARD" }
              as: Manager
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /delivery-orders"
              payload: { wholesale_account_id: "${aid}", product_id: "${pid}", bake_plan_line_id: "00000000-0000-0000-0000-000000000000", delivery_date: "2026-07-02T10:00:00Z", qty: 1 }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BAKE_PLAN_LINE_NOT_FOUND"

      - name: statement_for_date_with_no_delivered_orders_is_zero
        claim_type: Computed read
        grounds: [calculations.account_invoice_total]
        distinguishing_aspect: "Statement for an account with no DELIVERED orders on the date returns invoice_total_cents 0 and order_count 0."
        test_recipe:
          setup: ["an account with no orders"]
          setup_api_calls:
            - call: "POST /wholesale-accounts"
              payload: { name: "A22", credit_limit_cents: 1000000, contract_tier: "STANDARD" }
              as: Manager
              captures: { aid: $.data.id }
          trigger:
            - call: "GET /wholesale-accounts/${aid}/statement"
              payload: { delivery_date: "2026-07-03T10:00:00Z" }
              as: Manager
          assert:
            - "statement.invoice_total_cents == 0"
            - "statement.order_count == 0"

  # ------------------------------------------------ excluded_because stubs (§1.8 covers)
  - section: validations
    instances:
      - name: error_insufficient_par_on_over_reserve
        claim_type: Violation to Error
        grounds: ["errors[ERR_INSUFFICIENT_PAR]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / par_availability_zero_boundary
          rationale: "ERR_INSUFFICIENT_PAR is asserted as the reject path of the named §1.8 zero-boundary instance."
      - name: error_stop_window_overlap_on_route
        claim_type: Violation to Error
        grounds: ["errors[ERR_STOP_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / route_stop_window_halfopen_overlap
          rationale: "Half-open route-stop overlap rejection is the trigger of the named §1.8 instance."
      - name: error_oven_slot_conflict_on_bake_lot
        claim_type: Violation to Error
        grounds: ["errors[ERR_OVEN_SLOT_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / oven_slot_buffer_conflict
          rationale: "Oven buffer conflict rejection is the trigger of the named §1.8 instance."
