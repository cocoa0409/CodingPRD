scenario: |
  2962. Public Safety Radio System & Interoperability (regional radio system authority): subscriber
  unit inventory with template management, encryption key loading and over-the-air rekeying, talkgroup
  architecture across agencies with interoperability channels and patch authority, coverage engineering,
  site maintenance and backup power with outage escalation, capacity monitoring during major incidents
  with priority and emergency button handling, member agency user fees, subscriber counts and governance
  decision-making, radio programming change control with version tracking and fleet deployment, dispatch
  console configuration and logging recorder retention, migration planning to next-generation standards

domain_name: public-safety-radio-interoperability
api_prefix: "/radio-system"

complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: compliance / audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - version_pinning_on_approval
    - conditional_feature_flags

  entity_topology: graph
  # graph: Talkgroup <-> Talkgroup many-to-many via InteropPatch; RadioTemplate.supersedes_template_id
  # and TalkpathRequest.preempted_request_id are self-referential edges; SubscriberUnit sits at the
  # junction of MemberAgency / RadioTemplate / Keyset. URL shape is peer collections plus filtered
  # lists (no nested ownership paths for children), with action sub-paths on single resources.

  state_machine_shape: parallel
  # SubscriberUnit carries two independent dimensions (provision_status x key_status); the
  # ProgrammingChangeRequest machine is cyclic (SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED with a
  # revision cap); SiteEvent is branching (OPEN forks by event_class into three divergent arms with
  # different side-effect sets); Site.capacity_mode is compound (driven only by SiteEvent cascades).

  relationship_patterns:
    - one_to_many          # MemberAgency -> SubscriberUnit / Talkgroup; Site -> SiteEvent
    - many_to_many         # Talkgroup <-> Talkgroup through InteropPatch
    - self_referential     # RadioTemplate.supersedes_template_id, TalkpathRequest.preempted_request_id
    - cross_aggregate      # ProgrammingChangeRequest -> RadioTemplate + MemberAgency; TalkpathRequest -> Site + SiteEvent

  role_model: segregation_of_duties
  # A RadioTemplate/ProgrammingChangeRequest author (FleetEngineer X-User-ID) may not be the
  # ChangeControlBoard reviewer of the same request; a Keyset's KeyCustodian creator may not be the
  # SecurityOfficer who approves it. Both are enforced by comparing X-User-ID against a stored author id.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: MemberAgency
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the member agency.
        constraints: "1..120 characters"
      - name: agency_code
        type: string
        source: input
        description: Short radio-system code for the agency.
        constraints: "4..6 characters, uppercase A-Z0-9 only, unique across MemberAgency"
      - name: agency_type
        type: enum
        source: input
        description: Service discipline of the agency; drives the statutory recorder-retention minimum.
        constraints: "one of LAW, FIRE, EMS, PUBLIC_WORKS, REGIONAL_AUTHORITY"
      - name: fee_basis
        type: enum
        source: input
        description: Selects which user-fee variant this agency is billed under.
        default: SNAPSHOT
        constraints: "one of SNAPSHOT, PRORATED"
      - name: interop_privilege
        type: enum
        source: input
        description: Interoperability standing granted by the governance board.
        default: MONITOR
        constraints: "one of NONE, MONITOR, PATCH_AUTHORITY"
      - name: console_position_count
        type: integer
        source: input
        description: Number of dispatch console positions configured for this agency.
        default: 1
        constraints: ">= 1 and <= 40"
      - name: recorder_retention_days
        type: integer
        source: input
        description: Configured logging-recorder retention in days for this agency's consoles.
        default: 90
        constraints: ">= 1 and <= 3650"
      - name: billing_status
        type: enum
        source: system
        description: Fee standing; set only by fee assessment and payment side effects.
        default: CURRENT
        constraints: "one of CURRENT, DELINQUENT, SUSPENDED_FROM_VOTING"
      - name: billable_subscriber_count
        type: integer
        source: computed
        description: "Count of SubscriberUnit where agency_id == this.id AND provision_status IN {ASSIGNED, SUSPENDED}."
        default: 0
      - name: last_assessed_fee_cents
        type: integer
        source: computed
        description: Assessed amount produced by the most recent fee assessment for this agency.
        default: 0
      - name: fee_balance_cents
        type: integer
        source: computed
        description: "Outstanding balance; equals lifetime_assessed_cents - lifetime_paid_cents."
        default: 0
      - name: lifetime_assessed_cents
        type: integer
        source: computed
        description: Running sum of every assessed_fee_cents ever booked for this agency.
        default: 0
      - name: lifetime_paid_cents
        type: integer
        source: computed
        description: Running sum of every payment amount_cents ever recorded for this agency.
        default: 0
      - name: last_assessment_period_start
        type: datetime
        source: system
        description: Inclusive start of the most recently assessed billing period; null before first assessment.
      - name: last_assessment_period_end
        type: datetime
        source: system
        description: Exclusive end of the most recently assessed billing period; null before first assessment.
      - name: payment_due_at
        type: datetime
        source: system
        description: last_assessment_period_end plus PAYMENT_GRACE_DAYS; null before first assessment.
      - name: governance_vote_weight
        type: integer
        source: computed
        description: Board voting weight derived from billable_subscriber_count and billing_status.
        default: 1
      - name: voting_eligible
        type: boolean
        source: computed
        description: "True when billing_status != SUSPENDED_FROM_VOTING."
        default: true
      - name: active_patch_request_count
        type: integer
        source: computed
        description: "Count of InteropPatch where requesting_agency_id == this.id AND status IN {REQUESTED, ACTIVE}."
        default: 0

  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: site_code
        type: string
        source: input
        description: Radio site identifier.
        constraints: "3..12 characters, uppercase A-Z0-9 and hyphen, unique across Site"
      - name: name
        type: string
        source: input
        description: Human-readable site name.
        constraints: "1..120 characters"
      - name: channel_capacity
        type: integer
        source: input
        description: Total RF channels installed at the site, including the control channel.
        constraints: ">= 2 and <= 30"
      - name: backup_power_type
        type: enum
        source: input
        description: Backup power plant installed at the site.
        constraints: "one of GENERATOR, BATTERY_ONLY"
      - name: battery_runtime_minutes
        type: integer
        source: input
        description: Rated battery-only runtime in minutes.
        default: 240
        constraints: ">= 0 and <= 2880"
      - name: generator_fuel_hours
        type: number
        source: input
        description: Rated generator runtime in hours on the installed fuel load; ignored when backup_power_type is BATTERY_ONLY.
        default: 0
        constraints: ">= 0 and <= 96, at most 2 decimal places"
      - name: covered_test_points
        type: integer
        source: input
        description: Drive-test points meeting the delivered-audio-quality target; set by coverage submission.
        default: 0
        constraints: ">= 0 and <= total_test_points"
      - name: total_test_points
        type: integer
        source: input
        description: Total drive-test points in the most recent coverage submission.
        default: 0
        constraints: ">= 0"
      - name: coverage_reliability_pct
        type: number
        source: computed
        description: Derated coverage reliability percentage produced by site_coverage_reliability.
        default: 0
      - name: coverage_derate_tier
        type: enum
        source: computed
        description: Derate tier selected once from the raw coverage percentage.
        default: NONE
        constraints: "one of A, B, C, NONE"
      - name: coverage_class
        type: enum
        source: computed
        description: Service class derived from coverage_reliability_pct; gates encrypted interoperability patches.
        default: UNRATED
        constraints: "one of MISSION_CRITICAL, GENERAL, MARGINAL, UNRATED"
      - name: status
        type: enum
        source: system
        description: Operational status; changed only by SiteEvent side effects.
        default: IN_SERVICE
        constraints: "one of IN_SERVICE, MAINTENANCE, DEGRADED, OFF_AIR"
      - name: capacity_mode
        type: enum
        source: system
        description: Channel-access posture; changed only by SiteEvent side effects.
        default: NORMAL
        constraints: "one of NORMAL, PRIORITY_ONLY, EMERGENCY_ONLY"
      - name: busy_talkpaths
        type: integer
        source: computed
        description: "Count of TalkpathRequest where site_id == this.id AND outcome == GRANTED AND released_at IS NULL."
        default: 0
      - name: peak_talkpaths
        type: integer
        source: computed
        description: High-water mark of busy_talkpaths since the site was created; never decreases.
        default: 0
      - name: granted_request_count
        type: integer
        source: computed
        description: "Count of TalkpathRequest for this site whose outcome has ever been GRANTED (includes later PREEMPTED and RELEASED)."
        default: 0
      - name: busied_request_count
        type: integer
        source: computed
        description: "Count of TalkpathRequest for this site with outcome == BUSIED."
        default: 0
      - name: grade_of_service_pct
        type: number
        source: computed
        description: Grade of service produced by site_grade_of_service.
        default: 100.0
      - name: migration_standard
        type: enum
        source: input
        description: Air-interface standard the site infrastructure currently supports.
        default: P25_PHASE1
        constraints: "one of P25_PHASE1, P25_PHASE2, NG_LMR"

  - name: RadioTemplate
    parent: null
    common_fields: true
    fields:
      - name: template_name
        type: string
        source: input
        description: Programming template name.
        constraints: "1..80 characters"
      - name: template_version
        type: integer
        source: computed
        description: Semantic template lineage version; 1 for a root template, otherwise superseded template's template_version + 1.
        default: 1
      - name: supersedes_template_id
        type: string
        source: system
        description: "FK -> RadioTemplate.id; null for a root template, set by the revisions endpoint to the template this revision replaces."
      - name: target_standard
        type: enum
        source: input
        description: Air-interface standard this template programs radios for; drives migration readiness.
        constraints: "one of P25_PHASE1, P25_PHASE2, NG_LMR"
      - name: talkgroup_slot_count
        type: integer
        source: input
        description: Number of talkgroup slots the template exposes in the radio codeplug.
        constraints: ">= 1 and <= 512"
      - name: encryption_required
        type: boolean
        source: input
        description: When true, units programmed with this template must hold a loaded keyset.
        default: false
      - name: status
        type: enum
        source: system
        description: Publication lifecycle of the template.
        default: DRAFT
        constraints: "one of DRAFT, PUBLISHED, RETIRED"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the FleetEngineer who created the template; used by segregation-of-duties checks.
      - name: deployed_unit_count
        type: integer
        source: computed
        description: "Count of SubscriberUnit where template_id == this.id."
        default: 0

  - name: SubscriberUnit
    parent: null
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: "FK -> MemberAgency.id; owning agency of the radio."
      - name: template_id
        type: string
        source: system
        description: "FK -> RadioTemplate.id; null until a lifecycle ASSIGN or a change-request deployment writes a template."
      - name: active_keyset_id
        type: string
        source: system
        description: "FK -> Keyset.id; null until an OTAR campaign execution loads a keyset."
      - name: serial_number
        type: string
        source: input
        description: Manufacturer serial number.
        constraints: "6..24 characters, uppercase A-Z0-9, unique across SubscriberUnit"
      - name: radio_id
        type: integer
        source: input
        description: P25 subscriber unit decimal identifier.
        constraints: ">= 1 and <= 16777215, unique across SubscriberUnit"
      - name: model
        type: enum
        source: input
        description: Form factor of the subscriber unit.
        constraints: "one of PORTABLE, MOBILE, CONTROL_STATION"
      - name: provision_status
        type: enum
        source: system
        description: Provisioning dimension of the unit's parallel state machine.
        default: INVENTORY
        constraints: "one of INVENTORY, ASSIGNED, SUSPENDED, RETIRED"
      - name: key_status
        type: enum
        source: system
        description: Encryption dimension of the unit's parallel state machine; evolves independently of provision_status.
        default: KEYLESS
        constraints: "one of KEYLESS, KEYED, KEY_STALE, ZEROIZED"
      - name: priority_class
        type: integer
        source: input
        description: Channel-access priority; 1 is highest.
        default: 5
        constraints: ">= 1 and <= 10"
      - name: emergency_button_enabled
        type: boolean
        source: input
        description: Whether the radio is provisioned to originate EMERGENCY talkpath requests.
        default: false
      - name: assigned_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent transition into ASSIGNED; null while never assigned.
      - name: retired_at
        type: datetime
        source: system
        description: Logical-clock instant of the transition into RETIRED; null otherwise.
      - name: last_otar_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent successful over-the-air rekey; null if never rekeyed.
      - name: billable
        type: boolean
        source: computed
        description: "True when provision_status IN {ASSIGNED, SUSPENDED}."
        default: false
      - name: days_in_service_last_period
        type: integer
        source: computed
        description: Whole UTC days the unit was billable during the owning agency's most recently assessed period.
        default: 0

  - name: Keyset
    parent: null
    common_fields: true
    fields:
      - name: keyset_name
        type: string
        source: input
        description: Common key reference name for the keyset.
        constraints: "3..40 characters, unique across Keyset"
      - name: algorithm
        type: enum
        source: input
        description: Encryption algorithm the keyset carries.
        constraints: "one of AES256, DES_OFB"
      - name: crypto_period_start
        type: datetime
        source: input
        description: Inclusive start of the crypto period; OTAR windows must fall inside it.
      - name: crypto_period_end
        type: datetime
        source: input
        description: Exclusive end of the crypto period; must be strictly after crypto_period_start.
      - name: status
        type: enum
        source: system
        description: Custody lifecycle of the keyset.
        default: PENDING_APPROVAL
        constraints: "one of PENDING_APPROVAL, ACTIVE, REJECTED, SUPERSEDED, COMPROMISED"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the KeyCustodian who created the keyset; segregation-of-duties input.
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the SecurityOfficer who approved the keyset; null until approved.
      - name: loaded_unit_count
        type: integer
        source: computed
        description: "Count of SubscriberUnit where active_keyset_id == this.id AND key_status == KEYED."
        default: 0
      - name: compromised_at
        type: datetime
        source: system
        description: Logical-clock instant the keyset was declared compromised; null otherwise.

  - name: OtarCampaign
    parent: null
    common_fields: true
    fields:
      - name: keyset_id
        type: string
        source: input
        description: "FK -> Keyset.id; the keyset being pushed over the air."
      - name: agency_id
        type: string
        source: input
        description: "FK -> MemberAgency.id; the agency whose fleet is targeted."
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the rekey window.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the rekey window; must be strictly after window_start.
      - name: status
        type: enum
        source: system
        description: Campaign lifecycle.
        default: SCHEDULED
        constraints: "one of SCHEDULED, COMPLETED, ABORTED"
      - name: target_unit_count
        type: integer
        source: computed
        description: Number of units selected by the campaign at execution time; 0 before execution.
        default: 0
      - name: rekeyed_unit_count
        type: integer
        source: computed
        description: Number of targeted units that reached key_status KEYED during execution.
        default: 0
      - name: failed_unit_count
        type: integer
        source: computed
        description: Number of targeted units that could not be rekeyed during execution.
        default: 0
      - name: executed_at
        type: datetime
        source: system
        description: Logical-clock instant of execution; null while SCHEDULED.

  - name: Talkgroup
    parent: null
    common_fields: true
    fields:
      - name: owner_agency_id
        type: string
        source: input
        description: "FK -> MemberAgency.id; the agency that owns and administers the talkgroup."
      - name: home_site_id
        type: string
        source: input
        description: "FK -> Site.id; the site whose coverage class gates encrypted patching of this talkgroup."
      - name: alias
        type: string
        source: input
        description: Talkgroup alias shown on radios and consoles.
        constraints: "1..16 characters"
      - name: tg_decimal_id
        type: integer
        source: input
        description: P25 talkgroup decimal identifier.
        constraints: ">= 1 and <= 65535, unique across Talkgroup"
      - name: kind
        type: enum
        source: input
        description: Architectural role of the talkgroup.
        constraints: "one of DISPATCH, TACTICAL, INTEROP, ANNOUNCEMENT"
      - name: encryption_mode
        type: enum
        source: input
        description: Encryption posture of the talkgroup; drives patch compatibility and coverage gating.
        constraints: "one of CLEAR, ENCRYPTED, SELECTABLE"
      - name: priority_level
        type: integer
        source: input
        description: Talkgroup priority level; 1 is highest.
        default: 5
        constraints: ">= 1 and <= 10"
      - name: status
        type: enum
        source: system
        description: Availability of the talkgroup.
        default: ACTIVE
        constraints: "one of ACTIVE, LOCKED, DECOMMISSIONED"
      - name: lock_reason
        type: enum
        source: system
        description: Why the talkgroup is LOCKED; reset to NONE on unlock.
        default: NONE
        constraints: "one of NONE, KEY_COMPROMISE, MANUAL"
      - name: active_patch_count
        type: integer
        source: computed
        description: "Count of InteropPatch where (source_talkgroup_id == this.id OR target_talkgroup_id == this.id) AND status IN {REQUESTED, ACTIVE}."
        default: 0

  - name: InteropPatch
    parent: null
    common_fields: true
    fields:
      - name: source_talkgroup_id
        type: string
        source: input
        description: "FK -> Talkgroup.id; the talkgroup initiating the patch."
      - name: target_talkgroup_id
        type: string
        source: input
        description: "FK -> Talkgroup.id; the talkgroup patched to the source."
      - name: requesting_agency_id
        type: string
        source: input
        description: "FK -> MemberAgency.id; the agency exercising patch authority."
      - name: scheduled_start
        type: datetime
        source: input
        description: Inclusive start of the reserved patch window on both talkgroups.
      - name: scheduled_end
        type: datetime
        source: input
        description: Exclusive end of the reserved patch window; must be strictly after scheduled_start.
      - name: status
        type: enum
        source: system
        description: Patch lifecycle.
        default: REQUESTED
        constraints: "one of REQUESTED, ACTIVE, RELEASED, DENIED"
      - name: activated_at
        type: datetime
        source: system
        description: Logical-clock instant the patch was activated; null while REQUESTED or DENIED.
      - name: released_at
        type: datetime
        source: system
        description: Logical-clock instant the patch was released; null while REQUESTED or ACTIVE.
      - name: release_reason
        type: enum
        source: system
        description: Why the patch left ACTIVE.
        default: NONE
        constraints: "one of NONE, OPERATOR, KEY_COMPROMISE, PRIVILEGE_REVOKED, SITE_ESCALATION"
      - name: duration_minutes
        type: number
        source: computed
        description: "Whole minutes between activated_at and released_at; null until released."
      - name: recorder_retention_days_at_activation
        type: integer
        source: system
        description: Snapshot of the requesting agency's recorder_retention_days taken at activation; null before activation.

  - name: SiteEvent
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site the event applies to."
      - name: event_class
        type: enum
        source: input
        description: Configuration flag selecting which arm of the SiteEvent state machine applies.
        constraints: "one of PLANNED_MAINTENANCE, UNPLANNED_OUTAGE, MAJOR_INCIDENT"
      - name: cause
        type: enum
        source: input
        description: Reported cause of the event.
        constraints: "one of COMMERCIAL_POWER_LOSS, LINK_FAILURE, RF_FAULT, SCHEDULED_WORK, INCIDENT_SURGE"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the planned maintenance window; required when event_class is PLANNED_MAINTENANCE, otherwise must be omitted.
      - name: window_end
        type: datetime
        source: input
        description: Inclusive end of the planned maintenance window; required when event_class is PLANNED_MAINTENANCE, otherwise must be omitted.
      - name: detected_at
        type: datetime
        source: system
        description: Logical-clock instant the event record was opened; the origin for backup-power runtime.
      - name: status
        type: enum
        source: system
        description: Event lifecycle; the reachable set depends on event_class.
        default: OPEN
        constraints: "one of OPEN, IN_PROGRESS, ON_BACKUP_POWER, ESCALATED, SURGE_ACTIVE, RESTORED, CLOSED, CANCELLED"
      - name: escalation_tier
        type: integer
        source: system
        description: Outage escalation tier; 0 means not escalated.
        default: 0
        constraints: ">= 0 and <= 3"
      - name: backup_minutes_remaining
        type: number
        source: computed
        description: Remaining backup-power minutes produced by backup_power_runtime; null unless event_class is UNPLANNED_OUTAGE.
      - name: restored_at
        type: datetime
        source: system
        description: Logical-clock instant the site returned to service; null otherwise.
      - name: preempted_talkpath_count
        type: integer
        source: computed
        description: Number of GRANTED talkpaths this event's escalation cascade preempted.
        default: 0

  - name: TalkpathRequest
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site whose channel pool is being requested."
      - name: talkgroup_id
        type: string
        source: input
        description: "FK -> Talkgroup.id; the talkgroup the push-to-talk is addressed to."
      - name: unit_id
        type: string
        source: input
        description: "FK -> SubscriberUnit.id; the radio originating the request."
      - name: site_event_id
        type: string
        source: input
        description: "FK -> SiteEvent.id; the event the traffic is attributed to, or null for routine traffic."
      - name: preempted_request_id
        type: string
        source: system
        description: "FK -> TalkpathRequest.id; on a preempting EMERGENCY request, the request it displaced; null otherwise."
      - name: request_kind
        type: enum
        source: input
        description: Access class of the request.
        constraints: "one of NORMAL, PRIORITY, EMERGENCY"
      - name: outcome
        type: enum
        source: system
        description: Allocation result; PREEMPTED and RELEASED are terminal.
        constraints: "one of GRANTED, BUSIED, PREEMPTED, RELEASED"
      - name: priority_class_at_grant
        type: integer
        source: system
        description: Snapshot of the originating unit's priority_class at decision time; the preemption ranking key.
      - name: available_talkpaths_at_decision
        type: integer
        source: system
        description: Snapshot of the site's available talkpaths computed at decision time.
      - name: reserve_talkpaths_at_decision
        type: integer
        source: system
        description: Snapshot of the surge reserve withheld at decision time.
      - name: granted_at
        type: datetime
        source: system
        description: Logical-clock instant the talkpath was granted; null when BUSIED.
      - name: released_at
        type: datetime
        source: system
        description: Logical-clock instant the talkpath was released or preempted; null while held.
      - name: hold_seconds
        type: number
        source: computed
        description: "Whole seconds between granted_at and released_at; null while held or when BUSIED."

  - name: ProgrammingChangeRequest
    parent: null
    common_fields: true
    fields:
      - name: template_id
        type: string
        source: input
        description: "FK -> RadioTemplate.id; the template this change deploys."
      - name: target_agency_id
        type: string
        source: input
        description: "FK -> MemberAgency.id; the agency whose fleet receives the template."
      - name: title
        type: string
        source: input
        description: Short description of the programming change.
        constraints: "1..120 characters"
      - name: status
        type: enum
        source: system
        description: Change-control lifecycle; cyclic between SUBMITTED and CHANGES_REQUESTED.
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED, DEPLOYING, DEPLOYED, REJECTED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the FleetEngineer who last submitted the request; segregation-of-duties input.
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ChangeControlBoard member who last ruled on the request; null before first review.
      - name: revision_count
        type: integer
        source: system
        description: Number of times the request has re-entered SUBMITTED after CHANGES_REQUESTED.
        default: 0
      - name: review_comment
        type: string
        source: system
        description: Comment recorded with the most recent review decision; null before first review.
      - name: pinned_template_version
        type: integer
        source: system
        description: RadioTemplate.template_version captured at approval; null before approval.
      - name: pinned_template_record_version
        type: integer
        source: system
        description: RadioTemplate.version captured at approval; deployment rejects when the live template's version no longer matches.
      - name: target_unit_count
        type: integer
        source: computed
        description: Number of billable units in the target agency captured at approval; 0 before approval.
        default: 0
      - name: deployed_unit_count
        type: integer
        source: computed
        description: Number of targeted units whose template_id was rewritten during deployment.
        default: 0
      - name: failed_unit_count
        type: integer
        source: computed
        description: Number of targeted units skipped during deployment.
        default: 0
      - name: deployment_started_at
        type: datetime
        source: system
        description: Logical-clock instant deployment began; null before DEPLOYING.
      - name: deployed_at
        type: datetime
        source: system
        description: Logical-clock instant deployment completed; null before DEPLOYED.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Parallel dimensions on one entity: provision_status x key_status ------
  - entity: SubscriberUnit
    initial_state: "provision_status=INVENTORY & key_status=KEYLESS"
    terminal_states: [provision_status=RETIRED, key_status=ZEROIZED]
    note: |
      Two independent dimensions evolve on the same row. Dimension P
      (provision_status) is driven only by POST /units/{unit_id}/lifecycle with
      action IN {ASSIGN, SUSPEND, REINSTATE, RETIRE}. Dimension K (key_status)
      is driven only by OTAR execution, keyset compromise, and
      action == ZEROIZE. No transition in one dimension changes the other:
      an ASSIGN never touches key_status, an OTAR rekey never touches
      provision_status. RETIRED is terminal for P; ZEROIZED is terminal for K.
    transitions:
      - from: "provision_status=INVENTORY"
        to: "provision_status=ASSIGNED"
        trigger: "POST /radio-system/units/{unit_id}/lifecycle action=ASSIGN"
        actor: AgencyRadioManager
        preconditions:
          - "unit.provision_status == INVENTORY"
          - "request body template_id is present and resolves to a RadioTemplate"
          - "that RadioTemplate.status == PUBLISHED (else ERR_TEMPLATE_NOT_PUBLISHED)"
          - "that RadioTemplate.deployed_unit_count < RadioTemplate.talkgroup_slot_count is NOT required; instead Talkgroup count check applies: count of Talkgroup where owner_agency_id == unit.agency_id AND status IN {ACTIVE, LOCKED} <= RadioTemplate.talkgroup_slot_count (else ERR_TEMPLATE_SLOT_CAPACITY_EXCEEDED)"
          - "X-User-ID == unit.agency_id (else ERR_AGENCY_SCOPE_VIOLATION)"
        side_effects:
          - "unit.template_id = body template_id"
          - "unit.assigned_at = logical clock now"
          - "unit.billable = true"
          - "unit.provision_status = ASSIGNED; key_status is left exactly as it was"
          - "owning MemberAgency.billable_subscriber_count recomputed"
          - "owning MemberAgency.governance_vote_weight recomputed via governance_vote_weight"
          - "RadioTemplate.deployed_unit_count recomputed"
      - from: "provision_status=ASSIGNED"
        to: "provision_status=SUSPENDED"
        trigger: "POST /radio-system/units/{unit_id}/lifecycle action=SUSPEND"
        actor: AgencyRadioManager
        preconditions:
          - "unit.provision_status == ASSIGNED"
          - "X-User-ID == unit.agency_id"
        side_effects:
          - "unit.provision_status = SUSPENDED; key_status unchanged (a suspended radio keeps its loaded key)"
          - "unit.billable stays true (SUSPENDED units remain billable)"
          - "every TalkpathRequest for this unit with outcome == GRANTED AND released_at IS NULL is set to outcome = RELEASED, released_at = now; because those talkpaths released, Site.busy_talkpaths is recomputed for each affected site"
      - from: "provision_status=SUSPENDED"
        to: "provision_status=ASSIGNED"
        trigger: "POST /radio-system/units/{unit_id}/lifecycle action=REINSTATE"
        actor: AgencyRadioManager
        preconditions:
          - "unit.provision_status == SUSPENDED"
          - "X-User-ID == unit.agency_id"
        side_effects:
          - "unit.provision_status = ASSIGNED; key_status unchanged"
          - "unit.assigned_at is NOT rewritten (the original assignment instant is preserved for proration)"
        note: "SUSPENDED -> ASSIGNED closes a cycle in dimension P."
      - from: "provision_status IN {INVENTORY, ASSIGNED, SUSPENDED}"
        to: "provision_status=RETIRED"
        trigger: "POST /radio-system/units/{unit_id}/lifecycle action=RETIRE"
        actor: AgencyRadioManager
        preconditions:
          - "unit.provision_status != RETIRED (else ERR_UNIT_RETIRED)"
          - "X-User-ID == unit.agency_id"
        side_effects:
          - "unit.provision_status = RETIRED; unit.retired_at = now; unit.billable = false"
          - "key_status unchanged by this transition"
          - "owning MemberAgency.billable_subscriber_count and governance_vote_weight recomputed"
      - from: "key_status IN {KEYLESS, KEY_STALE}"
        to: "key_status=KEYED"
        trigger: "POST /radio-system/otar-campaigns/{campaign_id}/execute (system rekey of a selected unit)"
        actor: system
        preconditions:
          - "unit.provision_status == ASSIGNED (SUSPENDED units are counted as failures, not rekeyed)"
          - "unit.key_status != ZEROIZED"
          - "campaign keyset.status == ACTIVE"
        side_effects:
          - "unit.key_status = KEYED; unit.active_keyset_id = campaign.keyset_id; unit.last_otar_at = now"
          - "provision_status unchanged"
          - "Keyset.loaded_unit_count recomputed"
      - from: "key_status=KEYED"
        to: "key_status=KEY_STALE"
        trigger: "POST /radio-system/keysets/{keyset_id}/compromise (cascade link 2)"
        actor: system
        preconditions:
          - "unit.active_keyset_id == the compromised keyset id"
          - "unit.key_status == KEYED"
        side_effects:
          - "unit.key_status = KEY_STALE; provision_status unchanged"
      - from: "key_status IN {KEYLESS, KEYED, KEY_STALE}"
        to: "key_status=ZEROIZED"
        trigger: "POST /radio-system/units/{unit_id}/lifecycle action=ZEROIZE"
        actor: AgencyRadioManager
        preconditions:
          - "unit.key_status != ZEROIZED"
          - "X-User-ID == unit.agency_id"
        side_effects:
          - "unit.key_status = ZEROIZED; unit.active_keyset_id = null; provision_status unchanged"
          - "Keyset.loaded_unit_count recomputed for the previously loaded keyset"

  # ---- Cyclic: revision loop with an explicit termination condition ----------
  - entity: ProgrammingChangeRequest
    initial_state: DRAFT
    terminal_states: [DEPLOYED, REJECTED]
    note: "SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED is a true cycle; MAX_REVISIONS bounds it."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /radio-system/change-requests/{change_request_id}/submit"
        actor: FleetEngineer
        preconditions:
          - "change_request.status == DRAFT"
        side_effects:
          - "change_request.submitted_by_user_id = X-User-ID"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /radio-system/change-requests/{change_request_id}/submit"
        actor: FleetEngineer
        preconditions:
          - "change_request.status == CHANGES_REQUESTED"
          - "change_request.revision_count < MAX_REVISIONS (2) (else ERR_REVISION_LIMIT_EXCEEDED)"
        side_effects:
          - "change_request.revision_count += 1"
          - "change_request.submitted_by_user_id = X-User-ID"
        note: "The loop-closing edge; the revision cap is the termination condition."
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /radio-system/change-requests/{change_request_id}/review-decision decision=REQUEST_CHANGES"
        actor: ChangeControlBoard
        preconditions:
          - "change_request.status == SUBMITTED"
          - "X-User-ID != change_request.submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "change_request.reviewed_by_user_id = X-User-ID; change_request.review_comment = body review_comment or null"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /radio-system/change-requests/{change_request_id}/review-decision decision=APPROVE"
        actor: ChangeControlBoard
        preconditions:
          - "change_request.status == SUBMITTED"
          - "X-User-ID != change_request.submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "RadioTemplate(change_request.template_id).status == PUBLISHED (else ERR_TEMPLATE_NOT_PUBLISHED)"
        side_effects:
          - "change_request.pinned_template_version = RadioTemplate.template_version"
          - "change_request.pinned_template_record_version = RadioTemplate.version"
          - "change_request.target_unit_count = count of SubscriberUnit where agency_id == change_request.target_agency_id AND provision_status IN {ASSIGNED, SUSPENDED}"
          - "change_request.reviewed_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /radio-system/change-requests/{change_request_id}/review-decision decision=REJECT"
        actor: ChangeControlBoard
        preconditions:
          - "change_request.status == SUBMITTED"
          - "X-User-ID != change_request.submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "change_request.reviewed_by_user_id = X-User-ID; change_request.review_comment = body review_comment or null"
      - from: APPROVED
        to: DEPLOYING
        trigger: "POST /radio-system/change-requests/{change_request_id}/deploy"
        actor: FleetEngineer
        preconditions:
          - "change_request.status == APPROVED"
          - "RadioTemplate(change_request.template_id).version == change_request.pinned_template_record_version (else ERR_TEMPLATE_VERSION_STALE)"
          - "MemberAgency(change_request.target_agency_id).billing_status != SUSPENDED_FROM_VOTING (else ERR_AGENCY_VOTING_SUSPENDED)"
          - "when RadioTemplate.encryption_required == true, every Site that is the home_site_id of a Talkgroup owned by the target agency with status IN {ACTIVE, LOCKED} has coverage_class IN {MISSION_CRITICAL, GENERAL} (else ERR_COVERAGE_CLASS_INSUFFICIENT)"
        side_effects:
          - "change_request.deployment_started_at = now"
          - "for every SubscriberUnit where agency_id == target_agency_id AND provision_status == ASSIGNED: template_id = change_request.template_id and deployed_unit_count += 1"
          - "for every SubscriberUnit where agency_id == target_agency_id AND provision_status == SUSPENDED: template_id left unchanged and failed_unit_count += 1"
          - "RadioTemplate.deployed_unit_count recomputed"
      - from: DEPLOYING
        to: DEPLOYED
        trigger: "system auto-transition evaluated at the end of the same deploy request"
        actor: system
        preconditions:
          - "change_request.deployed_unit_count + change_request.failed_unit_count == change_request.target_unit_count"
        side_effects:
          - "change_request.deployed_at = now"
        note: "Always fires within the deploy request because the fan-out covers exactly the pinned target set."

  # ---- Branching: OPEN forks by event_class into three divergent arms --------
  - entity: SiteEvent
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    note: |
      OPEN forks three ways on event_class, each arm with a different side-effect
      set: PLANNED_MAINTENANCE -> IN_PROGRESS (Site.status = MAINTENANCE),
      UNPLANNED_OUTAGE -> ON_BACKUP_POWER (Site.status = DEGRADED),
      MAJOR_INCIDENT -> SURGE_ACTIVE (Site.capacity_mode = PRIORITY_ONLY). The
      arms rejoin at CLOSED.
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /radio-system/site-events/{event_id}/advance action=START"
        actor: RFEngineer
        preconditions:
          - "site_event.status == OPEN"
          - "site_event.event_class == PLANNED_MAINTENANCE (else ERR_INVALID_STATE_TRANSITION)"
          - "logical clock now >= site_event.window_start"
        side_effects:
          - "Site.status = MAINTENANCE"
      - from: OPEN
        to: ON_BACKUP_POWER
        trigger: "POST /radio-system/site-events/{event_id}/advance action=BACKUP_ENGAGED"
        actor: RFEngineer
        preconditions:
          - "site_event.status == OPEN"
          - "site_event.event_class == UNPLANNED_OUTAGE (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Site.status = DEGRADED"
          - "site_event.backup_minutes_remaining recomputed via backup_power_runtime"
      - from: OPEN
        to: SURGE_ACTIVE
        trigger: "POST /radio-system/site-events/{event_id}/advance action=DECLARE_SURGE"
        actor: SystemAdmin
        preconditions:
          - "site_event.status == OPEN"
          - "site_event.event_class == MAJOR_INCIDENT (else ERR_INVALID_STATE_TRANSITION)"
          - "Site.status != OFF_AIR (else ERR_SITE_OFF_AIR)"
        side_effects:
          - "Site.capacity_mode = PRIORITY_ONLY; Site.status unchanged"
      - from: ON_BACKUP_POWER
        to: ESCALATED
        trigger: "POST /radio-system/site-events/{event_id}/advance action=ESCALATE"
        actor: RFEngineer
        preconditions:
          - "site_event.status IN {ON_BACKUP_POWER, ESCALATED}"
          - "escalation_tier_for(backup_minutes_remaining) > site_event.escalation_tier (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "site_event.escalation_tier = escalation_tier_for(backup_minutes_remaining)"
          - "when the new escalation_tier == 3: Site.capacity_mode = EMERGENCY_ONLY, and Site.status = OFF_AIR if site_event.backup_minutes_remaining == 0 else DEGRADED (cascade link 2)"
          - "because Site.capacity_mode became EMERGENCY_ONLY: every TalkpathRequest for that site with outcome == GRANTED, released_at IS NULL and request_kind == NORMAL becomes outcome = PREEMPTED, released_at = now, ordered by priority_class_at_grant DESC then created_at ASC; site_event.preempted_talkpath_count = number of such requests (cascade link 3)"
          - "because those talkpaths were preempted: Site.busy_talkpaths and Site.grade_of_service_pct are recomputed (cascade link 4)"
          - "also when the new escalation_tier == 3: every InteropPatch with status IN {REQUESTED, ACTIVE} whose source or target Talkgroup has home_site_id == site.id becomes status = RELEASED, released_at = now, release_reason = SITE_ESCALATION, duration_minutes recomputed; Talkgroup.active_patch_count and MemberAgency.active_patch_request_count are then recomputed for every row touched (cascade link 5)"
      - from: ESCALATED
        to: ESCALATED
        trigger: "POST /radio-system/site-events/{event_id}/advance action=ESCALATE (further tier)"
        actor: RFEngineer
        preconditions:
          - "site_event.status == ESCALATED"
          - "escalation_tier_for(backup_minutes_remaining) > site_event.escalation_tier"
        side_effects:
          - "same side-effect set as ON_BACKUP_POWER -> ESCALATED"
        note: "Self-loop that raises the tier monotonically; never lowers it."
      - from: "status IN {ON_BACKUP_POWER, ESCALATED}"
        to: RESTORED
        trigger: "POST /radio-system/site-events/{event_id}/advance action=RESTORE"
        actor: RFEngineer
        preconditions:
          - "site_event.status IN {ON_BACKUP_POWER, ESCALATED}"
        side_effects:
          - "site_event.restored_at = now; site_event.backup_minutes_remaining = null"
          - "Site.status = IN_SERVICE; Site.capacity_mode = NORMAL"
      - from: "status IN {IN_PROGRESS, SURGE_ACTIVE, RESTORED}"
        to: CLOSED
        trigger: "POST /radio-system/site-events/{event_id}/advance action=CLOSE"
        actor: RFEngineer
        preconditions:
          - "site_event.status IN {IN_PROGRESS, SURGE_ACTIVE, RESTORED}"
        side_effects:
          - "Site.status = IN_SERVICE; Site.capacity_mode = NORMAL"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /radio-system/site-events/{event_id}/advance action=CANCEL"
        actor: RFEngineer
        preconditions:
          - "site_event.status == OPEN"
        side_effects:
          - "no change to Site (the event never engaged)"

  # ---- Keyset custody -------------------------------------------------------
  - entity: Keyset
    initial_state: PENDING_APPROVAL
    terminal_states: [REJECTED, SUPERSEDED, COMPROMISED]
    transitions:
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /radio-system/keysets/{keyset_id}/approval decision=APPROVE"
        actor: SecurityOfficer
        preconditions:
          - "keyset.status == PENDING_APPROVAL"
          - "X-User-ID != keyset.created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "keyset.approved_by_user_id = X-User-ID"
          - "every other Keyset with the same algorithm and status == ACTIVE whose crypto_period_end <= this keyset.crypto_period_start becomes SUPERSEDED"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /radio-system/keysets/{keyset_id}/approval decision=REJECT"
        actor: SecurityOfficer
        preconditions:
          - "keyset.status == PENDING_APPROVAL"
          - "X-User-ID != keyset.created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "keyset.approved_by_user_id stays null"
      - from: ACTIVE
        to: COMPROMISED
        trigger: "POST /radio-system/keysets/{keyset_id}/compromise"
        actor: SecurityOfficer
        preconditions:
          - "keyset.status == ACTIVE (else ERR_KEYSET_NOT_ACTIVE)"
        side_effects:
          - "keyset.compromised_at = now; keyset.loaded_unit_count = 0 (cascade link 1)"
          - "because the keyset was compromised: every SubscriberUnit with active_keyset_id == keyset.id AND key_status == KEYED becomes key_status = KEY_STALE (cascade link 2)"
          - "because those units went KEY_STALE: every Talkgroup with encryption_mode == ENCRYPTED, status == ACTIVE, whose owner_agency_id now has zero SubscriberUnit with key_status == KEYED becomes status = LOCKED, lock_reason = KEY_COMPROMISE (cascade link 3)"
          - "because those talkgroups became LOCKED: every InteropPatch with status IN {REQUESTED, ACTIVE} referencing a newly LOCKED talkgroup as source or target becomes status = RELEASED, released_at = now, release_reason = KEY_COMPROMISE (cascade link 4)"
          - "because those patches were released: Talkgroup.active_patch_count and MemberAgency.active_patch_request_count are recomputed for every talkgroup and agency touched (cascade link 5)"
          - "every OtarCampaign with keyset_id == keyset.id AND status == SCHEDULED becomes ABORTED"

  # ---- Talkgroup availability (cyclic lock/unlock) ---------------------------
  - entity: Talkgroup
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: LOCKED
        trigger: "POST /radio-system/talkgroups/{talkgroup_id}/status action=LOCK"
        actor: AgencyRadioManager
        preconditions:
          - "talkgroup.status == ACTIVE"
          - "X-User-ID == talkgroup.owner_agency_id"
        side_effects:
          - "talkgroup.lock_reason = MANUAL"
          - "every InteropPatch with status IN {REQUESTED, ACTIVE} referencing this talkgroup becomes RELEASED, released_at = now, release_reason = OPERATOR; talkgroup.active_patch_count recomputed"
      - from: LOCKED
        to: ACTIVE
        trigger: "POST /radio-system/talkgroups/{talkgroup_id}/status action=UNLOCK"
        actor: AgencyRadioManager
        preconditions:
          - "talkgroup.status == LOCKED"
          - "X-User-ID == talkgroup.owner_agency_id"
          - "when talkgroup.lock_reason == KEY_COMPROMISE, the owner agency has at least one SubscriberUnit with key_status == KEYED (else ERR_KEYSET_NOT_ACTIVE)"
        side_effects:
          - "talkgroup.lock_reason = NONE"
        note: "Closes the ACTIVE <-> LOCKED cycle."
      - from: "status IN {ACTIVE, LOCKED}"
        to: DECOMMISSIONED
        trigger: "POST /radio-system/talkgroups/{talkgroup_id}/status action=DECOMMISSION"
        actor: AgencyRadioManager
        preconditions:
          - "talkgroup.status != DECOMMISSIONED (else ERR_ALREADY_TERMINAL)"
          - "X-User-ID == talkgroup.owner_agency_id"
        side_effects:
          - "every InteropPatch with status IN {REQUESTED, ACTIVE} referencing this talkgroup becomes RELEASED, release_reason = OPERATOR"

  # ---- Interoperability patch ------------------------------------------------
  - entity: InteropPatch
    initial_state: REQUESTED
    terminal_states: [RELEASED, DENIED]
    transitions:
      - from: REQUESTED
        to: ACTIVE
        trigger: "POST /radio-system/interop-patches/{patch_id}/decision decision=ACTIVATE"
        actor: Dispatcher
        preconditions:
          - "patch.status == REQUESTED"
          - "X-User-ID == patch.requesting_agency_id"
          - "MemberAgency(patch.requesting_agency_id).interop_privilege == PATCH_AUTHORITY (else ERR_PATCH_AUTHORITY_REQUIRED)"
          - "MemberAgency(patch.requesting_agency_id).recorder_retention_days >= PATCH_RETENTION_MIN_DAYS (180) (else ERR_RECORDER_RETENTION_BELOW_MINIMUM)"
          - "both referenced Talkgroups have status == ACTIVE (else ERR_TALKGROUP_LOCKED)"
          - "logical clock now is inside [patch.scheduled_start, patch.scheduled_end) (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "patch.activated_at = now; patch.recorder_retention_days_at_activation = requesting agency's recorder_retention_days"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /radio-system/interop-patches/{patch_id}/decision decision=DENY"
        actor: Dispatcher
        preconditions:
          - "patch.status == REQUESTED"
          - "X-User-ID == patch.requesting_agency_id"
        side_effects:
          - "Talkgroup.active_patch_count recomputed for both talkgroups; MemberAgency.active_patch_request_count recomputed"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /radio-system/interop-patches/{patch_id}/release"
        actor: Dispatcher
        preconditions:
          - "patch.status == ACTIVE"
          - "X-User-ID == patch.requesting_agency_id"
        side_effects:
          - "patch.released_at = now; patch.release_reason = OPERATOR; patch.duration_minutes recomputed"
          - "Talkgroup.active_patch_count recomputed for both talkgroups; MemberAgency.active_patch_request_count recomputed"
      - from: "status IN {REQUESTED, ACTIVE}"
        to: RELEASED
        trigger: "system cascade from keyset compromise, talkgroup lock/decommission, governance sanction, or site escalation"
        actor: system
        preconditions:
          - "patch.status IN {REQUESTED, ACTIVE}"
        side_effects:
          - "patch.released_at = now; patch.release_reason set to KEY_COMPROMISE, PRIVILEGE_REVOKED, SITE_ESCALATION or OPERATOR according to the originating cascade"
          - "Talkgroup.active_patch_count and MemberAgency.active_patch_request_count recomputed"

  # ---- Talkpath allocation (append-only decisions, releasable) ---------------
  - entity: TalkpathRequest
    initial_state: "outcome set at creation (GRANTED or BUSIED)"
    terminal_states: [BUSIED, PREEMPTED, RELEASED]
    transitions:
      - from: "(none)"
        to: GRANTED
        trigger: "POST /radio-system/talkpath-requests"
        actor: Dispatcher
        preconditions:
          - "talkpath_grant_decision evaluates to GRANT for this request_kind"
        side_effects:
          - "request.granted_at = now; request.priority_class_at_grant = unit.priority_class"
          - "Site.busy_talkpaths += 1; Site.peak_talkpaths = max(Site.peak_talkpaths, Site.busy_talkpaths); Site.granted_request_count += 1; Site.grade_of_service_pct recomputed"
          - "when the grant required preemption: the displaced TalkpathRequest becomes outcome = PREEMPTED, released_at = now, and request.preempted_request_id is set to it; Site.busy_talkpaths therefore nets to its prior value"
      - from: "(none)"
        to: BUSIED
        trigger: "POST /radio-system/talkpath-requests"
        actor: Dispatcher
        preconditions:
          - "talkpath_grant_decision evaluates to BUSY for this request_kind"
        side_effects:
          - "request.granted_at stays null; Site.busied_request_count += 1; Site.grade_of_service_pct recomputed"
        note: "The request row is still persisted with a 201 so grade of service is auditable."
      - from: GRANTED
        to: RELEASED
        trigger: "POST /radio-system/talkpath-requests/{request_id}/release"
        actor: Dispatcher
        preconditions:
          - "request.outcome == GRANTED AND request.released_at IS NULL (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID == Talkgroup(request.talkgroup_id).owner_agency_id"
        side_effects:
          - "request.released_at = now; request.hold_seconds recomputed"
          - "Site.busy_talkpaths -= 1; Site.peak_talkpaths unchanged"
      - from: GRANTED
        to: PREEMPTED
        trigger: "system cascade from an EMERGENCY grant or a tier-3 site escalation"
        actor: system
        preconditions:
          - "request.outcome == GRANTED AND request.released_at IS NULL"
        side_effects:
          - "request.released_at = now; request.hold_seconds recomputed; Site.busy_talkpaths recomputed"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: agency-fee-reassessment-stale
    parent_entity: MemberAgency
    write_endpoint: "POST /radio-system/agencies/{agency_id}/fee-assessments"
    occ_field: "expected_agency_version"
    description: |
      Booking a fee assessment against a MemberAgency whose version has advanced
      since the client last read it is rejected. Re-assessment is legitimate by
      product design - a later assessment supersedes an earlier one for the same
      period and rebases fee_balance_cents - so the write cannot be rejected by a
      state precondition; the stale-version check is what keeps the ledger from
      being rebased off an out-of-date balance.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: site-coverage-resubmission-stale
    parent_entity: Site
    write_endpoint: "PATCH /radio-system/sites/{site_id}/coverage"
    occ_field: "expected_site_version"
    description: |
      Submitting drive-test results against a Site whose version has advanced
      since the client last read it is rejected. A later coverage submission
      legitimately supersedes the previous one (a fresh drive test always wins),
      so no state precondition blocks it; the stale-version check prevents an
      engineer from overwriting a newer survey with an older worksheet.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: template-revision-stale
    parent_entity: RadioTemplate
    write_endpoint: "POST /radio-system/templates/{template_id}/revisions"
    occ_field: "expected_template_version"
    description: |
      Creating a revision of a RadioTemplate whose version has advanced since the
      client last read it is rejected. Branching a second revision off the same
      parent is legitimate product behaviour (each revision supersedes the parent
      and bumps its version), so a state precondition cannot catch it; the
      stale-version check forces the author to re-read the lineage first.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: agency_fee_assessment
    trigger: "POST /radio-system/agencies/{agency_id}/fee-assessments (writes MemberAgency.last_assessed_fee_cents, lifetime_assessed_cents, fee_balance_cents, payment_due_at, billing_status)"
    algorithm: tiered_pricing
    formula: |
      # ---------------------------------------------------------------------
      # Evaluation order is fixed and MUST NOT be reordered.
      # step 1: pick the basis variant from MemberAgency.fee_basis
      # step 2: compute tier_subtotal_cents (rounding order differs per variant)
      # step 3: surcharge_cents from tier_subtotal_cents
      # step 4: late_fee_cents from the PRIOR fee_balance_cents (before step 5)
      # step 5: book the assessment
      # ---------------------------------------------------------------------
      period_days = whole UTC days in [period_start, period_end)      # exact count, not 30

      # ---- step 2, variant SNAPSHOT (fee_basis == SNAPSHOT) ----------------
      n = count of SubscriberUnit where agency_id == agency.id
              AND provision_status IN {ASSIGNED, SUSPENDED}
      t1 = min(n, TIER_1_MAX_UNITS) * TIER_1_RATE_CENTS
      t2 = max(0, min(n, TIER_2_MAX_UNITS) - TIER_1_MAX_UNITS) * TIER_2_RATE_CENTS
      t3 = max(0, n - TIER_2_MAX_UNITS) * TIER_3_RATE_CENTS
      tier_subtotal_cents = round_half_up(t1, 0) + round_half_up(t2, 0) + round_half_up(t3, 0)

      # ---- step 2, variant PRORATED (fee_basis == PRORATED) ----------------
      # candidate units: agency's units with provision_status IN {ASSIGNED, SUSPENDED, RETIRED}
      # ordered by created_at ASC to assign the 1-based tier rank (never by id).
      for each candidate unit U at 1-based rank r in that order:
          days_in_service(U) = count of whole UTC days D in [period_start, period_end)
                               such that U.assigned_at IS NOT NULL
                                     AND U.assigned_at <= D 00:00:00Z
                                     AND (U.retired_at IS NULL OR U.retired_at > D 00:00:00Z)
          rate(r) = TIER_1_RATE_CENTS  if r <= TIER_1_MAX_UNITS
                    TIER_2_RATE_CENTS  if TIER_1_MAX_UNITS < r <= TIER_2_MAX_UNITS
                    TIER_3_RATE_CENTS  otherwise
          unit_fee_cents(U) = round_half_up(rate(r) * days_in_service(U) / period_days, 0)
      tier_subtotal_cents = SUM over candidate units of unit_fee_cents(U)
      # ROUNDING ORDER IS PINNED: round PER UNIT to whole cents, THEN sum.
      # Summing the fractional per-unit amounts and rounding once at the end is
      # WRONG and produces a different total (off-by-cents).

      # ---- step 3 ----------------------------------------------------------
      surcharge_cents = round_half_up(tier_subtotal_cents * PATCH_AUTHORITY_SURCHARGE_BP / 10000, 0)
                        if agency.interop_privilege == PATCH_AUTHORITY else 0

      # ---- step 4 (uses the balance as it stands BEFORE this assessment) ----
      prior_balance = agency.fee_balance_cents
      late_fee_cents = round_half_up(prior_balance * LATE_FEE_BP / 10000, 0) if prior_balance > 0 else 0

      assessed_fee_cents = tier_subtotal_cents + surcharge_cents + late_fee_cents

      # ---- step 5 ----------------------------------------------------------
      agency.last_assessed_fee_cents  = assessed_fee_cents
      agency.lifetime_assessed_cents += assessed_fee_cents
      agency.fee_balance_cents        = agency.lifetime_assessed_cents - agency.lifetime_paid_cents
      agency.last_assessment_period_start = period_start
      agency.last_assessment_period_end   = period_end
      agency.payment_due_at = period_end + PAYMENT_GRACE_DAYS days
      # billing_status is then recomputed by agency_billing_status_recompute
    input_set: |
      SNAPSHOT counts only units whose current provision_status is ASSIGNED or
      SUSPENDED (INVENTORY and RETIRED are excluded outright). PRORATED walks
      units whose current provision_status is ASSIGNED, SUSPENDED or RETIRED and
      weights each by whole days billable inside the half-open period; a unit
      that was never assigned contributes 0. Tier ranks are assigned in
      created_at ASC order over that same candidate list.
    constants:
      TIER_1_MAX_UNITS: 50
      TIER_2_MAX_UNITS: 200
      TIER_1_RATE_CENTS: 4200
      TIER_2_RATE_CENTS: 3600
      TIER_3_RATE_CENTS: 3100
      PATCH_AUTHORITY_SURCHARGE_BP: 800
      LATE_FEE_BP: 150
      PAYMENT_GRACE_DAYS: 30
    precision: "whole cents, round_half_up at every round_half_up(...) call site; no intermediate float truncation"
    variants:
      - name: SNAPSHOT
        when: "MemberAgency.fee_basis == SNAPSHOT"
        difference: "Headcount at assessment time is tiered once; every billable unit pays a full period regardless of when it entered service. Rounding happens per TIER."
      - name: PRORATED
        when: "MemberAgency.fee_basis == PRORATED"
        difference: "Each unit pays rate * days_in_service / period_days, rounded to cents PER UNIT and then summed. For the same fleet this yields a strictly smaller (and differently rounded) total than SNAPSHOT whenever any unit was in service for fewer than period_days days."

  - name: agency_billing_status_recompute
    trigger: "end of POST /radio-system/agencies/{agency_id}/fee-assessments and of POST /radio-system/agencies/{agency_id}/payments (writes MemberAgency.billing_status and cascades)"
    algorithm: threshold
    formula: |
      now = logical clock
      if agency.fee_balance_cents <= 0:
          target = CURRENT
      elif agency.payment_due_at IS NOT NULL and now >= agency.payment_due_at + VOTING_SUSPENSION_GRACE_DAYS days:
          target = SUSPENDED_FROM_VOTING
      elif agency.payment_due_at IS NOT NULL and now >= agency.payment_due_at:
          target = DELINQUENT
      else:
          target = CURRENT
      agency.billing_status = target
      # cascade link 2: because billing_status became SUSPENDED_FROM_VOTING,
      #   agency.governance_vote_weight = 0 and agency.voting_eligible = false
      # cascade link 3: because voting eligibility was lost, an agency holding
      #   interop_privilege == PATCH_AUTHORITY is downgraded to MONITOR
      # cascade link 4: because interop_privilege was downgraded, every
      #   InteropPatch with requesting_agency_id == agency.id and status IN
      #   {REQUESTED, ACTIVE} becomes RELEASED with release_reason = PRIVILEGE_REVOKED
      # cascade link 5: because those patches were released, active_patch_count on
      #   every touched Talkgroup and agency.active_patch_request_count are recomputed
    input_set: "The agency row itself plus its own patches; no other agency is inspected."
    constants:
      VOTING_SUSPENSION_GRACE_DAYS: 60
    precision: "integer cents comparison; all instant comparisons use >= against the logical clock"

  - name: governance_vote_weight
    trigger: "recomputed whenever MemberAgency.billable_subscriber_count or billing_status changes, and read by GET /radio-system/agencies/{agency_id}/governance-standing"
    algorithm: weighted_scoring
    formula: |
      if agency.billing_status == SUSPENDED_FROM_VOTING:
          weight = 0
          voting_eligible = false
      else:
          weight = min(VOTE_WEIGHT_CAP, 1 + floor(agency.billable_subscriber_count / UNITS_PER_EXTRA_VOTE))
          voting_eligible = true
      # board-level aggregate, over ALL MemberAgency rows with voting_eligible == true
      total_eligible_weight  = SUM of governance_vote_weight over those agencies
      quorum_weight_required = ceil(QUORUM_NUMERATOR * total_eligible_weight / QUORUM_DENOMINATOR)
    input_set: "All MemberAgency rows; agencies with voting_eligible == false contribute 0 to total_eligible_weight and are excluded from the sum."
    constants:
      VOTE_WEIGHT_CAP: 5
      UNITS_PER_EXTRA_VOTE: 250
      QUORUM_NUMERATOR: 3
      QUORUM_DENOMINATOR: 5
    precision: "integers only; floor on the weight step, ceil on the quorum step"

  - name: fleet_migration_readiness
    trigger: "GET /radio-system/migration-readiness (read-only projection; writes nothing)"
    algorithm: aggregation
    formula: |
      scope = SubscriberUnit rows where (agency_id filter absent OR agency_id == filter)
              AND provision_status IN {ASSIGNED, SUSPENDED}
      evaluated_unit_count = count(scope)

      strict_ready(U) = U.provision_status == ASSIGNED
                        AND U.key_status == KEYED
                        AND U.template_id IS NOT NULL
                        AND RadioTemplate(U.template_id).target_standard IN {P25_PHASE2, NG_LMR}

      planned_ready(U) = strict_ready(U)
                         OR ( U.provision_status == ASSIGNED
                              AND EXISTS ProgrammingChangeRequest P where
                                    P.target_agency_id == U.agency_id
                                    AND P.status IN {APPROVED, DEPLOYING}
                                    AND RadioTemplate(P.template_id).target_standard IN {P25_PHASE2, NG_LMR} )

      ready_unit_count = count of scope satisfying strict_ready (basis STRICT)
                         or planned_ready (basis PLANNED)
      readiness_pct = 0.0 if evaluated_unit_count == 0
                      else round_half_up(100 * ready_unit_count / evaluated_unit_count, 1)
    input_set: "Only ASSIGNED and SUSPENDED units enter the denominator; INVENTORY and RETIRED units are excluded from both numerator and denominator. SUSPENDED units can never be ready under either basis."
    constants:
      NEXT_GEN_STANDARDS: "[P25_PHASE2, NG_LMR]"
    precision: "one decimal place, round_half_up; exactly 0.0 when the scope is empty"
    variants:
      - name: STRICT
        when: "basis query parameter is absent or equals STRICT"
        difference: "A unit counts only when its own loaded template already targets a next-generation standard and it currently holds a live key."
      - name: PLANNED
        when: "basis query parameter equals PLANNED"
        difference: "Additionally counts ASSIGNED units whose agency has an APPROVED or DEPLOYING change request pinning a next-generation template, even though those radios are still programmed to P25_PHASE1 and may be KEYLESS. For the same fleet this yields a strictly higher percentage whenever such a change request exists."

  - name: site_coverage_reliability
    trigger: "PATCH /radio-system/sites/{site_id}/coverage (writes Site.coverage_reliability_pct, coverage_derate_tier, coverage_class)"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED and single-pass. The derate tier is selected
      # ONCE from raw_pct and is NEVER re-selected from the derated result, even
      # when the derated result falls into a lower tier band. This is what makes
      # the apparent circularity (tier -> derate -> value -> tier) well defined.
      if total_test_points == 0:
          coverage_reliability_pct = 0.0
          coverage_derate_tier     = NONE
          coverage_class           = UNRATED
          stop
      raw_pct = round_half_up(100 * covered_test_points / total_test_points, 2)

      # step 1 - select the tier from raw_pct (once, and only from raw_pct)
      if raw_pct >= TIER_A_MIN_PCT:        tier = A ; derate_pp = TIER_A_DERATE_PP
      elif raw_pct >= TIER_B_MIN_PCT:      tier = B ; derate_pp = TIER_B_DERATE_PP
      else:                                tier = C ; derate_pp = TIER_C_DERATE_PP

      # step 2 - apply the fixed penalties
      backup_penalty_pp = BATTERY_ONLY_PENALTY_PP if site.backup_power_type == BATTERY_ONLY else 0.0
      coverage_reliability_pct = max(0.0, round_half_up(raw_pct - derate_pp - backup_penalty_pp, 1))

      # step 3 - classify from the derated value
      coverage_class = MISSION_CRITICAL if coverage_reliability_pct >= MISSION_CRITICAL_MIN_PCT
                       else GENERAL      if coverage_reliability_pct >= GENERAL_MIN_PCT
                       else MARGINAL
      coverage_derate_tier = tier
    input_set: "Only the two point counts supplied in the request plus the site's own backup_power_type; no other site or event participates."
    constants:
      TIER_A_MIN_PCT: 97.00
      TIER_B_MIN_PCT: 90.00
      TIER_A_DERATE_PP: 0.5
      TIER_B_DERATE_PP: 1.5
      TIER_C_DERATE_PP: 3.0
      BATTERY_ONLY_PENALTY_PP: 2.0
      MISSION_CRITICAL_MIN_PCT: 97.0
      GENERAL_MIN_PCT: 90.0
    precision: "raw_pct to 2 decimal places round_half_up; coverage_reliability_pct to 1 decimal place round_half_up; comparisons use >= at every band edge"

  - name: backup_power_runtime
    trigger: "POST /radio-system/site-events/{event_id}/advance action IN {BACKUP_ENGAGED, ESCALATE} (writes SiteEvent.backup_minutes_remaining and escalation_tier)"
    algorithm: decay_function
    formula: |
      if site_event.event_class != UNPLANNED_OUTAGE:
          backup_minutes_remaining = null ; escalation_tier_for = 0 ; stop
      capacity_minutes = site.battery_runtime_minutes
                         + (0 if site.backup_power_type == BATTERY_ONLY
                            else round_half_up(site.generator_fuel_hours * 60, 0))
      elapsed_minutes = floor((logical clock now - site_event.detected_at) in whole minutes)
      backup_minutes_remaining = max(0, capacity_minutes - elapsed_minutes)

      escalation_tier_for(backup_minutes_remaining) =
          3 if backup_minutes_remaining <= TIER_3_MINUTES
          2 if backup_minutes_remaining <= TIER_2_MINUTES
          1 if backup_minutes_remaining <= TIER_1_MINUTES
          0 otherwise
      # Boundary is inclusive on the LOW side: exactly TIER_1_MINUTES remaining
      # DOES escalate to tier 1; TIER_1_MINUTES + 1 does not.
    input_set: "The event's own detected_at plus the parent Site's backup power plant fields; the generator contribution is dropped entirely for BATTERY_ONLY sites even when generator_fuel_hours is non-zero."
    constants:
      TIER_1_MINUTES: 120
      TIER_2_MINUTES: 60
      TIER_3_MINUTES: 30
    precision: "whole minutes; elapsed time floored, capacity rounded half up, result floored at 0"

  - name: talkpath_grant_decision
    trigger: "POST /radio-system/talkpath-requests (writes TalkpathRequest.outcome, available_talkpaths_at_decision, reserve_talkpaths_at_decision, preempted_request_id)"
    algorithm: waterfall_allocation
    formula: |
      usable   = site.channel_capacity - CONTROL_CHANNELS_RESERVED
      available = usable - site.busy_talkpaths
      reserve   = 0 if site.capacity_mode == NORMAL
                  else min(floor(usable * SURGE_RESERVE_PCT / 100), MAX_RESERVED_TALKPATHS)
      request.available_talkpaths_at_decision = available
      request.reserve_talkpaths_at_decision   = reserve

      if request.request_kind == NORMAL:
          if site.capacity_mode == EMERGENCY_ONLY: outcome = BUSIED   # NORMAL is barred outright
          elif (available - reserve) > 0:          outcome = GRANTED
          else:                                    outcome = BUSIED
          # exact-zero headroom BUSIES: the comparison is > 0, never >= 0

      elif request.request_kind == PRIORITY:
          # PRIORITY may consume the surge reserve but not preempt
          if unit.priority_class > PRIORITY_CLASS_MAX: reject ERR_EMERGENCY_PREEMPTION_NOT_PERMITTED
          elif site.capacity_mode == EMERGENCY_ONLY:   outcome = BUSIED
          elif available > 0:                          outcome = GRANTED
          else:                                        outcome = BUSIED

      else:  # EMERGENCY
          if unit.emergency_button_enabled != true: reject ERR_EMERGENCY_PREEMPTION_NOT_PERMITTED
          elif available > 0:
              outcome = GRANTED ; preempted_request_id = null
          else:
              victim = emergency_preemption_selector(site)
              if victim IS NULL: reject ERR_NO_PREEMPTABLE_TALKPATH
              else:
                  victim.outcome = PREEMPTED ; victim.released_at = now
                  outcome = GRANTED ; preempted_request_id = victim.id
    input_set: "Site.channel_capacity, Site.busy_talkpaths and Site.capacity_mode as they stand at request time, the originating unit's priority_class and emergency_button_enabled, and the request_kind. Requests whose outcome is BUSIED are still persisted."
    constants:
      CONTROL_CHANNELS_RESERVED: 1
      SURGE_RESERVE_PCT: 25
      MAX_RESERVED_TALKPATHS: 4
      PRIORITY_CLASS_MAX: 3
    precision: "integers only; reserve uses floor; every headroom comparison is strictly > 0"

  - name: emergency_preemption_selector
    trigger: "invoked by talkpath_grant_decision for an EMERGENCY request when available <= 0"
    algorithm: chronological
    formula: |
      # (a) eligibility filter - explicit predicate over persisted fields
      candidates = TalkpathRequest rows where site_id == request.site_id
                     AND outcome == GRANTED
                     AND released_at IS NULL
                     AND request_kind == NORMAL
      # (b) ranking expression - least important victim first
      order candidates by priority_class_at_grant DESC
      # (c) tie-break when priority_class_at_grant ties
      then by created_at ASC
      # (d) empty-set fallback
      victim = first row of the ordered list, or NULL when candidates is empty
      # NULL causes talkpath_grant_decision to reject with ERR_NO_PREEMPTABLE_TALKPATH (409)
    input_set: "Only NORMAL grants still held on the same site are preemptable; PRIORITY and EMERGENCY grants are never victims, and already-released rows are excluded."
    constants: {}
    precision: "no arithmetic; ordering is priority_class_at_grant DESC then created_at ASC (id is never consulted)"

  - name: site_grade_of_service
    trigger: "recomputed at the end of every POST /radio-system/talkpath-requests and of every cascade that preempts talkpaths (writes Site.grade_of_service_pct, busy_talkpaths, peak_talkpaths)"
    algorithm: aggregation
    formula: |
      busy_talkpaths = count of TalkpathRequest where site_id == site.id
                         AND outcome == GRANTED AND released_at IS NULL
      peak_talkpaths = max(previous peak_talkpaths, busy_talkpaths)   # monotonic, never lowered
      granted_request_count = count of TalkpathRequest where site_id == site.id
                                AND outcome IN {GRANTED, PREEMPTED, RELEASED}
      busied_request_count  = count of TalkpathRequest where site_id == site.id
                                AND outcome == BUSIED
      denominator = granted_request_count + busied_request_count
      grade_of_service_pct = 100.0 if denominator == 0
                             else round_half_up(100 * granted_request_count / denominator, 1)
    input_set: "Every TalkpathRequest ever created for the site, regardless of site_event_id; PREEMPTED and RELEASED rows still count as grants because the channel was in fact delivered."
    constants: {}
    precision: "one decimal place, round_half_up; exactly 100.0 when the site has no requests at all"

  - name: otar_campaign_outcome
    trigger: "POST /radio-system/otar-campaigns/{campaign_id}/execute (writes OtarCampaign counters and status, SubscriberUnit key fields, Keyset.loaded_unit_count)"
    algorithm: aggregation
    formula: |
      targets = SubscriberUnit rows where agency_id == campaign.agency_id
                  AND provision_status IN {ASSIGNED, SUSPENDED}
                  AND key_status != ZEROIZED
      # processing order is created_at ASC (never id) so counters are reproducible
      target_unit_count = count(targets)
      for each U in targets ordered by created_at ASC:
          if U.provision_status == ASSIGNED:
              U.key_status = KEYED ; U.active_keyset_id = campaign.keyset_id ; U.last_otar_at = now
              rekeyed_unit_count += 1
          else:                                  # SUSPENDED radios cannot be reached OTA
              failed_unit_count += 1
      campaign.executed_at = now
      campaign.status = COMPLETED               # COMPLETED even with failures
      Keyset(campaign.keyset_id).loaded_unit_count =
          count of SubscriberUnit where active_keyset_id == campaign.keyset_id AND key_status == KEYED
    input_set: "Only the campaign agency's non-ZEROIZED billable units are targeted; INVENTORY and RETIRED units are outside the campaign entirely and are not counted in target_unit_count."
    constants: {}
    precision: "integer counters; rekeyed_unit_count + failed_unit_count == target_unit_count always holds after execution"

  - name: patch_duration
    trigger: "POST /radio-system/interop-patches/{patch_id}/release and every cascade that releases an ACTIVE patch (writes InteropPatch.duration_minutes)"
    algorithm: interval_merge
    formula: |
      duration_minutes = null if activated_at IS NULL or released_at IS NULL
                         else floor((released_at - activated_at) in whole minutes)
      # a patch released in the same logical minute it was activated yields 0, not null
    input_set: "The patch's own activated_at and released_at; a patch released straight from REQUESTED (never activated) keeps duration_minutes null."
    constants: {}
    precision: "whole minutes, floored"

  - name: unit_days_in_service
    trigger: "recomputed for every candidate unit during POST /radio-system/agencies/{agency_id}/fee-assessments (writes SubscriberUnit.days_in_service_last_period)"
    algorithm: chronological
    formula: |
      days_in_service_last_period =
        count of whole UTC days D in [period_start, period_end) such that
            unit.assigned_at IS NOT NULL
            AND unit.assigned_at <= D 00:00:00Z
            AND (unit.retired_at IS NULL OR unit.retired_at > D 00:00:00Z)
      # A SUSPENDED interval still counts: suspension does not stop billing.
      # A unit assigned exactly at D 00:00:00Z counts day D (comparison is <=).
    input_set: "The unit's own assigned_at and retired_at against the assessed half-open period; a unit that has never been ASSIGNED contributes 0 days."
    constants: {}
    precision: "whole days, half-open period [period_start, period_end)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty strings"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the eight roles declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: "for AgencyRadioManager and Dispatcher, X-User-ID resolves to an existing MemberAgency id"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints whose roles include AgencyRadioManager or Dispatcher"
  - priority: 5
    category: existence
    check: "path resources are resolved left to right; the first unresolvable path id decides the error"
    error_id: ERR_AGENCY_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id; the concrete error is the *_NOT_FOUND of the segment that failed (agency, site, template, unit, keyset, talkgroup, patch, site event, campaign, change request, talkpath request)"
  - priority: 6
    category: existence
    check: "every foreign-key id supplied in the request body resolves to an existing row, checked in the field order declared by the endpoint's input list"
    error_id: ERR_TEMPLATE_NOT_FOUND
    http_status: 404
    applies_to: "POST /radio-system/units, POST /radio-system/units/{unit_id}/lifecycle, POST /radio-system/talkgroups, POST /radio-system/interop-patches, POST /radio-system/otar-campaigns, POST /radio-system/site-events, POST /radio-system/talkpath-requests, POST /radio-system/change-requests"
  - priority: 7
    category: business_constraint
    check: "request body parses, every required field is present, enum values are members of their declared set, integers are inside their declared range, and datetime fields are ISO-8601 UTC instants ending in `Z` (fractional seconds optional, accepted with 0, 3 or 6 digits); window_end must be strictly after window_start wherever both are supplied"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 8
    category: state
    check: "the OCC field named by the matching concurrency_rules entry equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /radio-system/agencies/{agency_id}/fee-assessments, PATCH /radio-system/sites/{site_id}/coverage, POST /radio-system/templates/{template_id}/revisions"
  - priority: 9
    category: auth
    check: "for AgencyRadioManager and Dispatcher, X-User-ID equals the owning-agency field of the target resource (SubscriberUnit.agency_id, Talkgroup.owner_agency_id, InteropPatch.requesting_agency_id, MemberAgency.id, or Talkgroup(request.talkgroup_id).owner_agency_id for talkpath requests)"
    error_id: ERR_AGENCY_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints whose roles include AgencyRadioManager or Dispatcher"
  - priority: 10
    category: auth
    check: "the acting X-User-ID is not the author of the artefact being ruled on (ChangeControlBoard vs ProgrammingChangeRequest.submitted_by_user_id; SecurityOfficer vs Keyset.created_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /radio-system/change-requests/{change_request_id}/review-decision, POST /radio-system/keysets/{keyset_id}/approval"
  - priority: 11
    category: state
    check: "the target resource is not already in a terminal state for this operation"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /radio-system/talkgroups/{talkgroup_id}/status, POST /radio-system/site-events/{event_id}/advance, POST /radio-system/interop-patches/{patch_id}/decision, POST /radio-system/interop-patches/{patch_id}/release, POST /radio-system/change-requests/{change_request_id}/submit, POST /radio-system/change-requests/{change_request_id}/review-decision, POST /radio-system/change-requests/{change_request_id}/deploy"
  - priority: 12
    category: state
    check: "the requested transition exists from the resource's current state (and, for SiteEvent, from its event_class arm)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints listed in the state machine table"
  - priority: 13
    category: state
    check: "the referenced SubscriberUnit is not RETIRED"
    error_id: ERR_UNIT_RETIRED
    http_status: 409
    applies_to: "POST /radio-system/units/{unit_id}/lifecycle, POST /radio-system/talkpath-requests"
  - priority: 14
    category: state
    check: "the referenced Keyset status is ACTIVE"
    error_id: ERR_KEYSET_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /radio-system/otar-campaigns, POST /radio-system/otar-campaigns/{campaign_id}/execute, POST /radio-system/keysets/{keyset_id}/compromise, POST /radio-system/talkgroups/{talkgroup_id}/status action=UNLOCK when lock_reason == KEY_COMPROMISE"
  - priority: 15
    category: state
    check: "the referenced RadioTemplate status is PUBLISHED"
    error_id: ERR_TEMPLATE_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /radio-system/units/{unit_id}/lifecycle action=ASSIGN, POST /radio-system/change-requests/{change_request_id}/review-decision decision=APPROVE"
  - priority: 16
    category: state
    check: "both talkgroups referenced by an interoperability patch have status ACTIVE"
    error_id: ERR_TALKGROUP_LOCKED
    http_status: 409
    applies_to: "POST /radio-system/interop-patches, POST /radio-system/interop-patches/{patch_id}/decision, POST /radio-system/talkpath-requests"
  - priority: 17
    category: state
    check: "the referenced Site status is not OFF_AIR"
    error_id: ERR_SITE_OFF_AIR
    http_status: 409
    applies_to: "POST /radio-system/talkpath-requests, POST /radio-system/interop-patches, POST /radio-system/site-events/{event_id}/advance action=DECLARE_SURGE"
  - priority: 20
    category: business_safety
    check: "when either talkgroup of a patch has encryption_mode == ENCRYPTED, the home Site of BOTH talkgroups has coverage_class == MISSION_CRITICAL; and when a deployed template has encryption_required == true, no home Site of the target agency's talkgroups has coverage_class == MARGINAL or UNRATED"
    error_id: ERR_COVERAGE_CLASS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /radio-system/interop-patches, POST /radio-system/change-requests/{change_request_id}/deploy"
  - priority: 21
    category: business_safety
    check: "recorder_retention_days is at least the statutory minimum for the agency_type (LAW 180, FIRE 90, EMS 90, PUBLIC_WORKS 30, REGIONAL_AUTHORITY 365) and at least PATCH_RETENTION_MIN_DAYS = 180 when the agency holds or requests interoperability patching"
    error_id: ERR_RECORDER_RETENTION_BELOW_MINIMUM
    http_status: 422
    applies_to: "PATCH /radio-system/agencies/{agency_id}/console-config, POST /radio-system/interop-patches, POST /radio-system/interop-patches/{patch_id}/decision"
  - priority: 22
    category: business_safety
    check: "an EMERGENCY talkpath request originates from a unit with emergency_button_enabled == true, and a PRIORITY request originates from a unit with priority_class <= PRIORITY_CLASS_MAX (3)"
    error_id: ERR_EMERGENCY_PREEMPTION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /radio-system/talkpath-requests"
  - priority: 24
    category: business_temporal
    check: "an OtarCampaign window must not overlap another campaign for the same keyset_id and agency_id whose status is SCHEDULED; intervals are HALF-OPEN [window_start, window_end), so a new window starting exactly at an existing window's end is accepted"
    error_id: ERR_OTAR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /radio-system/otar-campaigns"
  - priority: 25
    category: business_temporal
    check: "an InteropPatch window must not overlap any patch with status IN {REQUESTED, ACTIVE} that references either the source or the target talkgroup; intervals are HALF-OPEN [scheduled_start, scheduled_end), so back-to-back windows sharing an endpoint are accepted"
    error_id: ERR_PATCH_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /radio-system/interop-patches"
  - priority: 26
    category: business_temporal
    check: "a PLANNED_MAINTENANCE SiteEvent window must clear every other PLANNED_MAINTENANCE window on the SAME site with status IN {OPEN, IN_PROGRESS} by more than MAINTENANCE_BUFFER_MINUTES = 45; intervals are CLOSED [window_start, window_end] and the buffer is applied on both sides, so the request is rejected when new.window_start <= existing.window_end + 45min AND existing.window_start <= new.window_end + 45min (a gap of exactly 45 minutes is rejected, 46 minutes is accepted)"
    error_id: ERR_MAINTENANCE_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /radio-system/site-events"
  - priority: 27
    category: business_temporal
    check: "at most MAX_CONCURRENT_MAINTENANCE_SITES = 2 distinct sites may hold PLANNED_MAINTENANCE windows overlapping the same instant region-wide; the new window is rejected when 2 or more OTHER sites already have a PLANNED_MAINTENANCE SiteEvent with status IN {OPEN, IN_PROGRESS} whose HALF-OPEN [window_start, window_end) interval intersects the new one"
    error_id: ERR_MAINTENANCE_CONCURRENCY_CAP
    http_status: 409
    applies_to: "POST /radio-system/site-events"
  - priority: 28
    category: business_referential
    check: "on deployment, RadioTemplate.version still equals ProgrammingChangeRequest.pinned_template_record_version captured at approval"
    error_id: ERR_TEMPLATE_VERSION_STALE
    http_status: 409
    applies_to: "POST /radio-system/change-requests/{change_request_id}/deploy"
  - priority: 29
    category: business_referential
    check: "patch encryption compatibility: if either talkgroup has encryption_mode == ENCRYPTED the other must be ENCRYPTED or SELECTABLE; a CLEAR talkgroup can never be patched to an ENCRYPTED one"
    error_id: ERR_ENCRYPTION_MODE_MISMATCH
    http_status: 422
    applies_to: "POST /radio-system/interop-patches"
  - priority: 30
    category: business_referential
    check: "source_talkgroup_id != target_talkgroup_id"
    error_id: ERR_SELF_PATCH_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /radio-system/interop-patches"
  - priority: 31
    category: business_referential
    check: "the requesting agency owns at least one of the two talkgroups being patched"
    error_id: ERR_INTEROP_PRIVILEGE_INSUFFICIENT
    http_status: 403
    applies_to: "POST /radio-system/interop-patches"
  - priority: 32
    category: business_constraint
    check: "the requesting agency's interop_privilege is PATCH_AUTHORITY"
    error_id: ERR_PATCH_AUTHORITY_REQUIRED
    http_status: 403
    applies_to: "POST /radio-system/interop-patches, POST /radio-system/interop-patches/{patch_id}/decision"
  - priority: 33
    category: business_constraint
    check: "an OtarCampaign window is fully contained in the keyset's crypto period: window_start >= crypto_period_start AND window_end <= crypto_period_end"
    error_id: ERR_OTAR_WINDOW_OUTSIDE_CRYPTO_PERIOD
    http_status: 422
    applies_to: "POST /radio-system/otar-campaigns"
  - priority: 34
    category: business_constraint
    check: "serial_number and radio_id are unique across SubscriberUnit"
    error_id: ERR_DUPLICATE_RADIO_ID
    http_status: 409
    applies_to: "POST /radio-system/units"
  - priority: 35
    category: business_constraint
    check: "tg_decimal_id is unique across Talkgroup, agency_code is unique across MemberAgency, site_code is unique across Site, keyset_name is unique across Keyset"
    error_id: ERR_DUPLICATE_TALKGROUP_ID
    http_status: 409
    applies_to: "POST /radio-system/talkgroups, POST /radio-system/agencies, POST /radio-system/sites, POST /radio-system/keysets"
  - priority: 36
    category: business_constraint
    check: "the count of Talkgroup rows owned by the unit's agency with status IN {ACTIVE, LOCKED} does not exceed the assigned template's talkgroup_slot_count"
    error_id: ERR_TEMPLATE_SLOT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /radio-system/units/{unit_id}/lifecycle action=ASSIGN"
  - priority: 37
    category: business_constraint
    check: "ProgrammingChangeRequest.revision_count < MAX_REVISIONS (2) before a re-submission from CHANGES_REQUESTED"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /radio-system/change-requests/{change_request_id}/submit"
  - priority: 38
    category: business_fiscal
    check: "the acting or target MemberAgency.billing_status is not SUSPENDED_FROM_VOTING"
    error_id: ERR_AGENCY_VOTING_SUSPENDED
    http_status: 403
    applies_to: "POST /radio-system/interop-patches, POST /radio-system/change-requests/{change_request_id}/deploy"
  - priority: 39
    category: business_fiscal
    check: "period_end is strictly after period_start, the period is at most 366 days long, and period_end is not after the logical clock"
    error_id: ERR_FEE_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /radio-system/agencies/{agency_id}/fee-assessments"
  - priority: 40
    category: business_fiscal
    check: "payment amount_cents is >= 1 and does not exceed the agency's current fee_balance_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /radio-system/agencies/{agency_id}/payments"
  - priority: 42
    category: business_constraint
    check: "talkpath_grant_decision finds headroom for the request class, or (for EMERGENCY) a preemptable NORMAL victim exists"
    error_id: ERR_NO_PREEMPTABLE_TALKPATH
    http_status: 409
    applies_to: "POST /radio-system/talkpath-requests"
  - priority: 43
    category: business_constraint
    check: "the logical clock is inside the campaign window [window_start, window_end) at execution time, and inside the patch window [scheduled_start, scheduled_end) at activation time"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "POST /radio-system/otar-campaigns/{campaign_id}/execute, POST /radio-system/interop-patches/{patch_id}/decision"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- logical clock (test-driving endpoint) ---------------------------------
  - method: POST
    path: "/radio-system/_clock/set_current_utc"
    description: "Sets the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and MUST NOT fall back to real wall-clock time. Every deadline, window, crypto period and escalation computation reads this clock."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["no entity is mutated; subsequent requests observe the new instant"]

  # ---- member agencies, fees and governance ---------------------------------
  - method: POST
    path: "/radio-system/agencies"
    description: "Registers a member agency in the regional radio system."
    roles: [SystemAdmin]
    code: 201
    input: [name, agency_code, agency_type, "fee_basis?", "interop_privilege?", "console_position_count?", "recorder_retention_days?"]
    output: MemberAgency
    side_effects: ["billing_status = CURRENT", "governance_vote_weight computed via governance_vote_weight (1 for an empty fleet)"]
  - method: GET
    path: "/radio-system/agencies"
    description: "Lists member agencies with pagination and filtering."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: ["limit?", "offset?", "agency_type?", "billing_status?", "interop_privilege?"]
    output: MemberAgency[]
    side_effects: []
  - method: GET
    path: "/radio-system/agencies/{agency_id}"
    description: "Reads one member agency including its computed fee and governance fields."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: []
    output: MemberAgency
    side_effects: []
  - method: PATCH
    path: "/radio-system/agencies/{agency_id}/console-config"
    description: "Updates the agency's dispatch console position count and logging recorder retention."
    roles: [AgencyRadioManager]
    code: 200
    input: ["console_position_count?", "recorder_retention_days?"]
    output: MemberAgency
    side_effects: ["validates recorder_retention_days against the statutory minimum for agency_type and against PATCH_RETENTION_MIN_DAYS when interop_privilege == PATCH_AUTHORITY", "increments MemberAgency.version by 1"]
  - method: POST
    path: "/radio-system/agencies/{agency_id}/fee-assessments"
    description: "Books a user-fee assessment for one billing period using the agency's fee_basis variant."
    roles: [SystemAdmin]
    code: 200
    input: [period_start, period_end, expected_agency_version]
    output: MemberAgency
    side_effects:
      - "runs agency_fee_assessment; writes last_assessed_fee_cents, lifetime_assessed_cents, fee_balance_cents, last_assessment_period_start, last_assessment_period_end, payment_due_at"
      - "recomputes SubscriberUnit.days_in_service_last_period for every candidate unit via unit_days_in_service"
      - "runs agency_billing_status_recompute, which may cascade billing_status -> governance_vote_weight -> interop_privilege -> InteropPatch releases -> Talkgroup.active_patch_count"
      - "increments MemberAgency.version by 1"
  - method: POST
    path: "/radio-system/agencies/{agency_id}/payments"
    description: "Records a payment against the agency's outstanding user-fee balance."
    roles: [AgencyRadioManager, SystemAdmin]
    code: 200
    input: [amount_cents]
    output: MemberAgency
    side_effects:
      - "lifetime_paid_cents += amount_cents; fee_balance_cents = lifetime_assessed_cents - lifetime_paid_cents"
      - "runs agency_billing_status_recompute; a full payment returns billing_status to CURRENT and restores governance_vote_weight"
      - "increments MemberAgency.version by 1"
  - method: GET
    path: "/radio-system/agencies/{agency_id}/governance-standing"
    description: "Computed read of the agency's board standing and the board-wide quorum threshold."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: []
    output: "{ agency_id: string, billing_status: string, billable_subscriber_count: integer, governance_vote_weight: integer, voting_eligible: boolean, total_eligible_weight: integer, quorum_weight_required: integer }"
    side_effects: []

  # ---- sites and coverage engineering ---------------------------------------
  - method: POST
    path: "/radio-system/sites"
    description: "Registers a radio site with its channel count and backup power plant."
    roles: [SystemAdmin]
    code: 201
    input: [site_code, name, channel_capacity, backup_power_type, "battery_runtime_minutes?", "generator_fuel_hours?", "migration_standard?"]
    output: Site
    side_effects: ["status = IN_SERVICE, capacity_mode = NORMAL, coverage_class = UNRATED, grade_of_service_pct = 100.0"]
  - method: GET
    path: "/radio-system/sites"
    description: "Lists radio sites with pagination and filtering."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: ["limit?", "offset?", "status?", "coverage_class?", "capacity_mode?"]
    output: Site[]
    side_effects: []
  - method: GET
    path: "/radio-system/sites/{site_id}"
    description: "Reads one site including coverage, capacity and grade-of-service fields."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: PATCH
    path: "/radio-system/sites/{site_id}/coverage"
    description: "Submits drive-test results for the site and recomputes its coverage class."
    roles: [RFEngineer]
    code: 200
    input: [covered_test_points, total_test_points, expected_site_version]
    output: Site
    side_effects:
      - "writes covered_test_points and total_test_points"
      - "runs site_coverage_reliability; writes coverage_reliability_pct, coverage_derate_tier, coverage_class"
      - "increments Site.version by 1"

  # ---- radio templates and programming change control ----------------------
  - method: POST
    path: "/radio-system/templates"
    description: "Creates a root (lineage version 1) programming template in DRAFT."
    roles: [FleetEngineer]
    code: 201
    input: [template_name, target_standard, talkgroup_slot_count, "encryption_required?"]
    output: RadioTemplate
    side_effects: ["template_version = 1, supersedes_template_id = null, status = DRAFT, created_by_user_id = X-User-ID"]
  - method: POST
    path: "/radio-system/templates/{template_id}/revisions"
    description: "Creates a revision that supersedes {template_id}; the parent is retired and its version bumped."
    roles: [FleetEngineer]
    code: 201
    input: [template_name, target_standard, talkgroup_slot_count, "encryption_required?", expected_template_version]
    output: RadioTemplate
    side_effects:
      - "new template: template_version = parent.template_version + 1, supersedes_template_id = parent.id, status = DRAFT, created_by_user_id = X-User-ID"
      - "parent RadioTemplate.status = RETIRED and increments parent RadioTemplate.version by 1"
      - "any APPROVED ProgrammingChangeRequest pinned to the parent therefore fails deployment with ERR_TEMPLATE_VERSION_STALE"
  - method: GET
    path: "/radio-system/templates"
    description: "Lists programming templates; filter by supersedes_template_id to walk a lineage forward."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: ["limit?", "offset?", "status?", "target_standard?", "supersedes_template_id?"]
    output: RadioTemplate[]
    side_effects: []
  - method: GET
    path: "/radio-system/templates/{template_id}"
    description: "Reads one programming template."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: []
    output: RadioTemplate
    side_effects: []
  - method: POST
    path: "/radio-system/templates/{template_id}/publish"
    description: "Publishes a DRAFT template so it may be assigned to radios and approved for deployment."
    roles: [FleetEngineer]
    code: 200
    input: []
    output: RadioTemplate
    side_effects: ["status DRAFT -> PUBLISHED", "increments RadioTemplate.version by 1"]
  - method: POST
    path: "/radio-system/change-requests"
    description: "Opens a programming change request in DRAFT against a template and a target agency."
    roles: [FleetEngineer]
    code: 201
    input: [template_id, target_agency_id, title]
    output: ProgrammingChangeRequest
    side_effects: ["status = DRAFT, revision_count = 0"]
  - method: GET
    path: "/radio-system/change-requests"
    description: "Lists programming change requests with pagination and filtering."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: ["limit?", "offset?", "template_id?", "target_agency_id?", "status?"]
    output: ProgrammingChangeRequest[]
    side_effects: []
  - method: GET
    path: "/radio-system/change-requests/{change_request_id}"
    description: "Reads one programming change request including its pinned template versions."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: []
    output: ProgrammingChangeRequest
    side_effects: []
  - method: POST
    path: "/radio-system/change-requests/{change_request_id}/submit"
    description: "Submits a DRAFT or CHANGES_REQUESTED change request for board review."
    roles: [FleetEngineer]
    code: 200
    input: []
    output: ProgrammingChangeRequest
    side_effects: ["status -> SUBMITTED", "submitted_by_user_id = X-User-ID", "revision_count += 1 only on the CHANGES_REQUESTED -> SUBMITTED edge", "increments ProgrammingChangeRequest.version by 1"]
  - method: POST
    path: "/radio-system/change-requests/{change_request_id}/review-decision"
    description: "Records the change control board's ruling; the reviewer may not be the submitter."
    roles: [ChangeControlBoard]
    code: 200
    input: [decision, "review_comment?"]
    output: ProgrammingChangeRequest
    side_effects: ["status -> APPROVED, CHANGES_REQUESTED or REJECTED per decision", "on APPROVE pins pinned_template_version, pinned_template_record_version and target_unit_count", "reviewed_by_user_id = X-User-ID", "increments ProgrammingChangeRequest.version by 1"]
  - method: POST
    path: "/radio-system/change-requests/{change_request_id}/deploy"
    description: "Deploys the approved template across the target agency's fleet."
    roles: [FleetEngineer]
    code: 200
    input: []
    output: ProgrammingChangeRequest
    side_effects: ["status APPROVED -> DEPLOYING then auto-transitions to DEPLOYED in the same request", "rewrites SubscriberUnit.template_id for every ASSIGNED unit of the target agency; SUSPENDED units are counted as failures", "recomputes RadioTemplate.deployed_unit_count"]

  # ---- subscriber unit inventory --------------------------------------------
  - method: POST
    path: "/radio-system/units"
    description: "Adds a subscriber unit to an agency's inventory."
    roles: [AgencyRadioManager]
    code: 201
    input: [agency_id, serial_number, radio_id, model, "priority_class?", "emergency_button_enabled?"]
    output: SubscriberUnit
    side_effects: ["provision_status = INVENTORY, key_status = KEYLESS, template_id = null, active_keyset_id = null, billable = false"]
  - method: GET
    path: "/radio-system/units"
    description: "Lists subscriber units; filter by agency, template, loaded keyset or either state dimension."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: ["limit?", "offset?", "agency_id?", "template_id?", "active_keyset_id?", "provision_status?", "key_status?"]
    output: SubscriberUnit[]
    side_effects: []
  - method: GET
    path: "/radio-system/units/{unit_id}"
    description: "Reads one subscriber unit including both state dimensions."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: []
    output: SubscriberUnit
    side_effects: []
  - method: POST
    path: "/radio-system/units/{unit_id}/lifecycle"
    description: "Drives the unit's provisioning dimension (ASSIGN, SUSPEND, REINSTATE, RETIRE) or zeroizes its keys (ZEROIZE)."
    roles: [AgencyRadioManager]
    code: 200
    input: [action, "template_id?"]
    output: SubscriberUnit
    side_effects:
      - "ASSIGN: writes template_id and assigned_at, provision_status -> ASSIGNED, recomputes MemberAgency.billable_subscriber_count and governance_vote_weight and RadioTemplate.deployed_unit_count"
      - "SUSPEND: provision_status -> SUSPENDED and releases every GRANTED talkpath held by the unit, recomputing Site.busy_talkpaths"
      - "REINSTATE: provision_status -> ASSIGNED without rewriting assigned_at"
      - "RETIRE: provision_status -> RETIRED, retired_at set, billable = false, agency counters recomputed"
      - "ZEROIZE: key_status -> ZEROIZED, active_keyset_id = null, Keyset.loaded_unit_count recomputed; provision_status untouched"
      - "increments SubscriberUnit.version by 1"

  # ---- encryption keys and over-the-air rekeying ----------------------------
  - method: POST
    path: "/radio-system/keysets"
    description: "Creates a keyset in PENDING_APPROVAL under the acting key custodian."
    roles: [KeyCustodian]
    code: 201
    input: [keyset_name, algorithm, crypto_period_start, crypto_period_end]
    output: Keyset
    side_effects: ["status = PENDING_APPROVAL, created_by_user_id = X-User-ID, loaded_unit_count = 0"]
  - method: GET
    path: "/radio-system/keysets"
    description: "Lists keysets with pagination and filtering."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: ["limit?", "offset?", "status?", "algorithm?"]
    output: Keyset[]
    side_effects: []
  - method: GET
    path: "/radio-system/keysets/{keyset_id}"
    description: "Reads one keyset including its loaded unit count."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: []
    output: Keyset
    side_effects: []
  - method: POST
    path: "/radio-system/keysets/{keyset_id}/approval"
    description: "Security officer approves or rejects a pending keyset; the officer may not be its creator."
    roles: [SecurityOfficer]
    code: 200
    input: [decision]
    output: Keyset
    side_effects: ["status PENDING_APPROVAL -> ACTIVE or REJECTED", "on APPROVE, approved_by_user_id = X-User-ID and older ACTIVE keysets of the same algorithm whose crypto period already ended become SUPERSEDED", "increments Keyset.version by 1"]
  - method: POST
    path: "/radio-system/keysets/{keyset_id}/compromise"
    description: "Declares an active keyset compromised, triggering the fleet-wide key invalidation cascade. Takes no body."
    roles: [SecurityOfficer]
    code: 200
    input: []
    output: Keyset
    side_effects:
      - "status ACTIVE -> COMPROMISED, compromised_at = now, loaded_unit_count = 0"
      - "cascade: KEYED units -> KEY_STALE -> ENCRYPTED talkgroups with no remaining keyed radios -> LOCKED -> their patches -> RELEASED -> active_patch_count recomputed"
      - "SCHEDULED OtarCampaign rows for this keyset become ABORTED"
  - method: POST
    path: "/radio-system/otar-campaigns"
    description: "Schedules an over-the-air rekey window for one agency's fleet against an active keyset."
    roles: [KeyCustodian]
    code: 201
    input: [keyset_id, agency_id, window_start, window_end]
    output: OtarCampaign
    side_effects: ["status = SCHEDULED; window is validated against the keyset crypto period and against other SCHEDULED windows for the same keyset and agency"]
  - method: GET
    path: "/radio-system/otar-campaigns"
    description: "Lists OTAR campaigns; filter by keyset or agency."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: ["limit?", "offset?", "keyset_id?", "agency_id?", "status?"]
    output: OtarCampaign[]
    side_effects: []
  - method: GET
    path: "/radio-system/otar-campaigns/{campaign_id}"
    description: "Reads one OTAR campaign including its rekey counters."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: []
    output: OtarCampaign
    side_effects: []
  - method: POST
    path: "/radio-system/otar-campaigns/{campaign_id}/execute"
    description: "Runs the rekey inside the campaign window, loading the keyset into reachable radios."
    roles: [KeyCustodian]
    code: 200
    input: []
    output: OtarCampaign
    side_effects: ["runs otar_campaign_outcome; writes target_unit_count, rekeyed_unit_count, failed_unit_count, executed_at, status = COMPLETED", "ASSIGNED units -> key_status KEYED with active_keyset_id set; SUSPENDED units counted as failures", "recomputes Keyset.loaded_unit_count"]

  # ---- talkgroup architecture and interoperability --------------------------
  - method: POST
    path: "/radio-system/talkgroups"
    description: "Creates a talkgroup owned by the acting agency and homed on a site."
    roles: [AgencyRadioManager]
    code: 201
    input: [owner_agency_id, home_site_id, alias, tg_decimal_id, kind, encryption_mode, "priority_level?"]
    output: Talkgroup
    side_effects: ["status = ACTIVE, lock_reason = NONE, active_patch_count = 0"]
  - method: GET
    path: "/radio-system/talkgroups"
    description: "Lists talkgroups; filter by owning agency, home site, status or kind."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: ["limit?", "offset?", "owner_agency_id?", "home_site_id?", "status?", "kind?"]
    output: Talkgroup[]
    side_effects: []
  - method: GET
    path: "/radio-system/talkgroups/{talkgroup_id}"
    description: "Reads one talkgroup including its active patch count."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: []
    output: Talkgroup
    side_effects: []
  - method: POST
    path: "/radio-system/talkgroups/{talkgroup_id}/status"
    description: "Locks, unlocks or decommissions a talkgroup."
    roles: [AgencyRadioManager]
    code: 200
    input: [action]
    output: Talkgroup
    side_effects: ["LOCK sets lock_reason = MANUAL and releases the talkgroup's patches", "UNLOCK clears lock_reason and requires a keyed radio when the lock came from a key compromise", "DECOMMISSION is terminal and releases the talkgroup's patches", "increments Talkgroup.version by 1"]
  - method: POST
    path: "/radio-system/interop-patches"
    description: "Requests an interoperability patch between two talkgroups for a scheduled window."
    roles: [Dispatcher]
    code: 201
    input: [source_talkgroup_id, target_talkgroup_id, requesting_agency_id, scheduled_start, scheduled_end]
    output: InteropPatch
    side_effects: ["status = REQUESTED", "recomputes Talkgroup.active_patch_count for both talkgroups and MemberAgency.active_patch_request_count"]
  - method: GET
    path: "/radio-system/interop-patches"
    description: "Lists interoperability patches; filter by either talkgroup or the requesting agency."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: ["limit?", "offset?", "source_talkgroup_id?", "target_talkgroup_id?", "requesting_agency_id?", "status?"]
    output: InteropPatch[]
    side_effects: []
  - method: GET
    path: "/radio-system/interop-patches/{patch_id}"
    description: "Reads one interoperability patch including its duration and retention snapshot."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: []
    output: InteropPatch
    side_effects: []
  - method: POST
    path: "/radio-system/interop-patches/{patch_id}/decision"
    description: "Activates or denies a requested patch; activation must happen inside the scheduled window."
    roles: [Dispatcher]
    code: 200
    input: [decision]
    output: InteropPatch
    side_effects: ["ACTIVATE sets status = ACTIVE, activated_at = now and recorder_retention_days_at_activation", "DENY sets status = DENIED and recomputes active patch counters", "increments InteropPatch.version by 1"]
  - method: POST
    path: "/radio-system/interop-patches/{patch_id}/release"
    description: "Releases an active patch and computes its logged duration."
    roles: [Dispatcher]
    code: 200
    input: []
    output: InteropPatch
    side_effects: ["status ACTIVE -> RELEASED, released_at = now, release_reason = OPERATOR, duration_minutes computed", "recomputes Talkgroup.active_patch_count and MemberAgency.active_patch_request_count"]

  # ---- site maintenance, outages and major incidents ------------------------
  - method: POST
    path: "/radio-system/site-events"
    description: "Opens a site event; PLANNED_MAINTENANCE requires a window and is subject to the buffer and region-wide concurrency cap."
    roles: [SystemAdmin, RFEngineer]
    code: 201
    input: [site_id, event_class, cause, "window_start?", "window_end?"]
    output: SiteEvent
    side_effects: ["status = OPEN, detected_at = now, escalation_tier = 0", "no change to the parent Site until the event is advanced"]
  - method: GET
    path: "/radio-system/site-events"
    description: "Lists site events; filter by site, class or status."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: ["limit?", "offset?", "site_id?", "event_class?", "status?"]
    output: SiteEvent[]
    side_effects: []
  - method: GET
    path: "/radio-system/site-events/{event_id}"
    description: "Reads one site event including its escalation tier and remaining backup minutes."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: []
    output: SiteEvent
    side_effects: []
  - method: POST
    path: "/radio-system/site-events/{event_id}/advance"
    description: "Advances a site event along its event_class arm (START, BACKUP_ENGAGED, DECLARE_SURGE, ESCALATE, RESTORE, CLOSE, CANCEL)."
    roles: [SystemAdmin, RFEngineer]
    code: 200
    input: [action]
    output: SiteEvent
    side_effects:
      - "START -> IN_PROGRESS and Site.status = MAINTENANCE"
      - "BACKUP_ENGAGED -> ON_BACKUP_POWER, Site.status = DEGRADED, backup_minutes_remaining computed"
      - "DECLARE_SURGE -> SURGE_ACTIVE and Site.capacity_mode = PRIORITY_ONLY"
      - "ESCALATE raises escalation_tier; at tier 3 it sets Site.capacity_mode = EMERGENCY_ONLY, preempts every held NORMAL talkpath on the site and recomputes busy_talkpaths and grade_of_service_pct"
      - "RESTORE / CLOSE return Site.status to IN_SERVICE and Site.capacity_mode to NORMAL"
      - "increments SiteEvent.version by 1"

  # ---- capacity monitoring: talkpath allocation ----------------------------
  - method: POST
    path: "/radio-system/talkpath-requests"
    description: "Requests a talkpath on a site for a talkgroup; returns the persisted allocation decision including BUSIED outcomes."
    roles: [Dispatcher]
    code: 201
    input: [site_id, talkgroup_id, unit_id, request_kind, "site_event_id?"]
    output: TalkpathRequest
    side_effects:
      - "runs talkpath_grant_decision; writes outcome, available_talkpaths_at_decision, reserve_talkpaths_at_decision, priority_class_at_grant, granted_at"
      - "an EMERGENCY grant with no headroom preempts a victim via emergency_preemption_selector and sets preempted_request_id"
      - "recomputes Site.busy_talkpaths, peak_talkpaths, granted_request_count, busied_request_count and grade_of_service_pct via site_grade_of_service"
  - method: GET
    path: "/radio-system/talkpath-requests"
    description: "Lists talkpath decisions; filter by site, talkgroup, unit, event, outcome, or the request a preemption displaced."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: ["limit?", "offset?", "site_id?", "talkgroup_id?", "unit_id?", "site_event_id?", "preempted_request_id?", "outcome?", "request_kind?"]
    output: TalkpathRequest[]
    side_effects: []
  - method: GET
    path: "/radio-system/talkpath-requests/{request_id}"
    description: "Reads one talkpath decision including its decision-time capacity snapshot."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: []
    output: TalkpathRequest
    side_effects: []
  - method: POST
    path: "/radio-system/talkpath-requests/{request_id}/release"
    description: "Releases a held talkpath, returning the channel to the site pool."
    roles: [Dispatcher]
    code: 200
    input: []
    output: TalkpathRequest
    side_effects: ["outcome GRANTED -> RELEASED, released_at = now, hold_seconds computed", "Site.busy_talkpaths decremented and grade_of_service_pct recomputed; peak_talkpaths unchanged", "increments TalkpathRequest.version by 1"]

  # ---- migration planning ---------------------------------------------------
  - method: GET
    path: "/radio-system/migration-readiness"
    description: "Computed read of next-generation migration readiness under the STRICT or PLANNED basis."
    roles: [SystemAdmin, RFEngineer, FleetEngineer, ChangeControlBoard, KeyCustodian, SecurityOfficer, AgencyRadioManager, Dispatcher]
    code: 200
    input: ["agency_id?", "basis?"]
    output: "{ basis: string, agency_id: string, evaluated_unit_count: integer, ready_unit_count: integer, readiness_pct: number }"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, an unknown role, or an agency-scoped role whose X-User-ID is not an existing MemberAgency id"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_AGENCY_SCOPE_VIOLATION
    http: 403
    condition: "an AgencyRadioManager or Dispatcher acts on a resource whose owning agency id is not its X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the reviewer's X-User-ID equals ProgrammingChangeRequest.submitted_by_user_id, or the approving officer's X-User-ID equals Keyset.created_by_user_id"
  - id: ERR_AGENCY_NOT_FOUND
    http: 404
    condition: "agency_id in the path or an agency foreign key in the body does not resolve"
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "site_id in the path or a site foreign key in the body does not resolve"
  - id: ERR_TEMPLATE_NOT_FOUND
    http: 404
    condition: "template_id in the path or in the body does not resolve"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "unit_id in the path or in the body does not resolve"
  - id: ERR_KEYSET_NOT_FOUND
    http: 404
    condition: "keyset_id in the path or in the body does not resolve"
  - id: ERR_TALKGROUP_NOT_FOUND
    http: 404
    condition: "a talkgroup id in the path or in the body does not resolve"
  - id: ERR_PATCH_NOT_FOUND
    http: 404
    condition: "patch_id in the path does not resolve"
  - id: ERR_SITE_EVENT_NOT_FOUND
    http: 404
    condition: "event_id in the path or site_event_id in the body does not resolve"
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "campaign_id in the path does not resolve"
  - id: ERR_CHANGE_REQUEST_NOT_FOUND
    http: 404
    condition: "change_request_id in the path does not resolve"
  - id: ERR_TALKPATH_REQUEST_NOT_FOUND
    http: 404
    condition: "request_id in the path does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, enum value outside its declared set, integer outside its declared range, non-ISO-8601 datetime, window_end not after window_start, or window fields supplied for a non-PLANNED_MAINTENANCE site event"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_agency_version, expected_site_version or expected_template_version does not equal the parent's current version"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the target resource is already in a terminal state for the requested operation"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested action is not an edge from the resource's current state, is barred by the resource's event_class arm, escalates to a tier not lower than the current one, or is attempted outside a required time window"
  - id: ERR_UNIT_RETIRED
    http: 409
    condition: "the referenced SubscriberUnit has provision_status RETIRED"
  - id: ERR_KEYSET_NOT_ACTIVE
    http: 409
    condition: "the referenced Keyset is not ACTIVE, or a KEY_COMPROMISE-locked talkgroup is unlocked while its agency still has no keyed radio"
  - id: ERR_TEMPLATE_NOT_PUBLISHED
    http: 409
    condition: "the referenced RadioTemplate status is not PUBLISHED"
  - id: ERR_TALKGROUP_LOCKED
    http: 409
    condition: "a talkgroup involved in the operation has status LOCKED or DECOMMISSIONED"
  - id: ERR_SITE_OFF_AIR
    http: 409
    condition: "the referenced Site has status OFF_AIR"
  - id: ERR_COVERAGE_CLASS_INSUFFICIENT
    http: 422
    condition: "an encrypted patch is requested where a home site is not MISSION_CRITICAL, or an encryption-required template is deployed where a target home site is MARGINAL or UNRATED"
  - id: ERR_RECORDER_RETENTION_BELOW_MINIMUM
    http: 422
    condition: "recorder_retention_days is below the statutory minimum for the agency_type or below PATCH_RETENTION_MIN_DAYS for a patching agency"
  - id: ERR_EMERGENCY_PREEMPTION_NOT_PERMITTED
    http: 422
    condition: "an EMERGENCY request comes from a unit with emergency_button_enabled false, or a PRIORITY request comes from a unit whose priority_class exceeds PRIORITY_CLASS_MAX"
  - id: ERR_OTAR_WINDOW_OVERLAP
    http: 409
    condition: "a new OTAR window overlaps a SCHEDULED window for the same keyset and agency under half-open interval semantics"
  - id: ERR_OTAR_WINDOW_OUTSIDE_CRYPTO_PERIOD
    http: 422
    condition: "an OTAR window is not fully contained in the keyset's crypto period"
  - id: ERR_PATCH_WINDOW_OVERLAP
    http: 409
    condition: "a new patch window overlaps a REQUESTED or ACTIVE patch on either talkgroup under half-open interval semantics"
  - id: ERR_MAINTENANCE_BUFFER_VIOLATION
    http: 409
    condition: "a planned maintenance window comes within MAINTENANCE_BUFFER_MINUTES of another planned window on the same site under closed-interval semantics"
  - id: ERR_MAINTENANCE_CONCURRENCY_CAP
    http: 409
    condition: "two other sites already hold planned maintenance windows overlapping the requested window region-wide"
  - id: ERR_TEMPLATE_VERSION_STALE
    http: 409
    condition: "the live RadioTemplate.version no longer matches the change request's pinned_template_record_version"
  - id: ERR_ENCRYPTION_MODE_MISMATCH
    http: 422
    condition: "a CLEAR talkgroup is patched to an ENCRYPTED one"
  - id: ERR_SELF_PATCH_NOT_PERMITTED
    http: 422
    condition: "source_talkgroup_id equals target_talkgroup_id"
  - id: ERR_INTEROP_PRIVILEGE_INSUFFICIENT
    http: 403
    condition: "the requesting agency owns neither of the two talkgroups being patched"
  - id: ERR_PATCH_AUTHORITY_REQUIRED
    http: 403
    condition: "the requesting agency's interop_privilege is not PATCH_AUTHORITY"
  - id: ERR_DUPLICATE_RADIO_ID
    http: 409
    condition: "serial_number or radio_id already exists on another SubscriberUnit"
  - id: ERR_DUPLICATE_TALKGROUP_ID
    http: 409
    condition: "tg_decimal_id, agency_code, site_code or keyset_name already exists on another row of its entity"
  - id: ERR_TEMPLATE_SLOT_CAPACITY_EXCEEDED
    http: 422
    condition: "the agency's live talkgroup count exceeds the assigned template's talkgroup_slot_count"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 422
    condition: "a change request is re-submitted after MAX_REVISIONS revisions"
  - id: ERR_AGENCY_VOTING_SUSPENDED
    http: 403
    condition: "the acting or target agency's billing_status is SUSPENDED_FROM_VOTING"
  - id: ERR_FEE_PERIOD_INVALID
    http: 422
    condition: "period_end is not strictly after period_start, the period exceeds 366 days, or period_end is after the logical clock"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "amount_cents is below 1 or exceeds the agency's outstanding fee_balance_cents"
  - id: ERR_NO_PREEMPTABLE_TALKPATH
    http: 409
    condition: "an EMERGENCY request finds no headroom and the preemption candidate set is empty"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Regional authority operations and finance staff: agency registry, sites, fee assessments, incident declaration, logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /radio-system/agencies"
      - "POST /radio-system/sites"
      - "POST /radio-system/agencies/{agency_id}/fee-assessments"
      - "POST /radio-system/_clock/set_current_utc"
    shared_operations:
      - "POST /radio-system/agencies/{agency_id}/payments (shared with AgencyRadioManager)"
      - "POST /radio-system/site-events and POST /radio-system/site-events/{event_id}/advance (shared with RFEngineer)"
      - "every GET endpoint"
  - name: RFEngineer
    description: "Coverage and site engineering: drive-test submission, maintenance windows, outage handling and escalation."
    identity: opaque
    exclusive_operations:
      - "PATCH /radio-system/sites/{site_id}/coverage"
    shared_operations:
      - "POST /radio-system/site-events and POST /radio-system/site-events/{event_id}/advance (shared with SystemAdmin)"
      - "every GET endpoint"
  - name: FleetEngineer
    description: "Programming template authoring and fleet deployment; authors change requests but never rules on them."
    identity: opaque
    exclusive_operations:
      - "POST /radio-system/templates"
      - "POST /radio-system/templates/{template_id}/revisions"
      - "POST /radio-system/templates/{template_id}/publish"
      - "POST /radio-system/change-requests"
      - "POST /radio-system/change-requests/{change_request_id}/submit"
      - "POST /radio-system/change-requests/{change_request_id}/deploy"
    shared_operations:
      - "every GET endpoint"
  - name: ChangeControlBoard
    description: "Change control board member who rules on submitted programming changes; may never rule on a request it submitted."
    identity: opaque
    exclusive_operations:
      - "POST /radio-system/change-requests/{change_request_id}/review-decision"
    shared_operations:
      - "every GET endpoint"
  - name: KeyCustodian
    description: "Creates keysets and schedules and runs over-the-air rekeying; never approves its own keysets."
    identity: opaque
    exclusive_operations:
      - "POST /radio-system/keysets"
      - "POST /radio-system/otar-campaigns"
      - "POST /radio-system/otar-campaigns/{campaign_id}/execute"
    shared_operations:
      - "every GET endpoint"
  - name: SecurityOfficer
    description: "Approves or rejects keysets and declares compromises; may never approve a keyset it created."
    identity: opaque
    exclusive_operations:
      - "POST /radio-system/keysets/{keyset_id}/approval"
      - "POST /radio-system/keysets/{keyset_id}/compromise"
    shared_operations:
      - "every GET endpoint"
  - name: AgencyRadioManager
    description: "Member agency radio administrator; X-User-ID is the agency's own id and every write is scoped to it."
    identity: "entity_backed:MemberAgency"
    exclusive_operations:
      - "POST /radio-system/units"
      - "POST /radio-system/units/{unit_id}/lifecycle"
      - "POST /radio-system/talkgroups"
      - "POST /radio-system/talkgroups/{talkgroup_id}/status"
      - "PATCH /radio-system/agencies/{agency_id}/console-config"
    shared_operations:
      - "POST /radio-system/agencies/{agency_id}/payments (shared with SystemAdmin)"
      - "every GET endpoint"
  - name: Dispatcher
    description: "Member agency dispatch console operator; X-User-ID is the agency's own id. Requests interoperability patches and talkpaths."
    identity: "entity_backed:MemberAgency"
    exclusive_operations:
      - "POST /radio-system/interop-patches"
      - "POST /radio-system/interop-patches/{patch_id}/decision"
      - "POST /radio-system/interop-patches/{patch_id}/release"
      - "POST /radio-system/talkpath-requests"
      - "POST /radio-system/talkpath-requests/{request_id}/release"
    shared_operations:
      - "every GET endpoint"
