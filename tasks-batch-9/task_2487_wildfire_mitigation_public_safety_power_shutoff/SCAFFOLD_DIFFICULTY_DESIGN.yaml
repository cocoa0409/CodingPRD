            - "Two customers sit on GOLF: one CRITICAL_FACILITY and one medical-baseline residential."
            - "Event EV-G spans 2026-08-25T00:00:00Z to 2026-08-28T00:00:00Z (72 hours) and is SCOPED with 1 confirmed circuit, ignition_risk_avoided_score 3.48, customer_impact_score 115.20 and net_benefit_ratio 0.0302."
