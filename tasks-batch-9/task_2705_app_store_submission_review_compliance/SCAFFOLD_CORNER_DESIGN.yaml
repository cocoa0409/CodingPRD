        distinguishing_aspect: "The eligibility filter matches w.platform to the AppRecord platform, so after the IOS window is closed a 10-slot ANDROID window in the same pool code cannot be selected and the queue call is 409 ERR_NO_REVIEW_CAPACITY."
        test_recipe:
