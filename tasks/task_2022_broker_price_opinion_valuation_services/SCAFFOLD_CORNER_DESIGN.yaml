        claim_type: correct_result
        grounds:
          - calculations.volume_forecast
        distinguishing_aspect: "Forecast = round_half_up((3*c1 + 2*c2 + 1*c3)/6). Inputs c1=10 (month-1), c2=5 (month-2), c3=2 (month-3) => (30+10+2)/6 = 42/6 = 7."
        test_recipe:
          setup:
            - "10 completed orders in 2026-07 (month-1), 5 in 2026-06, 2 in 2026-05, all in TX"
            - "Forecast for 2026-08 (month 08)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
