# =============================================================================
# SCAFFOLD.yaml — Pool Supply Distribution & Route Warehouse (POOLCORP branch)
# §1.0–§1.7 seed tables. Difficulty design lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Pool Supply Distribution & Route Warehouse (POOLCORP branch): seasonal demand
  curve & pre-season stocking, chemical hazmat storage & delivery restriction,
  dealer/service-company account tier, equipment warranty & authorized-service
  routing, will-call morning rush & route load, backorder on peak chemical
  shortage, freight program & minimum order, returned-goods & expired chemical

domain_name: pool-supply-distribution
api_prefix: /pool-supply

complexity_profile:
  primary_archetype: quota_allocation          # finite stock pools, reservation, backorder waterfall
  secondary_archetype: compliance_audit        # hazmat storage/delivery gating with audit trail
  complexity_layers:
    - optimistic_concurrency                   # OCC on Branch.version / SeasonalProgram.version
    - cascading_side_effects                   # order confirm → lot reservation → backorder posture → branch posture
    - dual_variant_calculation                 # freight (order-level vs per-line), warranty credit (provisional vs final)
    - rate_threshold_triggers                  # tier thresholds, seasonal windows, freight minimums
  entity_topology: flat                        # peer entities with FK references; no nested URL trees
  state_machine_shape: parallel                # SalesOrder carries fulfillment_status × payment_status independently
  relationship_patterns:
    - one_to_many
    - cross_aggregate                          # OrderLine → StockLot, WarrantyClaim → ServiceCenter
    - self_referential                         # BackorderRequest.superseded_by_id chains reallocations
  role_model: hierarchical_override            # BranchManager superset; CounterRep / RouteDispatcher / WarehouseLead peers; Account self-service
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Branch
    parent: null
    common_fields: true
    fields:
      - { name: branch_code, type: string, source: input, description: "Unique branch code, e.g. PHX-12", constraints: "unique across Branch" }
      - { name: hazmat_storage_certified, type: boolean, source: input, description: "Whether branch warehouse is certified to store hazmat chemicals at all" }
      - { name: peak_season_start, type: string, source: input, description: "ISO date (MM-DD) peak season opens, e.g. 04-01" }
      - { name: peak_season_end, type: string, source: input, description: "ISO date (MM-DD) peak season closes, e.g. 09-30" }
      - { name: willcall_cutoff_minutes, type: integer, source: input, description: "Minutes after will-call rush open during which will-call reservations hold priority over route load", default: 90 }
      - { name: seasonal_pool_units, type: integer, source: computed, description: "Total pre-season commitment pool units = sum of SeasonalCommitment.committed_units where status IN {COMMITTED} for programs of this branch" }
      - { name: posture, type: enum, source: computed, description: "NORMAL | CONSTRAINED | FROZEN. Derived: FROZEN if any Product has open backorder units >= product.shortage_freeze_threshold; else CONSTRAINED if any product's total available (on_hand - reserved) <= product.low_stock_floor; else NORMAL", constraints: "NORMAL | CONSTRAINED | FROZEN" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED_SEASON", constraints: "OPEN | CLOSED_SEASON", default: "OPEN" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: account_number, type: string, source: input, description: "External dealer/service-co account number", constraints: "unique" }
      - { name: account_type, type: enum, source: input, description: "DEALER (retail dealer) | SERVICE_CO (pool service company)", constraints: "DEALER | SERVICE_CO" }
      - { name: tier, type: enum, source: computed, description: "Derived from ytd_volume_cents at order-confirm time: PREMIER if ytd_volume_cents >= TIER_PREMIER_CENTS; else ELITE if >= TIER_ELITE_CENTS; else PRO. Tier is recomputed ONLY on order CONFIRM, never on draft edits", constraints: "PRO | ELITE | PREMIER", default: "PRO" }
      - { name: ytd_volume_cents, type: integer, source: computed, description: "Sum of invoiced_cents over SalesOrder where status reached CONFIRMED in the current calendar year (UTC), reset Jan 1 00:00:00Z" }
      - { name: hazmat_delivery_license_expiry, type: string, source: input, description: "ISO date after which hazmat ROUTE_DELIVERY to this account is forbidden; null = no license on file" }
      - { name: willcall_authorized, type: boolean, source: input, description: "Whether account may use will-call channel", default: true }
      - { name: credit_hold, type: boolean, source: input, description: "When true, order CONFIRM is rejected", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "ACTIVE | SUSPENDED", default: "ACTIVE" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock keeping unit", constraints: "unique" }
      - { name: product_family, type: enum, source: input, description: "CHEMICAL | EQUIPMENT | PARTS", constraints: "CHEMICAL | EQUIPMENT | PARTS" }
      - { name: hazmat_class, type: enum, source: input, description: "NONE | OXIDIZER_5_1 | CORROSIVE_8. Only CHEMICAL may be non-NONE", constraints: "NONE | OXIDIZER_5_1 | CORROSIVE_8", default: "NONE" }
      - { name: base_price_cents, type: integer, source: input, description: "List price before tier/seasonal discounts" }
      - { name: expiry_tracked, type: boolean, source: input, description: "True for dated chemicals; lots of such products carry expiry_date and are FEFO-allocated", default: false }
      - { name: low_stock_floor, type: integer, source: input, description: "Available-units floor feeding Branch.posture CONSTRAINED", default: 0 }
      - { name: shortage_freeze_threshold, type: integer, source: input, description: "Open backorder units at/above which Branch.posture becomes FROZEN", default: 100 }

  - name: StockLot
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; owning branch" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product held in this lot" }
      - { name: lot_code, type: string, source: input, description: "Supplier lot code", constraints: "unique within (branch_id, product_id)" }
      - { name: qty_on_hand, type: integer, source: input, description: "Physical units received; only increased by POST /stock-lots/{id}/replenish" }
      - { name: qty_reserved_willcall, type: integer, source: computed, description: "Units reserved by CONFIRMED WILL_CALL orders not yet picked up or released" }
      - { name: qty_reserved_route, type: integer, source: computed, description: "Units reserved by CONFIRMED ROUTE_DELIVERY orders not yet shipped or released" }
      - { name: qty_available, type: integer, source: computed, description: "qty_on_hand - qty_reserved_willcall - qty_reserved_route; never negative" }
      - { name: expiry_date, type: string, source: input, description: "ISO date lot expires; required iff product.expiry_tracked" }
      - { name: hazmat_storage_class, type: enum, source: computed, description: "Copied from Product.hazmat_class at lot creation; immutable thereafter", constraints: "NONE | OXIDIZER_5_1 | CORROSIVE_8" }

  - name: SeasonalProgram
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; branch running the program" }
      - { name: program_name, type: string, source: input, description: "e.g. 2026 Early-Buy Chemical Program" }
      - { name: order_window_start, type: string, source: input, description: "ISO datetime inclusive start of commitment window" }
      - { name: order_window_end, type: string, source: input, description: "ISO datetime inclusive end of commitment window (commitment created exactly AT end is allowed)" }
      - { name: ship_window_start, type: string, source: input, description: "ISO datetime inclusive start of ship window" }
      - { name: ship_window_end, type: string, source: input, description: "ISO datetime inclusive end of ship window" }
      - { name: early_buy_discount_pct, type: number, source: input, description: "Percentage (0-50) discount applied to pre-season committed order lines" }
      - { name: pool_cap_units, type: integer, source: input, description: "Maximum total committed units the program accepts" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CLOSED", constraints: "DRAFT | OPEN | CLOSED", default: "DRAFT" }

  - name: SeasonalCommitment
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> SeasonalProgram.id" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: committed_units, type: integer, source: input, description: "Units the account commits to take within the ship window" }
      - { name: consumed_units, type: integer, source: computed, description: "Units already drawn by confirmed orders referencing this commitment" }
      - { name: status, type: enum, source: system, description: "COMMITTED | FULFILLED | DEFAULTED | SUPERSEDED", constraints: "COMMITTED | FULFILLED | DEFAULTED | SUPERSEDED" }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; fulfilling branch" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; buying account" }
      - { name: channel, type: enum, source: input, description: "WILL_CALL (counter pickup) | ROUTE_DELIVERY (truck route)", constraints: "WILL_CALL | ROUTE_DELIVERY" }
      - { name: commitment_id, type: string, source: input, description: "FK -> SeasonalCommitment.id; optional pre-season commitment this order draws from" }
      - { name: fulfillment_status, type: enum, source: system, description: "Parallel dimension 1: DRAFT → CONFIRMED → PICKED_LOADED → COMPLETED; CONFIRMED → CANCELLED. Independent of payment_status", constraints: "DRAFT | CONFIRMED | PICKED_LOADED | COMPLETED | CANCELLED" }
      - { name: payment_status, type: enum, source: system, description: "Parallel dimension 2: UNINVOICED → INVOICED → PAID. Independent of fulfillment_status", constraints: "UNINVOICED | INVOICED | PAID" }
      - { name: order_subtotal_cents, type: integer, source: computed, description: "Sum of OrderLine.extended_price_cents (per-line rounded, then summed — see order_pricing calculation)" }
      - { name: freight_charge_cents, type: integer, source: computed, description: "See freight_charge calculation; 0 for WILL_CALL" }
      - { name: invoiced_cents, type: integer, source: computed, description: "order_subtotal_cents + freight_charge_cents; frozen at INVOICED" }
      - { name: tier_at_confirm, type: enum, source: computed, description: "Account.tier snapshot taken at CONFIRM; prices are pinned to this snapshot even if the account's live tier later changes", constraints: "PRO | ELITE | PREMIER" }
      - { name: route_date, type: string, source: input, description: "ISO date for ROUTE_DELIVERY; must be >= today (logical clock) and within branch peak season for hazmat" }
      - { name: requested_pickup_slot, type: string, source: input, description: "ISO datetime for WILL_CALL pickup; must fall within will-call hours of the order's business day" }

  - name: OrderLine
    parent: null
    common_fields: false
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> SalesOrder.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: qty, type: integer, source: input, description: "Units ordered; >= 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Per-unit price after tier and (if commitment_id set) early-buy discount; rounded per order_pricing" }
      - { name: extended_price_cents, type: integer, source: computed, description: "round_half_up(unit_price_unrounded * qty) — computed before unit_price_cents is itself rounded; see order_pricing" }
      - { name: allocated_lot_id, type: string, source: computed, description: "FK -> StockLot.id; FEFO-selected at CONFIRM (earliest expiry_date ASC, then created_at ASC among lots with sufficient unreserved qty)" }
      - { name: allocated_qty, type: integer, source: computed, description: "Units reserved on allocated_lot_id at CONFIRM; 0 when backordered" }
      - { name: backordered_qty, type: integer, source: computed, description: "qty - allocated_qty at CONFIRM" }

  - name: BackorderRequest
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; line that went short" }
      - { name: product_id, type: string, source: computed, description: "Copied from OrderLine.product_id" }
      - { name: account_id, type: string, source: computed, description: "Copied from SalesOrder.account_id at creation" }
      - { name: qty_open, type: integer, source: computed, description: "Units still owed; decremented by allocations" }
      - { name: qty_original, type: integer, source: system, description: "Original shortage; immutable" }
      - { name: priority_rank, type: integer, source: computed, description: "Lower allocates first: 1 if account.tier_at_confirm == PREMIER, 2 if ELITE, 3 if PRO. Snapshot at creation, never recomputed" }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> BackorderRequest.id; when a manual reallocation splits this request, points to the remainder request. Self-referential chain" }
      - { name: status, type: enum, source: system, description: "OPEN → ALLOCATED → CLOSED; OPEN → CANCELLED; ALLOCATED → OPEN (short allocation rollback)", constraints: "OPEN | ALLOCATED | CLOSED | CANCELLED" }

  - name: ServiceCenter
    parent: null
    common_fields: true
    fields:
      - { name: center_name, type: string, source: input, description: "Authorized service center name" }
      - { name: region_code, type: string, source: input, description: "Region served, e.g. SW, TX, FL" }
      - { name: authorized_brands, type: array, source: input, description: "Array of equipment brand strings this center is factory-authorized for" }
      - { name: labor_rate_cents, type: integer, source: input, description: "Hourly labor rate used by warranty_labor_credit" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "ACTIVE | SUSPENDED", default: "ACTIVE" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; claimant" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; must be product_family == EQUIPMENT" }
      - { name: serial_number, type: string, source: input, description: "Unit serial; unique per product among non-REJECTED claims" }
      - { name: brand, type: string, source: input, description: "Equipment brand; used to match ServiceCenter.authorized_brands" }
      - { name: purchase_date, type: string, source: input, description: "ISO date of original sale; warranty term measured from this" }
      - { name: failure_description, type: string, source: input, description: "Free-text failure narrative" }
      - { name: assigned_center_id, type: string, source: computed, description: "FK -> ServiceCenter.id; assigned at SUBMIT by selector: ACTIVE centers where brand ∈ authorized_brands, ranked by (region_code == account's branch region) DESC then labor_rate_cents ASC then created_at ASC" }
      - { name: provisional_credit_cents, type: integer, source: computed, description: "Flat-rate provisional credit at SUBMIT (see warranty_labor_credit)" }
      - { name: final_credit_cents, type: integer, source: computed, description: "Actual-hours-based credit at RESOLVED; null until then" }
      - { name: actual_labor_hours, type: number, source: input, description: "Reported by service center at resolution; required on /resolve" }
      - { name: info_cycles, type: integer, source: system, description: "Count of completed MORE_INFO → UNDER_REVIEW loops; supply-info is rejected when info_cycles == 3 (max 3 info cycles)", default: 0 }
      - { name: status, type: enum, source: system, description: "SUBMITTED → UNDER_REVIEW → APPROVED → RESOLVED → CLOSED; UNDER_REVIEW → MORE_INFO → UNDER_REVIEW (cycle); UNDER_REVIEW → REJECTED", constraints: "SUBMITTED | UNDER_REVIEW | MORE_INFO | APPROVED | RESOLVED | CLOSED | REJECTED" }

  - name: ReturnAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: order_id, type: string, source: input, description: "FK -> SalesOrder.id; original order being returned against (must be COMPLETED)" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: lot_id, type: string, source: input, description: "FK -> StockLot.id; lot the goods came from (drives expiry evaluation)" }
      - { name: qty, type: integer, source: input, description: "Units returned; >= 1" }
      - { name: reason, type: enum, source: input, description: "DEFECTIVE | WRONG_ITEM | OVERSTOCK | EXPIRED", constraints: "DEFECTIVE | WRONG_ITEM | OVERSTOCK | EXPIRED" }
      - { name: restocking_fee_pct, type: number, source: computed, description: "0 for DEFECTIVE/WRONG_ITEM; RESTOCK_PCT for OVERSTOCK; return rejected outright for EXPIRED when lot.expiry_date <= logical today (ERR_RETURN_EXPIRED_CHEMICAL)" }
      - { name: credit_cents, type: integer, source: computed, description: "See rma_credit calculation" }
      - { name: status, type: enum, source: system, description: "REQUESTED → APPROVED → RECEIVED → CREDITED; REQUESTED → DENIED", constraints: "REQUESTED | APPROVED | RECEIVED | CREDITED | DENIED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Branch
    initial_state: OPEN
    terminal_states: [CLOSED_SEASON]
    transitions:
      - from: OPEN
        to: CLOSED_SEASON
        trigger: "POST /pool-supply/branches/{id}/close-season"
        actor: BranchManager
        preconditions:
          - "No SalesOrder of this branch in fulfillment_status CONFIRMED or PICKED_LOADED (ERR_BRANCH_ORDERS_OPEN)"
          - "No BackorderRequest of this branch in status OPEN or ALLOCATED (ERR_BRANCH_BACKORDERS_OPEN)"
        side_effects:
          - "All SeasonalProgram of branch in status OPEN → CLOSED"
          - "All SeasonalCommitment of those programs in status COMMITTED with consumed_units < committed_units → DEFAULTED"
          - "Branch.version increments by 1"

  - entity: SeasonalProgram
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /pool-supply/seasonal-programs/{id}/open"
        actor: BranchManager
        preconditions:
          - "Program in DRAFT (ERR_PROGRAM_NOT_DRAFT)"
          - "order_window_start <= order_window_end and ship_window_start <= ship_window_end (ERR_PROGRAM_WINDOW_INVALID)"
        side_effects: ["SeasonalProgram.version increments by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /pool-supply/seasonal-programs/{id}/close OR system cascade from Branch close-season"
        actor: BranchManager
        preconditions:
          - "Program in OPEN (ERR_PROGRAM_NOT_OPEN)"
        side_effects:
          - "COMMITTED commitments with consumed_units < committed_units → DEFAULTED (per-commitment)"
          - "COMMITTED commitments with consumed_units == committed_units → FULFILLED"

  - entity: SeasonalCommitment
    initial_state: COMMITTED
    terminal_states: [FULFILLED, DEFAULTED, SUPERSEDED]
    transitions:
      - from: COMMITTED
        to: SUPERSEDED
        trigger: "POST /pool-supply/seasonal-commitments (creating a replacement commitment for the same (program_id, account_id) pair, with expected_program_version OCC)"
        actor: BranchManager
        preconditions:
          - "Replacement commitment's committed_units >= existing commitment's consumed_units (ERR_COMMITMENT_BELOW_CONSUMED)"
        side_effects:
          - "Old commitment → SUPERSEDED; new commitment created in COMMITTED"
          - "Branch.seasonal_pool_units recomputed (old units removed, new units added)"
      - from: COMMITTED
        to: FULFILLED
        trigger: "system (when consumed_units reaches committed_units via order CONFIRM), or cascade on program close"
        actor: system
        preconditions: ["consumed_units == committed_units"]
        side_effects: []
      - from: COMMITTED
        to: DEFAULTED
        trigger: "system cascade on program close with consumed_units < committed_units"
        actor: system
        preconditions: []
        side_effects: ["Branch.seasonal_pool_units recomputed (commitment leaves the pool)"]

  - entity: SalesOrder
    initial_state: "DRAFT (fulfillment) / UNINVOICED (payment)"
    terminal_states: ["COMPLETED (fulfillment) with PAID (payment)", "CANCELLED (fulfillment)"]
    transitions:
      - from: "fulfillment=DRAFT"
        to: "fulfillment=CONFIRMED"
        trigger: "POST /pool-supply/orders/{id}/confirm with expected_branch_version OCC"
        actor: "CounterRep (WILL_CALL) | RouteDispatcher (ROUTE_DELIVERY) | Account (own orders)"
        preconditions:
          - "fulfillment_status == DRAFT (ERR_ORDER_NOT_DRAFT)"
          - "Account.status == ACTIVE and Account.credit_hold == false (ERR_ACCOUNT_NOT_ORDERABLE)"
          - "Branch.status == OPEN (ERR_BRANCH_CLOSED)"
          - "Branch.posture != FROZEN (ERR_BRANCH_FROZEN)"
          - "Channel WILL_CALL requires Account.willcall_authorized == true (ERR_WILLCALL_NOT_AUTHORIZED)"
          - "Hazmat lines on ROUTE_DELIVERY require Account.hazmat_delivery_license_expiry > route_date (ERR_HAZMAT_LICENSE_EXPIRED)"
          - "Hazmat lines require Branch.hazmat_storage_certified == true (ERR_BRANCH_NOT_HAZMAT_CERTIFIED)"
          - "ROUTE_DELIVERY route_date within [today, branch peak season end] for hazmat lines (ERR_ROUTE_DATE_OUTSIDE_WINDOW)"
          - "If commitment_id set: commitment in COMMITTED, commitment.account_id == order.account_id, and remaining commitment units >= total order units (ERR_COMMITMENT_EXHAUSTED)"
        side_effects:
          - "Snapshot tier_at_confirm = Account.tier; recompute Account.tier from ytd_volume_cents AFTER this order's invoiced_cents posts (bubble-up, ordering pinned in account_tier_recompute)"
          - "Per line: FEFO-allocate from StockLots of branch (expiry_date ASC NULLS LAST, created_at ASC tie-break) — reservation increments qty_reserved_willcall or qty_reserved_route by channel"
          - "Short lines create BackorderRequest(status=OPEN); if product's total open backorder units >= shortage_freeze_threshold → Branch.posture → FROZEN (cascade depth 2)"
          - "If commitment_id set: commitment.consumed_units += total order units; if consumed reaches committed → commitment FULFILLED (cascade depth 2)"
          - "Order subtotal/freight/invoiced computed (order_pricing, freight_charge)"
          - "Branch.version increments by 1"
      - from: "fulfillment=CONFIRMED"
        to: "fulfillment=PICKED_LOADED"
        trigger: "POST /pool-supply/orders/{id}/mark-loaded"
        actor: "WarehouseLead"
        preconditions:
          - "fulfillment_status == CONFIRMED (ERR_ORDER_NOT_CONFIRMED)"
          - "All lines fully allocated (no backordered_qty > 0) (ERR_ORDER_LINES_SHORT)"
        side_effects: ["Lot reservations stay; qty_on_hand decremented per allocated line, reservations released"]
      - from: "fulfillment=PICKED_LOADED"
        to: "fulfillment=COMPLETED"
        trigger: "POST /pool-supply/orders/{id}/complete"
        actor: "CounterRep (WILL_CALL pickup handover) | RouteDispatcher (route proof-of-delivery)"
        preconditions:
          - "fulfillment_status == PICKED_LOADED (ERR_ORDER_NOT_LOADED)"
          - "payment_status == PAID (ERR_ORDER_UNPAID)"
        side_effects: []
      - from: "fulfillment=CONFIRMED"
        to: "fulfillment=CANCELLED"
        trigger: "POST /pool-supply/orders/{id}/cancel"
        actor: "BranchManager | Account (own orders)"
        preconditions:
          - "fulfillment_status == CONFIRMED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "Release lot reservations (qty_reserved_* decremented by allocated_qty per line)"
          - "OPEN BackorderRequests of this order → CANCELLED; Branch.posture recomputed (may drop FROZEN → CONSTRAINED/NORMAL)"
          - "If commitment_id set: commitment.consumed_units -= total units; if commitment was FULFILLED by this order it reverts to COMMITTED (compensation)"
          - "Account.ytd_volume_cents decremented by invoiced_cents; Account.tier NOT recomputed downward (ratchet)"
      - from: "payment=UNINVOICED"
        to: "payment=INVOICED"
        trigger: "POST /pool-supply/orders/{id}/invoice"
        actor: BranchManager
        preconditions:
          - "fulfillment_status == CONFIRMED (ERR_ORDER_NOT_CONFIRMED)"
          - "payment_status == UNINVOICED (ERR_ORDER_ALREADY_INVOICED)"
        side_effects:
          - "invoiced_cents frozen; Account.ytd_volume_cents += invoiced_cents (ledger sync)"
          - "Account.tier recomputed (may ratchet upward; never downward)"
      - from: "payment=INVOICED"
        to: "payment=PAID"
        trigger: "POST /pool-supply/orders/{id}/pay"
        actor: "Account (own) | BranchManager"
        preconditions:
          - "payment_status == INVOICED (ERR_ORDER_NOT_INVOICED)"
        side_effects: []

  - entity: BackorderRequest
    initial_state: OPEN
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: ALLOCATED
        trigger: "POST /pool-supply/backorder-requests/{id}/allocate with expected_stock_lot_version OCC (manual) OR system sweep on POST /pool-supply/stock-lots/{id}/replenish (automatic)"
        actor: "WarehouseLead (manual) | system (sweep)"
        preconditions:
          - "status == OPEN (ERR_BACKORDER_NOT_OPEN)"
          - "Target lot's qty_available >= 1 (allocation is all-or-partial per waterfall_allocation rules; zero available → ERR_LOT_EMPTY)"
        side_effects:
          - "qty_open decremented by allocated units; reservation placed on lot (qty_reserved_* per parent order's channel)"
          - "If qty_open reaches 0 → status CLOSED; else stays ALLOCATED with residual"
          - "Branch.posture recomputed (dropping below shortage_freeze_threshold may unfreeze)"
      - from: ALLOCATED
        to: OPEN
        trigger: "system (rollback when the reserving SalesOrder is CANCELLED before load, and the allocation cannot be reassigned to another backorder of the same product — cyclic loop)"
        actor: system
        preconditions: []
        side_effects:
          - "Lot reservation released; qty_open restored by released units"
          - "Branch.posture recomputed (may re-enter FROZEN)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /pool-supply/backorder-requests/{id}/cancel OR cascade from SalesOrder cancel"
        actor: "BranchManager | system"
        preconditions:
          - "status == OPEN (ERR_BACKORDER_NOT_OPEN)"
        side_effects: ["Branch.posture recomputed"]

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [CLOSED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /pool-supply/warranty-claims/{id}/start-review"
        actor: BranchManager
        preconditions: ["status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: MORE_INFO
        trigger: "POST /pool-supply/warranty-claims/{id}/request-info"
        actor: BranchManager
        preconditions: ["status == UNDER_REVIEW (ERR_CLAIM_NOT_UNDER_REVIEW)"]
        side_effects: []
      - from: MORE_INFO
        to: UNDER_REVIEW
        trigger: "POST /pool-supply/warranty-claims/{id}/supply-info"
        actor: "Account (own claim)"
        preconditions:
          - "status == MORE_INFO (ERR_CLAIM_NOT_MORE_INFO)"
          - "X-User-ID == claim.account_id (ERR_NOT_CLAIM_OWNER)"
          - "info_cycles < 3 — a 4th supply attempt (info_cycles already 3) is rejected (ERR_CLAIM_INFO_CYCLE_EXHAUSTED); the claim must then be rejected via /reject"
        side_effects: ["Cycle counter info_cycles += 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /pool-supply/warranty-claims/{id}/approve"
        actor: BranchManager
        preconditions:
          - "status == UNDER_REVIEW (ERR_CLAIM_NOT_UNDER_REVIEW)"
          - "assigned_center_id references a ServiceCenter with status ACTIVE (ERR_CENTER_SUSPENDED)"
        side_effects: []
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /pool-supply/warranty-claims/{id}/reject"
        actor: BranchManager
        preconditions: ["status == UNDER_REVIEW (ERR_CLAIM_NOT_UNDER_REVIEW)"]
        side_effects: ["provisional_credit_cents zeroed (compensation)"]
      - from: APPROVED
        to: RESOLVED
        trigger: "POST /pool-supply/warranty-claims/{id}/resolve"
        actor: BranchManager
        preconditions:
          - "status == APPROVED (ERR_CLAIM_NOT_APPROVED)"
          - "actual_labor_hours provided and > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "final_credit_cents computed via warranty_labor_credit FINAL variant"
          - "provisional_credit_cents remains on record; credit delta (final - provisional) is the observable payable delta"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /pool-supply/warranty-claims/{id}/close"
        actor: BranchManager
        preconditions: ["status == RESOLVED (ERR_CLAIM_NOT_RESOLVED)"]
        side_effects: []

  - entity: ReturnAuthorization
    initial_state: REQUESTED
    terminal_states: [CREDITED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /pool-supply/return-authorizations/{id}/approve"
        actor: BranchManager
        preconditions:
          - "status == REQUESTED (ERR_RMA_NOT_REQUESTED)"
          - "Referenced SalesOrder.fulfillment_status == COMPLETED (ERR_RMA_ORDER_NOT_COMPLETED)"
          - "If reason == EXPIRED and Product.product_family == CHEMICAL: lot.expiry_date must be > logical today, otherwise the RMA is denied at REQUEST time (see create validation ERR_RETURN_EXPIRED_CHEMICAL); at APPROVE time re-check and deny if lot expired since request (ERR_RMA_LOT_EXPIRED_SINCE_REQUEST)"
        side_effects: ["restocking_fee_pct and credit_cents computed per rma_credit"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /pool-supply/return-authorizations/{id}/deny"
        actor: BranchManager
        preconditions: ["status == REQUESTED (ERR_RMA_NOT_REQUESTED)"]
        side_effects: []
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /pool-supply/return-authorizations/{id}/receive"
        actor: WarehouseLead
        preconditions:
          - "status == APPROVED (ERR_RMA_NOT_APPROVED)"
          - "If Product.product_family == CHEMICAL: lot.expiry_date > logical today at RECEIVE time (ERR_RMA_LOT_EXPIRED_SINCE_REQUEST)"
        side_effects:
          - "If reason != EXPIRED and Product.product_family != CHEMICAL: qty credited back into the lot (qty_on_hand += qty); chemicals are NEVER restocked (compliance)"
      - from: RECEIVED
        to: CREDITED
        trigger: "POST /pool-supply/return-authorizations/{id}/credit"
        actor: BranchManager
        preconditions: ["status == RECEIVED (ERR_RMA_NOT_RECEIVED)"]
        side_effects: ["credit_cents posted; no account tier impact (returns never move ytd_volume_cents)"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC — true races only)
# =============================================================================
concurrency_rules:
  - rule_id: order-confirm-stale-branch
    parent_entity: Branch
    write_endpoint: "POST /pool-supply/orders/{id}/confirm"
    occ_field: "expected_branch_version"
    description: |
      Confirming an order against a Branch whose version has advanced since the
      client last observed it is rejected. Confirm mutates branch-scoped derived
      state (posture via backorder cascade, seasonal_pool_units via commitment
      consumption), so a writer working from a stale branch snapshot must not be
      allowed to post. The loser retries after re-reading Branch.version.
      Evaluation precedence on this endpoint is pinned: auth → ownership →
      existence → order state preconditions (ERR_ORDER_NOT_DRAFT etc.) → OCC
      version check → business checks (safety/temporal/constraint/fiscal in
      §1.4 priority order). A state-violating confirm reports the state error
      even when the supplied branch version is also stale.
    error_id: ERR_STALE_BRANCH_VERSION
    http_status: 412

  - rule_id: backorder-allocate-stale-lot
    parent_entity: StockLot
    write_endpoint: "POST /pool-supply/backorder-requests/{id}/allocate"
    occ_field: "expected_stock_lot_version"
    description: |
      Manually allocating a backorder against a StockLot whose version has
      advanced since the client last observed it is rejected. Allocation
      legitimately supersedes the prior availability picture (another allocation
      or a replenish may have just changed qty_available), so the writer must
      re-observe the lot before committing units. Evaluation precedence on this
      endpoint is pinned: auth → existence → backorder state (OPEN) → OCC
      version check → business qty check (ERR_LOT_EMPTY). A stale version is
      reported even when the lot is empty at the same moment.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

  - rule_id: commitment-supersede-stale-program
    parent_entity: SeasonalProgram
    write_endpoint: "POST /pool-supply/seasonal-commitments"
    occ_field: "expected_program_version"
    description: |
      Creating a SeasonalCommitment that supersedes an existing COMMITTED
      commitment for the same (program_id, account_id) pair is rejected when the
      program's version has advanced since the client last observed it. The new
      commitment legitimately supersedes the old one under program rules, but
      only against a current program snapshot (pool_cap_units enforcement).
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_pricing
    trigger: "SalesOrder CONFIRM (and frozen thereafter; tier snapshot pinned at confirm)"
    algorithm: tiered_pricing
    formula: |
      Per line, in this pinned order:
        1. base = Product.base_price_cents
        2. tier_factor = TIER_DISCOUNT[tier_at_confirm]   (PRO 0.00, ELITE 0.05, PREMIER 0.10)
        3. seasonal_factor = (commitment_id set) ? SeasonalProgram.early_buy_discount_pct / 100 : 0
        4. unit_unrounded_cents = base * (1 - tier_factor) * (1 - seasonal_factor)
        5. extended_price_cents = round_half_up(unit_unrounded_cents * qty)      # ROUND PER LINE FIRST
        6. unit_price_cents = round_half_up(extended_price_cents / qty)          # unit derived FROM the rounded line
      order_subtotal_cents = sum(extended_price_cents) over all lines            # sum AFTER per-line rounding
      invoiced_cents = order_subtotal_cents + freight_charge_cents
    input_set: "All OrderLines of the order; tier snapshot from SalesOrder.tier_at_confirm"
    constants:
      TIER_DISCOUNT_PRO: 0.00
      TIER_DISCOUNT_ELITE: 0.05
      TIER_DISCOUNT_PREMIER: 0.10
    precision: "integer cents; round_half_up per line BEFORE summing (sum-then-round is a spec violation)"

  - name: freight_charge
    trigger: "SalesOrder CONFIRM for channel ROUTE_DELIVERY (WILL_CALL → 0)"
    algorithm: threshold
    formula: |
      if channel == WILL_CALL: freight_charge_cents = 0
      else:
        freightable_cents = order_subtotal_cents   # hazmat lines DO count toward the minimum
        if freightable_cents >= FREIGHT_FREE_MIN_CENTS: freight_charge_cents = 0
        else:
          hazmat_any = any line whose product.hazmat_class != NONE
          base_fee = FREIGHT_BASE_CENTS
          hazmat_fee = hazmat_any ? FREIGHT_HAZMAT_SURCHARGE_CENTS : 0
          shortfall = FREIGHT_FREE_MIN_CENTS - freightable_cents
          shortfall_fee = min(shortfall, FREIGHT_SHORTFALL_CAP_CENTS)   # partial-threshold crossing rule
          freight_charge_cents = base_fee + hazmat_fee + shortfall_fee
    input_set: "The single confirming order"
    constants:
      FREIGHT_FREE_MIN_CENTS: 50000       # $500 free-freight minimum
      FREIGHT_BASE_CENTS: 2500
      FREIGHT_HAZMAT_SURCHARGE_CENTS: 1800
      FREIGHT_SHORTFALL_CAP_CENTS: 7500
    precision: "integer cents"
    variants:
      - name: order_level
        when: "default"
        difference: "threshold applied to order_subtotal_cents as a whole"
      - name: per_line_floor_check
        when: "NEVER valid — declared as the rejected variant: an implementation that tests FREIGHT_FREE_MIN per line produces different freight on multi-line orders and is WRONG"
        difference: "per-line thresholding is the trap variant; tests pin order-level semantics"

  - name: account_tier_recompute
    trigger: "SalesOrder INVOICE (post) and CONFIRM (pre-check snapshot)"
    algorithm: threshold
    formula: |
      ytd_volume_cents = sum(invoiced_cents) over SalesOrder where account_id matches,
                         payment_status IN {INVOICED, PAID}, fulfillment_status != CANCELLED,
                         and invoiced at >= Jan 1 00:00:00Z of current UTC year
      new_tier = PREMIER if ytd_volume_cents >= TIER_PREMIER_CENTS
                 else ELITE if ytd_volume_cents >= TIER_ELITE_CENTS
                 else PRO
      Account.tier = max_ratchet(Account.tier, new_tier)   # tier NEVER decreases on cancel
    input_set: "SalesOrders of the account in the current UTC calendar year"
    constants:
      TIER_ELITE_CENTS: 2000000        # $20,000
      TIER_PREMIER_CENTS: 5000000      # $50,000
    precision: "integer cents; boundary is >= (an invoice landing exactly on 2000000 IS ELITE)"

  - name: backorder_waterfall_allocation
    trigger: "POST /pool-supply/stock-lots/{id}/replenish (automatic sweep) and POST /pool-supply/backorder-requests/{id}/allocate (manual)"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is PINNED (circular-looking dependency resolved):
        1. Candidate set = BackorderRequests where product_id == lot.product_id, branch_id == lot.branch_id,
           status == OPEN. (ALLOCATED-with-residual does NOT re-enter the sweep.)
        2. Ranking: priority_rank ASC (snapshot at creation), then created_at ASC (tie-break).
           UUID id MUST NOT be used.
        3. available = lot.qty_available
        4. For each candidate in rank order:
             grant = min(candidate.qty_open, available)
             reserve grant on lot per parent order channel; candidate.qty_open -= grant
             candidate → (qty_open == 0) ? CLOSED : ALLOCATED
             available -= grant; if available == 0 stop
        5. Branch.posture recomputed once after the sweep
      Ratchet rule: a candidate's place in line is fixed by its snapshot priority_rank even if the
      account's live tier changed after the backorder was created.
    input_set: "OPEN BackorderRequests for (product, branch)"
    constants: {}
    precision: "integer units"

  - name: branch_posture
    trigger: "Recomputed after: order CONFIRM, order CANCEL, backorder ALLOCATE/CLOSE/CANCEL, lot REPLENISH"
    algorithm: aggregation
    formula: |
      For the branch:
        frozen_hit  = exists Product p: sum(qty_open over BackorderRequests where product_id = p.id,
                      branch_id = branch, status == OPEN) >= p.shortage_freeze_threshold
        constrained_hit = exists Product p: (sum qty_on_hand - qty_reserved_willcall - qty_reserved_route
                      over StockLots of branch for p) <= p.low_stock_floor AND p.low_stock_floor > 0
      posture = FROZEN if frozen_hit else CONSTRAINED if constrained_hit else NORMAL
      Boundary: >= for freeze (threshold reached IS frozen); <= for constrained (at floor IS constrained).
    input_set: "OPEN BackorderRequests and StockLots of the branch"
    constants: {}
    precision: "integer units"

  - name: warranty_labor_credit
    trigger: "WarrantyClaim SUBMIT (provisional) and RESOLVE (final)"
    algorithm: tiered_pricing
    formula: |
      PROVISIONAL (at SUBMIT):
        provisional_credit_cents = FLAT_LABOR_HOURS * center.labor_rate_cents
        where center = assigned ServiceCenter; FLAT_LABOR_HOURS = 2
      FINAL (at RESOLVE):
        base = round_half_up(actual_labor_hours * center.labor_rate_cents)
        cap  = LABOR_CAP_HOURS * center.labor_rate_cents
        final_credit_cents = min(base, cap)
      payable_delta_cents = final_credit_cents - provisional_credit_cents   # may be negative (clawback)
    input_set: "The single claim and its assigned ServiceCenter"
    constants:
      FLAT_LABOR_HOURS: 2
      LABOR_CAP_HOURS: 6
    precision: "integer cents; round_half_up on the final base BEFORE cap"
    variants:
      - name: provisional
        when: "at SUBMIT"
        difference: "flat 2-hour estimate at assigned center's rate"
      - name: final
        when: "at RESOLVE"
        difference: "actual hours (rounded half-up) capped at 6 hours; differs from provisional whenever actual != 2"

  - name: rma_credit
    trigger: "ReturnAuthorization APPROVE"
    algorithm: constraint_propagation
    formula: |
      line_ref = the OrderLine of the RMA's (order_id, product_id); if multiple lines match, use the
                 line with the earliest created_at
      base_credit = line_ref.unit_price_cents * qty
      fee_pct = 0 if reason IN {DEFECTIVE, WRONG_ITEM}
                RESTOCK_PCT if reason == OVERSTOCK
                0 if reason == EXPIRED (but EXPIRED chemical with lot.expiry_date <= today never reaches
                APPROVE — rejected at create with ERR_RETURN_EXPIRED_CHEMICAL)
      credit_cents = round_half_up(base_credit * (1 - fee_pct))
      Evaluation order pinned: fee_pct is determined BEFORE credit; credit uses the FROZEN historical
      unit_price_cents (tier at original confirm), NOT current tier pricing.
    input_set: "The RMA plus referenced OrderLine and StockLot"
    constants:
      RESTOCK_PCT: 0.15
    precision: "integer cents, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Entity-backed ownership: Account role may only act on resources whose account_id == X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /pool-supply/orders/{id}/confirm, /cancel, /pay, POST /pool-supply/warranty-claims/{id}/supply-info, POST /pool-supply/return-authorizations"
  - priority: 4
    category: existence
    check: "Path and body-referenced ids exist (branch, account, product, lot, program, commitment, order, claim, center, rma)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "Target entity in the required state for the action (order DRAFT/CONFIRMED/LOADED, claim UNDER_REVIEW, rma REQUESTED, program OPEN, etc.)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints
  - priority: 6
    category: business_safety
    check: "Hazmat: branch storage certified for any hazmat line (ERR_BRANCH_NOT_HAZMAT_CERTIFIED)"
    error_id: ERR_BRANCH_NOT_HAZMAT_CERTIFIED
    http_status: 422
    applies_to: "POST /pool-supply/orders/{id}/confirm"
  - priority: 7
    category: business_safety
    check: "Hazmat × channel: ROUTE_DELIVERY of hazmat requires account license expiry > route_date (ERR_HAZMAT_LICENSE_EXPIRED)"
    error_id: ERR_HAZMAT_LICENSE_EXPIRED
    http_status: 422
    applies_to: "POST /pool-supply/orders/{id}/confirm"
  - priority: 8
    category: business_temporal
    check: "ROUTE_DELIVERY route_date within [logical today, branch peak_season_end] when any line is hazmat; non-hazmat route_date must be >= logical today"
    error_id: ERR_ROUTE_DATE_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /pool-supply/orders/{id}/confirm"
  - priority: 9
    category: business_temporal
    check: "SeasonalCommitment create: logical now within [order_window_start, order_window_end] inclusive both ends"
    error_id: ERR_COMMITMENT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /pool-supply/seasonal-commitments"
  - priority: 10
    category: business_constraint
    check: "Will-call channel: account.willcall_authorized must be true"
    error_id: ERR_WILLCALL_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /pool-supply/orders/{id}/confirm with channel WILL_CALL"
  - priority: 11
    category: business_constraint
    check: "Branch posture must not be FROZEN for order CONFIRM (CONSTRAINED is allowed)"
    error_id: ERR_BRANCH_FROZEN
    http_status: 409
    applies_to: "POST /pool-supply/orders/{id}/confirm"
  - priority: 12
    category: business_referential
    check: "commitment_id (if set): exists, status COMMITTED, account matches order account, remaining units >= order units"
    error_id: ERR_COMMITMENT_EXHAUSTED
    http_status: 422
    applies_to: "POST /pool-supply/orders/{id}/confirm"
  - priority: 13
    category: business_fiscal
    check: "Account credit_hold == false and status == ACTIVE at CONFIRM"
    error_id: ERR_ACCOUNT_NOT_ORDERABLE
    http_status: 402
    applies_to: "POST /pool-supply/orders/{id}/confirm"
  - priority: 14
    category: business_fiscal
    check: "SeasonalCommitment create: sum of COMMITTED commitments' units for the program + new units <= pool_cap_units"
    error_id: ERR_PROGRAM_POOL_EXHAUSTED
    http_status: 422
    applies_to: "POST /pool-supply/seasonal-commitments"
  - priority: 15
    category: business_safety
    check: "RMA create: reason == EXPIRED with CHEMICAL product requires lot.expiry_date > logical today; expired chemicals are HAZMAT waste and cannot be returned through RMA"
    error_id: ERR_RETURN_EXPIRED_CHEMICAL
    http_status: 422
    applies_to: "POST /pool-supply/return-authorizations"
  - priority: 16
    category: business_constraint
    check: "Warranty claim create: product_family == EQUIPMENT; serial_number unique per product among claims not in REJECTED"
    error_id: ERR_CLAIM_SERIAL_DUPLICATE
    http_status: 409
    applies_to: "POST /pool-supply/warranty-claims"
  - priority: 17
    category: business_referential
    check: "Warranty claim create: at least one ACTIVE ServiceCenter carries brand in authorized_brands (else claim cannot be routed)"
    error_id: ERR_NO_AUTHORIZED_CENTER
    http_status: 422
    applies_to: "POST /pool-supply/warranty-claims"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving, mandatory default) ---
  - method: POST
    path: "/pool-supply/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and MUST NOT use wall-clock time."
    roles: [BranchManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- Branch ---
  - method: POST
    path: "/pool-supply/branches"
    description: "Create a branch"
    roles: [BranchManager]
    code: 201
    input: [branch_code, hazmat_storage_certified, peak_season_start, peak_season_end, "willcall_cutoff_minutes?"]
    output: Branch
    side_effects: ["status OPEN; posture NORMAL; seasonal_pool_units 0"]
  - method: GET
    path: "/pool-supply/branches"
    description: "List branches"
    roles: [BranchManager, CounterRep, RouteDispatcher, WarehouseLead, Account]
    code: 200
    input: ["limit?", "offset?"]
    output: "Branch[]"
    side_effects: []
  - method: GET
    path: "/pool-supply/branches/{id}"
    description: "Get branch (posture, pool, version)"
    roles: [BranchManager, CounterRep, RouteDispatcher, WarehouseLead, Account]
    code: 200
    input: []
    output: Branch
    side_effects: []
  - method: POST
    path: "/pool-supply/branches/{id}/close-season"
    description: "Close the branch season; cascades to programs and commitments"
    roles: [BranchManager]
    code: 200
    input: []
    output: Branch
    side_effects: ["programs OPEN → CLOSED; commitments COMMITTED short → DEFAULTED else FULFILLED; version +1"]

  # --- Account ---
  - method: POST
    path: "/pool-supply/accounts"
    description: "Create account"
    roles: [BranchManager]
    code: 201
    input: [account_number, account_type, "hazmat_delivery_license_expiry?", "willcall_authorized?", "credit_hold?"]
    output: Account
    side_effects: ["tier PRO; ytd_volume_cents 0; status ACTIVE"]
  - method: GET
    path: "/pool-supply/accounts"
    description: "List accounts"
    roles: [BranchManager, CounterRep, RouteDispatcher, WarehouseLead]
    code: 200
    input: ["limit?", "offset?", "account_type?", "tier?"]
    output: "Account[]"
    side_effects: []
  - method: GET
    path: "/pool-supply/accounts/{id}"
    description: "Get account"
    roles: [BranchManager, CounterRep, RouteDispatcher, WarehouseLead, Account]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: PATCH
    path: "/pool-supply/accounts/{id}"
    description: "Update account flags (credit_hold, willcall_authorized, hazmat_delivery_license_expiry, status)"
    roles: [BranchManager]
    code: 200
    input: ["credit_hold?", "willcall_authorized?", "hazmat_delivery_license_expiry?", "status?"]
    output: Account
    side_effects: []

  # --- Product ---
  - method: POST
    path: "/pool-supply/products"
    description: "Create product"
    roles: [BranchManager]
    code: 201
    input: [sku, product_family, base_price_cents, "hazmat_class?", "expiry_tracked?", "low_stock_floor?", "shortage_freeze_threshold?"]
    output: Product
    side_effects: []
  - method: GET
    path: "/pool-supply/products"
    description: "List products"
    roles: [BranchManager, CounterRep, RouteDispatcher, WarehouseLead, Account]
    code: 200
    input: ["limit?", "offset?", "product_family?", "hazmat_class?"]
    output: "Product[]"
    side_effects: []
  - method: GET
    path: "/pool-supply/products/{id}"
    description: "Get product"
    roles: [BranchManager, CounterRep, RouteDispatcher, WarehouseLead, Account]
    code: 200
    input: []
    output: Product
    side_effects: []

  # --- StockLot ---
  - method: POST
    path: "/pool-supply/stock-lots"
    description: "Receive a stock lot"
    roles: [WarehouseLead]
    code: 201
    input: [branch_id, product_id, lot_code, qty_on_hand, "expiry_date?"]
    output: StockLot
    side_effects: ["qty_available = qty_on_hand; hazmat_storage_class copied from product"]
  - method: GET
    path: "/pool-supply/stock-lots"
    description: "List lots (filtered by branch_id / product_id)"
    roles: [BranchManager, CounterRep, RouteDispatcher, WarehouseLead]
    code: 200
    input: ["limit?", "offset?", "branch_id?", "product_id?"]
    output: "StockLot[]"
    side_effects: []
  - method: GET
    path: "/pool-supply/stock-lots/{id}"
    description: "Get lot"
    roles: [BranchManager, CounterRep, RouteDispatcher, WarehouseLead]
    code: 200
    input: []
    output: StockLot
    side_effects: []
  - method: POST
    path: "/pool-supply/stock-lots/{id}/replenish"
    description: "Add units to a lot; triggers automatic backorder waterfall sweep"
    roles: [WarehouseLead]
    code: 200
    input: [add_qty]
    output: StockLot
    side_effects: ["qty_on_hand += add_qty; backorder_waterfall_allocation sweep; branch_posture recompute; version +1"]

  # --- SeasonalProgram / Commitment ---
  - method: POST
    path: "/pool-supply/seasonal-programs"
    description: "Create seasonal program (DRAFT)"
    roles: [BranchManager]
    code: 201
    input: [branch_id, program_name, order_window_start, order_window_end, ship_window_start, ship_window_end, early_buy_discount_pct, pool_cap_units]
    output: SeasonalProgram
    side_effects: []
  - method: GET
    path: "/pool-supply/seasonal-programs"
    description: "List programs"
    roles: [BranchManager, CounterRep, RouteDispatcher, WarehouseLead, Account]
    code: 200
    input: ["limit?", "offset?", "branch_id?", "status?"]
    output: "SeasonalProgram[]"
    side_effects: []
  - method: GET
    path: "/pool-supply/seasonal-programs/{id}"
    description: "Get program"
    roles: [BranchManager, CounterRep, RouteDispatcher, WarehouseLead, Account]
    code: 200
    input: []
    output: SeasonalProgram
    side_effects: []
  - method: POST
    path: "/pool-supply/seasonal-programs/{id}/open"
    description: "Open program for commitments"
    roles: [BranchManager]
    code: 200
    input: []
    output: SeasonalProgram
    side_effects: ["status OPEN; version +1"]
  - method: POST
    path: "/pool-supply/seasonal-programs/{id}/close"
    description: "Close program; settle commitments"
    roles: [BranchManager]
    code: 200
    input: []
    output: SeasonalProgram
    side_effects: ["commitments settled FULFILLED/DEFAULTED; status CLOSED"]
  - method: POST
    path: "/pool-supply/seasonal-commitments"
    description: "Create commitment; supersedes existing COMMITTED commitment for same (program, account) — OCC on program version"
    roles: [BranchManager]
    code: 201
    input: [program_id, account_id, committed_units, expected_program_version]
    output: SeasonalCommitment
    side_effects: ["prior COMMITTED commitment for pair → SUPERSEDED; Branch.seasonal_pool_units recomputed; program.version +1"]
  - method: GET
    path: "/pool-supply/seasonal-commitments"
    description: "List commitments"
    roles: [BranchManager, Account]
    code: 200
    input: ["limit?", "offset?", "program_id?", "account_id?", "status?"]
    output: "SeasonalCommitment[]"
    side_effects: []
  - method: GET
    path: "/pool-supply/seasonal-commitments/{id}"
    description: "Get commitment"
    roles: [BranchManager, Account]
    code: 200
    input: []
    output: SeasonalCommitment
    side_effects: []

  # --- SalesOrder / OrderLine ---
  - method: POST
    path: "/pool-supply/orders"
    description: "Create draft order (lines embedded)"
    roles: [CounterRep, RouteDispatcher, Account, BranchManager]
    code: 201
    input: [branch_id, account_id, channel, "commitment_id?", "route_date?", "requested_pickup_slot?", lines]
    output: SalesOrder
    side_effects: ["fulfillment DRAFT; payment UNINVOICED; OrderLines created with zeroed computed fields"]
  - method: GET
    path: "/pool-supply/orders"
    description: "List orders"
    roles: [BranchManager, CounterRep, RouteDispatcher, WarehouseLead, Account]
    code: 200
    input: ["limit?", "offset?", "branch_id?", "account_id?", "channel?", "fulfillment_status?", "payment_status?", "commitment_id?"]
    output: "SalesOrder[]"
    side_effects: []
  - method: GET
    path: "/pool-supply/orders/{id}"
    description: "Get order"
    roles: [BranchManager, CounterRep, RouteDispatcher, WarehouseLead, Account]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []
  - method: GET
    path: "/pool-supply/order-lines"
    description: "Flat list of order lines across orders (reverse-reachability for product_id / allocated_lot_id)"
    roles: [BranchManager, CounterRep, RouteDispatcher, WarehouseLead]
    code: 200
    input: ["limit?", "offset?", "product_id?", "allocated_lot_id?", "order_id?"]
    output: "OrderLine[]"
    side_effects: []
  - method: GET
    path: "/pool-supply/order-lines/{id}"
    description: "Get a single order line"
    roles: [BranchManager, CounterRep, RouteDispatcher, WarehouseLead]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/pool-supply/orders/{id}/lines"
    description: "List order lines"
    roles: [BranchManager, CounterRep, RouteDispatcher, WarehouseLead, Account]
    code: 200
    input: ["limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []
  - method: POST
    path: "/pool-supply/orders/{id}/confirm"
    description: "Confirm order: tier snapshot, FEFO lot allocation, backorder creation, posture cascade, freight+pricing. OCC on branch version"
    roles: [CounterRep, RouteDispatcher, Account, BranchManager]
    code: 200
    input: [expected_branch_version]
    output: SalesOrder
    side_effects: ["lot reservations; backorders created; branch posture recompute; commitment consumption; Branch.version +1"]
  - method: POST
    path: "/pool-supply/orders/{id}/mark-loaded"
    description: "Warehouse marks order picked/loaded; decrements qty_on_hand and releases reservations"
    roles: [WarehouseLead]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["lot qty_on_hand decremented; reservations released"]
  - method: POST
    path: "/pool-supply/orders/{id}/complete"
    description: "Handover / proof-of-delivery; requires PAID"
    roles: [CounterRep, RouteDispatcher, BranchManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["fulfillment COMPLETED"]
  - method: POST
    path: "/pool-supply/orders/{id}/cancel"
    description: "Cancel CONFIRMED order; compensating release of reservations, backorders, commitment consumption; tier ratchet stays"
    roles: [BranchManager, Account]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["reservations released; OPEN backorders CANCELLED; commitment consumed_units decremented (FULFILLED may revert to COMMITTED); ytd_volume_cents decremented; Account.tier unchanged; branch posture recompute"]
  - method: POST
    path: "/pool-supply/orders/{id}/invoice"
    description: "Invoice a CONFIRMED order; freezes invoiced_cents and posts ytd volume"
    roles: [BranchManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["payment INVOICED; Account.ytd_volume_cents += invoiced_cents; Account.tier recomputed (ratchet up only)"]
  - method: POST
    path: "/pool-supply/orders/{id}/pay"
    description: "Record payment"
    roles: [BranchManager, Account]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["payment PAID"]

  # --- BackorderRequest ---
  - method: GET
    path: "/pool-supply/backorder-requests"
    description: "List backorders"
    roles: [BranchManager, CounterRep, RouteDispatcher, WarehouseLead]
    code: 200
    input: ["limit?", "offset?", "branch_id?", "product_id?", "account_id?", "status?", "order_line_id?", "superseded_by_id?"]
    output: "BackorderRequest[]"
    side_effects: []
  - method: GET
    path: "/pool-supply/backorder-requests/{id}"
    description: "Get backorder"
    roles: [BranchManager, CounterRep, RouteDispatcher, WarehouseLead]
    code: 200
    input: []
    output: BackorderRequest
    side_effects: []
  - method: POST
    path: "/pool-supply/backorder-requests/{id}/allocate"
    description: "Manually allocate an OPEN backorder against a specific lot; OCC on lot version"
    roles: [WarehouseLead, BranchManager]
    code: 200
    input: [lot_id, expected_stock_lot_version]
    output: BackorderRequest
    side_effects: ["reservation placed per parent order channel; qty_open decremented; may CLOSE; lot.version +1; branch posture recompute"]
  - method: POST
    path: "/pool-supply/backorder-requests/{id}/cancel"
    description: "Cancel an OPEN backorder"
    roles: [BranchManager]
    code: 200
    input: []
    output: BackorderRequest
    side_effects: ["branch posture recompute"]

  # --- ServiceCenter / WarrantyClaim ---
  - method: POST
    path: "/pool-supply/service-centers"
    description: "Register authorized service center"
    roles: [BranchManager]
    code: 201
    input: [center_name, region_code, authorized_brands, labor_rate_cents]
    output: ServiceCenter
    side_effects: ["status ACTIVE"]
  - method: GET
    path: "/pool-supply/service-centers"
    description: "List service centers"
    roles: [BranchManager, CounterRep, RouteDispatcher, WarehouseLead, Account]
    code: 200
    input: ["limit?", "offset?", "region_code?", "status?"]
    output: "ServiceCenter[]"
    side_effects: []
  - method: GET
    path: "/pool-supply/service-centers/{id}"
    description: "Get service center"
    roles: [BranchManager, CounterRep, RouteDispatcher, WarehouseLead, Account]
    code: 200
    input: []
    output: ServiceCenter
    side_effects: []
  - method: PATCH
    path: "/pool-supply/service-centers/{id}"
    description: "Update center (status suspension)"
    roles: [BranchManager]
    code: 200
    input: ["status?", "labor_rate_cents?"]
    output: ServiceCenter
    side_effects: []
  - method: POST
    path: "/pool-supply/warranty-claims"
    description: "Submit claim; assigns authorized service center; computes provisional credit"
    roles: [Account, BranchManager]
    code: 201
    input: [account_id, product_id, serial_number, brand, purchase_date, failure_description]
    output: WarrantyClaim
    side_effects: ["assigned_center_id via selector; provisional_credit_cents computed; status SUBMITTED"]
  - method: GET
    path: "/pool-supply/warranty-claims"
    description: "List claims"
    roles: [BranchManager, Account]
    code: 200
    input: ["limit?", "offset?", "account_id?", "status?", "product_id?", "assigned_center_id?"]
    output: "WarrantyClaim[]"
    side_effects: []
  - method: GET
    path: "/pool-supply/warranty-claims/{id}"
    description: "Get claim"
    roles: [BranchManager, Account]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/pool-supply/warranty-claims/{id}/start-review"
    description: "Move claim to UNDER_REVIEW"
    roles: [BranchManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/pool-supply/warranty-claims/{id}/request-info"
    description: "Request more info (MORE_INFO)"
    roles: [BranchManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/pool-supply/warranty-claims/{id}/supply-info"
    description: "Account supplies info; loops back to UNDER_REVIEW; cycle counter increments"
    roles: [Account]
    code: 200
    input: [info_note]
    output: WarrantyClaim
    side_effects: ["info_cycles += 1"]
  - method: POST
    path: "/pool-supply/warranty-claims/{id}/approve"
    description: "Approve claim; center must be ACTIVE"
    roles: [BranchManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/pool-supply/warranty-claims/{id}/reject"
    description: "Reject claim; provisional credit zeroed"
    roles: [BranchManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["provisional_credit_cents = 0"]
  - method: POST
    path: "/pool-supply/warranty-claims/{id}/resolve"
    description: "Resolve with actual hours; computes final credit"
    roles: [BranchManager]
    code: 200
    input: [actual_labor_hours]
    output: WarrantyClaim
    side_effects: ["final_credit_cents computed"]
  - method: POST
    path: "/pool-supply/warranty-claims/{id}/close"
    description: "Close resolved claim"
    roles: [BranchManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  # --- ReturnAuthorization ---
  - method: POST
    path: "/pool-supply/return-authorizations"
    description: "Request RMA"
    roles: [Account, BranchManager]
    code: 201
    input: [account_id, order_id, product_id, lot_id, qty, reason]
    output: ReturnAuthorization
    side_effects: ["status REQUESTED; expired-chemical rejection at create"]
  - method: GET
    path: "/pool-supply/return-authorizations"
    description: "List RMAs"
    roles: [BranchManager, WarehouseLead, Account]
    code: 200
    input: ["limit?", "offset?", "account_id?", "order_id?", "status?", "product_id?", "lot_id?"]
    output: "ReturnAuthorization[]"
    side_effects: []
  - method: GET
    path: "/pool-supply/return-authorizations/{id}"
    description: "Get RMA"
    roles: [BranchManager, WarehouseLead, Account]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: []
  - method: POST
    path: "/pool-supply/return-authorizations/{id}/approve"
    description: "Approve RMA; computes credit; re-checks lot expiry"
    roles: [BranchManager]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: ["restocking_fee_pct, credit_cents computed"]
  - method: POST
    path: "/pool-supply/return-authorizations/{id}/deny"
    description: "Deny RMA"
    roles: [BranchManager]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: []
  - method: POST
    path: "/pool-supply/return-authorizations/{id}/receive"
    description: "Warehouse receives goods; non-chemical restock only"
    roles: [WarehouseLead]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: ["lot qty_on_hand += qty iff product not CHEMICAL and reason != EXPIRED"]
  - method: POST
    path: "/pool-supply/return-authorizations/{id}/credit"
    description: "Post credit"
    roles: [BranchManager]
    code: 200
    input: []
    output: ReturnAuthorization
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Account role acting on a resource whose account_id != X-User-ID" }
  - { id: ERR_NOT_CLAIM_OWNER, http: 403, condition: "Account supplying info on a claim it does not own" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Referenced id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid required field (e.g. qty < 1, end before start)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure for transition endpoints" }
  - { id: ERR_ORDER_NOT_DRAFT, http: 409, condition: "Confirm requires fulfillment DRAFT" }
  - { id: ERR_ORDER_NOT_CONFIRMED, http: 409, condition: "mark-loaded / invoice require fulfillment CONFIRMED" }
  - { id: ERR_ORDER_NOT_LOADED, http: 409, condition: "complete requires fulfillment PICKED_LOADED" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "cancel requires fulfillment CONFIRMED" }
  - { id: ERR_ORDER_LINES_SHORT, http: 409, condition: "mark-loaded requires zero backordered_qty on all lines" }
  - { id: ERR_ORDER_ALREADY_INVOICED, http: 409, condition: "invoice requires payment UNINVOICED" }
  - { id: ERR_ORDER_NOT_INVOICED, http: 409, condition: "pay requires payment INVOICED" }
  - { id: ERR_ORDER_UNPAID, http: 409, condition: "complete requires payment PAID" }
  - { id: ERR_BRANCH_CLOSED, http: 409, condition: "Action requires Branch.status OPEN" }
  - { id: ERR_BRANCH_FROZEN, http: 409, condition: "Order CONFIRM blocked while Branch.posture == FROZEN" }
  - { id: ERR_BRANCH_NOT_HAZMAT_CERTIFIED, http: 422, condition: "Order contains hazmat line but branch lacks hazmat storage certification" }
  - { id: ERR_BRANCH_ORDERS_OPEN, http: 409, condition: "close-season blocked by orders in CONFIRMED/PICKED_LOADED" }
  - { id: ERR_BRANCH_BACKORDERS_OPEN, http: 409, condition: "close-season blocked by OPEN/ALLOCATED backorders" }
  - { id: ERR_HAZMAT_LICENSE_EXPIRED, http: 422, condition: "ROUTE_DELIVERY of hazmat with account license expiry <= route_date (or no license)" }
  - { id: ERR_ROUTE_DATE_OUTSIDE_WINDOW, http: 422, condition: "route_date before today, or hazmat route_date beyond peak_season_end" }
  - { id: ERR_WILLCALL_NOT_AUTHORIZED, http: 422, condition: "Account not authorized for will-call" }
  - { id: ERR_ACCOUNT_NOT_ORDERABLE, http: 402, condition: "Account SUSPENDED or on credit hold" }
  - { id: ERR_COMMITMENT_EXHAUSTED, http: 422, condition: "Commitment missing, not COMMITTED, wrong account, or remaining units < order units" }
  - { id: ERR_COMMITMENT_BELOW_CONSUMED, http: 422, condition: "Superseding commitment units < already-consumed units" }
  - { id: ERR_COMMITMENT_WINDOW_CLOSED, http: 422, condition: "Commitment create outside [order_window_start, order_window_end]" }
  - { id: ERR_PROGRAM_POOL_EXHAUSTED, http: 422, condition: "Program committed-units pool cap would be exceeded" }
  - { id: ERR_PROGRAM_NOT_DRAFT, http: 409, condition: "open requires DRAFT" }
  - { id: ERR_PROGRAM_NOT_OPEN, http: 409, condition: "close/commitment-create requires OPEN" }
  - { id: ERR_PROGRAM_WINDOW_INVALID, http: 400, condition: "order/ship window start after end" }
  - { id: ERR_BACKORDER_NOT_OPEN, http: 409, condition: "allocate/cancel requires OPEN" }
  - { id: ERR_LOT_EMPTY, http: 422, condition: "Manual allocate against lot with qty_available 0" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "start-review requires SUBMITTED" }
  - { id: ERR_CLAIM_NOT_UNDER_REVIEW, http: 409, condition: "request-info/approve/reject require UNDER_REVIEW" }
  - { id: ERR_CLAIM_NOT_MORE_INFO, http: 409, condition: "supply-info requires MORE_INFO" }
  - { id: ERR_CLAIM_INFO_CYCLE_EXHAUSTED, http: 409, condition: "Claim exceeded 3 MORE_INFO cycles; must be rejected" }
  - { id: ERR_CLAIM_NOT_APPROVED, http: 409, condition: "resolve requires APPROVED" }
  - { id: ERR_CLAIM_NOT_RESOLVED, http: 409, condition: "close requires RESOLVED" }
  - { id: ERR_CLAIM_SERIAL_DUPLICATE, http: 409, condition: "serial_number already claimed for this product on a non-REJECTED claim" }
  - { id: ERR_NO_AUTHORIZED_CENTER, http: 422, condition: "No ACTIVE ServiceCenter carries the brand" }
  - { id: ERR_CENTER_SUSPENDED, http: 409, condition: "Approve blocked: assigned center SUSPENDED" }
  - { id: ERR_RMA_NOT_REQUESTED, http: 409, condition: "approve/deny require REQUESTED" }
  - { id: ERR_RMA_NOT_APPROVED, http: 409, condition: "receive requires APPROVED" }
  - { id: ERR_RMA_NOT_RECEIVED, http: 409, condition: "credit requires RECEIVED" }
  - { id: ERR_RMA_ORDER_NOT_COMPLETED, http: 409, condition: "RMA approve requires original order COMPLETED" }
  - { id: ERR_RETURN_EXPIRED_CHEMICAL, http: 422, condition: "EXPIRED-reason chemical RMA with lot.expiry_date <= logical today" }
  - { id: ERR_RMA_LOT_EXPIRED_SINCE_REQUEST, http: 409, condition: "Chemical lot expired between RMA request and approve/receive" }
  - { id: ERR_STALE_BRANCH_VERSION, http: 412, condition: "expected_branch_version mismatch on order confirm" }
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "expected_stock_lot_version mismatch on backorder allocate" }
  - { id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "expected_program_version mismatch on commitment create" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BranchManager
    description: "Branch general manager; full administrative surface incl. clock, close-season, invoicing, claim adjudication, RMA approval"
    identity: opaque
    exclusive_operations:
      - "POST /pool-supply/_clock/set_current_utc"
      - "POST /pool-supply/branches, POST /pool-supply/branches/{id}/close-season"
      - "POST /pool-supply/accounts, PATCH /pool-supply/accounts/{id}"
      - "POST /pool-supply/products"
      - "POST /pool-supply/seasonal-programs(+open/close), POST /pool-supply/seasonal-commitments"
      - "POST /pool-supply/orders/{id}/invoice"
      - "POST /pool-supply/backorder-requests/{id}/cancel"
      - "POST /pool-supply/service-centers, PATCH /pool-supply/service-centers/{id}"
      - "Warranty claim lifecycle: start-review, request-info, approve, reject, resolve, close"
      - "RMA approve/deny/credit"
    shared_operations:
      - "POST /pool-supply/orders, /confirm, /cancel, /pay, /complete"
      - "POST /pool-supply/warranty-claims, POST /pool-supply/return-authorizations"
      - "POST /pool-supply/backorder-requests/{id}/allocate"
      - "All GET list/detail endpoints"
  - name: CounterRep
    description: "Will-call counter representative; confirms WILL_CALL orders and completes pickups"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /pool-supply/orders, /confirm"
      - "POST /pool-supply/orders/{id}/complete (WILL_CALL handover)"
      - "GET endpoints"
  - name: RouteDispatcher
    description: "Route desk; confirms ROUTE_DELIVERY orders and completes deliveries"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /pool-supply/orders, /confirm"
      - "POST /pool-supply/orders/{id}/complete (route POD)"
      - "GET endpoints"
  - name: WarehouseLead
    description: "Warehouse floor lead; receives lots, replenishes, loads orders, allocates backorders, receives RMA goods"
    identity: opaque
    exclusive_operations:
      - "POST /pool-supply/stock-lots, POST /pool-supply/stock-lots/{id}/replenish"
      - "POST /pool-supply/orders/{id}/mark-loaded"
      - "POST /pool-supply/return-authorizations/{id}/receive"
    shared_operations:
      - "POST /pool-supply/backorder-requests/{id}/allocate"
      - "GET endpoints"
  - name: Account
    description: "Dealer or service-company buyer; acts only on own resources (account_id == X-User-ID)"
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /pool-supply/warranty-claims/{id}/supply-info (own claim)"
    shared_operations:
      - "POST /pool-supply/orders, /confirm, /cancel, /pay (own orders)"
      - "POST /pool-supply/warranty-claims, POST /pool-supply/return-authorizations (own)"
      - "GET endpoints (own resources; staff-visible list endpoints allowed for catalog reads)"
