              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg: $.data.id, mtgv: $.data.version }
