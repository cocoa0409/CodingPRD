          - "validations[priority=24]"
          - "errors[ERR_DUPLICATE_LABEL_MARKET]"
        distinguishing_aspect: |
          Two LabelApprovals for same (product, market) -> second create
          returns ERR_DUPLICATE_LABEL_MARKET.
        test_recipe:
          setup: ["product p_dl with NY_SLA label already"]
          setup_api_calls:
            - call: "POST /cidery/products"
