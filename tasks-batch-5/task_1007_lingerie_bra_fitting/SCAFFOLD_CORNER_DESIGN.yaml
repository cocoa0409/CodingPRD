# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (task_1007)
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: customer_create_success_defaults
        claim_type: Creation
        grounds: [entities.Customer.fields.loyalty_points, entities.Customer.fields.loyalty_tier]
        distinguishing_aspect: "POST /boutique/customers returns 201 with loyalty_points 0, loyalty_tier BRONZE, store_credit_cents 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /boutique/customers"
              payload: { full_name: "New Cust", email: "new.cust@x.com" }
              as: StoreManager
              captures: { tier: $.data.loyalty_tier, pts: $.data.loyalty_points, cr: $.data.store_credit_cents }
          assert:
            - "tier == BRONZE"
            - "pts == 0"
            - "cr == 0"

      - name: sku_price_extended_size_surcharge
        claim_type: Computed Fields
        grounds: [calculations.sku_price, entities.SKU.fields.price_cents]
        distinguishing_aspect: "A SKU with band_size 40 (>= EXTENDED_BAND_MIN) gets price_cents = base 4000 + SIZE_SURCHARGE_CENTS 500 = 4500."
        test_recipe:
          setup: ["A product with base_price_cents 4000."]
          setup_api_calls:
            - call: "POST /boutique/products"
              payload: { style_name: "Ext Bra", brand: "Elomi", category: "EVERYDAY_BRA", base_price_cents: 4000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /boutique/skus"
              payload: { product_id: "${prod_id}", band_size: 40, cup_size: "C", sku_code: "EXT-40C", initial_stock: 2 }
              as: StoreManager
              captures: { price: $.data.price_cents }
          assert:
            - "price == 4500"

      - name: product_is_mastectomy_computed
        claim_type: Computed Fields
        grounds: [entities.Product.fields.is_mastectomy, entities.Product.fields.category]
        distinguishing_aspect: "Creating a MASTECTOMY_BRA product sets is_mastectomy true; an EVERYDAY_BRA product sets it false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /boutique/products"
              payload: { style_name: "Mast Bra", brand: "Amoena", category: "MASTECTOMY_BRA", base_price_cents: 12000, hygiene_class: "INTIMATE_NON_RETURNABLE" }
              as: StoreManager
              captures: { ism: $.data.is_mastectomy }
          assert:
            - "ism == true"

      - name: appointment_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_APPOINTMENT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent appointment id returns ERR_APPOINTMENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /boutique/appointments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_APPOINTMENT_NOT_FOUND"

      - name: create_order_missing_required_customer_id_returns_validation
        claim_type: Required Fields
        grounds: ["errors[ERR_VALIDATION]", "entities.Order.fields.customer_id"]
        distinguishing_aspect: "POST /boutique/orders without customer_id returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /boutique/orders"
              payload: {}
              as: Customer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

      - name: customer_loyalty_tier_silver_boundary
        claim_type: Computed Fields
        grounds: [entities.Customer.fields.loyalty_tier, entities.Customer.fields.loyalty_points]
        distinguishing_aspect: "A customer whose loyalty_points is exactly 1000 derives loyalty_tier SILVER (>= SILVER threshold)."
        test_recipe:
          setup: ["A customer credited exactly 1000 loyalty points."]
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Sil Ver", email: "sil.ver@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/customers/${cust_id}/loyalty-adjustments"
              payload: { points_delta: 1000, reason: "PROMOTION" }
              as: StoreManager
          trigger:
            - call: "GET /boutique/customers/${cust_id}"
              payload: {}
              as: StoreManager
              captures: { tier: $.data.loyalty_tier }
          assert:
            - "tier == SILVER"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_returns_invalid_state
        claim_type: Idempotency
        grounds: ["state_machines.FittingAppointment.REQUESTED_to_CONFIRMED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming an appointment already CONFIRMED returns ERR_INVALID_STATE; no second slot lock."
        test_recipe:
          setup: ["A CONFIRMED appointment."]
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Ida Idem", email: "ida.idem@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/fitters"
              payload: { full_name: "Idem Fitter" }
              as: StoreManager
              captures: { fitter_id: $.data.id }
            - call: "POST /boutique/rooms"
              payload: { room_name: "Idem Room", capacity: 5 }
              as: StoreManager
              captures: { room_id: $.data.id }
            - call: "POST /boutique/appointments"
              payload: { customer_id: "${cust_id}", fitter_id: "${fitter_id}", room_id: "${room_id}", fitting_type: "STANDARD", scheduled_start: "2026-07-06T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /boutique/appointments/${appt_id}/confirm"
              payload: {}
              as: Fitter
              as_user_id: "${fitter_id}"
          trigger:
            - call: "POST /boutique/appointments/${appt_id}/confirm"
              payload: {}
              as: Fitter
              as_user_id: "${fitter_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: complete_without_fit_returns_fit_not_submitted
        claim_type: Precondition Enforcement
        grounds: ["state_machines.FittingAppointment.CHECKED_IN_to_COMPLETED", "errors[ERR_FIT_NOT_SUBMITTED]"]
        distinguishing_aspect: "Completing a CHECKED_IN appointment before any fit was submitted returns ERR_FIT_NOT_SUBMITTED."
        test_recipe:
          setup: ["A CHECKED_IN appointment with no recommendation yet."]
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Fay Fit0", email: "fay.fit0@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/fitters"
              payload: { full_name: "Fit0 Fitter" }
              as: StoreManager
              captures: { fitter_id: $.data.id }
            - call: "POST /boutique/rooms"
              payload: { room_name: "Fit0 Room", capacity: 5 }
              as: StoreManager
              captures: { room_id: $.data.id }
            - call: "POST /boutique/appointments"
              payload: { customer_id: "${cust_id}", fitter_id: "${fitter_id}", room_id: "${room_id}", fitting_type: "STANDARD", scheduled_start: "2026-07-06T11:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /boutique/appointments/${appt_id}/confirm"
              payload: {}
              as: Fitter
              as_user_id: "${fitter_id}"
            - call: "POST /boutique/appointments/${appt_id}/check-in"
              payload: {}
              as: Fitter
              as_user_id: "${fitter_id}"
          trigger:
            - call: "POST /boutique/appointments/${appt_id}/complete"
              payload: {}
              as: Fitter
              as_user_id: "${fitter_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FIT_NOT_SUBMITTED"

      - name: pay_before_place_returns_order_not_placed
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Order.UNPAID_to_PAID", "errors[ERR_ORDER_NOT_PLACED]"]
        distinguishing_aspect: "Paying a DRAFT order (never placed) returns ERR_ORDER_NOT_PLACED."
        test_recipe:
          setup: ["A DRAFT order with one line, never placed."]
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Pre Pay", email: "pre.pay@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/products"
              payload: { style_name: "PP Bra", brand: "Wacoal", category: "EVERYDAY_BRA", base_price_cents: 2000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /boutique/skus"
              payload: { product_id: "${prod_id}", band_size: 34, cup_size: "C", sku_code: "PP-34C", initial_stock: 5 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /boutique/orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /boutique/orders/${order_id}/pay"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ORDER_NOT_PLACED"

      - name: place_empty_order_returns_empty_order
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Order.DRAFT_to_PLACED", "errors[ERR_EMPTY_ORDER]"]
        distinguishing_aspect: "Placing an order with zero ACTIVE lines returns ERR_EMPTY_ORDER."
        test_recipe:
          setup: ["A DRAFT order with no lines."]
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Emp Ty", email: "emp.ty@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /boutique/orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_EMPTY_ORDER"

      - name: cancel_fulfilled_order_returns_not_cancellable
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Order.PLACED_to_FULFILLED", "errors[ERR_ORDER_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancelling a FULFILLED order returns ERR_ORDER_NOT_CANCELLABLE."
        test_recipe:
          setup: ["A fully FULFILLED order."]
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Ful Ly", email: "ful.ly@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/products"
              payload: { style_name: "FL Bra", brand: "Freya", category: "EVERYDAY_BRA", base_price_cents: 2000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /boutique/skus"
              payload: { product_id: "${prod_id}", band_size: 34, cup_size: "C", sku_code: "FL-34C", initial_stock: 5 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /boutique/orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /boutique/orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /boutique/orders/${order_id}/pay"
              payload: {}
              as: BillingClerk
            - call: "POST /boutique/orders/${order_id}/fulfill"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /boutique/orders/${order_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ORDER_NOT_CANCELLABLE"

      - name: appointment_reschedule_cycle_reconfirm
        claim_type: Valid Transition
        grounds: [state_machines.FittingAppointment.CONFIRMED_to_REQUESTED, state_machines.FittingAppointment.REQUESTED_to_CONFIRMED]
        distinguishing_aspect: "A CONFIRMED appointment reschedules to REQUESTED and can be re-CONFIRMED (cyclic loop back to CONFIRMED)."
        test_recipe:
          setup: ["A CONFIRMED appointment."]
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Res Ched", email: "res.ched@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/fitters"
              payload: { full_name: "Res Fitter" }
              as: StoreManager
              captures: { fitter_id: $.data.id }
            - call: "POST /boutique/rooms"
              payload: { room_name: "Res Room", capacity: 5 }
              as: StoreManager
              captures: { room_id: $.data.id }
            - call: "POST /boutique/appointments"
              payload: { customer_id: "${cust_id}", fitter_id: "${fitter_id}", room_id: "${room_id}", fitting_type: "STANDARD", scheduled_start: "2026-07-07T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /boutique/appointments/${appt_id}/confirm"
              payload: {}
              as: Fitter
              as_user_id: "${fitter_id}"
            - call: "POST /boutique/appointments/${appt_id}/reschedule"
              payload: { scheduled_start: "2026-07-08T14:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { st_after_resched: $.data.status }
          trigger:
            - call: "POST /boutique/appointments/${appt_id}/confirm"
              payload: {}
              as: Fitter
              as_user_id: "${fitter_id}"
              captures: { st_after_reconfirm: $.data.status }
          assert:
            - "st_after_resched == REQUESTED"
            - "st_after_reconfirm == CONFIRMED"

      - name: completed_appointment_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.FittingAppointment.CHECKED_IN_to_COMPLETED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A COMPLETED (terminal) appointment rejects any further transition (confirm) with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A COMPLETED appointment (fit submitted, then completed)."]
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Ter Min", email: "ter.min@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/fitters"
              payload: { full_name: "Term Fitter" }
              as: StoreManager
              captures: { fitter_id: $.data.id }
            - call: "POST /boutique/rooms"
              payload: { room_name: "Term Room", capacity: 5 }
              as: StoreManager
              captures: { room_id: $.data.id }
            - call: "POST /boutique/appointments"
              payload: { customer_id: "${cust_id}", fitter_id: "${fitter_id}", room_id: "${room_id}", fitting_type: "STANDARD", scheduled_start: "2026-07-09T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /boutique/appointments/${appt_id}/confirm"
              payload: {}
              as: Fitter
              as_user_id: "${fitter_id}"
            - call: "POST /boutique/appointments/${appt_id}/check-in"
              payload: {}
              as: Fitter
              as_user_id: "${fitter_id}"
              captures: { appt_v: $.data.version }
            - call: "POST /boutique/appointments/${appt_id}/fit"
              payload: { underbust_cm: 76, bust_cm: 84, fit_preference: "STANDARD", expected_appointment_version: "${appt_v}" }
              as: Fitter
              as_user_id: "${fitter_id}"
            - call: "POST /boutique/appointments/${appt_id}/complete"
              payload: {}
              as: Fitter
              as_user_id: "${fitter_id}"
          trigger:
            - call: "POST /boutique/appointments/${appt_id}/confirm"
              payload: {}
              as: Fitter
              as_user_id: "${fitter_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: reminder_send_before_due_returns_not_due
        claim_type: Precondition Enforcement
        grounds: ["state_machines.ReplacementReminder.SCHEDULED_to_SENT", "errors[ERR_REMINDER_NOT_DUE]"]
        distinguishing_aspect: "Sending a reminder while clock (2026-07-01 default) < due_date (2027-01-01) returns ERR_REMINDER_NOT_DUE."
        test_recipe:
          setup: ["A SCHEDULED reminder seeded by fulfilling a bra order at 2026-07-01 (due 2027-01-01); clock left at default."]
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Rem Ind", email: "rem.ind@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/products"
              payload: { style_name: "Rem Bra", brand: "Panache", category: "EVERYDAY_BRA", base_price_cents: 2000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /boutique/skus"
              payload: { product_id: "${prod_id}", band_size: 34, cup_size: "C", sku_code: "REM-34C", initial_stock: 5 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /boutique/orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /boutique/orders/${order_id}/pay"
              payload: {}
              as: BillingClerk
            - call: "POST /boutique/orders/${order_id}/fulfill"
              payload: {}
              as: StoreManager
            - call: "GET /boutique/reminders"
              payload: { order_line_id: "${line_id}" }
              as: StoreManager
              captures: { reminder_id: "$.data[0].id" }
          trigger:
            - call: "POST /boutique/reminders/${reminder_id}/send"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REMINDER_NOT_DUE"

      - name: reminder_send_when_due_succeeds
        claim_type: Valid Transition
        grounds: [state_machines.ReplacementReminder.SCHEDULED_to_SENT]
        distinguishing_aspect: "With clock advanced to due_date 2027-01-01 (>= due), sending the reminder transitions it to SENT."
        test_recipe:
          setup: ["A SCHEDULED reminder (due 2027-01-01); clock advanced to 2027-01-01."]
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Due Rem", email: "due.rem@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/products"
              payload: { style_name: "Due Bra", brand: "Panache", category: "EVERYDAY_BRA", base_price_cents: 2000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /boutique/skus"
              payload: { product_id: "${prod_id}", band_size: 34, cup_size: "C", sku_code: "DUE-34C", initial_stock: 5 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /boutique/orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /boutique/orders/${order_id}/pay"
              payload: {}
              as: BillingClerk
            - call: "POST /boutique/orders/${order_id}/fulfill"
              payload: {}
              as: StoreManager
            - call: "GET /boutique/reminders"
              payload: { order_line_id: "${line_id}" }
              as: StoreManager
              captures: { reminder_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /boutique/reminders/${reminder_id}/send"
              payload: {}
              as: StoreManager
              captures: { st: $.data.status }
          assert:
            - "st == SENT"

      - name: exchange_worn_item_returns_hygiene_error
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Exchange.REQUESTED_to_APPROVED", "errors[ERR_ITEM_NOT_EXCHANGEABLE_HYGIENE]"]
        distinguishing_aspect: "Approving an exchange whose item_condition is WORN returns ERR_ITEM_NOT_EXCHANGEABLE_HYGIENE even inside the window."
        test_recipe:
          setup: ["A fulfilled bra line (clock default 2026-07-01) with an exchange requested with item_condition WORN."]
          setup_api_calls:
            - call: "POST /boutique/customers"
              payload: { full_name: "Hy Giene", email: "hy.giene@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /boutique/products"
              payload: { style_name: "Hyg Bra", brand: "Freya", category: "EVERYDAY_BRA", base_price_cents: 4000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /boutique/skus"
              payload: { product_id: "${prod_id}", band_size: 34, cup_size: "C", sku_code: "HYG-34C", initial_stock: 3 }
              as: StoreManager
              captures: { sku_id: $.data.id }
            - call: "POST /boutique/orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /boutique/orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
