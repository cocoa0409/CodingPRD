      # --- corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml -------
      - name: format_review_cycle_terminates_at_declared_round_cap
        claim_type: cyclic
        grounds:
          - state_machines.Petition.FORMAT_REJECTED_to_FORMAT_REVIEW
          - calculations.required_valid_signature_threshold.constants.MAX_FORMAT_REVIEW_ROUNDS
          - errors[ERR_FORMAT_REVIEW_ROUNDS_EXHAUSTED]
        excluded_because:
          difficulty_instance: petition_format_review_revision_cycle_exhausts_rounds
          rationale: |
            The §1.8 instance walks the DRAFT -> FORMAT_REVIEW -> FORMAT_REJECTED ->
            FORMAT_REVIEW loop twice, asserts format_review_round after each leg and
            proves the third submit returns ERR_FORMAT_REVIEW_ROUNDS_EXHAUSTED - the whole
            `cyclic` shape claim (loop works, loop count respected, termination condition
            enforced) is already covered there.

      - name: batch_fork_join_reconverges_on_the_petition_ledger
        claim_type: side_effect_execution
        grounds:
          - state_machines.SignatureBatch.AFFIDAVIT_VERIFIED_to_SAMPLED
          - state_machines.SignatureBatch.SAMPLED_to_FULLY_CHECKED
          - calculations.batch_verification_cost
        excluded_because:
          difficulty_instance: signature_batch_fork_join_diamond_with_delta_cost
          rationale: |
            The §1.8 instance forks two batches down different examination paths and rejoins
            them at the petition cost ledger, asserting every side effect of tally
            (batch advance, stored cost, delta accrual into round and petition) at each
            join. Repeating side_effect_execution for the same endpoint here would add no
            new observable.

      - name: circulator_suspension_cascade_is_conditional_on_child_state
        claim_type: conditional_cascade
        grounds:
          - state_machines.Circulator.REGISTERED_to_SUSPENDED
          - state_machines.CirculationAssignment.ACTIVE_to_SUSPENDED
          - endpoints[POST /circulators/{circulator_id}/reinstate]
        excluded_because:
          difficulty_instance: circulator_suspend_reinstate_cycle_with_conditional_cascade
          rationale: |
            The §1.8 instance suspends a circulator holding one ACTIVE and one TERMINATED
            assignment, asserts that only the ACTIVE one moves, then reinstates and asserts
            that only the previously SUSPENDED one comes back - the conditional-cascade
            pattern for this dimension is fully asserted there.

      - name: revocation_cascade_reaches_the_petition_ledger
        claim_type: cascade_down
        grounds:
          - state_machines.Circulator.REVOKED
          - endpoints[POST /circulators/{circulator_id}/revoke]
          - calculations.petition_raw_and_accepted_counts
        excluded_because:
          difficulty_instance: circulator_revoke_cascades_four_levels_to_petition_ledger
          rationale: |
            Circulator -> assignment -> batch -> line -> petition ledger is walked level by
            level in §1.8, including the "only non-terminal children are touched" half of
            the cascade-down claim.

      - name: fraud_substantiation_cascade_across_batch_and_assignment
        claim_type: cross_entity
        grounds:
          - state_machines.FraudReferral.REFERRED_TO_AG_to_SUBSTANTIATED
          - endpoints[POST /fraud-referrals/{referral_id}/adjudicate]
        excluded_because:
          difficulty_instance: fraud_substantiation_cascades_to_batch_and_assignment
          rationale: |
            The §1.8 instance asserts every documented side effect of a SUBSTANTIATED
            finding: batch INVALIDATED, lines VOIDED with void_reason FRAUD_SUBSTANTIATED,
            voided_signature_count recorded, strike incremented, credibility recomputed
            under the adjudicated variant, circulator SUSPENDED at the threshold and its
            ACTIVE assignments suspended.

      - name: batch_reinstatement_reverses_every_invalidation_effect
        claim_type: compensation
        grounds:
          - state_machines.SignatureBatch.INVALIDATED_to_restored
          - state_machines.SignatureRecord.VOIDED_to_restored
          - endpoints[POST /signature-batches/{batch_id}/reinstate]
        excluded_because:
          difficulty_instance: batch_invalidate_reinstate_preserves_signature_ledger
          rationale: |
            The compensation claim (undo restores every original side effect with no drift)
            is asserted field by field in §1.8, including status_before_invalidation,
            per-line status_before_void restoration and the cost add-back.

      - name: round_void_returns_the_petition_to_its_prior_stage
        claim_type: compensation
        grounds:
          - state_machines.VerificationRound.CLOSED_to_VOIDED
          - endpoints[POST /verification-rounds/{round_id}/void]
        excluded_because:
          difficulty_instance: round_void_preserves_cost_ledger
          rationale: |
            §1.8 asserts the full reversal set of a void - lines back to PENDING with
            in_sample cleared, batches back to their pre-round status with stored cost 0,
            accrued cost subtracted, and petition.status back to SIGNATURES_FILED.

      - name: round_creation_guarded_by_the_petition_stage
        claim_type: guarded_transitions
        grounds:
          - state_machines.VerificationRound.initial_state
          - validations[priority 10]
          - errors[ERR_INVALID_PETITION_STATE]
        excluded_because:
          difficulty_instance: round_creation_blocked_by_petition_not_yet_filed
          rationale: |
            The cross-entity guard "a round may open only when the petition has reached
            SIGNATURES_FILED" is asserted in §1.8 in both directions - refused before
            file-signatures, accepted immediately after.

      - name: batch_creation_guarded_by_the_assignment_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.CirculationAssignment.TERMINATED
          - validations[priority 12]
          - errors[ERR_NO_ACTIVE_ASSIGNMENT]
        excluded_because:
          difficulty_instance: batch_creation_blocked_by_terminated_assignment
          rationale: |
            The guard on the other side of the same edge - a batch may be filed only while
            some covering assignment is ACTIVE - is asserted in §1.8 before and after
            terminate.

  # =========================================================================
  # Table 3 - Calculations (11 calculations; 6 algorithm families)
  # =========================================================================
  - section: calculations
    instances:

      - name: required_threshold_and_deadline_frozen_at_clearance
        claim_type: correct_result
        grounds:
          - calculations.required_valid_signature_threshold
          - entities.Petition.required_valid_signatures
          - entities.Petition.circulation_deadline
          - state_machines.Petition.TITLE_PENDING_to_CLEARED
        distinguishing_aspect: |
          A deliberately non-round fixture - 12345 gubernatorial votes at 375 bps - lands on
          462.9375, so ceil (463) is distinguishable from floor (462), round-half-up (463 by
          accident) and truncation. The same call pins the 180-day deadline arithmetic
          across a month and a year boundary (2026-08-01 -> 2027-01-28, which is 2027-01-29
          only if the window is counted inclusively). Both values are snapshots: mutating
          the standard afterwards is impossible (no update endpoint), and the petition's
          stored copy is what every later gate reads.
        test_recipe:
          setup:
            - "Standard SOS-N: gubernatorial_vote_total 12345, signature_pct_bps 375, circulation_window_days 180."
            - "One petition, walked DRAFT -> FORMAT_REVIEW -> TITLE_PENDING -> CLEARED with the clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /verification-standards"
              payload: { jurisdiction_code: "SOS-N", gubernatorial_vote_total: 12345, signature_pct_bps: 375, sample_pct_bps: 5000, sample_min_count: 2, sufficiency_upper_bps: 12000, sufficiency_lower_bps: 6000, stratification_mode: "POOLED", county_distribution_pct_bps: 500, required_qualifying_counties: 1, verification_rate_millicents_per_signature: 4750, county_surcharge_bps: 250, circulation_window_days: 180 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { std_id: $.data.id }
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "Threshold Committee", submitted_title: "Threshold Measure", measure_subject_codes: ["TAX"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { pet_id: $.data.id, req_at_create: $.data.required_valid_signatures }
            - call: "POST /petitions/${pet_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
            - call: "POST /petitions/${pet_id}/format-decision"
              payload: { decision: "APPROVE" }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { pet_v: $.data.version }
            - call: "PUT /petitions/${pet_id}/title-summary"
              payload: { official_title: "The Threshold Act", official_summary: "Sets the threshold.", expected_petition_version: "${pet_v}" }
              as: TitleExaminer
              as_user_id: "title-1"
          trigger:
            - call: "POST /petitions/${pet_id}/clear-for-circulation"
              payload: {}
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { req: $.data.required_valid_signatures, cleared: $.data.cleared_at, deadline: $.data.circulation_deadline, st: $.data.status }
            - call: "GET /petitions/${pet_id}"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
              captures: { req_read: $.data.required_valid_signatures, deadline_read: $.data.circulation_deadline }
          assert:
            - "${req_at_create} == 0 - the threshold is not computed at create time"
            - "${req} == 463 == ceil(12345 * 375 / 10000) == ceil(462.9375); 462 (floor or truncation) fails"
            - "${cleared} == 2026-08-01T00:00:00.000Z and ${deadline} == 2027-01-28T00:00:00.000Z (opened_at + 180 days, exclusive counting) and ${st} == CLEARED"
            - "${req_read} == 463 and ${deadline_read} == 2027-01-28T00:00:00.000Z on a later read - both are frozen snapshots on the petition, not recomputed from the standard on each read"

      - name: duplicate_keeper_selection_is_order_independent
        claim_type: correct_result
        grounds:
          - calculations.duplicate_keeper_selection
          - calculations.sample_projection
          - entities.SignatureRecord.duplicate_of_signature_id
          - state_machines.SignatureRecord.PENDING_to_INVALID_DUPLICATE
        distinguishing_aspect: |
          Two lines in one batch claim the same voter, and the fixture makes line order and
          chronological order disagree on purpose: line 1 was signed 2026-08-05 and line 2
          on 2026-08-03. The examiner then validates line 1 FIRST. The keeper is the
          earliest signed_on - line 2 - so line 1 must come back INVALID_DUPLICATE with
          duplicate_of_signature_id pointing at line 2, and line 2 must still come back
          VALID afterwards. An implementation that treats "first validated wins" or "lowest
          line_number wins" or "lowest id wins" produces the exact mirror image and is
          caught by both asserts at once. The tally then shows the duplicate is excluded
          from the numerator but not from accepted_raw_total.
        test_recipe:
          setup:
            - "Standard SOS-D: gubernatorial_vote_total 100, signature_pct_bps 200 (required 2), sample_pct_bps 10000, sample_min_count 1, sufficiency_upper_bps 10000 (upper_gate 2), sufficiency_lower_bps 5000 (lower_gate 1), cure_eligibility_floor_bps 8000."
            - "County ALPHA, one ACTIVE voter VA1 with signature_on_file_hash H-VA1. Both lines carry the matching hash, so nothing but the duplicate rule can invalidate either."
            - "One batch, affidavit verified, signatures filed, RANDOM_SAMPLE round r1 selecting both lines (census)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /verification-standards"
              payload: { jurisdiction_code: "SOS-D", gubernatorial_vote_total: 100, signature_pct_bps: 200, sample_pct_bps: 10000, sample_min_count: 1, sufficiency_upper_bps: 10000, sufficiency_lower_bps: 5000, stratification_mode: "POOLED", county_distribution_pct_bps: 500, required_qualifying_counties: 1, verification_rate_millicents_per_signature: 4750, county_surcharge_bps: 250, cure_allowed: true, cure_eligibility_floor_bps: 8000 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { std_id: $.data.id }
            - call: "POST /counties"
              payload: { county_code: "ALPHA", name: "Alpha County", registered_voter_count: 20 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { alpha_id: $.data.id }
            - call: "POST /voter-records"
              payload: { county_id: "${alpha_id}", voter_id_number: "VA1", full_name: "Ada Adams", signature_on_file_hash: "H-VA1", registration_date: "2020-01-01T00:00:00Z", registration_status: "ACTIVE" }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { vr1_id: $.data.id }
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "Duplicate Committee", submitted_title: "Duplicate Measure", measure_subject_codes: ["TAX"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { pet_id: $.data.id }
            - call: "POST /petitions/${pet_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
            - call: "POST /petitions/${pet_id}/format-decision"
              payload: { decision: "APPROVE" }
              as: ElectionsExaminer
