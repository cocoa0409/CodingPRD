            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /drone-ops/pilots/${pid}"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { pv: $.data.version }
            - call: "POST /drone-ops/waivers"
              payload: { pilot_id: "${pid}", aircraft_id: "${acid}", waiver_type: "OVER_PEOPLE", requested_ceiling_ft: 700, operation_description: "Overhead coverage of a ticketed outdoor event with a tethered corridor.", expected_pilot_version: "${pv}" }
              as: Pilot
