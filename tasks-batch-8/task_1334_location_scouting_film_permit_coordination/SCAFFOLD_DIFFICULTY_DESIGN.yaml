              as: LocationManager
              captures: { owner_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Loc A", address: "100 Main St", jurisdiction_id: "${jur_id}", owner_id: "${owner_id}", deposit_floor_cents: 200000, buffer_days: 2, max_shoot_hours_per_day: 14 }
              as: LocationManager
              captures: { loc_id: $.data.id }
            - call: "POST /productions"
              payload: { title: "Prod A", production_company: "Co A", cast_size: 60, umbrella_liability_limit_cents: 100000000 }
              as: LocationManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/scout-packages"
              payload: { location_id: "${loc_id}", photo_count: 6, coverage_score_pct: 80, scout_date: "2026-08-01" }
              as: LocationManager
              captures: { sp_id: $.data.id }
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/submit"
              payload: {}
              as: LocationManager
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/review"
              payload: { decision: "ACCEPT" }
              as: FilmOffice
            - call: "POST /productions/${prod_id}/owner-agreements"
              payload: { location_id: "${loc_id}", shoot_start_date: "2026-08-10", shoot_end_date: "2026-08-12" }
              as: LocationManager
              captures: { agr_id: $.data.id }
            - call: "POST /productions/${prod_id}/owner-agreements/${agr_id}/propose"
              payload: { proposed_day_rate_cents: 150000 }
              as: LocationManager
            - call: "POST /productions/${prod_id}/owner-agreements/${agr_id}/accept"
              payload: {}
              as: OwnerRep
              as_user_id: "${owner_id}"
            - call: "POST /productions/${prod_id}/permit-applications"
              payload: { location_id: "${loc_id}", shoot_start_date: "2026-08-10", shoot_end_date: "2026-08-12", closed_lanes: 2, shoot_hours_per_day: 12, expected_production_version: "${prod_v}" }
              as: LocationManager
              captures: { pa_id: $.data.id }
            - call: "POST /productions/${prod_id}/permit-applications/${pa_id}/submit"
              payload: {}
              as: LocationManager
            - call: "POST /productions/${prod_id}/permit-applications/${pa_id}/start-review"
              payload: {}
              as: FilmOffice
            - call: "POST /productions/${prod_id}/insurance-certificates"
              payload: { jurisdiction_id: "${jur_id}", insurer_name: "InsureCo", umbrella_limit_cents: 100000000, indemnity_clause_ref: "IND-1", effective_date: "2026-08-01", expiry_date: "2026-08-31" }
              as: LocationManager
              captures: { ic_id: $.data.id }
            - call: "POST /productions/${prod_id}/insurance-certificates/${ic_id}/verify"
              payload: {}
              as: FilmOffice
            - call: "POST /productions/${prod_id}/permit-applications/${pa_id}/decide"
              payload: { decision: "ISSUE" }
              as: FilmOffice
          trigger:
            - call: "POST /productions/${prod_id}/shoot-days"
              payload: { permit_application_id: "${pa_id}", location_id: "${loc_id}", shoot_date: "2026-08-10", planned_hours: 12 }
              as: LocationManager
              captures: { sd_id: $.data.id }
          assert:
            - "ShootDay.${sd_id}.monitors_required == 4 (ceil(12/8)=2, +1 lanes>=2, +1 cast 60>50)"
            - "ShootDay.${sd_id}.monitors_confirmed == 0"
            - "ShootDay.${sd_id}.status == PLANNED"

      - name: deposit_required_pinned_rounding_order_odd_rate
        grounds:
          - calculations.deposit_required
          - entities.DepositAccount.fields.required_amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — pinned order
          floor(rate * days * 50 / 100) yields 149998 for rate 99999 x 3 days,
          while the counterfactual floor(rate * 50 / 100) * days yields 149997;
          the scaffold pins the former and the floor also beats the location's
          100000-cent deposit floor, exercising max() at the same time.
        test_recipe:
          setup:
            - "J1; Location deposit_floor_cents 100000; agreement EXECUTED at agreed_day_rate_cents 99999 over a 3-day window 2026-08-10..2026-08-12"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "LA-CITY", name: "Los Angeles City", lead_time_business_days: 5, notification_lead_calendar_days: 3, notification_radius_ft: 500, base_fee_cents: 100000, per_day_fee_cents: 50000, per_lane_fee_cents: 20000, large_cast_threshold: 50, large_cast_multiplier_bps: 12500, min_liability_limit_cents: 100000000, police_monitor_lane_threshold: 2, holidays: [] }
              as: FilmOffice
              captures: { jur_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Owner One", contact_email: "owner1@x.com", default_day_rate_cents: 99999 }
              as: LocationManager
              captures: { owner_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Loc A", address: "100 Main St", jurisdiction_id: "${jur_id}", owner_id: "${owner_id}", deposit_floor_cents: 100000, buffer_days: 2, max_shoot_hours_per_day: 14 }
              as: LocationManager
              captures: { loc_id: $.data.id }
            - call: "POST /productions"
              payload: { title: "Prod A", production_company: "Co A", cast_size: 40, umbrella_liability_limit_cents: 100000000 }
              as: LocationManager
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/scout-packages"
              payload: { location_id: "${loc_id}", photo_count: 6, coverage_score_pct: 80, scout_date: "2026-08-01" }
              as: LocationManager
              captures: { sp_id: $.data.id }
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/submit"
              payload: {}
              as: LocationManager
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/review"
              payload: { decision: "ACCEPT" }
              as: FilmOffice
            - call: "POST /productions/${prod_id}/owner-agreements"
              payload: { location_id: "${loc_id}", shoot_start_date: "2026-08-10", shoot_end_date: "2026-08-12" }
              as: LocationManager
              captures: { agr_id: $.data.id }
            - call: "POST /productions/${prod_id}/owner-agreements/${agr_id}/propose"
              payload: { proposed_day_rate_cents: 99999 }
              as: LocationManager
            - call: "POST /productions/${prod_id}/owner-agreements/${agr_id}/accept"
              payload: {}
              as: OwnerRep
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /productions/${prod_id}/deposit-accounts"
              payload: { location_id: "${loc_id}" }
              as: LocationManager
              captures: { dep_id: $.data.id }
          assert:
            - "DepositAccount.${dep_id}.required_amount_cents == 149998 (pinned order floor(99999*3*50/100))"
            - "DepositAccount.${dep_id}.required_amount_cents != 149997 (counterfactual floor(99999*50/100)*3)"
            - "DepositAccount.${dep_id}.status == OPEN"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine: two non-linear machines, different entities.
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: owner_agreement_cyclic_counter_loop_round_accounting
        grounds:
          - state_machines.OwnerAgreement.PROPOSED_to_COUNTERED
          - state_machines.OwnerAgreement.COUNTERED_to_PROPOSED
          - state_machines.OwnerAgreement.COUNTERED_to_EXECUTED
        distinguishing_aspect: |
          OwnerAgreement is cyclic: DRAFT->PROPOSED->COUNTERED->PROPOSED->...
          with round_count incrementing ONLY on the LocationManager's propose
          hops. A 3-cycle loop then EXECUTED from COUNTERED must lock the
          owner's counter rate (not any earlier manager proposal).
        test_recipe:
          setup:
            - "J1, owner, location, production, ACCEPTED scout package; agreement with max_rounds 5"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "LA-CITY", name: "Los Angeles City", lead_time_business_days: 5, notification_lead_calendar_days: 3, notification_radius_ft: 500, base_fee_cents: 100000, per_day_fee_cents: 50000, per_lane_fee_cents: 20000, large_cast_threshold: 50, large_cast_multiplier_bps: 12500, min_liability_limit_cents: 100000000, police_monitor_lane_threshold: 2, holidays: [] }
              as: FilmOffice
              captures: { jur_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Owner One", contact_email: "owner1@x.com", default_day_rate_cents: 150000 }
              as: LocationManager
              captures: { owner_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Loc A", address: "100 Main St", jurisdiction_id: "${jur_id}", owner_id: "${owner_id}", deposit_floor_cents: 200000, buffer_days: 2, max_shoot_hours_per_day: 14 }
              as: LocationManager
              captures: { loc_id: $.data.id }
            - call: "POST /productions"
              payload: { title: "Prod A", production_company: "Co A", cast_size: 40, umbrella_liability_limit_cents: 100000000 }
              as: LocationManager
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/scout-packages"
              payload: { location_id: "${loc_id}", photo_count: 6, coverage_score_pct: 80, scout_date: "2026-08-01" }
              as: LocationManager
              captures: { sp_id: $.data.id }
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/submit"
              payload: {}
              as: LocationManager
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/review"
              payload: { decision: "ACCEPT" }
