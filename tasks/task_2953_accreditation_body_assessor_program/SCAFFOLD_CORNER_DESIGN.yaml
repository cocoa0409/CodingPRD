          Uniqueness is scoped to (organization, scheme) over non-terminal cycle statuses, so a
          second INITIAL cycle for the same pair must return ERR_DUPLICATE_ACTIVE_APPLICATION (409)
          while the same organization may still open a cycle on a DIFFERENT published scheme.
        test_recipe:
          setup:
            - "Clock 2026-08-10; two PUBLISHED schemes; one organization holding one SUBMITTED INITIAL cycle on the first scheme."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
