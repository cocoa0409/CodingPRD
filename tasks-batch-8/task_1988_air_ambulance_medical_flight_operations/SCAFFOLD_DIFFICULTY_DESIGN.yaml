      - name: qa_flag_cascade_remediation_release
        grounds:
          - state_machines.PatientCareReport.SUBMITTED_to_QA_FLAGGED
          - calculations.qa_deficiency_cascade
          - state_machines.CrewMember.ACTIVE_to_REMEDIATION_HOLD
