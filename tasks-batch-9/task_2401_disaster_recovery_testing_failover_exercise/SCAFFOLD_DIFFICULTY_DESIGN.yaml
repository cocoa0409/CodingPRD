  # =====================================================================
  # RULE 7 — cross-entity state dependencies over three different pairs
  #   7a: Exercise        <- RecoveryGroup.posture
  #   7b: EvidencePackage <- Exercise.execution_state
  #   7c: RunbookStep     <- Application.tier_agreement_status
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: impact_submission_depends_on_recovery_group_posture_ready
        grounds:
          - validations.priority_23
          - state_machines.Exercise.SCOPED_to_PENDING_IMPACT_APPROVAL
          - state_machines.RecoveryGroup.READY_to_RESTRICTED
          - errors.ERR_GROUP_NOT_READY
        distinguishing_aspect: |
          Entity pair Exercise <- RecoveryGroup: the Exercise transition SCOPED ->
          PENDING_IMPACT_APPROVAL is gated on a state field of a DIFFERENT entity (RecoveryGroup.posture)
          that the Exercise never writes. Nothing about the exercise changes between the accepted and
          the rejected call — only the group's posture moves, out of band, via a stakeholder suspension.
        test_recipe:
          setup:
            - "The standard RG-1 fixture exists at clock 2026-08-01T00:00:00Z with rb1 VALIDATED, readiness 100.00 and posture READY."
            - "Exercise exP (COMPONENT_FAILOVER at SITE-R, window 2026-08-20T00:00:00Z - 06:00:00Z) is scoped on RG-1."
            - "Exercise exN (COMPONENT_FAILOVER at SITE-R, window 2026-09-20T00:00:00Z - 06:00:00Z) is also scoped on RG-1 and is in every respect identical in its own state."
          setup_api_calls:
            - *b01
            - *b02
            - *b03
            - *b04
            - *b05
            - *b06
            - *b07
            - *b08
            - *b09
            - *b10
            - *b11
            - *b12
            - *b13
            - *b14
            - *b15
            - *b16
            - *b17
            - *b18
