# =============================================================================
# Pediatric Speech & Occupational Therapy Clinic — Scaffold (§1.0–§1.7)
# Difficulty band: Expert
# =============================================================================

scenario: |
  Pediatric Speech & Occupational Therapy Clinic: evaluation & plan of care,
  insurance authorization & visit caps, early-intervention (IFSP) vs school
  (IEP) coordination, therapist-child scheduling & caseload, session notes &
  goal progress, parent training & home program, waitlist & cancellation,
  reauthorization

domain_name: pediatric-speech-ot
api_prefix: /clinic

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - optimistic_concurrency        # OCC on Authorization.version for visit-reservation races
    - cascading_side_effects        # cancel appt -> release visits -> promote waitlist -> book held slot
    - dual_variant_calculation      # visit-cap balance (reserved-vs-committed) AND goal progress (forward vs chronological)
    - rate_threshold_triggers       # cap exhaustion at boundary; reauth window; caseload cap

  entity_topology: hybrid
  # Child is the central subject; Authorization, PlanOfCare, Appointment, Therapist,
  # CoordinationPlan, WaitlistEntry are peers linked by foreign keys. Some nesting in URLs
  # (goals under plan-of-care, session-notes under appointment) plus flat filtered lists.

  state_machine_shape: cyclic
  # Authorization carries a reauthorization CYCLE (ACTIVE -> REAUTH_REQUESTED -> ACTIVE).
  # Appointment is BRANCHING with divergent side-effects per terminal branch
  # (COMPLETED commits a reserved visit; CANCELLED/NO_SHOW release or forfeit it).
  # PlanOfCare has a revert loop (ACTIVE -> ON_HOLD -> ACTIVE).

  relationship_patterns:
    - one_to_many        # Child -> Appointments, PlanOfCare -> Goals
    - cross_aggregate    # Appointment references both Therapist and Authorization across aggregates
    - self_referential   # WaitlistEntry orders by deterministic priority + created_at (no id tie-break)

  role_model: peer_roles
  # Evaluator owns evaluations & plan-of-care authoring; Therapist owns sessions, notes,
  # home-program assignments; ClinicAdmin owns authorizations, scheduling, waitlist, clock.
  # SchedulingCoordinator shares scheduling with ClinicAdmin. Read access shared via Any.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Child
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Child's full name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD; drives age-based program eligibility" }
      - { name: age_months_at_intake, type: integer, source: computed, description: "Whole months between date_of_birth and created_at; used to classify EI vs school eligibility" }
      - { name: coordination_program, type: enum, source: computed, default: "NONE", description: "NONE | EARLY_INTERVENTION | SCHOOL — derived from the single active CoordinationPlan; NONE when none active", constraints: "enum: NONE, EARLY_INTERVENTION, SCHOOL" }
      - { name: active_appointment_count, type: integer, source: computed, default: 0, description: "Count of this child's Appointments in SCHEDULED status; used for double-booking checks" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | DISCHARGED", constraints: "enum: ACTIVE, DISCHARGED" }

  - name: Therapist
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Therapist name" }
      - { name: discipline, type: enum, source: input, description: "SLP (speech-language) or OT (occupational); a therapist serves exactly one discipline", constraints: "enum: SLP, OT" }
      - { name: max_caseload, type: integer, source: input, description: "Maximum number of Children with an ACTIVE PlanOfCare assigned to this therapist", constraints: "integer >= 1" }
      - { name: weekly_visit_minutes_cap, type: integer, source: input, description: "Maximum total scheduled-appointment minutes per ISO week (Mon 00:00Z–next Mon 00:00Z)", constraints: "integer >= 0" }
      - { name: current_caseload, type: integer, source: computed, default: 0, description: "Count of distinct Children whose ACTIVE PlanOfCare names this therapist as primary_therapist_id" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | INACTIVE", constraints: "enum: ACTIVE, INACTIVE" }

  - name: Evaluation
    parent: null
    common_fields: true
    fields:
      - { name: child_id, type: string, source: input, description: "FK -> Child.id; the evaluated child" }
      - { name: evaluator_id, type: string, source: system, description: "FK -> Therapist.id; X-User-ID of the Evaluator who created it" }
      - { name: discipline, type: enum, source: input, description: "SLP or OT — the evaluation's discipline", constraints: "enum: SLP, OT" }
      - { name: severity_score, type: integer, source: input, description: "Standardized deficit score 0–100; higher = greater need; drives waitlist priority and recommended_weekly_minutes", constraints: "integer 0..100" }
      - { name: recommended_weekly_minutes, type: integer, source: computed, description: "Computed from severity_score per recommended_weekly_minutes calculation" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | FINALIZED | SUPERSEDED", constraints: "enum: DRAFT, FINALIZED, SUPERSEDED" }

  - name: PlanOfCare
    parent: null
    common_fields: true
    fields:
      - { name: child_id, type: string, source: input, description: "FK -> Child.id" }
      - { name: evaluation_id, type: string, source: input, description: "FK -> Evaluation.id; the FINALIZED evaluation this plan is built from" }
      - { name: primary_therapist_id, type: string, source: input, description: "FK -> Therapist.id; the assigned treating therapist (discipline must match evaluation)" }
      - { name: discipline, type: enum, source: computed, description: "Copied from the source evaluation at creation", constraints: "enum: SLP, OT" }
      - { name: planned_weekly_minutes, type: integer, source: input, description: "Authorized treatment minutes per week per plan of care", constraints: "integer >= 0" }
      - { name: goal_count, type: integer, source: computed, default: 0, description: "Number of Goals attached to this plan" }
      - { name: overall_progress_pct, type: number, source: computed, default: 0, description: "Weighted goal-progress percentage per goal_progress calculation (forward-looking variant)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | ON_HOLD | DISCHARGED", constraints: "enum: DRAFT, ACTIVE, ON_HOLD, DISCHARGED" }

  - name: Goal
    parent: PlanOfCare
    common_fields: true
    fields:
      - { name: plan_of_care_id, type: string, source: system, description: "FK -> PlanOfCare.id" }
      - { name: description, type: string, source: input, description: "Goal text" }
      - { name: weight, type: integer, source: input, description: "Relative weight in overall progress; positive integer", constraints: "integer >= 1" }
      - { name: baseline_pct, type: integer, source: input, description: "Starting attainment percentage 0–100", constraints: "integer 0..100" }
      - { name: target_pct, type: integer, source: input, description: "Target attainment percentage; must exceed baseline_pct", constraints: "integer 0..100" }
      - { name: latest_progress_pct, type: integer, source: computed, default: 0, description: "Latest recorded attainment from the most recent GoalProgressEntry (chronological by recorded_session_time); equals baseline_pct when no entries", constraints: "integer 0..100" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | MET | DISCONTINUED", constraints: "enum: OPEN, MET, DISCONTINUED" }

  - name: Authorization
    parent: null
    common_fields: true
    fields:
      - { name: child_id, type: string, source: input, description: "FK -> Child.id" }
      - { name: discipline, type: enum, source: input, description: "SLP or OT — visits drawn only by matching-discipline appointments", constraints: "enum: SLP, OT" }
      - { name: payer_name, type: string, source: input, description: "Insurance payer name" }
      - { name: authorized_visits, type: integer, source: input, description: "Total visit cap granted by the payer for this authorization period", constraints: "integer >= 1" }
      - { name: valid_from, type: string, source: input, description: "ISO datetime; appointments before this instant cannot draw from this authorization" }
      - { name: valid_until, type: string, source: input, description: "ISO datetime; the authorization period end (exclusive); appointments at/after this instant cannot draw" }
      - { name: reserved_visits, type: integer, source: computed, default: 0, description: "Count of SCHEDULED appointments drawing on this authorization (held but not yet delivered)" }
      - { name: committed_visits, type: integer, source: computed, default: 0, description: "Count of COMPLETED appointments that drew on this authorization (delivered)" }
      - { name: available_visits, type: integer, source: computed, description: "authorized_visits - reserved_visits - committed_visits per visit_balance calculation" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | REAUTH_REQUESTED | EXHAUSTED | EXPIRED | CLOSED", constraints: "enum: ACTIVE, REAUTH_REQUESTED, EXHAUSTED, EXPIRED, CLOSED" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: child_id, type: string, source: input, description: "FK -> Child.id" }
      - { name: therapist_id, type: string, source: input, description: "FK -> Therapist.id; discipline must match the authorization" }
      - { name: authorization_id, type: string, source: input, description: "FK -> Authorization.id; the visit cap this appointment draws from" }
      - { name: plan_of_care_id, type: string, source: input, description: "FK -> PlanOfCare.id; must be ACTIVE and belong to the same child" }
      - { name: start_time, type: string, source: input, description: "ISO datetime; appointment start (inclusive)" }
      - { name: end_time, type: string, source: input, description: "ISO datetime; appointment end (exclusive); must be after start_time" }
      - { name: duration_minutes, type: integer, source: computed, description: "Whole minutes between start_time and end_time" }
      - { name: from_waitlist_entry_id, type: string, source: system, default: null, description: "FK -> WaitlistEntry.id; set when this appointment was booked via waitlist promotion, else null" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | COMPLETED | CANCELLED | NO_SHOW", constraints: "enum: SCHEDULED, COMPLETED, CANCELLED, NO_SHOW" }

  - name: SessionNote
    parent: Appointment
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: system, description: "FK -> Appointment.id; one note per completed appointment" }
      - { name: narrative, type: string, source: input, description: "Clinical narrative; min 10 characters" }
      - { name: minutes_delivered, type: integer, source: input, description: "Actual treatment minutes delivered this session", constraints: "integer >= 1" }
      - { name: goal_progress_entries, type: array, source: input, description: "Array of {goal_id, recorded_pct} objects; each recorded_pct 0–100; each goal must belong to the appointment's plan_of_care" }

  - name: GoalProgressEntry
    parent: Goal
    common_fields: false   # append-only event log: carries id + created_at only
    fields:
      - { name: goal_id, type: string, source: system, description: "FK -> Goal.id" }
      - { name: session_note_id, type: string, source: system, description: "Id of the SessionNote that produced this entry (link only; entries are discovered via the goal, not the note)" }
      - { name: recorded_pct, type: integer, source: input, description: "Attainment percentage recorded this session 0–100", constraints: "integer 0..100" }
      - { name: recorded_session_time, type: string, source: system, description: "Copied from the parent appointment's start_time; the chronological key for latest_progress_pct" }

  - name: CoordinationPlan
    parent: null
    common_fields: true
    fields:
      - { name: child_id, type: string, source: input, description: "FK -> Child.id" }
      - { name: plan_type, type: enum, source: input, description: "IFSP (early-intervention) or IEP (school)", constraints: "enum: IFSP, IEP" }
      - { name: jurisdiction, type: string, source: input, description: "Lead agency (IFSP) or school district (IEP) name" }
      - { name: review_due_time, type: string, source: input, description: "ISO datetime when the coordination plan is next due for review" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | TRANSITIONING | CLOSED", constraints: "enum: DRAFT, ACTIVE, TRANSITIONING, CLOSED" }

  - name: HomeProgram
    parent: PlanOfCare
    common_fields: true
    fields:
      - { name: plan_of_care_id, type: string, source: system, description: "FK -> PlanOfCare.id" }
      - { name: assigned_by_therapist_id, type: string, source: system, description: "FK -> Therapist.id; X-User-ID of the Therapist who assigned it" }
      - { name: title, type: string, source: input, description: "Home program / parent-training activity title" }
      - { name: weekly_target_sessions, type: integer, source: input, description: "Target parent-led home sessions per week", constraints: "integer >= 1" }
      - { name: parent_training_completed, type: boolean, source: input, default: false, description: "Whether the parent has completed the orientation/training for this program" }
      - { name: status, type: enum, source: system, default: "ASSIGNED", description: "ASSIGNED | ACTIVE | COMPLETED | CANCELLED", constraints: "enum: ASSIGNED, ACTIVE, COMPLETED, CANCELLED" }

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: child_id, type: string, source: input, description: "FK -> Child.id" }
      - { name: therapist_id, type: string, source: input, description: "FK -> Therapist.id; the therapist whose slots are awaited" }
      - { name: discipline, type: enum, source: input, description: "SLP or OT; must match therapist discipline", constraints: "enum: SLP, OT" }
      - { name: evaluation_id, type: string, source: input, description: "FK -> Evaluation.id; the FINALIZED evaluation supplying severity_score for priority" }
      - { name: priority_score, type: integer, source: computed, description: "Copied from evaluation.severity_score at creation; the ranking key (higher promotes first)" }
      - { name: requested_minutes, type: integer, source: input, description: "Desired session length in minutes", constraints: "integer >= 1" }
      - { name: status, type: enum, source: system, default: "WAITING", description: "WAITING | OFFERED | PLACED | EXPIRED | WITHDRAWN", constraints: "enum: WAITING, OFFERED, PLACED, EXPIRED, WITHDRAWN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Evaluation
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /clinic/evaluations/{evaluationId}/finalize"
        actor: Evaluator
        preconditions:
          - "Evaluation in DRAFT (else ERR_EVALUATION_NOT_DRAFT)"
          - "Child is ACTIVE (else ERR_CHILD_DISCHARGED)"
        side_effects:
          - "recommended_weekly_minutes computed per recommended_weekly_minutes calc"
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system: a newer Evaluation for the same child_id + discipline is FINALIZED"
        actor: system
        preconditions:
          - "A newer FINALIZED Evaluation exists for the same child_id and discipline"
        side_effects:
          - "This evaluation becomes ineligible to source a new PlanOfCare"

  - entity: PlanOfCare
    initial_state: DRAFT
    terminal_states: [DISCHARGED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /clinic/plans-of-care/{planId}/activate"
        actor: Evaluator
        preconditions:
          - "Plan in DRAFT (else ERR_PLAN_NOT_DRAFT)"
          - "Source Evaluation is FINALIZED (else ERR_EVALUATION_NOT_FINALIZED)"
          - "primary_therapist_id Therapist is ACTIVE and discipline matches plan (else ERR_THERAPIST_DISCIPLINE_MISMATCH)"
          - "Therapist current_caseload < max_caseload (else ERR_CASELOAD_EXCEEDED)"
        side_effects:
          - "Therapist.current_caseload += 1 (child counted toward primary_therapist caseload)"
          - "Child gains an active PlanOfCare for the discipline"
      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /clinic/plans-of-care/{planId}/hold"
        actor: Therapist
        preconditions:
          - "Plan in ACTIVE (else ERR_PLAN_NOT_ACTIVE)"
        side_effects:
          - "Therapist.current_caseload -= 1 (slot freed while on hold)"
          - "All this plan's SCHEDULED future Appointments are CANCELLED (cascade): each cancellation releases its reserved authorization visit (Authorization.reserved_visits -= 1) and triggers waitlist promotion on the freed therapist slot"
      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /clinic/plans-of-care/{planId}/activate"
        actor: Evaluator
        preconditions:
          - "Plan in ON_HOLD (else ERR_PLAN_NOT_HELD)"
          - "Therapist current_caseload < max_caseload (else ERR_CASELOAD_EXCEEDED)"
        side_effects:
          - "Therapist.current_caseload += 1"
        note: "Revert loop: ACTIVE -> ON_HOLD -> ACTIVE; re-checks caseload on the way back in."
      - from: ACTIVE
        to: DISCHARGED
        trigger: "POST /clinic/plans-of-care/{planId}/discharge"
        actor: Evaluator
        preconditions:
          - "Plan in ACTIVE or ON_HOLD (else ERR_PLAN_NOT_DISCHARGEABLE)"
        side_effects:
          - "If plan was ACTIVE: Therapist.current_caseload -= 1"
          - "All this plan's SCHEDULED Appointments are CANCELLED (cascade): each releases its reserved authorization visit and fires waitlist promotion"
          - "All ASSIGNED/ACTIVE HomePrograms under this plan are CANCELLED"
      - from: ON_HOLD
        to: DISCHARGED
        trigger: "POST /clinic/plans-of-care/{planId}/discharge"
        actor: Evaluator
        preconditions:
          - "Plan in ACTIVE or ON_HOLD (else ERR_PLAN_NOT_DISCHARGEABLE)"
        side_effects:
          - "Caseload already freed at hold; no further caseload change"
          - "All ASSIGNED/ACTIVE HomePrograms under this plan are CANCELLED"

  - entity: Goal
    initial_state: OPEN
    terminal_states: [MET, DISCONTINUED]
    transitions:
      - from: OPEN
        to: MET
        trigger: "system: on appointment completion, the goal's latest_progress_pct reaches >= target_pct"
        actor: system
        preconditions:
          - "Goal is OPEN and a GoalProgressEntry just set latest_progress_pct >= target_pct"
        side_effects:
          - "Goal stays in PlanOfCare.overall_progress_pct numerator/denominator at full weight (gain_ratio == 1)"
      - from: MET
        to: OPEN
        trigger: "system: a later-dated GoalProgressEntry sets latest_progress_pct < target_pct"
        actor: system
        preconditions:
          - "Goal is MET and the new chronological latest_progress_pct drops below target_pct"
        side_effects:
          - "PlanOfCare.overall_progress_pct recomputed"
        note: "Revert: a regression recorded for a later session re-opens a previously MET goal."
      - from: OPEN
        to: DISCONTINUED
        trigger: "POST /clinic/goals/{goalId}/discontinue"
        actor: Therapist | Evaluator
        preconditions:
          - "Goal is OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "Goal removed from PlanOfCare.overall_progress_pct numerator and denominator; overall_progress_pct recomputed"

  - entity: Authorization
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: available_visits reaches 0 after an appointment reserves the last visit"
        actor: system
        preconditions:
          - "available_visits == 0 after a reservation (reserved + committed == authorized_visits)"
        side_effects:
          - "New reservations against this authorization are rejected with ERR_VISIT_CAP_EXCEEDED while EXHAUSTED"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system: available_visits rises above 0 after a release (cancellation or no-show)"
        actor: system
        preconditions:
          - "available_visits > 0 after a release"
        side_effects:
          - "Authorization can be reserved against again"
      - from: ACTIVE
        to: REAUTH_REQUESTED
        trigger: "POST /clinic/authorizations/{authorizationId}/request-reauth"
        actor: ClinicAdmin
        preconditions:
          - "Authorization in ACTIVE or EXHAUSTED (else ERR_AUTH_NOT_REAUTHABLE)"
          - "expected_authorization_version matches current version (else ERR_STALE_VERSION)"
        side_effects:
          - "Existing reservations and commitments are preserved; new reservations still allowed if available_visits > 0"
      - from: EXHAUSTED
        to: REAUTH_REQUESTED
        trigger: "POST /clinic/authorizations/{authorizationId}/request-reauth"
        actor: ClinicAdmin
        preconditions:
          - "Authorization in ACTIVE or EXHAUSTED (else ERR_AUTH_NOT_REAUTHABLE)"
          - "expected_authorization_version matches current version (else ERR_STALE_VERSION)"
        side_effects: []
      - from: REAUTH_REQUESTED
        to: ACTIVE
        trigger: "POST /clinic/authorizations/{authorizationId}/grant-reauth"
        actor: ClinicAdmin
        preconditions:
          - "Authorization in REAUTH_REQUESTED (else ERR_AUTH_NOT_IN_REAUTH)"
          - "additional_visits >= 1 (else ERR_INVALID_REQUEST)"
          - "expected_authorization_version matches current version (else ERR_STALE_VERSION)"
        side_effects:
          - "authorized_visits += additional_visits (cap replenished)"
          - "valid_until extended to new_valid_until from payload"
          - "available_visits recomputed; if > 0, status returns to ACTIVE (cycle closes)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock reaches valid_until"
        actor: system
        preconditions:
          - "current_utc >= valid_until"
        side_effects:
          - "No new reservations may draw on this authorization"
      - from: EXPIRED
        to: CLOSED
        trigger: "POST /clinic/authorizations/{authorizationId}/close"
        actor: ClinicAdmin
        preconditions:
          - "Authorization in EXPIRED or EXHAUSTED (else ERR_AUTH_NOT_CLOSEABLE)"
          - "reserved_visits == 0 (no outstanding SCHEDULED appointments) (else ERR_OUTSTANDING_RESERVATIONS)"
        side_effects: []
      - from: EXHAUSTED
        to: CLOSED
        trigger: "POST /clinic/authorizations/{authorizationId}/close"
        actor: ClinicAdmin
        preconditions:
          - "Authorization in EXPIRED or EXHAUSTED (else ERR_AUTH_NOT_CLOSEABLE)"
          - "reserved_visits == 0 (else ERR_OUTSTANDING_RESERVATIONS)"
        side_effects: []

  - entity: Appointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /clinic/appointments/{appointmentId}/complete (creates the SessionNote)"
        actor: Therapist
        preconditions:
          - "Appointment in SCHEDULED (else ERR_APPOINTMENT_NOT_SCHEDULED)"
          - "current_utc >= start_time (cannot complete a future appointment) (else ERR_APPOINTMENT_IN_FUTURE)"
          - "narrative length >= 10 and minutes_delivered >= 1 (else ERR_INVALID_REQUEST)"
          - "Every goal_progress_entries[].goal_id belongs to the appointment's plan_of_care (else ERR_GOAL_PLAN_MISMATCH)"
        side_effects:
          - "Authorization.reserved_visits -= 1 and Authorization.committed_visits += 1 (reservation converts to commitment; available_visits unchanged by this single move)"
          - "SessionNote created; one GoalProgressEntry appended per goal_progress_entries item with recorded_session_time = appointment.start_time"
          - "Each affected Goal.latest_progress_pct recomputed (chronological); PlanOfCare.overall_progress_pct recomputed (forward-looking)"
          - "Goal auto-transitions to MET when latest_progress_pct >= target_pct"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /clinic/appointments/{appointmentId}/cancel"
        actor: ClinicAdmin
        preconditions:
          - "Appointment in SCHEDULED (else ERR_APPOINTMENT_NOT_SCHEDULED)"
        side_effects:
          - "Authorization.reserved_visits -= 1 (visit released back to the pool; available_visits rises); if authorization was EXHAUSTED it returns to ACTIVE"
          - "Therapist time slot freed -> waitlist promotion runs for that therapist (see waitlist_promotion calc): highest-priority eligible WaitlistEntry is OFFERED"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /clinic/appointments/{appointmentId}/no-show"
        actor: ClinicAdmin
        preconditions:
          - "Appointment in SCHEDULED (else ERR_APPOINTMENT_NOT_SCHEDULED)"
          - "current_utc >= start_time (a no-show is recorded only at/after the slot) (else ERR_APPOINTMENT_IN_FUTURE)"
        side_effects:
          - "Authorization.reserved_visits -= 1 (visit released, NOT committed — payer is not billed for a no-show); available_visits rises"
          - "Therapist slot is NOT offered to waitlist (slot already elapsed); no promotion"

  - entity: CoordinationPlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /clinic/coordination-plans/{coordinationPlanId}/activate"
        actor: ClinicAdmin
        preconditions:
          - "Plan in DRAFT (else ERR_COORDINATION_NOT_DRAFT)"
          - "Child has NO other ACTIVE or TRANSITIONING CoordinationPlan (else ERR_COORDINATION_CONFLICT)"
          - "If plan_type == IFSP: child age_months_at_intake < 36 (else ERR_IFSP_AGE_INELIGIBLE)"
        side_effects:
          - "Child.coordination_program set to EARLY_INTERVENTION (IFSP) or SCHOOL (IEP)"
      - from: ACTIVE
        to: TRANSITIONING
        trigger: "POST /clinic/coordination-plans/{coordinationPlanId}/begin-transition"
        actor: ClinicAdmin
        preconditions:
          - "Plan in ACTIVE (else ERR_COORDINATION_NOT_ACTIVE)"
          - "plan_type == IFSP (only EI plans transition to school) (else ERR_TRANSITION_NOT_APPLICABLE)"
        side_effects:
          - "Plan marked TRANSITIONING; Child.coordination_program remains EARLY_INTERVENTION until a new IEP plan is activated"
      - from: TRANSITIONING
        to: CLOSED
        trigger: "POST /clinic/coordination-plans/{coordinationPlanId}/close"
        actor: ClinicAdmin
        preconditions:
          - "Plan in ACTIVE or TRANSITIONING (else ERR_COORDINATION_NOT_CLOSEABLE)"
        side_effects:
          - "If no other ACTIVE/TRANSITIONING CoordinationPlan for the child: Child.coordination_program reset to NONE"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /clinic/coordination-plans/{coordinationPlanId}/close"
        actor: ClinicAdmin
        preconditions:
          - "Plan in ACTIVE or TRANSITIONING (else ERR_COORDINATION_NOT_CLOSEABLE)"
        side_effects:
          - "If no other ACTIVE/TRANSITIONING CoordinationPlan for the child: Child.coordination_program reset to NONE"

  - entity: HomeProgram
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: ACTIVE
        trigger: "POST /clinic/home-programs/{homeProgramId}/activate"
        actor: Therapist
        preconditions:
          - "HomeProgram in ASSIGNED (else ERR_HOME_PROGRAM_NOT_ASSIGNED)"
          - "parent_training_completed == true (parent must finish training before activation) (else ERR_PARENT_TRAINING_INCOMPLETE)"
          - "Parent PlanOfCare is ACTIVE (else ERR_PLAN_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /clinic/home-programs/{homeProgramId}/complete"
        actor: Therapist
        preconditions:
          - "HomeProgram in ACTIVE (else ERR_HOME_PROGRAM_NOT_ACTIVE)"
        side_effects: []
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /clinic/home-programs/{homeProgramId}/cancel OR cascade from PlanOfCare discharge"
        actor: Therapist
        preconditions:
          - "HomeProgram in ASSIGNED or ACTIVE (else ERR_HOME_PROGRAM_NOT_CANCELLABLE)"
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /clinic/home-programs/{homeProgramId}/cancel OR cascade from PlanOfCare discharge"
        actor: Therapist
        preconditions:
          - "HomeProgram in ASSIGNED or ACTIVE (else ERR_HOME_PROGRAM_NOT_CANCELLABLE)"
        side_effects: []

  - entity: WaitlistEntry
    initial_state: WAITING
    terminal_states: [PLACED, EXPIRED, WITHDRAWN]
    transitions:
      - from: WAITING
        to: OFFERED
        trigger: "system: waitlist promotion selects this entry when a therapist slot frees (appointment cancellation)"
        actor: system
        preconditions:
          - "Entry is the highest-priority eligible WAITING entry for the freed therapist (see waitlist_promotion calc)"
        side_effects:
          - "Entry marked OFFERED; offer_open while no other entry is promoted for the same freed slot"
      - from: OFFERED
        to: PLACED
        trigger: "POST /clinic/waitlist-entries/{waitlistEntryId}/accept (books an appointment in the freed slot)"
        actor: ClinicAdmin
        preconditions:
          - "Entry in OFFERED (else ERR_WAITLIST_NOT_OFFERED)"
          - "A non-EXPIRED ACTIVE Authorization with available_visits >= 1 exists for the child+discipline (else ERR_VISIT_CAP_EXCEEDED)"
        side_effects:
          - "A SCHEDULED Appointment is created in the freed slot with from_waitlist_entry_id set; that reservation draws a visit (Authorization.reserved_visits += 1)"
      - from: OFFERED
        to: WAITING
        trigger: "POST /clinic/waitlist-entries/{waitlistEntryId}/decline"
        actor: ClinicAdmin
        preconditions:
          - "Entry in OFFERED (else ERR_WAITLIST_NOT_OFFERED)"
        side_effects:
          - "Entry returns to WAITING; promotion re-runs and offers the next-highest-priority eligible entry"
        note: "Cyclic: WAITING -> OFFERED -> WAITING allows re-offer rounds."
      - from: WAITING
        to: WITHDRAWN
        trigger: "POST /clinic/waitlist-entries/{waitlistEntryId}/withdraw"
        actor: ClinicAdmin
        preconditions:
          - "Entry in WAITING or OFFERED (else ERR_WAITLIST_NOT_WITHDRAWABLE)"
        side_effects: []
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /clinic/waitlist-entries/{waitlistEntryId}/withdraw"
        actor: ClinicAdmin
        preconditions:
          - "Entry in WAITING or OFFERED (else ERR_WAITLIST_NOT_WITHDRAWABLE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reauth-grant-stale-authorization
    parent_entity: Authorization
    write_endpoint: "POST /clinic/authorizations/{authorizationId}/grant-reauth"
    occ_field: "expected_authorization_version"
    description: |
      Granting a reauthorization against an Authorization whose version has
      advanced since the client last observed it is rejected. The legitimate
      race this captures: another writer requested reauth and/or appointments
      reserved or released visits (each bumps Authorization.version), so the
      granting client's view of the cap is stale and the grant would replenish
      against an out-of-date baseline.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reauth-request-stale-authorization
    parent_entity: Authorization
    write_endpoint: "POST /clinic/authorizations/{authorizationId}/request-reauth"
    occ_field: "expected_authorization_version"
    description: |
      Requesting reauth against an Authorization whose version has advanced
      since last observed is rejected: a prior request-reauth (or an appointment
      reservation/release) already moved the authorization, so this caller's
      view is stale and the transition would be based on an out-of-date state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: visit_balance
    trigger: "appointment reservation (booking), completion, cancellation, no-show; reauth grant"
    algorithm: aggregation
    formula: |
      reserved_visits  = count(Appointment where authorization_id == auth.id AND status == SCHEDULED)
      committed_visits = count(Appointment where authorization_id == auth.id AND status == COMPLETED)
      available_visits = authorized_visits - reserved_visits - committed_visits
      # CANCELLED and NO_SHOW appointments draw NOTHING (released).
      # Booking is rejected when available_visits would drop below 0, i.e. a new
      # reservation requires available_visits >= 1 BEFORE the reservation.
    input_set: "All Appointments referencing this authorization_id, filtered to status IN {SCHEDULED, COMPLETED}; CANCELLED and NO_SHOW excluded."
    constants: {}
    precision: "integer counts; available_visits is exact integer"
    variants:
      - name: reserved_view
        when: "at booking time and while the appointment is SCHEDULED"
        difference: "The visit is counted in reserved_visits (held). available_visits already reflects the hold, so a never-completed-but-cancelled appointment leaves the cap untouched once released."
      - name: committed_view
        when: "after completion"
        difference: "The same visit moves from reserved_visits to committed_visits; available_visits is identical across the move (reserved -1, committed +1) — the divergence from reserved_view is which bucket holds it and whether a later cancel can release it (committed cannot be released, reserved can)."

  - name: goal_progress
    trigger: "appointment completion (SessionNote created with goal_progress_entries); goal discontinuation"
    algorithm: weighted_scoring
    formula: |
      # Per-goal attainment ratio, clamped to [0,1]:
      #   gain_ratio(goal) = clamp((latest_progress_pct - baseline_pct) /
      #                            (target_pct - baseline_pct), 0, 1)
      # PlanOfCare.overall_progress_pct = round(
      #     100 * (sum over OPEN+MET goals of weight*gain_ratio)
      #         / (sum over OPEN+MET goals of weight), 2)
      # DISCONTINUED goals are excluded from both sums.
      # latest_progress_pct (per Goal) = recorded_pct of the GoalProgressEntry with
      #   the maximum recorded_session_time; ties broken by GoalProgressEntry.created_at ASC
      #   (latest created wins). With no entries, latest_progress_pct = baseline_pct.
    input_set: "Goals of the plan with status IN {OPEN, MET}; their GoalProgressEntry rows filtered chronologically by recorded_session_time."
    constants:
      ROUND_DP: 2
    precision: "2 decimal places, round_half_up"
    variants:
      - name: forward_looking
        when: "PlanOfCare.overall_progress_pct (the plan-level roll-up)"
        difference: "Aggregates the CURRENT latest_progress_pct of every OPEN/MET goal — a projection of attainment given all progress recorded so far, regardless of recording order; re-deriving from scratch yields the same number."
      - name: chronological
        when: "Goal.latest_progress_pct (the per-goal field)"
        difference: "Selects the single most-recent entry strictly by recorded_session_time (the appointment start_time), NOT by insertion order — a back-dated session note for an earlier slot does NOT override a later session's recorded value even though it was inserted afterward."

  - name: recommended_weekly_minutes
    trigger: "evaluation finalization"
    algorithm: tiered_pricing
    formula: |
      # Tiered by severity_score; marginal style is NOT used — a single tier band
      # selects the whole recommendation:
      #   severity_score in [0, 29]   -> 30
      #   severity_score in [30, 59]  -> 60
      #   severity_score in [60, 79]  -> 90
      #   severity_score in [80, 100] -> 120
      recommended_weekly_minutes = tier_minutes(severity_score)
    input_set: "Single evaluation's severity_score."
    constants:
      TIER_BREAKS: [30, 60, 80]
      TIER_MINUTES: [30, 60, 90, 120]
    precision: "integer minutes"

  - name: weekly_minutes_load
    trigger: "appointment booking (reservation); waitlist accept"
    algorithm: aggregation
    formula: |
      # ISO week = [Monday 00:00:00Z, next Monday 00:00:00Z).
      # week_of(t) = the Monday-00:00Z at or before t.
      # scheduled_minutes(therapist, week) =
      #     sum(duration_minutes of Appointments where therapist_id == T
      #         AND status == SCHEDULED
      #         AND week_of(start_time) == week)
      # A new booking of duration D in week W is rejected when
      #     scheduled_minutes(T, W) + D > T.weekly_visit_minutes_cap
      #   (strictly greater-than; equality is allowed — booking that lands exactly
      #    on the cap succeeds).
    input_set: "Therapist's SCHEDULED Appointments whose start_time falls in the same ISO week as the candidate booking; COMPLETED/CANCELLED/NO_SHOW excluded."
    constants: {}
    precision: "integer minutes; boundary is '> cap' rejects, '== cap' allows"

  - name: waitlist_promotion
    trigger: "appointment cancellation frees a therapist slot; waitlist decline re-runs promotion"
    algorithm: weighted_scoring
    formula: |
      # Candidate set: WaitlistEntry where therapist_id == freed therapist
      #   AND status == WAITING
      #   AND discipline == freed appointment's therapist.discipline.
      # Eligibility filter (must ALL hold): the entry's Child is ACTIVE; the Child
      #   has at least one ACTIVE non-EXPIRED Authorization for the discipline with
      #   available_visits >= 1.
      # Ranking: ORDER BY priority_score DESC, then created_at ASC (earliest waiting
      #   first). No id tie-break — created_at is the final discriminator.
      # Select the single top-ranked candidate -> transition it WAITING -> OFFERED.
      # Empty candidate set: no promotion occurs (slot simply remains free); NOT an error.
    input_set: "WAITING WaitlistEntry rows for the freed therapist matching discipline and passing the eligibility filter."
    constants: {}
    precision: "exact integer priority_score comparison; created_at ASC tie-break"

  - name: reauth_replenish
    trigger: "authorization grant-reauth"
    algorithm: aggregation
    formula: |
      # Forward action grant-reauth(additional_visits, new_valid_until):
      #   authorized_visits' = authorized_visits + additional_visits
      #   valid_until'       = new_valid_until
      #   available_visits'  = authorized_visits' - reserved_visits - committed_visits
      # INVARIANT (visits_conservation): across a grant-reauth,
      #   authorized_visits' - available_visits' == reserved_visits + committed_visits
      #   (the count of held+delivered visits is conserved; only the free pool grows).
    input_set: "Single authorization; additional_visits from payload."
    constants: {}
    precision: "integer counts"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_AUTH
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path resource ids exist (validated left-to-right); FK ids in body exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is legal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints (generic fallback when no specific state error applies)"

  - priority: 5
    category: state
    check: "OCC: expected_authorization_version equals Authorization.version on reauth endpoints"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /clinic/authorizations/{authorizationId}/request-reauth, POST /clinic/authorizations/{authorizationId}/grant-reauth"
    note: "OCC checked before business rules but after existence/state-legality of the transition."

  - priority: 6
    category: business_referential
    check: "On appointment booking: therapist.discipline == authorization.discipline; plan_of_care.child_id == authorization.child_id == body child_id; plan_of_care is ACTIVE"
    error_id: ERR_THERAPIST_DISCIPLINE_MISMATCH
    http_status: 409
    applies_to: "POST /clinic/appointments"

  - priority: 7
    category: business_temporal
    check: "On appointment booking: authorization.valid_from <= start_time AND end_time <= authorization.valid_until AND authorization.status == ACTIVE"
    error_id: ERR_AUTH_WINDOW_VIOLATION
    http_status: 409
    applies_to: "POST /clinic/appointments, POST /clinic/waitlist-entries/{waitlistEntryId}/accept"

  - priority: 8
    category: business_temporal
    check: "On appointment booking: requested [start_time, end_time) does not overlap any SCHEDULED appointment for the SAME THERAPIST. Adjacency allowed (end == next start). Half-open intervals."
    error_id: ERR_THERAPIST_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /clinic/appointments, POST /clinic/waitlist-entries/{waitlistEntryId}/accept"

  - priority: 9
    category: business_temporal
    check: "On appointment booking: requested interval does not overlap any SCHEDULED appointment for the SAME CHILD, applying a CHILD_BUFFER_MINUTES = 15 gap so two of the child's sessions cannot be back-to-back. The new interval [start, end) conflicts with an existing child interval [s2, e2) when start < e2 + 15min AND s2 < end + 15min (each existing interval expanded by 15 minutes on its end). Therefore end == s2 (true adjacency) DOES conflict for the same child."
    error_id: ERR_CHILD_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /clinic/appointments, POST /clinic/waitlist-entries/{waitlistEntryId}/accept"

  - priority: 10
    category: business_constraint
    check: "On appointment booking and waitlist accept: therapist weekly scheduled minutes + new duration must NOT exceed weekly_visit_minutes_cap (> cap rejects; == cap allowed) per weekly_minutes_load calc"
    error_id: ERR_THERAPIST_WEEKLY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /clinic/appointments, POST /clinic/waitlist-entries/{waitlistEntryId}/accept"

  - priority: 11
    category: business_constraint
    check: "On plan-of-care activation: primary therapist current_caseload < max_caseload"
    error_id: ERR_CASELOAD_EXCEEDED
    http_status: 409
    applies_to: "POST /clinic/plans-of-care/{planId}/activate"

  - priority: 12
    category: business_fiscal
    check: "On appointment booking and waitlist accept: authorization available_visits >= 1 (capacity is the LAST business check). == 0 rejects."
    error_id: ERR_VISIT_CAP_EXCEEDED
    http_status: 402
    applies_to: "POST /clinic/appointments, POST /clinic/waitlist-entries/{waitlistEntryId}/accept"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving clock ----
  - method: POST
    path: "/clinic/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any call to this endpoint the logical clock reads exactly that default and never falls back to wall-clock time. Setting the clock also triggers any pending Authorization ACTIVE->EXPIRED auto-transitions whose valid_until <= the new time."
    roles: [ClinicAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, expired_authorization_ids: string[] }"
    side_effects:
      - "Logical clock set to to_iso8601"
      - "Authorizations with valid_until <= current_utc and status ACTIVE transition to EXPIRED"

  # ---- Children ----
  - method: POST
    path: "/clinic/children"
    description: "Register a child"
    roles: [ClinicAdmin]
    code: 201
    input: [full_name, date_of_birth]
    output: Child
    side_effects: ["age_months_at_intake computed from date_of_birth and current clock", "status = ACTIVE", "coordination_program = NONE"]

  - method: GET
    path: "/clinic/children"
    description: "List children"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: ["status?"]
    output: "Child[]"
    side_effects: []

  - method: GET
    path: "/clinic/children/{childId}"
    description: "Get a child"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: []
    output: Child
    side_effects: []

  - method: POST
    path: "/clinic/children/{childId}/discharge"
    description: "Discharge a child (sets status DISCHARGED)"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: Child
    side_effects: ["Child.status = DISCHARGED"]

  - method: GET
    path: "/clinic/children/{id}/authorizations"
    description: "List a child's authorizations (reverse-reachability for Authorization.child_id)"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: []
    output: "Authorization[]"
    side_effects: []

  - method: GET
    path: "/clinic/children/{id}/coordination-plans"
    description: "List a child's coordination plans (reverse-reachability for CoordinationPlan.child_id)"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: []
    output: "CoordinationPlan[]"
    side_effects: []

  # ---- Therapists ----
  - method: POST
    path: "/clinic/therapists"
    description: "Create a therapist"
    roles: [ClinicAdmin]
    code: 201
    input: [full_name, discipline, max_caseload, weekly_visit_minutes_cap]
    output: Therapist
    side_effects: ["status = ACTIVE", "current_caseload = 0"]

  - method: GET
    path: "/clinic/therapists"
    description: "List therapists"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: ["discipline?", "status?"]
    output: "Therapist[]"
    side_effects: []

  - method: GET
    path: "/clinic/therapists/{therapistId}"
    description: "Get a therapist"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: []
    output: Therapist
    side_effects: []

  # ---- Evaluations ----
  - method: POST
    path: "/clinic/evaluations"
    description: "Create a DRAFT evaluation (evaluator_id set from X-User-ID)"
    roles: [Evaluator]
    code: 201
    input: [child_id, discipline, severity_score]
    output: Evaluation
    side_effects: ["status = DRAFT", "evaluator_id = X-User-ID"]

  - method: GET
    path: "/clinic/evaluations"
    description: "List/filter evaluations (reverse-reachability for Evaluation.child_id and Evaluation.evaluator_id)"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: ["child_id?", "evaluator_id?", "discipline?", "status?"]
    output: "Evaluation[]"
    side_effects: []

  - method: GET
    path: "/clinic/evaluations/{evaluationId}"
    description: "Get an evaluation"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: []
    output: Evaluation
    side_effects: []

  - method: POST
    path: "/clinic/evaluations/{evaluationId}/finalize"
    description: "Finalize an evaluation; computes recommended_weekly_minutes and supersedes prior FINALIZED evaluations for same child+discipline"
    roles: [Evaluator]
    code: 200
    input: []
    output: Evaluation
    side_effects:
      - "status = FINALIZED"
      - "recommended_weekly_minutes computed (recommended_weekly_minutes calc)"
      - "Any prior FINALIZED Evaluation for same child_id+discipline transitions to SUPERSEDED"

  # ---- Plans of Care ----
  - method: POST
    path: "/clinic/plans-of-care"
    description: "Create a DRAFT plan of care from a FINALIZED evaluation"
    roles: [Evaluator]
    code: 201
    input: [child_id, evaluation_id, primary_therapist_id, planned_weekly_minutes]
    output: PlanOfCare
    side_effects: ["status = DRAFT", "discipline copied from evaluation", "goal_count = 0", "overall_progress_pct = 0"]

  - method: GET
    path: "/clinic/plans-of-care"
    description: "List/filter plans of care (reverse-reachability for PlanOfCare.child_id, PlanOfCare.evaluation_id, PlanOfCare.primary_therapist_id)"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: ["child_id?", "evaluation_id?", "primary_therapist_id?", "status?"]
    output: "PlanOfCare[]"
    side_effects: []

  - method: GET
    path: "/clinic/plans-of-care/{planId}"
    description: "Get a plan of care"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: []
    output: PlanOfCare
    side_effects: []

  - method: POST
    path: "/clinic/plans-of-care/{planId}/activate"
    description: "Activate a plan (DRAFT->ACTIVE or ON_HOLD->ACTIVE); checks caseload"
    roles: [Evaluator]
    code: 200
    input: []
    output: PlanOfCare
    side_effects: ["status -> ACTIVE", "Therapist.current_caseload += 1"]

  - method: POST
    path: "/clinic/plans-of-care/{planId}/hold"
    description: "Put an ACTIVE plan ON_HOLD; cancels its future SCHEDULED appointments (cascade)"
    roles: [Therapist]
    code: 200
    input: []
    output: PlanOfCare
    side_effects:
      - "status -> ON_HOLD"
      - "Therapist.current_caseload -= 1"
      - "Plan's SCHEDULED appointments CANCELLED; each releases a reserved authorization visit and fires waitlist promotion"

  - method: POST
    path: "/clinic/plans-of-care/{planId}/discharge"
    description: "Discharge a plan (from ACTIVE or ON_HOLD)"
    roles: [Evaluator]
    code: 200
    input: []
    output: PlanOfCare
    side_effects:
      - "status -> DISCHARGED"
      - "If was ACTIVE: Therapist.current_caseload -= 1"
      - "Plan's SCHEDULED appointments CANCELLED (release + promote); HomePrograms CANCELLED"

  - method: GET
    path: "/clinic/plans-of-care/{id}/goals"
    description: "List goals of a plan (reverse-reachability for Goal.plan_of_care_id)"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: []
    output: "Goal[]"
    side_effects: []

  # ---- Goals ----
  - method: POST
    path: "/clinic/plans-of-care/{planId}/goals"
    description: "Add a goal to a plan (allowed while DRAFT or ACTIVE)"
    roles: [Evaluator, Therapist]
    code: 201
    input: [description, weight, baseline_pct, target_pct]
    output: Goal
    side_effects: ["status = OPEN", "latest_progress_pct = baseline_pct", "PlanOfCare.goal_count += 1", "PlanOfCare.overall_progress_pct recomputed"]

  - method: GET
    path: "/clinic/goals/{goalId}"
    description: "Get a goal"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: []
    output: Goal
    side_effects: []

  - method: POST
    path: "/clinic/goals/{goalId}/discontinue"
    description: "Discontinue a goal (OPEN->DISCONTINUED); excludes it from overall_progress_pct"
    roles: [Therapist, Evaluator]
    code: 200
    input: []
    output: Goal
    side_effects: ["status = DISCONTINUED", "PlanOfCare.overall_progress_pct recomputed (forward-looking)"]

  - method: GET
    path: "/clinic/goals/{id}/progress-entries"
    description: "List a goal's progress entries (reverse-reachability for GoalProgressEntry.goal_id)"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: []
    output: "GoalProgressEntry[]"
    side_effects: []

  # ---- Authorizations ----
  - method: POST
    path: "/clinic/authorizations"
    description: "Create an ACTIVE authorization (visit cap)"
    roles: [ClinicAdmin]
    code: 201
    input: [child_id, discipline, payer_name, authorized_visits, valid_from, valid_until]
    output: Authorization
    side_effects: ["status = ACTIVE", "reserved_visits = 0", "committed_visits = 0", "available_visits = authorized_visits"]

  - method: GET
    path: "/clinic/authorizations/{authorizationId}"
    description: "Get an authorization (includes reserved/committed/available_visits)"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: []
    output: Authorization
    side_effects: []

  - method: POST
    path: "/clinic/authorizations/{authorizationId}/request-reauth"
    description: "Request reauthorization (ACTIVE/EXHAUSTED -> REAUTH_REQUESTED); OCC-guarded"
    roles: [ClinicAdmin]
    code: 200
    input: [expected_authorization_version]
    output: Authorization
    side_effects: ["status -> REAUTH_REQUESTED", "increments Authorization.version by 1"]

  - method: POST
    path: "/clinic/authorizations/{authorizationId}/grant-reauth"
    description: "Grant reauthorization (REAUTH_REQUESTED -> ACTIVE); replenishes cap; OCC-guarded"
    roles: [ClinicAdmin]
    code: 200
    input: [additional_visits, new_valid_until, expected_authorization_version]
    output: Authorization
    side_effects:
      - "authorized_visits += additional_visits"
      - "valid_until = new_valid_until"
      - "available_visits recomputed (reauth_replenish); status -> ACTIVE if available_visits > 0"
      - "increments Authorization.version by 1"

  - method: POST
    path: "/clinic/authorizations/{authorizationId}/close"
    description: "Close an EXPIRED or EXHAUSTED authorization with no outstanding reservations"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: Authorization
    side_effects: ["status -> CLOSED"]

  # ---- Appointments ----
  - method: POST
    path: "/clinic/appointments"
    description: "Book an appointment (reserves a visit). Runs discipline, window, double-booking, weekly-cap, and visit-cap checks."
    roles: [ClinicAdmin, SchedulingCoordinator]
    code: 201
    input: [child_id, therapist_id, authorization_id, plan_of_care_id, start_time, end_time]
    output: Appointment
    side_effects:
      - "status = SCHEDULED"
      - "duration_minutes computed"
      - "Authorization.reserved_visits += 1; available_visits recomputed; if available_visits == 0 -> Authorization EXHAUSTED"
      - "increments Authorization.version by 1"

  - method: GET
    path: "/clinic/appointments"
    description: "List/filter appointments (reverse-reachability for Appointment.child_id, therapist_id, authorization_id, plan_of_care_id, from_waitlist_entry_id)"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: ["child_id?", "therapist_id?", "authorization_id?", "plan_of_care_id?", "from_waitlist_entry_id?", "status?"]
    output: "Appointment[]"
    side_effects: []

  - method: GET
    path: "/clinic/appointments/{appointmentId}"
    description: "Get an appointment"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/clinic/appointments/{appointmentId}/complete"
    description: "Complete an appointment and record the session note + goal progress"
    roles: [Therapist]
    code: 200
    input: [narrative, minutes_delivered, goal_progress_entries]
    output: Appointment
    side_effects:
      - "status -> COMPLETED"
      - "Authorization.reserved_visits -= 1; Authorization.committed_visits += 1"
      - "SessionNote created; GoalProgressEntry appended per entry; Goal.latest_progress_pct and PlanOfCare.overall_progress_pct recomputed; Goal -> MET when latest >= target"
      - "increments Authorization.version by 1"

  - method: POST
    path: "/clinic/appointments/{appointmentId}/cancel"
    description: "Cancel a SCHEDULED appointment (releases the reserved visit; fires waitlist promotion)"
    roles: [ClinicAdmin, SchedulingCoordinator]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "status -> CANCELLED"
      - "Authorization.reserved_visits -= 1; available_visits rises; EXHAUSTED -> ACTIVE if applicable"
      - "Waitlist promotion runs for the therapist's freed slot (waitlist_promotion calc)"
      - "increments Authorization.version by 1"

  - method: POST
    path: "/clinic/appointments/{appointmentId}/no-show"
    description: "Record a no-show on a SCHEDULED appointment (releases visit, no commit, no promotion)"
    roles: [ClinicAdmin, SchedulingCoordinator]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "status -> NO_SHOW"
      - "Authorization.reserved_visits -= 1; available_visits rises; EXHAUSTED -> ACTIVE if applicable"
      - "increments Authorization.version by 1"

  - method: GET
    path: "/clinic/appointments/{id}/session-notes"
    description: "List the session note(s) of an appointment (reverse-reachability for SessionNote.appointment_id; 0 or 1)"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: []
    output: "SessionNote[]"
    side_effects: []

  - method: GET
    path: "/clinic/session-notes/{sessionNoteId}"
    description: "Get a session note"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: []
    output: SessionNote
    side_effects: []

  # ---- Coordination Plans (IFSP / IEP) ----
  - method: POST
    path: "/clinic/coordination-plans"
    description: "Create a DRAFT coordination plan (IFSP or IEP)"
    roles: [ClinicAdmin]
    code: 201
    input: [child_id, plan_type, jurisdiction, review_due_time]
    output: CoordinationPlan
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/clinic/coordination-plans/{coordinationPlanId}"
    description: "Get a coordination plan"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: []
    output: CoordinationPlan
    side_effects: []

  - method: POST
    path: "/clinic/coordination-plans/{coordinationPlanId}/activate"
    description: "Activate a coordination plan (DRAFT->ACTIVE); enforces single-active and IFSP age"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: CoordinationPlan
    side_effects: ["status -> ACTIVE", "Child.coordination_program set"]

  - method: POST
    path: "/clinic/coordination-plans/{coordinationPlanId}/begin-transition"
    description: "Begin EI->school transition on an ACTIVE IFSP plan (ACTIVE->TRANSITIONING)"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: CoordinationPlan
    side_effects: ["status -> TRANSITIONING"]

  - method: POST
    path: "/clinic/coordination-plans/{coordinationPlanId}/close"
    description: "Close a coordination plan (ACTIVE/TRANSITIONING->CLOSED)"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: CoordinationPlan
    side_effects: ["status -> CLOSED", "Child.coordination_program reset to NONE if no other active plan"]

  # ---- Home Programs / Parent Training ----
  - method: POST
    path: "/clinic/plans-of-care/{planId}/home-programs"
    description: "Assign a home program / parent-training activity to a plan (assigned_by from X-User-ID)"
    roles: [Therapist]
    code: 201
    input: [title, weekly_target_sessions, "parent_training_completed?"]
    output: HomeProgram
    side_effects: ["status = ASSIGNED", "assigned_by_therapist_id = X-User-ID"]

  - method: GET
    path: "/clinic/home-programs"
    description: "List/filter home programs (reverse-reachability for HomeProgram.plan_of_care_id and HomeProgram.assigned_by_therapist_id)"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: ["plan_of_care_id?", "assigned_by_therapist_id?", "status?"]
    output: "HomeProgram[]"
    side_effects: []

  - method: GET
    path: "/clinic/home-programs/{homeProgramId}"
    description: "Get a home program"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: []
    output: HomeProgram
    side_effects: []

  - method: POST
    path: "/clinic/home-programs/{homeProgramId}/activate"
    description: "Activate a home program (ASSIGNED->ACTIVE); requires parent training complete"
    roles: [Therapist]
    code: 200
    input: ["parent_training_completed?"]
    output: HomeProgram
    side_effects: ["If parent_training_completed provided true, set it first", "status -> ACTIVE"]

  - method: POST
    path: "/clinic/home-programs/{homeProgramId}/complete"
    description: "Complete a home program (ACTIVE->COMPLETED)"
    roles: [Therapist]
    code: 200
    input: []
    output: HomeProgram
    side_effects: ["status -> COMPLETED"]

  - method: POST
    path: "/clinic/home-programs/{homeProgramId}/cancel"
    description: "Cancel a home program (ASSIGNED/ACTIVE->CANCELLED)"
    roles: [Therapist]
    code: 200
    input: []
    output: HomeProgram
    side_effects: ["status -> CANCELLED"]

  # ---- Waitlist ----
  - method: POST
    path: "/clinic/waitlist-entries"
    description: "Add a child to a therapist's waitlist (priority from evaluation severity_score)"
    roles: [ClinicAdmin, SchedulingCoordinator]
    code: 201
    input: [child_id, therapist_id, discipline, evaluation_id, requested_minutes]
    output: WaitlistEntry
    side_effects: ["status = WAITING", "priority_score = evaluation.severity_score"]

  - method: GET
    path: "/clinic/waitlist-entries"
    description: "List/filter waitlist entries (reverse-reachability for WaitlistEntry.child_id, therapist_id, evaluation_id)"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: ["child_id?", "therapist_id?", "evaluation_id?", "status?"]
    output: "WaitlistEntry[]"
    side_effects: []

  - method: GET
    path: "/clinic/waitlist-entries/{waitlistEntryId}"
    description: "Get a waitlist entry"
    roles: [ClinicAdmin, Evaluator, Therapist, SchedulingCoordinator]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  - method: POST
    path: "/clinic/waitlist-entries/{waitlistEntryId}/accept"
    description: "Accept an OFFERED waitlist entry; books an appointment in the freed slot"
    roles: [ClinicAdmin, SchedulingCoordinator]
    code: 200
    input: [authorization_id, plan_of_care_id, start_time, end_time]
    output: WaitlistEntry
    side_effects:
      - "status -> PLACED"
      - "A SCHEDULED Appointment is created with from_waitlist_entry_id set; reserves a visit; increments Authorization.version by 1"

  - method: POST
    path: "/clinic/waitlist-entries/{waitlistEntryId}/decline"
    description: "Decline an OFFERED waitlist entry (OFFERED->WAITING); re-runs promotion to next entry"
    roles: [ClinicAdmin, SchedulingCoordinator]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["status -> WAITING", "promotion re-runs for the slot"]

  - method: POST
    path: "/clinic/waitlist-entries/{waitlistEntryId}/withdraw"
    description: "Withdraw a waitlist entry (WAITING/OFFERED->WITHDRAWN)"
    roles: [ClinicAdmin, SchedulingCoordinator]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["status -> WITHDRAWN"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing/invalid or role unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for this operation" }
  # --- existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource (path id or body FK) does not exist" }
  # --- validation / input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, type/enum/range violation (e.g. severity_score out of 0..100, target_pct <= baseline_pct, end_time <= start_time, additional_visits < 1, narrative < 10 chars)" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_authorization_version does not equal the authorization's current version on a reauth endpoint" }
  # --- generic state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not legal from the resource's current state and no more-specific state error applies" }
  # --- Child ---
  - { id: ERR_CHILD_DISCHARGED, http: 409, condition: "Operation requires an ACTIVE child but the child is DISCHARGED" }
  # --- Evaluation ---
  - { id: ERR_EVALUATION_NOT_DRAFT, http: 409, condition: "finalize requires the evaluation to be DRAFT" }
  - { id: ERR_EVALUATION_NOT_FINALIZED, http: 409, condition: "Plan creation/activation requires a FINALIZED (non-SUPERSEDED) source evaluation" }
  # --- PlanOfCare ---
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "activate (initial) requires the plan to be DRAFT" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Operation requires the plan to be ACTIVE (hold, home-program activate, booking)" }
  - { id: ERR_PLAN_NOT_HELD, http: 409, condition: "re-activate requires the plan to be ON_HOLD" }
  - { id: ERR_PLAN_NOT_DISCHARGEABLE, http: 409, condition: "discharge requires the plan to be ACTIVE or ON_HOLD" }
  - { id: ERR_CASELOAD_EXCEEDED, http: 409, condition: "Activating the plan would push the primary therapist's current_caseload past max_caseload" }
  - { id: ERR_THERAPIST_DISCIPLINE_MISMATCH, http: 409, condition: "Therapist discipline does not match the evaluation/authorization discipline" }
  # --- Authorization ---
  - { id: ERR_AUTH_NOT_REAUTHABLE, http: 409, condition: "request-reauth requires the authorization to be ACTIVE or EXHAUSTED" }
  - { id: ERR_AUTH_NOT_IN_REAUTH, http: 409, condition: "grant-reauth requires the authorization to be REAUTH_REQUESTED" }
  - { id: ERR_AUTH_NOT_CLOSEABLE, http: 409, condition: "close requires the authorization to be EXPIRED or EXHAUSTED" }
  - { id: ERR_OUTSTANDING_RESERVATIONS, http: 409, condition: "close blocked: reserved_visits > 0 (outstanding SCHEDULED appointments)" }
  - { id: ERR_AUTH_WINDOW_VIOLATION, http: 409, condition: "Appointment interval falls outside [valid_from, valid_until) or authorization not ACTIVE" }
  - { id: ERR_VISIT_CAP_EXCEEDED, http: 402, condition: "Booking/accept would draw a visit when available_visits == 0" }
  # --- Appointment ---
  - { id: ERR_APPOINTMENT_NOT_SCHEDULED, http: 409, condition: "complete/cancel/no-show requires the appointment to be SCHEDULED" }
  - { id: ERR_APPOINTMENT_IN_FUTURE, http: 409, condition: "complete/no-show requires current_utc >= start_time" }
  - { id: ERR_THERAPIST_DOUBLE_BOOKED, http: 409, condition: "Requested interval overlaps an existing SCHEDULED appointment for the same therapist" }
  - { id: ERR_CHILD_DOUBLE_BOOKED, http: 409, condition: "Requested interval (buffer-expanded) overlaps an existing SCHEDULED appointment for the same child" }
  - { id: ERR_THERAPIST_WEEKLY_CAP_EXCEEDED, http: 409, condition: "Booking would push the therapist's weekly scheduled minutes past weekly_visit_minutes_cap" }
  - { id: ERR_GOAL_PLAN_MISMATCH, http: 409, condition: "A goal_progress_entries goal_id does not belong to the appointment's plan_of_care" }
  # --- CoordinationPlan ---
  - { id: ERR_COORDINATION_NOT_DRAFT, http: 409, condition: "activate requires the coordination plan to be DRAFT" }
  - { id: ERR_COORDINATION_NOT_ACTIVE, http: 409, condition: "begin-transition requires the coordination plan to be ACTIVE" }
  - { id: ERR_COORDINATION_NOT_CLOSEABLE, http: 409, condition: "close requires the coordination plan to be ACTIVE or TRANSITIONING" }
  - { id: ERR_COORDINATION_CONFLICT, http: 409, condition: "Child already has an ACTIVE or TRANSITIONING coordination plan" }
  - { id: ERR_IFSP_AGE_INELIGIBLE, http: 409, condition: "IFSP activation blocked: child age_months_at_intake >= 36" }
  - { id: ERR_TRANSITION_NOT_APPLICABLE, http: 409, condition: "begin-transition only applies to IFSP plans" }
  # --- HomeProgram ---
  - { id: ERR_HOME_PROGRAM_NOT_ASSIGNED, http: 409, condition: "activate requires the home program to be ASSIGNED" }
  - { id: ERR_HOME_PROGRAM_NOT_ACTIVE, http: 409, condition: "complete requires the home program to be ACTIVE" }
  - { id: ERR_HOME_PROGRAM_NOT_CANCELLABLE, http: 409, condition: "cancel requires the home program to be ASSIGNED or ACTIVE" }
  - { id: ERR_PARENT_TRAINING_INCOMPLETE, http: 409, condition: "activate blocked: parent_training_completed is false" }
  # --- Waitlist ---
  - { id: ERR_WAITLIST_NOT_OFFERED, http: 409, condition: "accept/decline requires the waitlist entry to be OFFERED" }
  - { id: ERR_WAITLIST_NOT_WITHDRAWABLE, http: 409, condition: "withdraw requires the waitlist entry to be WAITING or OFFERED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClinicAdmin
    description: "Front-office / operations: children, therapists, authorizations & reauth, scheduling, cancellation, no-show, waitlist, coordination plans, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /clinic/_clock/set_current_utc — set logical clock"
      - "POST /clinic/children — register child"
      - "POST /clinic/children/{childId}/discharge — discharge child"
      - "POST /clinic/therapists — create therapist"
      - "POST /clinic/authorizations — create authorization"
      - "POST /clinic/authorizations/{authorizationId}/request-reauth — request reauth"
      - "POST /clinic/authorizations/{authorizationId}/grant-reauth — grant reauth"
      - "POST /clinic/authorizations/{authorizationId}/close — close authorization"
      - "POST /clinic/appointments/{appointmentId}/no-show — record no-show"
      - "POST /clinic/coordination-plans — create coordination plan"
      - "POST /clinic/coordination-plans/{coordinationPlanId}/activate — activate coordination plan"
      - "POST /clinic/coordination-plans/{coordinationPlanId}/begin-transition — begin EI->school transition"
      - "POST /clinic/coordination-plans/{coordinationPlanId}/close — close coordination plan"
    shared_operations:
      - "POST /clinic/appointments — book appointment (with SchedulingCoordinator)"
      - "POST /clinic/appointments/{appointmentId}/cancel — cancel appointment (with SchedulingCoordinator)"
      - "POST /clinic/waitlist-entries — add to waitlist (with SchedulingCoordinator)"
      - "POST /clinic/waitlist-entries/{waitlistEntryId}/accept — accept offer (with SchedulingCoordinator)"
      - "POST /clinic/waitlist-entries/{waitlistEntryId}/decline — decline offer (with SchedulingCoordinator)"
      - "POST /clinic/waitlist-entries/{waitlistEntryId}/withdraw — withdraw (with SchedulingCoordinator)"
      - "All GET reads (with Evaluator, Therapist, SchedulingCoordinator)"

  - name: SchedulingCoordinator
    description: "Scheduling desk: books, cancels, and manages the waitlist; cannot create authorizations or alter clinical records."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /clinic/appointments — book appointment (with ClinicAdmin)"
      - "POST /clinic/appointments/{appointmentId}/cancel — cancel appointment (with ClinicAdmin)"
      - "POST /clinic/waitlist-entries — add to waitlist (with ClinicAdmin)"
      - "POST /clinic/waitlist-entries/{waitlistEntryId}/accept — accept offer (with ClinicAdmin)"
      - "POST /clinic/waitlist-entries/{waitlistEntryId}/decline — decline offer (with ClinicAdmin)"
      - "POST /clinic/waitlist-entries/{waitlistEntryId}/withdraw — withdraw (with ClinicAdmin)"
      - "All GET reads"

  - name: Evaluator
    description: "Licensed evaluating clinician: authors evaluations, builds and activates/holds-back/discharges plans of care, manages goals."
    identity: "entity_backed:Therapist"
    exclusive_operations:
      - "POST /clinic/evaluations — create evaluation"
      - "POST /clinic/evaluations/{evaluationId}/finalize — finalize evaluation"
      - "POST /clinic/plans-of-care — create plan of care"
      - "POST /clinic/plans-of-care/{planId}/activate — activate plan"
      - "POST /clinic/plans-of-care/{planId}/discharge — discharge plan"
    shared_operations:
      - "POST /clinic/plans-of-care/{planId}/goals — add goal (with Therapist)"
      - "POST /clinic/goals/{goalId}/discontinue — discontinue goal (with Therapist)"
      - "All GET reads"

  - name: Therapist
    description: "Treating therapist: completes sessions & session notes, holds plans, manages goals and home programs / parent training."
    identity: "entity_backed:Therapist"
    exclusive_operations:
      - "POST /clinic/appointments/{appointmentId}/complete — complete session + note"
      - "POST /clinic/plans-of-care/{planId}/hold — hold plan"
      - "POST /clinic/plans-of-care/{planId}/home-programs — assign home program"
      - "POST /clinic/home-programs/{homeProgramId}/activate — activate home program"
      - "POST /clinic/home-programs/{homeProgramId}/complete — complete home program"
      - "POST /clinic/home-programs/{homeProgramId}/cancel — cancel home program"
    shared_operations:
      - "POST /clinic/plans-of-care/{planId}/goals — add goal (with Evaluator)"
      - "POST /clinic/goals/{goalId}/discontinue — discontinue goal (with Evaluator)"
      - "All GET reads"
