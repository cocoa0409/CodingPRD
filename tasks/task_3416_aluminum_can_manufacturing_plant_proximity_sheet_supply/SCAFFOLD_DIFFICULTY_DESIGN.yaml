  - rule_id: boundary_precision_check
    instances:
      - name: warehouse_projection_equals_capacity_allowed_one_over_rejected
        grounds:
          - calculations.warehouse_projection
          - calculations.plant_posture
          - errors.ERR_WAREHOUSE_CAPACITY_EXCEEDED
          - errors.ERR_PLANT_LOCKDOWN
        distinguishing_aspect: |
          Numeric-threshold boundary on run create: projected 150000 + qty 100001 = 250001
          strictly over capacity 250000 is rejected ERR_WAREHOUSE_CAPACITY_EXCEEDED, while
          exactly 250000 (== capacity) is ACCEPTED — and accepting it drives free units to
          0, flipping posture to LOCKDOWN so the very next create fails ERR_PLANT_LOCKDOWN.
        test_recipe:
          setup:
