            - { call: "POST /faculty-members", payload: { full_name: "Ben Berg", email: "ben@x.edu", rank: "ASSISTANT_PROFESSOR", base_salary_cents: 8000000 }, as: DepartmentChair, captures: { f2_id: "$.data.id" } }
            - { call: "POST /qualifications", payload: { faculty_id: "${f2_id}", course_id: "${c1_id}", expires_on: "2027-01-15" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "01", modality: "ONLINE", meeting_day: "MON", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s1_id: "$.data.id" } }
            - { call: "POST /course-sections/${s1_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /assignments", payload: { section_id: "${s1_id}", faculty_id: "${f2_id}" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "02", modality: "ONLINE", meeting_day: "TUE", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s2_id: "$.data.id" } }
            - { call: "POST /course-sections/${s2_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
            - { call: "POST /assignments", payload: { section_id: "${s2_id}", faculty_id: "${f2_id}" }, as: DepartmentChair }
            - { call: "POST /course-sections", payload: { term_id: "${t_id}", course_id: "${c1_id}", section_number: "03", modality: "ONLINE", meeting_day: "WED", start_minute: 540, end_minute: 600 }, as: DepartmentChair, captures: { s3_id: "$.data.id" } }
            - { call: "POST /course-sections/${s3_id}/transition", payload: { to_state: "SCHEDULED" }, as: DepartmentChair }
