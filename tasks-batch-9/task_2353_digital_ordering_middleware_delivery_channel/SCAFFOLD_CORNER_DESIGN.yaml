          - entities.Store.fields.open_order_count
        distinguishing_aspect: "Three derived counters on three different parents are reconciled against their own source rows after a create, after a republish onto a new version and after an order terminates, so a counter that is merely incremented and never decremented is caught."
        test_recipe:
          setup:
            - "MARKETMAX; two finalized versions V1 (BURGER, FRIES) and V2 (BURGER only); Store S30 with a Monday window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /channels"
              payload: { code: "MARKETMAX", name: "MarketMax", channel_type: "MARKETPLACE", markup_bps: 1500, rounding_mode: "NICKEL", service_fee_cents: 299, commission_bps: 2500, settlement_mode: "NET_MODE", eighty_six_policy: "HONOR_86", throttle_policy: "SUPPRESS_ON_THROTTLE", adjustment_review_mode: "CHANNEL_REVIEW", accepts_delivery: true }
              as: PlatformAdmin
              captures: { ch_mp_id: "$.data.id" }
            - call: "POST /menu-versions"
              payload: { brand_code: "BRD1", version_label: "2026-Q3-V1" }
              as: PlatformAdmin
              captures: { mv1_id: "$.data.id" }
            - call: "POST /menu-versions/${mv1_id}/items"
              payload: { sku: "BURGER", name: "Burger", base_price_cents: 1099, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv1_id}/items"
              payload: { sku: "FRIES", name: "Fries", base_price_cents: 399, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv1_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /menu-versions"
              payload: { brand_code: "BRD1", version_label: "2026-Q4-V2" }
              as: PlatformAdmin
              captures: { mv2_id: "$.data.id" }
            - call: "POST /menu-versions/${mv2_id}/items"
              payload: { sku: "BURGER", name: "Burger", base_price_cents: 1099, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv2_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store Thirty", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 3, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 600, closes_at_minute: 1320 }
              as: StoreOperator
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /stores/${store_id}/publish-menu"
              payload: { menu_version_id: "${mv1_id}", expected_store_version: "${store_v1}" }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { store_v2: "$.data.version" }
            - call: "GET /channels/${ch_mp_id}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_mp_id}", external_ref: "MP-3701", fulfillment_mode: "PICKUP", lines: [{ sku: "BURGER", quantity: 1 }] }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
              captures: { ord_id: "$.data.id" }
            - call: "POST /orders/${ord_id}/cancel"
              payload: { reason_code: "CHANNEL_REQUEST" }
              as: ChannelPartner
              as_user_id: "${ch_mp_id}"
            - call: "POST /stores/${store_id}/publish-menu"
              payload: { menu_version_id: "${mv2_id}", expected_store_version: "${store_v2}" }
              as: StoreOperator
              as_user_id: "${store_id}"
            - call: "GET /channel-listings"
              payload: { store_id: "${store_id}", limit: 100, offset: 0 }
              as: PlatformAdmin
          assert:
            - "After the first publish Channel.${ch_mp_id}.listing_count == 2 and equals the total_count of GET /channel-listings for that channel, while MenuVersion.${mv1_id}.published_store_count == 1"
            - "Placing the order raises Store.${store_id}.open_order_count to 1 and reserved_prep_slots to 1; cancelling it returns both to 0, so the counters are decremented and not merely incremented"
            - "After republishing onto V2 the store's listings are 1 (BURGER only), Channel.${ch_mp_id}.listing_count == 1, MenuVersion.${mv2_id}.published_store_count == 1 and MenuVersion.${mv1_id}.published_store_count == 0"
            - "GET /channel-listings for the store returns total_count 1 and its single row's menu_version_id == ${mv2_id}, so the stale FRIES listing was removed rather than left orphaned"

      - name: cascading_side_effects_already_covered
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: cascading_side_effect_depth / adjustment_acceptance_cascade_depth_five
          rationale: "The named §1.8 instance verifies the full five-level chain (adjustment -> order money -> statement aggregates -> tier -> commission and rebate) end to end, which is the deepest cascade in the scaffold."

      - name: dual_variant_calculation_already_covered
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_divergence / dual_variant_quote_provisional_versus_confirmed_on_store
          rationale: "The named §1.8 instance drives both quote variants to different minute values from one data set, and its settlement counterpart dual_variant_settlement_gross_versus_net_on_statement does the same for the money variants."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: consistency_publish_response_is_immediately_authoritative
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /stores/{id}/publish-menu]
        distinguishing_aspect: "The write response itself, not a subsequent read, must already carry every derived consequence of the publish: the new active version, the reset throttle posture, the bumped version and the freshly priced listings that a co-timed order then consumes."
        test_recipe:
          setup:
            - "MARKETMAX and AGGRPLUS; a finalized version with BURGER 1099/875 and FRIES 399/875; Store S31 with a Monday window, nothing published"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /channels"
              payload: { code: "MARKETMAX", name: "MarketMax", channel_type: "MARKETPLACE", markup_bps: 1500, rounding_mode: "NICKEL", service_fee_cents: 299, commission_bps: 2500, settlement_mode: "NET_MODE", eighty_six_policy: "HONOR_86", throttle_policy: "SUPPRESS_ON_THROTTLE", adjustment_review_mode: "CHANNEL_REVIEW", accepts_delivery: true }
              as: PlatformAdmin
              captures: { ch_mp_id: "$.data.id" }
            - call: "POST /channels"
              payload: { code: "AGGRPLUS", name: "AggrPlus", channel_type: "AGGREGATOR", markup_bps: 800, rounding_mode: "CENT", service_fee_cents: 149, commission_bps: 1800, settlement_mode: "GROSS_MODE", eighty_six_policy: "IGNORE_86", throttle_policy: "IGNORE_THROTTLE", adjustment_review_mode: "AUTO_ACCEPT", accepts_delivery: true }
              as: PlatformAdmin
              captures: { ch_agg_id: "$.data.id" }
            - call: "POST /menu-versions"
              payload: { brand_code: "BRD1", version_label: "2026-Q3-CORE" }
              as: PlatformAdmin
              captures: { mv_id: "$.data.id" }
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "BURGER", name: "Burger", base_price_cents: 1099, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "FRIES", name: "Fries", base_price_cents: 399, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store Thirtyone", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 2, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v: "$.data.version" }
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 600, closes_at_minute: 1320 }
              as: StoreOperator
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /stores/${store_id}/publish-menu"
              payload: { menu_version_id: "${mv_id}", expected_store_version: "${store_v}" }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { published_version_id: "$.data.active_menu_version_id" }
            - call: "GET /channel-listings"
              payload: { store_id: "${store_id}", limit: 100, offset: 0 }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel_id: "${ch_agg_id}", external_ref: "AG-3801", fulfillment_mode: "PICKUP", lines: [{ sku: "BURGER", quantity: 1 }] }
              as: ChannelPartner
              as_user_id: "${ch_agg_id}"
              captures: { ord_id: "$.data.id" }
            - call: "GET /stores/${store_id}/quote"
              payload: { channel_id: "${ch_agg_id}", fulfillment_mode: "PICKUP" }
              as: ChannelPartner
              as_user_id: "${ch_agg_id}"
          assert:
            - "The publish-menu response body itself already shows active_menu_version_id == ${mv_id}, throttle_state == NORMAL and version incremented from ${store_v}, with no follow-up read required"
            - "The immediately following listing read returns total_count 4 with MARKETMAX prices 1265 and 460 and AGGRPLUS prices 1187 and 431"
            - "The order placed in the same instant is accepted against those brand-new listings: subtotal_cents == 1187, tax_cents == 104, service_fee_cents == 149 and channel_collected_cents == 1440"
            - "The quote read taken after that order already reflects the reservation it created: promised minutes 12 plus one load pad of 2, so promised_ready_at == 2026-08-03T16:14:00Z"
