          - constants.GUESTS_BILLED_CAP
        distinguishing_aspect: "The billed-guest cap is exercised on both sides of its edge: a three-guest and a four-guest T6 booking both bill three guests but divide by different denominators, so the surcharge falls from 2400 to 1925 as the party grows — the cap changes the numerator step at 3 while the denominator keeps moving."
