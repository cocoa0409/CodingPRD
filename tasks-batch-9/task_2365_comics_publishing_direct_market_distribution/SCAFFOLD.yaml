    side_effects:
      - "issue.commercial_status PRINTED -> ON_SALE and on_sale_date = logical clock date"
      - "title.status IN_PRODUCTION -> PUBLISHING on the title's first on-sale issue"
      - "title.status PUBLISHING -> COMPLETED when the count of ON_SALE issues reaches title.planned_issue_count"
      - "increments Issue.version and Title.version"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ISSUE_NOT_FOUND, ERR_INVALID_STATE, ERR_NOT_CAMERA_READY, ERR_ON_SALE_DATE_NOT_REACHED]
