          setup:
            - "one CmarProject 'Southgate Parking Structure' with gmp_status EXECUTED"
            - "one WorkPackage 03-CONCRETE, budget_amount 1000000.00, SOLICITING with two OPENED third-party bids at 950000.00 and 980000.00"
