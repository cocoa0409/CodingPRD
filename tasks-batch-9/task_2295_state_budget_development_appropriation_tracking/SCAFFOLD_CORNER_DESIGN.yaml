              payload: { agency_id: "${ag_id}", budget_cycle_id: "${cyc_id}", cfda_number: "93.778", award_cents: 800000000, period_start: "2026-07-01T00:00:00Z", period_end: "2027-07-01T00:00:00Z", moe_baseline_cents: 350000000, required_match_ratio: 0.25, moe_prior_year1_spend_cents: 400000000, moe_prior_year2_spend_cents: 500000000 }
