            - "Contract restored to IN_FORCE 10000000/8000000 as in the producer-initiated path"

      - name: analysis_supersede_on_second_create
        claim_type: computed_read
        grounds:
          - "entities.ComparisonAnalysis.fields.status"
          - "entities.ComparisonAnalysis.fields.supersedes_analysis_id"
        distinguishing_aspect: "Creating a second analysis flips the first to SUPERSEDED and records the supersedes link; the case version advances on each creation (which is what the OCC guard observes)."
        test_recipe:
          setup: ["FULL case in SUITABILITY_REVIEW"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 }, { contract_year: 2, pct_bps: 600 }, { contract_year: 3, pct_bps: 500 }, { contract_year: 4, pct_bps: 400 }, { contract_year: 5, pct_bps: 300 }, { contract_year: 6, pct_bps: 200 }, { contract_year: 7, pct_bps: 100 } ], living_benefit_rider: true, rider_benefit_base_cents: 12000000, rider_annual_fee_bps: 95 }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_id}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { cv1: $.data.version } }
            - { call: "POST /cases/${case_id}/comparison-analyses", payload: { expected_case_version: "${cv1}", assumed_old_growth_bps: 500, assumed_new_growth_bps: 600 }, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { an_1: $.data.id } }
            - { call: "GET /cases/${case_id}", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { cv2: $.data.version } }
          trigger:
            - { call: "POST /cases/${case_id}/comparison-analyses", payload: { expected_case_version: "${cv2}", assumed_old_growth_bps: 450, assumed_new_growth_bps: 650 }, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { an_2: $.data.id } }
            - { call: "GET /cases/${case_id}/comparison-analyses", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
          assert:
            - "First analysis ${an_1}: status == SUPERSEDED after the second create"
            - "Second analysis ${an_2}: status == FINAL and supersedes_analysis_id == ${an_1}"
            - "Case version was 3 after start_review, 4 after the first analysis, 5 after the second"
            - "Exactly one FINAL analysis exists for the case"

      - name: request_funds_amounts_corner
        claim_type: side_effect_execution
        grounds:
          - "endpoints[POST /cases/{id}/request_funds]"
        excluded_because:
          difficulty_instance: funds_receipt_chain_surrenders_contract
          rationale: "Transfer amount/charge/basis/snapshot literals asserted at request_funds time in the named §1.8 instance."

