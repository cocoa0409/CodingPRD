              payload: { full_name: "B B", email: "bb@example.com", branch: "NAVY", component: "NAVY_RESERVE" }
              as: Anonymous
              captures: { memb_id: $.data.id }
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", start_date: "2026-01-01T00:00:00Z", end_date: "2026-02-01T00:00:00Z", orders_type: "DRILL" }
              as: ServiceMember
              as_user_id: "${mem_id}"
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${memb_id}", employer_id: "${emp2_id}", start_date: "2026-03-01T00:00:00Z", end_date: "2026-04-01T00:00:00Z", orders_type: "DRILL" }
