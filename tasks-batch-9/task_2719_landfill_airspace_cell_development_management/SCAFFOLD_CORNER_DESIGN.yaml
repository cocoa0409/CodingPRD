          - roles[SiteOperator]
          - roles[ScaleOperator]
        distinguishing_aspect: "Site scope is enforced transitively (through Cell.landfill_id and OperatingDay.landfill_id, not just a body landfill_id) and only on writes: the very same operator id that is refused a write is allowed the corresponding read."
        test_recipe:
          setup:
            - "Two landfills: LF-A with Cell C-A in CONSTRUCTION and an OperatingDay is not needed, and LF-B (a second permitted site) whose id will be used as the acting X-User-ID."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
