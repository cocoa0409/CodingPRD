      - name: occ_precedes_state_on_a_cancelled_booking_amendment
        claim_type: priority_ordering
        grounds:
          - validations[priority 15]
          - validations[priority 30]
          - errors[ERR_STALE_BOOKING_VERSION]
          - concurrency_rules
        distinguishing_aspect: |
          The booking is CANCELLED (terminal) AND the supplied expected_booking_version
          is stale AND the new guarantee breaks the ceiling: three rules are violated
          at once. Priority 15 wins, so the answer is 412 ERR_STALE_BOOKING_VERSION -
          never the 409 of priority 30 nor the 422 of priority 73. Replaying with the
          current version then exposes the state failure underneath.
        test_recipe:
          setup:
            - "Canonical base fixture with an accepted Nova Kade booking that is then cancelled by the promoter, so its version has advanced past the value captured at creation."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
