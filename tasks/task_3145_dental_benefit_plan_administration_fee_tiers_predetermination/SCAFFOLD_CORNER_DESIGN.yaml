      - name: predet_approve_with_stale_version_returns_stale_version
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - concurrency_rules[predet-approve-stale-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "After assign bumps the predetermination to version 2, an approve carrying expected_predetermination_version one behind is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "Standard stack. Predetermination assigned (version 2)."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
            - call: "POST /dental/predeterminations"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", cdt_code: "D2740", submitted_amount_cents: 9000, planned_service_date: "2026-06-01T00:00:00Z" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { predet_id: $.data.id }
            - call: "POST /dental/predeterminations/${predet_id}/assign"
              payload: { clinical_reviewer_id: "rev-1" }
              as: ClinicalReviewer
              as_user_id: "rev-1"
              captures: { predet_v: $.data.version }
          trigger:
            - call: "POST /dental/predeterminations/${predet_id}/approve"
              payload: { expected_predetermination_version: "${predet_v} - 1" }
              as: ClinicalReviewer
              as_user_id: "rev-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 412"
            - "error_id == ERR_STALE_VERSION"
            - "GET /dental/predeterminations/${predet_id} still shows status == UNDER_REVIEW"

