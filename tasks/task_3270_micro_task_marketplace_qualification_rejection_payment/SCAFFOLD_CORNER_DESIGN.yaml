        distinguishing_aspect: "After an UPHOLD resolution returns the assignment to REJECTED, a second dispute is refused with 409 ERR_DISPUTE_ALREADY_USED because each assignment owns exactly one dispute."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. An assignment was rejected at T0+40m, disputed at T0+50m, and resolved UPHOLD back to REJECTED."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
