    - calculations.consult_routing_selection STEP 1 clause 8 (cooldown, NEUROLOGIST_COOLDOWN_MIN = 10)
    - state_machines.Neurologist IN_CONSULT -> ON_CALL
    - endpoints.POST /stroke-network/consults/{id}/accept
