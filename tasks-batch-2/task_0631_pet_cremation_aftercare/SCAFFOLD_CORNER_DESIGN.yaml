        excluded_because:
          difficulty_instance: resource_temporal_overlap / overlap_viewing_room_buffered_window
          rationale: "ERR_VIEWING_ROOM_CONFLICT is asserted by the named §1.8 buffered-overlap instance."

      - name: error_stale_case_version_excluded
        claim_type: Violation -> Error
