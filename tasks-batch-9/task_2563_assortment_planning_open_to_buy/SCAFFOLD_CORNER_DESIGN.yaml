              captures: { slots_total: $.data.option_slots_total, slots_open: $.data.option_slots_open, target_units: $.data.target_units_per_option }
            - call: "GET /otb/plan-months/${m1_id}"
              payload: {}
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { st1: $.data.provisional_sell_through_bps, rate1: $.data.reserve_rate_bps, otb1: $.data.otb_planned_cents }
          assert:
            - "cost_of_goods_cents == 67,500,000 (150,000,000 * 4500 / 10000) and role_capacity_cents == 84,375,000 (67,500,000 * 12500 / 10000, the SEASONAL row of ROLE_RECEIPT_MULTIPLIER_BPS)"
            - "turn_basis_x100 == 200, NOT the authored 150: max(planned_turn_x100, TURN_FLOOR_X100) clamps the divisor, so turn_capacity_cents == round_half_up(67,500,000 * 300 / 200) == 101,250,000 rather than the 135,000,000 an unclamped 150 would produce"
