      - name: compliance_finding_fourth_reopen_beyond_cycle_limit_rejected
        claim_type: cyclic
        grounds:
          - state_machines.compliance_finding_lifecycle.shape
          - state_machines.compliance_finding_lifecycle.transitions
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          The finding machine is cyclic through CLOSED -> REOPENED, but the cycle is bounded at three
          reopens: the guard is reopen_count <= 2 evaluated BEFORE the increment, so reopens succeed
          at counts 0, 1 and 2 and the fourth attempt (count already 3) is refused.
        test_recipe:
          setup:
            - "Facility with one inspection-derived finding driven through three full reopen cycles"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /tsdf/compliance-findings"
              payload: { facility_id: "${fac_id}", finding_class: "MINOR", citation_code: "40CFR264.174", corrective_action_due_at: "2026-09-30T00:00:00Z" }
              as: RegulatoryInspector
              as_user_id: "insp-01"
              captures: { find_id: $.data.id }
            - call: "POST /tsdf/compliance-findings/${find_id}/status"
              payload: { to_status: "RESPONDED", corrective_action_completed_on: "2026-08-01", reason_code: "LOG_RESTORED" }
              as: ComplianceManager
              as_user_id: "cm-01"
            - call: "POST /tsdf/compliance-findings/${find_id}/status"
              payload: { to_status: "CLOSED" }
              as: RegulatoryInspector
              as_user_id: "insp-01"
            - call: "POST /tsdf/compliance-findings/${find_id}/status"
              payload: { to_status: "REOPENED", reason_code: "GAP_RECURRED" }
              as: RegulatoryInspector
              as_user_id: "insp-01"
            - call: "POST /tsdf/compliance-findings/${find_id}/status"
              payload: { to_status: "RESPONDED", corrective_action_completed_on: "2026-08-01", reason_code: "REMEDIATED" }
              as: ComplianceManager
              as_user_id: "cm-01"
            - call: "POST /tsdf/compliance-findings/${find_id}/status"
              payload: { to_status: "CLOSED" }
              as: RegulatoryInspector
              as_user_id: "insp-01"
            - call: "POST /tsdf/compliance-findings/${find_id}/status"
              payload: { to_status: "REOPENED", reason_code: "GAP_RECURRED" }
              as: RegulatoryInspector
              as_user_id: "insp-01"
            - call: "POST /tsdf/compliance-findings/${find_id}/status"
              payload: { to_status: "RESPONDED", corrective_action_completed_on: "2026-08-01", reason_code: "REMEDIATED" }
              as: ComplianceManager
              as_user_id: "cm-01"
            - call: "POST /tsdf/compliance-findings/${find_id}/status"
              payload: { to_status: "CLOSED" }
              as: RegulatoryInspector
              as_user_id: "insp-01"
            - call: "POST /tsdf/compliance-findings/${find_id}/status"
              payload: { to_status: "REOPENED", reason_code: "GAP_RECURRED" }
              as: RegulatoryInspector
              as_user_id: "insp-01"
            - call: "POST /tsdf/compliance-findings/${find_id}/status"
              payload: { to_status: "RESPONDED", corrective_action_completed_on: "2026-08-01", reason_code: "REMEDIATED" }
              as: ComplianceManager
              as_user_id: "cm-01"
            - call: "POST /tsdf/compliance-findings/${find_id}/status"
              payload: { to_status: "CLOSED" }
              as: RegulatoryInspector
              as_user_id: "insp-01"
          trigger:
            - call: "POST /tsdf/compliance-findings/${find_id}/status"
              payload: { to_status: "REOPENED", reason_code: "GAP_RECURRED" }
              as: RegulatoryInspector
              as_user_id: "insp-01"
          assert:
            - "All three setup REOPENED transitions returned 200"
            - "Before the trigger: ComplianceFinding.${find_id}.status == CLOSED and reopen_count == 3"
            - "response status == 409 and data.error_id == ERR_INVALID_STATE"
            - "ComplianceFinding.${find_id}.status == CLOSED"
            - "ComplianceFinding.${find_id}.reopen_count == 3"
            - "Facility.${fac_id}.open_snc_finding_count == 0"
            - "Facility.${fac_id}.corrective_action_status == COMPLETED"

      - name: instrument_cancellation_leaving_requirement_uncovered_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.financial_assurance_lifecycle.transitions
          - validations[priority=35]
          - errors[ERR_FINANCIAL_ASSURANCE_SHORTFALL]
        distinguishing_aspect: |
          Cancellation is guarded on the post-cancellation position, not the pre-cancellation one:
          with required_assurance_cents 34,250,000 and no successor instrument, cancelling the sole
          ACTIVE trust fund would leave the facility uncovered, so the 402 must fire and the
          instrument must remain ACTIVE.
        test_recipe:
          setup:
            - "Facility with exactly one ACTIVE 90,000,000-cent instrument and no inventory"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /tsdf/financial-assurance-instruments"
              payload: { facility_id: "${fac_id}", instrument_type: "TRUST_FUND", face_amount_cents: 90000000, effective_on: "2026-07-01", expected_facility_version: "${fac_v}" }
              as: ComplianceManager
              captures: { instr_id: $.data.id }
          trigger:
            - call: "POST /tsdf/financial-assurance-instruments/${instr_id}/cancel"
              payload: { reason_code: "SWITCHING_INSTRUMENT" }
              as: ComplianceManager
              as_user_id: "cm-01"
          assert:
            - "response status == 402 and data.error_id == ERR_FINANCIAL_ASSURANCE_SHORTFALL"
            - "FinancialAssuranceInstrument.${instr_id}.status == ACTIVE"
            - "FinancialAssuranceInstrument.${instr_id}.cancelled_at == null"
            - "Facility.${fac_id}.posted_assurance_cents == 90000000"
            - "Facility.${fac_id}.required_assurance_cents == 34250000"
            - "Facility.${fac_id}.assurance_shortfall_cents == 0"

      - name: new_instrument_supersedes_the_prior_active_instrument
        claim_type: cross_entity
        grounds:
          - state_machines.financial_assurance_lifecycle.side_effects
          - calculations.financial_assurance_requirement
          - endpoints[POST /tsdf/financial-assurance-instruments]
        distinguishing_aspect: |
          Posting a second instrument does not add coverage — it replaces it: the earlier row becomes
          SUPERSEDED with superseded_by_instrument_id and superseded_at set, and posted_assurance_cents
          equals the new instrument's face amount alone (50,000,000), not the 90,000,000 sum.
        test_recipe:
          setup:
            - "Facility with one ACTIVE 40,000,000-cent instrument; its post bumped the facility to version 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /tsdf/financial-assurance-instruments"
              payload: { facility_id: "${fac_id}", instrument_type: "TRUST_FUND", face_amount_cents: 40000000, effective_on: "2026-07-01", expected_facility_version: "${fac_v}" }
              as: ComplianceManager
              captures: { instr_a_id: $.data.id }
            - call: "GET /tsdf/facilities/${fac_id}"
              payload: {}
              as: ComplianceManager
              captures: { fac_v2: $.data.version }
          trigger:
            - call: "POST /tsdf/financial-assurance-instruments"
              payload: { facility_id: "${fac_id}", instrument_type: "LETTER_OF_CREDIT", face_amount_cents: 50000000, effective_on: "2026-08-01", expected_facility_version: "${fac_v2}" }
              as: ComplianceManager
              captures: { instr_b_id: $.data.id }
          assert:
            - "response status == 201"
            - "${fac_v2} == 2"
            - "FinancialAssuranceInstrument.${instr_b_id}.status == ACTIVE"
            - "FinancialAssuranceInstrument.${instr_a_id}.status == SUPERSEDED"
            - "FinancialAssuranceInstrument.${instr_a_id}.superseded_by_instrument_id == ${instr_b_id}"
            - "FinancialAssuranceInstrument.${instr_a_id}.superseded_at == 2026-08-01T00:00:00Z"
            - "Facility.${fac_id}.posted_assurance_cents == 50000000"
            - "Facility.${fac_id}.required_assurance_cents == 34250000"
            - "Facility.${fac_id}.assurance_shortfall_cents == 0"
            - "Facility.${fac_id}.version == 3"

      - name: profile_suspension_cascades_into_unit_and_batch_posture
        claim_type: cascade_down
        grounds:
          - state_machines.waste_profile_lifecycle.side_effects
          - calculations.storage_unit_posture
        excluded_because:
          difficulty_instance: profile_suspension_deficient_unit_restricted_batch_hold
          rationale: |
            That §1.8 instance already drives a suspension through the same downward cascade
            (profile -> containers DEFICIENT -> unit RESTRICTED -> batch HELD) and asserts every
            derived field this corner would assert. Re-testing it here would duplicate the harder
            case with no additional discrimination.

      - name: container_custody_and_compliance_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.container_custody_lifecycle
          - state_machines.container_compliance_lifecycle
        excluded_because:
          difficulty_instance: container_parallel_custody_and_compliance_dimensions
          rationale: |
            The §1.8 instance is built precisely on the independence of the two container dimensions
            and asserts each pair of coordinates after every move; a separate corner test would be a
            strict subset of it.

      - name: inspection_finding_cascade_is_conditional_on_leak_severity
        claim_type: conditional_cascade
        grounds:
          - state_machines.inspection_event_side_effects
          - calculations.leak_detection_classification
        excluded_because:
          difficulty_instance: inspection_leak_condemn_unit_suspend_batch_hold_reserved_release
          rationale: |
            The §1.8 instance exercises the conditional branch (container condemnation only when a
            container_id is present, unit suspension always) inside a four-hop cascade and asserts
            the released reserved_kg; this corner would only re-check the branch predicate.

      - name: manifest_rejection_keeps_the_generator_charge_ledger_balanced
        claim_type: ledger_sync
        grounds:
          - state_machines.manifest_lifecycle.side_effects
          - entities.Generator.fields.open_charge_cents
        excluded_because:
          difficulty_instance: manifest_reject_return_conserves_generator_charge_ledger
          rationale: |
            Ledger synchronisation on the REJECT/RETURN edge is the entire subject of that §1.8
            conservation instance, including the open/settled/void decomposition; duplicating it here
            would add no coverage.

  # ===========================================================================
  # 3. From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:
      - name: sample_evaluation_reports_the_first_breach_in_fixed_order
        claim_type: correct_result
        grounds:
          - calculations.sample_acceptance_evaluation
          - entities.ProfileSample.fields.failure_reason_code
          - calculations.required_sample_type
        distinguishing_aspect: |
          A sample that breaches BOTH the flash-point and the pH tolerance must report
          FLASH_POINT_DEVIATION, because the three checks run constituent -> flash point -> pH and the
          first breach wins. The passing constituent term is still published (0.0417), and
          required_sample_type stays FINGERPRINT after the failure because it is only recomputed on the
          next submit — the tolerance actually applied is the one the laboratory was told to use.
        test_recipe:
          setup:
            - "Facility, ACTIVE generator, profile declaring 12000 ppm / 42.0 C / pH 7.0, submitted once"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /tsdf/generators"
              payload: { epa_id: "TXR000555666", name: "Bayou Coatings", generator_category: "LQG", state_code: "TX" }
              as: PlatformAdmin
              captures: { gen_id: $.data.id }
            - call: "POST /tsdf/waste-profiles"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", waste_codes: ["D001"], physical_form: "SOLID", compatibility_class: "ORGANIC_SOLVENT", ldr_subcategory: "NONE", declared_constituent_ppm: 12000.0, declared_flash_point_c: 42.0, declared_ph: 7.0, requested_treatment_method: "INCINERATION", recertification_months: 12 }
              as: Generator
              as_user_id: "${gen_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /tsdf/waste-profiles/${prof_id}/submit"
              payload: {}
              as: Generator
              as_user_id: "${gen_id}"
              captures: { prof_v1: $.data.version }
          trigger:
            - call: "POST /tsdf/waste-profiles/${prof_id}/samples"
              payload: { sample_type: "FINGERPRINT", measured_constituent_ppm: 12500.0, measured_flash_point_c: 50.0, measured_ph: 9.0, expected_waste_profile_version: "${prof_v1}" }
              as: WasteApprovalChemist
              as_user_id: "chem-01"
              captures: { sample_id: $.data.id }
          assert:
            - "response status == 201"
            - "ProfileSample.${sample_id}.applied_tolerance_type == FINGERPRINT"
            - "ProfileSample.${sample_id}.constituent_deviation_pct == 0.0417"
            - "ProfileSample.${sample_id}.result == FAIL"
            - "ProfileSample.${sample_id}.failure_reason_code == FLASH_POINT_DEVIATION"
            - "ProfileSample.${sample_id}.failure_reason_code != PH_DEVIATION"
            - "WasteProfile.${prof_id}.status == SAMPLE_FAILED"
            - "WasteProfile.${prof_id}.sample_attempt_count == 1"
            - "WasteProfile.${prof_id}.latest_sample_result == FAIL"
            - "WasteProfile.${prof_id}.required_sample_type == FINGERPRINT"

