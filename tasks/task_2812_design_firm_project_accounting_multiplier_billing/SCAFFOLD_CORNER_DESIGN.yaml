      - name: bubble_up_closes_project_when_all_children_terminal
        claim_type: bubble_up
        grounds:
          - state_machines.Project.ACTIVE_to_CLOSED
        excluded_because:
          difficulty_instance: transitive_cascade / invoice_payment_five_hop_close_cascade
          rationale: "That instance asserts the aggregate transition end-to-end: all phases COMPLETE, unbilled_wip 0.00 and every invoice PAID drive Project -> CLOSED with earned_revenue_to_date 200000.00."

      - name: compensation_reverses_every_side_effect_of_invoicing
        claim_type: compensation
        grounds:
          - state_machines.Invoice.DRAFT_to_VOID
          - state_machines.TimeEntry.BILLED_to_APPROVED
        excluded_because:
          difficulty_instance: compensating_invariant / invoice_void_restores_every_swept_population_without_drift
          rationale: "Void is asserted to restore unbilled_wip to 3389.85, clear both back-reference populations and leave total_charge_value unchanged."

      - name: independent_state_dimensions_change_independently
        claim_type: parallel
        grounds:
          - state_machines.ConsultantInvoice.approval_status
          - state_machines.ConsultantInvoice.payment_status
          - state_machines.ConsultantInvoice.billing_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / consultant_invoice_three_independent_axes
          rationale: "That instance walks the three axes separately and asserts the combined state after each move."

      - name: revision_loop_is_cyclic_but_bounded
        claim_type: cyclic
        grounds:
          - state_machines.Invoice.PENDING_CLIENT_REVIEW_to_REVISION_REQUESTED
          - validations[priority=68]
        excluded_because:
          difficulty_instance: non_linear_state_machine / invoice_revision_cycle_with_bounded_termination
          rationale: "The loop is traversed to revision_round 3 and the fourth REQUEST_REVISION is asserted to return ERR_REVISION_LIMIT_EXCEEDED."

      - name: guarded_transition_depends_on_another_entity_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.ConsultantInvoice.WITHHELD_to_RELEASED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / payable_release_gated_by_client_invoice_state
          rationale: "Release is asserted refused while the client invoice is absent, DRAFT and APPROVED, and granted only at PAID."

      - name: fork_branches_join_with_divergent_side_effects
        claim_type: branching
        grounds:
          - state_machines.WriteOff
        excluded_because:
          difficulty_instance: non_linear_state_machine / write_off_fork_join_divergent_side_effects
          rationale: "Both routing branches are driven to APPROVED and the branch-specific side-effect sets are asserted separately."

      - name: ledger_sync_updates_ancestor_derived_fields
        claim_type: ledger_sync
        grounds:
          - state_machines.TimeEntry.SUBMITTED_to_APPROVED
          - calculations.project_rollup_metrics
        excluded_because:
          difficulty_instance: transitive_cascade / time_entry_approval_four_hop_posture_cascade
          rationale: "One approval is asserted to update the phase cost, the phase earned value, four project rollup fields and finally the billing posture gate."

  - section: calculations
    instances:
      - name: unapproved_and_disallowed_charges_enter_no_aggregate
        claim_type: input_set_filtering
        grounds:
          - calculations.project_rollup_metrics.input_set
          - calculations.invoice_totals_computation.input_set
          - calculations.phase_earned_value.input_set
        distinguishing_aspect: |
          Three populations sit in the database and must be invisible to every aggregate at once:
          a SUBMITTED time entry, a DISALLOWED expense and a RECEIVED consultant payable. The
          invoice sweep, the four rollup buckets and the phase earned value must all report the
          single APPROVED labor charge and nothing else.
