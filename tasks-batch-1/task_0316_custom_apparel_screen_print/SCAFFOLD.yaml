  - method: GET
    path: "/orders/{id}/art-proofs"
    description: "List ArtProofs of an Order (sub-resource; satisfies ArtProof.order_id)"
    roles: [ShopManager, ArtStaff, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ArtProof[]"
    side_effects: []

  - method: GET
    path: "/orders/{id}/art-proofs/{id}"
    description: "Get an ArtProof"
    roles: [ShopManager, ArtStaff, Customer]
    code: 200
    input: []
    output: ArtProof
    side_effects: []

  - method: POST
    path: "/orders/{id}/art-proofs/{id}/submit"
    description: "Submit a proof for customer review (DRAFT or CHANGES_REQUESTED -> SUBMITTED)"
    roles: [ArtStaff]
    code: 200
    input: []
    output: ArtProof
    side_effects: ["status -> SUBMITTED; revision_round += 1 when coming from CHANGES_REQUESTED"]

  - method: POST
    path: "/orders/{id}/art-proofs/{id}/request-changes"
