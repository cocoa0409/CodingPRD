scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: credit_debit_provisional_vs_final_diverges_on_party_size_patch
        grounds:
          - calculations.dining_plan_credit_debit
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - state_machines.Reservation.CONFIRMED_to_CHECKED_IN
          - endpoints.POST_/v1/reservations/{id}/party-size
          - entities.Reservation.fields.credits_held
          - entities.Reservation.fields.credits_debited
          - entities.DiningPlan.fields.table_service_credits_held
          - entities.DiningPlan.fields.table_service_credits_remaining
        distinguishing_aspect: |
          Provisional variant uses party_size at CONFIRM time (4 seats → 4 credits HELD);
          Final variant uses party_size at CHECK-IN time (2 seats → 2 credits DEBITED) after
          a party-size patch in between. Same Reservation, same DiningPlan, divergent outputs:
          credits_held = 4 vs credits_debited = 2.
        test_recipe:
          setup:
            - "Clock set to 2026-01-15T12:00:00Z (after 60-day window opens for visit_date 2026-02-15)."
            - "PlatformAdmin has provisioned: Guest, Restaurant (dining_plan_credit_cost=1, capacity_per_slot=20, character=false), DiningPlan (table_service_credits_initial=10)."
            - "Guest has a ParkSession for visit_date 2026-02-15 in status NOT_STARTED."
            - "Guest has CONFIRMED a Reservation with party_size=4 at restaurant for visit_date 2026-02-15, slot_start_utc=2026-02-15T18:00:00Z. Reservation.credits_held=4. DiningPlan.table_service_credits_held=4, table_service_credits_remaining=10."
            - "Guest then patched party_size to 2 (POST /reservations/{id}/party-size). After patch: Reservation.credits_held=2; DiningPlan.table_service_credits_held=2."
            - "Clock advanced to 2026-02-15T17:45:00Z (within 15-min grace before slot_start)."
            - "ParkSession activated."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/guests"
              payload: { email: "g_dv1@x.com", full_name: "DV1 Guest", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/restaurants"
              payload: { name: "Le Cellier", park_code: "EPCOT", capacity_per_slot: 20, slot_minutes: 30, is_character_dining: false, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_id}", tier: "PLUS", table_service_credits_initial: 10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_id}", park_code: "EPCOT", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { ps_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_id}", restaurant_id: "${r_id}", park_session_id: "${ps_id}", dining_plan_id: "${dp_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 4 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
            - call: "POST /v1/reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /v1/reservations/${res_id}/party-size"
              payload: { party_size: 2 }
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T17:45:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/park-sessions/${ps_id}/activate"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /v1/reservations/${res_id}/check-in"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
          assert:
            - "Reservation.${res_id}.status == 'CHECKED_IN'"
            - "Reservation.${res_id}.credits_debited == 2"
            - "Reservation.${res_id}.credits_held == 0"
            - "DiningPlan.${dp_id}.table_service_credits_remaining == 8"
            - "DiningPlan.${dp_id}.table_service_credits_held == 0"
            - "CreditLedgerEntry exists with entry_type='DEBIT', dining_plan_id='${dp_id}', reservation_id='${res_id}', credits_delta=2"

      - name: lightning_lane_fee_per_seat_round_vs_sum_round_diverges
        grounds:
          - calculations.lightning_lane_addon_fee
          - state_machines.LightningLaneAddOn.REQUESTED_to_ALLOCATED
          - endpoints.POST_/v1/lightning-lane-addons/{id}/allocate
          - entities.LightningLaneAddOn.fields.fee_cents
        distinguishing_aspect: |
          PINNED ordering (round per-seat then × party_size) and the FORBIDDEN alternative
          (sum × party_size × multiplier then round once) diverge by 1 cent for a
          MULTI_PASS EPCOT non-character party_size=3 booking: PINNED → 8064, FORBIDDEN → 8063.
          The persisted fee_cents MUST equal 8064 — a result of 8063 proves the implementation
          rounds in the wrong order. Different entity domain from instance 1 (LightningLaneAddOn
          vs DiningPlan).
        test_recipe:
          setup:
            - "Clock at 2026-01-15T12:00:00Z."
            - "Restaurant in EPCOT, non-character, capacity_per_slot=20, dining_plan_credit_cost=1."
            - "DiningPlan with 10 credits."
            - "Reservation CONFIRMED with party_size=3 at slot_start_utc=2026-02-15T18:00:00Z."
            - "LightningLaneAddOn created (status=REQUESTED) for the reservation."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/guests"
              payload: { email: "g_dv2@x.com", full_name: "DV2 Guest", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/restaurants"
              payload: { name: "Garden Grill", park_code: "EPCOT", capacity_per_slot: 20, slot_minutes: 30, is_character_dining: false, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_id}", tier: "PLUS", table_service_credits_initial: 10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_id}", park_code: "EPCOT", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { ps_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_id}", restaurant_id: "${r_id}", park_session_id: "${ps_id}", dining_plan_id: "${dp_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 3 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id, res_v_pre: $.data.version }
            - call: "POST /v1/reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_v_after_confirm: $.data.version }
            - call: "POST /v1/lightning-lane-addons"
              payload: { reservation_id: "${res_id}", tier: "MULTI_PASS" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { ll_id: $.data.id }
          trigger:
            - call: "POST /v1/lightning-lane-addons/${ll_id}/allocate"
              payload: { expected_reservation_version: "${res_v_after_confirm}" }
              as: Guest
              as_user_id: "${g_id}"
          assert:
            - "LightningLaneAddOn.${ll_id}.status == 'ALLOCATED'"
            - "LightningLaneAddOn.${ll_id}.fee_cents == 8064"
            - "LightningLaneAddOn.${ll_id}.redemption_window_end_utc == '2026-02-15T19:30:00Z'"

  # =========================================================================
  # Rule 2 — combinatorial formulas across different modes (a + b)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: lightning_lane_fee_tier_park_character_combinatorial_mode_a
        grounds:
          - calculations.lightning_lane_addon_fee
          - state_machines.LightningLaneAddOn.REQUESTED_to_ALLOCATED
          - endpoints.POST_/v1/lightning-lane-addons/{id}/allocate
          - entities.Restaurant.fields.park_code
          - entities.Restaurant.fields.is_character_dining
        distinguishing_aspect: |
          Mode (a): formula has 4 inputs (tier, park_code, is_character_dining, party_size)
          with non-linear interaction — tier lookup, park multiplier, conditional character
          uplift branch, then party-size multiply. SINGLE_PASS × MAGIC_KINGDOM × character ×
          party_size=4 = (1500 + 500) * 1.175 = 2350.0 → 2350 per_seat → 9400 fee.
        test_recipe:
          setup:
            - "Clock at 2026-01-15T12:00:00Z."
            - "Restaurant in MAGIC_KINGDOM, is_character_dining=true, capacity_per_slot=20."
            - "Reservation CONFIRMED with party_size=4 at slot_start_utc=2026-02-15T18:00:00Z."
            - "LightningLaneAddOn created with tier='SINGLE_PASS' (status=REQUESTED)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/guests"
              payload: { email: "g_cf1@x.com", full_name: "CF1 Guest", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/restaurants"
              payload: { name: "Cinderella Royal Table", park_code: "MAGIC_KINGDOM", capacity_per_slot: 20, slot_minutes: 30, is_character_dining: true, dining_plan_credit_cost: 2, no_show_base_fee_cents: 2500, opening_local_time: "08:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_id}", tier: "DELUXE", table_service_credits_initial: 20, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_id}", park_code: "MAGIC_KINGDOM", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { ps_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_id}", restaurant_id: "${r_id}", park_session_id: "${ps_id}", dining_plan_id: "${dp_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 4 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
            - call: "POST /v1/reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_v: $.data.version }
            - call: "POST /v1/lightning-lane-addons"
              payload: { reservation_id: "${res_id}", tier: "SINGLE_PASS" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { ll_id: $.data.id }
          trigger:
            - call: "POST /v1/lightning-lane-addons/${ll_id}/allocate"
              payload: { expected_reservation_version: "${res_v}" }
              as: Guest
              as_user_id: "${g_id}"
          assert:
            - "LightningLaneAddOn.${ll_id}.fee_cents == 9400"
            - "LightningLaneAddOn.${ll_id}.status == 'ALLOCATED'"

      - name: no_show_fee_nested_rounding_per_seat_first_mode_b
        grounds:
          - calculations.no_show_fee_amount
          - state_machines.Reservation.CONFIRMED_to_NO_SHOW
          - endpoints.POST_/v1/reservations/{id}/mark-no-show
          - entities.NoShowFeeAssessment.fields.total_amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — per-seat rounding FIRST then × party_size.
          Setup: base=2750, non-character, party_size=2, second-strike guest (strike_after=2 →
          tier2 multiplier 1.075). PINNED: round_half_up(2750 * 1.075)=round(2956.25)=2956 per
          seat → total 5912. FORBIDDEN (sum then round): round(2750 * 2 * 1.075)=round(5912.5)
          =5913. The assessment.total_amount_cents MUST equal 5912 — divergence from instance 1
          which is mode (a) tiered-rate selection.
        test_recipe:
          setup:
            - "Clock at 2026-01-15T12:00:00Z."
            - "Restaurant with no_show_base_fee_cents=2750, is_character_dining=false."
            - "Guest with no_show_strike_count=1 (one prior NO_SHOW), so the new NO_SHOW makes strike_after=2 → tier2 multiplier 1.075."
            - "Reservation CONFIRMED with party_size=2; slot_end_utc has elapsed at trigger time."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/guests"
              payload: { email: "g_cf2@x.com", full_name: "CF2 Guest", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/restaurants"
              payload: { name: "Liberty Tree", park_code: "MAGIC_KINGDOM", capacity_per_slot: 20, slot_minutes: 30, is_character_dining: false, dining_plan_credit_cost: 1, no_show_base_fee_cents: 2750, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_id}", tier: "STANDARD", table_service_credits_initial: 10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_id}", park_code: "MAGIC_KINGDOM", visit_date: "2026-02-14" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { ps_prior_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_id}", restaurant_id: "${r_id}", park_session_id: "${ps_prior_id}", dining_plan_id: "${dp_id}", slot_start_utc: "2026-02-14T18:00:00Z", party_size: 1 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_prior_id: $.data.id }
            - call: "POST /v1/reservations/${res_prior_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-14T19:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/reservations/${res_prior_id}/mark-no-show"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_id}", park_code: "MAGIC_KINGDOM", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { ps_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_id}", restaurant_id: "${r_id}", park_session_id: "${ps_id}", dining_plan_id: "${dp_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 2 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
            - call: "POST /v1/reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T19:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/reservations/${res_id}/mark-no-show"
              payload: {}
              as: PlatformAdmin
              captures: { res_v_after: $.data.version }
            - call: "GET /v1/no-show-fee-assessments"
              payload: {}
              as: PlatformAdmin
              captures: { assessments_list: $.data }
          assert:
            - "Reservation.${res_id}.status == 'NO_SHOW'"
            - "Guest.${g_id}.no_show_strike_count == 2"
            - "A NoShowFeeAssessment exists with reservation_id=${res_id}, base_amount_cents=5500, character_surcharge_cents=0, repeat_offender_multiplier=1.075, total_amount_cents=5912"

  # =========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_branching_confirmed_to_cancelled_vs_no_show_divergent_side_effects
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.Reservation.CONFIRMED_to_NO_SHOW
          - state_machines.Reservation.CONFIRMED_to_CHECKED_IN
          - endpoints.POST_/v1/reservations/{id}/cancel
          - endpoints.POST_/v1/reservations/{id}/mark-no-show
        distinguishing_aspect: |
          Reservation CONFIRMED branches into three non-overlapping next-states
          (CHECKED_IN, CANCELLED, NO_SHOW) with DIVERGENT side-effect sets: CANCELLED
          releases credits but does NOT increment strike count or create
          NoShowFeeAssessment; NO_SHOW releases credits AND increments
          Guest.no_show_strike_count AND creates a NoShowFeeAssessment AND cascades
          AllergyMeal→DECLINED. The fork-join structure with divergent side effects
          makes the machine non-linear. Tested by branching one reservation into
          CANCELLED.
        test_recipe:
          setup:
            - "Clock at 2026-01-15T12:00:00Z."
            - "Reservation CONFIRMED with party_size=2; held_credits=2; current time well before slot_start_utc (free-cancel window applies)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/guests"
              payload: { email: "g_nl1@x.com", full_name: "NL1 Guest", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/restaurants"
              payload: { name: "Be Our Guest", park_code: "MAGIC_KINGDOM", capacity_per_slot: 20, slot_minutes: 30, is_character_dining: false, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_id}", tier: "STANDARD", table_service_credits_initial: 10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_id}", park_code: "MAGIC_KINGDOM", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { ps_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_id}", restaurant_id: "${r_id}", park_session_id: "${ps_id}", dining_plan_id: "${dp_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 2 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
            - call: "POST /v1/reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_v_after_confirm: $.data.version }
          trigger:
            - call: "POST /v1/reservations/${res_id}/cancel"
              payload: { expected_reservation_version: "${res_v_after_confirm}" }
              as: Guest
              as_user_id: "${g_id}"
          assert:
            - "Reservation.${res_id}.status == 'CANCELLED'"
            - "Reservation.${res_id}.credits_held == 0"
            - "DiningPlan.${dp_id}.table_service_credits_held == 0"
            - "DiningPlan.${dp_id}.table_service_credits_remaining == 10"
            - "Guest.${g_id}.no_show_strike_count == 0"
            - "No NoShowFeeAssessment exists for reservation_id=${res_id}"
            - "CreditLedgerEntry exists with entry_type='RELEASE', dining_plan_id='${dp_id}', reservation_id='${res_id}', credits_delta=-2"

      - name: allergy_meal_revert_cycle_acknowledged_to_requested
        grounds:
          - state_machines.AllergyMeal.ACKNOWLEDGED_to_REQUESTED
          - state_machines.AllergyMeal.REQUESTED_to_ACKNOWLEDGED
          - endpoints.POST_/v1/allergy-meals/{id}/revert-to-requested
          - endpoints.POST_/v1/allergy-meals/{id}/acknowledge
        distinguishing_aspect: |
          AllergyMeal state machine is cyclic: ACKNOWLEDGED can revert to REQUESTED, and
          REQUESTED can re-advance to ACKNOWLEDGED, forming an A→B→A loop. Different entity
          from the Reservation in instance 1. Sequence acknowledge → revert → acknowledge
          is allowed; status returns to ACKNOWLEDGED with version incremented twice from the
          first ACK.
        test_recipe:
          setup:
            - "Clock at 2026-01-15T12:00:00Z."
            - "Reservation CONFIRMED with attached AllergyMeal in status REQUESTED."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/guests"
              payload: { email: "g_nl2@x.com", full_name: "NL2 Guest", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/restaurants"
              payload: { name: "Akershus Royal", park_code: "EPCOT", capacity_per_slot: 20, slot_minutes: 30, is_character_dining: true, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "08:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_id}", tier: "STANDARD", table_service_credits_initial: 10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_id}", park_code: "EPCOT", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_id}"
