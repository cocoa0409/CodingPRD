          - errors.ERR_TEST_RESULT_NOT_PASS
        distinguishing_aspect: "A run whose result is FAIL cannot be reviewed ACCEPT (409 ERR_TEST_RESULT_NOT_PASS); the same run reviewed REJECT transitions fine — the gate keys on the computed result, not the reviewer's intent."
        test_recipe:
          setup:
            - "Logical clock 2026-10-05T00:00:00Z; family TESTING; one run COMPLETED with adjusted NOx 0.40 > 0.35 (result FAIL)."
          setup_api_calls:
            - *k_clock0
            - *k_std
            - *k_std_pub
            - *k_fam
            - *k_spec
            - *k_cal
            - *k_act
