            - call: "POST /dairy/tanker-receipts/${r2}/lab-tests"
              payload: { test_type: "SCC", result_value: 749999, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { r2_scc: $.data.id }
            - call: "POST /dairy/tanker-receipts/${r2}/lab-tests/${r2_ab}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /dairy/tanker-receipts/${r2}/lab-tests/${r2_scc}/complete"
              payload: {}
              as: LabTechnician
          trigger:
            - call: "GET /dairy/producers/${prod_id}"
              as: PlantController
              captures: { prod_v_6: "$.data.version" }
            - call: "POST /dairy/tanker-receipts/${r1}/release"
              payload: { expected_producer_version: "${prod_v_6}" }
              as: QualityAssuranceManager
              captures: { r1_err: $.data.error_id }
            - call: "GET /dairy/producers/${prod_id}"
              as: PlantController
              captures: { prod_v_7: "$.data.version" }
            - call: "POST /dairy/tanker-receipts/${r2}/release"
              payload: { expected_producer_version: "${prod_v_7}" }
              as: QualityAssuranceManager
              captures: { r2_disp: $.data.disposition }
          assert:
            - "R1 (SCC=750000) → HTTP 422 ERR_SCC_EXCEEDED (>= boundary triggers rejection)"
            - "R2 (SCC=749999) → HTTP 200, disposition == RELEASED_FOR_PROCESSING"

      - name: hauling_tier1_cwt_boundary
        grounds:
          - calculations.producer_provisional_settlement_calc
        distinguishing_aspect: |
          Hauling tier threshold at exactly TIER1_CWT=1000: 1000 cwt uses base rate
          for ALL volume; 1001 cwt crosses into tier 2 discount on the 1-cwt overflow.
          Metric: total hundredweight (distinct from SCC metric in instance 1).
