scaffold_corner_design:
  # =================================================================
  # Table 1 — Entities
  # =================================================================
  - section: entities
    instances:
      - name: create_depot_returns_201_with_fields
        claim_type: creation
        grounds: [entities.Depot, endpoints]
        distinguishing_aspect: "POST /fleet/depots with all required fields returns 201; response data carries id, version==1, reserved_load_kw==0, reimbursement_committed_cents==0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
          assert:
            - "response_type == object, HTTP 201"
            - "Depot.${d_id}.version == 1"
            - "Depot.${d_id}.reserved_load_kw == 0"
            - "Depot.${d_id}.reimbursement_committed_cents == 0"

      - name: get_depot_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["entities.Depot", "errors[ERR_DEPOT_NOT_FOUND]"]
        distinguishing_aspect: "GET /fleet/depots/{unknown-uuid} returns ERR_DEPOT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /fleet/depots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DEPOT_NOT_FOUND (HTTP 404)"

      - name: create_charger_missing_connector_returns_validation
        claim_type: required_field
        grounds: ["entities.Charger", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /fleet/chargers omitting required connector_type returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Depot D exists."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "C1", max_power_kw: 150 }
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION (HTTP 422)"

      - name: create_charger_unknown_depot_returns_not_found
        claim_type: parent_relationship
        grounds: ["entities.Charger.fields.depot_id", "errors[ERR_DEPOT_NOT_FOUND]"]
        distinguishing_aspect: "FK integrity: POST /fleet/chargers with a non-existent depot_id returns ERR_DEPOT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /fleet/chargers"
              payload: { depot_id: "00000000-0000-4000-8000-000000000000", name: "C1", connector_type: "CCS", max_power_kw: 150 }
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DEPOT_NOT_FOUND (HTTP 404)"

      - name: telemetry_updates_soc_and_flips_readiness_ready
        claim_type: computed_field
        grounds: [entities.Vehicle.fields.readiness_status, calculations.vehicle_readiness, entities.Vehicle.fields.current_soc_pct]
        distinguishing_aspect: "derived_field_reconciliation: a telemetry reading of soc 90 overwrites Vehicle.current_soc_pct and recomputes readiness_status to READY (was NOT_READY at soc 50)."
        test_recipe:
          setup: ["Depot D; Vehicle V SOC 50 (NOT_READY)."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "V", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 50 }
              as: FleetManager
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /fleet/vehicles/${v_id}/telemetry"
              payload: { soc_pct: 90, odometer_km: 12000 }
              as: DepotOperator
              captures: { tr_id: $.data.id }
          assert:
            - "Vehicle.${v_id}.current_soc_pct == 90"
            - "Vehicle.${v_id}.odometer_km == 12000"
            - "Vehicle.${v_id}.readiness_status == READY"

      - name: list_telemetry_reverse_reachability
        claim_type: retrieval
        grounds: [entities.TelemetryReading.fields.vehicle_id, endpoints]
        distinguishing_aspect: "GET /fleet/vehicles/{id}/telemetry returns the vehicle's readings (cascade-created child discovered via reverse-reachability sub-resource)."
        test_recipe:
          setup: ["Depot D; Vehicle V; one telemetry reading ingested."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "V", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 50 }
              as: FleetManager
              captures: { v_id: $.data.id }
            - call: "POST /fleet/vehicles/${v_id}/telemetry"
              payload: { soc_pct: 60, odometer_km: 100 }
              as: DepotOperator
          trigger:
            - call: "GET /fleet/vehicles/${v_id}/telemetry"
              payload: {}
              as: FleetManager
          assert:
            - "response_type == array with total_count == 1 and one reading for vehicle ${v_id}"

  # =================================================================
  # Table 2 — State machines (invalid transitions, terminal lockdown)
  # =================================================================
  - section: state_machines
    instances:
      - name: complete_scheduled_session_returns_not_active
        claim_type: invalid_transition
        grounds: ["state_machines.ChargeSession.ACTIVE_to_COMPLETED", "errors[ERR_SESSION_NOT_ACTIVE]"]
        distinguishing_aspect: "Completing a session still in SCHEDULED (never started) returns ERR_SESSION_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["Depot D; Charger C1; Vehicle V; Session S SCHEDULED (not started)."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "C1", connector_type: "CCS", max_power_kw: 150 }
              as: FleetManager
              captures: { c_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "V", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 40 }
              as: FleetManager
              captures: { v_id: $.data.id }
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${c_id}", vehicle_id: "${v_id}", scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T11:00:00Z", target_soc_pct: 80, power_kw: 100, expected_depot_version: "${d_v}" }
              as: DepotOperator
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /fleet/charge-sessions/${s_id}/complete"
              payload: { end_soc_pct: 80 }
              as: DepotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SESSION_NOT_ACTIVE (HTTP 409)"

      - name: cancel_completed_session_terminal_lockdown_returns_not_scheduled
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.ChargeSession.SCHEDULED_to_CANCELLED", "errors[ERR_SESSION_NOT_SCHEDULED]"]
        distinguishing_aspect: "Cancelling a COMPLETED (terminal) session returns ERR_SESSION_NOT_SCHEDULED (409); no side effects."
        test_recipe:
          setup: ["Depot D; Charger; Vehicle SOC 50; Session scheduled->started->completed (end_soc 60)."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "C1", connector_type: "CCS", max_power_kw: 150 }
              as: FleetManager
              captures: { c_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "V", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 50 }
              as: FleetManager
              captures: { v_id: $.data.id }
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${c_id}", vehicle_id: "${v_id}", scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T11:00:00Z", target_soc_pct: 60, power_kw: 100, expected_depot_version: "${d_v}" }
              as: DepotOperator
              captures: { s_id: $.data.id }
            - call: "POST /fleet/charge-sessions/${s_id}/start"
              payload: { actual_start: "2026-05-10T10:00:00Z" }
              as: DepotOperator
            - call: "POST /fleet/charge-sessions/${s_id}/complete"
              payload: { end_soc_pct: 60, actual_end: "2026-05-10T11:00:00Z" }
              as: DepotOperator
          trigger:
            - call: "POST /fleet/charge-sessions/${s_id}/cancel"
              payload: {}
              as: DepotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SESSION_NOT_SCHEDULED (HTTP 409)"

      - name: workorder_open_to_resolved_skip_returns_invalid_transition
        claim_type: invalid_transition
        grounds: ["state_machines.MaintenanceWorkOrder", "errors[ERR_WORK_ORDER_INVALID_TRANSITION]"]
        distinguishing_aspect: "Transitioning a work order OPEN->RESOLVED (skipping IN_PROGRESS) returns ERR_WORK_ORDER_INVALID_TRANSITION (409)."
        test_recipe:
          setup: ["Depot D; Charger C1; charger work order OPEN."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "C1", connector_type: "CCS", max_power_kw: 150 }
              as: FleetManager
              captures: { c_id: $.data.id }
            - call: "POST /fleet/work-orders"
              payload: { asset_type: "CHARGER", charger_id: "${c_id}", issue: "x", severity: "LOW" }
              as: MaintenanceTech
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /fleet/work-orders/${wo_id}/transition"
              payload: { target_status: "RESOLVED" }
              as: MaintenanceTech
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WORK_ORDER_INVALID_TRANSITION (HTTP 409)"

      - name: unassign_planned_route_returns_not_assigned
        claim_type: invalid_transition
        grounds: ["state_machines.RouteAssignment.ASSIGNED_to_PLANNED", "errors[ERR_ROUTE_NOT_ASSIGNED]"]
        distinguishing_aspect: "Unassigning a route still in PLANNED (never assigned) returns ERR_ROUTE_NOT_ASSIGNED (409)."
        test_recipe:
          setup: ["Depot D; Vehicle V; Driver DR; Route R PLANNED."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "V", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 90 }
              as: FleetManager
              captures: { v_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { depot_id: "${d_id}", name: "DR", email: "dr@x.com", home_tariff_cents_per_kwh: 15 }
              as: FleetManager
              captures: { dr_id: $.data.id }
            - call: "POST /fleet/route-assignments"
              payload: { depot_id: "${d_id}", vehicle_id: "${v_id}", driver_id: "${dr_id}", route_name: "R", distance_km: 100, required_soc_pct: 80, scheduled_departure: "2026-05-12T06:00:00Z" }
              as: DepotOperator
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /fleet/route-assignments/${r_id}/unassign"
              payload: {}
              as: DepotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ROUTE_NOT_ASSIGNED (HTTP 409)"

      - name: pay_draft_invoice_returns_not_issued
        claim_type: invalid_transition
        grounds: ["state_machines.Invoice.ISSUED_to_PAID", "errors[ERR_INVOICE_NOT_ISSUED]"]
        distinguishing_aspect: "Paying a DRAFT invoice (never issued) returns ERR_INVOICE_NOT_ISSUED (409)."
        test_recipe:
          setup: ["Depot D; a DRAFT invoice for an empty month."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id }
            - call: "POST /fleet/invoices"
              payload: { depot_id: "${d_id}", period_month: "2026-05" }
              as: FleetManager
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /fleet/invoices/${inv_id}/pay"
              payload: {}
              as: FinanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVOICE_NOT_ISSUED (HTTP 409)"

      - name: review_already_approved_claim_returns_not_submitted
        claim_type: invalid_transition
        grounds: ["state_machines.ReimbursementClaim.SUBMITTED_to_APPROVED", "errors[ERR_CLAIM_NOT_SUBMITTED]"]
        distinguishing_aspect: "Reviewing a claim already APPROVED returns ERR_CLAIM_NOT_SUBMITTED (409)."
        test_recipe:
          setup: ["Depot D; Driver DR; claim submitted then approved."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/drivers"
              payload: { depot_id: "${d_id}", name: "DR", email: "dr@x.com", home_tariff_cents_per_kwh: 15 }
              as: FleetManager
              captures: { dr_id: $.data.id }
            - call: "POST /fleet/reimbursement-claims"
              payload: { driver_id: "${dr_id}", depot_id: "${d_id}", period_month: "2026-05", kwh_claimed: 100, odometer_start: 1000, odometer_end: 1500, expected_depot_version: "${d_v}" }
              as: Driver
              as_user_id: "${dr_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /fleet/reimbursement-claims/${claim_id}/review"
              payload: { decision: "APPROVE", metered_kwh_verified: 90 }
              as: FinanceManager
          trigger:
            - call: "POST /fleet/reimbursement-claims/${claim_id}/review"
              payload: { decision: "APPROVE", metered_kwh_verified: 80 }
              as: FinanceManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CLAIM_NOT_SUBMITTED (HTTP 409)"

  # =================================================================
  # Table 4 — Validations (single-rule violation → error)
  # =================================================================
  - section: validations
    instances:
      - name: schedule_connector_mismatch_returns_incompatible
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_CONNECTOR_INCOMPATIBLE]"]
        distinguishing_aspect: "Scheduling a CCS charger for a CHADEMO vehicle returns ERR_CONNECTOR_INCOMPATIBLE (422)."
        test_recipe:
          setup: ["Depot D; Charger C1 CCS; Vehicle V CHADEMO."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "C1", connector_type: "CCS", max_power_kw: 150 }
              as: FleetManager
              captures: { c_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "V", connector_type: "CHADEMO", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 40 }
              as: FleetManager
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${c_id}", vehicle_id: "${v_id}", scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T11:00:00Z", target_soc_pct: 80, power_kw: 100, expected_depot_version: "${d_v}" }
              as: DepotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CONNECTOR_INCOMPATIBLE (HTTP 422)"

      - name: schedule_power_exceeds_charger_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_POWER_EXCEEDS_CHARGER]"]
        distinguishing_aspect: "Scheduling power_kw 200 on a 150kW charger returns ERR_POWER_EXCEEDS_CHARGER (422)."
        test_recipe:
          setup: ["Depot D; Charger C1 max 150; Vehicle V CCS."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 1000, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "C1", connector_type: "CCS", max_power_kw: 150 }
              as: FleetManager
              captures: { c_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "V", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 40 }
              as: FleetManager
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${c_id}", vehicle_id: "${v_id}", scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T11:00:00Z", target_soc_pct: 80, power_kw: 200, expected_depot_version: "${d_v}" }
              as: DepotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_POWER_EXCEEDS_CHARGER (HTTP 422)"

      - name: claim_submit_over_budget_returns_exceeded
        claim_type: aggregate_validation
        grounds: ["validations[priority=11]", "errors[ERR_REIMBURSEMENT_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "A claim whose estimated amount (200kWh*15=3000c) exceeds the depot's remaining budget (2000c) returns ERR_REIMBURSEMENT_BUDGET_EXCEEDED (409)."
        test_recipe:
          setup: ["Depot D budget 2000c; Driver DR tariff 15."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 2000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/drivers"
              payload: { depot_id: "${d_id}", name: "DR", email: "dr@x.com", home_tariff_cents_per_kwh: 15 }
              as: FleetManager
              captures: { dr_id: $.data.id }
          trigger:
            - call: "POST /fleet/reimbursement-claims"
              payload: { driver_id: "${dr_id}", depot_id: "${d_id}", period_month: "2026-05", kwh_claimed: 200, odometer_start: 1000, odometer_end: 2000, expected_depot_version: "${d_v}" }
              as: Driver
              as_user_id: "${dr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REIMBURSEMENT_BUDGET_EXCEEDED (HTTP 409)"

      - name: duplicate_invoice_same_period_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_DUPLICATE_INVOICE]"]
        distinguishing_aspect: "Generating a second invoice for the same (depot, 2026-05) returns ERR_DUPLICATE_INVOICE (409)."
        test_recipe:
          setup: ["Depot D; an invoice already generated for 2026-05."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id }
            - call: "POST /fleet/invoices"
              payload: { depot_id: "${d_id}", period_month: "2026-05" }
              as: FleetManager
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /fleet/invoices"
              payload: { depot_id: "${d_id}", period_month: "2026-05" }
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_INVOICE (HTTP 409)"

      - name: workorder_asset_type_id_mismatch_returns_invalid
        claim_type: conditional_validation
        grounds: ["validations[priority=4]", "errors[ERR_ASSET_TARGET_INVALID]"]
        distinguishing_aspect: "Opening a work order with asset_type CHARGER but supplying vehicle_id (and no charger_id) returns ERR_ASSET_TARGET_INVALID (422)."
        test_recipe:
          setup: ["Depot D; Vehicle V."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "V", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 40 }
              as: FleetManager
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /fleet/work-orders"
              payload: { asset_type: "CHARGER", vehicle_id: "${v_id}", issue: "x", severity: "LOW" }
              as: MaintenanceTech
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ASSET_TARGET_INVALID (HTTP 422)"

      - name: assign_soc_one_below_required_returns_below_requirement
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_SOC_BELOW_ROUTE_REQUIREMENT]"]
        distinguishing_aspect: "Failing twin of the SOC boundary: current_soc 89 < required 90 returns ERR_SOC_BELOW_ROUTE_REQUIREMENT (409), while readiness (89>=80) passes."
        test_recipe:
          setup: ["Depot D; Vehicle V SOC 89 IN_SERVICE (READY); Driver DR; Route R required_soc 90."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "V", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 89 }
              as: FleetManager
              captures: { v_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { depot_id: "${d_id}", name: "DR", email: "dr@x.com", home_tariff_cents_per_kwh: 15 }
              as: FleetManager
              captures: { dr_id: $.data.id }
            - call: "POST /fleet/route-assignments"
              payload: { depot_id: "${d_id}", vehicle_id: "${v_id}", driver_id: "${dr_id}", route_name: "R", distance_km: 100, required_soc_pct: 90, scheduled_departure: "2026-05-12T06:00:00Z" }
              as: DepotOperator
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /fleet/route-assignments/${r_id}/assign"
              payload: {}
              as: DepotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SOC_BELOW_ROUTE_REQUIREMENT (HTTP 409)"

      - name: schedule_capacity_over_by_one_returns_exceeded
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DEPOT_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "Failing twin of the capacity boundary: reserved 400 + new 101 == 501 > max_load 500 returns ERR_DEPOT_CAPACITY_EXCEEDED (409)."
        test_recipe:
          setup: ["Depot D max_load 500; Session A power 400 SCHEDULED (reserved 400)."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 500, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "CA", connector_type: "CCS", max_power_kw: 500 }
              as: FleetManager
              captures: { ca_id: $.data.id }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "CB", connector_type: "CCS", max_power_kw: 500 }
              as: FleetManager
              captures: { cb_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "VA", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 20 }
              as: FleetManager
              captures: { va_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "VB", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 20 }
              as: FleetManager
              captures: { vb_id: $.data.id }
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${ca_id}", vehicle_id: "${va_id}", scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T12:00:00Z", target_soc_pct: 50, power_kw: 400, expected_depot_version: "${d_v}" }
              as: DepotOperator
              captures: { sa_id: $.data.id }
            - call: "GET /fleet/depots/${d_id}"
              payload: {}
              as: FleetManager
              captures: { d_v2: $.data.version }
          trigger:
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${cb_id}", vehicle_id: "${vb_id}", scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T12:00:00Z", target_soc_pct: 50, power_kw: 101, expected_depot_version: "${d_v2}" }
              as: DepotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DEPOT_CAPACITY_EXCEEDED (HTTP 409)"

  # =================================================================
  # Table 7 — RBAC + SoD
  # =================================================================
  - section: rbac
    instances:
      - name: depot_create_by_depotoperator_returns_unauthorized
        claim_type: unauthorized
        grounds: ["roles", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A DepotOperator calling POST /fleet/depots (FleetManager-exclusive) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: DepotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED (HTTP 403)"

      - name: claim_submit_for_other_driver_returns_unauthorized
        claim_type: unauthorized
        grounds: ["roles", "entities.ReimbursementClaim.fields.driver_id", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Driver (X-User-ID = DR2) submitting a claim whose driver_id = DR1 returns ERR_UNAUTHORIZED (403) — entity_backed ownership check."
        test_recipe:
          setup: ["Depot D; Drivers DR1 and DR2."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/drivers"
              payload: { depot_id: "${d_id}", name: "DR1", email: "dr1@x.com", home_tariff_cents_per_kwh: 15 }
              as: FleetManager
              captures: { dr1_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { depot_id: "${d_id}", name: "DR2", email: "dr2@x.com", home_tariff_cents_per_kwh: 15 }
              as: FleetManager
              captures: { dr2_id: $.data.id }
          trigger:
            - call: "POST /fleet/reimbursement-claims"
              payload: { driver_id: "${dr1_id}", depot_id: "${d_id}", period_month: "2026-05", kwh_claimed: 10, odometer_start: 1000, odometer_end: 1100, expected_depot_version: "${d_v}" }
              as: Driver
              as_user_id: "${dr2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED (HTTP 403)"

      - name: missing_headers_returns_unauthenticated
        claim_type: unauthorized
        grounds: ["roles", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers returns ERR_UNAUTHENTICATED (401). (Harness omits headers; `as` shown for endpoint resolution only.)"
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /fleet/depots"
              payload: {}
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED (HTTP 401)"

      - name: claim_pay_by_approver_returns_segregation_of_duties
        claim_type: segregation_of_duties
        grounds: ["validations[priority=12]", "state_machines.ReimbursementClaim.APPROVED_to_PAID", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The same FinanceManager user (fin-1) that APPROVED the claim then PAYs it: payer X-User-ID == approved_by_user_id returns ERR_SEGREGATION_OF_DUTIES (403)."
        test_recipe:
          setup: ["Depot D; Driver DR; claim submitted, approved by finance user 'fin-1'."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/drivers"
              payload: { depot_id: "${d_id}", name: "DR", email: "dr@x.com", home_tariff_cents_per_kwh: 15 }
              as: FleetManager
              captures: { dr_id: $.data.id }
            - call: "POST /fleet/reimbursement-claims"
              payload: { driver_id: "${dr_id}", depot_id: "${d_id}", period_month: "2026-05", kwh_claimed: 100, odometer_start: 1000, odometer_end: 1500, expected_depot_version: "${d_v}" }
              as: Driver
              as_user_id: "${dr_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /fleet/reimbursement-claims/${claim_id}/review"
              payload: { decision: "APPROVE", metered_kwh_verified: 100 }
              as: FinanceManager
              as_user_id: "fin-1"
          trigger:
            - call: "POST /fleet/reimbursement-claims/${claim_id}/pay"
              payload: {}
              as: FinanceManager
              as_user_id: "fin-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SEGREGATION_OF_DUTIES (HTTP 403)"

      - name: claim_pay_by_different_finance_user_succeeds
        claim_type: segregation_of_duties
        grounds: [state_machines.ReimbursementClaim.APPROVED_to_PAID, entities.ReimbursementClaim.fields.status]
        distinguishing_aspect: "Positive SoD path: approver 'fin-1', payer 'fin-2' (different X-User-ID) => claim transitions to PAID and committed released to 0."
        test_recipe:
          setup: ["Depot D; Driver DR; claim submitted, approved by 'fin-1'."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/drivers"
              payload: { depot_id: "${d_id}", name: "DR", email: "dr@x.com", home_tariff_cents_per_kwh: 15 }
              as: FleetManager
              captures: { dr_id: $.data.id }
            - call: "POST /fleet/reimbursement-claims"
              payload: { driver_id: "${dr_id}", depot_id: "${d_id}", period_month: "2026-05", kwh_claimed: 100, odometer_start: 1000, odometer_end: 1500, expected_depot_version: "${d_v}" }
              as: Driver
              as_user_id: "${dr_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /fleet/reimbursement-claims/${claim_id}/review"
              payload: { decision: "APPROVE", metered_kwh_verified: 100 }
              as: FinanceManager
              as_user_id: "fin-1"
          trigger:
            - call: "POST /fleet/reimbursement-claims/${claim_id}/pay"
              payload: {}
              as: FinanceManager
              as_user_id: "fin-2"
          assert:
            - "ReimbursementClaim.${claim_id}.status == PAID"
            - "Depot.${d_id}.reimbursement_committed_cents == 0"

  # =================================================================
  # Cross-Cutting Complexity Layers — optimistic_concurrency
  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: session_create_stale_depot_version_returns_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[session-create-stale-depot]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC: after session A advances Depot.version to 2, a session-create B still carrying expected_depot_version 1 returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Depot D (version 1 captured as d_v); Charger; Vehicles VA/VB. Session A scheduled (Depot.version -> 2)."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 1000, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "CA", connector_type: "CCS", max_power_kw: 150 }
              as: FleetManager
              captures: { ca_id: $.data.id }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "CB", connector_type: "CCS", max_power_kw: 150 }
              as: FleetManager
              captures: { cb_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "VA", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 20 }
              as: FleetManager
              captures: { va_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { depot_id: "${d_id}", vin: "VB", connector_type: "CCS", battery_capacity_kwh: 100, efficiency_kwh_per_km: 0.2, current_soc_pct: 20 }
              as: FleetManager
              captures: { vb_id: $.data.id }
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${ca_id}", vehicle_id: "${va_id}", scheduled_start: "2026-05-10T10:00:00Z", scheduled_end: "2026-05-10T11:00:00Z", target_soc_pct: 50, power_kw: 50, expected_depot_version: "${d_v}" }
              as: DepotOperator
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /fleet/charge-sessions"
              payload: { depot_id: "${d_id}", charger_id: "${cb_id}", vehicle_id: "${vb_id}", scheduled_start: "2026-05-10T12:00:00Z", scheduled_end: "2026-05-10T13:00:00Z", target_soc_pct: 50, power_kw: 50, expected_depot_version: "${d_v}" }
              as: DepotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION (HTTP 412)"

      - name: claim_submit_stale_depot_version_returns_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[claim-submit-stale-depot]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on a different write endpoint: after claim A advances Depot.version to 2, a claim-submit B still carrying expected_depot_version 1 returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Depot D (version 1 as d_v); Driver DR. Claim A submitted (Depot.version -> 2)."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /fleet/drivers"
              payload: { depot_id: "${d_id}", name: "DR", email: "dr@x.com", home_tariff_cents_per_kwh: 15 }
              as: FleetManager
              captures: { dr_id: $.data.id }
            - call: "POST /fleet/reimbursement-claims"
              payload: { driver_id: "${dr_id}", depot_id: "${d_id}", period_month: "2026-05", kwh_claimed: 10, odometer_start: 1000, odometer_end: 1100, expected_depot_version: "${d_v}" }
              as: Driver
              as_user_id: "${dr_id}"
              captures: { claim_a: $.data.id }
          trigger:
            - call: "POST /fleet/reimbursement-claims"
              payload: { driver_id: "${dr_id}", depot_id: "${d_id}", period_month: "2026-06", kwh_claimed: 10, odometer_start: 2000, odometer_end: 2100, expected_depot_version: "${d_v}" }
              as: Driver
              as_user_id: "${dr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION (HTTP 412)"

  # =================================================================
  # Endpoints — pagination/listing
  # =================================================================
  - section: endpoints
    instances:
      - name: list_chargers_pagination_envelope
        claim_type: listing
        grounds: [entities.Charger, endpoints]
        distinguishing_aspect: "GET /fleet/chargers returns an array envelope with pagination fields total_count and has_more; filtering by depot_id scopes the list."
        test_recipe:
          setup: ["Depot D with two chargers."]
          setup_api_calls:
            - call: "POST /fleet/depots"
              payload: { name: "D", max_load_kw: 500, contracted_capacity_kw: 300, demand_rate_cents_per_kw: 1000, overage_rate_cents_per_kw: 2500, reimbursement_budget_cents: 100000, tariff_windows: [{period: FLAT, start_hour_utc: 0, end_hour_utc: 24, rate_cents_per_kwh: 20}] }
              as: FleetManager
              captures: { d_id: $.data.id }
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "CA", connector_type: "CCS", max_power_kw: 150 }
              as: FleetManager
            - call: "POST /fleet/chargers"
              payload: { depot_id: "${d_id}", name: "CB", connector_type: "NACS", max_power_kw: 250 }
              as: FleetManager
          trigger:
            - call: "GET /fleet/chargers?depot_id=${d_id}&limit=1&offset=0"
              payload: {}
              as: FleetManager
          assert:
            - "response_type == array, meta pagination total_count == 2, has_more == true, exactly 1 item returned"

  # =================================================================
  # Excluded — already covered by §1.8 difficulty instances
  # =================================================================
  - section: state_machines
    instances:
      - name: error_charger_time_conflict_on_schedule
        claim_type: violation_to_error
        grounds: ["errors[ERR_CHARGER_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / charger_buffered_halfopen_conflict
          rationale: "ERR_CHARGER_TIME_CONFLICT is asserted as the outcome of the §1.8 charger buffered half-open overlap instance."
      - name: error_vehicle_time_conflict_on_schedule
        claim_type: violation_to_error
        grounds: ["errors[ERR_VEHICLE_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / vehicle_closed_interval_conflict
          rationale: "ERR_VEHICLE_TIME_CONFLICT is asserted as the outcome of the §1.8 vehicle closed-interval overlap instance."
      - name: error_vehicle_not_ready_on_assign
        claim_type: violation_to_error
        grounds: ["errors[ERR_VEHICLE_NOT_READY]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / assign_requires_vehicle_ready
          rationale: "ERR_VEHICLE_NOT_READY is the asserted failure path of the §1.8 readiness cross-entity instance."
      - name: error_charger_down_on_start
        claim_type: violation_to_error
        grounds: ["errors[ERR_CHARGER_DOWN]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / start_requires_charger_operational
          rationale: "ERR_CHARGER_DOWN is the asserted failure path of the §1.8 charger-operational cross-entity instance."
      - name: error_route_not_planned_on_assign
        claim_type: violation_to_error
        grounds: ["errors[ERR_ROUTE_NOT_PLANNED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / assign_state_beats_safety
          rationale: "ERR_ROUTE_NOT_PLANNED is asserted as the winning error of the §1.8 state-vs-safety priority instance."
      - name: session_active_to_interrupted_side_effects
        claim_type: side_effect_execution
        grounds: [state_machines.ChargeSession.ACTIVE_to_INTERRUPTED]
        excluded_because:
          difficulty_instance: transitive_cascade / charger_workorder_interrupts_session_releases_load
          rationale: "The INTERRUPTED transition and its load-release side effect are exercised end-to-end by the §1.8 charger cascade."
