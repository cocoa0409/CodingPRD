scenario: |
  Generate task harder than expert level!

  2577. Product Content Syndication & Digital Shelf Management (brand digital shelf team): product
  information management with attribute taxonomy and completeness scoring by retailer,
  retailer-specific content requirements including image counts, character limits and required
  attributes, syndication distribution with acceptance confirmation and rejection error resolution,
  enhanced content and rich media deployment with retailer approval workflows, digital shelf
  monitoring on search rank, content accuracy, ratings and availability by retailer, out-of-stock
  and unauthorized listing alerts with account team follow-up, content change governance with
  version control and approval routing, performance correlation between content quality and
  conversion

domain_name: product-content-syndication-digital-shelf
api_prefix: /digital-shelf

complexity_profile:
  difficulty_level: expert_plus
  difficulty_note: |
    Calibrated one band above §0.4 Expert on purpose (the scenario asks for harder-than-expert).
    The extra surface is NOT padding: 14 entities are all load-bearing (two junction entities,
    one self-referential version chain, one append-only observation log), and 21 of the 52
    endpoints exist only to satisfy §1.5 FK reverse-reachability and §1.8/§1.9 test-state
    reachability. Density comes from four cross-cutting couplings that every write must respect:
    (1) the same content payload is scored twice by two different inclusion sets
    (declared = latest revision + presence only, certified = pinned revision + retailer char
    limits + approved-media count), (2) feed slots and version pin counts are conserved
    quantities that forward/compensating action pairs must leave undrifted, (3) two different
    interval geometries guard two different resources (half-open pairwise on RetailerListing,
    closed-interval aggregate capacity on Retailer), (4) approval routing forks into two
    independent review tracks whose join decides a four-hop pin/supersede/invalidate cascade.
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval

  entity_topology: graph
  entity_topology_note: |
    RetailerListing is a Product x Retailer junction; RetailerRequirement is a
    Retailer x AttributeDefinition junction (attribute side by natural key); ContentVersion is
    self-referential through supersedes_content_version_id; EnhancedContentDeployment joins three
    aggregates (RetailerListing, ChangeRequest, MediaAsset). No entity is reachable only through a
    single ownership chain, so URL paths are flat collections under the api_prefix rather than a
    nested tree.

  state_machine_shape: cyclic
  state_machine_shape_note: |
    SyndicationJob cycles REJECTED -> QUEUED -> TRANSMITTED -> REJECTED across attempts;
    ChangeRequest forks into two review tracks with a self-loop on the first decision and a join
    on the second; RetailerListing carries two independent state dimensions
    (syndication_state x shelf_state) that evolve from different triggers.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  role_model_note: |
    The ContentAuthor who created a ChangeRequest can never decide it, and the LEGAL track and the
    BRAND track must be decided by two different X-User-IDs. RetailerIntegration is
    entity_backed:Retailer and may only act on resources belonging to its own retailer.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Retailer
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: display name of the retailer account
        constraints: 1..120 chars
      - name: retailer_code
        type: string
        source: input
        description: short uppercase code used on feed transmissions
        constraints: "unique across Retailer; 3..8 chars matching ^[A-Z0-9]+$"
      - name: status
        type: enum
        source: input
        description: onboarding posture of the retailer account
        default: ACTIVE
        constraints: "ACTIVE | PAUSED | OFFBOARDED"
      - name: min_image_count
        type: integer
        source: input
        description: minimum number of APPROVED image-role MediaAssets this retailer demands per product
        default: 1
        constraints: ">= 0"
      - name: feed_slot_capacity
        type: integer
        source: input
        description: total feed slots this retailer will hold reserved at once across all its listings
        default: 10
        constraints: ">= 1"
      - name: max_concurrent_feed_windows
        type: integer
        source: input
        description: how many QUEUED/TRANSMITTED SyndicationJobs of this retailer may have closed windows covering one instant
        default: 2
        constraints: ">= 1"
      - name: enhanced_content_requires_approval
        type: boolean
        source: input
        description: when true a new EnhancedContentDeployment starts PENDING_RETAILER_APPROVAL; when false it starts LIVE
        default: true
      - name: feed_slots_reserved
        type: integer
        source: computed
        description: "sum of slot_count over SyndicationJobs of this retailer's listings in state IN {QUEUED, TRANSMITTED} (calculations.feed_slot_reservation_ledger)"
        default: 0
        constraints: "0 <= feed_slots_reserved <= feed_slot_capacity"

  - name: AttributeDefinition
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: attribute_key
        type: string
        source: input
        description: taxonomy key referenced by RetailerRequirement.attribute_key and ContentAttributeValue.attribute_key
        constraints: "unique across AttributeDefinition; snake_case, 2..40 chars"
      - name: data_type
        type: enum
        source: input
        description: expected payload type of the attribute value
        constraints: "STRING | INTEGER | DECIMAL | ENUM"
      - name: taxonomy_group
        type: enum
        source: input
        description: taxonomy bucket the attribute belongs to
        constraints: "CORE | MARKETING | VARIANT | COMPLIANCE"
      - name: max_chars
        type: integer
        source: input
        description: global taxonomy character ceiling; write-time hard limit for any ContentAttributeValue on this key
        constraints: ">= 1"
      - name: base_weight
        type: number
        source: input
        description: completeness weight used when the retailer requirement supplies no weight_override
        constraints: "> 0, 2 decimal places"
      - name: is_global_required
        type: boolean
        source: input
        description: documentation flag marking house-standard attributes; does not by itself affect scoring
        default: false

  - name: RetailerRequirement
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; the retailer whose content requirement this row expresses"
      - name: attribute_key
        type: string
        source: input
        description: natural key; MUST equal an existing AttributeDefinition.attribute_key
      - name: requirement_level
        type: enum
        source: input
        description: "REQUIRED and RECOMMENDED rows enter the completeness denominator; OPTIONAL rows are excluded from both numerator and denominator"
        constraints: "REQUIRED | RECOMMENDED | OPTIONAL"
      - name: max_chars_override
        type: integer
        source: input
        description: retailer-specific character ceiling used by the certified completeness variant; null means fall back to AttributeDefinition.max_chars
        default: null
        constraints: ">= 1 when present"
      - name: weight_override
        type: number
        source: input
        description: retailer-specific completeness weight; null means fall back to AttributeDefinition.base_weight
        default: null
        constraints: "> 0 when present, 2 decimal places"

  - name: Product
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: sku
        type: string
        source: input
        description: brand-side stock keeping unit
        constraints: "unique across Product; 3..40 chars"
      - name: gtin
        type: string
        source: input
        description: global trade item number printed on the pack
        constraints: 8..14 digits
      - name: category_code
        type: string
        source: input
        description: merchandising category code
      - name: brand_code
        type: string
        source: input
        description: owning brand code inside the portfolio
      - name: status
        type: enum
        source: computed
        description: DRAFT until any ContentVersion of this product reaches PINNED, ACTIVE from then on
        default: DRAFT
        constraints: "DRAFT | ACTIVE"
      - name: shelf_health_index
        type: number
        source: computed
        description: cross-retailer digital shelf health (calculations.shelf_health_index); 0.00 when no listing qualifies
        default: 0.00
        constraints: 0.00..100.00, 2 decimal places
      - name: conversion_lift_pct
        type: number
        source: computed
        description: stored post_pin_window variant of calculations.content_conversion_lift
        default: 0.00
        constraints: 2 decimal places, may be negative
      - name: open_alert_count
        type: integer
        source: computed
        description: "count of ShelfAlerts on this product's listings with state IN {OPEN, ACKNOWLEDGED}"
        default: 0
      - name: governance_flag
        type: enum
        source: computed
        description: "LISTING_RISK when any OPEN/ACKNOWLEDGED alert has alert_type UNAUTHORIZED_LISTING, else CONTENT_AT_RISK when open_alert_count >= 1, else NONE"
        default: NONE
        constraints: "NONE | CONTENT_AT_RISK | LISTING_RISK"
      - name: last_pinned_at
        type: datetime
        source: system
        description: logical-clock instant at which the most recent ContentVersion of this product became PINNED; null before the first pin
        default: null
      - name: last_review_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent ChangeRequest review decision recorded against this product
        default: null

  - name: ContentVersion
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product this content revision describes"
      - name: supersedes_content_version_id
        type: string
        source: input
        description: "FK -> ContentVersion.id; the revision this one is drafted to replace; null on the first revision of a product"
        default: null
      - name: revision_no
        type: integer
        source: computed
        description: 1 + count of ContentVersions already existing for product_id at creation time
        constraints: unique per product_id, starts at 1
      - name: state
        type: enum
        source: computed
        description: version-control lifecycle; see state_machines.ContentVersion
        default: DRAFT
        constraints: "DRAFT | IN_REVIEW | PINNED | SUPERSEDED"
      - name: image_count
        type: integer
        source: input
        description: number of images the author claims this revision ships; used by the DECLARED completeness variant only
        default: 0
        constraints: ">= 0"
      - name: pin_count
        type: integer
        source: computed
        description: "count of RetailerListings whose pinned_content_version_id equals this id, plus count of EnhancedContentDeployments in state IN {PENDING_RETAILER_APPROVAL, LIVE} whose ChangeRequest.target_content_version_id equals this id (calculations.version_pin_reference_ledger)"
        default: 0
      - name: author_user_id
        type: string
        source: system
        description: X-User-ID of the ContentAuthor that created the revision; blocks that user from reviewing it

  - name: ContentAttributeValue
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: content_version_id
        type: string
        source: input
        description: "FK -> ContentVersion.id; the revision that carries this attribute value"
      - name: attribute_key
        type: string
        source: input
        description: natural key; MUST equal an existing AttributeDefinition.attribute_key; unique per content_version_id (a second POST on the same key overwrites the row)
      - name: value
        type: string
        source: input
        description: attribute payload as authored
        constraints: 1..2000 chars
      - name: char_count
        type: integer
        source: computed
        description: length of value after stripping leading and trailing whitespace
      - name: type_valid
        type: boolean
        source: computed
        description: true when the stripped value parses as the AttributeDefinition.data_type of attribute_key; false-valued rows never earn certified completeness credit

  - name: MediaAsset
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product this rich-media asset belongs to"
      - name: asset_role
        type: enum
        source: input
        description: "placement role; HERO_IMAGE and SECONDARY_IMAGE are the image roles counted by the certified completeness variant and by the min_image_count gate"
        constraints: "HERO_IMAGE | SECONDARY_IMAGE | VIDEO | A_PLUS_MODULE"
      - name: source_uri
        type: string
        source: input
        description: brand-side URI of the master asset
        constraints: 1..500 chars
      - name: approval_state
        type: enum
        source: computed
        description: retailer approval posture; see state_machines.MediaAsset
        default: PENDING
        constraints: "PENDING | APPROVED | REJECTED"
      - name: approving_retailer_id
        type: string
        source: system
        description: "FK -> Retailer.id; retailer whose RetailerIntegration decided the asset (X-User-ID of the deciding call); null while PENDING"
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the retailer decision; null while PENDING
        default: null

  - name: RetailerListing
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; product side of the junction"
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; retailer side of the junction"
      - name: pinned_content_version_id
        type: string
        source: computed
        description: "FK -> ContentVersion.id; revision certified for this retailer, written only by an APPROVED ChangeRequest; null until the first approval"
        default: null
      - name: account_team_user_id
        type: string
        source: input
        description: opaque X-User-ID of the AccountTeamLead who owns follow-up for this listing; copied onto every ShelfAlert raised here
        default: null
      - name: syndication_state
        type: enum
        source: computed
        description: distribution dimension; see state_machines.RetailerListing
        default: NOT_SYNDICATED
        constraints: "NOT_SYNDICATED | PENDING | LIVE | ERROR_HOLD"
      - name: shelf_state
        type: enum
        source: computed
        description: shelf-observation dimension, independent of syndication_state; see state_machines.RetailerListing
        default: OK
        constraints: "OK | OOS_WATCH | UNAUTHORIZED | SUSPENDED"
      - name: completeness_score_declared
        type: number
        source: computed
        description: DECLARED variant of calculations.listing_completeness_score
        default: 0.00
        constraints: 0.00..100.00, 2 decimal places
      - name: completeness_score_certified
        type: number
        source: computed
        description: CERTIFIED variant of calculations.listing_completeness_score
        default: 0.00
        constraints: 0.00..100.00, 2 decimal places
      - name: readiness_score
        type: number
        source: computed
        description: calculations.retailer_readiness_score, recomputed whenever any of its inputs changes
        default: 0.00
        constraints: 0.00..100.00, 2 decimal places
      - name: search_rank_latest
        type: integer
        source: computed
        description: search_rank of the latest ShelfObservation of this listing; null when no observation carries a rank
        default: null
      - name: content_accuracy_pct
        type: number
        source: computed
        description: content_accuracy_pct of the latest ShelfObservation of this listing; null before the first observation
        default: null
      - name: rating_avg
        type: number
        source: computed
        description: rating_avg of the latest ShelfObservation of this listing; null before the first observation
        default: null
      - name: in_stock
        type: boolean
        source: computed
        description: in_stock of the latest ShelfObservation of this listing; true before the first observation
        default: true
      - name: open_blocking_error_count
        type: integer
        source: computed
        description: "count of RejectionErrors with severity BLOCKING and state OPEN across all SyndicationJobs of this listing"
        default: 0

  - name: SyndicationJob
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: retailer_listing_id
        type: string
        source: input
        description: "FK -> RetailerListing.id; the listing this transmission targets"
      - name: content_version_id
        type: string
        source: input
        description: "FK -> ContentVersion.id; the revision transmitted; must be PINNED at queue time"
      - name: slot_count
        type: integer
        source: input
        description: feed slots (SKU/variant rows) this job reserves on its retailer while QUEUED or TRANSMITTED
        constraints: 1..10
      - name: window_start
        type: datetime
        source: input
        description: start of the transmission window
      - name: window_end
        type: datetime
        source: input
        description: end of the transmission window; must be strictly after window_start
      - name: state
        type: enum
        source: computed
        description: see state_machines.SyndicationJob
        default: QUEUED
        constraints: "QUEUED | TRANSMITTED | ACCEPTED | PARTIALLY_ACCEPTED | REJECTED | INVALIDATED | CANCELLED"
      - name: attempt_no
        type: integer
        source: computed
        description: 1 at creation, incremented by one on every requeue
        default: 1
      - name: readiness_at_queue
        type: number
        source: computed
        description: calculations.retailer_readiness_score frozen at creation and re-frozen at every requeue
        default: 0.00
      - name: service_fee_cents
        type: integer
        source: computed
        description: calculations.content_service_fee frozen at creation and recomputed at every requeue
        default: 0
      - name: transmitted_at
        type: datetime
        source: system
        description: logical-clock instant of the transmit call; null while QUEUED
        default: null
      - name: responded_at
        type: datetime
        source: system
        description: logical-clock instant of the retailer response; null until responded
        default: null

  - name: RejectionError
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: syndication_job_id
        type: string
        source: input
        description: "FK -> SyndicationJob.id; the transmission the retailer rejected this row against"
      - name: retailer_error_code
        type: string
        source: input
        description: retailer-side error code as returned on the feed response
        constraints: 1..40 chars
      - name: attribute_key
        type: string
        source: input
        description: attribute the retailer complained about; MUST equal an existing AttributeDefinition.attribute_key when present
        default: null
      - name: severity
        type: enum
        source: input
        description: BLOCKING rows hold the listing in ERROR_HOLD and block requeue until closed; WARNING rows do not
        constraints: "BLOCKING | WARNING"
      - name: message
        type: string
        source: input
        description: retailer-supplied human readable reason
        constraints: 1..500 chars
      - name: state
        type: enum
        source: computed
        description: see state_machines.RejectionError
        default: OPEN
        constraints: "OPEN | RESOLVED | WAIVED"
      - name: resolution_mode
        type: enum
        source: computed
        description: FIX when the operator repaired the content, WAIVE when the operator accepted the defect; null while OPEN
        default: null
        constraints: "FIX | WAIVE"
      - name: resolved_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the SyndicationOperator that closed the row; null while OPEN
        default: null

  - name: ChangeRequest
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; product whose content the request changes"
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; the single retailer whose listing this request pins on approval"
      - name: target_content_version_id
        type: string
        source: input
        description: "FK -> ContentVersion.id; the DRAFT revision that becomes PINNED on approval"
      - name: rationale
        type: string
        source: input
        description: governance justification recorded for audit
        constraints: 1..500 chars
      - name: state
        type: enum
        source: computed
        description: see state_machines.ChangeRequest
        default: DRAFT
        constraints: "DRAFT | IN_REVIEW | APPROVED | REJECTED"
      - name: legal_review_state
        type: enum
        source: computed
        description: LEGAL track dimension, decided only by LegalReviewer
        default: PENDING
        constraints: "PENDING | APPROVED | REJECTED"
      - name: brand_review_state
        type: enum
        source: computed
        description: BRAND track dimension, decided only by BrandGovernanceApprover
        default: PENDING
        constraints: "PENDING | APPROVED | REJECTED"
      - name: author_user_id
        type: string
        source: system
        description: X-User-ID of the ContentAuthor that created the request; may never appear as a reviewer
      - name: legal_reviewer_user_id
        type: string
        source: system
        description: X-User-ID that decided the LEGAL track; null while that track is PENDING
        default: null
      - name: brand_reviewer_user_id
        type: string
        source: system
        description: X-User-ID that decided the BRAND track; null while that track is PENDING
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the submit call; null while DRAFT
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant at which state became APPROVED or REJECTED; null before
        default: null

  - name: EnhancedContentDeployment
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: retailer_listing_id
        type: string
        source: input
        description: "FK -> RetailerListing.id; the listing whose enhanced-content placement window this deployment occupies"
      - name: change_request_id
        type: string
        source: input
        description: "FK -> ChangeRequest.id; the APPROVED governance record authorising the deployment"
      - name: media_asset_id
        type: string
        source: input
        description: "FK -> MediaAsset.id; the APPROVED rich-media asset deployed"
      - name: module_kind
        type: enum
        source: input
        description: which enhanced-content module this deployment publishes
        constraints: "A_PLUS_PAGE | COMPARISON_CHART | VIDEO_BLOCK"
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the placement window
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the placement window; must be strictly after window_start
      - name: state
        type: enum
        source: computed
        description: see state_machines.EnhancedContentDeployment
        constraints: "PENDING_RETAILER_APPROVAL | LIVE | REJECTED | WITHDRAWN"
      - name: retailer_decision_at
        type: datetime
        source: system
        description: logical-clock instant of the retailer decision; null when none has been made
        default: null
      - name: withdrawn_reason
        type: string
        source: input
        description: reason recorded by the operator on withdrawal; null while not WITHDRAWN
        default: null

  - name: ShelfObservation
    parent: null
    common_fields: false
    common_fields_note: |
      Append-only event row: it carries only the two server-stamped fields declared below (id and
      created_at) and NO updated_at and NO version, and §1.5 declares no PATCH or DELETE whose
      output is ShelfObservation. created_at exists because calculations.listing_shelf_projection
      and calculations.content_conversion_lift break observed_at ties by insertion order.
    entity_kind: event
    fields:
      - name: id
        type: string
        source: system
        description: server-minted identifier; referenced by ShelfAlert.source_observation_id
      - name: created_at
        type: datetime
        source: system
        description: logical-clock instant at which the row was appended; the ASC tiebreaker when two observations share observed_at
      - name: retailer_listing_id
        type: string
        source: input
        description: "FK -> RetailerListing.id; the listing this crawl observed"
      - name: observed_at
        type: datetime
        source: input
        description: instant the crawl observed the shelf; drives latest-observation ordering
      - name: search_rank
        type: integer
        source: input
        description: keyword search rank observed on the retailer site; null when the product did not appear
        default: null
        constraints: ">= 1 when present"
      - name: in_stock
        type: boolean
        source: input
        description: availability observed on the retailer PDP
      - name: content_accuracy_pct
        type: number
        source: input
        description: percentage of certified attributes rendered correctly on the retailer PDP
        constraints: 0.00..100.00, 2 decimal places
      - name: rating_avg
        type: number
        source: input
        description: average star rating observed
        constraints: 0.00..5.00, 2 decimal places
      - name: rating_count
        type: integer
        source: input
        description: number of ratings observed
        constraints: ">= 0"
      - name: unauthorized_seller_count
        type: integer
        source: input
        description: count of unauthorized sellers observed on the listing
        constraints: ">= 0"
      - name: conversion_rate_pct
        type: number
        source: input
        description: conversion rate observed for the period ending at observed_at; the dependent variable of calculations.content_conversion_lift
        constraints: 0.00..100.00, 2 decimal places
      - name: units_sold
        type: integer
        source: input
        description: units sold in the observed period
        constraints: ">= 0"

  - name: ShelfAlert
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: retailer_listing_id
        type: string
        source: input
        description: "FK -> RetailerListing.id; the listing the alert was raised on"
      - name: source_observation_id
        type: string
        source: system
        description: "FK -> ShelfObservation.id; the observation whose ingest raised the alert; null for alerts raised by a syndication cascade"
        default: null
      - name: alert_type
        type: enum
        source: computed
        description: which monitoring rule raised the alert
        constraints: "OUT_OF_STOCK | UNAUTHORIZED_LISTING | CONTENT_DRIFT | HEALTH_DEGRADED"
      - name: severity
        type: enum
        source: computed
        description: "HIGH for UNAUTHORIZED_LISTING, MEDIUM for OUT_OF_STOCK and HEALTH_DEGRADED, LOW for CONTENT_DRIFT"
        constraints: "LOW | MEDIUM | HIGH"
      - name: state
        type: enum
        source: computed
        description: see state_machines.ShelfAlert
        default: OPEN
        constraints: "OPEN | ACKNOWLEDGED | RESOLVED"
      - name: assigned_account_team_user_id
        type: string
        source: computed
        description: copied from RetailerListing.account_team_user_id at creation; null when the listing has no owner
        default: null
      - name: acknowledged_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the AccountTeamLead that acknowledged; null while OPEN
        default: null
      - name: resolution_note
        type: string
        source: input
        description: closing note supplied on manual resolve; set to "AUTO_CLEARED_BY_OBSERVATION" when the system auto-resolves
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: logical-clock instant of resolution; null until RESOLVED
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ContentVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    shape: branching_with_revert
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /digital-shelf/change-requests/{id}/submit"
        actor: ContentAuthor
        preconditions:
          - "ChangeRequest.state == DRAFT"
          - "ChangeRequest.target_content_version_id == this ContentVersion.id"
          - "this ContentVersion.state == DRAFT"
          - "Retailer(ChangeRequest.retailer_id).status == ACTIVE"
        side_effects:
          - "ChangeRequest.state := IN_REVIEW; legal_review_state := PENDING; brand_review_state := PENDING; submitted_at := logical clock"
          - "this ContentVersion.state := IN_REVIEW (further POST attribute-values on it are rejected with ERR_VERSION_NOT_DRAFT)"
        note: content freeze — the revision under review can no longer be edited
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /digital-shelf/change-requests/{id}/reviews with decision REJECTED on either track"
        actor: LegalReviewer | BrandGovernanceApprover
        preconditions:
          - "ChangeRequest.state == IN_REVIEW"
          - "the acting track is still PENDING"
        side_effects:
          - "ChangeRequest.state := REJECTED; decided_at := logical clock"
          - "this ContentVersion.state := DRAFT (editing reopens; no pin, no supersede, pin_count unchanged)"
          - "Product.last_review_at := logical clock; Product.version += 1"
        note: "revision loop — the same revision can be resubmitted through a new ChangeRequest, so DRAFT->IN_REVIEW->DRAFT->IN_REVIEW is a cycle"
      - from: IN_REVIEW
        to: PINNED
        trigger: "POST /digital-shelf/change-requests/{id}/reviews — the decision that makes both tracks APPROVED"
        actor: LegalReviewer | BrandGovernanceApprover
        preconditions:
          - "ChangeRequest.state == IN_REVIEW"
          - "after applying this decision, legal_review_state == APPROVED AND brand_review_state == APPROVED"
        side_effects:
          - "cascade hop 1: ChangeRequest.state := APPROVED; decided_at := logical clock; this ContentVersion.state := PINNED; RetailerListing(product_id = CR.product_id, retailer_id = CR.retailer_id).pinned_content_version_id := this ContentVersion.id; Product.last_pinned_at := logical clock; Product.status := ACTIVE"
          - "cascade hop 2 (caused by hop 1's pin write): the ContentVersion previously referenced by that listing's pinned_content_version_id (if any) transitions PINNED -> SUPERSEDED and its pin_count is recomputed downward"
          - "cascade hop 3 (caused by hop 2's SUPERSEDED write): every SyndicationJob in state QUEUED whose content_version_id is the now-SUPERSEDED version transitions QUEUED -> INVALIDATED, processed in ascending created_at order"
          - "cascade hop 4 (caused by hop 3's INVALIDATED writes): each invalidated job releases its slot_count, so Retailer.feed_slots_reserved is recomputed and Retailer.version += 1"
          - "RetailerListing.completeness_score_certified, completeness_score_declared and readiness_score recomputed; this ContentVersion.pin_count recomputed upward"
          - "Product.last_review_at := logical clock; Product.version += 1"
      - from: PINNED
        to: SUPERSEDED
        trigger: "system — another ContentVersion of the same product is pinned onto the same RetailerListing"
        actor: system
        preconditions:
          - "the listing's pinned_content_version_id is being replaced by a different ContentVersion.id"
        side_effects:
          - "pin_count recomputed (loses the listing reference)"
          - "QUEUED SyndicationJobs referencing this version transition to INVALIDATED (see hop 3 above)"
        note: terminal — a SUPERSEDED revision can never be pinned again

  - entity: ChangeRequest
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    shape: fork_join_with_self_loop
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /digital-shelf/change-requests/{id}/submit"
        actor: ContentAuthor
        preconditions:
          - "state == DRAFT"
          - "target ContentVersion.state == DRAFT"
          - "Retailer(retailer_id).status == ACTIVE"
          - "a RetailerListing exists for (product_id, retailer_id)"
        side_effects:
          - "fork: legal_review_state := PENDING and brand_review_state := PENDING become two independently decidable dimensions"
          - "target ContentVersion.state := IN_REVIEW"
          - "submitted_at := logical clock"
      - from: IN_REVIEW
        to: IN_REVIEW
        trigger: "POST /digital-shelf/change-requests/{id}/reviews — first APPROVED decision, the other track still PENDING"
        actor: LegalReviewer | BrandGovernanceApprover
        preconditions:
          - "state == IN_REVIEW"
          - "the track named in the request is PENDING (ERR_TRACK_ALREADY_DECIDED otherwise)"
          - "acting role matches the track (LegalReviewer -> LEGAL, BrandGovernanceApprover -> BRAND)"
          - "X-User-ID != author_user_id"
          - "expected_product_version == Product.version"
        side_effects:
          - "<track>_review_state := APPROVED; <track>_reviewer_user_id := X-User-ID"
          - "Product.last_review_at := logical clock; Product.version += 1"
          - "no pin, no supersede, no invalidation — the join has not fired"
        note: self-loop — the aggregate state stays IN_REVIEW while only one dimension has moved
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /digital-shelf/change-requests/{id}/reviews — second APPROVED decision (join)"
        actor: LegalReviewer | BrandGovernanceApprover
        preconditions:
          - "state == IN_REVIEW"
          - "the track named in the request is PENDING"
          - "X-User-ID != author_user_id AND X-User-ID != the other track's reviewer_user_id"
          - "expected_product_version == Product.version"
        side_effects:
          - "join branch: runs the four-hop pin/supersede/invalidate/slot-release cascade documented on state_machines.ContentVersion.IN_REVIEW_to_PINNED"
          - "decided_at := logical clock"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /digital-shelf/change-requests/{id}/reviews with decision REJECTED on either track"
        actor: LegalReviewer | BrandGovernanceApprover
        preconditions:
          - "state == IN_REVIEW"
          - "the track named in the request is PENDING"
          - "X-User-ID != author_user_id AND X-User-ID != the other track's reviewer_user_id"
          - "expected_product_version == Product.version"
        side_effects:
          - "reject branch (short-circuit): <track>_review_state := REJECTED, state := REJECTED even while the other track is still PENDING"
          - "target ContentVersion.state := DRAFT; the listing's pinned_content_version_id is NOT touched; no version is superseded; no job is invalidated"
          - "Product.last_review_at := logical clock; Product.version += 1; decided_at := logical clock"
        note: "divergent side-effect set versus the APPROVED branch — this is the fork-join's asymmetry"

  - entity: SyndicationJob
    initial_state: QUEUED
    terminal_states: [ACCEPTED, INVALIDATED, CANCELLED]
    shape: cyclic
    transitions:
      - from: null
        to: QUEUED
        trigger: "POST /digital-shelf/syndication-jobs"
        actor: SyndicationOperator
        preconditions:
          - "RetailerListing exists and shelf_state NOT IN {SUSPENDED, UNAUTHORIZED}"
          - "Retailer(listing.retailer_id).status == ACTIVE"
          - "ContentVersion.state == PINNED AND ContentVersion.product_id == listing.product_id"
          - "listing.completeness_score_certified >= 85.00"
          - "closed-window aggregate check passes (validations[priority=44])"
          - "Retailer.feed_slots_reserved + slot_count <= Retailer.feed_slot_capacity"
          - "expected_retailer_version == Retailer.version"
        side_effects:
          - "job created with state QUEUED, attempt_no 1"
          - "Retailer.feed_slots_reserved += slot_count; Retailer.version += 1"
          - "readiness_at_queue := calculations.retailer_readiness_score; service_fee_cents := calculations.content_service_fee"
          - "RetailerListing.syndication_state := PENDING"
      - from: QUEUED
        to: TRANSMITTED
        trigger: "POST /digital-shelf/syndication-jobs/{id}/transmit"
        actor: SyndicationOperator
        preconditions:
          - "state == QUEUED"
          - "Retailer.status == ACTIVE"
        side_effects:
          - "transmitted_at := logical clock"
          - "slots stay reserved (TRANSMITTED is still a holding state)"
      - from: TRANSMITTED
        to: ACCEPTED
        trigger: "POST /digital-shelf/syndication-jobs/{id}/retailer-response with outcome ACCEPTED"
        actor: RetailerIntegration
        preconditions:
          - "state == TRANSMITTED"
          - "X-User-ID == Retailer.id of the job's listing"
          - "errors is absent or empty"
        side_effects:
          - "responded_at := logical clock"
          - "RetailerListing.syndication_state := LIVE"
          - "Retailer.feed_slots_reserved -= slot_count; Retailer.version += 1"
      - from: TRANSMITTED
        to: PARTIALLY_ACCEPTED
        trigger: "POST /digital-shelf/syndication-jobs/{id}/retailer-response with outcome PARTIALLY_ACCEPTED"
        actor: RetailerIntegration
        preconditions:
          - "state == TRANSMITTED"
          - "X-User-ID == Retailer.id of the job's listing"
          - "errors contains >= 1 row and every row has severity WARNING"
        side_effects:
          - "one RejectionError row created per errors entry, in request order, each state OPEN"
          - "RetailerListing.syndication_state := LIVE (no BLOCKING row exists); open_blocking_error_count unchanged"
          - "Retailer.feed_slots_reserved -= slot_count; Retailer.version += 1"
      - from: TRANSMITTED
        to: REJECTED
        trigger: "POST /digital-shelf/syndication-jobs/{id}/retailer-response with outcome REJECTED"
        actor: RetailerIntegration
        preconditions:
          - "state == TRANSMITTED"
          - "X-User-ID == Retailer.id of the job's listing"
          - "errors contains >= 1 row and at least one row has severity BLOCKING"
        side_effects:
          - "cascade hop 1: state := REJECTED, responded_at := logical clock, one RejectionError row per errors entry (request order), Retailer.feed_slots_reserved -= slot_count, Retailer.version += 1"
          - "cascade hop 2 (caused by hop 1's BLOCKING RejectionError rows): RetailerListing.open_blocking_error_count recomputed > 0, therefore listing.syndication_state := ERROR_HOLD and readiness_score recomputed with the new penalty tier"
          - "cascade hop 3 (caused by hop 2's ERROR_HOLD write, which admits the listing into the health input set): Product.shelf_health_index recomputed; when the recomputed index < 60.00 a ShelfAlert{alert_type: HEALTH_DEGRADED, severity: MEDIUM, source_observation_id: null} is created on that listing (suppressed when an OPEN or ACKNOWLEDGED HEALTH_DEGRADED alert already exists there)"
          - "cascade hop 4 (caused by hop 3's alert row): Product.open_alert_count recomputed and Product.governance_flag := CONTENT_AT_RISK (or LISTING_RISK when an UNAUTHORIZED_LISTING alert is open); Product.version += 1"
      - from: REJECTED
        to: QUEUED
        trigger: "POST /digital-shelf/syndication-jobs/{id}/requeue"
        actor: SyndicationOperator
        preconditions:
          - "state IN {REJECTED, PARTIALLY_ACCEPTED}"
          - "every RejectionError of this job with severity BLOCKING has state IN {RESOLVED, WAIVED}"
          - "RetailerListing.shelf_state NOT IN {SUSPENDED, UNAUTHORIZED}"
          - "ContentVersion.state == PINNED (a superseded revision can never be requeued)"
          - "closed-window aggregate check passes for the new window"
          - "Retailer.feed_slots_reserved + slot_count <= Retailer.feed_slot_capacity"
          - "expected_retailer_version == Retailer.version"
        side_effects:
          - "state := QUEUED; attempt_no += 1; window_start/window_end := request values; transmitted_at := null; responded_at := null"
          - "Retailer.feed_slots_reserved += slot_count; Retailer.version += 1"
          - "readiness_at_queue and service_fee_cents recomputed at the new clock position"
          - "RetailerListing.syndication_state := PENDING"
        note: closes the cycle QUEUED -> TRANSMITTED -> REJECTED -> QUEUED
      - from: PARTIALLY_ACCEPTED
        to: QUEUED
        trigger: "POST /digital-shelf/syndication-jobs/{id}/requeue"
        actor: SyndicationOperator
        preconditions:
          - "state == PARTIALLY_ACCEPTED"
          - "no OPEN BLOCKING RejectionError on this job (by construction PARTIALLY_ACCEPTED creates only WARNING rows)"
          - "same window, capacity and OCC preconditions as REJECTED -> QUEUED"
        side_effects:
          - "identical to REJECTED -> QUEUED"
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /digital-shelf/syndication-jobs/{id}/cancel"
        actor: SyndicationOperator
        preconditions:
          - "state IN {QUEUED, TRANSMITTED}"
        side_effects:
          - "Retailer.feed_slots_reserved -= slot_count; Retailer.version += 1"
          - "RetailerListing.syndication_state := ERROR_HOLD when open_blocking_error_count > 0, else NOT_SYNDICATED when the listing has no other job in {QUEUED, TRANSMITTED}, else unchanged"
      - from: TRANSMITTED
        to: CANCELLED
        trigger: "POST /digital-shelf/syndication-jobs/{id}/cancel"
        actor: SyndicationOperator
        preconditions:
          - "state == TRANSMITTED"
        side_effects:
          - "identical to QUEUED -> CANCELLED"
      - from: QUEUED
        to: INVALIDATED
        trigger: "system — the job's content_version_id became SUPERSEDED (cascade hop 3 of the ChangeRequest join)"
        actor: system
        preconditions:
          - "state == QUEUED"
          - "ContentVersion.state transitioned PINNED -> SUPERSEDED in this request"
        side_effects:
          - "Retailer.feed_slots_reserved -= slot_count; Retailer.version += 1"
          - "RetailerListing.syndication_state := NOT_SYNDICATED when no other job of the listing is in {QUEUED, TRANSMITTED} and open_blocking_error_count == 0"
        note: TRANSMITTED jobs are never invalidated — the retailer already holds the payload

  - entity: RetailerListing
    initial_state: "syndication_state: NOT_SYNDICATED / shelf_state: OK"
    terminal_states: []
    shape: parallel_dimensions
    dimensions:
      - name: syndication_state
        values: [NOT_SYNDICATED, PENDING, LIVE, ERROR_HOLD]
        driven_by: SyndicationJob lifecycle and RejectionError closure
      - name: shelf_state
        values: [OK, OOS_WATCH, UNAUTHORIZED, SUSPENDED]
        driven_by: ShelfObservation ingest and AccountTeamLead shelf-status calls
    transitions:
      - from: "syndication_NOT_SYNDICATED"
        to: "syndication_PENDING"
        trigger: "POST /digital-shelf/syndication-jobs, or POST /digital-shelf/syndication-jobs/{id}/requeue"
        actor: SyndicationOperator
        preconditions: ["a SyndicationJob for this listing enters QUEUED"]
        side_effects: ["shelf_state is untouched — the two dimensions never write each other"]
      - from: "syndication_PENDING"
        to: "syndication_LIVE"
        trigger: "POST /digital-shelf/syndication-jobs/{id}/retailer-response with outcome ACCEPTED or PARTIALLY_ACCEPTED"
        actor: RetailerIntegration
        preconditions: ["the responding job belongs to this listing"]
        side_effects: ["readiness_score recomputed"]
      - from: "syndication_PENDING"
        to: "syndication_ERROR_HOLD"
        trigger: "POST /digital-shelf/syndication-jobs/{id}/retailer-response with outcome REJECTED"
        actor: RetailerIntegration
        preconditions: ["open_blocking_error_count > 0 after the response"]
        side_effects: ["readiness_score recomputed with the new penalty tier; Product.shelf_health_index recomputed (this listing now qualifies)"]
      - from: "syndication_ERROR_HOLD"
        to: "syndication_NOT_SYNDICATED"
        trigger: "POST /digital-shelf/rejection-errors/{id}/resolve — the call that closes the last OPEN BLOCKING row"
        actor: SyndicationOperator
        preconditions:
          - "open_blocking_error_count becomes 0"
          - "no job of this listing is in {QUEUED, TRANSMITTED}"
        side_effects: ["readiness_score recomputed with penalty tier 0; Product.shelf_health_index recomputed (this listing no longer qualifies)"]
      - from: "syndication_LIVE"
        to: "syndication_PENDING"
        trigger: "POST /digital-shelf/syndication-jobs/{id}/requeue on a PARTIALLY_ACCEPTED job (the listing was LIVE with only WARNING rows)"
        actor: SyndicationOperator
        preconditions:
          - "the requeued job's state == PARTIALLY_ACCEPTED"
          - "current syndication_state == LIVE"
        side_effects:
          - "the listing leaves the shelf_health_index input set until the new attempt resolves; Product.shelf_health_index recomputed"
      - from: "syndication_PENDING"
        to: "syndication_NOT_SYNDICATED"
        trigger: "POST /digital-shelf/syndication-jobs/{id}/cancel, or the system INVALIDATED cascade of the ChangeRequest join"
        actor: "SyndicationOperator | system"
        preconditions:
          - "no other job of this listing is in {QUEUED, TRANSMITTED}"
          - "open_blocking_error_count == 0 (otherwise the listing lands on ERROR_HOLD instead)"
        side_effects:
          - "Retailer.feed_slots_reserved recomputed per calculations.feed_slot_reservation_ledger; readiness_score recomputed"
      - from: "shelf_OK"
        to: "shelf_OOS_WATCH"
        trigger: "POST /digital-shelf/retailer-listings/{id}/observations with in_stock false and unauthorized_seller_count 0"
        actor: ShelfAdmin
        preconditions: ["current shelf_state == OK"]
        side_effects:
          - "cascade hop 1: ShelfObservation appended; listing.in_stock := false; shelf_state := OOS_WATCH"
          - "cascade hop 2 (caused by hop 1's OOS_WATCH write): ShelfAlert{alert_type: OUT_OF_STOCK, severity: MEDIUM, source_observation_id: the new observation} created unless an OPEN or ACKNOWLEDGED OUT_OF_STOCK alert already exists on the listing"
          - "cascade hop 3 (caused by hop 2's alert row): Product.open_alert_count recomputed, Product.governance_flag recomputed, Product.version += 1"
      - from: "shelf_OOS_WATCH"
        to: "shelf_OK"
        trigger: "POST /digital-shelf/retailer-listings/{id}/observations with in_stock true and unauthorized_seller_count 0"
        actor: ShelfAdmin
        preconditions: ["current shelf_state == OOS_WATCH"]
        side_effects:
          - "shelf_state := OK"
          - "every OUT_OF_STOCK ShelfAlert of this listing in state IN {OPEN, ACKNOWLEDGED} auto-transitions to RESOLVED with resolution_note AUTO_CLEARED_BY_OBSERVATION and resolved_at := logical clock"
          - "Product.open_alert_count and governance_flag recomputed; Product.version += 1"
      - from: "shelf_OK"
        to: "shelf_UNAUTHORIZED"
        trigger: "POST /digital-shelf/retailer-listings/{id}/observations with unauthorized_seller_count >= 1"
        actor: ShelfAdmin
        preconditions: ["current shelf_state != SUSPENDED"]
        side_effects:
          - "shelf_state := UNAUTHORIZED (precedence SUSPENDED > UNAUTHORIZED > OOS_WATCH > OK: an observation that is both out of stock and unauthorized lands on UNAUTHORIZED)"
          - "ShelfAlert{alert_type: UNAUTHORIZED_LISTING, severity: HIGH} created unless an OPEN/ACKNOWLEDGED one exists; assigned_account_team_user_id := listing.account_team_user_id"
          - "Product.governance_flag := LISTING_RISK; Product.version += 1"
          - "new SyndicationJobs and EnhancedContentDeployments on this listing are now rejected with ERR_LISTING_SHELF_BLOCKED"
      - from: "shelf_UNAUTHORIZED"
        to: "shelf_OK"
        trigger: "POST /digital-shelf/retailer-listings/{id}/shelf-status with shelf_state OK"
        actor: AccountTeamLead
        preconditions: ["current shelf_state IN {UNAUTHORIZED, OOS_WATCH, SUSPENDED}"]
        side_effects:
          - "shelf_state := OK"
          - "every UNAUTHORIZED_LISTING ShelfAlert of this listing in state IN {OPEN, ACKNOWLEDGED} transitions to RESOLVED with resolution_note AUTO_CLEARED_BY_ACCOUNT_TEAM"
          - "Product.open_alert_count, governance_flag recomputed; Product.version += 1"
      - from: "shelf_OK"
        to: "shelf_SUSPENDED"
        trigger: "POST /digital-shelf/retailer-listings/{id}/shelf-status with shelf_state SUSPENDED"
        actor: AccountTeamLead
        preconditions: ["current shelf_state != SUSPENDED"]
        side_effects:
          - "shelf_state := SUSPENDED; syndication_state untouched"
          - "readiness_score recomputed (accuracy input is now floored at 60.00)"

  - entity: RejectionError
    initial_state: OPEN
    terminal_states: [RESOLVED, WAIVED]
    shape: branching
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /digital-shelf/rejection-errors/{id}/resolve with resolution_mode FIX"
        actor: SyndicationOperator
        preconditions: ["state == OPEN"]
        side_effects:
          - "resolution_mode := FIX; resolved_by_user_id := X-User-ID"
          - "RetailerListing.open_blocking_error_count recomputed; when it reaches 0 the listing leaves ERROR_HOLD (see RetailerListing dimension transitions)"
          - "RetailerListing.readiness_score recomputed (penalty tier may drop)"
      - from: OPEN
        to: WAIVED
        trigger: "POST /digital-shelf/rejection-errors/{id}/resolve with resolution_mode WAIVE"
        actor: SyndicationOperator
        preconditions: ["state == OPEN"]
        side_effects:
          - "resolution_mode := WAIVE; resolved_by_user_id := X-User-ID"
          - "identical listing recomputes as the FIX branch — a WAIVED row also stops blocking requeue"

  - entity: EnhancedContentDeployment
    initial_state: "PENDING_RETAILER_APPROVAL when Retailer.enhanced_content_requires_approval, else LIVE"
    terminal_states: [REJECTED, WITHDRAWN]
    shape: branching
    transitions:
      - from: null
        to: PENDING_RETAILER_APPROVAL
        trigger: "POST /digital-shelf/enhanced-deployments when Retailer.enhanced_content_requires_approval == true"
        actor: ContentAuthor
        preconditions:
          - "ChangeRequest.state == APPROVED AND ChangeRequest.retailer_id == listing.retailer_id AND ChangeRequest.product_id == listing.product_id"
          - "MediaAsset.approval_state == APPROVED AND MediaAsset.product_id == listing.product_id"
          - "count of MediaAssets of the product with asset_role IN {HERO_IMAGE, SECONDARY_IMAGE} and approval_state APPROVED >= Retailer.min_image_count"
          - "listing.shelf_state NOT IN {SUSPENDED, UNAUTHORIZED}"
          - "the half-open window [window_start, window_end) does not intersect any deployment of the same listing in state IN {PENDING_RETAILER_APPROVAL, LIVE}"
          - "expected_retailer_listing_version == RetailerListing.version"
        side_effects:
          - "RetailerListing.version += 1"
          - "ContentVersion(ChangeRequest.target_content_version_id).pin_count recomputed upward (the deployment adds a live reference)"
      - from: null
        to: LIVE
        trigger: "POST /digital-shelf/enhanced-deployments when Retailer.enhanced_content_requires_approval == false"
        actor: ContentAuthor
        preconditions: ["identical to the PENDING_RETAILER_APPROVAL creation branch"]
        side_effects:
          - "retailer_decision_at := null (no decision was needed); RetailerListing.version += 1; pin_count recomputed upward"
        note: conditional-flag branch — the same request produces a different initial state per retailer configuration
      - from: PENDING_RETAILER_APPROVAL
        to: LIVE
        trigger: "POST /digital-shelf/enhanced-deployments/{id}/retailer-decision with decision APPROVE"
        actor: RetailerIntegration
        preconditions:
          - "state == PENDING_RETAILER_APPROVAL"
          - "X-User-ID == Retailer.id of the deployment's listing"
        side_effects: ["retailer_decision_at := logical clock; RetailerListing.readiness_score recomputed (+5 live-enhanced-content bonus)"]
      - from: PENDING_RETAILER_APPROVAL
        to: REJECTED
        trigger: "POST /digital-shelf/enhanced-deployments/{id}/retailer-decision with decision REJECT"
        actor: RetailerIntegration
        preconditions:
          - "state == PENDING_RETAILER_APPROVAL"
          - "X-User-ID == Retailer.id of the deployment's listing"
        side_effects:
          - "retailer_decision_at := logical clock"
          - "ContentVersion.pin_count recomputed downward (the reference is gone); the window is freed for another deployment"
      - from: LIVE
        to: WITHDRAWN
        trigger: "POST /digital-shelf/enhanced-deployments/{id}/withdraw"
        actor: ContentAuthor
        preconditions: ["state IN {PENDING_RETAILER_APPROVAL, LIVE}"]
        side_effects:
          - "withdrawn_reason := request reason"
          - "ContentVersion.pin_count recomputed downward — compensating action for the creation reference, leaving the pin ledger undrifted"
          - "RetailerListing.readiness_score recomputed (bonus removed); RetailerListing.version += 1"
      - from: PENDING_RETAILER_APPROVAL
        to: WITHDRAWN
        trigger: "POST /digital-shelf/enhanced-deployments/{id}/withdraw"
        actor: ContentAuthor
        preconditions: ["state == PENDING_RETAILER_APPROVAL"]
        side_effects: ["identical to LIVE -> WITHDRAWN"]

  - entity: MediaAsset
    initial_state: PENDING
    terminal_states: [REJECTED]
    shape: branching
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /digital-shelf/media-assets/{id}/retailer-decision with decision APPROVE"
        actor: RetailerIntegration
        preconditions:
          - "state == PENDING"
          - "a RetailerListing exists for (asset.product_id, X-User-ID) — otherwise ERR_RETAILER_SCOPE_VIOLATION"
        side_effects:
          - "approving_retailer_id := X-User-ID; decided_at := logical clock"
          - "completeness_score_certified and readiness_score of the (product, retailer) listing recomputed — the approved image count feeds the certified image component"
      - from: PENDING
        to: REJECTED
        trigger: "POST /digital-shelf/media-assets/{id}/retailer-decision with decision REJECT"
        actor: RetailerIntegration
        preconditions: ["state == PENDING", "a RetailerListing exists for (asset.product_id, X-User-ID)"]
        side_effects: ["approving_retailer_id := X-User-ID; decided_at := logical clock; certified scores unchanged (a REJECTED asset never counts)"]

  - entity: ShelfAlert
    initial_state: OPEN
    terminal_states: [RESOLVED]
    shape: branching
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /digital-shelf/shelf-alerts/{id}/acknowledge"
        actor: AccountTeamLead
        preconditions: ["state == OPEN"]
        side_effects:
          - "acknowledged_by_user_id := X-User-ID"
          - "Product.open_alert_count unchanged (ACKNOWLEDGED still counts as open follow-up)"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /digital-shelf/shelf-alerts/{id}/resolve"
        actor: AccountTeamLead
        preconditions: ["state IN {OPEN, ACKNOWLEDGED}"]
        side_effects:
          - "resolution_note := request note; resolved_at := logical clock"
          - "Product.open_alert_count recomputed downward; Product.governance_flag recomputed; Product.version += 1"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /digital-shelf/shelf-alerts/{id}/resolve, or system auto-clear on a clearing ShelfObservation / shelf-status OK call"
        actor: AccountTeamLead | system
        preconditions: ["state == OPEN"]
        side_effects: ["identical to ACKNOWLEDGED -> RESOLVED; the system path writes resolution_note AUTO_CLEARED_BY_OBSERVATION or AUTO_CLEARED_BY_ACCOUNT_TEAM"]

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent entity's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: job-create-stale-retailer
    parent_entity: Retailer
    write_endpoint: "POST /digital-shelf/syndication-jobs"
    occ_field: "expected_retailer_version"
    description: |
      Queueing a SyndicationJob against a Retailer whose version has advanced since the client last
      read it is rejected. Feed slots are a shared pool: an earlier successful queue (or a cancel,
      or an invalidation cascade) has already moved feed_slots_reserved, so the current writer's
      view of remaining capacity is stale. A second queue attempt is otherwise perfectly legal —
      capacity permitting it would succeed — so the stale-version check is the only thing that
      distinguishes it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: cr-review-stale-product
    parent_entity: Product
    write_endpoint: "POST /digital-shelf/change-requests/{id}/reviews"
    occ_field: "expected_product_version"
    description: |
      Recording a review decision against a Product whose version has advanced since the reviewer
      last read it is rejected. The LEGAL and BRAND tracks are independently decidable, so a second
      decision on the other track is legitimate business flow; what the check catches is a reviewer
      deciding from a product view that predates the other track's decision, the pin cascade, or an
      alert recompute.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: deployment-create-stale-listing
    parent_entity: RetailerListing
    write_endpoint: "POST /digital-shelf/enhanced-deployments"
    occ_field: "expected_retailer_listing_version"
    description: |
      Creating an EnhancedContentDeployment against a RetailerListing whose version has advanced
      since the client last read it is rejected. Two deployments on non-intersecting windows are
      both legal, so nothing in the window arithmetic rejects the second writer; the stale version
      is what shows the writer did not see the placement calendar as it now stands.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: listing_completeness_score
    trigger: |
      Recomputed on POST /digital-shelf/content-versions/{id}/attribute-values, on
      POST /digital-shelf/content-versions, on POST /digital-shelf/retailers/{id}/requirements,
      on PATCH /digital-shelf/retailers/{id}, on POST /digital-shelf/media-assets/{id}/retailer-decision,
      and on the ChangeRequest approval join (pin write). Written to
      RetailerListing.completeness_score_declared and RetailerListing.completeness_score_certified,
      and returned by GET /digital-shelf/retailer-listings/{id}/completeness.
    algorithm: weighted_scoring
    formula: |
      # ---- requirement set (identical for both variants) ----
      REQS = RetailerRequirement rows where retailer_id == listing.retailer_id
             AND requirement_level IN {REQUIRED, RECOMMENDED}          # OPTIONAL excluded entirely
      weight(r)     = r.weight_override if r.weight_override != null else
                      AttributeDefinition(r.attribute_key).base_weight
      denominator D = sum(weight(r) for r in REQS) + IMAGE_WEIGHT      # IMAGE_WEIGHT always in D
      if D == 0: return 0.00                                          # empty-requirement-set fallback

      # ---- per-variant source revision and credit test ----
      # DECLARED  source_version = the ContentVersion of listing.product_id with the highest
      #                            revision_no (revision_no is unique per product, so no tie);
      #                            null when the product has no revision -> score 0.00
      # CERTIFIED source_version = ContentVersion(listing.pinned_content_version_id);
      #                            null when nothing is pinned yet -> score 0.00
      credit_declared(r)  = 1 if a ContentAttributeValue exists on source_version with
                              attribute_key == r.attribute_key and char_count >= 1
                            else 0                                     # presence only
      credit_certified(r) = 1 if such a row exists AND row.type_valid == true
                              AND row.char_count <= (r.max_chars_override if not null
                                                     else AttributeDefinition(r.attribute_key).max_chars)
                            else 0                                     # retailer char ceiling applies

      # ---- image component (partial credit, shared IMAGE_WEIGHT) ----
      images_declared  = source_version.image_count
      images_certified = count of MediaAsset rows with product_id == listing.product_id
                         AND asset_role IN {HERO_IMAGE, SECONDARY_IMAGE}
                         AND approval_state == APPROVED
      image_component(n) = IMAGE_WEIGHT if Retailer.min_image_count == 0
                           else IMAGE_WEIGHT * min(1, n / Retailer.min_image_count)

      # ---- assemble (NO intermediate rounding; N and D are exact rationals) ----
      N_variant = sum(weight(r) * credit_variant(r) for r in REQS) + image_component(images_variant)
      score     = round_half_up(100 * N_variant / D, 2)
    input_set: |
      DECLARED reads the highest-revision_no ContentVersion of the product regardless of its state
      (DRAFT, IN_REVIEW, PINNED or SUPERSEDED) and ignores every retailer character ceiling.
      CERTIFIED reads only the revision the listing has pinned and applies the retailer ceiling plus
      the APPROVED image-asset count. Both exclude OPTIONAL requirement rows from numerator and
      denominator.
    constants:
      IMAGE_WEIGHT: 20
    precision: "2 decimal places, round_half_up, applied once to the final percentage"
    variants:
      - name: DECLARED
        when: "author-facing view; stored in RetailerListing.completeness_score_declared and returned as declared_score"
        difference: "latest revision by revision_no + presence-only credit + claimed ContentVersion.image_count"
      - name: CERTIFIED
        when: "retailer-facing view; stored in RetailerListing.completeness_score_certified, returned as certified_score, and gated by validations[priority=42]"
        difference: "pinned revision only + retailer max_chars_override + type_valid + APPROVED image-asset count"
    worked_example: |
      Retailer MEGA (min_image_count 3); requirements title REQUIRED (override 80 chars, weight 30),
      description REQUIRED (override 100 chars, weight 20), bullet_1 RECOMMENDED (weight 10, no
      override), brand REQUIRED (weight 10), color OPTIONAL (excluded). D = 70 + 20 = 90.
      v1 (PINNED): title 60 chars, description 120 chars, brand 9 chars, no bullet_1, image_count 3.
      v2 (DRAFT, revision 2): title 75, description 200, bullet_1 180, brand 9, color 5, image_count 2.
      Three APPROVED image assets exist.
      DECLARED  -> source v2, N = 30+20+10+10 + 20*min(1, 2/3) = 250/3 -> 100*(250/3)/90 = 92.59
      CERTIFIED -> source v1, description 120 > 100 fails the retailer ceiling, bullet_1 absent,
                   N = 30 + 10 + 20*min(1, 3/3) = 60 -> 100*60/90 = 66.67

  - name: shelf_health_index
    trigger: |
      Recomputed on POST /digital-shelf/retailer-listings/{id}/observations, on every
      syndication_state transition of any listing of the product, and on demand by
      GET /digital-shelf/products/{id}/shelf-summary. Written to Product.shelf_health_index.
    algorithm: aggregation
    formula: |
      QUALIFY = RetailerListings of the product with syndication_state IN {LIVE, ERROR_HOLD}
                (NOT_SYNDICATED and PENDING listings are excluded)
      if QUALIFY is empty: index = 0.00 and retailer_subscores = []      # empty-set fallback

      for each listing L in QUALIFY, ordered by L.created_at ASC:
        rank_score   = 0 if L.search_rank_latest is null
                       else max(0, min(100, 100 - 5 * (L.search_rank_latest - 1)))
        avail_score  = 100 if L.in_stock else 0
        rating_score = 20 * (L.rating_avg if L.rating_avg is not null else 0)
        accuracy     = L.content_accuracy_pct if not null else 0
        subscore(L)  = round_half_up(0.45*accuracy + 0.25*rank_score
                                     + 0.20*avail_score + 0.10*rating_score, 2)

      # PINNED ROUNDING ORDER: round each retailer subscore to 2 dp FIRST, then average the
      # ROUNDED subscores, then round the average to 2 dp. Averaging the raw subscores and
      # rounding once at the end is WRONG and produces a different cent.
      index = round_half_up(sum(subscore(L) for L in QUALIFY) / count(QUALIFY), 2)
    input_set: "only listings of this product whose syndication_state IN {LIVE, ERROR_HOLD}; each contributes exactly one rounded subscore regardless of how many observations it has"
    constants:
      ACCURACY_WEIGHT: 0.45
      RANK_WEIGHT: 0.25
      AVAILABILITY_WEIGHT: 0.20
      RATING_WEIGHT: 0.10
      RANK_DECAY_PER_POSITION: 5
      HEALTH_ALERT_THRESHOLD: 60.00
    precision: "2 decimal places round_half_up at the subscore level AND again at the index level (two rounding stages, in that order)"
    worked_example: |
      L1: accuracy 40.10, search_rank 11, in_stock true, rating_avg 4.73
          -> raw 0.45*40.10 + 0.25*50 + 0.20*100 + 0.10*94.60 = 60.0050 -> subscore 60.01
      L2: accuracy 60.10, search_rank 6, in_stock true, rating_avg 2.11
          -> raw 27.045 + 18.75 + 20 + 4.22 = 70.0150 -> subscore 70.02
      PINNED order: (60.01 + 70.02)/2 = 65.015 -> index 65.02
      WRONG order:  (60.0050 + 70.0150)/2 = 65.0100 -> 65.01

  - name: retailer_readiness_score
    trigger: |
      Recomputed on every write that touches its inputs (completeness recompute, observation ingest,
      shelf-status change, RejectionError closure, deployment state change) and written to
      RetailerListing.readiness_score. Frozen onto SyndicationJob.readiness_at_queue at
      POST /digital-shelf/syndication-jobs and re-frozen at requeue.
    algorithm: threshold
    formula: |
      certified      = listing.completeness_score_certified
      accuracy_raw   = listing.content_accuracy_pct if not null else 0.00
      accuracy_floor = accuracy_raw if listing.shelf_state == OK
                       else min(accuracy_raw, ACCURACY_CAP_WHEN_NOT_OK)     # conditional on state
      blocking       = listing.open_blocking_error_count
      penalty        = 0  if blocking == 0
                       5  if 1 <= blocking <= 2
                       12 if 3 <= blocking <= 5
                       25 if blocking >= 6                                   # tiered selection
      bonus          = 5 if a EnhancedContentDeployment of this listing has state LIVE else 0
      readiness      = round_half_up(
                         min(100, max(0, (0.60*certified + 0.40*accuracy_floor) - penalty + bonus)),
                         2)
    input_set: "single listing; blocking counts RejectionErrors with severity BLOCKING and state OPEN across all SyndicationJobs of the listing; bonus needs at least one deployment in state LIVE (PENDING_RETAILER_APPROVAL does not earn it)"
    constants:
      CERTIFIED_WEIGHT: 0.60
      ACCURACY_WEIGHT: 0.40
      ACCURACY_CAP_WHEN_NOT_OK: 60.00
      PENALTY_TIER_1_2: 5
      PENALTY_TIER_3_5: 12
      PENALTY_TIER_6_PLUS: 25
      LIVE_ENHANCED_BONUS: 5
    precision: 2 decimal places, round_half_up
    worked_example: |
      certified 66.67, accuracy 40.10, shelf_state OK, 2 OPEN BLOCKING errors, no LIVE deployment
      -> 0.60*66.67 + 0.40*40.10 = 56.042; 56.042 - 5 + 0 = 51.042 -> 51.04
      certified 85.00, no observation (accuracy 0.00), shelf_state OK, 0 blocking, no deployment
      -> 0.60*85.00 + 0 = 51.00 -> 51.00

  - name: content_service_fee
    trigger: "computed at POST /digital-shelf/syndication-jobs and recomputed at POST /digital-shelf/syndication-jobs/{id}/requeue; written to SyndicationJob.service_fee_cents"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED AND MUST NOT BE ITERATED TO A FIXED POINT.
      # step 1
      subtotal_cents = PER_SKU_RATE_CENTS * slot_count
      # step 2 — the volume discount tier is keyed on SUBTOTAL
      discount_pct = 0.00 if subtotal_cents < 5000
                     0.05 if 5000  <= subtotal_cents < 15000
                     0.10 if 15000 <= subtotal_cents < 25000
                     0.15 if subtotal_cents >= 25000
      # step 3
      discounted_cents = round_half_up(subtotal_cents * (1 - discount_pct), 0)
      # step 4 — the rush surcharge tier is keyed on DISCOUNTED_CENTS (the pre-surcharge total),
      #          NEVER on the final total; keying it on the total would be circular because the
      #          surcharge itself can push the total across the 20000 boundary.
      rush = (window_start - current_utc) < RUSH_WINDOW_HOURS hours
      surcharge_pct = 0.00 if not rush
                      0.20 if rush AND discounted_cents < RUSH_TIER_BOUNDARY_CENTS
                      0.12 if rush AND discounted_cents >= RUSH_TIER_BOUNDARY_CENTS
      # step 5
      surcharge_cents = round_half_up(discounted_cents * surcharge_pct, 0)
      total_cents     = discounted_cents + surcharge_cents
    input_set: "single job; slot_count from the request, window_start from the request, current_utc from the logical clock at call time"
    constants:
      PER_SKU_RATE_CENTS: 2500
      RUSH_WINDOW_HOURS: 24
      RUSH_TIER_BOUNDARY_CENTS: 20000
    precision: "integer cents; round_half_up applied separately at step 3 and step 5, never to the raw product"
    worked_example: |
      slot_count 6, clock 2026-08-10T00:00:00Z, window_start 2026-08-10T12:00:00Z (12 h -> rush):
        subtotal 15000 -> discount 0.10 -> discounted 13500 -> 13500 < 20000 -> 0.20
        -> surcharge 2700 -> total 16200
      slot_count 10, clock 2026-08-10T00:00:00Z, window_start 2026-08-10T12:00:00Z:
        subtotal 25000 -> discount 0.15 -> discounted 21250 -> 21250 >= 20000 -> 0.12
        -> surcharge 2550 -> total 23800   (keying the tier on the total would have flip-flopped)
      slot_count 2, window_start 2026-08-15T00:00:00Z (> 24 h): 5000 -> 0.05 -> 4750 -> total 4750

  - name: content_conversion_lift
    trigger: "computed on demand by GET /digital-shelf/products/{id}/shelf-summary; the post_pin_window variant is also written to Product.conversion_lift_pct on every observation ingest for any listing of the product"
    algorithm: chronological
    formula: |
      OBS = every ShelfObservation whose retailer_listing_id belongs to a RetailerListing of this
            product, regardless of listing state, ordered by (observed_at ASC, created_at ASC)
      split OBS into HIGH and BASE per the selected variant (below)
      if HIGH is empty or BASE is empty: return 0.00                    # empty-group fallback
      mean_high = sum(o.conversion_rate_pct for o in HIGH) / count(HIGH)   # exact rational
      mean_base = sum(o.conversion_rate_pct for o in BASE) / count(BASE)   # exact rational
      if mean_base == 0: return 0.00                                     # zero-divisor fallback
      lift_pct  = round_half_up(100 * (mean_high - mean_base) / mean_base, 2)
    input_set: "all observations of all listings of the product; no state filter on the listing, no window cap on observation age"
    constants:
      QUALITY_SPLIT_ACCURACY_THRESHOLD: 90.00
    precision: "2 decimal places round_half_up, applied once to the final percentage; group means are exact rationals"
    variants:
      - name: post_pin_window
        when: "default variant; used for the stored Product.conversion_lift_pct and when lift_variant is omitted"
        difference: "HIGH = observations with observed_at >= Product.last_pinned_at; BASE = observations with observed_at < Product.last_pinned_at. When last_pinned_at is null every observation falls in BASE, HIGH is empty and the lift is 0.00."
      - name: quality_split
        when: "requested via lift_variant=quality_split on GET /digital-shelf/products/{id}/shelf-summary"
        difference: "HIGH = observations with content_accuracy_pct >= 90.00; BASE = observations with content_accuracy_pct < 90.00. Pin time is irrelevant, so the same rows regroup and the lift differs."
    worked_example: |
      last_pinned_at 2026-08-05T00:00:00Z; four observations (accuracy, conversion):
        O1 08-03 (82.00, 1.20)  O2 08-04 (91.00, 2.00)  O3 08-07 (92.00, 3.00)  O4 08-08 (86.00, 2.40)
      post_pin_window: HIGH {3.00, 2.40} mean 2.70 ; BASE {1.20, 2.00} mean 1.60 -> 68.75
      quality_split:   HIGH {2.00, 3.00} mean 2.50 ; BASE {1.20, 2.40} mean 1.80 -> 38.89

  - name: feed_slot_reservation_ledger
    trigger: "recomputed on every SyndicationJob state write (create, cancel, retailer-response, requeue, system invalidation) and written to Retailer.feed_slots_reserved"
    algorithm: aggregation
    formula: |
      Retailer.feed_slots_reserved =
        sum(job.slot_count
            for job in SyndicationJob
            if RetailerListing(job.retailer_listing_id).retailer_id == retailer.id
            and job.state IN {QUEUED, TRANSMITTED})
      # CONSERVED-QUANTITY INVARIANT (compensating action pairs):
      #   queue(job)  then cancel(job)      -> feed_slots_reserved returns to its pre-queue value
      #   queue(job)  then invalidate(job)  -> same
      #   queue(job)  then retailer-response(any outcome) -> same
      # Retailer.version increments on each of those writes, but the SUM must show zero drift.
    input_set: "jobs in the two holding states only; ACCEPTED, PARTIALLY_ACCEPTED, REJECTED, CANCELLED and INVALIDATED jobs release their slots"
    constants: {}
    precision: exact integer, no rounding
    worked_example: |
      capacity 6; queue slot_count 6 -> reserved 6 (6 + 0 == capacity is allowed, validations[priority=45]
      compares reserved + slot_count > capacity); cancel -> reserved 0; queue slot_count 7 -> rejected.

  - name: version_pin_reference_ledger
    trigger: "recomputed on the ChangeRequest approval join, on POST /digital-shelf/enhanced-deployments, on POST /digital-shelf/enhanced-deployments/{id}/retailer-decision and on POST /digital-shelf/enhanced-deployments/{id}/withdraw; written to ContentVersion.pin_count"
    algorithm: aggregation
    formula: |
      ContentVersion.pin_count =
          count(L for L in RetailerListing if L.pinned_content_version_id == version.id)
        + count(D for D in EnhancedContentDeployment
                if D.state IN {PENDING_RETAILER_APPROVAL, LIVE}
                and ChangeRequest(D.change_request_id).target_content_version_id == version.id)
      # CONSERVED-QUANTITY INVARIANT (compensating action pairs):
      #   create deployment then withdraw it            -> pin_count returns to its pre-create value
      #   create deployment then retailer REJECT         -> same
      #   approve CR (pin v_new) -> v_old loses exactly the one listing reference it held
      # GLOBAL INVARIANT: sum(pin_count over all ContentVersions)
      #   == count(listings with pinned_content_version_id != null)
      #    + count(deployments in {PENDING_RETAILER_APPROVAL, LIVE})
    input_set: "listing pin pointers plus deployments in the two active states; REJECTED and WITHDRAWN deployments contribute nothing"
    constants: {}
    precision: exact integer, no rounding
    worked_example: |
      v1 pinned on one listing -> pin_count 1; a deployment whose ChangeRequest targets v1 is created
      -> 2; withdraw -> 1; pinning v2 on the same listing -> v1 goes SUPERSEDED with pin_count 0
      and v2 has pin_count 1.

  - name: listing_shelf_projection
    trigger: "runs on POST /digital-shelf/retailer-listings/{id}/observations before any alert rule is evaluated"
    algorithm: projection
    formula: |
      latest = the last element of the listing's ShelfObservations sorted by
               (observed_at ASC, created_at ASC)      # never by id
      listing.search_rank_latest   = latest.search_rank
      listing.content_accuracy_pct = latest.content_accuracy_pct
      listing.rating_avg           = latest.rating_avg
      listing.in_stock             = latest.in_stock
      # A late-arriving observation with an OLDER observed_at than the current latest updates
      # nothing on the listing, but it still enters calculations.content_conversion_lift.
    input_set: "all observations of the listing; ordering tie between equal observed_at values is broken by created_at ASC (the later-inserted row wins because it sorts last)"
    constants:
      CONTENT_DRIFT_THRESHOLD: 85.00
    precision: values copied verbatim, no rounding
    worked_example: |
      observed_at 2026-08-07 (rank 4) ingested, then observed_at 2026-08-03 (rank 40) ingested:
      listing.search_rank_latest stays 4 because the second row sorts earlier.

  - name: alert_rollup
    trigger: "recomputed whenever a ShelfAlert is created or leaves {OPEN, ACKNOWLEDGED}; written to Product.open_alert_count and Product.governance_flag"
    algorithm: aggregation
    formula: |
      open_alerts = ShelfAlerts on any RetailerListing of this product with state IN {OPEN, ACKNOWLEDGED}
      Product.open_alert_count = count(open_alerts)
      # PRECEDENCE IS PINNED, evaluated top to bottom:
      Product.governance_flag =
        LISTING_RISK     if any a in open_alerts has alert_type == UNAUTHORIZED_LISTING
        CONTENT_AT_RISK  else if open_alert_count >= 1
        NONE             else
      # Alert de-duplication: a monitoring or syndication cascade never creates a second alert of
      # the same alert_type on the same listing while one is already in {OPEN, ACKNOWLEDGED}.
    input_set: "alerts across every listing of the product, both OPEN and ACKNOWLEDGED"
    constants: {}
    precision: exact integer, no rounding
    worked_example: |
      one OPEN CONTENT_DRIFT alert -> open_alert_count 1, governance_flag CONTENT_AT_RISK;
      a second alert of type UNAUTHORIZED_LISTING arrives -> count 2, flag LISTING_RISK;
      resolving only the UNAUTHORIZED_LISTING alert -> count 1, flag back to CONTENT_AT_RISK.

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the called endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "on POST /digital-shelf/change-requests/{id}/reviews the acting role matches the requested track: LegalReviewer may only send track LEGAL, BrandGovernanceApprover may only send track BRAND"
    error_id: ERR_TRACK_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /digital-shelf/change-requests/{id}/reviews"
  - priority: 4
    category: auth
    check: "when the acting role is RetailerIntegration, X-User-ID must equal the Retailer.id that owns the target resource (job -> listing.retailer_id, deployment -> listing.retailer_id, media asset -> a RetailerListing must exist for (asset.product_id, X-User-ID))"
    error_id: ERR_RETAILER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /digital-shelf/syndication-jobs/{id}/retailer-response, POST /digital-shelf/enhanced-deployments/{id}/retailer-decision, POST /digital-shelf/media-assets/{id}/retailer-decision"
  - priority: 5
    category: auth
    check: "segregation of duties (author): X-User-ID != ChangeRequest.author_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /digital-shelf/change-requests/{id}/reviews"
  - priority: 6
    category: auth
    check: "segregation of duties (two-person rule): X-User-ID != the other track's already-recorded reviewer_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /digital-shelf/change-requests/{id}/reviews"
  - priority: 7
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "every GET endpoint that declares limit? and offset?"
  - priority: 8
    category: business_constraint
    check: "every required body field is present, types match §1.1, enum values are members of the declared set, and no computed/system field is supplied as input (supplied values for computed/system fields are ignored, not rejected)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST, PATCH and PUT endpoints"
  - priority: 9
    category: business_temporal
    check: "window_end is strictly after window_start"
    error_id: ERR_WINDOW_INVALID
    http_status: 400
    applies_to: "POST /digital-shelf/syndication-jobs, POST /digital-shelf/syndication-jobs/{id}/requeue, POST /digital-shelf/enhanced-deployments"
  - priority: 10
    category: existence
    check: "the Retailer referenced by path or body exists"
    error_id: ERR_RETAILER_NOT_FOUND
    http_status: 404
    applies_to: "endpoints taking a retailer id in path or body"
  - priority: 11
    category: existence
    check: "the Product referenced by path or body exists"
    error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "endpoints taking a product id in path or body"
  - priority: 12
    category: existence
    check: "the ContentVersion referenced by path or body exists"
    error_id: ERR_CONTENT_VERSION_NOT_FOUND
    http_status: 404
    applies_to: "endpoints taking a content version id in path or body"
  - priority: 13
    category: existence
    check: "the RetailerListing referenced by path or body exists"
    error_id: ERR_LISTING_NOT_FOUND
    http_status: 404
    applies_to: "endpoints taking a retailer listing id in path or body"
  - priority: 14
    category: existence
    check: "the MediaAsset referenced by path or body exists"
    error_id: ERR_MEDIA_ASSET_NOT_FOUND
    http_status: 404
    applies_to: "POST /digital-shelf/media-assets/{id}/retailer-decision, GET /digital-shelf/media-assets/{id}, POST /digital-shelf/enhanced-deployments"
  - priority: 15
    category: existence
    check: "the ChangeRequest referenced by path or body exists"
    error_id: ERR_CHANGE_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "change-request endpoints and POST /digital-shelf/enhanced-deployments"
  - priority: 16
    category: existence
    check: "the SyndicationJob referenced by path exists"
    error_id: ERR_SYNDICATION_JOB_NOT_FOUND
    http_status: 404
    applies_to: "syndication-job endpoints"
  - priority: 17
    category: existence
    check: "the RejectionError referenced by path exists"
    error_id: ERR_REJECTION_ERROR_NOT_FOUND
    http_status: 404
    applies_to: "POST /digital-shelf/rejection-errors/{id}/resolve"
  - priority: 18
    category: existence
    check: "the EnhancedContentDeployment referenced by path exists"
    error_id: ERR_DEPLOYMENT_NOT_FOUND
    http_status: 404
    applies_to: "enhanced-deployment endpoints"
  - priority: 19
    category: existence
    check: "the ShelfAlert referenced by path exists"
    error_id: ERR_ALERT_NOT_FOUND
    http_status: 404
    applies_to: "shelf-alert endpoints"
  - priority: 20
    category: existence
    check: "every attribute_key supplied resolves to an AttributeDefinition.attribute_key"
    error_id: ERR_ATTRIBUTE_KEY_UNKNOWN
    http_status: 422
    applies_to: "POST /digital-shelf/retailers/{id}/requirements, POST /digital-shelf/content-versions/{id}/attribute-values, POST /digital-shelf/syndication-jobs/{id}/retailer-response (errors[].attribute_key)"
  - priority: 21
    category: business_constraint
    check: "no RetailerListing already exists for the (product_id, retailer_id) pair"
    error_id: ERR_DUPLICATE_LISTING
    http_status: 409
    applies_to: "POST /digital-shelf/retailer-listings"
  - priority: 22
    category: business_constraint
    check: "no RetailerRequirement already exists for the (retailer_id, attribute_key) pair"
    error_id: ERR_DUPLICATE_REQUIREMENT
    http_status: 409
    applies_to: "POST /digital-shelf/retailers/{id}/requirements"
  - priority: 23
    category: state
    check: "the OCC field (expected_retailer_version / expected_product_version / expected_retailer_listing_version) equals the current version of the named parent entity"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /digital-shelf/syndication-jobs, POST /digital-shelf/syndication-jobs/{id}/requeue, POST /digital-shelf/change-requests/{id}/reviews, POST /digital-shelf/enhanced-deployments, PATCH /digital-shelf/retailers/{id}"
  - priority: 24
    category: state
    check: "Retailer.status == ACTIVE"
    error_id: ERR_RETAILER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /digital-shelf/retailer-listings, POST /digital-shelf/change-requests/{id}/submit, POST /digital-shelf/syndication-jobs, POST /digital-shelf/syndication-jobs/{id}/transmit, POST /digital-shelf/syndication-jobs/{id}/requeue, POST /digital-shelf/enhanced-deployments"
  - priority: 25
    category: state
    check: "the target ContentVersion.state == DRAFT"
    error_id: ERR_VERSION_NOT_DRAFT
    http_status: 409
    applies_to: "POST /digital-shelf/content-versions/{id}/attribute-values, POST /digital-shelf/change-requests, POST /digital-shelf/change-requests/{id}/submit"
  - priority: 26
    category: state
    check: "ChangeRequest.state == DRAFT"
    error_id: ERR_CHANGE_REQUEST_NOT_DRAFT
    http_status: 409
    applies_to: "POST /digital-shelf/change-requests/{id}/submit"
  - priority: 27
    category: state
    check: "ChangeRequest.state == IN_REVIEW"
    error_id: ERR_CHANGE_REQUEST_NOT_IN_REVIEW
    http_status: 409
    applies_to: "POST /digital-shelf/change-requests/{id}/reviews"
  - priority: 28
    category: state
    check: "the requested track's review state is still PENDING"
    error_id: ERR_TRACK_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /digital-shelf/change-requests/{id}/reviews"
  - priority: 29
    category: state
    check: "the job's state is a legal `from:` for the requested transition per state_machines.SyndicationJob (QUEUED for transmit; TRANSMITTED for retailer-response; REJECTED or PARTIALLY_ACCEPTED for requeue; QUEUED or TRANSMITTED for cancel)"
    error_id: ERR_INVALID_JOB_STATE
    http_status: 409
    applies_to: "POST /digital-shelf/syndication-jobs/{id}/transmit, POST /digital-shelf/syndication-jobs/{id}/retailer-response, POST /digital-shelf/syndication-jobs/{id}/requeue, POST /digital-shelf/syndication-jobs/{id}/cancel"
  - priority: 30
    category: state
    check: "RejectionError.state == OPEN"
    error_id: ERR_REJECTION_ERROR_ALREADY_CLOSED
    http_status: 409
    applies_to: "POST /digital-shelf/rejection-errors/{id}/resolve"
  - priority: 31
    category: state
    check: "every RejectionError of the job with severity BLOCKING has state IN {RESOLVED, WAIVED}"
    error_id: ERR_BLOCKING_ERRORS_UNRESOLVED
    http_status: 409
    applies_to: "POST /digital-shelf/syndication-jobs/{id}/requeue"
  - priority: 32
    category: state
    check: "the deployment is in an actionable state (PENDING_RETAILER_APPROVAL for retailer-decision; PENDING_RETAILER_APPROVAL or LIVE for withdraw)"
    error_id: ERR_DEPLOYMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /digital-shelf/enhanced-deployments/{id}/retailer-decision, POST /digital-shelf/enhanced-deployments/{id}/withdraw"
  - priority: 33
    category: state
    check: "ShelfAlert.state != RESOLVED (and == OPEN for acknowledge)"
    error_id: ERR_ALERT_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /digital-shelf/shelf-alerts/{id}/acknowledge, POST /digital-shelf/shelf-alerts/{id}/resolve"
  - priority: 34
    category: state
    check: "RetailerListing.shelf_state NOT IN {SUSPENDED, UNAUTHORIZED}"
    error_id: ERR_LISTING_SHELF_BLOCKED
    http_status: 409
    applies_to: "POST /digital-shelf/syndication-jobs, POST /digital-shelf/syndication-jobs/{id}/requeue, POST /digital-shelf/enhanced-deployments"
  - priority: 35
    category: business_safety
    check: "the stripped attribute value contains none of the PROHIBITED_CLAIM_TOKENS (case-insensitive substring match on 'cures', 'fda approved', '100% guaranteed')"
    error_id: ERR_PROHIBITED_CLAIM
    http_status: 422
    applies_to: "POST /digital-shelf/content-versions/{id}/attribute-values"
  - priority: 36
    category: business_referential
    check: "the job's ContentVersion.state == PINNED and its product_id equals the listing's product_id"
    error_id: ERR_VERSION_NOT_PINNED
    http_status: 422
    applies_to: "POST /digital-shelf/syndication-jobs, POST /digital-shelf/syndication-jobs/{id}/requeue"
  - priority: 37
    category: business_referential
    check: "ChangeRequest.state == APPROVED"
    error_id: ERR_CHANGE_REQUEST_NOT_APPROVED
    http_status: 422
    applies_to: "POST /digital-shelf/enhanced-deployments"
  - priority: 38
    category: business_referential
    check: "ChangeRequest.retailer_id == listing.retailer_id AND ChangeRequest.product_id == listing.product_id AND MediaAsset.product_id == listing.product_id"
    error_id: ERR_DEPLOYMENT_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /digital-shelf/enhanced-deployments"
  - priority: 39
    category: business_referential
    check: "MediaAsset.approval_state == APPROVED"
    error_id: ERR_MEDIA_ASSET_NOT_APPROVED
    http_status: 422
    applies_to: "POST /digital-shelf/enhanced-deployments"
  - priority: 40
    category: business_constraint
    check: "char_count of the stripped value <= AttributeDefinition(attribute_key).max_chars (the global taxonomy ceiling; retailer max_chars_override is NOT a write-time limit, it only withholds certified credit)"
    error_id: ERR_ATTRIBUTE_LENGTH_EXCEEDED
    http_status: 422
    applies_to: "POST /digital-shelf/content-versions/{id}/attribute-values"
  - priority: 41
    category: business_constraint
    check: "count of MediaAssets of the product with asset_role IN {HERO_IMAGE, SECONDARY_IMAGE} and approval_state APPROVED >= Retailer.min_image_count"
    error_id: ERR_IMAGE_COUNT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /digital-shelf/enhanced-deployments"
  - priority: 42
    category: business_constraint
    check: "RetailerListing.completeness_score_certified >= 85.00 (a listing sitting exactly at 85.00 passes)"
    error_id: ERR_COMPLETENESS_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /digital-shelf/syndication-jobs, POST /digital-shelf/syndication-jobs/{id}/requeue"
  - priority: 43
    category: business_temporal
    check: "the HALF-OPEN window [window_start, window_end) does not intersect the half-open window of any EnhancedContentDeployment of the SAME RetailerListing in state IN {PENDING_RETAILER_APPROVAL, LIVE}; touching endpoints (previous.window_end == new.window_start) do NOT intersect and are allowed"
    error_id: ERR_DEPLOYMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /digital-shelf/enhanced-deployments"
  - priority: 44
    category: business_temporal
    check: "count of SyndicationJobs of the SAME Retailer (across all its listings) in state IN {QUEUED, TRANSMITTED} whose CLOSED window [window_start, window_end] intersects the new CLOSED window is < Retailer.max_concurrent_feed_windows; under closed-interval arithmetic a new window starting exactly at an existing window's end DOES count as intersecting"
    error_id: ERR_FEED_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /digital-shelf/syndication-jobs, POST /digital-shelf/syndication-jobs/{id}/requeue"
  - priority: 45
    category: business_fiscal
    check: "Retailer.feed_slots_reserved + slot_count <= Retailer.feed_slot_capacity (landing exactly on capacity is allowed)"
    error_id: ERR_FEED_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /digital-shelf/syndication-jobs, POST /digital-shelf/syndication-jobs/{id}/requeue"
  - priority: 46
    category: auth
    check: "resolution_mode WAIVE against a RejectionError whose severity is BLOCKING requires the acting role to be ShelfAdmin; a SyndicationOperator may FIX any row and WAIVE a WARNING row but may never WAIVE a BLOCKING row (§1.7)"
    error_id: ERR_WAIVE_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /digital-shelf/rejection-errors/{id}/resolve"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
# Read endpoints are open to all seven roles; every write is scoped to the role that owns the
# operation. Path placeholders use `{id}` for the first path id of every route.
endpoints:
  # ---------------- retailer configuration ----------------
  - method: POST
    path: "/digital-shelf/retailers"
    description: "onboard a retailer account with its content requirements envelope (image minimum, feed slot capacity, concurrent window allowance, enhanced-content approval flag)"
    roles: [ShelfAdmin]
    code: 201
    input: [name, retailer_code, "status?", "min_image_count?", "feed_slot_capacity?", "max_concurrent_feed_windows?", "enhanced_content_requires_approval?"]
    output: Retailer
    side_effects: ["feed_slots_reserved initialised to 0", "version initialised to 1"]
  - method: GET
    path: "/digital-shelf/retailers/{id}"
    description: read one retailer including its live feed_slots_reserved
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: []
    output: Retailer
    side_effects: []
  - method: GET
    path: "/digital-shelf/retailers"
    description: list retailers with optional status filter and pagination
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Retailer[]
    side_effects: []
  - method: PATCH
    path: "/digital-shelf/retailers/{id}"
    description: "adjust a retailer's requirement envelope; OCC-guarded because the same version field carries the feed-slot ledger"
    roles: [ShelfAdmin]
    code: 200
    input: [expected_retailer_version, "status?", "min_image_count?", "feed_slot_capacity?", "max_concurrent_feed_windows?", "enhanced_content_requires_approval?"]
    output: Retailer
    side_effects:
      - "increments Retailer.version by 1"
      - "recomputes completeness_score_declared, completeness_score_certified and readiness_score of every RetailerListing of this retailer (min_image_count feeds the image component)"
      - "recomputes shelf_health_index of every affected Product"
  - method: POST
    path: "/digital-shelf/retailers/{id}/requirements"
    description: declare one retailer-specific attribute requirement (level, character override, weight override)
    roles: [ShelfAdmin]
    code: 201
    input: [attribute_key, requirement_level, "max_chars_override?", "weight_override?"]
    output: RetailerRequirement
    side_effects:
      - "recomputes both completeness variants and readiness_score of every RetailerListing of this retailer"
      - "recomputes shelf_health_index of every affected Product"
  - method: GET
    path: "/digital-shelf/retailers/{id}/requirements"
    description: "reverse-reachability read for RetailerRequirement.retailer_id — list a retailer's requirement rows"
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: ["limit?", "offset?"]
    output: RetailerRequirement[]
    side_effects: []
  - method: POST
    path: "/digital-shelf/attribute-definitions"
    description: add an attribute to the global taxonomy with its global character ceiling and base completeness weight
    roles: [ShelfAdmin]
    code: 201
    input: [attribute_key, data_type, taxonomy_group, max_chars, base_weight, "is_global_required?"]
    output: AttributeDefinition
    side_effects: []
  - method: GET
    path: "/digital-shelf/attribute-definitions"
    description: list the attribute taxonomy with optional group filter and pagination
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: ["taxonomy_group?", "limit?", "offset?"]
    output: AttributeDefinition[]
    side_effects: []

  # ---------------- products, revisions, attribute values ----------------
  - method: POST
    path: "/digital-shelf/products"
    description: register a product in the PIM
    roles: [ContentAuthor]
    code: 201
    input: [sku, gtin, category_code, brand_code]
    output: Product
    side_effects: ["status DRAFT, shelf_health_index 0.00, conversion_lift_pct 0.00, open_alert_count 0, governance_flag NONE"]
  - method: GET
    path: "/digital-shelf/products/{id}"
    description: read one product with its rolled-up governance and health fields
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: GET
    path: "/digital-shelf/products"
    description: list products filtered by status or governance_flag
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: ["status?", "governance_flag?", "limit?", "offset?"]
    output: Product[]
    side_effects: []
  - method: GET
    path: "/digital-shelf/products/{id}/shelf-summary"
    description: "computed read — per-retailer subscores, the two-stage-rounded shelf_health_index, and the conversion lift under the requested variant (lift_variant defaults to post_pin_window)"
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: ["lift_variant?"]
    output: { product_id: string, shelf_health_index: number, qualifying_listing_count: integer, retailer_subscores: array, conversion_lift_pct: number, lift_variant: string, high_group_size: integer, base_group_size: integer }
    side_effects: []
  - method: POST
    path: "/digital-shelf/content-versions"
    description: open a new DRAFT content revision for a product, optionally naming the revision it supersedes
    roles: [ContentAuthor]
    code: 201
    input: [product_id, "supersedes_content_version_id?", "image_count?"]
    output: ContentVersion
    side_effects:
      - "revision_no := 1 + count of existing revisions of the product"
      - "author_user_id := X-User-ID"
      - "recomputes completeness_score_declared of every RetailerListing of the product (the new revision becomes the DECLARED source)"
  - method: GET
    path: "/digital-shelf/content-versions/{id}"
    description: read one content revision including state and pin_count
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: []
    output: ContentVersion
    side_effects: []
  - method: GET
    path: "/digital-shelf/content-versions"
    description: "reverse-reachability read for ContentVersion.product_id and ContentVersion.supersedes_content_version_id — list revisions by product, by superseded predecessor, or by state"
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: ["product_id?", "supersedes_content_version_id?", "state?", "limit?", "offset?"]
    output: ContentVersion[]
    side_effects: []
  - method: POST
    path: "/digital-shelf/content-versions/{id}/attribute-values"
    description: "upsert one attribute value on a DRAFT revision (a second POST on the same attribute_key replaces the row)"
    roles: [ContentAuthor]
    code: 201
    input: [attribute_key, value]
    output: ContentAttributeValue
    side_effects:
      - "char_count and type_valid computed from the stripped value"
      - "recomputes completeness_score_declared and completeness_score_certified plus readiness_score of every RetailerListing of the revision's product"
      - "recomputes shelf_health_index of the product"
  - method: GET
    path: "/digital-shelf/content-versions/{id}/attribute-values"
    description: "reverse-reachability read for ContentAttributeValue.content_version_id — list the attribute values of a revision"
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: ["limit?", "offset?"]
    output: ContentAttributeValue[]
    side_effects: []

  # ---------------- rich media ----------------
  - method: POST
    path: "/digital-shelf/media-assets"
    description: register a rich-media asset for a product; it starts PENDING retailer approval
    roles: [ContentAuthor]
    code: 201
    input: [product_id, asset_role, source_uri]
    output: MediaAsset
    side_effects: ["approval_state PENDING, approving_retailer_id null"]
  - method: GET
    path: "/digital-shelf/media-assets/{id}"
    description: read one media asset with its approval posture
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: []
    output: MediaAsset
    side_effects: []
  - method: GET
    path: "/digital-shelf/media-assets"
    description: "reverse-reachability read for MediaAsset.product_id and MediaAsset.approving_retailer_id — list assets by product, approval state or approving retailer"
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: ["product_id?", "approval_state?", "approving_retailer_id?", "limit?", "offset?"]
    output: MediaAsset[]
    side_effects: []
  - method: POST
    path: "/digital-shelf/media-assets/{id}/retailer-decision"
    description: "retailer approves or rejects a rich-media asset for its own listings (decision APPROVE | REJECT)"
    roles: [RetailerIntegration]
    code: 200
    input: [decision]
    output: MediaAsset
    side_effects:
      - "approval_state := APPROVED or REJECTED; approving_retailer_id := X-User-ID; decided_at := logical clock"
      - "on APPROVE recomputes completeness_score_certified and readiness_score of the (product, acting retailer) RetailerListing"

  # ---------------- listings and monitoring ----------------
  - method: POST
    path: "/digital-shelf/retailer-listings"
    description: create the Product x Retailer junction listing and name its account-team owner
    roles: [ContentAuthor]
    code: 201
    input: [product_id, retailer_id, "account_team_user_id?"]
    output: RetailerListing
    side_effects: ["syndication_state NOT_SYNDICATED, shelf_state OK, in_stock true", "both completeness variants and readiness_score computed immediately (0.00 when nothing is pinned)"]
  - method: GET
    path: "/digital-shelf/retailer-listings/{id}"
    description: read one listing with both state dimensions and all three scores
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: []
    output: RetailerListing
    side_effects: []
  - method: GET
    path: "/digital-shelf/retailer-listings"
    description: "reverse-reachability read for RetailerListing.product_id, RetailerListing.retailer_id and RetailerListing.pinned_content_version_id — filter listings on either junction side, on the pinned revision, or on either state dimension"
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: ["product_id?", "retailer_id?", "pinned_content_version_id?", "syndication_state?", "shelf_state?", "limit?", "offset?"]
    output: RetailerListing[]
    side_effects: []
  - method: GET
    path: "/digital-shelf/retailer-listings/{id}/completeness"
    description: "computed read — both completeness variants side by side with the source revision each used, the missing REQUIRED keys and the keys that failed the retailer character ceiling"
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: []
    output: { retailer_listing_id: string, declared_score: number, certified_score: number, declared_source_content_version_id: string, certified_source_content_version_id: string, requirement_weight_total: number, missing_required_keys: array, over_limit_keys: array, declared_image_component: number, certified_image_component: number }
    side_effects: []
  - method: POST
    path: "/digital-shelf/retailer-listings/{id}/observations"
    description: "ingest one digital-shelf crawl observation (search rank, availability, content accuracy, ratings, unauthorized sellers, conversion) — the monitoring entry point"
    roles: [ShelfAdmin]
    code: 201
    input: [observed_at, in_stock, content_accuracy_pct, rating_avg, rating_count, unauthorized_seller_count, conversion_rate_pct, units_sold, "search_rank?"]
    output: ShelfObservation
    side_effects:
      - "appends the observation and re-projects listing.search_rank_latest / content_accuracy_pct / rating_avg / in_stock per calculations.listing_shelf_projection"
      - "shelf_state re-derived with precedence SUSPENDED > UNAUTHORIZED > OOS_WATCH > OK"
      - "raises ShelfAlert OUT_OF_STOCK (in_stock false), UNAUTHORIZED_LISTING (unauthorized_seller_count >= 1), CONTENT_DRIFT (content_accuracy_pct < 85.00), de-duplicated against OPEN/ACKNOWLEDGED alerts of the same type on the listing"
      - "auto-resolves OPEN/ACKNOWLEDGED OUT_OF_STOCK alerts when in_stock is true again"
      - "recomputes listing.readiness_score, Product.shelf_health_index, Product.conversion_lift_pct (post_pin_window), Product.open_alert_count, Product.governance_flag; raises a HEALTH_DEGRADED ShelfAlert on this listing ONLY when the listing is in the health input set (syndication_state IN {LIVE, ERROR_HOLD}) AND the recomputed index < 60.00 — a NOT_SYNDICATED or PENDING listing never raises it, so the empty-set index of 0.00 is not an alert condition"
      - "increments Product.version by 1"
  - method: GET
    path: "/digital-shelf/retailer-listings/{id}/observations"
    description: "reverse-reachability read for ShelfObservation.retailer_listing_id — the append-only observation log of a listing"
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: ["limit?", "offset?"]
    output: ShelfObservation[]
    side_effects: []
  - method: POST
    path: "/digital-shelf/retailer-listings/{id}/shelf-status"
    description: "account-team follow-up action — suspend a listing or clear it back to OK after unauthorized-seller enforcement"
    roles: [AccountTeamLead]
    code: 200
    input: [shelf_state]
    output: RetailerListing
    side_effects:
      - "shelf_state := SUSPENDED or OK; syndication_state untouched"
      - "on OK resolves every OPEN/ACKNOWLEDGED UNAUTHORIZED_LISTING alert of the listing with resolution_note AUTO_CLEARED_BY_ACCOUNT_TEAM"
      - "recomputes readiness_score, Product.open_alert_count, Product.governance_flag; increments Product.version by 1"

  # ---------------- content change governance ----------------
  - method: POST
    path: "/digital-shelf/change-requests"
    description: raise a governed change request that proposes pinning a target revision onto one retailer listing
    roles: [ContentAuthor]
    code: 201
    input: [product_id, retailer_id, target_content_version_id, rationale]
    output: ChangeRequest
    side_effects: ["state DRAFT, legal_review_state and brand_review_state PENDING", "author_user_id := X-User-ID (validations[priority=5] later bars this user from either review track)"]
  - method: GET
    path: "/digital-shelf/change-requests/{id}"
    description: read one change request with both review tracks
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: []
    output: ChangeRequest
    side_effects: []
  - method: GET
    path: "/digital-shelf/change-requests"
    description: "reverse-reachability read for ChangeRequest.product_id, ChangeRequest.retailer_id and ChangeRequest.target_content_version_id — list change requests by product, retailer, target revision or state"
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: ["product_id?", "retailer_id?", "target_content_version_id?", "state?", "limit?", "offset?"]
    output: ChangeRequest[]
    side_effects: []
  - method: POST
    path: "/digital-shelf/change-requests/{id}/submit"
    description: submit a DRAFT change request for the two-track review; the target revision moves to IN_REVIEW
    roles: [ContentAuthor]
    code: 200
    input: []
    output: ChangeRequest
    side_effects:
      - "ChangeRequest DRAFT -> IN_REVIEW; submitted_at := logical clock"
      - "target ContentVersion DRAFT -> IN_REVIEW"
      - "no new content screen runs here: validations[priority=35] already rejected prohibited claims at attribute-value write time"
  - method: POST
    path: "/digital-shelf/change-requests/{id}/reviews"
    description: "record one track decision (LEGAL or BRAND, decision APPROVED or REJECTED); the join fires only when both tracks agree — an APPROVED/APPROVED join pins the revision, any REJECTED sends the request to REJECTED and the revision back to DRAFT"
    roles: [LegalReviewer, BrandGovernanceApprover]
    code: 200
    input: [track, decision, expected_product_version]
    output: ChangeRequest
    side_effects:
      - "sets legal_review_state or brand_review_state; records legal_reviewer_user_id or brand_reviewer_user_id"
      - "on a single APPROVED with the other track still PENDING the request stays IN_REVIEW (self-loop)"
      - "on APPROVED + APPROVED: state -> APPROVED, decided_at set, target ContentVersion IN_REVIEW -> PINNED, the prior pinned revision of each touched listing -> SUPERSEDED, RetailerListing.pinned_content_version_id repointed, ContentVersion.pin_count adjusted on both revisions"
      - "on APPROVED + APPROVED: recomputes completeness_score_certified, completeness_score_declared and readiness_score of each touched RetailerListing and Product.shelf_health_index"
      - "on any REJECTED: state -> REJECTED, target ContentVersion IN_REVIEW -> DRAFT, no pin changes"
      - "increments Product.version by 1"

  # ---------------- syndication distribution ----------------
  - method: POST
    path: "/digital-shelf/syndication-jobs"
    description: "queue a syndication feed job for one listing inside a reserved retailer feed window; reserves slot_count feed slots and one concurrent window"
    roles: [SyndicationOperator]
    code: 201
    input: [retailer_listing_id, content_version_id, slot_count, window_start, window_end, expected_retailer_version]
    output: SyndicationJob
    side_effects:
      - "state QUEUED, attempt_no 1, readiness_at_queue and service_fee_cents frozen"
      - "Retailer.feed_slots_reserved += slot_count; Retailer.version incremented by 1"
      - "ContentVersion.pin_count unchanged (the job references, it does not pin)"
      - "RetailerListing.syndication_state NOT_SYNDICATED -> PENDING"
  - method: GET
    path: "/digital-shelf/syndication-jobs/{id}"
    description: read one syndication job with its state, attempt counter and frozen fee
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: []
    output: SyndicationJob
    side_effects: []
  - method: GET
    path: "/digital-shelf/syndication-jobs"
    description: "reverse-reachability read for SyndicationJob.retailer_listing_id and SyndicationJob.content_version_id — list jobs by listing, by transmitted revision or by state"
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: ["retailer_listing_id?", "content_version_id?", "state?", "limit?", "offset?"]
    output: SyndicationJob[]
    side_effects: []
  - method: POST
    path: "/digital-shelf/syndication-jobs/{id}/transmit"
    description: transmit a QUEUED job to the retailer feed endpoint
    roles: [SyndicationOperator]
    code: 200
    input: []
    output: SyndicationJob
    side_effects: ["state QUEUED -> TRANSMITTED; transmitted_at := logical clock", "slots stay reserved — TRANSMITTED is still a holding state of calculations.feed_slot_reservation_ledger", "no completeness or image gate runs here: validations[priority=42] already gated the queue call"]
  - method: POST
    path: "/digital-shelf/syndication-jobs/{id}/retailer-response"
    description: "retailer confirms acceptance, partial acceptance or rejection of a transmitted job and attaches per-row rejection errors"
    roles: [RetailerIntegration]
    code: 200
    input: [outcome, "errors?"]
    output: SyndicationJob
    side_effects:
      - "state TRANSMITTED -> ACCEPTED | PARTIALLY_ACCEPTED | REJECTED; responded_at recorded"
      - "creates one RejectionError per element of errors, in request order, each with the supplied severity BLOCKING or WARNING and state OPEN"
      - "every outcome releases the reservation: Retailer.feed_slots_reserved recomputed per calculations.feed_slot_reservation_ledger (the job leaves {QUEUED, TRANSMITTED}), Retailer.version += 1"
      - "on ACCEPTED: RetailerListing.syndication_state -> LIVE; the listing pin pointer is NOT touched (pinning is owned by the ChangeRequest join), readiness_score and Product.shelf_health_index recomputed because the listing now qualifies for the health input set"
      - "on PARTIALLY_ACCEPTED (every error row severity WARNING): RetailerListing.syndication_state -> LIVE, open_blocking_error_count unchanged"
      - "on REJECTED (at least one BLOCKING row): RetailerListing.syndication_state -> ERROR_HOLD, open_blocking_error_count recomputed, readiness_score re-penalised, Product.shelf_health_index recomputed and a HEALTH_DEGRADED ShelfAlert raised when the index falls below 60.00"
  - method: GET
    path: "/digital-shelf/syndication-jobs/{id}/rejection-errors"
    description: "reverse-reachability read for RejectionError.syndication_job_id — list the rejection errors raised against a job"
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: ["severity?", "state?", "limit?", "offset?"]
    output: RejectionError[]
    side_effects: []
  - method: POST
    path: "/digital-shelf/rejection-errors/{id}/resolve"
    description: resolve or waive one rejection error; waiving a BLOCKING error is reserved to the shelf admin
    roles: [SyndicationOperator, ShelfAdmin]
    code: 200
    input: [resolution_mode, resolution_note]
    output: RejectionError
    side_effects:
      - "state OPEN -> RESOLVED (resolution_mode FIX) or WAIVED (resolution_mode WAIVE); resolved_at and resolved_by_user_id recorded"
      - "when the call closes the last OPEN BLOCKING row of the job and no job of the listing is in {QUEUED, TRANSMITTED}, RetailerListing.syndication_state ERROR_HOLD -> NOT_SYNDICATED and readiness_score is recomputed with penalty tier 0"
      - "the job becomes eligible for requeue once it has no remaining OPEN BLOCKING errors"
  - method: POST
    path: "/digital-shelf/syndication-jobs/{id}/requeue"
    description: "cycle a REJECTED or PARTIALLY_ACCEPTED job back to QUEUED after its blocking errors are cleared; consumes a fresh reservation delta if slot_count changed"
    roles: [SyndicationOperator]
    code: 200
    input: ["slot_count?", "window_start?", "window_end?", "expected_retailer_version?"]
    output: SyndicationJob
    side_effects:
      - "state REJECTED | PARTIALLY_ACCEPTED -> QUEUED; attempt_no incremented by 1; window_start/window_end and slot_count overwritten when supplied; transmitted_at and responded_at reset to null"
      - "Retailer.feed_slots_reserved recomputed per calculations.feed_slot_reservation_ledger — the job re-enters QUEUED so slot_count is reserved again; Retailer.version incremented by 1"
      - "readiness_at_queue and service_fee_cents recomputed at the current clock position"
      - "RetailerListing.syndication_state NOT_SYNDICATED (post-resolution) or LIVE (post-partial-acceptance) -> PENDING"
  - method: POST
    path: "/digital-shelf/syndication-jobs/{id}/cancel"
    description: cancel a job that has not yet been accepted and release its whole reservation
    roles: [SyndicationOperator]
    code: 200
    input: []
    output: SyndicationJob
    side_effects:
      - "state QUEUED | TRANSMITTED -> CANCELLED (validations[priority=29] rejects any other state)"
      - "Retailer.feed_slots_reserved recomputed per calculations.feed_slot_reservation_ledger (releases slot_count when the job was QUEUED or TRANSMITTED); Retailer.version incremented by 1"
      - "every OPEN RejectionError of the job -> WAIVED with resolution_note CANCELLED_WITH_JOB"
      - "RetailerListing.syndication_state -> NOT_SYNDICATED when no other non-terminal job exists for the listing, otherwise unchanged"

  # ---------------- enhanced content / rich media deployment ----------------
  - method: POST
    path: "/digital-shelf/enhanced-deployments"
    description: "deploy an enhanced-content module (A+ page, comparison chart, video block) onto a live listing for a bounded display window; the initial state depends on the retailer's approval flag"
    roles: [ContentAuthor]
    code: 201
    input: [retailer_listing_id, change_request_id, media_asset_id, module_kind, window_start, window_end, expected_retailer_listing_version]
    output: EnhancedContentDeployment
    side_effects:
      - "state := PENDING_RETAILER_APPROVAL when Retailer.enhanced_content_requires_approval is true, otherwise LIVE with retailer_decision_at left null (no retailer decision was required)"
      - "when the deployment lands LIVE it re-enters readiness_score with the LIVE_ENHANCED_BONUS and recomputes Product.shelf_health_index"
      - "increments RetailerListing.version by 1"
  - method: GET
    path: "/digital-shelf/enhanced-deployments/{id}"
    description: read one enhanced-content deployment with its window and approval posture
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: []
    output: EnhancedContentDeployment
    side_effects: []
  - method: GET
    path: "/digital-shelf/enhanced-deployments"
    description: "reverse-reachability read for EnhancedContentDeployment.retailer_listing_id, .change_request_id and .media_asset_id — list deployments by listing, governing change request, asset or state"
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: ["retailer_listing_id?", "change_request_id?", "media_asset_id?", "state?", "limit?", "offset?"]
    output: EnhancedContentDeployment[]
    side_effects: []
  - method: POST
    path: "/digital-shelf/enhanced-deployments/{id}/retailer-decision"
    description: "retailer approves or rejects a pending enhanced-content deployment (decision APPROVE | REJECT)"
    roles: [RetailerIntegration]
    code: 200
    input: [decision]
    output: EnhancedContentDeployment
    side_effects:
      - "state PENDING_RETAILER_APPROVAL -> LIVE or REJECTED; retailer_decision_at := logical clock"
      - "on LIVE recomputes readiness_score of the listing with the LIVE_ENHANCED_BONUS and Product.shelf_health_index"
      - "increments RetailerListing.version by 1"
  - method: POST
    path: "/digital-shelf/enhanced-deployments/{id}/withdraw"
    description: "withdraw a pending or live deployment; the readiness bonus is reversed with no drift"
    roles: [ContentAuthor]
    code: 200
    input: ["withdrawn_reason?"]
    output: EnhancedContentDeployment
    side_effects:
      - "state PENDING_RETAILER_APPROVAL | LIVE -> WITHDRAWN; withdrawn_reason recorded"
      - "reverses the LIVE_ENHANCED_BONUS in readiness_score and recomputes Product.shelf_health_index"
      - "increments RetailerListing.version by 1"

  # ---------------- alerts and account-team follow-up ----------------
  - method: GET
    path: "/digital-shelf/shelf-alerts/{id}"
    description: read one shelf alert
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: []
    output: ShelfAlert
    side_effects: []
  - method: GET
    path: "/digital-shelf/shelf-alerts"
    description: "reverse-reachability read for ShelfAlert.retailer_listing_id and ShelfAlert.source_observation_id — list alerts by listing, by originating observation, by type or by state"
    roles: [ShelfAdmin, ContentAuthor, LegalReviewer, BrandGovernanceApprover, SyndicationOperator, RetailerIntegration, AccountTeamLead]
    code: 200
    input: ["retailer_listing_id?", "source_observation_id?", "alert_type?", "state?", "limit?", "offset?"]
    output: ShelfAlert[]
    side_effects: []
  - method: POST
    path: "/digital-shelf/shelf-alerts/{id}/acknowledge"
    description: account team acknowledges an open alert and takes ownership of the follow-up
    roles: [AccountTeamLead]
    code: 200
    input: []
    output: ShelfAlert
    side_effects: ["state OPEN -> ACKNOWLEDGED; acknowledged_by_user_id := X-User-ID; Product.open_alert_count unchanged"]
  - method: POST
    path: "/digital-shelf/shelf-alerts/{id}/resolve"
    description: account team closes an alert with a resolution note
    roles: [AccountTeamLead]
    code: 200
    input: [resolution_note]
    output: ShelfAlert
    side_effects:
      - "state OPEN | ACKNOWLEDGED -> RESOLVED; resolved_at recorded"
      - "recomputes Product.open_alert_count and Product.governance_flag; increments Product.version by 1"

  # ---------------- logical clock ----------------
  - method: POST
    path: "/digital-shelf/_clock/set_current_utc"
    description: "set the deterministic logical clock used for rush-window classification, window overlap checks and every *_at stamp; the clock starts at 2026-08-01T00:00:00Z"
    roles: [ShelfAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all subsequent system timestamps derive from this value; no entity is mutated"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
# Grouped auth -> request-shape -> not-found -> uniqueness -> concurrency -> state -> business.
# Every id below is the error_id of at least one §1.4 row, so every id is triggerable.
errors:
  # --- authentication and authorisation ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_TRACK_ROLE_MISMATCH
    http: 403
    condition: "LegalReviewer posts a review on track BRAND, or BrandGovernanceApprover posts a review on track LEGAL"
  - id: ERR_RETAILER_SCOPE_VIOLATION
    http: 403
    condition: "a RetailerIntegration user acts on a job, deployment or media asset whose retailer_id is not the acting X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the change request's author_user_id decides one of its review tracks, or the same X-User-ID decides both the LEGAL and the BRAND track"
  - id: ERR_WAIVE_NOT_PERMITTED
    http: 403
    condition: "a SyndicationOperator sends resolution_mode WAIVE against a RejectionError whose severity is BLOCKING; only ShelfAdmin may waive a blocking feed error"
  # --- request shape ---
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit < 1, limit > 100, or offset < 0"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required field is missing, an enum value is unknown, a decimal is negative where forbidden, or slot_count < 1"
  - id: ERR_WINDOW_INVALID
    http: 400
    condition: "window_end <= window_start, or a window bound is not a parseable ISO-8601 UTC instant"
  # --- not found ---
  - id: ERR_RETAILER_NOT_FOUND
    http: 404
    condition: "the referenced retailer id does not exist"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "the referenced product id does not exist"
  - id: ERR_CONTENT_VERSION_NOT_FOUND
    http: 404
    condition: "the referenced content version id (target, supersedes or transmitted) does not exist"
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "the referenced retailer listing id does not exist, or no listing exists for the (product_id, retailer_id) pair the operation implies"
  - id: ERR_MEDIA_ASSET_NOT_FOUND
    http: 404
    condition: "the referenced media asset id does not exist"
  - id: ERR_CHANGE_REQUEST_NOT_FOUND
    http: 404
    condition: "the referenced change request id does not exist"
  - id: ERR_SYNDICATION_JOB_NOT_FOUND
    http: 404
    condition: "the referenced syndication job id does not exist"
  - id: ERR_REJECTION_ERROR_NOT_FOUND
    http: 404
    condition: "the referenced rejection error id does not exist"
  - id: ERR_DEPLOYMENT_NOT_FOUND
    http: 404
    condition: "the referenced enhanced-content deployment id does not exist"
  - id: ERR_ALERT_NOT_FOUND
    http: 404
    condition: "the referenced shelf alert id does not exist"
  # --- uniqueness ---
  - id: ERR_DUPLICATE_LISTING
    http: 409
    condition: "a RetailerListing already exists for this (product_id, retailer_id) pair"
  - id: ERR_DUPLICATE_REQUIREMENT
    http: 409
    condition: "a RetailerRequirement already exists for this (retailer_id, attribute_key) pair"
  # --- optimistic concurrency ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "an expected_<parent>_version in the payload does not equal the current version of the named parent row (§1.2.1)"
  # --- state guards ---
  - id: ERR_RETAILER_NOT_ACTIVE
    http: 409
    condition: "the retailer's status is not ACTIVE and the operation writes content, jobs or deployments for it"
  - id: ERR_VERSION_NOT_DRAFT
    http: 409
    condition: "an attribute value is written to a ContentVersion whose state is not DRAFT"
  - id: ERR_CHANGE_REQUEST_NOT_DRAFT
    http: 409
    condition: "submit is called on a change request whose state is not DRAFT"
  - id: ERR_CHANGE_REQUEST_NOT_IN_REVIEW
    http: 409
    condition: "a review is posted against a change request whose state is not IN_REVIEW"
  - id: ERR_TRACK_ALREADY_DECIDED
    http: 409
    condition: "the named review track already holds APPROVED or REJECTED"
  - id: ERR_INVALID_JOB_STATE
    http: 409
    condition: "transmit, retailer-response, requeue or cancel is called from a job state that has no such transition"
  - id: ERR_REJECTION_ERROR_ALREADY_CLOSED
    http: 409
    condition: "resolve is called on a rejection error whose state is RESOLVED or WAIVED"
  - id: ERR_BLOCKING_ERRORS_UNRESOLVED
    http: 409
    condition: "requeue is called while the job still has an OPEN BLOCKING rejection error"
  - id: ERR_DEPLOYMENT_NOT_ACTIVE
    http: 409
    condition: "retailer-decision or withdraw is called on a deployment already in REJECTED or WITHDRAWN (and retailer-decision on a LIVE one)"
  - id: ERR_ALERT_ALREADY_RESOLVED
    http: 409
    condition: "acknowledge or resolve is called on an alert whose state is RESOLVED, or acknowledge on one already ACKNOWLEDGED"
  - id: ERR_LISTING_SHELF_BLOCKED
    http: 409
    condition: "a syndication job or enhanced deployment is created for a listing whose shelf_state is UNAUTHORIZED or SUSPENDED"
  # --- business rules ---
  - id: ERR_PROHIBITED_CLAIM
    http: 422
    condition: "an attribute value on the submitted revision matches a prohibited-claim token of the taxonomy (e.g. CURES, GUARANTEED_RESULTS)"
  - id: ERR_VERSION_NOT_PINNED
    http: 422
    condition: "a syndication job transmits a content version whose state is not PINNED"
  - id: ERR_CHANGE_REQUEST_NOT_APPROVED
    http: 422
    condition: "an enhanced deployment cites a change request whose state is not APPROVED"
  - id: ERR_DEPLOYMENT_SCOPE_MISMATCH
    http: 422
    condition: "the cited change request's (product_id, retailer_id), or the media asset's product_id, does not match the target listing"
  - id: ERR_MEDIA_ASSET_NOT_APPROVED
    http: 422
    condition: "the cited media asset's approval_state is not APPROVED while the retailer requires enhanced-content approval"
  - id: ERR_ATTRIBUTE_LENGTH_EXCEEDED
    http: 422
    condition: "an attribute value's char_count exceeds the effective ceiling (RetailerRequirement.max_chars_override when present, else AttributeDefinition.max_chars)"
  - id: ERR_IMAGE_COUNT_BELOW_MINIMUM
    http: 422
    condition: "transmit is attempted while the revision's image_count is below the retailer's min_image_count"
  - id: ERR_COMPLETENESS_BELOW_THRESHOLD
    http: 422
    condition: "transmit is attempted while the listing's CERTIFIED completeness score is below 85.00"
  - id: ERR_DEPLOYMENT_WINDOW_OVERLAP
    http: 409
    condition: "a new deployment's [window_start, window_end) half-open interval intersects the half-open window of a PENDING_RETAILER_APPROVAL or LIVE deployment on the same listing"
  - id: ERR_FEED_WINDOW_CONFLICT
    http: 409
    condition: "the requested feed window overlaps more non-terminal jobs of the retailer than max_concurrent_feed_windows allows"
  - id: ERR_FEED_CAPACITY_EXCEEDED
    http: 409
    condition: "feed_slots_reserved + slot_count would exceed the retailer's feed_slot_capacity"
  - id: ERR_ATTRIBUTE_KEY_UNKNOWN
    http: 422
    condition: "the attribute_key is absent from the global AttributeDefinition taxonomy"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
# role_model: segregation_of_duties — the requester of a change request may not decide either of
# its review tracks, and the LEGAL and BRAND tracks must be decided by different X-User-IDs.
roles:
  - name: ShelfAdmin
    description: "digital shelf platform operator: owns the retailer roster, the attribute taxonomy, the crawl ingestion feed, and the waiver of blocking feed errors"
    identity: opaque
    exclusive_operations:
      - "POST /digital-shelf/retailers"
      - "PATCH /digital-shelf/retailers/{id}"
      - "POST /digital-shelf/retailers/{id}/requirements"
      - "POST /digital-shelf/attribute-definitions"
      - "POST /digital-shelf/retailer-listings/{id}/observations"
      - "POST /digital-shelf/_clock/set_current_utc"
    shared_operations:
      - "POST /digital-shelf/rejection-errors/{id}/resolve (the only role permitted to WAIVE a BLOCKING row)"
      - "every GET under /digital-shelf"
  - name: ContentAuthor
    description: "brand content author: registers products, drafts content revisions and attribute values, registers rich media, opens listings, raises and submits change requests, and deploys enhanced content"
    identity: opaque
    exclusive_operations:
      - "POST /digital-shelf/products"
      - "POST /digital-shelf/content-versions"
      - "POST /digital-shelf/content-versions/{id}/attribute-values"
      - "POST /digital-shelf/media-assets"
      - "POST /digital-shelf/retailer-listings"
      - "POST /digital-shelf/change-requests"
      - "POST /digital-shelf/change-requests/{id}/submit"
      - "POST /digital-shelf/enhanced-deployments"
      - "POST /digital-shelf/enhanced-deployments/{id}/withdraw"
    shared_operations:
      - "every GET under /digital-shelf"
  - name: LegalReviewer
    description: "regulatory claims reviewer: decides the LEGAL track of a change request and nothing else"
    identity: opaque
    exclusive_operations:
      - "POST /digital-shelf/change-requests/{id}/reviews with track LEGAL"
    shared_operations:
      - "POST /digital-shelf/change-requests/{id}/reviews (shared endpoint, track-partitioned with BrandGovernanceApprover)"
      - "every GET under /digital-shelf"
  - name: BrandGovernanceApprover
    description: "brand governance approver: decides the BRAND track of a change request and nothing else"
    identity: opaque
    exclusive_operations:
      - "POST /digital-shelf/change-requests/{id}/reviews with track BRAND"
    shared_operations:
      - "POST /digital-shelf/change-requests/{id}/reviews (shared endpoint, track-partitioned with LegalReviewer)"
      - "every GET under /digital-shelf"
  - name: SyndicationOperator
    description: "feed operator: queues, transmits, requeues and cancels syndication jobs and resolves rejection errors by fixing content"
    identity: opaque
    exclusive_operations:
      - "POST /digital-shelf/syndication-jobs"
      - "POST /digital-shelf/syndication-jobs/{id}/transmit"
      - "POST /digital-shelf/syndication-jobs/{id}/requeue"
      - "POST /digital-shelf/syndication-jobs/{id}/cancel"
    shared_operations:
      - "POST /digital-shelf/rejection-errors/{id}/resolve (may FIX any row and WAIVE a WARNING row; WAIVE of a BLOCKING row is ShelfAdmin-only)"
      - "every GET under /digital-shelf"
  - name: RetailerIntegration
    description: "retailer-side integration account: confirms or rejects transmitted feeds, and approves rich media and enhanced-content modules for its own listings"
    identity: "entity_backed:Retailer"
    exclusive_operations:
      - "POST /digital-shelf/syndication-jobs/{id}/retailer-response"
      - "POST /digital-shelf/media-assets/{id}/retailer-decision"
      - "POST /digital-shelf/enhanced-deployments/{id}/retailer-decision"
    shared_operations:
      - "every GET under /digital-shelf"
  - name: AccountTeamLead
    description: "retailer account team lead: owns shelf-alert follow-up and the suspend/clear decision on a listing"
    identity: opaque
    exclusive_operations:
      - "POST /digital-shelf/retailer-listings/{id}/shelf-status"
      - "POST /digital-shelf/shelf-alerts/{id}/acknowledge"
      - "POST /digital-shelf/shelf-alerts/{id}/resolve"
    shared_operations:
      - "every GET under /digital-shelf"
